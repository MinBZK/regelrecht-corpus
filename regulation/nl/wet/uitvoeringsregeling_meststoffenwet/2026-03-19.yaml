  - number: 72b
    text: |-
      1 De afstand, bedoeld in [artikel 21, tweede lid, onderdeel d, onder 3°][ref1]en
      [artikel 33a, tweede lid, onderdeel b, onder 3° van de wet][ref2], tussen:

      a. het in België gelegen perceel en de Nederlandse grens bedraagt ten hoogste 25 kilometer;

      b. het in Duitsland gelegen perceel en de Nederlandse grens bedraagt ten hoogste 20 kilometer.

      2 De voorwaarden, [artikel 21, tweede lid, onderdeel d, onder 3°][ref3] en
      [artikel 33a, tweede lid, onderdeel b, onder 3° van de wet][ref4], zijn de voorwaarden, genoemd in
      [artikel 87, eerste lid, onderdelen a en d tot en met f][ref5].


