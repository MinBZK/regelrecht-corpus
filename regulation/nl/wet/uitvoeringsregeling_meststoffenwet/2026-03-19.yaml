  - number: '74'
    text: |-
      1 Als forfaitaire productienormen per melkkoe als bedoeld in [artikel 66, tweede lid, van het besluit][ref1] worden
      voor de naar de gemiddelde melkproductie en naar het gemiddelde ureumgehalte in de geproduceerde melk onderscheiden
      melkkoeien vastgesteld de normen die zijn vermeld in [bijlage D, tabellen IIA en IIB][ref2].

      2 De gemiddelde melkproductie per melkkoe, bedoeld in [artikel 66, tweede lid, van het besluit][ref3], wordt
      bepaald door de hoeveelheid in het desbetreffende kalenderjaar op het bedrijf geproduceerde koemelk te delen door
      het gemiddeld aantal in het desbetreffende kalenderjaar op het bedrijf gehouden melkkoeien.

      3 De totale hoeveelheid in een kalenderjaar op het bedrijf geproduceerde koemelk en het gemiddelde
      ureumgehalte, bedoeld in [artikel 66, tweede lid, van het besluit][ref4], worden vastgesteld overeenkomstig de
      [artikelen 75a tot en met 75d][ref5].

      4 In afwijking van het tweede en het derde lid zijn de gemiddelde melkproductie en het gemiddelde ureumgehalte van
      koemelk van melkkoeien van landbouwers die 50 procent of meer van de op het eigen bedrijf geproduceerde melk zelf
      verwerken tot of verkopen als eindproduct, 7.500 kilogram onderscheidenlijk 26 milligram per 100 gram.

      5 In afwijking van het derde lid is het gemiddelde ureumgehalte in koemelk van melkkoeien van bedrijven die meer
      dan 50 procent van de geproduceerde koemelk leveren aan ondernemingen waar maximaal 500.000 kilogram koemelk per
      jaar wordt verwerkt 26 milligram per 100 gram.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0018989
      [ref3]: https://wetten.overheid.nl/BWBR0019031#Artikel66
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel66
