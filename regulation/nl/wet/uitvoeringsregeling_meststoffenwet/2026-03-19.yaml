  - number: '51'
    text: |-
      1 Behalve de gegevens, bedoeld in [artikel 44, tweede lid, van het besluit][ref1], bevat de administratie van
      de ondernemer in het kader van wiens onderneming diervoeders worden afgeleverd aan een bedrijf met staldieren of
      runderen, bedoeld in [artikel 43, eerste lid, van het besluit][ref2], gegevens over:

      a. de resultaten van de uitgevoerde bemonsteringen en analyses, bedoeld in
      [artikel 98, eerste en tweede lid][ref3]; en

      b. de op het etiket of het begeleidend document, bedoeld in [artikel 99, eerste lid][ref4], vermelde droge
      stofgehalte dan wel het vochtgehalte en het stikstofgehalte en het fosfaatgehalte in de droge stof.

      2 Behalve de gegevens, bedoeld in [artikel 44, vierde lid, van het besluit][ref5], bevat de administratie van
      de ondernemer, bedoeld in [artikel 43, tweede lid, van het besluit][ref6] voor zover hij compost produceert of
      anderszins behandelt, gegevens over:

      a. de hoeveelheid geproduceerde, behandelde compost; en

      b. de gehalten aan droge stof, fosfaat en stikstof, het organisch stofgehalte en de hoeveelheden van de in
      [bijlage II, onder tabel 3, bij het besluit][ref7] opgenomen zware metalen in de compost.

      3 De gegevens, bedoeld in [artikel 44, vijfde lid, onderdeel c, van het besluit][ref8], betreffen de gehalten
      aan droge stof, fosfaat en stikstof, de pH-waarde, het organisch stofgehalte en de hoeveelheden van de in
      [bijlage II, onder tabel 2, bij het besluit][ref9] opgenomen zware metalen in het zuiveringsslib.

      4 Behalve de gegevens, bedoeld in [artikel 44, vierde lid, van het besluit][ref10], bevat de administratie van
      de ondernemer, bedoeld in [artikel 43, tweede lid, van het besluit][ref11] voor zover hij verschillende partijen
      vloeibaar zuiveringsslib waarvoor op grond van [artikel 92b][ref12] een verschillend analysenummer is verstrekt,
      in één opslagruimte opslaat, de hoeveelheden vloeibaar zuiveringsslib die in iedere afzonderlijke opslagruimte zijn
      aangevoerd en de hoeveelheden vloeibaar zuiveringsslib die uit die opslagruimte zijn afgevoerd, zodanig dat steeds
      blijkt welke hoeveelheid vloeibaar zuiveringsslib zich in de opslagruimte bevindt.

      5 De gegevens, bedoeld in het vierde lid, worden bijgehouden op het daartoe door de minister verstrekte
      formulier en worden overgenomen van het op de desbetreffende hoeveelheid betrekking hebbende vervoersbewijs
      zuiveringsslib en compost en op het ter zake door het laboratorium verstrekte overzicht van de analyseresultaten.
      [Artikel 46, tweede en derde lid][ref13], is van overeenkomstige toepassing.

      6 Wijzigingen in de gegevens die de administratie ingevolge [artikel 44 van het besluit][ref14] of het eerste tot
      en met het derde lid bevat, worden binnen 30 dagen na de datum waarop de wijziging zich heeft voorgedaan in de
      administratie opgenomen.

      7 Wijzigingen in de gegevens, die de administratie ingevolge het vierde lid bevat, worden binnen 24 uur na het
      tijdstip waarop de wijziging zich heeft voorgedaan op het in het vijfde lid bedoelde formulier verwerkt.


