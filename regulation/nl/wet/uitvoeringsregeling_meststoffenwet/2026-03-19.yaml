  - number: '119'
    text: |-
      1 De minister verleent ontheffing voor 50% van de uitbreiding met een maximum van 2.500 varkenseenheden of 20.000
      pluimvee-eenheden per ontheffing.

      2 Een landbouwer verwerft de overige varkenseenheden of pluimvee-eenheden die vereist zijn voor de uitbreiding
      uiterlijk op 31 december 2015.

      3 Een landbouwer heeft de uitbreiding niet voor 28 september 2011 gerealiseerd en realiseert de uitbreiding
      uiterlijk 31 december 2015.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel119
  - number: '120'
    text: |-
      Indien het gehele bedrijf ongewijzigd wordt voortgezet door een andere landbouwer gaan de rechten en voorschriften
      verbonden aan de ontheffing op hem over indien partijen zulks ter zake van de registratie van de overgang van het
      op dat bedrijf rustende productierecht aan de minister hebben gemeld. De ontheffing is in andere gevallen niet
      overdraagbaar.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel120
  - number: 120a
    text: De ontheffing wordt verleend tot en met 31 december 2017.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel120a
  - number: '121'
    text: |-
      1 Op ontheffingen die op grond van [artikel 112][ref1] van de Uitvoeringsregeling Meststoffenwet zijn verleend
      voor de datum waarop deze regeling in werking treedt, blijft paragraaf 5 van de Uitvoeringsregeling Meststoffenwet,
      zoals deze luidde op de dag voor inwerkingtreding van deze regeling van toepassing.

      2 De landbouwer aan wie ontheffing op grond van [artikel 112][ref2] van de Uitvoeringsregeling Meststoffen wet
      is verleend voor de datum waarop deze regeling in werking treedt, voldoet tevens aan de voorwaarden van paragraaf
      5 van de Uitvoeringsregeling Meststoffenwet indien hij 100% van de hoeveelheid dierlijke meststoffen van zijn
      bedrijfsoverschot overeenkomstig [artikel 33a, derde lid, onderdeel a of b, van de Meststoffenwet][ref3] laat
      verwerken.

      3 In afwijking van [artikel 119][ref4] van de Uitvoeringsregeling Meststoffenwet zoals dat luidde op de dag voor
      inwerkingtreding van deze regeling, vervallen de ontheffingen, bedoeld in het eerste lid, op 1 januari 2018.


