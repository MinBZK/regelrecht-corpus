  - number: '116'
    text: |-
      1 De minister verdeelt het aantal beschikbare varkenseenheden in de volgorde van rangschikking, waarbij de
      aanvragen, bedoeld in [artikel 114, tweede lid, onderdeel a][ref1], hoger worden gerangschikt dan de aanvragen,
      bedoeld in artikel 114, tweede lid, onderdeel b.

      2 Indien er meer aanvragen voor varkenseenheden worden ingediend dan het aantal, genoemd in
      [artikel 113, eerste lid][ref2], verdeelt de minister het aantal beschikbare varkenseenheden door middel van loting
      tussen de aanvragen die op grond van de rangschikking voor verdeling in aanmerking komen.

      3 De minister verdeelt het aantal beschikbare pluimvee-eenheden in de volgorde van rangschikking, waarbij de
      aanvragen, bedoeld in [artikel 114, tweede lid, onderdeel a][ref3], hoger worden gerangschikt dan de aanvragen,
      bedoeld in artikel 114, tweede lid, onderdeel b.

      4 Indien er meer aanvragen voor pluimvee-eenheden worden ingediend dan het aantal, genoemd in
      [artikel 113, tweede lid][ref4], verdeelt de minister het aantal beschikbare pluimvee-eenheden door middel van
      loting tussen de aanvragen die op grond van de rangschikking voor verdeling in aanmerking komen.


