  - number: '41'
    text: |-
      De landbouwer die in de periode van 16 mei tot en met 31 oktober van een kalenderjaar een perceel landbouwgrond in
      gebruik neemt dat voor deze periode in gebruik was bij een ander bedrijf of een derde, doet hiervan binnen 30 dagen
      melding aan de minister.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel41
  - number: '42'
    text: |-
      1 De landbouwer verstrekt jaarlijks vóór 1 februari aan de minister met betrekking tot het voorgaande kalenderjaar
      gegevens uit de administratie over:

      a. de aan het eind van het kalenderjaar op het bedrijf aanwezige hoeveelheid meststoffen, onderscheiden naar:

      1°. vaste mest;

      2°. drijfmest;

      3°. zuiveringsslib en compost; en

      4°. meststoffen, anders dan dierlijke meststoffen, zuiveringsslib en compost;

      b. de hoeveelheden meststoffen, anders dan dierlijke meststoffen, zuiveringsslib en compost, die op of van het
      bedrijf zijn aangevoerd, onderscheidenlijk zijn afgevoerd;

      c. het gemiddelde aantal in het kalenderjaar op het bedrijf gehouden dieren, anders dan varkens, schapen, geiten
      en runderen, onderscheiden naar diersoort en diercategorieën per soort voor zover dit onderscheid wordt gemaakt in
      [bijlage D, tabel IA][ref1]; en

      d. het aantal aan- of afgevoerde staldieren, anders dan varkens of vleeskalveren, onderscheiden naar diersoort en
      diercategorieën per soort, voor zover dit onderscheid wordt gemaakt in [bijlage D, tabel IA][ref2].

      2 De landbouwer op wiens bedrijf op 31 december 2005 pluimveerechten, varkensrechten of niet-gebonden
      mestproductierechten rustten of wiens bedrijf overeenkomstig [artikel 25, eerste lid][ref3], is aangemeld voor
      toepassing in 2006 van de gebruiksnorm, bedoeld in [artikel 24, eerste lid][ref4], verstrekt vóór 1 februari
      2006 aan de minister gegevens uit de administratie over de op 1 januari 2006 op het bedrijf aanwezige hoeveelheid
      meststoffen, onderscheiden naar meststoffen als bedoeld in het eerste lid, onderdeel a, onder 1° tot en met 4°.

      3 De landbouwer die op het eigen bedrijf koemelk produceert, verstrekt aan de minister gegevens met betrekking tot
      de op het bedrijf geproduceerde hoeveelheid koemelk.

      4 Ingeval van overdracht van een opslagruimte voor meststoffen door een landbouwer aan een intermediair of door een
      intermediair aan een landbouwer, doet de landbouwer hiervan binnen 30 dagen na de overdracht melding.

      5 De landbouwer in het kader van wiens bedrijf mestkorrels worden geproduceerd, verstrekt binnen 30 dagen na afloop
      van elk kwartaal:

      a. een overzicht per kwartaal van welke hoeveelheid mestkorrels, inclusief de gehalten aan stikstof en fosfaat, aan
      welk bedrijf of welke intermediair is geleverd;

      b. de hoeveelheid geëxporteerde mestkorrels inclusief de gehalten aan stikstof en fosfaat;

      c. de hoeveelheid mestkorrels, inclusief de gehalten aan stikstof en fosfaat die aan afnemers niet zijnde een
      bedrijf of intermediaire onderneming zijn geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
