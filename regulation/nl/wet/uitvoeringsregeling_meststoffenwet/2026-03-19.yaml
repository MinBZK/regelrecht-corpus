  - number: '38'
    text: |-
      1 De gegevens, bedoeld in [artikel 32, tweede lid, onderdeel c, van het besluit][ref1], betreffen uitsluitend
      die percelen landbouwgrond die bij het bedrijf in het kader van normale bedrijfsvoering in gebruik zijn en die al
      dan niet gedeeltelijk zijn gelegen in Duitsland of in België, tot 20, onderscheidenlijk tot 25 kilometer uit de
      Nederlandse grens.

      2 De gegevens, bedoeld in [artikel 32, tweede lid, onderdeel e, van het besluit][ref2], worden onderscheiden naar
      diersoorten en diercategorieën per soort overeenkomstig de omschrijvingen in [bijlage D, tabel IA][ref3].

      3 De gegevens, bedoeld in [artikel 32, tweede lid, onderdeel i, van het besluit][ref4], worden per afzonderlijke
      opslagruimte weergegeven.

      4 Indien op een bedrijf ‘covergiste mest’ als bedoeld in [bijlage Aa][ref5], onder IV wordt geproduceerd, worden
      de gegevens, bedoeld in [artikel 33, derde lid, onderdeel c, van het besluit][ref6], onderscheiden naar de tezamen
      met de dierlijke meststoffen vergiste stoffen overeenkomstig de aanduiding en de daarbij behorende omschrijving van
      de desbetreffende stof in [bijlage Aa][ref7], onder IV, en bevat de administratie behalve de gegevens, bedoeld in
      [artikel 33, derde lid, van het besluit][ref8], gegevens over het bedrijf of de onderneming waar de desbetreffende
      stof als reststof is vrijgekomen.


