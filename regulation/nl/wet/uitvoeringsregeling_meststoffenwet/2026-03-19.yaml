    text: |-
      1 De intermediair verstrekt jaarlijks vóór 1 februari aan de minister met betrekking tot het voorgaande
      kalenderjaar gegevens uit de administratie over:

      a. de hoeveelheden meststoffen, anders dan dierlijke meststoffen, zuiveringsslib en compost, die in het kader van
      de onderneming zijn aan- en afgevoerd;

      b.

      c. de aan het eind van het kalenderjaar op de onderneming aanwezige hoeveelheid meststoffen onderscheiden naar
      meststoffen als bedoeld in [artikel 42, eerste lid, onderdeel a, onder 1° tot en met 4°][ref1].

      2 De ondernemer in het kader van wiens onderneming zuiveringsslib wordt geproduceerd of anderszins
      wordt behandeld, verstrekt jaarlijks vóór 1 februari aan de minister gegevens uit de administratie
      over de in het voorgaande kalenderjaar in het zuiveringsslib gemiddeld aanwezige hoeveelheden van de in
      [bijlage II, onder tabel 2, van het besluit][ref2] opgenomen zware metalen.

      3 Het tweede lid is niet van toepassing indien de in het tweede lid bedoelde gegevens zijn verstrekt door het
      laboratorium dat de analyses heeft verricht.

      4 De minister is bevoegd de op grond van het tweede of derde lid verstrekte gegevens door te geven aan gedeputeerde
      staten van de provincie waarbinnen de desbetreffende onderneming is gevestigd.

      5 De intermediair die verschillende partijen vloeibaar zuiveringsslib, waarvoor op grond van [artikel 92b][ref3]
      een verschillend analysenummer is verstrekt, in één opslagruimte opslaat, verstrekt op elektronische wijze aan de
      minister het stikstofgehalte, het fosfaatgehalte en het drogestofgehalte zoals dat voor de in de desbetreffende
      opslag aanwezige hoeveelheid zuiveringsslib met gebruikmaking van het in [artikel 46, eerste lid][ref4], bedoelde
      formulier, of de in artikel 46, tweede lid, genoemde andere gegevensdragers is berekend.

      6 De intermediair in het kader van wiens onderneming substraat wordt geproduceerd, verstrekt binnen 30 dagen na
      afloop van elk kwartaal:

      a. een overzicht per kwartaal van welke hoeveelheid substraat, inclusief de gehalten aan stikstof en fosfaat, aan
      welke champignonteler is geleverd;

      b. de hoeveelheid geëxporteerd substraat inclusief de gehalten aan stikstof en fosfaat.

      7 De intermediair in het kader van wiens onderneming mestkorrels worden geproduceerd, verstrekt binnen 30 dagen na
      afloop van elk kwartaal:

      a. een overzicht per kwartaal van welke hoeveelheid mestkorrels, inclusief de gehalten aan stikstof en fosfaat, aan
      welk bedrijf of welke intermediair is geleverd;

      b. de hoeveelheid geëxporteerde mestkorrels inclusief de gehalten aan stikstof en fosfaat;

      c. de hoeveelheid mestkorrels, inclusief de gehalten aan stikstof en fosfaat die aan afnemers niet zijnde een
      bedrijf of intermediaire onderneming zijn geleverd.

      8 De intermediair in het kader van wiens onderneming een mengsel van vaste meststoffen wordt geproduceerd, dat
      ten hoogste 10% vaste dierlijke meststoffen of 10% champost bevat, verstrekt binnen 30 dagen na afloop van elk
      kwartaal:

      a. een overzicht van welke hoeveelheid meststoffen uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en
      fosfaat, aan welk bedrijf of welke intermediaire onderneming is geleverd;

      b. de hoeveelheid geëxporteerde meststoffen uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en
      fosfaat;

      c. de hoeveelheid meststoffen uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en fosfaat, die aan
      afnemers niet zijnde een bedrijf of intermediaire onderneming is geleverd;

      d. de mestcode dan wel de mestcodes, bedoeld in [bijlage I][ref5], van de desbetreffende mestsoort of mestsoorten
      en de percentages van elke afzonderlijke meststof in het mengsel.


