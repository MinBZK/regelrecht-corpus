  - number: 92b
    text: |-
      1 Het laboratorium, bedoeld in [artikel 92a][ref1], analyseert de monsters uiterlijk vijf werkdagen na ontvangst
      overeenkomstig het protocol, dat is opgenomen in [bijlage Ia, onderdeel A][ref2], of door middel van een methode
      die tenminste dezelfde waarborgen omvat.

      2 Indien dit ten aanzien van het monster overeenkomstig [artikel 92a, zesde lid][ref3], is aangegeven, berekent
      het laboratorium op basis van de meest recente analyseresultaten, het gemiddelde stikstof-, fosfaat- en
      drogestofgehalte over de afgelopen twaalf maanden overeenkomstig de in [bijlage Ia, onderdeel B][ref4], opgenomen
      berekeningsmethode.

      3 Het laboratorium voorziet de analyseresultaten dan wel de overeenkomstig het tweede lid berekende gemiddelde
      gehalten van een uniek analysenummer van ten hoogste twaalf posities.

      4 Indien het monster afkomstig is uit een afzonderlijk geproduceerde partij zendt het laboratorium de
      analyseresultaten uiterlijk tien werkdagen na analyse elektronisch aan de minister en aan de producent van de
      desbetreffende meststof, onder vermelding van het unieke analysenummer, bedoeld in het derde lid.

      5 Indien het monster afkomstig is uit een hoeveelheid die in een continu proces is geproduceerd, zendt het
      laboratorium de in het tweede lid bedoelde gehaltes, uiterlijk tien werkdagen na afloop van de desbetreffende
      kalendermaand elektronisch aan de minister en aan de producent van de desbetreffende meststof, onder vermelding
      van het unieke analysenummer, bedoeld in het derde lid en het unieke analysenummer dat betrekking heeft op het in
      voorgaande kalendermaand met betrekking tot de desbetreffende hoeveelheid berekende gemiddelde.

      6 Het laboratorium bewaart de monsters totdat tien werkdagen na verzending van de analyseresultaten door het
      laboratorium zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel92a
      [ref2]: https://wetten.overheid.nl/BWBR0018989
