  - number: '113'
    text: |-
      1 Het aantal varkenseenheden waarvoor ontheffing kan worden verleend bedraagt 121.622.

      2 Het aantal pluimvee-eenheden waarvoor ontheffing kan worden verleend bedraagt 1.200.000.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel113
  - number: '114'
    text: |-
      1 Een aanvraag voor ontheffing kan worden ingediend in de periode van 5 januari 2015, 9:00 uur, tot 30 januari
      2015, 17:00 uur.

      2 Een aanvraag kan worden ingediend voor:

      a. ontheffing waarbij de varkens of het pluimvee waarop de uitbreiding betrekking heeft worden gehouden in een
      integraal duurzame stal, of

      b. ontheffing waarbij de varkens of het pluimvee waarop de uitbreiding betrekking heeft niet in een integraal
      duurzame stal worden gehouden.

      3 Per bedrijf waarop een productierecht rust, kan maximaal één aanvraag voor een ontheffing voor varkenseenheden en
      maximaal één aanvraag voor een ontheffing voor pluimvee-eenheden worden ingediend.

      4 Een aanvraag die niet compleet is moet uiterlijk op 13 februari 2015 compleet zijn.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel114
  - number: '115'
    text: |-
      1 Een aanvraag voor ontheffing wordt ingediend met gebruikmaking van een middel dat door de minister beschikbaar
      wordt gesteld.

      2 Indien een aanvraag als bedoeld in [artikel 114, tweede lid, onderdeel a][ref1], wordt ingediend en de aanvrager
      met een stalcertificaat als bedoeld in [artikel 117, tweede lid, onderdeel c][ref2], wil aantonen dat de varkens
      of het pluimvee waarop de uitbreiding betrekking heeft in een integraal duurzame stal worden gehouden, gaat de
      aanvraag vergezeld van een kopie van dat stalcertificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel114
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel117
