      1 Als forfaitaire stikstofgehalten als bedoeld in [artikel 67, vijfde lid, van het besluit][ref1]
      worden vastgesteld de gehalten, uitgedrukt in kilogrammen stikstof per dier per jaar, die in
      [bijlage D, tabel IA, kolom D][ref2], voor de onderscheiden diersoorten en diercategorieën en toegepaste
      huisvestingssysteem zijn vermeld.

      2 Voor zover het dieren betreft die worden gehouden op een bedrijf waarvoor een inkennisstelling heeft
      plaatsgevonden als bedoeld in [artikel 2.14, eerste lid, van de Regeling dierlijke producten][ref3], en die behoren
      tot de in [bijlage D, tabel IB, deel 1][ref4], onderscheiden categorieën dieren, zijn in afwijking van het eerste
      lid de normen van toepassing die zijn vermeld in kolom D van die tabel.


