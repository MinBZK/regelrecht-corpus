  - number: 25a
    text: |-
      1 De minister verleent een vergunning, indien de landbouwer tijdig een aanvraag, bedoeld in
      [artikel 25, eerste lid][ref1], heeft gedaan en daarbij de verklaringen, bedoeld in artikel 25, tweede en derde
      lid, heeft gedaan.

      2 De vergunning wordt verleend voor één kalenderjaar.

      3 De vergunning wordt overgedragen ingeval van erfopvolging. De opvolger voldoet aan het bepaalde in deze paragraaf
      en dient de verklaringen in, bedoeld in [artikel 25, tweede en derde lid][ref2].

      4 Onverminderd het derde lid, is de vergunning overdraagbaar ingeval van bedrijfsoverdracht. De betrokken
      landbouwers doen gezamenlijk een verzoek tot wijziging van de tenaamstelling van de vergunning. De landbouwer op
      wiens naam de vergunning komt te staan voldoet aan het bepaalde in deze paragraaf en dient de verklaringen in,
      bedoeld in [artikel 25, tweede en derde lid][ref3].

      5 Geen vergunning wordt verleend aan een landbouwer die voor de tot zijn bedrijf behorende oppervlakte
      landbouwgrond gebruik maakt van een voorziening om runderdrijfmest op een andere wijze aan te wenden dan bepaald in
      [artikel 4.1199 van het Besluit activiteiten leefomgeving][ref4].

      6 Voor zover de tot het bedrijf behorende oppervlakte landbouwgrond die voor het op of in de bodem brengen
      van dierlijke meststoffen beschikbaar is, gelegen is in een Natura 2000-gebied als bedoeld in de bijlage bij
      [artikel 1.1 van de Omgevingswet][ref5] of in een zone van 100 meter rondom een Natura 2000-gebied dat is
      aangewezen in [bijlage Ae][ref6], wordt aan een landbouwer geen vergunning verleend. Voor de toepassing van dit
      lid maakt een perceel landbouwgrond deel uit van dat gebied of van die zone indien het perceel landbouwgrond ten
      minste voor de helft van de oppervlakte daarin gelegen is.

      7 Voor zover de tot het bedrijf behorende oppervlakte landbouwgrond die voor het op of in
      de bodem brengen van dierlijke meststoffen beschikbaar is, gelegen is in een op grond van
      [artikel 7.11 van het Besluit kwaliteit leefomgeving][ref7] bij of krachtens omgevingsverordening aangewezen
      grondwaterbeschermingsgebied, wordt aan een landbouwer geen vergunning verleend. Voor de toepassing van dit lid
      maakt een perceel landbouwgrond deel uit van het grondwaterbeschermingsgebied indien het perceel landbouwgrond ten
      minste voor de helft van de oppervlakte daarin gelegen is.


