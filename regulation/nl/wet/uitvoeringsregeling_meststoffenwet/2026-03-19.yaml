  - number: '25'
    text: |-
      1 In de periode van 3 februari 2025 tot en met 28 februari 2025 van het kalenderjaar waarin de landbouwer de
      gebruiksnormen, bedoeld in [artikel 24, eerste of tweede lid][ref1], voornemens is toe te passen, vraagt de
      landbouwer een vergunning aan bij de Minister voor het op zijn bedrijf mogen toepassen van artikel 24, eerste of
      tweede lid.

      2 Bij de aanvraag verklaart de landbouwer dat hij voldoet aan de voorwaarden in de derogatiebeschikking en
      het bepaalde in deze paragraaf en verklaart hij ermee in te stemmen dat het meststoffengebruik, alsmede het
      bemestingsplan en de mestboekhouding onderwerp kunnen zijn van controle.

      3 Bij de aanvraag verklaart de landbouwer dat hij de gebruiksnormen, bedoeld in [artikel 8 van de wet][ref2], de
      bij of krachtens de [hoofdstukken 5][ref3] en [9][ref4] in samenhang met de [hoofdstukken IV][ref5], [VI][ref6]
      en [X van het besluit][ref7] gestelde regels, het bepaalde bij of krachtens de [artikelen 4.1193][ref8],
      [4.1194][ref9], [4.1199][ref10], [4.1213][ref11], [4.1215][ref12], [4.1216][ref13], [4.1217][ref14] en
      [4.1218 van het Besluit activiteiten leefomgeving][ref15] en de voorschriften die uit hoofde van deze paragraaf aan
      hem worden gesteld naleeft.

      4 De aanvraag, bedoeld in het eerste lid, wordt in behandeling genomen, nadat de landbouwer een bedrag van € 50,-
      heeft voldaan.

      5 De landbouwer betaalt ten behoeve van ’s Rijks kas een geldsom ter dekking van de kosten die samenhangen
      met monitoringswerkzaamheden, bedoeld in artikel 10 van de derogatiebeschikking, ter hoogte van het bij zijn
      oppervlakte landbouwgrond behorende tarief, bedoeld in [Bijlage Ad][ref16]. Bij de aanvraag, bedoeld in het eerste
      lid, stelt de landbouwer door middel van het afgeven van een machtiging tot betaling de minister in staat dit
      bedrag te innen.

      6 De landbouwer kan de aanvraag voor een vergunning voor de toepassing op zijn bedrijf van
      [artikel 24, eerste of tweede lid][ref17], tot 16 mei intrekken, zonder dat de geldsom, bedoeld in het vijfde lid,
      in rekening wordt gebracht.


