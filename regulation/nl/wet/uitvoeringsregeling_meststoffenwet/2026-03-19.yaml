      1 De minister verleent op aanvraag een erkenning aan een laboratorium, indien deze beschikt over een accreditatie
      van de Raad op grond van het accreditatieprogramma AP05, dat is opgenomen in [bijlage H][ref1].

      2 Een erkenning wordt verleend voor onbepaalde tijd.

      3 De beschikking waarmee de erkenning wordt verleend vermeldt ten minste de naam van de instelling en de
      vestigingsplaats van het laboratorium.

      4 Een erkenning is niet overdraagbaar.


