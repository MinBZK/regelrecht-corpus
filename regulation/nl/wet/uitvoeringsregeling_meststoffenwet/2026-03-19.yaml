  - number: '62'
    text: |-
      1 Indien dierlijke meststoffen van een bedrijf worden afgevoerd naar een ander bedrijf, kunnen de
      in een kalenderjaar van het bedrijf afgevoerde dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref1], worden bepaald op basis van de in [bijlage I][ref2], tabel I,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten, onder de
      volgende voorwaarden:

      a. het product van enerzijds het aantal hectaren landbouwgrond dat in dat kalenderjaar tot het bedrijf waarvan
      de meststoffen afkomstig zijn behoort en anderzijds het per hectare van die landbouwgrond bij of krachtens
      [artikel 11, eerste tot en met derde lid, van de wet][ref3], voor dierlijke meststoffen vastgestelde deel van de
      fosfaatgebruiksnorm, bedraagt ten minste 75 procent van de totale hoeveelheid op dat bedrijf in dat kalenderjaar
      geproduceerde dierlijke meststoffen, uitgedrukt in kilogrammen fosfaat;

      b. de van het bedrijf afgevoerde dierlijke meststoffen worden rechtstreeks, zonder tussenopslag, vervoerd; en

      c. de afstand tussen de productielocatie van het bedrijf waarvan de dierlijke meststoffen afkomstig zijn en
      de locatie van het bedrijf waar de dierlijke meststoffen gelost worden bedraagt hemelsbreed ten hoogste tien
      kilometer.

      2 De overeenkomstig het eerste lid te bepalen hoeveelheid bedraagt ten hoogste 25 procent van de totale hoeveelheid
      in dat kalenderjaar op het desbetreffende bedrijf geproduceerde hoeveelheid dierlijke meststoffen, uitgedrukt in
      kilogrammen fosfaat.

      3 De [artikelen 48][ref4], [48b][ref5] en [49 van het besluit][ref6] en de [artikelen 56][ref7],
      [57, eerste lid][ref8], en [59, eerste lid][ref9], zijn niet van toepassing op vervoer van dierlijke meststoffen
      als bedoeld in het eerste lid.

      4 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt bepaald op basis van het
      volume en het soortelijk gewicht van de meststoffen.

      5 In afwijking, van [artikel 59, vierde lid, onderdeel c][ref10], wordt bij de weegmelding het gewicht dat
      overeenkomstig het vierde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte
      gewicht, dan wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte gewicht, en aan rVDM
      gezonden.

      6 De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder
      vermelding van het desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel
      worden vastgelegd en onverwijld aan rVDM worden gezonden.

      7 De vervoerder meldt, indien voor de betreffende mestcodes in de vracht geen forfaitaire gehalten zijn
      vastgesteld, de hoeveelheid fosfaat en stikstof in de betreffende vracht, onder vermelding van het desbetreffende
      rVDM-nummer aan de minister.


