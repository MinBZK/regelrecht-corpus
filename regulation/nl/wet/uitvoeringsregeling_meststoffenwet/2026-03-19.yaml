  - number: '129'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens de [Meststoffenwet][ref1] zijn belast de
      ambtenaren van de Nederlandse Voedsel- en Warenautoriteit.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0004054
  - number: '130'
    text: |-
      De hoogte van de bestuurlijke boete die overeenkomstig [artikel 51 van de Meststoffenwet][ref1] kan worden
      opgelegd, wordt vastgesteld overeenkomstig het bedrag dat in [bijlage M][ref2] voor de desbetreffende overtreding
      is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel130
    references:
      - id: ref1
        bwb_id: BWBR0004054
        artikel: '51'
      - id: ref2
        bwb_id: BWBR0018989
  - number: '131'
    text: |-
      Voor de uitvoering van zijn taken en bevoegdheden op grond van de [Meststoffenwet][ref1] en de [Omgevingswet][ref2]
      voor zover het om het voorkomen of beperken van verontreiniging van de bodem gaat baseert de Minister zich op de
      gegevens van de basiskaart Agrarisch Areaal Nederland voor de grenzen van percelen landbouwgrond.


      [ref1]: https://wetten.overheid.nl/BWBR0004054
      [ref2]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel131
