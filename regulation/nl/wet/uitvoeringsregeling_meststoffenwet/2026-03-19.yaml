  - number: 111a
    text: |-
      1 [Artikel 26, zevende lid, van de Meststoffenwet][ref1] is van toepassing indien wordt voldaan aan de volgende
      voorwaarden:

      a. de mestbehandeling of mestvergisting geschiedt in een installatie die overeenkomstig artikel 23, eerste lid, of
      24, eerste lid, van verordening (EG) nr. 1069/2009 geregistreerd respectievelijk erkend is;

      b. er is een omgevingsvergunning voor het behandelen van dierlijke meststoffen of het vergisten van plantaardig
      materiaal, bedoeld in [artikel 3.226 van het Besluit activiteiten leefomgeving afgegeven][ref2];

      c. de mestbehandeling of mestvergisting van de dierlijke meststoffen geschiedt in een installatie op een naar het
      oordeel van de minister adequate wijze;

      d. de installatie waarin de dierlijke meststoffen worden behandeld of vergist, heeft naar het oordeel van de
      minister voldoende capaciteit om de met de overgang of verplaatsing gemoeide hoeveelheid dierlijke meststoffen te
      behandelen, onderscheidenlijk te vergisten;

      e. de hoeveelheid in een kalenderjaar op het bedrijf geproduceerde dierlijke meststoffen, in verband met de
      overgang of verplaatsing, wordt uiterlijk in het daarop volgende kalenderjaar in de installatie behandeld of
      vergist en uiterlijk in het daarop volgende kalenderjaar worden de eindproducten die bij de mestbehandeling of de
      mestvergisting ontstaan, afgezet;

      f. de geproduceerde hoeveelheid dierlijke mestststoffen, in verband met de overgang of verplaatsing,
      wordt behandeld door middel van mestbehandeling of mestvergisting in een mestbehandelingsinstallatie of
      mestvergistingsinstallatie die behoort tot het bedrijf waarnaar het productierecht, of gedeelte daarvan, zal
      overgaan, of waarbinnen de varkens-, kippen- of kalkoenhouderij zal worden verplaatst;

      g. de eindproducten die bij de mestbehandeling of mestvergisting ontstaan, worden niet binnen de markt voor
      dierlijke mest afgezet;

      h. indien de mestbehandeling of de vergisting van de dierlijke meststoffen niet op een adequate wijze kan
      geschieden als gevolg van een storing van de installatie, doet de landbouwer hiervan binnen drie dagen melding aan
      de minister, en

      i. wijzigingen in de ingevolge [artikel 104][ref3] verstrekte gegevens worden uiterlijk 30 dagen na de datum van
      de wijziging, onder vermelding van het door de minister ter identificatie van het bedrijf verstrekte relatienummer,
      gemeld aan de minister.

      2 Indien niet wordt voldaan aan de voorwaarden, genoemd in het eerste lid, wordt van het op dat bedrijf
      rustende varkensrecht onderscheidenlijk pluimveerecht dat deel buiten beschouwing gelaten dat volgens
      [artikel 26, zevende lid, van de Meststoffenwet][ref4] is overgegaan van een bedrijf dat geheel of gedeeltelijk
      is gelegen buiten dat concentratiegebied naar een bedrijf dat geheel of gedeeltelijk is gelegen binnen het
      concentratiegebied.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0041330#Artikel3.226
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel104
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel26
