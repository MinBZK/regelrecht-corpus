        artikel: '55'
  - number: '70'
    text: |-
      Als eindproduct als bedoeld in [artikel 1, eerste lid, onderdeel dd, onder 1°, van de wet][ref1], voldoet:

      a. as waarin maximaal 10% organische stof aanwezig is;

      b. mestkorrels;

      c. mengsel van gedroogd digestaat en verwerkt categorie 1-materiaal, bedoeld in artikel 8 van verordening (EG)
      nr. 1069/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel1
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel70
