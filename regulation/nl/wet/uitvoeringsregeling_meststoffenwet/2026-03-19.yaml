  - number: '95'
    text: |-
      1 Het gewicht van de op een bedrijf opgeslagen hoeveelheid zuiveringsslib of compost, bedoeld in
      [artikel 68, vierde en vijfde lid, van het besluit][ref1], wordt bepaald op basis van meting van het volume en het
      soortelijk gewicht van deze meststoffen.

      2 Het stikstofgehalte en het fosfaatgehalte in de op een bedrijf opgeslagen hoeveelheid zuiveringsslib of
      compost, bedoeld in [artikel 68, vierde en vijfde lid, van het besluit][ref2] worden bepaald op basis van de best
      beschikbare gegevens.

      3 Het gewicht, onderscheidenlijk het stikstofgehalte en het fosfaatgehalte van de op een onderneming in het
      kader waarvan meststoffen worden verhandeld opgeslagen hoeveelheid zuiveringsslib of compost, bedoeld in
      [artikel 68, vijfde lid, van het besluit][ref3], komen overeen met de onderscheiden hoeveelheden die met
      gebruikmaking van het in [artikel 46, eerste lid][ref4], of [artikel 51, vijfde lid][ref5], bedoelde formulier, of
      de in artikel 46, tweede lid genoemde andere gegevensdragers zijn berekend.

      4 Het gewicht, onderscheidenlijk het stikstofgehalte en het fosfaatgehalte van de op een bedrijf of een onderneming
      in het kader waarvan meststoffen worden verhandeld opgeslagen meststoffen anders dan dierlijke meststoffen,
      zuiveringsslib of compost, bedoeld in [artikel 68, vierde en vijfde lid, van het besluit][ref6], komen overeen met
      het gewicht onderscheidenlijk het stikstofgehalte en het fosfaatgehalte, zoals vermeld op de verpakking van of het
      begeleidende document bij de desbetreffende meststoffen. Ingeval van bulkopslag van de desbetreffende meststoffen
      wordt het gewicht bepaald op basis van meting van het volume en het soortelijk gewicht van deze meststoffen

      5 Onverminderd het eerste tot en met het vierde lid, is de aan het begin van het kalenderjaar opgeslagen
      hoeveelheid in deze leden genoemde meststoffen, gelijk aan de aan het einde van het voorafgaande kalenderjaar
      opgeslagen hoeveelheid in deze leden genoemde meststoffen.


