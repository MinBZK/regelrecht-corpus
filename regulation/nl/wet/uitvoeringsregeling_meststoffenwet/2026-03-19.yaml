      [artikel 69, eerste en derde lid][ref1], en [69d][ref2] bij het vervoer van dierlijke meststoffen, in afwijking
      van het in deze paragraaf bepaalde, toch gebruik wordt gemaakt van een geregistreerde intermediair en de in
