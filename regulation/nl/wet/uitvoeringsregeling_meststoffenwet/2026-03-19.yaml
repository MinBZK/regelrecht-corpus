        artikel: '2.39'
  - number: 75b
    text: |-
      1 Op basis van de vaststelling van een melkcontrolestation berekent een ontvanger van boerderijmelk het gewogen
      gemiddelde ureumgehalte van de leverantie van boerderijmelk van een melkveehouder in een kalenderjaar.

      2 Een ontvanger van boerderijmelk verstrekt de berekening vóór 1 februari van het kalenderjaar dat volgt op het
      kalenderjaar waarop de berekening betrekking heeft aan de minister.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel75b
  - number: 75c
    text: |-
      Het ureumgehalte als bedoeld in de [artikelen 75a][ref1] en [75b, eerste lid][ref2], wordt uitgedrukt in
      milligrammen ureum per 100 gram melk, waarbij de verkregen waarden worden afgerond op hele getallen.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel75a
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel75b
