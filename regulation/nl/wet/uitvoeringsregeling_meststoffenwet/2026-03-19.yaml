      1 Als forfaitaire productienormen als bedoeld in
      [artikel 28, tweede lid, onderdeel b, en vierde lid, van het besluit][ref1], worden voor de onderscheiden
      diersoorten en diercategorieën de normen vastgesteld die zijn vermeld in [bijlage D, tabel IA, kolom A][ref2].

      2 Voor zover het dieren betreft die worden gehouden op een bedrijf waarvoor een inkennisstelling heeft
      plaatsgevonden als bedoeld in [artikel 2.14, eerste lid, van de Regeling dierlijke producten][ref3], en die behoren
      tot de in [bijlage D, tabel IB, deel 1][ref4], onderscheiden categorieën dieren, zijn in afwijking van het eerste
      lid de normen van toepassing die zijn vermeld in kolom A van die tabel.


