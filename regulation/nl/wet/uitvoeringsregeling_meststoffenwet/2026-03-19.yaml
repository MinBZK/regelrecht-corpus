        artikel: '1'
  - number: '71'
    text: |-
      1 Het verwerkingspercentage, bedoeld in [artikel 33a, tweede lid, onderdeel b, van de wet][ref1], bedraagt voor:

      a. het in [bijlage I bij de wet][ref2] als gebied II omschreven gebied: 59 procent;

      b. het in [bijlage I bij de wet][ref3] als gebied I omschreven gebied: 52 procent;

      c. het deel van Nederland dat niet behoort tot de gebieden, bedoeld in de onderdelen a en b: 10 procent.

      2 Indien een bedrijf bestaat uit verschillende productielocaties die zijn gelegen in verschillende gebieden als
      bedoeld in het eerste lid, geldt in een kalenderjaar voor het bedrijf het hoogste verwerkingspercentage.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel33a
      [ref2]: https://wetten.overheid.nl/BWBR0004054
      [ref3]: https://wetten.overheid.nl/BWBR0004054
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel71
    references:
