        artikel: 33a
  - number: 72a
    text: |-
      1 Als categorieën landbouwers als bedoeld in [artikel 21, tweede lid, onderdeel d, onder 2°][ref1] en
      [artikel 33a, tweede lid, onderdeel b, onder 2°, van de wet][ref2] worden aangewezen:

      a. landbouwers die een veehouderijbedrijf exploiteren voor dierlijke productie, als bedoeld in artikel 14 van
      [Verordening (EU) 2018/848](32748R2018) van het Europees Parlement en de Raad van 30 mei 2018 inzake de biologische
      productie en de etikettering van biologische producten en tot intrekking van Verordening (EG) nr. 834/2007 van de
      Raad (PbEU 2018, L 150) en de dierlijke meststoffen overdragen of laten overdragen aan een afnemer die behoort tot
      de categorie afnemers, bedoeld in het tweede lid, onderdeel a;

      b. landbouwers die op hun bedrijf dierlijke meststoffen afkomstig van paarden, pony’s of pluimvee produceren, en
      deze dierlijke meststoffen overdragen of laten overdragen aan een afnemer die behoort tot de categorie afnemers,
      bedoeld in het tweede lid, onderdeel b, waarbij de afvoer, bedoeld in [artikel 69, eerste lid][ref3], tevens wordt
      beschouwd als het overdragen of laten overdragen aan een afnemer die behoort tot de categorie afnemers, bedoeld in
      het tweede lid, onderdeel b.

      2 Als categorieën afnemers als bedoeld in [artikel 21, tweede lid, onderdeel d, onder 2°][ref4] en
      [artikel 33a, tweede lid, onderdeel b, onder 2°, van de wet][ref5] worden aangewezen:

      a. landbouwers die een bedrijf exploiteren voor plantaardige productie, als bedoeld in artikel 12 van [Verordening
      (EU) 2018/848](32748R2018) van het Europees Parlement en de Raad van 30 mei 2018 inzake de biologische productie en
      de etikettering van biologische producten en tot intrekking van [Verordening (EG) nr. 834/2007](32007R0834) van de
      Raad (PbEU 2018, L 150);

      b. ondernemers die champignonsubstraat bereiden.

      3 Een afnemer als bedoeld in het tweede lid, onderdeel b, die in een
      kalenderjaar ingevolge [artikel 21, tweede lid, onderdeel d, onder 2°][ref6] en
      [artikel 33a, tweede lid, onderdeel b, onder 2°, van de wet][ref7], een hoeveelheid dierlijke meststoffen,
      uitgedrukt in kilogrammen fosfaat, ontvangt, gebruikt in het desbetreffende kalenderjaar die hoeveelheid dierlijke
      meststoffen, uitgedrukt in kilogrammen fosfaat, voor de bereiding van champignonsubstraat.

      4 Een landbouwer als bedoeld in het eerste lid, onderdeel a, die gebruik maakt van de
      uitzondering van [artikel 33a, tweede lid, aanhef en onderdeel b, onder 2°][ref8], of
      [artikel 21, tweede lid, aanhef en onderdeel d, onder 2°, van de wet][ref9], is voor de hoeveelheid dierlijke
      meststoffen respectievelijk de hoeveelheid met melkvee geproduceerd fosfaat die hij overdraagt of laat overdragen,
      vrijgesteld van de verplichting, bedoeld in artikel 33a, tweede lid, aanhef, respectievelijk artikel 21, tweede
      lid, aanhef, van de wet, dat in het desbetreffende kalenderjaar te doen.


