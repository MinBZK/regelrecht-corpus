  - number: '4'
    text: |-
      Voor zover zij voldoen aan de [artikelen 9 tot en met 15 van het besluit][ref1] zijn aangewezen:

      a. als afvalstoffen of reststoffen die als meststof kunnen worden verhandeld, de in [bijlage Aa, onder I][ref2],
      opgenomen stoffen;

      b. als afvalstoffen of reststoffen die als meststof kunnen worden verhandeld, de stoffen die behoren tot de in
      [bijlage Aa, onder II][ref3], opgenomen categorieën afvalstoffen of reststoffen;

      c. als afvalstoffen of reststoffen die bij de productie van de daarbij genoemde meststoffen kunnen worden gebruikt,
      de in [bijlage Aa, onder III][ref4], opgenomen stoffen; en

      d. als eindproducten die als meststof kunnen worden verhandeld, de in [bijlage Aa, onder IV][ref5], opgenomen
      eindproducten van de aldaar omschreven bewerkingsprocédés.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel9
