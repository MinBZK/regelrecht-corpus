  - number: '69'
    text: |-
      1 Indien dierlijke meststoffen afkomstig van paarden of pony's van een bedrijf worden afgevoerd naar
      een intermediaire onderneming waar tussenopslag van maximaal 48 uur van deze meststoffen plaatsvindt
      voordat deze meststoffen worden afgevoerd naar een onderneming waar deze meststoffen worden gebruikt
      voor de productie van substraat voor de teelt van champignons of van een grondstof voor de productie
      van dat substraat, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref1], worden bepaald op basis van de in [bijlage I][ref2], tabel II,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      2 Indien de in het eerste lid bedoelde dierlijke meststoffen die in tussenopslag hebben gelegen
      van de intermediaire onderneming worden afgevoerd naar een onderneming waar deze meststoffen worden
      gebruikt voor de productie van het in het eerste lid bedoelde substraat of in het eerste lid bedoelde
      grondstof, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref3], worden bepaald op basis van de in [bijlage I][ref4], tabel II,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      3 Indien dierlijke meststoffen afkomstig van paarden of pony's van een bedrijf worden afgevoerd naar een
      onderneming waar deze meststoffen worden gebruikt voor de productie van substraat voor de teelt van champignons
      of van een grondstof voor de productie van substraat, kan de desbetreffende hoeveelheid dierlijke meststoffen,
      in zoverre in afwijking van [artikel 68, eerste lid, van het besluit][ref5], worden bepaald op basis van
      de in [bijlage I][ref6], tabel II, voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten,
      onderscheidenlijk fosfaatgehalten.

      4 Indien dierlijke meststoffen afkomstig van paarden of pony's tijdens het vervoer worden overgeladen op
      een ander transportmiddel waarna deze meststoffen worden vervoerd naar een onderneming waar deze meststoffen
      worden gebruikt voor de productie van substraat voor de teelt van champignons of van een grondstof voor de
      productie van substraat dan wel worden vervoerd naar een intermediaire onderneming waar tussenopslag van
      maximaal 48 uur van deze meststoffen plaatsvindt voordat deze meststoffen worden afgevoerd naar een hiervoor
      bedoelde onderneming, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref7], worden bepaald op basis van de in [bijlage I][ref8], tabel II,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      5 Indien het in het derde lid bedoelde substraat van een onderneming of een bedrijf wordt afgevoerd naar een
      bedrijf waar dit substraat wordt gebruikt voor de teelt van champignons, kan de desbetreffende hoeveelheid
      dierlijke meststoffen, in zoverre in afwijking van [artikel 68, eerste lid, van het besluit][ref9], worden
      bepaald op basis van de in [bijlage I][ref10], tabel II, voor de desbetreffende mestsoort vermelde forfaitaire
      stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      6 Indien het in het vijfde lid bedoelde substraat in de vorm van champost van een bedrijf wordt afgevoerd
      naar een ander bedrijf, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref11], worden bepaald op basis van de in [bijlage I][ref12], tabel II,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      7 Indien het in het vijfde lid bedoelde substraat in de vorm van champost van een bedrijf wordt
      geëxporteerd, kan de desbetreffende hoeveelheid dierlijke meststoffen, in zoverre in afwijking van
      [artikel 68, eerste lid, van het besluit][ref13], worden bepaald op basis van de in [bijlage I][ref14], tabel II,
      voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten, onderscheidenlijk fosfaatgehalten.

      8 [Artikel 49 van het besluit][ref15] en de [artikelen 56][ref16], [57, eerste lid][ref17], en
      [59, eerste lid][ref18], zijn niet van toepassing op vervoer van dierlijke meststoffen als bedoeld in het eerste,
      tweede, derde en vierde lid.

      9 De [artikelen 48 tot en met 51 van het besluit][ref19] en de [artikelen 53 tot en met 61][ref20] zijn niet van
      toepassing op vervoer van dierlijke meststoffen als bedoeld in het vijfde lid.

      10 De [artikelen 57, eerste lid][ref21], en [59, eerste lid][ref22], zijn niet van toepassing op vervoer van
      dierlijke meststoffen als bedoeld in het zesde en zevende lid.

      11 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste, tweede, derde, vierde,
      vijfde, zesde en zevende lid, wordt bepaald op basis van het volume en het soortelijk gewicht van de meststoffen.

      12 In afwijking, van [artikel 59, vierde lid, onderdeel c][ref23], wordt bij de weegmelding het gewicht dat
      overeenkomstig het elfde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte
      gewicht, dan wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte gewicht, en aan rVDM
      gezonden.

      13 Bij het vervoer van dierlijke meststoffen overeenkomstig het vierde lid draagt de vervoerder er zorg voor dat
      bij de vooraanmelding, bedoeld in [artikel 54, eerste lid][ref24], tevens het kenteken van motorrijtuig, bedoeld
      in [artikel 1, eerste lid, onderdeel c, van de Wegenverkeerswet 1994][ref25], en, indien daarvan afwijkend,
      tevens het kenteken van het getrokken voertuig waarin de vracht mest wordt overgeladen, aan rVDM worden verstrekt.
      De kentekens van het motorrijtuig en het getrokken voertuig waarin wordt overgeladen kunnen worden gewijzigd tot
      het tijdstip van overladen.

      14 Bij het vervoer van dierlijke meststoffen overeenkomstig het eerste, tweede, derde en vierde lid, draagt de
      vervoerder er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder vermelding van het
      desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel worden vastgelegd en
      onverwijld aan rVDM worden gezonden.

      15 De vervoerder meldt in de gevallen, genoemd in het eerste, tweede, derde, vierde, zesde en zevende lid, indien
      voor de betreffende mestcodes in de vracht geen forfaitaire gehalten zijn vastgesteld, de hoeveelheid fosfaat en
      stikstof in de betreffende vracht, onder vermelding van het desbetreffende rVDM-nummer aan de minister.

      16 Het vervoer van dierlijke meststoffen, bedoeld in het vijfde lid, gaat vergezeld van een document dat in ieder
      geval gegevens bevat over:

      a. de naam, het adres en de woonplaats van de leverancier;

      b. het door de minister ter identificatie verstrekte relatienummer van de afnemer;

      c. het gewicht van de hoeveelheid afgeleverd product in tonnen of in kilogrammen; en

      d. het soort product.

      17 Indien naar het oordeel van de minister de juiste naleving van de regels inzake de gewichtsbepaling bij het
      vervoer van dierlijke meststoffen, bedoeld in het zesde en zevende lid, door een vervoerder onvoldoende verzekerd
      is, kan de minister bepalen dat in die gevallen in afwijking van het tiende lid, [artikel 59, eerste lid][ref26],
      gedurende een door hem nader te bepalen periode van toepassing is.

      18 Naleving is in ieder geval onvoldoende verzekerd, indien ten minste één keer door middel van een weging op
      een weegbrug ter controle van het geschatte gewicht door krachtens [artikel 47, eerste lid, van de wet][ref27]
      aangewezen ambtenaren een afwijking van 10% of meer is vastgesteld ten opzichte van het geschatte gewicht.


