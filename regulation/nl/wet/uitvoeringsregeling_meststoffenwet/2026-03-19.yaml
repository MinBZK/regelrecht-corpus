  - number: 110c
    text: |-
      1 Een landbouwer is slechts uitgezonderd indien hij zich daartoe, gelijktijdig met de kennisgeving van het
      vervallen van het fosfaatrecht, bij de Minister aanmeldt.

      2 In afwijking van het eerste lid meldt de landbouwer die geen kennisgeving van het vervallen van een fosfaatrecht
      doet, zich aan uiterlijk op 1 december van het jaar voorafgaand aan het jaar waarin hij voor het eerst van de
      uitzondering gebruik wil gaan maken.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel110c
  - number: 110d
    text: |-
      Indien het bedrijf van een landbouwer die is uitgezonderd in zijn geheel wordt overgedragen aan of samengevoegd met
      het bedrijf van een andere landbouwer, is de landbouwer van het nieuwe bedrijf in het desbetreffende kalenderjaar
      uitsluitend uitgezonderd, indien:

      a. alle bij de totstandkoming van het nieuwe bedrijf betrokken landbouwers voor het desbetreffende kalenderjaar
      voldoen aan de eisen, genoemd in [artikel 110b][ref1], en

      b. in afwijking van [artikel 110c][ref2], de landbouwer van het nieuwe bedrijf zich daartoe binnen dertig dagen
      na de start van het nieuwe bedrijf maar in ieder geval gedurende het desbetreffende kalenderjaar, aanmeldt bij
      de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel110b
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel110c
