  - number: 69i
    text: |-
      Indien de dierlijke meststoffen, bedoeld in de [artikelen 62 tot en met 69][ref1] en [69c][ref2], bestaat uit
      filtraat na mestscheiding of koek na mestscheiding, zijn, in afwijking van het bepaalde in de artikelen 62 tot
      en met 69 en 69c, de [artikelen 48][ref3], [48b][ref4] en [49 van het besluit][ref5] en de [artikelen 56][ref6],
      [57][ref7], [58][ref8] en [59, eerste lid][ref9], onverkort van toepassing op het vervoer van die soorten dierlijke
      meststoffen.


