  - number: 75d
    text: |-
      De minister stelt op basis van de berekening, bedoeld in [artikel 75b, tweede lid][ref1], het gewogen gemiddelde
      ureumgehalte vast van een landbouwer in een kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel75b
