  - number: 69l
    text: |-
      1 Een vooraanmelding en startmelding kan betrekking hebben op alle vrachten dierlijke meststoffen, bedoeld in
      de [artikelen 62 tot en met 64][ref1], [66 tot en met 68][ref2], [69, tweede lid][ref3], en [69c][ref4], die op
      dezelfde dag plaatsvinden indien wordt voldaan aan de volgende voorwaarden:

      a. bij elke vracht dierlijke meststoffen zijn dezelfde leverancier, vervoerder en afnemer betrokken;

      b. de vrachten dierlijke meststoffen hebben betrekking op één mestcode als bedoeld in [bijlage I][ref5], of
      gemengde mest van één of meer diersoorten uit één opslagruimte;

      c. de vrachten dierlijke meststoffen worden vervoerd door hetzelfde voertuig;

      d. het unieke registratienummer, bedoeld in artikel 93, slot, van [verordening (EU) nr. 2016/429](32329R2016), het
      unieke erkenningsnummer, bedoeld in artikel 2, onderdeel 16, van [verordening (EU) nr. 2019/2035](32035R2019), of
      de postcode van de laadplaats is bij elke vracht dierlijke meststoffen gelijk;

      e. de postcode van de losplaats is bij elke vracht dierlijke meststoffen gelijk;

      f. het vervoer vindt niet plaats door een geregistreerde intermediair met behulp van een transportmiddel met op
      diens naam geregistreerde GR-apparatuur; en

      g. de vervoerder die de vracht mest vervoert, kan het betreffende rVDM-nummer tonen.

      2 Ten behoeve van een vooraanmelding als bedoeld in het eerste lid verstrekt de vervoerder:

      a. de gegevens, bedoeld in [artikel 54, eerste lid, onderdelen a, b, c, d, e, g, h, en i][ref6];

      b. het aantal vrachten dat op dezelfde dag wordt verreden naar dezelfde afnemer; en

      c. in afwijking van [artikel 54, eerste lid, onderdeel f][ref7]: het geschatte totale gewicht van alle vrachten,
      bedoeld in onderdeel b.

      3 In afwijking van [artikel 55][ref8], wordt de startmelding enkel gegeven op het moment waarop de eerste vracht
      gereed is om geladen te worden, waarbij artikel 55 van overeenkomstige toepassing.

      4 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid, wordt bepaald op basis van het
      totale volume en het soortelijk gewicht van de meststoffen van alle vrachten tezamen.

      5 In afwijking, van [artikel 59, vierde lid, onderdeel c][ref9], wordt bij de weegmelding het gewicht dat
      overeenkomstig het vierde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte
      totale gewicht van alle vrachten, dan wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte
      totale gewicht, en aan rVDM gezonden.

      6 In afwijking van [artikel 60][ref10] worden de gegevens, met uitzondering van de gegevens betreffende de locatie,
      aan rVDM gezonden, onverwijld na het lossen van enkel de laatste vracht.

      7 De bevestiging door leverancier en afnemer, bedoeld in [artikel 61][ref11], vindt plaats nadat de gegevens,
      bedoeld in het zesde lid, aan rVDM zijn gezonden.

      8 Het rVDM-nummer dat de minister verstrekt, heeft betrekking op elk vervoer dat op dezelfde dag plaatsvindt, onder
      de voorwaarden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel62
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel66
