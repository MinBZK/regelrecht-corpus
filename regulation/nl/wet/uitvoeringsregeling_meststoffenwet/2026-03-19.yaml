  - number: 78q
    text: |-
      De monsternemende organisatie voorziet ieder laboratoriummonster van de gegevens, bedoeld in paragraaf 6 van AP06,
      opgenomen in [bijlage Ea][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel78q
