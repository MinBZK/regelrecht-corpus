  - number: '93'
    text: |-
      1 Het gewicht van de van een bedrijf of onderneming in het kader waarvan meststoffen worden verhandeld afgevoerde,
      de op een bedrijf of onderneming in het kader waarvan meststoffen worden verhandeld aangevoerde en de binnen een
      intermediaire onderneming vervoerde hoeveelheid andere meststoffen dan dierlijke meststoffen, zuiveringsslib of
      compost, bedoeld in [artikel 68, eerste lid, van het besluit][ref1], wordt bepaald door middel van weging met
      behulp van een weegwerktuig.

      2 Het stikstofgehalte en het fosfaatgehalte van de van een bedrijf of onderneming in het kader waarvan meststoffen
      worden verhandeld afgevoerde of de op een bedrijf of intermediaire onderneming aangevoerde en de binnen een
      intermediaire onderneming vervoerde hoeveelheid andere meststoffen dan dierlijke meststoffen, zuiveringsslib
      of compost, bedoeld in [artikel 68, eerste lid, van het besluit][ref2], worden bepaald overeenkomstig
      [artikel 17][ref3] door bemonstering en analyse.

      3 In voorkomend geval geldt dat het gewicht, onderscheidenlijk het stikstofgehalte en het fosfaatgehalte, van de
      in eerste en tweede lid bedoelde meststoffen overeenkomen met het gewicht, onderscheidenlijk het stikstofgehalte
      en het fosfaatgehalte, zoals vermeld op de verpakking van of het begeleidende document bij de desbetreffende
      meststoffen.

      4 [Artikel 68, eerste lid, van het besluit][ref4] in samenhang met het eerste en tweede lid, is niet van toepassing
      op de van een tuincentrum of een hovenier afgevoerde hoeveelheid meststoffen, anders dan dierlijke meststoffen,
      zuiveringsslib of compost, naar een afnemer, niet zijnde een landbouwer of een ondernemer.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0019031#Artikel68
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0019031#Artikel68
