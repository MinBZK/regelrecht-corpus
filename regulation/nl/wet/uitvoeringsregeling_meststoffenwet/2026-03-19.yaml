    text: |-
      1 Wijzigingen in de aantallen op het bedrijf gehouden dan wel anderszins aanwezige varkens, kippen, kalkoenen en
      runderen, worden binnen drie dagen na de datum waarop de wijziging zich heeft voorgedaan, onder vermelding van de
      datum waarop deze wijziging zich heeft voorgedaan, in de administratie opgenomen.

      2 Wijzigingen in de overige gegevens die de administratie ingevolge de [artikelen 32, tweede lid][ref1],
      en[ 33 van het besluit][ref2] en de [artikelen 38][ref3] en [39][ref4] bevat, worden binnen 30 dagen na de
      datum waarop de wijziging zich heeft voorgedaan, onder vermelding van de datum waarop deze wijziging zich heeft
      voorgedaan, in de administratie opgenomen.

      3 In afwijking van het tweede lid, worden wijzigingen in de gegevens, bedoeld in
      [artikel 32, tweede lid, onderdeel f, van het besluit][ref5] uiterlijk de eerstvolgende werkdag na het vervoer in
      de administratie opgenomen.


