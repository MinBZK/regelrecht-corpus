      1 De aanmelding, bedoeld in [artikel 31, eerste lid, van het besluit][ref1], geschiedt binnen 30 dagen na
      inwerkingtreding van deze regeling bij de minister.

      2 Indien een landbouwbedrijf wordt opgericht na 1 januari 2006, geschiedt de aanmelding, bedoeld in het eerste lid,
      uiterlijk 30 dagen na oprichting.

      3 De gegevens, bedoeld in [artikel 31, tweede lid, onderdeel a, van het besluit][ref2], betreffen mede:

      a. het adres van de bedrijfsgebouwen waar dierlijke mest wordt geproduceerd; en

      b. het correspondentieadres van de landbouwer, indien dit afwijkt van het adres, bedoeld in onderdeel a.

      4 Wijzigingen in de ingevolge [artikel 31 van het besluit][ref3] verstrekte gegevens worden uiterlijk 30 dagen na
      de datum van de wijziging, onder vermelding van het door de minister ter identificatie van het bedrijf verstrekte
      relatienummer, gemeld aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel31
