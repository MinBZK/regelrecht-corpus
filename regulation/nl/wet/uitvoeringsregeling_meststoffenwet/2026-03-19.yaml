  - number: 25c
    text: |-
      1 De landbouwer voldoet aan de gebruiksnormen, bedoeld in [artikel 8 van de wet][ref1], en de bij of krachtens de
      [hoofdstukken 5][ref2] en [9][ref3] in samenhang met de [hoofdstukken IV][ref4], [VI][ref5] en [X][ref6] van het
      besluit gestelde regels. Op de tot het bedrijf van de landbouwer behorende oppervlakte landbouwgrond wordt voldaan
      aan het bepaalde bij of krachtens de [artikelen 4.1193][ref7], [4.1194][ref8], [4.1199][ref9], [4.1213][ref10],
      [4.1215][ref11], [4.1216][ref12], [4.1217][ref13] en [4.1218 van het Besluit activiteiten leefomgeving][ref14].

      2 In het kalenderjaar waarin de gebruiksnormen, bedoeld in [artikel 24, eerste en tweede lid][ref15], worden
      toegepast, wordt gedurende de periode van 15 mei tot en met 15 september ten minste tachtig procent van de tot
      het bedrijf behorende oppervlakte landbouwgrond, die voor het op of in de bodem brengen van dierlijke meststoffen
      beschikbaar is, onafgebroken beteeld met gras dat is bestemd om te worden gebruikt als ruwvoer.

      3 De landbouwer gebruikt geen fosfaat uit kunstmest.

      4 De landbouwer verleent desgevraagd zijn medewerking aan monitoringswerkzaamheden als bedoeld in artikel 10 van de
      derogatiebeschikking, in opdracht van de minister of de Minister van Infrastructuur en Waterstaat.

      5 In het kalenderjaar waarin de gebruiksnorm, bedoeld in [artikel 24, tweede lid][ref16], wordt toegepast op
      landbouwgrond gelegen op klei- of veengrond in met nutriënten verontreinigde gebieden wordt, in afwijking van
      [artikel 4.1215, tweede lid, onderdeel a, van het Besluit activiteiten leefomgeving][ref17], de zode van gras
      uitsluitend vernietigd:

      a. in de periode van 1 februari tot en met 10 mei als aansluitend op het vernietigen
      van de zode van gras de teelt van een relatief stikstofbehoeftig gewas als bedoeld in
      [bijlage IVb bij het Besluit activiteiten leefomgeving][ref18] begint;

      b. in de periode van 11 mei tot en met 20 juni als aansluitend op het vernietigen van de zode van gras de teelt van
      een gewas begint; of

      c. in de periode van 21 juni tot en met 31 augustus als aansluitend op het vernietigen van de zode van gras de
      teelt van gras begint.

      6 Indien in de periode van 1 juni tot en met 31 augustus aansluitend op het vernietigen van de zode van gras,
      bedoeld in het vijfde lid, opnieuw gras wordt geteeld, meldt de landbouwer voorafgaand aan het vernietigen de datum
      waarop de zode wordt vernietigd aan de minister.

      7 In het kalenderjaar waarin de gebruiksnorm, bedoeld in [artikel 24, eerste of tweede lid][ref19], wordt toegepast
      is [artikel 28f, eerste lid, aanhef en onderdelen a en b, en tweede lid][ref20], van overeenkomstige toepassing op
      de tot het bedrijf van de landbouwer behorende oppervlakte landbouwgrond gelegen op klei- of veengrond, met dien
      verstande dat:

      a. de vermindering, bedoeld in [artikel 28f, eerste lid, aanhef en onderdeel a][ref21], alleen van toepassing is
      indien de zode van gras wordt vernietigd voor de teelt van maïs;

      b. de vermindering, bedoeld in [artikel 28f, eerste lid, aanhef en onderdeel b][ref22], ook van toepassing is
      indien de zode van gras wordt vernietigd na 31 augustus.

      8 In het kalenderjaar waarin de gebruiksnorm, bedoeld in [artikel 24, tweede lid][ref23], wordt
      toegepast op landbouwgrond gelegen op klei- of veengrond in met nutriënten verontreinigde gebieden zijn
      [artikel 4.1193 van het Besluit activiteiten leefomgeving][ref24] en een op de artikelen 4.1193, vierde lid, van
      het Besluit activiteiten leefomgeving en [19.0 van de Omgevingswet][ref25] gebaseerd besluit van overeenkomstige
      toepassing, met dien verstande dat in afwijking van de daarin genoemde tijdstippen de teelt van een daarin genoemd
      gewas na de teelt van maïs aanvangt.

      9 De landbouwer gebruikt een mestaanwendsysteem met een bemester waarbij drijfmest in strookjes op de bodem wordt
      gebracht uitsluitend indien de buitentemperatuur op het perceel waar de drijfmest wordt aangewend lager is dan
      20° Celsius.

      10 De buitentemperatuur, bedoeld in het negende lid, is de op het moment van gebruik laatst beschikbare
      tien-minutenwaarde van de gemeten temperatuur die het Koninklijk Nederlands Meteorologisch Instituut voor
      de weerstationregio waar het perceel in valt, heeft uitgevaardigd in een algemeen weerbericht, bedoeld in
      [artikel 3, eerste lid, onderdeel a, van de Wet taken meteorologie en seismologie][ref26]. Indien een perceel op
      de grens ligt van weerstationregio’s, geldt de laagste door de desbetreffende weerstations gemeten waarde.

      11 Een weerstationregio, bedoeld in het tiende lid, is de door het Koninklijk Nederlands Meteorologisch Instituut
      bepaalde regio waarvoor de temperatuurwaarden gelden die het in die regio gelegen weerstation van het Koninklijk
      Nederlands Meteorologisch Instituut meet. Het kaartje met de door het Koninklijk Nederlands Meteorologisch
      Instituut bepaalde weerstationregio’s is beschikbaar op de internetpagina van de Nederlandse Voedsel- en
      Warenautoriteit ([www.nvwa.nl](https://www.nvwa.nl/)).

      12 Indien blijkt dat het weerstation van de weerstationregio waar het perceel in valt door storing of andere
      oorzaak geen tien-minutenwaarden beschikbaar stelt, wordt in afwijking van het tiende lid, eerste volzin, uitgegaan
      van de op het moment van gebruik laagste laatst beschikbare tien-minutenwaarde geldend in een aangrenzende
      weerstationregio.


