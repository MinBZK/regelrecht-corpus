  - number: 27b
    text: |-
      Als vaststelling van de fosfaattoestand van de bodem, bedoeld in [artikel 27a, tweede lid][ref1], wordt tevens
      aangemerkt de vaststelling van de fosfaattoestand van de bodem:

      a. die tot en met 31 oktober 2009 is verricht overeenkomstig [artikel 27][ref2] zoals dit artikel luidde op
      31 december 2009; of

      b. bemonstering en analyse van de bodem overeenkomstig het in [bijlage L][ref3] opgenomen protocol met
      uitzondering van de in onderdeel I, paragraaf 1, voorgeschreven vastlegging van de omvang en vorm van het te
      bemonsteren perceel dan wel perceelsdeel met een Global Positioning System, voor zover het monsters betreft die in
      de periode van 1 november 2009 tot 1 januari 2010 uit de desbetreffende bodem zijn genomen.


