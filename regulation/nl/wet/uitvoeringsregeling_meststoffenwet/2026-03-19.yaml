      [bijlage II, onder tabel 2, van het besluit][ref2] opgenomen zware metalen.

      3 Het tweede lid is niet van toepassing indien de in het tweede lid bedoelde gegevens zijn verstrekt door het
      laboratorium dat de analyses heeft verricht.

      4 De minister is bevoegd de op grond van het tweede of derde lid verstrekte gegevens door te geven aan gedeputeerde
