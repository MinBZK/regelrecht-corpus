  - number: 33b
    text: |-
      1 De fosfaatgebruiksnorm voor meststoffen, bedoeld in [artikel 8, onderdeel c, van de wet][ref1] voor grond
      met de fosfaattoestand hoog bedraagt 45 kilogram fosfaat per hectare bouwland of op een bedrijf als bedoeld in
      [artikel 72a, tweede lid, onderdeel a][ref2], 50 kilogram fosfaat per hectare bouwland, indien de landbouwer op de
      desbetreffende percelen ten minste 20 kg fosfaat per hectare toepast die aantoonbaar afkomstig is van één of meer
      van de volgende meststoffen:

      a. strorijke vaste mest van rundvee;

      b. in geval van een bedrijf als bedoeld in [artikel 72a, tweede lid, onderdeel a][ref3], strorijke vaste mest van
      varkens;

      c. strorijke vaste mest van schapen;

      d. strorijke vaste mest van geiten;

      e. strorijke vaste mest van paarden;

      f. dikke fractie van meststoffen van rundvee;

      g. champost;

      h. gft-compost; of

      i. groencompost.’

      2 De landbouwer, bedoeld in het eerste lid, meldt het perceel of gewasperceel waarop de verhoging van de
      fosfaatgebruiksnorm voor meststoffen, bedoeld in het eerste lid, wordt toegepast uiterlijk op 31 december van het
      kalenderjaar waarin de verhoging wordt toegepast aan de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel8
