  - number: '23'
    text: |-
      Het tijdstip, bedoeld in [artikel 77 van het besluit][ref1] bedraagt voor alle meststoffen 1 januari 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel77
