  - number: 78i
    text: |-
      1 De bemonstering van een vracht vaste mest, bestaande uit dikke fractie, vindt plaats overeenkomstig het bepaalde
      in paragraaf 5 van AP06, opgenomen in [bijlage Ea][ref1].

      2 De monsternemende organisatie, bedoeld in [artikel 58, derde lid][ref2], stelt een representatief monster samen
      met een gewicht van minimaal 500 gram en maximaal 800 gram, bestaande uit deelmonsters die evenredig verspreid
      worden genomen uit de betrokken vracht mest, bestaande uit dikke fractie.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
