  - number: 72c
    text: |-
      Als voorwaarden, bedoeld in [artikel 21, tweede lid, onderdeel d, onder 4°][ref1] en
      [artikel 33a, tweede lid, onderdeel e, van de wet][ref2] gelden dat:

      a. het bedrijfsoverschot van de landbouwer in het desbetreffende kalenderjaar maximaal 25% van de totale
      mestproductie van zijn bedrijf in dat jaar bedraagt, en

      b. de overgedragen dierlijke meststoffen direct en zonder tussenopslag op landbouwgrond worden aangewend.


