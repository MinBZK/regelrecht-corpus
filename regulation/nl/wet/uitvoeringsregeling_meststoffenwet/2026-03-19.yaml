  - number: '44'
    text: |-
      De [artikelen 32, tweede lid, onderdelen e, g, en h, van het besluit][ref1] en de [artikelen 40][ref2] en
      [42, eerste lid, onderdelen a en c][ref3], zijn niet van toepassing ten aanzien van de in enig kalenderjaar op
      het bedrijf ingeschaarde schapen, onderscheidenlijk de door deze schapen geproduceerde hoeveelheid dierlijke
      meststoffen, indien ten aanzien van dat bedrijf wordt voldaan aan elk van de volgende voorwaarden:

      a. het aantal in dat kalenderjaar ingeschaarde schapen is niet groter dan 450;

      b. inscharing van de schapen vindt slechts gedurende één aaneengesloten periode van ten hoogste vier weken in het
      kalenderjaar plaats in de periode van 1 januari tot 1 maart of in de periode van 1 oktober tot en met 31 december.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel40
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel42
