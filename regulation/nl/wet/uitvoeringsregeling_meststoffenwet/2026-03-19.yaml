  - number: '43'
    text: |-
      1 De [artikelen 26][ref1] en [31 tot en met 35 van het besluit][ref2] en de [artikelen 37 tot en met 42][ref3]
      zijn niet van toepassing ten aanzien van een bedrijf, indien op elk moment in het desbetreffende kalenderjaar wordt
      voldaan aan elk van de volgende voorwaarden:

      a. de som van de tot dan toe in dat jaar op het bedrijf aangevoerde dierlijke meststoffen en de productie van
      meststoffen door de op dat moment op het bedrijf gehouden dan wel anderszins aanwezige dieren op jaarbasis is ten
      hoogste 350 kilogram stikstof;

      b. de tot het bedrijf behorende oppervlakte landbouwgrond is niet groter dan drie hectare;

      c. het bedrijf beschikt over een uniek nummer als bedoeld in
      [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref4] of een door de minister verstrekt relatienummer in
      het geval dierlijke meststoffen worden aangevoerd op dan wel afgevoerd van het bedrijf.

      2 De [artikelen 32, tweede lid, onderdelen d, e, f en h en 33 van het besluit][ref5] en de
      [artikelen 40, eerste lid][ref6], en [42, eerste lid, onderdelen a, c en d][ref7], zijn niet van toepassing ten
      aanzien van diersoorten als bedoeld in [bijlage D][ref8], tabel IA, waarvan de op enig moment op het bedrijf
      gehouden of anderszins aanwezige dieren tezamen op jaarbasis ten hoogste 350 kilogram stikstof produceren,
      onderscheidenlijk ten aanzien van de door deze dieren geproduceerde hoeveelheid dierlijke meststoffen.

      3 De productie van dierlijke meststoffen op jaarbasis, bedoeld in het eerste lid, onderdeel a, en het tweede
      lid, wordt bepaald op basis van het aantal op het desbetreffende moment gehouden dieren, onderscheiden naar
      diersoorten en diercategorieën per soort, en op basis van de voor de onderscheiden diersoorten en diercategorieën
      in [bijlage D][ref9], tabel IA, kolom B, en tabellen IIA en IIB vermelde forfaitaire productienormen, uitgedrukt in
      kilogrammen stikstof per dier per jaar.

      4 Voor zover het dieren betreft die worden gehouden op een bedrijf waarvoor een inkennisstelling heeft
      plaatsgevonden als bedoeld in [artikel 2.14, eerste lid, van de Regeling dierlijke producten][ref10], en die
      behoren tot de in [bijlage D][ref11], tabel IB, deel 2, onderscheiden categorieën dieren, zijn in afwijking van het
      derde lid de normen van toepassing die zijn vermeld in deel 2 van die tabel.


