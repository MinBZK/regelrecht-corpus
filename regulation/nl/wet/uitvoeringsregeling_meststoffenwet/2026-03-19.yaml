  - number: 28a
    text: |-
      1 De hoeveelheid stikstof, bedoeld in [artikel 28, eerste lid][ref1], wordt voor onderstaande gewassen vermeerderd
      met de hoeveelheid stikstof per hectare van de tot het bedrijf behorende oppervlakte landbouwgrond, voor zover de
      teelt van deze gewassen op kleigrond plaatsvindt:

      a. voor zover het gewas suikerbieten betreft, 15 kilogrammen stikstof, indien de gemiddelde opbrengst van het
      totale areaal suikerbieten dat op het desbetreffende bedrijf op kleigrond werd geteeld, gemeten over de drie aan
      het desbetreffende jaar voorafgaande jaren, ten minste 75 ton per hectare bedroeg;

      b. voor zover het de in [bijlage A][ref2], tabel 5, genoemde consumptieaardappelrassen betreft, 30 kilogrammen
      stikstof, indien de gemiddelde opbrengst van het totale areaal van deze consumptieaardappelrassen dat op het
      desbetreffende bedrijf op kleigrond werd geteeld, gemeten over de drie aan het desbetreffende jaar voorafgaande
      jaren, ten minste 50 ton per hectare bedroeg;

      c. voor zover het gewas wintertarwe betreft, 15 kilogrammen stikstof, indien de gemiddelde opbrengst van het
      totale areaal wintertarwe dat op het desbetreffende bedrijf op kleigrond werd geteeld, gemeten over de drie aan het
      desbetreffende jaar voorafgaande jaren, ten minste 9 ton per hectare bedroeg;

      d. voor zover het gewas zomertarwe betreft, 20 kilogrammen stikstof, indien de gemiddelde opbrengst van het
      totale areaal zomertarwe dat op het desbetreffende bedrijf op kleigrond werd geteeld, gemeten over de drie aan het
      desbetreffende jaar voorafgaande jaren, ten minste 8 ton per hectare bedroeg;

      e. voor zover het gewas wintergerst betreft, 20 kilogrammen stikstof, indien de gemiddelde opbrengst van het
      totale areaal wintergerst dat op het desbetreffende bedrijf op kleigrond werd geteeld, gemeten over de drie aan het
      desbetreffende jaar voorafgaande jaren, ten minste 9 ton per hectare bedroeg;

      f. voor zover het gewas zomergerst betreft, 30 kilogrammen stikstof, indien de gemiddelde opbrengst van het
      totale areaal zomergerst dat op het desbetreffende bedrijf op kleigrond werd geteeld, gemeten over de drie aan het
      desbetreffende jaar voorafgaande jaren, ten minste 7 ton per hectare bedroeg.

      2 De landbouwer die gebruik maakt van de verhoging van de stikstofgebruiksnorm, bedoeld in het eerste lid, voldoet
      aan de volgende voorwaarden:

      a. de landbouwer heeft de afnemers, bedoeld in het derde lid, gemachtigd om desgevraagd gegevens over de afgenomen
      hoeveelheden te verstrekken aan de minister;

      b. de landbouwer heeft het desbetreffende bedrijf uiterlijk op 15 mei van het kalenderjaar waarin gebruik gemaakt
      wordt van de verhoging van de stikstofgebruiksnorm aangemeld bij de minister;

      c. de landbouwer heeft bij de melding, bedoeld in onderdeel b, verklaard dat ten aanzien van het desbetreffende
      bedrijf is voldaan aan het eerste lid, onderdelen a tot en met f, in samenhang met het derde lid, en aan het tweede
      lid, onderdeel a;

      d. de landbouwer als onderdeel van de administratie, bedoeld in [artikel 32 van het besluit][ref3], gegevens
      bewaart waaruit in voorkomend geval ter zake van elk van de drie aan het desbetreffende jaar voorafgaande jaren
      blijkt:

      1°. welke gewassen en rassen op zijn bedrijf werden geteeld;

      2°. het aantal hectaren kleigrond dat met de desbetreffende gewassen en rassen was beteeld;

      3°. de hoogte van de gewasopbrengst; en

      4°. de afnemers van de desbetreffende gewassen.

      3 Voor de bepaling van de gewasopbrengst, bedoeld in het eerste lid, onderdelen a tot en met f, wordt uitsluitend
      in aanmerking genomen de hoeveelheid die door de desbetreffende landbouwer rechtstreeks dan wel door tussenkomst
      van een daartoe gespecialiseerd bedrijf dat zich toelegt op het sorteren van de betreffende gewassen, is afgeleverd
      aan afnemers die de suikerbieten respectievelijk de consumptieaardappelen tot voor menselijke consumptie dan wel
      de gewassen, bedoeld in het eerste lid, onder c tot en met f, tot voor menselijke of dierlijke consumptie geschikte
      producten verwerken.


