    text: |-
      1 Indien dierlijke meststoffen van een bedrijf worden afgevoerd naar een perceel landbouwgrond dat, al dan niet
      gedeeltelijk, is gelegen in Duitsland of in België, kan de desbetreffende hoeveelheid dierlijke meststoffen,
      in zoverre in afwijking van [artikel 68, eerste lid, van het besluit][ref1], worden bepaald op basis van
      de in [bijlage I][ref2], tabel I, voor de desbetreffende mestsoort vermelde forfaitaire stikstofgehalten,
      onderscheidenlijk fosfaatgehalten, onder de volgende voorwaarden:

      a. de totale hoeveelheid dierlijke meststoffen die in een kalenderjaar naar de in het eerste lid bedoelde percelen
      wordt afgevoerd bedraagt, uitgedrukt in kilogrammen fosfaat, ten hoogste het product van het aantal hectaren in
      Duitsland of in België gelegen landbouwgrond en het indien de landbouwgrond in Nederland zou zijn gelegen per
      hectare van die landbouwgrond bij of krachtens [artikel 11, eerste tot en met derde lid, van de wet][ref3], voor
      dierlijke meststoffen vastgestelde deel van de fosfaatgebruiksnorm;

      b. de afstand tussen het in Duitsland of België gelegen perceel en de grens met Nederland bedraagt ten hoogste 20
      onderscheidenlijk 25 kilometer;

      c. het perceel is in het kader van een normale bedrijfsvoering daadwerkelijk bij het bedrijf waarvan de meststoffen
      afkomstig zijn, in gebruik;

      d. indien het perceel in België is gelegen, behoort dit perceel ingevolge eigendom of ingevolge een in België
      geregistreerde pachtovereenkomst toe aan het bedrijf en is dit perceel, voor wat betreft het Vlaamse gedeelte van
      België, geregistreerd bij de Vlaamse Mestbank ingevolge de aangifte op basis van artikel 23, paragraaf 5, onder 6°
      en 7°, van het Mestdecreet; en

      e. indien het perceel in Duitsland is gelegen, behoort dit perceel ingevolge eigendom of ingevolge een in Duitsland
      geregistreerde pachtovereenkomst toe aan het bedrijf.

      2 Indien dierlijke meststoffen worden afgevoerd van een bedrijf dat, al dan niet gedeeltelijk, is gelegen in
      Duitsland of België, naar een perceel landbouwgrond dat is gelegen in Nederland, kan de desbetreffende hoeveelheid
      dierlijke meststoffen, in zoverre in afwijking van [artikel 68, eerste lid, van het besluit][ref4], worden
      bepaald op basis van de in [bijlage I][ref5], tabel I, voor de desbetreffende mestsoort vermelde forfaitaire
      stikstofgehalten, onderscheidenlijk fosfaatgehalten, onder de volgende voorwaarden:

      a. de totale hoeveelheid dierlijke meststoffen die in een kalenderjaar naar de in de aanhef van dit lid bedoelde
      percelen wordt afgevoerd bedraagt, uitgedrukt in kilogrammen fosfaat, ten hoogste het product van het aantal
      hectaren van die percelen en het bij of krachtens [artikel 11, eerste tot en met derde lid, van de wet][ref6], voor
      dierlijke meststoffen vastgestelde deel van de fosfaatgebruiksnorm;

      b. de afstand tussen het in Nederland gelegen perceel en de grens met België onderscheidenlijk de grens met
      Duitsland bedraagt ten hoogste 25 kilometer onderscheidenlijk 20 kilometer;

      c. het perceel is in het kader van een normale bedrijfsvoering daadwerkelijk bij het bedrijf waarvan de meststoffen
      afkomstig zijn, in gebruik; en

      d. het perceel behoort blijkens registratie bij de minister toe aan het bedrijf in België, dan wel Duitsland.

      3 De [artikelen 48][ref7], [48b][ref8] en [49 van het besluit][ref9] en de [artikelen 56][ref10],
      [57, eerste lid][ref11], en [59, eerste lid][ref12], zijn niet van toepassing op vervoer van dierlijke meststoffen
      als bedoeld in het eerste en tweede lid.

      4 Het gewicht van de hoeveelheid dierlijke meststoffen, bedoeld in het eerste lid en tweede lid, wordt bepaald op
      basis van het volume en het soortelijk gewicht van de meststoffen.

      5 In afwijking, van [artikel 59, vierde lid, onderdeel c][ref13], wordt bij de weegmelding het gewicht dat
      overeenkomstig het vierde lid is bepaald, bevestigd, indien dit overeenkomt met het bij de vooraanmelding geschatte
      gewicht, dan wel aangepast, indien dit afwijkt van het bij de vooraanmelding geschatte gewicht, en aan rVDM
      gezonden.

      6 De vervoerder draagt er zorg voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder
      vermelding van het desbetreffende rVDM-nummer, de datum en het tijdstip van het lossen van het transportmiddel
      worden vastgelegd en onverwijld aan rVDM worden gezonden.

      7 De vervoerder meldt, indien voor de betreffende mestcodes in de vracht geen forfaitaire gehalten zijn
      vastgesteld, de hoeveelheid fosfaat en stikstof in de betreffende vracht, onder vermelding van het desbetreffende
      rVDM-nummer aan de minister.


