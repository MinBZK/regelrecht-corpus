    text: |-
      1 De minister kan op aanvraag ontheffing verlenen van het verbod, bedoeld in de [artikelen 19, eerste lid][ref1],
      en [20, eerste lid van de wet][ref2].

      2 De minister kan een ontheffing geheel of gedeeltelijk intrekken indien een houder van een ontheffing niet langer
      voldoet aan de voorwaarden, bedoeld in deze paragraaf.


