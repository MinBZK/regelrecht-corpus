  - number: '29'
    text: |-
      1 Bij de bepaling van de in [artikel 12, tweede lid, van de wet][ref1] bedoelde hoeveelheid meststoffen wordt
      de hoeveelheid stikstof in dierlijke en andere in [bijlage B][ref2] vermelde organische meststoffen slechts in
      aanmerking genomen voor het percentage dat in de tabel van die bijlage is vermeld voor de desbetreffende meststof
      en, indien sprake is van dierlijke meststoffen die op bouwland op kleigrond of veengrond op of in de bodem zijn
      gebracht, voor de desbetreffende periode waarin de meststoffen op of in de bodem zijn gebracht, met dien verstande
      dat het bij de omstandigheid ‘op bedrijf met beweiding’ of ‘op bedrijf zonder beweiding’ vermelde percentage
      uitsluitend geldt indien op het desbetreffende bedrijf de in [bijlage A][ref3], tabel 1, bij ‘grasland met
      beweiden’ onderscheidenlijk ‘grasland met volledig maaien’ vermelde hoeveelheid stikstof als stikstofgebruiksnorm
      wordt toegepast.

      2 Indien het mengsels van organische meststoffen betreft, wordt bij de bepaling van de in
      [artikel 12, tweede lid, van de wet][ref4] bedoelde hoeveelheid meststoffen de hoeveelheid stikstof in dat mengsel
      in aanmerking genomen voor het hoogste percentage dat in [bijlage B][ref5] is vermeld bij de meststoffen die het
      mengsel bevat.


