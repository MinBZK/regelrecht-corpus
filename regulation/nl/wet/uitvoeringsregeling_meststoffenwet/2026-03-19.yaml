  - number: 25b
    text: |-
      1 De minister kan een vergunning intrekken, indien de landbouwer niet voldoet aan het bepaalde in deze paragraaf.

      2 De minister trekt een vergunning voorts in, indien de landbouwer dit verzoekt.

      3 Indien de minister de vergunning voor een bepaald kalenderjaar heeft ingetrokken op grond van het eerste lid,
      is de landbouwer voor het daaropvolgende kalenderjaar uitgesloten van het kunnen doen van een aanvraag, bedoeld in
      [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel25
