  - number: '97'
    text: |-
      1 De ondernemer in het kader van wiens onderneming diervoeders worden afgeleverd aan een bedrijf met staldieren of
      runderen, bedoeld in [artikel 43, eerste lid, van het besluit][ref1]:

      a. bepaalt het gewicht van de desbetreffende hoeveelheid diervoeders door middel van weging met behulp van een
      weegwerktuig; en

      b. stelt het stikstofgehalte, het fosfaatgehalte en indien van toepassing het droge stofgehalte in de
      desbetreffende hoeveelheid diervoeders vast overeenkomstig [artikel 98][ref2].

      2 Indien het ruwvoer en enkelvoudig diervoeder zoals vermeld in [bijlage J][ref3] betreft, kunnen in afwijking van
      het eerste lid, het gewicht worden bepaald op basis van meting van het volume en het soortelijk gewicht van deze
      diervoeders en kunnen als het stikstofgehalte en het fosfaatgehalte worden vastgesteld het stikstofgehalte en het
      fosfaatgehalte per kilogram diervoeder, die voor de onderscheiden soorten ruwvoer of enkelvoudig diervoeder zijn
      vermeld in [bijlage J][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel98
      [ref3]: https://wetten.overheid.nl/BWBR0018989
