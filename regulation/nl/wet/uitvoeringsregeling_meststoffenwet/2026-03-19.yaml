  - number: '3'
    text: |-
      Als grond waarop bosbouw wordt uitgeoefend die aan bij ministeriële regeling gestelde regels voldoet als
      bedoeld in [artikel 1, eerste lid, onderdeel g, van de wet][ref1] wordt aangemerkt grond met een houtopstand
      die valt onder [artikel 11.111, tweede lid, aanhef en onder i, van het Besluit activiteiten leefomgeving][ref2]
      of maatwerkregels of maatwerkvoorschriften als bedoeld in [artikel 11.117][ref3] respectievelijk
      [artikel 11.119 van het Besluit activiteiten leefomgeving][ref4].


