    text: |-
      1 Als forfaitaire stikstofgehalten en fosfaatgehalten per dier of per kilogram levend gewicht als bedoeld in
      [artikel 67, derde lid, van het besluit][ref1] worden voor de onderscheiden diersoorten en diercategorieën
      vastgesteld, de forfaitaire gehalten die zijn vermeld in [bijlage D, tabel III][ref2].

      2 De bepaling van de hoeveelheden stikstof en fosfaat in staldieren, bedoeld in
      [artikel 67, derde lid, van het besluit][ref3], wordt gebaseerd op de in het eerste lid bedoelde forfaitaire
      stikstofgehalten en fosfaatgehalten per kilogram levend gewicht. Ingeval van een dier geen gegevens over het
      gewicht beschikbaar zijn, worden de hoeveelheden stikstof en fosfaat in dat dier bepaald op basis van de in het
      eerste lid bedoelde forfaitaire stikstofgehalten en fosfaatgehalten per dier.


