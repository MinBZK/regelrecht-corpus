  - number: '28'
    text: |-
      1 Als hoeveelheid stikstof als bedoeld in [artikel 10, eerste lid, van de wet][ref1] wordt vastgesteld de
      hoeveelheid stikstof die in [bijlage A, tabel 1][ref2], bij het desbetreffende gewas onder het desbetreffende
      jaar is vermeld, uitgedrukt in kilogrammen stikstof per hectare van de tot het bedrijf behorende oppervlakte
      landbouwgrond, zoals deze in voorkomend geval is onderscheiden naar de grondsoort van het perceel waarop de
      teelt plaatsvindt, het aantal voorafgaande teelten van hetzelfde gewas in het desbetreffende jaar, de in het
      desbetreffende jaar aan de betrokken teelt voorafgaande of op de betrokken teelt volgende teelt van andere
      gewassen, het tijdstip waarop het desbetreffende perceel is beteeld, alsmede de bij de teelt toegepaste
      landbouwpraktijk, met dien verstande dat:

      a. de hoeveelheid stikstof die bij ‘tijdelijk grasland’ en bij ‘groenbemesters’ is vermeld, niet geldt voor
      tijdelijk grasland dat wordt, onderscheidenlijk groenbemesters die worden geteeld aansluitend op de teelt van maïs;

      b. de hoeveelheid stikstof die onder de gewasgroep ‘groenbemesters’ bij ‘Graszaadstoppel ter vernietiging in najaar
      of vroege voorjaar’ is vermeld, uitsluitend van toepassing is indien de groenbemester:

      1°. wordt geteeld vóór 16 september en is geploegd na 1 december, voor zover de groenbemester wordt geteeld op
      zand-, löss- of veengrond;

      2°. wordt geteeld vóór 16 september en aantoonbaar ten minste acht weken wordt geteeld alvorens te worden geploegd,
      voor zover de groenbemester wordt geteeld op kleigrond; of

      3°. gedurende een periode van ten minste tien weken wordt geteeld in het groeiseizoen en aansluitend daarop een
      volggewas wordt geteeld.

      c. de hoeveelheid stikstof die onder de gewasgroep ‘groenbemesters’ bij ‘Niet-vlinderbloemige groenbemesters’ is
      vermeld, uitsluitend van toepassing is indien de niet-vlinderbloemige groenbemester voor 1 september aansluitend
      op de teelt van granen, graszaad of koolzaad wordt geteeld en niet voor 1 februari van het daarop volgende
      kalenderjaar wordt vernietigd;

      d. de hoeveelheid stikstof die bij ‘Consumptieaardappelen Vroeg’ is vermeld, uitsluitend geldt indien het loof voor
      15 juli van het desbetreffende jaar wordt vernietigd;

      e. de hoeveelheid stikstof die bij ‘Pootaardappelen Uitgroeiteelt’ is vermeld, uitsluitend geldt indien het loof na
      15 augustus van het desbetreffende jaar wordt vernietigd;

      f. de hoeveelheid stikstof die onder ‘lössgrond’ is vermeld, uitsluitend geldt indien het grond betreft die is
      ontstaan in eolisch materiaal en binnen 80 cm van het maaiveld voor meer dan de helft bestaat uit leem met een
      kleinere fractie dan 50 µm; en

      g. de hoeveelheid stikstof per hectare die in de tabel is vermeld, wordt verminderd met 20 procent bij teelt op
      landbouwgrond in een met nutriënten verontreinigd gebied.

      2 De hoeveelheid stikstof per hectare, bedoeld in het eerste lid, onderdeel g, wordt rekenkundig afgerond op hele
      kilogrammen.

      3 Indien het gewogen gemiddelde van de hoeveelheid stikstof van alle op de tot een bedrijf behorende oppervlakte
      landbouwgrond geteelde gewassen of gewasgroepen uit [Bijlage A, tabel 1][ref3], in een kalenderjaar ten minste
      100 kilogram en ten hoogste 110 kilogram stikstof per hectare is, bedraagt de hoeveelheid stikstof, bedoeld in
      [artikel 10, eerste lid, van de wet][ref4] in het desbetreffende kalenderjaar, in afwijking van het eerste lid, 110
      kilogram stikstof per hectare van de tot dat bedrijf behorende oppervlakte landbouwgrond.


