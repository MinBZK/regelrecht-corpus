  - number: 110e
    text: |-
      1 Indien een landbouwer heeft gemeld dat hij met zijn bedrijf gebruik wil maken van de uitzondering en nadien
      een fosfaatrecht op grond van [artikel 23, derde tot en met zesde en negende lid, van de wet][ref1] ten
      aanzien van het bedrijf wordt vastgesteld, is hij slechts uitgezonderd indien onverwijld een kennisgeving
      van het met onmiddellijke ingang vervallen van dit fosfaatrecht wordt geregistreerd overeenkomstig
      [artikel 31, tweede lid, van de wet][ref2].

      2 Indien een landbouwer heeft gemeld dat hij met zijn bedrijf gebruik wil maken van de uitzondering en nadien
      een hoger fosfaatrecht op grond van [artikel 23, derde tot en met zesde en negende lid, van de wet][ref3] ten
      aanzien van het bedrijf wordt vastgesteld dan voor die melding was vastgesteld, is hij slechts uitgezonderd indien
      onverwijld een kennisgeving van het met onmiddellijke ingang vervallen van deze verhoging wordt geregistreerd
      overeenkomstig [artikel 31, tweede lid, van de wet][ref4].

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op een fosfaatrecht dat wordt vastgesteld ten
      aanzien van een ander bedrijf waarvan de landbouwer bestuurder is.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel23
