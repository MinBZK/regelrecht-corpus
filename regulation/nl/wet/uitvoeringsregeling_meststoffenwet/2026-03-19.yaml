  - number: 103d
    text: |-
      1 De gewasopbrengst in een kalenderjaar wordt bepaald door de hoeveelheid van het gewas die in dat jaar is geoogst
      van de met het desbetreffende gewas beteelde oppervlakte tot het bedrijf behorende landbouwgrond, te verminderen
      met het door de afnemer van het desbetreffende gewas vastgestelde tarragewicht.

      2 De gewasopbrengst wordt uitgedrukt in tonnen per hectare per jaar.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel103d
  - number: '104'
    text: |-
      1 De kennisgeving van overgang en de kennisgeving van bedrijfsoverdracht, bedoeld in
      [artikel 27, eerste lid][ref1], respectievelijk [artikel 33, derde lid, van de wet][ref2] geschieden bij de
      minister.

      2 Bij de kennisgeving van overgang worden door partijen in ieder geval de volgende gegevens verstrekt:

      a. de door de minister ter identificatie van het bedrijf verstrekte relatienummers;

      b. het aantal varkenseenheden, pluimvee-eenheden, of kilogrammen fosfaat waarop de kennisgeving betrekking heeft;

      c. het gedeelte van het productierecht, dat in het desbetreffende kalenderjaar op het bedrijf van de vervreemder
      niet wordt benut voor het houden van dieren;

      d. voor zover nodig voor de toepassing van een uitzondering als bedoeld in [artikel 32, tweede of derde lid][ref3],
      respectievelijk [artikel 32a, tweede of derde lid, van de wet][ref4], gegevens over de aard van de overgang van
      het productierecht.

      3 Bij de kennisgeving van bedrijfsoverdracht worden door partijen in ieder geval de volgende gegevens verstrekt:

      a. de door de minister ter identificatie van het bedrijf verstrekte relatienummers van de belanghebbenden betrokken
      bij de bedrijfsoverdracht;

      b. het bij de bedrijfsoverdracht betrokken productierecht, uitgedrukt in aantal varkenseenheden, pluimvee-eenheden
      of kilogrammen fosfaat;

      c. het gedeelte van het betreffende productierecht dat na het moment van de bedrijfsoverdracht op elk van de
      bedrijven blijft dan wel komt te rusten;

      d. over de aard van de bedrijfsoverdracht, bedoeld in [artikel 33, tweede lid, van de wet][ref5];

      e. gegevens over het moment van de bedrijfsoverdracht;

      f. voor zover nodig voor de toepassing van een uitzondering als bedoeld in
      [artikel 33, vijfde lid, van de wet][ref6], gegevens over de aard van de bedrijfsoverdracht.

      4 Voor de toepassing van [artikel 26, zevende lid, van de Meststoffenwet][ref7] worden bij de kennisgeving van
      overgang tevens de volgende gegevens verstrekt:

      a. een civielrechtelijke titel die het exclusieve gebruiksgenot verschaft van de installatie waarin de
      mestbehandeling of mestvergisting plaatsvindt;

      b. de aard en de capaciteit van de installatie waarin de mestbehandeling of mestvergisting plaatsvindt;

      c. de wijze en het moment waarop de dierlijke meststoffen worden vergist of behandeld en de techniek van de bij de
      mestbehandeling of mestvergisting gebruikte systemen;

      d. een volledige beschrijving van het mestbehandelingproces of mestvergistingsproces;

      e. de hoeveelheid en de aard van de dierlijke meststoffen die zullen worden behandeld;

      f. een beschrijving van de eindproducten die bij de mestbehandeling of mestvergisting ontstaan en het moment waarop
      de eindproducten worden afgezet;

      g. gegevens of bescheiden op grond waarvan is verzekerd dat de producten, bedoeld in onderdeel f, worden afgezet
      buiten de markt voor dierlijke mest, en

      h. een afschrift van de omgevingsvergunning voor het behandelen van dierlijke meststoffen of het vergisten van
      plantaardig materiaal, bedoeld in [artikel 3.226 van het Besluit activiteiten leefomgeving][ref8].

      5 Indien een productierecht afkomstig is van een bedrijf dat het later gedurende hetzelfde kalenderjaar
      terugontvangt, kan de kennisgeving van overgang, bedoeld in [artikel 27, eerste lid, van de wet][ref9], worden
      gedaan door de overgang van het productierecht naar het bedrijf dat het productierecht ontvangt, gelijktijdig te
      melden met de overgang van het productierecht terug naar het bedrijf waarvan het productierecht afkomstig is.

      6 In afwijking van het vijfde lid, wordt de kennisgeving van overgang, bedoeld in [artikel 32, vierde lid][ref10],
      respectievelijk [artikel 32a, derde lid, van de wet][ref11], gedaan door de overgang van het productierecht naar
      het bedrijf dat het productierecht ontvangt, gelijktijdig te melden met de overgang van het productierecht terug
      naar het bedrijf waarvan het productierecht afkomstig is.


