  - number: '77'
    text: |-
      1 Het bepalen van het gewicht, bedoeld in [artikel 59, eerste lid][ref1], geschiedt door middel van weging met
      behulp van een weegwerktuig.

      2 Het bepalen van het gewicht geschiedt rechtstreeks of op zodanige wijze dat daarbij het gewicht van het
      transportmiddel of van de container buiten beschouwing blijft. Indien de gewichtsbepaling plaatsvindt door weging
      op een weegbrug wordt per vracht dierlijke meststoffen het gewicht van het geladen transportmiddel verminderd met
      het gewicht van het ledige transportmiddel zoals dat direct voorafgaande aan het vervoer is bepaald. Indien een
      vracht dierlijke meststoffen wordt afgevoerd of aangevoerd in een container, kan het gewicht van die meststoffen
      worden bepaald door het gewicht van de gevulde container te verminderen met het gewicht van de lege container dat
      eenmalig is bepaald en dat duidelijk zichtbaar en niet verwijderbaar op de container is aangebracht.

      3 De vervoerder beschikt over een door een of meer weegwerktuigen gegenereerd bewijs van bepaling van het gewicht
      van de vracht dierlijke meststoffen, dat gedurende het vervoer van de betreffende vracht in het transportmiddel
      aanwezig is en de volgende gegevens bevat:

      a. datum en tijdstip van de gewichtsbepaling; en

      b. identificatie van het weegwerktuig.

      4 In het geval de gewichtsbepaling plaatsvindt door weging op een weegbrug bevat het bewijs van de
      gewichtsbepaling, naast de in het vorige lid genoemde gegevens, ook het kenteken van het betreffende
      transportmiddel.

      5 De vervoerder bewaart de bewijsstukken, bedoeld in het derde en vierde lid, na het vervoer als onderdeel van
      zijn administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel59
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel77
