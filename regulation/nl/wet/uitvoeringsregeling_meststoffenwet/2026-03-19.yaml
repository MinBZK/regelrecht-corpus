  - number: 69y
    text: |-
      1 De vervoerder van een vracht zuiveringsslib of compost verstrekt uiterlijk tien werkdagen na het vervoer de
      leverancier en de afnemer een afschrift van het op die vracht betrekking hebbende vervoersbewijs.

      2 De op het vervoersbewijs zuiveringsslib en compost ingevulde gegevens worden door de vervoerder uiterlijk tien
      werkdagen na het vervoer van de vracht zuiveringsslib of compost op elektronische wijze bij de minister ingediend.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel69y
  - number: 69z
    text: |-
      1 In afwijking van [artikel 55, zevende lid, van het besluit][ref1], kunnen de leverancier of de afnemer, de
      vervoerder ter zake van de ondertekening van het vervoersbewijs zuiveringsslib en compost machtigen onder de
      volgende voorwaarden:

      a. de machtiging geschiedt voordat het vervoer van de vracht waarop de machtiging betrekking heeft plaatsvindt;

      b. er wordt een schriftelijk bewijsstuk van de machtiging opgemaakt dat door de betrokken partijen is ondertekend
      en dat in ieder geval de datum en de duur van de machtiging en de door de minister ter identificatie van de
      bedrijven of ondernemingen van de betrokken partijen verstrekte relatienummers bevat; en

      c. een afschrift van het bewijsstuk van de machtiging, bedoeld in onderdeel b, wordt tijdens het vervoer van de
      vracht waarop de machtiging betrekking heeft desgevraagd aan een ambtenaar als bedoeld in [artikel 129][ref2]
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel129
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel69z
