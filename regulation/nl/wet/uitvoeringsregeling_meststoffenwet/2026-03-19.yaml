    text: |-
      Een landbouwer die een verhoging van een stikstofgebruiksnorm toepast als bedoeld in
      [artikel 28a, eerste lid][ref1], kan niet tevens een verhoging van de stikstofgebruiksnorm toepassen, bedoeld in
      [artikel 28c, eerste lid][ref2].


