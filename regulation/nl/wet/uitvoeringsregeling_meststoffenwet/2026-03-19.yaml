    text: |-
      1 Het vervoer van dierlijke meststoffen vindt uitsluitend plaats indien de GR-apparatuur adequaat functioneert
      en voldoet aan de prestatiekenmerken die zijn vermeld in [bijlage E][ref1], onderdeel D, en voor zover de GR-
      apparatuur, bedoeld in bijlage E, onderdeel D, onder 4, behoort tot een type waarvan bij keuring door Livestock
      Research, onderdeel van Wageningen UR, te Wageningen is vastgesteld dat het voldoet aan die prestatiekenmerken.

      2 In aanvulling op het eerste lid, vindt het vervoer van drijfmest uitsluitend plaats indien de automatische
      bemonsterings- en verpakkingsapparatuur zowel afzonderlijk als in onderlinge samenhang met de GR-apparatuur
      adequaat functioneert.

      3 Het eerste en het tweede lid zijn niet van toepassing indien een storing van de apparatuur van een intermediair
      op een transportmiddel gedurende het vervoer van dierlijke meststoffen is ontstaan en door de vervoerder terstond
      elektronisch is gemeld aan rVDM.

      4 Het transportmiddel waarvoor een melding als bedoeld in het derde lid is gedaan, wordt na afloop van het
      betreffende vervoer van dierlijke meststoffen niet voor het vervoer van een nieuwe vracht dierlijke meststoffen
      gebruikt zolang de melding, bedoeld in het derde lid, niet met toestemming van de minister door de vervoerder is
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
