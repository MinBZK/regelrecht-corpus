  - number: 69r
    text: |-
      1 Indien en voor zover sprake is van een uitzonderlijke situatie waarin de software-applicatie, bedoeld in
      [artikel 69m][ref1], naar het oordeel van de minister niet toereikend is, worden de gegevens met betrekking tot het
      vervoer vermeld op een daartoe door de minister beschikbaar gesteld middel.

      2 In de volgende situaties is de software-applicatie, bedoeld in [artikel 69m][ref2], naar het oordeel van de
      minister in ieder geval niet toereikend:

      a. de door de minister of door een andere partij beschikbaar gestelde software-applicatie, bedoeld in
      [artikel 69o, eerste lid][ref3], functioneert niet naar behoren;

      b. het besturingssysteem van de door de minister of door een andere partij beschikbaar gestelde software-
      applicatie, bedoeld in [artikel 69o, eerste lid][ref4], functioneert niet naar behoren;

      c. voor de door de minister of door een andere partij beschikbaar gestelde software-applicatie, bedoeld in
      [artikel 69o, eerste lid][ref5], is een update vereist en deze kan door een storing in het externe updatemiddel
      niet plaatsvinden;

      d. er zijn geen rVDM-nummers beschikbaar die benodigd zijn bij het gebruik van de applicatie.

      3 Ingeval een door een andere partij beschikbaar gestelde software-applicatie wordt gebruikt en een situatie,
      bedoeld in het tweede lid, doet zich voor, gelden de volgende beperkingen: voor het gebruik van het middel, bedoeld
      in het eerste lid:

      a. enkel gedurende de dag waarop deze software-applicatie niet naar behoren functioneert en de volgende werkdag mag
      gebruik worden gemaakt van het middel, bedoeld in het eerste lid;

      b. indien na de periode, genoemd in onderdeel a, de betreffende software-applicatie nog steeds niet naar behoren
      functioneert, wordt ofwel gebruik gemaakt van de door de minister beschikbaar gestelde software-applicatie, ofwel
      van een door een andere dan de oorspronkelijke partij beschikbaar gestelde applicatie.

      4 In aanvulling op het tweede lid, kan de minister in concrete gevallen besluiten dat de software-applicatie,
      bedoeld in [artikel 69m][ref6], niet toereikend is.


