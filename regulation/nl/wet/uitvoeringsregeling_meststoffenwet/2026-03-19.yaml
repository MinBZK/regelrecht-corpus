  - number: 28b
    text: |-
      1 In afwijking van [artikel 28][ref1] bedraagt de hoeveelheid stikstof, bedoeld in
      [artikel 10, eerste lid, van de wet][ref2] op bouwland voor een gewasperceel 125 procent van de hoeveelheid
      stikstof die in [bijlage A, tabel 1][ref3], voor de desbetreffende grondsoort bij het desbetreffende gewas onder
      het desbetreffende jaar is vermeld, indien voor dat betreffende gewasperceel:

      a. de betrokken landbouwer schade leidt of dreigt te leiden uit opbrengstderving of kwaliteitsverlies, veroorzaakt
      door het optreden van een neerslaghoeveelheid die uitgaat boven 50 millimeter in de 24 uur na 08.00 uur of 60
      millimeter in de 48 uur na 08.00 uur;

      b. de te verwachten financiële opbrengst van het betreffende gewasperceel zonder bijbemesting tenminste 25 procent
      lager is;

      c. neerslag en opbrengstderving in een rapport door een geregistreerd schade-expert zijn bevestigd, waarin ook
      melding gemaakt wordt van ligging en areaal van het betreffende gewasperceel;

      d. de hoeveelheid stikstof die boven 100 procent van de in [bijlage A, tabel 1][ref4], genoemde hoeveelheid
      uitgaat, wordt toegediend in de vorm van anorganische meststoffen;

      e. de landbouwer het voornemen tot bijbemesting vooraf heeft gemeld bij de minister;

      f. de landbouwer bij de melding, bedoeld in onderdeel e, heeft verklaard dat ten aanzien van het desbetreffende
      bedrijf wordt voldaan aan de onderdelen a tot en met d;

      g. de landbouwer als onderdeel van de administratie, bedoeld in [artikel 32 van het besluit][ref5], het rapport,
      bedoeld onder c, bewaart.

      2 Indien een gewasperceel als bedoeld in het eerste lid gelegen is in een met nutriënten verontreinigd gebied of in
      een grondwaterbeschermingsgebied als bedoeld in [artikel 28, eerste lid, onderdeel g, onder 2°][ref6], wordt voor
      de toepassing van de 125 procent, bedoeld in het eerste lid, uitgegaan van de overeenkomstig artikel 28, eerste
      lid, aanhef en onderdeel g, verminderde hoeveelheid stikstof per hectare.


