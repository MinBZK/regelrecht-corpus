        paragraaf: '5'
  - number: '78'
    text: |-
      De bemonstering van een vracht drijfmest, bedoeld in [artikel 58, eerste lid][ref1], geschiedt automatisch tijdens
      het laden van het transportmiddel met behulp van bemonsteringsapparatuur die voldoet aan de prestatiekenmerken
      die zijn vermeld in [bijlage E][ref2], onderdeel A, en behoort tot een type waarvan bij keuring door Livestock
      Research, onderdeel van Wageningen UR te Wageningen of door een vergelijkbare instelling, is vastgesteld dat het
      voldoet aan die prestatiekenmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel78
