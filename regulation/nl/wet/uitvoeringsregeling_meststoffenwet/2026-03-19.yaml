  - number: '106'
    text: |-
      1 De aanmelding ter registratie, bedoeld in [artikel 105, eerste of zesde lid][ref1], geschiedt bij de minister.

      2 Bij de aanmelding, bedoeld in het eerste lid, worden in ieder geval de volgende gegevens verstrekt:

      a. het adres waar de hypotheekhouder is gevestigd;

      b. het door de minister ter identificatie verstrekte relatienummer van het bedrijf waarop het verzoek betrekking
      heeft; en

      c. het correspondentieadres van het in onderdeel b bedoelde bedrijf.

      3 De in het eerste lid bedoelde aanmelding wordt voor akkoord medeondertekend door degene op wiens bedrijf de
      registratie betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel105
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel106
