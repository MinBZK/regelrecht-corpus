  - number: 6a
    text: |-
      Herwonnen fosfaten uit rioolzuiveringsslib worden behandeld langs biologische, chemische of thermische weg, door
      langdurige opslag of volgens enig ander geschikt procedé, dat tot gevolg heeft dat het grootste deel van de in het
      zuiveringsslib aanwezige pathogene organismen afsterft.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel6a
  - number: '7'
    text: |-
      1 Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om secundaire nutriënten te leveren, bevatten ten
      minste één van de volgende nutriënten, in de daarbij vermelde minimale hoeveelheid, uitgedrukt in gewichtsprocenten
      van de droge stof:

      a. magnesiumoxide (MgO): ten minste 15%;

      b. calciumoxide (CaO): ten minste 25%;

      c. zwaveltrioxide (SO): ten minste 25%;

      d. natriumoxide (NaO): ten minste 50%.

      2 Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om micronutriënten te leveren, bevatten ten
      minste één van deze micronutriënten, in de in Bijlage 1, Hoofdstuk E, van de meststoffenverordening voorgeschreven
      minimale gehalten.
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel7
  - number: '8'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om secundaire nutriënten te leveren, overschrijden
      niet de in [bijlage Ab, onder tabel 1][ref1], opgenomen maximale waarden voor zware metalen, uitgedrukt in
      milligrammen per kilogram van het desbetreffende waardegevende bestanddeel.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018989
  - number: '9'
    text: |-
      Overige anorganische meststoffen die hoofdzakelijk zijn bedoeld om secundaire nutriënten te leveren
      en die organisch materiaal van dierlijke of plantaardige oorsprong bevatten, overschrijden niet de in
      [bijlage Ab, onder tabel 2][ref1], opgenomen maximale waarden voor organische microverontreinigingen, uitgedrukt in
      milligrammen per kilogram van het desbetreffende waardegevende bestanddeel.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018989
  - number: '10'
    text: |-
      In geval het betreft anorganische meststoffen die niet alleen hoofdzakelijk zijn bedoeld om primaire
      of secundaire nutriënten te leveren, maar ook om de micronutriënten koper en zink te leveren, is
      [artikel 14 van het besluit][ref1], voor zover het betreft de in [bijlage II, onder tabel 1 van het besluit][ref2],
      opgenomen maximale waarden voor koper en zink onderscheidenlijk [artikel 8][ref3], voor zover het betreft de in
      [bijlage Ab, onder tabel 1][ref4], opgenomen maximale waarden voor koper en zink, niet van toepassing, voor zover:

      a. de meststoffen overeenkomstig [artikel 14][ref5] zijn voorzien van de gehalten aan koper onderscheidenlijk zink;
      en

      b. zowel de hoeveelheden primaire of secundaire nutriënten als de hoeveelheden koper of zink die met de
      desbetreffende meststof worden opgebracht, passen binnen het totale bemestingsadvies.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0019031
      [ref3]: https://wetten.overheid.nl/BWBR0018989#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0018989
      [ref5]: https://wetten.overheid.nl/BWBR0018989#Artikel14
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel10
