      1 Op het door de minister beschikbaar gestelde middel, bedoeld in [artikel 69r, eerste lid][ref1], vermeldt de
      vervoerder tenminste de gegevens, bedoeld in [artikel 54, eerste lid][ref2].

      2 Op het door de minister beschikbaar gestelde middel, bedoeld in [artikel 69r, eerste lid][ref3], is een rVDM-
      nummer vermeld dat voor het betreffende vervoer wordt gebruikt.

      3 Het middel dat is voorzien van de gegevens, bedoeld in het eerste lid, is tijdens het betreffende vervoer
