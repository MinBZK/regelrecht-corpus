  - number: '39'
    text: |-
      1 Behalve de gegevens, bedoeld in [artikel 32, tweede lid, van het besluit][ref1], bevat de administratie van de
      landbouwer gegevens over:

      a. de hoeveelheid dierlijke meststoffen die in de periode van 1 januari tot en met 31 januari of van 16 september
      tot en met 31 december, op zijn bedrijf op bouwland op kleigrond of veengrond op of in de bodem is gebracht; en

      b. de oppervlakte en de ligging van de percelen van zijn bedrijf waarop zuiveringsslib op of in de bodem is
      gebracht.

      2 Ingeval van een overdracht van een opslagruimte voor meststoffen door een landbouwer aan een intermediair of door
      een intermediair aan een landbouwer, bevat de administratie tevens het bewijs van overdracht.

      3 Ingeval een landbouwer mestkorrels produceert, bevat de administratie tevens gegevens over:

      a. een overzicht van welke hoeveelheid mestkorrels uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en
      fosfaat, aan welk bedrijf of intermediaire onderneming is geleverd;

      b. de hoeveelheid geëxporteerde mestkorrels uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en
      fosfaat;

      c. de hoeveelheid mestkorrels uitgedrukt in kilogrammen, inclusief de gehalten aan stikstof en fosfaat die aan
      afnemers niet zijnde een bedrijf of intermediaire onderneming zijn geleverd

      4 Ingeval van gebruik van het in [artikel 69r][ref2] bedoelde middel, bevat de administratie, tevens de op basis
      van dat middel vereiste gegevens.

      5 In aanvulling op het eerste lid bevat de administratie van de landbouwer het geplande gebruik van meststoffen van
      het desbetreffende kalenderjaar.

      6 De gegevens, bedoeld in [artikel 32, tweede lid, onderdeel b, onder 1°, van het besluit][ref3] en het vijfde
      lid, worden jaarlijks voor 15 februari opgenomen in de administratie van de landbouwer.

      7 In afwijking van het zesde lid worden de gegevens, bedoeld in dat lid, voor het kalenderjaar 2025 voor 15 maart
      van dat jaar opgenomen in de administratie.


      [ref1]: https://wetten.overheid.nl/BWBR0019031#Artikel32
