      1 Op de opslagruimten voor meststoffen, bedoeld in [artikel 38, tweede lid, onderdeel a, van het besluit][ref1],
      worden de door de minister verstrekte registratienummers ter identificatie van de afzonderlijke opslagruimten
      aangebracht, op zodanige wijze dat het nummer steeds duidelijk zichtbaar en leesbaar is.

      2 De opslagruimten voor meststoffen worden in de administratie en bij de verstrekking van gegevens mede aangeduid
      met het registratienummer van de opslagruimte, bedoeld in het eerste lid.


