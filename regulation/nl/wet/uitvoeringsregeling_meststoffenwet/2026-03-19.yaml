  - number: '13'
    text: |-
      1 Behalve de gegevens, bedoeld in [artikel 19, eerste lid, van het besluit][ref1] zijn overige organische
      meststoffen en overige anorganische meststoffen die bestaan uit de in [bijlage Aa][ref2] opgenomen stoffen,
      voorzien van het nummer waaronder de desbetreffende stof op deze [bijlage][ref3] is vermeld.

      2 Behalve de gegevens, bedoeld in [artikel 19, eerste lid, van het besluit][ref4] zijn mengsels van meststoffen
      voorzien van gegevens over de meststoffen waaruit het mengsel bestaat en de verhouding waarin deze in het mengsel
      voorkomen.

      3 Indien het mengsel mede bestaat uit ingevolge [artikel 4, onderdeel c][ref5], aangewezen stoffen, wordt bij de
      in het tweede lid bedoelde vermelding over de samenstelling en verhouding tevens vermeld het nummer waaronder de
      desbetreffende stof op [bijlage Aa, onder III][ref6], is vermeld.


