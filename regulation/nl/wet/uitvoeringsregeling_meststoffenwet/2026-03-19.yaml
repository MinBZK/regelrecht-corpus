  - number: 69e
    text: |-
      1 Meststoffen kunnen door middel van een pijpleiding worden vervoerd:

      a. indien de meststoffen bestaan uit kalvergier, met behulp van een pijpleiding, in beheer bij de Stichting Beheer
      en Aanleg Kalvergierpersleiding enclave Uddel-Elspeet en Omstreken of bij de Stichting Kalvergierpersleiding Stroe,
      naar de kalvergierbewerkingsinstallatie Elspeet onderscheidenlijk naar de kalvergierbewerkingsinstallatie Stroe,
      beide in beheer bij de Stichting Mestverwerking Gelderland;

      b. indien dierlijke meststoffen van een bedrijf of een intermediaire onderneming worden afgevoerd naar een
      intermediaire onderneming en er wordt voldaan aan de volgende voorwaarden:

      1°. de pijpleiding en de in [artikel 53][ref1] genoemde apparatuur die wordt gebruikt bij het vervoer behoort tot
      de ontvangende intermediaire onderneming;

      2°. de pijpleiding wordt uitsluitend gebruikt voor de afvoer van meststoffen van één bedrijf of één intermediaire
      onderneming, en

      3°. de grootte van een vracht wordt voorafgaand aan het vervoer bepaald en is ten hoogste één lading van 36 ton en
      wordt binnen 24 uur vervoerd.

      2 De [artikelen 48][ref2] en [49 van het besluit][ref3] en de [artikelen 56][ref4] en [60][ref5] zijn niet van
      toepassing op het vervoer, bedoeld in het eerste lid, onderdeel a.

      3 Bij vervoer overeenkomstig het eerste lid, onderdeel a, geschiedt de bemonstering en verpakking van
      de genomen monsters, in zoverre in afwijking van [artikel 76, eerste lid][ref6], in samenhang met de
      [artikelen 58, eerste lid][ref7], [78][ref8], onderscheidenlijk [79][ref9], door de afnemer met behulp van op de
      kalvergierbewerkingsinstallatie aangebracht automatische bemonsteringsapparatuur waarmee uit het totale van één
      leverancier aangevoerde volume kalvergier een representatief monster wordt genomen.

      4 Het gewicht van de hoeveelheid dierlijke meststoffen, vervoerd overeenkomstig het eerste lid, onderdeel
      a, wordt, in zoverre in afwijking van [artikel 59][ref10], door de afnemer bepaald met behulp van een in de
      kalvergierbewerkingsinstallatie aangebracht apparaat ter bepaling van het volume dat voldoet aan de bij of
      krachtens de [Metrologiewet][ref11] gestelde regels, waarbij één kubieke meter kalvergier overeenkomt met 1.000
      kilogram.

      5 Bij vervoer van dierlijke meststoffen, overeenkomstig het eerste lid, onderdeel b, geschiedt de bemonstering
      en de verpakking van de genomen monsters, in afwijking van [artikel 76, eerste lid][ref12], in samenhang met
      [artikel 58, eerste lid][ref13], [78][ref14], onderscheidenlijk [79][ref15], door de vervoerder, met behulp van
      op de pijpleiding aangebrachte automatische bemonsteringsapparatuur, waarmee uit het totale van één leverancier
      aangevoerde volume drijfmest van maximaal 36 ton dat wordt vervoerd door de pijpleiding, een representatief monster
      wordt genomen.

      6 Bij vervoer van dierlijke meststoffen overeenkomstig het eerste lid, onderdeel b, kan het gewicht van de
      hoeveelheid dierlijke meststoffen, bedoeld in [artikel 59, eerste lid][ref16], door de intermediair ook worden
      bepaald met behulp van een in de pijpleiding aangebracht apparaat ter bepaling van het volume dat voldoet aan de
      bij of krachtens de [Metrologiewet][ref17] gestelde regels, waarbij het gemeten volume naar gewicht omgerekend
      wordt aan de hand van de dichtheid.

      7 Bij het vervoer van dierlijke meststoffen overeenkomstig het eerste lid, geschiedt de weegmelding, in afwijking
      van [artikel 59][ref18], onverwijld na het tijdstip van lossen, bedoeld in [artikel 60][ref19].

      8 Bij het vervoer van dierlijke meststoffen overeenkomstig het eerste lid, onderdeel a is de afnemer, tevens
      optredend als vervoerder, verantwoordelijk voor de meldingen, bedoeld in de [artikelen 54][ref20], [55][ref21] en
      [58][ref22] en [59][ref23].

      9 Bij het vervoer van dierlijke meststoffen overeenkomstig het eerste lid, onderdeel b, is de afnemer, tevens
      optredend als vervoerder verantwoordelijk voor de meldingen, bedoeld in de [artikelen 54][ref24], [55][ref25],
      [56][ref26] en [58 tot en met 60][ref27].

      10 Bij het vervoer van dierlijke meststoffen overeenkomstig het eerste lid, onderdeel a, draagt de afnemer er zorg
      voor dat op het tijdstip van het lossen van de dierlijke meststoffen, onder vermelding van het desbetreffende rVDM-
      nummer, de datum en het tijdstip van het lossen van de vracht worden vastgelegd en onverwijld aan rVDM worden
      gezonden.

      11 De afnemer, tevens optredend als vervoerder stuurt, het overeenkomstig het derde en vijfde lid verkregen monster
      onder vermelding van het rVDM-nummer uiterlijk tien werkdagen na bemonstering aan een door de minister erkend
      laboratorium als bedoeld in [artikel 80a][ref28].

      12 [Artikel 80, derde lid][ref29], is van overeenkomstige toepassing.


