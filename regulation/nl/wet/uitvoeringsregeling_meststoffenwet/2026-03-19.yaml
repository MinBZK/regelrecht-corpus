        paragraaf: '2'
  - number: '107'
    text: |-
      1 Indien de aanmelding, bedoeld in [artikel 106, eerste lid][ref1], niet voor akkoord is
      medeondertekend door degene op wiens bedrijf de aanmelding betrekking heeft, wordt het bedrijf
      slechts geregistreerd, indien de hypotheekhouder bij het verzoek tevens een uittreksel van het in
      [artikel 260, eerste lid, van boek 3 van het Burgerlijk Wetboek][ref2] bedoelde openbare register overlegt, waaruit
      blijkt op welke registergoederen behorend tot het bedrijf een hypotheekrecht is gevestigd.

      2 De minister doet van de registratie, bedoeld in het eerste lid, schriftelijk mededeling aan degene op wiens
      bedrijf de registratie betrekking heeft. Indien deze binnen 30 dagen na dagtekening van deze mededeling aan de
      minister verklaart dat de geregistreerde gegevens niet juist zijn, gelden in plaats van [artikel 105][ref3] de
      volgende leden.

      3 De minister neemt een kennisgeving van overgang, gedaan door degene op wiens bedrijf de registratie betrekking
      heeft, niet in behandeling zolang de hypotheekhouder de registratie niet laat doorhalen, doch hoogstens gedurende
      negentig dagen na dagtekening van de schriftelijke mededeling, bedoeld in het tweede lid.

      4 De termijn, bedoeld in het derde lid, wordt eenmalig met negentig dagen verlengd indien de hypotheekhouder
      daartoe binnen de eerstgenoemde termijn een verzoek doet aan de minister, onder gelijktijdige overlegging van een
      rechterlijke uitspraak of een verklaring van een notaris als bedoeld in [artikel 105, derde lid][ref4].

      5 De registratie wordt doorgehaald na afloop van de in het derde, dan wel in voorkomend geval in het vierde lid
      bedoelde termijn.

      6 Ter zake van een bedrijf, waarvan overeenkomstig het vijfde lid de registratie is doorgehaald, wordt door de
      minister geen nieuw verzoek tot registratie van dezelfde hypotheekhouder in behandeling genomen, tenzij deze
      voor akkoord is medeondertekend door degene op wiens bedrijf de registratie betrekking heeft. Dit voor akkoord
      medeondertekende verzoek tot registratie geldt tevens als intrekking van het niet-medeondertekende verzoek tot
      registratie, indien deze registratie nog niet is doorgehaald.


