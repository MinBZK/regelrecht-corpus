        artikel: '1'
  - number: 110b
    text: |-
      1 Een landbouwer is in een kalenderjaar uitgezonderd van het verbod, bedoeld in [artikel 21b, van de wet][ref1],
      voor zover hij op zijn bedrijf dierlijke meststoffen produceert met jongvee voor de zoogkoeienhouderij, indien:

      a. in het desbetreffende kalenderjaar op het bedrijf niet tevens melk- of kalfkoeien of vrouwelijk jongvee voor de
      melkveehouderij worden gehouden;

      b. hij ervoor zorgt dat met in het desbetreffende kalenderjaar op het bedrijf gehouden vrouwelijke runderen nadien
      geen dierlijke meststoffen worden geproduceerd op een bedrijf dat melk bestemd voor consumptie of verwerking
      produceert;

      c. in het geval de Minister ten aanzien van het bedrijf een fosfaatrecht heeft vastgesteld overeenkomstig
      [artikel 23, derde tot en met zesde en negende lid, van de wet][ref2], een kennisgeving van het vervallen van
      dit fosfaatrecht met ingang van het kalenderjaar waarin voor het eerst met het bedrijf gebruik wordt gemaakt van
      de uitzondering, is geregistreerd overeenkomstig [artikel 31, tweede lid, van de wet][ref3] voorafgaand aan dat
      kalenderjaar, en

      d. hij in het desbetreffende kalenderjaar geen vrouwelijke runderen inschaart van, of uitschaart naar, een
      landbouwer die niet is uitgezonderd.

      2 Het eerste lid, onderdeel c, is van overeenkomstige toepassing op een fosfaatrecht dat de Minister overeenkomstig
      [artikel 23, derde tot en met zesde en negende lid, van de wet][ref4], heeft vastgesteld ten aanzien van een ander
      bedrijf waarvan de landbouwer bestuurder is geweest in de 3 jaren voorafgaand aan het jaar waarin hij voor het
      eerst met het bedrijf gebruik maakt van de uitzondering.

      3 Het eerste lid is niet van toepassing op een landbouwer die na 8 maart 2018 op zijn bedrijf dierlijke meststoffen
      met jongvee voor de zoogkoeienhouderij is gaan produceren, indien moet worden aangenomen dat de oprichting van dat
      bedrijf of het houden van jongvee voor de zoogkoeienhouderij op dat bedrijf, in overwegende mate ten doel heeft de
      toepassing van het eerste lid, onderdeel c, en tweede lid, te vermijden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel21b
      [ref2]: https://wetten.overheid.nl/BWBR0004054#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0004054#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0004054#Artikel23
