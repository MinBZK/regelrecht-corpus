  - number: 92a
    text: |-
      1 Het stikstofgehalte en het fosfaatgehalte in zuiveringsslib en compost, alsmede het droge stofgehalte in
      zuiveringsslib en compost wordt vastgesteld door middel van analyse van een uit de desbetreffende hoeveelheid
      genomen monster.

      2 De bemonstering van een hoeveelheid zuiveringsslib of compost geschiedt door de producent. Hij stelt per
      geproduceerde hoeveelheid van ten hoogste 2.000.000 kilogram, een representatief monster samen, bestaande uit
      deelmonsters die volgens algemeen geldende bemonsteringsprincipes evenredig verspreid uit de betrokken partij
      worden genomen. Indien de geproduceerde hoeveelheid groter is dan 2.000.000 kilogram, wordt deze allereerst
      verdeeld in partijen van ten hoogste 2.000.000 kilogram.

      3 Indien zuiveringsslib of compost in een continu proces wordt geproduceerd, kan de desbetreffende producent
      ervoor kiezen dat het stikstofgehalte, het fosfaatgehalte alsmede het drogestof gehalte ervan, in zoverre
      in afwijking van de voorgaande leden, overeen komen met het over de afgelopen twaalf maanden overeenkomstig
      [artikel 92b, tweede lid][ref1], berekende twaalf-maandsgemiddelde stikstof-, fosfaat- en drogestof gehalte, mits:

      a. de voor de productie van het zuiveringsslib of de compost gebruikte ingangsmaterialen van constante
      samenstelling zijn;

      b. de productie van zuiveringsslib of compost onafgebroken gedurende het gehele jaar plaatsvindt; en

      c. het stikstofgehalte, het fosfaatgehalte alsmede het drogestofgehalte ten minste eenmaal per kalendermaand wordt
      vastgesteld door middel van analyse van een representatief monster bestaande uit deelmonsters die volgens algemeen
      geldende bemonsteringsprincipes evenredig verspreid uit de in die kalendermaand geproduceerde hoeveelheid zijn
      genomen.

      4 Het monster wordt verpakt in een monsterverpakking die het monster niet verontreinigt of de samenstelling ervan
      anderszins beïnvloedt.

      5 Het monster wordt door de producent uiterlijk tien werkdagen na bemonstering toegestuurd aan een laboratorium dat
      blijkens accreditatie door de Raad aantoonbaar voldoet aan de norm NEN-EN-ISO/IEC 17025.

      6 Indien het monster afkomstig is uit een hoeveelheid die in een continu proces is geproduceerd, geeft de betrokken
      producent bij het verzenden ervan aan of de analyseresultaten van dit monster gebruikt moeten worden bij de in
      [artikel 92b, tweede lid][ref2], bedoelde berekening.


      [ref1]: https://wetten.overheid.nl/BWBR0018989#Artikel92b
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel92b
    url: https://wetten.overheid.nl/BWBR0018989/2026-03-19#Artikel92a
