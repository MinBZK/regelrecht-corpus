      zuiveringsslib waarvoor op grond van [artikel 92b][ref4] een verschillend analysenummer is verstrekt, in één
      opslagruimte opslaat, verstrekt op elektronische wijze aan de minister het stikstofgehalte, het fosfaatgehalte
      en het drogestofgehalte zoals dat voor de in de desbetreffende opslag aanwezige hoeveelheid zuiveringsslib met
