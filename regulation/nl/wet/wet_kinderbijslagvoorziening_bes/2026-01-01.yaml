  - number: '19'
    text: |-
      De kinderbijslag BES, bedoeld in [artikel 5][ref1] en, indien van toepassing, [artikel 5a, eerste lid][ref2], die
      niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van betaalbaarstelling, wordt niet
      meer betaald. Onze Minister kan de eerste volzin buiten toepassing laten of daarvan afwijken voor zover toepassing
      gelet op het belang van de rechthebbende zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037347#Artikel5a
