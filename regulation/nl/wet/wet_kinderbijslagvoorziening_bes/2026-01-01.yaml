        paragraaf: '1'
  - number: '7'
    text: |-
      1 Geen recht op kinderbijslag BES overeenkomstig de bepalingen van deze wet bestaat voor de persoon die
      kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref1] of een vergelijkbare tegemoetkoming in de kosten
      van kinderen van een andere mogendheid ontvangt.

      2 Geen recht op kinderbijslag BES overeenkomstig de bepalingen van deze wet bestaat voor een kalendermaand voor
      het kind waarvoor, voor die kalendermaand, kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref2] of een
      vergelijkbare tegemoetkoming in de kosten van kinderen van een andere mogendheid wordt ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0002368
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel7
