  - number: 24a
    text: |-
      1 De bekendmaking van een beschikking geschiedt door toezending of uitreiking aan de belanghebbende.

      2 Indien de bekendmaking van de beschikking niet kan geschieden op de wijze als voorzien in het eerste lid,
      geschiedt zij op een andere geschikte wijze.

      3 De beschikking vermeldt de dagtekening van de beslissing, de gronden waarop deze berust, alsmede waar beroep kan
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel24a
  - number: 24b
    text: |-
      1 De belanghebbende kan tegen een beschikking op grond van deze wet beroep instellen bij het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref1].

      2 Bij een beroep tegen een beschikking op grond van de
      [artikelen 5, vijfde lid][ref2], en [13, eerste lid, onderdeel d][ref3], is
      [artikel 23, eerste lid, laatste zin, van de Wet administratieve rechtspraak BES][ref4] niet van toepassing.

      3 Bij een bestuurlijke heroverweging van een beschikking op grond van de
      [artikelen 5, vijfde lid][ref5], en [13, eerste lid, onderdeel d][ref6], is
      [artikel 24, eerste en tweede lid, van de Wet administratieve rechtspraak BES][ref7] van overeenkomstige
      toepassing.

      4 Met betrekking tot een beschikking op grond van de [artikelen 5, vijfde lid][ref8],
      en [13, eerste lid, onderdeel d][ref9], kan het Gerecht, bedoeld in
      [artikel 1, eerste lid, onderdeel b, van de Wet administratieve rechtspraak BES][ref10], indien het bestuursorgaan
      niet voldoet aan de verplichting, bedoeld in [artikel 23 van de Wet administratieve rechtspraak BES][ref11],
      daaruit de gevolgtrekking maken die hem geraden voorkomt.


