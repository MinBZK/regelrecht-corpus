  - number: '11'
    text: |-
      1 Onze Minister stelt op aanvraag vast of er recht op kinderbijslag BES bestaat.

      2 Een aanvraag wordt ingediend door middel van een door Onze Minister beschikbaar gesteld aanvraagformulier.

      3 Het recht op kinderbijslag BES kan niet vroeger ingaan dan een jaar voorafgaand aan de eerste dag van de
      kalendermaand tijdens welk de aanvraag om kinderbijslag BES werd ingediend. Het recht op kinderbijslag, bedoeld
      in [artikel 5a, eerste lid][ref1], kan niet vroeger ingaan dan de eerste dag van de kalendermaand tijdens welk de
      aanvraag om kinderbijslag als bedoeld in artikel 5a, eerste lid, werd ingediend.

      4 In afwijking van het eerste lid, is Onze Minister bevoegd de kinderbijslag BES ambtshalve toe te kennen.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel5a
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037347
        artikel: 5a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '12'
    text: |-
      1 Een beschikking op grond van deze wet wordt gegeven binnen een redelijke termijn na ontvangst van de aanvraag.

      2 Deze redelijke termijn is in ieder geval verstreken wanneer Onze Minister binnen acht weken na ontvangst van de
      aanvraag geen beschikking heeft gegeven, noch een mededeling als bedoeld in het derde lid is gedaan.

      3 Indien de beschikking niet binnen de termijn van acht weken kan worden gegeven, wordt die termijn met een
      redelijke termijn verlengd en wordt de aanvrager daarvan schriftelijk in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel12
  - number: '13'
    text: |-
      1 Onze Minister kan een beschikking tot toekenning van kinderbijslag BES als bedoeld in [artikel 5][ref1] en,
      indien van toepassing, [artikel 5a, eerste lid][ref2], herzien dan wel intrekken indien:

      a. het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 14][ref3] of [15][ref4] heeft
      geleid tot het ten onrechte toekennen van kinderbijslag BES;

      b. ten onrechte kinderbijslag BES is toegekend;

      c. het niet of niet behoorlijk nakomen van een verplichting op grond van [artikel 14][ref5] of [15][ref6] ertoe
      leidt dat niet kan worden vastgesteld of nog recht op kinderbijslag BES bestaat;

      d. de rechthebbende of diens kind waarvoor kinderbijslag BES wordt ontvangen, een uitreiziger is.

      2 Indien daarvoor dringende redenen aanwezig zijn, kan Onze Minister geheel of gedeeltelijk van herziening of
      intrekking afzien.


