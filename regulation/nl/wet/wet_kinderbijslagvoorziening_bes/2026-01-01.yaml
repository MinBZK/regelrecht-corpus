  - number: '14'
    text: |-
      De rechthebbende, alsmede degene die in aanmerking wenst te komen voor kinderbijslag BES als bedoeld in
      [artikel 5][ref1] en, indien van toepassing, [artikel 5a, eerste lid][ref2], is verplicht aan Onze Minister op
      zijn verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hem of haar
      redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op kinderbijslag BES of op het
      geldend maken van het recht op kinderbijslag BES, dat wordt betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037347#Artikel5a
