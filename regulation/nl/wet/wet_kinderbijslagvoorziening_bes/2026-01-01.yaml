preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om te komen tot een algemene kinderbijslagvoorziening
    voor de openbare lichamen Bonaire, Sint Eustatius en Saba;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede verstaan onder:

        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *openbaar lichaam/openbare lichamen:* de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - *SVB:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1];
        - *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of inlichtingen-
      en veiligheidsdiensten, gericht aan Onze Minister, is gebleken dat het gegronde vermoeden bestaat dat deze persoon
      zich buiten de openbare lichamen bevindt met het doel om zich aan te sluiten bij een organisatie die is geplaatst
      op de lijst van organisaties, bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0003738#Artikel14
