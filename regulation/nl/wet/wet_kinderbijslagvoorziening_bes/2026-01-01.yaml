  - number: '4'
    text: Onze Minister is belast met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel4
  - number: '5'
    text: |-
      1 De ingezetene heeft overeenkomstig de bepalingen van deze wet recht op kinderbijslag BES voor een kind dat:

      a. ingezetene is;

      b. jonger is dan 18 jaar; en

      c. tot zijn huishouden behoort.

      2 In afwijking van het eerste lid, onderdelen a en c, behoeft het kind geen ingezetene te zijn en niet tot het
      huishouden van de rechthebbende te behoren, indien het om onderwijsredenen, dan wel in verband met een ziekte of
      handicap geen ingezetene is en niet tot het huishouden van de rechthebbende behoort. Voor de toepassing van dit lid
      dient het betreffende kind ten minste vijf jaar ingezetene te zijn geweest.

      3 In afwijking van het eerste lid, onderdeel c, behoeft het kind niet tot het huishouden van de rechthebbende te
      behoren, indien het in een instelling is geplaatst, niet zijnde een jeugdafdeling van een justitiële inrichting.

      4 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het tweede lid, waarbij kan worden
      bepaald dat in specifieke gevallen voor een kind met een ziekte of handicap van de termijn van vijf jaar kan worden
      afgeweken.

      5 Geen recht op kinderbijslag BES bestaat voor de vreemdeling die op grond van de
      [Wet toelating en uitzetting BES][ref1] niet rechtmatig in de openbare lichamen verblijft.

      6 Geen recht op kinderbijslag BES bestaat voor degene die een uitreiziger is dan wel voor diens kind dat een
      uitreiziger is.


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028571
  - number: 5a
    text: |-
      1 Een ingezetene heeft voor een tot zijn huishouden behorend kind dat drie jaar of ouder is en jonger dan 18
      jaar, recht op een verdubbeling van het kinderbijslagbedrag BES, genoemd in [artikel 9][ref1], indien het kind is
      aangewezen op een bij of krachtens algemene maatregel van bestuur te bepalen mate van intensieve zorg.

      2 Om te bepalen of een kind intensieve zorg behoeft, wint Onze Minister een op medische gegevens gebaseerd advies
      in bij een door Onze Minister aangewezen rechtspersoon.

      3 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het eerste en
      tweede lid, waarbij in elk geval regels worden gesteld over:

      a. de wijze van inschakeling van de rechtspersoon;

      b. de wijze waarop wordt beoordeeld of er sprake is van intensieve zorg als bedoeld in het eerste lid;

      c. de procedure alsmede de beoordelingscriteria waarop het advies, bedoeld in het tweede lid, wordt gebaseerd; en

      d. de uitwisseling van gegevens tussen de in het tweede lid bedoelde rechtspersoon en Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel9
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel5a
    references:
