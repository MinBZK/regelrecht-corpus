  - number: '20'
    text: |-
      1 De kinderbijslag BES, bedoeld in [artikel 5][ref1] en, indien van toepassing, [artikel 5a, eerste lid][ref2], is:

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening;

      c. behoudens voor zover dit dient tot verhaal van een uitkering tot levensonderhoud van het kind, of tot
      terugvordering van onverschuldigd betaalde kinderbijslag BES als bedoeld in [artikel 21][ref3], niet vatbaar voor
      executoriaal of conservatoir beslag noch voor beslag ingevolge faillissement.

      2 Volmacht tot ontvangst van kinderbijslag BES als bedoeld in [artikel 5][ref4] en, indien van toepassing,
      [artikel 5a, eerste lid][ref5], onder welke vorm of welke benaming ook door de rechthebbende verleend, is steeds
      herroepelijk.

      3 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.


