  - number: '21'
    text: |-
      1 Onze Minister is bevoegd de ten onrechte uitbetaalde kinderbijslag BES als bedoeld in [artikel 5][ref1] en,
      indien van toepassing, [artikel 5a, eerste lid][ref2], terug te vorderen van diegene aan wie de kinderbijslag BES
      is betaald, indien:

      a. het ten onrechte uitbetalen het gevolg is van het niet verstrekken van inlichtingen of het verstrekken van
      onjuiste inlichtingen;

      b. Onze Minister anderszins foutief of ten onrechte kinderbijslag BES heeft uitbetaald.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037347#Artikel5a
