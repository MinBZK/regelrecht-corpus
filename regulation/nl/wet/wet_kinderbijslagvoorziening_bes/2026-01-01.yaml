  - number: '23'
    text: |-
      1 Onze Minister kan een bestuurlijke boete opleggen van ten hoogste het benadelingsbedrag wegens het niet of niet
      behoorlijk nakomen door de rechthebbende, dan wel degene die in aanmerking wenst te komen voor kinderbijslag BES
      als bedoeld in [artikel 5][ref1] en, indien van toepassing, [artikel 5a, eerste lid][ref2], van de verplichting,
      bedoeld in [artikel 14][ref3].

      2 In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 14][ref4], ten onrechte of tot een te hoog bedrag aan
      kinderbijslag BES als bedoeld in [artikel 5][ref5] en, indien van toepassing, [artikel 5a, eerste lid][ref6], is
      verleend.

      3 Indien het niet of niet behoorlijk nakomen door de rechthebbende, dan wel degene die in aanmerking wenst te komen
      voor kinderbijslag BES als bedoeld in [artikel 5][ref7] en, indien van toepassing, [artikel 5a, eerste lid][ref8],
      van de verplichting, bedoeld in [artikel 14][ref9], niet heeft geleid tot een benadelingsbedrag, kan Onze
      Minister een bestuurlijke boete opleggen van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref10].

      4 Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden over de tenuitvoerlegging van de
      bestuurlijke boete, alsmede de verrekening van deze bestuurlijke boete.


