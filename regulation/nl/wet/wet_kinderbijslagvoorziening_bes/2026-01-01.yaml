  - number: '17'
    text: |-
      1 De kinderbijslag BES wordt betaalbaar gesteld door Onze Minister. De betaling geschiedt per kalendermaand. Onze
      Minister betaalt zo spoedig mogelijk, doch uiterlijk binnen één maand na het tijdstip waarop recht op kinderbijslag
      BES wordt vastgesteld. De betaling is geschied, indien de ontvanger de betaling daadwerkelijk heeft ontvangen.

      2 Indien twee personen, die gezamenlijk een huishouden vormen, over eenzelfde tijdvak recht op kinderbijslag BES
      voor eenzelfde kind hebben, wordt de kinderbijslag BES uitbetaald aan degene van hen die zij gezamenlijk daartoe
      hebben aangewezen.

      3 Bij gebreke van een gezamenlijke aanwijzing als bedoeld in het tweede lid bepaalt Onze Minister aan welke persoon
      de kinderbijslag BES wordt uitbetaald.

      4 Indien twee personen recht hebben op kinderbijslag BES voor eenzelfde kind en dit kind niet tot het huishouden
      behoort van de twee personen, wordt enkel het recht van de persoon tot wiens huishouden het kind als laatste
      behoorde uitbetaald.

      5 Indien twee personen voor eenzelfde kind recht hebben op verdubbeling van het kinderbijslagbedrag BES, en dit
      kind op basis van een overeenkomst of rechterlijke beschikking overwegend in gelijke mate verzorgen en onderhouden
      zonder met elkaar een gemeenschappelijke huishouding te voeren, wordt de verdubbeling uitbetaald aan de ouder aan
      wie ook de kinderbijslag BES wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel17
  - number: '18'
    text: |-
      1 Onze Minister schort de betaling van de kinderbijslag BES, bedoeld in [artikel 5][ref1] en, indien van
      toepassing, [artikel 5a, eerste lid][ref2], op of schorst de betaling, indien hij op grond van duidelijke
      aanwijzingen van oordeel is of het gegronde vermoeden heeft, dat:

      a. het recht op kinderbijslag BES niet of niet meer bestaat; of

      b. de rechthebbende een verplichting die hem of haar op grond van de [artikelen 14][ref3] en [15][ref4] is
      opgelegd, niet is nagekomen.

      2 Onze Minister schort de betaling van de kinderbijslag BES, bedoeld in [artikel 5][ref5] en, indien van
      toepassing, [artikel 5a, eerste lid][ref6], op, indien blijkt dat het door de rechthebbende verstrekte adres van
      hemzelf of van zijn kind afwijkt van het adres waaronder de rechthebbende of het kind in een basisadministratie als
      bedoeld in [artikel 2 van de Wet basisadministraties persoonsgegevens BES][ref7] staat ingeschreven.

      3 Geen opschorting vindt plaats:

      a. indien de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op kinderbijslag BES als bedoeld in
      [artikel 5][ref8] en, indien van toepassing, [artikel 5a, eerste lid][ref9];

      b. indien de rechthebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt.

      4 Voordat Onze Minister overgaat tot opschorting van de betaling, geeft hij de rechthebbende de gelegenheid zijn
      zienswijze bekend te maken voor zover:

      a. de beschikking steunt op gegevens over feiten die de rechthebbende betreffen, en

      b. die gegevens niet door de rechthebbende zelf zijn verstrekt.

      5 Onze Minister doet schriftelijk mededeling van de opschorting aan de rechthebbende.

      6 De opschorting wordt beëindigd zodra het Onze Minister gebleken is dat de afwijking niet meer bestaat.


