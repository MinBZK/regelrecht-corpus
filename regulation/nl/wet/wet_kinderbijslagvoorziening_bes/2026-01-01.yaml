  - number: 14a
    text: |-
      1 Een ieder is verplicht aan Onze Minister door hem gevraagde inlichtingen te geven in het kader van
      deze wet. De door Onze Minister verlangde inlichtingen omvatten ten minste de naam en de voornamen
      van de persoon van wie de inlichtingen worden gevraagd en het identificatienummer dat hem op grond van
      [artikel 8.86, negende lid, van de Belastingwet BES][ref1] is toegekend dan wel van hem bekend is.

      2 De inlichtingen moeten desgevraagd schriftelijk worden verstrekt binnen een door Onze Minister schriftelijk te
      stellen termijn.

      3 Een ieder is verplicht om aan Onze Minister desgevraagd inzage te verlenen van boeken, bescheiden en andere
      informatiedragers, voor zover dit noodzakelijk is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0029244#Artikel8.86
