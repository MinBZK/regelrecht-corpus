  - number: '16'
    text: |-
      Onze Minister is bevoegd de kinderbijslag BES, bedoeld in [artikel 5][ref1] en, indien van toepassing,
      [artikel 5a, eerste lid][ref2], tijdelijk of blijvend, geheel of gedeeltelijk te weigeren, indien de rechthebbende
      de verplichtingen, bedoeld in de [artikelen 14][ref3] en [15][ref4], niet of niet behoorlijk is nagekomen. Van de
      weigering wordt afgezien indien elke vorm van verwijtbaarheid ontbreekt. Bij algemene maatregel van bestuur worden
      nadere regels gesteld over de tenuitvoerlegging van de weigering.


