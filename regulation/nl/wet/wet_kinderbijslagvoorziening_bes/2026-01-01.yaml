  - number: '15'
    text: |-
      1 Bij ministeriële regeling kunnen controlevoorschriften worden vastgesteld. Deze voorschriften gaan niet verder
      dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De rechthebbende, alsmede degene die in aanmerking wenst te komen voor kinderbijslag BES als bedoeld in
      [artikel 5][ref1] en, indien van toepassing, [artikel 5a, eerste lid][ref2], is verplicht de voorschriften op te
      volgen en anderszins aan Onze Minister desgevraagd de medewerking te verlenen die redelijkerwijs nodig is voor de
      uitvoering van deze wet.

      3 De rechthebbende, alsmede degene die in aanmerking wenst te komen voor kinderbijslag BES als bedoeld in
      [artikel 5][ref3] en, indien van toepassing, [artikel 5a, eerste lid][ref4], onthoudt zich van zeer ernstige
      misdragingen jegens de met de uitvoering van deze wet belaste personen en instanties tijdens het verrichten van
      hun werkzaamheden.


