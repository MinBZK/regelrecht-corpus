      - id: ref2
        bwb_id: BWBR0002368
  - number: '8'
    text: |-
      Recht op kinderbijslag BES over een kalendermaand heeft de rechthebbende die op de eerste dag van die kalendermaand
      voldoet aan de voorwaarden voor het recht op kinderbijslag BES, bedoeld in de [artikelen 5][ref1] en [5a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0037347#Artikel5a
