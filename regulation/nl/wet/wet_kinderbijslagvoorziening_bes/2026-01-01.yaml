  - number: '2'
    text: |-
      1 Ingezetene in de zin van deze wet is degene die in de openbare lichamen woont.

      2 Waar iemand woont wordt naar de feitelijke omstandigheden beoordeeld.
    url: https://wetten.overheid.nl/BWBR0037347/2026-01-01#Artikel2
  - number: '3'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder kind: eigen kind, aangehuwd kind of
      pleegkind.

      2 Als eigen kind wordt beschouwd het kind:

      a. van de vrouw die op grond van [artikel 198 van Boek 1 van het Burgerlijk Wetboek BES][ref1] als zijn moeder
      wordt aangemerkt;

      b. van de man die op grond van [artikel 199 van Boek 1 van het Burgerlijk Wetboek BES][ref2] als zijn vader wordt
      aangemerkt;

      c. van de man die op grond van [artikel 394 van Boek 1 van het Burgerlijk Wetboek BES][ref3] verplicht
      is bij te dragen aan de kosten van verzorging en opvoeding, tenzij het kind reeds op grond van
      [artikel 199 van Boek 1 van het Burgerlijk Wetboek BES][ref4] als eigen kind van een andere man wordt aangemerkt;

      d. van de man wiens biologisch vaderschap door middel van DNA-onderzoek is vastgesteld, mits de man het kind
      feitelijk in relevante mate onderhoudt en het kind niet reeds tot een andere man in een familierechtelijke
      vaderschapsrelatie staat;

      e. van de man die na toepassing van het in de openbare lichamen geldende internationaal privaatrecht tot het kind
      in een familierechtelijke vaderschapsrelatie staat.

      3 Als pleegkind wordt beschouwd het kind dat duurzaam tot het huishouden van de rechthebbende behoort en door de
      rechthebbende wordt verzorgd.


      [ref1]: https://wetten.overheid.nl/BWBR0028743#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0028743#Artikel199
      [ref3]: https://wetten.overheid.nl/BWBR0028743#Artikel394
      [ref4]: https://wetten.overheid.nl/BWBR0028743#Artikel199
