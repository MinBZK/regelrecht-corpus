  - number: '6'
    text: |-
      1 Geen recht op kinderbijslag BES overeenkomstig de bepalingen van deze wet bestaat voor een kind,
      indien dat kind op de eerste dag van de maand recht heeft op studiefinanciering BES op grond van de
      [Wet studiefinanciering BES][ref1].

      2 Geen recht op kinderbijslag BES overeenkomstig de bepalingen van deze wet bestaat voor een kind,
      indien dat kind op de eerste dag van de maand recht heeft op studiefinanciering op grond van de
      [Wet studiefinanciering 2000][ref2].

      3 Voor de toepassing van het tweede lid wordt een reisvoorziening voor de mbo-student, bedoeld in
      [artikel 2.3, eerste lid, tweede volzin, van de Wet studiefinanciering 2000][ref3], niet beschouwd als
      studiefinanciering in de zin van [die wet][ref4].


