      kosteloos verstrekt door:

      a. Onze Minister van Onderwijs, Cultuur en Wetenschap, voor zover het betreft de studiefinanciering BES en de
      studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1];

      b. de SVB, voor zover het betreft de toepassing van de [Algemene Kinderbijslagwet][ref2].

      2 De gegevens of inlichtingen worden geleverd binnen een daartoe gestelde termijn.


