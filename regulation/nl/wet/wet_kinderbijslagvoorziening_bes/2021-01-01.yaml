  - number: '19'
    text: |-
      De kinderbijslag BES die niet in ontvangst is genomen of is ingevorderd binnen drie maanden na de dag van
      betaalbaarstelling, wordt niet meer betaald. Onze Minister kan de eerste volzin buiten toepassing laten of daarvan
      afwijken voor zover toepassing gelet op het belang van de rechthebbende zal leiden tot een onbillijkheid van
      overwegende aard.
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel19
  - number: '20'
    text: |-
      1 De kinderbijslag BES is:

      a. onvervreemdbaar;

      b. niet vatbaar voor verpanding of belening;

      c. behoudens voor zover dit dient tot verhaal van een uitkering tot levensonderhoud van het kind, of tot
      terugvordering van onverschuldigd betaalde kinderbijslag BES als bedoeld in [artikel 21][ref1], niet vatbaar voor
      executoriaal of conservatoir beslag noch voor beslag ingevolge faillissement.

      2 Volmacht tot ontvangst van kinderbijslag BES, onder welke vorm of welke benaming ook door de rechthebbende
      verleend, is steeds herroepelijk.

      3 Elk beding, strijdig met enige bepaling van dit artikel, is nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel21
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0037347
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '21'
    text: |-
      1 Onze Minister is bevoegd de ten onrechte uitbetaalde kinderbijslag BES terug te vorderen van diegene aan wie de
      kinderbijslag BES is betaald, indien:

      a. het ten onrechte uitbetalen het gevolg is van het niet verstrekken van inlichtingen of het verstrekken van
      onjuiste inlichtingen;

      b. Onze Minister anderszins foutief of ten onrechte kinderbijslag BES heeft uitbetaald.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel21
  - number: '22'
    text: |-
      Een vordering van Onze Minister als bedoeld in [artikel 21][ref1] is bevoorrecht en volgt onmiddellijk na de
      vorderingen, bedoeld in [artikel 288 van Boek 3 van het Burgerlijk Wetboek BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028745#Artikel288
