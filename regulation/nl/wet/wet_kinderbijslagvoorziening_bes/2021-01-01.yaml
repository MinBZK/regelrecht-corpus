  - number: '14'
    text: |-
      1 De rechthebbende, alsmede degene die in aanmerking wenst te komen voor kinderbijslag BES, is verplicht aan Onze
      Minister op zijn verzoek of onverwijld uit eigen beweging alle feiten en omstandigheden mee te delen, waarvan hem
      of haar redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op kinderbijslag BES of op
      het geldend maken van het recht op kinderbijslag BES, dat wordt betaald.

      2 De verplichting, bedoeld in het eerste lid, geldt niet indien het kind voor wie kinderbijslag BES wordt
      uitbetaald, recht heeft op studiefinanciering op grond van de [Wet studiefinanciering BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028393
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028393
  - number: '15'
    text: |-
      1 Bij ministeriële regeling kunnen controlevoorschriften worden vastgesteld. Deze voorschriften gaan niet verder
      dan strikt noodzakelijk is voor een juiste uitvoering van deze wet.

      2 De rechthebbende, alsmede degene die in aanmerking wenst te komen voor kinderbijslag BES, is verplicht
      de voorschriften op te volgen en anderszins aan Onze Minister desgevraagd de medewerking te verlenen die
      redelijkerwijs nodig is voor de uitvoering van deze wet.

      3 De rechthebbende, alsmede degene die in aanmerking wenst te komen voor kinderbijslag BES, onthoudt zich van
      zeer ernstige misdragingen jegens de met de uitvoering van deze wet belaste personen en instanties tijdens het
      verrichten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel15
  - number: '16'
    text: |-
      Onze Minister is bevoegd de kinderbijslag BES tijdelijk of blijvend, geheel of gedeeltelijk te weigeren, indien
      de rechthebbende de verplichtingen, bedoeld in de [artikelen 14][ref1] en [15][ref2], niet of niet behoorlijk is
      nagekomen. Van de weigering wordt afgezien indien elke vorm van verwijtbaarheid ontbreekt. Bij algemene maatregel
      van bestuur worden nadere regels gesteld over de tenuitvoerlegging van de weigering.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0037347#Artikel15
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel16
