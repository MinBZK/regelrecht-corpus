  - number: '8'
    text: |-
      Recht op kinderbijslag BES over een kalendermaand heeft de rechthebbende die op de eerste dag van die kalendermaand
      voldoet aan de voorwaarden voor het recht op kinderbijslag BES.
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel8
  - number: '9'
    text: |-
      Het kinderbijslagbedrag BES bedraagt over een kalendermaand:

      a. USD 38  per kind, indien rechthebbende ingezetene is van het openbaar lichaam Bonaire;

      b. USD 38  per kind, indien rechthebbende ingezetene is van het openbaar lichaam Sint Eustatius;

      c. USD 38  per kind, indien rechthebbende ingezetene is van het openbaar lichaam Saba.
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel9
  - number: '10'
    text: |-
      1 Indien uit de door het Centraal Bureau voor de Statistiek vastgestelde consumentenprijsindexcijfers voor de
      openbare lichamen blijkt, dat het prijsindexcijfer voor het derde kwartaal van het lopende jaar, vergeleken met
      het prijsindexcijfer voor het derde kwartaal van het voorafgaande jaar is gestegen of gedaald, stelt Onze Minister
      bedragen vast, die met ingang van 1 januari van het komende jaar in de plaats treden van de in [artikel 9][ref1]
      genoemde bedragen. Onze Minister bepaalt welke consumentenprijsindexcijfers voor de toepassing van de eerste zin
      worden gebruikt. De consumentenprijsindexcijfers kunnen voor de onderscheiden openbare lichamen verschillend zijn.

      2 Indien er naar het oordeel van Onze Minister bijzondere omstandigheden zijn, kunnen de bedragen, bedoeld in het
      eerste lid, bij ministeriële regeling met ingang van een bij die regeling aan te geven datum worden verhoogd. Onze
      Minister kan het bestuurscollege van het betrokken openbaar lichaam in dat verband om advies vragen.

      3 Indien een wijziging als bedoeld in het tweede lid samenvalt met een herziening als bedoeld in het eerste lid,
      wordt het bedrag voorafgaande aan de wijziging herzien en geschiedt de wijziging bij de in het tweede lid bedoelde
      ministeriële regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0037347#Artikel9
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel10
