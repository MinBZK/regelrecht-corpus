  - number: '4'
    text: Onze Minister is belast met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel4
  - number: '5'
    text: |-
      1 De ingezetene heeft overeenkomstig de bepalingen van deze wet recht op kinderbijslag BES voor een kind dat:

      a. ingezetene is;

      b. jonger is dan 18 jaar; en

      c. tot zijn huishouden behoort.

      2 In afwijking van het eerste lid, onderdelen a en c, behoeft het kind geen ingezetene te zijn en niet tot het
      huishouden van de rechthebbende te behoren, indien het om onderwijsredenen, dan wel in verband met een ziekte of
      handicap geen ingezetene is en niet tot het huishouden van de rechthebbende behoort. Voor de toepassing van dit lid
      dient het betreffende kind ten minste vijf jaar ingezetene te zijn geweest.

      3 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot het tweede lid, waarbij kan worden
      bepaald dat in specifieke gevallen voor een kind met een ziekte of handicap van de termijn van vijf jaar kan worden
      afgeweken.

      4 Geen recht op kinderbijslag BES bestaat voor de vreemdeling die op grond van de
      [Wet toelating en uitzetting BES][ref1] niet rechtmatig in de openbare lichamen verblijft.

      5 Geen recht op kinderbijslag BES bestaat voor degene die een uitreiziger is dan wel voor diens kind dat een
      uitreiziger is.


      [ref1]: https://wetten.overheid.nl/BWBR0028571
    url: https://wetten.overheid.nl/BWBR0037347/2021-01-01#Artikel5
