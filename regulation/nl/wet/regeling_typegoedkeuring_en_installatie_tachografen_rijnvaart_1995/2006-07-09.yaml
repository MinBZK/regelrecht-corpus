---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_typegoedkeuring_en_installatie_tachografen_rijnvaart_1995
regulatory_layer: WET
publication_date: '2008-05-15'
valid_from: '2006-07-09'
bwb_id: BWBR0007382
url: https://wetten.overheid.nl/BWBR0007382/2006-07-09
preamble:
  text: |-
    Gelet op de Herziene Rijnvaartakte en op de resoluties van de Centrale Commissie voor de Rijnvaart, protocollen
    1988-I-36 en 1994-I-23;

    Voorts gelet op artikel 23.05 en bijlage H van het Reglement onderzoek schepen op de Rijn 1995 (Stcrt. 1995, 20);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#ArtikelAanhef
articles:
  - number: '1.1'
    text: Dienst Wegverkeer beslist op een verzoek om typegoedkeuring van een tachograaf.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel1
  - number: '1.2'
    text: Een verzoek om goedkeuring moet worden ingediend bij de Dienst Wegverkeer, Postbus 777, 2700 AT Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel1
  - number: '1.3'
    text: |-
      De Dienst Wegverkeer brengt de goedgekeurde typen tachografen onmiddellijk ter kennis van het secretariaat van de
      Centrale Commissie voor de Rijnvaart.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel1
  - number: '2'
    text: |-
      De typegoedkeuring kan worden verleend indien de tachograaf voldoet aan de voorschriften van de [bijlage H][ref1],
      [onderdeel A, van het Reglement onderzoek schepen op de Rijn 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007858
      - id: ref2
        bwb_id: BWBR0007858
  - number: '3.1'
    text: |-
      De tachograaf moet zodanig op het schip worden geïnstalleerd, dat alle met de tachograaf verband houdende
      bestanddelen deugdelijk tegen beschadiging zijn beschermd.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel3
  - number: '3.2'
    text: |-
      Bij de installatie moet worden voldaan aan de voorschriften van de [bijlage H][ref1],
      [onderdeel B, van het Reglement onderzoek schepen op de Rijn 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007858
      - id: ref2
        bwb_id: BWBR0007858
  - number: '4.1'
    text: De Dienst Wegverkeer beslist op een verzoek om
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel4
  - number: 4.1.a
    text: erkenning als installateur van tachografen;
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel4
  - number: 4.1.b
    text: erkenning als reparateur van tachografen.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel4
  - number: '4.2'
    text: Een verzoek om erkenning moet worden ingediend bij de Dienst Wegverkeer, Postbus 777, 2700 AT Zoetermeer.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel4
  - number: '5.1'
    text: Een erkenning wordt verleend aan in Nederland gevestigde fabrikanten of importeurs van tachografen.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel5
  - number: '5.2'
    text: Als importeur wordt aangemerkt de door de fabrikant van tachografen contractueel erkende importeur.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel5
  - number: '6'
    text: |-
      De Dienst Wegverkeer kan een erkenning als installateur of reparateur intrekken als aan de voorschriften in deze
      regeling of in het [Reglement onderzoek schepen op de Rijn 1995][ref1] niet wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '7.1'
    text: |-
      Een aan een fabrikant of importeur van tachografen verleende erkenning als installateur of reparateur van
      tachografen geldt tevens voor de door hem op verzoek gemachtigde installateurs en reparateurs.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel7
  - number: '7.2'
    text: |-
      Een machtiging mag eerst worden verleend als door deze installateurs en reparateurs wordt voldaan aan de
      voorschriften bedoeld in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007382#Artikel9
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007382
        artikel: '9'
        paragraaf: '5'
  - number: '8.1'
    text: |-
      De machtiging dient door de erkende fabrikant of importeur te worden ingetrokken indien blijkt dat aan de
      voorschriften bedoeld in [artikel 9][ref1] niet wordt voldaan of de voorschriften bedoeld in [artikel 3][ref2], dan
      wel de verplichting opgenomen in [artikel 11][ref3] niet wordt nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0007382#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007382#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0007382#Artikel11
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007382
        artikel: '9'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0007382
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007382
        artikel: '11'
        paragraaf: '7'
  - number: '8.2'
    text: |-
      Bij intrekking van de machtiging dient de fabrikant of importeur van tachografen daarvan onmiddellijk mededeling te
      doen aan de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel8
  - number: '9.1'
    text: |-
      De installatie, het onderzoek of de reparatie van tachografen mag slechts geschieden door installateurs
      respectievelijk reparateurs die zijn voorzien van:
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel9
  - number: 9.1.a
    text: een verzegelinrichting voorzien van een verzegelnummer;
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel9
  - number: 9.1.b
    text: door de fabrikant of importeur van tachografen voorgeschreven gereedschap en testapparatuur.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel9
  - number: '9.2'
    text: |-
      Het voor de installatie, het onderzoek of de reparatie van de tachograaf aangewezen personeel dient met goed gevolg
      een door de fabrikant of importeur van tachografen georganiseerde cursus te hebben gevolgd inzake constructie,
      functioneren, installatie, onderzoek en reparatie van tachografen.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel9
  - number: '9.3'
    text: Het personeel dient vervolgens tenminste eenmaal in de drie jaren een herhalingscursus te volgen.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel9
  - number: '9.4'
    text: |-
      Een door de fabrikant of importeur afgegeven bewijs van deelname aan de cursus dient in het bedrijf bij de
      installateur respectievelijk reparateur aanwezig te zijn.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel9
  - number: '10'
    text: |-
      De fabrikant of importeur van tachografen die in het bezit is van een erkenning als installateur of reparateur van
      tachografen is verplicht zorg te dragen dat:
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
  - number: 10.a
    text: aan de hem gemachtigde installateurs en reparateurs een verzegelnummer wordt toegekend;
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
  - number: 10.b
    text: |-
      aan de Dienst Wegverkeer een opgave wordt verstrekt van de door hem gemachtigde installateurs en reparateurs
      alsmede van het door hem gebezigde verzegelnummer of de door hem aan de gemachtigde installateurs en reparateurs
      toegekende verzegelnummers;
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
  - number: 10.c
    text: |-
      aan de Dienst Wegverkeer van de door hem aangebrachte wijzigingen van het bepaalde in onderdeel b onmiddellijk
      mededeling wordt gedaan;
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
  - number: 10.d
    text: 'de door hem gemachtigde installateurs en reparateurs in het bezit zijn van:'
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
  - number: 10.d.1
    text: |-
      de voorschriften bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007382#Artikel3
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007382
        artikel: '3'
        paragraaf: '2'
  - number: 10.d.2
    text: door hem uitgevaardigde technische instructies, werkaanwijzingen en mededelingen;
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
  - number: 10.e
    text: |-
      door hem wordt toegezien op de naleving van de voorschriften door de door hem gemachtigde installateurs en
      reparateurs.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel10
  - number: '11'
    text: |-
      Van de verklaring bedoeld in de [bijlage H][ref1],
      [onderdeel B, punt 6, van het Reglement onderzoek schepen op de Rijn 1995][ref2] dient de installateur een
      afschrift te bewaren gedurende zeven jaren na dagtekening daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007858
      [ref2]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007858
      - id: ref2
        bwb_id: BWBR0007858
  - number: '12.1'
    text: 'Voor een verzoek om typegoedkeuring van een tachograaf is een vergoeding verschuldigd van:'
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel12
  - number: 12.1.a
    text: |-
      indien de keuring plaats vindt door het beproevingslaboratorium van de Rijksdienst voor het Wegverkeer te
      Zoetermeer: f 2.525,00;
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel12
  - number: 12.1.b
    text: 'indien de keuring elders plaats vindt: f 2.125,00.'
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel12
  - number: '12.2'
    text: |-
      Voor een verzoek om erkenning als installateur of reparateur van een tachograaf is een vergoeding verschuldigd van
      f 500,00.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel12
  - number: '12.3'
    text: |-
      Een verzoek als bedoeld in het eerste of tweede lid wordt niet eerder in behandeling genomen dan nadat het daarvoor
      verschuldige bedrag is ontvangen op Postbankrekening nr. 507505 ten name van de Rijksdienst voor het Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel12
  - number: '13'
    text: |-
      De Inspectie Verkeer en Waterstaat is belast met het toezicht op de naleving van het bepaalde in deze regeling en
      in de [bijlage H van het Reglement onderzoek schepen op de Rijn 1995][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007858
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0007858
  - number: '14.1'
    text: |-
      De typegoedkeuring van tachografen verleend op grond van de Regeling typegoedkeuring en installatievoorschriften
      tachograaf internationale Rijnvaart van 13 maart 1989 (Stcrt. 56) wordt geacht te zijn verleend met inachtneming
      van [artikel 1][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007382#Artikel1
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007382
        artikel: '1'
        paragraaf: '1'
  - number: '14.2'
    text: |-
      Een niet ingetrokken erkenning als installateur of reparateur van tachografen verleend op grond van de Regeling
      typegoedkeuring en installatievoorschriften tachograaf internationale Rijnvaart wordt geacht te zijn verleend met
      inachtneming van [artikel 4][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007382#Artikel4
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007382
        artikel: '4'
        paragraaf: '3'
  - number: '15'
    text: |-
      De Regeling typegoedkeuring en installatievoorschriften tachograaf internationale Rijnvaart van 13 maart 1989
      (Stcrt. 56), de Regeling vaststelling vergoeding verzoek typegoedkeuring tachograaf internationale Rijnvaart van 18
      september 1989 (Stcrt. 204) en de Regeling vaststelling vergoeding verzoek erkenning als installateur of reparateur
      tachograaf internationale Rijnvaart van 18 september 1989 (Stcrt. 204) worden ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel15
  - number: '16'
    text: Deze regeling kan worden aangehaald als ’Regeling typegoedkeuring en installatie tachografen Rijnvaart 1995’.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel16
  - number: '17'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0007382/2006-07-09#Artikel17
