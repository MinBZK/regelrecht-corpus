---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_lozing_afvalwater_huishoudens
regulatory_layer: WET
publication_date: '2020-12-03'
valid_from: '2008-01-01'
bwb_id: BWBR0023015
url: https://wetten.overheid.nl/BWBR0023015/2008-01-01
preamble:
  text: |-
    Gelet op de artikelen 8, tweede lid, 9, tweede lid, en 11, tweede lid, van het Besluit lozing afvalwater
    huishoudens;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Een zuiveringsvoorziening bestaat uit een septic tank:'
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel1
  - number: 1.a
    text: met een nominale inhoud van ten minste 6 kubieke meter,
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel1
  - number: 1.b
    text: die voldoet aan NEN-EN 12566-1, en
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel1
  - number: 1.c
    text: met een hydraulisch rendement van ten hoogste 10 gram, bepaald overeenkomstig annex B van NEN-EN 12566-1.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel1
  - number: '2'
    text: |-
      Een zuiveringsvoorziening is goed toegankelijk, en wordt zo vaak als voor de goede werking daarvan nodig is
      onderhouden.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel2
  - number: '3'
    text: 'Een infiltratievoorziening wordt zodanig uitgevoerd en onderhouden, dat:'
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel3
  - number: 3.a
    text: |-
      het vanuit de zuiveringsvoorziening geloosde water in de infiltratievoorziening niet in direct contact met het
      grondwater komt,
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel3
  - number: 3.b
    text: de infiltratievoorziening geen hinder veroorzaakt, en
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel3
  - number: 3.c
    text: nadelige gevolgen voor de volksgezondheid worden voorkomen.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel3
  - number: '4.1'
    text: |-
      [Artikel 1][ref1] is niet van toepassing op een zuiveringsvoorziening die is geplaatst voor 1 januari 2009, indien
      die zuiveringsvoorziening bestaat uit een septic tank, die een nominale inhoud heeft van ten minste 6 kubieke
      meter, en waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0023015#Artikel1
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023015
        artikel: '1'
  - number: 4.1.a
    text: de septic tank uit drie compartimenten bestaat,
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de nominale inhoud, in de stroomrichting, over de compartimenten is verdeeld in de verhouding twee staat tot één
      staat tot één,
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de scheidingswanden tussen de compartimenten van de septic tank ten minste 20 centimeter boven het waterniveau
      uitsteken,
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.d
    text: |-
      de instroomopening in het eerste compartiment van de septic tank zich ten minste 10 centimeter boven het
      waterniveau bevindt,
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.e
    text: de toevoerpijp ten minste 5 centimeter en ten hoogste 10 centimeter uit de binnenwand steekt,
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.f
    text: |-
      de doorstroomopeningen in scheidingswanden tussen de compartimenten van de septic tank zodanig zijn uitgevoerd,
      dat:
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.f.1°
    text: doorvoer van bodemslib en drijflagen wordt voorkomen;
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.f.2°
    text: |-
      de gezamenlijke oppervlakte van de doorstroomopeningen per scheidingswand ten minste 100 vierkante centimeter en
      ten hoogste 400 vierkante centimeter bedraagt;
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.f.3°
    text: de bovenkant van de doorstroomopeningen ten minste 30 centimeter onder het waterniveau ligt; en
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.f.4°
    text: |-
      de onderkant van de doorstroomopeningen hoger ligt dan de helft van de waterhoogte gemeten vanaf de bodem van de
      septic tank
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.g
    text: |-
      de afvoeropening van een septic tank voorzien is van een duikschot of een T-stuk, zodat afvoer van bodemslib of
      drijflagen wordt voorkomen, en
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.h
    text: 'de waterhoogte in een septic tank ten minste 1,2 meter bedraagt en ten hoogste bedraagt:'
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.h.1°
    text: 2,2 meter bij een inhoud van ten hoogste 10 kubieke meter;
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: 4.1.h.2°
    text: 2,5 meter bij een inhoud van meer dan 10 kubieke meter.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: '4.2'
    text: |-
      Indien afzonderlijke septic tanks als bedoeld in het eerste lid parallel zijn geschakeld, bedraagt de gezamenlijke
      nominale inhoud tenminste 6 kubieke meter en voldoet iedere tank afzonderlijk aan de voorschriften genoemd in het
      eerste lid, onder a tot en met h.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: '4.3'
    text: |-
      Opdeling van de septic tank als bedoeld in het eerste lid in afzonderlijke in serie geschakelde tanks is
      toegestaan, mits de nominale inhoud van één compartiment niet over verschillende tanks is verdeeld. De
      afzonderlijke septic tanks gelden tezamen als één septic tank.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel4
  - number: '5'
    text: |-
      Met zuiveringsvoorzieningen en infiltratievoorzieningen als bedoeld in deze regeling worden gelijkgesteld
      zuiveringsvoorzieningen en infiltratievoorzieningen die rechtmatig zijn vervaardigd of in de handel zijn gebracht
      in een andere lidstaat van de Europese Unie dan wel rechtmatig zijn vervaardigd of in de handel zijn gebracht in
      een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede daartoe
      strekkend verdrag dat Nederland bindt, en die voldoen aan eisen die een beschermingsniveau bieden dat ten minste
      gelijkwaardig is aan het niveau dat met de nationale eisen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel5
  - number: '6'
    text: Deze regeling treedt in werking met ingang van 1 januari 2008.
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel6
  - number: '7'
    text: 'Deze regeling wordt aangehaald als: Regeling lozing afvalwater huishoudens.'
    url: https://wetten.overheid.nl/BWBR0023015/2008-01-01#Artikel7
