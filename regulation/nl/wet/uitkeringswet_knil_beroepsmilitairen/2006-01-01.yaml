preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een voorziening te treffen houdende een eenmalige
    financiële compensatie voor beroepsmilitairen die ten minste vijf maar minder dan vijftien jaren bij het voormalige
    KNIL in werkelijke dienst zijn geweest en daarvoor geen pensioen, dan wel uitkering bij wijze van pensioen
    ontvangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. militair: degene die onder de vlag van het Koninkrijk der Nederlanden als beroepsmilitair in werkelijke dienst
      is geweest bij het Koninklijk Nederlands-Indisch Leger/Koninklijk Nederlands-Indonesisch Leger (KNIL), tijdens
      de vervulling van die dienst Nederlander was of in die periode geen Nederlander was maar thans op grond van de
      Wet betreffende de positie van de Molukkers bij de toepassing van de Nederlandse wetgeving als Nederlander wordt
      behandeld, en die na afloop van zijn diensttijd naar Nederland is vertrokken of teruggekeerd dan wel door de zorg
      van de Nederlandse regering is overgebracht naar Nederland;

      b. werkelijke dienst: de door de militair vóór 26 juli 1950 bij het KNIL doorgebrachte diensttijd, voor zover die
      tijd voor Indonesisch pensioen in aanmerking zou zijn gekomen;

      c. weduwe: degene die in het tijdvak van de werkelijke dienst met de militair was gehuwd en die naar Nederland is
      vertrokken of teruggekeerd dan wel door de zorg van de Nederlandse regering is overgebracht naar Nederland;

      d. stichting: de Stichting Administratie Indonesische Pensioenen.
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel1
  - number: '2'
    text: |-
      De gewezen militair die een werkelijke dienst aantoont van ten minste vijf maar minder dan vijftien jaren en
      voor wie geen recht of uitzicht bestaat op vergelding van die tijd met enig pensioen of uitkering bij wijze van
      pensioen, en die in de periode voor de inwerkingtreding van deze wet ten minste één jaar onafgebroken in Nederland
      gevestigd is geweest, heeft aanspraak op een eenmalige uitkering ten bedrage van € 3 403,35.
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel2
  - number: '3'
    text: |-
      Indien de in [artikel 2][ref1] genoemde aanspraak in verband met het overlijden van de militair niet kan worden
      geëffectueerd, heeft de weduwe recht op een eenmalige uitkering, gelijk aan het bedrag dat wordt gevonden door het
      bedrag van € 3 403,35 te vermenigvuldigen met een breuk, waarvan de teller gelijk is aan dat deel van de werkelijke
      dienst waarin zij met de militair gehuwd is geweest en de noemer gelijk is aan de werkelijke dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0009473#Artikel2
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009473
        artikel: '2'
  - number: '4'
    text: |-
      1 Een uitkering ingevolge deze wet wordt door de stichting op aanvraag verleend. De aanvraag moet binnen twee jaren
      na de datum van inwerkingtreding van deze wet bij de stichting worden ingediend.

      2 De voor de uitvoering van deze wet door de stichting benodigde middelen komen eenmalig in 1998 ten laste van
      de rijksbegroting.
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel4
  - number: '5'
    text: |-
      De gemeentebesturen en ambtenaren van de burgerlijke stand zijn verplicht op een door de stichting aan te geven
      wijze desgevraagd kosteloos inlichtingen te verschaffen en overigens ook alle medewerking te verlenen, benodigd
      voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel5
  - number: '6'
    text: |-
      De over de uitkering verschuldigde belasting ingevolge de [Wet inkomstenbelasting 2001][ref1] en
      de [Wet op de loonbelasting 1964][ref2] alsmede de premie voor de volksverzekeringen ingevolge de
      [Wet financiering sociale verzekeringen][ref3], komen ten laste van de stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0011353
      [ref2]: https://wetten.overheid.nl/BWBR0002471
      [ref3]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011353
      - id: ref2
        bwb_id: BWBR0002471
      - id: ref3
        bwb_id: BWBR0017745
  - number: '7'
    text: |-
      De uitkering blijft buiten beschouwing bij de verlening van bijstand ingevolge de [Wet werk en bijstand][ref1] en
      andere, op het inkomen van de rechthebbende afgestemde publiekrechtelijke uitkeringen of verstrekkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '8'
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel8
  - number: '9'
    text: 'Deze wet wordt aangehaald als: Uitkeringswet KNIL-beroepsmilitairen.'
    url: https://wetten.overheid.nl/BWBR0009473/2006-01-01#Artikel9
