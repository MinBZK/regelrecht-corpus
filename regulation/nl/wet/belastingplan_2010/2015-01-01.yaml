  - number: XXXVIII
    text: |-
      Ingeval de samenloop van wetten die in 2009 in het Staatsblad zijn of worden gepubliceerd en wijzigingen aanbrengen
      in één of meer belastingwetten, niet of niet juist is geregeld, of indien als gevolg van die samenloop onjuistheden
      ontstaan in de aanduiding van artikelen, artikelonderdelen, verwijzingen en dergelijke in de desbetreffende wetten,
      kunnen die wetten op dit punt bij ministeriële regeling worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0026958/2015-01-01#ArtikelXXXVIII
  - number: XXXIX
    text: |-
      1 Deze wet treedt in werking met ingang van 1 januari 2010, met dien verstande dat:

      a. [artikel I, onderdelen B, C, H, S, T, U, V en X][ref1], eerst toepassing vindt nadat
      [artikel 10.1 van de Wet inkomstenbelasting 2001][ref2] bij het begin van het kalenderjaar 2010 is toegepast;

      b. [artikel III, onderdelen D, E, G en H][ref3], eerst toepassing vindt nadat
      [artikel 22d van de Wet op de loonbelasting 1964][ref4] bij het begin van het kalenderjaar 2010 is toegepast;

      c. de wijzigingen ingevolge [artikel VII, onderdelen D en E][ref5], terugwerken tot en met 1 januari 2009 en
      slechts toepassing vinden met betrekking tot verliezen van jaren die zijn aangevangen op of na 1 januari 2009;

      d. de wijziging ingevolge [artikel IX][ref6] toepassing vindt met betrekking tot verliezen van jaren die zijn
      aangevangen op of na 1 januari 2012;

      e. de wijzigingen ingevolge [artikel XXV, onderdeel A][ref7], voor het eerst toepassing vinden met betrekking tot
      belastingaanslagen die zijn opgelegd op grond van belastbare feiten in de zin van de [Successiewet 1956][ref8] die
      zich hebben voorgedaan na 31 december 2009;

      f. de wijzigingen ingevolge [artikel XXV, onderdelen C, D en E][ref9], voor het eerst toepassing vinden met
      betrekking tot verzuimen die zijn begaan op of na 1 januari 2010;

      g. het in [artikel XXV, onderdeel F][ref10], opgenomen
      [artikel 67ca van de Algemene wet inzake rijksbelastingen][ref11] geen toepassing vindt met betrekking tot
      verzuimen begaan vóór 1 januari 2010, indien ter zake een strafvervolging is ingesteld en het onderzoek ter
      terechtzitting een aanvang heeft genomen;

      h. de wijziging ingevolge [artikel XXVI, onderdeel D][ref12], voor het eerst toepassing vindt met betrekking tot
      verzuimen die zijn begaan op of na 1 januari 2011.

      2 In afwijking van het eerste lid treedt [artikel I, onderdelen F en G][ref13], in werking op een bij koninklijk
      besluit te bepalen tijdstip waarbij terugwerkende kracht kan worden verleend tot en met 1 januari 2010.

      3 [Artikel I, onderdeel O][ref14], werkt terug tot en met 30 december 2009.

      4 In afwijking van het eerste lid treedt [artikel XIXA][ref15] in werking op een bij koninklijk besluit te bepalen
      tijdstip waarbij terugwerkende kracht kan worden verleend tot en met 1 januari 2010.


