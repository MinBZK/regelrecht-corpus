  - number: XXIVa
    text: |-
      1 De accijns op sigaretten wordt met ingang van 1 maart 2010 zodanig verhoogd dat de totale accijns voor de meest
      gevraagde prijsklasse sigaretten € 4,70 per 1000 stuks hoger zal liggen dan het accijnsbedrag voor deze prijsklasse
      op 28 februari 2010. Indien met ingang van 1 maart 2010 het aldus berekende accijnsbedrag lager is dan het bedrag
      dat overeenkomt met 57 percent van de kleinhandelsprijs van de meest gevraagde prijsklasse sigaretten, berekend per
      1000 stuks, geldt het laatstbedoelde bedrag.

      2 Bij ministeriële regeling worden met ingang van 1 maart 2010 de tarieven van de accijns, bedoeld in
      [artikel 35, eerste lid, onderdeel b, van de Wet op de accijns][ref1] aangepast. De aanpassing geschiedt zodanig
      dat voor sigaretten van de meest gevraagde prijsklasse het specifieke gedeelte van de accijns 50% bedraagt van de
      som van de totale accijns en de omzetbelasting. Daarbij dient het bedrag van de totale accijns gelijk te blijven
      aan het bedrag van de totale accijns dat na de verhoging van de accijns verschuldigd zou zijn zonder de aanpassing.
      De aanpassing van het bedrag dat in artikel 35, eerste lid, onderdeel b, is opgenomen als de ten minste te betalen
      accijns voor 1000 stuks sigaretten, geschiedt zodanig dat deze accijns na de aanpassing van de tarieven bedraagt
      het totale bedrag van de accijns voor 1000 stuks sigaretten van de meest gevraagde prijsklasse. Bij de aanpassing
      vindt afronding plaats van het procentuele gedeelte van de accijns op honderdsten van een percent.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel35
    url: https://wetten.overheid.nl/BWBR0026958/2015-01-01#ArtikelXXIVa
