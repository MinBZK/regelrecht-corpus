  - number: IV
    text: '[Vervallen]'
    url: https://wetten.overheid.nl/BWBR0026958/2015-01-01#ArtikelIV
  - number: VIII
    text: |-
      Met betrekking tot immateriële activa die na 31 december 2007, maar voor 1 januari 2010 tot de bedrijfsmiddelen
      van de belastingplichtige zijn gaan behoren en waarvoor aan hem een S&O-verklaring is afgegeven als
      bedoeld in de [Wet vermindering afdracht loonbelasting en premie voor de volksverzekeringen][ref1], blijft
      [artikel 12b van de Wet op de vennootschapsbelasting 1969][ref2] zoals dat luidde op 31 december 2009 van
      toepassing, met dien verstande dat de vanaf 1 januari 2010 behaalde voordelen uit hoofde van die activa slechts
      voor 5/H gedeelte in aanmerking worden genomen.


