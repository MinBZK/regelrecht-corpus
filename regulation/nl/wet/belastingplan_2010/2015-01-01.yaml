  - number: XXXIII
    text: |-
      De wijziging ingevolge [artikel I, onderdeel N][ref1], van
      [artikel 3.111, tweede lid, van de Wet inkomstenbelasting 2001][ref2] is niet van toepassing op gevallen waarin
      het genereren van inkomen uit sparen en beleggen uit de woning reeds is aangevangen vóór 1 januari 2010, tenzij de
      belastingplichtige akkoord gaat met bij ministeriële regeling te stellen voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0026958#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.111
    url: https://wetten.overheid.nl/BWBR0026958/2015-01-01#ArtikelXXXIII
