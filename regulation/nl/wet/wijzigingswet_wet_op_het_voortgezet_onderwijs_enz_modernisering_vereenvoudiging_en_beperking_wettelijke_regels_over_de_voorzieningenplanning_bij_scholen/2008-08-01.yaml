  - number: V
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt, in overeenstemming met Onze Minister van Landbouw, Natuur
      en Voedselkwaliteit, binnen vijf jaar nadat deze wet in werking is getreden aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0024243/2008-08-01#ArtikelV
  - number: VI
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0024243/2008-08-01#ArtikelVI
