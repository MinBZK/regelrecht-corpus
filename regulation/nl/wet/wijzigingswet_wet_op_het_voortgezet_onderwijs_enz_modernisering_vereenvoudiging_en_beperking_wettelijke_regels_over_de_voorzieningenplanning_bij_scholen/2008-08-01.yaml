preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wettelijke regels over de planning van
    onderwijsvoorzieningen in het voortgezet onderwijs te moderniseren, te vereenvoudigen en in aantal te beperken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024243/2008-08-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Na inwerkingtreding van deze wet vindt nog één maal vaststelling plaats van een plan van scholen conform
      [titel III, afdeling I, van de Wet op het voortgezet onderwijs][ref1] zoals luidend voor de inwerkingtreding van
      deze wet.

      2 Een school die is vermeld op het laatste plan van scholen dat is vastgesteld voor inwerkingtreding van deze wet
      en ten aanzien waarvan op dat tijdstip nog niet is beslist over aanvang van de bekostiging of die is vermeld op
      het plan van scholen dat is vastgesteld op grond van het eerste lid, wordt aangemerkt als een school waarvoor Onze
      Minister van Onderwijs, Cultuur en Wetenschap of Onze Minister van Landbouw, Natuur en Voedselkwaliteit op grond
      van [artikel 65 van de Wet op het voortgezet onderwijs][ref2] zoals luidend door [artikel I, onderdeel P][ref3],
      van deze wet heeft beslist dat zij voor bekostiging uit ’s Rijks kas in aanmerking wordt gebracht. De bekostiging
      van een school die bij inwerkingtreding van deze wet op het in de eerste volzin bedoelde plan van scholen staat,
      vangt aan op 1 augustus van enig kalenderjaar en niet eerder dan een jaar nadat het bevoegd gezag heeft aangetoond
      dat burgemeester en wethouders van de desbetreffende gemeente de benodigde huisvesting voor het eind van dat jaar
      ter beschikking zullen stellen, doch uiterlijk in het zesde kalenderjaar nadat de school voor het eerst zonder
      jaartal op bedoeld plan is geplaatst. De vorige volzinnen zijn van overeenkomstige toepassing op een afdeling voor
      voorbereidend beroepsonderwijs.

      3 Indien een bevoegd gezag met ten minste één ander bevoegd gezag samen is gaan werken als bedoeld
      in [artikel 72, eerste lid, van de Wet op het voortgezet onderwijs][ref4] zoals luidend door
      [artikel I, onderdeel P][ref5], van deze wet, laat Onze Minister een aanvraag voor een verplaatsing of
      nevenvestiging buiten behandeling of buiten verdere behandeling, voor zover de aanvraag betrekking heeft op een
      school of een vestiging van een school waarvoor het bevoegd gezag deelneemt aan die samenwerking.

      4 Een afdeling voor praktijkonderwijs als bedoeld in
      [artikel 10f, eerste lid, van de Wet op het voortgezet onderwijs][ref6] zoals luidend voor de inwerkingtreding
      van deze wet wordt aangemerkt als een school die voor bekostiging in aanmerking is gebracht op grond van
      [artikel 65 van de Wet op het voortgezet onderwijs][ref7] zoals luidend door [artikel I, onderdeel P][ref8],
      van deze wet. Een school als bedoeld in de eerste volzin, maakt vanaf dat moment onderdeel uit van een
      scholengemeenschap met de school of scholengemeenschap waarvan die school voorheen een afdeling was.

      5 Een school waarop als gevolg van [artikel 107 van de Wet op het voortgezet onderwijs][ref9] zoals luidend door
      [artikel I, onderdeel S][ref10], van deze wet een hogere opheffingsnorm van toepassing is dan bij inwerkingtreding
      van deze wet het geval was, wordt als gevolg van die hogere norm wat een openbare school betreft niet eerder
      opgeheven en verliest wat een bijzondere school betreft de aanspraak op bekostiging niet eerder dan nadat ten
      minste vijf jaren zijn verstreken na inwerkingtreding van deze wet.

      6 Een samenwerkingsovereenkomst gesloten in het kader van een regionaal arrangement op grond van een
      beleidsregel van Onze Minister van Onderwijs, Cultuur en Wetenschap of Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit ex [artikel 75 van de Wet op het voortgezet onderwijs][ref11] zoals luidend
      voor de inwerkingtreding van deze wet, wordt voor de resterende looptijd aangemerkt als uiting van een
      samenwerking als bedoeld in [artikel 72 van de Wet op het voortgezet onderwijs][ref12] zoals luidend door
      [artikel I, onderdeel P, van deze wet][ref13], met dien verstande dat de resterende looptijd wordt beperkt tot
      ten hoogste vijf jaar. Indien de resterende looptijd van een regionaal arrangement minder bedraagt dan twee jaar
      alsmede indien de looptijd van een regionaal arrangement afloopt op de dag voor of de dag van inwerkingtreding van
      deze wet, wordt deze op twee jaar gesteld.

      7 [Artikel 75 van de Wet op het voortgezet onderwijs][ref14] en de daarop berustende bepalingen in lagere
      regelgeving zoals luidend voor de inwerkingtreding van deze wet blijven, voor zover het betreft verplaatsingen en
      nevenvestigingen, tot twee jaar na het tijdstip van inwerkingtreding van deze wet van toepassing op die gevallen
      waarin geen sprake is van een samenwerkingsovereenkomst gesloten in het kader van een regionaal arrangement als
      bedoeld in het zesde lid. Van de vervallen voorschriften die bij beleidsregel zijn vastgesteld en die op grond van
      de eerste volzin van toepassing blijven, kan worden afgeweken bij beleidsregel.

      8 Een bevoegd gezag dat op grond van de
      [Regeling aanvullende personele bekostiging nevenvestigingen met spreidingsnoodzaak VO][ref15]
      voor de inwerkingtreding van deze wet aanspraak had op aanvullende personele bekostiging ex
      [artikel 85a van de Wet op het voortgezet onderwijs][ref16], behoudt deze aanspraak na inwerkingtreding van deze
      wet zo lang wordt voldaan aan de voorwaarden die zijn opgenomen in genoemde regeling.

      9 Onze Minister kan voor bekostiging als nevenvestiging als bedoeld in
      [artikel 16 van de Wet op het voortgezet onderwijs][ref17] zoals luidend door [artikel I, onderdeel L][ref18],
      van deze wet in aanmerking brengen een dislocatie op grond van een beleidsregel van Onze Minister
      van Onderwijs, Cultuur en Wetenschap of Onze Minister van Landbouw, Natuur en Voedselkwaliteit ex
      [artikel 75 van de Wet op het voortgezet onderwijs][ref19] zoals luidend voor de inwerkingtreding van deze wet,
      indien daartoe door het bevoegd gezag een aanvraag is ingediend en de dislocatie is gelegen op een hemelsbreed
      gemeten afstand van drie kilometer of meer van de hoofdvestiging van de school. Onze Minister kan voor bekostiging
      als tijdelijke nevenvestiging als bedoeld in [artikel 16 van de Wet op het voortgezet onderwijs][ref20] zoals
      luidend door [artikel I, onderdeel L][ref21], van deze wet in aanmerking brengen een dislocatie op grond
      van een beleidsregel van Onze Minister van Onderwijs, Cultuur en Wetenschap of Onze Minister van Landbouw,
      Natuur en Voedselkwaliteit ex [artikel 75 van de Wet op het voortgezet onderwijs][ref22] zoals luidend voor de
      inwerkingtreding van deze wet, indien daartoe door het bevoegd gezag een aanvraag is ingediend en de dislocatie is
      gelegen op een hemelsbreed gemeten afstand van minder dan drie kilometer van de hoofdvestiging van de school.

      10 Indien sprake is van een dislocatie die niet op grond van het negende lid is omgezet in een nevenvestiging of
      in een tijdelijke nevenvestiging, worden leerlingen die onderwijs volgen op de desbetreffende dislocatie na een
      termijn van vijf jaren na inwerkingtreding van deze wet niet meer meegenomen in de leerlingentelling als bedoeld in
      [hoofdstuk 1, titel 2, paragraaf 2 van het Bekostigingsbesluit W.V.O][ref23].

      11 Een erkende locatie vbo-groen aan een agrarisch opleidingscentrum als bedoeld in de
      [Wet educatie en beroepsonderwijs][ref24] op grond van een beleidsregel van Onze Minister van
      Onderwijs, Cultuur en Wetenschap of Onze Minister van Landbouw, Natuur en Voedselkwaliteit ex
      [artikel 75 van de Wet op het voortgezet onderwijs][ref25] zoals luidend voor de inwerkingtreding van deze wet,
      wordt aangemerkt als nevenvestiging als bedoeld in [artikel 16 van de Wet op het voortgezet onderwijs][ref26]
      zoals luidend door [artikel I, onderdeel L][ref27], van deze wet. De eerste volzin is van toepassing
      op een erkende locatie aan een scholengemeenschap die zowel een regionaal opleidingencentrum als
      bedoeld in de [Wet educatie en beroepsonderwijs][ref28] als een of meer scholen als bedoeld in de
      [Wet op het voortgezet onderwijs][ref29] omvat.

      12 Op een vestiging van een school die is gevormd bij of krachtens de [Wet op het voortgezet onderwijs][ref30]
      zoals luidend voor de inwerkingtreding van deze wet, alsmede op een afdeling, dislocatie of erkende
      locatie die op grond van deze wet een school, een nevenvestiging of een tijdelijke nevenvestiging is
      geworden, wordt na de inwerkingtreding van deze wet onderwijs verzorgd in dezelfde schoolsoorten als
      bedoeld in [artikel 5 van de Wet op het voortgezet onderwijs][ref31], in dezelfde afdelingen als bedoeld in
      [artikel 10c van die wet][ref32] en in dezelfde leerjaren als voor de inwerkingtreding behoudens wijzigingen in
      het onderwijsaanbod op grond van bepalingen inzake de voorzieningenplanning in het voortgezet onderwijs bij of
      krachtens de [Wet op het voortgezet onderwijs][ref33]. De eerste volzin is van overeenkomstige toepassing bij
      scholen en agrarische opleidingscentra wat betreft de gemengde leerweg.

      13 Onverminderd het twaalfde lid wordt een nevenvestiging die is gevormd bij of krachtens de
      [Wet op het voortgezet onderwijs][ref34] zoals luidend voor de inwerkingtreding van deze wet aangemerkt als een
      nevenvestiging op grond van [artikel 16, tweede lid, van de Wet op het voortgezet onderwijs][ref35] zoals luidend
      door [artikel I, onderdeel L][ref36], van deze wet.

      14 Een tijdelijke nevenvestiging mavo die voor een bepaald tijdvak is gevormd op grond van een beleidsregel ex
      [artikel 75 van de Wet op het voortgezet onderwijs][ref37] zoals luidend voor de inwerkingtreding van deze wet,
      wordt voor de resterende duur van dat tijdvak aangemerkt als een tijdelijke nevenvestiging middelbaar algemeen
      voortgezet onderwijs op grond van deze wet onder de voorwaarde dat de instelling de vereiste gegevens verstrekt
      over het effect op de doorstroming in de beroepskolom en de groene invulling van de theoretische leerweg die nodig
      zijn voor de evaluatie van het experiment.

      15 Op geschillen die in bezwaar, beroep of hoger beroep aanhangig zijn of binnen de bezwaar- dan wel beroepstermijn
      dan wel verschoonbaar daarbuiten aanhangig worden gemaakt tegen besluiten die zijn genomen door de Minister van
      Onderwijs, Cultuur en Wetenschap of de Minister van Landbouw, Natuur en Voedselkwaliteit op grond van het eerste
      lid of op grond van [titel III, afdelingen I][ref38] en [III, van de Wet op het voortgezet onderwijs][ref39] en
      daarop berustende bepalingen zoals luidend op de dag voor de inwerkingtreding van de desbetreffende onderdelen van
      deze wet blijven de op die datum geldende regelingen van toepassing. Indien de uitspraak op een beroep als bedoeld
      in [artikel 72 van de Wet op het voortgezet onderwijs][ref40] zoals luidend voor de inwerkingtreding van deze wet
      strekt tot opneming van een school in het plan van scholen, is het tweede lid van overeenkomstige toepassing. De
      eerste volzin is hangende het bezwaar, beroep of hoger beroep van overeenkomstige toepassing op de bevoegdheid tot
      het intrekken en vervangen van besluiten die tot de aldaar bedoelde geschillen hebben geleid. De tweede volzin is
      van overeenkomstige toepassing op een afdeling voor voorbereidend beroepsonderwijs.

      16 Bij ministeriële regeling kunnen nadere voorschriften worden vastgesteld ten behoeve van een goede invoering van
      deze wet.


