---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaatbesluit_ministerie_van_justitie_en_veiligheid
regulatory_layer: WET
publication_date: '2024-08-28'
valid_from: '2024-08-29'
bwb_id: BWBR0041519
url: https://wetten.overheid.nl/BWBR0041519/2024-08-29
preamble:
  text: |-
    Handelende in overeenstemming met de Minister voor Rechtsbescherming en de Staatssecretaris van Justitie en
    Veiligheid;

    Gelet op de artikelen 10:3, 10:9, eerste lid, en 10:12 van de Algemene wet bestuursrecht en artikel 4, eerste lid,
    onderdeel b, van het Algemeen Rijksambtenarenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit en de daarop berustende bepalingen wordt verstaan onder: - *bewindspersoon:* Minister van Justitie
      en Veiligheid, Minister voor Rechtsbescherming of Staatssecretaris van Justitie en Veiligheid, afhankelijk van wie
      het aangaat;
        - *clusters:* dienstonderdelen, genoemd in [artikel 2, tweede lid, van het Organisatiebesluit][ref1];
        - *ministerie:* Ministerie van Justitie en Veiligheid;
        - *Organisatiebesluit:* [Organisatiebesluit Ministerie van Justitie en Veiligheid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040293
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040293
  - number: '2'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van de tot de verantwoordelijkheid van de
      bewindspersoon behorende aangelegenheden, met uitzondering van de bevoegdheid tot het nemen van besluiten die zijn
      neergelegd in een document, gericht tot:
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.a
    text: de Koning;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.b
    text: de raad van ministers van het Koninkrijk, de ministerraad of een daaruit gevormde onderraad of commissie;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.c
    text: een minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.d
    text: een autoriteit in binnen- of buitenland, gelijk of hoger in rang dan een minister of staatssecretaris;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.e
    text: de voorzitter van de Eerste of Tweede Kamer der Staten-Generaal of van een uit die Kamer gevormde commissie;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.f
    text: de vice-president van de Raad van State van het Koninkrijk of de vice-president van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.g
    text: de president van de Algemene Rekenkamer; of
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: 2.h
    text: |-
      de Nationale ombudsman, indien de strekking daarvan is dat aan een aanbeveling van de Nationale ombudsman geen
      gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel2
  - number: '3.1'
    text: 'De secretaris-generaal kan ondermandaat verlenen aan:'
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
  - number: 3.1.a
    text: |-
      de hoofden van de clusters, genoemd in [artikel 2, tweede lid, van het Organisatiebesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
  - number: 3.1.b
    text: |-
      de hoofden van de diensten en baten-lastenagentschappen, genoemd in de
      [artikelen 2, derde lid, van het Organisatiebesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
  - number: 3.1.c
    text: |-
      de hoofden van de dienstonderdelen, genoemd in [artikel 4, tweede lid, van het Organisatiebesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel4
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '4'
  - number: 3.1.d
    text: |-
      andere bij het ministerie werkzame ambtenaren, voor zover zij niet ressorteren onder een van de hoofden bedoeld in
      de voorgaande leden.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
  - number: '3.2'
    text: Het ondermandaat kan steeds één hiërarchisch niveau verder worden doorgegeven.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
  - number: '3.3'
    text: |-
      In afwijking van het tweede lid kunnen de hoofden van de clusters, genoemd in
      [artikel 2, tweede lid, onderdelen a en b van het Organisatiebesluit][ref1], het (onder)mandaat inzake
      besluiten en klachtenprocedures op grond van de Algemene verordening gegevensbescherming, verzoeken op grond
      van de [Wet open overheid][ref2], verzoeken op grond van de [Wet hergebruik van overheidsinformatie][ref3],
      klachten, subsidiebesluiten, beleidsregels en, met inachtneming van [artikel 2, onderdeel h][ref4], Nationale
      ombudsmanprocedures doorgeven aan de directeur Wetgeving en Juridische Zaken. Het ondermandaat kan steeds één
      hiërarchisch niveau verder worden doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0045754
      [ref3]: https://wetten.overheid.nl/BWBR0036795
      [ref4]: https://wetten.overheid.nl/BWBR0041519#Artikel2
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0045754
      - id: ref3
        bwb_id: BWBR0036795
      - id: ref4
        bwb_id: BWBR0041519
        artikel: '2'
  - number: '3.4'
    text: |-
      In afwijking van het tweede lid kunnen de hoofden van de clusters, genoemd in
      [artikel 2, tweede lid, van het Organisatiebesluit][ref1], hun (onder)mandaat inzake de aangelegenheden, bedoeld
      in [artikel 5, tweede lid, onderdeel a, van het Organisatiebesluit][ref2], doorgeven aan de directeur Wetgeving en
      Juridische Zaken. Het ondermandaat kan steeds één hiërarchisch niveau verder worden doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040293#Artikel5
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040293
        artikel: '5'
  - number: '3.5'
    text: 'In afwijking van het tweede lid kan (onder)mandaat verder dan één hiërarchisch niveau doorgeven worden door:'
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
  - number: 3.5.a
    text: |-
      de secretaris-generaal alsmede de hoofden van de clusters, genoemd in
      [artikel 2, tweede lid, van het Organisatiebesluit][ref1], en de hoofden van de diensten en baten-
      lastenagentschappen, genoemd in artikel 2, derde lid, van het Organisatiebesluit, en de door deze aan te wijzen
      hoofden van andere dienstonderdelen voor zover het betreft het nemen van besluiten inzake financieel beheer en het
      nemen van rechtspositionele besluiten ten aanzien van onder hen ressorterende ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
  - number: 3.5.b
    text: |-
      de secretaris-generaal alsmede het hoofd van het cluster, genoemd in
      [artikel 2, tweede lid, onderdeel f, van het Organisatiebesluit][ref1], het hoofd van de dienst, genoemd in artikel
      2, derde lid, onderdeel a, onder 1°, van het Organisatiebesluit, en het hoofd van het baten-lastenagentschap,
      genoemd in artikel 2, derde lid, onderdeel b, onder 4°, van het Organisatiebesluit, en de door deze aan te
      wijzen hoofden van andere dienstonderdelen voor zover het betreft het nemen van besluiten op het terrein van de
      vreemdelingenwetgeving en van de [Rijkswet op het Nederlanderschap][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0003738
  - number: '3.6'
    text: |-
      In afwijking van het tweede lid kan het hoofd van de dienst als bedoeld in
      [artikel 2, derde lid, onderdeel a, onder 4, van het Organisatiebesluit][ref1] zijn ondermandaat inzake de
      aangelegenheden, bedoeld in [artikel 5, tweede lid, onderdeel a, van het Organisatiebesluit][ref2], doorgeven
      aan de directeur Wetgeving en Juridische Zaken. Het ondermandaat kan steeds één hiërarchisch niveau verder worden
      doorgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040293#Artikel5
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040293
        artikel: '5'
  - number: '4'
    text: |-
      De secretaris-generaal wordt aangewezen als de vertegenwoordiger van de werkgever in de zin van paragraaf 1.2 van
      de CAO Rijk en als de hoogste ambtelijk leidinggevende in de zin van paragraaf 27.2 van de CAO Rijk ten aanzien van
      ambtenaren werkzaam bij het Ministerie van Justitie en Veiligheid.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel4
  - number: '5'
    text: |-
      Besluiten inzake aanstelling, ontslag, bevordering of verplaatsing van ambtenaren op managementfuncties in schaal
      14 en hoger behoeven de instemming van het Centraal Loopbaanberaad van het Ministerie van Justitie en Veiligheid,
      tenzij de secretaris-generaal anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel5
  - number: '6.1'
    text: |-
      De directeur Personeel en Organisatie draagt zorg voor de toegankelijkheid van de ondermandaten die zijn verleend
      aan ambtenaren, werkzaam bij de dienstonderdelen genoemd in [artikel 2, tweede lid, onderdelen a en b][ref1] en
      [artikel 2, derde lid van het Organisatiebesluit Ministerie van Justitie en Veiligheid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040293#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0040293#Artikel2
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0040293
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0040293
        artikel: '2'
  - number: '7.1'
    text: |-
      Voor de toepassing van dit besluit en de op grond daarvan verleende en doorgegeven ondermandaten worden met mandaat
      en ondermandaat gelijkgesteld de verlening en het doorgeven van:
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel7
  - number: 7.1.a
    text: volmacht om in naam van de bewindspersoon privaatrechtelijke rechtshandelingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel7
  - number: 7.1.b
    text: |-
      machtiging om in naam van de bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel7
  - number: '7.2'
    text: |-
      Voor de toepassing van [artikel 3][ref1] geldt dat het doorgeven van een volmacht om privaatrechtelijke
      rechtshandelingen te verrichten slechts is toegestaan voor zover het regelmatig voorkomende rechtshandelingen
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0041519#Artikel3
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0041519
        artikel: '3'
  - number: '8'
    text: |-
      Vóór het tijdstip van inwerkingtreding van dit besluit van kracht zijnde mandaten, ondermandaten, volmachten en
      machtigingen op het terrein van het ministerie waarin op het tijdstip van inwerkingtreding van dit besluit niet
      is voorzien, blijven van kracht totdat op grond van dit besluit is voorzien in mandaat, ondermandaat, volmacht of
      machtiging dan wel is voorzien in intrekking daarvan.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel8
  - number: '9.1'
    text: |-
      Door of namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties verleende mandaten en ondermandaten op het
      terrein van veiligheid behoudens de Algemene Inlichtingen- en Veiligheidsdienst, die op 13 oktober 2010 van kracht
      waren, worden aangemerkt als mandaten die met ingang van 14 oktober 2010 zijn verleend door of namens de Minister
      van Justitie en Veiligheid, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel9
  - number: 9.1.a
    text: |-
      mandaten aan de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties worden
      aangemerkt als mandaten aan de secretaris-generaal van het Ministerie van Justitie en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel9
  - number: 9.1.b
    text: |-
      mandaten die rechtstreeks zijn verleend aan functionarissen die ressorteren onder het directoraat-generaal Straffen
      en Beschermen, het directoraat-generaal Rechtspleging en Rechtshandhaving of de Inspectie Justitie en Veiligheid
      worden aangemerkt als ondermandaten die overeenkomstig dit besluit zijn verleend.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel9
  - number: '9.2'
    text: |-
      Door of namens de Minister van Binnenlandse Zaken en Koninkrijksrelaties verleende mandaten en ondermandaten op het
      terrein van de vreemdelingenwetgeving en van de [Rijkswet op het Nederlanderschap][ref1], die op 4 november 2012
      van kracht waren, worden aangemerkt als mandaten die met ingang van 5 november 2012 zijn verleend door of namens de
      Minister van Justitie en Veiligheid, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003738
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003738
  - number: 9.2.a
    text: |-
      mandaten aan de secretaris-generaal van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties worden
      aangemerkt als mandaten aan de secretaris-generaal van het Ministerie van Justitie en Veiligheid;
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel9
  - number: 9.2.b
    text: |-
      mandaten die rechtstreeks zijn verleend aan functionarissen die ressorteren onder het directoraat-generaal Migratie
      worden aangemerkt als ondermandaten die overeenkomstig dit besluit zijn verleend.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel9
  - number: '10'
    text: |-
      De [Mandaatregeling Ministerie van Veiligheid en Justitie 2011][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0030842
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0030842
  - number: '11.1'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot 19 oktober 2018.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel11
  - number: '11.2'
    text: |-
      Besluiten of handelingen die vóór het tijdstip van inwerkingtreding van dit besluit zijn genomen of verricht namens
      de bewindspersoon door een functionaris van een dienstonderdeel zoals dat dienstonderdeel tot 26 oktober 2017 werd
      aangeduid, behouden hun rechtskracht.
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel11
  - number: '12'
    text: 'Dit besluit wordt aangehaald als: Mandaatbesluit Ministerie van Justitie en Veiligheid.'
    url: https://wetten.overheid.nl/BWBR0041519/2024-08-29#Artikel12
