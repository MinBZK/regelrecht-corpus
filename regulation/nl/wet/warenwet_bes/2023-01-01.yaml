---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: warenwet_bes
regulatory_layer: WET
publication_date: '2016-06-07'
valid_from: '2023-01-01'
bwb_id: BWBR0028619
url: https://wetten.overheid.nl/BWBR0028619/2023-01-01
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.a
    text: '*de Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.b
    text: '*waren:* alle roerende lichamelijke zaken;'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.c
    text: |-
      *eet- of drinkwaren:* al hetgeen bestemd is door de mens te worden genuttigd, alsmede genotmiddelen, kauwpreparaten
      en grondstoffen daarvan;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.d
    text: '*verpakking:* elk artikel of materiaal dat bestemd is om een waar of waren te bevatten of te omhullen;'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.e
    text: |-
      *vervaardigen:* alle handelingen met betrekking tot het tot stand brengen van de waar, daaronder begrepen het
      bereiden;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.f
    text: '*verhandelen:* alle handelingen die ten dienste staan van en samenhangen met de verkoop van de waar;'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.g
    text: |-
      *ruimte:* elke plaats al dan niet permanent van aard alwaar handelingen met betrekking tot het vervaardigen van
      waren plaatsvinden;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.h
    text: |-
      *etikettering:* iedere aanduiding, identificatie, vermelding of voorstelling op of bij de waar dan wel op de
      verpakking daarvan gebezigd of aangebracht;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
  - number: 1.i
    text: |-
      *Adviescommissie:* de commissie, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel7
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '7'
        paragraaf: '3'
  - number: '2.1'
    text: |-
      Deze wet is niet van toepassing op het vervaardigen van waren in de sfeer van die particuliere huishouding
      waarbinnen zij worden genuttigd of gebruikt.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel2
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kan een huishouding gelijk worden gesteld met een particuliere huishouding als
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel2
  - number: '2.3'
    text: |-
      In geval van oorlog, oorlogsgevaar of andere buitengewone omstandigheden kan bij algemene maatregel van bestuur
      worden bepaald dat deze wet niet van toepassing is op voor militair gebruik bestemde waren.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel2
  - number: '2.4'
    text: |-
      Voorts kunnen bij algemene maatregel van bestuur ter uitvoering van bindende verdragen of andere internationale
      afspraken en bindende besluiten van volkenrechtelijke organisaties regels worden gegeven, waarbij van de bepalingen
      van deze wet kan worden afgeweken of de bepalingen van deze wet geheel of gedeeltelijk buiten werking kunnen worden
      gesteld.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel2
  - number: '2.5'
    text: |-
      Binnen zes maanden na het in werking treden van een algemene maatregel van bestuur bedoeld in het vierde lid,
      wordt een voorstel aan de Staten-Generaal gedaan om het in dat algemene maatregel van bestuur bepaalde, bij wet
      te bekrachtigen. Indien een algemene maatregel van bestuur, bedoeld in het vierde lid, niet wordt bekrachtigd
      ingevolge het vijfde lid, wordt dit algemene maatregel van bestuur onverwijld ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel2
  - number: 2a
    text: |-
      Deze wet is niet van toepassing voor zover bij of krachtens de [Wet elektriciteit en drinkwater BES][ref1]
      regels zijn gesteld ten aanzien van de productie of distributie van drinkwater of nooddrinkwater in krachtens
      [artikel 1.3 van die wet][ref2] aangewezen verpakkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0037861
      [ref2]: https://wetten.overheid.nl/BWBR0037861#Artikel1
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0037861
      - id: ref2
        bwb_id: BWBR0037861
        artikel: '1'
  - number: '3.1'
    text: |-
      In het belang van de volksgezondheid kunnen, na overleg tussen Onze Minister en Onze Minister van Economische
      Zaken, bij algemene maatregel van bestuur de Adviescommissie gehoord, ten aanzien van waren regels worden gegeven
      met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de samenstelling, de kwaliteit, de aard, de toestand, de hoedanigheid, de eigenschappen, de houdbaarheid en de
      uitvoering;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.b
    text: het volume, de hoeveelheidsafmeting of de standaardmaten;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.c
    text: de wijze van het vervaardigen, het verpakken of het opslaan;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.d
    text: |-
      de eigenschappen en de toestand van ruimten of hetgeen in of bij de ruimten aanwezig is alwaar waren vervaardigd
      worden, alsmede ten aanzien van voorwerpen, gereedschappen of materialen die bij het vervaardigen of verhandelen
      gebezigd worden, evenals de eisen van hygiëne te stellen ten aanzien van de personen, die bij het verrichten van
      deze handelingen betrokken zijn;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.e
    text: |-
      waren, waarvan bij aanwending de voedings- of gebruikswaarde geringer is dan in redelijkheid ten minste mag worden
      verlangd;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.f
    text: de etikettering of gereserveerde benaming;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.g
    text: het aanprijzen of verhandelen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.h
    text: de verpakking;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.i
    text: het vervoer en de eisen met betrekking tot voertuigen te stellen in verband met dit vervoer;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.j
    text: de in- en uitvoer;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.k
    text: de registratie;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.l
    text: de methoden van onderzoek;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.m
    text: |-
      preventieve maatregelen ter bevordering van een goede naleving van de bij of krachtens deze wet gegeven
      voorschriften;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.n
    text: typekeuringen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.o
    text: het gebruik van additieven of hulpstoffen in waren;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.1.p
    text: |-
      water dat in enig levensmiddelenbedrijf wordt gebruikt voor de vervaardiging, de behandeling, de conservering
      of het in de handel brengen van voor menselijke consumptie bestemde producten of stoffen voor zover dit water in
      direct contact komt met deze producten of stoffen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: '3.2'
    text: |-
      Ter zake van eet- en drinkwaren in het bijzonder kunnen, na overleg tussen Onze Minister en Onze Minister van
      Economische Zaken, ter bescherming van het belang in het eerste lid, bij algemene maatregel van bestuur de
      Adviescommissie gehoord, bovendien regels worden gegeven met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.2.a
    text: de termijnstelling in verband met de houdbaarheid;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.2.b
    text: de maximaal toelaatbare hoeveelheden chemische, microbiologische of biologische verontreinigingen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.2.c
    text: |-
      de aanwezigheid van belangrijke voedingsstoffen in eet- of drinkwaren die een wezenlijk onderdeel van het gangbare
      voedingspakket uitmaken;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.2.d
    text: de conserveringseisen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: 3.2.e
    text: de opleidingseisen waaraan exploitanten van ruimten moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: '3.3'
    text: |-
      Voorts kunnen in verband met het milieubelang bij algemene maatregel van bestuur de Adviescommissie gehoord, regels
      worden gegeven met betrekking tot de verpakking van waren.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: '3.4'
    text: |-
      De regels, bedoeld in het eerste lid tot en met het derde lid, kunnen van toepassing zijn in alle openbare lichamen
      Bonaire, Sint Eustatius en Saba dan wel in een of meer van die openbare lichamen afzonderlijk.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: '3.5'
    text: |-
      Bij het geven van regels, bedoeld in het eerste tot en met het derde lid, kan het verplicht stellen van een
      onderzoek behoren.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: '3.6'
    text: |-
      Ter zake van waren die uitsluitend of mede zijn voorbestemd om, al dan niet na in een van de openbare lichamen
      Bonaire, Sint Eustatius en Saba dan wel Aruba, Curacao of Sint Maarten een bewerking of verwerking te hebben
      ondergaan, in het gebied van de Europese Unie te worden ingevoerd, kan de inhoud van een algemene maatregel van
      bestuur als bedoeld in het eerste tot en met het derde lid van dit artikel bestaan uit de toepasselijk-verklaring
      van een of meer verordeningen, beschikkingen of richtlijnen die door de Commissie of de Raad van de Europese
      Unie zijn vastgesteld, of van een of meer bepaalde titels, hoofdstukken, artikelen of andere onderdelen daarvan,
      mits deze verordeningen, beschikkingen en richtlijnen in het Publicatieblad van de Europese Unie zijn opgenomen
      en de tekst ervan als bijlage bij de betreffende algemene maatregel van bestuur wordt gevoegd. Het tijdstip van
      inwerkingtreding ervan voor een van de openbare lichamen Bonaire, Sint Eustatius en Saba dan wel Aruba, Curacao of
      Sint Maarten wordt bij of krachtens de wet bepaald; voor een verordening of ministeriële regeling is dit tijdstip
      niet gelegen vóór dat waarop de verordening, onderscheidenlijk ministeriële regeling, zelf in enige Lid-Staat van
      de Europese Unie in werking treedt.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: '3.7'
    text: |-
      Bij ministeriële regeling kunnen ter uitvoering van een algemene maatregel van bestuur als in dit artikel bedoeld
      nadere voorschriften van technische of anderszins praktische aard worden gegeven en kunnen instanties worden
      aangewezen die de onderzoeken, bedoeld in het vijfde lid, zullen verrichten.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel3
  - number: '4.1'
    text: |-
      In een spoedeisend geval kunnen de regels, bedoeld in [artikel 3, eerste tot en met derde lid][ref1], worden
      gegeven bij deze regeling. Bij deze regeling kunnen bepalingen van de op artikel 3, eerste lid tot derde lid
      berustende algemene maatregelen van bestuur, zo nodig buiten werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel3
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: |-
      De ministeriële regeling, bedoeld in het eerste lid, vervalt na verloop van een termijn van zes maanden nadat zij
      in werking is getreden, of, indien binnen die termijn een algemene maatregel van bestuur ter vervanging van die
      ministeriële regeling in werking is getreden, op het tijdstip waarop die algemene maatregel van bestuur in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel4
  - number: '5.1'
    text: |-
      De regels, krachtens [artikel 3, eerste tot en met derde lid][ref1], kunnen voorschriften inhouden ten aanzien
      van daarbij omschreven waren of categorieën van waren of een verbod om daarbij omschreven waren of categorieën van
      waren te vervaardigen dan wel te verhandelen. Aan Onze Minister kan bij de desbetreffende algemene maatregel van
      bestuur, de bevoegdheid worden toegekend vrijstelling dan wel ontheffing van de gegeven voorschriften of verboden
      te verlenen of namens hem te doen verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel3
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '3'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      Aan de vrijstelling of de ontheffing, bedoeld in het eerste lid, kunnen voorschriften worden verbonden; zij kan
      onder beperking worden verleend.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: '5.3'
    text: |-
      Tot de voorschriften die aan een ontheffing, bedoeld in het tweede lid, worden verbonden, kan een voorschrift
      behoren, inhoudende dat de houder van de ontheffing verplicht is bij het verhandelen van waren waarvoor de
      ontheffing geldt, op of bij de waar of op haar verpakking ten behoeve van degenen die haar verder verhandelen,
      aanwijzigingen op te nemen met betrekking tot het bewaren, vervoeren of behandelen van de waar.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: '5.4'
    text: |-
      De houder van een ontheffing als bedoeld in het derde lid, is verplicht bij het verhandelen van de waren waarvoor
      de ontheffing geldt, op of bij de waar of op haar verpakking een vermelding met betrekking tot het besluit waarbij
      de ontheffing werd verleend, te plaatsen. Ingeval bij het verlenen van de ontheffing toepassing is gegeven aan het
      derde lid, is hij voorts verplicht zulks bij de aldaar bedoelde aanwijzingen te vermelden.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: '5.5'
    text: |-
      Voor degenen die waren waarvoor een ontheffing is verleend verder verhandelen, geldt met betrekking tot die waren
      vrijstelling van de voorschriften waarvan de ontheffing is verleend. Het bepaalde in het vierde lid is op hun van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: '5.6'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven omtrent de wijze waarop de aanvraag om een vrijstelling
      of ontheffing, bedoeld in het eerste lid, dient te geschieden en de gegevens die van de aanvrager worden verlangd;
      zolang de verlangde gegevens niet zijn verstrekt en de vergoeding, bedoeld in het zevende lid, niet is voldaan,
      wordt de aanvraag niet in behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: '5.7'
    text: |-
      Voor de behandeling van de aanvraag om vrijstelling of ontheffing is een vergoeding verschuldigd. De hoogte van de
      vergoeding en de wijze van betaling daarvan worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: '5.8'
    text: 'Een vrijstelling of ontheffing kan door Onze Minister worden ingetrokken, indien:'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: 5.8.a
    text: de daaraan verbonden voorschriften niet worden nageleefd;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: 5.8.b
    text: |-
      de gegevens, verstrekt ter verkrijging van de vrijstelling of ontheffing zodanig onjuist of onvolledig blijken
      te zijn, dat op de aanvraag afwijzend of anders zou zijn beslist, indien bij de beoordeling daarvan de juiste of
      volledige gegevens bekend zouden zijn geweest; of
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: 5.8.c
    text: de situatie met inachtneming van de belangen die deze wet dient, daartoe noopt.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: '5.9'
    text: |-
      Een beslissing houdende weigering van een vrijstelling of ontheffing, dan wel houdende intrekking van een
      vrijstelling of ontheffing wordt aan de aanvrager schriftelijk medegedeeld onder opgave van redenen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5
  - number: 5a
    text: 'Bij ministeriele regeling kunnen:'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5a
  - number: 5a.a
    text: |-
      bepaalde verpakte artikelen worden aangewezen, waarop de netto-inhoud in metrieke maat of gewicht duidelijk moet
      zijn aangegeven;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5a
  - number: 5a.b
    text: bepaalde goederen worden aangewezen, welke niet anders dan bij maat of gewicht mogen worden verkocht;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5a
  - number: 5a.c
    text: |-
      voorschriften worden gegeven betreffende de mate waarin verpakkingen, die een bepaalde inhoud naar maat of gewicht
      doen veronderstellen, tenminste moeten zijn vervuld;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5a
  - number: 5a.d
    text: |-
      bepaalde goederen worden aangewezen, welke niet anders dan in voor te schrijven maat- of gewichtshoeveelheden mogen
      worden verkocht.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel5a
  - number: '6.1'
    text: |-
      Bij ministeriële regeling kunnen vergoedingen worden vastgesteld, verschuldigd door degenen ten behoeve van wie
      werkzaamheden of diensten door of namens het Land zijn verricht of verleend.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel6
  - number: '6.2'
    text: |-
      De Staat onderscheidenlijk de personen, bedoeld in het eerste lid, kunnen alvorens over te gaan tot het verrichten
      van werkzaamheden of verlenen van diensten, vooruitbetaling van de vastgestelde tarieven verlangen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel6
  - number: '7.1'
    text: Er is een Adviescommissie inzake waren.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '7.2'
    text: |-
      De commissie heeft tot taak Onze Minister desgevraagd of uit eigen beweging te adviseren over aangelegenheden die
      verband houden met deze wet.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '7.3'
    text: De commissie wordt in de gelegenheid gesteld advies uit te brengen over ontwerpen krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '7.4'
    text: |-
      De commissie bestaat uit ten hoogste 15 leden, en in elk geval uit een oneven aantal, die door Onze Minister worden
      benoemd, geschorst en ontslagen. Van de leden wordt een derde deel benoemd op aanbeveling van organisaties van
      lokale fabrikanten of importeurs van waren en een derde deel op aanbeveling van organisaties van consumenten. Een
      derde deel wordt door Onze Minister voorgedragen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '7.5'
    text: De commissie wijst uit haar midden een voorzitter en een secretaris aan.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '7.6'
    text: |-
      De commissie kan subcommissies instellen. De commissie kan personen, niet zijnde leden, uitnodigen deel te nemen
      aan de vergaderingen van een subcommissie.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '7.7'
    text: De commissie alsmede de subcommissies kunnen ten aanzien van bepaalde onderwerpen deskundigen horen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '7.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven met betrekking tot de werkwijze van de commissie en
      de subcommissies, alsmede de aan de leden toe te kennen vergoeding.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel7
  - number: '8'
    text: |-
      Het is verboden eet- of drinkwaren te bereiden dan wel te verhandelen die door hun ondeugdelijkheid de gezondheid
      of veiligheid van de mens in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd het bepaalde in de Vergunningwet BES is het verboden eet- of drinkwaren te bereiden zonder daartoe
      strekkende vergunning door of namens Onze Minister.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: '9.2'
    text: |-
      De vergunning wordt niet eerder afgegeven dan nadat voldaan is aan de voorschriften bij of krachtens deze wet
      gegeven inzake:
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: 9.2.a
    text: de samenstelling van eet- of drinkwaren;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: 9.2.b
    text: de wijze van bereiden van eet- of drinkwaren;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: 9.2.c
    text: de voorwerpen, gereedschappen of materialen die bij het bereiden van eet- of drinkwaren worden gebezigd;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: 9.2.d
    text: de ruimten;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: 9.2.e
    text: de hygiënische eisen te stellen aan personen die bij het bereiden van eet- of drinkwaren betrokken zijn; en
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: 9.2.f
    text: de opleidingseisen waaraan exploitanten van ruimten moeten voldoen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
  - number: '9.3'
    text: |-
      Ten aanzien van de vergunning, bedoeld in het eerste lid, is het bepaalde in
      [artikel 5, tweede, zesde tot en met negende lid][ref1], van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel5
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '5'
        paragraaf: '2'
  - number: '10'
    text: |-
      Het is verboden waren, niet zijnde eet- of drinkwaren, te verhandelen die bij het gezien hun bestemming te
      verwachten gebruik bijzondere gevaren kunnen opleveren voor de gezondheid of veiligheid van de mens.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel10
  - number: '11'
    text: |-
      Het is verboden in de uitoefening van een beroep of bedrijf waren aan te prijzen op zodanige wijze, dat dit in
      strijd is met voorschriften inzake de etikettering en het verhandelen, gesteld bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel11
  - number: '12'
    text: |-
      Het is verboden waren te verhandelen waarvan de samenstelling, uitvoering, hoedanigheid, eigenschappen of toestand
      in ernstige mate minder is dan wat in redelijkheid mag worden verlangd.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel12
  - number: '13'
    text: Het is verboden waren te verhandelen die ongeschikt zijn voor gebruik.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel13
  - number: '14'
    text: |-
      Het is verboden waren te bereiden dan wel te verhandelen, anders dan met inachtneming van de regels gegeven bij of
      krachtens deze wet met betrekking tot de samenstelling en de wijze van bereiding onderscheidenlijk de verpakking en
      de etikettering.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel14
  - number: '15'
    text: |-
      Het is verboden een etikettering op of bij waren aan te brengen of bij aanprijzing te bezigen, die, doordat zij
      onjuist, onvolledig is of een onjuiste indruk wekt, misleidend is.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel15
  - number: '16'
    text: |-
      Het is verboden waren te verhandelen die door hun ondeugdelijkheid de gezondheid of veiligheid van de mens in
      gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel16
  - number: 16a
    text: |-
      Het is verboden waren per maat of gewicht te verkopen, te koop aan te bieden of op welke wijze ook in de handel te
      brengen, anders dan bij netto-inhoud of netto-gewicht.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel16a
  - number: '17.1'
    text: |-
      Indien een waar welke naar haar aard bestemd of geschikt is om in de sfeer van een particuliere huishouding te
      worden gebruikt, gevaar oplevert voor de gezondheid of veiligheid van de mens, kan Onze Minister degene die de
      desbetreffende waar verhandelt of heeft verhandeld, schriftelijk gelasten om de bezitters dan wel de vermoedelijke
      bezitters van die waar onverwijld en op doeltreffende wijze op de hoogte te stellen van het gevaar.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel17
  - number: '17.2'
    text: |-
      Indien betrokkene de instructies, bedoeld in het eerste lid, niet op de voorgeschreven wijze uitvoert, kan Onze
      Minister op kosten van de betrokkene bedoelde maatregelen treffen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel17
  - number: '17.3'
    text: |-
      De kosten die verband houden met de maatregelen, bedoeld in het tweede lid, kunnen door Onze Minister worden
      ingevorderd door middel van een dwangschrift volgens de Wet houdende regeling van de invordering van belastingen,
      bijdragen en vergoedingen door middel van dwangschriften alsmede van de rechtspleging inzake van belastingen,
      bijdragen en vergoedingen (P.B. 1942, no. 246).
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel17
  - number: '17.4'
    text: |-
      Binnen dertig dagen na de betekening staat verzet tegen het dwangschrift, bedoeld in het derde lid, open. De
      desbetreffende bepalingen van de wet, genoemd in het derde lid, zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel17
  - number: '18'
    text: |-
      Degene die rechtstreeks in zijn belang is getroffen door een op grond van deze wet genomen ministeriële regeling
      kan hiertegen beroep instellen bij het Gerecht in eerste aanleg van Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel18
  - number: '19.1'
    text: |-
      Het toezicht op de naleving van het bepaalde bij of krachtens deze wet met betrekking tot eet- en drinkwaren berust
      bij daartoe door het bestuurscollege aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel19
  - number: '19.2'
    text: |-
      Het bestuurscollege kan de het Staatstoezicht op de Volksgezondheid, bedoeld in
      [hoofdstuk IV, paragraaf 2, van de Gezondheidswet][ref1] verzoeken de taak, bedoeld in het eerste lid, uit te
      oefenen. In een zodanig geval geschiedt het toezicht door bij ministeriële regeling aangewezen medewerkers van
      dat Staatstoezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002202
        paragraaf: '2'
  - number: '19.3'
    text: |-
      Het toezicht op de naleving van het bepaalde bij of krachtens deze wet met betrekking tot waren, niet zijnde eet-
      en drinkwaren berust bij, behoudens toepassing is gegeven aan het vierde lid, bij ministeriële regeling aangewezen
      medewerkers van de Inspectie voor de Volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel19
  - number: '19.4'
    text: |-
      De aanwijzing van personen belast met het toezicht op de naleving van het bepaalde bij of krachtens deze wet met
      betrekking tot waren, niet zijnde eet- en drinkwaren, kan op verzoek van het desbetreffende bestuurscollege bij
      ministeriële regeling aan hem worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel19
  - number: '19.5'
    text: |-
      Het Staatstoezicht op de Volksgezondheid, bedoeld in [hoofdstuk IV, paragraaf 2, van de Gezondheidswet][ref1]
      oefent toezicht uit op het ingevolge het eerste en vierde lid uitgeoefende toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002202
        paragraaf: '2'
  - number: '19.6'
    text: |-
      De bestuurscolleges dienen jaarlijks bij Onze Minister een verslag in van de werkzaamheden verband houdende met het
      toezicht, bedoeld in het eerste lid, en voor zover van toepassing bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel19
  - number: 19a
    text: |-
      Met het oog op de afzet van in de openbare lichamen Bonaire, Sint Eustatius en Saba gefabriceerde
      eet- en drinkwaren uit het buitenland wordt het Staatstoezicht op de Volksgezondheid, bedoeld in
      [hoofdstuk IV, paragraaf 2, van de Gezondheidswet][ref1] aangewezen als landelijk bevoegde instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002202
        paragraaf: '2'
  - number: '20.1'
    text: |-
      Bij de uitvoering van hun taak dragen de krachtens [artikel 19, eerste en vierde lid][ref1], aangewezen personen
      een legitimatiebewijs bij zich, die door het desbetreffende bestuurscollege wordt verstrekt. Zij tonen hun
      legitimatiebewijs desgevraagd aanstonds.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel19
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '19'
        paragraaf: '7'
  - number: '20.2'
    text: |-
      Het legitimatiebewijs bevat een foto van de krachtens [artikel 19, eerste of vierde lid][ref1], aangewezen persoon
      en vermeldt in ieder geval diens naam en hoedanigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel19
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '19'
        paragraaf: '7'
  - number: '21.1'
    text: |-
      De krachtens [artikel 19, eerste en vierde lid][ref1], aangewezen personen zijn, uitsluitend voor zover dat voor de
      vervulling van hun taak redelijkerwijs noodzakelijk is, bevoegd:


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel19
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '19'
        paragraaf: '7'
  - number: 21.1.a
    text: alle inlichtingen te vragen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: 21.1.b
    text: |-
      inzage te verlangen van alle boeken, bescheiden en andere informatiedragers en daarvan afschrift te nemen of deze
      daartoe tijdelijk mee te nemen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: 21.1.c
    text: |-
      waren en al hetgeen voor waren als hulpmiddel dient aan opneming en onderzoek te onderwerpen, ten behoeve van
      zodanig onderzoek verpakkingen te openen dan wel te vorderen dat verpakkingen worden geopend; deze waren daartoe
      tijdelijk mee te nemen en daarvan monsters te nemen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: 21.1.d
    text: |-
      alle plaatsen, met uitzondering van woningen zonder de uitdrukkelijke toestemming van de bewoner, te betreden,
      vergezeld van door hen aangewezen personen;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: 21.1.e
    text: vaartuigen, voertuigen en de lading daarvan te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: '21.2'
    text: |-
      Zo nodig, wordt de toegang tot een plaats als bedoeld in het tweede lid, onderdeel d, verschaft met behulp van de
      sterke arm.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: '21.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze van taakuitoefening van
      de in het eerste lid bedoelde ambtenaren of personen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: '21.4'
    text: |-
      Een ieder is verplicht aan de in het eerste lid bedoelde ambtenaren of personen alle medewerking te verlenen die op
      grond van het tweede lid wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel21
  - number: '22.1'
    text: |-
      De krachtens [artikel 19, eerste en vierde lid][ref1], aangewezen personen kunnen, in afwachting van
      de onverwijld door hen in te roepen beslissing van het Staatstoezicht op de Volksgezondheid, bedoeld in
      [hoofdstuk IV, paragraaf 2, van de Gezondheidswet][ref2], de vervaardiging of de verhandeling van waren, die niet
      voldoen aan het bij of krachtens deze wet bepaalde, verbieden.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002202#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '19'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0002202
        paragraaf: '2'
  - number: '22.2'
    text: |-
      Het Staatstoezicht op de Volksgezondheid, bedoeld in [hoofdstuk IV, paragraaf 2, van de Gezondheidswet][ref1]
      kan het verbod, krachtens het eerste lid opgelegd, bekrachtigen, alsmede de vernietiging bevelen van voorlopig in
      beslag genomen waren.


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0002202
        paragraaf: '2'
  - number: '22.3'
    text: Een beslissing als bedoeld in het tweede lid, wordt schriftelijk aan de belanghebbende meegedeeld.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel22
  - number: '23.1'
    text: |-
      De krachtens [artikel 19, eerste en vierde lid][ref1], aangewezen personen zijn bevoegd tot voorlopige
      inbeslagneming van:


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel19
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '19'
        paragraaf: '7'
  - number: 23.1.a
    text: waren waarvan een monster bij onderzoek ondeugdelijk of schadelijk is bevonden;
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel23
  - number: 23.1.b
    text: |-
      eet- of drinkwaren die kennelijk in staat van bederf verkeren of die kennelijk niet voldoen aan de voorschriften of
      vereisten bij of krachtens deze wet gegeven.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel23
  - number: '23.2'
    text: |-
      Met op grond van het eerste lid in beslag genomen, voor menselijk gebruik geschikte waren, wordt gehandeld op de
      wijze, bij algemene maatregel van bestuur te bepalen.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel23
  - number: '24.1'
    text: |-
      Handelen in strijd met de voorschriften, gesteld bij of krachtens deze wet in de [artikelen 2, vierde lid][ref1],
      [3, eerste, tweede, derde en vijfde lid][ref2], [4, eerste lid][ref3], [5, derde, vierde en vijfde lid][ref4], of,
      overtreding van de in [artikelen 8 tot en met 16a][ref5] gestelde verboden, is, voor zover opzettelijk begaan, een
      misdrijf, en wordt gestraft met hetzij gevangenisstraf van ten hoogste vier jaren, hetzij met een geldboete van ten
      hoogste de zesde categorie, hetzij met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0028619#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0028619#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0028619#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0028619#Artikel8
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028619
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028619
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028619
        artikel: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0028619
        artikel: '8'
        paragraaf: '4'
  - number: '24.2'
    text: |-
      Handelen in strijd met de voorschriften, gesteld bij of krachtens deze wet in de artikelen e, vierde lid,
      [3, eerste, tweede, derde en vijfde lid][ref1], [4, eerste lid][ref2], [5, derde, vierde en vijfde lid][ref3], of,
      overtreding van de in [artikelen 8 tot en met 16a][ref4] gestelde verboden, is, voor zover niet opzettelijk begaan,
      een overtreding, en wordt gestraft met hetzij hechtenis van ten hoogste een jaar, hetzij met een geldboete van ten
      hoogste de vijfde categorie, hetzij met beide straffen.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028619#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0028619#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0028619#Artikel8
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0028619
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0028619
        artikel: '5'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028619
        artikel: '8'
        paragraaf: '4'
  - number: '24.3'
    text: |-
      Het niet voldoen aan de vordering, bedoeld in [artikel 21, eerste lid][ref1], onderdelen c en e, of de
      verplichting, bedoeld in de artikelen 21, eerste lid, onderdeel a, en [25][ref2], is een overtreding en wordt
      gestraft met hechtenis van ten hoogste twee maanden of een geldboete van ten hoogste de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0028619#Artikel25
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028619
        artikel: '21'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0028619
        artikel: '25'
        paragraaf: '9'
  - number: 24a.1
    text: |-
      Met hechtenis van ten hoogste een week of een geldboete van ten hoogste USD 500 wordt gestraft hij, die ten behoeve
      van handel of bedrijf, maat of gewicht der goederen heeft vastgesteld of op zijn last heeft doen vaststellen,
      indien de netto-hoeveelheid meer dan het dubbele van de afwijking, die voor het gebruikte meetinstrument bij herijk
      is toegestaan, in zijn voordeel of het voordeel van de lastgever afwijkt van de ware netto-hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel24a
  - number: 24a.2
    text: Het in het eerste lid strafbaar gestelde feit wordt beschouwd als overtreding.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel24a
  - number: '25'
    text: |-
      Een ieder die betrokken is bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn
      taak bij de uitvoering van deze wet de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel25
  - number: '26'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel26
  - number: '27'
    text: |-
      Uitvoeringsbesluiten, vrijstellingen, ontheffingen, vergunningen en toestemmingen die zijn gegeven, verleend
      of aangevraagd op grond van de Verordening van de 7de augustus 1917 houdende bepalingen tot het tegengaan van
      de verkoop van voor de volksgezondheid nadelige eet- en drinkwaren, alsmede ter bevordering van een deugdelijke
      samenstelling van eet- en drinkwaren gelden met ingang van de dag van inwerkingtreding van deze wet als gegeven,
      verleend of aangevraagd op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel27
  - number: '28.1'
    text: |-
      Deze wet treedt met uitzondering van de [artikelen 10][ref1], [11][ref2], [12][ref3], [13][ref4], [14][ref5],
      [15][ref6] en [16][ref7], voor zover deze artikelen van toepassing zijn op waren, niet zijnde eet- en drinkwaren,
      in werking met ingang van de dag na die der uitgifte van het Staatsblad, waarin de afkondiging is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0028619#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0028619#Artikel11
