  - number: '28.2'
    text: |-
      De artikelen, genoemd in het eerste lid, voor zover deze van toepassing zijn op waren, niet zijnde eet- en
      drinkwaren, treden in werking op een bij algemene maatregel van bestuur te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld. Daarbij kan voor elk van de openbare
      lichamen Bonaire, Sint Eustatius of Saba het tijdstip van inwerkingtreding verschillend worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel28
  - number: '29'
    text: 'Deze wet wordt aangehaald als: Warenwet BES.'
    url: https://wetten.overheid.nl/BWBR0028619/2023-01-01#Artikel29
