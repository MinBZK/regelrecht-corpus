$id: wet_algemene_regels_herindeling
regulatory_layer: WET
publication_date: '2020-04-09'
valid_from: '2022-08-01'
bwb_id: BWBR0003718
url: https://wetten.overheid.nl/BWBR0003718/2022-08-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is algemene regelen te stellen die bij wijziging van de
    gemeentelijke indeling van toepassing zijn;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Binnenlandse Zaken;'
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.b
    text: |-
      wijziging van de gemeentelijke indeling: instelling en opheffing van gemeenten alsmede wijziging van
      gemeentegrenzen die naar verwachting het inwonertal van ten minste één van de betrokken gemeenten met 10% of meer
      zal doen toe- of afnemen;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.c
    text: |-
      wijziging van de provinciale indeling: instelling en opheffing van provincies alsmede wijziging van
      provinciegrenzen waardoor naar verwachting 10% of meer van het aantal inwoners van een gemeente deel gaat uitmaken
      van een andere provincie en wijziging van provinciegrenzen met niet provinciaal ingedeeld gebied;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.d
    text: |-
      grenscorrectie: een wijziging van een gemeentegrens die naar verwachting het inwonertal van geen van de betrokken
      gemeenten met 10% of meer zal doen toe- of afnemen;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.e
    text: |-
      herindelingsadvies: een met toepassing van deze wet voorbereid advies aan Onze Minister over wijziging van
      gemeentelijke en van provinciale grenzen;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.f
    text: |-
      herindelingsregeling: een wet, een algemene maatregel van bestuur of een besluit als bedoeld in de
      [artikelen 3][ref1] en [13][ref2] tot wijziging van de gemeentelijke of de provinciale indeling of tot
      grenscorrectie alsmede een samenstel van gelijkluidende besluiten als bedoeld in [artikel 3][ref3] tot het
      vaststellen van een grenscorrectie;


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel3
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '13'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
  - number: 1.1.g
    text: 'herindelingsontwerp: een ontwerp van een herindelingsadvies of van een herindelingsregeling;'
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.h
    text: 'datum van herindeling: 1 januari volgend op de dag van inwerkingtreding van de herindelingsregeling;'
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.1.i
    text: |-
      overgaand dan wel toegevoegd gebied: gebied dat krachtens een herindelingsregeling deel gaat uitmaken
      onderscheidenlijk deel is gaan uitmaken van een andere gemeente of provincie.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: '1.2'
    text: |-
      Voor de toepassing van het eerste lid, onder b, c en d, wordt uitgegaan van het aantal inwoners van het
      desbetreffende grondgebied op het tijdstip dat:
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.2.a
    text: |-
      het herindelingsadvies dan wel de herindelingsregeling wordt vastgesteld, indien het betreft een herindelingsadvies
      dan wel herindelingsregeling waarvan de voorbereiding geschiedt door gemeenten of door een of meer provincies;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: 1.2.b
    text: |-
      het voorstel voor een herindelingsregeling aan de ministerraad wordt gezonden, indien het betreft een
      herindelingsregeling waarvan de voorbereiding geschiedt door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel1
  - number: '2.1'
    text: |-
      Bij een herindelingsontwerp, een herindelingsadvies en een herindelingsregeling zijn een of meer kaarten gevoegd
      waarop de wijzigingen van de provincie- of gemeentegrenzen zijn aangegeven.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel2
  - number: '2.2'
    text: |-
      Uiterlijk twee maanden na de vaststelling van de herindelingsregeling stellen gedeputeerde staten een
      beschrijving vast van de grenzen die zijn aangegeven op de bij de herindelingsregeling gevoegde kaart of kaarten.
      De beschrijving geschiedt met behulp van kadastrale kenmerken en indien dat niet mogelijk is met behulp van
      coördinaten van het verschoven stelsel van rijksdriehoeksmeting.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel2
  - number: '2.3'
    text: |-
      De inwerkingtreding van de herindelingsregeling wordt bepaald op een tijdstip gelegen na de vaststelling van de
      grensbeschrijving.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel2
  - number: '3.1'
    text: Een wijziging van de gemeentelijke indeling geschiedt bij wet.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: '3.2'
    text: 'Een grenscorrectie geschiedt:'
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: 3.2.a
    text: bij gelijkluidende besluiten van de raden van de betrokken gemeenten;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: 3.2.b
    text: bij besluit van provinciale staten;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: 3.2.c
    text: bij algemene maatregel van bestuur of bij wet.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: '3.3'
    text: 'Een grenscorrectie die gepaard gaat met een wijziging van een provinciegrens geschiedt:'
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: 3.3.a
    text: bij gelijkluidende besluiten van provinciale staten van de betrokken provincies;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: 3.3.b
    text: bij algemene maatregel van bestuur of bij wet.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel3
  - number: '4.1'
    text: |-
      Een herindelingsadvies met betrekking tot een wijziging van de gemeentelijke indeling wordt door provinciale staten
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel4
  - number: '4.2'
    text: |-
      Een herindelingsadvies met betrekking tot een wijziging van de gemeentelijke indeling kan door de raden van de
      betrokken gemeenten worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel4
  - number: '4.3'
    text: |-
      Indien de besturen van de betrokken provincies van oordeel verschillen over de wenselijkheid van een grenscorrectie
      die gepaard gaat met een wijziging van de provinciegrens kunnen provinciale staten van één provincie een
      herindelingsadvies vaststellen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel4
  - number: '5.1'
    text: |-
      Bij de voorbereiding van een herindelingsregeling tot grenscorrectie als bedoeld in
      [artikel 3, tweede lid, onder a][ref1], of van een herindelingsadvies met betrekking tot een wijziging van de
      gemeentelijke indeling als bedoeld in [artikel 4, tweede lid][ref2], stellen de raden van de betrokken gemeenten
      gezamenlijk een herindelingsontwerp vast en zenden dit aan gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel4
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
  - number: '5.2'
    text: |-
      Burgemeester en wethouders leggen het herindelingsontwerp gedurende acht weken ter inzage op de gemeentesecretarie.
      De terinzagelegging wordt bekendgemaakt. Gedurende de termijn van terinzagelegging kan een ieder zijn zienswijze
      over het ontwerp kenbaar maken aan het college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel5
  - number: '5.3'
    text: |-
      Het herindelingsadvies wordt door gedeputeerde staten aan Onze Minister gezonden tezamen met de zienswijze van
      gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel5
  - number: '5.4'
    text: |-
      De gemeenteraad onderscheidenlijk burgemeester en wethouders treffen op grond van dit artikel geen voorbereidingen
      voor een wijziging van de grenzen van de gemeente na het tijdstip waarop gedeputeerde staten of Onze Minister
      hebben medegedeeld dat door hen werkzaamheden ter hand zijn genomen in verband met de voorbereiding van een
      wijziging van de grenzen van de gemeente.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel5
  - number: '6'
    text: |-
      Indien Onze Minister besluit op basis van een herindelingsadvies een voorstel voor een herindelingsregeling te
      doen, zendt hij het voorstel aan de ministerraad binnen vier maanden na ontvangst van het herindelingsadvies.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel6
  - number: '7'
    text: |-
      De voorbereiding van een herindelingsregeling tot grenscorrectie als bedoeld in
      [artikel 3, tweede lid, onder b][ref1], of van een herindelingsadvies met betrekking tot een wijziging
      van de gemeentelijke indeling als bedoeld in [artikel 4, eerste lid][ref2], geschiedt met toepassing van
      [artikel 8][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: '8.1'
    text: |-
      Gedeputeerde staten stellen burgemeester en wethouders van de betrokken gemeenten in de gelegenheid met hen overleg
      te voeren over de wens tot grenscorrectie of tot wijziging van de gemeentelijke indeling. Het overleg duurt ten
      hoogste zes maanden.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel8
  - number: '8.2'
    text: |-
      Uiterlijk drie maanden na afloop van het overleg stellen gedeputeerde staten een herindelingsontwerp vast en zenden
      dit tezamen met een verslag van het gevoerde overleg aan de gemeenteraden en aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel8
  - number: '8.3'
    text: |-
      Burgemeester en wethouders leggen het herindelingsontwerp binnen twee weken na ontvangst gedurende acht weken ter
      inzage op de gemeentesecretarie. De terinzagelegging wordt bekendgemaakt. Gedurende de termijn van terinzagelegging
      kan een ieder zijn zienswijze over het ontwerp kenbaar maken aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel8
  - number: '8.4'
    text: |-
      De gemeenteraden kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp hun zienswijze kenbaar
      maken aan gedeputeerde staten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel8
  - number: '8.5'
    text: |-
      De herindelingsregeling of het herindelingsadvies wordt vastgesteld uiterlijk vier maanden na afloop van de
      termijn, bedoeld in het vierde lid. Een vastgesteld herindelingsadvies wordt aan Onze Minister gezonden. Van de
      vaststelling van een herindelingsregeling wordt aan Onze Minister mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel8
  - number: '9.1'
    text: |-
      De voorbereiding van een herindelingsregeling tot een grenscorrectie die gepaard gaat met een wijziging
      van een provinciegrens als bedoeld in [artikel 3, derde lid, onder a][ref1], of van een daartoe strekkend
      herindelingsadvies als bedoeld in [artikel 4, derde lid][ref2], geschiedt met overeenkomstige toepassing van
      [artikel 8][ref3], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '3'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '4'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 9.1.a
    text: |-
      tevens gedeputeerde staten van de andere betrokken provincie of provincies in de gelegenheid worden gesteld tot het
      voeren van het overleg bedoeld in [artikel 8, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 9.1.b
    text: |-
      het herindelingsontwerp tevens aan provinciale staten van de andere betrokken provincie of provincies wordt
      gezonden. Zij kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp hun zienswijze over het
      ontwerp kenbaar maken aan de gedeputeerde staten die het voorstel hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel9
  - number: '9.2'
    text: Het herindelingsontwerp wordt tevens toegezonden aan de betrokken waterschapsbesturen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel9
  - number: '10'
    text: |-
      Gedeputeerde staten treffen op grond van de [artikelen 8][ref1] en [9][ref2] geen voorbereidingen voor een
      wijziging van de grenzen van een gemeente na het tijdstip waarop Onze Minister heeft medegedeeld dat door hem
      werkzaamheden ter hand zijn genomen in verband met de voorbereiding van een wijziging van de grenzen van de
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel9
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '11'
    text: |-
      Indien Onze Minister besluit op basis van een herindelingsadvies een voorstel voor een herindelingsregeling te
      doen, zendt hij het voorstel aan de ministerraad binnen vier maanden na ontvangst van het herindelingsadvies.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel11
  - number: '12.1'
    text: |-
      De voorbereiding van een herindelingsregeling door Onze Minister geschiedt met overeenkomstige toepassing van
      [artikel 8, eerste tot en met vierde lid][ref1], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 12.1.a
    text: Onze Minister in de plaats treedt van gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel12
  - number: 12.1.b
    text: |-
      tevens gedeputeerde staten van de betrokken provincie of van de betrokken provincies in de gelegenheid worden
      gesteld tot het voeren van het overleg, bedoeld in [artikel 8, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 12.1.c
    text: |-
      het herindelingsontwerp tevens aan gedeputeerde staten van de betrokken provincie wordt gezonden dan wel aan de
      provinciale staten van de betrokken provincies indien het betreft een grenscorrectie die gepaard gaat met een
      wijziging van een provinciegrens. Zij kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp
      hun zienswijze over het ontwerp kenbaar maken aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel12
  - number: '12.2'
    text: |-
      Indien door gedeputeerde staten met betrekking tot gemeenten voorbereidingen zijn getroffen als bedoeld in de
      [artikelen 8][ref1] en [9][ref2] voor een herindelingsadvies of een herindelingsregeling en Onze Minister met
      toepassing van het eerste lid de voorbereiding van een herindelingsregeling ten aanzien van die gemeenten ter hand
      neemt, kunnen de door gedeputeerde staten getroffen voorbereidingen door Onze Minister worden aangemerkt als door
      hem getroffen voorbereidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel9
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '9'
        hoofdstuk: II
        paragraaf: '3'
  - number: '13.1'
    text: Een wijziging van de provinciale indeling geschiedt bij wet.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel13
  - number: '13.2'
    text: |-
      Een wijziging van de provinciale indeling die betreft een wijziging van provinciegrenzen met niet provinciaal
      ingedeeld gebied kan geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel13
  - number: '14.1'
    text: |-
      Een herindelingsadvies met betrekking tot een wijziging van de provinciale indeling wordt vastgesteld door de
      provinciale staten van de betrokken provincies gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel14
  - number: '14.2'
    text: |-
      Indien de besturen van de betrokken provincies van oordeel verschillen over de wenselijkheid van een wijziging van
      de provinciale indeling kunnen provinciale staten van één provincie een herindelingsadvies vaststellen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel14
  - number: '14.3'
    text: |-
      Een herindelingsadvies met betrekking tot een wijziging van de provinciale indeling die één provincie betreft en
      geschiedt zonder wijziging van grenzen van een andere provincie, wordt vastgesteld door provinciale staten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel14
  - number: '15.1'
    text: |-
      Ten behoeve van de voorbereiding van een herindelingsadvies met betrekking tot een wijziging van de provinciale
      indeling als bedoeld in [artikel 14, eerste lid][ref1], stellen provinciale staten van de betrokken provincies een
      commissie in die is samengesteld uit leden van gedeputeerde staten van de betrokken provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel14
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
  - number: '15.2'
    text: |-
      De voorbereiding van het herindelingsadvies geschiedt met overeenkomstige toepassing van [artikel 8][ref1], met
      dien verstande dat de commissie in de plaats treedt van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: '16'
    text: |-
      De voorbereiding van een herindelingsadvies met betrekking tot een wijziging van de provinciale indeling als
      bedoeld in [artikel 14, tweede lid][ref1], geschiedt met overeenkomstige toepassing van [artikel 8][ref2], met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 16.a
    text: |-
      tevens gedeputeerde staten van de andere betrokken provincie of provincies in de gelegenheid worden gesteld tot het
      voeren van het overleg, bedoeld in [artikel 8, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 16.b
    text: |-
      gedeputeerde staten het herindelingsontwerp tevens aan provinciale staten van de andere betrokken provincie of
      provincies zenden. Zij kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp hun zienswijze
      kenbaar maken aan de gedeputeerde staten die het voorstel hebben gedaan.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel16
  - number: '17'
    text: |-
      De voorbereiding van een herindelingsadvies met betrekking tot een wijziging van de provinciale indeling als
      bedoeld in [artikel 14, derde lid][ref1], geschiedt met overeenkomstige toepassing van [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '14'
        hoofdstuk: III
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: '18'
    text: |-
      Indien Onze Minister besluit op basis van een herindelingsadvies een voorstel voor een herindelingsregeling te
      doen, zendt hij het voorstel aan de ministerraad binnen vier maanden na ontvangst van het herindelingsadvies.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel18
  - number: '19.1'
    text: |-
      De voorbereiding van een herindelingsregeling door Onze Minister geschiedt met overeenkomstige toepassing van
      [artikel 8, eerste tot en met vierde lid][ref1], met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 19.1.a
    text: Onze Minister in de plaats treedt van gedeputeerde staten;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel19
  - number: 19.1.b
    text: |-
      tevens gedeputeerde staten van de betrokken provincie of provincies in de gelegenheid worden gesteld tot het voeren
      van het overleg, bedoeld in [artikel 8, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '8'
        hoofdstuk: II
        paragraaf: '3'
  - number: 19.1.c
    text: |-
      het herindelingsontwerp tevens aan provinciale staten van de betrokken provincie of provincies wordt gezonden. Deze
      kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp hun zienswijze over het ontwerp kenbaar
      maken aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel19
  - number: '19.2'
    text: |-
      [Artikel 10][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel10
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: '19.3'
    text: |-
      Indien door gedeputeerde staten of een commissie als bedoeld in [artikel 15, eerste lid][ref1], met
      betrekking tot een wijziging van de provinciegrenzen voorbereidingen zijn getroffen als bedoeld in de
      [artikelen 15 tot en met 17][ref2] voor een herindelingsadvies of een herindelingsregeling en Onze Minister met
      toepassing van het eerste lid de voorbereiding van een herindelingsregeling ten aanzien van die provinciegrenzen
      ter hand neemt, kunnen de door gedeputeerde staten of de commissie getroffen voorbereidingen door Onze Minister
      worden aangemerkt als door hem getroffen voorbereidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel15
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '15'
        hoofdstuk: III
        paragraaf: '2'
  - number: '20'
    text: |-
      Een herindelingsontwerp vastgesteld met toepassing van dit hoofdstuk wordt tevens toegezonden aan de betrokken
      waterschapsbesturen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel20
  - number: '21.1'
    text: |-
      Met ingang van de dag waarop een gemeente blijkens een herindelingsontwerp, een herindelingsadvies of een voorstel
      van wet in aanmerking komt om te worden opgeheven, behoeven de door gedeputeerde staten aangewezen besluiten van
      de raden en de colleges van burgemeester en wethouders van de betrokken gemeenten de goedkeuring van gedeputeerde
      staten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel21
  - number: '21.2'
    text: |-
      Aangewezen kunnen worden categorieën van besluiten die kunnen leiden tot nieuwe uitgaven, tot verhoging van
      bestaande uitgaven dan wel tot verlaging van bestaande inkomsten of tot vermindering van vermogen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel21
  - number: '21.3'
    text: |-
      De goedkeuring kan worden onthouden wegens strijd met het financieel belang van de gemeente of gemeenten waarvan
      het gebied van de betrokken gemeente na herindeling deel zal gaan uitmaken.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel21
  - number: '21.4'
    text: |-
      Het toezicht dat is aangevangen op grond van het eerste lid blijft van kracht tot de datum van herindeling of de
      datum waarop Onze Minister bepaalt dat het toezicht is vervallen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel21
  - number: '28'
    text: |-
      De op de dag, voorafgaande aan de datum van herindeling, voor een overgaand gebied geldende gemeentelijke
      voorschriften behouden gedurende twee jaren na die datum voor dat gebied hun rechtskracht, voor zover het bevoegde
      orgaan van de gemeente waaraan dat gebied is toegevoegd, deze voorschriften niet eerder vervallen verklaart.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel28
  - number: '29.1'
    text: |-
      Het bevoegde orgaan van een nieuwe gemeente kan vóór afloop van de in [artikel 28][ref1] bedoelde termijn een
      voorschrift als in dat artikel bedoeld voor het gehele gebied der gemeente geldend verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
  - number: '29.2'
    text: |-
      Op gelijke wijze maken burgemeester en wethouders van de nieuwe gemeente tijdig vóór afloop van de in
      [artikel 28][ref1] bedoelde termijn bekend welke overige in dat artikel bedoelde voorschriften na afloop van die
      termijn voor het gehele gebied der gemeente zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
  - number: '30.1'
    text: |-
      De op de dag, voorafgaande aan de datum van herindeling, in een gemeente van kracht zijnde gemeentelijke
      voorschriften gelden gedurende twee jaren na die datum niet voor aan die gemeente toegevoegd gebied, voor zover het
      bevoegde orgaan van die gemeente deze voorschriften niet eerder voor dat gebied geldend verklaart.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel30
  - number: '30.2'
    text: |-
      Het college van burgemeester en wethouders maakt tijdig vóór afloop van de in het eerste lid bedoelde termijn
      bekend welke in dat lid bedoelde voorschriften na afloop van die termijn voor het toegevoegde gebied zullen gelden.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel30
  - number: '31'
    text: |-
      De op de dag, voorafgaande aan de datum van herindeling, geldende besluiten tot instelling van commissies
      als bedoeld in [hoofdstuk V van de Gemeentewet][ref1] van gemeenten waarin een raadsverkiezing als bedoeld in
      [artikel 52][ref2] is gehouden, vervallen met ingang van die datum. Zij kunnen binnen een maand na die datum door
      het op grond van dat hoofdstuk bevoegde orgaan tot instelling van de commissies geheel of ten dele wederom geldend
      worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0005416
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '32.1'
    text: |-
      De artikelen 28 tot en met 30 zijn niet van toepassing op belastingverordeningen op de voet van artikel 220 van de
      Gemeentewet. Ten aanzien van overgaand gebied houden deze verordeningen op te gelden met ingang van de datum van
      herindeling, doch zij behouden, onverminderd [artikel 39][ref1], hun rechtskracht voor de belastingjaren welke vóór
      die datum zijn aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel39
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '39'
        hoofdstuk: V
  - number: '32.2'
    text: |-
      De raad van een nieuwe gemeente kan binnen drie maanden na de datum van herindeling ingevolge
      [artikel 216 van de Gemeentewet][ref1] besluiten tot vaststelling van een nieuwe verordening die met ingang van
      genoemde datum zal gelden voor de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel216
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '216'
  - number: '32.3'
    text: |-
      Voor gebied dat overgaat naar een andere dan een nieuwe gemeente is met ingang van de datum van herindeling
      van toepassing de verordening van de gemeente waaraan dat gebied is toegevoegd. Voor zover de herindeling zulks
      noodzakelijk maakt, is de raad van de gemeente waaraan het gebied is toegevoegd, bevoegd binnen drie maanden na de
      datum van herindeling te besluiten tot aanpassing van de verordening. De aangepaste verordening geldt met ingang
      van genoemde datum voor het gehele gebied der gemeente.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel32
  - number: '32.4'
    text: |-
      De [artikelen 28 tot en met 30][ref1] zijn evenmin van toepassing op besluiten inzake de baatbelasting
      die zijn vastgesteld op de voet van [artikel 222 van de Gemeentewet][ref2] en op besluiten als bedoeld in
      __REF002___________________________________________________________________________________________________________
      ________. Deze besluiten worden aangemerkt als besluiten van de gemeente waaraan het gebied is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel222
      [ref3]: https://wetten.overheid.nl/BWBR0006638#ArtikelXV
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '222'
      - id: ref3
        bwb_id: BWBR0006638
        artikel: XV
  - number: '33'
    text: |-
      De [artikelen 28 tot en met 30][ref1] en [32][ref2] zijn van overeenkomstige toepassing op besluiten tot
      vaststelling, wijziging of intrekking van belastingverordeningen die zijn genomen vóór de datum van herindeling en
      die op of na die datum in werking treden.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel32
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '32'
        hoofdstuk: V
  - number: '34.1'
    text: |-
      In afwijking van [artikel 28][ref1] worden vóór de datum van herindeling vastgestelde structuurvisies,
      bestemmingsplannen, beheersverordeningen en exploitatieplannen als bedoeld in respectievelijk
      [artikel 2.1][ref2], [3.1][ref3], [3.38][ref4] en [6.12 van de Wet ruimtelijke ordening][ref5] en
      besluiten waarbij gronden worden aangewezen tot gebied waarop een voorkeursrecht rust als bedoeld in
      [artikel 2, eerste lid, van de Wet voorkeursrecht gemeenten][ref6], met betrekking tot overgaand gebied geacht
      te zijn vastgesteld door het bevoegde orgaan van de gemeente waaraan dat gebied is toegevoegd en behouden zij hun
      rechtskracht zolang het bevoegde orgaan niet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0020449#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0020449#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0020449#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0003391#Artikel2
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0020449
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0020449
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0020449
        artikel: '6'
      - id: ref6
        bwb_id: BWBR0003391
        artikel: '2'
  - number: '34.2'
    text: |-
      Evenzo wordt een vóór de datum van herindeling genomen voorbereidingsbesluit als bedoeld in
      [artikel 3.7 van de Wet ruimtelijke ordening][ref1] met betrekking tot overgaand gebied geacht te zijn genomen door
      de raad van de gemeente waaraan dat gebied is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0020449#Artikel3
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0020449
        artikel: '3'
  - number: '35'
    text: |-
      Bij wijziging van een provinciegrens zijn de [artikelen 28][ref1] en [30][ref2] van overeenkomstige toepassing op
      provinciale voorschriften en het bevoegde orgaan van de betrokken provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel30
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '30'
        hoofdstuk: V
  - number: '36.1'
    text: |-
      Voor de secretaris en de griffier van een nieuwe gemeente gelden de instructies van de in de betrokken
      herindelingsregeling aan te wijzen gemeente totdat zij door andere zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel36
  - number: '36.2'
    text: |-
      Voor de vergaderingen van de raad en van burgemeester en wethouders van een nieuwe gemeente gelden de reglementen
      van orde van de in de betrokken herindelingswet aan te wijzen gemeente totdat zij door andere zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel36
  - number: '37'
    text: |-
      Met ingang van de datum van herindeling en zolang de in [artikel 28][ref1] bedoelde voorschriften blijven gelden,
      oefenen in toegevoegd gebied de in de gemeente waarnaar dat gebied is overgegaan, bevoegde organen en ambtenaren de
      bevoegdheden uit welke bij die voorschriften aan overeenkomstige organen en ambtenaren zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
  - number: '38.1'
    text: |-
      Bij wijziging van een provinciegrens is [artikel 37][ref1] van overeenkomstige toepassing ten aanzien van de
      bevoegdheden van de organen en de ambtenaren van de provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel37
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '37'
        hoofdstuk: V
  - number: '38.2'
    text: |-
      In afwijking van het eerste lid wordt het toezicht op de bij de wijziging van de provinciale grens betrokken
      waterschappen uitgeoefend door de organen die daarmede op de dag, voorafgaande aan de datum van herindeling, belast
      waren, totdat bij reglementswijziging in de gevolgen van de betrokken herindelingsregeling is voorzien. Indien
      tussen de betrokken gedeputeerde staten niet binnen een jaar omtrent de reglementswijziging overeenstemming is
      bereikt, is [artikel 4 van de Waterstaatswet 1900][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel4
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '4'
  - number: '39.1'
    text: |-
      De bevoegdheid tot het heffen en invorderen van gemeentelijke belastingen in toegevoegd gebied over een
      belastingjaar dat vóór de datum van herindeling is aangevangen, blijft voorbehouden aan de organen en ambtenaren
      van de gemeente waartoe dat gebied vóór die datum behoorde.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel39
  - number: '39.2'
    text: |-
      Indien de gemeente bij een herindelingswet wordt opgeheven, komt de bevoegdheid toe aan de organen en ambtenaren
      van de in die wet aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel39
  - number: '40'
    text: |-
      Onverminderd de [artikelen 226][ref1] en [228 van de Provinciewet][ref2] is bij wijziging van een provinciegrens
      [artikel 39, eerste lid][ref3], van overeenkomstige toepassing ten aanzien van provinciale belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel226
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel228
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel39
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '226'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '228'
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '39'
        hoofdstuk: V
  - number: '41.1'
    text: |-
      Gemeenschappelijke regelingen waaraan uitsluitend wordt deelgenomen door gemeenten waarvan het gebied in
      zijn geheel tot een en dezelfde gemeente komt te behoren, vervallen met ingang van de datum van herindeling.
      Burgemeester en wethouders van die gemeente treffen in verband hiermee de nodige voorzieningen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel41
  - number: '41.2'
    text: |-
      In een herindelingsregeling kan het eerste lid van overeenkomstige toepassing worden verklaard ten aanzien van
      gemeenschappelijke regelingen waaraan uitsluitend wordt deelgenomen door gemeenten waarvan het gebied grotendeels
      tot een en dezelfde gemeente komt te behoren.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel41
  - number: '41.3'
    text: |-
      De overige gemeenschappelijke regelingen waaraan bij een wijziging van de gemeentelijke indeling betrokken
      gemeenten deelnemen, blijven ongewijzigd van kracht, met dien verstande dat de betrokken herindelingsregeling
      de gemeente of gemeenten aanwijst die, zolang nog geen uitvoering is gegeven aan het vierde of vijfde lid van
      dit artikel, voor de toepassing van de regeling in de plaats treedt onderscheidenlijk treden van op te heffen
      gemeenten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel41
  - number: '41.4'
    text: |-
      De deelnemers aan een gemeenschappelijke regeling als bedoeld in het derde lid treffen, voor zoveel nodig, binnen
      zes maanden na de datum van herindeling met toepassing van de [Wet gemeenschappelijke regelingen][ref1] de uit de
      gewijzigde gemeentelijke indeling voortvloeiende voorzieningen. Zij kunnen daarbij afwijken van de bepalingen van
      de gemeenschappelijke regeling met betrekking tot wijziging en opheffing van de regeling en het toe- en uittreden
      van deelnemers. De in de eerste volzin genoemde termijn kan door gedeputeerde staten van de betrokken provincie of,
      zo de regeling uitsluitend tussen burgemeesters is aangegaan, door de commissaris van de Koning in die provincie
      met ten hoogste zes maanden worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '41.5'
    text: |-
      Indien de voorzieningen, bedoeld in het vierde lid, niet binnen de daarvoor gestelde termijn zijn getroffen, kan
      dit geschieden door gedeputeerde staten of, zo de regeling uitsluitend tussen burgemeesters is aangegaan, door de
      commissaris van de Koning.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel41
  - number: '41.6'
    text: |-
      De leden van bij gemeenschappelijke regeling ingestelde organen, aangewezen door de vóór de datum van herindeling
      bevoegde gemeentebesturen, blijven in deze organen zitting hebben totdat de na de datum van herindeling bevoegde
      gemeentebesturen, zo nodig met afwijking van hetgeen in de gemeenschappelijke regeling ten aanzien van de
      zittingsduur is bepaald, in de aanwijzing hebben voorzien.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel41
  - number: '41.7'
    text: |-
      De voorgaande leden zijn niet van toepassing ten aanzien van gemeenschappelijke regelingen die van kracht zijn voor
      een gebied waarvan de omvang bij of krachtens wet dan wel bij koninklijk besluit is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel41
  - number: '43'
    text: |-
      Voor zover aan een gemeenschappelijke regeling als bedoeld in [artikel 41, derde lid][ref1], wordt deelgenomen
      door een provincie en die regeling mede betrekking heeft op gebied dat ingevolge een herindelingsregeling naar een
      andere provincie overgaat, is artikel 41, derde, vierde, zesde en zevende lid, van overeenkomstige toepassing ten
      aanzien van de betrokken provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel41
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '41'
        hoofdstuk: V
  - number: 43a.1
    text: |-
      In afwijking van [artikel 81p van de Gemeentewet][ref1] kan de raad van een nieuwe gemeente op uiterlijk
      15 januari van het jaar waarin de gemeente is ingesteld, de behandeling van verzoekschriften als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref2], opdragen aan een gemeentelijke ombudsman of
      ombudscommissie, dan wel een gezamenlijke ombudsman of ombudscommissie. Het besluit werkt terug tot en met de datum
      van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81p
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 43a.2
    text: |-
      Indien de raad een besluit als bedoeld in het eerste lid neemt, zendt hij dit binnen een week aan de Nationale
      ombudsman.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel43a
  - number: '44.1'
    text: |-
      Onverminderd het tweede lid en de [artikelen 45][ref1] en [48][ref2] gaan op de datum van herindeling alle rechten
      en verplichtingen van een op te heffen gemeente over op de gemeente waaraan haar gebied wordt toegevoegd, dan wel,
      wanneer het gebied naar meer dan één gemeente overgaat, naar de in de betrokken herindelingsregeling aan te wijzen
      gemeente, zonder dat daarvoor een nadere akte wordt gevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel46
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '45'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '46'
        hoofdstuk: VI
  - number: '44.2'
    text: |-
      Alle rechten en verplichtingen van een gemeente, betrekking hebbende op van die gemeente overgaand gebied, gaan op
      de datum van herindeling over op de gemeente waaraan dat gebied wordt toegevoegd, zonder dat daarvoor een nadere
      akte wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel44
  - number: '44.3'
    text: |-
      Wettelijke procedures en rechtsgedingen waarbij een gemeente waarvan gebied overgaat betrokken is, worden met
      ingang van de datum van herindeling voortgezet door of tegen de gemeente waaraan dat gebied wordt toegevoegd,
      voor zover krachtens het eerste en tweede lid de in deze leden bedoelde rechten en verplichtingen op die gemeente
      overgaan. Ten aanzien van de rechtsgedingen is de [elfde afdeling van de tweede titel van het eerste boek van het
      Wetboek van Burgerlijke Rechtsvordering](onbekend) van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel44
  - number: '44.4'
    text: |-
      Gedeputeerde staten van de betrokken provincie doen, ingeval op grond van het eerste en tweede lid
      registergoederen overgaan, de overgang van de betrokken registergoederen onverwijld inschrijven in de
      openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref1].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel24
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005291
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '24'
  - number: '45.1'
    text: |-
      Met betrekking tot de voorziening van drinkwater, elektriciteit en gas blijft toegevoegd gebied deel uitmaken
      van het voorzieningsgebied van de bedrijven die daarin voorzagen of gerechtigd waren te voorzien op de dag,
      voorafgaande aan de datum van herindeling, voor zover de betrokken partijen ter zake geen nadere regeling treffen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel45
  - number: '45.2'
    text: |-
      Bij opheffing van een gemeente treedt ten aanzien van de rechten en verplichtingen die verband houden met de in het
      eerste lid bedoelde voorzieningen de in de betrokken herindelingswet aan te wijzen gemeente voor die gemeente in de
      plaats, zonder dat daarvoor een nadere akte wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel45
  - number: '46'
    text: |-
      Bij wijziging van een provinciegrens zijn de [artikelen 44][ref1] en [45][ref2] van overeenkomstige toepassing ten
      aanzien van rechten en verplichtingen van een provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel45
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '44'
        hoofdstuk: VI
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '45'
        hoofdstuk: VI
  - number: '47.1'
    text: |-
      Ten behoeve van de voortzetting van het comptabel beheer in verband met de overgang van gebied kunnen gedeputeerde
      staten, de colleges van burgemeester en wethouders van de betrokken gemeenten gehoord, aanwijzingen geven, welke
      door die colleges in acht moeten worden genomen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel47
  - number: '47.2'
    text: |-
      Voor het tijdvak waarin voor een nieuwe gemeente nog geen begroting is vastgesteld, zijn burgemeester en wethouders
      bevoegd tot het doen van uitgaven, voor zover daartegen bij gedeputeerde staten geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel47
  - number: '48.1'
    text: |-
      De uitkeringen die door onderscheidenlijk aan het Rijk, de provincie of gemeenten over de vóór de datum van
      herindeling aangevangen boekingstijdvakken, dienstjaren of uitkeringsjaren met betrekking tot overgaand gebied van
      een gemeente verschuldigd zijn, worden gedaan aan onderscheidenlijk door de gemeente waartoe dat gebied vóór die
      datum behoorde.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel48
  - number: '48.2'
    text: |-
      Wanneer het een op te heffen gemeente betreft, geschieden de in het eerste lid bedoelde uitkeringen aan
      onderscheidenlijk door de gemeente waaraan het gebied van de op te heffen gemeente wordt toegevoegd of zo dit
      gebied naar meer dan één gemeente overgaat, de in de betrokken herindelingswet aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel48
  - number: '49'
    text: |-
      Bij wijziging van een provinciegrens is [artikel 48][ref1] van overeenkomstige toepassing ten aanzien van door
      onderscheidenlijk aan het Rijk of gemeenten met betrekking tot overgaand gebied van een provincie verschuldigde
      uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel48
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '48'
        hoofdstuk: VI
  - number: '50.1'
    text: |-
      Indien in verband met de [artikelen 39][ref1], [41][ref2], [44][ref3], [45][ref4] en [48][ref5] een verrekening
      tussen gemeenten dient plaats te vinden worden, burgemeester en wethouders van die gemeenten gehoord, het bedrag
      en, zo nodig, de wijze van betaling vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0003718#Artikel45
      [ref5]: https://wetten.overheid.nl/BWBR0003718#Artikel48
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '39'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '41'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '44'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0003718
        artikel: '45'
        hoofdstuk: VI
      - id: ref5
        bwb_id: BWBR0003718
        artikel: '48'
        hoofdstuk: VI
  - number: 50.1.a
    text: |-
      door gedeputeerde staten van de betrokken provincie indien de desbetreffende wijziging van de gemeentelijke
      indeling dan wel grenscorrectie niet gepaard gaat met wijziging van de provinciegrens;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel50
  - number: 50.1.b
    text: |-
      door de colleges van gedeputeerde staten van de betrokken provincies in onderling overleg indien de desbetreffende
      wijziging van de gemeentelijke indeling dan wel grenscorrectie gepaard gaat met wijziging van de provinciegrens;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel50
  - number: 50.1.c
    text: |-
      bij koninklijk besluit, de colleges, bedoeld onder b, gehoord, indien overeenstemming tussen die colleges
      ontbreekt.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel50
  - number: '50.2'
    text: |-
      Bij het vaststellen van het bedrag van de verrekening, bedoeld in het eerste lid, kunnen reserves en voorzieningen
      worden betrokken.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel50
  - number: '50.3'
    text: |-
      Op een verzoek om verrekening als bedoeld in het eerste lid beslissen gedeputeerde staten niet afwijzend dan na de
      colleges van burgemeester en wethouders van de in dat lid bedoelde gemeenten te hebben gehoord.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel50
  - number: '51.1'
    text: |-
      Indien bij een wijziging van een provinciegrens in verband met de [artikelen 40][ref1], [43][ref2], [46][ref3] en
      [49][ref4] een verrekening tussen provincies dient plaats te vinden, worden het bedrag en de wijze van betaling
      daarvan vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel46
      [ref4]: https://wetten.overheid.nl/BWBR0003718#Artikel49
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '40'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '43'
        hoofdstuk: V
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '46'
        hoofdstuk: VI
      - id: ref4
        bwb_id: BWBR0003718
        artikel: '49'
        hoofdstuk: VI
  - number: 51.1.a
    text: door de colleges van gedeputeerde staten van de betrokken provincies in onderling overleg;
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel51
  - number: 51.1.b
    text: |-
      bij koninklijk besluit, de colleges, bedoeld onder a, gehoord, indien overeenstemming tussen die colleges
      ontbreekt.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel51
  - number: '51.2'
    text: |-
      Bij het vaststellen van het bedrag van de verrekening, bedoeld in het eerste lid, kunnen reserves en voorzieningen
      worden betrokken.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel51
  - number: '52'
    text: |-
      Bij een wijziging van de gemeentelijke indeling vinden tussentijdse raadsverkiezingen plaats. Indien een nieuwe
      gemeente wordt ingesteld is de naar inwoneraantal grootste gemeente die opgaat in de nieuwe gemeente met de
      voorbereiding daarvan belast.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel52
  - number: '53.1'
    text: |-
      De op de dag, voorafgaande aan de datum van herindeling, zitting hebbende leden van de raad van een gemeente
      waarvoor een verkiezing als bedoeld in [artikel 52][ref1] wordt gehouden, treden met ingang van die datum af.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '53.2'
    text: |-
      Indien op de datum van herindeling niet de goedkeuring van de geloofsbrieven van meer dan de helft van de
      leden van de raad onherroepelijk is geworden, aanvaarden de leden van de raad hun ambt niet, totdat zulks
      het geval is. Gedurende deze tijd hebben de leden van de raad en de wethouders van de gemeente die ingevolge
      [artikel 52, tweede volzin][ref1], met de voorbereiding van de tussentijdse raadsverkiezing is belast zitting als
      leden van de raad onderscheidenlijk als wethouders. De raad en het college van burgemeester en wethouders nemen
      gedurende deze tijd slechts besluiten welke geen uitstel kunnen lijden.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '54.1'
    text: |-
      Burgemeester en wethouders van een gemeente waarvan gebied overgaat naar een gemeente waarvoor een verkiezing
      als bedoeld in [artikel 52][ref1] wordt gehouden, zenden op een door gedeputeerde staten van de provincie waarvan
      laatstbedoelde gemeente deel uitmaakt of zal uitmaken, te bepalen datum aan burgemeester en wethouders van deze
      gemeente onderscheidenlijk de gemeente die ingevolge artikel 52, tweede volzin, met de voorbereiding van de
      tussentijdse raadsverkiezing is belast een opgave van de op bedoelde datum geregistreerde kiesgerechtigde personen
      welke op die datum in het overgaande gebied werkelijke woonplaats hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '54.2'
    text: |-
      Indien tussen de in het eerste lid bedoelde datum en de dag van kandidaatstelling, bedoeld in
      [artikel 55, tweede lid][ref1], veranderingen optreden in de registratie van kiesgerechtigden die werkelijke
      woonplaats hebben of verkrijgen in de gemeente of het deel van de gemeente waarop een opgave als bedoeld in
      het eerste lid betrekking heeft, worden deze veranderingen onverwijld ter kennis gebracht van burgemeester en
      wethouders aan wie die opgave is gezonden, waarna dit college deze veranderingen in de opgave aanbrengt.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel55
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '55.1'
    text: |-
      De raad van een gemeente waarvoor een verkiezing als bedoeld in [artikel 52][ref1] wordt gehouden, zal bestaan uit
      het door gedeputeerde staten van de betrokken provincie met toepassing van [artikel 8 van de Gemeentewet][ref2] te
      bepalen aantal leden. Daartoe wordt het inwonertal van een gemeente bepaald aan de hand van de door het Centraal
      Bureau voor de Statistiek bekend gemaakte gegevens betreffende de bevolkingscijfers per 1 januari van het jaar
      waarin de verkiezing plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '8'
  - number: '55.2'
    text: |-
      De kandidaatstelling vindt plaats op de maandag in de periode van 5 tot en met 11 oktober voorafgaand aan de datum
      van herindeling. De stemming vindt plaats op de vierenveertigste dag na de kandidaatstelling. Gedeputeerde staten
      kunnen, indien zwaarwegende redenen verband houdend met de dag van kandidaatstelling of met de dag van stemming
      daartoe nopen, bepalen dat de kandidaatstelling op een andere datum plaatsvindt, met dien verstande dat de stemming
      voor de datum van herindeling plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel55
  - number: '55.3'
    text: |-
      Gedeputeerde staten kunnen besluiten tot afwijking van de in de [artikelen G 1, achtste lid][ref1],
      [G 2, achtste lid][ref2], [G 3, eerste lid][ref3], [G 4, derde lid][ref4], en
      [G 5, eerste lid, onder b en c, van de Kieswet][ref5] bedoelde termijnen inzake registratie van aanduidingen van
      politieke groeperingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627
      [ref4]: https://wetten.overheid.nl/BWBR0004627
      [ref5]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0004627
      - id: ref4
        bwb_id: BWBR0004627
      - id: ref5
        bwb_id: BWBR0004627
  - number: '55.4'
    text: |-
      Indien het een nieuwe gemeente betreft worden bij de nummering van de kandidatenlijsten in afwijking van
      [artikel I 14, eerste lid, eerste volzin, van de Kieswet][ref1] eerst genummerd de lijsten van politieke
      groeperingen wier aanduiding was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden verkiezing van
      de raad van de gemeente die met de voorbereiding van de verkiezing is belast, een of meer zetels zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelI_14
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: I_14
  - number: '55.5'
    text: |-
      Als kiesgerechtigden worden geacht te zijn geregistreerd degenen die als zodanig zijn geregistreerd in de bij een
      wijziging van de gemeentelijke indeling betrokken gemeente die niet wordt opgeheven onderscheidenlijk de gemeente
      die ingevolge [artikel 52, tweede volzin][ref1], met de voorbereiding van de tussentijdse raadsverkiezing is
      belast, nadat daaraan zijn toegevoegd de personen die voorkomen op de ingevolge [artikel 54, eerste lid][ref2],
      ontvangen opgaven zoals deze luiden na toepassing van het tweede lid van dat artikel, en daarvan zijn afgevoerd de
      personen die op de dag van kandidaatstelling, bedoeld in het tweede lid, werkelijke woonplaats hebben in het deel
      der gemeente dat op de datum van herindeling naar een andere gemeente overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel54
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '54'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '55.6'
    text: |-
      Het benoemen van de leden en de plaatsvervangende leden van de hoofdstembureaus en het benoemen van de leden en
      de plaatsvervangende leden van de stembureaus geschieden voor een door gedeputeerde staten te bepalen datum door
      burgemeester en wethouders van de bij een wijziging van de gemeentelijke indeling betrokken gemeente die niet wordt
      opgeheven onderscheidenlijk de gemeente die ingevolge [artikel 52, tweede volzin][ref1], met de voorbereiding
      van de tussentijdse raadsverkiezing is belast. De benoeming van de leden en de plaatsvervangende leden van de
      hoofdstembureaus geschiedt, in afwijking van [artikel E 8 van de Kieswet](onbekend), voor een periode die eindigt
      op hetzelfde tijdstip als de eerste zittingsperiode van de nieuw gekozen raden der gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '55.7'
    text: |-
      Voor zover ingevolge enig wettelijk voorschrift medewerking moet worden verleend door de raad, door burgemeester en
      wethouders of door de burgemeester, geschiedt dit door de raad, burgemeester en wethouders of de burgemeester van
      de bij een wijziging van de gemeentelijke indeling betrokken gemeente die niet wordt opgeheven onderscheidenlijk de
      gemeente die ingevolge [artikel 52, tweede volzin][ref1], met de voorbereiding van de tussentijdse raadsverkiezing
      is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '56.1'
    text: |-
      Voor de toepassing van [artikel 10 van de Gemeentewet][ref1] ten aanzien van het lidmaatschap van de raad van
      een gemeente waarvoor een verkiezing als bedoeld in [artikel 52][ref2] wordt gehouden, worden onder ingezetenen
      verstaan zij die werkelijke woonplaats hebben in het gebied dat met ingang van de datum van herindeling het
      grondgebied van de betrokken gemeente vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '56.2'
    text: |-
      Het onderzoek van de geloofsbrieven van de benoemde raadsleden geschiedt vóór een door gedeputeerde staten
      van de betrokken provincie te bepalen datum door de raad van de bij een wijziging van de gemeentelijke
      indeling betrokken gemeente die niet wordt opgeheven onderscheidenlijk van de gemeente die ingevolge
      [artikel 52, tweede volzin][ref1], met de voorbereiding van de tussentijdse raadsverkiezing is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '56.3'
    text: |-
      De eerste vergadering van de raad wordt gehouden op de eerste werkdag, volgende op de datum van herindeling. In
      deze vergadering worden de wethouders benoemd. In het geval, bedoeld in [artikel 53, tweede lid][ref1], wordt de
      eerste vergadering van de nieuw gekozen raad gehouden zo spoedig mogelijk nadat veertien dagen zijn verlopen na de
      onherroepelijke goedkeuring van de geloofsbrieven van meer dan de helft van de leden van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel53
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '53'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 56a
    text: |-
      Deze paragraaf is van toepassing op gemeenten waarvoor in de periode van 1 oktober tot en met 31 december van het
      jaar voorafgaande aan het jaar waarin de reguliere gemeenteraadsverkiezingen plaatsvinden een voorstel van wet tot
      wijziging van de gemeentelijke indeling is ingediend bij de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56a
  - number: 56b.1
    text: |-
      De verkiezing van de leden van de gemeenteraad in het jaar waarin de reguliere gemeenteraadsverkiezingen
      plaatsvinden en waarvoor de kandidaatstelling plaatsvindt op de dag, bedoeld in
      [artikel F 1, eerste lid, van de Kieswet][ref1], blijft achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 56b.2
    text: |-
      De zittingsduur van de leden van de raad wordt verlengd tot 1 januari van het jaar volgend op het jaar waarin de
      verkiezing, bedoeld in het eerste lid, achterwege blijft.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56b
  - number: 56c
    text: |-
      Indien de datum van herindeling volgt op het jaar waarin reguliere gemeenteraadsverkiezingen hebben plaatsgevonden,
      eindigt de zittingsduur van de leden van de ingevolge [artikel 52][ref1] gekozen raad tegelijk met de zittingsduur
      van de leden van de raden van de overige gemeenten die zitting hebben op de datum van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56c
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 56d.1
    text: |-
      Indien een voorstel van wet als bedoeld in [artikel 56a][ref1] niet uiterlijk op de donderdag in de periode van
      17 september tot en met 23 september in het jaar waarin de reguliere gemeenteraadsverkiezingen plaatsvinden tot wet
      is verheven en in werking is getreden, vindt de kandidaatstelling voor de verkiezing van de leden van de raad van
      een gemeente, genoemd in dat wetsvoorstel, plaats op de maandag in de periode van 5 tot en met 11 oktober van dat
      jaar. [Artikel 55, tweede lid, tweede en derde volzin][ref2], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel56a
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel55
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: 56a
        hoofdstuk: VII
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '55'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 56d.2
    text: |-
      In het geval, bedoeld in het eerste lid, gelden in afwijking van de
      [artikelen G 1 tot en met G 5 van de Kieswet][ref1] de volgende tijdstippen:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 56d.2.a
    text: |-
      de in de [artikelen G 1, achtste lid][ref1], en [G 2, achtste lid, van de Kieswet][ref2] bedoelde kennisgeving,
      voorafgaande aan de kandidaatstelling voor de verkiezing van de raad van een gemeente als bedoeld in
      [artikel 56a][ref3] vindt plaats op de veertiende dag voor die kandidaatstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel56a
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0004627
      - id: ref3
        bwb_id: BWBR0003718
        artikel: 56a
        hoofdstuk: VII
        paragraaf: '2'
  - number: 56d.2.b
    text: |-
      de in artikel [G 3, eerste lid, van de Kieswet][ref1] bedoelde verzoeken tot registratie van aanduidingen van
      politieke groeperingen van de raad van een gemeente als bedoeld in [artikel 56a][ref2] ingediend na de veertiende
      dag voor die kandidaatstelling blijven voor de daaropvolgende raadsverkiezing buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel56a
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0003718
        artikel: 56a
        hoofdstuk: VII
        paragraaf: '2'
  - number: 56d.2.c
    text: |-
      de in [artikel G 4, tweede lid, van de Kieswet][ref1] bedoelde beslissing, vindt uiterlijk plaats op de elfde dag
      voor die kandidaatstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 56d.2.d
    text: |-
      de in [artikel G 5, eerste lid, onderdelen b en c, van de Kieswet][ref1] bedoelde beschikkingen worden uiterlijk op
      de zevende dag voor de kandidaatstelling genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56d
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 56d.3
    text: |-
      De zittingsduur van de leden van de ingevolge het eerste lid gekozen raad eindigt tegelijk met de zittingsduur van
      de leden van de raden van de overige gemeenten die zitting hebben op 1 januari van het jaar volgend op het jaar
      waarin de reguliere gemeenteraadsverkiezing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56d
  - number: 56e.1
    text: |-
      Indien de datum van herindeling valt binnen drie jaar voor de datum van de reguliere gemeenteraadsverkiezingen
      blijven deze verkiezingen in de betrokken gemeenten achterwege.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56e
  - number: 56e.2
    text: |-
      De zittingsduur van de leden van de ingevolge [artikel 52][ref1] gekozen raad eindigt in de in het eerste lid
      bedoelde situatie tegelijk met de zittingsperiode van de leden van de raden van de overige gemeenten die volgt op
      de eerste reguliere gemeenteraadsverkiezingen na de datum van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel56e
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: '57.1'
    text: |-
      Bij de toepassing van [afdeling 8 van titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1] op de overgang van
      personeel als gevolg van wijzigingen van de gemeentelijke indeling geldt als verkrijger de gemeente die op grond
      van [artikel 44, eerste of tweede lid][ref2], de rechtsopvolger is van de op te heffen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel44
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '8'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '44'
        hoofdstuk: VI
  - number: '57.2'
    text: |-
      [Artikel 663, tweede zin, van Boek 7 van het Burgerlijk Wetboek][ref1] is op de overgang van personeel als gevolg
      van wijzigingen van de gemeentelijke indeling niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel663
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '663'
  - number: '57.3'
    text: |-
      Eden en beloften, die ambtenaren in verband met hun functie bij de op te heffen gemeente hebben afgelegd, worden
      geacht mede betrekking te hebben op de dienstbetrekking bij de gemeente waar zij met ingang van de datum van
      herindeling in dienst zijn.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel57
  - number: '58'
    text: |-
      In het geval van een grenscorrectie gaat op de datum van herindeling het personeel, verbonden
      aan de in overgaand gebied gevestigde door de gemeente in stand gehouden scholen als bedoeld in
      [artikel 1 van de Wet op het primair onderwijs][ref1], [artikel 1 van de Wet op de expertisecentra][ref2] of
      [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref3], over in dienst van de gemeente waaraan bedoeld gebied
      wordt toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0044212#Artikel1
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0044212
        artikel: '1'
  - number: '59.1'
    text: |-
      De aanwijzing van de secretaris van een gemeente die wordt opgeheven eindigt van rechtswege met ingang van de datum
      van herindeling.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel59
  - number: '59.2'
    text: |-
      [Afdeling 8 van titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1] is niet op de secretaris van toepassing.
      Indien hij in dienst is van de in het eerste lid bedoelde gemeente, eindigt de arbeidsovereenkomst van rechtswege
      op de dag voor de datum van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '8'
  - number: '59.3'
    text: |-
      In het geval, bedoeld in het tweede lid, wordt voor de toepassing van
      [artikel 673, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1] voor de onderdelen a en b van dat lid
      gelezen «de arbeidsovereenkomst op grond van [artikel 59, tweede lid][ref2], van de Wet algemene regels herindeling
      van rechtswege is geëindigd».


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel673
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel59
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '673'
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '59'
        hoofdstuk: VIII
  - number: '59.4'
    text: |-
      In afwijking van het eerste en tweede lid kunnen gedeputeerde staten [artikel 57][ref1] op verzoek van de
      secretaris op hem van overeenkomstige toepassing verklaren.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel57
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '57'
        hoofdstuk: VIII
  - number: '59.5'
    text: De voorgaande leden zijn van overeenkomstige toepassing op de griffier van een gemeente die wordt opgeheven.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel59
  - number: '60.1'
    text: |-
      Indien een nieuwe gemeente wordt ingesteld, wijzen gedeputeerde staten uiterlijk een maand voor de datum van
      herindeling een tijdelijke secretaris en een tijdelijke griffier aan. De aanwijzing gaat in met ingang van de datum
      van herindeling.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel60
  - number: '60.2'
    text: |-
      De aanwijzing van de tijdelijke secretaris en de tijdelijke griffier eindigt van rechtswege op de dag waarop
      overeenkomstig de [Gemeentewet][ref1] in de functies van secretaris en van griffier is voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005416
  - number: '60.3'
    text: |-
      [Artikel 36, eerste lid][ref1], is van overeenkomstige toepassing op de tijdelijke secretaris en de tijdelijke
      griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel36
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '36'
        hoofdstuk: V
  - number: '61.1'
    text: |-
      Het personeel, dat in dienst is van een gemeenschappelijke regeling met rechtspersoonlijkheid die ingevolge
      [artikel 41, eerste of tweede lid][ref1], vervalt, gaat met ingang van de datum van herindeling over in dienst van
      de gemeente die op grond van [artikel 44, eerste lid of tweede lid][ref2], de rechtsopvolger is van de op te heffen
      gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel44
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '41'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '44'
        hoofdstuk: VI
  - number: '61.2'
    text: |-
      Gedeputeerde staten van de betrokken provincie kunnen bepalen dat het personeel, dat in dienst is van een
      gemeenschappelijke regeling met rechtspersoonlijkheid die ingevolge [artikel 41, vierde of vijfde lid][ref1], wordt
      opgeheven, met ingang van de datum van herindeling overgaat in dienst van de bij de goedkeuring van de opheffing
      aan te wijzen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel41
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '41'
        hoofdstuk: V
  - number: '61.3'
    text: |-
      [Afdeling 8 van titel 10 van Boek 7 van het Burgerlijk Wetboek][ref1] is op de in het eerste en tweede lid bedoelde
      overgang van toepassing. Als verkrijger geldt de gemeente, waarnaar het personeel op grond van het eerste of tweede
      lid overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Afdeling8
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0005290
        afdeling: '8'
  - number: '61.4'
    text: |-
      Gedeputeerde staten van de betrokken provincie kunnen bepalen dat de uitkeringen of betalingen waarop gewezen
      personeel, dat in dienst is of was van een ingevolge [artikel 41, vierde of vijfde lid][ref1], op te heffen of
      opgeheven gemeenschappelijke regeling met rechtspersoonlijkheid op de dag voorafgaande aan de herindeling wegens
      beëindiging van het dienstverband of ziekte aanspraak maakte ten laste komen van de bij de goedkeuring van de
      opheffing van de gemeenschappelijke regeling aan te wijzen gemeente of gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel41
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '41'
        hoofdstuk: V
  - number: '67'
    text: |-
      Zij die op de dag, voorafgaande aan de datum van herindeling, ingeschreven zijn als leerling van een gemeentelijke
      school, gevestigd in een bij een wijziging van de gemeentelijke indeling betrokken gemeente, worden van genoemde
      datum af tot die school toegelaten op dezelfde voorwaarden als voordien golden.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel67
  - number: '68.1'
    text: |-
      Voor zover ten aanzien van de in overgaand gebied gevestigde basisscholen, speciale scholen voor basisonderwijs,
      scholen voor speciaal onderwijs, voortgezet speciaal onderwijs en scholen of instellingen voor speciaal en
      voortgezet speciaal onderwijs op de datum van herindeling voor enig op die datum verstreken kalenderjaar
      [artikel 144, eerste, zesde en zevende lid, van de Wet op het primair onderwijs][ref1] onderscheidenlijk
      [artikel 138, eerste, zesde en zevende lid, van de Wet op de expertisecentra][ref2] nog niet zijn toegepast,
      geschiedt dit door de colleges van burgemeester en wethouders van de gemeente waaraan dat gebied wordt toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel138
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '144'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '138'
  - number: '68.2'
    text: |-
      Bij de toepassing van [artikel 145, eerste lid, van de Wet op het primair onderwijs][ref1] onderscheidenlijk
      [artikel 139, eerste lid, van de Wet op de expertisecentra][ref2] is met betrekking tot enig vijfjarig tijdvak,
      eindigend vóór de datum van herindeling, het eerste lid van overeenkomstige toepassing. Voor het op de datum
      van herindeling lopende vijfjarige tijdvak wordt het overschrijdingsbedrag voor de periode tot het jaar waarin
      deze datum valt, voor de in overgaand gebied gevestigde bijzondere scholen of instellingen bepaald alsof geen
      herindeling heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel145
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel139
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '145'
      - id: ref2
        bwb_id: BWBR0003549
        artikel: '139'
  - number: '68.3'
    text: |-
      Indien in verband met de vorige leden een verrekening tussen gemeenten dient plaats te vinden, is
      [artikel 50][ref1] ter zake van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel50
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '50'
        hoofdstuk: VI
  - number: '69.1'
    text: |-
      Ter bepaling van de uitkering krachtens [artikel 5.28 van de Wet voortgezet onderwijs 2020][ref1] wordt voor de op
      de datum van herindeling lopende periode van vijf jaar, bedoeld in [artikel 5.26, eerste lid, van die wet][ref2]
      het overschrijdingsbedrag per leerling over enig op die datum verstreken of het lopende kalenderjaar berekend als
      had geen herindeling plaatsgevonden, en over de overige jaren van dat tijdvak naar de toestand na laatstbedoeld
      kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0044212#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0044212#Artikel5
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0044212
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0044212
        artikel: '5'
  - number: '69.2'
    text: |-
      [ Artikel 68, derde lid][ref1], is ter zake van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel68
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '68'
        hoofdstuk: IX
  - number: '70.1'
    text: |-
      Onverminderd het tweede lid en [artikel 71][ref1] gaan op de datum van herindeling de archiefbescheiden van
      een gemeente die wordt opgeheven, over naar de gemeente waaraan het gebied van de op te heffen gemeente wordt
      toegevoegd, dan wel, wanneer dat gebied aan meer dan één gemeente wordt toegevoegd, naar de in de betrokken
      herindelingsregeling aan te wijzen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel71
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '71'
        hoofdstuk: IX
  - number: '70.2'
    text: |-
      Eveneens onverminderd [artikel 71][ref1] gaan op de datum van herindeling alle gemeentelijke archiefbescheiden,
      uitsluitend betrekking hebbend op overgaand gebied, over naar de gemeente waaraan dat gebied wordt toegevoegd,
      met dien verstande dat de overbrenging, bedoeld in [artikel 12 van de Archiefwet 1995][ref2], ten aanzien van
      deze bescheiden geschiedt als had geen herindeling plaatsgevonden. Van de overgang wordt een verklaring opgemaakt
      volgens de krachtens [artikel 9 van genoemde wet][ref3] voor vervreemding van archiefbescheiden gestelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel9
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '71'
        hoofdstuk: IX
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0007376
        artikel: '9'
  - number: '70.3'
    text: |-
      De gemeenteraad en burgemeester en wethouders van de gemeente waaraan gebied is toegevoegd, hebben met ingang van
      de datum van herindeling het recht te allen tijde kosteloos inzage te nemen van de archiefbescheiden der gemeente
      waartoe dat gebied voor die datum behoorde, dan wel der gemeente waarnaar die archiefbescheiden krachtens het
      eerste lid zijn overgegaan, en op kosten van zijn gemeente afschriften van of uittreksels uit die archiefbescheiden
      te vorderen, voor zover deze mede betrekking hebben op het toegevoegde gebied.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel70
  - number: '70.4'
    text: |-
      Bij wijziging van een provinciegrens zijn het tweede en derde lid van overeenkomstige toepassing ten aanzien van de
      overgang van provinciale archiefbescheiden.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel70
  - number: '71.1'
    text: |-
      Met betrekking tot personen met een adres in overgaand gebied, wordt door burgemeester en wethouders van de
      gemeente waaraan het gebied wordt toegevoegd, het adres gewijzigd in de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel71
  - number: '71.2'
    text: Als datum van wijziging van de gemeentenaam geldt de datum van herindeling.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel71
  - number: 71a
    text: |-
      Het persoonsregister, waarvoor burgemeester en wethouders van een gemeente die wordt opgeheven zorg dragen ter
      uitvoering van de [Wet basisregistratie personen][ref1], wordt door burgemeester en wethouders van deze gemeente
      overgedragen aan het college van burgemeester en wethouders van de gemeente waaraan het gebied van de op te heffen
      gemeente wordt toegevoegd, dan wel, indien dat gebied aan meer dan één gemeente wordt toegevoegd, aan de in de
      betrokken herindelingsregeling aan te wijzen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: '72'
    text: |-
      Kosten van bijstand als bedoeld in de [artikelen 40][ref1] en [42 van de Wet werk en bijstand][ref2] en kosten van
      ondersteuning bij arbeidsinschakeling als bedoeld in [artikel 10 van die wet][ref3] ten behoeve van personen die op
      of voor de datum van herindeling woonachtig zijn of geweest zijn in overgaand gebied, komen met ingang van bedoelde
      datum ten laste van de gemeente waaraan dat gebied is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel10
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '42'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '10'
  - number: '73'
    text: |-
      Met betrekking tot zaken, de dienstplicht, met inbegrip van de mobilisatie-uitkeringen, alsmede de noodwachtplicht
      betreffende, vinden de voorschriften, door of namens Onze Minister van Defensie onderscheidenlijk bij koninklijk
      besluit dan wel door of namens Onze Minister gegeven ter zake van verhuizing, overeenkomstige toepassing ten
      aanzien van personen die krachtens een herindelingsregeling van een gemeente naar een andere gemeente overgaan.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel73
  - number: '74.1'
    text: |-
      Van de wegen onderscheidenlijk gedeelten van wegen, gelegen in aan een nieuwe gemeente toegevoegd gebied, wordt
      een nieuwe wegenlegger opgemaakt met inachtneming van de [artikelen 34 tot en met 38 van de Wegenwet][ref1], met
      dien verstande dat het ontwerp van de legger ook kan worden opgemaakt door gedeputeerde staten van de betrokken
      provincie. Zolang deze nieuwe legger niet is vastgesteld, blijven de bestaande wegenleggers van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel34
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '34'
  - number: '74.2'
    text: |-
      Voor zover het niet aan een nieuwe gemeente toegevoegd gebied betreft, voeren gedeputeerde staten de daarvoor
      in aanmerking komende wegen af van de wegenlegger der gemeente waartoe het betrokken gebied voor de datum van
      herindeling behoorde, en brengen zij die over naar de wegenlegger der gemeente waaraan dat gebied is toegevoegd,
      een en ander met toepassing, voor zoveel nodig, van de [artikelen 39 tot en met 42 van de Wegenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel39
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '39'
  - number: '74.3'
    text: |-
      In geval van een wijziging van de gemeentelijke indeling of een grenscorrectie levert de desbetreffende provincie
      binnen twee maanden na inwerkingtreding van de herindelingsregeling aan Onze Minister van Financiën de relevante
      basisgegevens, bedoeld in [artikel 29, eerste lid, van de Wet herverdeling wegenbeheer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel29
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005697
        artikel: '29'
  - number: '74.4'
    text: |-
      Indien een gemeente wordt opgeheven en als gevolg daarvan de uitkering, bedoeld in
      [artikel 32, tweede lid, van de Wet herverdeling wegenbeheer][ref1] niet meer kan verstrekken aan andere
      onderhoudsplichtigen, wordt in de herindelingsregeling een andere gemeente in dit verband als rechtsopvolger
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005697#Artikel32
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0005697
        artikel: '32'
  - number: '75'
    text: |-
      Een herindelingsregeling is niet van invloed op de bevoegdheid van de rechter of op die van partijen met betrekking
      tot zaken, op de dag, voorafgaande aan de datum van herindeling, voor enig gerecht aanhangig.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel75
  - number: '76'
    text: |-
      Een herindelingsregeling heeft geen beperking ten gevolge van het gebied waarbinnen vóór de datum van herindeling
      benoemde notarissen hun ambtsbediening uitoefenen.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel76
  - number: '79.1'
    text: |-
      De besturen van de vóór de datum van herindeling bij een wijziging van de gemeentelijke indeling betrokken
      gemeenten dragen er in onderling overleg zorg voor dat de met het oog op de gewijzigde indeling met ingang van
      die datum te treffen voorzieningen tijdig worden voorbereid. Voorzieningen, de voorbereiding van de overgang van
      ambtenaren betreffende, zijn onderwerp van georganiseerd overleg met de centrales van verenigingen van ambtenaren
      en van overleg met de ondernemingsraden van de betrokken gemeenten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel79
  - number: '79.2'
    text: |-
      Gedeputeerde staten bevorderen de totstandkoming van het in het eerste lid bedoelde onderling overleg tussen de
      gemeenten.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel79
  - number: '97'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel97
  - number: '98'
    text: 'Deze wet wordt aangehaald als: Wet algemene regels herindeling.'
    url: https://wetten.overheid.nl/BWBR0003718/2022-08-01#Artikel98
