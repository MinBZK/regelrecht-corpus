  - number: '11'
    text: |-
      Indien Onze Minister besluit op basis van een herindelingsadvies een voorstel voor een herindelingsregeling te
      doen, zendt hij het voorstel aan de ministerraad binnen vier maanden na ontvangst van het herindelingsadvies.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel11
  - number: '12'
    text: |-
      1 De voorbereiding van een herindelingsregeling door Onze Minister geschiedt met overeenkomstige toepassing van
      [artikel 8, eerste tot en met vierde lid][ref1], met dien verstande dat:

      a. Onze Minister in de plaats treedt van gedeputeerde staten;

      b. tevens gedeputeerde staten van de betrokken provincie of van de betrokken provincies in de gelegenheid worden
      gesteld tot het voeren van het overleg, bedoeld in [artikel 8, eerste lid][ref2]; en

      c. het herindelingsontwerp tevens aan gedeputeerde staten van de betrokken provincie wordt gezonden dan wel aan
      de provinciale staten van de betrokken provincies indien het betreft een grenscorrectie die gepaard gaat met een
      wijziging van een provinciegrens. Zij kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp
      hun zienswijze over het ontwerp kenbaar maken aan Onze Minister.

      2 Indien door gedeputeerde staten met betrekking tot gemeenten voorbereidingen zijn getroffen als bedoeld in de
      [artikelen 8][ref3] en [9][ref4] voor een herindelingsadvies of een herindelingsregeling en Onze Minister met
      toepassing van het eerste lid de voorbereiding van een herindelingsregeling ten aanzien van die gemeenten ter hand
      neemt, kunnen de door gedeputeerde staten getroffen voorbereidingen door Onze Minister worden aangemerkt als door
      hem getroffen voorbereidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel8
