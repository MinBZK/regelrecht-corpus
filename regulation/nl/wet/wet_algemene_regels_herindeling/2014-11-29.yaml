preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is algemene regelen te stellen die bij wijziging van de
    gemeentelijke indeling van toepassing zijn;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Binnenlandse Zaken;

      b. wijziging van de gemeentelijke indeling: instelling en opheffing van gemeenten alsmede wijziging van
      gemeentegrenzen die naar verwachting het inwonertal van tenminste één van de betrokken gemeenten met 10% of meer
      zal doen toe- of afnemen;

      c. wijziging van de provinciale indeling: instelling en opheffing van provincies alsmede wijziging van
      provinciegrenzen waardoor naar verwachting 10% of meer van het aantal inwoners van een gemeente deel gaat uitmaken
      van een andere provincie en wijziging van provinciegrenzen met niet provinciaal ingedeeld gebied;

      d. grenscorrectie: een wijziging van een gemeentegrens die naar verwachting het inwonertal van geen van de
      betrokken gemeenten met 10% of meer zal doen toe- of afnemen;

      e. herindelingsadvies: een met toepassing van deze wet voorbereid advies aan Onze Minister over wijziging van
      gemeentelijke en van provinciale grenzen;

      f. herindelingsregeling: een wet, een algemene maatregel van bestuur of een besluit als bedoeld in de
      [artikelen 3][ref1] en [13][ref2] tot wijziging van de gemeentelijke of de provinciale indeling of tot
      grenscorrectie alsmede een samenstel van gelijkluidende besluiten als bedoeld in [artikel 3][ref3] tot het
      vaststellen van een grenscorrectie;

      g. herindelingsontwerp: een ontwerp van een herindelingsadvies of van een herindelingsregeling;

      h. datum van herindeling: 1 januari volgend op de dag van inwerkingtreding van de herindelingsregeling;

      i. overgaand dan wel toegevoegd gebied: gebied dat krachtens een herindelingsregeling deel gaat uitmaken
      onderscheidenlijk deel is gaan uitmaken van een andere gemeente of provincie.

      2 Voor de toepassing van het eerste lid, onder b, c en d, wordt uitgegaan van het aantal inwoners van het
      desbetreffende grondgebied op het tijdstip dat:

      a. het herindelingsadvies dan wel de herindelingsregeling wordt vastgesteld, indien het betreft een
      herindelingsadvies dan wel herindelingsregeling waarvan de voorbereiding geschiedt door gemeenten of door een of
      meer provincies;

      b. het voorstel voor een herindelingsregeling aan de ministerraad wordt gezonden, indien het betreft een
      herindelingsregeling waarvan de voorbereiding geschiedt door de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel3
