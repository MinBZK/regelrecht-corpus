  - number: '61'
    text: |-
      1 Indien een nieuwe gemeente wordt ingesteld, benoemen gedeputeerde staten met ingang van de datum van herindeling
      een tijdelijke secretaris en een tijdelijke griffier.

      2 De benoemingen geschieden uiterlijk een maand voor de datum van herindeling en gelden tot de dag waarop
      overeenkomstig de [Gemeentewet][ref1] in de functies van secretaris en griffier is voorzien.

      3 [Artikel 36, eerste lid][ref2], is van overeenkomstige toepassing op de tijdelijke secretaris en de tijdelijke
      griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel36
