  - number: '97'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel97
  - number: '98'
    text: 'Deze wet kan worden aangehaald als: Wet algemene regels herindeling.'
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel98
