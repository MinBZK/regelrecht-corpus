  - number: '8'
    text: |-
      1 Gedeputeerde staten stellen burgemeester en wethouders van de betrokken gemeenten in de gelegenheid met hen
      overleg te voeren over de wens tot grenscorrectie of tot wijziging van de gemeentelijke indeling. Het overleg duurt
      ten hoogste zes maanden.

      2 Uiterlijk drie maanden na afloop van het overleg stellen gedeputeerde staten een herindelingsontwerp vast en
      zenden dit tezamen met een verslag van het gevoerde overleg aan de gemeenteraden en aan Onze Minister.

      3 Burgemeester en wethouders leggen het herindelingsontwerp binnen twee weken na ontvangst gedurende acht weken ter
      inzage op de gemeentesecretarie. De terinzagelegging wordt bekendgemaakt. Gedurende de termijn van terinzagelegging
      kan een ieder zijn zienswijze over het ontwerp kenbaar maken aan gedeputeerde staten.

      4 De gemeenteraden kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp hun zienswijze
      kenbaar maken aan gedeputeerde staten.

      5 De herindelingsregeling of het herindelingsadvies wordt vastgesteld uiterlijk vier maanden na afloop van de
      termijn, bedoeld in het vierde lid. Een vastgesteld herindelingsadvies wordt aan Onze Minister gezonden. Van de
      vaststelling van een herindelingsregeling wordt aan Onze Minister mededeling gedaan.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel8
  - number: '9'
    text: |-
      1 De voorbereiding van een herindelingsregeling tot een grenscorrectie die gepaard gaat met een wijziging
      van een provinciegrens als bedoeld in [artikel 3, derde lid, onder a][ref1], of van een daartoe strekkend
      herindelingsadvies als bedoeld in [artikel 4, derde lid][ref2], geschiedt met overeenkomstige toepassing van
      [artikel 8][ref3], met dien verstande dat:

      a. tevens gedeputeerde staten van de andere betrokken provincie of provincies in de gelegenheid worden gesteld tot
      het voeren van het overleg bedoeld in [artikel 8, eerste lid][ref4]; en

      b. het herindelingsontwerp tevens aan provinciale staten van de andere betrokken provincie of provincies wordt
      gezonden. Zij kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp hun zienswijze over het
      ontwerp kenbaar maken aan de gedeputeerde staten die het voorstel hebben gedaan.

      2 Het herindelingsontwerp wordt tevens toegezonden aan de betrokken waterschapsbesturen.


