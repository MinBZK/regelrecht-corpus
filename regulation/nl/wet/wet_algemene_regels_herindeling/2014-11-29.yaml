  - number: '67'
    text: |-
      Zij die op de dag, voorafgaande aan de datum van herindeling, ingeschreven zijn als leerling van een gemeentelijke
      school, gevestigd in een bij een wijziging van de gemeentelijke indeling betrokken gemeente, worden van genoemde
      datum af tot die school toegelaten op dezelfde voorwaarden als voordien golden.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel67
  - number: '68'
    text: |-
      1 Voor zover ten aanzien van de in overgaand gebied gevestigde basisscholen, speciale scholen voor basisonderwijs,
      scholen voor speciaal onderwijs, voortgezet speciaal onderwijs en scholen of instellingen voor speciaal en
      voortgezet speciaal onderwijs op de datum van herindeling voor enig op die datum verstreken kalenderjaar
      [artikel 144, eerste, zesde en zevende lid, van de Wet op het primair onderwijs][ref1] onderscheidenlijk
      [artikel 138, eerste, zesde en zevende lid, van de Wet op de expertisecentra][ref2] nog niet zijn toegepast,
      geschiedt dit door de colleges van burgemeester en wethouders van de gemeente waaraan dat gebied wordt toegevoegd.

      2 Bij de toepassing van [artikel 145, eerste lid, van de Wet op het primair onderwijs][ref3] onderscheidenlijk
      [artikel 139, eerste lid, van de Wet op de expertisecentra][ref4] is met betrekking tot enig vijfjarig tijdvak,
      eindigend vóór de datum van herindeling, het bepaalde in het eerste lid van overeenkomstige toepassing. Voor het
      op de datum van herindeling lopende vijfjarige tijdvak wordt het overschrijdingsbedrag voor de periode tot het jaar
      waarin deze datum valt, voor de in overgaand gebied gevestigde bijzondere scholen of instellingen bepaald alsof
      geen herindeling heeft plaatsgevonden.

      3 Indien in verband met het bepaalde in de vorige leden een verrekening tussen gemeenten dient plaats te vinden, is
      het bepaalde in [artikel 50][ref5] ter zake van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel144
      [ref2]: https://wetten.overheid.nl/BWBR0003549#Artikel138
      [ref3]: https://wetten.overheid.nl/BWBR0003420#Artikel145
      [ref4]: https://wetten.overheid.nl/BWBR0003549#Artikel139
      [ref5]: https://wetten.overheid.nl/BWBR0003718#Artikel50
