  - number: '69'
    text: |-
      1 Ter bepaling van de uitkering krachtens [artikel 89 van de Wet op het voortgezet onderwijs][ref1] wordt voor
      het op de datum van herindeling lopende vijfjarige tijdvak als bedoeld in artikel 88, tweede lid, van die wet
      het overschrijdingsbedrag per leerling over enig op die datum verstreken of het lopende kalenderjaar berekend als
      had geen herindeling plaatsgevonden, en over de overige jaren van dat tijdvak naar de toestand na laatstbedoeld
      kalenderjaar.

      2 Het bepaalde in [artikel 68, derde lid][ref2], is ter zake van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel89
