  - number: '19'
    text: |-
      1 De voorbereiding van een herindelingsregeling door Onze Minister geschiedt met overeenkomstige toepassing van
      [artikel 8, eerste tot en met vierde lid][ref1], met dien verstande dat:

      a. Onze Minister in de plaats treedt van gedeputeerde staten;

      b. tevens gedeputeerde staten van de betrokken provincie of provincies in de gelegenheid worden gesteld tot het
      voeren van het overleg, bedoeld in [artikel 8, eerste lid][ref2]; en

      c. het herindelingsontwerp tevens aan provinciale staten van de betrokken provincie of provincies wordt gezonden.
      Deze kunnen tot uiterlijk drie maanden na ontvangst van het herindelingsontwerp hun zienswijze over het ontwerp
      kenbaar maken aan Onze Minister.

      2 [Artikel 10][ref3] is van overeenkomstige toepassing.

      3 Indien door gedeputeerde staten of een commissie als bedoeld in [artikel 15, eerste lid][ref4], met
      betrekking tot een wijziging van de provinciegrenzen voorbereidingen zijn getroffen als bedoeld in de
      [artikelen 15 tot en met 17][ref5] voor een herindelingsadvies of een herindelingsregeling en Onze Minister met
      toepassing van het eerste lid de voorbereiding van een herindelingsregeling ten aanzien van die provinciegrenzen
      ter hand neemt, kunnen de door gedeputeerde staten of de commissie getroffen voorbereidingen door Onze Minister
      worden aangemerkt als door hem getroffen voorbereidingen.


