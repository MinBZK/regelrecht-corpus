  - number: '13'
    text: |-
      1 Een wijziging van de provinciale indeling geschiedt bij wet.

      2 Een wijziging van de provinciale indeling die betreft een wijziging van provinciegrenzen met niet provinciaal
      ingedeeld gebied kan geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel13
  - number: '14'
    text: |-
      1 Een herindelingsadvies met betrekking tot een wijziging van de provinciale indeling wordt vastgesteld door de
      provinciale staten van de betrokken provincies gezamenlijk.

      2 Indien de besturen van de betrokken provincies van oordeel verschillen over de wenselijkheid van een wijziging
      van de provinciale indeling kunnen provinciale staten van één provincie een herindelingsadvies vaststellen.

      3 Een herindelingsadvies met betrekking tot een wijziging van de provinciale indeling die één provincie betreft en
      geschiedt zonder wijziging van grenzen van een andere provincie, wordt vastgesteld door provinciale staten.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel14
  - number: '15'
    text: |-
      1 Ten behoeve van de voorbereiding van een herindelingsadvies met betrekking tot een wijziging van de provinciale
      indeling als bedoeld in [artikel 14, eerste lid][ref1], stellen provinciale staten van de betrokken provincies een
      commissie in die is samengesteld uit leden van gedeputeerde staten van de betrokken provincies.

      2 De voorbereiding van het herindelingsadvies geschiedt met overeenkomstige toepassing van [artikel 8][ref2], met
      dien verstande dat de commissie in de plaats treedt van gedeputeerde staten.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel8
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel15
