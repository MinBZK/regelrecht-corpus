  - number: 56a
    text: |-
      Deze paragraaf is van toepassing op gemeenten waarvoor in de periode van 1 oktober tot en met 31 december van het
      jaar voorafgaande aan het jaar waarin de reguliere gemeenteraadsverkiezingen plaatsvinden een voorstel van wet tot
      wijziging van de gemeentelijke indeling is ingediend bij de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel56a
  - number: 56b
    text: |-
      1 De verkiezing van de leden van de gemeenteraad in het jaar waarin de reguliere
      gemeenteraadsverkiezingen plaatsvinden en waarvoor de kandidaatstelling plaatsvindt op de dag, bedoeld in
      [artikel F 1, eerste lid, van de Kieswet][ref1], blijft achterwege.

      2 De zittingsduur van de leden van de raad wordt verlengd tot 1 januari van het jaar volgend op het jaar waarin de
      verkiezing, bedoeld in het eerste lid, achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelF_1
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel56b
    references:
      - id: ref1
        bwb_id: BWBR0004627
        artikel: F_1
  - number: 56c
    text: |-
      Indien de datum van herindeling volgt op het jaar waarin reguliere gemeenteraadsverkiezingen hebben plaatsgevonden,
      eindigt de zittingsduur van de leden van de ingevolge [artikel 52][ref1] gekozen raad tegelijk met de zittingsduur
      van de leden van de raden van de overige gemeenten die zitting hebben op de datum van herindeling.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel56c
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '52'
        hoofdstuk: VII
        paragraaf: '1'
  - number: 56d
    text: |-
      1 Indien een voorstel van wet als bedoeld in [artikel 56a][ref1] niet uiterlijk op de donderdag in de periode van
      17 september tot en met 23 september in het jaar waarin de reguliere gemeenteraadsverkiezingen plaatsvinden tot wet
      is verheven en in werking is getreden, vindt de kandidaatstelling voor de verkiezing van de leden van de raad van
      een gemeente, genoemd in dat wetsvoorstel, plaats op de maandag in de periode van 5 tot en met 11 oktober van dat
      jaar. [Artikel 55, tweede lid, tweede en derde volzin][ref2], is van toepassing.

      2 In het geval, bedoeld in het eerste lid, gelden in afwijking van de
      [artikelen G 1 tot en met G 5 van de Kieswet][ref3] de volgende tijdstippen:

      a. de in de [artikelen G 1, achtste lid][ref4], en [G 2, achtste lid, van de Kieswet][ref5] bedoelde
      kennisgeving, voorafgaande aan de kandidaatstelling voor de verkiezing van de raad van een gemeente als bedoeld in
      [artikel 56a][ref6] vindt plaats op de veertiende dag voor die kandidaatstelling.

      b. de in artikel [G 3, eerste lid, van de Kieswet][ref7] bedoelde verzoeken tot registratie van aanduidingen van
      politieke groeperingen van de raad van een gemeente als bedoeld in [artikel 56a][ref8] ingediend na de veertiende
      dag voor die kandidaatstelling blijven voor de daaropvolgende raadsverkiezing buiten beschouwing.

      c. de in [artikel G 4, tweede lid, van de Kieswet][ref9] bedoelde beslissing, vindt uiterlijk plaats op de elfde
      dag voor die kandidaatstelling.

      d. de in [artikel G 5, eerste lid, onderdelen b en c, van de Kieswet][ref10] bedoelde beschikkingen worden
      uiterlijk op de zevende dag voor de kandidaatstelling genomen.

      3 De zittingsduur van de leden van de ingevolge het eerste lid gekozen raad eindigt tegelijk met de zittingsduur
      van de leden van de raden van de overige gemeenten die zitting hebben op 1 januari van het jaar volgend op het jaar
      waarin de reguliere gemeenteraadsverkiezing heeft plaatsgevonden.


