  - number: '73'
    text: |-
      Met betrekking tot zaken, de dienstplicht, met inbegrip van de mobilisatie-uitkeringen, alsmede de noodwachtplicht
      betreffende, vinden de voorschriften, door of namens Onze Minister van Defensie onderscheidenlijk bij koninklijk
      besluit dan wel door of namens Onze Minister gegeven ter zake van verhuizing, overeenkomstige toepassing ten
      aanzien van personen die krachtens een herindelingsregeling van een gemeente naar een andere gemeente overgaan.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel73
  - number: '74'
    text: |-
      1 Van de wegen onderscheidenlijk gedeelten van wegen, gelegen in aan een nieuwe gemeente toegevoegd gebied,
      wordt een nieuwe wegenlegger opgemaakt met inachtneming van de [artikelen 34-38 van de Wegenwet][ref1], met
      dien verstande dat het ontwerp van de legger ook kan worden opgemaakt door gedeputeerde staten van de betrokken
      provincie. Zolang deze nieuwe legger niet is vastgesteld, blijven de bestaande wegenleggers van kracht.

      2 Voor zover het niet aan een nieuwe gemeente toegevoegd gebied betreft, voeren gedeputeerde staten de daarvoor
      in aanmerking komende wegen af van de wegenlegger der gemeente waartoe het betrokken gebied voor de datum van
      herindeling behoorde, en brengen zij die over naar de wegenlegger der gemeente waaraan dat gebied is toegevoegd,
      een en ander met toepassing, voor zoveel nodig, van de [artikelen 39-42 van de Wegenwet][ref2].

      3 In geval van een wijziging van de gemeentelijke indeling of een grenscorrectie levert de desbetreffende provincie
      binnen twee maanden na inwerkingtreding van de herindelingsregeling aan de Minister van Financiën de relevante
      basisgegevens, bedoeld in [artikel 29, eerste lid, van de Wet herverdeling wegenbeheer][ref3].

      4 Indien een gemeente wordt opgeheven en als gevolg daarvan de uitkering, bedoeld in
      [artikel 32, tweede lid, van de Wet herverdeling wegenbeheer][ref4] niet meer kan verstrekken aan andere
      onderhoudsplichtigen, wordt in de herindelingsregeling een andere gemeente in dit verband als rechtsopvolger
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0001948#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0005697#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0005697#Artikel32
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel74
    references:
      - id: ref1
