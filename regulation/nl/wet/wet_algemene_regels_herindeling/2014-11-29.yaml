  - number: '45'
    text: |-
      1 Met betrekking tot de voorziening van drinkwater, elektriciteit en gas blijft toegevoegd gebied deel uitmaken
      van het voorzieningsgebied van de bedrijven die daarin voorzagen of gerechtigd waren te voorzien op de dag,
      voorafgaande aan de datum van herindeling, voor zover de betrokken partijen ter zake geen nadere regeling treffen.

      2 Bij opheffing van een gemeente treedt ten aanzien van de rechten en verplichtingen die verband houden met de in
      het eerste lid bedoelde voorzieningen de in de betrokken herindelingswet aan te wijzen gemeente voor die gemeente
      in de plaats, zonder dat daarvoor een nadere akte wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel45
  - number: '46'
    text: |-
      Bij wijziging van een provinciegrens is het bepaalde in de [artikelen 44][ref1] en [45][ref2] van overeenkomstige
      toepassing ten aanzien van rechten en verplichtingen van een provincie.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel45
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel46
