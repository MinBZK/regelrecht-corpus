  - number: '63'
    text: |-
      1 De ambtenaar in tijdelijke dienst wiens dienstverband minder dan vijf jaren geeft geduurd dan wel van
      kennelijk tijdelijke aard was, alsmede de werknemer in dienst op arbeidsovereenkomst naar burgerlijk recht,
      die ten gevolge van het bepaalde in [artikel 59][ref1] wordt ontslagen onderscheidenlijk wiens dienstverband
      dientengevolge wordt beëindigd, heeft recht op uitkering, met dien verstande dat met betrekking tot dit recht het
      in het [eerste lid van artikel 62 onder b][ref2] bepaalde van overeenkomstige toepassing is en dat de uitkering
      wordt toegekend overeenkomstig de voorschriften die de gemeente, ten laste waarvan de uitkering komt, ingevolge
      [artikel 125 van de Ambtenarenwet 1929][ref3] ter zake van bedoelde uitkeringen heeft vastgesteld.

      2 In afwijking van het bepaalde in de [tweede volzin van het achtste lid van artikel 59][ref4] komt het recht
      op uitkering van de ambtenaar, bedoeld in het eerste lid van dat artikel, aan wie eervol ontslag is verleend
      en voor wie de ingangsdatum van het ontslag met gebruikmaking van de in het achtste lid van genoemd artikel
      opgenomen mogelijkheid is opgeschort, ten laste van de gemeente, waarvan het bevoegd gezag op grond van het
      [derde lid van artikel 59][ref5] het ontslag heeft verleend. De uitkering wordt toegekend overeenkomstig de
      voorschriften, die deze gemeente ingevolge [artikel 125 van de Ambtenarenwet 1929][ref6] ter zake van uitkering
      heeft vastgesteld.

      3 Het bepaalde in het [vierde lid van artikel 62][ref7] is voor de ambtenaar, bedoeld in het eerste lid, van
      overeenkomstige toepassing.

      4 Het bepaalde in het [vijfde lid van artikel 62][ref8] is voor de ambtenaar, bedoeld in het tweede lid, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel59
