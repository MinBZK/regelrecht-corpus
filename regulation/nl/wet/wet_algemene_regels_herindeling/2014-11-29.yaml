        bwb_id: BWBR0003718
        artikel: '45'
        hoofdstuk: VI
  - number: '47'
    text: |-
      1 Ten behoeve van de voortzetting van het comptabel beheer in verband met de overgang van gebied kunnen
      gedeputeerde staten, de colleges van burgemeester en wethouders van de betrokken gemeenten gehoord, aanwijzingen
      geven, welke door die colleges in acht moeten worden genomen.

      2 Voor het tijdvak waarin voor een nieuwe gemeente nog geen begroting is vastgesteld, zijn burgemeester en
      wethouders bevoegd tot het doen van uitgaven, voor zover daartegen bij gedeputeerde staten geen bezwaar bestaat.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel47
  - number: '48'
    text: |-
      1 Behoudens het bepaalde in het tweede lid worden de uitkeringen die door onderscheidenlijk aan het Rijk,
      de provincie of gemeenten over de vóór de datum van herindeling aangevangen boekingstijdvakken, dienstjaren
      of uitkeringsjaren met betrekking tot overgaand gebied van een gemeente verschuldigd zijn, gedaan aan
      onderscheidenlijk door de gemeente waartoe dat gebied vóór die datum behoorde.

      2 Wanneer het een op te heffen gemeente betreft, geschieden de in het eerste lid bedoelde uitkeringen aan
      onderscheidenlijk door de gemeente waaraan het gebied van de op te heffen gemeente wordt toegevoegd of zo dit
      gebied naar meer dan één gemeente overgaat, de in de betrokken herindelingswet aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel48
  - number: '49'
    text: |-
      Bij wijziging van een provinciegrens is het bepaalde in [artikel 48][ref1] van overeenkomstige toepassing ten
      aanzien van door onderscheidenlijk aan het Rijk of gemeenten met betrekking tot overgaand gebied van een provincie
      verschuldigde uitkeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel48
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '48'
        hoofdstuk: VI
  - number: '50'
    text: |-
      1 Indien in verband met het bepaalde in de [artikelen 39][ref1], [41][ref2], [44][ref3], [45][ref4] en [48][ref5]
      een verrekening tussen gemeenten dient plaats te vinden worden, de besturen van die gemeenten gehoord, het bedrag
      en, zo nodig, de wijze van betaling vastgesteld:

      a. door gedeputeerde staten van de betrokken provincie indien de desbetreffende wijziging van de gemeentelijke
      indeling dan wel grenscorrectie niet gepaard gaat met wijziging van de provinciegrens;

      b. door de colleges van gedeputeerde staten van de betrokken provincies in onderling overleg indien de
      desbetreffende wijziging van de gemeentelijke indeling dan wel grenscorrectie gepaard gaat met wijziging van de
      provinciegrens;

      c. bij koninklijk besluit, de besturen van de betrokken provincies gehoord, bij gebreke van overeenstemming tussen
      de colleges, bedoeld onder *b*.

      2 Bij het vaststellen van het bedrag van de verrekening, bedoeld in het eerste lid, kunnen reserves en
      voorzieningen worden betrokken.

      3 Op een verzoek om verrekening als bedoeld in het eerste lid beslissen gedeputeerde staten niet afwijzend dan na
      de besturen van de in dat lid bedoelde gemeenten te hebben gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel41
