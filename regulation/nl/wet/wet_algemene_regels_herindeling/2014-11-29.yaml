  - number: '75'
    text: |-
      Een herindelingsregeling is niet van invloed op de bevoegdheid van de rechter of op die van partijen met betrekking
      tot zaken, op de dag, voorafgaande aan de datum van herindeling, voor enig gerecht aanhangig.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel75
  - number: '76'
    text: |-
      Een herindelingsregeling heeft geen beperking ten gevolge van het gebied waarbinnen vóór de datum van herindeling
      benoemde notarissen hun ambtsbediening uitoefenen.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel76
  - number: '79'
    text: |-
      1 De besturen van de vóór de datum van herindeling bij een wijziging van de gemeentelijke indeling betrokken
      gemeenten dragen er in onderling overleg zorg voor dat de met het oog op de gewijzigde indeling met ingang van
      die datum te treffen voorzieningen tijdig worden voorbereid. Voorzieningen, de voorbereiding van de overgang van
      ambtenaren betreffende, zijn onderwerp van georganiseerd overleg met de centrales van verenigingen van ambtenaren
      en van overleg met de ondernemingsraden van de betrokken gemeenten.

      2 Gedeputeerde staten bevorderen de totstandkoming van het in het eerste lid bedoelde onderling overleg tussen
      de gemeenten.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel79
  - number: '96'
    text: |-
      1 Indien het voorstel van wet, houdende nieuwe bepalingen met betrekking tot gemeenten
      ([Gemeentewet][ref1], Kamerstuk 19 403) tot wet wordt verheven en in werking treedt, vervalt
      [hoofdstuk XI van de Wet algemene regels herindeling][ref2]. Onze Minister past in verband daarmee de aanhalingen
      van artikelen in die wet aan.

      2 Indien het voorstel van wet, houdende nieuwe bepalingen met betrekking tot provincies
      ([Provinciewet][ref3], Kamerstuk 19 836) tot wet wordt verheven en in werking treedt, vervalt
      [hoofdstuk XII van de Wet algemene regels herindeling][ref4]. Onze Minister past in verband daarmee de aanhaling
      van artikelen in die wet aan.


      [ref1]: https://wetten.overheid.nl/BWBR0005416
      [ref2]: https://wetten.overheid.nl/BWBR0003718#HoofdstukXI
      [ref3]: https://wetten.overheid.nl/BWBR0005645
      [ref4]: https://wetten.overheid.nl/BWBR0003718#HoofdstukXII
