  - number: '62'
    text: |-
      1 De ambtenaar in vaste of in tijdelijke dienst, mits dit laatste dienstverband ten minste vijf jaren heeft
      geduurd en de aanstelling niet is geschied in een betrekking van kennelijk tijdelijke aard, die ten gevolge van het
      bepaalde in [artikel 57][ref1] dan wel [artikel 59][ref2] is of wordt ontslagen, heeft recht op wachtgeld, met dien
      verstande dat:

      a. het recht op wachtgeld van de ambtenaar, bedoeld in het [eerste lid van artikel 57][ref3], onverminderd het
      onder *b* bepaalde, ten laste komt van de gemeente, waarnaar krachtens het [eerste lid van artikel 44][ref4] alle
      rechten en verplichtingen van de gemeente, in dienst waarvan de betrokkene tot de datum van herindeling werkzaam
      was, overgaan en dat het wachtgeld wordt toegekend overeenkomstig de voorschriften, die de eerstgenoemde gemeente
      ingevolge [artikel 125 van de Ambtenarenwet 1929][ref5] ter zake van wachtgeld heeft vastgesteld. Tot aan de
      inwerkingtreding van de in de vorige volzin bedoelde voorschriften is het in het [tweede lid van artikel 60][ref6]
      bepaalde van overeenkomstige toepassing.

      b. het recht op wachtgeld van de ambtenaar, bedoeld in [artikel 59][ref7], en de ambtenaar, bedoeld in het
      [eerste lid van artikel 57][ref8], ten aanzien van wie gedeputeerde staten gebruik hebben gemaakt van de in het
      tweede lid van dat artikel geboden bevoegdheid, ten laste komt van de gemeente, in dienst waarvan de betrokkene
      met ingang van de datum van herindeling voorlopig is overgegaan en dat het wachtgeld wordt toegekend overeenkomstig
      de voorschriften, die deze gemeente ingevolge [artikel 125 van de Ambtenarenwet 1929][ref9] ter zake van wachtgeld
      heeft vastgesteld.

      2 De ambtenaar die is benoemd in een tijdelijke functie als bedoeld in [artikel 61][ref10] en die tot de datum van
      herindeling in dienst was van een bij de betrokken herindelingswet op te heffen gemeente, heeft met ingang van de
      dag nadat zijn benoeming in die tijdelijke functie is vervallen, recht op wachtgeld, met dien verstande dat het
      recht op wachtgeld ten laste komt van de gemeente, waarnaar krachtens het [eerste lid van artikel 44][ref11] alle
      rechten en verplichtingen van de betrokken op te heffen gemeente overgaan en dat het wachtgeld wordt toegekend
      overeenkomstig de voorschriften, die de gemeente, waarnaar krachtens [het eerste lid van artikel 44][ref12]
      alle rechten en verplichtingen van de betrokken op te heffen gemeente overgaan, ingevolge
      [artikel 125 van de Ambtenarenwet][ref13] 1929 ter zake van wachtgeld heeft vastgesteld. Tot aan de
      inwerkingtreding van de in de vorige volzin bedoelde voorschriften is het in het [tweede lid van artikel 60][ref14]
      bepaalde van overeenkomstige toepassing.

      3 In afwijking van het bepaalde in de [tweede volzin van het achtste lid van artikel 59][ref15] komt het recht
      op wachtgeld van de ambtenaar, bedoeld in het eerste lid van dat artikel, aan wie eervol ontslag is verleend
      en voor wie de ingangsdatum van het ontslag met gebruikmaking van de in het achtste lid van genoemd artikel
      opgenomen mogelijkheid is opgeschort, ten laste van de gemeente, waarvan het bevoegd gezag op grond van het
      [derde lid van artikel 59][ref16] het ontslag heeft verleend. Het wachtgeld wordt toegekend overeenkomstig de
      voorschriften, die deze gemeente ingevolge [artikel 125 van de Ambtenarenwet 1929][ref17] ter zake van wachtgeld
      heeft vastgesteld.

      4 Indien een ambtenaar, bedoeld in het eerste lid, uit hoofde van ziekte aanspraak heeft of krijgt op doorbetaling
      van zijn laatstgenoten bezoldiging, komt deze bezoldiging voor de duur van de ziekte ten laste van de gemeente, ten
      laste waarvan op grond van het in het eerste lid bepaalde het recht op wachtgeld komt.

      5 Indien de ambtenaar, bedoeld in het tweede en het derde lid, uit hoofde van ziekte aanspraak heeft of krijgt op
      doorbetaling van zijn laatstgenoten bezoldiging, komt deze bezoldiging voor de duur van de ziekte voorzover het de
      periode na beëindiging van de tijdelijke functie betreft, ten laste van de gemeente, waarvan op grond van het in
      het tweede onderscheidenlijk derde lid bepaalde het recht op wachtgeld komt.


