  - number: '66'
    text: |-
      1 De bepalingen van dit hoofdstuk zijn van overeenkomstige toepassing op het personeel, betrokken bij een
      gemeenschappelijke regeling die ingevolge het bepaalde in [artikel 41, eerste of tweede lid][ref1], vervalt, met
      dien verstande dat dit personeel voorlopig overgaat in dienst van de in de tweede volzin van het eerste lid van dat
      artikel bedoelde gemeente.

      2 Gedeputeerde staten van de betrokken provincie kunnen de bepalingen van dit hoofdstuk van overeenkomstige
      toepassing verklaren op het personeel, betrokken bij een gemeenschappelijke regeling die ten gevolge van het
      bepaalde in [artikel 41, vierde of vijfde lid][ref2], wordt opgeheven, met dien verstande dat:

      a. bedoeld personeel voorlopig overgaat in dienst van de bij de goedkeuring van de opheffing aan te wijzen gemeente
      of gemeenten;

      b. de termijn van zes maanden als bedoeld in [artikel 59, derde lid][ref3], aanvangt op de dag nadat de opheffing
      van de regeling is goedgekeurd;

      c. het recht op wachtgeld of uitkering, bedoeld in de [artikelen 62][ref4] en [63][ref5], ten laste komt van de
      gemeente of gemeenten, bedoeld in onderdeel *a*.

      3 Gedeputeerde staten van de betrokken provincie kunnen het bepaalde in de [artikelen 62][ref6],
      [63][ref7] en [65][ref8] van overeenkomstige toepassing verklaren op het personeel, betrokken bij een
      gemeenschappelijke regeling, waarvan het dienstverband als gevolg van de toepassing van het bepaalde in
      [artikel 41, vierde of vijfde lid][ref9], redelijkerwijs niet kan worden gehandhaafd, met dien verstande dat het
      recht op wachtgeld of uitkering, bedoeld in [artikel 62][ref10] onderscheidenlijk [63][ref11], en het aandeel,
      bedoeld in [artikel 65][ref12], ten laste komt van de bij de goedkeuring van de wijziging van de gemeenschappelijke
      regeling aan te wijzen gemeente of gemeenten. Het wachtgeld of de uitkering wordt toegekend overeenkomstig de
      voorschriften ter zake, zoals die voor de betrokken ambtenaar op de dag voor zijn ontslag van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel41
