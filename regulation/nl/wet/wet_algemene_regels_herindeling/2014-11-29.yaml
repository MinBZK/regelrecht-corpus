  - number: '55'
    text: |-
      1 De raad van een gemeente waarvoor een verkiezing als bedoeld in [artikel 52][ref1] wordt gehouden, zal bestaan
      uit het door gedeputeerde staten van de betrokken provincie met toepassing van [artikel 8 van de Gemeentewet][ref2]
      te bepalen aantal leden. Daartoe wordt het inwonertal van een gemeente bepaald aan de hand van de door het Centraal
      Bureau voor de Statistiek bekend gemaakte gegevens betreffende de bevolkingscijfers per 1 januari van het jaar
      waarin de verkiezing plaatsvindt.

      2 De kandidaatstelling vindt plaats op de maandag in de periode van 5 tot en met 11 oktober voorafgaand aan de
      datum van herindeling. De stemming vindt plaats op de vierenveertigste dag na de kandidaatstelling.

      Gedeputeerde staten kunnen, indien zwaarwegende redenen verband houdend met de dag van kandidaatstelling of met
      de dag van stemming daartoe nopen, bepalen dat de kandidaatstelling op een andere datum plaatsvindt, met dien
      verstande dat de stemming voor de datum van herindeling plaatsvindt.

      3 Gedeputeerde staten kunnen besluiten tot afwijking van de in de [artikelen G 1, achtste lid][ref3],
      [G 2, achtste lid][ref4], [G 3, eerste lid][ref5], [G 4, derde lid][ref6], en
      [G 5, eerste lid, onder b en c, van de Kieswet][ref7] bedoelde termijnen inzake registratie van aanduidingen van
      politieke groeperingen.

      4 Indien het een nieuwe gemeente betreft worden bij de nummering van de kandidatenlijsten in afwijking van
      [artikel I 14, eerste lid, eerste volzin, van de Kieswet][ref8] eerst genummerd de lijsten van politieke
      groeperingen wier aanduiding was geplaatst boven een kandidatenlijst waaraan bij de laatstgehouden verkiezing van
      de raad van de gemeente die met de voorbereiding van de verkiezing is belast, een of meer zetels zijn toegekend.

      5 Als kiesgerechtigden worden geacht te zijn geregistreerd degenen die als zodanig zijn geregistreerd in de bij een
      wijziging van de gemeentelijke indeling betrokken gemeente die niet wordt opgeheven onderscheidenlijk de gemeente
      die ingevolge [artikel 52, tweede volzin][ref9], met de voorbereiding van de tussentijdse raadsverkiezing is
      belast, nadat daaraan zijn toegevoegd de personen die voorkomen op de ingevolge [artikel 54, eerste lid][ref10],
      ontvangen opgaven zoals deze luiden na toepassing van het tweede lid van dat artikel, en daarvan zijn afgevoerd de
      personen die op de dag van kandidaatstelling als bedoeld in het tweede lid werkelijke woonplaats hebben in het deel
      der gemeente dat op de datum van herindeling naar een andere gemeente overgaat.

      6 Het benoemen van de leden en de plaatsvervangende leden van de hoofdstembureaus en het benoemen van de leden en
      de plaatsvervangende leden van de stembureaus geschieden voor een door gedeputeerde staten te bepalen datum door
      burgemeester en wethouders van de bij een wijziging van de gemeentelijke indeling betrokken gemeente die niet wordt
      opgeheven onderscheidenlijk de gemeente die ingevolge [artikel 52, tweede volzin][ref11], met de voorbereiding
      van de tussentijdse raadsverkiezing is belast. De benoeming van de leden en de plaatsvervangende leden van de
      hoofdstembureaus geschiedt, in afwijking van het bepaalde in [artikel E8 van de Kieswet](onbekend), voor een
      periode die eindigt op hetzelfde tijdstip als de eerste zittingsperiode van de nieuw gekozen raden der gemeenten.

      7 Voor zover ingevolge enig wettelijk voorschrift medewerking moet worden verleend door de raad, door
      burgemeester en wethouders of door de burgemeester, geschiedt dit door de raad, burgemeester en wethouders of de
      burgemeester van de bij een wijziging van de gemeentelijke indeling betrokken gemeente die niet wordt opgeheven
      onderscheidenlijk de gemeente die ingevolge [artikel 52, tweede volzin][ref12], met de voorbereiding van de
      tussentijdse raadsverkiezing is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel52
