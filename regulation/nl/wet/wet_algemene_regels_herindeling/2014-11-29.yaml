        artikel: '32'
        hoofdstuk: V
  - number: '34'
    text: |-
      1 In afwijking van het bepaalde in [artikel 28][ref1] worden de vóór de datum van herindeling vastgestelde
      structuurvisies, bestemmingsplannen, beheersverordeningen en exploitatieplannen als bedoeld in respectievelijk
      [artikel 2.1][ref2], [3.1][ref3], [3.38][ref4] en [6.12 van de Wet ruimtelijke ordening][ref5] en
      besluiten waarbij gronden worden aangewezen tot gebied waarop een voorkeursrecht rust als bedoeld in
      [artikel 2, eerste lid, van de Wet voorkeursrecht gemeenten][ref6], met betrekking tot overgaand gebied geacht
      te zijn vastgesteld door het bevoegde gezag van de gemeente waaraan dat gebied is toegevoegd en behouden zij hun
      rechtskracht zolang het bevoegde gezag niet anders bepaalt.

      2 Evenzo wordt een vóór de datum van herindeling genomen voorbereidingsbesluit als bedoeld in
      [artikel 3.7 van de Wet ruimtelijke ordening][ref7] met betrekking tot overgaand gebied geacht te zijn genomen door
      de raad van de gemeente waaraan dat gebied is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
