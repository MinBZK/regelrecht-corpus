  - number: '58'
    text: |-
      Op de datum van herindeling gaat het personeel, verbonden aan de in overgaand gebied gevestigde gemeentelijke
      basisscholen, gemeentelijke speciale scholen voor basisonderwijs, gemeentelijke scholen voor speciaal onderwijs,
      voortgezet speciaal onderwijs, gemeentelijke scholen of instellingen voor speciaal en voortgezet speciaal
      onderwijs, dan wel gemeentelijke scholen voor voortgezet onderwijs, over in dienst van de gemeente waaraan bedoeld
      gebied wordt toegevoegd, op dezelfde voet als waarop en ook overigens in dezelfde rechtstoestand als waarin het op
      de dag, voorafgaande aan die datum, werkzaam was.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel58
  - number: '59'
    text: |-
      1 De overige ambtenaren, in dienst van een op te heffen gemeente, gaan op de datum van herindeling voorlopig
      over in dienst van de gemeente waaraan het gebied van de op te heffen gemeente wordt toegevoegd, dan wel, wanneer
      dat gebied aan meer dan één gemeente wordt toegevoegd, van de in de betrokken herindelingsregeling aan te wijzen
      gemeente in dezelfde rang, op dezelfde voet en ook overigens in dezelfde rechtstoestand als op de dag, voorafgaande
      aan die datum, voor hen golden.

      2 De eden en beloften, in verband met hun ambt door de in het eerste lid bedoelde ambtenaren afgelegd, worden
      geacht mede op die voorlopige dienstvervulling betrekking te hebben.

      3 Binnen zes maanden na de datum van herindeling neemt het bevoegde gezag van de gemeente in dienst waarvan de in
      het eerste lid bedoelde ambtenaren voorlopig zijn overgegaan, ten aanzien van elk van die ambtenaren één van de
      volgende beslissingen:

      a. dat en in welke rang en op welke voet hij in dienst van de gemeente blijft;

      b. dat hij eervol wordt ontslagen.

      De termijn van zes maanden kan door gedeputeerde staten van de betrokken provincie met ten hoogste zes maanden
      worden verlengd.

      4 Een beslissing als in het derde lid onder *b* bedoeld wordt slechts genomen, indien het na een zorgvuldig
      onderzoek niet mogelijk is gebleken de ambtenaar met een in verband met zijn persoonlijkheid en omstandigheden
      passende functie te belasten.

      5 Het in het derde lid onder *b* bedoelde ontslag wordt eveneens verleend aan de ambtenaar die weigert een hem
      aangeboden functie als bedoeld in het vierde lid te aanvaarden.

      6 Bij de ontslagverlening als bedoeld in het derde lid onder *b* wordt een opzeggingstermijn van drie maanden in
      acht genomen.

      7 De ingang van het ontslag als bedoeld in het derde lid onder *b* kan, indien het mogelijk is de ambtenaar met
      tijdelijke werkzaamheden te belasten en het bevoegde gezag van de gemeente in dienst waarvan de ambtenaar voorlopig
      is overgegaan, opschorting van de ingangsdatum van het ontslag in het belang van de dienst acht, met instemming
      van de ambtenaar een- of meermalen voor een daarbij overeen te komen duur worden opgeschort, echter in totaal niet
      langer dan voor een termijn van twee jaren.

      8 Het in het zevende lid bepaalde is van overeenkomstige toepassing op de ambtenaar ten aanzien van wie een
      beslissing als bedoeld in het derde lid onder *b* is genomen, indien het mogelijk is hem in een andere bij dezelfde
      wijziging van de gemeentelijke indeling betrokken gemeente met tijdelijke werkzaamheden te belasten en de ambtenaar
      daarmee instemt. In dat geval wordt het hem verleende ontslag geacht te zijn verleend door het bevoegde gezag van
      die andere gemeente, die voor de toepassing van deze wet ook overigens te zijnen aanzien in de plaats treedt van de
      gemeente in dienst waarvan hij op de datum van herindeling voorlopig was overgegaan.

      9 Indien gedurende de in het zevende lid bedoelde termijn een functie als bedoeld in het vierde lid beschikbaar
      komt, neemt het bevoegde gezag, tenzij de betrokken ambtenaar de hem aangeboden functie weigert te aanvaarden,
      onder gelijktijdige intrekking van de beslissing tot ontslagverlening, te zijnen aanzien de beslissing als bedoeld
      in het derde lid onder *a*.

      10 Voor het vaststellen van de bezoldiging van de ambtenaar die door toepassing van het bepaalde in het derde lid
      onder *a* in dienst van de gemeente blijft, onderscheidenlijk van de ambtenaar die door toepassing van het bepaalde
      in het zevende of achtste lid tijdelijk in dienst van de gemeente blijft, wordt ten minste de salarispositie in
      aanmerking genomen die voor de berekening van zijn bezoldiging zou hebben gegolden in de gemeente in dienst waarvan
      hij op de dag, voorafgaande aan de datum van herindeling, werkzaam was.

      11 Voor de toepassing van dit artikel worden onder ambtenaren mede op arbeidsovereenkomst naar burgerlijk recht
      werkzame personen begrepen.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel59
  - number: '60'
    text: |-
      1 Het bevoegde gezag van de in [artikel 59, derde lid][ref1], bedoelde gemeente stelt, voor zoveel nodig, binnen
      de in dat lid genoemde - eventueel krachtens dat lid verlengde - termijn de in de [artikelen 125][ref2] en
      [134 van de Ambtenarenwet 1929][ref3] bedoelde voorschriften vast.

      2 Tot aan de inwerkingtreding van de in het eerste lid bedoelde voorschriften blijft voor de in dienst van de in
      dat lid bedoelde gemeente werkzame personen de regeling van de rechtstoestand gelden die voor hen laatstelijk gold
      in de gemeente in dienst waarvan zij op de dag, voorafgaande aan de datum van herindeling, hun hoofdbetrekking
      vervulden.

      3 Ook na de inwerkingtreding van de in het eerste lid bedoelde voorschriften en onverminderd het in
      [artikel 59, tiende lid][ref4], bepaalde wordt voor de vaststelling van en wijziging in de bezoldiging van de in
      laatstgenoemd lid bedoelde ambtenaar ten minste de salarispositie in aanmerking genomen die voor hem gegolden zou
      hebben volgens de salarisschaal van de bezoldigingsregeling welke op hem van toepassing was op de dag, voorafgaande
      aan de datum van herindeling. Het bepaalde in [artikel 59, elfde lid][ref5], is ter zake van overeenkomstige
      toepassing.


