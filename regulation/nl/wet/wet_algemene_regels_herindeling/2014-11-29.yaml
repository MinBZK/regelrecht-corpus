  - number: '2'
    text: |-
      1 Bij een herindelingsontwerp, een herindelingsadvies en een herindelingsregeling zijn een of meer kaarten gevoegd
      waarop de wijzigingen van de provincie- of gemeentegrenzen zijn aangegeven.

      2 Uiterlijk twee maanden na de vaststelling van de herindelingsregeling stellen gedeputeerde staten een
      beschrijving vast van de grenzen die zijn aangegeven op de bij de herindelingsregeling gevoegde kaart of kaarten.
      De beschrijving geschiedt met behulp van kadastrale kenmerken en indien dat niet mogelijk is met behulp van
      coördinaten van het verschoven stelsel van rijksdriehoeksmeting.

      3 De inwerkingtreding van de herindelingsregeling wordt bepaald op een tijdstip gelegen na de vaststelling van
      de grensbeschrijving.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel2
  - number: '3'
    text: |-
      1 Een wijziging van de gemeentelijke indeling geschiedt bij wet.

      2 Een grenscorrectie geschiedt:

      a. bij gelijkluidende besluiten van de raden van de betrokken gemeenten;

      b. bij besluit van provinciale staten;

      c. bij algemene maatregel van bestuur of bij wet.

      3 Een grenscorrectie die gepaard gaat met een wijziging van een provinciegrens geschiedt:

      a. bij gelijkluidende besluiten van provinciale staten van de betrokken provincies;

      b. bij algemene maatregel van bestuur of bij wet.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel3
  - number: '4'
    text: |-
      1 Een herindelingsadvies met betrekking tot een wijziging van de gemeentelijke indeling wordt door provinciale
      staten vastgesteld.

      2 Een herindelingsadvies met betrekking tot een wijziging van de gemeentelijke indeling kan door de raden van de
      betrokken gemeenten worden vastgesteld.

      3 Indien de besturen van de betrokken provincies van oordeel verschillen over de wenselijkheid van een
      grenscorrectie die gepaard gaat met een wijziging van de provinciegrens kunnen provinciale staten van één provincie
      een herindelingsadvies vaststellen.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel4
  - number: '5'
    text: |-
      1 Bij de voorbereiding van een herindelingsregeling tot grenscorrectie als bedoeld in
      [artikel 3, tweede lid, onder a][ref1], of van een herindelingsadvies met betrekking tot een wijziging van de
      gemeentelijke indeling als bedoeld in [artikel 4, tweede lid][ref2], stellen de raden van de betrokken gemeenten
      gezamenlijk een herindelingsontwerp vast en zenden dit aan gedeputeerde staten.

      2 Burgemeester en wethouders leggen het herindelingsontwerp gedurende acht weken ter inzage op de
      gemeentesecretarie. De terinzagelegging wordt bekendgemaakt. Gedurende de termijn van terinzagelegging kan een
      ieder zijn zienswijze over het ontwerp kenbaar maken aan het college van burgemeester en wethouders.

      3 Het herindelingsadvies wordt door gedeputeerde staten aan Onze Minister gezonden tezamen met de zienswijze van
      gedeputeerde staten.

      4 Een gemeentebestuur treft op grond van dit artikel geen voorbereidingen voor een wijziging van de grenzen van de
      gemeente na het tijdstip waarop gedeputeerde staten of Onze Minister hebben medegedeeld dat door hen werkzaamheden
      ter hand zijn genomen in verband met de voorbereiding van een wijziging van de grenzen van de gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel4
