  - number: '65'
    text: |-
      1 Indien een bij een wijziging van de gemeentelijke indeling betrokken gemeente is aangesloten bij een
      gemeenschappelijke regeling "Instituut Ziektekostenvoorziening Ambtenaren", en indien een ambtenaar, die krachtens
      [artikel 62][ref1] onderscheidenlijk [63][ref2] recht heeft op wachtgeld of een uitkering, zijn deelnemerschap in
      het instituut ontleent aan het dienen van evengenoemde gemeente, komt het aandeel van deze gemeente voor rekening
      van de gemeente ten laste waarvan op grond van de [artikelen 62][ref3] onderscheidenlijk [63][ref4] het recht op
      wachtgeld of uitkering komt.

      2 Indien een gemeente als bedoeld in het eerste lid niet is aangesloten bij een gemeenschappelijke regeling
      "Instituut Ziektekostenvoorziening Ambtenaren" maar een afzonderlijke ziektekostenvoorziening heeft getroffen, is
      het bepaalde in het eerste lid van overeenkomstige toepassing.


