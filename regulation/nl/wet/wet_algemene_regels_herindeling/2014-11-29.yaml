  - number: '20'
    text: |-
      Een herindelingsontwerp vastgesteld met toepassing van dit hoofdstuk wordt tevens toegezonden aan de betrokken
      waterschapsbesturen.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel20
  - number: '21'
    text: |-
      1 Met ingang van de dag waarop een gemeente blijkens een herindelingsontwerp, een herindelingsadvies of een
      voorstel van wet in aanmerking komt om te worden opgeheven, behoeven de door gedeputeerde staten aangewezen
      besluiten van de raden en de colleges van burgemeester en wethouders van de betrokken gemeenten de goedkeuring van
      gedeputeerde staten.

      2 Aangewezen kunnen worden categorieën van besluiten die kunnen leiden tot nieuwe uitgaven, tot verhoging van
      bestaande uitgaven dan wel tot verlaging van bestaande inkomsten of tot vermindering van vermogen.

      3 De goedkeuring kan worden onthouden wegens strijd met het financieel belang van de gemeente of gemeenten waarvan
      het gebied van de betrokken gemeente na herindeling deel zal gaan uitmaken.

      4 Het toezicht dat is aangevangen op grond van het eerste lid blijft van kracht tot de datum van herindeling of de
      datum waarop Onze Minister bepaalt dat het toezicht is vervallen.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel21
  - number: '28'
    text: |-
      De op de dag, voorafgaande aan de datum van herindeling, voor een overgaand gebied geldende gemeentelijke
      voorschriften behouden gedurende twee jaren na die datum voor dat gebied hun rechtskracht, voor zover het bevoegde
      gezag van de gemeente waaraan dat gebied is toegevoegd, deze voorschriften niet eerder vervallen verklaart.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel28
  - number: '29'
    text: |-
      1 Het bevoegde gezag van een nieuwe gemeente kan vóór afloop van de in [artikel 28][ref1] bedoelde termijn een
      voorschrift als in dat artikel bedoeld voor het gehele gebied der gemeente geldend verklaren.

      2 Op gelijke wijze maakt het bestuur van de nieuwe gemeente tijdig vóór afloop van de in [artikel 28][ref2]
      bedoelde termijn bekend welke overige in dat artikel bedoelde voorschriften na afloop van die termijn voor het
      gehele gebied der gemeente zullen gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel28
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
  - number: '30'
    text: |-
      1 De op de dag, voorafgaande aan de datum van herindeling, in een gemeente van kracht zijnde gemeentelijke
      voorschriften gelden gedurende twee jaren na die datum niet voor aan die gemeente toegevoegd gebied, voor zover het
      bevoegde gezag van die gemeente deze voorschriften niet eerder voor dat gebied geldend verklaart.

      2 Het college van burgemeester en wethouders maakt tijdig vóór afloop van de in het eerste lid bedoelde termijn
      bekend welke in dat lid bedoelde voorschriften na afloop van die termijn voor het toegevoegde gebied zullen gelden.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel30
  - number: '31'
    text: |-
      De op de dag, voorafgaande aan de datum van herindeling, geldende besluiten tot instelling van commissies als
      bedoeld in [Hoofdstuk V van de Gemeentewet][ref1] (*Stb.* 1992, 96) van gemeenten waarin een raadsverkiezing als
      bedoeld in [artikel 52][ref2] is gehouden, vervallen op die datum. Zij kunnen binnen een maand na die datum door
      het op grond van [hoofdstuk V van de Gemeentewet][ref3] bevoegde orgaan tot instelling van de commissies geheel of
      ten dele wederom geldend worden verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#HoofdstukV
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0005416#HoofdstukV
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel31
