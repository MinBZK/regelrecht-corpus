  - number: '32'
    text: |-
      1 Het bepaalde in de [artikelen 28-30][ref1] is niet van toepassing op belastingverordeningen op voet van
      [artikel 220 van de Gemeentewet][ref2]. Ten aanzien van overgaand gebied houden deze verordeningen op te gelden met
      ingang van de datum van herindeling, doch zij behouden, met inachtneming van het bepaalde in [artikel 39][ref3],
      hun rechtskracht voor de belastingjaren welke vóór die datum zijn aangevangen.

      2 De raad van een nieuwe gemeente kan binnen drie maanden na de datum van herindeling ingevolge het bepaalde in
      [artikel 216 van de Gemeentewet][ref4] besluiten tot vaststelling van een nieuwe verordening die met ingang van
      genoemde datum zal gelden voor de gemeente.

      3 Voor gebied dat overgaat naar een andere dan een nieuwe gemeente is met ingang van de datum van herindeling
      van toepassing de verordening van de gemeente waaraan dat gebied is toegevoegd. Voor zover de herindeling zulks
      noodzakelijk maakt, is de raad van de gemeente waaraan het gebied is toegevoegd, bevoegd binnen 3 maanden na de
      datum van herindeling te besluiten tot aanpassing van de verordening. De aangepaste verordening geldt met ingang
      van genoemde datum voor het gehele gebied der gemeente.

      4 Het bepaalde in de [artikelen 28-30][ref5] is evenmin van toepassing op besluiten inzake de baatbelasting
      die zijn vastgesteld op de voet van [artikel 222 van de Gemeentewet][ref6] en op besluiten als bedoeld in de
      __REF002___________________________________________________________________________________________________________
      __________. Deze besluiten worden aangemerkt als besluiten van de gemeente waaraan het gebied is toegevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
