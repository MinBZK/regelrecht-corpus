  - number: '57'
    text: |-
      1 Met ingang van de datum van herindeling is de secretaris van een gemeente die wordt opgeheven eervol uit zijn
      ambt ontslagen.

      2 Gedeputeerde staten kunnen op verzoek van de secretaris bepalen dat hij met ingang van de datum van herindeling
      in een andere functie voorlopig overgaat in dienst van de gemeente waaraan het gebied van de op te heffen
      gemeente wordt toegevoegd, dan wel, wanneer dat gebied wordt toegevoegd aan meer dan één gemeente, in dienst
      van de krachtens [artikel 59, eerste lid][ref1], aan te wijzen gemeente. In dit geval is het bepaalde in de
      [artikelen 59][ref2] en [60][ref3] op hem van overeenkomstige toepassing.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing op de griffier.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel60
