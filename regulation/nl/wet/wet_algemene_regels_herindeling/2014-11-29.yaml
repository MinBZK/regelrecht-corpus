  - number: '51'
    text: |-
      1 Indien bij een wijziging van een provinciegrens in verband met het bepaalde in de [artikelen 40][ref1],
      [43][ref2], [46][ref3] en [49][ref4] een verrekening tussen provincies dient plaats te vinden, worden het bedrag en
      de wijze van betaling daarvan vastgesteld:

      a. door de colleges van gedeputeerde staten van de betrokken provincies in onderling overleg;

      b. bij koninklijk besluit, de besturen van de betrokken provincies gehoord, bij gebreke van overeenstemming tussen
      de colleges, bedoeld onder *a*.

      2 Bij het vaststellen van het bedrag van de verrekening, bedoeld in het eerste lid, kunnen reserves en
      voorzieningen worden betrokken.


