        artikel: '28'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '30'
        hoofdstuk: V
  - number: '36'
    text: |-
      1 Voor de secretaris en de griffier van een nieuwe gemeente gelden de instructies van de in de betrokken
      herindelingsregeling aan te wijzen gemeente totdat zij door andere zijn vervangen.

      2 Voor de vergaderingen van de raad en van burgemeester en wethouders van een nieuwe gemeente gelden de reglementen
      van orde van de in de betrokken herindelingswet aan te wijzen gemeente totdat zij door andere zijn vervangen.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel36
  - number: '37'
    text: |-
      Met ingang van de datum van herindeling en zolang de in [artikel 28][ref1] bedoelde voorschriften blijven gelden,
      oefenen in toegevoegd gebied de in de gemeente waarnaar dat gebied is overgegaan, bevoegde organen en ambtenaren de
      bevoegdheden uit welke bij die voorschriften aan overeenkomstige organen en ambtenaren zijn toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '28'
        hoofdstuk: V
  - number: '38'
    text: |-
      1 Bij wijziging van een provinciegrens is het bepaalde in [artikel 37][ref1] van overeenkomstige toepassing ten
      aanzien van de bevoegdheden van de organen en de ambtenaren van de provincie.

      2 In afwijking van het bepaalde in het eerste lid wordt het toezicht op de bij de wijziging van de provinciale
      grens betrokken waterschappen uitgeoefend door de organen die daarmede op de dag, voorafgaande aan de datum van
      herindeling, belast waren, totdat bij reglementswijziging in de gevolgen van de betrokken herindelingsregeling
      is voorzien. Indien tussen de betrokken gedeputeerde staten niet binnen een jaar omtrent de reglementswijziging
      overeenstemming is bereikt, is het bepaalde in [artikel 4 van de Waterstaatswet 1900][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel4
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '37'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001867
        artikel: '4'
  - number: '39'
    text: |-
      1 De bevoegdheid tot het heffen en invorderen van gemeentelijke belastingen in toegevoegd gebied over een
      belastingjaar dat vóór de datum van herindeling is aangevangen, blijft voorbehouden aan de organen en ambtenaren
      van de gemeente waartoe dat gebied vóór die datum behoorde.

      2 Ingeval de in het eerste lid bedoelde gemeente bij een herindelingswet wordt opgeheven, komt de in dat lid
      genoemde bevoegdheid toe aan de organen en ambtenaren van de in die wet aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel39
  - number: '40'
    text: |-
      Onverminderd [artikel 226 van de Provinciewet][ref1] en [artikel 228 van de Provinciewet][ref2] is bij wijziging
      van een provinciegrens [artikel 39, eerste lid][ref3], van overeenkomstige toepassing ten aanzien van provinciale
      belastingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel226
      [ref2]: https://wetten.overheid.nl/BWBR0005645#Artikel228
      [ref3]: https://wetten.overheid.nl/BWBR0003718#Artikel39
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '226'
      - id: ref2
        bwb_id: BWBR0005645
        artikel: '228'
      - id: ref3
        bwb_id: BWBR0003718
        artikel: '39'
        hoofdstuk: V
  - number: '41'
    text: |-
      1 Gemeenschappelijke regelingen waaraan uitsluitend wordt deelgenomen door gemeenten welker gebied in zijn geheel
      tot een en dezelfde gemeente komt te behoren, vervallen met ingang van de datum van herindeling. Het bestuur van
      die gemeente treft in verband hiermede de nodige voorzieningen.

      2 In een herindelingsregeling kan het bepaalde in het eerste lid van overeenkomstige toepassing worden verklaard
      ten aanzien van gemeenschappelijke regelingen waaraan uitsluitend wordt deelgenomen door gemeenten welker gebied
      grotendeels tot een en dezelfde gemeente komt te behoren.

      3 De overige gemeenschappelijke regelingen waaraan bij een wijziging van de gemeentelijke indeling betrokken
      gemeenten deelnemen, blijven ongewijzigd van kracht, met dien verstande dat de betrokken herindelingsregeling
      de gemeente of gemeenten aanwijst die, zolang nog geen uitvoering is gegeven aan het vierde of vijfde lid van
      dit artikel, voor de toepassing van de regeling in de plaats treedt onderscheidenlijk treden van op te heffen
      gemeenten.

      4 De deelnemers aan een gemeenschappelijke regeling als bedoeld in het derde lid treffen, voor zoveel nodig, binnen
      zes maanden na de datum van herindeling met toepassing van de [Wet gemeenschappelijke regelingen][ref1] de uit de
      gewijzigde gemeentelijke indeling voortvloeiende voorzieningen. Zij kunnen daarbij afwijken van de bepalingen van
      de gemeenschappelijke regeling met betrekking tot wijziging en opheffing van de regeling en het toe- en uittreden
      van deelnemers. De in de eerste volzin genoemde termijn kan door gedeputeerde staten van de betrokken provincie of,
      zo de regeling uitsluitend tussen burgemeesters is aangegaan, door de commissaris van de Koning in die provincie
      met ten hoogste zes maanden worden verlengd.

      5 Indien de voorzieningen, bedoeld in het vierde lid, niet binnen de daarvoor gestelde termijn zijn getroffen, kan
      dit geschieden door gedeputeerde staten of, zo de regeling uitsluitend tussen burgemeesters is aangegaan, door de
      commissaris van de Koning.

      6 De leden van bij gemeenschappelijke regeling ingestelde organen, aangewezen door de vóór de datum van herindeling
      bevoegde gemeentebesturen, blijven in deze organen zitting hebben totdat de na de datum van herindeling bevoegde
      gemeentebesturen, zo nodig met afwijking van hetgeen in de gemeenschappelijke regeling ten aanzien van de
      zittingsduur is bepaald, in de aanwijzing hebben voorzien.

      7 De voorgaande leden zijn niet van toepassing ten aanzien van gemeenschappelijke regelingen die van kracht zijn
      voor een gebied waarvan de omvang bij of krachtens wet dan wel bij koninklijk besluit is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: '43'
    text: |-
      Voor zover aan een gemeenschappelijke regeling als bedoeld in [artikel 41, derde lid][ref1], wordt deelgenomen
      door een provincie en die regeling mede betrekking heeft op gebied dat ingevolge een herindelingsregeling naar een
      andere provincie overgaat, is het bepaalde in dat en het [vierde, zesde en zevende lid van artikel 41][ref2] van
      overeenkomstige toepassing ten aanzien van de betrokken provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel41
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003718
        artikel: '41'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0003718
        artikel: '41'
        hoofdstuk: V
  - number: 43a
    text: |-
      1 In afwijking van [artikel 81p van de Gemeentewet][ref1] kan de raad van een nieuwe gemeente op uiterlijk
      15 januari van het jaar waarin de gemeente is ingesteld, de behandeling van verzoekschriften als bedoeld in
      [artikel 9:18, eerste lid, van de Algemene wet bestuursrecht][ref2], opdragen aan een gemeentelijke ombudsman of
      ombudscommissie, dan wel een gezamenlijke ombudsman of ombudscommissie. Het besluit werkt terug tot 1 januari van
      het jaar waarin het is genomen.

      2 Indien de raad een besluit als bedoeld in het eerste lid neemt, zendt hij dit binnen een week aan de Nationale
      ombudsman.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel81p
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel918
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel43a
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: 81p
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 9:18
  - number: '44'
    text: |-
      1 Onverminderd het bepaalde in het tweede lid en in de [artikelen 45][ref1] en [48][ref2] gaan op de datum van
      herindeling alle rechten en verplichtingen van een op te heffen gemeente over op de gemeente waaraan haar gebied
      wordt toegevoegd, dan wel, wanneer het gebied naar meer dan één gemeente overgaat, naar de in de betrokken
      herindelingsregeling aan te wijzen gemeente, zonder dat daarvoor een nadere akte wordt gevorderd.

      2 Alle rechten en verplichtingen van een gemeente, betrekking hebbende op van die gemeente overgaand gebied, gaan
      op de datum van herindeling over op de gemeente waaraan dat gebied wordt toegevoegd, zonder dat daarvoor een nadere
      akte wordt gevorderd.

      3 Wettelijke procedures en rechtsgedingen waarbij een gemeente, van welke gebied overgaat, betrokken is, worden met
      ingang van de datum van herindeling voortgezet door of tegen de gemeente waaraan dat gebied wordt toegevoegd, voor
      zover krachtens het in het eerste en tweede lid bepaalde de in deze leden bedoelde rechten en verplichtingen op die
      gemeente overgaan. Ten aanzien van de rechtsgedingen is de [elfde afdeling van de tweede titel van het eerste boek
      van het Wetboek van Burgerlijke Rechtsvordering](onbekend) van overeenkomstige toepassing.

      4 Gedeputeerde staten van de betrokken provincie doen, ingeval op grond van het bepaalde in het eerste en
      tweede lid registergoederen overgaan, de overgang van de betrokken registergoederen onverwijld inschrijven
      in de openbare registers, bedoeld in [afdeling 2 van titel 1 van Boek 3 van het Burgerlijk Wetboek][ref3].
      [Artikel 24, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref4] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Afdeling2
      [ref4]: https://wetten.overheid.nl/BWBR0005291#Artikel24
