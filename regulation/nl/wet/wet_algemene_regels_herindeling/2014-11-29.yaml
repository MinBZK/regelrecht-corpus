  - number: '35'
    text: |-
      Bij wijziging van een provinciegrens is het bepaalde in de [artikelen 28][ref1] en [30][ref2] van overeenkomstige
      toepassing ten aanzien van provinciale voorschriften zomede het bevoegde gezag van de betrokken provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel30
    url: https://wetten.overheid.nl/BWBR0003718/2014-11-29#Artikel35
    references:
