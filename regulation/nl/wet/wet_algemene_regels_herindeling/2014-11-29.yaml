  - number: '70'
    text: |-
      1 Onverminderd het bepaalde in het tweede lid en in [artikel 71][ref1] gaan op de datum van herindeling de
      archiefbescheiden van een gemeente die wordt opgeheven, over naar de gemeente waaraan het gebied van de op te
      heffen gemeente wordt toegevoegd, dan wel, wanneer dat gebied aan meer dan één gemeente wordt toegevoegd, naar de
      in de betrokken herindelingsregeling aan te wijzen gemeente.

      2 Eveneens onverminderd het bepaalde in [artikel 71][ref2] gaan op de datum van herindeling alle gemeentelijke
      archiefbescheiden, uitsluitend betrekking hebbend op overgaand gebied, over naar de gemeente waaraan dat gebied
      wordt toegevoegd, met dien verstande dat de overbrenging als bedoeld in [artikel 12 van de Archiefwet 1995][ref3]
      (*Stb.* 276) ten aanzien van deze bescheiden geschiedt als had geen herindeling plaatsgevonden. Van de overgang
      wordt een verklaring opgemaakt volgens de krachtens [artikel 9 van genoemde wet][ref4] voor vervreemding van
      archiefbescheiden gestelde regels.

      3 De gemeenteraad en het college van burgemeester en wethouders waaraan gebied is toegevoegd, heeft van de datum
      van herindeling af het recht te allen tijde kosteloos inzage te nemen van de archiefbescheiden der gemeente
      waartoe dat gebied voor die datum behoorde, dan wel der gemeente waarnaar die archiefbescheiden krachtens het
      bepaalde in het eerste lid zijn overgegaan, en op kosten van zijn gemeente afschriften van of uittreksels uit die
      archiefbescheiden te vorderen, voor zover deze mede betrekking hebben op het toegevoegde gebied.

      4 Bij wijziging van een provinciegrens is het bepaalde in het tweede en derde lid van overeenkomstige toepassing
      ten aanzien van de overgang van provinciale archiefbescheiden.


      [ref1]: https://wetten.overheid.nl/BWBR0003718#Artikel71
      [ref2]: https://wetten.overheid.nl/BWBR0003718#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0007376#Artikel9
