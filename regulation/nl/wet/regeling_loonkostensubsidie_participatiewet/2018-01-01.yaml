preamble:
  text: >-
    Gelet op de artikelen 10d, vierde lid en 10e van de Participatiewet en de artikelen 1, 3, en 4 van het Besluit
    loonkostensubsidie Participatiewet;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0035633/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De vergoeding van werkgeverslasten, bedoeld in [artikel 10d, vierde en vijfde lid, van de Participatiewet][ref1]
      bedraagt 23,5 procent van de loonkosten waarover loonkostensubsidie wordt verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10d
    url: https://wetten.overheid.nl/BWBR0035633/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10d
  - number: '2'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *kwaliteit:* het gemiddelde aantal geproduceerde eenheden of diensten over een relevante periode dat bruikbaar
      is en voldoet aan de gestelde kwaliteit;

      b. *tempo:* het gemiddelde aantal geproduceerde eenheden of diensten over een relevante periode;

      c. *inzetbaarheid:* de gemiddelde productieve tijd, die direct is gerelateerd aan de mogelijkheden van de werknemer
      over een relevante periode;

      d. *normfunctie:* de functie van een gemiddelde werknemer met een soortgelijke
      opleiding en ervaring, die niet tot de doelgroep loonkostensubsidie behoort, bedoeld in
      [artikel 6, eerste lid, onderdeel g, van de Participatiewet][ref1], die qua samenstelling van de werkzaamheden het
      dichtst tegen de feitelijk uitgevoerde werkzaamheden van de potentiële werknemer aan ligt;

      e. *werknemer:* een persoon als bedoeld in [artikel 10d, eerste of tweede lid, van de Participatiewet][ref2] met
      wie de werkgever voornemens is een dienstbetrekking als bedoeld in die leden aan te gaan, of met wie de werkgever
      een dienstbetrekking als bedoeld in die leden is aangegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel10d
    url: https://wetten.overheid.nl/BWBR0035633/2018-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 10d
  - number: '3'
    text: >-
      1 Bij de vaststelling van de loonwaarde neemt het college de taken in aanmerking, waarbij de bijdrage van de
      afzonderlijke taken aan het totale takenpakket in procenten wordt weergegeven.


      2 Het totale takenpakket omvat 100% van de totale arbeidstijd van de werknemer.


      3 Bij de vaststelling van de loonwaarde van de werknemer bepaalt het college een normfunctie.
    url: https://wetten.overheid.nl/BWBR0035633/2018-01-01#Artikel3
  - number: '4'
    text: >-
      1 De loonwaarde van een werknemer wordt vastgesteld met inachtneming van de bijlage behorend bij dit besluit, en
      bedraagt de som van de loonwaarden per taak.


      2 De loonwaarde per taak bedraagt: L=T*K*I*BT, waarbij:


      L staat voor de loonwaarde per taak,


      T staat voor de prestatie in de taak in tempo van de werknemer uitgedrukt in een percentage van wat een gemiddelde
      werknemer met een soortgelijke opleiding en ervaring, die niet tot de doelgroep loonkostensubsidie behoort,
      presteert,


      K staat voor de prestatie in de taak in kwaliteit van de werknemer uitgedrukt in een percentage van wat een
      gemiddelde werknemer met een soortgelijke opleiding en ervaring, die niet tot de doelgroep loonkostensubsidie
      behoort, presteert,


      I staat voor de prestatie in de taak in inzetbaarheid van de werknemer uitgedrukt in een percentage van wat een
      gemiddelde werknemer met een soortgelijke opleiding en ervaring, die niet tot de doelgroep loonkostensubsidie
      behoort, presteert, en


      BT staat voor de bijdrage van de taak aan het totale takenpakket.


      3 De loonwaarde, bedoeld in het eerste lid, wordt rekenkundig afgerond op hele procenten.


      4 Factoren die van invloed zijn op meer dan een van de prestaties T, K of I komen in slechts een van de prestaties
      tot uitdrukking.
    url: https://wetten.overheid.nl/BWBR0035633/2018-01-01#Artikel4
  - number: 4a
    text: |-
      Deze regeling berust mede op [artikel 10d, vijfde lid, van de Participatiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10d
    url: https://wetten.overheid.nl/BWBR0035633/2018-01-01#Artikel4a
