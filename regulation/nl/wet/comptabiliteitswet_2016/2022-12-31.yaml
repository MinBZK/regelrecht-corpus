preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is de Comptabiliteitswet 2001 te vervangen door nieuwe
    wettelijke bepalingen over het beheer, de informatievoorziening, de controle en de verantwoording inzake de
    financiën van het Rijk, mede ter uitvoering van de artikelen 78 en 105 van de Grondwet, en dat het wenselijk is
    daarin bepalingen op te nemen over het beheer van publieke liquide middelen buiten het Rijk en over het toezicht op
    het beheer van publieke liquide middelen en publieke financiële middelen buiten het Rijk;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
        - *agentschap:* een baten-lastenagentschap of een verplichtingen-kasagentschap;
        - *Auditdienst Rijk:* het dienstonderdeel van het Ministerie van Financiën dat belast is met de uitoefening van de
      auditfunctie bij het Rijk;
        - *baten-lastenagentschap:* een dienstonderdeel van een ministerie, dat op grond van
      [artikel 2.20, eerste lid][ref1], als baten-lastenagentschap is aangewezen;
        - *baten-lastenstelsel:* het financieel-administratieve stelsel van rekeningen waarin als uitgaven en ontvangsten
      in een jaar worden opgenomen de geldswaarden van het verbruik van goederen en diensten (lasten) in dat jaar,
      respectievelijk de geldswaarden van de rechten op ontvangsten (baten), die in dat jaar ontstaan;
        - *bedrijfsvoering:* het inzetten van personeel en materieel ter ondersteuning van het beleid of de taak;
        - *begrotingsbeheer:* het sturen en beheersen van het begrotingsproces, waaronder de begrotingsuitvoering en de
      zorg voor het ramen van de ontvangsten en de uitgaven;
        - *begrotingsreserve:* een geoormerkte, meerjarige budgettaire voorziening die wordt aangehouden op een
      afzonderlijke rekening-courant bij het Ministerie van Financiën;
        - *begrotingsstelsel:* het baten-lastenstelsel, het kasstelsel of het verplichtingen-kasstelsel;
        - *boeken binnen begrotingsverband:* het boeken van de geldswaarden van handelingen die betrekking hebben op
      het financieel beheer op een rekening in de financiële administratie, waarvan het saldo wordt opgenomen in een
      begrotingsartikel in een begrotingsstaat;
        - *boeken buiten begrotingsverband:* het boeken van de geldswaarden van handelingen die betrekking hebben op het
      financieel beheer op een rekening in de financiële administratie, waarvan het saldo niet wordt opgenomen in een
      begrotingsartikel in een begrotingsstaat;
        - *budgetdisciplinesector:* een onderdeel van de collectieve sector dat budgettair afzonderlijk wordt
      onderscheiden;
        - *college:* de Staten-Generaal, de Raad van State, de Algemene Rekenkamer, de Nationale ombudsman, de Kanselarij
      der Nederlandse Orden, het Kabinet van de Koning, het Kabinet van de Gouverneur van Aruba, het Kabinet van de
      Gouverneur van Curaçao, het Kabinet van de Gouverneur van Sint Maarten, de Kiesraad en de Commissie van toezicht
      betreffende de inlichtingen- en veiligheidsdiensten;
        - *dienstonderdeel:* een organisatieonderdeel van een ministerie of een college;
        - *financieel beheer:* het sturen en beheersen van de financiële aspecten van het beleid en de bedrijfsvoering,
      waaronder de zorg voor: a. het aangaan van financiële verplichtingen; b. het heffen van belastingen en het opleggen
      van andere heffingen; c. het in rekening brengen van kosten; d. het beheer van de financiële bezittingen en
      schulden; e. het kasbeheer;
        - *financiële begrotingsinformatie:* de in een begroting opgenomen informatie over de financiële aspecten van het
      voorgenomen beleid en de voorgenomen bedrijfsvoering;
        - *financiële verantwoordingsinformatie:* de in een jaarverslag opgenomen informatie over de financiële aspecten
      van het gevoerde beleid en de gevoerde bedrijfsvoering;
        - *financiële verplichting:* de voorwaardelijke of onvoorwaardelijke verplichting tot het in de toekomst doen van
      een kasbetaling aan een derde of aan een ander dienstonderdeel;
        - *kasreserve:* een niet-geoormerkte, meerjarige budgettaire reserve die wordt aangehouden op een rekening-courant
      bij het Ministerie van Financiën;
        - *kasstelsel:* het financieel-administratieve stelsel van rekeningen waarin als uitgaven en ontvangsten in een
      jaar worden opgenomen de kasuitgaven en de kasontvangsten in dat jaar;
        - *materieelbeheer:* de zorg voor het onderhoud en de instandhouding van roerende en onroerende zaken vanaf het
      moment van inbeheer- of ingebruikneming tot aan het moment van afstoting;
        - *materiële bedrijfsvoering:* de materiële aspecten van het beleid en de bedrijfsvoering, toegespitst op: a. het
      verwerven van materieel; b. het materieelbeheer; c. het afstoten van materieel;
        - *niet-financiële verantwoordingsinformatie:* de in een jaarverslag opgenomen informatie over de niet-financiële
      aspecten van het gevoerde beleid en de gevoerde bedrijfsvoering;
        - *rechtspersoon met een wettelijke taak:* een rechtspersoon die een bij of krachtens een wet geregelde taak
      uitvoert en die daartoe geheel of gedeeltelijk wordt bekostigd uit de opbrengst van een bij of krachtens een wet
      ingestelde heffing, met uitzondering van de gemeenten, provincies, waterschappen, de openbare lichamen Bonaire,
      Sint Eustatius en Saba, openbare lichamen voor beroep en bedrijf en openbare lichamen en gemeenschappelijke
      organen ingesteld krachtens de [Wet gemeenschappelijke regelingen][ref2] uitgezonderd de openbare lichamen en
      gemeenschappelijke organen waaraan vanwege het Rijk wordt deelgenomen;
        - *saldibalans:* het overzicht van de saldi van de financiële activa en passiva zoals deze op een bepaalde datum
      uit de financiële administratie blijken;
        - *schatkist van het Rijk:* de departementale kassen en de centrale kassen van het Rijk tezamen;
        - *schatkistbankieren:* het aanhouden van liquide middelen op een bankrekening van de schatkist van het Rijk;
        - *slotverschil:* het verschil op het niveau van een begrotingsartikel dat na afloop van een begrotingsjaar
      wordt vastgesteld tussen de realisatie van de uitgaven, onderscheidenlijk de ontvangsten, en de raming van
      de uitgaven, onderscheidenlijk de ontvangsten, in de wet tot vaststelling van de begrotingsstaten, bedoeld in
      [artikel 2.23][ref3], en de wijzigingen die daarin zijn aangebracht door middel van de wetten tot wijziging van de
      begrotingsstaten, bedoeld in [artikel 2.26][ref4];
        - *transactiestelsel:* het financieel-administratieve stelsel van rekeningen waarin als uitgaven en ontvangsten in
      een jaar worden opgenomen de geldswaarden van de economische transacties die in dat jaar ontstaan;
        - *verplichtingen-kasagentschap:* een dienstonderdeel van een ministerie, dat op grond van
      [artikel 2.20, eerste lid][ref5], als verplichtingen-kasagentschap is aangewezen;
        - *verplichtingen-kasstelsel:* de combinatie van het verplichtingenstelsel en het kasstelsel waarin de kasuitgaven
      en de financiële verplichtingen geïntegreerd worden geadministreerd;
        - *verplichtingenstelsel:* het financieel-administratieve stelsel van rekeningen waarin als uitgaven en ontvangsten
      in een jaar worden opgenomen de geldswaarden van de in dat jaar aangegane of ontstane financiële verplichtingen die
      tot kasuitgaven leiden of kunnen leiden.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003740
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0039429#Artikel2
