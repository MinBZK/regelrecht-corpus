  - number: 2.1.1
    text: |-
      Tot de rijksbegroting behoren de departementale en de niet-departementale begrotingen van de ministeries en de
      colleges.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.2
    text: |-
      Onze Ministers, ieder met betrekking tot het beleid waarvoor hij verantwoordelijk is, stellen voor de aanvang van
      een begrotingsjaar een begroting op.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.3
    text: |-
      Voor elk ministerie is er één departementale begroting en kunnen er één of meer niet-departementale begrotingen
      zijn.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.4
    text: Voor elk college is er een niet-departementale begroting.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.5
    text: 'Als niet-departementale begroting worden voorts uitsluitend aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.5.a
    text: |-
      de begroting van de Koning, bedoeld in [artikel 2.9][ref1], en de begroting van Nationale Schuld, bedoeld in
      [artikel 2.10][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.1.5.b
    text: |-
      de begroting van koninkrijksrelaties, tenzij de uitgaven en ontvangsten die samenhangen met koninkrijksrelaties
      worden opgenomen in de betrokken departementale begroting;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.5.c
    text: |-
      de begrotingen van de begrotingsfondsen, bedoeld in [artikel 2.11, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.1.5.d
    text: |-
      de programmabegrotingen, bedoeld in [artikel 2.12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.1.6
    text: |-
      Een departementale begroting bevat de weergave van het beleid en de bedrijfsvoering van het ministerie, met
      uitzondering van de beleidsaangelegenheden die worden opgenomen in een begroting als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.7
    text: |-
      De niet-departementale begroting van een college bevat de weergave van de taken en van de bedrijfsvoering van het
      college.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
  - number: 2.1.8
    text: |-
      Een programmabegroting, onderscheidenlijk een begroting van een begrotingsfonds, bevat de weergave van het
      afgezonderde beheer, bedoeld in [artikel 2.12, eerste lid][ref1], respectievelijk [artikel 2.11, eerste lid][ref2].
      Een programmabegroting, onderscheidenlijk een begroting van een begrotingsfonds, bevat geen weergave van de
      bedrijfsvoering die met dat afgezonderde beheer samenhangt.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '2.2'
    text: Een begroting bestaat uit een begrotingsstaat en een daarbij behorende toelichting.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.2
  - number: 2.3.1
    text: Een begrotingsstaat wordt afzonderlijk bij wet vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.3
  - number: 2.3.2
    text: |-
      In afwijking van het eerste lid kunnen twee of meer begrotingsstaten waarvoor Onze Minister die het aangaat
      verantwoordelijk is, in één wet worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.3
  - number: 2.3.3
    text: Autorisatie van een begrotingsstaat vindt plaats op het niveau van een begrotingsartikel.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.3
  - number: 2.3.4
    text: Het geautoriseerde bedrag voor de uitgaven geldt als maximum.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.3
  - number: 2.3.5
    text: |-
      Structurele wijzigingen van de begrotingsstaat die op voorstel van een of meer leden van de Tweede Kamer der
      Staten-Generaal zijn aangebracht, worden, indien dit met dit voorstel beoogd is, tevens in de begrotingsstaten van
      de daaropvolgende jaren opgenomen, tenzij een zwaarwegende reden zich hiertegen verzet. In dat geval informeert
      Onze betrokken Minister de Tweede Kamer der Staten-Generaal hierover.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.3
  - number: '2.4'
    text: Het begrotingsjaar is het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.4
  - number: '2.5'
    text: 'De begrotingsstaat bestaat uit begrotingsartikelen en bevat per begrotingsartikel de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.5
  - number: 2.5.a
    text: het artikelnummer;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.5
  - number: 2.5.b
    text: de artikelomschrijving;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.5
  - number: 2.5.c
    text: het geraamde bedrag voor financiële verplichtingen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.5
  - number: 2.5.d
    text: het geraamde bedrag voor kasuitgaven;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.5
  - number: 2.5.e
    text: het geraamde bedrag voor kasontvangsten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.5
  - number: 2.6.1
    text: |-
      Een agentschap heeft een afzonderlijke financiële staat die wordt opgenomen bij de begrotingsstaat van de
      departementale begroting van het ministerie waaronder het agentschap ressorteert.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.6
  - number: 2.6.2
    text: |-
      De financiële staat van een agentschap bevat, al naar gelang van toepassing, de geraamde totaalbedragen van de
      financiële verplichtingen, de kasuitgaven en de kasontvangsten of de lasten en de baten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.6
  - number: 2.7.1
    text: |-
      Een begrotingsartikel met de omschrijving *Nog onverdeeld* kan in een begrotingsstaat worden opgenomen ten behoeve
      van de voorlopige verwerking van de loon- en prijsindexering, een taakstelling of een ander nog te verdelen
      begrotingsbedrag.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.7
  - number: 2.7.2
    text: |-
      Het begrotingsartikel *Nog onverdeeld* is een administratief artikel ten laste waarvan geen uitgaven worden gedaan
      of ten gunste waarvan geen ontvangsten worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.7
  - number: 2.7.3
    text: |-
      Het bedrag voor de uitgaven dat wordt opgenomen in de begrotingsstaat bij het begrotingsartikel *Nog onverdeeld*
      kan zowel positief als negatief zijn.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.7
  - number: '2.8'
    text: |-
      Een begrotingsartikel met de omschrijving *Geheim* kan in een begrotingsstaat worden opgenomen ten behoeve van
      uitgaven en ontvangsten waarvoor geldt dat openbaarmaking via de toedeling aan een ander begrotingsartikel niet in
      het belang van de Staat is.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.8
  - number: '2.9'
    text: 'De begroting van de Koning bevat:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.9
  - number: 2.9.a
    text: de uitkeringen aan leden van het koninklijk huis;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.9
  - number: 2.9.b
    text: de uitgaven die functioneel met het koningschap samenhangen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.9
  - number: 2.10.1
    text: 'De begroting van Nationale Schuld bevat:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.10.1.a
    text: |-
      de uitgaven en ontvangsten die voortvloeien uit transacties op de financiële markten, voor zover die transacties
      een oorspronkelijke looptijd hebben van langer dan één jaar;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.10.1.b
    text: |-
      de mutatie per 31 december van het begrotingsjaar ten opzichte van 31 december van het voorgaande jaar in het saldo
      van uitgaven en ontvangsten die voortvloeien uit transacties op de financiële markten, voor zover die transacties
      een oorspronkelijke looptijd hebben van maximaal één jaar;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.10.1.c
    text: |-
      de uitgaven en ontvangsten die voortvloeien uit door Onze Minister van Financiën met derden en agentschappen aan te
      gane leningen, bedoeld in de [artikelen 5.5, eerste lid][ref1], en [5.6, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 2.10.1.d
    text: |-
      de mutatie per 31 december van het begrotingsjaar ten opzichte van 31 december van het voorafgaande jaar in
      het totaalsaldo van de rekeningen-courant, inclusief de daaraan gekoppelde termijndeposito’s, die derden en
      dienstonderdelen in het kader van schatkistbankieren aanhouden bij de schatkist van het Rijk;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.10.1.e
    text: |-
      de uitgaven en ontvangsten aan rente, boete, kosten en provisie die voortvloeien uit de transacties, bedoeld onder
      b, alsmede uit de rekeningen-courant, bedoeld onder d;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.10.1.f
    text: de uitgaven en ontvangsten die voortvloeien uit het betalingsverkeer met een centrale kas van het Rijk;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.10.1.g
    text: |-
      andere door Onze Minister van Financiën aan te wijzen uitgaven en ontvangsten die voortvloeien uit vermogens- of
      financieringstransacties.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.10.2
    text: |-
      In afwijking van de aanhef van het eerste lid kan de begroting van Nationale Schuld geen mutaties als bedoeld in
      het eerste lid, onder b en d, bevatten. Na afloop van het begrotingsjaar worden deze mutaties als slotverschil
      weergegeven in het voorstel van wet tot vaststelling van de slotverschillen van de begroting van Nationale Schuld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.10
  - number: 2.11.1
    text: |-
      Een begrotingsfonds kan worden ingesteld ten behoeve van het afzonderlijk beheren van ontvangsten en uitgaven van
      het Rijk die voor een specifiek doel bestemd zijn.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.11
  - number: 2.11.2
    text: |-
      Het instellen van een begrotingsfonds geschiedt bij wet. De wet tot instelling van een begrotingsfonds wordt mede
      door Onze Minister van Financiën ondertekend.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.11
  - number: 2.11.3
    text: 'De wet tot instelling van een begrotingsfonds bepaalt voor dat fonds in elk geval:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.11
  - number: 2.11.3.a
    text: de aard van de uitgaven en de ontvangsten;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.11
  - number: 2.11.3.b
    text: wie van Onze Ministers met het beheer is belast.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.11
  - number: 2.11.4
    text: |-
      Een voordelig jaarsaldo van een begrotingsfonds wordt ten gunste van de begroting van het fonds van het daarop
      volgende jaar gebracht; een nadelig jaarsaldo wordt ten laste van die begroting gebracht.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.11
  - number: 2.12.1
    text: |-
      Een programmabegroting kan ten behoeve van een minister die niet belast is met de leiding van een ministerie
      worden ingesteld, indien het wenselijk is bepaalde ontvangsten en uitgaven van een ministerie afgezonderd van een
      departementale begroting te beheren.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.12
  - number: 2.12.2
    text: Het instellen van een programmabegroting geschiedt bij een wet tot vaststelling van de begrotingsstaten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.12
  - number: 2.12.3
    text: |-
      De wet tot instelling van een programmabegroting bepaalt wie van Onze Ministers belast is met het beheer van die
      begroting.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.12
  - number: 2.13.1
    text: Het begrotingsbeheer en het financieel beheer worden gevoerd met toepassing van het verplichtingen-kasstelsel.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.13
  - number: 2.13.2
    text: |-
      Het verplichtingen-kasstelsel wordt zodanig toegepast, dat aan de financiële administratie per begrotingsartikel in
      elk geval per ultimo van een begrotingsjaar ten minste kunnen worden ontleend:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.13
  - number: 2.13.2.a
    text: het deel van de geraamde financiële verplichtingen dat is aangegaan of ontstaan;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.13
  - number: 2.13.2.b
    text: het deel van de geraamde kasuitgaven dat tot betaling heeft geleid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.13
  - number: 2.13.2.c
    text: per aangegane of ontstane financiële verplichting het deel dat nog niet tot betaling heeft geleid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.13
  - number: 2.13.2.d
    text: het deel van de geraamde kasuitgaven waarvoor nog geen financiële verplichtingen zijn aangegaan of ontstaan;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.13
  - number: 2.13.2.e
    text: het deel van de geraamde kasontvangsten dat is ontvangen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.13
  - number: 2.14.1
    text: 'Tot een financiële verplichting wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.14
  - number: 2.14.1.a
    text: |-
      een financiële verplichting aan een derde op grond van een verdrag, een wet, een koninklijk besluit, een
      ministeriële regeling, een beschikking of een controleerbaar vastgelegde afspraak;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.14
  - number: 2.14.1.b
    text: een financiële verplichting aan een ander dienstonderdeel op grond van een controleerbaar vastgelegde afspraak.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.14
  - number: 2.14.2
    text: |-
      Bepalend voor het begrotingsjaar ten laste waarvan een aangegane of ontstane financiële verplichting wordt
      gebracht, is de datum waarop de verplichting ten opzichte van een derde of een ander dienstonderdeel controleerbaar
      vastligt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.14
  - number: 2.14.3
    text: |-
      In afwijking van het tweede lid kan Onze Minister van Financiën categorieën financiële verplichtingen aanwijzen
      waarbij het jaar waarin de kasbetaling is gedaan, kan worden aangemerkt als het begrotingsjaar waarin de met de
      kasbetaling samenhangende verplichting is aangegaan of is ontstaan.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.14
  - number: 2.14.4
    text: |-
      Een in een jaar aangegane of ontstane financiële verplichting die na de jaarafsluiting van de financiële
      administratie blijkt, wordt geboekt op het overeenkomstige begrotingsartikel in het dan lopende begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.14
  - number: 2.15.1
    text: 'Tot een kasuitgave, respectievelijk een kasontvangst, wordt gerekend:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
  - number: 2.15.1.a
    text: een betaling met liquide middelen, respectievelijk een ontvangst van liquide middelen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
  - number: 2.15.1.b
    text: |-
      de financiële waarde die wordt afgestaan, respectievelijk wordt ontvangen, bij een transactie waarbij de onderlinge
      schulden en vorderingen met elkaar worden verrekend;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
  - number: 2.15.1.c
    text: |-
      een toevoeging, respectievelijk een onttrekking, aan een kasreserve als bedoeld in
      [artikel 2.20, achtste lid][ref1], of aan een begrotingsreserve als bedoeld in [artikel 2.21, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.15.2
    text: |-
      Bepalend voor het begrotingsjaar ten laste waarvan een kasuitgave, respectievelijk ten gunste waarvan een
      kasontvangst wordt gebracht, is:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
  - number: 2.15.2.a
    text: |-
      de datum waarop de betaling is verricht, respectievelijk de ontvangst is verkregen, voor een betaling met liquide
      middelen of een ontvangst van liquide middelen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
  - number: 2.15.2.b
    text: |-
      de datum waarop de transactie controleerbaar is vastgelegd voor een transactie waarbij de onderlinge schulden en
      vorderingen met elkaar worden verrekend;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
  - number: 2.15.2.c
    text: |-
      de datum waarop de toevoeging of de onttrekking in de boekhouding is vastgelegd voor een kasreserve en een
      begrotingsreserve.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.15
  - number: 2.16.1
    text: Elke uitgave van Onze Ministers of de colleges wordt binnen begrotingsverband geboekt onder de uitgaven.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.16
  - number: 2.16.2
    text: Elke ontvangst van Onze Ministers of de colleges wordt binnen begrotingsverband geboekt onder de ontvangsten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.16
  - number: 2.17.1
    text: |-
      In afwijking van [artikel 2.16][ref1] kunnen Onze Ministers of de colleges uitgaven en ontvangsten buiten
      begrotingsverband boeken, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.17.1.a
    text: deze worden doorberekend ten laste van, respectievelijk ten gunste van, een andere begroting van het Rijk;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
  - number: 2.17.1.b
    text: |-
      deze worden doorberekend ten laste van, respectievelijk ten gunste van, een andere publiekrechtelijke rechtspersoon
      of een rechtspersoon met een wettelijke taak;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
  - number: 2.17.1.c
    text: |-
      deze worden doorberekend ten laste van, respectievelijk ten gunste van, een derde, niet zijnde een andere staat
      of een volkenrechtelijke organisatie, en Onze Minister die het aangaat of het college uitsluitend is belast met de
      administratieve verwerking van de uitgaven of ontvangsten;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
  - number: 2.17.1.d
    text: |-
      deze worden doorberekend ten laste van, respectievelijk ten gunste van, een andere staat of een volkenrechtelijke
      organisatie en Onze Minister die het aangaat of het college uitsluitend afspraken uitvoert die voortvloeien uit
      een verdrag, een besluit van een volkenrechtelijke organisatie of een internationale afspraak die controleerbaar
      is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
  - number: 2.17.2
    text: |-
      Onze Minister die het aangaat of het college dat met toepassing van het eerste lid uitgaven of ontvangsten buiten
      begrotingsverband boekt, boekt tevens de doorberekeningen die met die uitgaven of ontvangsten samenhangen, buiten
      begrotingsverband.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
  - number: 2.17.3
    text: |-
      Uitgaven en ontvangsten die buiten begrotingsverband zijn geboekt, worden alsnog binnen begrotingsverband geboekt
      in het jaar waarin wordt geconcludeerd dat een doorberekening niet plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
  - number: 2.17.4
    text: |-
      Financiële waarden die aan de staat zijn toevertrouwd of die door de staat in beheer zijn genomen zonder dat deze
      aan de staat toebehoren, worden zolang deze niet aan de staat zijn vervallen, buiten begrotingsverband geboekt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.17
  - number: '2.18'
    text: |-
      In afwijking van [artikel 2.16][ref1] kunnen Onze Ministers of de colleges uitgaven en ontvangsten salderen ingeval
      van:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.18.a
    text: ontvangen terugbetalingen in verband met eerder in hetzelfde jaar gedane uitgaven;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.18
  - number: 2.18.b
    text: terugbetalingen op eerder verkregen ontvangsten;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.18
  - number: 2.18.c
    text: onderlinge betalingen voor personeel en materieel tussen verschillende begrotingsstaten;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.18
  - number: 2.18.d
    text: onderlinge betalingen binnen dezelfde begrotingsstaat;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.18
  - number: 2.18.e
    text: uitgaven in de vorm van ontvangstenderving die op een wettelijke regeling zijn gebaseerd;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.18
  - number: 2.18.f
    text: ontvangsten uit een geldlening die is aangegaan ter conversie van een uitstaande schuld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.18
  - number: '2.19'
    text: |-
      In afwijking van [artikel 2.13, eerste lid][ref1], worden het begrotingsbeheer en het financieel beheer van de
      begroting van Nationale Schuld gevoerd met toepassing van het kasstelsel, met uitzondering van de rente-uitgaven en
      de rente-ontvangsten die gebaseerd worden op het transactiestelsel.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.20.1
    text: |-
      Indien voor een dienstonderdeel van een ministerie een afwijkend beheer wenselijk is, kan Onze Minister die het
      aangaat met inachtneming van de regels, bedoeld in [artikel 4.20, tweede lid, aanhef en onder g][ref1], besluiten
      een dienstonderdeel als baten-lastenagentschap of als verplichtingen-kasagentschap aan te wijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 2.20.2
    text: 'Een dergelijk besluit wordt genomen, indien:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.2.a
    text: Onze Minister die het aangaat van oordeel is dat het aanwijzen een doelmatige taakuitvoering bevordert;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.2.b
    text: Onze Minister van Financiën met het besluit instemt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.3
    text: |-
      Een dergelijk besluit wordt niet eerder genomen dan 30 dagen nadat het voornemen daartoe schriftelijk ter kennis is
      gebracht van de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.4
    text: |-
      Indien binnen de in het derde lid genoemde termijn van 30 dagen ten minste een vijfde van het grondwettelijk aantal
      leden van de Tweede Kamer der Staten-Generaal nadere inlichtingen vraagt, wordt het besluit niet genomen dan 14
      dagen nadat de inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.5
    text: |-
      Het derde en vierde lid zijn niet van toepassing op het intrekken van een eerder genomen besluit tot het aanwijzen
      van een dienstonderdeel als baten-lastenagentschap of verplichtingen-kasagentschap.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.6
    text: |-
      Een dienstonderdeel van een ministerie dat krachtens het eerste lid, als baten-lastenagentschap is aangewezen, past
      als begrotingsstelsel het baten-lastenstelsel toe.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.7
    text: |-
      Een dienstonderdeel van een ministerie dat krachtens het eerste lid als verplichtingen-kasagentschap is aangewezen,
      past als begrotingsstelsel het verplichtingen-kasstelsel toe.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.20.8
    text: |-
      Een dienstonderdeel van een ministerie dat krachtens het eerste lid als verplichtingen-kasagentschap is aangewezen,
      kan een kasreserve aanhouden.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.20
  - number: 2.21.1
    text: |-
      Een dienstonderdeel van een ministerie dat niet krachtens [artikel 2.20][ref1] als agentschap is aangewezen,
      kan in overeenstemming met Onze Minister van Financiën ten laste van een begrotingsartikel een begrotingsreserve
      aanhouden.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.21
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.21.2
    text: 'De toelichting van het begrotingsartikel ten laste waarvan een begrotingsreserve wordt aangehouden bevat:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.21
  - number: 2.21.2.a
    text: de motieven voor het aanhouden van de begrotingsreserve;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.21
  - number: 2.21.2.b
    text: de verwachte omvang van de begrotingsreserve aan het begin van het begrotingsjaar;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.21
  - number: 2.21.2.c
    text: indien mogelijk, de in het begrotingsjaar verwachte toevoeging en onttrekking aan de reserve.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.21
  - number: '2.22'
    text: |-
      Onze Minister van Financiën en Onze Minister die het mede aangaat bieden het stabiliteitsprogramma,
      onderscheidenlijk het nationaal hervormingsprogramma, jaarlijks aan de Kamers der Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.22
  - number: 2.23.1
    text: |-
      Wij dienen de voorstellen van wet tot vaststelling van de begrotingsstaten op de derde dinsdag van september van
      het jaar voorafgaande aan het begrotingsjaar bij de Tweede Kamer der Staten-Generaal in.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.23
  - number: 2.23.2
    text: |-
      In afwijking van het eerste lid kunnen Wij Onze Minister van Financiën machtigen de voorstellen van wet tot
      vaststelling van de begrotingsstaten bij de Tweede Kamer der Staten-Generaal in te dienen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.23
  - number: 2.23.3
    text: |-
      Onze Minister van Financiën biedt op de dag van de indiening van de voorstellen van wet tot vaststelling van de
      begrotingsstaten de Miljoenennota aan de Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.23
  - number: 2.23.4
    text: 'De Miljoenennota bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.23
  - number: 2.23.4.a
    text: |-
      het budgettaire totaalbeeld voor het betrokken begrotingsjaar en de vier daaropvolgende jaren van de rijksbegroting
      en de niet tot de rijksbegroting behorende budgetdisciplinesectoren;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.23
  - number: 2.23.4.b
    text: de budgettaire beschouwingen over het voorgenomen beleid voor de collectieve sector;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.23
  - number: 2.23.4.c
    text: |-
      een overzicht van de uitgaven en de ontvangsten in de begrotingen voor het begrotingsjaar en de vier daarop
      aansluitende jaren.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.23
  - number: '2.24'
    text: |-
      De voorstellen van wet tot vaststelling van de begrotingsstaten voorzien in een bepaling die de inwerkingtreding
      regelt. Deze bepaling bepaalt de inwerkingtreding op 1 januari van het jaar waarop de begrotingsstaten betrekking
      hebben.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.24
  - number: 2.25.1
    text: |-
      Zolang een voorstel van wet tot vaststelling van een begrotingsstaat niet tot wet is verheven en in werking is
      getreden, wordt lopend beleid dat ten grondslag ligt aan die begrotingsstaat met terughoudendheid in uitvoering
      genomen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.25
  - number: 2.25.2
    text: |-
      Zolang een voorstel van wet tot vaststelling van een begrotingsstaat niet tot wet is verheven en in werking is
      getreden, wordt nieuw beleid dat ten grondslag ligt aan die begrotingsstaat, niet in uitvoering genomen, tenzij
      uitstel van de uitvoering naar het oordeel van Onze Minister die het aangaat niet in het belang van het Rijk is en
      hij de Staten-Generaal daarover heeft geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.25
  - number: 2.26.1
    text: |-
      Wij dienen in elk geval uiterlijk op 1 juni en op 1 december van het begrotingsjaar de voorstellen van wet tot
      wijziging van de begrotingsstaten bij de Tweede Kamer der Staten-Generaal in.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
  - number: 2.26.2
    text: |-
      In afwijking van het eerste lid kunnen Wij Onze Minister van Financiën machtigen de voorstellen van wet tot
      wijziging van de begrotingsstaten bij de Tweede Kamer der Staten-Generaal in te dienen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
  - number: 2.26.3
    text: |-
      Onze Minister van Financiën biedt uiterlijk op 1 juni en op 1 december van het begrotingsjaar de Voorjaarsnota,
      respectievelijk de Najaarsnota, aan de Staten-Generaal aan.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
  - number: 2.26.4
    text: 'De Voorjaarsnota bevat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
  - number: 2.26.4.a
    text: |-
      de wijziging van het budgettaire totaalbeeld, bedoeld in [artikel 2.23, vierde lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.4.b
    text: |-
      een overzicht van de wijzigingen in de uitgaven en de ontvangsten in de begrotingen voor het begrotingsjaar en de
      vier daarop aansluitende jaren.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
  - number: 2.26.5
    text: 'De Najaarsnota bevat in aansluiting op de Voorjaarsnota in elk geval:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
  - number: 2.26.5.a
    text: |-
      de wijziging van het budgettaire totaalbeeld, bedoeld in [artikel 2.23, vierde lid, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.26.5.b
    text: een overzicht van de nadere wijzigingen in de uitgaven en de ontvangsten in de begrotingen voor het begrotingsjaar.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.26
  - number: 2.27.1
    text: |-
      Zolang een voorstel van wet tot wijziging van een begrotingsstaat niet tot wet is verheven en in werking is
      getreden, wordt lopend beleid dat ten grondslag ligt aan die wijziging met terughoudendheid in uitvoering genomen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.27
  - number: 2.27.2
    text: |-
      Zolang een voorstel van wet tot wijziging van een begrotingsstaat niet tot wet is verheven en in werking is
      getreden, wordt nieuw beleid dat ten grondslag ligt aan die wijziging, niet in uitvoering genomen, tenzij uitstel
      van de uitvoering naar het oordeel van Onze Minister die het aangaat niet in het belang is van het Rijk en hij de
      Staten-Generaal daarover heeft geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.27
  - number: '2.28'
    text: |-
      Onze Ministers, ieder met betrekking tot het beleid waarvoor hij verantwoordelijk is, zenden jaarlijks in december,
      uiterlijk drie dagen voor aanvang van het reces van de Tweede Kamer der Staten-Generaal, aan beide Kamers der
      Staten-Generaal, een overzicht van majeure wijzigingen in de uitgaven, verplichtingen en de ontvangsten van het
      begrotingsjaar, die niet zijn opgenomen in de op grond van [artikel 2.26][ref1] uiterlijk op 1 december in te
      dienen voorstellen van wet.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.28
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: 2.29.1
    text: 'Tot de verantwoording van het Rijk behoren:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.29
  - number: 2.29.1.a
    text: |-
      de jaarverslagen, bedoeld in [artikel 2.31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.29.1.b
    text: |-
      het Financieel jaarverslag van het Rijk, bedoeld in [artikel 2.35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.29
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.29.2
    text: |-
      Onze Ministers, ieder met betrekking tot de begroting waarvoor hij verantwoordelijk is, stellen na afloop van een
      begrotingsjaar een jaarverslag op.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.29
  - number: 2.29.3
    text: Onze Minister van Financiën stelt na afloop van een begrotingsjaar het Financieel jaarverslag van het Rijk op.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.29
  - number: '2.30'
    text: |-
      Onze Ministers, ieder met betrekking tot de begroting waarvoor hij verantwoordelijk is, stellen na afloop van een
      begrotingsjaar de slotverschillen op.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.30
  - number: '2.31'
    text: 'Een jaarverslag bestaat in elk geval uit:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.31
  - number: 2.31.a
    text: een uiteenzetting over het gevoerde beleid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.31
  - number: 2.31.b
    text: een uiteenzetting over de gevoerde bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.31
  - number: 2.31.c
    text: een verantwoordingsstaat, voorzien van een toelichting per artikel;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.31
  - number: 2.31.d
    text: |-
      indien van toepassing, een financiële staat van een agentschap als bedoeld in [artikel 2.33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.31.e
    text: een saldibalans, voorzien van een toelichting.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.31
  - number: 2.32.1
    text: De verantwoordingsstaat wordt op basis van het van toepassing zijnde begrotingsstelsel opgesteld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.32.2
    text: |-
      De verantwoordingsstaat bevat, in de volgorde van de begrotingsartikelen in de begrotingsstaat, per
      begrotingsartikel in elk geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.32.2.a
    text: het artikelnummer;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.32.2.b
    text: de artikelomschrijving;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.32.2.c
    text: |-
      het bedrag dat voor financiële verplichtingen in de begrotingsstaat behorende bij de wet tot vaststelling van de
      begrotingsstaten is vastgesteld, met daarnaast opgenomen het gerealiseerde bedrag;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.32.2.d
    text: |-
      het bedrag dat voor kasuitgaven in de begrotingsstaat behorende bij de wet tot vaststelling van de begrotingsstaten
      is vastgesteld, met daarnaast opgenomen het gerealiseerde bedrag;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.32.2.e
    text: |-
      het bedrag dat aan kasontvangsten in de begrotingsstaat behorende bij de wet tot vaststelling van de
      begrotingsstaten is vastgesteld, met daarnaast opgenomen het gerealiseerde bedrag.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.32.3
    text: |-
      Het gerealiseerde bedrag voor de uitgaven dat wordt opgenomen in de verantwoordingsstaat bij het begrotingsartikel
      *Nog onverdeeld* is nihil.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.32
  - number: 2.33.1
    text: |-
      Een agentschap heeft een afzonderlijke financiële staat die wordt opgenomen bij de verantwoordingsstaat van het
      ministerie waaronder het agentschap ressorteert.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.33
  - number: 2.33.2
    text: De financiële staat van een agentschap wordt opgesteld op basis van het van toepassing zijnde begrotingsstelsel.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.33
  - number: 2.33.3
    text: |-
      De financiële staat van een agentschap bevat de bedragen die in de financiële staat, bedoeld in
      [artikel 2.6][ref1], bij de wet tot vaststelling van de begrotingsstaten zijn vastgesteld met daarnaast opgenomen
      de gerealiseerde bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.33
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.34.1
    text: |-
      De saldibalans bevat in elk geval de saldi, zoals deze aan het eind van het begrotingsjaar uit de financiële
      administratie blijken, van:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
  - number: 2.34.1.a
    text: de kasuitgaven en de kasontvangsten die binnen en buiten begrotingsverband zijn geboekt;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
  - number: 2.34.1.b
    text: |-
      de kasreserves, bedoeld in [artikel 2.20, achtste lid][ref1], en de begrotingsreserves, bedoeld in
      [artikel 2.21, tweede lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.34.1.c
    text: de openstaande financiële verplichtingen ten aanzien van derden met uitzondering van de garantieverplichtingen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
  - number: 2.34.1.d
    text: de garantieverplichtingen ten aanzien van derden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
  - number: 2.34.1.e
    text: de vorderingen en de schulden ten aanzien van derden met inbegrip van de voorschotten;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
  - number: 2.34.1.f
    text: de departementale kassen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
  - number: 2.34.2
    text: |-
      De toelichting bij de saldibalans biedt inzicht in de mutaties in de saldi ten opzichte van de stand van die saldi
      in de voorafgaande saldibalans.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.34
  - number: 2.35.1
    text: 'Het Financieel jaarverslag van het Rijk bevat met betrekking tot het begrotingsjaar in elk geval:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.1.a
    text: |-
      het gerealiseerde budgettaire totaalbeeld van de rijksbegroting en de niet tot de rijksbegroting behorende
      budgetdisciplinesectoren;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.1.b
    text: een uiteenzetting over het financieel beheer van de ministeries en de colleges;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.1.c
    text: de rijksrekening;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.1.d
    text: de rijkssaldibalans.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.2
    text: 'De rijksrekening is het verantwoordingsoverzicht van het Rijk, waarin per begroting zijn opgenomen:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.2.a
    text: |-
      de totaalbedragen van alle geraamde uitgaven en ontvangsten, zoals deze in de wet tot vaststelling van de
      begrotingsstaten zijn vastgesteld;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.2.b
    text: de totaalbedragen van alle gerealiseerde uitgaven en ontvangsten, zoals deze uit de verantwoordingsstaten blijken;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.2.c
    text: het verschil tussen de bedragen, bedoeld onder a en b.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.3
    text: |-
      De uitgaven en ontvangsten, bedoeld in het tweede lid, worden opgenomen op basis van het begrotingsstelsel dat voor
      die uitgaven en ontvangsten geldt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
  - number: 2.35.4
    text: |-
      De rijkssaldibalans is het verantwoordingsoverzicht van het Rijk, waarin in elk geval de totaalbedragen van alle
      saldibalansen, bedoeld in [artikel 2.31, eerste lid, onder e][ref1], en de saldi, bedoeld in [artikel 2.34][ref2],
      zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.35
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '2.36'
    text: De slotverschillen worden per begrotingsstaat bij wet vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.36
  - number: 2.37.1
    text: |-
      Onze Minister van Financiën zendt de jaarverslagen, bedoeld in [artikel 2.31][ref1], jaarlijks uiterlijk op
      31 maart van het jaar volgend op het begrotingsjaar voor onderzoek naar de Algemene Rekenkamer. De rapporten over
      de jaarverslagen die zijn opgesteld door de Auditdienst Rijk worden gelijktijdig meegestuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.37.2
    text: |-
      Onze Minister van Financiën biedt de door de Algemene Rekenkamer onderzochte jaarverslagen op de derde woensdag
      van mei volgend op het jaar waarop de jaarverslagen betrekking hebben aan de Tweede Kamer der Staten-Generaal
      aan, tenzij deze datum valt in een periode wanneer de Tweede Kamer der Staten-Generaal met reces is of wanneer
      een nationale feestdag is. In dat geval biedt Onze Minister van Financiën de jaarverslagen, na overleg met de
      voorzitter van de Tweede Kamer der Staten-Generaal en de president van de Algemene Rekenkamer, uiterlijk op 1 juni
      van hetzelfde jaar aan.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.37
  - number: 2.37.3
    text: |-
      In voorkomende gevallen zendt Onze Minister die het aangaat zijn standpunt over het bezwaar van de Algemene
      Rekenkamer, bedoeld in [artikel 7.22, eerste lid][ref1], zo spoedig mogelijk, doch in elk geval vóór de behandeling
      van het jaarverslag door de Tweede Kamer der Staten-Generaal, naar die Kamer.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.38.1
    text: |-
      Onze Minister van Financiën zendt het Financieel jaarverslag van het Rijk, bedoeld in [artikel 2.35][ref1],
      uiterlijk op 21 april van het jaar volgend op het begrotingsjaar voor onderzoek naar de Algemene Rekenkamer. Het
      rapport over het jaarverslag dat is opgesteld door de Auditdienst Rijk wordt gelijktijdig meegestuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 2.38.2
    text: |-
      Onze Minister van Financiën biedt het door de Algemene Rekenkamer onderzochte Financieel jaarverslag van het Rijk
      op de derde woensdag van mei volgend op het jaar waarop het begrotingsjaar betrekking heeft aan de Staten-Generaal
      aan, tenzij deze datum valt in een periode wanneer de Tweede Kamer der Staten-Generaal met reces is of wanneer
      een nationale feestdag is. In dat geval biedt Onze Minister van Financiën het Financieel jaarverslag van het Rijk,
      na overleg met de voorzitter van de Tweede Kamer der Staten-Generaal en de president van de Algemene Rekenkamer,
      uiterlijk op 1 juni van hetzelfde jaar aan.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.38
  - number: 2.39.1
    text: |-
      Wij dienen op de derde woensdag van mei volgend op het jaar waarop de begrotingsstaten betrekking hebben de
      voorstellen van wet tot vaststelling van de slotverschillen bij de Tweede Kamer der Staten-Generaal in, tenzij
      deze datum valt in een periode wanneer de Tweede Kamer der Staten-Generaal met reces is of wanneer een nationale
      feestdag is. In dat geval dienen Wij de voorstellen van wet, na overleg met de voorzitter van de Tweede Kamer der
      Staten-Generaal en de president van de Algemene Rekenkamer, uiterlijk op 1 juni van hetzelfde jaar in.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.39
  - number: 2.39.2
    text: |-
      In afwijking van het eerste lid kunnen Wij Onze Minister van Financiën machtigen de voorstellen van wet tot
      vaststelling van de slotverschillen bij de Tweede Kamer der Staten-Generaal in te dienen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.39
  - number: 2.40.1
    text: |-
      Decharge aan Onze Ministers, ieder met betrekking tot het door hem gevoerde financieel beheer, wordt verleend
      aan de hand van het betrokken jaarverslag door een daartoe strekkende uitspraak van elk van de Kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.40
  - number: 2.40.2
    text: |-
      Decharge wordt niet eerder verleend dan nadat de verklaring van goedkeuring van de Algemene Rekenkamer, bedoeld
      in [artikel 7.14, tweede lid][ref1], is ontvangen en het voorstel van wet tot vaststelling van de slotverschillen,
      bedoeld in [artikel 2.39][ref2], en in voorkomende gevallen een voorstel van een indemniteitswet als bedoeld in
      [artikel 7.22, derde lid][ref3], zijn aangenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 2.40.3
    text: |-
      Nadat de Tweede Kamer der Staten-Generaal decharge heeft verleend, plaatst de voorzitter van die Kamer op
      het betrokken jaarverslag een aantekening, waaruit de verlening van de decharge en de datum waarop die heeft
      plaatsgevonden, blijken. De voorzitter van de Tweede Kamer der Staten-Generaal zendt het jaarverslag vervolgens aan
      de voorzitter van de Eerste Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.40
  - number: 2.40.4
    text: |-
      Nadat de Eerste Kamer der Staten-Generaal decharge heeft verleend, plaatst de voorzitter van die Kamer op
      het betrokken jaarverslag een aantekening, waaruit de verlening van de decharge en de datum waarop die heeft
      plaatsgevonden, blijken. De voorzitter van de Eerste Kamer der Staten-Generaal zendt het jaarverslag vervolgens aan
      Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel2.40
  - number: '3.1'
    text: 'Voorstellen, voornemens en toezeggingen bevatten een toelichting waarin wordt ingegaan op:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.1
  - number: 3.1.a
    text: de doelstellingen, de doeltreffendheid en de doelmatigheid die worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.1
  - number: 3.1.b
    text: de beleidsinstrumenten die worden ingezet;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.1
  - number: 3.1.c
    text: de financiële gevolgen voor het Rijk en, waar mogelijk, de financiële gevolgen voor maatschappelijke sectoren.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.1
  - number: '3.2'
    text: |-
      Onze Ministers en de colleges zijn verantwoordelijk voor de ordelijkheid en controleerbaarheid van het
      begrotingsbeheer.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.2
  - number: '3.3'
    text: |-
      Onze Ministers en de colleges zijn verantwoordelijk voor de doelmatigheid, rechtmatigheid, ordelijkheid en
      controleerbaarheid van het financieel beheer.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.3
  - number: '3.4'
    text: |-
      Onze Ministers en de colleges zijn verantwoordelijk voor de doelmatigheid, rechtmatigheid, ordelijkheid en
      controleerbaarheid van het verwerven, het beheren en het afstoten van materieel.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.4
  - number: 3.5.1
    text: Financiële administraties worden betrouwbaar en controleerbaar ingericht en gevoerd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.5
  - number: 3.5.2
    text: |-
      De financiële administratie wordt zodanig ingericht dat daaraan de financiële informatie kan
      worden ontleend die krachtens het in [hoofdstuk 2][ref1] bepaalde en de nadere regels, bedoeld in
      [artikel 4.20, eerste lid, aanhef en onder a tot en met c][ref2], in de begroting en het jaarverslag wordt
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0039429
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '3.6'
    text: 'Financiële begrotingsinformatie voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.6
  - number: 3.6.a
    text: de norm van betrouwbaarheid en ordelijkheid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.6
  - number: 3.6.b
    text: |-
      de regels voor het inrichten van de rijksbegroting, bedoeld in
      [artikel 4.20, eerste lid, aanhef en onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: '3.7'
    text: 'Voor niet-financiële begrotingsinformatie geldt dat deze:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.7
  - number: 3.7.a
    text: voldoet aan de norm van betrouwbare totstandkoming;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.7
  - number: 3.7.b
    text: niet strijdig is met de financiële begrotingsinformatie.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.7
  - number: 3.8.1
    text: 'Financiële verantwoordingsinformatie voldoet aan:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.8
  - number: 3.8.1.a
    text: de norm van betrouwbaarheid en ordelijkheid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.8
  - number: 3.8.1.b
    text: de norm van rechtmatigheid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.8
  - number: 3.8.1.c
    text: |-
      de regels voor het inrichten van de jaarverslagen, bedoeld in [artikel 4.20, eerste lid, aanhef en onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 3.8.2
    text: |-
      De financiële verantwoordingsinformatie in de rijksrekening en de rijkssaldibalans van het Financieel
      jaarverslag van het Rijk, bedoeld in [artikel 2.35, tweede en vierde lid][ref1], sluit aan op de financiële
      verantwoordingsinformatie in de verantwoordingsstaten en de saldibalansen van de jaarverslagen, bedoeld in
      [artikel 2.31][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '3.9'
    text: 'Voor niet-financiële verantwoordingsinformatie geldt dat deze:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.9
  - number: 3.9.a
    text: voldoet aan de norm van betrouwbare totstandkoming;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.9
  - number: 3.9.b
    text: niet strijdig is met de financiële verantwoordingsinformatie.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.9
  - number: '3.10'
    text: |-
      Onze Minister van Financiën stelt regels met betrekking tot de normen die gelden voor het rapporteren van fouten en
      onzekerheden in de financiële verantwoordingsinformatie in de jaarverslagen, bedoeld in [artikel 2.31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 4.1.1
    text: |-
      Onze Ministers, ieder met betrekking tot het beleid dat aan zijn begroting ten grondslag ligt, zijn
      verantwoordelijk voor:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.1.a
    text: het ontwikkelen, vaststellen en uitvoeren van het beleid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.1.b
    text: het toezicht houden op het uitvoeren van het beleid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.1.c
    text: het periodiek onderzoeken van de doeltreffendheid en doelmatigheid van het beleid;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.1.d
    text: de in de begroting opgenomen informatie;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.1.e
    text: de in het jaarverslag opgenomen informatie.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.2
    text: |-
      Onze Ministers die belast zijn met de leiding van een ministerie, ieder met betrekking tot de begroting waarvoor
      hij verantwoordelijk is, zijn verantwoordelijk voor:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.2.a
    text: de bedrijfsvoering van het ministerie;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.2.b
    text: het periodiek onderzoeken van de doeltreffendheid en doelmatigheid van die bedrijfsvoering;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.2.c
    text: het begrotingsbeheer en de daartoe gevoerde administraties;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.2.d
    text: het financieel beheer en de daartoe gevoerde administraties;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.1.2.e
    text: het materieelbeheer voor zover dat betrekking heeft op roerende zaken en de daartoe gevoerde administraties.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.1
  - number: 4.2.1
    text: |-
      Indien Onze Minister het beleid dat aan zijn begroting ten grondslag ligt niet zelf uitvoert, daarop toezicht
      houdt of de bedrijfsvoering verzorgt, draagt hij zorg voor het verkrijgen van de informatie die nodig is voor het
      afleggen van verantwoording in het jaarverslag, bedoeld in [artikel 2.31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 4.2.2
    text: |-
      Indien een organisatie die niet tot het Rijk behoort direct, indirect of voorwaardelijk een financiële bijdrage
      ontvangt uit verschillende begrotingen als bedoeld in [artikel 2.1][ref1] dan wordt de informatie, bedoeld in het
      eerste lid, in afwijking van [artikel 2.31][ref2] opgenomen in het jaarverslag van Onze Minister die als eerste
      verantwoordelijk is voor de bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 4.2.3
    text: |-
      Indien bij of krachtens de wet aan de ontvanger van de financiële bijdrage, bedoeld in het tweede lid, geen
      jaarlijkse verantwoording verplicht is gesteld, volstaat Onze Minister die het aangaat met het opnemen in het
      jaarverslag van de verantwoordingsinformatie die volgens het wettelijk voorschrift door de ontvanger aan Onze
      Minister die het aangaat wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.2
  - number: 4.3.1
    text: Onze Minister van Algemene Zaken is verantwoordelijk voor het beheer van de begroting van de Koning.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.3
  - number: 4.3.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is verantwoordelijk voor het beheer van de begroting
      van koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.3
  - number: 4.3.3
    text: Onze Minister van Financiën is verantwoordelijk voor het beheer van de begroting van Nationale Schuld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.3
  - number: 4.4.1
    text: |-
      Onze Minister van Algemene Zaken is verantwoordelijk voor het beheer van de begrotingen van het Kabinet van de
      Koning en de Commissie van toezicht betreffende de inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.4
  - number: 4.4.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties is verantwoordelijk voor het beheer van de begrotingen
      van de Staten-Generaal, de Raad van State, de Algemene Rekenkamer, de Nationale ombudsman, de Kanselarij der
      Nederlandse Orden, het Kabinet van de Gouverneur van Aruba, het Kabinet van de Gouverneur van Curaçao, het Kabinet
      van de Gouverneur van Sint Maarten en de Kiesraad.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.4
  - number: 4.4.3
    text: |-
      De colleges zijn belast met het begrotingsbeheer, het financieel beheer, de materiële bedrijfsvoering en de daartoe
      gevoerde administraties.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.4
  - number: 4.4.4
    text: |-
      Onze Ministers die het aangaan maken met de colleges over het beheer van hun begrotingen afspraken, waarin recht
      wordt gedaan aan de staatsrechtelijke positie van de colleges.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.4
  - number: 4.5.1
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties overlegt jaarlijks met elk van de Kamers der Staten-
      Generaal over de door de Kamers opgestelde ramingen van de uitgaven en de ontvangsten ten behoeve van hun
      taakuitvoering.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.5
  - number: 4.5.2
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties neemt de ramingen, zoals opgesteld door de Kamers der
      Staten-Generaal, op in het voorstel van wet tot vaststelling van de begrotingsstaten van de Staten-Generaal, tenzij
      een evident zwaarwegende reden zich hiertegen verzet.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.5
  - number: 4.5.3
    text: |-
      Indien Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties ramingen wegens evident zwaarwegende redenen
      niet of niet geheel opneemt, dan licht hij dit gemotiveerd toe.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.5
  - number: 4.6.1
    text: |-
      Onze Ministers, ieder met betrekking tot de begroting waarvoor hij verantwoordelijk is, verrichten namens de
      Staat de privaatrechtelijke rechtshandelingen die voortvloeien uit het beleid en de bedrijfsvoering die aan hun
      begrotingen ten grondslag liggen, tenzij bij of krachtens de wet is bepaald dat een van Onze andere Ministers de
      rechtshandeling verricht.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.6
  - number: 4.6.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de colleges elk met betrekking tot de uitvoering van de taak
      waarvoor het verantwoordelijk is.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.6
  - number: 4.6.3
    text: |-
      Onverminderd [artikel 4.18, aanhef en onder b][ref1], kunnen Onze Ministers een overeenkomst tot het aangaan van
      een geldlening namens de Staat sluiten voor zover Onze Minister van Financiën daaraan zijn medewerking verleent in
      de vorm van het mede verrichten van de privaatrechtelijke rechtshandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.6
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 4.7.1
    text: |-
      De volgende privaatrechtelijke rechtshandelingen worden niet eerder door de Staat verricht dan 30 dagen, nadat het
      voornemen daartoe schriftelijk ter kennis is gebracht van de Kamers der Staten-Generaal:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.1.a
    text: het oprichten, mede oprichten of doen oprichten van een privaatrechtelijke rechtspersoon;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.1.b
    text: |-
      het verstrekken aan een privaatrechtelijke rechtspersoon van eigen vermogen, leningen met wezenlijke kenmerken van
      eigen vermogen of garanties ten aanzien van de omvang van het eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.1.c
    text: |-
      het overnemen van schuldtitels of aandelen van een privaatrechtelijke rechtspersoon die door een derde worden
      gehouden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.1.d
    text: |-
      het overnemen van risico’s van financiële activa van een privaatrechtelijke rechtspersoon, indien dat overnemen
      bedoeld is ter versterking van de solvabiliteit van de privaatrechtelijke rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.2
    text: |-
      Indien binnen de in het eerste lid genoemde termijn van 30 dagen ten minste een vijfde van het grondwettelijk
      aantal leden van een van de Kamers der Staten-Generaal nadere inlichtingen vraagt, wordt de privaatrechtelijke
      rechtshandeling niet verricht dan 14 dagen nadat de inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.3
    text: |-
      De procedure, bedoeld in het eerste lid, is niet van toepassing op een voornemen tot het verrichten van een
      privaatrechtelijke rechtshandeling als bedoeld in het eerste lid, aanhef en onder a tot en met d, indien:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.3.a
    text: een wettelijke regeling voorziet in een rechtsgrond voor het verrichten van die rechtshandeling;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.3.b
    text: |-
      de rechtshandeling ziet op het verstrekken van eigen vermogen dat voortvloeit uit een eerder verstrekte garantie
      als bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.3.c
    text: |-
      de rechtshandeling ziet op het deelnemen in het aandelenkapitaal van een vennootschap waarbij de handeling niet ten
      doel heeft het relatieve belang van de Staat in het eigen vermogen van de betrokken rechtspersoon te verhogen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.3.d
    text: het volgen van de voorhangprocedure in strijd is met een wettelijke regeling;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.3.e
    text: |-
      met de rechtshandeling een geringer financieel belang is gemoeid dan de door Onze Minister van Financiën vast te
      stellen bedragen die betrekking hebben op de rechtshandelingen, bedoeld in het eerste lid, onder a tot en met d.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.7.4
    text: |-
      Onze Minister die het aangaat voert overleg met de Algemene Rekenkamer over een voornemen tot het verrichten
      van een privaatrechtelijke rechtshandeling als bedoeld in het eerste lid, onderdeel a. Onze Minister die het
      aangaat verbindt een redelijke termijn aan het overleg met de Algemene Rekenkamer. Na het overleg met de Algemene
      Rekenkamer legt Onze Minister die het aangaat het voorgenomen besluit aan de ministerraad voor.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.7
  - number: 4.8.1
    text: |-
      Onze Minister van Financiën informeert de Kamers der Staten-Generaal jaarlijks over het beleid en het gevoerde
      beleid met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.8
  - number: 4.8.1.a
    text: |-
      het verwerven, het bezit en het vervreemden van vermogen in privaatrechtelijke rechtspersonen, indien aan dat
      vermogen wezenlijke kenmerken van eigen vermogen zijn verbonden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.8
  - number: 4.8.1.b
    text: |-
      het overnemen, het beheer en het afstoten van risico’s van financiële activa, bedoeld in
      [4.7, eerste lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.8
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 4.8.2
    text: |-
      De verstrekte informatie bevat met betrekking tot het vervreemden van vermogen als bedoeld in het eerste lid, onder
      a, en het overdragen van risico’s als bedoeld in het eerste lid, onderdeel b, in elk geval de daarbij te hanteren
      of gehanteerde uitgangspunten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.8
  - number: 4.8.3
    text: |-
      Onze Minister van Financiën vermeldt de gerealiseerde afstoting van de belangen, bedoeld in het tweede lid, in zijn
      departementale jaarverslag.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.8
  - number: '4.9'
    text: |-
      De geldigheid van privaatrechtelijke rechtshandelingen door de Staat wordt niet aangetast, indien de bij
      of krachtens deze wet gestelde regels niet worden nageleefd, tenzij het betreft het niet naleven van de
      regels over de bevoegdheid van de handelende personen, gesteld bij of krachtens de [artikelen 4.6][ref1] en
      [4.18, aanhef en onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.9
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 4.10.1
    text: |-
      Voor de toepassing van dit artikel wordt onder subsidieregeling verstaan een wet, algemene maatregel van
      bestuur of ministeriële regeling op grond waarvan voor de in die regeling bedoelde activiteiten op aanvraag
      en met inachtneming van de in die regeling opgenomen voorschriften een subsidie wordt verstrekt, waarop
      [titel 4.2 van de Algemene wet bestuursrecht][ref1] van toepassing is en waarvan de verstrekking als een subsidie
      is aangemerkt in de begroting, bedoeld in [artikel 2.1][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4.10.2
    text: |-
      Een subsidieregeling bevat een tijdstip waarop de regeling vervalt. Dit tijdstip valt niet later dan vijf jaren na
      de inwerkingtreding van de regeling. Een subsidieregeling die bij de inwerkingtreding van deze wet geen tijdstip
      kent waarop de regeling vervalt, wordt voor zover het een wet betreft binnen twee jaar na de inwerkingtreding van
      deze wet van een dergelijk tijdstip voorzien.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.10.3
    text: |-
      In afwijking van het tweede lid, tweede volzin, kan een subsidieregeling een tijdstip bevatten waarop
      de subsidieregeling vervalt, dat is gelegen later dan vijf jaren, doch niet later dan tien jaren, na de
      inwerkingtreding van de subsidieregeling, indien:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.10.3.a
    text: |-
      uit de toelichting van de subsidieregeling blijkt dat het vervallen van de regeling binnen vijf jaren na
      inwerkingtreding ervan, gelet op de activiteiten waarvoor de subsidie wordt verstrekt, afbreuk doet aan de
      effectiviteit van die activiteiten, en
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.10.3.b
    text: |-
      door Onze Minister die het aangaat gedurende de looptijd van de subsidieregeling een verslag over de
      doeltreffendheid en de doelmatigheid van de subsidie aan de Tweede Kamer der Staten-Generaal wordt gezonden.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.10.4
    text: |-
      Een subsidieregeling die een tijdstip als bedoeld in het derde lid bevat, wordt voor zover die subsidieregeling een
      algemene maatregel van bestuur of een ministeriële regeling betreft niet eerder vastgesteld dan 30 dagen nadat het
      ontwerp van die subsidieregeling schriftelijk ter kennis is gebracht van de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.10.5
    text: |-
      Indien binnen de in het vierde lid genoemde termijn van 30 dagen ten minste een vijfde van het grondwettelijk
      aantal leden van de Tweede Kamer der Staten-Generaal nadere inlichtingen vraagt, wordt de subsidieregeling, bedoeld
      in het vierde lid, niet vastgesteld dan 14 dagen nadat de inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.10.6
    text: |-
      Een subsidieregeling die strekt tot het verstrekken van subsidie onder hoofdzakelijk dezelfde voorwaarden voor
      overwegend dezelfde activiteiten als van een vervallen subsidieregeling als bedoeld in het tweede lid, wordt voor
      zover die subsidieregeling een algemene maatregel van bestuur of een ministeriële regeling betreft, niet eerder
      vastgesteld dan 30 dagen nadat het ontwerp van die subsidieregeling schriftelijk ter kennis is gebracht van de
      Tweede Kamer der Staten-Generaal. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.10.7
    text: |-
      Een subsidieregeling die strekt tot wijziging van het tijdstip waarop een subsidieregeling vervalt, wordt voor
      zover die subsidieregeling een algemene maatregel van bestuur of een ministeriële regeling betreft, niet eerder
      vastgesteld dan 30 dagen nadat het ontwerp van die subsidieregeling schriftelijk ter kennis is gebracht van de
      Tweede Kamer der Staten-Generaal. Het vijfde lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.10
  - number: 4.11.1
    text: 'Onze Minister van Financiën is met betrekking tot het Rijk belast met de coördinatie van:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.11
  - number: 4.11.1.a
    text: het begrotings- en het verantwoordingsproces;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.11
  - number: 4.11.1.b
    text: het begrotingsbeheer.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.11
  - number: 4.11.2
    text: Onze Minister van Financiën bevordert de doelmatigheid van het financieel beheer van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.11
  - number: 4.12.1
    text: Onze Minister van Financiën is belast met het toezicht op het begrotingsbeheer van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.12
  - number: 4.12.2
    text: |-
      Onze Minister van Financiën kan voorafgaand financieel toezicht instellen. Dit toezicht houdt in dat hij
      begrotingsartikelen aanwijst ten laste waarvan bepaalde financiële verplichtingen niet mogen worden aangegaan,
      voordat hij daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.12
  - number: 4.12.3
    text: |-
      Onze Minister van Financiën bepaalt welke informatie hem ten behoeve van het toezicht, bedoeld in het eerste en
      tweede lid, wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.12
  - number: 4.12.4
    text: |-
      Onze Minister van Financiën maakt tegen een ontwerpbegroting of een ontwerpwijziging van een begroting bezwaar,
      voor zover:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.12
  - number: 4.12.4.a
    text: |-
      deze niet overeenstemming is met het algemene financiële beleid of het doelmatige beheer van de financiële middelen
      van het Rijk;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.12
  - number: 4.12.4.b
    text: |-
      de in een ontwerpbegroting of ontwerpwijziging van een begroting opgenomen bedragen niet in een redelijke
      verhouding staan tot de doelstellingen van het beleid dat aan die begroting ten grondslag ligt;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.12
  - number: 4.12.4.c
    text: indien het toezicht, bedoeld in het eerste lid, hem daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.12
  - number: 4.13.1
    text: |-
      Voorstellen, niet zijnde voorstellen van wet tot vaststelling of wijziging van een begrotingsstaat, alsmede
      voornemens en toezeggingen met financiële gevolgen voor het Rijk worden door Onze Ministers niet aan de
      ministerraad of aan de Staten-Generaal aangeboden, kenbaar gemaakt dan wel gedaan, dan nadat Onze Minister van
      Financiën daarover zijn oordeel heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.13
  - number: 4.13.2
    text: |-
      [Artikel 4.12, vierde lid][ref1], is op deze voorstellen, voornemens en toezeggingen van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.13
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.14.1
    text: 'Onze Ministers en de colleges informeren Onze Minister van Financiën over voorstellen tot wijziging van:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.14
  - number: 4.14.1.a
    text: de inrichting van de begroting en het jaarverslag;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.14
  - number: 4.14.1.b
    text: de inrichting van de financiële administratie;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.14
  - number: 4.14.1.c
    text: |-
      de organisatorische inrichting van en de uitvoering van de taken door het dienstonderdeel van een ministerie dat
      belast is met financieel-economische aangelegenheden.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.14
  - number: 4.14.2
    text: |-
      Onze Ministers en de colleges brengen geen structurele wijzigingen aan in de inrichting, bedoeld in het eerste lid,
      onderdeel a, b en c, dan nadat daarover overeenstemming is bereikt met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.14
  - number: 4.15.1
    text: |-
      Onze Ministers verstrekken Onze Minister van Financiën op zijn verzoek de informatie die naar zijn oordeel
      noodzakelijk is voor de uitvoering van zijn taken, bedoeld in de [artikelen 4.11 tot en met 4.13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.15
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.15.2
    text: |-
      Onze Ministers verlenen Onze Minister van Financiën te allen tijde toegang tot dan wel inzage in alle goederen,
      administraties, documenten en andere informatiedragers.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.15
  - number: '4.16'
    text: |-
      Onze Minister van Financiën deelt Onze Ministers de bedenkingen en bezwaren mee, waartoe de informatie, bedoeld in
      de [artikelen 4.14][ref1] en [4.15][ref2], hem aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.16
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '5'
  - number: 4.17.1
    text: |-
      De aan het Rijk toebehorende en toevertrouwde gelden en geldswaardige papieren worden in de schatkist van het Rijk
      aangehouden.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.17
  - number: 4.17.2
    text: |-
      Onze Minister van Financiën is belast met het centraal beheer van de schatkist van het Rijk. Dit beheer omvat het
      beheer van de centrale kassen van het Rijk en de coördinatie van het beheer van de departementale kassen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.17
  - number: 4.17.3
    text: |-
      Onze Minister van Financiën kan aan de ambtenaren die belast zijn met het beheer van departementale kassen algemene
      aanwijzingen geven voor het beheer van die kassen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.17
  - number: 4.17.4
    text: Onze Minister van Financiën is belast met de centrale administratie van de schatkist van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.17
  - number: 4.17.5
    text: |-
      Onze Minister van Financiën neemt jaarlijks, nadat de dechargeverlening, bedoeld in [artikel 2.40][ref1] heeft
      plaatsgevonden, de saldi van de begrotingsontvangsten en de begrotingsuitgaven op de departementale en niet-
      departementale saldibalansen over in de centrale administratie van de schatkist van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.17
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '8'
  - number: '4.18'
    text: 'Onze Minister van Financiën is belast met:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.18
  - number: 4.18.a
    text: het beheer van de staatsschuld;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.18
  - number: 4.18.b
    text: |-
      het sluiten van overeenkomsten tot het aangaan van geldleningen door de staat voor de tekortfinanciering en de
      herfinanciering van aflopende geldleningen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.18
  - number: 4.19.1
    text: |-
      Onze Minister van Financiën is in afwijking van [artikel 4.1, tweede lid, aanhef en onderdeel e][ref1], belast met
      het materieelbeheer voor zover dat betrekking heeft op de overtollige roerende zaken van het Rijk.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.19
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 4.19.2
    text: Onze Minister van Financiën is belast met het afstoten van overtollige roerende zaken van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.19
  - number: 4.19.3
    text: |-
      Onze Minister van Financiën is mede belast met het beheer van de leningen en garanties die door Onze Ministers aan
      een derde zijn verstrekt met uitzondering van de leningen en garanties die bij of krachtens de wet zijn bepaald.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.19
  - number: 4.20.1
    text: 'Onze Minister van Financiën stelt voor het Rijk nadere regels over:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.1.a
    text: |-
      het inrichten van de rijksbegroting, bedoeld in [artikel 2.1][ref1], en van de verantwoording van het Rijk, bedoeld
      in [artikel 2.29][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: 4.20.1.b
    text: het begrotings- en het verantwoordingsproces;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.1.c
    text: de begrotings- en de verantwoordingsinformatie;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.1.d
    text: het begrotingsbeheer en het financieel beheer;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.1.e
    text: de financiële administratie;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.1.f
    text: het verrichten van privaatrechtelijke rechtshandelingen namens de Staat.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.2
    text: 'Onze Minister van Financiën kan voor het Rijk regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.2.a
    text: |-
      de samenstelling, de organisatie en de doelen van een periodiek interdepartementaal overleg over financieel-
      economische aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.2.b
    text: |-
      de samenstelling, de organisatie, de taken en de informatievoorziening van het adviesorgaan van een ministerie met
      betrekking tot audit- en bedrijfsvoeringsaangelegenheden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.2.c
    text: |-
      het materieelbeheer voor zover dat betrekking heeft op de roerende zaken van het Rijk en de administraties die ten
      behoeve van dat materieelbeheer worden bijgehouden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.2.d
    text: het afstoten van overtollige roerende zaken van het Rijk;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.2.e
    text: het toepassen van financiële beleidsinstrumenten;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.2.f
    text: |-
      de voorstellen, voornemens en toezeggingen, bedoeld in [artikel 3.1, aanhef][ref1], en het periodiek onderzoeken
      van de doeltreffendheid en doelmatigheid van het beleid en de bedrijfsvoering;


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel3
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 4.20.2.g
    text: de inrichting en het beheer van de agentschappen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.3
    text: |-
      De regels, bedoeld in het eerste lid, onderdelen a en c, en het tweede lid, onderdeel f, worden niet vastgesteld,
      dan nadat daarover op hoofdlijnen overleg met de Tweede Kamer der Staten-Generaal is gevoerd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.4
    text: 'Bij algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.4.a
    text: |-
      de taken en de organisatie van het dienstonderdeel van een ministerie dat belast is met financieel-economische
      aangelegenheden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.4.b
    text: de taken, de organisatie en de kwaliteitsbeheersing van de Auditdienst Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.5
    text: 'Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties kan voor het Rijk regels stellen over:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.5.a
    text: |-
      het materieelbeheer voor zover dat betrekking heeft op de onroerende zaken van het Rijk en de administraties die
      ten behoeve van dat materieelbeheer worden bijgehouden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 4.20.5.b
    text: het privaatrechtelijk beheer van de onroerende zaken van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel4.20
  - number: 5.1.1
    text: |-
      Onze Minister van Financiën wijst op grond van het bepaalde in dit hoofdstuk in overeenstemming met Onze Minister
      die het aangaat aan:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.1
  - number: 5.1.1.a
    text: |-
      de rechtspersonen die schatkistbankieren, bedoeld in de [artikelen 5.2, eerste en derde lid][ref1], en [5.4][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.1.1.b
    text: |-
      de rechtspersonen die hun liquide middelen uitzetten, bedoeld in [artikel 5.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.1.2
    text: |-
      Onze Minister van Financiën maakt de aanwijzing, bedoeld in het eerste lid, openbaar. De aanwijzing is een besluit
      als bedoeld in [artikel 1:3, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 5.2.1
    text: |-
      Een rechtspersoon met een wettelijke taak is gehouden om te schatkistbankieren, met uitzondering van de
      rechtspersonen met een wettelijke taak, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.2
    text: 'Een rechtspersoon met een wettelijke taak is niet gehouden om te schatkistbankieren, indien:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.2.a
    text: de bij of krachtens de wet geregelde taak overwegend een private taak is;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.2.b
    text: |-
      de bij of krachtens de wet geregelde taak het aantrekken van financiële middelen met als doel het uitzetten daarvan
      bij derden omvat;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.2.c
    text: |-
      de bij of krachtens de wet geregelde taak in verhouding tot de andere taken die aan de rechtspersoon zijn
      opgedragen gering is;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.2.d
    text: |-
      de liquide activa of de jaarlijkse ontvangsten van de rechtspersoon onder de door Onze Minister van Financiën te
      bepalen bedragen blijven; of
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.2.e
    text: de rechtspersoon met een wettelijke taak door Onze Minister van Financiën is uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.3
    text: |-
      Een rechtspersoon met een publieke taak is gehouden om te schatkistbankieren, indien de publieke taak van die
      rechtspersoon naar het oordeel van Onze Minister van Financiën een risicoarm beheer van de publieke liquide
      middelen verlangt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.4
    text: |-
      Het eerste en derde lid zijn niet van toepassing op de private, liquide middelen van de rechtspersoon met een
      wettelijke of publieke taak, indien die liquide middelen op een adequate wijze separaat in de jaarrekening van de
      rechtspersoon worden verantwoord.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.5
    text: |-
      Onze Minister van Financiën kan op verzoek van een rechtspersoon, bedoeld in het eerste en derde lid, bepaalde
      publieke liquide middelen van die rechtspersoon uitzonderen van de verplichting om te schatkistbankieren, indien:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.5.a
    text: de rechtspersoon de noodzaak van de uitzondering voor de bedrijfsvoering voldoende aannemelijk maakt, en
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: 5.2.5.b
    text: |-
      naar het oordeel van Onze Minister van Financiën geen afbreuk wordt gedaan aan een doelmatig en risicoarm beheer
      van liquide middelen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.2
  - number: '5.3'
    text: |-
      Indien een subsidie ten laste van de rijksbegroting door middel van voorschotbetalingen wordt verleend, kan Onze
      Minister die het aangaat in overeenstemming met Onze Minister van Financiën bepalen dat de subsidieontvanger, niet
      zijnde een natuurlijke persoon, met betrekking tot de voorschotbetalingen gehouden is om te schatkistbankieren.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.3
  - number: 5.4.1
    text: |-
      Een rechtspersoon die publieke liquide middelen beheert en een rechtspersoon met een wettelijke taak, bedoeld
      in [artikel 5.2, tweede lid, aanhef en onderdelen c tot en met e][ref1], kan op zijn verzoek schatkistbankieren,
      indien een risicoarm beheer van die middelen naar het oordeel van Onze Minister van Financiën wenselijk is. De
      rechtspersoon dient hiervoor een verzoek bij Onze Minister van Financiën in.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.4.2
    text: |-
      Het eerste lid is niet van toepassing op de private, liquide middelen van de rechtspersoon, bedoeld in het eerste
      lid, indien die liquide middelen op een adequate wijze separaat in de jaarrekening van de rechtspersoon worden
      verantwoord.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.4
  - number: 5.5.1
    text: |-
      Onverminderd het elders bij of krachtens de wet bepaalde kan Onze Minister van Financiën in overeenstemming met
      Onze Minister die het aangaat aan een rechtspersoon als bedoeld in [artikel 5.2, eerste en derde lid][ref1], een
      lening of een rekening-courantkrediet ten laste van de begroting van Nationale Schuld verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.5.2
    text: |-
      Een lening wordt verstrekt voor het financieren van investeringen in vaste activa, die benodigd zijn voor het
      uitvoeren van de wettelijke of publieke taak van de rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.5
  - number: 5.5.3
    text: |-
      Een rekening-courantkrediet wordt verstrekt voor het overbruggen van een tijdelijk liquiditeitstekort van de
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.5
  - number: 5.5.4
    text: |-
      Indien in enig jaar een rechtspersoon waaraan een lening of een rekening-courant krachtens het eerste lid is
      verstrekt in gebreke blijft de daaruit voortvloeiende verplichtingen tot het betalen van rente of aflossing na te
      komen, kan Onze Minister van Financiën het bedrag van die verplichtingen ten laste van de departementale begroting
      van Onze Minister die het aangaat overboeken naar de begroting van Nationale Schuld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.5
  - number: 5.5.5
    text: |-
      In afwijking van het vierde lid kan Onze Minister van Financiën het bedrag van de verplichtingen tot het betalen
      van rente of aflossing naar een andere begroting overboeken, indien Onze Minister die verantwoordelijk is voor het
      beheer van de andere begroting daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.5
  - number: 5.6.1
    text: |-
      Onze Minister van Financiën kan in overeenstemming met Onze Minister die het aangaat aan een rechtspersoon als
      bedoeld in [artikel 5.4][ref1], een lening of een rekening-courantkrediet ten laste van de begroting van Nationale
      Schuld verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.6.2
    text: |-
      [Artikel 5.5, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.6
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: 5.7.1
    text: |-
      Een rechtspersoon met een wettelijke taak als bedoeld in [artikel 5.2, tweede lid, aanhef en onder d en e][ref1],
      is gehouden om zijn liquide middelen uit te zetten in de vorm van producten die voldoen aan door Onze Minister van
      Financiën te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: 5.7.2
    text: |-
      Het eerste lid is niet van toepassing op de private, liquide middelen van een rechtspersoon met een wettelijke
      taak, indien die liquide middelen op een adequate wijze separaat in de jaarrekening van de rechtspersoon worden
      verantwoord.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.7
  - number: 5.7.3
    text: |-
      Dit artikel is niet van toepassing op de rechtspersonen met een wettelijke taak waarvoor door Onze Minister die het
      aangaat regels over het uitzetten van liquide middelen zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.7
  - number: 5.8.1
    text: |-
      Het aantrekken van financiële middelen door de rechtspersonen, bedoeld in de
      [artikelen 5.2, eerste en derde lid][ref1], [5.4][ref2] en [5.7][ref3], met als doel door het uitzetten ervan
      additionele financiële middelen te verwerven, is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 5.8.2
    text: |-
      Het eerste lid is niet van toepassing op de private, liquide middelen van een rechtspersoon, indien die liquide
      middelen op een adequate wijze separaat in de jaarrekening van de rechtspersoon worden verantwoord.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.8
  - number: '5.9'
    text: |-
      Onze Minister van Financiën kan nadere regels stellen over het bepaalde in de [artikelen 5.1 tot en met 5.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel5.9
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '6.1'
    text: 'Onverminderd het elders bij wet of EU-verordening bepaalde, houdt Onze Minister die het aangaat, toezicht op:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.1
  - number: 6.1.a
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een beroep
      of bedrijf uitoefenen die direct, indirect of voorwaardelijk:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.1
  - number: 6.1.a.1°
    text: |-
      een subsidie, lening, garantie of een bijdrage in natura met kenmerken van een subsidie, lening of garantie ten
      laste van de rijksbegroting hebben ontvangen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.1
  - number: 6.1.a.2°
    text: |-
      een fiscale tegemoetkoming inzake speur- en ontwikkelingswerk, een energie-investering, een milieu-investering
      of een investering in huurwoningen hebben ontvangen ten behoeve waarvan door Onze Minister die het aangaat een
      verklaring is afgegeven of een aanwijzing bij ministeriële regeling heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.1
  - number: 6.1.b
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een beroep
      of bedrijf uitoefenen en die direct, indirect of voorwaardelijk een subsidie, lening of garantie ten laste van de
      EU-begroting hebben ontvangen, voor zover aan de lidstaat van de Europese Unie het toezicht op en de controle van
      die subsidie, lening of garantie en het beheer daarvan is opgelegd;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.1
  - number: 6.1.c
    text: rechtspersonen met een wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.1
  - number: '6.2'
    text: |-
      Het toezicht, bedoeld in [artikel 6.1][ref1], is gericht op:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.2.a
    text: |-
      de naleving van de voorwaarden die aan het beheer en de verantwoording van de subsidie, lening, garantie, bijdrage
      in natura of de fiscale tegemoetkoming worden gesteld door de rechtspersonen, commanditaire vennootschappen,
      vennootschappen onder firma en natuurlijke personen, bedoeld in [artikel 6.1, onder a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.2.b
    text: |-
      de nakoming van de verplichting die aan de lidstaat van de Europese Unie is opgelegd door de rechtspersonen,
      commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen, bedoeld in
      [artikel 6.1, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.2.c
    text: |-
      de doelmatige en doeltreffende uitvoering van de wettelijke taak en de naleving van de voorwaarden die bij of
      krachtens de wet aan het beheer van de publieke financiële middelen worden gesteld door rechtspersonen met een
      wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.2
  - number: 6.3.1
    text: |-
      De rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen, bedoeld
      in [artikel 6.1, onderdeel a tot en met c][ref1], zijn gehouden op verzoek van Onze Minister die het aangaat, de
      volgende informatie te verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.3.1.a
    text: de jaarrekeningen, jaarverslagen en de aan de jaarrekeningen en jaarverslagen toegevoegde overige gegevens;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
  - number: 6.3.1.b
    text: |-
      de verantwoordingen, gegevens en documenten die nodig zijn voor de definitieve vaststelling van de subsidie,
      lening, garantie of bijdrage in natura met kenmerken van een subsidie, lening of garantie;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
  - number: 6.3.1.c
    text: de verslagen van de onderzoeken van de accountants die de bescheiden, bedoeld onder a en b, hebben gecontroleerd;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
  - number: 6.3.1.d
    text: nadere informatie die Onze Minister die het aangaat nodig acht.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
  - number: 6.3.2
    text: |-
      Indien de informatie, bedoeld in het eerste lid, naar het oordeel van Onze Minister die het aangaat daartoe
      aanleiding geeft, is Onze Minister bevoegd bij de rechtspersonen, commanditaire vennootschappen, vennootschappen
      onder firma en natuurlijke personen, bedoeld in [artikel 6.1, onder a tot en met c][ref1], nadere inlichtingen in
      te winnen of overlegging van stukken te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.3.3
    text: |-
      Onze Minister die het aangaat kan aan de hand van de administratie een onderzoek instellen bij de
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen, bedoeld in
      [artikel 6.1, onder a tot en met c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.3.4
    text: |-
      Onze Minister die het aangaat is bevoegd, voor zover hij dat nodig acht voor het uitoefenen van het toezicht,
      bedoeld in [artikel 6.1][ref1], bij alle onderdelen van de rechtspersonen, commanditaire vennootschappen,
      vennootschappen onder firma en natuurlijke personen, bedoeld in artikel 6.1, onder a tot en met c, alle goederen,
      administraties, documenten en andere informatiedragers op door hem aan te geven wijze te onderzoeken.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.3.5
    text: |-
      Onze Minister die het aangaat is bevoegd inzage te vorderen in de controleprogramma’s en dossiers van de accountant
      die de bescheiden, bedoeld in het eerste lid, onder a en b, heeft gecontroleerd om te beoordelen of in het kader
      van het toezicht, bedoeld in [artikel 6.1][ref1], kan worden gesteund op de controle die deze accountant heeft
      uitgevoerd. De accountant kan inzage in de controledossiers niet weigeren met een beroep op een bij of krachtens de
      wet opgelegde verplichting tot geheimhouding van vertrouwelijke gegevens die in de controledossiers zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 6.3.6
    text: |-
      De bevoegdheden, bedoeld in [artikel 6.3, vierde lid][ref1], worden uitgeoefend onder
      verantwoordelijkheid van een registeraccountant of een accountant-administratieconsulent
      ten aanzien van wie in het accountantsregister een aantekening is geplaatst als bedoeld in
      [artikel 36, tweede lid, onderdeel i, van de Wet op het accountantsberoep][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0032573
        artikel: '36'
  - number: 6.3.7
    text: |-
      Indien Onze Minister die het aangaat gebruik maakt van de bevoegdheden, bedoeld in het
      eerste tot en met vijfde lid, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3] en
      [5:17, tweede en derde lid, van de Algemene wet bestuursrecht][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 6.3.8
    text: |-
      Onze Minister die het aangaat kan de bevoegdheden, bedoeld in het eerste tot en met het vijfde lid, uitoefenen
      zolang als en over de jaren dat het Rijk daarbij belang heeft.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
  - number: 6.3.9
    text: |-
      Onverminderd het elders bij of krachtens de wet bepaalde, stelt Onze Minister die het aangaat, in afwijking van het
      tweede lid, geen onderzoek in ten aanzien van provincies, gemeenten, waterschappen, de openbare lichamen Bonaire,
      Sint Eustatius en Saba, openbare lichamen voor beroep en bedrijf en openbare lichamen en gemeenschappelijke
      organen ingesteld krachtens de Wet gemeenschappelijke regelingen met uitzondering van de openbare lichamen en
      gemeenschappelijke organen waaraan vanwege het Rijk wordt deelgenomen, voor zover zij een bijdrage als bedoeld in
      [artikel 6.1, aanhef en onderdeel a][ref1], hebben ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.4'
    text: |-
      Indien een administratie of de daarmee samenhangende taken aan een derde worden uitbesteed, dan is Onze Minister
      die het aangaat bevoegd aan de hand van de administratie bij die derde of degene die de administratie of de taken
      in opdracht van die derde uitvoert een onderzoek als bedoeld in [artikel 6.3, derde lid][ref1], te verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.5'
    text: |-
      De accountant die op grond van de [artikelen 6.3, vijfde lid][ref1], inzage in de controledossiers verleent
      en kopieën hieruit verstrekt, is niet aansprakelijk voor de schade die een derde dientengevolge lijdt, tenzij
      aannemelijk wordt gemaakt dat de accountant gelet op alle feiten en omstandigheden hiertoe in redelijkheid niet had
      mogen overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '6.6'
    text: |-
      Onverminderd het elders bij wet bepaalde, kunnen bij of krachtens algemene maatregel van bestuur regels worden
      gesteld over:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.6
  - number: 6.6.a
    text: de informatie die de rechtspersonen met een wettelijke taak in hun begroting en jaarverslag opnemen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.6
  - number: 6.6.b
    text: de eisen aan de informatie die in het jaarverslag van de rechtspersonen met een wettelijke taak wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.6
  - number: 6.7.1
    text: 'Onze Minister die het aangaat is belast met het toezicht op:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.7
  - number: 6.7.1.a
    text: |-
      het schatkistbankieren door de rechtspersonen die krachtens [artikel 5.1, eerste lid, aanhef en onder a][ref1],
      zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 6.7.1.b
    text: |-
      het uitzetten van de liquide middelen door de rechtspersonen die krachtens
      [artikel 5.1, eerste lid, aanhef en onder b][ref1], zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 6.7.1.c
    text: |-
      het in [artikel 5.8][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 6.7.2
    text: |-
      Een rechtspersoon die krachtens [artikel 5.1, eerste lid, aanhef en onder a en b][ref1], is aangewezen verstrekt
      op verzoek van Onze Minister die het aangaat de informatie die hij voor zijn toezicht, bedoeld in het eerste lid,
      nodig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 6.7.3
    text: |-
      De rechtspersonen die krachtens [artikel 5.1, eerste lid, aanhef en onder a en b][ref1], zijn aangewezen,
      verrichten op verzoek van Onze Minister die het aangaat een onderzoek naar de naleving van de verplichtingen,
      bedoeld de [artikelen 5.2 tot en met 5.4][ref2] en [5.7][ref3] en [5.8][ref4]. Het onderzoek wordt verricht door
      de accountant die belast is met de controle van de jaarrekening van die rechtspersoon. De rechtspersonen sturen het
      verslag van het onderzoek naar Onze Minister die het aangaat.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: 6.7.4
    text: |-
      Onze Minister die het aangaat kan een rechtspersoon die krachtens
      [artikel 5.1, eerste lid, aanhef en onder a en b][ref1], is aangewezen en die zich niet houdt aan het bij of
      krachtens de [artikelen 5.1, tot en met 5.4][ref2] en [5.7][ref3] en [5.8][ref4] bepaalde, de aanwijzing geven
      hieraan alsnog te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0039429#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.7
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0039429
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '4'
  - number: '6.8'
    text: |-
      Onze Minister van Financiën kan nadere regels stellen over het toezicht, bedoeld in [artikel 6.7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.9.1
    text: |-
      Onze Minister van Financiën kan in overeenstemming met Onze Ministers die het mede aangaan jaarlijks ten behoeve
      van de Europese Commissie een verklaring opstellen over de besteding van de Europese middelen in gedeeld beheer
      door de lidstaat Nederland.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.9
  - number: 6.9.2
    text: Onze Minister van Financiën zendt de verklaring naar de Europese Commissie.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.9
  - number: 6.9.3
    text: Onze Minister van Financiën zendt de verklaring voor onderzoek naar de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.9
  - number: 6.9.4
    text: |-
      Onze Minister van Financiën zendt de verklaring na het onderzoek van de Algemene Rekenkamer naar de Tweede Kamer
      der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel6.9
  - number: 7.1.1
    text: |-
      De Algemene Rekenkamer bestaat uit drie leden in gewone dienst die tezamen het college van de Algemene Rekenkamer
      vormen, alsmede uit ten hoogste drie leden in buitengewone dienst.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.1
  - number: 7.1.2
    text: |-
      De president wordt uit de leden in gewone dienst bij koninklijk besluit op voordracht van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties benoemd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.1
  - number: 7.1.3
    text: |-
      De Algemene Rekenkamer stelt Ons en de Tweede Kamer der Staten-Generaal zo spoedig mogelijk in kennis van een
      vacature onder de leden.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.1
  - number: 7.1.4
    text: |-
      Het college van de Algemene Rekenkamer stelt een aanbevelingslijst op met ten minste vier kandidaten en zendt deze
      zo spoedig mogelijk na de kennisgeving van de vacature, bedoeld in het derde lid, naar de Tweede Kamer der Staten-
      Generaal. De Tweede Kamer der Staten-Generaal zal bij haar voordracht op de aanbevelingslijst zodanig acht slaan
      als haar dienstig voorkomt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.1
  - number: 7.2.1
    text: |-
      De leden in buitengewone dienst kunnen door de president worden opgeroepen om deel te nemen aan bepaalde
      werkzaamheden en hebben met betrekking tot die werkzaamheden dezelfde bevoegdheden als de leden in gewone dienst.
      De leden in buitengewone dienst maken dan tevens deel uit van het college van de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.2
  - number: 7.2.2
    text: |-
      Een lid in buitengewone dienst vervangt een lid in gewone dienst gedurende diens voorziene afwezigheid of
      ontstentenis.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.2
  - number: 7.3.1
    text: De Algemene Rekenkamer heeft een secretaris.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.3
  - number: 7.3.2
    text: |-
      Op voordracht van de Algemene Rekenkamer wordt bij koninklijk besluit besloten tot het aangaan van een
      arbeidsovereenkomst met de secretaris. Tot beëindiging van de arbeidsovereenkomst wordt bij koninklijk besluit
      op voordracht van de Algemene Rekenkamer besloten, tenzij de Algemene Rekenkamer de arbeidsovereenkomst opzegt op
      grond van [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: 7.4.1
    text: Om tot lid van de Algemene Rekenkamer te kunnen worden benoemd, moet men Nederlander zijn.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.4
  - number: 7.4.2
    text: |-
      De leden en de secretaris vervullen geen andere openbare betrekkingen waaraan een vaste beloning of toelage
      is verbonden, noch zijn zij lid van een publiekrechtelijk college waarvoor de keuze geschiedt bij of krachtens
      wettelijk voorschrift uitgeschreven verkiezingen. Hiervan kan bij koninklijk besluit, de Algemene Rekenkamer
      gehoord, ontheffing worden verleend, tenzij de onverenigbaarheid ook uit een ander wettelijk voorschrift
      voortvloeit.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.4
  - number: 7.4.3
    text: |-
      Onverminderd het tweede lid, vervullen de leden en de secretaris geen betrekkingen die ongewenst zijn met het
      oog op een goede vervulling van hun ambt of handhaving van hun onpartijdigheid en onafhankelijkheid of van het
      vertrouwen daarin.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.4
  - number: 7.4.4
    text: |-
      De betrekkingen die de leden en de secretaris buiten hun ambt vervullen, worden jaarlijks door de president
      openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.4
  - number: 7.5.1
    text: |-
      Een lid wordt ontslag verleend op eigen verzoek en bij het bereiken van de leeftijd van zeventig jaar. Het ontslag
      gaat in op de eerste dag van de volgende maand.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
  - number: 7.5.2
    text: |-
      De Hoge Raad der Nederlanden kan de leden ontslaan of schorsen.
      [Hoofdstuk 6A van de Wet rechtspositie rechterlijke ambtenaren][ref1], met uitzondering van de
      [artikelen 46b][ref2], [46c, onder b en c][ref3], [46ca, eerste lid, onder b en c, tweede en derde lid][ref4],
      [46d][ref5], [46i, eerste lid, onder c][ref6], [46k][ref7] en [46q][ref8], is daarbij van overeenkomstige
      toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Hoofdstuk6A
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46b
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46ca
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46k
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46q
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        hoofdstuk: 6A
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46b
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46ca
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46k
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46q
  - number: 7.5.2.a
    text: de disciplinaire maatregel van schriftelijke berisping wordt opgelegd door de president van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
  - number: 7.5.2.b
    text: |-
      in [artikel 46e][ref1] voor «de rechterlijk ambtenaar, tevens zijnde president van het gerechtshof of de rechtbank,
      de president van de Hoge Raad onderscheidenlijk procureur-generaal bij de Hoge Raad» wordt gelezen «de president
      van de Algemene Rekenkamer»;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46e
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46e
  - number: 7.5.2.c
    text: de president van de Algemene Rekenkamer als functionele autoriteit wordt aangemerkt;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
  - number: 7.5.2.d
    text: voor «Onze Minister» wordt gelezen «Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties»;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
  - number: 7.5.2.e
    text: |-
      de voordracht, bedoeld in de [artikelen 46i, vierde lid][ref1], en [46l, tweede lid][ref2], wordt gedaan door de
      Algemene Rekenkamer;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46l
  - number: 7.5.2.f
    text: |-
      in [artikel 46p, vijfde lid][ref1], in plaats van «het betrokken gerecht onderscheidenlijk het parket bij de Hoge
      Raad» wordt gelezen «de Algemene Rekenkamer».


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 7.5.3
    text: |-
      Onverminderd de gronden voor ontslag, bedoeld in het tweede lid, is een grond voor ontslag dat het lid in strijd
      met [artikel 7.4, derde lid][ref1], handelt.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '1'
  - number: 7.5.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot wachtgeld en
      voorzieningen in verband met ziekte en arbeidsongeschiktheid.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.5
  - number: 7.6.1
    text: |-
      De president, de overige leden in gewone dienst, de leden in buitengewone dienst en de secretaris leggen, alvorens
      hun ambt te aanvaarden, in Onze handen de volgende eed (verklaring en belofte) af: - «Ik zweer (verklaar) dat
      ik, tot het verkrijgen van mijn aanstelling, middellijk noch onmiddellijk, onder welke naam of welk voorwendsel
      ook, aan iemand iets heb gegeven of beloofd. Ik zweer (verklaar en beloof) dat ik om iets in dit ambt te doen of
      te laten, van niemand enig geschenk of enige belofte heb aangenomen of zal aannemen, middellijk of onmiddellijk.
      Ik zweer (beloof) trouw aan de Koning, dat ik de [Grondwet][ref1] steeds zal helpen onderhouden en mijn ambt met
      eerlijkheid, nauwgezetheid en onpartijdigheid zal vervullen. Zo waarlijk helpe mij God almachtig! (Dat verklaar en
      beloof ik!)».


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: 7.6.2
    text: |-
      Daartoe door Ons gemachtigd kan ook de president in een vergadering van het college van de Algemene Rekenkamer deze
      eed of de verklaring en belofte afnemen van de overige leden in gewone dienst, de leden in buitengewone dienst en
      de secretaris.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.6
  - number: '7.7'
    text: |-
      De Algemene Rekenkamer stelt voor haar werkzaamheden een reglement van orde vast. Het reglement wordt in de
      Staatscourant geplaatst.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.7
  - number: 7.8.1
    text: |-
      De president houdt toezicht op de werkzaamheden van de Algemene Rekenkamer en op de juiste toepassing van het bij
      of krachtens dit hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.8
  - number: 7.8.2
    text: |-
      De president brengt alle stukken die aan de Algemene Rekenkamer of aan hem in zijn hoedanigheid worden toegezonden
      ter behandeling in de vergadering van het college van de Algemene Rekenkamer met uitzondering van de stukken die in
      het reglement van orde zijn uitgezonderd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.8
  - number: 7.8.3
    text: |-
      De taken en bevoegdheden van de president worden bij diens afwezigheid of ontstentenis waargenomen door het
      aanwezige lid in gewone dienst dat naar rang van benoeming het oudst is.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.8
  - number: 7.9.1
    text: Het college van de Algemene Rekenkamer besluit bij meerderheid van stemmen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.9
  - number: 7.9.2
    text: Indien de stemmen staken, beslist de stem van de president.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.9
  - number: 7.9.3
    text: |-
      Het college van de Algemene Rekenkamer neemt geen besluiten, indien niet ten minste de meerderheid van het aantal
      leden van het college van de Algemene Rekenkamer in de vergadering aanwezig is.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.9
  - number: 7.10.1
    text: |-
      De leden en de secretaris mogen niet aanwezig zijn bij de beraadslagingen en het nemen van beslissingen over
      enige zaak, die hen, hun echtgenoten, hun geregistreerde partners, degenen met wie zij duurzaam samenleven of hun
      naastbestaanden tot in de derde graad van bloedverwantschap of aanverwantschap betreffen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.10
  - number: 7.10.2
    text: |-
      De leden en de secretaris nemen niet deel aan het onderzoek van en de beslissing over rekeningen en
      verantwoordingen die door hen worden afgelegd.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.10
  - number: 7.11.1
    text: |-
      Het college van de Algemene Rekenkamer kan het aangaan, wijzigen en beëindigen van de arbeidsovereenkomsten met de
      ambtenaren van de Algemene Rekenkamer opdragen aan de secretaris.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.11
  - number: 7.11.2
    text: |-
      Ten aanzien van de ambtenaren van de Algemene Rekenkamer gelden de voor alle ambtenaren geldende arbeidsvoorwaarden
      die zijn opgenomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.11
  - number: 7.11.3
    text: |-
      Op verzoek van de Algemene Rekenkamer kunnen in de collectieve arbeidsovereenkomst, bedoeld in het tweede lid,
      andere arbeidsvoorwaarden voor de ambtenaren van de Algemene Rekenkamer worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.11
  - number: 7.11.4
    text: |-
      Van de ambtenaren van de Algemene Rekenkamer wordt door de president hetzij de eed, hetzij de verklaring en belofte
      afgenomen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.11
  - number: 7.12.1
    text: 'De Algemene Rekenkamer onderzoekt met betrekking tot het Rijk jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.12
  - number: 7.12.1.a
    text: de financiële verantwoordingsinformatie in de jaarverslagen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.12
  - number: 7.12.1.b
    text: de totstandkoming van de niet-financiële verantwoordingsinformatie in de jaarverslagen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.12
  - number: 7.12.1.c
    text: de financiële verantwoordingsinformatie in het Financieel jaarverslag van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.12
  - number: 7.12.2
    text: 'De Algemene Rekenkamer onderzoekt met betrekking tot het Rijk:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.12
  - number: 7.12.2.a
    text: |-
      het begrotingsbeheer, het financieel beheer, de materiële bedrijfsvoering en de daartoe bijgehouden administraties
      van het Rijk;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.12
  - number: 7.12.2.b
    text: de centrale administratie van de schatkist van het Rijk van het Ministerie van Financiën.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.12
  - number: 7.13.1
    text: |-
      Het onderzoek, bedoeld in [artikel 7.12, eerste lid][ref1], is erop gericht na te gaan of voldaan is aan de normen,
      bedoeld in de [artikelen 3.8 tot en met 3.10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel3
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 7.13.2
    text: |-
      Het onderzoek, bedoeld in [artikel 7.12, tweede lid][ref1], is erop gericht na te gaan of voldaan is aan de normen,
      bedoeld in de [artikelen 3.2 tot en met 3.5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel3
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.13
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 7.14.1
    text: |-
      De Algemene Rekenkamer legt haar bevindingen en conclusies met betrekking tot de onderzoeken, bedoeld in
      [artikel 7.12, eerste en tweede lid][ref1], jaarlijks vast in rapporten.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.14.2
    text: |-
      De Algemene Rekenkamer stelt een verklaring van goedkeuring op bij de in het Financieel jaarverslag van het Rijk
      opgenomen rijksrekening en de rijkssaldibalans, bedoeld in [artikel 2.35, tweede en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: 7.14.3
    text: |-
      De verklaring van goedkeuring wordt zo nodig gegeven onder voorbehoud van de vaststelling van de
      slotverschillen, bedoeld in [artikel 2.36][ref1], en in voorkomende gevallen een indemniteitswet als bedoeld in
      [artikel 7.22, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.14
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.14.4
    text: |-
      Voordat de Algemene Rekenkamer een rapport, bedoeld in het eerste lid, vaststelt, stelt zij Onze Minister die het
      aangaat in de gelegenheid binnen een redelijke termijn te reageren op haar bevindingen en voorlopige conclusies.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.14
  - number: 7.14.5
    text: |-
      Van gegevens en bevindingen die naar hun aard vertrouwelijk zijn, maakt de Algemene Rekenkamer geen melding in
      een rapport als bedoeld in het eerste lid. Mededelingen die zodanige gegevens of bevindingen bevatten, kan zij
      vertrouwelijk ter kennisneming aan de Staten-Generaal verstrekken.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.14
  - number: 7.15.1
    text: |-
      De Algemene Rekenkamer biedt de rapporten en de verklaring van goedkeuring, bedoeld in
      [artikel 7.14, eerste en tweede lid][ref1], uiterlijk op 1 juni van het jaar volgend op het begrotingsjaar aan de
      Staten-Generaal en Ons aan.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.15.2
    text: |-
      Indien de Algemene Rekenkamer het onderzoek, bedoeld in [artikel 7.12, eerste en tweede lid][ref1], op 1 juni van
      het jaar volgend op het begrotingsjaar nog niet heeft afgesloten, biedt zij op die datum een voorlopig rapport
      over de stand van het betrokken onderzoek. In dat geval zendt de Algemene Rekenkamer het definitieve rapport en de
      verklaring van goedkeuring, bedoeld in [artikel 7.14, eerste en tweede lid][ref2], zo spoedig mogelijk na.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.15
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: '7.16'
    text: De Algemene Rekenkamer onderzoekt de doeltreffendheid en de doelmatigheid van het gevoerde beleid van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.16
  - number: 7.17.1
    text: |-
      De Algemene Rekenkamer stelt de Staten-Generaal en Ons in kennis van het rapport dat zij naar aanleiding van een
      onderzoek, bedoeld in [artikel 7.16][ref1], vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.17.2
    text: |-
      De Algemene Rekenkamer stelt in voorkomende gevallen tevens de instelling, bedoeld in
      [artikel 7.34, achtste lid][ref1], in kennis van het rapport, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.17
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.17.3
    text: |-
      Voordat de Algemene Rekenkamer een rapport als bedoeld in het eerste lid, vaststelt, stelt zij Onze Minister
      die het aangaat in de gelegenheid binnen een redelijke termijn te reageren op haar bevindingen en voorlopige
      conclusies.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.17
  - number: 7.17.4
    text: |-
      Van gegevens en bevindingen die naar hun aard vertrouwelijk zijn, maakt de Algemene Rekenkamer geen melding in
      een rapport als bedoeld in het eerste lid. Mededelingen die zodanige gegevens of bevindingen bevatten, kan zij
      vertrouwelijk ter kennisneming aan de Staten-Generaal verstrekken.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.17
  - number: 7.18.1
    text: |-
      De Algemene Rekenkamer is bevoegd, voor zover zij dat nodig acht voor het uitvoeren van haar taken, bij alle
      onderdelen van het Rijk alle goederen, administraties, documenten en andere informatiedragers op door haar aan te
      geven wijze te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.18
  - number: 7.18.2
    text: |-
      De Algemene Rekenkamer is bevoegd voor het uitvoeren van haar taken inzage te vorderen in de controleprogramma’s
      en dossiers van de accountant die in opdracht van een van Onze Ministers of een college met een controle of
      review is belast. De Algemene Rekenkamer is bevoegd kopieën te maken van de stukken uit de controledossiers.
      De accountant kan inzage in de controledossiers niet weigeren met een beroep op een bij of krachtens de wet
      opgelegde verplichting tot geheimhouding van vertrouwelijke gegevens die in de controledossiers zijn opgenomen.
      [Artikel 6.5][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.18
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 7.18.3
    text: |-
      Bij het uitvoeren van haar taken kan de Algemene Rekenkamer gebruik maken van de resultaten van door anderen
      verrichte controles, onverminderd haar bevoegdheid tot het verrichten van onderzoek.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.18
  - number: 7.18.4
    text: |-
      De Algemene Rekenkamer kan de bevoegdheden, bedoeld in dit artikel, uitoefenen zolang als en over de jaren dat het
      Rijk daarbij belang heeft.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.18
  - number: 7.18.5
    text: |-
      Onze Ministers en de colleges zijn gehouden desgevraagd de inlichtingen te verstrekken die de Algemene Rekenkamer
      voor het uitvoeren van haar taken nodig acht.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.18
  - number: 7.18.6
    text: |-
      De accountant die in opdracht van een van Onze Ministers of een college met een controle is belast, verstrekt
      desgevraagd aan de Algemene Rekenkamer de controleprogramma’s en dossiers met betrekking tot zijn controles.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.18
  - number: '7.19'
    text: |-
      Indien een administratie of de daarmee samenhangende taken aan een derde worden uitbesteed, dan is de Algemene
      Rekenkamer bevoegd aan de hand van de administratie bij die derde of degene die de administratie of de taken
      in opdracht van die derde uitvoert een onderzoek als bedoeld in de [artikelen 7.12][ref1] en [7.16][ref2], te
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.19
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.20.1
    text: Het college van de Algemene Rekenkamer verricht het onderzoek naar geheime uitgaven en ontvangsten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.20
  - number: 7.20.2
    text: Bij het onderzoek kan het college zich laten ondersteunen door zijn medewerkers.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.20
  - number: 7.21.1
    text: |-
      De Algemene Rekenkamer kan op grond van haar onderzoek, bedoeld in [artikel 7.12][ref1], bezwaar maken tegen het
      financieel beheer, de materiële bedrijfsvoering of de verantwoording daarover.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.21
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.21.2
    text: De Algemene Rekenkamer deelt het bezwaar aan Onze Minister die het aangaat mede.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.21
  - number: 7.21.3
    text: |-
      Binnen een maand na ontvangst van de mededeling, bedoeld in het tweede lid, stelt Onze Minister die het aangaat de
      Algemene Rekenkamer in kennis van de maatregelen die tot opheffing van haar bezwaar kunnen leiden.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.21
  - number: 7.21.4
    text: |-
      Na afloop van deze termijn neemt de Algemene Rekenkamer haar eindbeslissing, waarvan zij mededeling doet aan Onze
      Minister die het aangaat.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.21
  - number: 7.22.1
    text: |-
      De Algemene Rekenkamer kan haar bezwaar, bedoeld in [artikel 7.21, eerste lid][ref1], handhaven.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.22.2
    text: |-
      Indien de Algemene Rekenkamer haar bezwaar handhaaft, doet zij hiervan mededeling aan Onze Minister die het aangaat
      en Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.22
  - number: 7.22.3
    text: |-
      Indien het bezwaar betrekking heeft op de rechtmatigheid, dan wordt binnen twee maanden na de mededeling, bedoeld
      in het tweede lid, een voorstel tot vaststelling van een indemniteitswet aan de Tweede Kamer der Staten-Generaal
      gezonden.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.22
  - number: 7.22.4
    text: |-
      Indien na afloop van die termijn niet van de indiening van een dergelijk voorstel is gebleken, doet de Algemene
      Rekenkamer daarvan mededeling aan de Tweede Kamer der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.22
  - number: 7.22.5
    text: |-
      De Algemene Rekenkamer maakt van haar bezwaar indien dit anders luidt dan het bezwaar, bedoeld in het derde lid,
      melding in het betrokken rapport, bedoeld in [artikel 7.14][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.22
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.22.6
    text: |-
      De Algemene Rekenkamer kan daarover tevens een aantekening plaatsen in haar rapport bij het Financieel jaarverslag
      van het Rijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.22
  - number: '7.23'
    text: |-
      De Algemene Rekenkamer kan op verzoek van elk van de Kamers der Staten-Generaal of ieder van Onze Ministers een
      onderzoek instellen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.23
  - number: '7.24'
    text: 'Onverminderd het elders bij wet bepaalde, kan de Algemene Rekenkamer een onderzoek verrichten ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
  - number: 7.24.a
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een beroep
      of bedrijf uitoefenen die direct, indirect of voorwaardelijk:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
  - number: 7.24.a.1°
    text: |-
      een subsidie, lening, garantie of een bijdrage in natura met kenmerken van een subsidie, lening of garantie ten
      laste van de rijksbegroting hebben ontvangen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
  - number: 7.24.a.2°
    text: |-
      een fiscale tegemoetkoming inzake speur- en ontwikkelingswerk, een energie-investering, een milieu-investering
      of een investering in huurwoningen hebben ontvangen ten behoeve waarvan door Onze Minister die het aangaat een
      verklaring is afgegeven of een aanwijzing bij ministeriële regeling heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
  - number: 7.24.b
    text: rechtspersonen met een wettelijke taak;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
  - number: 7.24.c
    text: |-
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen die een beroep
      of bedrijf uitoefenen die goederen of diensten leveren die betrekking hebben op de uitvoering van een publieke taak
      waarvan de betaling ten laste van de rijksbegroting komt en waarbij de Staat zich het recht heeft voorbehouden bij
      de betreffende rechtspersoon, commanditaire vennootschap, vennootschap onder firma of natuurlijke persoon controles
      uit te voeren ten aanzien van de geleverde goederen of diensten;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
  - number: 7.24.d
    text: |-
      openbare lichamen en gemeenschappelijke organen ingesteld krachtens de [Wet gemeenschappelijke regelingen][ref1],
      waaraan vanwege het Rijk wordt deelgenomen;


      [ref1]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
    references:
      - id: ref1
        bwb_id: BWBR0003740
  - number: 7.24.e
    text: |-
      naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid waarvan de Staat 5% of meer van
      het geplaatste aandelenkapitaal houdt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.24
  - number: 7.25.1
    text: |-
      Een onderzoek ten aanzien van rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma
      en natuurlijke personen, bedoeld in [artikel 7.24, aanhef en onderdeel a tot en met c][ref1], is gericht op
      oordeelsvorming over:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.25.1.a
    text: |-
      het gevoerde beleid van Onze Minister die het aangaat met betrekking tot de rechtspersonen,
      commanditaire vennootschappen, vennootschappen onder firma en natuurlijke personen, bedoeld in
      [artikel 7.24, onderdeel a tot en met c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.25.1.b
    text: |-
      het toezicht dat Onze Minister die het aangaat op de rechtspersonen, commanditaire vennootschappen, vennootschappen
      onder firma en natuurlijke personen, bedoeld in [artikel 7.24, onderdeel a tot en met c][ref1], uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.25.2
    text: |-
      Onverminderd het eerste lid is een onderzoek ten aanzien van rechtspersonen met een wettelijke taak als bedoeld in
      [artikel 7.24, aanhef en onderdeel b][ref1], mede gericht op oordeelsvorming over:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.25
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.25.2.a
    text: het beheer van de publieke middelen door de rechtspersonen met een wettelijke taak;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.25
  - number: 7.25.2.b
    text: de uitvoering van de wettelijke taak.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.25
  - number: 7.25.3
    text: |-
      Een onderzoek bij De Nederlandsche Bank N.V. heeft geen betrekking op de uitvoering van taken ter uitvoering van
      het Verdrag betreffende de werking van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.25
  - number: '7.26'
    text: |-
      Een onderzoek ten aanzien van openbare lichamen en gemeenschappelijke organen, bedoeld in
      [artikel 7.24, aanhef en onderdeel d][ref1], is gericht op:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.26.a
    text: |-
      de oordeelsvorming over de vervulling van de deelname vanwege het Rijk met betrekking tot de openbare lichamen en
      gemeenschappelijke organen, bedoeld in [artikel 7.24, onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.26.b
    text: |-
      het beleid dat Onze Minister die het aangaat met betrekking tot de openbare lichamen en gemeenschappelijke organen,
      bedoeld in [artikel 7.24, onderdeel d][ref1], voert.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.26
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '7.27'
    text: |-
      Een onderzoek ten aanzien van naamloze vennootschappen en besloten vennootschappen, bedoeld in
      [artikel 7.24, aanhef en onderdeel e][ref1], is gericht op:


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.27
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.27.a
    text: |-
      de oordeelsvorming over de vervulling van het aandeelhouderschap van de Staat met betrekking tot deze naamloze
      vennootschappen en besloten vennootschappen;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.27
  - number: 7.27.b
    text: |-
      het beleid dat Onze Minister die het aangaat voert met betrekking tot deze naamloze vennootschappen en besloten
      vennootschappen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.27
  - number: '7.28'
    text: |-
      Onverminderd het elders bij wet of EU-verordening bepaalde, kan de Algemene Rekenkamer, voor zover aan de lidstaat
      van de Europese Unie de verplichting tot het toezicht op en de controle van een subsidie, lening of garantie en het
      beheer daarvan is opgelegd, onderzoek verrichten bij rechtspersonen, commanditaire vennootschappen, vennootschappen
      onder firma en natuurlijke personen die een beroep of bedrijf uitoefenen die direct, indirect of voorwaardelijk een
      subsidie, lening of garantie ten laste van de EU-begroting hebben ontvangen.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.28
  - number: '7.29'
    text: |-
      Een onderzoek ten aanzien van rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma en
      natuurlijke personen, bedoeld in [artikel 7.28][ref1], is gericht op oordeelsvorming over het toezicht dat door
      Onze Ministers die het aangaan is gevoerd ter nakoming van de bij of krachtens het Verdrag betreffende de werking
      van de Europese Unie aan de lidstaat opgelegde verplichtingen inzake het financieel beheer van de ontvangen
      subsidie, lening of garantie, de controle daarvan of het toezicht daarop.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.29
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.30.1
    text: |-
      De Algemene Rekenkamer stelt de Staten-Generaal en Ons in kennis van het rapport dat zij naar aanleiding van een
      onderzoek als bedoeld in de [artikelen 7.23][ref1], [7.24][ref2] en [7.28][ref3], vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.30
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.30.2
    text: |-
      De Algemene Rekenkamer stelt in voorkomende gevallen tevens de instelling, bedoeld in
      [artikel 7.34, achtste lid][ref1], in kennis van het rapport, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.30
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.30.3
    text: |-
      Voordat de Algemene Rekenkamer een rapport, bedoeld in het eerste lid, vaststelt, stelt zij Onze Minister die het
      aangaat in de gelegenheid binnen een redelijke termijn te reageren op haar bevindingen en voorlopige conclusies.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.30
  - number: 7.30.4
    text: |-
      Van gegevens en bevindingen die naar hun aard vertrouwelijk zijn, maakt de Algemene Rekenkamer geen melding in
      een rapport als bedoeld in het eerste lid. Mededelingen die zodanige gegevens of bevindingen bevatten, kan zij
      vertrouwelijk ter kennisneming aan de Staten-Generaal verstrekken.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.30
  - number: '7.31'
    text: |-
      De Algemene Rekenkamer onderzoekt de verklaring, bedoeld in [artikel 6.9][ref1], inzake de besteding van de
      Europese middelen in gedeeld beheer door Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.31
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 7.32.1
    text: |-
      De Algemene Rekenkamer stelt de Staten-Generaal en Onze Minister van Financiën in kennis van het rapport dat zij
      naar aanleiding van een onderzoek als bedoeld in [artikel 7.31][ref1], vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.32.2
    text: |-
      [Artikel 7.30, tweede tot en met vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.32
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '7.33'
    text: |-
      De Algemene Rekenkamer biedt de Staten-Generaal en Ons jaarlijks uiterlijk op 1 april een verslag aan van haar
      werkzaamheden in het daaraan voorafgaande jaar.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.33
  - number: 7.34.1
    text: |-
      De Algemene Rekenkamer maakt bij het onderzoek, bedoeld in [artikel 7.24, onder a tot en met d][ref1], zoveel
      mogelijk gebruik van door anderen verrichte controles.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.34.2
    text: |-
      De Algemene Rekenkamer kan aan de hand van de bescheiden die aanwezig zijn bij Onze Minister die het aangaat of
      de instelling, bedoeld in het achtste lid, kennis nemen van de informatie over de rechtspersonen, commanditaire
      vennootschappen, vennootschappen onder firma, natuurlijke personen, openbare lichamen en gemeenschappelijke
      organen, bedoeld in [artikel 7.24, eerste lid, onderdeel a tot en met d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.34.3
    text: |-
      Indien de informatie, aanwezig bij Onze Minister die het aangaat of de instelling, bedoeld in het achtste lid,
      naar het oordeel van de Algemene Rekenkamer daartoe aanleiding geeft, is de Algemene Rekenkamer bevoegd bij de
      rechtspersonen, commanditaire vennootschappen, vennootschappen onder firma, natuurlijke personen, openbare lichamen
      en gemeenschappelijke organen, bedoeld in [artikel 7.24, eerste lid, onderdeel a tot en met d][ref1], nadere
      inlichtingen in te winnen of overlegging van stukken te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.34.4
    text: |-
      De Algemene Rekenkamer kan aan de hand van de administratie een onderzoek instellen bij de rechtspersonen,
      commanditaire vennootschappen, vennootschappen onder firma, natuurlijke personen, openbare lichamen en
      gemeenschappelijke organen, bedoeld in [artikel 7.24, eerste lid, onderdeel a tot en met d][ref1]. De
      [artikelen 7.18, eerste lid][ref2], en [7.19][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '2'
  - number: 7.34.5
    text: |-
      De Algemene Rekenkamer is bevoegd inzage te vorderen in de controleprogramma’s en dossiers van de accountant die
      de documenten, bedoeld in [artikel 6.3, eerste lid, onderdeel a en b][ref1], heeft gecontroleerd. De accountant kan
      inzage in de controledossiers niet weigeren met een beroep op een bij of krachtens de wet opgelegde verplichting
      tot geheimhouding van vertrouwelijke gegevens die in de controledossiers zijn opgenomen. [Artikel 6.5][ref2] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel6
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: 7.34.6
    text: |-
      Indien de Algemene Rekenkamer gebruik maakt van de bevoegdheden, bedoeld in het derde
      tot en met het vijfde lid, zijn de [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3] en
      [5:17, tweede en derde lid, van de Algemene wet bestuursrecht][ref4] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
