        artikel: '5'
  - number: 7.34.7
    text: |-
      De Algemene Rekenkamer kan haar bevoegdheden, bedoeld in dit artikel, uitoefenen zolang als en over de jaren dat
      het algemeen belang dit vordert.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
  - number: 7.34.8
    text: |-
      Een instelling die bij of krachtens de wet is belast met het houden van toezicht op rechtspersonen met een
      wettelijke taak licht de Algemene Rekenkamer op door haar aan te geven wijze in over de resultaten van het
      toezicht. Indien de Algemene Rekenkamer daarom verzoekt, stelt de instelling haar controleprogramma’s ter
      beschikking.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
  - number: 7.34.9
    text: |-
      De Algemene Rekenkamer licht Onze Minister die het aangaat in over het onderzoek dat zij op basis van dit artikel
      verricht.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
  - number: 7.34.10
    text: |-
      Dit artikel is niet van toepassing op provincies, gemeenten, waterschappen, de openbare lichamen
      Bonaire, Sint Eustatius en Saba, openbare lichamen voor beroep en bedrijf, financiële ondernemingen
      en elektronischgeldinstellingen, bedoeld in de [Wet op het financieel toezicht][ref1] en de
      [Wet financiële markten BES][ref2], en openbare lichamen en gemeenschappelijke organen ingesteld krachtens de
      [Wet gemeenschappelijke regelingen][ref3] met uitzondering van de openbare lichamen en gemeenschappelijke organen
      waaraan vanwege het Rijk wordt deelgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
      [ref2]: https://wetten.overheid.nl/BWBR0030883
      [ref3]: https://wetten.overheid.nl/BWBR0003740
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.34
    references:
      - id: ref1
        bwb_id: BWBR0020368
      - id: ref2
        bwb_id: BWBR0030883
      - id: ref3
        bwb_id: BWBR0003740
  - number: 7.35.1
    text: |-
      Ten aanzien van naamloze vennootschappen en besloten vennootschappen, waarvan de Staat ten
      minste 5% van het geplaatste aandelenkapitaal houdt, bedoeld in [artikel 7.24, onder e][ref1], is
      [artikel 7.34, eerste tot en met derde lid][ref2], van overeenkomstige toepassing, met dien verstande dat het
      inwinnen van nadere inlichtingen en het vorderen van stukken door tussenkomst van Onze Minister die het aangaat
      geschiedt en uitsluitend betrekking heeft op de jaarrekeningen en de daarop betrekking hebbende rapporten van de
      accountants die de jaarrekeningen hebben gecontroleerd.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.35.2
    text: |-
      Ten aanzien van naamloze vennootschappen en besloten vennootschappen met beperkte aansprakelijkheid
      waarvan de Staat meer dan 50% van het geplaatste aandelenkapitaal houdt en van naamloze vennootschappen
      en besloten vennootschappen met beperkte aansprakelijkheid waarin de eerstgenoemde naamloze en besloten
      vennootschappen middellijk of onmiddellijk meer dan 50% van het geplaatste aandelenkapitaal houden, is
      [artikel 7.34, eerste tot en met zevende lid en negende lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.35
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '7.36'
    text: |-
      Ten aanzien van een onderzoek naar bijdragen ten laste van de EU-begroting als bedoeld in [artikel 7.28][ref1], is
      [artikel 7.34, eerste tot en met negende lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.36
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: 7.37.1
    text: |-
      De Algemene Rekenkamer kan samenwerken met de Algemene Rekenkamers van Aruba, Curaçao, Sint Maarten en de
      gezamenlijk rekenkamer van de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.37
  - number: 7.37.2
    text: |-
      Het is niet toegestaan gegevens, bevindingen of conclusies die naar hun aard vertrouwelijk zijn te verstrekken aan
      de rekenkamers, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.37
  - number: 7.38.1
    text: De Algemene Rekenkamer kan internationale werkzaamheden verrichten die aansluiten bij haar wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.38
  - number: 7.38.2
    text: |-
      De Algemene Rekenkamer kan ten aanzien van de werkzaamheden, bedoeld in het eerste lid, samenwerken met
      onderzoeksinstituten uit andere landen die vergelijkbaar zijn met de Algemene Rekenkamer.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.38
  - number: 7.38.3
    text: |-
      [Artikel 7.37, tweede lid][ref1], is van overeenkomstige toepassing ten aanzien van de werkzaamheden bedoeld in het
      eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.38
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '3'
  - number: '7.39'
    text: |-
      De Algemene Rekenkamer verstrekt aan Onze Minister van Financiën, Onze Minister die het aangaat en de Staten-
      Generaal de mededelingen die zij in het algemeen belang nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.39
  - number: 7.40.1
    text: 'Onze Minister die het aangaat voert overleg met Onze Minister van Financiën en de Algemene Rekenkamer over:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
  - number: 7.40.1.a
    text: |-
      de bij of krachtens de wet te stellen regels die betrekking hebben op de taken of bevoegdheden van de Algemene
      Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
  - number: 7.40.1.b
    text: |-
      een wettelijke regeling als bedoeld in [artikel 4.7, derde lid, onder a][ref1], voor zover die wettelijke regeling
      betrekking heeft op het oprichten, mede-oprichten of doen oprichten van privaatrechtelijke rechtspersonen door
      de Staat.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 7.40.2
    text: |-
      Onze Minister die het aangaat voert in overeenstemming met Onze Minister van Buitenlandse Zaken en Onze Minister
      van Financiën, overleg met de Algemene Rekenkamer over ontwerp EU-regelgeving voor zover die betrekking heeft op de
      positie, taken of bevoegdheden van nationale rekenkamers.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
  - number: 7.40.3
    text: |-
      Onze Minister van Financiën voert overleg met de Algemene Rekenkamer over de bij of krachtens deze wet te stellen
      regels, met uitzondering van de regels over:
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
  - number: 7.40.3.a
    text: |-
      het inrichten van de rijksbegroting, bedoeld in [artikel 4.20, eerste lid, aanhef en onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 7.40.3.b
    text: |-
      het begrotingsproces, bedoeld in [artikel 4.20, eerste lid, aanhef en onderdeel b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 7.40.3.c
    text: |-
      het begrotingsbeheer, bedoeld in [artikel 4.20, eerste lid, aanhef en onderdeel d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 7.40.3.d
    text: |-
      de financiële administratie voor zover het de begrotingsadministratie betreft, bedoeld in
      [artikel 4.20, eerste lid, aanhef en onderdeel e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel4
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '6'
  - number: 7.40.4
    text: |-
      Onze Minister die het aangaat verbindt een redelijke termijn aan het overleg met de Algemene Rekenkamer, bedoeld in
      het eerste tot en met derde lid.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.40
  - number: 7.41.1
    text: 'Bij de Algemene Rekenkamer berustende informatie is openbaar, tenzij:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.41
  - number: 7.41.1.1°
    text: |-
      een van de uitzonderingen van de [artikelen 5.1][ref1] of [5.2 van de Wet open overheid][ref2] aan de orde is, of


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.41
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 7.41.1.2°
    text: de Algemene Rekenkamer de informatie in het kader van haar wettelijke taakuitoefening heeft verzameld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.41
  - number: 7.41.2
    text: |-
      Voor zover een aan de Algemene Rekenkamer gericht verzoek op grond van de [Wet open overheid][ref1] betrekking
      heeft op van een orgaan, persoon of college als bedoeld in [artikel 2.2 van die wet][ref2] aan de Algemene
      Rekenkamer afkomstige informatie ten behoeve van een onderzoek, zendt de Algemene Rekenkamer het verzoek ter
      behandeling door aan het orgaan, de persoon of het college.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.41
    references:
      - id: ref1
        bwb_id: BWBR0045754
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '2'
  - number: '7.42'
    text: |-
      In afwijking van [artikel 7.41, eerste lid][ref1], kan de Algemene Rekenkamer door onderzoek verkregen informatie
      in het rapport verwerken als zij dat nodig oordeelt en de uitzonderingen van de [artikelen 5.1][ref2] of
      [5.2 van de Wet open overheid][ref3] naar haar oordeel niet aan de orde zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0045754#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0045754#Artikel5
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel7.42
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0045754
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0045754
        artikel: '5'
  - number: 8.1.1
    text: |-
      Onverminderd de [artikelen 7, eerste lid][ref1], en
      [8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref2] kan, indien buitengewone omstandigheden
      dit noodzakelijk maken, bij koninklijk besluit, op voordracht van Onze Minister-President, aan Onze Minister van
      Financiën de bevoegdheid worden verleend om regels te stellen in afwijking van deze wet en de wetten, bedoeld in
      [artikel 2.11, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007981#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007981
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0039429
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 8.1.2
    text: |-
      Wanneer het besluit, bedoeld in het eerste lid, is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer der Staten-Generaal gezonden over het voortduren van de werking van de bij dat besluit in werking gestelde
      bepaling.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel8.1
  - number: 8.1.3
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel8.1
  - number: 8.1.4
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste
      lid in werking is gesteld, buiten werking gesteld, zodra de omstandigheden dit naar het oordeel van de regering
      toelaten.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel8.1
  - number: 8.1.5
    text: |-
      Het besluit, bedoeld in het eerste, derde en vierde lid, wordt op de daarin te bepalen wijze bekendgemaakt. Het
      besluit treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel8.1
  - number: 8.1.6
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het Staatsblad.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel8.1
  - number: '10.1'
    text: |-
      Onze Minister van Financiën zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een
      verslag over de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.1
  - number: 10.2.1
    text: |-
      De bepalingen van de [Comptabiliteitswet 2001][ref1] en de daarop berustende bepalingen zoals deze golden voor de
      inwerkingtreding van deze wet blijven van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0013891
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0013891
  - number: 10.2.1.a
    text: |-
      de begrotingen en de suppletoire begrotingen, jaarverslagen en rapporten die met deze begrotingen samenhangen, voor
      zover de begrotingen voor de inwerkingtreding van deze wet bij de Tweede Kamer der Staten-Generaal zijn ingediend;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
  - number: 10.2.1.b
    text: |-
      de besluiten betreffende de aanwijzing als baten-lastenagentschap of verplichtingen-kasagentschap, bedoeld
      in de [artikelen 10][ref1] en [11a van de Comptabiliteitswet 2001][ref2], voor zover de besluiten voor de
      inwerkingtreding van deze wet zijn genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel11a
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: 11a
  - number: 10.2.1.c
    text: |-
      de besluiten betreffende de aanwijzing tot het aanhouden van liquide middelen in de schatkist van
      het Rijk of het uitzetten van liquide middelen, bedoeld in de [artikelen 24, zesde lid][ref1], en
      [45 van de Comptabiliteitswet 2001][ref2], voor zover de besluiten voor de inwerkingtreding van deze wet zijn
      genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel45
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '45'
  - number: 10.2.1.d
    text: |-
      de privaatrechtelijke rechtshandelingen, bedoeld in de [artikelen 32][ref1], [34][ref2] en
      [34a van de Comptabiliteitswet 2001][ref3], voor zover de rechtshandelingen voor de inwerkingtreding van deze wet
      zijn verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0013891#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0013891#Artikel34a
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0013891
        artikel: '34'
      - id: ref3
        bwb_id: BWBR0013891
        artikel: 34a
  - number: 10.2.1.e
    text: |-
      de bevoegdheden van de Algemene Rekenkamer, bedoeld in [hoofdstuk VII van de Comptabiliteitswet 2001][ref1], voor
      zover de bevoegdheden voor de inwerkingtreding van deze wet zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0013891
        hoofdstuk: VII
  - number: 10.2.2
    text: 'De bepalingen van deze wet zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
  - number: 10.2.2.a
    text: |-
      de begrotingen en de suppletoire begrotingen, jaarverslagen en rapporten die met deze begrotingen samenhangen, voor
      zover de begrotingen voor de inwerkingtreding van deze wet bij de Tweede Kamer der Staten-Generaal zijn ingediend;
    url: https://wetten.overheid.nl/BWBR0039429/2022-12-31#Artikel10.2
  - number: 10.2.2.b
    text: |-
      de privaatrechtelijke rechtshandelingen, bedoeld in de [artikelen 32][ref1], [34][ref2] en
