---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: wet_op_het_centraal_bureau_en_de_centrale_commissie_voor_de_statistiek
regulatory_layer: WET
publication_date: '2003-12-18'
valid_from: '2001-09-01'
bwb_id: BWBR0008005
url: https://wetten.overheid.nl/BWBR0008005/2001-09-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is bij wet regels te stellen omtrent de instelling van het
    Centraal bureau voor de statistiek en de Centrale commissie voor de statistiek, alsmede inzake de verwerving, het
    gebruik en de verstrekking van gegevens in het kader van de statistische informatievoorziening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Economische Zaken;

      b. CBS: het Centraal bureau voor de statistiek;

      c. commissie: de Centrale commissie voor de statistiek;

      d. directeur-generaal: de directeur-generaal van de statistiek.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel1
  - number: '2'
    text: Er is een Centraal bureau voor de statistiek, dat ressorteert onder Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel2
  - number: '3'
    text: |-
      Het CBS heeft tot taak het verrichten van statistisch onderzoek ten behoeve van praktijk, beleid en wetenschap en
      het openbaar maken van de op grond van zodanig onderzoek samengestelde statistieken.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel3
  - number: '4'
    text: |-
      1 Aan het hoofd van het CBS staat een directeur-generaal met de titel van directeur-generaal van de statistiek.

      2 Bij het openvallen van het ambt van de directeur-generaal of van diens plaatsvervanger doet de commissie een
      aanbeveling voor de vervulling van deze functie aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel4
  - number: '5'
    text: |-
      1 De directeur-generaal stelt ten minste eenmaal in de vier jaren een meerjarenprogramma op.

      2 In het meerjarenprogramma wordt op hoofdlijnen vastgelegd welke werkzaamheden het CBS in de komende jaren zal
      uitvoeren.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel5
  - number: '6'
    text: |-
      1 De directeur-generaal stelt jaarlijks voor 1 november een werkprogramma voor het tweede volgende kalenderjaar op.
      Hij kan het werkprogramma tussentijds wijzigen.

      2 In het werkprogramma wordt vastgelegd welke werkzaamheden het CBS in een bepaald jaar zal uitvoeren, voor zover
      de beschikbare middelen dat toelaten.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel6
  - number: '7'
    text: |-
      1 De directeur-generaal legt het meerjarenprogramma, het werkprogramma, alsmede de wijzigingen in het
      werkprogramma, ter goedkeuring voor aan de commissie.

      2 De directeur-generaal legt het meerjarenprogramma, het werkprogramma, alsmede de wijzigingen in het
      werkprogramma, na goedkeuring door de commissie, ter inzage bij het CBS gedurende de periode waarvoor zij gelden.
      Hiervan doet hij mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel7
  - number: '8'
    text: |-
      De directeur-generaal bepaalt de methoden waarmee de in de werk- en meerjarenprogramma's opgenomen onderzoeken
      worden uitgevoerd, alsmede de wijze waarop de resultaten van die onderzoeken worden openbaar gemaakt. Onze Minister
      geeft hem hiertoe geen aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel8
  - number: '9'
    text: |-
      1 Het CBS is bevoegd ten behoeve van statistische doeleinden gebruik te maken van gegevens uit registraties
      bij instellingen en diensten van het Rijk. De uitoefening van deze bevoegdheid door het CBS geschiedt in
      overeenstemming met Onze minister onder wie de betrokken registratie ressorteert.

      2 Het CBS kan het sociaal-fiscaalnummer, bedoeld in
      [artikel artikel 2, derde lid, onderdeel j, van de Algemene wet inzake rijksbelastingen][ref1], opnemen in een
      persoonsregistratie en daarvan gebruik maken ten behoeve van statistische doeleinden. Het CBS kan het sociaal-
      fiscaalnummer gebruiken in contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het
      gebruik van dat nummer in een persoonsregistratie.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel2
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '2'
  - number: 9a
    text: |-
      Het CBS kan ten behoeve van statistische doeleinden persoonsgegevens als bedoeld
      in[ artikel 16 van de Wet bescherming persoonsgegevens][ref1] verwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: '10'
    text: |-
      1 Met inachtneming van een goede vervulling van zijn in [artikel 3][ref1] bedoelde taak draagt het CBS er zorg voor
      dat de verwerving van gegevens op zodanige wijze geschiedt dat de daaruit voortvloeiende administratieve lasten
      voor ondernemingen en instellingen zo laag mogelijk zijn.

      2 De commissie ziet er bij de beoordeling van het in [artikel 6][ref2] bedoelde werkprogramma op toe dat het CBS
      gevolg geeft aan het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008005#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008005#Artikel6
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008005
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008005
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '11'
    text: |-
      1 De door het CBS in het kader van de uitoefening van zijn taak ontvangen gegevens worden uitsluitend gebruikt voor
      statistische doeleinden.

      2 De in het eerste lid bedoelde gegevens worden niet verstrekt aan anderen dan degenen die belast zijn met de
      uitvoering van de taak van het CBS.

      3 De in het eerste lid bedoelde gegevens worden slechts zodanig openbaar gemaakt dat daaraan geen herkenbare
      gegevens over een afzonderlijke persoon, onderneming of instelling, dan wel een afzonderlijk huishouden kunnen
      worden ontleend, tenzij, ingeval het gegevens met betrekking tot een onderneming of instelling betreft, er een
      gegronde reden is om aan te nemen dat bij de betrokken onderneming of instelling geen bedenkingen bestaan tegen
      de openbaarmaking.

      4 In afwijking van het eerste en tweede lid kunnen gegevens worden verstrekt aan een officier of een hulpofficier
      van Justitie ten behoeve van de handhaving van dit artikel.

      5 Het bepaalde in het eerste tot en met het vierde lid laat onverlet het bepaalde in de artikelen 4 en 5 van de wet
      van 28 december 1936, houdende maatregelen tot het verkrijgen van juiste economische statistieken (*Stb*. 639 DD).
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel11
  - number: '12'
    text: |-
      In afwijking van [artikel 11][ref1] verstrekt het CBS gegevens aan een dienst of een instelling, ingesteld
      of opgericht bij of krachtens het Verdrag tot oprichting van de Europese Gemeenschap, voor zover daartoe een
      verplichting geldt ingevolge een op grond van dat verdrag vastgestelde verordening, richtlijn of beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0008005#Artikel11
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008005
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '13'
    text: |-
      1 In afwijking van het bepaalde in [artikel 11, eerste en tweede lid][ref1], kan het CBS op verzoek, ten behoeve
      van statistisch of wetenschappelijk onderzoek, een verzameling van gegevens met betrekking waartoe passende
      maatregelen zijn genomen om herkenning van afzonderlijke personen, huishoudens, ondernemingen of instellingen te
      voorkomen, verstrekken aan een dienst, organisatie of instelling als bedoeld in het tweede lid van dit artikel.

      2 Een verzameling van gegevens als bedoeld in het eerste lid kan worden verstrekt aan:

      a. een universiteit in de zin van de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2];

      b. een bij wet ingestelde organisatie of instelling voor wetenschappelijk onderzoek;

      c. het Centraal Planbureau en het Sociaal en Cultureel Planbureau;

      d. het Bureau voor de Statistiek van de Europese Gemeenschappen;

      e. andere diensten, organisaties en instellingen, voor zover daartoe machtiging van de commissie is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0008005#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008005
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0005682
  - number: '14'
    text: |-
      Het CBS willigt een verzoek om verstrekking van gegevens als bedoeld in [artikel 13][ref1] slechts in, indien
      de verzoeker naar het oordeel van het CBS voldoende maatregelen heeft getroffen om te voorkomen dat aan hem te
      verstrekken gegevens voor andere werkzaamheden dan statistisch of wetenschappelijk onderzoek worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008005#Artikel13
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008005
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '6'
  - number: '15'
    text: |-
      Het CBS kan in incidentele gevallen werkzaamheden voor derden verrichten. Onze Minister ziet er op toe dat de in de
      eerste volzin genoemde werkzaamheden niet leiden tot concurrentievervalsing ten opzichte van private aanbieders van
      vergelijkbare diensten.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel15
  - number: '16'
    text: Er is een Centrale commissie voor de statistiek.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel16
  - number: '17'
    text: |-
      De commissie heeft tot taak:

      a. het bevorderen van de coördinatie van de statistische informatievoorziening van rijkswege;

      b. het bevorderen van de nauwkeurigheid en de volledigheid van de van rijkswege openbaar te maken statistieken.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel17
  - number: '18'
    text: |-
      1 De commissie draagt uit eigen beweging of op verzoek van Onze Minister het verrichten van een statistisch
      onderzoek en het openbaar maken van de op grond van zodanig onderzoek samengestelde statistieken, op aan de
      directeur-generaal. De directeur-generaal is verplicht aan de opdracht van de commissie te voldoen.

      2 De directeur-generaal kan tegen een uit eigen beweging door de commissie gegeven opdracht beroep instellen bij
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel18
  - number: '19'
    text: |-
      Spoedeisende gevallen uitgezonderd wordt door een van Onze ministers slechts een nieuw statistisch onderzoek
      ingesteld of in een onderzoek dat reeds plaatsvindt wijziging gebracht, nadat de commissie is gehoord.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel19
  - number: '20'
    text: |-
      1 De commissie bestaat uit de voorzitter en een even aantal overige leden dat ten minste zes en ten hoogste tien
      bedraagt.

      2 De secretaris, tevens adviserend lid, van de commissie is een door de directeur-generaal aangewezen ambtenaar van
      het CBS.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel20
  - number: '21'
    text: |-
      1 De voorzitter en de overige leden van de commissie worden bij koninklijk besluit benoemd en ontslagen. Bij
      koninklijk besluit wordt een lid aangewezen als plaatsvervangend voorzitter.

      2 De voordracht tot de benoeming van de leden doet Onze Minister na een aanbeveling daartoe door de commissie.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel21
  - number: '22'
    text: |-
      1 De leden worden benoemd voor een periode van vier jaren. Zij kunnen, behoudens in bijzondere gevallen, slechts
      eenmaal worden herbenoemd.

      2 Bij tussentijdse beëindiging van het lidmaatschap treedt het lid dat wordt benoemd ter vervulling van de
      opengevallen plaats af op het tijdstip waarop degene in wiens plaats hij is benoemd, had moeten aftreden. Hij is
      terstond herbenoembaar.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel22
  - number: '23'
    text: |-
      1 De commissie stelt een reglement van orde vast dat, evenals de wijzigingen daarin, de goedkeuring van Onze
      Minister behoeft.

      2 De commissie komt jaarlijks ten minste tweemaal bijeen.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel23
  - number: '24'
    text: |-
      Ter uitvoering van haar taak kan de commissie zich rechtstreeks tot derden wenden tot het verkrijgen van de
      inlichtingen die zij behoeft.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel24
  - number: '25'
    text: |-
      De commissie kan de voorbereiding van bepaalde beslissingen, dan wel beslissingen op een bepaald terrein, opdragen
      aan al dan niet uit haar midden ingestelde subcommissies of aan de directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel25
  - number: '26'
    text: |-
      De voorzitter van de commissie kan in spoedeisende gevallen de in [artikel 7, eerste lid][ref1], bedoelde
      bevoegdheid van de commissie, voor zover het een wijziging van het werkprogramma betreft, en de in de
      [artikelen 18][ref2] en [19][ref3] bedoelde bevoegdheden uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0008005#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0008005#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0008005#Artikel19
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008005
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008005
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008005
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '27'
    text: |-
      1 Stukken van of namens de commissie uitgaande, worden door de voorzitter en de secretaris ondertekend.

      2 De secretaris is voor de uitoefening van zijn taak uitsluitend verantwoording schuldig aan de commissie.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel27
  - number: '28'
    text: Beslissingen van de commissie worden genomen overeenkomstig het standpunt van de meerderheid van de leden.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel28
  - number: '29'
    text: |-
      De commissie verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage verlangen van zakelijke gegevens en bescheiden voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel29
  - number: '30'
    text: |-
      1 De directeur-generaal dient jaarlijks voor 1 maart een begroting van de inkomsten en uitgaven van het CBS voor
      het volgende kalenderjaar in bij Onze Minister. De commissie ontvangt een afschrift van de begroting.

      2 De commissie dient jaarlijks voor 1 maart bij Onze Minister een begroting van haar uitgaven voor het volgende
      kalenderjaar in.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel30
  - number: '31'
    text: |-
      1 De directeur-generaal zendt jaarlijks voor 1 mei aan de commissie een verslag van de werkzaamheden van het CBS
      in het afgelopen kalenderjaar. Het verslag verschaft tevens inzicht in de administratieve lasten in dat jaar voor
      ondernemingen en instellingen als gevolg van de verwerving van gegevens door het CBS, in de voorzieningen die het
      CBS heeft getroffen ingevolge [artikel 10][ref1] en in de mate van terugdringing van de administratieve lasten.

      2 De commissie zendt jaarlijks voor 1 juni aan Onze Minister een verslag van haar werkzaamheden in het afgelopen
      kalenderjaar, met bijvoeging van het in het eerste lid bedoelde verslag van de werkzaamheden van het CBS.

      3 De in het eerste en tweede lid bedoelde verslagen worden na de in het tweede lid genoemde datum ter inzage gelegd
      bij het CBS gedurende acht weken. Hiervan doet de directeur-generaal mededeling in de Staatscourant.

      4 Onze Minister zendt onverwijld een afschrift van de in het eerste en tweede lid bedoelde verslagen aan de Tweede
      Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008005#Artikel10
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008005
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '32'
    text: |-
      Telkens binnen zes jaar brengt de commissie een rapport uit aan Onze Minister waarin de taakvervulling van de
      commissie aan een onderzoek wordt onderworpen en voorstellen kunnen worden gedaan voor gewenste veranderingen.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel32
  - number: '33'
    text: |-
      Bij de eerste benoeming van de leden van de commissie na inwerkingtreding van deze wet doet Onze Minister de
      voordracht zonder een aanbeveling daartoe door de commissie.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel33
  - number: '34'
    text: |-
      Het koninklijk besluit van 9 januari 1899 betreffende het Centrale Bureau en de Centrale Commissie voor de
      Statistiek, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel34
  - number: '35'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de tweede kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Wet op het Centraal bureau en de Centrale commissie voor de statistiek.'
    url: https://wetten.overheid.nl/BWBR0008005/2001-09-01#Artikel36
