preamble:
  text: |-
    Gelet op artikel 19, derde en vierde lid, van de Zeevaartbemanningswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De Minister kan de erkenning van een training namens hem laten uitvoeren door een erkende certificerende
      instelling.

      2 Het instituut dat de training verzorgt, beschikt over een kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel1
  - number: '2'
    text: |-
      1 De aanvraag voor een erkenning van een training wordt door het bevoegd gezag van het betrokken trainingsinstituut
      schriftelijk ingediend bij de Minister of bij een aangewezen certificerende instelling.

      2 Voor elke training wordt een afzonderlijke aanvraag ingediend.

      3 De aanvraag gaat ten minste vergezeld van de volgende gegevens:

      a. de naam van de training waarvoor de erkenning wordt gevraagd;

      b. de naam van het opleidingsinstituut;

      c. het tijdens de training te gebruiken lesmateriaal;

      d. een lesplan, dat inzicht geeft in de inhoud en tijdsduur van de training en de te volgen examenprocedure;

      e. een voorbeeld van het na een succesvolle voltooiing van de training uit te reiken diploma, certificaat of
      getuigschrift;

      f. een overzicht van de docenten en hun kwalificaties, die bevoegd zijn de training of een deel ervan te verzorgen,
      en

      g. een afschrift van het door de instelling gehanteerde kwaliteitssysteem, alsmede een rapport betreffende het
      functioneren ervan opgemaakt door een van het instituut onafhankelijke instantie of certificerende instelling.

      4 De aanvraag gaat voorzover van toepassing vergezeld van een opgave van de voor de training te gebruiken
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel2
  - number: '3'
    text: |-
      Het bijwonen van een training door een aangewezen ambtenaar of een vertegenwoordiger van de certificerende
      instelling kan deel uit maken van de beoordelingsprocedure.
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel3
  - number: '4'
    text: |-
      1 Trainingen worden erkend indien zij ten minste voldoen aan de criteria die zijn vastgelegd in richtlijn nr.
      2008/106/EG van het Europees Parlement en de Raad van de Europese Unie van 19 november 2008 inzake het minimum
      opleidingsniveau van zeevarenden (PbEU L 323).

      2 In aanvulling op de criteria, bedoeld in het eerste lid, moet de werking van het kwaliteitssysteem van een
      instituut dat een training verzorgt, zijn beoordeeld door een van dit instituut onafhankelijke instantie.

      3 De training en examinering voldoen aan de eisen die met betrekking daartoe zijn vastgelegd
      in het [Besluit zeevarenden handelsvaart en zeilvaart][ref1], onderscheidenlijk in het
      [Besluit zeevisvaartbemanning][ref2]

      4 Het bevoegd gezag van een instelling beschikt over een systeem van registratie van alle studenten die met goed
      gevolg een training aan de instelling hebben afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0012778
      [ref2]: https://wetten.overheid.nl/BWBR0012790
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012778
      - id: ref2
        bwb_id: BWBR0012790
  - number: '5'
    text: De erkenning geschiedt voor de duur van ten hoogste vijf jaren.
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel5
  - number: '6'
    text: |-
      In het belang van een training kan een onderdeel van de training in een ander instituut plaatsvinden. Laatstbedoeld
      instituut dient, voorzover het dit onderdeel betreft, erkend te zijn in de zin van deze regeling.
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel6
  - number: '7'
    text: |-
      Indien een simulator deel uitmaakt van de onderwijsmethode van een training dient deze te voldoen aan de
      betreffende eisen die gesteld worden in sectie A-I/12, deel 1, van de STCW-Code.
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel7
  - number: '8'
    text: |-
      De Minister kan een erkenning intrekken, indien:

      a. er niet meer voldaan wordt aan de eisen gesteld aan het verlenen van de erkenning;

      b. er bij een tussentijdse controle blijkt dat sprake is van dusdanige tekortkomingen dat de kwaliteit van de
      training niet langer is gegarandeerd;

      c. de certificerende instelling, bedoeld in [artikel 4, tweede lid][ref1], de Minister adviseert de certificering
      in te trekken dan wel niet te verlengen, of de onafhankelijke instantie de werking van het kwaliteitssysteem als
      onvoldoende beoordeelt.


      [ref1]: https://wetten.overheid.nl/BWBR0013363#Artikel4
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013363
        artikel: '4'
  - number: '9'
    text: |-
      Bij beëindiging van de desbetreffende opleidingen wordt de registratie overgedragen aan de Minister, die deze
      registratie gedurende ten minste vijftig jaar bewaart.
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Erkenningsregeling trainingen zeevaartbemanning.'
    url: https://wetten.overheid.nl/BWBR0013363/2014-05-03#Artikel10
