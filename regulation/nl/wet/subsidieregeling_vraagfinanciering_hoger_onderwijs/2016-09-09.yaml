  - number: '17'
    text: |-
      1 De [artikelen 1 tot en met 9][ref1], [10, eerste tot en met het vierde lid, en zesde lid][ref2], [11][ref3],
      [12][ref4], [13, eerste lid][ref5], [15][ref6] en 17 van deze regeling treden in werking met ingang van de dag na
      de datum van uitgifte van de Staatscourant waarin hij wordt geplaatst.

      2 De [artikelen 10, vijfde lid][ref7], [13, tweede en derde lid][ref8], [14][ref9] en [16][ref10] treden in werking
      op het moment dat het experiment vraagfinanciering hoger onderwijs in werking treedt.

      3 Deze regeling vervalt met ingang van 1 februari 2025.


