preamble:
  text: |-
    Gelet op artikel 2, eerste lid, onderdeel a, en artikel 4 van de Wet overige OCW-subsidies, artikel 6.2 van de Wet
    op het hoger onderwijs en wetenschappelijk onderzoek en artikel 4:81 van de Algemene wet bestuursrecht;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0037056/2016-09-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *Ad-programma:* Ad-programma als bedoeld in [artikel 7.8a van de wet][ref1] of waarvoor een toets nieuwe
      opleiding als bedoeld in [artikel 5a.13 van de wet][ref2] is aangevraagd;
        - *bacheloropleiding:* bacheloropleiding als bedoeld in [artikel 7.3a, tweede lid, onderdeel a, van de wet][ref3],
      tenzij het tegendeel blijkt, of waarvoor een toets nieuwe opleiding als bedoeld in [artikel 5a.11 van de wet][ref4]
      is aangevraagd;
        - *bekostigde hogeschool:* hogeschool als bedoeld in [artikel 1.8 van de wet][ref5];
        - *collegegeld:* instellingscollegegeld als bedoeld in [artikel 7.46 van de wet][ref6] voor studenten die deelnemen
      aan een module;
        - *deeltijds Ad-programma:* Ad-programma dat deeltijds is ingericht;
        - *deeltijdse bacheloropleiding:* bacheloropleiding die deeltijds is ingericht als bedoeld in
      [artikel 7.7, eerste lid, van de wet][ref7];
        - *duaal Ad-programma:* Ad-programma dat duaal is ingericht;
        - *duale bacheloropleiding:* bacheloropleiding die duaal is ingericht als bedoeld in
      [artikel 7.7, tweede lid, van de wet][ref8];
        - *experiment vraagfinanciering hoger onderwijs:* het eventueel met ingang van het collegejaar 2016–2017 te starten
      experiment op het terrein van vraagfinanciering;
        - *graad:* graad Bachelor als bedoeld in [artikel 7.10a, tweede lid, van de wet][ref9];
        - *hoger beroepsonderwijs:* hoger beroepsonderwijs als bedoeld in [artikel 1.1, onderdeel d, van de wet][ref10];
        - *hogescholen:* hogescholen als bedoeld in [artikel 1,2, onderdeel a, van de wet][ref11] en rechtspersonen voor
      hoger onderwijs als bedoeld in artikel 1.2, onderdeel b, van de wet die hoger beroepsonderwijs verzorgen;
        - *minister:* Minister van Onderwijs, Cultuur en Wetenschap;
        - *module:* module als bedoeld in [artikel 3, tweede lid][ref12];
        - *opleiding:* opleiding als bedoeld in [artikel 1.1, onderdeel m, van de wet][ref13];
        - *rechtspersoon voor hoger onderwijs:* rechtspersoon als bedoeld in [artikel 1.1, onderdeel aa, van de wet][ref14];
        - *sector:* onderdeel als bedoeld in [artikel 3.1 van het Uitvoeringsbesluit WHW 2008][ref15];
        - *studiejaar:* tijdvak dat aanvangt op 1 september en eindigt op 31 augustus van het daaropvolgende jaar;
        - *studiepunt:* studiepunt als bedoeld in [artikel 7.4, eerste lid, van de wet][ref16];
        - *verlaagd collegegeld:* verlaagd collegegeld als bedoeld in [artikel 6][ref17];
        - *voucher:* aanspraak op subsidie ten behoeve van de vermindering van collegegeld, bedoeld in
      [artikel 3, derde lid][ref18];
        - *wet:* [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref19];
        - *wettelijk collegegeld:* wettelijk collegegeld als bedoeld in [artikel 7.45a van de wet][ref20].


