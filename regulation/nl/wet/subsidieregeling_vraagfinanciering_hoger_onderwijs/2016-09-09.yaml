  - number: '7'
    text: |-
      1 Een hogeschool die bereid is deel te nemen aan een eventueel per 1 september 2016 te starten experiment op het
      terrein van vraagfinanciering, dient uiterlijk 15 oktober 2015 een aanvraag in voor een subsidie als bedoeld in
      [artikel 3][ref1].

      2 Een hogeschool die bereid is deel te nemen aan het experiment vraagfinanciering per 1 september 2017 dient een
      aanvraag in voor een subsidie als bedoeld in [artikel 3][ref2] voor 1 februari 2017.

      3 Een hogeschool die bereid is deel te nemen aan het experiment vraagfinanciering per 1 september 2018 dient een
      aanvraag in voor een subsidie als bedoeld in [artikel 3][ref3] voor 1 februari 2018.

      4 De aanvraag van een bekostigde hogeschool wordt ingediend overeenkomstig het model, opgenomen in de bij deze
      regeling behorende [bijlage 2][ref4].

      5 De aanvraag van een rechtspersoon voor hoger onderwijs wordt ingediend overeenkomstig het model, opgenomen in de
      bij deze regeling behorende [bijlage 3][ref5].

      6 De aanvraag van een hogeschool omvat een toelichting op het overleg dat heeft plaatsgevonden met
      werkgeversorganisaties over onderwijsbehoeften van werkgevers en werknemers en het daarbij passende onderwijsaanbod
      en cofinanciering.

      7 Per post wordt de aanvraag ingediend bij het Ministerie van Onderwijs, Cultuur en Wetenschap, directie
      HO&S, postbus 16375, 2500 BJ Den Haag. Elektronische indiening vindt plaats via het e-mailadres ‘experiment
      vraagfinanciering-ho@minocw.nl’.


