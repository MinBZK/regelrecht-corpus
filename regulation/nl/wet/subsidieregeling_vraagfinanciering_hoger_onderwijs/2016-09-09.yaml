  - number: '4'
    text: |-
      De minister verstrekt subsidie als bedoeld in [artikel 3][ref1] onder de voorwaarden dat:

      a. de aanvrager afziet van diens aanspraak op bekostiging voor het betreffende hoger onderwijs,
      bedoeld in [artikel 1.9 van de wet][ref2] voor zover het de studentgebonden financiering, bedoeld in
      [artikel 4.7 van het Uitvoeringsbesluit WHW 2008][ref3] betreft;

      b. de aanvrager bereid is deel te nemen aan een in 2016 te starten experiment op het terrein van vraagfinanciering.


