  - number: '10'
    text: |-
      1 Een hogeschool meldt voor 1 september van een jaar de hoogte van het collegegeld voor een module per opleiding of
      Ad-programma in het studiejaar dat aanvangt op 1 september van dat jaar.

      2 De hogeschool schrijft de student pas in nadat het verschuldigde collegegeld voor een module door de student
      is voldaan.

      3 Nadat een student is ingeschreven meldt de rechtspersoon voor hoger onderwijs onverwijld aan de minister naam,
      geboortedatum, geslacht, adres en woonplaats van de student.

      4 De hogeschool besteedt een voucher uitsluitend aan de verlaging van het collegegeld met de waarde van de voucher
      voor een module dat moet worden betaald door een student als bedoeld in [artikel 3][ref1].

      5 De hogeschool bewaart de onderwijsovereenkomsten die naar verwachting worden gevraagd op grond van het experiment
      vraagfinanciering hoger onderwijs in ieder geval tot 1 februari 2025.

      6 De hogeschool mag het bedrag van de voucher niet in geld uitkeren aan de student.


      [ref1]: https://wetten.overheid.nl/BWBR0037056#Artikel3
