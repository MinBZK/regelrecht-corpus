  - number: '8'
    text: |-
      Onverminderd [artikel 4:35 van de Algemene wet bestuursrecht][ref1] kan de subsidie worden geweigerd indien:

      a. de bekostigde hogeschool voor het hoger beroepsonderwijs, waarvoor subsidie is gevraagd, niet afziet van
      de aanspraak op de bekostiging, bedoeld in [artikel 1.9 van de wet][ref2] voor zover het de studentgebonden
      financiering, bedoeld in [artikel 4.7 van het Uitvoeringsbesluit WHW 2008][ref3] betreft,

      b. in de sector gezondheidszorg, gedrag & maatschappij (‘Zorg en Welzijn’) of in de sector techniek en
      sectoroverstijgend voor zover het een ICT-bacheloropleiding betreft (‘Techniek en ICT’) minder dan drie
      bekostigde hogescholen een aanvraag hebben ingediend en in aanmerking komen voor een subsidie als bedoeld in
      [artikel 3][ref4],

      c. in de betreffende sector geen representatieve verhouding is tussen bacheloropleidingen en Ad-programma’s gegeven
      op een bekostigde hogeschool en een rechtspersoon voor hoger onderwijs,

      d. de bacheloropleiding of het Ad-programma niet is geaccrediteerd, een herstelperiode toegekend heeft gekregen of
      geen onderwerp is van een toets nieuwe opleiding, of

      e. de aanvraag een andere opleiding dan een opleiding als bedoeld in [bijlage 1][ref5] betreft.


