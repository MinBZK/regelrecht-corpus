  - number: '12'
    text: |-
      1 De minister betaalt de subsidieontvanger een bedrag van ten hoogste € 1.250,– vermenigvuldigd met het aantal bij
      de minister gemelde inschrijvingen, bedoeld in [artikel 3][ref1], in het voorafgaande kwartaal dat loopt van:

      a. september tot en met november;

      b. december tot en met februari;

      c. maart tot en met mei;

      d. juni tot een met augustus.

      2 De betaling van de subsidie, bedoeld in het eerste lid, vindt jaarlijks plaats onderscheidenlijk in de volgende
      maanden:

      a. januari;

      b. april;

      c. juli;

      d. oktober.

      3 De minister verstrekt de subsidieontvanger een bedrag ter hoogte van € 3.333,– vermenigvuldigd met het aantal bij
      de minister gemelde verleende graden, bedoeld in [artikel 3][ref2], in het voorafgaande kwartaal dat loopt van:

      a. september tot en met november;

      b. december tot en met februari;

      c. maart tot en met mei;

      d. juni tot een met augustus.

      4 De betaling van de subsidie, bedoeld in het derde lid, vindt jaarlijks onderscheidenlijk in de maanden, bedoeld
      in het tweede lid, plaats.


      [ref1]: https://wetten.overheid.nl/BWBR0037056#Artikel3
