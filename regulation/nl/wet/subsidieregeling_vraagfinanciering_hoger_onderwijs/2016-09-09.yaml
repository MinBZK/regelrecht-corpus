  - number: '3'
    text: |-
      1 De minister kan aan hogescholen subsidie verstrekken voor:

      a. het aanbieden van duale of deeltijdse bacheloropleidingen als bedoeld in [bijlage 1][ref1] dan wel duale of
      deeltijdse Ad-programma’s als bedoeld in bijlage 1 in de sectoren gezondheidszorg, gedrag & maatschappij, techniek
      en sectoroverstijgend voor zover het een ICT-bacheloropleiding betreft, en

      b. het verlenen van een graad aan een student die deze graad heeft behaald door het volgen van modules.

      2 De minister verstrekt subsidie als bedoeld in het eerste lid, onderdeel a, voor het aanbieden van
      bacheloropleidingen of Ad-programma’s die vestigingsplaatsonafhankelijk kunnen worden aangeboden en in modules van
      30 studiepunten worden aangeboden aan een student die:

      a. nieuw in een bacheloropleiding of ad-programma instroomt vanaf de start van het experiment vraagfinanciering tot
      en met 31 augustus 2019,

      b. niet meer dan één opleiding of Ad-programma volgt waarvoor de student wettelijk collegegeld of verlaagd
      collegegeld is verschuldigd, en

      c. onverminderd [artikel 7.45a, tweede lid, van de wet][ref2], voldoet aan de vereisten, bedoeld in artikel 7.45a,
      eerste lid, van de wet.

      3 De te verstrekken subsidie, bedoeld in het eerste lid, onderdeel a, wordt verstrekt in de vorm van een voucher en
      betreft steeds ten hoogste € 1.250,– per student per module met dien verstande dat:

      a. een student ten hoogste acht modules kan volgen met subsidie tot 31 augustus 2024,

      b. de studiepunten behorend bij de voorafgaande module van betreffende bacheloropleiding of Ad-programma zijn
      behaald of de hogeschool heeft vastgesteld dat voldoende studievoortgang is geboekt, en

      c. bij niet meer dan twee opeenvolgende modules van dezelfde bacheloropleiding of hetzelfde Ad-programma de
      studiepunten niet volledig zijn behaald.

      4 In afwijking van het derde lid betreft de subsidie minder dan € 1.250,– als het collegegeld lager is dan dit
      bedrag. De voucher is dan evenveel waard als het collegegeld.

      5 De subsidie, bedoeld in het eerste lid, onderdeel b, bedraagt € 3.333,– per graad. Deze subsidie wordt ten
      hoogste een keer per student als bedoeld in het tweede lid verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037056
