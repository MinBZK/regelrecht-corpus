  - number: '6'
    text: |-
      1 De subsidie, bedoeld in [artikel 3, eerste lid, onderdeel a][ref1], wordt besteed aan de verlaging van het
      collegegeld dat moet worden betaald door een student als bedoeld in artikel 3 met een bedrag van ten hoogste
      € 1.250,–.

      2 Indien de middelen verkregen door de inschrijving van een student met een voucher door de hogeschool ondoelmatig
      worden aangewend, kan het door de student ingezette vouchertegoed worden teruggevorderd van de hogeschool. Van
      ondoelmatige aanwending is in ieder geval sprake indien de student met een voucher op enigerlei wijze wordt
      gecompenseerd.

      3 Indien de situatie, bedoeld in het tweede lid, zich anders dan incidenteel voordoet, kan de minister de
      vouchertegoeden die de hogeschool als gevolg van inschrijvingen door studenten met een voucher heeft ontvangen,
      terugvorderen van de hogeschool.


      [ref1]: https://wetten.overheid.nl/BWBR0037056#Artikel3
