  - number: '13'
    text: |-
      1 Indien het experiment vraagfinanciering hoger onderwijs niet op 1 september 2016 in werking treedt, kan de
      minister de subsidieverstrekking op grond van deze regeling beëindigen.

      2 Indien een subsidieontvanger de deelname aan het experiment vraagfinanciering hoger onderwijs om welke reden dan
      ook beëindigt, kan de minister de subsidie op grond van deze regeling geheel of gedeeltelijk intrekken.

      3 Het eerste lid is van overeenkomstige toepassing in geval de minister het experiment vraagfinanciering bij een
      subsidieontvanger tussentijds beëindigt.
    url: https://wetten.overheid.nl/BWBR0037056/2016-09-09#Artikel13
  - number: '14'
    text: |-
      1 Voor zover het een bekostigde hogeschool betreft, geschiedt de verantwoording van de subsidie in het jaarverslag
      overeenkomstig de [Regeling jaarverslaggeving onderwijs][ref1].

      2 Tot twee jaar na het jaar van betaling, bedoeld in [artikel 12][ref2], toont de hogeschool op verzoek van de
      minister aan dat de activiteiten waarvoor subsidie is verstrekt, zijn verricht en dat aan de aan de subsidie
      verbonden verplichtingen is voldaan. De hogeschool toont dit in elk geval aan door de onderwijsovereenkomsten
      die naar verwachting worden gevraagd op grond van het experiment vraagfinanciering hoger onderwijs, door gegevens
      waaruit blijkt dat de module daadwerkelijk is aangeboden en door gegevens over behaalde studiepunten.


      [ref1]: https://wetten.overheid.nl/BWBR0023132
      [ref2]: https://wetten.overheid.nl/BWBR0037056#Artikel12
    url: https://wetten.overheid.nl/BWBR0037056/2016-09-09#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023132
      - id: ref2
        bwb_id: BWBR0037056
        artikel: '12'
  - number: '15'
    text: |-
      De minister stelt de subsidie, bedoeld in [artikel 3][ref1], vast op het moment van betaling als bedoeld in
      [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037056#Artikel3
