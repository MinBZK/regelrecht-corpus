---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: vrijstellingsregeling_ectoparasiticiden
regulatory_layer: WET
publication_date: '2005-12-29'
valid_from: '2002-01-01'
bwb_id: BWBR0007184
url: https://wetten.overheid.nl/BWBR0007184/2002-01-01
preamble:
  text: |-
    in overeenstemming met de Minister van Volksgezondheid, Welzijn en Sport;

    Gelet op de artikelen 3 en 45 van de Diergeneesmiddelenwet;

    Gezien het advies van de Koninklijke Nederlandse Maatschappij voor Diergeneeskunde (KNMvD), het Landbouwschap en de
    Vereniging van Fabrikanten en Importeurs van Diergeneesmiddelen in Nederland (Fidin);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              *wet:*


              [Diergeneesmiddelenwet][ref1];




              *regeling:*


              Regeling registratie diergeneesmiddelen 1995;




              *commissie:*


              Commissie Registratie Diergeneesmiddelen;




              *bureau:*


              Bureau Registratie Diergeneesmiddelen;




              *ectoparasiticiden:*


              middelen die door uitwendige toepassing op dieren dienen tot bestrijding of afwering van op dieren
      voorkomende insekten of mijten.


      [ref1]: https://wetten.overheid.nl/BWBR0003818
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003818
  - number: '2.1'
    text: |-
      Ectoparasiticiden, waarvoor ingevolge de [Bestrijdingsmiddelenwet 1962][ref1] uiterlijk op 31 december 1994 een
      toelating is verleend, zijn vanaf 1 januari 1995 van een registratie als bedoeld in [artikel 2 van de wet][ref2]
      vrijgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0003818#Artikel2
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002380
      - id: ref2
        bwb_id: BWBR0003818
        artikel: '2'
  - number: '2.2'
    text: 'De vrijstelling vervalt indien:'
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel2
  - number: 2.2.a
    text: |-
      geen melding als bedoeld in [artikel 4][ref1] is gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0007184#Artikel4
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007184
        artikel: '4'
        paragraaf: '2'
  - number: 2.2.b
    text: |-
      geen aanvraag als bedoeld in [artikel 5][ref1] is ingediend, of


      [ref1]: https://wetten.overheid.nl/BWBR0007184#Artikel5
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007184
        artikel: '5'
        paragraaf: '2'
  - number: 2.2.c
    text: |-
      op de onder b bedoelde aanvraag een beslissing ingevolge [artikel 3 van de wet][ref1] is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel3
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '3'
  - number: '3.1'
    text: |-
      De behandeling van ingevolge de [Bestrijdingsmiddelenwet 1962][ref1] in behandeling genomen aanvragen tot eerste
      toelating van ectoparasiticiden wordt door de commissie overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: '3.2'
    text: De commissie schorst vóór 1 maart 1995 de behandeling van deze aanvragen.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel3
  - number: '3.3'
    text: |-
      Bij de schorsing doet de commissie opgave van de gegevens en de kosten die de in het eerste lid bedoelde aanvraag
      tot een geldige aanvraag als bedoeld in artikel 8 van de regeling maken.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel3
  - number: '3.4'
    text: Vanaf het moment van de schorsing van de behandeling is de regeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Degene die op 31 december 1994 ingevolge de [Bestrijdingsmiddelenwet 1962][ref1] houder was van een toelating
      van ectoparasiticiden meldt vóór 1 maart 1995 aan het bureau dat voor die middelen een aanvraag overeenkomstig
      [artikel 5][ref2] wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0007184#Artikel5
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002380
      - id: ref2
        bwb_id: BWBR0007184
        artikel: '5'
        paragraaf: '2'
  - number: '4.2'
    text: Onverminderd artikel 22 van de regeling is voor het behandelen van de melding een bedrag van € 408,40 verschuldigd.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
  - number: '4.3'
    text: 'Bij de melding wordt gevoegd:'
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
  - number: 4.3.a
    text: een ingevuld meldingsformulier;
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
  - number: 4.3.b
    text: |-
      een kopie van het toelatingsbesluit ingevolge de [Bestrijdingsmiddelenwet 1962][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 4.3.c
    text: het etiket dat op 31 december 1994 is gevoerd, en
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
  - number: 4.3.d
    text: een betalingsbewijs van het in het tweede lid bedoelde bedrag.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
  - number: '4.4'
    text: In afwijking van artikel 5 van de regeling geldt de melding als voorlopige aanvraag.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
  - number: '4.5'
    text: Het meldingsformulier is als bijlage opgenomen.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      Uiterlijk op 30 juni 1997 wordt een volledige aanvraag tot registratie als bedoeld in artikel 5 van de regeling van
      de in [artikel 2, eerste lid][ref1], bedoelde ectoparasiticiden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0007184#Artikel2
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007184
        artikel: '2'
        paragraaf: '2'
  - number: '5.2'
    text: |-
      In afwijking van artikel 6, eerste lid, van de regeling worden de dossiers binnen twee weken na de eerste oproep
      aan het bureau gezonden, maar uiterlijk op 30 juni 1998, waarna een beslissing omtrent de behandeling van de
      aanvraag wordt genomen.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      In afwijking van artikel 14 van de regeling kan de commissie in bijzondere omstandigheden eenmaal de behandeling
      schorsen voor maximaal zes maanden.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel5
  - number: '6'
    text: |-
      De bij de toelating ingevolge de [Bestrijdingsmiddelenwet 1962][ref1] vastgestelde voorwaarden zijn van toepassing
      op ectoparasiticiden als bedoeld in [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002380
      [ref2]: https://wetten.overheid.nl/BWBR0007184#Artikel2
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002380
      - id: ref2
        bwb_id: BWBR0007184
        artikel: '2'
        paragraaf: '2'
  - number: '7.1'
    text: |-
      Degenen die op 31 december 1994 ectoparasiticiden bereiden, verpakken, etiketteren of afleveren zijn vanaf 1
      januari 1995 voor die middelen vrijgesteld van een vergunning als bedoeld in [artikel 21 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel21
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '21'
  - number: '7.2'
    text: 'De vrijstelling vervalt indien:'
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel7
  - number: 7.2.a
    text: |-
      zij ter zake van deze handelingen niet blijven voldoen aan hetgeen op 31 december 1994 ingevolge de
      [Bestrijdingsmiddelenwet 1962][ref1] hieromtrent gold;


      [ref1]: https://wetten.overheid.nl/BWBR0002380
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002380
  - number: 7.2.b
    text: |-
      zij geen aanvraag als bedoeld in [artikel 2 van de Regeling vergunningen diergeneesmiddelen][ref1] hebben ingediend
      op 30 juni 1996, of


      [ref1]: https://wetten.overheid.nl/BWBR0006386#Artikel2
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006386
        artikel: '2'
  - number: 7.2.c
    text: |-
      op de onder b bedoelde aanvraag een beslissing ingevolge [artikel 23 van de wet][ref1] is genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel23
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '23'
  - number: '9'
    text: Deze regeling treedt in werking met ingang van 1 januari 1995.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel9
  - number: '10'
    text: |-
      Deze regeling wordt aangehaald als: Vrijstellingsregeling ectoparasiticiden. Deze regeling zal met de toelichting
      in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007184/2002-01-01#Artikel10
