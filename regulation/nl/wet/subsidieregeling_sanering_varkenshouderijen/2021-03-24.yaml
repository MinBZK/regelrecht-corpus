  - number: '6'
    text: |-
      1 De aanvraag van de varkenshouder wordt afgewezen indien:

      a. de varkenshouder niet daadwerkelijk varkens voor productie heeft gehouden op de varkenshouderijlocatie of de
      daarvoor gebruikte productiecapaciteit niet onafgebroken gedurende de vijf jaren voorafgaande aan de aanvraag op
      bedrijfseconomisch gangbare wijze gebruikt is;

      b. de omgevingsvergunning milieu of de omgevingsvergunning beperkte milieutoets, of de op de varkenshouderijlocatie
      gebruikte huisvestingssystemen niet voldoet respectievelijk niet voldoen aan de vereisten van het
      [Besluit emissiearme huisvesting][ref1] die gelden tot 1 januari 2020.

      2 De aanvraag kan worden afgewezen indien de varkenshouder niet voldoet of niet heeft voldaan aan de wettelijke
      vereisten voor het houden van varkens.


      [ref1]: https://wetten.overheid.nl/BWBR0036748
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0036748
  - number: '7'
    text: |-
      De subsidie omvat:

      a. een bijdrage in verband met het geheel of gedeeltelijk vervallen van het varkensrecht; en

      b. een bijdrage in verband met het verlies van de waarde van de voor het houden van varkens op de
      varkenshouderijlocatie gebruikte productiecapaciteit als gevolg van de onomkeerbare sluiting van de
      varkenshouderijlocatie.
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel7
  - number: '8'
    text: |-
      1 De in [artikel 7, onderdeel a][ref1], bedoelde bijdrage bedraagt 100% van de waarde van het geheel of
      gedeeltelijk vervallen varkensrecht, voor zover dat vervallen varkensrecht niet meer bedraagt dan het varkensrecht
      dat vereist is voor het houden van 100% van het aantal varkens, uitgedrukt in varkenseenheden, dat gemiddeld in de
      periode vanaf 1 januari 2018 tot 1 januari 2019 op de varkenshouderijlocatie is gehouden.

      2 De in het eerste lid bedoelde waarde wordt bepaald op basis van:

      a. de actuele waarde van het varkensrecht benodigd voor een varkenseenheid in het concentratiegebied waar de
      varkenshouderijlocatie is gelegen; en

      b. het gedeelte van het varkensrecht dat vervalt.

      3 De minister stelt met het oog op de toepassing van dit artikel voor elk van de concentratiegebieden de
      actuele waarde van het varkensrecht benodigd voor een varkenseenheid vast aan de hand van de actuele marktprijs
      en maakt deze bedragen uiterlijk bekend op de dag voor de aanvang van de openstellingsperiode, bedoeld in
      [artikel 10, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0042634#Artikel10
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel8
