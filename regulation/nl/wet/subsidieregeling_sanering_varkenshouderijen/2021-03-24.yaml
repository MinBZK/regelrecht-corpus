  - number: '12'
    text: |-
      De minister stelt het bevoegd gezag, bedoeld in [artikel 5, onder d][ref1], er van in kennis dat van de betreffende
      aanvrager een aanvraag op grond van deze regeling is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel5
