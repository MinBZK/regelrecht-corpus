  - number: '13'
    text: |-
      1 De minister verdeelt het in [artikel 10, tweede lid][ref1], bedoelde subsidieplafond op volgorde van
      rangschikking van de aanvragen.

      2 De minister rangschikt een aanvraag hoger naarmate de geurscore van de desbetreffende varkenshouderijlocatie
      hoger is.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel10
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0042634
        artikel: '10'
        paragraaf: '4'
  - number: '14'
    text: |-
      De minister stelt het bevoegd gezag, bedoeld in [artikel 5, onder d][ref1], er van in kennis dat de aanvraag van de
      betreffende aanvrager is toegewezen of afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel5
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0042634
        artikel: '5'
        paragraaf: '2'
  - number: '15'
    text: |-
      1 De subsidieontvanger voldoet aan:

      a. het vereiste, vermeld in [artikel 5, onder g][ref1], binnen acht weken na de subsidieverlening;

      b. de vereisten, vermeld in [artikel 5, onder a, b, c, d, e en f][ref2], binnen acht maanden na de
      subsidieverlening;

      c. het vereiste, vermeld in [artikel 5, onder h][ref3], binnen 24 maanden na de subsidieverlening.

      2 Het afbreken en verwijderen van de productiecapaciteit, bedoeld in [artikel 5, onder h][ref4],
      vindt niet eerder plaats dan nadat de minister heeft geconstateerd dat uitvoering is gegeven aan de in
      [artikel 5, onder a, b, c, d, e en f][ref5], bedoelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel5
