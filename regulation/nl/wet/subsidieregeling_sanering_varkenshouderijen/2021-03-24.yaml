articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *concentratiegebied:* concentratiegebied Zuid of concentratiegebied Oost zoals aangegeven in
      [bijlage I bij de Meststoffenwet][ref1];
        - *dierenverblijf:* een overdekte ruimte waarbinnen dieren worden gehouden;
        - *geurgevoelig object:* een in de Basisregistratie adressen en gebouwen opgenomen verblijfsobject met een
      woonfunctie, dat niet een bedrijfswoning is van een landbouwondernemingvoor het houden van landbouwhuisdieren
      en dat op grond van het bestemmingsplan, bedoeld in [artikel 3.1 van de Wet ruimtelijke ordening][ref2],
      een inpassingsplan als bedoeld in [artikel 3.26][ref3] of [3.28 van die wet][ref4] daaronder
      mede begrepen, de beheersverordening, bedoeld in [artikel 3.38 van die wet][ref5], of, indien met
      toepassing van [artikel 2.12, eerste lid, van de Wet algemene bepalingen omgevingsrecht][ref6]
      van het bestemmingsplan of de beheersverordening is afgeweken, de omgevingsvergunning, bedoeld in
      [artikel 1.1, eerste lid, van laatstgenoemde wet][ref7], mag worden gebruikt voor menselijk wonen of menselijk
      verblijf;
        - *geurscore:* een maat voor de omvang van de geurbelasting van een varkenshouderijlocatie op geurgevoelige
      objecten in de omgeving van de varkenshouderijlocatie, zoals bepaald op grond van [artikel 2][ref8];
        - *intensieve veehouderij:* een landbouwonderneming voor het houden van varkens, pluimvee, konijnen, vleeskalveren,
      vleesstieren, geiten of nertsen;
        - *landbouwonderneming:* onderneming waarin de primaire productie van landbouwproducten plaatsvindt;
        - *minister:* de Minister van Landbouw, Natuur en Voedselkwaliteit;
        - *omgevingsvergunning beperkte milieutoets:* vergunning als bedoeld in
      [artikel 2.1, eerste lid, onder i, van de Wet algemene bepalingen omgevingsrecht][ref9];
        - *omgevingsvergunning milieu:* vergunning verleend krachtens
      [artikel 2.1, eerste lid, onderdeel e, van de Wet algemene bepalingen omgevingsrecht][ref10];
        - *productiecapaciteit:* dierenverblijven, mest- en voersilo’s en mestkelders;
        - *varkenshouder:* een ondernemer of onderneming die een varkenshouderij in stand houdt;
        - *varkenshouderij:* een landbouwonderneming voor het houden van varkens die voldoet aan de in bijlage I bij
      Verordening (EU) nr. 702/2014 vastgestelde criteria;
        - *varkenshouderijlocatie:* een plaats waar een varkenshouderij is gevestigd;
        - *varkensrecht:* het varkensrecht, bedoeld in [artikel 1, eerste lid, onderdeel y, van de Meststoffenwet][ref11].


