        artikel: '19'
  - number: '5'
    text: |-
      Er is sprake van een onomkeerbare sluiting van een varkenshouderijlocatie zoals bedoeld in [artikel 4][ref1]
      indien:

      a. niet langer varkens op de varkenshouderijlocatie worden gehouden;

      b. de meststoffen van varkens zijn verwijderd van de varkenshouderijlocatie;

      c. overeenkomstig [artikel 31, eerste lid, Meststoffenwet][ref2] de varkenshouder een kennisgeving van het geheel
      of gedeeltelijk vervallen van zijn varkensrecht heeft gedaan, waarbij ten minste het gedeelte van het varkensrecht
      vervalt dat vereist is voor het houden van 80% van het aantal varkens, uitgedrukt in varkenseenheden, dat gemiddeld
      in de periode vanaf 1 januari 2018 tot 1 januari 2019 op de varkenshouderijlocatie is gehouden;

      d. al naar gelang de toepasselijke verplichtingen op grond van de [Wet algemene bepalingen omgevingsrecht][ref3] en
      de [Wet milieubeheer][ref4]:

      1°. de varkenshouder, indien hij meldingsplichtig is voor de varkenshouderijlocatie op grond van het
      [Activiteitenbesluit milieubeheer][ref5], bij het bevoegd gezag melding heeft gedaan dat hij op de
      varkenshouderijlocatie niet langer varkens houdt en evenmin andere diersoorten die bij intensieve veehouderij
      gehouden kunnen worden en, indien de varkenshouder op grond van de [Wet algemene bepalingen omgevingsrecht][ref6]
      tevens dient te beschikken over een omgevingsvergunning beperkte milieutoets, het bevoegd gezag de
      omgevingsvergunning beperkte milieutoets heeft ingetrokken; of

      2°. het bevoegd gezag de omgevingsvergunning milieu voor de varkenshouderijlocatie heeft ingetrokken of zodanig
      heeft aangepast dat het niet langer is toegestaan op de varkenshouderijlocatie varkens te houden en evenmin andere
      diersoorten die bij intensieve veehouderij gehouden kunnen worden;

      e. in het geval de varkenshouder voor de varkenshouderijlocatie beschikt over een vergunning als bedoeld
      in [artikel 2.7, tweede lid, van de Wet natuurbescherming][ref7] gedeputeerde staten deze vergunning heeft
      ingetrokken, of, in het geval de varkenshouder andere activiteiten op de veehouderijlocatie gaat verrichten, door
      een wijziging van de vergunning of anderszins naar het oordeel van de minister voldoende zeker is gesteld dat de
      andere activiteiten geen substantiële stikstofemissie opleveren;

      f. het bevoegde bestuursorgaan van de gemeente binnen de grenzen waarvan de varkenshouderijlocatie zich bevindt,
      een verzoek van de varkenshouder in behandeling heeft genomen om het bestemmingsplan zodanig aan te passen dat op
      de locatie niet langer een intensieve veehouderij kan worden gevestigd;

      g. de varkenshouder zich met gebruikmaking van de in [bijlage 2][ref8] opgenomen modelovereenkomst met de Staat der
      Nederlanden heeft verbonden om:

      1°. niet langer op de varkenshouderijlocatie varkens te houden en ook geen andere diersoorten die bij intensieve
      veehouderij gehouden kunnen worden, noch als persoon, noch tezamen met anderen in de vorm van een rechtspersoon
      of samenwerkingsverband;

      2°. zeker te stellen dat na al dan niet tijdelijke overdracht of ingebruikgeving van de varkenshouderijlocatie
      of een deel daarvan aan een verkrijger of gebruiker evenmin op die locatie varkens worden gehouden of andere
      diersoorten die bij intensieve veehouderij gehouden kunnen worden;

      3°. geen varkens te gaan houden op een andere locatie dan waar hij ten tijde van de aanvraag reeds een
      varkenshouderijlocatie heeft; en

      h. de voor het houden van varkens op de varkenshouderijlocatie gebruikte productiecapaciteit is afgebroken en
      verwijderd.


