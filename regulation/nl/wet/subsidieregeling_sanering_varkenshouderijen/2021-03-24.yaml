  - number: '10'
    text: |-
      1 Subsidieaanvragen kunnen worden ingediend in de periode van 25 november 2019 tot en met 15 januari 2020.

      2 Het subsidieplafond voor de verstrekking van subsidies op aanvragen die zijn ingediend in de in het eerste lid
      bedoelde periode, bedraagt € 450.000.000,–.
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel10
  - number: '11'
    text: |-
      1 Een aanvraag voor subsidie als bedoeld in [artikel 4][ref1] wordt ingediend bij de minister met gebruikmaking van
      een daartoe door de minister ter beschikking gesteld middel.

      2 De aanvraag bevat ten minste de volgende gegevens:

      a. gegevens over de aanvrager, waaronder contactgegevens en het nummer waaronder zijn onderneming geregistreerd is
      bij de Kamer van Koophandel;

      b. de varkenshouderijlocatie van de aanvrager waarop de aanvraag betrekking heeft;

      c. gegevens over de emissieparameters van het verspreidingsmodel V-Stacks gebied;

      d. het gemiddelde aantal varkens, uitgedrukt in varkenseenheden overeenkomstig de normen van
      [bijlage II bij de Meststoffenwet][ref2], dat op de varkenshouderijlocatie is gehouden in de periode van 1 januari
      2018 tot 1 januari 2019;

      e. het gedeelte van het varkensrecht, uitgedrukt in varkenseenheden, dat zal vervallen;

      f. een opgave of de aanvrager voor de varkenshouderijlocatie beschikt over een vergunning als bedoeld in
      [artikel 2.7, tweede lid, Wet natuurbescherming][ref3];

      g. een opgave van de voor het houden van varkens op de varkenshouderijlocatie gebruikte productiecapaciteit, met
      vermelding, voor zover het een dierenverblijf betreft, van:

      1°. de datum waarop voor het eerst landbouwhuisdieren in het dierenverblijf zijn gehouden, en

      2°. het aantal m2, uitgaand van de buitenmaten van het dierenverblijf.

      3 Bij de aanvraag worden de volgende bescheiden gevoegd:

      a. een kopie van, voor zover van toepassing, de melding op grond van het [Activiteitenbesluit milieubeheer][ref4],
      de omgevingsvergunning beperkte milieutoets of de omgevingsvergunning milieu, betreffende de varkenshouderijlocatie
      waarop de aanvraag betrekking heeft;

      b. een verklaring van de aanvrager dat:

      1°. hij daadwerkelijk varkens voor productie heeft gehouden;

      2°. de voor het houden van varkens op de varkenshouderijlocatie gebruikte productiecapaciteit onafgebroken
      gedurende de vijf jaren voorafgaand aan de beëindiging is gebruikt; en

      3°. de omgevingsvergunning milieu of de omgevingsvergunning beperkte milieutoets, of de op
      de varkenshouderijlocatie gebruikte huisvestingssystemen voldoen aan de vereisten van het
      [Besluit emissiearme huisvesting][ref5] die gelden tot 1 januari 2020;

      c. een actuele kaart van de varkenshouderijlocatie, met aanduiding van de voor het houden van varkens gebruikte
      productiecapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel4
