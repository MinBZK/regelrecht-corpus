  - number: '18'
    text: |-
      De aanvraag om subsidievaststelling wordt uiterlijk dertien weken na afloop van de in
      [artikel 15, eerste lid, onderdeel c][ref1], bedoelde termijn ingediend met gebruikmaking van een middel dat door
      de minister beschikbaar wordt gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel15
