  - number: '4'
    text: |-
      1 De minister kan een varkenshouder op aanvraag subsidie verstrekken voor de onomkeerbare sluiting van een
      varkenshouderijlocatie indien de geurscore van die locatie meer bedraagt dan 0,4 en voor zover die locatie is
      gelegen binnen een concentratiegebied.

      2 Voor subsidieverstrekking op grond van het eerste lid komt niet in aanmerking een varkenshouder die
      [artikel 19, eerste lid, van de Meststoffenwet][ref1] heeft overtreden.


      [ref1]: https://wetten.overheid.nl/BWBR0004054#Artikel19
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel4
