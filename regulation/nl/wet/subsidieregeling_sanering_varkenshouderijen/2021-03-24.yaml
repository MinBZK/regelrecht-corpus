  - number: '2'
    text: |-
      De geurscore van een varkenshouderijlocatie wordt bepaald met behulp van de volgende methode:

      a. de geurbelasting, uitgedrukt in odour units per kubieke meter lucht, van de varkenshouderij op geurgevoelige
      objecten binnen een straal van 1.000 meter vanaf het geometrisch gemiddelde van de emissiepunten van de
      varkenshouderijlocatie wordt berekend met het verspreidingsmodel V-Stacks gebied en met overeenkomstige toepassing
      van [artikel 2, tweede tot en met zesde lid, van de Regeling geurhinder en veehouderij][ref1];

      b. de voor deze geurgevoelige objecten berekende geurbelasting, voor zover deze ten minste 2,0 odour units per
      kubieke meter lucht bedraagt, wordt met toepassing van [bijlage 1][ref2] omgezet in een weegfactor per geurgevoelig
      object;

      c. de in onderdeel b bedoelde weegfactoren worden opgeteld tot de geurscore.


      [ref1]: https://wetten.overheid.nl/BWBR0020711#Artikel2
