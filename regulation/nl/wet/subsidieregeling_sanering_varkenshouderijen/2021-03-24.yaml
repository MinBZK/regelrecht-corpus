  - number: '19'
    text: |-
      Deze regeling treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel19
  - number: '20'
    text: 'Deze regeling wordt aangehaald als: Subsidieregeling sanering varkenshouderijen.'
