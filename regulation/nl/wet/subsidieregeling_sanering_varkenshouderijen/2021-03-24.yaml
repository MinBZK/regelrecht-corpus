  - number: '16'
    text: |-
      De subsidieontvanger verstrekt de minister op diens verzoek informatie over de uitvoering van de in
      [artikel 5][ref1] bedoelde vereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0042634#Artikel5
    url: https://wetten.overheid.nl/BWBR0042634/2021-03-24#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0042634
        artikel: '5'
        paragraaf: '2'
  - number: '17'
    text: |-
      1 De minister verstrekt de subsidieontvanger uiterlijk zes weken na ontvangst van de ondertekende overeenkomst,
      bedoeld in [artikel 5, onder g][ref1], een voorschot van 10% van het subsidiebedrag.

      2 De minister verstrekt de subsidieontvanger op aanvraag een voorschot van 70% van het subsidiebedrag uiterlijk
      zes weken nadat is vastgesteld dat uitvoering is gegeven aan de in [artikel 5, onder a, b, c, d, e en f][ref2],
      bedoelde vereisten.

      3 De in het tweede lid bedoelde aanvraag wordt ingediend met gebruikmaking van een daartoe door de minister ter
      beschikking gesteld middel en bevat ten minste:

      a. gegevens over de wijze waarop uitvoering is gegeven aan de in [artikel 5, onder a, b, c, d, e en f][ref3],
      bedoelde vereisten;

      b. een kopie van de kennisgeving over het geheel of gedeeltelijk vervallen van het varkensrecht, bedoeld in
      [artikel 5, onder c][ref4];

      c. een kopie van de in [artikel 8.41, vierde lid, van de Wet milieubeheer][ref5] bedoelde openbare kennisgeving van
      de melding, bedoeld in [artikel 5, onder d, onder 1°][ref6], respectievelijk van de beschikking tot intrekking of
      wijziging van de vergunning, bedoeld in artikel 5, onder d, onder 1° en 2°;

      d. in het geval de subsidieontvanger voor de varkenshouderijlocatie beschikt over een vergunning als bedoeld in
      [artikel 2.7, tweede lid, Wet natuurbescherming][ref7] een kopie van de beschikking tot intrekking of wijziging van
      die vergunning, bedoeld in [artikel 5, onder e][ref8];

      e. een kopie van het verzoek, bedoeld in [artikel 5, onder f][ref9], en van een bericht van de gemeente waaruit
      blijkt dat het verzoek in behandeling is genomen.


