  - number: '9'
    text: |-
      1 De in [artikel 7, onderdeel b][ref1], bedoelde bijdrage bedraagt 65% van de gecorrigeerde vervangingswaarde van
      de voor het houden van varkens op de varkenshouderijlocatie gebruikte productiecapaciteit.

      2 De gecorrigeerde vervangingswaarde, bedoeld in het eerste lid, wordt bepaald door per dierenverblijf het aantal
      m2 van het dierenverblijf te vermenigvuldigen met het bedrag dat in [bijlage 3][ref2] is vermeld, uitgaand van de
      levensduur, uitgedrukt in jaren en maanden, van de romp van het dierenverblijf op het tijdstip dat is voldaan aan
      de vereisten, vermeld in [artikel 5, onder a, b, c, d, e en f][ref3].


