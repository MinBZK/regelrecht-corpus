        paragraaf: '3.4'
  - number: 36a.3
    text: |-
      De [artikelen 40][ref1], [46, eerste, tweede, vierde en vijfde lid][ref2], en [54][ref3], [paragraaf 6.4][ref4] en
      [6.5][ref5], alsmede [artikel 63][ref6] zijn van overeenkomstige toepassing.


