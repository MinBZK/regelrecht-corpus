  - number: 6a
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder gegevens mede verstaan persoonsgegevens als bedoeld in
      de [Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: '7.1'
    text: 'Het college:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: 7.1.a
    text: |-
      ondersteunt bij arbeidsinschakeling personen, die algemene bijstand ontvangen, personen als bedoeld in artikel
      10, tweede lid, personen met een nabestaanden- of wezenuitkering op grond van de Algemene nabestaandenwet en niet-
      uitkeringsgerechtigden en, indien het college daarbij het aanbieden van een voorziening, waaronder begrepen sociale
      activering gericht op arbeidsinschakeling, noodzakelijk acht, bepaalt en biedt deze voorziening aan, en
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: 7.1.b
    text: |-
      verleent bijstand aan personen hier te lande die in zodanige omstandigheden verkeren of dreigen te geraken dat zij
      niet over de middelen beschikken om in de noodzakelijke kosten van het bestaan te voorzien.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: '7.2'
    text: |-
      Het college werkt bij de uitvoering van het eerste lid, onderdeel a, samen met het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: '7.3'
    text: 'Het eerste lid, aanhef en onderdeel a, is niet van toepassing op personen:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: 7.3.a
    text: jonger dan 27 jaar die uit ’s Rijks kas bekostigd onderwijs kunnen volgen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: 7.3.b
    text: |-
      als bedoeld in [artikel 41, vierde lid][ref1], die zich hebben gemeld om bijstand aan te vragen gedurende de vier
      weken na de melding, bedoeld in [artikel 44][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 7.3.c
    text: aan wie het Uitvoeringsinstituut werknemersverzekeringen een uitkering verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: '7.4'
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de
      belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het
      college kan de in de eerste volzin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: '7.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede tot en
      met vierde lid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: '7.6'
    text: |-
      Het eerste lid, aanhef en onderdeel b, is niet van toepassing indien het verlenen van bijstand op grond van
      [artikel 47a, eerste lid][ref1], tot de taak van de Sociale verzekeringsbank behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: '7.7'
    text: |-
      Het college en het Uitvoeringsinstituut werknemersverzekeringen kunnen overeenkomen dat het eerste lid, aanhef en
      onderdeel a, van toepassing is op de personen, bedoeld in het derde lid, onderdeel c. Daarnaast kunnen het college
      en het Uitvoeringsinstituut werknemersverzekeringen overeenkomen dat het college aan de personen, bedoeld in het
      derde lid, onderdeel c, een voorziening aanbiedt als bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
  - number: '7.8'
    text: |-
      Uitvoering van het eerste lid, aanhef en onderdeel a, door middel van [artikel 10a][ref1] is niet van toepassing op
      de persoon die jonger is dan 27 jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.1'
    text: 'De gemeenteraad stelt bij verordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
  - number: 8.1.a
    text: |-
      het ondersteunen bij arbeidsinschakeling en het aanbieden van voorzieningen gericht op arbeidsinschakeling, bedoeld
      in [artikel 7, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 8.1.b
    text: |-
      het verlagen van de bijstand, bedoeld in [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 8.1.c
    text: |-
      het verhogen en verlagen van de norm, bedoeld in [artikel 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel30
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 8.1.d
    text: |-
      het verlenen van een langdurigheidstoeslag als bedoeld in [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel36
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 8.1.e
    text: |-
      de scholing of opleiding, bedoeld in [artikel 10a, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.1.f
    text: |-
      de premie, bedoeld in [artikel 10a, zesde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.1.g
    text: |-
      het verlenen van de bijzondere bijstand, bedoeld in [artikel 35, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel35
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 8.1.h
    text: |-
      het verlagen van de bijstand, bedoeld in [artikel 9a, twaalfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 9a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.1.i
    text: |-
      de uitoefening van de bevoegdheid tot verrekening als bedoeld in [artikel 60b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel60b
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 60b
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '8.2'
    text: 'De regels, bedoeld in het eerste lid, hebben:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
  - number: 8.2.a
    text: |-
      voor zover het gaat om het eerste lid, onderdeel a, in ieder geval betrekking op de evenwichtige aandacht voor de
      in [artikel 7, eerste lid, onderdeel a][ref1], genoemde groepen, alsmede voor verschillende doelgroepen daarbinnen,
      en op de wijze waarop rekening wordt gehouden met zorgtaken;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 8.2.b
    text: |-
      voor zover het gaat om het eerste lid, onderdeel d, in ieder geval betrekking op de hoogte van de
      langdurigheidstoeslag en de wijze waarop invulling wordt gegeven aan de begrippen langdurig en laag inkomen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
  - number: 8.2.c
    text: |-
      voor zover het gaat om het eerste lid, onderdeel f, in ieder geval betrekking op de hoogte van de premie in relatie
      tot de armoedeval;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
  - number: 8.2.d
    text: |-
      voor zover het gaat om het eerste lid, onderdeel g, in ieder geval betrekking op de wijze waarop invulling wordt
      gegeven aan het begrip maatschappelijke participatie.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8
  - number: 8a
    text: |-
      De gemeenteraad stelt in het kader van het financiële beheer bij verordening regels voor de bestrijding van het ten
      onrechte ontvangen van bijstand alsmede van misbruik en oneigenlijk gebruik van de wet.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8a
  - number: 8b
    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref2], treedt dat bestuur voor de toepassing van deze wet, met uitzondering van
      [paragrafen 7.1][ref3] en [7.3][ref4], in de plaats van de betrokken colleges.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0015703
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref4
        bwb_id: BWBR0015703
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '9.1'
    text: |-
      De belanghebbende van 18 jaar of ouder doch jonger dan de pensioengerechtigde leeftijd is, vanaf de dag van melding
      als bedoeld in [artikel 44, tweede lid][ref1], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 9.1.a
    text: |-
      naar vermogen algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref1], te verkrijgen en deze te aanvaarden, waaronder begrepen registratie als
      werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen, indien hem daartoe het recht toekomt op grond
      van [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30b
  - number: 9.1.b
    text: |-
      gebruik te maken van een door het college aangeboden voorziening, waaronder begrepen sociale activering, gericht
      op arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling en,
      indien van toepassing, mee te werken aan het opstellen, uitvoeren en evalueren van een plan van aanpak als bedoeld
      in [artikel 44a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 44a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 9.1.c
    text: |-
      naar vermogen door het college opgedragen onbeloonde maatschappelijk nuttige werkzaamheden te verrichten die worden
      verricht naast of in aanvulling op reguliere arbeid en die niet leiden tot verdringing op de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
  - number: '9.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan het college in individuele gevallen tijdelijk ontheffing
      verlenen van een verplichting als bedoeld in het eerste lid. Zorgtaken kunnen als dringende redenen worden
      aangemerkt, voorzover hiermee geen rekening kan worden gehouden door middel van een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '9.3'
    text: |-
      Indien bijstand wordt verleend aan gehuwden gelden de verplichtingen, bedoeld in het eerste lid, voor ieder van
      hen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
  - number: '9.4'
    text: |-
      De verplichting om algemeen geaccepteerde arbeid te aanvaarden geldt voor de alleenstaande ouder met kinderen tot
      12 jaar slechts nadat het college zich genoegzaam heeft overtuigd van de beschikbaarheid van passende kinderopvang,
      de toepassing van voldoende scholing en de belastbaarheid van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
  - number: '9.5'
    text: |-
      De verplichtingen, bedoeld in het eerste lid, onderdelen a en b, zijn niet van toepassing op de persoon
      die blijkens een indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoort van de
      [Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 9a.1
    text: |-
      Onverminderd [artikel 9, tweede lid][ref1], verleent het college aan een alleenstaande ouder die de volledige zorg
      heeft voor een tot zijn last komend kind tot vijf jaar op diens verzoek ontheffing van de verplichting, bedoeld in
      artikel 9, eerste lid, onderdeel a.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.2
    text: De ontheffing, bedoeld in het eerste lid, wordt eenmalig verleend.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
  - number: 9a.3
    text: |-
      De ontheffing, bedoeld in het eerste lid, wordt niet verleend voor zover uit houding en
      gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat deze de verplichtingen, bedoeld in
      [artikel 9, eerste lid, onderdeel b][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.4
    text: |-
      De ontheffing, bedoeld in het eerste lid, geldt zolang het jongste kind van de alleenstaande ouder de leeftijd
      van vijf jaar nog niet heeft bereikt. Onverminderd de eerste zin geldt de ontheffing gedurende ten hoogste
      vijf jaar. Op deze periode worden in mindering gebracht de periode, dan wel perioden, waarin de alleenstaande
      ouder in de voorgaande woonplaats, dan wel in de voorgaande woonplaatsen, gebruik heeft gemaakt van de
      ontheffing, bedoeld in het eerste lid, alsmede de periode, dan wel perioden, waarin toepassing is gegeven aan
      [artikel 17, vierde lid, van de Wet investeren in jongeren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '17'
  - number: 9a.5
    text: 'De ontheffing, bedoeld in het eerste lid, wordt, indien de volledige duur van vijf jaar nog niet volledig is benut:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
  - number: 9a.5.a
    text: van rechtswege opgeschort, met ingang van de datum waarop het jongste kind de leeftijd van vijf jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
  - number: 9a.5.b
    text: van rechtswege opgeschort indien niet langer recht op bijstand bestaat;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
  - number: 9a.5.c
    text: |-
      door het college opgeschort op een daartoe strekkend verzoek van de alleenstaande ouder aan wie de ontheffing,
      bedoeld in het eerste lid, is verleend; of
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
  - number: 9a.5.d
    text: |-
      door het college ingetrokken indien uit houding en gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat
      hij zijn verplichtingen, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.6
    text: |-
      Op een daartoe strekkend verzoek van de alleenstaande ouder met een kind tot vijf jaar beëindigt het college een
      opschorting als bedoeld in het vijfde lid, onderdelen a tot en met c, indien de daarin genoemde omstandigheden niet
      langer van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
  - number: 9a.7
    text: |-
      Het college stelt binnen zes maanden na ontvangst van het verzoek, bedoeld in het eerste lid, een plan van
      aanpak op voor de invulling van de voorziening, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], voor de
      alleenstaande ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.8
    text: |-
      Het college verricht na het opstellen van het plan van aanpak, bedoeld in het zevende lid, iedere zes maanden
      een heronderzoek naar de in het van toepassing zijnde plan van aanpak opgenomen voorziening, bedoeld in
      [artikel 9, eerste lid, onderdeel b][ref1]. Het heronderzoek strekt zich mede uit tot de naleving van de in het van
      toepassing zijnde plan van aanpak opgenomen voorziening. Het college beoordeelt tevens bij het verrichten van het
      heronderzoek of er aanleiding bestaat de voorziening te wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.9
    text: |-
      Indien het heronderzoek, bedoeld in het achtste lid, daartoe aanleiding geeft stelt het college een gewijzigd plan
      van aanpak op.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
  - number: 9a.10
    text: |-
      Het college vult de voorziening, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], voor de alleenstaande ouder
      aan wie een ontheffing is verleend als bedoeld in het eerste lid en die niet beschikt over een startkwalificatie
      ten minste in met scholing of opleiding die de toegang tot de arbeidsmarkt bevordert, tenzij naar het oordeel van
      het college een dergelijke scholing of opleiding de krachten of bekwaamheden van de alleenstaande ouder te boven
      gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.11
    text: |-
      Op verzoek van de alleenstaande ouder die beschikt over een startkwalificatie en aan wie
      een ontheffing is verleend als bedoeld in het eerste lid, vult het college de voorziening,
      bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], in met een opleiding, als bedoeld in
      [artikel 7.2.2., tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref2], die de toegang tot de
      arbeidsmarkt bevordert, tenzij naar het oordeel van het college een dergelijke scholing of opleiding de krachten of
      bekwaamheden van de alleenstaande ouder te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 9a.12
    text: |-
      Het college verlaagt de bijstand overeenkomstig de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel h][ref1], indien het college de ontheffing, bedoeld in het eerste lid, heeft
      ingetrokken op grond van het vijfde lid, onderdeel d. Van een verlaging wordt afgezien, indien elke vorm van
      verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '10.1'
    text: |-
      Personen die algemene bijstand ontvangen, personen met een nabestaandenuitkering op grond van de
      [Algemene nabestaandenwet][ref1] en niet-uitkeringsgerechtigden hebben, overeenkomstig de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref2], aanspraak op ondersteuning bij arbeidsinschakeling en op de naar het
      oordeel van het college noodzakelijk geachte voorziening gericht op arbeidsinschakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '10.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op personen die vanwege een voorziening gericht op
      arbeidsinschakeling niet tot een van de groepen, bedoeld in het eerste lid, behoren.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10
  - number: '10.3'
    text: |-
      [Artikel 40, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 10a.1
    text: |-
      Het college kan ter uitvoering van [artikel 7, eerste lid, onderdeel a][ref1], degene die algemene bijstand
      ontvangt en voor wie de kans op inschakeling in het arbeidsproces gering is en die daardoor vooralsnog niet
      bemiddelbaar is op de arbeidsmarkt, onbeloonde additionele werkzaamheden laten verrichten gedurende maximaal twee
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 10a.2
    text: |-
      Onder additionele werkzaamheden als bedoeld in het eerste lid worden primair op de arbeidsinschakeling gerichte
      werkzaamheden verstaan die onder verantwoordelijkheid van het college in het kader van deze wet worden verricht
      naast of in aanvulling op reguliere arbeid, en die niet leiden tot verdringing op de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
  - number: 10a.3
    text: |-
      Voor de termijn van twee jaar, bedoeld in het eerste lid, worden werkzaamheden, verricht in het kader van een
      andere voorziening als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], voor maximaal zes maanden buiten
      beschouwing gelaten indien er naar het oordeel van het college een reëel uitzicht is op een dienstbetrekking bij
      degene bij wie de werkzaamheden worden verricht van dezelfde of grotere omvang die aanvangt tijdens of aansluitend
      op die zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 10a.4
    text: |-
      Voor de termijn van twee jaar, bedoeld in het eerste lid, worden werkzaamheden verricht voor 1 januari 2007, buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
  - number: 10a.5
    text: |-
      Het college biedt aan degene die op grond van dit artikel additionele werkzaamheden verricht en die niet beschikt
      over een startkwalificatie na een periode van zes maanden na aanvang van die werkzaamheden een voorziening gericht
      op arbeidsinschakeling aan in de vorm van scholing of opleiding die de toegang tot de arbeidsmarkt bevordert,
      tenzij naar het oordeel van het college een dergelijke scholing of opleiding de krachten of bekwaamheden van
      de belanghebbende te boven gaat. Geen scholing of opleiding wordt aangeboden indien scholing of opleiding naar
      het oordeel van het college niet bijdraagt aan vergroting van de kans op inschakeling in het arbeidsproces van
      belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
  - number: 10a.6
    text: |-
      Het college verstrekt aan belanghebbende, telkens nadat hij gedurende zes maanden op grond van dit artikel
      additionele werkzaamheden heeft verricht, een premie als bedoeld in [artikel 31, tweede lid, onderdeel j][ref1],
      indien hij naar het oordeel van het college in die zes maanden voldoende heeft meegewerkt aan het vergroten van
      zijn kans op inschakeling in het arbeidsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 10a.7
    text: |-
      Indien het college en het Uitvoeringsinstituut werknemersverzekeringen zijn overeengekomen dat
      [artikel 7, eerste lid, onderdeel a][ref1], van toepassing is op een persoon aan wie het Uitvoeringsinstituut
      werknemersverzekeringen een uitkering verstrekt, dient bij de toepassing van het eerste lid voor «algemene
      bijstand» te worden gelezen: uitkering van het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 10a.8
    text: |-
      Met betrekking tot degene die op grond van het eerste lid additionele werkzaamheden verricht, beoordeelt het
      college na een periode van negen maanden na de aanvang van die werkzaamheden of de toepassing van dit artikel zijn
      kans op inschakeling in het arbeidsproces heeft vergroot. Indien dat niet het geval is wordt het verrichten van de
      additionele werkzaamheden twaalf maanden na aanvang van die werkzaamheden beëindigd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
  - number: 10a.9
    text: |-
      Met betrekking tot degene die op grond van het eerste lid additionele werkzaamheden verricht, beoordeelt het
      college voor afloop van de termijn van twee jaar, bedoeld in het eerste lid, of de voortzetting daarvan met het
      oog op in de persoon gelegen factoren zijn kans op inschakeling in het arbeidsproces aanmerkelijk verbetert. Indien
      dat het geval is, kan het college de termijn van twee jaar verlengen met een jaar, onder de voorwaarde dat de
      belanghebbende in het derde jaar in een andere omgeving andere additionele werkzaamheden verricht dan die hij in de
      eerste twee jaar heeft verricht.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
  - number: 10a.10
    text: |-
      Indien de termijn van twee jaar is verlengd op grond van het negende lid, beoordeelt het college voor afloop van
      het derde jaar of de voortzetting daarvan met het oog op in de persoon gelegen factoren zijn kans op inschakeling
      in het arbeidsproces aanmerkelijk verbetert. Indien dat het geval is, kan het college de termijn nogmaals verlengen
      met een jaar.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel10a
  - number: '11.1'
    text: |-
      Iedere in Nederland woonachtige Nederlander die hier te lande in zodanige omstandigheden verkeert of dreigt te
      geraken dat hij niet over de middelen beschikt om in de noodzakelijke kosten van bestaan te voorzien, heeft recht
      op bijstand van overheidswege.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel11
  - number: '11.2'
    text: |-
      Met de Nederlander, bedoeld in het eerste lid, wordt gelijkgesteld de hier te lande
      woonachtige vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], met uitzondering van de gevallen,
      bedoeld in artikel 24, tweede lid, van [Richtlijn 2004/38/EG](32004L0038).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere hier te lande woonachtige vreemdelingen dan de in het tweede lid
      bedoelde voor de toepassing van deze wet met een Nederlander gelijk worden gesteld:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel11
  - number: 11.3.a
    text: ter uitvoering van een verdrag dan wel van een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel11
  - number: 11.3.b
    text: |-
      indien zij, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf
      hebben als bedoeld in artikel 8, onderdeel g of h, van die wet en zij aan de in die algemene maatregel van bestuur
      gestelde voorwaarden voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11.4'
    text: |-
      Het recht op bijstand komt de echtgenoten gezamenlijk toe, tenzij een van de echtgenoten geen recht op bijstand
      heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel11
  - number: '12'
    text: |-
      Een persoon van 18, 19 of 20 jaar heeft recht op bijzondere bijstand voorzover zijn noodzakelijke kosten van het
      bestaan uitgaan boven de bijstandsnorm en hij voor deze kosten geen beroep kan doen op zijn ouders, omdat:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel12
  - number: 12.a
    text: de middelen van de ouders daartoe niet toereikend zijn; of
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel12
  - number: 12.b
    text: hij redelijkerwijs zijn onderhoudsrecht jegens zijn ouders niet te gelde kan maken.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel12
  - number: '13.1'
    text: 'Geen recht op bijstand heeft degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.1.a
    text: aan wie rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.1.b
    text: die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.1.c
    text: die zijn militaire of vervangende dienstplicht vervult;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.1.d
    text: |-
      die wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voorzover diens gebrek aan middelen daarvan het
      gevolg is;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.1.e
    text: |-
      die per kalenderjaar langer dan vier weken verblijf houdt buiten Nederland dan wel een aaneengesloten periode van
      langer dan vier weken verblijf houdt buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.1.f
    text: die jonger is dan 18 jaar;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.1.g
    text: |-
      die bijstand vraagt ter gedeeltelijke of volledige aflossing van een schuldenlast en die overigens bij het ontstaan
      van de schuldenlast, dan wel nadien, beschikte of beschikt over de middelen om in de noodzakelijke kosten van het
      bestaan te voorzien.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: '13.2'
    text: 'Geen recht op algemene bijstand heeft degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.2.a
    text: van 18, 19 of 20 jaar die in een inrichting verblijft;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.2.b
    text: |-
      die onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die gehuwd
      is met een zodanig persoon, voor zover diens gebrek aan middelen daarvan het gevolg is, tenzij de belanghebbende
      alleenstaande ouder is en hij verlof geniet als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: 13.2.c
    text: 'die jonger is dan 27 jaar en uit ’s Rijks kas bekostigd onderwijs kan volgen en:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.2.c.1°
    text: |-
      in verband daarmee aanspraak heeft op studiefinanciering op grond van de [Wet op de studiefinanciering 2000][ref1],
      dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0011453
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011453
  - number: 13.2.c.2°
    text: in verband daarmee geen aanspraak heeft op studiefinanciering en dit onderwijs niet volgt;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: 13.2.d
    text: |-
      die jonger is dan 27 jaar en uit wiens houding en gedragingen ondubbelzinnig blijkt dat hij de verplichtingen,
      bedoeld in [artikel 9, eerste lid][ref1], of [artikel 55][ref2] niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel55
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '55'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: '13.3'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt
      buiten een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden of een
      inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].
      Het eerste lid, onderdelen a en b, is voor zover het het recht op bijzondere bijstand
      betreft, niet van toepassing op de persoon aan wie rechtens zijn vrijheid is ontnomen op
      grond van de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2], dan wel van
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref3] of, na ontslag van alle rechtsvervolging, van
      artikel 37b, eerste lid, van het Wetboek van Strafrecht en op de persoon die zich onttrekt aan de tenuitvoerlegging
      van een vrijheidsbenemende maatregel op grond van die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005700
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005700
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '37'
  - number: '13.4'
    text: |-
      In afwijking van het eerste lid, onderdeel e, geldt voor personen die de pensioengerechtigde leeftijd hebben
      bereikt, een periode van dertien weken.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel13
  - number: '14'
    text: 'In ieder geval worden niet tot de noodzakelijke kosten van het bestaan gerekend kosten met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel14
  - number: 14.a
    text: de voldoening aan alimentatieverplichtingen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel14
  - number: 14.b
    text: de betaling van een boete;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel14
  - number: 14.c
    text: geleden of toegebrachte schade;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel14
  - number: 14.d
    text: vrijwillige premiebetaling in het kader van een publiekrechtelijke verzekering;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel14
  - number: 14.e
    text: |-
      kosten van medische handelingen en verrichtingen die gerekend kunnen worden tot de ontwikkelingsgeneeskunde als
      bedoeld in de [Wet op bijzondere medische verrichtingen][ref1], of wanneer zodanige medische behandelingen en
      verrichtingen buiten Nederland plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008974
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008974
  - number: '15.1'
    text: |-
      Geen recht op bijstand bestaat voorzover een beroep kan worden gedaan op een voorliggende voorziening die, gezien
      haar aard en doel, wordt geacht voor de belanghebbende toereikend en passend te zijn. Het recht op bijstand strekt
      zich evenmin uit tot kosten die in de voorliggende voorziening als niet noodzakelijk worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel15
  - number: '15.2'
    text: |-
      Onder een beroep kunnen doen op een voorliggende voorziening, bedoeld in het eerste lid, wordt
      niet verstaan de mogelijkheid tot het doen van een verzoek om een voorschot als bedoeld in
      [artikel 22 van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel22
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '22'
  - number: '15.3'
    text: Dit lid, het tweede lid alsmede de aanduiding «1.» voor het eerste lid vervallen met ingang van 1 juli 2017.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel15
  - number: '16.1'
    text: |-
      Aan een persoon die geen recht op bijstand heeft, kan het college, gelet op alle omstandigheden, in afwijking van
      deze paragraaf, bijstand verlenen indien zeer dringende redenen daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel16
  - number: '16.2'
    text: |-
      Het eerste lid is niet van toepassing op andere vreemdelingen dan die, bedoeld in
      [artikel 11, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '17.1'
    text: |-
      De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling of het recht op bijstand. Deze verplichting geldt niet indien die feiten en omstandigheden door
      het college kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of
      kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt
      bepaald voor welke gegevens de tweede zin van toepassing is.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel17
  - number: '17.2'
    text: |-
      De belanghebbende verleent het college desgevraagd de medewerking die redelijkerwijs nodig is voor de uitvoering
      van deze wet, waaronder in ieder geval wordt verstaan het verlenen van medewerking aan een oproep om op een
      bepaalde plaats en tijd te verschijnen in verband met zijn arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel17
  - number: '17.3'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '17.4'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '18.1'
    text: |-
      Het college stemt de bijstand en de daaraan verbonden verplichtingen af op de omstandigheden, mogelijkheden en
      middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18
  - number: '18.2'
    text: |-
      Het college verlaagt de bijstand overeenkomstig de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel b][ref1], ter zake van het niet of onvoldoende nakomen door de belanghebbende
      van de verplichtingen voortvloeiende uit deze wet, met uitzondering van [artikel 17, eerste lid][ref2], waaronder
      begrepen het zich jegens het college zeer ernstig misdragen, dan wel indien de belanghebbende naar het oordeel
      van het college tekortschietend besef van verantwoordelijkheid betoont voor de voorziening in het bestaan. Van een
      verlaging wordt afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '18.3'
    text: |-
      Het college heroverweegt een besluit als bedoeld in het tweede lid binnen een door hem te bepalen termijn die ten
      hoogste drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18
  - number: '18.4'
    text: Bij de toepassing van het eerste lid wordt onder belanghebbende mede verstaan het gezin.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18
  - number: 18a.1
    text: |-
      Het college legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag
      wegens het niet of niet behoorlijk nakomen door de belanghebbende van de verplichting,
      bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2]. De
      bestuurlijke boete is niet lager dan de boete die op grond van het derde lid zou worden opgelegd indien er geen
      sprake was van een benadelingsbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 18a.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het bedrag dat als gevolg van het niet of niet behoorlijk
      nakomen van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], ten
      onrechte of tot een te hoog bedrag aan bijstand is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 18a.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door de belanghebbende van een verplichting
      als bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet heeft
      geleid tot een benadelingsbedrag, legt het college een bestuurlijke boete op van ten hoogste het bedrag van de
      tweede categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 18a.4
    text: |-
      Het college kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het derde lid en volstaan met
      het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen door de belanghebbende
      van een verplichting als bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], tenzij het
      niet of niet behoorlijk nakomen van de verplichtingen plaatsvindt binnen een periode van twee jaar te rekenen vanaf
      de datum waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 18a.5
    text: |-
      Het college legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door de belanghebbende
      van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], als gevolg
      waarvan ten onrechte of tot een te hoog bedrag aan bijstand is ontvangen, van ten hoogste 150 procent van het
      benadelingsbedrag indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van het begaan van de overtreding
      een eerdere bestuurlijke boete of strafrechtelijke sanctie is opgelegd wegens een eerdere overtreding, bestaande
      uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 18a.6
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de belanghebbende is gestraft met een onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
  - number: 18a.7
    text: 'Het college kan:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
  - number: 18a.7.a
    text: de bestuurlijke boete verlagen indien sprake is van verminderde verwijtbaarheid;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
  - number: 18a.7.b
    text: afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
  - number: 18a.8
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het college de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
  - number: 18a.9
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
  - number: 18a.10
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
  - number: 18a.11
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '19.1'
    text: |-
      Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op algemene bijstand indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.a
    text: het in aanmerking te nemen inkomen lager is dan de bijstandsnorm; en
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel19
  - number: 19.1.b
    text: er geen in aanmerking te nemen vermogen is.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel19
  - number: '19.2'
    text: De hoogte van de algemene bijstand is het verschil tussen het inkomen en de bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel19
  - number: '19.3'
    text: In de algemene bijstand is een vakantietoeslag begrepen ter hoogte van 4,8 procent  van die bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel19
  - number: '19.4'
    text: |-
      De algemene bijstand wordt verhoogd met de loonbelasting en premies volksverzekeringen waarvoor de gemeente die de
      bijstand verleent, krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '20.1'
    text: |-
      Voor belanghebbenden jonger dan 21 jaar zonder ten laste komende kinderen is de norm per kalendermaand, indien
      het betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: 20.1.a
    text: 'een alleenstaande van 18, 19 of 20 jaar: € 230,98 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: 20.1.b
    text: 'gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn: € 461,96 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: 20.1.c
    text: 'gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder: € 899,42 .'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: '20.2'
    text: |-
      Voor belanghebbenden jonger dan 21 jaar met een of meer ten laste komende kinderen is de norm per kalendermaand,
      indien het betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: 20.2.a
    text: 'een alleenstaande ouder van 18, 19 of 20 jaar: € 498,35 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: 20.2.b
    text: 'gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn: € 729,33 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: 20.2.c
    text: 'gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder: € 1 166,79 .'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel20
  - number: '21'
    text: |-
      Voor belanghebbenden van 21 jaar of ouder doch jonger dan de pensioengerechtigde leeftijd is de norm per
      kalendermaand, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel21
  - number: 21.a
    text: 'een alleenstaande: € 668,44 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel21
  - number: 21.b
    text: 'een alleenstaande ouder: € 935,81 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel21
  - number: 21.c
    text: 'gehuwden waarvan beide echtgenoten jonger zijn dan de pensioengerechtigde leeftijd: € 1 336,87 .'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel21
  - number: '22'
    text: |-
      Voor belanghebbenden die de pensioengerechtigde leeftijd hebben bereikt is de norm per kalendermaand, indien het
      betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel22
  - number: 22.a
    text: 'een alleenstaande: € 1 026,66 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel22
  - number: 22.b
    text: 'een alleenstaande ouder: € 1 291,99 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel22
  - number: 22.c
    text: 'gehuwden waarvan beide echtgenoten de pensioengerechtigde leeftijd hebben bereikt: € 1 413,13 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel22
  - number: 22.d
    text: |-
      gehuwden waarvan een echtgenoot de pensioengerechtigde leeftijd heeft bereikt en de andere echtgenoot 21 jaar of
      ouder, doch de pensioengerechtigde leeftijd nog niet heeft bereikt: € 1 413,13 .
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel22
  - number: '23.1'
    text: 'Bij een verblijf in een inrichting is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel23
  - number: 23.1.a
    text: 'een alleenstaande of een alleenstaande ouder: € 296,35 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel23
  - number: 23.1.b
    text: 'gehuwden: € 460,93 .'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel23
  - number: '23.2'
    text: 'Het bedrag van de norm, bedoeld in het eerste lid, wordt verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel23
  - number: 23.2.a
    text: voor een alleenstaande of een alleenstaande ouder € 49,00 ;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel23
  - number: 23.2.b
    text: voor gehuwden € 93,00 .
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel23
  - number: '23.3'
    text: |-
      Indien een van de gehuwden in een inrichting verblijft, is de norm de som van de normen die voor ieder van hen als
      alleenstaande of alleenstaande ouder zouden gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel23
  - number: '24'
    text: |-
      Indien een van de gehuwden geen recht op algemene bijstand heeft, is voor de rechthebbende echtgenoot de norm
      gelijk aan de norm die voor hem als alleenstaande of alleenstaande ouder zou gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel24
  - number: '25.1'
    text: |-
      Het college verhoogt de norm, bedoeld in [artikel 21, onderdelen a en b][ref1], met een toeslag voorzover de
      belanghebbende hogere algemeen noodzakelijke kosten van het bestaan heeft dan waarin de norm voorziet, als gevolg
      van het niet of niet geheel kunnen delen van deze kosten met een ander. Deze kosten kunnen in ieder geval niet
      geheel of gedeeltelijk gedeeld worden met thuisinwonende kinderen van 18 jaar of ouder die een in aanmerking
      te nemen inkomen hebben van ten hoogste het normbedrag voor de kosten van levensonderhoud voor hoger onderwijs,
      genoemd in [artikel 3.18 van de Wet studiefinanciering 2000][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
  - number: '25.2'
    text: De toeslag bedraagt ten hoogste  € 227,11  per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel25
  - number: '26'
    text: |-
      Het college kan de norm, bedoeld in
      [artikel 20, eerste lid, onderdelen b en c, en tweede lid, onderdelen b en c][ref1], en
      [artikel 21, onderdeel c][ref2], verlagen voorzover de belanghebbenden lagere algemeen noodzakelijke
      kosten van het bestaan hebben dan waarin de norm voorziet als gevolg van het geheel of gedeeltelijk
      kunnen delen van deze kosten met een ander. Deze kosten kunnen in ieder geval niet geheel of gedeeltelijk
      gedeeld worden met thuisinwonende kinderen van 18 jaar of ouder die een in aanmerking te nemen inkomen
      hebben van ten hoogste het normbedrag voor de kosten van levensonderhoud voor hoger onderwijs, genoemd in
      [artikel 3.18 van de Wet studiefinanciering 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
  - number: '27'
    text: |-
      Het college kan de norm, bedoeld in de [artikelen 20][ref1] en [21][ref2], of de toeslag, bedoeld in
      [artikel 25][ref3], lager vaststellen voorzover de belanghebbende lagere algemeen noodzakelijke kosten van het
      bestaan heeft dan waarin de norm of de toeslag voorziet als gevolg van zijn woonsituatie, waaronder begrepen het
      niet aanhouden van een woning.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '28'
    text: |-
      Het college kan voor de belanghebbende die recent de deelname heeft beëindigd aan onderwijs of een beroepsopleiding,
      de norm of de toeslag, bedoeld in [artikel 25][ref1], gedurende zes maanden na het tijdstip van die beëindiging
      lager vaststellen, indien voor het onderwijs of de beroepsopleiding aanspraak bestond op studiefinanciering
      op grond van de [Wet studiefinanciering 2000][ref2] of op een tegemoetkoming in de onderwijsbijdrage en de
      schoolkosten op grond van [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011453
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0011453
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '29.1'
    text: |-
      Het college kan de toeslag, bedoeld in [artikel 25][ref1], voor een alleenstaande van 21 of 22 jaar afwijkend
      vaststellen voor zover het van oordeel is dat, gezien de hoogte van het minimumjeugdloon, de hoogte van deze
      toeslag een belemmering kan vormen voor de aanvaarding van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '29.2'
    text: |-
      Onder het minimumjeugdloon bedoeld in het eerste lid wordt verstaan het voor de betreffende leeftijd geldende
      minimumloon bedoeld in [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] verminderd
      met de daarover verschuldigde loonheffing en de daarover verschuldigde inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
  - number: '30.1'
    text: |-
      In de verordening, bedoeld in [artikel 8, eerste lid, onderdeel c][ref1], stelt de gemeenteraad vast voor welke
      categorieën de norm wordt verhoogd of verlaagd en op grond van welke criteria de hoogte van die verhoging of
      verlaging wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '30.2'
    text: 'In deze verordening stelt de gemeenteraad in elk geval vast dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel30
  - number: 30.2.a
    text: |-
      onverminderd de [artikelen 27][ref1] en [28][ref2], de toeslag, bedoeld in [artikel 25][ref3], voor de
      alleenstaande en de alleenstaande ouder met zijn ten laste komende kinderen of met thuisinwonende kinderen als
      bedoeld in artikel 25, eerste lid, in wiens woning geen ander zijn hoofdverblijf heeft, wordt bepaald op het in dat
      artikel genoemde maximumbedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 30.2.b
    text: |-
      jegens een belanghebbende niet gelijktijdig gebruik gemaakt wordt van de bevoegdheden, bedoeld in de
      [artikelen 28][ref1] en [29, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel29
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '30.3'
    text: |-
      In de verordening worden uitsluitend verhogingen of verlagingen vastgesteld als bedoeld in de
      [artikelen 25 tot en met 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '30.4'
    text: |-
      Verhoging of verlaging van de norm of afwijkende vaststelling van de toeslag vindt plaats onverminderd
      [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '31.1'
    text: |-
      Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de alleenstaande of het gezin
      beschikt of redelijkerwijs kan beschikken. Tot de middelen worden mede gerekend de middelen die ten behoeve van het
      levensonderhoud van de belanghebbende door een niet in de bijstand begrepen persoon worden ontvangen. In elk geval
      behoort tot de middelen de ten aanzien van de alleenstaande of het gezin toepasselijke heffingskorting, bedoeld in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: '31.2'
    text: 'Niet tot de middelen van de belanghebbende worden gerekend:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.a
    text: de middelen die deze ontvangt ten behoeve van het levensonderhoud van een niet in de bijstand begrepen persoon;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.b
    text: kinderbijslag ontvangen ten behoeve van zijn in of buiten Nederland woonachtige kinderen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.c
    text: de jonggehandicaptenkorting;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.d
    text: |-
      tegemoetkomingen in de zin van de [Algemene wet inkomensafhankelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: 31.2.e
    text: |-
      eigenwoningbijdrage of een bijzondere bijdrage ontvangen op grond van de [Wet bevordering eigenwoningbezit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 31.2.f
    text: |-
      vergoedingen en tegemoetkomingen, waaronder begrepen de tegemoetkoming ontvangen op grond van het
      [Tijdelijk besluit tegemoetkoming buitengewone uitgaven][ref1], voor, alsmede de vermindering of teruggave van,
      loonbelasting of inkomstenbelasting en van premies volksverzekeringen op grond van kosten die niet tot de algemeen
      noodzakelijke bestaanskosten behoren, tenzij voor deze kosten bijstand wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0016555
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0016555
  - number: 31.2.g
    text: |-
      vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g, van de Wet op de loonbelasting 1964][ref1], tenzij voor deze
      vergoedingen en verstrekkingen bijstand wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '31'
  - number: 31.2.h
    text: |-
      inkomsten uit arbeid van de tot zijn last komende kinderen, alsmede door hen ontvangen uitkeringen inzake
      werkloosheid en arbeidsongeschiktheid, tenzij het de verlening van bijzondere bijstand betreft voor bijzondere
      noodzakelijke kosten van het bestaan van die kinderen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.i
    text: |-
      rente ontvangen over op grond van [artikel 34, tweede lid, onderdelen b en c][ref1], niet in aanmerking genomen
      vermogen en spaargelden;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 31.2.j
    text: |-
      een een- of tweemalige premie van ten hoogste € 1984,00  per kalenderjaar, voor zover dit naar het oordeel van het
      college bijdraagt aan zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.k
    text: |-
      een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste een bij ministeriële regeling vast
      te stellen bedrag;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.l
    text: bij ministeriële regeling aan te wijzen uitkeringen en vergoedingen voor materiële en immateriële schade;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.m
    text: |-
      giften en andere dan de in onderdeel l bedoelde vergoedingen voor materiële en immateriële schade voorzover deze
      naar het oordeel van het college uit een oogpunt van bijstandsverlening verantwoord zijn;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.n
    text: |-
      inkomsten uit arbeid tot 25 procent van deze inkomsten, met een maximum van € 183,00  per maand, voor zover hij
      algemene bijstand ontvangt, waarbij voor een persoon die de pensioengerechtigde leeftijd nog niet heeft bereikt
      geldt dat die inkomsten gedurende ten hoogste zes aaneengesloten maanden niet tot de middelen worden gerekend en
      dat dit naar het oordeel van het college moet bijdragen aan zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.o
    text: |-
      de ten behoeve van een levensloopregeling als bedoeld in [artikel 39d van de Wet op de loonbelasting 1964][ref1]
      bij een uitvoerder als bedoeld in [artikel 19g, derde lid, van die wet][ref2], zoals dit artikellid op 31 december
      2011 luidde opgebouwde voorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel39d
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 39d
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 31.2.p
    text: |-
      een tegemoetkoming als bedoeld in [artikel 29a van de Algemene nabestaandenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007795#Artikel29a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007795
        artikel: 29a
  - number: 31.2.q
    text: |-
      een uitkering als bedoeld in [artikel 118a, eerste lid, van de Zorgverzekeringswet][ref1] of een tegemoetkoming als
      bedoeld in [artikel 2:52][ref2] of [3:10 van de Wet werk en arbeidsondersteuning jonggehandicapten][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008657#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0008657
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008657
        artikel: '3'
  - number: 31.2.r
    text: |-
      inkomsten uit arbeid van een alleenstaande ouder tot 12,5 procent van deze inkomsten, met een maximum van € 120,00
      per maand, gedurende een aaneengesloten periode van maximaal 30 maanden, voor zover hij algemene bijstand ontvangt,
      ingeval:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.r.1°
    text: hij de volledige zorg heeft voor een tot zijn last komend kind tot 12 jaar,
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.r.2°
    text: de periode van zes aaneengesloten maanden, bedoeld in onderdeel n, is verstreken, en
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.r.3°
    text: dit volgens het college bijdraagt aan zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.2.s
    text: |-
      een vergoeding als bedoeld in [artikel 18 van de Wet inburgering][ref1] zoals dit luidde voor de inwerkingtreding
      van het bij koninklijke boodschap van 14 november 2011 ingediende voorstel van wet tot wijziging van de Wet
      inburgering en enkele andere wetten in verband met de versterking van de eigen verantwoordelijkheid van de
      inburgeringsplichtige (33 086), nadat dat voorstel tot wet is verheven voorzover deze niet een vergoeding is als
      bedoeld in onderdeel f;


