  - number: '31.3'
    text: 'De middelen worden in aanmerking genomen tot het bedrag dat resteert na aftrek van:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.3.a
    text: de daarover door de belanghebbende verschuldigde loonbelasting of inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.3.b
    text: |-
      de daarover door de belanghebbende verschuldigde premies volksverzekeringen dan wel een inhouding
      die met een of meer van deze premies overeenkomt alsmede de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 43 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 31.3.c
    text: |-
      ten laste van de belanghebbende komende verplichte bijdragen ingevolge een pensioenregeling en daarmee
      vergelijkbare regelingen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: 31.3.d
    text: andere ten laste van de belanghebbende komende verplichte inhoudingen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: '31.4'
    text: |-
      Onder het redelijkerwijs kunnen beschikken over vermogens- en inkomensbestanddelen, bedoeld in het eerste
      lid, wordt niet verstaan de mogelijkheid om een voorschot te vragen op het ouderdomspensioen op grond van
      [artikel 22, eerste lid, van de Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel22
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '22'
  - number: '31.5'
    text: |-
      Dit lid en het vierde lid vervallen, onder vernummering van het zesde en zevende lid tot vierde en vijfde lid, met
      ingang van 1 juli 2017.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: '31.6'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het in aanmerking nemen van de aanspraak op
      vakantietoeslag over een inkomen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: '31.7'
    text: Het tweede lid, onderdelen c, j, k, n en r, zijn niet van toepassing op de persoon die jonger is dan 27 jaar.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel31
  - number: '32.1'
    text: |-
      Onder inkomen wordt verstaan de op grond van [artikel 31][ref1] in aanmerking genomen middelen voorzover deze:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 32.1.a
    text: |-
      betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, een premie als bedoeld in
      [artikel 31, tweede lid, onderdeel j][ref1], een kostenvergoeding als bedoeld in artikel 31, tweede lid, onderdeel
      k, inkomsten uit verhuur, onderverhuur of het hebben van een of meer kostgangers, socialezekerheidsuitkeringen,
      uitkeringen tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref2], voorlopige teruggave of
      teruggave van inkomstenbelasting, loonbelasting, premies volksverzekeringen en inkomensafhankelijke bijdragen als
      bedoeld in [artikel 43 van de Zorgverzekeringswet][ref3], dan wel naar hun aard met deze inkomsten en uitkeringen
      overeenkomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0002656
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0002656
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 32.1.b
    text: betrekking hebben op een periode waarover beroep op bijstand wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel32
  - number: '32.2'
    text: |-
      Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar de periode waarin deze
      zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in aanmerking
      genomen naar de periode waarin deze te gelde kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel32
  - number: '32.3'
    text: |-
      Indien een van de gehuwden geen recht op algemene bijstand heeft, wordt zijn inkomen slechts in aanmerking genomen
      voor zover het inkomen van de gehuwden tezamen, met inbegrip van de bijstand die zou worden verleend indien
      zijn inkomen niet in aanmerking wordt genomen, meer zou bedragen dan de bijstandsnorm voor gehuwden. Voor de
      vaststelling van het inkomen van de niet-rechthebbende echtgenoot is deze paragraaf van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel32
  - number: '32.4'
    text: |-
      In afwijking van het derde lid wordt, indien de gehuwden gescheiden leven, doch niet duurzaam gescheiden, het
      inkomen van de niet-rechthebbende echtgenoot slechts in aanmerking genomen voor zover het de bijstandsnorm te boven
      gaat.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel32
  - number: '33.1'
    text: |-
      Indien inkomen in natura in aanmerking wordt genomen wordt de waarde daarvan vastgesteld op het daarvoor door
      belanghebbende opgeofferde bedrag.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel33
  - number: '33.2'
    text: |-
      Het inkomen uit studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt in aanmerking
      genomen naar het van toepassing zijnde normbedrag voor de kosten van levensonderhoud, genoemd in
      [artikel 3.18 van de Wet studiefinanciering 2000][ref2] en, indien een toeslag als bedoeld in [artikel 3.4][ref3]
      of [artikel 3.5 van die wet][ref4] is toegekend, het bedrag aan toeslag, genoemd in artikel 3.18 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref4
        bwb_id: BWBR0011453
        artikel: '3'
  - number: '33.3'
    text: |-
      De tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1] wordt in aanmerking genomen naar
      het normbedrag voor de basistoelage, bedoeld in [artikel 4.3 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '4'
  - number: '33.4'
    text: |-
      Indien de belanghebbende de woning bewoont met een of meer huurders, onderhuurders of kostgangers, worden de
      daaruit voortvloeiende lagere algemene noodzakelijke kosten van het bestaan als inkomen in aanmerking genomen
      voorzover het college daarmee nog geen rekening heeft gehouden bij de verhoging of verlaging van de norm, bedoeld
      in [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '33.5'
    text: |-
      Indien de alleenstaande, de alleenstaande ouder of een van de echtgenoten de pensioengerechtigde leeftijd heeft
      bereikt, wordt voor de vaststelling van de hoogte van de algemene bijstand een in de vorm van een periodieke
      uitkering ontvangen particuliere oudedagsvoorziening buiten beschouwing gelaten tot een bedrag van:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel33
  - number: 33.5.a
    text: 'voor een alleenstaande en een alleenstaande ouder: € 18,80  per kalendermaand;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel33
  - number: 33.5.b
    text: 'voor de gehuwden tezamen: € 37,60  per kalendermaand.'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel33
  - number: '34.1'
    text: 'Onder vermogen wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.1.a
    text: |-
      de waarde van de bezittingen waarover de alleenstaande of het gezin beschikt of redelijkerwijs kan beschikken,
      verminderd met de aanwezige schulden. De waarde van de bezittingen wordt vastgesteld op de waarde in het
      economische verkeer bij vrije oplevering;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.1.b
    text: |-
      middelen die worden ontvangen in de periode waarover algemene bijstand is toegekend, voorzover deze geen inkomen
      betreffen als bedoeld in de [artikelen 32][ref1] en [33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel33
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '34.2'
    text: 'Niet als vermogen wordt in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.2.a
    text: |-
      bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van persoon en gezin, noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.2.b
    text: |-
      het bij de aanvang van de bijstand aanwezige vermogen voorzover dit minder bedraagt dan de van toepassing zijnde
      vermogensgrens, genoemd in het derde lid;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.2.c
    text: spaargelden opgebouwd tijdens de periode waarin bijstand wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.2.d
    text: |-
      het vermogen gebonden in de woning met bijbehorend erf, bedoeld in [artikel 50, eerste lid][ref1], voorzover dit
      minder bedraagt dan  € 42 000,00 ;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel50
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 34.2.e
    text: |-
      vergoedingen voor immateriële schade als bedoeld in [artikel 31, tweede lid, onderdelen l en m][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 34.2.f
    text: |-
      de voorziening, bedoeld in [artikel 31, tweede lid, onderdeel o][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '34.3'
    text: 'De in het tweede lid, onderdeel b, bedoelde vermogensgrens is:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.3.a
    text: 'voor een alleenstaande:  € 4975,00 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.3.b
    text: 'voor een alleenstaande ouder:  € 9950,00 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.3.c
    text: 'voor de gehuwden tezamen:  € 9950,00 .'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: '34.4'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op bezittingen die worden verworven in de periode waarover
      algemene bijstand is toegekend en op middelen als bedoeld in het eerste lid, onderdeel b, met dien verstande dat de
      van toepassing zijnde vermogensgrens, bedoeld in het derde lid, daarbij wordt verminderd met het vermogen dat:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.4.a
    text: bij aanvang van de bijstandsverlening niet in aanmerking is genomen op grond van het tweede lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: 34.4.b
    text: tijdens de bijstandsverlening niet in aanmerking is genomen op grond van dit lid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel34
  - number: '35.1'
    text: |-
      Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op bijzondere bijstand voorzover
      de alleenstaande of het gezin niet beschikt over de middelen om te voorzien in de uit bijzondere omstandigheden
      voortvloeiende noodzakelijke kosten van het bestaan en deze kosten naar het oordeel van het college niet kunnen
      worden voldaan uit de bijstandsnorm, de langdurigheidstoeslag, het vermogen en het inkomen voorzover dit meer
      bedraagt dan de bijstandsnorm, waarbij [artikel 31, tweede lid][ref2], en [artikel 34, tweede lid][ref3], niet van
      toepassing zijn. Het college bepaalt het begin en de duur van de periode waarover het vermogen en het inkomen in
      aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '35.2'
    text: |-
      Het college kan bijzondere bijstand weigeren, indien de in het eerste lid bedoelde kosten binnen twaalf maanden een
      bedrag van  € 107,00  niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon die de pensioengerechtigde leeftijd
      heeft bereikt, behorend tot een bepaalde categorie, worden verleend, zonder dat wordt nagegaan of ten aanzien van
      die persoon de hierna bedoelde kosten ook daadwerkelijk noodzakelijk zijn of gemaakt zijn, indien ten aanzien van
      de categorie waartoe hij behoort aannemelijk is dat die zich in bijzondere omstandigheden bevindt die leiden tot
      bepaalde noodzakelijke kosten van bestaan waarin de algemene bijstand niet voorziet en die de aanwezige draagkracht
      te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
  - number: '35.4'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon, behorend tot een categorie chronisch
      zieken of gehandicapten, of met een hem ten laste komend kind dat tot die categorie behoort, worden verleend met
      betrekking tot kosten in verband met chronische ziekte of handicap, zonder dat wordt nagegaan of ten behoeve van
      die persoon of dat kind die kosten ook daadwerkelijk noodzakelijk zijn of gemaakt zijn, indien ten aanzien van
      de categorie waartoe hij of dat kind behoort aannemelijk is dat die zich in bijzondere omstandigheden bevindt
      die leiden tot dergelijke noodzakelijke kosten van bestaan waarin de algemene bijstand niet voorziet en die de
      aanwezige draagkracht te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
  - number: '35.5'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon, met een hem ten laste komend kind dat
      onderwijs of een beroepsopleiding volgt, worden verleend met betrekking tot kosten in verband met maatschappelijke
      participatie van dat kind, zonder dat wordt nagegaan of ten behoeve van dat kind die kosten ook daadwerkelijk
      noodzakelijk zijn of gemaakt zijn, indien ten aanzien van de categorie waartoe hij behoort aannemelijk is dat die
      zich in bijzondere omstandigheden bevindt die leiden tot dergelijke noodzakelijke kosten van bestaan waarin de
      algemene bijstand niet voorziet en die de aanwezige draagkracht te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
  - number: '35.6'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon worden verleend in de vorm van een
      collectieve aanvullende zorgverzekering of in de vorm van een tegemoetkoming in de kosten van de premie van een
      dergelijke verzekering zonder dat wordt nagegaan of ten aanzien van die persoon de kosten van die verzekering of
      die premie ook daadwerkelijk noodzakelijk zijn of gemaakt zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
  - number: '35.7'
    text: |-
      Voor de toepassing van dit artikel wordt onder bijzondere bijstand niet verstaan langdurigheidstoeslag als bedoeld
      in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel36
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '35.8'
    text: |-
      Voorzover de gemeente krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, wordt de bijzondere
      bijstand verhoogd met de loonbelasting en premies volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '35.9'
    text: |-
      Het derde tot en met het zesde lid zijn niet van toepassing ingeval van een alleenstaande of een gezin waarvan het
      in aanmerking te nemen inkomen hoger is dan 110 procent van de op hem van toepassing zijnde bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel35
  - number: '36.1'
    text: |-
      Het college verleent op aanvraag een langdurigheidstoeslag aan een persoon van 21 jaar of ouder doch jonger dan de
      pensioengerechtigde leeftijd, die langdurig een laag inkomen en geen in aanmerking te nemen vermogen als bedoeld in
      [artikel 34][ref1] heeft en geen uitzicht heeft op inkomensverbetering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '36.2'
    text: |-
      Bij de vaststelling van het inkomen, bedoeld in het eerste lid, wordt een eerder verstrekte langdurigheidstoeslag
      buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel36
  - number: '36.3'
    text: |-
      Een persoon kan slechts eenmaal binnen een periode van 12 maanden in aanmerking komen voor een
      langdurigheidstoeslag.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel36
  - number: '36.4'
    text: |-
      De [artikelen 12][ref1], [43][ref2], [49][ref3] en [52][ref4] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel49
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.1'
