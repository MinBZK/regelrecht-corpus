        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '36.5'
    text: |-
      Voor de toepassing van het eerste lid wordt onder laag inkomen niet verstaan in aanmerking te nemen inkomen hoger
      dan 110 procent van de op de desbetreffende alleenstaande of gezin van toepassing zijnde bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel36
  - number: 36a.1
    text: |-
      Het college verleent op aanvraag aan de alleenstaande ouder, bedoeld in
      [artikel 1, onderdeel a, van de Wet voorzieningen arbeid en zorg alleenstaande ouders][ref1],
      die op grond van [artikel 2, van die wet][ref2] in een kalenderjaar niet in aanmerking komt
      voor de Vazalo-toeslag, met betrekking tot elke kalendermaand in dat kalenderjaar waarin
      die alleenstaande ouder inkomsten uit arbeid in het bedrijfs- en beroepsleven als bedoeld in
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3]
      heeft waarvan het maandbedrag ten minste gelijk is aan 1/12 van het in
      [artikel 2, eerste lid, van de Wet voorzieningen arbeid en zorg alleenstaande ouders][ref4] genoemde bedrag,
      een arbeidstoeslag alleenstaande ouder tot het bedrag volgens de volgende tabel: Bij een inkomen als bedoeld in
