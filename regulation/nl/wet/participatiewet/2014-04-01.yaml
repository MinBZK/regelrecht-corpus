      - id: ref5
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78k.2
    text: |-
      Vermogensbestanddelen die voortvloeien uit een geldlening als bedoeld in het eerste lid gaan met ingang van de
      datum van inwerkingtreding van [paragraaf 5.4][ref1] over op de Sociale verzekeringsbank, zonder dat daarvoor een
      akte of betekening nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78k
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78k.3
    text: |-
      Met betrekking tot de ingevolge het tweede lid overgaande vermogensbestanddelen die in openbare registers te
      boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders van
      die registers. De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de
      desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78k
  - number: 78k.4
    text: |-
      Terzake van de in het tweede lid bedoelde overgang van vermogensbestanddelen blijft heffing van
      overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78k
  - number: 78l.1
    text: |-
      Het college dat vóór de inwerkingtreding van [paragraaf 5.4][ref1] ten aanzien van een persoon als bedoeld in
      [artikel 47a, eerste lid][ref2], een besluit in verband met de verlening van algemene bijstand heeft genomen
      waartegen een bezwaarschrift is ingediend dan wel nog kan worden ingediend, blijft bevoegd op het bezwaar te
      beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78l
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78l.2
    text: |-
      In een geding in beroep en hoger beroep, gericht tegen een besluit ten aanzien van een persoon als bedoeld in
      [artikel 47a, eerste lid][ref1], genomen vóór de inwerkingtreding van [paragraaf 5.4][ref2] of gericht tegen een
      besluit als bedoeld in het eerste lid, blijft het college partij en voor het college staat hoger beroep in verband
      met deze besluiten open.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78l
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78l.3
    text: |-
      Onverminderd het eerste en tweede lid kan de Sociale verzekeringsbank in een bestuursrechtelijk geding tussen het
      college en een persoon, bedoeld in [artikel 47a, eerste lid][ref1], in de plaats van het college treden, zonder
      dat daarvoor een betekening nodig is en met overneming van procureurstelling onderscheidenlijk aanwijzing van
      een gemachtigde, indien de Sociale verzekeringsbank vóór de inwerkingtreding van [paragraaf 5.4][ref2] mandaat
      is verleend door het college ten aanzien van besluiten over de verlening van algemene bijstand aan personen als
      bedoeld in artikel 47a, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78l
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78m
    text: |-
      De [artikelen 3, zevende en achtste lid][ref1], en [4, tweede lid][ref2], zijn niet van toepassing, indien
      voor 1 januari 2010 op grond van [artikel 11][ref3] recht bestaat op bijstand voor gehuwden, omdat de ongehuwde
      bijstandsgerechtigde wegens een gezamenlijke huishouding met een meerderjarig aangehuwd kind of een meerderjarig
      voormalig pleegkind is aangemerkt als gehuwd, voor zolang dit recht op bijstand bestaat, tenzij toepassing van de
      genoemde artikelleden leidt tot een hogere bijstandsuitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78m
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '4'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 78o
    text: |-
      Indien het college vóór de datum van inwerkingtreding van [paragraaf 5.4][ref1] ten aanzien van een persoon als
      bedoeld in [artikel 47a, eerste lid][ref2], een vordering heeft waarop [artikel 78j][ref3] van toepassing is en die
      persoon een uitkering op grond van die paragraaf ontvangt, betaalt de Sociale verzekeringsbank, zonder dat daarvoor
      machtiging nodig is van de belanghebbende, op verzoek van het college ter verrekening van die vordering aan dat
      college.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel78j
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78o
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 78j
        hoofdstuk: 7a
  - number: 78t.1
    text: |-
      Door het college op grond van de [Wet investeren in jongeren][ref1] genomen besluiten gelden als door hem genomen
      besluiten op grond van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0026054
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78t
    references:
      - id: ref1
        bwb_id: BWBR0026054
  - number: 78t.2
    text: |-
      Onverminderd [artikel 78s][ref1] brengt het college de in het eerste
      lid bedoelde besluiten binnen zes maanden na de inwerkingtreding van de
      __REF001___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____________________________________ (Stb. 650) in overeenstemming met deze wet, voor zover die besluiten afwijken
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel78s
      [ref2]: https://wetten.overheid.nl/BWBR0030997
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78t
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 78s
        hoofdstuk: 7a
      - id: ref2
        bwb_id: BWBR0030997
  - number: 78t.3
    text: |-
      In afwijking van het tweede lid blijft het besluit, inhoudende dat een jongere een werkleeraanbod wordt gedaan,
      gelden voor de duur van het werkleeraanbod doch niet langer dan zes maanden na de inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      _____________________________________ (Stb. 650).


      [ref1]: https://wetten.overheid.nl/BWBR0030997
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78t
    references:
      - id: ref1
        bwb_id: BWBR0030997
  - number: 78t.4
    text: |-
      Op een aanvraag voor een werkleeraanbod of een inkomensvoorziening
      waarop niet is beslist voor de datum van inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ______________________________________ (Stb. 650) wordt beslist met toepassing van deze wet, waarbij
      [artikel 41, vierde tot en met negende lid][ref2], en [artikel 43, vierde lid][ref3], buiten toepassing blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0030997
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel43
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78t
    references:
      - id: ref1
        bwb_id: BWBR0030997
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 78t.5
    text: |-
      Op een bezwaar- of beroepschrift dat vóór of op de datum van inwerkingtreding van de
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      ______________________________________ (Stb. 650) is ingediend tegen een door het college op grond van de
      [Wet investeren in jongeren][ref2] genomen besluit en waarop op die datum nog niet onherroepelijk is beslist, wordt
      beslist met toepassing van de Wet investeren in jongeren.


      [ref1]: https://wetten.overheid.nl/BWBR0030997
      [ref2]: https://wetten.overheid.nl/BWBR0026054
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78t
    references:
      - id: ref1
        bwb_id: BWBR0030997
      - id: ref2
        bwb_id: BWBR0026054
  - number: 78v
    text: |-
      [Artikel 8, eerste lid, onderdeel g, en tweede lid, onderdeel d][ref1], vervallen op een bij koninklijk besluit te
      bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78v
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 78x.1
    text: 'Aan een persoon:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78x
  - number: 78x.1.a
    text: |-
      die zich tussen 26 april 2012 en 2 maanden na publicatie van de [Wet afschaffing huishoudinkomenstoets][ref1] in
      het Staatsblad heeft gemeld om bijstand aan te vragen; en


      [ref1]: https://wetten.overheid.nl/BWBR0031793
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78x
    references:
      - id: ref1
        bwb_id: BWBR0031793
  - number: 78x.1.b
    text: |-
      van wie het college heeft vastgesteld dat hij als gevolg van de inwerkingtreding van de
      [Wet afschaffing huishoudinkomenstoets][ref1] recht heeft op bijstand,


      [ref1]: https://wetten.overheid.nl/BWBR0031793
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78x
    references:
      - id: ref1
        bwb_id: BWBR0031793
  - number: 78x.2
    text: |-
      Op de persoon, bedoeld in het eerste lid, is [artikel 41, vierde lid][ref1], niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78x
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 78y
    text: |-
      Indien als gevolg van inwerkingtreding van de [Wet afschaffing huishoudinkomenstoets][ref1] het college ten aanzien
      van belanghebbende over een periode een vordering heeft met betrekking tot kosten van algemene bijstand en als
      gevolg van inwerkingtreding van die wet die belanghebbende over diezelfde periode recht op algemene bijstand heeft
      jegens de Sociale verzekeringsbank, betaalt de Sociale Verzekeringsbank, zonder dat daarvoor machtiging nodig
      is van de belanghebbende, op verzoek van het college uit die bijstand het bedrag van die vordering uit aan het
      college.


      [ref1]: https://wetten.overheid.nl/BWBR0031793
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78y
    references:
      - id: ref1
        bwb_id: BWBR0031793
  - number: '79'
    text: |-
      Voor de toepassing van [artikel 8:1 van de Algemene wet bestuursrecht][ref1] wordt met een besluit gelijkgesteld
      het nalaten van een handeling die strekt tot uitvoering van het besluit inzake de verlening of terugvordering van
      bijstand of het verrichten van een handeling die afwijkt van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '80.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van [artikel 3, tweede tot en met vijfde lid][ref1], en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '80.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel80
  - number: '81.1'
    text: |-
      In geval het college geen of ontoereikend toepassing heeft gegeven aan [artikel 52][ref1] kan de voorzitter van
      gedeputeerde staten, indien naar zijn oordeel de noodzaak tot onverwijlde bijstand aanwezig is, op verzoek van de
      belanghebbende besluiten dat het college algemene bijstand verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '81.2'
    text: |-
      De beslissing van de voorzitter van gedeputeerde staten vervalt, zodra de beslissing van het college inzake de
      verlening van algemene bijstand onherroepelijk is geworden dan wel de rechtbank op het beroep heeft beslist.
      De beslissing vervalt eveneens met ingang van de datum waarop een door de voorzieningenrechter van de rechtbank
      getroffen voorlopige voorziening in werking treedt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel81
  - number: '81.3'
    text: |-
      De in het eerste lid bedoelde bijstand wordt bij wijze van voorschot verleend in de vorm van een renteloze
      geldlening.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel81
  - number: '82.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien de spoed dat vereist, regels worden gesteld die noodzakelijk zijn
      in verband met de goede uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel82
  - number: '82.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel82
  - number: '82.3'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van beide kamers der Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel82
  - number: '83.1'
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van mogelijkheden
      om deze wet met betrekking tot de arbeidsinschakeling en de financiering doeltreffender uit te voeren, worden
      afgeweken van het bepaalde bij of krachtens de [artikelen 6 tot en met 10][ref1], [31, tweede lid][ref2], en
      [paragraaf 7.1][ref3]. Bij toepassing van de eerste volzin wordt bij algemene maatregel van bestuur geregeld op
      welke wijze en gedurende welke periode van welke artikelen van de wet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0015703
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '83.2'
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste drie jaar. Indien, voor een experiment is afgelopen,
      een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele
      wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in werking
      treedt. De tweede volzin van het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel83
  - number: '83.3'
    text: |-
      Onze Minister kan op hun verzoek gemeenten aanwijzen die deelnemen aan een experiment. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van deze bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel83
  - number: '83.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen wordengetroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel83
  - number: '83.5'
    text: |-
      Onze Minister zendt uiterlijk drie maanden voor het einde van een experiment aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten van het experiment in de praktijk alsmede een standpunt inzake de
      voortzetting ervan anders dan als experiment. Indien een experiment eerder wordt beëindigd dan oorspronkelijk
      beoogd, zendt Onze Minister, in afwijking van de eerste volzin, uiterlijk twee maanden na de beëindiging van dat
      experiment een verslag als bedoeld in de eerste volzin aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel83
  - number: '83.6'
    text: |-
      De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel83
  - number: '84'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet, aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel84
  - number: '85'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld. In het koninklijk besluit wordt zo nodig toepassing gegeven
      aan [artikel 16 van de Tijdelijke referendumwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel16
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '16'
  - number: '86'
    text: 'Deze wet wordt aangehaald: Wet werk en bijstand.'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel86
