  - number: 36a.2
    text: |-
      De arbeidstoeslag alleenstaande ouder, bedoeld in het eerste lid, wordt verminderd met het bedrag van
      de middelen dat op grond van [artikel 31, tweede lid, onderdelen c en o][ref1], over de betreffende
      kalendermaand niet tot de middelen van belanghebbende is gerekend, alsmede met het bedrag dat op grond van
      [artikel 31, tweede lid, onderdeel j][ref2], in het betreffende kalenderjaar niet tot de middelen is gerekend en na
      afloop van het kalenderjaar vastgesteld en betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel36a
