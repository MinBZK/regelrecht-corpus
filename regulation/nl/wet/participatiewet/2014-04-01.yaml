  - number: 47c.1
    text: |-
      De Sociale verzekeringsbank stemt de algemene bijstand als aanvullende inkomensvoorziening ouderen en de daaraan
      verbonden verplichtingen af op de omstandigheden, mogelijkheden en middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47c
  - number: 47c.2
    text: |-
      De Sociale verzekeringsbank verlaagt de algemene bijstand ter zake van het niet of onvoldoende nakomen van de uit
      deze wet, met uitzondering van [artikel 17, eerste lid][ref1] voortvloeiende verplichtingen, waaronder begrepen
      het zich jegens de Sociale verzekeringsbank zeer ernstig misdragen dan wel indien de belanghebbende naar het
      oordeel van de Sociale verzekeringsbank tekortschietend besef van verantwoordelijkheid betoont voor de voorziening
      in het bestaan. Van een verlaging wordt afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47c
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 47c.3
    text: |-
      Indien het college een gegrond vermoeden heeft dat een belanghebbende niet voldoet aan de verplichting
      tot arbeidsinschakeling dan wel niet of onvoldoende gebruik maakt van re-integratievoorzieningen of
      inburgeringsvoorzieningen, stelt het de Sociale verzekeringsbank daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47c
  - number: 47c.4
    text: |-
      De Sociale verzekeringsbank heroverweegt een besluit als bedoeld in het eerste lid binnen een door haar te bepalen
      termijn die ten hoogste drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47c
  - number: 47c.5
    text: Bij de toepassing van het eerste en derde lid wordt onder belanghebbende mede verstaan het gezin.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47c
  - number: 47c.6
    text: |-
      Indien de Sociale verzekeringsbank naar aanleiding van een melding als bedoeld in het derde lid toepassing heeft
      gegeven aan dit artikel stelt de Sociale verzekeringsbank het college daarvan terstond in kennis.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47c
  - number: 47d.1
    text: |-
      De [artikelen 40, eerste lid][ref1], en [62c][ref2] zijn niet van toepassing bij de uitvoering van deze wet door de
      Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 62c
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 47d.2
    text: |-
      De aanvraag voor algemene bijstand als aanvullende inkomensvoorziening ouderen van een persoon als bedoeld in
      [artikel 47a, eerste lid][ref1], wordt ingediend bij de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 47d.3
    text: |-
      Voor algemene bijstand als aanvullende inkomensvoorziening ouderen heeft de belanghebbende zich gemeld als zijn
      naam, adres en woonplaats bij de Sociale verzekeringsbank zijn geregistreerd, en:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47d
  - number: 47d.3.a
    text: |-
      indien het gehuwden betreft waarvan de echtgenoot van degene die de pensioengerechtigde leeftijd heeft
      bereikt, jonger dan 27 jaar is: de belanghebbende door de Sociale verzekeringsbank op de hoogte is gesteld
      van de verplichting, bedoeld in [artikel 9, eerste lid, onderdeel a, en de inhoud van het tweede lid][ref1],
      [artikel 41, vijfde en zevende lid][ref2], en [artikel 43, vijfde lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel43
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 47d.3.b
    text: |-
      indien tot de personen voor wie bijstand is aangevraagd geen persoon jonger dan 27 jaar behoort: hij in staat is
      gesteld zijn aanvraag in te dienen bij de Sociale Verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47d
  - number: 47d.4
    text: |-
      Het plan van aanpak, bedoeld in [artikel 44a][ref1], wordt door de Sociale verzekeringsbank vastgesteld in
      overeenstemming met het college.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47d
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 44a
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 47e
    text: |-
      De [artikelen 64][ref1] en [67][ref2] zijn van overeenkomstige toepassing voor het kosteloos verstrekken van
      opgaven en inlichtingen aan de Sociale verzekeringsbank die noodzakelijk zijn voor de uitvoering van de taak
      van de Sociale verzekeringsbank op grond van dit hoofdstuk en voor het verstrekken van gegevens door de Sociale
      verzekeringsbank uit de administratie voor de uitvoering van deze taak.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel67
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47e
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '64'
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '67'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: 47f.1
    text: |-
      Rechten en verplichtingen die voortvloeien uit een door het college verstrekte geldlening of borgtocht op grond van
      [artikel 48][ref1], [50][ref2] of [78c][ref3], die op grond van [artikel 47a][ref4] wordt voortgezet, gaan over op
      de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel50
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel78c
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47f
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '48'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 78c
        hoofdstuk: 7a
      - id: ref4
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 47f.2
    text: |-
      Vermogensbestanddelen die voortvloeien uit een geldlening als bedoeld in het eerste lid gaan met ingang van de
      datum van voortzetting van de geldlening op grond van [artikel 47a][ref1] over op de Sociale verzekeringsbank,
      zonder dat daarvoor een akte of betekening nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47f
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 47f.3
    text: |-
      Met betrekking tot de op grond van het tweede lid overgaande vermogensbestanddelen die in openbare registers
      te boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders
      van die registers. De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de
      desbetreffende registers gedaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47f
  - number: 47f.4
    text: |-
      Terzake van de in het tweede lid bedoelde overgang van vermogensbestanddelen blijft heffing van
      overdrachtsbelasting achterwege.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47f
  - number: 47f.5
    text: |-
      Indien de Sociale verzekeringsbank het bedrag van de geldlening of borgtocht invordert, betaalt de Sociale
      verzekeringsbank aan het college, bedoeld in het eerste lid, het bedrag van de door het college verstrekte
      geldlening of borgtocht, of indien de opbrengst na aftrek van kosten minder bedraagt dan het totale bedrag van de
      geldlening of borgtocht een evenredig deel van de geldlening of borgtocht.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47f
  - number: 47g.1
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete van ten hoogste het benadelingsbedrag wegens het niet of
      niet behoorlijk nakomen door de belanghebbende van de verplichting, bedoeld in [artikel 17, eerste lid][ref1].
      De bestuurlijke boete is niet lager dan de boete die op grond van het derde lid zou worden opgelegd indien er geen
      sprake was van een benadelingsbedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 47g.2
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het bedrag dat als gevolg van het niet of niet behoorlijk
      nakomen van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], ten onrechte of tot een te hoog bedrag aan
      bijstand is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 47g.3
    text: |-
      Indien het niet of niet behoorlijk nakomen door de belanghebbende van een verplichting als bedoeld
      in [artikel 17, eerste lid][ref1], niet heeft geleid tot een benadelingsbedrag, legt de Sociale
      verzekeringsbank een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 47g.4
    text: |-
      De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete als bedoeld in het derde lid
      en volstaan met het geven van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen door
      de belanghebbende van een verplichting als bedoeld in [artikel 17, eerste lid][ref1], tenzij het niet of niet
      behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 47g.5
    text: |-
      De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door de
      belanghebbende van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], als gevolg waarvan ten onrechte
      of tot een te hoog bedrag aan bijstand is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag
      indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van constatering van de overtreding een eerdere
      overtreding, bestaande uit eenzelfde gedraging, is geconstateerd en de bestuurlijke boete of strafrechtelijke
      sanctie wegens de eerdere overtreding onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 47g.6
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de eerdere
      overtreding, bedoeld in het vijfde lid, de belanghebbende is gestraft met een onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
  - number: 47g.7
    text: 'De Sociale verzekeringsbank kan:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
  - number: 47g.7.a
    text: de bestuurlijke boete verlagen indien sprake is van verminderde verwijtbaarheid;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
  - number: 47g.7.b
    text: afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
  - number: 47g.8
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
  - number: 47g.9
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
  - number: 47g.10
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
  - number: 47g.11
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel47g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '48.1'
    text: Tenzij in deze wet anders is bepaald, wordt de bijstand verleend om niet.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
  - number: '48.2'
    text: 'Bijstand kan worden verleend in de vorm van een geldlening of borgtocht indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
  - number: 48.2.a
    text: |-
      redelijkerwijs kan worden aangenomen dat de belanghebbende op korte termijn over voldoende middelen zal beschikken
      om over de betreffende periode in de noodzakelijke kosten van het bestaan te voorzien;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
  - number: 48.2.b
    text: |-
      de noodzaak tot bijstandsverlening het gevolg is van een tekortschietend besef van verantwoordelijkheid voor de
      voorziening in het bestaan;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
  - number: 48.2.c
    text: de aanvraag een door de belanghebbende te betalen waarborgsom betreft;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
  - number: 48.2.d
    text: het bijstand ter gedeeltelijke of volledige aflossing van een schuldenlast betreft.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
  - number: '48.3'
    text: |-
      Het college kan aan het verlenen van bijstand in de vorm van een geldlening verplichtingen verbinden
      die zijn gericht op meerdere zekerheid voor de nakoming van de aan deze bijstand verbonden rente- en
      aflossingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
  - number: '48.4'
    text: |-
      Het college verstrekt bijzondere bijstand als bedoeld in [artikel 35, vijfde lid][ref1], in natura, tenzij dit naar
      het oordeel van het college leidt tot een ondoelmatige uitvoering van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel35
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '48.5'
    text: |-
      Indien de persoon aan wie bijstand in de vorm van een geldlening wordt verleend algemene bijstand of een uitkering
      op grond van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] of het
      [Besluit bijstandverlening zelfstandigen 2004][ref3] ontvangt, is het college bevoegd tot verrekening van die
      geldlening met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0015711
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
      - id: ref3
        bwb_id: BWBR0015711
  - number: '49'
    text: |-
      In afwijking van [artikel 13, eerste lid, onderdeel g][ref1], kan het college bijzondere bijstand verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel13
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 49.a
    text: |-
      in de vorm van borgtocht, indien het verzoek van de belanghebbende tot verlening van een saneringskrediet
      is afgewezen vanwege diens beperkte mogelijkheden tot terugbetaling en de borgtocht noodzakelijk is om de
      krediettransactie alsnog doorgang te doen vinden door een:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel49
  - number: 49.a.1°
    text: |-
      gemeentelijke kredietbank als bedoeld in de [Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 49.a.2°
    text: |-
      een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      bank mag uitoefenen, indien de gemeente niet is aangesloten bij een gemeentelijke kredietbank dan wel daarmee geen
      relatie onderhoudt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 49.b
    text: indien daartoe zeer dringende redenen bestaan en de in onderdeel a genoemde mogelijkheid geen uitkomst biedt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel49
  - number: '50.1'
    text: |-
      De belanghebbende die eigenaar is van een door hemzelf of zijn gezin bewoonde woning met bijbehorend erf, heeft
      recht op bijstand voor zover tegeldemaking, bezwaring of verdere bezwaring, van het in de woning met bijbehorend
      erf gebonden vermogen in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel50
  - number: '50.2'
    text: |-
      Indien voor de belanghebbende, bedoeld in het eerste lid, recht op algemene bijstand bestaat, heeft die bijstand de
      vorm van een geldlening:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel50
  - number: 50.2.a
    text: |-
      indien de bijstand over een periode van een jaar, te rekenen vanaf de eerste dag waarover bijstand wordt verleend,
      naar verwachting meer bedraagt dan het netto minimumloon, bedoeld in [artikel 37, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel37
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 50.2.b
    text: |-
      voorzover het vermogen gebonden in de woning met bijbehorend erf hoger is dan het vermogen, bedoeld in
      [artikel 34, tweede lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '51.1'
    text: |-
      Bijzondere bijstand voor de kosten van noodzakelijke duurzame gebruiksgoederen kan worden verleend in de vorm van
      een geldlening of borgtocht, dan wel in de vorm van een bedrag om niet.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel51
  - number: '51.2'
    text: |-
      Indien een geldlening als bedoeld in het eerste lid wordt verstrekt, stemt het college de aflossingsbedragen en de
      duur van de aflossing mede af op de omstandigheden, mogelijkheden en middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel51
  - number: '52.1'
    text: |-
      Het college verleent uiterlijk binnen vier weken na de datum van aanvraag en vervolgens telkens uiterlijk na vier
      weken, bij wijze van voorschot algemene bijstand in de vorm van een renteloze geldlening, zolang het recht op
      algemene bijstand niet is vastgesteld. De eerste zin is niet van toepassing indien:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel52
  - number: 52.1.a
    text: |-
      de belanghebbende de voor de vaststelling van het recht op algemene bijstand van belang zijnde gegevens of de
      gevorderde bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel
      indien de belanghebbende anderszins onvoldoende medewerking verleent;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel52
  - number: 52.1.b
    text: bij de aanvraag duidelijk is dat geen recht op algemene bijstand bestaat.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel52
  - number: '52.2'
    text: |-
      De hoogte van het in het eerste lid bedoelde voorschot bedraagt in ieder geval 90% van de hoogte van de algemene
      bijstand, bedoeld in [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel19
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '52.3'
    text: |-
      Het college is bevoegd om bij wijze van voorschot bijzondere bijstand te verlenen in de vorm van een renteloze
      geldlening.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel52
  - number: '52.4'
    text: |-
      Indien bijstand wordt verleend over een periode waarover met toepassing van het eerste lid een voorschot is
      verleend, kan deze bijstand zonder machtiging van de belanghebbende worden verrekend met dit voorschot.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel52
  - number: '53.1'
    text: |-
      Indien algemene bijstand wordt verleend over een periode, waarover een uitkering op grond van de
      [Werkloosheidswet][ref1], de [Ziektewet][ref2], de [Wet werk en inkomen naar arbeidsvermogen][ref3], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref4], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5],
      de [Wet inkomensvoorziening oudere werklozen][ref6] of de [Toeslagenwet][ref7] of een inkomensvoorziening
      op grond van de [Wet werk en arbeidsondersteuning jonggehandicapten][ref8] als voorschot op grond van
      [artikel 4:95 van de Algemene wet bestuursrecht][ref9] betaalbaar is gesteld en dit voorschot door het
      Uitvoeringsinstituut werknemersverzekeringen wordt teruggevorderd, kan deze bijstand zonder machtiging van de
      belanghebbende tot het bedrag van dit voorschot aan het Uitvoeringsinstituut werknemersverzekeringen worden
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0024394
      [ref7]: https://wetten.overheid.nl/BWBR0004043
      [ref8]: https://wetten.overheid.nl/BWBR0008657
      [ref9]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
        bwb_id: BWBR0024394
      - id: ref7
        bwb_id: BWBR0004043
      - id: ref8
        bwb_id: BWBR0008657
      - id: ref9
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '53.2'
    text: |-
      In het geval, bedoeld in het eerste lid, vergoedt de gemeente aan het Uitvoeringsinstituut werknemersverzekeringen
      tevens de over de te verlenen bijstand verschuldigde loonbelasting, premies volksverzekeringen en de
      inkomensafhankelijke bijdrage, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel42
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '42'
  - number: 53a.1
    text: |-
      Onverminderd [30c, tweede, vierde en vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepaalt het college welke gegevens ten behoeve van de verlening van bijstand dan wel de voortzetting daarvan
      door de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden overgelegd, alsmede de
      wijze en het tijdstip waarop de verstrekking van gegevens plaatsvindt. De gegevens en bewijsstukken worden door
      het college niet verkregen van de belanghebbende voor zover ze zijn verkregen door het Uitvoeringsinstituut
      werknemersverzekeringen dan wel voor zover zij verkregen kunnen worden uit de polisadministratie, bedoeld in
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], de verzekerdenadministratie,
      bedoeld in [artikel 35 van die wet][ref3], alsmede uit de basisregistratie personen, tenzij hierdoor een goede
      vervulling van de taak van het college op grond van dit artikel wordt belet of bij wettelijk voorschrift anders is
      bepaald. Bij of krachtens algemene maatregel van bestuur kunnen andere administraties worden aangewezen waarvoor
      de tweede zin van toepassing is, worden regels gesteld over de gegevens die het betreft en kunnen administraties
      worden aangewezen waarvoor de tweede zin tijdelijk niet van toepassing is. Indien het authentieke gegevens uit
      andere basisregistraties betreft, is dit lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
  - number: 53a.2
    text: 'In aanvulling op het eerste lid kan het college de belanghebbende verzoeken aan te tonen dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
  - number: 53a.2.a
    text: |-
      hij een belanghebbende is als bedoeld in [artikel 20, eerste lid, aanhef en onderdeel a][ref1], of
      artikel 20, tweede lid, aanhef en onderdeel a, of [artikel 21, aanhef en onderdeel a of b][ref2], of
      [artikel 22, aanhef en onderdeel a of b][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel22
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 53a.2.b
    text: |-
      de feitelijke woonsituatie van hemzelf, van zijn echtgenoot of van een kind in overeenstemming is met het door hem
      verstrekte adres van hemzelf, zijn echtgenoot of van een kind;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
  - number: 53a.2.c
    text: hij de algemeen noodzakelijke kosten van het bestaan niet geheel of gedeeltelijk kan delen met een ander.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
  - number: 53a.3
    text: |-
      Indien de belanghebbende niet desgevraagd aantoont dat hij een belanghebbende is als bedoeld in
      [artikel 20, eerste lid, aanhef en onderdeel a][ref1], of artikel 20, tweede lid, aanhef en onderdeel a, of
      [artikel 21, aanhef en onderdeel a of b][ref2], of [artikel 22, aanhef en onderdeel a of b][ref3]:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel22
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 53a.3.a
    text: |-
      kent het college, onverminderd de toepassing van [artikel 27][ref1], de uitkering toe respectievelijk herziet het
      de uitkering naar de helft van de norm, bedoeld in [artikel 20, eerste lid, onderdeel b][ref2], onderscheidenlijk
      artikel 20, tweede lid, onderdeel b, onderscheidenlijk [artikel 21, onderdeel c][ref3], onderscheidenlijk
      [artikel 22, onderdeel c][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel22
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 53a.3.b
    text: |-
      wordt de belanghebbende voor de toepassing van de [artikelen 9, vierde lid][ref1], en [9a][ref2] niet als
      alleenstaande ouder aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 9a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 53a.3.c
    text: |-
      zijn de [artikelen 25][ref1] en [30, tweede lid][ref2], in die gevallen niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel30
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 53a.4
    text: |-
      Indien de belanghebbende niet desgevraagd de woonsituatie, bedoeld in het tweede lid, onderdeel b, aantoont op
      de wijze bedoeld in de laatste zin van dat lid, schort het college de betaling van de bijstand op, niet dan nadat
      het college aan belanghebbende gelegenheid heeft gegeven op andere wijze aan te tonen dat het feitelijke woonadres
      overeenkomt met het verstrekte adres, indien daartoe niet eerder aan belanghebbende gelegenheid is geboden.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
  - number: 53a.5
    text: |-
      Het college doet schriftelijke mededeling van de opschorting aan de belanghebbende en stelt hem daarbij
      in de gelegenheid om aan te tonen dat het feitelijke woonadres overeenstemt met het verstrekte adres.
      [Artikel 40, vierde lid, aanhef en onderdeel c, en zesde lid, tweede zin][ref1], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 53a.6
    text: |-
      Indien de belanghebbende niet desgevraagd zijn situatie als bedoeld in het tweede lid, onderdeel c, aantoont, zijn
      de artikelen [artikel 25][ref1] en [30, tweede lid][ref2], niet van toepassing en wordt de norm overeenkomstig
      [artikel 26][ref3] verlaagd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel26
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 53a.7
    text: |-
      Het college is bevoegd onderzoek in te stellen naar de juistheid en volledigheid van de verstrekte gegevens en
      zonodig naar andere gegevens die noodzakelijk zijn voor de verlening dan wel de voortzetting van bijstand. Indien
      het onderzoek daartoe aanleiding geeft kan het college besluiten tot herziening of intrekking van de bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
  - number: 53a.8
    text: |-
      De voordracht voor een krachtens het eerste lid, derde zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel53a
  - number: '54.1'
    text: |-
      Indien de belanghebbende de voor de verlening van bijstand van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      belanghebbende anderszins onvoldoende medewerking verleent, kan het college het recht op bijstand voor de duur van
      ten hoogste acht weken opschorten:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel54
  - number: 54.1.a
    text: vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel54
  - number: 54.1.b
    text: vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel54
  - number: '54.2'
    text: |-
      Het college doet mededeling van de opschorting aan de belanghebbende en nodigt hem uit binnen een door hen te
      stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel54
  - number: '54.3'
    text: |-
      Het college herziet een besluit tot toekenning van bijstand, dan wel trekt een besluit tot toekenning van bijstand
      in, indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], of
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van bijstand. Onverminderd het elders in deze wet bepaalde
      terzake van herziening of intrekking van een besluit tot toekenning van bijstand kan het college een besluit tot
      toekenning van bijstand herzien of intrekken, indien anderszins de bijstand ten onrechte of tot een te hoog bedrag
      is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: '54.4'
    text: |-
      Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor gestelde
      termijn, kan het college na het verstrijken van deze termijn het besluit tot toekenning van bijstand intrekken met
      ingang van de eerste dag waarover het recht op bijstand is opgeschort.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel54
  - number: '55'
    text: |-
      Naast de verplichtingen die ingevolge [hoofdstuk 2][ref1] in elk geval aan de bijstand verbonden zijn,
      dan wel daaraan door het college verbonden worden, kan het college vanaf de dag van melding als bedoeld in
      [artikel 44, tweede lid][ref2], verplichtingen opleggen die strekken tot arbeidsinschakeling, dan wel die verband
      houden met aard en doel van een bepaalde vorm van bijstand of die strekken tot zijn vermindering of beëindiging.
      Een verplichting kan, op advies van een arts, inhouden het zich onderwerpen aan een noodzakelijke behandeling van
      medische aard.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '57'
    text: |-
      Indien en zolang er gegronde redenen zijn om aan te nemen dat de belanghebbende zonder hulp niet in staat is tot
      een verantwoorde besteding van zijn bestaansmiddelen, kan het college:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel57
  - number: 57.a
    text: |-
      aan de bijstand de verplichting verbinden dat de belanghebbende eraan meewerkt dat het college in naam van de
      belanghebbende noodzakelijke betalingen uit de toegekende bijstand verricht;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel57
  - number: 57.b
    text: de bijstand in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel57
  - number: '58.1'
    text: |-
      Het college van de gemeente die de bijstand heeft verleend vordert de kosten van bijstand terug voor zover
      de bijstand ten onrechte of tot een te hoog bedrag is ontvangen als gevolg van het niet of niet behoorlijk
      nakomen van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: '58.2'
    text: |-
      Het college van de gemeente die de bijstand heeft verleend kan kosten van bijstand terugvorderen, voorzover de
      bijstand:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.2.a
    text: anders dan in het eerste lid, ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.2.b
    text: |-
      in de vorm van geldlening is verleend en de uit de geldlening voortvloeiende verplichtingen niet of niet behoorlijk
      worden nagekomen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.2.c
    text: voortvloeit uit gestelde borgtocht;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.2.d
    text: |-
      ingevolge [artikel 52][ref1] bij wijze van voorschot is verleend en nadien is vastgesteld dat geen recht op
      bijstand bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 58.2.e
    text: anderszins onverschuldigd is betaald voorzover de belanghebbende dit redelijkerwijs had kunnen begrijpen, of
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.2.f
    text: 'anderszins onverschuldigd is betaald, waaronder begrepen dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.2.f.1°
    text: |-
      de belanghebbende naderhand met betrekking tot de periode waarover bijstand is verleend, over in aanmerking te
      nemen middelen als bedoeld in [paragraaf 3.4][ref1] beschikt of kan beschikken;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 58.2.f.2°
    text: |-
      bijstand is verleend met een bepaalde bestemming en naderhand door de belanghebbende vergoedingen of
      tegemoetkomingen worden ontvangen met het oog op die bestemming.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: '58.3'
    text: |-
      Indien een gemeente ingevolge [artikel 42, derde lid][ref1], gehouden is kosten van bijstand over een bepaalde
      periode aan een andere gemeente te vergoeden, geschiedt de terugvordering over die periode, voorzover zij nog niet
      heeft plaatsgehad, door het college van eerstgenoemde gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel42
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '58.4'
    text: |-
      Het college is bevoegd tot verrekening van in de voorafgaande drie maanden ontvangen middelen met de algemene
      bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: '58.5'
    text: |-
      Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de op de terugvordering betrekking hebbende
      kosten. Loonbelasting en de premies volksverzekeringen waarvoor de gemeente die de bijstand verstrekt krachtens
      de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, kunnen worden teruggevorderd, voor zover deze
      belasting en premies niet verrekend kunnen worden met de door het college af te dragen loonbelasting en premies
      volksverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002471
  - number: '58.6'
    text: |-
      Terugvordering als bedoeld in het tweede lid, onderdeel e, vindt niet plaats, indien de betreffende kosten zijn
      gemaakt meer dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: '58.7'
    text: |-
      In afwijking van het eerste lid kan het college besluiten van terugvordering of van verdere terugvordering als
      bedoeld in het eerste lid af te zien, indien de persoon van wie de kosten van bijstand worden teruggevorderd:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.7.a
    text: gedurende tien jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.7.b
    text: |-
      gedurende tien jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.7.c
    text: |-
      gedurende tien jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: 58.7.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom, in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: '58.8'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten geheel of gedeeltelijk van terugvordering
      af te zien.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel58
  - number: '59.1'
    text: |-
      Onverminderd [artikel 58][ref1] kunnen kosten van bijstand, indien de bijstand aan een gezin wordt verleend, van
      alle gezinsleden worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '59.2'
    text: |-
      Indien de bijstand als gezinsbijstand aan gehuwden had moeten worden verleend maar zulks achterwege
      is gebleven, omdat de belanghebbende de verplichtingen, bedoeld in [artikel 17][ref1], of
      [artikelen 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet of
      niet behoorlijk is nagekomen, kunnen de kosten van bijstand mede worden teruggevorderd van de persoon met wiens
      middelen als bedoeld in [paragraaf 3.4][ref3], bij de verlening van bijstand rekening had moeten worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref3
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '59.3'
    text: |-
      De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van kosten van
      bijstand die worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel59
  - number: '60.1'
    text: |-
      De persoon van wie kosten van bijstand worden teruggevorderd is verplicht desgevraagd aan het college de
      inlichtingen te verstrekken die voor terugvordering op grond van deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
  - number: '60.2'
    text: |-
      Het college kan de kosten van de bijstand, bedoeld in de [artikelen 58][ref1] en [59][ref2] invorderen bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '60.3'
    text: |-
      Indien de persoon van wie kosten van bijstand als bedoeld in de [artikelen 58][ref1], met uitzondering
      van het eerste lid, en [59][ref2] worden teruggevorderd algemene bijstand of een uitkering op grond van
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4] ontvangt, is het
      college bevoegd tot verrekening van die kosten met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0004163
  - number: '60.4'
    text: |-
      Indien de persoon van wie kosten van bijstand als bedoeld in de [artikelen 58, eerste lid][ref1], worden
      teruggevorderd dan wel verplicht is tot betaling van een bestuurlijke boete algemene bijstand of een uitkering op
      grond van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3] ontvangt, verrekent
      het college die kosten en bestuurlijke boete met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0004044
      [ref3]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0004044
      - id: ref3
        bwb_id: BWBR0004163
  - number: '60.5'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het college. Indien het college
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene van wie kosten van bijstand worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '60.6'
    text: |-
      Zolang de belanghebbende de verplichtingen, bedoeld in het eerste lid en de [artikelen 18a, achtste lid][ref1], en
      [47g, achtste lid][ref2], niet of niet behoorlijk nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel47g
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 18a
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 47g
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 60.6.a
    text: |-
      is het college, in afwijking van [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot
      verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 60.6.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij invordering van kosten van bijstand en de
      bestuurlijke boete bij dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '60.7'
    text: |-
      Terugvordering van kosten van bijstand als bedoeld in de [artikelen 58][ref1] en [59][ref2] is bevoorrecht en volgt
      onmiddellijk na de vorderingen in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3] omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: 60a.1
    text: |-
      Indien degene van wie de kosten van bijstand worden teruggevorderd dan wel die verplicht is
      tot betaling van een bestuurlijke boete algemene bijstand of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werklozen werknemers][ref1] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] ontvangt van het
      college van een andere gemeente dan het college dat de kosten van bijstand terugvordert of de bestuurlijke boete
      heeft opgelegd, betaalt het college van die andere gemeente, zonder dat daarvoor een machtiging nodig is van de
      belanghebbende, het bedrag van de terugvordering of de bestuurlijke boete uit de algemene bijstand of de uitkering
      op verzoek aan het college dat de kosten van bijstand terugvordert of de bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: 60a.2
    text: |-
      Indien degene van wie de kosten van bijstand worden teruggevorderd dan wel die verplicht
      is tot betaling van een bestuurlijke boete een uitkering ontvangt op grond van de
      [Werkloosheidswet][ref1], de [Wet inkomensvoorziening oudere werklozen][ref2], de [Ziektewet][ref3], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4], de [Wet werk en inkomen naar arbeidsvermogen][ref5],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref6], de [Wet arbeidsongeschiktheidsvoorziening militairen][ref7],
      de [Wet arbeid en zorg][ref8] of de [Toeslagenwet][ref9] of inkomensondersteuning ontvangt op grond
      van de [Wet werk en arbeidsondersteuning jonggehandicapten][ref10] betaalt het Uitvoeringsinstituut
      werknemersverzekeringen, zonder dat daarvoor een machtiging nodig is van belanghebbende, het bedrag van de
      terugvordering of de bestuurlijke boete uit de uitkering of de inkomensondersteuning op verzoek aan het college dat
      de kosten van bijstand terugvordert of de bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0024394
      [ref3]: https://wetten.overheid.nl/BWBR0001888
      [ref4]: https://wetten.overheid.nl/BWBR0008656
      [ref5]: https://wetten.overheid.nl/BWBR0019057
      [ref6]: https://wetten.overheid.nl/BWBR0002524
      [ref7]: https://wetten.overheid.nl/BWBR0002822
      [ref8]: https://wetten.overheid.nl/BWBR0013008
      [ref9]: https://wetten.overheid.nl/BWBR0004043
      [ref10]: https://wetten.overheid.nl/BWBR0008657
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0024394
      - id: ref3
        bwb_id: BWBR0001888
      - id: ref4
        bwb_id: BWBR0008656
      - id: ref5
        bwb_id: BWBR0019057
      - id: ref6
        bwb_id: BWBR0002524
      - id: ref7
        bwb_id: BWBR0002822
      - id: ref8
        bwb_id: BWBR0013008
      - id: ref9
        bwb_id: BWBR0004043
      - id: ref10
        bwb_id: BWBR0008657
  - number: 60a.3
    text: |-
      Indien degene van wie de kosten van bijstand worden teruggevorderd dan wel die verplicht is tot betaling
      van een bestuurlijke boete een uitkering ontvangt op grond van de [Algemene Ouderdomswet][ref1] of de
      [Algemene nabestaandenwet][ref2] betaalt de Sociale verzekeringsbank, zonder dat daarvoor een machtiging nodig is
      van belanghebbende, het bedrag van de terugvordering of de bestuurlijke boete uit de uitkering op verzoek aan het
      college dat de kosten van bijstand terugvordert of de bestuurlijke boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: 60a.4
    text: |-
      Onverminderd [artikel 60, derde lid][ref1], en het eerste, tweede en derde lid kan het college een vordering die
      een belanghebbende op hem heeft, verrekenen met een vordering als bedoeld in [artikel 58][ref2] en [59][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel59
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '60'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 60a.5
    text: |-
      Indien de kosten van bijstand worden teruggevorderd door de Sociale verzekeringsbank is het eerste tot en met het
      vierde lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60a
  - number: 60b.1
    text: |-
      Bij de verrekening, bedoeld in [artikel 60, vierde lid][ref1], kan de bestuurlijke boete, bedoeld in de
      [artikelen 18a, vijfde lid][ref2], en [47g, vijfde lid][ref3], door het college onderscheidenlijk de Sociale
      verzekeringsbank, in afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref4],
      verrekend worden gedurende een tijdvak van ten hoogste drie maanden vanaf het moment van de dagtekening waarop de
      bestuurlijke boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel47g
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '60'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 18a
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 47g
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 60b.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing bij de betaling, bedoeld in [artikel 60a, eerste lid][ref1],
      van de bestuurlijke boete, bedoeld in de [artikelen 18a, vijfde lid][ref2], en [47g, vijfde lid][ref3], met
      dien verstande dat het college van die andere gemeente, bedoeld in artikel 60a, eerste lid, onderscheidenlijk de
      Sociale verzekeringsbank de bevoegdheid heeft op verzoek van de belanghebbende bij de verrekening de beslagvrije
      voet, bedoeld in de [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref4], toe
      te passen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel60a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel47g
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 60a
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 18a
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 47g
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 60b.3
    text: |-
      [Artikel 60, vierde lid][ref1], en het eerste en tweede lid zijn van overeenkomstige toepassing op de verrekening
      van de bestuurlijke boete, bedoeld in de [artikelen 18a, eerste lid][ref2], en [47g, eerste lid][ref3], indien en
      voor zover op het moment van verrekening, bedoeld in het eerste lid, de bestuurlijke boete door de overtreder niet
      is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel18a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel47g
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '60'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 18a
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 47g
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 60b.4
    text: |-
      De voorgaande leden laten de verrekening van de bestuurlijke boete op grond van de
      [artikelen 60, vierde lid][ref1], en [60a, eerste lid][ref2], na het tijdvak, bedoeld in het eerste lid, onverlet.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel60a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60b
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '60'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 60a
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 60c
    text: |-
      Door het college wordt geen medewerking verleend aan een schuldregeling indien een vordering
      is ontstaan door het niet of niet behoorlijke nakomen door de belanghebbende van de
      verplichting, bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], en
      hiervoor een bestuurlijke boete is opgelegd, dan wel met betrekking tot het niet of niet behoorlijk nakomen van die
      verplichtingen aangifte is gedaan op grond van het [Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel60c
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref3
        bwb_id: BWBR0001854
  - number: '61'
    text: |-
      Kosten van bijstand kunnen door het college worden verhaald in de gevallen en naar de regels aangegeven in deze
      paragraaf.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel61
  - number: '62'
    text: |-
      Kosten van bijstand kunnen tot de grens van de onderhoudsplicht, bedoeld in
      [Boek 1 van het Burgerlijk Wetboek][ref1], worden verhaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 62.a
    text: |-
      op degene die bij het ontbreken van gezinsverband zijn onderhoudsplicht jegens zijn echtgenoot, of minderjarig kind
      niet of niet behoorlijk nakomt en op het minderjarige kind dat zijn onderhoudsplicht jegens zijn ouders niet of
      niet behoorlijk nakomt;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62
  - number: 62.b
    text: |-
      op degene die zijn onderhoudsplicht na echtscheiding of ontbinding van het huwelijk na scheiding van tafel en bed
      niet of niet behoorlijk nakomt;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62
  - number: 62.c
    text: |-
      op degene die zijn onderhoudsplicht op grond van [artikel 395a van Boek 1 van het Burgerlijk Wetboek][ref1] niet of
      niet behoorlijk nakomt jegens zijn meerderjarig kind aan wie bijzondere bijstand is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 395a
  - number: 62a
    text: |-
      Bij de beoordeling van het bestaan van het verhaalsrecht, bedoeld in
      [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2], en de omvang van het te verhalen
      bedrag wordt rekening gehouden met de maatstaven die gelden en de omstandigheden die van belang zijn in het geval
      dat de rechter dient te beslissen over de vraag of en, zo ja, tot welk bedrag een uitkering tot levensonderhoud na
      echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed zou moeten
      worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 159a
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 62b.1
    text: |-
      Indien een rechterlijke uitspraak betreffende levensonderhoud verschuldigd op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref1] die uitvoerbaar is, niet wordt nagekomen, wordt verhaald in
      overeenstemming met deze uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 62b.2
    text: |-
      De betaling van het verschuldigde geschiedt binnen 30 dagen na bekendmaking van het besluit tot verhaal
      overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62b
  - number: 62b.3
    text: |-
      Degene op wie wordt verhaald kan binnen de termijn waarbinnen betaling moet plaatsvinden tegen het besluit tot
      verhaal in verzet komen door een verzoekschrift aan de rechtbank. Het verzet kan niet gegrond zijn op de bewering
      dat de uitkering tot onderhoud ten onrechte is opgelegd of onjuist is vastgesteld. Indien tijdig verzet is gedaan
      wordt de invordering pas voortgezet zodra het verzet is ingetrokken of ongegrond verklaard.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62b
  - number: 62b.4
    text: |-
      Het college is bevoegd, met uitsluiting van degene die de bijstand ontvangt, het verschuldigde bij dwangbevel in
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62b
  - number: 62c.1
    text: |-
      Indien degene, die bijstand ontvangt of heeft ontvangen en ten aanzien van wie door de rechter een verhaalsbedrag
      verschuldigd op grond van [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2] is
      vastgesteld, zijn woonplaats verplaatst naar een andere gemeente en aldaar bijstand ontvangt of heeft ontvangen,
      gaat de bevoegdheid tot tenuitvoerlegging van de rechterlijke uitspraak op het college van de andere gemeente over.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 159a
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 62c.2
    text: |-
      Het college van de vertrekgemeente blijft bevoegd tot tenuitvoerlegging voor zover het gaat om
      betalingsachterstanden ter zake van verhaal van bijstand die door dat college is verleend.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62c
  - number: 62d.1
    text: |-
      Het door de rechter vastgestelde verhaalsbedrag verschuldigd op grond van
      [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2] wordt jaarlijks met ingang van 1
      januari van rechtswege gewijzigd met het op grond van [artikel 402a van Boek 1 van het Burgerlijk Wetboek][ref3]
      vast te stellen percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel402a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 159a
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 402a
  - number: 62d.2
    text: |-
      De toepassing van het eerste lid blijft achterwege indien de wijziging van rechtswege bij rechterlijke uitspraak
      is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62d
  - number: 62e.1
    text: |-
      Het door de rechter vastgestelde verhaalsbedrag kan op verzoek van het college of van degene op wie verhaal wordt
      uitgeoefend door de rechter worden gewijzigd op grond van gewijzigde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62e
  - number: 62e.2
    text: |-
      Het college kan aan de rechter verzoeken het verhaalsbedrag in afwijking van een rechterlijke uitspraak betreffende
      levensonderhoud verschuldigd krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] vast te stellen, indien de
      rechter:


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62e
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 62e.2.a
    text: |-
      deze uitspraak zou kunnen wijzigen op de gronden genoemd in de [artikelen 157][ref1] en [401 van dat boek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel401
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '401'
  - number: 62e.2.b
    text: |-
      geen rekening heeft kunnen houden met alle voor de betrokken beslissing in aanmerking komende gegevens en
      omstandigheden betreffende beide partijen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62e
  - number: 62f
    text: 'Kosten van bijstand kunnen door het college worden verhaald op:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62f
  - number: 62f.a
    text: |-
      degene aan wie de persoon die bijstand ontvangt of heeft ontvangen een schenking heeft gedaan voor zover bij het
      besluit op de bijstandsaanvraag met de geschonken middelen rekening zou zijn gehouden indien de schenking niet had
      plaatsgevonden, tenzij gelet op alle omstandigheden aannemelijk is dat de schenker ten tijde van de schenking de
      noodzaak van bijstandsverlening redelijkerwijs niet heeft kunnen voorzien;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62f
  - number: 62f.b
    text: 'de nalatenschap van de persoon indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62f
  - number: 62f.b.1°
    text: |-
      aan die persoon ten onrechte bijstand is verleend en voor zover voor het overlijden nog geen terugvordering heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62f
  - number: 62f.b.2°
    text: bijstand is verleend in de vorm van geldlening of als gevolg van borgtocht.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62f
  - number: 62g.1
    text: |-
      Het besluit tot verhaal op grond van deze paragraaf, anders dan met toepassing van [artikel 62b][ref1], wordt door
      het college aan degene op wie verhaal wordt gezocht medegedeeld. Bij verhaal op de nalatenschap kan de mededeling
      worden gericht tot de langstlevende echtgenoot of een der erfgenamen die geacht kan worden bij de afwikkeling van
      de nalatenschap te zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel62b
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62g
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 62b
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 62g.2
    text: |-
      Indien de belanghebbende niet uit eigen beweging bereid is de verlangde gelden aan het college te betalen dan wel
      niet of niet tijdig tot betaling daarvan overgaat, kan het college overgaan tot verhaal in rechte.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62g
  - number: 62h.1
    text: |-
      Verzoekschriften met betrekking tot verhaal in rechte op grond van deze paragraaf, alsmede verzoeken tot wijziging
      van een rechterlijke verhaalsuitspraak, worden ingediend bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62h
  - number: 62h.2
    text: |-
      Op de indiening en behandeling van het verzoekschrift, alsmede op de procedure in hoger beroep, zijn de
      [artikelen 799, tweede lid][ref1], en [801 van het Wetboek van Burgerlijke Rechtsvordering][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel799
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel801
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62h
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '799'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '801'
  - number: 62h.3
    text: Het college kan op grond van deze paragraaf in rechte optreden zonder procureur.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62h
  - number: 62i
    text: |-
      De [artikelen 58, vijfde lid][ref1], en [60, eerste en vijfde tot en met zevende lid][ref2], zijn met
      betrekking tot het verhaal van kosten van bijstand van overeenkomstige toepassing, met dien verstande dat
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel62i
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '60'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479e
  - number: '63.1'
    text: |-
      Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en inlichtingen
      te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet door het
      college ten opzichte van een persoon te wiens behoeve bijstand is gevraagd of wordt verleend en die in zijn
      dienst dan wel voor hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt zich
      mede uit tot de inkomsten van een persoon van wie kosten van bijstand ingevolge [paragraaf 4][ref1] worden of
      kunnen worden teruggevorderd of op wie kosten van bijstand ingevolge [paragraaf 5][ref2] worden of kunnen worden
      verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: '63.2'
    text: |-
      De opgaven en inlichtingen worden desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel63
  - number: '64.1'
    text: |-
      De hieronder vermelde instanties zijn verplicht desgevraagd aan het college of, indien het college aan het
      Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de
      verlening van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet door het college:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.a
    text: het college van andere gemeenten;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.b
    text: het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.c
    text: de Belastingdienst;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.d
    text: |-
      het Zorginstituut Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
  - number: 64.1.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] als
      inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
  - number: 64.1.f
    text: |-
      de Kamer van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 64.1.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 64.1.h
    text: |-
      de Belastingdienst/Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref1] en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      betreffende de toepassing van de [Wet bevordering eigenwoningbezit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0011919
  - number: 64.1.i
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap dan wel, voor zover het betreft het
      onderwijs of onderzoek op het gebied van de landbouw en de natuurlijke omgeving, Onze
      Minister van Economische Zaken, Landbouw en Innovatie betreffende de toepassing van de
      [Wet studiefinanciering 2000][ref1], de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2] en de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
      [ref3]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
      - id: ref3
        bwb_id: BWBR0005682
  - number: 64.1.j
    text: |-
      Onze Minister van Economische Zaken, Landbouw en Innovatie betreffende de omvang van de productiebeperkende
      maatregelen voor het bedrijf van de ondernemer in de agrarische sector;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.k
    text: |-
      Onze Minister van Veiligheid en Justitie voor zover het betreft de persoon die rechtens zijn vrijheid is ontnomen
      of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.l
    text: de instanties en personen die woonruimte verhuren;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.m
    text: de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.n
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.1.o
    text: |-
      de geneesheer-directeur, bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: 64.1.p
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties betreffende de toepassing van de
      [Wet inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: 64.1.q
    text: |-
      Onze Minister en de colleges van burgemeester en wethouders voor zover het gegevens betreft die verwerkt
      worden in de registers kinderopvang en peuterspeelzaalwerk, bedoeld in de Wet kinderopvang en kwaliteitseisen
      peuterspeelzalen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.2'
    text: 'De geneesheer-directeur, bedoeld in het eerste lid, onderdeel o, verstrekt slechts gegevens en inlichtingen indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.2.a
    text: |-
      deze noodzakelijk zijn voor de uitvoering van [artikel 13, derde lid][ref1], laatste zin; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel13
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 64.2.b
    text: 'deze betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.2.b.1°
    text: de opneming;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.2.b.2°
    text: het ontslag;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.2.b.3°
    text: het verleende verlof; of
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.2.b.4°
    text: het ingetrokken verlof.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.3'
    text: |-
      Het vragen door het college en het verstrekken door de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde gegevens en inlichtingen kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.4'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college of,
      indien het college aan het Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van
      besluiten inzake de verlening van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, kosteloos alle
      gegevens en uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken die noodzakelijk
      zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.5'
    text: 'De in het eerste en het vierde lid bedoelde verplichtingen strekken zich mede uit tot degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.5.a
    text: |-
      van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref1] of op wie deze
      worden of kunnen worden verhaald ingevolge [paragraaf 5][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 64.5.b
    text: |-
      die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.5.b.1°
    text: te wiens behoeve bijstand is gevraagd of wordt verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: 64.5.b.2°
    text: |-
      van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref1] of op wie deze
      worden of kunnen worden verhaald ingevolge [paragraaf 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: '64.6'
    text: |-
      De in het eerste lid en het vierde lid bedoelde gegevens en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.7'
    text: |-
      De in het eerste lid, onderdeel a tot en met k, genoemde instanties treffen desgevraagd met het college en met het
      Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      gegevens en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het derde lid en de inhoud en
      vormgeving van de in het zevende lid bedoelde regelingen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties worden
      aangewezen die ten behoeve van aan het college te verstrekken gegevens en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het derde lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.10'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het vierde lid
      worden aangewezen voor wie de verplichtingen, bedoeld in het eerste lid tot en met achtste lid, eveneens gelden,
      voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen en
      gegevens.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.11'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tiende lid, kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.12'
    text: |-
      Onze Minister van Veiligheid en Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is
      ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel, onverwijld en kosteloos de gegevens en alle overige opgaven en inlichtingen, waarover deze
      beschikt en die noodzakelijk zijn voor het recht op bijstand, aan het college, of, indien het college aan het
      Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de verlening
      van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, door tussenkomst van het Inlichtingenbureau,
      waarbij hij gebruik kan maken van het burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.13'
    text: |-
      Onze Minister van Buitenlandse Zaken verstrekt ten aanzien van de Nederlander die in het buitenland rechtens
      zijn vrijheid is ontnomen, onverwijld en kosteloos, gegevens, en inlichtingen waarover hij beschikt en die
      noodzakelijk zijn voor het recht op bijstand, aan het college, of, indien het college aan het Uitvoeringsinstituut
      werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de verlening van bijstand, aan
      het Uitvoeringsinstituut werknemersverzekeringen, door tussenkomst van het Inlichtingenbureau, waarbij hij gebruik
      kan maken van het burgerservicenummer. Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering
      van dit lid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '64.14'
    text: |-
      De Belastingdienst verstrekt aan het college, of indien het college aan het Uitvoeringsinstituut
      werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de verlening van bijstand, aan
      het Uitvoeringsinstituut werknemersverzekeringen, zonder dat daaraan een verzoek ten grondslag ligt gegevens als
      bedoeld in het eerste lid over samenloop van een uitkering met inkomen uit of in verband met arbeid of bedrijf of
      over vermogen, die bij de uitvoering van een belastingwet of bij de invordering van enige rijksbelasting bekend
      zijn geworden voor zover die gegevens noodzakelijk zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel64
  - number: '65.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel65
  - number: '65.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel65
  - number: 65.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel65
  - number: 65.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel65
  - number: 65.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel65
  - number: '65.3'
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voorzover de persoonlijke levenssfeer van de betrokkenen daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel65
  - number: '65.4'
    text: |-
      Degene die op grond van de [artikelen 63 tot en met 68][ref1] gegevens verstrekt dient na te gaan of degene aan wie
      de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel63
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '63'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '66'
    text: |-
      Het college is verplicht, indien het bij de uitvoering van deze wet het gegronde vermoeden krijgt van een misdrijf
      dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale verzekeringswetten of
      van een Nederlands of buitenlands overheidsorgaan, voorzover dit is belast met het verrichten van uitkeringen, het
      doen van verstrekkingen dan wel het heffen van bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel66
  - number: '67.1'
    text: |-
      Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet aan
      de hieronder vermelde instanties kosteloos de gegevens te verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 67.1.a
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor de uitvoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of de wettelijke regelingen, bedoeld in de
      [artikelen 30, eerste lid, onderdeel a][ref2], en [34, eerste lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '34'
  - number: 67.1.b
    text: |-
      de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref1],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2] en de
      Belastingdienst/Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0018472
  - number: 67.1.c
    text: |-
      het college van andere gemeenten voor de uitvoering van deze wet, de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: 67.1.d
    text: |-
      het Zorginstituut Nederland, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4], voor de uitvoering van de [Zorgverzekeringswet][ref5] of de
      [Algemene Wet Bijzondere Ziektekosten][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0018450
      [ref6]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
      - id: ref5
        bwb_id: BWBR0018450
      - id: ref6
        bwb_id: BWBR0002614
  - number: 67.1.e
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: 67.1.f
    text: buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: 67.1.g
    text: |-
      bestuursorganen van Aruba, Curaçao, en Sint Maarten voor de vervulling van een taak van zwaarwegend algemeen
      belang;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: 67.1.h
    text: |-
      Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties voor de uitvoering van de [Wet inburgering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: 67.1.i
    text: |-
      Onze Minister van Veiligheid en Justitie in verband met de tenuitvoerlegging van vrijheidsstraffen en
      vrijheidsbenemende maatregelen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: '67.2'
    text: |-
      Het verstrekken door het college aan de in het eerste lid bedoelde instanties van de in het eerste lid bedoelde
      gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: '67.3'
    text: |-
      De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      betrokkenen daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: '67.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: '67.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het eerste lid worden aangewezen ten
      behoeve waarvan de verplichtingen, bedoeld in het eerste lid, eveneens gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel67
  - number: '68.1'
    text: |-
      Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in de [artikelen 64][ref1] en
      [67][ref2] bedoelde instanties wordt, indien daartoe bevoegd, gebruik gemaakt van het burgerservicenummer.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel67
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '64'
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '67'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '68.2'
    text: |-
      Derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen,
      gebruiken het burgerservicenummer slechts voor zover dat noodzakelijk is voor het verrichten van werkzaamheden die
      in het kader van de voorzieningen, bedoeld in [artikel 7, eerste lid, onderdeel a, en zevende lid][ref1], worden
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '69.1'
    text: |-
      Onze Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan het college een uitkering om het college van
      middelen te voorzien met het oog op het toekennen van:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel69
  - number: 69.1.a
    text: algemene bijstand;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel69
  - number: 69.1.b
    text: |-
      uitkeringen, als bedoeld in de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
  - number: '69.2'
    text: |-
      Bij wet wordt het totale bedrag dat beschikbaar is voor de uitkering, bedoeld in het eerste lid, vastgesteld,
      waarbij uitgangspunt is dat dit bedrag voor het desbetreffende kalenderjaar toereikend is voor de geraamde kosten
      van alle gemeenten in verband met uitgaven als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel69
  - number: '69.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor de verdeling van de uitkering, bedoeld
      in het eerste lid, onder de gemeenten en het verzamelen van gegevens noodzakelijk voor het vaststellen van deze
      verdeling.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel69
  - number: '69.4'
    text: |-
      De uitkering aan het college wordt ten minste drie maanden voorafgaand aan het kalenderjaar waarop zij betrekking
      heeft door Onze Minister bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel69
  - number: '69.5'
    text: |-
      Mede ten behoeve van de kosten van de voorzieningen, bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], niet
      zijnde uitvoeringskosten ontvangt het college een uitkering op grond van de [Wet participatiebudget][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0025039
  - number: '71.1'
    text: |-
      Het totale bedrag, bedoeld in [artikel 69, tweede lid][ref1], voor de uitkering, bedoeld in
      [artikel 69, eerste lid][ref2], wordt in het jaar waarop het bedrag betrekking heeft bij of krachtens de wet
      aangepast op basis van nieuwe ramingsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '71.2'
    text: |-
      Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 69, eerste lid][ref1], wordt aangepast binnen een periode van vier weken na de herziening door Onze
      Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '73.1'
    text: |-
      Er is een toetsingscommissie Wet werk en bijstand, die tot taak heeft Onze Minister te adviseren over een te nemen
      besluit naar aanleiding van een verzoek als bedoeld in [artikel 74, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '73.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de samenstelling, de
      taakuitoefening en oordeelsvorming door de toetsingscommissie Wet werk en bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel73
  - number: '74.1'
    text: |-
      Indien de verstrekte uitkering op grond van [artikel 69][ref1] onvoldoende dekking biedt voor de netto lasten
      van het toekennen van algemene bijstand, uitkeringen of inkomensvoorzieningen als bedoeld in artikel 69, eerste
      lid, kan door Onze Minister op verzoek van het college een incidentele of meerjarige aanvullende uitkering worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '74.2'
    text: |-
      Jaarlijks wordt bij wet het bedrag dat besteed kan worden aan aanvullende uitkeringen als bedoeld in het eerste lid
      vastgesteld, dat geen deel uitmaakt van het bedrag, bedoeld in [artikel 69, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '74.3'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt door het college ingediend bij de toetsingscommissie Wet werk en
      bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: '74.4'
    text: Onze Minister kan voorwaarden verbinden aan het besluit tot verlening van een meerjarige aanvullende uitkering.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: '74.5'
    text: 'Onze Minister kan:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: 74.5.a
    text: |-
      bepalen dat een meerjarige aanvullende uitkering wordt verminderd indien hij het college een aanwijzing heeft
      gegeven als bedoeld in [artikel 76, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel76
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 74.5.b
    text: |-
      een verleende meerjarige aanvullende uitkering verminderen of intrekken indien het college in strijd handelt met
      een wettelijk voorschrift dat betrekking heeft op de meerjarige aanvullende uitkering, of met een voorwaarde die
      aan het besluit tot verlening van een meerjarige aanvullende uitkering is verbonden dan wel indien hij het college
      een aanwijzing heeft gegeven als bedoeld in [artikel 76, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel76
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: '74.6'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: 74.6.a
    text: de gronden voor verlening van de aanvullende uitkering;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: 74.6.b
    text: de berekening van de hoogte van de uitkering;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: 74.6.c
    text: de voorwaarden, die aan het verzoek worden gesteld;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: 74.6.d
    text: de wijze van beoordeling van het verzoek door de toetsingscommissie Wet werk en bijstand;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: 74.6.e
    text: de toepassing van het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: '74.7'
    text: |-
      Bij ministeriële regeling worden regels gesteld voor de termijn waarbinnen een verzoek kan worden ingediend en de
      termijn waarbinnen op dat verzoek wordt beslist.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel74
  - number: '75'
    text: 'Bij ministeriële regeling worden regels gesteld inzake de betaling van:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel75
  - number: 75.a
    text: |-
      de uitkering, bedoeld in [artikel 69, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 75.b
    text: |-
      het bedrag waarmee de uitkering op grond van [artikel 71][ref1] wordt aangepast;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel71
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '71'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 75.c
    text: |-
      de incidentele aanvullende uitkering en de meerjarige aanvullende uitkering, bedoeld in [artikel 74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '76.1'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      vaststelt, aan het college, nadat het college gedurende acht weken in de gelegenheid is gesteld zijn zienswijze
      naar voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele
      gevallen.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
  - number: '76.2'
    text: |-
      In de aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft gebracht
      met de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
  - number: '76.3'
    text: |-
      Onze Minister schort de betaling van de uitkering, bedoeld in [artikel 69, eerste lid][ref1],
      gedurende ten minste drie maanden op, indien Onze Minister met betrekking tot de rechtmatige
      uitvoering van deze wet ernstige tekortkomingen heeft vastgesteld als bedoeld in het eerste lid, in
      [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en
      in [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      totdat:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0004044#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0004163#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0004044
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0004163
        artikel: '52'
  - number: 76.3.a
    text: hij heeft vastgesteld aan de hand van de zienswijze van het college dat de ernstige tekortkomingen zijn opgeheven;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
  - number: 76.3.b
    text: hij heeft vastgesteld, dat het college aan de in de aanwijzing opgenomen verplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
  - number: 76.3.c
    text: |-
      hij heeft geoordeeld, dat het college na afloop van de termijn, bedoeld in het tweede lid, geen of onvoldoende
      gevolg heeft gegeven aan de aanwijzing.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
  - number: '76.4'
    text: |-
      Onze Minister stelt, indien hij van oordeel is, dat het college, na afloop van de termijn, bedoeld in
      het tweede lid, geen of onvoldoende gevolg heeft gegeven aan de aanwijzing, bedoeld in het eerste lid, in
      [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1], in
      [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2]
      of in [artikel 87 van de Wet investeren in jongeren][ref3], de uitkering, bedoeld in
      [artikel 69, eerste lid][ref4], voor het jaar volgend op het jaar waarin de termijn afloopt, 1 procent lager vast.


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0004163#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0026054#Artikel87
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0004163
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0026054
        artikel: '87'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '76.5'
    text: |-
      Onze Minister stelt, indien hij van oordeel is, dat het college twaalf maanden na afloop van de termijn, bedoeld
      in het tweede lid, nog geen of onvoldoende gevolg heeft gegeven aan de aanwijzing, bedoeld in het derde lid, de
      uitkering, bedoeld in [artikel 69, eerste lid][ref1], voor het tweede jaar volgend op het jaar waarin de termijn
      afloopt en de daaropvolgende jaren, telkens ten hoogste 3 procent lager vast.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 76a
    text: Met het toezicht op de naleving van deze wet zijn belast de bij besluit van het college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel76a
  - number: '77.1'
    text: |-
      Het college legt verantwoording af aan Onze Minister over de uitvoering van deze wet, op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '77.2'
    text: Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel77
  - number: '77.3'
    text: Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel77
  - number: '78.1'
    text: |-
      Het college verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78
  - number: '78.2'
    text: |-
      De gegevens en inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in
      [artikel 77][ref1], worden kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel77
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '78.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de soort informatie die het college
      verstrekt en de wijze waarop het college de gegevens en inlichtingen verzamelt en verstrekt, waarbij kan worden
      bepaald, dat categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78
  - number: 78a
    text: |-
      De verordening, bedoeld in [artikel 38 van de Algemene bijstandswet][ref1], geldt als de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 78b.1
    text: |-
      Door het college op grond van de [Algemene bijstandswet][ref1], de [Wet inschakeling werkzoekenden][ref2] of het
      [Besluit in- en doorstroombanen][ref3] genomen besluiten gelden als door hem genomen besluiten op grond van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0009083
      [ref3]: https://wetten.overheid.nl/BWBR0010994
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78b
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0009083
      - id: ref3
        bwb_id: BWBR0010994
  - number: 78b.2
    text: |-
      In afwijking van het eerste lid gelden door het college op grond van de [Wet inschakeling werkzoekenden][ref1]
      of het [Besluit in- en doorstroombanen][ref2] ten aanzien van personen die een uitkering ontvangen op grond
      van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3]
      of de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4]
      genomen besluiten als door hem genomen besluiten op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] onderscheidenlijk
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009083
      [ref2]: https://wetten.overheid.nl/BWBR0010994
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78b
    references:
      - id: ref1
        bwb_id: BWBR0009083
      - id: ref2
        bwb_id: BWBR0010994
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0004044
  - number: 78b.3
    text: |-
      Door het college of Onze Minister op grond van de [Invoeringswet Wet werk en bijstand][ref1] genomen besluiten
      gelden met ingang van de dag van inwerkingtreding van de wet van 29 december 2008 tot intrekking van de
      Invoeringswet Wet werk en bijstand (Stb. 586) als door het college of Onze Minister genomen besluiten op grond van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015704
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78b
    references:
      - id: ref1
        bwb_id: BWBR0015704
  - number: 78c
    text: |-
      [Artikel 20 van de Algemene bijstandswet][ref1] en
      [artikel 4, vierde lid, laatste zin, van de Invoeringswet herinrichting Algemene Bijstandswet][ref2], zoals die
      luidde op 31 december 2003, blijven van toepassing op bijstand die op 31 december 2003 werd verleend met toepassing
      van die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78c
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '4'
  - number: 78d.1
    text: |-
      Een dienstbetrekking als bedoeld in [artikel 4 van de Wet inschakeling werkzoekenden][ref1], een
      arbeidsovereenkomst als bedoeld in [artikel 5, eerste lid, van die wet][ref2] en een dienstbetrekking als
      bedoeld in [artikel 6 van het Besluit in- en doorstroombanen][ref3] gelden als een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009083#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010994#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78d
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009083
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0010994
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 78d.2
    text: |-
      Op dienstbetrekkingen als bedoeld in de [Wet inschakeling werkzoekenden][ref1] blijft
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref2] alsmede de [artikelen 4, tweede, zesde en zevende lid][ref3],
      en [11, aanhef en onderdeel a, van de Wet inschakeling werkzoekenden][ref4] van toepassing. Op deze
      dienstbetrekkingen is [artikel 134, tweede lid, van de Ambtenarenwet][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009083
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0009083#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009083#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0001947#Artikel134
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78d
    references:
      - id: ref1
        bwb_id: BWBR0009083
      - id: ref2
        bwb_id: BWBR0005290
      - id: ref3
        bwb_id: BWBR0009083
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0009083
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0001947
        artikel: '134'
  - number: 78e.1
    text: 'Op een bezwaar- of beroepschrift dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78e
  - number: 78e.1.a
    text: |-
      vóór of op 31 december 2003 is ingediend tegen een door het college op grond van de [Algemene bijstandswet][ref1],
      de [Wet inschakeling werkzoekenden][ref2] of het [Besluit in- en doorstroombanen][ref3] genomen besluit en waarop
      op die datum nog niet onherroepelijk is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0009083
      [ref3]: https://wetten.overheid.nl/BWBR0010994
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0009083
      - id: ref3
        bwb_id: BWBR0010994
  - number: 78e.1.b
    text: |-
      na 31 december 2003 is ingediend tegen een op grond van de in het eerste lid
      bedoelde wetten of het [Besluit in- en doorstroombanen][ref1] met toepassing van
      [artikel 2, tweede lid, van de Invoeringswet Wet werk en bijstand][ref2], na 31 december 2003 genomen besluit en
      waarop nog niet onherroepelijk is beslist op het tijdstip dat de bepaling vervalt op grond waarvan het besluit
      is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0010994
      [ref2]: https://wetten.overheid.nl/BWBR0015704#Artikel2
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0010994
      - id: ref2
        bwb_id: BWBR0015704
        artikel: '2'
  - number: 78e.1.c
    text: |-
      na 31 december 2003 is ingediend en betrekking heeft op bijstandsverlening waarop op grond van
      [artikel 12, eerste lid, van de Invoeringswet Wet werk en bijstand][ref1] de [Algemene bijstandswet][ref2]
      van toepassing is; wordt beslist met toepassing van onderscheidenlijk de [Algemene bijstandswet][ref3],
      [de Wet inschakeling werkzoekenden][ref4] of het [Besluit in- en doorstroombanen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0015704#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007333
      [ref3]: https://wetten.overheid.nl/BWBR0007333
      [ref4]: https://wetten.overheid.nl/BWBR0009083
      [ref5]: https://wetten.overheid.nl/BWBR0010994
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0015704
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007333
      - id: ref3
        bwb_id: BWBR0007333
      - id: ref4
        bwb_id: BWBR0009083
      - id: ref5
        bwb_id: BWBR0010994
  - number: 78e.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op verzoeken als bedoeld in
      [artikel 140 van de Algemene bijstandswet][ref1] en verzoeken om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '140'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 78e.3
    text: |-
      Op een bezwaar- of beroepschrift dat voor of op de dag van inwerkingtreding van de wet van 29 december 2008 tot
      intrekking van de Invoeringswet Wet werk en bijstand (Stb. 586) is ingediend tegen een door het college of Onze
      Minister op grond van de [Invoeringswet Wet werk en bijstand][ref1] genomen besluit en waarop op die datum nog niet
      onherroepelijk is beslist wordt beslist met toepassing van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015704
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0015704
  - number: 78f
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verlening van bijstand
      en bijstand ter voorziening in de behoefte aan bedrijfskapitaal op grond van deze wet aan zelfstandigen en aan
      personen die algemene bijstand ontvangen en voornemens zijn een bedrijf of zelfstandig beroep te beginnen en zich
      in verband hiermee niet beschikbaar stellen voor arbeid in dienstbetrekking gedurende de voorbereidingsperiode
      van ten hoogste twaalf maanden, waarbij kan worden afgeweken van de [artikelen 9][ref1], [10][ref2], [11][ref3],
      [32][ref4], [34][ref5], [40][ref6], [41][ref7], [45][ref8], [58][ref9], [69][ref10], [77][ref11] en de
      [paragrafen 4.2][ref12], [6.1][ref13] en [7.1][ref14].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Artikel34
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel40
      [ref7]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref8]: https://wetten.overheid.nl/BWBR0015703#Artikel45
      [ref9]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref10]: https://wetten.overheid.nl/BWBR0015703#Artikel69
