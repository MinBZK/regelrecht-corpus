  - number: 78h.1
    text: |-
      De Sociale verzekeringsbank kan de verlening van bijstand aan een Nederlander die zich in het buitenland bevindt
      voortzetten ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
  - number: 78h.1.a
    text: |-
      degene die in december 1995 bijstand ontving op grond van [artikel 82][ref1] of
      [artikel 95 van de Algemene Bijstandswet][ref2], welke bijstand niet is geëindigd;


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0007333#Artikel95
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '82'
      - id: ref2
        bwb_id: BWBR0007333
        artikel: '95'
  - number: 78h.1.b
    text: |-
      degene die op enig moment in de periode van 26 weken onmiddellijk voorafgaand aan 31 december 1995 bijstand ontving
      op grond van [artikel 82 van de Algemene Bijstandswet][ref1], welke bijstand in die periode is geëindigd, indien
      belanghebbende binnen 26 weken na die datum opnieuw bijstand aanvraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel82
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '82'
  - number: 78h.2
    text: |-
      De in het eerste lid bedoelde bijstand wordt afgestemd op de omstandigheden, mogelijkheden en middelen van de
      belanghebbende, rekening houdend met het niveau van de noodzakelijke kosten van het bestaan ter plaatse.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
  - number: 78h.3
    text: |-
      De artikelen van deze wet zijn niet van toepassing, voor zover de omstandigheden het toelaten, met uitzondering van
      [hoofdstuk 2][ref1] en de [paragrafen 6.1 tot en met 6.5][ref2], met dien verstande dat de Sociale verzekeringsbank
      in de plaats treedt van het college.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 78h.4
    text: |-
      Zodra ten minste 26 weken zijn verstreken nadat de bijstand die werd verleend op grond van het eerste lid werd
      beëindigd, is dat lid ten aanzien van het desbetreffende geval niet langer van toepassing.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
  - number: 78h.5
    text: |-
      In de middelen tot dekking van de uitgaven verbonden aan de uitvoering van dit artikel wordt voorzien door een
      rijksbijdrage aan de Sociale verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
  - number: 78h.6
    text: |-
      Op de uitgaven, bedoeld in het vijfde lid, komen in mindering de bedragen die door de Sociale verzekeringsbank op
      grond van deze wet zijn ontvangen door terugvordering.
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
  - number: 78h.7
    text: |-
      Een nog niet afgehandeld en tot Onze Minister gericht verzoek om op grond van
      [artikel 6 van de Invoeringswet Wet werk en bijstand][ref1] een besluit te nemen, wordt vanaf 1 januari 2009
      beschouwd als te zijn gericht tot de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015704#Artikel6
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
    references:
      - id: ref1
        bwb_id: BWBR0015704
        artikel: '6'
  - number: 78h.8
    text: |-
      Bezwaren en beroepen die zijn of worden ingesteld tegen een besluit genomen op grond van
      [artikel 6 van de Invoeringswet Wet werk en bijstand][ref1] gelden vanaf 1 januari 2009 als bezwaren en beroepen
      gericht tot de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015704#Artikel6
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78h
    references:
      - id: ref1
        bwb_id: BWBR0015704
        artikel: '6'
  - number: 78i.1
    text: |-
      Een besluit van het college tot verlening van algemene bijstand aan een persoon als bedoeld in
      [artikel 47a, eerste lid][ref1], dat is genomen vóór de datum van inwerkingtreding van [paragraaf 5.4][ref2],
      geldt met ingang van die datum als genomen door de Sociale verzekeringsbank op grond van paragraaf 5.4.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78i
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78i.2
    text: |-
      De toepassing van [paragraaf 6.5][ref1] in relatie tot besluiten als bedoeld in het eerste lid gaat na de datum
      van inwerkingtreding van [paragraaf 5.4][ref2] over op de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78i
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78i.3
    text: |-
      Een tot het college gericht verzoek door een persoon als bedoeld in [artikel 47a, eerste lid][ref1], om een besluit
      te nemen, waarop op de datum van inwerkingtreding van paragraaf 5.4 nog niet is beslist, geldt met ingang van die
      datum als te zijn gericht tot de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78i
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78j.1
    text: |-
      Het college dat vóór de datum van inwerkingtreding van [paragraaf 5.4][ref1] ten aanzien van een persoon als
      bedoeld in [artikel 47a, eerste lid][ref2], een vordering heeft in verband met terugvordering of verhaal van kosten
      van bijstand anders dan in verband met het recht op algemene bijstand, waarop [artikel 78i][ref3] van toepassing
      is, blijft, indien die vordering nog niet geheel is voldaan, bevoegd die vordering te innen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel78i
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78j
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: 78i
        hoofdstuk: 7a
  - number: 78j.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van een vóór de datum van inwerkingtreding van
      [paragraaf 5.4][ref1] verstrekte geldlening of borgtocht op grond van [artikel 48][ref2], [50][ref3] en
      [78c][ref4] aan een persoon als bedoeld in [artikel 47a, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel78c
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78j
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '48'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '50'
