      - id: ref4
        bwb_id: BWBR0015703
        artikel: 78c
        hoofdstuk: 7a
      - id: ref5
        bwb_id: BWBR0015703
        artikel: 47a
        hoofdstuk: '5'
        paragraaf: '5.4'
  - number: 78k.1
    text: |-
      Rechten en verplichtingen die voortvloeien uit een door het college vóór de datum van inwerkingtreding van
      [paragraaf 5.4][ref1] verstrekte geldlening of borgtocht op grond van [artikel 48][ref2], [50][ref3] en
      [78c][ref4] aan een persoon als bedoeld in [artikel 47a, eerste lid][ref5], die na die datum wordt voortgezet, gaan
      over op de Sociale verzekeringsbank.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel78c
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Artikel47a
    url: https://wetten.overheid.nl/BWBR0015703/2014-04-01#Artikel78k
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '5'
        paragraaf: '5.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '48'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '6.1'
