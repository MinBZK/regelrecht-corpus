        artikel: '8'
  - number: '6.2'
    text: |-
      Voor de toepassing van deze wet wordt niet als algemeen geaccepteerde arbeid beschouwd arbeid op grond van
      een dienstbetrekking als bedoeld in [hoofdstuk 2][ref1] of [3 van de Wet sociale werkvoorziening][ref2].
      Voor de toepassing van de [artikelen 7][ref3], [8][ref4] en [10][ref5] wordt voor personen die blijkens een
      indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoren van de [Wet sociale werkvoorziening][ref6]
      onder een voorziening gericht op arbeidsinschakeling mede verstaan een voorziening gericht op het verkrijgen van
      arbeid in een dienstbetrekking als bedoeld in de [artikelen 2][ref7] en [7 van die wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
