  - number: 53a
    text: |-
      1 Onverminderd
      [artikel 30c, tweede, vierde en vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepaalt het college welke gegevens ten behoeve van de verlening van bijstand dan wel de voortzetting daarvan
      en de arbeidsinschakeling door de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden
      overgelegd, alsmede de wijze en het tijdstip waarop de verstrekking van gegevens plaatsvindt. De gegevens
      en bewijsstukken worden door het college niet verkregen van de belanghebbende voor zover ze zijn verkregen
      door het Uitvoeringsinstituut werknemersverzekeringen dan wel voor zover zij verkregen kunnen worden uit de
      polisadministratie, bedoeld in [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2],
      de verzekerdenadministratie, bedoeld in [artikel 35 van die wet][ref3], alsmede uit de basisregistratie
      personen, tenzij hierdoor een goede vervulling van de taak van het college op grond van dit artikel wordt belet
      of bij wettelijk voorschrift anders is bepaald. Bij of krachtens algemene maatregel van bestuur kunnen andere
      administraties worden aangewezen waarvoor de tweede zin van toepassing is, worden regels gesteld over de gegevens
      die het betreft en kunnen administraties worden aangewezen waarvoor de tweede zin tijdelijk niet van toepassing is.
      Indien het authentieke gegevens uit andere basisregistraties betreft, is dit lid van overeenkomstige toepassing.

      2 In aanvulling op het eerste lid kan het college de belanghebbende verzoeken aan te tonen dat:

      a. hij een belanghebbende is als bedoeld in [artikel 20, eerste lid, aanhef en onderdeel a][ref4],
      of artikel 20, tweede lid, aanhef en onderdeel a, of [artikel 21, aanhef en onderdeel a][ref5], of
      [artikel 22, aanhef en onderdeel a][ref6] of dat op hem [artikel 22a][ref7] niet van toepassing is, dan wel dat
      er niet meer dan het door hem gestelde aantal kostendelende medebewoners als bedoeld in [artikel 19a][ref8] in
      dezelfde woning zijn hoofdverblijf heeft;

      b. de feitelijke woonsituatie van hemzelf, van zijn echtgenoot of van een kind in overeenstemming is met het door
      hem verstrekte adres van hemzelf, zijn echtgenoot of van een kind.

      Teneinde hem daartoe in de gelegenheid te stellen kan het college bij die verzoeken de belanghebbende aanbieden met
      diens toestemming zijn woning binnen te treden.

      3 Indien de belanghebbende niet desgevraagd aantoont dat hij een belanghebbende is als bedoeld in
      [artikel 20, eerste lid, aanhef en onderdeel a][ref9], of artikel 20, tweede lid, aanhef en onderdeel a,
      of [artikel 21, aanhef en onderdeel a][ref10], of [artikel 22, aanhef en onderdeel a][ref11], of dat
      [artikel 22a][ref12] niet op hem van toepassing is, dan wel dat hij niet aantoont dat er niet meer dan het door
      hem gestelde aantal kostendelende medebewoners als bedoeld in artikel 19a in dezelfde woning zijn hoofdverblijf
      heeft:

      a. kent het college, onverminderd de toepassing van [artikel 27][ref13], de uitkering toe respectievelijk herziet
      het de uitkering naar 30% van de in [artikel 22a, eerste lid][ref14], bedoelde norm;

      b. wordt de belanghebbende voor de toepassing van de [artikelen 9, vierde lid][ref15], en [9a][ref16] niet als
      alleenstaande ouder aangemerkt.

      4 Indien de belanghebbende niet desgevraagd de woonsituatie, bedoeld in het tweede lid, onderdeel b, aantoont op
      de wijze bedoeld in de laatste zin van dat lid, schort het college de betaling van de bijstand op, niet dan nadat
      het college aan belanghebbende gelegenheid heeft gegeven op andere wijze aan te tonen dat het feitelijke woonadres
      overeenkomt met het verstrekte adres, indien daartoe niet eerder aan belanghebbende gelegenheid is geboden.

      5 Het college doet schriftelijke mededeling van de opschorting aan de belanghebbende en stelt hem daarbij
      in de gelegenheid om aan te tonen dat het feitelijke woonadres overeenstemt met het verstrekte adres.
      [Artikel 40, derde lid, aanhef en onderdeel c, en vijfde lid, tweede zin][ref17], zijn van overeenkomstige
      toepassing.

      6 Het college is bevoegd onderzoek in te stellen naar de juistheid en volledigheid van de verstrekte gegevens en
      zonodig naar andere gegevens die noodzakelijk zijn voor de verlening dan wel de voortzetting van bijstand. Indien
      het onderzoek daartoe aanleiding geeft kan het college besluiten tot herziening of intrekking van de bijstand.

      7 De voordracht voor een krachtens het eerste lid, derde zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


