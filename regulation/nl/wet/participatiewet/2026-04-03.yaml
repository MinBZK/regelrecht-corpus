  - number: 47c
    text: |-
      1 De Sociale verzekeringsbank stemt de algemene bijstand als aanvullende inkomensvoorziening ouderen en de daaraan
      verbonden verplichtingen af op de omstandigheden, mogelijkheden en middelen van de belanghebbende.

      2 De Sociale verzekeringsbank verlaagt de algemene bijstand:

      a. ter zake van het niet of onvoldoende nakomen van de uit deze wet voortvloeiende verplichtingen, met uitzondering
      van de verplichting opgenomen in [artikel 17, eerste lid][ref1]; dan wel

      b. indien de belanghebbende naar het oordeel van de Sociale verzekeringsbank tekortschietend besef van
      verantwoordelijkheid betoont voor de voorziening in het bestaan.

      In afwijking van de eerste en tweede zin verlaagt de Sociale verzekeringsbank de algemene bijstand indien het
      redelijk vermoeden, bedoeld in [artikel 18b, eerste lid][ref2], bestaat ten aanzien van de echtgenoot van
      de belanghebbende. Voor de toepassing van de derde zin is artikel 18b, tweede tot en met dertiende lid, van
      overeenkomstige toepassing.

      3 Indien het college een gegrond vermoeden heeft dat een belanghebbende niet voldoet aan de verplichting
      tot arbeidsinschakeling dan wel niet of onvoldoende gebruik maakt van re-integratievoorzieningen of
      inburgeringsvoorzieningen, stelt het de Sociale verzekeringsbank daarvan in kennis.

      4 De Sociale verzekeringsbank heroverweegt een besluit als bedoeld in het tweede lid binnen een door haar te
      bepalen termijn die ten hoogste drie maanden bedraagt.

      5 De Sociale verzekeringsbank verlaagt in ieder geval de algemene bijstand overeenkomstig het zesde, zevende,
      achtste of negende lid ter zake van het niet nakomen door de belanghebbende van de volgende verplichtingen:

      a. het aanvaarden of het behouden van algemeen geaccepteerde arbeid;

      b. het uitvoering geven aan de door het college opgelegde verplichting om ingeschreven te staan bij een
      uitzendbureau;

      c. het naar vermogen verkrijgen van algemeen geaccepteerde arbeid in een andere dan de gemeente van inwoning,
      alvorens naar die andere gemeente te verhuizen;

      d. bereid zijn om te reizen over een afstand met een totale reisduur van 3 uur per dag, indien dat noodzakelijk is
      voor het naar vermogen verkrijgen, het aanvaarden of het behouden van algemeen geaccepteerde arbeid;

      e. bereid zijn om te verhuizen, indien het college is gebleken dat er geen andere mogelijkheid is voor het naar
      vermogen verkrijgen, het aanvaarden of het behouden van algemeen geaccepteerde arbeid, en de belanghebbende een
      arbeidsovereenkomst met een duur van tenminste een jaar en een netto beloning die ten minste gelijk is aan de voor
      de belanghebbende geldende bijstandsnorm, kan aangaan;

      f. het verkrijgen en behouden van kennis en vaardigheden, noodzakelijk voor het naar vermogen verkrijgen, het
      aanvaarden of het behouden van algemeen geaccepteerde arbeid;

      g. het naar vermogen verkrijgen, het aanvaarden of het behouden van algemeen geaccepteerde arbeid niet belemmeren
      door kleding, gebrek aan persoonlijke verzorging of gedrag;

      h. het gebruik maken van door het college aangeboden voorzieningen, waaronder begrepen sociale activering, gericht
      op arbeidsinschakeling en mee te werken aan onderzoek naar zijn of haar mogelijkheden tot arbeidsinschakeling.

      6 Indien de belanghebbende een verplichting als bedoeld in het vijfde lid niet nakomt, verlaagt de Sociale
      verzekeringsbank de bijstand met 100% voor een periode van ten minste een maand en ten hoogste drie maanden. De
      Sociale verzekeringsbank kan tevens bepalen dat het bedrag van de verlaging wordt verrekend over de maand van
      oplegging van de maatregel en ten hoogste de twee volgende maanden, waarbij over de eerste maand ten minste 1/3 van
      het bedrag van de verlaging wordt verrekend.

      7 Indien de belanghebbende een verplichting als bedoeld in het vijfde lid niet nakomt binnen twaalf maanden nadat
      het zesde lid toepassing heeft gevonden, verlaagt de Sociale verzekeringsbank, in afwijking van het zesde lid,
      de bijstand met 100% voor een periode die in ieder geval langer is dan de op grond van het zesde lid vastgestelde
      periode van verlaging en ten hoogste drie maanden.

      8 Indien de belanghebbende een verplichting als bedoeld in het vijfde lid niet nakomt binnen twaalf maanden nadat
      het zevende lid toepassing heeft gevonden, verlaagt de Sociale verzekeringsbank, in afwijking van het zesde en
      zevende lid, de bijstand met 100% voor een periode van drie maanden.

      9 Indien de belanghebbende een verplichting als bedoeld in het vijfde lid niet nakomt binnen twaalf maanden nadat
      het achtste lid toepassing heeft gevonden, verlaagt de Sociale verzekeringsbank, in afwijking van het zesde,
      zevende en achtste lid, telkens de bijstand met 100% voor een periode van drie maanden.

      10 De Sociale verzekeringsbank ziet af van het opleggen van een maatregel, indien elke vorm van verwijtbaarheid
      ontbreekt.

      11 De Sociale verzekeringsbank stemt een op te leggen maatregel of een opgelegde maatregel af op de omstandigheden
      van de belanghebbende en diens mogelijkheden om middelen te verwerven, indien naar zijn oordeel, gelet op
      bijzondere omstandigheden, dringende redenen daartoe noodzaken.

      12 Indien de Sociale verzekeringsbank de bijstand overeenkomstig het zesde, zevende, achtste of negende lid
      heeft verlaagd, kan de Sociale verzekeringsbank op verzoek van de belanghebbende ten aanzien van wie de maatregel
      is opgelegd, de verlaging herzien zodra het college van oordeel is dat uit de houding en gedragingen van de
      belanghebbende ondubbelzinnig is gebleken dat hij de verplichtingen, bedoeld in het vijfde lid, nakomt. Het college
      stelt de Sociale verzekeringsbank in kennis van dat oordeel.

      13 Bij de toepassing van dit artikel wordt onder belanghebbende mede verstaan het gezin.

      14 Indien de Sociale verzekeringsbank naar aanleiding van een melding als bedoeld in het derde lid toepassing heeft
      gegeven aan dit artikel stelt de Sociale verzekeringsbank het college daarvan terstond in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel18b
