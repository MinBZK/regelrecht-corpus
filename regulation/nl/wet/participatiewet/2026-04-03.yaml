  - number: 37a
    text: |-
      1 De normen voor belanghebbenden die de pensioengerechtigde leeftijd hebben bereikt, genoemd in
      [artikel 22][ref1], worden afgeleid van het netto minimumloon per maand.

      2 Op basis van het netto minimumloon per maand worden de bruto bedragen zodanig vastgesteld, dat na
      aftrek van de in te houden loonbelasting en premie voor de volksverzekeringen, rekening houdend met
      de toepasselijke heffingskortingen voor een persoon van de pensioengerechtigde leeftijd en ouder, met
      uitzondering van de ouderenkorting en alleenstaande ouderenkorting, bedoeld in de [artikelen 22b][ref2]
      en [22c van de Wet op de loonbelasting 1964][ref3], en van de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref4]:

      a. het netto bedrag per maand van een belanghebbende als bedoeld in [artikel 22, onderdeel a][ref5], gelijk is
      aan 70% van het netto minimumloon per maand;

      b. het netto bedrag per maand van een belanghebbende als bedoeld in [artikel 22, onderdelen b en c][ref6], gelijk
      is aan 50% van het netto minimumloon per maand.

      3 Op basis van de bruto bedragen, bedoeld in het tweede lid, worden de netto normen, bedoeld in het eerste
      lid, vastgesteld waarbij rekening wordt gehouden met de in te houden loonbelasting en premie voor de
      volksverzekeringen en de toepasselijke heffingskortingen voor een persoon van de pensioengerechtigde leeftijd en
      ouder, met inbegrip van de ouderenkorting en alleenstaande ouderenkorting, bedoeld in de [artikelen 22b][ref7]
      en [22c van de Wet op de loonbelasting 1964][ref8], en de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref9].


