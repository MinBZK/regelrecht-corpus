  - number: '81'
    text: |-
      1 In geval het college geen of ontoereikend toepassing heeft gegeven aan [artikel 52][ref1] kan de voorzitter van
      gedeputeerde staten, indien naar zijn oordeel de noodzaak tot onverwijlde bijstand aanwezig is, op verzoek van de
      belanghebbende besluiten dat het college algemene bijstand verleent.

      2 De beslissing van de voorzitter van gedeputeerde staten vervalt, zodra de beslissing van het college inzake
      de verlening van algemene bijstand onherroepelijk is geworden dan wel de rechtbank op het beroep heeft beslist.
      De beslissing vervalt eveneens met ingang van de datum waarop een door de voorzieningenrechter van de rechtbank
      getroffen voorlopige voorziening in werking treedt.

      3 De in het eerste lid bedoelde bijstand wordt bij wijze van voorschot verleend in de vorm van een renteloze
      geldlening.


