  - number: '17'
    text: |-
      1 De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle
      feiten en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling of het recht op bijstand. Deze verplichting geldt niet indien die feiten en omstandigheden door
      het college kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of
      kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt
      bepaald voor welke gegevens de tweede zin van toepassing is.

      2 De belanghebbende verleent het college desgevraagd de medewerking die redelijkerwijs nodig is voor de uitvoering
      van deze wet.

      3 Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1° tot en met 4°, van de Wet op de identificatieplicht][ref1]. Indien een aanvraag
      voor het recht op bijstand wordt gedaan met gebruikmaking van een elektronisch identificatiemiddel, wordt het
      college geacht de identiteit van de belanghebbende te hebben vastgesteld als bedoeld in de eerste zin.

      4 Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref2] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006297#Artikel1
