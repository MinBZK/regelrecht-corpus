  - number: '38'
    text: |-
      1 Met ingang van de dag waarop het netto minimumloon wijzigt, worden de normen, genoemd in de
      [artikelen 20, eerste en tweede lid][ref1], [21][ref2], [22a, derde lid][ref3], en [23, eerste lid][ref4],
      gewijzigd met het percentage van deze wijziging.

      2 Met ingang van de dag waarop het netto minimumloon wijzigt, wordt de norm, genoemd in
      [artikel 20, derde lid][ref5], zodanig gewijzigd dat de som van de gewijzigde norm en de norm, genoemd in
      artikel 20, eerste lid, onderdeel a, zoals deze luidt na de meest recente wijziging overeenkomstig het eerste
      lid, 90% bedraagt van het netto minimumjeugdloon voor een 18-jarige. Bij algemene maatregel van bestuur kan
      het percentage, genoemd in de eerste zin, worden gewijzigd indien de ontwikkeling van het minimumjeugdloon hier
      aanleiding toe geeft.

      3 Met ingang van de dag waarop het netto minimumloon wijzigt, worden de normen, genoemd in [artikel 22][ref6],
      gewijzigd met inachtneming van [artikel 37a][ref7].

      4 Met ingang van de dag waarop het netto minimumloon, zonder de daarin begrepen aanspraak op vakantiebijslag,
      wijzigt, worden de bedragen, genoemd in [artikel 31, tweede lid, onderdelen j, n, r, y, z en aa][ref8], gewijzigd
      met het percentage van deze wijziging.

      5 Met ingang van de dag waarop de over het inkomen, bedoeld in [artikel 32, eerste lid][ref9], verschuldigde
      loonbelasting, premies, bijdragen en inhoudingen, bedoeld in [artikel 31, derde lid][ref10], wijzigen, worden
      de bedragen en percentages ter vaststelling van de aanspraak op vakantietoeslag over een inkomen als bedoeld in
      artikel 31, vierde lid, gewijzigd.

      6 De bedragen, genoemd in [artikel 23, tweede lid][ref11], worden gewijzigd, indien het drempelinkomen, bedoeld
      in de [Wet op de zorgtoeslag][ref12], wordt aangepast, de percentages, bedoeld in [artikel 2 van die wet][ref13],
      worden gewijzigd of het bedrag van de standaardpremie op grond van [artikel 4 van die wet][ref14] op een ander
      bedrag wordt vastgesteld.

      7 De gewijzigde normen en bedragen en de dag waarop de wijzigingen ingaan, worden door of namens Onze Minister
      medegedeeld in de Staatscourant.


