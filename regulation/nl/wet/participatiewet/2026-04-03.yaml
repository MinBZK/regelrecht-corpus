      Indien als gevolg van inwerkingtreding van de [Wet afschaffing huishoudinkomenstoets][ref1] het college ten aanzien
      van belanghebbende over een periode een vordering heeft met betrekking tot kosten van algemene bijstand en als
      gevolg van inwerkingtreding van die wet die belanghebbende over diezelfde periode recht op algemene bijstand heeft
      jegens de Sociale verzekeringsbank, betaalt de Sociale Verzekeringsbank, zonder dat daarvoor machtiging nodig
      is van de belanghebbende, op verzoek van het college uit die bijstand het bedrag van die vordering uit aan het
      college.


