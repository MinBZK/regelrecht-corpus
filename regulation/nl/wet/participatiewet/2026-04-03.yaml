preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter vereenvoudiging en verduidelijking van de regelgeving en ter
    versterking van de verantwoordelijkheid der gemeenten voor de ondersteuning bij arbeidsinschakeling en de verlening
    van bijstand gewenst is te komen tot een Wet werk en bijstand, waarin de Algemene bijstandswet, de Wet financiering
    Abw, IOAW en IOAZ, de Wet inschakeling werkzoekenden en het Besluit in- en doorstroombanen zijn geïntegreerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. college: het college van burgemeester en wethouders, bedoeld in [artikel 40, eerste lid][ref1];

      c. Uitvoeringsinstituut werknemersverzekeringen: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];

      d. Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3];

      e. Inlichtingenbureau: het Inlichtingenbureau, bedoeld in
      [artikel 63 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      f. inrichting:

      1°. een instelling die zich blijkens haar doelstelling en feitelijke werkzaamheden richt op het bieden van
      verpleging of verzorging aan aldaar verblijvende hulpbehoevenden;

      2°. een instelling die zich blijkens haar doelstelling en feitelijke werkzaamheden richt op het bieden van
      slaapgelegenheid, waarbij de mogelijkheid van hulpverlening of begeleiding gedurende meer dan de helft van ieder
      etmaal aanwezig is;

      g. [Richtlijn 2004/38/EG](32004L0038): [Richtlijn nr. 2004/38/EG](32004L0038) van het Europees Parlement en de
      Raad van 29 april 2004 betreffende het recht van vrij verkeer en verblijf op het grondgebied van de lidstaten
      voor de burgers van de Unie en hun familieleden, tot wijziging van [Verordening (EEG) 1612/68](31968R1612) en
      tot intrekking van [Richtlijnen 64/221/EEG](31964L0221), [68/360/EEG](31968L0360), [72/194/EEG](31972L0194),
      [73/148/EEG](31973L0148), [75/34/EEG](31975L0034), [75/35/EEG](31975L0035), [90/364/EEG](31990L0364), [90/365/EEG]
      (31990L0365) en [93/96/EEG](31993L0096) (PbEU L 158);

      h. vrijheidsstraf of vrijheidsbenemende maatregel: een bij onherroepelijk geworden vonnis opgelegde vrijheidsstraf
      of vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref5];

      i. eIDAS-verordening: [verordening (EU) nr. 910/2014](32014R0910) van het Europees Parlement en de Raad van 23 juli
      2014 betreffende elektronische identificatie en vertrouwensdiensten voor elektronische transacties in de interne
      markt en tot intrekking van [Richtlijn 1999/93/EG](31999L0093) (PbEU 2014, L 257);

      j. elektronisch identificatiemiddel:

      1°. een elektronisch identificatiemiddel dat in Nederland is uitgegeven op grond van een overeenkomstig de eIDAS-
      verordening aangemeld stelsel voor elektronische identificatiemiddelen met ten minste betrouwbaarheidsniveau
      substantieel als bedoeld in artikel 8, tweede lid onderdeel b, van de eIDAS-verordening; of

      2°. een elektronisch identificatiemiddel dat is uitgegeven in een andere lidstaat van de Europese Unie of een
      andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte op grond van een
      stelsel voor elektronische identificatiemiddelen met ten minste betrouwbaarheidsniveau substantieel als bedoeld
      in artikel 8, tweede lid onderdeel b, van de eIDAS-verordening, en dat ten behoeve van de grensoverschrijdende
      authenticatie is erkend overeenkomstig artikel 6, eerste lid, van de eIDAS-verordening;

      k.

      l.

      m. pensioengerechtigde leeftijd: pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6];

      n. lijfrente: een lijfrente als bedoeld in
      [artikel 3.125, eerste lid, onderdelen a en c, van de Wet inkomstenbelasting 2001][ref7], een
      lijfrenterekening of een lijfrentebeleggingsrecht als bedoeld in [artikel 3.126a van die wet][ref8] die
      voorziet in een oudedagslijfrente, dan wel een recht op periodieke uitkeringen of verstrekkingen waarop
      [artikel I, onderdeel O, van hoofdstuk 2 van de Invoeringswet Wet inkomstenbelasting 2001][ref9] van toepassing is;

      o. uitreiziger: persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of
      inlichtingen- en veiligheidsdiensten, gericht aan het college of de Sociale verzekeringsbank, is
      gebleken dat het gegronde vermoeden bestaat dat deze persoon zich buiten Nederland bevindt met het doel
      om zich aan te sluiten bij een organisatie die is geplaatst op de lijst van organisaties, bedoeld in
      [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref10].


