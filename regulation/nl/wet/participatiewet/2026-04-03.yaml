  - number: '66'
    text: |-
      Het college is verplicht, indien het bij de uitvoering van deze wet het gegronde vermoeden krijgt van een misdrijf
      dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale verzekeringswetten of
      van een Nederlands of buitenlands overheidsorgaan, voorzover dit is belast met het verrichten van uitkeringen, het
      doen van verstrekkingen dan wel het heffen van bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel66
  - number: '67'
    text: |-
      1 Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet aan
      de hieronder vermelde instanties kosteloos de gegevens te verstrekken:

      a. het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor de uitvoering van
      de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] of de wettelijke regelingen, bedoeld in de
      [artikelen 30, eerste lid, onderdeel a][ref3], en [34, eerste lid, onderdeel a, van die wet][ref4];

      b. de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref5],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref6]
      en de Dienst Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref7];

      c. het college van andere gemeenten voor de uitvoering van deze wet, de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref8] en de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref9];

      d. het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref10], de Nederlandse
      Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref11], de zorgverzekeraars in
      de zin van [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref12], voor de uitvoering van de
      [Zorgverzekeringswet][ref13] of de Wlz-uitvoerders, bedoeld in [artikel 1.1.1 van de Wet langdurige zorg][ref14],
      voor de uitvoering van de [Wet langdurige zorg][ref15];

      e. derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;

      f. buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;

      g. bestuursorganen van Aruba, Curaçao, en Sint Maarten voor de vervulling van een taak van zwaarwegend algemeen
      belang;

      h. Onze Minister van Justitie en Veiligheid voor de uitvoering van de [Wet inburgering 2021][ref16] en in verband
      met de tenuitvoerlegging van vrijheidsstraffen en vrijheidsbenemende maatregelen.

      2 Het verstrekken door het college aan de in het eerste lid bedoelde instanties van de in het eerste lid bedoelde
      gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.

      3 De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      betrokkenen daardoor onevenredig wordt geschaad.

      4 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de
      wijze waarop in ieder geval gegevens dienen te worden verstrekt.

      5 Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het eerste lid worden aangewezen ten
      behoeve waarvan de verplichtingen, bedoeld in het eerste lid, eveneens gelden.


