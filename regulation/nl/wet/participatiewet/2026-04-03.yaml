  - number: '36'
    text: |-
      1 Op aanvraag van een persoon van 21 jaar of ouder doch jonger dan de pensioengerechtigde leeftijd, die langdurig
      een laag inkomen en geen in aanmerking te nemen vermogen als bedoeld in [artikel 34][ref1] heeft en geen uitzicht
      heeft op inkomensverbetering, kan het college, gelet op de omstandigheden van die persoon, een individuele
      inkomenstoeslag verlenen.

      2 Tot de omstandigheden, bedoeld in het eerste lid, worden in ieder geval gerekend:

      a. de krachten en bekwaamheden van de persoon; en

      b. de inspanningen die de persoon heeft verricht om tot inkomensverbetering te komen.

      3 Indien aan de persoon, bedoeld in het eerste lid, in de periode van 12 maanden onmiddellijk voorafgaande aan de
      aanvraag, een individuele inkomenstoeslag is verleend, wordt de aanvraag afgewezen.

      4 De [artikelen 43][ref2], [49][ref3] en [52][ref4] zijn niet van toepassing.


