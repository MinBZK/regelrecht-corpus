      1 Het college dat vóór de datum van inwerkingtreding van [paragraaf 5.4][ref1] ten aanzien van een persoon als
      bedoeld in [artikel 47a, eerste lid][ref2], een vordering heeft in verband met terugvordering of verhaal van kosten
      van bijstand anders dan in verband met het recht op algemene bijstand, waarop [artikel 78i][ref3] van toepassing
      is, blijft, indien die vordering nog niet geheel is voldaan, bevoegd die vordering te innen.

      2 Het eerste lid is van overeenkomstige toepassing ten aanzien van een vóór de datum van inwerkingtreding
      van [paragraaf 5.4][ref4] verstrekte geldlening of borgtocht op grond van [artikel 48][ref5], [50][ref6] en
      [78c][ref7] aan een persoon als bedoeld in [artikel 47a, eerste lid][ref8].


