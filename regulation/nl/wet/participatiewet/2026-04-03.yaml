  - number: '7'
    text: |-
      1 Het college:

      a. ondersteunt bij arbeidsinschakeling:

      1°. personen die algemene bijstand ontvangen,

      2°. personen als bedoeld in de [artikelen 34a, vijfde lid, onderdeel b][ref1], [35, vierde lid, onderdeel b][ref2],
      en [36, derde lid, onderdeel b, van de Wet werk en inkomen naar arbeidsvermogen][ref3] tot het moment dat
      het inkomen uit arbeid in dienstbetrekking gedurende twee aaneengesloten jaren ten minste het minimumloon
      vermenigvuldigd met de arbeidsduur welke in overeenkomstige dienstbetrekking in de regel geacht wordt een volledige
      dienstbetrekking te vormen bedraagt en ten behoeve van die persoon in die twee jaren geen loonkostensubsidie als
      bedoeld in [artikel 10d][ref4] is verleend,

      3°. personen als bedoeld in [artikel 10, tweede lid][ref5],

      4°. personen met een nabestaanden- of wezenuitkering op grond van de [Algemene nabestaandenwet][ref6]

      5°. personen met een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref7],

      6°. personen met een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref8], en

      7°. niet-uitkeringsgerechtigden

      en, indien het college daarbij het aanbieden van een voorziening, waaronder begrepen sociale activering gericht op
      arbeidsinschakeling, noodzakelijk acht, bepaalt en biedt deze voorziening aan;

      b. verleent bijstand aan personen hier te lande die in zodanige omstandigheden verkeren of dreigen te geraken dat
      zij niet over de middelen beschikken om in de noodzakelijke kosten van het bestaan te voorzien; en

      c. ontwikkelt beleid ten behoeve van het verrichten van een tegenprestatie als bedoeld in
      [artikel 9, eerste lid, onderdeel c][ref9], en voert dit uit, overeenkomstig de verordening, bedoeld in
      [artikel 8a, eerste lid, onderdeel b][ref10].

      2 Het college werkt bij de uitvoering van het eerste lid, onderdeel a, samen met het Uitvoeringsinstituut
      werknemersverzekeringen.

      3 Het eerste lid, onderdeel a, is niet van toepassing op personen:

      a. jonger dan 27 jaar;

      b. als bedoeld in [artikel 41, vierde lid][ref11], die zich hebben gemeld om bijstand aan te vragen gedurende de
      vier weken na de melding, bedoeld in [artikel 44][ref12], tenzij, gelet op de omstandigheden van de persoon, het
      college ondersteuning bij arbeidsinschakeling noodzakelijk acht; of

      c. aan wie het Uitvoeringsinstituut werknemersverzekeringen een uitkering verstrekt, tenzij het betreft een
      persoon ten behoeve van wie loonkostensubsidie als bedoeld in [artikel 10d][ref13] is verleend, tot het moment
      dat diens inkomen uit arbeid in dienstbetrekking gedurende twee aaneengesloten jaren ten minste het minimumloon
      vermenigvuldigd met de arbeidsduur welke in overeenkomstige dienstbetrekking in de regel geacht wordt een volledige
      dienstbetrekking te vormen bedraagt en ten behoeve van die persoon in die twee jaren geen loonkostensubsidie is
      verleend.

      4 Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de
      belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het
      college kan de in de eerste volzin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.

      5 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede tot en
      met vierde lid.

      6 Het eerste lid, onderdeel b, is niet van toepassing indien het verlenen van bijstand op grond van
      [artikel 47a, eerste lid][ref14], tot de taak van de Sociale verzekeringsbank behoort.

      7 Het college en het Uitvoeringsinstituut werknemersverzekeringen kunnen overeenkomen dat het college personen
      aan wie het Uitvoeringsinstituut werknemersverzekeringen een uitkering verstrekt, ondersteunt en aan die personen
      voorzieningen aanbiedt als bedoeld in het eerste lid, onderdeel a.

      8 Bij de uitoefening van de taak, bedoeld in het eerste lid, onderdeel a, is
      [artikel 5 van de Wet sociale werkvoorziening][ref15] van overeenkomstige toepassing.

      9 Het slot van het eerste lid, onderdeel a, is niet van toepassing op de tolkvoorziening, bedoeld in
      [artikel 10g][ref16], en een werkvoorziening als bedoeld in [artikel 10h][ref17].


