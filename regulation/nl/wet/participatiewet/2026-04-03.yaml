  - number: 10d
    text: |-
      1 Indien een werkgever voornemens is een dienstbetrekking aan te gaan met een persoon die behoort tot de
      doelgroep loonkostensubsidie, verleent het college ambtshalve dan wel op aanvraag van de werkgever of die persoon
      loonkostensubsidie aan de werkgever:

      a. met inachtneming van het vierde lid, nadat het college eerst de loonwaarde van die persoon heeft vastgesteld en
      de dienstbetrekking tot stand komt, dan wel

      b. met inachtneming van het vijfde lid, nadat het college in overleg met de werkgever heeft vastgesteld dat de
      vaststelling van de loonwaarde van die persoon achterwege kan blijven en de dienstbetrekking tot stand komt.

      2 Het college verleent op aanvraag van de werkgever of werknemer, gedaan binnen zes maanden na het begin van de
      dienstbetrekking, in aanvulling op de [artikelen 7][ref1] en [7a][ref2], loonkostensubsidie als na vaststelling
      door het college blijkt dat de persoon met voltijdse arbeid niet in staat is tot het verdienen van het wettelijk
      minimumloon en die persoon in de periode van zes maanden voorafgaand aan de dienstbetrekking:

      a. deelnam aan:

      1°. het praktijkonderwijs, bedoeld in [artikel 2.8 van de Wet voortgezet onderwijs 2020][ref3];

      2°. het voortgezet speciaal onderwijs, bedoeld in [artikel 2 van de Wet op de expertisecentra][ref4]; of

      3°. de entreeopleiding, bedoeld in
      [artikel 7.2.2., eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs][ref5];

      b. een persoon was als bedoeld in de [artikelen 7, eerste lid, onderdeel a][ref6], of
      [7a, eerste lid, onderdeel a][ref7]; dan wel

      c. uit ’s Rijks kas bekostigd onderwijs volgde zonder een startkwalificatie te hebben behaald, voor zover de
      aanvraag betrekking heeft op een persoon als bedoeld in [artikel 7a, derde lid][ref8], die een leer-werktraject
      volgt.

      3 Het eerste en tweede lid is niet van toepassing indien de arbeid wordt verricht in een dienstbetrekking als
      bedoeld in de [artikelen 2][ref9] en [7 van de Wet sociale werkvoorziening][ref10].

      4 De hoogte van de loonkostensubsidie, bedoeld in het eerste lid, onderdeel a, en het tweede lid, is het
      verschil tussen het wettelijk minimumloon vermeerderd met de aanspraak op vakantiebijslag op grond van
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref11] en de loonwaarde van die persoon vermeerderd
      met de voor die persoon naar rato van de loonwaarde rechtens geldende vakantiebijslag, maar is ten hoogste 70
      procent van het totale bedrag van het wettelijk minimumloon en de aanspraak op vakantiebijslag op grond van artikel
      15 van de Wet minimumloon en minimumvakantiebijslag, vermeerderd met een bij ministeriële regeling vastgestelde
      vergoeding voor werkgeverslasten. De loonkostensubsidie wordt naar evenredigheid verminderd of vermeerderd, indien
      de overeengekomen arbeidsduur korter of langer is dan 36 uren per week. De overeengekomen arbeidsduur, bedoeld in
      de vorige zin, is maximaal de arbeidsduur welke in overeenkomstige dienstbetrekkingen in de regel geacht wordt een
      volledige dienstbetrekking te vormen.

      5 De hoogte van de loonkostensubsidie, bedoeld in het eerste lid, onderdeel b, bedraagt gedurende
      een periode van maximaal de eerste zes maanden van de dienstbetrekking 50 procent van het
      totale bedrag van het wettelijk minimumloon en de aanspraak op vakantiebijslag op grond van
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref12], vermeerderd met een bij ministeriële regeling
      vastgestelde vergoeding voor werkgeverslasten. Over het tijdvak na die periode stelt het college de loonwaarde vast
      en verleent het college loonkostensubsidie met inachtneming van het vierde lid. De loonkostensubsidie wordt naar
      evenredigheid verminderd of vermeerderd, indien de overeengekomen arbeidsduur korter of langer is dan 36 uren per
      week. De overeengekomen arbeidsduur, bedoeld in de vorige zin, is maximaal de arbeidsduur welke in overeenkomstige
      dienstbetrekkingen in de regel geacht wordt een volledige dienstbetrekking te vormen.

      6 Het college bepaalt na aanvang van de dienstbetrekking bij toepassing van het vierde lid ambtshalve in overleg
      met de persoon en met de werkgever wanneer de loonwaarde opnieuw wordt vastgesteld en past, indien de hoogte van de
      loonwaarde is gewijzigd, de hoogte van de loonkostensubsidie aan.

      7 Het college stelt na aanvang van de dienstbetrekking de hoogte van de loonkostensubsidie
      ambtshalve opnieuw vast met ingang van 1 januari van het kalenderjaar in overeenstemming met
      de ontwikkeling van het wettelijk minimumloon en de aanspraak op vakantiebijslag op grond van
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref13] in de periode van 1 januari van het
      voorafgaande kalenderjaar tot en met 1 januari van het kalenderjaar waarvoor de loonkostensubsidie opnieuw wordt
      vastgesteld, en de vergoeding voor werkgeverslasten, bedoeld in het vierde en vijfde lid.

      8 Het eerste en tweede lid zijn niet langer op een persoon van toepassing, vanaf het moment dat is vastgesteld dat
      die persoon niet tot de doelgroep loonkostensubsidie behoort.

      9 Indien het college loonkostensubsidie als bedoeld in dit artikel verleent, verleent het ten aanzien van dezelfde
      dienstbetrekking geen andere subsidie voor de loonkosten.

      10 Indien een persoon in een dienstbetrekking waarbij loonkostensubsidie als bedoeld in dit artikel wordt verleend
      zijn woonplaats verplaatst naar een andere lidstaat van de Europese Unie of een andere staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte of Zwitserland, wordt gedurende die dienstbetrekking
      onder college in dit artikel verstaan het college dat op grond van het eerste of tweede lid de loonkostensubsidie
      verleende.

      11

      12 De beschikking tot loonkostensubsidie wordt genomen binnen vijf weken:

      a. nadat de loonwaarde is vastgesteld, bedoeld in [artikel 10d, eerste lid, aanhef en onderdeel a][ref14]; of

      b. nadat is vastgesteld dat de vaststelling van de loonwaarde achterwege kan blijven, bedoeld in
      [artikel 10d, eerste lid, aanhef en onderdeel b][ref15].


