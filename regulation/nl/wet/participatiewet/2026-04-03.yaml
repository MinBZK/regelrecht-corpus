  - number: 47g
    text: |-
      1 De Sociale verzekeringsbank legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens het niet
      of niet behoorlijk nakomen door de belanghebbende van de verplichting, bedoeld in [artikel 17, eerste lid][ref1].
      Indien de feiten en omstandigheden, bedoeld in artikel 17, eerste lid, niet of niet behoorlijk zijn medegedeeld
      en deze overtreding opzettelijk is begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de vijfde
      categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2]. Indien de feiten en
      omstandigheden, bedoeld in artikel 17, eerste lid, niet of niet behoorlijk zijn medegedeeld en deze overtreding
      niet opzettelijk is begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de derde categorie, bedoeld
      in artikel 23, vierde lid, van het Wetboek van Strafrecht.

      2 In dit artikel wordt onder benadelingsbedrag verstaan het bedrag dat als gevolg van het niet of niet behoorlijk
      nakomen van de verplichting, bedoeld in [artikel 17, eerste lid][ref3], ten onrechte of tot een te hoog bedrag aan
      bijstand is ontvangen.

      3 Indien het niet of niet behoorlijk nakomen door de belanghebbende van een verplichting als bedoeld
      in [artikel 17, eerste lid][ref4], niet heeft geleid tot een benadelingsbedrag, legt de Sociale
      verzekeringsbank een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref5].

      4 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete en volstaan met het geven
      van een schriftelijke waarschuwing wegens het niet of niet behoorlijk nakomen door de belanghebbende van een
      verplichting als bedoeld in [artikel 17, eerste lid][ref6], in situaties die bij algemene maatregel van bestuur
      worden bepaald, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van
      twee jaar te rekenen vanaf de datum waarop eerder aan de belanghebbende een zodanige waarschuwing is gegeven.

      5 De Sociale verzekeringsbank legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door de
      belanghebbende van de verplichting, bedoeld in [artikel 17, eerste lid][ref7], als gevolg waarvan ten onrechte
      of tot een te hoog bedrag aan bijstand is ontvangen, van ten hoogste 150 procent van het benadelingsbedrag, met
      overeenkomstige toepassing van het eerste lid, indien binnen een tijdvak van vijf jaar voorafgaand aan de dag van
      constatering van de overtreding een eerdere overtreding, bestaande uit eenzelfde gedraging, is geconstateerd en de
      bestuurlijke boete of strafrechtelijke sanctie wegens de eerdere overtreding onherroepelijk is geworden.

      6 In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens
      de eerdere overtreding, bedoeld in het vijfde lid, de belanghebbende is gestraft met een onvoorwaardelijke
      gevangenisstraf.

      7 De Sociale verzekeringsbank kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende
      redenen aanwezig zijn.

      8 Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan de Sociale verzekeringsbank de
      inlichtingen te verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.

      9 Indien bijstand aan een gezin wordt verleend, berust de verplichting tot betaling van de bestuurlijke boete bij
      alle gezinsleden en zijn deze gezinsleden hoofdelijk aansprakelijk voor de nakoming van deze verplichting.

      10 Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.

      11 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.

      12 In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref8] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de belanghebbende wijzigen.

      13 Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest van
      opzet of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd niet
      nogmaals een overtreding wegens eenzelfde gedraging is begaan, is het college bevoegd op verzoek van degene aan wie
      de bestuurlijke boete is opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt te schelden bij medewerking
      aan een schuldregeling.

      14 Het besluit tot kwijtschelding, bedoeld in het dertiende lid, wordt ingetrokken of ten nadele van degene aan
      wie de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding wegens eenzelfde gedraging is begaan.


