  - number: 78b
    text: |-
      1 Door het college op grond van de [Algemene bijstandswet][ref1], de [Wet inschakeling werkzoekenden][ref2] of het
      [Besluit in- en doorstroombanen][ref3] genomen besluiten gelden als door hem genomen besluiten op grond van deze
      wet.

      2 In afwijking van het eerste lid gelden door het college op grond van de [Wet inschakeling werkzoekenden][ref4]
      of het [Besluit in- en doorstroombanen][ref5] ten aanzien van personen die een uitkering ontvangen op grond
      van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6]
      of de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref7]
      genomen besluiten als door hem genomen besluiten op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref8] onderscheidenlijk
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref9].

      3 Door het college of Onze Minister op grond van de [Invoeringswet Wet werk en bijstand][ref10] genomen
      besluiten gelden met ingang van de dag van inwerkingtreding van de wet van 29 december 2008 tot intrekking van de
      Invoeringswet Wet werk en bijstand (Stb. 586) als door het college of Onze Minister genomen besluiten op grond van
      deze wet.


