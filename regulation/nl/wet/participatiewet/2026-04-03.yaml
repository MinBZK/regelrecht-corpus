      1 Aan een persoon:

      a. die zich tussen 26 april 2012 en 2 maanden na publicatie van de [Wet afschaffing huishoudinkomenstoets][ref1] in
      het Staatsblad heeft gemeld om bijstand aan te vragen; en

      b. van wie het college heeft vastgesteld dat hij als gevolg van de inwerkingtreding van de
      [Wet afschaffing huishoudinkomenstoets][ref2] recht heeft op bijstand,

      wordt die bijstand toegekend vanaf de dag waarop dit recht is ontstaan en kan deze dag, in afwijking van
      [artikel 44, eerste lid][ref3], liggen voor de dag waarop belanghebbende zich heeft gemeld doch niet voor 1 januari
      2012.

      2 Op de persoon, bedoeld in het eerste lid, is [artikel 41, vierde lid][ref4], niet van toepassing.


