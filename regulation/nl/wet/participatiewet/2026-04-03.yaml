  - number: 7a
    text: |-
      1 Het college kan personen die jonger zijn dan 27 jaar ondersteuning aanbieden bij of gericht op
      arbeidsinschakeling en een voorziening, waaronder begrepen sociale activering gericht op arbeidsinschaling,
      aanbieden indien het college dat noodzakelijk acht, indien:

      a. het een persoon betreft als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], en het college oordeelt dat
      het volgen van uit ’s Rijks kas bekostigd onderwijs voor die persoon niet mogelijk of niet passend is;

      b. het bevoegd gezag van een instelling als bedoeld in de [Wet educatie en beroepsonderwijs][ref2], school voor
      praktijkonderwijs als bedoeld in de [Wet voortgezet onderwijs 2020][ref3] of een instelling of school als bedoeld
      in de [Wet op de expertisecentra][ref4] daarom verzoekt; of

      c. die persoon initieel onderwijs volgt als bedoeld in de [Wet op het hoger en wetenschappelijk onderwijs][ref5].

      2 Het college kan personen jonger dan 27 jaar, die niet beschikken over een startkwalificatie en
      mogelijk uit ’s Rijks kas bekostigd onderwijs kunnen volgen, doorgeleiden naar ondersteuning op grond van
      [artikel 9.2.5 van de Wet educatie en beroepsonderwijs][ref6].

      3 De ondersteuning van een persoon die niet beschikt over een startkwalificatie vindt plaats in de vorm van een
      leer-werktraject of, indien dat gelet op de omstandigheden van de persoon passender is, op andere wijze.

      4 Bij algemene maatregel van bestuur kunnen ten behoeve van de in dit artikel bedoelde ondersteuning
      regels worden gesteld over de taak in het kader van de regionale samenwerking, het regionaal programma,
      het regionaal bestuurlijk overleg en de effectrapportage, bedoeld in de [artikelen 9.2.4][ref7],
      [9.2.8][ref8] en [9.2.10 van de Wet educatie beroepsonderwijs][ref9]. Deze taak wordt
      uitgevoerd door de centrumgemeenten van de betrokken arbeidsmarktregio’s, vastgesteld krachtens
      [artikel 10, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref10].

      5 [Artikel 7, tweede, vijfde, zevende, negende en tiende lid][ref11], zijn van overeenkomstige toepassing op
      ondersteuning bij of gericht op arbeidsinschakeling als bedoeld in het eerste lid.

      6 [Artikel 7, derde lid, onderdelen b en c][ref12], zijn van overeenkomstige toepassing op ondersteuning bij of
      gericht op arbeidsinschakeling als bedoeld in het eerste lid, onderdeel a.

      7 Indien daar gerechtvaardigde belangen voor zijn kan de ondersteuning, bedoeld in het eerste lid, aangeboden
      worden aan personen die 27 jaar of ouder zijn.


