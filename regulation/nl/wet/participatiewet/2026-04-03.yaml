  - number: '74'
    text: |-
      1 Indien de verstrekte uitkering op grond van artikel 69 onvoldoende dekking biedt voor de netto lasten van het
      toekennen van algemene bijstand, loonkostensubsidies of uitkeringen als bedoeld in [artikel 69, eerste lid][ref1],
      kan door Onze Minister op verzoek van het college een vangnetuitkering worden verleend.

      2 Jaarlijks wordt bij wet het bedrag dat besteed kan worden aan vangnetuitkeringen als bedoeld in het eerste lid
      vastgesteld, dat geen deel uitmaakt van het bedrag, bedoeld in [artikel 69, tweede lid][ref2].

      3 Een verzoek als bedoeld in het eerste lid wordt door het college ingediend bij de toetsingscommissie vangnet
      Participatiewet.

      4 Onze Minister kan voorwaarden verbinden aan het besluit tot verlening van een vangnetuitkering.

      5 Onze Minister kan een vangnetuitkering verminderen, intrekken of weigeren indien:

      a. hij het college een aanwijzing heeft gegeven als bedoeld in [artikel 76, eerste lid][ref3]; of

      b. het college in strijd handelt met een wettelijk voorschrift dat betrekking heeft op de vangnetuitkering of met
      een voorwaarde die aan het besluit tot verlening van een vangnetuitkering is verbonden.

      6 Bij of krachtens algemene maatregel van bestuur worden regels gesteld voor:

      a. de gronden voor verlening van de vangnetuitkering;

      b. de berekening van de hoogte van de uitkering;

      c. de voorwaarden, die aan het verzoek worden gesteld;

      d. de wijze van beoordeling van het verzoek door de toetsingscommissie vangnet Participatiewet;

      e. de toepassing van het vijfde lid.

      7 Bij ministeriële regeling worden regels gesteld voor de termijn waarbinnen een verzoek kan worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel76
