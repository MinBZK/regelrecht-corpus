  - number: 10da
    text: Personen die behoren tot de doelgroep loonkostensubsidie hebben aanspraak op begeleiding op de werkplek.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel10da
  - number: 10e
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot
      [artikel 6][ref1], ten aanzien van de doelgroep loonkostensubsidie en de loonwaarde en de wijze waarop deze wordt
      vastgesteld.

      2 Bij of krachten algemene maatregel van bestuur kunnen met betrekking tot [artikel 10][ref2] regels worden
      gesteld die zien op:

      a. de persoonlijke ondersteuning bij het verrichten van de aan die persoon opgedragen taken, bedoeld in
      [artikel 10, eerste lid][ref3], waaronder het stellen van kwaliteitseisen aan een persoon als bedoeld in
      artikel 10, derde lid, aanhef en onderdeel a, en op welke wijze die eisen worden geborgd;

      b. de integrale ondersteuning en voortgezette persoonlijke ondersteuning bij de overgang van
      onderwijs naar werk, van werk naar onderwijs en van werk naar werk van een persoon als bedoeld in de
      [artikelen 7, eerste lid, onderdeel a][ref4], [7a, eerste lid][ref5], of [10d, tweede lid][ref6];

      c. voorzieningen als bedoeld in [artikel 10, eerste lid][ref7], die bestaan uit:

      1°. een vervoersvoorziening die ertoe strekt dat de persoon, met uitzondering van de persoon met een visuele
      beperking, zijn werkplek, proefplaats of opleidingslocatie kan bereiken;

      2°. een noodzakelijke intermediaire activiteit in het geval er sprake is van een motorische beperking;

      3°. een meeneembare voorziening voor de inrichting van de werkplek, de productie- en werkmethoden, de inrichting
      van de opleidingslocatie of de proefplaats en de bij het werk of de opleiding te gebruiken hulpmiddelen.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      [artikelen 10b][ref8], [10c][ref9] en [10d][ref10].


