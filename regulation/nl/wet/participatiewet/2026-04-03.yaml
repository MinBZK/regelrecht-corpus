  - number: '61'
    text: |-
      Kosten van bijstand kunnen door het college worden verhaald in de gevallen en naar de regels aangegeven in deze
      paragraaf.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel61
  - number: '62'
    text: |-
      Kosten van bijstand kunnen tot de grens van de onderhoudsplicht, bedoeld in
      [Boek 1 van het Burgerlijk Wetboek][ref1], worden verhaald:

      a. op degene die bij het ontbreken van gezinsverband zijn onderhoudsplicht jegens zijn echtgenoot, of minderjarig
      kind niet of niet behoorlijk nakomt en op het minderjarige kind dat zijn onderhoudsplicht jegens zijn ouders niet
      of niet behoorlijk nakomt;

      b. op degene die zijn onderhoudsplicht na echtscheiding of ontbinding van het huwelijk na scheiding van tafel en
      bed niet of niet behoorlijk nakomt;

      c. op degene die zijn onderhoudsplicht op grond van [artikel 395a van Boek 1 van het Burgerlijk Wetboek][ref2]
      niet of niet behoorlijk nakomt jegens zijn meerderjarig kind van wie de bijstand op grond van
      [artikel 20, derde lid][ref3], is verhoogd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel20
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0002656
        artikel: 395a
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 62a
    text: |-
      Bij de beoordeling van het bestaan van het verhaalsrecht, bedoeld in
      [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2], en de omvang van het te verhalen
      bedrag wordt rekening gehouden met de maatstaven die gelden en de omstandigheden die van belang zijn in het geval
      dat de rechter dient te beslissen over de vraag of en, zo ja, tot welk bedrag een uitkering tot levensonderhoud na
      echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed zou moeten
      worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 159a
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 62b
    text: |-
      1 Indien een rechterlijke uitspraak betreffende levensonderhoud verschuldigd op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref1] die uitvoerbaar is, niet wordt nagekomen, wordt verhaald in
      overeenstemming met deze uitspraak.

      2 De betaling van het verschuldigde geschiedt binnen 30 dagen na bekendmaking van het besluit tot verhaal
      overeenkomstig het eerste lid.

      3 Degene op wie wordt verhaald kan binnen de termijn waarbinnen betaling moet plaatsvinden tegen het besluit tot
      verhaal in verzet komen door het indienen van een verzoek aan de rechtbank. Het verzet kan niet gegrond zijn op de
      bewering dat de uitkering tot onderhoud ten onrechte is opgelegd of onjuist is vastgesteld. Indien tijdig verzet is
      gedaan wordt de invordering pas voortgezet zodra het verzet is ingetrokken of ongegrond verklaard.

      4 Het college is bevoegd, met uitsluiting van degene die de bijstand ontvangt, het verschuldigde bij dwangbevel in
      te vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 62c
    text: |-
      1 Indien degene, die bijstand ontvangt of heeft ontvangen en ten aanzien van wie door de rechter een verhaalsbedrag
      verschuldigd op grond van [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2] is
      vastgesteld, zijn woonplaats verplaatst naar een andere gemeente en aldaar bijstand ontvangt of heeft ontvangen,
      gaat de bevoegdheid tot tenuitvoerlegging van de rechterlijke uitspraak op het college van de andere gemeente over.

      2 Het college van de vertrekgemeente blijft bevoegd tot tenuitvoerlegging voor zover het gaat om
      betalingsachterstanden ter zake van verhaal van bijstand die door dat college is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel62c
    references:
