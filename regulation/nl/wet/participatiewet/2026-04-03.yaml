  - number: '11'
    text: |-
      1 Iedere in Nederland woonachtige Nederlander die hier te lande in zodanige omstandigheden verkeert of dreigt te
      geraken dat hij niet over de middelen beschikt om in de noodzakelijke kosten van bestaan te voorzien, heeft recht
      op bijstand van overheidswege.

      2 Met de Nederlander, bedoeld in het eerste lid, wordt gelijkgesteld de hier te lande
      woonachtige vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], met uitzondering van de gevallen,
      bedoeld in artikel 24, tweede lid, van [Richtlijn 2004/38/EG](32004L0038).

      3 Bij algemene maatregel van bestuur kunnen andere hier te lande woonachtige vreemdelingen dan de in het tweede lid
      bedoelde voor de toepassing van deze wet met een Nederlander gelijk worden gesteld:

      a. ter uitvoering van een verdrag dan wel van een besluit van een volkenrechtelijke organisatie, of

      b. indien zij, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref2], rechtmatig in Nederland verblijf
      hebben als bedoeld in artikel 8, onderdeel g of h, van die wet en zij aan de in die algemene maatregel van bestuur
      gestelde voorwaarden voldoen.

      4 Het recht op bijstand komt de echtgenoten gezamenlijk toe, tenzij een van de echtgenoten geen recht op bijstand
      heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
