  - number: '64'
    text: |-
      1 De hieronder vermelde instanties zijn verplicht desgevraagd aan het college of, indien het college aan het
      Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de
      verlening van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet door het college:

      a. het college van andere gemeenten;

      b. het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;

      c. de Belastingdienst;

      d. het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref1], de Nederlandse
      Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de zorgverzekeraars in de zin van de
      [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de [Wet langdurige zorg][ref4];

      e. de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5] als
      inkomen worden aangemerkt;

      f. de Kamer van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref6] vastgestelde vergoeding;

      g. de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref7];

      h. de Dienst Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref8] en Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      betreffende de toepassing van de [Wet bevordering eigenwoningbezit][ref9];

      i. Onze Minister van Onderwijs, Cultuur en Wetenschap;

      j. Onze Minister van Economische Zaken betreffende de omvang van de productiebeperkende maatregelen voor het
      bedrijf van de ondernemer in de agrarische sector;

      k. Onze Minister van Justitie en Veiligheid voor zover het betreft de toepassing van de
      [Wet inburgering 2021][ref10] en de persoon die rechtens zijn vrijheid is ontnomen of de persoon die zich onttrekt
      aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;

      l. de instanties en personen die woonruimte verhuren;

      m. de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;

      n. derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;

      o. de geneesheer-directeur, bedoeld in de [Wet verplichte geestelijke gezondheidszorg][ref11], en de zorgaanbieder,
      bedoeld in de [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref12];

      p. Onze Minister en de colleges van burgemeester en wethouders voor zover het gegevens betreft die verwerkt worden
      in het landelijk register kinderopvang, bedoeld in de [Wet kinderopvang][ref13].

      2 De geneesheer-directeur respectievelijk de zorgaanbieder, bedoeld in het eerste lid, onderdeel o, verstrekt
      slechts gegevens en inlichtingen indien:

      a. deze noodzakelijk zijn voor de uitvoering van [artikel 13, derde lid][ref14], laatste zin; en

      b. deze betrekking hebben op:

      1°. de opneming;

      2°. het ontslag;

      3°. het verleende verlof; of

      4°. het ingetrokken verlof.

      3 Het vragen door het college en het verstrekken door de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde gegevens en inlichtingen kan geschieden door tussenkomst van het Inlichtingenbureau.

      4 Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college of,
      indien het college aan het Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van
      besluiten inzake de verlening van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, kosteloos alle
      gegevens en uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken die noodzakelijk
      zijn voor de uitvoering van deze wet.

      5 De in het eerste en het vierde lid bedoelde verplichtingen strekken zich mede uit tot degene:

      a. van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref15] of op wie
      deze worden of kunnen worden verhaald ingevolge [paragraaf 5][ref16];

      b. die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:

      1°. te wiens behoeve bijstand is gevraagd of wordt verleend;

      2°. van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref17] of op wie
      deze worden of kunnen worden verhaald ingevolge [paragraaf 5][ref18].

      6 De in het eerste lid en het vierde lid bedoelde gegevens en inlichtingen worden desgevraagd schriftelijk, of in
      een andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken
      na ontvangst van het verzoek hiertoe, verstrekt.

      7 De in het eerste lid, onderdeel a tot en met k, genoemde instanties treffen desgevraagd met het college en met
      het Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      gegevens en inlichtingen.

      8 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het derde lid en de inhoud
      en vormgeving van de in het zevende lid bedoelde regelingen.

      9 Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken gegevens en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het derde lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.

      10 Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het
      vierde lid worden aangewezen voor wie de verplichtingen, bedoeld in het eerste lid tot en met achtste lid,
      eveneens gelden, voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen
      inlichtingen en gegevens.

      11 Bij de algemene maatregel van bestuur, bedoeld in het tiende lid, kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.

      12 Onze Minister van Justitie en Veiligheid verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is
      ontnomen of de persoon die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende
      maatregel, onverwijld en kosteloos de gegevens en alle overige opgaven en inlichtingen, waarover deze
      beschikt en die noodzakelijk zijn voor het recht op bijstand, aan het college, of, indien het college aan het
      Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de verlening
      van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, door tussenkomst van het Inlichtingenbureau,
      waarbij hij gebruik kan maken van het burgerservicenummer.

      13 Onze Minister van Buitenlandse Zaken verstrekt ten aanzien van de Nederlander die in het buitenland rechtens
      zijn vrijheid is ontnomen, onverwijld en kosteloos, gegevens, en inlichtingen waarover hij beschikt en die
      noodzakelijk zijn voor het recht op bijstand, aan het college, of, indien het college aan het Uitvoeringsinstituut
      werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de verlening van bijstand, aan
      het Uitvoeringsinstituut werknemersverzekeringen, door tussenkomst van het Inlichtingenbureau, waarbij hij gebruik
      kan maken van het burgerservicenummer. Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering
      van dit lid.

      14 De Belastingdienst verstrekt aan het college, of indien het college aan het Uitvoeringsinstituut
      werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de verlening van bijstand, aan
      het Uitvoeringsinstituut werknemersverzekeringen, zonder dat daaraan een verzoek ten grondslag ligt gegevens als
      bedoeld in het eerste lid over samenloop van een uitkering met inkomen uit of in verband met arbeid of bedrijf of
      over vermogen, die bij de uitvoering van een belastingwet of bij de invordering van enige rijksbelasting bekend
      zijn geworden voor zover die gegevens noodzakelijk zijn voor de uitvoering van deze wet.


