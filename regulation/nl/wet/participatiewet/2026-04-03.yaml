  - number: 10h
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak personen als bedoeld in de
      [artikelen 7, eerste lid, onderdeel a][ref1], of [7a, eerste lid, onderdeel a][ref2], met een visuele beperking
      te ondersteunen bij de arbeidsinschakeling door middel van het bekostigen van werkvoorzieningen.

      2 Onder werkvoorzieningen als bedoeld in het eerste lid worden uitsluitend verstaan:

      a. vervoersvoorzieningen die ertoe strekken de werkplek, proefplaats of opleidingslocatie te bereiken;

      b. intermediaire activiteiten;

      c. meeneembare voorzieningen voor de inrichting van de arbeidsplaats, de productie- en werkmethoden, de inrichting
      van de opleidingsplaats of de proefplaats die in overwegende mate op het individu van de persoon, bedoeld in het
      eerste lid, zijn afgestemd; en

      d. de bij de arbeid of opleiding te gebruiken hulpmiddelen, die in overwegende mate op het individu van de persoon,
      bedoeld in het eerste lid, zijn afgestemd.

      3 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van personen als bedoeld in het eerste lid of
      het college een werkvoorziening toekennen en voor die personen bekostigen.

      4 Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden over:

      a. de omvang en de inhoud van de aanspraak, bedoeld in het derde lid; en

      b. de voorwaarden waaronder de werkvoorziening wordt verleend.

      5 In afwijking van de [artikelen 17][ref3], [18][ref4], [18a][ref5] en [paragraaf 6.4][ref6] zijn ten aanzien
      van de uitvoering van dit artikel door het Uitvoeringsinstituut werknemersverzekeringen en de bijbehorende
      verplichtingen van de persoon, bedoeld in het derde lid, de [artikelen 2:7][ref7], [2:9][ref8], [2:31][ref9],
      [2:58][ref10], [2:59][ref11], [2:60][ref12], [2:61][ref13], [2:63][ref14], [2:64][ref15], [2:65][ref16],
      [2:69][ref17] en [6:3 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref18] van overeenkomstige
      toepassing.

      6 Het Uitvoeringsinstituut werknemersverzekeringen kan de toekenning, bedoeld in het derde lid, weigeren, indien:

      a. het na een eerdere herziening, intrekking of weigering van een toekenning op grond van het vijfde lid heeft
      vastgesteld dat:

      1°. de persoon, bedoeld in het derde lid, onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste of volledige gegevens tot een andere beslissing zou hebben geleid;

      2°. de persoon niet voldoet aan de aan de werkvoorziening verbonden voorwaarden; of

      3°. de persoon de werkvoorziening niet of voor een ander doel gebruikt;

      b. de persoon, bedoeld in het derde lid, aanspraak kan maken op voorzieningen die
      zijn getroffen op grond van de [Wet maatschappelijke ondersteuning 2015][ref19], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref20], de [Wet sociale werkvoorziening][ref21],
      de [Wet werk en inkomen naar arbeidsvermogen][ref22], de [Wet overige OCW-subsidies][ref23] of de
      [Zorgverzekeringswet][ref24], en de aanvraag ondersteuning op grond van die wetten betreft.

      7 Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding van de werkvoorziening.


