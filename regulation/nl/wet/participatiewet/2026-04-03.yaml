      Het college kan voor de belanghebbende die recent de deelname heeft beëindigd aan onderwijs of een
      beroepsopleiding, de norm gedurende zes maanden na het tijdstip van die beëindiging lager vaststellen,
      indien voor het onderwijs of de beroepsopleiding aanspraak bestond op studiefinanciering op grond van de
      [Wet studiefinanciering 2000][ref1] of op een tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond
      van [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2].


