  - number: 34a
    text: |-
      1 Inkomsten uit arbeid worden niet met de algemene bijstand verrekend ten aanzien van degene die:

      a. de pensioengerechtigde leeftijd nog niet heeft bereikt: gedurende een aaneengesloten periode van maximaal twaalf
      maanden voor 15 procent van deze inkomsten per maand, indien dit naar het oordeel van het college bijdraagt aan de
      arbeidsinschakeling van deze persoon;

      b. medisch urenbeperkt is: voor 15 procent van deze inkomsten per maand;

      c. de pensioengerechtigde leeftijd heeft bereikt: voor 25 procent en tot € 226,00 van deze inkomsten per maand.

      2 Nadat de periode, bedoeld in het eerste lid, onderdeel a, is verstreken kan het college de periode waarin de
      inkomsten uit arbeid niet worden verrekend verlengen met een door het college te bepalen periode, indien het
      college een uitbreiding van de arbeidsomvang gelet op de individuele omstandigheden niet mogelijk acht.

      3 Indien de periode, bedoeld in het eerste lid, onderdeel a, of het tweede lid, is verstreken zonder dat deze
      is verlengd, kan het college nogmaals toepassing geven aan het eerste lid indien de persoon nadien een nieuw
      dienstverband is aangegaan.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel34a
  - number: 34b
    text: |-
      1 Het college kan op basis van individuele omstandigheden voor degene die inkomen uit arbeid en algemene bijstand
      ontvangt, ambtshalve een bufferbudget tot maximaal € 1.000 per kalenderjaar inzetten, indien:

      a. de belanghebbende als gevolg van inkomstenverrekening instabiliteit in inkomen heeft of zal hebben, waardoor die
      persoon of het gezin gedurende een of meer maanden op maandbasis minder dan de bijstandsnorm tot zijn beschikking
      heeft of daar redelijkerwijs over kan beschikken; en

      b. het bufferbudget naar het oordeel van het college bijdraagt aan het werken in deeltijd of aan volledige
      arbeidsinschakeling van deze persoon.

      2 Het college wendt het bufferbudget aan om betalingen aan de belanghebbende te doen, of om onverschuldigd betaalde
      algemene bijstand te vereffenen vanwege het in aanmerking nemen van inkomsten uit arbeid, voor zover dit naar het
      oordeel van het college bijdraagt aan de stabiliteit van de inkomensvoorziening in een of meer maanden.

      3 Bij aanwending van het bufferbudget zijn de [artikelen 11, vierde lid][ref1], en [45, vierde lid][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel45
