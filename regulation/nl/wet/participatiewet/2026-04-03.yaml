        paragraaf: '1.2'
  - number: 10b
    text: |-
      1 Het college biedt ter uitvoering van de [artikelen 7, eerste lid, onderdeel a][ref1], en
      [7a, eerste lid, onderdeel a][ref2], een persoon als bedoeld in die artikelen of een persoon die een uitkering
      ontvangt op grond van de [Werkloosheidswet][ref3], de [Wet inkomensvoorziening oudere werklozen][ref4],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6], de [Wet werk en inkomen naar arbeidsvermogen][ref7],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref8], de [Ziektewet][ref9], of de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref10], of recht heeft op arbeidsondersteuning als bedoeld in
      [artikel 2:15 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref11], van wie het college heeft
      vastgesteld dat deze uitsluitend in een beschutte omgeving onder aangepaste omstandigheden mogelijkheden tot
      arbeidsparticipatie heeft, ambtshalve of op verzoek een voorziening beschut werk aan, waarbij deze persoon in een
      dienstbetrekking in een beschutte omgeving onder aangepaste omstandigheden werkzaamheden verricht.

      2 Om vast te stellen of een persoon uitsluitend in een beschutte omgeving onder aangepaste omstandigheden
      mogelijkheden tot arbeidsparticipatie heeft, verricht het Uitvoeringsinstituut werknemersverzekeringen, op grond
      van bij of krachtens algemene maatregel van bestuur te stellen regels, voor het college de werkzaamheden ten
      behoeve van die vaststelling en adviseert het college hierover.

      3 Onverminderd het tweede lid, verricht het Uitvoeringsinstituut werknemersverzekeringen op verzoek van een persoon
      als bedoeld in het eerste lid de werkzaamheden ten behoeve van de vaststelling, bedoeld in het eerste en tweede
      lid, en adviseert het college hierover. Het Uitvoeringsinstituut werknemersverzekeringen meldt het uitbrengen en
      een weergave van de inhoud van dit advies gelijktijdig aan de betreffende persoon.

      4 Bij ministeriële regeling kan jaarlijks per gemeente het aantal ten minste te realiseren dienstbetrekkingen,
      bedoeld in het eerste lid, worden bepaald.

      5 De gemeenteraad kan bij verordening een hoger aantal door het college te realiseren dienstbetrekkingen
      vaststellen en daarbij, onverminderd [artikel 8a, tweede lid, onderdeel a][ref12], regelen hoe deze additionele
      omvang van de voorziening wordt bepaald en hoe dan de volgorde wordt bepaald waarin de personen, bedoeld in het
      eerste lid, door het college van een dienstbetrekking worden voorzien.

      6 Het eerste lid is niet van toepassing indien het aantal dienstbetrekkingen, bedoeld in het vierde of het vijfde
      lid, door het college is gerealiseerd.

      7 In de verordening, bedoeld in [artikel 8a, eerste lid, onderdeel e][ref13], stelt de gemeenteraad in elk
      geval vast welke voorzieningen gericht op arbeidsinschakeling worden aangeboden om de in het eerste lid bedoelde
      werkzaamheden mogelijk te maken en welke voorzieningen worden aangeboden tot het moment dat de dienstbetrekking,
      bedoeld in het eerste lid, aanvangt.

      8 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      9 Het college verstrekt zo nodig ter uitvoering van het eerste lid, en
      [artikel 30a, derde lid, onderdeel a van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref14],
      loonkostensubsidie in overeenstemming met [artikel 10d][ref15] aan de personen, genoemd in het eerste lid.


