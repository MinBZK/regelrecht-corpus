  - number: '50'
    text: |-
      1 De belanghebbende die eigenaar is van een door hemzelf of zijn gezin bewoonde woning met bijbehorend erf, heeft
      recht op bijstand voor zover tegeldemaking, bezwaring of verdere bezwaring, van het in de woning met bijbehorend
      erf gebonden vermogen in redelijkheid niet kan worden verlangd.

      2 Indien voor de belanghebbende, bedoeld in het eerste lid, recht op algemene bijstand bestaat, heeft die bijstand
      de vorm van een geldlening:

      a. indien de bijstand over een periode van een jaar, te rekenen vanaf de eerste dag waarover bijstand wordt
      verleend, naar verwachting meer bedraagt dan het netto minimumloon, bedoeld in [artikel 37, eerste lid][ref1]; en

      b. voorzover het vermogen gebonden in de woning met bijbehorend erf hoger is dan het vermogen, bedoeld in
      [artikel 34, tweede lid, onderdeel d][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel34
