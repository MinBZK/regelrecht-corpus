  - number: 60a
    text: |-
      1 Indien degene van wie de kosten van bijstand worden teruggevorderd dan wel die verplicht
      is tot betaling van een bestuurlijke boete algemene bijstand of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werklozen werknemers][ref1] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] ontvangt van het
      college van een andere gemeente dan het college dat de kosten van bijstand terugvordert of de bestuurlijke boete
      heeft opgelegd, betaalt het college van die andere gemeente, zonder dat daarvoor een machtiging nodig is van de
      belanghebbende, het bedrag van de terugvordering of de bestuurlijke boete uit de algemene bijstand of de uitkering
      op verzoek aan het college dat de kosten van bijstand terugvordert of de bestuurlijke boete heeft opgelegd.

      2 Indien degene van wie de kosten van bijstand worden teruggevorderd dan wel die verplicht
      is tot betaling van een bestuurlijke boete een uitkering ontvangt op grond van de
      [Werkloosheidswet][ref3], de [Wet inkomensvoorziening oudere werklozen][ref4], de [Ziektewet][ref5], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref6], de [Wet werk en inkomen naar arbeidsvermogen][ref7],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref8], de [Wet arbeidsongeschiktheidsvoorziening militairen][ref9],
      de [Wet arbeid en zorg][ref10] of de [Toeslagenwet][ref11] of een uitkering of inkomensondersteuning ontvangt op
      grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref12] betaalt het Uitvoeringsinstituut
      werknemersverzekeringen, zonder dat daarvoor een machtiging nodig is van belanghebbende, het bedrag van de
      terugvordering of de bestuurlijke boete uit de uitkering of de inkomensondersteuning op verzoek aan het college dat
      de kosten van bijstand terugvordert of de bestuurlijke boete heeft opgelegd.

      3 Indien degene van wie de kosten van bijstand worden teruggevorderd dan wel die verplicht is tot betaling
      van een bestuurlijke boete een uitkering ontvangt op grond van de [Algemene Ouderdomswet][ref13] of de
      [Algemene nabestaandenwet][ref14] betaalt de Sociale verzekeringsbank, zonder dat daarvoor een machtiging nodig is
      van belanghebbende, het bedrag van de terugvordering of de bestuurlijke boete uit de uitkering op verzoek aan het
      college dat de kosten van bijstand terugvordert of de bestuurlijke boete heeft opgelegd.

      4 Onverminderd [artikel 60, derde lid][ref15], en het eerste, tweede en derde lid kan het college een vordering die
      een belanghebbende op hem heeft, verrekenen met een vordering als bedoeld in [artikel 58][ref16] en [59][ref17].

      5 Indien de kosten van bijstand worden teruggevorderd door de Sociale verzekeringsbank is het eerste tot en met het
      vierde lid van overeenkomstige toepassing.


