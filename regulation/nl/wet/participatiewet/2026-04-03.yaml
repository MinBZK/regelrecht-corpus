  - number: '43'
    text: |-
      1 Het college stelt het recht op bijstand op schriftelijke aanvraag of, indien een schriftelijke aanvraag niet
      mogelijk is, ambtshalve vast.

      2 De bijstand wordt door de echtgenoten gezamenlijk aangevraagd dan wel door een van hen met schriftelijke
      toestemming van de ander.

      3 Het college stelt het recht op bijstand ambtshalve vast indien een van de echtgenoten niet met de aanvraag
      instemt, doch bijstandsverlening, gezien de belangen van de overige gezinsleden, niettemin geboden is.

      4 Het college houdt, indien [artikel 41, vierde lid][ref1], van toepassing is, bij de vaststelling van het
      recht op algemene bijstand rekening met de houding en gedragingen van de meerderjarige personen die ten tijde
      van de aanvraag van algemene bijstand jonger dan 27 jaar zijn gedurende de vier weken na de melding, bedoeld in
      [artikel 44][ref2].

      5 Indien [artikel 41, vierde lid][ref3], niet van toepassing is, beoordeelt het college in ieder geval de houding
      en gedragingen gedurende de vier weken na de melding, bedoeld in [artikel 44][ref4], van de meerderjarige personen
      die ten tijde van de aanvraag van algemene bijstand jonger dan 27 jaar zijn.

      6 Indien een belanghebbende zich onverwijld na afwijzing van een
      aanvraag voor een uitkering op grond van [artikel 78f][ref5], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref7] meldt voor een
      aanvraag voor algemene bijstand, geldt de datum van melding voor de aanvraag voor die uitkering tevens als melding
      bedoeld in [artikel 44][ref8].


