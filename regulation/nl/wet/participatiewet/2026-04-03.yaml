  - number: 10c
    text: |-
      1 Het college kan:

      a. op schriftelijke aanvraag van een persoon als bedoeld in de [artikelen 7, eerste lid, onderdeel a][ref1], of
      [7a, eerste lid, onderdeel a, of derde lid][ref2], vaststellen of die persoon tot de doelgroep loonkostensubsidie
      behoort;

      b. ambtshalve vaststellen of een persoon als bedoeld in de
      [artikelen 7, eerste lid, onderdeel a, onder 1, 2, 3, 5 of 6][ref3],
      [7a, eerste lid, onderdeel a, of derde lid][ref4], of [10d, tweede lid][ref5], tot de doelgroep loonkostensubsidie
      behoort.

      2 Een aanvraag als bedoeld in het eerste lid, onderdeel a, kan slechts eenmaal per twaalf maanden worden ingediend.


