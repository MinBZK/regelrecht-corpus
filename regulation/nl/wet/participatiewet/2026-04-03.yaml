        paragraaf: '6.5'
  - number: 62h
    text: |-
      1 Verzoeken met betrekking tot verhaal in rechte op grond van deze paragraaf, alsmede verzoeken tot wijziging van
      een rechterlijke verhaalsuitspraak, worden ingediend bij de rechtbank.

      2 Op de indiening en behandeling van het verzoek, alsmede op de procedure in hoger beroep, zijn de
      [artikelen 799, tweede lid][ref1], en [801 van het Wetboek van Burgerlijke Rechtsvordering][ref2] van
      overeenkomstige toepassing.

      3 Het college kan op grond van deze paragraaf in rechte optreden zonder advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel799
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel801
