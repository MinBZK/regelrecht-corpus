  - number: '47'
    text: |-
      De gemeenteraad stelt bij verordening regels over de wijze waarop personen als bedoeld in de
      [artikelen 7, eerste lid][ref1], of [7a, eerste lid][ref2], of hun vertegenwoordigers worden betrokken bij de
      uitvoering van deze wet en de daarop berustende bepalingen, waarbij in ieder geval wordt geregeld de wijze waarop
      deze personen of hun vertegenwoordigers:

      a. vroegtijdig in staat worden gesteld gevraagd en ongevraagd advies uit te brengen bij de besluitvorming over
      verordeningen en beleidsvoorstellen;

      b. worden voorzien van ondersteuning om hun rol effectief te kunnen vervullen;

      c. deel kunnen nemen aan periodiek overleg;

      d. onderwerpen voor de agenda van dit overleg kunnen aanmelden;

      e. worden voorzien van de voor een adequate deelname aan het overleg benodigde informatie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
