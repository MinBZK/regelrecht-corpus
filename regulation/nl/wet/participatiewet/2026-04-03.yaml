  - number: 10g
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen heeft tot taak personen als bedoeld in de
      [artikelen 7, eerste lid, onderdeel a][ref1], of [7a, eerste lid, onderdeel a][ref2], met een auditieve
      beperking te ondersteunen bij de arbeidsinschakeling door middel van het bekostigen van tolkvoorzieningen.

      2 Het Uitvoeringsinstituut werknemersverzekeringen kan op aanvraag van personen als bedoeld in het eerste lid of
      het college een tolkvoorziening toekennen en voor die personen bekostigen.

      3 Bij algemene maatregel van bestuur kunnen nadere regels gesteld worden over:

      a. de omvang en de inhoud van de aanspraak, bedoeld in het tweede lid;

      b. de voorwaarden waaronder de tolkvoorzieningen worden verleend;

      c. de kwaliteitseisen van tolken.

      4 In afwijking van de [artikelen 17][ref3], [18][ref4], [18a][ref5] en [paragraaf 6.4][ref6] zijn ten aanzien
      van de uitvoering van dit artikel door het Uitvoeringsinstituut werknemersverzekeringen en de bijbehorende
      verplichtingen van de persoon, bedoeld in het tweede lid, de [artikelen 2:7][ref7], [2:9][ref8], [2:31][ref9],
      [2:58][ref10], [2:59][ref11], [2:60][ref12], [2:61][ref13], [2:63][ref14], [2:64][ref15], [2:65][ref16],
      [2:69][ref17] en [6:3 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref18] van overeenkomstige
      toepassing.

      5 Het Uitvoeringsinstituut werknemersverzekeringen kan de toekenning, bedoeld in het tweede lid weigeren, indien:

      a. het na een eerdere herziening, intrekking of weigering van een toekenning op grond van het vierde lid heeft
      vastgesteld dat:

      1°. de persoon, bedoeld in het tweede lid, onjuiste of onvolledige gegevens heeft verstrekt en de verstrekking van
      juiste of volledige gegevens tot een andere beslissing zou hebben geleid,

      2°. de persoon niet voldoet aan de aan de tolkvoorziening verbonden voorwaarden, of

      3°. de persoon de tolkvoorzieningen niet of voor een ander doel gebruikt;

      b. de persoon, bedoeld in het tweede lid, aanspraak kan maken op tolkvoorzieningen
      die zijn getroffen op grond van de [Wet maatschappelijke ondersteuning 2015][ref19],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref20], de
      [Wet werk en inkomen naar arbeidsvermogen][ref21] of de [Wet overige OCW-subsidies][ref22], of in verband met
      werkzaamheden als werknemer in de zin van de [Wet sociale werkvoorziening][ref23] en de aanvraag ondersteuning op
      grond van die wetten betreft.

      6 Bij ministeriële regeling kunnen regels worden gesteld over de vergoeding van de tolk.


