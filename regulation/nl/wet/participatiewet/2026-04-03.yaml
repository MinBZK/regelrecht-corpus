  - number: '82'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen, indien de spoed dat vereist, regels worden gesteld die noodzakelijk
      zijn in verband met de goede uitvoering van de wet.

      2 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      3 Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van beide kamers der Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel82
  - number: '83'
    text: |-
      1 Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van mogelijkheden
      om deze wet met betrekking tot de arbeidsinschakeling en de financiering doeltreffender uit te voeren, worden
      afgeweken van het bepaalde bij of krachtens de [artikelen 6 tot en met 10][ref1], [31, tweede lid][ref2], en
      [paragraaf 7.1][ref3]. Bij toepassing van de eerste volzin wordt bij algemene maatregel van bestuur geregeld op
      welke wijze en gedurende welke periode van welke artikelen van de wet wordt afgeweken.

      2 Een experiment als bedoeld in het eerste lid duurt ten hoogste vijf jaar. Indien, voor een experiment is
      afgelopen, een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een
      structurele wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in
      werking treedt. De tweede volzin van het eerste lid is van overeenkomstige toepassing.

      3 Onze Minister kan op hun verzoek gemeenten aanwijzen die deelnemen aan een experiment. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van deze bevoegdheid.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen wordengetroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.

      5 Onze Minister zendt uiterlijk drie maanden voor het einde van een experiment aan de Staten-Generaal een
      verslag over de doeltreffendheid en de effecten van het experiment in de praktijk alsmede een standpunt inzake
      de voortzetting ervan anders dan als experiment. Indien een experiment eerder wordt beëindigd dan oorspronkelijk
      beoogd, zendt Onze Minister, in afwijking van de eerste volzin, uiterlijk twee maanden na de beëindiging van dat
      experiment een verslag als bedoeld in de eerste volzin aan de Staten-Generaal.

      6 De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


