  - number: 62e
    text: |-
      1 Het door de rechter vastgestelde verhaalsbedrag kan op verzoek van het college of van degene op wie verhaal wordt
      uitgeoefend door de rechter worden gewijzigd op grond van gewijzigde omstandigheden.

      2 Het college kan aan de rechter verzoeken het verhaalsbedrag in afwijking van een rechterlijke uitspraak
      betreffende levensonderhoud verschuldigd krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] vast te stellen,
      indien de rechter:

      a. deze uitspraak zou kunnen wijzigen op de gronden genoemd in [artikel 401 van dat boek][ref2];

      b. geen rekening heeft kunnen houden met alle voor de betrokken beslissing in aanmerking komende gegevens en
      omstandigheden betreffende beide partijen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel401
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel62e
