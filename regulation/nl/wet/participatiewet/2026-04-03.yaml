      persoon een uitkering op grond van die paragraaf ontvangt, betaalt de Sociale verzekeringsbank, zonder dat daarvoor
      machtiging nodig is van de belanghebbende, op verzoek van het college ter verrekening van die vordering aan dat
      college.


