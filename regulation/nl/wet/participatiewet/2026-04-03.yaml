  - number: '60'
    text: |-
      1 De persoon van wie kosten van bijstand worden teruggevorderd is verplicht desgevraagd aan het college de
      inlichtingen te verstrekken die voor terugvordering op grond van deze paragraaf van belang zijn.

      2 Het college kan de kosten van de bijstand, bedoeld in de [artikelen 58][ref1] en [59][ref2] invorderen bij
      dwangbevel.

      3 Indien de persoon van wie kosten van bijstand als bedoeld in de [artikelen 58][ref3], met uitzondering
      van het eerste lid, en [59][ref4] worden teruggevorderd algemene bijstand of een uitkering op grond van
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref5] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref6] ontvangt, is het
      college bevoegd tot verrekening van die kosten met die algemene bijstand of uitkering.

      4 Indien de persoon van wie kosten van bijstand als bedoeld in de [artikelen 58, eerste lid][ref7],
      worden teruggevorderd dan wel verplicht is tot betaling van een bestuurlijke boete of een eerdere
      bestuurlijke boete wegens eenzelfde gedraging als bedoeld in de [artikelen 18a, vijfde lid][ref8],
      of [47g, vijfde lid][ref9], algemene bijstand of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref10] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref11] ontvangt,
      verrekent het college die kosten en bestuurlijke boete met die algemene bijstand of uitkering.

      5 De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref12] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het college. Indien het college
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref13], door middel van toezending per post aan
      degene van wie kosten van bijstand worden teruggevorderd.

      6 Zolang de belanghebbende de verplichtingen, bedoeld in het eerste lid en de [artikelen 18a, achtste lid][ref14],
      en [47g, achtste lid][ref15], niet of niet behoorlijk nakomt:

      a. is het college, in afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref16], bevoegd
      tot verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;

      b. geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref17], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref18], niet bij invordering van kosten van bijstand en de
      bestuurlijke boete bij dwangbevel.

      7 Terugvordering van kosten van bijstand als bedoeld in de [artikelen 58][ref19] en [59][ref20] is bevoorrecht en
      volgt onmiddellijk na de vorderingen in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref21] omschreven.


