  - number: 78h
    text: |-
      1 De Sociale verzekeringsbank kan de verlening van bijstand aan een Nederlander die zich in het buitenland bevindt
      voortzetten ten aanzien van:

      a. degene die in december 1995 bijstand ontving op grond van [artikel 82][ref1] of
      [artikel 95 van de Algemene Bijstandswet][ref2], welke bijstand niet is geëindigd;

      b. degene die op enig moment in de periode van 26 weken onmiddellijk voorafgaand aan 31 december 1995 bijstand
      ontving op grond van [artikel 82 van de Algemene Bijstandswet][ref3], welke bijstand in die periode is geëindigd,
      indien belanghebbende binnen 26 weken na die datum opnieuw bijstand aanvraagt.

      2 De in het eerste lid bedoelde bijstand wordt afgestemd op de omstandigheden, mogelijkheden en middelen van de
      belanghebbende, rekening houdend met het niveau van de noodzakelijke kosten van het bestaan ter plaatse.

      3 De artikelen van deze wet zijn niet van toepassing, voor zover de omstandigheden het toelaten, met uitzondering
      van [hoofdstuk 2][ref4] en de [paragrafen 6.1 tot en met 6.5][ref5], met dien verstande dat de Sociale
      verzekeringsbank in de plaats treedt van het college.

      4 Zodra ten minste 26 weken zijn verstreken nadat de bijstand die werd verleend op grond van het eerste lid werd
      beëindigd, is dat lid ten aanzien van het desbetreffende geval niet langer van toepassing.

      5 In de middelen tot dekking van de uitgaven verbonden aan de uitvoering van dit artikel wordt voorzien door een
      rijksbijdrage aan de Sociale verzekeringsbank.

      6 Op de uitgaven, bedoeld in het vijfde lid, komen in mindering de bedragen die door de Sociale verzekeringsbank op
      grond van deze wet zijn ontvangen door terugvordering.

      7 Een nog niet afgehandeld en tot Onze Minister gericht verzoek om op grond van
      [artikel 6 van de Invoeringswet Wet werk en bijstand][ref6] een besluit te nemen, wordt vanaf 1 januari 2009
      beschouwd als te zijn gericht tot de Sociale verzekeringsbank.

      8 Bezwaren en beroepen die zijn of worden ingesteld tegen een besluit genomen op grond van
      [artikel 6 van de Invoeringswet Wet werk en bijstand][ref7] gelden vanaf 1 januari 2009 als bezwaren en beroepen
      gericht tot de Sociale verzekeringsbank.


