  - number: 78l
    text: |-
      1 Het college dat vóór de inwerkingtreding van [paragraaf 5.4][ref1] ten aanzien van een persoon als bedoeld
      in [artikel 47a, eerste lid][ref2], een besluit in verband met de verlening van algemene bijstand heeft genomen
      waartegen een bezwaarschrift is ingediend dan wel nog kan worden ingediend, blijft bevoegd op het bezwaar te
      beslissen.

      2 In een geding in beroep en hoger beroep, gericht tegen een besluit ten aanzien van een persoon als bedoeld in
      [artikel 47a, eerste lid][ref3], genomen vóór de inwerkingtreding van [paragraaf 5.4][ref4] of gericht tegen een
      besluit als bedoeld in het eerste lid, blijft het college partij en voor het college staat hoger beroep in verband
      met deze besluiten open.

      3 Onverminderd het eerste en tweede lid kan de Sociale verzekeringsbank in een bestuursrechtelijk geding tussen
      het college en een persoon, bedoeld in [artikel 47a, eerste lid][ref5], in de plaats van het college treden, zonder
      dat daarvoor een betekening nodig is en met overneming van procureurstelling onderscheidenlijk aanwijzing van
      een gemachtigde, indien de Sociale verzekeringsbank vóór de inwerkingtreding van [paragraaf 5.4][ref6] mandaat
      is verleend door het college ten aanzien van besluiten over de verlening van algemene bijstand aan personen als
      bedoeld in artikel 47a, eerste lid.


