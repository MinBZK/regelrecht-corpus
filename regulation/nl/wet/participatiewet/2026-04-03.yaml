        bwb_id: BWBR0008974
  - number: '15'
    text: |-
      1 Geen recht op bijstand bestaat voor zover een beroep kan worden gedaan op een voorliggende voorziening die,
      gezien haar aard en doel, wordt geacht voor de belanghebbende toereikend en passend te zijn. Het recht op bijstand
      strekt zich evenmin uit tot kosten die in de voorliggende voorziening als niet noodzakelijk worden aangemerkt.

      2 Onder een beroep kunnen doen op een voorliggende voorziening wordt niet verstaan het op verzoek van het college:

      a. indienen door de belanghebbende van een aanvraag tot vervroeging van de ingangsdatum
      van een ouderdomspensioen als bedoeld in [artikel 1 van de Pensioenwet][ref1] of
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref2], zolang belanghebbende nog niet de
      pensioengerechtigde leeftijd heeft bereikt;

      b. benutten van de mogelijkheid om te beschikken over de waarde van een lijfrente zolang de belanghebbende de
      pensioengerechtigde leeftijd nog niet heeft bereikt, en:

      1°. tijdens de toetsingsperiode de ingangsdatum van de lijfrente niet is uitgesteld;

      2°. voor zover de totale waarde van deze lijfrente of lijfrenten niet meer bedraagt dan € 337.989,00, waarbij voor
      de vaststelling van de waarde wordt uitgegaan van de waarde zonder aftrek van de eventueel door de belanghebbende
      daarover verschuldigde bedragen als bedoeld in [artikel 31, derde lid][ref3]; en

      3°. voor zover de inleg in het kader van de lijfrente of lijfrenten:

      (i) voorafgaand aan de toetsingsperiode heeft plaatsgevonden; of

      (ii) tijdens de toetsingsperiode heeft plaatsgevonden, daarbij jaarlijks ten minste enige inleg heeft
      plaatsgevonden en de inleg ten hoogste € 8.112,00 per jaar heeft bedragen.

      3 In dit artikel wordt verstaan onder toetsingsperiode: periode van vijf jaar voorafgaand aan de aanvraag om
      bijstand.

      4 Bij ministeriële regeling worden nadere regels gesteld met betrekking tot de toetsing aan en de toepassing van de
      voorwaarden in het tweede lid, onderdeel b, in relatie tot het derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel31
