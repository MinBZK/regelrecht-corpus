  - number: '32'
    text: |-
      1 Onder inkomen wordt verstaan de op grond van [artikel 31][ref1] in aanmerking genomen middelen voorzover deze:

      a. betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, een premie als bedoeld in
      [artikel 31, tweede lid, onderdeel j][ref2], een kostenvergoeding als bedoeld in artikel 31, tweede lid, onderdeel
      k, inkomsten uit verhuur, onderverhuur of het hebben van een of meer kostgangers, socialezekerheidsuitkeringen,
      uitkeringen tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref3], voorlopige teruggave of
      teruggave van inkomstenbelasting, loonbelasting, premies volksverzekeringen en inkomensafhankelijke bijdragen als
      bedoeld in [artikel 43 van de Zorgverzekeringswet][ref4], dan wel naar hun aard met deze inkomsten en uitkeringen
      overeenkomen; en

      b. betrekking hebben op een periode waarover beroep op bijstand wordt gedaan.

      2 Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar de periode waarin deze
      zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in aanmerking
      genomen naar de periode waarin deze te gelde kunnen worden gemaakt.

      3 Indien een van de gehuwden geen recht op algemene bijstand heeft, wordt zijn inkomen slechts in aanmerking
      genomen voor zover het inkomen van de gehuwden tezamen, met inbegrip van de bijstand die zou worden verleend
      indien zijn inkomen niet in aanmerking wordt genomen, meer zou bedragen dan de bijstandsnorm voor gehuwden. Voor de
      vaststelling van het inkomen van de niet-rechthebbende echtgenoot is deze paragraaf van overeenkomstige toepassing.

      4 In afwijking van het derde lid wordt, indien de gehuwden gescheiden leven, doch niet duurzaam gescheiden, het
      inkomen van de niet-rechthebbende echtgenoot slechts in aanmerking genomen voor zover het de bijstandsnorm te boven
      gaat.


