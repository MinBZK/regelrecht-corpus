      1 Door het college op grond van [artikel 10d][ref1] genomen besluiten, zoals dit artikel
      luidde voor de inwerkingtreding van deze wet, blijven tot een jaar na inwerkingtreding van
      [artikel III, onderdeel E, van de Wet invoering minimumuurloon][ref2] gelden als door hem genomen besluiten op
      grond van deze wet.

      2 Het college brengt de in het eerste lid bedoelde besluiten binnen twaalf maanden na inwerkingtreding van
      [artikel III, onderdeel E, van de Wet invoering minimumuurloon][ref3] in overeenstemming met deze wet, voor zover
      die besluiten afwijken van deze wet.

      3 Op een aanvraag op grond van [artikel 10d][ref4] waarop niet is beslist voor de datum van inwerkingtreding van
      [artikel III, onderdeel E, van de Wet invoering minimumuurloon][ref5] wordt beslist met toepassing van artikel 10d,
      zoals deze luidt na inwerkingtreding van artikel III, onderdeel E, van de Wet invoering minimumuurloon.

      4 Op een bezwaar- of beroepschrift dat vóór of op de datum van inwerkingtreding van
      [artikel III, onderdeel E, van de Wet invoering minimumuurloon][ref6] is ingediend tegen een door het college
      op grond van de [artikel 10d][ref7] van de Participatiewet genomen besluit en waarop op die datum nog niet
      onherroepelijk is beslist, wordt beslist met toepassing van artikel 10d, zoals dit artikel luidde voor
      inwerkingtreding van deze wet.


