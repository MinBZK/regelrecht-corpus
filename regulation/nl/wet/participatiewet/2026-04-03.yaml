      1 Bij een verblijf in een inrichting is de norm per kalendermaand, indien het betreft:

      a. een alleenstaande of een alleenstaande ouder: € 443,76;

      b. gehuwden: € 690,27.

      2 Het bedrag van de norm, bedoeld in het eerste lid, wordt verhoogd met:

      a. voor een alleenstaande of een alleenstaande ouder € 47,00;

      b. voor gehuwden € 106,00.

      3 Indien een van de gehuwden in een inrichting verblijft, is de norm de som van de normen die voor ieder van hen
      als alleenstaande of alleenstaande ouder zouden gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel23
  - number: '24'
    text: |-
      Voor gehuwden waarvan een echtgenoot geen recht op algemene bijstand heeft is voor de rechthebbende echtgenoot de
      norm gelijk aan 50% van de norm die voor hem zou gelden als hij gehuwd zou zijn met een rechthebbende echtgenoot
      van zijn leeftijd, indien:

      a. de rechthebbende echtgenoot 21 jaar of ouder is en geen kostendelende medebewoners heeft; dan wel

      b. de rechthebbende echtgenoot jonger dan 21 jaar is.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel24
  - number: 24a
    text: |-
      De norm wordt opgehoogd met 1/12 van het bedrag genoemd in
      [artikel 2, zesde lid, van de Wet op het kindgebonden budget][ref1] voor de belanghebbende, die

      a. een rechtmatig in Nederland verblijvend, ten laste komend kind heeft;

      b. een partner heeft, als bedoeld in [artikel 3 van de Algemene wet inkomensafhankelijke regelingen][ref2];

      c. op basis van deze wet wordt aangemerkt als gehuwd, maar van wie de partner geen recht heeft op algemene
      bijstand.


