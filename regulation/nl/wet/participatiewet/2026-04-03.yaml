  - number: 78z
    text: |-
      1 Door het college op grond van de Wet werk en bijstand genomen besluiten gelden als door hem genomen besluiten op
      grond van deze wet.

      2 Het college brengt de in het eerste lid bedoelde besluiten binnen zes maanden na de inwerkingtreding van
      [artikel I van de Invoeringswet Participatiewet][ref1] in overeenstemming met deze wet, voor zover die besluiten
      afwijken van deze wet.

      3 Op een aanvraag op grond van de Wet werk en bijstand waarop niet is beslist voor de datum van inwerkingtreding
      van [artikel I van de Invoeringswet Participatiewet][ref2] wordt beslist met toepassing van deze wet.

      4 Op een bezwaar- of beroepschrift dat vóór of op de datum van inwerkingtreding van
      [artikel I van de Invoeringswet Participatiewet][ref3] is ingediend tegen een door het college op grond van de
      Wet werk en bijstand genomen besluit en waarop op die datum nog niet onherroepelijk is beslist, wordt beslist met
      toepassing van de Wet werk en bijstand.

      5 De regels, die bij verordening zijn vastgesteld op grond van [artikel 8, eerste lid, onderdelen b en d][ref4],
      [8a][ref5] en [47][ref6] van de Wet werk en bijstand gelden na de datum van inwerkingtreding van
      [artikel I van de Invoeringswet Participatiewet][ref7] als regels op grond van artikel 8, eerste lid, onderdelen a
      en b, [8b][ref8] respectievelijk 47 van de Participatiewet.

      6 De regels, die bij verordening zijn vastgesteld op grond van de
      [artikelen 8, eerste lid, onderdelen a, c, e en f][ref9] van deze wet,
