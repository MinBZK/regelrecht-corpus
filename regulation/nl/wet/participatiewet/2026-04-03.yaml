      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *premies volksverzekeringen:* premies volksverzekeringen als bedoeld in de
      [Wet financiering sociale verzekeringen][ref1];
        - *kinderbijslag:* kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref2];
        - *wettelijk minimumloon:* het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref3] of, indien het
      een werknemer jonger dan 21 jaar betreft, het voor zijn leeftijd geldende minimumloon per maand, bedoeld in
      [artikel 7, derde lid][ref4], en artikel 8, derde lid, van genoemde wet.


