      [artikel 69, eerste lid][ref2], wordt in het jaar waarop het bedrag betrekking heeft bij of krachtens de wet
      aangepast op basis van nieuwe ramingsgegevens.

      2 Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 69, eerste lid][ref3], wordt aangepast binnen een periode van vier weken na de herziening door Onze
