  - number: '56'
    text: |-
      1 Het instellen van een verzoek tot toekenning van een uitkering tot levensonderhoud voor kinderen verschuldigd
      krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] kan door het college als verplichting aan de bijstand worden
      verbonden, indien de belanghebbende hierop aanspraak heeft.

      2 Indien het college de in het eerste lid genoemde verplichting oplegt, dient de belanghebbende zelf een verzoek
      terzake in bij een bij algemene maatregel van bestuur aan te wijzen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 56a
    text: |-
      1 Dit artikel is van toepassing op de belanghebbende die:

      a. inburgeringsplichtig is op grond van de [Wet inburgering 2021][ref1]; en

      b. verblijf heeft op grond van een verblijfsvergunning asiel voor bepaalde tijd als bedoeld in
      [artikel 28 van de Vreemdelingenwet 2000][ref2].

      2 Het college verbindt aan de bijstand van de belanghebbende de verplichting om gedurende een periode van zes
      maanden, gerekend vanaf de dag waarop het recht op bijstand ontstaat, mee te werken aan het door het college in
      naam van de belanghebbende verrichten van betalingen uit de toegekende bijstand van huur, gas, water en stroom en
      de verplichte zorgverzekering.


      [ref1]: https://wetten.overheid.nl/BWBR0044770
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel28
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel56a
