  - number: '41'
    text: |-
      1 De aanvraag is gericht tot het college en wordt overeenkomstig
      [artikel 30c van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      ingediend bij het Uitvoeringsinstituut werknemersverzekeringen. Na de overdracht van de
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen aan het college ingevolge
      [artikel 30c, vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt de aanvraag
      verder behandeld door het college.

      2 Indien het een aanvraag betreft van andere dan algemene bijstand dan wel van algemene bijstand aan een persoon
      die de pensioengerechtigde leeftijd nog niet heeft bereikt die in een inrichting verblijft of die niet is
      ingeschreven in de basisregistratie personen wordt, in afwijking van het eerste lid, de aanvraag ingediend bij
      het college.

      3 De gemeenteraad kan, in overeenstemming met het Uitvoeringsinstituut werknemersverzekeringen, bij verordening
      categorieën van aanvragen vaststellen die, in afwijking van het tweede lid, bij het Uitvoeringsinstituut
      werknemersverzekeringen worden ingediend.

      4 Een aanvraag van algemene bijstand die alleen ziet op alleenstaanden en alleenstaande ouders jonger dan 27 jaar
      en gehuwden waarvan beide echtgenoten jonger dan 27 jaar zijn wordt niet eerder ingediend dan vier weken na de
      melding, bedoeld in artikel 44, en wordt niet eerder dan vier weken na die melding door het college in behandeling
      genomen. De vorige zin is niet van toepassing:

      a. voor de duur van een jaar op alleenstaanden, alleenstaande ouders en gehuwden wanneer een van de personen
      uiterlijk een jaar voorafgaand aan de aanvraag ingeschreven heeft gestaan bij:

      1°. het praktijkonderwijs, bedoeld in [artikel 2.8 van de Wet voortgezet onderwijs 2020][ref3], of

      2°. het voortgezet speciaal onderwijs, bedoeld in [artikel 2 van de Wet op de expertisecentra][ref4];

      b. op alleenstaanden, alleenstaande ouders en gehuwden wanneer een van de personen medisch urenbeperkt is of
      behoort tot de doelgroep loonkostensubsidie.

      5 Indien tot de personen voor wie bijstand is aangevraagd een of meer personen jonger dan 27 jaar behoren, worden
      documenten verstrekt die het college kunnen helpen bij de beoordeling of die personen jonger dan 27 jaar nog
      mogelijkheden hebben binnen het uit ‘s Rijks kas bekostigde onderwijs.

      6 De personen, bedoeld in het vierde lid, die recht hebben op een uitkering op grond van de
      [Werkloosheidswet][ref5], kunnen zich al melden om bijstand aan te vragen vanaf de dag gelegen vier weken voordat
      het recht op die uitkering eindigt.

      7 De documenten, bedoeld in het vijfde lid, worden verstrekt:

      a. indien het vierde lid van toepassing is: bij de aanvraag van algemene bijstand;

      b. indien het vierde lid niet van toepassing is: binnen vier weken na de melding, bedoeld in [artikel 44][ref6].

      8 Indien het vierde lid van toepassing is in geval van een vreemdeling als bedoeld in
      [artikel 11, tweede of derde lid][ref7]:

      a. die na een verzoek van de Hoge Commissaris van de Verenigde Naties voor de vluchtelingen op uitnodiging van de
      Nederlandse regering in Nederland verblijft; of

      b. van wie de aanspraak op verstrekkingen als bedoeld in
      [artikel 3, derde lid, van de Wet Centraal Orgaan opvang asielzoekers][ref8] is geëindigd, omdat:

      1°. een verblijfsvergunning is verleend en naar het oordeel van het Centraal Orgaan opvang asielzoekers passende
      huisvesting buiten de opvangvoorziening is gerealiseerd; of

      2°. bij vreemdelingen die een aanvraag tot het verlenen van de verblijfsvergunning als bedoeld
      in [artikel 14 van de Vreemdelingenwet 2000][ref9] hebben ingediend onder een beperking
      verband houdend met gezinshereniging met een asielzoeker aan wie verstrekkingen als bedoeld in
      [artikel 3, derde lid van de Wet Centraal Orgaan opvang asielzoekers][ref10] worden geboden, naar het oordeel van
      het Centraal Orgaan opvang asielzoekers passende huisvesting buiten de opvangvoorziening kan worden gerealiseerd,
      kan het college op verzoek van die vreemdeling bij wijze van voorschot algemene bijstand in de vorm van een
      renteloze geldlening verlenen na de melding, bedoeld in [artikel 44][ref11], indien onevenredig bezwarende
      individuele omstandigheden daartoe noodzaken en zolang het recht op algemene bijstand niet is vastgesteld.

      9 Bij de toepassing van het achtste lid is
      [artikel 52, eerste lid, onderdelen a en b, tweede tot en met het vierde lid][ref12], van overeenkomstige
      toepassing.

      10 In de aanvraag verleent belanghebbende het college een machtiging om onderzoek in te stellen naar de juistheid
      en volledigheid van de verstrekte gegevens en zo nodig naar andere gegevens die noodzakelijk zijn voor de verlening
      dan wel de voortzetting van bijstand.

      11 In afwijking van het vierde lid kan het college de aanvraag voor het verstrijken van de termijn van vier weken
      in behandeling nemen, indien naar het oordeel van het college de omstandigheden van de belanghebbende of het gezin
      daartoe aanleiding geven.

      12 In alle gevallen waar het vierde lid niet op van toepassing is, stelt het college betrokkene na melding
      onverwijld in de gelegenheid een aanvraag in te dienen.


