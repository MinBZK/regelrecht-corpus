  - number: '59'
    text: |-
      1 Onverminderd [artikel 58][ref1] kunnen kosten van bijstand, indien de bijstand aan een gezin wordt verleend, van
      alle gezinsleden worden teruggevorderd.

      2 Indien de bijstand als gezinsbijstand aan gehuwden had moeten worden verleend maar zulks
      achterwege is gebleven, omdat de belanghebbende de verplichtingen, bedoeld in [artikel 17][ref2], of
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet
      behoorlijk is nagekomen, kunnen de kosten van bijstand mede worden teruggevorderd van de persoon met wiens middelen
      als bedoeld in [paragraaf 3.4][ref4], bij de verlening van bijstand rekening had moeten worden gehouden.

      3 Indien de bijstand terecht als gezinsbijstand aan gehuwden is verleend, maar
      de belanghebbende toch de verplichtingen, bedoeld in [artikel 17][ref5], of
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref6], niet
      of niet behoorlijk is nagekomen, kunnen de kosten van de bijstand mede worden teruggevorderd van de persoon met
      wiens middelen als bedoeld in [paragraaf 3.4][ref7], bij de verlening van de bijstand rekening had moeten worden
      gehouden.

      4 De in het eerste, tweede en derde lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van
      kosten van bijstand die worden teruggevorderd.


