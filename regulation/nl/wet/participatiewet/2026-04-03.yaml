  - number: '35'
    text: |-
      1 Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op bijzondere bijstand voor zover
      de alleenstaande of het gezin niet beschikt over de middelen om te voorzien in de uit bijzondere omstandigheden
      voortvloeiende noodzakelijke kosten van het bestaan en deze kosten naar het oordeel van het college niet
      kunnen worden voldaan uit de bijstandsnorm, de individuele inkomenstoeslag, bedoeld in [artikel 36][ref2], de
      studietoeslag, bedoeld in [artikel 36b][ref3], het vermogen en het inkomen voor zover dit meer bedraagt dan de
      bijstandsnorm, waarbij [artikel 31, tweede lid][ref4], en [artikel 34, tweede lid][ref5], niet van toepassing zijn.
      Het college bepaalt het begin en de duur van de periode waarover het vermogen en het inkomen in aanmerking wordt
      genomen.

      2 Het college kan bijzondere bijstand weigeren, indien de in het eerste lid bedoelde kosten binnen twaalf maanden
      een bedrag van € 176,00 niet te boven gaan.

      3 In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon worden verleend in de vorm van een
      collectieve aanvullende zorgverzekering of in de vorm van een tegemoetkoming in de kosten van de premie van een
      dergelijke verzekering zonder dat wordt nagegaan of ten aanzien van die persoon de kosten van die verzekering of
      die premie ook daadwerkelijk noodzakelijk zijn of gemaakt zijn.

      4 In afwijking van het eerste lid kan bijzondere bijstand ook aan een alleenstaande of een gezin worden verleend in
      de vorm van een eenmalige energietoeslag, zonder dat wordt nagegaan of die alleenstaande of dat gezin in dat jaar
      een sterk gestegen energierekening had:

      a. voor het jaar 2022, die kan worden verstrekt tot en met 30 juni 2023;

      b. voor het jaar 2023, die kan worden verstrekt tot en met 31 augustus 2024.

      5 Het vierde lid, onderdeel b, is niet van toepassing op degene die:

      a. 18, 19 of 20 jaar is;

      b. in aanmerking komt voor studiefinanciering als bedoeld in
      [artikel 3.1, eerste of tweede lid, van de Wet studiefinanciering 2000][ref6]; of

      c. is ingeschreven als ingezetene met enkel een briefadres in de basisregistratie personen.

      6 De in het vierde lid bedoelde toeslag kan in afwijking van [artikel 43, eerste lid][ref7], ambtshalve worden
      vastgesteld.

      7 Voor de toepassing van dit artikel wordt onder bijzondere bijstand niet verstaan individuele inkomenstoeslag als
      bedoeld in [artikel 36][ref8].

      8 Voorzover de gemeente krachtens de [Wet op de loonbelasting 1964][ref9] inhoudingsplichtige is, wordt de
      bijzondere bijstand verhoogd met de loonbelasting en premies volksverzekeringen.


