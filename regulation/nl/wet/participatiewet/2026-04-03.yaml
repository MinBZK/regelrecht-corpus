  - number: 18b
    text: |-
      1 Het college verlaagt de bijstand, overeenkomstig het negende, tiende en elfde lid, indien naar zijn oordeel
      een redelijk vermoeden bestaat dat belanghebbende niet of niet in voldoende mate de Nederlandse taal beheerst,
      noodzakelijk voor het naar vermogen verkrijgen, het aanvaarden en het behouden van algemeen geaccepteerde arbeid.

      2 Het college neemt een toets bij de belanghebbende af, indien belanghebbende:

      a. niet gedurende acht jaar Nederlandstalig onderwijs heeft gevolgd;

      b. geen diploma voor het inburgeringsexamen dan wel de onderwijsroute, bedoeld in
      [artikel 6, tweede lid, van de Wet inburgering 2021][ref1] kan overleggen; en

      c. geen ander document kan overleggen waaruit blijkt dat hij de vaardigheden in de Nederlandse taal beheerst.

      Indien de omstandigheden, bedoeld in de eerste zin, onderdelen a, b en c aanwezig zijn ten tijde van de aanvraag
      van bijstand, wordt na ontvangst van die aanvraag een toets afgenomen binnen een door het college te bepalen
      termijn die ten hoogste acht weken bedraagt.

      3 Indien uit de uitkomst van de toets, bedoeld in het tweede lid, blijkt dat belanghebbende niet of niet in
      voldoende mate de vaardigheden in de Nederlandse taal beheerst, wordt het redelijk vermoeden, bedoeld in het eerste
      lid, geacht aanwezig te zijn.

      4 Belanghebbende wordt na de uitkomst van de toets, bedoeld in het tweede lid, waaruit blijkt dat hij niet of niet
      in voldoende mate de vaardigheden in de Nederlandse taal beheerst, binnen een door het college te bepalen termijn
      die ten hoogste acht weken bedraagt, door het college schriftelijk in kennis gesteld van het redelijk vermoeden,
      bedoeld in het eerste lid. De verlaging van de bijstand vindt plaats vanaf het moment dat die schriftelijke
      kennisgeving plaatsvindt.

      5 De belanghebbende kan op ieder moment het redelijk vermoeden, bedoeld in het eerste lid, wegnemen door het
      overleggen van een diploma als bedoeld in het tweede lid, onderdeel b, of door het overleggen van een document als
      bedoeld in het tweede lid, onderdeel c.

      6 In afwijking van het eerste lid verlaagt het college de bijstand niet in verband met het in dat lid bedoelde
      redelijke vermoeden, indien:

      a. belanghebbende zich bereid verklaart binnen een maand nadat het college belanghebbende in kennis heeft gesteld
      van het bestaan van dat vermoeden aan te vangen met het verwerven van de vaardigheden in de Nederlandse taal en na
      die aanvang voldoet aan de voortgang die van hem verwacht mag worden bij het verwerven van de vaardigheden in de
      Nederlandse taal; of

      b. elke vorm van verwijtbaarheid ontbreekt.

      7 In afwijking van het eerste lid stemt het college in verband met het in dat lid bedoelde redelijke vermoeden een
      verlaging af op de omstandigheden van de belanghebbende en diens mogelijkheden om middelen te verwerven, indien
      naar zijn oordeel, gelet op bijzondere omstandigheden, dringende redenen daartoe noodzaken.

      8 Onder de vaardigheden, bedoeld in het tweede, zesde, tiende, elfde en twaalfde lid, worden de volgende
      vaardigheden in de Nederlandse taal op minimaal het referentieniveau 1F dat is vastgesteld op grond van
      [artikel 2, eerste lid, van de Wet referentieniveaus Nederlandse taal en rekenen][ref2] verstaan:

      a. spreekvaardigheid;

      b. luistervaardigheid;

      c. gespreksvaardigheid;

      d. schrijfvaardigheid; en

      e. leesvaardigheid.

      9 De bijstand wordt gedurende zes maanden verlaagd met 20 procent van de bijstandsnorm vanaf het moment, bedoeld in
      het vierde lid, tweede zin.

      10 De bijstand wordt gedurende zes maanden verlaagd met 40 procent van de bijstandsnorm, te rekenen vanaf zes
      maanden na het moment, bedoeld in het vierde lid, tweede zin, indien uit de uitkomst van een door het college
      afgenomen toets blijkt dat de belanghebbende:

      a. de vaardigheden in de Nederlandse taal niet beheerst; en

      b. niet voldoet aan de voortgang die van hem verwacht mag worden met het verwerven van de vaardigheden in de
      Nederlandse taal.

      11 De verlaging van de bijstand bedraagt 100 procent van de bijstandsnorm voor onbepaalde tijd, te rekenen vanaf
      twaalf maanden na het moment, bedoeld in het vierde lid, tweede zin, indien uit de uitkomst van een door het
      college afgenomen toets blijkt dat de belanghebbende:

      a. de vaardigheden in de Nederlandse taal niet beheerst; en

      b. niet voldoet aan de voortgang die van hem verwacht mag worden met het verwerven van de vaardigheden in de
      Nederlandse taal.

      12 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de toets, bedoeld
      in het tweede, tiende en elfde lid, van de vaardigheden in de Nederlandse taal. Deze regels hebben in elk geval
      betrekking op:

      a. de in de toets op te nemen onderdelen;

      b. de wijze van toetsing van de verschillende onderdelen;

      c. de wijze van beoordeling van de toets;

      d. de kwalificatie van degene die de toets beoordeelt; en

      e. de omstandigheden waaronder de toets wordt afgenomen.

      13 De toets, bedoeld in het tweede, tiende en elfde lid, wordt telkens afgenomen voordat de verlaging van de
      bijstand door het college wordt toegepast.

      14 Bij de toepassing van dit artikel wordt onder belanghebbende mede verstaan het gezin.


