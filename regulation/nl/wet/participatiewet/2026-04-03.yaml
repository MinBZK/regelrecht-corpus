  - number: 8a
    text: |-
      1 De gemeenteraad stelt bij verordening regels met betrekking tot:

      a. het ondersteunen bij arbeidsinschakeling en het aanbieden van voorzieningen gericht op arbeidsinschakeling,
      bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], [artikel 7a][ref2] en [artikel 10, eerste lid][ref3];

      b. het opdragen van een tegenprestatie als bedoeld in [artikel 9, eerste lid, onderdeel c][ref4];

      c. de scholing of opleiding, bedoeld in [artikel 10a, vijfde lid][ref5];

      d. de premie, bedoeld in [artikel 10a, zesde lid][ref6];

      e. het verrichten van werkzaamheden in een beschutte omgeving, bedoeld in [artikel 10b][ref7].

      2 De regels, bedoeld in het eerste lid, bepalen in ieder geval:

      a. onder welke voorwaarden welke personen, bedoeld in [artikel 7, eerste lid, onderdeel a][ref8], en werkgevers
      van deze personen in aanmerking komen voor in de verordening te omschrijven voorzieningen en hoe deze rekening
      houdend met omstandigheden, zoals de zorgtaken, en het feit, dat die persoon tot de doelgroep loonkostensubsidie
      behoort of gebruik maakt van de voorziening beschut werk, bedoeld in [artikel 10b][ref9], of een andere structurele
      functionele beperking heeft, evenwichtig over deze personen worden verdeeld;

      b. welke regels gelden voor het aanbod van scholing of opleiding en voor de premie indien onbeloonde additionele
      werkzaamheden worden verricht als bedoeld in [artikel 10a][ref10] waarbij die regels voor de premie in ieder geval
      betrekking hebben op de hoogte van de premie in relatie tot de armoedeval;

      c. de wijze waarop het administratieve proces met betrekking tot het verstrekken van loonkostensubsidie, bedoeld in
      [artikel 10d][ref11], wordt vormgegeven;

      d. onder welke voorwaarden het college toestemming verleent aan een persoon als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref12], die algemene bijstand ontvangt om op een proefplaats gedurende twee
      maanden, met mogelijkheid tot verlenging met maximaal vier maanden, werkzaamheden te verrichten;

      e. met betrekking tot de persoonlijke ondersteuning bij het verrichten van de aan die persoon opgedragen taken,
      bedoeld in artikel 10, eerste lid:

      1°. de duur en intensiteit van de persoonlijke ondersteuning en op welke wijze het college ervoor zorgdraagt dat
      die zowel in natura als door middel van subsidieverstrekking kan worden gerealiseerd;

      2°. welke kwaliteitseisen aan een persoon als bedoeld in [artikel 10, derde lid, onderdeel a][ref13], worden
      gesteld en op welke wijze die eisen worden geborgd;

      f. op welke wijze het college welke voorzieningen als bedoeld in [artikel 10, eerste lid][ref14], verstrekt die
      bestaan uit:

      1°. een vervoersvoorziening die ertoe strekt dat de persoon, met uitzondering van de persoon met een visuele
      beperking, zijn werkplek, proefplaats of opleidingslocatie kan bereiken;

      2°. een noodzakelijke intermediaire activiteit in het geval er sprake is van een motorische beperking;

      3°. een meeneembare voorziening voor de inrichting van de werkplek, de productie- en werkmethoden, de inrichting
      van de opleidingslocatie of de proefplaats en de bij het werk of opleiding te gebruiken hulpmiddelen;

      g. op welke wijze waar nodig voor een persoon als bedoeld in de [artikelen 7, eerste lid, onderdeel a][ref15], of
      [10d, tweede lid][ref16], wordt voorzien in:

      1°. integrale ondersteuning, en

      2°. voortgezette persoonlijke ondersteuning bij de overgang van onderwijs naar werk, van werk naar onderwijs en van
      werk naar werk.


