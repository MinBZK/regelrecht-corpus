  - number: 36b
    text: |-
      1 In aanvulling op de [artikelen 7][ref1] en [7a, eerste lid, onderdeel b of c][ref2] verstrekt het college op
      aanvraag van een belanghebbende die als rechtstreeks gevolg van een ziekte of gebrek structureel niet in staat
      is naast de studie inkomsten te verwerven, een studietoeslag waarvan de minimale hoogte, die voor naar leeftijd
      te onderscheiden categorieën belanghebbenden verschillend kan zijn, bij algemene maatregel van bestuur wordt
      vastgesteld.

      2 Bij de beoordeling of recht bestaat op de studietoeslag vraagt het college een geneeskundig advies, tenzij zonder
      dit advies vastgesteld kan worden dat recht bestaat op de studietoeslag.

      3 De aanvraag kan worden gedaan door een belanghebbende die:

      a. studiefinanciering ontvangt op grond van de [Wet studiefinanciering 2000][ref3],
      niet zijnde het levenlanglerenkrediet, of een tegemoetkoming krijgt op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref4]; en

      b. geen recht heeft op een uitkering op grond van de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5].

      4 De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht op
      de studietoeslag. Deze verplichting geldt niet als die feiten en omstandigheden door het college kunnen worden
      vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of kunnen worden verkregen
      uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt bepaald voor welke
      gegevens de tweede zin van toepassing is.

      5 De belanghebbende die in het kader van zijn studie inkomsten uit een stage ontvangt, behoudt het recht op de
      studietoeslag, met dien verstande dat de hoogte van de studietoeslag wordt verminderd met het bedrag aan inkomsten
      uit de stage voor zover dat het een bij algemene maatregel van bestuur te bepalen bedrag te boven gaat.

      6 [Artikel 40, eerste lid][ref6], en [paragraaf 6.4][ref7], zijn van overeenkomstige toepassing,
      met dien verstande dat waar «bijstand» staat steeds gelezen wordt «studietoeslag» en waar «de
      verplichting, bedoeld in [artikel 17, eerste lid][ref8], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref9]» staat
      steeds gelezen wordt «de verplichting, bedoeld in artikel 36b, vierde lid».


