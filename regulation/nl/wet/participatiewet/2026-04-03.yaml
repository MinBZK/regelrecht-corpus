  - number: 6a
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder gegevens mede verstaan persoonsgegevens als bedoeld in
      de Algemene verordening gegevensbescherming.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel6a
  - number: 6b
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt onder medisch urenbeperkt verstaan: als rechtstreeks en
      objectief medisch vast te stellen gevolg van ziekte, gebreken, zwangerschap of bevalling voor een geringer aantal
      uren belastbaar zijn dan de arbeidsduur welke in overeenkomstige dienstbetrekkingen in de regel geacht wordt een
      volledige dienstbetrekking te vormen.

      2 Het college kan:

      a. ambtshalve vaststellen of een persoon als bedoeld in [artikel 7, eerste lid, onderdeel a, onder 1][ref1], of
      [artikel 7a, eerste lid, onderdeel a][ref2], die algemene bijstand ontvangt, medisch urenbeperkt is;

      b. op schriftelijke aanvraag van een persoon als bedoeld in [artikel 7, eerste lid, onderdeel a, onder 1][ref3],
      of [artikel 7a, eerste lid, onderdeel a][ref4], die algemene bijstand ontvangt, vaststellen of hij medisch
      urenbeperkt is.

      3 Een aanvraag als bedoeld in het tweede lid, onderdeel b, kan slechts eenmaal per twaalf maanden worden ingediend.

      4 Het Uitvoeringsinstituut werknemersverzekeringen verricht voor het college de werkzaamheden ten behoeve
      van de vaststelling of een persoon als bedoeld in [artikel 7, eerste lid, onderdeel a, onder 1][ref5], of
      [artikel 7a, eerste lid, onderdeel a][ref6], die algemene bijstand ontvangt, medisch urenbeperkt is en adviseert
      het college hierover.


