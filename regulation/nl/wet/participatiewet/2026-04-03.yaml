  - number: '13'
    text: |-
      1 Geen recht op bijstand heeft degene:

      a. aan wie rechtens zijn vrijheid is ontnomen;

      b. die zich onttrekt aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;

      c. die zijn militaire of vervangende dienstplicht vervult;

      d. die wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voorzover diens gebrek aan middelen daarvan
      het gevolg is;

      e. die per kalenderjaar langer dan vier weken verblijf houdt buiten Nederland dan wel een aaneengesloten periode
      van langer dan vier weken verblijf houdt buiten Nederland;

      f. die jonger is dan 18 jaar;

      g. die bijstand vraagt ter gedeeltelijke of volledige aflossing van een schuldenlast en die overigens bij het
      ontstaan van de schuldenlast, dan wel nadien, beschikte of beschikt over de middelen om in de noodzakelijke kosten
      van het bestaan te voorzien;

      h. die een uitreiziger is.

      2 Geen recht op algemene bijstand heeft degene:

      a. van 18, 19 of 20 jaar die in een inrichting verblijft;

      b. die onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die gehuwd
      is met een zodanig persoon, voor zover diens gebrek aan middelen daarvan het gevolg is, tenzij de belanghebbende
      alleenstaande ouder is en hij verlof geniet als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref2];

      c. die jonger is dan 27 jaar en uit ’s Rijks kas bekostigd onderwijs kan volgen en:

      1°. in verband daarmee aanspraak heeft op studiefinanciering op grond van de [Wet studiefinanciering 2000][ref3],
      dan wel

      2°. in verband daarmee geen aanspraak heeft op studiefinanciering en dit onderwijs niet volgt;

      d. die jonger is dan 27 jaar en uit wiens houding en gedragingen ondubbelzinnig blijkt dat hij de verplichtingen,
      bedoeld in [artikel 9, eerste lid][ref4], of [artikel 55][ref5] niet wil nakomen.

      3 Het eerste lid, onderdeel a, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen
      categorieën personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt
      buiten een penitentiaire inrichting, een instelling voor de verpleging van ter beschikking gestelden of een
      inrichting als bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref6].
      Het eerste lid, onderdelen a en b, is niet van toepassing op de persoon aan wie rechtens zijn
      vrijheid is ontnomen op grond van de [Wet verplichte geestelijke gezondheidszorg][ref7], de
      [Wet zorg en dwang psychogeriatrische en verstandelijk gehandicapte cliënten][ref8] of, voor
      zover het het recht op bijzondere bijstand betreft, na ontslag van alle rechtsvervolging, van
      [artikel 37b, eerste lid, van het Wetboek van Strafrecht][ref9] of op de persoon die zich onttrekt aan de
      tenuitvoerlegging van een vrijheidsbenemende maatregel op grond van die artikelen.

      4 In afwijking van het eerste lid, onderdeel e, geldt voor personen die de pensioengerechtigde leeftijd hebben
      bereikt, een periode van dertien weken.


