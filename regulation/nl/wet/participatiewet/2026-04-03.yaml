      1 Het recht op bijstand bestaat jegens het college van de gemeente waar de belanghebbende woonplaats heeft
      als bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2]. Bij
      algemene maatregel van bestuur kan worden bepaald dat bijstand aan een belanghebbende die niet is ingeschreven als
      ingezetene met een woonadres of briefadres in de basisregistratie personen wordt verleend door het college van een
      bij die maatregel aan te wijzen gemeente.

      2 Indien bij de beoordeling van het recht op bijstand blijkt dat het door een belanghebbende verstrekte adres van
      hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de basisregistratie
      personen is ingeschreven, schort het college de betaling van de bijstand op.

      3 Geen opschorting vindt plaats indien:

      a. de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de bijstand;

      b. de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt;

      c. daarvoor naar het oordeel van het college dringende redenen aanwezig zijn;

      d. de belanghebbende voor het leveren van mantelzorg bij een intensieve zorgbehoefte tijdelijk gebruikmaakt van een
      hoofdverblijf elders.

      4 Het college doet schriftelijk mededeling van de opschorting, bedoeld in het tweede lid, aan de belanghebbende
      en geeft daarbij de gelegenheid tot adreswijziging in de basisregistratie personen binnen een door het college te
      stellen termijn.

      5 De opschorting wordt beëindigd zodra het aan het college gebleken is dat de afwijking niet meer bestaat. Indien
      de afwijking ook na de krachtens het vierde lid gestelde termijn nog bestaat, herziet het college het besluit tot
      toekenning van de bijstand of trekt het dit in met ingang van de eerste dag waarop de betaling van de bijstand
      is opgeschort.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
