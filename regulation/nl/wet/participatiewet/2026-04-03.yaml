  - number: 47f
    text: |-
      1 Rechten en verplichtingen die voortvloeien uit een door het college verstrekte geldlening of borgtocht op
      grond van [artikel 48][ref1], [50][ref2] of [78c][ref3], die op grond van [artikel 47a, eerste lid][ref4] wordt
      voortgezet, gaan over op de Sociale verzekeringsbank.

      2 Vermogensbestanddelen die voortvloeien uit een geldlening als bedoeld in het eerste lid gaan met ingang van
      de datum van voortzetting van de geldlening op grond van [artikel 47a, eerste lid][ref5] over op de Sociale
      verzekeringsbank, zonder dat daarvoor een akte of betekening nodig is.

      3 Met betrekking tot de op grond van het tweede lid overgaande vermogensbestanddelen die in openbare registers
      te boek zijn gesteld, zal verandering van de tenaamstelling in die registers plaatsvinden door de bewaarders
      van die registers. De daartoe benodigde opgaven worden door de zorg van Onze Minister aan de bewaarders van de
      desbetreffende registers gedaan.

      4 Terzake van de in het tweede lid bedoelde overgang van vermogensbestanddelen blijft heffing van
      overdrachtsbelasting achterwege.

      5 Indien de Sociale verzekeringsbank het bedrag van de geldlening of borgtocht invordert, betaalt de Sociale
      verzekeringsbank aan het college, bedoeld in het eerste lid, het bedrag van de door het college verstrekte
      geldlening of borgtocht, of indien de opbrengst na aftrek van kosten minder bedraagt dan het totale bedrag van de
      geldlening of borgtocht een evenredig deel van de geldlening of borgtocht.


