  - number: '63'
    text: |-
      1 Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en
      inlichtingen te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet
      door het college ten opzichte van een persoon te wiens behoeve bijstand is gevraagd of wordt verleend en die in
      zijn dienst dan wel voor hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt
      zich mede uit tot de inkomsten van een persoon van wie kosten van bijstand ingevolge [paragraaf 4][ref1] worden of
      kunnen worden teruggevorderd of op wie kosten van bijstand ingevolge [paragraaf 5][ref2] worden of kunnen worden
      verhaald.

      2 De opgaven en inlichtingen worden desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
