    text: |-
      1 Er is een toetsingscommissie vangnet Participatiewet, die tot taak heeft Onze Minister te adviseren over een te
      nemen besluit naar aanleiding van een verzoek als bedoeld in [artikel 74, eerste lid][ref1].

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de samenstelling, de
      taakuitoefening en oordeelsvorming door de toetsingscommissie vangnet Participatiewet.


