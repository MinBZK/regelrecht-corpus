  - number: 44a
    text: |-
      1 Het plan van aanpak bevat:

      a. indien van toepassing de uitwerking van de ondersteuning;

      b. de verplichtingen gericht op arbeidsinschakeling en de gevolgen van het niet naleven van die verplichtingen.

      2 Het college begeleidt een persoon die recht heeft op algemene bijstand bij de uitvoering van het plan van aanpak
      en evalueert, in samenspraak met die persoon, periodiek het plan van aanpak en stelt dit zonodig bij.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel44a
  - number: '45'
    text: |-
      1 De algemene bijstand wordt per kalendermaand vastgesteld en betaald. In afwijking van de eerste volzin wordt
      de vakantietoeslag, voorzover niet reeds eerder betaald, jaarlijks betaald in de maand juni over de aan die maand
      voorafgaande twaalf maanden of zo veel eerder als de vakantietoeslag over deze periode vaststaat, dan wel binnen
      drie maanden volgend op de maand waarin de algemene bijstand is beëindigd.

      2 Het college kan op grond van [artikel 18, eerste lid][ref1], besluiten de algemene bijstand over een andere
      periode als bedoeld in het eerste lid vast te stellen of te betalen.

      3 De algemene bijstand wordt vastgesteld over het deel van de kalendermaand waarover recht op bijstand bestaat,
      indien de alleenstaande of het gezin voorafgaand aan of volgend op de bijstandsverlening:

      a. gedurende een periode van ten minste 30 dagen geen algemene bijstand ontvangt; of

      b. anderszins geen recht op algemene bijstand heeft.

      4 De algemene bijstand wordt uitbetaald aan ieder van de rechthebbende echtgenoten voor de helft dan wel op hun
      gezamenlijk verzoek aan een van hen voor het geheel.

      5 Ingeval van overlijden van een van de echtgenoten, van de alleenstaande ouder, van het laatste ten laste komende
      kind van gehuwden waarvan de leeftijd van een echtgenoot of beide echtgenoten 18, 19 of 20 jaar is, of van het
      laatste ten laste komende kind van de alleenstaande ouder, wordt de algemene bijstand tot en met één maand na de
      dag van het overlijden, betaald naar de op het moment van overlijden van toepassing zijnde bijstandsnorm aan de
      andere echtgenoot, de ten laste komende kinderen, onderscheidenlijk de gewezen alleenstaande ouder.

      6 Bij algemene maatregel van bestuur kan worden bepaald wanneer de algemene bijstand wordt betaald in de
      kalendermaand, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
