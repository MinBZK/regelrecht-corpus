  - number: '42'
    text: |-
      1 Indien doorzending van de aanvraag naar het college van een andere gemeente heeft plaatsgevonden en dit van
      oordeel is dat het evenmin de aanvraag dient te behandelen, terwijl geen zekerheid kan worden verkregen over de
      in [artikel 40][ref1] bedoelde woonplaats, draagt het college dat de doorgezonden aanvraag heeft ontvangen er zorg
      voor dat het geschil aanhangig wordt gemaakt.

      2 In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      bijstand jegens het college van de gemeente waar de belanghebbende werkelijk verblijft.

      3 Kosten van bijstand verleend ingevolge het tweede lid worden vergoed door het college van de gemeente waarvan de
      taak is waargenomen.


