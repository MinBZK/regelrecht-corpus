  - number: 78ee
    text: |-
      1 In dit artikel wordt verstaan onder:

        - *aanvullende beurs:* aanvullende beurs als bedoeld in [artikel 3.8 van de Wet studiefinanciering 2000][ref1];
        - *basisbeurs uitwonend:* basisbeurs voor een uitwonende student als bedoeld in
      [artikel 3.6, eerste lid, van de Wet studiefinanciering 2000][ref2];
        - *leenfase:* fase als bedoeld in [artikel 4.7, derde lid][ref3], [artikel 4.18, tweede lid][ref4], of
      [artikel 5.2, vierde lid van de Wet studiefinanciering 2000][ref5], waarin een student studiefinanciering kan
      ontvangen in de vorm van een lening;
        - *lening:* studiefinanciering in de vorm van een lening als bedoeld in [artikel 4.7, derde lid][ref6],
      [artikel 4.18, tweede lid][ref7], of [artikel 5.2, vierde lid van de Wet studiefinanciering 2000][ref8];
        - *student:* student als bedoeld in [artikel 1.1 van de Wet studiefinanciering 2000][ref9];
        - *uitwonende student:* uitwonende student als bedoeld in [artikel 1.1 van de Wet studiefinanciering 2000][ref10].

      2 Onze Minister kan ambtshalve een eenmalige tegemoetkoming voor energiekosten verlenen ter hoogte van een bij
      ministeriële regeling vast te stellen bedrag aan een student die uiterlijk op 31 juli 2024 een basisbeurs uitwonend
      en een aanvullende beurs voor de maand oktober 2023 heeft aangevraagd en aan wie deze zijn toegekend.

      3 Onze Minister kan ambtshalve een eenmalige tegemoetkoming voor energiekosten verlenen ter hoogte van een bij
      ministeriële regeling vast te stellen bedrag aan een student die:

      a. zich op 1 oktober 2023 in de leenfase bevindt;

      b. in de laatste maand voor aanvang van de leenfase een aanvullende beurs ontving; en

      c. uiterlijk op 31 juli 2024 voor de maand oktober 2023 een lening heeft aangevraagd en aan wie deze is toegekend.

      4 Een besluit tot toekenning van de tegemoetkoming kan niet ten nadele van een student worden herzien.

      5 De tegemoetkoming is geen bijstand in de zin van deze wet of studiefinanciering in de zin van
      [artikel 3.1 van de Wet studiefinanciering 2000][ref11].

      6 Op de tegemoetkoming is [artikel 46, tweede lid][ref12], van overeenkomstige toepassing en zijn de
      [artikelen 76 tot en met 78][ref13] niet van toepassing.

      7 Voor de uitvoering van dit artikel kan Onze Minister van de persoonsgegevens van de student die Onze Minister van
      Onderwijs, Cultuur en Wetenschap beschikbaar heeft ter uitvoering van de [Wet studiefinanciering 2000][ref14], de
      volgende persoonsgegevens verwerken, met uitzondering van bijzondere categorieën van persoonsgegevens:

      a. contactgegevens;

      b. identificerende gegevens waaronder het burgerservicenummer of het onderwijsnummer, bedoeld in
      [artikel 1.7 van de Wet studiefinanciering 2000][ref15];

      c. bankrekeningnummer;

      d. het gegeven of aan een student een aanvullende beurs is toegekend;

      e. het gegeven of aan een student een basisbeurs uitwonend is toegekend;

      f. het gegeven of een student een lening heeft aangevraagd voor de maand oktober 2023, en of die student in de
      laatste maand voor aanvang van de leenfase een aanvullende beurs ontving.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de goede uitvoering van dit artikel.

      9 [Hoofdstuk 7b][ref16] vervalt op een bij koninklijk besluit te bepalen tijdstip, met dien verstande dat het
      van toepassing blijft op geschillen die op dat tijdstip in bezwaar, beroep of hoger beroep aanhangig zijn met
      betrekking tot besluiten van Onze Minister die op grond van dit artikel zijn genomen.


