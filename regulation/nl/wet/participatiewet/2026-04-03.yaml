  - number: 47d
    text: |-
      1 De [artikelen 40, eerste lid][ref1], en [62c][ref2] zijn niet van toepassing bij de uitvoering van deze wet door
      de Sociale verzekeringsbank.

      2 De aanvraag voor algemene bijstand als aanvullende inkomensvoorziening ouderen van een persoon als bedoeld in
      [artikel 47a, eerste lid][ref3], wordt ingediend bij de Sociale verzekeringsbank.

      3 Voor algemene bijstand als aanvullende inkomensvoorziening ouderen heeft de belanghebbende zich gemeld als zijn
      naam, adres en woonplaats bij de Sociale verzekeringsbank zijn geregistreerd, en:

      a. indien het gehuwden betreft waarvan de echtgenoot van degene die de pensioengerechtigde leeftijd heeft
      bereikt, jonger dan 27 jaar is: de belanghebbende door de Sociale verzekeringsbank op de hoogte is gesteld
      van de verplichting, bedoeld in [artikel 9, eerste lid, onderdeel a, en de inhoud van het tweede lid][ref4],
      [artikel 41, vijfde en zevende lid][ref5], en [artikel 43, vijfde lid][ref6];

      b. indien tot de personen voor wie bijstand is aangevraagd geen persoon jonger dan 27 jaar behoort: hij in staat is
      gesteld zijn aanvraag in te dienen bij de Sociale Verzekeringsbank.

      4 Het plan van aanpak, bedoeld in [artikel 44a][ref7], wordt door de Sociale verzekeringsbank vastgesteld in
      overeenstemming met het college.


