  - number: 8d
    text: |-
      De gemeenteraad stelt periodiek een plan vast omtrent de wijze waarop het college uitvoering zal geven aan het op
      13 december 2006 te New York tot stand gekomen Verdrag inzake de rechten van personen met een handicap (Trb. 2007,
      169).
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel8d
  - number: '9'
    text: |-
      1 De belanghebbende van 18 jaar of ouder doch jonger dan de pensioengerechtigde leeftijd is, vanaf de dag van
      melding als bedoeld in [artikel 44, tweede lid][ref1], verplicht:

      a. naar vermogen algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een voorziening
      als bedoeld in de [artikelen 7, eerste lid, onderdeel a][ref2], of [7a, eerste lid, onderdeel a][ref3],
      te verkrijgen, deze te aanvaarden en te behouden, waaronder begrepen registratie als werkzoekende bij
      het Uitvoeringsinstituut werknemersverzekeringen, indien hem daartoe het recht toekomt op grond van
      [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];

      b. gebruik te maken van een door het college aangeboden voorziening, waaronder begrepen sociale activering, gericht
      op arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling
      en, indien van toepassing, mee te werken aan het opstellen, uitvoeren en evalueren van een plan van aanpak als
      bedoeld in [artikel 44a][ref5];

      c. naar vermogen door het college opgedragen onbeloonde maatschappelijk nuttige werkzaamheden te verrichten die
      worden verricht naast of in aanvulling op reguliere arbeid en die niet leiden tot verdringing op de arbeidsmarkt.

      2 Indien daarvoor dringende redenen aanwezig zijn, kan het college in individuele gevallen tijdelijk ontheffing
      verlenen van een verplichting als bedoeld in het eerste lid, onderdelen a en c. Zorgtaken kunnen als dringende
      redenen worden aangemerkt, voorzover hiermee geen rekening kan worden gehouden door middel van een voorziening als
      bedoeld in [artikel 7, eerste lid, onderdeel a][ref6].

      3 Indien bijstand wordt verleend aan gehuwden gelden de verplichtingen, bedoeld in het eerste lid, voor ieder van
      hen.

      4 De verplichting om algemeen geaccepteerde arbeid te aanvaarden geldt voor de alleenstaande ouder met kinderen tot
      12 jaar slechts nadat het college zich genoegzaam heeft overtuigd van de beschikbaarheid van passende kinderopvang,
      de toepassing van voldoende scholing en de belastbaarheid van de betrokkene.

      5 De verplichtingen, bedoeld in het eerste lid, onderdelen a, b en c, zijn niet van
      toepassing op de belanghebbende die volledig en duurzaam arbeidsongeschikt is als bedoeld in
      [artikel 4 van de Wet werk en inkomen naar arbeidsvermogen][ref7].

      6 De belanghebbende is verplicht zich te onthouden van zeer ernstige misdragingen jegens de met de uitvoering van
      deze wet belaste personen en instanties tijdens het verrichten van hun werkzaamheden.

      7 De verplichting, bedoeld in het eerste lid, onderdeel c, is niet van toepassing op de alleenstaande ouder die in
      het bezit is van een ontheffing als bedoeld in [artikel 9a, eerste lid][ref8].


