  - number: '16'
    text: |-
      1 Aan een persoon die geen recht op bijstand heeft, kan het college, gelet op alle omstandigheden, in afwijking van
      deze paragraaf, bijstand verlenen indien zeer dringende redenen daartoe noodzaken.

      2 Het eerste lid is niet van toepassing op andere vreemdelingen dan die, bedoeld in
      [artikel 11, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel11
