  - number: '51'
    text: |-
      1 Bijzondere bijstand voor de kosten van noodzakelijke duurzame gebruiksgoederen kan worden verleend in de vorm van
      een geldlening of borgtocht, dan wel in de vorm van een bedrag om niet.

      2 Indien een geldlening als bedoeld in het eerste lid wordt verstrekt, stemt het college de aflossingsbedragen en
      de duur van de aflossing mede af op de omstandigheden, mogelijkheden en middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel51
  - number: '52'
    text: |-
      1 Het college verleent uiterlijk binnen vier weken na de datum van aanvraag en vervolgens telkens uiterlijk na
      vier weken, bij wijze van voorschot algemene bijstand in de vorm van een renteloze geldlening, zolang het recht op
      algemene bijstand niet is vastgesteld. De eerste zin is niet van toepassing indien:

      a. de belanghebbende de voor de vaststelling van het recht op algemene bijstand van belang zijnde gegevens of de
      gevorderde bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel
      indien de belanghebbende anderszins onvoldoende medewerking verleent;

      b. bij de aanvraag duidelijk is dat geen recht op algemene bijstand bestaat.

      2 De hoogte van het in het eerste lid bedoelde voorschot bedraagt in ieder geval 95% van de hoogte van de algemene
      bijstand, bedoeld in [artikel 19, tweede lid][ref1].

      3 Het college is bevoegd om bij wijze van voorschot bijzondere bijstand te verlenen in de vorm van een renteloze
      geldlening.

      4 Indien bijstand wordt verleend over een periode waarover met toepassing van het eerste lid een voorschot is
      verleend, kan deze bijstand zonder machtiging van de belanghebbende worden verrekend met dit voorschot.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel19
