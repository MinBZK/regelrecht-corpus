    text: |-
      1 Het college kent ambtshalve of op aanvraag een tegemoetkoming toe aan een huishouden, indien is voldaan aan de
      volgende voorwaarden:

      a. het huishouden heeft een inkomen uit een uitkering, niet zijnde een uitkering op grond van deze wet, eventueel
      aangevuld met een uitkering op grond van [artikel 19][ref1];

      b. vergeleken met een vergelijkbaar huishouden, waarvoor het inkomen uit enkel een uitkering bestaat
      op grond van [artikel 19][ref2], ontvangt het huishouden een lager bedrag aan tegemoetkomingen met
      toepassing van de [Algemene wet inkomensafhankelijke regelingen][ref3], als gevolg van de verschillende
      afbouwpaden van de dubbele algemene heffingskorting, bedoeld in [artikel 37, tweede lid][ref4], en in
      [artikel 8.9 van de Wet inkomstenbelasting 2001][ref5]; en

      c. de som van het netto-inkomen en de ontvangen tegemoetkomingen met toepassing van de Algemene wet
      inkomensafhankelijke regelingen ligt lager dan bij een vergelijkbaar huishouden waarvoor het inkomen uit een
      uitkering enkel bestaat uit een uitkering op grond van [artikel 19][ref6], vanwege hetgeen genoemd is onder b.

      2 De tegemoetkoming is geen bijstand in de zin van deze wet.

      3 Op de tegemoetkoming is [artikel 46, tweede lid][ref7], van overeenkomstige toepassing.

      4 De Dienst Toeslagen verstrekt aan de Belastingdienst de informatie die nodig is voor de uitvoering van het vijfde
      lid.

      5 De Belastingdienst verstrekt aan het college door tussenkomst van het Inlichtingenbureau de burgerservicenummers
      en de gemeentecodes van de inwoners van de betreffende gemeente die in aanmerking komen voor de tegemoetkoming.

      6 Een besluit tot toekenning van een tegemoetkoming wordt niet ten nadele van het huishouden herzien.

      7 De hoogte van de tegemoetkoming wordt jaarlijks vastgesteld bij ministeriële regeling.

      8 Bij ministeriële regeling kunnen nadere regels worden gesteld voor de goede uitvoering van dit artikel.


