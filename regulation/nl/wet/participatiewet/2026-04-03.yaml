  - number: '6'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. niet-uitkeringsgerechtigde: de persoon jonger dan de pensioengerechtigde leeftijd, die als werkloze
      werkzoekende staat geregistreerd bij het Uitvoeringsinstituut werknemersverzekeringen en die geen recht
      heeft op arbeidsondersteuning op grond van de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1]
      of een uitkering op grond van deze wet of de [Werkloosheidswet][ref2], de
      [Wet inkomensvoorziening oudere werklozen][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5], de
      [Wet werk en inkomen naar arbeidsvermogen][ref6], de [Wet op de arbeidsongeschiktheidsverzekering,][ref7] de
      [Toeslagenwet][ref8], de [Algemene nabestaandenwet][ref9] dan wel een uitkering op grond van een regeling, die met
      deze wetten naar aard en strekking overeenstemt;

      b. arbeidsinschakeling: het verkrijgen van algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van
      een voorziening als bedoeld in de [artikelen 7, eerste lid, onderdeel a][ref10], of [7a, eerste lid][ref11];

      c. sociale activering: het verrichten van onbeloonde maatschappelijk zinvolle activiteiten gericht op
      arbeidsinschakeling of, als arbeidsinschakeling nog niet mogelijk is, op zelfstandige maatschappelijke
      participatie;

      d. startkwalificatie: een diploma van een opleiding als bedoeld in
      [artikel 7.2.2, eerste lid, onderdelen b tot en met e, van de Wet educatie en beroepsonderwijs][ref12] of
      een diploma hoger algemeen voortgezet onderwijs of voorbereidend wetenschappelijk onderwijs, bedoeld in
      [artikel 2.5][ref13] onderscheidenlijk [2.4 van de Wet voortgezet onderwijs 2020][ref14];

      e. doelgroep loonkostensubsidie: personen als bedoeld in de [artikelen 7, eerste lid, onderdeel a][ref15], en
      [7a, eerste lid, onderdeel a, en derde lid][ref16], van wie is vastgesteld dat zij met voltijdse arbeid niet in
      staat zijn tot het verdienen van het wettelijk minimumloon, doch wel mogelijkheden tot arbeidsparticipatie hebben,
      alsmede personen als bedoeld in [artikel 10d, tweede lid][ref17];

      f. dienstbetrekking: een privaatrechtelijke of publiekrechtelijke dienstbetrekking;

      g. loonwaarde: vastgesteld percentage van het wettelijk minimumloon voor de door een persoon, die tot de doelgroep
      loonkostensubsidie behoort, verrichte arbeid in een functie naar evenredigheid van de arbeidsprestatie in die
      functie van een gemiddelde werknemer met een soortgelijke opleiding en ervaring, die niet tot de doelgroep
      loonkostensubsidie behoort;

      h. proefplaats: het verrichten van onbeloonde werkzaamheden bij een werkgever voor een beperkte duur gericht op
      arbeidsinschakeling bij die werkgever.


