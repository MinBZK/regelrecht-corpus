      1 Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de alleenstaande of het gezin
      beschikt of redelijkerwijs kan beschikken. Tot de middelen worden mede gerekend de middelen die ten behoeve van het
      levensonderhoud van de belanghebbende door een niet in de bijstand begrepen persoon worden ontvangen. In elk geval
      behoort tot de middelen de ten aanzien van de alleenstaande of het gezin toepasselijke heffingskorting, bedoeld in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1].

      2 Niet tot de middelen van de belanghebbende worden gerekend:

      a. de middelen die deze ontvangt ten behoeve van het levensonderhoud van een niet in de bijstand begrepen persoon;

      b. kinderbijslag ontvangen ten behoeve van zijn in of buiten Nederland woonachtige kinderen;

      c. de jonggehandicaptenkorting;

      d. tegemoetkomingen in de zin van de [Algemene wet inkomensafhankelijke regelingen][ref2];

      e. eigenwoningbijdrage of een bijzondere bijdrage ontvangen op grond van de
      [Wet bevordering eigenwoningbezit][ref3];

      f. vergoedingen en tegemoetkomingen voor, alsmede de vermindering of teruggave van, loonbelasting of
      inkomstenbelasting en van premies volksverzekeringen op grond van kosten die niet tot de algemeen noodzakelijke
      bestaanskosten behoren, tenzij voor deze kosten bijstand wordt verleend;

      g. vergoedingen en verstrekkingen als bedoeld in
      [artikel 31, eerste lid, onderdeel f en onderdeel g, van de Wet op de loonbelasting 1964][ref4], tenzij voor deze
      vergoedingen en verstrekkingen bijstand wordt verleend;

      h. inkomsten uit arbeid van de tot zijn last komende kinderen, alsmede door hen ontvangen uitkeringen inzake
      werkloosheid en arbeidsongeschiktheid, tenzij het de verlening van bijzondere bijstand betreft voor bijzondere
      noodzakelijke kosten van het bestaan van die kinderen;

      i. rente ontvangen over op grond van [artikel 34, tweede lid, onderdelen b en c][ref5], niet in aanmerking genomen
      vermogen en spaargelden;

      j. een een- of tweemalige premie van ten hoogste € 3.398,00 per kalenderjaar, voor zover dit naar het oordeel van
      het college bijdraagt aan zijn arbeidsinschakeling;

      k. een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste een bij ministeriële regeling
      vast te stellen bedrag per persoon;

      l. bij ministeriële regeling aan te wijzen uitkeringen en vergoedingen voor materiële en immateriële schade;

      m. giften, voor zover de som van deze giften en de bijdragen, bedoeld in [artikel 18, achtste lid][ref6], niet
      meer bedraagt dan € 1.200,00 per kalenderjaar;

      n. inkomsten uit arbeid tot 25 procent van deze inkomsten, met een maximum van € 285,00 per maand, voor zover hij
      algemene bijstand ontvangt, waarbij voor een persoon die de pensioengerechtigde leeftijd nog niet heeft bereikt
      geldt dat die inkomsten gedurende ten hoogste zes maanden niet tot de middelen worden gerekend en dat dit naar het
      oordeel van het college moet bijdragen aan zijn arbeidsinschakeling;

      o. de eenmalige energietoeslag, bedoeld in [artikel 35, vierde lid][ref7] of een tegemoetkoming als bedoeld in
      [artikel 78ee, tweede lid][ref8];

      p. een tegemoetkoming als bedoeld in [artikel 29a van de Algemene nabestaandenwet][ref9];

      q. een tegemoetkoming als bedoeld in [artikel 2:52][ref10] of
      [3:10 van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref11];

      r. inkomsten uit arbeid van een alleenstaande ouder tot 12,5 procent van deze inkomsten, met een maximum van
      € 177,66 per maand, gedurende een aaneengesloten periode van maximaal 30 maanden, voor zover hij algemene bijstand
      ontvangt en onderdeel y, z of aa niet van toepassing is, ingeval:

      1°. hij de volledige zorg heeft voor een tot zijn last komend kind tot 12 jaar,

      2°. de periode van zes maanden, bedoeld in onderdeel n, is verstreken, en

      3°. dit volgens het college bijdraagt aan zijn arbeidsinschakeling;

      s. giften, voor zover zij niet op grond van onderdeel m van de middelen zijn uitgezonderd, en andere dan de in
      onderdeel l bedoelde vergoedingen voor materiële en immateriële schade, voor zover deze giften en vergoedingen naar
      het oordeel van het college in het individuele geval en uit een oogpunt van bijstandsverlening verantwoord zijn;

      t. tegemoetkomingen op grond van [artikel 63a van de Wet werk en inkomen naar arbeidsvermogen](onbekend),
      [artikel 65l van de Wet op de arbeidsongeschiktheidsverzekering](onbekend), [artikel 67i van de Wet
      arbeidsongeschiktheidsverzekering zelfstandigen](onbekend) en [artikel 3:75 van de Wet werk en arbeidsondersteuning
      jonggehandicapten](onbekend);

      u. hetgeen een mantelzorger op grond van het bepaalde bij of krachtens
      [artikel 2.1.6 van de Wet maatschappelijke ondersteuning 2015][ref12] als blijk van waardering ontvangt;

      v. een uitkering tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref13] die de
      belanghebbende jonger dan 21 jaar van zijn ouder of ouders ontvangt, voor zover deze uitkering op grond van
      [artikel 20, derde lid,][ref14] reeds in aanmerking is genomen bij de vaststelling van het recht op bijstand;

      w. de tegemoetkoming, bedoeld in [artikel 78gg][ref15];

      x.

      y. inkomsten uit arbeid van een persoon die medisch urenbeperkt is tot 15 procent van deze inkomsten uit arbeid,
      met een maximum van € 180,19 per maand, voor zover hij algemene bijstand ontvangt, tenzij onderdeel n van
      toepassing is;

      z. inkomsten uit een dienstbetrekking als bedoeld in artikel 10d, eerste of tweede lid, van een persoon die behoort
      tot de doelgroep loonkostensubsidie, tot 15 procent van deze inkomsten uit arbeid, met een maximum van € 180,19
      per maand, gedurende een periode van twaalf maanden nadat de periode van zes maanden, bedoeld in onderdeel n, is
      verstreken, voor zover hij algemene bijstand ontvangt, tenzij onderdeel y van toepassing is;

      aa. inkomsten uit een dienstbetrekking als bedoeld in artikel 10d, eerste of tweede lid, van een persoon die
      behoort tot de doelgroep loonkostensubsidie, tot 15 procent van deze inkomsten uit arbeid, met een maximum van
      € 180,19 per maand, nadat de periode van twaalf maanden, bedoeld in onderdeel z, is verstreken, voor zover hij
      algemene bijstand ontvangt en het college gelet op de in de persoon gelegen omstandigheden een uitbreiding van zijn
      arbeidsomvang niet mogelijk acht.

      3 De middelen worden in aanmerking genomen tot het bedrag dat resteert na aftrek van:

      a. de daarover door de belanghebbende verschuldigde loonbelasting of inkomstenbelasting;

      b. de daarover door de belanghebbende verschuldigde premies volksverzekeringen dan wel een inhouding
      die met een of meer van deze premies overeenkomt alsmede de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 43 van de Zorgverzekeringswet][ref16];

      c. ten laste van de belanghebbende komende verplichte bijdragen ingevolge een pensioenregeling en daarmee
      vergelijkbare regelingen;

      d. andere ten laste van de belanghebbende komende verplichte inhoudingen.

      4 Bij ministeriële regeling worden regels gesteld met betrekking tot het in aanmerking nemen van de aanspraak op
      vakantietoeslag over een inkomen.

      5 Het tweede lid, onderdelen c, j, k, n en r, zijn niet van toepassing op de persoon die jonger is dan 27 jaar, met
      dien verstande dat onderdeel j wel van toepassing is als het gaat om een persoon jonger dan 27 jaar die behoort tot
      de doelgroep loonkostensubsidie.

      6 Onder het redelijkerwijs kunnen beschikken over vermogens- en inkomensbestanddelen, bedoeld in het eerste lid,
      wordt niet verstaan het op verzoek van het college:

      a. indienen door de belanghebbende van een aanvraag tot vervroeging van de ingangsdatum
      van een ouderdomspensioen als bedoeld in [artikel 1 van de Pensioenwet][ref17] of
      [artikel 1 van de Wet verplichte beroepspensioenregeling][ref18], zolang de belanghebbende nog niet de
      pensioengerechtigde leeftijd heeft bereikt; of

      b. benutten van de mogelijkheid om te beschikken over de waarde van een lijfrente overeenkomstig
      [artikel 15, tweede lid, onderdeel b][ref19], alsmede om te beschikken over een waardetoename van die lijfrente.


