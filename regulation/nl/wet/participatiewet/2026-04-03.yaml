  - number: '49'
    text: |-
      In afwijking van [artikel 13, eerste lid, onderdeel g][ref1], kan het college bijzondere bijstand verlenen:

      a. in de vorm van borgtocht, indien het verzoek van de belanghebbende tot verlening van een saneringskrediet
      is afgewezen vanwege diens beperkte mogelijkheden tot terugbetaling en de borgtocht noodzakelijk is om de
      krediettransactie alsnog doorgang te doen vinden door een:

      1°. gemeentelijke kredietbank als bedoeld in de [Wet op het financieel toezicht][ref2];

      2°. een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref3] in Nederland het bedrijf van
      bank mag uitoefenen, indien de gemeente niet is aangesloten bij een gemeentelijke kredietbank dan wel daarmee geen
      relatie onderhoudt;

      b. indien daartoe zeer dringende redenen bestaan en de in onderdeel a genoemde mogelijkheid geen uitkomst biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0020368
