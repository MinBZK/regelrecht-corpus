        artikel: '28'
  - number: '57'
    text: |-
      Indien en zolang er gegronde redenen zijn om aan te nemen dat de belanghebbende zonder hulp niet in staat is tot
      een verantwoorde besteding van zijn bestaansmiddelen, kan het college:

      a. aan de bijstand de verplichting verbinden dat de belanghebbende eraan meewerkt dat het college in naam van de
      belanghebbende noodzakelijke betalingen uit de toegekende bijstand verricht;

      b. de bijstand in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel57
  - number: '58'
    text: |-
      1 Het college van de gemeente die de bijstand heeft verleend vordert de kosten van bijstand terug voor zover
      de bijstand ten onrechte of tot een te hoog bedrag is ontvangen als gevolg van het niet of niet behoorlijk
      nakomen van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], of de verplichtingen, bedoeld in
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2].

      2 Het college van de gemeente die de bijstand heeft verleend kan kosten van bijstand terugvorderen, voorzover de
      bijstand:

      a. anders dan in het eerste lid, ten onrechte of tot een te hoog bedrag is verleend;

      b. in de vorm van geldlening is verleend en de uit de geldlening voortvloeiende verplichtingen niet of niet
      behoorlijk worden nagekomen;

      c. voortvloeit uit gestelde borgtocht;

      d. ingevolge [artikel 52][ref3] bij wijze van voorschot is verleend en nadien is vastgesteld dat geen recht op
      bijstand bestaat;

      e. anderszins onverschuldigd is betaald voorzover de belanghebbende dit redelijkerwijs had kunnen begrijpen, of

      f. anderszins onverschuldigd is betaald, waaronder begrepen dat:

      1°. de belanghebbende naderhand met betrekking tot de periode waarover bijstand is verleend, over in aanmerking te
      nemen middelen als bedoeld in [paragraaf 3.4][ref4] beschikt of kan beschikken;

      2°. bijstand is verleend met een bepaalde bestemming en naderhand door de belanghebbende vergoedingen of
      tegemoetkomingen worden ontvangen met het oog op die bestemming.

      3 Indien een gemeente ingevolge [artikel 42, derde lid][ref5], gehouden is kosten van bijstand over een bepaalde
      periode aan een andere gemeente te vergoeden, geschiedt de terugvordering over die periode, voorzover zij nog niet
      heeft plaatsgehad, door het college van eerstgenoemde gemeente.

      4 Het college is bevoegd tot verrekening van in de voorafgaande zes maanden ontvangen middelen met de algemene
      bijstand.

      5 Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de op de terugvordering betrekking hebbende
      kosten. Loonbelasting en de premies volksverzekeringen waarvoor de gemeente die de bijstand verstrekt krachtens
      de [Wet op de loonbelasting 1964][ref6] inhoudingsplichtige is, kunnen worden teruggevorderd, voor zover deze
      belasting en premies niet verrekend kunnen worden met de door het college af te dragen loonbelasting en premies
      volksverzekeringen.

      6 Terugvordering als bedoeld in het tweede lid, onderdeel e, vindt niet plaats, indien de betreffende kosten zijn
      gemaakt meer dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.

      7 In afwijking van het eerste lid kan het college besluiten van terugvordering of van verdere terugvordering als
      bedoeld in het eerste lid af te zien, indien de persoon van wie de kosten van bijstand worden teruggevorderd:

      a. gedurende tien jaar volledig aan zijn betalingsverplichtingen heeft voldaan;

      b. gedurende tien jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;

      c. gedurende tien jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of

      d. een bedrag, overeenkomend met ten minste 50% van de restsom, in één keer aflost.

      8 Indien daarvoor dringende redenen aanwezig zijn kan het college besluiten geheel of gedeeltelijk van
      terugvordering af te zien.


