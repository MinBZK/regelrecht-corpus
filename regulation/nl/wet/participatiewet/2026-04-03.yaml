  - number: '33'
    text: |-
      1 Indien inkomen in natura in aanmerking wordt genomen wordt de waarde daarvan vastgesteld op het daarvoor door
      belanghebbende opgeofferde bedrag.

      2 Het inkomen uit studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt in
      aanmerking genomen naar het van toepassing zijnde normbedrag voor de kosten van levensonderhoud,
      genoemd in [artikel 3.18 van de Wet studiefinanciering 2000][ref2] en, indien een toeslag als bedoeld in
      [artikel 3.5 van die wet][ref3] is toegekend, het bedrag aan toeslag, genoemd in artikel 3.18 van die wet.

      3 De tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref4] wordt in aanmerking genomen naar
      het normbedrag voor de basistoelage, bedoeld in [artikel 4.3 van die wet][ref5].

      4 Indien de belanghebbende de woning bewoont met een of meer huurders, onderhuurders of kostgangers, worden de
      daaruit voortvloeiende lagere algemene noodzakelijke kosten van het bestaan als inkomen in aanmerking genomen
      indien daarmee nog geen rekening is gehouden bij de vaststelling van de norm, bedoeld in [artikel 22a][ref6].

      5 Indien de alleenstaande, de alleenstaande ouder of een van de echtgenoten de pensioengerechtigde leeftijd heeft
      bereikt, wordt voor de vaststelling van de hoogte van de algemene bijstand een in de vorm van een periodieke
      uitkering ontvangen particuliere oudedagsvoorziening buiten beschouwing gelaten tot een bedrag van:

      a. voor een alleenstaande en een alleenstaande ouder: € 26,50 per kalendermaand;

      b. voor de gehuwden tezamen: € 53,00 per kalendermaand.

      6 Indien de belanghebbende onbetaalde mantelzorg verleent, wordt voor de vaststelling van de hoogte van de algemene
      bijstand het verlenen van deze zorg niet beschouwd als op loon te waarderen arbeid.


