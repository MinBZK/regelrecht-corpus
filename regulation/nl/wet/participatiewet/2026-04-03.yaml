  - number: '48'
    text: |-
      1 Tenzij in deze wet anders is bepaald, wordt de bijstand verleend om niet.

      2 Bijstand kan worden verleend in de vorm van een geldlening of borgtocht indien:

      a. redelijkerwijs kan worden aangenomen dat de belanghebbende op korte termijn over voldoende middelen zal
      beschikken om over de betreffende periode in de noodzakelijke kosten van het bestaan te voorzien;

      b. de noodzaak tot bijstandsverlening het gevolg is van een tekortschietend besef van verantwoordelijkheid voor de
      voorziening in het bestaan;

      c. de aanvraag een door de belanghebbende te betalen waarborgsom betreft;

      d. het bijstand ter gedeeltelijke of volledige aflossing van een schuldenlast betreft.

      3 Het college kan aan het verlenen van bijstand in de vorm van een geldlening verplichtingen verbinden
      die zijn gericht op meerdere zekerheid voor de nakoming van de aan deze bijstand verbonden rente- en
      aflossingsverplichtingen.

      4 Indien de persoon aan wie bijstand in de vorm van een geldlening wordt verleend algemene bijstand of een uitkering
      op grond van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] of het
      [Besluit bijstandverlening zelfstandigen 2004][ref3] ontvangt, is het college bevoegd tot verrekening van die
      geldlening met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0015711
