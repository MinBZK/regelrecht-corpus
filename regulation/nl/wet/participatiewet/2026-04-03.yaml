  - number: '76'
    text: |-
      1 Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      vaststelt, aan het college, nadat het college gedurende acht weken in de gelegenheid is gesteld zijn zienswijze
      naar voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele
      gevallen.

      2 In de aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft
      gebracht met de aanwijzing.

      3 Onze Minister schort de betaling van de uitkering, bedoeld in [artikel 69, eerste lid][ref1],
      gedurende ten minste drie maanden op, indien Onze Minister met betrekking tot de rechtmatige
      uitvoering van deze wet ernstige tekortkomingen heeft vastgesteld als bedoeld in het eerste lid, in
      [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2] en
      in [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3],
      totdat:

      a. hij heeft vastgesteld aan de hand van de zienswijze van het college dat de ernstige tekortkomingen zijn
      opgeheven;

      b. hij heeft vastgesteld, dat het college aan de in de aanwijzing opgenomen verplichtingen heeft voldaan;

      c. hij heeft geoordeeld, dat het college na afloop van de termijn, bedoeld in het tweede lid, geen of onvoldoende
      gevolg heeft gegeven aan de aanwijzing.

      4 Onze Minister stelt, indien hij van oordeel is, dat het college, na afloop van de termijn, bedoeld in
      het tweede lid, geen of onvoldoende gevolg heeft gegeven aan de aanwijzing, bedoeld in het eerste lid, in
      [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4], in
      [artikel 52 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5]
      of in [artikel 87 van de Wet investeren in jongeren][ref6], de uitkering, bedoeld in
      [artikel 69, eerste lid][ref7], voor het jaar volgend op het jaar waarin de termijn afloopt, 1 procent lager vast.

      5 Onze Minister stelt, indien hij van oordeel is, dat het college twaalf maanden na afloop van de termijn, bedoeld
      in het tweede lid, nog geen of onvoldoende gevolg heeft gegeven aan de aanwijzing, bedoeld in het derde lid, de
      uitkering, bedoeld in [artikel 69, eerste lid][ref8], voor het tweede jaar volgend op het jaar waarin de termijn
      afloopt en de daaropvolgende jaren, telkens ten hoogste 3 procent lager vast.


