    text: |-
      1 In deze paragraaf wordt onder netto minimumloon verstaan het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref1], verhoogd met de
      aanspraak op vakantiebijslag waarop een werknemer op grond van [artikel 15 van die wet][ref2] over dat minimumloon
      ten minste aanspraak kan maken, na aftrek van de daarvan in te houden loonbelasting en premies volksverzekeringen.

      2 De in het eerste lid bedoelde loonbelasting en premies volksverzekeringen worden berekend voor een werknemer
      die de pensioengerechtigde leeftijd nog niet heeft bereikt rekening houdend met uitsluitend 157,5% van de algemene
      heffingskorting, bedoeld in [artikel 22 van de Wet op de loonbelasting 1964][ref3], over het minimumloon en de
      aanspraak op vakantiebijslag daarover.

      3 In deze paragraaf wordt onder netto minimumjeugdloon verstaan: het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref4], waarop
      het toepasselijke percentage, genoemd in [artikel 2, eerste lid, van het Besluit minimumjeugdloon][ref5],
      is toegepast, verhoogd met de aanspraak op vakantiebijslag waarop een werknemer op grond van
      [artikel 15 van die wet][ref6] over dat minimumloon ten minste aanspraak kan maken en na aftrek van de daarvan in
      te houden loonbelasting en premies volksverzekeringen.

      4 Onder consumentenprijsindex wordt in deze afdeling verstaan hetgeen daaronder in
      [artikel 13, zevende lid, van de Algemene Kinderbijslagwet][ref7] wordt verstaan.

      5 Met ingang van 1 januari 2028 wordt het in het tweede lid genoemde percentage twee keer per kalenderjaar, op
      1 januari en 1 juli, verlaagd met 2,5 procentpunt. Het gewijzigde percentage wordt door of namens Onze Minister
      medegedeeld in de Staatscourant. Dit lid vervalt op het moment dat het in het tweede lid genoemde percentage de
      waarde van 100 heeft bereikt.


