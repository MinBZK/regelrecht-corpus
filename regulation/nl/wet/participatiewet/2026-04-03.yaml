    text: |-
      1 Een besluit van het college tot verlening van algemene bijstand aan een persoon als bedoeld in
      [artikel 47a, eerste lid][ref1], dat is genomen vóór de datum van inwerkingtreding van [paragraaf 5.4][ref2],
      geldt met ingang van die datum als genomen door de Sociale verzekeringsbank op grond van paragraaf 5.4.

      2 De toepassing van [paragraaf 6.5][ref3] in relatie tot besluiten als bedoeld in het eerste lid gaat na de datum
      van inwerkingtreding van [paragraaf 5.4][ref4] over op de Sociale verzekeringsbank.

      3 Een tot het college gericht verzoek door een persoon als bedoeld in [artikel 47a, eerste lid][ref5], om een
      besluit te nemen, waarop op de datum van inwerkingtreding van paragraaf 5.4 nog niet is beslist, geldt met ingang
      van die datum als te zijn gericht tot de Sociale verzekeringsbank.


