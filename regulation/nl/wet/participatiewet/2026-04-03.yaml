        artikel: '401'
  - number: 62f
    text: |-
      Kosten van bijstand kunnen door het college worden verhaald op:

      a. degene aan wie de persoon die bijstand ontvangt of heeft ontvangen een schenking heeft gedaan voor zover bij het
      besluit op de bijstandsaanvraag met de geschonken middelen rekening zou zijn gehouden indien de schenking niet had
      plaatsgevonden, tenzij gelet op alle omstandigheden aannemelijk is dat de schenker ten tijde van de schenking de
      noodzaak van bijstandsverlening redelijkerwijs niet heeft kunnen voorzien;

      b. de nalatenschap van de persoon indien:

      1°. aan die persoon ten onrechte bijstand is verleend en voor zover voor het overlijden nog geen terugvordering
      heeft plaatsgevonden;

      2°. bijstand is verleend in de vorm van geldlening of als gevolg van borgtocht.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel62f
  - number: 62g
    text: |-
      1 Het besluit tot verhaal op grond van deze paragraaf, anders dan met toepassing van [artikel 62b][ref1], wordt
      door het college aan degene op wie verhaal wordt gezocht medegedeeld. Bij verhaal op de nalatenschap kan de
      mededeling worden gericht tot de langstlevende echtgenoot of een der erfgenamen die geacht kan worden bij de
      afwikkeling van de nalatenschap te zijn betrokken.

      2 Indien de belanghebbende niet uit eigen beweging bereid is de verlangde gelden aan het college te betalen dan wel
      niet of niet tijdig tot betaling daarvan overgaat, kan het college overgaan tot verhaal in rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel62b
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel62g
