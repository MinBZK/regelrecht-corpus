      1 De Sociale verzekeringsbank heeft tot taak het verlenen van algemene bijstand in de vorm van een aanvullende
      inkomensvoorziening ouderen aan:

      a. alleenstaanden en alleenstaande ouders die de pensioengerechtigde leeftijd hebben bereikt;

      b. gehuwden, van wie beide echtgenoten de pensioengerechtigde leeftijd hebben bereikt dan wel van wie één
      echtgenoot de pensioengerechtigde leeftijd heeft bereikt;

      hier te lande die in zodanige omstandigheden verkeren of dreigen te geraken dat zij niet over de middelen
      beschikken om in de noodzakelijke kosten van het bestaan te voorzien.

      2 De [artikelen 1 tot en met 6][ref1], [hoofdstuk 2][ref2], met uitzondering van [artikel 18][ref3],
      [hoofdstuk 3][ref4], de [paragrafen 5.1][ref5] en [5.2][ref6], [hoofdstuk 6][ref7] en de [artikelen 79][ref8],
      [80][ref9] en [81][ref10] zijn van toepassing op de uitvoering van de taak, bedoeld in het eerste lid, door de
      Sociale verzekeringsbank, tenzij in deze paragraaf anders is bepaald.


