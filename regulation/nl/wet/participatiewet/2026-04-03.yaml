  - number: 78f
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verlening van bijstand
      en bijstand ter voorziening in de behoefte aan bedrijfskapitaal op grond van deze wet aan zelfstandigen en aan
      personen die algemene bijstand ontvangen en voornemens zijn een bedrijf of zelfstandig beroep te beginnen en zich
      in verband hiermee niet beschikbaar stellen voor arbeid in dienstbetrekking gedurende de voorbereidingsperiode van
      ten hoogste twaalf maanden, waarbij kan worden afgeweken van de [artikelen 9][ref1], [10 tot en met 10h][ref2],
      [11][ref3], [17][ref4], [31][ref5], [32][ref6], [34][ref7], [34a][ref8], [34b][ref9], [35][ref10], [40][ref11],
      [41][ref12], [43a][ref13], [44][ref14], [44a][ref15], [45][ref16], [58][ref17], [69][ref18], [77][ref19],
      [83][ref20] en de [paragrafen 4.2][ref21], [6.1][ref22] en [7.1][ref23].


