  - number: '19'
    text: |-
      1 Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op algemene bijstand indien:

      a. het in aanmerking te nemen inkomen lager is dan de bijstandsnorm; en

      b. er geen in aanmerking te nemen vermogen is.

      2 De hoogte van de algemene bijstand is het verschil tussen het inkomen en de bijstandsnorm.

      3 In de algemene bijstand is een vakantietoeslag begrepen ter hoogte van 4,8 procent  van die bijstand.

      4 De algemene bijstand wordt verhoogd met de loonbelasting en premies volksverzekeringen waarvoor de gemeente die
      de bijstand verleent, krachtens de [Wet op de loonbelasting 1964][ref2] inhoudingsplichtige is.


