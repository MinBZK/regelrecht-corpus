    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. bijstand: algemene en bijzondere bijstand;

      b. algemene bijstand: de bijstand ter voorziening in de algemeen noodzakelijke kosten van het bestaan;

      c. bijstandsnorm: de op grond van [paragraaf 3.2][ref1], op de belanghebbende van toepassing zijnde norm,
      verminderd met de op grond van [paragraaf 3.3][ref2], door het college vastgestelde verlaging;

      d. bijzondere bijstand: de bijstand, bedoeld in [artikel 35][ref3] en de individuele inkomenstoeslag, bedoeld
      in [artikel 36][ref4];

      e. voorliggende voorziening: elke voorziening buiten deze wet waarop de belanghebbende of het gezin aanspraak kan
      maken, dan wel een beroep kan doen, ter verwerving van middelen of ter bekostiging van specifieke uitgaven.


