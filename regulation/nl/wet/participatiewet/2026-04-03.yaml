  - number: '68'
    text: |-
      1 Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in de [artikelen 64][ref1] en
      [67][ref2] bedoelde instanties wordt, indien daartoe bevoegd, gebruik gemaakt van het burgerservicenummer.

      2 Derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen,
      gebruiken het burgerservicenummer slechts voor zover dat noodzakelijk is voor het verrichten van werkzaamheden die
      in het kader van de voorzieningen, bedoeld in de [artikelen 7, eerste lid, onderdeel a, en zevende lid][ref3], en
      [7a, eerste, lid][ref4], en artikel 7a tweede en derde lid, worden uitgevoerd.


