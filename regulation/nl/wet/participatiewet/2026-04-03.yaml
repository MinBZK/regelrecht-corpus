      1 Voor belanghebbenden jonger dan 21 jaar zonder ten laste komende kinderen is de norm per kalendermaand, indien
      het betreft:

      a. een alleenstaande van 18, 19 of 20 jaar: € 345,99;

      b. gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn: € 691,98;

      c. gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder, zonder
      kostendelende medebewoners: € 1.347,06.

      2 Voor belanghebbenden jonger dan 21 jaar met een of meer ten laste komende kinderen is de norm per kalendermaand,
      indien het betreft:

      a. een alleenstaande ouder van 18, 19 of 20 jaar: € 345,99;

      b. gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn: € 1.092,41;

      c. gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder, zonder
      kostendelende medebewoners: € 1.747,49.

      3 Voor belanghebbenden van 18, 19 of 20 jaar verhoogt het college de norm met een bedrag van € 746,45, indien die
      belanghebbende voor de kosten van levensonderhoud geen beroep kan doen op zijn ouders, omdat:

      a. de middelen van de ouders daartoe niet toereikend zijn; of

      b. deze persoon redelijkerwijs het onderhoudsrecht jegens de ouders niet te gelde kan maken.

      4 De norm, bedoeld in het derde lid, in combinatie met de normen, bedoeld in het eerste en tweede lid, is
      niet hoger dan de norm, bedoeld in artikel 21, die geldt voor een 21-jarige of ouder, doch jonger dan de
      pensioengerechtigde leeftijd, in een vergelijkbare situatie.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel20
  - number: '21'
    text: |-
      Voor belanghebbenden van 21 jaar of ouder doch jonger dan de pensioengerechtigde leeftijd is de norm per
      kalendermaand, indien het betreft:

      a. een alleenstaande of een alleenstaande ouder zonder kostendelende medebewoners: € 1.401,50;

      b. gehuwden waarvan beide echtgenoten jonger zijn dan de pensioengerechtigde leeftijd, zonder kostendelende
      medebewoners: € 2.002,13.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel21
  - number: '22'
    text: |-
      Voor belanghebbenden die de pensioengerechtigde leeftijd hebben bereikt is de norm per kalendermaand, indien het
      betreft:

      a. een alleenstaande of een alleenstaande ouder zonder kostendelende medebewoners: € 1.564,69;

      b. gehuwden waarvan beide echtgenoten de pensioengerechtigde leeftijd hebben bereikt, zonder kostendelende
      medebewoners: € 2.144,16;

      c. gehuwden waarvan een echtgenoot de pensioengerechtigde leeftijd heeft bereikt en de andere echtgenoot 21 jaar of
      ouder, doch de pensioengerechtigde leeftijd nog niet heeft bereikt, zonder kostendelende medebewoners: € 2.144,16.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel22
  - number: 22a
    text: |-
      1 Indien de belanghebbende van 21 jaar of ouder een of meer kostendelende medebewoners heeft, is de norm per
      kalendermaand voor de belanghebbende:

      Hierbij staat:

        - A voor het aantal kostendelende medebewoners plus de belanghebbende en zijn echtgenoot van 21 jaar of ouder
      indien hij gehuwd is; en
        - B voor de norm, bedoeld in artikel: a. [21, onderdeel b][ref1], indien de belanghebbende jonger dan
      de pensioengerechtigde leeftijd is; b. [22, onderdeel c][ref2], indien de belanghebbende jonger dan
      de pensioengerechtigde leeftijd is en zijn echtgenoot de pensioengerechtigde leeftijd heeft bereikt; c.
      [ 22, onderdeel b][ref3], indien de belanghebbende de pensioengerechtigde leeftijd heeft bereikt.

      2 De norm voor gehuwden, op wie het eerste lid van toepassing is, is gelijk aan de som van de normen, bedoeld in
      dat lid, die voor ieder van de rechthebbende echtgenoten afzonderlijk van toepassing is.

      3 Voor rechthebbende gehuwden, waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder
      is, met een of meer kostendelende medebewoners, is de norm per kalendermaand:

      a. indien ze een of meer ten laste komende kinderen hebben: € 746,42 plus de op basis van dit artikel van
      toepassing zijnde norm voor de echtgenoot van 21 jaar of ouder,

      b. indien ze geen ten laste komende kinderen hebben: € 345,99 plus de op basis van dit artikel van toepassing
      zijnde norm voor de echtgenoot van 21 jaar of ouder.

      4 Dit artikel is niet van toepassing op de belanghebbende die voor het leveren van mantelzorg bij een intensieve
      zorgbehoefte tijdelijk gebruikmaakt van een hoofdverblijf elders.


