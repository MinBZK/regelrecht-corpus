  - number: 76a
    text: Met het toezicht op de naleving van deze wet zijn belast de bij besluit van het college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel76a
  - number: '77'
    text: |-
      1 Het college legt verantwoording af aan Onze Minister over de uitvoering van deze wet, op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].

      2 Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.

      3 Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '78'
    text: |-
      1 Het college verstrekt desgevraagd aan Onze Minister gegevens en inlichtingen die hij voor de statistiek,
      informatievoorziening en beleidsvorming met betrekking tot deze wet nodig heeft.

      2 De gegevens en inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in
      [artikel 77][ref1], worden kosteloos verstrekt.

      3 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de soort informatie die het college
      verstrekt en de wijze waarop het college de gegevens en inlichtingen verzamelt en verstrekt, waarbij kan worden
      bepaald, dat categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel77
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel78
