  - number: 43a
    text: |-
      1 Indien na het eindigen van de algemene bijstand binnen twaalf maanden een nieuwe aanvraag wordt gedaan, kan het
      college de gegevens die bij hem berusten in verband met de eerdere bijstandsverlening gebruiken, indien dit leidt
      tot een voor de belanghebbende minder belastende aanvraag.

      2 Het college verifieert de juistheid en actualiteit van de gegevens, bedoeld in het eerste lid, in de beschikbare
      bronnen en zo nodig bij de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel43a
  - number: '44'
    text: |-
      1 Indien door het college is vastgesteld dat recht op bijstand bestaat, wordt de bijstand toegekend vanaf de dag
      waarop dit recht is ontstaan, voorzover deze dag niet ligt voor de dag waarop de belanghebbende zich heeft gemeld
      om bijstand aan te vragen.

      2 De belanghebbende heeft zich gemeld als zijn naam, adres en woonplaats bij het Uitvoeringsinstituut
      werknemersverzekeringen zijn geregistreerd, en:

      a. indien [artikel 41, vierde lid][ref1], van toepassing is: hij door het Uitvoeringsinstituut
      werknemersverzekeringen op de hoogte is gesteld van de verplichting, bedoeld in
      [artikel 9, eerste lid, onderdeel a][ref2], en de inhoud van artikel 41;

      b. indien [artikel 41, vierde lid][ref3], niet van toepassing is: hij in staat is gesteld zijn aanvraag in
      te dienen bij het Uitvoeringsinstituut werknemersverzekeringen, als het een aanvraag betreft als bedoeld in
      artikel 41, eerste of derde lid, of bij het college, als het een aanvraag betreft als bedoeld in artikel 41, tweede
      lid.

      3 Indien de belanghebbende de aanvraag niet zo spoedig mogelijk indient nadat hij zich heeft gemeld en hem dit te
      verwijten valt, kan het college, in afwijking van het eerste lid, besluiten dat de bijstand wordt toegekend vanaf
      de dag dat de aanvraag is ingediend.

      4 Bij een besluit tot toekenning van algemene bijstand voor zover dat ziet op personen van 18 jaar of ouder, doch
      jonger dan 27 jaar, wordt, in een bijlage, een plan van aanpak opgenomen als bedoeld in [artikel 44a][ref4].

      5 In afwijking van het eerste lid kan het college bijstand toekennen vanaf de dag die maximaal drie maanden gelegen
      is voor de dag waarop de belanghebbende zich heeft gemeld, indien individuele omstandigheden hiertoe noodzaken.


