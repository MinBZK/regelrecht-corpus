  - number: '14'
    text: |-
      In ieder geval worden niet tot de noodzakelijke kosten van het bestaan gerekend kosten met betrekking tot:

      a. de voldoening aan alimentatieverplichtingen;

      b. de betaling van een boete;

      c. geleden of toegebrachte schade;

      d. vrijwillige premiebetaling in het kader van een publiekrechtelijke verzekering;

      e. kosten van medische handelingen en verrichtingen die gerekend kunnen worden tot de ontwikkelingsgeneeskunde
      als bedoeld in de [Wet op bijzondere medische verrichtingen][ref1], of wanneer zodanige medische behandelingen en
      verrichtingen buiten Nederland plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008974
    url: https://wetten.overheid.nl/BWBR0015703/2026-04-03#Artikel14
