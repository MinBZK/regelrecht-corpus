  - number: '37.1'
    text: |-
      In deze paragraaf wordt onder netto minimumloon verstaan het minimumloon per maand, genoemd in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1], verhoogd
      met de aanspraak op vakantiebijslag waarop een werknemer op grond van [artikel 15 van die wet][ref2]
      over dat minimumloon ten minste aanspraak kan maken, na aftrek van de daarvan in te houden loonbelasting,
      premies volksverzekeringen, premies werknemersverzekeringen en de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 41 van de Zorgverzekeringswet][ref3], en vermeerderd met de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '37.2'
    text: |-
      De in het eerste lid bedoelde loonbelasting en premies volksverzekeringen worden berekend voor een werknemer,
      jonger dan 65 jaar, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref1], over het minimumloon en de aanspraak op vakantiebijslag
      daarover, vermeerderd met de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2], en verminderd
      met de premies werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '37.3'
    text: |-
      Indien ingevolge een van de socialeverzekeringswetten een premie wordt ingehouden waarvan het percentage per
      bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij
      ministeriële regeling voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel37
  - number: '37.4'
    text: |-
      Onder prijsindexcijfer van de gezinsconsumptie, wordt in deze afdeling verstaan hetgeen daaronder in
      [artikel 13, zesde lid, van de Algemene Kinderbijslagwet][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel13
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '13'
  - number: '38.1'
    text: 'Met ingang van de dag waarop het netto minimumloon wijzigt, worden herzien:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
  - number: 38.1.a
    text: |-
      met het percentage van deze wijziging, de normen, genoemd in de [artikelen 20][ref1] en [21][ref2], en het bedrag,
      genoemd in [artikel 25, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
    references:
      - id: ref1
