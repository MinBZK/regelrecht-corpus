        hoofdstuk: '6'
  - number: 36.4.b
    text: voor wie bij de laatste arbeidsongeschiktheidsbeoordeling is afgezien van het arbeidsdeskundig onderzoek, en;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: 36.4.c
    text: die voldoet aan het eerste lid, onderdelen a, b, voorzover het inkomsten uit arbeid betreft, c, en d.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: '36.5'
    text: |-
      De langdurigheidstoeslag bedraagt voor gehuwden € 454,00 , voor een alleenstaande ouder  € 408,00  en voor een
      alleenstaande  € 318,00  per jaar.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: '36.6'
    text: |-
      De [artikelen 8, eerste lid, onderdeel b][ref1], [13, eerste lid, onderdeel a, en derde lid][ref2],
      [18, tweede en derde lid][ref3], [40][ref4], [46, eerste, derde, vierde en vijfde lid][ref5], [54][ref6],
      [paragraaf 6.4][ref7] en [6.5][ref8], alsmede [artikel 63][ref9] zijn van overeenkomstige toepassing.


