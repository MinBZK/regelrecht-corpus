        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 38.1.b
    text: |-
      het percentage, genoemd in [artikel 19, derde lid][ref1], zodanig dat dit gelijk is aan de procentuele
      verhouding tussen de netto aanspraak op de minimum vakantiebijslag over het minimumloon en het netto
      minimumloon. Onder netto aanspraak op de minimum vakantiebijslag wordt verstaan het verschil tussen
      het netto minimumloon en het netto minimumloon zoals dat overeenkomstig [artikel 37, eerste lid][ref2],
      zou zijn berekend zonder rekening te houden met de aanspraak op vakantiebijslag, bedoeld in
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '38.2'
    text: |-
      Met ingang van de dag waarop het netto minimumloon, zonder de daarin begrepen aanspraak op vakantiebijslag,
      wijzigt, worden de bedragen, genoemd in [artikel 31, tweede lid, onderdelen j en o][ref1], herzien met het
      percentage van deze wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '38.3'
    text: |-
      Met ingang van de dag waarop het netto ouderdomspensioen en de daarbij behorende vakantie-uitkering ingevolge de
      [Algemene Ouderdomswet][ref1] wijzigen, worden de normen, genoemd in [artikel 22][ref2], herzien met het percentage
      van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel22
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '38.4'
    text: |-
      Met ingang van de dag waarop het netto minimumloon wijzigt, worden de normen, genoemd in
      [artikel 23, eerste lid][ref1], herzien met het percentage van deze wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '38.5'
    text: |-
      De bedragen, genoemd in [artikel 23, tweede lid][ref1], worden herzien, indien het drempelinkomen, bedoeld in de
      [Wet op de zorgtoeslag][ref2], wordt aangepast, de percentages, bedoeld in [artikel 2 van die wet][ref3], worden
      gewijzigd of het bedrag van de standaardpremie op grond van [artikel 4 van die wet][ref4] op een ander bedrag wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018451
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0018451
      - id: ref3
        bwb_id: BWBR0018451
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0018451
        artikel: '4'
  - number: '38.6'
    text: |-
      Van de herziene normen en bedragen en van de dag waarop de herziening plaatsvindt wordt door Onze Minister
      mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel38
  - number: '39.1'
    text: |-
      Met ingang van de dag waarop de som wijzigt van de budgetten voor levensonderhoud, genoemd in
      [artikel 3.2, eerste lid, onderdeel a, van de Wet studiefinanciering 2000][ref1] en het bedrag dat op grond
      van [artikel 3.29, eerste lid, van die wet][ref2] wordt verstrekt aan een studerende die ten onrechte over een
      kalendermaand geen reisvoorziening ontvangt, worden de in [artikel 33, tweede lid][ref3], genoemde bedragen zodanig
      herzien dat deze gelijk zijn aan deze som.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel33
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '39.2'
    text: |-
      Met ingang van 1 januari van elk kalenderjaar worden de in [artikel 33, vijfde lid][ref1],
      [artikel 34, tweede lid, onderdeel d, en derde lid][ref2], [artikel 35, tweede lid][ref3], en
      [artikel 36, vijfde lid][ref4], genoemde bedragen herzien met de procentuele stijging van het prijsindexcijfer voor
      de gezinsconsumptie.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel35
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel36
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '39.3'
    text: |-
      Van de herziene bedragen en van de dag waarop de herziening plaatsvindt wordt door Onze Minister mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel39
  - number: '40.1'
    text: |-
      Het recht op bijstand bestaat jegens het college van de gemeente waar de belanghebbende woonplaats heeft
      als bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2]. Bij
      algemene maatregel van bestuur kan worden bepaald dat bijstand aan een belanghebbende zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] wordt verleend door het college van
      een bij die maatregel aan te wijzen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '40.2'
    text: |-
      Het college verbindt aan de verlening van bijstand aan een belanghebbende zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] de verplichting dat hij aangifte
      doet van een door hen ter beschikking gesteld briefadres als bedoeld in [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '40.3'
    text: |-
      Indien bij de beoordeling van het recht op bijstand blijkt dat het door een belanghebbende verstrekte adres van
      hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven, schort het college het recht op bijstand op.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
  - number: '40.4'
    text: 'Geen opschorting vindt plaats indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
  - number: 40.4.a
    text: de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de bijstand;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
  - number: 40.4.b
    text: de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
  - number: 40.4.c
    text: daarvoor naar het oordeel van het college dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
  - number: '40.5'
    text: |-
      Het college doet schriftelijk mededeling van de opschorting, bedoeld in het derde lid, aan de belanghebbende
      en stelt hem daarbij in de gelegenheid de in de gemeentelijke basisadministratie persoonsgegevens opgenomen
      adresgegevens te doen aanpassen binnen een door het college te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
  - number: '40.6'
    text: |-
      De opschorting wordt beëindigd zodra het aan het college gebleken is dat de afwijking niet meer bestaat. Indien
      de afwijking ook na de krachtens het vijfde lid gestelde termijn nog bestaat, herziet het college het besluit
      tot toekenning van de bijstand of trekt het dit in met ingang van de eerste dag waarover het recht op bijstand
      is opgeschort.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel40
  - number: '41.1'
    text: |-
      De aanvraag is gericht tot het college en wordt overeenkomstig
      [artikel 28 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] ingediend bij de Centrale
      organisatie werk en inkomen. Na de overdracht van de aanvraag door de Centrale organisatie werk en inkomen aan het
      college ingevolge [artikel 28, derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt
      de aanvraag verder behandeld door het college.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
  - number: '41.2'
    text: |-
      Indien het een aanvraag betreft van andere dan algemene bijstand dan wel van algemene bijstand aan een persoon
      die in een inrichting verblijft, een persoon van 65 jaar of ouder, of een persoon zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] wordt, in afwijking van het eerste
      lid, de aanvraag ingediend bij het college.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '41.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat ook andere aanvragen dan in het tweede lid
      bedoeld, in afwijking van het eerste lid, bij het college worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel41
  - number: '41.4'
    text: |-
      De gemeenteraad kan, in overeenstemming met de Centrale organisatie werk en inkomen, bij verordening categorieën
      van aanvragen vaststellen die, in afwijking van het tweede lid, bij de Centrale organisatie werk en inkomen worden
      ingediend.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel41
  - number: '42.1'
    text: |-
      Indien doorzending van de aanvraag naar het college van een andere gemeente heeft plaatsgevonden en dit van
      oordeel is dat het evenmin de aanvraag dient te behandelen, terwijl geen zekerheid kan worden verkregen over de
      in [artikel 40][ref1] bedoelde woonplaats, draagt het college dat de doorgezonden aanvraag heeft ontvangen er zorg
      voor dat het geschil aanhangig wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '42.2'
    text: |-
      In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      bijstand jegens het college van de gemeente waar de belanghebbende werkelijk verblijft.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel42
  - number: '42.3'
    text: |-
      Kosten van bijstand verleend ingevolge het tweede lid worden vergoed door het college van de gemeente waarvan de
      taak is waargenomen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel42
  - number: '43.1'
    text: |-
      Het college stelt het recht op bijstand op schriftelijke aanvraag of, indien een schriftelijke aanvraag niet
      mogelijk is, ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel43
  - number: '43.2'
    text: |-
      De bijstand wordt door de echtgenoten gezamenlijk aangevraagd dan wel door een van hen met schriftelijke
      toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel43
  - number: '43.3'
    text: |-
      Het college stelt het recht op bijstand ambtshalve vast indien een van de echtgenoten niet met de aanvraag instemt,
      doch bijstandsverlening, gezien de belangen van de overige gezinsleden, niettemin geboden is.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel43
  - number: '44.1'
    text: |-
      Indien door het college is vastgesteld dat recht op bijstand bestaat, wordt de bijstand toegekend vanaf de dag
      waarop dit recht is ontstaan, voorzover deze dag niet ligt voor de dag waarop de belanghebbende zich heeft gemeld
      om bijstand aan te vragen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel44
  - number: '44.2'
    text: |-
      De belanghebbende heeft zich gemeld als zijn naam, adres en woonplaats zijn geregistreerd en hij in staat is
      gesteld zijn aanvraag in te dienen bij de Centrale organisatie werk en inkomen, als het een aanvraag betreft als
      bedoeld in [artikel 41, eerste of vierde lid][ref1], of bij het college, als het een aanvraag betreft als bedoeld
      in [artikel 41, tweede of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '44.3'
    text: |-
      Indien de belanghebbende de aanvraag niet zo spoedig mogelijk indient nadat hij zich heeft gemeld en hem dit te
      verwijten valt, kan het college, in afwijking van het eerste lid, besluiten dat de bijstand wordt toegekend vanaf
      de dag dat de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel44
  - number: '45.1'
    text: |-
      De algemene bijstand wordt per kalendermaand vastgesteld en betaald. In afwijking van de eerste volzin wordt de
      vakantietoeslag, voorzover niet reeds eerder betaald, jaarlijks betaald in de maand juni over de aan die maand
      voorafgaande twaalf maanden of zo veel eerder als de vakantietoeslag over deze periode vaststaat, dan wel binnen
      drie maanden volgend op de maand waarin de algemene bijstand is beëindigd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel45
  - number: '45.2'
    text: |-
      Het college kan op grond van [artikel 18, eerste lid][ref1], besluiten de algemene bijstand over een andere periode
      als bedoeld in het eerste lid vast te stellen of te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '45.3'
    text: |-
      De algemene bijstand wordt vastgesteld over het deel van de kalendermaand waarover recht op bijstand bestaat,
      indien de alleenstaande of het gezin voorafgaand aan of volgend op de bijstandsverlening:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel45
  - number: 45.3.a
    text: gedurende een periode van ten minste 30 dagen geen algemene bijstand ontvangt; of
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel45
  - number: 45.3.b
    text: anderszins geen recht op algemene bijstand heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel45
  - number: '45.4'
    text: |-
      De algemene bijstand wordt uitbetaald aan ieder van de rechthebbende echtgenoten voor de helft dan wel op hun
      gezamenlijk verzoek aan een van hen voor het geheel.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel45
  - number: '45.5'
    text: |-
      Ingeval van overlijden van een van de echtgenoten, van de alleenstaande ouder, van het laatste ten laste komende
      kind van gehuwden waarvan de leeftijd van een echtgenoot of beide echtgenoten 18, 19 of 20 jaar is, of van het
      laatste ten laste komende kind van de alleenstaande ouder, wordt de algemene bijstand tot en met één maand na de
      dag van het overlijden, betaald naar de op het moment van overlijden van toepassing zijnde bijstandsnorm aan de
      andere echtgenoot, de ten laste komende kinderen, onderscheidenlijk de gewezen alleenstaande ouder.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel45
  - number: '46.1'
    text: De bijstand is niet vatbaar voor vervreemding of verpanding.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel46
  - number: '46.2'
    text: Bijzondere bijstand is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel46
  - number: '46.3'
    text: |-
      Beslag op algemene bijstand is slechts geldig voorzover de belanghebbende blijft beschikken over een inkomen gelijk
      aan de beslagvrije voet bedoeld in [artikel 475d van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '46.4'
    text: |-
      Een machtiging tot het in ontvangst nemen van de bijstand, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel46
  - number: '46.5'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel46
  - number: '47'
    text: |-
      De gemeenteraad stelt bij verordening regels over de wijze waarop de personen, bedoeld in
      [artikel 7, eerste lid][ref1], of hun vertegenwoordigers worden betrokken bij de uitvoering van deze wet, waarbij
      in ieder geval wordt geregeld de wijze waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 47.a
    text: periodiek overleg wordt gevoerd met deze personen of hun vertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel47
  - number: 47.b
    text: deze personen of vertegenwoordigers onderwerpen voor de agenda van dit overleg kunnen aanmelden;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel47
  - number: 47.c
    text: zij worden voorzien van de voor een adequate deelname aan het overleg benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel47
  - number: '48.1'
    text: Tenzij in deze wet anders is bepaald, wordt de bijstand verleend om niet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel48
  - number: '48.2'
    text: 'Bijstand kan worden verleend in de vorm van een geldlening of borgtocht indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel48
  - number: 48.2.a
    text: |-
      redelijkerwijs kan worden aangenomen dat de belanghebbende op korte termijn over voldoende middelen zal beschikken
      om over de betreffende periode in de noodzakelijke kosten van het bestaan te voorzien;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel48
  - number: 48.2.b
    text: |-
      de noodzaak tot bijstandsverlening het gevolg is van een tekortschietend besef van verantwoordelijkheid voor de
      voorziening in het bestaan;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel48
  - number: 48.2.c
    text: de aanvraag een door de belanghebbende te betalen waarborgsom betreft;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel48
  - number: 48.2.d
    text: het bijstand ter gedeeltelijke of volledige aflossing van een schuldenlast betreft.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel48
  - number: '48.3'
    text: |-
      Het college kan aan het verlenen van bijstand in de vorm van een geldlening verplichtingen verbinden
      die zijn gericht op meerdere zekerheid voor de nakoming van de aan deze bijstand verbonden rente- en
      aflossingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel48
  - number: '49'
    text: |-
      In afwijking van [artikel 13, eerste lid, onderdeel f][ref1], kan het college bijzondere bijstand verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel13
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 49.a
    text: |-
      in de vorm van borgtocht, indien het verzoek van de belanghebbende tot verlening van een saneringskrediet
      is afgewezen vanwege diens beperkte mogelijkheden tot terugbetaling en de borgtocht noodzakelijk is om de
      krediettransactie alsnog doorgang te doen vinden door een:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel49
  - number: 49.a.1°
    text: |-
      gemeentelijke kredietbank als bedoeld in de [Wet financiële dienstverlening][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018329
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018329
  - number: 49.a.2°
    text: |-
      kredietinstelling die is ingeschreven in het register bedoeld in
      [artikel 52, tweede lid, van de Wet toezicht kredietwezen 1992][ref1], indien de gemeente niet is aangesloten bij
      een gemeentelijke kredietbank dan wel daarmee geen relatie onderhoudt;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 49.b
    text: indien daartoe zeer dringende redenen bestaan en de in onderdeel a genoemde mogelijkheid geen uitkomst biedt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel49
  - number: '50.1'
    text: |-
      De belanghebbende die eigenaar is van een door hemzelf of zijn gezin bewoonde woning met bijbehorend erf, heeft
      recht op bijstand voorzover tegeldemaking, bezwaring of verdere bezwaring, van het in de woning met bijbehorend erf
      gebonden vermogen in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel50
  - number: '50.2'
    text: |-
      Indien voor de belanghebbende, bedoeld in het eerste lid, recht op algemene bijstand bestaat, heeft die bijstand de
      vorm van een geldlening:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel50
  - number: 50.2.a
    text: |-
      indien de bijstand over een periode van een jaar, te rekenen vanaf de eerste dag waarover bijstand wordt verleend,
      naar verwachting meer bedraagt dan het netto minimumloon, bedoeld in [artikel 37, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel37
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 50.2.b
    text: |-
      voorzover het vermogen gebonden in de woning met bijbehorend erf hoger is dan het vermogen, bedoeld in
      [artikel 34, tweede lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '51.1'
    text: |-
      Bijzondere bijstand voor de kosten van noodzakelijke duurzame gebruiksgoederen kan worden verleend in de vorm van
      een geldlening of borgtocht, dan wel in de vorm van een bedrag om niet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel51
  - number: '51.2'
    text: |-
      Indien een geldlening als bedoeld in het eerste lid wordt verstrekt, stemt het college de aflossingsbedragen en de
      duur van de aflossing mede af op de omstandigheden, mogelijkheden en middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel51
  - number: '52.1'
    text: Het college is bevoegd om bij wijze van voorschot bijstand te verlenen in de vorm van een renteloze geldlening.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel52
  - number: '52.2'
    text: |-
      Het in het eerste lid bedoelde voorschot kan worden verleend zolang het college nog geen besluit inzake de
      verlening van bijstand heeft bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel52
  - number: '52.3'
    text: |-
      Indien bijstand wordt verleend over een periode waarover met toepassing van het eerste lid een voorschot is
      verleend, kan deze bijstand zonder machtiging van de belanghebbende worden verrekend met dit voorschot.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel52
  - number: '53.1'
    text: |-
      Indien algemene bijstand wordt verleend over een periode, waarover een voorschot is ontvangen met toepassing
      van [artikel 31, tweede lid, van de Werkloosheidswet][ref1], [ artikel 47a, eerste lid, van Ziektewet][ref2],
      [artikel 67, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3],
      [artikel 50, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [artikel 55, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] of
      [artikel 47, tweede lid van de Wet arbeidsongeschiktheidsverzekering jonggehandicapten][ref6], al dan niet met
      gelijktijdige toepassing van [artikel 17, eerste lid, van de Toeslagenwet][ref7], en dit voorschot door het
      Uitvoeringsinstituut werknemersverzekeringen wordt teruggevorderd, kan deze bijstand zonder machtiging van de
      belanghebbende tot het bedrag van dit voorschot aan het Uitvoeringsinstituut werknemersverzekeringen worden
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel47a
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0008657#Artikel47
      [ref7]: https://wetten.overheid.nl/BWBR0004043#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 47a
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '50'
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0008657
        artikel: '47'
      - id: ref7
        bwb_id: BWBR0004043
        artikel: '17'
  - number: '53.2'
    text: |-
      In het geval, bedoeld in het eerste lid, vergoedt de gemeente aan het Uitvoeringsinstituut werknemersverzekeringen
      tevens de over de te verlenen bijstand verschuldigde loonbelasting, premies volksverzekeringen en de vergoeding,
      bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 53a.1
    text: |-
      Onverminderd [artikel 28, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepaalt het college welke gegevens ten behoeve van de verlening van bijstand dan wel de voortzetting daarvan door
      de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden overgelegd, alsmede de wijze en het
      tijdstip waarop de verstrekking van gegevens plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
  - number: 53a.2
    text: |-
      Het college is bevoegd onderzoek in te stellen naar de juistheid en volledigheid van de verstrekte gegevens en
      zonodig naar andere gegevens die noodzakelijk zijn voor de verlening dan wel de voortzetting van bijstand. Indien
      het onderzoek daartoe aanleiding geeft kan het college besluiten tot herziening van de bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel53a
  - number: '54.1'
    text: |-
      Indien de belanghebbende de voor de verlening van bijstand van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      belanghebbende anderszins onvoldoende medewerking verleent, kan het college het recht op bijstand voor de duur van
      ten hoogste acht weken opschorten:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
  - number: 54.1.a
    text: vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
  - number: 54.1.b
    text: vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
  - number: '54.2'
    text: |-
      Het college doet mededeling van de opschorting aan de belanghebbende en nodigt hem uit binnen een door hen te
      stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
  - number: '54.3'
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van bijstand en terzake van weigering van bijstand, kan het college een dergelijk besluit herzien of intrekken:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
  - number: 54.3.a
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 17, eerste lid][ref1], of de [artikelen 28, tweede lid][ref2], en
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van bijstand;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: 54.3.b
    text: indien anderszins de bijstand ten onrechte of tot een te hoog bedrag is verleend.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
  - number: '54.4'
    text: |-
      Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor gestelde
      termijn, kan het college na het verstrijken van deze termijn het besluit tot toekenning van bijstand intrekken met
      ingang van de eerste dag waarover het recht op bijstand is opgeschort.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel54
  - number: '55'
    text: |-
      Naast de verplichtingen die ingevolge [hoofdstuk 2][ref1] in elk geval aan de bijstand verbonden zijn,
      dan wel daaraan door het college verbonden worden, kan het college vanaf de dag van melding als bedoeld in
      [artikel 44, tweede lid][ref2], verplichtingen opleggen die strekken tot arbeidsinschakeling, dan wel die verband
      houden met aard en doel van een bepaalde vorm van bijstand of die strekken tot zijn vermindering of beëindiging.
      Een verplichting kan, op advies van een arts, inhouden het zich onderwerpen aan een noodzakelijke behandeling van
      medische aard.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '57'
    text: |-
      Indien en zolang er gegronde redenen zijn om aan te nemen dat de belanghebbende zonder hulp niet in staat is tot
      een verantwoorde besteding van zijn bestaansmiddelen, kan het college:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel57
  - number: 57.a
    text: |-
      aan de bijstand de verplichting verbinden dat de belanghebbende eraan meewerkt dat het college in naam van de
      belanghebbende noodzakelijke betalingen uit de toegekende bijstand verricht;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel57
  - number: 57.b
    text: de bijstand in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel57
  - number: '58.1'
    text: |-
      Het college van de gemeente die de bijstand heeft verleend kan kosten van bijstand terugvorderen, voorzover de
      bijstand:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: 58.1.a
    text: ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: 58.1.b
    text: |-
      in de vorm van geldlening is verleend en de uit de geldlening voortvloeiende verplichtingen niet of niet behoorlijk
      worden nagekomen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: 58.1.c
    text: voortvloeit uit gestelde borgtocht;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: 58.1.d
    text: |-
      ingevolge [artikel 52][ref1] bij wijze van voorschot is verleend en nadien is vastgesteld dat geen recht op
      bijstand bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 58.1.e
    text: anderszins onverschuldigd is betaald voorzover de belanghebbende dit redelijkerwijs had kunnen begrijpen, of
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: 58.1.f
    text: 'anderszins onverschuldigd is betaald, waaronder begrepen dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: 58.1.f.1°
    text: |-
      de belanghebbende naderhand met betrekking tot de periode waarover bijstand is verleend, over in aanmerking te
      nemen middelen als bedoeld in [paragraaf 3.4][ref1] beschikt of kan beschikken;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 58.1.f.2°
    text: |-
      bijstand is verleend met een bepaalde bestemming en naderhand door de belanghebbende vergoedingen of
      tegemoetkomingen worden ontvangen met het oog op die bestemming.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: '58.2'
    text: |-
      Indien een gemeente ingevolge [artikel 42, derde lid][ref1], gehouden is kosten van bijstand over een bepaalde
      periode aan een andere gemeente te vergoeden, geschiedt de terugvordering over die periode, voorzover zij nog niet
      heeft plaatsgehad, door het college van eerstgenoemde gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel42
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '58.3'
    text: |-
      Het in aanmerking nemen van in de voorafgaande drie maanden ontvangen middelen wordt niet als terugvordering
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: '58.4'
    text: |-
      Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de wettelijke rente en de op de
      terugvordering betrekking hebbende kosten. Loonbelasting en de premies volksverzekeringen waarvoor de gemeente
      die de bijstand verstrekt krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede de
      vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2], kunnen worden teruggevorderd, voorzover deze
      belasting, premies en vergoeding niet verrekend kunnen worden met de door het college af te dragen loonbelasting,
      premies volksverzekeringen en vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '58.5'
    text: |-
      Terugvordering als bedoeld in het eerste lid, onderdeel e, vindt niet plaats, indien de betreffende kosten zijn
      gemaakt meer dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel58
  - number: '59.1'
    text: |-
      Onverminderd [artikel 58][ref1] kunnen kosten van bijstand, indien de bijstand aan een gezin wordt verleend, van
      alle gezinsleden worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '59.2'
    text: |-
      Indien de bijstand als gezinsbijstand aan gehuwden had moeten worden verleend, maar zulks achterwege is gebleven,
      omdat de belanghebbende de verplichtingen, bedoeld in [artikel 17][ref1], of de [artikelen 28, tweede lid][ref2],
      of [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], niet of niet behoorlijk is
      nagekomen, kunnen de kosten van bijstand mede worden teruggevorderd van de persoon met wiens middelen als bedoeld
      in [paragraaf 3.4][ref4], bij de verlening van bijstand rekening had moeten worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '17'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '59.3'
    text: |-
      De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van kosten van
      bijstand die worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel59
  - number: '60.1'
    text: |-
      Een besluit tot terugvordering van kosten van bijstand vermeldt hetgeen teruggevorderd wordt, de termijn of
      termijnen waarbinnen moet worden betaald, alsmede de wijze waarop het besluit, bij gebreke van tijdige betaling,
      ten uitvoer wordt gelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel60
  - number: '60.2'
    text: |-
      De persoon van wie kosten van bijstand worden teruggevorderd is verplicht desgevraagd aan het college de
      inlichtingen te verstrekken die voor terugvordering ingevolge deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel60
  - number: '60.3'
    text: |-
      Een besluit tot terugvordering van kosten van bijstand als bedoeld in de [artikelen 58][ref1] en [59][ref2] levert
      een executoriale titel op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0002471
  - number: '60.4'
    text: |-
      Op het executoriaal beslag ingevolge het derde lid op loon, sociale uitkeringen of andere
      periodieke betalingen, welke derden verschuldigd zijn of worden aan degene van wie kosten
      van bijstand worden teruggevorderd, zijn de [artikelen 479b tot en met 479g][ref1], behoudens
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.
      De in [artikel 479g][ref3] aan de raad voor de kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan
      het college.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 479e
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479g
  - number: '60.5'
    text: |-
      Terugvordering van kosten van bijstand als bedoeld in de [artikelen 58][ref1] en [59][ref2] is bevoorrecht en volgt
      onmiddellijk na de vorderingen in [artikel 288 van Boek 3 van het Burgerlijk Wetboek omschreven][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '63.1'
    text: |-
      Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en inlichtingen
      te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet ten opzichte
      van een persoon te wiens behoeve bijstand is gevraagd of wordt verleend en die in zijn dienst dan wel te zijnen
      behoeve werkt of heeft gewerkt. De verplichting strekt zich mede uit tot de inkomsten van een persoon van wie
      kosten van bijstand ingevolge [paragraaf 4][ref1] worden of kunnen worden teruggevorderd of op wie kosten van
      bijstand ingevolge [paragraaf 5][ref2] worden of kunnen worden verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: '63.2'
    text: |-
      De opgaven en inlichtingen worden desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel63
  - number: '64.1'
    text: |-
      De hieronder vermelde instanties zijn verplicht desgevraagd aan het college of, indien het college aan de Centrale
      organisatie werk en inkomen mandaat heeft verleend tot het nemen van besluiten inzake de verlening van bijstand,
      aan de Centrale organisatie werk en inkomen, kosteloos opgaven en inlichtingen te verstrekken die noodzakelijk zijn
      voor de uitvoering van deze wet:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.a
    text: het college van andere gemeenten;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.b
    text: |-
      de Centrale organisatie werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.c
    text: de belastingdienst;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      het College toezicht, genoemd in [artikel 77, eerste lid, van de Zorgverzekeringswet][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '77'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
  - number: 64.1.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] als
      inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
  - number: 64.1.f
    text: |-
      de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 1996][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0007893
  - number: 64.1.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 64.1.h
    text: |-
      de Belastingdienst/Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref1] en Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en
      Milieubeheer betreffende de toepassing van de [Wet bevordering eigenwoningbezit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0011919
  - number: 64.1.i
    text: |-
      de Informatie Beheer Groep betreffende de toepassing van de [Wet studiefinanciering 2000][ref1],
      de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], en de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
      [ref3]: https://wetten.overheid.nl/BWBR0012438
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
      - id: ref3
        bwb_id: BWBR0012438
  - number: 64.1.j
    text: |-
      Onze Minister van Landbouw, Natuurbeheer en Visserij betreffende de omvang van de productiebeperkende maatregelen
      voor het bedrijf van de ondernemer in de agrarische sector;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.k
    text: Onze Minister van Justitie voorzover het betreft de persoon die rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.l
    text: de instanties en personen die woonruimte verhuren;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.m
    text: de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.1.n
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.2'
    text: |-
      Het vragen door het college en het verstrekken door de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde opgaven en inlichtingen geschiedt in bij of krachtens algemene maatregel van bestuur te bepalen
      gevallen door tussenkomst van het Inlichtingenbureau. Het Inlichtingenbureau voert ten behoeve van de verwerking
      van deze opgaven en inlichtingen een administratie.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.3'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college
      of, indien het college aan de Centrale organisatie werk en inkomen mandaat heeft verleend tot het nemen van
      besluiten inzake de verlening van bijstand, aan de Centrale organisatie werk en inkomen, kosteloos alle gegevens en
      uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken die noodzakelijk zijn voor de
      uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.4'
    text: 'De in het eerste en het derde lid bedoelde verplichtingen strekken zich mede uit tot degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.4.a
    text: |-
      van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref1] of op wie deze
      worden of kunnen worden verhaald ingevolge [paragraaf 5][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 64.4.b
    text: |-
      die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.4.b.1°
    text: te wiens behoeve bijstand is gevraagd of wordt verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: 64.4.b.2°
    text: |-
      van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref1] of op wie deze
      worden of kunnen worden verhaald ingevolge [paragraaf 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: '64.5'
    text: |-
      De in het eerste lid en het derde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.6'
    text: |-
      De in het eerste lid, onderdeel a tot en met k, genoemde instanties treffen desgevraagd met het college en met het
      Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      opgaven en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het tweede lid en de inhoud en
      vormgeving van de in het zesde lid bedoelde regelingen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.8'
    text: |-
      Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het tweede lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het derde lid
      worden aangewezen voor wie de verplichtingen, bedoeld in het eerste lid tot en met zevende lid, eveneens gelden,
      voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen en
      opgaven.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.10'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het negende lid, kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '64.11'
    text: |-
      Onze Minister van Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is ontnomen, onverwijld
      en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen, die van invloed kunnen zijn op
      het recht op bijstand, aan het college, of, indien het college aan de Centrale organisatie werk en inkomen mandaat
      heeft verleend tot het nemen van besluiten inzake de verlening van bijstand, aan de Centrale organisatie werk en
      inkomen, door tussenkomst van het Inlichtingenbureau, waarbij hij gebruik kan maken van het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel64
  - number: '65.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel65
  - number: '65.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel65
  - number: 65.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel65
  - number: 65.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel65
  - number: 65.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel65
  - number: '65.3'
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voorzover de persoonlijke levenssfeer van de betrokkenen daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel65
  - number: '65.4'
    text: |-
      Degene die op grond van de [artikelen 63 tot en met 68][ref1] gegevens verstrekt dient na te gaan of degene aan wie
      de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel63
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '63'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '66'
    text: |-
      Het college is verplicht, indien het bij de uitvoering van deze wet het gegronde vermoeden krijgt van een misdrijf
      dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale verzekeringswetten of
      van een Nederlands of buitenlands overheidsorgaan, voorzover dit is belast met het verrichten van uitkeringen, het
      doen van verstrekkingen dan wel het heffen van bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel66
  - number: '67.1'
    text: |-
      Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet aan
      de hieronder vermelde instanties kosteloos de gegevens te verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 67.1.a
    text: |-
      de Centrale organisatie voor werk en inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank voor de uitvoering van de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      of de wettelijke regelingen, bedoeld in de [artikelen 30, eerste lid, onderdeel a][ref2], en
      [34, eerste lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '34'
  - number: 67.1.b
    text: |-
      de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref1],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2] en de
      Belastingdienst/Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0018472
  - number: 67.1.c
    text: |-
      het college van andere gemeenten voor de uitvoering van deze wet, de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] en de
      [Wet werk en inkomen kunstenaars][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
      - id: ref3
        bwb_id: BWBR0017837
  - number: 67.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      het College toezicht, genoemd in [artikel 77, eerste lid, van de Zorgverzekeringswet][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4], voor de uitvoering van de [Zorgverzekeringswet][ref5] of de
      [Algemene Wet Bijzondere Ziektekosten][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0018450
      [ref6]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '77'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
      - id: ref5
        bwb_id: BWBR0018450
      - id: ref6
        bwb_id: BWBR0002614
  - number: 67.1.e
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
  - number: 67.1.f
    text: buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
  - number: 67.1.g
    text: |-
      bestuursorganen van de Nederlandse Antillen en Aruba voor de vervulling van een taak van zwaarwegend algemeen
      belang.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
  - number: '67.2'
    text: |-
      De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      betrokkenen daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
  - number: '67.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
  - number: '67.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het eerste lid worden aangewezen ten
      behoeve waarvan de verplichtingen, bedoeld in het eerste lid, eveneens gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel67
  - number: '68.1'
    text: |-
      In de administratie van de gemeente en van het Inlichtingenbureau terzake van de uitvoering van deze wet wordt het
      sociaal-fiscaalnummer opgenomen waaronder een natuurlijk persoon is geregistreerd bij de belastingdienst.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel68
  - number: '68.2'
    text: |-
      Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in de [artikelen 64][ref1] en
      [67][ref2] bedoelde instanties wordt, indien daartoe bevoegd, gebruik gemaakt van dit sociaal-fiscaalnummer. Derden
      die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen gebruiken
      het sociaal-fiscaalnummer slechts voorzover dat noodzakelijk is voor het verrichten van werkzaamheden die in
      het kader van de voorzieningen, bedoeld in [artikel 7, eerste lid, onderdeel a, en het tweede lid][ref3], worden
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '64'
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '67'
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '68.3'
    text: |-
      Ten behoeve van het gebruik van het sociaal-fiscaalnummer in de in het eerste lid bedoelde administratie kent Onze
      Minister van Financiën, in overeenstemming met Onze Minister, aan personen die algemene bijstand ontvangen en die
      niet reeds ten behoeve van de belastingheffing bij de belastingdienst zijn geregistreerd, een sociaal-fiscaalnummer
      toe.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel68
  - number: '69.1'
    text: 'Onze Minister verstrekt jaarlijks ten laste van ''s Rijks kas aan het college:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel69
  - number: 69.1.a
    text: |-
      een uitkering voor de kosten van voorzieningen als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], niet
      zijnde uitvoeringskosten;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 69.1.b
    text: |-
      een uitkering voor de kosten van de door hen toegekende algemene bijstand, waaronder begrepen de loonbelasting, de
      premies volksverzekeringen die daarover verschuldigd zijn en de in [artikel 46 van de Zorgverzekeringswet][ref1]
      bedoelde vergoedingen van de inkomensafhankelijke bijdragen daarover, en van de langdurigheidstoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '69.2'
    text: |-
      Het bedrag van de uitkeringen wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      berekend aan de hand van de voor ieder jaar bij wet vast te stellen totale bedragen die beschikbaar zijn voor
      de uitkeringen, bedoeld in het eerste lid. Bij de vaststelling van het totale bedrag dat beschikbaar is voor de
      uitkeringen, bedoeld in het eerste lid, onderdeel b, is het uitgangspunt dat dit bedrag toereikend is voor de voor
      dat jaar geraamde kosten, bedoeld in dat onderdeel, van alle gemeenten.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel69
  - number: '69.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen regels worden gesteld
      omtrent:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel69
  - number: 69.3.a
    text: de berekening van verschillende delen van de uitkering, bedoeld in het eerste lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel69
  - number: 69.3.b
    text: |-
      het verzamelen van gegevens noodzakelijk voor de berekening van het bedrag van de uitkeringen, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel69
  - number: '70.1'
    text: |-
      Indien uit het verslag, bedoeld in [artikel 77, eerste lid][ref1], blijkt dat de uitkering, bedoeld in
      [artikel 69, eerste lid, onderdeel a][ref2], niet volledig of onrechtmatig is besteed, wordt de uitkering ter
      hoogte van het niet of onrechtmatig bestede deel teruggevorderd. Onze Minister doet binnen een jaar na ontvangst
      van het verslag mededeling van terugvordering aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '70.2'
    text: |-
      Indien het verslag niet volledig is ontvangen binnen achttien maanden na het jaar waarop het betrekking heeft of
      niet is voorzien van de verklaring van de accountant, bedoeld in [artikel 77, eerste lid][ref1], wordt een bij
      algemene maatregel van bestuur bepaald percentage van de uitkering teruggevorderd. Onze Minister doet binnen drie
      maanden na afloop van de achttien maanden mededeling van terugvordering aan het college.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel77
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '70.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de terugvordering, bedoeld in het
      eerste en tweede lid, waarbij kan worden bepaald dat in bepaalde gevallen een percentage van het niet bestede deel
      van de uitkering niet wordt teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel70
  - number: '70.4'
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel70
  - number: '71.1'
    text: |-
      Het totale bedrag, bedoeld in [artikel 69, tweede lid][ref1], voor de uitkeringen, bedoeld in
      [artikel 69, eerste lid, onderdeel b][ref2], wordt in het jaar waarop het bedrag betrekking heeft bij of krachtens
      de wet aangepast op basis van nieuwe ramingsgegevens. [Artikel 69, tweede lid, tweede volzin][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '71.2'
    text: |-
      Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 69, eerste lid, onderdeel b][ref1], wordt aangepast binnen een periode van vier weken na de herziening
      door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '71.3'
    text: |-
      Bij toepassing van het tweede lid kan Onze Minister vanuit het oogmerk van een meer evenwichtige verdeling van het
      totale bedrag, bedoeld in [artikel 69, eerste lid, onderdeel b][ref1], de peildatum van de gegevens noodzakelijk
      voor de berekening, bedoeld in [artikel 69, tweede lid][ref2], actualiseren, leidende tot een nieuwe uitkering
      per gemeente. Van een actualisatie als bedoeld in de eerste volzin wordt door Onze Minister mededeling gedaan in
      de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '71.4'
    text: |-
      Onze Minister kan vanuit het oogmerk van een meer evenwichtige verdeling van het totale bedrag, bedoeld in
      [artikel 69, eerste lid, onderdeel a][ref1], de peildatum van de gegevens noodzakelijk voor de berekening, bedoeld
      in [artikel 69, tweede lid][ref2], actualiseren, leidende tot een nieuwe uitkering per gemeente. De tweede volzin
      van het derde lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '72.1'
    text: |-
      Onze Minister kan, indien hij van oordeel is dat het college, na afloop van de termijn, bedoeld in
      [artikel 76, derde lid][ref1], geen of onvoldoende gevolg heeft gegeven aan een aanwijzing als bedoeld in
      [artikel 76, derde lid][ref2], de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel b][ref3], voor het jaar
      volgend op het jaar waarin de termijn afloopt, 1 procent lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '72.2'
    text: |-
      Onze Minister kan, indien hij van oordeel is dat het college, twaalf maanden na afloop van de termijn, bedoeld
      in [artikel 76, derde lid][ref1], nog geen of onvoldoende gevolg heeft gegeven aan een aanwijzing als bedoeld
      in [artikel 76, derde lid][ref2], de uitkering, bedoeld in [artikel 69, eerste lid, onderdeel b][ref3], voor het
      tweede jaar volgend op het jaar waarin de termijn afloopt en de daaropvolgende jaren, telkens ten hoogste 3 procent
      lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '73.1'
    text: Er is een toetsingscommissie.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel73
  - number: '73.2'
    text: |-
      De toetsingscommissie heeft tot taak aan Onze Minister een oordeel te geven over een verzoek als bedoeld in
      [artikel 74, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '73.3'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel73
  - number: '74.1'
    text: |-
      Indien de door het college gemaakte kosten, bedoeld in [artikel 69, eerste lid, onderdeel b][ref1], hoger zijn
      dan de daarvoor verstrekte uitkering, kan door Onze Minister ten laste van een daarvoor ieder jaar bij wet vast te
      stellen bedrag op verzoek van het college een aanvullende uitkering worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '74.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt door het college ingediend bij de toetsingscommissie, bedoeld in
      [artikel 73][ref1]. Bij ministeriële regeling worden regels gesteld met betrekking tot de termijn waarbinnen een
      verzoek als bedoeld in het eerste lid kan worden ingediend en de termijn waarbinnen op dat verzoek wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel73
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '73'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '74.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld onder welke voorwaarden een verzoek kan worden
      ingediend en op grond waarvan de toetsingscommissie een verzoek beoordeelt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel74
  - number: '74.4'
    text: |-
      Bij de beslissing op het verzoek betrekt Onze Minister, naast het oordeel van de toetsingscommissie, het oordeel
      van de Inspectie Werk en Inkomen over de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel74
  - number: '75'
    text: 'Bij ministeriële regeling worden regels gesteld inzake de betaling van:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel75
  - number: 75.a
    text: |-
      de uitkeringen, bedoeld in [artikel 69, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 75.b
    text: |-
      het bedrag waarmee de uitkering op grond van [artikel 71][ref1] wordt aangepast;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel71
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '71'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 75.c
    text: |-
      de aanvullende uitkering, bedoeld in [artikel 74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '76.1'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel76
  - number: 76.1.a
    text: de rechtmatigheid van de uitvoering van deze wet door het college;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel76
  - number: 76.1.b
    text: de doeltreffendheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel76
  - number: '76.2'
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige
      toepassing. De Inspectie Werk en Inkomen is tevens belast met het geven van het oordeel, bedoeld in
      [artikel 74, vierde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '44'
      - id: ref6
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '76.3'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan het college, nadat het gedurende acht weken in de gelegenheid is gesteld zijn zienswijze naar
      voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele gevallen.
      In een aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft
      gebracht met deze aanwijzing.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel76
  - number: '77.1'
    text: |-
      Het college dient jaarlijks bij Onze Minister een verslag in over de uitvoering van deze wet. Het verslag omvat
      mede een opgave van de door het college gemaakte kosten, bedoeld in [artikel 69, eerste lid][ref1], en is voorzien
      van een verklaring van de accountant, belast met de in [artikel 213 van de Gemeentewet][ref2] voorgeschreven
      controle omtrent de getrouwheid van de verstrekte gegevens en de rechtmatigheid van de uitvoering van de wet,
      alsmede van een oordeel van de gemeenteraad over de uitvoering van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel213
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '213'
  - number: '77.2'
    text: |-
      Voorafgaand aan het verslag, bedoeld in het eerste lid, dient het college bij Onze Minister een voorlopig verslag
      in over de uitvoering.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel77
  - number: '77.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld inzake het voorlopig verslag, het verslag en over de verklaring
      en het onderzoek dat resulteert in deze verklaring. Deze regels kunnen voor categorieën van gemeenten verschillen,
      waarbij kan worden bepaald dat de verplichting het verslag te voorzien van een verklaring niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel77
  - number: '78.1'
    text: |-
      Het college en de gemeenteraad verstrekken desgevraagd aan Onze Minister de inlichtingen die hij voor het toezicht,
      de statistiek, de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel78
  - number: '78.2'
    text: |-
      Onze Minister stelt een beleidsplan op dat het kader biedt waarbinnen hij de inlichtingen, bedoeld in het eerste
      lid, vraagt. Over het beleidsplan of een wijziging daarvan overlegt hij met de daartoe door hem aangewezen
      rechtspersoon die de gemeenten vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel78
  - number: '78.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het college en de
      gemeenteraad de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken, waarbij kan worden bepaald dat
      categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel78
  - number: '78.4'
    text: |-
      De inlichtingen, bedoeld in het eerste lid, en de bescheiden, bedoeld in [artikel 77][ref1], worden kosteloos
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel77
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '79'
    text: |-
      Voor de toepassing van [artikel 8:1, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt met een besluit
      gelijkgesteld het nalaten van een handeling die strekt tot uitvoering van het besluit inzake de verlening of
      terugvordering van bijstand of het verrichten van een handeling die afwijkt van dat besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '80.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen ter zake van
      schending of verkeerde toepassing van [artikel 3, tweede tot en met vijfde lid][ref1], en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '1.1'
  - number: '80.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel80
  - number: '81.1'
    text: |-
      In geval het college geen of ontoereikend toepassing heeft gegeven aan [artikel 52][ref1] kan de voorzitter van
      gedeputeerde staten, indien naar zijn oordeel de noodzaak tot onverwijlde bijstand aanwezig is, op verzoek van de
      belanghebbende besluiten dat het college algemene bijstand verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '81.2'
    text: |-
      De beslissing van de voorzitter van gedeputeerde staten vervalt, zodra de beslissing van het college inzake de
      verlening van algemene bijstand onherroepelijk is geworden dan wel de rechtbank op het beroep heeft beslist.
      De beslissing vervalt eveneens met ingang van de datum waarop een door de voorzieningenrechter van de rechtbank
      getroffen voorlopige voorziening in werking treedt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel81
  - number: '81.3'
    text: |-
      De in het eerste lid bedoelde bijstand wordt bij wijze van voorschot verleend in de vorm van een renteloze
      geldlening.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel81
  - number: '82.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien de spoed dat vereist, regels worden gesteld die noodzakelijk zijn
      in verband met de goede uitvoering van de wet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel82
  - number: '82.2'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel82
  - number: '82.3'
    text: |-
      Na de plaatsing in het Staatsblad van een krachtens het eerste lid vastgestelde algemene maatregel van bestuur
      wordt een voorstel van wet tot regeling van het betrokken onderwerp zo spoedig mogelijk bij de Staten-Generaal
      ingediend. Indien het voorstel wordt ingetrokken of indien een van beide kamers der Staten-Generaal besluit het
      voorstel niet aan te nemen, wordt de algemene maatregel van bestuur onverwijld ingetrokken. Wordt het voorstel
      tot wet verheven, dan wordt de algemene maatregel van bestuur ingetrokken op het tijdstip van inwerkingtreding van
      die wet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel82
  - number: '83.1'
    text: |-
      Bij algemene maatregel van bestuur kan bij wijze van experiment, met het oog op het onderzoeken van mogelijkheden
      om deze wet met betrekking tot de arbeidsinschakeling en de financiering doeltreffender uit te voeren, worden
      afgeweken van het bepaalde bij of krachtens de [artikelen 6 tot en met 10][ref1], [31, tweede lid][ref2], en
      [paragraaf 7.1][ref3]. Bij toepassing van de eerste volzin wordt bij algemene maatregel van bestuur geregeld op
      welke wijze en gedurende welke periode van welke artikelen van de wet wordt afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '6'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0015703
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '83.2'
    text: |-
      Een experiment als bedoeld in het eerste lid duurt ten hoogste drie jaar. Indien, voor een experiment is afgelopen,
      een voorstel van wet is ingediend bij de Staten-Generaal om het experiment om te zetten in een structurele
      wettelijke regeling, kan het experiment worden verlengd tot het tijdstip waarop het voorstel van wet in werking
      treedt. De tweede volzin van het eerste lid is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel83
  - number: '83.3'
    text: |-
      Onze Minister kan op hun verzoek gemeenten aanwijzen die deelnemen aan een experiment. Bij of krachtens algemene
      maatregel van bestuur worden regels gesteld met betrekking tot de toepassing van deze bevoegdheid.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel83
  - number: '83.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de uitvoering van een experiment en
      voorzieningen wordengetroffen voor zich gedurende een experiment voordoende onvoorziene gevallen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel83
  - number: '83.5'
    text: |-
      Onze Minister zendt uiterlijk drie maanden voor het einde van een experiment aan de Staten-Generaal een verslag
      over de doeltreffendheid en de effecten van het experiment in de praktijk alsmede een standpunt inzake de
      voortzetting ervan anders dan als experiment. Indien een experiment eerder wordt beëindigd dan oorspronkelijk
      beoogd, zendt Onze Minister, in afwijking van de eerste volzin, uiterlijk twee maanden na de beëindiging van dat
      experiment een verslag als bedoeld in de eerste volzin aan de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel83
  - number: '83.6'
    text: |-
      De voordracht voor krachtens dit artikel vast te stellen algemene maatregelen van bestuur wordt niet eerder gedaan
      dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel83
  - number: '84'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van deze wet, aan de Staten-Generaal een verslag over
      de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel84
  - number: '85'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld. In het koninklijk besluit wordt zo nodig toepassing gegeven
      aan [artikel 16 van de Tijdelijke referendumwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012701#Artikel16
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0012701
        artikel: '16'
