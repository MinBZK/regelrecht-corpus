      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 5.d
    text: |-
      bijzondere bijstand: de bijstand, bedoeld in [artikel 35, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel35
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel5
    references:
      - id: ref1
