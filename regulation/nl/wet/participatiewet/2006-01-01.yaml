        paragraaf: '4.1'
  - number: 5.e
    text: |-
      langdurigheidstoeslag: de langdurigheidstoeslag, bedoeld in [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel36
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 5.f
    text: |-
      voorliggende voorziening: elke voorziening buiten deze wet waarop de belanghebbende of het gezin aanspraak kan
      maken, dan wel een beroep kan doen, ter verwerving van middelen of ter bekostiging van specifieke uitgaven.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel5
  - number: '6'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel6
  - number: 6.a
    text: |-
      niet-uitkeringsgerechtigde: de persoon, jonger dan 65 jaar, die als werkloze werkzoekende staat geregistreerd
      bij de Centrale organisatie werk en inkomen en die geen recht heeft op een uitkering op grond van deze
      wet of de [Werkloosheidswet][ref1], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3], de
      [Wet werk en inkomen naar arbeidsvermogen][ref4], de [Wet op de arbeidsongeschiktheidsverzekering,][ref5] de
      [Toeslagenwet][ref6], de [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref7], de
      [Algemene nabestaandenwet][ref8] dan wel op grond van een regeling, die met deze wetten naar aard en strekking
      overeenstemt;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0002524
      [ref6]: https://wetten.overheid.nl/BWBR0004043
      [ref7]: https://wetten.overheid.nl/BWBR0007891
      [ref8]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0008656
      - id: ref3
        bwb_id: BWBR0008657
      - id: ref4
        bwb_id: BWBR0019057
      - id: ref5
