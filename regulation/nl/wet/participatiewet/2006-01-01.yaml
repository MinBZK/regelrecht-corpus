      - id: ref7
        bwb_id: BWBR0007891
      - id: ref8
        bwb_id: BWBR0007795
  - number: 6.b
    text: |-
      arbeidsinschakeling: het verkrijgen van algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een
      voorziening als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 6.c
    text: |-
      sociale activering: het verrichten van onbeloonde maatschappelijk zinvolle activiteiten gericht op
      arbeidsinschakeling of, als arbeidsinschakeling nog niet mogelijk is, op zelfstandige maatschappelijke
      participatie.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel6
  - number: '7.1'
    text: 'Het college is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel7
  - number: 7.1.a
    text: |-
      het ondersteunen van personen die algemene bijstand ontvangen, personen als bedoeld in
      [artikel 10, tweede lid][ref1], personen met een nabestaanden- of halfwezenuitkering op grond van de
      [Algemene nabestaandenwet][ref2] en niet-uitkeringsgerechtigden bij arbeidsinschakeling en, indien het college
      daarbij het aanbieden van een voorziening, waaronder begrepen sociale activering, gericht op arbeidsinschakeling
      noodzakelijk acht, voor het bepalen en aanbieden van deze voorziening, en;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0007795
  - number: 7.1.b
    text: |-
      het verlenen van bijstand aan personen hier te lande die in zodanige omstandigheden verkeren of dreigen te geraken
      dat zij niet over de middelen beschikken om in de noodzakelijke kosten van het bestaan te voorzien.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het college werkt bij de uitvoering van het eerste lid, onderdeel a, samen met de Centrale organisatie werk en
      inkomen en het Uitvoeringsinstituut werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid, aanhef en onderdeel a, is niet van toepassing op personen aan wie het Uitvoeringsinstituut
      werknemersverzekeringen een uitkering verstrekt. Het college en het Uitvoeringsinstituut werknemersverzekeringen
      kunnen overeenkomen dat het eerste lid, aanhef en onderdeel a, van toepassing is op voornoemde personen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel7
  - number: '7.4'
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de
      belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het
      college kan de in de eerste volzin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel7
  - number: '7.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede tot en
      met vierde lid.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel7
  - number: '8.1'
    text: 'De gemeenteraad stelt bij verordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel8
  - number: 8.1.a
    text: |-
      het ondersteunen bij arbeidsinschakeling en het aanbieden van voorzieningen gericht op arbeidsinschakeling, bedoeld
      in [artikel 7, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 8.1.b
    text: |-
      het verlagen van de bijstand, bedoeld in [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 8.1.c
    text: |-
      het verhogen en verlagen van de norm, bedoeld in [artikel 30][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel30
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '8.2'
    text: |-
      De regels, bedoeld in het eerste lid, onderdeel a, hebben in ieder geval betrekking op de evenwichtige aandacht
      voor de in [artikel 7, eerste lid, onderdeel a][ref1], genoemde groepen, alsmede voor verschillende doelgroepen
      daarbinnen, en op de wijze waarop rekening wordt gehouden met zorgtaken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 8a
    text: |-
      De gemeenteraad stelt in het kader van het financiële beheer bij verordening regels voor de bestrijding van het ten
      onrechte ontvangen van bijstand alsmede van misbruik en oneigenlijk gebruik van de wet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel8a
  - number: '9.1'
    text: |-
      De belanghebbende van 18 jaar of ouder doch jonger dan 65 jaar is, vanaf de dag van melding als bedoeld in
      [artikel 44, tweede lid][ref1], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 9.1.a
    text: |-
      naar vermogen algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een voorziening als bedoeld
      in [artikel 7, eerste lid, onderdeel a][ref1], te verkrijgen en deze te aanvaarden, waaronder begrepen registratie
      als werkzoekende bij de Centrale organisatie werk en inkomen, indien hem daartoe het recht toekomt op grond van
      [artikel 25, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '25'
  - number: 9.1.b
    text: |-
      gebruik te maken van een door het college aangeboden voorziening, waaronder begrepen sociale activering, gericht op
      arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel9
  - number: '9.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan het college in individuele gevallen tijdelijk ontheffing
      verlenen van een verplichting als bedoeld in het eerste lid. Zorgtaken kunnen als dringende redenen worden
      aangemerkt, voorzover hiermee geen rekening kan worden gehouden door middel van een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref1]. Indien de tijdelijke ontheffing een alleenstaande ouder betreft maakt
      het college in het bijzonder een afweging tussen het belang van arbeidsinschakeling en de invulling die de ouder
      wenst te geven aan de zorgplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '9.3'
    text: Indien bijstand wordt verleend aan gehuwden gelden de verplichtingen bedoeld in het eerste lid voor ieder van hen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel9
  - number: '9.4'
    text: |-
      De verplichting om algemeen geaccepteerde arbeid te aanvaarden geldt voor de alleenstaande ouder met kinderen tot
      12 jaar slechts nadat het college zich genoegzaam heeft overtuigd van de beschikbaarheid van passende kinderopvang,
      de toepassing van voldoende scholing en de belastbaarheid van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel9
  - number: '10.1'
    text: |-
      Personen die algemene bijstand ontvangen, personen met een nabestaanden- of halfwezenuitkering op grond van de
      [Algemene nabestaandenwet][ref1] en niet-uitkeringsgerechtigden hebben, overeenkomstig de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref2], aanspraak op ondersteuning bij arbeidsinschakeling en op de naar het
      oordeel van het college noodzakelijk geachte voorziening gericht op arbeidsinschakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '10.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op personen die vanwege een voorziening gericht op
      arbeidsinschakeling niet tot een van de groepen, bedoeld in het eerste lid, behoren.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel10
  - number: '10.3'
    text: |-
      [Artikel 40, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '11.1'
    text: |-
      Iedere Nederlander die hier te lande in zodanige omstandigheden verkeert of dreigt te geraken dat hij niet over
      de middelen beschikt om in de noodzakelijke kosten van het bestaan te voorzien, heeft recht op bijstand van
      overheidswege.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel11
  - number: '11.2'
    text: |-
      Met de Nederlander, bedoeld in het eerste lid, wordt gelijkgesteld de hier te lande
      verblijvende vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen hier te lande verblijvende vreemdelingen, anders dan die bedoeld in
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], voor de toepassing van deze wet
      met een Nederlander gelijk worden gesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 11.3.a
    text: ter uitvoering van een verdrag dan wel een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel11
  - number: 11.3.b
    text: |-
      indien zij, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf
      hebben als bedoeld in [artikel 8, onderdeel g of h, van die wet][ref2] en zij aan de in die algemene maatregel van
      bestuur gestelde voorwaarden voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11.4'
    text: |-
      Het recht op bijstand komt de echtgenoten gezamenlijk toe, tenzij een van de echtgenoten geen recht op bijstand
      heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel11
  - number: '12'
    text: |-
      Een persoon van 18, 19 of 20 jaar heeft recht op bijzondere bijstand voorzover zijn noodzakelijke kosten van het
      bestaan uitgaan boven de bijstandsnorm en hij voor deze kosten geen beroep kan doen op zijn ouders, omdat:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel12
  - number: 12.a
    text: de middelen van de ouders daartoe niet toereikend zijn; of
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel12
  - number: 12.b
    text: hij redelijkerwijs zijn onderhoudsrecht jegens zijn ouders niet te gelde kan maken.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel12
  - number: '13.1'
    text: 'Geen recht op bijstand heeft degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.1.a
    text: aan wie rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.1.b
    text: die zijn militaire of vervangende dienstplicht vervult;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.1.c
    text: |-
      die wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voorzover diens gebrek aan middelen daarvan het
      gevolg is;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.1.d
    text: |-
      die per kalenderjaar langer dan vier weken verblijf houdt buiten Nederland dan wel een aaneengesloten periode van
      langer dan vier weken verblijf houdt buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.1.e
    text: die jonger is dan 18 jaar;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.1.f
    text: |-
      die bijstand vraagt ter gedeeltelijke of volledige aflossing van een schuldenlast en die overigens bij het ontstaan
      van de schuldenlast, dan wel nadien, beschikte of beschikt over de middelen om in de noodzakelijke kosten van het
      bestaan te voorzien.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: '13.2'
    text: 'Geen recht op algemene bijstand heeft degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.2.a
    text: van 18, 19 of 20 jaar die in een inrichting verblijft;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
  - number: 13.2.b
    text: |-
      die uitkering op grond van de [Wet werk en inkomen kunstenaars][ref1] ontvangt of die gehuwd is met een persoon die
      een zodanige uitkering ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017837
  - number: 13.2.c
    text: |-
      die onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die gehuwd
      is met een zodanig persoon, voorzover diens gebrek aan middelen daarvan het gevolg is, tenzij de belanghebbende
      alleenstaande ouder is en hij verlof geniet als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: '13.3'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten
      een penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden of een inrichting als
      bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: '13.4'
    text: |-
      In afwijking van het eerste lid, onderdeel d, geldt voor personen van 57,5 jaar of ouder doch jonger dan 65 jaar,
      aan wie op grond van [artikel 9, tweede lid][ref1], ontheffing is verleend van de verplichtingen, bedoeld in
      [artikel 9, eerste lid][ref2], alsmede voor personen van 65 jaar of ouder, een periode van 13 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '14'
    text: 'In ieder geval worden niet tot de noodzakelijke kosten van het bestaan gerekend kosten met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel14
  - number: 14.a
    text: de voldoening aan alimentatieverplichtingen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel14
  - number: 14.b
    text: de betaling van een boete;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel14
  - number: 14.c
    text: geleden of toegebrachte schade;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel14
  - number: 14.d
    text: vrijwillige premiebetaling in het kader van een publiekrechtelijke verzekering;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel14
  - number: 14.e
    text: |-
      kosten van medische handelingen en verrichtingen die gerekend kunnen worden tot de ontwikkelingsgeneeskunde als
      bedoeld in de [Wet op bijzondere medische verrichtingen][ref1], of wanneer zodanige medische behandelingen en
      verrichtingen buiten Nederland plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008974
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008974
  - number: '15.1'
    text: |-
      Geen recht op bijstand bestaat voorzover een beroep kan worden gedaan op een voorliggende voorziening die, gezien
      haar aard en doel, wordt geacht voor de belanghebbende toereikend en passend te zijn. Het recht op bijstand strekt
      zich evenmin uit tot kosten die in de voorliggende voorziening als niet noodzakelijk worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel15
  - number: '15.2'
    text: |-
      De [Wet werk en inkomen kunstenaars][ref1] geldt niet als een voorliggende voorziening als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017837
  - number: '16.1'
    text: |-
      Aan een persoon die geen recht op bijstand heeft, kan het college, gelet op alle omstandigheden, in afwijking van
      deze paragraaf, bijstand verlenen indien zeer dringende redenen daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel16
  - number: '16.2'
    text: |-
      Het eerste lid is niet van toepassing op andere vreemdelingen dan die, bedoeld in
      [artikel 11, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '17.1'
    text: |-
      De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling of het recht op bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel17
  - number: '17.2'
    text: |-
      De belanghebbende is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is
      voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel17
  - number: '17.3'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '17.4'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '18.1'
    text: |-
      Het college stemt de bijstand en de daaraan verbonden verplichtingen af op de omstandigheden, mogelijkheden en
      middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien de belanghebbende naar het oordeel van het college tekortschietend besef van verantwoordelijkheid betoont
      voor de voorziening in het bestaan dan wel de uit deze wet dan wel de [artikelen 28, tweede lid][ref1], of
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] voortvloeiende verplichtingen
      niet of onvoldoende nakomt, waaronder begrepen het zich jegens het college zeer ernstig misdragen, verlaagt het
      college overeenkomstig de verordening, bedoeld in [artikel 8, eerste lid, onderdeel b][ref3], de bijstand. Van een
      verlaging wordt afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '18.3'
    text: |-
      Het college heroverweegt een besluit als bedoeld in het tweede lid binnen een door hem te bepalen termijn die ten
      hoogste drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel18
  - number: '18.4'
    text: Bij de toepassing van het eerste lid wordt onder belanghebbende mede verstaan het gezin.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel18
  - number: '19.1'
    text: |-
      Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op algemene bijstand indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.a
    text: het in aanmerking te nemen inkomen lager is dan de bijstandsnorm; en
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel19
  - number: 19.1.b
    text: er geen in aanmerking te nemen vermogen is.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel19
  - number: '19.2'
    text: De hoogte van de algemene bijstand is het verschil tussen het inkomen en de bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel19
  - number: '19.3'
    text: In de algemene bijstand is een vakantietoeslag begrepen ter hoogte van 4,8 procent  van die bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel19
  - number: '19.4'
    text: |-
      De algemene bijstand wordt verhoogd met de loonbelasting en premies volksverzekeringen waarvoor de gemeente die
      de bijstand verleent, krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede met de
      vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '20.1'
    text: |-
      Voor belanghebbenden jonger dan 21 jaar zonder ten laste komende kinderen is de norm per kalendermaand, indien
      het betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: 20.1.a
    text: 'een alleenstaande van 18, 19 of 20 jaar:  € 196,23 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: 20.1.b
    text: 'gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn:  € 392,46 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: 20.1.c
    text: 'gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder:  € 764,02 .'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: '20.2'
    text: |-
      Voor belanghebbenden jonger dan 21 jaar met een of meer ten laste komende kinderen is de norm per kalendermaand,
      indien het betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: 20.2.a
    text: 'een alleenstaande ouder van 18, 19 of 20 jaar:  € 423,34 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: 20.2.b
    text: 'gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn:  € 619,57 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: 20.2.c
    text: 'gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder:  € 991,13 .'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel20
  - number: '21'
    text: 'Voor belanghebbenden van 21 jaar of ouder doch jonger dan 65 jaar is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel21
  - number: 21.a
    text: 'een alleenstaande:  € 567,79 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel21
  - number: 21.b
    text: 'een alleenstaande ouder:  € 794,90 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel21
  - number: 21.c
    text: 'gehuwden waarvan beide echtgenoten jonger zijn dan 65 jaar:  € 1135,57 .'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel21
  - number: '22'
    text: 'Voor belanghebbenden van 65 jaar of ouder is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel22
  - number: 22.a
    text: 'een alleenstaande:  € 843,90 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel22
  - number: 22.b
    text: 'een alleenstaande ouder:  € 1071,01 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel22
  - number: 22.c
    text: 'gehuwden waarvan beide echtgenoten 65 jaar of ouder zijn:  € 1188,16 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel22
  - number: 22.d
    text: |-
      gehuwden waarvan een echtgenoot 65 jaar of ouder is en de andere echtgenoot 21 jaar of ouder, doch jonger dan 65
      jaar:  € 1197,70 .
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel22
  - number: '23.1'
    text: 'Bij een verblijf in een inrichting is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel23
  - number: 23.1.a
    text: 'een alleenstaande of een alleenstaande ouder:  € 245,85 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel23
  - number: 23.1.b
    text: 'gehuwden:  € 382,43 .'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel23
  - number: '23.2'
    text: 'Het bedrag van de norm, bedoeld in het eerste lid, wordt verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel23
  - number: 23.2.a
    text: voor een alleenstaande of een alleenstaande ouder € 51,00;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel23
  - number: 23.2.b
    text: voor gehuwden € 73,00.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel23
  - number: '23.3'
    text: |-
      Indien een van de gehuwden in een inrichting verblijft, is de norm de som van de normen die voor ieder van hen als
      alleenstaande of alleenstaande ouder zouden gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel23
  - number: '24'
    text: |-
      Indien een van de gehuwden geen recht op algemene bijstand heeft, is voor de rechthebbende echtgenoot de norm
      gelijk aan de norm die voor hem als alleenstaande of alleenstaande ouder zou gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het college verhoogt de norm, bedoeld in [artikel 21, onderdelen a en b][ref1], met een toeslag voorzover de
      belanghebbende hogere algemeen noodzakelijke kosten van het bestaan heeft dan waarin de norm voorziet, als gevolg
      van het niet of niet geheel kunnen delen van deze kosten met een ander.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '25.2'
    text: De toeslag bedraagt ten hoogste  € 227,11  per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel25
  - number: '26'
    text: |-
      Het college kan de norm, bedoeld in
      [artikel 20, eerste lid, onderdelen b en c, en tweede lid, onderdelen b en c][ref1], en
      [artikel 21, onderdeel c][ref2], verlagen voorzover de belanghebbenden lagere algemeen noodzakelijke kosten van het
      bestaan hebben dan waarin de norm voorziet als gevolg van het geheel of gedeeltelijk kunnen delen van deze kosten
      met een ander.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27'
    text: |-
      Het college kan de norm, bedoeld in de [artikelen 20][ref1] en [21][ref2], of de toeslag, bedoeld in
      [artikel 25][ref3], lager vaststellen voorzover de belanghebbende lagere algemeen noodzakelijke kosten van het
      bestaan heeft dan waarin de norm of de toeslag voorziet als gevolg van zijn woonsituatie, waaronder begrepen het
      niet aanhouden van een woning.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '28'
    text: |-
      Het college kan voor de belanghebbende die recent de deelname heeft beëindigd aan onderwijs of een beroepsopleiding,
      de norm of de toeslag, bedoeld in [artikel 25][ref1], gedurende zes maanden na het tijdstip van die beëindiging
      lager vaststellen, indien voor het onderwijs of de beroepsopleiding aanspraak bestond op studiefinanciering
      op grond van de [Wet studiefinanciering 2000][ref2] of op een tegemoetkoming in de onderwijsbijdrage en de
      schoolkosten op grond van [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011453
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0011453
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '29.1'
    text: |-
      Het college kan de toeslag, bedoeld in [artikel 25][ref1], voor een alleenstaande van 21 of 22 jaar afwijkend
      vaststellen voorzover het van oordeel is dat, gezien de hoogte van het minimumjeugdloon, de hoogte van deze toeslag
      een belemmering kan vormen voor de aanvaarding van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '29.2'
    text: |-
      Onder het minimumjeugdloon bedoeld in het eerste lid wordt verstaan het voor de betreffende leeftijd geldende
      minimumloon bedoeld in [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] verminderd
      met de daarover verschuldigde loonheffing en de daarover verschuldigde inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
  - number: '30.1'
    text: |-
      In de verordening, bedoeld in [artikel 8, eerste lid, onderdeel c][ref1], stelt de gemeenteraad vast voor welke
      categorieën de norm wordt verhoogd of verlaagd en op grond van welke criteria de hoogte van die verhoging of
      verlaging wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '30.2'
    text: 'In deze verordening stelt de gemeenteraad in elk geval vast dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel30
  - number: 30.2.a
    text: |-
      onverminderd de [artikelen 27][ref1], [28][ref2] en [29][ref3], de toeslag, bedoeld in [artikel 25][ref4], voor
      de alleenstaande en de alleenstaande ouder met zijn ten laste komende kinderen in wiens woning geen ander zijn
      hoofdverblijf heeft, wordt bepaald op het in dat artikel genoemde maximumbedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 30.2.b
    text: |-
      jegens een belanghebbende niet gelijktijdig gebruik gemaakt wordt van de bevoegdheden bedoeld in de
      [artikelen 28][ref1] en [29, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel29
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '30.3'
    text: |-
      In de verordening worden uitsluitend verhogingen of verlagingen vastgesteld als bedoeld in de
      [artikelen 25 tot en met 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '30.4'
    text: |-
      Verhoging of verlaging van de norm of afwijkende vaststelling van de toeslag vindt plaats onverminderd
      [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '31.1'
    text: |-
      Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de alleenstaande of het gezin
      beschikt of redelijkerwijs kan beschikken. Tot de middelen worden mede gerekend de middelen die ten behoeve van het
      levensonderhoud van de belanghebbende door een niet in de bijstand begrepen persoon worden ontvangen. In elk geval
      behoort tot de middelen de ten aanzien van de alleenstaande of het gezin toepasselijke heffingskorting, bedoeld in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: '31.2'
    text: 'Niet tot de middelen van de belanghebbende worden gerekend:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.a
    text: de middelen die deze ontvangt ten behoeve van het levensonderhoud van een niet in de bijstand begrepen persoon;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.b
    text: kinderbijslag ontvangen ten behoeve van zijn in of buiten Nederland woonachtige kinderen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.c
    text: |-
      de kinderkorting en de jonggehandicaptenkorting alsmede, voor alleenstaande ouders van wie het jongste kind
      jonger dan vijf jaar is, de aanvullende alleenstaande ouderkorting, de combinatiekorting en de aanvullende
      combinatiekorting, bedoeld in [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: 31.2.d
    text: |-
      tegemoetkomingen in de zin van de [Algemene wet inkomensafhankelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: 31.2.e
    text: |-
      eigenwoningbijdrage of een bijzondere bijdrage ontvangen op grond van de [Wet bevordering eigenwoningbezit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 31.2.f
    text: |-
      vergoedingen en tegemoetkomingen, waaronder begrepen de tegemoetkoming ontvangen op grond van het Tijdelijk
      besluit tegemoetkoming buitengewone uitgaven, voor, alsmede de vermindering of teruggave van, loonbelasting of
      inkomstenbelasting en van premies volksverzekeringen op grond van kosten die niet tot de algemeen noodzakelijke
      bestaanskosten behoren, tenzij voor deze kosten bijstand wordt verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.g
    text: |-
      vrije vergoedingen en vrije verstrekkingen als bedoeld in [Hoofdstuk IIA van de Wet op de loonbelasting 1964][ref1],
      tenzij voor deze vergoedingen en verstrekkingen bijstand wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIA
  - number: 31.2.h
    text: |-
      inkomsten uit arbeid van de tot zijn last komende kinderen, alsmede door hen ontvangen uitkeringen inzake
      werkloosheid en arbeidsongeschiktheid, tenzij het de verlening van bijzondere bijstand betreft voor bijzondere
      noodzakelijke kosten van het bestaan van die kinderen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.i
    text: |-
      rente ontvangen over op grond van [artikel 34, tweede lid, onderdelen b en c][ref1], niet in aanmerking genomen
      vermogen en spaargelden;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 31.2.j
    text: |-
      een eenmalige premie van ten hoogste € 1984,00 per kalenderjaar, voor zover dit naar het oordeel van het college
      bijdraagt aan zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.k
    text: |-
      een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste een bij ministeriële regeling vast
      te stellen bedrag;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.l
    text: bij ministeriële regeling aan te wijzen uitkeringen en vergoedingen voor materiële en immateriële schade;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.m
    text: |-
      giften en andere dan de in onderdeel l bedoelde vergoedingen voor materiële en immateriële schade voorzover deze
      naar het oordeel van het college uit een oogpunt van bijstandsverlening verantwoord zijn;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.n
    text: |-
      een uitkering tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref1] die de belanghebbende
      jonger dan 21 jaar van zijn ouder of ouders ontvangt, voorzover deze uitkering op grond van [artikel 12][ref2]
      reeds in aanmerking is genomen bij de vaststelling van het recht op bijzondere bijstand;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel12
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 31.2.o
    text: |-
      inkomsten uit arbeid gedurende ten hoogste zes aaneengesloten maanden tot 25 procent van deze inkomsten, met een
      maximum van  € 163,00  per maand, voor zover hij algemene bijstand ontvangt en dit naar het oordeel van het college
      bijdraagt aan zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.2.p
    text: |-
      een financiële tegemoetkoming waarop personen met een ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref1] recht hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: 31.2.q
    text: |-
      de ten behoeve van een levensloopregeling als bedoeld in
      [artikel 19g, eerste lid, van de Wet op de loonbelasting 1964][ref1] bij een uitvoerder als bedoeld in
      [artikel 19g, derde lid, van die wet][ref2] opgebouwde voorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 31.2.r
    text: |-
      een no-claimteruggave als bedoeld in [artikel 22, eerste lid, van de Zorgverzekeringswet][ref1] of een
      tegemoetkoming als bedoeld in [artikel 9a van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel9a
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 9a
  - number: '31.3'
    text: 'De middelen worden in aanmerking genomen tot het bedrag dat resteert na aftrek van:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.3.a
    text: de daarover door de belanghebbende verschuldigde loonbelasting of inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.3.b
    text: |-
      de daarover door de belanghebbende verschuldigde premies volksverzekeringen, premies werknemersverzekeringen dan
      wel een inhouding die met een of meer van deze premies overeenkomt, alsmede de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 41 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
  - number: 31.3.c
    text: |-
      ten laste van de belanghebbende komende verplichte bijdragen ingevolge een pensioenregeling en daarmee
      vergelijkbare regelingen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: 31.3.d
    text: andere ten laste van de belanghebbende komende verplichte inhoudingen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: '31.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het in aanmerking nemen van de aanspraak op
      vakantietoeslag over een inkomen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel31
  - number: '32.1'
    text: |-
      Onder inkomen wordt verstaan de op grond van [artikel 31][ref1] in aanmerking genomen middelen voorzover deze:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 32.1.a
    text: |-
      betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, een premie als
      bedoeld in [artikel 31, tweede lid, onderdeel j][ref1], een kostenvergoeding als bedoeld in
      [artikel 31, tweede lid, onderdeel k][ref2], inkomsten uit verhuur, onderverhuur of het hebben van
      een of meer kostgangers, socialezekerheidsuitkeringen, uitkeringen tot levensonderhoud op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref3], voorlopige teruggave of teruggave van inkomstenbelasting,
      loonbelasting, premies volksverzekeringen en inkomensafhankelijke bijdragen als bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref4], dan wel naar hun aard met deze inkomsten en uitkeringen
      overeenkomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '41'
  - number: 32.1.b
    text: betrekking hebben op een periode waarover beroep op bijstand wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel32
  - number: '32.2'
    text: |-
      Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar de periode waarin deze
      zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in aanmerking
      genomen naar de periode waarin deze te gelde kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel32
  - number: '32.3'
    text: |-
      Indien een van de gehuwden geen recht op algemene bijstand heeft, wordt zijn inkomen slechts in aanmerking
      genomen voorzover het inkomen van de gehuwden tezamen, met inbegrip van de bijstand die zou worden verleend indien
      zijn inkomen niet in aanmerking wordt genomen, meer zou bedragen dan de bijstandsnorm voor gehuwden. Voor de
      vaststelling van het inkomen van de niet-rechthebbende echtgenoot is deze paragraaf van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel32
  - number: '32.4'
    text: |-
      In afwijking van het derde lid wordt, indien de gehuwden gescheiden leven, doch niet duurzaam gescheiden, het
      inkomen van de niet-rechthebbende echtgenoot slechts in aanmerking genomen voorzover het de bijstandsnorm te boven
      gaat.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel32
  - number: '33.1'
    text: |-
      Indien inkomen in natura in aanmerking wordt genomen wordt de waarde daarvan vastgesteld op het daarvoor door
      belanghebbende opgeofferde bedrag.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
  - number: '33.2'
    text: |-
      Het inkomen uit studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt in aanmerking genomen
      naar het normbedrag voor levensonderhoud waarnaar deze is berekend, met dien verstande dat het normbedrag voor
      levensonderhoud als bedoeld in [artikel 3.2 van die wet][ref2] wordt gesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 33.2.a
    text: 'voor een thuisinwonende studerende:  € 271,06  per kalendermaand;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
  - number: 33.2.b
    text: 'voor een uitwonende studerende:  € 486,94  per kalendermaand.'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
  - number: '33.3'
    text: |-
      De tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1] wordt in aanmerking genomen naar
      het normbedrag voor de basistoelage, bedoeld in [artikel 4.3 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '4'
  - number: '33.4'
    text: |-
      Indien de belanghebbende de woning bewoont met een of meer huurders, onderhuurders of kostgangers, worden de
      daaruit voortvloeiende lagere algemene noodzakelijke kosten van het bestaan als inkomen in aanmerking genomen
      voorzover het college daarmee nog geen rekening heeft gehouden bij de verhoging of verlaging van de norm, bedoeld
      in [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '33.5'
    text: |-
      Indien de alleenstaande, de alleenstaande ouder of een van de echtgenoten 65 jaar of ouder is, wordt voor
      de vaststelling van de hoogte van de algemene bijstand een in de vorm van een periodieke uitkering ontvangen
      particuliere oudedagsvoorziening buiten beschouwing gelaten tot een bedrag van:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
  - number: 33.5.a
    text: 'voor een alleenstaande en een alleenstaande ouder:  € 16,45  per kalendermaand;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
  - number: 33.5.b
    text: 'voor de gehuwden tezamen:  € 32,90  per kalendermaand.'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel33
  - number: '34.1'
    text: 'Onder vermogen wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.1.a
    text: |-
      de waarde van de bezittingen waarover de alleenstaande of het gezin beschikt of redelijkerwijs kan beschikken,
      verminderd met de aanwezige schulden. De waarde van de bezittingen wordt vastgesteld op de waarde in het
      economische verkeer bij vrije oplevering;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.1.b
    text: |-
      middelen die worden ontvangen in de periode waarover algemene bijstand is toegekend, voorzover deze geen inkomen
      betreffen als bedoeld in de [artikelen 32][ref1] en [33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel33
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '34.2'
    text: 'Niet als vermogen wordt in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.2.a
    text: |-
      bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van persoon en gezin, noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.2.b
    text: |-
      het bij de aanvang van de bijstand aanwezige vermogen voorzover dit minder bedraagt dan de van toepassing zijnde
      vermogensgrens, genoemd in het derde lid;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.2.c
    text: spaargelden opgebouwd tijdens de periode waarin bijstand wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.2.d
    text: |-
      het vermogen gebonden in de woning met bijbehorend erf, bedoeld in [artikel 50, eerste lid][ref1], voorzover dit
      minder bedraagt dan  € 42 000,00 ;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel50
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 34.2.e
    text: |-
      vergoedingen voor immateriële schade als bedoeld in [artikel 31, tweede lid, onderdelen l en m][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 34.2.f
    text: |-
      de voorziening, bedoeld in [artikel 31, tweede lid, onderdeel q][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '34.3'
    text: 'De in het tweede lid, onderdeel b, bedoelde vermogensgrens is:'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.3.a
    text: 'voor een alleenstaande:  € 4975,00 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.3.b
    text: 'voor een alleenstaande ouder:  € 9950,00 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.3.c
    text: 'voor de gehuwden tezamen:  € 9950,00 .'
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: '34.4'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op bezittingen die worden verworven in de periode waarover
      algemene bijstand is toegekend en op middelen als bedoeld in het eerste lid, onderdeel b, met dien verstande dat de
      van toepassing zijnde vermogensgrens, bedoeld in het derde lid, daarbij wordt verminderd met het vermogen dat:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.4.a
    text: bij aanvang van de bijstandsverlening niet in aanmerking is genomen op grond van het tweede lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: 34.4.b
    text: tijdens de bijstandsverlening niet in aanmerking is genomen op grond van dit lid.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel34
  - number: '35.1'
    text: |-
      Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op bijzondere bijstand voorzover
      de alleenstaande of het gezin niet beschikt over de middelen om te voorzien in de uit bijzondere omstandigheden
      voortvloeiende noodzakelijke kosten van het bestaan en deze kosten naar het oordeel van het college niet kunnen
      worden voldaan uit de bijstandsnorm, de langdurigheidstoeslag, het vermogen en het inkomen voorzover dit meer
      bedraagt dan de bijstandsnorm, waarbij [artikel 31, tweede lid][ref2], en [artikel 34, tweede lid][ref3], niet van
      toepassing zijn. Het college bepaalt het begin en de duur van de periode waarover het vermogen en het inkomen in
      aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '35.2'
    text: |-
      Het college kan bijzondere bijstand weigeren, indien de in het eerste lid bedoelde kosten binnen twaalf maanden een
      bedrag van  € 107,00  niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon van 65 jaar of ouder, behorend tot een
      bepaalde categorie, worden verleend, zonder dat wordt nagegaan of ten aanzien van die persoon de hierna bedoelde
      kosten ook daadwerkelijk noodzakelijk zijn of gemaakt zijn, indien ten aanzien van de categorie waartoe hij behoort
      aannemelijk is dat die zich in bijzondere omstandigheden bevindt die leiden tot bepaalde noodzakelijke kosten van
      bestaan waarin de algemene bijstand niet voorziet en die de aanwezige draagkracht te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel35
  - number: '35.4'
    text: |-
      Voorzover de gemeente krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, wordt de bijzondere
      bijstand verhoogd met de loonbelasting en premies volksverzekeringen, alsmede met de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '36.1'
    text: |-
      Het college verleent op aanvraag een langdurigheidstoeslag aan een persoon van 23 jaar of ouder doch jonger dan 65
      jaar die:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: 36.1.a
    text: |-
      gedurende een ononderbroken periode van 60 maanden een inkomen heeft dat niet hoger is dan de bijstandsnorm en geen
      in aanmerking te nemen vermogen als bedoeld in [artikel 34][ref1] heeft;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 36.1.b
    text: gedurende de in onderdeel a bedoelde periode geen inkomsten uit of in verband met arbeid heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: 36.1.c
    text: |-
      gedurende de in onderdeel a bedoelde periode naar het oordeel van het college voldoende heeft getracht algemeen
      geaccepteerde arbeid te verkrijgen en aanvaarden, en;
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: 36.1.d
    text: |-
      na een periode als bedoeld in onderdeel a, binnen een periode van twaalf maanden niet voor een
      langdurigheidstoeslag in aanmerking is gekomen.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: '36.2'
    text: |-
      Bij de vaststelling van het inkomen, bedoeld in het eerste lid, onderdeel a, wordt een eerder verstrekte
      langdurigheidstoeslag buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: '36.3'
    text: |-
      De langdurigheidstoeslag wordt verleend met ingang van de datum waarop een periode als bedoeld in het eerste lid,
      onderdeel a, is bereikt.
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: '36.4'
    text: |-
      In afwijking van het eerste lid verleent het college op aanvraag een langdurigheidstoeslag aan een persoon van 23
      jaar of ouder:
    url: https://wetten.overheid.nl/BWBR0015703/2006-01-01#Artikel36
  - number: 36.4.a
    text: |-
      die recht heeft op een arbeidsongeschiktheidsuitkering op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref1], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref2]
      of de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref3], berekend naar een arbeidsongeschiktheid
      van tenminste 80 procent dan wel recht heeft op een arbeidsongeschiktheidsuitkering op grond van
      [hoofdstuk 6 van de Wet werk en inkomen naar arbeidsvermogen][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0002524
      [ref2]: https://wetten.overheid.nl/BWBR0008656
      [ref3]: https://wetten.overheid.nl/BWBR0008657
      [ref4]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk6
