        bwb_id: BWBR0002399
        artikel: '8'
  - number: '6.2'
    text: |-
      Voor de toepassing van deze wet wordt niet als algemeen geaccepteerde arbeid beschouwd arbeid op grond van
      een dienstbetrekking als bedoeld in [hoofdstuk 2][ref1] of [3 van de Wet sociale werkvoorziening][ref2].
      Voor de toepassing van de [artikelen 7][ref3], [8][ref4] en [10][ref5] wordt voor personen die blijkens een
      indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoren van de [Wet sociale werkvoorziening][ref6]
      onder een voorziening gericht op arbeidsinschakeling mede verstaan een voorziening gericht op het verkrijgen van
      arbeid in een dienstbetrekking als bedoeld in de [artikelen 2][ref7] en [7 van die wet][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008903#Hoofdstuk3
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0008903
      [ref7]: https://wetten.overheid.nl/BWBR0008903#Artikel2
      [ref8]: https://wetten.overheid.nl/BWBR0008903#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008903
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008903
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref5
        bwb_id: BWBR0015703
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref6
        bwb_id: BWBR0008903
      - id: ref7
        bwb_id: BWBR0008903
        artikel: '2'
      - id: ref8
        bwb_id: BWBR0008903
        artikel: '7'
  - number: '7.1'
    text: 'Het college is verantwoordelijk voor:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel7
  - number: 7.1.a
    text: |-
      het ondersteunen van personen die algemene bijstand ontvangen, personen als bedoeld in
      [artikel 10, tweede lid][ref1], personen met een nabestaanden- of halfwezenuitkering op grond van de
      [Algemene nabestaandenwet][ref2] en niet-uitkeringsgerechtigden bij arbeidsinschakeling en, indien het college
      daarbij het aanbieden van een voorziening, waaronder begrepen sociale activering, gericht op arbeidsinschakeling
      noodzakelijk acht, voor het bepalen en aanbieden van deze voorziening, en;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0007795
  - number: 7.1.b
    text: |-
      het verlenen van bijstand aan personen hier te lande die in zodanige omstandigheden verkeren of dreigen te geraken
      dat zij niet over de middelen beschikken om in de noodzakelijke kosten van het bestaan te voorzien.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel7
  - number: '7.2'
    text: |-
      Het college werkt bij de uitvoering van het eerste lid, onderdeel a, samen met het Uitvoeringsinstituut
      werknemersverzekeringen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid, aanhef en onderdeel a, is niet van toepassing op personen aan wie het Uitvoeringsinstituut
      werknemersverzekeringen een uitkering verstrekt. Het college en het Uitvoeringsinstituut werknemersverzekeringen
      kunnen overeenkomen dat het eerste lid, aanhef en onderdeel a, van toepassing is op voornoemde personen. Daarnaast
      kunnen het college en het Uitvoeringsinstituut werknemersverzekeringen overeenkomen dat het college aan voornoemde
      personen een voorziening aanbiedt als bedoeld in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel7
  - number: '7.4'
    text: |-
      Het college kan de uitvoering van deze wet, behoudens de vaststelling van de rechten en plichten van de
      belanghebbende en de daarvoor noodzakelijke beoordeling van zijn omstandigheden, door derden laten verrichten. Het
      college kan de in de eerste volzin bedoelde vaststelling en beoordeling mandateren aan bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel7
  - number: '7.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het tweede tot en
      met vierde lid.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel7
  - number: '8.1'
    text: 'De gemeenteraad stelt bij verordening regels met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
  - number: 8.1.a
    text: |-
      het ondersteunen bij arbeidsinschakeling en het aanbieden van voorzieningen gericht op arbeidsinschakeling, bedoeld
      in [artikel 7, eerste lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 8.1.b
    text: |-
      het verlagen van de bijstand, bedoeld in [artikel 18, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: 8.1.c
    text: |-
      het verhogen en verlagen van de norm, bedoeld in [artikel 30][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel30
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 8.1.d
    text: |-
      het verlenen van een langdurigheidstoeslag als bedoeld in [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel36
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 8.1.e
    text: |-
      de scholing of opleiding, bedoeld in [artikel 10a, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 8.1.f
    text: |-
      de premie, bedoeld in [artikel 10a, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel10a
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 10a
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '8.2'
    text: 'De regels, bedoeld in het eerste lid, hebben:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
  - number: 8.2.a
    text: |-
      voor zover het gaat om het eerste lid, onderdeel a, in ieder geval betrekking op de evenwichtige aandacht voor de
      in [artikel 7, eerste lid, onderdeel a][ref1], genoemde groepen, alsmede voor verschillende doelgroepen daarbinnen,
      en op de wijze waarop rekening wordt gehouden met zorgtaken;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 8.2.b
    text: |-
      voor zover het gaat om het eerste lid, onderdeel d, in ieder geval betrekking op de hoogte van de
      langdurigheidstoeslag en de wijze waarop invulling wordt gegeven aan de begrippen langdurig en laag inkomen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
  - number: 8.2.c
    text: |-
      voor zover het gaat om het eerste lid, onderdeel f, in ieder geval betrekking op de hoogte van de premie in relatie
      tot de armoedeval.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8
  - number: 8a
    text: |-
      De gemeenteraad stelt in het kader van het financiële beheer bij verordening regels voor de bestrijding van het ten
      onrechte ontvangen van bijstand alsmede van misbruik en oneigenlijk gebruik van de wet.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8a
  - number: 8b
    text: |-
      Indien bij een gemeenschappelijke regeling als bedoeld in de [Wet gemeenschappelijke regelingen][ref1] de
      uitvoering van deze wet volledig is overgedragen aan het bestuur van een openbaar lichaam als bedoeld in
      [artikel 8 van die wet][ref2], treedt dat bestuur voor de toepassing van deze wet, met uitzondering van
      [paragrafen 7.1][ref3] en [7.3][ref4], in de plaats van de betrokken colleges.


      [ref1]: https://wetten.overheid.nl/BWBR0003740
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk7
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0003740
      - id: ref2
        bwb_id: BWBR0003740
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0015703
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref4
        bwb_id: BWBR0015703
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: '9.1'
    text: |-
      De belanghebbende van 18 jaar of ouder doch jonger dan 65 jaar is, vanaf de dag van melding als bedoeld in
      [artikel 44, tweede lid][ref1], verplicht:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 9.1.a
    text: |-
      naar vermogen algemeen geaccepteerde arbeid, waarbij geen gebruik wordt gemaakt van een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref1], te verkrijgen en deze te aanvaarden, waaronder begrepen registratie als
      werkzoekende bij het Uitvoeringsinstituut werknemersverzekeringen, indien hem daartoe het recht toekomt op grond
      van [artikel 30b, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30b
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30b
  - number: 9.1.b
    text: |-
      gebruik te maken van een door het college aangeboden voorziening, waaronder begrepen sociale activering, gericht op
      arbeidsinschakeling, alsmede mee te werken aan een onderzoek naar zijn mogelijkheden tot arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9
  - number: '9.2'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn, kan het college in individuele gevallen tijdelijk ontheffing
      verlenen van een verplichting als bedoeld in het eerste lid. Zorgtaken kunnen als dringende redenen worden
      aangemerkt, voorzover hiermee geen rekening kan worden gehouden door middel van een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '9.3'
    text: Indien bijstand wordt verleend aan gehuwden gelden de verplichtingen bedoeld in het eerste lid voor ieder van hen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9
  - number: '9.4'
    text: |-
      De verplichting om algemeen geaccepteerde arbeid te aanvaarden geldt voor de alleenstaande ouder met kinderen tot
      12 jaar slechts nadat het college zich genoegzaam heeft overtuigd van de beschikbaarheid van passende kinderopvang,
      de toepassing van voldoende scholing en de belastbaarheid van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9
  - number: '9.5'
    text: |-
      De verplichtingen, bedoeld in het eerste lid, zijn niet van toepassing op de persoon die
      blijkens een indicatiebeschikking of herindicatiebeschikking tot de doelgroep behoort van de
      [Wet sociale werkvoorziening][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008903
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008903
  - number: 9a.1
    text: |-
      Onverminderd [artikel 9, tweede lid][ref1], verleent het college aan een alleenstaande ouder die de volledige zorg
      heeft voor een tot zijn last komend kind tot vijf jaar op diens verzoek ontheffing van de verplichting, bedoeld in
      [artikel 9, eerste lid, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.2
    text: De ontheffing, bedoeld in het eerste lid, wordt eenmalig verleend.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
  - number: 9a.3
    text: |-
      De ontheffing, bedoeld in het eerste lid, wordt niet verleend voor zover uit houding en
      gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat deze de verplichtingen, bedoeld in
      [artikel 9, eerste lid, onderdeel b][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.4
    text: |-
      De ontheffing, bedoeld in het eerste lid, geldt zolang het jongste kind van de alleenstaande ouder de leeftijd
      van vijf jaar nog niet heeft bereikt. Onverminderd de eerste zin geldt de ontheffing gedurende ten hoogste
      zes jaar. Op deze periode worden in mindering gebracht de periode, dan wel perioden, waarin de alleenstaande
      ouder in de voorgaande woonplaats, dan wel in de voorgaande woonplaatsen, gebruik heeft gemaakt van de
      ontheffing, bedoeld in het eerste lid, alsmede de periode, dan wel perioden, waarin toepassing is gegeven aan
      [artikel 17, vierde lid, van de Wet investeren in jongeren][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026054#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0026054
        artikel: '17'
  - number: 9a.5
    text: 'De ontheffing, bedoeld in het eerste lid, wordt, indien de volledige duur van zes jaar nog niet volledig is benut:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
  - number: 9a.5.a
    text: van rechtswege opgeschort, met ingang van de datum waarop het jongste kind de leeftijd van vijf jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
  - number: 9a.5.b
    text: van rechtswege opgeschort indien niet langer recht op bijstand bestaat;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
  - number: 9a.5.c
    text: |-
      door het college opgeschort op een daartoe strekkend verzoek van de alleenstaande ouder aan wie de ontheffing,
      bedoeld in het eerste lid, is verleend; of
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
  - number: 9a.5.d
    text: |-
      door het college opgeschort indien uit houding en gedragingen van de alleenstaande ouder ondubbelzinnig blijkt dat
      hij zijn verplichtingen, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], niet wil nakomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.6
    text: |-
      Op een daartoe strekkend verzoek van de alleenstaande ouder met een kind tot vijf jaar beëindigt het college een
      opschorting als bedoeld in het vijfde lid indien de daarin genoemde omstandigheden niet langer van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
  - number: 9a.7
    text: |-
      Het college stelt binnen zes maanden na ontvangst van het verzoek, bedoeld in het eerste lid, een plan van
      aanpak op voor de invulling van de voorziening, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], voor de
      alleenstaande ouder aan wie een ontheffing is verleend als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.8
    text: |-
      Het college vult de voorziening, bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], voor de alleenstaande ouder
      aan wie een ontheffing is verleend als bedoeld in het eerste lid en die niet beschikt over een startkwalificatie
      ten minste in met scholing of opleiding die de toegang tot de arbeidsmarkt bevordert, tenzij naar het oordeel van
      het college een dergelijke scholing of opleiding de krachten of bekwaamheden van de alleenstaande ouder te boven
      gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.9
    text: |-
      Op verzoek van de alleenstaande ouder die beschikt over een startkwalificatie en aan wie
      een ontheffing is verleend als bedoeld in het eerste lid, vult het college de voorziening,
      bedoeld in [artikel 9, eerste lid, onderdeel b][ref1], in met een opleiding, als bedoeld in
      [artikel 7.2.2., tweede lid, onder a, van de Wet educatie en beroepsonderwijs][ref2], die de toegang tot de
      arbeidsmarkt bevordert, tenzij naar het oordeel van het college een dergelijke scholing of opleiding de krachten of
      bekwaamheden van de alleenstaande ouder te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: 9a.10
    text: |-
      De alleenstaande ouder met een kind tot vijf jaar die op de dag voorafgaand aan de inwerkingtreding van de
      [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1] op grond van [artikel 9, tweede lid][ref2],
      tijdelijk ontheven is van een verplichting als bedoeld in [artikel 9, eerste lid][ref3], behoudt die tijdelijke
      ontheffing:


      [ref1]: https://wetten.overheid.nl/BWBR0025029
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0025029
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 9a.10.a
    text: |-
      tot het tijdstip dat in de desbetreffende beschikking is bepaald, doch uiterlijk tot twaalf maanden na
      inwerkingtreding van de [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0025029
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0025029
  - number: 9a.10.b
    text: |-
      indien vóór het bereiken van het van toepassing zijnde tijdstip, bedoeld onder a, door de alleenstaande ouder een
      verzoek als bedoeld in het eerste lid wordt ingediend, tot het tijdstip waarop op dat verzoek door het college
      is beslist.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
  - number: 9a.11
    text: |-
      Indien de alleenstaande ouder een verzoek tot ontheffing als bedoeld in het eerste lid heeft ingediend binnen
      zes maanden na inwerkingtreding van de [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1] stelt het
      college, in afwijking van het zevende lid, uiterlijk twaalf maanden na inwerkingtreding van die wet een plan van
      aanpak op als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025029
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0025029
  - number: 9a.12
    text: |-
      Het tiende en elfde lid en dit lid vervallen met ingang van de eerste dag van de dertiende kalendermaand na de
      datum van inwerkingtreding van de [Wet verbetering arbeidsmarktpositie alleenstaande ouders][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025029
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0025029
  - number: '10.1'
    text: |-
      Personen die algemene bijstand ontvangen, personen met een nabestaanden- of halfwezenuitkering op grond van de
      [Algemene nabestaandenwet][ref1] en niet-uitkeringsgerechtigden hebben, overeenkomstig de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel a][ref2], aanspraak op ondersteuning bij arbeidsinschakeling en op de naar het
      oordeel van het college noodzakelijk geachte voorziening gericht op arbeidsinschakeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007795
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007795
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '10.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op personen die vanwege een voorziening gericht op
      arbeidsinschakeling niet tot een van de groepen, bedoeld in het eerste lid, behoren.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10
  - number: '10.3'
    text: |-
      [Artikel 40, eerste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: 10a.1
    text: |-
      Het college kan ter uitvoering van [artikel 7, eerste lid, onderdeel a][ref1], degene die algemene bijstand
      ontvangt en voor wie de kans op inschakeling in het arbeidsproces gering is en die daardoor vooralsnog niet
      bemiddelbaar is op de arbeidsmarkt, onbeloonde additionele werkzaamheden laten verrichten gedurende maximaal twee
      jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 10a.2
    text: |-
      Onder additionele werkzaamheden als bedoeld in het eerste lid worden primair op de arbeidsinschakeling gerichte
      werkzaamheden verstaan die onder verantwoordelijkheid van het college in het kader van deze wet worden verricht
      naast of in aanvulling op reguliere arbeid, en die niet leiden tot verdringing op de arbeidsmarkt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
  - number: 10a.3
    text: |-
      Voor de termijn van twee jaar, bedoeld in het eerste lid, worden werkzaamheden, verricht in het kader van een
      andere voorziening als bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], voor maximaal zes maanden buiten
      beschouwing gelaten indien er naar het oordeel van het college een reëel uitzicht is op een dienstbetrekking bij
      degene bij wie de werkzaamheden worden verricht van dezelfde of grotere omvang die aanvangt tijdens of aansluitend
      op die zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 10a.4
    text: |-
      Voor de termijn van twee jaar, bedoeld in het eerste lid, worden werkzaamheden verricht voor 1 januari 2007, buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
  - number: 10a.5
    text: |-
      Het college biedt aan degene die op grond van dit artikel additionele werkzaamheden verricht en die niet beschikt
      over een startkwalificatie na een periode van zes maanden na aanvang van die werkzaamheden een voorziening gericht
      op arbeidsinschakeling aan in de vorm van scholing of opleiding die de toegang tot de arbeidsmarkt bevordert,
      tenzij naar het oordeel van het college een dergelijke scholing of opleiding de krachten of bekwaamheden van
      de belanghebbende te boven gaat. Geen scholing of opleiding wordt aangeboden indien scholing of opleiding naar
      het oordeel van het college niet bijdraagt aan vergroting van de kans op inschakeling in het arbeidsproces van
      belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
  - number: 10a.6
    text: |-
      Het college verstrekt aan belanghebbende, telkens nadat hij gedurende zes maanden op grond van dit artikel
      additionele werkzaamheden heeft verricht, een premie als bedoeld in [artikel 31, tweede lid, onderdeel j][ref1],
      indien hij naar het oordeel van het college in die zes maanden voldoende heeft meegewerkt aan het vergroten van
      zijn kans op inschakeling in het arbeidsproces.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 10a.7
    text: |-
      Indien het college en het Uitvoeringsinstituut werknemersverzekeringen zijn overeengekomen dat
      [artikel 7, eerste lid, onderdeel a][ref1], van toepassing is op een persoon aan wie het Uitvoeringsinstituut
      werknemersverzekeringen een uitkering verstrekt, dient bij de toepassing van het eerste lid voor «algemene
      bijstand» te worden gelezen: uitkering van het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 10a.8
    text: |-
      Met betrekking tot degene die op grond van het eerste lid additionele werkzaamheden verricht, beoordeelt het
      college na een periode van negen maanden na de aanvang van die werkzaamheden of de toepassing van dit artikel zijn
      kans op inschakeling in het arbeidsproces heeft vergroot. Indien dat niet het geval is wordt het verrichten van de
      additionele werkzaamheden twaalf maanden na aanvang van die werkzaamheden beëindigd.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
  - number: 10a.9
    text: |-
      Met betrekking tot degene die op grond van het eerste lid additionele werkzaamheden verricht, beoordeelt het
      college voor afloop van de termijn van twee jaar, bedoeld in het eerste lid, of de voortzetting daarvan met het
      oog op in de persoon gelegen factoren zijn kans op inschakeling in het arbeidsproces aanmerkelijk verbetert. Indien
      dat het geval is, kan het college de termijn van twee jaar verlengen met een jaar, onder de voorwaarde dat de
      belanghebbende in het derde jaar in een andere omgeving andere additionele werkzaamheden verricht dan die hij in de
      eerste twee jaar heeft verricht.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
  - number: 10a.10
    text: |-
      Indien de termijn van twee jaar is verlengd op grond van het negende lid, beoordeelt het college voor afloop van
      het derde jaar of de voortzetting daarvan met het oog op in de persoon gelegen factoren zijn kans op inschakeling
      in het arbeidsproces aanmerkelijk verbetert. Indien dat het geval is, kan het college de termijn nogmaals verlengen
      met een jaar.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel10a
  - number: '11.1'
    text: |-
      Iedere in Nederland woonachtige Nederlander die hier te lande in zodanige omstandigheden verkeert of dreigt te
      geraken dat hij niet over de middelen beschikt om in de noodzakelijke kosten van bestaan te voorzien, heeft recht
      op bijstand van overheidswege.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel11
  - number: '11.2'
    text: |-
      Met de Nederlander, bedoeld in het eerste lid, wordt gelijkgesteld de hier te lande
      woonachtige vreemdeling die rechtmatig in Nederland verblijf houdt in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], met uitzondering van de gevallen,
      bedoeld in artikel 24, tweede lid, van [Richtlijn 2004/38/EG](32004L0038).


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere hier te lande woonachtige vreemdelingen dan de in het tweede lid
      bedoelde voor de toepassing van deze wet met een Nederlander gelijk worden gesteld:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel11
  - number: 11.3.a
    text: ter uitvoering van een verdrag dan wel van een besluit van een volkenrechtelijke organisatie, of
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel11
  - number: 11.3.b
    text: |-
      indien zij, na rechtmatig verblijf te hebben gehouden in de zin van
      [artikel 8, onderdelen a tot en met e en l, van de Vreemdelingenwet 2000][ref1], rechtmatig in Nederland verblijf
      hebben als bedoeld in [artikel 8, onderdeel g of h, van die wet][ref2] en zij aan de in die algemene maatregel van
      bestuur gestelde voorwaarden voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0011823
        artikel: '8'
  - number: '11.4'
    text: |-
      Het recht op bijstand komt de echtgenoten gezamenlijk toe, tenzij een van de echtgenoten geen recht op bijstand
      heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel11
  - number: '12'
    text: |-
      Een persoon van 18, 19 of 20 jaar heeft recht op bijzondere bijstand voorzover zijn noodzakelijke kosten van het
      bestaan uitgaan boven de bijstandsnorm en hij voor deze kosten geen beroep kan doen op zijn ouders, omdat:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel12
  - number: 12.a
    text: de middelen van de ouders daartoe niet toereikend zijn; of
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel12
  - number: 12.b
    text: hij redelijkerwijs zijn onderhoudsrecht jegens zijn ouders niet te gelde kan maken.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel12
  - number: '13.1'
    text: 'Geen recht op bijstand heeft degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.1.a
    text: aan wie rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.1.b
    text: die zijn militaire of vervangende dienstplicht vervult;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.1.c
    text: |-
      die wegens werkstaking of uitsluiting niet deelneemt aan de arbeid, voorzover diens gebrek aan middelen daarvan het
      gevolg is;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.1.d
    text: |-
      die per kalenderjaar langer dan vier weken verblijf houdt buiten Nederland dan wel een aaneengesloten periode van
      langer dan vier weken verblijf houdt buiten Nederland;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.1.e
    text: die jonger is dan 18 jaar, voor zover het het recht op bijzondere bijstand betreft;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.1.f
    text: |-
      die bijstand vraagt ter gedeeltelijke of volledige aflossing van een schuldenlast en die overigens bij het ontstaan
      van de schuldenlast, dan wel nadien, beschikte of beschikt over de middelen om in de noodzakelijke kosten van het
      bestaan te voorzien.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: '13.2'
    text: 'Geen recht op algemene bijstand heeft degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.2.a
    text: van 18, 19 of 20 jaar die in een inrichting verblijft;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.2.b
    text: |-
      die uitkering op grond van de [Wet werk en inkomen kunstenaars][ref1] ontvangt of die gehuwd is met een persoon die
      een zodanige uitkering ontvangt;


      [ref1]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017837
  - number: 13.2.c
    text: |-
      die onbetaald verlof geniet als bedoeld in [artikel 1, onderdeel g, van de Werkloosheidswet][ref1] of die gehuwd
      is met een zodanig persoon, voorzover diens gebrek aan middelen daarvan het gevolg is, tenzij de belanghebbende
      alleenstaande ouder is en hij verlof geniet als bedoeld in [hoofdstuk 6 van de Wet arbeid en zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013008#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0013008
        hoofdstuk: '6'
  - number: '13.3'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten een
      penitentiaire inrichting, een inrichting voor verpleging van ter beschikking gestelden of een inrichting als bedoeld
      in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1]. Het eerste lid, onderdeel
      a, is, voor zover het het recht op bijzondere bijstand betreft, niet van toepassing op de persoon aan wie rechtens
      zijn vrijheid is ontnomen op grond van de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref2], dan wel
      van [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref3] of, na ontslag van alle rechtsvervolging, van
      [artikel 37b, eerste lid, van het Wetboek van Strafrecht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005700
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0001854#Artikel37b
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005700
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '37'
      - id: ref4
        bwb_id: BWBR0001854
        artikel: 37b
  - number: '13.4'
    text: 'In afwijking van het eerste lid, onderdeel d, geldt:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: 13.4.a
    text: |-
      voor personen jonger dan 65 jaar, aan wie op grond van [artikel 9, tweede lid][ref1], ontheffing is verleend van de
      verplichtingen, bedoeld in [artikel 9, eerste lid, onderdelen a en b][ref2], een periode van 13 weken;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: 13.4.b
    text: voor personen van 65 jaar of ouder, een periode van 26 weken.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel13
  - number: '14'
    text: 'In ieder geval worden niet tot de noodzakelijke kosten van het bestaan gerekend kosten met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel14
  - number: 14.a
    text: de voldoening aan alimentatieverplichtingen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel14
  - number: 14.b
    text: de betaling van een boete;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel14
  - number: 14.c
    text: geleden of toegebrachte schade;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel14
  - number: 14.d
    text: vrijwillige premiebetaling in het kader van een publiekrechtelijke verzekering;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel14
  - number: 14.e
    text: |-
      kosten van medische handelingen en verrichtingen die gerekend kunnen worden tot de ontwikkelingsgeneeskunde als
      bedoeld in de [Wet op bijzondere medische verrichtingen][ref1], of wanneer zodanige medische behandelingen en
      verrichtingen buiten Nederland plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008974
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008974
  - number: '15.1'
    text: |-
      Geen recht op bijstand bestaat voorzover een beroep kan worden gedaan op een voorliggende voorziening die, gezien
      haar aard en doel, wordt geacht voor de belanghebbende toereikend en passend te zijn. Het recht op bijstand strekt
      zich evenmin uit tot kosten die in de voorliggende voorziening als niet noodzakelijk worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel15
  - number: '15.2'
    text: |-
      De [Wet werk en inkomen kunstenaars][ref1] geldt niet als een voorliggende voorziening als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0017837
  - number: '16.1'
    text: |-
      Aan een persoon die geen recht op bijstand heeft, kan het college, gelet op alle omstandigheden, in afwijking van
      deze paragraaf, bijstand verlenen indien zeer dringende redenen daartoe noodzaken.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel16
  - number: '16.2'
    text: |-
      Het eerste lid is niet van toepassing op andere vreemdelingen dan die, bedoeld in
      [artikel 11, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel11
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '17.1'
    text: |-
      De belanghebbende doet aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle feiten
      en omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op zijn
      arbeidsinschakeling of het recht op bijstand. Deze verplichting geldt niet indien die feiten en omstandigheden door
      het college kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens of
      kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij ministeriële regeling wordt
      bepaald voor welke gegevens de tweede zin van toepassing is.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel17
  - number: '17.2'
    text: |-
      De belanghebbende is verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs nodig is
      voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel17
  - number: '17.3'
    text: |-
      Het college stelt bij de uitvoering van deze wet de identiteit van
      de belanghebbende vast aan de hand van een document als bedoeld in
      [artikel 1, eerste lid, onder 1º tot en met 3º, van de Wet op de identificatieplicht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '17.4'
    text: |-
      Een ieder is verplicht aan het college desgevraagd een document als bedoeld in
      [artikel 1 van de Wet op de identificatieplicht][ref1] terstond ter inzage te verstrekken, voorzover dit
      redelijkerwijs nodig is voor de uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '18.1'
    text: |-
      Het college stemt de bijstand en de daaraan verbonden verplichtingen af op de omstandigheden, mogelijkheden en
      middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel18
  - number: '18.2'
    text: |-
      Het college verlaagt de bijstand overeenkomstig de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel b][ref1], ter zake van het niet of onvoldoende nakomen door de belanghebbende
      van de verplichtingen voortvloeiende uit deze wet dan wel de [artikelen 28, tweede lid][ref2], of
      [29, eerste lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3], waaronder begrepen het zich
      jegens het college zeer ernstig misdragen, dan wel indien de belanghebbende naar het oordeel van het college
      tekortschietend besef van verantwoordelijkheid betoont voor de voorziening in het bestaan. Van een verlaging wordt
      afgezien, indien elke vorm van verwijtbaarheid ontbreekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel29
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '28'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '29'
  - number: '18.3'
    text: |-
      Het college heroverweegt een besluit als bedoeld in het tweede lid binnen een door hem te bepalen termijn die ten
      hoogste drie maanden bedraagt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel18
  - number: '18.4'
    text: Bij de toepassing van het eerste lid wordt onder belanghebbende mede verstaan het gezin.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel18
  - number: '19.1'
    text: |-
      Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op algemene bijstand indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 19.1.a
    text: het in aanmerking te nemen inkomen lager is dan de bijstandsnorm; en
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel19
  - number: 19.1.b
    text: er geen in aanmerking te nemen vermogen is.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel19
  - number: '19.2'
    text: De hoogte van de algemene bijstand is het verschil tussen het inkomen en de bijstandsnorm.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel19
  - number: '19.3'
    text: In de algemene bijstand is een vakantietoeslag begrepen ter hoogte van 4,8 procent  van die bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel19
  - number: '19.4'
    text: |-
      De algemene bijstand wordt verhoogd met de loonbelasting en premies volksverzekeringen waarvoor de gemeente die
      de bijstand verleent, krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede met de
      vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '20.1'
    text: |-
      Voor belanghebbenden jonger dan 21 jaar zonder ten laste komende kinderen is de norm per kalendermaand, indien
      het betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: 20.1.a
    text: 'een alleenstaande van 18, 19 of 20 jaar:  € 196,23 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: 20.1.b
    text: 'gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn:  € 392,46 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: 20.1.c
    text: 'gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder:  € 764,02 .'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: '20.2'
    text: |-
      Voor belanghebbenden jonger dan 21 jaar met een of meer ten laste komende kinderen is de norm per kalendermaand,
      indien het betreft:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: 20.2.a
    text: 'een alleenstaande ouder van 18, 19 of 20 jaar:  € 423,34 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: 20.2.b
    text: 'gehuwden waarvan beide echtgenoten 18, 19 of 20 jaar zijn:  € 619,57 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: 20.2.c
    text: 'gehuwden waarvan een echtgenoot 18, 19 of 20 jaar is en de andere echtgenoot 21 jaar of ouder:  € 991,13 .'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel20
  - number: '21'
    text: 'Voor belanghebbenden van 21 jaar of ouder doch jonger dan 65 jaar is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel21
  - number: 21.a
    text: 'een alleenstaande:  € 567,79 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel21
  - number: 21.b
    text: 'een alleenstaande ouder:  € 794,90 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel21
  - number: 21.c
    text: 'gehuwden waarvan beide echtgenoten jonger zijn dan 65 jaar:  € 1135,57 .'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel21
  - number: '22'
    text: 'Voor belanghebbenden van 65 jaar of ouder is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel22
  - number: 22.a
    text: 'een alleenstaande:  € 843,90 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel22
  - number: 22.b
    text: 'een alleenstaande ouder:  € 1071,01 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel22
  - number: 22.c
    text: 'gehuwden waarvan beide echtgenoten 65 jaar of ouder zijn:  € 1188,16 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel22
  - number: 22.d
    text: |-
      gehuwden waarvan een echtgenoot 65 jaar of ouder is en de andere echtgenoot 21 jaar of ouder, doch jonger dan 65
      jaar:  € 1197,70 .
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel22
  - number: '23.1'
    text: 'Bij een verblijf in een inrichting is de norm per kalendermaand, indien het betreft:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel23
  - number: 23.1.a
    text: 'een alleenstaande of een alleenstaande ouder:  € 245,85 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel23
  - number: 23.1.b
    text: 'gehuwden:  € 382,43 .'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel23
  - number: '23.2'
    text: 'Het bedrag van de norm, bedoeld in het eerste lid, wordt verhoogd met:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel23
  - number: 23.2.a
    text: voor een alleenstaande of een alleenstaande ouder € 51,00 ;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel23
  - number: 23.2.b
    text: voor gehuwden € 73,00 .
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel23
  - number: '23.3'
    text: |-
      Indien een van de gehuwden in een inrichting verblijft, is de norm de som van de normen die voor ieder van hen als
      alleenstaande of alleenstaande ouder zouden gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel23
  - number: '24'
    text: |-
      Indien een van de gehuwden geen recht op algemene bijstand heeft, is voor de rechthebbende echtgenoot de norm
      gelijk aan de norm die voor hem als alleenstaande of alleenstaande ouder zou gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel24
  - number: '25.1'
    text: |-
      Het college verhoogt de norm, bedoeld in [artikel 21, onderdelen a en b][ref1], met een toeslag voorzover de
      belanghebbende hogere algemeen noodzakelijke kosten van het bestaan heeft dan waarin de norm voorziet, als gevolg
      van het niet of niet geheel kunnen delen van deze kosten met een ander.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '25.2'
    text: De toeslag bedraagt ten hoogste  € 227,11  per kalendermaand.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel25
  - number: '26'
    text: |-
      Het college kan de norm, bedoeld in
      [artikel 20, eerste lid, onderdelen b en c, en tweede lid, onderdelen b en c][ref1], en
      [artikel 21, onderdeel c][ref2], verlagen voorzover de belanghebbenden lagere algemeen noodzakelijke kosten van het
      bestaan hebben dan waarin de norm voorziet als gevolg van het geheel of gedeeltelijk kunnen delen van deze kosten
      met een ander.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '27'
    text: |-
      Het college kan de norm, bedoeld in de [artikelen 20][ref1] en [21][ref2], of de toeslag, bedoeld in
      [artikel 25][ref3], lager vaststellen voorzover de belanghebbende lagere algemeen noodzakelijke kosten van het
      bestaan heeft dan waarin de norm of de toeslag voorziet als gevolg van zijn woonsituatie, waaronder begrepen het
      niet aanhouden van een woning.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '28'
    text: |-
      Het college kan voor de belanghebbende die recent de deelname heeft beëindigd aan onderwijs of een beroepsopleiding,
      de norm of de toeslag, bedoeld in [artikel 25][ref1], gedurende zes maanden na het tijdstip van die beëindiging
      lager vaststellen, indien voor het onderwijs of de beroepsopleiding aanspraak bestond op studiefinanciering
      op grond van de [Wet studiefinanciering 2000][ref2] of op een tegemoetkoming in de onderwijsbijdrage en de
      schoolkosten op grond van [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0011453
      [ref3]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0011453
      - id: ref3
        bwb_id: BWBR0012438
        hoofdstuk: '4'
  - number: '29.1'
    text: |-
      Het college kan de toeslag, bedoeld in [artikel 25][ref1], voor een alleenstaande van 21 of 22 jaar afwijkend
      vaststellen voorzover het van oordeel is dat, gezien de hoogte van het minimumjeugdloon, de hoogte van deze toeslag
      een belemmering kan vormen voor de aanvaarding van arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '29.2'
    text: |-
      Onder het minimumjeugdloon bedoeld in het eerste lid wordt verstaan het voor de betreffende leeftijd geldende
      minimumloon bedoeld in [artikel 8, derde lid, van de Wet minimumloon en minimumvakantiebijslag][ref1] verminderd
      met de daarover verschuldigde loonheffing en de daarover verschuldigde inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
  - number: '30.1'
    text: |-
      In de verordening, bedoeld in [artikel 8, eerste lid, onderdeel c][ref1], stelt de gemeenteraad vast voor welke
      categorieën de norm wordt verhoogd of verlaagd en op grond van welke criteria de hoogte van die verhoging of
      verlaging wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '30.2'
    text: 'In deze verordening stelt de gemeenteraad in elk geval vast dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel30
  - number: 30.2.a
    text: |-
      onverminderd de [artikelen 27][ref1], [28][ref2] en [29][ref3], de toeslag, bedoeld in [artikel 25][ref4], voor
      de alleenstaande en de alleenstaande ouder met zijn ten laste komende kinderen in wiens woning geen ander zijn
      hoofdverblijf heeft, wordt bepaald op het in dat artikel genoemde maximumbedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 30.2.b
    text: |-
      jegens een belanghebbende niet gelijktijdig gebruik gemaakt wordt van de bevoegdheden bedoeld in de
      [artikelen 28][ref1] en [29, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel29
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: '3.3'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '30.3'
    text: |-
      In de verordening worden uitsluitend verhogingen of verlagingen vastgesteld als bedoeld in de
      [artikelen 25 tot en met 29][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '30.4'
    text: |-
      Verhoging of verlaging van de norm of afwijkende vaststelling van de toeslag vindt plaats onverminderd
      [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '31.1'
    text: |-
      Tot de middelen worden alle vermogens- en inkomensbestanddelen gerekend waarover de alleenstaande of het gezin
      beschikt of redelijkerwijs kan beschikken. Tot de middelen worden mede gerekend de middelen die ten behoeve van het
      levensonderhoud van de belanghebbende door een niet in de bijstand begrepen persoon worden ontvangen. In elk geval
      behoort tot de middelen de ten aanzien van de alleenstaande of het gezin toepasselijke heffingskorting, bedoeld in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: '31.2'
    text: 'Niet tot de middelen van de belanghebbende worden gerekend:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.a
    text: de middelen die deze ontvangt ten behoeve van het levensonderhoud van een niet in de bijstand begrepen persoon;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.b
    text: kinderbijslag ontvangen ten behoeve van zijn in of buiten Nederland woonachtige kinderen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.c
    text: |-
      de jonggehandicaptenkorting alsmede, voor alleenstaande ouders van wie het jongste kind jonger dan vijf
      jaar is, de aanvullende alleenstaande ouderkorting, de inkomensafhankelijke combinatiekorting, bedoeld in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: 31.2.d
    text: |-
      tegemoetkomingen in de zin van de [Algemene wet inkomensafhankelijke regelingen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018472
  - number: 31.2.e
    text: |-
      eigenwoningbijdrage of een bijzondere bijdrage ontvangen op grond van de [Wet bevordering eigenwoningbezit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0011919
  - number: 31.2.f
    text: |-
      vergoedingen en tegemoetkomingen, waaronder begrepen de tegemoetkoming ontvangen op grond van het Tijdelijk
      besluit tegemoetkoming buitengewone uitgaven, voor, alsmede de vermindering of teruggave van, loonbelasting of
      inkomstenbelasting en van premies volksverzekeringen op grond van kosten die niet tot de algemeen noodzakelijke
      bestaanskosten behoren, tenzij voor deze kosten bijstand wordt verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.g
    text: |-
      vrije vergoedingen en vrije verstrekkingen als bedoeld in [Hoofdstuk IIA van de Wet op de loonbelasting 1964][ref1],
      tenzij voor deze vergoedingen en verstrekkingen bijstand wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIA
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIA
  - number: 31.2.h
    text: |-
      inkomsten uit arbeid van de tot zijn last komende kinderen, alsmede door hen ontvangen uitkeringen inzake
      werkloosheid en arbeidsongeschiktheid, tenzij het de verlening van bijzondere bijstand betreft voor bijzondere
      noodzakelijke kosten van het bestaan van die kinderen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.i
    text: |-
      rente ontvangen over op grond van [artikel 34, tweede lid, onderdelen b en c][ref1], niet in aanmerking genomen
      vermogen en spaargelden;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 31.2.j
    text: |-
      een een- of tweemalige premie van ten hoogste € 1984,00  per kalenderjaar, voor zover dit naar het oordeel van het
      college bijdraagt aan zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.k
    text: |-
      een kostenvergoeding voor het verrichten van vrijwilligerswerk van ten hoogste een bij ministeriële regeling vast
      te stellen bedrag;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.l
    text: bij ministeriële regeling aan te wijzen uitkeringen en vergoedingen voor materiële en immateriële schade;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.m
    text: |-
      giften en andere dan de in onderdeel l bedoelde vergoedingen voor materiële en immateriële schade voorzover deze
      naar het oordeel van het college uit een oogpunt van bijstandsverlening verantwoord zijn;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.n
    text: |-
      een uitkering tot levensonderhoud op grond van [Boek 1 van het Burgerlijk Wetboek][ref1] die de belanghebbende
      jonger dan 21 jaar van zijn ouder of ouders ontvangt, voorzover deze uitkering op grond van [artikel 12][ref2]
      reeds in aanmerking is genomen bij de vaststelling van het recht op bijzondere bijstand;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel12
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002656
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 31.2.o
    text: |-
      inkomsten uit arbeid tot 25 procent van deze inkomsten, met een maximum van € 183,00  per maand, voor zover hij
      algemene bijstand ontvangt, waarbij voor een persoon jonger dan 65 jaar geldt dat die inkomsten gedurende ten
      hoogste zes aaneengesloten maanden niet tot de middelen worden gerekend en dat dit naar het oordeel van het college
      moet bijdragen aan zijn arbeidsinschakeling;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.2.p
    text: |-
      een financiële tegemoetkoming waarop personen met een ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref1] recht hebben en een financiële tegemoetkoming waarop personen met een uitkering op
      grond van de [Algemene nabestaandenwet][ref2] recht hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
  - number: 31.2.q
    text: |-
      de ten behoeve van een levensloopregeling als bedoeld in
      [artikel 19g, eerste lid, van de Wet op de loonbelasting 1964][ref1] bij een uitvoerder als bedoeld in
      [artikel 19g, derde lid, van die wet][ref2] opgebouwde voorziening;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19g
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 19g
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19g
  - number: 31.2.r
    text: |-
      een uitkering als bedoeld in [artikel 118a, eerste lid, van de Zorgverzekeringswet][ref1] of een tegemoetkoming als
      bedoeld in [artikel 9a van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0008657#Artikel9a
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0008657
        artikel: 9a
  - number: 31.2.s
    text: |-
      een vergoeding als bedoeld in [artikel 18 van de Wet inburgering][ref1] voorzover deze niet een vergoeding is als
      bedoeld in onderdeel f;


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '18'
  - number: 31.2.t
    text: |-
      tegemoetkomingen op grond van de [Wet tegemoetkoming chronisch zieken en gehandicapten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025003
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0025003
  - number: 31.2.u
    text: |-
      een uitkering als bedoeld in [artikel 19a van de Wet maatschappelijke ondersteuning][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020031#Artikel19a
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0020031
        artikel: 19a
  - number: '31.3'
    text: 'De middelen worden in aanmerking genomen tot het bedrag dat resteert na aftrek van:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.3.a
    text: de daarover door de belanghebbende verschuldigde loonbelasting of inkomstenbelasting;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.3.b
    text: |-
      de daarover door de belanghebbende verschuldigde premies volksverzekeringen, premies werknemersverzekeringen dan
      wel een inhouding die met een of meer van deze premies overeenkomt, alsmede de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 41 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
  - number: 31.3.c
    text: |-
      ten laste van de belanghebbende komende verplichte bijdragen ingevolge een pensioenregeling en daarmee
      vergelijkbare regelingen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: 31.3.d
    text: andere ten laste van de belanghebbende komende verplichte inhoudingen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: '31.4'
    text: |-
      Bij ministeriële regeling worden regels gesteld met betrekking tot het in aanmerking nemen van de aanspraak op
      vakantietoeslag over een inkomen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel31
  - number: '32.1'
    text: |-
      Onder inkomen wordt verstaan de op grond van [artikel 31][ref1] in aanmerking genomen middelen voorzover deze:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 32.1.a
    text: |-
      betreffen inkomsten uit of in verband met arbeid, inkomsten uit vermogen, een premie als
      bedoeld in [artikel 31, tweede lid, onderdeel j][ref1], een kostenvergoeding als bedoeld in
      [artikel 31, tweede lid, onderdeel k][ref2], inkomsten uit verhuur, onderverhuur of het hebben van
      een of meer kostgangers, socialezekerheidsuitkeringen, uitkeringen tot levensonderhoud op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref3], voorlopige teruggave of teruggave van inkomstenbelasting,
      loonbelasting, premies volksverzekeringen en inkomensafhankelijke bijdragen als bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref4], dan wel naar hun aard met deze inkomsten en uitkeringen
      overeenkomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0002656
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0002656
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '41'
  - number: 32.1.b
    text: betrekking hebben op een periode waarover beroep op bijstand wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel32
  - number: '32.2'
    text: |-
      Middelen die het karakter hebben van uitgesteld inkomen worden in aanmerking genomen naar de periode waarin deze
      zijn verworven. Middelen die het karakter hebben van doorbetaling van inkomen over een periode worden in aanmerking
      genomen naar de periode waarin deze te gelde kunnen worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel32
  - number: '32.3'
    text: |-
      Indien een van de gehuwden geen recht op algemene bijstand heeft, wordt zijn inkomen slechts in aanmerking
      genomen voorzover het inkomen van de gehuwden tezamen, met inbegrip van de bijstand die zou worden verleend indien
      zijn inkomen niet in aanmerking wordt genomen, meer zou bedragen dan de bijstandsnorm voor gehuwden. Voor de
      vaststelling van het inkomen van de niet-rechthebbende echtgenoot is deze paragraaf van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel32
  - number: '32.4'
    text: |-
      In afwijking van het derde lid wordt, indien de gehuwden gescheiden leven, doch niet duurzaam gescheiden, het
      inkomen van de niet-rechthebbende echtgenoot slechts in aanmerking genomen voorzover het de bijstandsnorm te boven
      gaat.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel32
  - number: '33.1'
    text: |-
      Indien inkomen in natura in aanmerking wordt genomen wordt de waarde daarvan vastgesteld op het daarvoor door
      belanghebbende opgeofferde bedrag.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
  - number: '33.2'
    text: |-
      Het inkomen uit studiefinanciering op grond van de [Wet studiefinanciering 2000][ref1] wordt in aanmerking genomen
      naar het normbedrag voor levensonderhoud waarnaar deze is berekend, met dien verstande dat het normbedrag voor
      levensonderhoud als bedoeld in [artikel 3.2 van die wet][ref2] wordt gesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
  - number: 33.2.a
    text: 'voor een thuisinwonende studerende:  € 271,06  per kalendermaand;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
  - number: 33.2.b
    text: 'voor een uitwonende studerende:  € 486,94  per kalendermaand.'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
  - number: '33.3'
    text: |-
      De tegemoetkoming in de onderwijsbijdrage en de schoolkosten op grond van
      [hoofdstuk 4 van de Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref1] wordt in aanmerking genomen naar
      het normbedrag voor de basistoelage, bedoeld in [artikel 4.3 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012438#Hoofdstuk4
      [ref2]: https://wetten.overheid.nl/BWBR0012438#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0012438
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0012438
        artikel: '4'
  - number: '33.4'
    text: |-
      Indien de belanghebbende de woning bewoont met een of meer huurders, onderhuurders of kostgangers, worden de
      daaruit voortvloeiende lagere algemene noodzakelijke kosten van het bestaan als inkomen in aanmerking genomen
      voorzover het college daarmee nog geen rekening heeft gehouden bij de verhoging of verlaging van de norm, bedoeld
      in [paragraaf 3.3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: '33.5'
    text: |-
      Indien de alleenstaande, de alleenstaande ouder of een van de echtgenoten 65 jaar of ouder is, wordt voor
      de vaststelling van de hoogte van de algemene bijstand een in de vorm van een periodieke uitkering ontvangen
      particuliere oudedagsvoorziening buiten beschouwing gelaten tot een bedrag van:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
  - number: 33.5.a
    text: 'voor een alleenstaande en een alleenstaande ouder:  € 16,45  per kalendermaand;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
  - number: 33.5.b
    text: 'voor de gehuwden tezamen:  € 32,90  per kalendermaand.'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel33
  - number: '34.1'
    text: 'Onder vermogen wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.1.a
    text: |-
      de waarde van de bezittingen waarover de alleenstaande of het gezin beschikt of redelijkerwijs kan beschikken,
      verminderd met de aanwezige schulden. De waarde van de bezittingen wordt vastgesteld op de waarde in het
      economische verkeer bij vrije oplevering;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.1.b
    text: |-
      middelen die worden ontvangen in de periode waarover algemene bijstand is toegekend, voorzover deze geen inkomen
      betreffen als bedoeld in de [artikelen 32][ref1] en [33][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel33
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '34.2'
    text: 'Niet als vermogen wordt in aanmerking genomen:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.2.a
    text: |-
      bezittingen in natura die naar hun aard en waarde algemeen gebruikelijk zijn dan wel, gelet op de omstandigheden
      van persoon en gezin, noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.2.b
    text: |-
      het bij de aanvang van de bijstand aanwezige vermogen voorzover dit minder bedraagt dan de van toepassing zijnde
      vermogensgrens, genoemd in het derde lid;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.2.c
    text: spaargelden opgebouwd tijdens de periode waarin bijstand wordt ontvangen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.2.d
    text: |-
      het vermogen gebonden in de woning met bijbehorend erf, bedoeld in [artikel 50, eerste lid][ref1], voorzover dit
      minder bedraagt dan  € 42 000,00 ;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel50
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '50'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 34.2.e
    text: |-
      vergoedingen voor immateriële schade als bedoeld in [artikel 31, tweede lid, onderdelen l en m][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 34.2.f
    text: |-
      de voorziening, bedoeld in [artikel 31, tweede lid, onderdeel q][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '34.3'
    text: 'De in het tweede lid, onderdeel b, bedoelde vermogensgrens is:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.3.a
    text: 'voor een alleenstaande:  € 4975,00 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.3.b
    text: 'voor een alleenstaande ouder:  € 9950,00 ;'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.3.c
    text: 'voor de gehuwden tezamen:  € 9950,00 .'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: '34.4'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op bezittingen die worden verworven in de periode waarover
      algemene bijstand is toegekend en op middelen als bedoeld in het eerste lid, onderdeel b, met dien verstande dat de
      van toepassing zijnde vermogensgrens, bedoeld in het derde lid, daarbij wordt verminderd met het vermogen dat:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.4.a
    text: bij aanvang van de bijstandsverlening niet in aanmerking is genomen op grond van het tweede lid, onderdeel b;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: 34.4.b
    text: tijdens de bijstandsverlening niet in aanmerking is genomen op grond van dit lid.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel34
  - number: '35.1'
    text: |-
      Onverminderd [paragraaf 2.2][ref1], heeft de alleenstaande of het gezin recht op bijzondere bijstand voorzover
      de alleenstaande of het gezin niet beschikt over de middelen om te voorzien in de uit bijzondere omstandigheden
      voortvloeiende noodzakelijke kosten van het bestaan en deze kosten naar het oordeel van het college niet kunnen
      worden voldaan uit de bijstandsnorm, de langdurigheidstoeslag, het vermogen en het inkomen voorzover dit meer
      bedraagt dan de bijstandsnorm, waarbij [artikel 31, tweede lid][ref2], en [artikel 34, tweede lid][ref3], niet van
      toepassing zijn. Het college bepaalt het begin en de duur van de periode waarover het vermogen en het inkomen in
      aanmerking wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '35.2'
    text: |-
      Het college kan bijzondere bijstand weigeren, indien de in het eerste lid bedoelde kosten binnen twaalf maanden een
      bedrag van  € 107,00  niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
  - number: '35.3'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon van 65 jaar of ouder, behorend tot een
      bepaalde categorie, worden verleend, zonder dat wordt nagegaan of ten aanzien van die persoon de hierna bedoelde
      kosten ook daadwerkelijk noodzakelijk zijn of gemaakt zijn, indien ten aanzien van de categorie waartoe hij behoort
      aannemelijk is dat die zich in bijzondere omstandigheden bevindt die leiden tot bepaalde noodzakelijke kosten van
      bestaan waarin de algemene bijstand niet voorziet en die de aanwezige draagkracht te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
  - number: '35.4'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon, behorend tot een categorie chronisch
      zieken of gehandicapten, of met een hem ten laste komend kind dat tot die categorie behoort, worden verleend met
      betrekking tot kosten in verband met chronische ziekte of handicap, zonder dat wordt nagegaan of ten behoeve van
      die persoon of dat kind die kosten ook daadwerkelijk noodzakelijk zijn of gemaakt zijn, indien ten aanzien van
      de categorie waartoe hij of dat kind behoort aannemelijk is dat die zich in bijzondere omstandigheden bevindt
      die leiden tot dergelijke noodzakelijke kosten van bestaan waarin de algemene bijstand niet voorziet en die de
      aanwezige draagkracht te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
  - number: '35.5'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon, met een hem ten laste komend kind dat
      onderwijs of een beroepsopleiding volgt, worden verleend met betrekking tot kosten in verband met maatschappelijke
      participatie van dat kind, zonder dat wordt nagegaan of ten behoeve van dat kind die kosten ook daadwerkelijk
      noodzakelijk zijn of gemaakt zijn, indien ten aanzien van de categorie waartoe hij behoort aannemelijk is dat die
      zich in bijzondere omstandigheden bevindt die leiden tot dergelijke noodzakelijke kosten van bestaan waarin de
      algemene bijstand niet voorziet en die de aanwezige draagkracht te boven gaan.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
  - number: '35.6'
    text: |-
      In afwijking van het eerste lid kan bijzondere bijstand ook aan een persoon worden verleend in de vorm van een
      collectieve aanvullende ziektekostenverzekering zonder dat wordt nagegaan of ten aanzien van die persoon de kosten
      van die verzekering ook daadwerkelijk noodzakelijk zijn of gemaakt zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
  - number: '35.7'
    text: |-
      Voor de toepassing van dit artikel wordt onder bijzondere bijstand niet verstaan langdurigheidstoeslag als bedoeld
      in [artikel 36][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel36
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '35.8'
    text: |-
      Voorzover de gemeente krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, wordt de bijzondere
      bijstand verhoogd met de loonbelasting en premies volksverzekeringen, alsmede met de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '36.1'
    text: |-
      Het college verleent op aanvraag een langdurigheidstoeslag aan een persoon van 21 jaar of ouder doch jonger dan
      65 jaar, die langdurig een laag inkomen en geen in aanmerking te nemen vermogen als bedoeld in [artikel 34][ref1]
      heeft en geen uitzicht heeft op inkomensverbetering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '36.2'
    text: |-
      Bij de vaststelling van het inkomen, bedoeld in het eerste lid, wordt een eerder verstrekte langdurigheidstoeslag
      buiten beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
  - number: '36.3'
    text: |-
      Een persoon kan slechts eenmaal binnen een periode van 12 maanden in aanmerking komen voor een
      langdurigheidstoeslag.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
  - number: '36.4'
    text: |-
      De langdurigheidstoeslag wordt verleend met ingang van de datum waarop de persoon langdurig een laag inkomen en
      geen in aanmerking te nemen vermogen als bedoeld in [artikel 34][ref1] heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '36.5'
    text: |-
      De [artikelen 12][ref1], [43][ref2], [44][ref3], [49][ref4] en [52][ref5] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel49
      [ref5]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '43'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '49'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref5
        bwb_id: BWBR0015703
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: '36.6'
    text: |-
      De [artikelen 5][ref1], [36][ref2] en [39][ref3], zoals die luidden op 31 december 2008, blijven van toepassing op
      een aanvraag voor een langdurigheidstoeslag in 2009, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel39
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '1.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '36'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '39'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 36.6.a
    text: die aanvraag ziet op een recht op een langdurigheidstoeslag dat in 2009 is ontstaan,
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
  - number: 36.6.b
    text: in 2008 een recht op een langdurigheidstoeslag is ontstaan en een aanvraag daarvoor in 2008 is ingediend, en
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
  - number: 36.6.c
    text: |-
      door toepassing van dit lid de hoogte van een langdurigheidstoeslag niet lager uitvalt dan zonder toepassing van
      dit lid het geval zou zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel36
  - number: '37.1'
    text: |-
      In deze paragraaf wordt onder netto minimumloon verstaan het minimumloon per maand, genoemd in
      [artikel 8, eerste lid, onderdeel a, van de Wet minimumloon en minimumvakantiebijslag][ref1], verhoogd
      met de aanspraak op vakantiebijslag waarop een werknemer op grond van [artikel 15 van die wet][ref2]
      over dat minimumloon ten minste aanspraak kan maken, na aftrek van de daarvan in te houden loonbelasting,
      premies volksverzekeringen, premies werknemersverzekeringen en de inkomensafhankelijke bijdrage,
      bedoeld in [artikel 41 van de Zorgverzekeringswet][ref3], en vermeerderd met de vergoeding, bedoeld in
      [artikel 46 van de Zorgverzekeringswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '15'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref4
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '37.2'
    text: |-
      De in het eerste lid bedoelde loonbelasting en premies volksverzekeringen worden berekend voor een werknemer,
      jonger dan 65 jaar, rekening houdend met uitsluitend tweemaal de algemene heffingskorting, bedoeld in
      [artikel 22 van de Wet op de loonbelasting 1964][ref1], over het minimumloon en de aanspraak op vakantiebijslag
      daarover, vermeerderd met de vergoeding, bedoeld in [artikel 46 van de Zorgverzekeringswet][ref2], en verminderd
      met de premies werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '37.3'
    text: |-
      Indien ingevolge een van de socialeverzekeringswetten een premie wordt ingehouden waarvan het percentage per
      bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen regels bij
      ministeriële regeling voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel37
  - number: '37.4'
    text: |-
      Onder consumentenprijsindex, wordt in deze afdeling verstaan hetgeen daaronder in
      [artikel 13, zesde lid, van de Algemene Kinderbijslagwet][ref1] wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002368#Artikel13
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0002368
        artikel: '13'
  - number: '38.1'
    text: 'Met ingang van de dag waarop het netto minimumloon wijzigt, worden herzien:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
  - number: 38.1.a
    text: |-
      met het percentage van deze wijziging, de normen, genoemd in de [artikelen 20][ref1] en [21][ref2], en het bedrag,
      genoemd in [artikel 25, tweede lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel25
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '3.3'
  - number: 38.1.b
    text: |-
      het percentage, genoemd in [artikel 19, derde lid][ref1], zodanig dat dit gelijk is aan de procentuele
      verhouding tussen de netto aanspraak op de minimum vakantiebijslag over het minimumloon en het netto
      minimumloon. Onder netto aanspraak op de minimum vakantiebijslag wordt verstaan het verschil tussen
      het netto minimumloon en het netto minimumloon zoals dat overeenkomstig [artikel 37, eerste lid][ref2],
      zou zijn berekend zonder rekening te houden met de aanspraak op vakantiebijslag, bedoeld in
      [artikel 15 van de Wet minimumloon en minimumvakantiebijslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0002638
        artikel: '15'
  - number: '38.2'
    text: |-
      Met ingang van de dag waarop het netto minimumloon, zonder de daarin begrepen aanspraak op vakantiebijslag,
      wijzigt, worden de bedragen, genoemd in [artikel 31, tweede lid, onderdelen j en o][ref1], herzien met het
      percentage van deze wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel31
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '38.3'
    text: |-
      Met ingang van de dag waarop het netto ouderdomspensioen en de daarbij behorende vakantie-uitkering ingevolge de
      [Algemene Ouderdomswet][ref1] wijzigen, worden de normen, genoemd in [artikel 22][ref2], herzien met het percentage
      van die wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel22
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '38.4'
    text: |-
      Met ingang van de dag waarop het netto minimumloon wijzigt, worden de normen, genoemd in
      [artikel 23, eerste lid][ref1], herzien met het percentage van deze wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel23
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '38.5'
    text: |-
      De bedragen, genoemd in [artikel 23, tweede lid][ref1], worden herzien, indien het drempelinkomen, bedoeld in de
      [Wet op de zorgtoeslag][ref2], wordt aangepast, de percentages, bedoeld in [artikel 2 van die wet][ref3], worden
      gewijzigd of het bedrag van de standaardpremie op grond van [artikel 4 van die wet][ref4] op een ander bedrag wordt
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0018451
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '3.2'
      - id: ref2
        bwb_id: BWBR0018451
      - id: ref3
        bwb_id: BWBR0018451
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0018451
        artikel: '4'
  - number: '38.6'
    text: |-
      Van de herziene normen en bedragen en van de dag waarop de herziening plaatsvindt wordt door Onze Minister
      mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel38
  - number: '39.1'
    text: |-
      Met ingang van de dag waarop de som wijzigt van de budgetten voor levensonderhoud, genoemd in
      [artikel 3.2, eerste lid, onderdeel a, van de Wet studiefinanciering 2000][ref1] en het bedrag dat op grond
      van [artikel 3.29, eerste lid, van die wet][ref2] wordt verstrekt aan een studerende die ten onrechte over een
      kalendermaand geen reisvoorziening ontvangt, worden de in [artikel 33, tweede lid][ref3], genoemde bedragen zodanig
      herzien dat deze gelijk zijn aan deze som.


      [ref1]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011453#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel33
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011453
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '39.2'
    text: |-
      Met ingang van 1 januari van elk kalenderjaar worden de in [artikel 33, vijfde lid][ref1],
      [artikel 34, tweede lid, onderdeel d, en derde lid][ref2], en [artikel 35, tweede lid][ref3], genoemde bedragen
      herzien met de procentuele stijging van de consumentenprijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel35
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '39.3'
    text: |-
      Van de herziene bedragen en van de dag waarop de herziening plaatsvindt wordt door Onze Minister mededeling gedaan
      in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel39
  - number: '40.1'
    text: |-
      Het recht op bijstand bestaat jegens het college van de gemeente waar de belanghebbende woonplaats heeft
      als bedoeld in de [artikelen 10, eerste lid][ref1], en [11 van Boek 1 van het Burgerlijk Wetboek][ref2]. Bij
      algemene maatregel van bestuur kan worden bepaald dat bijstand aan een belanghebbende zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref3] wordt verleend door het college van
      een bij die maatregel aan te wijzen gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '40.2'
    text: |-
      Het college verbindt aan de verlening van bijstand aan een belanghebbende zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] de verplichting dat hij aangifte
      doet van een door hen ter beschikking gesteld briefadres als bedoeld in [artikel 1 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '40.3'
    text: |-
      Indien bij de beoordeling van het recht op bijstand blijkt dat het door een belanghebbende verstrekte adres van
      hemzelf, van zijn echtgenoot of van een kind afwijkt van het adres waaronder de betrokkene in de gemeentelijke
      basisadministratie persoonsgegevens staat ingeschreven, schort het college het recht op bijstand op.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
  - number: '40.4'
    text: 'Geen opschorting vindt plaats indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
  - number: 40.4.a
    text: de afwijking redelijkerwijs geen gevolgen kan hebben voor het recht op of de hoogte van de bijstand;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
  - number: 40.4.b
    text: de belanghebbende van de afwijking redelijkerwijs geen verwijt kan worden gemaakt;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
  - number: 40.4.c
    text: daarvoor naar het oordeel van het college dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
  - number: '40.5'
    text: |-
      Het college doet schriftelijk mededeling van de opschorting, bedoeld in het derde lid, aan de belanghebbende
      en stelt hem daarbij in de gelegenheid de in de gemeentelijke basisadministratie persoonsgegevens opgenomen
      adresgegevens te doen aanpassen binnen een door het college te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
  - number: '40.6'
    text: |-
      De opschorting wordt beëindigd zodra het aan het college gebleken is dat de afwijking niet meer bestaat. Indien
      de afwijking ook na de krachtens het vijfde lid gestelde termijn nog bestaat, herziet het college het besluit
      tot toekenning van de bijstand of trekt het dit in met ingang van de eerste dag waarover het recht op bijstand
      is opgeschort.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel40
  - number: '41.1'
    text: |-
      De aanvraag is gericht tot het college en wordt overeenkomstig
      [artikel 30c van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1]
      ingediend bij het Uitvoeringsinstituut werknemersverzekeringen. Na de overdracht van de
      aanvraag door het Uitvoeringsinstituut werknemersverzekeringen aan het college ingevolge
      [artikel 30c, vierde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] wordt de aanvraag
      verder behandeld door het college.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: '41.2'
    text: |-
      Indien het een aanvraag betreft van andere dan algemene bijstand dan wel van algemene bijstand aan een persoon
      die in een inrichting verblijft, een persoon van 65 jaar of ouder, of een persoon zonder adres als bedoeld in
      [artikel 1 van de Wet gemeentelijke basisadministratie persoonsgegevens][ref1] wordt, in afwijking van het eerste
      lid, de aanvraag ingediend bij het college.


      [ref1]: https://wetten.overheid.nl/BWBR0006723#Artikel1
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0006723
        artikel: '1'
  - number: '41.3'
    text: |-
      De gemeenteraad kan, in overeenstemming met het Uitvoeringsinstituut werknemersverzekeringen, bij verordening
      categorieën van aanvragen vaststellen die, in afwijking van het tweede lid, bij het Uitvoeringsinstituut
      werknemersverzekeringen worden ingediend.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel41
  - number: '42.1'
    text: |-
      Indien doorzending van de aanvraag naar het college van een andere gemeente heeft plaatsgevonden en dit van
      oordeel is dat het evenmin de aanvraag dient te behandelen, terwijl geen zekerheid kan worden verkregen over de
      in [artikel 40][ref1] bedoelde woonplaats, draagt het college dat de doorgezonden aanvraag heeft ontvangen er zorg
      voor dat het geschil aanhangig wordt gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel40
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '40'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '42.2'
    text: |-
      In afwachting van een beslissing inzake een geschil over toepassing van het eerste lid bestaat het recht op
      bijstand jegens het college van de gemeente waar de belanghebbende werkelijk verblijft.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel42
  - number: '42.3'
    text: |-
      Kosten van bijstand verleend ingevolge het tweede lid worden vergoed door het college van de gemeente waarvan de
      taak is waargenomen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel42
  - number: '43.1'
    text: |-
      Het college stelt het recht op bijstand op schriftelijke aanvraag of, indien een schriftelijke aanvraag niet
      mogelijk is, ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel43
  - number: '43.2'
    text: |-
      De bijstand wordt door de echtgenoten gezamenlijk aangevraagd dan wel door een van hen met schriftelijke
      toestemming van de ander.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel43
  - number: '43.3'
    text: |-
      Het college stelt het recht op bijstand ambtshalve vast indien een van de echtgenoten niet met de aanvraag instemt,
      doch bijstandsverlening, gezien de belangen van de overige gezinsleden, niettemin geboden is.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel43
  - number: '44.1'
    text: |-
      Indien door het college is vastgesteld dat recht op bijstand bestaat, wordt de bijstand toegekend vanaf de dag
      waarop dit recht is ontstaan, voorzover deze dag niet ligt voor de dag waarop de belanghebbende zich heeft gemeld
      om bijstand aan te vragen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel44
  - number: '44.2'
    text: |-
      De belanghebbende heeft zich gemeld als zijn naam, adres en woonplaats zijn geregistreerd en hij in staat is
      gesteld zijn aanvraag in te dienen bij het Uitvoeringsinstituut werknemersverzekeringen, als het een aanvraag
      betreft als bedoeld in [artikel 41, eerste of vierde lid][ref1], of bij het college, als het een aanvraag betreft
      als bedoeld in [artikel 41, tweede of derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel41
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '41'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '44.3'
    text: |-
      Indien de belanghebbende de aanvraag niet zo spoedig mogelijk indient nadat hij zich heeft gemeld en hem dit te
      verwijten valt, kan het college, in afwijking van het eerste lid, besluiten dat de bijstand wordt toegekend vanaf
      de dag dat de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel44
  - number: '45.1'
    text: |-
      De algemene bijstand wordt per kalendermaand vastgesteld en betaald. In afwijking van de eerste volzin wordt de
      vakantietoeslag, voorzover niet reeds eerder betaald, jaarlijks betaald in de maand juni over de aan die maand
      voorafgaande twaalf maanden of zo veel eerder als de vakantietoeslag over deze periode vaststaat, dan wel binnen
      drie maanden volgend op de maand waarin de algemene bijstand is beëindigd.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel45
  - number: '45.2'
    text: |-
      Het college kan op grond van [artikel 18, eerste lid][ref1], besluiten de algemene bijstand over een andere periode
      als bedoeld in het eerste lid vast te stellen of te betalen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel18
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '45.3'
    text: |-
      De algemene bijstand wordt vastgesteld over het deel van de kalendermaand waarover recht op bijstand bestaat,
      indien de alleenstaande of het gezin voorafgaand aan of volgend op de bijstandsverlening:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel45
  - number: 45.3.a
    text: gedurende een periode van ten minste 30 dagen geen algemene bijstand ontvangt; of
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel45
  - number: 45.3.b
    text: anderszins geen recht op algemene bijstand heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel45
  - number: '45.4'
    text: |-
      De algemene bijstand wordt uitbetaald aan ieder van de rechthebbende echtgenoten voor de helft dan wel op hun
      gezamenlijk verzoek aan een van hen voor het geheel.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel45
  - number: '45.5'
    text: |-
      Ingeval van overlijden van een van de echtgenoten, van de alleenstaande ouder, van het laatste ten laste komende
      kind van gehuwden waarvan de leeftijd van een echtgenoot of beide echtgenoten 18, 19 of 20 jaar is, of van het
      laatste ten laste komende kind van de alleenstaande ouder, wordt de algemene bijstand tot en met één maand na de
      dag van het overlijden, betaald naar de op het moment van overlijden van toepassing zijnde bijstandsnorm aan de
      andere echtgenoot, de ten laste komende kinderen, onderscheidenlijk de gewezen alleenstaande ouder.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel45
  - number: '46.1'
    text: De bijstand is niet vatbaar voor vervreemding of verpanding.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel46
  - number: '46.2'
    text: Bijzondere bijstand is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel46
  - number: '46.3'
    text: |-
      Een machtiging tot het in ontvangst nemen van de bijstand, onder welke vorm of welke benaming ook verleend, is
      steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel46
  - number: '46.4'
    text: Elk beding, strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel46
  - number: '47'
    text: |-
      De gemeenteraad stelt bij verordening regels over de wijze waarop de personen, bedoeld in
      [artikel 7, eerste lid][ref1], of hun vertegenwoordigers worden betrokken bij de uitvoering van deze wet, waarbij
      in ieder geval wordt geregeld de wijze waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 47.a
    text: periodiek overleg wordt gevoerd met deze personen of hun vertegenwoordigers;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel47
  - number: 47.b
    text: deze personen of vertegenwoordigers onderwerpen voor de agenda van dit overleg kunnen aanmelden;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel47
  - number: 47.c
    text: zij worden voorzien van de voor een adequate deelname aan het overleg benodigde informatie.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel47
  - number: '48.1'
    text: Tenzij in deze wet anders is bepaald, wordt de bijstand verleend om niet.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
  - number: '48.2'
    text: 'Bijstand kan worden verleend in de vorm van een geldlening of borgtocht indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
  - number: 48.2.a
    text: |-
      redelijkerwijs kan worden aangenomen dat de belanghebbende op korte termijn over voldoende middelen zal beschikken
      om over de betreffende periode in de noodzakelijke kosten van het bestaan te voorzien;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
  - number: 48.2.b
    text: |-
      de noodzaak tot bijstandsverlening het gevolg is van een tekortschietend besef van verantwoordelijkheid voor de
      voorziening in het bestaan;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
  - number: 48.2.c
    text: de aanvraag een door de belanghebbende te betalen waarborgsom betreft;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
  - number: 48.2.d
    text: het bijstand ter gedeeltelijke of volledige aflossing van een schuldenlast betreft.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
  - number: '48.3'
    text: |-
      Het college kan aan het verlenen van bijstand in de vorm van een geldlening verplichtingen verbinden
      die zijn gericht op meerdere zekerheid voor de nakoming van de aan deze bijstand verbonden rente- en
      aflossingsverplichtingen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
  - number: '48.4'
    text: |-
      Het college verstrekt bijzondere bijstand als bedoeld in [artikel 35, vijfde lid][ref1], in natura, tenzij dit naar
      het oordeel van het college leidt tot een ondoelmatige uitvoering van dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel35
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '35'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: '48.4'
    text: |-
      Indien de persoon aan wie bijstand in de vorm van een geldlening wordt verleend algemene bijstand of een uitkering
      op grond van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2], het
      [Besluit bijstandverlening zelfstandigen 2004][ref3] of de [Wet werk en inkomen kunstenaars][ref4] ontvangt, is het
      college bevoegd tot verrekening van die geldlening met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0015711
      [ref4]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
      - id: ref3
        bwb_id: BWBR0015711
      - id: ref4
        bwb_id: BWBR0017837
  - number: '49'
    text: |-
      In afwijking van [artikel 13, eerste lid, onderdeel f][ref1], kan het college bijzondere bijstand verlenen:


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel13
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 49.a
    text: |-
      in de vorm van borgtocht, indien het verzoek van de belanghebbende tot verlening van een saneringskrediet
      is afgewezen vanwege diens beperkte mogelijkheden tot terugbetaling en de borgtocht noodzakelijk is om de
      krediettransactie alsnog doorgang te doen vinden door een:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel49
  - number: 49.a.1°
    text: |-
      gemeentelijke kredietbank als bedoeld in de [Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 49.a.2°
    text: |-
      een financiële onderneming die ingevolge de [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van
      bank mag uitoefenen, indien de gemeente niet is aangesloten bij een gemeentelijke kredietbank dan wel daarmee geen
      relatie onderhoudt;


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 49.b
    text: indien daartoe zeer dringende redenen bestaan en de in onderdeel a genoemde mogelijkheid geen uitkomst biedt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel49
  - number: '50.1'
    text: |-
      De belanghebbende die eigenaar is van een door hemzelf of zijn gezin bewoonde woning met bijbehorend erf, heeft
      recht op bijstand voorzover tegeldemaking, bezwaring of verdere bezwaring, van het in de woning met bijbehorend erf
      gebonden vermogen in redelijkheid niet kan worden verlangd.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel50
  - number: '50.2'
    text: |-
      Indien voor de belanghebbende, bedoeld in het eerste lid, recht op algemene bijstand bestaat, heeft die bijstand de
      vorm van een geldlening:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel50
  - number: 50.2.a
    text: |-
      indien de bijstand over een periode van een jaar, te rekenen vanaf de eerste dag waarover bijstand wordt verleend,
      naar verwachting meer bedraagt dan het netto minimumloon, bedoeld in [artikel 37, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel37
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '37'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 50.2.b
    text: |-
      voorzover het vermogen gebonden in de woning met bijbehorend erf hoger is dan het vermogen, bedoeld in
      [artikel 34, tweede lid, onderdeel d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '51.1'
    text: |-
      Bijzondere bijstand voor de kosten van noodzakelijke duurzame gebruiksgoederen kan worden verleend in de vorm van
      een geldlening of borgtocht, dan wel in de vorm van een bedrag om niet.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel51
  - number: '51.2'
    text: |-
      Indien een geldlening als bedoeld in het eerste lid wordt verstrekt, stemt het college de aflossingsbedragen en de
      duur van de aflossing mede af op de omstandigheden, mogelijkheden en middelen van de belanghebbende.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel51
  - number: '52.1'
    text: |-
      Het college verleent uiterlijk binnen vier weken na de datum van aanvraag en vervolgens telkens uiterlijk na vier
      weken, bij wijze van voorschot algemene bijstand in de vorm van een renteloze geldlening, zolang het recht op
      algemene bijstand niet is vastgesteld. De eerste zin is niet van toepassing indien:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel52
  - number: 52.1.a
    text: |-
      de belanghebbende de voor de vaststelling van het recht op algemene bijstand van belang zijnde gegevens of de
      gevorderde bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel
      indien de belanghebbende anderszins onvoldoende medewerking verleent;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel52
  - number: 52.1.b
    text: bij de aanvraag duidelijk is dat geen recht op algemene bijstand bestaat.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel52
  - number: '52.2'
    text: |-
      De hoogte van het in het eerste lid bedoelde voorschot bedraagt in ieder geval 90% van de hoogte van de algemene
      bijstand, bedoeld in [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel19
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: '52.3'
    text: |-
      Het college is bevoegd om bij wijze van voorschot bijzondere bijstand te verlenen in de vorm van een renteloze
      geldlening.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel52
  - number: '52.4'
    text: |-
      Indien bijstand wordt verleend over een periode waarover met toepassing van het eerste lid een voorschot is
      verleend, kan deze bijstand zonder machtiging van de belanghebbende worden verrekend met dit voorschot.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel52
  - number: '53.1'
    text: |-
      Indien algemene bijstand wordt verleend over een periode, waarover een voorschot is ontvangen met toepassing
      van [artikel 31, tweede lid, van de Werkloosheidswet][ref1], [ artikel 47a, eerste lid, van Ziektewet][ref2],
      [artikel 67, tweede lid, van de Wet werk en inkomen naar arbeidsvermogen][ref3],
      [artikel 50, tweede lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [artikel 55, tweede lid, van de Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5] of
      [artikel 47, tweede lid van de Wet arbeidsongeschiktheidsverzekering jonggehandicapten][ref6], al dan niet met
      gelijktijdige toepassing van [artikel 17, eerste lid, van de Toeslagenwet][ref7], en dit voorschot door het
      Uitvoeringsinstituut werknemersverzekeringen wordt teruggevorderd, kan deze bijstand zonder machtiging van de
      belanghebbende tot het bedrag van dit voorschot aan het Uitvoeringsinstituut werknemersverzekeringen worden
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001888#Artikel47a
      [ref3]: https://wetten.overheid.nl/BWBR0019057#Artikel67
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel50
      [ref5]: https://wetten.overheid.nl/BWBR0008656#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0008657#Artikel47
      [ref7]: https://wetten.overheid.nl/BWBR0004043#Artikel17
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0001888
        artikel: 47a
      - id: ref3
        bwb_id: BWBR0019057
        artikel: '67'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '50'
      - id: ref5
        bwb_id: BWBR0008656
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0008657
        artikel: '47'
      - id: ref7
        bwb_id: BWBR0004043
        artikel: '17'
  - number: '53.2'
    text: |-
      In het geval, bedoeld in het eerste lid, vergoedt de gemeente aan het Uitvoeringsinstituut werknemersverzekeringen
      tevens de over de te verlenen bijstand verschuldigde loonbelasting, premies volksverzekeringen en de vergoeding,
      bedoeld in [artikel 46 van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '46'
  - number: 53a.1
    text: |-
      Onverminderd [30c, tweede, vierde en vijfde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      bepaalt het college welke gegevens ten behoeve van de verlening van bijstand dan wel de voortzetting daarvan
      door de belanghebbende in ieder geval worden verstrekt en welke bewijsstukken worden overgelegd, alsmede de
      wijze en het tijdstip waarop de verstrekking van gegevens plaatsvindt. De gegevens en bewijsstukken worden door
      het college niet verkregen van de belanghebbende voor zover ze zijn verkregen door het Uitvoeringsinstituut
      werknemersverzekeringen dan wel voor zover zij verkregen kunnen worden uit de polisadministratie, bedoeld in
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], de verzekerdenadministratie,
      bedoeld in [artikel 35 van die wet][ref3], alsmede uit de gemeentelijke basisadministratie persoonsgegevens, tenzij
      hierdoor een goede vervulling van de taak van het college op grond van dit artikel wordt belet of bij wettelijk
      voorschrift anders is bepaald. Bij of krachtens algemene maatregel van bestuur kunnen andere administraties
      worden aangewezen waarvoor de tweede zin van toepassing is, worden regels gesteld over de gegevens die het betreft
      en kunnen administraties worden aangewezen waarvoor de tweede zin tijdelijk niet van toepassing is. Indien het
      authentieke gegevens uit andere basisregistraties betreft, is dit lid van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel35
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '35'
  - number: 53a.2
    text: |-
      Het college is bevoegd onderzoek in te stellen naar de juistheid en volledigheid van de verstrekte gegevens en
      zonodig naar andere gegevens die noodzakelijk zijn voor de verlening dan wel de voortzetting van bijstand. Indien
      het onderzoek daartoe aanleiding geeft kan het college besluiten tot herziening van de bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel53a
  - number: 53a.3
    text: |-
      De voordracht voor een krachtens het eerste lid, derde zin, vast te stellen algemene maatregel van bestuur wordt
      niet eerder gedaan dan twee weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel53a
  - number: '54.1'
    text: |-
      Indien de belanghebbende de voor de verlening van bijstand van belang zijnde gegevens of de gevorderde
      bewijsstukken niet, niet tijdig of onvolledig heeft verstrekt en hem dit te verwijten valt, dan wel indien de
      belanghebbende anderszins onvoldoende medewerking verleent, kan het college het recht op bijstand voor de duur van
      ten hoogste acht weken opschorten:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
  - number: 54.1.a
    text: vanaf de eerste dag van de periode waarop het verzuim betrekking heeft, of
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
  - number: 54.1.b
    text: vanaf de dag van het verzuim indien niet kan worden bepaald op welke periode dit verzuim betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
  - number: '54.2'
    text: |-
      Het college doet mededeling van de opschorting aan de belanghebbende en nodigt hem uit binnen een door hen te
      stellen termijn het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
  - number: '54.3'
    text: |-
      Onverminderd het elders in deze wet bepaalde terzake van herziening of intrekking van een besluit tot toekenning
      van bijstand en terzake van weigering van bijstand, kan het college een dergelijk besluit herzien of intrekken:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
  - number: 54.3.a
    text: |-
      indien het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 17, eerste lid][ref1], of
      [artikel 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], heeft geleid
      tot het ten onrechte of tot een te hoog bedrag verlenen van bijstand;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
  - number: 54.3.b
    text: indien anderszins de bijstand ten onrechte of tot een te hoog bedrag is verleend.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
  - number: '54.4'
    text: |-
      Als de belanghebbende in het geval bedoeld in het eerste lid het verzuim niet herstelt binnen de daarvoor gestelde
      termijn, kan het college na het verstrijken van deze termijn het besluit tot toekenning van bijstand intrekken met
      ingang van de eerste dag waarover het recht op bijstand is opgeschort.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel54
  - number: '55'
    text: |-
      Naast de verplichtingen die ingevolge [hoofdstuk 2][ref1] in elk geval aan de bijstand verbonden zijn,
      dan wel daaraan door het college verbonden worden, kan het college vanaf de dag van melding als bedoeld in
      [artikel 44, tweede lid][ref2], verplichtingen opleggen die strekken tot arbeidsinschakeling, dan wel die verband
      houden met aard en doel van een bepaalde vorm van bijstand of die strekken tot zijn vermindering of beëindiging.
      Een verplichting kan, op advies van een arts, inhouden het zich onderwerpen aan een noodzakelijke behandeling van
      medische aard.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel44
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '44'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '57'
    text: |-
      Indien en zolang er gegronde redenen zijn om aan te nemen dat de belanghebbende zonder hulp niet in staat is tot
      een verantwoorde besteding van zijn bestaansmiddelen, kan het college:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel57
  - number: 57.a
    text: |-
      aan de bijstand de verplichting verbinden dat de belanghebbende eraan meewerkt dat het college in naam van de
      belanghebbende noodzakelijke betalingen uit de toegekende bijstand verricht;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel57
  - number: 57.b
    text: de bijstand in natura verstrekken.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel57
  - number: '58.1'
    text: |-
      Het college van de gemeente die de bijstand heeft verleend kan kosten van bijstand terugvorderen, voorzover de
      bijstand:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: 58.1.a
    text: ten onrechte of tot een te hoog bedrag is verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: 58.1.b
    text: |-
      in de vorm van geldlening is verleend en de uit de geldlening voortvloeiende verplichtingen niet of niet behoorlijk
      worden nagekomen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: 58.1.c
    text: voortvloeit uit gestelde borgtocht;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: 58.1.d
    text: |-
      ingevolge [artikel 52][ref1] bij wijze van voorschot is verleend en nadien is vastgesteld dat geen recht op
      bijstand bestaat;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel52
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '52'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 58.1.e
    text: anderszins onverschuldigd is betaald voorzover de belanghebbende dit redelijkerwijs had kunnen begrijpen, of
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: 58.1.f
    text: 'anderszins onverschuldigd is betaald, waaronder begrepen dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: 58.1.f.1°
    text: |-
      de belanghebbende naderhand met betrekking tot de periode waarover bijstand is verleend, over in aanmerking te
      nemen middelen als bedoeld in [paragraaf 3.4][ref1] beschikt of kan beschikken;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: 58.1.f.2°
    text: |-
      bijstand is verleend met een bepaalde bestemming en naderhand door de belanghebbende vergoedingen of
      tegemoetkomingen worden ontvangen met het oog op die bestemming.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: '58.2'
    text: |-
      Indien een gemeente ingevolge [artikel 42, derde lid][ref1], gehouden is kosten van bijstand over een bepaalde
      periode aan een andere gemeente te vergoeden, geschiedt de terugvordering over die periode, voorzover zij nog niet
      heeft plaatsgehad, door het college van eerstgenoemde gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel42
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '42'
        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '58.3'
    text: |-
      Het college is bevoegd tot verrekening van in de voorafgaande drie maanden ontvangen middelen met de algemene
      bijstand.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: '58.4'
    text: |-
      Bij gebreke van tijdige betaling kan de vordering worden verhoogd met de op de terugvordering betrekking
      hebbende kosten. Loonbelasting en de premies volksverzekeringen waarvoor de gemeente die de bijstand verstrekt
      krachtens de [Wet op de loonbelasting 1964][ref1] inhoudingsplichtige is, alsmede de vergoeding, bedoeld
      in [artikel 46 van de Zorgverzekeringswet][ref2], kunnen worden teruggevorderd, voor zover deze belasting,
      premies en vergoeding niet verrekend kunnen worden met de door het college af te dragen loonbelasting, premies
      volksverzekeringen en vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0002471
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0002471
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '58.5'
    text: |-
      Terugvordering als bedoeld in het eerste lid, onderdeel e, vindt niet plaats, indien de betreffende kosten zijn
      gemaakt meer dan twee jaar vóór de datum van verzending van het besluit tot terugvordering.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel58
  - number: '59.1'
    text: |-
      Onverminderd [artikel 58][ref1] kunnen kosten van bijstand, indien de bijstand aan een gezin wordt verleend, van
      alle gezinsleden worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '59.2'
    text: |-
      Indien de bijstand als gezinsbijstand aan gehuwden had moeten worden verleend, maar zulks
      achterwege is gebleven, omdat de belanghebbende de verplichtingen, bedoeld in [artikel 17][ref1], of
      [artikelen 30c, tweede en derde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2], niet of
      niet behoorlijk is nagekomen, kunnen de kosten van bijstand mede worden teruggevorderd van de persoon met wiens
      middelen als bedoeld in [paragraaf 3.4][ref3], bij de verlening van bijstand rekening had moeten worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30c
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '17'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: 30c
      - id: ref3
        bwb_id: BWBR0015703
        hoofdstuk: '3'
        paragraaf: '3.4'
  - number: '59.3'
    text: |-
      De in het eerste en tweede lid bedoelde personen zijn hoofdelijk aansprakelijk voor de terugbetaling van kosten van
      bijstand die worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel59
  - number: '60.1'
    text: |-
      De persoon van wie kosten van bijstand worden teruggevorderd is verplicht desgevraagd aan het college de
      inlichtingen te verstrekken die voor terugvordering op grond van deze paragraaf van belang zijn.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
  - number: '60.2'
    text: |-
      Het college kan de kosten van de bijstand, bedoeld in de [artikelen 58][ref1] en [59][ref2] invorderen bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: '60.3'
    text: |-
      Indien de persoon van wie kosten van bijstand als bedoeld in de [artikelen 58][ref1]
      en [59][ref2] worden teruggevorderd algemene bijstand of een uitkering op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref3], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref4], het
      [Besluit bijstandverlening zelfstandigen 2004][ref5] of de [Wet werk en inkomen kunstenaars][ref6] ontvangt, is het
      college bevoegd tot verrekening van die kosten met die algemene bijstand of uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0004044
      [ref4]: https://wetten.overheid.nl/BWBR0004163
      [ref5]: https://wetten.overheid.nl/BWBR0015711
      [ref6]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0004044
      - id: ref4
        bwb_id: BWBR0004163
      - id: ref5
        bwb_id: BWBR0015711
      - id: ref6
        bwb_id: BWBR0017837
  - number: '60.4'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het college. Indien het college
      gebruik maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene van wie kosten van bijstand worden teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '60.5'
    text: 'Zolang de belanghebbende zijn verplichting, bedoeld in het eerste lid, niet of niet behoorlijk nakomt:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
  - number: 60.5.a
    text: |-
      is het college, in afwijking van [artikel 4.93, vierde lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot
      verrekening voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 60.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij invordering van kosten van bijstand bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '60.6'
    text: |-
      Terugvordering van kosten van bijstand als bedoeld in de [artikelen 58][ref1] en [59][ref2] is bevoorrecht en volgt
      onmiddellijk na de vorderingen in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3] omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '59'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '61'
    text: |-
      Kosten van bijstand kunnen door het college worden verhaald in de gevallen en naar de regels aangegeven in deze
      paragraaf.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel61
  - number: '62'
    text: |-
      Kosten van bijstand kunnen tot de grens van de onderhoudsplicht, bedoeld in
      [Boek 1 van het Burgerlijk Wetboek][ref1], worden verhaald:


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 62.a
    text: |-
      op degene die bij het ontbreken van gezinsverband zijn onderhoudsplicht jegens zijn echtgenoot, of minderjarig kind
      niet of niet behoorlijk nakomt en op het minderjarige kind dat zijn onderhoudsplicht jegens zijn ouders niet of
      niet behoorlijk nakomt;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62
  - number: 62.b
    text: |-
      op degene die zijn onderhoudsplicht na echtscheiding of ontbinding van het huwelijk na scheiding van tafel en bed
      niet of niet behoorlijk nakomt;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62
  - number: 62.c
    text: |-
      op degene die zijn onderhoudsplicht op grond van [artikel 395a van Boek 1 van het Burgerlijk Wetboek][ref1] niet of
      niet behoorlijk nakomt jegens zijn meerderjarig kind aan wie bijzondere bijstand is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel395a
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 395a
  - number: 62a
    text: |-
      Bij de beoordeling van het bestaan van het verhaalsrecht, bedoeld in
      [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2], en de omvang van het te verhalen
      bedrag wordt rekening gehouden met de maatstaven die gelden en de omstandigheden die van belang zijn in het geval
      dat de rechter dient te beslissen over de vraag of en, zo ja, tot welk bedrag een uitkering tot levensonderhoud na
      echtscheiding, scheiding van tafel en bed of ontbinding van het huwelijk na scheiding van tafel en bed zou moeten
      worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62a
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 159a
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 62b.1
    text: |-
      Indien een rechterlijke uitspraak betreffende levensonderhoud verschuldigd op grond van
      [Boek 1 van het Burgerlijk Wetboek][ref1] die uitvoerbaar is, niet wordt nagekomen, wordt verhaald in
      overeenstemming met deze uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62b
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 62b.2
    text: |-
      De betaling van het verschuldigde geschiedt binnen 30 dagen na bekendmaking van het besluit tot verhaal
      overeenkomstig het eerste lid.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62b
  - number: 62b.3
    text: |-
      Degene op wie wordt verhaald kan binnen de termijn waarbinnen betaling moet plaatsvinden tegen het besluit tot
      verhaal in verzet komen door een verzoekschrift aan de rechtbank. Het verzet kan niet gegrond zijn op de bewering
      dat de uitkering tot onderhoud ten onrechte is opgelegd of onjuist is vastgesteld. Indien tijdig verzet is gedaan
      wordt de invordering pas voortgezet zodra het verzet is ingetrokken of ongegrond verklaard.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62b
  - number: 62b.4
    text: |-
      Het college is bevoegd, met uitsluiting van degene die de bijstand ontvangt, het verschuldigde bij dwangbevel in
      te vorderen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62b
  - number: 62c.1
    text: |-
      Indien degene, die bijstand ontvangt of heeft ontvangen en ten aanzien van wie door de rechter een verhaalsbedrag
      verschuldigd op grond van [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2] is
      vastgesteld, zijn woonplaats verplaatst naar een andere gemeente en aldaar bijstand ontvangt of heeft ontvangen,
      gaat de bevoegdheid tot tenuitvoerlegging van de rechterlijke uitspraak op het college van de andere gemeente over.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62c
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 159a
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 62c.2
    text: |-
      Het college van de vertrekgemeente blijft bevoegd tot tenuitvoerlegging voor zover het gaat om
      betalingsachterstanden ter zake van verhaal van bijstand die door dat college is verleend.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62c
  - number: 62d.1
    text: |-
      Het door de rechter vastgestelde verhaalsbedrag verschuldigd op grond van
      [artikel 159a van Boek 1 van het Burgerlijk Wetboek][ref1] of [artikel 62][ref2] wordt jaarlijks met ingang van 1
      januari van rechtswege gewijzigd met het op grond van [artikel 402a van Boek 1 van het Burgerlijk Wetboek][ref3]
      vast te stellen percentage.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel159a
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel62
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel402a
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62d
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 159a
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '62'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: 402a
  - number: 62d.2
    text: |-
      De toepassing van het eerste lid blijft achterwege indien de wijziging van rechtswege bij rechterlijke uitspraak
      is uitgesloten.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62d
  - number: 62e.1
    text: |-
      Het door de rechter vastgestelde verhaalsbedrag kan op verzoek van het college of van degene op wie verhaal wordt
      uitgeoefend door de rechter worden gewijzigd op grond van gewijzigde omstandigheden.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62e
  - number: 62e.2
    text: |-
      Het college kan aan de rechter verzoeken het verhaalsbedrag in afwijking van een rechterlijke uitspraak betreffende
      levensonderhoud verschuldigd krachtens [Boek 1 van het Burgerlijk Wetboek][ref1] vast te stellen, indien de
      rechter:


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62e
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 62e.2.a
    text: |-
      deze uitspraak zou kunnen wijzigen op de gronden genoemd in de [artikelen 157][ref1] en [401 van dat boek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel157
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel401
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62e
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '157'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '401'
  - number: 62e.2.b
    text: |-
      geen rekening heeft kunnen houden met alle voor de betrokken beslissing in aanmerking komende gegevens en
      omstandigheden betreffende beide partijen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62e
  - number: 62f
    text: 'Kosten van bijstand kunnen door het college worden verhaald op:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62f
  - number: 62f.a
    text: |-
      degene aan wie de persoon die bijstand ontvangt of heeft ontvangen een schenking heeft gedaan voor zover bij het
      besluit op de bijstandsaanvraag met de geschonken middelen rekening zou zijn gehouden indien de schenking niet had
      plaatsgevonden, tenzij gelet op alle omstandigheden aannemelijk is dat de schenker ten tijde van de schenking de
      noodzaak van bijstandsverlening redelijkerwijs niet heeft kunnen voorzien;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62f
  - number: 62f.b
    text: 'de nalatenschap van de persoon indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62f
  - number: 62f.b.1°
    text: |-
      aan die persoon ten onrechte bijstand is verleend en voor zover voor het overlijden nog geen terugvordering heeft
      plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62f
  - number: 62f.b.2°
    text: bijstand is verleend in de vorm van geldlening of als gevolg van borgtocht.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62f
  - number: 62g.1
    text: |-
      Het besluit tot verhaal op grond van deze paragraaf, anders dan met toepassing van [artikel 62b][ref1], wordt door
      het college aan degene op wie verhaal wordt gezocht medegedeeld. Bij verhaal op de nalatenschap kan de mededeling
      worden gericht tot de langstlevende echtgenoot of een der erfgenamen die geacht kan worden bij de afwikkeling van
      de nalatenschap te zijn betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel62b
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62g
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: 62b
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 62g.2
    text: |-
      Indien de belanghebbende niet uit eigen beweging bereid is de verlangde gelden aan het college te betalen dan wel
      niet of niet tijdig tot betaling daarvan overgaat, kan het college overgaan tot verhaal in rechte.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62g
  - number: 62h.1
    text: |-
      Verzoekschriften met betrekking tot verhaal in rechte op grond van deze paragraaf, alsmede verzoeken tot wijziging
      van een rechterlijke verhaalsuitspraak, worden ingediend bij de rechtbank.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62h
  - number: 62h.2
    text: |-
      Op de indiening en behandeling van het verzoekschrift, alsmede op de procedure in hoger beroep, zijn de
      [artikelen 799, tweede lid][ref1], en [801 van het Wetboek van Burgerlijke Rechtsvordering][ref2] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel799
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel801
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62h
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '799'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '801'
  - number: 62h.3
    text: Het college kan op grond van deze paragraaf in rechte optreden zonder procureur.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62h
  - number: 62i
    text: |-
      De [artikelen 58, vierde lid][ref1], en [artikel 60, eerste en vierde tot en met zesde lid][ref2], zijn met
      betrekking tot het verhaal van kosten van bijstand van overeenkomstige toepassing, met dien verstande dat
      [artikel 479e, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel60
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel479e
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel62i
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '58'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '60'
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: 479e
  - number: '63.1'
    text: |-
      Een ieder is verplicht desgevraagd en bevoegd uit eigen beweging aan het college kosteloos opgaven en inlichtingen
      te verstrekken omtrent feiten en omstandigheden die noodzakelijk zijn voor de uitvoering van deze wet ten
      opzichte van een persoon te wiens behoeve bijstand is gevraagd of wordt verleend en die in zijn dienst dan wel
      voor hem arbeid verricht, heeft verricht of zou kunnen gaan verrichten. De verplichting strekt zich mede uit tot
      de inkomsten van een persoon van wie kosten van bijstand ingevolge [paragraaf 4][ref1] worden of kunnen worden
      teruggevorderd of op wie kosten van bijstand ingevolge [paragraaf 5][ref2] worden of kunnen worden verhaald.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: '63.2'
    text: |-
      De opgaven en inlichtingen worden desgevraagd schriftelijk, of in een andere vorm die redelijkerwijs kan worden
      verlangd, binnen een door het college schriftelijk te stellen termijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel63
  - number: '64.1'
    text: |-
      De hieronder vermelde instanties zijn verplicht desgevraagd aan het college of, indien het college aan het
      Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van besluiten inzake de
      verlening van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, kosteloos opgaven en inlichtingen te
      verstrekken die noodzakelijk zijn voor de uitvoering van deze wet:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.a
    text: het college van andere gemeenten;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.b
    text: het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.c
    text: de belastingdienst;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
  - number: 64.1.e
    text: |-
      de bedrijfstakpensioenfondsen, ondernemingspensioenfondsen, risicofondsen,
      stichtingen tot uitvoering van een regeling inzake vervroegd uittreden en andere
      organen belast met het doen van uitkeringen of verstrekkingen die bij of krachtens
      [artikel 8 van de Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1] als
      inkomen worden aangemerkt;


      [ref1]: https://wetten.overheid.nl/BWBR0004044#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0004044
        artikel: '8'
  - number: 64.1.f
    text: |-
      de Kamers van Koophandel, met dien verstande dat dit, in afwijking van de aanhef van dit lid, geschiedt tegen
      betaling van de daarvoor op grond van de [Handelsregisterwet 2007][ref1] vastgestelde vergoeding;


      [ref1]: https://wetten.overheid.nl/BWBR0021777
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0021777
  - number: 64.1.g
    text: |-
      de korpschef en de bevelhebber van de Koninklijke marechaussee in de zin van de [Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 64.1.h
    text: |-
      de Belastingdienst/Toeslagen betreffende de toekenning van tegemoetkomingen met toepassing van de
      [Algemene wet inkomensafhankelijke regelingen][ref1] en Onze Minister voor Wonen, Wijken en Integratie betreffende
      de toepassing van de [Wet bevordering eigenwoningbezit][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018472
      [ref2]: https://wetten.overheid.nl/BWBR0011919
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0018472
      - id: ref2
        bwb_id: BWBR0011919
  - number: 64.1.i
    text: |-
      de Informatie Beheer Groep betreffende de toepassing van de [Wet studiefinanciering 2000][ref1],
      de [Wet tegemoetkoming onderwijsbijdrage en schoolkosten][ref2], de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] en de [Wet inburgering][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0011453
      [ref2]: https://wetten.overheid.nl/BWBR0012438
      [ref3]: https://wetten.overheid.nl/BWBR0005682
      [ref4]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0011453
      - id: ref2
        bwb_id: BWBR0012438
      - id: ref3
        bwb_id: BWBR0005682
      - id: ref4
        bwb_id: BWBR0020611
  - number: 64.1.j
    text: |-
      Onze Minister van Landbouw, Natuur en Voedselkwaliteit betreffende de omvang van de productiebeperkende maatregelen
      voor het bedrijf van de ondernemer in de agrarische sector;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.k
    text: Onze Minister van Justitie voorzover het betreft de persoon die rechtens zijn vrijheid is ontnomen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.l
    text: de instanties en personen die woonruimte verhuren;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.m
    text: de instanties die in het kader van de openbare nutsvoorziening energie en water leveren;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.n
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.1.o
    text: |-
      de geneesheer-directeur, bedoeld in de [Wet bijzondere opnemingen in psychiatrische ziekenhuizen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005700
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0005700
  - number: '64.2'
    text: 'De geneesheer-directeur, bedoeld in het eerste lid, onderdeel o, verstrekt slechts opgaven en inlichtingen indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.2.a
    text: |-
      deze noodzakelijk zijn voor de uitvoering van [artikel 13, derde lid][ref1], laatste zin; en


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel13
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 64.2.b
    text: 'deze betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.2.b.1°
    text: de opneming;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.2.b.2°
    text: het ontslag;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.2.b.3°
    text: het verleende verlof; of
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.2.b.4°
    text: het ingetrokken verlof.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.3'
    text: |-
      Het vragen door het college en het verstrekken door de in het eerste lid bedoelde instanties van de in het eerste
      lid bedoelde opgaven en inlichtingen kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.4'
    text: |-
      Griffiers van colleges, geheel of ten dele met rechtspraak belast, zijn verplicht desgevraagd aan het college of,
      indien het college aan het Uitvoeringsinstituut werknemersverzekeringen mandaat heeft verleend tot het nemen van
      besluiten inzake de verlening van bijstand, aan het Uitvoeringsinstituut werknemersverzekeringen, kosteloos alle
      gegevens en uittreksels of afschriften van uitspraken, registers en andere stukken te verstrekken die noodzakelijk
      zijn voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.5'
    text: 'De in het eerste en het vierde lid bedoelde verplichtingen strekken zich mede uit tot degene:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.5.a
    text: |-
      van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref1] of op wie deze
      worden of kunnen worden verhaald ingevolge [paragraaf 5][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 64.5.b
    text: |-
      die hun hoofdverblijf hebben in dezelfde woning, of ten aanzien van wie dat redelijkerwijs kan worden vermoed,
      als degene:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.5.b.1°
    text: te wiens behoeve bijstand is gevraagd of wordt verleend;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: 64.5.b.2°
    text: |-
      van wie kosten van bijstand worden of kunnen worden teruggevorderd ingevolge [paragraaf 4][ref1] of op wie deze
      worden of kunnen worden verhaald ingevolge [paragraaf 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref2
        bwb_id: BWBR0015703
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: '64.6'
    text: |-
      De in het eerste lid en het vierde lid bedoelde opgaven en inlichtingen worden desgevraagd schriftelijk, of in een
      andere vorm die redelijkerwijs kan worden verlangd, en zo spoedig mogelijk, doch in elk geval binnen vier weken na
      ontvangst van het verzoek hiertoe, verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.7'
    text: |-
      De in het eerste lid, onderdeel a tot en met k, genoemde instanties treffen desgevraagd met het college en met het
      Inlichtingenbureau een regeling met betrekking tot de mededeling van wijzigingen in de eerder aan hen gevraagde
      opgaven en inlichtingen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent het derde lid en de inhoud en
      vormgeving van de in het zevende lid bedoelde regelingen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.9'
    text: |-
      Bij algemene maatregel van bestuur kunnen een of meer van de in het eerste lid bedoelde instanties
      worden aangewezen die ten behoeve van aan het college te verstrekken opgaven en inlichtingen, de door het
      Inlichtingenbureau aan deze instanties verstrekte gegevens van aldaar op dat moment nog onbekende personen opslaan.
      Het derde lid is van overeenkomstige toepassing. Bij toepassing van de eerste volzin wordt bij of krachtens
      algemene maatregel van bestuur bepaald op welke wijze en gedurende welke termijn deze gegevens worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.10'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties en personen dan genoemd in het eerste en het vierde lid
      worden aangewezen voor wie de verplichtingen, bedoeld in het eerste lid tot en met achtste lid, eveneens gelden,
      voorzover het betreft de verstrekking van nader bij algemene maatregel van bestuur aan te wijzen inlichtingen en
      opgaven.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.11'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in het tiende lid, kan tevens worden bepaald dat de daar bedoelde
      verplichting alleen geldt jegens ambtenaren met opsporingsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '64.12'
    text: |-
      Onze Minister van Justitie verstrekt ten aanzien van de persoon die rechtens zijn vrijheid is ontnomen, onverwijld
      en kosteloos de beschikbare informatie en alle overige opgaven en inlichtingen, die van invloed kunnen zijn op het
      recht op bijstand, aan het college, of, indien het college aan het Uitvoeringsinstituut werknemersverzekeringen
      mandaat heeft verleend tot het nemen van besluiten inzake de verlening van bijstand, aan het Uitvoeringsinstituut
      werknemersverzekeringen, door tussenkomst van het Inlichtingenbureau, waarbij hij gebruik kan maken van het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel64
  - number: '65.1'
    text: |-
      Het is een ieder verboden hetgeen hem uit of in verband met enige werkzaamheid bij de uitvoering van deze wet over
      de persoon of zaken van een ander blijkt of wordt meegedeeld, verder bekend te maken dan voor de uitvoering van
      deze wet noodzakelijk is dan wel op grond van deze wet is voorgeschreven of toegestaan.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel65
  - number: '65.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel65
  - number: 65.2.a
    text: enig wettelijk voorschrift tot bekendmaking verplicht;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel65
  - number: 65.2.b
    text: |-
      degene op wie de gegevens betrekking hebben schriftelijk heeft verklaard tegen de verstrekking van deze gegevens
      geen bezwaar te hebben;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel65
  - number: 65.2.c
    text: de gegevens niet herleidbaar zijn tot individuele natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel65
  - number: '65.3'
    text: |-
      Ten behoeve van wetenschappelijk onderzoek of statistiek kunnen desgevraagd gegevens aan derden worden verstrekt
      voorzover de persoonlijke levenssfeer van de betrokkenen daardoor niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel65
  - number: '65.4'
    text: |-
      Degene die op grond van de [artikelen 63 tot en met 68][ref1] gegevens verstrekt dient na te gaan of degene aan wie
      de gegevens worden verstrekt redelijkerwijs bevoegd is te achten om die gegevens te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel63
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '63'
        hoofdstuk: '6'
        paragraaf: '6.6'
  - number: '66'
    text: |-
      Het college is verplicht, indien het bij de uitvoering van deze wet het gegronde vermoeden krijgt van een misdrijf
      dat is gepleegd ten nadele van een Nederlands of buitenlands uitvoeringsorgaan van de sociale verzekeringswetten of
      van een Nederlands of buitenlands overheidsorgaan, voorzover dit is belast met het verrichten van uitkeringen, het
      doen van verstrekkingen dan wel het heffen van bijdragen, het betrokken orgaan hiervan in kennis te stellen.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel66
  - number: '67.1'
    text: |-
      Het college is bevoegd uit eigen beweging en verplicht desgevraagd, onverminderd
      [artikel 107 van de Vreemdelingenwet 2000][ref1], uit de administratie terzake van de uitvoering van deze wet aan
      de hieronder vermelde instanties kosteloos de gegevens te verstrekken:


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel107
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '107'
  - number: 67.1.a
    text: |-
      het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank voor de uitvoering van de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] of de wettelijke regelingen, bedoeld in de
      [artikelen 30, eerste lid, onderdeel a][ref2], en [34, eerste lid, onderdeel a, van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '34'
  - number: 67.1.b
    text: |-
      de Belastingdienst voor de heffing of invordering van enige rijksbelasting, de premies voor de sociale
      verzekeringen, bedoeld in [artikel 2, onderdelen a en c, van de Wet financiering sociale verzekeringen][ref1],
      of inkomensafhankelijke bijdragen als bedoeld in [artikel 41 van de Zorgverzekeringswet][ref2] en de
      Belastingdienst/Toeslagen voor de uitvoering van inkomensafhankelijke regelingen als bedoeld in de
      [Algemene wet inkomensafhankelijke regelingen][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0018472
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref3
        bwb_id: BWBR0018472
  - number: 67.1.c
    text: |-
      het college van andere gemeenten voor de uitvoering van deze wet, de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref1], de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref2] en de
      [Wet werk en inkomen kunstenaars][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0004044
      [ref2]: https://wetten.overheid.nl/BWBR0004163
      [ref3]: https://wetten.overheid.nl/BWBR0017837
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0004044
      - id: ref2
        bwb_id: BWBR0004163
      - id: ref3
        bwb_id: BWBR0017837
  - number: 67.1.d
    text: |-
      het College zorgverzekeringen, genoemd in [artikel 58, eerste lid, van de Zorgverzekeringswet][ref1],
      de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref2] en de
      zorgverzekeraars in de zin van de [artikelen 1, onderdeel b, van de Zorgverzekeringswet][ref3] of van de
      [Algemene Wet Bijzondere Ziektekosten][ref4], voor de uitvoering van de [Zorgverzekeringswet][ref5] of de
      [Algemene Wet Bijzondere Ziektekosten][ref6];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002614
      [ref5]: https://wetten.overheid.nl/BWBR0018450
      [ref6]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0020078
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0002614
      - id: ref5
        bwb_id: BWBR0018450
      - id: ref6
        bwb_id: BWBR0002614
  - number: 67.1.e
    text: derden die in het kader van de uitoefening van beroep of bedrijf de arbeidsinschakeling van personen bevorderen;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
  - number: 67.1.f
    text: buitenlandse organen voor de vervulling van een taak van zwaarwegend algemeen belang;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
  - number: 67.1.g
    text: |-
      bestuursorganen van de Nederlandse Antillen en Aruba voor de vervulling van een taak van zwaarwegend algemeen
      belang;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
  - number: 67.1.h
    text: |-
      de Informatie Beheer Groep voor de uitvoering van de [Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0020611
  - number: '67.2'
    text: |-
      Het verstrekken door het college aan de in het eerste lid bedoelde instanties van de in het eerste lid bedoelde
      gegevens kan geschieden door tussenkomst van het Inlichtingenbureau.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
  - number: '67.3'
    text: |-
      De in het eerste lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer van de
      betrokkenen daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
  - number: '67.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de gevallen waarin en de wijze
      waarop in ieder geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
  - number: '67.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere instanties dan genoemd in het eerste lid worden aangewezen ten
      behoeve waarvan de verplichtingen, bedoeld in het eerste lid, eveneens gelden.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel67
  - number: '68.1'
    text: |-
      In de administratie van de gemeente en van het Inlichtingenbureau terzake van de uitvoering van deze wet wordt het
      burgerservicenummer of, bij het ontbreken daarvan, het sociaal-fiscaalnummer opgenomen waaronder een natuurlijk
      persoon is geregistreerd bij de belastingdienst.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel68
  - number: '68.2'
    text: |-
      Bij de verstrekking van gegevens door het college, het Inlichtingenbureau en de in de [artikelen 64][ref1]
      en [67][ref2] bedoelde instanties wordt, indien daartoe bevoegd, gebruik gemaakt van dit burgerservicenummer,
      onderscheidenlijk dit sociaal-fiscaalnummer. Derden die in het kader van de uitoefening van beroep of bedrijf
      de arbeidsinschakeling van personen bevorderen gebruiken het burgerservicenummer, onderscheidenlijk het sociaal-
      fiscaalnummer, slechts voorzover dat noodzakelijk is voor het verrichten van werkzaamheden die in het kader van de
      voorzieningen, bedoeld in [artikel 7, eerste lid, onderdeel a, en het tweede lid][ref3], worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '64'
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '67'
        hoofdstuk: '6'
        paragraaf: '6.6'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: '68.3'
    text: |-
      Ten behoeve van het gebruik van het sociaal-fiscaalnummer bij het ontbreken van het burgerservicenummer kan Onze
      Minister van Financiën aan personen die algemene bijstand ontvangen, een sociaal-fiscaalnummer toekennen, indien
      aan die personen nog geen sociaal-fiscaalnummer is toegekend.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel68
  - number: '69.1'
    text: |-
      Onze Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan het college een uitkering voor de kosten van de
      door het college toegekende:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
  - number: 69.1.a
    text: algemene bijstand;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
  - number: 69.1.b
    text: |-
      inkomensvoorziening, bedoeld in de [Wet investeren in jongeren][ref1]. In de uitkering zijn
      begrepen de loonbelasting, de premies volksverzekeringen die daarover verschuldigd zijn en de in
      [artikel 46 van de Zorgverzekeringswet][ref2] bedoelde vergoedingen van de inkomensafhankelijke bijdragen daarover.


      [ref1]: https://wetten.overheid.nl/BWBR0026054
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel46
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0026054
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '46'
  - number: '69.2'
    text: |-
      Het bedrag van de uitkering wordt volgens bij of krachtens algemene maatregel van bestuur te stellen regels
      berekend aan de hand van het voor ieder jaar bij begrotingswet vast te stellen totale bedrag dat beschikbaar is
      voor de uitkering, bedoeld in het eerste lid. Bij de vaststelling van het totale bedrag dat beschikbaar is voor
      de uitkering, bedoeld in het eerste lid, is het uitgangspunt dat dit bedrag toereikend is voor de voor dat jaar
      geraamde kosten, bedoeld in dat lid, van alle gemeenten.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
  - number: '69.3'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in het tweede lid, kunnen regels worden gesteld
      omtrent:
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
  - number: 69.3.a
    text: de berekening van verschillende delen van de uitkering, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
  - number: 69.3.b
    text: |-
      het verzamelen van gegevens noodzakelijk voor de berekening van het bedrag van de uitkering, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
  - number: '69.4'
    text: |-
      Mede ten behoeve van de kosten van de voorzieningen, bedoeld in [artikel 7, eerste lid, onderdeel a][ref1], niet
      zijnde uitvoeringskosten, ontvangt het college een uitkering op grond van de [Wet participatiebudget][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0025039
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0025039
  - number: '71.1'
    text: |-
      Het totale bedrag, bedoeld in [artikel 69, tweede lid][ref1], voor de uitkering, bedoeld in
      [artikel 69, eerste lid][ref2], wordt in het jaar waarop het bedrag betrekking heeft bij of krachtens de
      wet aangepast op basis van nieuwe ramingsgegevens. [Artikel 69, tweede lid, tweede volzin][ref3], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '71.2'
    text: |-
      Indien het totale bedrag wordt herzien, wordt het bedrag waarmee de uitkering, bedoeld in
      [artikel 69, eerste lid][ref1], wordt aangepast binnen een periode van vier weken na de herziening door Onze
      Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '71.3'
    text: |-
      Bij toepassing van het tweede lid kan Onze Minister vanuit het oogmerk van een meer evenwichtige verdeling van
      het totale bedrag, bedoeld in [artikel 69, eerste lid][ref1], de peildatum van de gegevens noodzakelijk voor
      de berekening, bedoeld in [artikel 69, tweede lid][ref2], actualiseren, leidende tot een nieuwe uitkering per
      gemeente. Van een actualisatie als bedoeld in de eerste volzin wordt door Onze Minister mededeling gedaan in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '72.1'
    text: |-
      Onze Minister kan, indien hij van oordeel is dat het college, na afloop van de termijn, bedoeld in
      [artikel 76, derde lid][ref1], geen of onvoldoende gevolg heeft gegeven aan een aanwijzing als bedoeld in
      [artikel 76, derde lid][ref2], de uitkering, bedoeld in [artikel 69, eerste lid][ref3], voor het jaar volgend op
      het jaar waarin de termijn afloopt, 1 procent lager vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '72.2'
    text: |-
      Onze Minister kan, indien hij van oordeel is dat het college, twaalf maanden na afloop van de termijn, bedoeld
      in [artikel 76, derde lid][ref1], nog geen of onvoldoende gevolg heeft gegeven aan een aanwijzing als bedoeld
      in [artikel 76, derde lid][ref2], de uitkering, bedoeld in [artikel 69, eerste lid][ref3], voor het tweede jaar
      volgend op het jaar waarin de termijn afloopt en de daaropvolgende jaren, telkens ten hoogste 3 procent lager
      vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel76
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '76'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '73.1'
    text: Er is een toetsingscommissie.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel73
  - number: '73.2'
    text: |-
      De toetsingscommissie heeft tot taak aan Onze Minister een oordeel te geven over een verzoek als bedoeld in
      [artikel 74, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '73.3'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel73
  - number: '74.1'
    text: |-
      Indien de door het college gemaakte kosten, bedoeld in [artikel 69, eerste lid][ref1], hoger zijn dan de daarvoor
      verstrekte uitkering, kan door Onze Minister ten laste van een daarvoor ieder jaar bij wet vast te stellen bedrag
      op verzoek van het college een incidentele aanvullende uitkering of een meerjarige aanvullende uitkering worden
      toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '74.2'
    text: |-
      Een verzoek als bedoeld in het eerste lid wordt door het college ingediend bij de toetsingscommissie, bedoeld in
      [artikel 73][ref1]. Bij ministeriële regeling worden regels gesteld met betrekking tot de termijn waarbinnen een
      verzoek als bedoeld in het eerste lid kan worden ingediend en de termijn waarbinnen op dat verzoek wordt beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel73
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '73'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '74.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld onder welke voorwaarden een verzoek kan worden
      ingediend en op grond waarvan de toetsingscommissie een verzoek beoordeelt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74
  - number: '74.4'
    text: |-
      Bij de beslissing op het verzoek betrekt Onze Minister, naast het oordeel van de toetsingscommissie, het oordeel
      van de Inspectie Werk en Inkomen over de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74
  - number: 74a.1
    text: |-
      Onze Minister kan voorwaarden verbinden aan het besluit tot verlening van een meerjarige aanvullende uitkering als
      bedoeld in [artikel 74, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 74a.2
    text: |-
      Onze Minister kan een verleende meerjarige aanvullende uitkering verminderen of intrekken indien het college in
      strijd handelt met een wettelijk voorschrift dat betrekking heeft op de meerjarige aanvullende uitkering, of met
      een voorwaarde die aan het besluit tot verlening van een meerjarige aanvullende uitkering is verbonden.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74a
  - number: 74a.3
    text: |-
      De meerjarige aanvullende uitkering die als gevolg van een besluit als bedoeld in het tweede lid onverschuldigd is
      betaald wordt door Onze Minister teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74a
  - number: 74a.4
    text: |-
      Indien volledige terugvordering naar het oordeel van Onze Minister leidt tot een onbillijkheid van overwegende
      aard, stelt Onze Minister de terugvordering vast op een percentage van de meerjarige aanvullende uitkering.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74a
  - number: 74a.5
    text: Onze Minister kan de onverschuldigd betaalde uitkering, bedoeld in het derde lid, invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74a
  - number: 74a.6
    text: |-
      Een oordeel als bedoeld in [artikel 73, tweede lid][ref1], dat betrekking heeft op een verzoek tot een meerjarige
      aanvullende uitkering, wordt gepubliceerd op internet.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel73
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel74a
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '73'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '75'
    text: 'Bij ministeriële regeling worden regels gesteld inzake de betaling van:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel75
  - number: 75.a
    text: |-
      de uitkering, bedoeld in [artikel 69, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel69
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '69'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 75.b
    text: |-
      het bedrag waarmee de uitkering op grond van [artikel 71][ref1] wordt aangepast;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel71
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '71'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 75.c
    text: |-
      de incidentele aanvullende uitkering en de meerjarige aanvullende uitkering, bedoeld in [artikel 74][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '76.1'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel76
  - number: 76.1.a
    text: de rechtmatigheid van de uitvoering van deze wet door het college;
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel76
  - number: 76.1.b
    text: de doeltreffendheid van deze wet.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel76
  - number: '76.2'
    text: |-
      Het toezicht, bedoeld in het eerste lid, wordt onder gezag van Onze Minister uitgeoefend door de Inspectie
      Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1],
      onder leiding van het hoofd van die inspectie. De [artikelen 37][ref2], [38][ref3], [42][ref4] en
      [44 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5] zijn van overeenkomstige
      toepassing. De Inspectie Werk en Inkomen is tevens belast met het geven van het oordeel, bedoeld in
      [artikel 74, vierde lid][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel38
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel42
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel44
      [ref6]: https://wetten.overheid.nl/BWBR0015703#Artikel74
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '38'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '42'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '44'
      - id: ref6
        bwb_id: BWBR0015703
        artikel: '74'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '76.3'
    text: |-
      Onze Minister kan, indien hij met betrekking tot de rechtmatige uitvoering van deze wet ernstige tekortkomingen
      constateert, aan het college, nadat het gedurende acht weken in de gelegenheid is gesteld zijn zienswijze naar
      voren te brengen, een aanwijzing geven. Hij treedt daarbij niet in de besluitvorming inzake individuele gevallen.
      In een aanwijzing wordt een termijn opgenomen waarbinnen het college de uitvoering in overeenstemming heeft
      gebracht met deze aanwijzing.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel76
  - number: 76a
    text: Met het toezicht op de naleving van deze wet zijn belast de bij besluit van het college aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel76a
  - number: '77.1'
    text: |-
      Het college legt verantwoording af aan Onze Minister over de uitvoering van deze wet, op de wijze, bedoeld in
      [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '77.2'
    text: Het college dient jaarlijks bij Onze Minister een beeld van de uitvoering in.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel77
  - number: '77.3'
    text: Bij ministeriële regeling worden regels gesteld inzake het beeld van de uitvoering.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel77
  - number: '78.1'
    text: |-
      Het college en de gemeenteraad verstrekken desgevraagd aan Onze Minister de inlichtingen die hij voor het toezicht,
      de statistiek, de informatievoorziening en de beleidsvorming met betrekking tot deze wet nodig heeft.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78
  - number: '78.2'
    text: |-
      Onze Minister stelt een beleidsplan op dat het kader biedt waarbinnen hij de inlichtingen, bedoeld in het eerste
      lid, vraagt. Over het beleidsplan of een wijziging daarvan overlegt hij met de daartoe door hem aangewezen
      rechtspersoon die de gemeenten vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78
  - number: '78.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop het college en de
      gemeenteraad de in het eerste lid bedoelde inlichtingen verzamelen en verstrekken, waarbij kan worden bepaald dat
      categorieën van gemeenten bepaalde inlichtingen niet hoeven te verzamelen en te verstrekken.
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78
  - number: '78.4'
    text: |-
      De inlichtingen, bedoeld in het eerste lid, en het beeld van de uitvoering, bedoeld in [artikel 77][ref1], worden
      kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel77
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '77'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 78a
    text: |-
      De verordening, bedoeld in [artikel 38 van de Algemene bijstandswet][ref1], geldt als de verordening, bedoeld in
      [artikel 8, eerste lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78a
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0015703
        artikel: '8'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 78b.1
    text: |-
      Door het college op grond van de [Algemene bijstandswet][ref1], de [Wet inschakeling werkzoekenden][ref2] of het
      [Besluit in- en doorstroombanen][ref3] genomen besluiten gelden als door hem genomen besluiten op grond van deze
      wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0009083
      [ref3]: https://wetten.overheid.nl/BWBR0010994
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78b
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0009083
      - id: ref3
        bwb_id: BWBR0010994
  - number: 78b.2
    text: |-
      In afwijking van het eerste lid gelden door het college op grond van de [Wet inschakeling werkzoekenden][ref1]
      of het [Besluit in- en doorstroombanen][ref2] ten aanzien van personen die een uitkering ontvangen op grond
      van de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref3]
      of de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4]
      genomen besluiten als door hem genomen besluiten op grond van de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] onderscheidenlijk
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0009083
      [ref2]: https://wetten.overheid.nl/BWBR0010994
      [ref3]: https://wetten.overheid.nl/BWBR0004163
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
      [ref6]: https://wetten.overheid.nl/BWBR0004044
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78b
    references:
      - id: ref1
        bwb_id: BWBR0009083
      - id: ref2
        bwb_id: BWBR0010994
      - id: ref3
        bwb_id: BWBR0004163
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
      - id: ref6
        bwb_id: BWBR0004044
  - number: 78b.3
    text: |-
      Door het college of Onze Minister op grond van de [Invoeringswet Wet werk en bijstand][ref1] genomen besluiten
      gelden met ingang van de dag van inwerkingtreding van de wet van 29 december 2008 tot intrekking van de
      Invoeringswet Wet werk en bijstand (Stb. 586) als door het college of Onze Minister genomen besluiten op grond van
      deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015704
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78b
    references:
      - id: ref1
        bwb_id: BWBR0015704
  - number: 78c
    text: |-
      [Artikel 20 van de Algemene bijstandswet][ref1] en
      [artikel 4, vierde lid, laatste zin, van de Invoeringswet herinrichting Algemene Bijstandswet][ref2], zoals die
      luidde op 31 december 2003, blijven van toepassing op bijstand die op 31 december 2003 werd verleend met toepassing
      van die artikelen.


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0007334#Artikel4
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78c
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0007334
        artikel: '4'
  - number: 78d.1
    text: |-
      Een dienstbetrekking als bedoeld in [artikel 4 van de Wet inschakeling werkzoekenden][ref1], een
      arbeidsovereenkomst als bedoeld in [artikel 5, eerste lid, van die wet][ref2] en een dienstbetrekking als
      bedoeld in [artikel 6 van het Besluit in- en doorstroombanen][ref3] gelden als een voorziening als bedoeld in
      [artikel 7, eerste lid, onderdeel a][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009083#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009083#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0010994#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0015703#Artikel7
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78d
    references:
      - id: ref1
        bwb_id: BWBR0009083
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009083
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0010994
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0015703
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '1.2'
  - number: 78d.2
    text: |-
      Op dienstbetrekkingen als bedoeld in de [Wet inschakeling werkzoekenden][ref1] blijft
      [titel 10 van Boek 7 van het Burgerlijk Wetboek][ref2] alsmede de [artikelen 4, tweede, zesde en zevende lid][ref3],
      en [11, aanhef en onderdeel a, van de Wet inschakeling werkzoekenden][ref4] van toepassing. Op deze
      dienstbetrekkingen is [artikel 134, tweede lid, van de Ambtenarenwet][ref5] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009083
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0009083#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0009083#Artikel11
      [ref5]: https://wetten.overheid.nl/BWBR0001947#Artikel134
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78d
    references:
      - id: ref1
        bwb_id: BWBR0009083
      - id: ref2
        bwb_id: BWBR0005290
      - id: ref3
        bwb_id: BWBR0009083
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0009083
        artikel: '11'
      - id: ref5
        bwb_id: BWBR0001947
        artikel: '134'
  - number: 78e.1
    text: 'Op een bezwaar- of beroepschrift dat:'
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78e
  - number: 78e.1.a
    text: |-
      vóór of op 31 december 2003 is ingediend tegen een door het college op grond van de [Algemene bijstandswet][ref1],
      de [Wet inschakeling werkzoekenden][ref2] of het [Besluit in- en doorstroombanen][ref3] genomen besluit en waarop
      op die datum nog niet onherroepelijk is beslist;


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0009083
      [ref3]: https://wetten.overheid.nl/BWBR0010994
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0007333
      - id: ref2
        bwb_id: BWBR0009083
      - id: ref3
        bwb_id: BWBR0010994
  - number: 78e.1.b
    text: |-
      na 31 december 2003 is ingediend tegen een op grond van de in het eerste lid
      bedoelde wetten of het [Besluit in- en doorstroombanen][ref1] met toepassing van
      [artikel 2, tweede lid, van de Invoeringswet Wet werk en bijstand][ref2], na 31 december 2003 genomen besluit en
      waarop nog niet onherroepelijk is beslist op het tijdstip dat de bepaling vervalt op grond waarvan het besluit
      is genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0010994
      [ref2]: https://wetten.overheid.nl/BWBR0015704#Artikel2
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0010994
      - id: ref2
        bwb_id: BWBR0015704
        artikel: '2'
  - number: 78e.1.c
    text: |-
      na 31 december 2003 is ingediend en betrekking heeft op bijstandsverlening waarop op grond van
      [artikel 12, eerste lid, van de Invoeringswet Wet werk en bijstand][ref1] de [Algemene bijstandswet][ref2]
      van toepassing is; wordt beslist met toepassing van onderscheidenlijk de [Algemene bijstandswet][ref3],
      [de Wet inschakeling werkzoekenden][ref4] of het [Besluit in- en doorstroombanen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0015704#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007333
      [ref3]: https://wetten.overheid.nl/BWBR0007333
      [ref4]: https://wetten.overheid.nl/BWBR0009083
      [ref5]: https://wetten.overheid.nl/BWBR0010994
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0015704
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0007333
      - id: ref3
        bwb_id: BWBR0007333
      - id: ref4
        bwb_id: BWBR0009083
      - id: ref5
        bwb_id: BWBR0010994
  - number: 78e.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op verzoeken als bedoeld in
      [artikel 140 van de Algemene bijstandswet][ref1] en verzoeken om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007333#Artikel140
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0007333
        artikel: '140'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 78e.3
    text: |-
      Op een bezwaar- of beroepschrift dat voor of op de dag van inwerkingtreding van de wet van 29 december 2008 tot
      intrekking van de Invoeringswet Wet werk en bijstand (Stb. 586) is ingediend tegen een door het college of Onze
      Minister op grond van de [Invoeringswet Wet werk en bijstand][ref1] genomen besluit en waarop op die datum nog niet
      onherroepelijk is beslist wordt beslist met toepassing van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0015704
    url: https://wetten.overheid.nl/BWBR0015703/2009-10-01#Artikel78e
    references:
      - id: ref1
        bwb_id: BWBR0015704
  - number: 78f.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de verlening van
      bijstand en bijstand ter voorziening in de behoefte aan bedrijfskapitaal op grond van deze wet aan zelfstandigen
      en aan personen die algemene bijstand ontvangen dan wel een inkomensvoorziening ontvangen op grond van de
      [Wet investeren in jongeren][ref1] en voornemens zijn een bedrijf of zelfstandig beroep te beginnen en zich in
      verband hiermee niet beschikbaar stellen voor arbeid in dienstbetrekking gedurende de voorbereidingsperiode van
      ten hoogste twaalf maanden, waarbij kan worden afgeweken van de [artikelen 9][ref2], [10][ref3], [11][ref4],
      [13][ref5], [32][ref6], [34][ref7], [40][ref8], [41][ref9], [45][ref10], [58][ref11], [77][ref12] en de
      [paragrafen 4.2][ref13], [6.1][ref14] en[ 7.1][ref15].


      [ref1]: https://wetten.overheid.nl/BWBR0026054
      [ref2]: https://wetten.overheid.nl/BWBR0015703#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0015703#Artikel10
