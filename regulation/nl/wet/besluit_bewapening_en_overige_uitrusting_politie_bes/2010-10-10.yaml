preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 13 juli 2010, nr. 2010-
    0000461978, CZW/WSG;

    Gelet op de artikelen 41, eerste en tweede lid, en 42, eerste en tweede lid, van de Rijkswet politie van Curaçao,
    van Sint Maarten en van Bonaire, Sint Eustatius en Saba;

    De Raad van State gehoord (advies van 11 augustus 2010, nr. W04.10.0346/I );

    Gezien het nader rapport van de Staatssecretaris van Binnenlandse Zaken en Koninkrijksrelaties van 22 september
    2010, nr. 2010-0000600906;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: 'In dit besluit wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
  - number: 1.a
    text: |-
      *rijkswet:* de [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028079
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028079
  - number: 1.b
    text: |-
      *ambtenaar:* de ambtenaar, bedoeld in [artikel 3, onder a, van de rijkswet][ref1], met de hoofdrang hoger dan die
      van aspirant;


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: 1.c
    text: '*aspirant:* degene die is toegelaten tot de basisopleiding;'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
  - number: 1.d
    text: |-
      *korpsbeheerder:* degene die op grond van [artikel 47, derde lid, van de rijkswet][ref1] wat betreft het beheer het
      bevoegd gezag uitoefent over het politiekorps van Bonaire, Sint Eustatius en Saba;


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel47
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '47'
  - number: 1.e
    text: |-
      *hoofdrang:* een hoofdrang als bedoeld in
      [artikel 3, eerste lid, van het Besluit rechtspositie korps politie BES][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: '3'
  - number: 1.f
    text: '*Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties;'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
  - number: 1.g
    text: |-
      *bevoegd gezag:* het gezag, bedoeld in de [artikelen 16][ref1] en [17 van de rijkswet][ref2] en
      [artikel 8 van de Veiligheidswet BES][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0028079#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0028586#Artikel8
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0028079
        artikel: '17'
      - id: ref3
        bwb_id: BWBR0028586
        artikel: '8'
  - number: 1.h
    text: |-
      *keuringscommissies:* keuringscommissies als bedoeld in [artikel 19, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel19
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '19'
        hoofdstuk: '3'
  - number: 1.i
    text: |-
      *keuringsreglementen:* keuringsreglementen als bedoeld in [artikel 20, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel20
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '20'
        hoofdstuk: '3'
  - number: 1.j
    text: |-
      *aanhoudings- en ondersteuningswerkzaamheden:* werkzaamheden als bedoeld in
      [artikel 6, eerste lid, a tot en met e, van het Besluit beheer politiekorps BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028780#Artikel6
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028780
        artikel: '6'
  - number: '2.1'
    text: 'De bewapening van de ambtenaar bestaat tijdens de uitoefening van de dienst uit:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: 2.1.a
    text: een korte wapenstok;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: 2.1.b
    text: pepperspray en nazorgmiddelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: 2.1.c
    text: een pistool of een revolver met de daarbij behorende munitie.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: '2.2'
    text: |-
      De korpsbeheerder kan ambtenaren van politie aanwijzen die van het dragen van een in het eerste lid genoemd wapen
      zijn vrijgesteld.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: '2.3'
    text: |-
      De korpsbeheerder kan bepalen dat de ambtenaar die belast is met surveillance en beschikt over een geldig
      certificaat als bedoeld in [artikel 25, eerste lid][ref1], mede wordt uitgerust met een politiesurveillancehond,
      een elektrische wapenstok en een lange wapenstok.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel25
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '25'
        hoofdstuk: '3'
  - number: '2.4'
    text: 'De overige uitrusting van de ambtenaar bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: 2.4.a
    text: handboeien;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: 2.4.b
    text: een koppel.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: '2.5'
    text: De korpsbeheerder kan de ambtenaar mede uitrusten met een veiligheidsvest of tie-raps.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel2
  - number: '3.1'
    text: |-
      De bewapening van de aspirant bestaat in het gedeelte van de opleiding dat in het korps wordt doorgebracht tijdens
      de uitoefening van de dienst uit:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel3
  - number: 3.1.a
    text: een korte wapenstok;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel3
  - number: 3.1.b
    text: pepperspray en nazorgmiddelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      De korpsbeheerder kan de aspirant, bedoeld in het eerste lid, mede bewapenen met een pistool of een revolver met de
      daarbij behorende munitie.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De bewapening van de ambtenaar van politie, bedoeld in [artikel 3, eerste lid, onder c, van de rijkswet][ref1]
      bestaat tijdens de uitoefening van de dienst uit:


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: 4.1.a
    text: een korte wapenstok;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel4
  - number: 4.1.b
    text: de pepperspray en nazorgmiddelen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel4
  - number: '4.2'
    text: |-
      Indien de ambtenaar van politie, bedoeld in het eerste lid, is aangesteld in een van de rangen, bedoeld in
      [artikel 3a, onder c, van het Besluit rechtspositie korps politie BES][ref1], omvat zijn bewapening tevens het
      pistool. Het bewapenen van de ambtenaar van politie, bedoeld in het eerste lid, op wie de eerste volzin niet van
      toepassing is, met het pistool is toegestaan indien Onze Minister en Onze Minister van Justitie daarvoor, onder
      door hen te stellen voorwaarden, toestemming hebben verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0028767#Artikel3a
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028767
        artikel: 3a
  - number: '4.3'
    text: Het verzoek voor het bewapenen met het pistool wordt gedaan door de korpsbeheerder.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel4
  - number: '5.1'
    text: |-
      De bewapening van de ambtenaar die is belast met het optreden ter handhaving van de openbare orde en
      hulpverlening bij grootschalige manifestaties en evenementen, het uitvoeren van evacuaties, het bewaken en
      beveiligen van objecten, het optreden tijdens rampen en crises, het uitvoeren van zoekacties en het aanhouden van
      ordeverstoorders, bestaat mede uit:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel5
  - number: 5.1.a
    text: een lange wapenstok;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel5
  - number: 5.1.b
    text: een gasgeweer met bijbehorende gasprojectielen of traangasverspreidende middelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel5
  - number: 5.1.c
    text: |-
      een semi-automatisch vuurwapen met de daarbij behorende munitie, voor zover hij is belast met de uitvoering van de
      bewakings- en beveiligingstaak.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel5
  - number: '5.2'
    text: |-
      De korpsbeheerder kan bepalen dat een ambtenaar als bedoeld in het eerste lid die beschikt over een geldig
      certificaat als bedoeld in [artikel 25, eerste lid][ref1], tijdens de uitoefening van de dienst mede wordt
      uitgerust met een politiesurveillancehond en een elektrische wapenstok.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel25
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '25'
        hoofdstuk: '3'
  - number: '5.3'
    text: |-
      De overige uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat tijdens de uitoefening van de dienst uit
      een gasmasker en een schild.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel5
  - number: '5.4'
    text: |-
      De korpsbeheerder kan de ambtenaar, bedoeld in het eerste lid, mede uitrusten met een kogelwerend vest en een
      kogelwerende helm.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel5
  - number: '6'
    text: 'De bewapening van de ambtenaar die is belast met persoonsbeveiliging bestaat mede uit:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel6
  - number: 6.a
    text: een gasgeweer met bijbehorende gasprojectielen of traangasverspreidende middelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel6
  - number: 6.b
    text: een semi-automatisch vuurwapen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel6
  - number: 6.c
    text: een automatisch vuurwapen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel6
  - number: '7.1'
    text: 'De bewapening van de ambtenaar die is belast met aanhoudings en ondersteuningswerkzaamheden, bestaat mede uit:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel7
  - number: 7.1.a
    text: een pistoolmitrailleur met de daarbij behorende munitie;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel7
  - number: 7.1.b
    text: een gasgeweer met bijbehorende gasprojectielen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel7
  - number: 7.1.c
    text: een semi-automatisch vuurwapen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel7
  - number: '7.2'
    text: |-
      De korpsbeheerder kan bepalen dat een ambtenaar als bedoeld in het eerste lid die beschikt over een
      geldig certificaat als bedoeld in [artikel 25, eerste lid][ref1], tijdens de uitoefening van de dienst
      mede wordt uitgerust met een hond met als doel in politiedienst te worden ingezet bij aanhoudings- en
      ondersteuningswerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel25
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '25'
        hoofdstuk: '3'
  - number: '7.3'
    text: |-
      De overige uitrusting van de ambtenaar, bedoeld in het eerste lid, bestaat tijdens de uitoefening van de dienst uit
      een gasmasker en explosieven.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel7
  - number: '7.4'
    text: |-
      De korpsbeheerder kan de ambtenaar, bedoeld in het eerste lid, mede uitrusten met een kogelwerend vest en een
      kogelwerende helm.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      De bewapening van de ambtenaar die behoort tot een bijzondere bijstandseenheid, bestaat mede uit een vuurwapen
      waarmee lange-afstandsprecisievuur kan worden afgegeven met de daarbij behorende munitie.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      De korpsbeheerder kan bepalen dat een ambtenaar als bedoeld in het eerste lid die beschikt over een geldig
      certificaat als bedoeld in [artikel 25, eerste lid][ref1], tijdens de uitoefening van de dienst bij deze eenheid
      mede wordt bewapend met een hond met als doel in politiedienst te worden ingezet bij het optreden van deze eenheid.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel25
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '25'
        hoofdstuk: '3'
  - number: '8.3'
    text: |-
      De korpsbeheerder kan de ambtenaar, bedoeld in het eerste lid, mede uitrusten met een kogelwerend vest en een
      kogelwerende helm.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel8
  - number: '9'
    text: |-
      De korpsbeheerder kan een andere ambtenaar, dan bedoeld in de [artikelen 5][ref1], [7][ref2] en [8][ref3],
      uitrusten met een kogelwerend vest, een kogelwerende helm of een gasmasker.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0028588#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0028588#Artikel8
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0028588
        artikel: '7'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0028588
        artikel: '8'
        hoofdstuk: '2'
  - number: '10.1'
    text: |-
      De korpsbeheerder kan een ambtenaar die is belast met de grensbewaking en met het toezicht op personen, uitrusten
      met hulpmiddelen ten behoeve van de verwijdering van vreemdelingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel10
  - number: '10.2'
    text: 'Onder hulpmiddelen als bedoeld in het eerste lid worden verstaan:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel10
  - number: 10.2.a
    text: handboeien;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel10
  - number: 10.2.b
    text: combinatieriem;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel10
  - number: 10.2.c
    text: klittenband;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel10
  - number: 10.2.d
    text: tie-raps;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel10
  - number: 10.2.e
    text: schuimcap.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel10
  - number: '11'
    text: |-
      De korpsbeheerder kan in bijzondere, door het bevoegd gezag aangegeven situaties, een ambtenaar aanwijzen die
      tijdelijk mede wordt bewapend met:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel11
  - number: 11.a
    text: een lange wapenstok;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel11
  - number: 11.b
    text: rookgranaten, gasgranaten of gashouders, of
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel11
  - number: 11.c
    text: een pistoolmitrailleur met de daarbij behorende munitie.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel11
  - number: '12'
    text: |-
      De korpsbeheerder draagt er zorg voor dat de ambtenaar slechts over een wapen beschikt indien hij voldoet aan de
      gestelde eisen van bekwaamheid, bedoeld in hoofdstuk VIIb van het Besluit rechtspositie korps politie BES.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel12
  - number: '13'
    text: |-
      De korpsbeheerder stelt regels met betrekking tot het dragen, het onderhoud en het in een inbraakvrije ruimte
      bewaren van de wapens en munitie, bedoeld in de [artikelen 2 tot en met 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel2
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '2'
        hoofdstuk: '2'
  - number: '14.1'
    text: |-
      De korpsbeheerder kan een ambtenaar die beschikt over een geldig certificaat als bedoeld in
      [artikel 25, eerste lid][ref1], uitrusten met een politiespeurhond.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel25
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '25'
        hoofdstuk: '3'
  - number: '14.2'
    text: |-
      Uitrusting met een politiespeurhond menselijk geur geschiedt uitsluitend voor de speurtaak of
      geuridentificatietaak.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel14
  - number: '14.3'
    text: |-
      Uitrusting met een politiespeurhond explosieven geschiedt uitsluitend voor het opsporen van explosieven, vuurwapen
      en munitie.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel14
  - number: '14.4'
    text: |-
      Uitrusting met een politiespeurhond verdovende middelen geschiedt uitsluitend voor het opsporen van verdovende
      middelen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel14
  - number: '14.5'
    text: |-
      Uitrusting met een politiespeurhond stoffelijke resten geschiedt uitsluitend voor het opsporen van stoffelijke
      resten van mensen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel14
  - number: '14.6'
    text: |-
      Uitrusting met een politiespeurhond brandversnellende middelen geschiedt uitsluitend voor het opsporen van
      brandversnellende middelen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Tot de overige uitrusting van de ambtenaar en de ambtenaar, bedoeld in
      [artikel 3, onder a en c, van de rijkswet][ref1], kunnen behoren:


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: 15.1.a
    text: helm;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: 15.1.b
    text: valhelm;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: 15.1.c
    text: identiteitskaart;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: 15.1.d
    text: elektrische lantaarn;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: 15.1.e
    text: signaalfluit met ketting en haak;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: 15.1.f
    text: aantekenboekje;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: 15.1.g
    text: zakmes;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: 15.1.h
    text: verkeersondermouwen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      De korpsbeheerder kan andere uitrusting, dan bedoeld in het eerste lid, aanwijzen. Hij bepaalt aan welke ambtenaren
      de overige uitrusting wordt verstrekt en wanneer deze wordt gedragen of gebruikt.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel15
  - number: '16.1'
    text: |-
      Onze Minister stelt voor de wapens, de daarbij behorende draagmiddelen en de munitie het merk en type vast, met
      dien verstande dat de eisen waaraan de bewapening van de politie in verband met de taakuitvoering moet voldoen in
      overeenstemming met Onze Minister van Justitie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel16
  - number: '16.2'
    text: Onze Minister kan voor de overige uitrusting het merk en type vaststellen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister is verantwoordelijk voor de aanschaf en afvoer van de in dit besluit genoemde wapens en de daarbij
      behorende munitie, alsmede de overige uitrusting ten behoeve van het politiekorps.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel17
  - number: '17.2'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de aanschaf en afvoer van wapens en de daarbij
      behorende munitie, alsmede over de overige uitrusting.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister kan toestemming verlenen een ambtenaar gedurende maximaal een jaar mede te bewapenen met een wapen
      of munitie voor zover dit noodzakelijk is voor de beproeving ervan. De termijn kan eenmaal worden verlengd met
      maximaal een jaar.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel18
  - number: '18.2'
    text: Onze Minister stelt de Ministers van Justitie van Curaçao en van Sint Maarten hiervan in kennis.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel18
  - number: '18.3'
    text: Onze Minister stelt het merk en type van het wapen of de munitie, bedoeld in het eerste lid, vast.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel18
  - number: '19.1'
    text: |-
      Er zijn keuringscommissies voor de politiespeurhond, voor de politiesurveillancehond en voor de hond die bedoeld
      is om in te zetten bij aanhoudings- en ondersteuningswerkzaamheden, waarvan de leden worden aangewezen door Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel19
  - number: '19.2'
    text: |-
      De leden van de keuringscommissies zijn ambtenaar van politie als bedoeld in
      [artikel 3, onder a of c, van de rijkswet][ref1]. Van de keuringscommissie voor de politiespeurhond kunnen tevens
      buitengewone agenten van politielid zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: '19.3'
    text: |-
      De leden van de keuringscommissie voor de politiespeurhonden, de politiesurveillancehond respectievelijk de hond
      die bedoeld is om in te zetten bij aanhoudings- en ondersteuningswerkzaamheden, beschikken over een ruime en
      aantoonbare dressuurtechnische ervaring en praktische politie-ervaring op het gebied van de inzet en het gebruik
      van de desbetreffende hond. De leden van de keuringscommissie voor de politiespeurhond beschikken tevens over
      kennis van de toepasselijke strafvorderlijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel19
  - number: '20.1'
    text: |-
      Bij ministeriële regeling worden keuringsreglementen vastgesteld met betrekking tot de keuring van de
      politiespeurhond, de politiesurveillancehond en de hond die bedoeld is om in te zetten bij aanhoudings- en
      ondersteuningswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: '20.2'
    text: 'Het keuringsreglement voor de politiespeurhond bevat ten minste de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.a
    text: 'voor alle politiespeurhonden met uitzondering van de politiespeurhonden menselijke geur:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.a.1°
    text: gehoorzaamheid van de politiespeurhond aan de geleider;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.a.2°
    text: een goede samenwerking van de politiespeurhond met de geleider;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.a.3°
    text: het niet agressief zijn ten opzichte van mensen en dieren;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.a.4°
    text: |-
      de vaardigheid van het kunnen nemen van alle hindernissen die voor een goed functioneren in de praktijk geen
      belemmering mogen zijn;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.b
    text: 'voor de speurtaak van de politiespeurhonden menselijke geur:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.b.1°
    text: het zelfstandig willen en kunnen zoeken van kleine en grote voorwerpen met menselijke geur;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.b.2°
    text: het opsporen en lokaliseren van een persoon;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.b.3°
    text: het speuren over gecombineerde terreinen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.c
    text: |-
      voor de geuridentificatietaak van de politiespeurhond menselijke geur: het uitvoeren van een tweetal
      geuridentificatieproeven, zoals in het keuringsreglement omschreven;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.d
    text: 'voor de politiespeurhond verdovende middelen:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.d.1°
    text: het zelfstandig willen en kunnen zoeken van verdovende middelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.d.2°
    text: |-
      het vermogen om binnen een redelijke tijd alleen die soorten verdovende middelen op te sporen, die in het
      keuringsreglement zijn aangewezen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.e
    text: 'voor de politiespeurhond explosieven:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.e.1°
    text: het zelfstandig willen en kunnen zoeken naar explosieven, wapens en munitie;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.e.2°
    text: het vermogen om binnen redelijke tijd explosieven, wapens en munitie op te sporen en te lokaliseren;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.f
    text: |-
      voor de politiespeurhond stoffelijke resten: het zelfstandig willen en kunnen zoeken naar stoffelijke resten van
      mensen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.g
    text: 'voor de politiespeurhond brandversnellende middelen:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.g.1°
    text: het zelfstandig willen en kunnen zoeken naar brandversnellende middelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: 20.2.g.2°
    text: |-
      het vermogen om binnen een redelijke tijd alleen die brandversnellende middelen op te sporen, die in het
      keuringsreglement zijn aangewezen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Aan een keuring van een combinatie van een geleider en een politiespeurhond kunnen deelnemen ambtenaren van politie
      als bedoeld in [artikel 3, onder a en c, van de rijkswet][ref1] die door de korpsbeheerder zijn aangewezen als
      geleider.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: '21.2'
    text: 'Voor een keuring komen in aanmerking honden die:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
  - number: 21.2.a
    text: door een gediplomeerd dierenarts gezond zijn verklaard;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
  - number: 21.2.b
    text: ingeënt zijn tegen de in het keuringsreglement aangewezen ziekten.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
  - number: '21.3'
    text: |-
      De keuring vindt niet plaats dan nadat de geleider politiespeurhond een van de examens, bedoeld in
      [artikel 22][ref1], met goed gevolg heeft afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel22
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '22'
        hoofdstuk: '3'
  - number: '21.4'
    text: |-
      De keuring van een combinatie van een geleider en een politiespeurhond geschiedt door de keuringscommissie voor de
      politiespeurhond op basis van het keuringsreglement voor de politiespeurhond.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
  - number: '21.5'
    text: |-
      De verdovende middelen, bedoeld in [artikel 20, tweede lid, onderdeel d, onder 2°][ref1], worden geplaatst en
      verborgen in kleine hoeveelheden, op locaties en in verpakkingen overeenkomstig de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel20
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '20'
        hoofdstuk: '3'
  - number: '21.6'
    text: De politiespeurhond wordt gedurende de keuring geleid door zijn geleider.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
  - number: '21.7'
    text: |-
      Indien de keuring niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.
      Voor een combinatie van een geleider en een politiespeurhond menselijke geur die wordt gekeurd voor de
      geuridentificatietaak bestaat de mogelijkheid van meer dan twee herkansingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel21
  - number: '22.1'
    text: |-
      De geleider speurhond menselijke geur wordt door de keuringscommissie voor de politiespeurhond geëxamineerd met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.1.a
    text: |-
      zijn kennis met betrekking tot de veiligstelling van goederen en het afnemen van geurmonsters ten behoeve van een
      geuridentificatieproef;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.1.b
    text: de factoren die van invloed zijn op het functioneren van de politiespeurhond menselijke geur;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.1.c
    text: de toepasselijke strafvorderlijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      De geleider politiespeurhond verdovende middelen wordt door de keuringscommissie voor de politiespeurhond
      geëxamineerd met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.2.a
    text: de bekende methoden van verbergen en verpakken van verdovende middelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.2.b
    text: de factoren die van invloed zijn op het functioneren van de politiespeurhond verdovende middelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.2.c
    text: de inhoud van de regelgeving inzake verdovende middelen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.2.d
    text: de toepasselijke strafvorderlijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: '22.3'
    text: |-
      De geleider politiespeurhond explosieven wordt door de keuringscommissie voor de politiespeurhond geëxamineerd met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.3.a
    text: de bekende methoden van plaatsen, verbergen en verpakken van explosieven, wapens en munitie;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.3.b
    text: de opslag en het vervoer van explosieven;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.3.c
    text: de factoren die van invloed zijn op het functioneren van de politiespeurhond explosieven;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.3.d
    text: de inhoud van de regelgeving inzake wapens, munitie en gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.3.e
    text: de toepasselijke strafvorderlijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: '22.4'
    text: |-
      De geleider politiespeurhond stoffelijke resten wordt door de keuringscommissie voor de politiespeurhond
      geëxamineerd met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.4.a
    text: de theorie inzake het werken met een speurhond stoffelijke resten;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.4.b
    text: factoren die van invloed zijn op het functioneren van de politiespeurhond stoffelijke resten;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.4.c
    text: de inhoud van de regelgeving inzake lijkbezorging;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.4.d
    text: toepasselijke strafvorderlijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: '22.5'
    text: |-
      De geleider van de politiespeurhond geld wordt door de keuringscommissie voor de politiespeurhond geëxamineerd over
      kennis van:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.5.a
    text: bankbiljetten;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.5.b
    text: de zoekmogelijkheden van de politiespeurhond geld;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.5.c
    text: het africhten van de politiespeurhond geld;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.5.d
    text: de inzetbaarheid van de politiespeurhond geld bij opsporingsonderzoeken;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: 22.5.e
    text: de toepasselijke strafvorderlijke bepalingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: '22.6'
    text: De examenvragen en de examenstof worden door de keuringscommissie voor de politiespeurhond vastgesteld.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: '22.7'
    text: Indien het examen niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel22
  - number: '23.1'
    text: |-
      Aan een keuring van een combinatie van een geleider en een politiesurveillancehond kunnen deelnemen ambtenaren
      van politie als bedoeld in [artikel 3, onder a en c, van de rijkswet][ref1], vanaf de hoofdrang van agent die zijn
      aangewezen als geleider.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: '23.2'
    text: |-
      De keuring van een combinatie van een geleider en een politiesurveillancehond geschiedt door de keuringscommissie
      voor de politiesurveillancehond op basis van het keuringsreglement voor de politiesurveillancehond als bedoeld in
      [artikel 19, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel19
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '19'
        hoofdstuk: '3'
  - number: '23.3'
    text: 'Het keuringsreglement voor de politiesurveillancehond bevat ten minste de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
  - number: 23.3.a
    text: gehoorzaamheid van de politiesurveillancehond aan de geleider;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
  - number: 23.3.b
    text: een goede samenwerking van de politiesurveillancehond met de geleider;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
  - number: 23.3.c
    text: |-
      de vaardigheid van de politiesurveillancehond in het kunnen nemen van alle hindernissen die voor een goed
      functioneren in de praktijk noodzakelijk zijn;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
  - number: 23.3.d
    text: |-
      het vermogen van de surveillancehond om op commando van de geleider geweld tegen derden toe te passen
      respectievelijk te beëindigen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
  - number: '23.4'
    text: De politiesurveillancehond wordt gedurende de keuring geleid door zijn geleider.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
  - number: '23.5'
    text: Indien de keuring niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      Aan een keuring van een combinatie van een geleider en een hond die bedoeld is om in te zetten bij
      aanhoudings- en ondersteuningswerkzaamheden, kunnen deelnemen ambtenaren van politie als bedoeld in
      [artikel 3, onder a en c, van de rijkswet][ref1] die sedert ten minste twee jaar deze werkzaamheden uitvoeren en
      die zijn aangewezen als geleider.


      [ref1]: https://wetten.overheid.nl/BWBR0028079#Artikel3
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028079
        artikel: '3'
  - number: '24.2'
    text: |-
      De keuring van een combinatie van geleider en de hond die bedoeld is om in te zetten bij aanhoudings- en
      ondersteuningswerkzaamheden, geschiedt door de keuringscommissie voor die hond op basis van het keuringsreglement.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: '24.3'
    text: |-
      Het keuringsreglement voor de hond die bedoeld is om in te zetten bij aanhoudings- en ondersteuningswerkzaamheden,
      bevat ten minste de volgende eisen:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: 24.3.a
    text: volgzaamheid en gehoorzaamheid aan de geleider;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: 24.3.b
    text: |-
      het kunnen participeren in procedures temidden van de ambtenaren die zijn belast met aanhoudings- en
      ondersteuningswerkzaamheden;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: 24.3.c
    text: het onder bepaalde omstandigheden, op een bepaalde afstand, niet hoorbaar zijn;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: 24.3.d
    text: |-
      de vaardigheid in het kunnen nemen van alle hindernissen die voor een goed functioneren in de praktijk noodzakelijk
      zijn;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: 24.3.e
    text: het vermogen om op commando van de geleider geweld tegen derden toe te passen en te beëindigen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: '24.4'
    text: De hond wordt gedurende de keuring geleid door zijn geleider.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: '24.5'
    text: Indien de keuring niet met goed gevolg wordt afgelegd, bestaat de mogelijkheid van maximaal twee herkansingen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel24
  - number: '25.1'
    text: |-
      De keuringscommissie verstrekt aan de geleider politiespeurhond van de combinatie die de keuring met goed
      gevolg heeft afgelegd, aan de geleider politiesurveillancehond van de combinatie die de keuring met goed
      gevolg heeft afgelegd, en aan de geleider van de hond die bedoeld is om in te zetten bij aanhoudings- en
      ondersteuningswerkzaamheden van de combinatie die de keuring met goed gevolg heeft afgelegd, een certificaat op
      naam van de combinatie van de geleider en de hond.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel25
  - number: '25.2'
    text: |-
      Het certificaat, bedoeld in het eerste lid, heeft een geldigheidsduur van twee jaar en drie maanden te rekenen
      vanaf de datum van afgifte van het certificaat.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel25
  - number: '25.3'
    text: |-
      Het certificaat, bedoeld in het eerste lid, geldt uitsluitend voor de combinatie van geleider en hond op naam
      waarvan het is afgegeven.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel25
  - number: '25.4'
    text: |-
      De geleider van een politiespeurhond menselijke geur krijgt een certificaat waarop staat aangegeven voor welke taak
      de politiespeurhond is gecertificeerd:
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel25
  - number: 25.4.a
    text: de speurtaak van de politiespeurhonden menselijke geur, of
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel25
  - number: 25.4.b
    text: de geuridentificatietaak van de politiespeurhond menselijk geur.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      Een combinatie van een geleider en een politiespeurhond, een combinatie van een geleider en een
      politiesurveillancehond en een combinatie van een geleider en een hond die bedoeld is om in te zetten bij
      aanhoudings- en ondersteuningswerkzaamheden, wordt binnen twee jaar na het behalen van het certificaat, bedoeld in
      [artikel 25][ref1], opnieuw gekeurd door de keuringscommissie voor de politiespeurhond, de keuringscommissie voor
      de politiesurveillancehond respectievelijk de keuringscommissie voor de hond die bedoeld is om in te zetten bij
      aanhoudings- en ondersteuningswerkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0028588#Artikel25
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0028588
        artikel: '25'
        hoofdstuk: '3'
  - number: '26.2'
    text: |-
      De herkeuring van een combinatie van een geleider en een politiespeurhond vindt alleen plaats als de geleider
      aantoont dat hij sinds de laatste keuring of herkeuring jaarlijks een bijscholingscursus heeft gevolgd.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel26
  - number: '26.3'
    text: |-
      Indien de herkeuring met goed gevolg wordt afgelegd, wordt het certificaat verlengd met de duur van twee jaar en
      drie maanden.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel26
  - number: '26.4'
    text: |-
      Indien de herkeuring niet met goed gevolg wordt afgelegd, kan binnen de geldigheidsduur van het certificaat een
      tweede of derde herkeuring plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel26
  - number: '26.5'
    text: |-
      Indien een eerste, tweede of derde herkeuring niet met goed gevolg wordt afgelegd, kan het certificaat voor
      het verstrijken van de geldigheidsduur worden ingetrokken, indien het naar het oordeel van de desbetreffende
      keuringscommissie noodzakelijk is de inzet in politiedienst van de desbetreffende combinatie van geleider en hond
      met onmiddellijke ingang te beëindigen.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel26
  - number: '27.1'
    text: |-
      Betrokkenen bij de keuring of herkeuring kunnen bij de keuringscommissie een gemotiveerd schriftelijk protest
      indienen tegen het keurings- of herkeuringsbesluit van de keuringscommissie. Het protest kan tot acht dagen na
      ontvangst van het keuringsrapport worden ingediend.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel27
  - number: '27.2'
    text: |-
      De keuringscommissie onderzoekt de gronden van het protest en beslist binnen drie maanden schriftelijk over het
      protest.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel27
  - number: '28.1'
    text: |-
      De onderscheidingstekens van de hoofdrangen worden bevestigd op beide harde schouderbedekkingen met afmetingen
      zes bij twaalfeneenhalve centimeter welke in de lengterichting enigszins gebogen zijn en waarvan de scherpe punt
      is afgesneden en welke zijn bekleed met een zwarte vijfenvijftig procent dacronpolyester en vijfenveertig procent
      wollen stof. Aan het afgesneden uiteinde is hierop een goudkleurige embleemknoop bevestigd.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: '28.2'
    text: 'Tot de onderscheidingstekens van de hoofdrangen behoren:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.2.a
    text: balken, vervaardigd van goudkleurig metaal;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.2.b
    text: sterren, vervaardigd van goudkleurig metaal en bol van vorm;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.2.c
    text: knopen, vervaardigd van goudkleurig metaal glad en bol van vorm;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.2.d
    text: V-vormen, vervaardigd van goudkleurig metaal, glad, met twee benen onder een hoek van negentig graden.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: '28.3'
    text: 'De onderscheidingstekens van de hoofdrangen zijn voor de:'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.a
    text: 'hoofdcommissaris: één balk en drie sterren;'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.b
    text: commissaris; één balk, twee sterren;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.c
    text: 'hoofdinspecteur: één balk, één ster;'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.d
    text: inspecteur; twee sterren;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.e
    text: hoofdagent; één knoop;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.f
    text: brigadier; drie V-vormen, in elkaar liggend;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.g
    text: agent; twee V-vormen, in elkaar liggend;
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: 28.3.h
    text: 'aspirant: één V-vorm.'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: '28.4'
    text: |-
      De onderscheidingstekens van de subrangen behorende bij een hoofdrang zijn gelijk aan die van de desbetreffende
      hoofdrang.
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel28
  - number: '29'
    text: |-
      Dit besluit treedt in werking op het tijdstip waarop de
      [Rijkswet politie van Curaçao, van Sint Maarten en van Bonaire, Sint Eustatius en Saba][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0028079
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0028079
  - number: '30'
    text: 'Dit besluit wordt aangehaald als: Besluit bewapening en overige uitrusting politie BES.'
    url: https://wetten.overheid.nl/BWBR0028588/2010-10-10#Artikel30
