        artikel: '1'
  - number: '3'
    text: |-
      1 Handelen in strijd met de in [artikel 1][ref1] gestelde voorschriften is een overtreding en wordt gestraft met
      hechtenis van ten hoogste zes maanden of een geldboete van de vierde categorie.

      2 Indien tijdens het plegen van een strafbaar feit, bedoeld in het eerste lid, nog geen jaar is verlopen sedert een
      eerdere veroordeling van de schuldige wegens het plegen van een strafbaar feit, bedoeld in dat lid, onherroepelijk
      is geworden dan wel vrijwillig is voldaan aan een voorwaarde door het openbaar ministerie krachtens artikel 76 van
      het Wetboek van Strafrecht BES gesteld, kan hechtenis of een geldboete tot het dubbele van het in het eerste lid
      voor elk gestelde maximum worden opgelegd.


