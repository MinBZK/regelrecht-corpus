        artikel: '2'
  - number: '2'
    text: |-
      1 Onder identiteitsdocument, als bedoeld in [artikel 1][ref1], wordt verstaan:

      a. een geldige identiteitskaart als bedoeld in de Wet identiteitskaarten BES; of

      b. een geldig reisdocument, als bedoeld in artikel 2, eerste lid, van de Paspoortwet (Stb. 1991, 498); of

      c. een geldig rijbewijs, als bedoeld in de wegenverkeerswetgeving van Bonaire, Sint Eustatius en Saba; of

      d. de documenten, waarover een vreemdeling ingevolge de Wet toelating en uitzetting BES moet beschikken ter
      vaststelling van zijn identiteit, nationaliteit en verblijfsrechtelijke positie; of

      e. het door de Minister van Justitie vastgestelde identiteitsdocument, dat betrekking heeft op de minderjarige, die
      ingevolge de Wet identiteitskaarten BES niet verplicht is om in het bezit te zijn van een identiteitskaart.

      2 Onze Minister van Justitie kan, al dan niet voor een bepaald tijdvak, andere dan de in het eerste lid bedoelde
      documenten aanwijzen ter vaststelling van de identiteit van personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel1
    url: https://wetten.overheid.nl/BWBR0028575/2010-10-10#Artikel2
