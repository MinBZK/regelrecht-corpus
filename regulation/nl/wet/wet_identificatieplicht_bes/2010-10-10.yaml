articles:
  - number: '1'
    text: |-
      1 Iedere persoon vanaf 12 jaar is verplicht te allen tijde een op hem betrekking hebbend identiteitsdocument, als
      bedoeld in [artikel 2][ref1], bij zich te hebben.

      2 Iedere persoon, bedoeld in het eerste lid, is verplicht bij openbare vermakelijkheden, in instellingen voor
      onderwijs, in horeca-gelegenheden en binnen een afstand van 500 meter gerekend vanaf de grens van de locatie
      waar de vermakelijkheid plaats vindt, dan wel waarop de opstal van de instelling of de gelegenheid zich bevindt,
      desgevraagd terstond een identiteitsdocument, bedoeld in het eerste lid, ter inzage te verstrekken aan de
      opsporingsambtenaren, bedoeld in de artikelen 184 en 185 van het Wetboek van Strafvordering BES, voor zover dat
      redelijkerwijs nodig is voor de uitoefening van hen in het kader van de handhaving van de openbare orde of de
      opsporing van strafbare feiten toegekende wettelijke bevoegdheden.

      3 Iedere persoon, bedoeld in het eerste lid, is verplicht desgevraagd terstond een identiteits-document, bedoeld in
      het eerste lid, ter inzage te verstrekken aan de opsporingsambtenaren, bedoeld in de artikelen 184 en 185 van het
      Wetboek van Strafvordering BES, voor zover dat redelijkerwijs nodig is voor de toepassing en handhaving van:

      a. de Wet toelating en uitzetting BES;

      b. de regelgeving met betrekking tot de leerplicht.

      4 De opsporingsambtenaar, bedoeld in het tweede en derde lid, is bevoegd van het ter inzage verstrekte document,
      bedoeld in het tweede en derde lid, afschrift te nemen of dit daartoe tijdelijk mee te nemen. Is sprake van een
      tijdelijk meenemen dan verstrekt de opsporingsambtenaar een met redenen omkleed bewijs van inname.


      [ref1]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0028575/2010-10-10#Artikel1
