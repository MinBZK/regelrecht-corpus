  - number: '7'
    text: |-
      1 Gedeputeerde staten betrekken bij de voorbereiding van het bestedingsplan, bedoeld in [artikel 6][ref1], de naar
      zijn oordeel meest belanghebbende bestuursorganen. Daartoe behoren in ieder geval de besturen van de inliggende
      gemeenten.

      2 Indien het bestedingsplan afwijkt van de uitkomsten van het bestuurlijke overleg worden de redenen hiervoor in
      het bestedingsplan vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel6
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '6'
        hoofdstuk: '4'
  - number: '8'
    text: |-
      1 Ten behoeve van de voorbereiding van het bestedingsplan, bedoeld in [artikel 6][ref1], vindt door gedeputeerde
      staten in ieder geval afstemming plaats met de besturen van de aangrenzende provincies, de besturen van de in
      de provincie gelegen regionale openbare lichamen en de besturen van de waterschappen die zijn gelegen binnen een
      provincie en buiten een plusregio voor wegen waarvan het beheer bij reglement aan het waterschap is opgedragen;

      2 Ten behoeve van de voorbereiding van het bestedingsplan, bedoeld in [artikel 6][ref2], vindt door het dagelijks
      bestuur in ieder geval afstemming plaats met het bestuur van de provincie waarin de plusregio is gelegen en
      de besturen van de in de plusregio gelegen waterschappen voor wegen waarvan het beheer bij reglement aan het
      waterschap is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel6
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel8
    references:
      - id: ref1
