        artikel: '6'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '6'
        hoofdstuk: '4'
  - number: '9'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen een gedeelte van de uitkering reserveren voor
      het doen van uitgaven in de jaren die volgen op het uitkeringsjaar.

      2 Het saldo op 1 januari van het uitkeringsjaar van de gereserveerde bedragen met inbegrip van de daarover in de
      voorafgaande jaren berekende rente, wordt jaarlijks vermeerderd met rente.

      3 De rente, bedoeld in het tweede lid, is gelijk aan de herfinancieringsrente zoals die door de Europese Centrale
      Bank is vastgesteld voor haar meest recente basisherfinancieringsrente welke geldt op de eerste kalenderdag van het
      desbetreffende uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel9
  - number: '10'
    text: |-
      1 De provincie onderscheidenlijk de plusregio legt voor 1 november na afloop van het uitkeringsjaar financiële
      verantwoording af over de besteding en de reservering ten laste van de uitkering.

      2 De verantwoording, bedoeld in het eerste lid, is voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], waaruit blijkt dat de uitkering is besteed
      aan de voorbereiding en de uitvoering van het provinciale onderscheidenlijk het regionale verkeer- en vervoerbeleid
      en, indien een gedeelte van de uitkering is gereserveerd, dit is gebeurd in overeenstemming met [artikel 9][ref2]
      en de reservering herkenbaar in de verantwoording is vastgelegd.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van
      totstandkoming en de inrichting van de financiële verantwoording en over de controle door de accountant, bedoeld in
      het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel9
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '9'
        hoofdstuk: '4'
  - number: '11'
    text: |-
      1 Onze Minister kan een uitkering ten nadele van de provincie onderscheidenlijk de plusregio wijzigen indien:

      a. uit de accountantsverklaring, bedoeld in [artikel 10][ref1], niet blijkt dat de uitkering is besteed aan de
      voorbereiding en de uitvoering van het provinciale onderscheidenlijk het regionale verkeer- en vervoerbeleid en,
      indien een gedeelte van de uitkering is gereserveerd, uit de accountantsverklaring niet blijkt dat dit is gebeurd
      in overeenstemming met [artikel 9][ref2] of de reservering niet herkenbaar in de verantwoording is vastgelegd;

      b. geen verantwoording is afgelegd die overigens voldoet aan de bij of krachtens deze wet gestelde regels.

      2 Alvorens tot wijziging over te gaan stelt Onze Minister gedeputeerde staten onderscheidenlijk het dagelijks
      bestuur in de gelegenheid te worden gehoord.

      3 De wijziging van de uitkering ten nadele van de provincie of van de plusregio vindt plaats binnen vijf jaar na
      het einde van het uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel9
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel11
    references:
