preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is verscheidene uitkeringen voor aspecten van het verkeer-
    en vervoerbeleid samen te voegen tot een gebundelde doeluitkering om de effectiviteit van het beleid te vergroten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Verkeer en Waterstaat;

      b. plusregio: een plusregio als bedoeld in [artikel 104 van de Wet gemeenschappelijke regelingen][ref1] die de
      gemeente of gemeenten Amsterdam, Arnhem en Nijmegen, Eindhoven en Helmond, Enschede en Hengelo, ’s-Gravenhage,
      Rotterdam of Utrecht omvat;

      c. inliggende gemeenten: gemeenten die zijn gelegen binnen een provincie en buiten een plusregio;

      d. dagelijks bestuur: het dagelijks bestuur van een regionaal openbaar lichaam;

      e. uitkering: een brede doeluitkering als bedoeld in [artikel 2, eerste lid][ref2] of
      [artikel 3, eerste lid][ref3];

      f. uitkeringsjaar: het kalenderjaar waarvoor de uitkering wordt verstrekt;

      g. verkeer- en vervoerbeleid: het samenstel van maatregelen gericht op aanleg, verbetering van de functionaliteit
      en op de instandhouding van de gebruiksfunctie van onroerende voorzieningen ten behoeve van het vervoer
      van personen en goederen, op exploitatie van openbaar en daarmee gelijkgesteld vervoer als bedoeld in de
      [Wet personenvervoer 2000][ref4], op verkeersveiligheid en op de overige maatregelen gericht op beïnvloeden van de
      keuze van een vervoersmodaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel104
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0017828#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel1
