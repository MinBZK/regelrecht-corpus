  - number: '2'
    text: |-
      1 Onze Minister verstrekt jaarlijks voor het uitkeringsjaar aan provincies een brede doeluitkering ten behoeve van
      de voorbereiding en de uitvoering van het provinciaal verkeer- en vervoerbeleid.

      2 Gedeputeerde staten kunnen een gedeelte van de uitkering verstrekken aan:

      a. een samenwerkingsverband van inliggende gemeenten ten behoeve van de kosten van de uitvoering van het
      intergemeentelijk verkeer- en vervoerbeleid;

      b. een inliggende gemeente ten behoeve van de kosten van de uitvoering van het gemeentelijk verkeer- en
      vervoerbeleid;

      c. een waterschap ten behoeve van de kosten van de aanleg en uitbreiding van de capaciteit van wegen, de
      verkeersveiligheid op wegen en daaraan gerelateerde voorzieningen voor wegen waarvan het beheer bij reglement aan
      het waterschap is opgedragen.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister verstrekt jaarlijks voor het uitkeringsjaar aan een plusregio een brede doeluitkering ten behoeve
      van de voorbereiding en de uitvoering van het regionaal verkeer- en vervoerbeleid.

      2 Het dagelijks bestuur kan een gedeelte van de uitkering verstrekken aan:

      a. een gemeente die deel uitmaakt van de plusregio ten behoeve van de kosten van de uitvoering van het gemeentelijk
      verkeer- en vervoerbeleid;

      b. een waterschap ten behoeve van de kosten van de aanleg en uitbreiding van de capaciteit van wegen, de
      verkeersveiligheid op wegen en daaraan gerelateerde voorzieningen voor wegen waarvan het beheer bij reglement aan
      het waterschap is opgedragen;

      c. een provincie ten behoeve van de kosten van de aanleg van provinciale wegen binnen een plusregio.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel3
  - number: '4'
    text: |-
      1 De uitkering wordt niet aangewend voor kosten van algemeen bestuurlijke aard.

      2 Bij algemene maatregel van bestuur worden regels vastgesteld over de verstrekking en de betaling van de uitkering
      aan provincies onderscheidenlijk regionale openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel4
  - number: '5'
    text: |-
      1 De verdeling over provincies en regionale openbare lichamen van het voor het totaal van de uitkeringen
      beschikbare bedrag is gebaseerd op bij algemene maatregel van bestuur vastgestelde gebiedsgerichte
      structuurkenmerken.

      2 Op basis van de structuurkenmerken wordt voor iedere provincie onderscheidenlijk voor iedere plusregio
      afzonderlijk het percentuele en het absolute aandeel berekend van het voor het totaal van de uitkeringen
      beschikbare bedrag.

      3 Bij of krachtens algemene maatregel van bestuur worden ten aanzien van de structuurkenmerken en de berekening
      nadere regels gesteld.

      4 Onze Minister kan in overeenstemming met gedeputeerde staten en het dagelijks bestuur uitgaven doen voor:

      a. het te voeren gemeenschappelijk verkeer- en vervoerbeleid;

      b. het verlenen van een subsidie aan een rechtspersoon die het te voeren gemeenschappelijk verkeer- en
      vervoerbeleid behartigt.

      5 De uitgaven, bedoeld in het vierde lid, worden in mindering gebracht op het totaal van het voor de uitkeringen
      beschikbare bedrag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel5
  - number: '6'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur stellen jaarlijks voor 15 september een
      bestedingsplan vast ten behoeve van de besteding van de uitkering voor het volgende uitkeringsjaar.

      2 Het bestedingsplan wordt onverwijld gewijzigd indien bij verstrekking van de bijdrage blijkt dat het in de
      beschikking opgenomen bedrag afwijkt van het bedrag waarop het bestedingsplan is gebaseerd.

      3 Het bestedingsplan bevat in ieder geval een overzicht van de in het uitkeringsjaar te verrichten bestedingen en
      reserveringen ten laste van de uitkering.

      4 Een provinciaal bestedingsplan bevat in ieder geval een verdeling van de uitkering over:

      a. maatregelen met betrekking tot het provinciaal verkeer- en vervoerbeleid die worden uitgevoerd door de
      provincie; en

      b. maatregelen met betrekking tot het gemeentelijk en intergemeentelijk verkeer- en vervoerbeleid die worden
      uitgevoerd door een inliggende gemeente of door een samenwerkingsverband van gemeenten, als bedoeld in
      [artikel 2, tweede lid, onder a][ref1].

      5 Indien bestuurlijke overeenkomsten zijn gesloten als bedoeld in
      [artikel 12 van de Planwet verkeer en vervoer][ref2], wordt hiermee bij het opstellen van het bestedingsplan
      rekening gehouden.

      6 Het bestedingsplan, bedoeld in het eerste lid, wordt aan Onze Minister toegezonden voor 1 februari van het
      uitkeringsjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009642#Artikel12
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel6
    references:
      - id: ref1
