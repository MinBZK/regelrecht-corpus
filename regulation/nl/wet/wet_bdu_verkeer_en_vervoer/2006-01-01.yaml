  - number: '12'
    text: |-
      Onverschuldigde betalingen gedaan in het kader van de toepassing van deze wet kunnen door Onze Minister binnen zes
      jaar worden verrekend met de betalingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel12
  - number: '13'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verstrekken desgevraagd inlichtingen omtrent de
      besteding en de reservering ten laste van de uitkering aan de door Onze Minister aangewezen ambtenaren van de
      accountantsdienst, bedoeld in [artikel 66, eerste lid, van de Comptabiliteitswet 2001][ref1].

      2 De ambtenaren van de accountantsdienst kunnen ten aanzien van de financiële verantwoording door de provincie
      onderscheidenlijk de plusregio tevens informatie inwinnen bij de in [artikel 10, tweede lid][ref2], bedoelde
      accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel10
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '10'
        hoofdstuk: '5'
  - number: '14'
    text: |-
      1 Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verstrekken aan Onze Minister desgevraagd informatie
      met het oog op:

      a. de uitoefening van zijn bevoegdheden krachtens deze wet;

      b. zijn verantwoordelijkheid voor de doeltreffendheid en doelmatigheid van het beleid dat aan zijn begroting ten
      grondslag ligt.

      2 Onze Minister kan nadere regels stellen over de aard van de informatie, bedoeld in het eerste lid, en de wijze
      van verstrekking ervan.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel14
  - number: '15'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017828/2006-01-01#Artikel15
  - number: '22'
    text: |-
      1 In afwijking van [artikel 2, eerste lid][ref1], en [artikel 3, eerste lid][ref2], kan de eerste verstrekking van
      de uitkering ook plaatsvinden in het jaar waarop de uitkering betrekking heeft.

      2 Indien toepassing wordt gegeven aan het eerste lid, wordt in afwijking van [artikel 6][ref3] door gedeputeerde
      staten onderscheidenlijk het dagelijks bestuur binnen acht weken na het tijdstip van inwerkingtreding van deze wet
      een bestedingsplan vastgesteld.

      3 Indien toepassing wordt gegeven aan het eerste lid, blijven de regels zoals die golden op de dag voor de
      inwerkingtreding van deze wet, van toepassing op de bijdrage voor de exploitatie van het openbaar vervoer,
      bedoeld in [artikel 76 van de Wet personenvervoer 2000][ref4], die is verstrekt in het jaar voorafgaand aan de
      inwerkingtreding van deze wet, met dien verstande dat:

      a. de bijdrage kan worden besteed aan of gereserveerd voor verkeer- en vervoerbeleid;

      b. op de verantwoording van de bijdrage [hoofdstuk 5][ref5] van toepassing is.

      4 In het geval toepassing wordt gegeven aan het eerste lid, wordt bij de berekening van de uitkering, bedoeld in
      [artikel 5, tweede lid][ref6], de bijdrage, bedoeld in het derde lid, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel2
