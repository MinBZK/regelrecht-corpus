---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_bdu_verkeer_en_vervoer
regulatory_layer: WET
publication_date: '2008-12-09'
valid_from: '2018-01-01'
bwb_id: BWBR0017828
url: https://wetten.overheid.nl/BWBR0017828/2018-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is verscheidene uitkeringen voor aspecten van het verkeer-
    en vervoerbeleid samen te voegen tot een gebundelde doeluitkering om de effectiviteit van het beleid te vergroten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Infrastructuur en Milieu;'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel1
  - number: 1.b
    text: |-
      openbaar lichaam: een openbaar lichaam als bedoeld in
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 1.c
    text: 'dagelijks bestuur: het dagelijks bestuur van een openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel1
  - number: 1.d
    text: |-
      uitkering: een brede doeluitkering als bedoeld in [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel3
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '3'
        hoofdstuk: '2'
  - number: 1.e
    text: 'uitkeringsjaar: het kalenderjaar waarvoor de uitkering wordt verstrekt;'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel1
  - number: 1.f
    text: |-
      verkeer- en vervoerbeleid: het samenstel van maatregelen gericht op aanleg, verbetering van de functionaliteit
      en op de instandhouding van de gebruiksfunctie van onroerende voorzieningen ten behoeve van het vervoer
      van personen en goederen, op exploitatie van openbaar en daarmee gelijkgesteld vervoer als bedoeld in de
      [Wet personenvervoer 2000][ref1], op verkeersveiligheid en op de overige maatregelen gericht op beïnvloeden van de
      keuze van een vervoersmodaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '3.1'
    text: |-
      Onze Minister verstrekt jaarlijks voor het uitkeringsjaar aan een openbaar lichaam een brede doeluitkering
      ten behoeve van de voorbereiding en de uitvoering van het regionaal verkeer- en vervoerbeleid in het krachtens
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1] aangewezen gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: '3.2'
    text: 'Het dagelijks bestuur kan een gedeelte van de uitkering verstrekken aan:'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel3
  - number: 3.2.a
    text: |-
      een gemeente die deel uitmaakt van het krachtens [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1]
      aangewezen gebied ten behoeve van de kosten van de uitvoering van het gemeentelijk verkeer- en vervoerbeleid;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: 3.2.b
    text: |-
      een waterschap ten behoeve van de kosten van de aanleg en uitbreiding van de capaciteit van wegen, de
      verkeersveiligheid op wegen en daaraan gerelateerde voorzieningen voor wegen waarvan het beheer bij reglement aan
      het waterschap is opgedragen;
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel3
  - number: 3.2.c
    text: |-
      een provincie ten behoeve van de kosten van de aanleg van provinciale wegen binnen een krachtens
      [artikel 20, derde lid, van de Wet personenvervoer 2000][ref1] aangewezen gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel20
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '20'
  - number: '4.1'
    text: De uitkering wordt niet aangewend voor kosten van algemeen bestuurlijke aard.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel4
  - number: '4.2'
    text: Bij algemene maatregel van bestuur worden regels vastgesteld over de verstrekking en de betaling van de uitkering.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel4
  - number: '5.1'
    text: |-
      De verdeling over de openbare lichamen van het voor het totaal van de uitkeringen beschikbare bedrag is gebaseerd
      op bij algemene maatregel van bestuur vastgestelde gebiedsgerichte structuurkenmerken en andere kenmerken.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: '5.2'
    text: |-
      Op basis van de structuurkenmerken wordt voor ieder openbaar lichaam afzonderlijk het percentuele aandeel berekend
      van het voor het totaal van de uitkeringen beschikbare bedrag.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: '5.3'
    text: |-
      Op basis van de andere kenmerken wordt het absolute aandeel berekend van het voor het totaal van de uitkeringen
      beschikbare bedrag.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: '5.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ten aanzien van de structuurkenmerken en de berekening van
      het percentuele en het absolute aandeel nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: '5.5'
    text: 'Onze Minister kan in overeenstemming met de dagelijkse besturen uitgaven doen voor:'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: 5.5.a
    text: het te voeren gemeenschappelijk verkeer- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: 5.5.b
    text: |-
      het verlenen van een subsidie aan een rechtspersoon die het te voeren gemeenschappelijk verkeer- en vervoerbeleid
      behartigt.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: '5.6'
    text: |-
      De uitgaven, bedoeld in het vijfde lid, worden in mindering gebracht op het totaal voor de uitkeringen beschikbare
      bedrag, bedoeld in het tweede en het derde lid.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel5
  - number: '9.1'
    text: |-
      Het dagelijks bestuur kan een gedeelte van de uitkering reserveren voor het doen van uitgaven in de jaren die
      volgen op het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel9
  - number: '10'
    text: |-
      Het openbaar lichaam legt financiële verantwoording af over de besteding en reservering ten laste van de uitkering
      op de wijze, bedoeld in [artikel 17a van de Financiële-verhoudingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
  - number: '11.1'
    text: 'Onze Minister kan een uitkering ten nadele van het openbaar lichaam wijzigen indien:'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel11
  - number: 11.1.a
    text: |-
      uit de verantwoordingsinformatie, bedoeld in [artikel 17a, eerste lid, van de Financiële-verhoudingswet][ref1],
      niet blijkt dat de uitkering is besteed aan de voorbereiding en de uitvoering van het regionale verkeer- en
      vervoerbeleid en, indien een gedeelte van de uitkering is gereserveerd, uit de verantwoordingsinformatie, bedoeld
      in artikel 17a, eerste lid, van de Financiële-verhoudingswet, niet blijkt dat dit is gebeurd in overeenstemming met
      [artikel 9][ref2] of de reservering niet herkenbaar in de verantwoording is vastgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel9
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008290
        artikel: 17a
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '9'
        hoofdstuk: '4'
  - number: 11.1.b
    text: geen verantwoording is afgelegd die overigens voldoet aan de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel11
  - number: '11.2'
    text: Alvorens tot wijziging over te gaan stelt Onze Minister het dagelijks bestuur in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel11
  - number: '11.3'
    text: |-
      De wijziging van de uitkering ten nadele van het openbaar lichaam vindt plaats binnen vijf jaar na het einde van
      het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel11
  - number: '12'
    text: |-
      Onverschuldigde betalingen gedaan in het kader van de toepassing van deze wet kunnen door Onze Minister binnen zes
      jaar worden verrekend met de betalingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel12
  - number: '13.1'
    text: |-
      Het dagelijks bestuur verstrekt desgevraagd inlichtingen omtrent de besteding en de reservering ten laste van de
      uitkering aan de accountant die in opdracht van Onze Minister met de controle hiernaar is belast.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel13
  - number: '13.2'
    text: |-
      De accountant, bedoeld in het eerste lid, kan ten aanzien van de financiële verantwoording door het openbaar
      lichaam tevens informatie inwinnen bij de accountant die belast is met de controle van het openbaar lichaam.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel13
  - number: '14.1'
    text: 'Het dagelijks bestuur verstrekt aan Onze Minister desgevraagd informatie met het oog op:'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel14
  - number: 14.1.a
    text: de uitoefening van zijn bevoegdheden krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel14
  - number: 14.1.b
    text: |-
      zijn verantwoordelijkheid voor de doeltreffendheid en doelmatigheid van het beleid dat aan zijn begroting ten
      grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister kan nadere regels stellen over de aard van de informatie, bedoeld in het eerste lid, en de wijze van
      verstrekking ervan.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel14
  - number: '15'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel15
  - number: '28'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel28
  - number: '29.1'
    text: |-
      [Artikel 19][ref1] werkt terug tot en met 1 juli 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel19
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '19'
        hoofdstuk: '6'
  - number: '29.2'
    text: |-
      [Artikel 20, onderdeel A][ref1], werkt terug tot en met de datum van inwerkingtreding van de in dat artikel
      genoemde bepalingen van de Spoorwegwet (Stb. 2003, 264).


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel20
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '20'
        hoofdstuk: '6'
  - number: '30'
    text: 'Deze wet wordt aangehaald als: Wet BDU verkeer en vervoer'
    url: https://wetten.overheid.nl/BWBR0017828/2018-01-01#Artikel30
