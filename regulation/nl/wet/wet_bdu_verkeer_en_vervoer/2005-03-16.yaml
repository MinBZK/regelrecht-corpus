---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_bdu_verkeer_en_vervoer
regulatory_layer: WET
publication_date: '2008-12-09'
valid_from: '2005-03-16'
bwb_id: BWBR0017828
url: https://wetten.overheid.nl/BWBR0017828/2005-03-16
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is verscheidene uitkeringen voor aspecten van het verkeer-
    en vervoerbeleid samen te voegen tot een gebundelde doeluitkering om de effectiviteit van het beleid te vergroten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
  - number: 1.b
    text: |-
      samenwerkingsgebied: een samenwerkingsgebied als bedoeld in
      [artikel 2 van de Wet gemeenschappelijke regelingen][ref1], waarop ingevolge
      [artikel 2 van de Kaderwet bestuur in verandering][ref2] die wet van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0003740#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006620#Artikel2
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003740
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006620
        artikel: '2'
  - number: 1.c
    text: 'inliggende gemeenten: gemeenten die zijn gelegen binnen een provincie en buiten een samenwerkingsgebied;'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
  - number: 1.d
    text: |-
      regionaal openbaar lichaam: een regionaal openbaar lichaam dat is ingesteld bij een regeling als bedoeld in
      [artikel 1, onderdeel c, van de Kaderwet bestuur in verandering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006620#Artikel1
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006620
        artikel: '1'
  - number: 1.e
    text: 'dagelijks bestuur: het dagelijks bestuur van een regionaal openbaar lichaam;'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
  - number: 1.f
    text: |-
      uitkering: een brede doeluitkering als bedoeld in [artikel 2, eerste lid][ref1] of [artikel 3, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel3
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '3'
        hoofdstuk: '2'
  - number: 1.g
    text: 'uitkeringsjaar: het kalenderjaar waarvoor de uitkering wordt verstrekt;'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
  - number: 1.h
    text: |-
      verkeer- en vervoerbeleid: het samenstel van maatregelen gericht op aanleg, verbetering van de functionaliteit
      en op de instandhouding van de gebruiksfunctie van onroerende voorzieningen ten behoeve van het vervoer
      van personen en goederen, op exploitatie van openbaar en daarmee gelijkgesteld vervoer als bedoeld in de
      [Wet personenvervoer 2000][ref1], op verkeersveiligheid en op de overige maatregelen gericht op beïnvloeden van de
      keuze van een vervoersmodaliteit.


      [ref1]: https://wetten.overheid.nl/BWBR0011470
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0011470
  - number: '2.1'
    text: |-
      Onze Minister verstrekt jaarlijks voor het uitkeringsjaar aan provincies een brede doeluitkering ten behoeve van de
      voorbereiding en de uitvoering van het provinciaal verkeer- en vervoerbeleid.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel2
  - number: '2.2'
    text: 'Gedeputeerde staten kunnen een gedeelte van de uitkering verstrekken aan:'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel2
  - number: 2.2.a
    text: |-
      een samenwerkingsverband van inliggende gemeenten ten behoeve van de kosten van de uitvoering van het
      intergemeentelijk verkeer- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel2
  - number: 2.2.b
    text: een inliggende gemeente ten behoeve van de kosten van de uitvoering van het gemeentelijk verkeer- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel2
  - number: 2.2.c
    text: |-
      een waterschap ten behoeve van de kosten van de aanleg en uitbreiding van de capaciteit van wegen, de
      verkeersveiligheid op wegen en daaraan gerelateerde voorzieningen voor wegen waarvan het beheer bij reglement aan
      het waterschap is opgedragen.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister verstrekt jaarlijks voor het uitkeringsjaar voor de geldingsduur van de krachtens de
      [Kaderwet bestuur in verandering][ref1] vastgestelde gemeenschappelijke regelingen aan een regionaal openbaar
      lichaam een brede doeluitkering ten behoeve van de voorbereiding en de uitvoering van het regionaal verkeer- en
      vervoerbeleid.


      [ref1]: https://wetten.overheid.nl/BWBR0006620
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006620
  - number: '3.2'
    text: 'Het dagelijks bestuur kan een gedeelte van de uitkering verstrekken aan:'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel3
  - number: 3.2.a
    text: |-
      een gemeente die deel uitmaakt van het samenwerkingsgebied ten behoeve van de kosten van de uitvoering van het
      gemeentelijk verkeer- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel3
  - number: 3.2.b
    text: |-
      een waterschap ten behoeve van de kosten van de aanleg en uitbreiding van de capaciteit van wegen, de
      verkeersveiligheid op wegen en daaraan gerelateerde voorzieningen voor wegen waarvan het beheer bij reglement aan
      het waterschap is opgedragen;
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel3
  - number: 3.2.c
    text: een provincie ten behoeve van de kosten van de aanleg van provinciale wegen binnen een samenwerkingsgebied.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel3
  - number: '4.1'
    text: De uitkering wordt niet aangewend voor kosten van algemeen bestuurlijke aard.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel4
  - number: '4.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels vastgesteld over de verstrekking en de betaling van de uitkering
      aan provincies onderscheidenlijk regionale openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel4
  - number: '5.1'
    text: |-
      De verdeling over provincies en regionale openbare lichamen van het voor het totaal van de uitkeringen beschikbare
      bedrag is gebaseerd op bij algemene maatregel van bestuur vastgestelde gebiedsgerichte structuurkenmerken.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel5
  - number: '5.2'
    text: |-
      Op basis van de structuurkenmerken wordt voor iedere provincie onderscheidenlijk voor ieder regionaal openbaar
      lichaam afzonderlijk het percentuele en het absolute aandeel berekend van het voor het totaal van de uitkeringen
      beschikbare bedrag.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel5
  - number: '5.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ten aanzien van de structuurkenmerken en de berekening
      nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel5
  - number: '5.4'
    text: 'Onze Minister kan in overeenstemming met gedeputeerde staten en het dagelijks bestuur uitgaven doen voor:'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel5
  - number: 5.4.a
    text: het te voeren gemeenschappelijk verkeer- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel5
  - number: 5.4.b
    text: |-
      het verlenen van een subsidie aan een rechtspersoon die het te voeren gemeenschappelijk verkeer- en vervoerbeleid
      behartigt.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel5
  - number: '5.5'
    text: |-
      De uitgaven, bedoeld in het vierde lid, worden in mindering gebracht op het totaal van het voor de uitkeringen
      beschikbare bedrag, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel5
  - number: '6.1'
    text: |-
      Gedeputeerde staten onderscheidenlijk het dagelijks bestuur stellen jaarlijks voor 15 september een bestedingsplan
      vast ten behoeve van de besteding van de uitkering voor het volgende uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
  - number: '6.2'
    text: |-
      Het bestedingsplan wordt onverwijld gewijzigd indien bij verstrekking van de bijdrage blijkt dat het in de
      beschikking opgenomen bedrag afwijkt van het bedrag waarop het bestedingsplan is gebaseerd.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
  - number: '6.3'
    text: |-
      Het bestedingsplan bevat in ieder geval een overzicht van de in het uitkeringsjaar te verrichten bestedingen en
      reserveringen ten laste van de uitkering.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
  - number: '6.4'
    text: 'Een provinciaal bestedingsplan bevat in ieder geval een verdeling van de uitkering over:'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
  - number: 6.4.a
    text: |-
      maatregelen met betrekking tot het provinciaal verkeer- en vervoerbeleid die worden uitgevoerd door de provincie;
      en
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
  - number: 6.4.b
    text: |-
      maatregelen met betrekking tot het gemeentelijk en intergemeentelijk verkeer- en vervoerbeleid die worden
      uitgevoerd door een inliggende gemeente of door een samenwerkingsverband van gemeenten, als bedoeld in
      [artikel 2, tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel2
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '2'
        hoofdstuk: '2'
  - number: '6.5'
    text: |-
      Indien bestuurlijke overeenkomsten zijn gesloten als bedoeld in
      [artikel 12 van de Planwet verkeer en vervoer][ref1], wordt hiermee bij het opstellen van het bestedingsplan
      rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0009642#Artikel12
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009642
        artikel: '12'
  - number: '6.6'
    text: |-
      Het bestedingsplan, bedoeld in het eerste lid, wordt aan Onze Minister toegezonden voor 1 februari van het
      uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel6
  - number: '7.1'
    text: |-
      Gedeputeerde staten betrekken bij de voorbereiding van het bestedingsplan, bedoeld in [artikel 6][ref1], de naar
      zijn oordeel meest belanghebbende bestuursorganen. Daartoe behoren in ieder geval de besturen van de inliggende
      gemeenten.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel6
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '6'
        hoofdstuk: '4'
  - number: '7.2'
    text: |-
      Indien het bestedingsplan afwijkt van de uitkomsten van het bestuurlijke overleg worden de redenen hiervoor in het
      bestedingsplan vermeld.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel7
  - number: '8.1'
    text: |-
      Ten behoeve van de voorbereiding van het bestedingsplan, bedoeld in [artikel 6][ref1], vindt door gedeputeerde
      staten in ieder geval afstemming plaats met de besturen van de aangrenzende provincies, de besturen van de in
      de provincie gelegen regionale openbare lichamen en de besturen van de waterschappen die zijn gelegen binnen een
      provincie en buiten een samenwerkingsgebied voor wegen waarvan het beheer bij reglement aan het waterschap is
      opgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel6
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '6'
        hoofdstuk: '4'
  - number: '8.2'
    text: |-
      Ten behoeve van de voorbereiding van het bestedingsplan, bedoeld in [artikel 6][ref1], vindt door het dagelijks
      bestuur in ieder geval afstemming plaats met het bestuur van de provincie waarin het samenwerkingsgebied is gelegen
      en de besturen van de in het samenwerkingsgebied gelegen waterschappen voor wegen waarvan het beheer bij reglement
      aan het waterschap is opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel6
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '6'
        hoofdstuk: '4'
  - number: '9.1'
    text: |-
      Gedeputeerde staten onderscheidenlijk het dagelijks bestuur kunnen een gedeelte van de uitkering reserveren voor
      het doen van uitgaven in de jaren die volgen op het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel9
  - number: '9.2'
    text: |-
      Het saldo op 1 januari van het uitkeringsjaar van de gereserveerde bedragen met inbegrip van de daarover in de
      voorafgaande jaren berekende rente, wordt jaarlijks vermeerderd met rente.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel9
  - number: '9.3'
    text: |-
      De rente, bedoeld in het tweede lid, is gelijk aan de herfinancieringsrente zoals die door de Europese Centrale
      Bank is vastgesteld voor haar meest recente basisherfinancieringsrente welke geldt op de eerste kalenderdag van het
      desbetreffende uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel9
  - number: '10.1'
    text: |-
      De provincie onderscheidenlijk het regionaal openbaar lichaam legt voor 1 november na afloop van het uitkeringsjaar
      financiële verantwoording af over de besteding en de reservering ten laste van de uitkering.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel10
  - number: '10.2'
    text: |-
      De verantwoording, bedoeld in het eerste lid, is voorzien van een verklaring van een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], waaruit blijkt dat de uitkering is besteed
      aan de voorbereiding en de uitvoering van het provinciale onderscheidenlijk het regionale verkeer- en vervoerbeleid
      en, indien een gedeelte van de uitkering is gereserveerd, dit is gebeurd in overeenstemming met [artikel 9][ref2]
      en de reservering herkenbaar in de verantwoording is vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel9
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '9'
        hoofdstuk: '4'
  - number: '10.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de wijze van
      totstandkoming en de inrichting van de financiële verantwoording en over de controle door de accountant, bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel10
  - number: '11.1'
    text: |-
      Onze Minister kan een uitkering ten nadele van de provincie onderscheidenlijk het regionaal openbaar lichaam
      wijzigen indien:
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel11
  - number: 11.1.a
    text: |-
      uit de accountantsverklaring, bedoeld in [artikel 10][ref1], niet blijkt dat de uitkering is besteed aan de
      voorbereiding en de uitvoering van het provinciale onderscheidenlijk het regionale verkeer- en vervoerbeleid en,
      indien een gedeelte van de uitkering is gereserveerd, uit de accountantsverklaring niet blijkt dat dit is gebeurd
      in overeenstemming met [artikel 9][ref2] of de reservering niet herkenbaar in de verantwoording is vastgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel9
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '10'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '9'
        hoofdstuk: '4'
  - number: 11.1.b
    text: geen verantwoording is afgelegd die overigens voldoet aan de bij of krachtens deze wet gestelde regels.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel11
  - number: '11.2'
    text: |-
      Alvorens tot wijziging over te gaan stelt Onze Minister gedeputeerde staten onderscheidenlijk het regionaal
      openbaar lichaam in de gelegenheid te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel11
  - number: '11.3'
    text: |-
      De wijziging van de uitkering ten nadele van de provincie of van het regionaal openbaar lichaam vindt plaats binnen
      vijf jaar na het einde van het uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel11
  - number: '12'
    text: |-
      Onverschuldigde betalingen gedaan in het kader van de toepassing van deze wet kunnen door Onze Minister binnen zes
      jaar worden verrekend met de betalingen op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel12
  - number: '13.1'
    text: |-
      Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verstrekken desgevraagd inlichtingen omtrent de
      besteding en de reservering ten laste van de uitkering aan de door Onze Minister aangewezen ambtenaren van de
      accountantsdienst, bedoeld in [artikel 66, eerste lid, van de Comptabiliteitswet 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013891#Artikel66
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0013891
        artikel: '66'
  - number: '13.2'
    text: |-
      De ambtenaren van de accountantsdienst kunnen ten aanzien van de financiële verantwoording door
      de provincie onderscheidenlijk het regionaal openbaar lichaam tevens informatie inwinnen bij de in
      [artikel 10, tweede lid][ref1], bedoelde accountant.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel10
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '10'
        hoofdstuk: '5'
  - number: '14.1'
    text: |-
      Gedeputeerde staten onderscheidenlijk het dagelijks bestuur verstrekken aan Onze Minister desgevraagd informatie
      met het oog op:
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel14
  - number: 14.1.a
    text: de uitoefening van zijn bevoegdheden krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel14
  - number: 14.1.b
    text: |-
      zijn verantwoordelijkheid voor de doeltreffendheid en doelmatigheid van het beleid dat aan zijn begroting ten
      grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel14
  - number: '14.2'
    text: |-
      Onze Minister kan nadere regels stellen over de aard van de informatie, bedoeld in het eerste lid, en de wijze van
      verstrekking ervan.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel14
  - number: '15'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel15
  - number: '22.1'
    text: |-
      In afwijking van [artikel 2, eerste lid][ref1], en [artikel 3, eerste lid][ref2], kan de eerste verstrekking van de
      uitkering ook plaatsvinden in het jaar waarop de uitkering betrekking heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel3
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '3'
        hoofdstuk: '2'
  - number: '22.2'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, wordt in afwijking van [artikel 6][ref1] door gedeputeerde
      staten onderscheidenlijk het dagelijks bestuur binnen acht weken na het tijdstip van inwerkingtreding van deze wet
      een bestedingsplan vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel6
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '6'
        hoofdstuk: '4'
  - number: '22.3'
    text: |-
      Indien toepassing wordt gegeven aan het eerste lid, blijven de regels zoals die golden op de dag voor de
      inwerkingtreding van deze wet, van toepassing op de bijdrage voor de exploitatie van het openbaar vervoer,
      bedoeld in [artikel 76 van de Wet personenvervoer 2000][ref1], die is verstrekt in het jaar voorafgaand aan de
      inwerkingtreding van deze wet, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 22.3.a
    text: de bijdrage kan worden besteed aan of gereserveerd voor verkeer- en vervoerbeleid;
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel22
  - number: 22.3.b
    text: |-
      op de verantwoording van de bijdrage [hoofdstuk 5][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017828
        hoofdstuk: '5'
  - number: '22.4'
    text: |-
      In het geval toepassing wordt gegeven aan het eerste lid, wordt bij de berekening van de uitkering, bedoeld in
      [artikel 5, tweede lid][ref1], de bijdrage, bedoeld in het derde lid, in mindering gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel5
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '5'
        hoofdstuk: '3'
  - number: '23'
    text: |-
      De regels zoals die golden op de dag voor de inwerkingtreding van deze wet, blijven van toepassing op de
      rijksbijdrage voor de exploitatie van openbaar vervoer die betrekking heeft op de jaren die vooraf gaan aan het
      eerste uitkeringsjaar.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel23
  - number: '24.1'
    text: |-
      In afwijking van [artikel 5, eerste lid][ref1], kan de verdeling over provincies en regionale openbare lichamen
      van het voor het totaal van de uitkeringen beschikbare bedrag ook worden gebaseerd op andere dan gebiedsgerichte
      structuurkenmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel5
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '5'
        hoofdstuk: '3'
  - number: '24.2'
    text: |-
      Dit artikel vervalt met ingang van 1 januari van het vijfde kalenderjaar na het kalenderjaar waarin het tijdstip
      van de inwerkingtreding van deze wet is gelegen.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel24
  - number: '25'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de reserveringstermijn, de bestedingsdoelen en de
      berekende rente van de voor de inwerkingtreding van deze wet door provincies onderscheidenlijke regionale openbare
      lichamen gereserveerde bedragen voor verkeer- en vervoerbeleid ingevolge de in de algemene maatregel van bestuur
      genoemde besluiten en regelingen.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel25
  - number: '26'
    text: |-
      De voordracht voor een krachtens [artikel 4][ref1], [5][ref2], [10][ref3] of [25][ref4] vast te stellen maatregel
      van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017828#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0017828#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0017828#Artikel25
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '4'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0017828
        artikel: '5'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0017828
        artikel: '10'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0017828
        artikel: '25'
        hoofdstuk: '7'
  - number: '28'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel28
  - number: '29.1'
    text: |-
      [Artikel 19][ref1] werkt terug tot en met 1 juli 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel19
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '19'
        hoofdstuk: '6'
  - number: '29.2'
    text: |-
      [Artikel 20, onderdeel A][ref1], werkt terug tot en met de datum van inwerkingtreding van de in dat artikel
      genoemde bepalingen van de Spoorwegwet (Stb. 2003, 264).


      [ref1]: https://wetten.overheid.nl/BWBR0017828#Artikel20
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0017828
        artikel: '20'
        hoofdstuk: '6'
  - number: '30'
    text: 'Deze wet wordt aangehaald als: Wet BDU verkeer en vervoer'
    url: https://wetten.overheid.nl/BWBR0017828/2005-03-16#Artikel30
