preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het stelsel van studiefinanciering te hervormen om
    te komen tot een doelmatiger en rechtvaardiger studiefinancieringsstelsel waardoor tevens een toekomstgerichte
    onderwijsagenda voor het hoger onderwijs kan worden uitgevoerd;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036261/2017-01-01#ArtikelAanhef
