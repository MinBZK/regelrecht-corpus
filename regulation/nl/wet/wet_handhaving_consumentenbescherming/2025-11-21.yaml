  - number: '2.23'
    text: |-
      1 De Autoriteit Consument en Markt kan in het kader van haar taken, genoemd in deze wet, een openbare waarschuwing
      uitvaardigen voordat zij een inbreuk of inbreuk binnen de Unie heeft vastgesteld, indien dat redelijkerwijs
      noodzakelijk is om consumenten snel en effectief te informeren over een schadeveroorzakende handelspraktijk van een
      ondernemer en daardoor schade te voorkomen.

      2 Een ondernemer wordt uitsluitend met name genoemd in de openbare waarschuwing indien er sprake is van een
      reëel en acuut risico op benadeling van consumenten en van een redelijk vermoeden van overtreding. In de openbare
      waarschuwing komt duidelijk naar voren dat er nog geen sprake is van een door de Autoriteit Consument en Markt
      vastgestelde inbreuk of inbreuk binnen de Unie.

      3 De uitvaardiging van een openbare waarschuwing waarin een ondernemer met name wordt genoemd geschiedt niet
      eerder dan nadat vijf werkdagen zijn verstreken na de dag waarop het besluit tot het uitvaardigen van de openbare
      waarschuwing aan hem is bekend gemaakt, tenzij hij het besluit zelf heeft openbaar gemaakt, heeft doen openbaar
      maken of heeft aangegeven geen bedenkingen te hebben tegen eerdere openbaarmaking.

      4 Indien wordt verzocht om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1], wordt de werking van het besluit opgeschort totdat de
      voorzieningenrechter uitspraak heeft gedaan of het verzoek is ingetrokken.

      5 Het besluit van de Autoriteit Consument en Markt tot het uitvaardigen van een openbare waarschuwing als bedoeld
      in het derde lid vermeldt behalve de naam van de ondernemer in ieder geval de schadeveroorzakende handelspraktijk,
      de inhoud van de openbaarmaking, de gronden waarop het besluit berust alsmede de wijze waarop en de termijn waarna
      de openbare waarschuwing zal worden uitgevaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel881
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel2.23
