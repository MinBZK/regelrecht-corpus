  - number: 8.2a
    text: |-
      1 Een handelaar als bedoeld in [artikel 230g, eerste lid, onderdeel b, van Boek 6 van het Burgerlijk Wetboek][ref1],
      die een overeenkomst aangaat waarop [Afdeling 2B van Titel 5 van Boek 6 van het Burgerlijk Wetboek][ref2] van
      toepassing is, neemt de bepalingen van die afdeling in acht.

      2 Indien een overeenkomst waarop [Afdeling 2B van Titel 5 van Boek 6 van het Burgerlijk Wetboek][ref3] van
      toepassing is, tot stand komt via een andere persoon, handelend in het kader van zijn handels-, bedrijfs-,
      ambachts- of beroepsactiviteit, die daarbij optreedt namens of voor rekening van een handelaar, neemt ook die
      andere persoon de bepalingen van die afdeling in acht.

      3 Het eerste en tweede lid zijn van overeenkomstige toepassing voordat de consument is gebonden aan een
      overeenkomst, dan wel aan een daartoe strekkend aanbod.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel230g
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Afdeling2b
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Afdeling2b
