  - number: '2.3'
    text: |-
      1 De Autoriteit Consument en Markt wordt aangewezen als het verbindingsbureau in Nederland.

      2 Met betrekking tot inbreuken binnen de Unie op een van de wettelijke bepalingen, bedoeld in onderdeel a van de
      bijlage bij deze wet, wordt de Autoriteit Consument en Markt aangewezen als bevoegde autoriteit, tenzij de inbreuk
      binnen de Unie betrekking heeft op een financiële dienst of activiteit.

      3 De Autoriteit Consument en Markt heeft mede tot taak de coördinatie van activiteiten van communautair belang,
      administratieve samenwerking en verslaglegging, bedoeld in de artikelen 30, 31 en 37 van [verordening 2017/2394]
      (32394R2017).

      4 De Autoriteit Consument en Markt wordt aangewezen als het centrale contactpunt, bedoeld in artikel 18,
      tweede lid, van Richtlijn (EU) 2015/2302 van het Europees Parlement en de Raad van 25 november 2015 betreffende
      pakketreizen en gekoppelde reisarrangementen, houdende wijziging van Verordening (EG) nr. 2006/2004 en van
      [Richtlijn 2011/83](32011L0083)/EU van het Europees Parlement en de Raad, en tot intrekking van [Richtlijn 90/314/
      EEG](31990L0314) van de Raad (PbEU 2015, L 326).
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel2.3
  - number: '2.4'
    text: |-
      1 De Autoriteit Consument en Markt legt voorgenomen beleidsregels ten minste vier weken voor vaststelling daarvan
      aan Onze Minister voor.

      2 Indien de voorgenomen beleidsregels naar het oordeel van Onze Minister in strijd zijn met het belang van een
      goede taakuitoefening door de Autoriteit Consument en Markt, deelt Onze Minister dit gemotiveerd mee aan de
      Autoriteit Consument en Markt binnen twee weken nadat de regels aan hem zijn voorgelegd.

      3 Indien Onze Minister een mededeling als bedoeld in het tweede lid heeft gedaan, stelt de Autoriteit Consument en
      Markt de beleidsregels niet vast.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel2.4
  - number: '2.6'
    text: |-
      1 Een overeenkomst strekkende tot vergoeding van schade die het gevolg is van een inbreuk of inbreuk binnen de
      Unie op één of meer wettelijke bepalingen met de handhaving waarvan de Autoriteit Consument en Markt krachtens
      [artikel 2.2][ref1] is belast, gesloten door de Autoriteit Consument en Markt met één of meer andere partijen
      die deze bepalingen hebben overtreden en die zich bij deze overeenkomst hebben verbonden tot vergoeding van deze
      schade, kan door de rechter op verzoek van de partijen die de overeenkomst hebben gesloten verbindend worden
      verklaard voor personen aan wie de schade is veroorzaakt. Onder personen aan wie de schade is veroorzaakt worden
      mede begrepen personen die een vordering ter zake van deze schade onder algemene of bijzondere titel hebben
      verkregen.

      2 De [artikelen 907, tweede tot en met zesde lid][ref2], en
      [908 tot en met 910 van Boek 7 van het Burgerlijk Wetboek][ref3] en
      [titel 14 van het derde boek van het Wetboek van Burgerlijke Rechtsvordering][ref4] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2.2
