preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van verordening (EG) nr. 2006/2004 van het
    Europees Parlement en de Raad van de Europese Unie van 27 oktober 2004 betreffende samenwerking tussen de nationale
    instanties die verantwoordelijk zijn voor handhaving van de wetgeving inzake consumentenbescherming (PbEU L 364),
    noodzakelijk is regels te stellen inzake privaatrechtelijke en publiekrechtelijke handhaving van de wetgeving
    inzake consumentenbescherming;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - aanbieder van een hostingdienst: een aanbieder van een dienst die eruit bestaat door een aanbieder van inhoud
      verstrekte informatie op verzoek van die aanbieder van inhoud op te slaan en de opgeslagen informatie aan derden
      beschikbaar te stellen;
        - aangewezen instantie: een aangewezen instantie als bedoeld in artikel 3, onderdeel 8, van [verordening 2017/2394]
      (32394R2017);
        - andere overheidsinstantie: een andere overheidsinstantie als bedoeld in artikel 6, eerste lid, van [verordening
      2017/2394](32394R2017);
        - Autoriteit Consument en Markt: de Autoriteit Consument en Markt, genoemd in
      [artikel 2, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1];
        - bevoegde autoriteit: een bevoegde autoriteit als bedoeld in artikel 3, onderdeel 6, van [verordening 2017/2394]
      (32394R2017);
        - bindende gedragslijn: een zelfstandige last die niet wegens een overtreding wordt opgelegd;
        - consumentenorganisaties: stichtingen of verenigingen met volledige rechtsbevoegdheid die krachtens hun statuten
      tot taak hebben het behartigen van de collectieve belangen van consumenten;
        - e-handelsdienst: e-handelsdienst als bedoeld in
      [artikel 230fa, onderdeel e, van Boek 6 van het Burgerlijk Wetboek][ref2];
        - financiële dienst of activiteit: 1°. een financiële dienst als bedoeld in
      [artikel 1:1 van de Wet op het financieel toezicht][ref3] en het aanbieden van effecten aan het publiek of
      het doen toelaten van effecten tot de handel op een in Nederland gelegen of functionerende gereglementeerde
      markt, bedoeld in artikel 3, eerste en derde lid, van Verordening (EU) nr. 2017/1129 van het Europees Parlement
      en de Raad van 14 juni 2017 betreffende het prospectus dat moet worden gepubliceerd wanneer effecten aan het
      publiek worden aangeboden of tot de handel op een gereglementeerde markt worden toegelaten en tot intrekking
      van [Richtlijn 2003/71/EG](32003L0071) (PbEU 2017, L 168), waarbij voor de toepassing van deze wet onder deze
      financiële diensten en activiteiten mede worden begrepen de overeenkomsten met betrekking tot een of meer
      financiële producten als bedoeld in [artikel 1.1 van de Wet op het financieel toezicht][ref4] die rechtstreeks
      uit deze financiële diensten of activiteiten voortvloeien of daarvan het resultaat zijn; 2°. het in de uitoefening
      van een bedrijf aantrekken, ter beschikking verkrijgen of ter beschikking hebben van opvorderbare gelden van het
      publiek als bedoeld in [artikel 3:5, eerste lid, van de Wet op het financieel toezicht][ref5], dan wel het als
      tussenpersoon werkzaamheden verrichten in de zin van [artikel 4:3, eerste lid, van laatstgenoemde wet][ref6];
      3°. een wisseltransactie als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref7];
      4°. het exploiteren of beheren van een gereglementeerde markt waarvoor een vergunning als bedoeld in
      [artikel 5:26, eerste lid, van de Wet op het financieel toezicht][ref8] is verleend of het exploiteren van
      een georganiseerde handelsfaciliteit of multilaterale handelsfaciliteit waarvoor een vergunning als bedoeld in
      [artikel 2:96 van de Wet op het financieel toezicht][ref9] is verleend; 5°. een betalingsdienst als bedoeld in
      bijlage I van richtlijn nr. 2015/2366 van het Europees Parlement en de Raad van 25 november 2015 betreffende
      betalingsdiensten in de interne markt, houdende wijziging van de [Richtlijnen 2002/65/EG](32002L0065), [2009/110/
      EG](32009L0110) en [2013/36](32013L0036)/EU en Verordening (EU) nr. [1093/2010](32993L2010) en houdende intrekking
      van [Richtlijn 2007/64/EG](32007L0064); 6°. een beleggingsaanbeveling als bedoeld in artikel 3, eerste lid,
      onderdeel 35 van Verordening (EU) nr. 596/2014 van het Europees Parlement en de Raad van de Europese Unie van
      16 april 2014 betreffende marktmisbruik (PbEU 2014, L 173);
        - inbreuk: elke overtreding van een wettelijke bepaling als bedoeld in de bijlage bij deze wet, welke schade
      toebrengt of kan toebrengen aan de collectieve belangen van consumenten;
        - inbreuk binnen de Unie: een inbreuk als bedoeld in artikel 3, onderdeel 5, van [verordening 2017/2394]
      (32394R2017);
        - lidstaat: een lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
        - online interface: online interface als bedoeld in artikel 3, onderdeel 15, van [verordening 2017/2394]
      (32394R2017);
        - onlinemarktplaats: een onlineplatform dat ondernemers in staat stelt hun producten en diensten aan consumenten
      aan te bieden;

        - Onze Minister: Onze Minister van Economische Zaken en Klimaat;
        - richtlijn (EU) 2019/882: [richtlijn (EU) 2019/882](32019L0882) van het Europees Parlement en de Raad van 17 april
      2019 betreffende de toegankelijkheidsvoorschriften voor producten en diensten (PbEU 2019, L 151);
        - schade aan de collectieve belangen van consumenten: daadwerkelijke of mogelijke schade aan de belangen van een
      aantal consumenten als bedoeld in artikel 3, twaalfde lid, van [verordening 2017/2394](32394R2017) die nadeel
      ondervinden van inbreuken of inbreuken binnen de Unie;
        - verbindingsbureau: verbindingsbureau als bedoeld in artikel 3, onderdeel 7, van [verordening 2017/2394]
      (32394R2017);
        - Verordening (EU) nr. 524/2013: verordening (EU) nr. 524/2013 van het Europees parlement en de Raad van 21 mei
      2013 betreffende onlinebeslechting van consumentengeschillen en tot wijziging van Verordening (EG) nr. 2006/2004 en
      Richtlijn 2009/22/EG (PbEU 2013, L 165);
        - verordening 2017/2394: verordening (EU) 2017/2394 van het Europees Parlement en de Raad van 12 december 2017
      betreffende samenwerking tussen de nationale autoriteiten die verantwoordelijk zijn voor handhaving van de
      wetgeving inzake consumentenbescherming en tot intrekking van Verordening (EG) nr. 2006/2004 (PbEU L 345);
        - Verordening (EU) 2018/302: Verordening (EU) 2018/302 van het Europees Parlement en de Raad van 28 februari 2018
      inzake de aanpak van ongerechtvaardigde geoblocking en andere vormen van discriminatie van klanten op grond van
      nationaliteit, verblijfplaats, of plaats van vestiging in de interne markt, en tot wijziging van Verordeningen (EG)
      nr. 2006/2004 en (EU) 2017/2394 en [Richtlijn 2009/22/EG](32009L0022) (PbEU 2018, L 60);
        - wettelijke bepalingen: de communautaire wetgeving ter bescherming van de belangen van de consument bedoeld in de
      bijlage bij deze wet, zoals geïmplementeerd in het Nederlands recht en het recht van de lidstaten;
        - zelfstandige last: de enkele last tot het verrichten van bepaalde handelingen, bedoeld in
      [artikel 5:2, tweede lid, van de Algemene wet bestuursrecht][ref10], ter bevordering van de naleving van wettelijke
      voorschriften.


