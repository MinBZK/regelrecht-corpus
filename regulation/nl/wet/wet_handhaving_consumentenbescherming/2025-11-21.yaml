  - number: 3.3 0a
    text: |-
      1 De Stichting Autoriteit Financiële Markten verstrekt, indien zij deelneemt aan een samenwerkingsverband als
      bedoeld in de [Wet gegevensverwerking door samenwerkingsverbanden][ref1], aan het samenwerkingsverband gegevens
      behorend tot de in [hoofdstuk 2 van de Wet gegevensverwerking door samenwerkingsverbanden][ref2] of bij algemene
      maatregel van bestuur op grond van die wet aangewezen categorieën, voor zover dat noodzakelijk is voor het doel
      van dat samenwerkingsverband, tenzij naar het oordeel van de Stichting Autoriteit Financiële Markten zwaarwegende
      redenen zich daartegen verzetten.

      2 Indien voor de verstrekking aan bepaalde partijen bijzondere regels gelden, geschiedt de in het eerste lid
      bedoelde verstrekking steeds met inachtneming van die regels.

      3 Bij algemene maatregel van bestuur kunnen voorwaarden en beperkingen worden gesteld aan de verstrekkingen op
      grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0049962
      [ref2]: https://wetten.overheid.nl/BWBR0049962#Hoofdstuk2
