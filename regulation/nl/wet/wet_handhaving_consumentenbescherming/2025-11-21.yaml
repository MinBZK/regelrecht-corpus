    text: |-
      1 De bestuurlijke boete, bedoeld in [artikel 2.9][ref1], bedraagt ten hoogste € 900.000 of, indien dat meer is, 1%
      van de omzet van de overtreder.

      2 In afwijking van het eerste lid bedraagt de bestuurlijke boete, bedoeld in [artikel 2.9][ref2], in geval
      van overtreding van [artikel 8.8][ref3], voor zover het een oneerlijke handelspraktijk betreft als bedoeld in
      [artikel 193g][ref4] of [artikel 193i van Boek 6 van het Burgerlijk Wetboek][ref5], ten hoogste € 900.000 of,
      indien dat meer is, 10% van de omzet van de overtreder.

      3 In afwijking van het eerste lid, bedraagt de bestuurlijke boete, bedoeld in artikel 2.9, onderdeel b, in geval
      van een overtreding van de [artikelen 8.2a][ref6], [8.3][ref7], [8.4a][ref8], [8.5][ref9], [8.8][ref10], of
      [8.11][ref11], die wordt opgelegd in het kader van een gecoördineerde actie als bedoeld in [Verordening 2017/2394]
      (32394R2017):

      a. ten hoogste 4% of, in geval van een overtreding van artikel 8.8, voor zover het een oneerlijke handelspraktijk
      betreft als bedoeld in [artikel 193g][ref12] of [artikel 193i van Boek 6 van het Burgerlijk Wetboek][ref13], ten
      hoogste 10% van de jaaromzet van de overtreder in de betrokken lidstaat of lidstaten; of

      b. indien er geen informatie beschikbaar is over de jaaromzet van de overtreder: ten hoogste € 2.000.000.

      4 De bestuurlijke boete die ingevolge het eerste, tweede of derde lid ten hoogste kan worden opgelegd wordt
      verhoogd met 100%, indien binnen een tijdvak van vijf jaar voorafgaand aan de dagtekening van het van de
      overtreding opgemaakte rapport, bedoeld in [artikel 5:48, eerste lid, van de Algemene wet bestuursrecht][ref14],
      een aan die overtreder voor een eerdere overtreding van eenzelfde of een soortgelijk wettelijk voorschrift
      opgelegde bestuurlijke boete onherroepelijk is geworden.


