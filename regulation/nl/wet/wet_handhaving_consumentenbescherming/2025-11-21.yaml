  - number: '3.11'
    text: |-
      De Nederlandse Voedsel- en Warenautoriteit wordt aangewezen als bevoegde autoriteit voor inbreuken binnen de Unie
      op de wettelijke bepalingen, bedoeld in onderdeel f van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel3.11
  - number: '3.12'
    text: |-
      1 De krachtens [artikel 13, eerste lid, van de Tabaks- en rookwarenwet][ref1] benoemde ambtenaren zijn belast met
      het toezicht op de naleving van de wettelijke bepalingen inzake inbreuken binnen de Unie voor welke de Nederlandse
      Voedsel- en Warenautoriteit als bevoegde autoriteit is aangewezen.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan, indien naar zijn oordeel een inbreuk binnen de Unie op
      een van de wettelijke bepalingen, bedoeld in onderdeel f van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.24][ref2], [3.2, tweede lid][ref3], [3.4, zesde en zevende lid][ref4], en [3.4a][ref5] zijn van
      overeenkomstige toepassing.

      4 [Artikel 11b, tweede lid, van de Tabaks- en rookwarenwet][ref6] is van overeenkomstige toepassing.

      5 De [artikelen 2.2a][ref7] en [2.7][ref8] zijn van overeenkomstige toepassing ten aanzien van inbreuken
      of inbreuken binnen de Unie op bepalingen waarvoor de Nederlandse Voedsel- en Warenautoriteit krachtens
      [artikel 3.7][ref9] is aangewezen als bevoegde autoriteit, met dien verstande dat voor «de Autoriteit Consument en
      Markt» wordt gelezen «de Minister van Volksgezondheid, Welzijn en Sport».


