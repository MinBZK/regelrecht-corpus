  - number: '3.5'
    text: |-
      De Inspectie gezondheidszorg en jeugd wordt aangewezen als bevoegde autoriteit voor inbreuken binnen de Unie op de
      wettelijke bepalingen, bedoeld in onderdeel c van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel3.5
  - number: '3.6'
    text: |-
      1 De krachtens [artikel 100 van de Geneesmiddelenwet][ref1] aangewezen ambtenaren van de Inspectie gezondheidszorg
      en jeugd zijn belast met toezicht op de naleving van de wettelijke bepalingen inzake inbreuken binnen de Unie voor
      welke het als bevoegde autoriteit is aangewezen.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan, indien naar zijn oordeel een inbreuk binnen de Unie op
      een van de wettelijke bepalingen, bedoeld in onderdeel c van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.24][ref2], [3.2, tweede lid][ref3], [3.4, zesde en zevende lid][ref4], en [3.4a][ref5] zijn van
      overeenkomstige toepassing.

      4 Wat betreft de hoogte van de bestuurlijke boete is het [eerste lid van artikel 101 van de Geneesmiddelenwet][ref6]
      van overeenkomstige toepassing.

      5 De [artikelen 2.2a][ref7] en [2.7][ref8] zijn van overeenkomstige toepassing ten aanzien van inbreuken of
      inbreuken binnen de Unie op bepalingen waarvoor de Inspectie gezondheidszorg en jeugd krachtens [artikel 3.5][ref9]
      is aangewezen als bevoegde autoriteit, met dien verstande dat voor «de Autoriteit Consument en Markt» wordt gelezen
      «de Inspectie gezondheidszorg en jeugd».


