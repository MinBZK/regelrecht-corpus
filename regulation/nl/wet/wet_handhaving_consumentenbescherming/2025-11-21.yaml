  - number: '3.4'
    text: |-
      1 De Stichting Autoriteit Financiële Markten kan in het kader van haar taken, genoemd in deze wet,
      een openbare waarschuwing uitvaardigen voordat zij een inbreuk of inbreuk binnen de Unie heeft
      vastgesteld, indien dat redelijkerwijs noodzakelijk is om consumenten snel en effectief te informeren
      over een schadeveroorzakende handelspraktijk van een ondernemer en daardoor schade te voorkomen.
      [Artikel 2.23, tweede tot en met vijfde lid][ref1], is van overeenkomstige toepassing.

      2 De Stichting Autoriteit Financiële Markten kan, indien zij van oordeel is dat een inbreuk of inbreuk binnen
      de Unie op een van de wettelijke bepalingen, bedoeld in de onderdelen a en b van de bijlage bij deze wet, heeft
      plaatsgevonden:

      a. een zelfstandige last opleggen;

      b. een bestuurlijke boete opleggen;

      c. een last onder dwangsom opleggen.

      3 [Artikel 4.3][ref2] is van overeenkomstige toepassing indien begrippen worden uitgelegd, die worden gehanteerd in
      een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze wet.

      4 Met betrekking tot de toepassing van het tweede lid is [artikel 2.24][ref3] van overeenkomstige toepassing.

      5 Met betrekking tot de toepassing van het tweede lid, onderdeel b, is [artikel 2.15][ref4] van
      toepassing dan wel, indien het betreft een overtreding van onderdeel b van de bijlage bij deze wet,
      [artikel 1:81 van de Wet op het financieel toezicht][ref5].

      6 Met betrekking tot de toepassing van het tweede lid, onderdeel c, zijn de
      [artikelen 5:48 tot en met 5:51 van de Algemene wet bestuursrecht][ref6] van overeenkomstige toepassing en is
      [artikel 51 van het Wetboek van Strafrecht][ref7] van overeenkomstige toepassing.

      7 Aan een last onder dwangsom kunnen voorschriften worden verbonden die redelijkerwijs noodzakelijk zijn om
      effectieve controle op de uitvoering van de last te verzekeren.

      8

      9 Met betrekking tot de toepassing van het tweede lid, onderdeel b, is [artikel 2.10][ref8] van overeenkomstige
      toepassing.


