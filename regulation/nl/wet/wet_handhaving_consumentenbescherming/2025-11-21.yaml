  - number: 8a.2
    text: |-
      1 Met het toezicht op de naleving van de wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze
      wet, zijn belast de leden van het Commissariaat voor de Media en de bij besluit van het Commissariaat aangewezen
      medewerkers van het Commissariaat, bedoeld in [artikel 7.11, tweede lid, van de Mediawet 2008][ref1].

      2 Het Commissariaat voor de Media kan, indien naar zijn oordeel een overtreding van een van de wettelijke
      bepalingen als bedoeld in onderdeel g van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De in het tweede lid bedoelde bestuurlijke boete bedraagt ten hoogste het bedrag van de vijfde categorie
      geldboete, bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7.11
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
