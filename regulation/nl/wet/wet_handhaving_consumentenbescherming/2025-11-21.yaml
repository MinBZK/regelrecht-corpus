  - number: '2.7'
    text: |-
      1 Als er geen andere doeltreffende middelen zijn om een inbreuk of een inbreuk binnen de Unie, op wettelijke
      bepalingen met de handhaving waarvan zij krachtens [artikel 2.2][ref1] is belast te voorkomen of te beëindigen, kan
      de Autoriteit Consument en Markt, om het gevaar van ernstige schade aan de collectieve belangen van consumenten te
      voorkomen of te beëindigen, een zelfstandige last opleggen aan:

      a. degene die daartoe in staat is, om inhoud te verwijderen van of de toegang te beperken tot een online interface,
      of opdracht te geven tot de duidelijke weergave van een waarschuwing aan consumenten wanneer die zich toegang tot
      de online interface verschaffen;

      b. een aanbieder van een hostingdienst, om alle maatregelen te treffen die redelijkerwijs van hem kunnen worden
      gevergd om de toegang tot een online interface te deactiveren, te blokkeren, of te beperken, of

      c. in voorkomend geval, een beheerder van een domeinregister of een registrerende instantie, om een volledig
      gekwalificeerde domeinnaam te schrappen, of de Autoriteit Consument en Markt toe te laten om een volledig
      gekwalificeerde domeinnaam op haar naam te registreren.

      2 Degene tot wie de zelfstandige last als bedoeld in het eerste lid is gericht, handelt overeenkomstig die last.

      3 Op grond van het eerste lid kan geen zelfstandige last worden opgelegd die leidt tot het blokkeren of filteren
      van internetverkeer.

      4 Voor een zelfstandige last als bedoeld in het eerste lid, is voorafgaande machtiging vereist van de rechter-
      commissaris, belast met de behandeling van strafzaken bij de rechtbank Rotterdam. In het verzoek om afgifte van de
      machtiging worden de proportionaliteit en subsidiariteit van het verzoek gemotiveerd. De rechter-commissaris kan
      het openbaar ministerie horen alvorens te beslissen. [Artikel 171 van het Wetboek van Strafvordering][ref2] is van
      overeenkomstige toepassing.

      5 Tegen de beslissing van de rechter-commissaris, bedoeld in het vierde lid, staat voor zover het verzoek om een
      machtiging niet is toegewezen, voor de Autoriteit Consument en Markt binnen veertien dagen beroep open bij de
      rechtbank Rotterdam, sector strafrecht.

      6 De Autoriteit Consument en Markt maakt de machtiging van de rechter-commissaris gelijktijdig met de zelfstandige
      last, bedoeld in het eerste lid, bekend.

      7 De Autoriteit Consument en Markt kan een last onder dwangsom opleggen aan degene die handelt in strijd met het
      tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2.2
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel171
