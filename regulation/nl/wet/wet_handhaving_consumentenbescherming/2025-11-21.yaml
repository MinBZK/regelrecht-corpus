  - number: 8a.3
    text: |-
      1 Met het toezicht op de naleving van de wettelijke bepalingen, bedoeld in onderdeel h van de bijlage bij deze
      wet, zijn belast de bij besluit van Onze Minister van Infrastructuur en Waterstaat aangewezen ambtenaren. Van dat
      besluit wordt mededeling gedaan door plaatsing in de Staatscourant.

      2 Onze Minister van Infrastructuur en Waterstaat kan, indien naar zijn oordeel een overtreding van een van de
      wettelijke bepalingen als bedoeld in onderdeel h van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De in het tweede lid bedoelde bestuurlijke boete bedraagt ten hoogste het bedrag van de vijfde categorie
      geldboete, bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref1].


