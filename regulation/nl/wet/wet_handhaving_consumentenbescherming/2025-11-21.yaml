        artikel: 5:2
  - number: '2.2'
    text: |-
      De Autoriteit Consument en Markt is belast met het toezicht op de naleving van de wettelijke bepalingen, bedoeld in
      onderdeel a van de bijlage bij deze wet. Zij is niet bevoegd indien de inbreuk of inbreuk binnen de Unie betrekking
      heeft op een financiële dienst of activiteit.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel2.2
  - number: 2.2a
    text: |-
      1 De in [artikel 12a, eerste lid, van de Instellingswet Autoriteit Consument en Markt][ref1] bedoelde ambtenaren
      zijn bevoegd om voor het toezicht op de naleving van de wettelijke bepalingen met handhaving waarvan zij krachtens
      [artikel 2.2][ref2] zijn belast, onder verstrekking van onjuiste of onvolledige gegevens met betrekking tot
      hun identiteit en hoedanigheid, met een handelaar als bedoeld in artikel 3, onderdeel 11, van [verordening
      2017/2394](32394R2017), een overeenkomst te sluiten tot koop of tot het verrichten van een dienst en om ten
      aanzien van de handelaar hieraan gerelateerde handelingen te verrichten voor zover dat voor de vervulling
      van hun taak dringend noodzakelijk is. Zij brengen een handelaar als bedoeld in artikel 3, onderdeel 11, van
      [verordening 2017/2394](32394R2017), niet tot andere overtredingen dan waarop diens opzet reeds was gericht.
      [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref3] is niet van toepassing.

      2 De ambtenaar die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan op zijn
      ambtseed of -belofte een schriftelijk verslag op waarin hij vermeldt:

      a. zijn naam of nummer en zijn hoedanigheid;

      b. de motivering van de dringende noodzaak, bedoeld in het eerste lid;

      c. de voorschriften op de naleving waarvan wordt toegezien;

      d. het adres, waaronder indien van toepassing het elektronische adres, en, voor zover bekend, de omschrijving van
      de desbetreffende handelaar;

      e. de onjuiste of onvolledige gegevens die bij het verrichten van de handelingen zijn verstrekt;

      f. de wijze waarop en het tijdvak waarin de handelingen hebben plaatsgevonden;

      g. hetgeen tijdens het onderzoek is verricht, gebleken en overigens is voorgevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0033043#Artikel12a
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel2.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel512
