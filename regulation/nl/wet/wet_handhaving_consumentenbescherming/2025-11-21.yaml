  - number: '3.7'
    text: |-
      Het Commissariaat voor de Media wordt aangewezen als bevoegde autoriteit voor inbreuken binnen de Unie op de
      wettelijke bepalingen, bedoeld in onderdeel d van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel3.7
  - number: '3.8'
    text: |-
      1 De leden van het Commissariaat voor de Media en de bij besluit van het Commissariaat aangewezen medewerkers van
      het Commissariaat, bedoeld in [artikel 7.11, tweede lid, van de Mediawet 2008][ref1], zijn belast met het toezicht
      op de naleving van de wettelijke bepalingen waarvoor het Commissariaat voor de Media als bevoegde autoriteit is
      aangewezen.

      2 Indien naar het oordeel van het Commissariaat voor de Media een inbreuk binnen de Unie op een van de wettelijke
      bepalingen als bedoeld in onderdeel d van de bijlage bij deze wet heeft plaatsgevonden, kan het Commissariaat voor
      de Media:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.24][ref2], [3.2, tweede lid][ref3], [3.4, zesde en zevende lid][ref4], en [3.4a][ref5] zijn van
      overeenkomstige toepassing.

      4 De [artikelen 7.12][ref6] en [7.19 van de Mediawet 2008][ref7] zijn van overeenkomstige toepassing.

      5 De [artikelen 2.2a][ref8] en [2.7][ref9] zijn van overeenkomstige toepassing ten aanzien van inbreuken of
      inbreuken binnen de Unie op bepalingen waarvoor het Commissariaat voor de Media krachtens [artikel 3.7][ref10] is
      aangewezen als bevoegde autoriteit, met dien verstande dat voor «de Autoriteit Consument en Markt» wordt gelezen
      «het Commissariaat voor de Media».


