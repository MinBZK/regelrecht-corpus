  - number: '3.9'
    text: |-
      De Inspectie Leefomgeving en Transport wordt aangewezen als bevoegde autoriteit voor inbreuken binnen de Unie op de
      wettelijke bepalingen, bedoeld in onderdeel e van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel3.9
  - number: '3.10'
    text: |-
      1 Met het toezicht op de naleving van de wettelijke bepalingen, bedoeld in onderdeel e van de bijlage bij deze wet,
      zijn belast de bij besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren. Van dat besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.

      2 Onze Minister van Infrastructuur en Waterstaat kan, indien naar zijn oordeel een inbreuk binnen de Unie op een
      van de wettelijke bepalingen als bedoeld in onderdeel e van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.24][ref1], [3.2, tweede lid][ref2], [3.4, zesde en zevende lid][ref3], en [3.4a][ref4] zijn van
      overeenkomstige toepassing.

      4 De in het tweede lid bedoelde bestuurlijke boete bedraagt ten hoogste het bedrag van de vijfde categorie
      geldboete, bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref5].

      5 De [artikelen 2.2a][ref6] en [2.7][ref7] zijn van overeenkomstige toepassing ten aanzien van inbreuken
      of inbreuken binnen de Unie op bepalingen waarvoor de Inspectie Leefomgeving en Transport krachtens
      [artikel 3.9][ref8] is aangewezen als bevoegde autoriteit, met dien verstande dat voor «de Autoriteit Consument en
      Markt» wordt gelezen «de Minister van Infrastructuur en Waterstaat».


