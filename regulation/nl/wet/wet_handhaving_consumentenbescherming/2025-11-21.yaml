  - number: '2.8'
    text: De Autoriteit Consument en Markt kan een bindende gedragslijn tot naleving van deze wet opleggen.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel2.8
  - number: '2.9'
    text: |-
      Indien de Autoriteit Consument en Markt van oordeel is dat een inbreuk of inbreuk binnen de Unie heeft
      plaatsgevonden, kan zij de overtreder opleggen:

      a. een last onder dwangsom;

      b. een bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel2.9
  - number: '2.10'
    text: |-
      Onverminderd het bepaalde in de [artikelen 3:4][ref1], [5:41][ref2] en
      [5:46 van de Algemene wet bestuursrecht][ref3], houdt de Autoriteit Consument en Markt bij het opleggen van een
      bestuurlijke boete vanwege een overtreding van de [artikelen 8.2a][ref4], [8.3][ref5], [8.4a][ref6], [8.5][ref7],
      [8.8][ref8] of [8.11][ref9] of van de artikelen van de [Prijzenwet][ref10], genoemd in bijlage a bij deze wet, waar
      passend in ieder geval rekening met:

      a. de aard, ernst, omvang en duur van de inbreuk;

      b. de maatregelen die de overtreder heeft getroffen om de door de consumenten geleden schade te beperken of te
      verhelpen;

      c. eerdere inbreuken van de overtreder;

      d. de door de overtreder als gevolg van de inbreuk behaalde financiële voordelen of vermeden verliezen, voor zover
      bekend;

      e. in geval van een inbreuk binnen de Unie: sancties die in andere lidstaten aan de overtreder zijn opgelegd voor
      dezelfde inbreuk, voor zover die informatie beschikbaar is in de elektronische databank, bedoeld in artikel 35 van
      [Verordening 2017/2394](32394R2017);

      f. andere verzwarende of verzachtende factoren die van toepassing zijn op de specifieke overtreding.


