  - number: 8a.1
    text: |-
      1 Indien een dienstverlener als bedoeld in [artikel 8.15][ref1] een beroep doet op
      [artikel 230fc, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref2] voert hij een beoordeling uit om te
      kunnen bepalen of het naleven van de van toegankelijkheidsvoorschriften, bedoeld in bijlage I, afdelingen III en
      IV, onderdeel g, van [richtlijn (EU) 2019/882](32019L0882) tot een fundamentele wijziging leidt, of overeenkomstig
      de desbetreffende criteria in bijlage VI van die richtlijn, een onevenredige last oplevert.

      2 Indien het beroep, bedoeld in het eerste lid, betrekking heeft op
      [artikel 230fc, tweede lid, onderdeel b, van Boek 6 van het Burgerlijk Wetboek][ref3] voert de betrokken
      dienstverlener een nieuwe beoordeling uit ten minste een keer per vijf jaar en verder indien sprake is van:

      a. een wijziging van de aangeboden dienst; of

      b. een verzoek van de Autoriteit Consument en Markt onderscheidenlijk de Stichting Autoriteit Financiële Markten om
      een nieuwe beoordeling.

      3 De betrokken dienstverlener documenteert de beoordeling, bedoeld in het tweede lid, en bewaart alle relevante
      resultaten gedurende een periode van vijf jaar nadat de e-handelsdienst op de markt is verleend. Op verzoek van de
      Autoriteit Consument en Markt onderscheidenlijk de Stichting Autoriteit Financiële Markten verstrekt de betrokken
      dienstverlener een exemplaar van de beoordeling.

      4 Iedere dienstverlener die een beroep doet op
      [artikel 230fc, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref4] verstrekt daarover informatie aan de
      Autoriteit Consument en Markt onderscheidenlijk de Stichting Autoriteit Financiële Markten.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel8.15
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel230fc
      [ref3]: https://wetten.overheid.nl/BWBR0005289#Artikel230fc
      [ref4]: https://wetten.overheid.nl/BWBR0005289#Artikel230fc
