  - number: '8.5'
    text: |-
      De toezending van een niet bestelde zaak, of de ongevraagde levering van water, gas, elektriciteit,
      stadsverwarming of digitale inhoud die niet op een materiële drager is geleverd, ongeacht of de
      digitale inhoud individualiseerbaar is en of er feitelijke macht over kan worden uitgeoefend, of het
      verrichten van een niet opgedragen dienst, met het verzoek tot betaling van een prijs, bedoeld in
      [artikel 7, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1], is niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel7
