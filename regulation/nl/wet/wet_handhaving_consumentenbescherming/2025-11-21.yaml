  - number: '3.1'
    text: |-
      1 De Stichting Autoriteit Financiële Markten wordt aangewezen als bevoegde autoriteit voor inbreuken of inbreuken
      binnen de Unie op de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze wet, voor zover de
      inbreuk of inbreuk binnen de Unie betrekking heeft op een financiële dienst of activiteit.

      2 De Stichting Autoriteit Financiële Markten wordt voorts aangewezen als bevoegde autoriteit voor inbreuken of
      inbreuken binnen de Unie op de wettelijke bepalingen bedoeld in onderdeel b van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel3.1
  - number: '3.2'
    text: |-
      1 De bij besluit van de Stichting Autoriteit Financiële Markten aangewezen personen zijn belast met het toezicht op
      de naleving van de wettelijke bepalingen, bedoeld in de onderdelen a en b van de bijlage bij deze wet, voor zover
      de inbreuk of inbreuk binnen de Unie betrekking heeft op een financiële dienst of activiteit. Van dat besluit wordt
      mededeling gedaan door plaatsing in de Staatscourant.

      2 [Artikel 5:17 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op geschriften gewisseld tussen een
      overtreder en een advocaat die is toegelaten tot de balie, die zich bij de overtreder bevinden, doch waarop, indien
      zij zich zouden bevinden bij die advocaat, [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref2] van
      toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
