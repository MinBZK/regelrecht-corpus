  - number: 3.3a
    text: |-
      1 De personen, bedoeld in [artikel 3.2, eerste lid][ref1], zijn bevoegd om voor het toezicht op de naleving van
      de wettelijke bepalingen, bedoeld in de onderdelen a en b van de bijlage bij deze wet, onder verstrekking van
      onjuiste of onvolledige gegevens met betrekking tot hun identiteit en hoedanigheid, met een handelaar als bedoeld
      in artikel 3, onderdeel 11, van [verordening 2017/2394](32394R2017), een overeenkomst te sluiten tot koop of tot
      het verrichten van een dienst en om ten aanzien van de handelaar hieraan gerelateerde handelingen te verrichten
      voor zover dat voor de vervulling van hun taak dringend noodzakelijk is. Zij brengen een handelaar als bedoeld
      in artikel 3, onderdeel 11, van [verordening 2017/2394](32394R2017), niet tot andere overtredingen dan waarop
      diens opzet reeds was gericht. [Artikel 5:12, tweede lid, van de Algemene wet bestuursrecht][ref2] is niet van
      toepassing.

      2 Degene die gebruik heeft gemaakt van de bevoegdheid, bedoeld in het eerste lid, maakt daarvan een schriftelijk
      verslag op waarin hij vermeldt:

      a. zijn naam en zijn hoedanigheid;

      b. de motivering van de dringende noodzaak, bedoeld in het eerste lid;

      c. de voorschriften op de naleving of handhaving waarvan wordt toegezien;

      d. het elektronische adres en, voor zover bekend, de omschrijving van de desbetreffende handelaar;

      e. de onjuiste of onvolledige gegevens die bij het verrichten van de handelingen zijn verstrekt;

      f. de wijze waarop de deelname en het tijdvak waarin de deelname heeft plaatsgevonden;

      g. hetgeen tijdens het onderzoek is verricht, gebleken en overigens is voorgevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel3.2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel512
