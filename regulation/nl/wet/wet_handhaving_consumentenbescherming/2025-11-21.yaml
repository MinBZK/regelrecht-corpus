  - number: '10.3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van overeenkomsten
      als bedoeld in artikel 32 van [verordening 2017/2394](32394R2017).

      2 Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan een
      krachtens deze wet aangewezen bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel10.3
  - number: '10.5'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel10.5
  - number: '10.6'
    text: 'Deze wet wordt aangehaald als: Wet handhaving consumentenbescherming.'
