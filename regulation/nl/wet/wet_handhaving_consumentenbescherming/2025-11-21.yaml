  - number: '3.3'
    text: |-
      1 De Stichting Autoriteit Financiële Markten kan gegevens of inlichtingen die zij in verband met enige werkzaamheid
      ten behoeve van de uitvoering van een taak als bedoeld in [artikel 3.1][ref1] heeft verkregen, verstrekken aan
      de Autoriteit Consument en Markt, de overige bevoegde autoriteiten, genoemd in [hoofdstuk 3][ref2], en de andere
      overheidsinstanties, genoemd in [artikel 4.1, eerste lid][ref3], ten behoeve van een goede vervulling van hun taken
      genoemd in deze wet.

      2 De Stichting Autoriteit Financiële Markten kan gegevens of inlichtingen die zij in verband met enige werkzaamheid
      ten behoeve van de uitvoering van een taak als bedoeld in [artikel 3.1][ref4] heeft verkregen, verstrekken voor
      zover een wettelijk voorschrift het gebruik van deze gegevens of inlichtingen regelt.

      3 Verstrekking van gegevens of inlichtingen vindt uitsluitend plaats indien:

      a. de geheimhouding van de gegevens of inlichtingen in voldoende mate is gewaarborgd; en

      b. voldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel3.1
