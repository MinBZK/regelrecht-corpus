  - number: '3.13'
    text: |-
      Alle informatie die een bevoegde autoriteit op grond van [verordening 2017/2394](32394R2017) aan bevoegde
      autoriteiten van andere lidstaten en de Commissie verstrekt, verstrekt de bevoegde instantie eveneens aan de
      Autoriteit Consument en Markt als het verbindingsbureau.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel3.13
  - number: '4.1'
    text: |-
      1 Als andere overheidsinstantie worden aangewezen:

      a. de Nederlandse Zorgautoriteit;

      b. de Belastingdienst/FIOD;

      c. de Kansspelautoriteit.

      2 Bij algemene maatregel van bestuur kunnen andere overheidsinstanties worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel4.1
  - number: '4.2'
    text: |-
      1 Indien zowel de Autoriteit Consument en Markt als een andere overheidsinstantie bevoegd zijn toezicht uit te
      oefenen of handhavingsmaatregelen te nemen ten aanzien van dezelfde gedraging, maakt de Autoriteit Consument en
      Markt geen gebruik van de aan haar in deze wet toegekende bevoegdheden.

      2 In afwijking van het vorige lid kan de Autoriteit Consument en Markt gebruik maken van de aan haar in deze wet
      toegekende bevoegdheden indien:

      a. de andere overheidsinstantie de Autoriteit Consument en Markt daaromtrent verzoekt; of

      b. de andere overheidsinstantie niet aan de verplichting uit [artikel 4.5, tweede lid][ref1], kan voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4.5'
        hoofdstuk: '4'
  - number: '4.3'
    text: |-
      Voor zover door een andere overheidsinstantie bij de uitoefening van haar bevoegdheden begrippen worden uitgelegd,
      die worden gehanteerd in een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage van deze wet, dan
      vindt deze uitleg plaats in overeenstemming met de Autoriteit Consument en Markt. In de samenwerkingsprotocollen,
      bedoeld in [artikel 5.1][ref1], worden hierover nadere afspraken gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '4.4'
    text: |-
      Indien een andere overheidsinstantie toezichts- of handhavingsmaatregelen neemt ten aanzien van een gedraging,
      die eveneens een inbreuk binnen de Unie op kan leveren, stelt zij de Autoriteit Consument en Markt als het
      verbindingsbureau hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel4.4
  - number: '4.5'
    text: |-
      1 Indien de Autoriteit Consument en Markt een verzoek om wederzijdse bijstand als bedoeld in [verordening
      2017/2394](32394R2017) krijgt ten aanzien van een gedraging waarvan ook een andere overheidsinstantie bevoegd is,
      verwijst de Autoriteit Consument en Markt het verzoek door naar de desbetreffende overheidsinstantie.

      2 Indien de Autoriteit Consument en Markt een verzoek om wederzijdse bijstand aan een andere overheidsinstantie
      doorverwijst, is de andere overheidsinstantie verplicht om toezicht uit te oefenen of handhavingsmaatregelen
      te nemen ten aanzien van de betrokken gedraging, tenzij sprake is van een van de uitzonderingsgronden als
      bedoeld in artikel 14 van [verordening 2017/2394](32394R2017). Alle gegevens omtrent genomen toezichts- en
      handhavingsmaatregelen worden aan de Autoriteit Consument en Markt als het verbindingsbureau bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel4.5
  - number: '5.1'
    text: |-
      1 De Autoriteit Consument en Markt kan afspraken maken met:

      a. Onze Minister van Financiën, voor wat betreft de Belastingdienst/FIOD;

      b. Onze Minister van Infrastructuur en Milieu, voor wat betreft de Inspectie Leefomgeving en Transport;

      c. Onze Minister van Volksgezondheid, Welzijn en Sport, voor wat betreft de Inspectie gezondheidszorg en jeugd;

      d. andere in aanmerking komende Ministers.

      2 De Autoriteit Consument en Markt kan afspraken maken met het bevoegde gezag van:

      a. de Stichting Autoriteit Financiële Markten;

      b. het Commissariaat voor de Media;

      c. de Nederlandse Zorgautoriteit;

      d. het College van Procureurs-Generaal;

      e. de Stichting Het Juridisch Loket;

      f. de Kansspelautoriteit;

      g. andere overheidsinstellingen.

      3 De afspraken bedoeld in het eerste lid en het tweede lid, onderdelen b tot en met f, worden vastgelegd in
      samenwerkingsprotocollen en hebben onder meer betrekking op:

      a. effectief en doelmatig toezicht op en optreden tegen inbreuken;

      b. consumentenvoorlichting;

      c. de gemeenschappelijke activiteiten en verslaglegging, bedoeld in de artikelen 30, 31 en 37 van [verordening
      2017/2394](32394R2017).

      4 De afspraken bedoeld in het tweede lid, onderdeel a, worden vastgelegd in een samenwerkingsprotocol en hebben
      betrekking op:

      a. de uitleg van begrippen als bedoeld in [artikel 4.3][ref1];

      b. de samenwerking tussen de Stichting Autoriteit Financiële Markten en de Autoriteit Consument en Markt in de
      uitoefening van haar taak als het verbindingsbureau.

      5 De Autoriteit Consument en Markt doet mededeling van de samenwerkingsprotocollen in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4.3'
        hoofdstuk: '4'
  - number: '6.1'
    text: |-
      1 De Autoriteit Consument en Markt kan afspraken maken met consumentenorganisaties. De afspraken kunnen onder meer
      betrekking hebben op het doorverwijzen van consumenten voor wat betreft informatievoorziening, de behandeling van
      klachten en geschillenbeslechting.

      2 De Autoriteit Consument en Markt kan afspraken maken met stichtingen of verenigingen met volledige
      rechtsbevoegdheid die krachtens hun statuten tot taak hebben de behandeling van klachten van consumenten en
      geschillenbeslechting. De afspraken kunnen onder meer betrekking hebben op de behandeling van klachten en
      geschillenbeslechting.

      3 Afspraken zoals bedoeld in het eerste en tweede lid worden vastgelegd in samenwerkingsprotocollen. De Autoriteit
      Consument en Markt doet mededeling van de samenwerkingsprotocollen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel6.1
  - number: '6.2'
    text: Bij algemene maatregel van bestuur kunnen instanties worden aangewezen als aangewezen instantie.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel6.2
  - number: '6.3'
    text: |-
      1 De Autoriteit Consument en Markt organiseert een maatschappelijk overleg met consumentenorganisaties en centrale
      ondernemersverenigingen.

      2 Doelstelling van het maatschappelijk overleg is:

      a. de taken van de Autoriteit Consument en Markt ter uitvoering van deze wet zo goed mogelijk aan te laten sluiten
      bij private initiatieven ter bescherming van de consument;

      b. Onze Minister, de bevoegde autoriteiten en andere overheidsinstanties te informeren over de effecten en de
      doeltreffendheid van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel6.3
  - number: 6a.1
    text: |-
      Het Europees Consumenten Centrum, onderdeel van de Stichting Het Juridisch Loket, wordt aangewezen als instantie
      voor het verlenen van praktische bijstand aan consumenten als bedoeld in artikel 8 van Verordening (EU) 2018/302.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel6a.1
  - number: '7.1'
    text: |-
      Tegen een uitspraak in hoger beroep van het College van Beroep voor het bedrijfsleven kan de procureur-generaal
      bij de Hoge Raad der Nederlanden beroep in cassatie in het belang der wet instellen wegens schending of verkeerde
      toepassing van [hoofdstuk 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0020586
        hoofdstuk: '8'
  - number: '7.2'
    text: Consumentenorganisaties worden aangemerkt als belanghebbenden bij besluiten krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel7.2
  - number: '8.1'
    text: |-
      1 De in dit hoofdstuk neergelegde bepalingen gelden uitsluitend indien de wederpartij een consument is.

      2 In dit hoofdstuk wordt verstaan onder:

      a. consument: een natuurlijk persoon die niet handelt in de uitoefening van zijn beroep of bedrijf;

      b. algemene voorwaarden: een of meer bedingen die zijn opgesteld teneinde in een aantal overeenkomsten te worden
      opgenomen, met uitzondering van bedingen die de kern van de prestaties aangeven, voor zover die bedingen duidelijk
      en begrijpelijk zijn geformuleerd.

      c. pandhuis: een natuurlijke persoon of rechtspersoon die in de uitoefening van zijn beroep of bedrijf
      pandbeleningen aanbiedt als bedoeld in [artikel 130 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel130
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '130'
  - number: '8.2'
    text: |-
      1 Degene die een dienst van de informatiemaatschappij verleent als bedoeld in artikel 15d, derde lid, van Boek 3
      van het Burgerlijk Wetboek, neemt de [artikelen 15a][ref1] en [15c][ref2], [15d, eerste en tweede lid][ref3], en
      [15f van Boek 3 van het Burgerlijk Wetboek][ref4] in acht.

      2 Indien commerciële communicatie als bedoeld in
      [artikel 15e, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref5], deel uitmaakt van een dienst van de
      informatiemaatschappij of een dergelijke dienst vormt, zorgt degene in wiens opdracht de commerciële communicatie
      geschiedt, dat [artikel 15e, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref6] in acht wordt genomen.

      3 De dienstverlener, bedoeld in het eerste lid, neemt de [artikelen 227a][ref7], [227b][ref8] en
      [227c van Boek 6 van het Burgerlijk Wetboek][ref9] in acht.

      4 Indien een wederpartij langs de elektronische weg een verklaring als bedoeld in
      [artikel 227c, tweede lid, van Boek 6 van het Burgerlijk Wetboek][ref10] uitbrengt die door de in het eerste lid
      bedoelde dienstverlener mag worden opgevat hetzij als een aanvaarding van een door hem langs de elektronische weg
      gedaan aanbod, hetzij als een aanbod naar aanleiding van een door hem langs de elektronische weg gedane uitnodiging
      om in onderhandeling te treden, bevestigt de dienstverlener de ontvangst van deze verklaring zo spoedig mogelijk
      langs elektronische weg aan de wederpartij.

      5 Het derde en vierde lid zijn niet van toepassing, indien een overeenkomst uitsluitend door middel van de
      uitwisseling van elektronische post of een soortgelijke vorm van individuele communicatie tot stand komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15a
