  - number: 3.4a
    text: |-
      1 De Stichting Autoriteit Financiële Markten kan een beschikking openbaar maken omtrent het opleggen van een
      zelfstandige last, last onder dwangsom of bestuurlijke boete alsmede een toezegging door de overtreder dat een
      inbreuk of inbreuk binnen de Unie zal worden gestaakt.

      2 De Stichting Autoriteit Financiële Markten maakt een voornemen tot openbaarmaking van een beschikking als bedoeld
      in het eerste lid van te voren bekend aan degene tot wie de beschikking is gericht. Dit geschiedt op hetzelfde
      moment als dat degene tot wie de beschikking is gericht in de gelegenheid wordt gesteld daarover zijn zienswijze
      uit te brengen.

      3 De Stichting Autoriteit Financiële Markten maakt een beschikking als bedoeld in het
      eerste lid niet eigener beweging openbaar gedurende twee weken nadat het besluit op de in
      [artikel 3:41 van de Algemene wet bestuursrecht][ref1] voorgeschreven wijze bekend is gemaakt, tenzij degene
      tot wie de beschikking is gericht de beschikking zelf heeft openbaar gemaakt, heeft doen openbaar maken of
      openbaarmaking met degene tot wie de beschikking is gericht is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel341
    url: https://wetten.overheid.nl/BWBR0020586/2025-11-21#Artikel3.4a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 3:41
  - number: 3.4b
    text: |-
      [Artikel 2.7][ref1] is van overeenkomstige toepassing ten aanzien van een inbreuk of inbreuk binnen de Unie, op
      bepalingen waarvoor de Stichting Autoriteit Financiële Markten krachtens [artikel 3.1][ref2] is aangewezen als
      bevoegde autoriteit, met dien verstande dat voor «de Autoriteit Consument en Markt» wordt gelezen «de Stichting
      Autoriteit Financiële Markten».


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2.7
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel3.1
