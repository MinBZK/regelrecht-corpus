  - number: '3.9'
    text: |-
      De Inspectie Verkeer en Waterstaat wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken op de
      wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.9
  - number: 3.10.1
    text: |-
      Met het toezicht op de naleving van de wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze wet,
      zijn belast de bij besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren. Van dat besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.10
  - number: 3.10.2
    text: |-
      Onze Minister van Infrastructuur en Milieu kan, indien naar zijn oordeel een intercommunautaire inbreuk op een
      van de bepalingen van Verordening (EG) nr. 261/2004 van het Europees Parlement en de Raad van 11 februari 2004 tot
      vaststelling van gemeenschappelijke regels inzake compensatie en bijstand aan luchtreizigers bij instapweigering
      en annulering of langdurige vertraging van vluchten (PbEU 2004, L364), een intercommunautaire inbreuk op een van de
      bepalingen van Verordening (EU) nr. 181/2011 van het Europees Parlement en de Raad van 16 februari 2011 betreffende
      de rechten van autobus- en touringcarpassagiers en tot wijziging van Verordening (EG) nr. 2006/2004 (PbEU 2011,
      L 55) of een inbreuk op een van de bepalingen van Verordening (EU) nr. 1177/2010 van het Europees Parlement en de
      Raad van 24 november 2010 betreffende de rechten van passagiers die over zee of binnenwateren reizen en houdende
      wijziging van Verordening (EG) nr. 2006/2004 (PbEU 2010, L 334) heeft plaatsgevonden:
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.10
  - number: 3.10.2.a
    text: een bestuurlijke boete opleggen;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.10
  - number: 3.10.2.b
    text: een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.10
  - number: 3.10.3
    text: |-
