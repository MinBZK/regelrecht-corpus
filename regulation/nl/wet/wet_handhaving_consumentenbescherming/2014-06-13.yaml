  - number: '8.7'
    text: |-
      Een reisorganisator als bedoeld in [artikel 500 van Boek 7 van het Burgerlijk Wetboek][ref1] neemt de bij of
      krachtens de [artikelen 501][ref2] en [502 van Boek 7 van het Burgerlijk Wetboek][ref3] gestelde eisen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel500
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel501
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel502
