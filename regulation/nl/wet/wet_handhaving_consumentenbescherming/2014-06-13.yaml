    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.6
  - number: 3.6.2.b
    text: een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.6
  - number: 3.6.3
    text: |-
