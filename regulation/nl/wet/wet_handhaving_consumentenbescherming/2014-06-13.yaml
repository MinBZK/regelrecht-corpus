  - number: '3.13'
    text: |-
      Alle informatie die een bevoegde autoriteit op grond van [verordening 2006/2004](32004R2006) aan bevoegde
      autoriteiten van andere lidstaten en de Commissie verstrekt, verstrekt de bevoegde instantie eveneens aan de
      Autoriteit Consument en Markt als het verbindingsbureau.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.13
  - number: 4.1.1
    text: 'Als andere overheidsinstantie worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.1
  - number: 4.1.1.a
    text: de Nederlandse Zorgautoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.1
  - number: 4.1.1.b
    text: de Belastingdienst/FIOD-ECD.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.1
  - number: 4.1.2
    text: Bij algemene maatregel van bestuur kunnen andere overheidsinstanties worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.1
  - number: 4.2.1
    text: |-
      Indien zowel de Autoriteit Consument en Markt als een andere overheidsinstantie bevoegd zijn toezicht uit te
      oefenen of handhavingsmaatregelen te nemen ten aanzien van dezelfde gedraging, maakt de Autoriteit Consument en
      Markt geen gebruik van de aan haar in deze wet toegekende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.2
  - number: 4.2.2
    text: |-
      In afwijking van het vorige lid kan de Autoriteit Consument en Markt gebruik maken van de aan haar in deze wet
      toegekende bevoegdheden indien:
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.2
  - number: 4.2.2.a
    text: de andere overheidsinstantie de Autoriteit Consument en Markt daaromtrent verzoekt; of
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.2
  - number: 4.2.2.b
    text: |-
      de andere overheidsinstantie niet aan de verplichting uit [artikel 4.5, tweede lid][ref1], kan voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1
    text: |-
      Voor zover door een andere overheidsinstantie bij de uitoefening van haar bevoegdheden begrippen worden uitgelegd,
      die worden gehanteerd in een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage van deze wet,
      dan wordt deze uitleg afgestemd met de Autoriteit Consument en Markt. In de samenwerkingsprotocollen, bedoeld in
      [artikel 5.1][ref1], worden hierover nadere afspraken gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel5
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '5'
        hoofdstuk: '5'
  - number: 4.3.2
    text: |-
      Voor zover door een andere overheidsinstantie bij de uitoefening van haar bevoegdheden begrippen worden uitgelegd,
      die worden gehanteerd in een van de wettelijke bepalingen, bedoeld in onderdeel b van de bijlage van deze wet, dan
      vindt deze uitleg plaats in overeenstemming met de Autoriteit Consument en Markt. In de samenwerkingsprotocollen,
      bedoeld in [artikel 5.1][ref1], worden hierover nadere afspraken gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel5
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '5'
        hoofdstuk: '5'
  - number: '4.4'
    text: |-
      Indien een andere overheidsinstantie toezichts- of handhavingsmaatregelen neemt ten aanzien van een gedraging,
      die eveneens een intracommunautaire inbreuk op kan leveren, stelt zij de Autoriteit Consument en Markt als het
      verbindingsbureau hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.4
  - number: 4.5.1
    text: |-
      Indien de Autoriteit Consument en Markt een verzoek om wederzijdse bijstand als bedoeld in [verordening 2006/2004]
      (32004R2006) krijgt ten aanzien van een gedraging waarvan ook een andere overheidsinstantie bevoegd is, verwijst de
      Autoriteit Consument en Markt het verzoek door naar de desbetreffende overheidsinstantie.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.5
  - number: 4.5.2
    text: |-
      Indien de Autoriteit Consument en Markt een verzoek om wederzijdse bijstand aan een andere overheidsinstantie
      doorverwijst, is de andere overheidsinstantie verplicht om toezicht uit te oefenen of handhavingsmaatregelen
      te nemen ten aanzien van de betrokken gedraging, tenzij sprake is van een van de uitzonderingsgronden als
      bedoeld in artikel 15 van [verordening 2006/2004](32004R2006). Alle gegevens omtrent genomen toezichts- en
      handhavingsmaatregelen worden aan de Autoriteit Consument en Markt als het verbindingsbureau bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel4.5
  - number: 5.1.1
    text: 'De Autoriteit Consument en Markt kan afspraken maken met:'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.1.a
    text: Onze Minister van Financiën, voor wat betreft de Belastingdienst/FIOD-ECD;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.1.b
    text: Onze Minister van Infrastructuur en Milieu, voor wat betreft de Inspectie Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.1.c
    text: Onze Minister van Volksgezondheid, Welzijn en Sport, voor wat betreft het Staatstoezicht op de Volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.1.d
    text: andere in aanmerking komende Ministers.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.2
    text: 'De Autoriteit Consument en Markt kan afspraken maken met het bevoegde gezag van:'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.2.a
    text: de Stichting Autoriteit Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.2.b
    text: het Commissariaat voor de Media;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.2.c
    text: de Nederlandse Zorgautoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.2.d
    text: het College van Procureurs-Generaal;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.2.e
    text: de Stichting Het Juridisch Loket;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.2.f
    text: andere overheidsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.3
    text: |-
      De afspraken bedoeld in het eerste lid en het tweede lid, onderdelen b tot en met f, worden vastgelegd in
      samenwerkingsprotocollen en hebben onder meer betrekking op:
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.3.a
    text: effectief en doelmatig toezicht op en optreden tegen inbreuken;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.3.b
    text: consumentenvoorlichting;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.3.c
    text: |-
      de gemeenschappelijke activiteiten en verslaglegging, bedoeld in de artikelen 16, 17 en 21 van [verordening
      2006/2004](32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.4
    text: |-
      De afspraken bedoeld in het tweede lid, onderdeel a, worden vastgelegd in een samenwerkingsprotocol en hebben
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.4.a
    text: |-
      de uitleg van begrippen als bedoeld in [artikel 4.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.1.4.b
    text: |-
      de samenwerking tussen de Stichting Autoriteit Financiële Markten en de Autoriteit Consument en Markt in de
      uitoefening van haar taak als het verbindingsbureau.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 5.1.5
    text: De Autoriteit Consument en Markt doet mededeling van de samenwerkingsprotocollen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel5.1
  - number: 6.1.1
    text: |-
      De Autoriteit Consument en Markt kan afspraken maken met consumentenorganisaties. De afspraken kunnen onder meer
      betrekking hebben op het doorverwijzen van consumenten voor wat betreft informatievoorziening, de behandeling van
      klachten en geschillenbeslechting.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.1
  - number: 6.1.2
    text: |-
      De Autoriteit Consument en Markt kan afspraken maken met stichtingen of verenigingen met volledige
      rechtsbevoegdheid die krachtens hun statuten tot taak hebben de behandeling van klachten van consumenten en
      geschillenbeslechting. De afspraken kunnen onder meer betrekking hebben op de behandeling van klachten en
      geschillenbeslechting.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.1
  - number: 6.1.3
    text: |-
      Afspraken zoals bedoeld in het eerste en tweede lid worden vastgelegd in samenwerkingsprotocollen. De Autoriteit
      Consument en Markt doet mededeling van de samenwerkingsprotocollen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.1
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen instanties worden aangewezen die een rechtmatig belang hebben bij
      de beëindiging van of het verbieden van intracommunautaire inbreuken als bedoeld in artikel 4, tweede lid, van
      [verordening 2006/2004](32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.2
  - number: 6.3.1
    text: |-
      De Autoriteit Consument en Markt organiseert een maatschappelijk overleg met consumentenorganisaties en centrale
      ondernemersverenigingen.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.3
  - number: 6.3.2
    text: 'Doelstelling van het maatschappelijk overleg is:'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.3
  - number: 6.3.2.a
    text: |-
      de taken van de Autoriteit Consument en Markt ter uitvoering van deze wet zo goed mogelijk aan te laten sluiten bij
      private initiatieven ter bescherming van de consument;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.3
  - number: 6.3.2.b
    text: |-
      Onze Minister, de bevoegde autoriteiten en andere overheidsinstanties te informeren over de effecten en de
      doeltreffendheid van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel6.3
  - number: '7.1'
    text: |-
      Tegen een uitspraak in hoger beroep van het College van Beroep voor het bedrijfsleven kan de procureur-generaal
      bij de Hoge Raad der Nederlanden beroep in cassatie in het belang der wet instellen wegens schending of verkeerde
      toepassing van [artikel 8.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel8
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '8'
        hoofdstuk: '8'
  - number: '7.2'
    text: Consumentenorganisaties worden aangemerkt als belanghebbenden bij besluiten krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel7.2
  - number: 8.1.1
    text: De in dit hoofdstuk neergelegde bepalingen gelden uitsluitend indien de wederpartij een consument is.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.1
  - number: 8.1.2
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.1
  - number: 8.1.2.a
    text: 'consument: een natuurlijk persoon die niet handelt in de uitoefening van zijn beroep of bedrijf;'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.1
  - number: 8.1.2.b
    text: |-
      handelaar: natuurlijk persoon of rechtspersoon die handelt in de uitoefening van een beroep of bedrijf of degene
      die ten behoeve van hem handelt;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.1
  - number: 8.1.2.c
    text: |-
      algemene voorwaarden: een of meer bedingen die zijn opgesteld teneinde in een aantal overeenkomsten te worden
      opgenomen, met uitzondering van bedingen die de kern van de prestaties aangeven, voor zover die bedingen duidelijk
      en begrijpelijk zijn geformuleerd.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.1
  - number: 8.2.1
    text: |-
      Degene die een dienst van de informatiemaatschappij verleent als bedoeld in
      [artikel 15d, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], neemt
      [artikel 15d, eerste en tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15d
  - number: 8.2.2
    text: |-
      Indien commerciële communicatie als bedoeld in
      [artikel 15e, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], deel uitmaakt van een dienst van de
      informatiemaatschappij of een dergelijke dienst vormt, zorgt degene in wiens opdracht de commerciële communicatie
      geschiedt, dat [artikel 15e, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] in acht wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15e
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15e
  - number: 8.2.3
    text: |-
      De dienstverlener, bedoeld in het eerste lid, neemt de [artikelen 227b, eerste en tweede lid][ref1], en
      [227c, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227b
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel227c
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227b
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 227c
  - number: 8.2.4
    text: |-
      Indien een wederpartij langs de elektronische weg een verklaring als bedoeld in
      [artikel 227c, tweede lid, van het Burgerlijk Wetboek][ref1] uitbrengt die door de in het eerste lid bedoelde
      dienstverlener mag worden opgevat hetzij als een aanvaarding van een door hem langs de elektronische weg gedaan
      aanbod, hetzij als een aanbod naar aanleiding van een door hem langs de elektronische weg gedane uitnodiging om in
      onderhandeling te treden, bevestigt de dienstverlener de ontvangst van deze verklaring zo spoedig mogelijk langs
      elektronische weg aan de wederpartij.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227c
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227c
  - number: 8.2.5
    text: |-
      Het derde en vierde lid zijn niet van toepassing, indien een overeenkomst uitsluitend door middel van de
      uitwisseling van elektronische post of een soortgelijke vorm van individuele communicatie tot stand komt.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.2
  - number: 8.2a
    text: |-
      Een handelaar als bedoeld in [artikel 230g, eerste lid, onderdeel b, van Boek 6 van het Burgerlijk Wetboek][ref1],
      die een overeenkomst aangaat als bedoeld in artikel 230g, eerste lid, onderdeel c,
      dan wel onderdeel d, van Boek 6 van het Burgerlijk Wetboek, neemt de bepalingen van
      [Afdeling 2B van Titel 5 van Boek 6 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel230g
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Afdeling2b
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.2a
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 230g
      - id: ref2
        bwb_id: BWBR0005289
        afdeling: 2b
  - number: '8.3'
    text: |-
      Degene die algemene voorwaarden gebruikt in een overeenkomst met een consument, bindt die consument niet aan een
      beding als bedoeld in [artikel 236 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
  - number: '8.4'
    text: |-
      Bij een consumentenkoop als bedoeld in [artikel 5, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1], neemt
      de verkoper [artikel 6a, tweede en derde lid, van Boek 7 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel6a
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 6a
  - number: 8.4a
    text: |-
      Bij een consumentenkoop als bedoeld in [artikel 5, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1],
      neemt de verkoper de [artikelen 9, vierde lid][ref2], [11][ref3] en
      [19a van Boek 7 van het Burgerlijk Wetboek in acht][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel19a
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.4a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '11'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: 19a
  - number: '8.5'
    text: |-
      De toezending van een niet bestelde zaak, of de ongevraagde levering van water, gas, elektriciteit, stadsverwarming
      of digitale inhoud, of het verrichten van een niet opgedragen dienst, met het verzoek tot betaling van een prijs,
      bedoeld in [artikel 7, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1], is niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel7
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '7'
  - number: '8.6'
    text: |-
      Een handelaar als bedoeld in [artikel 50a, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref1],
      die een overeenkomst aangaat als bedoeld in artikel 50a, onderdelen c tot en met f, van dat Boek, neemt
      de [artikelen 50b][ref2] en [50c van Boek 7 van dat Boek][ref3] in acht. Op de vorige volzin zijn de
      [artikelen 50g lid 1][ref4] en [50h van Boek 7 van het Burgerlijk Wetboek][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel50a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel50b
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel50c
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel50g
