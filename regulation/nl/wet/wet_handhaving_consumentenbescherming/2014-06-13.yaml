  - number: '3.7'
    text: |-
      Het Commissariaat voor de Media wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken op de
      wettelijke bepalingen, bedoeld in onderdeel f van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.7
  - number: 3.8.1
    text: |-
      De leden van het Commissariaat voor de Media en de bij besluit van het Commissariaat aangewezen medewerkers van
      het Commissariaat, bedoeld in [artikel 7.11, tweede lid, van de Mediawet 2008][ref1], zijn belast met het toezicht
      op de naleving van de wettelijke bepalingen waarvoor het Commissariaat voor de Media als bevoegde autoriteit is
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel7
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '7'
  - number: 3.8.2
    text: |-
      Indien naar het oordeel van het Commissariaat voor de Media een intracommunautaire inbreuk op een van de wettelijke
      bepalingen als bedoeld in onderdeel f van de bijlage bij deze wet heeft plaatsgevonden, kan het Commissariaat voor
      de Media:
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel3.8
  - number: 3.8.2.a
