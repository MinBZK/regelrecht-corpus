  - number: '8.8'
    text: |-
      Het is een handelaar niet toegestaan oneerlijke handelspraktijken te verrichten als bedoeld in
      [Afdeling 3A van Titel 3 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3A
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: 3A
  - number: '8.9'
    text: |-
      De dienstverrichter die diensten verricht als bedoeld in richtlijn 2006/123/EG van het Europees Parlement en de
      Raad van de Europese Unie van 12 december 2006 betreffende diensten op de interne markt (PbEU L 376), neemt de
      bepalingen van [Afdeling 2a van titel 5 van Boek 6 van het Burgerlijk Wetboek][ref1] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling2a
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: 2a
  - number: '9.9'
    text: |-
      Zolang het bij koninklijke boodschap van 8 december 2003 ingediende voorstel van wet tot vaststelling van een
      nieuwe Geneesmiddelenwet, Kamerstukken II, nr. 29 359, nog niet tot wet is verheven en in werking is getreden,
      zijn de krachtens [artikel 22 van de Wet op de geneesmiddelenvoorziening][ref1] aangewezen ambtenaren van het
      Staatstoezicht op de volksgezondheid belast met het toezicht, bedoeld in [artikel 3.6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel3
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0020586
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 10.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van overeenkomsten als
      bedoeld in artikel 18 van [verordening 2006/2004](32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel10.3
  - number: 10.3.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan een
      krachtens deze wet aangewezen bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel10.3
  - number: '10.5'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel10.5
  - number: '10.6'
    text: 'Deze wet wordt aangehaald als: Wet handhaving consumentenbescherming.'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel10.6
