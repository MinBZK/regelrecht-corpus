  - number: 1.1.d
    text: |-
      consumentenorganisaties: stichtingen of verenigingen met volledige rechtsbevoegdheid die krachtens hun statuten tot
      taak hebben het behartigen van de collectieve belangen van consumenten;
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel1.1
  - number: 1.1.e
    text: 'financiële dienst of activiteit:'
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel1.1
  - number: 1.1.e.1°
    text: |-
      een financiële dienst als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1] en het aanbieden
      van effecten aan het publiek of het doen toelaten van effecten tot de handel op een in Nederland gelegen of
      functionerende gereglementeerde markt, bedoeld in [artikel 5:2 van de Wet op het financieel toezicht][ref2],
      waarbij voor de toepassing van deze wet onder deze financiële diensten en activiteiten mede worden
      begrepen de overeenkomsten met betrekking tot een of meer financiële producten als bedoeld in
      [artikel 1.1 van de Wet op het financieel toezicht][ref3] die rechtstreeks uit deze financiële diensten of
      activiteiten voortvloeien of daarvan het resultaat zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0020586/2014-06-13#Artikel1.1
    references:
      - id: ref1
