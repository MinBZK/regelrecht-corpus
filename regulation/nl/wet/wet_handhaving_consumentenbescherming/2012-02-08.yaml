        artikel: '236'
  - number: '8.4'
    text: |-
      Bij een consumentenkoop als bedoeld in [artikel 5, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1], neemt
      de verkoper [artikel 6a, tweede en derde lid, van Boek 7 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel6a
