  - number: '8.3'
    text: |-
      Degene die algemene voorwaarden gebruikt in een overeenkomst met een consument, bindt die consument niet aan een
      beding als bedoeld in [artikel 236 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel8.3
