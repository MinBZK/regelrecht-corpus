  - number: '3.4'
    text: |-
      1 De Stichting Autoriteit Financiële Markten kan, indien zij van oordeel is dat een overtreding op een van de
      wettelijke bepalingen, bedoeld in onderdeel c, sub c.1, van de bijlage bij deze wet, heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      2 Met betrekking tot de toepassing van het eerste lid:

      a. zijn de [artikelen 2.10][ref1][2.23][ref2] en [2.24][ref3] van overeenkomstige toepassing; en

      b. zijn [artikel 1:81 van de Wet op het financieel toezicht][ref4] van overeenkomstige toepassing.

      3 De Stichting Autoriteit Financiële Markten kan, indien zij van oordeel is dat een overtreding op een van de
      wettelijke bepalingen, bedoeld in onderdelen c, sub c.2 en d van de bijlage bij deze wet, heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      4 Met betrekking tot de toepassing van het derde lid zijn de [artikelen 2.10][ref5][2.15][ref6], [2.23][ref7],
      [2.24][ref8] en [4.3, tweede lid][ref9], van overeenkomstige toepassing.


