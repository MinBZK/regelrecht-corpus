        hoofdstuk: '8'
  - number: '7.2'
    text: Consumentenorganisaties worden aangemerkt als belanghebbenden bij besluiten krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel7.2
  - number: '8.1'
    text: |-
      1 De in dit hoofdstuk neergelegde bepalingen gelden uitsluitend indien de wederpartij een consument is.

      2 In dit hoofdstuk wordt verstaan onder:

      a. consument: een natuurlijk persoon die niet handelt in de uitoefening van zijn beroep of bedrijf;

      b. handelaar: natuurlijk persoon of rechtspersoon die handelt in de uitoefening van een beroep of bedrijf of degene
      die ten behoeve van hem handelt;

      c. algemene voorwaarden: een of meer bedingen die zijn opgesteld teneinde in een aantal overeenkomsten te worden
      opgenomen, met uitzondering van bedingen die de kern van de prestaties aangeven, voor zover die bedingen duidelijk
      en begrijpelijk zijn geformuleerd.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel8.1
  - number: '8.2'
    text: |-
      1 Degene die een dienst van de informatiemaatschappij verleent als bedoeld in
      [artikel 15d, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], neemt
      [artikel 15d, eerste en tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref2] in acht.

      2 Indien commerciële communicatie als bedoeld in
      [artikel 15e, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref3], deel uitmaakt van een dienst van de
      informatiemaatschappij of een dergelijke dienst vormt, zorgt degene in wiens opdracht de commerciële communicatie
      geschiedt, dat [artikel 15e, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref4] in acht wordt genomen.

      3 De dienstverlener, bedoeld in het eerste lid, neemt de [artikelen 227b, eerste en tweede lid][ref5], en
      [227c, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref6] in acht.

      4 Indien een wederpartij langs de elektronische weg een verklaring als bedoeld in
      [artikel 227c, tweede lid, van het Burgerlijk Wetboek][ref7] uitbrengt die door de in het eerste lid bedoelde
      dienstverlener mag worden opgevat hetzij als een aanvaarding van een door hem langs de elektronische weg gedaan
      aanbod, hetzij als een aanbod naar aanleiding van een door hem langs de elektronische weg gedane uitnodiging om in
      onderhandeling te treden, bevestigt de dienstverlener de ontvangst van deze verklaring zo spoedig mogelijk langs
      elektronische weg aan de wederpartij.

      5 Het derde en vierde lid zijn niet van toepassing, indien een overeenkomst uitsluitend door middel van de
      uitwisseling van elektronische post of een soortgelijke vorm van individuele communicatie tot stand komt.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
