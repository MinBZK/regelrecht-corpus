  - number: '3.7'
    text: |-
      Het Commissariaat voor de Media wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken op de
      wettelijke bepalingen, bedoeld in onderdeel f van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel3.7
  - number: '3.8'
    text: |-
      1 De leden van het Commissariaat voor de Media en de bij besluit van het Commissariaat aangewezen medewerkers van
      het Commissariaat, bedoeld in [artikel 7.11, tweede lid, van de Mediawet 2008][ref1], zijn belast met het toezicht
      op de naleving van de wettelijke bepalingen waarvoor het Commissariaat voor de Media als bevoegde autoriteit is
      aangewezen.

      2 Indien naar het oordeel van het Commissariaat voor de Media een intracommunautaire inbreuk op een van de
      wettelijke bepalingen als bedoeld in onderdeel f van de bijlage bij deze wet heeft plaatsgevonden, kan het
      Commissariaat voor de Media:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.4, tweede lid][ref2], [2.10][ref3], [2.23][ref4] en [2.24][ref5] zijn van overeenkomstige
      toepassing.

      4 De [artikelen 7.12][ref6] en [7.19 van de Mediawet 2008][ref7] zijn van overeenkomstige toepassing.


