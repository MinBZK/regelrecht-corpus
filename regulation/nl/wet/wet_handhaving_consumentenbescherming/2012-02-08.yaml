  - number: '3.9'
    text: |-
      De Inspectie Verkeer en Waterstaat wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken op de
      wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel3.9
  - number: '3.10'
    text: |-
      1 Met het toezicht op de naleving van de wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze wet,
      zijn belast de bij besluit van Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren. Van dat besluit
      wordt mededeling gedaan door plaatsing in de Staatscourant.

      2 Onze Minister van Infrastructuur en Milieu kan, indien naar zijn oordeel een intracommunautaire inbreuk op een
      van de wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.4, tweede lid][ref1], [2.10][ref2], [2.15][ref3], [2.23][ref4] en [2.24][ref5] zijn van
      overeenkomstige toepassing.


