  - number: '8.9'
    text: |-
      De dienstverrichter die diensten verricht als bedoeld in richtlijn 2006/123/EG van het Europees Parlement en de
      Raad van de Europese Unie van 12 december 2006 betreffende diensten op de interne markt (PbEU L 376), neemt de
