  - number: '3.13'
    text: |-
      Alle informatie die een bevoegde autoriteit op grond van [verordening 2006/2004](32004R2006) aan bevoegde
      autoriteiten van andere lidstaten en de Commissie verstrekt, verstrekt de bevoegde instantie eveneens aan de
      Consumentenautoriteit als het verbindingsbureau.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel3.13
  - number: '4.1'
    text: |-
      1 Als andere overheidsinstantie worden aangewezen:

      a. de Nederlandse Zorgautoriteit;

      b. de Onafhankelijke Post en Telecommunicatie Autoriteit;

      c. de raad van bestuur van de Nederlandse Mededingingsautoriteit;

      d. de Belastingdienst/FIOD-ECD.

      2 Bij algemene maatregel van bestuur kunnen andere overheidsinstanties worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel4.1
  - number: '4.2'
    text: |-
      1 Indien zowel de Consumentenautoriteit als een andere overheidsinstantie bevoegd zijn toezicht uit te oefenen of
      handhavingsmaatregelen te nemen ten aanzien van dezelfde gedraging, maakt de Consumentenautoriteit geen gebruik van
      de aan haar in deze wet toegekende bevoegdheden.

      2 In afwijking van het vorige lid kan de Consumentenautoriteit gebruik maken van de aan haar in deze wet toegekende
      bevoegdheden indien:

      a. de andere overheidsinstantie de Consumentenautoriteit daaromtrent verzoekt; of

      b. de andere overheidsinstantie niet aan de verplichting uit [artikel 4.5, tweede lid][ref1], kan voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4.5
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4.5'
        hoofdstuk: '4'
  - number: '4.3'
    text: |-
      1 Voor zover door een andere overheidsinstantie bij de uitoefening van haar bevoegdheden begrippen worden
      uitgelegd, die worden gehanteerd in een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage van
      deze wet, dan wordt deze uitleg afgestemd met de Consumentenautoriteit. In de samenwerkingsprotocollen, bedoeld in
      [artikel 5.1][ref1], worden hierover nadere afspraken gemaakt.

      2 Voor zover door een andere overheidsinstantie bij de uitoefening van haar bevoegdheden begrippen worden
      uitgelegd, die worden gehanteerd in een van de wettelijke bepalingen, bedoeld in onderdeel b van de
      bijlage van deze wet, dan vindt deze uitleg plaats in overeenstemming met de Consumentenautoriteit. In de
      samenwerkingsprotocollen, bedoeld in [artikel 5.1][ref2], worden hierover nadere afspraken gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel5.1
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '5.1'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0020586
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '4.4'
    text: |-
      Indien een andere overheidsinstantie toezichts- of handhavingsmaatregelen neemt ten aanzien van een gedraging,
      die eveneens een intracommunautaire inbreuk op kan leveren, stelt zij de Consumentenautoriteit als het
      verbindingsbureau hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel4.4
  - number: '4.5'
    text: |-
      1 Indien de Consumentenautoriteit een verzoek om wederzijdse bijstand als bedoeld in [verordening 2006/2004]
      (32004R2006) krijgt ten aanzien van een gedraging waarvan ook een andere overheidsinstantie bevoegd is, verwijst de
      Consumentenautoriteit het verzoek door naar de desbetreffende overheidsinstantie.

      2 Indien de Consumentenautoriteit een verzoek om wederzijdse bijstand aan een andere overheidsinstantie
      doorverwijst, is de andere overheidsinstantie verplicht om toezicht uit te oefenen of handhavingsmaatregelen
      te nemen ten aanzien van de betrokken gedraging, tenzij sprake is van een van de uitzonderingsgronden als
      bedoeld in artikel 15 van [verordening 2006/2004](32004R2006). Alle gegevens omtrent genomen toezichts- en
      handhavingsmaatregelen worden aan de Consumentenautoriteit als het verbindingsbureau bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel4.5
  - number: '5.1'
    text: |-
      1 Onze Minister kan afspraken maken met:

      a. Onze Minister van Financiën, voor wat betreft de Belastingdienst/FIOD-ECD;

      b. Onze Minister van Infrastructuur en Milieu, voor wat betreft de Inspectie Verkeer en Waterstaat;

      c. Onze Minister van Volksgezondheid, Welzijn en Sport, voor wat betreft het Staatstoezicht op de Volksgezondheid;

      d. andere in aanmerking komende Ministers.

      2 Onze Minister kan afspraken maken met het bevoegde gezag van:

      a. de Stichting Autoriteit Financiële Markten;

      b. de Nederlandse Mededingingsautoriteit;

      c. het Commissariaat voor de Media;

      d. de Nederlandse Zorgautoriteit;

      e. de Onafhankelijke Post en Telecommunicatie Autoriteit;

      f. het College van Procureurs-Generaal;

      g. de Stichting Het Juridisch Loket;

      h. andere overheidsinstellingen.

      3 De afspraken bedoeld in het eerste lid en het tweede lid, onderdelen b tot en met h, worden vastgelegd in
      samenwerkingsprotocollen en hebben onder meer betrekking op:

      a. effectief en doelmatig toezicht op en optreden tegen inbreuken;

      b. consumentenvoorlichting;

      c. de gemeenschappelijke activiteiten en verslaglegging, bedoeld in de artikelen 16, 17 en 21 van [verordening
      2006/2004](32004R2006).

      4 De afspraken bedoeld in het tweede lid, onderdeel a, worden vastgelegd in een samenwerkingsprotocol en hebben
      betrekking op:

      a. de uitleg van begrippen als bedoeld in [artikel 4.3][ref1];

      b. de samenwerking tussen de Stichting Autoriteit Financiële Markten en de Consumentenautoriteit in de uitoefening
      van haar taak als het verbindingsbureau.

      5 Onze Minister doet mededeling van de samenwerkingsprotocollen in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4.3
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4.3'
        hoofdstuk: '4'
  - number: '6.1'
    text: |-
      1 Onze Minister kan afspraken maken met consumentenorganisaties. De afspraken kunnen onder meer betrekking hebben
      op het doorverwijzen van consumenten voor wat betreft informatievoorziening, de behandeling van klachten en
      geschillenbeslechting.

      2 Onze Minister kan afspraken maken met stichtingen of verenigingen met volledige rechtsbevoegdheid die krachtens
      hun statuten tot taak hebben de behandeling van klachten van consumenten en geschillenbeslechting. De afspraken
      kunnen onder meer betrekking hebben op de behandeling van klachten en geschillenbeslechting.

      3 Afspraken zoals bedoeld in het eerste en tweede lid worden vastgelegd in samenwerkingsprotocollen. Onze Minister
      doet mededeling van de samenwerkingsprotocollen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel6.1
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen instanties worden aangewezen die een rechtmatig belang hebben bij
      de beëindiging van of het verbieden van intracommunautaire inbreuken als bedoeld in artikel 4, tweede lid, van
      [verordening 2006/2004](32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel6.2
  - number: '6.3'
    text: |-
      1 De Consumentenautoriteit organiseert een maatschappelijk overleg met consumentenorganisaties en centrale
      ondernemersverenigingen.

      2 Doelstelling van het maatschappelijk overleg is:

      a. de taken van de Consumentenautoriteit ter uitvoering van deze wet zo goed mogelijk aan te laten sluiten bij
      private initiatieven ter bescherming van de consument;

      b. Onze Minister, de bevoegde autoriteiten en andere overheidsinstanties te informeren over de effecten en de
      doeltreffendheid van de uitvoering van deze wet.

      3 De Consumentenautoriteit nodigt ten minste elk kwartaal consumentenorganisaties en centrale
      ondernemersverenigingen uit voor het maatschappelijk overleg. Ook kunnen stichtingen of verenigingen met volledige
      rechtsbevoegdheid die krachtens hun statuten tot taak hebben de behandeling van klachten van consumenten en
      geschillenbeslechting als bedoeld in [artikel 6.1][ref1] en aangewezen instanties die een rechtmatig belang hebben
      bij de beëindiging van overtredingen als bedoeld in [artikel 6.2][ref2] voor het maatschappelijk overleg worden
      uitgenodigd.

      4 Andere bevoegde autoriteiten en andere overheidsinstanties kunnen toehoorders aanwijzen voor het maatschappelijk
      overleg.

      5 Bij regeling van Onze Minister kunnen nadere regels worden gesteld over deelname aan het maatschappelijk overleg
      en de werkwijze en verslaglegging van het maatschappelijk overleg en over de vergoeding van reis- en onkosten van
      deelnemers aan het maatschappelijk overleg.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel6.2
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '6.1'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020586
        artikel: '6.2'
        hoofdstuk: '6'
  - number: '7.1'
    text: |-
      1 Indien beroep wordt ingesteld tegen een besluit op grond van deze wet is, in afwijking van
      [artikel 8:1 van de Algemene wet bestuurswet][ref1], de rechtbank te Rotterdam uitsluitend bevoegd.

      2 Tegen een uitspraak in hoger beroep van het College van Beroep voor het bedrijfsleven kan de procureur-generaal
      bij de Hoge Raad der Nederlanden beroep in cassatie in het belang der wet instellen wegens schending of verkeerde
      toepassing van [artikel 8.8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel8.8
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel7.1
