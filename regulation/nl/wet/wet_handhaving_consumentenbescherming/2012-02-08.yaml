  - number: '2.9'
    text: |-
      1 Indien de Consumentenautoriteit van oordeel is dat een overtreding heeft plaatsgevonden, kan zij de overtreder
      opleggen:

      a. een last onder dwangsom;

      b. een bestuurlijke boete.

      2 Voor zover een last onder dwangsom of bestuurlijke boete verplicht tot betaling van een geldsom, komt deze
      geldsom toe aan ’s Rijks schatkist.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel2.9
  - number: '2.10'
    text: |-
      1 Op het opleggen van een last onder dwangsom krachtens deze paragraaf zijn de
      [artikelen 5:32, tweede lid, tot en met 5:39 van de Algemene wet bestuursrecht][ref1] van toepassing, zijn de
      [artikelen 5:48 tot en met 5:51 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing en is
      [artikel 51 van het Wetboek van Strafrecht][ref3] van overeenkomstige toepassing.

      2 De Consumentenautoriteit kan een last onder dwangsom opleggen, die strekt tot verzekering van de medewerking die
      krachtens [artikel 5:20 van de Algemene wet bestuursrecht][ref4] kan worden gevorderd bij de uitoefening van de
      bevoegdheden van de toezichthouders, bedoeld in [artikel 2.4][ref5].


