    text: |-
      1 De in [artikel 2.9][ref1] bedoelde bestuurlijke boete bedraagt ten hoogste het bedrag van de vijfde categorie
      geldboete, bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref2].

      2 In afwijking van het eerste lid bedraagt de bestuurlijke boete, indien het betreft een overtreding van
      [artikel 8.8][ref3], ten hoogste € 450 000.


