      [artikel 305d van Boek 3 van het Burgerlijk Wetboek][ref1] indienen indien naar haar oordeel sprake is van een
      overtreding van een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze wet, en de
