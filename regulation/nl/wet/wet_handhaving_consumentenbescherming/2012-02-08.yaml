  - number: '10.1'
    text: |-
      Onze Minister brengt jaarlijks vóór 1 juni verslag uit over de werkzaamheden van de Consumentenautoriteit in het
      afgelopen jaar en brengt dit verslag ter kennis van de beide Kamers van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel10.1
  - number: '10.2'
    text: |-
      1 Onze Minister zendt binnen vier jaar na de inwerkingtreding van de wet en vervolgens na iedere vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van:

      a. het functioneren van de Consumentenautoriteit;

      b. de samenwerking en coördinatie tussen de bevoegde autoriteiten en andere overheidsinstanties, voor zover deze
      betrekking hebben op de handhaving van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze
      wet.

      2 Het verslag, bedoeld in het eerste lid, omvat mede een rapportage betreffende de bestuurlijke vormgeving van
      de Consumentenautoriteit.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel10.2
  - number: '10.3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van overeenkomsten
      als bedoeld in artikel 18 van [verordening 2006/2004](32004R2006).

      2 Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan een
      krachtens deze wet aangewezen bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel10.3
  - number: '10.5'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel10.5
  - number: '10.6'
    text: 'Deze wet wordt aangehaald als: Wet handhaving consumentenbescherming.'
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel10.6
