      - id: ref2
        bwb_id: BWBR0005290
        artikel: 6a
  - number: '8.5'
    text: |-
      1 De toezending van een niet bestelde zaak of het verrichten van een niet opgedragen dienst met het verzoek tot
      betaling van een prijs, bedoeld in [artikel 7, tweede en vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1],
      is niet toegestaan.

      2 De verkoper of dienstverlener neemt bij een koop op afstand als bedoeld in
      [artikel 46a, onder b, van Boek 7 van het Burgerlijk Wetboek][ref2] de [artikelen 46c][ref3] en
      [46h, eerste, tweede, vierde, vijfde en zevende lid, van Boek 7 van het Burgerlijk Wetboek][ref4] in acht.

      3 Een ieder die elektronische contactgegevens voor elektronische berichten heeft verkregen in het kader van de
      verkoop van een zaak mag deze gegevens slechts gebruiken voor het overbrengen van communicatie ter bevordering
      van de totstandkoming van een koop op afstand met betrekking tot eigen gelijksoortige zaken, indien daarbij
      [artikel 46h, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref5] in acht wordt genomen.

      4 Degene die ongevraagd communicatie overbrengt of mededelingen doet ter bevordering van de totstandkoming van een
      koop op afstand, neemt [artikel 46h, zesde en zevende lid, van Boek 7 van het Burgerlijk Wetboek][ref6] in acht.

      5 Op het bepaalde in het tweede tot en met het vierde lid, is
      [artikel 46i van Boek 7 van het Burgerlijk Wetboek][ref7] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel7
