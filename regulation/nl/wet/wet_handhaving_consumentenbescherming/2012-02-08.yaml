  - number: '3.1'
    text: |-
      1 De Stichting Autoriteit Financiële Markten wordt aangewezen als bevoegde autoriteit voor intracommunautaire
      inbreuken op de wettelijke bepalingen, bedoeld in de onderdelen a en d van de bijlage bij deze wet, voor zover de
      intracommunautaire inbreuk betrekking heeft op een financiële dienst of activiteit.

      2 De Stichting Autoriteit Financiële Markten wordt voorts aangewezen als bevoegde autoriteit voor
      intracommunautaire inbreuken op de wettelijke bepalingen bedoeld in onderdeel c van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel3.1
  - number: '3.2'
    text: |-
      1 De bij besluit van de Autoriteit Financiële Markten aangewezen personen zijn belast met het toezicht op de
      naleving van de wettelijke bepalingen, bedoeld in de onderdelen a, c en d van de bijlage bij deze wet, voor zover
      de overtreding betrekking heeft op een financiële dienst of activiteit. Van dat besluit wordt mededeling gedaan
      door plaatsing in de Staatscourant.

      2 De [artikelen 2.4, tweede lid][ref1], [2.10][ref2] en [2.23][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2.4
