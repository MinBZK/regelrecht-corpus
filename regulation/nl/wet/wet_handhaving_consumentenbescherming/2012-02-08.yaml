  - number: '3.11'
    text: |-
      De Voedsel en Warenautoriteit wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken op de
      wettelijke bepalingen, bedoeld in onderdeel h van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel3.11
  - number: '3.12'
    text: |-
      1 De krachtens [artikel 13, eerste lid, van de Tabakswet][ref1] benoemde ambtenaren zijn belast met het toezicht
      op de naleving van de wettelijke bepalingen inzake intracommunautaire inbreuken voor welke de Voedsel en
      Warenautoriteit als bevoegde autoriteit is aangewezen.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan, indien naar zijn oordeel een intracommunautaire inbreuk
      op een van de wettelijke bepalingen, bedoeld in onderdeel h van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.4, tweede lid][ref2], [2.10][ref3], [2.23][ref4] en [2.24][ref5] zijn van overeenkomstige
      toepassing.

      4 [Artikel 11b, tweede lid, van de Tabakswet][ref6] is van overeenkomstige toepassing.


