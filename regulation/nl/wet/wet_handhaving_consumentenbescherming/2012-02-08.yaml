preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van verordening (EG) nr. 2006/2004 van het
    Europees Parlement en de Raad van de Europese Unie van 27 oktober 2004 betreffende samenwerking tussen de nationale
    instanties die verantwoordelijk zijn voor handhaving van de wetgeving inzake consumentenbescherming (PbEU L 364),
    noodzakelijk is regels te stellen inzake privaatrechtelijke en publiekrechtelijke handhaving van de wetgeving
    inzake consumentenbescherming;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. andere overheidsinstantie: een andere overheidsinstantie als bedoeld in artikel 4, tweede lid, van [verordening
      2006/2004](32004R2006);

      b. bevoegde autoriteit: een bevoegde autoriteit als bedoeld in artikel 3, onderdeel c, van [verordening 2006/2004]
      (32004R2006);

      c. Consumentenautoriteit: de Consumentenautoriteit, bedoeld in [artikel 2.1][ref1];

      d. consumentenorganisaties: stichtingen of verenigingen met volledige rechtsbevoegdheid die krachtens hun statuten
      tot taak hebben het behartigen van de collectieve belangen van consumenten;

      e. financiële dienst of activiteit:

      1°. een financiële dienst als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2] en het aanbieden
      van effecten aan het publiek of het doen toelaten van effecten tot de handel op een in Nederland gelegen of
      functionerende gereglementeerde markt, bedoeld in [artikel 5:2 van de Wet op het financieel toezicht][ref3],
      waarbij voor de toepassing van deze wet onder deze financiële diensten en activiteiten mede worden
      begrepen de overeenkomsten met betrekking tot een of meer financiële producten als bedoeld in
      [artikel 1.1 van de Wet op het financieel toezicht][ref4] die rechtstreeks uit deze financiële diensten of
      activiteiten voortvloeien of daarvan het resultaat zijn;

      2°. het in de uitoefening van een bedrijf buiten besloten kring aantrekken, ter beschikking verkrijgen of
      ter beschikking hebben van opvorderbare gelden van anderen dan professionele marktpartijen als bedoeld in
      [artikel 3:5, eerste lid, van de Wet op het financieel toezicht][ref5], dan wel het als tussenpersoon werkzaamheden
      verrichten in de zin van [artikel 4:3, eerste lid, van laatstgenoemde wet][ref6];

      3°. een geldtransactie als bedoeld in [artikel 1 van de Wet inzake geldtransactiekantoren][ref7];

      4°. het exploiteren of beheren van een gereglementeerde markt waarvoor een vergunning als bedoeld
      in [artikel 5:26, eerste lid, van de Wet op het financieel toezicht][ref8] is verleend of het
      exploiteren van een multilaterale handelsfaciliteit waarvoor een vergunning als bedoeld in
      [artikel 2:96 van de Wet op het financieel toezicht][ref9] is verleend;

      5°. een dienst als bedoeld onder 6 van de bijlage van richtlijn nr. 2007/64/EG van het Europees Parlement en de
      Raad van de Europese Unie van 13 november 2007 betreffende betalingsdiensten in de interne markt tot wijziging van
      de Richtlijnen 97/7/EG, 2002/65/EG, 2005/60/EG en 2006/48/EG en tot intrekking van Richtlijn 97/5/EG (PbEU L 319);

      f. inbreuk: elk handelen of nalaten dat in strijd is met een van de wettelijke bepalingen, bedoeld in de bijlage
      bij deze wet, en dat schade toebrengt of kan toebrengen aan de collectieve belangen van consumenten;

      g. intracommunautaire inbreuk: een intracommunautaire inbreuk als bedoeld in artikel 3, onderdeel b, van
      [verordening 2006/2004](32004R2006);

      h. lidstaat: een lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;

      i. Onze Minister: Onze Minister van Economische Zaken, Landbouw en Innovatie;

      j. overtreder: degene die een overtreding pleegt of medepleegt;

      k. overtreding: een inbreuk of intracommunautaire inbreuk;

      l. verbindingsbureau: verbindingsbureau als bedoeld in artikel 3, onderdeel d, van [verordening 2006/2004]
      (32004R2006);

      m. [verordening 2006/2004](32004R2006): [verordening (EG) nr. 2006/2004](32004R2006) van het Europees Parlement
      en de Raad van de Europese Unie van 27 oktober 2004 betreffende samenwerking tussen de nationale instanties die
      verantwoordelijk zijn voor handhaving van de wetgeving inzake consumentenbescherming (PbEU L 364);

      n. wettelijke bepalingen: de communautaire wetgeving ter bescherming van de belangen van de consument bedoeld in de
      bijlage bij deze wet, zoals geïmplementeerd in het Nederlands recht en het recht van de lidstaten.


