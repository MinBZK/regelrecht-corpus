  - number: '2.1'
    text: |-
      1 Onze Minister wijst een onder hem ressorterende ambtenaar als Consumentenautoriteit aan.

      2 Onze Minister kan één of meer onder hem ressorterende ambtenaren als plaatsvervanger van de Consumentenautoriteit
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel2.1
  - number: '2.2'
    text: |-
      De Consumentenautoriteit is belast met de handhaving van de wettelijke bepalingen, bedoeld in de onderdelen a en
      b van de bijlage bij deze wet. Zij is niet bevoegd indien de overtreding betrekking heeft op een financiële dienst
      of activiteit.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel2.2
  - number: '2.3'
    text: |-
      1 De Consumentenautoriteit wordt aangewezen als het verbindingsbureau in Nederland.

      2 Met betrekking tot intracommunautaire inbreuken op een van de wettelijke bepalingen, bedoeld in de onderdelen
      a en b van de bijlage bij deze wet, wordt de Consumentenautoriteit aangewezen als bevoegde autoriteit, tenzij de
      intracommunautaire inbreuk betrekking heeft op een financiële dienst of activiteit.

      3 De Consumentenautoriteit heeft mede tot taak de coördinatie van activiteiten van communautair belang,
      administratieve samenwerking en verslaglegging, bedoeld in de artikelen 16, 17 en 21 van [verordening 2006/2004]
      (32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel2.3
  - number: '2.4'
    text: |-
      1 De bij besluit van Onze Minister aangewezen ambtenaren en andere personen zijn belast met het toezicht op de
      naleving van de wettelijke bepalingen waarvoor de Consumentenautoriteit is belast met de handhaving. Van dat
      besluit wordt mededeling gedaan door plaatsing in de Staatscourant.

      2 [Artikel 5:17 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op geschriften gewisseld tussen een
      overtreder en een advocaat die is toegelaten tot de balie, die zich bij de overtreder bevinden, doch waarop, indien
      zij zich zouden bevinden bij die advocaat, [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref2] van
      toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel517
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel520
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel2.4
