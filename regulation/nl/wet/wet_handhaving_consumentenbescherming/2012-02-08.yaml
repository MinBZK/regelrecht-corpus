  - number: '2.5'
    text: |-
      1 De Consumentenautoriteit kan een verzoekschrift als bedoeld in
      [artikel 305d van Boek 3 van het Burgerlijk Wetboek][ref1] indienen indien naar haar oordeel sprake is van een
      overtreding van een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze wet, tenzij de
      overtreding betrekking heeft op een financiële dienst of activiteit.

      2 Alvorens de Consumentenautoriteit een verzoekschrift indient, stelt zij de overtreder een redelijke termijn om:

      a. de overtreding te staken;

      b. gegevens waarop het voornemen om een verzoekschrift in te dienen berust, in te zien en daarvan afschriften te
      vervaardigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305d
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305d
  - number: '2.6'
    text: |-
      1 Een overeenkomst strekkende tot vergoeding van schade die het gevolg is van een overtreding van één of
      meer wettelijke bepalingen met de handhaving waarvan de Consumentenautoriteit is belast, gesloten door de
      Consumentenautoriteit met één of meer andere partijen die deze bepalingen hebben overtreden en die zich bij deze
      overeenkomst hebben verbonden tot vergoeding van deze schade, kan door de rechter op verzoek van de partijen die
      de overeenkomst hebben gesloten verbindend worden verklaard voor personen aan wie de schade is veroorzaakt. Onder
      personen aan wie de schade is veroorzaakt worden mede begrepen personen die een vordering ter zake van deze schade
      onder algemene of bijzondere titel hebben verkregen.

      2 De [artikelen 907, tweede tot en met zesde lid][ref1], en
      [908 tot en met 910 van Boek 7 van het Burgerlijk Wetboek][ref2] en
      [titel 14 van het derde boek van het Wetboek van Burgerlijke Rechtsvordering][ref3] zijn van overeenkomstige
      toepassing.

      3 Onze Minister geeft een aanwijzing aan de Consumentenautoriteit over de wijze waarop zij de in het eerste lid
      bedoelde overeenkomst tot stand brengt.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel907
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel908
