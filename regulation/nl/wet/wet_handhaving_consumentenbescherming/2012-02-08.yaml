  - number: '8.6'
    text: |-
      Een handelaar als bedoeld in [artikel 50a, onderdeel b, van Boek 7 van het Burgerlijk Wetboek][ref1],
      die een overeenkomst aangaat als bedoeld in artikel 50a, onderdelen c tot en met f, van dat Boek, neemt
      de [artikelen 50b][ref2] en [50c van Boek 7 van dat Boek][ref3] in acht. Op de vorige volzin zijn de
      [artikelen 50g lid 1][ref4] en [50h van Boek 7 van het Burgerlijk Wetboek][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel50a
