  - number: '3.5'
    text: |-
      Het Staatstoezicht op de volksgezondheid wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken
      op de wettelijke bepalingen, bedoeld in onderdeel e van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2012-02-08#Artikel3.5
  - number: '3.6'
    text: |-
      1 De krachtens [artikel 100 van de Geneesmiddelenwet][ref1] aangewezen ambtenaren van het Staatstoezicht op de
      volksgezondheid zijn belast met toezicht op de naleving van de wettelijke bepalingen inzake intracommunautaire
      inbreuken voor welke het als bevoegde autoriteit is aangewezen.

      2 Onze Minister van Volksgezondheid, Welzijn en Sport kan, indien naar zijn oordeel een intracommunautaire inbreuk
      op een van de wettelijke bepalingen, bedoeld in onderdeel e van de bijlage bij deze wet heeft plaatsgevonden:

      a. een bestuurlijke boete opleggen;

      b. een last onder dwangsom opleggen.

      3 De [artikelen 2.4, tweede lid][ref2], [2.10][ref3], [2.23][ref4] en [2.24][ref5] zijn van overeenkomstige
      toepassing.

      4 Wat betreft de hoogte van de bestuurlijke boete is het [eerste lid van artikel 101 van de Geneesmiddelenwet][ref6]
      van overeenkomstige toepassing.


