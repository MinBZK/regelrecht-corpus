        artikel: 3:41
  - number: '2.24'
    text: |-
      Gegevens die de Consumentenautoriteit verkrijgt van andere bevoegde autoriteiten en andere overheidsinstanties als
      bedoeld in [hoofdstukken 3][ref1] en [4][ref2] van deze wet maakt de Consumentenautoriteit alleen openbaar met
      toestemming van de desbetreffende autoriteit of instantie.


