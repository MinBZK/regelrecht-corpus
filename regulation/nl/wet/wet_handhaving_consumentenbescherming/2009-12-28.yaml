preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede ter uitvoering van verordening (EG) nr. 2006/2004 van het
    Europees Parlement en de Raad van de Europese Unie van 27 oktober 2004 betreffende samenwerking tussen de nationale
    instanties die verantwoordelijk zijn voor handhaving van de wetgeving inzake consumentenbescherming (PbEU L 364),
    noodzakelijk is regels te stellen inzake privaatrechtelijke en publiekrechtelijke handhaving van de wetgeving
    inzake consumentenbescherming;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.a
    text: |-
      andere overheidsinstantie: een andere overheidsinstantie als bedoeld in artikel 4, tweede lid, van [verordening
      2006/2004](32004R2006);
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.b
    text: |-
      bevoegde autoriteit: een bevoegde autoriteit als bedoeld in artikel 3, onderdeel c, van [verordening 2006/2004]
      (32004R2006);
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.c
    text: |-
      Consumentenautoriteit: de Consumentenautoriteit, bedoeld in [artikel 2.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
    references:
