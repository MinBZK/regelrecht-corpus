  - number: '3.5'
    text: |-
      Het Staatstoezicht op de volksgezondheid wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken
      op de wettelijke bepalingen, bedoeld in onderdeel e van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.5
  - number: 3.6.1
    text: |-
      De krachtens [artikel 100 van de Geneesmiddelenwet][ref1] aangewezen ambtenaren van het Staatstoezicht op de
      volksgezondheid zijn belast met toezicht op de naleving van de wettelijke bepalingen inzake intracommunautaire
      inbreuken voor welke het als bevoegde autoriteit is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel100
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '100'
  - number: 3.6.2
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan, indien naar zijn oordeel een intracommunautaire inbreuk op
      een van de wettelijke bepalingen, bedoeld in onderdeel e van de bijlage bij deze wet heeft plaatsgevonden:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.6
  - number: 3.6.2.a
    text: een bestuurlijke boete opleggen;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.6
  - number: 3.6.2.b
    text: een last onder dwangsom opleggen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.6
  - number: 3.6.3
    text: |-
      De [artikelen 2.4, tweede lid][ref1], [2.10][ref2], [2.23][ref3] en [2.24][ref4] zijn van overeenkomstige
      toepassing.


