        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '5'
  - number: 1.1.e.2°
    text: |-
      het in de uitoefening van een bedrijf buiten besloten kring aantrekken, ter beschikking verkrijgen of
      ter beschikking hebben van opvorderbare gelden van anderen dan professionele marktpartijen als bedoeld in
      [artikel 3:5, eerste lid, van de Wet op het financieel toezicht][ref1], dan wel het als tussenpersoon werkzaamheden
      verrichten in de zin van [artikel 4:3, eerste lid, van laatstgenoemde wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel4
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
    references:
