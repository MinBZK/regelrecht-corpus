        artikel: '3'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '4'
  - number: 1.1.e.3°
    text: |-
      een geldtransactie als bedoeld in [artikel 1 van de Wet inzake geldtransactiekantoren][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013816#Artikel1
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0013816
        artikel: '1'
  - number: 1.1.e.4°
    text: |-
      het exploiteren of beheren van een gereglementeerde markt waarvoor een vergunning als bedoeld
      in [artikel 5:26, eerste lid, van de Wet op het financieel toezicht][ref1] is verleend of het
      exploiteren van een multilaterale handelsfaciliteit waarvoor een vergunning als bedoeld in
      [artikel 2:96 van de Wet op het financieel toezicht][ref2] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel2
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0020368
        artikel: '2'
  - number: 1.1.e.5°
    text: |-
      een dienst als bedoeld onder 6 van de bijlage van richtlijn nr. 2007/64/EG van het Europees Parlement en de Raad
      van de Europese Unie van 13 november 2007 betreffende betalingsdiensten in de interne markt tot wijziging van de
      Richtlijnen 97/7/EG, 2002/65/EG, 2005/60/EG en 2006/48/EG en tot intrekking van Richtlijn 97/5/EG (PbEU L 319);
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.f
    text: |-
      inbreuk: elk handelen of nalaten dat in strijd is met een van de wettelijke bepalingen, bedoeld in de bijlage bij
      deze wet, en dat schade toebrengt of kan toebrengen aan de collectieve belangen van consumenten;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.g
    text: |-
      intracommunautaire inbreuk: een intracommunautaire inbreuk als bedoeld in artikel 3, onderdeel b, van [verordening
      2006/2004](32004R2006);
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.h
    text: |-
      lidstaat: een lidstaat van de Europese Unie of een andere staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.i
    text: 'Onze Minister: Onze Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.j
    text: 'overtreder: degene die een overtreding pleegt of medepleegt;'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.k
    text: 'overtreding: een inbreuk of intracommunautaire inbreuk;'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.l
    text: |-
      verbindingsbureau: verbindingsbureau als bedoeld in artikel 3, onderdeel d, van [verordening 2006/2004]
      (32004R2006);
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.m
    text: |-
      [verordening 2006/2004](32004R2006): [verordening (EG) nr. 2006/2004](32004R2006) van het Europees Parlement
      en de Raad van de Europese Unie van 27 oktober 2004 betreffende samenwerking tussen de nationale instanties die
      verantwoordelijk zijn voor handhaving van de wetgeving inzake consumentenbescherming (PbEU L 364);
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 1.1.n
    text: |-
      wettelijke bepalingen: de communautaire wetgeving ter bescherming van de belangen van de consument bedoeld in de
      bijlage bij deze wet, zoals geïmplementeerd in het Nederlands recht en het recht van de lidstaten.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel1.1
  - number: 2.1.1
    text: Onze Minister wijst een onder hem ressorterende ambtenaar als Consumentenautoriteit aan.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.1
  - number: 2.1.2
    text: |-
      Onze Minister kan één of meer onder hem ressorterende ambtenaren als plaatsvervanger van de Consumentenautoriteit
      aanwijzen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.1
  - number: '2.2'
    text: |-
      De Consumentenautoriteit is belast met de handhaving van de wettelijke bepalingen, bedoeld in de onderdelen a en
      b van de bijlage bij deze wet. Zij is niet bevoegd indien de overtreding betrekking heeft op een financiële dienst
      of activiteit.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.2
  - number: 2.3.1
    text: De Consumentenautoriteit wordt aangewezen als het verbindingsbureau in Nederland.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.3
  - number: 2.3.2
    text: |-
      Met betrekking tot intracommunautaire inbreuken op een van de wettelijke bepalingen, bedoeld in de onderdelen a
      en b van de bijlage bij deze wet, wordt de Consumentenautoriteit aangewezen als bevoegde autoriteit, tenzij de
      intracommunautaire inbreuk betrekking heeft op een financiële dienst of activiteit.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.3
  - number: 2.3.3
    text: |-
      De Consumentenautoriteit heeft mede tot taak de coördinatie van activiteiten van communautair belang,
      administratieve samenwerking en verslaglegging, bedoeld in de artikelen 16, 17 en 21 van [verordening 2006/2004]
      (32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.3
  - number: 2.4.1
    text: |-
      De bij besluit van Onze Minister aangewezen ambtenaren en andere personen zijn belast met het toezicht op de
      naleving van de wettelijke bepalingen waarvoor de Consumentenautoriteit is belast met de handhaving. Van dat
      besluit wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.4
  - number: 2.4.2
    text: |-
      [Artikel 5:17 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op geschriften gewisseld tussen een
      overtreder en een advocaat die is toegelaten tot de balie, die zich bij de overtreder bevinden, doch waarop, indien
      zij zich zouden bevinden bij die advocaat, [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref2] van
      toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 2.5.1
    text: |-
      De Consumentenautoriteit kan een verzoekschrift als bedoeld in
      [artikel 305d van Boek 3 van het Burgerlijk Wetboek][ref1] indienen indien naar haar oordeel sprake is van een
      overtreding van een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze wet, tenzij de
      overtreding betrekking heeft op een financiële dienst of activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305d
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305d
  - number: 2.5.2
    text: 'Alvorens de Consumentenautoriteit een verzoekschrift indient, stelt zij de overtreder een redelijke termijn om:'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.5
  - number: 2.5.2.a
    text: de overtreding te staken;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.5
  - number: 2.5.2.b
    text: |-
      gegevens waarop het voornemen om een verzoekschrift in te dienen berust, in te zien en daarvan afschriften te
      vervaardigen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.5
  - number: 2.6.1
    text: |-
      Een overeenkomst strekkende tot vergoeding van schade die het gevolg is van een overtreding van één of
      meer wettelijke bepalingen met de handhaving waarvan de Consumentenautoriteit is belast, gesloten door de
      Consumentenautoriteit met één of meer andere partijen die deze bepalingen hebben overtreden en die zich bij deze
      overeenkomst hebben verbonden tot vergoeding van deze schade, kan door de rechter op verzoek van de partijen die
      de overeenkomst hebben gesloten verbindend worden verklaard voor personen aan wie de schade is veroorzaakt. Onder
      personen aan wie de schade is veroorzaakt worden mede begrepen personen die een vordering ter zake van deze schade
      onder algemene of bijzondere titel hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.6
  - number: 2.6.2
    text: |-
      De [artikelen 907, tweede tot en met zesde lid][ref1], en
      [908 tot en met 910 van Boek 7 van het Burgerlijk Wetboek][ref2] en
      [titel 14 van het derde boek van het Wetboek van Burgerlijke Rechtsvordering][ref3] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel907
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel908
      [ref3]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '907'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '908'
      - id: ref3
        bwb_id: BWBR0001827
  - number: 2.6.3
    text: |-
      Onze Minister geeft een aanwijzing aan de Consumentenautoriteit over de wijze waarop zij de in het eerste lid
      bedoelde overeenkomst tot stand brengt.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.6
  - number: '2.7'
    text: |-
      Deze paragraaf heeft, met uitzondering van [artikel 2.10, tweede lid][ref1], uitsluitend betrekking op
      overtredingen van de wettelijke bepalingen, bedoeld in onderdeel b van de bijlage bij deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 2.9.1
    text: |-
      Indien de Consumentenautoriteit van oordeel is dat een overtreding heeft plaatsgevonden, kan zij de overtreder
      opleggen:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.9
  - number: 2.9.1.a
    text: een last onder dwangsom;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.9
  - number: 2.9.1.b
    text: een bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.9
  - number: 2.9.2
    text: |-
      Voor zover een last onder dwangsom of bestuurlijke boete verplicht tot betaling van een geldsom, komt deze geldsom
      toe aan ’s Rijks schatkist.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.9
  - number: 2.10.1
    text: |-
      Op het opleggen van een last onder dwangsom krachtens deze paragraaf zijn de
      [artikelen 5:32, tweede lid, tot en met 5:39 van de Algemene wet bestuursrecht][ref1] van toepassing, zijn de
      [artikelen 5:48 tot en met 5:51 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing en is
      [artikel 51 van het Wetboek van Strafrecht][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel51
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '51'
  - number: 2.10.2
    text: |-
      De Consumentenautoriteit kan een last onder dwangsom opleggen, die strekt tot verzekering van de medewerking die
      krachtens [artikel 5:20 van de Algemene wet bestuursrecht][ref1] kan worden gevorderd bij de uitoefening van de
      bevoegdheden van de toezichthouders, bedoeld in [artikel 2.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel2
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0020586
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.15.1
    text: |-
      De in [artikel 2.9][ref1] bedoelde bestuurlijke boete bedraagt ten hoogste het bedrag van de vijfde categorie
      geldboete, bedoeld in [artikel 23 van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 2.15.2
    text: |-
      In afwijking van het eerste lid bedraagt de bestuurlijke boete, indien het betreft een overtreding van
      [artikel 8.8][ref1], ten hoogste € 450 000.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel8
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.15
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '8'
        hoofdstuk: '8'
  - number: 2.23.1
    text: |-
      De Consumentenautoriteit kan een beschikking openbaar maken omtrent het opleggen van een last onder dwangsom of
      bestuurlijke boete, met inbegrip van een beschikking dat geen last onder dwangsom of bestuurlijke boete wordt
      opgelegd of een toezegging door de overtreder dat een overtreding zal worden gestaakt.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.23
  - number: 2.23.2
    text: |-
      De Consumentenautoriteit maakt een voornemen tot openbaarmaking van een beschikking als bedoeld in het eerste
      lid te voren bekend aan de overtreder; indien het een voornemen tot het opleggen van een last onder dwangsom dan
      wel een bestuurlijke boete betreft geschiedt dit gelijktijdig met het in de gelegenheid stellen van de overtreder
      daarover zijn zienswijze naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.23
  - number: 2.23.3
    text: |-
      De Consumentenautoriteit maakt een beschikking als bedoeld in het eerste lid niet eigener beweging openbaar
      gedurende twee weken nadat het besluit op de in [artikel 3:41 van de Algemene wet bestuursrecht][ref1]
      voorgeschreven wijze bekend is gemaakt, tenzij de overtreder de beschikking zelf heeft openbaar gemaakt, heeft doen
      openbaar maken of openbaarmaking met de overtreder is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '2.24'
    text: |-
      Gegevens die de Consumentenautoriteit verkrijgt van andere bevoegde autoriteiten en andere overheidsinstanties als
      bedoeld in [hoofdstukken 3][ref1] en [4][ref2] van deze wet maakt de Consumentenautoriteit alleen openbaar met
      toestemming van de desbetreffende autoriteit of instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0020586
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0020586
        hoofdstuk: '4'
  - number: 3.1.1
    text: |-
      De Stichting Autoriteit Financiële Markten wordt aangewezen als bevoegde autoriteit voor intracommunautaire
      inbreuken op de wettelijke bepalingen, bedoeld in de onderdelen a en d van de bijlage bij deze wet, voor zover de
      intracommunautaire inbreuk betrekking heeft op een financiële dienst of activiteit.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.1
  - number: 3.1.2
    text: |-
      De Stichting Autoriteit Financiële Markten wordt voorts aangewezen als bevoegde autoriteit voor intracommunautaire
      inbreuken op de wettelijke bepalingen bedoeld in onderdeel c van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.1
  - number: 3.2.1
    text: |-
      De bij besluit van de Stichting Autoriteit Financiële Markten aangewezen personen zijn belast met het toezicht op
      de naleving van:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.2
  - number: 3.2.1.a
    text: |-
      de wettelijke bepalingen, bedoeld in de onderdelen a en c van de bijlage bij deze wet, voor welke zij als bevoegde
      autoriteit is aangewezen, en
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.2
  - number: 3.2.1.b
    text: de wettelijke bepalingen, bedoeld in onderdeel d van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.2
  - number: 3.2.2
    text: |-
      De [artikelen 2.4, tweede lid][ref1], en [2.10][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel2
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.2
    references:
