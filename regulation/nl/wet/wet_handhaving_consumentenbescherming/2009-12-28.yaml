    text: |-
      De Inspectie Verkeer en Waterstaat wordt aangewezen als bevoegde autoriteit voor intracommunautaire inbreuken op de
      wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.9
  - number: 3.10.1
    text: |-
      Met het toezicht op de naleving van de wettelijke bepalingen, bedoeld in onderdeel g van de bijlage bij deze wet,
      zijn belast de bij besluit van Onze Minister van Verkeer en Waterstaat aangewezen ambtenaren. Van dat besluit wordt
      mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.10
  - number: 3.10.2
    text: |-
