    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.1
  - number: 4.1.1.c
    text: de raad van bestuur van de Nederlandse Mededingingsautoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.1
  - number: 4.1.1.d
    text: de Belastingdienst/FIOD-ECD.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.1
  - number: 4.1.2
    text: Bij algemene maatregel van bestuur kunnen andere overheidsinstanties worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.1
  - number: 4.2.1
    text: |-
      Indien zowel de Consumentenautoriteit als een andere overheidsinstantie bevoegd zijn toezicht uit te oefenen of
      handhavingsmaatregelen te nemen ten aanzien van dezelfde gedraging, maakt de Consumentenautoriteit geen gebruik van
      de aan haar in deze wet toegekende bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.2
  - number: 4.2.2
    text: |-
      In afwijking van het vorige lid kan de Consumentenautoriteit gebruik maken van de aan haar in deze wet toegekende
      bevoegdheden indien:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.2
  - number: 4.2.2.a
    text: de andere overheidsinstantie de Consumentenautoriteit daaromtrent verzoekt; of
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.2
  - number: 4.2.2.b
    text: |-
      de andere overheidsinstantie niet aan de verplichting uit [artikel 4.5, tweede lid][ref1], kan voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.1
    text: |-
      Voor zover door een andere overheidsinstantie bij de uitoefening van haar bevoegdheden begrippen worden uitgelegd,
      die worden gehanteerd in een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage van deze
      wet, dan wordt deze uitleg afgestemd met de Consumentenautoriteit. In de samenwerkingsprotocollen, bedoeld in
      [artikel 5.1][ref1], worden hierover nadere afspraken gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel5
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '5'
        hoofdstuk: '5'
  - number: 4.3.2
    text: |-
      Voor zover door een andere overheidsinstantie bij de uitoefening van haar bevoegdheden begrippen worden uitgelegd,
      die worden gehanteerd in een van de wettelijke bepalingen, bedoeld in onderdeel b van de bijlage van deze wet, dan
      vindt deze uitleg plaats in overeenstemming met de Consumentenautoriteit. In de samenwerkingsprotocollen, bedoeld
      in [artikel 5.1][ref1], worden hierover nadere afspraken gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel5
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '5'
        hoofdstuk: '5'
  - number: '4.4'
    text: |-
      Indien een andere overheidsinstantie toezichts- of handhavingsmaatregelen neemt ten aanzien van een gedraging,
      die eveneens een intracommunautaire inbreuk op kan leveren, stelt zij de Consumentenautoriteit als het
      verbindingsbureau hiervan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.4
  - number: 4.5.1
    text: |-
      Indien de Consumentenautoriteit een verzoek om wederzijdse bijstand als bedoeld in [verordening 2006/2004]
      (32004R2006) krijgt ten aanzien van een gedraging waarvan ook een andere overheidsinstantie bevoegd is, verwijst de
      Consumentenautoriteit het verzoek door naar de desbetreffende overheidsinstantie.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.5
  - number: 4.5.2
    text: |-
      Indien de Consumentenautoriteit een verzoek om wederzijdse bijstand aan een andere overheidsinstantie doorverwijst,
      is de andere overheidsinstantie verplicht om toezicht uit te oefenen of handhavingsmaatregelen te nemen ten aanzien
      van de betrokken gedraging, tenzij sprake is van een van de uitzonderingsgronden als bedoeld in artikel 15 van
      [verordening 2006/2004](32004R2006). Alle gegevens omtrent genomen toezichts- en handhavingsmaatregelen worden aan
      de Consumentenautoriteit als het verbindingsbureau bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel4.5
  - number: 5.1.1
    text: 'Onze Minister kan afspraken maken met:'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.1.a
    text: Onze Minister van Financiën, voor wat betreft de Belastingdienst/FIOD-ECD;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.1.b
    text: Onze Minister van Verkeer en Waterstaat, voor wat betreft de Inspectie Verkeer en Waterstaat;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.1.c
    text: Onze Minister van Landbouw, Natuur en Voedselkwaliteit, voor wat betreft de Voedsel en Waren Autoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.1.d
    text: Onze Minister van Volksgezondheid, Welzijn en Sport, voor wat betreft het Staatstoezicht op de Volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.1.e
    text: andere in aanmerking komende Ministers.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2
    text: 'Onze Minister kan afspraken maken met het bevoegde gezag van:'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.a
    text: de Stichting Autoriteit Financiële Markten;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.b
    text: de Nederlandse Mededingingsautoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.c
    text: het Commissariaat voor de Media;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.d
    text: de Nederlandse Zorgautoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.e
    text: de Onafhankelijke Post en Telecommunicatie Autoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.f
    text: het College van Procureurs-Generaal;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.g
    text: de Stichting Het Juridisch Loket;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.2.h
    text: andere overheidsinstellingen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.3
    text: |-
      De afspraken bedoeld in het eerste lid en het tweede lid, onderdelen b tot en met h, worden vastgelegd in
      samenwerkingsprotocollen en hebben onder meer betrekking op:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.3.a
    text: effectief en doelmatig toezicht op en optreden tegen inbreuken;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.3.b
    text: consumentenvoorlichting;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.3.c
    text: |-
      de gemeenschappelijke activiteiten en verslaglegging, bedoeld in de artikelen 16, 17 en 21 van [verordening
      2006/2004](32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.4
    text: |-
      De afspraken bedoeld in het tweede lid, onderdeel a, worden vastgelegd in een samenwerkingsprotocol en hebben
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.4.a
    text: |-
      de uitleg van begrippen als bedoeld in [artikel 4.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel4
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '4'
        hoofdstuk: '4'
  - number: 5.1.4.b
    text: |-
      de samenwerking tussen de Stichting Autoriteit Financiële Markten en de Consumentenautoriteit in de uitoefening van
      haar taak als het verbindingsbureau.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 5.1.5
    text: Onze Minister doet mededeling van de samenwerkingsprotocollen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel5.1
  - number: 6.1.1
    text: |-
      Onze Minister kan afspraken maken met consumentenorganisaties. De afspraken kunnen onder meer betrekking hebben
      op het doorverwijzen van consumenten voor wat betreft informatievoorziening, de behandeling van klachten en
      geschillenbeslechting.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.1
  - number: 6.1.2
    text: |-
      Onze Minister kan afspraken maken met stichtingen of verenigingen met volledige rechtsbevoegdheid die krachtens hun
      statuten tot taak hebben de behandeling van klachten van consumenten en geschillenbeslechting. De afspraken kunnen
      onder meer betrekking hebben op de behandeling van klachten en geschillenbeslechting.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.1
  - number: 6.1.3
    text: |-
      Afspraken zoals bedoeld in het eerste en tweede lid worden vastgelegd in samenwerkingsprotocollen. Onze Minister
      doet mededeling van de samenwerkingsprotocollen in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.1
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen instanties worden aangewezen die een rechtmatig belang hebben bij
      de beëindiging van of het verbieden van intracommunautaire inbreuken als bedoeld in artikel 4, tweede lid, van
      [verordening 2006/2004](32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.2
  - number: 6.3.1
    text: |-
      De Consumentenautoriteit organiseert een maatschappelijk overleg met consumentenorganisaties en centrale
      ondernemersverenigingen.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.3
  - number: 6.3.2
    text: 'Doelstelling van het maatschappelijk overleg is:'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.3
  - number: 6.3.2.a
    text: |-
      de taken van de Consumentenautoriteit ter uitvoering van deze wet zo goed mogelijk aan te laten sluiten bij private
      initiatieven ter bescherming van de consument;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.3
  - number: 6.3.2.b
    text: |-
      Onze Minister, de bevoegde autoriteiten en andere overheidsinstanties te informeren over de effecten en de
      doeltreffendheid van de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.3
  - number: 6.3.3
    text: |-
      De Consumentenautoriteit nodigt ten minste elk kwartaal consumentenorganisaties en centrale ondernemersverenigingen
      uit voor het maatschappelijk overleg. Ook kunnen stichtingen of verenigingen met volledige rechtsbevoegdheid die
      krachtens hun statuten tot taak hebben de behandeling van klachten van consumenten en geschillenbeslechting als
      bedoeld in [artikel 6.1][ref1] en aangewezen instanties die een rechtmatig belang hebben bij de beëindiging van
      overtredingen als bedoeld in [artikel 6.2][ref2] voor het maatschappelijk overleg worden uitgenodigd.


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel6
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '6'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0020586
        artikel: '6'
        hoofdstuk: '6'
  - number: 6.3.4
    text: |-
      Andere bevoegde autoriteiten en andere overheidsinstanties kunnen toehoorders aanwijzen voor het maatschappelijk
      overleg.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.3
  - number: 6.3.5
    text: |-
      Bij regeling van Onze Minister kunnen nadere regels worden gesteld over deelname aan het maatschappelijk overleg
      en de werkwijze en verslaglegging van het maatschappelijk overleg en over de vergoeding van reis- en onkosten van
      deelnemers aan het maatschappelijk overleg.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel6.3
  - number: 7.1.1
    text: |-
      Indien beroep wordt ingesteld tegen een besluit op grond van deze wet is, in afwijking van
      [artikel 8:1 van de Algemene wet bestuurswet][ref1], de rechtbank te Rotterdam uitsluitend bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 7.1.2
    text: |-
      Tegen een uitspraak in hoger beroep van het College van Beroep voor het bedrijfsleven kan de procureur-generaal
      bij de Hoge Raad der Nederlanden beroep in cassatie in het belang der wet instellen wegens schending of verkeerde
      toepassing van [artikel 8.8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020586#Artikel8
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0020586
        artikel: '8'
        hoofdstuk: '8'
  - number: '7.2'
    text: Consumentenorganisaties worden aangemerkt als belanghebbenden bij besluiten krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel7.2
  - number: 8.1.1
    text: De in dit hoofdstuk neergelegde bepalingen gelden uitsluitend indien de wederpartij een consument is.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.1
  - number: 8.1.2
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.1
  - number: 8.1.2.a
    text: 'consument: een natuurlijk persoon die niet handelt in de uitoefening van zijn beroep of bedrijf;'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.1
  - number: 8.1.2.b
    text: |-
      handelaar: natuurlijk persoon of rechtspersoon die handelt in de uitoefening van een beroep of bedrijf of degene
      die ten behoeve van hem handelt;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.1
  - number: 8.1.2.c
    text: |-
      algemene voorwaarden: een of meer bedingen die zijn opgesteld teneinde in een aantal overeenkomsten te worden
      opgenomen, met uitzondering van bedingen die de kern van de prestaties aangeven, voor zover die bedingen duidelijk
      en begrijpelijk zijn geformuleerd.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.1
  - number: 8.2.1
    text: |-
      Degene die een dienst van de informatiemaatschappij verleent als bedoeld in
      [artikel 15d, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], neemt
      [artikel 15d, eerste en tweede lid, van Boek 3 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15d
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15d
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15d
  - number: 8.2.2
    text: |-
      Indien commerciële communicatie als bedoeld in
      [artikel 15e, derde lid, van Boek 3 van het Burgerlijk Wetboek][ref1], deel uitmaakt van een dienst van de
      informatiemaatschappij of een dergelijke dienst vormt, zorgt degene in wiens opdracht de commerciële communicatie
      geschiedt, dat [artikel 15e, eerste lid, van Boek 3 van het Burgerlijk Wetboek][ref2] in acht wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel15e
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 15e
      - id: ref2
        bwb_id: BWBR0005291
        artikel: 15e
  - number: 8.2.3
    text: |-
      De dienstverlener, bedoeld in het eerste lid, neemt de [artikelen 227b, eerste en tweede lid][ref1], en
      [227c, eerste lid, van Boek 6 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227b
      [ref2]: https://wetten.overheid.nl/BWBR0005289#Artikel227c
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227b
      - id: ref2
        bwb_id: BWBR0005289
        artikel: 227c
  - number: 8.2.4
    text: |-
      Indien een wederpartij langs de elektronische weg een verklaring als bedoeld in
      [artikel 227c, tweede lid, van het Burgerlijk Wetboek][ref1] uitbrengt die door de in het eerste lid bedoelde
      dienstverlener mag worden opgevat hetzij als een aanvaarding van een door hem langs de elektronische weg gedaan
      aanbod, hetzij als een aanbod naar aanleiding van een door hem langs de elektronische weg gedane uitnodiging om in
      onderhandeling te treden, bevestigt de dienstverlener de ontvangst van deze verklaring zo spoedig mogelijk langs
      elektronische weg aan de wederpartij.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel227c
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: 227c
  - number: 8.2.5
    text: |-
      Het derde en vierde lid zijn niet van toepassing, indien een overeenkomst uitsluitend door middel van de
      uitwisseling van elektronische post of een soortgelijke vorm van individuele communicatie tot stand komt.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.2
  - number: '8.3'
    text: |-
      Degene die algemene voorwaarden gebruikt in een overeenkomst met een consument, bindt die consument niet aan een
      beding als bedoeld in [artikel 236 van Boek 6 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel236
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.3
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '236'
  - number: '8.4'
    text: |-
      Bij een consumentenkoop als bedoeld in [artikel 5, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1], neemt
      de verkoper [artikel 6a, tweede en derde lid, van Boek 7 van het Burgerlijk Wetboek][ref2] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel6a
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 6a
  - number: 8.5.1
    text: |-
      De toezending van een niet bestelde zaak of het verrichten van een niet opgedragen dienst met het verzoek tot
      betaling van een prijs, bedoeld in [artikel 7, tweede en vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1],
      is niet toegestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel7
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '7'
  - number: 8.5.2
    text: |-
      De verkoper of dienstverlener neemt bij een koop op afstand als bedoeld in
      [artikel 46a, onder b, van Boek 7 van het Burgerlijk Wetboek][ref1] de [artikelen 46c][ref2] en
      [46h, eerste, tweede, vierde, vijfde en zevende lid, van Boek 7 van het Burgerlijk Wetboek][ref3] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel46c
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel46h
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46a
      - id: ref2
        bwb_id: BWBR0005290
        artikel: 46c
      - id: ref3
        bwb_id: BWBR0005290
        artikel: 46h
  - number: 8.5.3
    text: |-
      Een ieder die elektronische contactgegevens voor elektronische berichten heeft verkregen in het kader van de
      verkoop van een zaak mag deze gegevens slechts gebruiken voor het overbrengen van communicatie ter bevordering
      van de totstandkoming van een koop op afstand met betrekking tot eigen gelijksoortige zaken, indien daarbij
      [artikel 46h, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] in acht wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46h
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46h
  - number: 8.5.4
    text: |-
      Degene die ongevraagd communicatie overbrengt of mededelingen doet ter bevordering van de totstandkoming van een
      koop op afstand, neemt [artikel 46h, zesde en zevende lid, van Boek 7 van het Burgerlijk Wetboek][ref1] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46h
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46h
  - number: 8.5.5
    text: |-
      Op het bepaalde in het tweede tot en met het vierde lid, is
      [artikel 46i van Boek 7 van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel46i
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.5
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 46i
  - number: 8.6.1
    text: |-
      Een verkoper die handelt in de uitoefening van een beroep of bedrijf en die een koop aangaat als bedoeld in
      [artikel 48a, onder a, van Boek 7 van het Burgerlijk Wetboek][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48a
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48a
  - number: 8.6.1.a
    text: draagt er zorg voor dat de koop schriftelijk wordt aangegaan;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.6
  - number: 8.6.1.b
    text: |-
      draagt er zorg voor dat de koopakte voldoet aan de bij of krachtens
      [48b van Boek 7 van het Burgerlijk Wetboek][ref1] gestelde eisen, en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
  - number: 8.6.1.c
    text: |-
      neemt [artikel 48b, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48b
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48b
  - number: 8.6.2
    text: |-
      Een verkoper als bedoeld in het eerste lid, neemt [artikel 48f van Boek 7 van het Burgerlijk Wetboek][ref1] in
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel48f
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: 48f
  - number: '8.7'
    text: |-
      Een reisorganisator als bedoeld in [artikel 500 van Boek 7 van het Burgerlijk Wetboek][ref1] neemt de bij of
      krachtens de [artikelen 501][ref2] en [502 van Boek 7 van het Burgerlijk Wetboek][ref3] gestelde eisen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel500
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel501
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel502
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.7
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '500'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '501'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '502'
  - number: '8.8'
    text: |-
      Een handelaar neemt de bepalingen van [afdeling 3A van Titel 3 van Boek 6 van het Burgerlijk Wetboek][ref1] in
      acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling3A
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.8
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: 3A
  - number: '8.9'
    text: |-
      De dienstverrichter die diensten verricht als bedoeld in richtlijn 2006/123/EG van het Europees Parlement en de
      Raad van de Europese Unie van 12 december 2006 betreffende diensten op de interne markt (PbEU L 376), neemt de
      bepalingen van [Afdeling 2a van titel 5 van Boek 6 van het Burgerlijk Wetboek][ref1] in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Afdeling2a
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel8.9
    references:
      - id: ref1
        bwb_id: BWBR0005289
        afdeling: 2a
  - number: '9.9'
    text: |-
      Zolang het bij koninklijke boodschap van 8 december 2003 ingediende voorstel van wet tot vaststelling van een
      nieuwe Geneesmiddelenwet, Kamerstukken II, nr. 29 359, nog niet tot wet is verheven en in werking is getreden,
      zijn de krachtens [artikel 22 van de Wet op de geneesmiddelenvoorziening][ref1] aangewezen ambtenaren van het
      Staatstoezicht op de volksgezondheid belast met het toezicht, bedoeld in [artikel 3.6, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002290#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0020586#Artikel3
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0002290
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0020586
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Onze Minister brengt jaarlijks vóór 1 juni verslag uit over de werkzaamheden van de Consumentenautoriteit in het
      afgelopen jaar en brengt dit verslag ter kennis van de beide Kamers van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.1
  - number: 10.2.1
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van de wet en vervolgens na iedere vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.2
  - number: 10.2.1.a
    text: het functioneren van de Consumentenautoriteit;
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.2
  - number: 10.2.1.b
    text: |-
      de samenwerking en coördinatie tussen de bevoegde autoriteiten en andere overheidsinstanties, voor zover deze
      betrekking hebben op de handhaving van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze
      wet.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.2
  - number: 10.2.2
    text: |-
      Het verslag, bedoeld in het eerste lid, omvat mede een rapportage betreffende de bestuurlijke vormgeving van de
      Consumentenautoriteit.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.2
  - number: 10.3.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter uitvoering van overeenkomsten als
      bedoeld in artikel 18 van [verordening 2006/2004](32004R2006).
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.3
  - number: 10.3.2
    text: |-
      Bij de regels, bedoeld in het eerste lid, kunnen taken worden opgedragen en bevoegdheden worden verleend aan een
      krachtens deze wet aangewezen bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.3
  - number: '10.5'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.5
  - number: '10.6'
    text: 'Deze wet wordt aangehaald als: Wet handhaving consumentenbescherming.'
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel10.6
