        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 3.3.1
    text: |-
      De Stichting Autoriteit Financiële Markten kan een verzoekschrift als bedoeld in
      [artikel 305d van Boek 3 van het Burgerlijk Wetboek][ref1] indienen indien naar haar oordeel sprake is van een
      intracommunautaire inbreuk op een van de wettelijke bepalingen, bedoeld in onderdeel a van de bijlage bij deze wet,
      en de intracommunautaire inbreuk betrekking heeft op een financiële dienst of activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305d
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.3
    references:
