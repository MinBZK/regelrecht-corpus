  - number: 3.4.1
    text: |-
      De Stichting Autoriteit Financiële Markten kan, indien zij van oordeel is dat een intracommunautaire inbreuk op een
      van de wettelijke bepalingen, bedoeld in onderdeel c, sub c.1, van de bijlage bij deze wet, heeft plaatsgevonden:
    url: https://wetten.overheid.nl/BWBR0020586/2009-12-28#Artikel3.4
