    text: |-
      Toezending van een verslag als bedoeld in [artikel 3, vijfde lid, van de Wet op de waterkering][ref1], zoals dit
      artikellid luidt na inwerkingtreding van deze wet, geschiedt voor het eerst binnen drie jaar na inwerkingtreding
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007801#Artikel3
