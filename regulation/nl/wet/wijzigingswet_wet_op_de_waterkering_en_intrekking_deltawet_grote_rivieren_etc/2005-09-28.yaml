    text: |-
      [Artikel 12, eerste lid, van de Wet op de waterkering][ref1], zoals dit luidde voor de inwerkingtreding van deze
      wet, blijft van toepassing met betrekking tot besluiten ten aanzien van bijdragen in de kosten van het uitvoeren
      van nieuwe of versterkingswerken om daarmee voor de eerste maal te voldoen aan de veiligheidsnorm bedoeld in
      [artikel 3, eerste lid, van de Wet op de waterkering][ref2].


