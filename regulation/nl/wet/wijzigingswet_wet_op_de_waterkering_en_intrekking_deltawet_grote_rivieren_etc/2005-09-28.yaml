preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet op de waterkering te wijzigen in verband
    met de ervaringen die zijn opgedaan bij de toepassing ervan, en om op een aantal punten in de wet aanvullende
    voorzieningen te treffen, alsmede een aantal wetten in te trekken die nagenoeg zijn uitgewerkt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018263/2005-09-28#ArtikelAanhef
articles:
