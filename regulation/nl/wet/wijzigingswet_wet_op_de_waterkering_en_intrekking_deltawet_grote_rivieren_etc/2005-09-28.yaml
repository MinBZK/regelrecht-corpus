    text: |-
      De [artikelen 17 tot en met 31 van de Wet op de waterkering][ref1], zoals deze luidden voor de inwerkingtreding van
      deze wet, blijven van toepassing met betrekking tot plannen en daarmee verband houdende besluiten ten aanzien van
      primaire waterkeringen als bedoeld in [artikel 17][ref2].


