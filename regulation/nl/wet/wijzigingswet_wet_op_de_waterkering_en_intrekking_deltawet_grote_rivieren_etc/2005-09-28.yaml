  - number: XIV
    text: |-
      Ten aanzien van de verdere behandeling van beroepszaken op grond van de [Deltaschadewet][ref1] die op de datum van
      de inwerkingtreding van deze wet aanhangig zijn, alsmede ten aanzien van daaruit voortvloeiende besluiten, blijven
      de bepalingen van de [Deltaschadewet][ref2] van toepassing.


