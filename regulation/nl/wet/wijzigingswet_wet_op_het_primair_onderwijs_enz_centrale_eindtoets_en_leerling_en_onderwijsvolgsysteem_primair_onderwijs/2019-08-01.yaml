preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is te komen tot een verplichte centrale eindtoets in het
    basisonderwijs en in het speciaal onderwijs en de voortgang van alle leerlingen en het onderwijs aan basisscholen
    en scholen voor speciaal basisonderwijs en scholen voor speciaal onderwijs, scholen voor voortgezet speciaal
    onderwijs en scholen voor speciaal en voortgezet speciaal onderwijs te volgen door middel van een verplicht gebruik
    van een leerling- en onderwijsvolgsysteem en dat het wenselijk is een minimum opbrengsteis inzake de kwaliteit
    van het onderwijs ook in te voeren voor speciale scholen voor basisonderwijs en scholen voor speciaal onderwijs en
    speciaal en voortgezet speciaal onderwijs;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034687/2019-08-01#ArtikelAanhef
