        bwb_id: BWBR0024705
        artikel: 58nb
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58nc
  - number: 6.19.2
    text: |-
      Het aantal dagen, bedoeld in [artikel 58nb, derde lid, van de wet][ref1], bedraagt vijf dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
  - number: 6.19.3
    text: |-
      Een testuitslag als bedoeld in [artikel 58nb, derde lid, van de wet][ref1], bevat:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nb
  - number: 6.19.3.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
  - number: 6.19.3.b
    text: de uitslag van een NAAT-test of een antigeentest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
  - number: 6.19.3.c
    text: de conclusie dat de geteste persoon op dat moment niet is besmet met het virus SARS-CoV-2.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
  - number: 6.19.4
    text: |-
      Onder een testuitslag als bedoeld in het derde lid wordt mede verstaan een certificaat als bedoeld in artikel
      3, eerste lid, onder b, van verordening (EU) 2021/953 van het Europees parlement en de Raad van 14 juni 2021
      betreffende een kader voor de afgifte, verificatie en aanvaarding van interoperabele COVID-19-vaccinatie-, test-
      en herstelcertificaten (digitaal EU-COVID-certificaat) teneinde het vrije verkeer tijdens de COVID-19-pandemie te
      vergemakkelijken (PbEU 2021, L 211) dat een negatief resultaat bevat.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
  - number: 6.19.5
    text: |-
      Het aantal uren, bedoeld in [artikel 58nc, eerste lid, onder a en b, van de wet][ref1], bedraagt twaalf uren.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nc
  - number: 6.19.6
    text: |-
      De personen, bedoeld in [artikel 58nc, derde lid, van de wet][ref1], ingeval zij komen vanuit een zeer
      hoogrisicogebied, zijn personen die reizen in verband met het verrichten van noodzakelijke werkzaamheden op het
      gebied van zoek- en reddingsacties of nautische dienstverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nc
  - number: 6.20.1
    text: |-
      Een persoon die het Europese deel van Nederland inreist en voor inreis heeft verbleven in een door de Minister van
      Volksgezondheid, Welzijn en Sport aangewezen zeer hoogrisicogebied, vult een papieren of digitale verklaring naar
      waarheid in, waarin hij verklaart dat hij:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.1.a
    text: |-
      onverwijld in thuisquarantaine zal gaan op zijn woonadres of het in de verklaring opgegeven adres van een
      verblijfplaats; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.1.b
    text: |-
      behoort tot een van de categorieën van de personen, bedoeld in [artikel 58nc van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nc
  - number: 6.20.2
    text: |-
      Ingeval een persoon verklaart in thuisquarantaine te gaan, bevat de verklaring, bedoeld in het eerste lid, in ieder
      geval de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.2.a
    text: de naam, geboortedatum en de contactgegevens van de persoon, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.2.b
    text: |-
      een vermelding van de verblijfplaats, waar de persoon, bedoeld in het eerste lid, heeft verbleven voorafgaand aan
      inreis;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.2.c
    text: de datum van inreis;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.2.d
    text: het adres, waar de persoon, bedoeld in het eerste lid, in thuisquarantaine zal gaan;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.2.e
    text: |-
      het woonadres van de persoon, bedoeld in het eerste lid, indien het adres van de thuisquarantaine, bedoeld onder d,
      niet het woonadres betreft.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.3
    text: |-
      Ingeval een persoon verklaart te behoren tot een van de categorieën van de personen, bedoeld in
      [artikel 58nc van de wet][ref1], bevat de verklaring, bedoeld in het eerste lid, in ieder geval de volgende
      gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nc
  - number: 6.20.3.a
    text: de naam van de persoon, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.3.b
    text: |-
      de verklaring tot welke categorie van personen, bedoeld in [artikel 58nc van de wet][ref1], de persoon, bedoeld in
      het eerste lid, behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58nc
  - number: 6.20.4
    text: |-
      Een persoon als bedoeld in het eerste lid beschikt bij aankomst of inreis over een papieren verklaring of
      een bevestiging van een digitaal ingevulde verklaring als bedoeld in het eerste lid, alsmede, voor zover van
      toepassing, het in [artikel 6.21, eerste lid][ref1], voorgeschreven document.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
    references:
