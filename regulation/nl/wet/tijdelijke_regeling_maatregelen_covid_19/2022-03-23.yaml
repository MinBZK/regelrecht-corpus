  - number: 6.7g.3
    text: |-
      Onder een bewijs van voltooide vaccinatie als bedoeld in [artikel 6.7e, eerste lid][ref1], wordt mede verstaan een
      certificaat als bedoeld in artikel 3, eerste lid, onder a, van verordening (EU) 2021/953 van het Europees parlement
      en de Raad van 14 juni 2021 betreffende een kader voor de afgifte, verificatie en aanvaarding van interoperabele
      COVID-19-vaccinatie-, test- en herstelcertificaten (digitaal EU-COVID-certificaat) teneinde het vrije verkeer
      tijdens de COVID-19-pandemie te vergemakkelijken (PbEU 2021, L 211).


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7g
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.7g.4
    text: |-
      Indien een certificaat als bedoeld in het tweede lid wordt gebruikt voor toepassing van
      [artikel 6.7a, vierde lid][ref1], [6.7b, vijfde lid][ref2], [6.7c, vijfde lid][ref3], of [6.7d, achtste lid][ref4],
      zijn onderdeel b en, voor zover die de verklaring van een arts betreft, onderdeel c van het desbetreffende lid niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7g
    references:
