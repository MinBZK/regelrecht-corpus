  - number: 6.7g.5
    text: |-
      Op de certificaten, bedoeld in het eerste tot en met derde lid, zijn de
      [artikelen 6.7a, tweede en vijfde lid][ref1], [6.7b, tweede en zesde lid][ref2], [6.7c, derde en zesde lid][ref3],
      [6.7d, derde en negende lid][ref4], [6.7e, derde lid][ref5], en [6.7f, tweede lid][ref6], niet van toepassing.


