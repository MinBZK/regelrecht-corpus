  - number: '1.2'
    text: Deze regeling is van toepassing in het Europese deel van Nederland.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel1.2
  - number: 4.5.1
    text: |-
      Een publieke plaats die een horecalokaliteit is als bedoeld in [artikel 1, eerste lid, van de Alcoholwet][ref1]
      wordt slechts voor publiek opengesteld indien die is voorzien van een rechtstreeks met de buitenlucht in verbinding
      staande goed werkende mechanische ventilatie-inrichting met een luchtverversingscapaciteit van 3,8•10-3 m3/s per
      m2 vloeroppervlakte.


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '1'
  - number: 4.5.2
    text: |-
      Indien sprake is van een horecalokaliteit die gevestigd is in een rijksmonument als bedoeld in
      [artikel 1.1 van de Erfgoedwet][ref1] geldt het eerste lid niet, mits de luchtverversing op een andere wijze
      dan voorzien in het eerste lid wordt gerealiseerd en dit leidt tot een luchtkwaliteit in de horecalokaliteit die
      vergelijkbaar is met de luchtkwaliteit die zou worden gerealiseerd door middel van de in het eerste lid bedoelde
      mechanische ventilatie-inrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037521#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0037521
        artikel: '1'
  - number: 4.5.3
    text: |-
      Het eerste lid is niet van toepassing op een horecalokaliteit ten behoeve waarvan voor 14 augustus 2021 een
      vergunning voor de uitoefening van het horecabedrijf op grond van [artikel 3 van de Alcoholwet][ref1] is
      aangevraagd, die niet voor 1 juli 2021 is verleend, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0002458#Artikel3
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0002458
        artikel: '3'
  - number: 4.5.3.a
    text: zich in die horecalokaliteit op 14 augustus 2021 een ventilatie-inrichting bevindt als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel4.5
  - number: 4.5.3.b
    text: |-
      in die horecalokaliteit een op of na 14 augustus 2021 aangeschafte of bestelde ventilatie-inrichting wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel4.5
  - number: 6.6.1
    text: |-
      Personen van dertien jaar en ouder dragen een mondkapje in gebouwen op luchthavens vanaf de
      securitycheck, met uitzondering van de daar gelegen besloten plaatsen en in luchtvaartuigen als bedoeld in
      [artikel 1.1, eerste lid, van de Wet luchtvaart][ref1], mits het vervoer primair de verplaatsing van de ene naar de
      andere locatie behelst en het vervoer geen recreatieve activiteit is.


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '1'
  - number: 6.6.2
    text: 'Het eerste lid geldt niet voor:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
  - number: 6.6.2.a
    text: |-
      personen die het vervoer uitvoeren voor zover zij zich in een afgesloten ruimte bevinden ten opzichte van de
      passagiers;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
  - number: 6.6.2.b
    text: personen die vanwege een beperking of een ziekte geen mondkapje kunnen dragen;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
  - number: 6.6.2.c
    text: |-
      begeleiders van personen met een verstandelijke beperking, voor zover deze personen van het door begeleiders
      dragen van een mondkapje ernstig ontregeld raken, en voor personen die spreken met iemand die vanwege een auditieve
      beperking moet kunnen spraakafzien;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
  - number: 6.6.2.d
    text: personen in een luchtvaartuig, indien in het luchtvaartuig maximaal twee personen aanwezig zijn;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
  - number: 6.6.2.e
    text: |-
      personen aan wie krachtens een wettelijke bepaling gevraagd wordt hun mondkapje af te zetten om zich te
      identificeren met een document als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1], op het moment
      van identificatie;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 6.6.2.f
    text: |-
      personen waarbij het dragen van een mondkapje de goede en veilige uitoefening van hun werkzaamheden in het kader
      van beroep of bedrijf onmogelijk maakt.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.6
  - number: 6.7a.1
    text: |-
      De aanbieder van openbaar vervoer draagt er zorg voor dat alleen vervoer wordt aangeboden, toegang daartoe
      wordt verschaft en gebruik daarvan wordt toegestaan, indien een persoon, komend vanuit een door de Minister van
      Volksgezondheid, Welzijn en Sport aangewezen hoogrisicogebied of zeer hoogrisicogebied een op hem betrekking
      hebbende negatieve testuitslag van een NAAT-test die maximaal achtenveertig uur of, met uitzondering van reizigers
      komend vanuit een door de Minister van Volksgezondheid, Welzijn en Sport aangewezen zeer hoogrisicogebied, van
      een antigeentest die maximaal vierentwintig uur voor het moment van het aan boord gaan van een vervoermiddel is
      uitgevoerd kan tonen aan de aanbieder van het vervoer en aan een toezichthouder.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.2
    text: 'Een negatieve testuitslag bevat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.2.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.2.b
    text: de uitslag van een antigeentest of een NAAT-test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.2.c
    text: |-
      de in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans vermelde conclusie dat de geteste
      persoon op dat moment niet is besmet met het virus SARS-CoV-2;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.2.d
    text: de datum en het tijdstip van de afname van de test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.2.e
    text: een logo of kenmerk van een instituut of arts waar of door wie de test is afgenomen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.a
    text: reizigers met opstap en eindbestemming binnen Nederland;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.b
    text: reizigers in een trein anders dan een intercity;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.c
    text: reizigers in een bus die regionaal openbaar vervoer verricht;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.d
    text: personen tot en met elf jaar;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.e
    text: grenswerkers, grensstudenten en grensscholieren;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.f
    text: houders van een door het Ministerie van Buitenlandse Zaken verstrekte diplomatieke identiteitskaart;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.g
    text: |-
      personeelsleden van diplomatieke en consulaire vertegenwoordigingen of internationale organisaties in Nederland,
      en de leden van hun officiële huishouden, die als zodanig zijn of worden geregistreerd bij het Ministerie van
      Buitenlandse Zaken;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.h
    text: staatshoofden en leden van een buitenlandse regering;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.3.i
    text: |-
      personen werkzaam in het transport van goederen en ander transportpersoneel, voor zover noodzakelijk en op het
      moment dat zij in de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden reizen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.4
    text: |-
      Het eerste lid is niet van toepassing op reizigers die geïnfecteerd zijn geweest met het virus SARS-CoV-2, mits de
      reiziger kan tonen aan de aanbieder van het vervoer en aan de toezichthouder:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.4.a
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van minimaal elf en maximaal honderdtachtig
      dagen oud op het moment van aankomst in Nederland;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.4.b
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van maximaal achtenveertig uur oud of van een
      antigeentest van maximaal vierentwintig uur oud op het moment van het aan boord gaan; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.4.c
    text: |-
      een op hem betrekking hebbende negatieve uitslag van een antigeentest van maximaal vierentwintig uur oud op
      het moment van het aan boord gaan dan wel een op hem betrekking hebbende verklaring van een arts van maximaal
      achtenveertig uur oud op het moment van het aan boord gaan, waarin is vermeld dat hij niet meer besmettelijk is.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.5
    text: 'Een testuitslag als bedoeld in het vierde lid bevat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.5.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.5.b
    text: de in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans vermelde conclusie van de testuitslag;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7a.5.c
    text: een logo of kenmerk van een instituut of arts.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7a
  - number: 6.7b.1
    text: |-
      De aanbieder van ander bedrijfsmatig personenvervoer, voor zover sprake is van vervoer met luchtvaartuigen
      als bedoeld in [artikel 16 van de Luchtvaartwet][ref1] of het aanbieden van personenvervoer met of zonder een
      dienstregeling per veerboot of passagiersschip, draagt er, onverminderd [artikel 6.7c, eerste en tweede lid][ref2],
      zorg voor dat alleen vervoer wordt aangeboden, toegang daartoe wordt verschaft en gebruik daarvan wordt
      toegestaan, indien een persoon, komend vanuit een door de Minister van Volksgezondheid, Welzijn en Sport aangewezen
      hoogrisicogebied of zeer hoogrisicogebied een op hem betrekking hebbende negatieve testuitslag van een NAAT-
      test die maximaal achtenveertig uur of, met uitzondering van reizigers komend vanuit een door de Minister van
      Volksgezondheid, Welzijn en Sport aangewezen zeer hoogrisicogebied, van een antigeentest die maximaal vierentwintig
      uur voor het moment van het aan boord gaan van een vervoermiddel is uitgevoerd kan tonen aan de aanbieder van het
      vervoer en aan een toezichthouder.


