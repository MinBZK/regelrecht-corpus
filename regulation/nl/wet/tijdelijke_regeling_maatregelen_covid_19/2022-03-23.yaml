articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *ander bedrijfsmatig personenvervoer:* besloten busvervoer en taxivervoer
      als bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref1], alsmede bedrijfsmatig vervoer van personen op
      andere wijze dan met een bus of taxi, niet zijnde openbaar vervoer;
        - *beheerder:* degene die bevoegd is tot het aan een plaats treffen van voorzieningen of tot het toelaten van
      personen tot die plaats;
        - *geldig coronatoegangsbewijs:* coronatoegangsbewijs als bedoeld in de [artikelen 6.29][ref2] of [6.31e][ref3];
        - *hoogrisicogebied:* gebied ter zake waarvan de verplichting, bedoeld in de [artikelen 58p][ref4] of
      [58pa van de wet][ref5], geldt;
        - *luchthaven:* een luchthaven als bedoeld in
      [artikel 8.1, eerste lid, onder a, en derde lid, van de Wet luchtvaart][ref6] en de militaire luchthaven, bedoeld
      in artikel 8.1, eerste lid, onder c, van de Wet luchtvaart, in Eindhoven;
        - *mondkapje:* voorwerp dat op grond van zijn ontwerp bestemd is om te worden gedragen en in ieder geval de mond en
      de neusgaten volledig te bedekken teneinde de verspreiding van virussen en andere ziektekiemen tegen te gaan;
        - *openbaar vervoer:* openbaar vervoer als bedoeld in [artikel 1 van de Wet personenvervoer 2000][ref7];
        - *publiek:* personen die ergens aanwezig zijn, met uitzondering van de daar al dan niet tegen betaling werkzame
      personen;
        - *wet:* [Wet publieke gezondheid][ref8];
        - *zeer hoogrisicogebied:* gebied ter zake waarvan de verplichting, bedoeld in de [artikelen 58p][ref9],
      [58pa][ref10], [58nb][ref11] of [58nh van de wet][ref12], geldt.


