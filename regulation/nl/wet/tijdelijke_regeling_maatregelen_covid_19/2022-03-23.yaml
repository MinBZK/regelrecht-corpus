    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.i
    text: 'personen op een vlucht die Nederland niet als eindbestemming hebben:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.i.1
    text: die wegens onvoorziene omstandigheden naar een Nederlandse luchthaven moeten uitwijken; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.i.2
    text: die de luchthaven niet verlaten;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.j
    text: passagiers met een NATO Travel Order of een NATO-2-visum;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.k
    text: |-
      personen die reizen en geen negatieve testuitslag kunnen tonen in verband met urgent transport van
      lichaamsmaterialen ten behoeve van een medische behandeling;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.l
    text: |-
      personen die reizen en taken uitvoeren van nationaal belang in opdracht van de Minister of Staatssecretaris van
      Justitie en Veiligheid en de eventuele personen die door deze personen worden begeleid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.m
    text: |-
      personen die op grond van [Verordening (EU) nr. 604/2013](32013R0604) van het Europees Parlement en de Raad van
      26 juni 2013 tot vaststelling van de criteria en instrumenten om te bepalen welke lidstaat verantwoordelijk is voor
      de behandeling van een verzoek om internationale bescherming dat door een onderdaan van een derde land of staatloze
      bij een van de lidstaten wordt ingediend (PbEU 2013, L 180), door een andere lidstaat van de Europese Unie aan de
      Nederlandse Staat worden overgedragen, met inachtneming van de tussen de Nederlandse Staat en de andere lidstaat
      van de Europese Unie hierover gemaakte bilaterale afspraken, en de personen die deze personen begeleiden;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.3.n
    text: |-
      personen met rechtmatig verblijf in Nederland ten aanzien van wie de Nederlandse Staat gehouden is om hen na
      overbrenging vanuit een andere lidstaat van de Europese Unie toegang te verlenen, met inachtneming van de tussen de
      Nederlandse Staat en de andere lidstaat van de Europese Unie hierover gemaakte bilaterale afspraken, en de personen
      die deze personen begeleiden.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.4
    text: |-
      Indien het vervoer van een persoon buiten diens schuld om vertraagd is, wordt de termijn van de test, als bedoeld
      in het eerste lid verlengd met vierentwintig uur.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.5
    text: |-
      Het eerste lid is niet van toepassing op reizigers die geïnfecteerd zijn geweest met het virus SARS-CoV-2, mits de
      reiziger kan tonen aan de aanbieder van het vervoer en aan de toezichthouder:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.5.a
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van minimaal elf en maximaal honderdtachtig
      dagen oud op het moment van aankomst in Nederland;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.5.b
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van maximaal achtenveertig uur oud of van een
      antigeentest van maximaal vierentwintig uur oud op het moment van het aan boord gaan; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.5.c
    text: |-
      een op hem betrekking hebbende negatieve uitslag van een antigeentest van maximaal vierentwintig uur oud op
      het moment van het aan boord gaan dan wel een op hem betrekking hebbende verklaring van een arts van maximaal
      achtenveertig uur oud op het moment van het aan boord gaan, waarin is vermeld dat hij niet meer besmettelijk is.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.6
    text: 'Een testuitslag als bedoeld in het vijfde lid bevat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.6.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.6.b
    text: de in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans vermelde conclusie van de testuitslag;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7b.6.c
    text: een logo of kenmerk van een instituut of arts.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7b
  - number: 6.7c.1
    text: |-
      De aanbieder van ander bedrijfsmatig personenvervoer, voor zover sprake is van vervoer met een luchtvaartuig als
      bedoeld in [artikel 16 van de Luchtvaartwet][ref1], draagt er, onverminderd [artikel 6.7b, eerste lid][ref2], zorg
      voor dat alleen vervoer wordt aangeboden, toegang daartoe wordt verschaft en gebruik daarvan wordt toegestaan,
      indien een persoon, komend vanuit een door de Minister van Volksgezondheid, Welzijn en Sport aangewezen zeer
      hoogrisicogebied, een op hem betrekking hebbende negatieve testuitslag van een antigeentest of een NAAT-test die
      maximaal vierentwintig uur voor het moment van het aan boord gaan van het luchtvaartuig is uitgevoerd kan tonen aan
      de aanbieder van het vervoer en aan een toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.7c.2
    text: |-
      De aanbieder van ander bedrijfsmatig personenvervoer, voor zover sprake is van het aanbieden van personenvervoer
      met of zonder een dienstregeling per veerboot, passagiersschip, of vrachtschip dat maximaal twaalf passagiers
      vervoert, draagt er, onverminderd [artikel 6.7b, eerste lid][ref1], zorg voor dat alleen vervoer wordt aangeboden,
      toegang daartoe wordt verschaft en gebruik daarvan wordt toegestaan, indien een persoon, komend vanuit een door
      de Minister van Volksgezondheid, Welzijn en Sport aangewezen zeer hoogrisicogebied, een op hem betrekking hebbende
      negatieve testuitslag van een antigeentest of een NAAT-test die maximaal vierentwintig uur voor het moment van het
      aan boord gaan van de veerboot, het passagiersschip, of het vrachtschip dat maximaal twaalf passagiers vervoert
      naar Nederland is uitgevoerd kan tonen aan de aanbieder van het vervoer en aan een toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.7c.3
    text: 'Een negatieve testuitslag bevat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.3.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.3.b
    text: de uitslag van een antigeentest of een NAAT-test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.3.c
    text: |-
      de in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans vermelde conclusie dat de geteste
      persoon op dat moment niet is besmet met het virus SARS-CoV-2;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.3.d
    text: de datum en het tijdstip van de afname van de test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.3.e
    text: een logo of kenmerk van een instituut of arts waar of door wie de test is afgenomen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4
    text: 'Het eerste en tweede lid zijn niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.a
    text: reizigers die gebruikmaken van regionaal grensoverschrijdend personenvervoer;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.b
    text: personen tot en met elf jaar;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.c
    text: grenswerkers, grensstudenten en grensscholieren;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.d
    text: houders van een door het Ministerie van Buitenlandse Zaken verstrekte diplomatieke identiteitskaart;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.e
    text: |-
      personeelsleden van diplomatieke en consulaire vertegenwoordigingen of internationale organisaties in Nederland,
      en de leden van hun officiële huishouden, die als zodanig zijn of worden geregistreerd bij het Ministerie van
      Buitenlandse Zaken;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.f
    text: staatshoofden en leden van een buitenlandse regering;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.g
    text: |-
      zeevarenden aan boord van een veerboot, passagiersschip, of vrachtschip dat maximaal twaalf passagiers vervoert,
      die de veerboot of het schip niet verlaten en geen reisbeweging van en naar die veerboot of dat schip maken;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.h
    text: |-
      personen op een vlucht of aan boord van een veerboot, passagiersschip, of vrachtschip dat maximaal twaalf
      passagiers vervoert, die Nederland niet als eindbestemming hebben:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.h.1°
    text: die wegens onvoorziene omstandigheden naar een Nederlandse luchthaven of haven moeten uitwijken; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.h.2°
    text: die de luchthaven of de haven niet verlaten;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.i
    text: passagiers met een NATO Travel Order of een NATO-2-visum;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.j
    text: 'de bemanning aan boord van een luchtvaartuig:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.j.1°
    text: die het luchtvaartuig niet verlaat en geen reisbeweging van en naar dat luchtvaartuig maakt; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.j.2°
    text: |-
      die wordt ingezet met toepassing van een door de Minister van Volksgezondheid, Welzijn en Sport goedgekeurd
      protocol van de aanbieder van het vervoer, waarmee naar zijn oordeel een beschermingsniveau wordt bereikt dat ten
      minste gelijkwaardig is aan het beschermingsniveau dat wordt bereikt met toepassing van het eerste lid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.j.3°
    text: |-
      Die een negatieve testuitslag van een NAAT-test die maximaal achtenveertig uur voor het moment van het aan boord
      gaan van het vervoermiddel is uitgevoerd kan tonen;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.k
    text: |-
      personen die reizen en geen negatieve testuitslag kunnen tonen in verband met urgent transport van
      lichaamsmaterialen ten behoeve van een medische behandeling;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.l
    text: |-
      personen die reizen en taken uitvoeren van nationaal belang in opdracht van de Minister of Staatssecretaris van
      Justitie en Veiligheid en de eventuele personen die door deze personen worden begeleid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.4.m
    text: |-
      personen werkzaam in het transport van goederen, voor zover noodzakelijk en op het moment dat zij in de uitoefening
      van hun functie reizen of als zij van of naar hun werkzaamheden reizen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.5
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op reizigers die geïnfecteerd zijn geweest met het virus SARS-
      CoV-2, mits de reiziger kan tonen aan de aanbieder van het vervoer en aan een toezichthouder:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.5.a
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van minimaal elf en maximaal honderdtachtig
      dagen oud op het moment van aankomst in Nederland;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.5.b
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van maximaal achtenveertig uur oud of van een
      antigeentest van maximaal vierentwintig uur oud op het moment van het aan boord gaan; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.5.c
    text: |-
      een op hem betrekking hebbende verklaring van een arts van maximaal achtenveertig uur oud op het moment van het aan
      boord gaan waarin staat dat hij niet meer besmettelijk is.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.6
    text: 'Een testuitslag of verklaring als bedoeld in het vijfde lid bevat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.6.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest of voor wie de verklaring is afgegeven;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.6.b
    text: |-
      de in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans vermelde conclusie van de testuitslag
      of verklaring;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7c.6.c
    text: een logo of kenmerk van een instituut of arts.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7c
  - number: 6.7d.1
    text: |-
      De persoon, komend vanuit een door de Minister van Volksgezondheid, Welzijn en Sport aangewezen
      hoogrisicogebied of zeer hoogrisicogebied, die gebruikmaakt van bedrijfsmatig personenvervoer als bedoeld
      in [artikel 58p van de wet][ref1], beschikt bij de toegang tot het vervoermiddel en tijdens het vervoer over
      een op hem betrekking hebbende negatieve testuitslag van een NAAT-test die maximaal achtenveertig uur of, met
      uitzondering van reizigers komend vanuit een door de Minister van Volksgezondheid, Welzijn en Sport aangewezen zeer
      hoogrisicogebied, van een antigeentest die maximaal vierentwintig uur voor het moment van het aan boord gaan van
      een vervoermiddel is uitgevoerd en toont die testuitslag op verzoek aan de aanbieder van dat personenvervoer en
      een toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58p
  - number: 6.7d.2
    text: |-
      De persoon, komend vanuit een door de Minister van Volksgezondheid, Welzijn en Sport aangewezen hoogrisicogebied
      of zeer hoogrisicogebied, die anders dan met gebruikmaking van bedrijfsmatig personenvervoer als bedoeld in
      [artikel 58p van de wet][ref1], Nederland inreist, beschikt bij inreis over een op hem betrekking hebbende
      negatieve testuitslag van een NAAT-test die maximaal achtenveertig uur of, met uitzondering van reizigers komend
      vanuit een door de Minister van Volksgezondheid, Welzijn en Sport aangewezen zeer hoogrisicogebied, van een
      antigeentest die maximaal vierentwintig uur voor het moment van het aan boord gaan van een vervoermiddel is
      uitgevoerd en toont die testuitslag op verzoek aan een toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58p
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58p
  - number: 6.7d.3
    text: 'Een negatieve testuitslag bevat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.3.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.3.b
    text: de uitslag van een antigeentest of een NAAT-test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.3.c
    text: |-
      de in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans vermelde conclusie dat de geteste
      persoon op dat moment niet is besmet met het virus SARS-CoV-2;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.3.d
    text: de datum en het tijdstip van de afname van de test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.3.e
    text: een logo of kenmerk van een instituut of arts waar of door wie de test is afgenomen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.4
    text: |-
      Ingeval van een persoon als bedoeld in [artikel 6.7c, eerste of tweede lid][ref1], dient hij tevens te beschikken
      over een negatieve testuitslag als bedoeld in het desbetreffende lid.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.7d.5
    text: |-
      De persoon, bedoeld in het eerste en tweede lid, bewaart de negatieve testuitslag tot het bereiken van het
      woonadres of het opgegeven adres van een verblijfplaats in Nederland, diens reisbestemming in Nederland dan wel het
      moment van uitreis uit Nederland.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6
    text: |-
      De verplichting om over een negatieve testuitslag te beschikken, bedoeld in het eerste en tweede lid, is niet van
      toepassing op:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.a
    text: personen tot en met elf jaar;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.b
    text: grenswerkers, grensstudenten en grensscholieren;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.c
    text: houders van een door het Ministerie van Buitenlandse Zaken verstrekte diplomatieke identiteitskaart;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.d
    text: |-
      personeelsleden van diplomatieke en consulaire vertegenwoordigingen of internationale organisaties in Nederland,
      en de leden van hun officiële huishouden, die als zodanig zijn of worden geregistreerd bij het Ministerie van
      Buitenlandse Zaken;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.e
    text: staatshoofden en leden van een buitenlandse regering;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.f
    text: |-
      personen werkzaam in het transport van goederen en ander transportpersoneel, voor zover noodzakelijk en op het
      moment dat zij in de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.g
    text: |-
      zeevarenden op andere schepen dan commerciële jachten met een lengte van minder dan vierentwintig meter en
      pleziervaartuigen in het bezit van een monsterboekje als zij in uitoefening van hun functie reizen of als zij van
      of naar hun werkzaamheden reizen;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.h
    text: reizigers met een NATO Travel Order of een NATO-2-visum;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.i
    text: |-
      personen die reizen en geen negatieve testuitslag kunnen tonen in verband met urgent transport van
      lichaamsmaterialen ten behoeve van een medische behandeling;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.j
    text: |-
      personen die reizen en taken uitvoeren van nationaal belang in opdracht van de Minister of Staatssecretaris van
      Justitie en Veiligheid en de eventuele personen die door deze personen worden begeleid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.k
    text: |-
      personen die na inreis korter dan twaalf uur in Nederland zullen verblijven ingeval zij inreizen zonder gebruik te
      maken van bedrijfsmatig personenvervoer;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.l
    text: |-
      personen die korter dan twaalf uur in een aangewezen hoogrisicogebied, zeer hoogrisicogebied of uitzonderlijk
      hoogrisicogebied hebben verbleven of een noodzakelijke tussenstop hebben gemaakt waarbij het vervoermiddel slechts
      kort is verlaten of een overstap is gemaakt waarbij de overstapplaats niet is verlaten ingeval zij inreizen zonder
      gebruik te maken van bedrijfsmatig personenvervoer;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.m
    text: |-
      personen die werkzaamheden verrichten gerelateerd aan de gereedstelling of daadwerkelijke inzet van personeel
      ingedeeld bij Defensie, personeel ingedeeld bij Defensie dat een noodzakelijke korte opleiding moet volgen of
      experts noodzakelijk voor het functioneren van de krijgsmacht;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.n
    text: reizigers die gebruikmaken van regionaal grensoverschrijdend personenvervoer;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.o
    text: 'personen die gebruikmaken van bedrijfsmatig personenvervoer die Nederland niet als eindbestemming hebben:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.o.1
    text: die wegens onvoorziene omstandigheden naar een Nederlandse luchthaven moeten uitwijken; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.o.2
    text: die de overstapplaats niet verlaten;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.p
    text: |-
      personen die op grond van [Verordening (EU) nr. 604/2013](32013R0604) van het Europees Parlement en de Raad van
      26 juni 2013 tot vaststelling van de criteria en instrumenten om te bepalen welke lidstaat verantwoordelijk is voor
      de behandeling van een verzoek om internationale bescherming dat door een onderdaan van een derde land of staatloze
      bij een van de lidstaten wordt ingediend (PbEU 2013, L 180), door een andere lidstaat van de Europese Unie aan de
      Nederlandse Staat worden overgedragen, met inachtneming van de tussen de Nederlandse Staat en de andere lidstaat
      van de Europese Unie hierover gemaakte bilaterale afspraken, en de personen die deze personen begeleiden;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.6.q
    text: |-
      personen met rechtmatig verblijf in Nederland ten aanzien van wie de Nederlandse Staat gehouden is om hen na
      overbrenging vanuit een andere lidstaat van de Europese Unie toegang te verlenen, met inachtneming van de tussen de
      Nederlandse Staat en de andere lidstaat van de Europese Unie hierover gemaakte bilaterale afspraken, en de personen
      die deze personen begeleiden.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.7
    text: |-
      Indien het vervoer van een persoon buiten diens schuld om vertraagd is, wordt de termijn van de test, als bedoeld
      in het eerste en tweede lid verlengd met vierentwintig uur.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.8
    text: |-
      Het eerste en tweede lid zijn niet van toepassing op reizigers die geïnfecteerd zijn geweest met het virus SARS-
      CoV-2, mits de reiziger kan tonen aan de toezichthouder of de aanbieder van personenvervoer:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.8.a
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van minimaal elf en maximaal honderdtachtig
      dagen oud op het moment van aankomst of inreis in Nederland;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.8.b
    text: |-
      een op hem betrekking hebbende positieve uitslag van een NAAT-test van maximaal achtenveertig uur oud of van een
      antigeentest van maximaal vierentwintig uur oud op het moment van het aan boord gaan; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.8.c
    text: |-
      een op hem betrekking hebbende negatieve uitslag van een antigeentest van maximaal vierentwintig uur oud op het
      moment van aankomst in Nederland, dan wel een op hem betrekking hebbende verklaring van een arts van maximaal
      achtenveertig uur oud op het moment van het aan boord gaan, waarin is vermeld dat hij niet meer besmettelijk is.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.9
    text: 'Een testuitslag als bedoeld in het achtste lid bevat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.9.a
    text: gegevens waardoor valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.9.b
    text: de in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans vermelde conclusie van de testuitslag;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7d.9.c
    text: een logo of kenmerk van een instituut of arts.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7d
  - number: 6.7e.1
    text: |-
      De [artikelen 6.7a, eerste lid][ref1], [6.7b, eerste lid][ref2], en [6.7d, eerste en tweede lid][ref3], zijn
      niet van toepassing, indien een persoon, komend uit een door de Minister van Volksgezondheid, Welzijn en Sport
      aangewezen hoogrisicogebied binnen de Europese Economische Ruimte, uit Zwitserland, Andorra, Monaco, San Marino,
      Vaticaanstad of uit de Caribische delen van het Koninkrijk, niet zijnde een zeer hoogrisicogebied, aan de aanbieder
      van personenvervoer en aan een toezichthouder een op hem betrekking hebbend bewijs van vaccinatie tegen het virus
      SARS-CoV-2 kan tonen waaruit blijkt dat:


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
      - id: ref3
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.7e.1.a
    text: |-
      de vaccinatie met het covid-19-vaccin Janssen, registratienummer EU/1/20/1525, ten minste achtentwintig dagen voor
      het moment van aankomst in Nederland is voltooid of de vaccinatie met een ander vaccin ten minste veertien dagen
      voor het moment van aankomst in Nederland is voltooid; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.1.b
    text: |-
      niet meer dan 270 dagen zijn verstreken sinds de datum van voltooiing van de vaccinatie, tenzij in aanvulling op
      die voltooide vaccinatie een vaccin is toegediend dat eveneens is goedgekeurd door het College ter beoordeling van
      geneesmiddelen of het Europees Medicijn Agentschap, dan wel door de wereldgezondheidsorganisatie is opgenomen op de
      Emergency Use Listing.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.2
    text: |-
      Een vaccinatie tegen het virus SARS-CoV-2 bestaat uit toediening van een vaccin tegen een infectie veroorzaakt door
      het virus SARS-CoV-2, dat is goedgekeurd door het College ter beoordeling van geneesmiddelen, het Europees Medicijn
      Agentschap of door de WHO is opgenomen op de Emergency Use Listing en is voltooid indien:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.2.a
    text: de vaccinatie bestaat uit de toediening van één vaccin en dit vaccin is toegediend; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.2.b
    text: de vaccinatie bestaat uit de toediening van twee vaccins; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.2.b.1°
    text: beide vaccins zijn toegediend met inachtneming van het aanbevolen interval; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.2.b.2°
    text: |-
      één vaccin is toegediend en is bevestigd dat de gevaccineerde persoon blijkens een positieve testuitslag eerder
      geïnfecteerd is geweest met het virus SARS-CoV-2.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.3
    text: 'Een bewijs van voltooide vaccinatie bevat in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.3.a
    text: gegevens waaruit valt te herleiden wie de persoon is die is gevaccineerd;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.3.b
    text: |-
      gegevens waaruit blijkt dat een vaccinatie tegen het virus SARS-Cov-2 is toegediend en is voltooid overeenkomstig
      het tweede lid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.3.c
    text: de merknaam en de naam van de fabrikant of handelsvergunninghouder van elk vaccin dat is toegediend;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.3.d
    text: de datum van toediening van elk vaccin dat is toegediend;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.3.e
    text: de afgever van het bewijs van vaccinatie.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7e.4
    text: |-
      Het derde lid is van overeenkomstige toepassing op een bewijs van aanvullende vaccinatie na de voltooide
      vaccinatie.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7e
  - number: 6.7f.1
    text: |-
      De [artikelen 6.7a, eerste lid][ref1], [6.7b, eerste lid][ref2], en [6.7d, eerste en tweede lid][ref3], zijn
      niet van toepassing, indien een persoon, komend uit een door de Minister van Volksgezondheid, Welzijn en Sport
      aangewezen hoogrisicogebied binnen de Europese Economische Ruimte, uit Zwitserland, Andorra, Monaco, San Marino,
      Vaticaanstad of uit de Caribische delen van het Koninkrijk, niet zijnde een zeer hoogrisicogebied, een op hem
      betrekking hebbende positieve testuitslag van een NAAT-test of een antigeentest, afgenomen in de Europese Unie, de
      Caribische delen van het Koninkrijk of een land dat de DCC-equivalentieprocedure heeft doorlopen en waarvoor een
      Europees uitvoeringsbesluit is aangenomen, van minimaal 11 en maximaal 180 dagen oud op het moment van aankomst in
      Nederland kan tonen aan de aanbieder van personenvervoer en aan een toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7f
    references:
