  - number: 6.21.1
    text: |-
      Het document, bedoeld in [artikel 6.20, vierde lid][ref1], betreft ten aanzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
