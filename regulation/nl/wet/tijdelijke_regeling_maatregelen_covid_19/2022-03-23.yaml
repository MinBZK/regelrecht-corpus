  - number: 6.19.1
    text: |-
      Het aantal dagen, bedoeld in de [artikelen 58nb, eerste lid][ref1], en
      [58nc, eerste lid, onder c, van de wet][ref2], bedraagt tien dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58nb
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.19
    references:
