        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.20.5
    text: |-
      Een persoon als bedoeld in het eerste lid toont op verzoek aan de aanbieder van bedrijfsmatig personenvervoer of
      een toezichthouder:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.5.a
    text: de verklaring of de bevestiging, bedoeld in het vierde lid; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
  - number: 6.20.5.b
    text: |-
      indien van toepassing, het document, bedoeld in [artikel 6.21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.20
    references:
