        paragraaf: '6.2'
  - number: 6.7g.2
    text: |-
      Onder een positieve testuitslag als bedoeld in de [artikelen 6.7a, vierde lid, onder a][ref1],
      [6.7b, vijfde lid, onder a][ref2], [6.7c, vijfde lid, onder a][ref3], [6.7d, achtste lid, onder a][ref4],
      [6.7e, tweede lid, onder b, onder 2°][ref5], en [artikel 6.7f, eerste lid][ref6], wordt mede verstaan een
      certificaat als bedoeld in artikel 3, eerste lid, onder c, van verordening (EU) 2021/953 van het Europees parlement
      en de Raad van 14 juni 2021 betreffende een kader voor de afgifte, verificatie en aanvaarding van interoperabele
      COVID-19-vaccinatie-, test- en herstelcertificaten (digitaal EU-COVID-certificaat) teneinde het vrije verkeer
      tijdens de COVID-19-pandemie te vergemakkelijken (PbEU 2021, L 211).


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044416#Artikel6
