        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.7f.2
    text: 'Een positieve testuitslag bevat in het Nederlands, Engels, Duits, Frans, Italiaans, Portugees of Spaans:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7f
  - number: 6.7f.2.a
    text: gegevens waaruit valt te herleiden wie de persoon is die is getest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7f
  - number: 6.7f.2.b
    text: de uitslag van een NAAT-test of een antigeentest;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7f
  - number: 6.7f.2.c
    text: de datum en het tijdstip van de afname van de test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7f
  - number: 6.7f.2.d
    text: een logo of kenmerk van een instituut of arts.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7f
  - number: 6.7g.1
    text: |-
      Onder een negatieve testuitslag als bedoeld in de [artikelen 6.7a, eerste lid en vierde lid, onder c][ref1],
      [6.7b, eerste lid, derde lid, onder k, en vijfde lid, onder c][ref2],
      [6.7c, eerste en tweede lid en vierde lid, onder g, onder 2°, j, onder 3°, en k][ref3], en
      [6.7d, eerste, tweede, vijfde en zesde lid en achtste lid, onder c][ref4], wordt mede verstaan een certificaat
      als bedoeld in artikel 3, eerste lid, onder b, van verordening (EU) 2021/953 van het Europees parlement en de Raad
      van 14 juni 2021 betreffende een kader voor de afgifte, verificatie en aanvaarding van interoperabele COVID-19-
      vaccinatie-, test- en herstelcertificaten (digitaal EU-COVID-certificaat) teneinde het vrije verkeer tijdens de
      COVID-19-pandemie te vergemakkelijken (PbEU 2021, L 211) dat een negatief resultaat bevat.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.7g
