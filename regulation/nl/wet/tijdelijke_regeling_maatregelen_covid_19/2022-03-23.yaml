  - number: 6.21.1.s.2.
    text: |-
      waarmee een potentiële directe buitenlandse investering is gemoeid die bijdraagt aan de versterking van het
      Nederlandse innovatievermogen, de verduurzaming van de Nederlandse economie of de verdere digitalisering van de
      Nederlandse economie; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
  - number: 6.21.1.s.3.
    text: |-
      die van groot belang zijn voor een specifieke in Nederland gevestigde organisatie, die ten minste tien fulltime
      medewerkers of € 2.000.000 jaaromzet heeft dan wel die bijdraagt aan maatschappelijk relevant onderzoek, innovatie,
      duurzaamheid of de volksgezondheid;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
  - number: 6.21.1.t
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder d][ref1], een verklaring van NOC*NSF of de KNVB, waaruit
      blijkt dat er vanwege zijn professie in de topsport sprake is van een noodzakelijke inreis;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.21.1.u
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder e][ref1], een uitnodigingsbrief of een verklaring van
      de kennisinstelling, waaruit blijkt dat sprake is van noodzakelijke werkzaamheden waarbij werken op afstand niet
      mogelijk is en van de noodzaak dat die persoon gelijk na aankomst aanvangt met de activiteiten of werkzaamheden
      waarvoor de inreis plaatsvindt;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.21.1.v
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder f][ref1], een uitnodigingsbrief of een verklaring van
      een Nederlandse culturele en creatieve instelling;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.21.1.w
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder g][ref1], een verklaring van de overheidsinstelling,
      waaruit blijkt dat sprake is van een noodzakelijke dienstreis, dat werken op afstand niet mogelijk is en het
      noodzakelijk is dat hij gelijk na aankomst aanvangt met zijn werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.21.1.x
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder h][ref1], een verklaring van de werkgever of de
      opdrachtgever met een beschrijving van de werkzaamheden en vermelding van het schip of de haven waarnaar die
      persoon onderweg is;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.21.1.y
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder i][ref1], een verklaring van de werkgever, waaruit
      blijkt dat sprake is van werkzaamheden op het gebied van zoek- en reddingsacties of nautische dienstverlening;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.21.1.z
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder j][ref1], een verklaring van de opdrachtgever of
      werkgever, waaruit blijkt dat sprake is van urgente, incidentele werkzaamheden gerelateerd aan installatie en
      onderhoud van uit Nederland uitgevoerde producten, waarvoor specialistische kennis of expertise is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.21.1.aa
    text: |-
      een persoon als bedoeld in [artikel 6.19, zesde lid, onder k][ref1], een bewijs van vaccinatie
      waaruit blijkt dat een vaccin is toegediend in aanvulling op een voltooide vaccinatie als bedoeld in
      [artikel 6.7e, eerste lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.21.2
    text: |-
      Indien werkzaamheden als bedoeld in het eerste lid, onder e, f, g, h, i, j, o, r, s, x en y niet in loondienst maar
      door een zelfstandige of door een persoon die geen werkgever heeft, worden verricht, wordt de werkgeversverklaring
      door de zelfstandige of door die persoon ingevuld en geldt die verklaring als de werkgeversverklaring, bedoeld in
      het eerste lid, onder e, f, g, h, i, j, o, r, s, x en y.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.21
  - number: 6.22.1
    text: |-
      De aanbieder van ander bedrijfsmatig personenvervoer, voor zover sprake is van vervoer met een luchtvaartuig
      als bedoeld in [artikel 16 van de Luchtvaartwet][ref1], draagt er zorg voor dat alleen vervoer wordt aangeboden,
      toegang daartoe wordt verschaft en gebruik daarvan wordt toegestaan, indien een persoon, komend vanuit een door
      de Minister van Volksgezondheid, Welzijn en Sport aangewezen zeer hoogrisicogebied, een papieren verklaring of een
      bevestiging van een digitaal ingevulde verklaring als bedoeld in [artikel 6.20, eerste lid][ref2], alsmede, voor
      zover van toepassing, het in [artikel 6.21, eerste lid][ref3], voorgeschreven document, aan de aanbieder van het
      vervoer en aan een toezichthouder kan tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0002267#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0002267
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
      - id: ref3
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.22.2
    text: |-
      De aanbieder van ander bedrijfsmatig personenvervoer, voor zover sprake is van het aanbieden van personenvervoer
      met of zonder een dienstregeling per veerboot, passagiersschip, of vrachtschip dat maximaal twaalf passagiers
      vervoert, draagt er zorg voor dat alleen vervoer wordt aangeboden, toegang daartoe wordt verschaft en gebruik
      daarvan wordt toegestaan, indien een persoon, komend vanuit een door de Minister van Volksgezondheid, Welzijn
      en Sport aangewezen zeer hoogrisicogebied, een papieren verklaring of een bevestiging van een digitaal
      ingevulde verklaring als bedoeld in [artikel 6.20, eerste lid][ref1], alsmede, voor zover van toepassing,
      het in [artikel 6.21, eerste lid][ref2], voorgeschreven document, aan de aanbieder van het vervoer en aan een
      toezichthouder kan tonen.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.22
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.23.1
    text: |-
      Een persoon als bedoeld in [artikel 6.20, eerste lid][ref1], die gebruik maakt van ander
      bedrijfsmatig personenvervoer, voor zover sprake is van vervoer met een luchtvaartuig als bedoeld in
      [artikel 16 van de Luchtvaartwet][ref2] of van personenvervoer met of zonder een dienstregeling per veerboot of
      passagiersschip, verstrekt de papieren verklaring, bedoeld in artikel 6.20, vierde lid, op verzoek aan de aanbieder
      van dat personenvervoer of een toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002267#Artikel16
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.23
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
      - id: ref2
        bwb_id: BWBR0002267
        artikel: '16'
  - number: 6.23.2
    text: |-
      Een aanbieder van personenvervoer als bedoeld in het eerste lid, neemt de papieren verklaring, bedoeld in het
      eerste lid, in en verstrekt deze verklaring aan de voorzitter van de veiligheidsregio.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.23
  - number: 6.23.3
    text: |-
      Een toezichthouder of de voorzitter van de veiligheidsregio verstrekt een verklaring als bedoeld in het eerste
      respectievelijk tweede lid op verzoek aan de Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.23
  - number: 6.23.4
    text: |-
      Indien een verklaring niet behoeft te worden verstrekt aan de Minister van Volksgezondheid, Welzijn en Sport
      als bedoeld in het derde lid, vernietigt de toezichthouder respectievelijk de voorzitter van de veiligheidsregio
      onverwijld die verklaring.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.23
  - number: 6.23.5
    text: |-
      De verplichting, bedoeld in het eerste lid, is niet van toepassing op personen die werkzaam zijn in het in dat lid
      bedoelde personenvervoer als zij in de uitoefening van hun functie reizen of als zij van of naar hun werkzaamheden
      reizen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.23
  - number: 6.24.1
    text: |-
      Een persoon als bedoeld in [artikel 6.20, eerste lid][ref1], die heeft verklaard dat hij onverwijld in
      thuisquarantaine zal gaan, bewaart de verklaring of de bevestiging, bedoeld in artikel 6.20, vierde lid, in
      ieder geval tot het moment van het bereiken van het woonadres of het in de verklaring opgegeven adres van een
      verblijfplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.24.2
    text: |-
      Een persoon als bedoeld in [artikel 6.20, eerste lid][ref1], die heeft verklaard dat hij behoort tot een
      van de categorieën van personen, bedoeld in [artikel 58nc van de wet][ref2], bewaart de verklaring of de
      bevestiging, bedoeld in artikel 6.20, vierde lid, alsmede, indien van toepassing, het document, bedoeld in
      [artikel 6.21, eerste lid][ref3], in ieder geval tot het moment van het bereiken van zijn reisbestemming in
      Nederland of het moment van uitreis uit Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58nc
      [ref3]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58nc
      - id: ref3
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: 6.24.3
    text: |-
      Indien een persoon als bedoeld in [artikel 6.20, eerste lid][ref1], een papieren verklaring als bedoeld
      in artikel 6.20, vierde lid, aan een aanbieder van personenvervoer heeft verstrekt als bedoeld in
      [artikel 6.23, eerste lid][ref2], vervalt de bewaarplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.24
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
  - number: '6.25'
    text: |-
      Het formulier van de verklaring, bedoeld in [artikel 6.20, eerste lid][ref1], is opgenomen als [bijlage 6][ref2]
      bij deze regeling. Het formulier wordt door de overheid elektronisch en op papier beschikbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.25
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.10'
      - id: ref2
        bwb_id: BWBR0044416
  - number: 6.26.1
    text: Een testuitslag wordt verkregen door een test op infectie met het virus SARS-CoV-2 te laten afnemen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.26
  - number: 6.26.2
    text: |-
      De Minister van Volksgezondheid, Welzijn en Sport biedt aan ieder de mogelijkheid om zich te laten testen op
      infectie met het virus SARS-CoV-2 ten behoeve van het verkrijgen van een coronatoegangsbewijs, waarbij de kosten
      van de uitvoering van het testen voor rekening komen van Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.26
  - number: 6.26.3
    text: |-
      Door een deelnemer van een door de Minister van Volksgezondheid, Welzijn en Sport in een protocol vastgestelde
      pilot waarbij personen onder begeleiding van een door deze Minister gecontracteerde testuitvoerder zelf een test op
      infectie met het virus SARS-CoV-2 afnemen, kan een testuitslag worden verkregen. Een positieve testuitslag die in
      het kader van de pilot door middel van de begeleide zelftest is verkregen, kan niet leiden tot vaststelling van een
      herstel van een infectie als bedoeld in [artikel 6.26b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.26
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.26.4
    text: |-
      In het protocol, bedoeld in het derde lid, wordt beschreven hoe de pilot verloopt, wanneer de pilot is afgelopen en
      hoe deze wordt geëvalueerd.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.26
  - number: 6.26a
    text: |-
      Een vaccinatie tegen het virus SARS-CoV-2 bestaat uit toediening van een vaccin tegen een infectie veroorzaakt
      door het virus SARS-CoV-2, dat is goedgekeurd door het College ter beoordeling van geneesmiddelen of het Europees
      Medicijn Agentschap dan wel door de WHO is opgenomen op de Emergency Use Listing.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.26a
  - number: 6.26aa
    text: |-
      De toediening van een vaccin tegen een infectie veroorzaakt door het virus SARS-CoV-2 in het
      kader van wetenschappelijk onderzoek gericht op de ontwikkeling van een vaccin als bedoeld in
      [artikel 1, onder d, van het Besluit centrale beoordeling medisch-wetenschappelijk onderzoek met mensen][ref1],
      geldt als een vaccinatie als bedoeld in [artikel 6.26a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0010314#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.26aa
    references:
      - id: ref1
        bwb_id: BWBR0010314
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.26b
    text: |-
      Herstel van het virus SARS-CoV-2 bestaat uit het herstel van een infectie veroorzaakt door het virus SARS-CoV-2,
      welke infectie is vastgesteld door middel van een positieve testuitslag.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.26b
  - number: '6.27'
    text: 'Om voor een resultaat te kunnen worden gebruikt, bevat een testuitslag:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27
  - number: 6.27.a
    text: de naam en de geboortedatum van de geteste persoon;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27
  - number: 6.27.b
    text: het type test dat is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27
  - number: 6.27.c
    text: de datum en het tijdstip van de afname van de test; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27
  - number: 6.27.d
    text: de uitslag van de uitgevoerde test.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27
  - number: 6.27a
    text: 'Om voor een resultaat te kunnen worden gebruikt, bevat een verklaring van vaccinatie tegen het virus SARS-CoV-2:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27a
  - number: 6.27a.a
    text: de naam en de geboortedatum van de gevaccineerde persoon;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27a
  - number: 6.27a.b
    text: de merknaam en de naam van de fabrikant van elk vaccin dat is toegediend;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27a
  - number: 6.27a.c
    text: de datum van toediening van elk vaccin dat is toegediend;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27a
  - number: 6.27a.d
    text: indien van toepassing, een bevestiging van een eerdere positieve testuitslag.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27a
  - number: 6.27b
    text: |-
      Om voor een resultaat te kunnen worden gebruikt, bevat een verklaring van herstel van het virus SARS-CoV-2 een
      testuitslag met:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27b
  - number: 6.27b.a
    text: de naam en de geboortedatum van de herstelde persoon;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27b
  - number: 6.27b.b
    text: het type test dat is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27b
  - number: 6.27b.c
    text: de datum en het tijdstip van de afname van de test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27b
  - number: 6.27b.d
    text: de uitslag van de uitgevoerde test.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.27b
  - number: '6.28'
    text: 'Een elektronisch of papieren coronatoegangsbewijs bestaat uit een QR-code die aan de volgende eisen voldoet:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
  - number: 6.28.a
    text: de QR-code is voorzien van een elektronische handtekening van de Minister van Volksgezondheid, Welzijn en Sport;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
  - number: 6.28.b
    text: 'de QR-code bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
  - number: 6.28.b.1°
    text: |-
      de eerste letter van de voornaam, de eerste letter van de achternaam, de geboortemaand en de geboortedag van de
      persoon waarop het coronatoegangsbewijs betrekking heeft, met dien verstande dat in het geval van een elektronisch
      coronatoegangsbewijs bij een zeldzame combinatie van deze gegevens slechts één of meerdere van deze gegevens wordt
      opgenomen;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
  - number: 6.28.b.2°
    text: de datum en het op hele uren afgeronde tijdstip vanaf welke het coronatoegangsbewijs geldig is;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
  - number: 6.28.b.3°
    text: |-
      de duur van de geldigheid van het coronatoegangsbewijs, bepaald overeenkomstig
      [artikel 6.29, eerste lid, onder d, tweede lid, onder d en e, of derde lid, onder d][ref1], of
      [artikel 6.31e, zesde lid][ref2]; en


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.28.b.4°
    text: |-
      een markering waaruit blijkt of een coronatoegangsbewijs toegang geeft tot een publieke plaats of
      evenement waar een geldig coronatoegangsbewijs op basis van een negatieve testuitslag als bedoeld in
      [artikel 6.29, eerste lid][ref1], is vereist;


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.28.c
    text: |-
      de QR-code is zodanig samengesteld dat bij het lezen daarvan met de door de Minister van Volksgezondheid, Welzijn
      en Sport beschikbaar gestelde applicatie, bedoeld in [artikel 58re, derde lid, van de wet][ref1] wordt getoond of
      de QR-code een geldig coronatoegangsbewijs bevat en zo ja, wat de gegevens zijn, bedoeld in onderdeel b, onder 1°.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.28
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.29.1
    text: |-
      Een coronatoegangsbewijs op basis van een negatieve testuitslag is geldig voor deelname aan een activiteit of
      toegang tot een voorziening waarvoor het beschikken over een resultaat krachtens de [wet][ref1] is voorgeschreven
      indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 6.29.1.a
    text: het coronatoegangsbewijs betrekking heeft op de persoon die de deelname of de toegang wenst;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.1.b
    text: een NAAT-test, een antigeentest of een ademtest op een infectie met het virus SARS-Cov-2 is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.1.c
    text: de uitslag van de uitgevoerde test negatief is; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.1.d
    text: |-
      op het moment van aanvang van de deelname of toegang niet meer dan vierentwintig uren zijn verstreken sinds het
      tijdstip van afname van de test, bepaald overeenkomstig [artikel 6.28, onderdeel b, onder 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.29.2
    text: |-
      Een coronatoegangsbewijs op basis van een vaccinatie tegen het virus SARS-CoV-2 is geldig voor deelname aan
      een activiteit of toegang tot een voorziening waarvoor het beschikken over een resultaat krachtens de wet is
      voorgeschreven indien:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.a
    text: het coronatoegangsbewijs betrekking heeft op de persoon die de deelname of de toegang wenst;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.b
    text: 'de vaccinatie is voltooid doordat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.b.1°
    text: de vaccinatie bestaat uit de toediening van één vaccin en dit vaccin is toegediend; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.b.2°
    text: |-
      de vaccinatie bestaat uit de toediening van twee vaccins en - beide vaccins zijn toegediend met inachtneming van
      het aanbevolen interval; of
        - één vaccin is toegediend en is bevestigd dat de gevaccineerde persoon blijkens een positieve testuitslag eerder
      geïnfecteerd is geweest met het virus SARS-CoV-2; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.b.3°
    text: |-
      ingeval van een vaccin als bedoeld in [artikel 6.26aa][ref1], de persoon die de deelname of toegang wenst het
      vaccin in het kader van het in dat artikel bedoelde wetenschappelijk onderzoek toegediend heeft gekregen en naar
      het oordeel van degene die het wetenschappelijk onderzoek verricht als volledig beschermd kan worden beschouwd; of


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.29.2.b.4°
    text: |-
      ingeval van een vaccin als bedoeld in [artikel 6.26aa][ref1], de persoon die deelname of toegang wenst het vaccin
      in het kader van het in dat artikel bedoelde wetenschappelijk onderzoek toegediend heeft gekregen en naar het
      oordeel van degene die het wetenschappelijk onderzoek verricht als gedeeltelijk beschermd kan worden beschouwd, en
      tevens één vaccin als bedoeld in [artikel 6.26a][ref2] toegediend heeft gekregen; en


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.29.2.c
    text: 'op het moment van aanvang van de deelname of toegang:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.c.1°
    text: |-
      ten minste achtentwintig dagen zijn verstreken met ingang van de datum van voltooiing van de vaccinatie met
      het covid-19-vaccin Janssen, registratienummer EU/1/20/1525, tenzij de vaccinatie is voltooid in de periode van
      veertien dagen voorafgaand aan de datum van inwerkingtreding van dit artikelonderdeel; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.c.2°
    text: |-
      ten minste veertien dagen zijn verstreken met ingang van de datum van voltooiing van de vaccinatie met een ander
      vaccin dan bedoeld onder 1°; of
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.c.3°
    text: |-
      ingeval van de situatie, bedoeld in onderdeel b, onder 4°, de termijn, bedoeld onder 1° of 2°, is verstreken met
      ingang van de datum van toediening van het vaccin als bedoeld in [artikel 6.26a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.29.2.d
    text: |-
      voor zover het coronatoegangsbewijs betrekking heeft op een persoon van 18 jaar of ouder, op het moment van
      aanvang van de deelname of toegang niet meer dan 270 dagen zijn verstreken sinds de datum van voltooiing van de
      vaccinatie, tenzij in aanvulling op die voltooide vaccinatie een vaccin is toegediend dat eveneens is goedgekeurd
      door het College ter beoordeling van geneesmiddelen of het Europees Medicijn Agentschap, dan wel door de
      wereldgezondheidsorganisatie is opgenomen op de Emergency Use Listing; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.2.e
    text: |-
      voor zover het een papieren coronatoegangsbewijs betreft, op het moment van aanvang van de deelname of toegang niet
      meer dan 90 dagen zijn verstreken sinds de uitgifte van dat bewijs.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.3
    text: |-
      Een coronatoegangsbewijs op basis van herstel van het virus SARS-CoV-2 is geldig voor deelname aan een
      activiteit of toegang tot een voorziening waarvoor het beschikken over een resultaat krachtens de [wet][ref1] is
      voorgeschreven indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 6.29.3.a
    text: het coronatoegangsbewijs betrekking heeft op de persoon die de deelname of de toegang wenst;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.3.b
    text: een NAAT-test of een antigeentest is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.3.c
    text: de uitslag van de uitgevoerde test positief is; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.3.d
    text: 'op het moment van aanvang van de deelname of toegang:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.29.3.d.1°
    text: |-
      ten minste elf dagen en ten hoogste 180 dagen zijn verstreken sinds het tijdstip van afname van de test, bepaald
      overeenkomstig [artikel 6.28, onder b, onder 2°][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.29.3.d.2°
    text: |-
      voor zover het een papieren coronatoegangsbewijs betreft, niet meer dan 90 dagen zijn verstreken sinds de uitgifte
      van dat bewijs.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.29
  - number: 6.30.1
    text: |-
      Bij aanvang van de deelname aan een activiteit of de toegang tot een voorziening waarvoor het beschikken over een
      resultaat krachtens de [wet][ref1] is voorgeschreven:


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 6.30.1.a
    text: |-
      verzoekt de beheerder de persoon die de deelname of de toegang wenst, een coronatoegangsbewijs en een
      identiteitsdocument als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] te tonen;


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.30
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: 6.30.1.b
    text: |-
      toont de persoon die de deelname of de toegang wenst, zijn coronatoegangsbewijs en zijn identiteitsdocument aan de
      beheerder; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.30
  - number: 6.30.1.c
    text: |-
      ontzegt de beheerder de persoon die geen geldig coronatoegangsbewijs of geen geldig identiteitsdocument toont, de
      deelname of de toegang.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.30
  - number: 6.30.2
    text: |-
      Bij aanvang van de deelname of de toegang toont de persoon die de deelname of toegang wenst, tevens zijn
      coronatoegangsbewijs en zijn identiteitsdocument aan een toezichthouder op diens verzoek.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.30
  - number: 6.31.1
    text: |-
      De uitvoerder van de test verstrekt op verzoek van de geteste persoon, gedaan met een door de Minister van
      Volksgezondheid, Welzijn en Sport beschikbaar gestelde applicatie, ten behoeve van een elektronisch of schriftelijk
      coronatoegangsbewijs op basis van een testuitslag de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.1.a
    text: de naam en de geboortedatum van de geteste persoon;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.1.b
    text: het type test dat is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.1.c
    text: de datum en het op hele uren afgeronde tijdstip van afname van de test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.1.d
    text: de uitslag van de uitgevoerde test; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.1.e
    text: |-
      een code voor het opvragen van de gegevens, bedoeld onder a tot en met d, tenzij de geteste persoon voor het
      opvragen van deze gegevens gebruik maakt van DigiD.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.2
    text: 'De geteste persoon kan met de gegevens, bedoeld in het eerste lid, onder a tot en met d, door middel van:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.2.a
    text: |-
      de applicatie, bedoeld in [artikel 58re, eerste lid, onderdeel a, onder 1°, van de wet][ref1] een elektronisch
      coronatoegangsbewijs aanmaken;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31.2.b
    text: |-
      een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde webapplicatie een
      coronatoegangsbewijs aanmaken om op papier af te drukken.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.3
    text: |-
      Bij de uitvoering van het eerste en tweede lid en het gebruik van de in het tweede lid bedoelde applicatie wordt
      het IP-adres verwerkt dat de geteste persoon gebruikt.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.4
    text: |-
      De uitvoerder van de test verstrekt op verzoek van de geteste persoon met de gegevens, bedoeld in het eerste lid,
      onder a tot en met d, een coronatoegangsbewijs op papier door de daarvoor benodigde persoonsgegevens te verwerken
      met een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde portalapplicatie.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
  - number: 6.31.5
    text: |-
      De beheerder en de toezichthouder kunnen de gegevens, bedoeld in [artikel 6.28, onderdeel b][ref1], door middel van
      de applicatie, bedoeld in [artikel 58re, derde lid, van de wet][ref2] verwerken om te zien of het elektronisch of
      schriftelijk coronatoegangsbewijs geldig is en zo ja, wat de gegevens zijn, bedoeld in artikel 6.28, onderdeel b,
      onder 1°.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31a.1
    text: |-
      Op verzoek van de gevaccineerde persoon, gedaan met een door de Minister van Volksgezondheid, Welzijn en Sport
      beschikbaar gestelde applicatie, gaat de Minister van Volksgezondheid, Welzijn en Sport ten behoeve van een
      elektronisch of schriftelijk coronatoegangsbewijs op basis van een verklaring van vaccinatie na of het RIVM in het
      COVID-vaccinatie Informatie- en Monitoringsysteem beschikt over gegevens met betrekking tot diens vaccinatie tegen
      het virus SARS-CoV-2 en zo nee, wie die persoon een vaccinatie tegen dat virus heeft toegediend.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.2
    text: |-
      Het RIVM of, indien het RIVM niet beschikt over de gegevens, de toediener van de vaccinatie tegen het virus SARS-
      CoV-2 verstrekt op verzoek van de gevaccineerde persoon, gedaan met een door de Minister van Volksgezondheid,
      Welzijn en Sport beschikbaar gestelde applicatie, ten behoeve van een elektronisch of schriftelijk
      coronatoegangsbewijs op basis van een verklaring van vaccinatie de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.2.a
    text: de naam en de geboortedatum van de gevaccineerde persoon;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.2.b
    text: de merknaam en de naam van de fabrikant van elk vaccin dat is toegediend;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.2.c
    text: de datum van toediening van elk vaccin dat is toegediend;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.2.d
    text: indien van toepassing, de bevestiging van een positieve testuitslag.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.3
    text: |-
      Ter uitvoering van het verzoek, bedoeld in het eerste of tweede lid, worden de volgende gegevens van de
      gevaccineerde persoon verwerkt:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.3.a
    text: zijn naam en geboortedatum;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.3.b
    text: zijn burgerservicenummer.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.4
    text: 'De gevaccineerde persoon kan met de gegevens, bedoeld in het tweede lid, door middel van:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.4.a
    text: |-
      de applicatie, bedoeld in [artikel 58re, eerste lid, onderdeel a, onder 1°, van de wet][ref1] een elektronisch
      coronatoegangsbewijs aanmaken;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31a.4.b
    text: |-
      een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde webapplicatie een
      coronatoegangsbewijs aanmaken om op papier af te drukken.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.5
    text: |-
      Bij de uitvoering van de voorgaande leden en het gebruik van de in het vorige lid bedoelde applicatie wordt het IP-
      adres verwerkt dat de gevaccineerde persoon gebruikt.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.6
    text: |-
      De toediener van de vaccinatie tegen het virus SARS-CoV-2 dan wel, indien het een in het buitenland toegediende
      vaccinatie tegen dat virus betreft, de persoon of organisatie die op grond van [artikel 6ba van de wet][ref1]
      is aangewezen om vaccinatiecertificaten als bedoeld in artikel 8, eerste lid, van [verordening (EU) 2021/953]
      (32853R2021) van het Europees Parlement en de Raad van 14 juni 2021 betreffende een kader voor de afgifte,
      verificatie en aanvaarding van interoperabele COVID-19-vaccinatie-, test- en herstelcertificaten (digitaal EU-
      COVID-certificaat) teneinde het vrije verkeer tijdens de COVID-19-pandemie te faciliteren (PbEU 2021, L 211/1)
      af te geven, verstrekt op verzoek van de gevaccineerde persoon met de gegevens, bedoeld in het tweede lid een
      coronatoegangsbewijs op basis van een vaccinatie tegen het virus SARS-CoV-2 op papier door de daarvoor benodigde
      persoonsgegevens te verwerken met een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde
      portalapplicatie.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel6ba
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 6ba
  - number: 6.31a.7
    text: |-
      Het verzoek, bedoeld in het zesde lid, met betrekking tot een in het buitenland toegediende vaccinatie tegen het
      virus SARS-CoV-2:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.7.a
    text: |-
      kan worden gedaan door een in het Europese deel van Nederland of in een van de openbare lichamen Bonaire, Sint
      Eustatius of Saba woonachtige betrokkene of door een in het buitenland woonachtige betrokkene met de Nederlandse
      nationaliteit;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.7.b
    text: |-
      wordt in persoon gedaan, waarbij betrokkene zich legitimeert aan de hand van een geldig
      identiteitsdocument als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] of
      [artikel 2 van de Wet identificatieplicht BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028575
        artikel: '2'
  - number: 6.31a.7.c
    text: |-
      gaat vergezeld van een betrouwbaar vaccinatiebewijs waarop in het Nederlands, Engels, Duits, Frans, Italiaans,
      Portugees of Spaans de gegevens, bedoeld in het tweede lid, zijn vermeld en dat is voorzien van een logo of kenmerk
      van een instituut of arts; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.7.d
    text: |-
      betreft een vaccinatie die op het moment van het verzoek voldoet aan de voorwaarden, genoemd in
      [artikel 6.29, tweede lid, onder b, onder 1° en 2°, onder c, onder 1°en 2°, en onder d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.31a.8
    text: |-
      Een coronatoegangsbewijs op basis van een in het buitenland toegediende vaccinatie tegen het virus SARS-CoV-2 wordt
      uitsluitend verstrekt voor een vaccin dat is goedgekeurd door het College ter beoordeling van geneesmiddelen, het
      Europees Medicijn Agentschap of de Wereldgezondheidsorganisatie.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.9
    text: |-
      Een coronatoegangsbewijs op papier op basis van een vaccinatie tegen het virus SARS-CoV-2 kan voorts op telefonisch
      of schriftelijk verzoek van de gevaccineerde persoon per post worden verstrekt door het agentschap Centraal
      Informatiepunt Beroepen Gezondheidszorg van het Ministerie van Volksgezondheid, Welzijn en Sport door de daarvoor
      benodigde persoonsgegevens te verwerken met een portalapplicatie, indien:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.9.a
    text: de gevaccineerde persoon identificerende persoonsgegevens kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.9.b
    text: |-
      de daarvoor benodigde gegevens, bedoeld in het tweede lid, onder a tot en met d, beschikbaar zijn gesteld door de
      toediener van de vaccinatie tegen het virus SARS-CoV-2; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.9.c
    text: de gevaccineerde persoon is ingeschreven in de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
  - number: 6.31a.10
    text: |-
      Indien bij het aanmaken van een coronatoegangsbewijs op basis van een vaccinatie tegen het virus SARS-CoV-2 met
      de applicatie, bedoeld in [artikel 58re, eerste lid, onderdeel a, onder 1°, van de wet][ref1] of met de door
      de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde webapplicatie of portalapplicatie uit
      raadpleging van persoonsgegevens waarover de gemeentelijke gezondheidsdienst beschikt uit hoofde van de uitvoering
      van testen op infectie met het virus SARS-CoV-2 of de registratie van infecties met dat virus blijkt dat de
      gevaccineerde persoon geïnfecteerd is geweest met het virus SARS-CoV-2, wordt de vaccinatie reeds als voltooid
      aangemerkt na toediening van één vaccin indien de vaccinatie uit twee vaccins bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31a.11
    text: |-
      De beheerder en de toezichthouder kunnen de gegevens, bedoeld in [artikel 6.28, onder b][ref1], door middel van
      de applicatie, bedoeld in [artikel 58re, derde lid, van de wet][ref2] verwerken om te zien of het elektronisch of
      schriftelijk coronatoegangsbewijs geldig is en zo ja, wat de gegevens zijn, bedoeld in artikel 6.28, onder b, onder
      1°.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31a
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31b.1
    text: |-
      De verklaarder van het herstel van het virus SARS-CoV-2 verstrekt op verzoek van de herstelde persoon, gedaan
      met een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gesteld applicatie, ten behoeve van
      een elektronisch of schriftelijk coronatoegangsbewijs op basis van herstel van het virus SARS-CoV-2 de volgende
      gegevens:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.1.a
    text: de naam en de geboortedatum van de herstelde persoon;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.1.b
    text: het type test dat is uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.1.c
    text: de datum en het op hele uren afgeronde tijdstip van afname van de test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.1.d
    text: de uitslag van de uitgevoerde test;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.1.e
    text: |-
      een code voor het opvragen van de gegevens, bedoeld onder a tot en met d, tenzij de geteste persoon voor het
      opvragen van deze gegevens gebruikmaakt van DigiD.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.2
    text: |-
      De gegevens, bedoeld in het eerste lid, onder a tot en met d, kunnen tevens worden verkregen van de gemeentelijke
      gezondheidsdienst uit de registratie, bedoeld in [artikel 29, eerste lid, van de wet][ref1], van infecties met
      het virus SARS-CoV-2 die is aangesloten op een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar
      gestelde applicatie voor het aanmaken van een coronatoegangsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel29
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: '29'
  - number: 6.31b.3
    text: 'De herstelde persoon kan met de gegevens, bedoeld in het eerste lid, onder a tot en met d, door middel van:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.3.a
    text: |-
      de applicatie, bedoeld in [artikel 58re, eerste lid, onderdeel a, onder 1°, van de wet][ref1] een elektronisch
      coronatoegangsbewijs aanmaken;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31b.3.b
    text: |-
      een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde webapplicatie een
      coronatoegangsbewijs aanmaken om op papier af te drukken.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.4
    text: |-
      Bij de uitvoering van het eerste en tweede lid en het gebruik van de in het vorige lid bedoelde applicatie wordt
      het IP-adres verwerkt dat de geteste persoon gebruikt.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.5
    text: |-
      De verklaarder van het herstel van het virus SARS-CoV-2 verstrekt op verzoek van de herstelde persoon met de
      gegevens, bedoeld in het eerste lid, onder a tot en met d, een coronatoegangsbewijs op basis van herstel van het
      virus SARS-CoV-2 op papier door de daarvoor benodigde persoonsgegevens te verwerken met een door de Minister van
      Volksgezondheid, Welzijn en Sport beschikbaar gestelde portalapplicatie.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.6
    text: |-
      Een coronatoegangsbewijs op basis van herstel van het virus SARS-CoV-2 op papier kan voorts op telefonisch of
      schriftelijk verzoek van de herstelde persoon per post worden verstrekt door het agentschap Centraal Informatiepunt
      Beroepen Gezondheidszorg van het Ministerie van Volksgezondheid, Welzijn en Sport door de daarvoor benodigde
      persoonsgegevens te verwerken met een portalapplicatie, indien:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.6.a
    text: de herstelde persoon identificerende persoonsgegevens kan verstrekken;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.6.b
    text: |-
      de daarvoor benodigde gegevens, bedoeld in het eerste lid, onder a tot en met d, beschikbaar zijn gesteld door de
      verklaarder van het herstel van het virus SARS-CoV-2; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.6.c
    text: de herstelde persoon is ingeschreven in de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
  - number: 6.31b.7
    text: |-
      De beheerder en de toezichthouder kunnen de gegevens, bedoeld in [artikel 6.28, onder b][ref1], door middel van
      de applicatie, bedoeld in [artikel 58re, derde lid, van de wet][ref2] verwerken om te zien of het elektronisch of
      schriftelijk coronatoegangsbewijs geldig is en zo ja, wat de gegevens zijn, bedoeld in artikel 6.28, onder b, onder
      1°.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31b
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
      - id: ref2
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31c
    text: |-
      Een verzoek om een certificaat als bedoeld in [artikel 1 van het Tijdelijk besluit DCC][ref1] wordt tevens
      aangemerkt als een verzoek om een coronatoegangsbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0045651#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31c
    references:
      - id: ref1
        bwb_id: BWBR0045651
        artikel: '1'
  - number: 6.31d
    text: |-
      De geteste, gevaccineerde of herstelde persoon kan zijn persoonsgegevens, opgenomen in respectievelijk
      een namens Nederland op papier uitgegeven testcertificaat, vaccinatiecertificaat of herstelcertificaat
      als bedoeld in [artikel 8][ref1] of [9 van het Tijdelijk besluit DCC][ref2], met de applicatie, bedoeld
      in [artikel 58re, eerste lid, onderdeel a, onder 1°, van de wet][ref3], verwerken om een elektronisch
      coronatoegangsbewijs en respectievelijk een digitaal testcertificaat, vaccinatiecertificaat of herstelcertificaat
      aan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0045651#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045651#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31d
    references:
      - id: ref1
        bwb_id: BWBR0045651
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0045651
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31e.1
    text: |-
      Een persoon aan wie in een derde land als bedoeld in [verordening (EU) 2021/953](32853R2021) van het Europees
      Parlement en de Raad van 14 juni 2021 betreffende een kader voor de afgifte, verificatie en aanvaarding van
      interoperabele COVID-19-vaccinatie-, test- en herstelcertificaten (digitaal EU-COVID-certificaat) teneinde het
      vrije verkeer tijdens de COVID-19-pandemie te faciliteren (PbEU 2021, L 211) een vaccinatie is toegediend kan, mits
      deze persoon niet als ingezetene is ingeschreven in de basisregistratie personen, een coronatoegangsbewijs voor
      kort verblijf krijgen, indien deze persoon beschikt over:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.1.a
    text: 'een bewijs van vaccinatie waarvan de Minister van Volksgezondheid, Welzijn en Sport heeft getoetst dat:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.1.a.1°
    text: het op die persoon betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.1.a.2°
    text: |-
      de vaccinatie op het moment van de toets, bedoeld in het eerste lid, onder a, voldoet aan de voorwaarden, genoemd
      in [artikel 6.29, tweede lid, onder b, onder 1° en 2°, onder c, onder 1° en 2° en onder d][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.31e.1.a.3°
    text: |-
      de vaccinatie bestaat uit toediening van een vaccin dat is goedgekeurd door het College ter beoordeling van
      geneesmiddelen, het Europees Geneesmiddelenbureau of de Wereldgezondheidsorganisatie; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.1.b
    text: een geldige negatieve testuitslag.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.2
    text: |-
      Ten behoeve van de toets, bedoeld in het eerste lid, onder a, overlegt de persoon, bedoeld in het eerste lid, aan
      de Minister van Volksgezondheid, Welzijn en Sport:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.2.a
    text: |-
      een geldig identiteitsdocument als bedoeld in als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1]
      of [artikel 2 van de Wet identificatieplicht BES][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0028575#Artikel2
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0028575
        artikel: '2'
  - number: 6.31e.2.b
    text: |-
      een vaccinatiebewijs als bedoeld in [artikel 6.31a, zevende lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.31e.3
    text: 'De Minister van Volksgezondheid, Welzijn en Sport verwerkt:'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.a
    text: |-
      ten behoeve van de toets, bedoeld in het eerste lid, onder a, de volgende gegevens van de persoon, bedoeld in het
      eerste lid:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.a.1°
    text: naam;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.a.2°
    text: geboortedatum;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.a.3°
    text: e-mailadres;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.a.4°
    text: telefoonnummer; en
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.a.5°
    text: |-
      het gegeven dat het vaccinatiebewijs en de vaccinatie voldoen aan de voorwaarden, genoemd in het eerste lid, onder
      a, en de datum en het tijdstip waarop dit is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.b
    text: |-
      in het geval bij de toets blijkt dat de persoon, bedoeld in het eerste lid, als ingezetene ingeschreven staat in de
      basisregistratie personen, de volgende gegevens van deze persoon:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.3.b.1°
    text: |-
      het burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref1];
      en


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: 6.31e.3.b.2°
    text: woonplaats in Nederland, indien van toepassing.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.4
    text: |-
      De Minister van Volksgezondheid, Welzijn en Sport verstrekt op verzoek van de persoon, bedoeld in het eerste lid,
      gedaan met een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde applicatie ten behoeve
      van een elektronisch of schriftelijk coronatoegangsbewijs voor kort verblijf de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.4.a
    text: de naam en de geboortedatum van de persoon;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.4.b
    text: |-
      het gegeven dat het overgelegde vaccinatiebewijs en de vaccinatie voldoen aan de voorwaarden, genoemd in het eerste
      lid, onder a, en de datum en het tijdstip waarop dit is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.4.c
    text: een code voor het opvragen van de gegevens, bedoeld onder a en b.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.5
    text: |-
      De persoon, bedoeld in het eerste lid, die een verzoek doet als bedoeld in het vierde lid, kan, in combinatie met
      een verzoek als bedoeld in [artikel 6.31, eerste lid][ref1], tot veertien dagen na de datum en het tijdstip genoemd
      in het derde lid, onder e, met de gegevens, bedoeld in het vierde lid, onder a en b, en met de gegevens, bedoeld in
      artikel 6.31, eerste lid, onder a tot en met d, door middel van:


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.31e.5.a
    text: |-
      de applicatie, bedoeld in [artikel 58re, eerste lid, onder a, onder 1°, van de wet][ref1] een elektronisch
      coronatoegangsbewijs voor kort verblijf aanmaken;


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
  - number: 6.31e.5.b
    text: |-
      een door de Minister van Volksgezondheid, Welzijn en Sport beschikbaar gestelde webapplicatie een
      coronatoegangsbewijs voor kort verblijf aanmaken om op papier af te drukken.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.6
    text: |-
      Een coronatoegangsbewijs voor kort verblijf is gedurende een periode van ten hoogste veertien dagen geldig, welke
      termijn aanvangt op het tijdstip, genoemd in het derde lid, onder a, onder 5°, ongeacht het tijdstip waarop de
      persoon, bedoeld in het eerste lid, op de in het vijfde lid beschreven wijze een coronatoegangsbewijs voor kort
      verblijf heeft aangemaakt.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.7
    text: |-
      Bij de uitvoering van het vierde en vijfde lid en het gebruik van de in het vijfde lid bedoelde applicatie wordt
      het IP-adres verwerkt dat de persoon, bedoeld in het eerste lid, gebruikt.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
  - number: 6.31e.8
    text: |-
      [Artikel 6.31a, elfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.31e
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.32.1
    text: |-
      De applicatie, bedoeld in [artikel 58re, derde lid, van de wet][ref1], voor het lezen van het elektronisch of
      schriftelijk coronatoegangsbewijs maakt gedurende ten hoogste 240 seconden zichtbaar of de QR-code een geldig
      coronatoegangsbewijs bevat en zo ja, wat de gegevens zijn, bedoeld in [artikel 6.31, eerste lid, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58re
      [ref2]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.32
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58re
      - id: ref2
        bwb_id: BWBR0044416
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.11'
  - number: 6.32.2
    text: |-
      Het coronatoegangsbewijs wordt als ongeldig aangemerkt indien het is opgenomen in een door de Minister van
      Volksgezondheid, Welzijn en Sport aangelegde lijst van coronatoegangsbewijzen waarvan bij de Minister van
      Volksgezondheid, Welzijn en Sport het gegronde vermoeden bestaat dat handelingen zijn verricht met of met
      betrekking tot het coronatoegangsbewijs, die het vertrouwen in het coronatoegangsbewijs hebben geschaad of zullen
      schaden.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.32
  - number: 6.32.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing op een certificaat als bedoeld in
      [artikel 1 van het Tijdelijk besluit DCC][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045651#Artikel1
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.32
    references:
      - id: ref1
        bwb_id: BWBR0045651
        artikel: '1'
  - number: 6.33.1
    text: |-
      De vaststelling dat een persoon vanwege een beperking of een ziekte geen test kan ondergaan die nodig is om de
      voorgeschreven testuitslag te verkrijgen of als gevolg van een dergelijke test ernstig ontregeld raakt, geschiedt
      overeenkomstig een door de Minister van Volksgezondheid, Welzijn en Sport vast te stellen protocol.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.33
  - number: 6.33.2
    text: |-
      In het protocol, bedoeld in het eerste lid, wordt tevens bepaald op welke wijze een persoon als bedoeld in het
      eerste lid toegang geboden kan worden tot activiteiten of voorzieningen waarvoor het beschikken over een resultaat
      krachtens de [wet][ref1] is voorgeschreven alsmede welke verwerking van persoonsgegevens daarvoor noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0024705
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.33
    references:
      - id: ref1
        bwb_id: BWBR0024705
  - number: 6.33.3
    text: |-
      De persoon, bedoeld in het eerste lid, neemt bij deelname aan activiteiten of toegang tot voorzieningen waarvoor
      een coronatoegangsbewijs is voorgeschreven passende maatregelen die redelijkerwijze verlangd kunnen worden om
      eventuele overdracht van het virus SARS-CoV-2 te voorkomen.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel6.33
  - number: '7.1'
    text: |-
      [Artikel 58l, tweede tot en met vierde lid, van de wet][ref1] is niet van toepassing op gebouwen en plaatsen als
      bedoeld in [artikel 6, tweede lid, van de Grondwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024705#Artikel58l
      [ref2]: https://wetten.overheid.nl/BWBR0001840#Artikel6
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0024705
        artikel: 58l
      - id: ref2
        bwb_id: BWBR0001840
        artikel: '6'
  - number: '7.2'
    text: |-
      De Minister van Volksgezondheid, Welzijn en Sport kan hoogrisicogebieden en zeer hoogrisicogebieden aanwijzen en
      houdt daarbij in ieder geval rekening met:
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.2
  - number: 7.2.a
    text: |-
      de incidentie van het virus SARS-CoV-2 in een gebied gedurende de periode van veertien dagen voorafgaand aan de
      aanwijzing;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.2
  - number: 7.2.b
    text: de incidentie van zorgwekkende varianten van het virus SARS-CoV-2 in een gebied;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.2
  - number: 7.2.c
    text: de betrouwbaarheid van gegevens over de incidentie van het virus SARS-CoV-2 in een gebied;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.2
  - number: 7.2.d
    text: de mate en de kwaliteit van het sequencen van testuitslagen ten aanzien van de infectie met het virus SARS-CoV-2;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.2
  - number: 7.2.e
    text: het aantal testen op infectie met het virus SARS-CoV-2, dat in een gebied plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.2
  - number: 7.2.f
    text: het ontbreken van gegevens over de epidemiologische situatie rond het virus SARS-CoV-2 in een gebied.
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel7.2
  - number: '8.1'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop
      [artikel I, onderdeel A, van de Tijdelijke wet maatregelen covid-19][ref1] in werking treedt en vervalt op het
      tijdstip waarop [hoofdstuk Va van de wet][ref2] vervalt.


      [ref1]: https://wetten.overheid.nl/BWBR0044337#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0024705#HoofdstukVa
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0044337
        artikel: I
      - id: ref2
        bwb_id: BWBR0024705
        hoofdstuk: Va
  - number: '8.2'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling maatregelen covid-19.'
    url: https://wetten.overheid.nl/BWBR0044416/2022-03-23#Artikel8.2
