  - number: '8'
    text: |-
      1. Wordt de recuperatie als bedoeld in [artikel 7, vierde lid][ref1], in Nederland doorgebracht, of in een ander
      land indien de militair daar is geplaatst en woonachtig is, wordt de betreffende retourreis éénmaal gedurende een
      uitzendingsperiode van zes maanden voor rekening van Defensie gemaakt. Indien de uitzendperiode langer duurt dan 12
      maanden kan de betreffende retourreis één maal per vier maanden voor rekening van defensie worden gemaakt.

      2. Voor het maken van de recuperatiereis dient gebruik te worden gemaakt van het door de Koninklijke Luchtmacht
      ingezette luchttransport. Indien een dergelijk transport ontbreekt dan wel niet beschikbaar is, kan bij
      uitzondering gebruik worden gemaakt van een commerciële retourvlucht voor rekening van Defensie.

      3. Het alsdan verstrekte vervoerbewijs is strikt persoonlijk en kan niet worden vervreemd of verhandeld. Indien
      het vervoerbewijs niet wordt gebruikt, dient dit onverwijld te worden ingeleverd bij de verstrekkende Defensie-
      instantie. Het is niet toegestaan om het vervoersbewijs in te wisselen tegen geld of andere waarden.

      4. Indien om welke reden dan ook geen gebruik is gemaakt van luchttransport van de Koninklijke Luchtmacht of van
      het vervoerbewijs van een commercieel vervoerbedrijf, wordt geen vervangend vervoerbewijs of een tegemoetkoming dan
      wel een vergoeding in geld toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0039789#Artikel7
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel8
    references:
