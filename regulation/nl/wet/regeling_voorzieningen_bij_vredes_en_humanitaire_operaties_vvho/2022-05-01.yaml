  - number: '10'
    text: |-
      1. De militair wordt aansluitend op de definitieve terugkeer uit het operatiegebied door de Commandant der
      Strijdkrachten vrijgesteld van zijn normale werkzaamheden en diensten.

      2. De vrijstelling bedraagt tien werkdagen na een inzet met een duur van tenminste zes achtereenvolgende maanden,
      dan wel een evenredig deel daarvan bij een inzet met een kortere duur.
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel10
  - number: 10a
    text: |-
      1. De defensieambtenaar die gedurende ten minste 365 dagen heeft deelgenomen aan vredesoperaties dan wel
      humanitaire operaties als bedoeld in tabel 3 en 4 bij deze regeling, heeft aanspraak op een eenmalige gratificatie
      van € 1.000.

      2. Voor de berekening van de periode bedoeld in het eerste lid worden slechts periodes van ten minste 30 dagen in
      beschouwing genomen.

      3. In afwijking van het eerste lid worden voor de berekening van de periode bedoeld in het eerste lid ook deelnames
      aan vredes- of humanitaire missies in beschouwing genomen die voorafgaand aan de totstandkoming van deze regeling
      hebben plaatsgevonden.

      4. De loonheffing en inhoudingen, bedoeld in
      [paragraaf 5 van de Wet financiële voorzieningen privatisering ABP][ref1], die zijn verschuldigd over de in het
      eerste lid bedoelde gratificatie, komen voor rekening van Defensie.


      [ref1]: https://wetten.overheid.nl/BWBR0007211#Paragraaf5
