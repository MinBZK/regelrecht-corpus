  - number: '9'
    text: |-
      1. Aan de militair wordt gedurende de inzet geen verlof op grond van
      [hoofdstuk 8 van het Algemeen militair ambtenarenreglement][ref1] verleend, tenzij de Commandant der Strijdkrachten
      die verlofverlening noodzakelijk acht.

      2. Vrijstelling van werkzaamheden in het kader van werk- en rusttijden, alsmede verlof verleend door of vanwege
      het orgaan, is geen verlof als bedoeld in [hoofdstuk 8 van het Algemeen militair ambtenarenreglement][ref2]. Voor
      zover vorenbedoelde vrije tijd of verlof niet reeds is genoten, vervallen deze bij definitief vertrek uit het
      operatiegebied.

      3. Tijdens verlof, bedoeld in het eerste lid, bestaat geen aanspraak op de voorzieningen bedoeld in
      [paragraaf 2][ref3].

      4. In afwijking van het gestelde in het derde lid bestaat aanspraak op de voorzieningen bedoeld in
      [paragraaf 2][ref4] gedurende de periode dat een militair in verband met bijzonder verlof buiten het missiegebied
      verblijft in verband met:

      a. ernstige ziekte van de echtgenote of echtgenoot van de militair, de persoon met wie de militair ongehuwd
      samenwoont of een van zijn bloed- of aanverwanten in de eerste graad;

      b. de bevalling van zijn echtgenote of de persoon met wie de militair ongehuwd samenwoont;

      c. het overlijden en lijkbezorging van de echtgenote of echtgenoot van de militair, de persoon met wie de militair
      ongehuwd samenwoont of een van zijn bloed- en aanverwanten in de eerste graad.

      zulks met een maximum van 14 dagen.


      [ref1]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk8
      [ref3]: https://wetten.overheid.nl/BWBR0039789#Paragraaf2
      [ref4]: https://wetten.overheid.nl/BWBR0039789#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel9
