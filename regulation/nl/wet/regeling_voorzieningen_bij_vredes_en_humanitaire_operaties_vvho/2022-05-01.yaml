  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *operatie:* 1°. een door de Minister als vredesoperatie aangemerkte daadwerkelijke militaire inzet buiten
      Nederland voor vredesafdwingende of vredeshandhavende taken in internationaal of bondgenootschappelijk verband of
      een andere door de Minister aangemerkte vorm van daadwerkelijke militaire inzet buiten Nederland; 2°. een door de
      Minister als humanitaire operatie aangemerkte daadwerkelijke militaire inzet buiten Nederland voor hulpverlenende
      taken;
        - *orgaan:*
        - een orgaan van de Verenigde Naties, een bondgenootschappelijk orgaan, bondgenootschappelijke strijdkrachten of
      een andere internationaalrechtelijke organisatie;
        - *inzet:*
        - het verblijf buiten de standplaats ten behoeve van het verrichten van werkzaamheden in het kader van een operatie,
      niet zijnde een detachering of een verplaatsing als bedoeld in het [Verplaatsingskostenbesluit militairen][ref1],
      of een dienstreis als bedoeld in het [Besluit dienstreizen defensie][ref2];
        - *operatiegebied:*
        - het door de Commandant der Strijdkrachten aangegeven gebied waarbinnen de operatie wordt uitgevoerd;
        - *recuperatie:*
        - een periode, niet zijnde verlof, waarin aan de militair geen feitelijke werkzaamheden worden opgedragen, opdat
      door afwisseling van inzet en rust de gewenste operationele inzetbaarheid wordt gehandhaafd.


      [ref1]: https://wetten.overheid.nl/BWBR0005137
      [ref2]: https://wetten.overheid.nl/BWBR0007956
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel1
