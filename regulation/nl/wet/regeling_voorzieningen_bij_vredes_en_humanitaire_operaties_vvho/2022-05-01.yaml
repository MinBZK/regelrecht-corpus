  - number: '3'
    text: |-
      1. De aanspraak van de militair op voorzieningen ingevolge deze regeling vangt aan:

      a. indien de militair vertrekt vanuit Nederland naar het operatiegebied: op de dag van vertrek van een grensstation
      of -overgang, uit de laatste haven of van het laatste vliegveld in Nederland dan wel;

      b. indien de militair vertrekt vanuit het land van plaatsing buiten Nederland naar het operatiegebied: op de dag
      van vertrek van een grensstation of -overgang, uit de laatste haven of van het laatste vliegveld aldaar dan wel;

      c. indien de militair vertrekt aan boord van een oorlogsschip buiten Nederland naar het operatiegebied: op de door
      de minister bepaalde vertrekdag van het schip naar het operatiegebied;

      en eindigt:

      d. indien de militair terugkeert in Nederland vanuit het operatiegebied: op de dag van aankomst bij een
      grensstation of -overgang, in de eerste haven of op het eerste vliegveld in Nederland;

      e. indien de militair terugkeert in het land van plaatsing buiten Nederland vanuit het operatiegebied: op de dag
      van aankomst bij een grensstation of -overgang, in de eerste haven of op het eerste vliegveld aldaar;

      f. indien de militair aan boord van een oorlogsschip vertrekt uit het operatiegebied en niet eerst terugkeert in
      Nederland of het land van plaatsing: op de door de minister bepaalde dag waarop het schip aanvangt met zijn nieuwe
      opdracht,

      waarbij de dag van vertrek en de dag van terugkeer tezamen als één dag worden gerekend.

      2. Indien het noodzakelijk is dat een militair tijdelijk wordt ingezet buiten het operatiegebied, kan de Commandant
      der Strijdkrachten bepalen dat de aanspraak op de voorzieningen gedurende de tijdelijke inzet blijft bestaan.

      3. Gedurende de periode van recuperatie blijft de aanspraak op de voorzieningen bestaan.
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel3
  - number: '4'
    text: |-
      Indien de militair uit anderen hoofde aanspraak heeft op overeenkomstige voorzieningen als genoemd in
      [artikel 5][ref1], [artikel 6][ref2] en [artikel 8][ref3] wordt de waarde van die aanspraak in mindering gebracht
      op de aanspraak ingevolge deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0039789#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0039789#Artikel6
