  - number: '2'
    text: |-
      1. Deze regeling is van toepassing op de militair die is ingezet in het kader van een operatie. Een overzicht van
      de operaties als bedoeld in [artikel 1][ref1], onderdeel a, onder 1°, is opgenomen in tabel 3. Een overzicht van de
      operaties als bedoeld in artikel 1, onderdeel a, onder 2°, is opgenomen in tabel 4.

      2. Op de militair is niet van toepassing [hoofdstuk 7 van het Algemeen militair ambtenarenreglement][ref2], met
      uitzondering van [artikel 54e, tweede lid][ref3], voor zover de verkorting van de arbeidsduur wordt toegekend in de
      vorm van spaaruren. De werk- en rusttijden van de militair worden bepaald aan de hand van hetgeen in het belang van
      de dienst tijdens de operatie noodzakelijk is.

      3. Voor de toepassing van deze regeling wordt Caribisch Nederland beschouwd als een land buiten Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0039789#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003482#Hoofdstuk7
      [ref3]: https://wetten.overheid.nl/BWBR0003482#Artikel54e
