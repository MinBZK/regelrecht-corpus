  - number: '5'
    text: |-
      1. De militair heeft aanspraak op:

      a. huisvesting en voeding vanwege en voor rekening van het Rijk;

      b. een tegemoetkoming in de onkosten volgens tabel 1.

      2. Indien – in bijzondere gevallen – om redenen van dienst geen gebruik kan worden gemaakt van rijkswege verstrekte
      huisvesting of voeding en hierin ook niet op andere wijze wordt voorzien, kunnen de noodzakelijk te maken kosten
      voor huisvesting en voeding voor het gehele operatiegebied worden vergoed tot maximaal de vergoedingen op basis van
      de [Regeling dienstreizen defensie, bijlage C](onbekend), Nederland.

      3. Onder onkosten wordt verstaan de tijdens de inzet bij operaties door de militair gedane uitgaven wegens
      bewassing, (tele)communicatie, ontspanning, recuperatie en overige incidentele kosten.
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel5
  - number: '6'
    text: |-
      De militair heeft aanspraak op een vergoeding voor de bij operatie ondervonden extra werkdruk die een gevolg is van
      de inzet. De vergoeding is vastgesteld in de vorm van een afkoopsom, en bedraagt € 98,51 per dag.
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel6
  - number: '7'
    text: |-
      1. De Commandant der Strijdkrachten kan, indien operationele omstandigheden dat noodzakelijk en mogelijk maken,
      recuperatie verlenen.

      2. Recuperatie wordt slechts verleend aan personeel dat is ingezet onder operationele omstandigheden, teneinde dat
      personeel een rustperiode te gunnen alvorens de inzet wordt voortgezet.

      3. Recuperatie wordt geleid doorgebracht in of in de directe nabijheid van het operatiegebied. De Commandant der
      Strijdkrachten geeft aanwijzingen met betrekking tot de wijze van het doorbrengen daarvan. In dat geval worden
      vanwege Defensie de faciliteiten vervoer, huisvesting en voeding ter beschikking gesteld.

      4. Op verzoek van de militair kan de Commandant der Strijdkrachten, indien de uitzendduur tenminste vier maanden
      bedraagt, toestaan dat de militair de recuperatie voor eigen rekening en risico elders doorbrengt. In dat geval
      bestaat daarvoor geen aanspraak op vergoeding van verblijfskosten. Voor de vaststelling van de duur van de
      recuperatie wordt per maand inzet 2,5 dag recuperatie opgebouwd.

      5. Indien na beëindiging van de deelname aan de operatie blijkt dat sprake is geweest van onafgebroken inzet,
      zonder dat de militair de gelegenheid is geboden tussentijds te recupereren, verleent de commandant, onverminderd
      [artikel 10][ref1], na definitieve terugkeer van de militair uit het operatiegebied, extra vrije tijd voor de duur
      van één werkdag per maand inzet.


      [ref1]: https://wetten.overheid.nl/BWBR0039789#Artikel10
    url: https://wetten.overheid.nl/BWBR0039789/2022-05-01#Artikel7
    references:
