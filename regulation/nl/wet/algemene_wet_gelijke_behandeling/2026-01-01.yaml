  - number: '6'
    text: |-
      Onderscheid is verboden met betrekking tot de voorwaarden voor en de toegang tot het vrije beroep en de
      mogelijkheden tot uitoefening van en ontplooiing binnen het vrije beroep.
    url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#Artikel6
  - number: 6a
    text: |-
      1 Onderscheid is verboden bij het lidmaatschap van of de betrokkenheid bij een werkgevers- of werknemersorganisatie
      of een vereniging van beroepsgenoten, alsmede bij de voordelen die uit dat lidmaatschap of uit die betrokkenheid
      voortvloeien.

      2 Het eerste lid laat onverlet dat:

      a. een op godsdienstige of levensbeschouwelijke grondslag gebaseerde organisatie of vereniging, of

      b. een op politieke grondslag gebaseerde organisatie of vereniging,

      ten aanzien van personen die door een lidmaatschap of anderszins bij haar betrokken zijn onderscheid mag maken
      op grond van godsdienst, levensovertuiging of politieke gezindheid, voor zover deze kenmerken vanwege de aard
      van de betrokkenheid of de context waarin specifieke activiteiten worden uitgeoefend een wezenlijk, legitiem en
      gerechtvaardigd vereiste vormen, gezien de grondslag van de organisatie of vereniging. Een zodanig onderscheid
      mag niet verder gaan dan passend is, gelet op de houding van goede trouw en loyaliteit aan de grondslag van de
      organisatie of vereniging die van de daarbij betrokkenen mag worden verlangd, en mag niet leiden tot onderscheid op
      een andere in [artikel 1][ref1] genoemde grond, onverminderd [artikel 2, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel2
    url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#Artikel6a
