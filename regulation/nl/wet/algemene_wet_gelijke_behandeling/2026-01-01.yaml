  - number: 7a
    text: |-
      1 Onverminderd [artikel 7][ref1] is onderscheid op grond van ras verboden bij sociale bescherming, daaronder
      begrepen sociale zekerheid, en sociale voordelen.

      2 Bij algemene maatregel van bestuur kunnen de begrippen sociale bescherming, sociale zekerheid en sociale
      voordelen, bedoeld in het eerste lid, worden omschreven. De voordracht voor een krachtens de eerste volzin vast te
      stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel7
    url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#Artikel7a
