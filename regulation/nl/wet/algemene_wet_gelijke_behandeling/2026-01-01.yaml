  - number: '5'
    text: |-
      1 Onderscheid is verboden bij:

      a. de aanbieding van een betrekking en de behandeling bij de vervulling van een openstaande betrekking;

      b arbeidsbemiddeling;

      c. het aangaan en het beëindigen van een arbeidsverhouding;

      d. het aanstellen of ontslaan van personen, op wie [artikel 3 van de Ambtenarenwet 2017][ref1] van toepassing is en
      het aanstellen of ontslaan van ambtenaren als bedoeld in de [Ambtenarenwet BES][ref2];

      e. arbeidsvoorwaarden;

      f. het laten volgen van onderwijs, scholing en vorming tijdens of voorafgaand aan een arbeidsverhouding;

      g. bevordering;

      h. arbeidsomstandigheden.

      2 Het eerste lid laat onverlet dat:

      a. een instelling op godsdienstige of levensbeschouwelijke grondslag,

      b. een instelling van bijzonder onderwijs, of

      c. een instelling op politieke grondslag,

      ten aanzien van personen die voor haar werkzaam zijn onderscheid mag maken op grond van godsdienst,
      levensovertuiging of politieke gezindheid, voor zover deze kenmerken vanwege de aard van de betrokken specifieke
      beroepsactiviteit of de context waarin deze wordt uitgeoefend een wezenlijk, legitiem en gerechtvaardigd
      beroepsvereiste vormen, gezien de grondslag van de instelling. Een zodanig onderscheid mag niet verder gaan dan
      passend is, gelet op de houding van goede trouw en loyaliteit aan de grondslag van de instelling die van de voor
      haar werkzame personen mag worden verlangd, en mag niet leiden tot onderscheid op een andere in [artikel 1][ref3]
      genoemde grond, onverminderd [artikel 2, eerste lid][ref4].

      2a Het eerste lid laat tevens onverlet de vrijheid van gemeenten om onderscheid te maken op grond van godsdienst
      of levensovertuiging ten aanzien van een ambtenaar of buitengewoon ambtenaar van de burgerlijke stand die in de
      uitoefening van zijn ambt onderscheid maakt, tenzij het door hem gemaakte onderscheid is gebaseerd op een algemeen
      verbindend voorschrift.

      3 Het eerste lid is niet van toepassing indien:

      a. de werkverhouding een privékarakter heeft,

      b. het verschil in behandeling berust op een kenmerk dat verband houdt met godsdienst, levensovertuiging, politieke
      gezindheid, ras, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat, en

      c. dat kenmerk vanwege de aard van de betrokken specifieke beroepsactiviteit of de context waarin deze wordt
      uitgeoefend, een wezenlijk en bepalend beroepsvereiste vormt, mits het doel legitiem is en het vereiste evenredig
      is aan dat doel.

      4 Het eerste lid is niet van toepassing op eisen met betrekking tot de politieke gezindheid die in redelijkheid
      kunnen worden gesteld in verband met de vervulling van functies in bestuursorganen en adviesorganen.

      5 Het eerste lid is niet van toepassing op eisen met betrekking tot de politieke gezindheid die in redelijkheid
      kunnen worden gesteld in verband met de vervulling van vertrouwensfuncties.

      6 Het eerste lid, onderdeel e, is niet van toepassing op onderscheid op grond van
      burgerlijke staat met betrekking tot nabestaandenpensioen-voorzieningen en met
      betrekking tot aanspraken op pensioen die vóór de datum van inwerkingtreding van
