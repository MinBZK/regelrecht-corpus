preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om, mede in verband met artikel 1 van de Grondwet,
    ter bevordering van de deelneming op gelijke voet aan het maatschappelijk leven bescherming te bieden tegen
    discriminatie op grond van godsdienst, levensovertuiging, politieke gezindheid, ras, geslacht, nationaliteit,
    hetero- of homoseksuele gerichtheid of burgerlijke staat, dat het daarom wenselijk is behoudens wettelijke
    uitzonderingen onderscheid op deze gronden te verbieden en dat het in verband met de handhaving van dit verbod
    wenselijk is een Commissie gelijke behandeling in te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. onderscheid: direct en indirect onderscheid, alsmede de opdracht daartoe;

      b. direct onderscheid: indien een persoon op een andere wijze wordt behandeld dan een ander in een vergelijkbare
      situatie wordt, is of zou worden behandeld, op grond van godsdienst, levensovertuiging, politieke gezindheid, ras,
      geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat;

      c. indirect onderscheid: indien een ogenschijnlijk neutrale bepaling, maatstaf of handelwijze personen met een
      bepaalde godsdienst, levensovertuiging, politieke gezindheid, ras, geslacht, nationaliteit, hetero- of homoseksuele
      gerichtheid of burgerlijke staat in vergelijking met andere personen bijzonder treft.

      2 Onder onderscheid op grond van geslacht wordt mede verstaan onderscheid op grond van geslachtskenmerken,
      genderidentiteit en genderexpressie.

      3 Onder direct onderscheid op grond van geslacht wordt mede verstaan onderscheid op grond van zwangerschap,
      bevalling en moederschap.
    url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#Artikel1
  - number: 1a
    text: |-
      1 Het in deze wet neergelegde verbod van onderscheid houdt mede in een verbod van intimidatie en een verbod van
      seksuele intimidatie.

      2 Onder intimidatie als bedoeld in het eerste lid wordt verstaan: gedrag dat met de hoedanigheden of gedragingen,
      bedoeld in [artikel 1, eerste lid, onderdeel b][ref1], verband houdt en dat tot doel of gevolg heeft dat de
      waardigheid van de persoon wordt aangetast en dat een bedreigende, vijandige, beledigende, vernederende of
      kwetsende omgeving wordt gecreëerd.

      3 Onder seksuele intimidatie als bedoeld in het eerste lid wordt verstaan: enige vorm van verbaal, non-verbaal
      of fysiek gedrag met een seksuele connotatie dat als doel of gevolg heeft dat de waardigheid van de persoon wordt
      aangetast, in het bijzonder wanneer een bedreigende, vijandige, beledigende, vernederende of kwetsende omgeving
      wordt gecreëerd.

      4 Op het in deze wet neergelegde verbod van intimidatie en van seksuele intimidatie zijn niet van
      toepassing de [artikelen 2][ref2], [5, tweede tot en met zesde lid][ref3], [6a, tweede lid][ref4], en
      [7, tweede en derde lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1
