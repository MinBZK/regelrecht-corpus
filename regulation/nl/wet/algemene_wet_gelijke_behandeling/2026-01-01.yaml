  - number: 8a
    text: |-
      1 Het is verboden personen te benadelen wegens het feit dat zij in of buiten rechte een beroep hebben gedaan op
      deze wet of ter zake bijstand hebben verleend.

      2 Het feit dat een persoon het in [artikel 1a, tweede en derde lid][ref1], bedoelde gedrag afwijst of lijdzaam
      ondergaat, mag niet ten grondslag liggen aan een beslissing die die persoon treft.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1a
