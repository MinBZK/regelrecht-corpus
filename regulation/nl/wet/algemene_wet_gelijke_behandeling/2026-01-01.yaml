  - number: '2'
    text: |-
      1 Het in deze wet neergelegde verbod van onderscheid geldt niet ten aanzien van indirect onderscheid indien dat
      onderscheid objectief gerechtvaardigd wordt door een legitiem doel en de middelen voor het bereiken van dat doel
      passend en noodzakelijk zijn.

      2 Het in deze wet neergelegde verbod van onderscheid op grond van geslacht geldt niet:

      a. in gevallen waarin het geslacht bepalend is;

      b. in gevallen waarin het de bescherming van de vrouw betreft, en

      c. in verband met zwangerschap en moederschap.

      3 Het in deze wet neergelegde verbod van onderscheid geldt niet, indien het onderscheid een specifieke maatregel
      betreft die tot doel heeft vrouwen of personen behorende tot een bepaalde etnische of culturele minderheidsgroep
      een bevoorrechte positie toe te kennen ten einde feitelijke nadelen verband houdende met de gronden ras of geslacht
      op te heffen of te verminderen en het onderscheid in een redelijke verhouding staat tot dat doel.

      4 Het in deze wet neergelegde verbod van onderscheid op grond van ras geldt niet:

      a. in gevallen waarin uiterlijke kenmerken die samenhangen met het ras van een persoon bepalend zijn, mits het doel
      legitiem en het vereiste evenredig aan dat doel is;

      b. indien het onderscheid betrekking heeft op uiterlijke kenmerken die samenhangen met het ras van een persoon
      en vanwege de aard van de betrokken specifieke beroepsactiviteit of de context waarin deze wordt uitgeoefend, een
      wezenlijk en bepalend beroepsvereiste vormt, mits het doel legitiem is en het vereiste evenredig aan dat doel is.

      5 Het in deze wet neergelegde verbod van onderscheid op grond van nationaliteit geldt niet:

      a. indien het onderscheid is gebaseerd op algemeen verbindende voorschriften of geschreven of ongeschreven regels
      van internationaal recht en

      b. in gevallen waarin de nationaliteit bepalend is.

      6 Bij algemene maatregel van bestuur worden de in het tweede, vierde en vijfde lid, onderdeel *b*, bedoelde
      gevallen nader omschreven.
    url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#Artikel2
  - number: '3'
    text: |-
      Deze wet is niet van toepassing op:

      a. rechtsverhoudingen binnen kerkgenootschappen alsmede hun zelfstandige onderdelen en lichamen waarin zij zijn
      verenigd, alsmede binnen andere genootschappen op geestelijke grondslag;

      b. het geestelijk ambt.
    url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#Artikel3
  - number: '4'
    text: |-
      Deze wet laat onverlet:

      a. de [Wet gelijke behandeling van mannen en vrouwen][ref1];

      b. de [artikelen 646][ref2], [667][ref3] en [670 van Boek 7 van het Burgerlijk Wetboek][ref4].


