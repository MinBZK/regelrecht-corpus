    text: Bedingen in strijd met deze wet zijn nietig.
    url: https://wetten.overheid.nl/BWBR0006502/2026-01-01#Artikel9
  - number: '10'
    text: |-
      1 Indien degene die meent dat in zijn nadeel een onderscheid is of wordt gemaakt als bedoeld in deze wet, in rechte
      feiten aanvoert die dat onderscheid kunnen doen vermoeden, dient de wederpartij te bewijzen dat niet in strijd met
      deze wet is gehandeld.

      2 Het eerste lid is van overeenkomstige toepassing op vorderingen als
      bedoeld in [artikel 305a van Boek 3 van het Burgerlijk Wetboek][ref1] of
      [artikel 305a van Boek 3 van het Burgerlijk Wetboek BES][ref2] en op beroepen ingesteld in bestuursrechtelijke
      procedures door belanghebbenden in de zin van [artikel 1:2, derde lid, van de Algemene wet bestuursrecht][ref3] of
      [artikel 7, eerste lid, derde zin, van de Wet administratieve rechtspraak BES][ref4].


