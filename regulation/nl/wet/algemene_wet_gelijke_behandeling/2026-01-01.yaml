  - number: '8'
    text: |-
      In geval van een beëindiging van de arbeidsverhouding door de werkgever in strijd met [artikel 5][ref1],
      of wegens de omstandigheid dat de werknemer in of buiten rechte een beroep heeft gedaan op artikel 5
      of ter zake bijstand heeft verleend, is [artikel 681 van Boek 7 van het Burgerlijk Wetboek][ref2] of
      [artikel 1615s van Boek 7a van het Burgerlijk Wetboek BES][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel681
      [ref3]: https://wetten.overheid.nl/BWBR0028752#Artikel1615s
