  - number: '7'
    text: |-
      1 Onderscheid is verboden bij het aanbieden van of verlenen van toegang tot goederen of diensten en bij het
      sluiten, uitvoeren of beëindigen van overeenkomsten ter zake, alsmede bij het geven van loopbaanoriëntatie en
      advies of voorlichting over school- of beroepskeuze, indien dit geschiedt:

      a. in de uitoefening van een beroep of bedrijf;

      b. door de openbare dienst;

      c. door instellingen die werkzaam zijn op het gebied van volkshuisvesting, welzijn, gezondheidszorg, cultuur of
      onderwijs of

      d. door natuurlijke personen die niet handelen in de uitoefening van een beroep of bedrijf, voor zover het aanbod
      in het openbaar geschiedt.

      2 Het eerste lid, onderdeel c, laat onverlet dat een instelling van bijzonder onderwijs bij de toelating en ten
      aanzien van de deelname aan het onderwijs onderscheid mag maken op grond van godsdienst, levensovertuiging of
      geslacht, voor zover deze kenmerken vanwege de aard van het onderwijs een wezenlijk, legitiem en gerechtvaardigd
      vereiste vormen, gezien de grondslag van de instelling. Onderscheid op grond van geslacht is slechts toegestaan,
      indien voor alle leerlingen, ongeacht hun geslacht, gelijkwaardige voorzieningen aanwezig zijn. Een zodanig
      onderscheid mag niet verder gaan dan passend is, gelet op de houding van goede trouw en loyaliteit aan de grondslag
      van de instelling die van leerlingen mag worden verlangd en mag niet leiden tot onderscheid op een andere in
      [artikel 1][ref1] genoemde grond, onverminderd [artikel 2, eerste lid][ref2].

      3 Het eerste lid, onderdelen a en d, is niet van toepassing indien:

      a. de rechtsverhouding een privékarakter heeft,

      b. het verschil in behandeling berust op een kenmerk dat verband houdt met godsdienst, levensovertuiging, politieke
      gezindheid, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat, en

      c. het verschil in behandeling door een legitiem doel wordt gerechtvaardigd en de middelen voor het bereiken van
      dat doel passend en noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel2
