  - number: '6'
    text: |-
      Onderscheid is verboden met betrekking tot de voorwaarden voor en de toegang tot het vrije beroep en de
      mogelijkheden tot uitoefening van en ontplooiing binnen het vrije beroep.
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel6
  - number: 6a
    text: |-
      1 Onderscheid is verboden bij het lidmaatschap van of de betrokkenheid bij een werkgevers- of werknemersorganisatie
      of een vereniging van beroepsgenoten, alsmede bij de voordelen die uit dat lidmaatschap of uit die betrokkenheid
      voortvloeien.

      2 Het eerste lid laat onverlet:

      a. de vrijheid van een op godsdienstige of levensbeschouwelijke grondslag gebaseerde organisatie of vereniging
      om eisen te stellen, die gelet op haar doel, nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze
      eisen niet mogen leiden tot onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht,
      nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat en

      b. de vrijheid van een op politieke grondslag gebaseerde organisatie of vereniging om eisen te stellen, die gelet
      op haar doel, nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze eisen niet mogen leiden tot
      onderscheid op grond van het enkele feit van ras, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of
      burgerlijke staat.
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel6a
  - number: '7'
    text: |-
      1 Onderscheid is verboden bij het aanbieden van of verlenen van toegang tot goederen of diensten en bij het
      sluiten, uitvoeren of beëindigen van overeenkomsten ter zake, alsmede bij het geven van loopbaanoriëntatie en
      advies of voorlichting over school- of beroepskeuze, indien dit geschiedt:

      a. in de uitoefening van een beroep of bedrijf;

      b. door de openbare dienst;

      c. door instellingen die werkzaam zijn op het gebied van volkshuisvesting, welzijn, gezondheidszorg, cultuur of
      onderwijs of

      d. door natuurlijke personen die niet handelen in de uitoefening van een beroep of bedrijf, voor zover het aanbod
      in het openbaar geschiedt.

      2 Het eerste lid, onderdeel c, laat onverlet de vrijheid van een instelling van bijzonder onderwijs om bij
      de toelating en ten aanzien van de deelname aan het onderwijs eisen te stellen, die gelet op het doel van de
      instelling nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze eisen niet mogen leiden tot
      onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht, nationaliteit, hetero- of
      homoseksuele gerichtheid of burgerlijke staat. Onderscheid op grond van geslacht is alleen toegestaan, indien de
      eigen aard van de instelling dit eist en voor leerlingen van beide geslachten gelijkwaardige voorzieningen aanwezig
      zijn.

      3 Het eerste lid, onderdelen a en d, is niet van toepassing indien:

      a. de rechtsverhouding een privékarakter heeft,

      b. het verschil in behandeling berust op een kenmerk dat verband houdt met godsdienst, levensovertuiging, politieke
      gezindheid, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat, en

      c. het verschil in behandeling door een legitiem doel wordt gerechtvaardigd en de middelen voor het bereiken van
      dat doel passend en noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel7
  - number: 7a
    text: |-
      1 Onverminderd [artikel 7][ref1] is onderscheid op grond van ras verboden bij sociale bescherming, daaronder
      begrepen sociale zekerheid, en sociale voordelen.

      2 Bij algemene maatregel van bestuur kunnen de begrippen sociale bescherming, sociale zekerheid en sociale
      voordelen, bedoeld in het eerste lid, worden omschreven. De voordracht voor een krachtens de eerste volzin vast te
      stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers
      der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel7
