  - number: '5'
    text: |-
      1 Onderscheid is verboden bij:

      a. de aanbieding van een betrekking en de behandeling bij de vervulling van een openstaande betrekking;

      b arbeidsbemiddeling;

      c. het aangaan en het beëindigen van een arbeidsverhouding;

      d. het aanstellen tot ambtenaar en het beëindigen van het dienstverband van een ambtenaar;

      e. arbeidsvoorwaarden;

      f. het laten volgen van onderwijs, scholing en vorming tijdens of voorafgaand aan een arbeidsverhouding;

      g. bevordering;

      h. arbeidsomstandigheden.

      2 Het eerste lid laat onverlet:

      a. de vrijheid van een instelling op godsdienstige of levensbeschouwelijke grondslag om eisen te stellen, die gelet
      op het doel van de instelling, nodig zijn voor de vervulling van een functie, waarbij deze eisen niet mogen leiden
      tot onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht, nationaliteit, hetero- of
      homoseksuele gerichtheid of burgerlijke staat;

      b. de vrijheid van een instelling op politieke grondslag om eisen te stellen, die gelet op het doel van de
      instelling, nodig zijn voor de vervulling van een functie, waarbij deze eisen niet mogen leiden tot onderscheid
      op grond van het enkele feit van ras, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke
      staat en

      c. de vrijheid van een instelling van bijzonder onderwijs om eisen te stellen over de vervulling van een functie,
      die, gelet op het doel van de instelling, nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze
      eisen niet mogen leiden tot onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht,
      nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat.

      3 Het eerste lid is niet van toepassing indien:

      a. de werkverhouding een privékarakter heeft,

      b. het verschil in behandeling berust op een kenmerk dat verband houdt met godsdienst, levensovertuiging, politieke
      gezindheid, ras, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat, en

      c. dat kenmerk vanwege de aard van de betrokken specifieke beroepsactiviteit of de context waarin deze wordt
      uitgeoefend, een wezenlijk en bepalend beroepsvereiste vormt, mits het doel legitiem is en het vereiste evenredig
      is aan dat doel.

      4 Het eerste lid is niet van toepassing op eisen met betrekking tot de politieke gezindheid die in redelijkheid
      kunnen worden gesteld in verband met de vervulling van functies in bestuursorganen en adviesorganen.

      5 Het eerste lid is niet van toepassing op eisen met betrekking tot de politieke gezindheid die in redelijkheid
      kunnen worden gesteld in verband met de vervulling van vertrouwensfuncties.

      6 Het eerste lid, onderdeel e, is niet van toepassing op onderscheid op grond van
      burgerlijke staat met betrekking tot nabestaandenpensioen-voorzieningen en met
      betrekking tot aanspraken op pensioen die vóór de datum van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________ (Stb. 625), zijn opgebouwd.


