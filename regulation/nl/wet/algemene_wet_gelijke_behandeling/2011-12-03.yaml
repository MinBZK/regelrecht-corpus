  - number: '13'
    text: |-
      1 De Commissie stelt een onderzoek in en brengt haar oordeel schriftelijk en met redenen omkleed ter kennis van
      de verzoeker, van degene die het onderscheid zou maken, alsmede, in voorkomend geval, van degene, jegens wie het
      onderscheid zou worden gemaakt.

      2 De Commissie kan bij het ter kennis brengen van haar oordeel aan degene die het onderscheid zou maken,
      aanbevelingen doen.

      3 De Commissie kan haar oordeel ter kennis brengen van Onze Ministers wie het aangaat, van naar haar mening in
      aanmerking komende organisaties van werkgevers, van werknemers, uit het beroepsleven of van overheidspersoneel, van
      eindgebruikers van goederen of diensten en van betrokken overlegorganen.
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel13
  - number: '14'
    text: |-
      1 De Commissie stelt geen onderzoek in, indien:

      a. het in [artikel 12, tweede lid][ref1], bedoelde verzoek kennelijk ongegrond is;

      b. het belang van de verzoeker of het gewicht van de gedraging kennelijk onvoldoende is;

      c. sinds het in [artikel 12][ref2] bedoelde onderscheid een zodanige termijn is verstreken dat in redelijkheid geen
      onderzoek meer kan plaatsvinden.

      2 Indien zich gevallen als bedoeld in het eerste lid voordoen, doet de Commissie daarover aan verzoeker
      schriftelijk en met redenen omkleed mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel12
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel14
