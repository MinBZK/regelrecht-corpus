        artikel: '646'
  - number: '16'
    text: |-
      1 De Commissie bestaat uit negen leden, onder wie een voorzitter en twee ondervoorzitters. Voorts kunnen
      plaatsvervangende leden worden benoemd.

      2 De voorzitter en de ondervoorzitters moeten voldoen aan de bij of krachtens
      [artikel 5 van de Wet rechtspositie rechterlijke ambtenaren][ref1] gestelde vereisten voor benoembaarheid tot
      rechterlijk ambtenaar.

      3 De benoeming van de leden en de plaatsvervangende leden geschiedt door Onze Minister van Justitie, in
      overeenstemming met Onze Ministers van Binnenlandse Zaken, van Sociale Zaken en Werkgelegenheid, van Onderwijs en
      Wetenschappen en van Welzijn, Volksgezondheid en Cultuur.

      4 De [artikelen 46c][ref2], [46d, tweede lid][ref3], [46f][ref4],
      [46g][ref5],[46i, met uitzondering van het eerste lid, onderdeel c][ref6], [46j][ref7],
      [46l, eerste lid, met uitzondering van onderdeel c, en derde lid][ref8], [46m][ref9], [46n][ref10], [46o][ref11]
      en [46p van de Wet rechtspositie rechterlijke ambtenaren][ref12] zijn van overeenkomstige toepassing, met dien
      verstande dat:

      a. de disciplinaire maatregel, bedoeld in [artikel 46c, eerste lid][ref13], ten aanzien van de leden van de
      Commissie door de voorzitter van het College wordt opgelegd;

      b. het in [artikel 46c, eerste lid, onderdeel b][ref14], genoemde verbod zich in een onderhoud of een gesprek in te
      laten met partijen of haar advocaten of gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan
      te nemen niet op de leden van de Commissie van toepassing is.

      5 De benoeming van de leden en van de plaatsvervangende leden geschiedt voor een tijdvak van ten hoogste zes jaar.
      Herbenoeming is terstond mogelijk. Op eigen verzoek worden zij door de Minister van Justitie ontslagen.

      6 De [artikelen 13a tot en met 13g van de Wet op de rechterlijke organisatie][ref15] zijn van overeenkomstige
      toepassing ten aanzien van gedragingen van de leden van de Commissie, met dien verstande dat:

      a. voor de overeenkomstige toepassing van die artikelen onder «het betrokken gerechtsbestuur» wordt verstaan: de
      voorzitter van de Commissie; en

      b. voor de overeenkomstige toepassing van [artikel 13b, eerste lid, onderdelen b en c][ref16], onder
      «overeenkomstig [artikel 26][ref17] of [75][ref18] een klacht» wordt verstaan: een klacht.


