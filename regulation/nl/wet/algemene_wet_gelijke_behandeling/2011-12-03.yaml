  - number: '11'
    text: |-
      1 Er is een Commissie gelijke behandeling, hierna te noemen: de Commissie.

      2 De Commissie kan uit haar midden kamers vormen voor het vervullen van haar taak.
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel11
  - number: '12'
    text: |-
      1 De Commissie kan op schriftelijk verzoek onderzoeken of een onderscheid is of wordt
      gemaakt als bedoeld in deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref1] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2], en haar oordeel daaromtrent kenbaar maken. Voorts kan de
      Commissie uit eigen beweging onderzoeken of zodanig onderscheid stelselmatig wordt gemaakt en haar oordeel daarover
      kenbaar maken.

      2 Een schriftelijk verzoek als bedoeld in het eerste lid, kan worden ingediend door:

      a. degene die meent dat te zijnen nadele een onderscheid is of wordt gemaakt als bedoeld in deze wet, de
      [Wet gelijke behandeling van mannen en vrouwen][ref3] of [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref4];

      b. de natuurlijke persoon, de rechtspersoon of het bevoegd gezag, die wensen te weten of zij een
      onderscheid maken als bedoeld in deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref5] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref6];

      c. degene die belast is met de beslissing over een geschil met betrekking tot onderscheid
      als bedoeld in deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref7] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref8];

      d. een ondernemingsraad, die meent dat in de onderneming waarvoor deze is ingesteld,
      onderscheidenlijk een met die ondernemingsraad vergelijkbaar medezeggenschapsorgaan, dat meent dat
      in het organisatorisch samenwerkingsverband waarvoor het is ingesteld, onderscheid wordt gemaakt
      als bedoeld in deze wet, in [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref9] of in de
      [Wet gelijke behandeling van mannen en vrouwen][ref10];

      e. een vereniging met volledige rechtsbevoegdheid of stichting, die in overeenstemming met haar statuten de belangen
      behartigt van diegenen in wier bescherming deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref11] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref12] beoogt te voorzien.

      3 In het geval een schriftelijk verzoek als bedoeld in het tweede lid, onderdelen *d* en *e*, personen noemt ten
      nadele van wie zou zijn gehandeld, dan wel indien een onderzoek ingesteld uit eigen beweging, betrekking heeft
      op zodanige personen, stelt de Commissie deze personen op de hoogte van het voornemen tot onderzoek. De Commissie
      is niet bevoegd in het onderzoek en de beoordeling personen als bedoeld in de eerste volzin te betrekken die
      schriftelijk hebben verklaard daartegen bedenkingen te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0003299
