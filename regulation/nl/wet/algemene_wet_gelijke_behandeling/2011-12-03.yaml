  - number: '34'
    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de zesde kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst. Bij koninklijk besluit kan een eerder tijdstip van inwerkingtreding
      worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel34
  - number: '35'
    text: 'Deze wet wordt aangehaald als: Algemene wet gelijke behandeling.'
    url: https://wetten.overheid.nl/BWBR0006502/2011-12-03#Artikel35
