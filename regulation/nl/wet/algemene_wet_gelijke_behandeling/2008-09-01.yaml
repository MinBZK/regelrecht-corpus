preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om, mede in verband met artikel 1 van de Grondwet,
    ter bevordering van de deelneming op gelijke voet aan het maatschappelijk leven bescherming te bieden tegen
    discriminatie op grond van godsdienst, levensovertuiging, politieke gezindheid, ras, geslacht, nationaliteit,
    hetero- of homoseksuele gerichtheid of burgerlijke staat, dat het daarom wenselijk is behoudens wettelijke
    uitzonderingen onderscheid op deze gronden te verbieden en dat het in verband met de handhaving van dit verbod
    wenselijk is een Commissie gelijke behandeling in te stellen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1
  - number: 1.1.a
    text: 'onderscheid: direct en indirect onderscheid, alsmede de opdracht daartoe;'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1
  - number: 1.1.b
    text: |-
      direct onderscheid: onderscheid tussen personen op grond van godsdienst, levensovertuiging, politieke gezindheid,
      ras, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1
  - number: 1.1.c
    text: |-
      indirect onderscheid: onderscheid op grond van andere hoedanigheden of gedragingen dan die bedoeld in onderdeel
      *b*, dat direct onderscheid tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1
  - number: '1.2'
    text: |-
      Onder direct onderscheid op grond van geslacht wordt mede verstaan onderscheid op grond van zwangerschap, bevalling
      en moederschap.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1
  - number: 1a.1
    text: |-
      Het in deze wet neergelegde verbod van onderscheid houdt mede in een verbod van intimidatie en een verbod van
      seksuele intimidatie.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1a
  - number: 1a.2
    text: |-
      Onder intimidatie als bedoeld in het eerste lid wordt verstaan: gedrag dat met de hoedanigheden of gedragingen,
      bedoeld in [artikel 1, eerste lid, onderdeel b][ref1], verband houdt en dat tot doel of gevolg heeft dat de
      waardigheid van de persoon wordt aangetast en dat een bedreigende, vijandige, beledigende, vernederende of
      kwetsende omgeving wordt gecreëerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: 1a.3
    text: |-
      Onder seksuele intimidatie als bedoeld in het eerste lid wordt verstaan: enige vorm van verbaal, non-verbaal of
      fysiek gedrag met een seksuele connotatie dat als doel of gevolg heeft dat de waardigheid van de persoon wordt
      aangetast, in het bijzonder wanneer een bedreigende, vijandige, beledigende, vernederende of kwetsende omgeving
      wordt gecreëerd.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1a
  - number: 1a.4
    text: |-
      Op het in deze wet neergelegde verbod van intimidatie en van seksuele intimidatie zijn niet van
      toepassing de [artikelen 2][ref1], [5, tweede tot en met zesde lid][ref2], [6a, tweede lid][ref3], en
      [7, tweede en derde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0006502#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0006502#Artikel7
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0006502
        artikel: 6a
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0006502
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: '2.1'
    text: |-
      Het in deze wet neergelegde verbod van onderscheid geldt niet ten aanzien van indirect onderscheid indien dat
      onderscheid objectief gerechtvaardigd wordt door een legitiem doel en de middelen voor het bereiken van dat doel
      passend en noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: '2.2'
    text: 'Het in deze wet neergelegde verbod van onderscheid op grond van geslacht geldt niet:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: 2.2.a
    text: in gevallen waarin het geslacht bepalend is en
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: 2.2.b
    text: in gevallen waarin het de bescherming van de vrouw betreft, met name in verband met zwangerschap en moederschap.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: '2.3'
    text: |-
      Het in deze wet neergelegde verbod van onderscheid geldt niet, indien het onderscheid een specifieke maatregel
      betreft die tot doel heeft vrouwen of personen behorende tot een bepaalde etnische of culturele minderheidsgroep
      een bevoorrechte positie toe te kennen ten einde feitelijke nadelen verband houdende met de gronden ras of geslacht
      op te heffen of te verminderen en het onderscheid in een redelijke verhouding staat tot dat doel.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: '2.4'
    text: 'Het in deze wet neergelegde verbod van onderscheid op grond van ras geldt niet:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: 2.4.a
    text: |-
      in gevallen waarin uiterlijke kenmerken die samenhangen met het ras van een persoon bepalend zijn, mits het doel
      legitiem en het vereiste evenredig aan dat doel is;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: 2.4.b
    text: |-
      indien het onderscheid betrekking heeft op uiterlijke kenmerken die samenhangen met het ras van een persoon en
      vanwege de aard van de betrokken specifieke beroepsactiviteit of de context waarin deze wordt uitgeoefend, een
      wezenlijk en bepalend beroepsvereiste vormt, mits het doel legitiem is en het vereiste evenredig aan dat doel is.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: '2.5'
    text: 'Het in deze wet neergelegde verbod van onderscheid op grond van nationaliteit geldt niet:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: 2.5.a
    text: |-
      indien het onderscheid is gebaseerd op algemeen verbindende voorschriften of geschreven of ongeschreven regels van
      internationaal recht en
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: 2.5.b
    text: in gevallen waarin de nationaliteit bepalend is.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: '2.6'
    text: |-
      Bij algemene maatregel van bestuur worden de in het tweede, vierde en vijfde lid, onderdeel *b*, bedoelde gevallen
      nader omschreven.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel2
  - number: '3'
    text: 'Deze wet is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel3
  - number: 3.a
    text: |-
      rechtsverhoudingen binnen kerkgenootschappen alsmede hun zelfstandige onderdelen en lichamen waarin zij zijn
      verenigd, alsmede binnen andere genootschappen op geestelijke grondslag;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel3
  - number: 3.b
    text: het geestelijk ambt.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel3
  - number: '4'
    text: 'Deze wet laat onverlet:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel4
  - number: 4.a
    text: |-
      de [Wet gelijke behandeling van mannen en vrouwen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003299
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003299
  - number: 4.b
    text: |-
      de [artikelen 646][ref1], [647][ref2], [667][ref3] en [670 van Boek 7 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel647
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel667
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel670
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '647'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '667'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '670'
  - number: '5.1'
    text: 'Onderscheid is verboden bij:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.a
    text: de aanbieding van een betrekking en de behandeling bij de vervulling van een openstaande betrekking;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.b
    text: arbeidsbemiddeling;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.c
    text: het aangaan en het beëindigen van een arbeidsverhouding;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.d
    text: het aanstellen tot ambtenaar en het beëindigen van het dienstverband van een ambtenaar;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.e
    text: arbeidsvoorwaarden;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.f
    text: het laten volgen van onderwijs, scholing en vorming tijdens of voorafgaand aan een arbeidsverhouding;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.g
    text: bevordering;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.1.h
    text: arbeidsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: '5.2'
    text: 'Het eerste lid laat onverlet:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.2.a
    text: |-
      de vrijheid van een instelling op godsdienstige of levensbeschouwelijke grondslag om eisen te stellen, die gelet
      op het doel van de instelling, nodig zijn voor de vervulling van een functie, waarbij deze eisen niet mogen leiden
      tot onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht, nationaliteit, hetero- of
      homoseksuele gerichtheid of burgerlijke staat;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.2.b
    text: |-
      de vrijheid van een instelling op politieke grondslag om eisen te stellen, die gelet op het doel van de instelling,
      nodig zijn voor de vervulling van een functie, waarbij deze eisen niet mogen leiden tot onderscheid op grond van
      het enkele feit van ras, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat en
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: 5.2.c
    text: |-
      de vrijheid van een instelling van bijzonder onderwijs om eisen te stellen over de vervulling van een functie, die,
      gelet op het doel van de instelling, nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze eisen niet
      mogen leiden tot onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht, nationaliteit,
      hetero- of homoseksuele gerichtheid of burgerlijke staat.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: '5.3'
    text: |-
      Het eerste lid is niet van toepassing op eisen, die, gelet op het privé-karakter van de werkverhouding in
      redelijkheid aan een werkverhouding kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: '5.4'
    text: |-
      Het eerste lid is niet van toepassing op eisen met betrekking tot de politieke gezindheid die in redelijkheid
      kunnen worden gesteld in verband met de vervulling van functies in bestuursorganen en adviesorganen.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: '5.5'
    text: |-
      Het eerste lid is niet van toepassing op eisen met betrekking tot de politieke gezindheid die in redelijkheid
      kunnen worden gesteld in verband met de vervulling van vertrouwensfuncties.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
  - number: '5.6'
    text: |-
      Het eerste lid, onderdeel e, is niet van toepassing op onderscheid op grond van
      burgerlijke staat met betrekking tot nabestaandenpensioen-voorzieningen en met
      betrekking tot aanspraken op pensioen die vóór de datum van inwerkingtreding van
      __REF000___________________________________________________________________________________________________________
      ___________________________________________________________________________________________________________________
      __________________________________________________ (Stb. 625), zijn opgebouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0012090#ArtikelI
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012090
        artikel: I
  - number: '6'
    text: |-
      Onderscheid is verboden met betrekking tot de voorwaarden voor en de toegang tot het vrije beroep en de
      mogelijkheden tot uitoefening van en ontplooiing binnen het vrije beroep.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel6
  - number: 6a.1
    text: |-
      Onderscheid is verboden bij het lidmaatschap van of de betrokkenheid bij een werkgevers- of werknemersorganisatie
      of een vereniging van beroepsgenoten, alsmede bij de voordelen die uit dat lidmaatschap of uit die betrokkenheid
      voortvloeien.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel6a
  - number: 6a.2
    text: 'Het eerste lid laat onverlet:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel6a
  - number: 6a.2.a
    text: |-
      de vrijheid van een op godsdienstige of levensbeschouwelijke grondslag gebaseerde organisatie of vereniging om
      eisen te stellen, die gelet op haar doel, nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze
      eisen niet mogen leiden tot onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht,
      nationaliteit, hetero- of homoseksuele gerichtheid of burgerlijke staat en
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel6a
  - number: 6a.2.b
    text: |-
      de vrijheid van een op politieke grondslag gebaseerde organisatie of vereniging om eisen te stellen, die gelet
      op haar doel, nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze eisen niet mogen leiden tot
      onderscheid op grond van het enkele feit van ras, geslacht, nationaliteit, hetero- of homoseksuele gerichtheid of
      burgerlijke staat.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel6a
  - number: '7.1'
    text: |-
      Onderscheid is verboden bij het aanbieden van of verlenen van toegang tot goederen of diensten en bij het sluiten,
      uitvoeren of beëindigen van overeenkomsten ter zake, alsmede bij het geven van loopbaanoriëntatie en advies of
      voorlichting over school- of beroepskeuze, indien dit geschiedt:
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7
  - number: 7.1.a
    text: in de uitoefening van een beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7
  - number: 7.1.b
    text: door de openbare dienst;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7
  - number: 7.1.c
    text: |-
      door instellingen die werkzaam zijn op het gebied van volkshuisvesting, welzijn, gezondheidszorg, cultuur of
      onderwijs of
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7
  - number: 7.1.d
    text: |-
      door natuurlijke personen die niet handelen in de uitoefening van een beroep of bedrijf, voor zover het aanbod in
      het openbaar geschiedt.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7
  - number: '7.2'
    text: |-
      Het eerste lid, onderdeel *c*, laat onverlet de vrijheid van een instelling van bijzonder onderwijs om bij
      de toelating en ten aanzien van de deelname aan het onderwijs eisen te stellen, die gelet op het doel van de
      instelling nodig zijn voor de verwezenlijking van haar grondslag, waarbij deze eisen niet mogen leiden tot
      onderscheid op grond van het enkele feit van politieke gezindheid, ras, geslacht, nationaliteit, hetero- of
      homoseksuele gerichtheid of burgerlijke staat. Onderscheid op grond van geslacht is alleen toegestaan, indien de
      eigen aard van de instelling dit eist en voor leerlingen van beide geslachten gelijkwaardige voorzieningen aanwezig
      zijn.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7
  - number: '7.3'
    text: |-
      Het eerste lid, onderdelen *a* en *d*, is niet van toepassing op eisen die gelet op het privé-karakter van de
      omstandigheden waarop de rechtsverhouding ziet in redelijkheid kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7
  - number: 7a.1
    text: |-
      Onverminderd [artikel 7][ref1] is onderscheid op grond van ras verboden bij sociale bescherming, daaronder begrepen
      sociale zekerheid, en sociale voordelen.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel7
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '4'
  - number: 7a.2
    text: |-
      Bij algemene maatregel van bestuur kunnen de begrippen sociale bescherming, sociale zekerheid en sociale voordelen,
      bedoeld in het eerste lid, worden omschreven. De voordracht voor een krachtens de eerste volzin vast te stellen
      algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der
      Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel7a
  - number: '8.1'
    text: |-
      Beëindiging van de arbeidsverhouding door de werkgever in strijd met [artikel 5][ref1], wegens de omstandigheid dat
      de werknemer in of buiten rechte een beroep heeft gedaan op [artikel 5][ref2] of terzake bijstand heeft verleend,
      is vernietigbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel5
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '5'
        hoofdstuk: '1'
        paragraaf: '3'
  - number: '8.2'
    text: |-
      Onverminderd [hoofdstuk 8 van de Algemene wet bestuursrecht][ref1], vervalt twee maanden na de beëindiging
      van de arbeidsverhouding de bevoegdheid van de werknemer een beroep te doen op de vernietigingsgrond,
      bedoeld in het eerste lid. Het beroep op de vernietigingsgrond geschiedt door kennisgeving aan de werkgever.
      [Artikel 55 van Boek 3 van het Burgerlijk Wetboek][ref2] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0005291#Artikel55
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0005291
        artikel: '55'
  - number: '8.3'
    text: |-
      Een rechtsvordering in verband met de vernietiging verjaart door verloop van zes maanden na de dag waarop de
      arbeidsverhouding is geëindigd.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel8
  - number: '8.4'
    text: De beëindiging, bedoeld in het eerste lid, maakt de werkgever niet schadeplichtig.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel8
  - number: 8a.1
    text: |-
      Het is verboden personen te benadelen wegens het feit dat zij in of buiten rechte een beroep hebben gedaan op deze
      wet of ter zake bijstand hebben verleend.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel8a
  - number: 8a.2
    text: |-
      Het feit dat een persoon het in [artikel 1a, tweede en derde lid][ref1], bedoelde gedrag afwijst of lijdzaam
      ondergaat, mag niet ten grondslag liggen aan een beslissing die die persoon treft.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel1a
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: 1a
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '9'
    text: Bedingen in strijd met deze wet zijn nietig.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel9
  - number: '10.1'
    text: |-
      Indien degene die meent dat in zijn nadeel een onderscheid is of wordt gemaakt als bedoeld in deze wet, in rechte
      feiten aanvoert die dat onderscheid kunnen doen vermoeden, dient de wederpartij te bewijzen dat niet in strijd met
      deze wet is gehandeld.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel10
  - number: '10.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op vorderingen als bedoeld in
      [artikel 305a van Boek 3 van het Burgerlijk Wetboek][ref1] en op beroepen ingesteld in bestuursrechtelijke
      procedures door belanghebbenden in de zin van [artikel 1:2, derde lid, van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel305a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: 305a
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '11.1'
    text: 'Er is een Commissie gelijke behandeling, hierna te noemen: de Commissie.'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel11
  - number: '11.2'
    text: De Commissie kan uit haar midden kamers vormen voor het vervullen van haar taak.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel11
  - number: '12.1'
    text: |-
      De Commissie kan op schriftelijk verzoek onderzoeken of een onderscheid is of wordt gemaakt
      als bedoeld in deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref1] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2], en haar oordeel daaromtrent kenbaar maken. Voorts kan de
      Commissie uit eigen beweging onderzoeken of zodanig onderscheid stelselmatig wordt gemaakt en haar oordeel daarover
      kenbaar maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003299
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003299
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '12.2'
    text: 'Een schriftelijk verzoek als bedoeld in het eerste lid, kan worden ingediend door:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
  - number: 12.2.a
    text: |-
      degene die meent dat te zijnen nadele een onderscheid is of wordt gemaakt als bedoeld in deze wet, de
      [Wet gelijke behandeling van mannen en vrouwen][ref1] of [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003299
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003299
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 12.2.b
    text: |-
      de natuurlijke persoon, de rechtspersoon of het bevoegd gezag, die wensen te weten of zij een
      onderscheid maken als bedoeld in deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref1] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003299
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003299
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 12.2.c
    text: |-
      degene die belast is met de beslissing over een geschil met betrekking tot onderscheid als bedoeld in deze wet, de
      [Wet gelijke behandeling van mannen en vrouwen][ref1] of [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0003299
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003299
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: 12.2.d
    text: |-
      een ondernemingsraad, die meent dat in de onderneming waarvoor deze is ingesteld, onderscheidenlijk
      een met die ondernemingsraad vergelijkbaar medezeggenschapsorgaan, dat meent dat in het
      organisatorisch samenwerkingsverband waarvoor het is ingesteld, onderscheid wordt gemaakt als
      bedoeld in deze wet, in [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref1] of in de
      [Wet gelijke behandeling van mannen en vrouwen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel646
      [ref2]: https://wetten.overheid.nl/BWBR0003299
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '646'
      - id: ref2
        bwb_id: BWBR0003299
  - number: 12.2.e
    text: |-
      een vereniging met volledige rechtsbevoegdheid of stichting, die in overeenstemming met haar statuten de belangen
      behartigt van diegenen in wier bescherming deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref1] of
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2] beoogt te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0003299
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003299
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '12.3'
    text: |-
      In het geval een schriftelijk verzoek als bedoeld in het tweede lid, onderdelen *d* en *e*, personen noemt ten
      nadele van wie zou zijn gehandeld, dan wel indien een onderzoek ingesteld uit eigen beweging, betrekking heeft
      op zodanige personen, stelt de Commissie deze personen op de hoogte van het voornemen tot onderzoek. De Commissie
      is niet bevoegd in het onderzoek en de beoordeling personen als bedoeld in de eerste volzin te betrekken die
      schriftelijk hebben verklaard daartegen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel12
  - number: '13.1'
    text: |-
      De Commissie stelt een onderzoek in en brengt haar oordeel schriftelijk en met redenen omkleed ter kennis van
      de verzoeker, van degene die het onderscheid zou maken, alsmede, in voorkomend geval, van degene, jegens wie het
      onderscheid zou worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel13
  - number: '13.2'
    text: |-
      De Commissie kan bij het ter kennis brengen van haar oordeel aan degene die het onderscheid zou maken,
      aanbevelingen doen.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel13
  - number: '13.3'
    text: |-
      De Commissie kan haar oordeel ter kennis brengen van Onze Ministers wie het aangaat, van naar haar mening in
      aanmerking komende organisaties van werkgevers, van werknemers, uit het beroepsleven of van overheidspersoneel, van
      eindgebruikers van goederen of diensten en van betrokken overlegorganen.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel13
  - number: '14.1'
    text: 'De Commissie stelt geen onderzoek in, indien:'
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel14
  - number: 14.1.a
    text: |-
      het in [artikel 12, tweede lid][ref1], bedoelde verzoek kennelijk ongegrond is;


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel12
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '12'
        hoofdstuk: '2'
  - number: 14.1.b
    text: het belang van de verzoeker of het gewicht van de gedraging kennelijk onvoldoende is;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel14
  - number: 14.1.c
    text: |-
      sinds het in [artikel 12][ref1] bedoelde onderscheid een zodanige termijn is verstreken dat in redelijkheid geen
      onderzoek meer kan plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel12
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '12'
        hoofdstuk: '2'
  - number: '14.2'
    text: |-
      Indien zich gevallen als bedoeld in het eerste lid voordoen, doet de Commissie daarover aan verzoeker schriftelijk
      en met redenen omkleed mededeling.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel14
  - number: '15.1'
    text: |-
      De Commissie kan in rechte vorderen dat een gedraging die in strijd is met deze wet, de
      [Wet gelijke behandeling van mannen en vrouwen][ref1] of [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2]
      onrechtmatig wordt verklaard, dat deze wordt verboden of dat een bevel wordt gegeven om de gevolgen van die
      gedraging ongedaan te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0003299
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003299
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '15.2'
    text: |-
      Een gedraging kan niet ten grondslag worden gelegd aan een vordering als bedoeld in het eerste lid, voor zover
      degene die door deze gedraging wordt getroffen, daartegen bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel15
  - number: '16.1'
    text: |-
      De Commissie bestaat uit negen leden, onder wie een voorzitter en twee ondervoorzitters. Voorts kunnen
      plaatsvervangende leden worden benoemd.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel16
  - number: '16.2'
    text: |-
      De voorzitter en de ondervoorzitters moeten voldoen aan de bij of krachtens
      [artikel 1d van de Wet rechtspositie rechterlijke ambtenaren][ref1] gestelde vereisten voor benoembaarheid tot
      rechterlijk ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel1d
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 1d
  - number: '16.3'
    text: |-
      De benoeming van de leden en de plaatsvervangende leden geschiedt door Onze Minister van Justitie, in
      overeenstemming met Onze Ministers van Binnenlandse Zaken, van Sociale Zaken en Werkgelegenheid, van Onderwijs en
      Wetenschappen en van Welzijn, Volksgezondheid en Cultuur.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel16
  - number: '16.4'
    text: |-
      De [artikelen 46c][ref1], [46d, tweede lid][ref2], [46f][ref3],
      [46g][ref4],[46i, met uitzondering van het eerste lid, onderdeel c][ref5], [46j][ref6],
      [46l, eerste lid, met uitzondering van onderdeel c, en derde lid][ref7], [46m][ref8], [46n][ref9], [46o][ref10]
      en [46p van de Wet rechtspositie rechterlijke ambtenaren][ref11] zijn van overeenkomstige toepassing, met dien
      verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
      [ref2]: https://wetten.overheid.nl/BWBR0008365#Artikel46d
      [ref3]: https://wetten.overheid.nl/BWBR0008365#Artikel46f
      [ref4]: https://wetten.overheid.nl/BWBR0008365#Artikel46g
      [ref5]: https://wetten.overheid.nl/BWBR0008365#Artikel46i
      [ref6]: https://wetten.overheid.nl/BWBR0008365#Artikel46j
      [ref7]: https://wetten.overheid.nl/BWBR0008365#Artikel46l
      [ref8]: https://wetten.overheid.nl/BWBR0008365#Artikel46m
      [ref9]: https://wetten.overheid.nl/BWBR0008365#Artikel46n
      [ref10]: https://wetten.overheid.nl/BWBR0008365#Artikel46o
      [ref11]: https://wetten.overheid.nl/BWBR0008365#Artikel46p
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
      - id: ref2
        bwb_id: BWBR0008365
        artikel: 46d
      - id: ref3
        bwb_id: BWBR0008365
        artikel: 46f
      - id: ref4
        bwb_id: BWBR0008365
        artikel: 46g
      - id: ref5
        bwb_id: BWBR0008365
        artikel: 46i
      - id: ref6
        bwb_id: BWBR0008365
        artikel: 46j
      - id: ref7
        bwb_id: BWBR0008365
        artikel: 46l
      - id: ref8
        bwb_id: BWBR0008365
        artikel: 46m
      - id: ref9
        bwb_id: BWBR0008365
        artikel: 46n
      - id: ref10
        bwb_id: BWBR0008365
        artikel: 46o
      - id: ref11
        bwb_id: BWBR0008365
        artikel: 46p
  - number: 16.4.a
    text: |-
      de disciplinaire maatregel, bedoeld in [artikel 46c, eerste lid][ref1], ten aanzien van de leden van de Commissie
      door de voorzitter van het College wordt opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
  - number: 16.4.b
    text: |-
      het in [artikel 46c, eerste lid, onderdeel b][ref1], genoemde verbod zich in een onderhoud of een gesprek in te
      laten met partijen of haar advocaten of gemachtigden of een bijzondere inlichting of schriftelijk stuk van hen aan
      te nemen niet op de leden van de Commissie van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0008365#Artikel46c
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008365
        artikel: 46c
  - number: '16.5'
    text: |-
      De benoeming van de leden en van de plaatsvervangende leden geschiedt voor een tijdvak van ten hoogste zes jaar.
      Herbenoeming is terstond mogelijk. Op eigen verzoek worden zij door de Minister van Justitie ontslagen.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel16
  - number: '17.1'
    text: Aan de Commissie staat ter ondersteuning van haar taak een bureau ten dienste.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister van Justitie benoemt, bevordert, schorst en ontslaat, op voordracht van de Commissie, de personen
      die tot het bureau behoren. Onze Minister van Justitie bepaalt in welke gevallen zij worden benoemd, bevorderd,
      geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel17
  - number: '18.1'
    text: |-
      De Commissie kan zich bij de uitoefening van haar taak doen bijstaan door daartoe door Onze Minister wie het
      aangaat aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel18
  - number: '18.2'
    text: |-
      De Commissie kan zich bij de uitoefening van haar taak doen bijstaan door een of meer personen ten einde haar de
      inlichtingen te verschaffen die voor de vervulling van de taak van de Commissie nodig zijn.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel18
  - number: '19.1'
    text: |-
      De Commissie en de in [artikel 17][ref1] bedoelde personen die door de Commissie daartoe zijn aangewezen, kunnen
      alle inlichtingen en bescheiden vorderen die voor de vervulling van de taak van de Commissie redelijkerwijze nodig
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel17
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '17'
        hoofdstuk: '2'
  - number: '19.2'
    text: |-
      Een ieder is verplicht, behoudens verschoning wegens ambts- of beroepsgeheim, de ingevolge het eerste lid
      gevorderde inlichtingen en bescheiden volledig en naar waarheid te verstrekken, een en ander op de wijze en binnen
      de termijn door of namens de Commissie vast te stellen. Deze verplichting geldt niet, indien een persoon daardoor
      of zichzelf of een van zijn bloed- of aanverwanten in de rechte lijn of in de zijlijn in de tweede of de derde
      graad of zijn echtgenoot of eerdere echtgenoot dan wel geregistreerde partner of eerdere geregistreerde partner aan
      het gevaar van een strafrechtelijke veroordeling ter zake van een misdrijf zou blootstellen.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel19
  - number: '20.1'
    text: |-
      De Commissie brengt jaarlijks verslag uit van haar werkzaamheden en maakt dit verslag openbaar. Zij zendt dit
      verslag in ieder geval aan Onze Ministers wie het aangaat en aan de adviesorganen die het aangaat.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel20
  - number: '20.2'
    text: |-
      De Commissie stelt, te rekenen vanaf het tijdstip waarop deze wet in werking is getreden, telkens na verloop
      van vijf jaar een rapport op van haar bevindingen ten aanzien van de werking in de praktijk van deze wet, de
      [Wet gelijke behandeling van mannen en vrouwen][ref1] en [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref2].
      Zij zendt dit rapport aan Onze Minister van Binnenlandse Zaken.


      [ref1]: https://wetten.overheid.nl/BWBR0003299
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel646
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0003299
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '646'
  - number: '21.1'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de werkwijze van de Commissie, waaronder in
      ieder geval regels betreffende:
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel21
  - number: 21.1.a
    text: de wijze van behandeling;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel21
  - number: 21.1.b
    text: hoor en wederhoor;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel21
  - number: 21.1.c
    text: de openbaarheid van zittingen;
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel21
  - number: 21.1.d
    text: |-
      de openbaarmaking van haar oordeel, bedoeld in [artikel 13, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel13
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '13'
        hoofdstuk: '2'
  - number: '21.2'
    text: |-
      De leden van de Commissie genieten een bezoldiging voor hun werkzaamheden. Over hun rechtspositie worden nadere
      regels gesteld bij algemene maatregel van bestuur. Deze regels hebben in ieder geval betrekking op aanstelling
      en loopbaanvorming, bezoldiging, toelagen, toeslagen, vergoedingen, rechten en plichten bij reorganisaties,
      disciplinaire straffen, schorsing en ontslag.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel21
  - number: '21.3'
    text: |-
      De plaatsvervangende leden genieten een zittingsgeld voor hun werkzaamheden, alsmede een vergoeding van reis- en
      verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0006502/2008-09-01#Artikel21
  - number: '33'
    text: |-
      Onze Minister van Binnenlandse Zaken zendt in overeenstemming met Onze Ministers van Justitie, van Sociale
      Zaken en Werkgelegenheid, van Onderwijs en Wetenschappen en van Welzijn, Volksgezondheid en Cultuur zo spoedig
      mogelijk na de ontvangst van het in [artikel 20, tweede lid][ref1], bedoelde rapport, aan de Staten-Generaal een
      verslag over de werking in de praktijk van deze wet, de [Wet gelijke behandeling van mannen en vrouwen][ref2] en
      [artikel 646 van Boek 7 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0003299
