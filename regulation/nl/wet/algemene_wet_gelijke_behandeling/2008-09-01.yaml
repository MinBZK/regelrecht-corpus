    text: |-
      Deze wet treedt in werking met ingang van de eerste dag van de zesde kalendermaand na de datum van uitgifte van
      het *Staatsblad* waarin zij wordt geplaatst. Bij koninklijk besluit kan een eerder tijdstip van inwerkingtreding
      worden vastgesteld.
