valid_from: '2004-10-01'
bwb_id: BWBR0016343
url: https://wetten.overheid.nl/BWBR0016343/2004-10-01
preamble:
  text: >-
    Gelet op Beschikking van de Commissie van de Europese Gemeenschappen van 29 januari 2004 betreffende beschermende
    maatregelen in relatie tot aviaire influenza in bepaalde Aziatische landen met betrekking tot de import van vogels,
    anders dan pluimvee;


    Gelet op artikel 10, eerste lid, Gezondheids- en welzijnswet voor dieren;


    Besluit:
  url: https://wetten.overheid.nl/BWBR0016343/2004-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De invoer van vogels afkomstig uit Cambodja, Indonesië, Japan, Laos, Pakistan, de Volksrepubliek China inclusief
      het territorium Hong Kong, Zuid-Korea, Thailand, Vietnam, Zuid-Afrika en Maleisië is verboden.

      2 In afwijking van [artikel 2.2, zevende lid, van de Regeling handel levende dieren en levende producten][ref1], is
      het verboden pluimvee, dat bestemd is voor tentoonstellingen, concoursen of wedstrijden, in Nederland te brengen,
      indien het pluimvee afkomstig is uit andere gebieden dan de gebieden genoemd in de bijlage bij beschikking (EG)
      nr. 2004/363 van de Commissie van de Europese Gemeenschappen van 6 april 2004 (PbEU L 114) tot vaststelling van
      beschermende maatregelen in verband met hoog pathogene aviaire influenza in de Verenigde Staten van Amerika of in
      de bijlage bij beschikking (EG) nr. 2004/364 van de Commissie van de Europese Gemeenschappen van 6 april 2004 (PbEU
      L 114) tot vaststelling van beschermende maatregelen in verband met hoogpathogene aviaire influenza in Canada.


      [ref1]: https://wetten.overheid.nl/BWBR0007049#Artikel2.2
    url: https://wetten.overheid.nl/BWBR0016343/2004-10-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007049
        artikel: '2.2'
  - number: 1a
    text: >-
      1 De invoer van vogelveren of delen van vogelveren, afkomstig uit Cambodja, Indonesië, Japan, Laos, Pakistan, de
      Volksrepubliek China inclusief het territorium Hong Kong, Zuid-Korea, Thailand, Vietnam, Zuid-Afrika en Maleisië,
      is verboden.


      2 De invoer van vogelveren of delen van vogelveren, bedoeld in het eerste lid, is toegestaan, indien is voldaan
      aan artikel 4, tweede lid, van beschikking (EG) nr. 2004/122 van de Commissie van de Europese Gemeenschappen van
      6 februari 2004 betreffende bepaalde beschermingsmaatregelen in verband met aviaire influenza in verscheidene
      Aziatische landen (PbEU L 036) of artikel 3, vierde lid, van beschikking (EG) nr. 2004/614 van de Commissie van
      de Europese Gemeenschappen van 24 augustus 2004 tot vaststelling van beschermende maatregelen in verband met
      hoogpathogene aviaire influenza in de Republiek Zuid-Afrika (PbEU L 275).
    url: https://wetten.overheid.nl/BWBR0016343/2004-10-01#Artikel1a
  - number: 1b
    text: >-
      De invoer van onbehandelde jachttrofeeën afkomstig van vogels, afkomstig uit de Volksrepubliek China inclusief het
      territorium Hong Kong, Zuid-Korea, Thailand en Zuid-Afrika, is verboden.
    url: https://wetten.overheid.nl/BWBR0016343/2004-10-01#Artikel1b
  - number: '2'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling maatregelen in verband met Aviaire Influenza 2004.'
    url: https://wetten.overheid.nl/BWBR0016343/2004-10-01#Artikel2
  - number: '3'
    text: Deze regeling treedt in werking op 30 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016343/2004-10-01#Artikel3
