$id: tijdelijke_regeling_maatregelen_in_verband_met_aviaire_influenza_2004
regulatory_layer: WET
publication_date: '2005-10-17'
valid_from: '2005-10-14'
bwb_id: BWBR0016343
url: https://wetten.overheid.nl/BWBR0016343/2005-10-14
preamble:
  text: |-
    Gelet op Beschikking van de Commissie van de Europese Gemeenschappen van 29 januari 2004 betreffende beschermende
    maatregelen in relatie tot aviaire influenza in bepaalde Aziatische landen met betrekking tot de import van vogels,
    anders dan pluimvee;

    Gelet op artikel 10, eerste lid, Gezondheids- en welzijnswet voor dieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0016343/2005-10-14#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De invoer van vogels afkomstig uit Cambodja, de Volksrepubliek China inclusief het territorium Hong Kong,
      Indonesië, Kazachstan, Laos, Maleisië, Mongolië, Noord-Korea, Pakistan, Thailand, Vietnam, Zuid-Afrika, Rusland en
      Turkije, is verboden.
    url: https://wetten.overheid.nl/BWBR0016343/2005-10-14#Artikel1
  - number: 1a
    text: |-
      1 De invoer van vogelveren en delen van vogelveren, afkomstig uit Cambodja, de Volksrepubliek China inclusief het
      territorium Hong Kong, Indonesië, Kazachstan, Laos, Maleisië, Mongolië, Noord-Korea, Pakistan, Thailand, Vietnam,
      Zuid-Afrika, Rusland of Turkije, is verboden.

      2 Het verbod, bedoeld in het eerste lid, is niet van toepassing op onbewerkte veren en delen van veren afkomstig
      uit Mongolië.

      3 Het verbod, bedoeld in het eerste lid, is niet van toepassing op onbewerkte veren en delen van veren die
      afkomstig zijn uit een ander district van Rusland dan de districten genoemd in Bijlage I bij beschikking (EG) nr.
      2005/693 van de Commissie van de Europese Gemeenschappen van 6 oktober betreffende bepaalde beschermingsmaatregelen
      in verband met aviaire influenza in Rusland (PbEU L263), mits zij vergezeld gaan van een gezondheidscertificaat
      overeenkomstig het model neergelegd in Bijlage II bij die beschikking.

      4 Het verbod, bedoeld in het eerste lid, is niet van toepassing op bewerkte vogelveren en delen van vogelveren,
      indien is voldaan aan artikel 4, derde lid, van beschikking (EG) nr. 2005/692 van de Commissie van de Europese
      Gemeenschappen van 6 oktober 2005 betreffende bepaalde beschermingsmaatregelen in verband met aviaire influenza in
      verscheidene derde landen (PbEU L263), artikel 1, vierde lid, van beschikking (EG) nr. 2005/693 van de Commissie
      van de Europese Gemeenschappen van 6 oktober betreffende bepaalde beschermingsmaatregelen in verband met aviaire
      influenza in Rusland (PbEU L263), artikel 3, vierde lid, van beschikking (EG) nr. 2004/614 van de Commissie van
      de Europese Gemeenschappen van 24 augustus 2004 tot vaststelling van beschermende maatregelen in verband met
      hoogpathogene aviaire influenza in de Republiek Zuid-Afrika (PbEU L 275) of artikel 2 van de beschikking van
      de Commissie van de Europese Gemeenschappen van 10 oktober 2005 betreffende bepaalde beschermingsmaatregelen in
      verband met een verdenking van hoog-pathogene aviaire influenza in Turkije.
    url: https://wetten.overheid.nl/BWBR0016343/2005-10-14#Artikel1a
  - number: 1b
    text: |-
      De invoer van onbehandelde jachttrofeeën afkomstig van vogels, afkomstig uit de Volksrepubliek China inclusief het
      territorium Hong Kong, Thailand, Zuid-Afrika en Maleisië, is verboden.
    url: https://wetten.overheid.nl/BWBR0016343/2005-10-14#Artikel1b
  - number: '2'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke regeling maatregelen in verband met Aviaire Influenza 2004.'
    url: https://wetten.overheid.nl/BWBR0016343/2005-10-14#Artikel2
  - number: '3'
    text: Deze regeling treedt in werking op 30 januari 2004.
    url: https://wetten.overheid.nl/BWBR0016343/2005-10-14#Artikel3
