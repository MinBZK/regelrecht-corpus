$id: wet_op_de_orgaandonatie
regulatory_layer: WET
publication_date: '2025-08-12'
valid_from: '2022-01-01'
bwb_id: BWBR0008066
url: https://wetten.overheid.nl/BWBR0008066/2022-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede in verband met artikel 11 van de Grondwet, wenselijk is met
    het oog op de rechtszekerheid van de betrokkenen, ter bevordering van het aanbod en de rechtvaardige verdeling van
    geschikte organen en ter voorkoming van handel in organen bij wet regelen te stellen omtrent het ter beschikking
    stellen van organen ten behoeve van in het bijzonder de geneeskundige behandeling van anderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
  - number: 1.b
    text: |-
      orgaan: bestanddeel van het menselijk lichaam, met inbegrip van weefsels en cellen, met uitzondering van bloed
      en geslachtscellen;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
  - number: 1.c
    text: |-
      donor: een persoon of stoffelijk overschot, door of ten aanzien van wie op grond van deze wet toestemming is
      verleend voor, dan wel bij wie geen bezwaar bestaat tegen het bij hem of daaruit verwijderen van een orgaan;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
  - number: 1.d
    text: 'verwijderen: het verwijderen van een orgaan, anders dan ten behoeve van de donor zelf;'
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
  - number: 1.e
    text: |-
      implantatie: het in- of aanbrengen van een orgaan van een donor in of aan het lichaam van een ander met het oog op
      diens geneeskundige behandeling;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
  - number: 1.f
    text: |-
      ziekenhuis: een ziekenhuis dat of een verpleeginrichting dan wel een afdeling daarvan waar zorg of een andere
      dienst wordt verleend waarop aanspraak bestaat ingevolge [artikel 3.1.1 van de Wet langdurige zorg][ref1] of
      ingevolge een zorgverzekering als bedoeld in [artikel 1, onderdeel d, van de Zorgverzekeringswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035917
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '1'
  - number: 1.g
    text: |-
      orgaancentrum: een instelling als bedoeld in [artikel 24][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '24'
        hoofdstuk: '4'
  - number: '2'
    text: |-
      Toestemming voor het verwijderen van een orgaan, verleend met het oogmerk daarvoor een vergoeding te ontvangen
      die meer bedraagt dan de kosten, daaronder begrepen gederfde inkomsten, die een rechtstreeks gevolg zijn van het
      verwijderen van het orgaan, is nietig.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel2
  - number: 2a
    text: |-
      Bij de gegevensverwerking noodzakelijk voor de uitvoering van de in deze wet
      neergelegde taken kan gebruik worden gemaakt van het burgerservicenummer, bedoeld in
      [artikel 1, onderdeel b, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
  - number: '3.1'
    text: |-
      Een meerderjarige die in staat is tot een redelijke waardering van zijn belangen ter zake, kan toestemming verlenen
      voor het bij zijn leven bij hem verwijderen van een door hem aangewezen orgaan ten behoeve van implantatie bij een
      bepaalde persoon.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel3
  - number: '3.2'
    text: |-
      Degene die het orgaan zal verwijderen, draagt ervoor zorg dat de donor op duidelijke wijze mondeling en
      schriftelijk en desgewenst met behulp van audio-visuele middelen, wordt geïnformeerd over de aard en het doel
      van de verwijdering en de te verwachten gevolgen en risico's voor diens gezondheid en overige leefomstandigheden.
      Tevens vergewist hij zich ervan dat de donor de toestemming vrijelijk en in het besef van de gevolgen heeft
      verleend en op de hoogte is van het bepaalde in deze wet omtrent de vergoeding van de kosten.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel3
  - number: '3.3'
    text: |-
      Wanneer redelijkerwijs aannemelijk is dat de verwijdering van het orgaan bij leven blijvende gevolgen zal hebben
      voor de gezondheid van de donor, geschiedt deze slechts indien de persoon ten behoeve van wie de verwijdering
      plaats zal vinden, in levensgevaar verkeert en dit niet op andere wijze even goed kan worden afgewend.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel3
  - number: '4.1'
    text: |-
      Verwijdering bij leven van een orgaan van een meerderjarige die niet in staat is tot een redelijke waardering
      van zijn belangen ter zake, geschiedt slechts indien het een regenererend orgaan betreft en de verwijdering
      geen blijvende gevolgen zal hebben voor de gezondheid van de donor en alleen ten behoeve van implantatie bij een
      bloedverwant tot en met de tweede graad die in levensgevaar verkeert en van wie het levensgevaar niet op andere
      wijze even goed kan worden afgewend en indien tevens de donor een zwaarwegend belang heeft bij het afwenden van het
      levensgevaar van bedoelde bloedverwant.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel4
  - number: '4.2'
    text: |-
      De verwijdering, bedoeld in het eerste lid, geschiedt niet dan nadat toestemming is verkregen van de wettelijke
      vertegenwoordiger dan wel bij ontbreken van deze van de echtgenoot, geregistreerde partner of andere levensgezel
      dan wel bij ontbreken van dezen van een ouder of meerderjarig kind van de donor, alsmede van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel4
  - number: '4.3'
    text: |-
      Degene die het orgaan zal verwijderen, draagt ervoor zorg dat de in het tweede lid bedoelde wettelijke
      vertegenwoordiger dan wel echtgenoot, geregistreerde partner of andere levensgezel dan wel ouder of kind alsmede,
      indien mogelijk, de donor op duidelijke wijze mondeling en desgewenst schriftelijk en desgewenst met behulp van
      audio-visuele middelen, worden geïnformeerd over de aard en het doel van de verwijdering en de te verwachten
      gevolgen voor de donor. Tevens vergewist hij zich ervan dat voldaan is aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel4
  - number: '5.1'
    text: |-
      Verwijdering bij leven van een orgaan van een minderjarige van twaalf jaar of ouder geschiedt slechts indien het
      een regenererend orgaan betreft en de verwijdering geen blijvende gevolgen zal hebben voor de gezondheid van de
      donor en alleen ten behoeve van implantatie bij een bloedverwant tot en met de tweede graad die in levensgevaar
      verkeert en van wie het levensgevaar niet op andere wijze even goed kan worden afgewend. De verwijdering geschiedt
      niet dan nadat de minderjarige toestemming heeft gegeven en de toestemming van de ouders die de ouderlijke macht
      uitoefenen of de voogd en van de kinderrechter is verkregen.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel5
  - number: '5.2'
    text: |-
      Verwijdering bij leven van een orgaan van een minderjarige die de leeftijd van twaalf jaar nog niet heeft bereikt
      en van een minderjarige van twaalf jaar of ouder die niet in staat is tot een redelijke waardering van zijn
      belangen ter zake, geschiedt slechts indien het een regenererend orgaan betreft en de verwijdering geen blijvende
      gevolgen zal hebben voor de gezondheid van de donor en alleen ten behoeve van implantatie bij een bloedverwant
      tot en met de tweede graad die in levensgevaar verkeert en van wie het levensgevaar niet op andere wijze even goed
      kan worden afgewend en indien tevens de donor een zwaarwegend belang heeft bij het afwenden van het levensgevaar
      van bedoelde bloedverwant. De verwijdering geschiedt niet dan nadat de toestemming van de ouders die de ouderlijke
      macht uitoefenen of de voogd en van de kinderrechter is verkregen.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel5
  - number: '5.3'
    text: |-
      Degene die het orgaan zal verwijderen, draagt ervoor zorg dat de ouders of de voogd alsmede, indien mogelijk, de
      donor op duidelijke wijze mondeling en schriftelijk en desgewenst met behulp van audio-visuele middelen, worden
      geïnformeerd over de aard en het doel van de verwijdering en de te verwachten gevolgen voor de donor. Tevens
      vergewist hij zich ervan dat voldaan is aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel5
  - number: 5a.1
    text: |-
      De informatie, bedoeld in de [artikelen 3, tweede lid][ref1], [4, derde lid][ref2], en [5, derde lid][ref3], omvat
      in ieder geval de informatie, bedoeld in de bijlage bij richtlijn 2004/23/EG van het Europees Parlement en de
      Raad van 31 maart 2004 tot vaststelling van kwaliteits- en veiligheidsnormen voor het doneren, verkrijgen, testen,
      bewerken, bewaren en distribueren van menselijke weefsels en cellen (PbEU L 102).


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel5
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '5'
        hoofdstuk: '2'
  - number: 5a.2
    text: |-
      Een wijziging van de in het eerste lid genoemde richtlijn gaat voor de toepassing van dit artikel gelden met ingang
      van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel5a
  - number: '6'
    text: |-
      De toestemming, bedoeld in dit hoofdstuk, wordt vooraf verleend bij een verklaring die ten minste eigenhandig is
      gedagtekend en ondertekend. Zij kan vóór de verwijdering van het orgaan te allen tijde worden herroepen.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel6
  - number: '7'
    text: |-
      Aan de donor en degenen van wie ingevolge dit hoofdstuk toestemming voor het verwijderen van een orgaan is vereist,
      mogen uitsluitend de kosten, bedoeld in [artikel 2][ref1], worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel2
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '2'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      Het verwijderen van een orgaan bij leven is slechts toegestaan, indien daarvoor toestemming is verleend ingevolge
      [artikel 3][ref1], [4][ref2] of [5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel5
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '5'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      Meerderjarigen en minderjarigen van twaalf jaar of ouder, die in staat zijn tot een redelijke waardering van
      hun belangen ter zake, kunnen toestemming verlenen tot het na hun overlijden verwijderen van hun organen of
      bepaalde door hen aan te wijzen organen, dan wel daartegen bezwaar maken. De wettelijk vertegenwoordiger van
      een meerderjarige die niet in staat is tot een redelijke waardering van zijn belangen ter zake van orgaandonatie
      kan namens hem toestemming verlenen tot het na zijn overlijden verwijderen van zijn organen of bepaalde door de
      wettelijke vertegenwoordiger aan te wijzen organen, dan wel daartegen bezwaar maken.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel9
  - number: '9.2'
    text: |-
      De toestemming wordt verleend en het bezwaar gemaakt door het invullen en laten registreren van een donorformulier
      als bedoeld in [artikel 10][ref1]. Indien een in het eerste lid bedoelde persoon de beslissing over het verwijderen
      van zijn organen wenst over te laten aan de in [artikel 11][ref2] bedoelde nabestaanden of aan een door hem te
      bepalen persoon, kan hij dat ook op het donorformulier te kennen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.3'
    text: |-
      Een wilsverklaring omtrent het verwijderen van organen kan te allen tijde worden herroepen door het opnieuw
      invullen en laten registreren van een donorformulier.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel9
  - number: '9.4'
    text: |-
      Een wilsbeschikking met een in dit artikel bedoelde strekking kan ook worden afgelegd bij een schriftelijke
      verklaring die ten minste eigenhandig is gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel9
  - number: '9.5'
    text: |-
      Een in algemene bewoordingen gestelde herroeping van een uiterste wilsbeschikking houdt niet in een herroeping van
      een wilsbeschikking als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel9
  - number: '10.1'
    text: |-
      Onze minister draagt ervoor zorg dat iedere ingezetene als bedoeld in de [Wet basisregistratie personen][ref1], een
      donorformulier wordt toegezonden, wanneer hij of zij de leeftijd van achttien jaren heeft bereikt. Donorformulieren
      worden voorts op verzoek door de zorg van Onze minister en door het college van burgemeester en wethouders
      kosteloos ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0033715
  - number: '10.2'
    text: |-
      Er is een donorregister waarin, met het oog op de kenbaarheid van de wilsbeschikking van de betrokkene ter zake
      aantekening wordt gehouden van door middel van het donorformulier verleende toestemming tot of gemaakt bezwaar
      tegen het na overlijden verwijderen van organen, dan wel de door middel van dat formulier te kennen gegeven wens de
      beslissing ter zake over te laten aan de in [artikel 11][ref1] bedoelde nabestaanden of aan een door hem te bepalen
      persoon dan wel dat de betrokkene geen bezwaar heeft tegen het na zijn overlijden verwijderen van zijn organen.
      Daarbij kan worden aangetekend dat een wilsbeschikking namens een betrokkene door een andere persoon kenbaar is
      gemaakt. Het register wordt gehouden door of vanwege Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Het register kan door of in opdracht van een arts dag en nacht worden geraadpleegd wanneer dat met het oog op de
      voorgenomen verwijdering van een orgaan noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10
  - number: '10.4'
    text: |-
      Bij de toezending van het donorformulier wordt uitdrukkelijk vermeld dat een meerderjarige persoon door of namens
      wie geen wilsverklaring of wilsbeschikking als bedoeld in [artikel 9][ref1] is afgelegd en verstrekt, zes weken
      na het verzenden van een herinnering als bedoeld in [artikel 10a, eerste lid][ref2], in het donorregister wordt
      geregistreerd als een persoon die geen bezwaar heeft tegen het na zijn overlijden verwijderen van zijn organen.
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de vorm, inhoud en toezending van het
      donorformulier en het bijhouden en de toegankelijkheid van het donorregister. Daarbij kan worden bepaald dat een
      donorformulier wordt toegezonden aan personen die na het bereiken van de leeftijd van negentien jaar nieuw als
      ingezetene zijn ingeschreven dan wel opnieuw als ingezetene zijn geregistreerd in de basisregistratie personen.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: 10a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.5'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens het vierde lid wordt niet gedaan dan nadat het
      ontwerp aan de beide kamers der Staten-Generaal is overgelegd en sedert die overlegging vier weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10
  - number: 10a.1
    text: |-
      Indien zes weken na verzending van het donorformulier, bedoeld in [artikel 10, eerste lid][ref1], geen invulling
      is gegeven aan het bepaalde in [artikel 9, eerste en tweede lid][ref2], zendt Onze Minister de betrokkene een
      herinnering, vergezeld van een nieuw donorformulier en een mededeling overeenkomstig het bepaalde in het tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10a.2
    text: |-
      Indien door of namens de betrokkene zes weken na het verzenden van de herinnering, bedoeld in het eerste lid, geen
      invulling is gegeven aan het bepaalde in [artikel 9, eerste en tweede lid][ref1], wordt hij in het donorregister
      geregistreerd als een persoon die geen bezwaar heeft tegen het na zijn overlijden verwijderen van zijn organen.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 10a.3
    text: |-
      De betrokkene ontvangt binnen zes weken na de registratie, bedoeld in het tweede lid, een bevestiging van het feit
      dat hij geregistreerd is als een persoon die geen bezwaar heeft tegen het na zijn overlijden verwijderen van zijn
      organen, vergezeld van een mededeling overeenkomstig het bepaalde in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Zodra duidelijk of aannemelijk is dat een betrokkene als bedoeld in het tweede lid niet in staat is tot een
      redelijke waardering van zijn belangen, wordt de geregistreerde toestemming vervangen door de registratie dat
      de beslissing wordt overgelaten aan een bepaalde persoon, zijnde de wettelijk vertegenwoordiger van betrokkene.
      Betrokkene ontvangt hiervan binnen zes weken een bevestiging.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10a
  - number: 10a.5
    text: |-
      De betrokkene of diens wettelijke vertegenwoordiger kan een registratie als bedoeld in het tweede of vierde lid te
      allen tijde doen wijzigen door het invullen en laten registreren van een donorformulier.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10a
  - number: 10b.1
    text: |-
      De burgemeester draagt ervoor zorg dat aan een meerderjarige persoon die als ingezetene in de basisregistratie
      personen is ingeschreven bij het in behandeling nemen van diens aanvraag voor een nationaal paspoort als bedoeld in
      [artikel 2, eerste lid, onder a, van de Paspoortwet][ref1], een Nederlandse identiteitskaart als bedoeld in artikel
      2, tweede lid, van de Paspoortwet of een rijbewijs als bedoeld in [artikel 107 van de Wegenverkeerswet 1994][ref2]
      schriftelijke informatie over donorregistratie wordt overhandigd en informatie over de wijze waarop de betrokkene
      de op hem betrekking hebbende registratie kan raadplegen en wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005212#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10b
    references:
      - id: ref1
        bwb_id: BWBR0005212
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '107'
  - number: 10b.2
    text: De schriftelijke informatie wordt door Onze Minister kosteloos aan de burgemeester ter beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel10b
  - number: '11.1'
    text: |-
      Indien een persoon de beslissing over het verwijderen van organen heeft overgelaten aan zijn nabestaanden,
      kan na het vaststellen van de dood toestemming voor het verwijderen van zijn organen worden verleend door de
      echtgenoot, geregistreerde partner of andere levensgezel, dan wel bij afwezigheid of onbereikbaarheid van deze
      door de onmiddellijk bereikbare meerderjarige bloedverwanten tot en met de tweede graad dan wel bij afwezigheid of
      onbereikbaarheid van dezen door de onmiddellijk bereikbare meerderjarige aanverwanten tot en met de tweede graad.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien een meerderjarige, waarvan duidelijk of aannemelijk is dat deze niet in staat is tot een redelijke
      waardering van zijn belangen ter zake van orgaandonatie, in het donorregister is geregistreerd als een persoon
      die toestemming heeft verleend voor of die geen bezwaar heeft tegen het na zijn overlijden verwijderen van zijn
      organen, wordt na het vaststellen van de dood deze toestemming of dit geen bezwaar bevestigd of teniet gedaan
      door zijn wettelijk vertegenwoordiger. Bij afwezigheid of onbereikbaarheid van deze persoon kan de beslissing
      worden genomen door de in het eerste lid bedoelde nabestaanden. Bij afwezigheid of onbereikbaarheid van al deze
      nabestaanden wordt de toestemming dan wel het hebben van geen bezwaar geacht te ontbreken.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien een meerderjarige de beslissing over het verwijderen van zijn organen heeft overgelaten aan een bepaalde
      persoon, kan na het vaststellen van de dood toestemming voor het verwijderen van zijn organen worden verleend door
      die persoon. Bij afwezigheid of onbereikbaarheid van die persoon kan toestemming worden verleend door de in het
      eerste lid bedoelde nabestaanden.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.4'
    text: |-
      Indien van een meerderjarige geen registratie in het donorregister aanwezig is, kan na het vaststellen van de
      dood toestemming voor het verwijderen van zijn organen worden verleend door de echtgenoot, geregistreerde partner
      of andere levensgezel, dan wel bij afwezigheid of onbereikbaarheid van deze door de onmiddellijk bereikbare
      meerderjarige bloedverwanten tot en met de tweede graad dan wel bij afwezigheid of onbereikbaarheid van dezen door
      de onmiddellijke bereikbare meerderjarige aanverwanten tot en met de tweede graad.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.5'
    text: |-
      Indien een minderjarige van twaalf jaar of ouder de beslissing over het verwijderen van zijn organen heeft
      overgelaten aan een bepaalde persoon, kan na het vaststellen van de dood toestemming voor het verwijderen van zijn
      organen worden verleend door de in de wilsbeschikking genoemde persoon. Bij afwezigheid of onbereikbaarheid van die
      persoon kan toestemming worden verleend door de ouders die de ouderlijke macht uitoefenen, of de voogd.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.6'
    text: |-
      Indien van een minderjarige van twaalf jaar of ouder geen wilsverklaring of wilsbeschikking als bedoeld in
      [artikel 9, vierde lid][ref1], aanwezig is, kan na het vaststellen van de dood toestemming voor het verwijderen van
      organen worden verleend door de ouders die de ouderlijke macht uitoefenen, of de voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.7'
    text: |-
      Ten aanzien van een minderjarige beneden de twaalf jaar kan na het vaststellen van de dood toestemming voor het
      verwijderen van zijn organen worden verleend door de ouders die de ouderlijke macht uitoefenen, of de voogd.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.8'
    text: |-
      Bij een verschil van mening tussen de bloedverwanten, de aanverwanten, onderscheidenlijk de ouders, bedoeld in het
      eerste tot en met zevende lid, kan de toestemming niet worden verleend.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.9'
    text: |-
      Indien een persoon toestemming heeft verleend voor het na zijn overlijden verwijderen van organen, kan voor het
      verwijderen van een orgaan dat niet is opgenomen in de tekst van een op het tijdstip van toestemming geldend
      donorformulier en tegen verwijdering waarvan hij niet anderszins reeds zelf bezwaar heeft gemaakt, toestemming
      worden verleend met overeenkomstige toepassing van het eerste, zevende en achtste lid.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
  - number: '11.10'
    text: |-
      Uitsluitend indien de verwachting bestaat dat de dood op grond van circulatoire criteria zal worden vastgesteld,
      mag de toestemming, bedoeld in de vorige leden, reeds worden verleend na het verstrekken van de informatie, bedoeld
      in [artikel 20, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '12'
    text: |-
      Overlijdt een persoon voor het bereiken van de zestienjarige leeftijd en heeft hij ingevolge [artikel 9][ref1]
      toestemming gegeven voor het verwijderen van zijn organen, dan vindt geen verwijdering plaats indien daartegen
      bezwaar wordt gemaakt door een ouder die de ouderlijke macht uitoefent of de voogd. Bij afwezigheid of
      onbereikbaarheid van beide ouders of van de voogd kan de verwijdering plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13'
    text: |-
      Tenzij degene die toestemming verleent of geen bezwaar heeft uitdrukkelijk anders bepaalt, wordt toestemming
      als bedoeld in deze paragraaf verleend ten behoeve van, en heeft het geen bezwaar als bedoeld in deze paragraaf
      betrekking op, implantatie, daaronder begrepen op implantatie gericht wetenschappelijk onderzoek, indien het
      orgaan na de verwijdering voor implantatie ongeschikt blijkt te zijn. Bij algemene maatregel van bestuur kan worden
      bepaald dat het verlenen van toestemming of het hebben van geen bezwaar niet is toegestaan voor bij die maatregel
      aan te wijzen, uit een oogpunt van geneeskundige behandeling niet van belang zijnde, doeleinden.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel13
  - number: '14.1'
    text: |-
      Voordat een orgaan wordt verwijderd, wordt de dood vastgesteld door een arts die niet bij de verwijdering of
      implantatie van het orgaan betrokken mag zijn. Indien het voornemen bestaat tot het verwijderen van een orgaan uit
      een stoffelijk overschot, wordt de dood vastgesteld aan de hand van de volgens de laatste stand van de wetenschap
      geldende methoden en criteria voor het vaststellen van de hersendood onderscheidenlijk van de dood op grond
      van circulatoire criteria door een ter zake kundige arts. De wijze waarop de hersendood is vastgesteld, wordt
      vastgelegd in een verklaring waarvan het model is opgenomen in het in [artikel 15, eerste lid][ref1], bedoelde
      protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel15
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Onder hersendood wordt verstaan het volledig en onherstelbaar verlies van de functies van de hersenen, inclusief
      de hersenstam en het verlengde merg. Vaststelling van de hersendood vindt slechts plaats in geval van een dodelijk
      hersenletsel waarvan de oorzaak bekend is en dat niet behandelbaar is. Zij geschiedt eerst nadat aannemelijk is
      geworden dat andere oorzaken van bewusteloosheid en reactieloosheid niet aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel14
  - number: '14.3'
    text: |-
      Onder de dood op grond van circulatoire criteria wordt verstaan een onomkeerbare afwezigheid van de circulatie
      en ademhaling.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel14
  - number: '15.1'
    text: |-
      De Gezondheidsraad stelt met inachtneming van [artikel 14, tweede en derde lid][ref1], vast welke de volgens de
      laatste stand van de wetenschap geldende methoden en criteria voor het met zekerheid vaststellen van de hersendood
      onderscheidenlijk de dood op grond van circulatoire criteria zijn. Op basis daarvan stelt de Gezondheidsraad
      protocollen op met betrekking tot de bij het vaststellen van de hersendood onderscheidenlijk de dood op grond van
      circulatoire criteria in ziekenhuizen te volgen procedures en uit te voeren onderzoeken in gevallen waarin het
      voornemen bestaat tot verwijdering van een orgaan. De protocollen worden vastgesteld bij algemene maatregel van
      bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel14
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel15
  - number: '16'
    text: |-
      Bij verwijdering van een orgaan uit een stoffelijk overschot geschiedt de lijkschouwing als bedoeld in
      [artikel 3 van de Wet op de lijkbezorging][ref1] (*Stb*. 1991, 133) niet door een arts die bij de verwijdering of
      de implantatie van het orgaan betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel3
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '3'
  - number: '17'
    text: |-
      Bij de aanwezigheid of het vermoeden van een niet natuurlijke dood mag een orgaan niet worden verwijderd, voordat
      is gebleken dat de officier van justitie de in [artikel 76, tweede lid, van de Wet op de lijkbezorging][ref1]
      bedoelde toestemming verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel76
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '76'
  - number: '18.1'
    text: |-
      De daartoe in het protocol, bedoeld in [artikel 23][ref1], aangewezen functionaris doet van het vermoedelijk
      beschikbaar komen van organen voor implantatie onmiddellijk melding bij een orgaancentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel23
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '18.2'
    text: |-
      Het orgaancentrum wijst aan wie voor implantatie van een bij het centrum aangemeld orgaan in aanmerking komt.
      Indien geen onmiddellijke aanwijzing kan plaatsvinden en het orgaancentrum zulks op medische gronden noodzakelijk
      acht, kan het bepalen dat een daarvoor naar zijn aard geschikt orgaan voor implantatie beschikbaar dient te
      blijven.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel18
  - number: '18.3'
    text: |-
      Bij de aanwijzing wordt met geen andere factoren rekening gehouden dan met de bloed- en weefselovereenkomst
      van donor en ontvanger van het orgaan, de medische urgentie van de ontvanger en andere, met de toestand van het
      orgaan samenhangende, omstandigheden dan wel, indien deze factoren geen uitsluitsel geven, met de wachttijd van de
      ontvanger. Bij algemene maatregel van bestuur kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel18
  - number: '20.1'
    text: |-
      Wanneer een gerede kans bestaat dat een persoon binnen afzienbare tijd zal overlijden, maar in ieder geval zo
      spoedig mogelijk na het vaststellen van de dood, gaat de daartoe in het protocol, bedoeld in [artikel 23][ref1],
      aangewezen functionaris na wat ten aanzien van de betrokkene is geregistreerd in het donorregister, tenzij reeds
      vaststaat dat de betrokkene medisch gezien niet in aanmerking komt als donor.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel23
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '20.2'
    text: |-
      De aangewezen functionaris verstrekt de daarvoor in aanmerking komende, onmiddellijk bereikbare naasten informatie
      over de registratie in het donorregister. In geval van een meerderjarige waarvan duidelijk of aannemelijk is dat
      hij niet in staat is tot een redelijke waardering van zijn belangen verstrekt hij daarenboven informatie aan diens
      wettelijke vertegenwoordiger, indien deze aanwezig en bereikbaar is.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
  - number: '20.3'
    text: |-
      Indien de registratie niet overeenkomt met een andere aanwezige verklaring als bedoeld in
      [artikel 9, vierde lid][ref1], geldt de laatst gedateerde registratie dan wel verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.4'
    text: |-
      Indien de betrokkene in het donorregister is geregistreerd als een persoon die toestemming heeft verleend voor
      dan wel geen bezwaar heeft tegen het na zijn dood verwijderen van zijn organen en een andersluidende verklaring
      als bedoeld in [artikel 9, vierde lid][ref1], aanwezig is, geldt in afwijking van het derde lid de laatstbedoelde
      verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.5'
    text: |-
      Indien de betrokkene in het register is geregistreerd als een persoon die toestemming heeft verleend voor dan
      wel geen bezwaar heeft tegen het na zijn overlijden verwijderen van zijn organen en een andersluidende verklaring
      ontbreekt, maar zijn nabestaanden, bedoeld in [artikel 11, eerste lid][ref1], maken aannemelijk dat die registratie
      niet overeenkomt met de wens van de betrokkene, geldt de informatie van de nabestaanden.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.6'
    text: |-
      Indien geen registratie ten aanzien van de betrokkene aanwezig is of de betrokkene gebruik heeft gemaakt van de in
      de tweede volzin van [artikel 9, tweede lid][ref1], bedoelde mogelijkheid, geeft de aangewezen functionaris, zodra
      redelijkerwijs vaststaat dat de betrokkene binnen afzienbare termijn zal overlijden, aan de persoon of personen,
      die op grond van [artikel 11][ref2] bevoegd zijn tot het verlenen van toestemming voor het verwijderen van organen,
      passende informatie over de mogelijkheid van orgaandonatie. Na het vaststellen van de dood verzoekt hij hen om
      toestemming voor het verwijderen van organen, tenzij reeds is gebleken van bezwaar daartegen van de vorenbedoelde
      bevoegde persoon of personen. Uitsluitend indien de verwachting bestaat dat de dood op grond van circulatoire
      criteria zal worden vastgesteld, mag de functionaris de toestemming reeds na het verstrekken van de informatie
      vragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.7'
    text: |-
      De aangewezen functionaris stelt de daarvoor in aanmerking komende, onmiddellijk bereikbare naasten op de hoogte
      van de wijze waarop aan een toestemming voor het verwijderen van organen gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
  - number: '20.8'
    text: |-
      Indien de betrokkene zelf toestemming heeft gegeven voor het verwijderen van organen, stelt de daartoe in het
      protocol, bedoeld in [artikel 23][ref1], aangewezen functionaris de daarvoor in aanmerking komende, onmiddellijk
      bereikbare naasten op de hoogte van de wijze waarop aan de toestemming gevolg wordt gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel23
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '20.9'
    text: |-
      De toepassing van dit artikel geschiedt met inachtneming van de regels gesteld in het in [artikel 23][ref1]
      bedoelde protocol. Van de toepassing doet de daartoe in het protocol, bedoeld in [artikel 23][ref2], aangewezen
      functionaris verslag door invulling van een door het orgaancentrum vastgesteld papieren of digitaal formulier. Bij
      ministeriële regeling kunnen regels worden gesteld omtrent de verstrekking van gegevens betreffende de toepassing
      van dit artikel aan het orgaancentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel23
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '20.10'
    text: |-
      Aan de in dit artikel bedoelde functionarissen wordt voor zover dat voor de uitvoering van de werkzaamheden
      betreffende de toepassing van dit artikel noodzakelijk is, inzage gegeven in het dossier van de patiënt.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
  - number: '20.11'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat in dit artikel gestelde regels niet van toepassing zijn
      op bij die maatregel aan te wijzen categorieën van artsen. Daarbij kan worden bepaald dat de taken die in dit
      artikel zijn opgedragen aan een functionaris als bedoeld in het eerste lid, door een ander worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel20
  - number: '21'
    text: 'Het verwijderen van een orgaan na overlijden is slechts toegestaan, indien:'
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel21
  - number: 21.a
    text: |-
      met toepassing van het bepaalde bij of krachtens [artikel 20][ref1] is vastgesteld dat daarvoor door of ten aanzien
      van de overledene toestemming is verleend dan wel daartegen geen bezwaar bestaat overeenkomstig deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 21.b
    text: |-
      de aangewezen functionaris, bedoeld in [artikel 23][ref1], zich ervan heeft vergewist dat de overledene ten tijde
      van het verlenen van toestemming dan wel van de registratie als bedoeld in [artikel 10a][ref2] wilsbekwaam was;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel10a
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: 10a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 21.c
    text: |-
      voldaan is aan [de artikelen 14][ref1], [16][ref2] en [17][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel17
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 21.d
    text: |-
      het voor implantatie ter beschikking gestelde orgaan overeenkomstig [artikel 18][ref1] is aangemeld bij een
      orgaancentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22.1'
    text: |-
      Indien een persoon in het donorregister is geregistreerd als een persoon die toestemming heeft verleend voor of
      geen bezwaar heeft tegen het na zijn overlijden verwijderen van een orgaan, mogen wanneer redelijkerwijs vaststaat
      dat betrokkene binnen afzienbare tijd zal overlijden in verband met de implantatie reeds voor het vaststellen van
      de dood voorbereidingen worden getroffen voor zover deze niet strijdig zijn met de geneeskundige behandeling van
      die persoon en uitstel tot na het vaststellen van de dood niet mogelijk is. Die voorbereidingen kunnen bestaan uit:
        - onderzoek noodzakelijk voor de voorbereiding van de implantatie;
        - het in werking stellen of in stand houden van de kunstmatige beademing;
        - het kunstmatig in stand houden van de bloedsomloop, en
        - andere maatregelen noodzakelijk om organen geschikt te houden voor implantatie.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel22
  - number: '22.2'
    text: |-
      Indien ten aanzien van een persoon in het donorregister geen registratie aanwezig is of gebruik is gemaakt van de
      in de tweede volzin van [artikel 9, tweede lid][ref1], bedoelde mogelijkheid, mogen reeds voor het vaststellen van
      de dood, de in het eerste lid genoemde voorbereidingen worden getroffen voor zover:


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 22.2.a
    text: het redelijkerwijs vaststaat dat betrokkene binnen afzienbare tijd zal overlijden;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel22
  - number: 22.2.b
    text: de voorbereidingen niet strijdig zijn met de geneeskundige behandeling van betrokkene;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel22
  - number: 22.2.c
    text: uitstel van de voorbereidingen tot na het vaststellen van de dood niet mogelijk is; en
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel22
  - number: 22.2.d
    text: |-
      de procedure ter verstrekking van informatie, bedoeld in [artikel 20 zesde lid][ref1], nog niet heeft geleid tot
      bezwaar van de persoon of personen die op grond van [artikel 11][ref2] bevoegd zijn tot het geven van toestemming
      voor het verwijderen van organen tegen het treffen van de voorbereidingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '22.3'
    text: |-
      Indien ten aanzien van een persoon in het donorregister geen registratie aanwezig is of gebruik is gemaakt van de
      in de [tweede volzin van artikel 9, tweede lid][ref1], bedoelde mogelijkheid, kunnen na het het vaststellen van de
      dood, zolang de procedure ter verkrijging van de voor het verwijderen van organen ingevolge deze wet noodzakelijke
      toestemmingen nog niet heeft geleid tot weigering daarvan, de volgende maatregelen worden getroffen: - onderzoek
      noodzakelijk voor de voorbereiding van implantatie;
        - het in stand houden van de kunstmatige beademing;
        - het kunstmatig in stand houden van de bloedsomloop, en
        - andere maatregelen noodzakelijk om organen geschikt te houden voor implantatie.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '23.1'
    text: |-
      Het bestuur van een ziekenhuis draagt zorg voor vaststelling van een protocol met betrekking tot ter beschikking
      stelling van organen ten behoeve van implantatie en ziet toe op de naleving daarvan.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
  - number: '23.2'
    text: |-
      In het protocol worden de functionarissen aangewezen die binnen het ziekenhuis zijn belast met de uitvoering van de
      in de [artikelen 18, eerste lid][ref1], en [20][ref2] genoemde taken en worden regels gesteld omtrent:


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 23.2.a
    text: de wijze waarop wordt nagegaan of een overledene in aanmerking komt als donor;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
  - number: 23.2.b
    text: 'de wijze waarop:'
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
  - number: 23.2.b.1°
    text: |-
      overeenkomstig [artikel 20, eerste lid][ref1], het donorregister wordt geraadpleegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 23.2.b.2°
    text: |-
      de personen, bedoeld in [artikel 20, tweede lid][ref1], worden geïnformeerd;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 23.2.b.3°
    text: |-
      wordt omgegaan met de informatie van nabestaanden, bedoeld in [artikel 20, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 23.2.b.4°
    text: |-
      de personen, bedoeld in [artikel 20, zesde lid][ref1], om toestemming wordt gevraagd; dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 23.2.b.5°
    text: |-
      de personen, bedoeld in [20, zevende lid][ref1], op de hoogte worden gesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 23.2.c
    text: de procedure die wordt gevolgd bij de melding van een orgaan bij een orgaancentrum;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
  - number: 23.2.d
    text: |-
      de wijze waarop aan de personen, bedoeld in [artikel 20, zesde en zevende lid][ref1], nazorg wordt verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 23.2.e
    text: de voorlichting in het ziekenhuis over de in het protocol gestelde regels.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
  - number: '23.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud van het in het eerste lid
      bedoelde protocol en kan worden bepaald dat dit artikel geheel of gedeeltelijk niet van toepassing is op bepaalde
      categorieën ziekenhuizen.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
  - number: '23.4'
    text: |-
      Indien in een ziekenhuis de mogelijkheid bestaat tot het vaststellen van de hersendood, bevat het protocol tevens
      de daarvoor geldende methoden en criteria en de daarbij te volgen procedures en onderzoeken zoals vastgesteld op
      grond van [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel15
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '23.5'
    text: |-
      De voordracht voor een krachtens het derde lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel23
  - number: '24.1'
    text: |-
      Het bemiddelen bij het verkrijgen, bij het typeren en bij het vervoeren van organen van donoren, alsmede het
      toewijzen van die organen aan een daarvoor geschikte ontvanger mag slechts geschieden door een orgaancentrum, dat
      daartoe een vergunning van Onze minister behoeft.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel24
  - number: '24.2'
    text: |-
      Op de uitvoering van de in het eerste lid bedoelde taak door een orgaancentrum waaraan daartoe een vergunning
      is verleend, is de [Kaderwet zelfstandige bestuursorganen][ref1] van toepassing, met uitzondering van
      [artikel 22 van die wet][ref2], voor zover het besluiten betreft met betrekking tot het toewijzen van organen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
  - number: '25.1'
    text: |-
      Een vergunning kan uitsluitend worden verleend aan een rechtspersoon wiens werkzaamheid
      niet is gericht op het behalen van winst en die geen weefselinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet veiligheid en kwaliteit lichaamsmateriaal][ref1] is.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '1'
  - number: '25.2'
    text: |-
      Een vergunning wordt geweigerd, indien niet wordt of naar redelijke verwachting niet zal worden voldaan aan het
      bepaalde bij of krachtens deze wet, een doelmatige voorziening in de behoefte aan organen niet is gebaat bij
      verlening van de vergunning, dan wel een doelmatige samenwerking met andere orgaancentra en met orgaanbanken als
      bedoeld in [artikel 1, eerste lid, onderdeel l, van de Wet veiligheid en kwaliteit lichaamsmateriaal][ref1] niet
      is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0014682
        artikel: '1'
  - number: '26.1'
    text: |-
      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: 26.1.a
    text: de deskundigheid van het personeel;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: 26.1.b
    text: de samenstelling van het bestuur;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: 26.1.c
    text: de inschrijving van mogelijke ontvangers van organen;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: 26.1.d
    text: |-
      de openbaarmaking van de normen voor inschrijving van mogelijke ontvangers en voor toewijzing van organen aan een
      ontvanger;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: 26.1.e
    text: de bescherming van de persoonlijke levenssfeer van donoren en ontvangers van organen;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: 26.1.f
    text: de uitrusting en bereikbaarheid van het orgaancentrum;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: 26.1.g
    text: de verslaglegging over de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: '26.2'
    text: |-
      Een beperking of voorschrift kan worden gewijzigd of ingetrokken. Ook na het verlenen van de vergunning kunnen
      daaraan beperkingen worden gesteld of voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel26
  - number: '27'
    text: |-
      Een vergunning kan worden ingetrokken indien niet meer wordt voldaan aan het bepaalde bij of krachtens deze wet of
      de [Wet veiligheid en kwaliteit lichaamsmateriaal][ref1] of de aan de vergunning verbonden voorschriften dan wel
      indien in strijd is gehandeld met een beperking waaronder de vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014682
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014682
  - number: 31a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel31a
  - number: '32.1'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk in strijd handelt met het bepaalde in [de artikelen 8][ref1] en [21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel21
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.2'
    text: 'Met dezelfde straf wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
  - number: 32.2.a
    text: |-
      degene die opzettelijk teweegbrengt of bevordert dat een ander aan een derde toestemming verleent voor het bij
      leven verwijderen van een orgaan waarvoor een vergoeding wordt betaald die meer bedraagt dan de kosten, bedoeld in
      [artikel 2][ref1], dan wel dat een ander in strijd handelt met [artikel 7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel7
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '7'
        hoofdstuk: '2'
  - number: 32.2.b
    text: |-
      degene die openlijk hetzij voor het ontvangen van een orgaan een vergoeding aanbiedt die meer bedraagt dan de
      kosten, bedoeld in [artikel 2][ref1], hetzij zich tegen een dergelijke vergoeding als donor aanbiedt hetzij
      diensten aanbiedt bestaande uit gedragingen, strafbaar gesteld in onderdeel *a*;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel2
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '2'
        hoofdstuk: '1'
  - number: 32.2.c
    text: |-
      degene die de behoefte aan, of de beschikbaarheid van organen onder de aandacht brengt met het oogmerk financiële
      of vergelijkbare voordelen aan te bieden of te behalen;
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
  - number: 32.2.d
    text: |-
      degene die opzettelijk teweegbrengt of bevordert dat bestanddelen van een persoon of van een stoffelijk overschot,
      bij wie onderscheidenlijk waarbij de hersenen geheel of nagenoeg geheel ontbreken, worden gebruikt met het
      oogmerk om in of aan het lichaam van een ander ten behoeve van diens geneeskundige behandeling te worden in- of
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
  - number: '32.3'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vijfde categorie wordt gestraft degene die
      handelt in strijd met het bepaalde in de [artikelen 22][ref1] en [24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '24'
        hoofdstuk: '4'
  - number: '32.4'
    text: De in het eerste tot en met derde lid strafbaar gestelde feiten zijn misdrijven.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister draagt zorg voor de informatievoorziening over het ter beschikking stellen van organen als bedoeld in
      de [hoofdstukken 2][ref1] en [3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008066
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008066
        hoofdstuk: '3'
  - number: '33.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze waarop uitvoering wordt gegeven
      aan de informatievoorziening, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel33
  - number: '33.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel33
  - number: '35.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel35
  - number: '35.2'
    text: |-
      Onze minister zendt binnen drie jaar en vervolgens na vijf jaar en na zeven jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel35
  - number: '36'
    text: 'Deze wet kan worden aangehaald als: Wet op de orgaandonatie.'
    url: https://wetten.overheid.nl/BWBR0008066/2022-01-01#Artikel36
