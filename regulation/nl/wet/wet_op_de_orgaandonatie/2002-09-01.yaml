preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede in verband met artikel 11 van de Grondwet, wenselijk is met
    het oog op de rechtszekerheid van de betrokkenen, ter bevordering van het aanbod en de rechtvaardige verdeling van
    geschikte organen en ter voorkoming van handel in organen bij wet regelen te stellen omtrent het ter beschikking
    stellen van organen ten behoeve van in het bijzonder de geneeskundige behandeling van anderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
  - number: 1.a
    text: 'Onze minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
  - number: 1.b
    text: 'orgaan: bestanddeel van het menselijk lichaam, met uitzondering van bloed en geslachtscellen;'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
  - number: 1.c
    text: |-
      donor: een persoon of stoffelijk overschot, door of ten aanzien van wie op grond van deze wet toestemming is
      verleend voor het bij hem of daaruit verwijderen van een orgaan;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
  - number: 1.d
    text: 'verwijderen: het verwijderen van een orgaan, anders dan ten behoeve van de donor zelf;'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
  - number: 1.e
    text: |-
      implantatie: het in- of aanbrengen van een orgaan van een donor in of aan het lichaam van een ander met het oog op
      diens geneeskundige behandeling;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
  - number: 1.f
    text: |-
      ziekenhuis: een voor de toepassing van de [Ziekenfondswet][ref1] (*Stb.* 1964, 392) of de
      [Algemene Wet Bijzondere Ziektekosten][ref2] (*Stb.* 1967, 655) als ziekenhuis of verpleeginrichting erkende of
      aangewezen instelling of een afdeling daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0002614
  - number: 1.g
    text: |-
      orgaancentrum: een instelling als bedoeld in [artikel 24][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 1.h
    text: |-
      orgaanbank: een instelling als bedoeld in [artikel 28][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel28
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '2'
    text: |-
      Toestemming voor het verwijderen van een orgaan, verleend met het oogmerk daarvoor een vergoeding te ontvangen
      die meer bedraagt dan de kosten, daaronder begrepen gederfde inkomsten, die een rechtstreeks gevolg zijn van het
      verwijderen van het orgaan, is nietig.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel2
  - number: '3.1'
    text: |-
      Een meerderjarige die in staat is tot een redelijke waardering van zijn belangen ter zake, kan toestemming verlenen
      voor het bij zijn leven bij hem verwijderen van een door hem aangewezen orgaan ten behoeve van implantatie bij een
      bepaalde persoon.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel3
  - number: '3.2'
    text: |-
      Degene die het orgaan zal verwijderen, draagt ervoor zorg dat de donor op duidelijke wijze mondeling en
      schriftelijk en desgewenst met behulp van audio-visuele middelen, wordt geïnformeerd over de aard en het doel
      van de verwijdering en de te verwachten gevolgen en risico's voor diens gezondheid en overige leefomstandigheden.
      Tevens vergewist hij zich ervan dat de donor de toestemming vrijelijk en in het besef van de gevolgen heeft
      verleend en op de hoogte is van het bepaalde in deze wet omtrent de vergoeding van de kosten.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel3
  - number: '3.3'
    text: |-
      Wanneer redelijkerwijs aannemelijk is dat de verwijdering van het orgaan bij leven blijvende gevolgen zal hebben
      voor de gezondheid van de donor, geschiedt deze slechts indien de persoon ten behoeve van wie de verwijdering
      plaats zal vinden, in levensgevaar verkeert en dit niet op andere wijze even goed kan worden afgewend.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel3
  - number: '4.1'
    text: |-
      Verwijdering bij leven van een orgaan van een meerderjarige die niet in staat is tot een redelijke waardering
      van zijn belangen ter zake, geschiedt slechts indien het een regenererend orgaan betreft en de verwijdering
      geen blijvende gevolgen zal hebben voor de gezondheid van de donor en alleen ten behoeve van implantatie bij een
      bloedverwant tot en met de tweede graad die in levensgevaar verkeert en van wie het levensgevaar niet op andere
      wijze even goed kan worden afgewend en indien tevens de donor een zwaarwegend belang heeft bij het afwenden van het
      levensgevaar van bedoelde bloedverwant.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel4
  - number: '4.2'
    text: |-
      De verwijdering, bedoeld in het eerste lid, geschiedt niet dan nadat toestemming is verkregen van de wettelijke
      vertegenwoordiger dan wel bij ontbreken van deze van de echtgenoot, geregistreerde partner of andere levensgezel
      dan wel bij ontbreken van dezen van een ouder of meerderjarig kind van de donor, alsmede van de rechtbank.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel4
  - number: '4.3'
    text: |-
      Degene die het orgaan zal verwijderen, draagt ervoor zorg dat de in het tweede lid bedoelde wettelijke
      vertegenwoordiger dan wel echtgenoot, geregistreerde partner of andere levensgezel dan wel ouder of kind alsmede,
      indien mogelijk, de donor op duidelijke wijze mondeling en desgewenst schriftelijk en desgewenst met behulp van
      audio-visuele middelen, worden geïnformeerd over de aard en het doel van de verwijdering en de te verwachten
      gevolgen voor de donor. Tevens vergewist hij zich ervan dat voldaan is aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel4
  - number: '5.1'
    text: |-
      Verwijdering bij leven van een orgaan van een minderjarige van twaalf jaar of ouder geschiedt slechts indien het
      een regenererend orgaan betreft en de verwijdering geen blijvende gevolgen zal hebben voor de gezondheid van de
      donor en alleen ten behoeve van implantatie bij een bloedverwant tot en met de tweede graad die in levensgevaar
      verkeert en van wie het levensgevaar niet op andere wijze even goed kan worden afgewend. De verwijdering geschiedt
      niet dan nadat de minderjarige toestemming heeft gegeven en de toestemming van de ouders die de ouderlijke macht
      uitoefenen of de voogd en van de kinderrechter is verkregen.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel5
  - number: '5.2'
    text: |-
      Verwijdering bij leven van een orgaan van een minderjarige die de leeftijd van twaalf jaar nog niet heeft bereikt
      en van een minderjarige van twaalf jaar of ouder die niet in staat is tot een redelijke waardering van zijn
      belangen ter zake, geschiedt slechts indien het een regenererend orgaan betreft en de verwijdering geen blijvende
      gevolgen zal hebben voor de gezondheid van de donor en alleen ten behoeve van implantatie bij een bloedverwant
      tot en met de tweede graad die in levensgevaar verkeert en van wie het levensgevaar niet op andere wijze even goed
      kan worden afgewend en indien tevens de donor een zwaarwegend belang heeft bij het afwenden van het levensgevaar
      van bedoelde bloedverwant. De verwijdering geschiedt niet dan nadat de toestemming van de ouders die de ouderlijke
      macht uitoefenen of de voogd en van de kinderrechter is verkregen.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel5
  - number: '5.3'
    text: |-
      Degene die het orgaan zal verwijderen, draagt ervoor zorg dat de ouders of de voogd alsmede, indien mogelijk, de
      donor op duidelijke wijze mondeling en schriftelijk en desgewenst met behulp van audio-visuele middelen, worden
      geïnformeerd over de aard en het doel van de verwijdering en de te verwachten gevolgen voor de donor. Tevens
      vergewist hij zich ervan dat voldaan is aan het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel5
  - number: '6'
    text: |-
      De toestemming, bedoeld in dit hoofdstuk, wordt vooraf verleend bij een verklaring die ten minste eigenhandig is
      gedagtekend en ondertekend. Zij kan vóór de verwijdering van het orgaan te allen tijde worden herroepen.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel6
  - number: '7'
    text: |-
      Aan de donor en degenen van wie ingevolge dit hoofdstuk toestemming voor het verwijderen van een orgaan is vereist,
      mogen uitsluitend de kosten, bedoeld in [artikel 2][ref1], worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel2
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '2'
        hoofdstuk: '1'
  - number: '8'
    text: |-
      Het verwijderen van een orgaan bij leven is slechts toegestaan, indien daarvoor toestemming is verleend ingevolge
      [artikel 3][ref1], [4][ref2] of [5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel5
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '5'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      Meerderjarigen en minderjarigen van twaalf jaar of ouder, die in staat zijn tot een redelijke waardering van hun
      belangen ter zake, kunnen toestemming verlenen tot het na hun overlijden verwijderen van hun organen of bepaalde
      door hen aan te wijzen organen, dan wel daartegen bezwaar maken.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel9
  - number: '9.2'
    text: |-
      De toestemming wordt verleend en het bezwaar gemaakt door het invullen en laten registreren van een donorformulier
      als bedoeld in [artikel 10][ref1]. Indien een in het eerste lid bedoelde persoon de beslissing over het verwijderen
      van zijn organen wenst over te laten aan de in [artikel 11][ref2] bedoelde nabestaanden of aan een door hem te
      bepalen persoon, kan hij dat ook op het donorformulier te kennen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '9.3'
    text: |-
      Een wilsverklaring omtrent het verwijderen van organen kan te allen tijde worden herroepen door het opnieuw
      invullen en laten registreren van een donorformulier.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel9
  - number: '9.4'
    text: |-
      Een wilsbeschikking met een in dit artikel bedoelde strekking kan ook worden afgelegd bij een schriftelijke
      verklaring die ten minste eigenhandig is gedagtekend en ondertekend.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel9
  - number: '10.1'
    text: |-
      Onze minister draagt ervoor zorg dat iedere ingezetene als bedoeld in de
      [Wet gemeentelijke basisadministratie persoonsgegevens][ref1], een donorformulier wordt toegezonden, wanneer hij of
      zij de leeftijd van achttien jaren heeft bereikt. Donorformulieren worden voorts op verzoek door de zorg van Onze
      minister en door het gemeentebestuur kosteloos ter beschikking gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006723
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0006723
  - number: '10.2'
    text: |-
      Er is een donorregister waarin, met het oog op de kenbaarheid van de wilsbeschikking van de betrokkene ter zake
      aantekening wordt gehouden van door middel van het donorformulier verleende toestemming tot of gemaakt bezwaar
      tegen het na overlijden verwijderen van organen, dan wel de door middel van dat formulier te kennen gegeven wens de
      beslissing ter zake over te laten aan de in [artikel 11][ref1] bedoelde nabestaanden of aan een door hem te bepalen
      persoon. Het register wordt gehouden door of vanwege Onze minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '10.3'
    text: |-
      Het register kan door of in opdracht van een arts dag en nacht worden geraadpleegd wanneer dat met het oog op de
      voorgenomen verwijdering van een orgaan noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel10
  - number: '10.4'
    text: |-
      De kosten van de uitvoering van het eerste, tweede en derde lid worden betaald uit het Algemeen Fonds Bijzondere
      Ziektekosten, bedoeld in [artikel 38 van de Wet financiering volksverzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel38
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '38'
  - number: '10.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de vorm, inhoud en toezending van het
      donorformulier, het bijhouden en de toegankelijkheid van het donorregister en de bekostiging, bedoeld in het vierde
      lid.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel10
  - number: '10.6'
    text: |-
      De voordracht voor een algemene maatregel van bestuur krachtens het vijfde lid wordt niet gedaan dan nadat het
      ontwerp aan de beide kamers der Staten-Generaal is overgelegd en sedert die overlegging vier weken zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel10
  - number: '11.1'
    text: |-
      Indien van een persoon als bedoeld in [artikel 9][ref1] geen wilsverklaring omtrent het verwijderen van organen
      aanwezig is, kan daarvoor na het intreden van de dood toestemming worden verleend door de bij zijn overlijden
      met hem samenlevende echtgenoot, geregistreerde partner of andere levensgezel, dan wel bij afwezigheid of
      onbereikbaarheid van deze door de onmiddellijk bereikbare meerderjarige bloedverwanten tot en met de tweede graad
      dan wel bij afwezigheid of onbereikbaarheid van dezen door de onmiddellijk bereikbare meerderjarige aanverwanten
      tot en met de tweede graad. Betreft het een minderjarige van twaalf jaar of ouder waarvan geen wilsverklaring
      bekend is, dan kan de toestemming worden verleend door de ouders die de ouderlijke macht uitoefenen, of de voogd.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11.2'
    text: |-
      Ten aanzien van een minderjarige beneden de twaalf jaar kan de in het eerste lid bedoelde toestemming worden
      verleend door de ouders die de ouderlijke macht uitoefenen, of de voogd.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel11
  - number: '11.3'
    text: |-
      Bij verschil van mening tussen de bloedverwanten, de aanverwanten, onderscheidenlijk de ouders, bedoeld in het
      eerste en tweede lid, kan de toestemming niet worden verleend.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel11
  - number: '11.4'
    text: |-
      Indien gebruik is gemaakt van de in de [tweede volzin van artikel 9, tweede lid][ref1], bedoelde mogelijkheid,
      is dit artikel van overeenkomstige toepassing, met dien verstande dat indien de beslissing is overgelaten aan een
      bepaalde persoon, die persoon toestemming kan verlenen. Bij afwezigheid of onbereikbaarheid van laatstgenoemde
      persoon kan de toestemming worden verleend met overeenkomstige toepassing van het eerste en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '12'
    text: |-
      Overlijdt een persoon voor het bereiken van de zestienjarige leeftijd en heeft hij ingevolge [artikel 9][ref1]
      toestemming gegeven voor het verwijderen van zijn organen, dan vindt geen verwijdering plaats indien daartegen
      bezwaar wordt gemaakt door een ouder die de ouderlijke macht uitoefent of de voogd. Bij afwezigheid of
      onbereikbaarheid van beide ouders of van de voogd kan de verwijdering plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13'
    text: |-
      Tenzij degene die toestemming verleent uitdrukkelijk anders bepaalt, wordt toestemming als bedoeld in deze
      paragraaf verleend ten behoeve van implantatie, daaronder begrepen op implantatie gericht wetenschappelijk
      onderzoek, indien het orgaan na de verwijdering voor implantatie ongeschikt blijkt te zijn. Bij algemene maatregel
      van bestuur kan worden bepaald dat het verlenen van toestemming niet is toegestaan voor bij die maatregel aan te
      wijzen, uit een oogpunt van geneeskundige behandeling niet van belang zijnde, doeleinden.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel13
  - number: '14.1'
    text: |-
      Voordat een orgaan wordt verwijderd, wordt de dood vastgesteld door een arts die niet bij de verwijdering of
      implantatie van het orgaan betrokken mag zijn. Indien het voornemen bestaat tot het verwijderen van een orgaan
      uit een beademd stoffelijk overschot, wordt de dood vastgesteld aan de hand van de volgens de laatste stand van de
      wetenschap geldende methoden en criteria voor het vaststellen van de hersendood door een ter zake kundige arts. De
      wijze waarop de hersendood is vastgesteld, wordt vastgelegd in een verklaring waarvan het model is opgenomen in het
      in [artikel 15, eerste lid][ref1], bedoelde protocol.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel15
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Onder hersendood wordt verstaan het volledig en onherstelbaar verlies van de functies van de hersenen, inclusief
      de hersenstam en het verlengde merg. Vaststelling van de hersendood vindt slechts plaats in geval van een dodelijk
      hersenletsel waarvan de oorzaak bekend is en dat niet behandelbaar is. Zij geschiedt eerst nadat aannemelijk is
      geworden dat andere oorzaken van bewusteloosheid en reactieloosheid niet aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel14
  - number: '15.1'
    text: |-
      De Gezondheidsraad stelt met inachtneming van [artikel 14, tweede lid][ref1], vast welke de volgens de laatste
      stand van de wetenschap geldende methoden en criteria voor het met zekerheid vaststellen van de hersendood zijn. Op
      basis daarvan stelt de Gezondheidsraad een protocol op met betrekking tot de bij het vaststellen van de hersendood
      in ziekenhuizen te volgen procedures en uit te voeren onderzoeken in gevallen dat het voornemen bestaat tot
      verwijdering van een orgaan. Het protocol wordt vastgesteld bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel14
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15.2'
    text: 'Het protocol bedoeld in het eerste lid, wordt aangeduid als: Hersendoodprotocol.'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel15
  - number: '15.3'
    text: |-
      Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan beide kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel15
  - number: '16'
    text: |-
      Bij verwijdering van een orgaan uit een stoffelijk overschot geschiedt de lijkschouwing als bedoeld in
      [artikel 3 van de Wet op de lijkbezorging][ref1] (*Stb*. 1991, 133) niet door een arts die bij de verwijdering of
      de implantatie van het orgaan betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel3
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '3'
  - number: '17'
    text: |-
      Bij de aanwezigheid of het vermoeden van een niet natuurlijke dood mag een orgaan niet worden verwijderd, voordat
      is gebleken dat de officier van justitie de in [artikel 76, tweede lid, van de Wet op de lijkbezorging][ref1]
      bedoelde toestemming verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel76
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '76'
  - number: '18.1'
    text: |-
      De arts die de dood vaststelt, draagt er zorg voor dat van het vermoedelijk beschikbaar komen van organen voor
      implantatie onmiddellijk melding wordt gedaan bij een orgaancentrum.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel18
  - number: '18.2'
    text: |-
      Het orgaancentrum wijst aan wie voor implantatie van een bij het centrum aangemeld orgaan in aanmerking komt.
      Indien geen onmiddellijke aanwijzing kan plaatsvinden en het orgaancentrum zulks op medische gronden noodzakelijk
      acht, kan het bepalen dat een daarvoor naar zijn aard geschikt orgaan voor implantatie beschikbaar dient te
      blijven.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel18
  - number: '18.3'
    text: |-
      Bij de aanwijzing wordt met geen andere factoren rekening gehouden dan met de bloed- en weefselovereenkomst
      van donor en ontvanger van het orgaan, de medische urgentie van de ontvanger en andere, met de toestand van het
      orgaan samenhangende, omstandigheden dan wel, indien deze factoren geen uitsluitsel geven, met de wachttijd van de
      ontvanger. Bij algemene maatregel van bestuur kunnen daaromtrent nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel18
  - number: '19'
    text: |-
      Indien geen aanwijzing ingevolge [artikel 18, tweede lid][ref1], kan plaatsvinden, draagt degene die het orgaan
      verwijdert, ervoor zorg dat een daarvoor naar zijn aard geschikt orgaan wordt aangeboden aan een orgaanbank of
      een daarmee door Onze minister onder door hem te bepalen voorwaarden gelijkgestelde in het buitenland gevestigde
      instelling. In voorkomende gevallen wordt daarbij melding gemaakt van andere doeleinden waarvoor tevens toestemming
      tot verwijdering van het orgaan is verleend, dan implantatie alsmede van de toepassing door het centrum van de
      tweede volzin van [artikel 18, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel18
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '20.1'
    text: |-
      Degene die de dood vaststelt draagt er zorg voor dat wordt nagegaan of een wilsverklaring als bedoeld in
      [artikel 9][ref1] of [artikel 10][ref2] aanwezig is. Indien een uit het register blijkende wilsverklaring niet
      overeenkomt met een andere aanwezige verklaring als bedoeld in [artikel 9][ref3] is de laatst afgelegde verklaring
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '20.2'
    text: |-
      Indien geen wilsverklaring als bedoeld in [artikel 9][ref1] of [10][ref2] aanwezig is of gebruik is gemaakt van de
      in de [tweede volzin van artikel 9, tweede lid][ref3], bedoelde mogelijkheid, draagt de in het eerste lid bedoelde
      arts overeenkomstig het protocol zorg voor raadpleging van de persoon of personen, bedoeld in [artikel 11][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0008066
        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21'
    text: 'Het verwijderen van een orgaan na overlijden is slechts toegestaan, indien:'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel21
  - number: 21.a
    text: |-
      met toepassing van [artikel 20][ref1] is vastgesteld dat daarvoor door of ten aanzien van de overledene toestemming
      is verleend overeenkomstig deze wet;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 21.b
    text: |-
      voldaan is aan [de artikelen 14][ref1], [16][ref2] en [17][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel17
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '16'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 21.c
    text: |-
      het voor implantatie ter beschikking gestelde orgaan overeenkomstig [artikel 18][ref1] is aangemeld bij een
      orgaancentrum.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '22.1'
    text: |-
      Indien is vastgesteld dat door een persoon toestemming is verleend voor het na zijn overlijden verwijderen van een
      orgaan, kan ter voorbereiding daarvan onderzoek worden gedaan en kunnen met hetzelfde oogmerk maatregelen worden
      getroffen, voor zover dat niet strijdig is met de geneeskundige behandeling van die persoon en uitstel daarvan tot
      na het overlijden in verband met de implantatie niet mogelijk is.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel22
  - number: '22.2'
    text: |-
      Indien van een persoon geen wilsverklaring als bedoeld in [artikel 9][ref1] of [artikel 10][ref2] aanwezig is of
      gebruik is gemaakt van de in de [tweede volzin van artikel 9, tweede lid][ref3], bedoelde mogelijkheid, kunnen
      na het intreden van de dood die maatregelen worden getroffen die noodzakelijk zijn om het orgaan voor implantatie
      geschikt te houden zolang de procedure ter verkrijging van de voor het verwijderen ingevolge deze wet noodzakelijke
      toestemmingen nog niet is beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '10'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '23.1'
    text: |-
      Het bestuur van een ziekenhuis draagt zorg voor vaststelling van een protocol met betrekking tot ter beschikking
      stelling van organen ten behoeve van implantatie en ziet toe op de naleving daarvan.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
  - number: '23.2'
    text: 'In het protocol worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
  - number: 23.2.a
    text: de wijze waarop wordt nagegaan of een overledene in aanmerking komt als donor;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
  - number: 23.2.b
    text: |-
      de wijze waarop overeenkomstig [artikel 20][ref1] het donorregister en de nabestaanden dan wel een bepaalde persoon
      als bedoeld in [artikel 9, tweede lid, tweede volzin][ref2], worden geraadpleegd;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '20'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 23.2.c
    text: de procedure die wordt gevolgd bij de melding van een orgaan bij een orgaancentrum;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
  - number: 23.2.d
    text: |-
      de verslaglegging over de toepassing van [de onderdelen ][ref1], [][ref2] en [][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel23
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: 23.2.e
    text: de voorlichting in het ziekenhuis over de in het protocol gestelde regels.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
  - number: '23.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud van het in het eerste lid
      bedoelde protocol.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
  - number: '23.4'
    text: |-
      Indien in een ziekenhuis de mogelijkheid bestaat tot het vaststellen van de hersendood, bevat het protocol tevens
      de daarvoor geldende methoden en criteria en de daarbij te volgen procedures en onderzoeken zoals vastgesteld op
      grond van [artikel 15, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel15
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '24'
    text: |-
      Het bemiddelen bij het verkrijgen, bij het typeren en bij het vervoeren van organen van donoren, alsmede het
      toewijzen van die organen aan een daarvoor geschikte ontvanger mag slechts geschieden door een orgaancentrum, dat
      daartoe een vergunning van Onze minister behoeft.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel24
  - number: '25.1'
    text: |-
      Een vergunning kan uitsluitend worden verleend aan een rechtspersoon wiens werkzaamheid niet is gericht op het
      behalen van winst en die geen werkzaamheden als bedoeld in [artikel 28][ref1] uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel28
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '25.2'
    text: |-
      Een vergunning wordt geweigerd, indien niet wordt of naar redelijke verwachting niet zal worden voldaan aan het
      bepaalde bij of krachtens deze wet, een doelmatige voorziening in de behoefte aan organen niet is gebaat bij
      verlening van de vergunning, dan wel een doelmatige samenwerking met andere orgaancentra en met orgaanbanken niet
      is verzekerd.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel25
  - number: '26.1'
    text: |-
      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: 26.1.a
    text: de deskundigheid van het personeel;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: 26.1.b
    text: de samenstelling van het bestuur;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: 26.1.c
    text: de inschrijving van mogelijke ontvangers van organen;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: 26.1.d
    text: |-
      de openbaarmaking van de normen voor inschrijving van mogelijke ontvangers en voor toewijzing van organen aan een
      ontvanger;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: 26.1.e
    text: de bescherming van de persoonlijke levenssfeer van donoren en ontvangers van organen;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: 26.1.f
    text: de uitrusting en bereikbaarheid van het orgaancentrum;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: 26.1.g
    text: de verslaglegging over de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: '26.2'
    text: |-
      Een beperking of voorschrift kan worden gewijzigd of ingetrokken. Ook na het verlenen van de vergunning kunnen
      daaraan beperkingen worden gesteld of voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel26
  - number: '27'
    text: |-
      Een vergunning kan worden ingetrokken indien niet meer wordt voldaan aan het bepaalde bij of krachtens deze wet of
      de aan de vergunning verbonden voorschriften dan wel indien in strijd is gehandeld met een beperking waaronder de
      vergunning is verleend.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel27
  - number: '28'
    text: |-
      Het bewaren, het voor implantatie bewerken en het ter beschikking stellen van de in [artikel 19][ref1] bedoelde
      organen mag slechts geschieden door een orgaanbank, die daartoe een vergunning van Onze minister behoeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel19
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '29.1'
    text: |-
      Een vergunning kan uitsluitend worden verleend aan een rechtspersoon wiens werkzaamheid niet is gericht op het
      behalen van winst en die geen werkzaamheden als bedoeld in [artikel 24][ref1] uitoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '29.2'
    text: |-
      Een vergunning wordt geweigerd, indien niet wordt of naar redelijke verwachting zal worden voldaan aan het bij of
      krachtens deze wet bepaalde, een doelmatige voorziening in de behoefte aan organen niet is gebaat bij verlening van
      de vergunning, dan wel een doelmatige samenwerking met andere orgaanbanken en met orgaancentra niet is verzekerd.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel29
  - number: '29.3'
    text: |-
      Een vergunning wordt voorts geweigerd indien niet wordt of naar redelijke verwachting zal worden voldaan aan bij
      algemene maatregel van bestuur te stellen kwaliteitseisen met betrekking tot de toestand van het orgaan en de wijze
      van bewaren en bewerken daarvan.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel29
  - number: '30.1'
    text: |-
      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
  - number: 30.1.a
    text: de deskundigheid van het personeel;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
  - number: 30.1.b
    text: de samenstelling van het bestuur;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
  - number: 30.1.c
    text: de ruimte waarin de organen worden bewaard en de inrichting van die ruimte;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
  - number: 30.1.d
    text: de bescherming van de persoonlijke levenssfeer van donoren en ontvangers van organen;
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
  - number: 30.1.e
    text: de verslaglegging over de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
  - number: '30.2'
    text: |-
      Een beperking of voorschrift kan worden gewijzigd of ingetrokken. Ook na het verlenen van de vergunning kunnen
      daaraan beperkingen worden gesteld of voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
  - number: '30.3'
    text: |-
      [Artikel 27][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel27
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '27'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '31'
    text: |-
      Indien een orgaancentrum toepassing heeft gegeven aan de tweede volzin van [artikel 18, tweede lid][ref1], wordt
      het desbetreffende orgaan door een orgaanbank ten behoeve van het orgaancentrum beschikbaar gehouden totdat het
      centrum met toepassing van [artikel 18, derde lid][ref2], heeft aangewezen wie voor implantatie van dat orgaan in
      aanmerking komt.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel18
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 31a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel31a
  - number: '32.1'
    text: |-
      Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk in strijd handelt met het bepaalde in [de artikelen 8][ref1] en [21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel21
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '21'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '32.2'
    text: 'Met dezelfde straf wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
  - number: 32.2.a
    text: |-
      degene die opzettelijk teweegbrengt of bevordert dat een ander aan een derde toestemming verleent voor het bij
      leven verwijderen van een orgaan waarvoor een vergoeding wordt betaald die meer bedraagt dan de kosten, bedoeld in
      [artikel 2][ref1], dan wel dat een ander in strijd handelt met [artikel 7][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel7
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '2'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '7'
        hoofdstuk: '2'
  - number: 32.2.b
    text: |-
      degene die openlijk hetzij voor het ontvangen van een orgaan een vergoeding aanbiedt die meer bedraagt dan de
      kosten, bedoeld in [artikel 2][ref1], hetzij zich tegen een dergelijke vergoeding als donor aanbiedt hetzij
      diensten aanbiedt bestaande uit gedragingen, strafbaar gesteld in onderdeel *a*;


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel2
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '2'
        hoofdstuk: '1'
  - number: 32.2.d
    text: |-
      degene die opzettelijk teweegbrengt of bevordert dat bestanddelen van een persoon of van een stoffelijk overschot,
      bij wie onderscheidenlijk waarbij de hersenen geheel of nagenoeg geheel ontbreken, worden gebruikt met het
      oogmerk om in of aan het lichaam van een ander ten behoeve van diens geneeskundige behandeling te worden in- of
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
  - number: '32.3'
    text: |-
      Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vijfde categorie wordt gestraft degene die
      handelt in strijd met het bepaalde in [de artikelen 22][ref1], [24][ref2] en [28][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel28
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008066
        artikel: '24'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '28'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '32.4'
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die handelt in
      strijd met het bepaalde in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel19
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '32.5'
    text: |-
      De in het eerste tot en met derde lid strafbaar gestelde feiten zijn misdrijven. De in het vierde lid strafbaar
      gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel32
  - number: '34'
    text: |-
      Onze minister draagt ervoor zorg dat binnen twee jaar na de inwerkingtreding van deze wet aan iedere
      ingezetene als bedoeld in de [Wet gemeentelijke basisadministratie persoonsgegevens][ref1] die op het
      tijdstip van inwerkingtreding reeds de leeftijd van achttien jaar heeft bereikt, een donorformulier wordt
      toegezonden. De kosten daarvan worden betaald uit het Algemeen Fonds Bijzondere Ziektekosten, bedoeld in
      [artikel 38 van de Wet financiering volksverzekeringen][ref2]. Bij ministeriële regeling kunnen nadere regels
      worden gesteld omtrent de uitvoering van [dit artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006723
      [ref2]: https://wetten.overheid.nl/BWBR0004538#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0008066#Artikel34
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0006723
      - id: ref2
        bwb_id: BWBR0004538
        artikel: '38'
      - id: ref3
        bwb_id: BWBR0008066
        artikel: '34'
        hoofdstuk: '5'
  - number: '35.1'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel35
  - number: '35.2'
    text: |-
      Onze minister zendt binnen drie jaar en vervolgens na vijf jaar en na zeven jaar na de inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel35
  - number: '36'
    text: 'Deze wet kan worden aangehaald als: Wet op de orgaandonatie.'
    url: https://wetten.overheid.nl/BWBR0008066/2002-09-01#Artikel36
