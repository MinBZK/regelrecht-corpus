  - number: '10'
    text: |-
      1 Onze minister draagt ervoor zorg dat iedere ingezetene als bedoeld in de [Wet basisregistratie personen][ref1],
      een donorformulier wordt toegezonden, wanneer hij of zij de leeftijd van achttien jaren heeft bereikt.
      Donorformulieren worden voorts op verzoek door de zorg van Onze minister en door het college van burgemeester en
      wethouders kosteloos ter beschikking gesteld.

      2 Er is een donorregister waarin, met het oog op de kenbaarheid van de wilsbeschikking van de betrokkene ter zake
      aantekening wordt gehouden van door middel van het donorformulier verleende toestemming tot of gemaakt bezwaar
      tegen het na overlijden verwijderen van organen, dan wel de door middel van dat formulier te kennen gegeven wens de
      beslissing ter zake over te laten aan de in [artikel 11][ref2] bedoelde nabestaanden of aan een door hem te bepalen
      persoon. Het register wordt gehouden door of vanwege Onze minister.

      3 Het register kan door of in opdracht van een arts dag en nacht worden geraadpleegd wanneer dat met het oog op de
      voorgenomen verwijdering van een orgaan noodzakelijk is.

      4 Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de vorm, inhoud en toezending van het
      donorformulier en het bijhouden en de toegankelijkheid van het donorregister. Bij die algemene maatregel kan
      worden bepaald dat een donorformulier wordt toegezonden aan personen die na het bereiken van de leeftijd van
      negentien jaar nieuw als ingezetene zijn ingeschreven dan wel opnieuw als ingezetene zijn geregistreerd in de
      basisregistratie personen, of dat aan daarbij aan te wijzen categorieën van personen aan wie een donorformulier
      is toegezonden en van wie na een bij die maatregel te bepalen termijn nog geen wilsverklaring in het register is
      opgenomen, opnieuw een donorformulier wordt toegezonden.

      5 De voordracht voor een algemene maatregel van bestuur krachtens het vierde lid wordt niet gedaan dan nadat het
      ontwerp aan de beide kamers der Staten-Generaal is overgelegd en sedert die overlegging vier weken zijn verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel10
