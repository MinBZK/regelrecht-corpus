  - number: '9'
    text: |-
      1 Meerderjarigen en minderjarigen van twaalf jaar of ouder, die in staat zijn tot een redelijke waardering van hun
      belangen ter zake, kunnen toestemming verlenen tot het na hun overlijden verwijderen van hun organen of bepaalde
      door hen aan te wijzen organen, dan wel daartegen bezwaar maken.

      2 De toestemming wordt verleend en het bezwaar gemaakt door het invullen en laten registreren van een
      donorformulier als bedoeld in [artikel 10][ref1]. Indien een in het eerste lid bedoelde persoon de beslissing over
      het verwijderen van zijn organen wenst over te laten aan de in [artikel 11][ref2] bedoelde nabestaanden of aan een
      door hem te bepalen persoon, kan hij dat ook op het donorformulier te kennen geven.

      3 Een wilsverklaring omtrent het verwijderen van organen kan te allen tijde worden herroepen door het opnieuw
      invullen en laten registreren van een donorformulier.

      4 Een wilsbeschikking met een in dit artikel bedoelde strekking kan ook worden afgelegd bij een schriftelijke
      verklaring die ten minste eigenhandig is gedagtekend en ondertekend.

      5 Een in algemene bewoordingen gestelde herroeping van een uiterste wilsbeschikking houdt niet in een herroeping
      van een wilsbeschikking als bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel11
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel9
