preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede in verband met artikel 11 van de Grondwet, wenselijk is met
    het oog op de rechtszekerheid van de betrokkenen, ter bevordering van het aanbod en de rechtvaardige verdeling van
    geschikte organen en ter voorkoming van handel in organen bij wet regelen te stellen omtrent het ter beschikking
    stellen van organen ten behoeve van in het bijzonder de geneeskundige behandeling van anderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. orgaan: bestanddeel van het menselijk lichaam, met uitzondering van bloed en geslachtscellen;

      c. donor: een persoon of stoffelijk overschot, door of ten aanzien van wie op grond van deze wet toestemming is
      verleend voor het bij hem of daaruit verwijderen van een orgaan;

      d. verwijderen: het verwijderen van een orgaan, anders dan ten behoeve van de donor zelf;

      e. implantatie: het in- of aanbrengen van een orgaan van een donor in of aan het lichaam van een ander met het oog
      op diens geneeskundige behandeling;

      f. ziekenhuis: een krachtens [artikel 5 van de Wet toelating zorginstellingen][ref1] als ziekenhuis of
      verpleeginrichting toegelaten instelling of een afdeling daarvan;

      g. orgaancentrum: een instelling als bedoeld in [artikel 24][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel24
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel1
    references:
