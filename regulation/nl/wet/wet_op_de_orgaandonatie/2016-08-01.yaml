  - number: '21'
    text: |-
      Het verwijderen van een orgaan na overlijden is slechts toegestaan, indien:

      a. met toepassing van het bepaalde bij of krachtens [artikel 20][ref1] is vastgesteld dat daarvoor door of ten
      aanzien van de overledene toestemming is verleend overeenkomstig deze wet;

      b. voldaan is aan [de artikelen 14][ref2], [16][ref3] en [17][ref4];

      c. het voor implantatie ter beschikking gestelde orgaan overeenkomstig [artikel 18][ref5] is aangemeld bij een
      orgaancentrum.


