        artikel: '11'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '11'
    text: |-
      1 Indien van een persoon als bedoeld in [artikel 9][ref1] geen wilsverklaring omtrent het verwijderen van organen
      aanwezig is, kan daarvoor na het vaststellen van de dood toestemming worden verleend door de bij zijn overlijden
      met hem samenlevende echtgenoot, geregistreerde partner of andere levensgezel, dan wel bij afwezigheid of
      onbereikbaarheid van deze door de onmiddellijk bereikbare meerderjarige bloedverwanten tot en met de tweede graad
      dan wel bij afwezigheid of onbereikbaarheid van dezen door de onmiddellijk bereikbare meerderjarige aanverwanten
      tot en met de tweede graad. Betreft het een minderjarige van twaalf jaar of ouder waarvan geen wilsverklaring
      bekend is, dan kan de toestemming worden verleend door de ouders die de ouderlijke macht uitoefenen, of de voogd.

      2 Indien van een persoon die in de periode voorafgaand aan zijn overlijden niet in staat was tot een redelijke
      waardering van zijn belangen terzake van orgaandonatie, terwijl deze gedurende een periode van zijn leven vanaf de
      leeftijd van twaalf jaar daartoe wel in staat is geweest, geen wilsverklaring omtrent het verwijderen van organen
      aanwezig is, kan daarvoor na het vaststellen van de dood toestemming worden verleend door de in het eerste lid
      bedoelde personen.

      3 Ten aanzien van een minderjarige beneden de twaalf jaar kan de in het eerste lid bedoelde toestemming worden
      verleend door de ouders die de ouderlijke macht uitoefenen, of de voogd.

      4 Bij verschil van mening tussen de bloedverwanten, de aanverwanten, onderscheidenlijk de ouders, bedoeld in het
      eerste en tweede lid, kan de toestemming niet worden verleend.

      5 Indien gebruik is gemaakt van de in de [tweede volzin van artikel 9, tweede lid][ref2], bedoelde mogelijkheid,
      is dit artikel van overeenkomstige toepassing, met dien verstande dat indien de beslissing is overgelaten aan een
      bepaalde persoon, die persoon toestemming kan verlenen. Bij afwezigheid of onbereikbaarheid van laatstgenoemde
      persoon kan de toestemming worden verleend met overeenkomstige toepassing van het eerste en derde lid.

      6 Indien een persoon toestemming heeft verleend voor het na zijn overlijden verwijderen van organen, kan voor
      het verwijderen van een orgaan dat niet is opgenomen in de tekst van een op het tijdstip van toestemming geldend
      donorformulier en tegen verwijdering waarvan hij niet anderszins reeds zelf bezwaar heeft gemaakt, toestemming
      worden verleend met overeenkomstige toepassing van het eerste, derde en vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel11
