  - number: '22'
    text: |-
      1 Indien een persoon toestemming heeft verleend voor het na zijn overlijden verwijderen van een orgaan, mogen
      wanneer redelijkerwijs vaststaat dat betrokkene binnen afzienbare tijd zal overlijden in verband met de implantatie
      reeds voor het vaststellen van de dood voorbereidingen worden getroffen voor zover deze niet strijdig zijn met
      de geneeskundige behandeling van die persoon en uitstel tot na het vaststellen van de dood niet mogelijk is. Die
      voorbereidingen kunnen bestaan uit:

        - onderzoek noodzakelijk voor de voorbereiding van de implantatie;
        - het in werking stellen of in stand houden van de kunstmatige beademing;
        - het kunstmatig in stand houden van de bloedsomloop, en
        - andere maatregelen noodzakelijk om organen geschikt te houden voor implantatie.

      2 Indien van een persoon geen wilsverklaring als bedoeld in [artikel 9][ref1] of [10][ref2] aanwezig is of gebruik
      is gemaakt van de in de tweede volzin van artikel 9, tweede lid, bedoelde mogelijkheid, mogen reeds voor het
      vaststellen van de dood, de in het eerste lid genoemde voorbereidingen worden getroffen voor zover:

      a. het redelijkerwijs vaststaat dat betrokkene binnen afzienbare tijd zal overlijden;

      b. de voorbereidingen niet strijdig zijn met de geneeskundige behandeling van betrokkene;

      c. uitstel van de voorbereidingen tot na het vaststellen van de dood niet mogelijk is; en

      d. de procedure ter verstrekking van informatie, bedoeld in [artikel 20, tweede lid][ref3], nog niet heeft
      geleid tot bezwaar van de persoon of personen die op grond van [artikel 11][ref4] bevoegd zijn tot het geven van
      toestemming voor het verwijderen van organen tegen het treffen van de voorbereidingen.

      3 Indien van een persoon geen wilsverklaring als bedoeld in [artikel 9][ref5] of [artikel 10][ref6] aanwezig is
      of gebruik is gemaakt van de in de tweede volzin van [artikel 9, tweede lid][ref7], bedoelde mogelijkheid en de
      betrokkene niet wordt beademd, kan vanaf vijf minuten na de onomkeerbare hartstilstand, zolang de procedure ter
      verkrijging van de voor het verwijderen van organen ingevolge deze wet noodzakelijke toestemmingen nog niet heeft
      geleid tot weigering daarvan, onderzoek worden verricht dat noodzakelijk is voor de voorbereiding van implantatie
      en kunnen maatregelen worden getroffen om organen geschikt te houden voor implantatie.

      4 Indien van een persoon geen wilsverklaring als bedoeld in [artikel 9][ref8] of [artikel 10][ref9] aanwezig is
      of gebruik is gemaakt van de in de [tweede volzin van artikel 9, tweede lid][ref10], bedoelde mogelijkheid en de
      betrokkene wordt beademd, kunnen na het het vaststellen van de dood, zolang de procedure ter verkrijging van de
      voor het verwijderen van organen ingevolge deze wet noodzakelijke toestemmingen nog niet heeft geleid tot weigering
      daarvan, de volgende maatregelen worden getroffen:

        - onderzoek noodzakelijk voor de voorbereiding van implantatie;
        - het in stand houden van de kunstmatige beademing;
        - het kunstmatig in stand houden van de bloedsomloop, en
        - andere maatregelen noodzakelijk om organen geschikt te houden voor implantatie.


