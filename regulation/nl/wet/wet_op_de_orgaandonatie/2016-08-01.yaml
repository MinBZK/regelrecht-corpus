  - number: '12'
    text: |-
      Overlijdt een persoon voor het bereiken van de zestienjarige leeftijd en heeft hij ingevolge [artikel 9][ref1]
      toestemming gegeven voor het verwijderen van zijn organen, dan vindt geen verwijdering plaats indien daartegen
      bezwaar wordt gemaakt door een ouder die de ouderlijke macht uitoefent of de voogd. Bij afwezigheid of
      onbereikbaarheid van beide ouders of van de voogd kan de verwijdering plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel9
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '9'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '13'
    text: |-
      Tenzij degene die toestemming verleent uitdrukkelijk anders bepaalt, wordt toestemming als bedoeld in deze
      paragraaf verleend ten behoeve van implantatie, daaronder begrepen op implantatie gericht wetenschappelijk
      onderzoek, indien het orgaan na de verwijdering voor implantatie ongeschikt blijkt te zijn. Bij algemene maatregel
      van bestuur kan worden bepaald dat het verlenen van toestemming niet is toegestaan voor bij die maatregel aan te
      wijzen, uit een oogpunt van geneeskundige behandeling niet van belang zijnde, doeleinden.
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel13
  - number: '14'
    text: |-
      1 Voordat een orgaan wordt verwijderd, wordt de dood vastgesteld door een arts die niet bij de verwijdering of
      implantatie van het orgaan betrokken mag zijn. Indien het voornemen bestaat tot het verwijderen van een orgaan
      uit een beademd stoffelijk overschot, wordt de dood vastgesteld aan de hand van de volgens de laatste stand van de
      wetenschap geldende methoden en criteria voor het vaststellen van de hersendood door een ter zake kundige arts. De
      wijze waarop de hersendood is vastgesteld, wordt vastgelegd in een verklaring waarvan het model is opgenomen in het
      in [artikel 15, eerste lid][ref1], bedoelde protocol.

      2 Onder hersendood wordt verstaan het volledig en onherstelbaar verlies van de functies van de hersenen, inclusief
      de hersenstam en het verlengde merg. Vaststelling van de hersendood vindt slechts plaats in geval van een dodelijk
      hersenletsel waarvan de oorzaak bekend is en dat niet behandelbaar is. Zij geschiedt eerst nadat aannemelijk is
      geworden dat andere oorzaken van bewusteloosheid en reactieloosheid niet aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel15
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '15'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '15'
    text: |-
      1 De Gezondheidsraad stelt met inachtneming van [artikel 14, tweede lid][ref1], vast welke de volgens de laatste
      stand van de wetenschap geldende methoden en criteria voor het met zekerheid vaststellen van de hersendood zijn. Op
      basis daarvan stelt de Gezondheidsraad een protocol op met betrekking tot de bij het vaststellen van de hersendood
      in ziekenhuizen te volgen procedures en uit te voeren onderzoeken in gevallen dat het voornemen bestaat tot
      verwijdering van een orgaan. Het protocol wordt vastgesteld bij algemene maatregel van bestuur.

      2 Het protocol bedoeld in het eerste lid, wordt aangeduid als: Hersendoodprotocol.

      3 Een krachtens het eerste lid vastgestelde algemene maatregel van bestuur treedt niet eerder in werking dan acht
      weken na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld
      mededeling gedaan aan beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel14
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '14'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '16'
    text: |-
      Bij verwijdering van een orgaan uit een stoffelijk overschot geschiedt de lijkschouwing als bedoeld in
      [artikel 3 van de Wet op de lijkbezorging][ref1] (*Stb*. 1991, 133) niet door een arts die bij de verwijdering of
      de implantatie van het orgaan betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel3
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '3'
  - number: '17'
    text: |-
      Bij de aanwezigheid of het vermoeden van een niet natuurlijke dood mag een orgaan niet worden verwijderd, voordat
      is gebleken dat de officier van justitie de in [artikel 76, tweede lid, van de Wet op de lijkbezorging][ref1]
      bedoelde toestemming verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0005009#Artikel76
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005009
        artikel: '76'
  - number: '18'
    text: |-
      1 De daartoe in het protocol, bedoeld in [artikel 23][ref1], aangewezen functionaris doet van het vermoedelijk
      beschikbaar komen van organen voor implantatie onmiddellijk melding bij een orgaancentrum.

      2 Het orgaancentrum wijst aan wie voor implantatie van een bij het centrum aangemeld orgaan in aanmerking komt.
      Indien geen onmiddellijke aanwijzing kan plaatsvinden en het orgaancentrum zulks op medische gronden noodzakelijk
      acht, kan het bepalen dat een daarvoor naar zijn aard geschikt orgaan voor implantatie beschikbaar dient te
      blijven.

      3 Bij de aanwijzing wordt met geen andere factoren rekening gehouden dan met de bloed- en weefselovereenkomst
      van donor en ontvanger van het orgaan, de medische urgentie van de ontvanger en andere, met de toestand van het
      orgaan samenhangende, omstandigheden dan wel, indien deze factoren geen uitsluitsel geven, met de wachttijd van de
      ontvanger. Bij algemene maatregel van bestuur kunnen daaromtrent nadere regels worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel23
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008066
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '5'
  - number: '20'
    text: |-
      1 Wanneer een gerede kans bestaat dat een persoon binnen afzienbare tijd zal overlijden, maar in ieder geval zo
      spoedig mogelijk na het vaststellen van de dood, gaat de daartoe in het protocol, bedoeld in [artikel 23][ref1],
      aangewezen functionaris na of een wilsverklaring als bedoeld in [artikel 9][ref2] of [artikel 10][ref3] aanwezig
      is, tenzij reeds vaststaat dat de betrokkene medisch gezien niet in aanmerking komt als donor. Indien een
      uit het register blijkende wilsverklaring niet overeenkomt met een andere aanwezige verklaring als bedoeld in
      [artikel 9][ref4] geldt de laatst afgelegde verklaring.

      2 Indien een persoon niet door middel van een wilsverklaring als bedoeld in [artikel 9][ref5] of [10][ref6]
      toestemming heeft verleend tot of bezwaar heeft gemaakt tegen het na zijn overlijden verwijderen van organen,
      en redelijkerwijs vaststaat dat die persoon binnen afzienbare tijd zal overlijden, verstrekt de daartoe in
      het protocol, bedoeld in [artikel 23][ref7], aangewezen functionaris de persoon of personen die op grond van
      [artikel 11][ref8] bevoegd zijn tot het verlenen van toestemming voor het verwijderen van organen, voor zover zij
      aanwezig of bereikbaar zijn, passende informatie over de mogelijkheid van orgaandonatie.

      3 Indien geen wilsverklaring als bedoeld in [artikel 9][ref9] of [10][ref10] aanwezig is of gebruik is gemaakt
      van de in de tweede volzin van [artikel 9, tweede lid][ref11], bedoelde mogelijkheid, vraagt de daartoe in het
      protocol, bedoeld in [artikel 23][ref12], aangewezen functionaris na het vaststellen van de dood de persoon of
      personen die op grond van [artikel 11][ref13] bevoegd zijn tot het verlenen van toestemming voor het verwijderen
      van organen om toestemming voor het verwijderen van organen, tenzij reeds is gebleken van bezwaar daartegen van
      deze persoon of personen.

      4 Indien de betrokkene zelf toestemming heeft gegeven voor het verwijderen van organen, stelt de daartoe in het
      protocol, bedoeld in [artikel 23][ref14], aangewezen functionaris de daarvoor in aanmerking komende, onmiddellijk
      bereikbare naasten op de hoogte van de wijze waarop aan de toestemming gevolg wordt gegeven.

      5 De toepassing van dit artikel geschiedt met inachtneming van de regels gesteld in het in [artikel 23][ref15]
      bedoelde protocol. Van de toepassing doet de daartoe in het protocol, bedoeld in [artikel 23][ref16], aangewezen
      functionaris verslag door invulling van een bij of krachtens algemene maatregel van bestuur vastgesteld formulier.
      Bij die algemene maatregel kunnen tevens regels worden gesteld omtrent de verstrekking van gegevens betreffende de
      toepassing van dit artikel aan het orgaancentrum.

      6 Aan de in dit artikel bedoelde functionarissen wordt voor zover dat voor de uitvoering van de werkzaamheden
      betreffende de toepassing van dit artikel noodzakelijk is, inzage gegeven in het dossier van de patiënt.

      7 Bij algemene maatregel van bestuur kan worden bepaald dat in dit artikel gestelde regels niet van toepassing
      zijn op bij die maatregel aan te wijzen categorieën van artsen. Daarbij kan worden bepaald dat de taken die in dit
      artikel zijn opgedragen aan een functionaris als bedoeld in het eerste lid, door een ander worden uitgevoerd.


