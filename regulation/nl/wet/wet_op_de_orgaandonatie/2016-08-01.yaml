  - number: '25'
    text: |-
      1 Een vergunning kan uitsluitend worden verleend aan een rechtspersoon wiens werkzaamheid
      niet is gericht op het behalen van winst en die geen weefselinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet veiligheid en kwaliteit lichaamsmateriaal][ref1] is.

      2 Een vergunning wordt geweigerd, indien niet wordt of naar redelijke verwachting niet zal worden voldaan aan
      het bepaalde bij of krachtens deze wet, een doelmatige voorziening in de behoefte aan organen niet is gebaat bij
      verlening van de vergunning, dan wel een doelmatige samenwerking met andere orgaancentra en met orgaanbanken als
      bedoeld in [artikel 1, eerste lid, onderdeel l, van de Wet veiligheid en kwaliteit lichaamsmateriaal][ref2] niet
      is verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0014682#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0014682#Artikel1
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel25
