        bwb_id: BWBR0014682
        artikel: '1'
  - number: '26'
    text: |-
      1 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden
      met betrekking tot:

      a. de deskundigheid van het personeel;

      b. de samenstelling van het bestuur;

      c. de inschrijving van mogelijke ontvangers van organen;

      d. de openbaarmaking van de normen voor inschrijving van mogelijke ontvangers en voor toewijzing van organen aan
      een ontvanger;

      e. de bescherming van de persoonlijke levenssfeer van donoren en ontvangers van organen;

      f. de uitrusting en bereikbaarheid van het orgaancentrum;

      g. de verslaglegging over de werkzaamheden.

      2 Een beperking of voorschrift kan worden gewijzigd of ingetrokken. Ook na het verlenen van de vergunning kunnen
      daaraan beperkingen worden gesteld of voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel26
  - number: '27'
    text: |-
      Een vergunning kan worden ingetrokken indien niet meer wordt voldaan aan het bepaalde bij of krachtens deze wet of
      de [Wet veiligheid en kwaliteit lichaamsmateriaal][ref1] of de aan de vergunning verbonden voorschriften dan wel
      indien in strijd is gehandeld met een beperking waaronder de vergunning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0014682
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0014682
  - number: 31a
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0008066/2016-08-01#Artikel31a
  - number: '32'
    text: |-
      1 Met gevangenisstraf van ten hoogste een jaar of geldboete van de vierde categorie wordt gestraft degene die
      opzettelijk in strijd handelt met het bepaalde in [de artikelen 8][ref1] en [21][ref2].

      2 Met dezelfde straf wordt gestraft:

      a. degene die opzettelijk teweegbrengt of bevordert dat een ander aan een derde toestemming verleent voor het bij
      leven verwijderen van een orgaan waarvoor een vergoeding wordt betaald die meer bedraagt dan de kosten, bedoeld in
      [artikel 2][ref3], dan wel dat een ander in strijd handelt met [artikel 7][ref4];

      b. degene die openlijk hetzij voor het ontvangen van een orgaan een vergoeding aanbiedt die meer bedraagt dan
      de kosten, bedoeld in [artikel 2][ref5], hetzij zich tegen een dergelijke vergoeding als donor aanbiedt hetzij
      diensten aanbiedt bestaande uit gedragingen, strafbaar gesteld in onderdeel *a*;

      c. degene die de behoefte aan, of de beschikbaarheid van organen onder de aandacht brengt met het oogmerk
      financiële of vergelijkbare voordelen aan te bieden of te behalen;

      d. degene die opzettelijk teweegbrengt of bevordert dat bestanddelen van een persoon of van een stoffelijk
      overschot, bij wie onderscheidenlijk waarbij de hersenen geheel of nagenoeg geheel ontbreken, worden gebruikt met
      het oogmerk om in of aan het lichaam van een ander ten behoeve van diens geneeskundige behandeling te worden in-
      of aangebracht.

      3 Met gevangenisstraf van ten hoogste zes maanden of geldboete van de vijfde categorie wordt gestraft degene die
      handelt in strijd met het bepaalde in de [artikelen 22][ref6] en [24][ref7].

      4 De in het eerste tot en met derde lid strafbaar gestelde feiten zijn misdrijven.


