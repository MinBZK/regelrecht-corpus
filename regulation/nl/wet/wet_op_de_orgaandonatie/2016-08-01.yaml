  - number: '23'
    text: |-
      1 Het bestuur van een ziekenhuis draagt zorg voor vaststelling van een protocol met betrekking tot ter beschikking
      stelling van organen ten behoeve van implantatie en ziet toe op de naleving daarvan.

      2 In het protocol worden de functionarissen aangewezen die binnen het ziekenhuis zijn belast met de uitvoering van
      de in de [artikelen 18, eerste lid][ref1], en [20][ref2] genoemde taken en worden regels gesteld omtrent:

      a. de wijze waarop wordt nagegaan of een overledene in aanmerking komt als donor;

      b. de wijze waarop overeenkomstig [artikel 20][ref3] het donorregister wordt geraadpleegd, de in het tweede lid
      van artikel 20 bedoelde personen worden geïnformeerd, de in het derde lid van artikel 20 bedoelde personen om
      toestemming worden gevraagd, dan wel de in het vierde lid van artikel 20 bedoelde personen op de hoogte worden
      gesteld;

      c. de procedure die wordt gevolgd bij de melding van een orgaan bij een orgaancentrum;

      d. de wijze waarop aan de personen bedoeld in [artikel 20, derde en vierde lid][ref4], nazorg wordt verleend;

      e. de voorlichting in het ziekenhuis over de in het protocol gestelde regels.

      3 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de inhoud van het in het eerste
      lid bedoelde protocol en kan worden bepaald dat dit artikel geheel of gedeeltelijk niet van toepassing is op
      bepaalde categorieën ziekenhuizen.

      4 Indien in een ziekenhuis de mogelijkheid bestaat tot het vaststellen van de hersendood, bevat het protocol tevens
      de daarvoor geldende methoden en criteria en de daarbij te volgen procedures en onderzoeken zoals vastgesteld op
      grond van [artikel 15, eerste lid][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0008066#Artikel18
