  - number: 10.2a.2
    text: |-
      Personen en instellingen die ter zake van de zorg een vordering hebben op een jeugdige die aanspraak heeft op
      gehele of gedeeltelijke vergoeding van de kosten van die zorg, dan wel de betreffende jeugdige, zenden de nota ter
      vergoeding aan het Zorginstituut.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.2a
  - number: 10.2a.3
    text: |-
      Het Zorginstituut kan een rechtspersoon mandaat en volmacht verlenen om namens hem besluiten te nemen of
      werkzaamheden te verrichten die verband houden met het verlenen van vergoedingen als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.2a
  - number: 10.2a.4
    text: |-
      De vergoedingen, bedoeld in het tweede lid, komen ten laste van het Zorgverzekeringsfonds en het Fonds langdurige
      zorg, bedoeld in [artikel 89 van de Wet financiering sociale verzekeringen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel89
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.2a
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '89'
  - number: 10.3.1
    text: |-
      In dit artikel wordt verstaan onder: - *cliënt:* jeugdige of zijn ouders of pleegouders;
        - *jeugdige:* persoon die: 1°. de meerderjarigheidsleeftijd nog niet heeft bereikt, 2°. de meerderjarigheidsleeftijd
      heeft bereikt en ten aanzien van wie op grond van [artikel 77c van het Wetboek van Strafrecht][ref1]
      recht is gedaan overeenkomstig de [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref2], of
      3°. de meerderjarigheidsleeftijd doch niet de leeftijd van drieëntwintig jaar heeft bereikt, en voor wie
      voorzetting van jeugdzorg, die was aangevangen of waarvan de aanvraag was ingediend vóór het bereiken van de
      meerderjarigheidsleeftijd, noodzakelijk is of voor wie, na beëindiging van de jeugdzorg die was aangevangen vóór
      het bereiken van de meerderjarigheidsleeftijd, binnen een termijn van een half jaar hervatting van jeugdzorg
      noodzakelijk is, en
        - *jeugdzorg:* ondersteuning van en hulp aan jeugdigen, hun ouders, stiefouders of anderen, die een jeugdige als
      behorende tot hun gezin verzorgen en opvoeden, bij opgroei- of opvoedingsproblemen of dreigende zodanige problemen;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77c
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel77aa
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77c
      - id: ref2
        bwb_id: BWBR0001854
        artikel: 77aa
  - number: 10.3.2
    text: |-
      De rechten en verplichtingen die op het tijdstip van de inwerkingtreding van deze wet gelden met betrekking tot
      jeugdzorg waarvoor een indicatiebesluit als bedoeld in [artikel 3, derde lid, van de Wet op de jeugdzorg][ref1]
      is afgegeven voor de inwerkingtreding van deze wet, blijven gelden gedurende de looptijd van het indicatiebesluit,
      doch ten hoogste een jaar na de inwerkingtreding van deze wet, met dien verstande dat het college van de gemeente
      waarbinnen de jeugdige zijn woonplaats heeft, in de plaats treedt van de gedeputeerde staten van de provincie,
      bedoeld in [artikel 3, tweede lid, van de Wet op de jeugdzorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016880#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016880#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0016880
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0016880
        artikel: '3'
  - number: 10.3.3
    text: |-
      Het college is er verantwoordelijk voor dat de jeugdige in een situatie als bedoeld in het tweede lid, de jeugdhulp
      die reeds is ingezet voor inwerkingtreding van deze wet, na inwerkingtreding van deze wet kan voortzetten bij
      dezelfde aanbieder, indien dit redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.3
  - number: 10.3.4
    text: |-
      In afwijking van het tweede lid geldt ingeval sprake is van een indicatiebesluit waarin is vastgesteld dat de
      jeugdige aangewezen is op pleegzorg, geen einddatum voor de rechten en verplichtingen die verbonden zijn aan dit
      besluit jegens het college.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.3
  - number: 10.3.5
    text: |-
      Het college is er verantwoordelijk voor dat bij de jeugdige in een situatie als bedoeld in het tweede lid, die voor
      inwerkingtreding van deze wet reeds is geplaatst bij een pleegouder, de pleegzorg wordt voortgezet bij dezelfde
      pleegouders. Hiervan kan slechts worden afgeweken indien dat voor de verlening van verantwoorde hulp noodzakelijk
      is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.3
  - number: 10.3.6
    text: |-
      Indien de verschuldigdheid van een ouderbijdrage onderdeel uitmaakt van de rechten en verplichtingen als
      bedoeld in het tweede lid, verstrekt het Landelijk Bureau Inning Onderhoudsbijdragen aan het bestuursorgaan
      dat met de vaststelling en de inning van de ouderbijdrage is belast, ten behoeve van de goede uitvoering van de
      taak van dat bestuursorgaan, alsmede aan de gemeente waar de jeugdige als bedoeld in deze wet zijn woonplaats
      heeft en op wie het indicatiebesluit als bedoeld in het tweede lid betrekking heeft, een afschrift van de in
      [artikel 12, derde volzin, van de Wet op de jeugdzorg][ref1] bedoelde formulieren.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel12
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '12'
  - number: 10.4.1
    text: |-
      Het college is bevoegd tot het verwerken van persoonsgegevens, waaronder bijzondere persoonsgegevens, ten behoeve
      van:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.1.a
    text: |-
      de uitvoering van [artikel 12.4, aanhef en eerste lid, onderdelen a en b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel12
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '12'
        hoofdstuk: '12'
  - number: 10.4.1.b
    text: |-
      de uitvoering van de [artikelen 10.1][ref1], [10.2][ref2] en [10.3][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel10
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.1.c
    text: |-
      het treffen van voorzieningen op het gebied van jeugdhulp en de uitvoering van kinderbeschermingsmaatregelen
      en jeugdreclassering voor jeugdigen of ouders in het eerste kalenderjaar na het kalenderjaar waarin de
      [artikelen 10.1][ref1], [10.2][ref2] en [10.3][ref3] in werking zijn getreden, in aansluiting op de verstrekking
      van voorzieningen door het college op grond van de artikelen 10.1, 10.2 en 10.3.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel10
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.2
    text: |-
      Met betrekking tot een jeugdige of zijn ouders die ten gevolge van de inwerkingtreding van deze wet vanaf enig
      tijdstip niet langer aanspraak hebben op persoonlijke verzorging, verpleging, behandeling, verblijf, kortdurend
      verblijf, vervoer en voortgezet verblijf op grond van de [Algemene Wet Bijzondere Ziektekosten][ref1], jeugdzorg op
      grond van de [Wet op de jeugdzorg][ref2] of geestelijke gezondheidszorg op grond van [Zorgverzekeringswet][ref3],
      verstrekken jeugdhulpaanbieders, alsmede daartoe bij ministeriële regeling door Onze Ministers aangewezen personen
      en organisaties, persoonsgegevens, waaronder bijzondere persoonsgegevens, aan het college van de gemeente waar de
      betreffende jeugdige zijn woonplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0016637
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0016637
      - id: ref3
        bwb_id: BWBR0018450
  - number: 10.4.3
    text: 'De te verstrekken gegevens betreffen ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.3.a
    text: identificerende gegevens, waaronder het burgerservicenummer, van de jeugdige;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.3.b
    text: |-
      gegevens betreffende de woonplaats en, indien noodzakelijk, identificerende gegevens, waaronder het
      burgerservicenummer, van de ouders of andere wettelijke vertegenwoordigers ten behoeve van het vaststellen van
      de woonplaats;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.3.c
    text: |-
      gegevens betreffende de jeugdhulpaanbieder die de jeugdhulp ten tijde van de gegevensverstrekking verleent, alsmede
      gegevens betreffende de jeugdhulpaanbieder die de jeugdhulp zal verlenen op 1 januari van het kalenderjaar waarop
      de [artikelen 10.1][ref1], [10.2][ref2] en [10.3][ref3] in werking treden;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel10
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.3.d
    text: |-
      gegevens, waaronder bijzondere persoonsgegevens, betreffende de ten tijde van de gegevensverstrekking verleende
      of geïndiceerde jeugdhulp, uitvoering van de kinderbeschermingsmaatregel of jeugdreclassering, voor zover deze
      verstrekking noodzakelijk is voor het treffen van aansluitende voorzieningen op het gebied van jeugdhulp, de
      uitvoering van kinderbeschermingsmaatregelen of jeugdreclassering, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.3.e
    text: gegevens betreffende de leveringsvorm van de jeugdhulp.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.4
    text: |-
      Het ontvangende college zendt de gegevens door aan een ander college, indien het van mening is dat het andere
      college dient te worden aangemerkt als het college van de gemeente waarbinnen de jeugdige zijn woonplaats heeft.
      Zo nodig treedt het ontvangende college daartoe in overleg met andere colleges teneinde de gemeente waarbinnen
      de jeugdige zijn woonplaats heeft vast te stellen. Het ontvangende college bericht de verstrekker, bedoeld in het
      tweede lid, indien sprake is van doorzending.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.5
    text: |-
      Jeugdhulpaanbieders informeren de jeugdige of zijn ouders voorafgaande aan de verstrekking van de gegevens, tenzij
      dit onmogelijk blijkt of een onevenredige inspanning vergt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4.6
    text: |-
      De gegevens, bedoeld in het tweede lid tot en met vierde lid, worden uiterlijk 31 januari van het eerste
      kalenderjaar na het kalenderjaar waarop de [artikelen 10.1][ref1], [10.2][ref2] en [10.3][ref3] in werking
      treden door het college vernietigd, tenzij de gegevens noodzakelijk zijn voor de uitvoering van een aansluitende
      voorziening op het gebied van jeugdhulp of de uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering
      als bedoeld in het eerste lid, onderdeel c dan wel ter voldoening aan een wettelijk voorschrift bewaard dienen
      te blijven.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel10
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
  - number: 10.4.7
    text: |-
      Bij regeling van Onze Ministers worden nadere regels gesteld omtrent de inhoud van de gegevens, bedoeld in het
      tweede en derde lid, de categorieën van jeugdhulpaanbieders en overige door Onze Ministers aangewezen personen en
      organisaties, bedoeld in het tweede lid, die de gegevens verstrekken, de wijze en het tijdstip van het verstrekken
      van de gegevens, bedoeld in het tweede en derde lid, en het bericht als bedoeld in het vierde lid. Daarbij kan
      bepaald worden dat de gegevens of het bericht verstrekt worden aan en verwerkt worden door Onze Ministers of een
      door hen aan te wijzen tijdelijke voorziening.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4
  - number: 10.4a.1
    text: |-
      Een aanvraag als bedoeld in [artikel 7, eerste lid, van de Wet op de jeugdzorg][ref1], die is ingediend voor de
      inwerkingtreding van [artikel 11.7][ref2] van deze wet, wordt in de stand van behandeling waarin deze zich bevindt
      door de stichting, bedoeld in [artikel 1 van de Wet op de jeugdzorg][ref3], zoals deze luidde op de dag voorafgaand
      aan de inwerkingtreding van artikel 11.7 van deze wet, uiterlijk op de dag voor de inwerkingtreding van artikel
      11.7 van deze wet overgedragen aan het college van de gemeente waarbinnen de jeugdige zijn woonplaats heeft,
      teneinde het college in de gelegenheid te stellen op grond van deze wet over de aanvraag een beslissing te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4a
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 10.4a.2
    text: |-
      Een aanvraag van een jeugdige, die tevens verzekerde is in de zin van de
      [Algemene Wet Bijzondere Ziektekosten][ref1] voor zorg waarvan de aanspraak op grond van de Algemene Wet Bijzondere
      Ziektekosten ten gevolge van de inwerkingtreding van [artikel 11.7][ref2] van deze wet komt te vervallen en
      die na inwerkingtreding van artikel 11.7 van deze wet als jeugdhulp kan worden aangemerkt waarvoor het college
      is gehouden een voorziening op grond van deze wet te treffen, die is ingediend voor de inwerkingtreding
      van artikel 11.7 van deze wet, wordt binnen twee weken na de inwerkingtreding van artikel 11.7 van deze wet
      in de stand waarin het zich bevindt, door het daartoe bevoegde indicatieorgaan, de stichting, bedoeld in
      [artikel 9b, eerste en vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref3], zoals deze luidde op de
      dag voorafgaand aan de inwerkingtreding van deze wet, dan wel door de door Onze Minister van Volksgezondheid,
      Welzijn en Sport aangewezen persoon als bedoeld in [artikel 53 van de Algemene Wet Bijzondere Ziektekosten][ref4],
      overgedragen aan het college van de gemeente waarbinnen de jeugdige zijn woonplaats heeft, teneinde het college in
      de gelegenheid te stellen op grond van deze wet over de aanvraag een beslissing te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel53
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4a
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: 9b
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '53'
  - number: 10.4a.3
    text: |-
      Een aanvraag van een jeugdige, die tevens verzekerde is in de zin van [Zorgverzekeringswet][ref1] voor zorg waarvan
      de aanspraak op grond van de Zorgverzekeringswet ten gevolge van de inwerkingtreding van deze wet komt te vervallen
      en die na inwerkingtreding van [artikel 11.7][ref2] van deze wet als jeugdhulp kan worden aangemerkt waarvoor het
      college is gehouden een voorziening op grond van deze wet te treffen, die is ingediend voor de inwerkingtreding van
      artikel 11.7 van deze wet, wordt binnen twee weken na de inwerkingtreding van artikel 11.7 van deze wet in de stand
      waarin het zich bevindt, door de stichting, bedoeld in [artikel 1 van de Wet op de jeugdzorg][ref3], zoals deze
      luidde op de dag voorafgaand aan de inwerkingtreding van deze wet, overgedragen aan het college van de gemeente
      waarbinnen de jeugdige zijn woonplaats heeft, teneinde het college in de gelegenheid te stellen op grond van deze
      wet over de aanvraag een beslissing te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4a
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 10.4a.4
    text: |-
      Het in het tweede lid bedoelde bevoegde indicatieorgaan of stichting dan wel de door Onze Minister van
      Volksgezondheid, Welzijn en Sport aangewezen persoon, alsmede de in het derde lid bedoelde stichting, zenden
      binnen twee weken na de dag waarop [artikel 11.7][ref1] van deze wet in werking treedt aan het college de
      persoonsgegevens van de verzekerde, waaronder persoonsgegevens betreffende de gezondheid als bedoeld in de
      [Wet bescherming persoonsgegevens][ref2], die noodzakelijk zijn voor de uitvoering van de taak, bedoeld in het
      tweede en derde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0011468
  - number: 10.4a.5
    text: |-
      Het college is bevoegd tot het verwerken van de persoonsgegevens die overeenkomstig het vierde lid aan hem zijn
      verstrekt, voor zover dat noodzakelijk is om op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.4a
  - number: 10.5.1
    text: |-
      Een verzoek om een machtiging of een voorlopige machtiging als bedoeld in de [artikelen 29b][ref1] respectievelijk
      [29c van de Wet op de jeugdzorg][ref2] ingediend voor het tijdstip van inwerkingtreding van deze wet, gelden met
      ingang van dat tijdstip als een verzoek om een machtiging als bedoeld in de [artikelen 6.1.2][ref3] respectievelijk
      [6.1.3][ref4] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29c
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29c
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10.5.2
    text: |-
      Een machtiging en een voorlopige machtiging als bedoeld in de [artikelen 29b][ref1] respectievelijk
      [29c van de Wet op de jeugdzorg][ref2] verleend voor het tijdstip van inwerkingtreding van deze wet, gelden met
      ingang van dat tijdstip als een machtiging als bedoeld in de [artikelen 6.1.2][ref3] respectievelijk [6.1.3][ref4]
      van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel29b
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel29c
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.5
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: 29b
      - id: ref2
        bwb_id: BWBR0016637
        artikel: 29c
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 10.6.1
    text: |-
      In dit artikel en in de [artikelen 10.7][ref1] en [10.11][ref2] wordt verstaan onder bureau jeugdzorg: stichting
      die een bureau jeugdzorg onder de [Wet op de jeugdzorg][ref3] in stand hield, zoals die wet luidde tot de
      inwerkingtreding van [artikel 11.7, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0016637
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0016637
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.6.2
    text: |-
      Voogdij en voorlopige voogdij, uitgeoefend door een bureau jeugdzorg of gemandateerd aan een instelling met een
      landelijk bereik die op het tijdstip van inwerkingtreding van [artikel 11.7, eerste lid][ref1], is gecertificeerd,
      berust met ingang van dat tijdstip bij die gecertificeerde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.6.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing met betrekking tot ondertoezichtstelling, voorlopige
      ondertoezichtstelling en jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.6
  - number: 10.7.1
    text: |-
      Voogdij of voorlopige voogdij, uitgeoefend door een bureau jeugdzorg of gemandateerd aan een instelling met
      een landelijk bereik die op het tijdstip van inwerkingtreding van [artikel 11.7, eerste lid][ref1], niet is
      gecertificeerd, blijft met ingang van dat tijdstip, doch voor ten hoogste een jaar nadien, uitgeoefend worden door
      dat bureau jeugdzorg of door die gemandateerde instelling met een landelijk bereik.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.7.2
    text: |-
      Ondertoezichtstelling en voorlopige ondertoezichtstelling, opgedragen aan een bureau jeugdzorg of
      gemandateerd aan een instelling met een landelijk bereik die op het tijdstip van inwerkingtreding van
      [artikel 11.7, eerste lid][ref1], niet is gecertificeerd, blijft met ingang van dat tijdstip en totdat de
      kinderrechter een verlenging van de ondertoezichtstelling of een ondertoezichtstelling heeft uitgesproken,
      uitgevoerd worden door dat bureau jeugdzorg of door die gemandateerde instelling met een landelijk bereik.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.7.3
    text: |-
      Jeugdreclassering, uitgeoefend door een bureau jeugdzorg of gemandateerd aan een instelling met een landelijk
      bereik die op het tijdstip van inwerkingtreding van [artikel 11.7, eerste lid][ref1], niet is gecertificeerd,
      blijft met ingang van dat tijdstip, doch voor ten hoogste een jaar nadien, uitgeoefend worden door dat bureau
      jeugdzorg of door die gemandateerde instelling met een landelijk bereik.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.8.1
    text: |-
      Voogdij, voorlopige voogdij of tijdelijke voogdij, uitgeoefend door de rechtspersoon, bedoeld in
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1], die op het tijdstip van inwerkingtreding
      van [artikel 11.7, eerste lid][ref2], als een gecertificeerde instelling wordt aangemerkt, berust met ingang van
      dat tijdstip bij die gecertificeerde instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.8.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de taken van de rechtspersoon, bedoeld in
      [artikel 256, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel256
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.8
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '256'
  - number: 10.9.1
    text: |-
      Voogdij, voorlopige voogdij of tijdelijke voogdij uitgeoefend door de rechtspersoon, bedoeld in
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref1], die op het tijdstip van inwerkingtreding
      van [artikel 11.7, eerste lid][ref2], niet als een gecertificeerde instelling wordt aangemerkt, blijft met ingang
      van dat tijdstip, doch voor ten hoogste een jaar nadien opgedragen aan de rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.9.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing met betrekking tot de taken van de in
      [artikel 256, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref1] bedoelde rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel256
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.9
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '256'
  - number: '10.10'
    text: |-
      In afwijking van [artikel 3.2, tweede lid][ref1], kan een gemandateerde instelling met een landelijk bereik ook
      jeugdhulp aanbieden voor ten hoogste een jaar na inwerkingtreding van [artikel 11.7, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.10
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: '10.11'
    text: |-
      In het kalenderjaar waarin [artikel 11.7, eerste lid][ref1], in werking treedt, besteden de colleges van de bij
      regeling van Onze Ministers aangewezen gemeenten bij het in die regeling aangewezen bureau jeugdzorg of zijn
      rechtsopvolger minimaal tachtig procent van het budget dat door de provincie in 2014 is verstrekt aan dat bureau
      jeugdzorg met het oog op de uitvoering van zijn wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 10.12.1
    text: |-
      Het bestuursorgaan dat op grond van [artikel 8.2.3, eerste lid][ref1], van deze wet met de vaststelling
      en inning van ouderbijdragen is belast, stelt een persoon aan die op het tijdstip van inwerkingtreding van
      [artikel 11.7 van deze wet][ref2] als ambtenaar in de zin van [artikel 1 van de Ambtenarenwet][ref3] bij het
      Landelijk Bureau Inning Onderhoudsbijdragen, bedoeld in [artikel 73 van de Wet op de jeugdzorg][ref4], in dienst
      is en die is belast met het vaststellen en innen van ouderbijdragen en in verband met die inwerkingtreding naar het
      bestuursorgaan, bedoeld in artikel 8.2.3, overgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel73
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
      - id: ref3
        bwb_id: BWBR0001947
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '73'
  - number: 10.12.2
    text: |-
      Op een persoon als bedoeld in het eerste lid, zijn de rechtspositieregels die gelden voor de ambtenaren die
      zijn aangesteld bij ministeries, van overeenkomstige toepassing. De in die regels neergelegde bevoegdheden,
      met uitzondering van de aan Ons dan wel de aan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties
      toegekende bevoegdheden tot het stellen van regels worden uitgeoefend door het bestuursorgaan dat op grond van
      [artikel 8.2.3, eerste lid][ref1], van deze wet met de vaststelling en inning van ouderbijdragen is belast. Voor
      zover in die regels is bepaald dat bevoegdheden worden uitgeoefend met medebetrokkenheid van Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties, worden deze bevoegdheden uitgeoefend met medebetrokkenheid van Onze
      Minister van Volksgezondheid, Welzijn en Sport.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 11.7.1
    text: |-
      De [Wet op de jeugdzorg][ref1] wordt ingetrokken, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: 11.7.1.a
    text: |-
      zij van toepassing blijft op de financiële verantwoording, vaststelling, uitbetaling van op grond van die wet
      verleende subsidies en uitkeringen en op de vaststelling en inning op grond van die wet van de ouderbijdragen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel11.7
  - number: 11.7.1.b
    text: |-
      [hoofdstuk VII van de Wet op de jeugdzorg][ref1] van toepassing blijft op het verstrekken en verwerken van gegevens
      die betrekking hebben op het laatste kalenderjaar voor die intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0016637
        hoofdstuk: VII
  - number: 11.7.2
    text: |-
      In wettelijke procedures en rechtsgedingen tegen besluiten die op grond van de [Wet op de jeugdzorg][ref1] zijn
      genomen, dan wel op tegen deze besluiten in te stellen of ingestelde beroepen, blijven, zowel in eerste aanleg als
      in verdere instantie, de regels van toepassing, die golden voor de intrekking van die wet. Indien het een besluit
      betreft dat is genomen door een stichting als bedoeld in [artikel 1 van de Wet op de jeugdzorg][ref2], treedt het
      college van de gemeente waar de jeugdige zijn woonplaats heeft in de plaats van die stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 12.1.1
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een doelmatigere en doeltreffendere uitvoering van deze
      wet, waarbij een optimale samenhangende uitvoering van het vrijwillige en het gedwongen kader voorop staat, regels
      worden gesteld voor een periode van ten hoogste drie jaar ten behoeve van experimenten, waarbij afgeweken kan
      worden van [artikel 3.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3'
        hoofdstuk: '3'
  - number: 12.1.2
    text: |-
      In een algemene maatregel van bestuur als bedoeld in het eerste lid worden in ieder geval de voorwaarden voor het
      experiment bepaald en tevens welk resultaat met het experiment wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.1
  - number: 12.1.3
    text: |-
      Onze Ministers zenden drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur
      als bedoeld in het eerste lid aan de beide kamers der Staten-Generaal een verslag over de doelmatigheid en
      doeltreffendheid van het experiment, alsmede een standpunt inzake de voortzetting van die maatregel, anders dan
      als experiment.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.1
  - number: 12.1.4
    text: |-
      Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele voorziening is getroffen, doch niet langer dan met een tijdsduur van ten
      hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.1
  - number: '12.2'
    text: |-
      Onze Ministers zenden binnen drie jaar na de inwerkingtreding van de wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.2
  - number: 12.3.1
    text: |-
      Indien een gecertificeerde instelling geheel of ten dele is gevormd uit een stichting als bedoeld in
      [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref1], gaan de verplichtingen die ingevolge de
      [Archiefwet 1995][ref2] en de [artikelen 55][ref3] en [56 van de Wet op de jeugdzorg][ref4] op die stichting rusten
      over op de gecertificeerde instelling, behoudens het bepaalde in het vijfde lid. Onder stichting wordt in dit
      artikel mede verstaan een gemandateerde instelling met een landelijk bereik.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007376
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel56
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007376
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '56'
  - number: 12.3.2
    text: |-
      Indien een of meer gecertificeerde instellingen zijn gevormd uit een of meer stichtingen als bedoeld
      in [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref1], treffen zij gezamenlijk een regeling ten
      aanzien van de in het eerste lid bedoelde verplichtingen onderscheidenlijk een voorziening als bedoeld in
      [artikel 4, eerste lid, van de Archiefwet 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '4'
  - number: 12.3.3
    text: |-
      Een regeling of voorziening als in het tweede lid bedoeld strekt ertoe dat alle verplichtingen, bedoeld in het
      eerste lid, worden belegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3
  - number: 12.3.4
    text: |-
      Indien uit een stichting geen gecertificeerde instelling wordt gevormd, treft de stichting een regeling
      onderscheidenlijk voorziening met een of meer gecertificeerde instellingen of gemeenten, behoudens het bepaalde in
      het vijfde lid. Het tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3
  - number: 12.3.5
    text: |-
      Indien een taak of bevoegdheid als bedoeld in de [artikelen 5 tot en met 11 van de Wet op de jeugdzorg][ref1],
      die werd uitgevoerd door een stichting als bedoeld in [artikel 1, eerste lid, van die wet][ref2], krachtens deze
      wet bij het college berust, gaan de verplichtingen, bedoeld in het eerste lid, ten aanzien van een dossier over op
      dat college voor zover dat college dat dossier van de gecertificeerde instelling heeft ontvangen ten behoeve van
      de toeleiding naar, advisering over, bepaling van, het inzetten van of de bekostiging van een voorziening op het
      gebied van jeugdhulp.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 12.3.6
    text: |-
      In afwijking van het vijfde lid gaan dossiers gevormd bij de uitvoering van de taken, bedoeld in
      [artikel 11, eerste lid, van de Wet op de jeugdzorg][ref1], en de in het eerste lid bedoelde verplichtingen met
      betrekking tot die dossiers, over op het advies- en meldpunt huiselijk geweld en kindermishandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '11'
  - number: 12.3.7
    text: |-
      Overdracht van bescheiden ingevolge dit artikel geschiedt in goede, geordende en toegankelijke staat. Hiervan maakt
      de overdragende partij een verklaring van vervreemding op.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3
  - number: 12.3a.1
    text: |-
      Archiefbescheiden en de daarmee samenhangende verplichtingen, bedoeld in de [Archiefwet 1995][ref1], met
      betrekking tot zorg waarvoor een aanvraag als bedoeld in [artikel 10.4a, tweede lid][ref2], is ingediend bij een
      indicatieorgaan als bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref3] en waarover op de
      datum van inwerkingtreding van [artikel 11.7][ref4] nog geen besluit is genomen, worden door dat indicatieorgaan
      overgedragen aan het college van de gemeente waar de jeugdige zijn woonplaats heeft en dat gehouden is een
      voorziening op grond van deze wet te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
