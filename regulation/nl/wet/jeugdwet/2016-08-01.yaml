        paragraaf: '6.4'
  - number: 6.5.1.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de samenstelling van de
      klachtencommissie bij de behandeling van klachten als bedoeld in het eerste lid en de wijze waarop deze klachten
      worden behandeld.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.3
    text: |-
      De klachtencommissie neemt zo spoedig mogelijk, doch in ieder geval binnen vier weken, te rekenen vanaf de datum
      waarop de klacht is ontvangen, een beslissing op de klacht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.4
    text: 'De beslissing van de commissie strekt tot:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.4.a
    text: onbevoegdverklaring van de commissie,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.4.b
    text: niet-ontvankelijkverklaring van de klacht,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.4.c
    text: ongegrondverklaring van de klacht, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.4.d
    text: gegrondverklaring van de klacht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.5
    text: |-
      Indien de commissie de klacht gegrond verklaart, vernietigt zij de bestreden beslissing geheel of gedeeltelijk.
      Gehele of gedeeltelijke vernietiging brengt vernietiging van de rechtsgevolgen van de beslissing of het vernietigde
      gedeelte van de beslissing mee.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.6
    text: |-
      Indien de commissie de klacht gegrond verklaart, kan zij degene die de beslissing heeft genomen opdragen een nieuwe
      beslissing te nemen en voor het nemen daarvan een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.7
    text: |-
      Indien de commissie de klacht gegrond verklaart, kan zij bepalen dat enige tegemoetkoming, die geldelijk van aard
      kan zijn, aan de klager geboden is en stelt zij deze tegemoetkoming vast.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
  - number: 6.5.1.8
    text: |-
      [Titel 9.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op klachten als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 6.5.2.1
    text: |-
      Hangende de beslissing op de klacht kan de voorzitter van een beroepscommissie als bedoeld in
      [artikel 74 van de Beginselenwet justitiële jeugdinrichtingen][ref1] op verzoek van de jeugdige, gehoord degene
      die de beslissing heeft genomen, de beslissing waartegen de klacht is gericht, schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel74
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '74'
  - number: 6.5.2.2
    text: De voorzitter doet hiervan onverwijld mededeling aan degene die de beslissing heeft genomen en aan de klager.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.2
  - number: 6.5.3
    text: |-
      Ten aanzien van een beslissing als bedoeld in [artikel 6.5.1, derde lid][ref1], zijn de
      [artikelen 74 tot en met 76 van de Beginselenwet justitiële jeugdinrichtingen][ref2] van overeenkomstige
      toepassing, met dien verstande dat voor «directeur» respectievelijk «beklagcommissie» gelezen wordt
      «jeugdhulpaanbieder» respectievelijk «klachtencommissie».


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel74
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '74'
  - number: 7.1.1.1
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder: - *hulp, zorg of bijsturing:*
      werkzaamheden die een meldingsbevoegde op grond van de voor hem geldende regelgeving ten behoeve van een jeugdige
      verricht;
        - *jeugdige:* persoon die de leeftijd van drieëntwintig jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.1
  - number: 7.1.1.2.1
    text: 'Meldingsbevoegde is een functionaris die werkzaam is voor een instantie die:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.2
  - number: 7.1.1.2.1.a
    text: |-
      behoort tot een bij algemene maatregel van bestuur aangewezen categorie van instanties die werkzaam is in een of
      meer van de domeinen jeugdhulp, jeugdgezondheidszorg, gezondheidszorg, onderwijs, maatschappelijke ondersteuning,
      werk en inkomen, of politie en justitie,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.2
  - number: 7.1.1.2.1.b
    text: |-
      afspraken als bedoeld in [artikel 7.1.3.1][ref1] heeft gemaakt met het college, en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.1.2.1.c
    text: de functionaris als zodanig heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.2
  - number: 7.1.1.2.2
    text: 'Meldingsbevoegde is voorts een functionaris die niet werkzaam is voor een instantie en die:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.2
  - number: 7.1.1.2.2.a
    text: |-
      behoort tot een bij algemene maatregel van bestuur aangewezen categorie van functionarissen die werkzaam is in een
      of meer van de in het eerste lid, onderdeel a, genoemde domeinen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.2
  - number: 7.1.1.2.2.b
    text: |-
      afspraken als bedoeld in [artikel 7.1.3.1][ref1] heeft gemaakt met het college.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.1.1
    text: |-
      Er is een verwijsindex risicojongeren, zijnde een landelijk elektronisch systeem, waarin persoonsgegevens alsmede
      andere gegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.1
  - number: 7.1.2.1.2
    text: |-
      De verwijsindex heeft tot doel vroegtijdige en onderlinge afstemming tussen meldingsbevoegden te bewerkstelligen,
      opdat zij jeugdigen tijdig passende hulp, zorg of bijsturing kunnen verlenen om daadwerkelijke bedreigingen van de
      noodzakelijke condities voor een gezonde en veilige ontwikkeling naar volwassenheid te voorkomen, te beperken of
      weg te nemen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.1
  - number: 7.1.2.1.3
    text: De verwijsindex wordt uitsluitend gebruikt voor het in het tweede lid aangegeven doel.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.1
  - number: 7.1.2.2.1
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport draagt zorg voor de inrichting en het beheer van de
      verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.2
  - number: 7.1.2.2.2
    text: Onze Minister van Volksgezondheid, Welzijn en Sport is de verantwoordelijke voor de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.2
  - number: 7.1.2.2.3
    text: |-
      In afwijking van het tweede lid, is voor de toepassing van de [artikelen 34 tot en met 40][ref1] en
      [43 van de Wet bescherming persoonsgegevens][ref2] de verantwoordelijke het college van de gemeente die afspraken
      als bedoeld in [artikel 7.1.3.1][ref3] heeft gemaakt met de instantie waarvoor de meldingsbevoegde die de jeugdige
      heeft gemeld werkzaam is of, indien die niet werkzaam is voor een instantie, met de meldingsbevoegde.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inrichting en het beheer van de
      verwijsindex. Daartoe behoren in elk geval regels omtrent de beveiliging van persoonsgegevens en de beschikbaarheid
      van voorzieningen die deel uitmaken van de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.2
  - number: 7.1.2.3.1
    text: 'Van de verwijsindex maken deel uit:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.a
    text: |-
      voorzieningen waarmee de verwijsindex met het oog op het verwerken van een melding het burgerservicenummer van de
      betrokken jeugdige kan opvragen of verifiëren;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.b
    text: voorzieningen waarmee een jeugdige aan de verwijsindex kan worden gemeld of eruit kan worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.c
    text: |-
      voorzieningen waarmee bij twee of meer meldingen van dezelfde jeugdige een signaal wordt gezonden naar de
      meldingsbevoegden die de betrokken jeugdige hebben gemeld en naar degene die belast is met de taken, bedoeld in
      [artikel 7.1.3.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.3.1.d
    text: |-
      voorzieningen waarmee bij twee of meer meldingen van jeugdigen met hetzelfde woonadres, bedoeld in de
      [Wet basisregistratie personen][ref1], niet zijnde het adres van een instelling die is aangewezen op grond van
      [artikel 2.40, derde of vierde lid, van die wet][ref2], een signaal wordt gezonden naar de meldingsbevoegden die de
      betrokken jeugdige hebben gemeld en naar degene die belast is met de taken, bedoeld in [artikel 7.1.3.2][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0033715
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.3.1.e
    text: |-
      voorzieningen waarmee bij twee of meer meldingen van jeugdigen met eenzelfde in de basisregistratie personen
      opgenomen ouder, een signaal wordt gezonden naar de meldingsbevoegden die de betrokken jeugdige hebben gemeld en
      naar degene die belast is met de taken, bedoeld in [artikel 7.1.3.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.3.1.f
    text: |-
      een logboek dat registreert welke meldingsbevoegde wanneer een jeugdige aan de verwijsindex heeft gemeld, hem
      daaruit heeft verwijderd of een signaal heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.g
    text: |-
      voorzieningen waarmee verhuisbewegingen van aan de verwijsindex gemelde jeugdigen worden geregistreerd en
      doorgegeven aan de meldingsbevoegde die de jeugdige heeft gemeld en, indien de jeugdige naar een andere gemeente is
      verhuisd, aan de regievoerder van de gemeente waarnaar de jeugdige is verhuisd;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.h
    text: 'voorzieningen waarmee ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.h.1°
    text: het toezicht op de naleving inzage kan worden gegeven in de verwijsindex;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.h.2°
    text: |-
      beleidsinformatie en het toezicht op de naleving rapportages over het gebruik van de verwijsindex kunnen worden
      samengesteld en opgevraagd, bestaande uit niet tot specifieke jeugdigen of specifieke meldingsbevoegden herleidbare
      gegevens, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.i
    text: |-
      voorzieningen waarmee aan de jeugdige bij de toepassing van de
      [artikelen 35 tot en met 40 van de Wet bescherming persoonsgegevens][ref1] inzage kan worden verleend in een hem
      betreffende melding in de verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
  - number: 7.1.2.3.2
    text: |-
      Bij de verwijsindex is een historisch meldingenarchief gevoegd waarin uit de verwijsindex verwijderde meldingen
      worden opgenomen. Het historisch meldingenarchief heeft tot doel de verdere verlening van hulp, zorg of bijsturing
      ten behoeve van een jeugdige te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.2.3.3
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een effectief gebruik van de verwijsindex noodzakelijke
      andere voorzieningen worden aangewezen die aan de verwijsindex worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.2.3
  - number: 7.1.3.1.1
    text: |-
      Het college bevordert het gebruik van de verwijsindex. Daartoe maakt het college afspraken met de binnen zijn
      gemeente werkzame instanties en functionarissen, voor zover zij behoren tot een categorie die is aangewezen bij de
      algemene maatregel van bestuur, bedoeld in [artikel 7.1.1.2][ref1]. Het college organiseert voorts de aansluiting
      van die instanties en functionarissen op de verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.3.1.2
    text: |-
      De afspraken betreffen in elk geval de wijze waarop het college samenwerkt met die instanties en functionarissen,
      en die instanties en functionarissen onderling samenwerken bij het verlenen van hulp, zorg of bijsturing ten
      behoeve van jeugdigen, alsmede het beheer en de nakoming van die afspraken. De afspraken worden schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.3.1
  - number: 7.1.3.2.1
    text: |-
      Het college draagt er zorg voor dat wordt nagegaan of de meldingsbevoegden die een jeugdige aan de verwijsindex
      hebben gemeld en vervolgens daaruit een signaal hebben ontvangen, met elkaar contact hebben opgenomen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.3.2
  - number: 7.1.3.2.2
    text: |-
      Degene die belast is met de taken, bedoeld in het eerste lid, heeft uitsluitend ten behoeve daarvan toegang tot
      de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.3.2
  - number: 7.1.3.3.1
    text: |-
      Instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onderdeel a,][ref1] kunnen met het oog op een effectief
      gebruik van de verwijsindex een binnen hun instantie werkzame coördinator aanwijzen. De coördinator heeft als taak
      de contactgegevens van de meldingsbevoegden te beheren en zo nodig aan te passen en de signalen uit de verwijsindex
      te beheren.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.3.3.2
    text: Een coördinator heeft uitsluitend ten behoeve van de taak, bedoeld in het eerste lid, toegang tot de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.3.3
  - number: 7.1.4.1
    text: |-
      Een meldingsbevoegde kan zonder toestemming van de jeugdige of zijn wettelijk vertegenwoordiger en zo nodig met
      doorbreking van de op grond van zijn ambt of beroep geldende plicht tot geheimhouding, een jeugdige melden aan
      de verwijsindex indien hij een redelijk vermoeden heeft dat de jeugdige door een of meer van de hierna genoemde
      risico’s in de noodzakelijke condities voor een gezonde en veilige ontwikkeling naar volwassenheid daadwerkelijk
      wordt bedreigd:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.a
    text: |-
      de jeugdige staat bloot aan geestelijk, lichamelijk of seksueel geweld, enige andere vernederende behandeling,
      of verwaarlozing;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.b
    text: |-
      de jeugdige heeft meer of andere dan bij zijn leeftijd normaliter voorkomende psychische problemen, waaronder
      verslaving aan alcohol, drugs of kansspelen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.c
    text: de jeugdige heeft meer dan bij zijn leeftijd normaliter voorkomende ernstige opgroei- of opvoedingsproblemen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.d
    text: de jeugdige is minderjarig en moeder of zwanger;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.e
    text: |-
      de jeugdige verzuimt veelvuldig van school of andere onderwijsinstelling, dan wel verlaat die voortijdig of dreigt
      die voortijdig te verlaten;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.f
    text: de jeugdige is niet gemotiveerd om door legale arbeid in zijn levensonderhoud te voorzien;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.g
    text: de jeugdige heeft meer of andere dan bij zijn leeftijd normaliter voorkomende financiële problemen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.h
    text: de jeugdige heeft geen vaste woon- of verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.i
    text: de jeugdige is een gevaar voor anderen door lichamelijk of geestelijk geweld of ander intimiderend gedrag;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.j
    text: de jeugdige laat zich in met activiteiten die strafbaar zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.k
    text: |-
      de ouders of andere verzorgers van de jeugdige schieten ernstig tekort in de verzorging of opvoeding van de
      jeugdige, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.1.l
    text: de jeugdige staat bloot aan risico’s die in bepaalde etnische groepen onevenredig vaak voorkomen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.1
  - number: 7.1.4.2.1
    text: |-
      Een melding wordt in de verwijsindex gekoppeld aan het burgerservicenummer van de jeugdige, met als doel te
      waarborgen dat de melding betrekking heeft op die jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.2
  - number: 7.1.4.2.2
    text: |-
      Indien de melding afkomstig is van een meldingsbevoegde die op grond van een wettelijke bepaling reeds bevoegd is
      het burgerservicenummer van de jeugdige te gebruiken, biedt hij de melding met dat nummer aan de verwijsindex aan.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.2
  - number: 7.1.4.2.3
    text: |-
      In andere gevallen biedt de meldingsbevoegde de melding aan de verwijsindex aan zonder dat hij kennis kan nemen van
      het burgerservicenummer van de betrokken jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.2
  - number: 7.1.4.2.4
    text: |-
      Bij algemene maatregel van bestuur worden een persoonsidentificerend nummer en andere identificerende gegevens
      aangewezen die gebruikt worden om jeugdigen die niet beschikken over een burgerservicenummer te melden aan de
      verwijsindex. Bij of krachtens de maatregel worden voorts regels gesteld over de wijze waarop deze gegevens worden
      aangeboden aan de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.2
  - number: 7.1.4.3.1
    text: |-
      Naast het burgerservicenummer van de jeugdige worden in de verwijsindex bij een melding uitsluitend de volgende
      gegevens opgeslagen:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.3
  - number: 7.1.4.3.1.a
    text: |-
      de identificatiegegevens en contactgegevens van de meldingsbevoegde die de melding doet, en, in voorkomend geval,
      van de coördinator, bedoeld in [artikel 7.1.3.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.4.3.1.b
    text: de datum en het tijdstip van de melding, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.3
  - number: 7.1.4.3.1.c
    text: |-
      de datum waarop de melding op grond van [artikel 7.1.4.5, tweede lid, onderdeel a][ref1], uit de verwijsindex zal
      worden verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.4.3.2
    text: |-
      Een signaal uit de verwijsindex bevat uitsluitend de gegevens, genoemd in het eerste lid, onderdeel a, en, indien
      het signaal voortvloeit uit twee of meer meldingen die niet dezelfde jeugdige betreffen, dit gegeven.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.3
  - number: 7.1.4.4
    text: |-
      Ten behoeve van de doeleinden, bedoeld in [artikel 7.1.2.1][ref1], worden persoonsgegevens
      betreffende de gezondheid, alsmede strafrechtelijke persoonsgegevens als bedoeld in
      [artikel 16 van de Wet bescherming persoonsgegevens][ref2] verwerkt. De verwerking van deze gegevens vindt
      uitsluitend plaats teneinde meldingsbevoegden uit de domeinen jeugdgezondheidszorg, gezondheidszorg en politie en
      justitie in staat te stellen een jeugdige aan de verwijsindex te melden alsmede andere meldingsbevoegden in staat
      te stellen van deze melding kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 7.1.4.5.1
    text: 'Een meldingsbevoegde verwijdert een door hem gedane melding uit de verwijsindex indien naar zijn oordeel:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.5
  - number: 7.1.4.5.1.a
    text: die melding niet terecht is gedaan;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.5
  - number: 7.1.4.5.1.b
    text: het eerder gesignaleerde risico niet meer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.5
  - number: 7.1.4.5.2
    text: 'Een melding wordt voorts in elk geval uit de verwijsindex verwijderd:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.5
  - number: 7.1.4.5.2.a
    text: ten hoogste twee jaar nadat zij is gedaan;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.5
  - number: 7.1.4.5.2.b
    text: met ingang van de dag dat de jeugdige de leeftijd van drieëntwintig jaar bereikt, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.5
  - number: 7.1.4.5.2.c
    text: zo spoedig mogelijk na het overlijden van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.5
  - number: 7.1.4.6.1
    text: |-
      Een overeenkomstig [artikel 7.1.4.5, eerste lid, onderdeel b, en tweede lid, onderdeel a][ref1], uit de
      verwijsindex verwijderde melding wordt gedurende vijf jaren opgenomen in een historisch meldingenarchief, met
      dien verstande dat die opname wordt vernietigd met ingang van de dag dat de jeugdige de leeftijd van drieëntwintig
      jaar bereikt of zo spoedig mogelijk na het overlijden van de jeugdige. Meldingen die uit de verwijsindex zijn
      verwijderd met toepassing van artikel 7.1.4.5, eerste lid, onderdeel a, of het tweede lid, onderdelen b of c,
      of de [artikelen 36][ref2] of [40 van de Wet bescherming persoonsgegevens][ref3], worden niet in het historisch
      meldingenarchief opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel40
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '40'
  - number: 7.1.4.6.2
    text: |-
      Van een in het historisch meldingenarchief opgenomen melding wordt uitsluitend en eenmalig een signaal aangeboden
      aan een meldingsbevoegde op het moment dat hij een jeugdige aan de verwijsindex meldt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.6
  - number: 7.1.4.6.3
    text: |-
      De [artikelen 7.1.2.2][ref1] en [7.1.2.3, eerste lid, aanhef, juncto onderdelen h en i][ref2], zijn van
      overeenkomstige toepassing op het historisch meldingenarchief. Van het historisch meldingenarchief maakt een
      voorziening deel uit waarmee een jeugdige uit het historisch meldingenarchief kan worden verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.4.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.5.1.1
    text: |-
      Indien een melding betrekking heeft op een jeugdige die jonger is dan twaalf jaar wordt de mededeling, bedoeld in
      [artikel 34 van de Wet bescherming persoonsgegevens][ref1] gedaan aan zijn wettelijk vertegenwoordiger. Indien de
      jeugdige de leeftijd van twaalf, maar nog niet die van zestien jaar heeft bereikt, wordt de mededeling zowel aan de
      jeugdige als zijn wettelijk vertegenwoordiger gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel34
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '34'
  - number: 7.1.5.1.2
    text: |-
      Indien de jeugdige jonger is dan twaalf jaar wordt een verzoek als bedoeld in de [artikelen 35][ref1]
      of [36 van de Wet bescherming persoonsgegevens][ref2] of een aantekening van verzet als bedoeld in
      [artikel 40 van die wet][ref3] gedaan door zijn wettelijk vertegenwoordiger. Indien de jeugdige de leeftijd van
      twaalf, maar nog niet die van zestien jaar heeft bereikt, wordt het verzoek of de aantekening van verzet gedaan
      door de jeugdige en zijn wettelijk vertegenwoordiger gezamenlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel40
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.5.1
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '40'
  - number: 7.1.5.2.1
    text: |-
      Een meldingsbevoegde die een jeugdige aan de verwijsindex heeft gemeld, brengt aan het college een
      advies uit over een door die jeugdige aan hem gedaan verzoek als bedoeld in de [artikelen 35][ref1] of
      [36 van de Wet bescherming persoonsgegevens][ref2], of over een bij hem aangetekend verzet als bedoeld in
      [artikel 40 van die wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel40
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.5.2
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '35'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '36'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '40'
  - number: 7.1.5.2.2
    text: |-
      De meldingsbevoegde verstrekt het college overigens alle inlichtingen die nodig zijn met
      het oog op de uitvoering door het college van de in het eerste lid genoemde artikelen en van
      [artikel 43 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel43
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.1.5.2
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '43'
  - number: 7.2.1.1
    text: |-
      De gecertificeerde instelling, de jeugdhulpaanbieder, de raad voor de kinderbescherming en het college gebruiken
      het burgerservicenummer van een jeugdige met het doel te waarborgen dat de in het kader van de uitvoering van deze
      wet en de daarop berustende bepalingen te verwerken persoonsgegevens op die jeugdige betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.1
  - number: 7.2.1.2
    text: |-
      Het eerste lid is niet van toepassing op een gecertificeerde instelling, voor zover deze ter uitvoering van de
      taken in het kader van jeugdreclassering, persoonsgegevens uitwisselt van verdachten en veroordeelden ten behoeve
      van de toepassing van het strafrecht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.1
  - number: 7.2.2
    text: |-
      De gecertificeerde instelling, de jeugdhulpaanbieder, de raad voor de kinderbescherming en het college stellen het
      burgerservicenummer van een jeugdige vast wanneer zij voor de eerste maal contact met de jeugdige hebben in het
      kader van de uitvoering van deze wet en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.2
  - number: 7.2.3.1
    text: |-
      Teneinde het burgerservicenummer van de jeugdige vast te stellen worden het nummerregister en de voorzieningen,
      bedoeld in [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref1]
      geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.3.2
    text: 'De raadpleging, bedoeld in het eerste lid, kan achterwege gelaten worden, indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.3
  - number: 7.2.3.2.a
    text: |-
      het burgerservicenummer is verstrekt door een andere gebruiker als bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref1] die bij of krachtens wet gehouden is het
      burgerservicenummer van de jeugdige vast te stellen aan de hand van het nummerregister en de voorzieningen, bedoeld
      in [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.3.2.b
    text: het burgerservicenummer is verkregen uit de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.3
  - number: 7.2.4
    text: 'Indien aan een jeugdige geen burgerservicenummer is toegekend:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.4
  - number: 7.2.4.a
    text: |-
      nemen gecertificeerde instellingen, jeugdhulpaanbieders, de raad voor de kinderbescherming en het college in ieder
      geval de volgende gegevens van de jeugdige in hun administratie op:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.4
  - number: 7.2.4.a.1°
    text: achternaam;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.4
  - number: 7.2.4.a.2°
    text: voornamen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.4
  - number: 7.2.4.a.3°
    text: geboortedatum, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.4
  - number: 7.2.4.a.4°
    text: postcode en huisnummer van het woonadres, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.4
  - number: 7.2.4.b
    text: |-
      vermelden gecertificeerde instellingen, jeugdhulpaanbieders, de raad voor de kinderbescherming en het college de
      gegevens, bedoeld in onderdeel a, bij het verstrekken van persoonsgegevens met betrekking tot de uitvoering van hun
      taken en de verlening van jeugdhulp.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.4
  - number: 7.2.5
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport wordt bepaald aan welke beveiligingseisen de
      gegevensverwerking, bedoeld in de [artikelen 7.2.1][ref1] en [7.2.4][ref2] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.6.1
    text: |-
      Gecertificeerde instellingen, jeugdhulpaanbieders, de raad voor de kinderbescherming en het college kunnen van de
      bij de [artikelen 7.2.1 tot en met 7.2.4][ref1] gestelde verplichtingen afwijken voor zolang dit noodzakelijk is
      met betrekking tot spoedeisende gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.6.2
    text: |-
      Indien op grond van het eerste lid wordt afgeweken van bij de [artikelen 7.2.1 tot en met 7.2.4][ref1] gestelde
      verplichtingen is het bepaalde krachtens [artikel 7.2.5][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.7
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport of een door hem aangewezen instelling
      beheert een autorisatielijst van jeugdhulpaanbieders, waarin zij op verzoek worden opgenomen
      teneinde gebruik te kunnen maken van het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.8.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
  - number: 7.2.8.1.a
    text: |-
      het opnemen, wijzigen, en verwijderen van gegevens in, onderscheidenlijk uit, de in [artikel 7.2.7][ref1] bedoelde
      autorisatielijst van jeugdhulpaanbieders;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.8.1.b
    text: het beheer van de autorisatielijst, in ieder geval wat betreft de beveiliging van persoonsgegevens, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
  - number: 7.2.8.1.c
    text: het toezicht op het functioneren van de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
  - number: 7.2.8.2
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, kunnen bijdragen van jeugdhulpaanbieders worden verlangd in de kosten
      van de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
  - number: 7.2.8.3
    text: |-
      De beheerder van de autorisatielijst, bedoeld in [artikel 7.2.7][ref1], verschaft aan een in de autorisatielijst
      ingeschreven jeugdhulpaanbieder op diens verzoek een middel waarmee deze ten behoeve van de raadpleging,
      bedoeld in [artikel 7.2.3][ref2], toegang kan krijgen tot het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.8.4
    text: De beheerder kan voor het middel een vergoeding verlangen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
  - number: 7.2.8.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de kenmerken, de aanvraag, de
      procedure, de verstrekking, het beheer, de beveiliging, het gebruik en de intrekking van het middel bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.8
  - number: 7.2.9
    text: |-
      Ten behoeve van de verantwoordelijkheid, bedoeld in de [artikelen 2.1][ref1] en [2.4, tweede lid][ref2], kan Onze
      Minister van Veiligheid en Justitie aan een door het college aangewezen ambtenaar of aan een door het college
      aangewezen en onder zijn verantwoordelijkheid werkzame functionaris het burgerservicenummer verstrekken van een
      jeugdige ten aanzien van wie in het kader van een strafrechtelijke beslissing is bepaald dat hij in aanmerking komt
      voor een vorm van jeugdhulp of jeugdreclassering.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.3.1.1
    text: |-
      Hetgeen in deze paragraaf, met uitzondering van de [artikelen 7.3.4][ref1], [7.3.5][ref2], [7.3.6][ref3] en
      [7.3.16][ref4], is bepaald ten aanzien van de jeugdhulpverlener is van overeenkomstige toepassing op de medewerker
      van de gecertificeerde instelling, met dien verstande dat voor «jeugdhulp» of «verlening van jeugdhulp» wordt
      gelezen «uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering».


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.1.2
    text: |-
      In deze paragraaf wordt verstaan onder betrokkene: persoon aan wie rechtstreeks jeugdhulp wordt verleend, ten
      aanzien van wie de verlening van jeugdhulp wordt voorgesteld of ten aanzien van wie een kinderbeschermingsmaatregel
      of jeugdreclassering uitgevoerd wordt of de uitvoering daarvan wordt voorgesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.1
  - number: 7.3.1.3
    text: |-
      Voor zover sprake is van een geneeskundige behandeling als bedoeld in
      [artikel 446 van Boek 7 van het Burgerlijk Wetboek][ref1], is deze paragraaf niet van toepassing, behoudens de
      [artikelen 7.3.11, vierde en vijfde lid][ref2], en [7.3.17][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel446
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '446'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.2.1
    text: |-
      De jeugdhulpverlener licht de betrokkene op duidelijke wijze, en desgevraagd schriftelijk in over het voorgenomen
      onderzoek, de voorgestelde jeugdhulp, de ontwikkelingen omtrent de jeugdhulp en over de geconstateerde opgroei- en
      opvoedingsproblemen, psychische problemen en stoornissen. De jeugdhulpverlener licht een jeugdige die de leeftijd
      van twaalf jaar nog niet heeft bereikt, op zodanige wijze in als past bij zijn bevattingsvermogen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.2
  - number: 7.3.2.2
    text: |-
      Bij het uitvoeren van de in het eerste lid neergelegde verplichting laat de jeugdhulpverlener zich leiden door
      hetgeen de betrokkene redelijkerwijze dient te weten ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.2
  - number: 7.3.2.2.a
    text: de aard en het doel van de jeugdhulp die hij noodzakelijk acht en van de uit te voeren verrichtingen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.2
  - number: 7.3.2.2.b
    text: de te verwachten gevolgen en risico’s daarvan voor de betrokkene;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.2
  - number: 7.3.2.2.c
    text: andere methoden van jeugdhulp die in aanmerking komen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.2
  - number: 7.3.2.2.d
    text: |-
      de staat van en de vooruitzichten met betrekking tot de geconstateerde opgroei- en opvoedingsproblemen, psychische
      problemen en stoornissen in relatie tot de te verlenen jeugdhulp.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.2
  - number: 7.3.2.3
    text: |-
      De hulpverlener mag de betrokkene bedoelde inlichtingen slechts onthouden voor zover het verstrekken ervan
      kennelijk ernstig nadeel voor de betrokkene zou opleveren. Indien het belang van de betrokkene dit vereist,
      dient de jeugdhulpverlener de desbetreffende inlichtingen aan een ander te verstrekken. De inlichtingen worden de
      betrokkene alsnog gegeven, zodra bedoeld nadeel niet meer te duchten is. De jeugdhulpverlener maakt geen gebruik
      van zijn in de eerste volzin bedoelde bevoegdheid dan nadat hij daarover een andere jeugdhulpverlener heeft
      geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.2
  - number: 7.3.3
    text: |-
      Indien de betrokkene te kennen heeft gegeven geen inlichtingen te willen ontvangen, blijft het verstrekken daarvan
      achterwege, behoudens voor zover het belang dat de betrokkene daarbij heeft niet opweegt tegen het nadeel dat
      daaruit voor hemzelf of anderen kan voortvloeien.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.3
  - number: 7.3.4.1
    text: |-
      Voor het verlenen van jeugdhulp is de toestemming van de betrokkene vereist, tenzij het jeugdhulp
      betreft in het kader van een machtiging gesloten jeugdhulp, een spoedmachtiging gesloten jeugdhulp, een
      kinderbeschermingsmaatregel of jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.4
  - number: 7.3.4.2
    text: |-
      Indien de betrokkene minderjarig is en de leeftijd van twaalf maar nog niet die van zestien jaar heeft bereikt,
      is tevens de toestemming van de ouders die het gezag over hem uitoefenen of van zijn voogd vereist. De jeugdhulp
      kan evenwel zonder de toestemming van die ouders of de voogd worden verleend, indien zij kennelijk nodig is
      teneinde ernstig nadeel voor de betrokkene te voorkomen, alsmede indien de betrokkene ook na de weigering van de
      toestemming, de verrichting weloverwogen blijft wensen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.4
  - number: 7.3.4.3
    text: |-
      In het geval waarin een betrokkene van zestien jaar of ouder niet in staat kan worden geacht tot een redelijke
      waardering van zijn belangen ter zake, worden door de jeugdhulpverlener en een persoon als bedoeld in
      [artikel 7.3.15, tweede of derde lid][ref1], de kennelijke opvattingen van de betrokkene, geuit in schriftelijke
      vorm toen deze tot bedoelde redelijke waardering nog in staat was en inhoudende een weigering van toestemming als
      bedoeld in het eerste lid, opgevolgd. De jeugdhulpverlener kan hiervan afwijken indien hij daartoe gegronde redenen
      aanwezig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.5.1
    text: |-
      Een minderjarige die de leeftijd van zestien jaar heeft bereikt, is bekwaam tot het verlenen van toestemming voor
      de verlening van jeugdhulp ten behoeve van zichzelf, alsmede tot het verrichten van rechtshandelingen die daarmee
      onmiddellijk verband houden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.5
  - number: 7.3.5.2
    text: |-
      De minderjarige is aansprakelijk voor de daaruit voortvloeiende verbintenissen, onverminderd de verplichting van
      zijn ouders tot voorziening in de kosten van verzorging en opvoeding.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.5
  - number: 7.3.5.3
    text: |-
      In op die verlening van jeugdhulp betrekking hebbende aangelegenheden is de minderjarige bekwaam in en buiten
      rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.5
  - number: 7.3.6
    text: |-
      Op verzoek van de betrokkene legt de jeugdhulpverlener in ieder geval schriftelijk vast voor welke verrichtingen
      van ingrijpende aard deze toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.6
  - number: 7.3.7
    text: |-
      De betrokkene geeft de jeugdhulpverlener naar beste weten de inlichtingen en de medewerking die deze redelijkerwijs
      voor het verlenen van jeugdhulp behoeft.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.7
  - number: 7.3.8.1
    text: |-
      De jeugdhulpverlener richt een dossier in met betrekking tot de verlening van jeugdhulp. Hij houdt in het dossier
      aantekening van de gegevens omtrent de geconstateerde opgroei- en opvoedingsproblemen, psychische problemen en
      stoornissen en de te diens aanzien uitgevoerde verrichtingen en neemt andere stukken, bevattende zodanige gegevens,
      daarin op, een en ander voor zover dit voor een goede hulpverlening aan de betrokkene noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.8
  - number: 7.3.8.2
    text: |-
      De jeugdhulpverlener voegt desgevraagd een door de betrokkene afgegeven verklaring met betrekking tot de in het
      dossier opgenomen stukken aan het dossier toe.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.8
  - number: 7.3.8.3
    text: |-
      Onverminderd [artikel 7.3.9][ref1], bewaart de jeugdhulpverlener het dossier gedurende vijftien jaar, te rekenen
      vanaf het tijdstip van ontvangst of waarop zij door de jeugdhulpverlener is vervaardigd, of zoveel langer als
      redelijkerwijs uit de zorg van een goed jeugdhulpverlener voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.9.1
    text: |-
      De jeugdhulpverlener vernietigt het dossier, of delen daarvan, binnen drie maanden na een daartoe strekkend verzoek
      van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.9
  - number: 7.3.9.2
    text: |-
      Het eerste lid geldt niet voor zover het verzoek gegevens betreft waarvan redelijkerwijs aannemelijk is dat de
      bewaring van aanmerkelijk belang is voor een ander dan de betrokkene, alsmede voor zover het bepaalde bij of
      krachtens de wet zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.9
  - number: 7.3.10
    text: |-
      De jeugdhulpverlener verstrekt aan de betrokkene desgevraagd zo spoedig mogelijk inzage in en afschrift van het
      dossier, of delen daarvan. De verstrekking blijft achterwege voor zover dit noodzakelijk is in het belang van de
      bescherming van de persoonlijke levenssfeer van een ander. De jeugdhulpverlener kan voor de verstrekking van het
      afschrift een vergoeding verlangen overeenkomstig [artikel 39 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel39
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.10
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '39'
  - number: 7.3.11.1
    text: |-
      Onverminderd [artikel 7.3.2, derde lid, tweede volzin][ref1], draagt de jeugdhulpverlener zorg, dat aan anderen dan
      de betrokkene geen inlichtingen over de betrokkene dan wel inzage in of afschrift van het dossier worden verstrekt
      dan met toestemming van de betrokkene. Indien verstrekking plaatsvindt, geschiedt deze slechts voor zover daardoor
      de persoonlijke levenssfeer van een ander niet wordt geschaad. De verstrekking geschiedt zonder inachtneming van
      beperkingen, indien het bij of krachtens de wet bepaalde daartoe verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.11.2
    text: 'Onder anderen dan de betrokkene is niet begrepen:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.11
  - number: 7.3.11.2.a
    text: |-
      degene die rechtstreeks betrokken is bij de verlening van die jeugdhulp en degene die optreedt als vervanger
      van de jeugdhulpverlener, voor zover de verstrekking noodzakelijk is voor de door hen in dat kader te verrichten
      werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.11
  - number: 7.3.11.2.b
    text: |-
      degene wiens toestemming ter zake van de verlening van jeugdhulp op grond van de [artikelen 7.3.4][ref1] en
      [7.3.15][ref2] is vereist, alsmede, indien de toestemming van de personen bedoeld in artikel 7.3.4 niet is vereist,
      de personen bedoeld in artikel 7.3.4, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.11.3
    text: |-
      Indien de jeugdhulpverlener door inlichtingen over de betrokkene dan wel inzage in of afschrift van het dossier
      te verstrekken niet geacht kan worden de zorg van een goed jeugdhulpverlener in acht te nemen, laat hij zulks
      achterwege.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.11
  - number: 7.3.11.4
    text: |-
      Derden die beroepshalve beschikken over inlichtingen inzake feiten en omstandigheden die de persoon van een onder
      toezicht gestelde minderjarige, diens verzorging en opvoeding of de persoon van een ouder of voogd betreffen,
      welke inlichtingen noodzakelijk kunnen worden geacht voor de uitvoering van de ondertoezichtstelling, verstrekken
      de gecertificeerde instelling die de ondertoezichtstelling uitvoert, deze inlichtingen desgevraagd of kunnen
      deze inlichtingen uit eigen beweging aan de gecertificeerde instelling verstrekken, zonder toestemming van de
      betrokkenen en indien nodig met doorbreking van de plicht tot geheimhouding op grond van een wettelijk voorschrift
      of op grond van hun ambt of beroep.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.11
  - number: 7.3.11.5
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld omtrent de inhoud van het dossier, de wijze waarop
      de verwerking van gegevens door en de uitwisseling van gegevens tussen het college, de jeugdhulpaanbieders, de
      gecertificeerde instellingen en de raad voor de kinderbescherming plaatsvindt en de wijze waarop de verwerking en
      uitwisseling van gegevens als bedoeld in het vierde lid plaatsvinden. Daarbij kan worden bepaald welke maatregelen
      moeten worden getroffen om te waarborgen dat de uitwisseling van gegevens veilig en zorgvuldig plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.11
  - number: 7.3.12.1
    text: |-
      In afwijking van [artikel 7.3.11, eerste lid][ref1], kunnen zonder toestemming van de betrokkene ten behoeve van
      statistiek of wetenschappelijk onderzoek op het gebied van de volksgezondheid, opgroei- en opvoedingsproblemen,
      psychische problemen en stoornissen, kinderbescherming of jeugdreclassering aan een ander desgevraagd inlichtingen
      over de betrokkene of inzage in het dossier worden verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.12.1.a
    text: |-
      het vragen van toestemming in redelijkheid niet mogelijk is en met betrekking tot de uitvoering van het onderzoek
      is voorzien in zodanige waarborgen, dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt
      geschaad, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
  - number: 7.3.12.1.b
    text: |-
      het vragen van toestemming, gelet op de aard en het doel van het onderzoek, in redelijkheid niet kan worden
      verlangd en de gegevens in zodanige vorm worden verstrekt dat herleiding tot individuele natuurlijke personen
      redelijkerwijs wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
  - number: 7.3.12.2
    text: 'Verstrekking overeenkomstig het eerste lid is slechts mogelijk indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
  - number: 7.3.12.2.a
    text: het onderzoek een algemeen belang dient,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
  - number: 7.3.12.2.b
    text: het onderzoek niet zonder de desbetreffende gegevens kan worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
  - number: 7.3.12.2.c
    text: voor zover de betrokkene tegen een verstrekking niet uitdrukkelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
  - number: 7.3.12.3
    text: Bij een verstrekking overeenkomstig het eerste lid wordt daarvan aantekening gehouden in het dossier.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.12
  - number: 7.3.13.1
    text: |-
      De jeugdhulpverlener voert de verlening van jeugdhulp uit buiten de waarneming van anderen dan de betrokkene,
      tenzij de betrokkene ermee heeft ingestemd dat de verrichtingen kunnen worden waargenomen door anderen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.13
  - number: 7.3.13.2
    text: 'Onder anderen dan de betrokkene is niet begrepen:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.13
  - number: 7.3.13.2.a
    text: degene van wie beroepshalve de medewerking bij de verlening van die jeugdhulp noodzakelijk is, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.13
  - number: 7.3.13.2.b
    text: |-
      degene wiens toestemming terzake van de verlening van die jeugdhulp op grond van de [artikelen 7.3.4][ref1] en
      [7.3.15][ref2] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.13
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.13.3
    text: |-
      Indien de jeugdhulpverlener door verrichtingen te doen waarnemen niet geacht kan worden de zorg van een goed
      jeugdhulpverlener in acht te nemen, laat hij zulks niet toe.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.13
  - number: 7.3.14
    text: De jeugdhulpverlener kan wegens gewichtige redenen de verlening van jeugdhulp beëindigen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.14
  - number: 7.3.15.1
    text: |-
      De verplichtingen op grond van deze paragraaf voor de jeugdhulpverlener jegens de betrokkene, gelden, indien de
      betrokkene de leeftijd van twaalf jaar nog niet heeft bereikt, voor de jeugdhulpverlener jegens de ouders die het
      gezag over de betrokkene uitoefenen dan wel jegens zijn voogd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.15
  - number: 7.3.15.2
    text: |-
      Hetzelfde geldt indien de betrokkene de leeftijd van twaalf jaar heeft bereikt, maar niet in staat kan worden
      geacht tot een redelijke waardering van zijn belangen ter zake, tenzij zodanige betrokkene meerderjarig is en onder
      curatele staat of ten behoeve van hem het mentorschap is ingesteld, in welke gevallen de verplichtingen gelden
      jegens de curator of de mentor.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.15
  - number: 7.3.15.3
    text: |-
      Indien een meerderjarige betrokkene die niet in staat kan worden geacht tot een redelijke waardering van
      zijn belangen ter zake, niet onder curatele staat of ten behoeve van hem niet het mentorschap is ingesteld,
      gelden de verplichtingen die voor de jeugdhulpverlener uit deze afdeling jegens de betrokkene gelden, voor de
      jeugdhulpverlener jegens de persoon die daartoe door de betrokkene schriftelijk is gemachtigd in zijn plaats op te
      treden. Ontbreekt zodanige persoon, of treedt deze niet op, dan gelden de verplichtingen jegens de echtgenoot, de
      geregistreerde partner of andere levensgezel van de betrokkene, tenzij deze persoon dat niet wenst, dan wel, indien
      ook zodanige persoon ontbreekt, jegens een ouder, kind, broer of zus van de betrokkene, tenzij deze persoon dat
      niet wenst.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.15
  - number: 7.3.15.4
    text: |-
      De verplichtingen voor de jeugdhulpverlener jegens de in het eerste en tweede lid bedoelde wettelijke
      vertegenwoordigers van de betrokkene of de in het derde lid bedoelde personen zijn niet van toepassing indien deze
      niet verenigbaar zijn met de zorg van een goed jeugdhulpverlener.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.15
  - number: 7.3.15.5
    text: |-
      De persoon jegens wie de verplichtingen op grond van deze paragraaf voor de jeugdhulpverlener gelden krachtens het
      tweede en derde lid, betracht de zorg van een goed vertegenwoordiger. Deze persoon is gehouden de betrokkene zoveel
      mogelijk bij de vervulling van zijn taak te betrekken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.15
  - number: 7.3.15.6
    text: |-
      Verzet de betrokkene zich tegen een verrichting van ingrijpende aard waarvoor een persoon als bedoeld in het tweede
      of derde lid toestemming heeft gegeven, dan kan de verrichting slechts worden uitgevoerd indien zij kennelijk nodig
      is teneinde ernstig nadeel voor de betrokkene te voorkomen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.15
  - number: 7.3.16.1
    text: |-
      Indien op grond van [artikel 7.3.15][ref1] voor het uitvoeren van een verrichting uitsluitend de toestemming van
      een daar bedoelde persoon in plaats van die van de betrokkene vereist is, dan kan tot de verrichting zonder die
      toestemming worden overgegaan indien de tijd voor het vragen van die toestemming ontbreekt aangezien onverwijlde
      uitvoering van de verrichting kennelijk nodig is teneinde ernstig nadeel voor de betrokkene te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.16
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.16.2
    text: |-
      Een volgens de [artikelen 7.3.4][ref1] en [7.3.15][ref2] vereiste toestemming mag worden verondersteld te zijn
      gegeven, indien de desbetreffende verrichting niet van ingrijpende aard is.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.16
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.17
    text: |-
      Een beslissing van een jeugdhulpverlener genomen op grond van deze paragraaf, een beslissing
      op een verzoek als bedoeld in de [artikelen 30, derde lid][ref1], [35][ref2], [36][ref3] of
      [38, tweede lid, van de Wet bescherming persoonsgegevens][ref4], alsmede een beslissing naar aanleiding van de
      aantekening van verzet als bedoeld in de [artikel 40][ref5] of [41 van die wet][ref6] gelden, ook voor zover
      de jeugdhulpverlener, de beslissing heeft genomen als of namens een bestuursorgaan, voor de toepassing van
      [hoofdstuk 8 van die wet][ref7], als een beslissing genomen door een ander dan een bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011468#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0011468#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0011468#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0011468#Artikel40
      [ref6]: https://wetten.overheid.nl/BWBR0011468#Artikel41
      [ref7]: https://wetten.overheid.nl/BWBR0011468#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.3.17
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '30'
      - id: ref2
        bwb_id: BWBR0011468
        artikel: '35'
      - id: ref3
        bwb_id: BWBR0011468
        artikel: '36'
      - id: ref4
        bwb_id: BWBR0011468
        artikel: '38'
      - id: ref5
