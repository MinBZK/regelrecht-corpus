  - number: 9.5.1
    text: |-
      Onze Ministers zijn beiden bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de
      [artikelen 8.3.1][ref1] en [8.3.2][ref2] en van een krachtens [artikel 9.3][ref3] gegeven aanwijzing of bevel.


