        artikel: 9b
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 10.1.5
    text: |-
      Het college is er verantwoordelijk voor dat de jeugdige in situaties als bedoeld in het derde en vierde lid, de
      jeugdhulp die reeds is ingezet voor inwerkingtreding van deze wet, na inwerkingtreding van deze wet kan voortzetten
      bij dezelfde aanbieder, indien dit redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.1
  - number: 10.2.1
    text: |-
      In dit artikel wordt verstaan onder: - *geestelijke gezondheidszorg:* 1°. geneeskundige zorg, verblijf, verzorging
      en verpleging als bedoeld bij of krachtens [artikel 11, derde lid, van de Zorgverzekeringswet][ref1], die een
      persoon nodig heeft in verband met een psychiatrische stoornis of beperking; 2°. dyslexiezorg als bedoeld bij of
      krachtens [artikel 11, derde lid, van de Zorgverzekeringswet][ref2];
        - *jeugdige:* persoon die de leeftijd van achttien jaar nog niet heeft bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 10.2.2
    text: |-
      De prestaties, bedoeld in [artikel 11, eerste lid, van de Zorgverzekeringswet][ref1] waarop een verzekerde jegens
      zijn zorgverzekeraar recht op heeft omvatten niet geestelijke gezondheidszorg aan jeugdigen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 10.2.3
    text: |-
      De rechten en verplichtingen die op het tijdstip van de inwerkingtreding van deze wet gelden met
      betrekking tot geestelijke gezondheidszorg, al dan niet met verblijf, waarvoor een indicatiebesluit
      op grond van [artikel 9b, vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] of
      [artikel 14, derde lid, van de Zorgverzekeringswet][ref2] is afgegeven voor de inwerkingtreding van
      deze wet, blijven gelden gedurende de looptijd van het indicatiebesluit, doch ten hoogste tot een jaar
      na de inwerkingtreding van deze wet, met dien verstande dat het college van de gemeente waarbinnen de
      jeugdige zijn woonplaats heeft, in de plaats treedt van de zorgverzekeraar van de jeugdige, bedoeld in
      [artikel 1, eerste lid, onder b, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.2
    references:
