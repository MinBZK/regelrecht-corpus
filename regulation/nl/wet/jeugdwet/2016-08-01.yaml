        hoofdstuk: '11'
  - number: 12.3a.2
    text: |-
      Voor zover de archiefbescheiden, bedoeld in het eerste lid, zorg betreffen waarvoor op de datum van
      inwerkingtreding van [artikel 11.7][ref1] een indicatiebesluit is afgegeven, is het indicatieorgaan,
      bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref2], zorgdrager als bedoeld
      in [artikel 1 van de Archiefwet 1995][ref3] voor zover de archiefbescheiden niet overeenkomstig de
      [Archiefwet 1995][ref4] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref3
        bwb_id: BWBR0007376
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0007376
  - number: 12.3a.3
    text: |-
      Het indicatieorgaan, bedoeld in het tweede lid, draagt na ontvangst van een daartoe strekkende kennisgeving door
      het college van de gemeente waar de jeugdige zijn woonplaats heeft, de archiefbescheiden binnen vier weken over aan
      het college, voor rekening en risico van dat college, indien het zorg betreft waarvoor dat college is gehouden een
      voorziening op grond van deze wet te treffen en deze bescheiden daartoe noodzakelijk zijn, teneinde dit college in
      de gelegenheid te stellen deze te kopiëren. Het college geeft de archiefbescheiden binnen vier weken na ontvangst
      terug.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.3a
  - number: 12.4.1
    text: |-
      Het college en de gemeenteraad bereiden zich tijdig en adequaat voor op hetgeen waarvoor zij verantwoordelijk zijn
      vanaf het moment dat de bepalingen van deze wet in werking treden, en waarborgen daarbij in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: 12.4.1.a
    text: |-
      de continuïteit van de verlening van jeugdhulp, de uitvoering van kinderbeschermingsmaatregelen en
      jeugdreclassering;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: 12.4.1.b
    text: |-
      de infrastructuur die noodzakelijk is om jeugdigen en ouders de continuïteit, bedoeld in onderdeel a, te kunnen
      bieden;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: 12.4.1.c
    text: een beperking van de frictiekosten, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: 12.4.1.d
    text: het functioneren van advies- en meldpunten voor huiselijk geweld en kindermishandeling.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: 12.4.2
    text: |-
      De gemeenteraad stelt het beleidsplan, bedoeld in [artikel 2.2][ref1], en de verordening, bedoeld in
      [artikel 2.9][ref2], vast voor 1 november van het kalenderjaar waarin dit artikel in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 12.4.3
    text: |-
      Ten behoeve van de uitvoering van het eerste lid en van [artikel 2.6, eerste lid, onder a][ref1], sluiten de
      colleges ten behoeve van het jaar 2015 met door Onze Ministers aan te wijzen organisaties die een cruciale functie
      op het gebied van jeugdhulp vervullen en die voor de continuïteit van hun te leveren voorzieningen afhankelijk
      zijn van een groot aantal gemeenten, tijdig doch in ieder geval voor 1 november 2014 overeenkomsten waarin
      ter waarborging van de continuïteit van de verlening van jeugdhulp en het behoud van de daarvoor noodzakelijke
      infrastructuur afspraken zijn gemaakt over:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
