  - number: 10.2.5
    text: |-
      Het college is er verantwoordelijk voor dat de jeugdige in situaties als bedoeld in het derde en vierde lid, de
      jeugdhulp die reeds is ingezet voor inwerkingtreding van deze wet, na inwerkingtreding van deze wet kan voortzetten
      bij dezelfde aanbieder, indien dit redelijkerwijs mogelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.2
  - number: 10.2a.1
    text: |-
      In dit artikel wordt verstaan onder: - *jeugdige:* een buiten Nederland woonachtige persoon die de leeftijd van
      achttien jaar nog niet heeft bereikt en die hetzij op de dag voorafgaande aan de inwerkingtreding van deze wet op
      grond van [artikel 5, eerste lid, onder b, dan wel vierde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      verzekerd is en op die dag aanspraak heeft op een vergoeding ter zake van de kosten van zorg waarop op die dag
      aanspraak bestond op grond van [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref2], hetzij bij het
      Zorginstituut staat geregistreerd als een in het buitenland wonend persoon die met toepassing van een Verordening
      van de Raad van de Europese Gemeenschappen dan wel toepassing van zodanige verordening krachtens de overeenkomst
      betreffende de Europese Economische Ruimte of een verdrag inzake sociale zekerheid in geval van behoefte aan zorg
      recht heeft op zorg of vergoeding van de kosten daarvan, zoals voorzien in de wetgeving over de verzekering voor
      zorg van hun woonland;
        - *zorg:* zorg als bedoeld in de [artikelen 10.1][ref3] en [10.2][ref4] waarvan de aanspraak op grond van de
      [Algemene Wet Bijzondere Ziektekosten][ref5] of de [Zorgverzekeringswet][ref6] ten gevolge van de inwerkingtreding
      van [artikel 11.7][ref7] wet komt te vervallen en die na inwerkingtreding van artikel 11.7 van deze wet als
      jeugdhulp kan worden aangemerkt;
        - *Zorginstituut:* Zorginstituut Nederland, bedoeld in [artikel 58 van de Zorgverzekeringswet][ref8].


