        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9.6.4
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die een
      strafbaar feit pleegt als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.6
  - number: 9.6.5
    text: Een strafbaar feit als bedoeld in het derde lid is een overtreding.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.6
  - number: 10.1.1
    text: |-
      In dit artikel wordt verstaan onder: - *begeleiding:* het ondersteunen bij of oefenen met vaardigheden of
      handelingen en het aanbrengen van structuur of het voeren van regie, of het overnemen van toezicht, gericht op
      bevordering, behoud of compensatie van de zelfredzaamheid en strekkende tot voorkoming van opname in een instelling
      of verwaarlozing van een persoon met een somatische, psychogeriatrische of psychiatrische aandoening of beperking,
      of een verstandelijke, lichamelijke of zintuiglijke handicap die matige of zware beperkingen heeft op het terrein
      van de sociale redzaamheid, het bewegen en verplaatsen, het psychisch functioneren, het geheugen en de oriëntatie,
      of die matig of zwaar probleemgedrag vertoont;
        - *jeugdige:* persoon die de leeftijd van achttien jaar nog niet heeft bereikt;
        - *kortdurend verblijf:* verblijf in een instelling gedurende maximaal drie etmalen per week, gepaard gaande
      met persoonlijke verzorging, verpleging of begeleiding voor een persoon met een somatische, psychogeriatrische
      of psychiatrische aandoening of beperking, of een verstandelijke, lichamelijke of zintuiglijke handicap, die
      aangewezen is op permanent toezicht, indien dat noodzakelijk is ter ontlasting van de persoon die hem gebruikelijke
      zorg of mantelzorg levert;
        - *persoonlijke verzorging:* het ondersteunen bij of het overnemen van activiteiten op het gebied van de
      persoonlijke verzorging in verband met een somatische, psychogeriatrische of psychiatrische aandoening of
      beperking, of een verstandelijke, lichamelijke of zintuiglijke handicap, gericht op het opheffen van een tekort
      aan zelfredzaamheid;
        - *psychiatrische stoornis of beperking:* psychiatrische stoornis of beperking als bedoeld bij of krachtens
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref1];
        - *verstandelijke handicap:* verstandelijke handicap als bedoeld bij of krachtens
      [artikel 6 van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 10.1.2
    text: |-
      De aanspraken op zorg, bedoeld in [artikel 6, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref1]
      omvatten niet zorg aan jeugdigen in verband met hun verstandelijke handicap of hun psychiatrische stoornis of
      beperking, alsmede niet zorg inhoudende begeleiding, persoonlijke verzorging en kortdurend verblijf van jeugdigen.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '6'
  - number: 10.1.3
    text: |-
      De rechten en verplichtingen die op het tijdstip van de inwerkingtreding van deze wet gelden met betrekking tot
      zorg waarop een jeugdige is aangewezen in verband met zijn verstandelijke handicap of psychiatrische stoornis
      of beperking en met betrekking tot zorg, inhoudende begeleiding, persoonlijke verzorging of kortdurend verblijf,
      waarvoor op grond van de [Algemene Wet Bijzondere Ziektekosten][ref1] een indicatiebesluit is afgegeven voor de
      inwerkingtreding van deze wet, blijven gelden gedurende de looptijd van het indicatiebesluit, doch ten hoogste
      tot een jaar na de inwerkingtreding van deze wet, met dien verstande dat het college van de gemeente waarbinnen
      de jeugdige zijn woonplaats heeft, in de plaats treedt van de zorgverzekeraar van de jeugdige, bedoeld in
      [artikel 1, eerste lid, onder b, van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0002614
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '1'
  - number: 10.1.4
    text: |-
      De rechten en verplichtingen die op het tijdstip van de inwerkingtreding van deze wet gelden met betrekking tot
      zorg waarop een jeugdige is aangewezen in verband met zijn psychiatrische stoornis of beperking, waarvoor een
      verwijzing als bedoeld in [artikel 9b, vijfde lid, van de Algemene Wet Bijzondere Ziektekosten][ref1] is verstrekt
      voor de inwerkingtreding van deze wet, blijven gelden gedurende de periode waarvoor de verwijzing geldt, doch
      ten hoogste een jaar na de inwerkingtreding van deze wet, met dien verstande dat het college van de gemeente
      waarbinnen de jeugdige zijn woonplaats heeft, in de plaats treedt van de zorgverzekeraar van de jeugdige, bedoeld
      in [artikel 1, eerste lid, onder b, van de Algemene Wet Bijzondere Ziektekosten][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel9b
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel10.1
    references:
