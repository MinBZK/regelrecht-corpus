        hoofdstuk: '2'
  - number: 12.4.3.a
    text: het budget;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: 12.4.3.b
    text: de bevoorschotting, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: 12.4.3.c
    text: de te hanteren tarieven.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel12.4
  - number: '12.5'
    text: |-
      Het college publiceert voor het eerst voor 1 juli van het tweede kalenderjaar na het kalenderjaar waarin
      [artikel 2.10][ref1] in werking is getreden, de uitkomsten van het in artikel 2.10 van deze wet juncto
      [artikel 2.5.1, eerste lid, van de Wet maatschappelijke ondersteuning 2015][ref2] bedoelde onderzoek en verstrekt
      gelijktijdig de in [artikel 7.4.2][ref3] juncto [7.4.1][ref4], eerste lid, bedoelde gegevens aan Onze Ministers.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
