        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 9.6.3
    text: |-
      Een gedraging in strijd met [artikel 4.1.8][ref1] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.6
    references:
