  - number: 9.5.3
    text: |-
      Onze Ministers zijn beiden bevoegd een last onder dwangsom op te leggen aan de betrokken beroepsbeoefenaar die geen
      medewerking verleent aan de inzage van dossiers, bedoeld in [artikel 9.2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.5
