  - number: '12.7'
    text: |-
      De [artikelen 1.1][ref1], [2.2][ref2], [2.9][ref3], [2.15][ref4], [3.4][ref5], [10.4][ref6], en [12.4][ref7] treden
      in werking op de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst. De overige artikelen
      van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      artikelen of onderdelen daarvan verschillend kan worden vastgesteld.


