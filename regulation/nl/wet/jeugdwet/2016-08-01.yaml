        artikel: '40'
      - id: ref6
        bwb_id: BWBR0011468
        artikel: '41'
      - id: ref7
        bwb_id: BWBR0011468
        hoofdstuk: '8'
  - number: 7.4.0.1
    text: |-
      Het college of een door het college aangewezen persoon verwerkt persoonsgegevens van een jeugdige of zijn
      ouders, waaronder het burgerservicenummer van de jeugdige en andere bijzondere persoonsgegevens als bedoeld in de
      [Wet bescherming persoonsgegevens][ref1], voor zover deze gegevens noodzakelijk zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
    references:
      - id: ref1
        bwb_id: BWBR0011468
  - number: 7.4.0.1.a
    text: |-
      de toeleiding naar, advisering over, bepaling van of het inzetten van een voorziening op het gebied van de
      jeugdhulp;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.1.b
    text: |-
      het doen van een verzoek tot onderzoek bij de raad voor de kinderbescherming of de uitvoering van
      kinderbeschermingsmaatregelen of jeugdreclassering;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.1.c
    text: |-
      de bekostiging van preventie, jeugdhulp, kinderbeschermingsmaatregelen, jeugdreclassering of werkzaamheden als
      bedoeld in de [artikelen 6.1.2, zesde lid][ref1], [6.1.3, derde lid][ref2], en [6.1.4, vierde lid][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 7.4.0.1.d
    text: het verrichten van controle of fraude-onderzoek.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.2
    text: |-
      Jeugdhulpaanbieders, aanbieders van preventie, gecertificeerde instellingen, de raad voor de kinderbescherming
      en gekwalificeerde gedragswetenschappers als bedoeld in de [artikelen 6.1.2, zesde lid][ref1],
      [6.1.3, derde lid][ref2], en [6.1.4, vierde lid][ref3], verstrekken het college of een door het college aangewezen
      persoon kosteloos de persoonsgegevens van een jeugdige of zijn ouders, waaronder het burgerservicenummer van de
      jeugdige en andere bijzondere persoonsgegevens als bedoeld in de [Wet bescherming persoonsgegevens][ref4], die voor
      het college of die personen noodzakelijk zijn voor de uitvoering van de werkzaamheden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0011468
  - number: 7.4.0.3
    text: |-
      Personen werkzaam ten behoeve van een jeugdhulpaanbieder, een aanbieder van preventie, een gecertificeerde
      instelling of de raad voor de kinderbescherming verstrekken die aanbieders, die instellingen of die raad de
      persoonsgegevens die zij nodig hebben om te kunnen voldoen aan hun verplichting, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.4
    text: 'Bij regeling van Onze Ministers wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.4.a
    text: |-
      tot welke gegevens de verplichting, bedoeld in het tweede lid, zich ten hoogste uitstrekt indien de verstrekking
      geschiedt voor de uitvoering van de werkzaamheden, bedoeld in het eerste lid, onderdelen c of d;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.4.b
    text: op welke wijze de gegevens, bedoeld in het eerste of tweede lid, worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.5
    text: 'Bij regeling van Onze Ministers kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.5.a
    text: |-
      tot welke gegevens de verplichting, bedoeld in het tweede lid, zich ten hoogste uitstrekt indien de verstrekking
      geschiedt voor de uitvoering van de werkzaamheden, bedoeld in het eerste lid, onderdelen a of b;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.5.b
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.5.c
    text: aan welke beveiligingseisen gegevensverwerking voldoet;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.0.5.d
    text: |-
      in welke gevallen en voor welke doelen gegevens als bedoeld in het eerste of tweede lid verder mogen worden
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.0
  - number: 7.4.1.1
    text: |-
      Onze Ministers verwerken gegevens die betrekking hebben op de toegang tot de jeugdhulp, preventie, jeugdhulp,
      het advies- en meldpunt huiselijk geweld en kindermishandeling, de uitvoering van kinderbeschermingsmaatregelen
      en jeugdreclassering teneinde een zorgvuldig en samenhangend jeugdbeleid te kunnen voeren en hun
      stelselverantwoordelijkheid te kunnen waarborgen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.1
  - number: 7.4.1.2
    text: |-
      Het college verwerkt gegevens ten behoeve van een doelmatig, doeltreffend en samenhangend gemeentelijk beleid ten
      aanzien van preventie, de toegang tot en verlening van jeugdhulp, de uitvoering van kinderbeschermingsmaatregelen
      en jeugdreclassering en het advies- en meldpunt huiselijk geweld en kindermishandeling, alsmede ten behoeve van de
      verwerking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.1
  - number: 7.4.2
    text: |-
      Het college verstrekt kosteloos gegevens aan Onze Ministers ten behoeve van de verwerking, bedoeld in
      [artikel 7.4.1, eerste lid][ref1]. Deze verstrekking kan zowel een structureel als incidenteel karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.3
    text: |-
      Jeugdhulpaanbieders, aanbieders van preventie, gecertificeerde instellingen en de raad voor de kinderbescherming
      verstrekken kosteloos gegevens aan het college en Onze Ministers, ten behoeve van de verwerking, bedoeld in
      [artikel 7.4.1, eerste en tweede lid][ref1]. Deze verstrekking kan zowel een structureel als incidenteel karakter
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.4.1
    text: |-
      De gegevens, bedoeld in de [artikelen 7.4.1 tot en met 7.4.3][ref1] kunnen persoonsgegevens zijn, voor zover deze
      gegevens noodzakelijk zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.4.1.a
    text: |-
      het doelmatig en doeltreffend functioneren van de toegang tot de jeugdhulp, de uitvoering van
      kinderbeschermingsmaatregelen en jeugdreclassering;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.4
  - number: 7.4.4.1.b
    text: |-
      het doelmatig en doeltreffend functioneren van de aanbieders van preventie, de jeugdhulpaanbieders, gecertificeerde
      instellingen en van de raad voor de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.4
  - number: 7.4.4.1.c
    text: de doelmatigheid en doeltreffendheid van het aanbod van preventie, jeugdhulp en gecertificeerde instellingen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.4
  - number: 7.4.4.1.d
    text: het waarborgen van de stelselverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.4
  - number: 7.4.4.2
    text: |-
      De gegevens, bedoeld in het eerste lid, kunnen het burgerservicenummer en bijzondere persoonsgegevens zijn als
      bedoeld in [artikel 16 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel16
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '16'
  - number: 7.4.4.3
    text: |-
      De gegevens, bedoeld in het eerste lid, worden niet verwerkt voor andere doeleinden dan bedoeld in dat lid of
      daarmee verenigbare doeleinden en worden daar waar mogelijk verwerkt op een wijze die waarborgt dat zij niet tot
      een persoon herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.4
  - number: 7.4.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud van de in de
      [artikelen 7.4.1 tot en met 7.4.3][ref1] bedoelde gegevens, de wijze waarop de verwerking en de verstrekking
      plaatsvindt, de tijdvakken waarop de gegevens die worden verwerkt betrekking hebben en de termijnen waarbinnen of
      de tijdstippen waarop de gegevens verstrekt dienen te worden en kunnen de categorieën van verstrekkers, bedoeld in
      [artikel 7.4.3][ref2], nader worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.5.2
    text: |-
      Bij of krachtens de in het eerste lid bedoelde maatregel kan worden bepaald dat de gegevens, bedoeld in
      de [artikelen 7.4.2][ref1] en [7.4.3][ref2], door de aanbieders van preventie, de jeugdhulpaanbieders, de
      gecertificeerde instellingen, de raad voor de kinderbescherming en het college, op een bij of krachtens die
      maatregel aangewezen wijze verstrekt worden aan en verwerkt worden door Onze Ministers of een door hen aan te
      wijzen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.5.3
    text: |-
      De voordracht voor een krachtens het eerste of tweede lid vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Ministers
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel7.4.5
  - number: 8.1.1.1
    text: |-
      Indien de jeugdige of zijn ouders dit wensen, verstrekt het college hun een persoonsgebonden budget dat hen in
      staat stelt de jeugdhulp die tot de individuele voorziening behoort van derden te betrekken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.2
    text: 'Een persoonsgebonden budget wordt verstrekt, indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.2.a
    text: |-
      de jeugdige of zijn ouders naar het oordeel van het college op eigen kracht voldoende in staat zijn tot een
      redelijke waardering van de belangen ter zake dan wel met hulp uit hun sociale netwerk dan wel van een curator,
      bewindvoerder, mentor, gemachtigde, gecertificeerde instelling of aanbieder van gesloten jeugdhulp, in staat zijn
      de aan een persoonsgebonden budget verbonden taken op verantwoorde wijze uit te voeren;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.2.b
    text: |-
      de jeugdige of zijn ouders zich gemotiveerd op het standpunt stellen dat zij de individuele voorziening die wordt
      geleverd door een aanbieder, niet passend achten; en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.2.c
    text: |-
      naar het oordeel van het college is gewaarborgd dat de jeugdhulp die tot de individuele voorziening behoort en die
      de jeugdige of zijn ouders van het budget willen betrekken, van goede kwaliteit is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.3
    text: |-
      Bij verordening kan worden bepaald onder welke voorwaarden de persoon aan wie een persoonsgebonden budget wordt
      verstrekt, de jeugdhulp kan betrekken van een persoon die behoort tot het sociale netwerk.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.4
    text: 'Het college kan een persoonsgebonden budget weigeren:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.4.a
    text: |-
      voor zover de kosten van het betrekken van de jeugdhulp van derden hoger zijn dan de kosten van de individuele
      voorziening, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
  - number: 8.1.1.4.b
    text: |-
      indien het college eerder toepassing heeft gegeven aan [artikel 8.1.4, eerste lid, onderdeel a, d of e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.1.2.1
    text: |-
      De jeugdige en zijn ouders doen aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle
      feiten en omstandigheden waarvan hun redelijkerwijs duidelijk moet zijn dat deze aanleiding kunnen zijn tot
      heroverweging van een beslissing aangaande een persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.2
  - number: 8.1.2.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet, indien het college die feiten en omstandigheden kan
      vaststellen op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens die feiten en omstandigheden
      kan verkrijgen uit bij regeling van Onze Ministers aan te wijzen administraties.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.2
  - number: 8.1.2.3
    text: |-
      De jeugdige en zijn ouders zijn verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs
      nodig is voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.2
  - number: 8.1.3
    text: |-
      Het college onderzoekt periodiek of er aanleiding is een beslissing aangaande een persoonsgebonden budget te
      heroverwegen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.3
  - number: 8.1.4.1
    text: |-
      Het college kan een beslissing aangaande een persoonsgebonden budget herzien dan wel intrekken, indien het college
      vaststelt dat:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.4.1.a
    text: |-
      de jeugdige of zijn ouders onjuiste of onvolledige gegevens hebben verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beslissing zou hebben geleid,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.4.1.b
    text: |-
      de jeugdige of zijn ouders niet langer op de individuele voorziening of het daarmee samenhangende persoonsgebonden
      budget zijn aangewezen,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.4.1.c
    text: de individuele voorziening of het daarmee samenhangende persoonsgebonden budget niet meer toereikend is te achten,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.4.1.d
    text: de jeugdige of zijn ouders niet voldoen aan de voorwaarden van het persoonsgebonden budget, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.4.1.e
    text: |-
      de jeugdige of zijn ouders het persoonsgebonden budget niet of voor een ander doel gebruiken dan waarvoor het
      bestemd is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.4.2
    text: |-
      Het college bepaalt in de beslissing als bedoeld in het eerste lid het tijdstip waarop de beslissing in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.4.3
    text: |-
      Indien het college een beslissing aangaande een persoonsgebonden budget met toepassing van het eerste lid,
      onderdeel a, heeft herzien dan wel ingetrokken, kan het college bij dwangbevel geheel of gedeeltelijk het ten
      onrechte genoten persoonsgebonden budget invorderen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.4
  - number: 8.1.5.1
    text: |-
      Een individuele voorziening in natura wordt aan een jeugdige of een ouder door of namens het college verstrekt.
      Indien een derde de voorziening in natura levert, komen op de persoon die deze voorziening ontvangt, geen
      werkgevers- of opdrachtgeversverplichtingen te rusten.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.5
  - number: 8.1.5.2
    text: |-
      Indien een jeugdige of een ouder een budget ontvangt, worden de betalingen voor de jeugdhulp die de jeugdige of de
      ouder ontvangen door of namens het college verstrekt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.5
  - number: 8.1.6
    text: |-
      Het college licht de jeugdige en zijn ouder vooraf volledig, objectief en in voor hem begrijpelijke bewoordingen in
      over de gevolgen van de keuze voor een budget in plaats van een individuele voorziening in natura.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.6
  - number: 8.1.7
    text: |-
      Op het budget is [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8.1.8.1
    text: |-
      De Sociale verzekeringsbank, genoemd in
      [artikel 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], voert namens de colleges de
      betalingen ten laste van verstrekte budgetten, alsmede het hiermee verbonden budgetbeheer, uit.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '3'
  - number: 8.1.8.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de Sociale
      verzekeringsbank de taak, bedoeld in het eerste lid, uitvoert.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.8
  - number: 8.1.8.3
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over de overeenkomst die de persoon aan wie een
      persoonsgebonden budget wordt verstrekt sluit met de derde van wie hij jeugdhulp die tot de individuele voorziening
      behoort, ontvangt en die daarvoor betaling ontvangt uit het persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.1.8
  - number: 8.2.1.1
    text: |-
      De volgende personen zijn een ouderbijdrage verschuldigd in de kosten van de aan een jeugdige geboden
      jeugdhulp, voor zover deze jeugdhulp verblijf buiten het gezin inhoudt, of in de kosten van verblijf in een
      justitiële jeugdinrichting van een jeugdige die met toepassing van [artikel 6.1.2, eerste lid][ref1], of
      [artikel 6.1.3, eerste lid][ref2], aldaar is geplaatst:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 8.2.1.1.a
    text: |-
      de onderhoudsplichtige ouders, daaronder begrepen degene tegen wie een op
      [artikel 394 van Boek 1 van het Burgerlijk Wetboek][ref1] gegrond verzoek is toegewezen, en


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel394
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '394'
  - number: 8.2.1.1.b
    text: degene die anders dan als ouder samen met de ouder het gezag uitoefent over een jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.2
    text: 'In afwijking van het eerste lid is in ieder geval geen ouderbijdrage verschuldigd indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.2.a
    text: de jeugdige met het oog op adoptie niet meer door zijn ouders wordt verzorgd en opgevoed;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.2.b
    text: het gezag van de ouders is beëindigd, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.2.c
    text: het verblijf en de verzorging worden aangeboden in een acute noodsituatie, voor de duur van ten hoogste zes weken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.3
    text: |-
      Indien ten aanzien van een jeugdige meer dan één van de in het eerste lid, onderdelen a en b, genoemde personen de
      ouderbijdrage is verschuldigd, is ieder der bijdrageplichtigen de ouderbijdrage verschuldigd, met dien verstande
      dat indien de een heeft betaald, de ander is bevrijd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de ouderbijdrage,
      waaronder regels ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.4.a
    text: de hoogte van de ouderbijdrage,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.4.b
    text: de termijn waarbinnen de verschuldigde ouderbijdrage moet zijn voldaan,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.4.c
    text: de wijze van invordering van de ouderbijdrage, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.1.4.d
    text: de overige uitzonderingsgronden voor het verschuldigd zijn van een ouderbijdrage.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.1
  - number: 8.2.2
    text: |-
      Indien bijdrageplichtige ouders of stiefouders gescheiden wonen en er geen bedrag is bepaald op
      de voet van de [artikelen 406][ref1] of [407 van Boek 1 van het Burgerlijk Wetboek][ref2] of van
      [artikel 822, eerste lid, onderdeel c, van het Wetboek van Burgerlijke Rechtsvordering][ref3], is de ouder of
      stiefouder die ingevolge de [Algemene Kinderbijslagwet][ref4] onmiddellijk voorafgaande aan de aanvang van de
      jeugdhulp recht op kinderbijslag heeft, de ouderbijdrage verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel406
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel407
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel822
      [ref4]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '406'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '407'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '822'
      - id: ref4
        bwb_id: BWBR0002368
  - number: 8.2.3.1
    text: |-
      De ouderbijdrage wordt vastgesteld en ten behoeve van de gemeente geïnd door het bestuursorgaan dat door Onze
      Ministers met de vaststelling en de inning is belast.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.3
  - number: 8.2.3.2
    text: |-
      Het college doet onverwijld schriftelijk mededeling aan het bestuursorgaan dat door Onze Ministers met de
      vaststelling en de inning is belast van de aanvang, de wijziging en de beëindiging van jeugdhulp waarvoor een
      ouderbijdrage is verschuldigd. Deze mededeling bevat de gegevens die nodig zijn voor de vaststelling van de
      bijdrage. Onze Ministers kunnen regels stellen over de wijze waarop deze mededeling wordt gedaan.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.3
  - number: 8.2.3.3
    text: |-
      Het bestuursorgaan dat met de vaststelling en de inning is belast kan de ouderbijdrage invorderen
      bij dwangbevel. Voor de toepassing van deze wet kan het bestuursorgaan executoriaal beslag onder
      derden leggen door van het dwangbevel in afschrift mededeling te doen aan de derde-beslagene.
      [Artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
  - number: 8.2.3.4
    text: |-
      De bijdrageplichtige kan tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de rechtbank. Het verzet
      vangt aan met een dagvaarding door de bijdrageplichtige als eiser aan degene die het dwangbevel heeft uitgevaardigd
      als gedaagde. Het verzet schorst de tenuitvoerlegging van het dwangbevel voor zover deze door het verzet wordt
      bestreden. Het verzet kan niet zijn gegrond op de stelling dat de mededeling dat de ouderbijdrage is opgelegd
      of de aanmaning ter zake niet is ontvangen. Bovendien kan het verzet niet zijn gegrond op de stelling dat de
      ouderbijdrage ten onrechte of tot een te hoog bedrag is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.3
  - number: 8.2.3.5
    text: |-
      Het bestuursorgaan dat door Onze Ministers met de vaststelling en de inning is belast kan
      [artikel 8.2.1, eerste lid][ref1], buiten toepassing laten of daarvan afwijken voor zover toepassing gelet op het
      belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.2.4.1
    text: |-
      De bijdrageplichtige, bedoeld in [artikel 8.2.1, eerste lid][ref1], is verplicht aan het bestuursorgaan dat door
      Onze Ministers met de vaststelling en de inning is belast desgevraagd alle inlichtingen te geven die nodig zijn
      voor de vaststelling en inning van de ouderbijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.2.4.2
    text: |-
      De inlichtingen worden op verzoek schriftelijk verstrekt binnen een door het bestuursorgaan dat door Onze Ministers
      met de vaststelling en de inning is belast, schriftelijk te stellen, redelijke termijn.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.4
  - number: 8.2.5
    text: |-
      Indien naar het oordeel van Onze Ministers het bestuursorgaan dat door Onze Ministers met de vaststelling en de
      inning is belast zijn wettelijke taak niet naar behoren verricht, kunnen Onze Ministers bepalen dat de bevoegdheden
      die met die taak verband houden overgaan op Onze Minister van Volksgezondheid, Welzijn en Sport.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.5
  - number: 8.2.6
    text: |-
      Het bestuursorgaan dat door Onze Ministers met de vaststelling en de inning is belast kan het burgerservicenummer
      van een persoon die een ouderbijdrage verschuldigd is, gebruiken:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.6
  - number: 8.2.6.a
    text: in het verkeer met de persoon op wie het nummer betrekking heeft, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.6
  - number: 8.2.6.b
    text: in zijn contacten met personen en instanties voor zover deze zelf gemachtigd zijn tot het gebruik van het nummer.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.6
  - number: 8.2.7
    text: |-
      De rijksbelastingdienst en het Uitvoeringsinstituut werknemersverzekeringen als bedoeld in de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] verstrekken het bestuursorgaan dat door Onze Ministers
      met de vaststelling en de inning is belast de persoonsgegevens die voor die rechtspersoon noodzakelijk zijn voor de
      uitvoering van [artikel 8.2.3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013060
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.2.7
    references:
      - id: ref1
        bwb_id: BWBR0013060
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.3.1
    text: |-
      Jeugdhulpaanbieders als bedoeld in [artikel 1.1, onderdeel 1°][ref1], en gecertificeerde instellingen stellen
      overeenkomstig door Onze Ministers te stellen regelen de begroting, de balans en de resultatenrekening alsmede de
      daarbij behorende toelichting vast en maken deze op door Onze Ministers te bepalen wijze openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 8.3.2
    text: |-
      Jeugdhulpaanbieders als bedoeld in [artikel 1.1, onderdeel 1°][ref1], en gecertificeerde instellingen behorende
      tot een bij algemene maatregel van bestuur aangewezen categorie, verstrekken aan Onze Ministers of aan een bij of
      krachtens die maatregel aangewezen bestuursorgaan de bij of krachtens die maatregel omschreven gegevens betreffende
      de exploitatie.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 8.4.1.1
    text: |-
      Het bestuursorgaan dat met de vaststelling en de inning van de ouderbijdrage, bedoeld in [artikel 8.2.3][ref1], is
      belast is bevoegd tot het verwerken van persoonsgegevens van de jeugdige en zijn ouders, waaronder persoonsgegevens
      betreffende de gezondheid die noodzakelijk zijn voor de vaststelling en de inning van een bijdrage, voor zover deze
      op rechtmatige wijze zijn verkregen en noodzakelijk zijn voor de uitvoering van zijn taak ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.4.1.2
    text: Het bestuursorgaan is de verantwoordelijke voor de verwerking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.1
  - number: 8.4.2.1
    text: |-
      De Sociale verzekeringsbank is bevoegd tot het verwerken van persoonsgegevens van de jeugdige en zijn ouders,
      waaronder persoonsgegevens betreffende de gezondheid die noodzakelijk zijn voor het verrichten van betalingen
      en het budgetbeheer, bedoeld in [artikel 8.1.8][ref1], voor zover deze op rechtmatige wijze zijn verkregen en
      noodzakelijk zijn voor de uitvoering van zijn taak ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.4.2.2
    text: De Sociale verzekeringsbank is de verantwoordelijke voor de verwerking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.2
  - number: 8.4.3.1
    text: |-
      Op het bestuursorgaan dat met de vaststelling en de inning van de ouderbijdrage, bedoeld in [artikel 8.2.3][ref1],
      is belast en op de Sociale verzekeringsbank, zijn de [artikelen 7.2.1 tot en met 7.2.5][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 8.4.3.2
    text: |-
      De in het eerste lid bedoelde instanties kunnen van de [artikelen 7.2.2 tot en met 7.2.4][ref1] afwijken voor
      zolang dit noodzakelijk is met betrekking tot spoedeisende gevallen. In zodanig geval is [artikel 7.2.5][ref2] niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 8.4.4
    text: |-
      Op het bestuursorgaan dat met de vaststelling en de inning van de ouderbijdrage, bedoeld in [artikel 8.2.3][ref1],
      is belast en op de Sociale verzekeringsbank:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.2'
  - number: 8.4.4.a
    text: |-
      zijn de [artikelen 5.3.2 tot en met 5.3.5 van de Wet maatschappelijke ondersteuning 2015][ref1] van overeenkomstige
      toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '5'
  - number: 8.4.4.b
    text: |-
      is [artikel 7.3.12][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel8.4.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 9.1.1
    text: |-
      Er is een inspectie jeugdzorg die ressorteert onder Onze Minister van Volksgezondheid, Welzijn en Sport en die tot
      taak heeft het onderzoeken van de kwaliteit in algemene zin van:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.1.a
    text: de jeugdhulpaanbieders;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.1.b
    text: |-
      de certificerende instelling, bedoeld in [artikel 3.4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3'
        hoofdstuk: '3'
  - number: 9.1.1.c
    text: de gecertificeerde instellingen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.1.d
    text: het advies- en meldpunt huiselijk geweld en kindermishandeling;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.1.e
    text: de raad voor de kinderbescherming, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.1.f
    text: |-
      de inrichtingen, bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1],
      alsmede waar nodig, het aangeven en bevorderen van middelen tot verbetering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 9.1.2
    text: |-
      In afwijking van het eerste lid, wordt het onderzoek, voor zover het de tenuitvoerlegging van strafrechtelijke
      beslissingen betreft, uitgevoerd door de inspectie bedoeld in [artikel 57 van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '57'
  - number: 9.1.3
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20 van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing ten aanzien van de ambtenaren
      van de inspecties, bij de uitvoering van de taak, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.1.4
    text: |-
      De inspecties nemen bij de vervulling van hun taken, bedoeld in het eerste en tweede lid, de instructies van Onze
      Ministers in acht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.5
    text: De inspectie jeugdzorg houdt bij de vervulling van haar taak rekening met de behoeften van gemeenten.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.6
    text: |-
      De inspecties brengen van hun bevindingen verslag uit aan degene bij wie het onderzoek is uitgevoerd en kunnen
      daarbij voorstellen doen tot verbetering van de kwaliteit. Onze Ministers worden schriftelijk op de hoogte gebracht
      van de bevindingen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.1.7
    text: |-
      De inspectie jeugdzorg publiceert jaarlijks een verslag van haar werkzaamheden. In het verslag doet zij de
      voorstellen die zij in het belang van de jeugdhulp nodig acht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de door Onze Ministers
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.2
  - number: 9.2.2
    text: |-
      De met het toezicht belaste ambtenaren zijn voor zover dat voor de vervulling van hun taak noodzakelijk is en
      in afwijking van [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref1], bevoegd, met medeneming
      van de benodigde apparatuur, een woning van een jeugdhulpaanbieder binnen te treden zonder toestemming van de
      bewoner, voor zover die woning wordt gebruikt ten behoeve van de verlening van jeugdhulp of de uitvoering van een
      kinderbeschermingsmaatregel of jeugdreclassering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.2.3
    text: |-
      De met het toezicht belaste ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is en
      in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot inzage van de
      dossiers. Voor zover de betrokken beroepsbeoefenaar uit hoofde van zijn beroep tot geheimhouding van het dossier
      verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.2.4
    text: |-
      De met het toezicht belaste ambtenaren zijn bevoegd het niet naleven door een jeugdhulpaanbieder of een
      gecertificeerde instelling van een verplichting die voor hem uit het bepaalde bij of krachtens deze wet
      voortvloeit, buiten behandeling te laten, tenzij sprake is van een situatie die een ernstige bedreiging kan
      betekenen die voor de veiligheid van jeugdigen of ouders, de verlening van jeugdhulp of de uitvoering van een
      kinderbeschermingsmaatregel of van jeugdreclassering, of het belang van verantwoorde hulp anderszins daaraan
      redelijkerwijs in de weg staat.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.2
  - number: 9.2.5
    text: |-
      Bij ministeriële regeling kunnen Onze Ministers regels stellen met betrekking tot de taakverdeling tussen de
      inspecties en de onderlinge samenwerking van de inspecties.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.2
  - number: 9.2.6
    text: |-
      Indien een organisatie van beoefenaren van een beroep op het terrein van de jeugdhulp, van de
      uitvoering van kinderbeschermingsmaatregelen of jeugdreclassering, de advies- en meldpunten huiselijk
      geweld en kindermishandeling, de raad voor de kinderbescherming, inrichtingen als bedoeld in
      [artikel 1 van de Beginselenwet justitiële jeugdinrichtingen][ref1] of Halt-bureaus als bedoeld in
      [artikel 48f van de Wet Justitie-subsidies][ref2] een systeem van tuchtrecht heeft georganiseerd, kunnen Onze
      Ministers de ingevolge [artikel 9.2][ref3] met het toezicht belaste ambtenaren bevoegd verklaren in het kader van
      dat systeem een tuchtklacht in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel48f
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008121
        artikel: 48f
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.7
    text: |-
      [Artikel 9.1, vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.1
    text: |-
      Indien een van Onze Ministers van oordeel is dat een jeugdhulpaanbieder of een gecertificeerde instelling deze wet
      of de daarop berustende bepalingen niet of onvoldoende naleeft, kan hij de jeugdhulpaanbieder of de gecertificeerde
      instelling die het betreft een schriftelijke aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.3
  - number: 9.3.2
    text: |-
      In de aanwijzing geeft Onze Minister die het aangaat met redenen omkleed aan welke maatregelen de
      jeugdhulpaanbieder of de gecertificeerde instelling moet nemen met het oog op de naleving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.3
  - number: 9.3.3
    text: |-
      De aanwijzing bevat de termijn waarbinnen de jeugdhulpaanbieder of de gecertificeerde instelling daaraan moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.3
  - number: 9.3.4
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor de veiligheid of de gezondheid redelijkerwijs geen
      uitstel kan lijden, kan de ingevolge [artikel 9.2, eerste lid][ref1], met het toezicht belaste ambtenaar een
      schriftelijk bevel geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door een van Onze Ministers
      kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.5
    text: |-
      De jeugdhulpaanbieder of de gecertificeerde instelling is verplicht binnen de daarbij gestelde termijn aan de
      aanwijzing onderscheidenlijk onmiddellijk aan het bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.3
  - number: 9.3.6
    text: |-
      Mandaat tot het verlengen van de geldigheidsduur van een bevel wordt niet verleend aan een met het toezicht belaste
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.3
  - number: 9.4.1
    text: |-
      Met het toezicht op de naleving van [artikel 9 van de Wet Centraal Orgaan opvang asielzoekers][ref1], voor zover
      het betreft minderjarigen die onder toezicht of voogdij staan van een gecertificeerde instelling als bedoeld in
      [artikel 1.1][ref2], zijn belast de door Onze Ministers aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel9.4
    references:
