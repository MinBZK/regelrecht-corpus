        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 1.3.1
    text: Deze wet is van toepassing op in Nederland verblijvende jeugdigen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel1.3
  - number: 1.3.2
    text: |-
      Het college is gehouden een voorziening te treffen als bedoeld in [artikel 2.3, eerste tot en met derde lid][ref1],
      en uitvoering te geven aan [artikel 2.4, tweede lid][ref2], ten aanzien van rechtmatig in Nederland verblijvende
      vreemdelingen. Onder vreemdeling wordt in dit artikel verstaan hetgeen daaronder wordt verstaan in de
      [Vreemdelingenwet 2000][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0011823
  - number: 1.3.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het tweede lid, en zo nodig in afwijking van
      [artikel 11 van de Vreemdelingenwet 2000][ref1], de verantwoordelijkheid van het college, bedoeld in het tweede
      lid, voor bij of krachtens die algemene maatregel van bestuur aan te geven categorieën rechtmatig in Nederland
      verblijvende vreemdelingen worden beperkt, gelet op de aard, de plaats of de verwachte duur van hun verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '11'
  - number: 1.3.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan, in afwijking van het tweede lid, en zo nodig in afwijking van
      [artikel 10 van de Vreemdelingenwet 2000][ref1], de verantwoordelijkheid van het college, bedoeld in het tweede
      lid, geheel of gedeeltelijk worden uitgebreid tot bij of krachtens die algemene maatregel van bestuur aan te geven
      categorieën niet rechtmatig in Nederland verblijvende vreemdelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel10
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '10'
  - number: 1.3.5
    text: |-
      Een voorziening als bedoeld in [artikel 2.3, eerste tot en met derde lid][ref1], en de uitvoering van
      [artikel 2.4, tweede lid][ref2], geeft een vreemdeling geen aanspraak op rechtmatig verblijf.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: '2.1'
    text: |-
      Het gemeentelijke beleid inzake preventie, jeugdhulp, kinderbeschermingsmaatregelen en jeugdreclassering en de
      uitvoering van jeugdhulp, kinderbeschermingsmaatregelen en jeugdreclassering is gericht op:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
  - number: 2.1.a
    text: |-
      het voorkomen en de vroege signalering van en vroege interventie bij opgroei- en opvoedingsproblemen, psychische
      problemen en stoornissen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
  - number: 2.1.b
    text: |-
      het versterken van het opvoedkundige klimaat in gezinnen, wijken, buurten, scholen, kinderopvang en
      peuterspeelzalen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
  - number: 2.1.c
    text: |-
      het bevorderen van de opvoedvaardigheden van de ouders, opdat zij in staat zijn hun verantwoordelijkheid te dragen
      voor de opvoeding en het opgroeien van jeugdigen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
  - number: 2.1.d
    text: |-
      het inschakelen, herstellen en versterken van de eigen mogelijkheden en het probleemoplossend vermogen van de
      jeugdige, zijn ouders en de personen die tot hun sociale omgeving behoren, waarbij voor zover mogelijk wordt
      uitgegaan van hun eigen inbreng;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
  - number: 2.1.e
    text: het bevorderen van de veiligheid van de jeugdige in de opvoedsituatie waarin hij opgroeit;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
  - number: 2.1.f
    text: integrale hulp aan de jeugdige en zijn ouders, indien sprake is van multiproblematiek, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
  - number: 2.1.g
    text: |-
      het tot stand brengen en uitvoeren van familiegroepsplannen en het verlenen van hulp op basis van
      familiegroepsplannen, ter uitvoering van [artikel 4.1.2][ref1] en indien sprake is van vroege signalering van
      opgroei- en opvoedingsproblemen, psychische problemen en stoornissen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 2.2.1
    text: |-
      De gemeenteraad stelt periodiek een plan vast dat richting geeft aan de door de gemeenteraad en het college
      te nemen beslissingen betreffende preventie en jeugdhulp, de uitvoering van kinderbeschermingsmaatregelen en
      jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
  - number: 2.2.2
    text: |-
      Het plan bevat de hoofdzaken van het door de gemeente te voeren beleid betreffende preventie, jeugdhulp, de
      uitvoering van de kinderbeschermingsmaatregelen en jeugdreclassering en geeft daarbij in ieder geval aan:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
  - number: 2.2.2.a
    text: wat de gemeentelijke visie en doelstellingen zijn van dit beleid;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
  - number: 2.2.2.b
    text: |-
      hoe dit beleid zal worden uitgevoerd in samenhang met de verantwoordelijkheid van het college inzake het advies-
      en meldpunt huiselijk geweld en kindermishandeling en welke acties in de door het plan bestreken periode zullen
      worden ondernomen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
  - number: 2.2.2.c
    text: |-
      welke resultaten de gemeente in de door het plan bestreken periode wenst te behalen, hoe gemeten zal worden of
      deze resultaten zijn behaald en welke outcomecriteria gehanteerd worden ten aanzien van jeugdhulpaanbieders en
      gecertificeerde instellingen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
  - number: 2.2.2.d
    text: |-
      hoe het college uitvoering zal geven aan [artikel 2.7, tweede lid][ref1], en hoe wordt gewaarborgd dat de
      jeugdhulpaanbieder voldoet aan de eisen inzake de verantwoordelijkheidstoedeling, gesteld bij of krachtens
      [artikel 4.1.1, tweede lid][ref2], juncto [4.1.5, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 2.2.2.e
    text: op welke wijze de gemeenteraad en het college zich hebben vergewist van de behoeften van kleine doelgroepen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
  - number: 2.2.2.f
    text: |-
      hoe het college uitvoering zal geven aan het op 13 december 2006 te New York tot stand gekomen Verdrag inzake de
      rechten van personen met een handicap (Trb. 2007, 169).
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
  - number: 2.2.3
    text: |-
      Het plan wordt, voor zover het de afstemming van en effectieve samenwerking met het onderwijs betreft, niet
      vastgesteld dan nadat over een concept van het plan op overeenstemming gericht overleg heeft plaatsgevonden
      met het samenwerkingsverband, bedoeld in [artikel 18a van de Wet op het primair onderwijs][ref1] en het
      samenwerkingsverband, bedoeld in [artikel 17a van de Wet op het voortgezet onderwijs][ref2]. Het overleg met deze
      samenwerkingsverbanden vindt plaats overeenkomstig een procedure, vastgesteld door het samenwerkingsverband en het
      college van de gemeente of gemeenten. De procedure bevat een voorziening voor het beslechten van geschillen.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel17a
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 17a
  - number: 2.3.1
    text: |-
      Indien naar het oordeel van het college een jeugdige of een ouder jeugdhulp nodig heeft in verband met opgroei-
      en opvoedingsproblemen, psychische problemen en stoornissen en voor zover de eigen mogelijkheden en het
      probleemoplossend vermogen ontoereikend zijn, treft het college ten behoeve van de jeugdige die zijn woonplaats
      heeft binnen zijn gemeente, voorzieningen op het gebied van jeugdhulp en waarborgt het college een deskundige
      toeleiding naar, advisering over, bepaling van en het inzetten van de aangewezen voorziening, waardoor de jeugdige
      in staat wordt gesteld:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.1.a
    text: gezond en veilig op te groeien;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.1.b
    text: te groeien naar zelfstandigheid, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.1.c
    text: voldoende zelfredzaam te zijn en maatschappelijk te participeren,
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.2
    text: |-
      Voorzieningen op het gebied van jeugdhulp omvatten voor zover naar het oordeel van het college noodzakelijk in
      verband met een medische noodzaak of beperkingen in de zelfredzaamheid, het vervoer van een jeugdige van en naar de
      locatie waar de jeugdhulp wordt geboden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.3
    text: |-
      Indien een jeugdige die de leeftijd van achttien jaar nog niet heeft bereikt, aangewezen is op permanent toezicht
      en die jeugdhulp als bedoeld in [artikel 1.1, onder 2° of 3°][ref1], of verpleging als bedoeld bij of krachtens
      [artikel 11 van de Zorgverzekeringswet][ref2] ontvangt, treft het college indien naar zijn oordeel noodzakelijk,
      voorzieningen die de ouders in staat stellen hun rol als verzorgers en opvoeders te blijven vervullen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 2.3.4
    text: 'Het college houdt bij de bepaling van de aangewezen vorm van jeugdhulp redelijkerwijs rekening met:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.4.a
    text: behoeften en persoonskenmerken van de jeugdige en zijn ouders, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.4.b
    text: de godsdienstige gezindheid, de levensovertuiging en de culturele achtergrond van de jeugdige en zijn ouders.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.5
    text: |-
      Voor zover redelijkerwijs mogelijk, wordt de jeugdige en zijn ouders keuzevrijheid geboden met betrekking tot de
      activiteiten van jeugdhulp.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.3.6
    text: |-
      Het college draagt er zorg voor dat de jeugdige in het geval van een uithuisplaatsing, indien redelijkerwijs
      mogelijk, bij een pleegouder of in een gezinshuis wordt geplaatst, tenzij dit aantoonbaar niet in het belang is van
      de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.3
  - number: 2.4.1
    text: |-
      Zodra het college tot het oordeel komt dat een maatregel met betrekking tot het gezag over een minderjarige die
      zijn woonplaats heeft binnen zijn gemeente overwogen moet worden, doet het college een verzoek tot onderzoek bij de
      raad voor de kinderbescherming.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.4
  - number: 2.4.2
    text: |-
      Het college is ten behoeve van een jeugdige die zijn woonplaats heeft binnen zijn gemeente verantwoordelijk voor de
      uitvoering van de kinderbeschermingsmaatregelen, van de jeugdreclassering en van de jeugdhulp die voortvloeit uit
      een strafrechtelijke beslissing, hetgeen in ieder geval inhoudt dat het college:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.4
  - number: 2.4.2.a
    text: voorziet in een toereikend aanbod van gecertificeerde instellingen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.4
  - number: 2.4.2.b
    text: |-
      de jeugdhulp inzet die de gecertificeerde instelling nodig acht bij de uitvoering van een
      kinderbeschermingsmaatregel of die noodzakelijk is in verband met de tenuitvoerlegging van een machtiging tot
      uithuisplaatsing als bedoeld in [artikel 265b van Boek 1 van het Burgerlijk Wetboek][ref1], alsmede de jeugdhulp
      inzet die de rechter, het openbaar ministerie, de selectiefunctionaris, de inrichtingsarts of de directeur
      van de justitiële jeugdinrichting nodig achten bij de uitvoering van een strafrechtelijke beslissing of die de
      gecertificeerde instelling nodig acht bij de uitvoering van jeugdreclassering.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265b
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 265b
  - number: 2.4.3
    text: |-
      Het college draagt er zorg voor dat bij de uitvoering van de kinderbeschermingsmaatregelen en van de
      jeugdreclassering redelijkerwijs rekening wordt gehouden met:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.4
  - number: 2.4.3.a
    text: behoeften en persoonskenmerken van de jeugdige en zijn ouders, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.4
  - number: 2.4.3.b
    text: de godsdienstige gezindheid, de levensovertuiging en de culturele achtergrond van de jeugdige en zijn ouders.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.4
  - number: '2.5'
    text: |-
      Ter uitvoering van [artikel 2.3, vierde lid][ref1], en [artikel 2.4, derde lid][ref2], draagt het college er
      in ieder geval zorg voor dat passende jeugdhulp ingezet wordt of een passende gecertificeerde instelling de
      kinderbeschermingsmaatregel of jeugdreclassering uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.1
    text: 'Het college is er in ieder geval verantwoordelijk voor dat:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
  - number: 2.6.1.a
    text: |-
      er een kwalitatief en kwantitatief toereikend aanbod is om aan de taken als bedoeld in de [artikelen 2.2][ref1],
      [2.3][ref2] en [2.4, tweede lid, onderdeel b][ref3], te kunnen voldoen;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.6.1.b
    text: |-
      jeugdhulp op een laagdrempelige en herkenbare manier wordt aangeboden en te allen tijde bereikbaar en beschikbaar
      is in situaties waar onmiddellijke uitvoering van taken is geboden;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
  - number: 2.6.1.c
    text: |-
      degenen die beroepsmatig met jeugdigen werken deskundig advies kunnen krijgen over vragen en problemen met
      betrekking tot opgroei- en opvoedingsproblemen, psychische problemen en stoornissen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
  - number: 2.6.1.d
    text: |-
      jeugdigen kosteloos en anoniem advies kunnen krijgen over de door hen voorgelegde vragen met betrekking tot
      opgroei- en opvoedingsproblemen, psychische problemen en stoornissen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
  - number: 2.6.1.e
    text: wordt voorzien in maatregelen om kindermishandeling te bestrijden;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
  - number: 2.6.1.f
    text: jeugdigen, ouders of pleegouders een beroep kunnen doen op een vertrouwenspersoon, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
  - number: 2.6.1.g
    text: |-
      jeugdhulp ook toegankelijk is na verwijzing door de huisarts, de medisch specialist en
      de jeugdarts, onverminderd de daarbij te hanteren professionele standaard als bedoeld in
      [artikel 453 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel453
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '453'
  - number: 2.6.2
    text: |-
      Het college is er verantwoordelijk voor dat een vertrouwenspersoon werkzaam is bij een rechtspersoon met volledige
      rechtsbevoegdheid die onafhankelijk is van het college, de jeugdhulpaanbieder, de gecertificeerde instelling
      en het advies- en meldpunt huiselijk geweld en kindermishandeling en van personen in dienst van het college, de
      jeugdhulpaanbieder, de gecertificeerde instelling en het advies- en meldpunt en stelt de vertrouwenspersoon in de
      gelegenheid zijn taak uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
  - number: 2.6.3
    text: |-
      Hetgeen in [artikel 4.1.6, eerste, tweede, derde lid en vijfde lid][ref1], is bepaald ten aanzien van de
      jeugdhulpaanbieder is van overeenkomstige toepassing op het college, voor zover het betreft personen die onder
      verantwoordelijkheid van het college werkzaamheden verrichten met betrekking tot de toeleiding naar, advisering
      over, de bepaling en het inzetten van de aangewezen voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 2.7.1
    text: |-
      Het college treedt bij het treffen van een individuele voorziening zo nodig in overleg met het
      bevoegd gezag van een school als bedoeld in [artikel 1 van de Wet op het primair onderwijs][ref1],
      [artikel 1 van de Wet op het voortgezet onderwijs][ref2], [artikel 1 van de Wet op de expertisecentra][ref3] of
      van een instelling als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref4], waar de jeugdige
      schoolgaand is.


      [ref1]: https://wetten.overheid.nl/BWBR0003420#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0003549#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0003420
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0003549
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0007625
        artikel: '1'
  - number: 2.7.2
    text: |-
      Op het college zijn de eisen inzake de verantwoordelijkheidstoedeling gesteld bij of krachtens
      [artikel 4.1.1, tweede lid][ref1], juncto [4.1.5, eerste lid][ref2], van overeenkomstige toepassing ten aanzien van
      personen die onder verantwoordelijkheid van het college werkzaamheden verrichten met betrekking tot de toeleiding
      naar, advisering over en de bepaling van de aangewezen voorziening en ten aanzien van personen die door het college
      worden ingezet om jeugdhulp te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 2.7.3
    text: |-
      Het college verzekert zich bij het inzetten van de aangewezen voorziening ervan dat de jeugdhulpaanbieder
      in staat is te voldoen aan de eisen inzake de verantwoordelijkheidstoedeling gesteld bij of krachtens
      [artikel 4.1.1, tweede lid][ref1], juncto [4.1.5, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 2.7.4
    text: |-
      Het college maakt afspraken met de huisartsen, de medisch specialisten, de jeugdartsen en de zorgverzekeraars over
      de voorwaarden waaronder en de wijze waarop de verwijzing, bedoeld in [artikel 2.6, eerste lid, onderdeel g][ref1],
      plaatsvindt, onverminderd de daarbij te hanteren professionele standaard als bedoeld in
      [artikel 453 van Boek 7 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel453
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '453'
  - number: 2.7.5
    text: |-
      Het college stemt de wijze waarop hij zijn verantwoordelijkheden op grond van deze wet uitvoert, af met
      zorgverzekeraars met het oog op de wettelijke verantwoordelijkheden van die laatsten.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.7
  - number: 2.8.1
    text: |-
      De colleges werken met elkaar samen, indien dat voor een doeltreffende en doelmatige uitvoering van deze wet
      aangewezen is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.8
  - number: 2.8.2
    text: |-
      Bij algemene maatregel van bestuur kunnen gebieden worden aangewezen waarbinnen colleges met het oog op de
      samenhangende uitvoering van de aan de colleges en de gemeenteraden bij of krachtens deze wet en andere wetten
      opgedragen taken samenwerken, uitsluitend indien de noodzakelijke samenwerking in deze gebieden ontbreekt en nadat
      Onze Ministers op overeenstemming gericht overleg hebben gevoerd met de betrokken colleges. Bij die maatregel
      kunnen regels worden gesteld over de vorm van samenwerking.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.8
  - number: 2.8.3
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt gedaan door
      Onze Ministers in overeenstemming met Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.8
  - number: 2.8.4
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet gedaan
      dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Ministers te
      brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.8
  - number: '2.9'
    text: |-
      De gemeenteraad stelt bij verordening en met inachtneming van het bepaalde bij of krachtens deze wet in ieder geval
      regels:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.9
  - number: 2.9.a
    text: |-
      over de door het college te verlenen individuele voorzieningen en overige voorzieningen, met betrekking tot
      de voorwaarden voor toekenning en de wijze van beoordeling van, en de afwegingsfactoren bij een individuele
      voorziening;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.9
  - number: 2.9.b
    text: |-
      over de wijze waarop de toegang tot en de toekenning van een individuele voorziening wordt afgestemd met andere
      voorzieningen op het gebied van zorg, onderwijs, maatschappelijke ondersteuning, werk en inkomen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.9
  - number: 2.9.c
    text: |-
      de wijze waarop de hoogte van een persoonsgebonden budget als bedoeld in [artikel 8.1.1][ref1] wordt vastgesteld,
      en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 2.9.d
    text: |-
      voor de bestrijding van het ten onrechte ontvangen van een individuele voorziening of een persoonsgebonden budget,
      alsmede van misbruik of oneigenlijk gebruik van de wet.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.9
  - number: '2.10'
    text: |-
      De [artikelen 2.1.3, derde lid][ref1], en [2.5.1 van de Wet maatschappelijke ondersteuning 2015][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0035362#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0035362
        artikel: '2'
  - number: 2.11.1
    text: Het college kan de uitvoering van deze wet door derden laten verrichten.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.11
  - number: 2.11.2
    text: |-
      Indien de levering van jeugdhulp of het uitvoeren van een kinderbeschermingsmaatregel of jeugdreclassering wordt
      aanbesteed, gunt het college de overheidsopdracht op grond van de naar zijn oordeel economisch meest voordelige
      inschrijving en maakt in de aankondiging van de overheidsopdracht bekend welke nadere criteria hij stelt met het
      oog op de toepassing van het criterium economisch meest voordelige inschrijving, waaronder in ieder geval een
      criterium dat betrekking heeft op kwaliteit.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.11
  - number: 2.11.3
    text: |-
      In afwijking van [artikel 2.114, tweede lid, van de Aanbestedingswet 2012][ref1] kan het college een
      overheidsopdracht niet enkel op grond van het criterium de laagste prijs gunnen.


      [ref1]: https://wetten.overheid.nl/BWBR0032203#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0032203
        artikel: '2'
  - number: '2.12'
    text: |-
      Met het oog op gevallen waarin ten aanzien van jeugdhulp, kinderbeschermingsmaatregelen of jeugdreclassering
      [artikel 2.11, eerste lid][ref1], wordt toegepast, worden bij verordening regels gesteld ter waarborging
      van een goede verhouding tussen de prijs voor de levering van jeugdhulp of de uitvoering van een
      kinderbeschermingsmaatregel of jeugdreclassering en de eisen die worden gesteld aan de kwaliteit daarvan. Daarbij
      wordt rekening gehouden met de deskundigheid van de beroepskrachten en de toepasselijke arbeidsvoorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.13.1
    text: |-
      Indien het college met een jeugdhulpaanbieder of gecertificeerde instelling een overeenkomst heeft gesloten, ziet
      het college er op toe dat de jeugdhulpaanbieder of gecertificeerde instelling met degenen die vóór hem in opdracht
      van het college jeugdhulp leverden of kinderbeschermingsmaatregelen of jeugdreclassering uitvoerden, in overleg
      treedt over:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.13
  - number: 2.13.1.a
    text: |-
      de overname van het betrokken personeel, onverminderd het bepaalde in de [artikelen 662][ref1] en
      [663 van Boek 7 van het Burgerlijk Wetboek][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel662
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel663
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '662'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '663'
  - number: 2.13.1.b
    text: |-
      het zo veel mogelijk voortzetten van bestaande hulpverleningsrelaties tussen jeugdhulpverleners of medewerkers van
      de gecertificeerde instelling en jeugdigen of diens ouders.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.13
  - number: 2.13.2
    text: |-
      Het college ziet er op toe dat de jeugdhulpaanbieder of gecertificeerde instelling zich zo veel mogelijk inspant
      de overname, bedoeld in het eerste lid, onderdeel a, en het voorzetten van bestaande hulpverleningsrelaties als
      bedoeld in het eerste lid, onderdeel b, te bewerkstelligen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.13
  - number: 2.14.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de beschikbare deskundigheid voor de
      toeleiding, advisering en bepaling van de aangewezen voorziening, bedoeld in [artikel 2.3, eerste lid][ref1],
      alsmede voor de uitvoering van de taken, bedoeld in [artikel 2.6, eerste lid, onderdelen b en c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 2.14.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop het college
      voorziet in een toereikend aanbod om aan de taken als bedoeld in [artikel 2.3][ref1] te voldoen, waarbij
      onderscheid gemaakt kan worden in categorieën van jeugdhulp.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel2.14
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.1.1
    text: |-
      De raad voor de kinderbescherming onderzoekt de noodzaak tot het treffen van een kinderbeschermingsmaatregel indien
      het college, een daartoe door het college aangewezen jeugdhulpaanbieder, een gecertificeerde instelling of het
      advies- en meldpunt huiselijk geweld en kindermishandeling hiertoe een verzoek heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.1.2
    text: 'Tevens kan de raad voor de kinderbescherming een onderzoek als bedoeld in het eerste lid doen, indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.1.2.a
    text: sprake is van een acute en ernstig bedreigende situatie voor de minderjarige, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.1.2.b
    text: |-
      bij de uitvoering van enige andere wettelijke taak van de raad voor de kinderbescherming blijkt dat er sprake is
      van een geval waarbij een kinderbeschermingsmaatregel overwogen dient te worden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.1.3
    text: |-
      De raad voor de kinderbescherming doet van een onderzoek als bedoeld in het tweede lid onverwijld mededeling aan
      het college of een daartoe door het college aangewezen jeugdhulpaanbieder.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.1.4
    text: |-
      De gecertificeerde instelling die een verzoek tot onderzoek als bedoeld in het eerste lid heeft gedaan, doet
      daarvan onverwijld mededeling aan het college of aan een daarvoor door het college aangewezen jeugdhulpaanbieder.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.1.5
    text: De raad voor de kinderbescherming en het college leggen de wijze van samenwerken vast in een protocol.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.1.6
    text: |-
      In het protocol wordt in ieder geval vastgelegd de wijze waarop de raad voor de kinderbescherming en het college
      overleggen over welke gecertificeerde instelling in het verzoekschrift aan de rechter wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.1
  - number: 3.2.1
    text: |-
      Een kinderbeschermingsmaatregel of jeugdreclassering wordt uitsluitend uitgevoerd door een gecertificeerde
      instelling.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.2
  - number: 3.2.2
    text: Een gecertificeerde instelling biedt geen jeugdhulp aan.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.2
  - number: '3.3'
    text: |-
      De raad voor de kinderbescherming en de gecertificeerde instelling zijn verplicht in rapportages of
      verzoekschriften de van belang zijnde feiten volledig en naar waarheid aan te voeren.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.3
  - number: 3.4.1
    text: Onze Minister van Veiligheid en Justitie wijst de certificerende instelling aan.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.2
    text: |-
      De certificerende instelling, bedoeld in het eerste lid, beslist op aanvraag over de afgifte van een certificaat en
      een voorlopig certificaat en is bevoegd een afgegeven certificaat in te trekken of te schorsen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.3
    text: |-
      Een certificaat of een voorlopig certificaat wordt afgegeven als de aanvrager voldoet aan de in deze wet gestelde
      voorschriften.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.4
    text: |-
      Onze Minister van Veiligheid en Justitie stelt een normenkader vast, waaraan de aanvrager moet voldoen om een
      certificaat te verkrijgen. Daarin worden in ieder geval eisen opgenomen omtrent:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.4.a
    text: de deskundigheid van de medewerker van de gecertificeerde instelling;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.4.b
    text: de gehanteerde methodieken en interventies;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.4.c
    text: de organisatie en haar processen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.4.d
    text: de samenwerking met andere organisaties.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.5
    text: |-
      Een certificaat wordt afgegeven voor een periode van drie jaar en een voorlopig certificaat wordt afgegeven voor
      een periode van twee jaar.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.6
    text: 'Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.6.a
    text: |-
      de eisen waaraan de certificerende instelling, bedoeld in het eerste lid, moet voldoen en het toezicht door Onze
      Minister van Veiligheid en Justitie op deze instelling;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.6.b
    text: |-
      de wijze waarop de aanvraag voor een certificaat of een voorlopig certificaat wordt gedaan en de gegevens die de
      aanvrager daarbij verstrekt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.6.c
    text: de gronden waarop en de gevallen waarin een certificaat wordt geschorst of ingetrokken, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.6.d
    text: |-
      de vergoeding die is verschuldigd in verband met de kosten voor de behandeling van een aanvraag van een certificaat
      of voorlopig certificaat;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.6.e
    text: de controle door de certificerende instelling van de gecertificeerde instellingen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.4.6.f
    text: |-
      de vergoeding die de gecertificeerde instelling is verschuldigd in verband met de kosten voor de controle door de
      certificerende instelling.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.4
  - number: 3.5.1
    text: |-
      De gecertificeerde instelling bepaalt of en, zo ja, welke jeugdhulp is aangewezen bij de uitvoering van de
      kinderbeschermingsmaatregel of jeugdreclassering. Zij overlegt hiertoe met het college van de gemeente waar de
      jeugdige zijn woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.5
  - number: 3.5.2
    text: |-
      [Artikel 2.3, zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 3.5.3
    text: De gecertificeerde instelling en het college leggen de wijze van overleggen vast in een protocol.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.5
  - number: 3.5.4
    text: |-
      Het eerste lid blijft buiten toepassing indien de verplichting tot het bieden van jeugdhulp rechtstreeks
      voortvloeit uit een strafrechtelijke beslissing.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel3.5
  - number: 4.1.1.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling verlenen verantwoorde hulp, waaronder wordt verstaan hulp
      van goed niveau, die in ieder geval veilig, doeltreffend, doelmatig en cliëntgericht wordt verleend en die is
      afgestemd op de reële behoefte van de jeugdige of ouder.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.1
  - number: 4.1.1.2
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling organiseren zich op zodanige wijze, voorzien
      zich kwalitatief en kwantitatief zodanig van personeel en materieel en dragen zorg voor een zodanige
      verantwoordelijkheidstoedeling, dat een en ander leidt of redelijkerwijs moet leiden tot verantwoorde hulp.
      De jeugdhulpaanbieder en de gecertificeerde instelling betrekken hierbij de resultaten van overleg tussen
      jeugdhulpaanbieders, het college en cliëntenorganisaties. Voor zover het betreft jeugdhulp die verblijf van een
      jeugdige of ouder in een accommodatie gedurende ten minste een etmaal met zich brengt, draagt de jeugdhulpaanbieder
      er tevens zorg voor dat in de accommodatie geestelijke verzorging beschikbaar is, die zoveel mogelijk aansluit bij
      de godsdienst of levensovertuiging van de jeugdige of ouder.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.1
  - number: 4.1.1.3
    text: |-
      De hulpverlener neemt bij zijn werkzaamheden de zorg van een goede hulpverlener in acht en handelt daarbij in
      overeenstemming met de op hem rustende verantwoordelijkheid, voortvloeiende uit de voor die hulpverlener geldende
      professionele standaard.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.1
  - number: 4.1.2
    text: |-
      Bij het uitvoeren van [artikel 4.1.1][ref1] en indien sprake is van vroege signalering van opgroei- en
      opvoedingsproblemen, psychische problemen en stoornissen biedt de jeugdhulpaanbieder of de gecertificeerde
      instelling als eerste de mogelijkheid om, binnen een redelijke termijn, een familiegroepsplan op te stellen. Het
      voorgaande is niet van toepassing op de gecertificeerde instelling die jeugdreclassering uitvoert of die de voogdij
      uitoefent in het geval dat het gezag van de ouders is beëindigd. Slechts indien de ouders aan de jeugdhulpaanbieder
      of de gecertificeerde instelling te kennen hebben gegeven dat zij geen gebruik wensen te maken van de in de eerste
      zin bedoelde mogelijkheid, concrete bedreigingen in de ontwikkeling van het kind hiertoe aanleiding geven of
      de belangen van het kind anderszins geschaad worden, kan de jeugdhulpaanbieder of de gecertificeerde instelling
      hiervan afzien.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.3.1
    text: 'In dit artikel en de daarop berustende bepalingen wordt verstaan onder plan: hulpverleningsplan of plan van aanpak.'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.3
  - number: 4.1.3.2
    text: |-
      Indien afgezien wordt van het opstellen van een familiegroepsplan omvat het uitvoeren van [artikel 4.1.1][ref1] het
      werken op basis van een plan waarover is overlegd met de jeugdige en de ouders en dat is afgestemd op de behoeften
      van de jeugdige.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.3.3
    text: Indien sprake is van pleegzorg vindt over het plan tevens overleg met de betrokken pleegouder plaats.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.3
  - number: 4.1.3.4
    text: |-
      Tenzij het de uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering of gesloten jeugdhulp betreft,
      kan het plan mondeling overeen worden gekomen met de jeugdige en de ouders. Indien de jeugdige, een van de ouders
      of de jeugdhulpaanbieder dat wenst, wordt het plan binnen veertien dagen op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.3
  - number: 4.1.3.5
    text: |-
      Het plan wordt vastgesteld uiterlijk binnen zes weken nadat is komen vast te staan dat afgezien wordt van het
      opstellen van een familiegroepsplan.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.3
  - number: 4.1.3.6
    text: |-
      Indien het plan betrekking heeft op pleegzorg, behoeft het plan de instemming van de pleegouder, voor zover het
      betreft de omschrijving daarin van zijn rol in het hulpverleningsproces en van de wijze waarop de begeleiding door
      de pleegzorgaanbieder plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.3
  - number: 4.1.4.1
    text: |-
      Het uitvoeren van [artikel 4.1.1, tweede lid][ref1], omvat mede de systematische bewaking, beheersing en
      verbetering van de kwaliteit van de hulpverlening.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.2
    text: |-
      Ter uitvoering van het eerste lid draagt de jeugdhulpaanbieder of gecertificeerde instelling, afgestemd op de aard
      en de omvang van de instelling, zorg voor:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.4
  - number: 4.1.4.2.a
    text: het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de hulp;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.4
  - number: 4.1.4.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder a, op systematische wijze toetsen of de wijze van uitvoering van
      [artikel 4.1.1, tweede lid][ref1], leidt tot verantwoorde hulp, en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder b, zo nodig veranderen van de wijze waarop
      [artikel 4.1.1, tweede lid][ref1], wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.4.3
    text: |-
      Onder kwaliteit van de hulpverlening, bedoeld in het eerste lid, wordt mede verstaan de begeleiding door de
      pleegzorgaanbieder van een pleegouder gedurende de plaatsing van een jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.4
  - number: 4.1.5.1
    text: |-
      Bij algemene maatregel van bestuur kunnen, indien het niveau van de hulp dit vereist, nadere regels worden gesteld
      met betrekking tot de uitvoering van de [artikelen 4.1.1, tweede lid][ref1], [4.1.3][ref2] en [4.1.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.5.2
    text: |-
      Indien uitvoering van de [artikelen 4.1.1, tweede lid][ref1], [4.1.3][ref2] en [4.1.4][ref3] overeenkomstig de op
      grond van het eerste lid gestelde regels niet blijkt te leiden tot verantwoorde hulp, kunnen bij algemene maatregel
      van bestuur tevens nadere regels worden gesteld met betrekking tot artikel 4.1.1, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 4.1.5.3
    text: |-
      De voordracht voor een krachtens het eerste of tweede lid vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden binnen
      vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Ministers te
      brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.5
  - number: 4.1.6.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling zijn in het bezit van een verklaring omtrent het gedrag als
      bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van personen die in hun opdracht
      beroepsmatig of niet incidenteel als vrijwilliger in contact kunnen komen met jeugdigen of ouders aan wie de
      jeugdhulpaanbieder jeugdhulp verleent of aan wie een kinderbeschermingsmaatregel of jeugdreclassering is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 4.1.6.2
    text: |-
      Een verklaring als bedoeld in het eerste lid is niet eerder afgegeven dan drie maanden voor het tijdstip waarop
      betrokkene voor de jeugdhulpaanbieder of gecertificeerde instelling ging werken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.3
    text: |-
      Indien de jeugdhulpaanbieder, de gecertificeerde instelling of een ingevolge [artikel 9.2][ref1] met het toezicht
      belaste ambtenaar redelijkerwijs mag vermoeden dat een persoon niet langer voldoet aan de eisen voor het afgeven
      van een verklaring als bedoeld in het eerste lid, verlangt deze dat die persoon zo spoedig mogelijk opnieuw een
      verklaring als bedoeld in het eerste lid overlegt, die niet ouder is dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 4.1.6.4
    text: |-
      De jeugdhulpaanbieder als bedoeld onder 2° in [artikel 1.1][ref1] is in het bezit van een verklaring als bedoeld in
      het eerste lid van zichzelf, die niet ouder is dan drie jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.1.6.5
    text: |-
      Bij algemene maatregel van bestuur kan, ten behoeve van de waarborging van verantwoorde hulp alsmede ten behoeve
      van het toezicht op en de handhaving van de bij of krachtens deze wet gestelde regels, een register worden
      ingesteld van jeugdhulpaanbieders, gecertificeerde instellingen en van personen als bedoeld in het eerste lid. Bij
      of krachtens die maatregel kunnen nadere regels worden gesteld over dat register. Deze regels hebben in ieder geval
      betrekking op:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.5.a
    text: de vorm van het register;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.5.b
    text: de in het register op te nemen gegevens;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.5.c
    text: de vastlegging van gegevens in het register en de verwijdering van gegevens daaruit;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.5.d
    text: de wijze waarop verbetering van onjuistheden in het register plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.5.e
    text: de verstrekking van gegevens;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.5.f
    text: de openbaarheid van gegevens, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.6.5.g
    text: de verantwoordelijkheden van degenen die gegevens aanleveren ten behoeve van het register.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.6
  - number: 4.1.7.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling stellen een meldcode vast waarin stapsgewijs wordt
      aangegeven hoe wordt omgegaan met signalen van huiselijk geweld of kindermishandeling.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.7
  - number: 4.1.7.2
    text: |-
      De meldcode is zodanig ingericht dat zij er redelijkerwijs aan bijdraagt dat zo snel en adequaat mogelijk hulp kan
      worden geboden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.7
  - number: 4.1.7.3
    text: |-
      De jeugdhulpaanbieder, bedoeld onder 1° in [artikel 1.1][ref1] en de gecertificeerde instelling bevorderen de
      kennis en het gebruik van die meldcode onder degenen die voor hem werkzaam zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.1.7.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.7
  - number: 4.1.8.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling doen aan de ingevolge deze wet met het toezicht belaste
      ambtenaren onverwijld melding van:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.8
  - number: 4.1.8.1.a
    text: |-
      iedere calamiteit die bij de verlening van jeugdhulp of bij de uitvoering van een kinderbeschermingsmaatregel of
      jeugdreclassering heeft plaatsgevonden, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.8
  - number: 4.1.8.1.b
    text: geweld bij de verlening van jeugdhulp of de uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.8
  - number: 4.1.8.2
    text: |-
      De jeugdhulpaanbieder, de jeugdhulpverlener en de gecertificeerde instelling verstrekken bij en naar aanleiding van
      een melding als bedoeld in het eerste lid aan de ingevolge deze wet met toezicht belaste ambtenaren de gegevens,
      daaronder begrepen persoonsgegevens, gegevens betreffende de gezondheid en andere bijzondere persoonsgegevens, die
      voor het onderzoeken van de melding noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.8
  - number: 4.1.9.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling stellen een vertrouwenspersoon in de gelegenheid zijn taak
      uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.9
  - number: 4.1.9.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de taken en bevoegdheden van
      vertrouwenspersonen en de verplichtingen van het college, voor zover het betreft de toeleiding naar, advisering
      over, de bepaling en het inzetten van de aangewezen voorziening, jeugdhulpaanbieders en gecertificeerde
      instellingen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.9
  - number: 4.1.9.3
    text: |-
      De rechtspersoon bij wie een vertrouwenspersoon werkzaam is, is in het bezit van een verklaring omtrent het gedrag
      als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] van die vertrouwenspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.9
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: 4.1.9.4
    text: |-
      Een verklaring als bedoeld in het derde lid is niet eerder afgegeven dan drie maanden voor het tijdstip waarop die
      vertrouwenspersoon voor de betreffende rechtspersoon ging werken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.9
  - number: 4.1.9.5
    text: |-
      Indien de betreffende rechtspersoon of een ingevolge [artikel 9.2][ref1] met het toezicht belaste ambtenaar
      redelijkerwijs mag vermoeden dat een vertrouwenspersoon niet langer voldoet aan de eisen voor het afgeven van een
      verklaring als bedoeld in het derde lid, verlangt deze dat die vertrouwenspersoon zo spoedig mogelijk opnieuw een
      verklaring als bedoeld in het derde lid overlegt, die niet ouder is dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.1.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 4.2.1.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling treffen een regeling voor de behandeling van klachten over
      gedragingen van hen of van voor hen werkzame personen jegens een jeugdige, ouder, ouder zonder gezag, voogd, degene
      die anders dan als ouder samen met de ouder het gezag over de jeugdige uitoefent of een pleegouder in het kader van
      de verlening van jeugdhulp, de uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering. Zij brengen de
      regeling op passende wijze onder hun aandacht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.2
    text: 'De in het eerste lid bedoelde regeling:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.2.a
    text: |-
      voorziet erin dat de klachten van de jeugdige, ouder, ouder zonder gezag, voogd, degene die anders dan als
      ouder samen met de ouder het gezag over de jeugdige uitoefent of de pleegouder worden behandeld door een
      klachtencommissie die bestaat uit ten minste drie leden, waaronder een voorzitter die niet werkzaam is voor of bij
      de jeugdhulpaanbieder of de gecertificeerde instelling;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.2.b
    text: |-
      waarborgt dat aan de behandeling van een klacht niet wordt deelgenomen door een persoon op wiens gedraging de
      klacht rechtstreeks betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.2.c
    text: |-
      waarborgt dat de klachtencommissie binnen een in de regeling vastgelegde termijn na indiening van de klacht
      de klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon is, de jeugdhulpaanbieder of
      de gecertificeerde instelling, schriftelijk en met redenen omkleed in kennis stelt van haar oordeel over de
      gegrondheid van de klacht, al dan niet vergezeld van aanbevelingen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.2.d
    text: |-
      waarborgt dat bij afwijking van de onder c bedoelde termijn de klachtencommissie daarvan met redenen
      omkleed mededeling doet aan de klager, degene over wie is geklaagd en, indien dit niet dezelfde persoon
      is, de jeugdhulpaanbieder of de gecertificeerde instelling, onder vermelding van de termijn waarbinnen de
      klachtencommissie haar oordeel over de klacht zal uitbrengen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.2.e
    text: |-
      waarborgt dat de klager en degene over wie is geklaagd door de klachtencommissie in de gelegenheid worden gesteld
      mondeling of schriftelijk een toelichting te geven op de gedraging waarover is geklaagd, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.2.f
    text: waarborgt dat de klager en degene over wie is geklaagd zich bij de behandeling van de klacht kunnen laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.3
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling zien erop toe dat de klachtencommissie, bedoeld in het
      tweede lid, onderdeel a, haar werkzaamheden verricht volgens een door deze commissie op te stellen reglement.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.4
    text: |-
      Bij de klachtencommissie, bedoeld in het tweede lid, onderdeel a, kan een klacht tegen een jeugdhulpaanbieder of
      een gecertificeerde instelling worden ingediend over een gedraging van hen of van voor hen werkzame personen jegens
      een jeugdige, ouder, ouder zonder gezag, voogd, degene die anders dan als ouder samen met de ouder het gezag over
      de jeugdige uitoefent of een pleegouder:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.4.a
    text: |-
      door of namens de jeugdige, ouder, ouder zonder gezag, voogd, degene die anders dan als ouder samen met de ouder
      het gezag over de jeugdige uitoefent of de pleegouder, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.4.b
    text: |-
      door een nabestaande, indien de jeugdige, ouder, ouder zonder gezag, voogd, degene die anders dan als ouder samen
      met de ouder het gezag over de jeugdige uitoefent of de pleegouder is overleden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.5
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling delen de klager en de klachtencommissie, bedoeld in het
      tweede lid, onderdeel a, binnen een maand na ontvangst van het in het tweede lid, onderdeel c, bedoelde oordeel
      van de klachtencommissie schriftelijk mee of hij naar aanleiding van dat oordeel maatregelen zal nemen en zo ja
      welke. Bij afwijking van de in de eerste volzin genoemde termijn, doen de jeugdhulpaanbieder en de gecertificeerde
      instelling daarvan met redenen omkleed mededeling aan de klager en de klachtencommissie, onder vermelding van de
      termijn waarbinnen de jeugdhulpaanbieder of de gecertificeerde instelling zijn standpunt aan hen kenbaar zal maken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
  - number: 4.2.1.6
    text: |-
      [Titel 9.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op klachten als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 4.2.2
    text: |-
      Indien een klacht zich richt op een ernstige situatie met een structureel karakter, stelt de klachtencommissie
      de jeugdhulpaanbieder of de gecertificeerde instelling daarvan in kennis. Indien de klachtencommissie niet is
      gebleken dat de jeugdhulpaanbieder of de gecertificeerde instelling ter zake maatregelen heeft getroffen, meldt de
      klachtencommissie deze klacht aan de ingevolge deze wet met het toezicht belaste ambtenaren. Onder een klacht over
      een ernstige situatie wordt verstaan een klacht over een situatie waarbij sprake is van onverantwoorde hulp.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.2
  - number: 4.2.3
    text: |-
      De [artikelen 4.2.1][ref1] en [4.2.2][ref2] zijn niet van toepassing op klachten ten aanzien van jeugdigen die
      op grond van een andere wet onvrijwillig in een accommodatie zijn opgenomen, voor zover deze overeenkomstig een
      bijzondere wettelijke regeling door een klachtencommissie kunnen worden behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.4.1
    text: |-
      De [artikelen 4.2.5 tot en met 4.2.12][ref1] zijn uitsluitend van toepassing op jeugdhulpaanbieders en
      gecertificeerde instellingen die jeugdhulp doen verlenen onderscheidenlijk hun taken laten uitvoeren door in de
      regel meer dan tien personen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.4.2
    text: |-
      Indien de jeugdhulpaanbieder of de gecertificeerde instelling de jeugdhulp onderscheidenlijk de uitvoering van haar
      taken zodanig heeft georganiseerd dat daarbij sprake is van meerdere te onderscheiden organisatorische verbanden of
      locaties, is het eerste lid van toepassing op ieder afzonderlijk verband of iedere afzonderlijke locatie.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.4
  - number: 4.2.4.3
    text: |-
      Deze paragraaf is niet van toepassing op een gecertificeerde instelling die tevens een door Onze Minister
      van Veiligheid en Justitie aanvaarde rechtspersoon is als bedoeld in de [artikelen 256, eerste lid][ref1], en
      [302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.4
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '256'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
  - number: 4.2.5.1
    text: |-
      Iedere jeugdhulpaanbieder en iedere gecertificeerde instelling stelt een cliëntenraad in, die binnen het kader van
      hun doelstelling in het bijzonder de gemeenschappelijke belangen van jeugdigen en ouders aan wie jeugdhulp wordt
      verleend of ten aanzien van wie een kinderbeschermingsmaatregel of jeugdreclassering wordt uitgevoerd, behartigt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.2
    text: 'De jeugdhulpaanbieder en de gecertificeerde instelling regelen schriftelijk:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.2.a
    text: |-
      het aantal leden van de cliëntenraad, de wijze van benoeming, welke personen tot lid kunnen worden benoemd en de
      zittingsduur van de leden, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.2.b
    text: de materiële middelen waarover de cliëntenraad ten behoeve van zijn werkzaamheden kan beschikken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.3
    text: 'De in het tweede lid bedoelde regeling is zodanig dat de cliëntenraad:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.3.a
    text: |-
      redelijkerwijze representatief kan worden geacht voor de jeugdigen en ouders aan wie jeugdhulp wordt verleend of
      ten aanzien van wie een kinderbeschermingsmaatregel of jeugdreclassering wordt uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.3.b
    text: redelijkerwijze in staat kan worden geacht hun gemeenschappelijke belangen te behartigen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.4
    text: De cliëntenraad regelt schriftelijk zijn werkwijze met inbegrip van zijn vertegenwoordiging in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.5.5
    text: |-
      De kosten van het voeren van rechtsgedingen door de cliëntenraad, bedoeld in [artikel 4.2.11, tweede lid][ref1],
      komen slechts ten laste van de jeugdhulpaanbieder en de gecertificeerde instelling, indien deze van de te maken
      kosten vooraf in kennis zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.5.6
    text: |-
      Na vaststelling van de in het tweede lid bedoelde regeling treffen de jeugdhulpaanbieder en de gecertificeerde
      instelling de voorzieningen die op grond van die regeling noodzakelijk zijn voor de benoeming van de leden van
      de cliëntenraad. De jeugdhulpaanbieder en de gecertificeerde instelling treffen de bedoelde voorzieningen opnieuw
      telkens wanneer de cliëntenraad gedurende twee jaren niet heeft gefunctioneerd wegens het ontbreken van het in de
      regeling vastgestelde aantal leden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.5
  - number: 4.2.6.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling stellen de cliëntenraad in ieder geval in de gelegenheid
      advies uit te brengen over elk voorgenomen besluit dat de jeugdhulpaanbieder, de gecertificeerde instelling of
      een of meer van de door een jeugdhulpaanbieder of gecertificeerde instelling in stand gehouden organisatorische
      verbanden of locaties betreft, inzake:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.a
    text: een wijziging van de doelstelling of grondslag;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.b
    text: |-
      het overdragen van de zeggenschap of fusie of het aangaan of verbreken van de samenwerking met een andere
      jeugdhulpaanbieder;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.c
    text: |-
      de gehele of gedeeltelijke opheffing, verhuizing of ingrijpende verbouwing van de locatie waarin de jeugdhulp wordt
      geboden;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.d
    text: een belangrijke wijziging in de organisatie;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.e
    text: een belangrijke inkrimping, uitbreiding of andere wijziging van de werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.f
    text: het benoemen van personen die rechtstreeks de hoogste zeggenschap zullen uitoefenen bij de leiding van de arbeid;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.g
    text: de begroting en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.h
    text: het algemeen beleid inzake de aanvang en de beëindiging van de hulpverlening;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.i
    text: voedingsaangelegenheden van algemene aard;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.j
    text: |-
      het algemene beleid op het gebied van de veiligheid, de gezondheid en de hygiëne en de geestelijke verzorging van,
      de maatschappelijke bijstand aan en recreatiemogelijkheden en ontspanningsactiviteiten voor jeugdigen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.k
    text: de systematische bewaking, beheersing of verbetering van de kwaliteit van de te verlenen hulp;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.1.l
    text: |-
      de vaststelling of wijziging van een regeling inzake de behandeling van klachten en de aanwijzing van personen die
      belast worden met de behandeling van klachten, bedoeld in [artikel 4.2.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.6.1.m
    text: |-
      wijziging van de regeling, bedoeld in [artikel 4.2.5, tweede lid][ref1], en de vaststelling of wijziging van
      andere regelingen die gelden voor jeugdigen en ouders aan wie jeugdhulp wordt verleend of ten aanzien van wie een
      kinderbeschermingsmaatregel of jeugdreclassering wordt uitgevoerd, of


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.6.1.n
    text: |-
      het belasten van personen met de leiding van dat onderdeel van het jeugdhulpaanbod waarin gedurende het etmaal
      jeugdhulp wordt verleend aan jeugdigen die in de regel langdurig in de accommodatie verblijven.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.2
    text: Het advies wordt op een zodanig tijdstip gevraagd dat het wezenlijk van invloed kan zijn op het te nemen besluit.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.6.3
    text: |-
      De cliëntenraad is bevoegd de jeugdhulpaanbieder of de gecertificeerde instelling ook ongevraagd te adviseren
      inzake de in het eerste lid genoemde en andere onderwerpen die van belang zijn voor de jeugdigen en ouders aan
      wie jeugdhulp wordt verleend of ten aanzien van wie een kinderbeschermingsmaatregel of jeugdreclassering wordt
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.6
  - number: 4.2.7.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling nemen geen van een schriftelijk uitgebracht advies afwijkend
      besluit dan nadat daarover, voor zover dat redelijkerwijs mogelijk is, ten minste eenmaal met de cliëntenraad
      overleg is gepleegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.7
  - number: 4.2.7.2
    text: |-
      Ten aanzien van de onderwerpen, genoemd in [artikel 4.2.6, eerste lid, onderdelen i tot en met m][ref1],
      nemen de jeugdhulpaanbieder en de gecertificeerde instelling, behoudens voor zover het besluit door de
      jeugdhulpaanbieder of de gecertificeerde instelling moet worden genomen krachtens een wettelijk voorschrift, geen
      van een door de cliëntenraad schriftelijk uitgebracht advies afwijkend besluit, tenzij de commissie, bedoeld in
      [artikel 4.2.11, eerste lid][ref2], heeft vastgesteld dat de jeugdhulpaanbieder of de gecertificeerde instelling
      bij afweging van de betrokken belangen in redelijkheid tot zijn voornemen heeft kunnen komen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.7.3
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling doen van een besluit inzake een onderwerp waarover de
      cliëntenraad schriftelijk advies heeft uitgebracht, schriftelijk, en voor zover hij van het advies afwijkt onder
      opgave van redenen, mededeling aan de cliëntenraad.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.7
  - number: 4.2.7.4
    text: |-
      Een besluit van de jeugdhulpaanbieder of een gecertificeerde instelling, genomen in strijd met het tweede lid,
      is nietig, indien de cliëntenraad tegenover de jeugdhulpaanbieder of de gecertificeerde instelling schriftelijk
      een beroep op de nietigheid heeft gedaan. De cliëntenraad kan slechts een beroep op de nietigheid doen binnen een
      maand nadat de jeugdhulpaanbieder of de gecertificeerde instelling hem zijn besluit heeft medegedeeld dan wel bij
      gebreke van deze mededeling, de cliëntenraad is gebleken dat de jeugdhulpaanbieder of de gecertificeerde instelling
      uitvoering of toepassing geeft aan zijn besluit.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.7
  - number: 4.2.8.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling verstrekken de cliëntenraad tijdig, en desgevraagd, alle
      inlichtingen en gegevens die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.8
  - number: 4.2.8.2
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling verstrekken de cliëntenraad voorts ten minste eenmaal per
      jaar mondeling of schriftelijk algemene gegevens omtrent het beleid dat in het verstreken tijdvak is gevoerd en in
      het komende jaar zal worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.8
  - number: 4.2.9.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling kunnen aan de cliëntenraad schriftelijk verdergaande
      bevoegdheden dan de in deze paragraaf genoemde bevoegdheden toekennen. Een zodanig besluit wordt schriftelijk aan
      de cliëntenraad medegedeeld.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.9
  - number: 4.2.9.2
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling stellen de cliëntenraad in de gelegenheid advies uit te
      brengen over een voornemen een besluit te nemen als bedoeld in het eerste lid en over het voornemen een zodanig
      besluit te wijzigen. [Artikel 4.2.7][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.10.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling waarborgen, indien zij een rechtspersoon zijn als bedoeld
      in [artikel 3 van Boek 2 van het Burgerlijk Wetboek][ref1], in de statuten dat de jeugdigen en ouders aan wie
      jeugdhulp wordt verleend of ten aanzien van wie een kinderbeschermingsmaatregel of jeugdreclassering wordt
      uitgevoerd, invloed kunnen uitoefenen op de samenstelling van het bestuur. De regeling houdt ten minste in dat
      één bestuurslid wordt benoemd op bindende voordracht van de cliëntenraad of cliëntenraden, tenzij deze van de
      mogelijkheid een voordracht te doen geen gebruik heeft onderscheidenlijk hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.10
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '3'
  - number: 4.2.10.2
    text: |-
      Het eerste lid is niet van toepassing indien het bestuur van de jeugdhulpaanbieder of de gecertificeerde instelling
      bestaat uit één of meer personen die deze functie uitoefent onderscheidenlijk uitoefenen op grond van een
      arbeidsrelatie waaraan een geldelijke beloning is verbonden. In dat geval is het eerste lid van overeenkomstige
      toepassing op de samenstelling van het orgaan dat belast is met het toezicht op of de goedkeuring van besluiten van
      het bestuur.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.10
  - number: 4.2.11.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling stellen in overeenstemming met de cliëntenraad of
      cliëntenraden een uit drie leden bestaande commissie van vertrouwenslieden in, waarvan één lid door hen wordt
      aangewezen, één lid door de cliëntenraad of cliëntenraden kan worden aangewezen en één lid door beide andere
      leden wordt aangewezen, of wijzen een door één of meer cliëntenorganisaties en één of meer organisaties van
      jeugdhulpaanbieders of gecertificeerde instellingen ingestelde commissie van vertrouwenslieden aan die tot taak
      heeft te bemiddelen en zo nodig een bindende uitspraak te doen:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.11
  - number: 4.2.11.1.a
    text: |-
      op verzoek van de cliëntenraad, in geschillen met de jeugdhulpaanbieder of de gecertificeerde instelling over
      de uitvoering van de [artikelen 4.2.6][ref1], [4.2.7, eerste en derde lid][ref2], [4.2.8, eerste lid][ref3], en
      [4.3.2][ref4], of


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.2.11.1.b
    text: |-
      op verzoek van de jeugdhulpaanbieder of de gecertificeerde instelling, indien deze ten aanzien van een onderwerp,
      genoemd in [artikel 4.2.6, eerste lid, onderdelen i tot en met m][ref1], waarover door de cliëntenraad een
      schriftelijk advies is uitgebracht, een van dat advies afwijkend besluit wenst te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.2.11.2
    text: |-
      De cliëntenraad en iedere jeugdige of ouder aan wie de jeugdhulpaanbieder jeugdhulp verleent of ten aanzien
      van wie de gecertificeerde instelling een kinderbeschermingsmaatregel of jeugdreclassering uitvoert, kunnen de
      kantonrechter van de rechtbank van het arrondissement waarin de vestigingsplaats van de jeugdhulpaanbieder of
      de gecertificeerde instelling is gelegen, schriftelijk verzoeken de jeugdhulpaanbieder of de gecertificeerde
      instelling te bevelen de [artikelen 4.2.5][ref1], [4.2.8, tweede lid][ref2], [4.2.10][ref3] en [4.3.2][ref4] en het
      eerste lid van dit artikel na te leven. Een verzoeker die niet vooraf schriftelijk aan de jeugdhulpaanbieder of de
      gecertificeerde instelling heeft verzocht te handelen overeenkomstig hetgeen in het verzoekschrift wordt verzocht
      en deze daarbij niet een redelijke termijn heeft gegeven om aan dat verzoek te voldoen, wordt niet-ontvankelijk
      verklaard.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.2.11.3
    text: |-
      De kantonrechter kan in zijn beschikking aan de jeugdhulpaanbieder of de gecertificeerde instelling de verplichting
      opleggen bepaalde handelingen te verrichten of na te laten.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.11
  - number: 4.2.11.4
    text: |-
      De bepalingen van de
      [derde afdeling van de vijfde titel van het tweede boek van het Wetboek van Burgerlijke Rechtsvordering][ref1] zijn
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#AfdelingDerde
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.11
    references:
      - id: ref1
        bwb_id: BWBR0001827
        afdeling: Derde
  - number: 4.2.12.1
    text: |-
      De pleegzorgaanbieder stelt een pleegouderraad in, die binnen het kader van zijn doelstelling de gemeenschappelijke
      belangen van de pleegouders behartigt. Een pleegzorgaanbieder kan deze verplichting ook nakomen door instelling van
      een pleegouderraad die voor meer dan één door hem in stand gehouden zorgeenheid werkzaam is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.12
  - number: 4.2.12.2
    text: |-
      De [artikelen 4.2.5 tot en met 4.2.11][ref1] zijn van overeenkomstige toepassing met dien verstande dat
      voor «cliëntenraad» respectievelijk «jeugdhulpaanbieder» wordt gelezen «pleegouderraad» respectievelijk
      «pleegzorgaanbieder».


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.2.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.1.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling stellen elk jaarlijks een verslag op over de naleving van
      deze wet in het voorafgaande jaar met betrekking tot regels omtrent de kwaliteit van de jeugdhulp onderscheidenlijk
      de kwaliteit van de uitvoering van de taken, het klachtrecht en de medezeggenschap.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2
    text: |-
      In het in het eerste lid bedoelde verslag geven de jeugdhulpaanbieder en de gecertificeerde instelling in ieder
      geval aan:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2.a
    text: of en op welke wijze zij jeugdigen en hun ouders bij hun kwaliteitsbeleid hebben betrokken;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2.b
    text: |-
      de frequentie waarmee en de wijze waarop binnen de instelling kwaliteitsbeoordeling plaatsvond en het resultaat
      daarvan;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2.c
    text: welk gevolg zij hebben gegeven aan klachten en meldingen over de kwaliteit van de verleende hulp;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2.d
    text: |-
      een beknopte beschrijving van de klachtenregeling, bedoeld in [artikel 4.2.1, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.1.2.e
    text: |-
      de wijze waarop zij de klachtenregeling onder de aandacht hebben gebracht van betrokken jeugdigen, ouders en
      pleegouders;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2.f
    text: |-
      de samenstelling van de klachtencommissie, bedoeld in [artikel 4.2.1, tweede lid, onderdeel a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.1.2.g
    text: |-
      in welke mate de klachtencommissie haar werkzaamheden heeft kunnen verrichten met inachtneming van de waarborgen,
      bedoeld in [artikel 4.2.1, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.1.2.h
    text: het aantal en de aard van de door de klachtencommissie behandelde klachten;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2.i
    text: de strekking van de oordelen en aanbevelingen van de klachtencommissie;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
  - number: 4.3.1.2.j
    text: |-
      de aard van de maatregelen, bedoeld in [artikel 4.2.1, vijfde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.1.2.k
    text: |-
      op welke wijze de [artikelen 4.2.7 tot en met 4.2.11][ref1] zijn toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.1.3
    text: |-
      Bij regeling van Onze Ministers kunnen nadere regels worden gesteld met betrekking tot het verslag en kan worden
      bepaald dat het eerste lid, dan wel onderdelen van het tweede lid, niet van toepassing zijn op jeugdhulpaanbieders
      als bedoeld in [artikel 1.1, onderdeel 2°][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 4.3.2.1
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling maken binnen tien dagen na vaststelling van het verslag
      bedoeld in [artikel 4.3.1, eerste lid][ref1], doch uiterlijk voor 1 juni van het jaar volgend op het jaar waarop
      het verslag ziet, de volgende zaken openbaar:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 4.3.2.1.a
    text: het verslag;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
  - number: 4.3.2.1.b
    text: |-
      de op schrift gestelde uitgangspunten voor het beleid, waaronder begrepen de algemene criteria, welke bij de
      verlening van jeugdhulp onderscheidenlijk de uitvoering van de taken worden gehanteerd;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
  - number: 4.3.2.1.c
    text: |-
      de notulen dan wel de besluitenlijst van de vergaderingen van het bestuur, voor zover deze algemene beleidszaken
      betreffen, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
  - number: 4.3.2.1.d
    text: |-
      de klachtenregeling, bedoeld in [artikel 4.2.1, eerste lid][ref1], en van andere voor jeugdigen en ouders geldende
      regelingen, alsmede een regeling als bedoeld in [artikel 4.2.5, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 4.3.2.2
    text: |-
      De openbaarmaking geschiedt op een door de jeugdhulpaanbieder of de gecertificeerde instelling te bepalen wijze.
      Zij verstrekken de jeugdigen en ouders op hun verzoek een afschrift.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
  - number: 4.3.2.3
    text: |-
      Van de openbaarmaking wordt mededeling gedaan op de bij de jeugdhulpaanbieder en de gecertificeerde instelling voor
      het doen van mededelingen aan jeugdigen en hun ouders gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
  - number: 4.3.2.4
    text: |-
      Voor het op verzoek verstrekken van afschriften kan een tarief in rekening worden gebracht, ten hoogste gelijk aan
      de kostprijs, tenzij ten aanzien van de jeugdhulpaanbieder of de gecertificeerde instelling de Wet openbaarheid van
      bestuur van toepassing is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
  - number: 4.3.2.5
    text: |-
      De jeugdhulpaanbieder en de gecertificeerde instelling zenden het verslag voor 1 juni van het jaar van vaststelling
      aan Onze Ministers en aan de ingevolge [artikel 9.2][ref1] met het toezicht belaste ambtenaar, alsmede aan
      organisaties die in de regio de belangen van de jeugdigen, ouders of pleegouders in algemene zin behartigen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel4.3.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 5.1.1
    text: 'De pleegzorgaanbieder sluit een pleegcontract met een pleegouder indien deze voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.1
  - number: 5.1.1.a
    text: de pleegouder heeft ten minste de leeftijd van eenentwintig jaar bereikt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.1
  - number: 5.1.1.b
    text: de pleegouder is niet tevens door de pleegzorgaanbieder belast met de begeleiding van een pleegouder;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.1
  - number: 5.1.1.c
    text: |-
      de pleegouder heeft met goed gevolg een door de pleegzorgaanbieder aangeboden voorbereidings- en selectietraject
      afgerond, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.1
  - number: 5.1.1.d
    text: |-
      de pleegouder beschikt over een verklaring van geen bezwaar die is afgegeven door de raad voor de
      kinderbescherming, waaruit blijkt dat er geen bezwarende feiten en omstandigheden zijn voor de plaatsing van een
      jeugdige. Deze voorwaarde is van overeenkomstige toepassing op alle personen van twaalf jaar en ouder die als
      inwonenden op het adres van de pleegouder staan ingeschreven. De verklaring is vereist voorafgaand aan de plaatsing
      van een eerste jeugdige, bij een wisseling van pleegzorgaanbieder, bij de komst van nieuwe inwonenden en indien de
      pleegouder gedurende twee jaren geen pleegouder is geweest.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.1
  - number: 5.1.2
    text: |-
      De pleegzorgaanbieder beoordeelt voorts of de jeugdige in het gezin van de pleegouder kan worden geplaatst, gelet
      op de leeftijd en de problemen van de jeugdige, de samenstelling van het gezin van de pleegouder en de verwachte
      duur van de plaatsing. Deze beoordeling vindt plaats voorafgaand aan de sluiting van het pleegcontract en aan de
      plaatsing van de jeugdige in het gezin van de pleegouder.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.1
  - number: 5.1.3
    text: |-
      Indien de betrokkene de jeugdige reeds verzorgt en opvoedt voorafgaand aan het sluiten van een pleegcontract,
      kan in afwijking van het eerste lid, onder c en d, en het tweede lid, aan de in die artikelonderdelen bedoelde
      voorwaarden worden voldaan binnen dertien weken nadat een pleegcontract is gesloten, mits de betrokken
      pleegzorgaanbieder daarbij oordeelt dat de verzorging en opvoeding van de jeugdige door betrokkene niet schadelijk
      is voor de ontwikkeling van de jeugdige. De betrokkene heeft er recht op dat de pleegzorgaanbieder binnen dertien
      weken na het sluiten van het pleegcontract vaststelt of aan de in de eerste volzin bedoelde voorwaarden is voldaan.
      Zodra tijdens die periode blijkt dat niet aan de voorwaarden zal worden voldaan, kan het pleegcontract onverwijld
      beëindigd worden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.1
  - number: 5.2.1
    text: |-
      Het pleegcontract bevat in ieder geval afspraken omtrent de wijze waarop de verzorging en opvoeding van de
      desbetreffende jeugdige door de pleegouder worden uitgevoerd en de begeleiding die zij daarbij ontvangen van de
      pleegzorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.2
  - number: 5.2.2
    text: |-
      De afspraken over de begeleiding van een pleegoudervoogd beperken zich tot een begeleiding van één gesprek per
      jaar, tenzij de pleegoudervoogd verzoekt om meer begeleiding.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.2
  - number: 5.3.1
    text: |-
      Een pleegzorgaanbieder verstrekt aan een pleegouder een vergoeding voor de verzorging en opvoeding van de in het
      gezin van de pleegouder geplaatste jeugdige, bestaande uit een basisbedrag, welk bedrag kan worden vermeerderd
      met een toeslag, of verminderd met een korting. Daarnaast verstrekt een pleegzorgaanbieder een vergoeding van
      bijzondere kosten aan pleegouders.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.3
  - number: 5.3.2
    text: 'Bij regeling van Onze Ministers worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.3
  - number: 5.3.2.a
    text: |-
      de hoogte van het basisbedrag en het maximale bedrag van de toeslagen, welke bedragen voor de onderscheiden
      leeftijdscategorieën van jeugdigen kunnen verschillen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.3
  - number: 5.3.2.b
    text: de omstandigheden waaronder een toeslag of een korting wordt verleend of toegepast;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.3
  - number: 5.3.2.c
    text: de dagen waarover het basisbedrag en de toeslagen worden verleend en de kortingen worden toegepast, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.3
  - number: 5.3.2.d
    text: |-
      de vergoeding van bijzondere kosten die de pleegouder maakt ten behoeve van de jeugdige, waaronder de gevallen
      waarin bijzondere kosten worden vergoed.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.3
  - number: '5.4'
    text: |-
      De pleegzorgaanbieder verstrekt aan de pleegouder in het belang van de verzorging en de opvoeding van de
      desbetreffende jeugdige, zo nodig zonder toestemming en zo mogelijk voorafgaand aan de plaatsing, inlichtingen
      inzake feiten en omstandigheden die de persoon van de jeugdige of diens verzorging of opvoeding betreffen en
      die noodzakelijk zijn voor de uitoefening van de taak van de pleegouder. Deze inlichtingen kunnen mede omvatten
      persoonsgegevens betreffende de gezondheid, bedoeld in [artikel 21 van de Wet bescherming persoonsgegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011468#Artikel21
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0011468
        artikel: '21'
  - number: 6.1.1.1
    text: |-
      Dit hoofdstuk is van toepassing op minderjarigen, alsmede op jeugdigen die achttien jaar zijn en
      ten aanzien van wie op het tijdstip waarop zij achttien werden, een machtiging op grond van dit
      hoofdstuk gold. Laatstbedoelde jeugdigen worden voor de toepassing van dit hoofdstuk, onverminderd
      [artikel 233 van Boek 1 van het Burgerlijk Wetboek][ref1], als minderjarigen beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel233
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.1
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '233'
  - number: 6.1.1.2
    text: |-
      In zaken betrekking hebbende op de toepassing van dit hoofdstuk is een minderjarige die de leeftijd van twaalf jaar
      heeft bereikt, bekwaam in en buiten rechte op te treden. Hetzelfde geldt indien de minderjarige de leeftijd van
      twaalf jaar nog niet heeft bereikt, maar in staat kan worden geacht tot een redelijke waardering van zijn belangen
      ter zake.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.1
  - number: 6.1.2.1
    text: |-
      De kinderrechter kan op verzoek een machtiging verlenen om een jeugdige in een gesloten accommodatie te doen
      opnemen en te doen verblijven.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.2
    text: 'Een machtiging kan slechts worden verleend indien naar het oordeel van de kinderrechter:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.2.a
    text: |-
      jeugdhulp noodzakelijk is in verband met ernstige opgroei- of opvoedingsproblemen die de ontwikkeling van de
      jeugdige naar volwassenheid ernstig belemmeren, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.2.b
    text: |-
      de opneming en het verblijf noodzakelijk zijn om te voorkomen dat de jeugdige zich aan deze jeugdhulp onttrekt of
      daaraan door anderen wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.3
    text: |-
      Een machtiging voor een jeugdige die de leeftijd van achttien jaar nog niet heeft bereikt, kan bovendien slechts
      worden verleend indien:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.3.a
    text: de jeugdige onder toezicht is gesteld;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.3.b
    text: de voogdij over de jeugdige berust bij een gecertificeerde instelling, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.3.c
    text: |-
      degene die, anders dan bedoeld onder b, de wettelijke vertegenwoordiger is, met de opneming en het verblijf
      instemt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.4
    text: 'Een machtiging voor een jeugdige die achttien jaar is, kan bovendien slechts worden verleend indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.4.a
    text: sprake is van een behandeling die reeds aangevangen is voordat de leeftijd van achttien jaar is bereikt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.4.b
    text: voor het bereiken van de leeftijd van achttien jaar een hulpverleningsplan is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.4.c
    text: |-
      toegewerkt wordt naar een andere vorm van jeugdhulp dan gesloten jeugdhulp en dit ook blijkt uit het
      hulpverleningsplan, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.4.d
    text: de gesloten jeugdhulp niet langer duurt dan zes maanden na het bereiken van de leeftijd van achttien jaar.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.5
    text: |-
      Een machtiging kan voorts slechts worden verleend indien het college van de gemeente waar de jeugdige zijn
      woonplaats heeft, of de gecertificeerde instelling die de ondertoezichtstelling uitvoert of de voogdij uitoefent,
      heeft bepaald dat een voorziening op het gebied van jeugdhulp en verblijf niet zijnde verblijf bij een pleegouder
      nodig is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.6
    text: |-
      Het verzoek behoeft de instemming van een gekwalificeerde gedragswetenschapper die de jeugdige met het oog daarop
      kort tevoren heeft onderzocht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.7
    text: |-
      In afwijking van het vijfde lid kan de kinderrechter, ten aanzien van een jeugdige die onder toezicht is gesteld
      of ten aanzien van wie tevens een ondertoezichtstelling wordt verzocht, dan wel ten aanzien van wie door een
      gecertificeerde instelling voogdij wordt uitgeoefend, ook een machtiging verlenen indien de gecertificeerde
      instelling die de ondertoezichtstelling uitvoert of de voogdij uitoefent of het college niet heeft bepaald dat
      de jeugdige een voorziening, inhoudende gesloten jeugdhulp, nodig heeft, doch slechts indien de raad voor de
      kinderbescherming heeft verklaard dat een geval als bedoeld in het tweede lid, zich voordoet. Het zesde lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
  - number: 6.1.2.8
    text: |-
      Indien de machtiging betrekking heeft op een minderjarige die onder toezicht is gesteld, geldt de machtiging als
      een machtiging als bedoeld in [artikel 265b van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265b
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 265b
  - number: 6.1.2.9
    text: |-
      Indien de wettelijke vertegenwoordiger zijn instemming intrekt, kan de jeugdige gedurende ten hoogste veertien
      dagen in de gesloten accommodatie verblijven, en zijn de [paragrafen 6.3][ref1], [6.4][ref2] en [6.5][ref3] op de
      jeugdige van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.1.3.1
    text: |-
      De kinderrechter kan, indien een machtiging niet kan worden afgewacht, op verzoek een spoedmachtiging verlenen om
      een jeugdige, met inachtneming van [artikel 6.1.2, derde lid][ref1], in een gesloten accommodatie te doen opnemen
      en te doen verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.3.2
    text: 'Een spoedmachtiging kan slechts worden verleend indien naar het oordeel van de kinderrechter:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.3
  - number: 6.1.3.2.a
    text: |-
      onmiddellijke verlening van jeugdhulp noodzakelijk is in verband met ernstige opgroei- of opvoedingsproblemen van
      de jeugdige die zijn ontwikkeling naar volwassenheid ernstig belemmeren, of een ernstig vermoeden daarvan, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.3
  - number: 6.1.3.2.b
    text: |-
      de opneming en het verblijf noodzakelijk zijn om te voorkomen dat de jeugdige zich aan deze jeugdhulp onttrekt of
      daaraan door anderen wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.3
  - number: 6.1.3.3
    text: |-
      Het verzoek behoeft de instemming van een gekwalificeerde gedragswetenschapper die de jeugdige met het oog daarop
      kort tevoren heeft onderzocht, tenzij onderzoek feitelijk onmogelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.3
  - number: 6.1.3.4
    text: |-
      [Artikel 6.1.2, achtste lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.3.5
    text: |-
      Indien de wettelijke vertegenwoordiger zijn instemming intrekt, kan de jeugdige gedurende ten hoogste de
      geldigheidsduur van de spoedmachtiging in de gesloten accommodatie verblijven, en zijn de [paragrafen 6.3][ref1],
      [6.4][ref2] en [6.5][ref3] op de jeugdige van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.4'
      - id: ref3
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.5'
  - number: 6.1.4.1
    text: |-
      De kinderrechter kan op verzoek een voorwaardelijke machtiging verlenen om een jeugdige, met inachtneming van
      [artikel 6.1.2, derde lid][ref1], in een gesloten accommodatie te doen opnemen en te doen verblijven.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.4.2
    text: 'Een voorwaardelijke machtiging kan slechts worden verleend, indien naar het oordeel van de kinderrechter:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.2.a
    text: |-
      de verlening van jeugdhulp noodzakelijk is in verband met ernstige opgroei- of opvoedingsproblemen die de
      ontwikkeling naar volwassenheid ernstig belemmeren, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.2.b
    text: |-
      de opneming en het verblijf noodzakelijk zijn om te voorkomen dat de jeugdige zich aan deze jeugdhulp onttrekt
      of daaraan door anderen wordt onttrokken en de ernstige belemmering in de ontwikkeling naar volwassenheid alleen
      buiten de accommodatie kan worden afgewend door het stellen en naleven van voorwaarden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.3
    text: |-
      Een voorwaardelijke machtiging kan voorts slechts worden verleend indien het college van de gemeente waar de
      jeugdige zijn woonplaats heeft, of de gecertificeerde instelling die de ondertoezichtstelling uitvoert of de
      voogdij uitoefent, heeft bepaald dat de jeugdige een voorziening op het gebied van jeugdhulp nodig heeft.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.4
    text: |-
      Het verzoek behoeft de instemming van een gekwalificeerde gedragswetenschapper die de jeugdige met het oog daarop
      kort tevoren heeft onderzocht.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.5
    text: De kinderrechter verleent een voorwaardelijke machtiging slechts indien een hulpverleningsplan wordt overgelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.6
    text: |-
      Het hulpverleningsplan bevat een omschrijving van de voorwaarden en het toezicht daarop en van de jeugdhulp die zal
      worden ingezet teneinde de opgroei- en opvoedproblemen te verminderen, te stabiliseren, op te heffen of om te gaan
      met de opgroei- en opvoedproblemen. Het plan wordt opgesteld door de jeugdhulpaanbieder die de jeugdhulp opgenomen
      in de voorwaarden zal bieden en de jeugdhulpaanbieder die bereid is de jeugdige op te nemen in een gesloten
      accommodatie als bedoeld in het eerste lid, als de jeugdige de voorwaarden niet naleeft of als de opneming en het
      verblijf noodzakelijk zijn om te voorkomen dat de jeugdige zich aan de jeugdhulp die hij nodig heeft, onttrekt of
      daaraan door anderen wordt onttrokken. Het plan vermeldt welke medewerker van de jeugdhulpaanbieder bevoegd is tot
      het nemen van het besluit dat de jeugdige opgenomen wordt omdat hij zich niet houdt aan de vooraf overeengekomen
      voorwaarden of de opneming en het verblijf noodzakelijk zijn om te voorkomen dat de jeugdige zich aan de jeugdhulp
      die hij nodig heeft onttrekt of daaraan door anderen wordt onttrokken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.7
    text: |-
      Het verlenen van een voorwaardelijke machtiging geschiedt onder de voorwaarde dat de jeugdige de jeugdhulp
      aanvaardt, overeenkomstig het overgelegde hulpverleningsplan. [Artikel 7.3.4, tweede en derde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 6.1.4.8
    text: |-
      Naast de in het zevende lid bedoelde voorwaarde kan de kinderrechter bij de voorwaardelijke machtiging voorwaarden
      stellen betreffende het gedrag van de jeugdige voor zover dit gedrag de ernstige opgroei- en opvoedproblemen
      beïnvloedt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.9
    text: |-
      De rechter geeft slechts toepassing aan het eerste lid, indien de jeugdige zich bereid heeft verklaard tot naleving
      van de voorwaarden of redelijkerwijs is aan te nemen dat de voorwaarden zullen worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.10
    text: |-
      De jeugdhulpaanbieder die bereid is de jeugdige op te nemen in een gesloten accommodatie draagt er zorg voor dat
      de jeugdige zo spoedig mogelijk in het bezit wordt gesteld van een schriftelijk overzicht van de op grond van deze
      wet aan hem toekomende rechten. De jeugdhulpaanbieder draagt er tevens zorg voor dat de jeugdige een mondelinge
      toelichting ter zake ontvangt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.4.11
    text: |-
      Op een verzoek tot verlenging van een voorwaardelijke machtiging zijn het tweede tot en met tiende lid van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.4
  - number: 6.1.5
    text: |-
      Het hulpverleningsplan, bedoeld in [artikel 6.1.4, zesde lid][ref1], kan, nadat de voorwaardelijke machtiging is
      verleend, slechts met instemming van de jeugdige door de jeugdhulpaanbieder worden gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.6.1
    text: |-
      De jeugdhulpaanbieder die bereid is de jeugdige op te nemen in een gesloten accommodatie als bedoeld in
      [artikel 6.1.4, zesde lid][ref1], ziet toe op de naleving van de voorwaarden.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.6.2
    text: |-
      De jeugdhulpaanbieder, bedoeld in het eerste lid, doet de jeugdige opnemen in een gesloten accommodatie, indien
      door de naleving van de voorwaarden buiten de gesloten accommodatie de ernstige belemmering van de ontwikkeling
      naar volwassenheid als gevolg van de ernstige opgroei- of opvoedingsproblemen, niet langer kan worden afgewend en
      de jeugdige zich onttrekt of door anderen wordt onttrokken aan de jeugdhulp.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.6
  - number: 6.1.6.3
    text: |-
      De jeugdhulpaanbieder, bedoeld in het eerste lid, kan de jeugdige doen opnemen, wanneer deze de gestelde
      voorwaarden niet naleeft waardoor de jeugdige ernstig wordt belemmerd in de ontwikkeling naar volwassenheid en deze
      ernstige belemmering niet buiten de gesloten accommodatie kan worden afgewend.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.6
  - number: 6.1.6.4
    text: |-
      Voorafgaand aan de opneming stelt de jeugdhulpaanbieder, bedoeld in het eerste lid, zich op de hoogte van de
      actuele toestand van de ernstige opgroei- of opvoedingsproblemen die de jeugdige heeft die zijn ontwikkeling naar
      volwassenheid ernstig belemmeren.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.6
  - number: 6.1.6.5
    text: |-
      De opneming en het verblijf vinden plaats voor ten hoogste de resterende geldigheidsduur van de voorwaardelijke
      machtiging, doch niet langer dan zes maanden. De voorwaardelijke machtiging geldt vanaf het moment
      van de beslissing van de jeugdhulpaanbieder, bedoeld in het eerste lid, als machtiging als bedoeld in
      [artikel 6.1.2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.6.6
    text: |-
      De jeugdhulpaanbieder, bedoeld in het eerste lid, stelt de jeugdige uiterlijk vier dagen na zijn beslissing
      de jeugdige op te nemen, daarvan schriftelijk in kennis onder mededeling van de redenen van de beslissing. Een
      afschrift van de mededeling wordt zo spoedig mogelijk gezonden aan de verzoeker van de machtiging, de advocaat van
      de jeugdige en aan de griffier van de rechtbank die de voorwaardelijke machtiging heeft verleend.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.6
  - number: 6.1.6.7
    text: |-
      Indien een beslissing als bedoeld in het tweede lid betrekking heeft op een minderjarige
      die onder toezicht is gesteld, geldt die beslissing als machtiging als bedoeld in
      [artikel 265b van Boek 1 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265b
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.6
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 265b
  - number: 6.1.7.1
    text: |-
      Op verzoek van de wettelijk vertegenwoordiger of de jeugdige kan de kinderrechter de wijziging
      van het hulpverleningsplan, bedoeld in [artikel 6.1.5][ref1], en de opneming, bedoeld in
      [artikel 6.1.6, tweede of derde lid][ref2], geheel of gedeeltelijk vervallen verklaren. Bij het verzoek wordt een
      afschrift van de beslissing van de jeugdhulpaanbieder gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.7.2
    text: |-
      Indien het verzoek betrekking heeft op een jeugdige die reeds in een gesloten accommodatie verblijft, beslist
      de kinderrechter in elk geval binnen drie weken na het indienen van het verzoekschrift. Aan de jeugdige wordt
      schriftelijk medegedeeld dat het verzoekschrift is ingediend.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.7
  - number: 6.1.8.1
    text: |-
      Een verzoek gericht op het verkrijgen van een machtiging, een spoedmachtiging of een voorwaardelijke machtiging
      wordt ingediend door het college van de gemeente waar de jeugdige zijn woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.8
  - number: 6.1.8.2
    text: |-
      In afwijking van het eerste lid wordt het verzoek, indien het betrekking heeft op een minderjarige die een
      kinderbeschermingsmaatregel heeft opgelegd gekregen of ten aanzien van wie een kinderbeschermingsmaatregel
      wordt verzocht, ingediend door de raad voor de kinderbescherming of door de officier van justitie. Ingeval een
      gecertificeerde instelling de kinderbeschermingsmaatregel uitvoert, kan ook deze instelling het verzoek doen.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.8
  - number: 6.1.8.3
    text: |-
      Op verzoeken als bedoeld in het eerste of tweede lid zijn
      [artikel 265k, eerste, derde en vierde lid, van Boek 1 van het Burgerlijk Wetboek][ref1], alsmede de
      [eerste afdeling van de zesde titel van Boek 3 van het Wetboek van Burgerlijke Rechtsvordering][ref2], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel265k
      [ref2]: https://wetten.overheid.nl/BWBR0001827#AfdelingEerste
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.8
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: 265k
      - id: ref2
        bwb_id: BWBR0001827
        afdeling: Eerste
  - number: 6.1.8.4
    text: |-
      Indien het verzoek tot het verlenen van een machtiging betrekking heeft op een jeugdige die reeds in een
      gesloten accommodatie verblijft, beslist de kinderrechter in elk geval binnen drie weken na het indienen van het
      verzoekschrift.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.8
  - number: 6.1.9.1
    text: |-
      Het college, de raad voor de kinderbescherming, de gecertificeerde instelling, dan wel de officier van justitie
      legt bij een verzoek als bedoeld in [artikel 6.1.8, eerste en tweede lid][ref1], een afschrift van het besluit,
      bedoeld in [artikel 6.1.2, vijfde lid][ref2], alsmede van de verklaring, bedoeld in artikel 6.1.2, zesde lid, over.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.9.2
    text: |-
      In een geval als bedoeld in [artikel 6.1.2, zevende lid][ref1], legt de raad voor de kinderbescherming bij een
      verzoek als bedoeld in [artikel 6.1.8, eerste lid][ref2], de verklaring, bedoeld in artikel 6.1.2, zevende lid,
      over.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.9.3
    text: |-
      In de gevallen, bedoeld in [artikel 6.1.3][ref1], wordt in afwijking van het eerste en tweede lid, slechts een
      verklaring van een gekwalificeerde gedragswetenschapper als bedoeld in artikel 6.1.3, derde lid, overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.10.1
    text: |-
      De kinderrechter hoort, alvorens een machtiging, een spoedmachtiging of een voorwaardelijke machtiging te verlenen
      en alvorens een vervallenverklaring als bedoeld in [artikel 6.1.7][ref1] te doen:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.10
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.10.1.a
    text: |-
      de jeugdige, degene die het gezag over de minderjarige uitoefent en degene die de jeugdige als behorende tot zijn
      gezin verzorgt en opvoedt, tenzij de kinderrechter vaststelt dat een persoon niet bereid is zich te doen horen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.10
  - number: 6.1.10.1.b
    text: de verzoeker, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.10
  - number: 6.1.10.1.c
    text: |-
      in gevallen als bedoeld in [artikel 6.1.7][ref1], de jeugdhulpaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.10
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.10.2
    text: |-
      De kinderrechter biedt, alvorens een machtiging of een voorwaardelijke machtiging te verlenen en alvorens een
      vervallenverklaring als bedoeld in [artikel 6.1.7][ref1] te doen, de mogelijkheid een familiegroepsplan op te
      stellen. Slechts indien de ouders aan de kinderrechter te kennen hebben gegeven dat zij geen gebruik wensen te
      maken van deze mogelijkheid, concrete bedreigingen in de ontwikkeling van het kind hiertoe aanleiding geven of de
      belangen van het kind anderszins geschaad worden, kan de kinderrechter hier vanaf zien.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.10
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.10.3
    text: |-
      Bij een spoedmachtiging, bedoeld in [artikel 6.1.3][ref1], is
      [artikel 800, derde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel800
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.10
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '800'
  - number: 6.1.10.4
    text: |-
      De rechter geeft het bestuur van de raad voor rechtsbijstand ambtshalve last tot toevoeging van een raadsman aan
      de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.10
  - number: 6.1.11
    text: |-
      De griffier zendt, onverminderd [artikel 805 van het Wetboek van Burgerlijke Rechtsvordering][ref1], een afschrift
      van de beschikking inzake de machtiging, de spoedmachtiging of de voorwaardelijke machtiging en de mededeling,
      bedoeld in [artikel 6.1.6, zesde lid][ref2], en de beschikking als bedoeld in [artikel 6.1.7, eerste lid][ref3],
      aan:


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel805
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.11
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '805'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.11.a
    text: de jeugdige indien deze de leeftijd van twaalf jaar heeft bereikt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.11
  - number: 6.1.11.b
    text: degene die het gezag over de jeugdige heeft;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.11
  - number: 6.1.11.c
    text: degene die de jeugdige als behorende tot zijn gezin verzorgt en opvoedt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.11
  - number: 6.1.11.d
    text: de verzoeker, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.11
  - number: 6.1.11.e
    text: de raadsman van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.11
  - number: 6.1.12.1
    text: De beschikking van de kinderrechter is bij voorraad uitvoerbaar.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.12
  - number: 6.1.12.2
    text: |-
      De kinderrechter bepaalt de geldigheidsduur van de machtiging op ten hoogste één jaar, de eerste voorwaardelijke
      machtiging op ten hoogste zes maanden en verlengingen van voorwaardelijke machtigingen op ten hoogste een jaar. De
      spoedmachtiging geldt tot het tijdstip waarop een beslissing op een verzoek om een machtiging is genomen, doch ten
      hoogste vier weken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.12
  - number: 6.1.12.3
    text: De machtiging vervalt indien deze gedurende drie maanden niet ten uitvoer is gelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.12
  - number: 6.1.12.4
    text: |-
      De machtiging of spoedmachtiging vervalt indien de gecertificeerde instelling die de ondertoezichtstelling
      uitvoert of de voogdij uitoefent, heeft bepaald dat een voorziening, inhoudende verblijf niet zijnde
      verblijf bij een pleegouder, niet langer nodig is, tenzij er sprake is van een machtiging als bedoeld in
      [artikel 6.1.2, zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.12.5
    text: |-
      De tenuitvoerlegging van de machtiging kan door de jeugdhulpaanbieder worden geschorst, indien het naar zijn
      oordeel niet langer nodig is te voorkomen dat de jeugdige zich aan de jeugdhulp die hij nodig heeft onttrekt of
      daaraan door anderen wordt onttrokken. De schorsing kan worden ingetrokken indien blijkt dat de tenuitvoerlegging
      nodig is om te voorkomen dat de jeugdige zich aan de jeugdhulp die hij nodig heeft onttrekt of daaraan door
      anderen wordt onttrokken. Schorsing vindt niet plaats dan nadat een gekwalificeerde gedragswetenschapper daarmee
      heeft ingestemd. Met betrekking tot de intrekking van de schorsing is [artikel 6.1.7][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.12.6
    text: |-
      Het college doet aan de raad voor de kinderbescherming mededeling van het vervallen van de machtiging op grond van
      het vierde lid, alsmede van het besluit geen nieuwe machtiging aan te vragen na afloop van de geldigheidsduur van
      een machtiging. De jeugdhulpaanbieder doet aan de raad voor de kinderbescherming en aan het college mededeling van
      een besluit tot schorsing en intrekking als bedoeld in het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.12
  - number: 6.1.12.7
    text: |-
      Tegen de beschikking van de kinderrechter op een verzoek om een machtiging, een spoedmachtiging of een
      voorwaardelijke machtiging te verlenen en een beschikking als bedoeld in [artikel 6.1.7, eerste lid][ref1], staat
      hoger beroep bij het gerechtshof open.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.13.1
    text: |-
      De jeugdhulpaanbieder voegt een afschrift van de beslissing, bedoeld in de [artikelen 6.1.2, eerste lid][ref1],
      [6.1.3, eerste lid][ref2], [6.1.4, eerste lid][ref3] of [6.1.7, eerste lid][ref4], en een wijziging van het
      hulpverleningsplan als bedoeld in [artikel 6.1.5][ref5] toe aan het dossier.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.13
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref5
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.13.2
    text: |-
      De jeugdhulpaanbieder in wiens gesloten accommodatie de machtiging ten uitvoer wordt gelegd, doet van de opneming
      in de gesloten accommodatie zo spoedig mogelijk mededeling aan degene die het gezag over de jeugdige uitoefent, aan
      het college en, indien het college niet de verzoeker was, tevens aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.13
  - number: 6.1.14
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld met betrekking tot het verzoekschrift,
      bedoeld in [artikel 6.1.8][ref1], en de verklaring, bedoeld in de [artikelen 6.1.2, zesde lid][ref2], of
      [6.1.3, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.1.14
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.1.1
    text: |-
      De jeugdhulpaanbieder die in een gesloten accommodatie opname en verblijf biedt aan jeugdigen voor wie een
      machtiging als bedoeld in [artikel 6.1.2][ref1], [6.1.3][ref2] of [6.1.4][ref3] is afgegeven, verstrekt Onze
      Ministers, ter opneming in een openbaar register van zodanige accommodatie, een opgave van:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.1.1.a
    text: de naam en het adres van de accommodatie, en
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.1
  - number: 6.2.1.1.b
    text: de naam en de rechtsvorm van de jeugdhulpaanbieder.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.1
  - number: 6.2.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de veiligheid
      binnen de gesloten accommodatie en bouwkundige eisen ten aanzien van de gesloten accommodatie waar de machtiging
      ten uitvoer kan worden gelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.1
  - number: 6.2.1.3
    text: Een registratie wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.1
  - number: 6.2.2.1
    text: |-
      Een machtiging kan slechts ten uitvoer worden gelegd in een op grond van [artikel 6.2.1][ref1] geregistreerde
      gesloten accommodatie.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.2
    text: |-
      De rechter kan, indien het een jeugdige betreft van twaalf jaar of ouder, op verzoek van het
      college of de raad voor de kinderbescherming, in zijn beschikking inzake de machtiging bepalen dat
      deze in afwijking van het eerste lid, ten uitvoer wordt gelegd in een inrichting als bedoeld in
      [artikel 1 van de Beginselenwet justitiële jeugdinrichtingen][ref1]. De eerste volzin wordt slechts toegepast met
      betrekking tot een jeugdige die op het tijdstip waarop een machtiging wordt verleend op basis van een veroordeling
      is opgenomen in een inrichting. Toepassing geschiedt slechts met instemming van de jeugdige of indien deze de
      leeftijd van zestien jaar nog niet heeft bereikt, met instemming van de jeugdige en degene die het gezag over hem
      heeft. De tenuitvoerlegging in een inrichting geschiedt slechts voor de termijn die nodig is om een behandeling
      of opleiding af te ronden. Op de tenuitvoerlegging is de [Beginselenwet justitiële jeugdinrichtingen][ref2] van
      toepassing. Een besluit als bedoeld in [artikel 6.1.2, vijfde lid][ref3], geeft aanspraak op verblijf als bedoeld
      in [artikel 14 van de Beginselenwet justitiële jeugdinrichtingen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011756
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0011756#Artikel14
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011756
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0011756
        artikel: '14'
  - number: 6.2.3
    text: |-
      Een jeugdhulpaanbieder die aan een leerplichtige jeugdige verblijf biedt in een gesloten accommodatie is gedurende
      de looptijd van de machtiging een persoon die zich met de feitelijke verzorging van de jeugdige heeft belast als
      bedoeld in [artikel 2, eerste lid, van de Leerplichtwet 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
  - number: 6.2.4.1
    text: |-
      Een jeugdhulpaanbieder stelt met het oog op een zorgvuldige toepassing van maatregelen als bedoeld in
      [paragraaf 6.3][ref1] een regeling vast omtrent de personen die tot het treffen daarvan bevoegd zijn en met
      betrekking tot de wijze waarop tot toepassing wordt besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.2.4.2
    text: |-
      Een jeugdhulpaanbieder stelt huisregels vast die betrekking hebben op een ordelijke gang van zaken, de veiligheid
      binnen de gesloten accommodatie en het waarborgen van een pedagogisch klimaat.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.4
  - number: 6.2.4.3
    text: |-
      De huisregels bevatten in ieder geval een regeling van de bezoektijden, van de controle van de bezoekers en van
      voorwerpen die jeugdigen in verband met de veiligheid binnen de gesloten accommodatie niet in hun bezit mogen
      hebben.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.2.4
  - number: 6.3.1.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te bereiken of voor zover
      noodzakelijk voor de veiligheid van de jeugdige of anderen, door de jeugdhulpaanbieder maatregelen worden toegepast
      waarmee hij tegen zijn wil of die van degene die het gezag over hem uitoefent, binnen de gesloten accommodatie in
      zijn vrijheden wordt beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.1.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.1
  - number: 6.3.1.2.a
    text: |-
      het verbod zich op te houden op in het hulpverleningsplan aangegeven plaatsen en zo nodig de tijdstippen waarop dat
      verbod geldt;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.1
  - number: 6.3.1.2.b
    text: tijdelijke plaatsing in afzondering;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.1
  - number: 6.3.1.2.c
    text: tijdelijke overplaatsing binnen de gesloten accommodatie of naar een andere gesloten accommodatie, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.1
  - number: 6.3.1.2.d
    text: het vastpakken en vasthouden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.1
  - number: 6.3.1.3
    text: |-
      De jeugdhulpaanbieder meldt de toepassing van maatregelen als bedoeld in het tweede lid, onderdelen b en c, aan
      de gecertificeerde instelling die de gezinsvoogdij uitoefent alsmede aan de ouders indien de jeugdige niet onder
      toezicht is gesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.1
  - number: 6.3.2.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen door de jeugdhulpaanbieder tegen de wil van de jeugdige of van degene die het gezag over hem
      uitoefent:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.2.1.a
    text: |-
      jeugdhulpverleningsprogramma’s worden toegepast, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te
      bereiken, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.2
  - number: 6.3.2.1.b
    text: |-
      geneeskundige behandelingsmethoden, waaronder het toedienen van medicijnen, worden toegepast, voor zover
      noodzakelijk ter afwending van gevaar voor de gezondheid of de veiligheid van de jeugdige of anderen en de met de
      jeugdhulp beoogde doelen te bereiken.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.2
  - number: 6.3.2.2
    text: |-
      De jeugdhulpaanbieder meldt de toepassing van het eerste lid aan de gecertificeerde instelling die de gezinsvoogdij
      uitoefent alsmede aan de ouders indien de jeugdige niet onder toezicht is gesteld. Indien de geneeskundige
      behandelingsmethode wordt toegepast ter behandeling van een stoornis van de geestvermogens, wordt tevens melding
      gedaan aan het Staatstoezicht op de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.2
  - number: 6.3.3.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te bereiken, door de
      jeugdhulpaanbieder tegen de wil van de jeugdige of van degene die het gezag over hem uitoefent en onverminderd de
      huisregels, bedoeld in [artikel 6.2.4, tweede lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.3.1.a
    text: beperkingen van het brief- en telefoonverkeer of het gebruik van andere communicatiemiddelen plaatsvinden, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.3
  - number: 6.3.3.1.b
    text: beperkingen van bezoek plaatsvinden of bepalen dat bezoek slechts onder toezicht kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.3
  - number: 6.3.3.2
    text: |-
      Op de beperkingen, bedoeld in het eerste lid, zijn de [artikelen 42, eerste en tweede lid][ref1], en
      [43, zevende lid, van de Beginselenwet justitiële jeugdinrichtingen][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel43
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '43'
  - number: 6.3.4.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te bereiken of voor zover
      noodzakelijk om te voorkomen dat de jeugdhulp aan andere jeugdigen wordt tegengewerkt, door de jeugdhulpaanbieder
      tegen de wil van de jeugdige of van degene die het gezag over hem uitoefent controlemaatregelen worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.4.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.4
  - number: 6.3.4.2.a
    text: onderzoek aan lichaam en kleding;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.4
  - number: 6.3.4.2.b
    text: onderzoek van urine op aanwezigheid van gedragsbeïnvloedende middelen;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.4
  - number: 6.3.4.2.c
    text: onderzoek van de kamer van de jeugdige op de aanwezigheid van voorwerpen die hij niet in zijn bezit mag hebben, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.4
  - number: 6.3.4.2.d
    text: |-
      onderzoek van poststukken afkomstig van of bestemd voor de jeugdigen op de aanwezigheid van voorwerpen, doch
      slechts in aanwezigheid van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.4
  - number: 6.3.4.3
    text: |-
      Voorwerpen die niet in het bezit van de jeugdige mogen zijn worden in beslag genomen en voor de jeugdige bewaard of
      met zijn toestemming vernietigd, dan wel aan een opsporingsambtenaar ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.4
  - number: 6.3.5.1
    text: |-
      Indien een jeugdhulpaanbieder met het oog op de veiligheid van de jeugdige of anderen dan wel om te voorkomen
      dat de jeugdige zich onttrekt aan de tenuitvoerlegging van de machtiging, bedoeld in de [artikelen 6.1.2][ref1]
      en [6.1.3][ref2], bepaalt dat het vervoer van en naar een gesloten accommodatie plaatsvindt door een vervoerder
      als bedoeld in het derde lid, kunnen door de vervoerder, voor zover noodzakelijk met het oog op voren omschreven
      doeleinden ten aanzien van die jeugdige tijdens dat vervoer tegen zijn wil of van degene die het gezag over hem
      uitoefent, voor de duur van het vervoer de volgende maatregelen worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.5.1.a
    text: vastpakken en vasthouden;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.5
  - number: 6.3.5.1.b
    text: onderzoek aan kleding, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.5
  - number: 6.3.5.1.c
    text: tijdelijke plaatsing in een afzonderlijke en af te sluiten ruimte in het vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.5
  - number: 6.3.5.2
    text: |-
      Zodra de maatregelen, bedoeld in het eerste lid, in het hulpverleningsplan zijn opgenomen, worden zij
      dienovereenkomstig ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.5
  - number: 6.3.5.3
    text: |-
      Een vervoerder als bedoeld in het eerste lid is een door Onze Ministers daartoe aangewezen vervoerder die voldoet
      aan de bij regeling van Onze Ministers gestelde eisen, waaronder eisen omtrent het door de vervoerder te gebruiken
      vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.5
  - number: 6.3.5.4
    text: |-
      In geval van vervoer als bedoeld in het eerste lid meldt de vervoerder de toepassing van een of meer van de in dat
      lid genoemde maatregelen aan de jeugdhulpaanbieder en de gecertificeerde instelling. Indien de jeugdige niet onder
      toezicht is gesteld, licht de zorgaanbieder tevens de ouders in.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.5
  - number: 6.3.6.1
    text: |-
      De maatregelen, methoden en beperkingen als bedoeld in de [artikelen 6.3.1 tot en met 6.3.5][ref1] worden slechts
      toegepast, voor zover zij zijn opgenomen in het hulpverleningsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.6.2
    text: |-
      Voorafgaand aan de vaststelling of wijziging van deze onderdelen van het hulpverleningsplan wordt overleg gevoerd
      met degene die het gezag over de jeugdige heeft. Zij behoeven niet de instemming van de jeugdige of degene die het
      gezag over hem heeft. Zij behoeven wel de instemming van een gekwalificeerde gedragswetenschapper.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.6
  - number: 6.3.6.3
    text: |-
      Indien het plan maatregelen, methoden of beperkingen als bedoeld in het eerste lid bevat omschrijft het tevens de
      gevallen waarin en de termijn gedurende welke de maatregelen kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.6
  - number: 6.3.6.4
    text: |-
      Een hulpverleningsplan ten aanzien van een jeugdige die met een machtiging in een gesloten accommodatie verblijft,
      wordt zo vaak geëvalueerd als in het belang van de jeugdige noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.6
  - number: 6.3.7
    text: |-
      In afwijking van [artikel 6.3.6, eerste lid][ref1], kunnen met betrekking tot een jeugdige, slechts maatregelen,
      methoden of beperkingen als bedoeld in de [artikelen 6.3.1 tot en met 6.3.4][ref2] die niet opgenomen zijn in
      het hulpverleningsplan worden toegepast, voor zover noodzakelijk ter overbrugging van tijdelijke noodsituaties.
      De toepassing behoeft binnen vierentwintig uur nadat deze is aangevangen de instemming van een gekwalificeerde
      gedragswetenschapper. De maatregelen, methoden of beperkingen worden ten hoogste gedurende zeven opeenvolgende
      dagen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.8.1
    text: |-
      Ten aanzien van een jeugdige voor wie een machtiging is afgegeven en die in verband met deze machtiging aanwezig
      is in het gerechtsgebouw, kunnen, om te voorkomen dat de jeugdige zich onttrekt aan de tenuitvoerlegging van de
      machtiging, tegen de wil van de jeugdige of van degene die het gezag over hem uitoefent, voor de duur van zijn
      aanwezigheid aldaar de volgende maatregelen worden genomen:
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.8
  - number: 6.3.8.1.a
    text: vastpakken en vasthouden;
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.8
  - number: 6.3.8.1.b
    text: onderzoek aan kleding, of
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.8
  - number: 6.3.8.1.c
    text: tijdelijke plaatsing in een geschikte, afzonderlijke en af te sluiten ruimte.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.8
  - number: 6.3.8.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, worden uitsluitend ten uitvoer gelegd door ambtenaren aangewezen voor de
      uitvoering van de politietaak, bedoeld in [artikel 3 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.8
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
  - number: 6.3.9.1
    text: |-
      Degene die de beslissing heeft genomen tot toepassing van de [artikelen 6.3.1 tot en met 6.3.4][ref1] of van
      [artikel 6.3.7][ref2], draagt er zorg voor dat de toepassing zo spoedig mogelijk in het dossier betreffende de
      jeugdige wordt vastgelegd, onder vermelding van de omstandigheden die daartoe aanleiding gaven.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.9.2
    text: |-
      De jeugdhulpaanbieder draagt er zorg voor dat de toepassing van een of meer van de in de
      [artikelen 6.3.5, eerste lid][ref1], of [6.3.8, eerste lid][ref2], genoemde maatregelen zo spoedig mogelijk in het
      dossier betreffende de jeugdige wordt vastgelegd, onder vermelding van de omstandigheden die daartoe aanleiding
      gaven.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.9.3
    text: |-
      De jeugdhulpaanbieder die de machtiging gesloten jeugdhulp uitvoert, verstrekt aan de gecertificeerde instelling
      die de gezinsvoogdij uitoefent alsmede aan de ouders indien de jeugdige niet onder toezicht is gesteld, elk half
      jaar een rapportage over de toepassingen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.3.9
  - number: 6.4.1.1
    text: |-
      Aan een jeugdige kan, naast de mogelijkheden die het hulpverleningsplan biedt om de gesloten accommodatie te
      verlaten, verlof om de gesloten accommodatie te verlaten worden verleend indien zulks, gelet op de reden waarom de
      jeugdige in de gesloten accommodatie moet verblijven, verantwoord is.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.4.1
  - number: 6.4.1.2
    text: Aan het verlof kunnen voorwaarden worden verbonden betreffende de jeugdhulp en het gedrag van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.4.1
  - number: 6.4.1.3
    text: |-
      Verlof wordt slechts verleend indien redelijkerwijs kan worden aangenomen dat de jeugdige de voorwaarden zal
      naleven.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.4.1
  - number: 6.4.1.4
    text: Verlof wordt niet verleend dan nadat een gekwalificeerde gedragswetenschapper daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.4.1
  - number: 6.4.1.5
    text: |-
      Het verlof wordt ingetrokken indien voortzetting van het verlof, gezien de problemen van de jeugdige, niet langer
      verantwoord is. Het verlof kan worden ingetrokken indien de jeugdige zich niet aan de voorwaarden houdt. De aan het
      verlof verbonden voorwaarden kunnen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.4.1
  - number: 6.5.1.1
    text: |-
      Onverminderd [artikel 4.2.3][ref1] kan een jeugdige of degene die het gezag over hem heeft binnen
      een redelijke termijn tegen een beslissing als bedoeld in de [artikelen 6.3.1, eerste lid][ref2],
      [6.3.2, eerste lid][ref3], [6.3.3, eerste lid][ref4], en [6.3.4, eerste en derde lid][ref5], de toepassing
      van [artikel 6.3.5, eerste lid][ref6], [6.3.7][ref7] of een beslissing aangaande verlof als bedoeld in
      [artikel 6.4.1][ref8] een schriftelijke klacht indienen bij de klachtencommissie, bedoeld in artikel 4.2.1, tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#Artikel6.5.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
