        artikel: '1'
  - number: 10.2.4
    text: |-
      De rechten en verplichtingen die op het tijdstip van de inwerkingtreding van deze wet
      gelden met betrekking tot geestelijke gezondheidszorg, al dan niet met verblijf, waarvoor
      een verwijzing op grond van [artikel 14, derde lid, van de Zorgverzekeringswet][ref1] of
