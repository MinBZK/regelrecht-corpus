bwb_id: BWBR0034925
url: https://wetten.overheid.nl/BWBR0034925/2016-08-01
preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verantwoordelijkheid voor het voorkomen van, de
    ondersteuning, hulp en zorg bij opgroei- en opvoedingsproblemen, psychische problemen en stoornissen, de uitvoering
    van de kinderbeschermingsmaatregelen en de jeugdreclassering bij de gemeente te beleggen, om te komen tot betere
    samenwerking van hulpverleners rond gezinnen, eerdere ondersteuning bij opgroei- en opvoedingsproblemen, psychische
    problemen en stoornissen, hulp op maat en meer ruimte voor professionals en tot het demedicaliseren, ontzorgen en
    normaliseren van de jeugdsector, waarbij het uitgangspunt is dat de verantwoordelijkheid voor het gezond en veilig
    opgroeien van jeugdigen allereerst bij de ouders en de jeugdige zelf ligt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034925/2016-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *accommodatie:* bouwkundige voorziening
      of deel van een bouwkundige voorziening met het daarbij behorende terrein, waar jeugdhulp wordt verleend door of
      namens een jeugdhulpaanbieder;
        - *advies- en meldpunt huiselijk geweld en kindermishandeling:* advies- en meldpunt huiselijk geweld en
      kindermishandeling als bedoeld in [artikel 4.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1];
        - *burgerservicenummer:* burgerservicenummer als bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref2];
        - *calamiteit:* niet-beoogde of onverwachte gebeurtenis, die betrekking heeft op de kwaliteit van de jeugdhulp en
      die tot een ernstig schadelijk gevolg voor of de dood van een jeugdige of een ouder heeft geleid;
        - *college:* college van burgemeester en wethouders;
        - *dossier:* geheel van schriftelijk of elektronisch vastgelegde gegevens met betrekking tot de verlening van
      jeugdhulp aan een jeugdige of ouder of de uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering;
        - *familiegroepsplan:* hulpverleningsplan of plan van aanpak opgesteld door de ouders, samen met bloedverwanten,
      aanverwanten of anderen die tot de sociale omgeving van de jeugdige behoren;
        - *gecertificeerde instelling:* rechtspersoon die in het bezit is van een certificaat of voorlopig certificaat als
      bedoeld in [artikel 3.4][ref3] en die een kinderbeschermingsmaatregel of jeugdreclassering uitvoert;
        - *gekwalificeerde gedragswetenschapper:* gedragswetenschapper behorende tot een bij regeling van Onze Ministers
      aangewezen categorie;
        - *gesloten accommodatie:* bouwkundige voorziening of deel van een bouwkundige voorziening met het daarbij
      behorende terrein, waar gesloten jeugdhulp wordt verleend;
        - *gesloten jeugdhulp:* opname, verblijf en jeugdhulp in een gesloten accommodatie op basis van een machtiging als
      bedoeld in de [artikelen 6.1.2][ref4], [6.1.3][ref5] of [6.1.4][ref6];
        - *geweld bij de verlening van jeugdhulp of de uitvoering van een kinderbeschermingsmaatregel of
      jeugdreclassering:* lichamelijk, geestelijk of seksueel geweld jegens een jeugdige of een ouder, of bedreiging
      daarmee, door iemand die werkzaam is voor de jeugdhulpaanbieder of een gecertificeerde instelling, of door iemand
      die werkzaam is voor een rechtspersoon die in opdracht van de aanbieder of gecertificeerde instelling jeugdhulp
      verleent of door een andere jeugdige of ouder met wie de jeugdige of ouder gedurende het etmaal of een dagdeel bij
      de aanbieder verblijft;
        - *huiselijk geweld:* huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref7];
        - *hulpverleningsplan:* plan betreffende de verlening van jeugdhulp als bedoeld in [artikel 4.1.3][ref8] en
      [hoofdstuk 6][ref9];
        - *inspectie:* inspectie jeugdzorg, bedoeld in [artikel 9.1][ref10];
        - *jeugdarts:* arts die als jeugdarts KNMG is ingeschreven in het door het College Geneeskundig Specialismen
      van de Koninklijke Nederlandsche Maatschappij ter bevordering van de Geneeskunst ingestelde profielregister
      jeugdgezondheidszorg;
        - *jeugdgezondheidszorg:* jeugdgezondheidszorg als bedoeld in [artikel 1 van de Wet publieke gezondheid][ref11];
        - *jeugdhulp:* 1°. ondersteuning van en hulp en zorg, niet zijnde preventie, aan jeugdigen en hun ouders bij
      het verminderen, stabiliseren, behandelen en opheffen van of omgaan met de gevolgen van psychische problemen
      en stoornissen, psychosociale problemen, gedragsproblemen of een verstandelijke beperking van de jeugdige,
      opvoedingsproblemen van de ouders of adoptiegerelateerde problemen; 2°. het bevorderen van de deelname aan het
      maatschappelijk verkeer en van het zelfstandig functioneren van jeugdigen met een somatische, verstandelijke,
      lichamelijke of zintuiglijke beperking, een chronisch psychisch probleem of een psychosociaal probleem en die de
      leeftijd van achttien jaar nog niet hebben bereikt, en 3°. het ondersteunen bij of het overnemen van activiteiten
      op het gebied van de persoonlijke verzorging gericht op het opheffen van een tekort aan zelfredzaamheid bij
      jeugdigen met een verstandelijke, lichamelijke of zintuiglijke beperking of een somatische of psychiatrische
      aandoening of beperking, die de leeftijd van achttien jaar nog niet hebben bereikt, met dien verstande dat de
      leeftijdgrens van achttien jaar niet geldt voor jeugdhulp in het kader van jeugdstrafrecht;
        - *jeugdhulpaanbieder:* 1°. natuurlijke persoon die, het verband van natuurlijke personen dat of de rechtspersoon
      die bedrijfsmatig jeugdhulp doet verlenen onder verantwoordelijkheid van het college; 2°. solistisch werkende
      jeugdhulpverlener onder verantwoordelijkheid van het college;
        - *jeugdhulpverlener:* natuurlijke persoon die beroepsmatig jeugdhulp verleent;
        - *jeugdige:* persoon die: 1°. de leeftijd van achttien jaar nog niet heeft bereikt, 2°. de leeftijd van achttien
      jaar heeft bereikt en ten aanzien van wie op grond van [artikel 77c van het Wetboek van Strafrecht][ref12] recht is
      gedaan overeenkomstig de [artikelen 77g tot en met 77gg van het Wetboek van Strafrecht][ref13], of 3°. de leeftijd
      van achttien jaar doch niet de leeftijd van drieëntwintig jaar heeft bereikt en ten aanzien van wie op grond
      van deze wet: – is bepaald dat de voortzetting van jeugdhulp als bedoeld in onderdeel 1°, waarvan de verlening
      was aangevangen vóór het bereiken van de leeftijd van achttien jaar, noodzakelijk is; – vóór het bereiken van
      de leeftijd van achttien jaar is bepaald dat jeugdhulp noodzakelijk is, of – is bepaald dat na beëindiging van
      jeugdhulp die was aangevangen vóór het bereiken van de leeftijd van achttien jaar, binnen een termijn van een half
      jaar hervatting van de jeugdhulp noodzakelijk is;
        - *jeugdreclassering:* reclasseringswerkzaamheden, genoemd in
      [artikel 77hh, eerste lid, van het Wetboek van Strafrecht][ref14], begeleiding, genoemd in artikel 77hh, tweede
      lid, van dat wetboek en het begeleiden van en toezicht houden op jeugdigen die deel nemen aan een scholings-
      en trainingsprogramma als bedoeld in [artikel 3 van de Beginselenwet justitiële jeugdinrichtingen][ref15], het
      geven van de aanwijzingen, bedoeld in [artikel 12, vijfde lid, van die wet][ref16], of de overige taken die bij of
      krachtens de wet aan de gecertificeerde instellingen zijn opgedragen;
        - *kinderbeschermingsmaatregel:* voogdij en voorlopige voogdij op grond van
      [Boek 1 van het Burgerlijk Wetboe][ref17]k, ondertoezichtstelling, bedoeld in
      [artikel 255, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref18] en voorlopige ondertoezichtstelling,
      bedoeld in [artikel 257, eerste lid, van Boek 1 van het Burgerlijk Wetboek][ref19];
        - *kindermishandeling:* elke vorm van voor een minderjarige bedreigende of gewelddadige interactie van fysieke,
      psychische of seksuele aard, die de ouders of andere personen ten opzichte van wie de minderjarige in een relatie
      van afhankelijkheid of van onvrijheid staat, actief of passief opdringen, waardoor ernstige schade wordt berokkend
      of dreigt te worden berokkend aan de minderjarige in de vorm van fysiek of psychisch letsel;
        - *maatschappelijke ondersteuning:* maatschappelijke ondersteuning als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref20];
        - *machtiging:* machtiging, bedoeld in [artikel 6.1.2][ref21];
        - *medisch specialist:* geneeskundig specialist die als specialist is ingeschreven in een door het College
      Geneeskundig Specialismen van de Koninklijke Nederlandsche Maatschappij ter bevordering van de Geneeskunst
      ingestelde register als bedoeld in [artikel 14 van de Wet op de beroepen in de individuele gezondheidszorg][ref22];
        - *Onze Ministers:* Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Veiligheid en Justitie
      tezamen;
        - *opgroei- en opvoedingsproblemen, psychische problemen en stoornissen:* 1°. psychische problemen en stoornissen,
      psychosociale problemen, gedragsproblemen of een verstandelijke beperking van de jeugdige, opvoedingsproblemen van
      de ouders of adoptiegerelateerde problemen; 2°. beperkingen in de zelfredzaamheid en maatschappelijke participatie
      in verband met een somatische, verstandelijke, lichamelijke of zintuiglijke beperking, een chronisch psychisch
      probleem of een psychosociaal probleem bij een jeugdige die de leeftijd van achttien jaar nog niet heeft bereikt,
      en 3°. een tekort aan zelfredzaamheid in verband met een verstandelijke, lichamelijke of zintuiglijke beperking
      of een somatische of psychiatrische aandoening of beperking bij een jeugdige die de leeftijd van achttien jaar nog
      niet heeft bereikt;
        - *ouder:* gezaghebbende ouder, adoptiefouder, stiefouder of een ander die een jeugdige als behorend tot zijn gezin
      verzorgt en opvoedt, niet zijnde een pleegouder;
        - *persoonsgegevens, verwerking, bestand, onderscheidenlijk verantwoordelijke:* hetgeen daaronder wordt verstaan in
      de [Wet bescherming persoonsgegevens][ref23];
        - *plan van aanpak:* plan betreffende de uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering als
      bedoeld in [artikel 4.1.3][ref24];
        - *pleegouder:* persoon die een jeugdige die niet zijn kind of stiefkind is, als behorende tot zijn gezin
      verzorgt en daartoe een pleegcontract als bedoeld in [artikel 5.2, eerste lid][ref25], heeft gesloten met een
      pleegzorgaanbieder;
        - *pleegoudervoogd:* pleegouder die tevens belast is met voogdij als bedoeld in [boek 1 Burgerlijk Wetboek][ref26];
        - *pleegzorgaanbieder:* jeugdhulpaanbieder die pleegzorg biedt;
        - *preventie:* op preventie gerichte ondersteuning van jeugdigen met of jeugdigen met een risico op psychische
      problemen en stoornissen, psychosociale problemen, gedragsproblemen of een verstandelijke beperking of van de
      ouders met of met een risico op opvoedingsproblemen;
        - *strafrechtelijke beslissing:* beslissing van de officier van justitie of de strafrechter met toepassing
      van [titel VIII A van het Eerste Boek van het Wetboek van Strafrecht][ref27] of een beslissing als bedoeld in
      [artikel 493 van het Wetboek van Strafvordering][ref28];
        - *vertrouwenspersoon:* persoon die jeugdigen, ouders of pleegouders op hun verzoek ondersteunt in aangelegenheden
      die samenhangen met de wettelijke taken en verantwoordelijkheden van het college, de jeugdhulpaanbieder, de
      gecertificeerde instelling en het advies- en meldpunt huiselijk geweld en kindermishandeling;
        - *verwijsindex:* verwijsindex risicojongeren als bedoeld in [artikel 7.1.2.1][ref29];
        - *woonplaats:* 1°. woonplaats als bedoeld in [titel 3 van Boek 1 van het Burgerlijk Wetboek][ref30]; 2°.
      ingeval de voogdij over de jeugdige berust bij een gecertificeerde instelling: de plaats van het werkelijke
      verblijf van de jeugdige; 3°. ingeval de woonplaats, bedoeld onder 1° en 2°, onbekend is dan wel buiten
      Nederland is: de plaats van het werkelijke verblijf van de jeugdige op het moment van de hulpvraag; 4°
      ingeval de jeugdige de leeftijd van achttien jaar heeft bereikt: de woonplaats van de jeugdige, bedoeld in
      [artikel 10 van Boek 1 van het Burgerlijk Wetboek][ref31].


