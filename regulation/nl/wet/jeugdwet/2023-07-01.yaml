  - number: 12.3a.3
    text: |-
      Het indicatieorgaan, bedoeld in het tweede lid, draagt na ontvangst van een daartoe strekkende kennisgeving door
      het college van de gemeente waar de jeugdige zijn woonplaats heeft, de archiefbescheiden binnen vier weken over aan
      het college, voor rekening en risico van dat college, indien het zorg betreft waarvoor dat college is gehouden een
      voorziening op grond van deze wet te treffen en deze bescheiden daartoe noodzakelijk zijn, teneinde dit college in
      de gelegenheid te stellen deze te kopiëren. Het college geeft de archiefbescheiden binnen vier weken na ontvangst
      terug.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3a
  - number: 12.4.1
    text: |-
      Het college en de gemeenteraad bereiden zich tijdig en adequaat voor op hetgeen waarvoor zij verantwoordelijk zijn
      vanaf het moment dat de bepalingen van deze wet in werking treden, en waarborgen daarbij in het bijzonder:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.4
  - number: 12.4.1.a
    text: |-
      de continuïteit van de verlening van jeugdhulp, de uitvoering van kinderbeschermingsmaatregelen en
      jeugdreclassering;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.4
  - number: 12.4.1.b
    text: |-
      de infrastructuur die noodzakelijk is om jeugdigen en ouders de continuïteit, bedoeld in onderdeel a, te kunnen
      bieden;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.4
  - number: 12.4.1.c
    text: een beperking van de frictiekosten, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.4
  - number: 12.4.1.d
    text: het functioneren van Veilig Thuis.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.4
  - number: 12.4.2
    text: |-
      De gemeenteraad stelt het beleidsplan, bedoeld in [artikel 2.2][ref1], en de verordening, bedoeld in
      [artikel 2.9][ref2], vast voor 1 november van het kalenderjaar waarin dit artikel in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.4
    references:
