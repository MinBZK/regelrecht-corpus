      - id: ref5
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.1.13.2
    text: |-
      De jeugdhulpaanbieder in wiens gesloten accommodatie de machtiging ten uitvoer wordt gelegd, doet van de opneming
      in de gesloten accommodatie zo spoedig mogelijk mededeling aan degene die het gezag over de jeugdige uitoefent, aan
      het college en, indien het college niet de verzoeker was, tevens aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.1.13
  - number: 6.1.14
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld met betrekking tot het verzoekschrift, bedoeld in
      [artikel 6.1.8][ref1], en de verklaring waaruit instemming als bedoeld in de [artikelen 6.1.2, vijfde lid][ref2],
      [6.1.3, derde lid][ref3], of [6.1.4, derde lid][ref4], blijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.1.14
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.1.1
    text: |-
      De jeugdhulpaanbieder die in een gesloten accommodatie opname en verblijf biedt aan jeugdigen voor wie een
      machtiging als bedoeld in [artikel 6.1.2][ref1], [6.1.3][ref2] of [6.1.4][ref3] is afgegeven, verstrekt Onze
      Ministers, ter opneming in een openbaar register van zodanige accommodatie, een opgave van:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.2.1.1.a
    text: de naam en het adres van de accommodatie, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.1
  - number: 6.2.1.1.b
    text: de naam en de rechtsvorm van de jeugdhulpaanbieder.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.1
  - number: 6.2.1.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de veiligheid
      binnen de gesloten accommodatie en bouwkundige eisen ten aanzien van de gesloten accommodatie waar de machtiging
      ten uitvoer kan worden gelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.1
  - number: 6.2.1.3
    text: Een registratie wordt in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.1
  - number: 6.2.2.1
    text: |-
      Een machtiging kan slechts ten uitvoer worden gelegd in een op grond van [artikel 6.2.1][ref1] geregistreerde
      gesloten accommodatie.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.2.2.2
    text: |-
      De rechter kan, indien het een jeugdige betreft van twaalf jaar of ouder, op verzoek van het
      college of de raad voor de kinderbescherming, in zijn beschikking inzake de machtiging bepalen dat
      deze in afwijking van het eerste lid, ten uitvoer wordt gelegd in een inrichting als bedoeld in
      [artikel 1 van de Beginselenwet justitiële jeugdinrichtingen][ref1]. De eerste volzin wordt slechts toegepast met
      betrekking tot een jeugdige die op het tijdstip waarop een machtiging wordt verleend op basis van een veroordeling
      is opgenomen in een inrichting. Toepassing geschiedt slechts met instemming van de jeugdige of indien deze de
      leeftijd van zestien jaar nog niet heeft bereikt, met instemming van de jeugdige en degene die het gezag over hem
      heeft. De tenuitvoerlegging in een inrichting geschiedt slechts voor de termijn die nodig is om een behandeling
      of opleiding af te ronden. Op de tenuitvoerlegging is de [Beginselenwet justitiële jeugdinrichtingen][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0011756
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0011756
  - number: 6.2.3
    text: |-
      Een jeugdhulpaanbieder die aan een leerplichtige jeugdige verblijf biedt in een gesloten accommodatie is gedurende
      de looptijd van de machtiging een persoon die zich met de feitelijke verzorging van de jeugdige heeft belast als
      bedoeld in [artikel 2, eerste lid, van de Leerplichtwet 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002628#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.3
    references:
      - id: ref1
        bwb_id: BWBR0002628
        artikel: '2'
  - number: 6.2.4.1
    text: |-
      Een jeugdhulpaanbieder stelt met het oog op een zorgvuldige toepassing van maatregelen als bedoeld in
      [paragraaf 6.3][ref1] een regeling vast omtrent de personen die tot het treffen daarvan bevoegd zijn en met
      betrekking tot de wijze waarop tot toepassing wordt besloten.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.2.4.2
    text: |-
      Een jeugdhulpaanbieder stelt huisregels vast die betrekking hebben op een ordelijke gang van zaken, de veiligheid
      binnen de gesloten accommodatie en het waarborgen van een pedagogisch klimaat.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.4
  - number: 6.2.4.3
    text: |-
      De huisregels bevatten in ieder geval een regeling van de bezoektijden, van de controle van de bezoekers en van
      voorwerpen die jeugdigen in verband met de veiligheid binnen de gesloten accommodatie niet in hun bezit mogen
      hebben.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.2.4
  - number: 6.3.1.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te bereiken of voor zover
      noodzakelijk voor de veiligheid van de jeugdige of anderen, door de jeugdhulpaanbieder maatregelen worden toegepast
      waarmee hij tegen zijn wil of die van degene die het gezag over hem uitoefent, binnen de gesloten accommodatie in
      zijn vrijheden wordt beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.1.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.1
  - number: 6.3.1.2.a
    text: |-
      het verbod zich op te houden op in het hulpverleningsplan aangegeven plaatsen en zo nodig de tijdstippen waarop dat
      verbod geldt;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.1
  - number: 6.3.1.2.b
    text: tijdelijke plaatsing in afzondering;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.1
  - number: 6.3.1.2.c
    text: tijdelijke overplaatsing binnen de gesloten accommodatie of naar een andere gesloten accommodatie, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.1
  - number: 6.3.1.2.d
    text: het vastpakken en vasthouden.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.1
  - number: 6.3.1.3
    text: |-
      De jeugdhulpaanbieder meldt de toepassing van maatregelen als bedoeld in het tweede lid, onderdelen b en c, aan
      de gecertificeerde instelling die de gezinsvoogdij uitoefent alsmede aan de ouders indien de jeugdige niet onder
      toezicht is gesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.1
  - number: 6.3.2.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen door de jeugdhulpaanbieder tegen de wil van de jeugdige of van degene die het gezag over hem
      uitoefent:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.2.1.a
    text: |-
      jeugdhulpverleningsprogramma’s worden toegepast, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te
      bereiken, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.2
  - number: 6.3.2.1.b
    text: |-
      geneeskundige behandelingsmethoden, waaronder het toedienen van medicijnen, worden toegepast, voor zover
      noodzakelijk ter afwending van gevaar voor de gezondheid of de veiligheid van de jeugdige of anderen en de met de
      jeugdhulp beoogde doelen te bereiken.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.2
  - number: 6.3.2.2
    text: |-
      De jeugdhulpaanbieder meldt de toepassing van het eerste lid aan de gecertificeerde instelling die de gezinsvoogdij
      uitoefent alsmede aan de ouders indien de jeugdige niet onder toezicht is gesteld. Indien de geneeskundige
      behandelingsmethode wordt toegepast ter behandeling van een stoornis van de geestvermogens, wordt tevens melding
      gedaan aan de Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.2
  - number: 6.3.3.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te bereiken, door de
      jeugdhulpaanbieder tegen de wil van de jeugdige of van degene die het gezag over hem uitoefent en onverminderd de
      huisregels, bedoeld in [artikel 6.2.4, tweede lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.2'
  - number: 6.3.3.1.a
    text: beperkingen van het brief- en telefoonverkeer of het gebruik van andere communicatiemiddelen plaatsvinden, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.3
  - number: 6.3.3.1.b
    text: beperkingen van bezoek plaatsvinden of bepalen dat bezoek slechts onder toezicht kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.3
  - number: 6.3.3.2
    text: |-
      Op de beperkingen, bedoeld in het eerste lid, zijn de [artikelen 42, eerste en tweede lid][ref1], en
      [43, zevende lid, van de Beginselenwet justitiële jeugdinrichtingen][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel43
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '43'
  - number: 6.3.4.1
    text: |-
      Ten aanzien van een met een machtiging als bedoeld in de [artikelen 6.1.2 tot en met 6.1.4][ref1] opgenomen
      jeugdige kunnen, voor zover noodzakelijk om de met de jeugdhulp beoogde doelen te bereiken of voor zover
      noodzakelijk om te voorkomen dat de jeugdhulp aan andere jeugdigen wordt tegengewerkt, door de jeugdhulpaanbieder
      tegen de wil van de jeugdige of van degene die het gezag over hem uitoefent controlemaatregelen worden toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.4.2
    text: 'De maatregelen, bedoeld in het eerste lid, kunnen inhouden:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.4
  - number: 6.3.4.2.a
    text: onderzoek aan lichaam en kleding;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.4
  - number: 6.3.4.2.b
    text: onderzoek van urine op aanwezigheid van gedragsbeïnvloedende middelen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.4
  - number: 6.3.4.2.c
    text: onderzoek van de kamer van de jeugdige op de aanwezigheid van voorwerpen die hij niet in zijn bezit mag hebben, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.4
  - number: 6.3.4.2.d
    text: |-
      onderzoek van poststukken afkomstig van of bestemd voor de jeugdigen op de aanwezigheid van voorwerpen, doch
      slechts in aanwezigheid van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.4
  - number: 6.3.4.3
    text: |-
      Voorwerpen die niet in het bezit van de jeugdige mogen zijn worden in beslag genomen en voor de jeugdige bewaard of
      met zijn toestemming vernietigd, dan wel aan een opsporingsambtenaar ter hand gesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.4
  - number: 6.3.5.1
    text: |-
      Indien een jeugdhulpaanbieder met het oog op de veiligheid van de jeugdige of anderen dan wel om te voorkomen
      dat de jeugdige zich onttrekt aan de tenuitvoerlegging van de machtiging, bedoeld in de [artikelen 6.1.2][ref1]
      en [6.1.3][ref2], bepaalt dat het vervoer van en naar een gesloten accommodatie plaatsvindt door een vervoerder
      als bedoeld in het derde lid, kunnen door de vervoerder, voor zover noodzakelijk met het oog op voren omschreven
      doeleinden ten aanzien van die jeugdige tijdens dat vervoer tegen zijn wil of van degene die het gezag over hem
      uitoefent, voor de duur van het vervoer de volgende maatregelen worden genomen:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 6.3.5.1.a
    text: vastpakken en vasthouden;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.5
  - number: 6.3.5.1.b
    text: onderzoek aan kleding, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.5
  - number: 6.3.5.1.c
    text: tijdelijke plaatsing in een afzonderlijke en af te sluiten ruimte in het vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.5
  - number: 6.3.5.2
    text: |-
      Zodra de maatregelen, bedoeld in het eerste lid, in het hulpverleningsplan zijn opgenomen, worden zij
      dienovereenkomstig ten uitvoer gelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.5
  - number: 6.3.5.3
    text: |-
      Een vervoerder als bedoeld in het eerste lid is een door Onze Ministers daartoe aangewezen vervoerder die voldoet
      aan de bij regeling van Onze Ministers gestelde eisen, waaronder eisen omtrent het door de vervoerder te gebruiken
      vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.5
  - number: 6.3.5.4
    text: |-
      In geval van vervoer als bedoeld in het eerste lid meldt de vervoerder de toepassing van een of meer van de in dat
      lid genoemde maatregelen aan de jeugdhulpaanbieder en de gecertificeerde instelling. Indien de jeugdige niet onder
      toezicht is gesteld, licht de zorgaanbieder tevens de ouders in.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.5
  - number: 6.3.6.1
    text: |-
      De maatregelen, methoden en beperkingen als bedoeld in de [artikelen 6.3.1 tot en met 6.3.5][ref1] worden slechts
      toegepast, voor zover zij zijn opgenomen in het hulpverleningsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.6.2
    text: |-
      Voorafgaand aan de vaststelling of wijziging van deze onderdelen van het hulpverleningsplan wordt overleg gevoerd
      met degene die het gezag over de jeugdige heeft. Zij behoeven niet de instemming van de jeugdige of degene die het
      gezag over hem heeft. Zij behoeven wel de instemming van een gekwalificeerde gedragswetenschapper.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.6
  - number: 6.3.6.3
    text: |-
      Indien het plan maatregelen, methoden of beperkingen als bedoeld in het eerste lid bevat omschrijft het tevens de
      gevallen waarin en de termijn gedurende welke de maatregelen kunnen worden toegepast.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.6
  - number: 6.3.6.4
    text: |-
      Een hulpverleningsplan ten aanzien van een jeugdige die met een machtiging in een gesloten accommodatie verblijft,
      wordt zo vaak geëvalueerd als in het belang van de jeugdige noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.6
  - number: 6.3.7
    text: |-
      In afwijking van [artikel 6.3.6, eerste lid][ref1], kunnen met betrekking tot een jeugdige, slechts maatregelen,
      methoden of beperkingen als bedoeld in de [artikelen 6.3.1 tot en met 6.3.4][ref2] die niet opgenomen zijn in
      het hulpverleningsplan worden toegepast, voor zover noodzakelijk ter overbrugging van tijdelijke noodsituaties.
      De toepassing behoeft binnen vierentwintig uur nadat deze is aangevangen de instemming van een gekwalificeerde
      gedragswetenschapper. De maatregelen, methoden of beperkingen worden ten hoogste gedurende zeven opeenvolgende
      dagen toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.8.1
    text: |-
      Ten aanzien van een jeugdige voor wie een machtiging is afgegeven en die in verband met deze machtiging aanwezig
      is in het gerechtsgebouw, kunnen, om te voorkomen dat de jeugdige zich onttrekt aan de tenuitvoerlegging van de
      machtiging, tegen de wil van de jeugdige of van degene die het gezag over hem uitoefent, voor de duur van zijn
      aanwezigheid aldaar de volgende maatregelen worden genomen:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.8
  - number: 6.3.8.1.a
    text: vastpakken en vasthouden;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.8
  - number: 6.3.8.1.b
    text: onderzoek aan kleding, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.8
  - number: 6.3.8.1.c
    text: tijdelijke plaatsing in een geschikte, afzonderlijke en af te sluiten ruimte.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.8
  - number: 6.3.8.2
    text: |-
      De maatregelen, bedoeld in het eerste lid, worden uitsluitend ten uitvoer gelegd door ambtenaren aangewezen voor de
      uitvoering van de politietaak, bedoeld in [artikel 3 van de Politiewet 2012][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.8
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
  - number: 6.3.9.1
    text: |-
      Degene die de beslissing heeft genomen tot toepassing van de [artikelen 6.3.1 tot en met 6.3.4][ref1] of van
      [artikel 6.3.7][ref2], draagt er zorg voor dat de toepassing zo spoedig mogelijk in het dossier betreffende de
      jeugdige wordt vastgelegd, onder vermelding van de omstandigheden die daartoe aanleiding gaven.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.9.2
    text: |-
      De jeugdhulpaanbieder draagt er zorg voor dat de toepassing van een of meer van de in de
      [artikelen 6.3.5, eerste lid][ref1], of [6.3.8, eerste lid][ref2], genoemde maatregelen zo spoedig mogelijk in het
      dossier betreffende de jeugdige wordt vastgelegd, onder vermelding van de omstandigheden die daartoe aanleiding
      gaven.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
  - number: 6.3.9.3
    text: |-
      De jeugdhulpaanbieder die de machtiging gesloten jeugdhulp uitvoert, verstrekt aan de gecertificeerde instelling
      die de gezinsvoogdij uitoefent alsmede aan de ouders indien de jeugdige niet onder toezicht is gesteld, elk half
      jaar een rapportage over de toepassingen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.3.9
  - number: 6.4.1.1
    text: |-
      Aan een jeugdige kan, naast de mogelijkheden die het hulpverleningsplan biedt om de gesloten accommodatie te
      verlaten, verlof om de gesloten accommodatie te verlaten worden verleend indien zulks, gelet op de reden waarom de
      jeugdige in de gesloten accommodatie moet verblijven, verantwoord is.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.4.1
  - number: 6.4.1.2
    text: Aan het verlof kunnen voorwaarden worden verbonden betreffende de jeugdhulp en het gedrag van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.4.1
  - number: 6.4.1.3
    text: |-
      Verlof wordt slechts verleend indien redelijkerwijs kan worden aangenomen dat de jeugdige de voorwaarden zal
      naleven.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.4.1
  - number: 6.4.1.4
    text: Verlof wordt niet verleend dan nadat een gekwalificeerde gedragswetenschapper daarmee heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.4.1
  - number: 6.4.1.5
    text: |-
      Het verlof wordt ingetrokken indien voortzetting van het verlof, gezien de problemen van de jeugdige, niet langer
      verantwoord is. Het verlof kan worden ingetrokken indien de jeugdige zich niet aan de voorwaarden houdt. De aan het
      verlof verbonden voorwaarden kunnen worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.4.1
  - number: 6.5.1.1
    text: |-
      Onverminderd [artikel 4.2.3][ref1] kan een jeugdige of degene die het gezag over hem heeft binnen
      een redelijke termijn tegen een beslissing als bedoeld in de [artikelen 6.3.1, eerste lid][ref2],
      [6.3.2, eerste lid][ref3], [6.3.3, eerste lid][ref4], en [6.3.4, eerste en derde lid][ref5], de toepassing
      van [artikel 6.3.5, eerste lid][ref6], [6.3.7][ref7] of een beslissing aangaande verlof als bedoeld in
      [artikel 6.4.1][ref8] een schriftelijke klacht indienen bij de klachtencommissie, bedoeld in artikel 4.2.1, tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref8]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref5
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref6
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref7
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.3'
      - id: ref8
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.4'
  - number: 6.5.1.2
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de samenstelling van de
      klachtencommissie bij de behandeling van klachten als bedoeld in het eerste lid en de wijze waarop deze klachten
      worden behandeld.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.3
    text: |-
      De klachtencommissie neemt zo spoedig mogelijk, doch in ieder geval binnen vier weken, te rekenen vanaf de datum
      waarop de klacht is ontvangen, een beslissing op de klacht.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.4
    text: 'De beslissing van de commissie strekt tot:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.4.a
    text: onbevoegdverklaring van de commissie,
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.4.b
    text: niet-ontvankelijkverklaring van de klacht,
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.4.c
    text: ongegrondverklaring van de klacht, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.4.d
    text: gegrondverklaring van de klacht.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.5
    text: |-
      Indien de commissie de klacht gegrond verklaart, vernietigt zij de bestreden beslissing geheel of gedeeltelijk.
      Gehele of gedeeltelijke vernietiging brengt vernietiging van de rechtsgevolgen van de beslissing of het vernietigde
      gedeelte van de beslissing mee.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.6
    text: |-
      Indien de commissie de klacht gegrond verklaart, kan zij degene die de beslissing heeft genomen opdragen een nieuwe
      beslissing te nemen en voor het nemen daarvan een termijn stellen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.7
    text: |-
      Indien de commissie de klacht gegrond verklaart, kan zij bepalen dat enige tegemoetkoming, die geldelijk van aard
      kan zijn, aan de klager geboden is en stelt zij deze tegemoetkoming vast.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
  - number: 6.5.1.8
    text: |-
      [Titel 9.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op klachten als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 6.5.2.1
    text: |-
      Hangende de beslissing op de klacht kan de voorzitter van een beroepscommissie als bedoeld in
      [artikel 74 van de Beginselenwet justitiële jeugdinrichtingen][ref1] op verzoek van de jeugdige, gehoord degene
      die de beslissing heeft genomen, de beslissing waartegen de klacht is gericht, schorsen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel74
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '74'
  - number: 6.5.2.2
    text: De voorzitter doet hiervan onverwijld mededeling aan degene die de beslissing heeft genomen en aan de klager.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.2
  - number: 6.5.3
    text: |-
      Ten aanzien van een beslissing als bedoeld in [artikel 6.5.1, derde lid][ref1], zijn de
      [artikelen 74 tot en met 76 van de Beginselenwet justitiële jeugdinrichtingen][ref2] van overeenkomstige
      toepassing, met dien verstande dat voor «directeur» respectievelijk «beklagcommissie» gelezen wordt
      «jeugdhulpaanbieder» respectievelijk «klachtencommissie».


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011756#Artikel74
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel6.5.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.5'
      - id: ref2
        bwb_id: BWBR0011756
        artikel: '74'
  - number: 7.1.1.1
    text: |-
      In deze paragraaf en de daarop berustende bepalingen wordt verstaan onder: - *hulp, zorg of bijsturing:*
      werkzaamheden die een meldingsbevoegde op grond van de voor hem geldende regelgeving ten behoeve van een jeugdige
      verricht;
        - *jeugdige:* persoon die de leeftijd van drieëntwintig jaar nog niet heeft bereikt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.1
  - number: 7.1.1.2.1
    text: 'Meldingsbevoegde is een functionaris die werkzaam is voor een instantie die:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.2
  - number: 7.1.1.2.1.a
    text: |-
      behoort tot een bij algemene maatregel van bestuur aangewezen categorie van instanties die werkzaam is in een of
      meer van de domeinen jeugdhulp, jeugdgezondheidszorg, gezondheidszorg, onderwijs, maatschappelijke ondersteuning,
      werk en inkomen, of politie en justitie,
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.2
  - number: 7.1.1.2.1.b
    text: |-
      afspraken als bedoeld in [artikel 7.1.3.1][ref1] heeft gemaakt met het college, en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.1.2.1.c
    text: de functionaris als zodanig heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.2
  - number: 7.1.1.2.2
    text: 'Meldingsbevoegde is voorts een functionaris die niet werkzaam is voor een instantie en die:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.2
  - number: 7.1.1.2.2.a
    text: |-
      behoort tot een bij algemene maatregel van bestuur aangewezen categorie van functionarissen die werkzaam is in een
      of meer van de in het eerste lid, onderdeel a, genoemde domeinen, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.2
  - number: 7.1.1.2.2.b
    text: |-
      afspraken als bedoeld in [artikel 7.1.3.1][ref1] heeft gemaakt met het college.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.1.1
    text: |-
      Er is een verwijsindex risicojongeren, zijnde een landelijk elektronisch systeem, waarin persoonsgegevens alsmede
      andere gegevens worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.1
  - number: 7.1.2.1.2
    text: |-
      De verwijsindex heeft tot doel vroegtijdige en onderlinge afstemming tussen meldingsbevoegden te bewerkstelligen,
      opdat zij jeugdigen tijdig passende hulp, zorg of bijsturing kunnen verlenen om daadwerkelijke bedreigingen van de
      noodzakelijke condities voor een gezonde en veilige ontwikkeling naar volwassenheid te voorkomen, te beperken of
      weg te nemen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.1
  - number: 7.1.2.1.3
    text: De verwijsindex wordt uitsluitend gebruikt voor het in het tweede lid aangegeven doel.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.1
  - number: 7.1.2.2.1
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport draagt zorg voor de inrichting en het beheer van de
      verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.2
  - number: 7.1.2.2.2
    text: Onze Minister van Volksgezondheid, Welzijn en Sport is de verwerkingsverantwoordelijke voor de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.2
  - number: 7.1.2.2.3
    text: |-
      In afwijking van het tweede lid, is voor de toepassing van de artikelen 12 tot en met 23 en 33 van de Algemene
      verordening gegevensbescherming de verwerkingsverantwoordelijke het college van de gemeente die afspraken als
      bedoeld in [artikel 7.1.3.1][ref1] heeft gemaakt met de instantie waarvoor de meldingsbevoegde die de jeugdige
      heeft gemeld werkzaam is of, indien die niet werkzaam is voor een instantie, met de meldingsbevoegde.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.2.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inrichting en het beheer van de
      verwijsindex. Daartoe behoren in elk geval regels omtrent de beveiliging van persoonsgegevens en de beschikbaarheid
      van voorzieningen die deel uitmaken van de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.2
  - number: 7.1.2.3.1
    text: 'Van de verwijsindex maken deel uit:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.a
    text: |-
      voorzieningen waarmee de verwijsindex met het oog op het verwerken van een melding het burgerservicenummer van de
      betrokken jeugdige kan opvragen of verifiëren;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.b
    text: voorzieningen waarmee een jeugdige aan de verwijsindex kan worden gemeld of eruit kan worden verwijderd;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.c
    text: |-
      voorzieningen waarmee bij twee of meer meldingen van dezelfde jeugdige een signaal wordt gezonden naar de
      meldingsbevoegden die de betrokken jeugdige hebben gemeld en naar degene die belast is met de taken, bedoeld in
      [artikel 7.1.3.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.3.1.d
    text: |-
      voorzieningen waarmee bij twee of meer meldingen van jeugdigen met hetzelfde woonadres, bedoeld in de
      [Wet basisregistratie personen][ref1], niet zijnde het adres van een instelling die is aangewezen op grond van
      [artikel 2.40, derde of vierde lid, van die wet][ref2], een signaal wordt gezonden naar de meldingsbevoegden die de
      betrokken jeugdige hebben gemeld en naar degene die belast is met de taken, bedoeld in [artikel 7.1.3.2][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0033715
      [ref2]: https://wetten.overheid.nl/BWBR0033715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0033715
      - id: ref2
        bwb_id: BWBR0033715
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.3.1.e
    text: |-
      voorzieningen waarmee bij twee of meer meldingen van jeugdigen met eenzelfde in de basisregistratie personen
      opgenomen ouder, een signaal wordt gezonden naar de meldingsbevoegden die de betrokken jeugdige hebben gemeld en
      naar degene die belast is met de taken, bedoeld in [artikel 7.1.3.2][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.2.3.1.f
    text: |-
      een logboek dat registreert welke meldingsbevoegde wanneer een jeugdige aan de verwijsindex heeft gemeld, hem
      daaruit heeft verwijderd of een signaal heeft ontvangen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.g
    text: |-
      voorzieningen waarmee verhuisbewegingen van aan de verwijsindex gemelde jeugdigen worden geregistreerd en
      doorgegeven aan de meldingsbevoegde die de jeugdige heeft gemeld en, indien de jeugdige naar een andere gemeente is
      verhuisd, aan de regievoerder van de gemeente waarnaar de jeugdige is verhuisd;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.h
    text: 'voorzieningen waarmee ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.h.1°
    text: het toezicht op de naleving inzage kan worden gegeven in de verwijsindex;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.h.2°
    text: |-
      beleidsinformatie en het toezicht op de naleving rapportages over het gebruik van de verwijsindex kunnen worden
      samengesteld en opgevraagd, bestaande uit niet tot specifieke jeugdigen of specifieke meldingsbevoegden herleidbare
      gegevens, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.1.i
    text: |-
      voorzieningen waarmee aan de jeugdige bij de toepassing van de artikelen 15 tot en met 23 en 33 van de Algemene
      verordening gegevensbescherming inzage kan worden verleend in een hem betreffende melding in de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.2
    text: |-
      Bij de verwijsindex is een historisch meldingenarchief gevoegd waarin uit de verwijsindex verwijderde meldingen
      worden opgenomen. Het historisch meldingenarchief heeft tot doel de verdere verlening van hulp, zorg of bijsturing
      ten behoeve van een jeugdige te ondersteunen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.2.3.3
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een effectief gebruik van de verwijsindex noodzakelijke
      andere voorzieningen worden aangewezen die aan de verwijsindex worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.2.3
  - number: 7.1.3.1.1
    text: |-
      Het college bevordert het gebruik van de verwijsindex. Daartoe maakt het college afspraken met de binnen zijn
      gemeente werkzame instanties en functionarissen, voor zover zij behoren tot een categorie die is aangewezen bij de
      algemene maatregel van bestuur, bedoeld in [artikel 7.1.1.2][ref1]. Het college organiseert voorts de aansluiting
      van die instanties en functionarissen op de verwijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.3.1.2
    text: |-
      De afspraken betreffen in elk geval de wijze waarop het college samenwerkt met die instanties en functionarissen,
      en die instanties en functionarissen onderling samenwerken bij het verlenen van hulp, zorg of bijsturing ten
      behoeve van jeugdigen, alsmede het beheer en de nakoming van die afspraken. De afspraken worden schriftelijk
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.3.1
  - number: 7.1.3.2.1
    text: |-
      Het college draagt er zorg voor dat wordt nagegaan of de meldingsbevoegden die een jeugdige aan de verwijsindex
      hebben gemeld en vervolgens daaruit een signaal hebben ontvangen, met elkaar contact hebben opgenomen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.3.2
  - number: 7.1.3.2.2
    text: |-
      Degene die belast is met de taken, bedoeld in het eerste lid, heeft uitsluitend ten behoeve daarvan toegang tot
      de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.3.2
  - number: 7.1.3.3.1
    text: |-
      Instanties als bedoeld in [artikel 7.1.1.2, eerste lid, onderdeel a,][ref1] kunnen met het oog op een effectief
      gebruik van de verwijsindex een binnen hun instantie werkzame coördinator aanwijzen. De coördinator heeft als taak
      de contactgegevens van de meldingsbevoegden te beheren en zo nodig aan te passen en de signalen uit de verwijsindex
      te beheren.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.3.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.3.3.2
    text: Een coördinator heeft uitsluitend ten behoeve van de taak, bedoeld in het eerste lid, toegang tot de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.3.3
  - number: 7.1.4.1
    text: |-
      Een meldingsbevoegde kan zonder toestemming van de jeugdige of zijn wettelijk vertegenwoordiger en zo nodig met
      doorbreking van de op grond van zijn ambt of beroep geldende plicht tot geheimhouding, een jeugdige melden aan
      de verwijsindex indien hij een redelijk vermoeden heeft dat de jeugdige door een of meer van de hierna genoemde
      risico’s in de noodzakelijke condities voor een gezonde en veilige ontwikkeling naar volwassenheid daadwerkelijk
      wordt bedreigd:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.a
    text: |-
      de jeugdige staat bloot aan geestelijk, lichamelijk of seksueel geweld, enige andere vernederende behandeling,
      of verwaarlozing;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.b
    text: |-
      de jeugdige heeft meer of andere dan bij zijn leeftijd normaliter voorkomende psychische problemen, waaronder
      verslaving aan alcohol, drugs of kansspelen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.c
    text: de jeugdige heeft meer dan bij zijn leeftijd normaliter voorkomende ernstige opgroei- of opvoedingsproblemen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.d
    text: de jeugdige is minderjarig en moeder of zwanger;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.e
    text: |-
      de jeugdige verzuimt veelvuldig van school of andere onderwijsinstelling, dan wel verlaat die voortijdig of dreigt
      die voortijdig te verlaten;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.f
    text: de jeugdige is niet gemotiveerd om door legale arbeid in zijn levensonderhoud te voorzien;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.g
    text: de jeugdige heeft meer of andere dan bij zijn leeftijd normaliter voorkomende financiële problemen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.h
    text: de jeugdige heeft geen vaste woon- of verblijfplaats;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.i
    text: de jeugdige is een gevaar voor anderen door lichamelijk of geestelijk geweld of ander intimiderend gedrag;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.j
    text: de jeugdige laat zich in met activiteiten die strafbaar zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.k
    text: |-
      de ouders of andere verzorgers van de jeugdige schieten ernstig tekort in de verzorging of opvoeding van de
      jeugdige, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.1.l
    text: de jeugdige staat bloot aan risico’s die in bepaalde etnische groepen onevenredig vaak voorkomen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.1
  - number: 7.1.4.2.1
    text: |-
      Een melding wordt in de verwijsindex gekoppeld aan het burgerservicenummer van de jeugdige, met als doel te
      waarborgen dat de melding betrekking heeft op die jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.2
  - number: 7.1.4.2.2
    text: |-
      Indien de melding afkomstig is van een meldingsbevoegde die op grond van een wettelijke bepaling reeds bevoegd is
      het burgerservicenummer van de jeugdige te gebruiken, biedt hij de melding met dat nummer aan de verwijsindex aan.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.2
  - number: 7.1.4.2.3
    text: |-
      In andere gevallen biedt de meldingsbevoegde de melding aan de verwijsindex aan zonder dat hij kennis kan nemen van
      het burgerservicenummer van de betrokken jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.2
  - number: 7.1.4.2.4
    text: |-
      Bij algemene maatregel van bestuur worden een persoonsidentificerend nummer en andere identificerende gegevens
      aangewezen die gebruikt worden om jeugdigen die niet beschikken over een burgerservicenummer te melden aan de
      verwijsindex. Bij of krachtens de maatregel worden voorts regels gesteld over de wijze waarop deze gegevens worden
      aangeboden aan de verwijsindex.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.2
  - number: 7.1.4.3.1
    text: |-
      Naast het burgerservicenummer van de jeugdige worden in de verwijsindex bij een melding uitsluitend de volgende
      gegevens opgeslagen:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.3
  - number: 7.1.4.3.1.a
    text: |-
      de identificatiegegevens en contactgegevens van de meldingsbevoegde die de melding doet, en, in voorkomend geval,
      van de coördinator, bedoeld in [artikel 7.1.3.3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.4.3.1.b
    text: de datum en het tijdstip van de melding, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.3
  - number: 7.1.4.3.1.c
    text: |-
      de datum waarop de melding op grond van [artikel 7.1.4.5, tweede lid, onderdeel a][ref1], uit de verwijsindex zal
      worden verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.4.3.2
    text: |-
      Een signaal uit de verwijsindex bevat uitsluitend de gegevens, genoemd in het eerste lid, onderdeel a, en, indien
      het signaal voortvloeit uit twee of meer meldingen die niet dezelfde jeugdige betreffen, dit gegeven.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.3
  - number: 7.1.4.4
    text: |-
      Ten behoeve van de doeleinden, bedoeld in [artikel 7.1.2.1][ref1], worden gegevens over gezondheid, alsmede
      persoonsgegevens van strafrechtelijke aard verwerkt. De verwerking van deze gegevens vindt uitsluitend plaats
      teneinde meldingsbevoegden uit de domeinen jeugdgezondheidszorg, gezondheidszorg en politie en justitie in staat
      te stellen een jeugdige aan de verwijsindex te melden alsmede andere meldingsbevoegden in staat te stellen van deze
      melding kennis te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.4.5.1
    text: 'Een meldingsbevoegde verwijdert een door hem gedane melding uit de verwijsindex indien naar zijn oordeel:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.5
  - number: 7.1.4.5.1.a
    text: die melding niet terecht is gedaan;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.5
  - number: 7.1.4.5.1.b
    text: het eerder gesignaleerde risico niet meer aanwezig is.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.5
  - number: 7.1.4.5.2
    text: 'Een melding wordt voorts in elk geval uit de verwijsindex verwijderd:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.5
  - number: 7.1.4.5.2.a
    text: ten hoogste twee jaar nadat zij is gedaan;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.5
  - number: 7.1.4.5.2.b
    text: met ingang van de dag dat de jeugdige de leeftijd van drieëntwintig jaar bereikt, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.5
  - number: 7.1.4.5.2.c
    text: zo spoedig mogelijk na het overlijden van de jeugdige.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.5
  - number: 7.1.4.6.1
    text: |-
      Een overeenkomstig [artikel 7.1.4.5, eerste lid, onderdeel b, en tweede lid, onderdeel a][ref1], uit de
      verwijsindex verwijderde melding wordt gedurende vijf jaren opgenomen in een historisch meldingenarchief, met dien
      verstande dat die opname wordt vernietigd met ingang van de dag dat de jeugdige de leeftijd van drieëntwintig jaar
      bereikt of zo spoedig mogelijk na het overlijden van de jeugdige. Meldingen die uit de verwijsindex zijn verwijderd
      met toepassing van [artikel 7.1.4.5, eerste lid, onderdeel a, of het tweede lid, onderdelen b of c][ref2],
      of de artikelen 16, 17 en 21 van de Algemene verordening gegevensbescherming, worden niet in het historisch
      meldingenarchief opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.4.6.2
    text: |-
      Van een in het historisch meldingenarchief opgenomen melding wordt uitsluitend en eenmalig een signaal aangeboden
      aan een meldingsbevoegde op het moment dat hij een jeugdige aan de verwijsindex meldt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.6
  - number: 7.1.4.6.3
    text: |-
      De [artikelen 7.1.2.2][ref1] en [7.1.2.3, eerste lid, aanhef, juncto onderdelen h en i][ref2], zijn van
      overeenkomstige toepassing op het historisch meldingenarchief. Van het historisch meldingenarchief maakt een
      voorziening deel uit waarmee een jeugdige uit het historisch meldingenarchief kan worden verwijderd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.4.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: 7.1.5.1.1
    text: |-
      Indien een melding betrekking heeft op een jeugdige die jonger is dan twaalf jaar wordt de mededeling, bedoeld in
      artikel 14 van de Algemene verordening gegevensbescherming gedaan aan zijn wettelijk vertegenwoordiger. Indien de
      jeugdige de leeftijd van twaalf, maar nog niet die van zestien jaar heeft bereikt, wordt de mededeling zowel aan de
      jeugdige als zijn wettelijk vertegenwoordiger gedaan.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.5.1
  - number: 7.1.5.1.2
    text: |-
      Indien de jeugdige jonger is dan twaalf jaar wordt een verzoek als bedoeld in de artikelen 15, 16 of 17 van de
      Algemene verordening gegevensbescherming of een aantekening van een bezwaar als bedoeld in artikel 21 van die
      verordening gedaan door zijn wettelijk vertegenwoordiger. Indien de jeugdige de leeftijd van twaalf, maar nog niet
      die van zestien jaar heeft bereikt, wordt het verzoek of de aantekening van bezwaar gedaan door de jeugdige en zijn
      wettelijk vertegenwoordiger gezamenlijk.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.5.1
  - number: 7.1.5.2.1
    text: |-
      Een meldingsbevoegde die een jeugdige aan de verwijsindex heeft gemeld, brengt aan het college een advies uit over
      een door die jeugdige aan hem gedaan verzoek als bedoeld in de artikelen 15, 16 of 17 van de Algemene verordening
      gegevensbescherming, of over een bij hem aangetekend bezwaar als bedoeld in artikel 21 van die verordening.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.5.2
  - number: 7.1.5.2.2
    text: |-
      De meldingsbevoegde verstrekt het college overigens alle inlichtingen die nodig zijn met
      het oog op de uitvoering door het college van de in het eerste lid genoemde artikelen en
      van artikel 23 van de Algemene verordening gegevensbescherming en[ artikelen 41][ref1] en
      [42 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Artikel42
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.1.5.2
    references:
      - id: ref1
        bwb_id: BWBR0040940
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0040940
        artikel: '42'
  - number: 7.2.1.1
    text: |-
      De gecertificeerde instelling, de jeugdhulpaanbieder, de raad voor de kinderbescherming en het college gebruiken
      het burgerservicenummer van een jeugdige met het doel te waarborgen dat de in het kader van de uitvoering van deze
      wet en de daarop berustende bepalingen te verwerken persoonsgegevens op die jeugdige betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.1
  - number: 7.2.1.2
    text: |-
      Het eerste lid is niet van toepassing op een gecertificeerde instelling, voor zover deze ter uitvoering van de
      taken in het kader van jeugdreclassering, persoonsgegevens uitwisselt van verdachten en veroordeelden ten behoeve
      van de toepassing van het strafrecht.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.1
  - number: 7.2.2
    text: |-
      De gecertificeerde instelling, de jeugdhulpaanbieder, de raad voor de kinderbescherming en het college stellen het
      burgerservicenummer van een jeugdige vast wanneer zij voor de eerste maal contact met de jeugdige hebben in het
      kader van de uitvoering van deze wet en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.2
  - number: 7.2.3.1
    text: |-
      Teneinde het burgerservicenummer van de jeugdige vast te stellen worden het nummerregister en de voorzieningen,
      bedoeld in [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref1]
      geraadpleegd.


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.3.2
    text: 'De raadpleging, bedoeld in het eerste lid, kan achterwege gelaten worden, indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.3
  - number: 7.2.3.2.a
    text: |-
      het burgerservicenummer is verstrekt door een andere gebruiker als bedoeld in
      [artikel 1 van de Wet algemene bepalingen burgerservicenummer][ref1] die bij of krachtens wet gehouden is het
      burgerservicenummer van de jeugdige vast te stellen aan de hand van het nummerregister en de voorzieningen, bedoeld
      in [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.3
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.3.2.b
    text: het burgerservicenummer is verkregen uit de basisregistratie personen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.3
  - number: 7.2.4
    text: 'Indien aan een jeugdige geen burgerservicenummer is toegekend:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.4
  - number: 7.2.4.a
    text: |-
      nemen gecertificeerde instellingen, jeugdhulpaanbieders, de raad voor de kinderbescherming en het college in ieder
      geval de volgende gegevens van de jeugdige in hun administratie op:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.4
  - number: 7.2.4.a.1°
    text: achternaam;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.4
  - number: 7.2.4.a.2°
    text: voornamen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.4
  - number: 7.2.4.a.3°
    text: geboortedatum, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.4
  - number: 7.2.4.a.4°
    text: postcode en huisnummer van het woonadres, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.4
  - number: 7.2.4.b
    text: |-
      vermelden gecertificeerde instellingen, jeugdhulpaanbieders, de raad voor de kinderbescherming en het college de
      gegevens, bedoeld in onderdeel a, bij het verstrekken van persoonsgegevens met betrekking tot de uitvoering van hun
      taken en de verlening van jeugdhulp.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.4
  - number: 7.2.5
    text: |-
      Bij regeling van Onze Minister van Volksgezondheid, Welzijn en Sport wordt bepaald aan welke beveiligingseisen de
      gegevensverwerking, bedoeld in de [artikelen 7.2.1][ref1] en [7.2.4][ref2] voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.6.1
    text: |-
      Gecertificeerde instellingen, jeugdhulpaanbieders, de raad voor de kinderbescherming en het college kunnen van de
      bij de [artikelen 7.2.1 tot en met 7.2.4][ref1] gestelde verplichtingen afwijken voor zolang dit noodzakelijk is
      met betrekking tot spoedeisende gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.6.2
    text: |-
      Indien op grond van het eerste lid wordt afgeweken van bij de [artikelen 7.2.1 tot en met 7.2.4][ref1] gestelde
      verplichtingen is het bepaalde krachtens [artikel 7.2.5][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.7
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport of een door hem aangewezen instelling
      beheert een autorisatielijst van jeugdhulpaanbieders, waarin zij op verzoek worden opgenomen
      teneinde gebruik te kunnen maken van het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.7
    references:
      - id: ref1
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.8.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld over:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
  - number: 7.2.8.1.a
    text: |-
      het opnemen, wijzigen, en verwijderen van gegevens in, onderscheidenlijk uit, de in [artikel 7.2.7][ref1] bedoelde
      autorisatielijst van jeugdhulpaanbieders;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 7.2.8.1.b
    text: het beheer van de autorisatielijst, in ieder geval wat betreft de beveiliging van persoonsgegevens, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
  - number: 7.2.8.1.c
    text: het toezicht op het functioneren van de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
  - number: 7.2.8.2
    text: |-
      Bij de maatregel, bedoeld in het eerste lid, kunnen bijdragen van jeugdhulpaanbieders worden verlangd in de kosten
      van de autorisatielijst.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
  - number: 7.2.8.3
    text: |-
      De beheerder van de autorisatielijst, bedoeld in [artikel 7.2.7][ref1], verschaft aan een in de autorisatielijst
      ingeschreven jeugdhulpaanbieder op diens verzoek een middel waarmee deze ten behoeve van de raadpleging,
      bedoeld in [artikel 7.2.3][ref2], toegang kan krijgen tot het nummerregister en de voorzieningen, bedoeld in
      [artikel 3, eerste lid, onderdelen b en d, van de Wet algemene bepalingen burgerservicenummer][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0022428#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref3
        bwb_id: BWBR0022428
        artikel: '3'
  - number: 7.2.8.4
    text: De beheerder kan voor het middel een vergoeding verlangen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
  - number: 7.2.8.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de kenmerken, de aanvraag, de
      procedure, de verstrekking, het beheer, de beveiliging, het gebruik en de intrekking van het middel bedoeld in het
      derde lid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.8
  - number: 7.2.9
    text: |-
      Ten behoeve van de verantwoordelijkheid, bedoeld in de [artikelen 2.1][ref1] en [2.4, tweede lid][ref2], kan Onze
      Minister van Veiligheid en Justitie aan een door het college aangewezen ambtenaar of aan een door het college
      aangewezen en onder zijn verantwoordelijkheid werkzame functionaris het burgerservicenummer verstrekken van een
      jeugdige ten aanzien van wie in het kader van een strafrechtelijke beslissing is bepaald dat hij in aanmerking komt
      voor een vorm van jeugdhulp of jeugdreclassering.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel2
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.2.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '2'
        hoofdstuk: '2'
  - number: 7.3.1.1
    text: |-
      Hetgeen in deze paragraaf, met uitzondering van de [artikelen 7.3.4][ref1], [7.3.5][ref2], [7.3.6][ref3] en
      [7.3.16][ref4], is bepaald ten aanzien van de jeugdhulpverlener is van overeenkomstige toepassing op de medewerker
      van de gecertificeerde instelling, met dien verstande dat voor «jeugdhulp» of «verlening van jeugdhulp» wordt
      gelezen «uitvoering van een kinderbeschermingsmaatregel of jeugdreclassering».


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.1.2
    text: |-
      In deze paragraaf wordt verstaan onder betrokkene: persoon aan wie rechtstreeks jeugdhulp wordt verleend, ten
      aanzien van wie de verlening van jeugdhulp wordt voorgesteld of ten aanzien van wie een kinderbeschermingsmaatregel
      of jeugdreclassering uitgevoerd wordt of de uitvoering daarvan wordt voorgesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.1
  - number: 7.3.1.3
    text: |-
      Voor zover sprake is van een geneeskundige behandeling als bedoeld in
      [artikel 446 van Boek 7 van het Burgerlijk Wetboek][ref1], is deze paragraaf niet van toepassing, behoudens de
      [artikelen 7.3.11, vierde en vijfde lid][ref2], en [7.3.17][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel446
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '446'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.2.1
    text: |-
      De jeugdhulpverlener licht de betrokkene op duidelijke wijze in, die past bij zijn bevattingsvermogen, en overlegt
      tijdig met de betrokkene over het voorgenomen onderzoek, de voorgestelde jeugdhulp, de ontwikkelingen omtrent
      de jeugdhulp en over de geconstateerde opgroei- en opvoedingsproblemen, psychische problemen en stoornissen. De
      jeugdhulpverlener licht een jeugdige die de leeftijd van twaalf jaar nog niet heeft bereikt, op zodanige wijze in
      als past bij zijn bevattingsvermogen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.2
    text: |-
      Bij het uitvoeren van de in lid 1 neergelegde verplichting laat de jeugdhulpverlener zich leiden door hetgeen de
      betrokkene redelijkerwijze dient te weten ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.2.a
    text: de aard en het doel van het voorgenomen onderzoek, de voorgestelde jeugdhulp of de uit te voeren verrichtingen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.2.b
    text: |-
      de te verwachten gevolgen en risico’s voor de gezondheid van de betrokkene bij het voorgestelde onderzoek, de
      voorgestelde jeugdhulp, de uit te voeren verrichtingen en bij de mogelijkheid om geen jeugdhulp te verlenen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.2.c
    text: andere mogelijke methoden van onderzoek en jeugdhulp al dan niet uitgevoerd door andere hulpverleners;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.2.d
    text: |-
      de staat van en de vooruitzichten met betrekking tot de geconstateerde opgroei- en opvoedingsproblemen, psychische
      problemen en stoornissen in relatie tot de te verlenen jeugdhulp;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.2.e
    text: |-
      de termijn waarop de mogelijke methoden van onderzoek of jeugdhulp kunnen worden uitgevoerd en de verwachte
      tijdsduur ervan.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.3
    text: |-
      De jeugdhulpverlener stelt zich tijdens het overleg op de hoogte van de situatie en behoeften van de betrokkene,
      nodigt de betrokkene uit om vragen te stellen en verstrekt desgevraagd schriftelijk of elektronisch informatie over
      het in het tweede lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.2.4
    text: |-
      De hulpverlener mag de betrokkene bedoelde inlichtingen slechts onthouden voor zover het verstrekken ervan
      kennelijk ernstig nadeel voor de betrokkene zou opleveren. Indien het belang van de betrokkene dit vereist,
      dient de jeugdhulpverlener de desbetreffende inlichtingen aan een ander te verstrekken. De inlichtingen worden de
      betrokkene alsnog gegeven, zodra bedoeld nadeel niet meer te duchten is. De jeugdhulpverlener maakt geen gebruik
      van zijn in de eerste volzin bedoelde bevoegdheid dan nadat hij daarover een andere jeugdhulpverlener heeft
      geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.2
  - number: 7.3.3
    text: |-
      Indien de betrokkene te kennen heeft gegeven geen inlichtingen te willen ontvangen, blijft het verstrekken daarvan
      achterwege, behoudens voor zover het belang dat de betrokkene daarbij heeft niet opweegt tegen het nadeel dat
      daaruit voor hemzelf of anderen kan voortvloeien.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.3
  - number: 7.3.4.1
    text: |-
      Voor het verlenen van jeugdhulp is de toestemming van de betrokkene vereist, tenzij het jeugdhulp
      betreft in het kader van een machtiging gesloten jeugdhulp, een spoedmachtiging gesloten jeugdhulp, een
      kinderbeschermingsmaatregel of jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.4
  - number: 7.3.4.2
    text: |-
      Indien de betrokkene minderjarig is en de leeftijd van twaalf maar nog niet die van zestien jaar heeft bereikt,
      is tevens de toestemming van de ouders die het gezag over hem uitoefenen of van zijn voogd vereist. De jeugdhulp
      kan evenwel zonder de toestemming van die ouders of de voogd worden verleend, indien zij kennelijk nodig is
      teneinde ernstig nadeel voor de betrokkene te voorkomen, alsmede indien de betrokkene ook na de weigering van de
      toestemming, de verrichting weloverwogen blijft wensen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.4
  - number: 7.3.4.3
    text: |-
      In het geval waarin een betrokkene van zestien jaar of ouder niet in staat kan worden geacht tot een redelijke
      waardering van zijn belangen ter zake, worden door de jeugdhulpverlener en een persoon als bedoeld in
      [artikel 7.3.15, tweede of derde lid][ref1], de kennelijke opvattingen van de betrokkene, geuit in schriftelijke
      vorm toen deze tot bedoelde redelijke waardering nog in staat was en inhoudende een weigering van toestemming als
      bedoeld in het eerste lid, opgevolgd. De jeugdhulpverlener kan hiervan afwijken indien hij daartoe gegronde redenen
      aanwezig acht.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.5.1
    text: |-
      Een minderjarige die de leeftijd van zestien jaar heeft bereikt, is bekwaam tot het verlenen van toestemming voor
      de verlening van jeugdhulp ten behoeve van zichzelf, alsmede tot het verrichten van rechtshandelingen die daarmee
      onmiddellijk verband houden.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.5
  - number: 7.3.5.2
    text: |-
      De minderjarige is aansprakelijk voor de daaruit voortvloeiende verbintenissen, onverminderd de verplichting van
      zijn ouders tot voorziening in de kosten van verzorging en opvoeding.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.5
  - number: 7.3.5.3
    text: |-
      In op die verlening van jeugdhulp betrekking hebbende aangelegenheden is de minderjarige bekwaam in en buiten
      rechte op te treden.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.5
  - number: 7.3.6
    text: |-
      Op verzoek van de betrokkene legt de jeugdhulpverlener in ieder geval schriftelijk vast voor welke verrichtingen
      van ingrijpende aard deze toestemming heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.6
  - number: 7.3.7
    text: |-
      De betrokkene geeft de jeugdhulpverlener naar beste weten de inlichtingen en de medewerking die deze redelijkerwijs
      voor het verlenen van jeugdhulp behoeft.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.7
  - number: 7.3.8.1
    text: |-
      De jeugdhulpverlener richt een dossier in met betrekking tot de verlening van jeugdhulp. Hij houdt in het dossier
      aantekening van de gegevens omtrent de geconstateerde opgroei- en opvoedingsproblemen, psychische problemen en
      stoornissen en de te diens aanzien uitgevoerde verrichtingen en neemt andere gegevens daarin op, een en ander voor
      zover dit voor een goede hulpverlening aan de betrokkene noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.8
  - number: 7.3.8.2
    text: De jeugdhulpverlener voegt desgevraagd een door de betrokkene afgegeven verklaring aan het dossier toe.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.8
  - number: 7.3.8.3
    text: |-
      Onverminderd het bepaalde in [artikel 7.3.9][ref1] bewaart de jeugdhulpverlener het dossier gedurende twintig jaar,
      te rekenen vanaf het tijdstip waarop de laatste wijziging in het dossier heeft plaatsgevonden, of zoveel langer als
      redelijkerwijs uit de zorg van een goed jeugdhulpverlener voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.9.1
    text: De jeugdhulpverlener vernietigt de gegevens uit het dossier na een daartoe strekkend verzoek van de betrokkene.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.9
  - number: 7.3.9.2
    text: |-
      Het eerste lid geldt niet voor zover het verzoek gegevens betreft waarvan redelijkerwijs aannemelijk is dat de
      bewaring van aanmerkelijk belang is voor een ander dan de betrokkene, alsmede voor zover het bepaalde bij of
      krachtens de wet zich tegen vernietiging verzet.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.9
  - number: 7.3.10
    text: |-
      De jeugdhulpverlener verstrekt aan de betrokkene desgevraagd inzage in en afschrift van de gegevens uit het
      dossier. De verstrekking blijft achterwege voor zover dit noodzakelijk is in het belang van de bescherming van de
      persoonlijke levenssfeer van een ander.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.10
  - number: 7.3.11.1
    text: |-
      Onverminderd [artikel 7.3.2, vierde lid, tweede volzin][ref1], draagt de jeugdhulpverlener zorg, dat aan anderen
      dan de betrokkene geen inlichtingen over de betrokkene dan wel inzage in of afschrift van de gegevens uit het
      dossier worden verstrekt dan met toestemming van de betrokkene. Indien verstrekking plaatsvindt, geschiedt
      deze slechts voor zover daardoor de persoonlijke levenssfeer van een ander niet wordt geschaad. De verstrekking
      geschiedt zonder inachtneming van beperkingen, indien het bij of krachtens de wet bepaalde daartoe verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.11.2
    text: 'Onder anderen dan de betrokkene is niet begrepen:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.11
  - number: 7.3.11.2.a
    text: |-
      degene die rechtstreeks betrokken is bij de verlening van die jeugdhulp en degene die optreedt als vervanger
      van de jeugdhulpverlener, voor zover de verstrekking noodzakelijk is voor de door hen in dat kader te verrichten
      werkzaamheden, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.11
  - number: 7.3.11.2.b
    text: |-
      degene wiens toestemming ter zake van de verlening van jeugdhulp op grond van de [artikelen 7.3.4][ref1] en
      [7.3.15][ref2] is vereist, alsmede, indien de toestemming van de personen bedoeld in artikel 7.3.4 niet is vereist,
      de personen bedoeld in artikel 7.3.4, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.11
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.11.3
    text: |-
      Indien de jeugdhulpverlener door inlichtingen over de betrokkene dan wel inzage in of afschrift van de gegevens uit
      het dossier te verstrekken niet geacht kan worden de zorg van een goed jeugdhulpverlener in acht te nemen, laat hij
      zulks achterwege.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.11
  - number: 7.3.11.4
    text: |-
      Derden die beroepshalve beschikken over inlichtingen inzake feiten en omstandigheden die de persoon van een onder
      toezicht gestelde minderjarige, diens verzorging en opvoeding of de persoon van een ouder of voogd betreffen,
      welke inlichtingen noodzakelijk kunnen worden geacht voor de uitvoering van de ondertoezichtstelling, verstrekken
      de gecertificeerde instelling die de ondertoezichtstelling uitvoert, deze inlichtingen desgevraagd of kunnen
      deze inlichtingen uit eigen beweging aan de gecertificeerde instelling verstrekken, zonder toestemming van de
      betrokkenen en indien nodig met doorbreking van de plicht tot geheimhouding op grond van een wettelijk voorschrift
      of op grond van hun ambt of beroep.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.11
  - number: 7.3.11.5
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld omtrent de inhoud van het dossier, de wijze waarop
      de verwerking van gegevens door en de uitwisseling van gegevens tussen het college, de jeugdhulpaanbieders, de
      gecertificeerde instellingen en de raad voor de kinderbescherming plaatsvindt en de wijze waarop de verwerking en
      uitwisseling van gegevens als bedoeld in het vierde lid plaatsvinden. Daarbij kan worden bepaald welke maatregelen
      moeten worden getroffen om te waarborgen dat de uitwisseling van gegevens veilig en zorgvuldig plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.11
  - number: 7.3.12.1
    text: |-
      In afwijking van [artikel 7.3.11, eerste lid][ref1], kunnen zonder toestemming van de betrokkene ten behoeve van
      statistiek of wetenschappelijk onderzoek op het gebied van de volksgezondheid, opgroei- en opvoedingsproblemen,
      psychische problemen en stoornissen, kinderbescherming of jeugdreclassering aan een ander desgevraagd inlichtingen
      over de betrokkene of inzage in de gegevens uit het dossier worden verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.12.1.a
    text: |-
      het vragen van toestemming in redelijkheid niet mogelijk is en met betrekking tot de uitvoering van het onderzoek
      is voorzien in zodanige waarborgen, dat de persoonlijke levenssfeer van de betrokkene niet onevenredig wordt
      geschaad, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
  - number: 7.3.12.1.b
    text: |-
      het vragen van toestemming, gelet op de aard en het doel van het onderzoek, in redelijkheid niet kan worden
      verlangd en de gegevens in zodanige vorm worden verstrekt dat herleiding tot individuele natuurlijke personen
      redelijkerwijs wordt voorkomen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
  - number: 7.3.12.2
    text: 'Verstrekking overeenkomstig het eerste lid is slechts mogelijk indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
  - number: 7.3.12.2.a
    text: het onderzoek een algemeen belang dient,
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
  - number: 7.3.12.2.b
    text: het onderzoek niet zonder de desbetreffende gegevens kan worden uitgevoerd, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
  - number: 7.3.12.2.c
    text: voor zover de betrokkene tegen een verstrekking niet uitdrukkelijk bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
  - number: 7.3.12.3
    text: Bij een verstrekking overeenkomstig het eerste lid wordt daarvan aantekening gehouden in het dossier.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12
  - number: 7.3.12a.1
    text: |-
      In afwijking van het bepaalde in [artikel 7.3.11, eerste lid][ref1], verstrekt de jeugdhulpverlener desgevraagd
      inzage in of afschrift van gegevens uit het dossier van een overleden betrokkene aan:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.12a.1.a
    text: |-
      een persoon ten behoeve van wie de jeugdige bij leven toestemming heeft gegeven indien die toestemming schriftelijk
      of elektronisch is vastgelegd;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12a
  - number: 7.3.12a.1.b
    text: |-
      een ieder die een zwaarwegend belang heeft en aannemelijk maakt dat dit belang mogelijk wordt geschaad en dat
      inzage in of afschrift van gegevens uit het dossier noodzakelijk is voor de behartiging van dit belang.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12a
  - number: 7.3.12a.2
    text: |-
      In afwijking van het bepaalde in [artikel 7.3.11, eerste lid][ref1], verstrekt de jeugdhulpverlener aan degene of
      de instelling die het gezag uitoefende over de betrokkene die op het moment van overlijden de leeftijd van zestien
      jaar nog niet had bereikt, desgevraagd inzage in of afschrift van gegevens uit het dossier van deze betrokkene,
      tenzij dit in strijd is met de zorg van een goed jeugdhulpverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12a
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.12a.3
    text: |-
      Op grond van dit artikel worden uitsluitend gegevens verstrekt voor zover deze betrekking hebben op de grond
      waarvoor inzage wordt verleend.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12a
  - number: 7.3.12a.4
    text: |-
      Op grond van dit artikel worden geen gegevens verstrekt voor zover schriftelijk of elektronisch is vastgelegd
      dat de overleden betrokkene die de leeftijd van twaalf jaar had bereikt en tot een redelijke waardering van zijn
      belangen ter zake in staat was, deze inzage niet wenst, of daarbij de persoonlijke levenssfeer van een ander wordt
      geschaad.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12a
  - number: 7.3.12b.1
    text: |-
      Indien op grond van [artikel 7.3.12a, eerste lid, onderdeel b][ref1], om inzage in of afschrift van gegevens
      uit het dossier van een overleden betrokkene wordt gevraagd vanwege een vermoeden van een medische fout en de
      jeugdhulpverlener de gevraagde inzage of het gevraagde afschrift niet verstrekt, verstrekt de jeugdhulpverlener op
      verzoek van degene die om de inzage of het afschrift heeft gevraagd inzage in of afschrift van de gegevens aan een
      door de verzoeker aangewezen onafhankelijke arts.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12b
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.12b.2
    text: |-
      De arts, bedoeld in het eerste lid, beoordeelt of het niet verstrekken van de inzage of het afschrift
      gerechtvaardigd is. Indien de arts van oordeel is dat het niet verstrekken niet gerechtvaardigd is, verstrekt de
      jeugdhulpverlener alsnog inzage of afschrift aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.12b
  - number: 7.3.13.1
    text: |-
      De jeugdhulpverlener voert de verlening van jeugdhulp uit buiten de waarneming van anderen dan de betrokkene,
      tenzij de betrokkene ermee heeft ingestemd dat de verrichtingen kunnen worden waargenomen door anderen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.13
  - number: 7.3.13.2
    text: 'Onder anderen dan de betrokkene is niet begrepen:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.13
  - number: 7.3.13.2.a
    text: degene van wie beroepshalve de medewerking bij de verlening van die jeugdhulp noodzakelijk is, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.13
  - number: 7.3.13.2.b
    text: |-
      degene wiens toestemming terzake van de verlening van die jeugdhulp op grond van de [artikelen 7.3.4][ref1] en
      [7.3.15][ref2] is vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.13
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.13.3
    text: |-
      Indien de jeugdhulpverlener door verrichtingen te doen waarnemen niet geacht kan worden de zorg van een goed
      jeugdhulpverlener in acht te nemen, laat hij zulks niet toe.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.13
  - number: 7.3.14
    text: De jeugdhulpverlener kan wegens gewichtige redenen de verlening van jeugdhulp beëindigen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.14
  - number: 7.3.15.1
    text: |-
      De verplichtingen op grond van deze paragraaf voor de jeugdhulpverlener jegens de betrokkene, gelden, indien de
      betrokkene de leeftijd van twaalf jaar nog niet heeft bereikt, voor de jeugdhulpverlener jegens de ouders die het
      gezag over de betrokkene uitoefenen dan wel jegens zijn voogd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.15
  - number: 7.3.15.2
    text: |-
      Hetzelfde geldt indien de betrokkene de leeftijd van twaalf jaar heeft bereikt, maar niet in staat kan worden
      geacht tot een redelijke waardering van zijn belangen ter zake, tenzij zodanige betrokkene meerderjarig is en onder
      curatele staat of ten behoeve van hem het mentorschap is ingesteld, in welke gevallen de verplichtingen gelden
      jegens de curator of de mentor.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.15
  - number: 7.3.15.3
    text: |-
      Indien een meerderjarige betrokkene die niet in staat kan worden geacht tot een redelijke waardering van
      zijn belangen ter zake, niet onder curatele staat of ten behoeve van hem niet het mentorschap is ingesteld,
      gelden de verplichtingen die voor de jeugdhulpverlener uit deze afdeling jegens de betrokkene gelden, voor de
      jeugdhulpverlener jegens de persoon die daartoe door de betrokkene schriftelijk is gemachtigd in zijn plaats op te
      treden. Ontbreekt zodanige persoon, of treedt deze niet op, dan gelden de verplichtingen jegens de echtgenoot, de
      geregistreerde partner of andere levensgezel van de betrokkene, tenzij deze persoon dat niet wenst, dan wel, indien
      ook zodanige persoon ontbreekt, jegens een ouder, kind, broer, zus of grootouder van de betrokkene, tenzij deze
      persoon dat niet wenst.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.15
  - number: 7.3.15.4
    text: |-
      De verplichtingen voor de jeugdhulpverlener jegens de in het eerste en tweede lid bedoelde wettelijke
      vertegenwoordigers van de betrokkene of de in het derde lid bedoelde personen zijn niet van toepassing indien deze
      niet verenigbaar zijn met de zorg van een goed jeugdhulpverlener.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.15
  - number: 7.3.15.5
    text: |-
      De persoon jegens wie de verplichtingen op grond van deze paragraaf voor de jeugdhulpverlener gelden krachtens het
      tweede en derde lid, betracht de zorg van een goed vertegenwoordiger. Deze persoon is gehouden de betrokkene zoveel
      mogelijk bij de vervulling van zijn taak te betrekken.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.15
  - number: 7.3.15.6
    text: |-
      Verzet de betrokkene zich tegen een verrichting van ingrijpende aard waarvoor een persoon als bedoeld in het tweede
      of derde lid toestemming heeft gegeven, dan kan de verrichting slechts worden uitgevoerd indien zij kennelijk nodig
      is teneinde ernstig nadeel voor de betrokkene te voorkomen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.15
  - number: 7.3.16.1
    text: |-
      Indien op grond van [artikel 7.3.15][ref1] voor het uitvoeren van een verrichting uitsluitend de toestemming van
      een daar bedoelde persoon in plaats van die van de betrokkene vereist is, dan kan tot de verrichting zonder die
      toestemming worden overgegaan indien de tijd voor het vragen van die toestemming ontbreekt aangezien onverwijlde
      uitvoering van de verrichting kennelijk nodig is teneinde ernstig nadeel voor de betrokkene te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.16
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.16.2
    text: |-
      Een volgens de [artikelen 7.3.4][ref1] en [7.3.15][ref2] vereiste toestemming mag worden verondersteld te zijn
      gegeven, indien de desbetreffende verrichting niet van ingrijpende aard is.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.16
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 7.3.17
    text: |-
      Een beslissing van een jeugdhulpverlener genomen op grond van deze paragraaf, een beslissing op een verzoek als
      bedoeld in de artikelen 15,16, 17 of 19 van de Algemene verordening gegevensbescherming, alsmede een beslissing
      naar aanleiding van de aantekening van een bezwaar als bedoeld in artikel 21 van die verordening gelden, ook voor
      zover de jeugdhulpverlener, de beslissing heeft genomen als of namens een bestuursorgaan, voor de toepassing van
      [paragraaf 3.3 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref1], als een beslissing genomen
      door een ander dan een bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.3.17
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.3'
  - number: 7.4.0.1
    text: |-
      Het college of een door het college aangewezen persoon verwerkt persoonsgegevens van een jeugdige of zijn
      ouders, waaronder het burgerservicenummer van de jeugdige en bijzondere categorieën van persoonsgegevens en
      persoonsgegevens van strafrechtelijke aard, voor zover deze gegevens noodzakelijk zijn voor:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.1.a
    text: |-
      de toeleiding naar, advisering over, bepaling van of het inzetten van een voorziening op het gebied van de
      jeugdhulp;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.1.b
    text: |-
      het doen van een verzoek tot onderzoek bij de raad voor de kinderbescherming of de uitvoering van
      kinderbeschermingsmaatregelen of jeugdreclassering;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.1.c
    text: |-
      de bekostiging van preventie, jeugdhulp, kinderbeschermingsmaatregelen, jeugdreclassering of werkzaamheden als
      bedoeld in de [artikelen 6.1.2, vijfde lid][ref1], [6.1.3, derde lid][ref2], en [6.1.4, derde lid][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 7.4.0.1.d
    text: het verrichten van controle of fraude-onderzoek.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.2
    text: |-
      Jeugdhulpaanbieders, aanbieders van preventie, gecertificeerde instellingen, de raad voor de kinderbescherming
      en gekwalificeerde gedragswetenschappers als bedoeld in de [artikelen 6.1.2, vijfde lid][ref1],
      [6.1.3, derde lid][ref2], en [6.1.4, derde lid][ref3], verstrekken het college of een door het college aangewezen
      persoon kosteloos de persoonsgegevens van een jeugdige of zijn ouders, waaronder het burgerservicenummer van de
      jeugdige en bijzondere categorieën van persoonsgegevens en persoonsgegevens van strafrechtelijke aard, die voor het
      college of die personen noodzakelijk zijn voor de uitvoering van de werkzaamheden, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel6
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 7.4.0.3
    text: |-
      Personen werkzaam ten behoeve van een jeugdhulpaanbieder, een aanbieder van preventie, een gecertificeerde
      instelling of de raad voor de kinderbescherming verstrekken die aanbieders, die instellingen of die raad de
      persoonsgegevens die zij nodig hebben om te kunnen voldoen aan hun verplichting, bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.4
    text: 'Bij regeling van Onze Ministers wordt bepaald:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.4.a
    text: |-
      tot welke gegevens de verplichting, bedoeld in het tweede lid, zich ten hoogste uitstrekt indien de verstrekking
      geschiedt voor de uitvoering van de werkzaamheden, bedoeld in het eerste lid, onderdelen c of d;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.4.b
    text: op welke wijze de gegevens, bedoeld in het eerste of tweede lid, worden verwerkt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.5
    text: 'Bij regeling van Onze Ministers kan worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.5.a
    text: |-
      tot welke gegevens de verplichting, bedoeld in het tweede lid, zich ten hoogste uitstrekt indien de verstrekking
      geschiedt voor de uitvoering van de werkzaamheden, bedoeld in het eerste lid, onderdelen a of b;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.5.b
    text: volgens welke technische standaarden gegevensverwerking plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.5.c
    text: aan welke beveiligingseisen gegevensverwerking voldoet;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.0.5.d
    text: |-
      in welke gevallen en voor welke doelen gegevens als bedoeld in het eerste of tweede lid verder mogen worden
      verwerkt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.0
  - number: 7.4.1.1
    text: |-
      Onze Ministers verwerken gegevens die betrekking hebben op de toegang tot jeugdhulp, preventie, Veilig Thuis,
      de uitvoering van kinderbeschermingsmaatregelen en jeugdreclassering teneinde een zorgvuldig en samenhangend
      jeugdbeleid te kunnen voeren en hun stelselverantwoordelijkheid te kunnen waarborgen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.1
  - number: 7.4.1.2
    text: |-
      Het college verwerkt gegevens ten behoeve van een doelmatig, doeltreffend en samenhangend gemeentelijk beleid ten
      aanzien van preventie, de toegang tot en verlening van jeugdhulp, de uitvoering van kinderbeschermingsmaatregelen
      en jeugdreclassering en Veilig Thuis, alsmede ten behoeve van de verwerking, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.1
  - number: 7.4.2
    text: |-
      Het college verstrekt kosteloos gegevens aan Onze Ministers ten behoeve van de verwerking, bedoeld in
      [artikel 7.4.1, eerste lid][ref1]. Deze verstrekking kan zowel een structureel als incidenteel karakter hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.3
    text: |-
      Jeugdhulpaanbieders, aanbieders van preventie, gecertificeerde instellingen en de raad voor de kinderbescherming
      verstrekken kosteloos gegevens aan het college en Onze Ministers, ten behoeve van de verwerking, bedoeld in
      [artikel 7.4.1, eerste en tweede lid][ref1]. Deze verstrekking kan zowel een structureel als incidenteel karakter
      hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.4.1
    text: |-
      De gegevens, bedoeld in de [artikelen 7.4.1 tot en met 7.4.3][ref1] kunnen persoonsgegevens zijn, voor zover deze
      gegevens noodzakelijk zijn voor:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.4.1.a
    text: |-
      het doelmatig en doeltreffend functioneren van de toegang tot de jeugdhulp, de uitvoering van
      kinderbeschermingsmaatregelen en jeugdreclassering;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.4
  - number: 7.4.4.1.b
    text: |-
      het doelmatig en doeltreffend functioneren van de aanbieders van preventie, de jeugdhulpaanbieders, gecertificeerde
      instellingen en van de raad voor de kinderbescherming;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.4
  - number: 7.4.4.1.c
    text: de doelmatigheid en doeltreffendheid van het aanbod van preventie, jeugdhulp en gecertificeerde instellingen, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.4
  - number: 7.4.4.1.d
    text: het waarborgen van de stelselverantwoordelijkheid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.4
  - number: 7.4.4.2
    text: |-
      De gegevens, bedoeld in het eerste lid, kunnen het burgerservicenummer en bijzondere categorieën van
      persoonsgegevens en persoonsgegevens van strafrechtelijke aard zijn.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.4
  - number: 7.4.5.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de inhoud van de in de
      [artikelen 7.4.1 tot en met 7.4.3][ref1] bedoelde gegevens, de wijze waarop de verwerking en de verstrekking
      plaatsvindt, de tijdvakken waarop de gegevens die worden verwerkt betrekking hebben en de termijnen waarbinnen of
      de tijdstippen waarop de gegevens verstrekt dienen te worden en kunnen de categorieën van verstrekkers, bedoeld in
      [artikel 7.4.3][ref2], nader worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.5.2
    text: |-
      Bij of krachtens de in het eerste lid bedoelde maatregel kan worden bepaald dat de gegevens, bedoeld in
      de [artikelen 7.4.2][ref1] en [7.4.3][ref2], door de aanbieders van preventie, de jeugdhulpaanbieders, de
      gecertificeerde instellingen, de raad voor de kinderbescherming en het college, op een bij of krachtens die
      maatregel aangewezen wijze verstrekt worden aan en verwerkt worden door Onze Ministers of een door hen aan te
      wijzen instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.4'
  - number: 7.4.5.3
    text: |-
      De voordracht voor een krachtens het eerste of tweede lid vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Ministers
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel7.4.5
  - number: 8.1.1.1
    text: |-
      Indien de jeugdige of zijn ouders dit wensen, verstrekt het college hun een persoonsgebonden budget dat hen in
      staat stelt de jeugdhulp die tot de individuele voorziening behoort van derden te betrekken.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.2
    text: 'Een persoonsgebonden budget wordt verstrekt, indien:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.2.a
    text: |-
      de jeugdige of zijn ouders naar het oordeel van het college op eigen kracht voldoende in staat zijn tot een
      redelijke waardering van de belangen ter zake dan wel met hulp uit hun sociale netwerk dan wel van een curator,
      bewindvoerder, mentor, gemachtigde, gecertificeerde instelling of aanbieder van gesloten jeugdhulp, in staat zijn
      de aan een persoonsgebonden budget verbonden taken op verantwoorde wijze uit te voeren;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.2.b
    text: |-
      de jeugdige of zijn ouders zich gemotiveerd op het standpunt stellen dat zij de individuele voorziening die wordt
      geleverd door een aanbieder, niet passend achten; en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.2.c
    text: |-
      naar het oordeel van het college is gewaarborgd dat de jeugdhulp die tot de individuele voorziening behoort en die
      de jeugdige of zijn ouders van het budget willen betrekken, van goede kwaliteit is.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.3
    text: |-
      Bij verordening kan worden bepaald onder welke voorwaarden de persoon aan wie een persoonsgebonden budget wordt
      verstrekt, de jeugdhulp kan betrekken van een persoon die behoort tot het sociale netwerk.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.4
    text: 'Het college kan een persoonsgebonden budget weigeren:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.4.a
    text: |-
      voor zover de kosten van het betrekken van de jeugdhulp van derden hoger zijn dan de kosten van de individuele
      voorziening, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
  - number: 8.1.1.4.b
    text: |-
      indien het college eerder toepassing heeft gegeven aan [artikel 8.1.4, eerste lid, onderdeel a, d of e][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.1.2.1
    text: |-
      De jeugdige en zijn ouders doen aan het college op verzoek of onverwijld uit eigen beweging mededeling van alle
      feiten en omstandigheden waarvan hun redelijkerwijs duidelijk moet zijn dat deze aanleiding kunnen zijn tot
      heroverweging van een beslissing aangaande een persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.2
  - number: 8.1.2.2
    text: |-
      De verplichting, bedoeld in het eerste lid, geldt niet, indien het college die feiten en omstandigheden kan
      vaststellen op grond van bij wettelijk voorschrift als authentiek aangemerkte gegevens die feiten en omstandigheden
      kan verkrijgen uit bij regeling van Onze Ministers aan te wijzen administraties.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.2
  - number: 8.1.2.3
    text: |-
      De jeugdige en zijn ouders zijn verplicht aan het college desgevraagd de medewerking te verlenen die redelijkerwijs
      nodig is voor de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.2
  - number: 8.1.3
    text: |-
      Het college onderzoekt periodiek of er aanleiding is een beslissing aangaande een persoonsgebonden budget te
      heroverwegen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.3
  - number: 8.1.4.1
    text: |-
      Het college kan een beslissing aangaande een persoonsgebonden budget herzien dan wel intrekken, indien het college
      vaststelt dat:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.4.1.a
    text: |-
      de jeugdige of zijn ouders onjuiste of onvolledige gegevens hebben verstrekt en de verstrekking van juiste of
      volledige gegevens tot een andere beslissing zou hebben geleid,
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.4.1.b
    text: |-
      de jeugdige of zijn ouders niet langer op de individuele voorziening of het daarmee samenhangende persoonsgebonden
      budget zijn aangewezen,
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.4.1.c
    text: de individuele voorziening of het daarmee samenhangende persoonsgebonden budget niet meer toereikend is te achten,
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.4.1.d
    text: de jeugdige of zijn ouders niet voldoen aan de voorwaarden van het persoonsgebonden budget, of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.4.1.e
    text: |-
      de jeugdige of zijn ouders het persoonsgebonden budget niet of voor een ander doel gebruiken dan waarvoor het
      bestemd is.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.4.2
    text: |-
      Het college bepaalt in de beslissing als bedoeld in het eerste lid het tijdstip waarop de beslissing in werking
      treedt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.4.3
    text: |-
      Indien het college een beslissing aangaande een persoonsgebonden budget met toepassing van het eerste lid,
      onderdeel a, heeft herzien dan wel ingetrokken, kan het college bij dwangbevel geheel of gedeeltelijk het ten
      onrechte genoten persoonsgebonden budget invorderen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.4
  - number: 8.1.5.1
    text: |-
      Een individuele voorziening in natura wordt aan een jeugdige of een ouder door of namens het college verstrekt.
      Indien een derde de voorziening in natura levert, komen op de persoon die deze voorziening ontvangt, geen
      werkgevers- of opdrachtgeversverplichtingen te rusten.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.5
  - number: 8.1.5.2
    text: |-
      Indien een jeugdige of een ouder een budget ontvangt, worden de betalingen voor de jeugdhulp die de jeugdige of de
      ouder ontvangen door of namens het college verstrekt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.5
  - number: 8.1.6
    text: |-
      Het college licht de jeugdige en zijn ouder vooraf volledig, objectief en in voor hem begrijpelijke bewoordingen in
      over de gevolgen van de keuze voor een budget in plaats van een individuele voorziening in natura.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.6
  - number: 8.1.7
    text: |-
      Op het budget is [titel 4.2 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 8.1.8.1
    text: |-
      De Sociale verzekeringsbank, genoemd in
      [artikel 3 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], voert namens de colleges de
      betalingen ten laste van verstrekte budgetten, alsmede het hiermee verbonden budgetbeheer, uit.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '3'
  - number: 8.1.8.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de wijze waarop de Sociale
      verzekeringsbank de taak, bedoeld in het eerste lid, uitvoert.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.8
  - number: 8.1.8.3
    text: |-
      Bij regeling van Onze Ministers kunnen regels worden gesteld over de overeenkomst die de persoon aan wie een
      persoonsgebonden budget wordt verstrekt sluit met de derde van wie hij jeugdhulp die tot de individuele voorziening
      behoort, ontvangt en die daarvoor betaling ontvangt uit het persoonsgebonden budget.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.1.8
  - number: 8.2.1.1
    text: |-
      Binnen een redelijke termijn informeert een college een jeugdhulpaanbieder of gecertificeerde instelling
      desgevraagd welk college financieel verantwoordelijk is voor de aan een jeugdige te leveren jeugdhulp of uit te
      voeren kinderbeschermingsmaatregel of jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.2.1
  - number: 8.2.1.2
    text: |-
      Een jeugdhulpaanbieder of gecertificeerde instelling kan de geleverde jeugdhulp of uitgevoerde
      kinderbeschermingsmaatregel of jeugdreclassering in rekening brengen bij het bij hem of haar op grond van een
      toekenning of instemming dan wel de verkregen informatie, bedoeld in het eerste lid, bekende college. Dit college
      betaalt die geleverde jeugdhulp of uitgevoerde kinderbeschermingsmaatregel of jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.2.1
  - number: 8.2.1.3
    text: |-
      Indien het college, bedoeld in het tweede lid, van mening is niet financieel verantwoordelijk te zijn voor
      de geleverde jeugdhulp of uitgevoerde kinderbeschermingsmaatregel of jeugdreclassering, overlegt het met het
      volgens het college wel verantwoordelijke college. Indien de uitkomst van dit overleg is dat laatstgenoemd
      college financieel verantwoordelijk is, vindt tussen de colleges verrekening plaats van de betaalde jeugdhulp,
      kinderbeschermingsmaatregel of jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.2.1
  - number: 8.2.1.4
    text: |-
      Het college, bedoeld in het tweede lid, informeert de jeugdhulpaanbieder of gecertificeerde instelling indien
      een ander college financieel verantwoordelijk is voor de desbetreffende jeugdhulp, kinderbeschermingsmaatregel
      of jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.2.1
  - number: 8.2.1.5
    text: |-
      Bij regeling van Onze Ministers worden nadere regels gesteld over de betaal-, onderzoeks- en informatieplicht,
      bedoeld in het eerste tot en met vierde lid, waaronder in ieder geval regels over de door colleges uit te voeren
      controles voorafgaand aan de betaling van jeugdhulp, jeugdbeschermingsmaatregelen en jeugdreclassering.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.2.1
  - number: 8.3.1
    text: |-
      Jeugdhulpaanbieders als bedoeld in [artikel 1.1, onderdeel 1°][ref1], en gecertificeerde instellingen stellen
      overeenkomstig door Onze Ministers te stellen regelen de begroting, de balans en de resultatenrekening alsmede de
      daarbij behorende toelichting vast en maken deze op door Onze Ministers te bepalen wijze openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.3.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 8.3.2
    text: |-
      Jeugdhulpaanbieders als bedoeld in [artikel 1.1, onderdeel 1°][ref1], en gecertificeerde instellingen behorende
      tot een bij algemene maatregel van bestuur aangewezen categorie, verstrekken aan Onze Ministers of aan een bij of
      krachtens die maatregel aangewezen bestuursorgaan de bij of krachtens die maatregel omschreven gegevens betreffende
      de exploitatie.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.3.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 8.4.2.1
    text: |-
      De Sociale verzekeringsbank is bevoegd tot het verwerken van persoonsgegevens van de jeugdige en zijn ouders,
      waaronder gegevens over gezondheid die noodzakelijk zijn voor het verrichten van betalingen en het budgetbeheer,
      bedoeld in [artikel 8.1.8][ref1], voor zover deze op rechtmatige wijze zijn verkregen en noodzakelijk zijn voor de
      uitvoering van zijn taak ingevolge deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.4.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.1'
  - number: 8.4.2.2
    text: De Sociale verzekeringsbank is de verwerkingsverantwoordelijke, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.4.2
  - number: 8.4.3.1
    text: |-
      Op de Sociale verzekeringsbank zijn de [artikelen 7.2.1 tot en met 7.2.5][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 8.4.3.2
    text: |-
      De Sociale verzekeringsbank kan van de [artikelen 7.2.2 tot en met 7.2.4][ref1] afwijken voor zolang dit
      noodzakelijk is met betrekking tot spoedeisende gevallen. In zodanig geval is [artikel 7.2.5][ref2] niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.4.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.2'
  - number: 8.4.4
    text: 'Op de Sociale verzekeringsbank:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.4.4
  - number: 8.4.4.a
    text: |-
      zijn de [artikelen 5.3.2 tot en met 5.3.5 van de Wet maatschappelijke ondersteuning 2015][ref1] van overeenkomstige
      toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.4.4
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '5'
  - number: 8.4.4.b
    text: |-
      is [artikel 7.3.12][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel7
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel8.4.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '7'
        hoofdstuk: '7'
        paragraaf: '7.3'
  - number: 9.1.1
    text: |-
      Onverminderd [artikel 36 van de Gezondheidswet][ref1] heeft de Inspectie gezondheidszorg en jeugd tot taak het
      onderzoeken van de kwaliteit in algemene zin van:


      [ref1]: https://wetten.overheid.nl/BWBR0002202#Artikel36
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0002202
        artikel: '36'
  - number: 9.1.1.a
    text: de jeugdhulpaanbieders;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.1.1.b
    text: |-
      de certificerende instelling, bedoeld in [artikel 3.4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3'
        hoofdstuk: '3'
  - number: 9.1.1.c
    text: de gecertificeerde instellingen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.1.1.d
    text: Veilig Thuis;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.1.1.e
    text: de raad voor de kinderbescherming, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.1.1.f
    text: |-
      de inrichtingen, bedoeld in [artikel 1, onderdeel b, van de Beginselenwet justitiële jeugdinrichtingen][ref1],
      alsmede waar nodig, het aangeven en bevorderen van middelen tot verbetering daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
  - number: 9.1.2
    text: |-
      In afwijking van het eerste lid, wordt het onderzoek, voor zover het de tenuitvoerlegging van strafrechtelijke
      beslissingen betreft, uitgevoerd door de inspectie bedoeld in [artikel 57 van de Wet veiligheidsregio’s][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '57'
  - number: 9.1.3
    text: |-
      De [artikelen 5:12][ref1], [5:13][ref2], [5:15][ref3], [5:16][ref4], [5:17][ref5] en
      [5:20, eerste en tweede lid, van de Algemene wet bestuursrecht][ref6] zijn van overeenkomstige toepassing ten
      aanzien van de ambtenaren van de inspecties, bij de uitvoering van de taak, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref5
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref6
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.1.4
    text: |-
      De inspecties nemen bij de vervulling van hun taken, bedoeld in het eerste en tweede lid, de instructies van Onze
      Ministers in acht.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.1.5
    text: |-
      De Inspectie gezondheidszorg en jeugd houdt bij de vervulling van haar taak rekening met de behoeften van
      gemeenten.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.1.6
    text: |-
      De inspecties brengen van hun bevindingen verslag uit aan degene bij wie het onderzoek is uitgevoerd en kunnen
      daarbij voorstellen doen tot verbetering van de kwaliteit. Onze Ministers worden schriftelijk op de hoogte gebracht
      van de bevindingen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.1.7
    text: |-
      De Inspectie gezondheidszorg en jeugd publiceert jaarlijks een verslag van haar werkzaamheden. In het verslag doet
      zij de voorstellen die zij in het belang van de jeugdhulp nodig acht.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.1
  - number: 9.2.1
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de door Onze Ministers
      aangewezen ambtenaren. In afwijking van de eerste zin houden de daar bedoelde ambtenaren geen toezicht op de
      naleving van [artikel 1a.1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1a
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: 1a
        hoofdstuk: 1a
  - number: 9.2.2
    text: |-
      De met het toezicht belaste ambtenaren zijn voor zover dat voor de vervulling van hun taak noodzakelijk is en
      in afwijking van [artikel 5:15, eerste lid, van de Algemene wet bestuursrecht][ref1], bevoegd, met medeneming
      van de benodigde apparatuur, een woning van een jeugdhulpaanbieder binnen te treden zonder toestemming van de
      bewoner, voor zover die woning wordt gebruikt ten behoeve van de verlening van jeugdhulp of de uitvoering van een
      kinderbeschermingsmaatregel of jeugdreclassering.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.2.3
    text: |-
      De met het toezicht belaste ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is en
      in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot inzage van de
      dossiers. Voor zover de betrokken beroepsbeoefenaar uit hoofde van zijn beroep tot geheimhouding van het dossier
      verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.2.4
    text: |-
      De met het toezicht belaste ambtenaren zijn bevoegd het niet naleven door een jeugdhulpaanbieder of een
      gecertificeerde instelling van een verplichting die voor hem uit het bepaalde bij of krachtens deze wet
      voortvloeit, buiten behandeling te laten, tenzij sprake is van een situatie die een ernstige bedreiging kan
      betekenen die voor de veiligheid van jeugdigen of ouders, de verlening van jeugdhulp of de uitvoering van een
      kinderbeschermingsmaatregel of van jeugdreclassering, of het belang van verantwoorde hulp anderszins daaraan
      redelijkerwijs in de weg staat.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
  - number: 9.2.5
    text: |-
      Bij ministeriële regeling kunnen Onze Ministers regels stellen met betrekking tot de taakverdeling tussen de
      inspecties en de onderlinge samenwerking van de inspecties.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
  - number: 9.2.6
    text: |-
      Indien een organisatie van beoefenaren van een beroep op het terrein van de jeugdhulp, van de uitvoering van
      kinderbeschermingsmaatregelen of jeugdreclassering, Veilig Thuis, de raad voor de kinderbescherming, inrichtingen
      als bedoeld in [artikel 1 van de Beginselenwet justitiële jeugdinrichtingen][ref1] of Halt-bureaus als bedoeld
      in [artikel 48f van de Wet Justitie-subsidies][ref2] een systeem van tuchtrecht heeft georganiseerd, kunnen Onze
      Ministers de ingevolge [artikel 9.2][ref3] met het toezicht belaste ambtenaren bevoegd verklaren in het kader van
      dat systeem een tuchtklacht in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0011756#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel48f
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0011756
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0008121
        artikel: 48f
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.7
    text: |-
      [Artikel 9.1, vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.2.8
    text: |-
      Aan leden van het Subcomité ter Preventie als bedoeld in het op 18 december 2002 te New York tot stand gekomen
      Facultatief Protocol bij het Verdrag tegen foltering en andere wrede, onmenselijke of onterende behandeling
      of bestraffing (Trb. 2005, 243) en het Comité als bedoeld in het op 26 november 1987 te Straatsburg tot stand
      gekomen Europees Verdrag ter voorkoming van folteringen en onmenselijke of vernederende behandelingen of
      bestraffingen (Trb. 1988, 19) zoals gewijzigd door Protocol 1 en Protocol 2 (Trb. 1994, 106 en 107), komen
      dezelfde bevoegdheden toe als waarover de met het toezicht belaste ambtenaren bedoeld in het eerste lid beschikken.
      [Artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.3.1
    text: |-
      Indien een van Onze Ministers van oordeel is dat een jeugdhulpaanbieder of een gecertificeerde instelling deze wet
      of de daarop berustende bepalingen niet of onvoldoende naleeft, kan hij de jeugdhulpaanbieder of de gecertificeerde
      instelling die het betreft een schriftelijke aanwijzing geven.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.3
  - number: 9.3.2
    text: |-
      In de aanwijzing geeft Onze Minister die het aangaat met redenen omkleed aan welke maatregelen de
      jeugdhulpaanbieder of de gecertificeerde instelling moet nemen met het oog op de naleving van het bepaalde bij of
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.3
  - number: 9.3.3
    text: |-
      De aanwijzing bevat de termijn waarbinnen de jeugdhulpaanbieder of de gecertificeerde instelling daaraan moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.3
  - number: 9.3.4
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor de veiligheid of de gezondheid redelijkerwijs geen
      uitstel kan lijden, kan de ingevolge [artikel 9.2, eerste lid][ref1], met het toezicht belaste ambtenaar een
      schriftelijk bevel geven. Het bevel heeft een geldigheidsduur van zeven dagen, welke door een van Onze Ministers
      kan worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.3
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.3.5
    text: |-
      De jeugdhulpaanbieder of de gecertificeerde instelling is verplicht binnen de daarbij gestelde termijn aan de
      aanwijzing onderscheidenlijk onmiddellijk aan het bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.3
  - number: 9.3.6
    text: |-
      Mandaat tot het verlengen van de geldigheidsduur van een bevel wordt niet verleend aan een met het toezicht belaste
      ambtenaar.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.3
  - number: 9.4.1
    text: |-
      Met het toezicht op de naleving van [artikel 9 van de Wet Centraal Orgaan opvang asielzoekers][ref1], voor zover
      het betreft minderjarigen die onder toezicht of voogdij staan van een gecertificeerde instelling als bedoeld in
      [artikel 1.1][ref2], zijn belast de door Onze Ministers aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0006685#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0006685
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
  - number: 9.4.2
    text: |-
      [Artikel 9.1, vijfde tot en met zevende lid][ref1], is van overeenkomstige toepassing. De [artikelen 9.3][ref2],
      [9.5][ref3] en [9.6][ref4] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.4
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.5.1
    text: |-
      Onze Ministers zijn beiden bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de
      [artikelen 8.3.1][ref1] en [8.3.2][ref2] en van een krachtens [artikel 9.3][ref3] gegeven aanwijzing of bevel en
      tot overeenkomstige toepassing van [artikel 5:20, derde lid, van de Algemene wet bestuursrecht][ref4] ten aanzien
      van de in [artikel 9.1, eerste lid][ref5], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '8'
        hoofdstuk: '8'
        paragraaf: '8.3'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '9'
