  - number: 9.5.2
    text: |-
      Onze Ministers zijn beiden bevoegd tot oplegging van een last onder dwangsom ter handhaving van het bepaalde bij of
      krachtens [artikel 4.2.1, eerste, tweede, derde en vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.2'
  - number: 9.5.3
    text: |-
      Onze Ministers zijn beiden bevoegd een last onder dwangsom op te leggen aan de betrokken beroepsbeoefenaar die geen
      medewerking verleent aan de inzage van dossiers, bedoeld in [artikel 9.2, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.5
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.6.1
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport kan een bestuurlijke boete opleggen
      van ten hoogste het bedrag dat is vastgesteld voor de vierde categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref1] voor overtreding van
      [artikel 4.0.1, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.0'
  - number: 9.6.2
    text: |-
      Onze Ministers zijn beiden bevoegd een bestuurlijke boete van ten hoogste € 6.700,– op te leggen ter zake van een
      gedraging die in strijd is met een krachtens [artikel 9.3][ref1] gegeven aanwijzing, voor zover deze betreft het
      niet of onvoldoende naleven van [artikel 4.3.1, tweede lid, onderdelen d tot en met j][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 9.6.3
    text: |-
      Onze Ministers zijn beiden bevoegd een bestuurlijke boete van ten hoogste € 33.500,– op te leggen ter zake van een
      gedraging van een jeugdhulpaanbieder of een gecertificeerde instelling die in strijd is met het bepaalde bij of
      krachtens de [artikelen 4.1.6][ref1], [4.1.8][ref2], of [4.3.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
      - id: ref3
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.3'
  - number: 9.6.4
    text: |-
      Een gedraging in strijd met [artikel 4.1.8][ref1] is een strafbaar feit.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.6
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.1'
  - number: 9.6.5
    text: |-
      Met hechtenis van ten hoogste zes maanden of geldboete van de vierde categorie wordt gestraft degene die een
      strafbaar feit pleegt als bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.6
  - number: 9.6.6
    text: Een strafbaar feit als bedoeld in het vierde lid is een overtreding.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.6
  - number: 9.7.1
    text: |-
      De inspectie, bedoeld in [artikel 9.1, eerste lid][ref1], en de inspectie, bedoeld in artikel 9.1, tweede lid,
      maken, na een daartoe strekkend besluit van een bij algemene maatregel van bestuur aan te wijzen bestuursorgaan,
      de bij die maatregel aan te wijzen onder haar berustende informatie openbaar inzake het toezicht en de uitvoering
      van de bij of krachtens deze wet gestelde regels, teneinde de naleving daarvan te bevorderen, het publiek inzicht
      te geven in de wijze waarop dat toezicht en die uitvoering worden verricht en wat de resultaten daarvan zijn. Bij
      algemene maatregel van bestuur kunnen anderen, die met de uitvoering van de bij of krachtens deze wet gestelde
      regels zijn belast, dan wel de organisatie waarvoor zij werkzaam zijn, in plaats van die inspecties worden belast
      met openbaarmaking als bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.2
    text: |-
      Bij algemene maatregel van bestuur kunnen anderen dan de inspecties, bedoeld in
      [artikel 9.1, eerste en tweede lid][ref1], die belast zijn met de uitvoering van de bij of krachtens deze wet
      gestelde regels worden verplicht onder hen berustende informatie ter openbaarmaking te verstrekken aan degene
      die met de openbaarmaking daarvan is belast, bij welke verstrekking de informatie wordt ontdaan van de gegevens,
      bedoeld in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.3
    text: 'Op grond van het eerste lid kan voor openbaarmaking worden aangewezen, informatie betreffende:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.3.a
    text: uitkomsten van controle en onderzoek en de daaraan ten grondslag liggende gegevens;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.3.b
    text: |-
      kennisgevingen van de inspecties, bedoeld in [artikel 9.1, eerste en tweede lid][ref1], waarin de betrokkene
      wordt medegedeeld dat tot intensivering van het toezicht is overgegaan, dat die intensivering wordt beëindigd,
      dan wel dat de betrokkene met onmiddellijke ingang of op zeer korte termijn verbeteringen in zijn organisatie moet
      aanbrengen;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.3.c
    text: |-
      adviezen aan bestuursorganen over het toezicht op of de uitvoering van de bij of krachtens deze wet gestelde
      regels;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.3.d
    text: waarschuwingen;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.3.e
    text: |-
      besluiten, inhoudende een bevel of de verlenging van een bevel als bedoeld in [artikel 9.3, vierde lid][ref1], dan
      wel een aanwijzing als bedoeld in artikel 9.3, eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.3.f
    text: |-
      besluiten tot het opleggen van een bestuurlijke sanctie als bedoeld in
      [artikel 5:2 van de Algemene wet bestuursrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 9.7.3.g
    text: de uitvoering, wijziging, beëindiging, schorsing en intrekking van besluiten en maatregelen als bedoeld in dit lid.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.4
    text: |-
      Indien de informatie betrekking heeft op besluiten als bedoeld in het derde lid, onder e en f, wordt bij de
      openbaarmaking aangegeven of een rechtsmiddel tegen dat besluit is of kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.5
    text: |-
      De inspecties, bedoeld in [artikel 9.1, eerste en tweede lid][ref1], dan wel degene die op grond van het eerste
      lid, tweede volzin, is aangewezen, dragen er zorg voor dat de informatie die op grond van het eerste lid openbaar
      wordt gemaakt, bij de openbaarmaking is ontdaan van:


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.5.a
    text: persoonsgegevens, voor zover de openbaarmaking daarvan op grond van het zesde lid niet is toegestaan; en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.5.b
    text: |-
      informatie, waarvoor de verstrekker van die informatie uit hoofde van zijn beroep tot geheimhouding
      is verplicht, doch waarvan de met het toezicht belaste ambtenaren van de inspecties, bedoeld in
      [artikel 9.1, eerste, dan wel tweede lid][ref1], voor de vervulling van hun taak kennis hebben genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.7.6
    text: 'De openbaar te maken informatie mag slechts persoonsgegevens bevatten, voor zover die persoonsgegevens:'
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.6.a
    text: |-
      gerelateerd zijn aan het beroeps- of bedrijfsmatig functioneren of handelen van de personen die onderwerp zijn van
      het toezicht of op wie de uitvoering betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.6.b
    text: |-
      gerelateerd zijn aan de taakvervulling van de personen die met het toezicht op de naleving of met de uitvoering van
      de aangewezen regelgeving zijn belast; of
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.7.6.c
    text: door de persoon ten aanzien van wie de openbaarmaking plaatsvindt, duidelijk openbaar zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.7
  - number: 9.8.1
    text: |-
      De openbaarmaking, bedoeld in [artikel 9.7][ref1], vindt niet plaats binnen twee weken na het tijdstip waarop het
      in artikel 9.7, eerste lid, bedoelde besluit bekend is gemaakt. Bij dat besluit wordt de betrokkene van de openbaar
      te maken informatie op de hoogte gesteld, voor zover hij van die informatie nog geen kennis heeft kunnen nemen en
      wordt de betrokkene in de gelegenheid gesteld zijn reactie op het besluit kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.8.2
    text: |-
      Indien de betrokkene een reactie kenbaar heeft gemaakt, wordt deze door het met openbaarmaking belaste
      bestuursorgaan eveneens openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
  - number: 9.8.3
    text: |-
      Op de besluiten tot openbaarmaking, bedoeld in het eerste lid, is
      [artikel 4:8 van de Algemene wet bestuursrecht][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 9.8.4
    text: |-
      Het derde lid blijft buiten toepassing indien het besluit tot openbaarmaking is gericht op de openbaarmaking van
      informatie over een besluit waarbij een belanghebbende op grond van [artikel 4:8 Algemene wet bestuursrecht][ref1]
      tot het naar voren brengen van een zienswijze in de gelegenheid dient te worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 9.8.5
    text: |-
      Indien een verzoek om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] wordt gedaan tegen een besluit als bedoeld in het eerste
      lid, wordt de werking van het besluit opgeschort totdat de voorzieningenrechter op dat verzoek uitspraak heeft
      gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 9.8.6
    text: |-
      De termijn van twee weken, bedoeld in het eerste lid, is niet van toepassing bij de openbaarmaking van informatie
      over:
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
  - number: 9.8.6.a
    text: |-
      bevelen als bedoeld in [artikel 9.3, vierde lid][ref1], alsmede over verlengingen daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.8.6.b
    text: |-
      aanwijzingen als bedoeld in [artikel 9.3, eerste lid][ref1], indien die aanwijzing inhoudt dat aan de betrokkene
      een beperkende maatregel is opgelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.8.6.c
    text: |-
      lasten als bedoeld in [artikel 9.5, eerste lid][ref1], tot handhaving van een bevel als bedoeld onder a of een
      aanwijzing als bedoeld onder b;


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.8.6.d
    text: |-
      kennisgevingen van de inspecties waarin de betrokkene wordt medegedeeld dat tot intensivering van het toezicht
      is overgegaan, dan wel dat de betrokkene met onmiddellijke ingang of op zeer korte termijn verbeteringen in zijn
      organisatie moet aanbrengen.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
  - number: 9.8.7
    text: |-
      Indien openbaarmaking plaatsvindt via het internet worden bij algemene maatregel van bestuur regels gesteld over de
      periode gedurende welke de inspecties, bedoeld in [artikel 9.1, eerste en tweede lid][ref1], dan wel degene die op
      grond van [artikel 9.7, eerste lid, tweede volzin][ref2], is aangewezen, de informatie beschikbaar stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.8.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld voor een goede uitvoering van het
      eerste en tweede lid en [artikel 9.7, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 9.8.9
    text: |-
      Indien de openbaarmaking, bedoeld in het eerste lid, in strijd is of zou kunnen komen met het doel van deze wet,
      blijft openbaarmaking achterwege.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.8
  - number: '9.9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald dat de inspectie, bedoeld in
      [artikel 9.1, eerste lid][ref1], en de inspectie, bedoeld in artikel 9.1, tweede lid, beleidsregels vaststellen
      over herinspecties na een negatieve uitkomst van controle en onderzoek bij een betrokkene. Bij of krachtens
      algemene maatregel van bestuur kan worden bepaald wat wordt verstaan onder een negatieve uitkomst. Bij of krachtens
      algemene maatregel van bestuur kan worden bepaald dat de beleidsregels aan bij of krachtens de algemene maatregel
      van bestuur te bepalen voorwaarden moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.9
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: '9.10'
    text: |-
      De voordracht voor een algemene maatregel van bestuur waarbij voor de eerste maal toepassing wordt gegeven aan
      [artikel 9.7][ref1] of [9.8][ref2], wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der
      Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel9
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel9.10
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '9'
        hoofdstuk: '9'
  - number: 10.0.1
    text: |-
      Een jeugdhulpaanbieder die op het tijdstip van inwerkingtreding van [artikel 4.0.1][ref1] van deze wet jeugdhulp
      verleent of laat verlenen, voldoet binnen 6 maanden na dat tijdstip aan de in artikel 4.0.1 bedoelde meldplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel10.0
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
        hoofdstuk: '4'
        paragraaf: '4.0'
  - number: 10.0.2
    text: |-
      Bij algemene maatregel van bestuur kunnen categorieën van jeugdhulpaanbieders worden aangewezen waarop het eerste
      lid niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel10.0
  - number: 10.1.1
    text: |-
      Indien de woonplaats van een jeugdige is bepaald met toepassing van [artikel 1.1][ref1], onder «woonplaats», zoals
      dat luidde voor de inwerkingtreding van de [Wet wijziging woonplaatsbeginsel][ref2], en deze ten gevolge van de
      inwerkingtreding van deze wet wijzigt, heeft die jeugdige recht op voortzetting van de voor de inwerkingtreding van
      deze wet aangevangen jeugdhulp met dezelfde voorwaarden en tarieven bij dezelfde jeugdhulpaanbieder tot ten hoogste
      een jaar na de inwerkingtreding van deze wet, met dien verstande dat het college van de gemeente waar de jeugdige
      zijn woonplaats, bedoeld in artikel 1.1, heeft verantwoordelijk wordt voor die jeugdhulp.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0043235
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0043235
  - number: 10.1.2
    text: |-
      De periode van een jaar, bedoeld in het eerste lid, is niet van toepassing op pleegzorg. Indien de jeugdhulp
      pleegzorg betreft, draagt het college dat ingevolge het eerste lid voor de pleegzorg verantwoordelijk wordt ervoor
      zorg dat de pleegzorg wordt voortgezet bij dezelfde pleegouders, tenzij dat niet tot verantwoorde hulp zou leiden.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel10.1
  - number: 10.1.3
    text: |-
      Het tweede lid is van overeenkomstige toepassing indien het in het eerste lid eerstgenoemde college had ingestemd
      met het verlenen van pleegzorg die nog niet was aangevangen voor of op de datum van inwerkingtreding van de
      [Wet wijziging woonplaatsbeginsel][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0043235
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel10.1
    references:
      - id: ref1
        bwb_id: BWBR0043235
  - number: 11.7.1
    text: |-
      De [Wet op de jeugdzorg][ref1] wordt ingetrokken, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0016637
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0016637
  - number: 11.7.1.a
    text: |-
      zij van toepassing blijft op de financiële verantwoording, vaststelling, uitbetaling van op grond van die wet
      verleende subsidies en uitkeringen en op de vaststelling en inning op grond van die wet van de ouderbijdragen, en
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel11.7
  - number: 11.7.1.b
    text: |-
      [hoofdstuk VII van de Wet op de jeugdzorg][ref1] van toepassing blijft op het verstrekken en verwerken van gegevens
      die betrekking hebben op het laatste kalenderjaar voor die intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#HoofdstukVII
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0016637
        hoofdstuk: VII
  - number: 11.7.2
    text: |-
      In wettelijke procedures en rechtsgedingen tegen besluiten die op grond van de [Wet op de jeugdzorg][ref1] zijn
      genomen, dan wel op tegen deze besluiten in te stellen of ingestelde beroepen, blijven, zowel in eerste aanleg als
      in verdere instantie, de regels van toepassing, die golden voor de intrekking van die wet. Indien het een besluit
      betreft dat is genomen door een stichting als bedoeld in [artikel 1 van de Wet op de jeugdzorg][ref2], treedt het
      college van de gemeente waar de jeugdige zijn woonplaats heeft in de plaats van die stichting.


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel11.7
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 12.1.1
    text: |-
      Bij algemene maatregel van bestuur kunnen met het oog op een doelmatigere en doeltreffendere uitvoering van deze
      wet, waarbij een optimale samenhangende uitvoering van het vrijwillige en het gedwongen kader voorop staat, regels
      worden gesteld voor een periode van ten hoogste drie jaar ten behoeve van experimenten, waarbij afgeweken kan
      worden van [artikel 3.2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel3
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '3'
        hoofdstuk: '3'
  - number: 12.1.2
    text: |-
      In een algemene maatregel van bestuur als bedoeld in het eerste lid worden in ieder geval de voorwaarden voor het
      experiment bepaald en tevens welk resultaat met het experiment wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.1
  - number: 12.1.3
    text: |-
      Onze Ministers zenden drie maanden voor het einde van de werkingsduur van een algemene maatregel van bestuur
      als bedoeld in het eerste lid aan de beide kamers der Staten-Generaal een verslag over de doelmatigheid en
      doeltreffendheid van het experiment, alsmede een standpunt inzake de voortzetting van die maatregel, anders dan
      als experiment.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.1
  - number: 12.1.4
    text: |-
      Bij algemene maatregel van bestuur kunnen experimenten als bedoeld in het eerste lid na afloop van de looptijd
      worden voortgezet tot een structurele voorziening is getroffen, doch niet langer dan met een tijdsduur van ten
      hoogste twee jaar.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.1
  - number: '12.2'
    text: |-
      Onze Ministers zenden binnen drie jaar na de inwerkingtreding van de wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.2
  - number: 12.3.1
    text: |-
      Indien een gecertificeerde instelling geheel of ten dele is gevormd uit een stichting als bedoeld in
      [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref1], gaan de verplichtingen die ingevolge de
      [Archiefwet 1995][ref2] en de [artikelen 55][ref3] en [56 van de Wet op de jeugdzorg][ref4] op die stichting rusten
      over op de gecertificeerde instelling, behoudens het bepaalde in het vijfde lid. Onder stichting wordt in dit
      artikel mede verstaan een gemandateerde instelling met een landelijk bereik.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007376
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel55
      [ref4]: https://wetten.overheid.nl/BWBR0016637#Artikel56
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007376
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '55'
      - id: ref4
        bwb_id: BWBR0016637
        artikel: '56'
  - number: 12.3.2
    text: |-
      Indien een of meer gecertificeerde instellingen zijn gevormd uit een of meer stichtingen als bedoeld
      in [artikel 1, eerste lid, van de Wet op de jeugdzorg][ref1], treffen zij gezamenlijk een regeling ten
      aanzien van de in het eerste lid bedoelde verplichtingen onderscheidenlijk een voorziening als bedoeld in
      [artikel 4, eerste lid, van de Archiefwet 1995][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007376#Artikel4
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007376
        artikel: '4'
  - number: 12.3.3
    text: |-
      Een regeling of voorziening als in het tweede lid bedoeld strekt ertoe dat alle verplichtingen, bedoeld in het
      eerste lid, worden belegd.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3
  - number: 12.3.4
    text: |-
      Indien uit een stichting geen gecertificeerde instelling wordt gevormd, treft de stichting een regeling
      onderscheidenlijk voorziening met een of meer gecertificeerde instellingen of gemeenten, behoudens het bepaalde in
      het vijfde lid. Het tweede en derde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3
  - number: 12.3.5
    text: |-
      Indien een taak of bevoegdheid als bedoeld in de [artikelen 5 tot en met 11 van de Wet op de jeugdzorg][ref1],
      die werd uitgevoerd door een stichting als bedoeld in [artikel 1, eerste lid, van die wet][ref2], krachtens deze
      wet bij het college berust, gaan de verplichtingen, bedoeld in het eerste lid, ten aanzien van een dossier over op
      dat college voor zover dat college dat dossier van de gecertificeerde instelling heeft ontvangen ten behoeve van
      de toeleiding naar, advisering over, bepaling van, het inzetten van of de bekostiging van een voorziening op het
      gebied van jeugdhulp.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel1
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '1'
  - number: 12.3.6
    text: |-
      In afwijking van het vijfde lid gaan dossiers gevormd bij de uitvoering van de taken, bedoeld in
      [artikel 11, eerste lid, van de Wet op de jeugdzorg][ref1], en de in het eerste lid bedoelde verplichtingen met
      betrekking tot die dossiers, over op Veilig Thuis.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '11'
  - number: 12.3.7
    text: |-
      Overdracht van bescheiden ingevolge dit artikel geschiedt in goede, geordende en toegankelijke staat. Hiervan maakt
      de overdragende partij een verklaring van vervreemding op.
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3
  - number: 12.3a.1
    text: |-
      Archiefbescheiden en de daarmee samenhangende verplichtingen, bedoeld in de [Archiefwet 1995][ref1], met
      betrekking tot zorg waarvoor een aanvraag als bedoeld in [artikel 10.4a, tweede lid][ref2], is ingediend bij een
      indicatieorgaan als bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref3] en waarover op de
      datum van inwerkingtreding van [artikel 11.7][ref4] nog geen besluit is genomen, worden door dat indicatieorgaan
      overgedragen aan het college van de gemeente waar de jeugdige zijn woonplaats heeft en dat gehouden is een
      voorziening op grond van deze wet te treffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref4]: https://wetten.overheid.nl/BWBR0034925#Artikel11
    url: https://wetten.overheid.nl/BWBR0034925/2023-07-01#Artikel12.3a
    references:
      - id: ref1
        bwb_id: BWBR0007376
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '10'
        hoofdstuk: '10'
      - id: ref3
        bwb_id: BWBR0002614
        artikel: 9a
      - id: ref4
        bwb_id: BWBR0034925
        artikel: '11'
        hoofdstuk: '11'
  - number: 12.3a.2
    text: |-
      Voor zover de archiefbescheiden, bedoeld in het eerste lid, zorg betreffen waarvoor op de datum van
      inwerkingtreding van [artikel 11.7][ref1] een indicatiebesluit is afgegeven, is het indicatieorgaan,
      bedoeld in [artikel 9a van de Algemene Wet Bijzondere Ziektekosten][ref2], zorgdrager als bedoeld
      in [artikel 1 van de Archiefwet 1995][ref3] voor zover de archiefbescheiden niet overeenkomstig de
      [Archiefwet 1995][ref4] zijn overgebracht naar een archiefbewaarplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel9a
      [ref3]: https://wetten.overheid.nl/BWBR0007376#Artikel1
