  - number: '8'
    text: |-
      1 Van de verplichtingen, bedoeld in de [artikelen 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref1], en
      [26, eerste lid, onderdelen d, f en g, van de WW][ref2], is vrijgesteld de werknemer:

      a. die 57,5 jaar of ouder is op 1 mei 1999 en wiens eerste werkloosheidsdag gelegen is voor 1 januari 2004;

      b. die 57,5 jaar of ouder is op 31 december 2003 en wiens eerste werkloosheidsdag gelegen is op of voor 1 januari
      2003;

      c. voor wie op of na 1 januari 2004 recht op werkloosheidsuitkering ontstaat en die op de datum van het ontstaan
      van dat recht op grond van onderdeel a of b vrijgesteld is van de verplichtingen, bedoeld in de aanhef;

      d. die 57,5 jaar of ouder is op 31 december 2003, wiens eerste werkloosheidsdag is gelegen voor 1 januari 2004 en:

      1°. die onmiddellijk voorafgaande aan de eerste werkloosheidsdag een recht op uitkering had op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref3], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref4],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref5] of de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref6] dan wel een uitkering had die naar aard en strekking
      daarmee overeenkomt; of

      2°. die onmiddellijk voorafgaande aan de eerste werkloosheidsdag een recht op ziekengeld had op grond van de
      [Ziektewet][ref7] dat is ontstaan op of voor 1 januari 2003;

      e. die 57,5 jaar of ouder is op 31 december 2003, wiens eerste werkloosheidsdag is gelegen op of na 1 januari
      2004 en die onmiddellijk voorafgaande aan de eerste werkloosheidsdag een recht op uitkering had op grond van de
      [Wet op de arbeidsongeschiktheidsverzekering][ref8], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref9],
      de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref10], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref11] dan wel een uitkering die naar aard en strekking daarmee
      overeenkomt, dat is ontstaan op of voor 1 januari 2003.


