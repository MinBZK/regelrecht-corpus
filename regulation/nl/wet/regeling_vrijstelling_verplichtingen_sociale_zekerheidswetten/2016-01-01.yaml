    text: |-
      Van de verplichtingen, bedoeld in de [artikelen 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref1]
      en [26, eerste lid, onderdelen d, f, en g, van de WW][ref2], [14, tweede lid, onderdeel b][ref3],
      en [15, onderdelen a tot en met e, van de IOW][ref4], [30, eerste lid, van de ZW][ref5] en
      [30, eerste lid, van de Wet WIA][ref6], is vrijgesteld de uitkeringsgerechtigde die op de eerste dag
      van werkloosheid of ziekte respectievelijk op de eerste dag dat hij recht heeft op een WGA-uitkering,
      de leeftijd heeft bereikt waarop hij binnen een jaar de pensioengerechtigde leeftijd bereikt, bedoeld in
      [artikel 7a van de Algemene Ouderdomswet][ref7].


