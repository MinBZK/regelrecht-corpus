    text: |-
      De [artikelen 2:31, eerste lid, tweede lid, onderdelen b en c, en derde lid][ref1], [2:32][ref2] en
      [2:39, tweede, derde en vierde lid, van de Wajong][ref3] zijn niet van toepassing op de jonggehandicapte, bedoeld
      in [artikel 2:43, eerste lid, van de Wajong][ref4], tot twee maanden voor het beëindigen van de studie of scholing
      in verband waarmee hij inkomensondersteuning als bedoeld in [artikel 2:37][ref5] ontvangt.


