  - number: '4'
    text: |-
      1 Van de verplichtingen, bedoeld in de [artikelen 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref1], en
      [26, eerste lid, onderdelen d, f en g, van de WW][ref2], of in de [artikelen 14, tweede lid, onderdeel b][ref3], en
      [15, onderdelen a tot en met e, van de IOW][ref4], is vrijgesteld de werknemer respectievelijk de IOW-gerechtigde
      die met behoud van zijn recht op uitkering op grond van de [WW][ref5] of [IOW][ref6] vakantie geniet als bedoeld in
      [artikel 1, eerste lid, van de Vakantieregeling WW en IOW][ref7].

      2 Van de verplichtingen, bedoeld in [artikel 30, eerste lid, van de Wet WIA][ref8], is vrijgesteld de verzekerde
      die zijn resterende verdiencapaciteit niet volledig benut en die vakantie geniet tot een maximum van 20 werkdagen
      per jaar waarbij onder werkdagen wordt verstaan de dagen maandag tot en met vrijdag.

      3 Van de verplichtingen, bedoeld in [artikel 30, eerste lid, van de ZW][ref9], is vrijgesteld de persoon die
      ziekengeld ontvangt op grond van de [ZW][ref10] en die vakantie geniet tot een maximum van 20 werkdagen per jaar
      waarbij onder werkdagen wordt verstaan de dagen maandag tot en met vrijdag.

      4 De verzekerde, bedoeld in het tweede lid, of de persoon, bedoeld in het derde lid, geniet vakantie indien:

      a. hij verklaard heeft vakantie te genieten; of

      b. niet verklaard heeft vakantie te genieten, maar daar, gelet op de feitelijke omstandigheden, kennelijk sprake
      van is.


