  - number: 2a
    text: |-
      1 Van de verplichtingen, bedoeld in [artikel 30, eerste lid, van de Wet WIA][ref1] is vrijgesteld de persoon die
      met verlof is dan wel die pensioen of prepensioen ontvangt.

      2 Van de verplichtingen bedoeld in de [artikelen 14, tweede lid, onderdeel b][ref2], en
      [15, onderdelen a tot en met e, van de IOW][ref3] is vrijgesteld de persoon die met verlof is.


