  - number: 6b
    text: |-
      1 Van de verplichtingen, bedoeld in [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°, van de WW][ref1],
      is de werknemer drie maanden vrijgesteld indien hij evenveel:

      a. arbeidsuren als bedoeld in [artikel 1a van de WW][ref2], per week heeft; of

      b. uren per week heeft waarover hij de hoedanigheid van werknemer verliest of heeft verloren als bedoeld in
      [artikel 1b, vijfde lid][ref3], of [artikel 8, vierde lid, van de WW][ref4], als het gemiddeld aantal arbeidsuren
      als bedoeld in [artikel 16, tweede lid van de WW][ref5] en verwacht wordt dat deze werkzaamheden gedurende ten
      minste drie maanden zullen plaatsvinden.

      2 De vrijstelling wordt slechts eenmaal verleend gedurende een WW-recht.


