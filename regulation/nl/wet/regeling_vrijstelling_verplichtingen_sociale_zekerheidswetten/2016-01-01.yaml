  - number: '6'
    text: |-
      1 Van de verplichtingen, bedoeld in de
      [artikelen 24, eerste lid, onderdeel b, onder 1°, 2° en 4°, van de WW][ref1],
      [15, onderdelen b tot en met e, van de IOW][ref2], [30, eerste lid, van de ZW][ref3] of
      [30, eerste lid, van de Wet WIA][ref4], is vrijgesteld, de uitkeringsgerechtigde die een naar het oordeel van het
      UWV noodzakelijke opleiding of scholing volgt.

      2 De in het eerste lid bedoelde vrijstelling eindigt twee maanden voor het tijdstip waarop de in het eerste lid
      bedoelde opleiding of scholing naar verwachting zal eindigen, tenzij de scholing, blijkens een intentieverklaring
      van de toekomstige werkgever, een reëel uitzicht geeft op een op de scholing aansluitende dienstbetrekking van
      dezelfde of grotere omvang dan de scholing en met een duur van ten minste zes maanden.

      3 De uitkeringsgerechtigde die werkzaamheden verricht op een proefplaats als bedoeld in
      [artikel 76a van de WW][ref5], [artikel 52e van de ZW][ref6] of [artikel 37 van de Wet WIA][ref7], is vrijgesteld
      van de verplichtingen, bedoeld in de [artikel 24, eerste lid, onderdeel b, onder 1°, 2° en 4°, van de WW][ref8],
      [30, eerste lid, van de ZW][ref9], of [30, eerste lid, van de Wet WIA][ref10], voorzover het andere werkzaamheden
      betreft dan die op de proefplaats.


