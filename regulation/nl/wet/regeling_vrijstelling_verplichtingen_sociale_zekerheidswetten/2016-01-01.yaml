    text: |-
      Van de verplichtingen, bedoeld in [artikel 30, eerste lid, van de Wet WIA][ref1] is vrijgesteld de verzekerde die
      zijn resterende verdiencapaciteit volledig benut.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel30
