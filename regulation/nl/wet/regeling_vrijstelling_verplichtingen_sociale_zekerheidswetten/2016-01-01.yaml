preamble:
  text: |-
    Gelet op de artikelen 30, eerste lid, juncto 32, tweede lid, en 37, zesde lid, van de Wet werk en inkomen naar
    arbeidsvermogen en de artikelen 19, vijfde lid, 21, vierde lid, 24, zevende lid, 26, derde lid, en 76a van de
    Werkloosheidswet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019305/2016-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *resterende verdiencapaciteit*: de resterende verdiencapaciteit, bedoeld in [paragraaf 7.2 van de Wet WIA][ref1];
        - *uitkeringsgerechtigde*: de verzekerde die zijn resterende verdiencapaciteit als bedoeld in
      [paragraaf 7.2 van de Wet WIA][ref2] niet volledig benut, de werknemer, de IOW-gerechtigde, of de persoon die
      ziekengeld ontvangt op grond van de ZW;
        - *verzekerde*: de verzekerde, bedoeld in de [Wet WIA][ref3], die recht heeft op een WGA-uitkering;
        - *werknemer*: de werknemer, bedoeld in [hoofdstuk 1, paragraaf 2, van de WW][ref4], die recht heeft op een WW-
      uitkering;
        - *Wet WIA*: [Wet werk en inkomen naar arbeidsvermogen][ref5];
        - *WGA-uitkering*: werkhervattingsuitkering gedeeltelijk arbeidsgeschikten als bedoeld in
      [hoofdstuk 7 van de Wet WIA][ref6];
        - *WW*: [Werkloosheidswet][ref7];
        - *Wajong:* de [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref8];
        - *IOW:* [Wet inkomensvoorziening oudere werklozen][ref9];
        - *IOW-gerechtigde:* de uitkeringsgerechtigde, bedoeld in [artikel 1 van de IOW][ref10];
        - *ZW:* [Ziektewet][ref11];
        - *Pensioen:* een uitkering op grond van een pensioenregeling als bedoeld in
      [artikel 18, eerste lid, onderdeel a, onder 1°, van de Wet op de loonbelasting 1964][ref12].
        - *Prepensioen:* een uitkering op grond van een regeling voor vervroegde uittreding als bedoeld in
      [artikel 32ba, van de Wet op de loonbelasting 1964][ref13] of op grond van een prepensioenregeling als bedoeld in
      [artikel 38a van de Wet op de loonbelasting 1964][ref14] zoals dat artikel luidde op 31 december 2004;
        - *Verlof:* een tussen de werkgever en de werknemer voor een gedeelte of het geheel van de arbeidstijd
      overeengekomen periode, waarin de werknemer geen arbeid jegens de werkgever verricht.


