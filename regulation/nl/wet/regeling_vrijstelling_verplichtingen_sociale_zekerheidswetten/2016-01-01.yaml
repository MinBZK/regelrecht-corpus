  - number: '3'
    text: |-
      1 Van de verplichtingen, bedoeld in de [artikelen 24, eerste lid, onderdeel b, onder 1°, 2° en 4°][ref1],
      [26, eerste lid, onderdelen d, f en g, van de WW][ref2] en [14, tweede lid, onderdeel b][ref3], en
      [15, onderdelen a tot en met e, van de IOW][ref4], is vrijgesteld de werknemer wiens werkloosheid uitsluitend een
      gevolg is van:

      a. vorst, sneeuwval, hoog water of daarmee gelijk te stellen buitengewone natuurlijke omstandigheden; of

      b. verkorting van de werktijd, waarvoor op grond van
      [artikel 8, derde lid, van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref5] ontheffing is verleend.

      2 De omschreven vrijstellingen gelden voor de werknemer, bedoeld in het eerste lid, onder b, wiens werktijd tot nul
      is verkort, voor de duur van de eerste afgegeven vergunning.


