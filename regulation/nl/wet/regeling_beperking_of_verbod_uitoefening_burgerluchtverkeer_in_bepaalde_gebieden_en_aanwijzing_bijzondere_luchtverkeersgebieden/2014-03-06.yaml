      3 Van het verbod, bedoeld in het eerste lid, kan ontheffing worden verleend door de in
      [artikel 5, eerste lid][ref1], genoemde autoriteiten. Aan de ontheffing kunnen voorschriften of beperkingen worden
      verbonden.

      4 In de gebieden, bedoeld in het eerste lid, is het militaire luchtverkeer, voor zoveel voor de
      militaire oefeningen noodzakelijk, vrijgesteld van het verbod betreffende laagvliegen, neergelegd in
      [artikel 45, eerste lid, onderdeel b, van het Luchtverkeersreglement][ref2].

      5 In dit artikel wordt verstaan onder het Airspace Use Plan: het bericht dat dagelijks door AOCS NM van het
      Ministerie van Defensie wordt uitgegeven en bekend gesteld aan verkeersleidingsposten en luchtvaartmaatschappijen
      en waarin is opgenomen welke tijden delen van het luchtruim zijn gereserveerd voor militaire oefeningen.


      [ref1]: https://wetten.overheid.nl/BWBR0008922#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005775#Artikel45
