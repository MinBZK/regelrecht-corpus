  - number: '2'
    text: |-
      Als bijzonder luchtverkeersgebied ter bescherming van vertrekkend, respectievelijk naderend luchtverkeer met
      militaire straalvliegtuigen van het luchtvaartterrein Soesterberg wordt aangewezen het gebied Climb Corridor
      Soesterberg (EHR 10), begrensd:

      a. horizontaal door lijnen die achtereenvolgens de volgende posities verbinden:

      52.08.38 N - 005.17.10 O;

      52.05.34 N - 005.32.41 O;

      52.02.59 N - 005.31.09 O;

      52.06.46 N - 005.16.04 O;

      52.08.38 N - 005.17.10 O;

      b. verticaal door een ondergrens van 2500 ft boven de grond of het water tot en met FL 100.
    url: https://wetten.overheid.nl/BWBR0008922/2014-03-06#Artikel2
  - number: '3'
    text: |-
      Als bijzonder luchtverkeersgebied ter bescherming van het luchtverkeer ten opzichte van het militaire
      valschermspringen van grote hoogte zonder grondzicht, wordt aangewezen het gebied ’Regte Heide’, begrensd:

      a. horizontaal door een cirkelboog met een straal van 2 zeemijlen rondom positie 51.30.45 N - 005.01.40 O;

      b. verticaal tot een hoogte van 18000 ft boven de grond.
    url: https://wetten.overheid.nl/BWBR0008922/2014-03-06#Artikel3
  - number: '4'
    text: |-
      1 De bijzondere luchtverkeersgebieden, genoemd in [artikel 2][ref1] en [artikel 3][ref2], worden per NOTAM
      geactiveerd.

      2 Indien de bijzondere luchtverkeersgebieden, genoemd in [artikel 2][ref3] en [artikel 3][ref4], actief zijn, is
      voor het uitvoeren van vluchten met luchtvaartuigen binnen deze bijzondere luchtverkeersgebieden, een klaring van
      de plaatselijke luchtverkeersleidingsdienst van het luchtvaartterrein Soesterberg respectievelijk Gilze Rijen,
      danwel van de naderingsluchtverkeersleidingsdienst van het luchtvaartterrein Soesterberg respectievelijk Gilze
      Rijen, danwel van het MilATCC Nieuw Milligen vereist.


