  - number: '5'
    text: |-
      1 De hierna genoemde autoriteiten zijn verantwoordelijk voor de coördinatie van de militaire oefeningen in de
      volgende gebieden:

      a. de Commandant Zeestrijdkrachten voor het gebied EHR 8;

      b. de Commandant Landstrijdkrachten, voor de gebieden EHR 2, EHR 3 en EHR 9;

      c. de Commandant Luchtstrijdkrachten voor de gebieden EHR 4A, EHR 4B, EHR 4C, EHR 4D, EHR 4E, EHR 4F, EHD 01, EHD
      01a, EHD 02, EHD 02a, EHD 03, EHD 03a, EHD 04, EHD 04a, EHD 05, EHD 05a, EHD 06, EHD 06a, EHD 07, EHD 07a, EHD 08,
      EHD 08a, EHD 09, EHD 09a, TRA 010, TRA 010a, TRA 012, TRA 012a, CBA SEA 1.

      2 Mede ten behoeve van de uitgifte van NOTAM’s worden door de in het eerste lid genoemde autoriteiten coördinatoren
      aangewezen.

      3 Naar de vorengenoemde gebieden kan worden verwezen met de lettercijfercombinatie die boven de beschrijving is
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008922/2014-03-06#Artikel5
  - number: '7'
    text: De regeling van 6 juli 1993, nr.CWW 85/013, 93011720 (Stcrt 1993, 131), wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008922/2014-03-06#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008922/2014-03-06#Artikel8
  - number: '9'
    text: |-
      Deze regeling wordt aangehaald als: Regeling beperking of verbod uitoefening burgerluchtverkeer in bepaalde
      gebieden en aanwijzing bijzondere luchtverkeersgebieden.
    url: https://wetten.overheid.nl/BWBR0008922/2014-03-06#Artikel9
