      - id: ref2
        bwb_id: BWBR0007333
  - number: '5'
    text: |-
      1 Met inachtneming van de [artikelen 2][ref1] en [3][ref2] bedraagt de subsidie per gerealiseerde nieuwe
      kinderopvangplaats op alle werk- of studiedagen van de week: f 19.050 voor het gehele kalenderjaar vermenigvuldigd
      met de in het tweede lid omschreven omrekenfactor.

      2 De omrekenfactor bedraagt bij:

      a. hele-dagopvang: 1;

      b. halve-dagopvang: 0,66;

      c. buitenschoolse opvang: 0,66;

      d. gastouderopvang: 0,4.

      3 De subsidie wordt naar evenredigheid verlaagd, indien:

      a. de kinderopvangplaats, bedoeld in het tweede lid, onderdeel a, b of c, niet op alle werk- of studiedagen van de
      week wordt gerealiseerd of slechts gedurende een gedeelte van het kalenderjaar, of

      b. de kinderopvangplaats, bedoeld in het tweede lid, onderdeel d, slechts gedurende een gedeelte van het
      kalenderjaar wordt gerealiseerd.

      4 De na toepassing van het eerste, tweede en derde lid berekende subsidie wordt verlaagd indien de gemiddelde
      feitelijke bezetting van de gerealiseerde nieuwe kinderopvang- plaatsen over 1998, lager is dan 80%. Voorzover
      deze gemiddelde bezetting, beneden de 80% blijft, wordt het verschil in procentpunten vermenigvuldigd met 1,25 en
      vervolgens in mindering gebracht op de subsidie.


      [ref1]: https://wetten.overheid.nl/BWBR0009134#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009134#Artikel3
    url: https://wetten.overheid.nl/BWBR0009134/1998-09-04#Artikel5
