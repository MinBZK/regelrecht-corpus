  - number: '3'
    text: |-
      De subsidie voor gerealiseerde nieuwe kinderopvangplaatsen wordt aan de gemeente verleend onder de voorwaarden dat:

      a. in de schriftelijke overeenkomst bedoeld in [artikel 2, derde lid, onderdelen b en c][ref1], ten minste is
      vastgelegd het aantal kinderopvangplaatsen, bedoeld in deze regeling, alsmede het tijdstip waarop en de periode
      gedurende welke deze plaatsen zijn gerealiseerd, en

      b. in de jaarverantwoording van de derde instelling, bedoeld in [artikel 2, derde lid, onder b][ref2],
      over het jaar waarin de in de regeling bedoelde plaatsen zijn gerealiseerd tevens de gerealiseerde plaatsen
      worden verantwoord, de periode gedurende welke deze feitelijk zijn bezet, alsmede het aantal gerealiseerde
      kinderopvangplaatsen per 31 december 1995 wordt vermeld, en

      c. deze jaarverantwoording voorzien is van een verklaring van een accountant als bedoeld in artikel 393, eerste
      lid, van boek 2 van het Burgerlijk Wetboek.


      [ref1]: https://wetten.overheid.nl/BWBR0009134#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009134#Artikel2
