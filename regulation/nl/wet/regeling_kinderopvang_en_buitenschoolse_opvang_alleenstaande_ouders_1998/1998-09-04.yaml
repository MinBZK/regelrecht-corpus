  - number: '6'
    text: |-
      1 Burgemeester en wethouders dienen hun aanvraag in vóór 1 juni 1998.

      2 Bij de aanvraag wordt in elk geval opgave gedaan van het aantal nieuwe kinderopvangplaatsen dat burgemeester
      en wethouders voornemens zijn in 1998 te realiseren op jaarbasis, en voor de in 1996 of 1997 gerealiseerde
      kinderopvangplaatsen die zij voornemens zijn in 1998 te continueren. Deze opgave wordt ingericht volgens de bij
      deze regeling behorende bijlage 1. Op de aanvraag wordt ten aanzien van elke gemeente subsidie voor ten minste één
      kinderopvangplaats verleend.
    url: https://wetten.overheid.nl/BWBR0009134/1998-09-04#Artikel6
  - number: '7'
    text: |-
      1 De minister stelt de subsidie vast binnen 12 maanden na ontvangst van de jaaropgave bedoeld in
      [artikel 11, eerste lid][ref1].

      2 Indien de jaaropgave niet tijdig is ontvangen, dan wel niet is voorzien van de verklaring, bedoeld in
      [artikel 11, eerste lid][ref2], kan de minister de subsidie ambtshalve vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009134#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009134#Artikel11
    url: https://wetten.overheid.nl/BWBR0009134/1998-09-04#Artikel7
