  - number: '4'
    text: |-
      1 Het voor deze regeling beschikbare budget bedraagt 90 miljoen gulden.

      2 De maximale subsidie per gemeente wordt op basis van dat bedrag vastgesteld naar evenredigheid van het aantal
      alleenstaande ouders, dat volgens de facettencode CBS (per ultimo 1995) in de gemeente woonplaats had en als
      zodanig algemene bijstand op grond van de [Algemene Bijstandswet][ref1] ontving, zoals die wet luidde tot
      inwerkingtreding van de [Algemene bijstandswet][ref2].

      3 Indien een gemeente te kennen geeft het maximum subsidiebedrag dat volgt uit de toepassing van het eerste en
      tweede lid niet te zullen aanwenden kan de minister voor die gemeente een lager maximum vaststellen, overeenkomstig
      het door die gemeente aangegeven bedrag.

      4 Indien de minister gebruik gemaakt heeft van de bevoegdheid bedoeld in het derde lid kan hij de daardoor
      resterende subsidie toevoegen aan de gemeenten die meer subsidie hebben aangevraagd dan uit de toepassing van het
      eerste en tweede lid zou volgen. De toevoeging vindt zo veel mogelijk naar rato van het bepaalde in het tweede
      lid plaats.

      5 Indien de op grond van dit artikel berekende aantallen of bedragen niet op een geheel getal uitkomen, worden die
      op een door de minister te bepalen wijze afgerond op een geheel getal.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333
    url: https://wetten.overheid.nl/BWBR0009134/1998-09-04#Artikel4
    references:
