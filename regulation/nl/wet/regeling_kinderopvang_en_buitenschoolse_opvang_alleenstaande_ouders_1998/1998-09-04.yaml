  - number: '2'
    text: |-
      1 De minister verleent op aanvraag aan een gemeente subsidie als tegemoetkoming in de door deze in het kalenderjaar
      1998 te maken kosten voor het realiseren van nieuwe kinderopvang-plaatsen ten behoeve van alleenstaande ouders die
      als zodanig in dat jaar:

      a. algemene bijstand ontvangen als bedoeld in de [Algemene bijstandswet][ref1] en:

      1º arbeid verrichten, of

      2º ten aanzien van wie het volgen van scholing of een opleiding noodzakelijk wordt geacht voor de inschakeling in
      de arbeid;

      b. geen algemene bijstand meer ontvangen als bedoeld in de [Algemene bijstandswet][ref2] wegens het verrichten
      van arbeid, waaronder begrepen arbeid die met overheidsbijdrage wordt gefinancierd dan wel waarvoor de werkgever
      subsidie ontvangt op grond van de Regeling extra werkgelegenheid voor langdurig werklozen 1996, 1997 en 1998,
      het Tijdelijk besluit subsidiëring experimenten activering van uitkeringsgelden of de Regeling schoonmaakdiensten
      particulieren, waarbij naar het oordeel van burgemeester en wethouders het bekostigen van de kinderopvang nog
      steeds noodzakelijk is om die arbeid te kunnen blijven verrichten;

      c. een dienstbetrekking vervullen op grond van de [Wet inschakeling werkzoekenden][ref3] of een arbeidsovereenkomst
      zijn aangegaan overeenkomstig artikel 5 van die wet.

      2 Met algemene bijstand, als bedoeld in het eerste lid, onder a en b, wordt gelijkgesteld een uitkering op grond
      van enige sociale zekerheidswet waarvan de hoogte de bijstandsuitkering voor een alleenstaande ouder niet te boven
      gaat indien naar het oordeel van burgemeester en wethouders het ontbreken van de bekostiging van kinderopvang ten
      aanzien van de betref-fende alleenstaande ouder zou leiden tot onbillijkheden van overwegende aard.

      3 De kosten van kinderopvangplaatsen kunnen ontstaan:

      a. doordat de gemeente zelf in het treffen van die plaatsen voorziet;

      b. door het betalen van een vergoeding aan een derde instelling op grond van een schriftelijke overeenkomst,
      waarbij die derde zich jegens de gemeente verplicht heeft tot het bieden van een of meer kinderopvangplaatsen;

      c. door het betalen van een vergoeding aan de alleenstaande ouder die met een derde instelling schriftelijk een
      overeenkomst gesloten heeft, waarbij die derde zich jegens de ouder verplicht heeft tot het bieden van een of meer
      kinderopvangplaatsen.

      4 Geen subsidie wordt verleend ten aanzien van kinderopvangplaatsen die geheel of gedeeltelijk worden bekos- tigd
      op grond van de Tijdelijke stimuleringsmaatregel buitenschoolse opvang dan wel uit anderen hoofde worden vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0007333
      [ref2]: https://wetten.overheid.nl/BWBR0007333
      [ref3]: https://wetten.overheid.nl/BWBR0009083
