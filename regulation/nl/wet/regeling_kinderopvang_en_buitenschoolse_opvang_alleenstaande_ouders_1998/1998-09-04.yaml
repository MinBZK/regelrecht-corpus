articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:



              a

                *de minister:*


                de minister van Sociale Zaken en Werkgelegenheid.



              b

                *alleenstaande ouder:*


                ongehuwde die de volledige zorg heeft voor één of meer tot zijn last komende kinderen en geen
      gezamenlijke huishouding voert met een ander, tenzij het betreft een bloedverwant in de eerste graad;



              c

                *ten laste komend kind:*


                kind in de leeftijd van 0 tot en met einde leeftijd primair onderwijs voor wie de alleenstaande ouder
      aanspraak op kinderbijslag op grond van de [Algemene Kinderbijslagwet][ref1] kan maken;



              d

                *kinderopvang:*


                het in georganiseerd verband tegen vergoeding verzorgen en opvoeden van kinderen door anderen dan de
      eigen ouder, pleeg- of stiefouder op uren dat deze zelf hiervoor niet beschikbaar is wegens het verrichten van een
      van de activiteiten, bedoeld in [artikel 2, eerste lid][ref2];



              e

                *kinderopvangplaats:*


                aanbod van kinderopvang dat voldoet aan de eisen gesteld bij of krachtens het
      [Tijdelijk besluit kwaliteitsregels kinderopvang][ref3], waarbij de volgende soorten worden onderscheiden:
                hele-dagopvang: aanbod van kinderopvang voor kinderen in de leeftijd van 0 tot en met 4 jaar gedurende
      negen of meer aaneengesloten uren per werk- of studiedag;
      halve-dagopvang: aanbod van kinderopvang voor kinderen in de leeftijd van 0 tot en met 4 jaar gedurende minimaal
      vijf, maar minder dan negen aaneengesloten uren per werk- of studiedag;
      buitenschoolse opvang: het in georganiseerd verband tegen vergoeding bieden van verzorging, opvoeding, toezicht
      en vrijetijdsactiviteiten aan kinderen in de leeftijd dat zij naar het primair onderwijs gaan door anderen dan de
      eigen ouders, pleeg- of stiefouders, waarbij in ieder geval opvang wordt geboden na school en in schoolvakanties;
      gastouderopvang: kinderopvang in een gezinssituatie, die tot stand komt door bemiddeling van een gastouderbureau
      gedurende ten minste vijf uren per week en die betrekking heeft op gelijktijdig ten hoogste vier kinderen;



              f
              gerealiseerde nieuwe kinderopvangplaats:

                kinderopvangplaats die gemeten naar de stand per 31 december 1995, zoals tot uitdrukking komend
      in een door het Ministerie van Volksgezondheid, Welzijn en Sport geaccepteerde ’Financiële verantwoording
      Stimuleringsmaatregel kinderopvang 1994-1995’, extra wordt gecreëerd in 1998, dan wel extra is gecreëerd in 1996 of
      1997 en in 1998 wordt gecontinueerd;
      kinderopvangplaats die vóór 31 december 1995 is gecreëerd, doch die eerst in 1996, 1997 en 1998, dan wel in 1998
      feitelijk wordt bezet door een ten laste komend kind.




      2 Onder gerealiseerde nieuwe kinderopvangplaats als bedoeld in het eerste lid, onderdeel f, wordt niet verstaan
      een kinderopvangplaats die geheel of gedeeltelijk wordt bekostigd op grond van de Tijdelijke stimuleringsmaatregel
      buitenschoolse opvang.

      3 Burgemeester en wethouders kunnen voor de toepassing van deze regeling gehuwden of samenwonenden gelijkstellen
      met een alleenstaande ouder in het geval één van de partners door omstandigheden de volledige zorg voor één of meer
      tot hun last komende kinderen op zich heeft genomen.


