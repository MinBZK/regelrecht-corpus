        paragraaf: '4'
  - number: '8'
    text: |-
      De minister betaalt op of omstreeks:

      a. 1 maart 1998 aan alle gemeenten een voorschot van 50% van de maximale subsidie bedoeld in
      [artikel 4, tweede lid][ref1];

      b. 1 oktober 1998 aan alle gemeenten die een aanvraag hebben ingediend een voorschot tot ten hoogste 80% van het
      bedrag dat op de aanvraag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009134#Artikel4
    url: https://wetten.overheid.nl/BWBR0009134/1998-09-04#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0009134
        artikel: '4'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Burgemeester en wethouders dragen er zorg voor dat de administratie voor de uitvoering van deze regeling zodanig
      wordt ingericht, dat alle van belang zijnde vastleggingen en bewijsstukken ten behoeve van het besluitvormings-,
      uitvoerings-, controle- en verantwoordingsproces zichtbaar en controleerbaar zijn vastgelegd.

      2 De administratie van de gemeente bevat in elk geval een overzicht waaruit kan worden afgeleid:

      a. welke alleenstaande ouders gebruik hebben gemaakt van de feitelijk gerealiseerde kinderopvangplaatsen op basis
      van deze regeling;

      b. het aantal feitelijk gerealiseerde kinderopvangplaatsen ultimo 1995;

      c. het aantal feitelijk gerealiseerde kinderopvangplaatsen op basis van deze regeling, dat in 1998 is gerealiseerd
      en het aantal plaatsen dat is gecontinueerd in 1998 op basis van de Regeling kinderopvang en buitenschoolse opvang
      alleenstaande ouders 1996 en de Regeling kinderopvang en buitenschoolse opvang 1997;

      d. de periode in 1998, waarin het aantal feitelijk gerealiseerde kinderopvangplaatsen, bedoeld in het tweede lid,
      onder b, ook daadwerkelijk bezet zijn geweest;

      e. de soort opvangplaats.
    url: https://wetten.overheid.nl/BWBR0009134/1998-09-04#Artikel9
  - number: '10'
    text: |-
      1 Met het toezicht op de naleving van deze regeling zijn belast de ambtenaren van de directie toezicht van het
      ministerie van Sociale Zaken en Werkgelegenheid.

      2 Burgemeester en wethouders verstrekken desgevraagd aan de minister kosteloos alle inlichtingen, die hij voor het
      toezicht op de uitvoering en de beleidsvorming met betrekking tot deze regeling nodig heeft en verlenen hem inzage
      in de administratie.
    url: https://wetten.overheid.nl/BWBR0009134/1998-09-04#Artikel10
  - number: '11'
    text: |-
      1 Burgemeester en wethouders doen vóór 20 september 1999 aan de minister opgave van het aantal feitelijk
      gerealiseerde nieuwe kinderopvangplaatsen, de feitelijke bezetting van die plaatsen door ten laste
      komende kinderen, alsmede de soort opvangplaatsen. Deze jaaropgave is ingericht overeenkomstig de bij
      deze regeling behorende bijlage 2 en is voorzien van een verklaring van een deskundige, belast met de in
      [artikel 213 van de Gemeentewet][ref1] voorgeschreven controle omtrent de juistheid van gegevens.

      2 De verklaring dat aan de voorwaarden van deze regeling is voldaan, is gebaseerd op een controle die is uitgevoerd
      overeenkomstig algemene uitgangspunten. Deze verklaring is ingericht overeenkomstig de bij deze regeling behorende
      bijlage 3, inclusief de bijbehorende aandachtspuntenlijst.

      3 Indien de jaarverantwoording van de derde instelling, bedoeld in [artikel 2, derde lid, onder b][ref2], wordt
      gecontroleerd door een ander dan de accountant bedoeld in het eerste lid, kan de accountant van de gemeente bij de
      controle van de opgave, indien dit naar zijn oordeel doelmatig is, gebruik maken van de controle die de accountant,
      bedoeld in [artikel 3, onder c][ref3].


