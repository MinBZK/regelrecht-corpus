  - number: '4'
    text: |-
      Bij ministeriële regeling kan worden bepaald dat exploitanten van buitenlandse schepen een bij die regeling
      bepaalde vergoeding verschuldigd zijn voor de kosten van:

      a. de afgifte op grond van deze wet van certificaten, ontheffingen of andere documenten of het in behandeling nemen
      van aanvragen daartoe;

      b. het op grond van deze wet verrichten van onderzoeken of van andere werkzaamheden ten behoeve van buitenlandse
      schepen;

      c. de aanhouding van schepen, voorzover een besluit als bedoeld in [artikel 3, eerste lid][ref1], verplicht tot het
      doorberekenen van de met de aanhouding gemoeide kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0016993#Artikel3
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0016993
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de met inachtneming van
      de besluiten, bedoeld in [artikel 3, eerste lid][ref1], bij besluit van Onze Minister aangewezen ambtenaren van de
      Inspectie Verkeer en Waterstaat.

      2 Onze Minister kan voor bepaalde door hem aan te wijzen taken, verband houdende met het toezicht op de naleving
      van het bij of krachtens deze wet bepaalde, ambtenaren van andere diensttakken ter beschikking stellen van de
      Inspectie Verkeer en Waterstaat. Indien de terbeschikkingstelling ambtenaren betreft, ressorterende onder een ander
      ministerie dan dat van Onze Minister, wordt het desbetreffende besluit genomen in overeenstemming met Onze Minister
      wie het mede aangaat.

      3 Van een besluit van Onze Minister als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing
      in de Staatscourant.

      4 Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop de in het eerste of
      tweede lid bedoelde ambtenaren hun taak uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0016993#Artikel3
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0016993
        artikel: '3'
        hoofdstuk: '2'
  - number: '6'
    text: |-
      1 Een toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, woongedeelten van buitenlandse schepen
      die zich in een haven bevinden binnen te treden zonder toestemming van de bewoner.

      2 Voorts is een toezichthouder bevoegd leden van de bemanning te onderwerpen aan een onderzoek inzake hun
      vakbekwaamheid, met inbegrip van hun bekwaamheid in het verrichten van operationele handelingen.
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel6
  - number: '7'
    text: |-
      1 Bij ministeriële regeling kan worden bepaald dat een toezichthouder in bij die regeling te regelen gevallen
      bevoegd is tot:

      a. aanhouding van buitenlandse schepen:

      1º. wegens het niet voldoen aan krachtens [artikel 3][ref1] gestelde regels;

      2º. indien een krachtens [artikel 4][ref2] verschuldigde vergoeding niet is voldaan of

      3º. indien hij wordt belemmerd in de uitoefening van zijn taak;

      b. stopzetting van activiteiten met of aan boord van buitenlandse schepen, indien die activiteiten worden verricht
      in strijd met krachtens [artikel 3][ref3] gestelde regels.

      2 Het eerste lid is van toepassing indien die schepen zich bevinden in een haven of in de Nederlandse territoriale
      zee, komend vanuit of op weg naar een haven.

      3 Een toezichthouder is tevens bevoegd tot aanhouding van buitenlandse schepen of tot stopzetting van
      activiteiten met of aan boord van buitenlandse schepen in de in het tweede lid bedoelde wateren, indien niet
      voldaan is aan bij ministeriële regeling aan te wijzen bepalingen van een rechtstreeks in al zijn onderdelen
      verbindend besluit van een of meer van de instellingen van de Europese Unie alleen of gezamenlijk als bedoeld
      in [artikel 3, eerste lid][ref4], voorzover het desbetreffende besluit van toepassing is in de hiervoor bedoelde
      wateren.

      4 Zodra er geen reden is om de aanhouding van een schip of de stopzetting van een activiteit langer te laten
      voortduren, heft de toezichthouder de aanhouding of stopzetting op.

      5 [Afdeling 5.3.1 van de Algemene wet bestuursrecht][ref5] is niet van toepassing op de in het eerste en derde lid
      bedoelde bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0016993#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0016993#Artikel4
