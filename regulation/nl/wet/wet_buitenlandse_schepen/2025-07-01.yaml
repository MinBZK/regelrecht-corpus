  - number: '8'
    text: |-
      1 De kapitein van een aangehouden schip is verplicht het schip na de aanhouding ligplaats te doen nemen op een door
      de toezichthouder in overeenstemming met de havenbeheerder aan te wijzen plaats.

      2 Zolang de aanhouding voortduurt, is het de kapitein verboden het schip te doen verplaatsen zonder voorafgaande
      toestemming van de toezichthouder. Zonder deze toestemming weigeren alle betrokken ambtenaren en registerloodsen
      hun medewerking bij het verplaatsen of het uitklaren van het aangehouden schip.

      3 Nadat een activiteit is stopgezet, is het de kapitein en de exploitant verboden om deze activiteit voort te
      zetten of haar, zolang de stopzetting niet is opgeheven, te hervatten.
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel8
  - number: '9'
    text: |-
      1 In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht][ref1] geschiedt de bekendmaking
      van een besluit tot aanhouding of tot stopzetting van een activiteit door uitreiking van dit besluit aan de
      kapitein.

      2 Indien uitreiking aan de kapitein niet mogelijk is, geschiedt de bekendmaking van een besluit als bedoeld in
      het eerste lid door uitreiking van dit besluit aan de naar het oordeel van de toezichthouder daarvoor meest gerede
      persoon, zo spoedig mogelijk gevolgd door kennisgeving aan de kapitein.

      3 De toezichthouder stelt de autoriteiten van de Staat wiens vlag het schip gerechtigd is te voeren, de consul
      of bij diens afwezigheid de dichtstbijzijnde diplomatieke vertegenwoordiger onmiddellijk schriftelijk in kennis
      van een besluit als bedoeld in het eerste lid, met vermelding van de omstandigheden die tot de aanhouding of de
      stopzetting van een activiteit hebben geleid.

      4 Het eerste tot en met derde lid is van overeenkomstige toepassing op besluiten tot opheffing van een aanhouding
      of tot opheffing van de stopzetting van een activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel341
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel9
