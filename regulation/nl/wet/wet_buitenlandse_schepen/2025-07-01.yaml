  - number: '10'
    text: |-
      1 Tegen besluiten van een toezichthouder, genomen krachtens deze wet, kan een belanghebbende beroep instellen bij
      Onze Minister.

      2 Het beroepschrift is gesteld in de Nederlandse of Engelse taal.
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel10
  - number: '11'
    text: |-
      1 Overtreding van [artikel 8][ref1] wordt gestraft met gevangenisstraf van ten hoogste twee jaren of geldboete van
      de vierde categorie.

      2 Overtreding van de krachtens [artikel 3][ref2] gestelde regels wordt, voorzover overtreding van die regels bij
      ministeriële regeling als strafbaar feit is aangemerkt, gestraft met hechtenis van ten hoogste vier maanden of
      geldboete van de derde categorie.

      3 De in het eerste lid strafbaar gestelde feiten zijn misdrijven. De in het tweede lid strafbaar gestelde feiten
      zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0016993#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0016993#Artikel3
