      1 Met de opsporing van de bij [artikel 11][ref1] strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref2], belast de bij besluit van Onze Minister van Justitie
      aangewezen ambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van de feiten, strafbaar gesteld in
      de [artikelen 179 tot en met 182][ref3] en [184 van het Wetboek van Strafrecht][ref4], voorzover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


