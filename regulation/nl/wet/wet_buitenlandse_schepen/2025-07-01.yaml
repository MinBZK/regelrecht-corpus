preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is een wettelijke voorziening te treffen op grond
    waarvan uitvoering kan worden gegeven aan besluiten van de instellingen van de Europese Unie, voorzover deze
    besluiten ertoe verplichten om regels te stellen ten aanzien van buitenlandse schepen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt, tenzij daarin anders is bepaald, verstaan onder:

      a. buitenlands schip: een zeeschip dat niet gerechtigd is de vlag van het Koninkrijk der Nederlanden te voeren;

      b. haven: een anker- of ligplaats onder Nederlandse jurisdictie voor schepen, al dan niet in zee;

      c. kapitein: de gezagvoerder van een schip of diens vervanger;

      d. exploitant: de eigenaar, de rompbevrachter of ieder ander die zeggenschap heeft over het gebruik van een schip;

      e. Onze Minister: Onze Minister van Verkeer en Waterstaat.

      2 Voor de toepassing van deze wet wordt met een buitenlands schip gelijkgesteld een schip dat op grond van voor
      Aruba, Curaçao of Sint Maarten geldende rechtsregels gerechtigd is de vlag van het Koninkrijk te voeren.
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel1
  - number: '2'
    text: |-
      Deze wet is van toepassing op buitenlandse schepen in Europese wateren onder Nederlandse jurisdictie, met
      uitzondering van oorlogsschepen, marinehulpschepen en andere schepen die in gebruik zijn voor de uitvoering van een
      militaire taak en voor andere dan handelsdoeleinden gebruikte overheidsschepen.
    url: https://wetten.overheid.nl/BWBR0016993/2025-07-01#Artikel2
  - number: '3'
    text: |-
      1 Ter uitvoering van een besluit van een of meer van de instellingen van de Europese Unie alleen of gezamenlijk
      betreffende de veiligheid van de zeescheepvaart in Europese wateren onder de jurisdictie van de lidstaten van
      de Europese Unie, kunnen bij ministeriële regeling regels worden gesteld met betrekking tot de overeenkomstige
      toepassing op buitenlandse schepen van bij of krachtens de [artikelen 3][ref1], [3a][ref2], [4][ref3], [6][ref4],
      en [9 van de Schepenwet][ref5] gestelde regels.

      2 [Artikel 5, tweede lid, van de Schepenwet][ref6] is van overeenkomstige toepassing, voorzover een besluit als
      bedoeld in het eerste lid voorziet in de mogelijkheid ontheffing te verlenen.


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel3
