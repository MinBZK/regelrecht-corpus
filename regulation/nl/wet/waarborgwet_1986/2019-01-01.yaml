    text: |-
      1 De krachtens [artikel 52, eerste lid][ref1], aangewezen ambtenaren zijn bevoegd, met medeneming van de benodigde
      apparatuur, een woning binnen te treden zonder toestemming van de bewoner.

      2 Zo nodig oefenen zij de in [artikel 5:18 van de Algemene wet bestuursrecht][ref2] genoemde bevoegdheid uit met
      behulp van de sterke arm.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel52
