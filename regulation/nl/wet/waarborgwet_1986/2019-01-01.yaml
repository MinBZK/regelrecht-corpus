        bwb_id: BWBR0009275
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009275
        artikel: '1'
        hoofdstuk: '1'
  - number: '35'
    text: |-
      Het is verboden op platina, gouden en zilveren werken gelijkende voorwerpen tezamen met gewaarborgde werken
      onder de aandacht van het publiek te brengen, tenzij eerstgenoemde werken op duidelijke wijze van de andere zijn
      onderscheiden.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel35
  - number: '36'
    text: |-
      Het is verboden andere voorwerpen dan die, welke ten minste voldoen aan het op grond van [artikel 1][ref1] voor de
      desbetreffende voorwerpen geldende laagste gehalte, onder de aandacht van het publiek te brengen met gebruikmaking
      van de woorden edelmetaal, platina, goud of zilver, of op zodanige andere wijze, dat daaruit redelijkerwijze moet
      worden afgeleid, dat die voorwerpen beantwoorden aan de samenstelling van platina, gouden en zilveren werken.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel1
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '1'
        hoofdstuk: '1'
  - number: '37'
    text: |-
      De ondernemers moeten zorgen dat op voor het publiek toegankelijke plaatsen alle op grond van [artikel 60][ref1]
      vastgestelde formulieren voorhanden zijn, en dat ten minste een van die formulieren duidelijk zichtbaar aanwezig
      is.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel60
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '60'
        hoofdstuk: VIB
  - number: '39'
    text: |-
      1 Een werkmeester mag door hem vervaardigde werken slechts van een meesterteken van een andere werkmeester
      voorzien, indien hij hiervan tevoren schriftelijk kennis heeft gegeven aan een waarborginstelling, onder
      overlegging van een schriftelijk bewijs van toestemming van die andere werkmeester.

      2 Indien een werkmeester de toestemming tot gebruik van zijn meesterteken als bedoeld in het eerste lid intrekt,
      geeft hij hiervan terstond schriftelijk kennis aan een waarborginstelling.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel39
  - number: '44'
    text: |-
      1 De notaris, griffier, deurwaarder of andere ambtenaar, te wiens overstaan een openbare veiling plaats heeft, of,
      bij ontstentenis van de zodanige, de bijzondere persoon, die de veiling of het toezicht daarop houdt, draagt zorg
      dat de platina, gouden of zilveren werken, niet voorzien van de vereiste stempeltekenen, niet in openbare veiling
      komen of met die bestemming worden tentoongesteld.

      2 Deze bepaling is mede van toepassing op de verkoping der onafgeloste panden van beleenbanken.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel44
  - number: '46'
    text: |-
      1 Van het houden ener openbare verkoping, waarin platina, gouden en zilveren werken voorkomen, moet door
      de notaris, griffier, deurwaarder of andere ambtenaar, te wiens overstaan zij zal gehouden worden, of, bij
      ontstentenis van de zodanige, door de bijzondere persoon, die dezelve of het toezicht daarover houden zal, ten
      minste drie dagen tevoren aangifte worden gedaan bij Onze Minister van Economische Zaken en Klimaat.

      2 Bij de aangifte, bedoeld in het eerste lid, worden vermeld de naam, het adres en de hoedanigheid van de aangever,
      de naam en het adres van degene die de verkoping organiseert, het adres van het verkooplokaal en de tijdstippen van
      kijkdagen en verkopingen.

      3 Bij verkopingen van beleenbanken of andere, die op vaste tijdstippen gehouden worden, is een opgave dier
      tijdstippen en der veranderingen, welke in de bepaling derzelve gebracht mochten worden, voldoende.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel46
  - number: '47'
    text: |-
      Alvorens ingevoerde platina, gouden en zilveren werken op een der wettelijke gehalten te stempelen, voorziet
      de betrokken waarborginstelling die werken, met uitzondering van die, welke niet zonder gevaar van beschadiging
      gestempeld kunnen worden of die van bijzondere kunstzinnige waarde zijn,

      a. van een afslag van een stempel van de ondernemer voor wie de werken bestemd zijn, of

      b. op verzoek van de buitenlandse ondernemer, die de werken in Nederland invoert, van diens meesterteken.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel47
  - number: 47a
    text: |-
      1 Het in [artikel 47, onder a][ref1], bedoelde stempel draagt de naam van invoerteken.

      2 Geen ondernemer mag een invoerteken aannemen, volkomen gelijk aan dat van een van zijn beroepsgenoten.

      3 Tot het opslaan van het invoerteken moet de belanghebbende het stempel in bewaring geven aan de in
      [artikel 47][ref2] bedoelde waarborginstelling.

      4 Het invoerteken behoeft de goedkeuring van een waarborginstelling.

      5 [Artikel 13, tweede lid][ref3], is ter zake van de in het vierde lid bedoelde goedkeuring van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0009275#Artikel13
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel47a
