  - number: 47b
    text: |-
      1 Het in [artikel 47, onder b][ref1], bedoelde meesterteken moet de aanvangsletters van de naam van de betrokken
      ondernemer vertonen, alsmede een bijzonder, door hem gekozen onderscheidingsteken, of moet een in het land van
      herkomst van de betrokken ondernemer door een daartoe bevoegd orgaan erkend meesterteken zijn, dat de ondernemer
      voldoende kan identificeren.

      2 De [artikelen 12, derde lid][ref2], [13][ref3] en [47a, derde lid][ref4], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel47
