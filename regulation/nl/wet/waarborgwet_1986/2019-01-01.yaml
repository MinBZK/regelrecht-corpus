        bwb_id: BWBR0020495
        artikel: '17'
  - number: 7d
    text: |-
      Indien de begroting van een waarborginstelling niet vóór de aanvang van het kalenderjaar, waarvoor zij moet dienen,
      is goedgekeurd, kan Onze Minister van Economische Zaken en Klimaat die instelling machtigen uitgaven te doen uit
      die posten waartegen hij geen bedenking heeft.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel7d
  - number: 7e
    text: |-
      Indien Onze Minister van Economische Zaken en Klimaat meer dan één rechtspersoon als bedoeld in
      [artikel 7, eerste lid][ref1], aanwijst, kan hij regels stellen ten behoeve van een goede coördinatie
      van de uitvoering van de door die rechtspersonen te verrichten taken en werkzaamheden als bedoeld in de
      [artikelen 13][ref2], [18][ref3], [39][ref4], [47][ref5], [47a][ref6] en [60][ref7].


