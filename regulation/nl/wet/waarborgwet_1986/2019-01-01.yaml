  - number: '55'
    text: |-
      1 De krachtens [artikel 52][ref1] aangewezen ambtenaren zijn bevoegd om, ten aanzien van reeds in de handel
      aanwezige platina, gouden, palladium en zilveren werken welke van een gehaltemerk zijn voorzien en waarvan wordt
      vermoed dat zij met ijzer, koper, hars of enige andere stof opgevuld of op een bedekte wijze met soldeersel
      overladen zijn, die werken door te snijden. Dit moet geschieden in tegenwoordigheid van de houder, tenzij deze te
      kennen heeft gegeven niet aanwezig te willen zijn.

      2 Blijkt het vermoeden juist, dan wordt de houder van het reeds in de handel aanwezige werk medegedeeld, dat deze
      ten onrechte van een gehaltemerk is voorzien en wordt het reeds aanwezige merk vernietigd.

      3 In het tegenovergestelde geval wordt aan die houder de waarde van het fatsoen van het doorgesneden werk vergoed.

      4 Het bepaalde in de voorgaande leden is niet van toepassing op opgevulde werken die voldoen aan krachtens
      [artikel 4, tweede lid][ref2], ter zake van die werken gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel4
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel55
