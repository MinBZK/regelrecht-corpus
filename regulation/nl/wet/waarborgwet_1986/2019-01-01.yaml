preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de Waarborgwet 1986 opnieuw te doen vaststellen ten
    einde te kunnen voldoen aan richtlijn nr. 83/189/EEG van de Raad van de Europese Gemeenschappen van 28 maart 1993
    betreffende een informatieprocedure op het gebied van normen en technische voorschriften (PbEG L 109);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      De gehalten der platina, gouden en zilveren werken, welke door krachtens deze wet vastgestelde keurmerken worden
      gewaarborgd, zijn bepaald:

      voor platina werken op 950 duizendsten, met dien verstande dat in platina alliages iridium als platina wordt
      beschouwd;

      voor gouden werken op 916, 833, 750 en 585 duizendsten;

      voor zilveren werken op 925, 835 en 800 duizendsten.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel1
  - number: '2'
    text: De werken, tussen twee gehalten bevonden, worden op het laagst dier beide gehalten gekeurmerkt.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel2
  - number: '3'
    text: |-
      Werken, die in voltooide staat worden aangeboden en waarvan naar het oordeel van een krachtens [artikel 7][ref1]
      aangewezen waarborginstelling het gehalte niet met voldoende zekerheid kan worden vastgesteld, worden gewaarborgd
      binnen een grens van twintig duizendsten.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel7
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '7'
        hoofdstuk: IIA
  - number: '4'
    text: |-
      1 Indien werken bestaan uit onderdelen van onderscheidene edele metalen als bedoeld in [artikel 1][ref1], worden
      die onderdelen afzonderlijk gewaarborgd.

      2 Werken, die gedeeltelijk bestaan uit edele metalen als bedoeld in [artikel 1][ref2] en gedeeltelijk uit andere
      metalen, dan wel zijn opgevuld met andere stoffen dan de in [artikel 1][ref3] bedoelde edele metalen, worden
      slechts gewaarborgd, indien zij voldoen aan door Onze Minister van Economische Zaken en Klimaat te stellen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0009275#Artikel1
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel4
