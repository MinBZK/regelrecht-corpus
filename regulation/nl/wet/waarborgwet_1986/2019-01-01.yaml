  - number: '9'
    text: |-
      De stempeling der platina, gouden en zilveren werken, zowel in het geval bij [artikel 1][ref1] als in dat bij
      [artikel 3][ref2] bedoeld, geschiedt met stempels, omtrent welker vorm en gebruik Onze Minister van Economische
      Zaken en Klimaat regels stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel3
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel9
