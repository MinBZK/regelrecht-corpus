  - number: '6'
    text: |-
      1 Onze Minister van Economische Zaken en Klimaat kan vrijstelling verlenen van het bepaalde in
      [artikel 5, eerste lid][ref1].

      2 Aan een vrijstelling kunnen beperkingen worden gesteld en voorschriften worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel5
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel6
    references:
