  - number: 25a
    text: |-
      1 Op werken, ten aanzien waarvan een gehalte als bedoeld in [artikel 24][ref1] is vastgesteld, en die voorts
      voldoen aan de vereisten, vervat in bijlage I bij het verdrag, worden de navolgende stempelmerken afgeslagen:

      a. het in bijlage II bij het verdrag voor het desbetreffende gehalte vastgestelde gehaltemerk;

      b. het in [artikel 10, onder 2°][ref2], bedoelde merk.

      2 Stempeling als bedoeld in het eerste lid kan slechts geschieden als door middel van gieten of afslaan op de
      desbetreffende werken een meesterteken als bedoeld in [artikel 12, tweede lid][ref3], of een invoerteken als
      bedoeld in [artikel 47a, eerste lid][ref4], alsmede een getal in arabische cijfers, waarmee het gehalte van het
      werk in duizendsten wordt aangegeven, zijn aangebracht.

      3 [Artikel 4][ref5] is niet van toepassing.


