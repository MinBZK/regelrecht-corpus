  - number: 5b
    text: |-
      De verplichting tot waarborging, bedoeld in [artikel 5, eerste lid][ref1], geldt evenmin voor werken die in een
      staat, die is aangesloten bij het in [artikel 22][ref2] bedoelde verdrag, overeenkomstig dat verdrag zijn voorzien
      van stempelmerken.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel22
