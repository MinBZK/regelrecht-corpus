      1 Met het toezicht op de naleving van [hoofdstuk IV][ref1] en [hoofdstuk V][ref2] zijn belast de bij besluit van
      Onze Minister van Economische Zaken en Klimaat aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.


