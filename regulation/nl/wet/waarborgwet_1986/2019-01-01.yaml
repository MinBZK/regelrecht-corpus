  - number: '26'
    text: |-
      1 Ondernemer ten aanzien van deze wet is, al wie in de uitoefening van een beroep of bedrijf geheel of gedeeltelijk
      uit platina, goud, palladium of zilver bestaande voorwerpen vervaardigt, bewerkt, doet vervaardigen of bewerken en
      al wie in de uitoefening van een beroep of bedrijf met zodanige voorwerpen handel drijft. Onder handel drijven als
      bedoeld in de vorige volzin wordt mede verstaan bemiddelen bij het tot stand brengen van overeenkomsten van koop en
      verkoop van de in die volzin genoemde voorwerpen.

      2 Werklieden die in dienst van hun meester geheel of gedeeltelijk uit platina, goud, palladium of zilver bestaande
      voorwerpen voor deze vervaardigen of bewerken, zijn niet ondernemer.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel26
  - number: '30'
    text: |-
      1 Geen ondernemer mag enig voltooid platina, gouden of zilveren werk, dat op grond van het bij of krachtens deze
      wet bepaalde moet zijn gewaarborgd, in zijn bezit hebben of daarmee handel drijven, tenzij dat werk is voorzien van
      de vereiste stempelmerken, dan wel, indien het werk op grond van het bepaalde in [artikel 11, eerste lid][ref1],
      van stempeling is vrijgesteld, van het in het tweede lid van dat artikel bedoelde schriftelijke bewijs.

      2 De werken, tot persoonlijk gebruik van de ondernemer en zijn gezin dienende, zijn hiervan niet uitgezonderd.

      3 Het bepaalde in het eerste lid omtrent het in bezit hebben van werken is niet van toepassing op de ondernemer,
      die de desbetreffende werken minder dan vier weken in zijn bezit heeft, voor zover die werken niet onder de
      aandacht van het publiek worden gebracht.

      4 Onder stempelmerken als bedoeld in het eerste lid worden verstaan alle merken, welke ingevolge wettelijke
      bepalingen op enig tijdstip zijn aangewezen om de gehalten van platina, gouden en zilveren werken te waarborgen,
      met uitzondering van de rijksstempelmerken voor ongewaarborgd gehalte.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel11
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '11'
        hoofdstuk: III
  - number: '31'
    text: |-
      Geen ondernemer mag andere dan de in [artikel 30, eerste lid][ref1], bedoelde werken in de handel brengen
      als platina, gouden of zilveren werken, indien deze voorwerpen niet ten minste voldoen aan het op grond van
      [artikel 1][ref2] voor de desbetreffende voorwerpen geldende laagste gehalte.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel1
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel31
    references:
