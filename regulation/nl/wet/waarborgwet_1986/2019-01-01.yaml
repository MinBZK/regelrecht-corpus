  - number: 58a
    text: |-
      Een waarborginstelling is verplicht de inlichtingen te verschaffen die de krachtens [artikel 52][ref1] aangewezen
      ambtenaren nodig achten voor de uitvoering van hun taak.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel52
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '52'
        hoofdstuk: VIA
  - number: '59'
    text: |-
      Een waarborginstelling is verplicht kosteloos aan een ieder inlichtingen te geven over de betekenis
      van de verschillende stempelmerken bedoeld in [artikel 25a, eerste en tweede lid][ref1], en
      [artikel 30, vierde lid][ref2], alsmede over de rijksstempelmerken van ongewaarborgd gehalte.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel30
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: 25a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0009275
        artikel: '30'
        hoofdstuk: IV
  - number: '60'
    text: |-
      1 Een waarborginstelling stelt, in overleg met de betrokken organisaties van ondernemers, een of meer formulieren
      vast waarop krachtens wettelijke bepalingen vastgestelde stempelmerken, aangevende het gehalte van platina, gouden,
      palladium of zilveren werken, met toelichting staan afgebeeld.

      2 De waarborginstelling, die een formulier als bedoeld in het eerste lid heeft vastgesteld, doet hiervan mededeling
      in de Staatscourant. In deze mededeling wordt omschreven welke stempelmerken op het desbetreffende formulier staan
      afgebeeld.

      3 De in het eerste lid bedoelde formulieren worden door een waarborginstelling aan een ieder tegen kostprijs ter
      beschikking gesteld.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel60
  - number: '66'
    text: |-
      Na de inwerkingtreding van deze wet berusten de krachtens de Waarborgwet 1986 (Stb. 1987, 39) vastgestelde regels
      en andere besluiten op deze wet.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel66
  - number: '67'
    text: De Waarborgwet 1986 (Stb. 1987, 39) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel67
