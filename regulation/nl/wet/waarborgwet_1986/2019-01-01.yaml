  - number: 47c
    text: |-
      1 Het bepaalde in [artikel 47][ref1] geldt niet:

      a. voor werken die, voordat zij werden ingevoerd, reeds anders dan ten behoeve van het drijven van handel in het
      bezit zijn geweest van een natuurlijke persoon of rechtspersoon;

      b. in andere gevallen dan bedoeld onder a, voor werken die voorzien zijn van een meesterteken van de buitenlandse
      ondernemer die de werken in Nederland invoert.

      2 Ter zake van het in het eerste lid, onder b, bedoelde meesterteken zijn de [artikelen 47b, eerste lid][ref2],
      [12, derde lid][ref3], en [13][ref4] van overeenkomstige toepassing.


