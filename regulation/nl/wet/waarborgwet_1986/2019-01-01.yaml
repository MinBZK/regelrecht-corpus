  - number: '7'
    text: |-
      1 Onze Minister van Economische Zaken en Klimaat wijst een of meer rechtspersonen aan, die tot taak hebben, met
      inachtneming van het bij en krachtens deze wet bepaalde, aangeboden werken op hun gehalte aan platina, goud,
      palladium en zilver te keuren en van stempelmerken te voorzien.

      2 Een aanwijzing als bedoeld in het eerste lid vindt slechts plaats, indien de betrokken rechtspersoon aan de
      volgende eisen voldoet:

      a. hij dient in staat te zijn de in het eerste lid bedoelde taken naar behoren te vervullen;

      b. de voorwaarden dienen aanwezig te zijn voor een zodanige besluitvorming binnen de rechtspersoon, dat een
      onafhankelijke vervulling van de in het eerste lid bedoelde taken zoveel mogelijk is gewaarborgd.

      3 Onze Minister kan een aanwijzing als bedoeld in het eerste lid intrekken, indien de betrokken rechtspersoon
      daarom verzoekt, dan wel indien deze rechtspersoon een of meer van de in het eerste lid bedoelde taken naar het
      oordeel van Onze Minister niet naar behoren vervult of niet meer voldoet aan de in het tweede lid gestelde eisen.

      4 Van een aanwijzing als bedoeld in het eerste lid en van een intrekking van die aanwijzing wordt mededeling gedaan
      door plaatsing in de Staatscourant.

      5 In deze wet en de daarop berustende bepalingen wordt onder een waarborginstelling verstaan een krachtens het
      eerste lid aangewezen rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel7
  - number: 7a
    text: |-
      1 Het is een waarborginstelling verboden haar statuten te wijzigen, tenzij de wijziging door Onze Minister van
      Economische Zaken en Klimaat is goedgekeurd.

      2 Onze Minister kan een goedkeuring als bedoeld in het eerste lid slechts weigeren, indien de statuten na de
      wijziging onvoldoende zouden zijn afgestemd op de in [artikel 7, eerste en tweede lid][ref1], bedoelde taken en
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel7
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '7'
        hoofdstuk: IIA
  - number: 7b
    text: |-
      1 Een waarborginstelling vestigt één of meer kantoren voor de uitvoering van de in [artikel 7, eerste lid][ref1],
      bedoelde taken.

      2 Indien meer dan één kantoor wordt gevestigd, kan de waarborginstelling de werkzaamheden van ieder kantoor
      beperken tot een door haar vast te stellen gebied of categorie van werken. Een besluit daartoe wordt door de
      waarborginstelling in de Staatscourant bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel7
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '7'
        hoofdstuk: IIA
  - number: 7c
    text: |-
      1 Een waarborginstelling legt jaarlijks vóór 1 november de vanaf 1 februari daarop volgend te berekenen
      tarieven voor het onderzoek van werken met het oog op het verkrijgen van stempelmerken als bedoeld in
      [artikel 9, eerste lid][ref1], en voor het plaatsen van deze merken ter goedkeuring aan Onze Minister van
      Economische Zaken en Klimaat voor. Zij worden na goedkeuring door de waarborginstelling in de Staatscourant
      bekendgemaakt.

      2 Onverminderd [artikel 17 van de Kaderwet zelfstandige bestuursorganen][ref2] kan Onze Minister een goedkeuring
      als bedoeld in het eerste lid weigeren indien de tarieven hoger zijn dan, uitgaande van een redelijke toerekening
      van de aan het onderzoek en de stempeling van de desbetreffende werken verbonden kosten, noodzakelijk is.

      3 Het in het eerste lid, eerste volzin, bedoelde besluit omtrent goedkeuring wordt binnen 8 weken na de verzending
      ter goedkeuring bekendgemaakt.

      4 Indien de vanaf 1 februari te berekenen tarieven niet vóór 1 januari daaraan voorafgaand zijn goedgekeurd, kan
      Onze Minister deze tarieven zelf vaststellen.

      5 Van een besluit tot vaststelling van tarieven als bedoeld in het vierde lid wordt door Onze Minister mededeling
      gedaan door plaatsing in de Staatscourant.

      6 Een waarborginstelling kan de tarieven, bedoeld in het eerste lid, gedurende het jaar waarvoor zij gelden,
      wijzigen. Een wijziging van de tarieven wordt ter goedkeuring aan Onze Minister van Economische Zaken en Klimaat
      voorgelegd. Het eerste lid, tweede volzin, alsmede het tweede en derde lid zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel17
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel7c
    references:
