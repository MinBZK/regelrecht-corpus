  - number: '10'
    text: |-
      De in [artikel 9][ref1] bedoelde stempelmerken zijn:

      1°. het gehaltemerk;

      2°. het merk tot aanwijzing van het waarborgkantoor, waar de stempeling is geschied;

      3°. het jaarlettermerk;

      4°. het gewichtaanduidend merk voor werken, welke uit meer dan een, niet voor afzonderlijke stempeling vatbare
      stukken bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel9
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '9'
        hoofdstuk: III
  - number: '11'
    text: |-
      1 Werken, welke niet zonder gevaar van beschadiging gestempeld kunnen worden, alsmede werken van bijzondere
      oudheidkundige of kunstzinnige waarde, kunnen door de waarborginstelling, die het onderzoek verricht, van de
      verplichting tot stempeling worden vrijgesteld.

      2 In het in het eerste lid bedoelde geval wordt ter zake van die werken een schriftelijk bewijs verstrekt, dat een
      nauwkeurige omschrijving van het desbetreffende werk inhoudt.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel11
  - number: '12'
    text: |-
      1 Onverminderd de stempeling door een waarborginstelling, is elke werkmeester verplicht alle uit zijn werkplaats
      voortkomende platina, gouden en zilveren werken, met uitzondering van werken, die niet zonder gevaar van
      beschadiging gestempeld kunnen worden, met de afslag te merken van een eigen, overeenkomstig [artikel 13][ref1]
      goedgekeurd, stempel, waarvan hij zich te dien einde voorzien moet, en welke de aanvangsletters van zijn naam
      benevens een bijzonder, door hem gekozen onderscheidingsteken vertonen moet.

      2 Dit merk, de verantwoordelijke vervaardiger van het werk aanwijzende, draagt de naam van meesterteken.

      3 Geen werkmeester mag een meesterteken aannemen, volkomen gelijk aan dat van een zijner beroepsgenoten.

      4 Het bepaalde in het eerste lid geldt niet, indien het meesterteken ingevolge een tussen de werkmeester en de
      waarborginstelling, aan welke de werken ter onderzoek zullen worden aangeboden, gesloten overeenkomst, door de
      betrokken waarborginstelling zal worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel13
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '13'
        hoofdstuk: III
  - number: '13'
    text: |-
      1 Het in [artikel 12, eerste lid][ref1], bedoelde meesterteken behoeft de goedkeuring van een waarborginstelling.

      2 Het door de betrokken waarborginstelling ter zake van een aanvraag om goedkeuring als bedoeld in het eerste lid
      berekende tarief behoeft de goedkeuring van Onze Minister van Economische Zaken en Klimaat. Dit tarief wordt door
      de waarborginstelling in de Staatscourant bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel12
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '12'
        hoofdstuk: III
  - number: '14'
    text: De kornetten en snippelingen worden na elke gehalteproef aan de aanbieder teruggegeven.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel14
  - number: '15'
    text: |-
      1 Alvorens tot het onderzoek te worden toegelaten moeten de werken tot een staat van voltooiing gebracht zijn,
      welke zowel tegen een verandering van hun oorspronkelijke bestemming, als tegen een beschadiging der stempeltekens
      bij de verdere bearbeiding, waarborgt. Werken, waaraan zodanige beschadiging is toegebracht, zijn opnieuw aan
      stempeling onderhevig.

      2 Inlandse werken worden alleen tot het onderzoek toegelaten indien zij, behoudens voor zover het werken betreft
      waarop [artikel 11][ref1] of [artikel 12, vierde lid][ref2], van toepassing is, voorzien zijn van het meesterteken
      en zij noch door polijsten, of op welke andere wijze ook, zijn afgewerkt, noch van stenen of andere dergelijke
      versierselen zijn voorzien; een en ander, tenzij naar het oordeel van de waarborginstelling, aan welke de
      aanbieding geschiedt, bijzondere redenen zulks onmogelijk dan wel onnodig maken.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel12
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '11'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0009275
        artikel: '12'
        hoofdstuk: III
  - number: '16'
    text: |-
      1 De werken, ter keuring aangeboden, moeten vergezeld gaan van een ondertekend borderel, opgave inhoudende van
      metaalsoort, getal of gewicht, en zo mogelijk gehalte.

      2 Voor het borderel wordt gebruik gemaakt van door de waarborginstelling, aan welke de werken worden aangeboden,
      tegen kostprijs ter beschikking gestelde formulieren.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel16
  - number: '17'
    text: |-
      1 De werken moeten steeds van verlengstukken voorzien zijn, ten einde daarop het voor de proef benodigde metaal
      te kunnen insnijden, tenzij bijzondere redenen, welker beoordeling aan de waarborginstelling, aan welke de werken
      worden aangeboden, blijft overgelaten, zulks onmogelijk dan wel onnodig maken.

      2 Het blijft desniettemin de waarborginstelling vrijgelaten die insnijding ook, althans voor een gedeelte, op het
      werk zelf te verrichten.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel17
  - number: '18'
    text: |-
      1 De platina, gouden en zilveren werken, bestemd om van de gehaltetekenen te worden voorzien, en die na
      aaneenvoeging hunner verschillende delen niet meer vatbaar zijn zouden voor een behoorlijk onderzoek, worden bij
      losse gedeelten aan het essai onderworpen, en van een door de waarborginstelling, die het onderzoek verricht,
      vastgesteld herkenningsteken, dat het bevonden gehalte aanwijst, voorzien. Later, in voltooide staat aan het
      kantoor teruggebracht, worden zij, zonder opnieuw onderzocht te worden, op het door de herkenningstekenen
      aangewezen gehalte gestempeld.

      2 De herkenningstekenen, bedoeld in het eerste lid, worden door de waarborginstelling, die deze heeft vastgesteld,
      in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel18
  - number: '19'
    text: |-
      1 Holle werken, draad- en knopwerk, en alle andere werken, waarvan men het gehalte niet langs de gewone weg kan
      leren kennen, worden onderzocht bij samensmelting van een of meerdere stukken, naar gelang van de grootte der
      partij.

      2 Zo dit onderzoek de juistheid der aangifte bevestigt, wordt de waarde van het fatsoen der versmolten stukken de
      belanghebbende door de waarborginstelling, die het onderzoek verricht, vergoed.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel19
  - number: '20'
    text: |-
      1 Een waarborginstelling is bevoegd om, indien zij vermoedt dat de platina, gouden en zilveren werken, waarvan
      stempeling op een der wettelijke gehalten wordt verlangd, met ijzer, koper, hars of enige andere stof opgevuld of
      op een bedekte wijze met soldeersel overladen zijn, die werken door te snijden. Dit moet geschieden in aanwezigheid
      van de aanbieder, tenzij deze te kennen heeft gegeven niet aanwezig te willen zijn.

      2 Blijkt het vermoeden juist, dan wordt degene die het werk ter keuring heeft aangeboden medegedeeld, dat de werken
      of voorwerpen niet tot de stempeling kunnen worden toegelaten.

      3 In het tegenovergestelde geval wordt aan die aanbieder of houder door de waarborginstelling, die het onderzoek
      heeft verricht, de waarde van het fatsoen van het doorgesneden werk of voorwerp vergoed.

      4 Het bepaalde in de voorgaande leden is niet van toepassing op opgevulde werken die voldoen aan krachtens
      [artikel 4, tweede lid][ref1], ter zake van die werken gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel4
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0009275
        artikel: '4'
        hoofdstuk: '1'
  - number: '21'
    text: |-
      1 Wanneer ten aanzien van enig aan het wettelijk onderzoek onderworpen platina, goud of zilverwerk een lager
      gehalte wordt bevonden dan dat hetwelk in het borderel is opgegeven, kan op verlangen van de aanbieder tot een
      tweede proef worden overgegaan.

      2 Indien de tweede proef het op het borderel vermelde gehalte bevestigt, is de aanbieder geen vergoeding
      verschuldigd voor de eerste proef.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel21
  - number: '22'
    text: |-
      In dit hoofdstuk wordt onder verdrag verstaan het op 15 november 1972 te Wenen tot stand gekomen Verdrag inzake
      onderzoek en stempeling van edelmetalen werken (Trb. 1991, 16).
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel22
  - number: '23'
    text: |-
      1 Op verzoek van de aanbieder verricht een waarborginstelling het onderzoek en de stempeling van platina, gouden
      en zilveren werken, in afwijking van [hoofdstuk III][ref1], en van palladium werken, overeenkomstig het bij of
      krachtens dit hoofdstuk bepaalde.

      2 Het eerste lid geldt niet, indien stempeling van een werk naar het oordeel van de betrokken waarborginstelling
      niet mogelijk is zonder gevaar voor beschadiging van dat werk.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#HoofdstukIII
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0009275
        hoofdstuk: III
  - number: '24'
    text: |-
      1 Waarborging van de in [artikel 23, eerste lid][ref1], bedoelde werken geschiedt op bij algemene maatregel van
      bestuur te bepalen gehalten.

      2 [Artikel 3][ref2] is niet van toepassing op de krachtens het eerste lid vastgestelde gehalten.


