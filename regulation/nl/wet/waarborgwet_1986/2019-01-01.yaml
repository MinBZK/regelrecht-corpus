  - number: '5'
    text: |-
      1 Aan waarborg zijn onderworpen platina, gouden en zilveren werken, welke hier te lande worden vervaardigd, worden
      ingevoerd of uit het bezit van anderen dan ondernemers in de handel worden gebracht, voor zover de werken niet zijn
      voorzien van de vereiste stempelmerken.

      2 Het bepaalde in het eerste lid is niet van toepassing op:

      a. gouden en platina werken, waarvan de totale massa aan goud en platina minder dan 0,5 gram bedraagt;

      b. zilveren werken, waarvan de totale massa aan zilver minder dan 1 gram bedraagt;

      c. andere werken dan bedoeld onder a en b, voor zover deze bestemd zijn om te worden uitgevoerd, en mits deze
      werken afzonderlijk zijn opgeslagen in niet voor verkoop aan het publiek bestemde ruimten.

      3 Bij algemene maatregel van bestuur kunnen de in het tweede lid, onder a en b, bedoelde grenzen worden verhoogd.
      Hierbij kunnen voor de onderscheidene edele metalen verschillende grenzen worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel5
  - number: 5a
    text: |-
      1 De verplichting tot waarborging, bedoeld in [artikel 5, eerste lid][ref1], geldt niet voor werken, die in een
      lid-staat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte door een onafhankelijke instelling zijn voorzien van een gehalteteken, mits dat teken op grond
      van een aldaar geldende wettelijke regeling wordt erkend en mits dat teken de aard van het edelmetaal en het
      gehalte aan edelmetaal aanduidt.

      2 Op de werken, bedoeld in het eerste lid, zijn de [artikelen 47 tot en met 47c][ref2] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009275#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009275#Artikel47
    url: https://wetten.overheid.nl/BWBR0009275/2019-01-01#Artikel5a
    references:
      - id: ref1
