$id: machtigingswet_koninklijke_ptt_nederland_nv
regulatory_layer: WET
publication_date: '2009-03-30'
valid_from: '2004-05-19'
bwb_id: BWBR0004422
url: https://wetten.overheid.nl/BWBR0004422/2004-05-19
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de Staat der Nederlanden overgaat tot oprichting
    van de naamloze vennootschap PTT Nederland NV, waarin de vermogensbestanddelen van de Staat welke worden
    toegerekend aan het Staatsbedrijf der Posterijen, Telegrafie en Telefonie worden ingebracht, en dat ingevolge
    artikel 40 van de Comptabiliteitswet 1976 (Stb. 1976, 671) voor de oprichting van deze vennootschap machtiging bij
    wet is vereist;

    dat het voorts wenselijk is de naamloze vennootschap PTT Nederland NV aan te wijzen als houder van de concessies,
    bedoeld in de tot stand te brengen wetgeving op het terrein van de post en de telecommunicatie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#ArtikelAanhef
articles:
  - number: '2'
    text: |-
      Onze Minister van Financiën wordt gemachtigd om namens de Staat deel te nemen in plaatsing van kapitaal door
      Koninklijke KPN N.V. of door TPG N.V.
    url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#Artikel2
  - number: '3'
    text: |-
      Op TPG N.V. zijn de [artikelen 158 tot en met 164 van boek 2 van het Burgerlijk Wetboek][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
    url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
  - number: '4'
    text: |-
      Op TPG N.V. zijn de [artikelen 153, derde lid][ref1], en [artikel 155 van Boek 2 van het Burgerlijk Wetboek][ref2]
      niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel155
    url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '153'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '155'
  - number: '5'
    text: |-
      TPG N.V. wordt aangewezen als rechtspersoon, bedoeld in [artikel 2a, eerste lid, van de Postwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
  - number: '10'
    text: |-
      1 De onder het Staatsbedrijf der Posterijen, Telegrafie en Telefonie berustende archiefbescheiden worden, met
      uitzondering van die welke betrekking hebben op de regelgevende taken van het Staatsbedrijf der Posterijen,
      Telegrafie en Telefonie, ter beschikking gesteld aan Koninklijke PTT Nederland N.V.. Daarvan wordt een verklaring
      opgemaakt die ten minste inhoudt een specificatie van deze archiefbescheiden. Onze Minister van Verkeer en
      Waterstaat, Koninklijke PTT Nederland N.V. en de algemene rijksarchivaris bewaren ieder een exemplaar van deze
      verklaring.

      2 De [Archiefwet 1995][ref1] (*Stb.* 276) is op de in het eerste lid bedoelde archiefbescheiden van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '30'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#Artikel30
  - number: '31'
    text: 'Deze wet kan worden aangehaald als: Machtigingswet Koninklijke PTT Nederland N.V..'
    url: https://wetten.overheid.nl/BWBR0004422/2004-05-19#Artikel31
