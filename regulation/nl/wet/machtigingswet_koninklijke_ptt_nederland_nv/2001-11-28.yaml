---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: machtigingswet_koninklijke_ptt_nederland_nv
regulatory_layer: WET
publication_date: '2009-03-30'
valid_from: '2001-11-28'
bwb_id: BWBR0004422
url: https://wetten.overheid.nl/BWBR0004422/2001-11-28
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat de Staat der Nederlanden overgaat tot oprichting
    van de naamloze vennootschap PTT Nederland NV, waarin de vermogensbestanddelen van de Staat welke worden
    toegerekend aan het Staatsbedrijf der Posterijen, Telegrafie en Telefonie worden ingebracht, en dat ingevolge
    artikel 40 van de Comptabiliteitswet 1976 (Stb. 1976, 671) voor de oprichting van deze vennootschap machtiging bij
    wet is vereist;

    dat het voorts wenselijk is de naamloze vennootschap PTT Nederland NV aan te wijzen als houder van de concessies,
    bedoeld in de tot stand te brengen wetgeving op het terrein van de post en de telecommunicatie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel1
  - number: 1.b
    text: 'het Staatsbedrijf: het Staatsbedrijf der Posterijen, Telegrafie en Telefonie.'
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister wordt gemachtigd om namens de Staat der Nederlanden bij eenzijdige rechtshandeling op
      te richten de naamloze vennootschap Koninklijke PTT Nederland N.V., waarop van toepassing zijn de
      [artikelen 158 tot en met 164 van boek 2 van het Burgerlijk Wetboek][ref1], welke vennootschap de dienstverlening
      op het gebied van de post en de telecommunicatie van het Staatsbedrijf voortzet. Koninklijke PTT Nederland N.V.
      dient daarbij te streven naar een op rendement en continuïteit gerichte bedrijfsvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
  - number: '2.2'
    text: |-
      Onze Minister wordt gemachtigd om namens de Staat deel te nemen in verdere plaatsing van kapitaal door Koninklijke
      PTT Nederland N.V..
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel2
  - number: '2.3'
    text: |-
      Koninklijke PTT Nederland N.V. richt op de dag van haar oprichting bij eenzijdige rechtshandeling
      dochtermaatschappijen op in de rechtsvorm van een besloten vennootschap met beperkte aansprakelijkheid, daaronder
      ten minste begrepen:
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel2
  - number: 2.3.a
    text: PTT Post BV;
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel2
  - number: 2.3.b
    text: PTT Telecom B.V.;
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel2
  - number: 2.3.c
    text: PTT RAC Bedrijfswagenparkbeheer BV.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel2
  - number: '2.4'
    text: |-
      De oprichting van Koninklijke PTT Nederland N.V. kan plaatsvinden zonder dat op de oprichtingsdatum een
      ondernemingsraad is ingesteld. Vanaf de dag van haar oprichting tot het tijdstip waarop Koninklijke PTT Nederland
      N.V. een ondernemingsraad zal hebben ingesteld, vormen aangelegenheden waarover op grond van wettelijke bepalingen
      overleg met een centrale ondernemingsraad moet worden gepleegd, onderwerp van overleg met de Bijzondere Commissie
      zoals deze voor de oprichting van Koninklijke PTT Nederland N.V. bij het Staatsbedrijf functioneerde. Verkiezingen
      voor de ondernemingsraden dienen uiterlijk zes maanden na de oprichtingsdatum te worden gehouden.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel2
  - number: '3'
    text: |-
      Op TNT Post Groep N.V. zijn de [artikelen 158 tot en met 164 van boek 2 van het Burgerlijk Wetboek][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel158
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '158'
  - number: '4'
    text: |-
      Op TNT Post Groep N.V. zijn de [artikelen 153, derde lid][ref1], en
      [artikel 155 van Boek 2 van het Burgerlijk Wetboek][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel153
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel155
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '153'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '155'
  - number: '5'
    text: |-
      TNT Post Groep N.V. wordt aangewezen als rechtspersoon, bedoeld in [artikel 2a, eerste lid, van de Postwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004423#Artikel2a
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004423
        artikel: 2a
  - number: '6.1'
    text: |-
      De vermogensbestanddelen van de Staat die voorafgaand aan de oprichting van Koninklijke PTT Nederland N.V. aan het
      Staatsbedrijf worden toegerekend, gaan op de oprichtingsdatum van rechtswege over op deze vennootschap. Van deze
      overgang zijn uitgezonderd de door het Staatsbedrijf overeenkomstig diens balans bij de Staat belegde fondsen en
      reserves, alsmede eventuele op het Staatsbedrijf rustende vermogensrechtelijke verplichtingen welke verband houden
      met de uitoefening van publiekrechtelijke bevoegdheden door organen van het Staatsbedrijf.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel6
  - number: '6.2'
    text: |-
      De vermogensbestanddelen van Koninklijke PTT Nederland N.V. die op de oprichtingsdatum van de in
      [artikel 2, vierde lid][ref1], bedoelde vennootschappen worden toegerekend aan de ondernemingen welke door
      eerderbedoelde vennootschappen worden voortgezet, gaan vervolgens op deze datum van rechtswege over van Koninklijke
      PTT Nederland N.V. op deze vennootschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel2
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
  - number: '6.3'
    text: |-
      De overgang, bedoeld in het eerste en tweede lid, vindt plaats onder algemene titel zonder dat daarvoor een nadere
      rechtshandeling wordt gevorderd.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel6
  - number: '6.4'
    text: |-
      De rechtsbetrekkingen die ten gevolge van het bepaalde in het eerste, tweede en derde lid ontstaan tussen
      Koninklijke PTT Nederland N.V. respectievelijk de in [artikel 2, vierde lid][ref1], bedoelde vennootschappen en een
      derde die tot het tijdstip van overgang van de in het eerste lid bedoelde vermogensbestanddelen gebruik maakte van
      de diensten van het Staatsbedrijf, blijven, voor zolang tussen Koninklijke PTT Nederland N.V. respectievelijk de in
      [artikel 2, vierde lid][ref2], bedoelde vennootschappen en die derde geen andere voorwaarden van toepassing zijn,
      op overeenkomstige wijze beheerst door de voorwaarden die op het tijdstip van overgang op die rechtsbetrekkingen
      van toepassing waren.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004422#Artikel2
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
  - number: '6.5'
    text: |-
      Tenzij het tegendeel uitdrukkelijk blijkt uit het elders bij of krachtens de wet bepaalde, worden de bevoegdheden
      in de voorwaarden, bedoeld in de laatste zinsnede van het vierde lid, gegeven aan organen van de Staat, als rechten
      uitgeoefend door Koninklijke PTT Nederland N.V. respectievelijk de in [artikel 2, vierde lid][ref1], bedoelde
      vennootschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel2
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
  - number: '6.6'
    text: |-
      Het bepaalde in [artikel 94][ref1], en in [artikel 204][ref2] is op de oprichting van Koninklijke PTT Nederland
      N.V., respectievelijk de in [artikel 2, vierde lid][ref3], bedoelde vennootschappen van toepassing, met dien
      verstande dat de in vorenbedoelde artikelen bedoelde beschrijvingen betrekking dienen te hebben op de toestand van
      hetgeen overgaat op een dag die niet eerder dan dertien maanden voor de oprichting ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel94a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel204a
      [ref3]: https://wetten.overheid.nl/BWBR0004422#Artikel2
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 94a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 204a
      - id: ref3
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
  - number: '7.1'
    text: |-
      De in [artikel 6, eerste lid][ref1], geregelde overgang van vermogensbestanddelen wordt aangemerkt als storting op
      aandelen van de Staat in respectievelijk als storting op geldleningen van de Staat aan Koninklijke PTT Nederland
      N.V..


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel6
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '6'
        hoofdstuk: II
  - number: '7.2'
    text: |-
      Onze Minister stelt in overeenstemming met Onze Minister van Financiën vast tot welke bedragen de in het eerste
      lid bedoelde inbreng als storting op geldleningen wordt aangemerkt, daarbij tevens bepalend welk gedeelte van deze
      geldleningen als achtergesteld wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel7
  - number: '7.3'
    text: |-
      De in [artikel 6, tweede lid][ref1], geregelde overgang van vermogensbestanddelen wordt aangemerkt als storting op
      aandelen van Koninklijke PTT Nederland N.V. in respectievelijk op geldleningen van Koninklijke PTT Nederland N.V.
      aan elk van de in [artikel 2, vierde lid][ref2], bedoelde vennootschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004422#Artikel2
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
  - number: '8'
    text: |-
      De voorwaarden van de geldleningen, bedoeld in [artikel 7, eerste lid][ref1], worden door Onze Minister in
      overeenstemming met Onze Minister van Financiën vastgesteld en in de akte van oprichting van Koninklijke PTT
      Nederland N.V. opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel7
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '7'
        hoofdstuk: II
  - number: '9'
    text: |-
      Aan de beheerders van de openbare registers waarin overgang van rechten of verandering van tenaamstelling kan
      worden ingeschreven ten aanzien van de in [artikel 6, eerste en tweede lid][ref1], bedoelde vermogensbestanddelen,
      worden door de zorg van Onze Minister van Financiën de daartoe vereiste opgaven gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel6
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '6'
        hoofdstuk: II
  - number: '10.1'
    text: |-
      De onder het Staatsbedrijf berustende archiefbescheiden worden, met uitzondering van die welke betrekking hebben
      op de regelgevende taken van het Staatsbedrijf, ter beschikking gesteld aan Koninklijke PTT Nederland N.V.. Daarvan
      wordt een verklaring opgemaakt die ten minste inhoudt een specificatie van deze archiefbescheiden. Onze Minister,
      Koninklijke PTT Nederland N.V. en de algemene rijksarchivaris bewaren ieder een exemplaar van deze verklaring.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel10
  - number: '10.2'
    text: |-
      De [Archiefwet 1995][ref1] (*Stb.* 276) is op de in het eerste lid bedoelde archiefbescheiden van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007376
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007376
  - number: '12'
    text: |-
      Voor de heffing van de vennootschapsbelasting wordt op de openingsbalans van Koninklijke PTT Nederland N.V. en de
      vennootschappen, bedoeld in [artikel 2, vierde lid][ref1], geen goodwill opgevoerd met betrekking tot de van de
      Staat respectievelijk Koninklijke PTT Nederland N.V. overgenomen vermogensbestanddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel2
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
  - number: '13'
    text: |-
      Met betrekking tot de overgang van de vermogensbestanddelen van de Staat op Koninklijke PTT Nederland
      N.V. respectievelijk die van Koninklijke PTT Nederland N.V. op de vennootschappen, bedoeld in
      [artikel 2, vierde lid][ref1], vindt [hoofdstuk VA van de Wet op de vennootschapsbelasting 1969][ref2] geen
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002672#HoofdstukVa
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0002672
        hoofdstuk: Va
  - number: '15'
    text: |-
      Ter zake van de verkrijging door Koninklijke PTT Nederland N.V. respectievelijk de door deze vennootschap
      ingevolge [artikel 2, vierde lid][ref1], op te richten dochtermaatschappijen van vermogensbestanddelen van de Staat
      respectievelijk van Koninklijke PTT Nederland N.V. blijft heffing van overdrachtsbelasting achterwege.


      [ref1]: https://wetten.overheid.nl/BWBR0004422#Artikel2
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004422
        artikel: '2'
        hoofdstuk: I
  - number: '22'
    text: De wet van 4 juni 1981, houdende Machtigingswet stichting "Nepostel" (*Stb.* 1981, 378) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel22
  - number: '23'
    text: |-
      De wet van 18 juni 1987, houdende machtiging tot deelneming in de besloten vennootschap INTIS BV (*Stb.* 1987, 394)
      wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel23
  - number: '24'
    text: |-
      De wet van 5 juni 1985, houdende regelen met betrekking tot deelname door de Rijkspostspaarbank in het
      maatschappelijk kapitaal van de Friesch-Groningsche Hypotheekbank NV (*Stb.* 1985, 326) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel24
  - number: '25'
    text: |-
      De wet van 27 november 1980, houdende machtiging tot deelneming van het Staatsbedrijf der Posterijen, Telegrafie en
      Telefonie in Eurocard Nederland NV (*Stb.* 1980, 650) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel25
  - number: '26.1'
    text: |-
      De wet van den 18den Mei 1929, *Stb.* 249, betreffende het in het leven roepen van een stichting "Het Nederlandsche
      Postmuseum" (*Stb.* 1929, 249) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel26
  - number: '27'
    text: De Aanwijzingswet PTT 1954 (*Stb.* 1954, 593) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel27
  - number: '28'
    text: De Wet PTT-raad (*Stb.* 1954, 595) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel28
  - number: '30'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel30
  - number: '31'
    text: 'Deze wet kan worden aangehaald als: Machtigingswet Koninklijke PTT Nederland N.V..'
    url: https://wetten.overheid.nl/BWBR0004422/2001-11-28#Artikel31
