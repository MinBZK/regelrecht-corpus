preamble:
  text: >-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben dat het wenselijk is dat het maximale bedrag voor de boete die in het
    veterinaire tuchtrecht kan worden opgelegd, wordt verhoogd en dat de voorschriften voor de samenstelling ter
    zitting van de veterinaire tuchtcolleges worden aangepast;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0022416/2007-08-22#ArtikelAanhef
articles:
  - number: II
    text: |-
      Op tuchtvergrijpen als bedoeld in de [artikelen 14][ref1] en
      [15 van de Wet op de uitoefening van de diergeneeskunde 1990][ref2] die zijn begaan vóór inwerkingtreding van deze
      wet blijft [artikel 16, eerste lid, onderdeel c, van de Wet op de uitoefening van de diergeneeskunde 1990][ref3]
      zoals dat onmiddellijk vóór inwerkingtreding van deze wet gold, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
