---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_superheffing_2008
regulatory_layer: WET
publication_date: '2024-05-24'
valid_from: '2015-01-01'
bwb_id: BWBR0023701
url: https://wetten.overheid.nl/BWBR0023701/2015-01-01
preamble:
  text: |-
    Gelet op de artikelen 66 en 78 van Verordening (EG) nr. 1234/2007 van de Raad van de Europese Unie van 22 oktober
    2007 houdende een gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen voor een aantal
    landbouwproducten (PbEU L299);

    Voorts gelet op de artikelen 13, 19, 23, 27, en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel1
  - number: 1.a
    text: 'minister: Minister van Economische Zaken;'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel1
  - number: 1.b
    text: |-
      [verordening 1234/2007](32007R1234): [verordening (EG) nr. 1234/2007](32007R1234) van de Raad van de Europese Unie
      van 22 oktober 2007 houdende een gemeenschappelijke ordening van de landbouwmarkten en specifieke bepalingen voor
      een aantal landbouwproducten (PbEU L299);
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel1
  - number: 1.c
    text: |-
      commissieverordening: [verordening (EG) Nr. 595/2004](32004R0595) van de Commissie van 30 maart 2004 houdende
      vaststelling van uitvoeringsbepalingen van [Verordening (EG) nr. 1788/2003](32003R1788) van de Raad tot
      vaststelling van een heffing in de sector melk en zuivelproducten (PbEU L94);
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel1
  - number: 1.d
    text: |-
      melk, andere zuivelproducten, producent, bedrijf, koper, levering, rechtstreekse verkoop, vermarkting, nationaal
      quotum, individueel quotum, beschikbaar quotum: hetgeen daaromtrent is bepaald in artikel 65 van [verordening
      1234/2007](32007R1234);
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel1
  - number: 1.e
    text: |-
      heffingsperiode: tijdvak van 12 maanden dat begint op 1 april van ieder kalenderjaar en eindigt op 31 maart van het
      volgende jaar.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel1
  - number: '2.1'
    text: |-
      De producent die in een heffingsperiode zijn beschikbaar quotum overschrijdt, is de op grond van artikel 78, eerste
      lid, tweede alinea, van [Verordening 1234/2007](32007R1234) geldende heffing verschuldigd.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel2
  - number: '2.2'
    text: |-
      De grondslag voor de berekening van de heffing als bedoeld in het eerste lid is in geval van leveringen de totale
      hoeveelheid geleverde melk en in geval van rechtstreekse verkoop de totale hoeveelheid gebruikte of overgedragen
      melk. De hoeveelheid melk, of het equivalent daarvan, wordt bepaald met inachtneming van het bepaalde in de
      commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel2
  - number: '3.1'
    text: |-
      Van een natuurlijke of rechtspersoon die over individuele quota beschikt en die gedurende een heffingsperiode geen
      melk of andere zuivelproducten vermarkt, worden de quota uiterlijk met ingang van 1 april van het daaropvolgende
      kalenderjaar aan de nationale reserve toegevoegd overeenkomstig het bepaalde in artikel 72, eerste lid, van de
      [verordening 1234/2007](32007R1234).
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      Overeenkomstig het bepaalde in artikel 72, tweede lid, van [Verordening 1234/2007](32007R1234), wordt van een
      producent die minder dan 70 procent van zijn individueel quotum op de markt brengt, met ingang van 1 april van het
      daaropvolgende kalenderjaar het ongebruikte quotum geheel aan de nationale reserve toegevoegd.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel3
  - number: '3.3'
    text: |-
      Onder ongebruikt quotum, bedoeld in het tweede lid, wordt verstaan het verschil tussen het individueel quotum van
      de producent en hetgeen hij op de markt heeft gebracht in de desbetreffende heffingsperiode. Met een eventuele
      verkleining van het quotum in de betrokken heffingsperiode als gevolg van definitieve overdracht aan een andere
      producent, wordt bij de toepassing van het bepaalde in het tweede lid rekening gehouden.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel3
  - number: '4.1'
    text: |-
      De op grond van [artikel 3, eerste lid][ref1], aan de reserve toegevoegde quota kunnen opnieuw door de minister
      aan de natuurlijke of rechtspersoon worden toegewezen overeenkomstig het bepaalde in artikel 72, eerste lid, tweede
      alinea, van [verordening 1234/2007](32007R1234).


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel3
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '3'
        paragraaf: '3'
  - number: '4.2'
    text: |-
      Het op grond van [artikel 3, tweede lid][ref1], aan de nationale reserve toegevoegde quotum kan opnieuw door
      de minister aan de producent worden toegewezen op voorwaarde dat hij uiterlijk voor het einde van de tweede
      heffingsperiode nadat de quota aan de nationale reserve zijn toegevoegd, de vermarkting hervat van ten minste 70
      procent van zijn individueel quotum, bedoeld in artikel 3, tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel3
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '3'
        paragraaf: '3'
  - number: '4.3'
    text: |-
      Het met ingang van 1 april 2014 op grond van [artikel 3, tweede lid][ref1], aan de nationale reserve toegevoegde
      quotum kan opnieuw door de Minister aan de producent worden toegewezen op voorwaarde dat de producent voor 31 maart
      2015 de vermarkting hervat van ten minste 70 procent van zijn individueel quotum als bedoeld in artikel 3, tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel3
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '3'
        paragraaf: '3'
  - number: '6.1'
    text: |-
      Overeenkomstig het bepaalde in artikel 73, eerste lid, van [verordening 1234/2007](32007R1234) kan een producent
      in de betrokken heffingsperiode een deel van zijn individueel quotum dat hij niet voornemens is zelf te gebruiken,
      tijdelijk overdragen aan een andere producent.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel6
  - number: '6.2'
    text: 'Voor de tijdelijke overdracht als bedoeld in het eerste lid gelden de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel6
  - number: 6.2.a
    text: een producent draagt minimaal 10.000 kg tijdelijk over;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel6
  - number: 6.2.b
    text: een producent kan niet in een heffingsperiode zowel quota tijdelijk overdragen als overgedragen krijgen.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel6
  - number: '6.3'
    text: |-
      De tijdelijke overdracht van een quotum wordt in de betrokken heffingsperiode voor 16 februari gemeld aan de
      Minister met een door de minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel6
  - number: '6.4'
    text: Een aanspraak op een quotum ontstaat eerst na de registratie door de minister.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel6
  - number: '7.1'
    text: |-
      De overdracht van een individueel quotum, niet zijnde een geheel bedrijf, geschiedt in samenhang met de overdracht
      van de voor de melkproductie gebruikte grond als bedoeld in artikel 74, eerste lid, van [verordening 1234/2007]
      (32007R1234), als overeengekomen door betrokken partijen en met inachtneming van de hierna volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel7
  - number: '7.2'
    text: Het over te dragen quotum bedraagt niet meer dan 20.000 kg per hectare grond.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel7
  - number: '7.3'
    text: |-
      Het over te dragen quotum omvat minimaal 20.000 kg. Dit minimum behoeft niet in acht te worden genomen indien
      het totale quotum van de overdrager minder dan 20.000 kg bedraagt en deze hoeveelheid in zijn geheel wordt
      overgedragen. Voorts behoeft dit minimum niet in acht te worden genomen bij het eindigen, beëindigen en ontbinden
      van een pachtovereenkomst, die is goedgekeurd door de grondkamer vóór 1 april 1993.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel7
  - number: '7.4'
    text: |-
      De ingevolge het eerste lid met een quotum over te dragen grond was gedurende een periode van één jaar voorafgaande
      aan de overdracht daadwerkelijk voor de melkproductie op het betrokken bedrijf in gebruik. Voorts dient de met een
      quotum over te dragen grond gedurende een periode van één jaar na de overdracht daadwerkelijk voor de melkproductie
      op het betrokken bedrijf in gebruik te blijven. In geval van beëindiging van een pachtovereenkomst als bedoeld in
      [artikel 15, tweede lid, onder a, c en d][ref1], dient de terug over te dragen grond gedurende een periode van één
      jaar voorafgaande aan de beëindiging van een pachtovereenkomst daadwerkelijk voor de melkproductie op het betrokken
      bedrijf in gebruik te zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel15
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '15'
        paragraaf: '4'
  - number: '7.5'
    text: Het vorige lid is niet van toepassing ingeval van overdracht krachtens erfrecht of huwelijksvermogensrecht.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel7
  - number: '7.6'
    text: |-
      Een producent kan, nadat met betrekking tot enige heffingsperiode een overdracht van een quotum op zijn naam is
      geregistreerd, niet met betrekking tot dezelfde heffingsperiode als vervreemder een overdracht laten registreren.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel7
  - number: '8.1'
    text: |-
      In afwijking van het bepaalde in [artikel 7, eerste lid][ref1], kan een overdracht van een individueel quotum,
      niet zijnde een geheel bedrijf, plaatsvinden zonder overdracht van de voor de melkproductie gebruikte grond, als
      partijen dit overeenkomen en de verkrijger daarbij verklaart dat door deze overdracht van quotum ingevolge artikel
      75, eerste lid, onder f, van [verordening 1234/2007](32007R1234), de structuur van de melkproductie op het niveau
      van het bedrijf verbetert of dat deze overdracht bijdraagt tot extensivering van de productie.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
  - number: '8.2'
    text: |-
      Een producent kan met toepassing van het eerste lid in een heffingsperiode ten hoogste 10% van zijn individueel
      quotum, waarover hij bij de aanvang van die heffingsperiode beschikt, overgedragen krijgen, dan wel zoveel meer dat
      het quotum na overdracht ten hoogste 20.000 kg per hectare voor de melkproductie op het betrokken bedrijf gebruikte
      grond bedraagt.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel8
  - number: '8.3'
    text: |-
      [Artikel 7, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
  - number: '8.4'
    text: |-
      Een producent die met toepassing van het eerste lid in enige heffingsperiode een quotum heeft overgedragen gekregen
      kan eerst met ingang van de derde daarop volgende heffingsperiode een quotum overdragen op basis van het eerste lid
      of van [artikel 7, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
  - number: '8.5'
    text: |-
      Op aanvraag kan de Minister van het bepaalde in het vierde lid ontheffing verlenen indien naar zijn oordeel sprake
      is van bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel8
  - number: '9.1'
    text: |-
      Bij de overdracht van een individueel quotum als bedoeld in artikel 74, eerste lid, van [verordening 1234/2007]
      (32007R1234) in het kader van de overdracht van een bedrijf gaat het individueel quotum in zijn geheel over, met
      inachtneming van de hierna volgende bepalingen.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel9
  - number: '9.2'
    text: 'Een overdracht van een quotum vindt plaats tot ten hoogste 20.000 kg per hectare overgedragen grond, tenzij:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel9
  - number: 9.2.a
    text: |-
      het gehele bedrijf wordt verworven door degene die een echtgenoot, kind, afstammeling in de tweede graad,
      echtgenoot van een kind, echtgenoot van een kleinkind, of een pleegkind is van de vervreemder;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel9
  - number: 9.2.b
    text: |-
      het gehele bedrijf wordt verworven door een ander dan genoemd in onderdeel a, als ten genoegen van de minister is
      aangetoond dat het bedrijf in de twee jaren voorafgaande aan de overdracht niet substantieel is verkleind, althans
      voor zover het de melkveehouderij betreft en als het bedrijf beoordeeld naar de feitelijke bedrijfsvoering als
      een zelfstandige eenheid ongewijzigd wordt voortgezet. Ter zake van de toepassing van dit onderdeel kunnen nadere
      regelen worden gesteld door de minister.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel9
  - number: '9.3'
    text: Onder pleegkind wordt verstaan degene die duurzaam als een eigen kind is verzorgd en opgevoed.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien naar het oordeel van de minister een overdracht van grond dan wel het aangaan of beëindigen van een
      pachtovereenkomst kennelijk uitsluitend tot doel heeft gehad het maximum gesteld in [artikel 7, tweede lid][ref1],
      te ontgaan, kan de minister binnen een tijdvak van 3 jaren na overdracht van het quotum, besluiten dat een
      aanspraak op deze hoeveelheid ter zake van die overdracht geheel of gedeeltelijk niet meer wordt erkend, te rekenen
      vanaf het tijdstip van registratie, met dien verstande dat de niet-erkenning maximaal 12 maanden terugwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
  - number: '10.2'
    text: 'Indien een aanspraak ingevolge het eerste lid geheel of gedeeltelijk niet meer wordt erkend:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel10
  - number: 10.2.a
    text: |-
      kan erkenning van de aanspraak op het quotum bij de vervreemder plaatsvinden indien de verkrijger en de vervreemder
      overeenkomen dat de overdracht van het quotum ongedaan wordt gemaakt met ingang van de datum waarop partijen van
      deze overeenkomst op een daartoe voorgeschreven formulier bij de minister hebben kennisgegeven;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel10
  - number: 10.2.b
    text: |-
      kan erkenning van de aanspraak op het quotum bij de verkrijger plaatsvinden, indien alsnog daadwerkelijk voor
      de melkproductie gebruikte grond aan hem wordt overgedragen overeenkomstig het bepaalde in [artikel 7][ref1]
      met ingang van de datum waarop de betrokken registratie overeenkomstig de procedure van [artikel 11][ref2] heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel11
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '11'
        paragraaf: '4'
  - number: '10.3'
    text: |-
      De erkenning als bedoeld in het tweede lid wordt gerelateerd aan de nog niet verstreken periode van de betrokken
      heffingsperiode.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel10
  - number: '10.4'
    text: |-
      De verkrijger kan op diens verzoek voor het niet erkende deel van het quotum aanspraak maken op een vergoeding van
      € 0,29 per kilogram quotum. Voor zover deze vergoeding toegekend wordt, is het in het tweede lid bepaalde niet van
      toepassing. De Minister beslist op het verzoek.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel10
  - number: '10.5'
    text: |-
      Indien bij toepassing van [artikel 9, tweede lid, onderdeel b][ref1], naar het oordeel van de minister in het
      tijdvak van drie jaren volgend op de overdracht van het quotum, het bedrijf niet of niet meer als een zelfstandige
      eenheid ongewijzigd wordt voortgezet, kan de minister besluiten dat een aanspraak op deze hoeveelheid, die het
      maximum van 20.000 kg per overgedragen hectare te boven gaat, geheel of gedeeltelijk niet meer wordt erkend,
      te rekenen vanaf het tijdstip van registratie, met dien verstande dat de niet-erkenning maximaal 12 maanden
      terugwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel9
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '9'
        paragraaf: '4'
  - number: '11.1'
    text: |-
      Degenen die een quotum op basis van [artikel 7][ref1], [8][ref2] of [9, eerste lid][ref3], hebben overgedragen
      respectievelijk overgedragen gekregen, stellen gezamenlijk nadien de minister in kennis. Daarbij worden de
      voorgeschreven documenten met betrekking tot de overdracht van het quotum, en in het geval dat overdracht
      plaatsvindt op basis van [artikel 7][ref4] of [artikel 9, eerste lid][ref5], met betrekking tot de overdracht van
      de bijbehorende grond gevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023701#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0023701#Artikel9
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '8'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0023701
        artikel: '9'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0023701
        artikel: '9'
        paragraaf: '4'
  - number: '11.2'
    text: Er kan eerst een aanspraak op quotum worden gemaakt na de registratie door de minister.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien een overdracht als bedoeld in de [artikelen 7][ref1] of [8][ref2] na 15 januari in de betrokken
      heffingsperiode wordt ingediend, wordt de aanspraak op het overgedragen quotum eerst erkend met ingang van de
      volgende heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel8
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '8'
        paragraaf: '4'
  - number: '11.4'
    text: |-
      Onverminderd het bepaalde in [artikel 9, tweede lid, onder a en b][ref1], wordt, indien de minister de overdracht
      van een quotum ter registratie krijgt aangeboden waarbij meer dan 20.000 kg per hectare wordt overgedragen, ten
      name van de verwerver de overdracht geregistreerd van 20.000 kg per hectare overgedragen grond. Het meerdere wordt
      aan de nationale reserve toegevoegd. Voor de niet ten name van de verwerver geregistreerde hoeveelheid wordt een
      vergoeding toegekend overeenkomstig de bepalingen van de daarvoor geldende regeling van de Stichting Ontwikkelings-
      en Saneringsfonds voor de Landbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel9
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '9'
        paragraaf: '4'
  - number: '11.5'
    text: |-
      De vergoeding, bedoeld in het vierde lid, wordt toegekend aan de vervreemder van de grond, tenzij de betrokken
      partijen anders overeenkomen. In geval van ontbinding, eindigen dan wel beëindiging van een pachtovereenkomst wordt
      de vergoeding toegekend aan de verpachter en pachter gezamenlijk ieder voor de helft, tenzij de betrokken partijen
      anders overeenkomen.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel11
  - number: '11.6'
    text: |-
      Indien in een heffingsperiode de tijdelijke overdracht van een quotum overeenkomstig het bepaalde in
      [artikel 6][ref1] door de minister wordt geregistreerd en nadien in dezelfde periode ten aanzien van de betrokken
      hoeveelheid een kennisgeving bedoeld in de eerste volzin van het eerste lid bij de minister wordt aangemeld, wordt
      de aanspraak op de betrokken hoeveelheid eerst erkend met ingang van de volgende heffingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel6
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '6'
        paragraaf: '4'
  - number: '11.7'
    text: Een kennisstelling als bedoeld in het eerste lid wordt ingediend op een door de minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel11
  - number: '12.1'
    text: |-
      In afwijking van het bepaalde in de [artikelen 7][ref1], [8][ref2] en [9][ref3] gaat door overdracht van een
      bedrijf of grond krachtens erfrecht dan wel huwelijksvermogensrecht een quotum op de rechthebbende over, met
      inachtneming van de hierna volgende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023701#Artikel9
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '8'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0023701
        artikel: '9'
        paragraaf: '4'
  - number: '12.2'
    text: |-
      De Minister wijzigt op verzoek van de rechthebbende of de rechthebbenden aan wie een bedrijf toekomt de registratie
      van het betrokken quotum.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel12
  - number: '12.3'
    text: |-
      De Minister wijzigt op verzoek van de rechthebbende of de rechthebbenden aan wie gronden toekomen die ten tijde van
      de overdracht deel uitmaakten van een bedrijf waaraan een quotum was gerelateerd, de registratie van de betrokken
      hoeveelheid als overeengekomen door de rechthebbenden, op basis van de voor de melkproductie gebruikte oppervlakte.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel12
  - number: '12.4'
    text: |-
      De Minister kan op verzoek de voorgaande leden overeenkomstig toepassen indien sprake is van een andere
      wijze van overdracht onder algemene titel dan is aangegeven in het eerste lid, dan wel indien sprake is
      van een overdracht onder bijzondere titel, anders dan in [artikel 7, eerste lid][ref1], dan wel indien
      sprake is van in-de-plaatsstelling of medepacht als bedoeld in de [artikelen 363][ref2], [364][ref3] en
      [366 van Boek 7 van het Burgerlijk Wetboek][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel363
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel364
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel366
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '363'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '364'
      - id: ref4
        bwb_id: BWBR0005290
        artikel: '366'
  - number: '12.5'
    text: |-
      Een verzoek wordt gedaan door kennisgeving door de betrokken rechthebbende of de gezamenlijke rechthebbenden aan de
      minister. [Artikel 11, eerste, tweede en zesde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel11
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '11'
        paragraaf: '4'
  - number: '13.1'
    text: |-
      Een aanspraak op een quotum wordt niet erkend indien dat quotum in samenhang met de overdracht van grond, niet
      zijnde een geheel bedrijf, of een geheel bedrijf wordt verworven door een ander publiekrechtelijk lichaam dan het
      Bureau Beheer Landbouwgronden, of door een particuliere natuurbeschermingsorganisatie, tenzij de minister anders
      beslist voor een daarbij vastgestelde hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel13
  - number: '13.2'
    text: |-
      In geval van verwerving door een ander publiekrechtelijk lichaam dan het Bureau Beheer Landbouwgronden van grond,
      niet zijnde een geheel bedrijf, of een geheel bedrijf, wordt een aanspraak op een quotum erkend indien zeker is
      gesteld dat de overgedragen grond of het overgedragen bedrijf voor landbouwkundige doeleinden in gebruik blijft en
      indien de grond of het bedrijf samen met het quotum door het publiekrechtelijke lichaam binnen een termijn van ten
      hoogste 6 maanden na de overdracht wordt overgedragen aan één of meer producenten.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel13
  - number: '14.1'
    text: |-
      In afwijking van het bepaalde in de [artikelen 7][ref1], [8][ref2] en [9][ref3] kan ingeval van verplaatsing van
      een geheel bedrijf, het op het oude bedrijf beschikbaar quotum worden meegenomen naar het nieuwe bedrijf.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023701#Artikel9
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '7'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '8'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0023701
        artikel: '9'
        paragraaf: '4'
  - number: '14.2'
    text: |-
      Het ingevolge het eerste lid te verplaatsen bedrijf dient gedurende een periode van één jaar voorafgaand aan
      de verplaatsing daadwerkelijk in gebruik te zijn geweest voor de melkproductie. Voorts dient het nieuwe bedrijf
      gedurende een periode van één jaar na de verplaatsing daadwerkelijk voor de melkproductie in gebruik te blijven.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel14
  - number: '14.3'
    text: |-
      [Artikel 11, eerste, tweede en derde lid][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel11
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '11'
        paragraaf: '4'
  - number: '15.1'
    text: 'Onder overdracht wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.1.a
    text: overdracht in eigendom;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.1.b
    text: |-
      een door de grondkamer goedgekeurde pachtovereenkomst als bedoeld in
      [artikel 311 van Boek 7 van het Burgerlijk Wetboek][ref1] betreffende los land hetwelk groter is dan één hectare of
      een hoeve geldend voor de duur van meer dan één jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel311
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '311'
  - number: 15.1.c
    text: |-
      een schriftelijke pachtovereenkomst als bedoeld in [artikel 311 van Boek 7 van het Burgerlijk Wetboek][ref1]
      betreffende los land hetwelk niet groter is dan één hectare, geldend voor de duur van meer dan één jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel311
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '311'
  - number: 15.1.d
    text: |-
      een door de grondkamer geregistreerde pachtovereenkomst als bedoeld in
      [artikel 396, tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref1], geldend voor de duur van meer dan één jaar
      doch voor ten hoogste twee jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel396
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '396'
  - number: 15.1.e
    text: overdracht ingevolge vestiging, overdracht of tenietgaan van het recht van erfpacht of het recht van vruchtgebruik.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: '15.2'
    text: |-
      Aan het hieronder bepaalde is hetzelfde gevolg verbonden als aan de pachtovereenkomst bedoeld in het eerste lid, de
      onderdelen b, c en d;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.2.a
    text: een door de grondkamer goedgekeurde beëindigingsovereenkomst van een pachtovereenkomst;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.2.b
    text: |-
      een schriftelijke beëindigingsovereenkomst van een pachtovereenkomst als bedoeld in het eerste lid, onderdelen c
      en d;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.2.c
    text: |-
      het eindigen van een pachtovereenkomst als bedoeld in het eerste lid onderdelen
      c en d, alsmede van een door de Grondkamers goedgekeurde pachtovereenkomst als
      bedoeld in [artikel 325, derde lid, van Boek 7 van het Burgerlijk Wetboek][ref1],
      geldend voor de duur van meer dan één jaar, zonder dat een verzoek als bedoeld in
      [artikel 325, zesde lid, van Boek 7 van het Burgerlijk Wetboek][ref2] is ingediend, of van een pachtovereenkomst
      als bedoeld in [artikel 397, eerste en tweede lid, van Boek 7 van het Burgerlijk Wetboek][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel325
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel397
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '325'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '325'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '397'
  - number: 15.2.d
    text: een door de rechter uitgesproken ontbinding van een pachtovereenkomst;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.2.e
    text: een toewijzing door de rechter van een vordering tot beëindiging van een pachtovereenkomst;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.2.f
    text: |-
      het eindigen van een pachtovereenkomst als gevolg van een opzegging als bedoeld in
      [artikel 367, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1], waarna niet overeenkomstig
      [artikel 369, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] verzet is aangetekend.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel367
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel369
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '367'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '369'
  - number: '15.3'
    text: 'Voor het tijdstip van overdracht van het quotum is bepalend:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.3.a
    text: |-
      de inschrijving van de desbetreffende akte in de in [artikel 89 van Boek 3 van het Burgerlijk Wetboek][ref1]
      bedoelde openbare registers met dien verstande dat in het geval van het tenietgaan van het recht van erfpacht of
      van het recht van vruchtgebruik het tijdstip van het tenietgaan in aanmerking wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel89
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '89'
  - number: 15.3.b
    text: |-
      de ingangsdatum van de pachtovereenkomst dan wel de datum waarop de betrokken partijen de pachtovereenkomst
      schriftelijk zijn aangegaan, voor zover deze na de ingangsdatum ligt;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
  - number: 15.3.c
    text: |-
      in geval van een overdracht op basis van [artikel 8, eerste lid][ref1]: de datum waarop de betrokken partijen het
      formulier, bedoeld in [artikel 11, eerste lid][ref2], hebben ondertekend.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel11
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '8'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: '11'
        paragraaf: '4'
  - number: '16.1'
    text: |-
      De producent die melk of andere zuivelproducten rechtstreeks heeft verkocht of overgedragen doet bij de minister
      tijdig aangifte overeenkomstig het bepaalde in artikel 11, eerste en tweede lid, van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel16
  - number: '16.2'
    text: |-
      De producent met een beschikbaar quotum voor rechtstreekse verkoop doet tevens in geval hij geen melk of andere
      zuivelproducten heeft verkocht of overgedragen, aangifte, als bedoeld in het eerste lid, bij de minister.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel16
  - number: '16.3'
    text: |-
      Indien de producent de in het eerste of tweede lid bedoelde aangifte niet voor 15 mei heeft gedaan of een onjuiste
      aangifte heeft ingediend, legt de minister aan de producent de sanctie als bedoeld in artikel 11, derde lid, van de
      commissieverordening, op, behoudens in geval artikel 11, vijfde lid, van de commissieverordening van toepassing is.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel16
  - number: '16.4'
    text: |-
      Indien op 1 juli geen aangifte is ontvangen door de minister, voegt de minister, overeenkomstig het bepaalde in
      artikel 11, vierde lid, van de commissieverordening het quotum voor rechtstreekse verkoop van de producent aan de
      nationale reserve toe, behoudens in geval artikel 11, vijfde lid, van de commissieverordening van toepassing is.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel16
  - number: '17.1'
    text: |-
      De koper doet bij de minister tijdig aangifte overeenkomstig het bepaalde in artikel 8, eerste en tweede lid, van
      de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel17
  - number: '17.2'
    text: |-
      Bij zijn aangifte voegt de koper een verklaring omtrent de juistheid van de in de aangifte
      vermelde gegevens van een accountant die is ingeschreven in het register, bedoeld in
      [artikel 36, eerste lid, van de Wet op het accountantsberoep][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel36
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0032573
        artikel: '36'
  - number: '17.3'
    text: |-
      Indien geen aangifte is ontvangen op 15 mei respectievelijk op 1 juli, is de koper het bedrag, berekend
      overeenkomstig artikel 8, derde lid, van de commissieverordening verschuldigd, onderscheidenlijk wordt de
      erkenning van de koper ingetrokken door de minister overeenkomstig het bepaalde in artikel 8, vierde lid, van de
      commissieverordening, behoudens in geval artikel 8, vijfde lid, van de commissieverordening van toepassing is.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel17
  - number: '18.1'
    text: |-
      Overeenkomstig het bepaalde in artikel 81 van [verordening 1234/2007](32007R1234) is de koper verantwoordelijk voor
      de inning van de heffingen en de afdracht ervan aan de minister.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel18
  - number: '18.2'
    text: |-
      Indien tijdens een heffingsperiode blijkt dat een producent zijn beschikbaar quotum overschrijdt, kan de koper op
      grond van het bepaalde in artikel 81, derde lid, van [verordening 1234/2007](32007R1234) per 100 kilogram melk ten
      hoogste het bedrag als bedoeld in artikel 78, eerste lid, tweede alinea, van [verordening 1234/2007](32007R1234)
      inhouden op de te betalen melkprijs.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel18
  - number: '18.3'
    text: |-
      De producent die aan een andere koper gaat leveren of die aan meer dan een koper levert, informeert de Minister
      hierover voor 16 februari in de betrokken heffingsperiode door middel van het door de minister vastgesteld
      formulier.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel18
  - number: '19.1'
    text: |-
      Een koper is verplicht een administratie te voeren in overeenstemming met het bepaalde in artikel 23, tweede lid,
      en artikel 24, tweede, derde en vierde lid, van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel19
  - number: '19.2'
    text: |-
      Een producent voert een administratie in overeenstemming met het bepaalde in artikel 24, vijfde respectievelijk
      zesde lid, van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel19
  - number: 19a.1
    text: |-
      De koper die gedurende de lopende heffingsperiode melk geleverd krijgt door een producent die zijn bij de
      desbetreffende koper beschikbare quotum met meer dan 100.000 kilogram heeft overschreden, stelt onder vermelding
      van de naam en het adres van de desbetreffende producent de minister hiervan in kennis binnen 5 werkdagen na de
      eerste levering waarbij het quotum van de desbetreffende producent met 100.000 kilogram is overschreden.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel19a
  - number: 19a.2
    text: |-
      De Minister kan de koper verplichten dat ten aanzien van de in het eerste lid bedoelde producent de inhoudingen op
      de te betalen melkprijs, zoals bedoeld in [artikel 18, tweede lid][ref1], worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel18
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '18'
        paragraaf: '5'
  - number: 19a.3
    text: |-
      De Minister kan besluiten dat de koper ter zekerstelling van de correcte inning van de superheffing het bedrag ter
      hoogte van de inhoudingen die op grond van het tweede lid zijn verricht, maandelijks afdraagt aan de minister als
      voorschot op de betalingen van de heffingen, bedoeld in [artikel 23][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel23
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '23'
        paragraaf: '6'
  - number: 19a.4
    text: |-
      In afwijking van het derde lid kan de koper in plaats van de maandelijkse afdracht, bedoeld in het derde lid, te
      verrichten een bankgarantie stellen ter hoogte van op grond van het derde lid verschuldigde bedrag. In voorkomend
      geval wordt de bankgarantie maandelijks verhoogd.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel19a
  - number: '20.1'
    text: Het is een producent verboden melk te leveren aan een niet-erkende koper.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel20
  - number: '20.2'
    text: |-
      Het is een producent verboden melk of andere zuivelproducten van zijn bedrijf te vermarkten anders dan op eigen
      naam.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel20
  - number: '20.3'
    text: Het is een koper verboden melk geleverd te krijgen, tenzij hij door de minister is erkend als koper.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel20
  - number: '21.1'
    text: |-
      Overeenkomstig het bepaalde in artikel 23, eerste lid, van de commissieverordening, erkent de minister op verzoek
      een koper die actief is op Nederlands grondgebied, die voldoet aan het bepaalde in de artikel 23, tweede lid, van
      de commissieverordening en
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.1.a
    text: |-
      die is ingeschreven in het handelsregister in de zin van [artikel 5 van de Handelsregisterwet 2007][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel5
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0021777
        artikel: '5'
  - number: 21.1.b
    text: |-
      die zich ertoe verbindt het vetgehalte van de melk te laten vaststellen en het vervoer van melk door middel van
      daartoe gebruikelijke transportmiddelen te laten verrichten, die de mogelijkheid bieden om de hoeveelheid, de
      herkomst en de bestemming van de getransporteerde melk vast te stellen;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.1.c
    text: |-
      waarvan de bestuurders in een periode van vijf jaren, voorafgaand aan de erkenning van de koper, geen bestuurder
      zijn geweest van een koper waarvan de erkenning is ingetrokken, ten aanzien waarvan surseance van betaling is
      verleend of die in staat van faillissement is verklaard;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.1.d
    text: |-
      waarvan de eigenaar of eigenaren in een periode van vijf jaren, voorafgaand aan de erkenning van de koper, geen
      eigenaar of mede-eigenaar zijn geweest van een koper waarvan de erkenning is ingetrokken, ten aanzien waarvan
      surseance van betaling is verleend of die in staat van faillissement is verklaard.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: '21.2'
    text: Een verzoek tot erkenning als koper wordt ingediend voor 1 september.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: '21.3'
    text: 'De Minister trekt de erkenning van de koper in, indien:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.3.a
    text: de koper niet meer voldoet aan de eisen, gesteld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.3.b
    text: |-
      de koper in gebreke blijft met de inning van door producenten verschuldigde heffingen als bedoeld in artikel 81 van
      [verordening 1234/2007](32007R1234);
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.3.c
    text: |-
      de koper niet zijn administratie overeenkomstig het bepaalde in artikel 24, tweede, derde of vierde lid, van de
      commissieverordening voortdurend bijwerkt;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.3.d
    text: |-
      de koper niet op 1 juli zijn aangifte heeft ingediend. Artikel 8, vierde lid, van de commissieverordening is van
      toepassing;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21.3.e
    text: |-
      de in artikel 23, derde lid, van de commissieverordening bedoelde gevallen zich voordoen, behoudens in geval
      artikel 23, vierde lid, van de commissieverordening van toepassing is.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: '21.4'
    text: |-
      De Minister kan bepalen dat de intrekking van de erkenning, bedoeld in het derde lid, met betrekking tot de
      producenten die aan de desbetreffende koper leveren op het moment dat dit besluit wordt genomen, van kracht wordt
      met ingang van de volgende heffingsperiode.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: '21.5'
    text: |-
      In afwijking van het derde lid kan de minister in het geval van een situatie zoals bedoeld in het derde lid,
      onderdeel b, aan de erkenning van een koper de voorwaarde verbinden dat de inhoudingen op de te betalen melkprijs,
      zoals bedoeld in [artikel 18, tweede lid][ref1], worden verricht. Indien de minister deze aanvullende voorwaarde
      stelt, is [artikel 19a, derde en vierde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0023701#Artikel19a
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '18'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0023701
        artikel: 19a
        paragraaf: '5'
  - number: '21.6'
    text: Een verzoek als bedoeld in het eerste lid wordt ingediend met een door de minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21
  - number: 21a.1
    text: |-
      Een koper doet voor 15 mei opgave aan de Minister ten aanzien van de in de afgelopen heffingsperiode van
      producenten ontvangen melk en vermeldt daarbij:
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.a
    text: het totaal van de feitelijk geleverde hoeveelheden melk;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.b
    text: het gemiddelde vetgehalte van het totaal van de feitelijk geleverde hoeveelheden melk;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.c
    text: het totaal van de toegedeelde kilogrammen melk en vet waarover de producenten beschikken;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.d
    text: |-
      het totaal van de hoeveelheden melk, na correctie per producent, van de feitelijk geleverde hoeveelheden melk
      op grond van de vergelijking van het geconstateerde gemiddelde vetgehalte met het voor de producent geldende
      representatieve vetgehalte;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.e
    text: 'de per producent geleverde hoeveelheden melk, onderscheiden naar:'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.e.1°
    text: de feitelijk geleverde hoeveelheden melk, in totaal en per maand;
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.e.2°
    text: de hoeveelheid vet van die melk, in totaal en per maand, en
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.e.3°
    text: |-
      de hoeveelheden melk, na correctie van de feitelijk geleverde hoeveelheden melk op grond van de vergelijking van
      het geconstateerde gemiddelde vetgehalte met het voor de producent geldende representatieve vetgehalte, en
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.1.f
    text: |-
      de naam, het adres en het relatienummer, bedoeld in
      [artikel 1, onderdeel hh, van de Regeling identificatie en registratie van dieren][ref1], van de producent.


      [ref1]: https://wetten.overheid.nl/BWBR0014538#Artikel1
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0014538
        artikel: '1'
  - number: 21a.2
    text: |-
      De koper doet ten aanzien van in de heffingsperiode van anderen dan producenten ontvangen melk desgevraagd opgave
      aan de minister van:
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.2.a
    text: |-
      de, per leverancier, aan de koper geleverde hoeveelheden melk, alsmede de hoeveelheid vet van die melk onder
      vermelding van naam en adres van de leverancier, of
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.2.b
    text: |-
      het totaal van de door anderen dan de producenten aan de koper geleverde hoeveelheden melk en de totale hoeveelheid
      vet van die melk.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21a.3
    text: De koper doet opgave als bedoeld in het eerste lid met behulp van het door de minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21a
  - number: 21b
    text: |-
      De producent die in een heffingsperiode hoeveelheden melk of andere zuivelproducten rechtstreeks verkoopt of
      overdraagt doet daarover voor 15 mei van het daaropvolgende jaar opgave aan de minister met behulp van het door de
      minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21b
  - number: 21c.1
    text: |-
      Het melkequivalent van room en boter wordt vastgesteld overeenkomstig artikel 12, eerste lid, onderdelen a en b,
      van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21c
  - number: 21c.2
    text: |-
      Voor de vaststelling van het melkequivalent van kaas wordt 1 kg kaas gelijkgesteld met 9,5 kg melk. Rekening
      houdend met het drogestofgehalte en het vetgehalte van de betrokken kaassoort kan een lagere factor dan 9,5 worden
      gehanteerd, indien de producent aantoont dat voor de bereiding van die kaassoort een lagere hoeveelheid melk wordt
      gebruikt. Dit geldt niet, indien de kaas is bereid uit melk waaraan vet is onttrokken en het betrokken melkvet bij
      de vaststelling van de grondslag voor de eventuele heffing niet is meegeteld.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21c
  - number: 21c.3
    text: |-
      Voor de vaststelling van het melkequivalent van andere zuivelproducten dan bedoeld in het eerste en tweede lid
      wordt:
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21c
  - number: 21c.3.a
    text: indien het yoghurt, pap, vla en andere vloeibare zuivelproducten betreft, de factor 1 gehanteerd, en
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21c
  - number: 21c.3.b
    text: indien het kwark betreft, de factor 3 gehanteerd.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21c
  - number: 21c.4
    text: |-
      Indien de in het derde lid bedoelde producten zijn bereid uit melk waaraan melkvet is onttrokken en het betrokken
      melkvet bij de vaststelling van de grondslag voor de eventuele heffing is meegeteld, wordt met inachtneming hiervan
      een lagere hoeveelheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21c
  - number: 21c.5
    text: |-
      Indien de in het derde lid bedoelde producten zijn bereid uit melk waaraan melkvet is toegevoegd, en het betrokken
      melkvet bij de vaststelling van de grondslag voor de eventuele heffing niet is meegeteld, wordt met inachtneming
      hiervan een hogere hoeveelheid vastgesteld.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21c
  - number: 21d
    text: |-
      De koper stelt de in [artikel 21a][ref1] bedoelde hoeveelheden melk en het in artikel 21a bedoelde vetgehalte vast
      overeenkomstig [hoofdstuk 2, paragraaf 2.8, van de Regeling dierlijke producten](onbekend), of op grond van een
      andere methodiek die naar het oordeel van de minister voldoende waarborgen biedt voor een nauwkeurige vaststelling.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel21a
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21d
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: 21a
        paragraaf: 5a
  - number: 21e.1
    text: |-
      De koper zendt aan de producent die superheffing is verschuldigd, een nota waarop het bedrag is vermeld dat wordt
      ingehouden ingevolge [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel18
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21e
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '18'
        paragraaf: '5'
  - number: 21e.2
    text: Op de nota worden tevens de gegevens vermeld op basis waarvan het te innen bedrag is berekend.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel21e
  - number: '22'
    text: |-
      De Minister herverdeelt overeenkomstig het bepaalde in artikel 80, derde lid, onderdeel b, respectievelijk
      artikel 83, eerste lid, van [verordening 1234/2007](32007R1234) het ongebruikte deel van het nationaal
      quotum voor leveringen onderscheidenlijk rechtstreekse verkoop over de betrokken producenten die op grond van
      [artikel 2, eerste lid][ref1], een heffing verschuldigd zijn, naar evenredigheid van het individueel quotum van
      elke producent.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel2
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '2'
        paragraaf: '2'
  - number: '23.1'
    text: |-
      De producent, respectievelijk de koper draagt de door hem verschuldigde heffingen overeenkomstig het bepaalde in
      artikel 15, eerste lid, van de commissieverordening vóór 1 oktober af aan de minister.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel23
  - number: '23.2'
    text: |-
      Bij afdracht na 1 oktober is de producent respectievelijk de koper de rente als bedoeld in artikel 15, tweede lid,
      van de commissieverordening verschuldigd aan de minister.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel23
  - number: '23.3'
    text: |-
      In het geval van een zekerstelling als bedoeld in [artikel 19a, derde lid][ref1], wordt het bedrag van de
      zekerstelling, inclusief de berekende rente over de als zekerstelling betaalde bedragen tot de datum bedoeld in
      artikel 15, eerste lid, van de commissieverordening, en verminderd met de door de koper verschuldigde heffing,
      terugbetaald aan de desbetreffende koper dan wel verrekend met bestaande vorderingen die de minister op de
      desbetreffende koper heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel19a
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: 19a
        paragraaf: '5'
  - number: '23.4'
    text: |-
      De rente bedoeld in het derde lid wordt berekend tegen het rentetarief bedoeld in artikel 15, tweede lid, van de
      commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel23
  - number: '24'
    text: |-
      Voor de uitvoering van deze regeling en met name voor de vaststelling en oplegging van de heffingen, bedoeld in
      [artikel 2][ref1], wordt geen rekening gehouden met rechtshandelingen waarvan op grond van bepaalde feiten en
      omstandigheden kan worden aangenomen dat zij geen wezenlijke verandering van feitelijke verhoudingen ten doel
      hebben gehad, of dat die rechtshandelingen achterwege zouden zijn gebleven indien daarmede niet de vaststelling of
      oplegging van de heffing voor het vervolg geheel of ten dele onmogelijk zou worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0023701#Artikel2
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0023701
        artikel: '2'
        paragraaf: '2'
  - number: '25.1'
    text: |-
      De Minister stelt ambtshalve door de producent gebruikte hoeveelheid melk vast op basis van het aantal door
      de producent gehouden koeien en de gemiddelde melkgift van de kudde, in het in artikel 12, tweede lid, van de
      commissieverordening bedoelde geval.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel25
  - number: '25.2'
    text: De Minister beslist op verzoeken tot omzetting van quotum als bedoeld in artikel 3 van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel25
  - number: '25.3'
    text: |-
      De Minister administreert de beschikbare quota van iedere producent, alsmede iedere wijziging of omzetting daarvan,
      inclusief het vetgehalte als bedoeld in artikel 70 van [verordening 1234/2007](32007R1234) en informeert iedere
      producent omtrent de status van zijn individuele respectievelijk beschikbare quota overeenkomstig het bepaalde in
      artikel 5 van de commissieverordening.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel25
  - number: '25.4'
    text: |-
      Een verzoek als bedoeld in het tweede lid dat strekt tot permanente omzetting wordt ingediend voor 1 januari in de
      betrokken heffingsperiode.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel25
  - number: '25.5'
    text: |-
      Een verzoek als bedoeld in het tweede lid dat strekt tot tijdelijke omzetting wordt ingediend voor 16 februari in
      de betrokken heffingsperiode.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel25
  - number: '25.6'
    text: Een producent kan in de heffingsperiode maximaal 30.000 kg quotum tijdelijk omzetten.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel25
  - number: '25.7'
    text: Een verzoek als bedoeld in het tweede lid wordt ingediend met de door de minister vastgestelde formulieren.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel25
  - number: '26'
    text: |-
      De minister is de bevoegde autoriteit, bedoeld in Deel II, Titel I, Hoofdstuk III, Sectie III, van [verordening
      1234/2007](32007R1234) en de commissieverordening en is belast met de vaststelling, berekening en invordering van
      verschuldigde heffingen.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel26
  - number: 26a.1
    text: |-
      De op 31 december 2014 aanhangige opgaven, aanvragen of verzoeken die zijn ingediend op grond van de Regeling
      superheffing 2008 en de [Zuivelverordening uitvoering Regeling superheffing 2008][ref1] worden met ingang van 1
      januari 2014 behandeld door de minister met inachtneming van de termijn die op dat tijdstip is verstreken sinds het
      tijdstip van indiening van de melding, de aanvraag of het verzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0025323
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0025323
  - number: 26a.2
    text: |-
      Besluiten, niet inhoudende een algemeen verbindend voorschrift, een beslissing op bezwaar of een beslissing op
      een beroep, genomen op grond van de [Zuivelverordening uitvoering Regeling superheffing 2008][ref1] door het
      Productschap Zuivel, die golden op de dag voor het tijdstip van inwerkingtreding van dit artikel, worden met ingang
      van 1 januari 2014 geacht te zijn genomen door de minister op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025323
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0025323
  - number: '27'
    text: |-
      De [Regeling superheffing][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016539
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0016539
  - number: '28'
    text: 'Deze regeling wordt aangehaald als: Regeling superheffing 2008.'
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel28
  - number: '29'
    text: Deze regeling treedt in werking met ingang van 1 april 2008.
    url: https://wetten.overheid.nl/BWBR0023701/2015-01-01#Artikel29
