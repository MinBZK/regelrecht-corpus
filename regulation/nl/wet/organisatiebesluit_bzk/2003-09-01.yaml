  - number: 5:4
    text: |-
      1 De directie Koninkrijksrelaties staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het ontwikkelen van het samenwerkingsbeleid in algemene zin respectievelijk van het Nederlands beleid met
      betrekking tot de samenwerkingsrelatie met de Nederlandse Antillen en Aruba;

      b) de ontwikkeling, coördinatie en uitvoering van de samenwerking met en het onderhouden van betrekkingen met de
      Nederlandse Antillen en Aruba;

      c) het coördineren van het beleid van die Nederlandse ministeries die Koninkrijkstaken vervullen.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel54
  - number: 5:5
    text: |-
      1 De afdeling Coördinatie Europese en Internationale Zaken staat onder leiding van een hoofd.

      2 De afdeling heeft de volgende taken:

      a) het initiëren van de beleidsontwikkeling ten aanzien van Europese en internationale aangelegenheden van het
      ministerie;

      b) het coördineren en zorgdragen voor een eenduidige opstelling van het ministerie in Europese en internationale
      aangelegenheden;

      c) het vertegenwoordigen van het ministerie in het algemeen coördinerende en het dienstoverstijgende
      interdepartementaal Europese en internationaal overleg;

      d) het coördineren van Europese en internationale zaken waarvoor andere dienstonderdelen van het ministerie
      primair verantwoordelijk zijn en het behartigen van die Europese en internationale zaken waarvoor niet een ander
      dienstonderdeel van het ministerie als primair verantwoordelijk is aangewezen.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel55
  - number: 5:6
    text: |-
      1 De Vertegenwoordiging van Nederland in de Nederlandse Antillen staat onder leiding van een Vertegenwoordiger en
      een plaatsvervangend Vertegenwoordiger.

      2 De Vertegenwoordiging heeft de volgende taken (koninklijk besluit van 24 april 1997, regelende de positie
      en functie van Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen
      onderscheidenlijk Aruba):

      a) het optreden als vertegenwoordiger van de Nederlandse regering bij de regering en de eilandbesturen van de
      Nederlandse Antillen;

      b) het onderhouden van contacten met de regering en de eilandbesturen, alsmede met andere autoriteiten in de
      Nederlandse Antillen;

      c) het informeren van de bewindspersonen en de ambtelijke leiding van het ministerie over de politieke,
      bestuurlijke, financiële, maatschappelijke en sociaal-economische ontwikkelingen in de Nederlandse Antillen;

      d) het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en
      andere autoriteiten aan de Nederlandse Antillen;

      e) het zorgdragen voor het monitoren van afspraken in het kader van het samenwerkingsbeleid;

      f) het verlenen van consulaire bijstand aan Europese Nederlanders;

      g) het verrichten van taken ingevolge de [Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 5:7
    text: |-
      1 De Vertegenwoordiging van Nederland in Aruba staat onder leiding van een Vertegenwoordiger en een
      plaatsvervangend Vertegenwoordiger.

      2 De Vertegenwoordiging heeft de volgende taken (koninklijk besluit van 24 april 1997, regelende de positie
      en functie van Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen
      onderscheidenlijk Aruba):

      a) het optreden als vertegenwoordiger van de Nederlandse regering bij de regering van Aruba;

      b) het onderhouden van contacten met de regering van Aruba, alsmede met andere autoriteiten van Aruba;

      c) het informeren van de bewindspersonen en de ambtelijke leiding van het ministerie over de politieke,
      bestuurlijke, financiële, maatschappelijke en sociaal-economische ontwikkelingen in Aruba;

      d) het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en
      andere autoriteiten aan Aruba;

      e) het verlenen van consulaire bijstand aan Europese Nederlanders;

      f) het verrichten van taken ingevolge de [Kieswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 5:8
    text: |-
      1 De Vertegenwoordiging van het ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie staat onder leiding van een ambassaderaad.

      2 De Vertegenwoordiging heeft de volgende taken:

      a) het behartigen van de belangen van het ministerie bij de Europese Unie;

      b) het ondersteunen van de Permanente Vertegenwoordiger van Nederland bij de Europese Unie met betrekking tot
      aangelegenheden die het ministerie aangaan;

      c) het voorbereiden ter plaatse van, het deelnemen aan en het rapporteren over Europese overleggen.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel58
  - number: 5:9
    text: |-
      1 De projectafdeling Antilliaanse Jongeren Coördinatie staat onder leiding van een hoofd.

      2 De projectafdeling heeft de volgende taken:

      a) het inhoudelijk en procedureel (departementaal en interdepartementaal) coördineren van alle uitvoeringsaspecten
      van de nota Migratie Antilliaanse Jongeren;

      b) het inhoudelijk voorbereiden van het overleg met de Antilliaanse regering over de uitvoering van de nota;

      c) het verzorgen van de interdepartementale afstemming en de afstemming met gemeenten en andere betrokken
      instanties over de uitvoering van de nota;

      d) het rapporteren aan de bewindspersonen over de voortgang in de uitvoering van de nota.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel59
  - number: 6:1
    text: |-
      1 Het directoraat-generaal Openbaar Bestuur staat onder leiding van een directeur-generaal en een plaatsvervangend
      directeur-generaal, tevens directeur van een van de directies, genoemd in het derde lid.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van
      de hoofddoelstellingen van het ministerie, voor zover deze het bevorderen van een doelmatig, doeltreffend en
      democratisch openbaar bestuur, de coördinatie van de integratie van minderheden, het grotestedenbeleid en de
      informatievoorziening openbare sector betreffen.

      3 Het directoraat-generaal bestaat uit de volgende dienstonderdelen:

      a) het stafbureau Openbaar Bestuur (SOB);

      b) de directie Bestuurlijke en Financiële Organisatie (BFO);

      c) de directie Coördinatie Integratiebeleid Minderheden (CIM);

      d) de directie Grote Stedenbeleid en Interbestuurlijke Betrekkingen (GSIB);

      e) de directie Informatiebeleid Openbare Sector (IOS);

      f) de afdeling Kabinetszaken (KZ);

      g) het agentschap Basisadministratie Persoonsgegevens en Reisdocumenten (BPR);

      h) het agentschap Centrale Archief Selectiedienst (CAS).
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel61
  - number: 6:2
    text: |-
      1 Het stafbureau Openbaar Bestuur staat onder leiding van een hoofd.

      2 Het stafbureau heeft tot taak het ondersteunen van de directeur-generaal en de dienstonderdelen van het
      directoraat-generaal bij de uitvoering van de beleids- en beheerstaken.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel62
  - number: 6:3
    text: |-
      1 De directie Bestuurlijke en Financiële Organisatie staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft tot taak het ontwikkelen van beleid en wetgeving met betrekking tot de inrichting, werking en
      financiering van het binnenlands bestuur, in het bijzonder de provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel63
  - number: 6:4
    text: |-
      1 De directie Grote Stedenbeleid en Interbestuurlijke betrekkingen staat onder leiding van een directeur en een
      plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het coördineren van het intra- als interdepartementale beleid betreffende de grote steden;

      b) het bijdragen aan de bevordering van de kwaliteit van de organisatie en van het functioneren van de Rijksdienst;

      c) het coördineren van het bestuursbeleid en de taakverdeling tussen overheden en andere bestuursorganen, waaronder
      functionele bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel64
  - number: 6:5
    text: |-
      1 De directie Informatiebeleid Openbare Sector staat onder leiding van een directeur en een plaatsvervangend
      directeur

      2 De directie heeft de volgende taken:

      a) het ontwikkelen van het informatiebeleid van de openbare sector en de coördinatie daarvan;

      b) het bevorderen van de verbetering van de publieke dienstverlening aan en publieke toegankelijkheid van
      overheidsinformatie voor de burger, de overheid en het bedrijfsleven door beleidsontwikkeling en het stimuleren
      van toepassingen;

      c) het bevorderen van informatiebeveiliging;

      d) het ontwikkelen van beleid betreffende de digitale duurzaamheid en archivering;

      e) het ontwikkelen van beleid betreffende de elektronische infrastructuur van de openbare sector en het toezien op
      de uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel65
  - number: 6:6
    text: |-
      1 De afdeling Kabinetszaken staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft de volgende taken:

      a) het voorbereiden van de benoeming en het ontslag van burgemeesters en commissarissen van de Koningin;

      b) het uitvoeren van beleid en regelgeving inzake de rechtspositie van burgemeesters en commissarissen van de
      Koningin en het ontwikkelen van personeelsbeleid voor burgemeesters;

      c) het ontwikkelen en uitvoeren van beleid betreffende koninklijke onderscheidingen en het behandelen van zaken met
      betrekking tot de Kanselarij der Nederlandse Orden en het Kapittel voor de Civiele Orden;

      d) het voorbereiden van de benoeming en het ontslag van de leden van de Algemene Rekenkamer, de Raad van State en
      het Kapittel voor de Civiele Orden;

      e) het uitvoeren van de [Wet op de Adeldom][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006667
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel66
