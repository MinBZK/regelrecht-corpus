  - number: 2:4
    text: |-
      1 Er is een Audit Committee van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Het Audit Committee is samengesteld uit de leidinggevenden van de in [artikel 2:1, eerste lid][ref1], genoemde
      dienstonderdelen, de directeur Financieel-Economische Zaken en de directeur Accountantsdienst. De leidinggevenden
      en directeuren kunnen zich incidenteel laten vervangen door hun plaatsvervangers of in uitzonderlijke gevallen door
      een andere rechtstreeks onder hen ressorterende functionaris. De Inspectie Openbare Orde en Veiligheid kan in het
      Audit Committee worden vertegenwoordigd door de secretaris-generaal.

      3 Het Audit Committee heeft de taken, bedoeld in [artikel 8 van het Besluit taak DAD][ref2] en de bijbehorende
      toelichting op dat besluit, onverminderd het bepaalde in de departementale mandaat- en volmachtbesluiten over de
      bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de onderwerpen die in het overleg aan
      de orde komen.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      5 Het secretariaat wordt gevoerd door het hoofd Control Financieel Management van de directie Financieel-
      Economische Zaken.

      6 Het Audit Committee regelt de eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0013308#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0007535#Artikel8
