  - number: 2:3
    text: |-
      1 Er is een Centraal HRM-beraad van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Het Centraal HRM-beraad is samengesteld uit de leidinggevenden van de in [artikel 2:1, eerste lid][ref1],
      genoemde dienstonderdelen en de directeur Personeel en Organisatie. De leidinggevenden en directeur kunnen zich
      incidenteel laten vervangen door hun plaatsvervangers. De Inspectie Openbare Orde en Veiligheid kan in het Centraal
      HRM-beraad vertegenwoordigd worden door de secretaris-generaal.

      3 Het overleg in het Centraal HRM-beraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de
      onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van respectievelijk het bereiken van
      overeenstemming over aspecten van het departementale personeelsbeleid en personele aangelegenheden alsmede het
      toezien op de uitvoering hiervan. In het overleg komen in ieder geval de volgende aangelegenheden aan de orde:

        - de beleidsontwikkeling van management-development bij het ministerie;
        - de benoeming van functionarissen in schaal 14 en hoger bij het ministerie;
        - de werkzaamheden van het Centraal HRM-beraad met betrekking tot de personeelsschouw, zoals aangegeven in het
      departementale beleid ter zake.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      5 Het secretariaat wordt gevoerd door de Centrale MD-functionaris van de directie Personeel en Organisatie.

      6 Het Centraal HRM-beraad regelt de eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0013308#Artikel21
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel23
