  - number: 4:10
    text: |-
      1 Het gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen staat onder leiding van een secretaris en een plaatsvervangend secretaris.

      2 Het secretariaat heeft tot taak beide raden inhoudelijk en administratief te ondersteunen bij hun advisering.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel410
  - number: 4:11
    text: |-
      1 De Projectdirectie Nieuwe Huisvesting staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De projectdirectie heeft de volgende taken:

      a) het bevorderen van het totstandkomen van nieuwe huisvesting en de bijbehorende voorzieningen voor het
      kerndepartement van het ministerie;

      b) het voorbereiden van de verhuizing;

      c) het voeren van overleg met de ontwerpende en uitvoerende partijen waaronder het verzorgen van
      interdepartementale afstemming en afstemming met de betrokken gemeente;

      d) de zorg voor een adequate informatievoorziening over het project.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel411
  - number: 5:1
    text: |-
      1 Het directoraat-generaal Constitutionele Zaken en Koninkrijksrelaties staat onder leiding van een directeur-
      generaal en een plaatsvervangend directeur-generaal, tevens directeur van een van de directies, genoemd in het
      derde lid.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van de
      hoofddoelstellingen van het ministerie, voor zover deze betreffen:

      a) de zorg voor het constitutionele bestel van het koninkrijk;

      b) de coördinatie van de samenwerking met en het onderhouden van relaties met de Nederlandse Antillen en Aruba;

      c) de coördinatie van Europese en internationale zaken;

      d) de coördinatie van de uitvoering van de nota Migratie Antilliaanse Jongeren;

      e) algemene juridische advisering.

      3 Het directoraat-generaal bestaat uit de volgende dienstonderdelen:

      a) de stafafdeling Constitutionele Zaken en Koninkrijksrelaties (SCZK);

      b) de directie Constitutionele Zaken en Wetgeving (CZW);

      c) de directie Koninkrijksrelaties (KR);

      d) de afdeling Coördinatie Europese en Internationale Zaken (CEI);

      e) de Vertegenwoordiging van Nederland in de Nederlandse Antillen (VNW);

      f) de Vertegenwoordiging van Nederland in Aruba (VNO);

      g) de Vertegenwoordiging van het ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie (PVEU);

      h) de projectafdeling Antilliaanse Jongeren Coördinatie (AJC).
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel51
  - number: 5:2
    text: |-
      1 De stafafdeling Constitutionele Zaken en Koninkrijksrelaties staat onder leiding van een hoofd.

      2 De stafafdeling heeft de volgende taken:

      a) het ondersteunen van de directeur-generaal en de dienstonderdelen van het directoraat-generaal bij de uitvoering
      van de beleids- en beheerstaken;

      b) het adviseren en ondersteunen van de directeuren van de Kabinetten van de Gouverneurs van de Nederlandse
      Antillen en Aruba als bedoeld in artikel 2, vierde lid, van het Beheersbesluit KABGNA/KABGA 1998.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel52
  - number: 5:3
    text: |-
      1 De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft de volgende taken:

      a) de zorg voor het Statuut van het Koninkrijk der Nederlanden;

      b) de herziening van de [Grondwet][ref1] en het voorbereiden van wetgeving met een sterk constitutionele grondslag;

      c) het toetsen van regelingen, met inbegrip van conceptverdragen, en bestuur aan de [Grondwet][ref2] en aan
      verdragsbepalingen met constitutionele aspecten;

      d) het voorbereiden van de wetgeving over de Hoge Colleges van Staat en over rechtsbescherming in ruime zin;

      e) het vervullen van een primaire rol bij door de minister aangewezen wetgevingsprojecten;

      f) het mede-behandelen van alle aangelegenheden inzake de totstandkoming van wet- en regelgeving van het
      ministerie;

      g) het behandelen van constitutionele vraagstukken op het terrein van het kiesrecht;

      h) het voeren van het secretariaat van de Kiesraad;

      i) het coördineren van Europeesrechtelijke aangelegenheden;

      j) het behandelen van bijzondere opdrachten van een bewindspersoon of de Algemene Leiding, civielrechtelijke
      kwesties en andere juridische aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
      [ref2]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel53
