preamble:
  text: |-
    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit inrichting organisatie en formatie rijksdienst;

    Gehoord de Groepsondernemingsraad;

    Besluit
  url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:




              *ministerie:*


              het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;




              *minister:*


              de Minister van Binnenlandse Zaken en Koninkrijksrelaties;




              *bewindspersoon:*


              de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Staatssecretaris van Binnenlandse Zaken
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel1
  - number: 2:1
    text: |-
      1 De hoofdstructuur van het ministerie bestaat uit de volgende dienstonderdelen:

      a) de Algemene Leiding (ALGL);

      b) de Centrale Stafdiensten (CS);

      c) het directoraat-generaal Constitutionele Zaken en Koninkrijksrelaties (DGCZK);

      d) het directoraat-generaal Openbaar Bestuur (DGOB);

      e) het directoraat-generaal Openbare Orde en Veiligheid (DGOOV);

      f) het directoraat-generaal Management en Personeelsbeleid (DGMP);

      g) de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);

      h) het Bureau Algemene Bestuursdienst (BABD);

      i) de Inspectie Openbare Orde en Veiligheid (IOOV).

      2 De Algemene Leiding ressorteert onder de bewindspersonen.

      3 De overige in het eerste lid genoemde dienstonderdelen ressorteren onder de secretaris-generaal van het
      ministerie.
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel21
  - number: 2:2
    text: |-
      1 Er is een Bestuursraad van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      2 De Bestuursraad is samengesteld uit de leidinggevenden van de in [artikel 2:1, eerste lid][ref1], genoemde
      dienstonderdelen. De leidinggevenden kunnen zich incidenteel laten vervangen door hun plaatsvervangers of in
      uitzonderlijke gevallen door een andere rechtstreeks onder hen ressorterende functionaris. De Inspectie Openbare
      Orde en Veiligheid kan in de Bestuursraad worden vertegenwoordigd door de secretaris-generaal.

      3 Het overleg in de Bestuursraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de
      onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van respectievelijk het bereiken van
      overeenstemming over de departementale beleids- en beheerskaders alsmede het toezien op de uitvoering van deze
      kaders.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      5 Het secretariaat van de Bestuursraad wordt gevoerd door het hoofd van het Bureau Secretaris-Generaal.

      6 De Bestuursraad regelt de eigen werkwijze.


      [ref1]: https://wetten.overheid.nl/BWBR0013308#Artikel21
    url: https://wetten.overheid.nl/BWBR0013308/2003-09-01#Artikel22
