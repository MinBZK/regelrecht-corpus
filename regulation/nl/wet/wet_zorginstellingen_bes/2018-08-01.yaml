  - number: '8'
    text: |-
      1 Een zorgaanbieder biedt zorg aan die verantwoord is.

      2 Zorg is slechts verantwoord te achten als die tenminste wordt verleend op basis van deskundigheid, van een goed
      niveau is, doeltreffend, doelmatig en patiëntgericht en afgestemd op de reële behoefte van de patiënt.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel8
  - number: '9'
    text: |-
      1 De zorgaanbieder organiseert de verlening van de zorg op zodanige wijze, voorziet de zorginstelling
      zowel kwalitatief als kwantitatief zodanig van personeel en materieel, en draagt zorg voor een zodanige
      verantwoordelijkheidstoedeling, dat een en ander leidt of redelijkerwijze moet leiden tot verantwoorde zorg.

      2 De zorgaanbieder betrekt hierbij de resultaten van overleg tussen zorgaanbieder, zorgverzekeraars en platvorm
      van patiëntenorganisaties.

      3 Voor zover het betreft zorgverlening die verblijf van een patiënt in een zorginstelling gedurende tenminste
      een etmaal met zich meebrengt, draagt de zorgaanbieder er tevens zorg voor dat desgewenst geestelijke verzorging
      beschikbaar is, die zoveel mogelijk aansluit bij de levensovertuiging van de patiënt.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel9
  - number: '10'
    text: |-
      1 Onder de in [artikel 9, eerste lid][ref1], bedoelde organisatie wordt mede begrepen de systematische bewaking,
      beheersing en verbetering van de kwaliteit van de zorg.

      2 Daartoe draagt de zorgaanbieder, mede afgestemd op de aard en de omvang van de zorginstelling, zorg voor:

      a. het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de zorg;

      b. het aan de hand van deze gegevens op systematische wijze toetsen in hoeverre de wijze van uitvoering van deze
      wet ter zake van de kwaliteit van de verleende zorg leidt tot een verantwoorde zorgverlening;

      c. het op basis van deze toetsing zonodig verbeteren van de kwaliteit van de verleende zorg;

      d. het verzekeren van geformaliseerde besprekingen tussen de leiding en de afdelingen of geledingen van een
      zorginstelling omtrent de kwaliteit van de zorg.

      3 De zorgaanbieder streeft ernaar dat door middel van afstemming met andere zorginstellingen en zorgverzekeraars de
      continuïteit van de zorg in redelijkheid gewaarborgd is.


      [ref1]: https://wetten.overheid.nl/BWBR0028734#Artikel9
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel10
