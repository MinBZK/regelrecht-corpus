  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a.

      b.

      c. *gedraging:* enig handelen of nalaten alsmede het nemen van een besluit dat gevolgen heeft voor een patiënt;

      d. *Inspectie:* de Inspectie gezondheidszorg en jeugd;

      e.

      f. *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;

      g. *patiënt:* een natuurlijk persoon aan wie een zorgaanbieder zorg verleent of heeft verleend;

      h.

      i. *zorg:* het handelen van medische beroepsbeoefenaren, waaronder het verrichten van onderzoek, het stellen
      van diagnose of het behandelen, verplegen of verzorgen van een persoon met ziekten of gebreken in intramuraal,
      semimuraal of extramuraal verband;

      j. *zorgaanbieder:*

      1°. de natuurlijke- of rechtspersoon die een zorginstelling in stand houdt;

      2°. de natuurlijke- of rechtspersonen die gezamenlijk een zorginstelling vormen;

      k. *zorginstelling:* een organisatorisch verband dat strekt tot verlening van zorg, met uitzondering van een
      organisatorisch verband waar zorg wordt verleend als deel van de in een ander organisatorisch verband verleende
      zorg;

      l. *ziekenhuisvoorziening:* een bij algemene maatregel van bestuur aangewezen zorginstelling.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel1
  - number: '2'
    text: |-
      In geval sprake is van een zorgaanbieder als bedoeld in [artikel 1, onderdeel j, onder 2°][ref1], richten de uit
      deze wet voortvloeiende verplichtingen zich tot ieder van de in dat onderdeel bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0028734#Artikel1
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel2
