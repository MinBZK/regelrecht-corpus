  - number: '14'
    text: |-
      1 Elke zorgaanbieder treft een regeling voor de onafhankelijke behandeling van klachten over een gedraging van hem
      of van in zijn zorginstelling werkzame personen jegens een patiënt. Hij brengt de getroffen regeling op passende
      wijze onder de aandacht van zijn patiënten.

      2 Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de werkwijze van de instantie
      die de klacht behandelt, alsmede de samenstelling daarvan.

      3 Door of namens een patiënt kan, middels de regeling, bedoeld in het eerste lid, een klacht tegen een
      zorgaanbieder worden ingediend over een gedraging van hem of van in zijn zorginstelling werkzame personen jegens
      de patiënt.

      4 De zorgaanbieder deelt de klager en instantie die de klacht behandelt, binnen een maand na ontvangst van het
      oordeel over de klacht, schriftelijk mede of hij naar aanleiding van dat oordeel maatregelen zal nemen en zo ja,
      welke. Bij afwijking van de in de eerste volzin genoemde termijn, doet de zorgaanbieder daarvan met redenen omkleed
      mededeling aan de klager en de instantie die de klacht behandelt, onder vermelding van de termijn waarbinnen de
      zorgaanbieder zijn standpunt aan hen kenbaar zal maken.

      5 In afwijking van het derde lid kan bij de instantie die de klacht behandelt, eveneens een klacht tegen een
      zorgaanbieder worden ingediend over een gedraging van hem of van in zijn zorginstelling werkzame personen jegens
      een patiënt die inmiddels is overleden.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel14
  - number: '15'
    text: |-
      1 De leiding van een ziekenhuisvoorziening berust bij een algemeen bestuur en een dagelijks bestuur.

      2 Onder dagelijks bestuur wordt in ieder geval verstaan de directe leiding met betrekking tot de medische, de
      verpleegkundige en de economische aangelegenheden van de ziekenhuisvoorziening.

      3 De leden van het algemeen bestuur en het dagelijks bestuur alsmede de aan de ziekenhuisvoorziening verbonden
      medewerkers mogen geen ander zakelijk belang hebben bij de exploitatie van de ziekenhuisvoorziening dan uit de voor
      hen geldende rechtspositieregeling voortvloeit.

      4 Het dagelijks bestuur betrekt bij het functioneren van de ziekenhuisvoorziening zoveel mogelijk de patiënten dan
      wel de organisaties die de belangen van de patiënten behartigen.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel15
  - number: '16'
    text: |-
      1 Voor zover een ziekenhuisvoorziening rechtspersoonlijkheid heeft dan wel onder beheer staat van een
      rechtspersoon worden in de statuten regels gesteld met betrekking tot de taken van het algemeen bestuur en het
      dagelijks bestuur, gericht op het functioneren van de ziekenhuisvoorziening overeenkomstig de doelstelling.
      Deze regels bevatten, naast de wettelijk voorgeschreven bepalingen, voorts onder meer regels over het toezicht
      binnen de ziekenhuisvoorziening en de verplichting tot het opstellen van een reglement voor elk van de genoemde
      bestuursorganen.

      2 Het reglement van het algemeen bestuur bevat ten minste regels ter zake van de taken van dat bestuur ten aanzien
      van:

      a. het toezicht op het algemeen beleid van de rechtspersoon;

      b. het bijstaan van de afzonderlijke leden van het dagelijks bestuur.

      3 Het reglement van het dagelijks bestuur bevat voor zover van toepassing ten minste regels ter zake van de taken
      van dat bestuur ten aanzien van:

      a. de medische, verpleegkundige en economische taken;

      b. het opstellen van een meerjarenbeleidsplan, het jaarplan en de jaarlijkse begroting;

      c. de verantwoordelijkheden en bevoegdheden ter zake van:

      1°. het beheer;

      2°. de administratie met inbegrip van de medische administratie, waaronder de registratie van patiënten;

      3°. de verslaglegging en dossiervorming;

      4°. de kwaliteitsbewaking;

      5°. het opname- en ontslagbeleid;

      6°. de zorg voor de patiënten;

      7°. de geneesmiddelenvoorziening;

      8°. de administratieve organisatie;

      9°. het personeelsbeleid;

      10°. het waarborgen van de rechten van de patiënt.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel16
  - number: '17'
    text: |-
      1 In een ziekenhuisvoorziening functioneren een of meer commissies. Deze hebben tenminste tot taak:

      a. de registratie van incidenten, waaronder worden begrepen ongewenste gebeurtenissen of een reeks ongewenste
      gebeurtenissen, al dan niet tijdig gecorrigeerd, die hebben geleid, dan wel hadden kunnen leiden, tot ongewenste
      gevolgen als dood, verwonding, ziekte of schade aan, dan wel verlies van apparatuur of eigendom;

      b. de advisering over de voorziening en distributie van geneesmiddelen;

      c. de advisering over de handhaving van optimale hygiënische omstandigheden;

      d. het zorgdragen voor het vaststellen van uniforme medische- en verpleegkundige protocollen met betrekking tot
      behandelingen.

      2 Elke ziekenhuisvoorziening doet tenminste een keer per jaar verslag over het functioneren van de in het eerste
      lid bedoelde commissies aan de Inspectie.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel17
  - number: '18'
    text: |-
      Onderzoek en behandeling in een ziekenhuisvoorziening worden verleend door geneeskundigen, in samenwerking met
      verpleegkundigen, paramedische beroepsbeoefenaren en deskundigen uit andere disciplines.

      2. Een ziekenhuisvoorziening draagt zorg dat elke geneeskundige de ziektegeschiedenis van iedere onder zijn
      behandeling zijnde patiënt bijhoudt. De gegevens van een patiënt zijn voor zover zij voor de medebehandeling of
      de overname van de behandeling van belang zijn, toegankelijk voor andere in de ziekenhuisvoorziening werkzame
      geneeskundigen.

      3. De in een ziekenhuisvoorziening aangeboden medische specialismen worden slechts uitgeoefend door geneeskundigen
      die over de daarvoor vereiste deskundigheid beschikken.

      4. De in een ziekenhuisvoorziening werkzame geneeskundigen worden in de desbetreffende ziekenhuisvoorziening
      toegelaten op basis van een overeenkomst waarin de rechten en plichten van de geneeskundige zijn neergelegd.

      5. Elke in een ziekenhuisvoorziening werkzame geneeskundige is gehouden deel te nemen aan de in de
      ziekenhuisvoorziening ontwikkelde of nog te ontwikkelen activiteiten ter zake van kwaliteitsbewaking.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel18
  - number: '19'
    text: |-
      1 De in een ziekenhuisvoorziening werkzame geneeskundigen zijn georganiseerd per vakgroep. Zij vormen tezamen met
      de apotheker en de klinisch chemicus de medische staf.

      2 De medische staf stelt een reglement op dat algemene regels bevat ter zake van de organisatie van de medische
      staf, het medisch functioneren binnen de desbetreffende ziekenhuisvoorziening alsmede het niveau van geneeskundig
      handelen en de verantwoordelijkheid van de medische staf daarvoor. Het stafreglement behoeft de goedkeuring van het
      dagelijks bestuur.

      3 Binnen de grenzen van het stafreglement maakt elke vakgroep afspraken over de wijze van zorgverlening door de
      leden van die vakgroep en legt deze schriftelijk vast.

      4 Het dagelijks bestuur hoort de medische staf ter zake van alle medische beleidsaangelegenheden. De medische staf
      kan voorts het dagelijks bestuur ongevraagd adviseren. Bij afwijking van het advies deelt het dagelijks bestuur de
      redenen voor afwijking schriftelijk onderbouwd aan de medische staf mee.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel19
  - number: '20'
    text: |-
      De verpleegafdelingen alsmede de op medisch gebied assisterende afdelingen in een ziekenhuisvoorziening
      functioneren volgens door het dagelijks bestuur schriftelijk vastgelegde en goedgekeurde regels inzake de
      organisatie van deze afdelingen. Deze regels bevatten mede voorschriften ten aanzien van de kwaliteitsbewaking.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel20
  - number: '21'
    text: |-
      1 Een ziekenhuisvoorziening draagt er zorg voor dat de opvang van patiënten die zich voor spoedeisende medische
      hulp tot de ziekenhuisvoorziening wenden, op zodanige wijze is geregeld dat deze hulp te allen tijde op
      doeltreffende wijze kan worden verleend.

      2 Het Onze Minister kan op verzoek van een ziekenhuisvoorziening ontheffing verlenen van het bepaalde in het
      eerste lid, mits binnen het desbetreffende openbaar lichaam Bonaire, Sint Eustatius en Saba tenminste in één
      ziekenhuisvoorziening de opvang van patiënten die spoedeisende medische hulp behoeven overeenkomstig het eerste lid
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel21
  - number: '22'
    text: |-
      Bij algemene maatregel van bestuur kunnen criteria worden vastgesteld waaraan een laboratorium voor het verrichten
      van zorgondersteunende werkzaamheden moet voldoen.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel22
  - number: '23'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de medewerkers van de
      Inspectie.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel23
  - number: '24'
    text: |-
      Met het opsporen van de bij deze wet strafbaar gestelde feiten zijn, naast de bij
      [artikel 184 van het Wetboek van Strafvordering BES][ref1] aangewezen personen, belast de bij ministeriële regeling
      aangewezen medewerkers van de Inspectie.


      [ref1]: https://wetten.overheid.nl/BWBR0028681#Artikel184
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028681
        artikel: '184'
  - number: '25'
    text: |-
      1 Degene, die opzettelijk de verplichting tot geheimhouding, opgenomen in [artikel 26][ref1], schendt, wordt
      gestraft hetzij met gevangenisstraf van ten hoogste een jaar, hetzij met een geldboete van ten hoogste de vierde
      categorie, hetzij met beide straffen.

      2 Degene aan wiens schuld schending van de verplichting tot geheim-houding, opgenomen in [artikel 26][ref2], is
      te wijten wordt gestraft hetzij met gevangenisstraf van ten hoogste zes maanden hetzij met een geldboete van ten
      hoogste de vierde categorie, hetzij met beide straffen.

      3 De in het eerste lid strafbaar gestelde feiten worden beschouwd als misdrijf; de in het tweede lid strafbaar
      gestelde feiten worden beschouwd als overtreding.

      4 Geen vervolging van een in het eerste of tweede lid bedoeld strafbaar feit heeft plaats dan op klachte van
      degene, tegen wie het feit is gepleegd, of, indien het tegen een rechtspersoon, maat- of vennootschap, een
      vereniging van personen of een doelvermogen is gepleegd, op klachte van de bestuurder en indien er meer bestuurders
      zijn, van een van hen.


      [ref1]: https://wetten.overheid.nl/BWBR0028734#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0028734#Artikel26
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel25
