  - number: '11'
    text: |-
      Een zorginstelling richt de administratie, waaronder in ieder geval de medische- en de financiële administratie, op
      zodanige wijze in, dat te allen tijde inzicht kan worden verkregen in het functioneren van de zorginstelling.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel11
  - number: '12'
    text: |-
      1 De zorgaanbieder legt jaarlijks vóór 1 juni per zorginstelling een verslag ter openbare inzage, waarin
      verantwoording wordt afgelegd van het beleid dat in het afgelopen jaar ter uitvoering van deze wet ter zake van de
      kwaliteit van de verleende zorg is gevoerd.

      2 In het verslag geeft de zorgaanbieder tenminste aan:

      a. of en zo ja op welke wijze patiënten bij het kwaliteitsbeleid zijn betrokken;

      b. in geval van een zorginstelling: de frequentie waarmee en de wijze waarop binnen de zorginstelling
      kwaliteitsbeoordeling plaatsvond en het resultaat ervan;

      c. welk gevolg is gegeven aan klachten en meldingen over de kwaliteit van de verleende zorg.

      Afschrift van het verslag wordt gezonden aan Onze Minister en de Inspectie.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel12
  - number: '13'
    text: |-
      1 Indien het niveau van de zorg, verleend in bij algemene maatregel van bestuur aangewezen zorginstellingen, dit
      vereist, kunnen bij die algemene maatregel van bestuur regels worden gesteld met betrekking tot de uitvoering van
      de [artikelen 9][ref1] en [10][ref2].

      2 Indien de uitvoering van de [artikelen 9][ref3] en [10][ref4] overeenkomstig de op grond van het eerste lid
      gestelde regels niet blijkt te leiden tot verantwoorde zorg, kunnen bij algemene maatregel van bestuur tevens
      nadere regels worden gesteld met betrekking tot [artikel 8][ref5].


