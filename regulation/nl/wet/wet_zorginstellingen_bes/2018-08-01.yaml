        artikel: '26'
        hoofdstuk: '6'
  - number: '26'
    text: |-
      Een ieder die is betrokken bij de uitvoering van deze wet en daarbij de beschikking krijgt over gegevens waarvan
      hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde van
      ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot
      geheimhouding van die gegevens, behoudens voor zover enig wettelijk voorschrift hem tot mededeling verplicht of uit
      zijn taak de noodzaak tot mededeling voortvloeit.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel26
  - number: '27'
    text: |-
      Onze Minister zendt binnen vier jaar na het in werking treden van deze wet aan de Staten een verslag over de
      doeltreffendheid van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel27
  - number: '28'
    text: |-
      Bij algemene maatregel van bestuur kan, met betrekking tot daarbij aan te wijzen zorginstellingen worden bepaald,
      dat een of meer bepalingen van deze wet, al dan niet tijdelijk, niet van toepassing is of zullen zijn op die
      zorginstellingen.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel28
  - number: '30'
    text: |-
      Zorginstellingen waarvan de statuten, de inrichting of de structuur niet voldoen aan het bepaalde bij of krachtens
      deze wet, dragen zorg dat binnen ten hoogste zes maanden na het in werking treden van deze wet de vereiste
      aanpassingen worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0028734/2018-08-01#Artikel30
