  - number: '5'
    text: |-
      1 De subsidie voor de uitvoering van een 60 km-project bedraagt € 226,90 inclusief BTW per hele hectometer van de
      weglengte binnen een project.

      2 De subsidie voor de uitvoering van een 30 km-project bedraagt ten hoogste € 453,78 inclusief BTW per hele
      hectometer van de weglengte binnen een project, maar niet meer dan 40% van de projectkosten, gerekend over de
      gezamenlijke 30 km-projecten van de aanvrager.

      3 Als projectkosten worden uitsluitend in aanmerking genomen de kosten, bedoeld in
      [artikel 5, eerste lid, onderdelen e tot en met g en j van het besluit][ref1] met uitzondering van de kosten
      waarvoor reeds subsidie is verleend op grond van [paragraaf 2 tot en met 7 van het besluit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006264#Paragraaf2
