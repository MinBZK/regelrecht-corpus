  - number: '4'
    text: |-
      1 De subsidie per aanvrager bedraagt:

      a. voor de fiets- en bromfietsmaatregelen: € 22,69 inclusief BTW per hele hectometer weglengte;

      b. voor 30 - en 60 km-projecten: ten hoogste het in de aanvraag vermelde bedrag, met inachtneming van
      [artikel 5][ref1].

      2 Indien volledige toekenning van alle aanvragen van een categorie als bedoeld in
      [artikel 2, tweede en derde lid][ref2], zou leiden tot overschrijding van het subsidieplafond, wordt, in afwijking
      van het eerste lid, het subsidiebedrag dat ten hoogste aan een aanvrager wordt verleend als volgt bepaald:

      a. voor waterschappen: een aandeel van het bedrag, bedoeld in [artikel 3, eerste lid, onderdeel b][ref3], naar rato
      van de weglengte buiten de bebouwde kom.

      b. voor provincies en gemeenten: een aandeel van het bedrag, bedoeld in [artikel 3, eerste lid, onderdeel c][ref4],
      naar rato van de weglengte binnen de bebouwde kom.

      3 Aanvragen die het bedrag, bedoeld in de aanhef van het tweede lid, niet overschrijden, blijven bij de verdere
      berekening van de subsidiebedragen waarvoor de overige aanvragers ten hoogste in aanmerking komen, buiten
      beschouwing.

      4 Voor de berekening, bedoeld in het derde lid, wordt het tweede lid zo vaak toegepast tot het totale
      subsidiebedrag onder de resterende aanvragers is verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009505#Artikel2
