  - number: '6'
    text: |-
      1 Een subsidie-aanvraag voor het treffen van fiets- en bromfietsmaatregelen wordt uiterlijk 22 oktober 1998
      ingediend.

      2 Een subsidie-aanvraag voor de uitvoering van een 30 km- of 60 km-project wordt uiterlijk 31 december 1998
      ingediend.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel6
  - number: '7'
    text: |-
      1 1. Een aanvraag wordt ingediend bij de hoofdingenieur-directeur van de regionale directie van Directoraat-
      Generaal Rijkswaterstaat in de regio van de aanvrager met gebruikmaking van een bij deze verkrijgbaar formulier en
      gaat in ieder geval vergezeld van een opgave van de weglengte per 1 januari 1998 van de aanvrager, onderscheiden
      naar weglengte binnen- en buiten de bebouwde kom.

      2 Een aanvraag voor de uitvoering van een 30 km-project gaat tevens vergezeld van een raming van de totale
      projectkosten van omvorming, berekend volgens [artikel 5, derde lid][ref1], en een opgave van het aantal om te
      vormen hectometers.


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel5
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009505
        artikel: '5'
        paragraaf: '2'
  - number: '8'
    text: |-
      De minister beslist in ieder geval afwijzend op een aanvraag:

      a. indien de aanvraag niet tijdig is ingediend;

      b. indien de aanvrager in het kader van de aanvraag onjuiste of onvolledige gegevens heeft verstrekt en de
      verstrekking van deze gegevens tot een onjuiste beslissing op de aanvraag zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel8
  - number: '9'
    text: |-
      De minister beslist uiterlijk 1 mei 1999 over de aanvragen voor subsidieverlening, bedoeld in
      [artikel 2, tweede en derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel2
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009505
        artikel: '2'
        paragraaf: '1'
  - number: '10'
    text: |-
      1 De beschikking tot subsidieverlening bevat:

      a. een aanduiding van de aard van de projecten waarvoor de subsidie wordt verstrekt;

      b. het tijdvak waarin de projecten worden uitgevoerd; en

      c. het subsidiebedrag dat ten hoogste wordt verleend.

      2 De minister kan de subsidie-ontvanger bij de subsidieverlening verplichtingen opleggen die strekken tot
      verwezenlijking van het doel van de subsidie.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel10
  - number: '11'
    text: De minister stelt de subsidie voor het treffen van fiets- en bromfietsmaatregelen uiterlijk 1 november 1998 vast.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel11
  - number: '12'
    text: |-
      1 De minister stelt de subsidie voor een project als bedoeld in [artikel 2, tweede en derde lid][ref1], ambtshalve
      vast binnen zestien weken nadat de subsidie-ontvanger heeft voldaan aan [artikel 17][ref2]. Indien niet wordt
      voldaan aan [artikel 17][ref3] stelt de minister de subsidie ambtshalve uiterlijk 1 november 2003 vast.

      2 De subsidie wordt vastgesteld op basis van de weglengte binnen de gerealiseerde projecten en [artikel 5][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009505#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0009505#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0009505#Artikel5
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel12
