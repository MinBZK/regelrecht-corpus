preamble:
  text: |-
    Gelet op artikel 185, eerste lid, van de Provinciewet;

    Gelet op artikel 16 en 17 van de Financiële-verhoudingswet;

    Gelet op artikel 2, derde lid, van het Besluit Infrastructuurfonds;

    Gezien het convenant Startprogramma Duurzaam Veilig, gesloten op 15 december 1997 tussen Onze Minister van Verkeer
    en Waterstaat, het Interprovinciaal Overleg, de Vereniging van Nederlandse Gemeenten, en de Unie van Waterschappen.

    Besluit:
  url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
             minister:

              Minister van Verkeer en Waterstaat;



            b
             besluit:

              [Besluit Infrastructuurfonds][ref1];



            c
             de aanvrager:

              het bestuur van een gemeente, een provincie, of een waterschap dat op grond van deze regeling een aanvraag
      heeft ingediend;



            d
            30 km-project:

              project tot omvorming van wegen binnen de bebouwde kom en in beheer bij de aanvrager tot een gebied
      waarbinnen een maximumsnelheid van 30 kilometer per uur geldt, aangeduid met het verkeersbord A1 als bedoeld in
      [bijlage 1 bij het RVV 1990][ref2];



            e
             60 km-project:

              project tot omvorming van wegen buiten de bebouwde kom en in beheer bij de aanvrager tot een gebied
      waarbinnen een maximumsnelheid van 60 kilometer per uur geldt, aangeduid met het verkeersbord A1 als bedoeld in
      [bijlage 1 bij het RVV 1990][ref3];



            f
             fiets- en bromfietsmaatregelen:

              infrastructurele maatregelen tot aanpassing van wegen en verkeerstekens met het oog op wijzigingen in de
      nationale regelgeving op het punt van voorrang verlenen aan o.a. fietsers en bromfietsers en op het punt van het
      al dan niet toelaten van bromfietsers op fietspaden, waaronder het op bepaalde locaties systematisch regelen van
      de voorrang.



            g
             weglengte:

              lengte in hectometers van de wegen voorzien van een aaneengesloten verharde bovenlaag, in beheer bij de
      aanvrager, en waarop verkeer met motorvoertuigen op meer dan twee wielen is toegestaan, met dien verstande dat de
      lengte van een weg met gescheiden rijbanen is de lengte van één van de rijbanen.



            h
             bebouwde kom:

              gebied binnen de grenzen overeenkomstig [artikel 20a, eerste lid, van de Wegenverkeerswet 1994][ref4];



            i
             subsidieplafond:

              ten hoogste beschikbare bedrag als bedoeld in [artikel 4:22 van de Algemene wet bestuursrecht][ref5];



            j
            verkeersbesluit:

              besluit als bedoeld in [artikel 15 van de Wegenverkeerswet 1994][ref6], inhoudende het vaststellen van de
      maximumsnelheid in een gebied op 30 of 60 kilometer per uur.


