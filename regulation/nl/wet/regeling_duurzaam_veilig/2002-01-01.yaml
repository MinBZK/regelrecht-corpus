  - number: '18'
    text: |-
      De subsidie-ontvanger is verplicht medewerking te verlenen aan een onderzoek naar de rechtmatigheid van de
      besteding van de ontvangen subsidiegelden, verricht door de Minister van Verkeer en Waterstaat aan te wijzen
      personen.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel18
  - number: '19'
    text: |-
      1 Het subsidiebedrag wordt overeenkomstig de subsidievaststelling betaald, onder verrekening van de betaalde
      voorschotten.

      2 Het subsidiebedrag wordt binnen vier weken na de subsidievaststelling betaald, tenzij bij de subsidievaststelling
      anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel19
  - number: '20'
    text: |-
      Onverschuldigd betaalde subsidiebedragen en voorschotten kunnen binnen vier weken na de subsidievaststelling, of de
      wijziging of intrekking daarvan worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel20
  - number: '21'
    text: |-
      1 In het geval van een project als bedoeld in [artikel 2, tweede en derde lid][ref1] kan de minister op verzoek van
      een subsidie-ontvanger die voldaan heeft aan [artikel 15][ref2], een voorschot verstrekken ter hoogte van maximaal
      75% van het bedrag van de subsidieverlening.

      2 De minister wijst een verzoek als bedoeld in het eerste lid af, voorzover de subsidie-ontvanger niet heeft
      voldaan aan de aan de subsidie verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009505#Artikel15
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0009505
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009505
        artikel: '15'
        paragraaf: '5'
  - number: '22'
    text: |-
      1 Het voorschot wordt binnen vier weken na de voorschotverlening betaald, tenzij bij de voorschotverlening anders
      bepaald is.

      2 De minister schort de betaling van een voorschot op indien de beschikking tot voorschotverlening ten gevolge van
      aan de subsidie-ontvanger te wijten onjuistheid of onvolledigheid van gegevens anders luidde dan het geval zou zijn
      geweest indien de gegevens juist en volledig zouden zijn.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel22
  - number: '23'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel23
  - number: '24'
    text: 'Deze regeling wordt aangehaald als: Regeling duurzaam veilig.'
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel24
