  - number: '2'
    text: |-
      1 Provincies, gemeenten en waterschappen kunnen een aanvraag voor de vaststelling van een subsidie indienen voor
      het treffen van fiets- en bromfietsmaatregelen.

      2 Waterschappen kunnen een aanvraag voor de verlening van een subsidie indienen voor de uitvoering van een of meer
      60 km-projecten.

      3 Provincies en gemeenten kunnen een aanvraag voor de verlening van een subsidie indienen voor:

      a. de uitvoering van een of meer 30 km-projecten;

      b. de uitvoering van een of meer 60 km-projecten voorzover zich, naar het oordeel van de aanvrager, bijzonder
      verkeersonveilige situaties voordoen.

      4 Ten behoeve van een 30- of 60 km-project wordt slechts subsidie verstrekt voorzover:

      a. het een project betreft dat blijkens een verkeersbesluit wordt voltooid tussen 1 juli 1997 en 31 december 2002
      en waarvoor niet reeds subsidie is verleend op grond van [paragraaf 2 tot en met 7 van het besluit][ref1]; en

      b. het wegen betreft die op 1 juli 1997 reeds opengesteld waren voor verkeer met motorvoertuigen op meer dan twee
      wielen.


      [ref1]: https://wetten.overheid.nl/BWBR0006264#Paragraaf2
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel2
    references:
      - id: ref1
