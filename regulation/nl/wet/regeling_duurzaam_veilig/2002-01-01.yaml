        artikel: 4:48
  - number: '15'
    text: |-
      De subsidie-ontvanger, bedoeld in [artikel 2, tweede en derde lid][ref1], is verplicht uiterlijk

      31 december 1999 het volgende te overleggen aan de minister:

      a. een besluit inhoudende dat middelen uit de begroting worden bestemd voor de projecten waarvoor subsidie is
      verleend;

      b. een kaart van het wegennet waarop de begrenzing van de projecten is aangegeven;

      c. een opgave van de weglengte binnen de projecten; en

      d. een actuele raming van de projectkosten, bedoeld in [artikel 5, derde lid][ref2], van de 30 km-projecten.


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009505#Artikel5
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009505
        artikel: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0009505
        artikel: '5'
        paragraaf: '2'
  - number: '16'
    text: |-
      De subsidie-ontvanger doet onverwijld schriftelijk mededeling aan de minister van:

      a. intrekking of wijziging van een besluit als bedoeld in [artikel 15, onderdeel a][ref1];

      b. alle overige omstandigheden die van invloed kunnen zijn op de subsidie en een doelmatige aanwending daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel15
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel16
    references:
      - id: ref1
