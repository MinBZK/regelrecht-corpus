  - number: '3'
    text: |-
      1 Het subsidieplafond bedraagt in totaal € 88.487.142,00 waarvan:

      a. € 27.226.813,00 voor het treffen van maatregelen als bedoeld in [artikel 2, eerste lid][ref1];

      b. € 6.806.703,00 voor de uitvoering van projecten als bedoeld in [artikel 2, tweede lid][ref2];

      c. € 54.453.626,00 voor de uitvoering van projecten als bedoeld in [artikel 2, derde lid][ref3].

      2 De minister kan na 31 december 1998 een subsidieplafond als bedoeld in het eerste lid, onderdelen a tot en met c
      verhogen met het bedrag dat na behandeling van alle aanvragen resteert van een ander subsidieplafond.

      3 De minister doet hiervan mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009505#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009505#Artikel2
