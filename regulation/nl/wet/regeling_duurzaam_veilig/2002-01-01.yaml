        artikel: '15'
        paragraaf: '5'
  - number: '17'
    text: |-
      1 De subsidie-ontvanger, bedoeld in [artikel 2, tweede en derde lid][ref1], is verplicht uiterlijk 1 september 2003
      verantwoording aan de minister te overleggen, waarin het volgende is opgenomen:

      a. een opgave van de gerealiseerde 30- of 60 km-projecten waarvoor door de minister een beschikking tot
      subsidieverlening is afgegeven en die voldoen aan de eisen gesteld in [artikel 2, vierde lid][ref2], en
      [13, onderdeel a][ref3];

      b. een opgave van de weglengte in hele hectometers binnen de projecten, bedoeld in onderdeel a;

      c. een opgave van de projectkosten van de in onderdeel a bedoelde 30 km-projecten, met inachtneming van
      [artikel 5, derde lid][ref4].

      2 De verantwoording gaat vergezeld van een accountantsverklaring waarin duidelijk wordt aangegeven of de
      verantwoording voldoet aan de eisen gesteld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009505#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009505#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0009505#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009505#Artikel5
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel17
