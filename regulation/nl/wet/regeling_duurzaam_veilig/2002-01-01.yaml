  - number: '13'
    text: |-
      De beschikking tot subsidievaststelling bevat:

      a. een aanduiding van de aard van de maatregelen of projecten waarvoor de subsidie wordt verstrekt; en

      b. het bedrag waarop de subsidie wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel13
  - number: '14'
    text: |-
      De [artikelen 4:46][ref1] en [4:47, onder c][ref2], en de
      [artikelen 4:48 tot en met 4:50 van de Algemene wet bestuursrecht][ref3] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel446
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel447
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel448
    url: https://wetten.overheid.nl/BWBR0009505/2002-01-01#Artikel14
