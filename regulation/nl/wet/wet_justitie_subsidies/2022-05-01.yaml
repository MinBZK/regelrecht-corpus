  - number: 48h
    text: |-
      1 De subsidie aan het Halt-bureau bedraagt de som van de kosten van iedere in dat jaar uitgevoerde Halt-afdoening
      en de kosten voor de reguliere bedrijfsvoering van het Halt-bureau.

      2 Onze Minister kan bij de verlening van de subsidie bepalen dat het subsidiebedrag van de subsidie door hem in de
      loop van het boekjaar kan worden bijgesteld in verband met de ontwikkeling van het loon- en prijspeil.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48h
  - number: 48i
    text: |-
      1 Het Halt-bureau verstrekt aan Onze Minister uiterlijk vier weken na het eind van ieder boekjaar een opgave van
      het aantal afdoeningen, uitgesplitst naar de onderscheiden Halt-modules.

      2 Bij ministeriële regeling kan worden bepaald welke andere verplichtingen aan de subsidieverlening zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48i
  - number: 48j
    text: |-
      1 Indien bij de vaststelling van de subsidie blijkt dat het definitieve aantal afdoeningen meer bedraagt dan 105
      procent van de raming, vindt een door Onze Minister te bepalen verhoging plaats van de subsidie.

      2 Indien bij de vaststelling van de subsidie blijkt dat het definitieve aantal afdoeningen minder bedraagt dan 95
      procent van de raming, vindt een door Onze Minister te bepalen verlaging plaats van de subsidie.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48j
  - number: 48k
    text: |-
      Het Halt-bureau behoeft de toestemming van Onze Minister voor de handelingen, bedoeld in
      [artikel 4:71 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel471
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48k
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:71
  - number: 48l
    text: |-
      1 Het Halt-bureau kan een egalisatiereserve vormen als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1].

      2 Bij ministeriële regeling worden de maximale hoogte van de jaarlijkse toevoeging en de maximale omvang van de
      egalisatiereserve bepaald en kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel472
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48l
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:72
  - number: 48m
    text: |-
      Indien het Halt-bureau zaken ter beschikking stelt aan of diensten verricht voor natuurlijke personen of
      rechtspersonen, brengt zij een vergoeding in rekening die tenminste kostendekkend is.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48m
  - number: 48r
    text: |-
      Onze Minister kan subsidies verstrekken ten behoeve van activiteiten inzake openbare orde en veiligheid die gericht
      zijn op:

      a. het verminderen van de gelegenheid tot het plegen van strafbare feiten;

      b. het vergroten van de kennis en het inzicht in veiligheidsvraagstukken, alsmede het verder ontwikkelen van
      integraal veiligheidsbeleid;

      c. het vergroten van de veiligheid in de samenleving in het algemeen, waaronder de handhaving van de openbare orde;

      d. het ondersteunen van bijzondere activiteiten ten behoeve van de politie, brandweer en de
      rampenbestrijdingsorganisaties.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48r
  - number: 48s
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen de activiteiten, bedoeld in
      [artikel 48r][ref1], nader worden bepaald, alsmede criteria voor de verstrekking worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel48r
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48s
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: 48r
        hoofdstuk: 4E
  - number: 48t
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen voor subsidies die verstrekt
      worden op grond van [artikel 48r][ref1] regels worden gesteld met betrekking tot:

      a. de aanvraag van een subsidie en de besluitvorming daarover;

      b. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      c. de voorwaarden waaronder subsidie wordt verleend;

      d. de aan de subsidie verbonden verplichtingen of te verbinden verplichtingen;

      e. de vaststelling van de subsidie;

      f. intrekking en wijziging van de subsidieverlening of subsidievaststelling;

      g. de betaling van de subsidie en het verlenen van voorschotten;

      h. het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel48r
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel424
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48t
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: 48r
        hoofdstuk: 4E
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:24
  - number: 48u
    text: |-
      1 Onze Minister kan subsidie verstrekken aan een rechtspersoon voor:

      a. de instandhouding van een expertisecentrum dat gespecialiseerd is in zaken op het gebied van parentale
      internationale kinderontvoering;

      b. overige activiteiten op het gebied van parentale internationale kinderontvoering.

      2 Op een subsidie als bedoeld in het eerste lid, aanhef en onder a, is
      [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] van toepassing.

      3 Onze Minister kan een subsidieplafond vaststellen voor activiteiten als bedoeld in het eerste lid, aanhef en
      onder b. Hij bepaalt daarbij hoe het beschikbare bedrag wordt verdeeld.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48u
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48v
    text: |-
      1 Onze Minister kan aan een rechtspersoon als bedoeld in [artikel 256][ref1], en aan een
      rechtspersoon als bedoeld in [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2],
      subsidie verstrekken ten behoeve van de kosten van de uitoefening van de in die bepalingen en in
      [artikel 241, zevende lid, van Boek 1 van het Burgerlijk Wetboek][ref3] bedoelde taken, bijzondere door Onze
      Minister aan te geven kosten daaronder begrepen.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het **verlenen van deze subsidie.**


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel241
