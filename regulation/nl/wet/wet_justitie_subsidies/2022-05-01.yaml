preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verstrekking van subsidies door Onze Minister van
    Justitie wettelijk te regelen alsook enkele wetten aan te passen in verband met de bepalingen over subsidies in de
    derde tranche van de Algemene wet bestuursrecht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Veiligheid
      en Justitie.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel1
  - number: '2'
    text: |-
      Dit hoofdstuk is slechts van toepassing op subsidies die door Onze Minister worden verstrekt en die:

      a. op deze wet berusten, of

      b. niet op een wettelijk voorschrift berusten.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel2
  - number: '3'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel434
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:34
  - number: '4'
    text: |-
      Indien Onze Minister subsidie verstrekt voor activiteiten die mede door andere bestuursorganen worden
      gesubsidieerd, kan Onze Minister afwijken van de bij of krachtens deze wet aan de subsidie verbonden
      verplichtingen, voor zover

      a. dit wenselijk is met het oog op een goede afstemming met de door die andere bestuursorganen opgelegde
      verplichtingen, en

      b. daardoor het belang met het oog waarop die verplichtingen zijn opgelegd, niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel4
  - number: '5'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet of de [Algemene wet bestuursrecht][ref1] aan de
      subsidie-ontvanger opgelegde verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen.

      2 De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref2] en
      [5:19 van de Algemene wet bestuursrecht][ref3].

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      4 Aan door Onze Minister verstrekte subsidies is de verplichting verbonden dat de subsidie-ontvanger aan een
      toezichthouder alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn
      bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref3
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '6'
    text: |-
      In dit hoofdstuk wordt verstaan onder slachtofferhulp:

      a. de opvang en ondersteuning van slachtoffers en nabestaanden van vermoedelijke strafbare feiten, bestaande uit:

      1°. juridische ondersteuning;

      2°. praktische ondersteuning;

      3°. kortdurende emotionele ondersteuning;

      4°. doorverwijzing naar niet in het bijzonder voor slachtoffers bedoelde hulpverleningsinstellingen;

      b. activiteiten ter verbetering van de positie van het slachtoffer.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister wijst een rechtspersoon aan, die is belast met de taken, bedoeld in [artikel 6][ref1].

      2 Van de aanwijzing door Onze Minister wordt mededeling gedaan in de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel6
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '1'
  - number: 7a
    text: |-
      De rechtspersoon behoeft de toestemming van Onze Minister voor de handelingen, bedoeld in
      [artikel 4:71, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel471
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:71
  - number: '8'
    text: |-
      1 Onze Minister verstrekt per boekjaar subsidie aan de rechtspersoon voor de werkzaamheden die door de
      rechtspersoon of onder zijn verantwoordelijkheid worden verricht.

      2 [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:

      a. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      b. de aanvraag van een subsidie en de besluitvorming daarover;

      c. de vaststelling van de subsidie;

      d. intrekking of wijziging van de subsidie;

      e. verplichtingen van de subsidieontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '9'
    text: Onze Minister kan subsidie verstrekken voor bijzondere projecten op het terrein van slachtofferhulp.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel9
  - number: '10'
    text: |-
      1 De rechtspersoon vormt een egalisatiereserve als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel472
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:72
  - number: '11'
    text: |-
      1 Indien de rechtspersoon zaken ter beschikking stelt aan of diensten verricht voor natuurlijke personen of
      rechtspersonen, die niet de ondersteuning van de rechtspersoon ten doel hebben, brengt zij een vergoeding in
      rekening die tenminste kostendekkend is.

      2 Indien aan de rechtspersoon zaken ter beschikking worden gesteld door een andere rechtspersoon die de
      ondersteuning van de rechtspersoon ten doel heeft, betaalt zij aan deze rechtspersoon geen hogere vergoeding
      dan het bedrag dat ter zake op grond van de historische kostprijs en rekening houdende met de voor de instelling
      geldende afschrijvingspercentages in redelijkheid in rekening kan worden gebracht.

      3 Indien voor de rechtspersoon diensten worden verricht door een andere rechtspersoon, die de ondersteuning van de
      rechtspersoon ten doel heeft en welke in het algemeen in eigen beheer worden verricht, betaalt de rechtspersoon aan
      de andere rechtspersoon geen hogere vergoeding dan het bedrag dat het verrichten van de diensten in eigen beheer
      zou hebben gekost.

      4 De rechtspersoon verstrekt desgevraagd aan Onze Minister een beschrijving van de tussen deze rechtspersoon en
      andere rechtspersonen bestaande organisatorische dan wel financiële banden alsmede van zodanig nog in het leven te
      roepen of te wijzigen banden, voor zover deze banden van invloed kunnen zijn op de bepaling van de vergoedingen,
      bedoeld in het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel11
  - number: '12'
    text: |-
      1 Onze Minister kan subsidie verstrekken aan de rechtspersoon die is belast met de bemiddeling tussen de verdachte
      en het slachtoffer, bedoeld in [artikel 51h, van het Wetboek van Strafvordering][ref1].

      2 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51h
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51h
  - number: '13'
    text: |-
      1 Bij het onderzoek, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1], onderzoekt de accountant
      tevens de naleving van de aan de subsidie verbonden verplichtingen.

      2 Onze Minister stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref2], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel478
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel479
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:78
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:79
  - number: '15'
    text: |-
      1 In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], legt Onze
      Minister een volledige vergoedingsplicht op.

      2 Bij de vaststelling van de hoogte van de vergoeding worden de activa gewaardeerd op hun actuele waarde. De
      waardebepaling van een onroerende zaak geschiedt door drie deskundigen. Onze Minister onderscheidenlijk de
      subsidie-ontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.

      3 Het eerste lid is niet van toepassing, indien de activiteiten van de subsidie-ontvanger door een derde worden
      voortgezet en de activa en passiva met toestemming van Onze Minister tegen boekwaarde aan die derde worden
      overgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '32'
    text: |-
      In dit hoofdstuk wordt verstaan onder:

        - *criminaliteitspreventie:* activiteiten gericht op: a. het weerhouden van potentiële plegers van strafbare
      feiten van het plegen of opnieuw plegen daarvan; b. het verminderen van de gelegenheid tot het plegen van strafbare
      feiten, of c. het voorkomen van slachtofferschap.
        - *vrijwilligerswerk bij de sanctietoepassing:* activiteiten verricht door vrijwilligers ten behoeve van
      (ex-)justitieel ingeslotenen, gericht op reïntegratie van de (ex-)justitieel ingeslotenen in de samenleving.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel32
  - number: '33'
    text: |-
      1 Onze Minister kan subsidie verstrekken ten behoeve van de instandhouding van rechtspersonen die zich
      bezighouden met criminaliteitspreventie, het voorkomen van terrorisme, nazorg of vrijwilligersactiviteiten bij
      de sanctietoepassing.

      2 [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.

      3 De [artikelen 13][ref2] en [15][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008121#Artikel15
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
      - id: ref2
        bwb_id: BWBR0008121
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0008121
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '34'
    text: |-
      Onze Minister kan subsidies verstrekken voor activiteiten op het gebied van criminaliteitspreventie, het voorkomen
      van terrorisme, nazorg en vrijwilligersactiviteiten bij de sanctietoepassing, waarbij:

      a. de activiteiten worden bevorderd die effectief zijn gebleken;

      b. activiteiten op dit gebied worden ontwikkeld of

      c. de activiteiten zijn gericht op deskundigheidsbevordering.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel34
  - number: '35'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld omtrent de subsidies, bedoeld in [artikel 34][ref1].

      2 Deze regels kunnen in ieder geval betreffen:

      a. een uitwerking van de activiteiten, genoemd in [artikel 32][ref2], die voor subsidie in aanmerking komen, en

      b. een nadere omschrijving van aan de subsidie verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel32
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '34'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0008121
        artikel: '32'
        hoofdstuk: '3'
  - number: '36'
    text: |-
      Onze Minister kan een subsidieplafond vaststellen voor subsidies als bedoeld in [artikel 34][ref1]. Hij bepaalt
      daarbij hoe het beschikbare bedrag wordt verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel34
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '34'
        hoofdstuk: '3'
  - number: '38'
    text: |-
      Onze Minister kan subsidie verstrekken voor onderzoek dat naar verwachting van belang is voor de vorming, toetsing
      of uitvoering van het beleid waarvoor hij verantwoordelijkheid draagt.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel38
  - number: '39'
    text: |-
      Onze Minister stelt binnen een jaar na de inwerkingtreding van deze wet en vervolgens om de twee jaren,
      beleidsregels vast met betrekking tot het onderzoek waarvoor in die periode subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel39
  - number: '40'
    text: |-
      1 De subsidie bedraagt ten hoogste de kosten van het onderzoek.

      2 Bij ministeriële regeling kunnen regels worden gesteld omtrent:

      a. de kosten die voor subsidie in aanmerking komen;

      b. de wijze waarop bepaalde kosten worden berekend;

      c. de subsidie die voor bepaalde kosten ten hoogste kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel40
  - number: '41'
    text: |-
      De subsidie wordt slechts verstrekt indien het onderzoeksvoorstel:

      a. past binnen de beleidsregels;

      b. van voldoende wetenschappelijke kwaliteit is, en

      c. mede gelet op de beschikbare financiële middelen, voldoende relevant is voor het beleid van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel41
  - number: '42'
    text: De aanvraag tot verlening van de subsidie wordt uiterlijk acht weken voor de aanvang van het onderzoek ingediend.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel42
  - number: '43'
    text: |-
      1 De aanvraag omvat tenminste:

      a. een onderzoeksplan, en

      b. een begroting.

      2 De aanvraag vermeldt voorts in ieder geval:

      a. de samenstelling van een eventueel samenwerkingsverband waarin het onderzoek wordt uitgevoerd,

      b. de instelling die de personele en financiële verantwoordelijkheid draagt voor de uitvoering van het onderzoek,
      en

      c. de stand van zaken met betrekking tot de beoordeling van eventuele aanvragen om subsidie bij een of meer andere
      bestuursorganen of organen van internationale organisaties, welke dezelfde begrote uitgaven betreffen.

      3 Bij ministeriële regeling worden regels gesteld over de eisen waaraan een onderzoeksplan en een begroting moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel43
  - number: '44'
    text: Onze Minister beslist binnen dertien weken op de aanvraag tot verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel44
  - number: '45'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van het onderzoek.

      2 Deze regels kunnen in ieder geval betreffen:

      a. de eisen die worden gesteld aan de leiding, begeleiding en verrichting van het onderzoek;

      b. de instelling van een begeleidingscommissie en de vertegenwoordiging van Onze Minister in die commissie;

      c. de rapportage;

      d. de publikatie van de onderzoeksresultaten;

      e. de eigendom, het gebruik en de opslag van onderzoeksmateriaal.

      3 De regels, bedoeld in het eerste lid, betreffen niet de uitkomsten van het onderzoek.

      4 Onze Minister maakt, onverminderd [artikel 5.1 van de Wet open overheid][ref1], de onderzoeksresultaten zo
      spoedig mogelijk openbaar, maar in ieder geval binnen zes maanden na de aanbieding ervan aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0045754#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0045754
        artikel: '5.1'
  - number: '46'
    text: |-
      1 De subsidie-ontvanger en alle bij de uitvoering van het onderzoek betrokken personen zijn verplicht tot
      geheimhouding van in het kader van het onderzoek verkregen persoonsgegevens of andere gegevens met een
      vertrouwelijk karakter.

      2 Persoonsgegevens als bedoeld in het eerste lid worden slechts gebruikt voor het onderzoek waarvoor subsidie is
      verleend, tenzij Onze Minister of degene die de gegevens heeft verstrekt toestemming geeft voor gebruik ten behoeve
      van ander onderzoek.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel46
  - number: '48'
    text: |-
      1 De aanvraag tot vaststelling van de subsidie wordt binnen dertien weken na afloop van de periode waarvoor
      subsidie is verleend, dan wel binnen dertien weken na de rapportage over het onderzoek ingediend.

      2 Onze Minister beslist binnen dertien weken op de aanvraag tot vaststelling.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48
  - number: 48a
    text: |-
      1 Onze Minister kan subsidie verstrekken ten behoeve van activiteiten inzake immigratie en asiel.

      2 [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.

      3 Onze Minister kan een subsidieplafond vaststellen. Hij bepaalt daarbij hoe het beschikbare bedrag wordt verdeeld.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48c
    text: |-
      1 Onze Minister kan subsidie verstrekken ten behoeve van:

      a. het optreden als bewindvoerder als bedoeld in [artikel 287, derde lid, van de Faillissementswet][ref1];

      b. activiteiten ter ondersteuning van bewindvoerders.

      2 De subsidies worden per boekjaar verstrekt.

      3 [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref2] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel287
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '287'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48d
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de personen of instellingen waaraan de subsidies kunnen worden verstrekt;

      b. de wijze waarop het bedrag van de subsidies wordt bepaald;

      c. de aan de subsidies voor de ontvanger verbonden verplichtingen voorzover niet reeds voortvloeiend uit de
      [derde titel van de Faillissementswet][ref1];

      d. de verlening van voorschotten;

      e. de vaststelling en verdeling van een of meer subsidieplafonds.

      2 Indien de subsidie wordt verstrekt aan een rechtspersoon die krachtens publiekrecht is ingesteld, is, in
      afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref2], [titel 4.2 van die wet][ref3]
      van toepassing.

      3 Onze Minister stelt een commissie van deskundigen in. De commissie heeft een tijdelijk karakter. De commissie
      adviseert over de uitvoering van de [derde titel van de Faillissementswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001860
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel421
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0001860
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:21
      - id: ref3
        bwb_id: BWBR0005537
      - id: ref4
        bwb_id: BWBR0001860
  - number: 48e
    text: |-
      1 Onze Minister verstrekt per boekjaar subsidie aan een reclasseringsinstelling of een samenwerkingsverband van
      reclasseringsinstellingen voor de uitvoering van reclasseringswerkzaamheden.

      2 [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48f
    text: |-
      In dit hoofdstuk wordt verstaan onder:

      a. Halt-afdoening: een afdoening als bedoeld in [artikel 77e van het Wetboek van Strafrecht][ref1].

      b. Jeugdige: een verdachte in de leeftijd vanaf 12 tot en met 17 jaar.

      c. Halt-bureau: een door Onze Minister aangewezen rechtspersoon die in elk geval voorziet in de coördinatie en
      uitvoering van Halt-afdoeningen;

      d. Halt-module: onderdeel van een Halt-afdoening.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77e
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77e
  - number: 48g
    text: |-
      1 Onze Minister verstrekt per boekjaar subsidie aan het Halt-bureau.

      2 Bij ministeriële regeling kunnen eisen worden gesteld aan het aanwijzen van een Halt-bureau en kan worden bepaald
      in welke gevallen de aanwijzing wordt opgeschort of ingetrokken.

      3 [Afdeling 4.2.8. van de Algemene wet bestuursrecht][ref1] is van toepassing.

      4 De [artikelen 11][ref2], [13][ref3] en [15][ref4] zijn van overeenkomstige toepassing.

      5 Het Halt-bureau dient binnen dertien weken na afloop van het boekjaar een aanvraag tot vaststelling van de
      subsidie in.

      6 Hetgeen bij en krachtens de [artikelen 4.1.1, tweede lid, eerste volzin][ref5], juncto
      [4.1.5, eerste lid, van de Jeugdwet][ref6] is bepaald ten aanzien van jeugdhulpaanbieders, is voor wat betreft de
      verantwoordelijkheidstoedeling van overeenkomstige toepassing op het Halt-bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0008121#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0008121#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0034925#Artikel4.1.1
      [ref6]: https://wetten.overheid.nl/BWBR0034925#Artikel4.1.5
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel48g
