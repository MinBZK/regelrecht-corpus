  - number: '56'
    text: |-
      Deze wet is niet van toepassing op subsidies die voor de inwerkingtreding van deze wet zijn verleend of
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel56
  - number: '57'
    text: |-
      Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister van Justitie de in deze wet voorkomende
      aanhalingen van de artikelen en afdelingen van de [Algemene wet bestuursrecht][ref1] met de nieuwe nummering van de
      [Algemene wet bestuursrecht][ref2] in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008121/2022-05-01#Artikel57
    references:
