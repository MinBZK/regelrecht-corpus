  - number: '49'
    text: |-
      1 [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing op door Onze Minister per boekjaar
      verstrekte subsidies die niet op een wettelijk voorschrift berusten.

      2 De [artikelen 13][ref2] en [15][ref3] zijn van overeenkomstige toepassing.

      3 Onze Minister kan vrijstelling of ontheffing verlenen van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
