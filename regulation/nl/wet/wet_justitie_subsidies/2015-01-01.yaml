---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_justitie_subsidies
regulatory_layer: WET
publication_date: '2020-06-17'
valid_from: '2015-01-01'
bwb_id: BWBR0008121
url: https://wetten.overheid.nl/BWBR0008121/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de verstrekking van subsidies door Onze Minister van
    Justitie wettelijk te regelen alsook enkele wetten aan te passen in verband met de bepalingen over subsidies in de
    derde tranche van de Algemene wet bestuursrecht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Veiligheid
      en Justitie.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel1
  - number: '2'
    text: 'Dit hoofdstuk is slechts van toepassing op subsidies die door Onze Minister worden verstrekt en die:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel2
  - number: 2.a
    text: op deze wet berusten, of
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel2
  - number: 2.b
    text: niet op een wettelijk voorschrift berusten.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel2
  - number: '3'
    text: |-
      Een subsidie ten laste van een begroting die nog niet is vastgesteld wordt verleend onder de voorwaarde, bedoeld in
      [artikel 4:34, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '4'
    text: |-
      Indien Onze Minister subsidie verstrekt voor activiteiten die mede door andere bestuursorganen worden
      gesubsidieerd, kan Onze Minister afwijken van de bij of krachtens deze wet aan de subsidie verbonden
      verplichtingen, voor zover
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel4
  - number: 4.a
    text: |-
      dit wenselijk is met het oog op een goede afstemming met de door die andere bestuursorganen opgelegde
      verplichtingen, en
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel4
  - number: 4.b
    text: daardoor het belang met het oog waarop die verplichtingen zijn opgelegd, niet onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel4
  - number: '5.1'
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet of de [Algemene wet bestuursrecht][ref1] aan de
      subsidie-ontvanger opgelegde verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '5.2'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '5.3'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel5
  - number: '5.4'
    text: |-
      Aan door Onze Minister verstrekte subsidies is de verplichting verbonden dat de subsidie-ontvanger aan een
      toezichthouder alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel5
  - number: '6'
    text: 'In dit hoofdstuk wordt verstaan onder slachtofferhulp:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel6
  - number: 6.a
    text: 'de opvang en ondersteuning van slachtoffers en nabestaanden van vermoedelijke strafbare feiten, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel6
  - number: 6.a.1°
    text: juridische ondersteuning;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel6
  - number: 6.a.2°
    text: praktische ondersteuning;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel6
  - number: 6.a.3°
    text: kortdurende emotionele ondersteuning;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel6
  - number: 6.a.4°
    text: doorverwijzing naar niet in het bijzonder voor slachtoffers bedoelde hulpverleningsinstellingen;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel6
  - number: 6.b
    text: activiteiten ter verbetering van de positie van het slachtoffer.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel6
  - number: '7.1'
    text: |-
      Onze Minister wijst een rechtspersoon aan, die is belast met de taken, bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel6
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '6'
        hoofdstuk: '2'
        afdeling: '1'
  - number: '7.2'
    text: Van de aanwijzing door Onze Minister wordt mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel7
  - number: 7a
    text: |-
      De rechtspersoon behoeft de toestemming van Onze Minister voor de handelingen, bedoeld in
      [artikel 4:71, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.1'
    text: |-
      Onze Minister verstrekt per boekjaar subsidie aan de rechtspersoon voor de werkzaamheden die door de rechtspersoon
      of onder zijn verantwoordelijkheid worden verricht.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
  - number: '8.2'
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '8.3'
    text: 'Bij ministeriële regeling kunnen nadere regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
  - number: 8.3.a
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
  - number: 8.3.b
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
  - number: 8.3.c
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
  - number: 8.3.d
    text: intrekking of wijziging van de subsidie;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
  - number: 8.3.e
    text: verplichtingen van de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel8
  - number: '9'
    text: Onze Minister kan subsidie verstrekken voor bijzondere projecten op het terrein van slachtofferhulp.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel9
  - number: '10.1'
    text: |-
      De rechtspersoon vormt een egalisatiereserve als bedoeld in [artikel 4:72 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien de rechtspersoon zaken ter beschikking stelt aan of diensten verricht voor natuurlijke personen of
      rechtspersonen, die niet de ondersteuning van de rechtspersoon ten doel hebben, brengt zij een vergoeding in
      rekening die tenminste kostendekkend is.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel11
  - number: '11.2'
    text: |-
      Indien aan de rechtspersoon zaken ter beschikking worden gesteld door een andere rechtspersoon die de ondersteuning
      van de rechtspersoon ten doel heeft, betaalt zij aan deze rechtspersoon geen hogere vergoeding dan het bedrag
      dat ter zake op grond van de historische kostprijs en rekening houdende met de voor de instelling geldende
      afschrijvingspercentages in redelijkheid in rekening kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien voor de rechtspersoon diensten worden verricht door een andere rechtspersoon, die de ondersteuning van de
      rechtspersoon ten doel heeft en welke in het algemeen in eigen beheer worden verricht, betaalt de rechtspersoon aan
      de andere rechtspersoon geen hogere vergoeding dan het bedrag dat het verrichten van de diensten in eigen beheer
      zou hebben gekost.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel11
  - number: '11.4'
    text: |-
      De rechtspersoon verstrekt desgevraagd aan Onze Minister een beschrijving van de tussen deze rechtspersoon en
      andere rechtspersonen bestaande organisatorische dan wel financiële banden alsmede van zodanig nog in het leven te
      roepen of te wijzigen banden, voor zover deze banden van invloed kunnen zijn op de bepaling van de vergoedingen,
      bedoeld in het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel11
  - number: '12.1'
    text: |-
      Onze Minister kan subsidie verstrekken aan de rechtspersoon die is belast met de bemiddeling tussen de verdachte en
      het slachtoffer, bedoeld in [artikel 51h, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel51h
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 51h
  - number: '12.2'
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel12
  - number: '13.1'
    text: |-
      Bij het onderzoek, bedoeld in [artikel 4:78 van de Algemene wet bestuursrecht][ref1], onderzoekt de accountant
      tevens de naleving van de aan de subsidie verbonden verplichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '13.2'
    text: |-
      Onze Minister stelt een aanwijzing over de reikwijdte en de intensiteit van de controle, als bedoeld in
      [artikel 4:79, tweede lid, van de Algemene wet bestuursrecht][ref1], vast.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '15.1'
    text: |-
      In de gevallen, bedoeld in [artikel 4:41, tweede lid, van de Algemene wet bestuursrecht][ref1], legt Onze Minister
      een volledige vergoedingsplicht op.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '15.2'
    text: |-
      Bij de vaststelling van de hoogte van de vergoeding worden de activa gewaardeerd op hun actuele waarde. De
      waardebepaling van een onroerende zaak geschiedt door drie deskundigen. Onze Minister onderscheidenlijk de
      subsidie-ontvanger wijzen elk een deskundige aan, die in onderling overleg een derde deskundige aanwijzen.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel15
  - number: '15.3'
    text: |-
      Het eerste lid is niet van toepassing, indien de activiteiten van de subsidie-ontvanger door een derde worden
      voortgezet en de activa en passiva met toestemming van Onze Minister tegen boekwaarde aan die derde worden
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel15
  - number: '32'
    text: |-
      In dit hoofdstuk wordt verstaan onder: - *criminaliteitspreventie:* activiteiten gericht op: a. het weerhouden
      van potentiële plegers van strafbare feiten van het plegen of opnieuw plegen daarvan; b. het verminderen van de
      gelegenheid tot het plegen van strafbare feiten, of c. het voorkomen van slachtofferschap.
        - *vrijwilligerswerk bij de sanctietoepassing:* activiteiten verricht door vrijwilligers ten behoeve van
      (ex-)justitieel ingeslotenen, gericht op reïntegratie van de (ex-)justitieel ingeslotenen in de samenleving.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel32
  - number: '33.1'
    text: |-
      Onze Minister kan subsidie verstrekken ten behoeve van de instandhouding van rechtspersonen die zich bezighouden
      met criminaliteitspreventie, het voorkomen van terrorisme, nazorg of vrijwilligersactiviteiten bij de
      sanctietoepassing.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel33
  - number: '33.2'
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '33.3'
    text: |-
      De [artikelen 13][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel15
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008121
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '34'
    text: |-
      Onze Minister kan subsidies verstrekken voor activiteiten op het gebied van criminaliteitspreventie, het voorkomen
      van terrorisme, nazorg en vrijwilligersactiviteiten bij de sanctietoepassing, waarbij:
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel34
  - number: 34.a
    text: de activiteiten worden bevorderd die effectief zijn gebleken;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel34
  - number: 34.b
    text: activiteiten op dit gebied worden ontwikkeld of
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel34
  - number: 34.c
    text: de activiteiten zijn gericht op deskundigheidsbevordering.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel34
  - number: '35.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de subsidies, bedoeld in [artikel 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel34
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '34'
        hoofdstuk: '3'
  - number: '35.2'
    text: 'Deze regels kunnen in ieder geval betreffen:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel35
  - number: 35.2.a
    text: |-
      een uitwerking van de activiteiten, genoemd in [artikel 32][ref1], die voor subsidie in aanmerking komen, en


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel32
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '32'
        hoofdstuk: '3'
  - number: 35.2.b
    text: een nadere omschrijving van aan de subsidie verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel35
  - number: '36'
    text: |-
      Onze Minister kan een subsidieplafond vaststellen voor subsidies als bedoeld in [artikel 34][ref1]. Hij bepaalt
      daarbij hoe het beschikbare bedrag wordt verdeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel34
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '34'
        hoofdstuk: '3'
  - number: '38'
    text: |-
      Onze Minister kan subsidie verstrekken voor onderzoek dat naar verwachting van belang is voor de vorming, toetsing
      of uitvoering van het beleid waarvoor hij verantwoordelijkheid draagt.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel38
  - number: '39'
    text: |-
      Onze Minister stelt binnen een jaar na de inwerkingtreding van deze wet en vervolgens om de twee jaren,
      beleidsregels vast met betrekking tot het onderzoek waarvoor in die periode subsidie kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel39
  - number: '40.1'
    text: De subsidie bedraagt ten hoogste de kosten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel40
  - number: '40.2'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel40
  - number: 40.2.a
    text: de kosten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel40
  - number: 40.2.b
    text: de wijze waarop bepaalde kosten worden berekend;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel40
  - number: 40.2.c
    text: de subsidie die voor bepaalde kosten ten hoogste kan worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel40
  - number: '41'
    text: 'De subsidie wordt slechts verstrekt indien het onderzoeksvoorstel:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel41
  - number: 41.a
    text: past binnen de beleidsregels;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel41
  - number: 41.b
    text: van voldoende wetenschappelijke kwaliteit is, en
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel41
  - number: 41.c
    text: mede gelet op de beschikbare financiële middelen, voldoende relevant is voor het beleid van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel41
  - number: '42'
    text: De aanvraag tot verlening van de subsidie wordt uiterlijk acht weken voor de aanvang van het onderzoek ingediend.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel42
  - number: '43.1'
    text: 'De aanvraag omvat tenminste:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: 43.1.a
    text: een onderzoeksplan, en
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: 43.1.b
    text: een begroting.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: '43.2'
    text: 'De aanvraag vermeldt voorts in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: 43.2.a
    text: de samenstelling van een eventueel samenwerkingsverband waarin het onderzoek wordt uitgevoerd,
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: 43.2.b
    text: de instelling die de personele en financiële verantwoordelijkheid draagt voor de uitvoering van het onderzoek, en
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: 43.2.c
    text: |-
      de stand van zaken met betrekking tot de beoordeling van eventuele aanvragen om subsidie bij een of meer andere
      bestuursorganen of organen van internationale organisaties, welke dezelfde begrote uitgaven betreffen.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: '43.3'
    text: |-
      Bij ministeriële regeling worden regels gesteld over de eisen waaraan een onderzoeksplan en een begroting moeten
      voldoen.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel43
  - number: '44'
    text: Onze Minister beslist binnen dertien weken op de aanvraag tot verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel44
  - number: '45.1'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de uitvoering van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: '45.2'
    text: 'Deze regels kunnen in ieder geval betreffen:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: 45.2.a
    text: de eisen die worden gesteld aan de leiding, begeleiding en verrichting van het onderzoek;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: 45.2.b
    text: de instelling van een begeleidingscommissie en de vertegenwoordiging van Onze Minister in die commissie;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: 45.2.c
    text: de rapportage;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: 45.2.d
    text: de publikatie van de onderzoeksresultaten;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: 45.2.e
    text: de eigendom, het gebruik en de opslag van onderzoeksmateriaal.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: '45.3'
    text: De regels, bedoeld in het eerste lid, betreffen niet de uitkomsten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
  - number: '45.4'
    text: |-
      Onze Minister maakt, onverminderd het bepaalde in [artikel 10 van de Wet openbaarheid van bestuur][ref1], de
      onderzoeksresultaten zo spoedig mogelijk openbaar, maar in ieder geval binnen zes maanden na de aanbieding ervan
      aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005252#Artikel10
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0005252
        artikel: '10'
  - number: '46.1'
    text: |-
      De subsidie-ontvanger en alle bij de uitvoering van het onderzoek betrokken personen zijn verplicht tot
      geheimhouding van in het kader van het onderzoek verkregen persoonsgegevens of andere gegevens met een
      vertrouwelijk karakter.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel46
  - number: '46.2'
    text: |-
      Persoonsgegevens als bedoeld in het eerste lid worden slechts gebruikt voor het onderzoek waarvoor subsidie is
      verleend, tenzij Onze Minister of degene die de gegevens heeft verstrekt toestemming geeft voor gebruik ten behoeve
      van ander onderzoek.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel46
  - number: '48.1'
    text: |-
      De aanvraag tot vaststelling van de subsidie wordt binnen dertien weken na afloop van de periode waarvoor subsidie
      is verleend, dan wel binnen dertien weken na de rapportage over het onderzoek ingediend.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48
  - number: '48.2'
    text: Onze Minister beslist binnen dertien weken op de aanvraag tot vaststelling.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48
  - number: 48c.1
    text: 'Onze Minister kan subsidie verstrekken ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48c
  - number: 48c.1.a
    text: |-
      het optreden als bewindvoerder als bedoeld in [artikel 287, derde lid, van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel287
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '287'
  - number: 48c.1.b
    text: activiteiten ter ondersteuning van bewindvoerders.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48c
  - number: 48c.2
    text: De subsidies worden per boekjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48c
  - number: 48c.3
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48d.1
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
  - number: 48d.1.a
    text: de personen of instellingen waaraan de subsidies kunnen worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
  - number: 48d.1.b
    text: de wijze waarop het bedrag van de subsidies wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
  - number: 48d.1.c
    text: |-
      de aan de subsidies voor de ontvanger verbonden verplichtingen voorzover niet reeds voortvloeiend uit de
      [derde titel van de Faillissementswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: 48d.1.d
    text: de verlening van voorschotten;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
  - number: 48d.1.e
    text: de vaststelling en verdeling van een of meer subsidieplafonds.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
  - number: 48d.2
    text: |-
      Indien de subsidie wordt verstrekt aan een rechtspersoon die krachtens publiekrecht is ingesteld, is, in afwijking
      van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1], [titel 4.2 van die wet][ref2] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
  - number: 48d.3
    text: |-
      Onze Minister stelt een commissie van deskundigen in. De commissie heeft een tijdelijk karakter. De commissie
      adviseert over de uitvoering van de [derde titel van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0001860
  - number: 48e.1
    text: |-
      Onze Minister verstrekt per boekjaar subsidie aan een reclasseringsinstelling of een samenwerkingsverband van
      reclasseringsinstellingen voor de uitvoering van reclasseringswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48e
  - number: 48e.2
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48e.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48e
  - number: 48f
    text: 'In dit hoofdstuk wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48f
  - number: 48f.a
    text: |-
      Halt-afdoening: een afdoening als bedoeld in [artikel 77e van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel77e
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 77e
  - number: 48f.b
    text: 'Jeugdige: een verdachte in de leeftijd vanaf 12 tot en met 17 jaar.'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48f
  - number: 48f.c
    text: |-
      Halt-bureau: een bureau dat in elk geval voorziet in de coördinatie en uitvoering van Halt-afdoeningen en dat
      zelf een door de minister aangewezen rechtspersoon is of onderdeel uitmaakt van een door de minister aangewezen
      rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48f
  - number: 48g.1
    text: Onze Minister verstrekt per boekjaar subsidie aan de door Onze Minister aangewezen Halt-bureaus.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48g
  - number: 48g.2
    text: |-
      Bij ministeriële regeling kunnen eisen worden gesteld aan het aanwijzen van een Halt-bureau en kan worden bepaald
      in welke gevallen de aanwijzing wordt opgeschort of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48g
  - number: 48g.3
    text: |-
      [Afdeling 4.2.8. van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48g
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48g.4
    text: |-
      De [artikelen 13][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel15
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48g
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008121
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 48g.5
    text: |-
      Het Halt-bureau dient binnen dertien weken na afloop van het boekjaar een aanvraag tot vaststelling van de subsidie
      in.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48g
  - number: 48g.6
    text: |-
      Op een Halt-bureau is het bepaalde bij en krachtens de [artikelen 25, eerste en tweede lid][ref1], en
      [28, eerste lid, van de Wet op de jeugdzorg][ref2] voor wat betreft de verantwoordelijkheidstoedeling van
      overeenkomstige toepassing, met dien verstande dat voor «de zorgaanbieder» wordt gelezen: het Halt-bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0016637#Artikel28
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48g
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0016637
        artikel: '28'
  - number: 48g.6
    text: |-
      Hetgeen bij en krachtens de [artikelen 4.1.1, tweede lid, eerste volzin][ref1], juncto
      [4.1.5, eerste lid, van de Jeugdwet][ref2] is bepaald ten aanzien van jeugdhulpaanbieders, is voor wat betreft de
      verantwoordelijkheidstoedeling van overeenkomstige toepassing op Halt-bureaus.


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0034925#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48g
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0034925
        artikel: '4'
  - number: 48h.1
    text: |-
      De subsidie aan de Halt-bureaus wordt bepaald door de kostprijzen voor de te onderscheiden categorieën Halt-
      afdoeningen, onderdelen daarvan of samengevoegde categorieën Halt-afdoeningen, te vermenigvuldigen met het aantal
      afdoeningen voor de te onderscheiden categorieën Halt-afdoeningen, onderdelen daarvan of samengevoegde categorieën
      Halt-afdoeningen.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48h
  - number: 48h.2
    text: |-
      Bij ministeriële regeling worden verschillende categorieën Halt-afdoeningen en de daarbij behorende kostprijzen
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48h
  - number: 48h.3
    text: |-
      Onze Minister kan bij de verlening van de subsidie bepalen dat het subsidiebedrag van de subsidie door hem in de
      loop van het boekjaar kan worden bijgesteld in verband met de ontwikkeling van het loon- en prijspeil.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48h
  - number: 48i.1
    text: |-
      Het Halt-bureau verstrekt aan Onze Minister uiterlijk vier weken na het eind van ieder boekjaar een opgave van het
      aantal afdoeningen, uitgesplitst naar de onderscheiden categorieën Halt-afdoeningen of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48i
  - number: 48i.2
    text: Bij ministeriële regeling kan worden bepaald welke andere verplichtingen aan de subsidieverlening zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48i
  - number: 48j.1
    text: |-
      Indien bij de vaststelling van de subsidie blijkt dat het definitieve aantal afdoeningen meer bedraagt dan 105
      procent van de raming, vindt een door Onze Minister te bepalen verhoging plaats van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48j
  - number: 48j.2
    text: |-
      Indien bij de vaststelling van de subsidie blijkt dat het definitieve aantal afdoeningen minder bedraagt dan 95
      procent van de raming, vindt een door Onze Minister te bepalen verlaging plaats van de subsidie.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48j
  - number: 48j.3
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48j
  - number: 48k
    text: |-
      Voor zover het Halt-bureau geen onderdeel uitmaakt van een gemeente, behoeft het Haltbureau de toestemming van Onze
      Minister voor de handelingen, bedoeld in [artikel 4:71, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48k
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 48l.1
    text: |-
      Het Halt-bureau kan een egalisatiereserve vormen als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48l
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 48l.2
    text: |-
      Bij ministeriële regeling worden de maximale hoogte van de jaarlijkse toevoeging en de maximale omvang van de
      egalisatiereserve bepaald en kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48l
  - number: 48m.1
    text: |-
      Indien het Halt-bureau zaken ter beschikking stelt aan of diensten verricht voor natuurlijke personen of
      rechtspersonen, die niet de ondersteuning van het Halt-bureau ten doel hebben, brengt zij een vergoeding in
      rekening die tenminste kostendekkend is.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48m
  - number: 48m.2
    text: |-
      Indien aan het Halt-bureau zaken ter beschikking worden gesteld door een rechtspersoon, die de ondersteuning van
      het bureau ten doel heeft, betaalt zij aan deze rechtspersoon geen hogere vergoeding dan het bedrag dat ter zake op
      grond van de historische kostprijs en rekening houdende met de voor de instelling geldende afschrijvingspercentages
      in redelijkheid in rekening kan worden gebracht.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48m
  - number: 48m.3
    text: |-
      Indien een rechtspersoon, die de ondersteuning van het Halt-bureau ten doel heeft, voor dit Halt-bureau diensten
      verricht welke in het algemeen in eigen beheer worden verricht, betaalt het Halt-bureau aan de rechtspersoon geen
      hogere vergoeding dan het bedrag dat het verrichten van de diensten in eigen beheer zou hebben gekost.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48m
  - number: 48m.4
    text: |-
      Het Halt-bureau verstrekt desgevraagd aan Onze Minister een beschrijving van de tussen de instelling en andere
      rechtspersonen bestaande organisatorische dan wel financiële banden alsmede van zodanig nog in het leven te roepen
      of te wijzigen banden, voor zover deze banden van invloed kunnen zijn op de bepaling van de vergoedingen, bedoeld
      in het eerste tot en met het derde lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48m
  - number: 48n.1
    text: Onze Minister kan per boekjaar subsidie verstrekken aan een rechtspersoon die de Halt-bureaus ondersteunt.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48n
  - number: 48n.2
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48n
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48n.3
    text: |-
      De [artikelen 13][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel15
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48n
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008121
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: 48o.1
    text: |-
      De ondersteunende rechtspersoon kan een egalisatiereserve vormen als bedoeld in
      [artikel 4:72 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48o
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 48o.2
    text: |-
      De jaarlijkse toevoeging aan de egalisatiereserve bedraagt niet meer dan vijf procent van de op grond van artikel
      48n in dat jaar verstrekte subsidie. Bij ministeriële regeling wordt de maximale omvang van de egalisatiereserve
      bepaald.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48o
  - number: 48p.1
    text: |-
      De ondersteunende rechtspersoon kan een voorziening groot onderhoud en andere door Onze Minister te benoemen
      reserves en voorzieningen vormen.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48p
  - number: 48p.2
    text: |-
      Per boekjaar wordt aan de voorziening groot onderhoud niet meer toegevoegd dan drie procent van de op grond van
      artikel 48n in dat jaar verstrekte subsidie. De voorziening groot onderhoud bedraagt niet meer dan 15 procent van
      de op grond van artikel 48n in dat jaar verstrekte subsidie. Uitgaven voor groot onderhoud dienen op de voorziening
      groot onderhoud te worden afgeboekt.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48p
  - number: 48r
    text: |-
      Onze Minister kan subsidies verstrekken ten behoeve van activiteiten inzake openbare orde en veiligheid die gericht
      zijn op:
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48r
  - number: 48r.a
    text: het verminderen van de gelegenheid tot het plegen van strafbare feiten;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48r
  - number: 48r.b
    text: |-
      het vergroten van de kennis en het inzicht in veiligheidsvraagstukken, alsmede het verder ontwikkelen van integraal
      veiligheidsbeleid;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48r
  - number: 48r.c
    text: het vergroten van de veiligheid in de samenleving in het algemeen, waaronder de handhaving van de openbare orde;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48r
  - number: 48r.d
    text: |-
      het ondersteunen van bijzondere activiteiten ten behoeve van de politie, brandweer en de
      rampenbestrijdingsorganisaties.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48r
  - number: 48s
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen de activiteiten, bedoeld in
      [artikel 48r][ref1], nader worden bepaald, alsmede criteria voor de verstrekking worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel48r
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48s
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: 48r
        hoofdstuk: 4E
  - number: 48t
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij ministeriële regeling kunnen voor subsidies die verstrekt
      worden op grond van [artikel 48r][ref1] regels worden gesteld met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel48r
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: 48r
        hoofdstuk: 4E
  - number: 48t.a
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
  - number: 48t.b
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
  - number: 48t.c
    text: de voorwaarden waaronder subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
  - number: 48t.d
    text: de aan de subsidie verbonden verplichtingen of te verbinden verplichtingen;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
  - number: 48t.e
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
  - number: 48t.f
    text: intrekking en wijziging van de subsidieverlening of subsidievaststelling;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
  - number: 48t.g
    text: de betaling van de subsidie en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
  - number: 48t.h
    text: |-
      het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48t
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 48u.1
    text: 'Onze Minister kan subsidie verstrekken aan een rechtspersoon voor:'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48u
  - number: 48u.1.a
    text: |-
      de instandhouding van een expertisecentrum dat gespecialiseerd is in zaken op het gebied van parentale
      internationale kinderontvoering;
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48u
  - number: 48u.1.b
    text: overige activiteiten op het gebied van parentale internationale kinderontvoering.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48u
  - number: 48u.2
    text: |-
      Op een subsidie als bedoeld in het eerste lid, aanhef en onder a, is
      [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48u
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: 48u.3
    text: |-
      Onze Minister kan een subsidieplafond vaststellen voor activiteiten als bedoeld in het eerste lid, aanhef en onder
      b. Hij bepaalt daarbij hoe het beschikbare bedrag wordt verdeeld.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48u
  - number: 48u.4
    text: Bij ministeriële regeling kunnen nadere regels worden gesteld omtrent het bepaalde in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48u
  - number: 48v.1
    text: |-
      Onze Minister kan aan een rechtspersoon als bedoeld in [artikel 256][ref1], en aan een rechtspersoon
      als bedoeld in [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2], subsidie
      verstrekken ten behoeve van de kosten van de uitoefening van de in die bepalingen en in
      [artikel 241, zevende lid, van Boek 1 van het Burgerlijk Wetboek][ref3] bedoelde taken, bijzondere door Onze
      Minister aan te geven kosten daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel256
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0002656#Artikel241
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48v
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '256'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref3
        bwb_id: BWBR0002656
        artikel: '241'
  - number: 48v.2
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het **verlenen van deze subsidie.**
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel48v
  - number: '49.1'
    text: |-
      [Afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] is van toepassing op door Onze Minister per boekjaar
      verstrekte subsidies die niet op een wettelijk voorschrift berusten.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '49.2'
    text: |-
      De [artikelen 13][ref1] en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0008121#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008121#Artikel15
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0008121
        artikel: '13'
        hoofdstuk: '2'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0008121
        artikel: '15'
        hoofdstuk: '2'
        afdeling: '3'
  - number: '49.3'
    text: Onze Minister kan vrijstelling of ontheffing verlenen van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel49
  - number: '56'
    text: |-
      Deze wet is niet van toepassing op subsidies die voor de inwerkingtreding van deze wet zijn verleend of
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel56
  - number: '57'
    text: |-
      Voor de plaatsing van deze wet in het *Staatsblad* brengt Onze Minister van Justitie de in deze wet voorkomende
      aanhalingen van de artikelen en afdelingen van de [Algemene wet bestuursrecht][ref1] met de nieuwe nummering van de
      [Algemene wet bestuursrecht][ref2] in overeenstemming.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
  - number: '58'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel58
  - number: '59'
    text: 'Deze wet wordt aangehaald als: Wet Justitie-subsidies.'
    url: https://wetten.overheid.nl/BWBR0008121/2015-01-01#Artikel59
