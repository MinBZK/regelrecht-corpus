        bwb_id: BWBR0012874
  - number: '11'
    text: |-
      1 De houder van een type-certificaat dan wel een aanvullend type-certificaat kan de minister verzoeken een andere
      JAA-persoon of niet JAA-persoon aan te wijzen als houder van het type-certificaat dan wel het aanvullend type-
      certificaat.

      2 De minister wijst het verzoek toe als aan de volgende voorwaarden is voldaan:

      a. de nieuwe houder zich schriftelijk bereid verklaart om het houderschap te vervullen;

      b. de oorspronkelijke houder verklaart alle ontwerp- en productiegevens en de rechten daarop onvoorwaardelijk aan
      de nieuwe houder over te dragen;

      c. indien de nieuwe houder in een JAA land is gevestigd, is artikel 4, eerste lid, onder a, van het Besluit
      luchtwaardigheid van toepassing;

      d. indien de nieuwe houder niet in een JAA land is gevestigd, is artikel 6, eerste lid, onder a, b, en d van het
      Besluit luchtwaardigheid van toepassing;

      e. de nieuwe houder verklaart, dat voldaan zal worden aan de eisen gesteld in het `Document van overdracht van
      type-certificaat' dan wel `Document van overdracht van aanvullend type-certificaat' zoals bedoeld in het derde lid
      en aan de verplichtingen die voortvloeien uit ICAO Annex 8.

      f. de vergoeding conform het tarief terzake is voldaan.

      3 De overdracht van een type-certificaat dan wel een aanvullend type-certificaat wordt vastgelegd in een `Document
      van overdracht van type-certificaat' dan wel `Document van overdracht van aanvullend type-certificaat', waarin
      tenminste wordt vermeld:

      a. de naam en het adres van de nieuwe houder van het type-certificaat dan wel het aanvullend type-certificaat;

      b. voor een niet in Nederland gevestigde houder van een type-certificaat, de goedkeuring van de bevoegde autoriteit
      van de overdracht van het type-certificaat;

      c. de eventuele voorwaarden waaronder de bevoegde autoriteit de overdracht heeft geaccepteerd;

      d. de DOA van de nieuwe houder;

      e. alle eventuele aanvullende voorwaarden die onze minister nodig acht;

      f. de verklaring van de nieuwe houder, dat voldaan zal worden aan de eisen gesteld in het `Document van overdracht
      van type-certificaat' dan wel `Document van overdracht van aanvullend type-certificaat', aan de verplichtingen die
      voortvloeien uit ICAO Annex 8 en van ICAO Annex 16, Vol. I.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel11
  - number: '12'
    text: |-
      1 Schorsing van een type-certificaat dan wel een aanvullend type-certificaat wordt bij aangetekende brief aan de
      houder medegedeeld.

      2 De houder van het type-certificaat dan wel een aanvullend type-certificaat is verplicht het type-certificaat dan
      wel een aanvullend type-certificaat zo spoedig mogelijk aan de minister te zenden.

      3 Om een schorsing op te heffen toont de houder aan, dat de redenen, die tot schorsing hebben geleid, zijn
      vervallen.

      4 Na de opheffing van de schorsing, anders dan door intrekking, wordt aan de betrokkene het type-certificaat dan
      wel aanvullend type-certificaat terrruggezonden.

      5 De schorsing en de opheffing van de schorsing wordt op door de minister te bepalen wijze bekend gesteld.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel12
  - number: '13'
    text: |-
      1 Intrekking van een type-certificaat dan wel een aanvullend type-certificaat wordt bij aangetekende brief aan de
      houder medegedeeld.

      2 De houder van het type-certificaat dan wel een aanvullend type-certificaat is verplicht het type-certificaat dan
      wel een aanvullend type-certificaat zo spoedig mogelijk aan de minister te zenden.

      3 De intrekking wordt op door de minister te bepalen wijze bekend gesteld.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel13
  - number: '14'
    text: |-
      1 De minister vermeldt overeenkomstig JAR 21.17, 21.114 en 21.93, in de certificatie basis de van toepassing zijnde
      eisen, waaraan een product moet voldoen waarvoor de aanvraag voor een type-certificaat volgens [artikel 2][ref1]
      of [4][ref2], een gewijzigd type-certificaat volgens [artikel 6][ref3] of [7][ref4], of een aanvullend type-
      certificaat volgens [artikel 8][ref5] of [9][ref6], in behandeling is genomen.

      2 De aanvrager geeft aan te voldoen aan de gestelde eisen in de certificatie basis en de daarvoor benodigde
      bewijsvoering te zullen leveren ten behoeve van het derde lid van het van toepassing zijnde [artikelen 2][ref7],
      [4][ref8], [6][ref9], [7][ref10], [8][ref11], of [9][ref12].

      3 Bij een aanvraag als bedoeld in [artikel 4][ref13], [artikel 7][ref14] en [artikel 9][ref15] van deze regeling,
      zal aan de autoriteit van het land van export worden verzocht de geleverde bewijsvoering te accepteren of te
      onderzoeken op relevantie of medewerking te verlenen aan de toetsing van de bewijsvoering.

      4 De aanvrager legt in de lijst van bewijsvoering vast, op welke wijze de bewijsvoering geleverd is, en met welke
      middelen deze onderbouwd is. Deze bewijsvoering wordt in de volgende categorieën ingedeeld:









                  Soort Bewijsvoering


                  Middelen van Bewijsvoering


                  Gerelateerde Documenten




                  Technische beoordeling


                  MBO : Verklaring van bewijs-
                  voering
                  referentie naar typ-ontwerp documenten
      keuze van methoden en factoren
      definities


                  Type-ontwerp documenten
                  Afgegeven verklaringen




                  MB1 : Ontwerp Beschouwing


                  Beschrijvingen, Tekeningen




                  MB2 : Berekening/Analyse


                  Onderbouwingsrapporten




                  MB3 : Veiligheidsbeschouwing


                  Veiligheidsanalyse




                  Testen


                  MB4 : Laboratorium test


                  Test programma's
                  Test rapporten
                  Test interpretaties




                  MB5 : Grondtesten op verge-
                  lijkbare produkt




                  MB6 : Testvlucht




                  MB8 : Simulatie




                  Inspecties


                  MB7 : Ontwerp Inspectie


                  Inspectierapporten




                  Kwalificatie van uitrus-
                  tingsstukken


                  MB9 : Kwalificatie van uitrus-
                  tingsstukken


                  Noot: De kwalificatie van uitrus-
                  ting kan alle bovenstaande
                  middelen van bewijsvoering
                  omvatten






      5 De lijst van bewijsvoering legt voor ieder artikel van alle van toepassing zijnde eisen vast:

      a. het middel van bewijsvoering,

      b. de referentie naar het document waarin de resultaten of bevindingen van de bewijsvoering is vastgelegd en

      c. de referentie van de acceptatie van die vastlegging.

      De lijst van bewijsvoering wordt opgenomen in de certificatie basis.

      6 Indien de aanvraag een niet eerder toegepaste bewijsvoeringsmethode omvat, dient de aanvrager overeenstemming
      met de minister bereikt te hebben, alvorens deze methode toegepast mag worden. De acceptatie door de minister wordt
      vastgelegd in een wijze van interpretatie en opgenomen in de certificatie basis.

      7 De aanvrager kan een verzoek indienen ter dispensatie van één of meer gestelde eisen in de certificatie basis.
      De minister kan dit accepteren als daartoe gegronde redenen voor bestaan. Deze acceptatie wordt vastgelegd in een
      dispensatie van eis en opgenomen in de certificatie basis.

      8 De aanvrager kan een verzoek indienen om aan een gestelde eis op andere maar equivalente wijze te voldoen. De
      minister kan dit accepteren als daartoe gegronde redenen voor bestaan. Deze acceptatie wordt vastgelegd in een
      equivalente eis en opgenomen in de certificatie basis.

      9 De aanvrager heeft voldaan aan het gestelde in het derde lid van het relevante [artikel 2][ref16], [4][ref17],
      [6][ref18], [7][ref19], [8][ref20], of [9][ref21] indien:

      a. aan alle eisen in de certificatie basis voldaan is,

      b. de lijst van bewijsvoering volledig is,

      c. bij een aanvraag als bedoeld in [artikel 4][ref22], [7][ref23], of [9][ref24] van deze regeling, de autoriteit
      van het land van export een verklaring heeft afgegeven, dat de geleverde bewijsvoering in overeenstemming is met de
      certificatie basis,

      d. de aanvrager heeft verklaard dat voldaan is aan de eisen gesteld in de certificatie basis, en dat hem geen
      eigenschappen van zijn product bekend zijn, die de veiligheid in gevaar brengen


