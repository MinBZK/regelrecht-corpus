preamble:
  text: |-
    Gelet op artikel 14 van het Besluit luchtwaardigheid,

    Besluit:
  url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            minister:

              de Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel1
  - number: '2'
    text: |-
      1 De minister neemt een aanvraag voor een type-certificaat door een JAA-persoon in behandeling wanneer de aanvrager
      voldoet aan de eisen van JAR 21.13.

      2 Een aanvraag voor een type-certificaat door een JAA-persoon wordt ingediend overeenkomstig JAR 21.15, middels een
      volledig ingevuld formulier volgens [bijlage 1][ref1].

      3 De aanvrager, zijnde een JAA-persoon, toont voor de afgifte van een type-certificaat conform JAR 21.20, JAR
      21.31, JAR 21.33 en JAR 21.35 aan, dat het product waarvoor het type-certificaat is aangevraagd, voldoet aan de van
      toepassing zijnde eisen uit [artikel 5 van het Besluit luchtwaardigheid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012874
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0012874
      - id: ref2
        bwb_id: BWBR0012651
        artikel: '5'
  - number: '3'
    text: |-
      1 Een aanvraag door een JAA persoon voor een type-certificaat voor een luchtvaartuig waarop JAR 25 of JAR 29 van
      toepassing is, is conform JAR 21.17 c vijf jaar geldig.

      2 Een aanvraag door een JAA-persoon voor een type-certificaat voor een luchtvaartuig waarop andere dan in het
      eerste lid genoemde JAR's van toepassing zijn, is conform JAR 21.17c drie jaar geldig.

      3 De minister kan de periode van geldigheid van een aanvraag op verzoek van de aanvrager zijnde een JAA-persoon
      overeenkomstig JAR 21.17 c verlengen.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel3
  - number: '4'
    text: |-
      1 De minister neemt een aanvraag voor een type-certificaat door een niet JAA-persoon in behandeling wanneer de
      aanvrager voldoet aan de eisen van JAR 21.N13.

      2 Een aanvraag voor een type-certificaat door een niet JAA-persoon wordt schriftelijk ingediend bij de minister
      overeenkomstig JAR 21.N15, middels een behoorlijk ingevuld formulier volgens [bijlage 1][ref1].

      3 De aanvrager, zijnde een niet JAA-persoon, toont voor de afgifte van een type-certificaat conform JAR 21.N20, JAR
      21.N31, JAR 21.N33 en JAR 21.N35 aan, dat het product waarvoor het type-certificaat is aangevraagd, voldoet aan de
      van toepassing zijnde eisen uit [artikel 5 van het Besluit luchtwaardigheid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0012874
      [ref2]: https://wetten.overheid.nl/BWBR0012651#Artikel5
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012874
      - id: ref2
        bwb_id: BWBR0012651
        artikel: '5'
  - number: '5'
    text: |-
      1 Het model van het type-certificaat is overeenkomstig de bij deze regeling behorende [bijlage 2][ref1].

      2 De afgifte van een type-certificaat wordt op door de minister te bepalen wijze bekend gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012874
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012874
  - number: '6'
    text: |-
      1 De minister neemt een aanvraag voor een ingrijpende wijziging van een type-certificaat door een JAA-persoon in
      behandeling wanneer deze JAA-persoon de houder van het type-certificaat is en de voorgestelde wijziging van het
      type-ontwerp naar het oordeel van de minister niet een geheel nieuw onderzoek vereist zoals bedoeld in JAR 21.19.

      2 Een aanvraag voor een wijziging van een type-certificaat wordt door een JAA-persoon ingediend overeenkomstig
      JAR 21.93.

      3 De aanvrager, zijnde een JAA-persoon, toont voor de goedkeuring van een ingrijpende wijziging van een type-
      certificaat conform JAR 21.97 aan, dat het gewijzigde product voldoet aan de eisen van JAR 21.101 en van ICAO Annex
      16, Vol. I.

      4 De aanvrager, zijnde een JAA-persoon, toont voor de goedkeuring van een geringe wijziging van een type-
      certificaat aan, dat het gewijzigde product voldoet aan de eisen van JAR 21.101 en van ICAO Annex 16, Vol. I.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel6
  - number: '7'
    text: |-
      1 De minister neemt een aanvraag voor een ingrijpende wijziging van een type-certificaat door een niet JAA-persoon
      in behandeling wanneer deze de houder van het type-certificaat is en voldoet aan JAR 21.N92 en de voorgestelde
      wijziging van het typeontwerp naar het oordeel van de Minister niet een geheel nieuw onderzoek vereist zoals
      bedoeld in JAR 21.N19.

      2 Een aanvraag voor een ingrijpende wijziging van een type-certificaat wordt door een niet JAA-persoon ingediend
      overeenkomstig JAR 21.N93.

      3 De aanvrager, zijnde een niet JAA-persoon, toont voor de goedkeuring van een ingrijpende wijziging van een type-
      certificaat conform JAR 21.N97 aan, dat het gewijzigde product voldoet aan de eisen van JAR 21.N101 en van ICAO
      Annex 16, Vol. I.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel7
  - number: '8'
    text: |-
      1 De minister neemt een aanvraag voor een aanvullend type-certificaat door een JAA-persoon in behandeling wanneer
      de aanvrager voldoet aan de eisen van JAR 21.112.

      2 Een aanvraag voor een aanvullend type-certificaat wordt door een JAA-persoon ingediend overeenkomstig JAR 21.113.

      3 De aanvrager, zijnde een JAA-persoon, toont voor de afgifte van een aanvullend type-certificaat conform JAR 21.97
      aan, dat het gewijzigde product voldoet aan de eisen van JAR 21.101 en van ICAO Annex 16, Vol. I.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel8
  - number: '9'
    text: |-
      1 De minister neemt een aanvraag voor een aanvullend type-certificaat door een niet JAA-persoon in behandeling
      wanneer de aanvrager voldoet aan de eisen van JAR 21.N112.

      2 Een aanvraag voor een aanvullend type-certificaat wordt door een niet JAA-persoon ingediend overeenkomstig JAR
      21.N113.

      3 De aanvrager, zijnde een niet JAA-persoon, toont voor de afgifte van een aanvullend type-certificaat conform JAR
      21.N97 aan, dat het gewijzigde product voldoet aan de eisen van JAR 21.N101 en van ICAO Annex 16, Vol. I.
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel9
  - number: '10'
    text: |-
      1 Het model van het aanvullend type-certificaat is overeenkomstig de bij deze regeling behorende [bijlage 3][ref1].

      2 De afgifte van een aanvullend type-certificaat wordt op door de minister te bepalen wijze bekend gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0012874
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel10
    references:
