  - number: '15'
    text: |-
      1 Voor het uitvoeren van vluchten ter verkrijging van een type-certificaat, een wijziging van een type-certificaat,
      of een aanvullend type-certificaat wordt door de aanvrager toestemming gevraagd.

      2 De aanvrager van de toestemming als bedoeld in het eerste lid krijgt toestemming van de minister wanneer de
      aanvrager voldoet aan de eisen gesteld in JAR 21.33.

      3 Deze toestemming als bedoeld in het tweede lid wordt voor de aanvrager van een type-certificaat, een ingrijpende
      wijziging van een type certificaat of een aanvullend type-certificaat in verband met een ingrijpende wijziging van
      het type-ontwerp waarvoor meer dan enkele vluchten nodig zijn, gegeven in de vorm van een speciaal BvL.

      4 Deze toestemming wordt voor de aanvrager van geringe wijziging van een type certificaat of een aanvullend type-
      certificaat in verband met een geringe wijziging van het type-ontwerp waarvoor slechts enkele vluchten nodig zijn,
      gegeven in de vorm van een ontheffing ex [artikel 3.8 van de Wet luchtvaart][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005555#Artikel3.8
    url: https://wetten.overheid.nl/BWBR0012874/2005-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005555
        artikel: '3.8'
