articles:
  - number: '1'
    text: |-
      Organen als bedoeld in [artikel 50, zesde lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref1] of
      [artikel 67, zesde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref2], die belast wensen te worden
      met de betaalbaarstelling van door het Uitvoeringsinstituut werknemersverzekeringen toegekende dan wel toe te
      kennen uitkeringen op grond van de [Wet op de arbeidsongeschiktheidsverzekering][ref3] of betaalbaarstelling van
      uitkeringen waarop op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref4] recht bestaat, kunnen daartoe
      toestemming vragen aan het Uitvoeringsinstituut werknemersverzekeringen.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0019057#Artikel67
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0019057
    url: https://wetten.overheid.nl/BWBR0003812/2007-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002524
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0019057
        artikel: '67'
      - id: ref3
        bwb_id: BWBR0002524
      - id: ref4
        bwb_id: BWBR0019057
  - number: '2'
    text: |-
      Voor een vergunning als bedoeld in [artikel 1][ref1] kunnen slechts in aanmerking komen:

      a. publiekrechtelijke lichamen:

      b. krachtens de wet in het leven geroepen fondsen;

      c. bedrijfstak- en ondernemingspensioenfondsen als bedoeld in [artikel 1 van de Pensioenwet][ref2];

      d. instellingen, welke de pensioenbetaling verzorgen voor een of meer lichamen of fondsen, bedoeld onder a tot en
      met c.


      [ref1]: https://wetten.overheid.nl/BWBR0003812#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0003812/2007-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003812
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '3'
    text: |-
      1 Een vergunning als bedoeld in [artikel 1][ref1], gaat in op een door het Uitvoeringsinstituut
      werknemersverzekeringen te bepalen datum.

      2 Een vergunning als bedoeld in [artikel 1][ref2], kan door het Uitvoeringsinstituut werknemersverzekeringen
      worden geweigerd of ingetrokken, indien verlening dan wel handhaving van zodanige vergunning de administratie van
      het Uitvoeringsinstituut werknemersverzekeringen naar verhouding te veel zou verzwaren of de uitbetaling van de
      uitkeringen niet voldoende is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0003812#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003812#Artikel1
    url: https://wetten.overheid.nl/BWBR0003812/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003812
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003812
        artikel: '1'
  - number: '4'
    text: |-
      1 Het Uitvoeringsinstituut werknemersverzekeringen kan aan het orgaan, waaraan een vergunning als bedoeld
      in [artikel 1][ref1], is verleend, aanwijzingen en voorschriften geven ten aanzien van de uitbetaling van de
      uitkeringen, waarop die vergunning betrekking heeft.

      2 Indien een vergunning als bedoeld in [artikel 1][ref2] is verleend, geschiedt de afrekening van de uitbetaalde
      uitkeringen volgens door het Uitvoeringsinstituut werknemersverzekeringen te stellen regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0003812#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003812#Artikel1
    url: https://wetten.overheid.nl/BWBR0003812/2007-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003812
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0003812
        artikel: '1'
  - number: '5'
    text: |-
      Het bevoegde uitvoeringsorgaan deelt aan de degene, die gerechtigd is tot een of meer uitkeringen, genoemd in
      [artikel 1][ref1], of, indien hij een wettelijke vertegenwoordiger heeft, aan deze, mede, door welk orgaan die
      uitkering of die uitkeringen zal onderscheidenlijk zullen worden uitbetaald


      [ref1]: https://wetten.overheid.nl/BWBR0003812#Artikel1
    url: https://wetten.overheid.nl/BWBR0003812/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003812
        artikel: '1'
  - number: '6'
    text: |-
      Een vergunning als bedoeld in [artikel 1][ref1] heeft geen betrekking op uitkeringen als bedoeld in de
      [Wet op de arbeidsongeschiktheidsverzekering][ref2], die op grond van [artikel 54 van die wet][ref3]
      worden uitbetaald en heeft ook geen betrekking op uitkeringen als bedoeld in de
      [Wet werk en inkomen naar arbeidsvermogen][ref4] die met toepassing van [artikel 71 van die wet][ref5] worden
      uitbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0003812#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002524
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel54
      [ref4]: https://wetten.overheid.nl/BWBR0019057
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel71
    url: https://wetten.overheid.nl/BWBR0003812/2007-01-01#Artikel6
