$id: regeling_beheer_elektrische_en_elektronische_apparatuur
regulatory_layer: WET
publication_date: '2014-02-05'
valid_from: '2011-03-05'
bwb_id: BWBR0017053
url: https://wetten.overheid.nl/BWBR0017053/2011-03-05
preamble:
  text: |-
    Gelet op richtlijn nr. 2002/96/EG van het Europees Parlement en de Raad van de Europese Unie van 27 januari 2003
    betreffende afgedankte elektrische en elektronische apparatuur (PbEU 2003, L 37), zoals gewijzigd bij richtlijn
    nr. 2003/108/EG van 8 december 2003 (PbEU L 345), de artikelen 8.45, 10.16, eerste lid, 10.17, eerste lid, 10.19,
    10.61, 21.6, zesde lid, en 21.8 van de Wet milieubeheer alsmede artikel 4, eerste lid, van het Besluit beheer
    elektrische en elektronische apparatuur;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. [richtlijn nr. 2002/96](32002L0096): [richtlijn nr. 2002/96/EG](32002L0096) van het Europees Parlement en de
      Raad van de Europese Unie van 27 januari 2003 betreffende afgedankte elektrische en elektronische apparatuur (PbEU
      2003, L 37);

      b. elektrische en elektronische apparatuur: apparaten die elektrische stromen of elektromagnetische velden nodig
      hebben om naar behoren te kunnen werken en apparaten voor het opwekken, overbrengen en meten van die stromen en
      velden, die:

      1°. onder een van de in bijlage IA bij [richtlijn nr. 2002/96](32002L0096) genoemde categorieën vallen, en

      2°. bedoeld zijn voor gebruik met een spanning van maximaal 1000 volt bij wisselstroom en 1500 volt bij
      gelijkstroom;

      c. afgedankte elektrische en elektronische apparatuur: elektrische of elektronische apparaten die afvalstoffen
      zijn, daaronder begrepen alle onderdelen, subeenheden en verbruiksmaterialen die deel uitmaken van het product op
      het moment dat het wordt afgedankt;

      d. preventie: maatregelen ter vermindering van de hoeveelheid en de milieuschadelijkheid van afgedankte elektrische
      en elektronische apparatuur en de daarin aanwezige materialen en stoffen;

      e. recyclen als product: opnieuw gebruiken van afgedankte elektrische en elektronische apparatuur of onderdelen
      daarvan voor hetzelfde doel als waarvoor zij oorspronkelijk zijn ontworpen, daaronder begrepen verder gebruik van
      de apparatuur of de onderdelen daarvan die bij inzamelpunten, distributeurs, recyclingbedrijven of fabrikanten
      worden ingeleverd;

      f. terugwinning van energie: gebruik van brandbare afvalstoffen om energie op te wekken door directe verbranding
      met of zonder andere afvalstoffen, en met terugwinning van de als gevolg daarvan opgewekte warmte;

      g. recyclen als materiaal: na een verwerking opnieuw gebruiken van materialen voor het oorspronkelijke doel of voor
      andere doeleinden, daaronder niet begrepen terugwinning van energie;

      h. verwerking: activiteiten na de afgifte van afgedankte elektrische en elektronische apparatuur aan een inrichting
      voor het verwijderen van gevaarlijke afvalstoffen, demontage, shredderen, nuttige toepassing of voorbereiding
      voor verwijdering, en andere handelingen voor de nuttige toepassing of verwijdering van afgedankte elektrische en
      elektronische apparatuur;

      i. financieringsovereenkomst: een lening- lease-, huur- of afbetalingsovereenkomst of een regeling met betrekking
      tot enige apparatuur, ongeacht of volgens die overeenkomst of regeling, dan wel volgens een bijkomende overeenkomst
      of regeling, eigendomsoverdracht van het apparaat zal of kan plaatsvinden;

      j. de producent: degene die, ongeacht de verkooptechniek:

      1°. onder zijn eigen merk elektrische en elektronische apparatuur vervaardigt en verkoopt,

      2°. onder zijn eigen merk elektrische en elektronische apparatuur wederverkoopt die door andere leveranciers is
      vervaardigd of ingevoerd en verkocht, met uitzondering van de wederverkoop van apparatuur wanneer het merk van
      degene, bedoeld onder 1°, op het apparaat zichtbaar is, of

      3°. in de uitoefening van zijn beroep of bedrijf elektrische en elektronische apparatuur invoert in,
      respectievelijk uitvoert uit Nederland;

      met uitzondering van degene die uitsluitend voorziet in financiering op grond van of in het kader van een
      financieringsovereenkomst;

      k. distributeur: degene die op commerciële basis elektrische en elektronische apparatuur levert aan degene die deze
      apparatuur zal gebruiken;

      l. afgedankte elektrische en elektronische apparatuur van particuliere huishoudens: afgedankte elektrische en
      elektronische apparatuur die afkomstig is:

      1°. van particuliere huishoudens,

      2°. van commerciële, industriële, institutionele of andere bronnen en die naar aard en hoeveelheid met die van
      particuliere huishoudens vergelijkbaar is;

      m. gevaarlijke stoffen of mengsels: mengsels die als gevaarlijk moeten worden beschouwd in de zin van richtlijn
      nr. 1999/45/EG van het Europees Parlement en de Raad van de Europese Unie van 31 mei 1999 betreffende de onderlinge
      aanpassing van de wettelijke en bestuursrechtelijke bepalingen van de lidstaten inzake de indeling, de verpakking
      en het kenmerken van gevaarlijke preparaten (PbEU L 200) of stoffen waarvoor de criteria van een of meer van de
      volgende gevarenklassen of categorieën van bijlage I bij de EG-verordening indeling, etikettering en verpakking van
      stoffen en mengsels vervuld zijn:

      1°. de gevarenklassen 2.1 tot en met 2.4, 2.6 en 2.7, 2.8 typen A en B, 2.9, 2.10, 2.12, 2.13 categorieën 1 en 2,
      2.14 categorieën 1 en 2, en 2.15 typen A tot en met F;

      2°. de gevarenklassen 3.1 tot en met 3.6, 3.7 schadelijke effecten op de seksuele functie en de vruchtbaarheid of
      de ontwikkeling, 3.8 andere effecten dan een narcotische werking, 3.9 en 3.10;

      3°. gevarenklasse 4.1;

      4°. gevarenklasse 5.1.

      2 Onder de in bijlage IA bij [richtlijn nr. 2002/96](32002L0096) genoemde categorieën elektrische en elektronische
      apparatuur vallen in ieder geval de producten, bedoeld in bijlage IB bij die richtlijn.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel1
  - number: 1a
    text: |-
      Deze regeling berust mede op [artikel 5.14 van het Besluit omgevingsrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0027464#Artikel5.14
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0027464
        artikel: '5.14'
  - number: '2'
    text: |-
      Deze regeling is niet van toepassing op:

      a. elektrische en elektronische apparatuur die deel is van andere apparatuur welke geen elektrische en
      elektronische apparatuur in de zin van deze regeling is;

      b. elektrische en elektronische apparatuur die verband houdt met de bescherming van de wezenlijke belangen van
      de veiligheid van Nederland of een van de andere lidstaten van de Europese Unie, alsmede wapens, munitie en
      oorlogsmateriaal daaronder niet begrepen apparatuur die niet voor specifiek militaire doeleinden is bestemd.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel2
  - number: '3'
    text: |-
      1 In de afvalstoffenverordening wordt bepaald dat burgemeester en wethouders zorg dragen voor
      het gescheiden inzamelen van afgedankte elektrische en elektronische apparatuur als bedoeld in
      [artikel 1, eerste lid, onderdeel l, aanhef en onder 1°][ref1].

      2 De gemeenteraad en burgemeester en wethouders dragen er zorg voor dat er op ten minste één daartoe ter
      beschikking gestelde plaats binnen de gemeente of binnen de gemeenten waarmee wordt samengewerkt, in voldoende mate
      gelegenheid wordt geboden voor de houders en distributeurs om afgedankte elektrische en elektronische apparatuur
      van particuliere huishoudens ten minste om niet achter te laten.

      3 Aan het bepaalde in het eerste lid wordt uiterlijk zes maanden na het tijdstip van inwerkingtreding van deze
      regeling voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0017053#Artikel1
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0017053
        artikel: '1'
        paragraaf: '1'
  - number: '4'
    text: |-
      De distributeur neemt bij het ter beschikking stellen van een nieuw product een soortgelijk na gebruik vrijgekomen
      product, zijnde afgedankte elektrische en elektronische apparatuur van particuliere huishoudens, dat hem wordt
      aangeboden, ten minste om niet in.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel4
  - number: '5'
    text: |-
      De inname, bedoeld in de [artikelen 3][ref1] en [4][ref2], kan worden geweigerd indien de afgedankte elektrische
      en elektronische apparatuur bij gebruik is verontreinigd en daardoor een risico voor de gezondheid of veiligheid
      oplevert voor degene die inneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0017053#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017053#Artikel4
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0017053
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017053
        artikel: '4'
        paragraaf: '2'
  - number: '6'
    text: |-
      Onverminderd de [artikelen 3][ref1] en [4][ref2], kunnen producenten innamesystemen voor afgedankte elektrische
      en elektronische apparatuur van particuliere huishoudens invoeren en exploiteren op voorwaarde dat deze systemen in
      overeenstemming zijn met de doelstellingen van [richtlijn nr. 2002/96](32002L0096).


      [ref1]: https://wetten.overheid.nl/BWBR0017053#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017053#Artikel4
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0017053
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0017053
        artikel: '4'
        paragraaf: '2'
  - number: '7'
    text: |-
      De producent draagt er zorg voor dat afgedankte, door hem geproduceerde elektrische en elektronische apparatuur,
      niet zijnde afgedankte elektrische en elektronische apparatuur van particuliere huishoudens, gescheiden wordt
      ingezameld.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel7
  - number: '8'
    text: |-
      1 De producent draagt er zorg voor dat de door de gemeente en distributeur ingenomen afgedankte elektrische
      en elektronische apparatuur van particuliere huishoudens die door hem is geproduceerd vanaf de in
      [artikel 3, tweede lid][ref1], bedoelde plaats en vanaf de distributeur wordt opgehaald, vervoerd en verwerkt.

      2 De producent draagt er zorg voor dat afgedankte, door hem geproduceerde elektrische en elektronische apparatuur,
      niet zijnde afgedankte elektrische en elektronische apparatuur van particuliere huishoudens, wordt vervoerd en
      verwerkt.

      3 De verwerking van de ingenomen afgedankte elektrische en elektronische apparatuur geschiedt met gebruik van de
      beste beschikbare technieken.


      [ref1]: https://wetten.overheid.nl/BWBR0017053#Artikel3
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0017053
        artikel: '3'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 Het bevoegd gezag verbindt zodanige voorschriften aan de omgevingsvergunning voor activiteiten als bedoeld in
      [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref1] met betrekking tot een
      inrichting voor het verwerken van afgedankte elektrische en elektronische apparatuur, dat ten minste de selectieve
      behandeling van materialen en onderdelen, bedoeld in bijlage II bij [richtlijn nr. 2002/96](32002L0096), wordt
      gerealiseerd en waarbij de verwerking ten minste omvat het verwijderen van alle vloeistoffen.

      2 Het bevoegd gezag verbindt zodanige voorschriften aan de omgevingsvergunning voor activiteiten als bedoeld
      in [artikel 2.1, eerste lid, onder e, van de Wet algemene bepalingen omgevingsrecht][ref2] met betrekking tot
      een inrichting voor het verwerken van afgedankte elektrische en elektronische apparatuur, dat de technische
      voorschriften van bijlage III bij [richtlijn nr. 2002/96](32002L0096) worden gerealiseerd.

      3 Het eerste en tweede lid zijn niet van toepassing op een inrichting als bedoeld in [artikel 3, tweede lid][ref3],
      en de inrichting van de in [artikel 4][ref4] genoemde distributeur voorzover het ingenomen afgedankte elektrische
      of elektronische apparatuur betreft die tijdelijk wordt opgeslagen voorafgaand aan het vervoer naar een inrichting
      voor verdere verwerking.

      4 Het bevoegd gezag verbindt uiterlijk negen maanden na het tijdstip van inwerkingtreding van deze
      regeling de voorschriften, bedoeld in het eerste en tweede lid, aan alle vergunningen als bedoeld in
      [artikel 8.1 van de Wet milieubeheer][ref5] voor inrichtingen die afgedankte elektrische en elektronische
      apparatuur verwerken, die onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van deze regeling golden.


      [ref1]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0024779#Artikel2.1
      [ref3]: https://wetten.overheid.nl/BWBR0017053#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0017053#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0003245#Artikel8.1
