  - number: '10'
    text: |-
      1 De producent draagt er zorg voor dat bij verwerking van de afgedankte, door hem geproduceerde elektrische en
      elektronische apparatuur, bedoeld in [artikel 8][ref1], gedurende een kalenderjaar:

      a. voorzover het apparatuur van de categorieën 1 en 10 van bijlage IA bij [richtlijn nr. 2002/96](32002L0096)
      betreft:

        - ten minste 80 gewichtsprocent nuttig wordt toegepast, en
        - ten minste 75 gewichtsprocent als product of materiaal (van onderdelen, materialen en stoffen) wordt gerecycled;

      b. voorzover het apparatuur van de categorieën 3 en 4 van bijlage IA bij [richtlijn nr. 2002/96](32002L0096)
      betreft:

        - ten minste 75 gewichtsprocent nuttig wordt toegepast, en
        - ten minste 65 gewichtsprocent als product of materiaal (van onderdelen, materialen en stoffen) wordt gerecycled;

      c. voorzover het apparatuur van de categorieën 2, 5, 6, 7 en 9 van bijlage IA bij [richtlijn nr. 2002/96]
      (32002L0096) betreft:

        - ten minste 70 gewichtsprocent nuttig wordt toegepast en
        - ten minste 50 gewichtsprocent als product of materiaal (van onderdelen, materialen en stoffen) wordt gerecycled;

      d. voorzover het gasontladingslampen betreft ten minste 80 gewichtsprocent als product of materiaal (van
      onderdelen, materialen en stoffen) wordt gerecycled.

      2 Voor de berekening van de in het eerste lid genoemde percentages, wordt het recyclen als product voorzover dit
      volledige apparaten betreft, niet meegeteld.

      3 Voor de berekening van de in het eerste lid genoemde percentages, wordt afgedankte elektrische en elektronische
      apparatuur die wordt uitgevoerd naar landen buiten de Europese Gemeenschap niet meegeteld, met uitzondering
      van apparatuur waarvan degene die uitvoert kan aantonen dat de nuttige toepassing, de recycling als product
      of materiaal heeft plaatsgevonden in omstandigheden die gelijkwaardig zijn aan de voorschriften, bedoeld in
      [artikel 9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017053#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0017053#Artikel9
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel10
