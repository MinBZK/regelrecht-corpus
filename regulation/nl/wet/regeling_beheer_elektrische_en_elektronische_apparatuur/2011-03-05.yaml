  - number: '11'
    text: |-
      1 De producent draagt zorg voor de financiering van het beheer van afgedankte, door hem geproduceerde elektrische
      en elektronische apparatuur van particuliere huishoudens, voorzover het apparatuur betreft die na 13 augustus 2005
      op de markt is gebracht.

      2 De producent die op de markt aanwezig is op het moment waarop de kosten ontstaan van het beheer van afgedankte
      elektrische en elektronische apparatuur van particuliere huishoudens welke apparatuur voor 13 augustus 2005
      op de markt zijn gebracht, draagt zorg voor de financiering van het beheer van die afgedankte apparatuur naar
      evenredigheid van zijn marktaandeel op het moment waarop de kosten van het afvalbeheer ontstaan.

      3 De in het eerste en tweede lid genoemde zorg voor financiering begint bij de afgifte op de in [artikel 3][ref1]
      bedoelde plaats alsmede bij de in [artikel 4][ref2] genoemde distributeur.

      4 Bij het op de markt brengen van elektrische en elektronische apparatuur als bedoeld in het eerste lid stelt de
      producent een waarborg waaruit blijkt dat het beheer van die apparatuur, wanneer die wordt afgedankt, zal worden
      gefinancierd overeenkomstig het eerste lid.

      5 De in het vierde lid bedoelde waarborg kan de vorm hebben van een recycleverzekering, geblokkeerde bankrekening
      of deelneming van de producent aan passende financiële regelingen voor de financiering van het beheer van
      afgedankte elektrische en elektronische apparatuur.

      6 De kosten van het afvalbeheer, bedoeld in het eerste lid, worden bij de verkoop van nieuwe producten niet
      afzonderlijk getoond aan de kopers.

      7 De kosten van het afvalbeheer, bedoeld in het tweede lid, kunnen bij de verkoop van nieuwe producten afzonderlijk
      worden getoond aan de kopers, voorzover de getoonde kosten de reële kosten niet overstijgen.

      8 Het zevende lid geldt voor de elektrische en elektronische apparatuur, genoemd in bijlage IA bij [richtlijn nr.
      2002/96](32002L0096), onder categorie 1, tot 13 februari 2013 en voor de elektrische en elektronische apparatuur,
      genoemd onder categorieën 2 tot en met 10 van die bijlage, tot 13 februari 2011.


      [ref1]: https://wetten.overheid.nl/BWBR0017053#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0017053#Artikel4
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel11
