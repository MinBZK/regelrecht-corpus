  - number: '12'
    text: |-
      1 De producent draagt zorg voor de financiering van het beheer van afgedankte, door hem geproduceerde elektrische
      en elektronische apparatuur, niet zijnde afgedankte elektrische en elektronische apparatuur van particuliere
      huishoudens, voorzover het apparatuur betreft die na 13 augustus 2005 op de markt is gebracht.

      2 De ontdoener financiert het beheer van door hem afgedankte elektrische en elektronische apparatuur, niet zijnde
      afgedankte elektrische en elektronische apparatuur van particuliere huishoudens, voorzover het apparatuur betreft
      die voor 13 augustus 2005 op de markt is gebracht.

      3 In afwijking van het eerste en tweede lid, kunnen producenten en ontdoeners andere financieringsregelingen
      overeenkomen.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel12
  - number: '13'
    text: |-
      1 De producent voorziet de door hem geproduceerde elektrische en elektronische apparatuur die na 13 augustus 2005
      op de markt wordt gebracht van:

      a. een symbool zoals opgenomen is in bijlage IV bij [richtlijn nr. 96/2002](31996L2002),

      b. een aanduiding waardoor de producent duidelijk is te identificeren, en

      c. een aanduiding waaruit blijkt dat het apparaat na 13 augustus 2005 op de markt is gebracht.

      2 Het in het eerste lid, onder a, genoemde symbool wordt duidelijk zichtbaar aangebracht. Indien, gelet op de
      afmetingen of functie van het product, het niet mogelijk is daarop het symbool, bedoeld in het eerste lid, onder a,
      aan te brengen, wordt dat symbool aangebracht op de verpakking, de gebruiksaanwijzing of het garantiebewijs van de
      elektrische en elektronische apparatuur.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel13
  - number: 13a
    text: |-
      1 Het is verboden elektrische en elektronische apparatuur in te voeren, voor handelsdoeleinden voorhanden te
      hebben, aan een ander ter beschikking te stellen of uit te voeren indien de ingebouwde batterijen en accu’s niet
      eenvoudig uit de apparatuur gehaald kunnen worden.

      2 Een gebruiksaanwijzing bij apparatuur vermeldt:

      a. de wijze waarop de batterijen en accu’s uit de elektrische en elektronische apparatuur gehaald kunnen worden;

      b. informatie over het type batterij of accu, dat in de elektrische en elektronische apparatuur is ingebouwd.

      3 Een producent of distributeur levert bij de elektrische en elektronische apparatuur, waarin batterijen of accu’s
      zijn ingebouwd, een gebruiksaanwijzing die voldoet aan het tweede lid.

      4 Het eerste en tweede lid zijn niet van toepassing wanneer een permanente verbinding tussen de elektrische en
      elektronische apparatuur en de batterij of accu vereist is voor de continuïteit van de stroomvoorziening vanwege:

      a. de veiligheid en de prestaties;

      b. medische redenen;

      c. de data-integriteit.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel13a
  - number: '14'
    text: |-
      1 De producent die een nieuw type elektrische en elektronische apparatuur op de markt brengt, verstrekt voor deze
      apparatuur informatie over de recycling als product of materiaal en de verdere verwerking, aan inrichtingen die
      deze apparatuur repareren, onderhouden of verwerken.

      2 De in het eerste lid genoemde informatie bevat tevens aanwijzingen over de verschillende onderdelen en materialen
      van de apparatuur, alsmede over de plaatsen in de apparatuur waar zich gevaarlijke stoffen en mengsels bevinden
      indien de in het eerste lid genoemde inrichtingen deze informatie nodig hebben om aan deze regeling te kunnen
      voldoen.

      3 De in het eerste lid bedoelde informatie wordt door de producent verstrekt in de vorm van handboeken of in de
      vorm van elektronische media en wordt verstrekt binnen het jaar nadat de apparatuur op de markt is gebracht.
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel14
  - number: '15'
    text: |-
      De producent maakt bij het indienen van een mededeling als bedoeld in
      [artikel 4 van het Besluit beheer elektrische en elektronische apparatuur][ref1] gebruik van het in
      [bijlage 1][ref2] bij deze regeling opgenomen formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0016990#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0017053
    url: https://wetten.overheid.nl/BWBR0017053/2011-03-05#Artikel15
    references:
