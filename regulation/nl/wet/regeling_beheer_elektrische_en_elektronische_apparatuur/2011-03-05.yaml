        bwb_id: BWBR0016990
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0017053
  - number: '16'
    text: |-
      De producent informeert de Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer binnen 6 maanden
      na afloop van ieder kalenderjaar over de resultaten van de uitvoering van de [artikelen 7][ref1], [8][ref2],
      [9][ref3], [10][ref4], [11][ref5], [12][ref6] en [13][ref7] alsmede over de hoeveelheid op de markt gebrachte
      elektrische en elektronische apparatuur in het desbetreffende jaar, waarbij hij gebruik maakt van het in
      [bijlage 2][ref8] bij deze regeling opgenomen formulier.


