            legal_basis: Artikel 3, onder a, van de Regeling bijzondere bevoegdverklaringen JAR-66 AML
          - id: jar_66_45
            type: string
            required: false
            delegated_to: EASA
            delegation_type: INTERNATIONALE_REGELGEVING
            legal_basis: Artikel 3, onder b, van de Regeling bijzondere bevoegdverklaringen JAR-66 AML
          - id: jar_66_30
            type: string
            required: false
            delegated_to: EASA
            delegation_type: INTERNATIONALE_REGELGEVING
            legal_basis: Artikel 3, onder c, van de Regeling bijzondere bevoegdverklaringen JAR-66 AML
        execution:
