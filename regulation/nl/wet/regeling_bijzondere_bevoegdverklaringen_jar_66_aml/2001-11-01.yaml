                      operation: GREATER_THAN_OR_EQUAL
                      left:
                        source:
                          input: maximum_startmassa
                      right: 5700
                    value:
                      operation: LIST
                      items:
                        - vliegtuigen met turbinemotoren
                        - vliegtuigen met zuigermotoren
                        - helikopters met turbinemotoren
                        - helikopters met zuigermotoren
                  - default:
                      value: []
   - number: '2'
     text: |-
       Een bijzondere bevoegdverklaring, als bedoeld in [artikel 1][ref1], wordt afgegeven voor onbepaalde duur.


       [ref1]: https://wetten.overheid.nl/BWBR0021204#Artikel1
     url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel2
     references:
        - id: ref1
          bwb_id: BWBR0021204
          artikel: '1'
     machine_readable:
        execution:
          parameters:
            - name: bevoegdverklaring_type
              type: string
              required: true
              description: Type van de bijzondere bevoegdverklaring (A, B1, B2, C)
          output:
            - name: duur
              type: string
              description: Duur van de bevoegdverklaring
          actions:
            - output: duur
              value:
                operation: VALUE
                value: onbepaalde duur
   - number: '3'
     text: |-
       Een bijzondere bevoegdverklaring wordt afgegeven, nadat de aanvrager heeft aangetoond te voldoen aan de eisen
       inzake basiskennis, typekennis en ervaring voor afgifte van de bijzondere bevoegdverklaring. Deze eisen zijn
       opgenomen in het onderstaande schema:

       a. basiskennis: JAR 66.25;

       b. typekennis: JAR 66.45;

       - c. ervaring: JAR 66.30.
     url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel3
     machine_readable:
        open_terms:
          - id: jar_66_25
            type: string
            required: false
            delegated_to: EASA
