---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: regeling_bijzondere_bevoegdverklaringen_jar_66_aml
regulatory_layer: WET
publication_date: '2008-10-27'
valid_from: '2001-11-01'
bwb_id: BWBR0021204
url: https://wetten.overheid.nl/BWBR0021204/2001-11-01
preamble:
  text: |-
    Gelet op de artikelen 5, 8, eerste lid, en 38, tweede en vijfde lid, van het Besluit bewijzen van bevoegdheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#ArtikelAanhef
articles:
   - number: '1'
     text: |-
       1 De Minister kan de volgende bijzondere bevoegdverklaringen afgeven voor onderhoud aan vliegtuigen en helikopters
       met een maximum startmassa van 5700 kg of hoger:

       A voor eenvoudig lijnonderhoud en eenvoudige herstelwerkzaamheden, als bedoeld in JAR 66.20(b)(1), van vliegtuigen
       en helikopters van een klasse volgens het tweede lid;

       B1 voor lijnonderhoud met inbegrip van werkzaamheden aan de constructie, de voortstuwingsinstallatie en mechanische
       en elektrische systemen, alsmede het vervangen van elektronische componenten, als bedoeld in JAR 66.20(b)(2), van
       vliegtuigen en helikopters van een klasse volgens het tweede lid, al dan niet van een bepaald type;

       B2 voor lijnonderhoud van elektronische en elektrische systemen, als bedoeld in JAR 66.20(b)(3), van vliegtuigen en
       helikopters, al dan niet van een bepaald type;

       C voor basisonderhoud, als bedoeld in JAR 66.20(b)(4), van vliegtuigen en helikopters al dan niet van een bepaald
       type.

       2 De klassen bij de bijzondere bevoegdverklaringen A en B1, bedoeld in het eerste lid, zijn:

       1 vliegtuigen met turbinemotoren;

       2 vliegtuigen met zuigermotoren;

       3 helikopters met turbinemotoren;

       4 helikopters met zuigermotoren.
     url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel1
     machine_readable:
        open_terms:
          - id: jar_66_20_b_1
            type: string
            required: false
            delegated_to: EASA
            delegation_type: INTERNATIONALE_REGELGEVING
            legal_basis: Artikel 1, eerste lid, onderdelen A van de Regeling bijzondere bevoegdverklaringen JAR-66 AML
          - id: jar_66_20_b_2
            type: string
            required: false
            delegated_to: EASA
            delegation_type: INTERNATIONALE_REGELGEVING
            legal_basis: Artikel 1, eerste lid, onderdelen B1 van de Regeling bijzondere bevoegdverklaringen JAR-66 AML
          - id: jar_66_20_b_3
            type: string
            required: false
            delegated_to: EASA
            delegation_type: INTERNATIONALE_REGELGEVING
            legal_basis: Artikel 1, eerste lid, onderdelen B2 van de Regeling bijzondere bevoegdverklaringen JAR-66 AML
          - id: jar_66_20_b_4
            type: string
            required: false
            delegated_to: EASA
            delegation_type: INTERNATIONALE_REGELGEVING
            legal_basis: Artikel 1, eerste lid, onderdelen C van de Regeling bijzondere bevoegdverklaringen JAR-66 AML
        execution:
          parameters:
            - name: maximum_startmassa
              type: number
              required: true
              description: Maximum startmassa van het voertuig in kg
          output:
            - name: bevoegdverklaring_typen
              type: array
              description: Lijst van beschikbare bevoegdverklaring typen (A, B1, B2, C)
            - name: bevoegdverklaring_klassen
              type: array
              description: Lijst van beschikbare bevoegdverklaring klassen voor A en B1
          actions:
            - output: bevoegdverklaring_typen
              value:
                operation: IF
                cases:
                  - condition:
