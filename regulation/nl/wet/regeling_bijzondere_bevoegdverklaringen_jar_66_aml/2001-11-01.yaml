   - number: '4'
     text: |2-
       1 Krachtens [artikel 38, tweede en vijfde lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1]
       wordt tot 1 juni 2011 op aanvraag, conform JAR 66.1(g), een bijzondere bevoegdverklaring afgegeven aan personen die
       op 1 juni 2001:

       a. een certificeringsbevoegdheid als bedoeld in JAR 66.1(d) bezaten, als medewerker van een houder van een MOA, of

       b. bezig waren zich te kwalificeren voor een certificeringsbevoegdheid, als bedoeld in JAR 66.1(d), volgens de
       procedure van een houder van een MOA, als bedoeld in JAR 66.1(e).

       2 Een aanvraag bedoeld in het eerste lid, wordt ingediend onder bijsluiting van een advies dat is ondertekend door
       of namens de houder van de MOA.

       3 Op de bijzondere bevoegdverklaringen die op grond van het eerste lid worden afgegeven, kunnen beperkingen worden
       aangebracht.

       4 Voor een aanvraag bedoeld in het eerste lid worden geen kosten in rekening gebracht.


       [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel38
     url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel4
     references:
        - id: ref1
          bwb_id: BWBR0010629
          artikel: '38'
     machine_readable:
        execution:
          parameters:
            - name: datum_aanvraag
              type: date
              required: true
              description: Datum van de aanvraag voor de bijzondere bevoegdverklaring
            - name: bezat_certificeringsbevoegdheid
              type: boolean
              required: true
              description: Of de aanvrager een certificeringsbevoegdheid als bedoeld in JAR 66.1(d) bezat op 1 juni 2001
            - name: bezig_te_kwalificeren
              type: boolean
              required: true
              description: Of de aanvrager bezig was zich te kwalificeren voor een certificeringsbevoegdheid op 1 juni 2001
          output:
            - name: in_aanmerking_voor_bevoegdverklaring
              type: boolean
              description: Of de aanvrager in aanmerking komt voor een bijzondere bevoegdverklaring volgens Artikel 4
            - name: geldigheidsdatum_eind
              type: date
              description: De einddatum waarop de regeling van kracht is (1 juni 2011)
          actions:
            - output: in_aanmerking_voor_bevoegdverklaring
              value:
                operation: AND
                conditions:
                  - operation: LESS_THAN_OR_EQUAL
                    left:
                      source:
                        input: datum_aanvraag
                    right: 2011-06-01
                  - operation: OR
                    conditions:
                      - operation: VALUE
                        value:
                          source:
                            input: bezat_certificeringsbevoegdheid
                      - operation: VALUE
                        value:
                          source:
                            input: bezig_te_kwalificeren
            - output: geldigheidsdatum_eind
              value:
                operation: VALUE
                value: 2011-06-01
