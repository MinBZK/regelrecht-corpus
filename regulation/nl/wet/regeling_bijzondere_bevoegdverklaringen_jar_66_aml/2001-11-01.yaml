preamble:
  text: |-
    Gelet op de artikelen 5, 8, eerste lid, en 38, tweede en vijfde lid, van het Besluit bewijzen van bevoegdheid;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De Minister kan de volgende bijzondere bevoegdverklaringen afgeven voor onderhoud aan vliegtuigen en helikopters
      met een maximum startmassa van 5700 kg of hoger:

      A voor eenvoudig lijnonderhoud en eenvoudige herstelwerkzaamheden, als bedoeld in JAR 66.20(b)(1), van vliegtuigen
      en helikopters van een klasse volgens het tweede lid;

      B1 voor lijnonderhoud met inbegrip van werkzaamheden aan de constructie, de voortstuwingsinstallatie en mechanische
      en elektrische systemen, alsmede het vervangen van elektronische componenten, als bedoeld in JAR 66.20(b)(2), van
      vliegtuigen en helikopters van een klasse volgens het tweede lid, al dan niet van een bepaald type;

      B2 voor lijnonderhoud van elektronische en elektrische systemen, als bedoeld in JAR 66.20(b)(3), van vliegtuigen en
      helikopters, al dan niet van een bepaald type;

      C voor basisonderhoud, als bedoeld in JAR 66.20(b)(4), van vliegtuigen en helikopters al dan niet van een bepaald
      type.

      2 De klassen bij de bijzondere bevoegdverklaringen A en B1, bedoeld in het eerste lid, zijn:

      1 vliegtuigen met turbinemotoren;

      2 vliegtuigen met zuigermotoren;

      3 helikopters met turbinemotoren;

      4 helikopters met zuigermotoren.
    url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel1
  - number: '2'
    text: |-
      Een bijzondere bevoegdverklaring, als bedoeld in [artikel 1][ref1], wordt afgegeven voor onbepaalde duur.


      [ref1]: https://wetten.overheid.nl/BWBR0021204#Artikel1
    url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0021204
        artikel: '1'
  - number: '3'
    text: |-
      Een bijzondere bevoegdverklaring wordt afgegeven, nadat de aanvrager heeft aangetoond te voldoen aan de eisen
      inzake basiskennis, typekennis en ervaring voor afgifte van de bijzondere bevoegdverklaring. Deze eisen zijn
      opgenomen in het onderstaande schema:

      a. basiskennis: JAR 66.25;

      b. typekennis: JAR 66.45;

      c. ervaring: JAR 66.30.
    url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel3
  - number: '4'
    text: |-
      1 Krachtens [artikel 38, tweede en vijfde lid, van het Besluit bewijzen van bevoegdheid voor de luchtvaart][ref1]
      wordt tot 1 juni 2011 op aanvraag, conform JAR 66.1(g), een bijzondere bevoegdverklaring afgegeven aan personen die
      op 1 juni 2001:

      a. een certificeringsbevoegdheid als bedoeld in JAR 66.1(d) bezaten, als medewerker van een houder van een MOA, of

      b. bezig waren zich te kwalificeren voor een certificeringsbevoegdheid, als bedoeld in JAR 66.1(d), volgens de
      procedure van een houder van een MOA, als bedoeld in JAR 66.1(e).

      c ervaring: JAR 66.30.

      2 Een aanvraag bedoeld in het eerste lid, wordt ingediend onder bijsluiting van een advies dat is ondertekend door
      of namens de houder van de MOA.

      3 Op de bijzondere bevoegdverklaringen die op grond van het eerste lid worden afgegeven, kunnen beperkingen worden
      aangebracht.

      4 Voor een aanvraag bedoeld in het eerste lid worden geen kosten in rekening gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0010629#Artikel38
    url: https://wetten.overheid.nl/BWBR0021204/2001-11-01#Artikel4
