  - number: '8'
    text: |-
      Indien betrokkene op de datum van zijn ambtsjubileum buitengewoon verlof mede in het algemeen belang zonder behoud
      van bezoldiging, ouderschapsverlof of levensloopverlof geniet, wordt voor de berekening van zijn gratificatie
      uitgegaan van de berekeningsgrondslag die gold direct voorafgaand aan het verlof.
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel8
  - number: '9'
    text: |-
      Het bevoegd gezag kan afwijken van de bepalingen in deze regeling voor zover toepassing zal leiden tot een
      onbillijkheid van overwegende aard voor betrokkene.
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel9
  - number: '10'
    text: |-
      Bij de toekenning van een diensttijdgratificatie bij een ontslag dat tussen 1 januari 2014 en 1 juli 2014 is verleend
      op grond van [artikel 98, eerste lid, aanhef en onderdeel f, van het Algemeen Rijksambtenarenreglement][ref1]
      of [artikel 129, eerste lid, aanhef en onderdeel f van het Ambtenarenreglement Staten-Generaal][ref2], wordt de
      berekeningsgrondslag, die tussen 1 januari 2014 en 1 juli 2014 van toepassing was, vermenigvuldigd met een breuk,
      waarvan de teller overeenkomt met het aantal uren waarvoor de ambtenaar ontslag is verleend en de noemer met het
      aantal uren waarvoor hij voorafgaand aan het ontslag was aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001950#Artikel98
      [ref2]: https://wetten.overheid.nl/BWBR0003229#Artikel129
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel10
