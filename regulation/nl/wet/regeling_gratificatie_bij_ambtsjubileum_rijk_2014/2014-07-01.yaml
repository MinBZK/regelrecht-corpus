preamble:
  text: |-
    Gelet op artikel 79, eerste lid, van het Algemeen Rijksambtenarenreglement en artikel 114, eerste lid, van het
    Ambtenarenreglement Staten-Generaal;

    BESLUIT:
  url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. *betrokkene:*

      1° ambtenaar in de zin van het [Algemeen Rijksambtenarenreglement][ref1], of

      2° ambtenaar in de zin van het [Ambtenarenreglement Staten-Generaal][ref2];

      b. *ambtsjubileum:* het bereiken van een diensttijd van 12½, 25, 40 of 50 jaar;

      c. *gratificatie:* beloning bij ambtsjubileum;

      d. *diensttijdgratificatie:* gratificatie als bedoeld in
      [artikel 79, tweede lid, van het Algemeen Rijksambtenarenreglement][ref3] of
      [artikel 114, tweede lid, van het Ambtenarenreglement Staten-Generaal][ref4];

      e. *arbeidsduurfactor:* een breuk, waarvan de teller bestaat uit de voor betrokkene vastgestelde arbeidsduur en de
      noemer bestaat uit het getal 36.


      [ref1]: https://wetten.overheid.nl/BWBR0001950
      [ref2]: https://wetten.overheid.nl/BWBR0003229
      [ref3]: https://wetten.overheid.nl/BWBR0001950#Artikel79
      [ref4]: https://wetten.overheid.nl/BWBR0003229#Artikel114
