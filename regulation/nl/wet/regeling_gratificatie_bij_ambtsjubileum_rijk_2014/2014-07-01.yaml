  - number: '5'
    text: |-
      Als diensttijd voor een ambtsjubileum geldt niet:

      a. de dienstijd die niet in actieve dienst is doorgebracht wegens het bekleden van een politiek ambt, en

      b. de diensttijd die, zonder dat werkzaamheden zijn verricht, is doorgebracht zonder inkomsten uit de
      dienstbetrekking, met uitzondering van de tijd gedurende welke betrokkene mede in het algemeen belang buitengewoon
      verlof dan wel ouderschapsverlof of levensloopverlof heeft genoten.
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel5
  - number: '6'
    text: |-
      1 De gratificatie bedraagt bij een ambtsjubileum van 12½, 25, 40 of 50 jaar, respectievelijk 25%, 70%, 100% en 100%
      van de berekeningsgrondslag, bedoeld in [artikel 7, eerste en tweede lid][ref1], naar boven af te ronden op een
      veelvoud van € 2,50.

      2 Indien aan betrokkene bij een hem uit een eerdere betrekking verleend ontslag een diensttijdgratificatie is
      toegekend of een daarmee overeenkomende uitkering, wordt de in het eerste lid genoemde gratificatie verminderd
      met het bedrag van die eerder toegekende diensttijdgratificatie of daarmee overeenkomende uitkering voor zover
      dat bedrag betrekking heeft op de omvang van de betrekking en de diensttijd waarover de diensttijdgratificatie
      is berekend.


      [ref1]: https://wetten.overheid.nl/BWBR0035124#Artikel7
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035124
        artikel: '7'
  - number: '7'
    text: |-
      1 De berekeningsgrondslag voor een gratificatie is de bezoldiging, bedoeld in
      [artikel 2, onderdeel f, van het Bezoldigingsbesluit Burgerlijke Rijksambtenaren 1984][ref1], welke voor
      betrokkene op de datum van het ambtsjubileum geldt, met dien verstande dat het salaris wordt vermenigvuldigd
      met de gewogen gemiddelde arbeidsduurfactor van de diensttijd bij de sector Rijk in de vijf jaar
      voorafgaand aan de datum van het ambtsjubileum, vermeerderd met de daarop betrekking hebbende vakantie-
      uitkering, bedoeld in [artikel 21 van genoemd besluit][ref2], en de eindejaarsuitkering, bedoeld in
      [artikel 20a van genoemd besluit][ref3].

      2 In zoverre de bezoldiging niet in een vast bedrag per maand kan worden uitgedrukt, wordt gerekend met het bedrag
      dat betrokkene over de drie kalendermaanden voorafgaande aan zijn ambtsjubileum gemiddeld per maand heeft genoten.

      3 De berekeningsgrondslag, bedoeld in het eerste en tweede lid, wordt bij de
      toekenning van een diensttijdgratificatie bij een ontslag dat is verleend op grond van
      [artikel 98, eerste lid, aanhef en onderdeel f, van het Algemeen Rijksambtenarenreglement][ref4] of
      [artikel 129, eerste lid, aanhef en onderdeel f, van het Ambtenarenreglement Staten-Generaal][ref5],
      vermenigvuldigd met een breuk, waarvan de teller overeenkomt met het aantal uren waarvoor de ambtenaar ontslag is
      verleend en de noemer met het aantal uren waarvoor hij voorafgaand aan het ontslag was aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003630#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003630#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0003630#Artikel20a
      [ref4]: https://wetten.overheid.nl/BWBR0001950#Artikel98
      [ref5]: https://wetten.overheid.nl/BWBR0003229#Artikel129
