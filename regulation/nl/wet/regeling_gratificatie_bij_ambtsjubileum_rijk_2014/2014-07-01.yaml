  - number: '2'
    text: |-
      1 Aan betrokkene wordt bij een ambtsjubileum een gratificatie toegekend.

      2 Het bepaalde in het eerste lid geldt voor iedere functie waarin betrokkene als zodanig werkzaam is.
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel2
  - number: '3'
    text: |-
      1 Toekenning van een gratificatie vindt niet plaats indien:

      a. betrokkene ter zake van zijn dienstvervulling reeds een gratificatie of een uitkering welke naar haar aard
      daarmee overeenkomt, heeft ontvangen, of

      b. betrokkene jubileert tijdens een hem mede in het algemeen belang verleend buitengewoon verlof.

      2 Toekenning van de gratificatie in geval van het eerste lid, onderdeel b, geschiedt alsnog zodra betrokkene na de
      beëindiging van het verlof zijn werkzaamheden heeft hervat, tenzij hij tijdens het verlof reeds een gratificatie of
      een uitkering welke naar haar aard daarmee overeenkomt heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel3
  - number: '4'
    text: |-
      1 Als diensttijd voor een ambtsjubileum geldt:

      a. de vanaf 1 juli 2014 als overheidswerknemer als bedoeld in [artikel 2 van de Wet privatisering ABP][ref1]
      doorgebrachte tijd, en

      b. de voor 1 juli 2014 doorgebrachte tijd:

      1° in een burgerlijke dienstbetrekking bij de Nederlandse overheid;

      2° in een betrekking (vóór 1 januari 1966) als bedoeld in artikel 4, eerste lid, van de Pensioenwet 1922 (Stb.
      1922, 240), een betrekking als bedoeld in artikel B2 van de Algemene burgerlijke pensioenwet (Stb. 1966, 6) of een
      betrekking als bedoeld in artikel B3 van evengenoemde wet, alsmede (vóór en na 1 januari 1966) in een betrekking
      als bedoeld in artikel U2 van die wet;

      3° in burgerlijke dienst bij de overheid in de landen Suriname (tot 25 november 1975), de Nederlandse Antillen (tot
      10 oktober 2010), Aruba, Curaçao en Sint Maarten en de openbare lichamen Bonaire, Sint Eustatius en Saba;

      4° in dienst bij het niet-openbaar onderwijs in de onder 3° genoemde landen en openbare lichamen, voor zover dat
      betrokkene onder de werkingssfeer van een overheidspensioenregeling bracht of zou hebben gebracht indien hij in
      vaste dienst was geweest, en

      5° in Nederlandse militaire dienst of daarmee voor de toepassing van het [Algemeen Rijksambtenarenreglement][ref2]
      gelijkgestelde dienst, waaronder begrepen dienst bij het voormalig KNIL en de troepen in de landen Suriname (tot
      25 november 1975), de Nederlandse Antillen (tot 10 oktober 2010), Aruba, Curaçao en Sint Maarten en de openbare
      lichamen Bonaire, Sint Eustatius en Saba.

      2 Diensttijd die gelijktijdig in meer dan één betrekking is doorgebracht, telt voor de vaststelling van de
      diensttijd voor het toekennen van een gratificatie slechts eenmaal mee.


      [ref1]: https://wetten.overheid.nl/BWBR0007791#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001950
    url: https://wetten.overheid.nl/BWBR0035124/2014-07-01#Artikel4
