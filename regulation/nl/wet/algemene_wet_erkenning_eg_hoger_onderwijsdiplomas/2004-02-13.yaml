valid_from: '2004-02-13'
bwb_id: BWBR0006317
url: https://wetten.overheid.nl/BWBR0006317/2004-02-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is bij de wet regels te stellen ter uitvoering van
    richtlijn 89/48/EEG van de Raad van de Europese Gemeenschappen van 21 december 1988 betreffende een algemeen
    stelsel van erkenning van hoger-onderwijsdiploma’s waarmee beroepsopleidingen van ten minste drie jaar worden
    afgesloten (PbEG L 019);

    dat deze regels ten aanzien van onderdanen van de Lid-Staten van de Europese Gemeenschappen de toelating moeten
    waarborgen tot beroepen waarvoor in Nederland een dergelijk nationaal diploma wordt vereist, indien deze onderdanen
    in één van de overige Lid-Staten gerechtigd zijn overeenkomstige beroepen uit te oefenen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, voorzover niet anders bepaald, verstaan onder: a. Onze
      minister: 'Onze Minister van Onderwijs, Cultuur en Wetenschap; b. hoger-onderwijsopleiding: een voltijdse opleiding'
      op het niveau van het hoger onderwijs met een cursusduur van ten minste drie jaren dan wel een daarmee naar
      niveau en studielast overeenkomende deeltijdse opleiding, in voorkomende gevallen gevolgd door een aanvullende
      beroepsopleiding; c. richtlijn: [Richtlijn nr. 89/48/EEG](31989L0048) van de Raad van de Europese Gemeenschappen
      van 21 december 1988, betreffende een algemeen stelsel van erkenning van hoger-onderwijsdiploma’s waarmee
      beroepsopleidingen van ten minste drie jaar worden afgesloten (PbEG 1989, L 19), naar de tekst zoals deze bij
      die richtlijn is vastgesteld; d. beroep: een gereglementeerd beroep, omvattende een geheel van activiteiten, al
      dan niet in loondienst verricht, waarvoor 1. bij of krachtens wet voor de toelating of voor het voeren van een
      beroepstitel, dan wel 2. indien het beroepen in de gezondheidszorg betreft, krachtens het nationale stelsel van
      sociale zekerheid voor het voor bezoldiging of vergoeding in aanmerking brengen, als vereiste is gesteld het bezit
      van een nationaal getuigschrift verkregen op grond van een voltooide hoger-onderwijsopleiding; e. Lid-Staat: een
      Lid-Staat van de Europese Gemeenschappen of een andere Staat die partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte; f. beroepservaring: de daadwerkelijke en geoorloofde uitoefening van het betrokken
      beroep in een Lid-Staat; g. EG-verklaring: een verklaring als bedoeld in [artikel 8, tweede lid][ref1]; h.
      gereglementeerde opleiding: een hoger-onderwijsopleiding die: specifiek gericht is op een bepaald beroep,
      en bestaat uit een studiecyclus, in voorkomend geval aangevuld met een beroepsopleiding, beroepsstage of
      praktijkervaring, waarvan structuur en niveau bij of krachtens wet zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel8
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '2'
    text: |-
      Een diploma is een bewijsstuk, dan wel een geheel van bewijsstukken, afgegeven in een Lid-Staat anders dan
      Nederland door het daartoe bij of krachtens wet in die Lid-Staat bevoegde gezag, waaruit blijkt dat de bezitter
      voldoet aan de in die Lid-Staat bij of krachtens wet voor de toelating tot een beroep gestelde opleidingsvereisten
      door middel van:
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel2
  - number: 2.a
    text: |-
      een overwegend in een Lid-Staat genoten en in de in de aanhef bedoelde Lid-Staat met goed gevolg afgesloten hoger-
      onderwijsopleiding, of
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel2
  - number: 2.b.1
    text: |-
      een in een Lid-Staat anders dan Nederland genoten en met goed gevolg afgesloten opleiding anders dan een hoger-
      onderwijsopleiding, dan wel
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel2
  - number: 2.b.2
    text: |-
      een in overeenstemming met de opleidingsvereisten voor de toelating tot het beroep in de in de aanhef bedoelde
      Lid-Staat opgedane beroepservaring van ten minste drie jaren, na een in een derde land met goed gevolg afgesloten
      hoger-onderwijsopleiding,
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel2
  - number: '3'
    text: |-
      Indien in de Lid-Staat waar betrokkene een beroep uitoefent dan wel heeft uitgeoefend, voor de toelating tot dat
      beroep geen diploma als bedoeld in [artikel 2][ref1] is vereist, geldt als diploma in de zin van deze wet een
      bewijsstuk, dan wel een geheel van bewijsstukken, a. afgegeven door het daartoe bij of krachtens wet in die Lid-
      Staat bevoegde gezag, b. met betrekking tot 1. een in een Lid-Staat anders dan Nederland met goed gevolg afgesloten
      hoger-onderwijsopleiding, dan wel 2. een in een Lid-Staat anders dan Nederland met goed gevolg afgesloten opleiding
      die door de Lid-Staat, bedoeld in de aanhef, als gelijkwaardig met een opleiding als bedoeld onder 1 wordt
      aangemerkt, mits de andere Lid-Staten en de Commissie van de Europese Gemeenschappen van deze gelijkwaardigheid
      in kennis zijn gesteld, die hem op de betrokken beroepsuitoefening heeft voorbereid, en c. waaruit blijkt dat
      betrokkene in de tien jaren voorafgaand aan een aanvraag als bedoeld in [artikel 8, eerste lid][ref2], in de in
      de aanhef bedoelde Lid-Staat gedurende ten minste twee jaren voltijds of gedurende een gelijkwaardige periode
      deeltijds het betrokken beroep heeft uitgeoefend; geen beroepservaring is vereist indien betrokkene met goed gevolg
      een gereglementeerde opleiding heeft afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel8
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006317
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Deze wet is van toepassing op beroepen als bedoeld in [artikel 1, onder d][ref1], tenzij bij of krachtens wet ten
      aanzien van een beroep is geïmplementeerd:


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel1
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '1'
        hoofdstuk: I
  - number: 4.1.a
    text: de richtlijn, dan wel
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel4
  - number: 4.1.b
    text: |-
      een separate Richtlijn inzake de onderlinge erkenning van de diploma’s, certificaten en andere titels die de Raad
      van de Europese Gemeenschappen ten aanzien van het betrokken beroep heeft vastgesteld.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel4
  - number: '4.2'
    text: Onze minister doet mededeling in de *Staatscourant* op welke beroepen deze wet in ieder geval van toepassing is.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel4
  - number: '5'
    text: |-
      Een onderdaan van een Lid-Staat die ten aanzien van een beroep in het bezit is van een EG-verklaring, voldoet aan
      de in Nederland bij of krachtens wet voor de toelating tot het betreffende beroep gestelde opleidingsvereisten.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel5
  - number: '6.1'
    text: |-
      Onze minister die het aangaat, is bevoegd tot afgifte van een EG-verklaring aan een onderdaan van een Lid-Staat die
      toelating tot een beroep in Nederland verlangt.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel6
  - number: '6.2'
    text: |-
      Bij algemene maatregel van bestuur, op de voordracht van Onze minister, mede namens Onze minister die het aangaat,
      kan ten aanzien van een beroep, in afwijking van het in het eerste lid bepaalde, een andere bevoegde autoriteit
      worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel6
  - number: '7.1'
    text: 'Indien de toelating tot een beroep mede afhankelijk is gesteld van:'
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: 7.1.a
    text: |-
      een verklaring omtrent het gedrag, afgegeven volgens de
      [Wet op de justitiële documentatie en op de verklaringen omtrent het gedrag][ref1] (*Stb.* 1955, 395),


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: 7.1.b
    text: |-
      een document waaruit blijkt dat betrokkene niet in staat van faillissement heeft verkeerd, noch ten aanzien van hem
      de schuldsaneringsregeling natuurlijke personen van toepassing is geweest, dan wel
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: 7.1.c
    text: een document betreffende de lichamelijke of geestelijke gezondheid,
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: '7.2'
    text: 'Indien in de Lid-Staat van oorsprong of herkomst een met de in het eerste lid bedoelde:'
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: 7.2.a
    text: verklaring omtrent het gedrag,
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: 7.2.b
    text: |-
      document waaruit blijkt dat betrokkene in het kader van de uitoefening van zijn beroep niet tuchtrechtelijk is
      veroordeeld, dan wel
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: 7.2.c
    text: |-
      een document waaruit blijkt dat betrokkene niet in staat van faillissement heeft verkeerd, noch ten aanzien van hem
      de schuldsaneringsregeling natuurlijke personen van toepassing is geweest,
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: '7.3'
    text: |-
      Indien in de Lid-Staat van oorsprong of herkomst een met de in het eerste lid bedoelde verklaring betreffende
      de lichamelijke of geestelijke gezondheid overeenkomend document niet wordt verlangd, kan betrokkene volstaan
      met een in die Lid-Staat door een bevoegde instantie afgegeven verklaring, die overeenstemt met de in Nederland
      gebruikelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: '7.4'
    text: |-
      Indien een bewijs van financiële draagkracht is vereist voor de toegang tot of de uitoefening van een
      gereglementeerd beroep, zijn attesten die zijn afgegeven door een financiële instelling in de lidstaat van
      oorsprong of herkomst gelijkwaardig aan die welke in Nederland worden afgegeven.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: '7.5'
    text: |-
      Indien Onze Minister die het aangaat, van een eigen onderdaan die toelating verlangt tot een gereglementeerd
      beroep, eist dat deze verzekerd is tegen de financiële risico's van zijn beroepsaansprakelijkheid, aanvaardt hij
      een attest van een verzekeraar in een andere lidstaat als gelijkwaardig aan een attest dat in Nederland wordt
      afgegeven. Het attest vermeldt dat de verzekeraar de in Nederland van kracht zijnde bepalingen heeft nageleefd voor
      wat betreft de voorwaarden en de reikwijdte van de dekking.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
  - number: '7.6'
    text: |-
      De in het eerste, tweede, derde en vijfde lid bedoelde verklaringen, documenten of attesten mogen bij indiening van
      een aanvraag als bedoeld in [artikel 8, eerste lid][ref1], niet ouder zijn dan drie maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel8
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Een onderdaan van een Lid-Staat die in Nederland wil worden toegelaten tot een beroep, kan bij de bevoegde
      autoriteit een aanvraag indienen tot het verkrijgen van een EG-verklaring.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
  - number: '8.2'
    text: |-
      De bevoegde autoriteit geeft een EG-verklaring af aan aanvrager indien betrokkene in het bezit is van een diploma
      als bedoeld in [artikel 2][ref1] dan wel [artikel 3][ref2], en tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel3
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006317
        artikel: '3'
        hoofdstuk: I
  - number: 8.2.a
    text: |-
      aan betrokkene geen aanvullende vereisten worden gesteld op grond van [artikel 9][ref1] of op grond van
      [artikel 10][ref2], dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel10
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '9'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0006317
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: 8.2.b
    text: |-
      binnen vier weken nadat betrokkene ten genoegen van de bevoegde autoriteit heeft aangetoond dat hij aan de hiervoor
      onder *a* bedoelde aanvullende vereisten heeft voldaan.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
  - number: '8.3'
    text: |-
      Aan aanvrager wordt binnen de in [artikel 12][ref1] bedoelde termijn bekendgemaakt of de beschikking van de
      bevoegde autoriteit betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel12
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '12'
        hoofdstuk: II
        paragraaf: '2'
  - number: 8.3.a
    text: een afwijzing van de aanvraag,
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
  - number: 8.3.b
    text: een toewijzing van de aanvraag, dan wel
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
  - number: 8.3.c
    text: het stellen van aanvullende vereisten als bedoeld in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel8
  - number: '9.1'
    text: |-
      Indien de duur van de door aanvrager gevolgde hoger-onderwijsopleiding ten minste een jaar korter is dan de in
      Nederland bij of krachtens wet voor de toelating tot het betrokken beroep vereiste opleiding, kan de bevoegde
      autoriteit van aanvrager eisen dat hij aantoont te beschikken over beroepservaring. Bij een aanvrager die een
      deeltijdse opleiding dan wel een opleiding als bedoeld in [artikel 2, onder b][ref1], heeft gevolgd, wordt in
      afwijking van het bepaalde in de eerste volzin niet uitgegaan van de duur van de door hem gevolgde opleiding, maar
      van de voltijdse duur van de opleiding als bedoeld in [artikel 2, onder a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006317#Artikel2
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '2'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0006317
        artikel: '2'
        hoofdstuk: I
  - number: '9.2'
    text: |-
      Op grond van het eerste lid kan ten hoogste vier jaren beroepservaring worden verlangd, met dien verstande dat
      geëist mag worden:
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel9
  - number: 9.2.a
    text: |-
      een beroepservaring gedurende een periode die het dubbele bedraagt van de ontbrekende periode, wanneer deze periode
      betrekking heeft op een opleiding op het niveau van het hoger onderwijs dan wel op een met een examen af te sluiten
      stage onder toezicht;
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel9
  - number: 9.2.b
    text: |-
      een beroepservaring gedurende een periode die gelijk is aan de ontbrekende periode, wanneer deze periode betrekking
      heeft op praktijkervaring opgedaan onder begeleiding van een geschoolde beroepsbeoefenaar.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel9
  - number: '9.3'
    text: |-
      De beroepservaring, bedoeld in [artikel 3, onder c][ref1], geldt als beroepservaring als bedoeld in dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel3
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '3'
        hoofdstuk: I
  - number: '9.4'
    text: |-
      Dit artikel vindt geen toepassing indien ten aanzien van aanvrager met het oog op de toelating tot het
      desbetreffende beroep toepassing is gegeven aan [artikel 10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006317#Artikel10
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0006317
        artikel: '10'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.1'
    text: |-
      Indien de door aanvrager gevolgde hoger-onderwijsopleiding betrekking heeft op vakgebieden die wezenlijk
      verschillen van die welke worden bestreken door de in Nederland voor de toelating tot het betreffende beroep bij of
      krachtens wet vereiste opleiding, kan de bevoegde autoriteit van aanvrager verlangen dat hij een aanpassingsstage
      van ten hoogste drie jaren volgt dan wel een proeve van bekwaamheid aflegt. Indien de bevoegde autoriteit van
      aanvrager verlangt een aanpassingsstage te doorlopen of een proeve van bekwaamheid af te leggen, gaat de bevoegde
      autoriteit eerst na of de kennis die aanvrager tijdens zijn beroepservaring heeft verworven, van dien aard is dat
      het wezenlijke verschil, bedoeld in de eerste volzin, daardoor geheel of ten dele wordt ondervangen.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel10
  - number: '10.2'
    text: |-
      Onder een aanpassingsstage wordt verstaan de uitoefening in Nederland van een beroep onder verantwoordelijkheid
      van een gekwalificeerde beoefenaar van het betrokken beroep, met in voorkomende gevallen een aanvullende opleiding,
      teneinde te kunnen beoordelen of aanvrager voldoende bekwaamheid bezit om het desbetreffende beroep uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel10
  - number: '10.3'
    text: |-
      Onder een proeve van bekwaamheid wordt verstaan een toets inzake de beroepskennis van aanvrager met betrekking
      tot vakgebieden die niet worden bestreken door de door aanvrager gevolgde opleiding en die wezenlijk zijn voor de
      uitoefening van het beroep in Nederland, teneinde te kunnen beoordelen of aanvrager voldoende bekwaamheid bezit om
      het desbetreffende beroep uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel10
  - number: '10.4'
    text: Aanvrager wordt de keuze gelaten of hij een aanpassingsstage doorloopt dan wel een proeve van bekwaamheid aflegt.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel10
  - number: '10.5'
    text: |-
      Indien voor het uitoefenen van het beroep waarvoor een EG-verklaring wordt gevraagd, precieze kennis van onderdelen
      van het Nederlands recht is vereist en het verstrekken van adviezen of het verlenen van bijstand op het gebied van
      het Nederlands recht een wezenlijk en vast onderdeel van de uitoefening van het beroep vormt, wordt in afwijking
      van het vierde lid het afleggen van een proeve van bekwaamheid met betrekking tot die kennis als aanvullend
      vereiste gesteld.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel10
  - number: '10.6'
    text: |-
      Bij algemene maatregel van bestuur kunnen andere dan de in het vijfde lid bedoelde beroepen worden aangewezen
      waarvoor de bevoegde autoriteit een uitzondering kan maken op het in het vierde lid bedoelde keuzerecht van de
      aanvrager.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel10
  - number: '11'
    text: |-
      Onze minister die het aangaat geeft per beroep regels ten aanzien van de aanvraag tot het verkrijgen van een EG-
      verklaring, de aanpassingsstage en de proeve van bekwaamheid. Deze regels hebben in ieder geval betrekking op de
      documenten die bij de aanvraag moeten worden gevoegd alsmede op de beoordeling van de aanpassingsstage en de proeve
      van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel11
  - number: '12'
    text: De bevoegde autoriteit beslist over de aanvraag binnen vier maanden nadat zij de aanvraag heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0006317/2004-02-13#Artikel12
  - number: '32'
    text: |-
