  - number: '10'
    text: |-
      Bij de aanvraag, bedoeld in [artikel 9, eerste lid][ref1], overlegt de aanvrager:

      a. de documenten, bedoeld in [artikel 13, eerste lid, onderdelen a tot en met c en e, van de wet][ref2], en

      b. indien de aanvraag en de documenten bedoeld in [artikel 13, eerste lid, onder b, c en e van de wet][ref3] in een
      andere dan de Nederlandse, Duitse of Engelse taal zijn gesteld, een door een beëdigde tolk of vertaler opgestelde
      vertaling daarvan in één van deze talen.


