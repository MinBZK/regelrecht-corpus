  - number: '13'
    text: |-
      1 Een dienstverrichter als bedoeld in [artikel 21 van de wet][ref1] verstrekt voorafgaand aan de eerste
      dienstverrichting aan het Centraal Informatiepunt Beroepen Gezondheidszorg de documenten, bedoeld in
      [artikel 23, eerste lid en derde lid, onderdelen a tot en met d, van de wet][ref2].

      2 Het eerste lid is slechts van toepassing op dienstverrichters wat betreft de uitoefening van de diergeneeskunde,
      bedoeld in [artikel 2][ref3], [5][ref4], [9][ref5], [13][ref6] en [13a van het Besluit paraveterinairen][ref7].


