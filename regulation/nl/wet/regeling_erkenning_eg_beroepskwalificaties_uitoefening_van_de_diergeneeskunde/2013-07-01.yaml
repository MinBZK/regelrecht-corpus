  - number: '9'
    text: |-
      1 Een aanvraag tot het verkrijgen van erkenning van beroepskwalificaties voor de toegang tot de
      uitoefening van de diergeneeskunde, bedoeld in [artikel 2][ref1], [5][ref2], [9][ref3], [13][ref4] en
      [13a van het Besluit paraveterinairen][ref5], wordt ingediend bij het Centraal Informatiepunt Beroepen
      Gezondheidszorg.

      2 Een aanvraag als bedoeld in het eerste lid, wordt tevens aangemerkt als een verzoek om toelating als bedoeld in
      [artikel 14 van het Besluit paraveterinairen][ref6].

      3 [Artikel 19 van de Regeling paraveterinairen][ref7] is niet van toepassing op aanvragen als bedoeld in het eerste
      lid.


