  - number: '11'
    text: |-
      1 In het geval de Minister op grond van [artikel 11 van de wet][ref1] een compenserende maatregel noodzakelijk
      vindt en de aanvrager voor een proeve van bekwaamheid kiest, wordt de aanvrager meegedeeld:

      a. de vakken waarop de proeve van bekwaamheid betrekking heeft;

      b. de wijze waarop de proeve van bekwaamheid wordt afgenomen;

      c. de kosten van de proeve.

      2 De Minister deelt het resultaat van de proeve van bekwaamheid zo spoedig mogelijk mee aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel11
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel11
