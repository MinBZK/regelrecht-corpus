preamble:
  text: |-
    Gelet op de artikelen 3, eerste en tweede lid, en 4 van de Wet op de uitoefening van de Diergeneeskunde 1990 en
    artikel 33 van de Algemene wet erkenning EG-beroepskwalificaties;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. wet: [Algemene wet erkenning EG-beroepskwalificaties][ref1];

      b. [richtlijn nr. 2005/36/EG](32005L0036): [Richtlijn nr. 2005/36/EG](32005L0036) van het Europees Parlement en de
      Raad van 7 september 2005 betreffende de erkenning van beroepskwalificaties (PbEU L 255);

      c. Minister: Minister van Landbouw, Natuur en Voedselkwaliteit;

      d. opleidingstitel: diploma, certificaat of andere titel die door een daartoe aangewezen bevoegde autoriteit van
      een betrokken staat, is afgegeven ter afsluiting van een beroepsopleiding.

      e. betrokken staat: lidstaat van de Europese Unie, een andere staat die partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte, of Zwitserland.


      [ref1]: https://wetten.overheid.nl/BWBR0023066
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0023066
  - number: '2'
    text: |-
      Tot de uitoefening van de diergeneeskunde in haar volle omvang zijn toegelaten personen die in het bezit zijn van
      een opleidingstitel van dierenarts als bedoeld in artikel 21, eerste lid, in samenhang met Bijlage V, onder 5.4.2,
      van [Richtlijn nr. 2005/36/EG](32005L0036).
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel2
  - number: '3'
    text: |-
      1 Indien de opleidingstitel, bedoeld in [artikel 2][ref1], is afgegeven ter afsluiting van een opleiding die is
      begonnen vóór de referentiedatum, genoemd in Bijlage V, onder 5.4.2, van [richtlijn nr. 2005/36/EG](32005L0036),
      wordt de bezitter van die opleidingstitel slechts toegelaten, mits de opleidingstitel vergezeld gaat van een
      officieel gewaarmerkte verklaring, waarin wordt bevestigd dat de bezitter van de opleidingstitel de werkzaamheden
      van dierenarts gedurende ten minste drie opeenvolgende jaren tijdens de vijf jaren voorafgaande aan de afgifte van
      de verklaring daadwerkelijk en op wettige wijze heeft uitgeoefend.

      2 Indien de opleidingstitel, bedoeld in [artikel 2][ref2], niet voldoet aan de benaming, genoemd in Bijlage V, punt
      5.4.2, wordt de bezitter van die opleidingstitel slechts toegelaten, mits de opleidingstitel vergezeld gaat van
      een officieel gewaarmerkte verklaring, waarin wordt bevestigd dat de opleidingstitel is afgegeven ter afsluiting
      van een opleiding die in overeenstemming is met de voorschriften van artikel 38 van [richtlijn nr. 2005/36/EG]
      (32005L0036).

      3 De verklaring, bedoeld in het eerste en tweede lid, is afgegeven door de bevoegde autoriteit van de betrokken
      staat.

      4 Het eerste en derde lid zijn van overeenkomstige toepassing op personen die in het bezit zijn van een
      opleidingstitel van dierenarts die voor 3 oktober 1990 is afgegeven door de voormalige Duitse Democratische
      Republiek, of ter verwerving waarvan de opleiding vóór die datum in dat land is begonnen.


      [ref1]: https://wetten.overheid.nl/BWBR0024505#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0024505#Artikel2
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel3
    references:
      - id: ref1
