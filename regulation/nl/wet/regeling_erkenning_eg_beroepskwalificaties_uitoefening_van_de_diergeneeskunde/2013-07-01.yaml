  - number: '4'
    text: |-
      Tot de uitoefening van de diergeneeskunde in haar volle omvang zijn tevens toegelaten personen die in het bezit
      zijn van een opleidingstitel van dierenarts, welke voor 1 januari 1993 is afgegeven door het voormalige Tsjecho-
      Slowakije, of ter verwerving waarvan de opleiding vóór die datum in dat land is begonnen, mits die opleidingstitel
      vergezeld gaat van officieel gewaarmerkte verklaringen van de bevoegde autoriteiten van Tsjechië of Slowakije,
      waarin wordt bevestigd dat:

      a. de opleidingstitel, wat betreft de toegang tot de uitoefening van diergeneeskunde in haar volle omvang, op
      Tsjechisch, respectievelijk Slowaaks grondgebied dezelfde rechtsgeldigheid heeft als de Tsjechische respectievelijk
      Slowaakse opleidingstitel van dierenarts, en

      b. de bezitter van de opleidingstitel de werkzaamheden van dierenarts gedurende ten minste drie opeenvolgende
      jaren tijdens de vijf jaren voorafgaande aan de afgifte van de verklaring daadwerkelijk en op wettige wijze heeft
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel4
  - number: '5'
    text: |-
      1 Tot de uitoefening van de diergeneeskunde in haar volle omvang zijn tevens toegelaten personen die in het bezit
      zijn van een opleidingstitel van dierenarts die is afgegeven door de voormalige Sovjet-Unie of ter verwerving
      waarvan de opleiding in Estland is aangevangen vóór 20 augustus 1991, mits die opleidingstitel vergezeld gaat van
      een officieel gewaarmerkte verklaring, waarin door de Estlandse autoriteiten wordt bevestigd dat:

      a. de opleidingstitel, wat betreft de toegang tot de uitoefening van de diergeneeskunde in haar volle omvang op het
      grondgebied van Estland dezelfde rechtsgeldigheid heeft als de Estlandse opleidingstitel van dierenarts, en

      b. de bezitter van de opleidingstitel de werkzaamheden van dierenarts gedurende ten minste vijf opeenvolgende
      jaren tijdens de zeven jaren voorafgaande aan de afgifte van de verklaring daadwerkelijk en op wettige wijze heeft
      uitgeoefend.

      2 Tot de uitoefening van de diergeneeskunde in haar volle omvang zijn tevens toegelaten personen die in het
      bezit zijn van een opleidingstitel van dierenarts die is afgegeven door Estland of wier opleiding vóór 1 mei 2004
      in Estland is aangevangen, mits die opleidingstitel vergezeld gaat van een officieel gewaarmerkte verklaring,
      waarin door de Estlandse autoriteiten wordt bevestigd dat de bezitter van de opleidingstitel de werkzaamheden van
      dierenarts gedurende ten minste vijf opeenvolgende jaren tijdens de zeven jaren voorafgaande aan de afgifte van de
      verklaring daadwerkelijk en op wettige wijze op Estlands grondgebied heeft uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel5
  - number: '6'
    text: |-
      Tot de uitoefening van de diergeneeskunde in haar volle omvang zijn tevens toegelaten personen die in het bezit
      zijn een opleidingstitel van dierenarts die is afgegeven door de voormalige Sovjet-Unie of ter verwerving waarvan
      de opleiding in Letland is aangevangen vóór 21 augustus 1991, mits die opleidingstitel vergezeld gaat van een
      officieel gewaarmerkte verklaring, waarin door de Letlandse autoriteiten wordt bevestigd dat:

      a. de opleidingstitel, wat betreft de toegang tot de uitoefening van de diergeneeskunde in haar volle omvang op het
      grondgebied van Letland dezelfde rechtsgeldigheid heeft als de Letlandse opleidingstitel van dierenarts, en

      b. de bezitter van de opleidingstitel de werkzaamheden van dierenarts gedurende ten minste drie opeenvolgende
      jaren tijdens de vijf jaren voorafgaande aan de afgifte van de verklaring daadwerkelijk en op wettige wijze heeft
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel6
  - number: '7'
    text: |-
      Tot de uitoefening van de diergeneeskunde in haar volle omvang zijn tevens toegelaten personen die in het bezit
      zijn een opleidingstitel van dierenarts die is afgegeven door de voormalige Sovjet-Unie of ter verwerving waarvan
      de opleiding in Litouwen is aangevangen vóór 11 maart 1990, mits die opleidingstitel vergezeld gaat van een
      officieel gewaarmerkte verklaring, waarin door de Litouwse autoriteiten wordt bevestigd dat:

      a. de opleidingstitel, wat betreft de toegang tot de uitoefening van de diergeneeskunde in haar volle omvang op het
      grondgebied van Litouwen dezelfde rechtsgeldigheid heeft als de Litouwse opleidingstitels van dierenarts, en

      b. de bezitter van de opleidingstitel de werkzaamheden van dierenarts gedurende ten minste drie opeenvolgende
      jaren tijdens de vijf jaren voorafgaande aan de afgifte van de verklaring daadwerkelijk en op wettige wijze heeft
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel7
  - number: '8'
    text: |-
      Tot de uitoefening van de diergeneeskunde, bedoeld in [artikel 3, eerste lid, van de wet][ref1], zijn toegelaten
      personen die in het bezit zijn een opleidingstitel van dierenarts die is afgegeven door het voormalige Joegoslavië
      of ter verwerving waarvan de opleiding in Slovenië is aangevangen vóór 25 juni 1991, mits die opleidingstitel
      vergezeld gaat van een officieel gewaarmerkte verklaring, waarin door de Sloveense autoriteiten wordt bevestigd
      dat:

      a. de opleidingstitel, wat betreft de toegang tot de uitoefening van het betreffende beroep, op het grondgebied van
      Slovenië dezelfde rechtsgeldigheid heeft als de Sloveense opleidingstitels van dierenarts, en

      b. de bezitter van de opleidingstitel de werkzaamheden van dierenarts gedurende ten minste drie opeenvolgende
      jaren tijdens de vijf jaren voorafgaande aan de afgifte van de verklaring daadwerkelijk en op wettige wijze heeft
      uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0023066#Artikel3
    url: https://wetten.overheid.nl/BWBR0024505/2013-07-01#Artikel8
    references:
      - id: ref1
