  - number: '4'
    text: |-
      1 Onze Minister kan aan geneeskundigen, hoewel niet bevoegd volgens [artikel 2][ref1], doch die na afgelegd examen
      het recht tot uitoefening van de geneeskunde in haar volle omvang in een ander land hebben verkregen, vergunning
      verlenen tot die uitoefening ten behoeve van de opvarenden van in de openbare lichamen Bonaire, Sint Eustatius of
      Saba thuis behorende schepen, of ten behoeve van bij in de openbare lichamen Bonaire, Sint Eustatius of Saba hun
      bedrijf uitoefenende maatschappijen, werkzaam personeel en hun bloed- of aanverwanten die recht kunnen doen gelden
      op vrije geneeskundige behandeling vanwege de betrokken maatschappij.

      2 De in het vorige lid bedoelde vergunning moet jaarlijks bij Onze Minister worden aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0028449#Artikel2
    url: https://wetten.overheid.nl/BWBR0028449/2018-08-01#Artikel4
