  - number: '5'
    text: |-
      1 Alvorens de praktijk uit te oefenen doen de geneeskundigen hun bewijs van bevoegdheid viseren door een door
      Onze Minister aangewezen ambtenaar, en leggen zij in handen van de gezaghebber van het betrokken openbare lichaam
      Bonaire, Sint Eustatius of Saba de volgende eed (belofte) af:

      «Ik zweer (beloof) dat ik de geneeskunde, volgens de daarop gestelde wettelijke bepalingen, naar mijn beste
      weten en vermogen zal uitoefenen, en dat ik aan niemand zal openbaren wat in die uitoefening als geheim mij is
      toevertrouwd of te mijner kennis is gekomen, tenzij mijn verklaring als getuige of deskundige in rechten wordt
      gevorderd, of ik anderszins tot het geven van mededeling door een algemene verordening verplicht wordt. Zo waarlijk
      helpe mij God Almachtig! (Dat beloof Ik)».

      2 De door Onze Minister aangewezen ambtenaar doet aan de Inspectie gezondheidszorg en jeugd de gegevens toekomen
      van een geneeskundige wiens bewijs van bevoegdheid door hem ingevolge het eerste lid is geviseerd.
    url: https://wetten.overheid.nl/BWBR0028449/2018-08-01#Artikel5
  - number: '6'
    text: |-
      Alleen de geneeskundige mag binnen de grenzen zijner bevoegdheid in het openbaar aankondigen, dat hij de
      geneeskunde uitoefent, en een titel voeren, die hem aan het publiek als zodanig aanwijst.
    url: https://wetten.overheid.nl/BWBR0028449/2018-08-01#Artikel6
  - number: '7'
    text: |-
      1 Onverminderd de aansprakelijkheid voortvloeiende uit andere regelgeving, wordt overtreding van enige bepaling van
      dit besluit gestraft met een geldboete van ten hoogste de eerste categorie.

      2 De feiten bij dit besluit strafbaar gesteld, worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0028449/2018-08-01#Artikel7
  - number: '8'
    text: |-
      Degene die tot het moment van inwerkingtreding van dit besluit op grond van de tot dan toe geldende wet- en
      regelgeving beschikte over de bevoegdheid de geneeskunde uit te oefenen en die niet voldoet aan de eisen genoemd
      in [artikel 2][ref1] van dit besluit, mag na de inwerkingtreding van dit besluit, tot een bij ministeriële regeling
      nader te bepalen datum, de geneeskunde blijven uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028449#Artikel2
    url: https://wetten.overheid.nl/BWBR0028449/2018-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0028449
        artikel: '2'
  - number: 8a
    text: |-
      Het verstrekken van brillen en brilleglazen uitsluitend door het met behulp van letterproeven en brillendoos
      uitzoeken van de verlangde glazen, door degenen die op het tijdstip van inwerkingtreding van dit besluit
      hiervan hun beroep maken, wordt niet geacht te behoren tot de uitoefening der geneeskunde als bedoeld in het
      [eerste en tweede lid van artikel 1][ref1].


