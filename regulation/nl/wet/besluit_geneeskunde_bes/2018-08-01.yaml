  - number: '1'
    text: |-
      1 Uitoefening van de geneeskunde, waaronder wordt verstaan het verlenen van genees- heel-, verlos- of
      tandheelkundige raad of bijstand als beroep, is alleen geoorloofd aan degenen die de bevoegdheid daartoe volgens
      [artikel 2][ref1] bezitten.

      2 Onder het verlenen van raad of bijstand in het vorige lid bedoeld, wordt begrepen het als beroep onderzoeken van
      een orgaan of een deel van het menselijk lichaam, welk orgaan of welk deel in zijn werking tekort schiet of een
      ander gebrek vertoont, zomede het als beroep aanraden van een middel om aan een zodanig tekort of gebrek tegemoet
      te komen.

      3 Het toepassen van heilgymnastiek en massage op aanwijzing van en in geregeld overleg met een geneeskundige wordt,
      voorzover zulks volgens het eerste en het tweede lid van dit artikel wél het geval zou zijn, niet geacht te behoren
      tot de uitoefening van de geneeskunde, evenmin als het verstrekken van brillen en brilleglazen op voorschrift van
      een geneeskundige.

      4 In dit besluit wordt onder Onze Minister verstaan: Onze Minister van Volksgezondheid, Welzijn en Sport.

      5 Dit besluit berust op [artikel 18.4.4 van de Invoeringswet openbare lichamen Bonaire, Sint Eustatius en Saba][ref2].


