  - number: '2'
    text: |-
      1 Tot de uitoefening van de geneeskunde in haar volle omvang zijn bevoegd:

      a. zij, die de hoedanigheid van arts hebben verkregen op de wijze zoals voorgeschreven in de terzake in Nederland
      geldende wettelijke bepalingen;

      b. zij, die beschikken over een getuigschrift genoemd in bijlage V, onder 5.1.1 van de [richtlijn nr. 2005/36/EG]
      (32005L0036) betreffende de erkenning van beroepskwalificaties;

      c. zij, die beschikken over een getuigschrift genoemd in de bijlage bij dit besluit, voor zover het getuigschrift
      is behaald als gevolg van een opleiding die is begonnen na de desbetreffende daarbij genoemde referentiedatum en
      indien deze is afgegeven door de daartoe bevoegde opleidingsinstelling;

      d. zij, die op aanvrage van Onze Minister een verklaring hebben gekregen, inhoudende dat zij op basis van de door
      hen genoten opleiding vakbekwaam worden geacht om de geneeskunst uit te oefenen.
    url: https://wetten.overheid.nl/BWBR0028449/2018-08-01#Artikel2
  - number: 2a
    text: |-
      1 Onze Minister kan zich voor het afgeven van de in [artikel 2, onderdeel d][ref1], bedoelde verklaring laten
      adviseren door een bij ministeriële regeling aangewezen commissie.

      2 Bij de aanvrage bedoeld in [artikel 2, onderdeel d][ref2], worden de bij ministeriële regeling aangewezen
      gegevens overgelegd.


