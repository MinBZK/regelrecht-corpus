  - number: '3'
    text: |-
      1 Indien door onvoorziene omstandigheden een tekort aan geneeskundige hulp in de openbare lichamen Bonaire,
      Sint Eustatius of Saba is ontstaan, kan Onze Minister, het bestuurscollege van het betreffende openbare lichaam
      Bonaire, Sint Eustatius of Saba gehoord aan geneeskundigen, hoewel niet bevoegd volgens [artikel 2][ref1], doch
      die na afgelegd examen het recht tot uitoefening van de geneeskunde in haar volle omvang in een ander land hebben
      verkregen, vergunning verlenen tot die uitoefening onder bepaalde voorwaarden.

      2 Onze Minister kan aan de vergunning een bepaalde termijn verbinden.


      [ref1]: https://wetten.overheid.nl/BWBR0028449#Artikel2
    url: https://wetten.overheid.nl/BWBR0028449/2018-08-01#Artikel3
    references:
