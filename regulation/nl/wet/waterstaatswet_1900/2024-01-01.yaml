  - number: '103'
    text: |-
      Deze wet is niet van toepassing op een waterstaatswerk als bedoeld in de [Omgevingswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037885
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0037885
  - number: '104'
    text: |-
      1 Door Ons wordt bepaald, op welk tijdstip, of op welke tijdstippen onderscheidenlijk de bepalingen dezer wet in
      werking treden, voorzoover dit niet reeds is geschied.

      2 Met de inwerkingtreding dezer wet, zooals zij oorspronkelijk is vastgesteld, zijn vervallen de wet van 12 Juli
      1855 (*Staatsblad* n°. 102), tot voorloopige voorziening in sommige waterstaatsbelangen, alsmede art. 7 van het
      Koninklijk besluit van 17 December 1819 n° 1 en de Koninklijke besluiten van 29 Maart 1822 (*Staatsblad* n°. 7),
      7 September 1822 (*Staatsblad* n°. 42), 23 September 1849 (*Staatsblad* n°. 50) en 14 April 1850 (*Staatsblad*
      n°. 16).

      3 Met de inwerkingtreding van de bepalingen van § 17 dezer wet, vervallen het Koninklijk besluit van 21 Augustus
      1835, n°. 23, houdende vaststelling van een reglement op de correspondentie bij ijsgang en hoog opperwater op
      de rivieren, met de besluiten, waarbij dat Koninklijk besluit is gewijzigd of aangevuld en de besluiten, die ter
      uitvoering daarvan zijn genomen, en het Koninklijk besluit van 18 December 1820, n°. 70.
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel104
  - number: '105'
    text: Deze wet kan worden aangehaald onder den naam "Waterstaatswet 1900".
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel105
