preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is algemeene regels omtrent het waterstaatsbestuur
    te stellen;

    Gezien art. 188 der Grondwet;

    Zoo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het bij anderen in beheer of onderhoud brengen van waterstaatswerken die bij het Rijk in beheer of onderhoud
      zijn, alsmede het bij het Rijk in beheer of onderhoud brengen van waterstaatswerken die bij anderen dan het Rijk in
      beheer of onderhoud zijn dan wel die onbeheerd zijn, geschiedt bij wet.

      2 In afwijking van het eerste lid kunnen waterstaatswerken in beheer of onderhoud bij het Rijk, die niet
      van nationaal belang zijn, bij koninklijk besluit bij anderen in beheer of onderhoud worden gebracht, indien
      daaromtrent overeenstemming is bereikt tussen het Rijk en die anderen.

      3 In afwijking van het eerste lid kunnen waterstaatswerken in beheer of onderhoud bij anderen, die van nationaal
      belang zijn, bij koninklijk besluit bij het Rijk in beheer of onderhoud worden gebracht, indien daaromtrent
      overeenstemming is bereikt tussen het Rijk en die anderen.

      4 Een besluit als bedoeld in het tweede en derde lid geschiedt op gemeenschappelijke voordracht van Onze Minister
      met de uitvoering van deze wet belast en van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel1
  - number: '2'
    text: |-
      1 De Gedeputeerde Staten kunnen, waterstaatswerken in beheer of onderhoud bij anderen dan het Rijk, de beheerders
      gehoord, zoomede onbeheerde waterstaatswerken in het beheer en onderhoud der provincie brengen.

      2 Zij, die van het onderhoud of het geven van bijdragen tot het onderhoud worden bevrijd, kunnen bij het besluit
      tot overneming in beheer en onderhoud bij de provincie worden verplicht tot afkoopbare jaarlijksche uitkeeringen,
      welke gezamenlijk niet hooger mogen worden gesteld, dan hetgeen per jaar voor behoorlijk onderhoud werd vereischt.

      3 Indien voor het gebruik van een waterstaatswerk, dat door de provincie in beheer en onderhoud wordt
      genomen, rechten worden geheven, wordt, behoudens het geval, dat ingevolge [artikel 54 van de Wegenwet][ref1]
      schadevergoeding wordt gegeven, wegens het gemis van de opbrengst der heffing schadevergoeding toegekend, welke in
      het besluit der Staten tot overneming in beheer en onderhoud wordt bepaald.

      4 Het in de beide vorige leden van dit artikel bepaalde is alleen van toepassing, indien omtrent de in het eerste
      lid bedoelde overneming geen overeenstemming is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel54
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '54'
  - number: '3'
    text: |-
      Wanneer de noodzakelijkheid tot voorziening in een waterstaatsbelang bestaat, en de tot regelen bevoegde macht in
      gebreke blijft tot regeling van dat belang over te gaan, kan eene wet de wijze bepalen, waarop in dat belang zal
      worden voorzien.
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel3
  - number: '4'
    text: |-
      1 Indien Gedeputeerde Staten van twee of meer provincies niet of niet binnen redelijke termijn tot overeenstemming
      komen over de regeling van belangen van waterstaat die hen gemeenschappelijk aangaan omdat zij van mening
      verschillen over de noodzaak of de inhoud van de regeling, kan daarin bij algemene maatregel van bestuur worden
      voorzien. [Artikel 27d, eerste tot en met vierde lid, van de Wet op de Raad van State][ref1] is van overeenkomstige
      toepassing.

      2 Op overtreding van voorschriften, bij algemene maatregel van bestuur krachtens dit artikel gegeven, kunnen
      dezelfde straffen worden gesteld als provinciale staten krachtens de wet op overtreding van hun verordeningen en
      reglementen kunnen stellen.

      3 Alvorens een voordracht te doen tot een algemene maatregel van bestuur als bedoeld in het eerste lid, hoort Onze
      Minister van Verkeer en Waterstaat gedeputeerde staten van de desbetreffende provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel27d
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 27d
  - number: '37'
    text: |-
      1 Gedeputeerde Staten kunnen bevelen staking der uitvoering van waterstaatswerken, die verricht wordt in strijd
      met het algemeen of provinciaal belang of met het belang van een ander waterschap dan dat, hetwelk de werken
      onderneemt.

      2 Deze bevoegdheid geldt niet ten aanzien van werken, welke door het Rijk worden ondernomen.

      3 In geval van provinciale werken kan Onze voornoemde Minister staking bevelen van de uitvoering wegens strijd met
      het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel37
  - number: '38'
    text: |-
      1 De uitvoering van noodzakelijke waterstaatswerken en voorzieningen, waaronder ook opruimingen worden verstaan,
      welke door de daartoe verplichten niet geschiedt, kan door Gedeputeerde Staten worden bevolen.

      2 Het bevel kan gegeven worden aan ieder die een waterstaatswerk in beheer of onderhoud heeft met uitzondering van
      het Rijk.

      3 Indien de in het eerste lid bedoelde verplichting op een provincie rust, wordt het bevel gegeven door Onze
      voornoemde Minister.

      4 Aan het bestuur eener gemeente kan het bevel niet worden gegeven, indien de verplichting alleen op zijne zorg
      voor de huishouding der gemeente steunt.

      5 Het bevel kan mede worden gegeven, indien de verplichting voortspruit uit eene gemeenschappelijke regeling door
      twee of meer gemeenten of waterschappen tot stand gebracht.
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel38
  - number: '39'
    text: |-
      1 Indien Gedeputeerde Staten van de hun in [artikel 37][ref1] toegekende bevoegdheid, geen gebruik maken, kan Onze
      voornoemde Minister, Gedeputeerde Staten gehoord, de daar bedoelde bevelen geven.

      2 Het bepaalde in het voorgaande lid is eveneens van toepassing op het bevel bedoeld in [artikel 38][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel38
    url: https://wetten.overheid.nl/BWBR0001867/2024-01-01#Artikel39
    references:
