  - number: '67'
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. waterstaatswerken: oppervlaktewateren en waterkeringen, met inbegrip van de daartoe behorende kunstwerken en
      hetgeen verder naar hun aard daartoe behoort;

      b. gevaar: omstandigheden waaronder de goede staat van een of meer waterstaatswerken onmiddellijk en ernstig in het
      ongerede is of dreigt te komen;

      c. beheerder: Onze Minister van Verkeer en Waterstaat, gedeputeerde staten, het dagelijks bestuur van een
      waterschap of burgemeester en wethouders, al naar gelang het betreft waterstaatswerken in beheer bij het Rijk, een
      provincie, een waterschap of een gemeente.

      2 Deze paragraaf is niet van toepassing met betrekking tot de Noordzee, bedoeld in
      [artikel 2, eerste lid, van de Wet bestrijding ongevallen Noordzee][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005444#Artikel2
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0005444
        artikel: '2'
  - number: '68'
    text: |-
      1 De beheerder draagt zorg voor het houden van oefeningen in doeltreffend optreden bij gevaar.

      2 De verplichting, bedoeld in het eerste lid, geldt niet, indien burgemeester en wethouders beheerder zijn, tenzij
      gedeputeerde staten die noodzakelijk achten in verband met waterstaatswerken van bijzondere betekenis die bij een
      bepaalde gemeente in beheer zijn.

      3 De beheerder verstrekt jaarlijks aan gedeputeerde staten een overzicht van gehouden oefeningen. Indien
      gedeputeerde staten beheerder zijn, zenden zij een overzicht aan Onze Minister van Verkeer en Waterstaat.

      4 Gedeputeerde staten kunnen de beheerder schriftelijk opdracht geven oefeningen te houden, indien deze naar hun
      oordeel onvoldoende worden gehouden. Hetzelfde geldt indien gedeputeerde staten beheerder zijn, met dien verstande
      dat in dat geval de opdracht kan worden gegeven door Onze Minister van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel68
  - number: '69'
    text: |-
      1 De beheerder stelt een calamiteitenplan vast en draagt zorg voor de bekendmaking ervan. Een calamiteitenplan
      bevat in ieder geval:

      a. een overzicht van de soorten calamiteiten die voor de waterstaatswerken kunnen optreden, inclusief een
      inventarisatie van de daarmee gepaard gaande risico's;

      b. een overzicht van te nemen maatregelen en het beschikbaar materieel, benodigd om de onderscheidene calamiteiten
      het hoofd te bieden;

      c. een overzicht van de diensten, instanties en organisaties, die bij gevaar kunnen worden ingeschakeld;

      d. een schema met betrekking tot de calamiteitenorganisatie van de beheerder;

      e. een meld- en alameringsprocedure;

      f. een beschrijving van het moment en de wijze van het door de beheerder informeren van burgemeesters en wethouders
      van de gemeenten waarbinnen de waterstaatswerken zijn gelegen;

      g. een overzicht waaruit blijkt op welke wijze de beheerder de kwaliteit van de calamiteitenorganisatie waarborgt.

      2 In het calamiteitenplan dient de afstemming op provinciale coördinatieplannen, rampenplannen en voor de
      waterstaatszorg van belang zijnde rampbestrijdingsplannen, vastgesteld voor het gebied waarin de waterstaatswerken
      zijn gelegen, te zijn gewaarborgd.

      3 In het calamiteitenplan dient de afstemming op calamiteitenplannen van andere beheerders, indien, in het
      bijzonder bij gevaar, sprake is of zou kunnen zijn van waterstaatkundige samenhang tussen de onderscheidene
      waterstaatswerken, te zijn gewaarborgd.

      4 De in het eerste lid bedoelde verplichting geldt niet indien burgemeester en wethouders beheerder zijn, tenzij
      gedeputeerde staten deze noodzakelijk achten in verband met waterstaatswerken van bijzondere betekenis die bij de
      desbetreffende gemeente in beheer zijn.

      5 Een ontwerp van het calamiteitenplan wordt in elk geval voor commentaar gezonden aan het bestuur van de regionale
      brandweer, aan burgemeester en wethouders van de gemeenten waarbinnen de waterstaatswerken zijn gelegen, alsmede
      aan de overige beheerders, bedoeld in het derde lid.

      6 De beheerder zendt het door hem vastgestelde calamiteitenplan in elk geval aan gedeputeerde staten, het
      bestuur van de regionale brandweer, burgemeester en wethouders van de gemeenten waarbinnen de waterstaatswerken
      zijn gelegen, de overige beheerders, bedoeld in het derde lid, en ter kennisneming, aan Onze commissaris in de
      provincie.

      7 De in het eerste lid bedoelde vaststelling geschiedt voor de eerste maal binnen twee jaar na de datum van
      inwerkingtreding van deze wet.

      8 De beheerder beziet met passende tussenpozen doch ten minste éénmaal per vier jaar of het calamiteitenplan moet
      worden herzien en bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel69
  - number: '70'
    text: |-
      1 Gedeputeerde staten bezien of het op grond van [artikel 69, zesde lid][ref1], toegezonden calamiteitenplan
      voldoet aan de in [artikel 69, eerste tot en met derde lid][ref2], omschreven vereisten. Indien zij van oordeel
      zijn dat dit niet het geval is, kunnen zij de beheerder uitnodigen het calamiteitenplan binnen een door hen te
      bepalen termijn te wijzigen.

      2 Alvorens gedeputeerde staten gebruik maken van de bevoegdheid, bedoeld in het vorige lid, plegen zij overleg met
      de beheerder.

      3 Indien de beheerder geen gevolg geeft aan een uitnodiging op grond van het eerste lid, gaan gedeputeerde staten
      op kosten van de beheerder tot wijziging van het calamiteitenplan over.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel69
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel70
