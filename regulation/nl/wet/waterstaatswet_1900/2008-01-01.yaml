  - number: '74'
    text: |-
      1 Indien burgemeester en wethouders of het dagelijks bestuur van een waterschap beheerder zijn en gedeputeerde
      staten van oordeel zijn dat ten onrechte niet of niet voldoende wordt opgetreden bij gevaar, kunnen zij de
      beheerder, zoveel mogelijk na overleg met hem, daartoe een opdracht geven. Indien de omstandigheden geen
      voorafgaande bijeenroeping van gedeputeerde staten gedogen, is Onze commissaris in de provincie bevoegd een
      opdracht te geven, zolang deze toestand voortduurt en totdat gedeputeerde staten van hun bevoegdheden gebruik
      maken.

      2 Indien gedeputeerde staten beheerder zijn, kan Onze Minister van Verkeer en Waterstaat een opdracht als bedoeld
      in het eerste lid, geven.

      3 Tenzij spoedeisende omstandigheden zich daartegen verzetten wordt een opdracht schriftelijk gegeven.

      4 De opdracht geldt voor een daarbij te stellen termijn. Deze termijn kan telkens worden verlengd met een bij het
      verlengingsbesluit te stellen aanvullende termijn. Zodra de omstandigheden op grond waarvan toepassing is gegeven
      aan het eerste lid zulks toelaten, wordt de opdracht ingetrokken binnen de termijn waarvoor de opdracht geldt. De
      intrekking van een opdracht geschiedt schriftelijk.

      5 Indien het dagelijks bestuur van een waterschap, waarvan het gebied in meer dan een provincie is gelegen de
      beheerder is, wordt een opdracht als bedoeld in het eerste lid, gegeven door gedeputeerde staten van de provincie
      of provincies, waaraan het toezicht op het waterschapsbestuur is opgedragen.

      6 Indien gedeputeerde staten of Onze commissaris in de provincie van de in het eerste lid gegeven bevoegdheid
      gebruik hebben gemaakt, melden zij dit onverwijld aan provinciale staten en Onze Minister van Verkeer en
      Waterstaat.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel74
  - number: '75'
    text: |-
      1 Indien naar het oordeel van Onze Minister van Verkeer en Waterstaat door gedeputeerde staten of Onze commissaris
      in de provincie ten onrechte niet of niet voldoende gebruik gemaakt wordt van de in [artikel 74, eerste lid][ref1],
      bedoelde bevoegdheid, kan Onze Minister van Verkeer en Waterstaat, zo veel mogelijk na overleg met gedeputeerde
      staten of Onze commissaris in de provincie, een opdracht geven aan de desbetreffende beheerder.

      2 Gedeputeerde staten worden zo spoedig mogelijk van het geven van de opdracht op de hoogte gesteld.

      3 [Artikel 74, derde en vierde lid][ref2], zijn van overeenkomstige toepassing.

      4 Indien de in het eerste lid genoemde opdracht zijn grond vindt in aanmerkelijke verslechtering van de kwaliteit
      van een oppervlaktewater, wordt deze, tenzij spoedeisende omstandigheden zich daartegen verzetten, gegeven in
      overeenstemming met Onze Minister van Volkshuisvesting, Ruimtelijke Ordening en Milieubeheer.

      5 Indien Onze Minister van Verkeer en Waterstaat van de in het eerstelid gegeven bevoegdheid gebruik heeft gemaakt,
      meldt hij dit onverwijld aan de Tweede Kamer der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel74
