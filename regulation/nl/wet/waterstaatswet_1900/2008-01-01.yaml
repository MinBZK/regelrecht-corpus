  - number: 12a
    text: |-
      1 Ter verbetering van een watergang, welke dienstbaar is of wordt gemaakt voor de af- of aanvoer van water of voor
      de scheepvaart en waarvoor de zorg berust bij het Rijk, een provincie, gemeente of waterschap, kan verandering,
      verplaatsing of verwijdering worden bevolen van kunstwerken, welke zich onder, in of boven den watergang of daaraan
      grenzende terreinen bevinden en niet bij het Rijk in onderhoud zijn.

      2 Op verzoek van de instelling, bij welke de zorg voor den watergang berust, wordt het bevel door Ons
      uitgevaardigd, wanneer de watergang door het Rijk, of de watergang of het kunstwerk door eene provincie wordt
      onderhouden, en in de overige gevallen door Gedeputeerde Staten van de provincie of provinciën, waarin het
      kunstwerk is gelegen. Het besluit van Gedeputeerde Staten is aan Onze goedkeuring onderworpen.

      3 Wanneer zienswijzen naar voren zijn gebracht wordt Ons bevel niet uitgevaardigd, dan nadat de Raad van State is
      gehoord. [Artikel 18][ref1] is van overeenkomstige toepassing.

      4 Op de voorbereiding van het bevel is [afdeling 3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.

      5 Bij het bevel wordt, zoo noodig, door het stellen van voorwaarden en door het aan verzoekster of derden opleggen
      van de verplichting om werken te maken er tegen gewaakt, dat het belang, ter behartiging waarvan het kunstwerk
      strekt, en andere belangen worden geschaad. Is dit niet te voorkomen, dan wordt het bevel alleen dan uitgevaardigd,
      wanneer de beoogde verbetering van grooter beteekenis wordt geacht dan de nadeelen, welke van de verandering,
      verplaatsing of verwijdering van het kunstwerk het gevolg zullen zijn.

      6 Het bevel sluit de opheffing in zich van alle belemmeringen, bij de verandering, verplaatsing of verwijdering van
      de kunstwerken uit bepalingen van verordeningen voortspruitende.

      7 In het bevel worden, voor zooveel noodig, de te maken werken omschreven en voorschriften gegeven omtrent
      vaststelling van bestekken, aanbesteding en uitvoering van die werken.

      8 Het bestuursorgaan dat het bevel heeft uitgevaardigd, is bevoegd tot toepassing van bestuursdwang ter handhaving
      van het bevel. Het bestuursorgaan kan deze bevoegdheid delegeren aan de verzoeker en in verband daarmee de inhoud
      van het bevel wijzigen.

      9 Onverminderd [artikel 5:25 van de Algemene wet bestuursrecht][ref3] zijn de kosten die ter voldoening aan het
      bevel worden gemaakt voor rekening van verzoekster.

      10 De onderhoudsplichtige van het kunstwerk blijft ook na de verandering of verplaatsing tot onderhoud verplicht.
      Is de onderhoudslast verzwaard, dan wordt hem de daardoor te lijden schade door verzoekster vergoed.

      11 Verzoekster is tot een bij het bevel te stellen termijn bevoegd terug te komen op haar verlangen dat het
      kunstwerk zal worden veranderd, verplaatst of verwijderd. Heeft zij daarvan kennis gegeven aan het bestuursorgaan,
      waarvan het bevel is uitgegaan, dan wordt het bevel ingetrokken.

      12 Dit artikel is niet van toepassing op kunstwerken dienende tot uitoefening van molenrechten of andere
      burgerlijke rechten tot het ontleenen van water aan of het gebruiken van water van den watergang, indien de
      uitoefening van die rechten door de beoogde verandering, verplaatsing of verwijdering onmogelijk zou worden
      gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel525
