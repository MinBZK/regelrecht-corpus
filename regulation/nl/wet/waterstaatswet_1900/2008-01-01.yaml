  - number: '71'
    text: |-
      1 Iedere vier jaren doen gedeputeerde staten aan Onze Minister van Verkeer en Waterstaat opgave van de gehouden
      oefeningen, bedoeld in [artikel 68, eerste lid][ref1], alsmede van het voorhanden zijn van calamiteitenplannen,
      bedoeld in [artikel 69, eerste lid][ref2]. Zij zenden een afschrift van deze opgave aan Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.

      2 De in het eerste lid bedoelde toezending geschiedt voor de eerste maal binnen vier jaren na de datum van
      inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel69
