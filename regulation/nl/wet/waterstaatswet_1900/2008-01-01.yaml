  - number: '76'
    text: |-
      Indien een met toepassing van [artikel 74, eerste lid][ref1], of [75, eerste lid][ref2], gegeven opdracht met zich
      brengt, dat door de beheerder bepaalde maatregelen worden getroffen en blijkt dat deze door de beheerder niet of
      niet naar behoren geschieden, zijn gedeputeerde staten onderscheidenlijk Onze Minister van Verkeer en Waterstaat
      bevoegd tot het treffen van maatregelen ten laste van de beheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel75
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel76
