        artikel: '75'
        paragraaf: '17'
  - number: '77'
    text: |-
      1 Indien werkzaamheden die, al dan niet ter voldoening aan krachtens de [artikelen 74][ref1] of [75][ref2] gegeven
      opdracht, door een beheerder zijn uitgevoerd, uitsluitend of mede hebben gestrekt ter behartiging van de belangen
      van een andere beheerder, kan aan laatstgenoemde beheerder de verplichting worden opgelegd tot betaling van een
      bedrag, ter gehele of gedeeltelijke vergoeding van de kosten van die uitvoering, te voldoen aan de beheerder die de
      werkzaamheden heeft uitgevoerd.

      2 Het besluit tot het opleggen van de in het vorige lid omschreven verplichting en tot het bepalen van het bedrag
      daarvan, wordt genomen door gedeputeerde staten. Indien het betreft de kosten van werkzaamheden ter voldoening
      aan een opdracht, gegeven met toepassing van [artikel 75, eerste lid][ref3], wordt het besluit genomen door Onze
      Minister van Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel75
