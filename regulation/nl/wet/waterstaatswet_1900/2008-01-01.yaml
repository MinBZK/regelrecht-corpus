preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is algemeene regels omtrent het waterstaatsbestuur
    te stellen;

    Gezien art. 188 der Grondwet;

    Zoo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Het bij anderen in beheer of onderhoud brengen van waterstaatswerken die bij het Rijk in beheer of onderhoud
      zijn, alsmede het bij het Rijk in beheer of onderhoud brengen van waterstaatswerken die bij anderen dan het Rijk in
      beheer of onderhoud zijn dan wel die onbeheerd zijn, geschiedt bij wet.

      2 In afwijking van het eerste lid kunnen waterstaatswerken in beheer of onderhoud bij het Rijk, die niet
      van nationaal belang zijn, bij koninklijk besluit bij anderen in beheer of onderhoud worden gebracht, indien
      daaromtrent overeenstemming is bereikt tussen het Rijk en die anderen.

      3 In afwijking van het eerste lid kunnen waterstaatswerken in beheer of onderhoud bij anderen, die van nationaal
      belang zijn, bij koninklijk besluit bij het Rijk in beheer of onderhoud worden gebracht, indien daaromtrent
      overeenstemming is bereikt tussen het Rijk en die anderen.

      4 Een besluit als bedoeld in het tweede en derde lid geschiedt op gemeenschappelijke voordracht van Onze Minister
      met de uitvoering van deze wet belast en van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel1
  - number: '2'
    text: |-
      1 De Gedeputeerde Staten kunnen, waterstaatswerken in beheer of onderhoud bij anderen dan het Rijk, de beheerders
      gehoord, zoomede onbeheerde waterstaatswerken in het beheer en onderhoud der provincie brengen.

      2 Zij, die van het onderhoud of het geven van bijdragen tot het onderhoud worden bevrijd, kunnen bij het besluit
      tot overneming in beheer en onderhoud bij de provincie worden verplicht tot afkoopbare jaarlijksche uitkeeringen,
      welke gezamenlijk niet hooger mogen worden gesteld, dan hetgeen per jaar voor behoorlijk onderhoud werd vereischt.

      3 Indien voor het gebruik van een waterstaatswerk, dat door de provincie in beheer en onderhoud wordt
      genomen, rechten worden geheven, wordt, behoudens het geval, dat ingevolge [artikel 54 van de Wegenwet][ref1]
      schadevergoeding wordt gegeven, wegens het gemis van de opbrengst der heffing schadevergoeding toegekend, welke in
      het besluit der Staten tot overneming in beheer en onderhoud wordt bepaald.

      4 Het in de beide vorige leden van dit artikel bepaalde is alleen van toepassing, indien omtrent de in het eerste
      lid bedoelde overneming geen overeenstemming is verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel54
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '54'
  - number: '3'
    text: |-
      Wanneer de noodzakelijkheid tot voorziening in een waterstaatsbelang bestaat, en de tot regelen bevoegde macht in
      gebreke blijft tot regeling van dat belang over te gaan, kan eene wet de wijze bepalen, waarop in dat belang zal
      worden voorzien.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel3
  - number: '4'
    text: |-
      1 Indien Gedeputeerde Staten van twee of meer provincies niet of niet binnen redelijke termijn tot overeenstemming
      komen over de regeling van belangen van waterstaat die hen gemeenschappelijk aangaan omdat zij van mening
      verschillen over de noodzaak of de inhoud van de regeling, kan daarin bij algemene maatregel van bestuur worden
      voorzien. [Artikel 18][ref1] is van overeenkomstige toepassing.

      2 Op overtreding van voorschriften, bij algemene maatregel van bestuur krachtens dit artikel gegeven, kunnen
      dezelfde straffen worden gesteld als provinciale staten krachtens de wet op overtreding van hun verordeningen en
      reglementen kunnen stellen.

      3 Alvorens een voordracht te doen tot een algemene maatregel van bestuur als bedoeld in het eerste lid, hoort Onze
      Minister van Verkeer en Waterstaat gedeputeerde staten van de desbetreffende provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '5'
    text: |-
      1 In het Rijkswaterstaatsbestuur, daaronder begrepen de uitoefening van het oppertoezicht over den waterstaat, voor
      zooveel een en ander Onzen Minister met de uitvoering dezer wet belast, is opgedragen, zijn onder diens bevelen
      ambtenaren van den Rijkswaterstaat, door Ons of van Onzentwege te benoemen, werkzaam.

      2 De inrichting van den Rijkswaterstaatsdienst in het eerste lid bedoeld, wordt bij algemeenen maatregel van
      bestuur vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel5
  - number: '6'
    text: |-
      1 Ieder, die waterstaatswerken in beheer heeft of daarover toezicht uitoefent, is verplicht aan Onzen met
      de uitvoering dezer wet belasten Minister en de door hem aangewezen ambtenaren, in de uitoefening van het
      oppertoezicht werkzaam, alle inlichtingen te geven tot uitoefening van het oppertoezicht verlangd, bij het opnemen
      dier werken den gevraagden bijstand te verleenen en daarbij desverlangd tegenwoordig te zijn.

      2 Ten behoeve van het opnemen dier werken hebben de in het eerste lid genoemde ambtenaren toegang tot de werken en
      zijn zij bevoegd ook afgesloten erven tot dat einde te betreden.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel6
  - number: '7'
    text: |-
      De door Onze Minister van Verkeer en Waterstaat, door Onze commissaris in de provincie, gedeputeerde staten, de
      colleges van burgemeester en wethouders en de besturen van waterschappen aangewezen personen zijn bevoegd een
      woning zonder toestemming van de bewoner te betreden, voor zover dat redelijkerwijs voor de vervulling van hun taak
      nodig is, ten einde de toestand van waterstaatswerken te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel7
  - number: '9'
    text: |-
      1 Wanneer tot het maken van ontwerpen voor het aanleggen, onderhouden of verbeteren van een waterstaatswerk,
      gravingen, opmetingen of het stellen van teekens op iemands grond noodig worden geacht, moeten zoowel de eigenaren
      als de gebruikers van dien grond dit gedoogen, mits dit aan laatstgenoemden ten minste tweemaal vier en twintig
      uren te voren, hetzij door het bestuur van het publiekrechtelijk lichaam, dat het waterstaatswerk ontwerpt,
      aanlegt, onderhoudt of verbetert, hetzij door den burgemeester, schriftelijk zij aangezegd.

      2 Wanneer tot het uitvoeren van werken aan waterkeeringen of watergangen, rivierwerken daaronder begrepen,
      grondspecie en bouwstoffen, desgevorderd in vervoermiddelen, over iemands grond moeten worden vervoerd of
      daarop tijdelijk neergelegd, moeten de eigenaren en gebruikers dit toelaten, doch, tenzij het betreft gewone
      onderhoudswerken of het bestuur van het publiekrechtelijk lichaam, waarbij de werken in beheer zijn, aan den
      gebruiker de verklaring overlegt, dat onverwijlde voorziening noodig is, onder dezelfde voorwaarde als in het
      eerste lid gesteld.

      3 Onder gelijke beperking moeten eigenaren en gebruikers van binnen de begrenzing van de rivier gelegen gronden
      toelaten dat kribben, dammen of andere rivierwerken van het rijk daaraan onderscheidenlijk daarover of daarop
      worden aangesloten, doorgetrokken of veranderd.

      4 De bepalingen van dit artikel kunnen door de eigenaren en gebruikers van gronden niet worden ingeroepen, wanneer
      het gebruikmaken van iemands grond uit eene verordening of uit eene verplichting uit anderen hoofde volgt.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel9
  - number: '10'
    text: |-
      1 De eigenaren en gebruikers van gronden en gebouwen en de beheerders van werken, waarin of waarop ten behoeve
      van driehoeksmeting, van de aanduiding van waterhoogten, van het geven van seinen in verband met die waterhoogten
      en met den toestand der waterkeeringen en ten behoeve van waterpassingen, strand- en riviermetingen en dergelijke
      waterstaatsbelangen, vanwege het openbaar gezag merkpalen, peilschalen of -merken, seinmiddelen of andere teekens,
      moeten worden bevestigd, zijn gehouden het aanbrengen van die teekens en wat tot instandhouding daarvan en tot
      waarneming vereischt wordt, te dulden.

      2 De eigenaren en gebruikers van gronden, waarover of waardoor ten behoeve van een waterstaatsbelang vanwege het
      openbaar gezag electrische geleidingen moeten worden aangebracht, zijn gehouden het plaatsen der noodige palen,
      het leiden der draden, zoo boven als onder den grond, alsmede wat tot instandhouding daarvan vereischt wordt, te
      dulden. Het plaatsen van palen en het leiden van draden onder den grond in afgesloten tuinen en erven, die met
      bewoonde perceelen één geheel vormen, behoeft niet te worden gedoogd.

      3 Het bepaalde in de voorgaande leden is van overeenkomstige toepassing ten aanzien van verkeerstekens die op
      grond van de [Scheepvaartverkeerswet][ref1] (*Stb.* 1988, 352) door of vanwege het daartoe bevoegde gezag voor het
      scheepvaartverkeer worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004364
  - number: '11'
    text: |-
      1 Bij verordening kan worden bepaald, dat op erven en gronden, gelegen aan een watergang, waarvan het onderhoud
      geschiedt door of onder toezicht van het openbaar gezag, de specie moet worden ontvangen, welke, tot behoorlijk
      onderhoud voor de af- of aanvoer van water, uit den watergang wordt verwijderd.

      2 Behoudens aanspraak op schadevergoeding moet op erven en gronden, gelegen aan een watergang, welke door of onder
      toezicht van het openbaar gezag voor de af- of aanvoer van water wordt verbeterd of met toepassing van art. 12
      wordt aangelegd, de specie worden ontvangen, welke te dien einde wordt verwijderd.

      3 Erven en gronden, gescheiden van den watergang door een weg, voetpad of ander werk of door een grondstrook te
      gering van breedte om de specie te ontvangen, worden als aan den watergang gelegen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel11
  - number: '12'
    text: |-
      1 Krachtens een besluit tot verbetering of aanleg van een watergang voor de af- of aanvoer van water kan door Ons,
      door Gedeputeerde Staten, door het college van burgemeester en wethouders of door het bestuur van een waterschap,
      veenschap of veenpolder, naar gelang de zorg voor dien watergang berust bij of de aanleg geschiedt door het Rijk,
      een provincie, een gemeente of een der andere genoemde instellingen, met inachtneming van de volgende bepalingen
      en onder gehoudenheid veroorzaakte schade te vergoeden, verandering worden gebracht in den staat van onroerende
      zaken, bermen en paden of stroken langs de watergang, welke dienen voor het onderhoud dat eens of meerdere malen
      per jaar door of vanwege het openbaar gezag moet geschieden daaronder begrepen, maar kunstwerken daaronder niet
      begrepen, wanneer naar het oordeel van het bevoegd gezag de belangen van de rechthebbenden ten aanzien van die
      zaken redelijkerwijs onteigening niet vorderen.

      2 Krachtens besluit tot uitvoering van werken ten behoeve van verbetering of verruiming van de rivier kunnen door
      Ons, met inachtneming van de volgende bepaling en onder gehoudenheid veroorzaakte schade te vergoeden, gronden
      worden afgegraven of opgehoogd, geulen daarin worden gedicht en daarop aanwezige beplantingen worden opgeruimd,
      wanneer naar Ons oordeel de belangen van rechthebbenden ten aanzien van die zaken redelijkerwijs onteigening niet
      vorderen.

      3 Op de voorbereiding van het besluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing,
      waarbij in ieder geval ter inzage worden gelegd een plan van het werk waarbij de bij de uitvoering betrokken
      percelen met hun kadastrale nummers zijn aangewezen, alsmede uittreksels uit de basisregistratie kadaster
      betreffende die percelen.

      4 Wanneer zienswijzen naar voren zijn gebracht wordt het koninklijk besluit niet genomen, dan nadat de Raad van
      State is gehoord. [Artikel 18a van de Wet op de Raad van State][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
      [ref2]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
