  - number: '72'
    text: |-
      1 De beheerder is in geval van gevaar, en zolang de daardoor ontstane situatie zulks noodzakelijk maakt, bevoegd
      maatregelen te treffen die hij nodig oordeelt, zo nodig in afwijking van wettelijke voorschriften. Deze bevoegdheid
      geldt niet indien de maatregelen in strijd zouden komen met de [Grondwet][ref1] of enige internationaalrechtelijke
      verplichting.

      2 Indien gedeputeerde staten beheerder zijn en de omstandigheden geen voorafgaande bijeenroeping van gedeputeerde
      staten gedogen, is Onze commissaris in de provincie bevoegd de in het eerste lid bedoelde maatregelen te treffen,
      zolang deze toestand voortduurt en totdat gedeputeerde staten van hun bevoegdheden gebruik maken.

      3 De beheerder brengt, zodra de feitelijke omstandigheden op grond waarvan gebruik is gemaakt van de in het eerste
      of tweede lid bedoelde bevoegdheid zulks toelaten, de staat van zaken, indien mogelijk, zoveel mogelijk weer in
      overeenstemming met de staat, welke is voorgeschreven.

      4 De beheerder draagt zorg voor een analyse van het optreden en verder handelen bij toepassing van het eerste
      tot en met het derde lid. Hij zendt in elk geval een exemplaar van deze analyse ter kennisneming aan gedeputeerde
      staten alsmede aan burgemeester en wethouders van de gemeenten waarbinnen de waterstaatswerken zijn gelegen. Indien
      gedeputeerde staten beheerder zijn, zenden zij een exemplaar van deze analyse tevens aan Onze Minister van Verkeer
      en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001840
    url: https://wetten.overheid.nl/BWBR0001867/2008-01-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0001840
  - number: '73'
    text: |-
      1 Indien de beheerder, niet zijnde gedeputeerde staten, toepassing heeft gegeven aan
      [artikel 72, eerste lid][ref1], geeft hij hiervan onverwijld kennis aan gedeputeerde staten. Gedeputeerde staten
      geven hiervan onverwijld kennis aan Onze Minister van Verkeer en Waterstaat met uitzondering van het geval waarin
      de kennisgeving van Onze Minister zelf afkomstig is.

      2 Indien gedeputeerde staten of Onze commissaris in de provincie toepassing hebben gegeven aan
      [artikel 72, eerste respectievelijk tweede lid][ref2], geven zij hiervan onverwijld kennis aan Onze Minister van
      Verkeer en Waterstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel72
