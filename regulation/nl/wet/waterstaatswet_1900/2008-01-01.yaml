  - number: '78'
    text: |-
      1 Aan degene die ten gevolge van het treffen van maatregelen als bedoeld in [artikel 72][ref1] of [76][ref2]
      schade lijdt of zal lijden, welke redelijkerwijze niet of niet geheel te zijnen laste behoort te blijven en
      waarvan de vergoeding niet of niet op andere wijze voldoende is verzekerd, wordt op diens verzoek door de beheerder
      onderscheidenlijk het bestuursorgaan die de maatregel heeft getroffen een schadevergoeding toegekend.

      2 Deze schadevergoeding kan worden bepaald in geld of in andere vorm.

      3 Indien het te vergoeden nadeel voortvloeit uit het treffen van maatregelen krachtens [artikel 76][ref3], kan het
      bestuursorgaan dat de maatregelen heeft getroffen de schadevergoeding in rekening brengen bij de beheerder van de
      betreffende waterstaatswerken.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel72
