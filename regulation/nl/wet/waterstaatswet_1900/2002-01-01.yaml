preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, saluut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het noodzakelijk is algemeene regels omtrent het waterstaatsbestuur
    te stellen;

    Gezien art. 188 der Grondwet;

    Zoo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Het bij anderen in beheer of onderhoud brengen van waterstaatswerken die bij het Rijk in beheer of onderhoud zijn,
      alsmede het bij het Rijk in beheer of onderhoud brengen van waterstaatswerken die bij anderen dan het Rijk in
      beheer of onderhoud zijn dan wel die onbeheerd zijn, geschiedt bij wet.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel1
  - number: '1.2'
    text: |-
      In afwijking van het eerste lid kunnen waterstaatswerken in beheer of onderhoud bij het Rijk, die niet van
      nationaal belang zijn, bij koninklijk besluit bij anderen in beheer of onderhoud worden gebracht, indien
      daaromtrent overeenstemming is bereikt tussen het Rijk en die anderen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel1
  - number: '1.3'
    text: |-
      In afwijking van het eerste lid kunnen waterstaatswerken in beheer of onderhoud bij anderen, die van nationaal
      belang zijn, bij koninklijk besluit bij het Rijk in beheer of onderhoud worden gebracht, indien daaromtrent
      overeenstemming is bereikt tussen het Rijk en die anderen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel1
  - number: '1.4'
    text: |-
      Een besluit als bedoeld in het tweede en derde lid geschiedt op gemeenschappelijke voordracht van Onze Minister met
      de uitvoering van deze wet belast en van Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel1
  - number: '2.1'
    text: |-
      De Provinciale Staten kunnen, waterstaatswerken in beheer of onderhoud bij anderen dan het Rijk, de beheerders
      gehoord, zoomede onbeheerde waterstaatswerken in het beheer en onderhoud der provincie brengen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel2
  - number: '2.2'
    text: |-
      Zij, die van het onderhoud of het geven van bijdragen tot het onderhoud worden bevrijd, kunnen bij het besluit tot
      overneming in beheer en onderhoud bij de provincie worden verplicht tot afkoopbare jaarlijksche uitkeeringen, welke
      gezamenlijk niet hooger mogen worden gesteld, dan hetgeen per jaar voor behoorlijk onderhoud werd vereischt.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel2
  - number: '2.3'
    text: |-
      Indien voor het gebruik van een waterstaatswerk, dat door de provincie in beheer en onderhoud wordt genomen,
      rechten worden geheven, wordt, behoudens het geval, dat ingevolge [artikel 54 van de Wegenwet][ref1]
      schadevergoeding wordt gegeven, wegens het gemis van de opbrengst der heffing schadevergoeding toegekend, welke in
      het besluit der Staten tot overneming in beheer en onderhoud wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001948#Artikel54
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001948
        artikel: '54'
  - number: '2.4'
    text: |-
      Het in de beide vorige leden van dit artikel bepaalde is alleen van toepassing, indien omtrent de in het eerste lid
      bedoelde overneming geen overeenstemming is verkregen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel2
  - number: '3'
    text: |-
      Wanneer de noodzakelijkheid tot voorziening in een waterstaatsbelang bestaat, en de tot regelen bevoegde macht in
      gebreke blijft tot regeling van dat belang over te gaan, kan eene wet de wijze bepalen, waarop in dat belang zal
      worden voorzien.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel3
  - number: '4.1'
    text: |-
      Indien de besturen van twee of meer provincies niet of niet binnen redelijke termijn tot overeenstemming komen
      over de regeling van belangen van waterstaat die hen gemeenschappelijk aangaan omdat zij van mening verschillen
      over de noodzaak of de inhoud van de regeling, kan daarin bij algemene maatregel van bestuur worden voorzien.
      [Artikel 18][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '4.2'
    text: |-
      Op overtreding van voorschriften, bij algemene maatregel van bestuur krachtens dit artikel gegeven, kunnen dezelfde
      straffen worden gesteld als provinciale staten krachtens de wet op overtreding van hun verordeningen en reglementen
      kunnen stellen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel4
  - number: '4.3'
    text: |-
      Alvorens een voordracht te doen tot een algemene maatregel van bestuur als bedoeld in het eerste lid, hoort Onze
      Minister van Verkeer en Waterstaat gedeputeerde staten van de desbetreffende provincies.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel4
  - number: '5.1'
    text: |-
      In het Rijkswaterstaatsbestuur, daaronder begrepen de uitoefening van het oppertoezicht over den waterstaat, voor
      zooveel een en ander Onzen Minister met de uitvoering dezer wet belast, is opgedragen, zijn onder diens bevelen
      ambtenaren van den Rijkswaterstaat, door Ons of van Onzentwege te benoemen, werkzaam.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      De inrichting van den Rijkswaterstaatsdienst in het eerste lid bedoeld, wordt bij algemeenen maatregel van bestuur
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel5
  - number: 5a.1
    text: |-
      Er is een Commissie van advies inzake de waterstaatswetgeving die tot taak heeft de regering en de beide kamers der
      Staten-Generaal te adviseren over de inhoud en structuur van de wetgeving op het gebied van de waterstaatszorg.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel5a
  - number: 5a.2
    text: De Commissie bestaat uit een voorzitter en ten hoogste 6 andere leden.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel5a
  - number: '6.1'
    text: |-
      Ieder, die waterstaatswerken in beheer heeft of daarover toezicht uitoefent, is verplicht aan Onzen met
      de uitvoering dezer wet belasten Minister en de door hem aangewezen ambtenaren, in de uitoefening van het
      oppertoezicht werkzaam, alle inlichtingen te geven tot uitoefening van het oppertoezicht verlangd, bij het opnemen
      dier werken den gevraagden bijstand te verleenen en daarbij desverlangd tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel6
  - number: '6.2'
    text: |-
      Ten behoeve van het opnemen dier werken hebben de in het eerste lid genoemde ambtenaren toegang tot de werken en
      zijn zij bevoegd ook afgesloten erven tot dat einde te betreden.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel6
  - number: '7'
    text: |-
      De door Onze Minister van Verkeer en Waterstaat, door Onze commissaris in de provincie, gedeputeerde staten en
      de besturen van gemeenten en waterschappen aangewezen personen zijn bevoegd een woning zonder toestemming van de
      bewoner te betreden, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is, ten einde de toestand
      van waterstaatswerken te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel7
  - number: '9.1'
    text: |-
      Wanneer tot het maken van ontwerpen voor het aanleggen, onderhouden of verbeteren van een waterstaatswerk,
      gravingen, opmetingen of het stellen van teekens op iemands grond noodig worden geacht, moeten zoowel de eigenaren
      als de gebruikers van dien grond dit gedoogen, mits dit aan laatstgenoemden ten minste tweemaal vier en twintig
      uren te voren, hetzij door het bestuur van het publiekrechtelijk lichaam, dat het waterstaatswerk ontwerpt,
      aanlegt, onderhoudt of verbetert, hetzij door den burgemeester, schriftelijk zij aangezegd.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Wanneer tot het uitvoeren van werken aan waterkeeringen of watergangen, rivierwerken daaronder begrepen,
      grondspecie en bouwstoffen, desgevorderd in vervoermiddelen, over iemands grond moeten worden vervoerd of
      daarop tijdelijk neergelegd, moeten de eigenaren en gebruikers dit toelaten, doch, tenzij het betreft gewone
      onderhoudswerken of het bestuur van het publiekrechtelijk lichaam, waarbij de werken in beheer zijn, aan den
      gebruiker de verklaring overlegt, dat onverwijlde voorziening noodig is, onder dezelfde voorwaarde als in het
      eerste lid gesteld.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Onder gelijke beperking moeten eigenaren en gebruikers van binnen de begrenzing van de rivier gelegen gronden
      toelaten dat kribben, dammen of andere rivierwerken van het rijk daaraan onderscheidenlijk daarover of daarop
      worden aangesloten, doorgetrokken of veranderd.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel9
  - number: '9.4'
    text: |-
      De bepalingen van dit artikel kunnen door de eigenaren en gebruikers van gronden niet worden ingeroepen, wanneer
      het gebruikmaken van iemands grond uit eene verordening of uit eene verplichting uit anderen hoofde volgt.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      De eigenaren en gebruikers van gronden en gebouwen en de beheerders van werken, waarin of waarop ten behoeve van
      driehoeksmeting, van de aanduiding van waterhoogten, van het geven van seinen in verband met die waterhoogten en
      met den toestand der waterkeeringen en ten behoeve van waterpassingen, strand- en riviermetingen en dergelijke
      waterstaatsbelangen, vanwege het openbaar gezag merkpalen, peilschalen of -merken, seinmiddelen of andere teekens,
      moeten worden bevestigd, zijn gehouden het aanbrengen van die teekens en wat tot instandhouding daarvan en tot
      waarneming vereischt wordt, te dulden.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel10
  - number: '10.2'
    text: |-
      De eigenaren en gebruikers van gronden, waarover of waardoor ten behoeve van een waterstaatsbelang vanwege het
      openbaar gezag electrische geleidingen moeten worden aangebracht, zijn gehouden het plaatsen der noodige palen,
      het leiden der draden, zoo boven als onder den grond, alsmede wat tot instandhouding daarvan vereischt wordt, te
      dulden. Het plaatsen van palen en het leiden van draden onder den grond in afgesloten tuinen en erven, die met
      bewoonde perceelen één geheel vormen, behoeft niet te worden gedoogd.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      Het bepaalde in de voorgaande leden is van overeenkomstige toepassing ten aanzien van verkeerstekens die op grond
      van de [Scheepvaartverkeerswet][ref1] (*Stb.* 1988, 352) door of vanwege het daartoe bevoegde gezag voor het
      scheepvaartverkeer worden aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0004364
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004364
  - number: '11.1'
    text: |-
      Bij verordening kan worden bepaald, dat op erven en gronden, gelegen aan een watergang, waarvan het onderhoud
      geschiedt door of onder toezicht van het openbaar gezag, de specie moet worden ontvangen, welke, tot behoorlijk
      onderhoud voor de af- of aanvoer van water, uit den watergang wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel11
  - number: '11.2'
    text: |-
      Behoudens aanspraak op schadevergoeding moet op erven en gronden, gelegen aan een watergang, welke door of onder
      toezicht van het openbaar gezag voor de af- of aanvoer van water wordt verbeterd of met toepassing van art. 12
      wordt aangelegd, de specie worden ontvangen, welke te dien einde wordt verwijderd.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Erven en gronden, gescheiden van den watergang door een weg, voetpad of ander werk of door een grondstrook te
      gering van breedte om de specie te ontvangen, worden als aan den watergang gelegen aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      Krachtens een besluit tot verbetering of aanleg van een watergang voor de af- of aanvoer van water kan door Ons,
      door Gedeputeerde Staten of door het bestuur van een gemeente, waterschap, veenschap of veenpolder, naar gelang de
      zorg voor dien watergang berust bij of de aanleg geschiedt door het Rijk, een provincie, een gemeente of een der
      andere genoemde instellingen, met inachtneming van de volgende bepalingen en onder gehoudenheid veroorzaakte schade
      te vergoeden, verandering worden gebracht in den staat van onroerende zaken, bermen en paden of stroken langs de
      watergang, welke dienen voor het onderhoud dat eens of meerdere malen per jaar door of vanwege het openbaar gezag
      moet geschieden daaronder begrepen, maar kunstwerken daaronder niet begrepen, wanneer naar het oordeel van het
      bevoegd gezag de belangen van de rechthebbenden ten aanzien van die zaken redelijkerwijs onteigening niet vorderen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      Krachtens besluit tot uitvoering van werken ten behoeve van verbetering of verruiming van de rivier kunnen door
      Ons, met inachtneming van de volgende bepaling en onder gehoudenheid veroorzaakte schade te vergoeden, gronden
      worden afgegraven of opgehoogd, geulen daarin worden gedicht en daarop aanwezige beplantingen worden opgeruimd,
      wanneer naar Ons oordeel de belangen van rechthebbenden ten aanzien van die zaken redelijkerwijs onteigening niet
      vorderen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
  - number: '12.2'
    text: |-
      Bij de voorbereiding van het besluit wordt toepassing gegeven aan de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure, waarbij in ieder geval ter inzage
      worden gelegd een plan van het werk waarbij de bij de uitvoering betrokken percelen met hun kadastrale nummers zijn
      aangewezen, alsmede uittreksels uit de kadastrale leggers betreffende die percelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '12.3'
    text: |-
      Onverminderd [artikel 3:12, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt van de terinzagelegging
      voorafgaand kennis gegeven aan hen die in de registers van het kadaster als eigenaren van de percelen bekend staan
      voor zover hun woonplaatsen bekend en binnen Nederland gelegen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
  - number: '12.4'
    text: |-
      De termijn waarbinnen zienswijzen naar voren kunnen worden gebracht, eindigt op de laatste dag van
      terinzagelegging.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
  - number: '12.5'
    text: |-
      Wanneer zienswijzen naar voren zijn gebracht wordt het koninklijk besluit niet genomen, dan nadat de Raad van State
      is gehoord. [Artikel 18][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '12.6'
    text: |-
      Binnen een maand na de totstandkoming wordt het besluit van Gedeputeerde Staten aan Onze Minister, met de
      uitvoering van deze wet belast, meegedeeld.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
  - number: '12.7'
    text: Het besluit van een gemeentebestuur wordt binnen een maand na de totstandkoming aan Gedeputeerde Staten meegedeeld.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12
  - number: 12a.1
    text: |-
      Ter verbetering van een watergang, welke dienstbaar is of wordt gemaakt voor de af- of aanvoer van water of voor de
      scheepvaart en waarvoor de zorg berust bij het Rijk, eene provincie, gemeente, waterschap, veenschap of veenpolder,
      kan verandering, verplaatsing of verwijdering worden bevolen van kunstwerken, welke zich onder, in of boven den
      watergang of daaraan grenzende terreinen bevinden en niet bij het Rijk in onderhoud zijn.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.2
    text: |-
      Op verzoek van de instelling, bij welke de zorg voor den watergang berust, wordt het bevel door Ons uitgevaardigd,
      wanneer de watergang door het Rijk, of de watergang of het kunstwerk door eene provincie wordt onderhouden, en in
      de overige gevallen door Gedeputeerde Staten van de provincie of provinciën, waarin het kunstwerk is gelegen. Het
      besluit van Gedeputeerde Staten is aan Onze goedkeuring onderworpen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.3
    text: |-
      Wanneer zienswijzen naar voren zijn gebracht wordt Ons bevel niet uitgevaardigd, dan nadat de Raad van State is
      gehoord. [Artikel 18][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: 12a.4
    text: |-
      Bij de voorbereiding van het bevel wordt toepassing gegeven aan de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: 12a.5
    text: |-
      Bij het bevel wordt, zoo noodig, door het stellen van voorwaarden en door het aan verzoekster of derden opleggen
      van de verplichting om werken te maken er tegen gewaakt, dat het belang, ter behartiging waarvan het kunstwerk
      strekt, en andere belangen worden geschaad. Is dit niet te voorkomen, dan wordt het bevel alleen dan uitgevaardigd,
      wanneer de beoogde verbetering van grooter beteekenis wordt geacht dan de nadeelen, welke van de verandering,
      verplaatsing of verwijdering van het kunstwerk het gevolg zullen zijn.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.6
    text: |-
      Het bevel sluit de opheffing in zich van alle belemmeringen, bij de verandering, verplaatsing of verwijdering van
      de kunstwerken uit bepalingen van verordeningen voortspruitende.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.7
    text: |-
      In het bevel worden, voor zooveel noodig, de te maken werken omschreven en voorschriften gegeven omtrent
      vaststelling van bestekken, aanbesteding en uitvoering van die werken.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.8
    text: |-
      Het bestuursorgaan dat het bevel heeft uitgevaardigd, is bevoegd tot toepassing van bestuursdwang ter handhaving
      van het bevel. Het bestuursorgaan kan deze bevoegdheid delegeren aan de verzoeker en in verband daarmee de inhoud
      van het bevel wijzigen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.9
    text: |-
      Onverminderd [artikel 5:25 van de Algemene wet bestuursrecht][ref1] zijn de kosten die ter voldoening aan het bevel
      worden gemaakt voor rekening van verzoekster.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 12a.10
    text: |-
      De onderhoudsplichtige van het kunstwerk blijft ook na de verandering of verplaatsing tot onderhoud verplicht. Is
      de onderhoudslast verzwaard, dan wordt hem de daardoor te lijden schade door verzoekster vergoed.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.11
    text: |-
      Verzoekster is tot een bij het bevel te stellen termijn bevoegd terug te komen op haar verlangen dat het kunstwerk
      zal worden veranderd, verplaatst of verwijderd. Heeft zij daarvan kennis gegeven aan het bestuursorgaan, waarvan
      het bevel is uitgegaan, dan wordt het bevel ingetrokken.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12a.12
    text: |-
      Dit artikel is niet van toepassing op kunstwerken dienende tot uitoefening van molenrechten of andere burgerlijke
      rechten tot het ontleenen van water aan of het gebruiken van water van den watergang, indien de uitoefening van die
      rechten door de beoogde verandering, verplaatsing of verwijdering onmogelijk zou worden gemaakt.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12a
  - number: 12b.1
    text: |-
      De schade, welke uit de toepassing der bepalingen van [artt. 9][ref1], [10][ref2], [art. 11, tweede lid][ref3],
      [artikel 12, eerste en tweede lid][ref4], en [art. 12][ref5] voor de rechthebbenden mocht voortvloeien, wordt, voor
      zoover de aanspraak op schadevergoeding niet door bestaande verplichtingen wordt uitgesloten, door hen, te wier
      name of last het werk wordt ontworpen of uitgevoerd, vergoed.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0001867#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0001867#Artikel12
      [ref5]: https://wetten.overheid.nl/BWBR0001867#Artikel12a
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12b
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '9'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001867
        artikel: '10'
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001867
        artikel: '11'
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0001867
        artikel: '12'
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0001867
        artikel: 12a
        paragraaf: '6'
  - number: 12b.2
    text: |-
      De vordering daartoe wordt behandeld en beslist door de kantonrechter van de rechtbank van het arrondissement,
      waarin de zaak geheel of ten deele is gelegen, zonder hooger beroep, indien de vordering niet meer dan € 1 750
      beloopt, en behoudens hooger beroep tot welke som de vordering zich mocht uitstrekken.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12b
  - number: 12b.3
    text: De gedaagde is verplicht bij zijn antwoord te verklaren, welk bedrag hij bereid is als schadevergoeding te betalen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12b
  - number: 12b.4
    text: |-
      De kosten van het geding komen ten laste van den gedaagde, tenzij de rechter in de omstandigheden van het geding
      aanleiding vindt om de kosten geheel of voor een deel te compenseeren, behoudens dat de kosten geheel door den
      eischer worden gedragen, indien hem niet meer wordt toegewezen dan door gedaagde bij zijn antwoord werd aangeboden.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12b
  - number: 12c.1
    text: |-
      De kosten wegens schade, toegebracht aan waterstaatswerken in beheer of onderhoud bij een provincie, een waterschap
      of een gemeente, waarvoor eigenaren of gebruikers van vaartuigen wettelijk aansprakelijk zijn, worden de daartoe
      aangewezen ambtenaar geraamd en vermeld in een proces-verbaal dat, zo mogelijk, aan de schipper in afschrift wordt
      meegedeeld.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12c
  - number: 12c.2
    text: |-
      Indien het geraamde bedrag aan de betrokken ambtenaar niet tot zekerheid wordt betaald of niet tot diens genoegen
      zekerheid wordt gesteld voor betaling daarvan binnen redelijke termijn, is deze ambtenaar bevoegd, desnoods met
      behulp van de sterke arm, het voortzetten van de reis, het ondernemen van de terugtocht of het aanvangen van een
      nieuwe reis, ook indien het vaartuig inmiddels buiten zijn ambtsgebied is gebracht, te beletten.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12c
  - number: 12c.3
    text: |-
      Onverminderd het recht op volledige vergoeding van de schade is het betrokken publiekrechtelijk lichaam bevoegd
      het betaalde bedrag aan te wenden tot herstel van de schade. Indien blijkt dat de werkelijke kosten wegens schade
      minder bedragen dan het betaalde bedrag, wordt het overschot, met de wettelijke rente daarvan vanaf de dag der
      betaling, uitgekeerd aan degene die heeft betaald.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel12c
  - number: '37.1'
    text: |-
      Gedeputeerde Staten kunnen bevelen staking der uitvoering van waterstaatswerken, die verricht wordt in strijd met
      het algemeen of provinciaal belang of met het belang van een ander waterschap, veenschap of veenpolder dan dat,
      hetwelk de werken onderneemt.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel37
  - number: '37.2'
    text: Deze bevoegdheid geldt niet ten aanzien van werken, welke door het Rijk worden ondernomen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel37
  - number: '37.3'
    text: |-
      In geval van provinciale werken kan Onze voornoemde Minister staking bevelen van de uitvoering wegens strijd met
      het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel37
  - number: '38.1'
    text: |-
      De uitvoering van noodzakelijke waterstaatswerken en voorzieningen, waaronder ook opruimingen worden verstaan,
      welke door de daartoe verplichten niet geschiedt, kan door Gedeputeerde Staten worden bevolen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel38
  - number: '38.2'
    text: |-
      Het bevel kan gegeven worden aan ieder die een waterstaatswerk in beheer of onderhoud heeft met uitzondering van
      het Rijk.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel38
  - number: '38.3'
    text: |-
      Indien de in het eerste lid bedoelde verplichting op een provincie rust, wordt het bevel gegeven door Onze
      voornoemde Minister.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel38
  - number: '38.4'
    text: |-
      Aan het bestuur eener gemeente kan het bevel niet worden gegeven, indien de verplichting alleen op zijne zorg voor
      de huishouding der gemeente steunt.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel38
  - number: '38.5'
    text: |-
      Het bevel kan mede worden gegeven, indien de verplichting voortspruit uit eene gemeenschappelijke regeling door
      twee of meer gemeenten, waterschappen, veenschappen of veenpolders tot stand gebracht.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel38
  - number: '39.1'
    text: |-
      Indien Gedeputeerde Staten van de hun in [artikel 37][ref1] toegekende bevoegdheid, geen gebruik maken, kan Onze
      voornoemde Minister, Gedeputeerde Staten gehoord, de daar bedoelde bevelen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel37
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '37'
        paragraaf: '12'
  - number: '39.2'
    text: |-
      Het bepaalde in het voorgaande lid is eveneens van toepassing op het bevel bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel38
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '38'
        paragraaf: '12'
  - number: '42'
    text: |-
      Onze Minister van Verkeer en Waterstaat is bevoegd tot toepassing van bestuursdwang ter handhaving van een door hem
      gegeven bevel als bedoeld in [§12][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Paragraaf12
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001867
        paragraaf: '12'
  - number: 42b
    text: |-
      Onze Minister van Verkeer en Waterstaat kan, ter handhaving van een door hen gegeven bevel als bedoeld in
      [§12][ref1], aan gedeputeerde staten opdragen bestuursdwang toe te passen, dan wel zelf tot toepassing van
      bestuursdwang overgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Paragraaf12
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel42b
    references:
      - id: ref1
        bwb_id: BWBR0001867
        paragraaf: '12'
  - number: 42c
    text: |-
      Vordert de tenuitvoerlegging van een bevel door Gedeputeerde Staten dat gelden worden voorgeschoten, dan geschiedt
      dit uit ’s Rijks kas, tenzij daarvoor gelden op de begroting voor provinciale uitgaven zijn uitgetrokken.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel42c
  - number: '43'
    text: |-
      Indien op een ingesteld beroep geheel of gedeeltelijk ten voordele van hem, aan wie het bevel is gegeven, wordt
      beslist, komen, indien dit bevel reeds is tenuitvoergelegd, de kosten van tenuitvoerlegging en van noodzakelijk
      herstel in de vorige staat geheel of voor een overeenkomstig gedeelte ten laste van het Rijk, indien Onze Minister
      van Verkeer en Waterstaat het bevel heeft tenuitvoergelegd dan wel de tenuitvoerlegging door Onze Minister van
      Verkeer en Waterstaat aan Gedeputeerde Staten is opgedragen en in de overige gevallen ten laste van de provincie.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel43
  - number: '44.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de door Onze Minister van
      Verkeer en Waterstaat, door Onze Commissaris in de provincie, door het College van gedeputeerde staten of door de
      besturen van waterschappen en gemeenten aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel44
  - number: '44.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning te
      betreden zonder toestemming van de bewoner.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel44
  - number: '66.1'
    text: |-
      Wordt een bevel, als bedoeld in de [artikelen 36][ref1], [37][ref2] en [38][ref3] bij gemeenschappelijk besluit van
      twee of meer colleges van Gedeputeerde Staten gegeven, dan wordt bij dat besluit één van die colleges aangewezen
      voor de uitoefening van de bevoegdheden, bij deze wet aan of ten aanzien van Gedeputeerde Staten toegekend in
      verband met de tenuitvoerlegging, daaronder begrepen de bevoegdheid tot toepassing van bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0001867#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001867#Artikel38
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '36'
        paragraaf: '12'
      - id: ref2
        bwb_id: BWBR0001867
        artikel: '37'
        paragraaf: '12'
      - id: ref3
        bwb_id: BWBR0001867
        artikel: '38'
        paragraaf: '12'
  - number: '66.2'
    text: |-
      Indien de betrokken colleges zich niet met elkander over zulk een besluit verstaan, wordt het bevel gegeven en de
      aanwijzing gedaan door Onze met de uitvoering van deze wet belaste Minister.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel66
  - number: '66.3'
    text: |-
      De rechtsvordering tegen de provincie, bedoeld in [artikel 41][ref1], wordt ingesteld tegen de provincie, waarvan
      Gedeputeerde Staten voor de uitoefening van de in het eerste lid bedoelde bevoegdheden zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001867#Artikel41
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0001867
        artikel: '41'
        paragraaf: '12'
  - number: '67'
    text: |-
      In deze paragraaf wordt verstaan onder het bestuur van een waterschap, veenschap, veenpolder, gemeente of
      provincie: in het waterschap, het veenschap of den veenpolder het College, dat met het dagelijksch bestuur van
      die instelling is belast, in de gemeente Burgemeester en Wethouders en in de provincie Gedeputeerde Staten; onder
      waterkeeringen: die, welke zee-, rivier- of binnenwater keeren, met alle daarin of daaraan gelegen kunstwerken,
      welke gebezigd worden of kunnen worden tot keering van het water.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel67
  - number: '68.1'
    text: |-
      De bepalingen van provinciale verordeningen en reglementen betreffende onderwerpen, waarvoor in deze paragraaf
      voorschriften worden gegeven, blijven van kracht voor zoover zij niet zijn in strijd met de voorschriften van deze
      paragraaf.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel68
  - number: '68.2'
    text: |-
      De Staten der provinciën behouden de bevoegdheid tot het maken van reglementen en verordeningen betreffende
      onderwerpen, waarvoor in deze paragraaf voorschriften worden gegeven, mits die reglementen en verordeningen niet in
      strijd zijn met die voorschriften.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel68
  - number: '80.1'
    text: |-
      De besturen van waterschappen, veenschappen, veenpolders, gemeenten of provinciën, de laatste echter alleen in het
      geval van artikel 84, zijn bij dringend of dreigend gevaar van bezwijken of overloopen eener waterkeering, waarover
      zij het beheer hebben, verplicht de bevelen op te volgen, die ter verdediging van die waterkeering, schriftelijk
      worden gegeven door de, volgens de artikelen 81, 82 en 84 aangewezen, personen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel80
  - number: '80.2'
    text: |-
      Alleen zoodanige maatregelen mogen worden bevolen, als waartoe het bestuur, waartegen het bevel is gericht, onder
      de bestaande omstandigheden uit eigen beweging zoude mogen overgaan, met dien verstande echter, dat overeenkomsten
      betreffende waterkeering, waterloozing, waterinlating of bemaling door het bestuur of zijne voorgangers aangegaan,
      bevelen in strijd daarmede niet behoeven uit te sluiten.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel80
  - number: '81'
    text: |-
      Behoudens het bepaalde in de artikelen 82 en 84 gaat het in artikel 80 bedoelde bevel uit van een of meer leden van
      het college van gedeputeerde staten of van een ambtenaar van de provinciale waterstaat van de provincie waarin de
      betrokken waterkering is gelegen, die door het voornoemde college is of zijn aangewezen om zo nodig een bevel uit
      te vaardigen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel81
  - number: '82'
    text: |-
      Moeten de bevelen worden gericht tegen het bestuur van een waterschap, veenschap of veenpolder, hetwelk of welke
      in meer dan eene provincie zijn gelegen, dan ondergaat het in art. 81 bepaalde deze wijzigingen, dat de aanwijzing
      der personen, tot het geven der bevelen bevoegd, geschiedt door het College of de Colleges van Gedeputeerde
      Staten, die het toezicht hebben op het bestuur van het waterschap, het veenschap of den veenpolder en dat met het
      geven der bevelen kunnen worden belast een of meer leden van het of van de toezicht hebbende College of Colleges
      van Gedeputeerde Staten, alsmede een ambtenaar van den provincialen waterstaat van de provincie of van een der
      provinciën, aan wier Gedeputeerde Staten gemeld toezicht is opgedragen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel82
  - number: '84.1'
    text: |-
      Indien naar Ons oordeel ten onrechte niet of niet voldoende gebruik wordt gemaakt van de bij de artt. 81 en 82,
      in verband met art. 80, verleende bevoegdheden, alsmede indien bijzondere omstandigheden, te Onzer beoordeeling,
      het gewenscht maken, kunnen Wij het Rijkswaterstaatsbestuur met toezicht op de verdediging van een bepaalde
      waterkeering belasten. Deze opdracht strekt slechts tot beveiliging tegen het gevaar in art. 80 bedoeld en kan
      slechts voor een bij de opdracht te bepalen tijd geschieden.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel84
  - number: '84.2'
    text: |-
      Alsdan gaat het bevel ter verdediging van die waterkeering uit van een ambtenaar van den Rijkswaterstaat, niet
      beneden den rang van ingenieur, en belast met toezicht op de betrokken waterkeering.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel84
  - number: '85.1'
    text: |-
      Uitgezonderd in zeer spoedeisende gevallen, wordt bij het uitvaardigen van de in artikel 80 bedoelde bevelen een
      termijn gesteld, binnen welke daaraan moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: '85.2'
    text: Degene die een bevel heeft uitgevaardigd, is bevoegd tot toepassing van bestuursdwang ter handhaving van dat bevel.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: '85.3'
    text: |-
      In afwijking van [artikel 5:25 van de Algemene wet bestuursrecht][ref1] geschiedt de toepassing van bestuursdwang
      in de gevallen van de artikelen 81 en 82 voor rekening van de provincie of van de provincies wier gedeputeerde
      staten de persoon of de personen hebben aangewezen, die het bevel heeft of hebben gegeven, en in het geval van
      artikel 84 voor rekening van:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 85.3.a
    text: de provincie die het beheer heeft over de in dat artikel bedoelde waterkering;
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: 85.3.b
    text: de provincie waartoe de gemeente die het beheer heeft over die waterkering behoort;
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: 85.3.c
    text: de provincie of provincies waartoe het waterschap dat het beheer heeft over die waterkering behoort.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: '85.4'
    text: |-
      Geschiedt de toepassing van besturusdwang voor rekening van meer dan een provincie, dan wordt daarin door ieder van
      de provincies bijgedragen, in evenredigheid van hetgeen door de in ieder van de provincies gelegen gronden wordt
      bijgedragen in de lasten van het waterschap tegen welks bestuur het bevel was gericht.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: '85.5'
    text: |-
      De instelling tegen wiens bestuur het bevel was gericht, is verplicht de aan de toepassing van bestuursdwang
      verbonden kosten te vergoeden aan de instelling of instellingen voor wier rekening die zijn gekomen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: '85.6'
    text: |-
      Gedeputeerde staten nemen zo spoedig mogelijk een gespecificeerd besluit over het bedrag van de te vergoeden
      kosten.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel85
  - number: '89'
    text: |-
      Het volgens artikel 85 verschuldigde moet worden voldaan binnen dertien weken na de bekendmaking van het in het
      zesde lid van dat artikel bedoelde besluit.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel89
  - number: '90.1'
    text: |-
      Indien de daarop rechthebbende dat verlangt, wordt het door een waterschap, veenschap of veenpolder volgens art. 85
      verschuldigde, ingevorderd door het College van Gedeputeerde Staten van de provincie, waarin zoodanige instelling
      is gelegen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel90
  - number: '90.2'
    text: |-
      Deze invordering geschiedt door het College van Gedeputeerde Staten met het toezicht op het bestuur van die
      instelling belast, indien deze in meer dan eene provincie is gelegen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel90
  - number: '90.3'
    text: |-
      Is meer dan één College van Gedeputeerde Staten met dat toezicht belast, dan wijzen deze het College aan, dat voor
      deze invordering zorg zal dragen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel90
  - number: '91'
    text: |-
      In afwijking van [artikel 8:4, onderdeel ][ref1] kan een belanghebbende tegen een bevel als bedoeld in artikel 80
      beroep instellen bij de rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '96.1'
    text: |-
      Indien werkzaamheden, welke ter voldoening aan een bevel, krachtens art. 80 uitgevaardigd, door het bestuur van
      een waterschap, veenschap of veenpolder zijn uitgevoerd of krachtens art. 85 door het hooger gezag zijn verricht,
      uitsluitend of mede hebben gestrekt ter behartiging van de belangen van eene andere zoodanige instelling, kan
      aan die instelling de verplichting worden opgelegd om een te bepalen bedrag te voldoen aan de instelling, tegen
      welker bestuur het bevel was gericht, ter geheele of gedeeltelijke vergoeding van de kosten aan de uitvoering dier
      werkzaamheden verbonden, welke ten laste van deze laatste instelling zijn gebleven of gebracht.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel96
  - number: '96.2'
    text: |-
      Dit kan eveneens geschieden, wanneer werkzaamheden, welke uitsluitend of mede hebben gestrekt ter behartiging van
      de belangen van een andere zoodanige instelling en krachtens art. 80 zouden kunnen zijn bevolen, zonder voorafgaand
      bevel hebben plaats gehad.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel96
  - number: '97.1'
    text: |-
      De beslissing of en tot welk bedrag de in artikel 96 omschreven verplichting zal worden opgelegd, geschiedt bij
      verordening van de Staten van de provincie waarin de waterschappen, veenschappen of veenpolders welke bij die
      beslissing belang hebben, gelegen zijn. Bij de voorbereiding van de beslissing wordt toepassing gegeven aan de in
      [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] geregelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '97.2'
    text: |-
      Moet de beslissing door de Staten van meer dan eene provincie genomen worden, dan is art. 4 dezer wet van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel97
  - number: '98.1'
    text: |-
      Het bestuur van een waterschap, veenschap of veenpolder, waarvan gronden zijn overstroomd, is onverminderd zijne
      verplichting tot voldoening aan bevelen krachtens art. 80 uit te vaardigen, verplicht de bevelen op te volgen
      tot het nemen van maatregelen om de uitbreiding der overstrooming te keer te gaan of het gevaar daarvoor te
      verminderen, daaronder begrepen die tot het doorsteken eener waterkeering, met dien verstande echter, dat deze
      bevelen slechts mogen betreffen waterkeeringen of middelen tot waterloozing onder beheer van dat bestuur. Deze
      bevelen mogen slechts schriftelijk worden gegeven door de, volgens de artikelen 100 en 102 aangewezen, personen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel98
  - number: '98.2'
    text: |-
      Alleen zoodanige maatregelen mogen worden bevolen, als waartoe het bestuur, waartegen het bevel is gericht, onder
      de bestaande omstandigheden uit eigen beweging zoude mogen overgaan, met dien verstande echter, dat overeenkomsten
      betreffende waterkeering, waterloozing, waterinlating of bemaling, door het bestuur of zijne voorgangers aangegaan,
      bevelen in strijd daarmede niet behoeven uit te sluiten.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel98
  - number: '99'
    text: |-
      Indien krachtens een wet, een regeling krachtens art. 4 dezer wet, een provinciale verordening of een reglement van
      een waterschap, veenschap of veenpolder, van het bestuur van een dier instellingen kan worden gevorderd, dat het
      bij geheele of gedeeltelijke overstrooming van gronden van die instelling of van eene andere zoodanige instelling
      een daarin aangewezen handeling verrichte, is het, doen zich die omstandigheden voor, verplicht de daartoe
      strekkende bevelen op te volgen. De tweede zin van het eerste lid van artikel 98 is op deze bevelen van toepassing.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel99
  - number: '100.1'
    text: |-
      Behoudens het bepaalde in artikel 102, gaan de bevelen, bedoeld in de artikelen 98 en 99, uit van een of meer leden
      van het college van gedeputeerde staten of van een ambtenaar van de provinciale waterstaat van de provincie, waarin
      het waterschap tegen welks bestuur het bevel moet worden gericht is gelegen, die door het voornoemde college is of
      zijn aangewezen om zo nodig een bevel uit te vaardigen.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel100
  - number: '100.2'
    text: Artikel 82 is van toepassing.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel100
  - number: '102'
    text: |-
      Indien naar Ons oordeel ten onrechte geen gebruik wordt gemaakt van de bij art. 100, in verband met de artt. 98 en
      99, verleende bevoegdheden, alsmede indien bijzondere omstandigheden, te Onzer beoordeeling, het gewenscht maken,
      kunnen Wij het Rijkswaterstaatsbestuur met betrekking tot een bepaald waterschap of veenschap of een bepaalden
      veenpolder, en voor een bepaalden tijd, met het uitvaardigen der in de artt. 98 en 99 bedoelde bevelen belasten. In
      dat geval worden door Ons de ambtenaren van den Rijkswaterstaat, niet beneden den rang van ingenieur, aangewezen,
      van wie de bevelen moeten uitgaan.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel102
  - number: '103'
    text: Op deze afdeling zijn de artikelen 85, 89 tot en met 91, 96 en 97 van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel103
  - number: '104.1'
    text: |-
      Door Ons wordt bepaald, op welk tijdstip, of op welke tijdstippen onderscheidenlijk de bepalingen dezer wet in
      werking treden, voorzoover dit niet reeds is geschied.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel104
  - number: '104.2'
    text: |-
      Met de inwerkingtreding dezer wet, zooals zij oorspronkelijk is vastgesteld, zijn vervallen de wet van 12 Juli
      1855 (*Staatsblad* n°. 102), tot voorloopige voorziening in sommige waterstaatsbelangen, alsmede art. 7 van het
      Koninklijk besluit van 17 December 1819 n° 1 en de Koninklijke besluiten van 29 Maart 1822 (*Staatsblad* n°. 7),
      7 September 1822 (*Staatsblad* n°. 42), 23 September 1849 (*Staatsblad* n°. 50) en 14 April 1850 (*Staatsblad*
      n°. 16).
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel104
  - number: '104.3'
    text: |-
      Met de inwerkingtreding van de bepalingen van § 17 dezer wet, vervallen het Koninklijk besluit van 21 Augustus
      1835, n°. 23, houdende vaststelling van een reglement op de correspondentie bij ijsgang en hoog opperwater op
      de rivieren, met de besluiten, waarbij dat Koninklijk besluit is gewijzigd of aangevuld en de besluiten, die ter
      uitvoering daarvan zijn genomen, en het Koninklijk besluit van 18 December 1820, n°. 70.
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel104
  - number: '105'
    text: Deze wet kan worden aangehaald onder den naam "Waterstaatswet 1900".
    url: https://wetten.overheid.nl/BWBR0001867/2002-01-01#Artikel105
