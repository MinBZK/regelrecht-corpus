  - number: '4.1'
    text: |-
      De Wettelijke taken LNB van algemeen belang, zoals vastgesteld bij besluit van 27 juni 2006 en nadien diverse malen
      gewijzigd, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel4.1
  - number: '4.2'
    text: |-
      Dit besluit treedt in werking met ingang van de dag na de datum van uitgifte van de Staatscourant waarin het is
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel4.2
  - number: '4.3'
    text: 'Dit besluit wordt aangehaald als: Takencode gas LNB.'
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel4.3
