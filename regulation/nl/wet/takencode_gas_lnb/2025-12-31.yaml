articles:
  - number: 1.1.1
    text: |-
      Deze code betreft wettelijke taken van de netbeheerder van het landelijk gastransportnet als bedoeld in
      [artikel 12b, eerste lid, aanhef en onder d, Gaswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel12b
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel1.1.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 12b
  - number: 1.1.2
    text: |-
      Dit document bevat de voorwaarden betreffende de in
      [artikel 10a, eerste lid, aanhef en onder a, e en g, Gaswet][ref1], genoemde wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel1.1.2
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
  - number: 1.1.3
    text: |-
      De voorwaarden betreffende de in [artikel 10a, eerste lid, aanhef en onder b, c en d, Gaswet][ref1] genoemde
      wettelijke taken zijn opgenomen in de [Transportcode gas LNB][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0037950
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel1.1.3
    references:
      - id: ref1
        bwb_id: BWBR0011440
        artikel: 10a
      - id: ref2
        bwb_id: BWBR0037950
  - number: 1.2.1
    text: |-
      Begrippen, die in de [Gaswet][ref1] of de [Begrippencode gas](onbekend) zijn gedefinieerd, hebben de in de Gaswet
      of Begrippencode gas gedefinieerde betekenis.


      [ref1]: https://wetten.overheid.nl/BWBR0011440
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel1.2.1
    references:
      - id: ref1
        bwb_id: BWBR0011440
  - number: 2.1.1
    text: |-
      Ingevolge [artikel 3.64 van de Energiewet][ref1] treft de transmissiesysteembeheerder voorzieningen teneinde de
      leveranciers van eindafnemers met een kleine aansluiting voor gas in staat te stellen de pieklevering te verzorgen
      aan alle kleinverbruikers in Nederland.

      Hiertoe reserveert de netbeheerder van het landelijk gastransportnet entry- en exitcapaciteit in het landelijk
      gastransportnet en kan de netbeheerder van het landelijk gastransportnet zowel productiecapaciteit als gas
      reserveren.


      [ref1]: https://wetten.overheid.nl/BWBR0050714#Artikel3.64
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.1.1
    references:
      - id: ref1
        bwb_id: BWBR0050714
        artikel: '3.64'
  - number: 2.1.2
    text: |-
      Pieklevering betreft het deel van de feitelijke aflevering van gas in een uur aan alle kleinverbruikers in het
      portfolio van de erkende programmaverantwoordelijke dat de hoeveelheid te boven gaat zoals die maximaal in een uur
      aan de kleinverbruikers zou worden geleverd op een dag met een gemiddelde effectieve etmaal temperatuur in De Bilt
      van -9 °C. Deze maximale levering wordt door de netbeheerder van het landelijk gastransportnet maandelijks bepaald
      conform [2.1.2b van de Transportcode gas LNB][ref1], waarbij steeds als referentietemperatuur -9 oC wordt gebruikt.
      De transmissiesysteembeheerder zal aan de betreffende leveranciers gas leveren ten behoeve van pieklevering en het
      portfolio onbalans signaal van balanceringsverantwoordelijken dienovereenkomstig aanpassen.


      [ref1]: https://wetten.overheid.nl/BWBR0037950#Artikel2.1.2b
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.1.2
    references:
      - id: ref1
        bwb_id: BWBR0037950
        artikel: 2.1.2b
  - number: 2.1.6
    text: |-
      De berekeningsmethodologie voor het tarief voor de pieklevering van gas volgt uit een apart besluit overeenkomstig
      [artikel 3.13 van de Tarievencode gas][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037948#Artikel3.13
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.1.6
    references:
      - id: ref1
        bwb_id: BWBR0037948
        artikel: '3.13'
  - number: 2.2.1
    text: |-
      Indien de Autoriteit Consument en Markt een besluit neemt tot intrekking van de leveringsvergunning van een
      vergunninghouder meldt de Autoriteit Consument en Markt dit zo spoedig mogelijk aan de netbeheerder van het
      landelijk gastransportnet. De netbeheerder van het landelijk gastransportnet en de regionale netbeheerders handelen
      dan volgens het bepaalde in het [Besluit leveringszekerheid Gaswet][ref1] en volgens het bepaalde in dit onderdeel.
      De Autoriteit Consument en Markt vermeldt in het besluit de datum waarop de leveringsvergunning wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0016605
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.1
    references:
      - id: ref1
        bwb_id: BWBR0016605
  - number: 2.2.2
    text: |-
      De netbeheerder van het landelijk gastransportnet brengt onmiddellijk alle regionale netbeheerders op de hoogte van
      het in [2.2.1][ref1] bedoelde besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037933#Artikel2.2.1
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.2
    references:
      - id: ref1
        bwb_id: BWBR0037933
        artikel: 2.2.1
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 2.2.2b
    text: |-
      Iedere vergunninghouder geeft aan welke erkende programmaverantwoordelijke de programmaverantwoordelijkheid dient
      te dragen voor aansluitingen die op grond van het [Besluit leveringszekerheid Gaswet][ref1] aan de vergunninghouder
      worden toegewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0016605
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.2b
    references:
      - id: ref1
        bwb_id: BWBR0016605
  - number: 2.2.2c
    text: |-
      Indien de netbeheerder van het landelijk gastransportnet de te zijnen laste blijvende kosten volgens
      [artikel 3, zevende lid, Besluit leveringszekerheid Gaswet][ref1], in rekening brengt bij de vergunningshouders,
      zal de verdeling naar evenredigheid van het aantal kleinverbruikers dat zij beleveren van dat moment en worden
      uitgedrukt in procenten, waarbij zal worden afgerond op tienden van procenten.


      [ref1]: https://wetten.overheid.nl/BWBR0016605#Artikel3
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.2c
    references:
      - id: ref1
        bwb_id: BWBR0016605
        artikel: '3'
  - number: 2.2.2d
    text: |-
      In [bijlage 1][ref1] is de leidraad opgenomen voor een machineleesbaar en interoperabel
      formaat van de gegevens ten behoeve van de uitvoering door de vergunninghouders van
      [artikel 3, vijfde lid, van het Besluit vergunning levering gas aan kleinverbruikers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037933
      [ref2]: https://wetten.overheid.nl/BWBR0015154#Artikel3
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.2d
    references:
      - id: ref1
        bwb_id: BWBR0037933
      - id: ref2
        bwb_id: BWBR0015154
        artikel: '3'
  - number: 2.2.2e
    text: |-
      De verdeling van het bestand van kleinverbruikers als bedoeld in
      [artikel 3, zesde lid, van het Besluit Leveringszekerheid Gaswet][ref1], wordt uitgedrukt in procenten waarbij
      wordt afgerond op tienden van procenten waarbij, tenzij de Autoriteit Consument en Markt anders beslist, een
      minimum van vijf aansluitingen per vergunninghouder geldt. Zodra de wijze van verdeling bekend is meldt de
      netbeheerder van het landelijk gastransportnet deze aan de regionale netbeheerders.


      [ref1]: https://wetten.overheid.nl/BWBR0016605#Artikel3
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.2e
    references:
      - id: ref1
        bwb_id: BWBR0016605
        artikel: '3'
  - number: 2.2.3
    text: |-
      De regionale netbeheerder wijst vanaf de bekendmaking van het in [2.2.1][ref1] bedoelde [besluit][ref2]
      switchverzoeken betreffende wijziging van leverancier en/of erkende programmaverantwoordelijke af:

      a. die betrekking hebben op de leverancier, ten aanzien waarvan het in [2.2.1][ref3] bedoelde [besluit][ref4] is
      genomen; en

      b. die zijn binnengekomen na de start van de vensterperiode.

      Met vensterperiode wordt in het bepaalde in dit onderdeel 2.2 bedoeld de periode tussen die bekendmaking en de
      intrekking van de leveringsvergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0037933#Artikel2.2.1
      [ref2]: https://wetten.overheid.nl/BWBR0016605
      [ref3]: https://wetten.overheid.nl/BWBR0037933#Artikel2.2.1
      [ref4]: https://wetten.overheid.nl/BWBR0016605
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.3
    references:
      - id: ref1
        bwb_id: BWBR0037933
        artikel: 2.2.1
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0016605
      - id: ref3
        bwb_id: BWBR0037933
        artikel: 2.2.1
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0016605
  - number: 2.2.4
    text: |-
      In afwijking van [2.2.3][ref1] nemen regionale netbeheerders switches in het kader van het intrekken van de
      leveringsvergunning wel in behandeling op verzoek van

      a. de vergunninghouder van wie de leveringsvergunning ingevolge het in [2.2.1][ref2] bedoelde [besluit][ref3] wordt
      ingetrokken; of

      b. de curator, ingeval van faillissement van bedoelde vergunninghouder; of

      c. de vergunninghouder en de bewindvoerder gezamenlijk, ingeval bedoelde vergunninghouder in surseance verkeert, of

      d. de vergunninghouder die een deel van de aansluitingen heeft verkregen van de vergunninghouder van wie de
      leveringsvergunning ingevolge het in [2.2.1][ref4] bedoelde [besluit][ref5] wordt ingetrokken en nadat de
      eerstgenoemde vergunninghouder en de netbeheerder van het landelijk gastransportnet hebben afgesproken dat die
      vergunninghouder zelf de hiervoor benodigde switches indient. De netbeheerder van het landelijk gastransportnet
      zal bedoelde afspraak pas maken, nadat deze zich ervan heeft vergewist dat de vergunninghouder van wie de
      leveringsvergunning ingevolge het in 2.2.1 bedoelde besluit wordt ingetrokken ten onrechte geen opdracht tot de
      bedoelde switches zal geven.

      De switches dienen zo snel mogelijk doch uiterlijk voor het einde van de vensterperiode te zijn doorgevoerd. In
      alle gevallen is het verzoek voorzien van een opgave van de te switchen aangeslotenen in een door de regionale
      netbeheerders redelijkerwijs te verwerken format.


      [ref1]: https://wetten.overheid.nl/BWBR0037933#Artikel2.2.3
      [ref2]: https://wetten.overheid.nl/BWBR0037933#Artikel2.2.1
      [ref3]: https://wetten.overheid.nl/BWBR0016605
      [ref4]: https://wetten.overheid.nl/BWBR0037933#Artikel2.2.1
      [ref5]: https://wetten.overheid.nl/BWBR0016605
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.4
    references:
      - id: ref1
        bwb_id: BWBR0037933
        artikel: 2.2.3
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
