      - id: ref4
        bwb_id: BWBR0037933
        artikel: 2.2.1
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref5
        bwb_id: BWBR0016605
  - number: 2.2.5
    text: |-
      Regionale netbeheerders voeren zo snel mogelijk doch uiterlijk voor het einde van de vensterperiode de switches
      betreffende de overige aangeslotenen ter uitvoering van de verdeling als bedoeld in [2.2.2][ref1] uit nadat zij
      hiertoe opdracht hebben gekregen van de netbeheerder van het landelijk gastransportnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037933#Artikel2.2.2
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel2.2.5
    references:
      - id: ref1
        bwb_id: BWBR0037933
        artikel: 2.2.2
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '3.1'
    text: |-
      De netbeheerder van het landelijk gastransportnet draagt zorg voor beschikbaarheid van
      voldoende entry- en exitcapaciteit met het oog op voldoende transportzekerheid als bedoeld in
      [artikel 10a, eerste lid, aanhef en onder g, Gaswet][ref1], op de korte en op de lange termijn.

      De netbeheerder van het landelijk gastransportnet vervult deze taak op de lange termijn door middel van
      het realiseren van de capaciteitsuitbreidingen die worden voorzien in het investeringsplan en door te
      voldoen aan de aan de netbeheerder van het landelijk gastransportnet gestelde kwaliteitseisen op basis van
      [artikel 8 Gaswet][ref2] alsmede de [Regeling investeringsplan en kwaliteit elektriciteit en gas][ref3].

      De netbeheerder van het landelijk gastransportnet vervult deze taak op de korte termijn door middel van het
      toedelen van entry- en exitcapaciteit op objectieve, transparante en non-discriminatoire wijze alsmede door het in
      voorkomende gevallen toepassen van de regels voor het aanbieden van gecontracteerde entry- en exitcapaciteit die
      niet zal worden gebruikt conform de [Transportcode gas LNB][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0011440#Artikel10a
      [ref2]: https://wetten.overheid.nl/BWBR0011440#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0041543
      [ref4]: https://wetten.overheid.nl/BWBR0037950
    url: https://wetten.overheid.nl/BWBR0037933/2025-12-31#Artikel3.1
    references:
      - id: ref1
