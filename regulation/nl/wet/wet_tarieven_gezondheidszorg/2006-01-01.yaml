---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tarieven_gezondheidszorg
regulatory_layer: WET
publication_date: '2006-09-21'
valid_from: '2006-01-01'
bwb_id: BWBR0003356
url: https://wetten.overheid.nl/BWBR0003356/2006-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen ter bevordering van een
    evenwichtig stelsel van tarieven op het gebied van de gezondheidszorg mede met het oog op de beheersing van de
    kostenontwikkeling daarvan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.b
    text: |-
      het College: het College tarieven gezondheidszorg, bedoeld in [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel18
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '18'
        hoofdstuk: III
  - number: 1.1.c
    text: |-
      de FIOD-ECD: de Belastingdienst/Fiscale Inlichtingen- en Opsporingsdienst en Economische Controledienst van het
      Ministerie van Financiën;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.d
    text: |-
      het College van Beroep: het College van Beroep voor het bedrijfsleven, bedoeld in
      [artikel 2 van de Wet bestuursrechtspraak bedrijfsorganisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002144#Artikel2
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002144
        artikel: '2'
  - number: 1.1.e
    text: 'ziektekostenverzekeraar:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.e.1°
    text: |-
      een zorgverzekeraar als bedoeld in de [Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1.1.e.2°
    text: |-
      een zorgverzekeraar die zich overeenkomstig [artikel 33 van de Algemene Wet Bijzondere Ziektekosten][ref1] als
      zodanig heeft aangemeld voor de uitvoering van die wet;


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel33
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: '33'
  - number: 1.1.e.3°
    text: |-
      een particuliere ziektekostenverzekeraar, zijnde een verzekeraar, anders dan bedoeld onder 1° en 2°, die in het
      bezit is van de ingevolge [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] vereiste
      vergunning, of die heeft voldaan aan de ingevolge de [artikelen 37][ref2] of [38 van die wet][ref3] vereiste
      procedure met betrekking tot een bijkantoor in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0006509#Artikel38
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0006509
        artikel: '37'
      - id: ref3
        bwb_id: BWBR0006509
        artikel: '38'
  - number: 1.1.f
    text: 'orgaan voor gezondheidszorg:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.f.1
    text: een instelling voor gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.f.2
    text: |-
      een persoon die een medisch, paramedisch, psycho-sociaal dan wel psycho-therapeutisch, farmaceutisch of verplegend
      beroep of een bij algemene maatregel van bestuur aangewezen daarmede verwant beroep uitoefent;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.g
    text: |-
      instelling voor gezondheidszorg: een instelling in het kader waarvan medische, paramedische, psycho-sociale
      dan wel psycho-therapeutische, farmaceutische of verpleegkundige hulp wordt verleend, al dan niet gebonden aan
      de aanwezigheid van ruimtelijke voorzieningen voor de huisvestingen en de daarmee samenhangende verzorging van
      patiënten;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: 1.1.h
    text: |-
      tarief: prijs voor een prestatie, een deel van een prestatie of geheel van prestaties van een orgaan voor
      gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: '1.2'
    text: |-
      Deze wet is van toepassing op een orgaan voor gezondheidszorg en een daarmee gelijkgestelde voorziening of
      instelling, die bij algemene maatregel van bestuur wordt aangewezen of behoort tot een bij een zodanige maatregel
      aan te wijzen categorie.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kan een voorziening voor maatschappelijke dienstverlening, behorende tot een
      bij die maatregel aangewezen categorie, voor de toepassing van deze wet en de daarop berustende bepalingen met een
      orgaan voor gezondheidszorg worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: '1.4'
    text: |-
      Bij algemene maatregel van bestuur kan een instelling, behorende tot een bij die maatregel aangewezen categorie,
      met een orgaan voor gezondheidszorg worden gelijkgesteld, indien haar werkzaamheden geheel of gedeeltelijk liggen
      op het gebied van de gezondheidszorg of geheel of gedeeltelijk ten behoeve van de gezondheidszorg worden verricht
      en indien dat voor een goede uitvoering van deze wet nodig is.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: '1.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aangewezen prestaties nadere regelen worden
      gesteld ter zake van het bepaalde in het eerste lid, onder e tot en met h. Tot deze regelen kan behoren dat een of
      meer bepalingen van deze wet niet van toepassing zijn op de prijs voor een daarbij aangewezen prestatie, een deel
      van een prestatie of geheel van prestaties, door een orgaan voor gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel1
  - number: '2.1'
    text: 'Het is een orgaan voor gezondheidszorg verboden een tarief in rekening te brengen:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: 2.1.a
    text: voor een prestatie waarvoor geen prestatiebeschrijving overeenkomstig deze wet is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: 2.1.b
    text: |-
      voor een prestatie waarvoor een andere prestatiebeschrijving wordt gehanteerd dan overeenkomstig deze wet is
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: 2.1.c
    text: |-
      dat niet overeenkomt met het tarief dat voor de betrokken prestatie overeenkomstig deze wet is goedgekeurd of
      vastgesteld;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: 2.1.d
    text: |-
      dat niet ligt binnen de tariefruimte die op grond van [artikel 6a][ref1] of [8a][ref2] voor de betrokken prestatie
      is goedgekeurd onderscheidenlijk is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 6a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 8a
        hoofdstuk: II
  - number: 2.1.e
    text: anders dan op de wijze die overeenkomstig deze wet is goedgekeurd of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: '2.2'
    text: |-
      Het is een orgaan voor gezondheidszorg verboden een tarief, bedoeld in het eerste lid, te betalen aan een ander
      orgaan voor gezondheidszorg of aan een derde te vergoeden.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: '2.3'
    text: |-
      Het is een ziektekostenverzekeraar verboden een tarief, bedoeld in het eerste lid, te betalen of aan een derde
      te vergoeden.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: '2.4'
    text: |-
      Een orgaan voor gezondheidszorg en een ziektekostenverzekeraar kunnen aan het aanbieden, overeenkomen of leveren
      van een prestatie, bedoeld in het eerste lid, onder a of b, dan wel aan het in rekening brengen, betalen of aan een
      derde vergoeden van een tarief, bedoeld in het eerste lid, geen rechten ontlenen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: '2.5'
    text: |-
      De voorgaande leden zijn van overeenkomstige toepassing op een tarief voor een deel van een prestatie of een geheel
      van prestaties.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
  - number: '2.6'
    text: |-
      Het derde tot en met vijfde lid zijn van overeenkomstige toepassing op een verzekeraar als
      bedoeld in de [Wet toezicht verzekeringsbedrijf 1993][ref1], voor zover niet begrepen onder
      [artikel 1, eerste lid, onder e, sub 2][ref2], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006509
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel1
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006509
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '1'
        hoofdstuk: I
  - number: 2a.1
    text: |-
      Organen voor gezondheidszorg en ziektekostenverzekeraars voeren een administratie waaruit in ieder geval de
      overeengekomen en geleverde prestaties blijken, alsmede wanneer die prestaties zijn geleverd, aan welke patiënt
      respectievelijk verzekerde die prestaties zijn geleverd, de daarvoor in rekening gebrachte tarieven en de in
      verband daarmee ontvangen of verrichte betalingen of vergoedingen aan derden.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2a
  - number: 2a.2
    text: |-
      Organen voor gezondheidszorg en ziektekostenverzekeraars voeren op zodanige wijze een administratie dat te
      allen tijde mogelijk is elk voor de desbetreffende categorie van organen voor gezondheidszorg relevant tarief,
      dat overeenkomstig deze wet is goedgekeurd of vastgesteld of dat ligt binnen de tariefruimte die op grond van
      [artikel 6a][ref1] of [8a][ref2] is goedgekeurd onderscheidenlijk is vastgesteld, in rekening te brengen, te
      betalen of aan derden te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel8a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 6a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 8a
        hoofdstuk: II
  - number: 2a.3
    text: |-
      Het College kan nadere regels stellen betreffende de administratie ten behoeve van concurrentie in de regio,
      een adequate bedrijfsvoering, het voorkomen van fraude en de inzichtelijkheid en toegankelijkheid van die
      administratie.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2a
  - number: 2a.4
    text: |-
      Het eerste en tweede lid en de nadere regels zijn mede van toepassing ten aanzien van degene die voor een orgaan
      voor gezondheidszorg of ziektekostenverzekeraar een administratie voert alsmede ten aanzien van degene die een
      administratie voert ten behoeve van of in verband met het aanbieden, overeenkomen, leveren, in rekening brengen,
      betalen of vergoeden aan derden van een prestatie of een tarief of het ontvangen van een betaling.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2a
  - number: 2b.1
    text: |-
      Organen voor gezondheidszorg informeren hun patiënten tijdig en zorgvuldig omtrent het voor de prestatie in
      rekening te brengen tarief.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2b
  - number: 2b.2
    text: |-
      Organen voor gezondheidszorg brengen een tarief in rekening onder vermelding van de daarbijbehorende
      prestatiebeschrijving.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2b
  - number: 2b.3
    text: 'Het College stelt nadere regels betreffende het door organen voor gezondheidszorg:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2b
  - number: 2b.3.a
    text: bekendmaken van tarieven;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2b
  - number: 2b.3.b
    text: specificeren van op verrichte prestaties betrekking hebbende rekeningen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel2b
  - number: '3.1'
    text: |-
      Voor de toepassing van [dit hoofdstuk][ref1] worden onder representatieve organisaties van organen voor
      gezondheidszorg en representatieve organisaties van ziektekostenverzekeraars verstaan de organisaties van organen
      voor gezondheidszorg of van ziektekostenverzekeraars, welke Onze Minister op hun verzoek als zodanig aanwijst voor
      bij zijn besluit aangegeven categorieën van organen voor gezondheidszorg of van ziektekostenverzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003356
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Onze Minister kan regels stellen die worden gehanteerd bij de beoordeling van de representativiteit van
      organisaties als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel3
  - number: '3.3'
    text: Een aanwijzing als bedoeld in het eerste lid, kan onder voorwaarden of voor bepaalde tijd worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel3
  - number: '4.1'
    text: |-
      Indien een orgaan voor gezondheidszorg met een ziektekostenverzekeraar een tarief is overeengekomen, kunnen zij het
      College verzoeken dat tarief goed te keuren.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel4
  - number: '4.2'
    text: |-
      Een op een in het eerste lid bedoeld verzoek verleende goedkeuring geldt voor alle gevallen waarin het orgaan voor
      gezondheidszorg het tarief in rekening brengt aan de ziektekostenverzekeraar of aan degene die bij deze voor de
      prestatie waarop het tarief van toepassing is, is verzekerd.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel4
  - number: '5.1'
    text: |-
      Indien overleg over een tarief tussen een representatieve organisatie van organen voor gezondheidszorg en
      een representatieve organisatie van ziektekostenverzekeraars of tussen een orgaan voor gezondheidszorg en een
      representatieve organisatie van ziektekostenverzekeraars dan wel tussen een representatieve organisatie van organen
      voor gezondheidszorg en een ziektekostenverzekeraar tot overeenstemming heeft geleid, kunnen zij het College
      verzoeken dat tarief goed te keuren.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel5
  - number: '5.2'
    text: |-
      Een op een in het eerste lid bedoeld verzoek verleende goedkeuring geldt voor alle gevallen waarin het orgaan
      voor gezondheidszorg dat het tarief is overeengekomen dan wel bij het in het eerste lid bedoelde overleg werd
      gerepresenteerd, het tarief in rekening brengt aan de ziektekostenverzekeraar die bij het eerder genoemde overleg
      werd gerepresenteerd, dan wel aan degene die bij deze voor de prestatie waarop het tarief van toepassing is, is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel5
  - number: '6.1'
    text: |-
      Een verzoek als bedoeld in het eerste lid van de [artikelen 4][ref1] en [5][ref2] bevat een voorstel voor:


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
  - number: 6.1.a
    text: de toe te passen prestatiebeschrijving;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: 6.1.b
    text: het voor de prestatie in rekening te brengen tarief;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: 6.1.c
    text: degene aan wie het tarief in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: 6.1.d
    text: degene door wie het tarief in rekening wordt gebracht en
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: 6.1.e
    text: de wijze waarop het tarief in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het College deelt zijn beschikking op een aanvraag om goedkeuring van een tarief schriftelijk mee aan de betrokken
      representatieve organisaties van organen voor gezondheidszorg en van ziektekostenverzekeraars. Het College kan aan
      de beschikking voorwaarden, voorschriften en beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het College zendt, voor zover daarom is verzocht, binnen tien dagen na afloop van een kalendermaand aan Onze
      Minister, alsmede aan de naar het oordeel van het College representatief te achten op landelijk niveau werkzaam
      zijnde consumenten- en patiëntenorganisaties en aan de FIOD-ECD, een overzicht van de organen voor gezondheidszorg
      en de categorieën van organen voor gezondheidszorg waarvoor in de voorgaande kalendermaand door het College
      beschikkingen op aanvragen om goedkeuring van een tarief zijn genomen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: '6.4'
    text: |-
      De door het College genomen beschikkingen op aanvragen om goedkeuring van een tarief liggen voor een ieder bij het
      College ter inzage. Het College doet van de nederlegging eenmaal per kalendermaand mededeling in de Staatscourant
      en in één of meer dag- of nieuwsbladen die landelijk worden verspreid.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6
  - number: 6a
    text: |-
      In afwijking van de [artikelen 4][ref1], [5][ref2] en [6, eerste lid, onder b][ref3], kan een verzoek als in die
      artikelen bedoeld, de goedkeuring betreffen van het bedrag dat ten minste of het bedrag dat ten hoogste als tarief
      voor de prestatie in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel6
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
  - number: 6b.1
    text: |-
      Het College beslist afwijzend op een ingevolge [artikel 4][ref1] of [5][ref2] gedaan verzoek tot goedkeuring
      van een tarief en een daarbij behorende prestatiebeschrijving als bedoeld in [artikel 6, eerste lid][ref3],
      indien die goedkeuring leidt tot een prestatiebeschrijving die in strijd is met het recht of met het belang van
      de volksgezondheid.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel6
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
  - number: 6b.2
    text: |-
      Indien het College op grond van het eerste lid afwijzend beslist, zijn de [artikelen 8][ref1], [8a][ref2],
      [9][ref3] en [10][ref4] met betrekking tot die prestatiebeschrijving van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel8a
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0003356#Artikel10
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel6b
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 8a
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '9'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003356
        artikel: '10'
        hoofdstuk: II
  - number: '7.1'
    text: |-
      Voordat het College een beschikking neemt op een verzoek om goedkeuring van een tarief, worden het betrokken orgaan
      voor gezondheidszorg, de betrokken ziektekostenverzekeraar en de betrokken representatieve organisaties van organen
      voor gezondheidszorg en van ziektekostenverzekeraars door het College in de gelegenheid gesteld te worden gehoord,
      indien zij of een van hen daarom hebben verzocht.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel7
  - number: '7.2'
    text: |-
      Het College doet van zijn voornemen een verzoek om goedkeuring in behandeling te nemen tijdig mededeling aan de in
      het eerste lid bedoelde betrokkenen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel7
  - number: '8.1'
    text: |-
      Indien op een ingevolge [artikel 4][ref1] of [5][ref2] gedaan verzoek om goedkeuring van een tarief afwijzend
      wordt beslist, wordt op verzoek van partijen of van een van hen dan wel ambtshalve een tarief door het College
      vastgesteld. De [artikelen 4, tweede lid][ref3], en [5, tweede lid][ref4], zijn met betrekking tot dat tarief van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0003356#Artikel5
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Op verzoek van een orgaan voor gezondheidszorg, van een ziektekostenverzekeraar of van een organisatie die voor
      een van beide representatief is, wordt voorts een tarief door het College vastgesteld, indien een overeenkomst
      als bedoeld in [artikel 4][ref1] niet tot stand komt of het overleg als bedoeld in [artikel 5][ref2] niet tot
      overeenstemming leidt. Daarbij wordt bepaald in welke gevallen het vastgestelde tarief geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      Op verzoek van een orgaan voor gezondheidszorg of van een representatieve organisatie van organen voor
      gezondheidszorg dan wel ambtshalve stelt het College een tarief vast, al dan niet gelijk aan een voor dat orgaan
      of die organen goedgekeurd tarief, dat geldt in alle gevallen waarin het in rekening wordt gebracht aan iemand
      die voor de prestatie waarop het tarief van toepassing is, niet is verzekerd bij een ziektekostenverzekeraar.
      Daarbij kunnen met betrekking tot de kring van hen aan wie het tarief rechtsgeldig in rekening kan worden gebracht,
      beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8
  - number: '8.4'
    text: |-
      Indien een verzoek als bedoeld in de [artikelen 4][ref1] en [5][ref2] en het eerste tot en met derde lid, niet
      voldoet aan het bij of krachtens deze wet bepaalde, kan het College ambtshalve een tarief vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
  - number: '8.5'
    text: |-
      Indien een beleidsregel als bedoeld in [artikel 11][ref1] dat vordert stelt het College ambtshalve een tarief vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '8.6'
    text: |-
      Een beschikking op grond van dit artikel bevat in ieder geval de onderwerpen, genoemd in
      [artikel 6, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
  - number: 8a.1
    text: |-
      [Artikel 8, eerste, vierde en zesde lid][ref1], zijn van overeenkomstige toepassing op een verzoek als bedoeld
      in [artikel 6a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel6a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 6a
        hoofdstuk: II
  - number: 8a.2
    text: |-
      Een verzoek of een ambtshalve vaststelling als bedoeld in [artikel 8, tweede, derde en vijfde lid][ref1], kan ook
      de vaststelling betreffen van het bedrag dat ten minste of het bedrag dat ten hoogste als tarief voor een prestatie
      in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel8
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
  - number: 8a.3
    text: |-
      Bij toepassing van het vorige lid bevat de beschikking van het College, in afwijking van
      [artikel 8, zesde lid][ref1], juncto [artikel 6, eerste lid, onder b][ref2], het bedrag dat ten minste of het
      bedrag dat ten hoogste als tarief voor de prestatie in rekening wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel6
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
  - number: 8b
    text: |-
      [Artikel 6b, eerste lid][ref1], is van overeenkomstige toepassing op een verzoek gedaan in [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6b
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel8
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel8b
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 6b
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
  - number: '9'
    text: |-
      [Artikel 7][ref1] is van overeenkomstige toepassing met betrekking tot de vaststelling van een tarief als bedoeld
      in [artikel 8, eerste tot en met vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel8
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
  - number: '10'
    text: |-
      [Artikel 6][ref1] is van overeenkomstige toepassing met betrekking tot de vaststelling van een tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
  - number: 10a.1
    text: |-
      Een orgaan voor gezondheidszorg, een ziektekostenverzekeraar of een representatieve organisatie van organen
      voor gezondheidszorg dan wel van ziektekostenverzekeraars kan het College verzoeken een prestatiebeschrijving
      vast te stellen met betrekking tot een prestatie waarvoor het College op grond van het bepaalde bij of krachtens
      [artikel 1, vijfde lid][ref1], [artikel 11, vierde lid, onder c][ref2], dan wel [artikel 15, derde lid][ref3], geen
      tarief behoeft goed te keuren of vast te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel15
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '1'
        hoofdstuk: I
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '15'
        hoofdstuk: II
  - number: 10a.2
    text: 'Een verzoek als bedoeld in het eerste lid bevat een voorstel voor:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
  - number: 10a.2.a
    text: de toe te passen prestatiebeschrijving;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
  - number: 10a.2.b
    text: degene aan wie het tarief voor de prestatie in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
  - number: 10a.2.c
    text: degene door wie het tarief voor die prestatie in rekening wordt gebracht en
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
  - number: 10a.2.d
    text: de wijze waarop het tarief in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Het College beslist afwijzend op een ingevolge het eerste lid gedaan verzoek tot vaststelling van een
      prestatiebeschrijving als bedoeld in het eerste lid, indien die vaststelling leidt tot een prestatiebeschrijving
      die in strijd is met het recht of met het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
  - number: 10a.4
    text: |-
      De [artikelen 6, tweede tot en met vierde lid][ref1], en [8, derde tot en met vijfde lid][ref2], zijn van
      overeenkomstige toepassing op de vaststelling van een prestatiebeschrijving. Bij zodanige vaststelling bevat een
      beschikking in ieder geval de onderwerpen, genoemd in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel8
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
  - number: '11.1'
    text: Met het oog op het uitvoeren van zijn taken, genoemd in dit hoofdstuk, stelt het College beleidsregels vast.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: '11.2'
    text: |-
      De beleidsregels kunnen inhouden op welke wijze, waaronder schriftelijk of elektronisch, en met inachtneming van
      welke voorwaarden, voorschriften of beperkingen een verzoek als bedoeld in de [artikelen 4][ref1], [5][ref2],
      [6a][ref3], [8][ref4] en [10a][ref5] moet worden ingediend. De beperkingen kunnen mede inhouden dat het
      verzoek alleen gedaan kan worden door een orgaan voor gezondheidszorg met een ziektekostenverzekeraar of een
      representatieve organisatie van ziektekostenverzekeraars gezamenlijk of dat een verzoek moet worden gedaan binnen
      een bepaalde termijn na de vaststelling van de betrokken beleidsregel.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel6a
      [ref4]: https://wetten.overheid.nl/BWBR0003356#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0003356#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: 6a
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0003356
        artikel: 10a
        hoofdstuk: II
  - number: '11.3'
    text: |-
      De beleidsregels kunnen inhouden welke prestatiebeschrijving moet worden gehanteerd bij het in rekening brengen van
      een tarief.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: '11.4'
    text: 'De beleidsregels kunnen inhouden dat met betrekking tot het in rekening te brengen tarief sprake is van:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: 11.4.a
    text: een vast tarief;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: 11.4.b
    text: een bedrag dat ten minste of een bedrag dat ten hoogste als tarief in rekening wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: 11.4.c
    text: |-
      een tarief waarop de [artikelen 2, eerste lid, onder c en d][ref1], en [3 tot en met 10][ref2] niet van toepassing
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel3
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '3'
        hoofdstuk: II
  - number: '11.5'
    text: |-
      De beleidsregels kunnen inhouden aan wie, door wie en op welke wijze en met inachtneming van welke voorwaarden,
      voorschriften en beperkingen een tarief in rekening wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: '11.6'
    text: |-
      De beleidsregels kunnen inhouden dat het College ambtshalve een tarief danwel een bedrag dat ten minste of een
      bedrag dat ten hoogste als tarief in rekening wordt gebracht of een prestatiebeschrijving vaststelt.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: '11.7'
    text: |-
      De beleidsregels kunnen inhouden dat met inachtneming van in de beleidsregel aangegeven voorwaarden, voorschriften
      en beperkingen voor in die regel te onderscheiden delen van een prestatie of geheel van prestaties daarbij nader
      aangegeven beleidsregels van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel11
  - number: '12.1'
    text: |-
      Een beleidsregel als bedoeld in [artikel 11, eerste lid][ref1], behoeft de goedkeuring van Onze Minister. Een
      zodanige beleidsregel wordt daartoe gezonden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '12.2'
    text: Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel12
  - number: '12.3'
    text: |-
      Het besluit omtrent goedkeuring wordt binnen acht weken na verzending bekendgemaakt. Het nemen van een besluit
      omtrent goedkeuring kan eenmaal voor ten hoogste vier weken worden verdaagd.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel12
  - number: '12.4'
    text: |-
      Indien binnen de in het derde lid genoemde termijn geen besluit tot goedkeuring of verdaging, dan wel binnen
      de termijn waarvoor het besluit is verdaagd, geen besluit omtrent goedkeuring is genomen, wordt een besluit tot
      goedkeuring geacht te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel12
  - number: '12.5'
    text: |-
      De beleidsregels liggen voor een ieder bij het College ter inzage. Het College doet van de terinzagelegging
      mededeling in de Staatscourant en in één of meer dag- of nieuwsbladen die landelijk worden verspreid.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister kan beleidsregels vaststellen ten aanzien van de onderwerpen, waaromtrent ingevolge
      [artikel 11][ref1], door het College beleidsregels worden of kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Onze Minister kan in de beleidsregels, bedoeld in het eerste lid, bepalen dat het College ambtshalve een tarief als
      bedoeld in [artikel 11, vierde lid, onder a of b][ref1], of een prestatiebeschrijving vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '13.3'
    text: |-
      Onze Minister kan in de beleidsregels bepalen dat de kosten van door hem aangewezen rechtshandelingen waaruit
      financiële verplichtingen voor een orgaan voor gezondheidszorg kunnen voortvloeien, bij de beoordeling van een
      verzoek om goedkeuring of vaststelling van een tarief niet in aanmerking worden genomen, indien het verzoek
      niet vergezeld gaat van een verklaring van het College dat het met het verrichten van de rechtshandeling heeft
      ingestemd.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel13
  - number: '13.4'
    text: |-
      In het geval, bedoeld in het derde lid, worden tevens door Onze Minister beleidsregels gesteld over de wijze
      waarop een verzoek om een verklaring als in dat lid bedoeld, wordt ingediend en over de procedure volgens welke het
      College op een zodanig verzoek beslist.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel13
  - number: '14'
    text: |-
      Alvorens overeenkomstig [artikel 13][ref1] een beleidsregel wordt vastgesteld, wordt de zakelijke inhoud van het
      voorgenomen besluit schriftelijk medegedeeld aan de beide kamers der Staten-Generaal. Het besluit wordt niet eerder
      vastgesteld dan nadat 10 dagen zijn verstreken na die mededeling. Van de vaststelling wordt mededeling gedaan door
      plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel13
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '13'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      Indien het College in een beleidsregel als bedoeld in [artikel 11][ref1] de mogelijkheid opneemt van een experiment
      inzake bekostiging van een prestatie, neemt hij de in dit artikel bedoelde bepalingen in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '15.2'
    text: |-
      In de beleidsregel kan het College opnemen met inachtneming van welke in die beleidsregel aangegeven voorwaarden,
      voorschriften of beperkingen kan worden afgeweken van andere, in die beleidsregel genoemde beleidsregels als
      bedoeld in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '15.3'
    text: |-
      De beperkingen, bedoeld in het vorige lid, kunnen inhouden dat de werking van de desbetreffende beleidsregel
      is beperkt tot een bepaald gebied, tot een bepaalde categorie of een deel van een categorie van organen voor
      gezondheidszorg, van ziektekostenverzekeraars, van patiënten of van prestaties, of tot een beperkt aantal organen
      voor gezondheidszorg, ziektekostenverzekeraars, patiënten of prestaties.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
  - number: '15.4'
    text: |-
      Een beleidsregel als bedoeld in het eerste lid kan inhouden dat met inachtneming van in die beleidsregel aangegeven
      voorwaarden, voorschriften of beperkingen [artikel 2][ref1] niet van toepassing is op het tarief voor de bij het
      experiment betrokken prestaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel2
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '2'
        hoofdstuk: II
  - number: '15.5'
    text: |-
      Een beleidsregel als bedoeld in het eerste lid kan inhouden dat met inachtneming van in die beleidsregel aangegeven
      voorwaarden, voorschriften of beperkingen de [artikelen 2, eerste lid, onder c en d][ref1], en [10a][ref2] niet van
      toepassing zijn op de prestatiebeschrijving van de bij het experiment betrokken prestaties.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel10a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 10a
        hoofdstuk: II
  - number: '15.6'
    text: |-
      Een beleidsregel als bedoeld in het eerste lid kan inhouden dat met inachtneming van in die beleidsregel
      aangegeven voorwaarden, voorschriften of beperkingen de [artikelen 16b, eerste lid][ref1], en
      [16c, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref2] niet van toepassing zijn op de bij het
      experiment betrokken prestaties.


      [ref1]: https://wetten.overheid.nl/BWBR0002614#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel16c
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002614
        artikel: 16b
      - id: ref2
        bwb_id: BWBR0002614
        artikel: 16c
  - number: '15.7'
    text: |-
      Een beleidsregel als bedoeld in het eerste lid houdt in de maximale duur van het experiment, die ten hoogste vijf
      jaren bedraagt. Het College kan besluiten de gevolgen van het experiment geheel of gedeeltelijk in stand te laten
      tot het einde van het boekjaar volgend op het boekjaar waarin het experiment is geëindigd.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
  - number: '15.8'
    text: Het College evalueert het experiment tijdig en tijdens zijn uitvoering.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
  - number: '15.9'
    text: |-
      Het College rapporteert over de uitslag van een experiment aan Onze Minister in ieder geval binnen drie maanden na
      afloop van het experiment.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel15
  - number: '18.1'
    text: |-
      Er is een College tarieven gezondheidszorg, dat rechtspersoonlijkheid bezit. Het College is gevestigd in een door
      Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel18
  - number: '18.2'
    text: Het College is belast met de taken die hem bij of krachtens deze wet of een andere wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel18
  - number: '18.3'
    text: Het College wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel18
  - number: '19.1'
    text: Het College bestaat uit een oneven aantal van ten hoogste negen leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel19
  - number: '19.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt plaats op
      grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College alsmede op grond van
      maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt mededeling gedaan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel19
  - number: '19.3'
    text: |-
      Bij ministeriële regeling kunnen functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met het
      lidmaatschap van het College.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel19
  - number: '19.4'
    text: |-
      Bij de samenstelling van het College wordt gestreefd naar evenredige deelneming van vrouwen en personen behorende
      tot etnische of culturele minderheidsgroepen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel19
  - number: '19.5'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel19
  - number: '19.6'
    text: |-
      Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige redenen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel19
  - number: '19.7'
    text: |-
      Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan leden van
      het College en leden van commissies vastgesteld en kunnen nadere regels over hun rechtspositie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel19
  - number: '20.1'
    text: |-
      Het College stelt een bestuursreglement vast. Daarin worden in ieder geval regels gesteld omtrent de wijze waarop
      besluiten worden voorbereid, genomen en uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel20
  - number: '20.2'
    text: |-
      In het bestuursreglement kan het College voorzien in de instelling van commissies, in welk geval in het
      bestuursreglement tevens regels worden gesteld omtrent de samenstelling en taken van de ingestelde commissie. In
      commissies kunnen ook personen deelnemen die geen lid van het College zijn.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel20
  - number: '20.3'
    text: |-
      Vergaderingen van het College en van commissies van het College zijn openbaar, behoudens voor zover in het
      bestuursreglement anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel20
  - number: '20.4'
    text: Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel20
  - number: '21.1'
    text: |-
      Op de rechtspositie van het personeel van het College zijn de regels die gelden voor ambtenaren die zijn aangesteld
      bij ministeries van toepassing, met dien verstande dat waar in deze regels een bevoegdheid is toegekend aan een
      andere minister dan Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties, deze bevoegdheid wordt uitgeoefend
      door het College.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel21
  - number: '21.2'
    text: Bij algemene maatregel van bestuur kan worden afgeweken van de in het eerste lid bedoelde regels.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel21
  - number: '22'
    text: |-
      Het College zendt jaarlijks voor 1 oktober aan Onze Minister een werkprogramma voor het volgende kalenderjaar. Het
      werkprogramma behoeft de instemming van Onze Minister. Onze Minister zendt het werkprogramma aan beide kamers der
      Staten-Generaal. Het College stelt het werkprogramma algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel22
  - number: '23'
    text: |-
      Het College zendt jaarlijks voor 1 oktober aan Onze Minister een begroting van zijn beheerskosten voor het volgende
      kalenderjaar, alsmede een meerjarenraming. De begroting en de meerjarenraming behoeven de instemming van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel23
  - number: '24'
    text: |-
      Het College zendt jaarlijks voor 1 juli aan Onze Minister een verslag van de werkzaamheden, het gevoerde beleid in
      het algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder, alsmede gegevens over de
      uitvoering van het werkprogramma in het afgelopen kalenderjaar. Onze Minister zendt het verslag aan beide kamers
      der Staten-Generaal. Het College stelt het verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het College brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over zijn beheerskosten
      over het afgelopen kalenderjaar uit, dat vergezeld gaat van een verklaring omtrent de getrouwheid
      en de rechtmatigheid van de ontvangsten en uitgaven, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '25.2'
    text: |-
      Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College stelt het financieel verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel25
  - number: '26'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel26
  - number: '27'
    text: |-
      De beheerskosten van het College worden tot ten hoogste het in de begroting aangegeven bedrag gedekt uit ’s Rijks
      kas. Op grond van de begroting worden maandelijks voorschotten verleend.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel27
  - number: '28'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van
      het College.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel28
  - number: '29.1'
    text: Een besluit van het College kan bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29
  - number: '29.2'
    text: Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29
  - number: 29a.1
    text: |-
      Het College rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid en doelmatigheid van voorgenomen
      beleid met betrekking tot tarieven op het gebied van de gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29a
  - number: 29a.2
    text: |-
      Het College signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op het terrein van de
      tarieven voor de gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29a
  - number: 29b
    text: |-
      Het College verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29b
  - number: 29c.1
    text: |-
      Het College verstrekt desgevraagd aan het College voor zorgverzekeringen en het College van
      toezicht op de zorgverzekeringen, genoemd in [artikel 58, eerste lid][ref1], respectievelijk
      [artikel 77, eerste lid, van de Zorgverzekeringswet][ref2], en aan het College bouw ziekenhuisvoorzieningen en het
      College sanering ziekenhuisvoorzieningen, bedoeld in de [Wet ziekenhuisvoorzieningen][ref3], de voor de uitoefening
      van hun taak benodigde inlichtingen. De bedoelde colleges kunnen inzage vorderen van zakelijke gegevens en
      bescheiden, voor zover dat voor de vervulling van hun taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel77
      [ref3]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '77'
      - id: ref3
        bwb_id: BWBR0002753
  - number: 29c.2
    text: |-
      Het College en het Staatstoezicht op de volksgezondheid, bedoeld in de [Gezondheidswet][ref1], verstrekken elkaar
      die inlichtingen die van belang kunnen zijn voor de uitoefening van de uit deze wet en de [Gezondheidswet][ref2]
      voortvloeiende taken.


      [ref1]: https://wetten.overheid.nl/BWBR0002202
      [ref2]: https://wetten.overheid.nl/BWBR0002202
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0002202
      - id: ref2
        bwb_id: BWBR0002202
  - number: 29c.3
    text: |-
      Het College en de mededingingsautoriteit, bedoeld in de [Mededingingswet][ref1], verstrekken elkaar die
      inlichtingen die van belang kunnen zijn voor de uitoefening van de uit deze wet en de [Mededingingswet][ref2]
      voortvloeiende taken.


      [ref1]: https://wetten.overheid.nl/BWBR0008691
      [ref2]: https://wetten.overheid.nl/BWBR0008691
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0008691
      - id: ref2
        bwb_id: BWBR0008691
  - number: 29d.1
    text: 'Het College:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.1.a
    text: |-
      geeft voorlichting omtrent de inhoud van zijn beleidsregels, beschikkingen en besluiten en ten algemene over de
      uitvoering van zijn taken;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.1.b
    text: |-
      stelt alle naar het oordeel van het College relevante informatie over beleidsregels, beschikkingen en besluiten
      beschikbaar op internet;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.1.c
    text: |-
      heeft een meldpunt voor het ontvangen van gegevens en inlichtingen omtrent feiten en omstandigheden die mogelijk
      niet in overeenstemming zijn met het bij of krachtens deze wet bepaalde.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.2
    text: 'De door het meldpunt, bedoeld in het voorgaande lid onder c, verzamelde informatie mag worden gebruikt voor:'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.2.a
    text: het beoordelen van een tarief door het College;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.2.b
    text: het vaststellen of wijzigen van beleidsregels door het College;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.2.c
    text: |-
      het vaststellen van beleidsregels als bedoeld in [artikel 13][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel13
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '13'
        hoofdstuk: II
  - number: 29d.2.d
    text: |-
      het verkrijgen van inzicht in de effecten van het gevoerde beleid, de regelgeving, de uitvoering en de handhaving
      dan wel in de effecten die zijn te verwachten van het te voeren beleid van het College dan wel van Onze Minister en
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: 29d.2.e
    text: het bevorderen van het naleven van deze wet.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel29d
  - number: '30.1'
    text: |-
      Een ieder is gehouden desgevraagd aan Onze Minister, het College, de FIOD-ECD of aan een daartoe door een van hen
      aangewezen persoon, verder in dit artikel aan te duiden als vrager, kosteloos:
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: 30.1.a
    text: |-
      de gegevens en inlichtingen te verstrekken welke naar het oordeel van die vrager voor de uitvoering van deze wet te
      zijnen aanzien van belang kunnen zijn;
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: 30.1.b
    text: |-
      de boeken, bescheiden en andere gegevensdragers of de inhoud daarvan – zulks ter keuze van de vrager – waarvan de
      raadpleging naar het oordeel van de vrager van belang kan zijn voor de vaststelling van de feiten welke invloed
      kunnen uitoefenen op de uitvoering van deze wet te zijnen aanzien, voor dit doel beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: '30.2'
    text: |-
      Ingeval deze wet aangelegenheden van een derde aanmerkt als aangelegenheden van degene die op grond van het eerste
      lid inlichtingenplichtig is, gelden, voor zover het deze aangelegenheden betreft, gelijke verplichtingen voor de
      derde.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: '30.3'
    text: |-
      De in het eerste lid, onderdeel b, bedoelde verplichting geldt onverminderd voor een derde bij wie zich
      gegevensdragers bevinden van degene die gehouden is deze, of de inhoud daarvan, aan de vrager voor raadpleging
      beschikbaar te stellen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: '30.4'
    text: |-
      De vrager stelt degene wiens gegevensdragers hij bij een derde voor raadpleging vordert, gelijktijdig hiervan in
      kennis.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: '30.5'
    text: |-
      De gegevens en inlichtingen dienen duidelijk, stellig en zonder voorbehoud te worden verstrekt, mondeling,
      schriftelijk of op andere wijze – zulks ter keuze van de vrager – en binnen een door de vrager te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: '30.6'
    text: |-
      Toegelaten moet worden, dat kopieën, leesbare afdrukken of uittreksels worden gemaakt van de voor raadpleging
      beschikbaar gestelde gegevensdragers of de inhoud daarvan.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: '30.7'
    text: Gegevens en inlichtingen dienen volledig en naar waarheid te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30
  - number: 30a.1
    text: |-
      Het College kan regels stellen, inhoudende welke gegevens en inlichtingen regelmatig moeten worden verstrekt
      door de organen voor gezondheidszorg, ziektekostenverzekeraars, representatieve organisaties van organen voor
      gezondheidszorg en van ziektekostenverzekeraars alsmede degenen, bedoeld in [artikel 2a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 2a
        hoofdstuk: II
  - number: 30a.2
    text: |-
      Het vorige lid is mede van toepassing ten aanzien van degene die gegevens verzamelt, bewaart en bewerkt ten
      behoeve van organen voor gezondheidszorg, ziektekostenverzekeraars, representatieve organisaties van organen voor
      gezondheidszorg of van ziektekostenverzekeraars.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30a
  - number: 30a.3
    text: |-
      De regels, bedoeld in het eerste lid, bepalen aan wie de gegevens en inlichtingen moeten worden verstrekt en kunnen
      bepalen het tijdstip en de wijze waarop en de vorm waarin de gegevens en inlichtingen moeten worden verstrekt
      of door wie en de wijze waarop de gegevens moeten worden bewerkt of door wie en de wijze waarop de gegevens
      dan wel de bewerkingen van die gegevens moeten worden bekendgemaakt, alsmede dat een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1] de juistheid van de verstrekte gegevens en inlichtingen
      bevestigt.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 30a.4
    text: De in dit artikel bedoelde gegevens en inlichtingen dienen volledig en naar waarheid te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30a
  - number: 30b
    text: |-
      De gegevens en inlichtingen bedoeld in de [artikelen 30][ref1] en [30a][ref2] omvatten mede voor de uitvoering van
      deze wet noodzakelijke persoonsgegevens, waaronder persoonsgegevens betreffende de gezondheid als bedoeld in de
      [Wet bescherming persoonsgegevens][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel30a
      [ref3]: https://wetten.overheid.nl/BWBR0011468
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel30b
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 30a
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0011468
  - number: '31.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel31
  - number: '31.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel31
  - number: '32.1'
    text: |-
      Het College is ter handhaving van de [artikelen 2a][ref1], [2b][ref2], [30][ref3] en [30a][ref4] alsmede van het
      derde lid van dit artikel bevoegd tot het toepassen van bestuursdwang.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0003356#Artikel30a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 2a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 2b
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '30'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0003356
        artikel: 30a
        hoofdstuk: IV
  - number: '32.2'
    text: |-
      Het College is ter handhaving van de [artikelen 2a][ref1], [2b][ref2], [30][ref3] en [30a][ref4] tevens bevoegd tot
      het geven van een aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel2a
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel2b
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0003356#Artikel30a
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 2a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 2b
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '30'
        hoofdstuk: IV
      - id: ref4
        bwb_id: BWBR0003356
        artikel: 30a
        hoofdstuk: IV
  - number: '32.3'
    text: Bij de aanwijzing stelt het College een termijn waarbinnen aan de aanwijzing moet zijn voldaan.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel32
  - number: '33'
    text: |-
      De griffiers van de in de [Wet op de rechterlijke organisatie][ref1] bedoelde burgerlijke gerechten, van de
      Centrale Raad van Beroep en van het College van Beroep verstrekken aan Onze Minister of het College of aan
      een krachtens [artikel 31][ref2] aangewezen persoon vrij van alle kosten alle gegevens en uittreksels uit of
      afschriften van vonnissen, arresten, uitspraken, registers, met uitzondering van strafregisters, en andere stukken,
      die ten behoeve van de uitvoering van deze wet van hen verlangd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel31
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001830
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '31'
        hoofdstuk: V
  - number: '35'
    text: |-
      Tegen een op grond van deze wet genomen besluit kan het orgaan voor gezondheidszorg of de representatieve
      organisatie van organen voor gezondheidszorg dan wel de ziektekostenverzekeraar of de representatieve organisatie
      van ziektekostenverzekeraars, die daardoor rechtstreeks in zijn belang is getroffen, beroep instellen bij het
      College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel35
  - number: '41.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel41
  - number: '41.2'
    text: |-
      Bij een algemene maatregel van bestuur ter uitvoering van deze wet kan Onze Minister worden opgedragen nadere
      regelen vast te stellen.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel41
  - number: '43.1'
    text: |-
      Een tarief dat onmiddellijk voor het tijdstip waarop deze wet ten aanzien van bij algemene maatregel van bestuur
      ingevolge [artikel 1, eerste, tweede, derde en vierde lid][ref1], aangewezen categorieën van organen voor
      gezondheidszorg of daarmee gelijkgestelde voorzieningen of instellingen in werking treedt, rechtsgeldig in rekening
      placht te worden gebracht aan ziektekostenverzekeraars of aan degenen die bij deze voor de prestatie waarop het
      tarief van toepassing is, zijn verzekerd, wordt in alle gevallen waarin het aan degene die tot die zelfde groep
      behoort, of aan een derde in rekening wordt gebracht, gelijkgesteld met een tarief dat ingevolge deze wet is tot
      stand gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel1
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '1'
        hoofdstuk: I
  - number: '43.3'
    text: |-
      Een tarief als bedoeld in het eerste lid, geldt gedurende ten hoogste twaalf maanden, te rekenen vanaf het in het
      eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel43
  - number: '44'
    text: |-
      Een verzoek aan enig orgaan om goedkeuring of vaststelling van een tarief, door een orgaan voor
      gezondheidszorg of een representatieve organisatie van organen voor gezondheidszorg gedaan, voordat
      de categorie van organen voor gezondheidszorg waartoe verzoeker behoort, is aangewezen ingevolge
      [het eerste, tweede, derde of vierde lid van artikel 1][ref1], wordt gelijkgesteld met een ingevolge deze
      wet gedaan verzoek om goedkeuring of vaststelling van een tarief. Het College bepaalt in welke gevallen het
      goedgekeurde of vastgestelde tarief geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel1
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '1'
        hoofdstuk: I
  - number: '45'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College uit de wet voortvloeiende verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel45
  - number: '46'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van dit artikel en vervolgens telkens na vier jaar aan
      de beide kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van
      het College.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel46
  - number: '55'
    text: 'Deze wet wordt aangehaald als: Wet tarieven gezondheidszorg.'
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel55
  - number: '56'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2006-01-01#Artikel56
