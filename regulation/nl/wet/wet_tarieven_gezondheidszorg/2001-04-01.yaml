---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tarieven_gezondheidszorg
regulatory_layer: WET
publication_date: '2006-09-21'
valid_from: '2001-04-01'
bwb_id: BWBR0003356
url: https://wetten.overheid.nl/BWBR0003356/2001-04-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen ter bevordering van een
    evenwichtig stelsel van tarieven op het gebied van de gezondheidszorg mede met het oog op de beheersing van de
    kostenontwikkeling daarvan;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.b
    text: |-
      het College: het College tarieven gezondheidszorg, bedoeld in [artikel 18][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel18
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '18'
        hoofdstuk: III
  - number: 1.1.d
    text: |-
      het College van Beroep: het College van Beroep voor het bedrijfsleven, bedoeld in
      [artikel 2 van de Wet bestuursrechtspraak bedrijfsorganisatie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002144#Artikel2
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002144
        artikel: '2'
  - number: 1.1.e
    text: 'ziektekostenverzekeraar:'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.e.1
    text: |-
      een ziekenfonds, toegelaten ingevolge de [Ziekenfondswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: 1.1.e.2
    text: |-
      een particuliere ziektekostenverzekeraar, zijnde een verzekeraar die in het bezit is van de ingevolge
      [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1] vereiste vergunning, of die heeft
      voldaan aan de ingevolge de artikelen 37 of 38 van die wet vereiste procedure met betrekking tot een bijkantoor
      in Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel24
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '24'
  - number: 1.1.e.3
    text: een orgaan dat een publiekrechtelijke ziektekostenregeling voor ambtenaren uitvoert;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.f
    text: 'orgaan voor gezondheidszorg:'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.f.1
    text: een instelling voor gezondheidszorg;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.f.2
    text: |-
      een persoon die een medisch, paramedisch, psycho-sociaal dan wel psycho-therapeutisch, farmaceutisch of verplegend
      beroep of een bij algemene maatregel van bestuur aangewezen daarmede verwant beroep uitoefent;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.g
    text: |-
      instelling voor gezondheidszorg: een instelling in het kader waarvan medische, paramedische, psycho-sociale
      dan wel psycho-therapeutische, farmaceutische of verpleegkundige hulp wordt verleend, al dan niet gebonden aan
      de aanwezigheid van ruimtelijke voorzieningen voor de huisvestingen en de daarmee samenhangende verzorging van
      patiënten;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.h
    text: 'tarief: prijs voor een prestatie of geheel van prestaties, door een orgaan voor gezondheidszorg geleverd.'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: 1.1.i
    text: |-
      maximumtarief: een maximumtarief, goedgekeurd of vastgesteld overeenkomstig [artikel 17 c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel17c
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 17c
        hoofdstuk: II
  - number: '1.2'
    text: |-
      Deze wet is van toepassing op een orgaan voor gezondheidszorg en een daarmee gelijkgestelde voorziening of
      instelling, die bij algemene maatregel van bestuur wordt aangewezen of behoort tot een bij een zodanige maatregel
      aan te wijzen categorie.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: '1.3'
    text: |-
      Bij algemene maatregel van bestuur kan een voorziening voor maatschappelijke dienstverlening, behorende tot een
      bij die maatregel aangewezen categorie, voor de toepassing van deze wet en de daarop berustende bepalingen met een
      orgaan voor gezondheidszorg worden gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: '1.4'
    text: |-
      Bij algemene maatregel van bestuur kan een instelling, behorende tot een bij die maatregel aangewezen categorie,
      met een orgaan voor gezondheidszorg worden gelijkgesteld, indien haar werkzaamheden geheel of gedeeltelijk liggen
      op het gebied van de gezondheidszorg of geheel of gedeeltelijk ten behoeve van de gezondheidszorg worden verricht
      en indien dat voor een goede uitvoering van deze wet nodig is.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: '1.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot daarbij aangewezen prestaties nadere regelen worden
      gesteld ter zake van het bepaalde in het eerste lid, onder *h* en *i.* Tot deze regelen kan behoren dat de prijs
      voor daarbij aangewezen prestaties niet als tarief in de zin van deze wet wordt aangemerkt.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel1
  - number: '2'
    text: Het is verboden een tarief in rekening te brengen, dat niet overeenkomstig deze wet is goedgekeurd of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel2
  - number: 2a.1
    text: |-
      Onze Minister kan, indien zulks naar zijn oordeel voor een goede uitvoering van deze wet wenselijk is,
      voorschriften geven betreffende het door organen voor gezondheidszorg voeren van een administratie waaruit de
      hoogte, de opbouw en de wijze van berekening van de tarieven blijkt.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel2a
  - number: 2a.2
    text: 'Onze Minister kan regels stellen betreffende het door organen voor gezondheidszorg:'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel2a
  - number: 2a.2.a
    text: bekendmaken van tarieven en maximumtarieven;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel2a
  - number: 2a.2.b
    text: specificeren van op verrichte prestaties betrekking hebbende rekeningen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel2a
  - number: '3.1'
    text: |-
      Voor de toepassing van [dit hoofdstuk][ref1] worden onder representatieve organisaties van organen voor
      gezondheidszorg en representatieve organisaties van ziektekostenverzekeraars verstaan de organisaties van organen
      voor gezondheidszorg of van ziektekostenverzekeraars, welke Onze Minister op hun verzoek als zodanig aanwijst voor
      bij zijn besluit aangegeven categorieën van organen voor gezondheidszorg of van ziektekostenverzekeraars.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003356
        hoofdstuk: II
  - number: '3.2'
    text: |-
      Onze Minister kan regels stellen die worden gehanteerd bij de beoordeling van de representativiteit van
      organisaties als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel3
  - number: '3.3'
    text: Een aanwijzing als bedoeld in het eerste lid, kan onder voorwaarden of voor bepaalde tijd worden gegeven.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel3
  - number: '4.1'
    text: |-
      Indien een orgaan voor gezondheidszorg met een ziektekostenverzekeraar een tarief is overeengekomen, kunnen zij het
      College verzoeken dat tarief goed te keuren.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel4
  - number: '4.2'
    text: |-
      Een op een in het eerste lid bedoeld verzoek verleende goedkeuring geldt voor alle gevallen waarin het orgaan voor
      gezondheidszorg het tarief in rekening brengt aan de ziektekostenverzekeraar of aan degene die bij deze voor de
      prestatie waarop het tarief van toepassing is, is verzekerd.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel4
  - number: '5.1'
    text: |-
      Indien overleg over een tarief tussen een representatieve organisatie van organen voor gezondheidszorg en
      een representatieve organisatie van ziektekostenverzekeraars of tussen een orgaan voor gezondheidszorg en een
      representatieve organisatie van ziektekostenverzekeraars dan wel tussen een representatieve organisatie van organen
      voor gezondheidszorg en een ziektekostenverzekeraar tot overeenstemming heeft geleid, kunnen zij het College
      verzoeken dat tarief goed te keuren.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel5
  - number: '5.2'
    text: |-
      Een op een in het eerste lid bedoeld verzoek verleende goedkeuring geldt voor alle gevallen waarin het orgaan
      voor gezondheidszorg dat het tarief is overeengekomen dan wel bij het in het eerste lid bedoelde overleg werd
      gerepresenteerd, het tarief in rekening brengt aan de ziektekostenverzekeraar die bij het eerder genoemde overleg
      werd gerepresenteerd, dan wel aan degene die bij deze voor de prestatie waarop het tarief van toepassing is, is
      verzekerd.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel5
  - number: '6.1'
    text: Het College stelt regels vast over de wijze waarop een verzoek om goedkeuring van een tarief wordt ingediend.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel6
  - number: '6.2'
    text: |-
      Het College deelt zijn beschikking op een aanvraag om goedkeuring van een tarief schriftelijk mee aan de betrokken
      representatieve organisaties van organen voor gezondheidszorg en van ziektekostenverzekeraars.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel6
  - number: '6.3'
    text: |-
      Het College zendt, voor zover daarom is verzocht, binnen tien dagen na afloop van een kalendermaand aan Onze
      Minister, alsmede aan de naar het oordeel van het College representatief te achten op landelijk niveau werkzaam
      zijnde consumenten- en patiëntenorganisaties en aan de Economische Controledienst, een overzicht van de organen
      voor gezondheidszorg en de categorieën van organen voor gezondheidszorg waarvoor in de voorgaande kalendermaand
      door het College beschikkingen op aanvragen om goedkeuring van een tarief zijn genomen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel6
  - number: '6.4'
    text: |-
      De door het College genomen beschikkingen op aanvragen om goedkeuring van een tarief liggen voor een ieder bij het
      College ter inzage. Het College doet van de nederlegging eenmaal per kalendermaand mededeling in de Staatscourant
      en in één of meer dag- of nieuwsbladen die landelijk worden verspreid.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel6
  - number: '7.1'
    text: |-
      Voordat het College een beschikking neemt op een verzoek om goedkeuring van een tarief, worden het betrokken orgaan
      voor gezondheidszorg, de betrokken ziektekostenverzekeraar en de betrokken representatieve organisaties van organen
      voor gezondheidszorg en van ziektekostenverzekeraars door het College in de gelegenheid gesteld te worden gehoord,
      indien zij of een van hen daarom hebben verzocht.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel7
  - number: '7.2'
    text: |-
      Het College doet van zijn voornemen een verzoek om goedkeuring in behandeling te nemen tijdig mededeling aan de in
      het eerste lid bedoelde betrokkenen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel7
  - number: '8.1'
    text: |-
      Indien op een ingevolge [artikel 4][ref1] of [5][ref2] gedaan verzoek om goedkeuring van een tarief afwijzend
      wordt beslist, wordt op verzoek van partijen of van een van hen dan wel ambtshalve een tarief door het College
      vastgesteld. De artikelen 4, tweede lid, en 5, tweede lid, zijn met betrekking tot dat tarief van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
  - number: '8.2'
    text: |-
      Op verzoek van een orgaan voor gezondheidszorg, van een ziektekostenverzekeraar of van een organisatie die voor
      een van beide representatief is, wordt voorts een tarief door het College vastgesteld, indien een overeenkomst
      als bedoeld in [artikel 4][ref1] niet tot stand komt of het overleg als bedoeld in [artikel 5][ref2] niet tot
      overeenstemming leidt. Daarbij wordt bepaald in welke gevallen het vastgestelde tarief geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel5
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
  - number: '8.3'
    text: |-
      Op verzoek van een orgaan voor gezondheidszorg of van een representatieve organisatie van organen voor
      gezondheidszorg dan wel ambtshalve stelt het College een tarief vast, al dan niet gelijk aan een voor dat orgaan
      of die organen goedgekeurd tarief, dat geldt in alle gevallen waarin het in rekening wordt gebracht aan iemand
      die voor de prestatie waarop het tarief van toepassing is, niet is verzekerd bij een ziektekostenverzekeraar.
      Daarbij kunnen met betrekking tot de kring van hen aan wie het tarief rechtsgeldig in rekening kan worden gebracht,
      beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel8
  - number: '8.4'
    text: |-
      Het College kan ter vervanging van een reeds goedgekeurd of vastgesteld tarief ambtshalve een ander tarief
      vaststellen indien een beleidsregel als bedoeld in [artikel 11][ref1] dat vordert. Daarbij wordt bepaald in welke
      gevallen het tarief geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '9'
    text: |-
      [Artikel 7][ref1] is van overeenkomstige toepassing met betrekking tot de vaststelling van een tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel7
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '7'
        hoofdstuk: II
  - number: '10'
    text: |-
      [Artikel 6][ref1] is van overeenkomstige toepassing met betrekking tot de vaststelling van een tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
  - number: '11.1'
    text: |-
      Het College stelt beleidsregels vast omtrent de hoogte, de opbouw en de wijze van berekening van een tarief of van
      onderdelen van een tarief. Het College kan in een beleidsregel opnemen aan wie een tarief in het onderlinge verkeer
      tussen organen voor gezondheidszorg in rekening dient te worden gebracht.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel11
  - number: '11.2'
    text: |-
      Beleidsregels als bedoeld in het eerste lid kunnen gericht zijn op het tot stand brengen van afhankelijkheid tussen
      de hoogte van een tarief of tarieven en het totaal van in enige periode in rekening gebrachte, dan wel te brengen
      tarieven.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel11
  - number: '12.1'
    text: |-
      Een beleidsregel als bedoeld in [artikel 11, eerste lid][ref1], behoeft de goedkeuring van Onze Minister. Een
      zodanige beleidsregel wordt daartoe gezonden aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '12.2'
    text: Goedkeuring kan slechts worden onthouden wegens strijd met het recht of het belang van de volksgezondheid.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel12
  - number: '12.3'
    text: |-
      Het besluit omtrent goedkeuring wordt binnen acht weken na verzending bekendgemaakt. Het nemen van een besluit
      omtrent goedkeuring kan eenmaal voor ten hoogste vier weken worden verdaagd.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel12
  - number: '12.4'
    text: |-
      Indien binnen de in het derde lid genoemde termijn geen besluit tot goedkeuring of verdaging, dan wel binnen
      de termijn waarvoor het besluit is verdaagd, geen besluit omtrent goedkeuring is genomen, wordt een besluit tot
      goedkeuring geacht te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel12
  - number: '12.5'
    text: |-
      De beleidsregels liggen voor een ieder bij het College ter inzage. Het College doet van de terinzagelegging
      mededeling in de Staatscourant en in één of meer dag- of nieuwsbladen die landelijk worden verspreid.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel12
  - number: '13.1'
    text: |-
      Onze Minister kan beleidsregels vaststellen ten aanzien van de onderwerpen, waaromtrent ingevolge
      [artikel 11, eerste en tweede lid][ref1], door het College beleidsregels worden of kunnen worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Onze Minister kan in de beleidsregels bepalen dat het College ter vervanging van een reeds goedgekeurd of
      vastgesteld tarief ambtshalve een ander tarief dient vast te stellen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel13
  - number: '13.3'
    text: |-
      Onze Minister kan in de beleidsregels bepalen dat de kosten van door hem aangewezen rechtshandelingen waaruit
      financiële verplichtingen voor een orgaan voor gezondheidszorg kunnen voortvloeien, bij de beoordeling van een
      verzoek om goedkeuring of vaststelling van een tarief niet in aanmerking worden genomen, indien het verzoek
      niet vergezeld gaat van een verklaring van het College dat het met het verrichten van de rechtshandeling heeft
      ingestemd.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel13
  - number: '13.4'
    text: |-
      In het geval, bedoeld in het derde lid, worden tevens door Onze Minister beleidsregels gesteld over de wijze
      waarop een verzoek om een verklaring als in dat lid bedoeld, wordt ingediend en over de procedure volgens welke het
      College op een zodanig verzoek beslist.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel13
  - number: '14'
    text: |-
      Alvorens overeenkomstig [artikel 13][ref1] een beleidsregel wordt vastgesteld, wordt de zakelijke inhoud van het
      voorgenomen besluit schriftelijk medegedeeld aan de beide kamers der Staten-Generaal. Het besluit wordt niet eerder
      vastgesteld dan nadat 10 dagen zijn verstreken na die mededeling. Van de vaststelling wordt mededeling gedaan door
      plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel13
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '13'
        hoofdstuk: II
  - number: 17a
    text: |-
      Voor bij algemene maatregel van bestuur aan te wijzen prestaties en voor prestaties van bij algemene maatregel
      van bestuur aan te wijzen categorieën van organen voor gezondheidszorg zijn [de artikelen 2][ref1], [4][ref2],
      [5][ref3], [7][ref4], [8, eerste en tweede lid][ref5], en [9][ref6] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0003356#Artikel7
      [ref5]: https://wetten.overheid.nl/BWBR0003356#Artikel8
      [ref6]: https://wetten.overheid.nl/BWBR0003356#Artikel9
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '5'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003356
        artikel: '7'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0003356
        artikel: '9'
        hoofdstuk: II
  - number: 17b.1
    text: |-
      Het is verboden voor een prestatie ten aanzien waarvan [artikel 17][ref1] is toegepast, een tarief in rekening te
      brengen indien voor die prestatie niet overeenkomstig deze wet een maximumtarief is goedgekeurd of vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 17a
        hoofdstuk: II
  - number: 17b.2
    text: |-
      Het is verboden voor een prestatie waarvoor een maximumtarief is goedgekeurd of vastgesteld, een hoger tarief dan
      het maximumtarief in rekening te brengen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17b
  - number: 17c.1
    text: |-
      Indien overleg tussen een representatieve organisatie van organen voor gezondheidszorg en een representatieve
      organisatie van ziektekostenverzekeraars over het maximumtarief voor een prestatie ten aanzien waarvan
      [artikel 17][ref1] is toegepast, tot overeenstemming heeft geleid, kunnen zij het College verzoeken dat
      maximumtarief goed te keuren.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 17a
        hoofdstuk: II
  - number: 17c.2
    text: |-
      Indien overleg als bedoeld in het eerste lid, niet tot overeenstemming leidt, kan een representatieve organisatie
      van organen voor gezondheidszorg of een representatieve organisatie van ziektekostenverzekeraars het College
      verzoeken een maximumtarief vast te stellen. Daarbij wordt bepaald in welke gevallen het vastgestelde maximumtarief
      geldt.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17c
  - number: 17c.3
    text: |-
      Indien voor een prestatie ten aanzien waarvan [artikel 17][ref1] is toegepast, geen maximumtarief is tot stand
      gekomen en bij het College geen verzoek als bedoeld in het eerste of tweede lid in behandeling is, kunnen een
      of meer organen voor gezondheidszorg samen met een of meer ziektekostenverzekeraars het College verzoeken een
      maximumtarief vast te stellen. Daarbij wordt bepaald in welke gevallen het vastgestelde maximumtarief geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 17a
        hoofdstuk: II
  - number: 17d.1
    text: |-
      Voordat het College een maximumtarief goedkeurt of vaststelt, worden de bij het maximumtarief betrokken
      representatieve organisaties door het College in de gelegenheid gesteld te worden gehoord, indien zij of één van
      hen daarom hebben verzocht.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17d
  - number: 17d.2
    text: |-
      Het College doet van zijn voornemen een verzoek om goedkeuring of vaststelling van een maximumtarief in behandeling
      te nemen, tijdig mededeling aan de betrokken representatieve organisatie van organen voor gezondheidszorg en aan
      de betrokken representatieve organisatie van ziektekostenverzekeraars, zodat deze een verzoek kunnen doen te worden
      gehoord.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17d
  - number: 17e
    text: |-
      [De artikelen 6][ref1], [8, derde en vierde lid][ref2], en [10][ref3] tot en met [14][ref4] zijn met betrekking tot
      een maximumtarief van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003356#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0003356#Artikel14
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '8'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003356
        artikel: '10'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0003356
        artikel: '14'
        hoofdstuk: II
  - number: 17f.1
    text: |-
      Indien met betrekking tot enige vorm van zorg toepassing is gegeven aan [artikel 11 van de Ziekenfondswet][ref1]
      onderscheidenlijk [artikel 12 van de Algemene Wet Bijzondere Ziektekosten][ref2], kan een commissie als bedoeld
      in [artikel 46][ref3] onderscheidenlijk [artikel 44][ref4] het tarief vaststellen, dat door organen voor
      gezondheidszorg voor zodanige zorg in rekening mag worden gebracht aan de betrokken verzekerden ingevolge de
      genoemde wetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel46a
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel44a
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0002460
        artikel: 46a
      - id: ref4
        bwb_id: BWBR0002614
        artikel: 44a
  - number: 17f.2
    text: |-
      Het in het eerste lid bedoelde tarief is niet hoger dan het voor zodanige hulp door het College
      goedgekeurde of vastgestelde tarief. Het tarief geldt voor een door de commissie te bepalen
      periode, welke telkens ten hoogste zes maanden bedraagt. Het tarief vervalt met ingang van het
      tijdstip waarop de toepassing van [artikel 11 van de Ziekenfondswet][ref1] onderscheidenlijk
      [artikel 12 van de Algemene Wet Bijzondere Ziektekosten][ref2] eindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0002460#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002614#Artikel12
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0002460
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0002614
        artikel: '12'
  - number: 17f.3
    text: |-
      De commissie die op grond van het eerste lid een tarief heeft vastgesteld, maakt haar besluit bekend aan Onze
      Minister. Onze Minister maakt het besluit bekend in de *Staatscourant* en in één of meer dag- of nieuwsbladen
      die landelijk worden verspreid. Zij deelt haar besluit voorts schriftelijk mee aan de betrokken representatieve
      organisaties van organen voor gezondheidszorg en van ziektekostenverzekeraars.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17f
  - number: 17f.4
    text: |-
      Indien voor enige vorm van zorg op grond van het eerste lid een tarief is vastgesteld, is het, voor zover het hulp
      aan verzekerden ingevolge de [Ziekenfondswet][ref1] of de [Algemene Wet Bijzondere Ziektekosten][ref2] betreft, die
      niet is verleend op basis van een overeenkomst als bedoeld in [artikel 44, eerste lid, van de Ziekenfondswet][ref3]
      onderscheidenlijk [artikel 42, eerste lid, van de Algemene Wet Bijzondere Ziektekosten][ref4], verboden voor
      zodanige zorg een tarief in rekening te brengen dat hoger is dan het overeenkomstig het eerste lid daarvoor
      vastgestelde tarief.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002614
      [ref3]: https://wetten.overheid.nl/BWBR0002460#Artikel44
      [ref4]: https://wetten.overheid.nl/BWBR0002614#Artikel42
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel17f
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0002614
      - id: ref3
        bwb_id: BWBR0002460
        artikel: '44'
      - id: ref4
        bwb_id: BWBR0002614
        artikel: '42'
  - number: '18.1'
    text: |-
      Er is een College tarieven gezondheidszorg, dat rechtspersoonlijkheid bezit. Het College is gevestigd in een door
      Onze Minister te bepalen plaats.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel18
  - number: '18.2'
    text: Het College is belast met de taken die hem bij of krachtens deze wet of een andere wet zijn opgedragen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel18
  - number: '18.3'
    text: Het College wordt in en buiten rechte vertegenwoordigd door de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel18
  - number: '19.1'
    text: Het College bestaat uit een oneven aantal van ten hoogste negen leden, onder wie de voorzitter.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel19
  - number: '19.2'
    text: |-
      Onze Minister benoemt, schorst en ontslaat de voorzitter en de overige leden. Benoeming vindt plaats op
      grond van de deskundigheid die nodig is voor de uitoefening van de taken van het College alsmede op grond van
      maatschappelijke kennis en ervaring. Van een besluit tot benoeming, schorsing of ontslag wordt mededeling gedaan in
      de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel19
  - number: '19.3'
    text: |-
      Bij ministeriële regeling kunnen functies of werkzaamheden worden aangewezen, die niet verenigbaar zijn met het
      lidmaatschap van het College.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel19
  - number: '19.4'
    text: |-
      Bij de samenstelling van het College wordt gestreefd naar evenredige deelneming van vrouwen en personen behorende
      tot etnische of culturele minderheidsgroepen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel19
  - number: '19.5'
    text: |-
      De leden worden benoemd voor ten hoogste vier jaar. Herbenoeming kan twee maal en telkens voor ten hoogste vier
      jaar plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel19
  - number: '19.6'
    text: |-
      Het lidmaatschap eindigt tussentijds door overlijden, ontslag op eigen verzoek of ontslag om zwaarwichtige redenen
      door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel19
  - number: '19.7'
    text: |-
      Bij ministeriële regeling worden de vergoeding van reis- en verblijfkosten en verdere vergoedingen aan leden van
      het College en leden van commissies vastgesteld en kunnen nadere regels over hun rechtspositie worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel19
  - number: '20.1'
    text: |-
      Het College stelt een bestuursreglement vast. Daarin worden in ieder geval regels gesteld omtrent de wijze waarop
      besluiten worden voorbereid, genomen en uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel20
  - number: '20.2'
    text: |-
      In het bestuursreglement kan het College voorzien in de instelling van commissies, in welk geval in het
      bestuursreglement tevens regels worden gesteld omtrent de samenstelling en taken van de ingestelde commissie. In
      commissies kunnen ook personen deelnemen die geen lid van het College zijn.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel20
  - number: '20.3'
    text: |-
      Vergaderingen van het College en van commissies van het College zijn openbaar, behoudens voor zover in het
      bestuursreglement anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel20
  - number: '20.4'
    text: Het bestuursreglement behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel20
  - number: '21.1'
    text: Het College benoemt, schorst en ontslaat het personeel.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel21
  - number: '21.2'
    text: Het College stelt met betrekking tot de arbeidsvoorwaarden van het personeel regels vast.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel21
  - number: '22'
    text: |-
      Het College zendt jaarlijks voor 1 oktober aan Onze Minister een werkprogramma voor het volgende kalenderjaar. Het
      werkprogramma behoeft de instemming van Onze Minister. Onze Minister zendt het werkprogramma aan beide kamers der
      Staten-Generaal. Het College stelt het werkprogramma algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel22
  - number: '23'
    text: |-
      Het College zendt jaarlijks voor 1 oktober aan Onze Minister een begroting van zijn beheerskosten voor het volgende
      kalenderjaar, alsmede een meerjarenraming. De begroting en de meerjarenraming behoeven de instemming van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel23
  - number: '24'
    text: |-
      Het College zendt jaarlijks voor 1 juli aan Onze Minister een verslag van de werkzaamheden, het gevoerde beleid in
      het algemeen en de doelmatigheid en doeltreffendheid van zijn werkwijze in het bijzonder, alsmede gegevens over de
      uitvoering van het werkprogramma in het afgelopen kalenderjaar. Onze Minister zendt het verslag aan beide kamers
      der Staten-Generaal. Het College stelt het verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel24
  - number: '25.1'
    text: |-
      Het College brengt jaarlijks voor 1 juli aan Onze Minister een financieel verslag over zijn beheerskosten
      over het afgelopen kalenderjaar uit, dat vergezeld gaat van een verklaring omtrent de getrouwheid
      en de rechtmatigheid van de ontvangsten en uitgaven, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1], alsmede van een rapport van de accountant over de
      ordelijkheid en controleerbaarheid van het gevoerde financiële beheer.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '25.2'
    text: |-
      Het financieel verslag behoeft de instemming van Onze Minister. Onze Minister zendt het financieel verslag aan
      beide kamers der Staten-Generaal. Het College stelt het financieel verslag algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel25
  - number: '26'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de inrichting van de begroting, het financieel verslag
      en aandachtspunten voor de accountantscontrole.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel26
  - number: '27'
    text: |-
      De beheerskosten van het College komen tot ten hoogste het in de begroting aangegeven bedrag ten laste van het
      Algemeen Fonds Bijzondere Ziektekosten, bedoeld in [artikel 38 van de Wet financiering volksverzekeringen][ref1].
      Op grond van de begroting worden maandelijks uit het Algemeen Fonds Bijzondere Ziektekosten voorschotten verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0004538#Artikel38
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0004538
        artikel: '38'
  - number: '28'
    text: |-
      Onze Minister kan beleidsregels vaststellen met betrekking tot de werkwijze en de uitoefening van de taken van
      het College.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel28
  - number: '29.1'
    text: Een besluit van het College kan bij koninklijk besluit worden vernietigd.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel29
  - number: '29.2'
    text: Van een besluit tot vernietiging wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel29
  - number: 29a.1
    text: |-
      Het College rapporteert desgevraagd aan Onze Minister omtrent de uitvoerbaarheid en doelmatigheid van voorgenomen
      beleid met betrekking tot tarieven op het gebied van de gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel29a
  - number: 29a.2
    text: |-
      Het College signaleert gevraagd en ongevraagd aan Onze Minister feitelijke ontwikkelingen op het terrein van de
      tarieven voor de gezondheidszorg.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel29a
  - number: 29b
    text: |-
      Het College verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen.
      Onze Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn
      taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel29b
  - number: 29c
    text: |-
      Het College verstrekt desgevraagd aan het College voor zorgverzekeringen en het College van toezicht op de
      zorgverzekeringen, bedoeld in de [Ziekenfondswet][ref1], en aan het College bouw ziekenhuisvoorzieningen en het
      College sanering ziekenhuisvoorzieningen, bedoeld in de [Wet ziekenhuisvoorzieningen][ref2], de voor de uitoefening
      van hun taak benodigde inlichtingen. De bedoelde colleges kunnen inzage vorderen van zakelijke gegevens en
      bescheiden, voor zover dat voor de vervulling van hun taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
      [ref2]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel29c
    references:
      - id: ref1
        bwb_id: BWBR0002460
      - id: ref2
        bwb_id: BWBR0002753
  - number: '30.1'
    text: |-
      De organen voor gezondheidszorg en de ziektekostenverzekeraars zijn verplicht gegevens te verstrekken ter zake
      van goedkeuring of vaststelling van een tarief of maximumtarief, alsmede gegevens welke voor een verdere goede
      uitvoering van deze wet nodig zijn.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: '30.2'
    text: 'Bij algemene maatregel van bestuur worden bepaald:'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: 30.2.a
    text: de doeleinden waarvoor de gegevens dienen te worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: 30.2.b
    text: |-
      de aard van de gegevens die door de te onderscheiden organen voor gezondheidszorg of ziektekostenverzekeraars
      dienen te worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: 30.2.c
    text: de tijdvakken waarop de gegevens betrekking dienen te hebben;
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: 30.2.d
    text: de termijnen waarbinnen de gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: '30.3'
    text: |-
      Bij de in het tweede lid bedoelde algemene maatregel van bestuur wordt tevens bepaald welke van de in dit artikel
      bedoelde gegevens worden verstrekt aan het College, Onze Minister en aan de Economische Controledienst.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: '30.4'
    text: Onze Minister stelt regelen omtrent het beheer van de verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: '30.5'
    text: |-
      Onze Minister kan regelen stellen met betrekking tot de wijze waarop en de vorm waarin de gegevens dienen te worden
      verstrekt, alsmede met betrekking tot de wijze waarop de verstrekte gegevens dienen te worden verwerkt. Tevens kan
      Onze Minister instanties aanwijzen waar genoemde verwerking dient plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: '30.6'
    text: |-
      De in dit artikel bedoelde gegevens mogen alleen in een zodanige vorm worden opgevraagd en verstrekt, dat zij niet
      tot individuele patiënten of cliënten herleidbaar zijn.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: '30.7'
    text: De in dit artikel bedoelde gegevens dienen volledig en naar waarheid te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel30
  - number: '31.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel31
  - number: '31.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel31
  - number: '32'
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '33'
    text: |-
      De griffiers van de in de [Wet op de rechterlijke organisatie][ref1] bedoelde burgerlijke gerechten, van de
      Centrale Raad van Beroep en van het College van Beroep verstrekken aan Onze Minister of het College of aan
      een krachtens [artikel 31][ref2] aangewezen persoon vrij van alle kosten alle gegevens en uittreksels uit of
      afschriften van vonnissen, arresten, uitspraken, registers, met uitzondering van strafregisters, en andere stukken,
      die ten behoeve van de uitvoering van deze wet van hen verlangd worden.


      [ref1]: https://wetten.overheid.nl/BWBR0001830
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel31
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001830
      - id: ref2
        bwb_id: BWBR0003356
        artikel: '31'
        hoofdstuk: V
  - number: '34.1'
    text: |-
      De organen voor gezondheidszorg en de ziektekostenverzekeraars zijn verplicht aan Onze Minister of het College van
      hen verlangde inlichtingen volledig en naar waarheid te verstrekken.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel34
  - number: '34.2'
    text: |-
      De inlichtingen worden, indien dit wordt verzocht, schriftelijk verstrekt binnen een door de in het eerste lid
      bedoelde instanties te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel34
  - number: '34.3'
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift tot geheimhouding verplicht zijn, kunnen zich van het
      verstrekken van inlichtingen en van gegevens als bedoeld in [Hoofdstuk IV][ref1] verschonen, voor zover dit uit hun
      geheimhoudingsplicht voortvloeit.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#HoofdstukIV
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0003356
        hoofdstuk: IV
  - number: '35'
    text: Tegen een besluit van het College
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel35
  - number: 35.a
    text: op een verzoek tot goedkeuring of tot vaststelling van een tarief of maximumtarief,
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel35
  - number: 35.b
    text: tot ambtshalve vaststelling van een tarief of maximumtarief,
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel35
  - number: 35.c
    text: |-
      tot weigering van een verklaring als bedoeld in [artikel 13, derde lid][ref1], kan het orgaan voor gezondheidszorg
      of de representatieve organisatie van organen voor gezondheidszorg dan wel de ziektekostenverzekeraar of de
      representatieve organisatie van ziektekostenverzekeraars, die daardoor rechtstreeks in zijn belang is getroffen,
      beroep instellen bij het College van Beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel13
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '13'
        hoofdstuk: II
  - number: '41.1'
    text: |-
      Indien in deze wet geregelde onderwerpen in het belang van een goede uitvoering van de wet nadere regeling
      behoeven, kan deze geschieden bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel41
  - number: '41.2'
    text: |-
      Bij een algemene maatregel van bestuur ter uitvoering van deze wet kan Onze Minister worden opgedragen nadere
      regelen vast te stellen.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel41
  - number: '43.1'
    text: |-
      Een tarief dat onmiddellijk voor het tijdstip waarop deze wet ten aanzien van bij algemene maatregel van bestuur
      ingevolge [artikel 1, eerste, tweede, derde en vierde lid][ref1], aangewezen categorieën van organen voor
      gezondheidszorg of daarmee gelijkgestelde voorzieningen of instellingen in werking treedt, rechtsgeldig in rekening
      placht te worden gebracht aan ziektekostenverzekeraars of aan degenen die bij deze voor de prestatie waarop het
      tarief van toepassing is, zijn verzekerd, wordt in alle gevallen waarin het aan degene die tot die zelfde groep
      behoort, of aan een derde in rekening wordt gebracht, gelijkgesteld met een tarief dat ingevolge deze wet is tot
      stand gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel1
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '1'
        hoofdstuk: I
  - number: '43.2'
    text: |-
      Een tarief dat onmiddellijk voor het tijdstip waarop een algemene maatregel van bestuur als bedoeld in
      [artikel 17][ref1], in werking treedt, rechtsgeldig in rekening placht te worden gebracht door degene die een
      bij algemene maatregel van bestuur als bedoeld in [artikel 17][ref2], aangewezen prestatie verricht of door een
      bij zodanige algemene maatregel van bestuur aangewezen orgaan voor gezondheidszorg, wordt gelijkgesteld met een
      maximumtarief dat ingevolge deze wet is tot stand gekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel17a
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: 17a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 17a
        hoofdstuk: II
  - number: '43.3'
    text: |-
      Een tarief als bedoeld in het eerste lid, geldt gedurende ten hoogste twaalf maanden, te rekenen vanaf het in het
      eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel43
  - number: '43.4'
    text: |-
      Een beleidsregel als bedoeld in [artikel 11][ref1], die onmiddellijk voor het tijdstip waarop een algemene
      maatregel van bestuur als bedoeld in [artikel 17][ref2], in werking treedt, van toepassing is op een bij zodanige
      algemene maatregel van bestuur aangewezen prestatie of op een bij zodanige algemene maatregel van bestuur
      aangewezen orgaan voor gezondheidszorg, wordt gelijkgesteld met een beleidsregel die tot stand is gekomen na het
      tijdstip waarop een zodanige algemene maatregel van bestuur in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0003356#Artikel17a
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003356
        artikel: 17a
        hoofdstuk: II
  - number: '44'
    text: |-
      Een verzoek aan enig orgaan om goedkeuring of vaststelling van een tarief, door een orgaan voor
      gezondheidszorg of een representatieve organisatie van organen voor gezondheidszorg gedaan, voordat
      de categorie van organen voor gezondheidszorg waartoe verzoeker behoort, is aangewezen ingevolge
      [het eerste, tweede, derde of vierde lid van artikel 1][ref1], wordt gelijkgesteld met een ingevolge deze
      wet gedaan verzoek om goedkeuring of vaststelling van een tarief. Het College bepaalt in welke gevallen het
      goedgekeurde of vastgestelde tarief geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0003356#Artikel1
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0003356
        artikel: '1'
        hoofdstuk: I
  - number: '45'
    text: |-
      Bij algemene maatregel van bestuur kunnen, zo nodig in afwijking van deze wet, tijdelijke voorzieningen worden
      getroffen voor het geval het College uit de wet voortvloeiende verplichtingen niet naar behoren nakomt.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel45
  - number: '46'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van dit artikel en vervolgens telkens na vier jaar aan
      de beide kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van
      het College.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel46
  - number: '55'
    text: 'Deze wet wordt aangehaald als: Wet tarieven gezondheidszorg.'
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel55
  - number: '56'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0003356/2001-04-01#Artikel56
