---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_inzake_de_wisselkantoren
regulatory_layer: WET
publication_date: '2002-07-18'
valid_from: '2002-07-01'
bwb_id: BWBR0007125
url: https://wetten.overheid.nl/BWBR0007125/2002-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, ter bescherming van het financiële stelsel in Nederland en met
    het oog op het tegengaan van het witwassen van gelden en de uitvoering van de Wet identificatie bij financiële
    dienstverlening 1993 en de Wet melding ongebruikelijke transacties, wenselijk is te voorzien in een registratie van
    en een toezicht op wisselkantoren;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel1
  - number: 1.a
    text: |-
      wisselkantoor: de natuurlijke persoon, rechtspersoon of vennootschap die beroeps- of bedrijfsmatig ten behoeve van
      of op verzoek van een ander wisseltransacties uitvoert;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel1
  - number: 1.b
    text: |-
      wisseltransacties: het wisselen van munten of bankbiljetten, het uitbetalen van munten of bankbiljetten tegen
      inlevering van een of meer cheques, het uitbetalen van munten of bankbiljetten op vertoon van een credit-card en
      andere door Onze Ministers aan te wijzen transacties;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel1
  - number: 1.c
    text: |-
      register: het register bedoeld in [artikel 3][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel3
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '3'
        hoofdstuk: '2'
  - number: 1.d
    text: 'de Bank: De Nederlandsche Bank N.V.;'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel1
  - number: 1.e
    text: 'Onze Ministers: Onze Minister van Financiën en Onze Minister van Justitie.'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel1
  - number: '2'
    text: |-
      De Bank voert de registratie van wisselkantoren en oefent toezicht uit op de wisselkantoren overeenkomstig de
      bepalingen van deze wet.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel2
  - number: '3.1'
    text: Er is een register van wisselkantoren dat door de zorg van de Bank wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: '3.2'
    text: |-
      De Bank draagt zorg voor de inschrijving van ieder wisselkantoor dat daarom verzoekt, tenzij de Bank op grond
      van de betrouwbaarheid van een van de in het derde lid bedoelde personen of op grond van de bedrijfsvoering of de
      administratieve organisatie:
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.2.a
    text: |-
      van oordeel is dat hierdoor de integriteit van het financiële stelsel wordt aangetast of aannemelijk is dat deze
      zou kunnen worden aangetast;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.2.b
    text: |-
      een redelijk vermoeden heeft dat het wisselkantoor of een of meer van de in het derde lid genoemde personen zich
      schuldig maakt of schuldig zal maken aan witwassen of heling van geld, of
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.2.c
    text: |-
      van oordeel is dat de bedrijfsvoering of de administratieve organisatie onvoldoende is om aan de op het
      wisselkantoor rustende wettelijke verplichtingen te voldoen.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: '3.3'
    text: 'Het verzoek om inschrijving bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.3.a
    text: de identiteit en de antecedenten van de bestuurders van het wisselkantoor;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.3.b
    text: |-
      de identiteit en de antecedenten van degenen die het dagelijks beleid van het wisselkantoor bepalen of mede
      bepalen;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.3.c
    text: |-
      de identiteit en de antecedenten van de personen die rechtstreeks of middellijk bevoegd zijn de onder *a* en *b*
      bedoelde personen te benoemen of te ontslaan;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.3.d
    text: |-
      de naam, het adres en de vestigingsplaats van het wisselkantoor en het adres en de vestigingsplaats van de
      bijkantoren daarvan;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.3.e
    text: de voorziene bedrijfsvoering en administratieve organisatie van het wisselkantoor;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.3.f
    text: het nummer van inschrijving bij de Kamer van Koophandel;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: 3.3.g
    text: andere door Onze Ministers aan te wijzen gegevens.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: '3.4'
    text: De Bank beslist binnen acht weken op het verzoek.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: '3.5'
    text: |-
      In het register worden opgenomen de naam, het adres en de vestigingsplaats van het wisselkantoor, het adres en de
      vestigingsplaats van de bijkantoren, de datum van inschrijving van het wisselkantoor in het register en het nummer
      van inschrijving bij de Kamer van Koophandel.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: '3.6'
    text: |-
      Het wisselkantoor dat is ingeschreven in het register is verplicht iedere wijziging die optreedt in de in het derde
      lid bedoelde gegevens onverwijld schriftelijk aan de Bank mee te delen.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel3
  - number: '4.1'
    text: Het is verboden als wisselkantoor werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel4
  - number: '4.2'
    text: 'Het in het eerste lid vervatte verbod is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel4
  - number: 4.2.a
    text: degene die als wisselkantoor is ingeschreven in het register;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel4
  - number: 4.2.b
    text: de Bank;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel4
  - number: 4.2.c
    text: |-
      kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] die ingevolge
      [artikel 52, tweede lid, onder ][ref2] zijn ingeschreven;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: 4.2.d
    text: |-
      kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] die ingevolge
      [artikel 52, tweede lid, onder ][ref2] zijn ingeschreven, voorzover de werkzaamheden als wisselkantoor ingevolge
      [artikel 31, tweede lid][ref3], onderscheidenlijk [artikel 32, tweede lid, van die wet][ref4] in Nederland mogen
      worden uitgeoefend;


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel32
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '31'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: '32'
  - number: 4.2.e
    text: |-
      financiële instellingen die ingevolge [artikel 52, tweede lid, onder ][ref1] zijn ingeschreven, voorzover
      de werkzaamheden als wisselkantoor ingevolge [artikel 45][ref2], [artikel 50][ref3], onderscheidenlijk
      [artikel 51][ref4], van die wet mogen worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0005792#Artikel50
      [ref4]: https://wetten.overheid.nl/BWBR0005792#Artikel51
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0005792
        artikel: '50'
      - id: ref4
        bwb_id: BWBR0005792
        artikel: '51'
  - number: '5.1'
    text: |-
      Onze Ministers kunnen vrijstelling of, op verzoek, ontheffing verlenen van het in [artikel 4, eerste lid][ref1],
      vervatte verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel4
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '4'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      In door Onze Ministers te bepalen gevallen kan de in het eerste lid bedoelde ontheffing namens Onze Ministers
      worden verleend door de Bank.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel5
  - number: '5.3'
    text: Aan de vrijstelling en aan de ontheffing kunnen voorschriften worden verbonden en beperkingen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel5
  - number: '6.1'
    text: 'De Bank haalt de inschrijving door:'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.1.a
    text: op verzoek van het wisselkantoor;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.1.b
    text: in geval van overlijden van de natuurlijke persoon die het bedrijf van wisselkantoor uitoefent;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.1.c
    text: |-
      in geval het wisselkantoor of de natuurlijke persoon die het bedrijf van wisselkantoor uitoefent, in staat van
      faillissement is verklaard of ten aanzien van hem de schuldsaneringsregeling natuurlijke personen van toepassing
      is verklaard;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.1.d
    text: in geval van ontbinding van de rechtspersoon of vennootschap die het bedrijf van wisselkantoor uitoefent;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.1.e
    text: in geval van beëindiging van de werkzaamheden als wisselkantoor.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: '6.2'
    text: 'De Bank kan de inschrijving doorhalen:'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.2.a
    text: in geval het wisselkantoor kennelijk niet langer wisseltransacties uitvoert;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.2.b
    text: in geval het wisselkantoor niet voldoet aan zijn wettelijke verplichtingen;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.2.c
    text: |-
      in geval de Bank op grond van de betrouwbaarheid van een van de in [artikel 3, derde lid][ref1], bedoelde personen,
      of op grond van de bedrijfsvoering of de administratieve organisatie:


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel3
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '3'
        hoofdstuk: '2'
  - number: 6.2.c.1°
    text: |-
      van oordeel is dat de integriteit van het financiële stelsel wordt aangetast of aannemelijk is dat deze zou kunnen
      worden aangetast;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.2.c.2°
    text: |-
      een redelijk vermoeden heeft dat het wisselkantoor of een of meer van de in [artikel 3, derde lid][ref1], bedoelde
      personen zich schuldig maakt of schuldig zal maken aan witwassen of heling van geld, of


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel3
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '3'
        hoofdstuk: '2'
  - number: 6.2.c.3°
    text: |-
      van oordeel is dat de bedrijfsvoering of de administratieve organisatie onvoldoende is om aan de op het
      wisselkantoor rustende wettelijke verplichtingen te voldoen;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.2.d
    text: |-
      in geval de Bank informatie bekend wordt die, was zij haar bekend geweest op het moment van het verzoek om
      inschrijving, ertoe geleid zou hebben dat het verzoek niet zou zijn ingewilligd;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.2.e
    text: |-
      indien een der bestuurders of degene die het dagelijks beleid van het wisselkantoor bepaalt of mede bepaalt, in
      staat van faillissement is verklaard;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
  - number: 6.2.f
    text: |-
      de Bank niet binnen de door haar te bepalen termijn de ingevolge [artikel 8, tweede lid][ref1], verschuldigde
      betaling heeft ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel8
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '8'
        hoofdstuk: '2'
  - number: '7.1'
    text: |-
      Van de inschrijving in het register dan wel van de doorhaling van de inschrijving in het register wordt door
      de zorg van de Bank binnen twee weken na de dag waarop deze heeft plaatsgevonden, mededeling gedaan in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel7
  - number: '7.2'
    text: |-
      In de maand januari van elk jaar wordt door de zorg van de Bank een afschrift van het register naar de stand van 31
      december van het voorafgaande jaar in de *Staatscourant* geplaatst.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel7
  - number: '7.3'
    text: Een afschrift van het register ligt voor een ieder kosteloos ter inzage ten kantore van de Bank.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel7
  - number: '8.1'
    text: |-
      Het wisselkantoor is ter zake van het verzoek van inschrijving in het register aan de Bank een bedrag verschuldigd
      waarvan de hoogte door Onze Minister van Financiën wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel8
  - number: '8.2'
    text: |-
      Het wisselkantoor dat is ingeschreven in het register is jaarlijks, ter zake van de dekking van de kosten verbonden
      aan het toezicht op de geregistreerde wisselkantoren, aan de Bank een bedrag verschuldigd waarvan de hoogte door
      Onze Minister van Financiën wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel8
  - number: '8.3'
    text: |-
      De hoogte van de in dit artikel bedoelde bedragen wordt zodanig vastgesteld dat deze bedragen gezamenlijk ten
      hoogste gelijk zijn aan de kosten die de Bank maakt ter zake van de registratie van wisselkantoren en ter zake van
      het toezicht dat zij uitoefent op geregistreerde wisselkantoren.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel8
  - number: '9.1'
    text: |-
      De Bank is bevoegd van elk geregistreerd wisselkantoor inlichtingen te verlangen, voor zover dat voor de vervulling
      van haar taak redelijkerwijs nodig is. Een wisselkantoor waarvan de inlichtingen worden verlangd is verplicht deze
      binnen de door de Bank te stellen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel9
  - number: '9.2'
    text: |-
      Een geregistreerd wisselkantoor is verplicht binnen een door de Bank te stellen termijn aan de Bank een periodieke
      rapportage te zenden omtrent haar bedrijfsvoering en administratieve organisatie. De Bank bepaalt de wijze waarop
      de rapportage moet geschieden en de perioden waarop de rapportage betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel9
  - number: '10'
    text: |-
      De Bank is bevoegd van ieder wisselkantoor dat onder de vrijstelling ingevolge [artikel 5][ref1] valt of waaraan
      op grond van [artikel 5][ref2] een ontheffing is verleend, inlichtingen te verlangen, voor zover dat redelijkerwijs
      nodig is om te controleren of dat wisselkantoor zich houdt aan de aan de vrijstelling of ontheffing verbonden
      voorschriften en gestelde beperkingen. Een wisselkantoor waarvan inlichtingen worden verlangd is verplicht deze
      binnen de door de Bank te stellen termijn te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007125#Artikel5
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007125
        artikel: '5'
        hoofdstuk: '2'
  - number: '11'
    text: |-
      De Bank is bevoegd bij iedere natuurlijke persoon, rechtspersoon of vennootschap, van welke de Bank vermoedt, dat
      zij een wisselkantoor in de zin van [artikel 1][ref1] van deze wet is, alle inlichtingen in te winnen of te doen
      inwinnen, die redelijkerwijze geacht kunnen worden nodig te zijn om zulks te beoordelen. De natuurlijke persoon van
      wie en de rechtspersoon of vennootschap waarvan de Bank deze inlichtingen verlangt is verplicht deze binnen de door
      de Bank te stellen termijn te verstrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel1
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '1'
        hoofdstuk: '1'
        paragraaf: '1'
  - number: '12.1'
    text: |-
      De Bank is bevoegd van iedere kredietinstelling als bedoeld in
      [artikel 1, eerste lid, onderdeel a, onder 1°, van de Wet toezicht kredietwezen 1992][ref1] of financiële
      instelling die ingevolge [artikel 52, tweede lid, van de Wet toezicht kredietwezen 1992][ref2] is ingeschreven,
      inlichtingen te verlangen betreffende de door die instelling met een wisselkantoor verrichte transacties, voor
      zover dat voor de vervulling van haar taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0005792#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0005792#Artikel52
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005792
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0005792
        artikel: '52'
  - number: '12.2'
    text: |-
      Een instelling, als bedoeld in het eerste lid, waarvan inlichtingen worden verlangd is verplicht deze binnen de
      door de Bank te stellen termijn te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel12
  - number: '12.3'
    text: |-
      Voor zover de in het eerste lid bedoelde inlichtingen gegevens betreffen die de instelling aan de Bank verstrekt
      uit hoofde van de [Wet financiële betrekkingen buitenland 1994][ref1], kan de instelling aan de in het tweede lid
      genoemde verplichtingen voldoen door die gegevens aan te merken als verstrekt uit hoofde van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006547
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0006547
  - number: '13.1'
    text: |-
      De door de Bank met het toezicht belaste personen zijn bevoegd elke plaats te betreden voor zover dat voor de
      vervulling van hun taak redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel13
  - number: '13.2'
    text: Zo nodig verschaffen de door de Bank met het toezicht belaste personen zich toegang met behulp van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel13
  - number: '13.3'
    text: |-
      De door de Bank met het toezicht belaste personen zijn bevoegd van gegevens, gegevensdragers en bescheiden kopieën
      te maken.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel13
  - number: '13.4'
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden, zijn de door de Bank met het toezicht belaste
      personen bevoegd de gegevens, gegevensdragers en bescheiden voor dat doel voor korte tijd mee te nemen tegen een
      door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel13
  - number: '14.1'
    text: |-
      Bij de uitoefening van hun taak dragen de door de Bank met het toezicht belaste personen een legitimatiebewijs
      bij zich.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel14
  - number: '14.2'
    text: |-
      Onverminderd [artikel 1, eerste en tweede lid, van de Algemene wet op het binnentreden][ref1] tonen zij hun
      legitimatiebewijs desgevraagd aanstonds.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '1'
  - number: '14.3'
    text: |-
      Het legitimatiebewijs bevat een foto van de door de Bank met het toezicht belaste persoon en vermeldt in ieder
      geval diens naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel14
  - number: '15'
    text: |-
      De Bank kan, voorzover dat noodzakelijk is voor de uitoefening van haar taak, aan geregistreerde wisselkantoren
      aanbevelingen en algemene richtlijnen geven met betrekking tot de bedrijfsvoering en de administratieve
      organisatie, daaronder begrepen de financiële administratie en de interne controle.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel15
  - number: '16'
    text: |-
      Het is aan iedere financiële instelling als bedoeld in[ artikel 1, eerste lid, onderdeel ][ref1] 1993,
      verboden om aan wisselkantoren waarop naar genoemde instelling weet of redelijkerwijs kan vermoeden het
      verbod van [artikel 4, eerste lid][ref2], van toepassing is, financiële diensten te verlenen als bedoeld in
      [artikel 1, eerste lid, onder ][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006330#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007125#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006330#Artikel1
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0006330
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007125
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0006330
        artikel: '1'
  - number: '17'
    text: |-
      Het is aan een ieder die uit hoofde van deze wet of van krachtens deze wet genomen besluiten enige taak vervult,
      verboden van gegevens of inlichtingen, ingevolge deze wet verstrekt, of van een instantie als bedoeld in
      [artikel 20][ref1] verkregen, of van gegevens of inlichtingen, bij het onderzoek van boeken, bescheiden of andere
      gegevensdragers verkregen, verder of anders bekendheid te geven dan voor de uitoefening van zijn taak of door deze
      wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel20
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '20'
        hoofdstuk: '4'
  - number: '18'
    text: |-
      De Bank licht het meldpunt bedoeld in [artikel 2 van de Wet melding ongebruikelijke transacties][ref1] in, indien
      zij bij de uitoefening van haar bij deze wet opgelegde taak feiten ontdekt die duiden op witwassen of heling van
      geld.


      [ref1]: https://wetten.overheid.nl/BWBR0006331#Artikel2
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0006331
        artikel: '2'
  - number: '19.1'
    text: |-
      De Bank is, in afwijking van [artikel 17][ref1], bevoegd om gegevens of inlichtingen verkregen bij de vervulling
      van de haar ingevolge deze wet opgedragen taak, te verstrekken aan Nederlandse of buitenlandse overheidsinstanties
      dan wel aan Nederlandse of buitenlandse van overheidswege aangewezen instanties die belast zijn met het toezicht
      op financiële markten of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam
      zijn, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel17
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '17'
        hoofdstuk: '4'
  - number: 19.1.a
    text: het doel waarvoor de gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.1.b
    text: |-
      het beoogde gebruik van de gegevens of inlichtingen niet past in het kader van het toezicht op financiële markten
      of op natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.1.c
    text: de verstrekking van de gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de openbare orde;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.1.d
    text: de geheimhouding van de gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.1.e
    text: |-
      de verstrekking van de gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met de belangen die
      deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.1.f
    text: |-
      onvoldoende is gewaarborgd dat de gegevens of inlichtingen niet zullen worden gebruikt voor een ander doel dan
      waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: '19.2'
    text: |-
      Indien een buitenlandse instantie als bedoeld in het eerste lid aan degene die gegevens of inlichtingen op grond
      van dat lid heeft verstrekt, verzoekt om die gegevens of inlichtingen te mogen gebruiken voor een ander doel dan
      waarvoor zij zijn verstrekt, mag dat verzoek slechts worden ingewilligd:
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.2.a
    text: voor zover het beoogde gebruik niet in strijd is met het eerste lid; dan wel
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.2.b
    text: |-
      voor zover die buitenlandse instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende procedures voor dat andere doel de beschikking over die gegevens of
      inlichtingen zou kunnen verkrijgen; alsmede
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: 19.2.c
    text: |-
      pas na overleg met Onze Minister van Justitie indien het in de aanhef bedoelde verzoek betrekking heeft op een
      onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel19
  - number: '20.1'
    text: |-
      Ter uitvoering van verdragen tot uitwisseling van gegevens of inlichtingen dan wel ter uitvoering van bindende
      besluiten van volkenrechtelijke organisaties met betrekking tot het toezicht op financiële markten of op
      natuurlijke personen, rechtspersonen en vennootschappen die op die markten werkzaam zijn, is de Bank bevoegd ten
      behoeve van een instantie die werkzaam is in een Staat die met Nederland partij is bij een verdrag of die met
      Nederland valt onder eenzelfde bindend besluit van een volkenrechtelijke organisatie, en die in die Staat belast is
      met de uitvoering van wettelijke regelingen inzake het toezicht op het kredietwezen of wisselkantoren, inlichtingen
      te vragen aan of een onderzoek in te stellen of te doen instellen bij ieder geregistreerd wisselkantoor dat
      ingevolge deze wet onder haar toezicht valt dan wel bij een ieder waarvan redelijkerwijs kan worden vermoed dat hij
      over gegevens of inlichtingen beschikt die van belang kunnen zijn voor de uitvoering van de wettelijke regelingen
      als hiervoor bedoeld.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel20
  - number: '20.2'
    text: |-
      Degene aan wie gegevens of inlichtingen als bedoeld in het eerste lid worden gevraagd, verstrekt deze gegevens of
      inlichtingen binnen een door de Bank te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel20
  - number: '20.3'
    text: |-
      Degene bij wie een onderzoek als bedoeld in het eerste lid wordt ingesteld, verleent aan de persoon die het
      onderzoek verricht alle medewerking die nodig is voor een goede uitvoering van dat onderzoek, met dien verstande
      dat degene bij wie het onderzoek wordt ingesteld slechts kan worden verplicht tot het verlenen van inzage in
      boeken, zakelijke bescheiden of andere informatiedragers.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel20
  - number: '21.1'
    text: |-
      De Bank verstrekt aan de autoriteiten die ingevolge de [Wet toezicht kredietwezen 1992][ref1], de
      [Wet toezicht verzekeringsbedrijf 1993][ref2], de [Wet toezicht beleggingsinstellingen][ref3] onderscheidenlijk
      de Wet toezicht effectenverkeer, belast zijn met het toezicht op kredietinstellingen, verzekeraars,
      beleggingsinstellingen onderscheidenlijk effectenbemiddelaars en vermogensbeheerders, de gegevens of inlichtingen
      die zij heeft verkregen bij de vervulling van de haar ingevolge deze wet opgedragen taak en die betrekking hebben
      op de betrouwbaarheid van de personen als bedoeld in [artikel 3, derde lid, onder ][ref4], voorzover de Bank van
      oordeel is dat de gegevens of inlichtingen van belang zijn of zouden kunnen zijn voor het toezicht dat door die
      andere autoriteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005792
      [ref2]: https://wetten.overheid.nl/BWBR0006509
      [ref3]: https://wetten.overheid.nl/BWBR0004809
      [ref4]: https://wetten.overheid.nl/BWBR0007125#Artikel3
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005792
      - id: ref2
        bwb_id: BWBR0006509
      - id: ref3
        bwb_id: BWBR0004809
      - id: ref4
        bwb_id: BWBR0007125
        artikel: '3'
        hoofdstuk: '2'
  - number: '21.2'
    text: |-
      De in het eerste lid bedoelde verplichting geldt niet in het geval de gegevens of inlichtingen zijn verkregen van
      een buitenlandse instantie als bedoeld in [artikel 19][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel19
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '19'
        hoofdstuk: '4'
  - number: '22.1'
    text: |-
      De Bank kan toestaan dat een functionaris van een buitenlandse instantie als bedoeld in
      [artikel 20, eerste lid][ref1], deelneemt aan de uitvoering van een verzoek als bedoeld in dat lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel20
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '20'
        hoofdstuk: '4'
  - number: '22.2'
    text: |-
      De verplichting, omschreven in het[ derde lid van artikel 20][ref1], geldt eveneens jegens de in het eerste lid
      bedoelde functionaris.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel20
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '20'
        hoofdstuk: '4'
  - number: '22.3'
    text: |-
      De in het eerste lid bedoelde functionaris volgt de aanwijzingen op van de persoon die met de uitvoering van het
      verzoek is belast.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel22
  - number: '23'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: 23a.1
    text: |-
      De Bank kan een last onder dwangsom opleggen ter zake van overtreding van voorschriften gesteld, bij of krachtens
      de[ artikelen 3, zesde lid][ref1], [4, eerste lid][ref2], [5, derde lid][ref3], [9, eerste en tweede lid][ref4],
      [10][ref5], [11][ref6], [12, tweede lid][ref7], [16][ref8] en [20, tweede en derde lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007125#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007125#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007125#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0007125#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0007125#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0007125#Artikel12
      [ref8]: https://wetten.overheid.nl/BWBR0007125#Artikel16
      [ref9]: https://wetten.overheid.nl/BWBR0007125#Artikel20
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007125
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007125
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0007125
        artikel: '9'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0007125
        artikel: '10'
        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0007125
        artikel: '11'
        hoofdstuk: '3'
      - id: ref7
        bwb_id: BWBR0007125
        artikel: '12'
        hoofdstuk: '3'
      - id: ref8
        bwb_id: BWBR0007125
        artikel: '16'
        hoofdstuk: '4'
      - id: ref9
        bwb_id: BWBR0007125
        artikel: '20'
        hoofdstuk: '4'
  - number: 23a.2
    text: |-
      De [artikelen 5:32, tweede tot en met vijfde lid][ref1], en
      [5:33 tot en met 5:35 van de Algemene wet bestuursrecht][ref2] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 23a.3
    text: |-
      Onze Minister van Financiën kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23a
  - number: 23b.1
    text: |-
      De Bank kan een bestuurlijke boete opleggen ter zake van overtreding van voorschriften gesteld, bij of krachtens
      de[ artikelen 3, zesde lid][ref1], [4, eerste lid][ref2], [5, derde lid][ref3], [9, eerste en tweede lid][ref4],
      [10][ref5], [11][ref6], [12, tweede lid][ref7], [16][ref8] en [20, tweede en derde lid][ref9].


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007125#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007125#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0007125#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0007125#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0007125#Artikel11
      [ref7]: https://wetten.overheid.nl/BWBR0007125#Artikel12
      [ref8]: https://wetten.overheid.nl/BWBR0007125#Artikel16
      [ref9]: https://wetten.overheid.nl/BWBR0007125#Artikel20
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0007125
        artikel: '4'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0007125
        artikel: '5'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0007125
        artikel: '9'
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0007125
        artikel: '10'
        hoofdstuk: '3'
      - id: ref6
        bwb_id: BWBR0007125
        artikel: '11'
        hoofdstuk: '3'
      - id: ref7
        bwb_id: BWBR0007125
        artikel: '12'
        hoofdstuk: '3'
      - id: ref8
        bwb_id: BWBR0007125
        artikel: '16'
        hoofdstuk: '4'
      - id: ref9
        bwb_id: BWBR0007125
        artikel: '20'
        hoofdstuk: '4'
  - number: 23b.2
    text: De bestuurlijke boete komt toe aan de Bank.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23b
  - number: 23b.3
    text: |-
      Onze Minister van Financiën, in overeenstemming met Onze Minister van Justitie, kan regels stellen ter zake van de
      uitoefening van de bevoegdheid bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23b
  - number: 23c.1
    text: |-
      Het bedrag van de boete wordt bepaald op de wijze als voorzien in de bijlage, met dien verstande dat de boete voor
      een afzonderlijke overtreding ten hoogste € 900 000 bedraagt.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23c
  - number: 23c.2
    text: De bijlage bepaalt bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23c
  - number: 23c.3
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23c
  - number: 23c.4
    text: |-
      De Bank kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het bedrag van de boete in
      een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog is.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23c
  - number: 23d
    text: |-
      Degene jegens wie door de Bank een handeling is verricht waaraan hij in redelijkheid de gevolgtrekking kan
      verbinden dat hem wegens een overtreding een boete zal worden opgelegd, is niet verplicht ter zake daarvan enige
      verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23d
  - number: 23e.1
    text: |-
      Indien de Bank voornemens is een boete op te leggen, geeft hij de betrokkene daarvan kennis onder vermelding van de
      gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23e
  - number: 23e.2
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1], stelt de Bank de betrokkene in de
      gelegenheid om naar keuze schriftelijk of mondeling zijn zienswijze naar voren te brengen voordat de boete wordt
      opgelegd, tenzij het een overtreding betreft die in de bijlage, bedoeld in [artikel 23c][ref2], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0007125#Artikel23c
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23e
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0007125
        artikel: 23c
        hoofdstuk: 5_A
  - number: 23f.1
    text: De Bank legt de boete op bij beschikking.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23f
  - number: 23f.2
    text: 'De beschikking vermeldt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23f
  - number: 23f.2.a
    text: het feit ter zake waarvan de boete wordt opgelegd, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23f
  - number: 23f.2.b
    text: het bedrag van de boete en de gegevens op basis waarvan dit bedrag is bepaald; en
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23f
  - number: 23f.2.c
    text: |-
      de termijn, bedoeld in [artikel 23h, eerste lid][ref1], waarbinnen de boete moet worden betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel23h
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23f
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: 23h
        hoofdstuk: 5_A
  - number: 23g.1
    text: |-
      De werking van de beschikking tot oplegging van een boete wordt opgeschort totdat de beroepstermijn is verstreken
      of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23g
  - number: 23g.2
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 23e, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel23e
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23g
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: 23e
        hoofdstuk: 5_A
  - number: 23h.1
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
  - number: 23h.2
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sedert de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 23e, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel23e
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: 23e
        hoofdstuk: 5_A
  - number: 23h.3
    text: |-
      Indien de boete niet tijdig is betaald, stuurt de Bank schriftelijk een aanmaning om binnen twee weken de boete,
      verhoogd met de kosten van de aanmaning, alsnog te betalen. De aanmaning bevat de aanzegging, dat de boete, voor
      zover deze niet binnen de gestelde termijn wordt betaald, overeenkomstig het derde lid zal worden ingevorderd.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
  - number: 23h.4
    text: |-
      Bij gebreke van tijdige betaling kan de Bank de boete, verhoogd met de kosten van de aanmaning en van de
      invordering, bij dwangbevel invorderen.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
  - number: 23h.5
    text: |-
      Het dwangbevel wordt op kosten van de overtreder bij deurwaardersexploit betekend en levert een executoriale titel
      op in de zin van het [Tweede Boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
  - number: 23h.6
    text: Gedurende zes weken na de dag van betekening staat verzet tegen het dwangbevel open door dagvaarding van de Bank.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
  - number: 23h.7
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de voorzieningenrechter van de rechtbank in kort geding
      desgevraagd anders beslist.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
  - number: 23h.8
    text: |-
      Het verzet kan niet worden gegrond op de stelling dat de boete ten onrechte of op een te hoog bedrag is
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23h
  - number: 23i.1
    text: |-
      De bevoegdheid een boete op te leggen vervalt indien ter zake van de overtreding een strafvervolging is ingesteld
      en het onderzoek ter terechtzitting een aanvang heeft genomen, dan wel het recht tot strafvordering is vervallen
      ingevolge [artikel 74 van het Wetboek van Strafrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: 23i.2
    text: |-
      Het recht tot strafvervolging met betrekking tot een overtreding als bedoeld in [artikel 23b][ref1] vervalt, indien
      de Bank ter zake van die overtreding reeds een boete heeft opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel23b
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: 23b
        hoofdstuk: 5_A
  - number: 23j.1
    text: De bevoegdheid een boete op te leggen vervalt drie jaren na de dag waarop de overtreding is begaan.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23j
  - number: 23j.2
    text: |-
      De termijn bedoeld in het eerste lid wordt gestuit door de bekendmaking van de beschikking waarbij een boete wordt
      opgelegd.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23j
  - number: 23k
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom of van een boete worden verricht door personen die
      niet betrokken zijn geweest bij het vaststellen van de overtreding en het daaraan voorafgaande onderzoek.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23k
  - number: 23l.1
    text: |-
      Met het oog op de bescherming van het financiële stelsel en het tegengaan van het witwassen van geld, kunnen
      Onze Minister van Financiën en de Bank, onverminderd [artikel 17][ref1], het feit ter zake waarvan de last onder
      dwangsom of de bestuurlijke boete is opgelegd, het overtreden voorschrift, alsmede de naam, het adres en de
      woonplaats van degene aan wie de last onder dwangsom of de bestuurlijke boete is opgelegd, ter openbare kennis
      brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel17
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23l
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '17'
        hoofdstuk: '4'
  - number: 23l.2
    text: |-
      Onze Minister van Financiën kan regels stellen ter zake van de uitoefening van de bevoegdheid bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel23l
  - number: '29.1'
    text: |-
      De in [artikel 4, eerste lid][ref1], vervatte verbodsbepaling blijft buiten toepassing tot de eerste dag van de
      tweede kalendermaand na de datum van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel4
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '4'
        hoofdstuk: '2'
  - number: '29.2'
    text: |-
      Met ingang van de in het eerste lid bedoelde dag geldt de in [artikel 4, eerste lid][ref1], vervatte
      verbodsbepaling niet ten aanzien van degene die in de aan die dag voorafgaande periode bij de Bank een verzoek om
      registratie heeft ingediend en tot de tweede dag nadat de Bank zijn beslissing op het verzoek heeft verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel4
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '4'
        hoofdstuk: '2'
  - number: '29.3'
    text: |-
      In plaats van de in [artikel 3, vierde lid][ref1], genoemde termijn geldt voor het nemen van een beslissing als
      bedoeld in het tweede lid een termijn van 13 weken.


      [ref1]: https://wetten.overheid.nl/BWBR0007125#Artikel3
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007125
        artikel: '3'
        hoofdstuk: '2'
  - number: '30'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel30
  - number: '31'
    text: 'Deze wet kan worden aangehaald als: Wet inzake de wisselkantoren.'
    url: https://wetten.overheid.nl/BWBR0007125/2002-07-01#Artikel31
