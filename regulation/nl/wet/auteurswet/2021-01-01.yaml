---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: auteurswet
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2021-01-01'
bwb_id: BWBR0001886
url: https://wetten.overheid.nl/BWBR0001886/2021-01-01
preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat het wenschelijk is eene nieuwe regeling van het auteursrecht vast te
    stellen;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het auteursrecht is het uitsluitend recht van den maker van een werk van letterkunde, wetenschap of kunst, of van
      diens rechtverkrijgenden, om dit openbaar te maken en te verveelvoudigen, behoudens de beperkingen, bij de wet
      gesteld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel1
  - number: '2.1'
    text: Het auteursrecht gaat over bij erfopvolging en is vatbaar voor gehele of gedeeltelijke overdracht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel2
  - number: '2.2'
    text: |-
      De maker, of zijn rechtverkrijgende, kan aan een derde een licentie verlenen voor het geheel of een gedeelte van
      het auteursrecht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel2
  - number: '2.3'
    text: |-
      De levering vereist voor gehele of gedeeltelijke overdracht, alsmede de verlening van een exclusieve licentie,
      geschiedt bij een daartoe bestemde akte. De overdracht of de verlening van een exclusieve licentie omvat alleen
      die bevoegdheden die in de akte staan vermeld of die uit de aard en de strekking van de titel of licentieverlening
      noodzakelijkerwijs voortvloeien.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel2
  - number: '2.4'
    text: |-
      Het auteursrecht dat toekomt aan de maker van een werk, alsmede, na het overlijden van de maker, het auteursrecht
      op niet openbaar gemaakte werken dat toekomt aan degene die het als erfgenaam of legataris van de maker heeft
      verkregen, is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel2
  - number: '2.5'
    text: |-
      Het derde lid, tweede volzin, en het vierde lid zijn niet van toepassing op een maker als bedoeld in
      [artikel 7][ref1] en [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel8
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: '3'
    text: |-
      Wanneer een maker van een werk van letterkunde, wetenschap of kunst het auteursrecht aan een uitgever heeft
      overgedragen of in licentie heeft gegeven, dan vormt deze overdracht of licentie voor de uitgever een afdoende
      rechtsgrondslag om aanspraak te maken op een deel van de vergoedingen voor het gebruik van het werk in het kader
      van de beperkingen op het overgedragen of in licentie gegeven recht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel3
  - number: '4.1'
    text: |-
      Behoudens bewijs van het tegendeel wordt voor den maker gehouden hij die op of in het werk als zoodanig is
      aangeduid, of bij gebreke van zulk eene aanduiding, degene, die bij de openbaarmaking van het werk als maker
      daarvan is bekend gemaakt door hem, die het openbaar maakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel4
  - number: '4.2'
    text: |-
      Wordt bij het houden van een niet in druk verschenen mondelinge voordracht geen mededeling omtrent de maker gedaan,
      dan wordt, behoudens bewijs van het tegendeel, voor de maker gehouden hij die de mondelinge voordracht houdt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel4
  - number: '5.1'
    text: |-
      Van een werk van letterkunde, wetenschap of kunst, hetwelk bestaat uit afzonderlijke werken van twee of meer
      personen, wordt, onverminderd het auteursrecht op ieder werk afzonderlijk, als de maker aangemerkt degene,
      onder wiens leiding en toezicht het gansche werk is tot stand gebracht, of bij gebreke van dien, degene, die de
      verschillende werken verzameld heeft.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel5
  - number: '5.2'
    text: |-
      Als inbreuk op het auteursrecht op het gansche werk wordt beschouwd het verveelvoudigen of openbaar maken van eenig
      daarin opgenomen afzonderlijk werk, waarop auteursrecht bestaat, door een ander dan den maker daarvan of diens
      rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel5
  - number: '5.3'
    text: |-
      Is zulk een afzonderlijk werk niet te voren openbaar gemaakt, dan wordt, tenzij tusschen partijen anders is
      overeengekomen, als inbreuk op het auteursrecht op het gansche werk beschouwd het verveelvoudigen of openbaar maken
      van dat afzonderlijk werk door den maker daarvan of diens rechtverkrijgenden, indien daarbij niet het werk vermeld
      wordt, waarvan het deel uitmaakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel5
  - number: '6'
    text: |-
      Indien een werk is tot stand gebracht naar het ontwerp van een ander en onder diens leiding en toezicht, wordt deze
      als de maker van dat werk aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel6
  - number: '7'
    text: |-
      Indien de arbeid, in dienst van een ander verricht, bestaat in het vervaardigen van bepaalde werken van
      letterkunde, wetenschap of kunst, dan wordt, tenzij tusschen partijen anders is overeengekomen, als de maker van
      die werken aangemerkt degene, in wiens dienst de werken zijn vervaardigd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel7
  - number: '8'
    text: |-
      Indien eene openbare instelling, eene vereeniging, stichting of vennootschap, een werk als van haar afkomstig
      openbaar maakt, zonder daarbij eenig natuurlijk persoon als maker er van te vermelden, wordt zij, tenzij bewezen
      wordt, dat de openbaarmaking onder de bedoelde omstandigheden onrechtmatig was, als de maker van dat werk
      aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel8
  - number: '9'
    text: |-
      Indien op of in eenig in druk verschenen exemplaar van het werk de maker niet, of niet met zijn waren naam,
      is vermeld, kan tegenover derden het auteursrecht ten behoeve van den rechthebbende worden uitgeoefend door
      dengene, die op of in dat exemplaar van het werk als de uitgever ervan is aangeduid, of bij gebreke van zoodanige
      aanduiding, door dengene, die op of in het exemplaar van het werk als de drukker ervan is vermeld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel9
  - number: '10.1'
    text: 'Onder werken van letterkunde, wetenschap of kunst verstaat deze wet:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.1°
    text: boeken, brochures, nieuwsbladen, tijdschriften en andere geschriften;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.2°
    text: tooneelwerken en dramatisch-muzikale werken;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.3°
    text: mondelinge voordrachten;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.4°
    text: choreografische werken en pantomimes;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.5°
    text: muziekwerken met of zonder woorden;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.6°
    text: teeken-, schilder-, bouw- en beeldhouwwerken, lithografieën, graveer- en andere plaatwerken;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.7°
    text: aardrijkskundige kaarten;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.8°
    text: |-
      ontwerpen, schetsen en plastische werken, betrekkelijk tot de bouwkunde, de aardrijkskunde, de plaatsbeschrijving
      of andere wetenschappen;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.9°
    text: fotografische werken;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.10
    text: filmwerken;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.11°
    text: werken van toegepaste kunst en tekeningen en modellen van nijverheid;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: 10.1.12°
    text: computerprogramma’s en het voorbereidend materiaal;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: '10.2'
    text: |-
      Verveelvoudigingen in gewijzigde vorm van een werk van letterkunde, wetenschap of kunst, zoals vertalingen,
      muziekschikkingen, verfilmingen en andere bewerkingen, zomede verzamelingen van verschillende werken, worden,
      onverminderd het auteursrecht op het oorspronkelijke werk, als zelfstandige werken beschermd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: '10.3'
    text: |-
      Verzamelingen van werken, gegevens of andere zelfstandige elementen, systematisch of methodisch geordend, en
      afzonderlijk met elektronische middelen of anderszins toegankelijk, worden, onverminderd andere rechten op de
      verzameling en onverminderd het auteursrecht of andere rechten op de in de verzameling opgenomen werken, gegevens
      of andere elementen, als zelfstandige werken beschermd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel10
  - number: '11'
    text: |-
      Er bestaat geen auteursrecht op wetten, besluiten en verordeningen, door de openbare macht uitgevaardigd, noch op
      rechterlijke uitspraken en administratieve beslissingen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel11
  - number: '12.1'
    text: 'Onder de openbaarmaking van een werk van letterkunde, wetenschap of kunst wordt mede verstaan:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: 12.1.1°
    text: de openbaarmaking van eene verveelvoudiging van het geheel of een gedeelte van het werk;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: 12.1.2°
    text: |-
      de verbreiding van het geheel of een gedeelte van het werk of van eene verveelvoudiging daarvan, zoolang het niet
      in druk verschenen is;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: 12.1.3°
    text: |-
      het verhuren of uitlenen van het geheel of een gedeelte van een exemplaar van het werk met uitzondering van
      bouwwerken en werken van toegepaste kunst, of van een verveelvoudiging daarvan die door de rechthebbende of met
      zijn toestemming in het verkeer is gebracht;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: 12.1.4°
    text: |-
      de voordracht, op- of uitvoering of voorstelling in het openbaar van het geheel of een gedeelte van het werk of van
      eene verveelvoudiging daarvan;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: 12.1.5°
    text: |-
      het uitzenden van een in een radio- of televisieprogramma opgenomen werk door middel van een satelliet of een
      andere zender of een omroepnetwerk als bedoeld in [artikel 1.1 van de Mediawet 2008][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: '12.2'
    text: |-
      Onder verhuren als bedoeld in het eerste lid, onder 3°, wordt verstaan het voor een beperkte tijd en tegen een
      direct of indirect economisch of commercieel voordeel voor gebruik ter beschikking stellen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: '12.3'
    text: |-
      Onder uitlenen als bedoeld in het eerste lid, onder 3°, wordt verstaan het voor een beperkte tijd en zonder
      direct of indirect economisch of commercieel voordeel voor gebruik ter beschikking stellen door voor het publiek
      toegankelijke instellingen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: '12.4'
    text: |-
      Onder een voordracht, op- of uitvoering of voorstelling in het openbaar wordt mede begrepen die in besloten kring,
      tenzij deze zich beperkt tot de familie-, vrienden- of daaraan gelijk te stellen kring, en voor de toegang tot de
      voordracht, op- of uitvoering of voorstelling geen betaling, in welke vorm ook, geschiedt. Hetzelfde geldt voor
      een tentoonstelling.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: '12.5'
    text: |-
      Onder een voordracht, op- of uitvoering of voorstelling in het openbaar wordt niet begrepen die welke uitsluitend
      dient tot het onderwijs dat vanwege de overheid of vanwege een rechtspersoon zonder winstoogmerk wordt gegeven,
      voor zover de voordracht, op- of uitvoering of voorstelling deel uitmaakt van het schoolwerkplan of leerplan voor
      zover van toepassing, of tot een wetenschappelijk doel.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: '12.6'
    text: |-
      Als afzonderlijke openbaarmaking wordt niet beschouwd de gelijktijdige uitzending van een in een radio- of
      televisieprogramma opgenomen werk door hetzelfde organisme dat dat programma oorspronkelijk uitzendt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: '12.7'
    text: |-
      Onder het uitzenden van een in een radio- of televisieprogramma opgenomen werk door middel van een satelliet wordt
      verstaan de handeling waarbij de programmadragende signalen voor ontvangst door het publiek onder controle en
      verantwoordelijkheid van de omroeporganisatie worden ingevoerd in een ononderbroken mededelingenketen die naar de
      satelliet en terug naar de aarde voert. Indien de programmadragende signalen in gecodeerde vorm worden uitgezonden,
      is er sprake van het uitzenden van een in een radio- of televisieprogramma opgenomen werk door middel van een
      satelliet, indien de middelen voor het decoderen van de uitzending door of met toestemming van de omroeporganisatie
      ter beschikking van het publiek worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12
  - number: 12a.1
    text: |-
      Indien de maker het verhuurrecht, bedoeld in [artikel 12, eerste lid, onder 3°][ref1], met betrekking tot een op
      een fonogram vastgelegd werk van letterkunde, wetenschap of kunst aan de producent daarvan heeft overgedragen, is
      de producent de maker een billijke vergoeding verschuldigd voor de verhuur.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel12
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '12'
        hoofdstuk: I
        paragraaf: '4'
  - number: 12a.2
    text: Van het in het eerste lid bedoelde recht op een billijke vergoeding kan geen afstand worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12a
  - number: 12b
    text: |-
      Indien een exemplaar van een werk van letterkunde, wetenschap of kunst door of met toestemming van de maker of zijn
      rechtverkrijgende voor de eerste maal in een van de lidstaten van de Europese Unie of in een staat die partij is
      bij de Overeenkomst betreffende de Europese Economische Ruimte in het verkeer is gebracht door eigendomsoverdracht,
      dan vormt het anderszins in het verkeer brengen van dat exemplaar, met uitzondering van verhuur en uitlening, geen
      inbreuk op het auteursrecht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel12b
  - number: '13'
    text: |-
      Onder de verveelvoudiging van een werk van letterkunde, wetenschap of kunst wordt mede verstaan de vertaling, de
      muziekschikking, de verfilming of tooneelbewerking en in het algemeen iedere geheele of gedeeltelijke bewerking of
      nabootsing in gewijzigden vorm, welke niet als een nieuw, oorspronkelijk werk moet worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel13
  - number: 13a
    text: |-
      Onder de verveelvoudiging van een werk van letterkunde, wetenschap of kunst wordt niet verstaan de tijdelijke
      reproductie die van voorbijgaande of incidentele aard is, en die een integraal en essentieel onderdeel vormt van
      een technisch procédé dat wordt toegepast met als enig doel
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel13a
  - number: 13a.a)
    text: de doorgifte in een netwerk tussen derden door een tussenpersoon of
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel13a
  - number: 13a.b)
    text: een rechtmatig gebruik
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel13a
  - number: '14'
    text: |-
      Onder het verveelvoudigen van een werk van letterkunde, wetenschap of kunst wordt mede verstaan het vastleggen van
      dat werk of een gedeelte daarvan op enig voorwerp dat bestemd is om een werk ten gehore te brengen of te vertonen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel14
  - number: '15.1'
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd het
      overnemen van berichten of artikelen over actuele economische, politieke, godsdienstige of levensbeschouwelijke
      onderwerpen alsmede van werken van dezelfde aard die in een dag-, nieuws- of weekblad, tijdschrift, radio- of
      televisieprogramma of ander medium dat eenzelfde functie vervult, zijn openbaar gemaakt, indien:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15
  - number: 15.1.1°
    text: |-
      het overnemen geschiedt door een dag-, nieuws- of weekblad of tijdschrift, in een radio- of televisieprogramma of
      ander medium dat een zelfde functie vervult;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15
  - number: 15.1.2°
    text: |-
      [artikel 25][ref1] in acht wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 15.1.3°
    text: de bron, waaronder de naam van de maker, op duidelijke wijze wordt vermeld; en
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15
  - number: 15.1.4°
    text: het auteursrecht niet uitdrukkelijk is voorbehouden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15
  - number: '15.2'
    text: Dit artikel is mede van toepassing op het overnemen in een andere taal dan de oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15
  - number: 15a.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd het citeren
      uit een werk in een aankondiging, beoordeling, polemiek of wetenschappelijke verhandeling of voor een uiting met
      een vergelijkbaar doel mits:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15a
  - number: 15a.1.1°
    text: het werk waaruit geciteerd wordt rechtmatig openbaar gemaakt is;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15a
  - number: 15a.1.2°
    text: |-
      het citeren in overeenstemming is met hetgeen naar de regels van het maatschappelijk verkeer redelijkerwijs
      geoorloofd is en aantal en omvang der geciteerde gedeelten door het te bereiken doel zijn gerechtvaardigd;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15a
  - number: 15a.1.3°
    text: |-
      [artikel 25][ref1] in acht wordt genomen; en


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 15a.1.4°
    text: voor zover redelijkerwijs mogelijk, de bron, waaronder de naam van de maker, op duidelijke wijze wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15a
  - number: 15a.2
    text: |-
      Onder citeren wordt in dit artikel mede begrepen het citeren in de vorm van persoverzichten uit in een dag-,
      nieuws- of weekblad of tijdschrift verschenen artikelen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15a
  - number: 15a.3
    text: Dit artikel is mede van toepassing op het citeren in een andere taal dan de oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15a
  - number: 15b
    text: |-
      Als inbreuk op het auteursrecht op een door of vanwege de openbare macht openbaar gemaakt werk van letterkunde,
      wetenschap of kunst, waarvan de openbare macht de maker of rechtverkrijgende is, wordt niet beschouwd verdere
      openbaarmaking of verveelvoudiging daarvan, tenzij het auteursrecht, hetzij in het algemeen bij wet, besluit of
      verordening, hetzij in een bepaald geval blijkens mededeling op het werk zelf of bij de openbaarmaking daarvan
      uitdrukkelijk is voorbehouden. Ook als een zodanig voorbehoud niet is gemaakt, behoudt de maker echter het
      uitsluitend recht, zijn werken, die door of vanwege de openbare macht zijn openbaar gemaakt, in een bundel verenigd
      te doen verschijnen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15b
  - number: 15c.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd het uitlenen
      als bedoeld in [artikel 12, eerste lid, onder 3°][ref1], van het geheel of een gedeelte van een exemplaar van
      het werk of van een verveelvoudiging daarvan die door de rechthebbende of met zijn toestemming in het verkeer
      is gebracht, mits degene die de uitlening verricht of doet verrichten een billijke vergoeding betaalt. De eerste
      zin is niet van toepassing op een werk als bedoeld in [artikel 10, eerste lid, onder 12°][ref2] tenzij dat
      werk onderdeel uitmaakt van een van gegevens voorziene informatiedrager en uitsluitend dient om die gegevens
      toegankelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '12'
        hoofdstuk: I
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 15c.2
    text: |-
      Instellingen van onderwijs en instellingen van onderzoek en de aan die instellingen verbonden bibliotheken en de
      Koninklijke Bibliotheek in haar hoedanigheid van onderzoeksinstelling zijn vrijgesteld van de betaling van een
      vergoeding voor uitlenen als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15c
  - number: 15c.3
    text: |-
      Openbare bibliotheekvoorzieningen, die in overwegende mate door gemeenten, provincies, het rijk of het openbaar
      lichaam Bonaire, Sint Eustatius of Saba worden gesubsidieerd of in stand gehouden, zijn voor het uitlenen van op
      basis van de [artikelen 15i][ref1] of [15j, eerste lid, onder 1° of 2°][ref2], omgezette werken of een onder
      [artikel 15k][ref3] door een toegelaten entiteit ingevoerd omgezet werk aan bij die voorzieningen ingeschreven
      personen met een handicap, vrijgesteld van betaling van de vergoeding, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel15k
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15i
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 15k
        hoofdstuk: I
        paragraaf: '6'
  - number: 15c.4
    text: |-
      De in het eerste lid bedoelde vergoeding is niet verschuldigd indien de betalingsplichtige kan aantonen dat de
      maker of diens rechtverkrijgende afstand heeft gedaan van het recht op een billijke vergoeding. De maker of diens
      rechtverkrijgende dient de afstand schriftelijk mee te delen aan de in de [artikelen 15d][ref1] en [15f][ref2]
      bedoelde rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15d
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15f
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15d
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15f
        hoofdstuk: I
        paragraaf: '6'
  - number: 15d
    text: |-
      De hoogte van de in [artikel 15c, eerste lid][ref1], bedoelde vergoeding wordt vastgesteld door een door Onze
      Minister van Justitie in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen aan te wijzen
      stichting waarvan het bestuur zodanig is samengesteld dat de belangen van de makers of hun rechtverkrijgenden
      en de ingevolge [artikel 15c, eerste lid][ref2], betalingsplichtigen op evenwichtige wijze worden behartigd. De
      voorzitter van het bestuur van deze stichting wordt benoemd door Onze Minister van Justitie in overeenstemming met
      Onze Minister van Onderwijs, Cultuur en Wetenschappen. Het aantal bestuursleden van deze stichting dient oneven
      te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15c
        hoofdstuk: I
        paragraaf: '6'
  - number: 15e
    text: |-
      Geschillen met betrekking tot de in [artikel 15c, eerste lid][ref1], bedoelde vergoeding worden in eerste aanleg
      bij uitsluiting beslist door de rechtbank Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15e
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15c
        hoofdstuk: I
        paragraaf: '6'
  - number: 15f.1
    text: |-
      De betaling van de in [artikel 15c][ref1] bedoelde vergoeding dient te geschieden aan een door Onze Minister
      van Justitie in overeenstemming met Onze Minister van Onderwijs, Cultuur en Wetenschappen aan te wijzen naar hun
      oordeel representatieve rechtspersoon, die met uitsluiting van anderen belast is met de inning en de verdeling
      van deze vergoeding. In aangelegenheden betreffende de vaststelling van de hoogte van de vergoeding en de
      inning daarvan alsmede de uitoefening van het uitsluitende recht vertegenwoordigt de in de vorige zin bedoelde
      rechtspersoon de rechthebbenden in en buiten rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15c
        hoofdstuk: I
        paragraaf: '6'
  - number: 15f.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, staat onder toezicht van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 15f.3
    text: |-
      De verdeling van de geïnde vergoedingen geschiedt overeenkomstig een reglement, dat is opgesteld door de
      rechtspersoon, bedoeld in het eerste lid, en dat is goedgekeurd door het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15f
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 15g
    text: |-
      Degene die tot betaling van de in [artikel 15c, eerste lid][ref1], bedoelde vergoeding verplicht is, is
      gehouden, voor zover geen ander tijdstip is overeengekomen, vóór 1 april van ieder kalenderjaar aan de in
      [artikel 15f, eerste lid][ref2], bedoelde rechtspersoon opgave te doen van het aantal rechtshandelingen, bedoeld
      in [artikel 15c][ref3]. Hij is voorts gehouden desgevraagd aan deze rechtspersoon onverwijld de bescheiden of
      andere informatiedragers ter inzage te geven, waarvan kennisneming noodzakelijk is voor de vaststelling van de
      verschuldigdheid en de hoogte van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15f
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel15c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15g
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15f
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 15c
        hoofdstuk: I
        paragraaf: '6'
  - number: 15h
    text: |-
      Tenzij anders overeengekomen, wordt niet als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap
      of kunst beschouwd het door middel van een besloten netwerk beschikbaar stellen van een werk dat onderdeel uitmaakt
      van verzamelingen van voor het publiek toegankelijke bibliotheken, onderwijsinstellingen en musea of archieven die
      niet het behalen van een direct of indirect economisch of commercieel voordeel nastreven, door middel van daarvoor
      bestemde terminals in de gebouwen van die instellingen aan individuele leden van het publiek voor onderzoek of
      privé-studie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15h
  - number: 15i.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd de
      verveelvoudiging of openbaarmaking die uitsluitend bestemd is voor mensen met een handicap, mits deze direct met
      de handicap verband houdt, van niet commerciële aard is en wegens die handicap noodzakelijk is, onverminderd het
      bepaalde in [artikel 15j][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15i
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
  - number: 15i.2
    text: |-
      Voor de verveelvoudiging of openbaarmaking, bedoeld in het eerste lid, is ten behoeve van de maker of diens
      rechtverkrijgenden een billijke vergoeding verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15i
  - number: 15j.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst, wordt niet beschouwd iedere
      handeling die noodzakelijk is voor:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15j
  - number: 15j.1.1°
    text: |-
      het omzetten van een gepubliceerd geschrift in een voor een leesgehandicapte toegankelijke vorm door een
      leesgehandicapte of een namens hem optredende persoon, mits de leesgehandicapte rechtmatig toegang heeft tot het
      gepubliceerde geschrift, het omgezette werk uitsluitend bestemd is voor gebruik door de leesgehandicapte en de
      integriteit van het gepubliceerde geschrift zoveel mogelijk geëerbiedigd wordt;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15j
  - number: 15j.1.2°
    text: |-
      het omzetten van een gepubliceerd geschrift in een voor een leesgehandicapte toegankelijke vorm door een toegelaten
      entiteit, mits de toegelaten entiteit rechtmatig toegang heeft tot het gepubliceerde geschrift, het omgezette werk
      uitsluitend bestemd is voor gebruik door een leesgehandicapte, en de integriteit van het gepubliceerde geschrift
      zoveel mogelijk geëerbiedigd wordt; en
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15j
  - number: 15j.1.3°
    text: |-
      het openbaar maken van een omgezet werk als bedoeld onder 2, door een toegelaten entiteit aan een leesgehandicapte
      woonachtig in of een andere toegelaten entiteit gevestigd in een lidstaat van de Europese Unie of een staat die
      partij is bij het Leesgehandicaptenverdrag, mits de openbaarmaking geschiedt met het oog op uitsluitend gebruik
      door de leesgehandicapte en plaatsvindt zonder winstoogmerk.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15j
  - number: 15j.2
    text: Bij overeenkomst kan niet worden afgeweken van het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15j
  - number: 15j.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat de in Nederland gevestigde toegelaten entiteit voor
      het omzetten of openbaar maken, bedoeld in het eerste lid, onder 2° en 3°, ten behoeve van de maker of diens
      rechtverkrijgenden een billijke vergoeding is verschuldigd. Daarbij kunnen nadere regels worden gegeven en
      voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15j
  - number: 15k
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd de invoer
      door een leesgehandicapte of een toegelaten entiteit van een omgezet werk door een toegelaten entiteit in een
      andere lidstaat van de Europese Unie of een staat die partij is bij het Leesgehandicaptenverdrag. Hier kan niet van
      worden afgeweken bij overeenkomst.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15k
  - number: 15l.1
    text: |-
      Een toegelaten entiteit die een omgezet werk grensoverschrijdend openbaar maakt op basis van
      [artikel 15j, eerste lid, onder 3°][ref1], dan wel invoert op basis van [artikel 15k][ref2], heeft beleid om te
      waarborgen dat zij:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15k
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15k
        hoofdstuk: I
        paragraaf: '6'
  - number: 15l.1.1°
    text: omgezette werken uitsluitend openbaar maakt aan leesgehandicapten of andere toegelaten entiteiten;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
  - number: 15l.1.2°
    text: |-
      passende maatregelen neemt om de ongeoorloofde verveelvoudiging of openbaarmaking van omgezette werken te
      ontmoedigen;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
  - number: 15l.1.3°
    text: |-
      getuigt van de nodige zorgvuldigheid bij, en registers bijhoudt van, de handelingen die zij uitvoert met
      gepubliceerde geschriften en omgezette werken; en
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
  - number: 15l.1.4°
    text: |-
      op haar website, in voorkomend geval, of via andere online- of offlinekanalen, informatie publiceert en
      actualiseert over de manier waarop zij voldoet aan de verplichtingen van het bepaalde onder 1° tot en met 3°;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
  - number: 15l.2
    text: |-
      Een toegelaten entiteit die een omgezet werk grensoverschrijdend openbaar maakt op basis van
      [artikel 15j, eerste lid, onder 3°][ref1], dan wel invoert op basis van [artikel 15k][ref2], verstrekt desgevraagd
      aan een leesgehandicapte, een andere toegelaten entiteit of de maker of diens rechtverkrijgenden:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15k
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15k
        hoofdstuk: I
        paragraaf: '6'
  - number: 15l.2.1°
    text: de lijst met omgezette werken, alsmede de beschikbare vormen; en
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
  - number: 15l.2.2°
    text: de naam en de contactgegevens van de toegelaten entiteiten waarmee zij omgezette werken heeft uitgewisseld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15l
  - number: 15m
    text: |-
      Voor de toepassing van de [artikelen 15j][ref1], [15k][ref2] en [15l][ref3] wordt verstaan onder: -
      *leesgehandicapte:* een persoon 1°. die blind is; 2°. met een visuele handicap die niet zodanig kan worden
      verbeterd dat de persoon het gezichtsvermogen krijgt dat wezenlijk gelijkwaardig is aan dat van een persoon zonder
      een dergelijke handicap en waardoor de persoon niet in staat is in wezenlijk dezelfde mate als een persoon zonder
      een dergelijke handicap gedrukte werken te lezen; 3°. met een waarnemings- of andere leeshandicap waardoor de
      persoon niet in staat is in wezenlijk dezelfde mate als een persoon zonder een dergelijke handicap gedrukte werken
      te lezen; of 4°. die anderszins, ten gevolge van een fysieke handicap, niet in staat is een boek vast te houden of
      te hanteren, dan wel scherp te zien of zijn ogen te bewegen in een mate die gewoonlijk voor het lezen noodzakelijk
      wordt geacht;
        - *gepubliceerd geschrift:* een werk van letterkunde, wetenschap of kunst in de vorm van een boek, dagblad, krant,
      tijdschrift of ander soort geschrift, notaties met inbegrip van bladmuziek en daarmee samenhangende illustraties,
      op om het even welke drager, met inbegrip van audioformaten, dat wordt beschermd door het auteursrecht en dat is
      openbaar gemaakt;
        - *omgezet werk:* een werk dat in een alternatieve vorm is omgezet waarmee dat werk voor een leesgehandicapte
      toegankelijk wordt, onder meer om de toegang tot het werk voor die leesgehandicapte even eenvoudig en gemakkelijk
      te maken als voor personen zonder leeshandicap;
        - *toegelaten entiteit:* een entiteit die door een lidstaat is gemachtigd of erkend om zonder winstoogmerk
      onderwijs, opleiding, aangepast lezen of toegang tot informatie aan leesgehandicapten te bieden. Hieronder wordt
      mede verstaan openbare instellingen of organisaties zonder winstoogmerk die leesgehandicapten dezelfde diensten
      aanbieden als een van hun hoofdactiviteiten, institutionele verplichtingen of in het kader van hun taken van
      openbaar belang;
        - *Leesgehandicaptenverdrag:* het op 27 juni 2013 te Marrakesh tot stand gekomen Verdrag van Marrakesh tot
      bevordering van de toegang tot gepubliceerde werken voor personen die blind zijn, visueel gehandicapt of anderszins
      een leeshandicap hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15k
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel15l
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel15m
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15k
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 15l
        hoofdstuk: I
        paragraaf: '6'
  - number: '16.1'
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd de
      verveelvoudiging of openbaarmaking van gedeelten ervan uitsluitend ter toelichting bij het onderwijs, voor zover
      dit door het beoogde, niet-commerciële doel wordt gerechtvaardigd, mits:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
  - number: 16.1.1°
    text: het werk waaruit is overgenomen rechtmatig openbaar gemaakt is;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
  - number: 16.1.2°
    text: |-
      het overnemen in overeenstemming is met hetgeen naar de regels van het maatschappelijk verkeer redelijkerwijs
      geoorloofd is;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
  - number: 16.1.3°
    text: |-
      [artikel 25][ref1] in acht wordt genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 16.1.4°
    text: Voor zover redelijkerwijs mogelijk, de bron, waaronder de naam van de maker, op duidelijke wijze wordt vermeld; en
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
  - number: 16.1.5°
    text: aan de maker of zijn rechtverkrijgenden een billijke vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
  - number: '16.2'
    text: |-
      Waar het geldt een kort werk of een werk als bedoeld in
      [artikel 10, eerste lid onder 6°., onder 9°. of onder 11°.][ref1] mag voor hetzelfde doel en onder dezelfde
      voorwaarden het gehele werk worden overgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: '16.3'
    text: |-
      Waar het het overnemen in een compilatiewerk betreft, mag van dezelfde maker niet meer worden overgenomen
      dan enkele korte werken of korte gedeelten van zijn werken, en waar het geldt werken als bedoeld in
      [artikel 10, eerste lid onder 6°., onder 9°. of onder 11°][ref1]. niet meer dan enkele van die werken en in
      zodanige verveelvoudiging, dat deze door haar grootte of door de werkwijze, volgens welke zij vervaardigd is, een
      duidelijk verschil vertoont met het oorspronkelijke met dien verstande, dat wanneer van deze werken er twee of meer
      verenigd openbaar zijn gemaakt, die verveelvoudiging slechts ten aanzien van een daarvan geoorloofd is.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: '16.4'
    text: |-
      De bepalingen van dit artikel zijn mede van toepassing ten aanzien van het overnemen in een andere taal dan de
      oorspronkelijke.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16
  - number: 16a
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd een korte
      opname, weergave en mededeling ervan in het openbaar in een foto-, film-, radio- of televisiereportage voor
      zover zulks voor het behoorlijk weergeven van de actuele gebeurtenis welke het onderwerp der reportage uitmaakt,
      gerechtvaardigd is en mits, voor zover redelijkerwijs mogelijk, de bron, waaronder de naam van de maker, duidelijk
      wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16a
  - number: 16b.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd de
      verveelvoudiging welke beperkt blijft tot enkele exemplaren en welke uitsluitend dient tot eigen oefening, studie
      of gebruik van de natuurlijke persoon die zonder direct of indirect commercieel oogmerk de verveelvoudiging
      vervaardigt of tot het verveelvoudigen uitsluitend ten behoeve van zichzelf opdracht geeft.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
  - number: 16b.2
    text: |-
      Waar het geldt een dag-, nieuws- of weekblad of een tijdschrift of een boek of de partituur of de partijen van een
      muziekwerk en de in die werken opgenomen andere werken, blijft die verveelvoudiging bovendien beperkt tot een klein
      gedeelte van het werk, behalve indien het betreft:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
  - number: 16b.2.a
    text: |-
      werken, waarvan naar redelijkerwijs mag worden aangenomen geen nieuwe exemplaren tegen betaling, in welke vorm ook,
      aan derden ter beschikking zullen worden gesteld;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
  - number: 16b.2.b
    text: in een dag-, nieuws- of weekblad of tijdschrift verschenen korte artikelen, berichten of andere stukken.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
  - number: 16b.3
    text: |-
      Waar het geldt een werk, als bedoeld bij [artikel 10, eerste lid, onder 6°][ref1], moet de verveelvoudiging
      door haar grootte of door de werkwijze, volgens welke zij vervaardigd is, een duidelijk verschil vertonen met het
      oorspronkelijke werk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 16b.4
    text: |-
      Indien een ingevolge dit artikel toegelaten verveelvoudiging heeft plaatsgevonden, mogen de vervaardigde exemplaren
      niet zonder toestemming van de maker of zijn rechtverkrijgenden aan derden worden afgegeven, tenzij de afgifte
      geschiedt ten behoeve van een rechterlijke of bestuurlijke procedure.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
  - number: 16b.5
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat voor de verveelvoudiging, bedoeld in het eerste lid, ten
      behoeve van de maker of diens rechtverkrijgenden een billijke vergoeding is verschuldigd. Daarbij kunnen nadere
      regelen worden gegeven en voorwaarden worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
  - number: 16b.6
    text: |-
      Dit artikel is niet van toepassing op het reproduceren, bedoeld in [artikel 16c][ref1], noch op het nabouwen van
      bouwwerken.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
  - number: 16c.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd het
      reproduceren van het werk of een gedeelte ervan op een voorwerp dat bestemd is om een werk ten gehore te brengen,
      te vertonen of weer te geven, mits het reproduceren geschiedt zonder direct of indirect commercieel oogmerk en
      uitsluitend dient tot eigen oefening, studie of gebruik van de natuurlijke persoon die de reproductie vervaardigt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
  - number: 16c.2
    text: |-
      Voor het reproduceren, bedoeld in het eerste lid, is ten behoeve van de maker of diens rechtverkrijgenden een
      billijke vergoeding verschuldigd. De verplichting tot betaling van de vergoeding rust op de fabrikant of de
      importeur van de voorwerpen, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
  - number: 16c.3
    text: |-
      Voor de fabrikant ontstaat de verplichting tot betaling van de vergoeding op het tijdstip dat de door hem
      vervaardigde voorwerpen in het verkeer kunnen worden gebracht. Voor de importeur ontstaat deze verplichting op het
      tijdstip van invoer.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
  - number: 16c.4
    text: |-
      De verplichting tot betaling van de vergoeding vervalt indien de ingevolge het tweede lid betalingsplichtige een
      voorwerp als bedoeld in het eerste lid uitvoert.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
  - number: 16c.5
    text: De vergoeding is slechts eenmaal per voorwerp verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
  - number: 16c.6
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gegeven met betrekking tot de voorwerpen ten
      aanzien waarvan de vergoeding, bedoeld in het tweede lid, verschuldigd is. Bij algemene maatregel van bestuur
      kunnen voorts nadere regelen worden gegeven en voorwaarden worden gesteld ter uitvoering van het bepaalde in dit
      artikel met betrekking tot de hoogte, verschuldigdheid en vorm van de billijke vergoeding.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
  - number: 16c.7
    text: |-
      Indien een ingevolge dit artikel toegelaten reproductie heeft plaatsgevonden, mogen voorwerpen als bedoeld in het
      eerste lid niet zonder toestemming van de maker of zijn rechtverkrijgenden aan derden worden afgegeven, tenzij de
      afgifte geschiedt ten behoeve van een rechterlijke of bestuurlijke procedure.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
  - number: 16c.8
    text: |-
      Dit artikel is niet van toepassing op het verveelvoudigen van een met elektronische middelen toegankelijke
      verzameling als bedoeld in [artikel 10, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 16d.1
    text: |-
      De betaling van de in [artikel 16c][ref1] bedoelde vergoeding dient te geschieden aan een door
      Onze Minister van Justitie aan te wijzen, naar zijn oordeel representatieve rechtspersoon, die
      belast is met de inning en de verdeling van deze vergoeding overeenkomstig een reglement, dat is
      opgesteld door deze rechtspersoon, en dat is goedgekeurd door het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref2]. In aangelegenheden betreffende
      de inning en vergoeding vertegenwoordigt deze rechtspersoon de makers of hun rechtverkrijgenden in en buiten
      rechte.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref2]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0014779
  - number: 16d.2
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, staat onder toezicht van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16d
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 16e
    text: |-
      De hoogte van de in [artikel 16c][ref1] bedoelde vergoeding wordt vastgesteld door een door Onze Minister van
      Justitie aan te wijzen stichting waarvan het bestuur zodanig is samengesteld dat de belangen van de makers of
      hun rechtverkrijgenden en de ingevolge [artikel 16c, tweede lid][ref2], betalingsplichtigen op evenwichtige wijze
      worden behartigd. De voorzitter van het bestuur van deze stichting wordt benoemd door Onze Minister van Justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
  - number: 16f
    text: |-
      Degene die tot betaling van de in [artikel 16][ref1] bedoelde vergoeding verplicht is, is gehouden onverwijld
      of binnen een met de in [artikel 16][ref2], bedoelde rechtspersoon overeengekomen tijdvak opgave te doen
      aan deze rechtspersoon van het aantal van de door hem geïmporteerde of vervaardigde voorwerpen, bedoeld in
      [artikel 16][ref3]. Hij is voorts gehouden aan deze rechtspersoon op diens aanvrage onverwijld die bescheiden ter
      inzage te geven, waarvan kennisneming noodzakelijk is voor de vaststelling van de verschuldigdheid en de hoogte van
      de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16d
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16f
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16d
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
  - number: 16g
    text: |-
      Geschillen met betrekking tot de vergoeding, bedoeld in de [artikelen 15i][ref1], [15j][ref2], [16][ref3],
      [16b][ref4], [16c][ref5] en [16h][ref6], worden in eerste aanleg bij uitsluiting beslist door de rechtbank Den
      Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel16b
      [ref5]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref6]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16g
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15i
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: '16'
        hoofdstuk: I
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0001886
        artikel: 16b
        hoofdstuk: I
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
  - number: 16ga.1
    text: |-
      De verkoper van de in [artikel 16c, eerste lid][ref1] bedoelde voorwerpen is gehouden aan de in
      [artikel 16d, eerste lid][ref2], bedoelde rechtspersoon op diens aanvraag onverwijld die bescheiden ter inzage te
      geven waarvan de kennisneming noodzakelijk is om vast te stellen of de in [artikel 16c, tweede lid][ref3], bedoelde
      vergoeding door de fabrikant of de importeur betaald is.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16d
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16ga
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16d
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
  - number: 16ga.2
    text: |-
      Indien de verkoper niet kan aantonen dat de vergoeding door de fabrikant of de importeur betaald is, is hij
      verplicht tot betaling daarvan aan de in [artikel 16d, eerste lid][ref1], bedoelde rechtspersoon, tenzij uit de in
      het eerste lid genoemde bescheiden blijkt wie de fabrikant of de importeur is.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16d
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16ga
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16d
        hoofdstuk: I
        paragraaf: '6'
  - number: 16h.1
    text: |-
      Een reprografische verveelvoudiging van een artikel in een dag-, nieuws- of weekblad of een tijdschrift of van een
      klein gedeelte van een boek en van de in zo'n werk opgenomen andere werken wordt niet beschouwd als inbreuk op het
      auteursrecht, mits voor deze verveelvoudiging een vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16h
  - number: 16h.2
    text: |-
      Een reprografische verveelvoudiging van het gehele werk wordt niet beschouwd als inbreuk op het auteursrecht,
      indien van een boek naar redelijkerwijs mag worden aangenomen geen nieuwe exemplaren tegen betaling, in welke vorm
      dan ook, aan derden ter beschikking worden gesteld, mits voor deze verveelvoudiging een vergoeding wordt betaald.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16h
  - number: 16h.3
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat ten aanzien van de verveelvoudiging van werken als
      bedoeld bij [artikel 10, eerste lid, onder 1°][ref1], van het in een of meer der voorgaande leden bepaalde mag
      worden afgeweken ten behoeve van de uitoefening van de openbare dienst, alsmede ten behoeve van de vervulling
      van taken waarmee in het algemeen belang werkzame instellingen zijn belast. Daarbij kunnen nadere regelen worden
      gegeven en nadere voorwaarden worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16h
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 16i
    text: |-
      De vergoeding, bedoeld in [artikel 16h][ref1], wordt berekend over iedere pagina waarop een werk als bedoeld in het
      eerste en tweede lid van dat artikel reprografisch verveelvoudigd is. Bij algemene maatregel van bestuur wordt de
      hoogte van de vergoeding vastgesteld en kunnen nadere regelen en voorwaarden worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16i
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
  - number: 16j
    text: |-
      Een met inachtneming van [artikel 16h][ref1] vervaardigde reprografische verveelvoudiging mag, zonder toestemming
      van de maker of zijn rechtverkrijgende, alleen worden afgegeven aan personen die in dezelfde onderneming,
      organisatie of instelling werkzaam zijn, tenzij de afgifte geschiedt ten behoeve van een rechterlijke of
      administratieve procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16j
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
  - number: 16k
    text: |-
      De verplichting tot betaling van de vergoeding, bedoeld in [artikel 16h][ref1], vervalt door verloop van drie
      jaar na het tijdstip waarop de verveelvoudiging vervaardigd is. De vergoeding is niet verschuldigd indien de
      betalingsplichtige kan aantonen dat de maker of diens rechtverkrijgende afstand heeft gedaan van het recht op de
      vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16k
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
  - number: 16l.1
    text: |-
      De betaling van de vergoeding, bedoeld in [artikel 16h][ref1], dient te geschieden aan een door Onze Minister van
      Justitie aan te wijzen, naar zijn oordeel representatieve rechtspersoon, die met uitsluiting van anderen belast is
      met de inning en de verdeling van deze vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16l
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
  - number: 16l.2
    text: |-
      In aangelegenheden betreffende de inning van de vergoeding vertegenwoordigt de rechtspersoon, bedoeld in het eerste
      lid, de makers of hun rechtverkrijgenden in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16l
  - number: 16l.3
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, hanteert voor de verdeling van de geïnde vergoedingen
      een reglement. Het reglement behoeft de goedkeuring van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16l
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 16l.4
    text: |-
      De rechtspersoon, bedoeld in het eerste lid, staat onder toezicht van het College van Toezicht, bedoeld in de
      [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16l
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 16l.5
    text: |-
      Het eerste en tweede lid vinden geen toepassing voorzover degene die tot betaling van de vergoeding verplicht is,
      kan aantonen dat hij met de maker of zijn rechtverkrijgende overeengekomen is dat hij de vergoeding rechtstreeks
      aan deze zal betalen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16l
  - number: 16m
    text: |-
      Degene die de vergoeding, bedoeld in [artikel 16h][ref1], dient te betalen aan de rechtspersoon, bedoeld in
      [artikel 16l][ref2], eerste lid, is gehouden aan deze opgave te doen van het totale aantal reprografische
      verveelvoudigingen dat hij per jaar maakt. De opgave, bedoeld in het eerste lid, behoeft niet gedaan te
      worden, indien per jaar minder dan een bij algemene maatregel van bestuur te bepalen aantal reprografische
      verveelvoudigingen gemaakt wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16l
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16m
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16l
        hoofdstuk: I
        paragraaf: '6'
  - number: 16n.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd de
      verveelvoudiging door voor het publiek toegankelijke bibliotheken, onderwijsinstellingen en musea of archieven
      die niet het behalen van een direct of indirect economisch of commercieel voordeel nastreven, indien die
      verveelvoudiging geschiedt met als enig doel:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16n
  - number: 16n.1.1°
    text: het exemplaar van het werk te restaureren;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16n
  - number: 16n.1.2°
    text: bij dreiging van verval van het exemplaar van het werk een verveelvoudiging daarvan te behouden voor de instelling;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16n
  - number: 16n.1.3°
    text: het werk raadpleegbaar te houden als de technologie waarmee het toegankelijk gemaakt kan worden in onbruik raakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16n
  - number: 16n.2
    text: 'De in het eerste lid bedoelde verveelvoudigingen zijn slechts geoorloofd indien:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16n
  - number: 16n.2.1°
    text: |-
      de exemplaren van het werk deel uitmaken van de verzameling van de voor het publiek toegankelijke bibliotheken,
      onderwijsinstellingen en musea of archieven die een beroep op deze beperking doen; en
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16n
  - number: 16n.2.2°
    text: |-
      [artikel 25][ref1] in acht wordt genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16n
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 16o.1
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst als bedoeld in
      [artikel 10, eerste lid, onder 1, 5 of 10][ref1], wordt niet beschouwd de reproductie of beschikbaarstelling door
      voor het publiek toegankelijke bibliotheken, onderwijsinstellingen en musea, alsmede archieven en instellingen voor
      cinematografisch of audiovisueel erfgoed die niet het behalen van een direct of indirect economisch of commercieel
      voordeel nastreven, van een voor het eerst in een lidstaat van de Europese Unie of in een staat die partij is bij
      de Overeenkomst betreffende de Europese Economische Ruimte openbaar gemaakt werk mits:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16o
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 16o.1.a
    text: het werk deel uitmaakt van de eigen verzameling van de hiervoor bedoelde organisaties;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16o
  - number: 16o.1.b
    text: |-
      de rechthebbende op het werk na een zorgvuldig onderzoek als bedoeld in [artikel 16p][ref1] niet is geïdentificeerd
      en opgespoord; en


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16q
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16o
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16q
        hoofdstuk: I
        paragraaf: '6'
  - number: 16o.1.c
    text: |-
      de reproductie en beschikbaarstelling geschiedt in het kader van de uitoefening van een publieke taak, in het
      bijzonder het behouden en restaureren van de werken en het verstrekken van voor culturele en onderwijsdoeleinden
      bestemde toegang tot de werken uit de eigen verzameling van de hiervoor bedoelde organisaties.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16o
  - number: 16o.2
    text: |-
      Indien aan twee of meer personen het auteursrecht toekomt op het werk en na een zorgvuldige onderzoek niet alle
      rechthebbenden zijn geïdentificeerd en opgespoord, kan het werk alleen worden gereproduceerd en beschikbaar gesteld
      indien de opgespoorde rechthebbende met betrekking tot de rechten waarover hij beschikt daarvoor toestemming
      verleent. De organisaties, genoemd in het eerste lid, vermelden bij de beschikbaarstelling de geïdentificeerde,
      maar niet opgespoorde rechthebbende(n).
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16o
  - number: 16o.3
    text: |-
      Een werk dat niet eerder is openbaar gemaakt, kan worden gereproduceerd en beschikbaar gesteld, overeenkomstig
      het eerste lid, indien het werk met toestemming van de rechthebbende in de in het eerste lid onder a bedoelde
      verzameling is opgenomen en redelijkerwijs aannemelijk is dat de rechthebbende zich niet tegen de reproductie en
      beschikbaarstelling zou verzetten.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16o
  - number: 16o.4
    text: |-
      De organisaties, genoemd in het eerste lid, mogen met de reproductie en beschikbaarstelling inkomsten generen
      op voorwaarde dat deze inkomsten uitsluitend dienen ter vergoeding van de kosten van de digitalisering en
      beschikbaarstelling van de in het eerste lid bedoelde werken.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16o
  - number: 16p.1
    text: |-
      Het zorgvuldig onderzoek naar de rechthebbende, als bedoeld in [artikel 16o, eerste lid, onder b][ref1], wordt
      uitgevoerd door voor ieder werk als bedoeld in artikel 16o, eerste lid, en voor ieder daarin opgenomen werk van
      letterkunde, wetenschap of kunst de voor de desbetreffende categorie van werken geschikte bronnen voor het opsporen
      van rechthebbenden te raadplegen. Op voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap worden bij
      algemene maatregel van bestuur regels gegeven ten aanzien van de bij het onderzoek te raadplegen bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
  - number: 16p.2
    text: |-
      Het onderzoek vindt plaats in de lidstaat waarin het werk voor het eerst is openbaar gemaakt. Voor filmwerken vindt
      het onderzoek plaats in de lidstaat waar de producent zijn zetel of gewone woonplaats heeft.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
  - number: 16p.3
    text: |-
      Voor een werk als bedoeld in [artikel 16o, derde lid][ref1], vindt het onderzoek plaats in de lidstaat waar
      de organisatie die het werk met toestemming van de rechthebbende in de eigen verzameling heeft opgenomen, is
      gevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
  - number: 16p.4
    text: |-
      Indien er aanwijzingen zijn dat informatie over de rechthebbende aanwezig is in een andere lidstaat, worden ook de
      in die lidstaat voor een zorgvuldig onderzoek voorgeschreven bronnen geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
  - number: 16p.5
    text: |-
      De organisaties, bedoeld in [artikel 16o, eerste lid][ref1], houden bij welke bronnen in het kader van het
      onderzoek zijn geraadpleegd en welke informatie hieruit is voortgekomen. De organisaties verstrekken de volgende
      gegevens aan een op voordracht van Onze Minister van Onderwijs, Cultuur en Wetenschap bij of krachtens algemene
      maatregel van bestuur aan te wijzen instantie, ten behoeve van doorgeleiding aan het Harmonisatiebureau voor de
      Interne Markt:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
  - number: 16p.5.a
    text: |-
      de resultaten van het zorgvuldig onderzoek dat door de organisaties is verricht en dat tot de conclusie heeft
      geleid dat het werk verweesd is;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
  - number: 16p.5.b
    text: de wijze waarop het werk zal worden gebruikt;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
  - number: 16p.5.c
    text: de contactgegevens van de organisaties; en
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
  - number: 16p.5.d
    text: voor zover van toepassing, iedere wijziging in de status van het werk.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
  - number: 16p.6
    text: |-
      Voor verweesde werken opgenomen in de databank van het Harmonisatiebureau, genoemd in het vijfde lid, is voor de
      reproductie en beschikbaarstelling als bedoeld in [artikel 16o, eerste lid][ref1], een zorgvuldig onderzoek als
      bedoeld in artikel 16o, eerste lid, onder b, niet noodzakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16p
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
  - number: 16q
    text: |-
      Het gebruik van een werk van letterkunde, wetenschap of kunst overeenkomstig artikel 16o, eerste lid,
      wordt beëindigd indien een rechthebbende met betrekking tot de rechten waar hij over beschikt, gebruik
      maakt van de mogelijkheid om de status van verweesd werk te beëindigen. De organisaties bedoeld in
      [artikel 16o, eerste lid][ref1], zijn aan de rechthebbende een billijke vergoeding verschuldigd voor het gebruik
      dat op grond van artikel 16o van het werk is gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16q
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
  - number: 16r
    text: |-
      Voor de toepassing van de [artikelen 16o][ref1], [16p][ref2], [16q][ref3] en [17][ref4] wordt onder
      beschikbaarstelling verstaan het, per draad of draadloos, beschikbaar stellen van een werk van letterkunde,
      wetenschap of kunst voor het publiek op zodanige wijze dat de leden van het publiek op een door hen gekozen
      individuele plaats en tijd toegang hebben tot het werk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16p
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16q
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel17
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel16r
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16p
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 16q
        hoofdstuk: I
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0001886
        artikel: '17'
        hoofdstuk: I
        paragraaf: '6'
  - number: '17'
    text: |-
      Als inbreuk op een werk van letterkunde, wetenschap of kunst als bedoeld in
      [artikel 10, eerste lid, onder 5 of 10][ref1], wordt niet beschouwd de reproductie of beschikbaarstelling door
      een publieke media-instelling als bedoeld in [Hoofdstuk 2 van de Mediawet 2008][ref2] van een in een lidstaat
      van de Europese Unie of in een staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte openbaar gemaakt werk als bedoeld in [artikel 16o, eerste lid, onder b][ref3], dat door de publieke media-
      instelling is geproduceerd vóór 1 januari 2003 en is gearchiveerd. De [artikelen 16o tot en met 16r][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0025028#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel16o
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0025028
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0001886
        artikel: 16o
        hoofdstuk: I
        paragraaf: '6'
  - number: 17a
    text: |-
      Bij algemene maatregel van bestuur kunnen in het algemeen belang regelen worden gesteld nopens de uitoefening van
      het recht van de maker van een werk of zijn rechtverkrijgenden met betrekking tot de openbaarmaking van een werk
      door uitzending van een radio- of televisieprogramma via radio of televisie, of een ander medium dat eenzelfde
      functie vervult. De algemene maatregel van bestuur, bedoeld in de eerste volzin, kan bepalen, dat zodanig werk
      in Nederland mag worden openbaar gemaakt zonder voorafgaande toestemming van de maker of zijn rechtverkrijgenden,
      indien de uitzending plaats vindt vanuit Nederland dan wel vanuit een staat die geen partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte. Zij die bevoegd zijn een werk zonder voorafgaande toestemming openbaar
      te maken, zijn desalniettemin verplicht de rechten van de maker, bedoeld in [artikel 25][ref1], te eerbiedigen en
      aan de maker of zijn rechtverkrijgenden een billijke vergoeding te betalen, welke bij gebreke van overeenstemming
      op vordering van de meest gerede partij door de rechter zal worden vastgesteld, die tevens het stellen van
      zekerheid kan bevelen. Het hiervoor bepaalde is niet van toepassing op het uitzenden van een in een radio- of
      televisieprogramma opgenomen werk door middel van een satelliet.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 17b.1
    text: |-
      Tenzij anders is overeengekomen, sluit de bevoegdheid tot openbaarmaking door uitzending van een radio- of
      televisieprogramma via radio of televisie, of een ander medium dat eenzelfde functie vervult niet in de bevoegdheid
      het werk vast te leggen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel17b
  - number: 17b.2
    text: |-
      De omroeporganisatie die bevoegd is tot de openbaarmaking, bedoeld in het eerste lid, is echter gerechtigd met
      haar eigen middelen en uitsluitend voor uitzending van haar eigen radio- of televisieprogramma's het ter uitzending
      bestemde werk tijdelijk vast te leggen. De omroeporganisatie, die dientengevolge gerechtigd is tot vastlegging, is
      desalniettemin verplicht de rechten van de maker van het werk, bedoeld in [artikel 25][ref1], te eerbiedigen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 17b.3
    text: |-
      Vastleggingen die met inachtneming van het tweede lid zijn vervaardigd en een uitzonderlijke documentaire waarde
      bezitten, mogen in officiële archieven worden bewaard.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel17b
  - number: 17c
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde of kunst wordt niet beschouwd de gemeentezang en de
      instrumentale begeleiding daarvan tijdens een eredienst.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel17c
  - number: 17d
    text: |-
      Een krachtens [artikel 15j, derde lid][ref1], [artikel 16b, vijfde lid][ref2], [artikel 16c, zesde lid][ref3],
      [artikel 16h, derde lid][ref4], [artikel 16m, tweede lid][ref5], [artikel 17a][ref6],
      [artikel 29a, vierde lid][ref7], of artikel 29a, vijfde lid, vastgestelde algemene maatregel van bestuur of een
      wijziging daarvan treedt niet eerder in werking dan acht weken na datum van uitgifte van het Staatsblad waarin hij
      is geplaatst. Van de plaatsing wordt onverwijld mededeling gedaan aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16b
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
      [ref5]: https://wetten.overheid.nl/BWBR0001886#Artikel16m
      [ref6]: https://wetten.overheid.nl/BWBR0001886#Artikel17a
      [ref7]: https://wetten.overheid.nl/BWBR0001886#Artikel29a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16b
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0001886
        artikel: 16m
        hoofdstuk: I
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0001886
        artikel: 17a
        hoofdstuk: I
        paragraaf: '6'
      - id: ref7
        bwb_id: BWBR0001886
        artikel: 29a
        hoofdstuk: II
  - number: '18'
    text: |-
      Als inbreuk op het auteursrecht op een werk als bedoeld in [artikel 10, eerste lid, onder 6°][ref1], of op een
      werk, betrekkelijk tot de bouwkunde als bedoeld in [artikel 10, eerste lid, onder 8°][ref2], dat is gemaakt om
      permanent in openbare plaatsen te worden geplaatst, wordt niet beschouwd de verveelvoudiging of openbaarmaking van
      afbeeldingen van het werk zoals het zich aldaar bevindt. Waar het betreft het overnemen in een compilatiewerk, mag
      van dezelfde maker niet meer worden overgenomen dan enkele van zijn werken.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 18a
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd de
      incidentele verwerking ervan als onderdeel van ondergeschikte betekenis in een ander werk.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel18a
  - number: 18b
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd de
      openbaarmaking of verveelvoudiging ervan in het kader van een karikatuur, parodie of pastiche mits het gebruik in
      overeenstemming is met hetgeen naar de regels van het maatschappelijk verkeer redelijkerwijs geoorloofd is.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel18b
  - number: '19.1'
    text: |-
      Als inbreuk op het auteursrecht op een portret wordt niet beschouwd de verveelvoudiging daarvan door, of ten
      behoeve van, den geportretteerde of, na diens overlijden, zijne nabestaanden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bevat eene zelfde afbeelding het portret van twee of meer personen, dan staat die verveelvoudiging aan ieder hunner
      ten aanzien van andere portretten dan zijn eigen slechts vrij met toestemming van die andere personen of, gedurende
      tien jaren na hun overlijden, van hunne nabestaanden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel19
  - number: '19.3'
    text: |-
      Ten aanzien van een fotografisch portret wordt mede niet als inbreuk op het auteursrecht beschouwd het openbaar
      maken daarvan in een nieuwsblad of tijdschrift door of met toestemming van een der personen, in het eerste lid
      genoemd, mits daarbij de naam des makers, voor zoover deze op of bij het portret is aangeduid, vermeld wordt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel19
  - number: '19.4'
    text: |-
      Dit artikel is slechts van toepassing ten aanzien van portretten, welke vervaardigd zijn ingevolge eene opdracht,
      door of vanwege de geportretteerde personen, of te hunnen behoeve aan den maker gegeven.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel19
  - number: '20.1'
    text: |-
      Tenzij anders is overeengekomen is degene, wien het auteursrecht op een portret toekomt, niet bevoegd dit openbaar
      te maken zonder toestemming van den geportretteerde of, gedurende tien jaren na diens overlijden, van diens
      nabestaanden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel20
  - number: '20.2'
    text: |-
      Bevat eene zelfde afbeelding het portret van twee of meer personen, dan is ten aanzien van de gansche afbeelding de
      toestemming vereischt van alle geportretteerden of, gedurende tien jaren na hun overlijden, van hunne nabestaanden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel20
  - number: '20.3'
    text: Het laatste lid van het voorgaande artikel is van toepassing.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel20
  - number: '21'
    text: |-
      Is een portret vervaardigd zonder daartoe strekkende opdracht, den maker door of vanwege den geportretteerde,
      of te diens behoeve, gegeven, dan is openbaarmaking daarvan door dengene, wien het auteursrecht daarop toekomt,
      niet geoorloofd, voor zoover een redelijk belang van den geportretteerde of, na zijn overlijden, van een zijner
      nabestaanden zich tegen de openbaarmaking verzet.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel21
  - number: '22.1'
    text: |-
      In het belang van de openbare veiligheid alsmede ter opsporing van strafbare feiten mogen afbeeldingen van welke
      aard ook door of vanwege de justitie worden verveelvoudigd of openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel22
  - number: '22.2'
    text: |-
      Als inbreuk op het auteursrecht op een werk van letterkunde, wetenschap of kunst wordt niet beschouwd het overnemen
      ervan ten behoeve van de openbare veiligheid of om het goede verloop van een bestuurlijke, parlementaire of
      gerechtelijke procedure of de berichtgeving daarover te waarborgen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel22
  - number: '23'
    text: |-
      Tenzij anders overeengekomen, is de eigenaar, bezitter of houder van een teken-, schilder-, bouw- of beeldhouwwerk
      of een werk van toegepaste kunst bevoegd dat werk te verveelvoudigen of openbaar te maken voor zover dat
      noodzakelijk is voor openbare tentoonstelling of openbare verkopen van dat werk, een en ander met uitsluiting van
      enig ander commercieel gebruik.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel23
  - number: '24'
    text: |-
      Tenzij anders is overeengekomen blijft de maker van eenig schilderwerk, niettegenstaande de overdracht van zijn
      auteursrecht, bevoegd gelijke schilderwerken te vervaardigen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel24
  - number: 24a.1
    text: |-
      Als inbreuk op het auteursrecht op een verzameling als bedoeld in [artikel 10, derde lid][ref1], wordt niet
      beschouwd de verveelvoudiging, vervaardigd door de rechtmatige gebruiker van de verzameling, die noodzakelijk is om
      toegang te verkrijgen tot en normaal gebruik te maken van de verzameling.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel24a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 24a.2
    text: |-
      Indien de rechtmatige gebruiker slechts gerechtigd is tot het gebruik van een deel van de verzameling geldt het
      eerste lid slechts voor de toegang tot en het normaal gebruik van dat deel.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel24a
  - number: 24a.3
    text: Bij overeenkomst kan niet ten nadele van de rechtmatige gebruiker worden afgeweken van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel24a
  - number: '25.1'
    text: 'De maker van een werk heeft, zelfs nadat hij zijn auteursrecht heeft overgedragen, de volgende rechten:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: 25.1.a
    text: |-
      het recht zich te verzetten tegen openbaarmaking van het werk zonder vermelding van zijn naam of andere aanduiding
      als maker, tenzij het verzet zou zijn in strijd met de redelijkheid;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: 25.1.b
    text: |-
      het recht zich te verzetten tegen de openbaarmaking van het werk onder een andere naam dan de zijne, alsmede tegen
      het aanbrengen van enige wijziging in de benaming van het werk of in de aanduiding van de maker, voor zover deze op
      of in het werk voorkomen, dan wel in verband daarmede zijn openbaar gemaakt;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: 25.1.c
    text: |-
      het recht zich te verzetten tegen elke andere wijziging in het werk, tenzij deze wijziging van zodanige aard is,
      dat het verzet zou zijn in strijd met de redelijkheid;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: 25.1.d
    text: |-
      het recht zich te verzetten tegen elke misvorming, verminking of andere aantasting van het werk, welke nadeel zou
      kunnen toebrengen aan de eer of de naam van de maker of aan zijn waarde in deze hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: '25.2'
    text: |-
      De in het eerste lid genoemde rechten komen, na het overlijden van de maker tot aan het vervallen van het
      auteursrecht, toe aan de door de maker bij uiterste wilsbeschikking aangewezene.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: '25.3'
    text: |-
      Van het recht, in het eerste lid, onder *a* genoemd kan afstand worden gedaan. Van de rechten onder *b* en *c*
      genoemd kan afstand worden gedaan voor zover het wijzigingen in het werk of in de benaming daarvan betreft.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: '25.4'
    text: |-
      Heeft de maker van het werk het auteursrecht overgedragen dan blijft hij bevoegd in het werk zodanige wijzigingen
      aan te brengen als hem naar de regels van het maatschappelijk verkeer te goeder trouw vrijstaan. Zolang het
      auteursrecht voortduurt komt gelijke bevoegdheid toe aan de door de maker bij uiterste wilsbeschikking aangewezene,
      als redelijkerwijs aannemelijk is, dat ook de maker die wijzigingen zou hebben goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25
  - number: 25a
    text: |-
      In deze paragraaf worden onder nabestaanden verstaan de ouders, de echtgenoot of de geregistreerde partner en de
      kinderen. De aan de nabestaanden toekomende bevoegdheden kunnen zelfstandig door ieder van hen worden uitgeoefend.
      Bij verschil van mening kan de rechter een voor hen bindende beslissing geven.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25a
  - number: 25b.1
    text: |-
      Dit hoofdstuk is van toepassing op een overeenkomst die de verlening van exploitatiebevoegdheid ten aanzien van
      het auteursrecht van de maker aan een wederpartij tot hoofddoel heeft, tenzij artikel 3.28 van het Benelux-verdrag
      inzake de Intellectuele Eigendom (merken en tekeningen of modellen) van toepassing is.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25b
  - number: 25b.2
    text: |-
      [Artikel 25f, eerste en tweede lid][ref1], is van toepassing op een overeenkomst waarbij de maker het auteursrecht
      geheel of gedeeltelijk overdraagt of waarbij door de maker een exclusieve licentie is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25f
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 25f
        hoofdstuk: Ia
  - number: 25b.3
    text: |-
      Dit hoofdstuk is niet van toepassing op de maker als bedoeld in de [artikelen 7][ref1] en [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel8
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 25b.4
    text: |-
      Dit hoofdstuk is van overeenkomstige toepassing op de natuurlijke persoon die het auteursrecht als erfgenaam of
      legataris van de maker heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25b
  - number: 25c.1
    text: |-
      De maker heeft recht op een in de overeenkomst te bepalen billijke vergoeding voor de verlening van
      exploitatiebevoegdheid.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25c
  - number: 25c.2
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap kan, een bij algemene maatregel van bestuur, op voordracht van
      Onze voornoemde Minister, aan te wijzen adviesorgaan gehoord, de hoogte van een billijke vergoeding vaststellen
      voor een specifieke branche en voor een bepaalde periode na overleg met Onze Minister van Veiligheid en Justitie.
      De vaststelling van een billijke vergoeding geschiedt met inachtneming van het belang van het behoud van de
      culturele diversiteit, de toegankelijkheid van cultuur, een doelstelling van sociaal beleid en het belang van de
      consument.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25c
  - number: 25c.3
    text: |-
      Onze Minister van Onderwijs, Cultuur en Wetenschap gaat alleen over tot vaststelling als bedoeld in het tweede lid
      op gezamenlijk verzoek van een in de desbetreffende branche bestaande vereniging van makers en een exploitant of
      een vereniging van exploitanten. Het verzoek bevat een gezamenlijk gedragen advies inzake een billijke vergoeding,
      alsmede een duidelijke afbakening van de branche waarop het verzoek betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25c
  - number: 25c.4
    text: |-
      Een vereniging als bedoeld in het derde lid is representatief en onafhankelijk. Uit de statuten van de vereniging
      blijkt dat zij tot doel heeft Onze Minister van Onderwijs, Cultuur en Wetenschap een advies als bedoeld in het
      derde lid uit te brengen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25c
  - number: 25c.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld in verband met de indiening
      van het verzoek door verenigingen van makers en exploitanten en de vaststelling van een billijke vergoeding door de
      Minister van Onderwijs, Cultuur en Wetenschap.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25c
  - number: 25c.6
    text: |-
      Indien de maker exploitatiebevoegdheden heeft verleend ten aanzien van een exploitatie op een ten tijde van
      sluiting van de overeenkomst nog onbekende wijze en de wederpartij gaat hiertoe over, is hij de maker hiervoor
      een aanvullende billijke vergoeding verschuldigd. Is de bevoegdheid door de wederpartij van de maker overgedragen
      aan een derde die tot de bedoelde exploitatie overgaat, dan kan de maker de aanvullende billijke vergoeding van de
      derde vorderen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25c
  - number: 25d.1
    text: |-
      De maker kan in rechte een aanvullende billijke vergoeding vorderen van zijn wederpartij, indien de overeengekomen
      vergoeding gelet op de wederzijdse prestaties een ernstige onevenredigheid vertoont in verhouding tot de opbrengst
      van de exploitatie van het werk.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25d
  - number: 25d.2
    text: |-
      Indien de ernstige onevenredigheid tussen de vergoeding van de maker en de opbrengst van de exploitatie van het
      werk is ontstaan nadat het auteursrecht door de wederpartij van de maker aan een derde is overgedragen, kan de
      maker de vordering als bedoeld in het eerste lid tegen de derde instellen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25d
  - number: 25e.1
    text: |-
      De maker kan de overeenkomst geheel of gedeeltelijk ontbinden indien de wederpartij het auteursrecht op het werk
      niet binnen een redelijke termijn na het sluiten van de overeenkomst in voldoende mate exploiteert of, na het
      aanvankelijk verrichten van exploitatiehandelingen, het auteursrecht niet langer in voldoende mate exploiteert.
      De voorgaande zin is niet van toepassing indien het aan de maker is toe te rekenen dat het auteursrecht binnen de
      termijn niet in voldoende mate wordt geëxploiteerd of indien de wederpartij een zodanig zwaarwichtig belang heeft
      bij instandhouding van de overeenkomst dat het belang van de maker daarvoor naar maatstaven van redelijkheid en
      billijkheid moet wijken.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25e
  - number: 25e.2
    text: |-
      Indien het auteursrecht aan meerdere makers toebehoort en de bijdrage van de maker geen scheidbaar werk vormt, kan
      de maker de overeenkomst alleen ontbinden met instemming van de andere makers. Indien een maker zijn instemming
      onthoudt en de overige makers hierdoor onevenredig worden benadeeld, kan de ontbinding van de overeenkomst
      uitsluitend in rechte geschieden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25e
  - number: 25e.3
    text: |-
      Voorzover exploitatie door de wederpartij niet blijvend onmogelijk is, ontstaat de bevoegdheid tot ontbinding van
      de overeenkomst pas nadat de maker aan de wederpartij schriftelijk een redelijke termijn heeft gegund het werk
      alsnog in voldoende mate te exploiteren en exploitatie binnen deze termijn uitblijft.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25e
  - number: 25e.4
    text: |-
      Op verzoek van de maker verstrekt de wederpartij voor het verstrijken van de termijn bedoeld in het derde lid hem
      een schriftelijke opgave van de omvang van de exploitatie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25e
  - number: 25e.5
    text: |-
      In overeenstemming met [artikel 6:267 BW][ref1] vindt ontbinding van de overeenkomst plaats door een schriftelijke
      verklaring van de maker aan de wederpartij. Op vordering van de maker kan de ontbinding van de overeenkomst ook
      door de rechter worden uitgesproken.


      [ref1]: https://wetten.overheid.nl/BWBR0005289#Artikel267
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25e
    references:
      - id: ref1
        bwb_id: BWBR0005289
        artikel: '267'
  - number: 25e.6
    text: |-
      Indien het auteursrecht door de wederpartij van de maker is overgedragen aan een derde, kan de maker zijn uit
      de ontbinding voortvloeiende rechten ook tegen deze derde geldend maken, nadat hij deze zo spoedig mogelijk
      schriftelijk van de ontbinding mededeling heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25e
  - number: 25e.7
    text: |-
      Indien de wederpartij of de derde niet binnen een hem gestelde redelijke termijn tot teruglevering van het
      auteursrecht overgaat, kan de rechter op vordering van de maker een in de gegeven omstandigheden redelijk bedrag
      vaststellen dat de wederpartij dan wel de derde aan de maker dient te vergoeden, naast de mogelijk aan de maker
      verschuldigde schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25e
  - number: 25f.1
    text: |-
      Een beding dat voor een onredelijk lange of onvoldoende bepaalde termijn aanspraken op de exploitatie van
      toekomstige werken van de maker inhoudt, is vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25f
  - number: 25f.2
    text: |-
      Een beding dat, gelet op de aard en inhoud van de overeenkomst, de wijze waarop de overeenkomst tot stand is
      gekomen, de wederzijds kenbare belangen van partijen of de overige omstandigheden van het geval, voor de maker
      onredelijk bezwarend is, is vernietigbaar.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25f
  - number: 25f.3
    text: |-
      Indien door de wederpartij is bedongen dat de overeenkomst tussentijds kan worden opgezegd, geldt deze bevoegdheid
      onder gelijke voorwaarden eveneens voor de maker.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25f
  - number: 25fa
    text: |-
      De maker van een kort werk van wetenschap waarvoor het onderzoek geheel of gedeeltelijk met Nederlandse publieke
      middelen is bekostigd, heeft het recht om dat werk na verloop van een redelijke termijn na de eerste openbaarmaking
      ervan, om niet beschikbaar te stellen voor het publiek, mits de bron van de eerste openbaarmaking daarbij op
      duidelijke wijze wordt vermeld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25fa
  - number: 25g.1
    text: |-
      Onze Minister van Veiligheid en Justitie kan een geschillencommissie aanwijzen voor de beslechting
      van geschillen tussen een maker en zijn wederpartij of een derde inzake de toepassing van
      [artikel 25c, eerste en zesde lid][ref1], [25d][ref2], [25e][ref3] of [25f][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel25d
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel25e
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel25f
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25g
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 25c
        hoofdstuk: Ia
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 25d
        hoofdstuk: Ia
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 25e
        hoofdstuk: Ia
      - id: ref4
        bwb_id: BWBR0001886
        artikel: 25f
        hoofdstuk: Ia
  - number: 25g.2
    text: |-
      Wordt het geschil niet binnen drie maanden nadat afschrift van de uitspraak van de geschillencommissie aan
      partijen werd verzonden bij de rechter aanhangig gemaakt, dan wordt hetgeen in de uitspraak is vastgesteld na het
      verstrijken van deze termijn geacht te zijn overeengekomen tussen partijen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25g
  - number: 25g.3
    text: |-
      Een geschil kan ook ten behoeve van makers aanhangig worden gemaakt door een stichting of vereniging met volledige
      rechtsbevoegdheid voorzover zij de belangen van makers ingevolge haar statuten behartigt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25g
  - number: 25g.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de financiering,
      samenstelling, inrichting, procedures, bekostiging, werkwijze van en toezicht op de geschillencommissie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25g
  - number: 25h.1
    text: Van het bepaalde in dit hoofdstuk kan door de maker geen afstand worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25h
  - number: 25h.2
    text: 'Ongeacht het recht dat de overeenkomst beheerst, zijn de bepalingen van dit hoofdstuk van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25h
  - number: 25h.2.a
    text: de overeenkomst bij gebreke van een rechtskeuze zou worden beheerst door Nederlands recht, of;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25h
  - number: 25h.2.b
    text: de exploitatiehandelingen geheel of in overwegende mate in Nederland plaatsvinden of dienen plaats te vinden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel25h
  - number: '26'
    text: |-
      Indien aan twee of meer personen een gemeenschappelijk auteursrecht op een zelfde werk toekomt, kan, tenzij anders
      is overeengekomen, de handhaving van dit recht door ieder hunner geschieden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26
  - number: 26a.1
    text: |-
      Het recht om toestemming te verlenen voor de gelijktijdige, ongewijzigde en onverkorte uitzending
      van een in een radio- of televisieprogramma opgenomen werk door een omroepnetwerk als bedoeld in
      [artikel 1.1 van de Mediawet 2008][ref1] kan uitsluitend worden uitgeoefend door rechtspersonen die zich ingevolge
      hun statuten ten doel stellen de belangen van rechthebbenden door de uitoefening van het aan hen toekomende
      hiervoor bedoelde recht te behartigen.


      [ref1]: https://wetten.overheid.nl/BWBR0025028#Artikel1
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26a
    references:
      - id: ref1
        bwb_id: BWBR0025028
        artikel: '1'
  - number: 26a.2
    text: |-
      De in het eerste lid bedoelde rechtspersonen zijn ook bevoegd de belangen te behartigen van rechthebbenden
      die daartoe geen opdracht hebben gegeven, indien het betreft de uitoefening van dezelfde rechten als in de
      statuten vermeld. Indien meerdere rechtspersonen zich blijkens hun statuten de behartiging van de belangen van
      dezelfde categorie rechthebbenden ten doel stellen, kan de rechthebbende een van hen aanwijzen als bevoegd tot
      de behartiging van zijn belangen. Voor rechthebbenden die geen opdracht hebben gegeven als bedoeld in de tweede
      zin gelden de rechten en verplichtingen die voortvloeien uit een overeenkomst die een tot de uitoefening van
      dezelfde rechten bevoegde rechtspersoon heeft gesloten met betrekking tot de in het eerste lid bedoelde uitzending,
      onverkort.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26a
  - number: 26a.3
    text: |-
      Vorderingen jegens de in het eerste lid bedoelde rechtspersoon terzake van de door deze geïnde gelden vervallen
      door verloop van drie jaren na de aanvang van de dag volgende op die waarop de in het eerste lid bedoelde
      uitzending heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26a
  - number: 26a.4
    text: |-
      Dit artikel is niet van toepassing op rechten als bedoeld in het eerste lid die toekomen aan een omroeporganisatie
      met betrekking tot haar eigen uitzendingen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26a
  - number: 26b
    text: |-
      Partijen zijn verplicht de onderhandelingen over de toestemming voor de gelijktijdige, ongewijzigde en onverkorte
      uitzending, bedoeld in [artikel 26a, eerste lid][ref1], te goeder trouw te voeren en niet zonder geldige reden te
      verhinderen of te belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel26a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 26a
        hoofdstuk: II
  - number: 26c.1
    text: |-
      Indien over de gelijktijdige, ongewijzigde en onverkorte uitzending, bedoeld in [artikel 26][ref1], geen
      overeenstemming kan worden bereikt, kan iedere partij een beroep doen op een of meer bemiddelaars. De bemiddelaars
      worden zodanig geselecteerd dat over hun onafhankelijkheid en onpartijdigheid in redelijkheid geen twijfel kan
      bestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel26a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 26a
        hoofdstuk: II
  - number: 26c.2
    text: |-
      De bemiddelaars verlenen bijstand bij het voeren van de onderhandelingen en zijn bevoegd aan de partijen
      voorstellen te betekenen. Tot drie maanden na de dag van ontvangst van de voorstellen van de bemiddelaars kan een
      partij zijn bezwaren tegen deze voorstellen betekenen aan de andere partij. De voorstellen van de bemiddelaars
      binden de partijen, tenzij binnen de in de vorige zin bedoelde termijn door een van hen bezwaren zijn betekend. De
      voorstellen en de bezwaren worden aan de partijen betekend overeenkomstig het bepaalde in de [eerste titel, zesde
      afdeling, van het eerste boek van het Wetboek van Burgerlijke Rechtsvordering](onbekend).
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26c
  - number: 26d
    text: |-
      De rechter kan op vordering van de maker, tussenpersonen wier diensten door derden worden gebruikt om inbreuk op
      het auteursrecht te maken, bevelen de diensten die worden gebruikt om die inbreuk te maken, te staken.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26d
  - number: 26e
    text: |-
      De voorzieningenrechter kan op vordering van de maker of zijn rechtverkrijgende tijdelijke voortzetting van
      de vermeende inbreuk toestaan onder de voorwaarde dat zekerheid wordt gesteld voor vergoeding van de door de
      maker of zijn rechtverkrijgende geleden schade. Onder dezelfde voorwaarden kan de rechter voortzetting van de
      dienstverlening door de tussenpersoon als bedoeld in [artikel 26d][ref1] toestaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel26d
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel26e
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 26d
        hoofdstuk: II
  - number: '27.1'
    text: |-
      Niettegenstaande de gehele of gedeeltelijke overdracht van zijn auteursrecht blijft de maker bevoegd een
      rechtsvordering ter verkrijging van schadevergoeding in te stellen tegen degene, die inbreuk op het auteursrecht
      heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel27
  - number: '27.2'
    text: In passende gevallen kan de rechter de schadevergoeding vaststellen als een forfaitair bedrag.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel27
  - number: '27.3'
    text: |-
      De in het eerste lid bedoelde rechtsvordering ter verkrijging van schadevergoeding wegens inbreuk op het
      auteursrecht komt na het overlijden van de maker toe aan zijn erfgenamen of legatarissen tot aan het vervallen van
      het auteursrecht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel27
  - number: 27a.1
    text: |-
      Naast schadevergoeding kan de maker of zijn rechtverkrijgende vorderen dat degene die inbreuk op het auteursrecht
      heeft gemaakt, wordt veroordeeld de door deze ten gevolge van de inbreuk genoten winst af te dragen en
      dienaangaande rekening en verantwoording af te leggen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel27a
  - number: 27a.2
    text: |-
      De maker of diens rechtverkrijgende kan de in het eerste lid bedoelde vorderingen of een van deze ook namens of
      mede namens een licentienemer instellen, onverminderd de bevoegdheid van deze laatste in een al of niet namens hem
      of mede namens hem door de maker of diens rechtverkrijgende ingesteld geding tussen te komen om rechtstreeks de
      door hem geleden schade vergoed te krijgen of om zich een evenredig deel van de door de verweerder af te dragen
      winst te doen toewijzen. De in het eerste lid bedoelde vorderingen of een van deze kan een licentienemer slechts
      instellen als hij de bevoegdheid daartoe van de maker of diens rechtverkrijgende heeft bedongen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel27a
  - number: '28.1'
    text: |-
      Het auteursrecht geeft aan de gerechtigde de bevoegdheid om roerende zaken, die geen registergoederen zijn en die
      in strijd met dat recht zijn openbaar gemaakt of een niet geoorloofde verveelvoudiging vormen of die materialen of
      werktuigen zijn die voornamelijk bij de schepping of vervaardiging van deze zaken zijn gebruikt, als zijn eigendom
      op te eisen dan wel onttrekking aan het verkeer, vernietiging of onbruikbaarmaking daarvan te vorderen. Teneinde
      tot vernietiging of onbruikbaarmaking over te gaan, kan de gerechtigde de afgifte van deze zaken vorderen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: '28.2'
    text: 'Gelijke bevoegdheid tot opeising bestaat:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: 28.2.a
    text: |-
      ten aanzien van het bedrag van de toegangsgelden betaald voor het bijwonen van een voordracht, een op- of
      uitvoering of een tentoonstelling of voorstelling, waardoor inbreuk op het auteursrecht wordt gemaakt;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: 28.2.b
    text: |-
      ten aanzien van andere gelden waarvan aannemelijk is dat zij zijn verkregen door of als gevolg van inbreuk op het
      auteursrecht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: '28.3'
    text: |-
      De bepalingen van het [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende beslag en executie tot afgifte
      van roerende zaken die geen registergoederen zijn, zijn van toepassing. Bij samenloop met een ander beslag gaat
      degene die beslag heeft gelegd krachtens dit artikel voor.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '28.4'
    text: |-
      De maatregelen, bedoeld in het eerste lid, worden op kosten van de verweerder uitgevoerd, tenzij bijzondere redenen
      dit beletten.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: '28.5'
    text: |-
      Ten aanzien van onroerende zaken, schepen of luchtvaartuigen, waardoor inbreuk op een auteursrecht wordt gemaakt,
      kan de rechter op vordering van de gerechtigde gelasten dat de verweerder daarin zodanige wijziging zal aanbrengen
      dat de inbreuk wordt opgeheven.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: '28.6'
    text: |-
      Tenzij anders is overeengekomen, heeft de licentienemer het recht de uit het eerste tot en met vijfde lid
      voortvloeiende bevoegdheden uit te oefenen, voor zover deze strekken tot bescherming van de rechten waarvan de
      uitoefening hem is toegestaan.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: '28.7'
    text: |-
      Gelijke bevoegdheid als bedoeld in het eerste lid bestaat ten aanzien van de inrichtingen, producten en onderdelen
      als bedoeld in [artikel 29a][ref1] alsmede de reproducties van werken als bedoeld in [artikel 29b][ref2], die geen
      registergoederen zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel29a
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel29b
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 29a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 29b
        hoofdstuk: II
  - number: '28.8'
    text: |-
      Bij de beoordeling van de maatregelen die de gerechtigde of diens licentienemer kan vorderen ingevolge de
      bevoegdheden, genoemd in het eerste, tweede en zevende lid, houdt de rechter rekening met de noodzakelijke
      evenredigheid tussen de ernst van de inbreuk en de gevorderde maatregelen en met de belangen van derden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: '28.9'
    text: |-
      De rechter kan op vordering van de gerechtigde degene die inbreuk op diens recht heeft gemaakt, bevelen al hetgeen
      hem bekend is omtrent de herkomst en distributiekanalen van de goederen of diensten die inbreuk maken, aan de
      gerechtigde mee te delen en alle daarop betrekking hebbende gegevens aan deze te verstrekken. Onder dezelfde
      voorwaarden kan dit bevel worden gegeven aan een derde die op commerciële schaal inbreukmakende goederen in zijn
      bezit heeft of gebruikt, die op commerciële schaal diensten verleent die bij de inbreuk worden gebruikt, of die
      door een van deze derden is aangewezen als zijnde betrokken bij de productie, fabricage of distributie van deze
      goederen of bij het verlenen van deze diensten. Deze derde kan zich verschonen van het verstrekken van informatie
      die bewijs zou vormen van deelname aan een inbreuk op een recht van intellectuele eigendom door hem zelf of door de
      andere in [artikel 165, derde lid, Wetboek van Burgerlijke Rechtsvordering][ref1] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel165
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '165'
  - number: '28.10'
    text: |-
      De rechter kan op vordering van de gerechtigde gelasten dat op kosten van degene die inbreuk op diens auteursrecht
      heeft gemaakt passende maatregelen worden getroffen tot verspreiding van informatie over de uitspraak.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel28
  - number: '29.1'
    text: |-
      De in [artikel 28, eerste lid][ref1], bedoelde bevoegdheid kan niet worden uitgeoefend ten aanzien van zaken die
      onder personen berusten, die niet in soortgelijke zaken handeldrijven en deze uitsluitend voor eigen gebruik hebben
      verkregen, tenzij zij zelf inbreuk op het betreffende auteursrecht hebben gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel28
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '28'
        hoofdstuk: II
  - number: '29.2'
    text: |-
      De vordering, bedoeld in [artikel 28, vijfde lid][ref1], kan slechts worden ingesteld tegen de eigenaar of houder
      van de zaak, die schuld heeft aan de inbreuk op het betreffende auteursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel28
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '28'
        hoofdstuk: II
  - number: 29a.1
    text: |-
      Voor de toepassing van dit artikel wordt onder «technische voorzieningen» verstaan technologie, inrichtingen of
      onderdelen die in het kader van hun normale werking dienen voor het voorkomen of beperken van handelingen ten
      aanzien van werken, die door de maker of zijn rechtverkrijgenden niet zijn toegestaan. Technische voorzieningen
      worden geacht «doeltreffend» te zijn indien het gebruik van een beschermd werk door de maker of zijn
      rechtverkrijgenden wordt beheerst door middel van toegangscontrole of door toepassing van een beschermingsprocédé
      zoals encryptie, vervorming of andere transformatie van het werk of een kopieerbeveiliging die de beoogde
      bescherming bereikt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
  - number: 29a.2
    text: |-
      Degene, die doeltreffende technische voorzieningen omzeilt en dat weet of redelijkerwijs behoort te weten, handelt
      onrechtmatig.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
  - number: 29a.3
    text: |-
      Degene die diensten verricht of inrichtingen, producten of onderdelen vervaardigt, invoert, distribueert, verkoopt,
      verhuurt, adverteert of voor commerciële doeleinden bezit die:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
  - number: 29a.3.a)
    text: |-
      aangeboden, aangeprezen of in de handel gebracht worden met het doel om de beschermende werking van doeltreffende
      technische voorzieningen te omzeilen, of
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
  - number: 29a.3.b)
    text: |-
      slechts een commercieel beperkt doel of nut hebben anders dan het omzeilen van de beschermende werking van
      doeltreffende technische voorzieningen, of
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
  - number: 29a.3.c)
    text: |-
      vooral ontworpen, vervaardigd of aangepast worden met het doel het omzeilen van de doeltreffende technische
      voorzieningen mogelijk of gemakkelijker te maken,
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
  - number: 29a.4
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden vastgesteld die de maker of zijn rechtverkrijgenden er toe
      verplichten aan de gebruiker van een werk van letterkunde, wetenschap of kunst voor doeleinden als omschreven in
      de [artikelen 15i][ref1], [16][ref2], [16b][ref3], [16c][ref4], [16h][ref5], [16n][ref6], [17b][ref7] en [22][ref8]
      van deze wet de nodige middelen te verschaffen om van deze beperkingen te profiteren, mits de gebruiker rechtmatig
      toegang tot het door de technische voorziening beschermde werk heeft. Het bepaalde in de voorgaande zin geldt niet
      ten aanzien van werken die onder contractuele voorwaarden aan gebruikers beschikbaar worden gesteld op een door hen
      individueel gekozen plaats en tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15i
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel16b
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref5]: https://wetten.overheid.nl/BWBR0001886#Artikel16h
      [ref6]: https://wetten.overheid.nl/BWBR0001886#Artikel16n
      [ref7]: https://wetten.overheid.nl/BWBR0001886#Artikel17b
      [ref8]: https://wetten.overheid.nl/BWBR0001886#Artikel22
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15i
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '16'
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 16b
        hoofdstuk: I
        paragraaf: '6'
      - id: ref4
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref5
        bwb_id: BWBR0001886
        artikel: 16h
        hoofdstuk: I
        paragraaf: '6'
      - id: ref6
        bwb_id: BWBR0001886
        artikel: 16n
        hoofdstuk: I
        paragraaf: '6'
      - id: ref7
        bwb_id: BWBR0001886
        artikel: 17b
        hoofdstuk: I
        paragraaf: '6'
      - id: ref8
        bwb_id: BWBR0001886
        artikel: '22'
        hoofdstuk: I
        paragraaf: '6'
  - number: 29a.5
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden vastgesteld die de maker of zijn rechtverkrijgende er toe
      verplichten aan de gebruiker van een werk van letterkunde, wetenschap of kunst voor het gebruik als omschreven in
      [artikel 15j][ref1], van deze wet de nodige middelen te verschaffen om van deze beperkingen te profiteren, mits de
      gebruiker rechtmatig toegang tot het werk heeft dat door de technische voorziening is beschermd.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15j
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15j
        hoofdstuk: I
        paragraaf: '6'
  - number: 29b.1
    text: |-
      Degene die opzettelijk en zonder daartoe gerechtigd te zijn elektronische informatie betreffende het beheer
      van rechten verwijdert of wijzigt, of werken van letterkunde, wetenschap of kunst waaruit op ongeoorloofde
      wijze dergelijke informatie is verwijderd of waarin op ongeoorloofde wijze dergelijke informatie is gewijzigd,
      verspreidt, ter verspreiding invoert, uitzendt of anderszins openbaar maakt, en weet of redelijkerwijs behoort
      te weten dat hij zodoende aanzet tot inbreuk op het auteursrecht, dan wel een dergelijke inbreuk mogelijk maakt,
      vergemakkelijkt of verbergt, handelt onrechtmatig.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29b
  - number: 29b.2
    text: |-
      Onder «informatie betreffende het beheer van rechten» wordt in dit artikel verstaan alle door de maker of zijn
      rechtverkrijgenden verstrekte informatie welke verbonden is met een verveelvoudiging van een werk of bij de
      openbaarmaking van een werk bekend wordt gemaakt, die dient ter identificatie van het werk, dan wel van de maker of
      zijn rechtverkrijgenden, of informatie betreffende de voorwaarden voor het gebruik van het werk, alsmede de cijfers
      of codes waarin die informatie is vervat.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel29b
  - number: '30'
    text: |-
      Indien iemand zonder daartoe gerechtigd te zijn een portret openbaar maakt gelden ten aanzien van het recht
      van den geportretteerde dezelfde bepalingen als in de [artikelen 28][ref1] en [29][ref2] met betrekking tot het
      auteursrecht zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel29
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '28'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '29'
        hoofdstuk: II
  - number: 30a.1
    text: |-
      Voor het als bedrijf verleenen van bemiddeling in zake muziekauteursrecht, al of niet met het oogmerk om winst te
      maken, is de toestemming vereischt van Onzen Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30a
  - number: 30a.2
    text: |-
      Onder het verleenen van bemiddeling inzake muziekauteursrecht wordt verstaan het, al of niet op eigen naam,
      ten behoeve van de makers van muziekwerken of hunne rechtverkrijgenden, sluiten of ten uitvoer leggen van
      overeenkomsten betreffende de uitvoering in het openbaar of de uitzending in een radio- of televisieprogramma, door
      tekens, geluid of beelden, van die werken, of hunne verveelvoudigingen, in hun geheel of gedeeltelijk.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30a
  - number: 30a.3
    text: |-
      Met de uitvoering of de uitzending in een radio- of televisieprogramma van muziekwerken wordt gelijkgesteld de
      uitvoering of de uitzending in een radio- of televisieprogramma van dramatisch-muzikale werken, choreografische
      werken en pantomimes en hunne verveelvoudigingen, indien deze ten gehoore worden gebracht zonder te worden
      vertoond.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30a
  - number: 30a.4
    text: |-
      Overeenkomsten als bedoeld bij het tweede lid, welke worden aangegaan zonder dat de ingevolge het eerste lid
      vereischte ministerieele toestemming is verkregen, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30a
  - number: 30a.5
    text: |-
      Bij algemene maatregel van bestuur worden nadere voorschriften gegeven omtrent de toestemming bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30a
  - number: 30a.6
    text: |-
      Het toezicht op degene die de ministeriële toestemming heeft verkregen wordt uitgeoefend door het College van
      Toezicht, bedoeld in de [Wet toezicht collectieve beheersorganisaties auteurs- en naburige rechten][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014779
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0014779
  - number: 30b.1
    text: |-
      Op verzoek van een of meer naar het oordeel van Onze Minister van Justitie en van Onze Minister van
      Economische Zaken representatieve organisaties van bedrijfs- of beroepsgenoten die rechtspersonen met volledige
      rechtsbevoegdheid zijn en die ten doel hebben de behartiging van belangen van personen die beroeps- of
      bedrijfsmatig werken van letterkunde, wetenschap of kunst invoeren in Nederland, openbaar maken of verveelvoudigen,
      kunnen voornoemde ministers gezamenlijk bepalen dat door hen aangewezen beroeps- of bedrijfsgenoten verplicht zijn
      hun administratie te voeren op een nader door hen aan te geven wijze.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30b
  - number: 30b.2
    text: |-
      Hij die de in het vorige lid bedoelde verplichting niet nakomt, wordt gestraft met een geldboete van de tweede
      categorie. Het feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel30b
  - number: '31'
    text: |-
      Hij, die opzettelijk inbreuk maakt op eens anders auteursrecht, wordt gestraft met gevangenisstraf van ten hoogste
      zes maanden of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel31
  - number: 31a
    text: Hij die opzettelijk een voorwerp waarin met inbreuk op eens anders auteursrecht een werk is vervat,
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel31a
  - number: 31a.a
    text: openlijk ter verspreiding aanbiedt,
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel31a
  - number: 31a.b
    text: ter verveelvoudiging of ter verspreiding voorhanden heeft,
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel31a
  - number: 31a.c
    text: invoert, doorvoert, uitvoert of
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel31a
  - number: 31a.d
    text: bewaart uit winstbejag
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel31a
  - number: 31b
    text: |-
      Hij die van het plegen van de misdrijven, als bedoeld in de [artikelen 31][ref1] en [31a][ref2], zijn beroep maakt
      of het plegen van deze misdrijven als bedrijf uitoefent, wordt gestraft met gevangenisstraf van ten hoogste vier
      jaar of geldboete van de vijfde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel31a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel31b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '31'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 31a
        hoofdstuk: II
  - number: '32'
    text: |-
      Hij die een voorwerp waarvan hij redelijkerwijs kan vermoeden dat daarin met inbreuk op eens anders auteursrecht
      een werk is vervat,
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32
  - number: 32.a
    text: openlijk ter verspreiding aanbiedt;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32
  - number: 32.b
    text: ter verveelvoudiging of ter verspreiding voorhanden heeft;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32
  - number: 32.c
    text: invoert, doorvoert, uitvoert of
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32
  - number: 32.d
    text: bewaart uit winstbejag
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32
  - number: 32a
    text: |-
      Hij die opzettelijk middelen die uitsluitend bestemd zijn om het zonder toestemming van de maker of zijn
      rechtverkrijgende verwijderen van of het ontwijken van een technische voorziening ter bescherming van een werk als
      bedoeld in [artikel 10, eerste lid, onder 12°][ref1], te vergemakkelijken


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 32a.a
    text: openlijk ter verspreiding aanbiedt,
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32a
  - number: 32a.b
    text: ter verspreiding voorhanden heeft,
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32a
  - number: 32a.c
    text: invoert, doorvoert, uitvoert of
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32a
  - number: 32a.d
    text: bewaart uit winstbejag
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel32a
  - number: '33'
    text: |-
      De feiten strafbaar gesteld in de [artikelen 31][ref1], [31a][ref2], [31b][ref3], [32][ref4] en [32a][ref5] zijn
      misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel31a
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel31b
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel32
      [ref5]: https://wetten.overheid.nl/BWBR0001886#Artikel32a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '31'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 31a
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 31b
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0001886
        artikel: '32'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0001886
        artikel: 32a
        hoofdstuk: II
  - number: '34.1'
    text: |-
      Hij die opzettelijk in enig werk van letterkunde, wetenschap of kunst, waarop auteursrecht bestaat, in de benaming
      daarvan of in de aanduiding van de maker wederrechtelijk enige wijziging aanbrengt of wel met betrekking tot een
      zodanig werk op enige andere wijze, welke nadeel zou kunnen toebrengen aan de eer of de naam van de maker of aan
      zijn waarde in deze hoedanigheid, het werk aantast, wordt gestraft met gevangenisstraf van ten hoogste zes maanden
      of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel34
  - number: '34.2'
    text: Het feit is een misdrijf.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel34
  - number: '35.1'
    text: |-
      Hij die zonder daartoe gerechtigd te zijn een portret in het openbaar ten toon stelt of op andere wijze openbaar
      maakt, wordt gestraft met geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35
  - number: '35.2'
    text: Het feit is eene overtreding.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35
  - number: 35a.1
    text: |-
      Hij die, zonder dat de vereischte toestemming van Onzen Minister van Justitie is verkregen, handelingen verricht,
      die behooren tot een bedrijf als bedoeld bij [artikel 30a][ref1], wordt gestraft met geldboete van de vierde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel30a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 30a
        hoofdstuk: II
  - number: 35a.2
    text: Het feit wordt beschouwd als eene overtreding.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35a
  - number: 35b.1
    text: |-
      Hij die in een schriftelijke aanvrage of opgave, dienende om in het bedrijf van degene, die met toestemming van
      Onze Minister van Justitie bemiddeling verleent inzake muziekauteursrecht, te worden gebezigd bij de vaststelling
      van het wegens auteursrecht verschuldigde, opzettelijk een onjuiste of onvolledige mededeling doet, wordt gestraft
      met hechtenis van ten hoogste drie maanden of of geldboete van de derde categorie.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35b
  - number: 35b.2
    text: Het feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35b
  - number: 35c
    text: |-
      Degene die een schriftelijke opgave aan de in [artikel 16d, eerste lid][ref1], bedoelde rechtspersoon, dienende
      voor de vaststelling van het op grond van [artikel 16c ][ref2] verschuldigde, opzettelijk nalaat dan wel in een
      dergelijke opgave opzettelijk een onjuiste of onvolledige mededeling doet, wordt gestraft met hechtenis van ten
      hoogste drie maanden of geldboete van de derde categorie. Het feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16d
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16d
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
  - number: 35d
    text: |-
      Degene die een opgave als bedoeld in [artikel 15g][ref1] opzettelijk nalaat dan wel in een dergelijke opgave
      opzettelijk een onjuiste mededeling doet, wordt gestraft met hechtenis van ten hoogste drie maanden of geldboete
      van de derde categorie. Het feit wordt beschouwd als een overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel15g
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel35d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 15g
        hoofdstuk: I
        paragraaf: '6'
  - number: '36.1'
    text: |-
      De door den strafrechter verbeurd verklaarde verveelvoudigingen worden vernietigd; echter kan de rechter bij het
      vonnis bepalen, dat zij aan dengene, wien het auteursrecht toekomt, zullen worden afgegeven, indien deze zich
      daartoe ter griffie aanmeldt binnen eene maand nadat de uitspraak in kracht van gewijsde is gegaan.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel36
  - number: '36.2'
    text: |-
      Door de afgifte gaat de eigendom van de verveelvoudigingen op den rechthebbende over. De rechter zal kunnen
      gelasten, dat die afgifte niet zal geschieden dan tegen eene bepaalde, door den rechthebbende te betalen
      vergoeding, welke ten bate komt van den Staat.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel36
  - number: 36a
    text: |-
      De opsporingsambtenaren kunnen te allen tijde tot het opsporen van bij deze wet strafbaar gestelde feiten
      inzage vorderen van alle bescheiden of andere gegevensdragers waarvan inzage voor de vervulling van hun taak
      redelijkerwijze nodig is, bij hen die in de uitoefening van hun beroep of bedrijf werken van letterkunde,
      wetenschap of kunst invoeren, doorvoeren, uitvoeren, openbaar maken of verveelvoudigen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel36a
  - number: 36b.1
    text: |-
      De opsporingsambtenaren zijn bevoegd, tot het opsporen van de bij deze wet strafbaar gestelde feiten en ter
      inbeslagneming van hetgeen daarvoor vatbaar is, elke plaats te betreden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel36b
  - number: 36b.2
    text: Indien hun de toegang wordt geweigerd, verschaffen zij zich die desnoods met inroeping van de sterke arm.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel36b
  - number: 36b.3
    text: |-
      In woningen treden zij tegen de wil van de bewoner niet binnen dan op vertoon van een schriftelijke bijzondere last
      van of in tegenwoordigheid van een officier van justitie of een hulpofficier van justitie. Van dit binnentreden
      wordt door hen binnen vierentwintig uren procesverbaal opgemaakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel36b
  - number: '37.1'
    text: |-
      Het auteursrecht vervalt door verloop van 70 jaren, te rekenen van de 1e januari van het jaar, volgende op het
      sterfjaar van de maker.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel37
  - number: '37.2'
    text: |-
      De duur van een gemeenschappelijk auteursrecht op een zelfde werk, aan twee of meer personen als gezamenlijke
      makers daarvan toekomende, wordt berekend van de 1e januari van het jaar, volgende op het sterfjaar van de
      langstlevende hunner.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel37
  - number: '38.1'
    text: |-
      Het auteursrecht op een werk, ten aanzien waarvan de maker niet is aangeduid of niet op zodanige wijze dat zijn
      identiteit buiten twijfel staat, vervalt door verloop van 70 jaren, te rekenen van de 1e januari van het jaar,
      volgende op dat, waarin de eerste openbaarmaking van het werk rechtmatig heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel38
  - number: '38.2'
    text: |-
      Hetzelfde geldt ten aanzien van werken, waarvan een openbare instelling, een vereniging, stichting of vennootschap
      als maker wordt aangemerkt, tenzij de natuurlijke persoon, die het werk heeft gemaakt, als zodanig is aangeduid op
      of in exemplaren van het werk, die zijn openbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel38
  - number: '38.3'
    text: |-
      Indien de maker vóór het verstrijken van de in het eerste lid genoemde termijn zijn identiteit openbaart, zal de
      duur van het auteursrecht op dat werk worden berekend naar de bepalingen van [artikel 37][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel37
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '37'
        hoofdstuk: III
  - number: '39'
    text: |-
      Voor werken, waarvan de duur van het auteursrecht niet wordt berekend naar de bepalingen van [artikel 37][ref1]
      en die niet binnen 70 jaren na hun totstandkoming op rechtmatige wijze zijn openbaar gemaakt, vervalt het
      auteursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel37
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '37'
        hoofdstuk: III
  - number: '40'
    text: |-
      Het auteursrecht op een filmwerk vervalt door verloop van 70 jaren, te rekenen van de 1e januari van het jaar,
      volgende op het sterfjaar van de langstlevende van de volgende personen: de hoofdregisseur, de scenarioschrijver,
      de schrijver van de dialogen en degene die ten behoeve van het filmwerk de muziek heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel40
  - number: 40a
    text: |-
      Indien in het geval van een muziekwerk met woorden het auteursrecht op de muziek en het auteursrecht op de woorden
      berusten bij verschillende personen, vervalt het auteursrecht door verloop van 70 jaren, te rekenen van de 1e
      januari van het jaar volgende op het sterfjaar van de langstlevende van hen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel40a
  - number: '41'
    text: |-
      Ten aanzien van werken, in verschillende banden, delen, nummers of afleveringen verschenen, wordt voor de
      toepassing van [artikel 38][ref1] iedere band, deel, nummer of aflevering als een afzonderlijk werk aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel38
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '38'
        hoofdstuk: III
  - number: '42'
    text: |-
      In afwijking voor zooverre van de bepalingen van dit hoofdstuk kan in Nederland geenerlei beroep worden gedaan
      op auteursrecht, waarvan de duur in het land van oorsprong van het werk reeds verstreken is. Het in de eerste zin
      bepaalde geldt niet voor werken waarvan de maker onderdaan is van een lid-staat van de Europese Unie of een staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel42
  - number: '43'
    text: 'In dit hoofdstuk en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43
  - number: 43.a
    text: 'originelen van kunstwerken:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43
  - number: 43.a.1°
    text: |-
      een werk van grafische of beeldende kunst, zoals afbeeldingen, collages, schilderingen, tekeningen, gravures,
      prenten, lithografieën, beeldhouwwerken, tapisserieën, keramische werken, glaswerk en foto’s, voor zover dit door
      de maker zelf is vervaardigd, of het een exemplaar betreft dat anderszins als origineel van een kunstwerk wordt
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43
  - number: 43.a.2°
    text: |-
      exemplaren van werken als bedoeld in onder 1°, die door de maker zelf of op zijn gezag in een beperkte oplage zijn
      vervaardigd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43
  - number: 43.b
    text: |-
      professionele kunsthandelaar: de natuurlijke persoon of rechtspersoon die zijn beroep of bedrijf maakt van de koop
      of verkoop van originelen van kunstwerken of van het als tussenpersoon tot stand brengen van koopovereenkomsten met
      betrekking tot originelen van kunstwerken.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43
  - number: 43a.1
    text: |-
      Het volgrecht is het recht van de maker en van zijn rechtverkrijgenden krachtens erfopvolging om bij iedere verkoop
      van een origineel van een kunstwerk waarbij een professionele kunsthandelaar is betrokken, met uitzondering van de
      eerste vervreemding door de maker, een vergoeding te ontvangen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43a
  - number: 43a.2
    text: Het volgrecht is niet overdraagbaar, uitgezonderd in het geval van overdracht krachtens legaat.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43a
  - number: 43a.3
    text: Van het volgrecht kan geen afstand worden gedaan.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43a
  - number: 43a.4
    text: |-
      De vergoeding bedoeld in het eerste lid is opeisbaar vanaf het tijdstip dat de koopprijs van het origineel van het
      kunstwerk opeisbaar is, doch uiterlijk vanaf drie maanden na het totstandkomen van de koopovereenkomst.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43a
  - number: 43b
    text: |-
      Bij algemene maatregel van bestuur wordt de hoogte van de vergoeding, bedoeld in [artikel 43a, eerste lid][ref1],
      vastgesteld en kunnen regelen worden gesteld omtrent de verschuldigdheid van de vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel43a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 43a
        hoofdstuk: IV
  - number: 43c.1
    text: |-
      De verplichting tot betaling van de vergoeding, bedoeld in [artikel 43a, eerste lid][ref1], rust op de bij de
      verkoop betrokken professionele kunsthandelaar. Indien meer dan één professionele kunsthandelaar bij een verkoop is
      betrokken, zijn zij hoofdelijk voor deze vergoeding aansprakelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel43a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 43a
        hoofdstuk: IV
  - number: 43c.2
    text: |-
      Een rechtsvordering tot betaling van de vergoeding bedoeld in [artikel 43a, eerste lid][ref1], verjaart door
      verloop van vijf jaren na de aanvang van de dag, volgende op die waarop de rechthebbende zowel met de opeisbaarheid
      van de vergoeding als met de tot de betaling van de vergoeding verplichte persoon bekend is geworden, en in ieder
      geval door verloop van twintig jaren na het tijdtip waarop de vergoeding opeisbaar is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel43a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 43a
        hoofdstuk: IV
  - number: 43d
    text: |-
      De gerechtigde op het volgrecht kan gedurende drie jaar na het tijdstip waarop de vergoeding bedoeld in
      [artikel 43a, eerste lid][ref1], opeisbaar is geworden, van degene die verplicht is tot betaling van de vergoeding
      alle inlichtingen verlangen die noodzakelijk zijn om de betaling van de vergoeding veilig te stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel43a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 43a
        hoofdstuk: IV
  - number: 43e.1
    text: Het volgrecht vervalt op het tijdstip waarop het auteursrecht vervalt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43e
  - number: 43e.2
    text: |-
      In afwijking van het eerste lid is bij een verkoop van een origineel van een kunstwerk tot 1 januari 2010 de
      vergoeding, bedoeld in [artikel 43a, eerste lid][ref1], niet verschuldigd aan de rechtverkrijgenden van de maker
      krachtens erfopvolging.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel43a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43e
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 43a
        hoofdstuk: IV
  - number: 43e.3
    text: |-
      Bij algemene maatregel van bestuur kan de in het tweede lid bedoelde periode worden verlengd tot uiterlijk
      1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43e
  - number: 43f
    text: |-
      Onverminderd het bepaalde in [artikel 43g][ref1] is dit hoofdstuk van toepassing op originelen van kunstwerken die
      op 1 januari 2006 in ten minste één lidstaat van de Europese Unie of een staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte van 2 mei 1992 beschermd worden door de nationale wetgeving op het
      gebied van het auteursrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel43g
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43f
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 43g
        hoofdstuk: IV
  - number: 43g.1
    text: 'Dit hoofdstuk is van toepassing op makers van originelen van kunstwerken die:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43g
  - number: 43g.1.a
    text: onderdaan zijn van één van de lidstaten van de Europese Unie en hun rechtverkrijgenden;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43g
  - number: 43g.1.b
    text: |-
      onderdaan zijn van een staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei
      1992 en hun rechtverkrijgenden; of
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43g
  - number: 43g.1.c
    text: hun gewone verblijfplaats in Nederland hebben en hun rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43g
  - number: 43g.2
    text: |-
      Dit hoofdstuk is voorts van toepassing op makers van originelen van kunstwerken en hun rechtverkrijgenden die
      onderdaan zijn van een staat, niet zijnde een lidstaat van de Europese Unie of van een staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992, in de mate waarin en de duur waarvoor die
      staat het volgrecht erkent ten behoeve van makers van originelen van kunstwerken uit de lidstaten van de Europese
      Unie en de staten die partij zijn bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 en
      hun rechtverkrijgenden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel43g
  - number: 45a.1
    text: |-
      Onder filmwerk wordt verstaan een werk dat bestaat uit een reeks beelden met of zonder geluid, ongeacht de wijze
      van vastlegging van het werk, indien het is vastgelegd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45a
  - number: 45a.2
    text: |-
      Onverminderd het in de [artikelen 7][ref1] en [8][ref2] bepaalde worden als de makers van een filmwerk aangemerkt
      de natuurlijke personen die tot het ontstaan van het filmwerk een daartoe bestemde bijdrage van scheppend karakter
      hebben geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel8
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45a
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '7'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '8'
        hoofdstuk: I
        paragraaf: '2'
  - number: 45a.3
    text: |-
      Producent van het filmwerk is de natuurlijke of rechtspersoon die verantwoordelijk is voor de totstandbrenging van
      het filmwerk met het oog op de exploitatie daarvan.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45a
  - number: 45b
    text: |-
      Indien een van de makers zijn bijdrage tot het filmwerk niet geheel tot stand wil of kan brengen, kan hij zich,
      tenzij schriftelijk anders overeengekomen is, niet verzetten tegen het gebruik door de producent van die bijdrage,
      voor zover deze reeds tot stand is gebracht, ten behoeve van de voltooiing van het filmwerk. Voor de door hem tot
      stand gebrachte bijdrage geldt hij als maker in de zin van [artikel 45a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel45a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 45a
        hoofdstuk: V
  - number: 45c
    text: |-
      Het filmwerk geldt als voltooid op het tijdstip waarop het vertoningsgereed is. Tenzij schriftelijk anders
      overeengekomen is, beslist de producent wanneer het filmwerk vertoningsgereed is.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45c
  - number: 45d.1
    text: |-
      Tenzij de makers en de producent van een filmwerk schriftelijk anders zijn overeengekomen, worden de makers
      geacht aan de producent het recht overgedragen te hebben om vanaf het in [artikel 45c][ref1] bedoelde tijdstip het
      filmwerk te verhuren en anderszins openbaar te maken, dit te verveelvoudigen in de zin van [artikel 14][ref2], er
      ondertitels bij aan te brengen en de teksten ervan na te synchroniseren. Het vorenstaande geldt niet ten aanzien
      van degene die ten behoeve van het filmwerk de muziek heeft gemaakt en degene die de bij de muziek behorende tekst
      heeft gemaakt. Ongeacht de wijze van overdracht is de producent aan de makers voor de overdracht van rechten en
      de exploitatie van het filmwerk een billijke vergoeding verschuldigd. Van het recht op een billijke vergoeding kan
      geen afstand worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel45c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel14
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 45c
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '14'
        hoofdstuk: I
        paragraaf: '5'
  - number: 45d.2
    text: |-
      Onverminderd het in [artikel 26a][ref1] bepaalde is een ieder die het filmwerk uitzendt of doet uitzenden of op
      enige andere wijze mededeelt aan het publiek, per draad of draadloos, met uitzondering van de beschikbaarstelling
      van het filmwerk op zodanige wijze dat het filmwerk voor de leden van het publiek op een door hen individueel
      gekozen plaats en tijd toegankelijk is, aan de hoofdregisseur en de scenarioschrijver van het filmwerk die deze
      rechten aan de producent heeft overgedragen een proportionele billijke vergoeding verschuldigd. Van het recht op
      een proportionele billijke vergoeding kan geen afstand worden gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel26a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 26a
        hoofdstuk: II
  - number: 45d.3
    text: |-
      Het recht op de vergoeding bedoeld in het tweede lid wordt uitgeoefend door representatieve rechtspersonen die zich
      ingevolge hun statuten ten doel stellen de belangen van hoofdregisseurs of scenarioschrijvers te behartigen door de
      uitoefening van dat recht. [Artikel 26a, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel26a
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 26a
        hoofdstuk: II
  - number: 45d.4
    text: |-
      Degene die de in het tweede lid bedoelde vergoeding verschuldigd is, is gehouden aan de rechtspersonen bedoeld in
      het derde lid de bescheiden of andere informatiedragers ter inzage te geven, waarvan de kennisneming noodzakelijk
      is voor de vaststelling van de verschuldigdheid, de hoogte en de verdeling van de vergoeding.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45d
  - number: 45d.5
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gegeven over de uitoefening van het recht bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45d
  - number: 45d.6
    text: |-
      Het recht op een proportionele billijke vergoeding bedoeld in het tweede lid is niet van toepassing op een filmwerk
      waarvan de exploitatie als zodanig niet het hoofddoel is.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45d
  - number: 45d.7
    text: |-
      [Artikel 25d][ref1] en [artikel 25e][ref2] zijn van overeenkomstige toepassing.
      [Artikel 25c, tweede tot en met zesde lid][ref3], en [artikel 25g][ref4] zijn van overeenkomstige toepassing op de
      billijke vergoeding bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25d
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel25e
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel25c
      [ref4]: https://wetten.overheid.nl/BWBR0001886#Artikel25g
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 25d
        hoofdstuk: Ia
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 25e
        hoofdstuk: Ia
      - id: ref3
        bwb_id: BWBR0001886
        artikel: 25c
        hoofdstuk: Ia
      - id: ref4
        bwb_id: BWBR0001886
        artikel: 25g
        hoofdstuk: Ia
  - number: 45e
    text: |-
      Iedere maker heeft met betrekking tot het filmwerk naast de rechten, bedoeld in
      [artikel 25, eerste lid, onder b, c en d][ref1], het recht


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45e
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 45e.a
    text: |-
      zijn naam op de daarvoor gebruikelijke plaats in het filmwerk te doen vermelden met vermelding van zijn
      hoedanigheid of zijn bijdrage aan het filmwerk;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45e
  - number: 45e.b
    text: te vorderen dat het onder *a* bedoelde gedeelte van het filmwerk mede wordt vertoond;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45e
  - number: 45e.c
    text: |-
      zich te verzetten tegen vermelding van zijn naam op het filmwerk, tenzij dit verzet in strijd met de redelijkheid
      zou zijn.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45e
  - number: 45f
    text: |-
      De maker wordt, tenzij schriftelijk anders overeengekomen is, verondersteld tegenover de producent afstand gedaan
      te hebben van het recht zich te verzetten tegen wijzigingen als bedoeld in [artikel 25, eerste lid onder c][ref1],
      in zijn bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel25
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45f
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '25'
        hoofdstuk: I
        paragraaf: '6'
  - number: 45g
    text: |-
      Iedere maker behoudt, tenzij schriftelijk anders overeengekomen is, het auteursrecht op zijn bijdrage, indien
      deze een van het filmwerk scheidbaar werk vormt. Na het in [artikel 45c][ref1] bedoelde tijdstip mag iedere maker,
      tenzij schriftelijk anders overeengekomen is, zijn bijdrage afzonderlijk openbaar maken en verveelvoudigen, mits
      hij daardoor geen schade toebrengt aan de exploitatie van het filmwerk.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel45c
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45g
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 45c
        hoofdstuk: V
  - number: 45h
    text: |-
      Voor het openbaar maken door middel van verhuren van het geheel of een gedeelte van een werk als bedoeld in
      [artikel 10, eerste lid, onder 12°][ref1], of van een verveelvoudiging daarvan die door de rechthebbende of met
      zijn toestemming in het verkeer is gebracht, is de toestemming van de maker of zijn rechtverkrijgende vereist.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45h
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 45i
    text: |-
      Onverminderd het bepaalde in [artikel 13][ref1] wordt onder het verveelvoudigen van een werk als bedoeld in
      [artikel 10, eerste lid, onder 12°][ref2], mede verstaan het laden, het in beeld brengen, de uitvoering, de
      transmissie of de opslag, voor zover voor deze handelingen het verveelvoudigen van dat werk noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45i
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '13'
        hoofdstuk: I
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 45j
    text: |-
      Tenzij anders is overeengekomen, wordt niet als inbreuk op het auteursrecht op een werk als bedoeld in
      [artikel 10, eerste lid, onder 12°][ref1], beschouwd de verveelvoudiging, vervaardigd door de rechtmatige
      verkrijger van een exemplaar van eerder genoemd werk, die noodzakelijk is voor het met dat werk beoogde gebruik. De
      verveelvoudiging, als bedoeld in de eerste zin, die geschiedt in het kader van het laden, het in beeld brengen of
      het verbeteren van fouten, kan niet bij overeenkomst worden verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45j
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 45k
    text: |-
      Als inbreuk op het auteursrecht op een werk als bedoeld in [artikel 10, eerste lid, onder 12°][ref1], wordt niet
      beschouwd de verveelvoudiging, vervaardigd door de rechtmatige gebruiker van eerder genoemd werk, die dient als
      reservekopie indien zulks voor het met dat werk beoogde gebruik noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45k
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 45l
    text: |-
      Hij die bevoegd is tot het verrichten van de in [artikel 45i][ref1] bedoelde handelingen, is mede bevoegd tijdens
      deze handelingen de werking van dat werk waar te nemen, te bestuderen en te testen teneinde de daaraan ten
      grondslag liggende ideeën en beginselen te achterhalen.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel45i
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45l
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 45i
        hoofdstuk: VI
  - number: 45m.1
    text: |-
      Als inbreuk op het auteursrecht op een werk als bedoeld in [artikel 10, eerste lid, onder 12°][ref1], worden
      niet beschouwd het vervaardigen van een kopie van dat werk en het vertalen van de codevorm daarvan, indien
      deze handelingen onmisbaar zijn om de informatie te verkrijgen die nodig is om de interoperabiliteit van een
      onafhankelijk vervaardigd computerprogramma met andere computerprogramma’s tot stand te brengen, mits:


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 45m.1.a
    text: |-
      deze handelingen worden verricht door een persoon die op rechtmatige wijze de beschikking heeft gekregen over een
      exemplaar van het computerprogramma of door een door hem daartoe gemachtigde derde;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
  - number: 45m.1.b
    text: |-
      de gegevens die noodzakelijk zijn om de interoperabiliteit tot stand te brengen niet reeds snel en gemakkelijk
      beschikbaar zijn voor de onder *a* bedoelde personen;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
  - number: 45m.1.c
    text: |-
      deze handelingen beperkt blijven tot die onderdelen van het oorspronkelijke computerprogramma die voor het tot
      stand brengen van de interoperabiliteit noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
  - number: 45m.2
    text: 'Het is niet toegestaan de op grond van het eerste lid verkregen informatie:'
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
  - number: 45m.2.a
    text: |-
      te gebruiken voor een ander doel dan het tot stand brengen van de interoperabiliteit van het onafhankelijk
      vervaardigde computerprogramma;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
  - number: 45m.2.b
    text: |-
      aan derden mede te delen, tenzij dit noodzakelijk is voor het tot stand brengen van de interoperabiliteit van het
      onafhankelijk vervaardigde computerprogramma;
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
  - number: 45m.2.c
    text: |-
      te gebruiken voor de ontwikkeling, de produktie of het in de handel brengen van een computerprogramma, dat niet
      als een nieuw, oorspronkelijk werk kan worden aangemerkt of voor andere, op het auteursrecht inbreuk makende
      handelingen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45m
  - number: 45n
    text: |-
      De [artikelen 16b][ref1] en [16c][ref2] zijn niet van toepassing op werken als bedoeld in
      [artikel 10, eerste lid, onder 12°][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel16b
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel16c
      [ref3]: https://wetten.overheid.nl/BWBR0001886#Artikel10
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45n
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 16b
        hoofdstuk: I
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: 16c
        hoofdstuk: I
        paragraaf: '6'
      - id: ref3
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
  - number: 45o.1
    text: |-
      Hij die een niet eerder uitgegeven werk voor de eerste maal rechtmatig openbaar maakt na het verstrijken van de
      duur van het auteursrecht, geniet het in [artikel 1][ref1] genoemde uitsluitende recht.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel1
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45o
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '1'
        hoofdstuk: I
        paragraaf: '1'
  - number: 45o.2
    text: |-
      Het in het eerste lid genoemde recht vervalt door verloop van 25 jaren, te rekenen van de 1e januari van het jaar,
      volgende op dat, waarin de eerste openbaarmaking van dat werk rechtmatig heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45o
  - number: 45o.3
    text: |-
      Het in het eerste lid en in het tweede lid bepaalde geldt tevens voor niet eerder uitgegeven werken die nooit door
      het auteursrecht zijn beschermd en waarvan de maker meer dan 70 jaren geleden is overleden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel45o
  - number: '46.1'
    text: |-
      Bij het in werking treden van deze wet vervalt de wet van 28 Juni 1881 *(Staatsblad* nr. 124), tot regeling van
      het auteursrecht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel46
  - number: '46.2'
    text: |-
      Echter blijft artikel 11 van laatstgenoemde wet van kracht ten aanzien van werken en vertalingen, vóór bedoeld
      tijdstip ingezonden.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel46
  - number: '47.1'
    text: |-
      Deze wet is van toepassing op alle werken van letterkunde, wetenschap of kunst, welke hetzij vóór, hetzij na
      haar in werking treden voor de eerste maal, of binnen dertig dagen na de eerste uitgave in een ander land,
      zijn uitgegeven in Nederland, alsmede op alle zodanige niet of niet aldus uitgegeven werken, welker makers zijn
      Nederlanders.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47
  - number: '47.2'
    text: |-
      Voor de toepassing van het voorgaande lid worden met Nederlanders gelijkgesteld de makers die geen Nederlander zijn
      maar die hun gewone verblijfplaats in Nederland hebben, voor zover het betreft niet uitgegeven werken of werken die
      zijn uitgegeven nadat de maker zijn gewone verblijfplaats in Nederland heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47
  - number: '47.3'
    text: |-
      Een werk is uitgegeven in de zin van dit artikel wanneer het met toestemming van de maker in druk is verschenen
      of in het algemeen wanneer met toestemming van de maker een zodanig aanbod van exemplaren daarvan, van welke aard
      ook, heeft plaatsgevonden dat daardoor, gelet op de aard van het werk, wordt voorzien in de redelijke behoeften van
      het publiek.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47
  - number: '47.4'
    text: |-
      De opvoering van een toneelwerk of muziek-dramatisch werk, de uitvoering van een muziekwerk, de vertoning van een
      filmwerk, de voordracht of de uitzending in een radio- of televisieprogramma van een werk en de tentoonstelling van
      een kunstwerk worden niet als een uitgave aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47
  - number: '47.5'
    text: |-
      Ten aanzien van bouwwerken en van werken van beeldende kunst die daarmede één geheel vormen, wordt het bouwen van
      het bouwwerk of het aanbrengen van het werk van beeldende kunst als uitgave aangemerkt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47
  - number: '47.6'
    text: |-
      Onverminderd het bepaalde in de voorgaande leden is deze wet van toepassing op filmwerken, indien de producent
      daarvan in Nederland zijn zetel of zijn gewone verblijfplaats heeft.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47
  - number: 47a
    text: |-
      Deze wet blijft van toepassing op alle werken van letterkunde, wetenschap of kunst, welke voor de eerste maal vóór
      27 december 1949 in Nederlandsch-Indië of vóór 1 oktober 1962 in Nederlands-Nieuw-Guinea door of vanwege de maker
      zijn uitgegeven.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47a
  - number: 47b.1
    text: |-
      Deze wet is van toepassing op het uitzenden van een in een radio- of televisieprogramma opgenomen werk door middel
      van een satelliet, indien de handeling, bedoeld in [artikel 12, zevende lid][ref1], in Nederland plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel12
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '12'
        hoofdstuk: I
        paragraaf: '4'
  - number: 47b.2
    text: |-
      Deze wet is voorts van toepassing op het uitzenden van een in een radio- of televisieprogramma opgenomen werk door
      middel van een satelliet, indien:
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47b
  - number: 47b.2.a
    text: |-
      de handeling, bedoeld in [artikel 12, zevende lid][ref1], plaatsvindt in een land dat niet tot de Europese Unie
      behoort of dat niet partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992;


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel12
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '12'
        hoofdstuk: I
        paragraaf: '4'
  - number: 47b.2.b
    text: |-
      het land waar de handeling, bedoeld in [artikel 12, zevende lid][ref1], plaatsvindt niet het niveau van
      bescherming biedt, voorzien in hoofdstuk II van [richtlijn nr. 93/83/EEG](31993L0083) van de Raad van de Europese
      Gemeenschappen van 27 september 1993 tot coördinatie van bepaalde voorschriften betreffende het auteursrecht en
      naburige rechten op het gebied van de satellietomroep en de doorgifte via de kabel (PbEG L 248); en


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel12
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47b
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '12'
        hoofdstuk: I
        paragraaf: '4'
  - number: 47b.2.c
    text: |-
      hetzij de programmadragende signalen naar de satelliet worden doorgezonden vanuit een grondstation in Nederland,
      hetzij een omroeporganisatie, die in Nederland haar hoofdvestiging heeft, opdracht heeft gegeven tot de uitzending
      en geen gebruik wordt gemaakt van een grondstation in een lid-staat van de Europese Unie of in een staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel47b
  - number: '48'
    text: |-
      Deze wet erkent geen auteursrecht op werken, waarop het auteursrecht op het tijdstip van haar in werking treden
      krachtens een der artikelen 13 of 14 der wet van 28 Juni 1881 (*Staatsblad* nr. 124), tot regeling van het
      auteursrecht, was vervallen, noch op werken, waarvan op bedoeld tijdstip het kopijrecht vervallen was krachtens
      artikel 3 der wet van den 25sten Januari 1817 (*Staatsblad* nr. 5), de rechten bepalende die in de Nederlanden, ten
      opzichte van het drukken en uitgeven van letter- en kunstwerken, kunnen worden uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel48
  - number: '49'
    text: |-
      Het auteursrecht, verkregen krachtens de wet van 28 Juni 1881 (*Staatsblad* nr. 124), tot regeling van het
      auteursrecht, zoomede het kopijrecht of eenig recht van dezen aard, onder eene vroegere wetgeving verkregen en door
      genoemde wet gehandhaafd, blijft na het in werking treden van deze wet gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel49
  - number: 50c.1
    text: |-
      Hij die vóór 1 september 1912, niet in strijd met de bepalingen van de wet van 28 juni 1881 (*Stb.* 124)
      tot regeling van het auteursrecht, noch met die van enig tractaat in Nederland of Nederlandsch-Indië enige
      verveelvoudiging van een werk van letterkunde, wetenschap of kunst, niet zijnde een nadruk van het geheel of een
      gedeelte van een zodanig werk, als bedoeld bij [artikel 10, 1°, 2°, 5° of 7°][ref1], heeft uitgegeven, verliest
      door het in werking treden van deze wet niet de bevoegdheid om de vóór dat tijdstip uitgegeven verveelvoudiging,
      ook wat betreft later vervaardigde exemplaren, te verspreiden en te verkopen. Deze bevoegdheid gaat over bij
      erfopvolging en is vatbaar voor geheele of gedeeltelijke overdracht. Het [tweede lid van artikel 47][ref2] vindt
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel47
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50c
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: '10'
        hoofdstuk: I
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '47'
        hoofdstuk: VIII
  - number: 50c.2
    text: |-
      Niettemin kan de rechter, op het schriftelijk verzoek van dengene wien het auteursrecht op het oorspronkelijk werk
      toekomt, hetzij de in het eerste lid genoemde bevoegdheid geheel of gedeeltelijk opheffen, hetzij den verzoeker ter
      zake van de uitoefening dier bevoegdheid eene schadeloosstelling toekennen, een en ander volgens de bepalingen der
      beide volgende artikelen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50c
  - number: 50d.1
    text: |-
      Het verzoek tot gehele of gedeeltelijke opheffing van de in [artikel 50c][ref1] genoemde bevoegdheid kan
      slechts worden gedaan, indien na 1 november 1915 een nieuwe uitgave der verveelvoudiging heeft plaatsgehad. Het
      [tweede lid van artikel 47][ref2] vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel50c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel47
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50d
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 50c
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '47'
        hoofdstuk: VIII
  - number: 50d.2
    text: |-
      Het verzoekschrift wordt vóór het verstrijken van het kalenderjaar, volgende op dat, waarin die uitgave heeft
      plaatsgehad, ingediend bij de rechtbank Amsterdam. De griffier roept partijen op tegen een door de rechter te
      bepalen bekwame termijn. De zaak wordt in raadkamer behandeld.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50d
  - number: 50d.3
    text: |-
      Het verzoek tot opheffing der bevoegdheid wordt slechts ingewilligd, indien en voor zoover de rechter van oordeel
      is, dat het zedelijk belang des verzoekers door de verspreiding en den verkoop der verveelvoudiging wordt gekrenkt.
      Geschiedt het verzoek niet door den maker van het oorspronkelijk werk, dan wijst de rechter het af, indien het
      hem aannemelijk voorkomt, dat de maker die uitgave der verveelvoudiging heeft goedgevonden. De rechter wijst
      het verzoek ook af, indien de verzoeker pogingen heeft aangewend tot het bekomen eener schadeloosstelling van
      dengene die de bevoegdheid uitoefent. De rechter kan het verzoek afwijzen, indien door de opheffing degene die de
      bevoegdheid uitoefent, in verhouding tot het te beschermen belang des verzoekers, te zeer zou worden benadeeld.
      Indien de rechter de bevoegdheid geheel of gedeeltelijk opheft, bepaalt hij het tijdstip waarop die opheffing in
      werking treedt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50d
  - number: 50d.4
    text: |-
      Bij zijne beslissing maakt de rechter zoodanige bepalingen als hij met het oog op de belangen van beide partijen en
      van derde belanghebbenden billijk oordeelt. Hij begroot de kosten van beide partijen en bepaalt in welke verhouding
      zij deze zullen dragen. Tegen de rechterlijke beslissingen, ingevolge dit artikel gegeven, staat geene hoogere
      voorziening open. Griffierechten zijn ter zake van de toepassing van dit artikel niet verschuldigd.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50d
  - number: 50e.1
    text: |-
      Een schadeloosstelling ter zake van de uitoefening van de in [artikel 50c][ref1] genoemde bevoegdheid kan
      slechts worden toegekend, indien na 1 mei 1915 een nieuwe uitgave van de verveelvoudiging heeft plaatsgehad. Het
      [tweede lid van artikel 47][ref2] vindt overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001886#Artikel50c
      [ref2]: https://wetten.overheid.nl/BWBR0001886#Artikel47
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50e
    references:
      - id: ref1
        bwb_id: BWBR0001886
        artikel: 50c
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0001886
        artikel: '47'
        hoofdstuk: VIII
  - number: 50e.2
    text: Het tweede en het vierde lid van het voorgaande artikel zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel50e
  - number: '51.1'
    text: |-
      De in deze wet voorziene beschermingstermijnen zijn met ingang van het tijdstip van inwerkingtreding van dit
      artikel van toepassing op werken die op 1 juli 1995 in ten minste één lid-staat van de Europese Unie of een staat
      die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte van 2 mei 1992 beschermd worden door
      de nationale wetgeving op het gebied van het auteursrecht.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel51
  - number: '51.2'
    text: |-
      Deze wet kan een op de dag vóór de dag van inwerkingtreding van dit artikel lopende beschermingstermijn niet
      verkorten.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel51
  - number: '51.3'
    text: |-
      Deze wet laat vóór het tijdstip van inwerkingtreding van dit artikel rechtmatig verrichte exploitatiehandelingen
      alsmede vóór dat tijdstip verworven rechten onverlet.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel51
  - number: '51.4'
    text: |-
      Hij die met betrekking tot een werk, waarvan de beschermingstermijn vóór het tijdstip van inwerkingtreding van
      dit artikel was verstreken en waarop met ingang van het tijdstip van inwerkingtreding van dit artikel deze wet
      weer van toepassing is, vóór 24 november 1993 rechtmatig exploitatiehandelingen heeft verricht, is bevoegd deze
      exploitatiehandelingen met ingang van het tijdstip van inwerking van dit artikel voort te zetten.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel51
  - number: '51.5'
    text: |-
      Rechten die op het tijdstip van inwerkingtreding van dit artikel herleven of verlengd worden komen tot het verval
      van deze rechten toe aan degene die laatste rechthebbende zou zijn geweest als de herleving of verlenging niet had
      plaatsgevonden, tenzij anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel51
  - number: '52'
    text: Deze wet kan worden aangehaald onder den titel "Auteurswet".
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel52
  - number: '53'
    text: |-
      Deze wet treedt in het Rijk in Europa in werking op den eersten dag der maand volgende op die, waarin zij
      afgekondigd wordt.
    url: https://wetten.overheid.nl/BWBR0001886/2021-01-01#Artikel53
