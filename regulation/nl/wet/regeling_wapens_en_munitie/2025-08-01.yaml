        artikel: '22'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '26'
  - number: '7.2'
    text: |-
      Het verbod van [artikel 14, eerste lid][ref1], [22, eerste lid][ref2], [26 eerste lid][ref3], en
      [27, eerste lid, van de wet][ref4] is niet van toepassing op personen die deel uitmaken van of werkzaam zijn voor
      de Unit Bijstand en Ondersteuning en de Unit Vervoer van de Dienst Vervoer en Ondersteuning van de landelijke
      dienst Dienst Vervoer en Ondersteuning voor zover het doen binnenkomen of uitgaan, het vervoeren, het voorhanden
      hebben of het dragen geschiedt uit hoofde van de dienstuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel7
    references:
