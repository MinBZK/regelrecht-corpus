        artikel: '37'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: 37a
  - number: '8.3'
    text: |-
      De aanvrager, of de beheerder bedoeld in [artikel 10, eerste lid, onder a, van de wet][ref1] mag niet binnen de
      laatste acht jaren bij onherroepelijk geworden rechterlijke uitspraak zijn veroordeeld wegens overtreding van één
