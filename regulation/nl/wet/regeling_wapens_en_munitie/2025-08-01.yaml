        artikel: '10'
  - number: '8.5'
    text: |-
      Op de termijnen genoemd in het derde en vierde lid zijn de bepalingen van de
      [Wet op de justitiële documentatie en op de verklaring omtrent het gedrag][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002195
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002195
  - number: '8.6'
    text: |-
      Een onherroepelijke strafbeschikking wordt voor de toepassing van het derde lid met een veroordeling gelijk
      gesteld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8
  - number: '8.7'
    text: |-
      Van het bepaalde in het tweede tot en met vierde lid kan de korpschef op verzoek ontheffing verlenen indien de
      toepassing daarvan kennelijk onredelijk is.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8
  - number: 8a.1
    text: |-
      Een erkenninghouder die een vuurwapen van de categorie II of III, munitie of airsoftapparaten vervaardigt,
      transformeert of in de uitoefening van een bedrijf uitwisselt, verhuurt of anderszins ter beschikking stelt,
      herstelt beproeft of verhandelt, stelt geen personen te werk die belast zullen worden met werkzaamheden dan nadat
      ten aanzien van deze personen een gunstig luidende verklaring omtrent het gedrag is verkregen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8a
  - number: 8a.2
    text: |-
      De erkenninghouder stuurt een afschrift van de verklaring omtrent het gedrag zoals genoemd in het eerste lid aan
      de korpschef.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8a
  - number: '9.1'
    text: |-
      De aanvrager of de beheerder, bedoeld in [artikel 10, eerste lid, onder a, van de wet][ref1] dient met gunstig
      gevolg een examen te hebben afgelegd waarvan de exameneisen en het examenreglement door de minister zijn
      goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel10
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '10'
  - number: '9.2'
    text: 'Goedkeuring als bedoeld in het eerste lid wordt in ieder geval verleend aan:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel9
  - number: 9.2.a
    text: het Vakexamen voor de handel in wapens en munitie van de Leidsche Onderwijs Instellingen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel9
  - number: 9.2.b
    text: |-
      het Examen inzake vakbekwaamheid voor de detailhandel in vuurwapens en munitie van de Nederlandse Vereniging voor
      de Wapenhandel, voor zover dat examen voor 1 januari 1989 is afgelegd;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel9
  - number: 9.2.c
    text: het vakexamen voor de handel in wapens en munitie van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel9
  - number: '9.3'
    text: |-
      De minister kan, al dan niet tijdelijk, gehele of gedeeltelijke ontheffing verlenen van het bepaalde in het eerste
      lid. Aan de ontheffing kunnen voorwaarden en beperkingen worden verbonden.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel9
  - number: '10'
    text: |-
      [Artikel 9, eerste lid][ref1], van deze regeling is niet van toepassing, indien de aangevraagde erkenning, bedoeld
      in [artikel 9, eerste lid, van de wet][ref2], bedrijven betreft waarin:


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel9
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '9'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '9'
  - number: 10.a
    text: |-
      geen andere onder de wet vallende voorwerpen dan noodsignaalmiddelen worden hersteld of verhandeld, hieronder mede
      verstaan het verhandelen van bijbehorende munitie;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel10
  - number: 10.b
    text: uitsluitend wapens worden gegraveerd of geblauwd, dan wel aan een andere oppervlaktebehandeling worden onderworpen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel10
  - number: 10.c
    text: |-
      slechts lucht-, gas- of veerdrukwapens, uitsluitend bestemd en geschikt voor de paintballsport, worden verhandeld;
      of
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel10
  - number: 10.d
    text: |-
      uitsluitend munitie van categorie III wordt verhandeld, en die op 26 september 1996 in het bezit waren van een
      daartoe strekkende erkenning.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel10
  - number: 10.e
    text: |-
      Slechts infrarood-, dan wel laserwapens, uitsluitend bestemd en geschikt voor simulatie-, dan wel recreatieve
      doeleinden, aan derden ter beschikking worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel10
  - number: '11.1'
    text: 'De bedrijfsruimte van de erkende:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: 11.1.a
    text: is niet in gebruik als woonruimte;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: 11.1.b
    text: is deugdelijk afsluitbaar en is voorzien van een alarminstallatie;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: 11.1.c
    text: bevat een deugdelijk afsluitbare bergruimte; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: 11.1.d
    text: is niet toegankelijk voor publiek, tenzij daar tevens toezichthoudend personeel aanwezig is.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: '11.2'
    text: |-
      Het bepaalde in het eerste lid, onder a en b, is niet van toepassing op de bedrijfsruimte van de erkende, bedoeld
      in [artikel 10, onder a en b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel10
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '10'
        paragraaf: '6'
  - number: '11.3'
    text: |-
      In de bedrijfsruimte van de erkende worden vuistvuurwapens niet uitgestald op een plaats die vanaf de openbare weg
      zichtbaar is.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: '11.4'
    text: |-
      Indien in de bedrijfsruimte van de erkende geen toezichthoudend personeel aanwezig is, worden vuistvuurwapens
      opgeslagen in de bergruimte, bedoeld in het eerste lid onder c.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: '11.5'
    text: |-
      Onverminderd het bepaalde in de voorgaande leden voldoet de bedrijfsruimte van de erkende die wapens van
      categorie II vervaardigt, transformeert, in de uitoefening van zijn bedrijf uitwisselt, verhuurt of anderszins
      ter beschikking stelt, herstelt of verhandelt, aan de veiligheidseisen die zijn gesteld in bijlage IV bij deze
      regeling.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel11
  - number: '12.1'
    text: |-
      De erkenninghouder of de in het bewijs van erkenning genoemde beheerder houdt een doorlopend register bij waarin
      alle door deze onder enige titel verkregen of overgedragen wapens en munitie, onderdelen en hulpstukken als bedoeld
      in [artikel 3 van de wet][ref1] daaronder mede begrepen, worden aangetekend, met uitzondering van patroonhouders
      en -magazijnen, airsoftapparaten, lucht-, gas- en veerdrukwapens van categorie IV en van die wapens of munitie
      waarvoor ingevolge één van de [artikelen 18][ref2], [19][ref3], [20][ref4], [21][ref5], en [22][ref6] een
      vrijstelling geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0008800#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0008800#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0008800#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0008800#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: '18'
        paragraaf: '10'
      - id: ref3
        bwb_id: BWBR0008800
        artikel: '19'
        paragraaf: '10'
      - id: ref4
        bwb_id: BWBR0008800
        artikel: '20'
        paragraaf: '10'
      - id: ref5
        bwb_id: BWBR0008800
        artikel: '21'
        paragraaf: '11'
      - id: ref6
        bwb_id: BWBR0008800
        artikel: '22'
        paragraaf: '11'
  - number: '12.2'
    text: 'Het in het eerste lid genoemde register bestaat uit de volgende afzonderlijke registraties:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: 12.2.a
    text: een registratie betreffende het inkomen van voor de handel bestemde wapens;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: 12.2.b
    text: een registratie betreffende het inkomen van voor de handel bestemde munitie;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: 12.2.c
    text: een registratie betreffende het uitgaan van voor de handel bestemde wapens;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: 12.2.d
    text: een registratie betreffende het uitgaan van voor de handel bestemde munitie;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: 12.2.e
    text: een registratie betreffende in bewaring of ter reparatie gegeven wapens en munitie;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: 12.2.f
    text: een registratie betreffende ter beproeving gegeven wapens en munitie.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.3'
    text: |-
      De in het tweede lid onder a genoemde registratie bevat kolomsgewijs en achtereenvolgens: het volgnummer, de datum
      van ontvangst, het aantal, een omschrijving van het wapen met vermelding van fabrikaat, het land of de plaats van
      vervaardiging, type, kaliber en serienummer, de naam en het adres van degene die heeft geleverd, alsmede de soort,
      het nummer en de afgevende instantie van het document waaruit de bevoegdheid blijkt van degene die heeft geleverd.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.4'
    text: |-
      De in het tweede lid onder b genoemde registratie bevat kolomsgewijs en achtereenvolgens: het volgnummer, de datum
      van ontvangst, de hoeveelheid, een omschrijving van de munitie met vermelding van fabrikaat, het land of de plaats
      van vervaardiging, type en kaliber, de naam en het adres van degene die heeft geleverd, alsmede de soort, het
      nummer en de afgevende instantie van het document waaruit de bevoegdheid blijkt van degene die heeft geleverd.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.5'
    text: |-
      De in het tweede lid onder c genoemde registratie bevat kolomsgewijs en achtereenvolgens: het volgnummer, een
      verwijzing naar het volgnummer waaronder het wapen in de in het tweede lid onder a bedoelde registratie staat
      vermeld, de datum van overdracht, het aantal, een omschrijving van het wapen met vermelding van fabrikaat, het land
      of de plaats van vervaardiging, type, kaliber en serienummer, de naam en het adres van degene aan wie het wapen
      wordt overgedragen, de soort, het nummer en de afgevende instantie van het document waaruit de bevoegdheid blijkt
      van degene aan wie het wapen wordt overgedragen, alsmede, in gevallen waarin een verlof tot verkrijging vereist is,
      het nummer van dit verlof en de instantie die het heeft afgegeven.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.6'
    text: |-
      De in het tweede lid onder d genoemde registratie bevat kolomsgewijs en achtereenvolgens: het volgnummer, de
      hoeveelheid, een omschrijving van de munitie met vermelding van fabrikaat, het land of de plaats van vervaardiging,
      type en kaliber, de naam en het adres van degene aan wie de munitie wordt overgedragen, alsmede de soort,
      het nummer en de afgevende instantie van het document waaruit de bevoegdheid blijkt van degene aan wie wordt
      overgedragen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.7'
    text: |-
      De in het tweede lid onder e genoemde registratie bevat kolomsgewijs en achtereenvolgens: het volgnummer, de datum
      van ontvangst, het aantal, een omschrijving van het wapen met vermelding van fabrikaat, het land of de plaats van
      vervaardiging, type, kaliber en serienummer, een omschrijving van de munitie met vermelding van fabrikaat, het land
      of de plaats van vervaardiging, type en kaliber, de naam en het adres van degene die in bewaring of in reparatie
      heeft gegeven, de soort, het nummer en de afgevende instantie van het document waaruit de bevoegdheid blijkt van
      degene die in bewaring of in reparatie heeft gegeven, gegevens betreffende de doorgifte van het wapen aan degene
      die het wapen in reparatie of bewaring heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.8'
    text: |-
      De in het tweede lid onder f genoemde registratie bevat kolomsgewijs en achtereenvolgens: het volgnummer, de datum
      van ontvangst, het aantal, een omschrijving van het wapen met vermelding van het fabrikaat, het land of de plaats
      van vervaardiging, type, kaliber en serienummer, een omschrijving van de munitie met vermelding van fabrikaat,
      het land of de plaats van vervaardiging, type en kaliber, de naam en het adres van degene die ter beproeving heeft
      gegeven, de soort, het nummer en de afgevende instantie van het document waaruit de bevoegdheid blijkt van degene
      die ter beproeving heeft gegeven, gegevens betreffende de doorgifte van het wapen aan degene die het wapen ter
      beproeving heeft gegeven.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.9'
    text: |-
      De erkenninghouder of de in het bewijs van erkenning genoemde beheerder maakt via de elektronische weg onverwijld,
      doch in elk geval binnen een maand, melding bij de korpschef van de in het tweede lid, onder a tot en met d,
      genoemde registraties. Voor de zevende dag van elke kalendermaand verstrekt hij aan de korpschef de door hem in
      die periode ingenomen verloven tot verkrijging. Op verzoek van de korpschef overlegt hij tevens maandelijks via
      de elektronische weg een elektronisch afschrift van het desbetreffende gedeelte van de in het tweede lid onder e
      genoemde registratie.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.10'
    text: |-
      De erkenninghouder of de in het bewijs van erkenning genoemde beheerder die handelt in lucht-,
      gas-, of veerdrukwapens van categorie IV, airsoftapparaat, patroonhouders of -magazijnen bedoeld in
      [artikel 18, onder g][ref1], van deze regeling, stroomstootwapens bedoeld in [artikel 21][ref2], van deze regeling,
      of in noodsignaalmiddelen en bijbehorende munitie bedoeld in [artikel 22, eerste en tweede lid][ref3], van deze
      regeling houdt ten aanzien van de verkoop van die lucht-, gas-, of veerdrukwapens, airsoftapparaten, patroonhouders
      of -magazijnen, stroomstootwapens of noodsignaalmiddelen een register waarin kolomsgewijs en achtereenvolgens wordt
      aangetekend: de datum van overdracht, het aantal, het fabrikaat en type van de overgedragen voorwerpen, de naam en
      het adres van degene aan wie wordt overgedragen, alsmede het soort en nummer van diens legitimatiebewijs. De in dit
      register opgenomen gegevens blijven tenminste gedurende zeven jaren bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0008800#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '18'
        paragraaf: '10'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: '21'
        paragraaf: '11'
      - id: ref3
        bwb_id: BWBR0008800
        artikel: '22'
        paragraaf: '11'
  - number: '12.11'
    text: |-
      De erkenninghouder of de in het bewijs van erkenning genoemde beheerder levert bij beëindiging van zijn
      activiteiten het in eerste lid genoemde register in bij de korpschef.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '12.12'
    text: |-
      Tenminste eenmaal per jaar wordt door de korpschef de werkelijke voorraad opgenomen en gecontroleerd aan de hand
      van registratie die overeenkomstig dit artikel aan korpschef is verstrekt.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel12
  - number: '13'
    text: |-
      Bij verkrijging van wapens van categorie III van personen die een verlof tot het voorhanden hebben als bedoeld
      in [artikel 28 van de wet][ref1] bezitten, dan wel op grond van [artikel 26, tweede lid, van de wet][ref2]
      voor de jacht bestemde wapens voorhanden mogen hebben, verstrekt de erkende, dan wel de beheerder, bedoeld in
      [artikel 9, derde lid, van de wet][ref3], een ontvangstbewijs overeenkomstig het in bijlage III bij deze regeling
      opgenomen model.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel9
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '26'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '9'
  - number: 13a.1
    text: |-
      De markering van een vuurwapen op grond van [artikel 32a, eerste lid, van de wet][ref1] voldoet aan de technische
      specificaties als genoemd in de bijlage bij de Uitvoeringsrichtlijn (EU) 2019/68 van de Commissie van 16 januari
      2019 tot vaststelling van technische specificaties voor de markering van vuurwapens en essentiële onderdelen
      daarvan uit hoofde van [Richtlijn 91/477/EEG](31991L0477) van de Raad inzake de controle op de verwerving en het
      voorhanden hebben van wapens (PbEU 2019, L 15/18).


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel32a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: 32a
  - number: 13a.2
    text: |-
      De voor de markering gebruikte lettergrootte bedraagt ten minste 1,6 millimeter. De markering heeft een diepte van
      ten minste 0,0762 millimeter.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel13a
  - number: 13a.3
    text: |-
      Als de markering in Nederland wordt aangebracht wordt bij de markering het Latijnse alfabet en het Arabisch
      talstelsel gebruikt.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel13a
  - number: 13a.4
    text: |-
      Een wijziging van de in het eerste lid genoemde richtlijn treedt voor de toepassing van dit artikel in werking met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel13a
  - number: '14'
    text: |-
      Van het verbod in [artikel 9, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor het vervaardigen,
      transformeren of in de uitoefening van een bedrijf uitwisselen, verhuren of anderszins ter beschikking stellen,
      herstellen, beproeven of verhandelen van wapens van categorie IV onder 1°, 2°, 3° en 5°.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel9
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '9'
  - number: '15.1'
    text: |-
      Van het verbod in [artikel 9, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor het in de uitoefening
      van een bedrijf ter beschikking stellen van lucht-, gas- en veerdrukwapens van categorie IV, onder 4°, aan
      bezoekers van erkende kermissen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel9
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '9'
  - number: '15.2'
    text: 'De vrijstelling in het eerste lid geldt slechts voor:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel15
  - number: 15.2.a
    text: kermisexploitanten die tijdens de erkende kermis een toegestane attractie exploiteren;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel15
  - number: 15.2.b
    text: gedurende de openingstijden van die kermis; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel15
  - number: 15.2.c
    text: op het terrein van de kermis in de onmiddellijke nabijheid van de attractie.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel15
  - number: '16.1'
    text: |-
      Van het verbod in [artikel 9, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor het ter beschikking
      stellen van lucht-, gas- en veerdrukwapens van categorie IV, onder 4°, aan bezoekers van braderieën, rommelmarkten,
      jaarmarkten, fancy-fairs en soortgelijke evenementen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel9
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '9'
  - number: '16.2'
    text: 'De vrijstelling in het eerste lid geldt slechts:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel16
  - number: 16.2.a
    text: |-
      voor personen die voorafgaande schriftelijke toestemming van de korpschef hebben om de attractie te exploiteren,
      welke toestemming wordt onthouden of ingetrokken indien geen redelijke maatregelen ter voorkoming van letsel en
      schade zijn getroffen, dan wel indien misbruik is te vrezen,
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel16
  - number: 16.2.b
    text: gedurende de openingstijden van het in het eerste lid bedoelde evenement,
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel16
  - number: 16.2.c
    text: op het terrein van het evenement in de onmiddellijke nabijheid van de attractie.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel16
  - number: '17'
    text: |-
      Van het verbod in [artikel 9, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor het vervaardigen en
      transformeren van munitie, voor zover het gaat om herladen:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel9
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '9'
  - number: 17.aº
    text: voor eigen gebruik
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17
  - number: 17.aº.1º
    text: door personen die houder zijn van een jachtakte; of
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17
  - number: 17.aº.2º
    text: |-
      door personen die houder zijn van een verlof tot het voorhanden hebben van wapens en munitie, voor zover het
      betreft munitie die kan worden afgeschoten door middel van een vuurwapen, tot het voorhanden hebben waarvan die
      personen gerechtigd zijn;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17
  - number: 17.bº
    text: |-
      zonder winstoogmerk door een lid van een schietvereniging ten behoeve van andere leden van die vereniging, voor
      zover:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17
  - number: 17.bº.1º
    text: |-
      dit lid daartoe door het bestuur van de vereniging schriftelijk is aangewezen, terwijl van die aanwijzing door
      het bestuur schriftelijk kennis is gegeven aan de korpschef binnen wiens regio het vervaardigen of transformeren
      plaatsvindt; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17
  - number: 17.bº.2º
    text: |-
      dit lid geen andere munitie vervaardigt of transformeert dan die, welke kan worden afgeschoten door middel van een
      vuurwapen, tot het voorhanden hebben waarvan hij is gerechtigd, behoudens de gevallen waarin door de korpschef voor
      dit doeleinde op verzoek van het bestuur van de vereniging een afzonderlijk verlof tot het voorhanden hebben van
      munitie aan het lid is verleend.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17
  - number: 17a.1
    text: |-
      Van het verbod in [artikel 13, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor het overdragen,
      voorhanden hebben en vervoeren van airsoftapparaten voor de beoefening van de airsoftsport in verenigingsverband
      aan personen die ten minste de leeftijd van achttien jaar hebben bereikt en door middel van een bewijs van
      lidmaatschap kunnen aantonen lid te zijn van een door de Minister erkende airsoftvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '13'
  - number: 17a.2
    text: |-
      De vrijstelling ingevolge het eerste lid geldt voor het vervoeren slechts langs de weg en het tijdsbestek welke
      redelijkerwijs voor het vervoer zijn geboden voor:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17a
  - number: 17a.2.a
    text: het vervoeren tussen de woning en de schietbaan;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17a
  - number: 17a.2.b
    text: |-
      het vervoeren tussen de woning en door de airsoftvereniging, bedoeld in het eerste lid, aangewezen bijeenkomsten en
      beurzen in het kader van de airsoftsport of voor de airsoftsport te gebruiken wedstrijdterreinen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17a
  - number: 17a.2.c
    text: het vervoeren tussen de woning en de erkende wapenhandelaar;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17a
  - number: 17a.2.d
    text: het vervoeren van en naar de landsgrens teneinde een airsoftapparaat te doen binnenkomen of uitgaan.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17a
  - number: 17b.1
    text: |-
      Van het verbod in artikel 13, eerste lid, van de wet wordt vrijstelling verleend voor het voorhanden hebben van
      airsoftapparaten voor de beoefening van de airsoftsport in verenigingsverband aan personen die ten minste de
      leeftijd van achttien jaar hebben bereikt en door middel van:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17b
  - number: 17b.1.a
    text: |-
      een bewijs van voorlopig lidmaatschap kunnen aantonen aspirant-lid te zijn van de airsoftvereniging, bedoeld in
      [artikel 17a, eerste lid][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17b.1.b
    text: |-
      een bewijs kunnen aantonen door de airsoftvereniging, bedoeld in [artikel 17a, eerste lid][ref1], als introducé te
      zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17b.2
    text: |-
      Van het verbod in artikel 13, eerste lid, van de wet wordt aan een persoon als bedoeld in
      [artikel 17a, eerste lid][ref1], vrijstelling verleend voor het overdragen van airsoftapparaten aan personen
      als bedoeld in het eerste lid, onder a en b, en wordt aan laatstbedoelde personen vrijstelling verleend voor het
      overdragen van airsoftapparaten aan personen als bedoeld in artikel 17a, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17b
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17c.1
    text: |-
      Van het verbod in artikel 13, eerste lid, van de wet wordt vrijstelling verleend voor het dragen van
      airsoftapparaten op voor het publiek toegankelijke plaatsen, met uitzondering van de openbare weg.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17c
  - number: 17c.2
    text: 'De vrijstelling ingevolge het eerste lid geldt slechts:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17c
  - number: 17c.2.a
    text: |-
      voor personen als bedoeld in [artikel 17a, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17c.2.b
    text: |-
      voor personen als bedoeld in [artikel 17b, eerste lid, onder a en b][ref1], indien en zolang zij tezamen met een
      persoon als bedoeld in [artikel 17a, eerste lid][ref2], de airsoftsport beoefenen;


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17b
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17b
        paragraaf: 9a
      - id: ref2
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17c.2.c
    text: |-
      voor de beoefening van door de airsoftvereniging, bedoeld in [artikel 17a, eerste lid][ref1], georganiseerde
      airsoftsport ten behoeve waarvan voorafgaande schriftelijke toestemming van de korpschef is verleend, welke
      toestemming in ieder geval wordt onthouden of ingetrokken indien geen redelijke maatregelen ter voorkoming van
      bedreiging en afdreiging door de airsoftapparaten zijn getroffen, dan wel indien misbruik is te vrezen;


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17c
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17c.2.d
    text: gedurende de tijden waarop het sportevenement plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17c
  - number: 17c.2.e
    text: |-
      op het terrein van het evenement in de onmiddellijke nabijheid van de plaats waar de airsoftsport daadwerkelijk
      wordt beoefend.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17c
  - number: 17d.1
    text: |-
      Van het verbod in artikel 13, eerste lid, van de wet wordt vrijstelling verleend aan erkenninghouders en personen
      als bedoeld in [artikel 17a, eerste lid][ref1], voor het doen binnenkomen of doen uitgaan van airsoftapparaten die
      zodanig zijn verpakt dat zij niet voor onmiddellijk gebruik kunnen worden aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17d
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17d.2
    text: |-
      Van het verbod in artikel 13, eerste lid, van de wet wordt vrijstelling verleend aan erkenninghouders voor
      het vervaardigen, transformeren, voor derden herstellen, overdragen, voorhanden hebben en vervoeren van
      airsoftapparaten.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17d
  - number: 17e.1
    text: |-
      Van het verbod in artikel 13, eerste lid, van de wet wordt vrijstelling verleend aan in het buitenland wonende
      personen, voor het doen binnenkomen of uitgaan van airsoftapparaten.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17e
  - number: 17e.2
    text: 'De vrijstelling ingevolge het eerste lid geldt slechts:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17e
  - number: 17e.2.a
    text: |-
      voor personen die blijkens een schriftelijke uitnodiging of verklaring van de airsoftvereniging, bedoeld in
      [artikel 17a, eerste lid][ref1], gedurende een daarin vermeld tijdvak in Nederland de airsoftsport gaan beoefenen
      of hebben beoefend en die in het land van herkomst bevoegd zijn de meegebrachte airsoftapparaten voorhanden te
      hebben;


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel17a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17e
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 17a
        paragraaf: 9a
  - number: 17e.2.b
    text: vanaf de tweede dag voor, tot en met de tweede dag na het in onderdeel a bedoelde tijdvak.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17e
  - number: 17f.1
    text: |-
      Van het verbod van artikel 13, eerste lid van de wet wordt voor het vervoeren van airsoftapparaten vrijstelling
      verleend aan personen die in de uitoefening van een beroep of bedrijf zaken vervoeren.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17f
  - number: 17f.2
    text: 'De vrijstelling in het eerste lid geldt slechts:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17f
  - number: 17f.2.a
    text: |-
      voor zover het vervoer plaats vindt in opdracht van degene die bevoegd is het airsoftapparaat voorhanden te hebben
      en te vervoeren;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17f
  - number: 17f.2.b
    text: indien de ontvanger bevoegd is het airsoftapparaat voorhanden te hebben; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17f
  - number: 17f.2.c
    text: |-
      voor zover uit tijdens het vervoer aanwezige documenten blijkt dat aan de in het eerste lid, alsmede aan de in dit
      lid onder a en b genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17f
  - number: 17g.1
    text: |-
      Van het verbod van artikel 13, eerste lid van de wet wordt voor het vervoeren van airsoftapparaten vrijstelling
      verleend aan personen in dienst van erkenninghouders.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17g
  - number: 17g.2
    text: 'De vrijstelling in het eerste lid geldt slechts indien:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17g
  - number: 17g.2.a
    text: het airsoftapparaten betreft waarop de erkenning betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17g
  - number: 17g.2.b
    text: |-
      het vervoer plaatsvindt in opdracht van de erkenninghouder, dan wel de beheerder in het bedrijf waaraan de
      erkenning is verleend;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17g
  - number: 17g.2.c
    text: het vervoer noodzakelijk is voor de goede uitvoering van de handelingen waarop de erkenning betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17g
  - number: 17g.2.d
    text: de erkenninghouder, onderscheidenlijk de beheerder bevoegd is de airsoftapparaten te vervoeren; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17g
  - number: 17g.2.e
    text: |-
      uit tijdens het vervoer aanwezige documenten blijkt dat aan de in het eerste lid, alsmede aan de in dit lid onder a
      tot en met d genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17g
  - number: 17h
    text: |-
      Van het verbod van [artikel 13, eerste lid, van de wet][ref1] wordt voor het voorhanden hebben van airsoftapparaten
      vrijstelling verleend aan kleine erkenninghouders voor zover het een bedrijf betreft waarin uitsluitend wapens
      worden gegraveerd of geblauwd, dan wel aan een andere oppervlaktebehandeling worden onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel17h
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '13'
  - number: '18.1'
    text: |-
      Onverminderd het bepaalde in [artikel 3][ref1] van deze regeling wordt van het verbod
      in [artikel 14, eerste lid][ref2], [22, eerste lid][ref3], [26, eerste lid][ref4], en
      [31, eerste lid, van de wet][ref5] vrijstelling verleend voor het doen binnenkomen of uitgaan, vervoeren,
      voorhanden hebben en overdragen van:


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0008804#Artikel31
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0008804
        artikel: '31'
  - number: 18.1.a
    text: |-
      vuurwapens die voor gebruik als zodanig ongeschikt zijn gemaakt op de wijze, beschreven in Bijlage I ‘Technische
      specificaties voor de onbruikbaarmaking van vuurwapens’ bij de Uitvoeringsverordening (EU) 2015/2403 van de
      Commissie van 15 december 2015 tot vaststelling van gemeenschappelijke richtsnoeren betreffende normen en
      technieken om te waarborgen dat onbruikbaar gemaakte vuurwapens voorgoed onbruikbaar zijn (PbEU 2015, L333/62);
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.b
    text: vuurwapens die zijn vervaardigd vóór 1 januari 1870;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.c
    text: |-
      vuurwapens in de vorm van geweren, revolvers, pistolen en combinatiewapens die ontworpen en bestemd zijn om te
      worden geladen met:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.c.1º
    text: losse kogels en zwart kruit; of
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.c.2º
    text: patronen, uitgezonderd randvuurpatronen in het kaliber .22 en centraalvuurpatronen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.d
    text: |-
      vuurwapens in de vorm van geweren en pistolen, niet zijnde revolvers, die ontworpen en bestemd zijn om te worden
      geladen met patronen waarvan de voortdrijvende lading bestaat uit zwart kruit of alleen ontstekingsas, met
      uitzondering van randvuurpatronen in het kaliber .22 met een patroonlengte van meer dan 18 mm;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.e
    text: |-
      geschut dat ontworpen en bestemd is om te worden geladen met losse projectielen en zwart kruit, los of in
      kardoezen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.f
    text: kennelijk gebruikte lege patroon- en kardoeshulzen bestemd voor dan wel deel uitmakend van een verzameling;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.g
    text: |-
      patroonmagazijnen en patroonhouders voorzover het personen betreft die bevoegd zijn de wapens of de munitie
      waarvoor deze voorwerpen bestemd zijn voorhanden te hebben;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.1.i
    text: |-
      projectielen en hulzen, eventueel samengevoegd tot patronen, die een onderdeel vormen van een monster-, verzamel-
      of overzichtsbord, voor zover zij niet zijn voorzien van een ontstekende, voortdrijvende of brisante lading en
      voorzover zij op deugdelijke wijze permanent op het bord bevestigd zijn.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: '18.2'
    text: |-
      De vrijstellingen zoals vermeld onder c, d en e zijn uitsluitend van toepassing op wapens die zijn vervaardigd vóór
      1 januari 1945.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: '18.3'
    text: |-
      De vrijstellingen van het eerste lid, aanhef en onderdeel a, gelden voor de volgende categorieën vuurwapens, mits
      van het voorhanden hebben van deze wapens melding is gedaan bij de korpschef:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18.3.i
    text: |-
      Vuurwapens die op of na 8 april 2016 voor gebruik als zodanig ongeschikt zijn gemaakt uitsluitend indien uit
      een certificaat afgegeven door de in [artikel 43 van de wet][ref1] genoemde bevoegde autoriteit voor de controle
      blijkt dat het betreffende vuurwapen voor gebruik als zodanig ongeschikt is gemaakt op de wijze, beschreven in
      Bijlage I ‘Technische specificaties voor de onbruikbaarmaking van vuurwapens’ bij de Uitvoeringsverordening (EU)
      2018/337 van de Commissie van 5 maart 2018 tot wijziging van Uitvoeringsverordening (EU) 2015/2403 tot vaststelling
      van gemeenschappelijke richtsnoeren betreffende normen en technieken om te waarborgen dat onbruikbaar gemaakte
      vuurwapens voorgoed onbruikbaar zijn (PbEU 2018, L 65/1)


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel43
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '43'
  - number: 18.3.ii
    text: |-
      Vuurwapens die vóór 8 april 2016 voor gebruik als zodanig ongeschikt zijn gemaakt volgens deze bepaling zoals deze
      luidde vóór 8 april 2016, tenzij de vuurwapens naar een andere lidstaat worden overgebracht of op de markt zijn
      gebracht, zoals bedoeld in artikel 1, tweede lid, van de voornoemde verordening.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: '18.4'
    text: |-
      Een wijziging van de in het eerste lid genoemde bijlage gaat voor de toepassing van de Regeling wapens en munitie
      gelden met ingang van de dag waarop aan de betrokken wijziging uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18
  - number: 18a.1
    text: |-
      Van het verbod in [artikel 22, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het vervoeren van
      munitie en onderdelen van munitie van categorie II, uitsluitend voor de houders van een verlof tot vervoer van
      munitie van categorie III.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '22'
  - number: 18a.2
    text: |-
      Van het verbod in [artikel 26, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het voorhanden
      hebben van munitie en onderdelen van munitie van categorie II, uitsluitend voor de houders van een verlof tot het
      voorhanden hebben van munitie van categorie III.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '26'
  - number: 18a.3
    text: 'De vrijstellingen ingevolge het eerste en het tweede lid, gelden slechts voor zover:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18a
  - number: 18a.3.a
    text: |-
      de bevoegdheden van de houder van het verlof tot voorhanden hebben, onderscheidenlijk het verlof tot vervoer, met
      betrekking tot munitie van categorie II niet verder reiken dan die met betrekking tot de munitie van categorie III;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18a
  - number: 18a.3.b
    text: de munitie of onderdelen van munitie passen binnen de op het verlof omschreven specialisatie;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18a
  - number: 18a.3.c
    text: munitie met een kaliber boven de 12.7 mm (.50) niet voorzien is van brisante ladingen; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18a
  - number: 18a.3.d
    text: |-
      munitie met een kaliber boven de 19 mm niet voorzien is van brisante ladingen en bovendien geen voortdrijvende
      ladingen bevat.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18a
  - number: 18b.1
    text: |-
      Van het verbod van [artikel 13, eerste lid][ref1], [artikel 14, eerste lid][ref2], [artikel 22, eerste lid][ref3],
      en [artikel 26, eerste en vijfde lid, van de wet][ref4], wordt vrijstelling verleend aan bewakingspersoneel
      van geldtransporten als bedoeld in artikel 1, onder i, van de Verordening (EU) Nr. 1214/2011 van de Europees
      Parlement en de Raad van 16 november 2011 betreffende professioneel grensoverschrijdend transport van eurocontanten
      over de weg tussen lidstaten van de eurozone (PbEU 2011, L316) voor het doen binnenkomen en doen uitgaan, het
      vervoeren en het voorhanden hebben van wapens van categorie I, II, III en IV en de bijbehorende munitie tijdens
      grensoverschrijdend transport van eurocontanten over de weg als bedoeld in artikel 1, onder b, van de genoemde
      verordening, voor zover het recht van de lidstaat van herkomst, bedoeld in artikel 1, onder e, van de verordening,
      de lidstaat van doorvoer, bedoeld in artikel 1, onder g, van de verordening, of de lidstaat van ontvangst, bedoeld
      in artikel 1, onder f, van de verordening, toestaat of verplicht dat genoemd bewakingspersoneel wapens draagt.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18b
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '26'
  - number: 18b.2
    text: 'De vrijstelling van het eerste lid geldt slechts, voor zover:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18b
  - number: 18b.2.a
    text: |-
      de wapens bij betreding van Nederlands grondgebied aan boord van het geldtransportvoertuig, bedoeld in artikel 1,
      onder j, van de verordening, worden opgeborgen in een brandkast voor wapens die voldoet aan de norm, genoemd in
      artikel 6, tweede lid, van de verordening en;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18b
  - number: 18b.2.b
    text: |-
      de wapens gedurende het gehele transport op Nederlands grondgebied ontoegankelijk blijven voor het
      bewakingspersoneel, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel18b
  - number: '19.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid][ref1], het verbod van [artikel 22, eerste lid][ref2], en het verbod van
      [artikel 26, eerste lid, van de wet][ref3], wordt vrijstelling verleend voor bij schiethamers behorende munitie.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '26'
  - number: '19.2'
    text: |-
      De vrijstelling ingevolge het eerste lid geldt slechts voor de munitie die behoort bij schiethamers waarvoor een
      certificaat van goedkeuring als bedoeld in [artikel 12, zesde lid, van het Warenwetbesluit schiethamers][ref1]
      is afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0002558#Artikel12
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002558
        artikel: '12'
  - number: '20'
    text: |-
      Van het verbod van [artikel 14, eerste lid][ref1], [artikel 22, eerste lid][ref2], en
      [artikel 26, eerste lid, van de wet][ref3], wordt vrijstelling verleend voor het doen binnenkomen of uitgaan,
      vervoeren en voorhanden hebben van munitie, bestemd voor wapens die het karakter dragen van oudheden of replica’s
      daarvan, voorzover deze munitie bestaat uit ronde loden kogels.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '26'
  - number: 20a
    text: |-
      Van de in [artikel 32a, eerste, tweede en derde lid][ref1] en [32b, van de wet][ref2] gestelde eisen, wordt
      vrijstelling verleend voor vuurwapens en munitie, bestemd voor dan wel deel uitmakend van:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel32a
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel32b
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: 32a
      - id: ref2
        bwb_id: BWBR0008804
        artikel: 32b
  - number: 20a.a
    text: |-
      verzamelingen van individuele wapen- of munitieverzamelaars die in georganiseerd verband serieuze studie maken
      van de historische of technische ontwikkeling van vuurwapens of munitie, waarvoor verlof is verleend op grond van
      [artikel 28 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
  - number: 20a.b
    text: |-
      verzamelingen van algemeen en wetenschappelijk belang, waarvoor verlof is verleend op grond van
      [artikel 28 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
  - number: 20b.1
    text: |-
      Van het verbod in [artikel 13, eerste lid, van de wet][ref1], wordt tot 1 maart 2013
      vrijstelling verleend voor het voorhanden hebben en vervoeren van wapens, genoemd in
      [artikel 2, eerste lid, categorie I, onderdeel 1°, van de wet][ref2], een en ander indien het lemmet:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel2
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '2'
  - number: 20b.1.a
    text: niet meer dan een snijkant heeft;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
  - number: 20b.1.b
    text: korter is dan 7 cm en breder is dan 14 mm;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
  - number: 20b.1.c
    text: korter is dan 9 cm; of
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
  - number: 20b.1.d
    text: niet van een stootplaat is voorzien.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
  - number: 20b.2
    text: 'De vrijstelling, genoemd in het eerste lid, is slechts van toepassing op wapens die deel uitmaken van:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
  - number: 20b.2.a
    text: |-
      verzamelingen van individuele wapenverzamelaars die serieuze studie maken van de historische of technische
      ontwikkeling van wapens;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
  - number: 20b.2.b
    text: verzamelingen van algemeen en wetenschappelijk belang.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel20b
  - number: '21.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid][ref1], [artikel 22, eerste lid][ref2], [artikel 26, eerste lid][ref3]
      en [artikel 27 eerste lid, van de wet][ref4], wordt vrijstelling verleend voor het doen binnenkomen of uitgaan,
      vervoeren, voorhanden hebben en dragen van voorwerpen waarmee door een elektrische stroomstoot personen weerloos
      kunnen worden gemaakt of pijn kan worden toegebracht, aan personen die zich bezighouden met de beroepsmatige
      uitoefening van de veehouderij, het transport van vee, of de medische behandeling daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '27'
  - number: '21.2'
    text: |-
      De vrijstelling in het eerste lid geldt voorzover het dragen betreft uitsluitend op het moment dat de in het eerste
      lid genoemde activiteiten daadwerkelijk plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel21
  - number: '22.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid][ref1], [22, eerste lid][ref2], [26, eerste lid][ref3] en
      [27, eerste lid, van de wet][ref4] wordt vrijstelling verleend voor het doen binnenkomen of uitgaan, vervoeren,
      voorhanden hebben en dragen van noodsignaalmiddelen en de daarbij behorende lichtsignaal- of rooksignaalpatronen
      door personen van 18 jaar of ouder.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '26'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '26'
  - number: '22.2'
    text: 'De vrijstelling ingevolge het eerste lid geldt slechts indien:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: 22.2.1º
    text: de noodsignaalmiddelen
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: 22.2.1º.aº
    text: van een kleiner kaliber zijn dan kaliber 12 (18,2 mm);
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: 22.2.1º.a
    text: uitsluitend geschikt zijn voor het verschieten van noodsignaalmunitie;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: 22.2.1º.b
    text: zijn vervaardigd van kunststof of lichtmetaal;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: 22.2.1º.c
    text: niet de vorm hebben van een geweer, pistool of revolver;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: 22.2.1º.d
    text: door middel van gravering zijn voorzien van de postcode en het huisnummer van de eigenaar; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: 22.2.2º
    text: |-
      de in het eerste lid genoemde handelingen in directe relatie staan tot het vergroten van de veiligheid aan boord
      van een vaartuig.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel22
  - number: '23.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid, van de wet][ref1], wordt vrijstelling verleend aan in het buitenland
      wonende personen van 18 jaar en ouder die met hun vaartuig een vaste ligplaats in Nederland hebben, voor het doen
      binnenkomen of uitgaan van andere noodsignaalmiddelen dan bedoeld in [artikel 22, tweede lid, onder 1][ref2], van
      deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: '22'
        paragraaf: '11'
  - number: '23.2'
    text: |-
      De vrijstelling ingevolge het eerste lid geldt slechts voor personen die de meegevoerde noodsignaalmiddelen in
      Nederland krachtens een verlof voorhanden mogen hebben.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel23
  - number: '24'
    text: |-
      Van het verbod in [artikel 22, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het vervoeren
      van andere noodsignaalmiddelen dan bedoeld in [artikel 22, tweede lid][ref2], van deze regeling, aan de door
      de Minister van Infrastructuur en Milieu aangewezen ambtenaren van de Markeerdienst van het Ministerie van
      Infrastructuur en Milieu.’


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: '22'
        paragraaf: '11'
  - number: '25'
    text: |-
      Van het verbod in [artikel 26, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het voorhanden
      hebben van andere noodsignaalmiddelen dan bedoeld in artikel 22, tweede lid, aan zeeverkeersambtenaren van het
      Ministerie van Infrastructuur en Milieu, in de daartoe door de Minister van Infrastructuur en Milieu aangewezen
      zeeverkeersposten.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '26'
  - number: '26.1'
    text: |-
      Van het verbod in [artikel 26, vijfde lid, van de wet][ref1] wordt vrijstelling verleend voor het voorhanden hebben
      van degens, lucht-, gas-, en veerdrukwapens van categorie IV, alsmede van kruisbogen, aan personen die de leeftijd
      van 18 jaar nog niet hebben bereikt, voor de beoefening van sporten in verenigingsverband.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '26'
  - number: '26.2'
    text: |-
      De vrijstelling ingevolge het eerste lid geldt slechts voor personen die door middel van een bewijs van
      lidmaatschap kunnen aantonen lid te zijn van een vereniging waarbinnen de sportbeoefening met behulp van een of
      meer van de in het eerste lid bedoelde voorwerpen plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel26
  - number: '26.3'
    text: |-
      Voorzover het lucht-, gas- of veerdrukwapens betreft geldt, in afwijking van het tweede lid, de vrijstelling in het
      eerste lid slechts voor:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel26
  - number: 26.3.a
    text: |-
      personen die door middel van een bewijs van lidmaatschap kunnen aantonen ten minste drie maanden lid te zijn van
      een schietvereniging, zoals bedoeld in [artikel 1, eerste lid, onder g][ref1], van deze regeling; en


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel1
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '1'
        paragraaf: '1'
  - number: 26.3.b
    text: |-
      lucht-, gas- en veerdrukwapens die zijn toegelaten in het Schiet- en wedstrijdreglement van de Koninklijke
      Nederlandse Schutters Associatie.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel26
  - number: '27.1'
    text: |-
      Van het verbod van [artikel 31, vierde lid, van de wet][ref1] wordt vrijstelling verleend voor het overdragen
      aan personen die de leeftijd van 18 jaar nog niet hebben bereikt van degens, lucht-, gas-, en veerdrukwapens van
      categorie IV, en van kruisbogen, een en ander met het oog op in verenigingsverband beoefende sporten.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel31
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '31'
  - number: '27.2'
    text: |-
      De vrijstelling ingevolge het eerste lid geldt voorzover het lucht-, gas-, of veerdrukwapens betreft uitsluitend
      indien:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: 27.2.a
    text: |-
      de persoon aan wie de in het eerste lid bedoelde voorwerpen worden overgedragen een verklaring, die niet ouder is
      dan veertien dagen, van het bestuur van de vereniging overlegt, waaruit blijkt dat hij tenminste 3 maanden lid is
      van een schietvereniging, zoals bedoeld in [artikel 1, eerste lid, onder g][ref1], van deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel1
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '1'
        paragraaf: '1'
  - number: 27.2.b
    text: |-
      het betreft lucht-, gas- en veerdrukwapens die zijn toegelaten in het Schiet- en wedstrijdreglement van de
      Koninklijke Nederlandse Schutters Associatie; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: 27.2.c
    text: |-
      de onder a bedoelde verklaring door degene die het wapen overdraagt in ontvangst wordt genomen, welke verklaring,
      nadat de datum van overdracht daarop door hem is aangetekend, tenminste vijf jaar na de overdracht van het wapen
      wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: '27.3'
    text: 'Buiten het geval bedoeld in het tweede lid geldt de vrijstelling in het eerste lid slechts indien:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: 27.3.a
    text: |-
      de persoon aan wie de in het eerste lid bedoelde voorwerpen worden overdragen een verklaring, die niet ouder is dan
      veertien dagen, van het bestuur van de vereniging overlegt waaruit blijkt dat:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: 27.3.a.1º
    text: die vereniging de serieuze sportbeoefening met een of meer van het over te dragen voorwerp tot doel heeft; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: 27.3.a.2º
    text: de in het eerste lid bedoelde persoon lid is van die vereniging; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: 27.3.b
    text: |-
      de onder a bedoelde verklaring door degene die het wapen overdraagt in ontvangst wordt genomen, welke verklaring,
      nadat de datum van overdracht daarop door hem is aangetekend, tenminste vijf jaar na de overdracht van het wapen
      wordt bewaard.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel27
  - number: '28.1'
    text: |-
      Van het verbod in [artikel 27, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor het dragen van
      degens, lucht-, gas-, en veerdrukwapens van categorie IV, alsmede van kruisbogen op voor het publiek toegankelijke
      plaatsen, met uitzondering van de openbare weg.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '27'
  - number: '28.2'
    text: 'De vrijstelling ingevolge het eerste lid geldt uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel28
  - number: 28.2.a
    text: voor personen die bevoegd zijn de wapens voorhanden te hebben;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel28
  - number: 28.2.b
    text: |-
      voor de beoefening van sporten in verenigingsverband ten behoeve waarvan voorafgaande schriftelijke toestemming
      door de korpschef is verleend, welke toestemming wordt onthouden of ingetrokken indien geen redelijke maatregelen
      ter voorkoming van letsel en schade zijn getroffen, dan wel indien misbruik is te vrezen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel28
  - number: 28.2.c
    text: gedurende de tijden waarop het sportevenement plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel28
  - number: 28.2.d
    text: |-
      op het terrein van het evenement in de onmiddellijke nabijheid van de plaats waar de sport daadwerkelijk wordt
      beoefend.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel28
  - number: '29'
    text: |-
      Van het verbod van [artikel 27, eerste lid, van de wet][ref1] wordt vrijstelling verleend voor:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '27'
  - number: 29.a
    text: |-
      het dragen van lucht-, gas- en veerdrukwapens van categorie IV aan personen aan wie deze overeenkomstig
      [artikel 15][ref1] of [artikel 16][ref2] van deze regeling ter beschikking worden gesteld. Artikel 15, tweede lid,
      onder b en c, en artikel 16, tweede lid, onder b en c, van deze regeling zijn van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel16
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '15'
        paragraaf: '9'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: '16'
        paragraaf: '9'
  - number: 29.b
    text: |-
      het dragen van een wapen van categorie IV, onder 1°, aan personen ten aanzien van wie het wapen deel uitmaakt van
      hun duikuitrusting tijdens de beoefening van de duiksport.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel29
  - number: '30.1'
    text: |-
      Van het verbod van [artikel 27, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het dragen van
      een wapen van categorie IV, aan personen ten aanzien van wie het wapen deel uitmaakt van hun officiële ceremonieel
      tenue.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '27'
  - number: '30.2'
    text: |-
      De vrijstelling in het eerste lid geldt uitsluitend op de tijdstippen dat de ambtskleding of het officiële
      ceremonieel tenue daadwerkelijk wordt gedragen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel30
  - number: '31.1'
    text: |-
      Van het verbod van [artikel 27, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het in een optocht
      meevoeren van wapens van categorie III of IV.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '27'
  - number: '31.2'
    text: 'De vrijstelling ingevolge het eerste lid geldt slechts indien:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel31
  - number: 31.2.a
    text: de wapens worden meegevoerd door personen die op grond van de wet bevoegd zijn die wapens voorhanden te hebben, en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel31
  - number: 31.2.b
    text: |-
      de burgemeester in de gemeente waar de optocht wordt gehouden schriftelijk heeft verklaard tegen het meevoeren van
      de in de verklaring omschreven wapens geen bedenkingen te hebben.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel31
  - number: '32.1'
    text: |-
      Van het verbod van [artikel 27, eerste lid, van de wet][ref1], wordt vrijstelling verleend aan door de Minister
      van Defensie erkende studentenweerbaarheidsverenigingen voor het dragen van wapens van categorie III, welke door de
      krijgsmacht ter beschikking zijn gesteld en van wapens van categorie IV, onder 2°.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '27'
  - number: '32.2'
    text: 'De vrijstelling ingevolge het eerste lid geldt slechts indien:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel32
  - number: 32.2.a
    text: |-
      in uniform gekleed en in onderling verband wordt opgetreden tot het verrichten van eerbetoon, het deelnemen aan een
      optocht of een afstandsmars dan wel het oefenen voor een van deze gelegenheden;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel32
  - number: 32.2.b
    text: |-
      voorzover vuurwapens worden gedragen, de vereniging op grond van een verlof bevoegd is die vuurwapens voorhanden te
      hebben; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel32
  - number: 32.2.c
    text: |-
      de Minister van Defensie voor het dragen van de ter beschikking gestelde wapens tijdens het onder a bedoelde
      optreden toestemming heeft verleend, en de burgemeester in de gemeente waar wordt opgetreden daartegen geen
      bedenkingen heeft.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel32
  - number: '33'
    text: |-
      Van het verbod van [artikel 14, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het aan boord van
      een schip dat op grond van voor Nederland geldende rechtsregels gerechtigd is de vlag van het Koninkrijk te voeren
      of luchtvaartuig tijdelijk doen uitgaan en binnenkomen van wapens van categorie III en de bijbehorende munitie die
      behoren tot de uitrusting van dat schip of luchtvaartuig en die krachtens een verlof aan boord voorhanden gehouden
      mogen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
  - number: '34.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor doen binnenkomen en
      tijdelijk doen uitgaan van wapens en munitie die behoren tot de uitrusting van een buitenlands schip dan wel tot de
      persoonlijke bezittingen van de gezagvoerder of de andere bemanningsleden.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
  - number: '34.2'
    text: 'De vrijstelling ingevolge het eerste lid geldt slechts voor:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel34
  - number: 34.2.a
    text: |-
      wapens en munitie die aan boord van het schip blijven en die onder douaneverzegeling worden gehouden en die
      schriftelijk bij de douane zijn gemeld; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel34
  - number: 34.2.b
    text: |-
      wapens van categorie III en de bijbehorende munitie die aan boord van het schip blijven en die buiten
      douaneverzegeling worden gelaten, voor zover zulks noodzakelijk is voor de beveiliging van het schip, de opvarenden
      of de lading, dan wel voor de handhaving van de orde aan boord van het schip.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel34
  - number: 38a
    text: |-
      De in de [artikelen 34, tweede lid, onderdeel a][ref1], en [40, derde lid][ref2], genoemde melding omvat een
      omschrijving van de goederen alsmede de vermelding van:


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel40
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '34'
        paragraaf: '14'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: '40'
        paragraaf: '15'
  - number: 38a.a
    text: de hoeveelheid goederen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel38a
  - number: 38a.b
    text: de bestemming en, indien deze afwijkend is, de eindbestemming van de goederen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel38a
  - number: 38a.c
    text: het vervoermiddel waarin de goederen zich bevinden;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel38a
  - number: 38a.d
    text: de voorziene plaats van uitgaan uit Nederland en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel38a
  - number: 38a.e
    text: |-
      de naam van degene die de aangifte of kennisgeving doet en, indien dat een ander is dan degene die het
      beschikkingsrecht heeft over de goederen, de naam van laatstbedoelde persoon.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel38a
  - number: '39.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid][ref1] en [22, eerste lid van de wet][ref2], wordt vrijstelling verleend
      aan de houder van een geldige jachtakte, voor zover het betreft het ter beoefening door hem van de jacht tijdelijk
      doen uitgaan of binnenkomen, alsmede vervoeren, van de in die jachtakte omschreven jachtgeweren, die zodanig zijn
      verpakt dat zij niet voor onmiddellijk gebruik kunnen worden aangewend, alsmede voor ten hoogste 1000 patronen voor
      die geweren tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '22'
  - number: '39.2'
    text: |-
      De vrijstelling ingevolge het eerste lid geldt voor de houder van een jachtakte als bedoeld in artikel 16a van de
      Jachtwet vanaf de zevende dag vóór tot en met de zevende dag ná het tijdvak waarvoor die jachtakte geldig is.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel39
  - number: '39.3'
    text: |-
      Voor ingezetenen van één van de bij de Europese Unie aangesloten lidstaten geldt de vrijstelling slechts indien
      zij beschikken over een door de autoriteiten in die lidstaat afgegeven Europese vuurwapenpas waarop de wapens zijn
      vermeld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel39
  - number: '40.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid][ref1] en [artikel 22, eerste lid, van de wet][ref2] wordt vrijstelling
      verleend ten behoeve van doorvoer, anders dan per vliegtuig, van jachtgeweren en daarbij behorende munitie, die
      zodanig zijn verpakt dat zij niet voor onmiddellijk gebruik kunnen worden aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '22'
  - number: '40.2'
    text: |-
      Voor ingezetenen van één van de bij de Europese Unie aangesloten lidstaten geldt de vrijstelling ingevolge het
      eerste en tweede lid slechts indien zij beschikken over een door de autoriteiten in die lidstaat afgegeven Europese
      vuurwapenpas waarop de wapens zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel40
  - number: '40.3'
    text: |-
      Voor niet-ingezetenen van de Europese Unie geldt de in het eerste lid bedoelde vrijstelling uitsluitend indien de
      jachtgeweren en de daarbij behorende munitie bij de douane schriftelijk zijn gemeld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel40
  - number: '41.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid, van de wet][ref1], wordt vrijstelling verleend aan in het buitenland
      wonende sportschutters, voor het doen binnenkomen of uitgaan van vuurwapens van categorie III, die zodanig zijn
      verpakt dat zij niet voor onmiddellijk gebruik kunnen worden aangewend, alsmede van ten hoogste 1000 patronen voor
      die vuurwapens tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
  - number: '41.2'
    text: |-
      Van het verbod van [artikel 22, eerste lid][ref1] en [artikel 26 eerste lid, van de wet][ref2] wordt vrijstelling
      verleend aan in het buitenland wonende sportschutters voor het vervoer en het voorhanden hebben van vuurwapens en
      munitie van categorie III.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '26'
  - number: '41.3'
    text: De vrijstelling ingevolge het eerste en tweede lid geldt slechts
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel41
  - number: 41.3.a
    text: |-
      voor sportschutters die blijkens een schriftelijke uitnodiging of verklaring van een Nederlandse schietvereniging
      gedurende een daarin vermeld tijdvak in Nederland de schietsport gaan beoefenen of hebben beoefend en die in het
      land van herkomst bevoegd zijn de meegebrachte vuurwapens of munitie voorhanden te hebben;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel41
  - number: 41.3.b
    text: |-
      vanaf de tweede dag voor tot en met de tweede dag na de onder onderdeel a bedoelde uitnodiging of verklaring
      vermelde tijdvak.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel41
  - number: '41.4'
    text: |-
      Voor ingezetenen van één van de bij de Europese Unie aangesloten lidstaten geldt de vrijstelling ingevolge het
      eerste en tweede lid slechts indien zij beschikken over een door de autoriteiten in die lidstaat afgegeven Europese
      vuurwapenpas waarop de wapens zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel41
  - number: '42.1'
    text: |-
      Van het verbod van [artikel 14, eerste lid, van de wet][ref1], wordt vrijstelling verleend aan in Nederland wonende
      sportschutters voor het doen binnenkomen of uitgaan van vuurwapens van categorie III die zodanig zijn verpakt
      dat zij niet voor onmiddellijk gebruik kunnen worden aangewend, alsmede van ten hoogste 1000 patronen voor die
      vuurwapens tezamen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
  - number: '42.2'
    text: 'De vrijstelling ingevolge het eerste lid geldt slechts voor de sportschutters die:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42
  - number: 42.2.a
    text: |-
      blijkens een schriftelijke uitnodiging of verklaring van een schietvereniging in het buitenland de schietsport gaan
      beoefenen dan wel hebben beoefend, en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42
  - number: 42.2.b
    text: de meegevoerde vuurwapens en munitie in Nederland krachtens een verlof voorhanden mogen hebben.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42
  - number: 42a.1
    text: |-
      Van het verbod van [artikel 14, eerste lid][ref1], en [22, eerste lid, van de wet][ref2], wordt vrijstelling
      verleend aan personen die een ontheffing op grond van [artikel 4 van de wet][ref3] of verlof op grond van
      [artikel 28 van de wet][ref4] hebben ten behoeve van het nabootsen van historische gebeurtenissen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel28
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '28'
  - number: 42a.2
    text: |-
      De vrijstelling ingevolge het eerste lid geldt slechts voor personen die deelnemen aan het nabootsen van
      historische gebeurtenissen die:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42a
  - number: 42a.2.a
    text: |-
      blijkens een schriftelijke uitnodiging of verklaring van een re-enactment- of soortgelijke vereniging in het
      buitenland als deelnemer deel gaan nemen aan activiteiten bij het naspelen van historische gebeurtenissen in het
      land van bestemming, en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42a
  - number: 42a.2.b
    text: de meegevoerde vuurwapens en patronen in Nederland krachtens een verlof voorhanden mogen hebben.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel42a
  - number: '43.1'
    text: |-
      Houders van een verlof tot het voorhanden hebben, zoals bedoeld in [artikel 28, eerste lid, van de wet][ref1],
      mogen ten hoogste vijf wapens voorhanden hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
  - number: '43.2'
    text: Houders van een jachtakte, mogen ten hoogste zes wapens voorhanden hebben.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43
  - number: '43.3'
    text: |-
      Het eerste lid en tweede lid is niet van toepassing op houders van een verlof tot het voorhanden hebben,
      onderscheidenlijk een jachtakte die aantonen dat zes, respectievelijk zeven, of meer wapens voor hen onontbeerlijk
      zijn voor de beoefening van de schietsport, onderscheidenlijk de jacht.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43
  - number: '43.4'
    text: |-
      Een aanvrager van een verlof tot het voorhanden hebben van wapens en munitie, zoals bedoeld in
      [artikel 28, eerste lid, van de Wet][ref1], moet in de twaalf maanden voorafgaand aan de aanvraag minimaal achttien
      schietbeurten verrichten, tenzij het tekort aan schietbeurten de aanvrager van het verlof redelijkerwijs niet kan
      worden aangerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
  - number: '43.5'
    text: |-
      Een verlof tot het voorhanden hebben van wapens en munitie, zoals bedoeld in
      [artikel 28, eerste lid, van de wet][ref1], ten behoeve van de schietsport wordt alleen verleend voor de wapens
      en munitie waarmee de sportschutter binnen het verband van zijn schietvereniging, welke voldoet aan de eisen als
      bedoeld in [artikel 43a][ref2], een schietsportdiscipline beoefent.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel43a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: 43a
        paragraaf: 16a
  - number: '43.6'
    text: |-
      Het eerste lid is niet van toepassing op een houder van een verlof tot het voorhanden hebben van wapens en munitie
      gedurende het eerste verlofjaar. Deze houder mag ten hoogste een wapen welke geschikt is voor een Olympische
      schietsportdiscipline voorhanden hebben.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43
  - number: 43a.1
    text: |-
      Als erkende schietsportdisciplines in de zin van [artikel 7, vierde lid, van het Besluit wapens en munitie]
      (onbekend) worden aanwezen:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.a
    text: Statische disciplines Groot Kaliber Pistool
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.a.1
    text: Militair Pistool
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.a.2
    text: Service Pistool
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.a.3
    text: Action Shooting
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.a.4
    text: Meesterkaart Zwaar
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.b
    text: Statische disciplines Groot Kaliber Geweer
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.b.1
    text: Militair geweer
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.b.2
    text: Veteranengeweer
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.b.2
    text: Precisiegeweer
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.b.2
    text: .30 M1
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.c
    text: Dynamische / Parcours-disciplines Pistool
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.c.1
    text: IPSC Handgun Open
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.c.2
    text: IPSC Handgun Standard
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.c.3
    text: IPSC Handgun Classic
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.c.4
    text: IPSC Handgun Production
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.c.5
    text: IPSC Handgun Revolver
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.c.6
    text: Dynamic Service Rifle Pistool
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.d
    text: Dynamische / Parcours-disciplines Geweer
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.d.1
    text: IPSC Rifle Semi Auto Open
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.d.2
    text: IPSC Rifle Semi Auto Standard
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.d.3
    text: IPSC Rifle Manual Action Open
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.d.4
    text: IPSC Rifle Manual Action Standard
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.d.5
    text: Dynamic Service Rifle Geweer Semiautomaat
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.1.d.6
    text: Dynamic Service Rifle Geweer Diverse
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43a.2
    text: |-
      Aanvragen voor erkenning van een schietsportdiscipline, als bedoeld in het eerste lid kunnen ingediend worden door
      een koepelvereniging voor schietsportverenigingen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43a
  - number: 43b.1
    text: |-
      Een verlof tot het voorhanden hebben van wapens en munitie, zoals bedoeld in
      [artikel 28, eerste lid, van de wet][ref1], kan worden verleend aan een schietvereniging, die door een door de
      Minister aangewezen organisatie is gecertificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel28
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '28'
  - number: 43b.2
    text: |-
      Er kan alleen een verlof worden verleend voor de wapens en munitie die zijn toegelaten bij een erkende of
      gereglementeerde schietsportdiscipline, welke binnen het verband van de aanvragende schietvereniging worden
      beoefend.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.3
    text: |-
      De schietvereniging houdt een presentieregister, een wapenuitgifteregister, een munitie-uitgifteregister en een
      introducé-register bij, overeenkomstig een door de Minister vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.4
    text: |-
      Een verlof als bedoeld in het eerste lid, wordt slechts verleend aan de schietvereniging die tenminste één
      beheerder heeft aangesteld. Tegen deze beheerder mag geen vrees voor misbruik bestaan.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.5
    text: Elke beheerder dient in het bezit te zijn van een verlof tot het voorhanden hebben van verenigingswapens.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.6
    text: |-
      De beheerder draagt er zorg voor dat de wapens en munitie op het verlof slechts worden uitgeleend aan leden van
      de schietvereniging.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.7
    text: |-
      Alvorens een lid van een schietvereniging schiet met verenigingswapens dient hij een verklaring omtrent het gedrag
      te hebben overgelegd aan het bestuur van de vereniging.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.8
    text: De beheerder houdt toezicht op de leden tijdens hun schietbeurten met verenigingswapens.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.9
    text: |-
      De beheerder ziet er op toe dat de verenigingswapens en de niet verschoten munitie onmiddellijk na afloop van de
      oefening of wedstrijd aan hem worden teruggegeven.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.10
    text: |-
      De beheerder draagt er zorg voor dat de wapens en munitie separaat van elkaar in een deugdelijk beveiligde en
      afgesloten wapenkluis dan wel wapenkamer worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.11
    text: |-
      In afwijking van het zesde lid kan de beheerder ook wapens en munitie die op het verlof staan, uitlenen aan een
      introducé van de schietvereniging.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.12
    text: Een introducé mag maximaal driemaal per twaalf maanden worden geïntroduceerd.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.13
    text: |-
      Aan introducés en leden die korter dan een jaar lid zijn van de schietvereniging worden alleen
      verenigingsvuurwapens uitgeleend, welke geschikt zijn voor Olympische schietsportdisciplines.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43b.14
    text: |-
      Het aantal wapens op het verlof van de vereniging dient in redelijke verhouding te staan tot het aantal leden dat
      regelmatig gebruik maakt van die wapens.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43b
  - number: 43c.1
    text: |-
      De persoon die bevoegd is tot het voorhanden hebben van een vuurwapen van categorie II of III, draagt er zorg voor
      dat de wapens en munitie separaat van elkaar in een afzonderlijke deugdelijke bergplaatsen worden opgeslagen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43c
  - number: 43c.2
    text: |-
      Het in het eerste lid bepaalde is tevens van toepassing op essentiële onderdelen van wapens zoals bedoeld in
      [artikel 3 van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel3
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43c
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '3'
  - number: 43c.3
    text: |-
      Onder deugdelijke bergplaatsen, als bedoeld in het eerste lid, wordt verstaan een speciaal voor de opslag van
      wapens vervaardigde, beveiligde, afsluitbare en voor onbevoegden niet eenvoudig te bereiken wapenkluis of een
      andere kluis die daarmee gelijk kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43c
  - number: 43c.4
    text: |-
      Indien de in het tweede lid bedoelde kluis een gewicht van minder dan tweehonderd kilogram heeft, is de kluis
      deugdelijk verankerd in de vloer of de muur van de ruimte.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43c
  - number: 43c.5
    text: |-
      Aan personen of instellingen die bevoegd zijn tot het voorhanden hebben van meer dan vijfentwintig wapens of een
      omvangrijke hoeveelheid munitie, kan door de korpschef van de politie toestemming gegeven worden de wapens of
      munitie in een andere deugdelijke bergplaats op te slaan, zulks naar het oordeel van de korpschef.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43c
  - number: 43d.1
    text: |-
      De korpschef houdt toezicht op het bepaalde in [artikel 43c][ref1] en voert in verband hiermee ten minste één keer
      in de drie jaren een onaangekondigde thuiscontrole uit bij de in het eerste lid van dat artikel genoemde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel43c
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43d
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: 43c
        paragraaf: 16b
  - number: 43d.2
    text: |-
      Voor personen die de leeftijd van vijfentwintig jaren nog niet hebben bereikt vindt de in het eerste lid bedoelde
      controle jaarlijks plaats.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel43d
  - number: '44.1'
    text: |-
      Van het verbod van [artikel 22, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan sportschutters en
      jagers voor het vervoeren van wapens en munitie die zij gerechtigd zijn voorhanden te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '22'
  - number: '44.2'
    text: 'De vrijstelling in het eerste lid geldt uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel44
  - number: 44.2.a
    text: |-
      voor het vervoeren tussen de woning en de schietbaan, de erkende wapenhandelaar en, na daaraan voorafgaande
      toestemming van de politie, het bureau van politie, alsmede, voorzover het jagers betreft, het jachtveld;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel44
  - number: 44.2.b
    text: langs de weg en binnen het tijdsbestek welke redelijkerwijs voor het vervoer geboden zijn; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel44
  - number: 44.2.c
    text: de wapens en munitie zodanig zijn verpakt dat deze niet voor onmiddellijk gebruik kunnen worden aangewend en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel44
  - number: 44.2.d
    text: dat degene die bevoegd is het wapen voor handen te hebben er continu de controle over houdt.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel44
  - number: '45.1'
    text: |-
      Van het verbod van [artikel 22, eerste lid van de wet][ref1] wordt voor het vervoeren van wapens en munitie
      vrijstelling verleend aan personen die in de uitoefening van een beroep of bedrijf zaken vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '22'
  - number: '45.2'
    text: 'De vrijstelling in het eerste lid geldt slechts:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel45
  - number: 45.2.a
    text: |-
      indien en voorzover het vervoer plaats vindt in opdracht van degene die bevoegd is de wapens en de munitie
      voorhanden te hebben en te vervoeren;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel45
  - number: 45.2.b
    text: indien de ontvanger bevoegd is de wapens en de munitie voorhanden te hebben; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel45
  - number: 45.2.c
    text: |-
      voorzover uit tijdens het vervoer aanwezige documenten blijkt dat aan de in het eerste lid, alsmede aan de in dit
      lid onder a en b genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel45
  - number: '46.1'
    text: |-
      Van het verbod van [artikel 22, eerste lid van de wet][ref1] wordt voor het vervoeren van wapens en munitie
      vrijstelling verleend aan personen in dienst van houders van een erkenning, zoals bedoeld in artikel 9 van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel22
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '22'
  - number: '46.2'
    text: 'De vrijstelling in het eerste lid geldt slechts indien:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel46
  - number: 46.2.a
    text: het wapens of munitie betreft waarop de erkenning betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel46
  - number: 46.2.b
    text: |-
      het vervoer plaatsvindt in opdracht van de erkenninghouder, dan wel de beheerder in het bedrijf waaraan de
      erkenning is verleend;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel46
  - number: 46.2.c
    text: het vervoer noodzakelijk is voor de goede uitvoering van de handelingen waarop de erkenning betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel46
  - number: 46.2.d
    text: de erkenninghouder, onderscheidenlijk de beheerder bevoegd is de wapens en de munitie te vervoeren; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel46
  - number: 46.2.e
    text: |-
      uit tijdens het vervoer aanwezige documenten blijkt dat aan de in het eerste lid, alsmede aan de in dit lid onder a
      tot en met d genoemde voorwaarden is voldaan.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel46
  - number: '47.1'
    text: 'De korpschef bewaart in afzonderlijke door hem te voeren administraties kopieën van:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.1.a
    text: |-
      de door hem uitgereikte verloven tot het voorhanden hebben van wapens en munitie van categorie III, jachtakten,
      erkenningen en consenten; en
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.1.b
    text: |-
      alle documenten betreffende de door andere autoriteiten verleende bevoegdheid tot het voorhanden hebben van wapens
      of munitie aan in zijn ambtsgebied wonende personen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: '47.2'
    text: |-
      De korpschef registreert de naam, het adres en de woonplaats van de in zijn ambtsgebied wonende personen die
      bevoegd zijn een vuurwapen voorhanden te hebben in een bestand.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: '47.3'
    text: |-
      Van de wapens of de munitie die overeenkomstig [artikel 8 van de wet][ref1] in bewaring worden gegeven houdt de
      korpschef een register bij, waarin wordt vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel8
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '8'
  - number: 47.3.a
    text: de naam en het adres van degene die de voorwerpen in bewaring geeft;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.3.b
    text: de datum van bewaargeving;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.3.c
    text: |-
      een omschrijving van de in bewaring gegeven voorwerpen, waarbij zoveel mogelijk wordt aangegeven het aantal, de
      soort, het merk, het type, het kaliber, het nummer, de toebehoren, alsmede andere bijzonderheden, daaronder mede
      verstaan beschadigingen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.3.d
    text: |-
      het nummer van het eventueel afgegeven document waaruit blijkt dat de voorwerpen bevoegd voorhanden werden
      gehouden;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.3.e
    text: de plaats waar de voorwerpen worden opgeborgen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.3.f
    text: de datum waarop de bewaring is geëindigd;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: 47.3.g
    text: de naam en het adres van degene aan wie na afloop van de bewaring de voorwerpen ter hand zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: '47.4'
    text: |-
      De bewaargever is de korpschef bewaarloon verschuldigd van € 15,– per wapen per kalendermaand, daaronder begrepen
      een gedeelte van de kalendermaand, te rekenen vanaf de eerste dag van de derde kalendermaand nadat het wapen in
      bewaring is gegeven.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
  - number: '47.5'
    text: |-
      Aan de bewaargever wordt door de korpschef een ontvangstbewijs verstrekt waarop de gegevens, genoemd in het vijfde
      lid, onder a tot en met d, worden vermeld. Op het ontvangstbewijs wordt tevens vermeld hetgeen in het zesde lid,
      alsmede hetgeen in [artikel 8, zesde en zevende lid, van de wet][ref1] is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel8
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '8'
  - number: 47a
    text: |-
      De aanvrager van een ontheffing op grond van [artikel 4 van de wet][ref1], meldt zich onverwijld na het indienen
      van de aanvraag in persoon bij de korpschef van de politie, onder overlegging van een geldig identiteitsbewijs en
      een schriftelijke kopie van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel4
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel47a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '4'
  - number: '48'
    text: |-
      Voor het indienen van een verzoek om een erkenning, een consent, een vergunning of een verlof wordt gebruik gemaakt
      van de formulieren overeenkomstig de daarvoor in [bijlage III][ref1] bij deze beschikking vastgestelde modellen.


      [ref1]: https://wetten.overheid.nl/BWBR0008800
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0008800
  - number: 48a.1
    text: |-
      Het onderzoek bedoeld in [artikel 6a, eerste lid, onderdeel b, van de wet][ref1] bestaat uit de beoordeling door
      de korpschef van het door de aanvrager ingevulde WM32-formulier, dat als [bijlage III][ref2] bij deze regeling
      is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0008800
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: 6a
      - id: ref2
        bwb_id: BWBR0008800
  - number: 48a.2
    text: |-
      Indien de aanvraag is gedaan voor een ontheffing op grond van [artikel 4 van de wet][ref1], zendt de korpschef na
      het onderzoek, onder gelijktijdige toezending van het ingevulde WM32-formulier, een advies aan de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel4
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '4'
  - number: 48a.3
    text: Het onderzoek vindt alleen plaats als de volledige kosten van de aanvraag zijn betaald.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel48a
  - number: '49.1'
    text: |-
      Bij inwilliging van een verzoek om een erkenning, een consent, een vergunning, een Europese vuurwapenpas of een
      verlof wordt aan de verzoeker een document uitgereikt overeenkomstig het daarvoor in bijlage III bij deze regeling
      vastgestelde model.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel49
  - number: '49.2'
    text: |-
      Bij inwilliging van een verzoek om verlenging van de geldigheidsduur van een erkenning wordt daarvan aantekening
      gemaakt in het aan de verzoeker overeenkomstig het eerste lid uitgereikte document of wordt hem tegen afgifte van
      het oude document een nieuw document uitgereikt.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel49
  - number: '50.1'
    text: |-
      De onkostenvergoeding, bedoeld in [artikel 41 van de wet][ref1], bedraagt voor:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel41
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '41'
  - number: 50.1.a
    text: 'een ontheffing of de wijziging of verlenging daarvan: € 80,–;'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.b
    text: |-
      een erkenning als bedoeld in [artikel 10][ref1] van deze regeling: € 50,– voor ieder jaar waarvoor de erkenning
      geldt


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel10
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '10'
        paragraaf: '6'
  - number: 50.1.c
    text: 'een erkenning, niet zijnde een erkenning als bedoeld onder b: € 500,– voor ieder jaar waarvoor de erkenning geldt'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.d
    text: 'de afgifte van een nieuw bewijs van erkenning uitsluitend ten gevolge van een wijziging van de beheerder: € 10,–'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.e
    text: 'een consent: € 0,–'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.f
    text: 'een doorlopend verlof tot vervoer ten behoeve van werknemers van erkenninghouders: € 10,–'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.g
    text: 'een verlof tot vervoer, niet zijnde een verlof als bedoeld onder f: € 5,–'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.h
    text: 'een uitvoervergunning conform verordening (EU) 258/2012: € 0,–'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.i
    text: 'een Europese vuurwapenpas:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.i.1°
    text: voor de afgifte daarvan € 72,60, of
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.i.2°
    text: voor de verlenging van de geldigheidsduur daarvan € 5,–;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.j
    text: |-
      de afgifte van een nieuw document, met uitzondering van de documenten genoemd in het eerste lid, onder a en e,
      uitsluitend ten gevolge van een redactionele wijziging daarin: € 5,–;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
  - number: 50.1.k
    text: |-
      een controle als bedoeld in [artikel 43 van de wet][ref1]: € 90,–.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel43
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '43'
  - number: '50.2'
    text: |-
      Voorzover ter uitvoering van [artikel 40 van de wet][ref1] regels zijn gegeven over combinatie van de daarin
      genoemde bescheiden bedraagt de onkostenvergoeding voor een dergelijke combinatie niet meer dan het bedrag dat
      verschuldigd zou zijn voor dat deel van de combinatie waarvoor de hoogste vergoeding geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel40
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '40'
  - number: 50a.1
    text: |-
      De onkostenvergoeding, bedoeld in [artikel 41 van de wet][ref1], bedraagt voor een verlof tot het voorhanden
      hebben, dragen of verkrijgen van een wapen als bedoeld in de [artikelen 26 tot en met 32 van de wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '26'
  - number: 50a.1.a
    text: 'voor de afgifte daarvan: € 138,20;'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50a
  - number: 50a.1.b
    text: 'voor de verlenging van de geldigheidsduur daarvan: € 68,20;'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50a
  - number: 50a.1.c
    text: 'voor de wijziging daarvan: € 30,–;'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50a
  - number: 50a.1.d
    text: 'voor de afgifte van een nieuw verlof als gevolg van het verlies daarvan: € 30,–.'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50a
  - number: 50a.2
    text: |-
      De onkostenvergoeding voor een combinatie van de in dit artikel genoemde bescheiden bedraagt niet meer dan het
      bedrag dat verschuldigd zou zijn voor dat deel van de combinatie waarvoor de hoogste vergoeding geldt.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel50a
  - number: '51'
    text: |-
      Ingevolge [artikel 45, eerste lid, onder 2°, van de wet][ref1] worden als ambtenaren belast met het toezicht op de
      naleving van het bij en krachtens de wet bepaalde, aangewezen de ambtenaren van de Inspectie Verkeer en Waterstaat
      die belast zijn met toezicht en opsporing.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel45
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '45'
  - number: '55'
    text: |-
      [Artikel 20, tweede lid][ref1], alsmede de aanduiding 1. voor het eerste lid, vervalt op 1 mei 1998.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel20
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '20'
        paragraaf: '10'
  - number: '58'
    text: |-
      Na de inwerkingtreding van deze regeling berusten krachtens de Regeling wapens en munitie (Stcrt. 1996, 245)
      vastgestelde besluiten op deze regeling.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel58
  - number: '59'
    text: De Regeling wapens en munitie (Stcrt. 1996, 245) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel59
  - number: '60'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel60
  - number: '61'
    text: 'Deze regeling wordt aangehaald als: Regeling wapens en munitie.'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel61
