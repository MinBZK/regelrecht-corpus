  - number: '8.4'
    text: |-
      De aanvrager of de beheerder, bedoeld in [artikel 10, eerste lid, onder a, van de wet][ref1] mag niet binnen de
      laatste acht jaren in het buitenland bij onherroepelijk geworden rechterlijke uitspraak zijn veroordeeld wegens
      overtreding van één of meer aldaar geldende strafbepalingen, vergelijkbaar met de bepalingen genoemd in het vorige
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel10
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8
