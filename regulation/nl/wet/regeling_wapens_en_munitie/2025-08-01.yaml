        bwb_id: BWBR0008804
        artikel: '27'
  - number: '7.3'
    text: |-
      Het verbod van [artikel 27, eerste lid, van de wet][ref1] is niet van toepassing op personen, aangewezen door
      de directeur van een justitiële inrichting en die een toezichthoudende taak vervullen in het kader van de
      tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel, voor zover het betreft wapens van de
      categorie IV, onder 3, en het dragen geschiedt uit hoofde van de dienstuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '27'
  - number: '8.1'
    text: |-
      De aanvrager of de beheerder, bedoeld in [artikel 10, eerste lid, onder a, van de wet][ref1] is niet jonger dat
      achttien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel10
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '10'
  - number: '8.2'
    text: |-
      De aanvrager of de beheerder, bedoeld in [artikel 10, eerste lid, onder a, van de wet][ref1] mag niet met
      toepassing van [artikel 37 van het Wetboek van Strafrecht][ref2] in een psychiatrisch ziekenhuis zijn geplaatst,
      dan wel met toepassing van [artikel 37a van het Wetboek van Strafrecht][ref3] ter beschikking zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel37a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel8
    references:
