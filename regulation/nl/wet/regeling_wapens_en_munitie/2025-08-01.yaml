preamble:
  text: |-
    Gelet op de artikelen 2, eerste lid, categorie I, onder 7° en categorie IV, onder 6°, 2, derde lid, 3a, derde lid,
    4, 5, 7, eerste lid, onder a, 8, achtste en negende lid, 9, vijfde lid, 10, eerste en tweede lid, 14, vierde lid,
    15, 22, tweede lid, 26, derde, vierde en zesde lid, 27 derde en vierde lid, 28a, tweede lid, 31, vijfde lid, 33,
    eerste en tweede lid, 38, eerste lid, 39, 40, 41, 42, eerste en tweede lid, 45, eerste lid, onder 2° en 52, derde
    lid, van de Wet wapens en munitie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
  - number: 1.1.a
    text: |-
      *de wet:*de [Wet wapens en munitie][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: 1.1.b
    text: '*de Minister:* de minister van Justitie en Veiligheid;'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
  - number: 1.1.c
    text: |-
      *de korpschef:*de korpschef, bedoeld in [artikel 27 van de Politiewet 2012][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '27'
  - number: 1.1.d
    text: |-
      *jachtakte:*een jachtakte als bedoeld in [artikel 3.26, eerste lid, onderdeel a, van de Wet natuurbescherming][ref1],
      tenzij uitdrukkelijk anders is aangegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0037552#Artikel3
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037552
        artikel: '3'
  - number: 1.1.e
    text: |-
      *de bedrijfsruimte van de erkende:* de ruimte waarin de erkende de handelingen, waarop zijn erkenning betrekking
      heeft, verricht of doet verrichten;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
  - number: 1.1.f
    text: |-
      *buitengewoon opsporingsambtenaar:*de buitengewoon opsporingsambtenaar, bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: 1.1.g
    text: |-
      *schietvereniging:* de vereniging die blijkens de in een notariële akte opgenomen statuten tot doel heeft haar
      leden in de gelegenheid te stellen de schietsport te beoefenen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
  - number: 1.1.h
    text: |-
      *airsoftapparaat:* lucht-, gas-, of veerdrukwapen met een maximum schotkracht van 3,5 joules, welk wapen voor wat
      betreft zijn vorm en afmetingen een sprekende gelijkenis toont met vuurwapens;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
  - number: 1.1.i
    text: |-
      *airsoftvereniging:* de vereniging die blijkens de in een notariële akte opgenomen statuten tot doel heeft haar
      leden de gelegenheid te bieden de airsoftsport te beoefenen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
  - number: 1.1.j
    text: |-
      *de kleine erkenninghouder:* de beheerder van een erkenning voor een bedrijf als bedoeld in [artikel 10][ref1] van
      deze regeling, die met het oog op de aard van zijn werkzaamheden niet met gunstig gevolg het verplichte examen,
      bedoeld in [artikel 9][ref2] van deze regeling, hoeft te hebben afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel9
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '10'
        paragraaf: '6'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: '9'
        paragraaf: '6'
  - number: '1.2'
    text: |-
      Overige in deze regeling voorkomende begrippen hebben dezelfde betekenis als in [de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: '2.1'
    text: |-
      In [de wet][ref1] en de daarop berustende bepalingen wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0008804
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0008804
  - number: 2.1.a
    text: |-
      *stiletto:* een opvouwbaar mes waarvan het lemmet door een druk- of vergelijkbaar ontgrendelingsmechanisme
      zijdelings scharnierend uit het heft wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: 2.1.b
    text: |-
      *valmes:* een mes waarvan het lemmet door een druk- of vergelijkbaar ontgrendelingsmechanisme, dan wel door een
      zwaaibeweging of door zwaartekracht rechtstandig uit het heft wordt gebracht;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: 2.1.c
    text: |-
      *vlindermes:* een mes waarvan het heft in de lengterichting in tweeën is gedeeld en waarvan het lemmet naar buiten
      wordt gebracht door elk van de delen van het heft in tegenovergestelde richting zijdelings open te vouwen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: 2.1.d
    text: |-
      *vilmes:* een mes waarvan het heft haaks op het lemmet staat of geplaatst kan worden en dat bestemd is om bij
      gebruik in de palm van de hand te worden gehouden, terwijl het lemmet tussen de vingers door naar buiten steekt;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: 2.1.e
    text: |-
      *ballistisch mes:* een mes waarvan het lemmet, al dan niet tezamen met het heft, door middel van lucht-, gas- of
      veerdruk rechtstandig uit een geleidingscilinder wordt gedreven;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: 2.1.f
    text: |-
      *geluiddemper:* een niet in het vuurwapen geïntegreerd, doorgaans aan de loopmond daarvan bevestigd voorwerp dat
      bestemd of geschikt is om te bewerkstelligen dat het geluid van het schot wordt gedempt;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: 2.1.g
    text: '*ploertendoder:* een verende of uitschuifbare staaf met een verzwaard uiteinde.'
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: '2.2'
    text: |-
      Geen wurgstokken in de zin van de wet en de daarop berustende bepalingen zijn voorwerpen die bestemd zijn voor de
      serieuze beoefening van vechtsporten in verenigingsverband en die gelet op hun constructie of het materiaal waaruit
      zij zijn vervaardigd niet bestemd zijn om ernstig letsel aan personen toe te brengen.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel2
  - number: '3'
    text: |-
      Als voorwerpen van categorie I, onder 7°, die een ernstige bedreiging van personen kunnen vormen of die zodanig op
      een wapen gelijken dat zij voor bedreiging of afdreiging geschikt zijn, worden aangewezen:
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
  - number: 3.a
    text: |-
      voorwerpen die voor wat betreft hun vorm en afmetingen een sprekende gelijkenis vertonen met vuurwapens of met voor
      ontploffing bestemde voorwerpen, met uitzondering van speelgoedvoorwerpen als bedoeld in de Richtlijn 2009/48/EG;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
  - number: 3.b
    text: |-
      voorwerpen vermeld op lijst a of lijst b van de bij deze regeling behorende [bijlage I][ref1], alsmede niet in die
      bijlage genoemde voorwerpen die voor wat betreft hun vorm en afmetingen daarmee een sprekende gelijkenis vertonen,
      met uitzondering van speelgoedvoorwerpen als bedoeld in de Richtlijn 2009/48/EG;


      [ref1]: https://wetten.overheid.nl/BWBR0008800
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008800
  - number: 3.c
    text: lucht-, gas- en veerdrukwapens die zodanig zijn gewijzigd dat het dragen niet of minder zichtbaar is;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
  - number: 3.d
    text: stiletto's, valmessen en vlindermessen waarvan het heft van een stootplaat is voorzien;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
  - number: 3.e
    text: laserwapens die specifiek zijn ontworpen om permanente blindheid te veroorzaken;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
  - number: 3.f
    text: werppennen;
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
  - number: 3.g
    text: |-
      alle voorwerpen die een sprekende gelijkenis vertonen met wapens, niet zijnde vuurwapens, en die door de aard
      en de samenstelling van het materiaal waaruit zij zijn vervaardigd, niet dan wel slecht detecteerbaar zijn door
      metaaldetectoren of andere electronische detectieapparatuur, met uitzondering van voorwerpen die specifiek zijn
      vervaardigd voor reguliere maatschappelijk aanvaarde gebruiksdoeleinden en met uitzondering van speelgoedvoorwerpen
      als bedoeld in de Richtlijn 2009/48/EG.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3
  - number: 3a.1
    text: |-
      Het bepaalde in [artikel 13, eerste lid][ref1], [14, eerste lid][ref2], [22, eerste lid][ref3],
      [26, eerste lid][ref4], [27, eerste lid][ref5], [32a, eerste lid][ref6], en [32b, eerste lid, van de wet][ref7]
      is niet van toepassing op de ambtenaren van politie, bedoeld in [artikel 2 van de Politiewet 2012][ref8], voor
      zover hun het voorschrift is gegeven om tijdens de dienstuitoefening bewapend te zijn met bij of krachtens het
      [Besluit bewapening en uitrusting politie][ref9] aangewezen wapens of munitie.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0008804#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0008804#Artikel32a
      [ref7]: https://wetten.overheid.nl/BWBR0008804#Artikel32b
      [ref8]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref9]: https://wetten.overheid.nl/BWBR0032136
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0008804
        artikel: '27'
      - id: ref6
        bwb_id: BWBR0008804
        artikel: 32a
      - id: ref7
        bwb_id: BWBR0008804
        artikel: 32b
      - id: ref8
        bwb_id: BWBR0031788
        artikel: '2'
      - id: ref9
        bwb_id: BWBR0032136
  - number: 3a.2
    text: |-
      Het bepaalde in [artikel 9, eerste lid][ref1], [13, eerste lid][ref2], [artikel 14, eerste lid][ref3],
      [22, eerste lid][ref4], [26, eerste lid][ref5], [32a, eerste lid][ref6], en [32b, eerste lid, van de wet][ref7] is
      niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref5]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref6]: https://wetten.overheid.nl/BWBR0008804#Artikel32a
      [ref7]: https://wetten.overheid.nl/BWBR0008804#Artikel32b
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref5
        bwb_id: BWBR0008804
        artikel: '26'
      - id: ref6
        bwb_id: BWBR0008804
        artikel: 32a
      - id: ref7
        bwb_id: BWBR0008804
        artikel: 32b
  - number: 3a.2.a
    text: |-
      de ambtenaren van politie, bedoeld in [artikel 2, onder b, van de Politiewet 2012][ref1], die belast zijn met het
      onderwijs, de verwerving, het vervoer of het onderhoud van wapens en munitie voor zover de in die artikelleden
      genoemde handelingen geschiedt uit hoofde van de dienstuitoefening;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
  - number: 3a.2.b
    text: |-
      personen die werkzaam zijn bij het Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en
      kenniscentrum, bedoeld in [artikel 2 van de Wet op het LSOP en het politieonderwijs][ref1], voor zover de in die
      artikelleden genoemde handelingen geschiedt uit hoofde van de dienstuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0014623#Artikel2
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0014623
        artikel: '2'
  - number: '4.1'
    text: |-
      Het bepaalde in [artikel 13, eerste lid][ref1] en [14, eerste lid][ref2], [22, eerste lid][ref3],
      [26, eerste lid][ref4], en [27, eerste lid, van de wet][ref5] is niet van toepassing op opsporingsambtenaren van
      bijzondere opsporingsdiensten en buitengewoon opsporingsambtenaren, voor zover hun het voorschrift is gegeven om
      gedurende hun dienstuitoefening een wapen en munitie voorhanden te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0008804#Artikel27
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0008804
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0008804
        artikel: '14'
      - id: ref3
        bwb_id: BWBR0008804
        artikel: '22'
      - id: ref4
        bwb_id: BWBR0008804
        artikel: '26'
      - id: ref5
        bwb_id: BWBR0008804
        artikel: '27'
  - number: '4.2'
    text: Het in het eerste lid bedoelde voorschrift wordt gegeven door de Minister.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel4
  - number: '4.3'
    text: |-
      Het eerste lid geldt uitsluitend gedurende de periode dat opsporingsambtenaren van de bijzondere
      opsporingsdiensten, bedoeld in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref1] en de buitengewoon
      opsporingsambtenaar beschikken over een titel van opsporingsbevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0019919#Artikel2
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0019919
        artikel: '2'
  - number: '5.1'
    text: |-
      Een voorschrift, bedoeld in [artikel 4, eerste lid][ref1], wordt slechts gegeven indien en voorzolang de noodzaak
      tot bewapening aannemelijk is en de bekwaamheid van opsporingsambtenaren van de bijzondere opsporingsdiensten,
      bedoeld in [artikel 2 van de Wet op de bijzondere opsporingsdiensten][ref2] en de buitengewoon opsporingsambtenaar
      in de omgang met het wapen en de munitie is aangetoond.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0019919#Artikel2
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0019919
        artikel: '2'
  - number: '5.2'
    text: |-
      Aan een voorschrift kunnen voorwaarden en beperkingen worden verbonden die betrekking hebben op de veiligheid, de
      bekwaamheid in de omgang met wapens en munitie, alsmede op de opslag en het vervoer daarvan.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel5
  - number: '5.3'
    text: |-
      Indien aan het voorschrift een beperking is verbonden, geldt de vrijstelling in [artikel 4, eerste lid][ref1],
      slechts voorzover het voorschrift reikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel4
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '4'
        paragraaf: '4'
  - number: '6.1'
    text: |-
      Het voorschrift, bedoeld in [artikel 4, eerste lid][ref1], kan uitsluitend betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel4
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008800
        artikel: '4'
        paragraaf: '4'
  - number: 6.1.a
    text: |-
      een korte wapenstok als bedoeld in
      [artikel 12 van het Aanwijzingsbesluit bewapening en uitrusting politie 2013][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034439#Artikel12
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034439
        artikel: '12'
  - number: 6.1.b
    text: |-
      een pistool als bedoeld in
      [artikel 2, eerste lid, onder a of b, van het Aanwijzingsbesluit bewapening en uitrusting politie 2013][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034439#Artikel2
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034439
        artikel: '2'
  - number: 6.1.c
    text: |-
      de munitie als bedoeld in [artikel 3 van het Aanwijzingsbesluit bewapening en uitrusting politie 2013][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034439#Artikel3
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034439
        artikel: '3'
  - number: 6.1.d
    text: |-
      pepperspray als bedoeld in [artikel 6 van het Aanwijzingsbesluit bewapening en uitrusting politie 2013][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034439#Artikel6
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034439
        artikel: '6'
  - number: 6.1.e
    text: andere wapens en munitie dan genoemd onder a tot en met d.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6
  - number: '6.2'
    text: |-
      Indien het voorschrift betrekking heeft op een pistool als bedoeld in het eerste lid, onder b, of pepperspray
      als bedoeld in het eerste lid, onder d, geldt als voorwaarde dat het pistool wordt gedragen in een daarbij
      horend holster als bedoeld in [artikel 7 van het Aanwijzingsbesluit bewapening en uitrusting politie 2013][ref1]
      onderscheidenlijk dat pepperspray wordt gedragen in een draagmiddel als bedoeld in
      [artikel 6a van het Aanwijzingsbesluit bewapening en uitrusting politie 2013][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0034439#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0034439#Artikel6a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0034439
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0034439
        artikel: 6a
  - number: 6a
    text: |-
      De [artikelen 13, eerste lid][ref1], [14, eerste lid][ref2], [22, eerste lid][ref3], [26, eerste lid][ref4],
      en [27 eerste lid, van de wet][ref5] zijn niet van toepassing op opsporingsambtenaren van bijzondere
      opsporingsdiensten en buitengewoon opsporingsambtenaren, voor zover de in die artikelleden
      genoemde handelingen plaats vinden met een trainingswapen en trainingsmunitie als bedoeld in
      [artikel 14 van het Aanwijzingsbesluit bewapening en uitrusting politie 2013][ref6], ten behoeve van de opleiding
      of beroepsvaardigheidstraining.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0008804#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0034439#Artikel14
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6a
