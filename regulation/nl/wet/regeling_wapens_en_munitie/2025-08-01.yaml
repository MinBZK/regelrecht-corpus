        artikel: '14'
  - number: 6b.1
    text: |-
      De wapens en de munitie, bedoeld in [artikel 6][ref1] en [artikel 6a][ref2], worden door het Politiedienstencentrum
      aangeschaft en afgevoerd, met uitzondering van de afvoer van de pepperspray, de verdekte pepperspray en de munitie,
      voor zover deze na gebruik geen werkzame bestanddelen meer bevatten.


      [ref1]: https://wetten.overheid.nl/BWBR0008800#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0008800#Artikel6a
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6b
    references:
