        bwb_id: BWBR0008800
        artikel: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0008800
        artikel: 6a
        paragraaf: '4'
  - number: 6b.2
    text: De Minister kan in bijzondere gevallen toestemming verlenen om af te wijken van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6b
  - number: 6b.3
    text: De Minister kan aanwijzingen geven over de wijze waarop de wapens en de munitie worden afgevoerd.
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel6b
  - number: '7.1'
    text: |-
      Van het verbod van [artikel 13, eerste lid][ref1], [14, eerste lid][ref2], [22, eerste lid][ref3], en
      [26, eerste lid, van de wet][ref4] wordt vrijstelling verleend aan personen die werkzaam zijn bij het Nederlands
      Forensisch Instituut, voor zover het vervaardigen, transformeren, overdragen, overdragen, doen binnenkomen of
      uitgaan, het vervoeren of het voorhanden hebben geschiedt uit hoofde van de dienstuitoefening.


      [ref1]: https://wetten.overheid.nl/BWBR0008804#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0008804#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0008804#Artikel22
      [ref4]: https://wetten.overheid.nl/BWBR0008804#Artikel26
    url: https://wetten.overheid.nl/BWBR0008800/2025-08-01#Artikel7
    references:
