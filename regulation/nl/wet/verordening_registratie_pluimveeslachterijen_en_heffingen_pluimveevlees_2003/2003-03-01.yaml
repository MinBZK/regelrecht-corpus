preamble:
  text: |-
    gelet op artikel 126 van de Wet op de Bedrijfsorganisatie en de artikelen 5 en9 van de Instellingsverordening
    Productschap Pluimvee en Eieren 1998-I,

    op 14 november 2002 vastgesteld de navolgende

    VERORDENING
  url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze verordening wordt verstaan onder:









                  productschap


                  :


                  het Productschap Pluimvee en Eieren;




                  onderneming


                  :


                  een onderneming waarvoor het productschap is ingesteld;




                  ondernemer


                  :


                  de natuurlijke of rechtspersoon die een onderneming drijft;




                  pluimvee


                  :


                  vleeskuikens, tamme eenden, tamme ganzen, kalkoenen en parelhoenders;




                  oude kippen en hanen


                  :


                  vleeskuikens die op het tijdstip van de slacht geslachtsrijp zijn en waarvan de punt van het borstbeen
      verbeend is;




                  geslacht pluimvee


                  :


                  geslacht pluimvee met inbegrip van delen van dat gevogelte en bijproducten;




                  bijproducten


                  :


                  hart, lever, van binnenwand ontdane spiermaag en nek, indien deze is afgesneden;




                  geslacht gewicht


                  :


                  het gewicht van het geslachte pluimvee.
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel1
  - number: '2'
    text: |-
      Ondernemers die pluimvee bedrijfsmatig slachten zijn verplicht zich ter registratie bij het productschap aan te
      melden.
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel2
  - number: '3'
    text: |-
      1 De aanmelding ter registratie dient te geschieden door middel van een registratieformulier dat door het
      secretariaat van het productschap wordt verstrekt.

      2 Het model van het in het eerste lid bedoelde formulier wordt door de voorzitter van het productschap bij
      uitvoeringsbesluit vastgesteld ter verkrijging van onder meer de volgende gegevens:

      a. naam, adres en rechtsvorm van de onderneming, alsmede van eventuele filialen;

      b. datum van vestiging of overneming der onderneming;

      c. gegevens omtrent door de ondernemer te verrichten slachtingen.
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel3
  - number: '4'
    text: |-
      De in [artikel 2][ref1] bedoelde ondernemer dient binnen 14 dagen nadat hij de hoedanigheid van ondernemer
      heeft verkregen het in [artikel 3][ref2] bedoelde registratieformulier, volledig en naar waarheid ingevuld en
      ondertekend, bij het secretariaat van het productschap in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0014270#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014270#Artikel3
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014270
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014270
        artikel: '3'
  - number: '5'
    text: |-
      De in [artikel 2][ref1] bedoelde ondernemer is gehouden bij de ohneffing van zijn onderneming, dan wel bij enige
      wijziging van de in [artikel 3, tweede lid][ref2], bedoelde gegevens, daarvan uiterlijk binnen 14 dagen nadat zich
      het desbetreffende feit of de wijziging heeft voorgedaan schriftelijk mededeling te doen aan het secretariaat van
      het productschap.


      [ref1]: https://wetten.overheid.nl/BWBR0014270#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0014270#Artikel3
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0014270
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014270
        artikel: '3'
  - number: '6'
    text: |-
      Het productschap doet aan de betrokken ondernemer onverwijld schriftelijk een bevestiging toekomen van de ontvangst
      van de registratie, door toezending van één gewaarmerkt exemplaar van het registratieformulier. De mededeling
      bedoeld in [artikel 5][ref1] wordt onverwijld schriftelijk bevestigd.


      [ref1]: https://wetten.overheid.nl/BWBR0014270#Artikel5
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0014270
        artikel: '5'
  - number: '7'
    text: |-
      1 De ondernemer die pluimvee slacht is aan het productschap over het geslacht gewicht van het door hem in het
      kalenderjaar 2003 geslachte pluimvee een heffing verschuldigd.

      2 Het tarief van de in het eerste lid bedoelde heffing bedraagt:

      a. € 0,00189 per kilogram geslacht gewicht, voor zover het oude kippen en hanen betreft,

      waarvan:

      € 0,00154 voor de dekking van huishoudelijke uitgaven,

      € 0,00026 voor het o. en o. fonds en,

      € 0,00009 voor het kwaliteitsverbeteringsfonds

      bestemd is;

      b. € 0,00453 per kilogram geslacht gewicht, voor zover het vleeskuikens, niet zijnde oude kippen en hanen als
      bedoeld onder a betreft,

      waarvan:

      € 0,00156 voor de dekking van huishoudelijke uitgaven,

      € 0,00262 voor het afzetbevorderingsfonds,

      € 0,00026 voor het o. en o. fonds en

      € 0,00009 voor het kwaliteitsverbeteringsfonds

      bestemd is;

      c. € 0,00131 per kilogram geslacht gewicht, voor zover het kalkoenen betreft, waarvan:

      € 0,00127 voor de dekking van huishoudelijke uitgaven en

      € 0,00004 voor het kwaliteitsverbeteringsfonds

      bestemd is;

      d. € 0,00367 per kilogram geslacht gewicht, voor zover het tarnme eenden betreft,

      waarvan:

      € 0,00088 voor de dekking van huishoudelijke uitgaven en

      € 0,00279 voor het o. en o. fonds

      bestemd is;

      e. € 0,00127 per kilogram geslacht gewicht voor zover het tamme ganzen en parelhoenders betreft, voor de dekking
      van huishoudelijke uitgaven;
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel7
  - number: '8'
    text: |-
      1 De in [artikel 2][ref1] bedoelde ondernemer is verplicht uiterlijk binnen 10 dagen na het verstrijken van
      elke kalendermaand, door middel van invulling en ondertekening van een hem door het productschap verstrekt
      opgaveformulier, naar waarheid opgave te doen van die bedrijfsgegevens over de verstreken kalendermaand waarvan de
      opgave in dat formulier wordt verlangd. Indien in het voorgaande jaar het totale geslacht gewicht, als bedoeld in
      [artikel 7, eerste lid][ref2], minder dan 100.000 kilogram bedroeg kan de ondernemer volstaan met het doen van de
      evenbedoelde opgave binnen 10 dagen na afloop van het betreffende kalenderjaar.

      2 De door middel van het opgaveformulier te verstrekken gegevens hebben betrekking op het geslacht gewicht en op
      andere bedrijfsgegevens, voor zover deze verband houden met het slachten van pluimvee en/of met aanwezige voorraden
      geslacht pluimvee of wijzigingen in deze voorraden.

      3 Indien in het voorgaande jaar het totale geslacht gewicht, als bedoeld in [artikel 7, eerste lid][ref3], meer
      dan 100.000 kilogram bedroeg is de ondernemer tevens verplicht aan het productschap, binnen vier weken na afloop
      van het betreffende kalenderjaar, een accountantsverklaring te verstrekken, op grond waarvan het productschap het
      geslacht gewicht kan verifiëren.

      4 De heffing die aan de ondernemer wordt opgelegd kan worden aangemerkt als voorschotbetaling. Na afloop van
      het kalenderjaar vindt dan een definitieve heffingsoplegging plaats en zo nodig verrekening tussen feitelijk
      verschuldigd bedrag en betaalde voorschotten.

      5 ledere ondernemer is verplicht van dag tot dag een zodanige administratie te voeren, dat de gegevens, benodigd
      voor de vaststelling van de heffing, te alle tijde op een eenvoudige wijze kunnen worden gekend.

      6 Het bestuur is bevoegd bij uitvoeringsbesluit minimumeisen te stellen, waaraan de door de ondernemer te houden
      administratie dient te voldoen.

      7 Voor het geval een ondernemer, als bedoeld in [artikel 2][ref4], niet heeft voldaan aan een ingevolge
      [titel II][ref5] en/of [artikel 8][ref6] op hem rustende verplichting waaronder begrepen het verstrekken van
      onvolledige en/of onjuiste gegevens, kan te zijnen aanzien de in [artikel 7][ref7] omschreven heffing ambtshalve
      door het productschap worden vastgesteld aan de hand van aan het productschap ten dienste staande gegevens, zo
      nodig door middel van een schatting.


      [ref1]: https://wetten.overheid.nl/BWBR0014270#Artikel2
