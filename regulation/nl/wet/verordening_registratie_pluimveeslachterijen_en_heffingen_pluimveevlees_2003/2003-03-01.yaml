        artikel: '2'
      - id: ref2
        bwb_id: BWBR0014270
        artikel: '8'
  - number: '12'
    text: |-
      1 De door het productschap uit hoofde van deze verordening verkregen gegevens omtrent ondernemingen worden
      in handen gesteld van de voorzitter van het productschap; zij worden, behoudens aan personeelsleden van het
      secretariaat van het productschap, niet bekendgemaakt.

      2 De voorzitter van het productschap kan, in afwijking van het gestelde in het eerste lid, besluiten tot
      bekendmaking van getotaliseerde gegevens omtrent groepen van ondernemingen, doch nimmer op zodanige wijze dat
      daaruit gegevens omtrent een bepaalde onderneming kunnen worden afgeleid.
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel12
  - number: '13'
    text: |-
      1 Het bestuur is bevoegd om ter uitvoering van deze verordening met betrekking tot de vaststelling van het geslacht
      gewicht nadere regels te stellen.

      2 De voorzitter van het productschap is bevoegd, onder door het bestuur te stellen regelen, van het bepaalde in of
      krachtens deze verordening ontheffing te verlenen en daaraan voorwaarden te verbinden.
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel13
  - number: '14'
    text: |-
      De voorzitter kan [artikel 8][ref1], [9][ref2], [10][ref3] en [11][ref4] buiten toepassing laten of daarvan
      afwijken voor zover toepassing gelet op het belang dat deze verordening beoogt te beschermen zal leiden tot een
      onbillijkheid van overwegende aard.


      [ref1]: https://wetten.overheid.nl/BWBR0014270#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0014270#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0014270#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0014270#Artikel11
    url: https://wetten.overheid.nl/BWBR0014270/2003-03-01#Artikel14
