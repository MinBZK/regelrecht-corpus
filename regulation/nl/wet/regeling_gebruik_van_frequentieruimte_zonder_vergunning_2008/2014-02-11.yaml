      De [artikelen 4 tot en met 11][ref1] en [13][ref2] hebben betrekking op gebruik van frequentieruimte zonder
      vergunning als bedoeld in [artikel 3 van het besluit][ref3], met uitzondering van maritiemmobiele communicatie
      vanaf het land.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel4
