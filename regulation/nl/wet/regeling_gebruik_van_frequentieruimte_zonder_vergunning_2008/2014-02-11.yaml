  - number: '2'
    text: |-
      1 Geen vergunning is vereist voor gebruik van frequentieruimte als bedoeld in [artikel 2 van het besluit][ref1]
      indien daarbij gebruik wordt gemaakt van de in het tweede lid aangewezen categorieën van radiozendapparaten.

      2 Als categorieën radiozendapparaten worden aangewezen:

      a. apparaten, niet zijnde apparaten als bedoeld in categorie 22 van [bijlage 8][ref2], die bestemd zijn voor
      aansluiting op een mobiel openbaar telecommunicatienetwerk, indien voor het gebruik van de door het netwerk
      gebruikte frequentieruimte een vergunning is verleend;

      b. randapparaten die bestemd zijn voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele
      communicatie, met uitzondering van maritiemmobiele communicatie en het nood-, spoed- en veiligheidsverkeer;

      c. draadloze telefoons die bestemd zijn voor aansluiting op een openbaar telefoonnetwerk op een vaste locatie, mits
      de in [bijlage 1][ref3] aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden
      genomen;

      d. radiozendapparaten voor algemene radiocommunicatie in de 27 MHz-frequentieband (CB), mits gebruikt in de in
      [bijlage 2][ref4] aangegeven frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;

      e. randapparaten die bestemd zijn voor aansluiting op een openbaar telecommunicatienetwerk ten behoeve van
      plaatsbepaling;

      f. mobiele VHF/UHF radiozendapparaten voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe
      gesloten overeenkomst onderdeel zijn van een besloten netwerk dat deel is van een radionetwerk met dynamische
      frequentietoewijzing ten behoeve waarvan een vergunning is verleend voor het gebruik van frequentieruimte;

      g. mobiele radiozendapparaten die behoren tot een digitaal radionetwerk met dynamische frequentietoewijzing,
      mits gebruikt in de in [bijlage 3][ref5] aangegeven frequentieband en met inachtneming van de daarbij behorende
      gebruiksvoorschriften;

      h. mobiele UHF radiozendapparaten die werken in de frequentieband 446 MHz en bedoeld zijn voor algemeen gebruik
      ten behoeve van communicatie over korte afstand (PMR 446), mits gebruikt in de in [bijlage 4][ref6] aangegeven
      frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;

      i. randapparaten die een satellietgrondstation zijn, mits gebruikt in de in [bijlage 5][ref7] aangegeven
      frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;

      j. randapparaten voor mobiele communicatie via ionisatiesporen van meteoren, mits gebruikt in de in
      [bijlage 6][ref8] aangegeven frequentieband en met inachtneming van de daarbij behorende gebruiksvoorschriften;

      k. radiozendapparaten die onderdeel uitmaken van, dan wel bestemd zijn voor aansluiting op, een mobiel
      elektronisch communicatienetwerk (basisstation) aan boord van vliegtuigen, mits de in [bijlage 7][ref9] aangegeven
      frequentiebanden worden gebruikt boven een vlieghoogte van 3000 meter;

      l. radiozendapparaten die onderdeel uitmaken van, dan wel bestemd zijn voor aansluiting op, een mobiel
      elektronisch communicatienetwerk (basisstation) aan boord van schepen, mits de in [bijlage 7a][ref10] aangegeven
      frequentiebanden worden gebruikt met inachtneming van de daarbij behorende gebruiksvoorschriften;

      m. de in [bijlage 8][ref11] bedoelde categorieën radiozendapparaten, mits gebruikt in de in die bijlage aangegeven
      frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;

      n. radiozendapparaten die gebruik maken van ultrawidebandtechnologie, mits de in [bijlage 9][ref12] aangegeven
      frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;

      o. radiozendapparaten die onderdeel uitmaken van een mobiel elektronisch communicatienetwerk, mits gebruikt
      overeenkomstig het bepaalde in [bijlage 8A][ref13] en radiozendapparaten die bestemd zijn voor aansluiting op dat
      netwerk, mits die gebruikmaken van de frequentieband van 1780 tot en met 1785 MHz.

      3 De aanwijzing, bedoeld in het eerste lid, heeft slechts betrekking op apparaten die voldoen aan het bij of
      krachtens het [Besluit][ref14] randapparaten en radioapparaten 2007 bepaalde.


