        artikel: '5'
  - number: '7'
    text: |-
      1 De Minister registreert het voorgenomen frequentiegebruik overeenkomstig de melding tenzij niet wordt voldaan aan
      de [artikelen 3 tot en met 6][ref1] en [8][ref2], en bericht hierover degene die de melding heeft gedaan, onder
      verstrekking van een bewijs van registratie aan degene wiens melding is geregistreerd.

      2 Het eerste lid is van overeenkomstige toepassing op de in kennisstelling, bedoeld in
      [artikel 6, zesde lid][ref3].

      3 Voor zover vereist op grond van het Radioreglement wordt bij de registratie aan de gebruiker een combinatie van
      letters of cijfers toegekend met het oog op de identificatie van zijn radiostation.

      4 Degene die op grond van de melding als frequentiegebruiker geregistreerd is, draagt er voor zorg dat indien het
      geregistreerde radiozendapparaat door een ander wordt bediend, daarbij de in deze regeling bepaalde voorschriften
      worden nageleefd.

      5 De Minister haalt de registratie door op verzoek van de betrokkene of indien de betrokkene niet langer gebruik
      maakt van de frequentieruimte en bericht hem hierover.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023553#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023553#Artikel6
