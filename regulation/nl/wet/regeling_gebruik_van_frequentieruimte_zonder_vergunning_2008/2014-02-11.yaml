articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. besluit: [Frequentiebesluit 2013][ref1];

      b. frequentieplan: het in [artikel 3.1 van de wet][ref2] bedoelde frequentieplan;

      c. Radioreglement: Radioreglement 1979 met bijlagen, behorende bij de op 22 december 1989 te Nice tot stand gekomen
      Internationale Constitutie en Conventie van de Internationale Telecommunicatie Unie (Trb. 2001, 159);

      d. Regionale Regeling: Regionale Regeling betreffende het radiotelefonieverkeer op de binnenwateren, tot stand
      gekomen in Basel op 6 april 2000 (Stcrt. 2003, 153);

      e. radiozendamateur: degene die vanuit een persoonlijke belangstelling en zonder financieel oogmerk gebruik maakt
      van frequentieruimte ten behoeve van het opdoen van vaardigheden, het communiceren via de radio en het doen van
      technisch onderzoekingen;

      f. pleziervaart: scheepvaart voor sportbeoefening of vrijetijdsbesteding;

      g. binnenvaart: scheepvaart op de binnenwateren, niet zijnde pleziervaart;

      h. zeevaart: scheepvaart, niet zijnde binnenvaart of pleziervaart;

      i. frequentiegebruik met een primaire status: gebruik van frequentieruimte voor de uitoefening van een radiodienst
      die ingevolge het frequentieplan een primaire status heeft;

      j. frequentiegebruik met een secundaire status: gebruik van frequentieruimte voor de uitoefening van een
      radiodienst die ingevolge het frequentieplan een secundaire status heeft;

      k. frequentiegebruik met een NIB-status: gebruik van frequentieruimte voor de uitoefening van een radiodienst die
      ingevolge het frequentieplan een NIB-status heeft;

      l. radiostation: een of meer radiozendapparaten met de daartoe behorende antenne-inrichtingen, noodzakelijk voor
      het op een locatie uitvoeren van een radiocommunicatiedienst in de zin van artikel 1.19 van het Radioreglement;

      m. maritiemmobiele communicatie: radiocommunicatie tussen radiostations op schepen onderling en tussen
      radiostations op schepen en op land, met inbegrip van het gebruik van noodbakens;

      n. EPIRB (Emergency Position Indicating Radio Beacon): radiozendapparaat bestemd voor noodalarmering in de 406 MHz
      band en voor het lokaliseren van het baken op de frequentie 121,5 MHz;

      o. marifoon: radiozendapparaat bestemd voor gebruik in de maritieme VHF frequentieband;

      p. portofoon: radiozendapparaat bestemd voor draagbaar gebruik in de maritieme VHF en UHF frequentieband;

      q. MMSI: de Maritime Mobile Service Identity, omschreven in paragraaf 6 van artikel 19 van het Radioreglement;

      r. uitzendingsklasse: uitzendingsklasse zoals bedoeld in bijlage 1 van deel 2 van het Radioreglement;

      s. zeemijl: 1852 meter.


