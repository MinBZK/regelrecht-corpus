  - number: '6'
    text: |-
      1 De melding, bedoeld in [artikel 5, eerste lid, van het besluit][ref1], wordt gedaan bij Agentschap Telecom, met
      gebruikmaking van een daartoe strekkend formulier.

      2 Bij de melding worden in elk geval de volgende gegevens en bescheiden verstrekt:

      a. persoonsgegevens omtrent de gebruiker;

      b. de aard van het voorgenomen frequentiegebruik;

      c. in geval van maritiemmobiele communicatie: de te gebruiken radiozendapparaten en de naam en indien aanwezig het
      identificatienummer of kenmerk van het schip waarop deze apparaten gebruikt worden;

      d. indien de gebruiker een natuurlijke persoon is, een afschrift van het certificaat, genoemd in
      [artikel 5, eerste lid][ref2], onderscheidenlijk informatie over het voldoen aan het in artikel 5, tweede lid,
      bedoelde examenvereiste. Een afschrift van het certificaat behoeft niet te worden verstrekt als het is verleend
      door de Minister.

      3 De melding kan langs elektronische weg worden gedaan met gebruikmaking van een daartoe strekkend elektronisch
      formulier en de in het vierde lid bedoelde persoonlijke code of DigiD-code.

      4 Degene die voor de eerste maal een melding langs elektronische weg doet en die niet eerder een melding voor het
      gebruik van frequentieruimte langs elektronische weg heeft gedaan, geeft daarbij een DigiD-code of persoonlijke
      code op. De persoonlijke code wordt na aanvraag door middel van een daartoe strekkend formulier verstrekt aan de
      aanvrager.

      5 Indien als gevolg van gewijzigde omstandigheden de gegevens die bij de melding zijn verstrekt niet langer
      overeenkomen met de feitelijke situatie, stelt degene die de melding heeft gedaan Agentschap Telecom in kennis van
      de actuele gegevens. Het derde en vierde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032895#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023553#Artikel5
