  - number: '11'
    text: |-
      1 Bij gebruik van frequentieruimte met de bestemming ‘amateur’ of ‘amateursatelliet’ wordt, onverlet
      [artikel 9][ref1], voldaan aan de volgende voorschriften:

      a. de radiozendamateur die het radiozendapparaat bedient, is bij het station aanwezig of draagt er zorg voor dat
      alleen hij zijn station op afstand kan bedienen;

      b. het uitzenden van omroepprogramma’s, muziek, reclame of berichten van of voor derden is niet toegestaan;

      c. de in [artikel 7, derde lid][ref2], bedoelde combinatie van letters of cijfers wordt ten minste bij het begin en
      bij het einde van elke uitzending en ten minste eenmaal per periode van vijf minuten uitgezonden, waarbij een reeks
      kortdurende uitzendingen wordt aangemerkt als één uitzending;

      d. de combinatie van letters of cijfers is bij data- en beeldoverdracht aan de ontvangstzijde na demodulatie in
      leesbaar schrift zichtbaar;

      e. bij automatische telegrafie en bij data- of beeldoverdracht waarbij toepassing van onderdeel c stuit op
      technische belemmeringen wordt de combinatie van letters of cijfers kenbaar gemaakt door middel van spraak of
      morsetelegrafie;

      f. informatie wordt niet versleuteld verzonden;

      g. radioverbindingen worden alleen tot stand gebracht met andere gebruikers van frequentieruimte met de bestemming
      ‘amateur’ of ‘amateursatelliet’;

      h. bij het spellen van de combinatie van letters of cijfers wordt gebruik gemaakt van het in [bijlage 10][ref3]
      opgenomen spellingsalfabet;

      i. de combinatie van letters of cijfers wordt uitgezonden overeenkomstig de volgende uitzendingsklasse:

      1°. Spraak: A3E, H3E, J3E, R3E, F3E en G3E;

      2°. morse telegrafie (maximale snelheid van 30 woorden per minuut): A1A, A2A, F1A, F2A, J2A, G1A en G2A;

      3°. automatische telegrafie: A1B, A2B, F1B, F2B en J2B;

      4°. data- of beeldoverdracht: F1D, F2D en P2D;

      5°. facsimilé en slow-scan televisie; (SSTV): A1C, A2C, A3C, J2C, J3C, F1C, F2C, F3C, G1C, G2C en G3C;

      6°. amateurtelevisie: A3F, C3F en F3F.

      2 Voor gezamenlijk gebruik van frequentieruimte ten dienste van radiozendamateurs tijdens groepsevenementen gelden
      de volgende voorschriften :

      a. tijdens een radiowedstrijd die door meer dan een geregistreerde wordt georganiseerd met de vorming van een
      groepsstation, kunnen de deelnemers de in [artikel 7, tweede lid][ref4], bedoelde combinatie van letters of cijfers
      van één van de geregistreerden gebruiken;

      b. bij radioamateurpeilevenementen die georganiseerd zijn door een geregistreerde vereniging van
      radiozendamateurs , is het eerste lid, onderdeel a, niet van toepassing;

      c. bij gebruik van een radiostation door leden van Scouting Nederland tijdens evenementen die georganiseerd worden
      door de werkgroep Radio Scouting Nederland wordt aan de in [artikel 7, derde lid][ref5], bedoelde combinatie van
      letters of cijfers toegevoegd: J.

      3 Voor een onderwijsinstelling geldt dat

      a. het radiostation uitsluitend wordt gebruikt tijdens lesuren;

      b. het houden van en deelnemen aan radiowedstrijden niet is toegestaan;

      c. de onderwijsinstelling een radiozendamateur die voldoet aan het in [artikel 5, tweede lid][ref6], bedoelde
      vereiste, aanwijst die namens de geregistreerde onderwijsinstelling het radiostation beheert.

      4 Voor een vereniging van radiozendamateurs geldt dat de geregistreerde een radiozendamateur die voldoet aan het in
      [artikel 5, tweede lid][ref7], bedoelde vereiste, aanwijst die namens de geregistreerde vereniging het radiostation
      beheert.


