  - number: '8'
    text: |-
      Bij het gebruik van frequentieruimte wordt voldaan aan de beperkingen en voorschriften ten aanzien van de
      beschikbare frequentieruimte, de toepassingen, het zendvermogen en de bekwaamheid die:

      a. ten aanzien van frequentieruimte met de bestemming ‘amateur’ of ‘amateursatelliet’ zijn opgenomen in
      [bijlage 10][ref1];

      b. ten aanzien van frequentieruimte met de bestemming ‘maritiemmobiele communicatie’ zijn opgenomen in
      [bijlage 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0023553
      [ref2]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2014-02-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023553
      - id: ref2
        bwb_id: BWBR0023553
  - number: '9'
    text: |-
      Bij frequentiegebruik wordt voldaan aan de volgende voorschriften:

      a. het bewijs van registratie en, in geval van maritiemmobiele communicatie, het certificaat van bediening zijn
      aanwezig bij het radiozendapparaat;

      b. bij frequentiegebruik met een secundaire status wordt te allen tijde voorrang verleend aan frequentiegebruik met
      een primaire status;

      c. bij frequentiegebruik met een NIB-status wordt te allen tijde voorrang verleend aan frequentiegebruik met een
      primaire status of met een secundaire status;

      d. er wordt zo weinig mogelijk storing of belemmering veroorzaakt in het gebruik van frequentieruimte door anderen;

      e. er worden geen valse of bedrieglijke alarmeringen, noodseinen, -oproepen of -berichten uitgezonden.
    url: https://wetten.overheid.nl/BWBR0023553/2014-02-11#Artikel9
  - number: '10'
    text: |-
      Bij gebruik van frequentieruimte met de bestemming ‘maritiemmobiele communicatie’ aan boord van een schip is het
      radiozendapparaat dat aan boord van het schip gebruikt wordt, geregistreerd voor gebruik aan boord van dat schip en
      wordt, onverlet [artikel 9][ref1], voldaan aan de volgende voorschriften:

      a. het berichtenverkeer wordt kort en zakelijk gehouden en het zendgedeelte van het radiozendapparaat wordt niet
      onnodig ingeschakeld;

      b. bij een radiozendapparaat met een alarmeringsfunctie dat abusievelijk in werking is getreden, herroept de
      geregistreerde de melding voor zover daartoe communicatiemiddelen beschikbaar zijn;

      c. een EPIRB wordt uitsluitend gebruikt voor alarmering indien sprake is van onmiddellijk dreigend gevaar voor
      bemanning en schip en indien alarmering met andere middelen niet of niet meer mogelijk is;

      d. radiozendapparaten die een alarmerings- of noodfunctie hebben, zijn zodanig geprogrammeerd dat zij bij gebruik
      automatisch het MMSI-nummer uitzenden;

      e. versleutelde radiocommunicatie door middel van een MF- of MF/HF-radiozendapparaat vindt uitsluitend plaats op
      frequenties bestemd voor radiotelefonieverkeer tussen schepen onderling, zij het dat aan boord van vissersschepen
      versleuteling bovendien kan plaatsvinden op de VHF- frequenties 155.775 MHz en 155.825 MHz;

      f. bij versleutelde radiocommunicatie als bedoeld in onderdeel e wordt tijdens de uitzending en ten minste eenmaal
      per periode van vijf minuten de in [artikel 7, derde lid][ref2], bedoelde combinatie van letters of cijfers
      onversleuteld uitgezonden;

      g. bij gebruik van een marifoon of portofoon is de antenne hiervan verticaal polariserend en rondstralend;

      h. in het werkingsgebied van de Regionale Regeling zijn de marifoon en de portofoon voorzien van een systeem voor
      automatische zenderidentificatie en geprogrammeerd met de toegewezen combinatie van letters of cijfers;

      i. een portofoon in de VHF-band wordt alleen gebruikt in combinatie met een marifoon, met dien verstande dat de
      pleziervaart in het werkingsgebied van de Regionale Regeling kan volstaan met het gebruik van alleen een portofoon;

      j. er vinden geen uitzendingen door een maritiem mobiel radiozendapparaat plaats met een onjuiste of misleidende
      identificatie.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0023553#Artikel7
