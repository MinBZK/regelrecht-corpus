  - number: '4'
    text: |-
      Een rechtspersoon kan slechts gebruik maken van frequentieruimte die ingevolge het frequentieplan de bestemming
      ‘amateur’ of ‘amateursatelliet’ heeft, indien het betreft:

      a. een rechtspersoonlijkheid bezittende vereniging van radiozendamateurs waarvan het ledental en de samenstelling
      voldoende representatief zijn voor de door de vereniging te behartigen belangen;

      b. een rechtspersoon waarvan een onderwijsinstelling uitgaat die van rijkswege wordt gefinancierd of een
      onderwijsinstelling die door de Minister van Onderwijs, Cultuur en Wetenschap is erkend, voor zover het doen van
      onderzoekingen met radiozendapparaten essentieel is voor het geven van onderwijs door deze instelling;

      c. een stichting die zich blijkens de statutaire doelstelling richt op het doen van onderzoekingen met
      radiozendapparaten en die de belangen van radiozendamateurs behartigt.
    url: https://wetten.overheid.nl/BWBR0023553/2014-02-11#Artikel4
  - number: '5'
    text: |-
      1 Degene die een radiozendapparaat bedient ten behoeve van maritiemmobiele communicatie beschikt over een
      certificaat van bediening als bedoeld in [artikel 12 van de Examenregeling frequentiegebruik 2008][ref1], dat
      geldig is voor het desbetreffende frequentiegebruik overeenkomstig het bepaalde in [bijlage 11][ref2], en heeft een
      leeftijd van ten minste zestien jaren.

      2 De radiozendamateur die een radiozendapparaat bedient, heeft met goed gevolg een examen als bedoeld in
      [artikel 7 van de Examenregeling frequentiegebruik 2008][ref3] afgelegd, dat geldig is voor het desbetreffende
      frequentiegebruik overeenkomstig het bepaalde in [bijlage 10][ref4], en heeft een leeftijd van ten minste veertien
      jaren voor het geval van volledige toegang tot de frequentieruimte, in [bijlage 10][ref5] aangeduid als registratie
      F, en een leeftijd van ten minste twaalf jaren voor het geval van beperkte toegang tot de frequentieruimte, in
      [bijlage 10][ref6] aangeduid als registratie N.

      3 In afwijking van het eerste en het tweede lid kan een persoon die niet voldoet aan de desbetreffende
      voorwaarde een radiozendapparaat bedienen indien de bediening plaatsvindt in directe aanwezigheid en onder
      verantwoordelijkheid van een persoon die wel aan deze voorwaarde voldoet.


