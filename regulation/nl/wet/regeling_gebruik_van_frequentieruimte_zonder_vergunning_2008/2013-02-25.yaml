---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_gebruik_van_frequentieruimte_zonder_vergunning_2008
regulatory_layer: WET
publication_date: '2008-12-18'
valid_from: '2013-02-25'
bwb_id: BWBR0023553
url: https://wetten.overheid.nl/BWBR0023553/2013-02-25
preamble:
  text: |-
    Gelet op artikel 3.4, eerste lid, onderdeel a, van de Telecommunicatiewet, alsmede de artikelen 11, eerste en
    tweede lid, 12, 18, 20, eerste en derde lid, en 20a, tweede, vierde en vijfde lid, van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.a
    text: |-
      besluit: [Frequentiebesluit][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009997
  - number: 1.b
    text: |-
      frequentieplan: het in [artikel 3.1 van de wet][ref1] bedoelde frequentieplan;


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: 1.c
    text: |-
      Radioreglement: Radioreglement 1979 met bijlagen, behorende bij de op 22 december 1989 te Nice tot stand gekomen
      Internationale Constitutie en Conventie van de Internationale Telecommunicatie Unie (Trb. 2001, 159);
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.d
    text: |-
      Regionale Regeling: Regionale Regeling betreffende het radiotelefonieverkeer op de binnenwateren, tot stand gekomen
      in Basel op 6 april 2000 (Stcrt. 2003, 153);
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.e
    text: |-
      radiozendamateur: degene die vanuit een persoonlijke belangstelling en zonder financieel oogmerk gebruik maakt
      van frequentieruimte ten behoeve van het opdoen van vaardigheden, het communiceren via de radio en het doen van
      technisch onderzoekingen;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.f
    text: 'pleziervaart: scheepvaart voor sportbeoefening of vrijetijdsbesteding;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.g
    text: 'binnenvaart: scheepvaart op de binnenwateren, niet zijnde pleziervaart;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.h
    text: 'zeevaart: scheepvaart, niet zijnde binnenvaart of pleziervaart;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.i
    text: |-
      frequentiegebruik met een primaire status: gebruik van frequentieruimte voor de uitoefening van een radiodienst die
      ingevolge het frequentieplan een primaire status heeft;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.j
    text: |-
      frequentiegebruik met een secundaire status: gebruik van frequentieruimte voor de uitoefening van een radiodienst
      die ingevolge het frequentieplan een secundaire status heeft;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.k
    text: |-
      frequentiegebruik met een NIB-status: gebruik van frequentieruimte voor de uitoefening van een radiodienst die
      ingevolge het frequentieplan een NIB-status heeft;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.l
    text: |-
      radiostation: een of meer radiozendapparaten met de daartoe behorende antenne-inrichtingen, noodzakelijk voor het
      op een locatie uitvoeren van een radiocommunicatiedienst in de zin van artikel 1.19 van het Radioreglement;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.m
    text: |-
      maritiemmobiele communicatie: radiocommunicatie tussen radiostations op schepen onderling en tussen radiostations
      op schepen en op land, met inbegrip van het gebruik van noodbakens;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.n
    text: |-
      EPIRB (Emergency Position Indicating Radio Beacon): radiozendapparaat bestemd voor noodalarmering in de 406 MHz
      band en voor het lokaliseren van het baken op de frequentie 121,5 MHz;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.o
    text: 'marifoon: radiozendapparaat bestemd voor gebruik in de maritieme VHF frequentieband;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.p
    text: 'portofoon: radiozendapparaat bestemd voor draagbaar gebruik in de maritieme VHF en UHF frequentieband;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.q
    text: 'MMSI: de Maritime Mobile Service Identity, omschreven in paragraaf 6 van artikel 19 van het Radioreglement;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.r
    text: 'uitzendingsklasse: uitzendingsklasse zoals bedoeld in bijlage 1 van deel 2 van het Radioreglement;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: 1.s
    text: 'zeemijl: 1852 meter.'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel1
  - number: '2.1'
    text: |-
      Geen vergunning is vereist voor gebruik van frequentieruimte als bedoeld in
      [artikel 3.4, eerste lid, onder a, van de wet][ref1] indien daarbij gebruik wordt gemaakt van de in het tweede lid
      aangewezen categorieën van radiozendapparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '2.2'
    text: 'Als categorieën radiozendapparaten worden aangewezen:'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
  - number: 2.2.a
    text: |-
      apparaten, niet zijnde apparaten als bedoeld in categorie 22 van [bijlage 8][ref1], die bestemd zijn voor
      aansluiting op een mobiel openbaar telecommunicatienetwerk, indien voor het gebruik van de door het netwerk
      gebruikte frequentieruimte een vergunning is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.b
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een openbaar satellietsysteem, ten behoeve van mobiele
      communicatie, met uitzondering van maritiemmobiele communicatie en het nood-, spoed- en veiligheidsverkeer;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
  - number: 2.2.c
    text: |-
      draadloze telefoons die bestemd zijn voor aansluiting op een openbaar telefoonnetwerk op een vaste locatie, mits
      de in [bijlage 1][ref1] aangegeven frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden
      genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.d
    text: |-
      radiozendapparaten voor algemene radiocommunicatie in de 27 MHz-frequentieband (CB), mits gebruikt in de in
      [bijlage 2][ref1] aangegeven frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.e
    text: |-
      randapparaten die bestemd zijn voor aansluiting op een openbaar telecommunicatienetwerk ten behoeve van
      plaatsbepaling;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
  - number: 2.2.f
    text: |-
      mobiele VHF/UHF radiozendapparaten voor landmobiel gebruik die daadwerkelijk en krachtens een daartoe
      gesloten overeenkomst onderdeel zijn van een besloten netwerk dat deel is van een radionetwerk met dynamische
      frequentietoewijzing ten behoeve waarvan een vergunning is verleend voor het gebruik van frequentieruimte;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
  - number: 2.2.g
    text: |-
      mobiele radiozendapparaten die behoren tot een digitaal radionetwerk met dynamische frequentietoewijzing, mits
      gebruikt in de in [bijlage 3][ref1] aangegeven frequentieband en met inachtneming van de daarbij behorende
      gebruiksvoorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.h
    text: |-
      mobiele UHF radiozendapparaten die werken in de frequentieband 446 MHz en bedoeld zijn voor algemeen gebruik
      ten behoeve van communicatie over korte afstand (PMR 446), mits gebruikt in de in [bijlage 4][ref1] aangegeven
      frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.i
    text: |-
      randapparaten die een satellietgrondstation zijn, mits gebruikt in de in [bijlage 5][ref1] aangegeven
      frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.j
    text: |-
      randapparaten voor mobiele communicatie via ionisatiesporen van meteoren, mits gebruikt in de in [bijlage 6][ref1]
      aangegeven frequentieband en met inachtneming van de daarbij behorende gebruiksvoorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.k
    text: |-
      radiozendapparaten die onderdeel uitmaken van, dan wel bestemd zijn voor aansluiting op, een mobiel elektronisch
      communicatienetwerk (basisstation) aan boord van vliegtuigen, mits de in [bijlage 7][ref1] aangegeven
      frequentiebanden worden gebruikt boven een vlieghoogte van 3000 meter;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.l
    text: |-
      radiozendapparaten die onderdeel uitmaken van, dan wel bestemd zijn voor aansluiting op, een mobiel elektronisch
      communicatienetwerk (basisstation) aan boord van schepen, mits de in [bijlage 7a][ref1] aangegeven frequentiebanden
      worden gebruikt met inachtneming van de daarbij behorende gebruiksvoorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.m
    text: |-
      de in [bijlage 8][ref1] bedoelde categorieën radiozendapparaten, mits gebruikt in de in die bijlage aangegeven
      frequentiebanden en met inachtneming van de daarbij behorende gebruiksvoorschriften;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.n
    text: |-
      radiozendapparaten die gebruik maken van ultrawidebandtechnologie, mits de in [bijlage 9][ref1] aangegeven
      frequentiebanden en de daarbij behorende gebruiksvoorschriften in acht worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 2.2.o
    text: |-
      radiozendapparaten die onderdeel uitmaken van een mobiel elektronisch communicatienetwerk, mits gebruikt
      overeenkomstig het bepaalde in [bijlage 8A][ref1] en radiozendapparaten die bestemd zijn voor aansluiting op dat
      netwerk, mits die gebruikmaken van de frequentieband van 1780 tot en met 1785 MHz.


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: '2.3'
    text: |-
      De aanwijzing, bedoeld in het eerste lid, heeft slechts betrekking op apparaten die voldoen aan het bij of
      krachtens het [Besluit][ref1] randapparaten en radioapparaten 2007 bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0009997
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0009997
  - number: '3'
    text: |-
      De [artikelen 4 tot en met 11][ref1] en [13][ref2] hebben betrekking op gebruik van frequentieruimte
      zonder vergunning als bedoeld in [artikel 3.4, eerste lid, onder c, van de wet][ref3], met uitzondering van
      maritiemmobiele communicatie vanaf het land.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0023553#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009950#Artikel3
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0023553
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0009950
        artikel: '3'
  - number: '4'
    text: |-
      Een rechtspersoon kan slechts gebruik maken van frequentieruimte die ingevolge het frequentieplan de bestemming
      ‘amateur’ of ‘amateursatelliet’ heeft, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel4
  - number: 4.a
    text: |-
      een rechtspersoonlijkheid bezittende vereniging van radiozendamateurs waarvan het ledental en de samenstelling
      voldoende representatief zijn voor de door de vereniging te behartigen belangen;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel4
  - number: 4.b
    text: |-
      een rechtspersoon waarvan een onderwijsinstelling uitgaat die van rijkswege wordt gefinancierd of een
      onderwijsinstelling die door de Minister van Onderwijs, Cultuur en Wetenschap is erkend, voor zover het doen van
      onderzoekingen met radiozendapparaten essentieel is voor het geven van onderwijs door deze instelling;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel4
  - number: 4.c
    text: |-
      een stichting die zich blijkens de statutaire doelstelling richt op het doen van onderzoekingen met
      radiozendapparaten en die de belangen van radiozendamateurs behartigt.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel4
  - number: '5.1'
    text: |-
      Degene die een radiozendapparaat bedient ten behoeve van maritiemmobiele communicatie beschikt over een certificaat
      van bediening als bedoeld in [artikel 12 van de Examenregeling frequentiegebruik 2008][ref1], dat geldig is voor
      het desbetreffende frequentiegebruik overeenkomstig het bepaalde in [bijlage 11][ref2], en heeft een leeftijd van
      ten minste zestien jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0023553
  - number: '5.2'
    text: |-
      De radiozendamateur die een radiozendapparaat bedient, heeft met goed gevolg een examen als bedoeld in
      [artikel 7 van de Examenregeling frequentiegebruik 2008][ref1] afgelegd, dat geldig is voor het desbetreffende
      frequentiegebruik overeenkomstig het bepaalde in [bijlage 10][ref2], en heeft een leeftijd van ten minste veertien
      jaren voor het geval van volledige toegang tot de frequentieruimte, in [bijlage 10][ref3] aangeduid als registratie
      F, en een leeftijd van ten minste twaalf jaren voor het geval van beperkte toegang tot de frequentieruimte, in
      [bijlage 10][ref4] aangeduid als registratie N.


      [ref1]: https://wetten.overheid.nl/BWBR0024285#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0023553
      [ref3]: https://wetten.overheid.nl/BWBR0023553
      [ref4]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024285
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0023553
      - id: ref3
        bwb_id: BWBR0023553
      - id: ref4
        bwb_id: BWBR0023553
  - number: '5.3'
    text: |-
      In afwijking van het eerste en het tweede lid kan een persoon die niet voldoet aan de desbetreffende voorwaarde een
      radiozendapparaat bedienen indien de bediening plaatsvindt in directe aanwezigheid en onder verantwoordelijkheid
      van een persoon die wel aan deze voorwaarde voldoet.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel5
  - number: '6.1'
    text: |-
      De melding, bedoeld in [artikel 20a, eerste lid, van het besluit][ref1], wordt gedaan bij Agentschap Telecom, met
      gebruikmaking van een daartoe strekkend formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0009997#Artikel20a
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009997
        artikel: 20a
  - number: '6.2'
    text: 'Bij de melding worden in elk geval de volgende gegevens en bescheiden verstrekt:'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
  - number: 6.2.a
    text: persoonsgegevens omtrent de gebruiker;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
  - number: 6.2.b
    text: de aard van het voorgenomen frequentiegebruik;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
  - number: 6.2.c
    text: |-
      in geval van maritiemmobiele communicatie: de te gebruiken radiozendapparaten en de naam en indien aanwezig het
      identificatienummer of kenmerk van het schip waarop deze apparaten gebruikt worden;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
  - number: 6.2.d
    text: |-
      indien de gebruiker een natuurlijke persoon is, een afschrift van het certificaat, genoemd in
      [artikel 5, eerste lid][ref1], onderscheidenlijk informatie over het voldoen aan het in [artikel 5][ref2], tweede
      lid, bedoelde examenvereiste. Een afschrift van het certificaat behoeft niet te worden verstrekt als het is
      verleend door de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0023553#Artikel5
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0023553
        artikel: '5'
  - number: '6.3'
    text: |-
      De melding kan langs elektronische weg worden gedaan met gebruikmaking van een daartoe strekkend elektronisch
      formulier en de in het vierde lid bedoelde persoonlijke code of DigiD-code.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
  - number: '6.4'
    text: |-
      Degene die voor de eerste maal een melding langs elektronische weg doet en die niet eerder een melding voor het
      gebruik van frequentieruimte langs elektronische weg heeft gedaan, geeft daarbij een DigiD-code of persoonlijke
      code op. De persoonlijke code wordt na aanvraag door middel van een daartoe strekkend formulier verstrekt aan de
      aanvrager.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
  - number: '6.5'
    text: |-
      Indien als gevolg van gewijzigde omstandigheden de gegevens die bij de melding zijn verstrekt niet langer
      overeenkomen met de feitelijke situatie, stelt degene die de melding heeft gedaan Agentschap Telecom in kennis van
      de actuele gegevens. Het derde en vierde lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel6
  - number: '7.1'
    text: |-
      De Minister registreert het voorgenomen frequentiegebruik overeenkomstig de melding tenzij niet wordt voldaan aan
      de [artikelen 3 tot en met 6][ref1] en [8][ref2], en bericht hierover degene die de melding heeft gedaan, onder
      verstrekking van een bewijs van registratie aan degene wiens melding is geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023553#Artikel8
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023553
        artikel: '8'
  - number: '7.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op de in kennisstelling, bedoeld in [artikel 6, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel6
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '6'
  - number: '7.3'
    text: |-
      Voor zover vereist op grond van het Radioreglement wordt bij de registratie aan de gebruiker een combinatie van
      letters of cijfers toegekend met het oog op de identificatie van zijn radiostation.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel7
  - number: '7.4'
    text: |-
      Degene die op grond van de melding als frequentiegebruiker geregistreerd is, draagt er voor zorg dat indien het
      geregistreerde radiozendapparaat door een ander wordt bediend, daarbij de in deze regeling bepaalde voorschriften
      worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel7
  - number: '7.5'
    text: |-
      De Minister haalt de registratie door op verzoek van de betrokkene of indien de betrokkene niet langer gebruik
      maakt van de frequentieruimte en bericht hem hierover.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel7
  - number: '8'
    text: |-
      Bij het gebruik van frequentieruimte wordt voldaan aan de beperkingen en voorschriften ten aanzien van de
      beschikbare frequentieruimte, de toepassingen, het zendvermogen en de bekwaamheid die:
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel8
  - number: 8.a
    text: |-
      ten aanzien van frequentieruimte met de bestemming ‘amateur’ of ‘amateursatelliet’ zijn opgenomen in
      [bijlage 10][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 8.b
    text: |-
      ten aanzien van frequentieruimte met de bestemming ‘maritiemmobiele communicatie’ zijn opgenomen in
      [bijlage 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: '9'
    text: 'Bij frequentiegebruik wordt voldaan aan de volgende voorschriften:'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel9
  - number: 9.a
    text: |-
      het bewijs van registratie en, in geval van maritiemmobiele communicatie, het certificaat van bediening zijn
      aanwezig bij het radiozendapparaat;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel9
  - number: 9.b
    text: |-
      bij frequentiegebruik met een secundaire status wordt te allen tijde voorrang verleend aan frequentiegebruik met
      een primaire status;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel9
  - number: 9.c
    text: |-
      bij frequentiegebruik met een NIB-status wordt te allen tijde voorrang verleend aan frequentiegebruik met een
      primaire status of met een secundaire status;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel9
  - number: 9.d
    text: er wordt zo weinig mogelijk storing of belemmering veroorzaakt in het gebruik van frequentieruimte door anderen;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel9
  - number: 9.e
    text: er worden geen valse of bedrieglijke alarmeringen, noodseinen, -oproepen of -berichten uitgezonden.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel9
  - number: '10'
    text: |-
      Bij gebruik van frequentieruimte met de bestemming ‘maritiemmobiele communicatie’ aan boord van een schip is het
      radiozendapparaat dat aan boord van het schip gebruikt wordt, geregistreerd voor gebruik aan boord van dat schip en
      wordt, onverlet [artikel 9][ref1], voldaan aan de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel9
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '9'
  - number: 10.a
    text: |-
      het berichtenverkeer wordt kort en zakelijk gehouden en het zendgedeelte van het radiozendapparaat wordt niet
      onnodig ingeschakeld;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.b
    text: |-
      bij een radiozendapparaat met een alarmeringsfunctie dat abusievelijk in werking is getreden, herroept de
      geregistreerde de melding voor zover daartoe communicatiemiddelen beschikbaar zijn;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.c
    text: |-
      een EPIRB wordt uitsluitend gebruikt voor alarmering indien sprake is van onmiddellijk dreigend gevaar voor
      bemanning en schip en indien alarmering met andere middelen niet of niet meer mogelijk is;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.d
    text: |-
      radiozendapparaten die een alarmerings- of noodfunctie hebben, zijn zodanig geprogrammeerd dat zij bij gebruik
      automatisch het MMSI-nummer uitzenden;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.e
    text: |-
      versleutelde radiocommunicatie door middel van een MF- of MF/HF-radiozendapparaat vindt uitsluitend plaats op
      frequenties bestemd voor radiotelefonieverkeer tussen schepen onderling, zij het dat aan boord van vissersschepen
      versleuteling bovendien kan plaatsvinden op de VHF- frequenties 155.775 MHz en 155.825 MHz;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.f
    text: |-
      bij versleutelde radiocommunicatie als bedoeld in onderdeel e wordt tijdens de uitzending en ten minste eenmaal
      per periode van vijf minuten de in [artikel 7, derde lid][ref1], bedoelde combinatie van letters of cijfers
      onversleuteld uitgezonden;


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel7
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '7'
  - number: 10.g
    text: bij gebruik van een marifoon of portofoon is de antenne hiervan verticaal polariserend en rondstralend;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.h
    text: |-
      in het werkingsgebied van de Regionale Regeling zijn de marifoon en de portofoon voorzien van een systeem voor
      automatische zenderidentificatie en geprogrammeerd met de toegewezen combinatie van letters of cijfers;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.i
    text: |-
      een portofoon in de VHF-band wordt alleen gebruikt in combinatie met een marifoon, met dien verstande dat de
      pleziervaart in het werkingsgebied van de Regionale Regeling kan volstaan met het gebruik van alleen een portofoon;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: 10.j
    text: |-
      er vinden geen uitzendingen door een maritiem mobiel radiozendapparaat plaats met een onjuiste of misleidende
      identificatie.
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel10
  - number: '11.1'
    text: |-
      Bij gebruik van frequentieruimte met de bestemming ‘amateur’ of ‘amateursatelliet’ wordt, onverlet
      [artikel 9][ref1], voldaan aan de volgende voorschriften:


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel9
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '9'
  - number: 11.1.a
    text: |-
      de radiozendamateur die het radiozendapparaat bedient, is bij het station aanwezig of draagt er zorg voor dat
      alleen hij zijn station op afstand kan bedienen;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.b
    text: het uitzenden van omroepprogramma’s, muziek, reclame of berichten van of voor derden is niet toegestaan;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.c
    text: |-
      de in [artikel 7, derde lid][ref1], bedoelde combinatie van letters of cijfers wordt ten minste bij het begin en
      bij het einde van elke uitzending en ten minste eenmaal per periode van vijf minuten uitgezonden, waarbij een reeks
      kortdurende uitzendingen wordt aangemerkt als één uitzending;


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel7
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '7'
  - number: 11.1.d
    text: |-
      de combinatie van letters of cijfers is bij data- en beeldoverdracht aan de ontvangstzijde na demodulatie in
      leesbaar schrift zichtbaar;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.e
    text: |-
      bij automatische telegrafie en bij data- of beeldoverdracht waarbij toepassing van onderdeel c stuit op technische
      belemmeringen wordt de combinatie van letters of cijfers kenbaar gemaakt door middel van spraak of morsetelegrafie;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.f
    text: informatie wordt niet versleuteld verzonden;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.g
    text: |-
      radioverbindingen worden alleen tot stand gebracht met andere gebruikers van frequentieruimte met de bestemming
      ‘amateur’ of ‘amateursatelliet’;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.h
    text: |-
      bij het spellen van de combinatie van letters of cijfers wordt gebruik gemaakt van het in [bijlage 10][ref1]
      opgenomen spellingsalfabet;


      [ref1]: https://wetten.overheid.nl/BWBR0023553
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023553
  - number: 11.1.i
    text: 'de combinatie van letters of cijfers wordt uitgezonden overeenkomstig de volgende uitzendingsklasse:'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.i.1°
    text: 'Spraak: A3E, H3E, J3E, R3E, F3E en G3E;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.i.2°
    text: 'morse telegrafie (maximale snelheid van 30 woorden per minuut): A1A, A2A, F1A, F2A, J2A, G1A en G2A;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.i.3°
    text: 'automatische telegrafie: A1B, A2B, F1B, F2B en J2B;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.i.4°
    text: 'data- of beeldoverdracht: F1D, F2D en P2D;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.i.5°
    text: 'facsimilé en slow-scan televisie; (SSTV): A1C, A2C, A3C, J2C, J3C, F1C, F2C, F3C, G1C, G2C en G3C;'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.1.i.6°
    text: 'amateurtelevisie: A3F, C3F en F3F.'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: '11.2'
    text: |-
      Voor gezamenlijk gebruik van frequentieruimte ten dienste van radiozendamateurs tijdens groepsevenementen gelden de
      volgende voorschriften :
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.2.a
    text: |-
      tijdens een radiowedstrijd die door meer dan een geregistreerde wordt georganiseerd met de vorming van een
      groepsstation, kunnen de deelnemers de in [artikel 7, tweede lid][ref1], bedoelde combinatie van letters of cijfers
      van één van de geregistreerden gebruiken;


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel7
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '7'
  - number: 11.2.b
    text: |-
      bij radioamateurpeilevenementen die georganiseerd zijn door een geregistreerde vereniging van radiozendamateurs ,
      is het eerste lid, onderdeel a, niet van toepassing;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.2.c
    text: |-
      bij gebruik van een radiostation door leden van Scouting Nederland tijdens evenementen die georganiseerd worden
      door de werkgroep Radio Scouting Nederland wordt aan de in [artikel 7, derde lid][ref1], bedoelde combinatie van
      letters of cijfers toegevoegd: J.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel7
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '7'
  - number: '11.3'
    text: Voor een onderwijsinstelling geldt dat
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.3.a
    text: het radiostation uitsluitend wordt gebruikt tijdens lesuren;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.3.b
    text: het houden van en deelnemen aan radiowedstrijden niet is toegestaan;
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
  - number: 11.3.c
    text: |-
      de onderwijsinstelling een radiozendamateur die voldoet aan het in [artikel 5, tweede lid][ref1], bedoelde
      vereiste, aanwijst die namens de geregistreerde onderwijsinstelling het radiostation beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel5
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '5'
  - number: '11.4'
    text: |-
      Voor een vereniging van radiozendamateurs geldt dat de geregistreerde een radiozendamateur die voldoet aan het in
      [artikel 5, tweede lid][ref1], bedoelde vereiste, aanwijst die namens de geregistreerde vereniging het radiostation
      beheert.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel5
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '5'
  - number: '12'
    text: |-
      De [Regeling gebruik van frequentieruimte zonder vergunning][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0015732
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0015732
  - number: '13.1'
    text: |-
      De Minister registreert frequentiegebruik waarvoor ten tijde van de inwerkingtreding van deze regeling een
      vergunning is afgegeven voor zover het frequentieruimte als bedoeld in [artikel 3][ref1] betreft en voor zover
      het gebruik voldoet aan de bij [artikel 8][ref2] gestelde beperkingen en voorschriften. De Minister verstrekt de
      betrokkene ambtshalve een bewijs van registratie.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0023553#Artikel8
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0023553
        artikel: '8'
  - number: '13.2'
    text: |-
      [Artikel 6, eerste tot en met zesde lid][ref1], is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0023553#Artikel6
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0023553
        artikel: '6'
  - number: '16'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop
      [artikel V van de Verzamelwet vereenvoudiging vergunningen][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0023549#ArtikelV
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0023549
        artikel: V
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Regeling gebruik van frequentieruimte zonder vergunning 2008.'
    url: https://wetten.overheid.nl/BWBR0023553/2013-02-25#Artikel17
