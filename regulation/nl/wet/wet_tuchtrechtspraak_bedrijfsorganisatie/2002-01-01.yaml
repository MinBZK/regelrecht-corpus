---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tuchtrechtspraak_bedrijfsorganisatie
regulatory_layer: WET
publication_date: '2004-02-05'
valid_from: '2002-01-01'
bwb_id: BWBR0002145
url: https://wetten.overheid.nl/BWBR0002145/2002-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te geven omtrent tuchtrechtelijke handhaving
    van verordeningen van hoofdbedrijf- en bedrijfschappen en van lichamen, ingesteld ter gemeenschappelijke
    behartiging van belangen, als bedoeld in artikel 110 van de Wet op de Bedrijfsorganisatie;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet worden onder lichaam verstaan de bedrijfslichamen bedoeld in
      [artikel 66, vierde lid, van de Wet op de bedrijfsorganisatie][ref1] en de lichamen, ingesteld ter
      gemeenschappelijke behartiging van belangen, bedoeld in artikel 110 van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel66
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '66'
  - number: '2'
    text: Voor de toepassing van deze wet wordt onder het College verstaan het College van Beroep voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel2
  - number: '3'
    text: |-
      De tuchtrechtelijke maatregelen in de zin van de [artikelen 105][ref1] en
      [113 van de Wet op de Bedrijfsorganisatie][ref2], die op overtreding van verordeningen van een lichaam kunnen
      worden gesteld, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel105
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel113
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '105'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '113'
  - number: 3.1°
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel3
  - number: 3.2°
    text: geldboete;
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel3
  - number: 3.3°
    text: openbaarmaking van de tuchtbeschikking op kosten van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel3
  - number: '4'
    text: |-
      De tuchtrechtelijke maatregel van berisping bestaat uit een schriftelijk of mondeling vermaan tot de betrokkene in
      verband met het begane feit.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel4
  - number: '5.1'
    text: Het bedrag van de geldboete is ten minste € 2.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel5
  - number: '5.2'
    text: |-
      Het hoogste bedrag van de geldboete wordt bij verordening bepaald en is niet hoger dan € 450. De geldboete kan
      geheel of gedeeltelijk voorwaardelijk worden opgelegd.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel5
  - number: '5.3'
    text: |-
      In de instellingsverordening als bedoeld in artikel 67, eerste lid, van de wet kan worden bepaald, dat het lichaam
      op overtreding van daarbij aangewezen verordeningen een hogere geldboete dan € 450 kan stellen. In geen geval zal
      het bedrag der geldboete hoger zijn dan € 4 500.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel5
  - number: '6.1'
    text: |-
      In de gevallen, waarin het tuchtgerecht de openbaarmaking van zijn tuchtbeschikking gelast, bepaalt het tevens de
      wijze, waarop aan die last uitvoering wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel6
  - number: '6.2'
    text: De kosten van openbaarmaking worden in de tuchtbeschikking op een bepaald bedrag geschat.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel6
  - number: '7.1'
    text: |-
      Indien een feit, dat tuchtrechtelijk kan worden afgedaan, wordt begaan door of vanwege een rechtspersoon of
      een vennootschap, wordt de tuchtrechtelijke vervolging ingesteld en worden maatregelen genomen hetzij tegen die
      rechtspersoon of die vennootschap, hetzij tegen hen, die tot het feit opdracht hebben gegeven of die feitelijk
      leiding hebben gehad bij het verboden handelen of nalaten, hetzij tegen beiden.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel7
  - number: '7.2'
    text: |-
      Een feit wordt onder meer begaan door of vanwege een rechtspersoon of een vennootschap, indien het begaan wordt
      door personen, die hetzij uit hoofde van een dienstbetrekking, hetzij uit anderen hoofde handelen in de sfeer van
      de rechtspersoon of de vennootschap, ongeacht of deze personen ieder afzonderlijk het feit hebben begaan, dan wel
      bij hen gezamenlijk de elementen van dat feit aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel7
  - number: '7.3'
    text: |-
      Indien een tuchtrechtelijke vervolging wordt ingesteld tegen een rechtspersoon of een vennootschap, wordt deze
      tijdens de vervolging vertegenwoordigd door de bestuurder en, indien er meer bestuurders zijn, door één dezer. Het
      tuchtgerecht kan de persoonlijke verschijning van een bestuurder bevelen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel7
  - number: '8.1'
    text: |-
      Het bestuur van het betrokken lichaam regelt bij verordening de rechtsgang van het tuchtrechtelijke geding alsmede
      de samenstelling en de bevoegdheden van het tuchtgerecht of de tuchtgerechten en, indien van tuchtbeschikkingen
      voorziening bij een ander tuchtgerecht kan worden gevraagd, de samenstelling en bevoegdheden van dat tuchtgerecht.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel8
  - number: '8.2'
    text: |-
      De verordening geeft waarborgen voor een deugdelijke berechting. Zij behoeft de goedkeuring van Onze betrokken
      Ministers en van Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel8
  - number: '8.3'
    text: |-
      De verordening kan inhouden, dat aan de betrokkene en aan de in [artikel 7, derde lid][ref1], bedoelde bestuurder,
      die, na door het tuchtgerecht bij aangetekend schrijven te zijn opgeroepen om in persoon te verschijnen, zonder
      geldige redenen, zulks ter beoordeling van het tuchtgerecht, wegblijven, tuchtrechtelijke maatregelen kunnen worden
      opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002145#Artikel7
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002145
        artikel: '7'
  - number: '8.4'
    text: |-
      Het tuchtgerecht is niet bevoegd over een zaak te oordelen, indien noch de voorzitter, noch een der leden noch de
      secretaris voldoet aan de vereisten voor benoeming tot rechter in een arrondissements-rechtbank.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel8
  - number: '9.1'
    text: |-
      De betrokkene kan, tenzij het tuchtgerecht beveelt, dat hij in persoon zal verschijnen, zich op de terechtzitting
      doen vertegenwoordigen door een advocaat, indien deze aldaar verklaart daartoe bepaaldelijk gevolmachtigd te zijn,
      of wel door een daartoe bij bijzondere volmacht schriftelijk gemachtigde.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel9
  - number: '9.2'
    text: |-
      Het tuchtgerecht kan weigeren bepaalde personen, die niet zijn advocaat, als gemachtigde toe te laten. Bij zodanige
      weigering houdt het tuchtgerecht de zaak tot de volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel9
  - number: '9.3'
    text: |-
      Het tuchtgerecht stelt bij aangetekende brief de betrokkene met de aanhouding en de reden daarvan in kennis
      en roept hem tevens op om op de voor de zaak bepaalde nadere zitting in persoon of bij een andere gemachtigde
      tegenwoordig te zijn.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel9
  - number: '9.4'
    text: De betrokkene kan zich te allen tijde door een raadsman doen bijstaan.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel9
  - number: '9.5'
    text: |-
      Het tuchtgerecht kan weigeren bepaalde personen, die niet zijn advocaat, als raadsman toe te laten. Bij zodanige
      weigering houdt het tuchtgerecht op verzoek van de betrokkene de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel9
  - number: '10.1'
    text: |-
      Voor de aanvang van de behandeling ter terechtzitting van het tuchtgerecht kan elk der zittende leden door de
      betrokkene worden gewraakt op grond van feiten en omstandigheden, die het vormen van een onpartijdig oordeel zouden
      kunnen bemoeilijken.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel10
  - number: '10.2'
    text: Op grond van zodanige feiten of omstandigheden kan een lid zich verschonen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel10
  - number: '10.3'
    text: |-
      De overige leden beslissen zo spoedig mogelijk of de wraking of verschoning wordt toegestaan. In geval van staking
      van stemmen is het verzoek tot wraking of verschoning toegestaan.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel10
  - number: '11.1'
    text: |-
      Het tuchtgerecht is bevoegd ambtshalve of op verzoek van de betrokkene getuigen bij aangetekend schrijven op te
      roepen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel11
  - number: '11.2'
    text: Ieder, die als getuige is opgeroepen, is verplicht voor het tuchtgerecht te verschijnen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel11
  - number: '11.3'
    text: |-
      Indien de getuige niet op de oproeping verschijnt, kan het tuchtgerecht de officier van justitie bij de
      arrondissements-rechtbank, binnen welker rechtsgebied het tuchtgerecht zitting houdt, verzoeken de getuige ter
      terechtzitting van het tuchtgerecht te dagvaarden en daarbij te voegen een bevel tot medebrenging.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel11
  - number: '11.4'
    text: |-
      Met betrekking tot het horen van de getuigen en hun recht van verschoning vinden de artikelen 217-220 van het
      [Wetboek van Strafvordering][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '11.5'
    text: |-
      De voorzitter van het tuchtgerecht kan de getuige beëdigen dat hij de gehele waarheid en niets dan de waarheid
      zal zeggen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het tuchtgerecht kan ambtshalve of op verzoek van de betrokkene een of meer deskundigen benoemen, ten einde het
      gerecht voor te lichten, zo nodig, met opdracht een onderzoek in te stellen en het gerecht een verslag uit te
      brengen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel12
  - number: '12.2'
    text: Het tuchtgerecht roept de deskundigen bij aangetekend schrijven op.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel12
  - number: '12.3'
    text: |-
      De deskundige is verplicht zijn taak onpartijdig en naar beste weten te verrichten. Ten aanzien van de deskundigen
      en hun verhoor vinden de artikelen 217-220 van het [Wetboek van Strafvordering][ref1] overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0001903
  - number: '12.4'
    text: Het tuchtgerecht kan de deskundige geheimhouding opleggen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel12
  - number: '13'
    text: |-
      Degeen, die als getuige of deskundige is opgeroepen, ontvangt een vergoeding overeenkomstig het Tarief in
      strafzaken.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel13
  - number: '14.1'
    text: De tuchtbeschikking houdt de gronden in en wijst de voorschriften aan, waarop zij rust.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel14
  - number: '14.2'
    text: |-
      De inhoud van de tuchtbeschikking wordt bij aangetekend schrijven ter kennis van de betrokkene en van het lichaam
      gebracht.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel14
  - number: '15'
    text: De betrokkene kan tegen de tuchtbeschikking beroep instellen bij het College.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel15
  - number: '16'
    text: |-
      Geen beroep kan worden ingesteld, indien een ander gewoon rechtsmiddel tegen de tuchtbeschikking openstaat of
      opengestaan heeft.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel16
  - number: '17'
    text: 'Het beroep kan worden ingesteld ter zake dat:'
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel17
  - number: 17.a
    text: de tuchtbeschikking niet inhoudt de gronden of niet aanwijst de voorschriften, waarop de veroordeling rust;
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel17
  - number: 17.b
    text: de regelen omtrent de samenstelling van het tuchtgerecht en zijn bevoegdheid zijn geschonden;
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel17
  - number: 17.c
    text: het tuchtgeding is gevoerd in strijd met enig algemeen beginsel van behoorlijke rechtspraak;
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel17
  - number: 17.d
    text: het tuchtgerecht niet in redelijkheid tot de opgelegde maatregel of maatregelen heeft kunnen komen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel17
  - number: '18'
    text: |-
      Het beroep wordt ingesteld binnen veertien dagen na verzending van het bij [artikel 14][ref1] bedoelde schrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002145#Artikel14
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002145
        artikel: '14'
  - number: '19.1'
    text: |-
      Het beroep wordt, op straffe van niet-ontvankelijkheid, ingesteld door een schriftelijke verklaring door of namens
      de betrokkene aan de griffier van het College.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel19
  - number: '19.2'
    text: |-
      De griffier doet van het afleggen van de verklaring binnen vijf dagen mededeling aan het tuchtgerecht en aan het
      lichaam, welks verordening zou zijn overtreden.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel19
  - number: '20'
    text: |-
      Het tuchtgerecht doet binnen een en twintig dagen na ontvangst van de mededeling, bedoeld in het tweede lid van het
      voorgaande artikel, de stukken toekomen aan de griffier van het College.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel20
  - number: '21'
    text: |-
      De betrokkene, door of namens wie beroep is ingesteld, is, op straffe van niet-ontvankelijkheid, verplicht binnen
      een en twintig dagen, nadat het beroep is ingesteld, ter griffie van het College een schriftuur in te dienen,
      houdende zijn middelen van beroep.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel21
  - number: '22.1'
    text: |-
      Is het beroep kennelijk niet-ontvankelijk of ongegrond, dan kan, zonder dat een nader onderzoek door het College
      vereist is, de voorzitter bij met redenen omklede beschikking het beroep niet-ontvankelijk of ongegrond verklaren.
      De griffier doet afschrift van de beschikking bij aangetekend schrijven aan de betrokkene, het tuchtgerecht en het
      lichaam toekomen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel22
  - number: '22.2'
    text: |-
      Tegen de beschikking, in het voorgaande lid vermeld, kan de betrokkene binnen veertien dagen na de verzending van
      het afschrift er van verzet doen bij het College. Artikel 19 is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het College verklaart het verzet niet-ontvankelijk, gegrond of ongegrond. Indien het verzet gegrond wordt
      verklaard, vervalt de beschikking. De laatste zin van het eerste lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel22
  - number: '22.4'
    text: |-
      Is het College van oordeel, dat het beroep kennelijk niet-ontvankelijk of ongegrond is, dan kan het zonder nader
      onderzoek het verzet niet-ontvankelijk of ongegrond verklaren, echter niet dan na de betrokkene in de gelegenheid
      te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel22
  - number: '22.5'
    text: De beschikking van het College ter zake van het gedane verzet is met redenen omkleed.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel22
  - number: '22.6'
    text: De griffier brengt de beschikking van het College ter kennis van de betrokkene, het tuchtgerecht en het lichaam.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel22
  - number: '23.1'
    text: |-
      Indien het voorgaande artikel geen toepassing vindt of het verzet gegrond is verklaard, bepaalt de voorzitter
      de dag voor de behandeling der zaak. De griffier brengt bij aangetekend schrijven de rechtsdag ter kennis van de
      betrokkene en van het lichaam.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel23
  - number: '23.2'
    text: |-
      Voor de behandeling ter terechtzitting worden de processtukken in origineel of in door de griffier gewaarmerkte
      afschriften gedurende ten minste zes dagen ter griffie, ter griffie van een rechtbank of elders ter kosteloze
      inzage voor de betrokkene of zijn gemachtigde en voor het lichaam nedergelegd. De nederlegging wordt door de
      griffier tijdig ter kennis van de betrokkene en van het lichaam gebracht.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel23
  - number: '23.3'
    text: De in het vorige lid bedoelde termijn kan met toestemming van de betrokkene worden verkort.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel23
  - number: '23.4'
    text: |-
      Is de termijn niet in acht genomen, dan bepaalt het College een nieuwe rechtsdag, tenzij de betrokkene in persoon
      of bij gemachtigde is verschenen. In dit laatste geval kan op zijn verzoek uitstel worden verleend.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel23
  - number: '23.5'
    text: |-
      In de gevallen, waarin op de terechtzitting de behandeling van de zaak voor een bepaalde tijd wordt uitgesteld of
      geschorst, wordt geen nieuwe kennisgeving gedaan.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel23
  - number: '24'
    text: |-
      Op het rechtsgeding voor het College zijn de [artikelen 9][ref1]-[13][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002145#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002145#Artikel13
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002145
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002145
        artikel: '13'
  - number: '25'
    text: |-
      Aan de betrokkene of zijn gemachtigde en aan de raadsman wordt de gelegenheid gegeven het woord te voeren en de
      middelen van beroep toe te lichten.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel25
  - number: '26.1'
    text: Het College kan ambtshalve of op verzoek van de betrokkene het lichaam uitnodigen inlichtingen te verschaffen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel26
  - number: '26.2'
    text: Het lichaam kan zich ter terechtzitting van het College doen vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel26
  - number: '26.3'
    text: |-
      De vertegenwoordiger van het lichaam wordt desverlangd door het College in de gelegenheid gesteld het woord te
      voeren.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel26
  - number: '27'
    text: |-
      Na de behandeling van de zaak ter terechtzitting bepaalt de voorzitter de dag voor de uitspraak. Het College kan
      ook terstond uitspraak doen.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel27
  - number: '28.1'
    text: Het College verklaart het beroep niet-ontvankelijk, verwerpt het of verklaart het gegrond.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel28
  - number: '28.2'
    text: |-
      Indien het College niet voldoende is ingelicht, kan het bevelen, dat de behandeling der zaak op een nader te
      bepalen datum zal worden hervat.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien het College het beroep gegrond verklaart, vernietigt het de tuchtbeschikking; het doet alsdan de zaak zelf
      af of verwijst haar naar een tuchtgerecht van het lichaam, welks verordening zou zijn overtreden, om haar af te
      doen met inachtneming van de beslissing van het College.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel29
  - number: '29.2'
    text: |-
      Indien een nader onderzoek noodzakelijk is en het College de zaak zelf afdoet, geschiedt dit onderzoek
      overeenkomstig de rechtsgang, welke is vastgesteld voor het tuchtgerecht, waarvan de beschikking is vernietigd.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel29
  - number: '30.1'
    text: De uitspraak van het College houdt de gronden in en wijst de voorschriften aan, waarop zij rust.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel30
  - number: '30.2'
    text: |-
      De uitspraak wordt door de voorzitter van de kamer, die de uitspraak heeft gedaan, en de griffier ondertekend.
      Indien de voorzitter zich in de onmogelijkheid bevindt de uitspraak te ondertekenen, geschiedt zulks door het
      oudst benoemde gewone of buitengewone lid, dat de uitspraak mede gewezen heeft. Indien de griffier zich in de
      onmogelijkheid bevindt, wordt daarvan instede van de ondertekening melding gemaakt.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel30
  - number: '31'
    text: De griffier brengt de uitspraak van het College ter kennis van de betrokkene, het tuchtgerecht en het lichaam.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel31
  - number: '32'
    text: |-
      De tenuitvoerlegging van tuchtbeschikkingen en van uitspraken van het College geschiedt op last van het dagelijks
      bestuur van het betrokken lichaam. Het dagelijks bestuur kan niet van tenuitvoerlegging afzien, tenzij met
      goedkeuring van de voorzitter van het College.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel32
  - number: '33'
    text: Geen tuchtbeschikking wordt tenuitvoergelegd, zolang daartegen enig gewoon rechtsmiddel openstaat.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel33
  - number: '34.1'
    text: |-
      Het dagelijks bestuur van het lichaam brengt binnen veertien dagen na het onherroepelijk worden van de
      tuchtbeschikking of van de uitspraak van het College bij aangetekend schrijven ter kennis van de betrokkene, binnen
      welke termijn hij de opgelegde geldboete of de kosten van openbaarmaking van de tuchtbeschikking moet voldoen. Die
      termijn kan op ten hoogste twee maanden worden gesteld en kan telkens worden verlengd, doch mag de duur van twee
      jaren niet te boven gaan.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel34
  - number: '34.2'
    text: |-
      Bij gebreke van volledige betaling binnen de in het voorgaande lid bedoelde termijn
      wordt het niet betaalde bedrag ingevorderd op dezelfde wijze als de heffingen, bedoeld in
      [artikel 126, eerste lid, van de Wet op de Bedrijfsorganisatie][ref1]. Artikel 127 van die wet is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '126'
  - number: '35'
    text: |-
      Indien in strijd met [artikel 32][ref1] van tenuitvoerlegging wordt afgezien of indien de in het voorgaande
      artikel gestelde termijnen niet worden in acht genomen, wordt geacht zich een geval voor te doen, als bedoeld in
      [artikel 99, eerste lid, sub ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002145#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0002058#Artikel99
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002145
        artikel: '32'
      - id: ref2
        bwb_id: BWBR0002058
        artikel: '99'
  - number: '36'
    text: |-
      De opbrengsten van de geldboeten komen aan het betrokken lichaam. Het bestuur van het lichaam geeft aan de
      opbrengsten een bijzondere bestemming. Het besluit van het bestuur behoeft de goedkeuring van de Sociaal-
      Economische Raad.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel36
  - number: '38'
    text: Deze wet kan worden aangehaald als Wet tuchtrechtspraak bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel38
  - number: '39'
    text: Deze wet treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002145/2002-01-01#Artikel39
