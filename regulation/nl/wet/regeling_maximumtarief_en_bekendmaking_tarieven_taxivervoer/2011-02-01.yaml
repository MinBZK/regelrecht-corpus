$id: regeling_maximumtarief_en_bekendmaking_tarieven_taxivervoer
regulatory_layer: WET
publication_date: '2025-12-03'
valid_from: '2011-02-01'
bwb_id: BWBR0010998
url: https://wetten.overheid.nl/BWBR0010998/2011-02-01
preamble:
  text: |-
    Gelet op de artikelen 58, eerste lid, van de Wet personenvervoer, en 156 van het Besluit personenvervoer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'De vervoerder biedt taxivervoer aan tegen een variabel tarief per rit dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: 1.1.a
    text: een vast bedrag, en
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: 1.1.b
    text: |-
      een bedrag per kilometer dat in rekening wordt gebracht voor de derde en volgende kilometers na de aanvang van
      de rit.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: '1.2'
    text: Het tarief, bedoeld in het eerste lid, heeft uitsluitend betrekking op het gebruik van de gehele auto.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: '1.3'
    text: |-
      Onverminderd het eerste lid kan de vervoerder taxivervoer aanbieden tegen een vast tarief per rit, al dan niet per
      zitplaats, dat voorafgaand aan de rit aan de consument wordt kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: '1.4'
    text: |-
      Het is verboden om voor het enkele vervoer een ander tarief in rekening te brengen dan een tarief als bedoeld in
      het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: '1.5'
    text: |-
      De vervoerder kan een tarief in rekening brengen voor de wachtperiode bij aanvang van de rit, mits dit vooraf met
      de consument is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: '1.6'
    text: |-
      De vervoerder kan een tarief in rekening brengen voor aanvullende diensten, mits dit vooraf met de consument is
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1
  - number: 1a.1
    text: |-
      Het tarief, bedoeld in [artikel 1, eerste lid][ref1], bedraagt ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1a.1.a
    text: € 7,86 voor het vaste bedrag;
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1a
  - number: 1a.1.b
    text: € 2,30 voor het bedrag per kilometer.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1a
  - number: 1a.2
    text: |-
      Indien het vervoer plaatsvindt in een motorrijtuig, ingericht voor het vervoer van vijf tot en met acht personen,
      de bestuurder daaronder niet begrepen, of, ingericht voor het vervoer van een of meerdere personen, zittend in een
      rolstoel, bedraagt het tarief, bedoeld in [artikel 1, eerste lid][ref1], ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1a.2.a
    text: € 12,78 voor het vaste bedrag;
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1a
  - number: 1a.2.b
    text: € 2,64 voor het bedrag per kilometer.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1a
  - number: 1a.3
    text: |-
      Het tarief, bedoeld in [artikel 1, vijfde lid][ref1], bedraagt ten hoogste € 34,59 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: '2.1'
    text: |-
      Het tarief, bedoeld in [artikel 1, eerste of vijfde lid][ref1], wordt voor de consument duidelijk leesbaar getoond
      zowel in de auto waarmee taxivervoer wordt verricht als aan de buitenzijde. Aan dit vereiste wordt in ieder
      geval voldaan indien het tarief wordt getoond met gebruikmaking van een taxi-informatiekaart waarvan het model
      overeenkomt met het in de bijlage bij deze regeling opgenomen model A.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: '2.2'
    text: |-
      Ten behoeve van het duidelijk kenbaar maken van de klachtenbehandeling, bedoeld in
      [artikel 72a van het Besluit personenvervoer 2000][ref1] wordt voor de consument leesbaar getoond zowel in de auto
      waarmee taxivervoer wordt verricht als aan de buitenzijde:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel72a
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: 72a
  - number: 2.2.a
    text: |-
      de naam en de vestigingsplaats van de vervoerder zoals deze zijn vermeld op de vergunning, bedoeld in
      [artikel 4, tweede lid, van de Wet personenvervoer 2000][ref1] dan wel de naam en het telefoonnummer van de
      instantie waarmee de vervoerder is overeengekomen dat klachten over taxivervoer door deze instantie in behandeling
      worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
  - number: 2.2.b
    text: |-
      het personenvervoernummer dat staat aangeven op de vergunning, bedoeld in
      [artikel 4, tweede lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel4
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '4'
  - number: 2.2.c
    text: 'het telefoonnummer van het Landelijk Klachtenmeldpunt Taxivervoer, te weten: 0900-202 1881, en'
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
  - number: 2.2.d
    text: 'het internetadres van het Landelijk Klachtenmeldpunt Taxivervoer, te weten: www.taxiklacht.nl.'
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
  - number: '2.3'
    text: |-
      Aan het eerste lid en tweede lid wordt eveneens voldaan indien naar het oordeel van de Minister van Verkeer en
      Waterstaat het tarief duidelijk leesbaar onderscheidenlijk de gegevens over de klachtenbehandeling duidelijk
      kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste lid is niet van toepassing, indien schriftelijk een tarief wordt overeengekomen
      voor het gedurende een bepaalde periode meermalen verrichten van taxivervoer als bedoeld in
      [artikel 84, tweede lid, van de Wet personenvervoer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel84
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '84'
  - number: 2a
    text: |-
      Overtreding van [artikel 1][ref1] of [2][ref2] vormt een strafbaar feit als bedoeld in
      [artikel 1, onder 4°, van de Wet op de economische delicten][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010998
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '3'
    text: Deze regeling treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling maximumtarief en bekendmaking tarieven taxivervoer.'
    url: https://wetten.overheid.nl/BWBR0010998/2011-02-01#Artikel4
