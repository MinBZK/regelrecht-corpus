$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_maximumtarief_en_bekendmaking_tarieven_taxivervoer
regulatory_layer: WET
publication_date: '2025-12-03'
valid_from: '2013-02-01'
bwb_id: BWBR0010998
url: https://wetten.overheid.nl/BWBR0010998/2013-02-01
preamble:
  text: |-
    Gelet op de artikelen 58, eerste lid, van de Wet personenvervoer, en 156 van het Besluit personenvervoer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'De vervoerder biedt taxivervoer aan tegen een variabel tarief per rit dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: 1.1.a
    text: een vast bedrag, en
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: 1.1.b
    text: |-
      een bedrag per kilometer dat in rekening wordt gebracht voor de derde en volgende kilometers na de aanvang van
      de rit.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: '1.2'
    text: Het tarief, bedoeld in het eerste lid, heeft uitsluitend betrekking op het gebruik van de gehele auto.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: '1.3'
    text: |-
      Onverminderd het eerste lid kan de vervoerder taxivervoer aanbieden tegen een vast tarief per rit, al dan niet per
      zitplaats, dat voorafgaand aan de rit aan de consument wordt kenbaar gemaakt.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: '1.4'
    text: |-
      Het is verboden om voor het enkele vervoer een ander tarief in rekening te brengen dan een tarief als bedoeld in
      het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: '1.5'
    text: |-
      De vervoerder kan een tarief in rekening brengen voor de wachtperiode bij aanvang van de rit, mits dit vooraf met
      de consument is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: '1.6'
    text: |-
      De vervoerder kan een tarief in rekening brengen voor aanvullende diensten, mits dit vooraf met de consument is
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1
  - number: 1a.1
    text: |-
      Het tarief, bedoeld in [artikel 1, eerste lid][ref1], bedraagt ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1a.1.a
    text: € 8,32 voor het vaste bedrag;
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1a
  - number: 1a.1.b
    text: € 2,43 voor het bedrag per kilometer.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1a
  - number: 1a.2
    text: |-
      Indien het vervoer plaatsvindt in een auto, ingericht voor het vervoer van vijf tot en met acht personen en
      waarin ook feitelijk tenminste vijf personen aanwezig zijn, de bestuurder daaronder niet begrepen, of, ingericht
      voor het vervoer van een of meerdere personen, zittend in een rolstoel, bedraagt het tarief, bedoeld in
      [artikel 1, eerste lid][ref1], ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1a.2.a
    text: € 13,52 voor het vaste bedrag;
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1a
  - number: 1a.2.b
    text: € 2,79 voor het bedrag per kilometer.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1a
  - number: 1a.3
    text: |-
      Het tarief, bedoeld in [artikel 1, vijfde lid][ref1], bedraagt ten hoogste € 38,98 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1b
    text: |-
      In afwijking van [artikel 1, eerste lid][ref1], en [artikel 1a, eerste en tweede lid][ref2], en onverminderd het
      bepaalde in artikel 1, tweede tot en met het zesde lid, bestaat het in die bepalingen bedoelde maximumtarief voor
      taxivoer met ingang van de dag van inwerkingtreding van dit artikel uit de optelsom van:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel1a
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010998
        artikel: 1a
  - number: 1b.a
    text: |-
      een vast bedrag van ten hoogste € 2,83 dan wel, indien dat vervoer plaatsvindt in een auto dat voldoet aan
      [artikel 1a, tweede lid][ref1], ten hoogste € 5,75;


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1a
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: 1a
  - number: 1b.b
    text: |-
      een bedrag van ten hoogste € 2,08 per kilometer van de taxirit dan wel, indien dat vervoer plaatsvindt in een auto
      dat voldoet aan [artikel 1a, tweede lid][ref1], ten hoogste € 2,62 en


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1a
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: 1a
  - number: 1b.c
    text: |-
      een bedrag van ten hoogste € 0,34 per minuut van de duur van de taxirit dan wel, indien dat vervoer plaatsvindt in
      een auto dat voldoet aan [artikel 1a, tweede lid][ref1], ten hoogste € 0,39.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1a
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: 1a
  - number: 1c.1
    text: |-
      De vervoerder verstrekt bij toepassing van [artikel 1b][ref1] de reiziger na afloop van het verrichte taxivervoer
      een automatisch gegenereerd ritbewijs waarop tenminste de volgende gegevens staan vermeld:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1b
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: 1b
  - number: 1c.1.a
    text: |-
      informatie over de door de vervoerder toegepaste tarieven, gebaseerd op de in
      [artikel 1, vijfde en zesde lid][ref1], en [artikel  1b][ref2] bedoelde bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel1b
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010998
        artikel: 1b
  - number: 1c.1.b
    text: de gereden afstand uitgedrukt in kilometers tot tenminste één cijfer achter de komma nauwkeurig;
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
  - number: 1c.1.c
    text: |-
      het begintijdstip en het eindtijdstip van de rit uitgedrukt in uren en minuten, alsmede de datum van het
      begintijdstip van de rit;
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
  - number: 1c.1.d
    text: de totaalprijs op basis van de onderdeel a bedoelde tarieven;
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
  - number: 1c.1.e
    text: |-
      het personenvervoernummer dat staat aangegeven op de vergunning, bedoeld in
      [artikel 76, eerste lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 1c.1.f
    text: het kenteken van de auto waarmee het taxivervoer is verricht;
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
  - number: 1c.1.g
    text: |-
      de naam, het adres en telefoonnummer van de vervoerder en, indien deze gegevens afwijken van de instantie die de
      klachten over het taxivervoer in behandeling neemt, het adres, de naam, en telefoonnummer van de instantie waarmee
      de vervoerder is overeengekomen dat klachten over taxivervoer door deze instantie in behandeling worden genomen;
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
  - number: 1c.1.h
    text: de naam van het landelijk klachtenmeldpunt met vermelding van het corresponderende telefoonnummer en internetadres.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
  - number: 1c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien sprake is van een vast tarief als bedoeld in
      [artikel 1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1c.3
    text: |-
      De in het eerste en tweede lid bedoelde weergave van de aldaar genoemde informatie dient duidelijk kenbaar en
      in overeenstemming met de werkelijkheid te zijn en, voor zover van toepassing, een nauwgezette en rechtstreekse
      weergave te zijn van de relevante gegevens die de basis zijn voor de werking van de in [artikel 127][ref1] dan
      wel [artikel 78 van het Besluit personenvervoer 2000][ref2] bedoelde taxameter dan wel voor de werking van de in
      [artikel 79 van dat besluit][ref3] bedoelde boordcomputer.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0011982#Artikel79
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0011982
        artikel: '79'
  - number: 1c.4
    text: |-
      Het eerste lid is niet van toepassing, indien sprake is van in
      [artikel 81, tweede lid, van de Wet personenvervoer 2000][ref1] bedoeld vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel81
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '81'
  - number: 1c.5
    text: |-
      Indien door de taxivervoerder en de consument toepassing wordt gegeven aan [artikel 1, vijfde of zesde lid][ref1],
      dan wel sprake is van taxivervoer met meerdere personen met meerdere opstapadressen dan wel meerdere bestemmingen,
      wordt het daarmee verbandhoudende tarief met de daarmee verbandhoudende eindprijs voor de betrokken consument ofwel
      vermeld op het in het eerste lid bedoelde totale ritbewijs ofwel op een afzonderlijk ritbewijs. Het laatstbedoelde
      ritbewijs mag tevens handgeschreven zijn mits duidelijk leesbaar en kenbaar, en mag voor de in dit lid bedoelde
      onderwerpen deel uitmaken van het in het eerste lid bedoelde ritbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1d
    text: |-
      In afwijking van de [artikelen 1b][ref1] en [1c][ref2] kan de vervoerder tot en met 31 maart 2012 de in
      [artikel 1a][ref3] bedoelde tarieven toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1b
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel1c
      [ref3]: https://wetten.overheid.nl/BWBR0010998#Artikel1a
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel1d
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: 1b
      - id: ref2
        bwb_id: BWBR0010998
        artikel: 1c
      - id: ref3
        bwb_id: BWBR0010998
        artikel: 1a
  - number: '2.1'
    text: |-
      Het tarief, bedoeld in [artikel 1, eerste of vijfde lid][ref1], dan wel [artikel 1b][ref2], wordt voor de
      consument duidelijk leesbaar getoond zowel in de auto waarmee taxivervoer wordt verricht als aan de buitenzijde.
      Aan dit vereiste wordt in ieder geval voldaan indien het tarief wordt getoond met gebruikmaking van een taxi-
      informatiekaart waarvan het model overeenkomt met het in de bijlage bij deze regeling opgenomen model A dan wel
      model A1.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel1b
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010998
        artikel: 1b
  - number: '2.2'
    text: |-
      Ten behoeve van het duidelijk kenbaar maken van de klachtenbehandeling, bedoeld in
      [artikel 72a van het Besluit personenvervoer 2000][ref1] wordt voor de consument leesbaar getoond zowel in de auto
      waarmee taxivervoer wordt verricht als aan de buitenzijde:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel72a
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: 72a
  - number: 2.2.a
    text: |-
      de naam en de vestigingsplaats van de vervoerder zoals deze zijn vermeld op de vergunning, bedoeld in
      [artikel 76, eerste lid, van de Wet personenvervoer 2000][ref1] dan wel de naam en het telefoonnummer van de
      instantie waarmee de vervoerder is overeengekomen dat klachten over taxivervoer door deze instantie in behandeling
      worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 2.2.b
    text: |-
      het personenvervoernummer dat staat aangeven op de vergunning, bedoeld in
      [artikel 76, eerste lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 2.2.c
    text: 'het telefoonnummer van het Landelijk Klachtenmeldpunt Taxivervoer, te weten: 0900-202 1881, en'
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
  - number: 2.2.d
    text: 'het internetadres van het Landelijk Klachtenmeldpunt Taxivervoer, te weten: www.taxiklacht.nl.'
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
  - number: '2.3'
    text: |-
      Aan het eerste lid en tweede lid wordt eveneens voldaan indien naar het oordeel van de Minister van Verkeer en
      Waterstaat het tarief duidelijk leesbaar onderscheidenlijk de gegevens over de klachtenbehandeling duidelijk
      kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
  - number: '2.4'
    text: |-
      Het eerste lid is niet van toepassing, indien schriftelijk een tarief wordt overeengekomen
      voor het gedurende een bepaalde periode meermalen verrichten van taxivervoer als bedoeld in
      [artikel 81, tweede lid, van de Wet personenvervoer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel81
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '81'
  - number: 2a
    text: |-
      Overtreding van de [artikelen 1][ref1], [1a][ref2], [1b][ref3], [1c][ref4] en [2][ref5] vormen een strafbaar feit
      als bedoeld in [artikel 1, onder 4°, van de Wet op de economische delicten][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0010998#Artikel1b
      [ref4]: https://wetten.overheid.nl/BWBR0010998#Artikel1c
      [ref5]: https://wetten.overheid.nl/BWBR0010998#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2013-02-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
