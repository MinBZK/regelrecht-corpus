---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_maximumtarief_en_bekendmaking_tarieven_taxivervoer
regulatory_layer: WET
publication_date: '2025-12-03'
valid_from: '2026-01-01'
bwb_id: BWBR0010998
url: https://wetten.overheid.nl/BWBR0010998/2026-01-01
preamble:
  text: |-
    Gelet op de artikelen 58, eerste lid, van de Wet personenvervoer, en 156 van het Besluit personenvervoer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'De vervoerder biedt taxivervoer aan tegen een variabel tarief per rit dat bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: 1.1.a
    text: een vast bedrag;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: 1.1.b
    text: een bedrag per afgelegde kilometer van de taxirit, en
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: 1.1.c
    text: een bedrag per minuut van de duur van de taxirit.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: '1.2'
    text: Het tarief, bedoeld in het eerste lid, heeft uitsluitend betrekking op het gebruik van de gehele auto.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: '1.3'
    text: |-
      Onverminderd het eerste lid kan de vervoerder taxivervoer aanbieden tegen een vast tarief per rit, al dan niet per
      zitplaats, mits dit vooraf met de consument is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: '1.4'
    text: |-
      Het is verboden om voor het enkele vervoer een ander tarief in rekening te brengen dan een tarief als bedoeld in
      het eerste of derde lid.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: '1.5'
    text: |-
      De vervoerder kan een tarief in rekening brengen voor de wachtperiode bij aanvang van de rit, mits dit vooraf met
      de consument is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: '1.6'
    text: |-
      De vervoerder kan een tarief in rekening brengen voor aanvullende diensten, mits dit vooraf met de consument is
      overeengekomen.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1
  - number: 1a.1
    text: |-
      Het tarief, bedoeld in [artikel 1, eerste lid][ref1], bedraagt ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1a.1.a
    text: € 4,31 voor het vaste bedrag;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
  - number: 1a.1.b
    text: € 3,17 voor het bedrag per kilometer;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
  - number: 1a.1.c
    text: € 0,52 voor het bedrag per minuut.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
  - number: 1a.2
    text: |-
      Indien het vervoer plaatsvindt in een auto, ingericht voor het vervoer van vijf tot en met acht personen en
      waarin ook feitelijk tenminste vijf personen aanwezig zijn, de bestuurder daaronder niet begrepen, of, ingericht
      voor het vervoer van een of meerdere personen, zittend in een rolstoel, bedraagt het tarief, bedoeld in
      [artikel 1, eerste lid][ref1], ten hoogste:


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1a.2.a
    text: € 8,77 voor het vaste bedrag;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
  - number: 1a.2.b
    text: € 4,00 voor het bedrag per kilometer;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
  - number: 1a.2.c
    text: € 0,59 voor het bedrag per minuut.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
  - number: 1a.3
    text: |-
      Het tarief, bedoeld in [artikel 1, vijfde lid][ref1], bedraagt ten hoogste € 59,41 per uur.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1c.1
    text: |-
      De vervoerder biedt de consument na afloop van het verrichte taxivervoer een automatisch gegenereerd schriftelijk
      ritbewijs aan, waarop tenminste de volgende gegevens staan vermeld:
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
  - number: 1c.1.a
    text: |-
      informatie over de door de vervoerder toegepaste tarieven, gebaseerd op de in
      [artikel 1, eerste, vijfde en zesde lid][ref1], bedoelde bedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1c.1.b
    text: de gereden afstand uitgedrukt in kilometers tot tenminste één cijfer achter de komma nauwkeurig;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
  - number: 1c.1.c
    text: |-
      het begintijdstip en het eindtijdstip van de rit uitgedrukt in uren en minuten, alsmede de datum van het
      begintijdstip van de rit;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
  - number: 1c.1.d
    text: de totaalprijs op basis van de in onderdeel a bedoelde tarieven;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
  - number: 1c.1.e
    text: |-
      het personenvervoernummer dat staat aangegeven op de vergunning, bedoeld in
      [artikel 76, eerste lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 1c.1.f
    text: het kenteken van de auto waarmee het taxivervoer is verricht;
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
  - number: 1c.1.g
    text: |-
      de naam, het adres en telefoonnummer van de vervoerder en, indien deze gegevens afwijken van de instantie die de
      klachten over het taxivervoer in behandeling neemt, het adres, de naam, en telefoonnummer van de instantie waarmee
      de vervoerder is overeengekomen dat klachten over taxivervoer door deze instantie in behandeling worden genomen.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
  - number: 1c.2
    text: |-
      Met uitzondering van het taxivervoer dat op de openbare weg wordt aangeboden, kan het ritbewijs, bedoeld in
      het eerste lid, in plaats van schriftelijk, langs elektronische weg duidelijk kenbaar aan de consument worden
      aangeboden.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
  - number: 1c.3
    text: |-
      Het eerste lid is van overeenkomstige toepassing indien sprake is van een vast tarief als bedoeld in
      [artikel 1, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 1c.4
    text: |-
      De in het eerste en tweede lid bedoelde weergave van de aldaar genoemde informatie dient duidelijk kenbaar en
      in overeenstemming met de werkelijkheid te zijn en, voor zover van toepassing, een nauwgezette en rechtstreekse
      weergave te zijn van de relevante gegevens die de basis zijn voor de werking van de in [artikel 127][ref1] dan
      wel [artikel 78 van het Besluit personenvervoer 2000][ref2] bedoelde taxameter dan wel voor de werking van de in
      [artikel 79 van dat besluit][ref3] bedoelde boordcomputer.


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0011982#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0011982#Artikel79
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '127'
      - id: ref2
        bwb_id: BWBR0011982
        artikel: '78'
      - id: ref3
        bwb_id: BWBR0011982
        artikel: '79'
  - number: 1c.5
    text: |-
      Het eerste lid is niet van toepassing, indien sprake is van in
      [artikel 81, tweede lid, van de Wet personenvervoer 2000][ref1] bedoeld vervoer.


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel81
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '81'
  - number: 1c.6
    text: |-
      Indien door de taxivervoerder en de consument toepassing wordt gegeven aan [artikel 1, vijfde of zesde lid][ref1],
      dan wel sprake is van taxivervoer met meerdere personen met meerdere opstapadressen dan wel meerdere bestemmingen,
      wordt het daarmee verbandhoudende tarief met de daarmee verbandhoudende eindprijs voor de betrokken consument ofwel
      vermeld op het in het eerste lid bedoelde totale ritbewijs ofwel op een afzonderlijk ritbewijs. Het laatstbedoelde
      ritbewijs mag tevens handgeschreven zijn mits duidelijk leesbaar en kenbaar, en mag voor de in dit lid bedoelde
      onderwerpen deel uitmaken van het in het eerste lid bedoelde ritbewijs.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel1c
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: '2.1'
    text: |-
      Het tarief, bedoeld in [artikel 1, eerste of vijfde lid][ref1], wordt voor de consument duidelijk leesbaar getoond
      zowel in de auto waarmee taxivervoer wordt verricht als aan de buitenzijde.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: '2.2'
    text: |-
      Ten behoeve van het duidelijk kenbaar maken van de klachtenbehandeling, bedoeld in
      [artikel 72a van het Besluit personenvervoer 2000][ref1] wordt voor de consument leesbaar getoond zowel in de auto
      waarmee taxivervoer wordt verricht als aan de buitenzijde:


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel72a
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: 72a
  - number: 2.2.a
    text: |-
      de naam en de vestigingsplaats van de vervoerder zoals deze zijn vermeld op de vergunning, bedoeld in
      [artikel 76, eerste lid, van de Wet personenvervoer 2000][ref1] dan wel de naam en het telefoonnummer van de
      instantie waarmee de vervoerder is overeengekomen dat klachten over taxivervoer door deze instantie in behandeling
      worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 2.2.b
    text: |-
      het personenvervoernummer dat staat aangeven op de vergunning, bedoeld in
      [artikel 76, eerste lid, van de Wet personenvervoer 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel76
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '76'
  - number: 2.2.c
    text: |-
      de naam, het adres en telefoonnummer van de vervoerder en, indien deze gegevens afwijken van de instantie die de
      klachten over het taxivervoer in behandeling neemt, het adres, de naam, en telefoonnummer van de instantie waarmee
      de vervoerder is overeengekomen dat klachten over taxivervoer door deze instantie in behandeling worden genomen.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
  - number: '2.3'
    text: |-
      Met uitzondering van het taxivervoer dat op de openbare weg wordt aangeboden, kunnen het tarief, bedoeld in
      [artikel 1, eerste en vijfde lid][ref1], en de gegevens ten behoeve van de klachtenbehandeling, bedoeld in het
      tweede lid, in plaats van duidelijk leesbaar getoond aan de binnen- en buitenzijde van de auto, langs elektronische
      weg duidelijk kenbaar aan de consument worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
  - number: '2.4'
    text: |-
      Aan het eerste tot en met derde lid wordt eveneens voldaan indien naar het oordeel van de Minister van
      Infrastructuur en Milieu het tarief duidelijk leesbaar onderscheidenlijk de gegevens over de klachtenbehandeling
      duidelijk kenbaar zijn.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
  - number: '2.5'
    text: |-
      Het eerste lid is niet van toepassing, indien schriftelijk een tarief wordt overeengekomen
      voor het gedurende een bepaalde periode meermalen verrichten van taxivervoer als bedoeld in
      [artikel 81, tweede lid, van de Wet personenvervoer 2000][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011470#Artikel81
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0011470
        artikel: '81'
  - number: 2a
    text: |-
      Overtreding van de [artikelen 1][ref1], [1a][ref2], [1c][ref3] en [2][ref4] vormen een strafbaar feit als bedoeld
      in [artikel 1, onder 4°, van de Wet op de economische delicten][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0010998#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0010998#Artikel1c
      [ref4]: https://wetten.overheid.nl/BWBR0010998#Artikel2
      [ref5]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0010998
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0010998
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0010998
        artikel: 1c
      - id: ref4
        bwb_id: BWBR0010998
        artikel: '2'
      - id: ref5
        bwb_id: BWBR0002063
        artikel: '1'
  - number: 2aa.1
    text: |-
      De in [artikel 78, zesde lid, van het Besluit personenvervoer 2000][ref1] bedoelde nader te bepalen gevallen
      betreffende het niet van toepassing zijn van de eis betreffende de zichtbare aanwezigheid van een taxameter zijn
      de gevallen waarin het voertuig aantoonbaar uitsluitend wordt gebruikt voor taxivervoer tegen een voorafgaand aan
      de taxirit op kenbare en transparante wijze met de consument overeengekomen vast tarief per rit als bedoeld in
      [artikel 1, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0011982#Artikel78
      [ref2]: https://wetten.overheid.nl/BWBR0010998#Artikel1
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2aa
    references:
      - id: ref1
        bwb_id: BWBR0011982
        artikel: '78'
      - id: ref2
        bwb_id: BWBR0010998
        artikel: '1'
  - number: 2aa.2
    text: Het eerste lid is niet van toepassing indien het taxivervoer wordt aangeboden op de openbare weg.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel2aa
  - number: '3'
    text: Deze regeling treedt in werking met ingang van 1 januari 2000.
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel3
  - number: '4'
    text: 'Deze regeling wordt aangehaald als: Regeling maximumtarief en bekendmaking tarieven taxivervoer.'
    url: https://wetten.overheid.nl/BWBR0010998/2026-01-01#Artikel4
