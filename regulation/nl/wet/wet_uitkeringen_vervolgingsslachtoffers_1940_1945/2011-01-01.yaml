$id: wet_uitkeringen_vervolgingsslachtoffers_1940_1945
regulatory_layer: WET
publication_date: '2018-10-23'
valid_from: '2011-01-01'
bwb_id: BWBR0002844
url: https://wetten.overheid.nl/BWBR0002844/2011-01-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regelen te stellen betreffende de verlening van
    uitkeringen aan de slachtoffers van vervolging tijdens de oorlogsjaren 1940-1945;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1
  - number: 1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1
  - number: 1.b
    text: |-
      de Raad: de Pensioen- en Uitkeringsraad, bedoeld in
      [artikel 3 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel3
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '3'
  - number: 1.c
    text: |-
      de Sociale verzekeringsbank: de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 1a.1
    text: 'Voor de toepassing van deze wet wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.1.a
    text: 'huwelijk: het geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.1.b
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.1.c
    text: 'echtgenoot of echtpaar: de geregistreerde partner of het geregistreerde paar;'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.1.d
    text: 'weduwe of weduwnaar: de achtergebleven partij bij het geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.2
    text: 'In deze wet en de daarop rustende bepalingen:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.2.a
    text: |-
      worden als gehuwd of als echtgenoot aangemerkt, ongehuwde personen van verschillend of gelijk geslacht, die
      duurzaam een gezamenlijke huishouding voeren, tenzij het betreft personen tussen wie bloedverwantschap in de eerste
      of tweede graad bestaat;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.2.b
    text: wordt als ongehuwd mede aangemerkt degenen die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1a.3
    text: |-
      Van een gezamenlijke huishouding als bedoeld in het tweede lid kan slechts sprake zijn indien twee personen
      gezamenlijk voorzien in huisvesting en bovendien beiden een bijdrage leveren in de kosten van de huishouding dan
      wel op andere wijze in elkaars verzorging voorzien. Onze Minister kan nadere regels stellen voor de toepassing van
      de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1a
  - number: 1b
    text: |-
      Waar in deze wet in een artikel of artikellid sprake is van «de Raad of de Sociale
      verzekeringsbank» is de taakverdeling in overeenstemming met de [artikelen 4][ref1] en
      [6 van de Wet uitvoering wetten voor verzetsdeelnemers en oorlogsgetroffenen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0027660#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0027660#Artikel6
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel1b
    references:
      - id: ref1
        bwb_id: BWBR0027660
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0027660
        artikel: '6'
  - number: '2.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder vervolging verstaan iedere handeling of
      maatregel, welke tijdens de oorlogsjaren 1940-1945 door of namens de Nederland of het voormalige Nederlands-Indië
      vijandelijke bezettende machten werd gericht tegen personen of groepen van personen op grond van hun ras, geloof,
      wereldbeschouwing of homosexualiteit en welke heeft geleid tot:
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: 2.1.a
    text: |-
      vrijheidsberoving door opsluiting in concentratiekampen, gevangenissen of andere verblijfplaatsen, waar beëindiging
      van het leven dan wel permanente bewaking van de vervolgde werd beoogd, met inbegrip van het transport naar en
      tussen dergelijke verblijfplaatsen;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: 2.1.b
    text: ondergaan van sterilisatie om aan vrijheidsberoving te ontkomen;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: 2.1.c
    text: onderduiken om aan vrijheidsberoving te ontkomen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: '2.2'
    text: 'Onder vervolging worden tevens verstaan handelingen of maatregelen:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: 2.2.a
    text: |-
      van de vijandelijke bezettende macht van het voormalige Nederlands-Indië, welke werden gericht tegen personen of
      groepen van personen op grond van hun Europese afkomst of Europees georiënteerde of gezinde instelling en welke
      hebben geleid tot omstandigheden als omschreven in het eerste lid, onder *a*;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: 2.2.b
    text: |-
      van de vijandelijke bezettende macht van Nederland, welke werden gericht tegen personen, die zich aan verplichte
      tewerkstelling hebben onttrokken en welke hebben geleid tot omstandigheden als omschreven in het eerste lid, onder
      a.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: '2.3'
    text: |-
      Handelingen of maatregelen van de vijandelijke bezettende macht van Nederland, welke werden gericht tegen personen
      wegens het zich onttrekken aan krijgsgevangenschap, worden niet onder vervolging begrepen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel2
  - number: '3.1'
    text: 'Onder vervolgde wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.a
    text: |-
      de Nederlander, die tijdens de oorlogsjaren 1940-1945 Nederlander zijnde dan wel Nederlands onderdaan in de zin van
      de toenmalige Wet van 10 februari 1910 (*Stb.* 55), vervolging onderging;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.b.1
    text: |-
      de Nederlander, die tijdens de oorlogsjaren 1940-1945 vreemdeling zijnde, vervolging onderging, indien hij sedert 9
      mei 1940 tot aan het tijdstip van zijn naturalisatie onafgebroken in Nederland gevestigd is geweest;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.b.2
    text: |-
      de Nederlander, die tijdens de oorlogsjaren 1940-1945 vreemdeling zijnde, vervolging onderging, indien hij sedert 7
      december 1941 tot het tijdstip van zijn naturalisatie onafgebroken in het voormalige Nederlands-Indië, in Indonesië
      of in het voormalige Nederlands Nieuw-Guinea gevestigd is geweest, dan wel sedert 7 december 1941 onafgebroken
      in het voormalige Nederlands-Indië, in Indonesië of in het voormalige Nederlands Nieuw-Guinea was gevestigd en
      aansluitend daaraan vóór 1 april 1964 in Nederland is gekomen of vóór genoemde datum een verzoek om toestemming tot
      vestiging in Nederland heeft ingediend, waarop gunstig is beslist, en sedert zijn aankomst tot aan het tijdstip van
      zijn naturalisatie onafgebroken hier te lande gevestigd is geweest.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.b.3
    text: |-
      de Nederlander, die tijdens de oorlogsjaren 1940-1945 vreemdeling zijnde, vervolging onderging, indien hij
      zich niet later dan 15 augustus 1955 in Nederland heeft gevestigd en tot de datum van de aanvraag, bedoeld in
      [artikel 30][ref1], dan wel tot zijn overlijden onafgebroken in Nederland gevestigd is geweest;


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel30
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '30'
        hoofdstuk: IV
  - number: 3.1.c
    text: |-
      de vreemdeling, die tijdens de oorlogsjaren 1940-1945 vervolging onderging, indien hij sedert 9 mei 1940
      onafgebroken in Nederland is gevestigd, dan wel tot zijn overlijden is geweest;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.d.1
    text: |-
      de vreemdeling, die tijdens de oorlogsjaren 1940-1945 vervolging onderging, indien hij sedert 7 december 1941
      tot zijn overlijden, mits dit plaats vond vóór 1 april 1964, onafgebroken in het voormalig Nederlands-Indië, in
      Indonesië of in het voormalig Nederlands Nieuw-Guinea, was gevestigd;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.d.2
    text: |-
      de vreemdeling, die tijdens de oorlogsjaren 1940-1945 vervolging onderging, indien hij sedert 7 december 1941
      onafgebroken in het voormalig Nederlands-Indië, in Indonesië of in het voormalig Nederlands Nieuw-Guinea, was
      gevestigd en aansluitend daaraan vóór 1 april 1964 in Nederland is gekomen of vóór genoemde datum een verzoek
      om toestemming tot vestiging in Nederland heeft ingediend, waarop gunstig is beslist, en sedert zijn aankomst
      onafgebroken hier te lande gevestigd is, dan wel tot zijn overlijden is geweest;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.e
    text: de vreemdeling, die tijdens de oorlogsjaren 1940-1945 Nederlander zijnde vervolging onderging;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: 3.1.f
    text: |-
      de vreemdeling, die tijdens de oorlogsjaren 1940-1945 Nederlands onderdaan zijnde in de zin van de Wet van 10
      februari 1910 (*Stb.* 55) vervolging onderging en nadien het Nederlanderschap heeft bezeten.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: '3.2'
    text: |-
      De Raad kan de persoon die vervolging heeft ondergaan, maar niet voldoet aan de vereisten, bedoeld in het eerste
      lid, dan wel de persoon die voldoet aan de vereisten, bedoeld in het eerste lid, en tijdens de oorlogsjaren 1940-
      1945 in omstandigheden verkeerde welke overeenkomst vertonen met vervolging, met de vervolgde gelijkstellen indien
      het niet toepassen van deze wet ten aanzien van deze persoon een klaarblijkelijke hardheid zou zijn.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel3
  - number: '4.1'
    text: 'Behoudens in nader bij algemene maatregel van bestuur te regelen gevallen is deze wet niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel4
  - number: 4.1.a
    text: |-
      de vervolgde en diens nabestaanden, die op grond van de vervolgingsomstandigheden aanspraken ontlenen aan de
      voor militairen geldende voorzieningen, tenzij de vervolgde heeft behoord tot het personeel van het voormalige
      Koninklijk Nederlandsch-Indisch Leger;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel4
  - number: 4.1.b
    text: |-
      de vervolgde en diens nabestaanden, die aanspraken ontlenen aan de [Wet buitengewoon pensioen 1940-1945][ref1],
      de [Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref2] of de
      [Wet buitengewoon pensioen Indisch verzet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002032
      [ref2]: https://wetten.overheid.nl/BWBR0002035
      [ref3]: https://wetten.overheid.nl/BWBR0003968
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002032
      - id: ref2
        bwb_id: BWBR0002035
      - id: ref3
        bwb_id: BWBR0003968
  - number: 4.1.c
    text: |-
      de vervolgde in de zin van [artikel 3, eerste lid, onder ][ref1], en diens nabestaanden, die een andere dan de
      Nederlandse nationaliteit bezitten en zich metterwoon in het buitenland vestigen dan wel reeds buiten Nederland
      zijn of waren gevestigd, ook indien zij zich nadien in Nederland vestigen;


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel3
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '3'
        hoofdstuk: I
  - number: 4.1.d
    text: |-
      de nabestaande van de vervolgde in de zin van [artikel 3, eerste lid, onder ][ref1], die een andere dan de
      Nederlandse nationaliteit bezitten.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel3
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '3'
        hoofdstuk: I
  - number: '4.2'
    text: |-
      Bij de toepassing van het eerste lid, onder *c*, wordt een verblijf in het buitenland van langere duur dan een jaar
      in ieder geval aangemerkt als vestiging aldaar.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel4
  - number: '4.3'
    text: |-
      Tot de nabestaanden genoemd in het eerste lid onder *c*, dient niet te worden gerekend de nabestaande, die, als
      zodanig, vóór 1 april 1964 vanuit het voormalig Nederlands-Indië, Indonesië of het voormalig Nederlands Nieuw-
      Guinea in Nederland is gekomen dan wel vóór genoemde datum een verzoek om toestemming tot vestiging in Nederland
      heeft ingediend, waarop gunstig is beslist en sedert zijn aankomst onafgebroken hier te lande is gevestigd.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel4
  - number: '5.1'
    text: |-
      Voor een uitkering, een vergoeding en een tegemoetkoming, alsmede voor een verklaring als bedoeld in
      [artikel 22][ref1] komt niet in aanmerking de vervolgde die blijkens opgave van Onze Minister van Justitie:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel22
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: 5.1.a
    text: bij onherroepelijke uitspraak van een bijzondere strafrechter is veroordeeld;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
  - number: 5.1.b
    text: |-
      bij een uitspraak van een Tribunaal, waarop fiat executie is verleend, de al dan niet voorwaardelijke oplegging van
      een bijzondere maatregel onderging;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
  - number: 5.1.c
    text: |-
      bij een onherroepelijke beslissing van een orgaan van de bijzondere rechtspleging voorwaardelijk buiten vervolging
      is gesteld;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
  - number: 5.1.d
    text: |-
      bij een onherroepelijke uitspraak van een met zuivering belast orgaan of college is ontzet van het recht ambten of
      bepaalde ambten te bekleden, dan wel bepaalde beroepen of functies uit te oefenen of oneervol is ontslagen;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
  - number: 5.1.e
    text: zich door de vlucht aan vervolging door een orgaan van de bijzondere rechtspleging heeft onttrokken.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
  - number: '5.2'
    text: |-
      Voor een uitkering, een vergoeding en een tegemoetkoming, alsmede voor een verklaring als bedoeld in
      [artikel 22][ref1], komt niet in aanmerking de vervolgde die zich tijdens de vijandelijke bezetting uit Nederlands
      nationaal oogpunt beschouwd onwaardig heeft gedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel22
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: '5.3'
    text: |-
      Voor een uitkering komen evenmin in aanmerking de nabestaanden van de vervolgde, indien ten aanzien van hem
      uitspraken zijn gedaan of beslissingen zijn genomen als in het eerste lid bedoeld, dan wel indien hij zich heeft
      gedragen als in het tweede lid omschreven.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
  - number: '5.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de nabestaanden van de vervolgde, indien ten
      aanzien van hen uitspraken zijn gedaan of beslissingen zijn genomen als in het eerste lid bedoeld, dan wel indien
      zij zich hebben gedragen als in het tweede lid omschreven.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel5
  - number: '7.1'
    text: 'Recht op een uitkering heeft:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
  - number: 7.1.a
    text: |-
      de vervolgde, die wegens ziekten of gebreken, welke door of in verband met de vervolging zijn ontstaan of
      verergerd, buiten staat is door arbeid een inkomen te verwerven dat gelijk is aan de ingevolge [artikel 8][ref1]
      vastgestelde grondslag;


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 7.1.b
    text: |-
      de weduwe of weduwnaar, alsmede de minderjarige volle wees van de vervolgde van wie het overlijden redelijkerwijs
      aan de vervolging kan worden toegeschreven;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
  - number: 7.1.c
    text: |-
      de weduwe, de weduwnaar, alsmede de minderjarige volle wees van de vervolgde, indien de vervolgde door andere
      oorzaken dan de vervolging is overleden, mits deze ten tijde van het overlijden in het genot was van een uitkering,
      uit welken hoofde of onder welke benaming ook, verband houdende met de onder *a* of in het tweede lid bedoelde
      ziekten of gebreken.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
  - number: '7.2'
    text: |-
      Indien de ziekten of gebreken, bedoeld in het eerste lid, niet duidelijk door andere oorzaken dan de vervolging
      zijn ontstaan of verergerd, worden deze geacht hun oorzaken te hebben in de vervolging, dan wel in omstandigheden
      verband houdende met de vervolging. Daarbij wordt rekening gehouden met de inzichten en ervaringen van de
      medische wetenschap met betrekking tot de relatie tussen de vervolging en de geestelijke en lichamelijke
      gezondheidstoestand.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
  - number: '7.3'
    text: |-
      Onder verergering bedoeld in het eerste lid, onder *a* en het tweede lid wordt verstaan een verergering die in
      belangrijke mate heeft bijgedragen tot de ernst van de ziekten of gebreken op grond waarvan aanspraken aan deze wet
      kunnen worden ontleend.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
  - number: '7.4'
    text: |-
      De in het eerste lid bedoelde uitkering aan de weduwe of weduwnaar van de vervolgde die na de inwerkingtreding van
      deze wet is overleden, wordt ten hoogste gedurende een tijdvak van twee jaren na de datum van overlijden verleend,
      indien de weduwe of weduwnaar op dat tijdstip nog niet de 40-jarige leeftijd heeft bereikt, tenzij zij of hij
      arbeidsongeschikt is, of een of meer minderjarige kinderen te haren of te zijnen laste heeft.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
  - number: '7.5'
    text: |-
      Voor de toepassing van deze wet worden onder minderjarige kinderen dan wel minderjarige volle wezen verstaan
      onderscheidenlijk kinderen of volle wezen die de leeftijd van 21 jaar nog niet hebben bereikt en niet gehuwd zijn
      of gehuwd geweest zijn.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel7
  - number: '8.1'
    text: Indien aanspraak op een uitkering bestaat wordt de grondslag vastgesteld waarnaar die uitkering wordt berekend.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: '8.2'
    text: |-
      De grondslag wordt vastgesteld naar het inkomen uit arbeid in beroep of bedrijf dat de vervolgde, al naar voor hem
      het gunstigst is, ten tijde van de aanvraag bedoeld in [artikel 30][ref1] in Nederland zou hebben genoten:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel30
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '30'
        hoofdstuk: IV
  - number: 8.2.a
    text: uit het laatstelijk door hem uitgeoefende beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.2.b
    text: |-
      uit het laatstelijk voor het tot uiting komen van de ziekten of gebreken, of de verergering daarvan door hem
      uitgeoefende beroep of bedrijf;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.2.c
    text: uit het laatstelijk voor de vervolging door hem uitgeoefende beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.3.a
    text: |-
      Indien het in het tweede lid bedoelde beroep of bedrijf buiten Nederland werd uitgeoefend, wordt behoudens ten
      aanzien van de uitkeringsgerechtigde, bedoeld onder b, bij de vaststelling van de grondslag waarnaar de uitkering
      wordt berekend, rekening gehouden met het meest vergelijkbare beroep of bedrijf in Nederland, alsmede met
      (vak)opleiding, bekwaamheid en andere factoren, welke terzake van belang kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.3.b
    text: |-
      In afwijking van het bepaalde onder a wordt, indien de vervolging in het voormalige Nederlands-Indië heeft
      plaats gehad en de uitkeringsgerechtigde in Indonesië gevestigd is, de grondslag vastgesteld naar het inkomen in
      Indonesisch courant dat uit het aldaar uitgeoefende beroep of bedrijf zou zijn genoten.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: '8.4'
    text: |-
      Bij de vaststelling van de grondslag, bedoeld in het eerste, tweede en derde lid, wordt geen rekening gehouden
      met de mogelijkheid van bevordering of verhoging van de vakbekwaamheid, uitbreiding van het bedrijf of andere
      dergelijke factoren.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: '8.5'
    text: |-
      Indien de vervolgde ten tijde van het tot uiting komen van de ziekten of gebreken, of de verergering daarvan,
      dan wel ten tijde van het overlijden, niet aangewezen was op inkomsten uit arbeid in beroep of bedrijf, wordt de
      grondslag vastgesteld op het van toepassing zijnde bedrag, genoemd in het zevende lid, onder a, dan wel het bedrag,
      genoemd in het achtste lid, onder a.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: '8.6'
    text: |-
      Bij de vaststelling van de grondslag voor de vervolgde die vóór het tot uiting komen van de ziekten en
      gebreken, of de verergering daarvan, door of in verband met het volgen van onderwijs nog geen arbeid in beroep
      of bedrijf uitoefende, wordt rekening gehouden met de omstandigheden die ten tijde van de aanvraag bedoeld in
      [artikel 30][ref1] terzake van invloed zijn. Onze Minister stelt te dien aanzien nadere regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel30
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '30'
        hoofdstuk: IV
  - number: '8.7'
    text: 'De in de vorige leden, behoudens in het derde lid, onder b, bedoelde grondslag wordt bepaald op:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.7.a
    text: tenminste een bedrag van € 1.867,87 per maand per 1 juli 1976  en
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.7.b
    text: ten hoogste een bedrag van € 3.877,64 per maand per 1 juli 1976 .
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: '8.8'
    text: 'De in het derde lid, onder b, bedoelde grondslag wordt bepaald op:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.8.a
    text: tenminste een bedrag van 23 000 rupiah per maand  en
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: 8.8.b
    text: ten hoogste een bedrag van 57 500 rupiah per maand .
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: '8.9'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat onder inkomen uit arbeid in beroep of bedrijf, als bedoeld in
      het tweede lid, moet worden verstaan.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel8
  - number: '9'
    text: |-
      Het bepaalde in deze paragraaf is niet van toepassing, indien de aanspraken op een uitkering betrekking hebben op
      die van de minderjarige volle wees.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel9
  - number: '10.1'
    text: |-
      De uitkering bedraagt een percentage van de ingevolge [artikel 8][ref1] vastgestelde grondslag, en wel:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10.1.a
    text: 85% voor de gehuwde vervolgde, tenzij het bepaalde onder b van toepassing is;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
  - number: 10.1.b
    text: |-
      75% voor de gehuwde vervolgde, indien het inkomen van de echtgenoot, inkomsten uit
      vermogen daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in
      [artikel 8, zevende lid, onder b, onderscheidenlijk achtste lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10.1.c
    text: 80% voor de ongehuwde vervolgde met minderjarige kinderen;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
  - number: 10.1.d
    text: 75% voor de alleenstaande vervolgde;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
  - number: 10.1.e
    text: |-
      75% voor de weduwe en de weduwnaar van de vervolgde met minderjarige kinderen, met dien verstande dat de uitkering
      ten hoogste wordt bepaald op een bedrag van € 2.533,89 per maand per 1 juli 1976 ;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
  - number: 10.1.f
    text: |-
      70% voor de weduwe en de weduwnaar van de vervolgde zonder minderjarige kinderen, met dien verstande dat de
      uitkering ten hoogste wordt bepaald op een bedrag van € 2.357,75 per maand per 1 juli 1976 .
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
  - number: 10.2.a
    text: |-
      De percentages, genoemd in het eerste lid, onder a, b, c en d, worden met 15 verminderd met ingang
      van de eerste dag van de maand waarin de uitkeringsgerechtigde de leeftijd van 65 jaar bereikt, tenzij
      [artikel 8, derde lid, onder b][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 10.2.b
    text: |-
      De percentages, genoemd in het eerste lid, onder e en f, worden met 20 verminderd met ingang van
      de eerste dag van de maand waarin de uitkeringsgerechtigde de leeftijd van 65 jaar bereikt, tenzij
      [artikel 8, derde lid, onder b][ref1], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.3'
    text: |-
      In de in het eerste lid onder a, b, c en d genoemde percentages is een toeslagpercentage van 5 begrepen.
      Deze toeslag bedraagt niet minder dan een bedrag overeenkomende met 10% van de grondslag genoemd in
      [artikel 8, zevende lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '10.4'
    text: |-
      Bij overlijden van de echtgenoot van de vervolgde blijft het uitkeringspercentage ongewijzigd tot en met de laatste
      dag van de maand, volgende op die, waarin het overlijden heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel10
  - number: '11.1'
    text: |-
      Indien de vervolgde, bedoeld in [artikel 7, eerste lid, onder ][ref1], in staat is zich door passende arbeid
      een inkomen te verwerven, doch deze arbeid om niet gegronde redenen niet of slechts ten dele verricht, wordt
      de uitkering bepaald overeenkomstig de graad van zijn onvermogen het in [artikel 8][ref2] bedoelde inkomen te
      verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '11.2'
    text: |-
      Het bepaalde in het eerste lid is niet van toepassing, indien de vervolgde buiten staat is 40% van het in
      [artikel 8][ref1] bedoelde inkomen te verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '12'
    text: 'Indien de uitkeringsgerechtigde recht kan doen gelden op twee van de volgende rechten:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel12
  - number: 12.a
    text: |-
      een uitkering ingevolge [artikel 7, eerste lid, onder ][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel7
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: 12.b
    text: |-
      een uitkering ingevolge [artikel 7, eerste lid, onder ][ref1], wordt slechts die uitkering verleend, welke leidt
      tot de hoogste uitbetaling aan de uitkeringsgerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel7
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
  - number: 13.a
    text: |-
      De uitkering aan de minderjarige volle wees wordt naar behoefte individueel bepaald. Bij de vaststelling van de
      uitkering wordt rekening gehouden met geëigende voorzieningen ter zake van kosten van onderwijs en opleiding.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel13
  - number: 13.b
    text: |-
      De onder *a* bedoelde uitkering kan zo nodig worden voortgezet tot uiterlijk het bereiken van de 27-jarige
      leeftijd, indien de betrokkene, hetzij in verband met een dagstudie, hetzij in verband met arbeidsongeschiktheid,
      door het ontbreken van andere geëigende voorzieningen op die uitkering is aangewezen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel13
  - number: '14.1'
    text: |-
      Bij verblijf van een alleenstaande of een echtpaar ter verpleging of verzorging in een daartoe bestemde inrichting,
      waarvan de kosten met toepassing van één der sociale verzekeringswetten worden betaald, wordt de uitkering, met
      ingang van het tijdstip waarop redelijkerwijs kan worden aangenomen dat deze verpleging of verzorging een langdurig
      karakter draagt, doch in ieder geval na verloop van een jaar, nader bepaald op:
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
  - number: 14.1.a
    text: |-
      12% van de overeenkomstig [artikel 8][ref1] vastgestelde grondslag voor een alleenstaande;


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.1.b
    text: |-
      20% van de overeenkomstig [artikel 8][ref1] vastgestelde grondslag voor een gehuwde, tenzij onderdeel *c* van
      toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 14.1.c
    text: |-
      12% van de overeenkomstig [artikel 8][ref1] vastgestelde grondslag voor een gehuwde, indien het inkomen van de
      echtgenoot, inkomsten uit vermogen daaronder niet begrepen, meer bedraagt dan 30% van het bedrag, bedoeld in
      [artikel 8, zevende lid, onder b, onderscheidenlijk achtste lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '14.2'
    text: |-
      Voor de in Nederland gevestigde uitkeringsgerechtigde en de uitkeringsgerechtigde op wie
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, wordt op de overeenkomstig het eerste
      lid vastgestelde uitkering ten behoeve van de te zijnen laste komende premie van verzekering tegen ziektekosten
      een bij algemene maatregel van bestuur vastgestelde toeslag verleend die per categorie van uitkeringsgerechtigden
      verschilt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: '14.3'
    text: |-
      Voor de niet in Nederland gevestigde uitkeringsgerechtigde, met uitzondering van de uitkeringsgerechtigde op wie
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, wordt op de overeenkomstig het eerste
      lid vastgestelde uitkering een toeslag verleend gelijk aan het, op het tijdstip met ingang waarvan toepassing wordt
      gegeven aan het eerste lid, eenmalig vast te stellen bedrag van de te zijnen laste blijvende premie van verzekering
      tegen ziektekosten, doch ten hoogste tot een bij algemene maatregel van bestuur vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: '14.4'
    text: |-
      Het ingevolge het derde lid vastgestelde bedrag van de ten laste van de uitkeringsgerechtigde blijvende premie van
      verzekering tegen ziektekosten wordt door de Sociale verzekeringsbank herzien:
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
  - number: 14.4.a
    text: |-
      jaarlijks, naar evenredigheid van de ontwikkeling van de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel1
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '1'
  - number: 14.4.b
    text: bij het door de gerechtigde bereiken van de 65-jarige leeftijd,
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
  - number: 14.4.c
    text: bij veranderingen in de gezinssituatie van de gerechtigde, of
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
  - number: 14.4.d
    text: |-
      indien de Sociale verzekeringsbank van oordeel is dat het niet herzien van het vastgestelde bedrag gelet op het
      belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
  - number: '14.5'
    text: |-
      Indien de in het eerste lid bedoelde kosten van verpleging of verzorging met toepassing van de
      [Algemene Wet Bijzondere Ziektekosten][ref1] worden betaald en de uitkeringsgerechtigde in die kosten een eigen
      bijdrage verschuldigd is, wordt op de overeenkomstig het eerste lid vastgestelde uitkering een toeslag verleend
      gelijk aan het bedrag van de eigen bijdrage.


      [ref1]: https://wetten.overheid.nl/BWBR0002614
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002614
  - number: '14.6'
    text: |-
      Op de overeenkomstig het eerste tot en met derde en vijfde lid vastgestelde uitkering worden in mindering gebracht
      de inkomsten van de uitkeringsgerechtigde en van zijn echtgenoot. De inkomsten uit vermogen worden berekend
      overeenkomstig het bepaalde in [artikel 19, vijfde en negende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel19
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '19'
        hoofdstuk: II
        paragraaf: '3'
  - number: '14.7'
    text: |-
      Het eerste, tweede, vijfde en zesde lid zijn niet van toepassing indien de
      uitkeringsgerechtigde op 31 december 2000 verbleef in een verzorgingshuis als bedoeld in
      [artikel 1, eerste lid, onder b, van de Overgangswet verzorgingshuizen][ref1] zoals dat luidde voor het vervallen
      van deze bepaling.


      [ref1]: https://wetten.overheid.nl/BWBR0008252#Artikel1
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008252
        artikel: '1'
  - number: '15.1'
    text: |-
      Voor de in Nederland gevestigde uitkeringsgerechtigde en de uitkeringsgerechtigde op wie
      [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, bij wie de
      overeenkomstig [artikel 8][ref2] vastgestelde grondslag niet hoger is dan het bedrag, bedoeld in het
      [zevende lid, onder a, van dat artikel][ref3], wordt op de uitkering ten behoeve van de te zijnen laste komende
      premie van verzekering tegen ziektekosten een bij algemene maatregel van bestuur vastgestelde toeslag verleend die
      per categorie van uitkeringsgerechtigden verschilt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.2'
    text: |-
      Voor de niet in Nederland gevestigde uitkeringsgerechtigde, met uitzondering van de uitkeringsgerechtigde
      op wie [artikel 69, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing is, bij wie de
      overeenkomstig [artikel 8][ref2] vastgestelde grondslag niet hoger is dan het bedrag, bedoeld in het
      [zevende lid, onder a, van dat artikel][ref3], wordt op de uitkering een toeslag verleend gelijk aan het bij de
      toekenning van de periodieke uitkering eenmalig vast te stellen bedrag van de te zijnen lasten blijvende premie van
      verzekering tegen ziektekosten, doch ten hoogste tot een bij algemene maatregel van bestuur vast te stellen bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '15.3'
    text: |-
      Het ingevolge het tweede lid vastgestelde bedrag van de ten laste van de uitkeringsgerechtigde blijvende premie van
      verzekering tegen ziektekosten wordt door de Sociale verzekeringsbank herzien:
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
  - number: 15.3.a
    text: |-
      jaarlijks, naar evenredigheid van de ontwikkeling van de standaardpremie, bedoeld in
      [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel1
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '1'
  - number: 15.3.b
    text: bij het door de gerechtigde bereiken van de 65-jarige leeftijd,
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
  - number: 15.3.c
    text: bij veranderingen in de gezinssituatie van de gerechtigde, of
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
  - number: 15.3.d
    text: |-
      indien de Sociale verzekeringsbank van oordeel is dat het niet herzien van het vastgestelde bedrag gelet op het
      belang dat dit artikel beoogt te beschermen zal leiden tot een onbillijkheid van overwegende aard.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
  - number: '15.4'
    text: |-
      Indien de overeenkomstig [artikel 8][ref1] vastgestelde grondslag meer bedraagt dan het bedrag, bedoeld in
      het [zevende lid, onder a, van dat artikel][ref2], wordt de uitkering van de uitkeringsgerechtigde alleen
      dan vermeerderd met een toeslag wegens de premie van verzekering tegen ziektekosten, indien en voorzover
      de uitkering minder zou bedragen dan de uitkering, welke is afgeleid van het bedrag, bedoeld in het
      [zevende lid, onder a, van dat artikel][ref3] verhoogd met de in het eerste lid bedoelde toeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '16.1'
    text: |-
      Indien geen kinderbijslag uit welken hoofde of onder welke benaming ook wordt genoten, wordt op de in
      [artikel 10][ref1] bedoelde uitkering een toeslag verleend voor de minderjarige kinderen waarvoor kinderbijslag zou
      worden ontvangen, indien de [Algemene Kinderbijslagwet][ref2] van toepassing zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002368
  - number: '16.2'
    text: Deze toeslag beloopt een bedrag gelijk aan de kinderbijslag ingevolge de in het eerste lid genoemde wet.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel16
  - number: '16.3'
    text: |-
      In afwijking van het tweede lid wordt, indien [artikel 8, derde lid, onder ][ref1], van toepassing is, de toeslag
      bepaald op het bedrag aan kindertoelage dat in Indonesië zou worden genoten, indien het beroep of bedrijf waarnaar
      de grondslag is vastgesteld aldaar zou worden uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '17.1'
    text: |-
      Op de in [artikel 10][ref1] bedoelde uitkering wordt, indien de uitkeringsgerechtigde 65 jaar of ouder is, een
      toeslag verleend. Deze toeslag bedraagt:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel10
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
  - number: 17.1.a
    text: |-
      voor de gehuwde uitkeringsgerechtigde 60% van het bedrag van het bruto-ouderdomspensioen voor de
      pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref1], vermeerderd
      met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 17.1.b
    text: |-
      voor de ongehuwde uitkeringsgerechtigde, die tevens een pensioengerechtigde is als bedoeld in
      [artikel 9, eerste lid, onder c, van de Algemene Ouderdomswet][ref1], 20% van het bedrag van het bruto-
      ouderdomspensioen voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder c, van die wet][ref2],
      vermeerderd met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 17.1.c
    text: |-
      voor de ongehuwde uitkeringsgerechtigde, anders dan die, bedoeld onder b, 20% van
      het bedrag van het bruto-ouderdomspensioen voor de pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onder a, van de Algemene Ouderdomswet][ref1], vermeerderd met de vakantie-uitkering,
      bedoeld in [artikel 29 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '29'
  - number: '17.2'
    text: 'De in het eerste lid bedoelde toeslag wordt niet verleend:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
  - number: 17.2.a
    text: |-
      indien [artikel 8, derde lid, onder b][ref1], van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 17.2.b
    text: |-
      aan de gehuwde uitkeringsgerechtigde, van wie de echtgenoot recht heeft op enig pensioen en ten aanzien van wie
      [artikel 19, achtste lid][ref1], wordt toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel19
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '19'
        hoofdstuk: II
        paragraaf: '3'
  - number: '17.3'
    text: |-
      Onder enig pensioen als bedoeld in het tweede lid, onder b, wordt verstaan, een pensioen ten laste van de
      Nederlandse Schatkist of die van de Nederlandse Antillen of Aruba, van een publiekrechtelijk lichaam of een
      privaatrechtelijke rechtspersoon in Nederland, de Nederlandse Antillen of Aruba, dan wel ten laste van een door het
      openbaar gezag in Nederland, de Nederlandse Antillen of Aruba ingesteld fonds, alsmede een uitkering ingevolge deze
      wet of de [Wet uitkeringen burger-oorlogsslachtoffers 1940–1945][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003664
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003664
  - number: 17a.1
    text: |-
      Indien de uitkeringsgerechtigde over zijn uitkering de inkomensafhankelijke bijdrage, bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref1], verschuldigd is, heeft hij recht op een toeslag.
      Deze toeslag bedraagt het percentage van de uitkering dat overeenkomt met het bijdragepercentage,
      bedoeld in [artikel 45, tweede lid, van de Zorgverzekeringswet][ref2], vermenigvuldigd met
      anderhalf, voorzover de uitkering is te rekenen tot het deel van het bijdrage-inkomen, bedoeld in
      [artikel 43, eerste lid, onderdeel a, van de Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '41'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 17a.2
    text: |-
      Indien de uitkeringsgerechtigde over zijn uitkering de bijdrage, bedoeld in
      [artikel 69, tweede lid, van de Zorgverzekeringswet][ref1], verschuldigd is heeft hij recht op een toeslag. Voor de
      berekening van deze toeslag is het eerste lid, tweede volzin, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: 17a.3
    text: |-
      Het in aanmerking te nemen bijdrage-inkomen bedraagt op jaarbasis ten hoogste het bedrag, bedoeld in
      [artikel 43, tweede lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel17a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
  - number: '18.1'
    text: |-
      De uitkering wordt door de Sociale verzekeringsbank aangepast overeenkomstig de normen en voorwaarden waarmee
      het bedrag, genoemd in [artikel 8, eerste lid, onder a, van de Wet minimumloon en minimumvakantiebijslag][ref1]
      ingevolge [artikel 14 van die wet][ref2] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '18.2'
    text: |-
      De grondslagen, bedoeld in [artikel 8, eerste, tweede en zesde lid][ref1], en de bedragen genoemd in
      [artikel 8, zevende lid, onder a en b][ref2], en [artikel 10, eerste lid, onder e en f][ref3], worden
      door Onze Minister aangepast overeenkomstig de normen en voorwaarden waarmee het bedrag, genoemd in
      [artikel 8, eerste lid, onder a, van de Wet minimumloon en minimumvakantiebijslag][ref4] ingevolge
      [artikel 14 van die wet][ref5] wordt herzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0002638
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '18.3'
    text: |-
      In afwijking van het eerste lid wordt, indien de vervolging in het voormalige Nederlands-Indië heeft plaats gehad
      en de uitkeringsgerechtigde in Indonesië gevestigd is, de uitkering door de Sociale verzekeringsbank aangepast
      indien de lonen en prijzen in Indonesië daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
  - number: '18.4'
    text: |-
      In afwijking van het tweede lid worden, indien de vervolging in het voormalige Nederlands-Indië
      heeft plaats gehad en de uitkeringsgerechtigde in Indonesië gevestigd is, de grondslag, bedoeld in
      [artikel 8, derde lid, onder b][ref1], en de bedragen genoemd in [artikel 8, achtste lid, onder a en b][ref2], door
      Onze Minister aangepast indien de lonen en prijzen in Indonesië daartoe aanleiding geven.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '18.5'
    text: |-
      Bij de aanpassing van een uitkering, bedoeld in het eerste en derde lid, wordt uitgegaan van de laatst
      vastgestelde dan wel overeenkomstig die leden aangepaste uitkering, waarbij de toeslagen, bedoeld in de
      [artikelen 14, tweede en derde lid][ref1], en [15, eerste en tweede lid,][ref2] buiten beschouwing worden gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel15
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
  - number: '18.6'
    text: |-
      De aanpassing van een uitkering, bedoeld in het eerste en derde lid, vindt plaats zonder dat dit bij beschikking
      is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
  - number: '18.7'
    text: |-
      De aangepaste uitkering, bedoeld in het zesde lid, wordt betaald bij de eerstvolgende betaling nadat de aanpassing
      heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
  - number: '18.8'
    text: |-
      Het bedrag, genoemd in [artikel 19, vijfde lid][ref1], wordt door Onze Minister telkens herzien met ingang van 1
      januari, voor zover de ontwikkeling van de consumentenprijsindex in de periode 1 november tot en met 31 oktober
      daaraan voorafgaande, daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel19
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '19'
        hoofdstuk: II
        paragraaf: '3'
  - number: '18.9'
    text: Een besluit van Onze Minister ingevolge het achtste lid wordt in de *Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18
  - number: 18a
    text: |-
      De op grond van de [artikelen 14, tweede en derde lid][ref1], en [15, eerste en tweede lid][ref2], bij algemene
      maatregel van bestuur vastgestelde bedragen worden door Onze Minister herzien naar evenredigheid van de ontwikkeling
      van de standaardpremie, bedoeld in [artikel 1, eerste lid, onderdeel g, van de Wet op de zorgtoeslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel1
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel18a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018451
        artikel: '1'
  - number: '19.1'
    text: |-
      Behoudens het bepaalde in [artikel 14, zesde lid][ref1], worden op de uitkeringen, vermeerderd met de toeslagen als
      bedoeld in de [artikelen 15][ref2] en [17][ref3], in mindering gebracht:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel17
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
  - number: 19.1.a
    text: |-
      indien de uitkeringsgerechtigde de leeftijd van 65 jaar nog niet heeft bereikt, de bruto- inkomsten uit
      tegenwoordige arbeid in beroep of bedrijf, na aftrek van verwervingskosten, voorzover deze inkomsten 20% van de
      grondslag waarnaar de uitkering is berekend te boven gaan;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: 19.1.b
    text: |-
      indien de uitkeringsgerechtigde 65 jaar of ouder is, en pensioengerechtigd ingevolge de
      [Algemene Ouderdomswet][ref1], het bruto-ouderdomspensioen krachtens die wet van de uitkeringsgerechtigde en
      de echtgenoot met inbegrip van de toeslag, bedoeld in [artikel 10 van die wet][ref2], en de vakantie-uitkering,
      bedoeld in [artikel 29 van die wet][ref3], voorzover dit niet meer bedraagt dan twee maal het bedrag van het bruto-
      ouderdomspensioen voor de pensioengerechtigde, bedoeld in [artikel 9, eerste lid, onder b, van die wet][ref4],
      vermeerderd met de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref5];


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0002221#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0002221
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '29'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref5
        bwb_id: BWBR0002221
        artikel: '29'
  - number: 19.1.c
    text: de inkomsten uit vermogen van de uitkeringsgerechtigde en zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: 19.1.d
    text: |-
      de overige inkomsten, met uitzondering van inkomsten van de echtgenoot van de vervolgde alsmede van kinderbijslag
      uit welken hoofde of onder welke benaming ook genoten.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bij de toepassing van het bepaalde in het eerste lid, onder a, b en d, worden jaarlijkse vakantie-uitkeringen van
      de uitkeringsgerechtigde voor 1/12 deel per maand op de uitkering in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: '19.3'
    text: |-
      Met inkomsten uit tegenwoordige arbeid worden gelijkgesteld uitkeringen op grond van de [Ziektewet][ref1]
      en de [Werkloosheidswet][ref2], alsmede de daarmede vergelijkbare uitkeringen welke worden verleend aan het
      overheidspersoneel.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0004045
  - number: '19.4'
    text: |-
      Indien toepassing is gegeven aan [artikel 11][ref1] worden de inkomsten uit arbeid in beroep of bedrijf in
      mindering gebracht voorzover de som van de uitkering en die inkomsten de grondslag, bedoeld in [artikel 8][ref2],
      overtreft.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '11'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: '19.5'
    text: |-
      De inkomsten uit vermogen, bedoeld in het eerste lid, onder c, worden berekend naar het vermogen dat de
      uitkeringsgerechtigde en zijn echtgenoot op het tijdstip van de aanvraag, bedoeld in [artikel 30][ref1], bezitten.
      Deze inkomsten worden op jaarbasis bepaald op een percentage van dat vermogen dat gelijk is aan het forfaitaire
      rendementspercentage, genoemd in [artikel 5.2 van de Wet inkomstenbelasting 2001][ref2], met dien verstande dat van
      het aldus berekende bedrag f 1428  per jaar wordt vrijgelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '30'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '5'
  - number: '19.6'
    text: |-
      Bij bedrijfsbeëindiging vindt het bepaalde in het eerste lid, onder *c* en het vijfde lid, van dat tijdstip af
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: '19.7'
    text: |-
      Tot de inkomsten bedoeld in het eerste lid worden niet gerekend doelgerichte subsidies of
      tegemoetkomingen, waaronder begrepen de vermeerdering, bedoeld in de [artikelen 10][ref1]
      en [11 van de Wet buitengewoon pensioen 1940-1945][ref2], de [artikelen 9][ref3] en
      [10 van de Wet buitengewoon pensioen zeelieden-oorlogsslachtoffers][ref4] en de [artikelen 12][ref5],
      [13][ref6] en [14 van de Wet buitengewoon pensioen Indisch verzet][ref7], voorzover deze de toeslag, bedoeld
      in [artikel 10, derde lid][ref8], of het bedrag, bedoeld in [artikel 21b ][ref9], indien dit is toegekend,
      overschrijdt.


      [ref1]: https://wetten.overheid.nl/BWBR0002032#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002032#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002035#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002035#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0003968#Artikel12
      [ref6]: https://wetten.overheid.nl/BWBR0003968#Artikel13
      [ref7]: https://wetten.overheid.nl/BWBR0003968#Artikel14
      [ref8]: https://wetten.overheid.nl/BWBR0002844#Artikel10
      [ref9]: https://wetten.overheid.nl/BWBR0002844#Artikel21b
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002032
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002032
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0002035
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002035
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0003968
        artikel: '12'
      - id: ref6
        bwb_id: BWBR0003968
        artikel: '13'
      - id: ref7
        bwb_id: BWBR0003968
        artikel: '14'
      - id: ref8
        bwb_id: BWBR0002844
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref9
        bwb_id: BWBR0002844
        artikel: 21b
        hoofdstuk: II
        paragraaf: '4'
  - number: '19.8'
    text: |-
      Indien de echtgenoot van de uitkeringsgerechtigde eveneens recht heeft op enig pensioen als
      bedoeld in [artikel 17, derde lid][ref1], en op dat pensioen een vermindering is toegepast uit
      hoofde van recht op ouderdomspensioen ingevolge de [Algemene Ouderdomswet][ref2] van tenminste
      40% van het bedrag van het bruto-ouderdomspensioen voor de pensioengerechtigde, bedoeld in
      [artikel 9, eerste lid, onder b, van de Algemene Ouderdomswet][ref3], vermeerderd met 40% van de vakantie-
      uitkering, bedoeld in [artikel 29 van die wet][ref4], zijn het eerste tot en met achtste lid van toepassing, met
      dien verstande dat, in afwijking van het eerste lid, onder b, op schriftelijk verzoek van de uitkeringsgerechtigde
      50% van het aan de uitkeringsgerechtigde en de echtgenoot toegekende bruto-ouderdomspensioen krachtens de
      [Algemene Ouderdomswet][ref5], met inbegrip van de vakantie-uitkering, bedoeld in [artikel 29 van die wet][ref6],
      op de uitkering in mindering wordt gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002221
      [ref3]: https://wetten.overheid.nl/BWBR0002221#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0002221#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0002221
      [ref6]: https://wetten.overheid.nl/BWBR0002221#Artikel29
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002221
      - id: ref3
        bwb_id: BWBR0002221
        artikel: '9'
      - id: ref4
        bwb_id: BWBR0002221
        artikel: '29'
      - id: ref5
        bwb_id: BWBR0002221
      - id: ref6
        bwb_id: BWBR0002221
        artikel: '29'
  - number: '19.9'
    text: |-
      Indien de echtgenoot van de uitkeringsgerechtigde eveneens recht heeft op een uitkering ingevolge deze wet, zijn
      het eerste tot en met het negende lid van toepassing, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: 19.9.a
    text: |-
      in afwijking van het eerste lid, onder c, de inkomsten uit vermogen van de uitkeringsgerechtigde en de echtgenoot
      bij ieder voor de helft in mindering worden gebracht;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: 19.9.b
    text: in afwijking van het vijfde lid, onder a, het in dat artikelonderdeel bedoelde bedrag wordt gehalveerd.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: '19.10'
    text: |-
      Onze Minister kan nadere regelen stellen met betrekking tot de vaststelling van de inkomsten uit of in verband met
      arbeid in beroep of bedrijf en de daarop drukkende verwervingskosten, de overige inkomsten, alsmede met betrekking
      tot de vaststelling en de taxatie van het vermogen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19
  - number: 19a.1
    text: |-
      Op de uitkeringen, waaronder begrepen de met de in [artikel 17][ref1] genoemde toeslag verhoogde uitkering, wordt,
      na toepassing van de [artikel 14, zesde lid][ref2], en [19][ref3], een bedrag ingehouden, dat gelijk is aan het
      bedrag van de premie dat een werkgever ingevolge [hoofdstuk 3 van de Wet financiering sociale verzekeringen][ref4]
      op het overeenkomstige loon van een werknemer, die verzekerd is ingevolge [die wet][ref5], inhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel19
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '19'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0017745
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0017745
  - number: 19a.2
    text: |-
      Indien ingevolge de [Wet financiering sociale verzekeringen][ref1] een premie wordt ingehouden waarvan het
      percentage per bedrijfstak verschilt, wordt met inachtneming van bij algemene maatregel van bestuur te stellen
      regelen door Onze Minister voor de toepassing van het eerste lid een gemiddeld percentage vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0017745
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0017745
  - number: 19a.3
    text: |-
      Het eerste lid is niet van toepassing indien de uitkeringsgerechtigde 65 jaar of ouder is, of de uitkering is
      berekend naar een grondslag als bedoeld in [artikel 8, derde lid, onder b][ref1], dan wel is vastgesteld met
      toepassing van [artikel 13][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel13
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
  - number: '20.1'
    text: |-
      Indien de vervolgde wegens ziekten of gebreken, welke door of in verband met de vervolging zijn ontstaan of
      verergerd, geneeskundige behandeling en verpleging behoeft, worden de daaraan verbonden ten laste van de vervolgde
      blijvende noodzakelijke kosten, alsmede de daarmee direct verband houdende extra kosten voor noodzakelijke
      voorzieningen, volledig vergoed, tenzij het derde lid van toepassing is.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel20
  - number: '20.2'
    text: |-
      De vergoeding wordt eveneens verleend in het geval dat een geneeskundige behandeling of verpleging kan bijdragen
      tot het voorkomen van ziekten of gebreken als in het eerste lid bedoeld.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel20
  - number: '20.3'
    text: |-
      Indien de in het eerste en tweede lid bedoelde kosten betrekking hebben op verpleging of verzorging van
      een alleenstaande of een echtpaar in een daartoe bestemde inrichting, en niet met toepassing van een der
      sociale verzekeringswetten worden betaald, worden deze kosten vergoed voor zover de inkomsten daartoe
      ontoereikend zijn. Van de inkomsten blijft buiten beschouwing een bedrag ter grootte van de overeenkomstig
      [artikel 14, eerste tot en met derde lid][ref1], vastgestelde uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel14
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: '20.4'
    text: |-
      Een vergoeding ter zake van de kosten, bedoeld in het eerste tot en met derde lid, wordt slechts verleend voor
      zover deze niet ten laste kunnen worden gebracht van een zorgverzekering ingevolge de [Zorgverzekeringswet][ref1]
      of een andere ziektekostenverzekering of ten laste daarvan zouden kunnen worden gebracht indien een zodanige
      verzekering is of zou zijn gesloten. De Raad of de Sociale verzekeringsbank kan van de eerste volzin afwijken,
      indien, gezien de individuele omstandigheden van de aanvrager, naar het oordeel van de Raad of de Sociale
      verzekeringsbank daartoe gegronde redenen aanwezig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '21.1'
    text: |-
      In de ten laste van de vervolgde blijvende kosten van voorzieningen verband houdende met ziekten en gebreken als
      bedoeld in [artikel 20][ref1], welke voorzieningen strekken tot verbetering van diens levensomstandigheden, kan een
      tegemoetkoming worden verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel20
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
  - number: '21.2'
    text: |-
      De tegemoetkoming heeft ten hoogste betrekking op de in het eerste lid bedoelde kosten in zover deze, met
      inachtneming van de totale financiële omstandigheden van de vervolgde en het levenspeil waarop hij placht te leven
      vóór het tot uiting komen van de ziekten of gebreken, bedoeld in [artikel 20][ref1], als bijzondere kosten moeten
      worden aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel20
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
  - number: '21.3'
    text: |-
      De tegemoetkoming in de bijzondere kosten bedoeld in het tweede lid wordt bepaald met inachtneming van de
      financiële draagkracht van de vervolgde.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel21
  - number: '21.4'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de tegemoetkoming in de
      bijzondere kosten en de bepaling van de financiële draagkracht van de vervolgde.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel21
  - number: 21a.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de aard,
      de ingangsdatum, de duur en de wijze van verstrekken van de voorzieningen, bedoeld in de [artikelen 20][ref1] en
      [21][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel21
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
  - number: 21a.2
    text: |-
      In afwijking van het eerste lid van de [artikelen 20][ref1] en 21 kan aan categorieën vervolgden, die ziekten of
      gebreken hebben welke door of in verband met de vervolging zijn ontstaan of verergerd, in de kosten van bepaalde
      voorzieningen een vergoeding of tegemoetkoming worden verleend zonder dat het in die artikelleden bedoelde verband
      is vereist. Bij algemene maatregel van bestuur worden ter zake regels gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel20
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
  - number: 21a.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld betreffende de mogelijkheid om de vergoeding of
      tegemoetkoming in de kosten van bepaalde voorzieningen als bedoeld in de [artikelen 20][ref1] en [21][ref2] na het
      overlijden van de vervolgde, die ziekten of gebreken had welke door of in verband met de vervolging zijn ontstaan
      of verergerd, gedurende een bepaalde tijd ten gunste van de weduwe of weduwnaar voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel21
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel21a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
  - number: '22.1'
    text: |-
      Degene die in verband met de vervolgingsomstandigheden verwacht te eniger tijd aanspraken aan deze wet te kunnen
      ontlenen, kan bij de Raad een verzoek indienen om als vervolgde te worden erkend.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel22
  - number: '22.2'
    text: Op het verzoek wordt door de Raad een beschikking gegeven.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel22
  - number: '22.3'
    text: |-
      Een beschikking ingevolge de Rijksgroepsregeling Vervolgingsslachtoffers 1940-1945, dan wel ingevolge het
      ingetrokken hoofdstuk III van de Rijksgroepsregeling Oorlogsslachtoffers 1940-1945, op grond waarvan de
      belanghebbende als vervolgde is aangemerkt, wordt geacht een beschikking te zijn op grond van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel22
  - number: '30.1'
    text: |-
      De toekenning van een uitkering, vergoeding of tegemoetkoming geschiedt naar aanleiding van een daartoe bij de Raad
      of de Sociale verzekeringsbank ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '30.2'
    text: |-
      De Raad of de Sociale verzekeringsbank kent geen uitkering, vergoeding of tegemoetkoming toe dan nadat is
      vastgesteld dat het door de aanvrager opgegeven adres overeenstemt met het hem betreffende adresgegeven in de
      gemeentelijke basisadministratie.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '30.3'
    text: Het bepaalde in het tweede lid is niet van toepassing indien de aanvrager in het buitenland gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '30.4'
    text: |-
      De Raad of de Sociale verzekeringsbank kan het tweede lid buiten toepassing laten of daarvan afwijken voor zover
      toepassing gelet op het belang dat deze wet beoogt te beschermen zal leiden tot een onbillijkheid van overwegende
      aard.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '30.5'
    text: Op de aanvraag wordt de datum van ontvangst aangetekend.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '30.6'
    text: |-
      De ontvangst van de aanvraag wordt de aanvrager schriftelijk bevestigd. Daarbij wordt hem voorlichting gegeven over
      de verdere procedure en de geldende behandeltermijnen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '30.7'
    text: |-
      Indien de belanghebbende in het buitenland is gevestigd wordt de aanvraag, tenzij de Sociale verzekeringsbank in
      het desbetreffende land een eigen vertegenwoordiging heeft, ingediend bij het hoofd der Nederlandse diplomatieke
      dan wel consulaire vertegenwoordiging in wiens ambtsgebied of ressort hij gevestigd is. Deze zendt de op de
      aanvraag betrekking hebbende bescheiden door aan de Raad of de Sociale verzekeringsbank.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '30.8'
    text: |-
      Onze Minister kan nadere regelen stellen met betrekking tot de bij de behandeling van de aanvraag over te leggen
      bescheiden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel30
  - number: '31.1'
    text: |-
      Alvorens op een aanvraag wordt beslist, wordt een rapport opgesteld omtrent de aard en de gevolgen van de
      vervolging en de levensomstandigheden van de betrokkene. Het rapport bevat een advies met betrekking tot de met
      toepassing van deze wet te treffen voorzieningen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: '31.2'
    text: 'Naar keuze van de belanghebbende wordt het rapport opgesteld door:'
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: 31.2.a
    text: de Stichting Joods Maatschappelijk Werk te Amsterdam;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: 31.2.b
    text: de Stichting Pelita te 's-Gravenhage;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: 31.2.c
    text: de Stichting 1940-1945 te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: '31.3'
    text: |-
      De Raad of de Sociale verzekeringsbank kan, in overeenstemming met de belanghebbende, bepalen dat op andere wijze
      in het opstellen van het rapport wordt voorzien.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: '31.4'
    text: |-
      Het rapport wordt opgesteld binnen zes weken nadat de opdracht daartoe bij een instantie als bedoeld in het
      tweede, onderscheidenlijk het derde lid, is ingekomen, met dien verstande dat het rapport binnen vier weken wordt
      opgesteld, indien de aanvraag betrekking heeft op een vergoeding of een tegemoetkoming. Indien die instantie
      niet tijdig in het opstellen van het rapport voorziet kan de Raad of de Sociale verzekeringsbank, met instemming
      van de betrokkene, besluiten op andere wijze informatie omtrent de aard en de gevolgen van de vervolging en de
      levensomstandigheden van de betrokkene in te winnen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: '31.5'
    text: |-
      Indien de belanghebbende in het buitenland is gevestigd, wordt het rapport opgesteld onder verantwoordelijkheid van
      de instantie, waarbij de aanvraag op grond van [artikel 30, zevende lid][ref1], moet worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel30
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '30'
        hoofdstuk: IV
  - number: '31.6'
    text: |-
      Indien een aanvraag betrekking heeft op een vergoeding of tegemoetkoming behoeft het in het eerste lid bedoelde
      rapport slechts te worden opgesteld indien de Raad of de Sociale verzekeringsbank dat nodig acht.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel31
  - number: '32.1'
    text: |-
      Van de beschikking wordt mededeling gedaan aan het orgaan dat het in [artikel 31][ref1] bedoelde rapport heeft
      opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel31
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '31'
        hoofdstuk: IV
  - number: '32.2'
    text: |-
      Bij de bekendmaking van de beschikking wordt voorlichting gegeven over de procedure en de voor het bezwaarschrift
      geldende termijn van behandeling.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32
  - number: '32.3'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 7, eerste lid, onder ][ref1], voor zover de aanvrager niet
      reeds op grond van [artikel 22][ref2] als vervolgde is erkend, [artikel 7, eerste lid, onder ][ref3], voor zover
      de overledene geen aanspraken op deze wet heeft doen gelden, de [artikelen 20][ref4] en [21][ref5], voorzover
      de aanvrager niet eerder aanspraken op deze wet heeft doen gelden, of [artikel 22][ref6] wordt gegeven binnen
      zeven maanden na de datum waarop de aanvraag bij de Raad is ingekomen. Indien de Raad ten gevolge van bijzondere
      omstandigheden niet binnen deze termijn kan beslissen, kan hij eenmaal met ten hoogste acht weken worden verlengd.
      Van de verlenging doet de Raad schriftelijk mededeling aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0002844#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0002844#Artikel21
      [ref6]: https://wetten.overheid.nl/BWBR0002844#Artikel22
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002844
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002844
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0002844
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
  - number: '32.4'
    text: |-
      De beschikking op een aanvraag krachtens [artikel 7, eerste lid, onder ][ref1], voorzover de aanvrager reeds
      op grond van [artikel 22][ref2] als vervolgde is erkend, [artikel 7, eerste lid, onder ][ref3], voor zover
      de overledene aanspraken op deze wet heeft doen gelden of de [artikelen 20][ref4] en [21][ref5], voor zover
      de aanvrager reeds eerder aanspraken op deze wet heeft doen gelden, wordt gegeven binnen dertien weken na de
      datum waarop de aanvraag bij de Raad of de Sociale verzekeringsbank is ingekomen. Indien de Raad of de Sociale
      verzekeringsbank ten gevolge van bijzondere omstandigheden niet binnen deze termijn kan beslissen, kan hij
      eenmaal met ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad of de Sociale verzekeringsbank
      schriftelijk mededeling aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0002844#Artikel20
      [ref5]: https://wetten.overheid.nl/BWBR0002844#Artikel21
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '22'
        hoofdstuk: II
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '7'
        hoofdstuk: II
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0002844
        artikel: '20'
        hoofdstuk: II
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0002844
        artikel: '21'
        hoofdstuk: II
        paragraaf: '4'
  - number: '32.5'
    text: |-
      Met betrekking tot een aanvraag, bedoeld in het vierde lid, die wordt ingediend terwijl een aanvraag, bedoeld
      in het derde lid, nog in behandeling is geldt, in afwijking van het vierde lid, de termijn die resteert voor
      de beschikking op de aanvraag, bedoeld in het derde lid, tenzij de resterende termijn korter is dan de termijn,
      bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32
  - number: 32a.1
    text: |-
      Indien de Raad vier weken voor het verstrijken van de verlengde termijn, bedoeld in [artikel 32, derde lid][ref1],
      onvoldoende gegevens aanwezig acht om tot een beoordeling van de aanvraag te komen en dientengevolge niet in staat
      is een beschikking te geven, stelt hij de aanvrager gedurende die vier weken in de gelegenheid zijn zienswijze naar
      voren te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel32
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '32'
        hoofdstuk: IV
  - number: 32a.2
    text: |-
      [Artikel 4:9 van de Algemene wet bestuursrecht][ref1] is op het horen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 32a.3
    text: Indien de aanvrager zijn zienswijze mondeling naar voren brengt, wordt een verslag gemaakt.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32a
  - number: 32b.1
    text: |-
      Indien de aanvrager kennis wenst te nemen van gegevens welke mede tot een beschikking van de Raad of de Sociale
      verzekeringsbank kunnen leiden dan wel hebben geleid, worden deze hem op zijn verzoek door de Raad of de Sociale
      verzekeringsbank verstrekt.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32b
  - number: 32b.2
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de vergoeding welke verschuldigd is,
      indien afschrift wordt verstrekt van de op de beschikking betrekking hebbende bescheiden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel32b
  - number: '33.1'
    text: |-
      De uitkering, vergoeding of tegemoetkoming wordt zo spoedig mogelijk, doch uiterlijk binnen dertien weken na de
      toekenning, vastgesteld en betaald.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel33
  - number: '33.2'
    text: |-
      Indien de door belanghebbende verstrekte gegevens en bescheiden onvoldoende zijn voor het vaststellen van het
      bedrag van de uitkering, vergoeding of tegemoetkoming, verzoekt de Sociale verzekeringsbank de belanghebbende deze
      gegevens en bescheiden alsnog te verstrekken. De periode van dertien weken, bedoeld in het eerste lid, wordt in
      zodanig geval opgeschort met ingang van de dag waarop de Sociale verzekeringsbank vorenbedoeld verzoek heeft gedaan
      tot de dag waarop de gegevens en bescheiden zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel33
  - number: '34.1'
    text: |-
      De uitkering bedoeld in[ § 3 van hoofdstuk II][ref1] gaat in:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002844
        hoofdstuk: II
        paragraaf: '3'
  - number: 34.1.a
    text: |-
      met ingang van de eerste dag van de maand waarin de aanvraag om een uitkering is ingediend, behoudens het bepaalde
      onder *b* van dit lid;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
  - number: 34.1.b
    text: |-
      voor de weduwe, de weduwnaar of de minderjarige volle wees, die, aansluitend aan het overlijden van de
      uitkeringsgerechtigde die een uitkering ingevolge deze wet genoot, aanspraak op een uitkering maakt, met ingang van
      de eerste dag van de derde maand volgend op die, waarin het overlijden heeft plaatsgehad.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
  - number: '34.2'
    text: |-
      De uitkering bedoeld in [§ 3 van hoofdstuk II][ref1] wordt beëindigd:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002844
        hoofdstuk: II
        paragraaf: '3'
  - number: 34.2.a
    text: |-
      bij overlijden van de uitkeringsgerechtigde die een echtgenoot of minderjarige kinderen achterlaat, met ingang van
      de eerste dag van de derde maand volgend op die, waarin het overlijden heeft plaatsgehad;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
  - number: 34.2.b
    text: |-
      bij overlijden van de uitkeringsgerechtigde die geen echtgenoot of minderjarige kinderen achterlaat, met ingang van
      de eerste dag van de maand volgend op die, waarin het overlijden heeft plaatsgehad;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
  - number: 34.2.c
    text: |-
      bij huwelijk, daaronder begrepen de in [artikel 1a, tweede lid, onder a][ref1], bedoelde situatie, van de weduwe of
      de weduwnaar, die niet als vervolgde recht heeft op een uitkering ingevolge deze wet, met ingang van de eerste dag
      van de maand, volgend op die waarin daarvan sprake is.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: 1a
        hoofdstuk: I
  - number: '34.3'
    text: |-
      De uitkering, bedoeld in [artikel 13][ref1], wordt beëindigd bij het bereiken van de leeftijd van 21 jaar,
      tenzij [artikel 13, onder ][ref2], van toepassing is, of bij het aangaan van een huwelijk door de volle wees vóór
      het bereiken van die leeftijd, daaronder mede begrepen de in [artikel 1a, tweede lid, onder a][ref3], bedoelde
      situatie, met ingang van de eerste dag van de maand, volgend op die, waarin de volle wees de leeftijd van 21 jaar
      bereikt heeft, onderscheidenlijk het huwelijk heeft plaatsgehad.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '13'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: 1a
        hoofdstuk: I
  - number: '35'
    text: |-
      De uitkering, die op grond van [artikel 34, tweede lid, onder ][ref1], werd beëindigd, wordt opnieuw verleend,
      indien het huwelijk is ontbonden. In dat geval gaat de uitkering in op de eerste dag van de maand waarin de
      hernieuwde aanvraag wordt ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel34
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '34'
        hoofdstuk: V
  - number: '37.1'
    text: |-
      De uitkeringsgerechtigde, die is veroordeeld tot een vrijheidsstraf van drie maanden, tot plaatsing in een
      Rijkswerkinrichting, tot plaatsing in een tuchtschool voor drie maanden, of tot enige zwaardere straf, of op
      bevel van de rechter ter beschikking van de Regering is gesteld, mist over de tijd gedurende welke hij zijn straf
      ondergaat of van Regeringswege in zijn opvoeding wordt voorzien, of gedurende welke hij zich door de vlucht aan de
      tenuitvoerlegging van het vonnis onttrekt, het genot van uitkering.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel37
  - number: '37.2'
    text: |-
      De Sociale verzekeringsbank is bevoegd het uitkeringsbedrag over die tijd geheel of ten dele aan of ten behoeve van
      de echtgenoot of minderjarige kinderen van de uitkeringsgerechtigde te doen uitbetalen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel37
  - number: '37.3'
    text: |-
      De Sociale verzekeringsbank is tevens bevoegd om, voor zover van de bevoegdheid in het tweede lid bedoeld,
      geen gebruik is gemaakt, de uitkeringsgerechtigde, die al of niet voorwaardelijk uit de gevangenis, uit de
      Rijkswerkinrichting of uit de tuchtschool is ontslagen, of wiens opvoeding van Regeringswege is geëindigd, in het
      genot te stellen van een uitkering, ten bedrage van ten hoogste de helft van het niet uitgekeerde bedrag, tot een
      maximum van de helft van het jaarlijkse bedrag van de uitkering.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel37
  - number: '38'
    text: |-
      Van alle rechten op grond van het bij of krachtens deze wet bepaalde wordt terstond vervallen verklaard de
      vervolgde of diens nabestaande die:
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel38
  - number: 38.a
    text: |-
      van Nederlandse nationaliteit zijnde, zonder Onze toestemming zich in vreemde krijgsdienst of vreemde burgerlijke
      overheidsdienst begeeft;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel38
  - number: 38.b
    text: |-
      niet van Nederlandse nationaliteit zijnde, zich in vreemde krijgsdienst of vreemde burgerlijke overheidsdienst
      bevindt of begeeft bij een mogendheid, die met Nederland in oorlog is, ook al is die mogendheid zijn eigen
      vaderland.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel38
  - number: '39.1'
    text: |-
      De belanghebbende is verplicht desgevraagd aan de Raad de inlichtingen te verstrekken die voor het vaststellen of
      bestendigen van het recht op een uitkering, vergoeding of tegemoetkoming, alsmede voor de erkenning noodzakelijk
      zijn.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel39
  - number: '39.2'
    text: |-
      Indien de aanvrager niet voldoet aan het bepaalde in het eerste lid, kan de Raad de aanvraag afwijzen dan wel de
      eerder gegeven beschikking in het nadeel van betrokkene herzien.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel39
  - number: 39a.1
    text: |-
      De belanghebbende is verplicht desgevraagd aan de Sociale verzekeringsbank die gegevens te verstrekken, welke voor
      de uitvoering van de beschikkingen van die Raad noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel39a
  - number: 39a.2
    text: |-
      Zolang de belanghebbende niet voldoet aan het bepaalde in het eerste lid, wordt de beschikking niet uitgevoerd of
      wordt de uitvoering ervan geschorst. Hiervan doet de Sociale verzekeringsbank mededeling aan de belanghebbende en
      aan het orgaan dat het in [artikel 31][ref1] bedoelde rapport heeft opgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel31
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '31'
        hoofdstuk: IV
  - number: 39a.3
    text: |-
      Indien de belanghebbende eerst na twee jaar, nadat het recht op een uitkering, een vergoeding of een tegemoetkoming
      is vastgesteld, de in het eerste lid bedoelde gegevens verstrekt, beslist de Sociale verzekeringsbank of, gelet op
      alle omstandigheden, de in de beschikking genoemde ingangsdatum kan worden gehandhaafd. Zo nodig stelt de Sociale
      verzekeringsbank, in afwijking van het bepaalde in [artikel 34, eerste lid][ref1], dan wel in afwijking van het
      bepaalde in de algemene maatregel van bestuur, bedoeld in [artikel 21a, eerste lid][ref2], een nieuwe ingangsdatum
      vast.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel21a
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel39a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '34'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0002844
        artikel: 21a
        hoofdstuk: II
        paragraaf: '4'
  - number: 39a.4
    text: |-
      Indien de belanghebbende eerst na twee jaar, nadat de uitvoering van de beschikking werd geschorst, de in
      het eerste lid bedoelde gegevens verstrekt, beslist de Sociale verzekeringsbank, rekening houdend met alle
      omstandigheden, of en in hoeverre de uitvoering van zijn beschikking, voor zover deze betrekking heeft op de
      periode van schorsing, alsnog kan plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel39a
  - number: '40'
    text: |-
      De uitkeringsgerechtigde, diens wettelijke vertegenwoordiger en de persoon aan wie de uitkering, de vergoeding of
      de tegemoetkoming wordt uitbetaald, zijn verplicht onverwijld aan de Sociale verzekeringsbank mededeling te doen
      van elke verandering dan wel te verwachten verandering, en van feiten en omstandigheden, die tot intrekking of
      verlaging van de uitkering, de vergoeding of tegemoetkoming aanleiding kunnen geven.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel40
  - number: '41.1'
    text: |-
      Alle ambtenaren, tot afgifte van uittreksels uit registers van de burgerlijke stand bevoegd, zijn verplicht aan de
      Raad of de Sociale verzekeringsbank de door deze gevraagde uittreksels uit de registers kosteloos toe te zenden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel41
  - number: '41.2'
    text: |-
      De gemeentebesturen zijn verplicht aan de Raad of de Sociale verzekeringsbank de door deze gevraagde inlichtingen
      uit de basisadministratie persoonsgegevens kosteloos toe te zenden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel41
  - number: '42.1'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen van
      het bezwaarschrift dertien weken, indien de belanghebbende in het buitenland gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '42.2'
    text: |-
      Het in het vorige lid bedoelde bezwaarschrift wordt, in afwijking van
      [artikel 6:4 van de Algemene wet bestuursrecht][ref1], ingediend bij het hoofd van de Nederlandse diplomatieke
      dan wel consulaire vertegenwoordiging in wiens ambtsgebied of ressort de aanvrager gevestigd is, tenzij de Sociale
      verzekeringsbank in het desbetreffende land een eigen vertegenwoordiging heeft. Deze zendt het bezwaarschrift toe
      aan de Raad of de Sociale verzekeringsbank en voegt daaraan de gegevens toe, die van belang zijn voor de beslissing
      op het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '43.1'
    text: |-
      [Artikel 32b][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel32b
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: 32b
        hoofdstuk: IV
  - number: '43.2'
    text: |-
      In afwijking van [artikel 7:10, eerste, derde en vierde lid, van de Algemene wet bestuursrecht][ref1] beslist de
      Raad of de Sociale verzekeringsbank binnen dertien weken gerekend vanaf de dag na die waarop de termijn voor het
      indienen van het bezwaarschrift is verstreken. Ingeval van bijzondere omstandigheden kan deze termijn eenmaal met
      ten hoogste vier weken worden verlengd. Van de verlenging doet de Raad of de Sociale verzekeringsbank schriftelijk
      mededeling aan de belanghebbende.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '43.3'
    text: |-
      Indien de belanghebbende in het buitenland gevestigd is, worden de termijnen, bedoeld in het tweede lid, ieder met
      acht weken verlengd.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel43
  - number: '44.1'
    text: Tegen een besluit op grond van deze wet kan een belanghebbende beroep instellen bij de Centrale Raad van Beroep.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel44
  - number: '44.2'
    text: |-
      In afwijking van [artikel 6:7 van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het indienen
      van een beroepschrift dertien weken, indien de belanghebbende in het buitenland is gevestigd. In afwijking
      van [artikel 6:4 van de Algemene wet bestuursrecht][ref2] wordt ingeval een belanghebbende in het buitenland
      is gevestigd, het beroepschrift ingediend bij het hoofd van de Nederlandse diplomatieke dan wel consulaire
      vertegenwoordiging in wiens ambtsgebied of ressort hij gevestigd is, tenzij de Sociale verzekeringsbank in het
      desbetreffende land een eigen vertegenwoordiging heeft, in welk geval het beroepschrift aldaar wordt ingediend.
      De instantie, waar het beroepschrift op grond van de vorige volzin moet worden ingediend, zendt het toe aan
      de Centrale Raad van Beroep en voegt daaraan de gegevens toe die van belang zijn voor de beslissing op het
      beroepschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '6'
  - number: '44.3'
    text: Het griffierecht bedraagt € 35.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel44
  - number: '55.1'
    text: |-
      In het belang van een goede uitvoering van deze wet kunnen bij of krachtens algemene maatregel van bestuur nadere
      regelen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel55
  - number: '55.2'
    text: |-
      De krachtens het eerste lid vastgestelde algemene maatregel van bestuur wordt aan beide Kamers der Staten-Generaal
      overgelegd. De maatregel treedt niet in werking dan nadat 30 dagen na de overlegging zijn verstreken en gedurende
      die termijn niet door of namens een der Kamers of door ten minste een vijfde van het grondwettelijk aantal leden
      van een der Kamers de wens is te kennen gegeven dat het in die maatregel geregelde onderwerp bij de wet wordt
      geregeld. Alsdan wordt een daartoe strekkend wetsvoorstel zo spoedig mogelijk ingediend.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel55
  - number: '56.1'
    text: |-
      De uitkering, de toeslagen, bedoeld in de [artikelen 10, derde lid][ref1], [15][ref2] en [17][ref3], de vergoeding
      en de tegemoetkoming zijn niet vatbaar voor vervreemding of verpanding.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel17
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '15'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0002844
        artikel: '17'
        hoofdstuk: II
        paragraaf: '3'
  - number: '56.2'
    text: |-
      De toeslag, bedoeld in [artikel 10, derde lid][ref1], de vergoeding en de tegemoetkoming, alsmede de op grond
      van onderdeel *a* van [artikel 34, tweede lid][ref2], na overlijden doorlopende uitkering zijn niet vatbaar voor
      beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel34
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '10'
        hoofdstuk: II
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '34'
        hoofdstuk: V
  - number: '56.3'
    text: |-
      Volmacht tot ontvangst van de uitkering, vergoeding of tegemoetkoming, onder welke vorm of welke benaming ook
      verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel56
  - number: '56.4'
    text: Elk beding, strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel56
  - number: '57.1'
    text: |-
      De uitkeringsgerechtigde is gehouden aanspraken op wettelijke voorzieningen geldend te maken, welke kunnen leiden
      tot een vermindering van de aanspraken op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel57
  - number: '57.2'
    text: |-
      Indien de uitkeringsgerechtigde niet voldoet aan het bepaalde in het eerste lid kan bij de vaststelling van de
      uitkering, vergoeding en tegemoetkoming rekening worden gehouden met vorenbedoelde aanspraken.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel57
  - number: '58'
    text: |-
      De vervolgde is gehouden medewerking te verlenen aan een medisch onderzoek, indien de Raad of de Sociale
      verzekeringsbank zulks nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel58
  - number: '59.1'
    text: |-
      De uitkering wordt, met uitzondering van de op grond van [artikel 8][ref1] vastgestelde grondslag, opnieuw
      vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 59.1.a
    text: wanneer de uitkeringsgerechtigde of zijn echtgenoot de 65-jarige leeftijd bereikt;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: 59.1.b
    text: |-
      wanneer de uitkeringsgerechtigde in het huwelijk treedt of zijn huwelijk wordt beëindigd door echtscheiding of
      overlijden van zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: 59.1.c
    text: wanneer de uitkeringsgerechtigde duurzaam gescheiden van zijn echtgenoot gaat leven;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: 59.1.d
    text: wanneer een kind of pleegkind van de uitkeringsgerechtigde meerderjarig wordt;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: 59.1.e
    text: |-
      wanneer toepassing wordt gegeven aan [artikel 14, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel14
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '14'
        hoofdstuk: II
        paragraaf: '3'
  - number: 59.1.f
    text: wanneer er sprake is van bedrijfsbeëindiging door de uitkeringsgerechtigde of zijn echtgenoot;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: 59.1.g
    text: wanneer de uitkeringsgerechtigde aanspraak maakt op de betaling uit een nieuwe bron van inkomsten, of
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: 59.1.h
    text: |-
      wanneer de uitkeringsgerechtigde geen aanspraak meer kan maken op de betaling uit een bron van inkomsten, tenzij
      hij het vervallen van die aanspraak heeft bewerkstelligd.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: '59.2'
    text: |-
      Het eerste lid, onder g en h, is van overeenkomstige toepassing op de inkomsten van de echtgenoot van de
      uitkeringsgerechtigde, voor zover die inkomsten de hoogte van de uitkering mede bepalen.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: '59.3'
    text: |-
      De beschikking, bedoeld in het eerste en tweede lid, wordt genomen binnen 13 weken nadat de noodzakelijke gegevens
      ter kennis van de Sociale verzekeringsbank zijn gebracht.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: '59.4'
    text: |-
      Hetgeen als gevolg van een beschikking als bedoeld in het eerste of tweede lid te veel dan wel te weinig is
      uitbetaald, wordt door de Sociale verzekeringsbank teruggevorderd of verrekend dan wel nabetaald. De terugvordering
      kan in door de Sociale verzekeringsbank te bepalen termijnen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59
  - number: 59a.1
    text: |-
      Op aanvraag van de uitkeringsgerechtigde wordt de uitkering, met uitzondering van de op grond van [artikel 8][ref1]
      vastgestelde grondslag, opnieuw vastgesteld:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel8
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '8'
        hoofdstuk: II
        paragraaf: '2'
  - number: 59a.1.a
    text: |-
      indien de vast te stellen uitkering ten minste 1% van de op de datum van deze aanvraag geldende grondslag hoger is
      dan de laatst vastgestelde of aangepaste uitkering, mits dit niet uitsluitend het gevolg is van de koersomrekening
      van inkomsten die door de uitkeringsgerechtigde of zijn echtgenoot worden ontvangen, of;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59a
  - number: 59a.1.b
    text: |-
      indien het vermogen van de uitkeringsgerechtigde en zijn echtgenoot door oorzaken gelegen in factoren waarop
      de uitkeringsgerechtigde geen invloed heeft kunnen uitoefenen, zodanig is verminderd, dat het niet herzien
      van de laatst vastgestelde inkomsten uit vermogen, bedoeld in [artikel 19, eerste lid, onder c][ref1], tot een
      klaarblijkelijke hardheid zou leiden. Bij de beoordeling hiervan wordt rekening gehouden met de totale vermogens-
      en inkomstenpositie van de uitkeringsgerechtigde en zijn echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel19
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '19'
        hoofdstuk: II
        paragraaf: '3'
  - number: 59a.2
    text: |-
      Indien toepassing is gegeven aan het eerste lid gaat de opnieuw vastgestelde uitkering in op de eerste dag van de
      maand waarin de aanvraag is ingediend.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59a
  - number: 59a.3
    text: |-
      Op een beschikking, voortvloeiende uit de toepassing van het eerste lid, is [artikel 32, vierde lid][ref1], van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel32
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '32'
        hoofdstuk: IV
  - number: '60'
    text: |-
      Eenmalige uitkeringen op grond van wettelijke voorzieningen, verstrekt voor hetzelfde doel als waarvoor reeds een
      vergoeding of tegemoetkoming ingevolge deze wet werd verleend, worden eveneens op de uitkeringen ingevolge deze wet
      in mindering gebracht. Het teveel betaalde wordt teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel60
  - number: 60a
    text: |-
      Indien aan de uitkeringsgerechtigde, in afwachting van de toekenning van een uitkering, vergoeding of
      tegemoetkoming ingevolge deze wet, door burgemeester en wethouders een uitkering is verleend krachtens de
      [Wet werk en bijstand][ref1], wordt de uitkering, vergoeding of tegemoetkoming ingevolge deze wet verminderd met
      de kosten van bijstand, welke voor overeenkomstige voorzieningen zijn gemaakt over dezelfde periode waarover de
      uitkering, vergoeding of tegemoetkoming wordt verleend, terwijl de som welke in mindering wordt gebracht, wordt
      uitbetaald aan de betrokken gemeente.


      [ref1]: https://wetten.overheid.nl/BWBR0015703
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel60a
    references:
      - id: ref1
        bwb_id: BWBR0015703
  - number: '61.1'
    text: |-
      Een beschikking van de Raad of de Sociale verzekeringsbank kan door hem in het nadeel van de bij die beschikking
      betrokkene worden herzien op grond van gebleken onjuistheid van aan die beschikking ten grondslag gelegde feiten,
      dan wel op grond van gegevens die niet bekend waren ten tijde van het nemen van die beschikking, en die, zo zij wel
      bekend waren geweest, tot een andersluidende beschikking zouden hebben geleid. Indien deze herziening zou leiden
      tot intrekking van het recht op uitkering, wordt de herzieningsbeschikking eerst gegeven nadat de betrokkene door
      de Sociale verzekeringsbank is gehoord.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel61
  - number: '61.2'
    text: |-
      De Raad of de Sociale verzekeringsbank is bevoegd, op daartoe door of vanwege de belanghebbende gedane aanvraag,
      een door de Raad of de Sociale verzekeringsbank of door de Centrale Raad van Beroep gegeven beschikking dan wel
      uitspraak in het voordeel van de bij die beschikking dan wel uitspraak betrokkene te herzien.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel61
  - number: '61.3'
    text: |-
      Op een beschikking, voortvloeiende uit de toepassing van het tweede lid, is [hoofdstuk IV][ref1] van
      overeenkomstige toepassing, met uitzondering van [artikel 32, derde en vierde lid][ref2], en [artikel 32][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002844#HoofdstukIV
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002844#Artikel32a
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0002844
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0002844
        artikel: '32'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0002844
        artikel: 32a
        hoofdstuk: IV
  - number: 61a
    text: |-
      Onverminderd het bepaalde in de [artikelen 59][ref1] en [59a][ref2] wordt, indien een ingevolge deze wet gegeven
      beschikking in het nadeel van de belanghebbende wordt herzien, hetgeen reeds was uitbetaald niet teruggevorderd of
      verrekend, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0002844#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0002844#Artikel59a
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel61a
    references:
      - id: ref1
        bwb_id: BWBR0002844
        artikel: '59'
        hoofdstuk: VIII
      - id: ref2
        bwb_id: BWBR0002844
        artikel: 59a
        hoofdstuk: VIII
  - number: 61a.a
    text: |-
      in de herzieningsbeschikking is uitgesproken dat de gebleken onjuistheid van de aan de oorspronkelijke beschikking
      ten grondslag gelegde feiten was te wijten aan zijn opzet dan wel grove nalatigheid;
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel61a
  - number: 61a.b
    text: |-
      in verband met de voorbereiding van de herzieningsbeschikking de tenuitvoerlegging daarvan niet kan geschieden in
      dezelfde maand waarin de feiten, welke aanleiding hebben gegeven tot het herzien van de beschikking, zich hebben
      voorgedaan.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel61a
  - number: '62'
    text: Deze wet kan worden aangehaald als Wet uitkeringen vervolgingsslachtoffers 1940-1945.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel62
  - number: '63'
    text: Deze wet treedt in werking met ingang van 1 januari 1973.
    url: https://wetten.overheid.nl/BWBR0002844/2011-01-01#Artikel63
