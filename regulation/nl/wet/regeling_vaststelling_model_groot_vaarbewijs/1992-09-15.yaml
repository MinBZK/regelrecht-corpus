$id: regeling_vaststelling_model_groot_vaarbewijs
regulatory_layer: WET
publication_date: '2008-05-15'
valid_from: '1992-09-15'
bwb_id: BWBR0005635
url: https://wetten.overheid.nl/BWBR0005635/1992-09-15
preamble:
  text: |-
    Gelet op artikel 18, vierde lid, van de Binnenschepenwet (Stb. 1981, 678);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0005635/1992-09-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Het groot vaarbewijs voor de vaart op de rivieren, kanalen en meren, dan wel voor de vaart op alle binnenwateren,
      wordt vastgesteld volgens het model opgenomen in de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0005635/1992-09-15#Artikel1
  - number: '2'
    text: |-
      De regeling van de Minister van Verkeer en Waterstaat van 26 maart 1984, PJ/S 22137, Stcrt. 65, houdende
      vaststelling modellen vaarbewijzen, wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005635/1992-09-15#Artikel2
  - number: '3'
    text: Deze regeling treedt in werking met ingang van 15 september 1992.
    url: https://wetten.overheid.nl/BWBR0005635/1992-09-15#Artikel3
  - number: '4'
    text: |-
      Deze regeling kan worden aangehaald als Regeling vaststelling model groot vaarbewijs.

      Deze regeling zal met de bijlage in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0005635/1992-09-15#Artikel4
