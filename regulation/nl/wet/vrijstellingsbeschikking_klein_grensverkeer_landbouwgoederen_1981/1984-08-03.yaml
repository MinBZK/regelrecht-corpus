$id: vrijstellingsbeschikking_klein_grensverkeer_landbouwgoederen_1981
regulatory_layer: WET
publication_date: '2008-04-15'
valid_from: '1984-08-03'
bwb_id: BWBR0002417
url: https://wetten.overheid.nl/BWBR0002417/1984-08-03
preamble:
  text: |-
    Gelet op artikel 13 van het In- en uitvoerbesluit landbouwgoederen 1980, op artikel 5 van de Invoerbeschikking
    landen 1981 c.q. het Invoerbesluit landen 1981, op artikel 4 van de In- en uitvoerbeschikking koffie 1980 c.q. het
    In- en uitvoerbesluit koffie 1980 en op artikel 5 van de In- en uitvoerwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0002417/1984-08-03#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van het bepaalde bij deze beschikking wordt verstaan onder ambtenaar: een ambtenaar der
      invoerrechten en accijnzen, en wordt met landbouwgoederen gelijkgesteld: koffie.
    url: https://wetten.overheid.nl/BWBR0002417/1984-08-03#Artikel1
  - number: '3'
    text: |-
      Aan de in het vorige artikel bedoelde vrijstellingen is het voorschrift verbonden, dat de betrokken invoer of
      uitvoer in overeenstemming moet zijn met de desbetreffende communautaire voorschriften en dat de ter zake van die
      invoer of uitvoer door de ambtenaar gegeven aanwijzingen zijn opgevolgd.
    url: https://wetten.overheid.nl/BWBR0002417/1984-08-03#Artikel3
  - number: '4'
    text: |-
      Indien en voorzover een verleende voorwaardelijke vrijstelling wegens misbruik of niet-nakoming van de gestelde
      voorwaarden is vervallen ofwel daarvan is afgezien geldt voor de berekening van de heffing als dag van invoer met
      betrekking tot de ingevoerde goederen:

      de dag die als zodanig is vastgesteld met toepassing van het bepaalde in artikel 7 van de In- en uitvoerbeschikking
      landbouwgoederen 1981, dan wel - indien sedert die dag het tarief van de ter zake van de invoer van het ingevoerd
      goed vastgestelde heffing is gewijzigd - de dag waarop voor het goed het hoogste tarief van kracht was dat heeft
      gegolden sedert de dag van invoer.
    url: https://wetten.overheid.nl/BWBR0002417/1984-08-03#Artikel4
  - number: '5'
    text: |-
      Bij gebreke van desbetreffende communautaire voorschriften wordt aan de vrijstelling het voorschrift verbonden
      dat de betreffende invoer of uitvoer in overeenstemming moet zijn met een naar het oordeel van de ambtenaar
      verantwoorde uitvoering van het bij deze beschikking bepaalde.
    url: https://wetten.overheid.nl/BWBR0002417/1984-08-03#Artikel5
  - number: '6'
    text: 'Deze beschikking kan worden aangehaald als: Vrijstellingsbeschikking klein grensverkeer landbouwgoederen 1981.'
    url: https://wetten.overheid.nl/BWBR0002417/1984-08-03#Artikel6
