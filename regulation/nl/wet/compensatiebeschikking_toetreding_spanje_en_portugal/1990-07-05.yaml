  - number: '6'
    text: |-
      Op het bepaalde in [artikel 2, tweede lid][ref1], betreffende de subsidie ter zake van de invoer zijn de artikelen
      112, 114 en 115 van de beschikking van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003928#Artikel2
    url: https://wetten.overheid.nl/BWBR0003928/1990-07-05#Artikel6
    references:
