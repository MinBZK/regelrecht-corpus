preamble:
  text: |-
    Overwegende dat in de artikelen 53, 72, 118, 123, 213, 240, 72, 275 en 304 van de Akte betreffende de
    toetredingsvoorwaarden voor het Koninkrijk Spanje en de Portugese Republiek en de aanpassing van de Verdragen (Pb.
    E.G. nr. L 302, van 5 november 1985) onder meer regelen zijn gesteld volgens welke in het onderlinge handelsverkeer
    de verschillen in het prijspeil van de betreffende produkten worden gecompenseerd;

    Overwegende dat mitsdien een regeling ter uitvoering moet worden getroffen;

    Gelet op de artikelen 5, 6, 8, 10, 11 en 13 van het In- en uitvoerbesluit Landbouwgoederen 1980 (Stb. 758);

    Mede gelet op artikel 11 van de In- en uitvoerwet (Stb. 1962, 295);

    In overeenstemming met de staatssecretaris van Financiën;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0003928/1990-07-05#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze beschikking worden voor zover van belang de begripsomschrijvingen overgenomen
      van [artikel 1][ref1] van de In- en uitvoerbeschikking Landbouwgoederen 1981 (Stcrt. 50), hierna te noemen:
      ‘beschikking’ en wordt voorts verstaan onder:



            a

              *Toetredingsakte:*


              Akte betreffende de toetredingsvoorwaarden voor het Koninkrijk Spanje en de Portugese Republiek en de
      aanpassing van de Verdragen (Pb. E.G. nr. L 302, van 5 november 1985);



            b

              *uitvoeringsverordeningen:*


              door de Raad of de Commissie van de Europese Gemeenschappen vastgestelde verordeningen of beschikkingen,
      houdende uitvoering van de Toetredingsakte;



            c

              *goederen:*


              produkten, die vallen onder een basisverordening.


      [ref1]: https://wetten.overheid.nl/BWBR0003928#Artikel1
    url: https://wetten.overheid.nl/BWBR0003928/1990-07-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003928
        artikel: '1'
  - number: '2'
    text: |-
      1 Indien ter zake van de invoer uit Spanje of uit Portugal van goederen, ter uitvoering van de artikelen 72, 118,
      123, 240, 272, 275 of 304 van de Toetredingsakte een compenserend bedrag is vastgesteld, wordt dat bedrag als
      heffing opgelegd.

      2 Indien ter zake van de invoer uit Spanje of uit Portugal van goederen, waarvoor ter uitvoering van de artikelen
      53, eerste lid, of 213, eerste lid, van de Toetredingsakte een compenserend bedrag is vastgesteld, dat, ingevolge
      die artikelen, afhankelijk van het in te voeren goed, wordt geheven danwel toegekend, wordt dat bedrag als heffing
      opgelegd, onderscheidenlijk, op aanvraag, als subsidie toegekend.

      3 Het bedrag van de in het eerste en tweede lid bedoelde heffing, onderscheidenlijk subsidie, is gelijk aan het in
      Nederlandse courant uitgedrukte bedrag of samenstel van bedragen, hetwelk in de gevallen, naar de onderscheidingen
      en volgens de regelen aangegeven in de Toetredingsakte en de uitvoeringsverordeningen, bij de invoer van dat goed
      als compenserend bedrag moet worden opgelegd, onderscheidenlijk toegekend.

      4 Het bepaalde in de vorige leden laat onverlet het verschuldigd zijn van een heffing ter zake van de invoer van
      goederen waarvoor de Commissie ter uitvoering van [Verordening (EEG) nr. 1677/85](31985R1677) (Pb. EG. nr. L 164)
      een compenserend bedrag heeft vastgesteld, tenzij daarvan ingevolge communautaire bepalingen kan worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0003928/1990-07-05#Artikel2
  - number: '3'
    text: |-
      1 Indien ter zake van de uitvoer naar Spanje of naar Portugal van goederen, ter uitvoering van de artikelen 72,
      118, 123, 240, 272, 275 of 304 van de Toetredingsakte een compenserend bedrag is vastgesteld, wordt dit bedrag, op
      verzoek, als restitutie toegekend.

      2 Indien ter zake van de uitvoer naar Spanje of naar Portugal van goederen, waarvoor ter uitvoering van de
      artikelen 53, eerste lid, of 213, eerste lid, van de Toetredingsakte, een compenserend bedrag is vastgesteld, dat,
      ingevolge die artikelen, afhankelijk van het uit te voeren goed, wordt geheven danwel toegekend, wordt dat bedrag
      als heffing opgelegd, onderscheidenlijk, op aanvraag, als restitutie verleend.

      3 Het bedrag van de in het eerste en tweede lid bedoelde restitutie, onderscheidenlijk heffing, is gelijk
      aan het in Nederlandse courant uitgedrukte bedrag of samenstel van bedragen, hetwelk in die gevallen, naar de
      onderscheidingen en volgens de regelen aangegeven in de Toetredingsakte en de uitvoeringsverordeningen, bij
      de uitvoer van het goed volgens zijn bestemming als compenserend bedrag kan worden verleend, onderscheidenlijk
      geheven.

      4 Het bepaalde in het eerste lid laat onverlet het verlenen van een restitutie ter zake van de uitvoer van goederen
      waarvoor de Commissie ter uitvoering van [Verordening (EEG) nr. 1677/85](31985R1677) een compenserend bedrag heeft
      vastgesteld, tenzij daartoe ingevolge communautaire bepalingen geen aanleiding bestaat.
    url: https://wetten.overheid.nl/BWBR0003928/1990-07-05#Artikel3
  - number: '4'
    text: |-
      1 Een restitutie, als bedoeld in [artikel 3, eerste en tweede lid][ref1], wordt slechts uitbetaald na overlegging
      van de navolgende documenten:

      a. het formulier L, als bedoeld in artikel 19 van de beschikking, als bedoeld in artikel 19 van de Beschikking;

      b. een copie van het vervoerdocument; en

      c. een bewijs dat de produkten in consumptie zijn gebracht in Spanje of Portugal overeenkomstig het bepaalde
      in artikel 18, eerste lid, van [Verordening (EEG) nr. 3665/87](31987R3665) (Pb. EG. nr. L 351) danwel, in geval
      artikel 15 van [Verordening (EEG) nr. 3154/85](31985R3154) toegepast wordt, een controle-exemplaar T nr. 5.

      2 Indien ernstige twijfel bestaat omtrent de werkelijke bestemming van het produkt, is artikel 5 van [Verordening
      (EEG) nr. 3665/87](31987R3665) van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003928#Artikel3
    url: https://wetten.overheid.nl/BWBR0003928/1990-07-05#Artikel4
    references:
