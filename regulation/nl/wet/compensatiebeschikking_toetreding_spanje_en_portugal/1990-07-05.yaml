        artikel: '3'
  - number: '5'
    text: |-
      1 Op het bepaalde in de [artikelen 2, eerste en tweede lid][ref1], en [3, tweede lid][ref2], betreffende de
      heffing ter zake van de invoer, zijn de hoofdstukken I en II, paragraaf I, met uitzondering van artikel 15,
      derde lid, alsmede hoofdstuk IV van de beschikking, met uitzondering van artikel 60, van toepassing, dan wel van
      overeenkomstige toepassing.

      2 Op het bepaalde in [artikel 3, eerste en tweede lid][ref3], betreffende de restitutie ter zake van de uitvoer,
      zijn de hoofdstukken I en II, paragraaf 2, onderdeel A, alsmede hoofdstuk V, paragraaf I, met uitzonderingen van de
      artikelen 78 en 79 van de beschikking van toepassing dan wel van overeenkomstige toepassing.

      3 In voorkomend geval wordt een voorfixatiecertificaat afgegeven overeenkomstig het bepaalde in hoofdstuk III,
      paragraaf 2 van de beschikking, alsmede in de ingevolge de vorige leden van dit artikel van toepassing danwel van
      overeenkomstige toepassing verklaarde artikelen van de beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0003928#Artikel2
