        artikel: '2'
  - number: '7'
    text: |-
      1 Op het bepaalde in [artikel 3, tweede lid][ref1], betreffende de heffing ter zake van de uitvoer zijn de
      artikelen 27 tot en met 30, 103, 104, 105, 107, eerste lid, 108, 109 en 111, van de beschikking, van toepassing,
      danwel van overeenkomstige toepassing, met dien verstande evenwel:

      a. dat de zekerheid bij het produktschap wordt gesteld;

      b. dat de heffing door het produktschap wordt opgelegd en

      c. dat de heffing bij het produktschap wordt betaald.

      2 Indien bij uitvoer een heffing is verschuldigd, wordt al naar gelang het geval in het document voor het
      communautair douanevervoer in het vak ‘omschrijving der goederen’ één van de volgende vermeldingen aangebracht:

        - compenserend bedrag toetreding geheven – EEG10 – Spanje danwel
        - compenserend bedrag toetreding geheven – EEG10 – Portugal.


