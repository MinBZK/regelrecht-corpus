articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

      a. ambtenaar: de ambtenaar van politie, bedoeld in [artikel 2, onderdelen a, c, en d, van de Politiewet 2012][ref1],
      die rechtens is uitgerust met een of meer geweldsmiddelen;

      b. geweldsmiddel: geweldsmiddel als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____________________________________________;

      c. LSOP: het Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en kenniscentrum, genoemd in
      [artikel 2 van de Wet op het LSOP en het politieonderwijs][ref3] ;

      d. de toets geweldsbeheersing: de door het LSOP, samengestelde toets ter beoordeling van de kennis op het gebied
      van geweldsbeheersing volgens de competentiegerichte eindtermen van de initiële opleidingen voor politieambtenaren,
      genoemd in [artikel 14 van de Wet op het LSOP en het politieonderwijs][ref4], of de door het LSOP samengestelde
      toets ter beoordeling van kennis op het gebied van geweldsbeheersing volgens de competentiegerichte eindtermen van
      een door de betrokken ambtenaar gevolgde postinitiële opleiding;

      e. de toets aanhoudings- en zelfverdedigingsvaardigheden: de door het LSOP samengestelde toets ter beoordeling van
      aanhoudings- en zelfverdedigingsvaardigheden volgens de competentiegerichte eindtermen van de initiële opleidingen
      voor politieambtenaren, genoemd in [artikel 14 van de Wet op het LSOP en het politieonderwijs][ref5], of de
      door het LSOP samengestelde toets ter beoordeling van aanhoudings- en zelfverdedigingsvaardigheden volgens de
      competentiegerichte eindtermen van een door de betrokken ambtenaar gevolgde postinitiële opleiding;

      f. de toets schietvaardigheid: de door het LSOP samengestelde toets ter beoordeling van de schietvaardigheid
      volgens de competentiegerichte eindtermen van de initiële opleidingen voor politieambtenaren, genoemd in
      [artikel 14 van de Wet op het LSOP en het politieonderwijs][ref6], of de door het LSOP samengestelde toets ter
      beoordeling van de schietvaardigheid volgens de competentiegerichte eindtermen van een door de betrokken ambtenaar
      gevolgde postinitiële opleiding;

      g. toetser: de ambtenaar van politie die heeft voldaan aan de competentiegerichte eindtermen van de daartoe
      strekkende opleiding en is gecertificeerd door het LSOP om de toets geweldsbeheersing, de toets aanhoudings- en
      zelfverdedigingsvaardigheden, of de toets schietvaardigheid af te nemen.

      h. bevoegd gezag: bevoegd gezag, als bedoeld in
      [artikel 1, eerste lid, onderdeel l, van het Besluit algemene rechtspositie politie][ref7].


