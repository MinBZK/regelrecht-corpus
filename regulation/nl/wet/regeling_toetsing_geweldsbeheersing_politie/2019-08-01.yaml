  - number: '3'
    text: |-
      1 Het bevoegd gezag biedt de ambtenaar ten minste 32 uren de gelegenheid tot het deelnemen aan de toetsing en
      de training ter voorbereiding daarop. Tevens ziet het bevoegd gezag er op toe dat de ambtenaar zich voorbereidt
      en het trainingsaanbod opvolgt. De ambtenaar bereidt zich voor op de af te leggen toetsen en volgt daarvoor het
      trainingsaanbod op.

      2 De toets geweldsbeheersing, de toets aanhoudings- en zelfverdedigingsvaardigheden en de toets schietvaardigheid
      worden afgenomen door een door het bevoegd gezag daartoe aangewezen toetser.
    url: https://wetten.overheid.nl/BWBR0013200/2019-08-01#Artikel3
  - number: '4'
    text: |-
      Indien een ambtenaar een van de omschreven toetsen niet of niet met voldoende resultaat heeft afgelegd, doet de
      toetser hiervan onverwijld mededeling aan het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0013200/2019-08-01#Artikel4
  - number: '5'
    text: |-
      1 Het bevoegd gezag draagt zorg voor registratie van de deelname aan en de resultaten van de in [artikel 2][ref1]
      bedoelde toetsen.

      2 De korpschef publiceert jaarlijks in het in [artikel 36 van de Politiewet 2012][ref2] bedoelde jaarverslag een
      overzicht van de stand van zaken betreffende de in [artikel 2][ref3] bedoelde toetsen.

      3 De korpschef verstrekt jaarlijks in het in [artikel 36 van de Politiewet 2012][ref4] bedoelde beleidsplan een
      overzicht betreffende de deelname aan en de resultaten van de in [artikel 2][ref5] bedoelde toetsen alsmede het
      gevoerde beleid hieromtrent.


