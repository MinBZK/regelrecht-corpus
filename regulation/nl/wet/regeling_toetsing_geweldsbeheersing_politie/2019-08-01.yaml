  - number: '2'
    text: |-
      1 Een ambtenaar is steeds voor de duur van een kalenderjaar
      geoefend in het gebruik van een geweldsmiddel als bedoeld in
      __REF000___________________________________________________________________________________________________________
      _______________________, indien hij in het daaraan voorafgaande kalenderjaar met voldoende resultaat heeft
      afgelegd:

      1º. de toets geweldsbeheersing, en

      2º. de toets aanhoudings- en zelfverdedigingsvaardigheden.

      2 Een ambtenaar is steeds voor de duur van een kalenderhalfjaar geoefend in het gebruik van een vuurwapen,
      indien hij, naast de in het eerste lid bedoelde toetsen, in het daaraan voorafgaande kalenderhalfjaar de toets
      schietvaardigheid met voldoende resultaat heeft afgelegd.

      3 In afwijking van het in het tweede lid bepaalde is een ambtenaar geoefend in het gebruik van het vuurwapen als
      bedoeld in [artikel 2, eerste lid onder b, van het Aanwijzingsbesluit bewapening en uitrusting politie][ref2], voor
      een periode die het lopende en het daarop volgende kalenderhalfjaar omvat, zodra hij de toets schietvaardigheid
      voor dat wapen met voldoende resultaat heeft afgelegd.

      4 Een ambtenaar die is belast met de uitoefening van specialistische of leidinggevende politietaken en daartoe een
      postinitiële opleiding heeft gevolgd, dient, alvorens geoefend te zijn in het gebruik van de bij de uitoefening
      van die taken behorende geweldsmiddelen, de in het eerste tot en met derde lid bedoelde toetsen tevens volgens de
      competentiegerichte eindtermen van de postinitiële opleiding met voldoende resultaat af te leggen. Indien het LSOP
      een dergelijke toets niet heeft samengesteld, dient de in de eerste volzin bedoelde ambtenaar de toetsen volgens de
      competentiegerichte eindtermen van de initiële opleiding met voldoende resultaat af te leggen.

      5 Onverminderd het eerste tot en met vierde lid, wordt de ambtenaar van wie een geweldsmiddel op grond van het
      zesde lid is ingenomen, voor de resterende duur van het lopende kalenderjaar of kalenderhalfjaar, geacht wederom
      geoefend te zijn in het gebruik van dat geweldsmiddel, vanaf het moment dat hij de toetsen die hij niet of niet met
      voldoende resultaat had afgelegd, alsnog met voldoende resultaat aflegt.

      6 Het bevoegd gezag draagt er voor zorg dat de ambtenaar slechts over een geweldsmiddel beschikt, anders dan voor
      het vervoer en het gebruik ervan voor het volgen van onderwijs, indien hij geoefend is in het gebruik van dat
      geweldsmiddel. De ambtenaar die op de laatste dag van een kalenderjaar de in het eerste, tweede en vierde lid
      bedoelde toetsen niet met voldoende resultaat heeft afgelegd, wordt het geweldsmiddel in het gebruik waarvan hij
      dientengevolge niet langer is geoefend, door het bevoegd gezag ontnomen.

      7 De ambtenaar die de in het derde lid bedoelde toets niet met voldoende resultaat aflegt, wordt het geweldsmiddel
      in het gebruik waarvan hij dientengevolge niet langer geoefend is, door het bevoegd gezag terstond ontnomen.

      8 Met ingang van 1 januari 2014 zal de in het zevende lid bedoelde directe inname zich tevens uitstrekken tot de
      geweldsmiddelen genoemd in het zesde lid.


