---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_laden_en_lossen_zeeschepen
regulatory_layer: WET
publication_date: '2007-05-24'
valid_from: '2010-12-31'
bwb_id: BWBR0017718
url: https://wetten.overheid.nl/BWBR0017718/2010-12-31
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, gelet op richtlijn nr. 2001/96/EG van het Europees Parlement en de
    Raad van de Europese Unie van 4 december 2001 tot vaststelling van geharmoniseerde voorschriften en procedures voor
    veilig laden en lossen van bulkschepen (PbEG 2002, L 13), noodzakelijk is regels te stellen ten aanzien van het
    veilig laden en lossen van zeeschepen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt, tenzij daarin anders is bepaald, verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.b
    text: |-
      SOLAS-verdrag: het op 1 november 1974 te Londen totstandgekomen Verdrag voor de beveiliging van mensenlevens op zee
      (Trb. 1976, 157) en de bij dat verdrag behorende bindende protocollen, aanhangsels en bijlagen;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.c
    text: |-
      laden- en lossenrichtlijn of -verordening: richtlijn, onderscheidenlijk verordening, van het Europees Parlement
      en de Raad van de Europese Unie die berust op artikel 80, tweede lid, van het EG-verdrag, betrekking heeft op de
      zeevaart en regels stelt over procedures, taken en verantwoordelijkheden voor, tijdens en na het laden of lossen
      van een schip, of over technische eisen, informatieverschaffing of de afhandeling van schade in verband met het
      laden of lossen;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.d
    text: |-
      gedelegeerde richtlijn of verordening: richtlijn of verordening van de Commissie van de Europese Gemeenschappen die
      berust op een laden- en lossenrichtlijn of -verordening;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.e
    text: |-
      vaste bulklading: vaste stortlading als bedoeld in voorschrift XII/1 van het SOLAS-verdrag, met uitzondering van
      graan;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.f
    text: |-
      bulkschip: een schip als bedoeld in voorschrift IX/1 van het SOLAS-verdrag en resolutie 6 van de SOLAS-Conferentie
      van 1997, waaronder wordt verstaan:
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.f.1°
    text: |-
      een schip geconstrueerd met enkel dek, top-zijtanks en hopper-zijtanks in de laadruimen, dat voornamelijk bestemd
      is voor het vervoer van vaste lading in bulk;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.f.2°
    text: |-
      een ertsschip: een zeeschip met enkel dek, met twee langsschotten en een dubbele bodem in het gehele
      ladinggedeelte, dat bestemd is om uitsluitend in de middenruimten ertsladingen te vervoeren; of
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.f.3°
    text: een «combination carrier» als bedoeld in voorschrift II-2/3 van het SOLAS-verdrag;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.g
    text: |-
      terminal: een vaste, drijvende of mobiele voorziening die is uitgerust voor het laden of lossen van vaste
      bulklading in of uit bulkschepen en die daarvoor wordt gebruikt;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.h
    text: |-
      terminalexploitant: de eigenaar van een terminal, of een andere organisatie of persoon aan wie de eigenaar
      de verantwoordelijkheid voor de laad- en losverrichtingen in de terminal voor een bepaald bulkschip heeft
      overgedragen;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.i
    text: |-
      kapitein: de gezagvoerder van een bulkschip of de scheepsofficier die door de gezagvoerder voor laad- of
      losverrichtingen is aangewezen;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.j
    text: 'ISO: Internationale Organisatie voor Standaardisatie;'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.k
    text: |-
      laad- of losplan: het plan, bedoeld in [artikel 9, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel9
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 1.1.l
    text: |-
      toezichthouder: degene die, tenzij anders is bepaald, krachtens [artikel 15, eerste of tweede lid][ref1], is
      aangewezen, voorzover hij een taak uitoefent waarmee hij is belast;


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel15
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '15'
        hoofdstuk: '3'
  - number: 1.1.m
    text: |-
      klassenbureau: rechtspersoon die gemachtigd is om namens de vlaggenstaat onderzoeken te verrichten ten behoeve van
      de certificering van een schip;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.n
    text: 'inspecteur-generaal: inspecteur-generaal van de Inspectie Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: 1.1.o
    text: |-
      ambtenaren van de Inspectie Verkeer en Waterstaat: de door Onze Minister aangewezen ambtenaren van de Inspectie
      Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt, tenzij daarin anders is bepaald, onder graan mede verstaan:
      tarwe, mais, haver, rogge, gerst, rijst, peulvruchten, zaden en hun bewerkte vormen, waarvan het gedrag gelijk is
      aan dat van graan in onbewerkte staat.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel1
  - number: '2.1'
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel2
  - number: 2.1.a
    text: zeegaande bulkschepen die een terminal aandoen voor het laden of lossen van vaste bulklading;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel2
  - number: 2.1.b
    text: terminals die worden aangedaan door bulkschepen waarop deze wet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel2
  - number: '2.2'
    text: |-
      Deze wet is niet van toepassing op voorzieningen die slechts in uitzonderlijke omstandigheden gebruikt worden voor
      het laden of lossen van vaste bulklading in of uit bulkschepen, noch wanneer voor het laden of lossen uitsluitend
      gebruik wordt gemaakt van de uitrusting van het bulkschip.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel2
  - number: '3.1'
    text: |-
      De terminalexploitant controleert of een bulkschip dat een door hem geëxploiteerde terminal aandoet, operationeel
      geschikt is voor het laden of lossen van vaste bulklading.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel3
  - number: '3.2'
    text: |-
      Bij ministeriële regeling wordt vastgesteld welke aspecten van een bulkschip ter voldoening aan het eerste lid
      moeten worden gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel3
  - number: '4.1'
    text: 'De terminalexploitant zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel4
  - number: 4.1.a
    text: |-
      voor het laden of lossen van vaste bulklading alleen bulkschepen in de terminal worden toegelaten die veilig kunnen
      afmeren, rekening houdend met bij ministeriële regeling vast te stellen factoren die in dat verband relevant zijn;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel4
  - number: 4.1.b
    text: |-
      handleidingen worden opgesteld en ter beschikking worden gesteld van de kapiteins van bulkschepen die de terminal
      aandoen om vaste bulklading te laden of te lossen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel4
  - number: '4.2'
    text: |-
      Bij ministeriële regeling wordt bepaald welke informatie in de handleiding, bedoeld in het eerste lid, onderdeel b,
      moet worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel4
  - number: '5.1'
    text: |-
      De terminalexploitant zorgt ervoor dat in de terminal een gecertificeerd kwaliteitszorgsysteem wordt ontwikkeld en
      toegepast, dat voldoet aan bij ministeriële regeling aan te wijzen ISO-normen of daaraan gelijkwaardige normen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel5
  - number: '5.2'
    text: |-
      Het kwaliteitszorgsysteem wordt onderhouden overeenkomstig de normen, bedoeld in het eerste lid, en periodiek aan
      controles onderworpen overeenkomstig bij ministeriële regeling aan te wijzen ISO-normen of daaraan gelijkwaardige
      normen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel5
  - number: '5.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de verplichtingen, bedoeld in het
      eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel5
  - number: '6'
    text: |-
      De terminalexploitant stelt een of meer personen aan als terminalvertegenwoordigers, die belast zijn met de
      voorbereiding, uitvoering en voltooiing van laad- of losverrichtingen in de terminal ten behoeve van een bepaald
      bulkschip.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel6
  - number: '7.1'
    text: |-
      De kapitein verstrekt de terminalvertegenwoordiger ruim voor het vermoedelijke aankomsttijdstip van het bulkschip
      bij de terminal de bij ministeriële regeling vast te stellen informatie.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel7
  - number: '7.2'
    text: |-
      De terminalvertegenwoordiger verstrekt, nadat hij de eerste aankondiging van het vermoedelijke aankomsttijdstip van
      het bulkschip heeft ontvangen, de kapitein de bij ministeriële regeling vat te stellen informatie.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel7
  - number: '8.1'
    text: 'De kapitein:'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel8
  - number: 8.1.a
    text: is te allen tijde verantwoordelijk voor het veilig laden of lossen van het onder zijn gezag staande bulkschip;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel8
  - number: 8.1.b
    text: |-
      verricht alvorens met laden of lossen wordt begonnen en tijdens het laden of lossen de bij ministeriële regeling
      vast te stellen taken;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel8
  - number: 8.1.c
    text: |-
      zorgt ervoor dat hij de bij ministeriële regeling vast te stellen gegevens heeft ontvangen alvorens vaste
      bulklading wordt geladen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel8
  - number: '8.2'
    text: 'De terminalvertegenwoordiger :'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel8
  - number: 8.2.a
    text: |-
      verricht alvorens met laden of lossen wordt begonnen en tijdens het laden of lossen de bij ministeriële regeling
      vast te stellen taken;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel8
  - number: 8.2.b
    text: |-
      gaat na of de kapitein in een zo vroeg mogelijk stadium beschikt over de bij ministeriële regeling vast te stellen
      gegevens.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel8
  - number: '9.1'
    text: |-
      De kapitein en de terminalvertegenwoordiger bereiken, alvorens vaste bulklading wordt geladen of gelost,
      overeenstemming over een laad- of losplan dat zeker stelt dat de voor dat bulkschip vastgestelde maximale
      langskrachten en buigende momenten op het bulkschip niet zullen worden overschreden gedurende het laden of lossen.
      Het laad- of losplan gaat vergezeld van bij ministeriële regeling vast te stellen controlelijsten.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel9
  - number: '9.2'
    text: |-
      Over iedere verandering in het laad- of losplan die volgens de kapitein of de terminalvertegenwoordiger de
      veiligheid van het bulkschip of de bemanning kan aantasten, wordt in de vorm van een gewijzigd plan overeenstemming
      bereikt.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel9
  - number: '9.3'
    text: |-
      Het laad- of losplan, inclusief veranderingen van het plan, en de controlelijsten, bedoeld in het eerste lid,
      worden door de kapitein en de terminalvertegenwoordiger ondertekend ter bevestiging van hun overeenstemming.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel9
  - number: '9.4'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld over de bij de totstandkoming of wijziging van het laad- of
      losplan en de controlelijsten, bedoeld in het eerste lid, te gebruiken modellen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel9
  - number: '10.1'
    text: |-
      De kapitein en de terminalvertegenwoordiger voeren de laad- of losverrichtingen uit volgens het overeengekomen
      laad- of losplan.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel10
  - number: '10.2'
    text: |-
      De terminalvertegenwoordiger houdt zich bij het laden of lossen van vaste bulklading aan de in het laad- of losplan
      aangegeven volgorde van de ruimen, de te laden of te lossen hoeveelheden en het tempo waarmee wordt geladen of
      gelost.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel10
  - number: '10.3'
    text: |-
      Zonder voorafgaand overleg met en schriftelijke instemming van de kapitein wijkt de terminalvertegenwoordiger niet
      af van het overeengekomen laad- of losplan.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel10
  - number: '10.4'
    text: |-
      De kapitein en de terminalvertegenwoordiger brengen een doeltreffende communicatie tot stand en houden deze
      ononderbroken in stand, om op verzoeken om informatie over het verloop van het laden of lossen te kunnen reageren
      en om te verzekeren dat prompt gevolg wordt gegeven aan een bevel van de kapitein of de terminalvertegenwoordiger
      om de laad- of losverrichtingen stop te zetten.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel10
  - number: '11.1'
    text: |-
      Na het laden of lossen stellen de kapitein en de terminalvertegenwoordiger een schriftelijke verklaring op, waarin
      zij bevestigen dat het laden of lossen volgens het laad- of losplan, met inbegrip van eventuele overeengekomen
      wijzigingen, is verlopen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel11
  - number: '11.2'
    text: Bij ministeriële regeling wordt bepaald welke overige informatie in de schriftelijke verklaring wordt opgenomen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel11
  - number: '12'
    text: |-
      Het laad- of losplan en eventuele naderhand overeengekomen wijzigingen worden door de kapitein en de
      terminalvertegenwoordiger gedurende zes maanden bewaard.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel12
  - number: '13'
    text: |-
      De terminalvertegenwoordiger stelt de toezichthouder, bedoeld in [artikel 15, eerste lid][ref1], en de kapitein
      terstond in kennis van door hem aan boord van een bulkschip vastgestelde tekortkomingen waardoor de veiligheid van
      het laden of lossen van vaste bulklading in gevaar kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel15
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '15'
        hoofdstuk: '3'
  - number: '14.1'
    text: |-
      Wanneer de structuur of de uitrusting van het bulkschip tijdens het laden of lossen wordt beschadigd, wordt deze
      schade door de terminalvertegenwoordiger aan de kapitein gemeld en zo nodig gerepareerd.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel14
  - number: '14.2'
    text: |-
      Wanneer de schade, bedoeld in het eerste lid, voor de stevigheid van de constructie, voor de waterdichtheid van
      de romp of voor de essentiële technische installaties van het bulkschip nadelige gevolgen kan hebben, worden de
      bevoegde autoriteiten van de desbetreffende vlaggenstaat of het betrokken klassenbureau, en de toezichthouder,
      bedoeld in [artikel 15, eerste lid][ref1], daarvan door de kapitein of de terminalvertegenwoordiger op de hoogte
      gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel15
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '15'
        hoofdstuk: '3'
  - number: '14.3'
    text: |-
      Zodra de terminalvertegenwoordiger of de kapitein aan de ingevolge het tweede lid op hem rustende verplichting
      heeft voldaan, is die verplichting voor de ander opgeheven.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel14
  - number: '14.4'
    text: |-
      De toezichthouder, bedoeld in [artikel 15, eerste lid][ref1], beslist of de schade, bedoeld in het tweede
      lid, onverwijld moet worden gerepareerd, waarbij hij rekening houdt met het eventuele advies van de bevoegde
      autoriteiten van de vlaggenstaat of het betrokken klassenbureau, en met dat van de kapitein.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel15
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '15'
        hoofdstuk: '3'
  - number: '15.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de ambtenaren van de
      Inspectie Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel15
  - number: '15.2'
    text: |-
      Met het toezicht op de naleving, bedoeld in het eerste lid, zijn tevens belast de bij besluit van Onze Minister
      voor bepaalde taken aangewezen ambtenaren van andere diensttakken. Indien de aanwijzing ambtenaren betreft,
      ressorterende onder een ander ministerie dan dat van Onze Minister, wordt het desbetreffende besluit genomen in
      overeenstemming met Onze Minister wie het mede aangaat.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel15
  - number: '15.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze waarop de in het eerste of
      tweede lid bedoelde ambtenaren hun taak uitoefenen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel15
  - number: '15.4'
    text: Van een besluit als bedoeld in het eerste of tweede lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel15
  - number: '16.1'
    text: |-
      De toezichthouder zet het laden of lossen van vaste bulklading stop indien hij duidelijke aanwijzingen heeft dat de
      veiligheid van het bulkschip of de bemanning door de laad- of loshandelingen in gevaar zou worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel16
  - number: '16.2'
    text: |-
      De toezichthouder kan het laden of lossen van vaste bulklading stopzetten ter handhaving van het verbod, bedoeld in
      [artikel 19, eerste lid][ref1], een verbod als bedoeld in [artikel 24, vierde lid][ref2], of indien een aanwijzing
      als bedoeld in [artikel 22][ref3] niet wordt opgevolgd.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0017718#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0017718#Artikel22
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '19'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0017718
        artikel: '24'
        hoofdstuk: '6'
      - id: ref3
        bwb_id: BWBR0017718
        artikel: '22'
        hoofdstuk: '6'
  - number: '16.3'
    text: |-
      De toezichthouder heft de stopzetting van het laden of lossen op grond van het eerste lid op indien de veiligheid
      van het bulkschip of de bemanning door de laad- of loshandelingen niet meer in gevaar zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel16
  - number: '16.4'
    text: |-
      [Afdeling 5.3.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.1
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.1
  - number: '17.1'
    text: |-
      De toezichthouder, bedoeld in [artikel 15, eerste lid][ref1], kan een bulkschip aanhouden, indien schade die
      tijdens het laden of lossen van vaste bulklading is ontstaan de veiligheid van het bulkschip of de bemanning in
      gevaar zou kunnen brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel15
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '15'
        hoofdstuk: '3'
  - number: '17.2'
    text: |-
      De toezichthouder heft de aanhouding op indien de schade zodanig is gerepareerd dat de veiligheid van het bulkschip
      of de bemanning niet meer in gevaar zal worden gebracht.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel17
  - number: '17.3'
    text: |-
      [Afdeling 5.3.1 van de Algemene wet bestuursrecht][ref1] is niet van toepassing op de in het eerste lid bedoelde
      bevoegdheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.3.1
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 5.3.1
  - number: '18.1'
    text: |-
      In afwijking van [artikel 3:41, eerste lid, van de Algemene wet bestuursrecht](onbekend) geschiedt de bekendmaking
      van het besluit tot stopzetting van het laden of lossen of aanhouding voorzover dat gericht is tot het bulkschip,
      door uitreiking van dit besluit aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel18
  - number: '18.2'
    text: |-
      Indien uitreiking aan de kapitein niet mogelijk is, geschiedt de bekendmaking van een besluit als bedoeld in het
      eerste lid door uitreiking van dit besluit aan de naar het oordeel van de toezichthouder daarvoor meest gerede
      persoon, zo spoedig mogelijk gevolgd door kennisgeving aan de kapitein.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel18
  - number: '18.3'
    text: |-
      De toezichthouder stelt de administratie van de desbetreffende vlaggenstaat of de consul, of bij zijn afwezigheid,
      de dichtstbijzijnde diplomatieke vertegenwoordiger, onmiddellijk schriftelijk van de stopzetting van het laden of
      lossen of de aanhouding en de omstandigheden die tot de stopzetting of aanhouding hebben geleid, in kennis.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel18
  - number: '18.4'
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op besluiten tot opheffing van de stopzetting van
      het laden of lossen of tot opheffing van de aanhouding.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel18
  - number: '19.1'
    text: |-
      Het is de terminalexploitant verboden om bulkschepen in zijn terminal te laden of te lossen zonder aan de bij of
      krachtens de [artikelen 3 tot en met 6][ref1] op hem rustende verplichtingen te voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel3
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '19.2'
    text: |-
      Indien het laden of lossen is stopgezet, is het de kapitein, de terminalvertegenwoordiger en -exploitant verboden
      om het laden of lossen voort te zetten, dan wel het laden of lossen, zolang de stopzetting niet is opgeheven, te
      hervatten.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel19
  - number: '19.3'
    text: |-
      Het is de kapitein van een aangehouden bulkschip verboden dat schip te doen verplaatsen zonder voorafgaande
      toestemming van de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel19
  - number: '19.4'
    text: Het is de kapitein van een aangehouden bulkschip verboden om met dat schip uit te varen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel19
  - number: '19.5'
    text: |-
      Zonder voorafgaande toestemming als bedoeld in het derde lid, of zolang het bulkschip is aangehouden, weigeren alle
      betrokken ambtenaren en registerloodsen hun medewerking bij de uitklaring en de verplaatsing van het bulkschip.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel19
  - number: '20.1'
    text: Tegen besluiten van een toezichthouder kan iedere belanghebbende beroep instellen bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel20
  - number: '20.2'
    text: |-
      [Artikel 6:5, derde lid, van de Algemene wet bestuursrecht](onbekend) is niet van toepassing op beroepschriften in
      de Engelse taal.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel20
  - number: '21.1'
    text: |-
      Onze Minister verleent op aanvraag voor ten hoogste twaalf maanden ontheffing van de verplichting, bedoeld
      in [artikel 5][ref1] ten behoeve van een terminal die na 5 februari 2005 in werking wordt genomen, indien de
      terminalexploitant voldoende heeft aangetoond voornemens te zijn in die terminal een kwaliteitszorgsysteem als
      bedoeld in [artikel 5, eerste lid][ref2], in te voeren.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0017718#Artikel5
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0017718
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '21.2'
    text: |-
      In aanvulling op [artikel 4.2, eerste lid, van de Algemene wet bestuursrecht][ref1] kunnen bij ministeriële
      regeling regels worden gesteld met betrekking tot de aanvraagprocedure.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '22'
    text: |-
      De toezichthouder, bedoeld in [artikel 15, eerste lid][ref1], kan een aanwijzing geven aan de
      terminalvertegenwoordiger en de kapitein over de toepassing van de [artikelen 9 tot en met 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0017718#Artikel9
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '15'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0017718
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '23.1'
    text: |-
      De kosten die samenhangen met de behandeling van de aanvraag en de afgifte van de ontheffing, bedoeld in
      [artikel 21, eerste lid][ref1], of een ontheffing als bedoeld in [artikel 24, vijfde lid][ref2], alsmede duplicaten
      en gewaarmerkte afschriften van een ontheffing, worden ten laste gebracht van de aanvrager van de ontheffing.


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0017718#Artikel24
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '21'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0017718
        artikel: '24'
        hoofdstuk: '6'
  - number: '23.2'
    text: De tarieven ter vergoeding van de kosten worden bij ministeriële regeling vastgesteld.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel23
  - number: '23.3'
    text: |-
      In de regeling, bedoeld in het tweede lid, kan worden bepaald dat de vergoeding van kosten voorafgaand aan de
      behandeling van de aanvraag en de afgifte van de ontheffing, alsmede duplicaten en gewaarmerkte afschriften van de
      ontheffing, of in termijnen wordt betaald.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel23
  - number: '24.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ter implementatie van laden- en lossenrichtlijnen of
      ter uitvoering van bepalingen uit het SOLAS-verdrag die betrekking hebben op de zeevaart en regels stellen
      over procedures, taken en verantwoordelijkheden voor, tijdens en na het laden of lossen van een schip, of over
      technische eisen, informatieverschaffing of de afhandeling van schade in verband met het laden of lossen, regels
      worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel24
  - number: '24.2'
    text: |-
      Bij ministeriële regeling kunnen voor de goede uitvoering van laden- en lossenverordeningen en gedelegeerde
      verordeningen regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel24
  - number: '24.3'
    text: Bij ministeriële regeling kunnen ter implementatie van gedelegeerde richtlijnen regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel24
  - number: '24.4'
    text: |-
      Bij de regels, bedoeld in het eerste tot en met derde lid, kan worden bepaald dat het de terminalexploitant
      verboden is om schepen in zijn terminal te laden of te lossen zonder aan de bij of krachtens bepaalde artikelen
      van die algemene maatregel van bestuur of bij bepaalde artikelen van de regeling op hem rustende verplichtingen
      te voldoen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel24
  - number: '24.5'
    text: |-
      Bij de regels, bedoeld in het eerste tot en met derde lid, kan ter implementatie van laden- en lossenrichtlijnen,
      gedelegeerde richtlijnen, of ter uitvoering van bepalingen uit het SOLAS-verdrag als bedoeld in het eerste lid of
      voor de goede uitvoering van laden- en lossenverordeningen en gedelegeerde verordeningen worden bepaald dat Onze
      Minister ontheffing kan verlenen van de bij of krachtens die regels gestelde verboden en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel24
  - number: '24.6'
    text: |-
      Een ontheffing als bedoeld in het vijfde lid kan onder beperkingen worden verleend. Aan de ontheffing kunnen
      voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel24
  - number: '24.7'
    text: Een gedraging in strijd met de in het zesde lid bedoelde beperkingen en voorwaarden is verboden.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel24
  - number: '25'
    text: |-
      Een wijziging van het SOLAS-verdrag gaat voor de toepassing van deze wet gelden met ingang van de dag waarop de
      betrokken wijziging internationaal in werking treedt, tenzij bij ministerieel besluit, dat in de Staatscourant
      wordt bekendgemaakt, anders wordt bepaald.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel25
  - number: '26'
    text: |-
      Aan [artikel 5, eerste lid][ref1], wordt:


      [ref1]: https://wetten.overheid.nl/BWBR0017718#Artikel5
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0017718
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 26.a
    text: |-
      wat betreft de ontwikkeling en toepassing van het kwaliteitszorgsysteem uiterlijk met ingang van 5 februari 2005
      voldaan;
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel26
  - number: 26.b
    text: wat betreft de certificering van het kwaliteitszorgsysteem uiterlijk met ingang van 5 februari 2006 voldaan.
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel26
  - number: '28'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. In dat besluit wordt zo nodig
      toepassing gegeven aan [artikel 16 van de Tijdelijke referendumwet](onbekend).
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel28
  - number: '29'
    text: 'Deze wet wordt aangehaald als: Wet laden en lossen zeeschepen.'
    url: https://wetten.overheid.nl/BWBR0017718/2010-12-31#Artikel29
