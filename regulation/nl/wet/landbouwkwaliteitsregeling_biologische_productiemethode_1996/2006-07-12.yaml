preamble:
  text: |-
    Gelet op Verordening 207/93/EEG van de Commissie van de Europese Gemeenschappen van 29 januari 1993 tot
    vaststelling van de inhoud van bijlage VI bij Verordening (EEG) nr. 2092/91 van de Raad inzake de biologische
    produktiemethode en aanduidingen dienaangaande op landbouwprodukten en levensmiddelen en tot vaststelling van
    bepalingen voor de toepassing van artikel 5, lid 4, van die verordening (PbEG L 25) en de artikelen 2, 3, 4, 5, 7,
    en 10 van het Landbouwkwaliteitsbesluit biologische produktiemethode (Stb. 1992, 661);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

              besluit:

                `[Landbouwkwaliteitsbesluit biologische produktiemethode][ref1];



              controle-instelling:

                de in [artikel 7 van het besluit][ref2] bedoelde controle-instelling;



              de minister:

                de Minister van Landbouw, Natuurbeheer en Visserij;




                [verordening (EEG) nr. 2092/91](31991R2092):

                [verordening (EEG) nr. 2092/91](31991R2092) van de Raad van de Europese Gemeenschappen van 24 juni 1991
      inzake de biologische produktiemethode en aanduidingen dienaangaande op landbouwprodukten en levensmiddelen (PbEG
      L 198);




                [verordening (EEG) nr. 207/93](31993R0207):

                [verordening (EEG) nr. 207/93](31993R0207) van de Commissie van de Europese Gemeenschappen van 29
      januari 1993 tot vaststelling van de inhoud van bijlage VI bij [Verordening (EEG) nr. 2092/91](31991R2092) inzake
      de biologische produktiemethode en aanduidingen dienaangaande op landbouwprodukten en levensmiddelen en tot
      vaststelling van bepalingen voor de toepassing van artikel 5, lid 4, van die verordening (PbEG L 25);.



              producten:

                onverwerkte plantaardige landbouwproducten; voorts dieren en niet-verwerkte dierlijke producten voorzover
      daarvoor productievoorschriften en bijzondere controlebepalingen zijn opgenomen in de bijlagen I en III van
      [verordening (EEG) nr. 2092/91](31991R2092) alsmede verwerkte plantaardige landbouwproducten en verwerkte dierlijke
      producten bestemd voor menselijke consumptie die voornamelijk bereid zijn uit één of meer ingrediënten van
      plantaardige of dierlijke oorsprong;.



              codenummer:

                een ingevolge artikel 9, lid 6bis, van [verordening (EEG) nr. 2092/91](31991R2092) aan een controle-
      instelling toegekend codenummer;



              pluimvee:

                kippen, kalkoenen, eenden, ganzen en parelhoenders.


      [ref1]: https://wetten.overheid.nl/BWBR0005740
      [ref2]: https://wetten.overheid.nl/BWBR0005740#Artikel7
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005740
      - id: ref2
        bwb_id: BWBR0005740
        artikel: '7'
  - number: '1.2'
    text: |-
      Voor de toepassing van deze regeling wordt onder `bereiden' mede verstaan het verpakken of het wijzigen van de
      etikettering in verband met de aanduiding van de biologische productiemethode van verse, verduurzaamde of verwerkte
      producten.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel1
  - number: '2'
    text: |-
      Bij de verhandeling van of in de reclame voor producten mag alleen worden verwezen naar de biologische
      productiemethode indien: - is voldaan aan het bepaalde bij of krachtens [verordening (EEG) nr. 2092/91]
      (31991R2092);
        - bij de etikettering van producten welke zijn bereid na 1 januari 1997, de naam of het codenummer wordt vermeld
      van de controle-organisatie of
        - instantie die is belast met het toezicht op de naleving van het bepaalde bij of krachtens het besluit door de
      marktdeelnemer die de laatste fase van bereiden heeft uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel2
  - number: 2a
    text: |-
      Bij de verhandeling van jonge hennen mag alleen worden verwezen naar de biologische productiemethode indien de
      hennen zijn opgefokt met inachtneming van een biologische productiemethode met betrekking tot het opfokken van
      jonge hennen zoals vastgesteld door het bestuur van de Stichting Skal.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel2a
  - number: '3.1'
    text: |-
      De controle-instelling houdt een register bij van alle natuurlijke of rechtspersonen die bij haar zijn aangesloten,
      waarin de volgende gegevens zijn opgenomen: - naam en adres;
        - aard van de activiteiten, die de aangeslotene uitvoert;
        - lokatie waar de aangeslotene zijn activiteiten uitvoert, in het geval van voortbrenging van plantaardige
      en dierlijke producten alsmede het houden van één of meer dieren een kadastrale aanduiding van de betreffende
      percelen;
        - in het geval van voortbrenging van plantaardige en dierlijke producten alsmede het houden van één of meer
      dieren, de datum waarop de aangeslotene voor het laatst op de betrokken percelen bestrijdingsmiddelen, detergentia,
      meststoffen of bodemverbeteringsmiddelen heeft aangewend waarvan het gebruik niet in overeenstemming is met het
      bepaalde bij of krachtens het besluit.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel3
  - number: '3.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden door de aangeslotene verstrekt aan de controle-instelling op het
      moment dat hij te kennen geeft zich aan te willen sluiten.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel3
  - number: 3a
    text: |-
      [Artikel 4, eerste lid, van het Landbouwkwaliteitsbesluit biologische produktiemethode][ref1] is niet van
      toepassing ten aanzien van marktdeelnemers die producten waarop aanduidingen voorkomen die verwijzen naar de
      biologische productiemethode, direct aan de eindconsument of eindgebruiker verkopen mits zij deze producten niet
      produceren, bereiden of opslaan op een andere plaats dan het verkooppunt en mits zij deze producten niet invoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0005740#Artikel4
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0005740
        artikel: '4'
  - number: '4.1'
    text: |-
      De controle-instelling stelt een reglement vast omtrent het toezicht op de naleving door haar aangeslotenen van het
      bij of krachtens het besluit bepaalde.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel4
  - number: '4.2'
    text: |-
      Het reglement voorziet in elk geval in de onderwerpen, genoemd in artikel 9, zevende en negende lid, van
      [verordening (EEG) nr. 2092/91](31991R2092).
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel4
  - number: '5.1'
    text: |-
      De minister kan, op aanvraag, in de vorm van een ontheffing een machtiging als bedoeld in artikel 11, zesde lid,
      van [verordening (EEG) nr. 2092/91](31991R2092) verlenen.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel5
  - number: '5.2'
    text: |-
      De minister kan, op aanvraag, in de vorm van een ontheffing een machtiging als bedoeld in artikel 3, eerste lid,
      van [verordening (EEG) nr. 207/93](31993R0207) verlenen.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel5
  - number: '5.3'
    text: |-
      De minister kan, ter uitvoering van [verordening (EEG) nr. 2092/91](31991R2092), aan het verlenen van een
      ontheffing voorwaarden of beperkingen verbinden.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel5
  - number: 5a
    text: |-
      De controle-instelling kan, op aanvraag, in de vorm van een ontheffing een goedkeuring als bedoeld in artikel 6,
      derde lid, onderdeel a, of artikel 6bis, derde lid, van [verordening (EEG) nr. 2092/91](31991R2092) verlenen.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel5a
  - number: '6'
    text: |-
      Een besluit van de controle-instelling dat de in punt 1, van bijlage I, onderdeel A, bij [verordening (EEG) nr.
      2092/91](31991R2092) bedoelde omschakelingsperiode in een bepaald geval wordt verlengd, behoeft de goedkeuring van
      de minister.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel6
  - number: 6a.1
    text: |-
      Het aantal grootvee-eenheden, bedoeld in bijlage I, onderdeel B, punt 7.2, van [verordening (EEG) nr. 2092/91]
      (31991R2092), wordt vastgesteld door 170 kg stikstof per jaar per hectare cultuurgrond te delen door de omvang van
      de mestproductie per dier van de betreffende diercategorie per jaar uitgedrukt in kilogrammen stikstof. De omvang
      van de mestproductie per dier van de onderscheiden diercategorieën per jaar, uitgedrukt in kilogrammen stikstof, is
      opgenomen in de bijlage bij deze regeling.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel6a
  - number: 6a.2
    text: |-
      De periode waarin uitlopen leeg moeten blijven, bedoeld in bijlage I, onderdeel B, punt 8.4.6, van [verordening
      (EEG) nr. 2092/91](31991R2092), wordt gesteld op 60 dagen, telkens na het houden van een partij pluimvee.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel6a
  - number: '7'
    text: De Landbouwkwaliteitsregeling biologische produktiemethode wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na dagtekening van de Staatscourant waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel8
  - number: '9'
    text: |-
      Deze regeling wordt aangehaald als: [Landbouwkwaliteitsregeling biologische productiemethode 1996][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0008176
    url: https://wetten.overheid.nl/BWBR0008176/2006-07-12#Artikel9
