  - number: '19'
    text: |-
      Indien als gevolg van overheidsinterventie de omvang van een bedrijf is verkleind, waardoor een landbouwer over
      minder hectaren subsidiabele grond beschikt dan het aantal dat overeenstemt met de toeslagrechten die hij in
      het kader van artikel 41, derde lid, van verordening 73/2009 zou krijgen, of heeft gekregen, komt de betrokken
      landbouwer overeenkomstig artikel 18 van verordening 1120/2009 in aanmerking voor toewijzing van toeslagrechten uit
      de nationale reserve.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel19
  - number: '20'
    text: |-
      1 Voor betalingen op basis van toeslagrechten komen uitsluitend in aanmerking landbouwers die:

      a. hun toeslagrechten activeren als bedoeld in artikel 34, eerste lid, van verordening 73/2009 en daartoe
      subsidiabele hectaren aangeven, overeenkomstig artikel 35, eerste lid, van deze verordening, en

      b. deze subsidiabele hectaren tot hun beschikking hebben op 15 mei van enig jaar.

      2 Onverminderd het bepaalde in artikel 57, tweede lid, van verordening 1122/2009, worden toeslagrechten in een
      zodanige volgorde uitbetaald, dat het behoud van toeslagrechten zoveel mogelijk voorgaat op uitbetaling van
      toeslagrechten met de hoogste waarde.

      3 Onverminderd het bepaalde in artikel 57, derde lid, van verordening 1122/2009, vindt de betaling op basis van
      toeslagrechten, in afwijking van het tweede lid, op verzoek van de landbouwer plaats volgens een door hem bepaalde
      volgorde, welke hij uiterlijk op 15 mei kenbaar maakt.

      4 De minimumoppervlakte, bedoeld in artikel 13, negende lid, van verordening 1122/2009 bedraagt 0,01 ha.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel20
  - number: '21'
    text: |-
      1 In afwijking van [artikel 20][ref1] komen in aanmerking voor betalingen op basis van toeslagrechten, landbouwers
      die, zonder opgave van subsidiabele hectaren:

      a. beschikken over bijzondere toeslagrechten waarop artikel 44 van verordening 73/2009 van toepassing is;

      b. minimaal 50% van de tijdens de referentieperiode uitgeoefende landbouwactiviteit, uitgedrukt in GVE, handhaven;
      en

      c. uiterlijk op 15 mei een verzoek doen, overeenkomstig artikel 14, derde lid, van verordening 1120/2009, tot
      toepassing van de speciale voorwaarden.

      2 Ten bewijze van het voldoen aan de voorwaarden bedoeld in het eerste lid, onderdeel b, voorzover het schapen
      betreft, doet de landbouwer uiterlijk op 15 mei opgave op basis van zijn bedrijfsregister van het betrokken aantal
      dieren uitgedrukt in GVE.

      3 Aan het minimumpercentage bedoeld in het eerste lid, onderdeel b, wordt geacht te zijn voldaan indien het
      gemiddelde aantal GVE 50%, doch gedurende een periode van 6 maanden, in geen geval minder dan 25% is.

      4 Als bijzondere toeslagrechten als bedoeld in het eerste lid, onder a, worden overgedragen kan de verkrijger
      slechts in aanmerking komen voor het bepaalde in het eerste lid, indien:

      a. de bijzondere toeslagrechten in 2009, 2010 of 2011 worden overgedragen, en

      b. alle bijzondere toeslagrechten van de vervreemder worden overgedragen.

      5 In zoverre in afwijking van het eerste lid, onderdeel b, wordt de te handhaven landbouwactiviteit, uitgedrukt in
      GVE, voor landbouwers die toeslagrechten krijgen toegewezen op basis van [artikel 16][ref2], berekend volgens de
      formule, opgenomen in [bijlage 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0019131
