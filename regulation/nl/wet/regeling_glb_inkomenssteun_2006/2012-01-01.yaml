  - number: '37'
    text: |-
      1 Op aanvraag stelt de minister de steun vast.

      2 De aanvraag, bedoeld in het eerste lid, gaat in ieder geval vergezeld van de documenten waaruit blijkt dat de
      landbouwer het investeringsplan heeft gerealiseerd en wat daarvoor de gemaakte kosten zijn.

      3 Bij de steunvaststelling moet ten genoegen van de minister gebleken zijn dat de landbouwer heeft voldaan aan alle
      voorwaarden die bij de steunverlening zijn gesteld.

      4 De minister vermindert het bedrag van de steun dat bij vaststelling wordt betaald met de steun die de aanvrager
      heeft ontvangen op grond van [artikel 36, eerste lid][ref1].

      5 De minister stelt de steun ambtshalve vast indien er geen aanvraag is ingediend na afloop van de in
      [artikel 55d, tweede lid, onderdeel c][ref2], gestelde relevante termijn.


