  - number: 21a
    text: |-
      1 Heide en natuurlijk grasland worden als subsidiabele hectare als bedoeld in artikel 34, tweede lid, van
      verordening 73/2009 in aanmerking genomen indien deze percelen gedurende het betreffende premiejaar door gemiddeld
      minimaal 0,15 GVE per hectare worden begraasd door schapen, geiten of runderen.

      2 Overeenkomstig artikel 34, vierde en vijfde lid, van verordening 1122/2009 worden met bomen beplante oppervlakten
      binnen een perceel landbouwgrond, met een plantdichtheid van meer dan 50 bomen per hectare, niet voor steun in
      aanmerking genomen.

      3 Onder hakhout met een korte omlooptijd als bedoeld in artikel 34, tweede lid, onder a, van verordening 73/2009
      wordt verstaan woudbomen met omlooptijd van maximaal 10 jaar en bestemd voor de energieproductie.

      4 Indien naar het oordeel van de minister blijkt dat een perceel waarvoor steun is aangevraagd geheel of ten
      dele kennelijk niet voor de uitvoering van de landbouw wordt gebruikt of beschikbaar gehouden, dan komt de
      desbetreffende oppervlakte niet in aanmerking als subsidiabele landbouwgrond, bedoeld in artikel 34, eerste lid,
      van verordening 73/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel21a
  - number: 21b
    text: |-
      Voor de toepassing van artikel 9 van verordening 1120/2009 wordt landbouwgrond die niet meer dan 90 dagen per
      jaar voor niet-landbouwactiviteiten wordt gebruikt, aangemerkt als overwegend voor landbouwdoeleinden gebruikte
      landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel21b
  - number: '22'
    text: |-
      1 Overdracht van toeslagrechten geschiedt met inachtneming van artikel 43 van verordening 73/2009 en de artikelen
      26 en 27 van verordening 1120/2009.

      2 Onverminderd de in verordening 73/2009, 1120/2009, 1122/2009 en 1121/2009 aan de betaling op basis van
      toeslagrechten gestelde voorwaarden kan de aanspraak op betaling in enig premiejaar op basis van de overgedragen
      toeslagrechten slechts worden gemaakt indien de cedent de minister uiterlijk op 31 maart van het desbetreffende
      premiejaar in kennis stelt van de overdracht.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel22
  - number: '23'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *open teelten:* open teelten van de sectoren akkerbouw, vollegrondsgroententeelt, bollenteelt, sierteelt,
      fruitteelt en boomkwekerij;

      b. *premie:* premie, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];

      c. *schade-expert:* deskundige die de gedragscode van expertiseorganisaties van het Verbond van Verzekeraars of een
      daarmee gelijk te stellen gedragscode in acht neemt;

      d. *verzekeraar:* verzekeraar, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref2];

      e. *verzekering:* verzekering als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref3];

      f. *verzekeringspolis:* bewijs van verzekering tussen landbouwer en verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020368#Artikel11
