  - number: '66'
    text: |-
      1 Bij de constatering van de oppervlakte van percelen landbouwgrond worden voor sloten die zijn gelegen tussen
      percelen landbouwgrond en die niet breder zijn dan 4 meter overeenkomstig door de Europese Commissie aanvaarde
      meetmethoden gerekend tot de volledig gebruikte oppervlakte van de desbetreffende percelen, waarbij de breedte van
      de sloot voor de helft aan elk van de aan weerskanten van de sloot gelegen percelen wordt toegerekend.

      2 Bij de constatering van de oppervlakte van percelen landbouwgrond worden sloten die zijn gelegen in een perceel
      landbouwgrond en die niet breder zijn dan 2 meter overeenkomstig door de Europese Commissie aanvaarde meetmethoden
      gerekend tot de volledig gebruikte oppervlakte van het desbetreffende perceel.

      3 De minimumoppervlakte, bedoeld in artikel 13, negende lid, van verordening 1122/2009 van sloten, bedraagt 0,01
      ha.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel66
  - number: '67'
    text: |-
      De AID is verantwoordelijk voor de coördinatie van de controles ter plaatse op de naleving van de regeling als
      bedoeld in de artikelen 20 en 22 van verordening 73/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel67
  - number: '68'
    text: |-
      1 Indien een landbouwer één of meer verplichtingen op grond van [artikel 3][ref1] niet naleeft, wordt
      overeenkomstig Deel II, Titel IV, hoofdstuk III van verordening 1122/2009 een korting opgelegd op het totale bedrag
      dat op grond van de in [artikel 2][ref2] bedoelde steunregelingen aan de landbouwer is of moet worden toegekend.

      2 Onverminderd artikel 77 van verordening 1122/2009, bedraagt de hoogte van de korting 1, 3 of 5% van het totale
      bedrag dat op grond van de in [artikel 3][ref3] bedoelde steunregelingen aan de landbouwer is of moet worden
      toegekend en wordt in geval van herhaalde of opzettelijke niet-naleving verhoogd overeenkomstig artikel 71 en 72
      van verordening 1122/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel3
