  - number: 38p
    text: |-
      1 De minister verstrekt op aanvraag steun in de vorm van een tegemoetkoming voor het verrichten van één of meerdere
      van de in [bijlage 7][ref1] omschreven managementmaatregelen.

      2 De steun bedraagt maximaal 60% van de forfaitaire kosten, omschreven in [bijlage 7][ref2].

      3 Het steunplafond bedraagt € 500.000.

      4 De steun, bedoeld in het eerste lid, wordt evenredig verlaagd voor alle voor steun in aanmerking te nemen
      aanvragen indien het totaal van de goedgekeurde aanvragen het steunplafond overstijgt.

      5 Landbouwers verrichten de maatregelen waarvoor de tegemoetkoming wordt aangevraagd, bedoeld in het eerste lid,
      gedurende het hele kalenderjaar van het jaar waarin zij de steun aanvragen.

      6 De steun wordt verstrekt per dierplaats, waarbij het aantal dierplaatsen waarvoor de steun wordt verstrekt niet
      hoger is dan het aantal varkens dat ingevolge [artikel 4][ref3] en [4a van het Varkensbesluit][ref4] mag worden
      gehouden.

      7 Landbouwers die vanaf 2012 steun op grond van deze paragraaf aanvragen voor de in punt 13 van [bijlage 7][ref5]
      omschreven maatregel, verrichten daarnaast één van de andere in bijlage 7 omschreven maatregelen.


