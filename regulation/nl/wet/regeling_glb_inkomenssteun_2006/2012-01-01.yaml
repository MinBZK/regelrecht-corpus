  - number: 38w
    text: |-
      1 De landbouwer kan slechts een aanvraag per jaar indienen voor steunverlening op grond van [artikel 38u][ref1].

      2 De aanvraag voor steunverlening gaat vergezeld van:

      a. een omschrijving van de steunwaardige activiteit, inclusief een conceptfactuur of offerte,

      b. het adres waar de landbouwer de steunwaardige activiteit realiseert, en

      c. een verklaring van de landbouwer waarin hij de minister toestemming geeft om zijn
      gegevens, inclusief persoonsgegevens, uit te wisselen met de minister van Financiën,
      ten behoeve van de controle op de naleving van deze specifieke steunregeling en de
      [Aanwijzingsregeling willekeurige afschrijving en investeringsaftrek milieu-investeringen 2009][ref2].

      3 De landbouwer kan steun aanvragen voor de aanschaf van meerdere in [artikel 38u, onderdeel 1][ref3], omschreven
      apparaten.

      4 De landbouwer kan geen steun aanvragen op grond van meer dan één van de in [artikel 38u][ref4] onderscheiden
      onderdelen.

      5 De landbouwer kan alleen steun aanvragen voor activiteiten die verricht worden na de steunverlening.

      6 De minister verleent de steun door middel van de in [artikel 1:5 van de Regeling LNV-subsidies][ref5] beschreven
      procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
