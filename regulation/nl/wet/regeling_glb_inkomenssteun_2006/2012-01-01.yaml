  - number: '2'
    text: |-
      1 Overeenkomstig verordening 73/2009 en met inachtneming van ter uitvoering daarvan vastgestelde
      Commissieverordeningen en deze regeling:

      1. wijst de minister op aanvraag aan landbouwers toeslagrechten op grond van artikel 33, eerste lid, onderdeel b,
      onder ii en iv, van verordening 73/2009 in het kader van de bedrijfstoeslagregeling toe.

      2. verstrekt de minister op aanvraag aan landbouwers:

      a. een bedrijfstoeslag, of

      b. specifieke steun op grond van [Hoofdstuk 2a][ref1] van deze regeling.

      2 De Minister beslist op de aanvraag, bedoeld in het eerste lid, onder 2, uiterlijk op 30 juni van het jaar volgend
      op het jaar van indiening van de aanvraag.

      3 Vanaf 16 oktober 2011 betaalt de minister op grond van artikel 1 van verordening 784/2011, voorschotten van 50%
      van de betalingen voor de steunaanvragen, bedoeld in het eerste lid, onderdeel 2, onder a, die in 2011 zijn gedaan
      op voorwaarde dat voor die steunaanvragen de toetsing is afgerond van de subsidiabiliteitsvoorwaarden, bedoeld in
      artikel 20 van verordening 73/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019131
        hoofdstuk: 2a
  - number: '3'
    text: |-
      Een landbouwer die een aanvraag heeft ingediend voor één van de in [artikel 2][ref1] genoemde steunregelingen neemt
      de volgende bepalingen in acht:

      a. de in de artikelen 4 en 5 van verordening 73/2009 bedoelde beheerseisen, opgenomen in [bijlage 1][ref2], en

      b. de in artikel 6 van verordening 73/2009 bedoelde minimumeisen inzake de goede landbouw- en milieuconditie,
      opgenomen in [bijlage 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
