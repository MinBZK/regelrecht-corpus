  - number: '30'
    text: |-
      1 De landbouwer verzoekt door middel van een aanvraag tot steunverlening om toekenning van steun op grond van
      [artikel 29, eerste lid][ref1].

      2 De aanvraag tot steunverlening gaat vergezeld van de documenten, bedoeld in
      [bijlage 2, hoofdstuk 4, onderdeel D, eerste alinea, onderdelen a, b en c, van de Regeling LNV-subsidies][ref2].

      3 De landbouwer meldt bij de aanvraag tot steunverlening of hij in het bezit is van de in voorkomend geval
      noodzakelijke vergunningen voor de uitvoering van het investeringsplan, of dat hij deze heeft aangevraagd, en
      verklaart dat hij ermee bekend is dat het ontbreken van dergelijke vergunningen of de niet tijdige beschikbaarheid
      ervan geen grond is voor toepassing van [artikel 35][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0021281
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel35
