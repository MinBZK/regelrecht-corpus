  - number: 55d
    text: |-
      1 Aanvragen of gegevensverstrekkingen op grond van dit artikel worden bij de minister ingediend met gebruikmaking
      van het daartoe door DR verstrekte formulier en gaan vergezeld van een verklaring dat de landbouwer zich bewust is
      van alle voorwaarden voor het verkrijgen van de steun.

      2 De landbouwer die steun aanvraagt op grond van [artikel 29, eerste lid][ref1]:

      a. dient de aanvraag, bedoeld in [artikel 30, eerste lid][ref2], in bij de minister in de periode van 1 januari tot
      en met 31 januari,

      b. dient de aanvraag, bedoeld in [artikel 36, eerste lid][ref3], in bij de minister in de periode van 1 december
      van het jaar waarin de steun is verleend, tot 1 maart van het daaropvolgende jaar, en

      c. dient de aanvraag, bedoeld in [artikel 37, eerste lid][ref4], in bij de minister:

      1°. in de periode van 1 december van het haar waarin de steun is verleend tot 1 maart van het daaropvolgende jaar,
      of

      2°. in de periode van 1 december van het jaar dat volgt op het jaar waarin de aanvraag tot steunverlening
      is ingediend en waarop [artikel 34, vierde lid, onderdeel c][ref5], van toepassing is, tot 1 maart van het
      daaropvolgende jaar.

      3 De landbouwer die steun aanvraagt op grond van [artikel 38j, eerste lid][ref6], verstrekt de in
      [artikel 38m, eerste lid][ref7], bedoelde gegevens aan de minister voor 1 augustus van het jaar waarvoor de steun
      is aangevraagd.

      4 De landbouwer die steun aanvraagt op grond van [artikel 38u][ref8]:

      a. dient de aanvraag tot steunverlening in bij de minister in de periode van 1 januari tot en met 31 januari, en

      b. dient de in [artikel 38w, eerste lid, onderdeel a][ref9], omschreven gegevens, in bij de minister voor
      1 november van het jaar waarin de steun is verleend.

      5 De landbouwer die steun aanvraagt op grond van [artikel 24, eerste lid][ref10], verstrekt de in
      [artikel 25, eerste lid][ref11], bedoelde gegevens aan de minister voor 1 november van het jaar waarin de steun
      is aangevraagd.

      6 De aanvraag, bedoeld in [artikel 26, eerste lid][ref12], [artikel 38l, eerste lid][ref13], wordt uiterlijk
      ingediend bij de minister voor 1 december voorafgaand aan het kalenderjaar waarop de verzekering betrekking heeft.


