  - number: '65'
    text: |-
      Het bestuur van het Productschap Zuivel is belast met de uitvoering van de steun voor melkveehouders, bedoeld in
      [artikel 38h][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38h
