  - number: 38e
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *vaarvergoeding:* vergoeding voor het verrichten van landbouwactiviteiten, als bedoeld in artikel 2, onder c,
      van verordening 73/2009, op een vaarperceel.

      b. *vaarperceel:* perceel dat als zodanig is aangewezen in [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 38f
    text: |-
      1 De minister verstrekt specifieke steun aan landbouwers in de vorm van een vaarvergoeding van € 500 per hectare
      per jaar voor vaarpercelen.

      2 Indien voor het desbetreffende perceel reeds subsidie voor het uitrijden van ruige mest uit
      hoofde van de Subsidieverordening natuur- en landschapsbeheer van de onderscheiden provincies, de
      [Subsidieregeling agrarisch natuurbeheer][ref1] of de Subsidieregeling agrarisch natuurbeheer van de onderscheiden
      provincies wordt toegekend, bedraagt de steun, bedoeld in het eerste lid, € 405,50 per hectare per jaar.

      3 De vaarvergoeding wordt evenredig verlaagd voor alle voor vaarvergoeding in aanmerking te nemen aanvragen
      indien het totaal van de voor steun in aanmerking te nemen aanvragen het bedrag van € 1.100.000 per kalenderjaar
      overstijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 38g
    text: |-
      Een landbouwer komt uitsluitend in aanmerking voor steun op grond van deze paragraaf indien:

      a. de totale oppervlakte van de vaarpercelen waarvoor hij steun op grond van deze paragraaf ontvangt tenminste 0,5
      hectare bedraagt;

      b. hij in de verzamelaanvraag heeft aangegeven in te stemmen met de verwerking door DR van de persoonsgegevens
      die betrekking hebben op de subsidie voor het uitrijden van ruige mest die DR heeft verkregen in het
      kader van de subsidieaanvraag op grond van de Subsidieverordening natuur- en landschapsbeheer, de
      [Subsidieregeling agrarisch natuurbeheer][ref1] of de Subsidieregeling agrarisch natuurbeheer van de onderscheiden
      provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 38i
    text: |-
      In deze paragraaf wordt verstaan onder:

      1. *diervriendelijke producten:* dierlijke producten die zijn geproduceerd volgens bovenwettelijke
      dierenwelzijnsstandaarden die op meerdere onderdelen zoals: ruimte, daglicht, afleidingsmateriaal of voorkomen van
      ingrepen, een duidelijke verbetering van het dierenwelzijn betekenen ten opzichte van de wettelijke normen;

      2. *certificeringssysteem:* voor certificatie geldend stelsel van privaatrechtelijke afspraken dat ertoe leidt dat
      de deelnemende partijen diervriendelijk gaan produceren volgens specifieke normen, voorschriften en procedures;

      3. *accreditatie:* verklaring, bedoeld in artikel 2, punt 10, van verordening 765/2008;

      4. *certificaat:* bewijs dat een landbouwer voldoet aan de voorwaarden om deel te nemen aan een door de minister
      goedgekeurd certificeringssysteem.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38i
  - number: 38j
    text: |-
      1 De minister verstrekt op aanvraag steun als tegemoetkoming voor de meerkosten van diervriendelijk produceren
      aan veehouders die blijkens een certificaat deelnemen aan een goedgekeurd certificeringssysteem in de sector
      vleeskuikens, leghennen, vleeskalveren, vleesrunderen of varkens.

      2 Landbouwers kunnen de steun slechts éénmalig aanvragen tenzij, in vergelijking met hun vorige aanvraag voor
      steun op grond van deze paragraaf, de nieuwe steunaanvraag wordt gedaan voor het produceren van diervriendelijke
      producten volgens hogere dierenwelzijnsstandaarden.

      3 De steun wordt niet verstrekt aan landbouwers die uit anderen hoofde een andere bijdrage van de overheid
      ontvangen voor het verrichten van de activiteiten bedoeld in het eerste lid, of die producten produceren
      overeenkomstig de voorschriften van Verordening (EG) nr. 843/2007 van de Raad van 28 juni 2007 inzake de
      biologische productie en de etikettering van biologische producten en tot intrekking van Verordening (EEG) nr.
      2092/91 (PbEU L 189).

      4 Het steunplafond bedraagt:

      a. € 200.000 voor de sector vleeskuikens,

      b. € 200.000 voor de sector leghennen,

      c. € 200.000 voor de sector vleeskalveren,

      d. € 200.000 voor de sector vleesrunderen, en

      e. € 200.000 voor de sector varkens.

      5 De steun bedraagt maximaal 60% van de naar het oordeel van de minister in aanmerking komende forfaitaire
      steunbedragen voor diervriendelijk produceren, bedoeld in [bijlage 6][ref1].

      6 De steun, bedoeld in het vijfde lid, wordt evenredig verlaagd voor alle voor steun in aanmerking te nemen
      aanvragen indien het totaal van de goedgekeurde aanvragen het steunplafond voor de desbetreffende sector
      overstijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38j
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 38k
    text: |-
      1 De minister keurt een certificeringssysteem goed op aanvraag van de verantwoordelijke voor het systeem.

      2 De minister keurt een certificeringssysteem uitsluitend goed indien dit naar zijn oordeel:

      a. significant bijdraagt aan de realisering van het produceren van diervriendelijke producten,

      b. aannemelijk maakt dat de op grond daarvan verrichte activiteiten daadwerkelijk worden verricht,

      c. ervoor zorgt dat deelnemende landbouwers jaarlijks, administratief en ter plaatse, worden gecontroleerd op de
      naleving van de voorschriften van het certificeringssysteem,

      d. in overeenstemming is met artikel 29, tweede lid, van verordening 1122/2009, en

      e. aannemelijk maakt dat een onafhankelijke controleur, bijvoorbeeld blijkend uit een relevante accreditatie of
      anderszins, op de naleving van het certificeringssysteem controleert.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38k
  - number: 38l
    text: |-
      1 De aanvraag, bedoeld in [artikel 38k, eerste lid][ref1], kan jaarlijks worden ingediend en gaat vergezeld van:

      a. een onderbouwing van de wijze waarop het certificeringssysteem bijdraagt aan de productie van diervriendelijke
      producten,

      b. de voorwaarden voor het toekennen van certificaten en het daaraan gerelateerde controlesysteem,

      c. de standaardvoorwaarden voor toekenning van een certificaat, en

      d. overige documenten waarin ten genoegen van de minister wordt aangetoond dat het certificeringssysteem in
      overeenstemming is met deze regeling.

      2 De minister besluit over aanvragen, bedoeld in [artikel 38k, eerste lid][ref2], in de periode van 1 tot en met
      15 februari in het kalenderjaar volgend op de in het eerste lid bedoelde periode.

      3 De minister kan een certificeringssysteem voor meerdere jaren goedkeuren.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38k
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel38k
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38l
