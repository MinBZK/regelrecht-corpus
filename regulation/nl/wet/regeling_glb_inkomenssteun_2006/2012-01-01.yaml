    text: |-
      1 De bedragen die een landbouwer op grond van de in [artikel 2][ref1] genoemde steunregelingen aan subsidies
      ontvangt, worden conform het bepaalde in artikel 7 van verordening 73/2009 procentueel verlaagd ten behoeve van
      modulatie.

      2 De minister past in voorkomend geval de lineaire verlaging toe, bedoeld in artikel 8, eerste lid, laatste volzin,
      van verordening 73/2009.


