    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *managementmaatregelen:* besluiten, werkzaamheden en activiteiten die een varkenshouder structureel uitvoert
      om de productieprocessen en bedrijfsvoering aan te passen waardoor varkens met behulp van meer afleidingsmateriaal
      minder in elkaars lichaamsdelen bijten, uitgezonderd ten behoeve daarvan verrichte investeringen;

      b. *stal:* ruimte als bedoeld in [artikel 1, onderdeel l, van het Varkensbesluit][ref1];

      c. *varken:* varken als bedoeld in [artikel 1, onderdeel b, van het Varkensbesluit][ref2];

      d. *vloervoederingssysteem:* elektronisch of handmatig doseeringssysteem voor het verstrekken van voer op de grond
      van de stal ter afleiding van varkens, waarbij het voer niet wordt verstrekt in een trog.


      [ref1]: https://wetten.overheid.nl/BWBR0006806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006806#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38o
