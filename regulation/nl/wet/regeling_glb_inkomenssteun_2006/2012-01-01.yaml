  - number: '56'
    text: |-
      Bewijsstukken als bedoeld in [artikel 55, vierde lid][ref1], overlegt de landbouwer schriftelijk voor zover deze
      niet elektronisch overgelegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel56
