  - number: 38m
    text: |-
      1 De landbouwer die steun aanvraagt op grond van [artikel 38j, eerste lid][ref1], verstrekt zijn certificaat of een
      afschrift daarvan aan de minister.

      2 De landbouwer is van de verplichting, bedoeld in het eerste lid, vrijgesteld indien de gegevens
      door de verantwoordelijke voor het certificeringssysteem aan de minister zijn verstrekt voor de in
      [artikel 55d, derde lid][ref2], bedoelde termijn.

      3 De verantwoordelijke voor het certificeringssysteem informeert de minister jaarlijks, voor 15 januari van het
      kalenderjaar dat volgt op het kalenderjaar waarvoor de landbouwer de steun aanvraagt, over de resultaten van de
      controle bij de landbouwer indien:

      a. voorschriften van het certificeringssysteem niet zijn nageleefd en het het certificaat om die reden is of zal
      worden ontnomen, of,

      b. voorschriften, bedoeld in artikel 5 en 6 van Verordening 73/2009, niet zijn nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38j
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel55d
