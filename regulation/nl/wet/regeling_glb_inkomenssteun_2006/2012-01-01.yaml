  - number: 38d
    text: |-
      De steun, bedoeld in [artikel 38c][ref1], kan in enig jaar alleen worden aangevraagd door landbouwers
      die in het desbetreffende jaar op 15 mei eigenaar of huurder zijn van een landbouwonderneming
      waaraan een UBN is toegekend en ter zake waarvan in het desbetreffende jaar het bedrag, bedoeld in
      [artikel 43i, tweede lid, van de Regeling identificatie en registratie van dieren][ref2] verschuldigd is.


