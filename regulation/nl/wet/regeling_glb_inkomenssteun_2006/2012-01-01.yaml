      In deze paragraaf wordt verstaan onder:

        - *GPS:* plaatsbepalingssysteem met behulp van satellieten.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38t
  - number: 38u
    text: |-
      De minister verstrekt op aanvraag steun aan landbouwers in de vorm van een tegemoetkoming in de kosten van de
      onderstaande activiteiten:

      1. de aanschaf van:

      a. een ploeg die wordt gestuurd met behulp van GPS;

      b. spuit- en schoffelapparatuur die wordt gestuurd met behulp van GPS;

      c. bemestingsapparatuur die wordt gestuurd met behulp van GPS;

      d. computergestuurde beregeningapparatuur met vochtsensoren die precisieberegening mogelijk maakt en wordt gestuurd
      met behulp van GPS;

      e. poot- en zaaiapparatuur die wordt gestuurd met behulp van GPS;

      2. het verwijderen van asbest in een bewaarplaats;

      3. het isoleren van vloeren, wanden of plafonds van een bewaarplaats van
      landbouwproducten, waardoor een warmteweerstand wordt bereikt als vastgesteld in
      __REF000___________________________________________________________________________________________________________
      ___;

      4. regulering van het klimaat in een bewaarplaats door middel van een computer, inclusief daarmee verband houdende
      aanpassingen aan ventilatiesystemen.


      [ref1]: https://wetten.overheid.nl/BWBR0012054#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38u
    references:
      - id: ref1
        bwb_id: BWBR0012054
        artikel: '1'
  - number: 38v
    text: |-
      1 De steun, bedoeld in [artikel 38u][ref1], bedraagt 30% van de in aanmerking komende kosten met dien verstande dat
      zij ten hoogste € 50.000 steun per landbouwer bedraagt.

      2 Het steunplafond bedraagt € 10.000.000.

      3 De landbouwer komt alleen voor steunverlening in aanmerking indien de totale kosten voor de uitvoering van de
      volledige activiteit hoger zijn dan € 15.000.

      4 Gemaakte arbeidskosten komen voor steun in aanmerking indien deze zijn gemaakt door een aannemer of een
      leverancier, overeenkomstig de in [artikel 1:15, vijfde lid, van de Regeling LNV-subsidies][ref2], omschreven
      berekeningsmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
      [ref2]: https://wetten.overheid.nl/BWBR0021281#Artikel115
