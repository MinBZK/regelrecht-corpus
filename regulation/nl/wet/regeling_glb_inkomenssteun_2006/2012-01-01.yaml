      a. de steunplafonds, bedoeld in [artikel 38j, vierde lid][ref1], met het bedrag of de bedragen die zijn
      overgebleven door het niet bereiken van een of meerdere van deze subsidieplafonds;

      b. de steunplafonds, bedoeld in [artikel 38p, derde lid][ref2], en [38r, derde lid][ref3], met het bedrag of
      de bedragen die na het toepassen van onderdeel a zijn overgebleven door het niet bereiken van een steunplafond,
      bedoeld in [artikel 38j, vierde lid][ref4];.

      c. het steunplafond, bedoeld in [artikel 38p, derde lid][ref5], met het bedrag overgebleven door het niet bereiken
      van het steunplafond, bedoeld in [artikel 38r, derde lid][ref6];

      d. het steunplafond, bedoeld in [artikel 38r, derde lid][ref7], met het bedrag overgebleven door het niet bereiken
      van het steunplafond, bedoeld in [artikel 38p, derde lid][ref8];

      e. de steunplafonds, bedoeld in [artikel 38j, vierde lid][ref9], met het bedrag of de bedragen die na het
      toepassen van de onderdelen c en d zijn overgebleven door het niet bereiken van de steunplafonds, bedoeld in de
      [artikelen 38r, derde lid][ref10], en [38p, derde lid][ref11].


