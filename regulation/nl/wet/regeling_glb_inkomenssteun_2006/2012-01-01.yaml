      a. tevens steun aanvragen op grond van [artikel 38p, eerste lid][ref2], of [artikel 38r, eerste lid][ref3], of

      b. op enig moment in het kalenderjaar de voorschriften als bedoeld in [artikel 38m, derde lid, onderdeel a][ref4],
      niet naleven.


