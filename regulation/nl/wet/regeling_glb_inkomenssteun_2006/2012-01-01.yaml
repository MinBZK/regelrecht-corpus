preamble:
  text: |-
    Gelet op Verordening (EG) Nr. 1782/2003 van de Raad van 29 september 2003 tot vaststelling van gemeenschappelijke
    voorschriften voor regelingen inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk
    landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers en houdende wijziging van de
    Verordeningen (EEG) nr. 2019/93, (EG) nr. 1452/2001, (EG) nr. 1453/2001, (EG) nr. 1454/2001, (EG) nr. 1868/94, (EG)
    nr. 1251/1999, (EG) nr. 1254/1999, (EG) nr. 1673/2000, (EEG) nr. 2358/71 en (EG) nr. 2529/2001 (PbEU L 270);

    Gelet op Verordening (EG) Nr. 795/2004 van de Commissie van 21 april 2004 houdende bepalingen voor de uitvoering
    van de bedrijfstoeslagregeling waarin is voorzien bij Verordening (EG) nr. 1782/2003 van de Raad tot vaststelling
    van gemeenschappelijke voorschriften inzake rechtstreekse steunverlening in het kader van het gemeenschappelijk
    landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers (PbEU L 141);

    Gelet op Verordening (EG) Nr. 796/2004 van de Commissie van 21 april 2004 houdende uitvoeringsbepalingen inzake de
    randvoorwaarden, de modulatie en het geïntegreerd beheers- en controlesysteem waarin is voorzien bij Verordening
    (EG) nr. 1782/2003 van de Raad tot vaststelling van gemeenschappelijke voorschriften voor regelingen inzake
    rechtstreekse steunverlening in het kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde
    steunregelingen voor landbouwers (PbEU L 141);

    Gelet op Verordening (EG) Nr. 1973/2004 van de Commissie van 29 oktober 2004 houdende uitvoeringsbepalingen van
    Verordening (EG) nr. 1782/2003 van de Raad met betrekking tot de bij de titels IV en IV bis van die verordening
    ingestelde steunregelingen en het gebruik van braakgelegde grond voor de productie van grondstoffen (PbEU L345);

    Overwegende dat toepassing moet worden gegeven aan de hiervoor genoemde verordeningen en de ter uitvoering daarvan
    vastgestelde Raads- en Commissieverordeningen;

    Overwegende dat de bepalingen van genoemde verordeningen rechtstreekse werking hebben in de Nederlandse
    rechtssfeer, zij het dat ten behoeve van de juiste uitvoering en nadere invulling van deze bepalingen regelgeving
    noodzakelijk is;

    Voorts gelet op de artikelen 15, 19, 23, 26, 27 en 28 van de Landbouwwet;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van deze regeling wordt verstaan onder:

      a. *minister:* minister van Economische Zaken, Landbouw en Innovatie;

      b. *DR:* Dienst Regelingen van het Ministerie van Economische Zaken, Landbouw en Innovatie;

      c. *AID:* Algemene Inspectiedienst van het Ministerie van Economische Zaken, Landbouw en Innovatie;

      d. *sloot:* sloot, met inbegrip van het talud;

      2 Voor de toepassing van deze regeling wordt verstaan onder:

      a. *richtlijn 91/629/EEG:* Richtlijn 91/629/EEG van de Raad van 19 november 1991 tot vaststelling van minimumnormen
      ter bescherming van kalveren (PbEG L 340);

      b. *richtlijn 91/630/EEG:* Richtlijn 91/630/EEG van de Raad van 19 november 1991 tot vaststelling van minimumnormen
      ter bescherming van varkens (PbEG L 340);

      c. *verordening 1760/2000:* Verordening (EG) nr. 1760/2000 van het Europees Parlement en de Raad van 17 juli 2000
      tot vaststelling van een identificatie- en registratieregeling voor runderen en inzake etikettering van rundvlees
      en rundvleesproducten en tot intrekking van Verordening (EG) nr. 820/97 van de Raad (PbEG L 204);

      d. *verordening 21/2004:* Verordening (EG) nr. 21/2004 van de Raad van 17 december 2003 tot vaststelling van een
      identificatie- en registratieregeling voor schapen en geiten en tot wijziging van Verordening (EG) nr. 1782/2003 en
      de Richtlijnen 92/102/EEG en 64/432/EEG (PbEU L 5);

      e. *verordening 852/2004:* Verordening (EG) nr. 852/2004 van het Europees Parlement en de Raad van 29 april 2004
      inzake levensmiddelenhygiëne (PbEU L 139);

      f. *verordening 853/2004:* Verordening (EG) nr. 853/2004 van het Europees Parlement en de Raad van 29 april 2004
      houdende vaststelling van specifieke hygiënevoorschriften voor levensmiddelen van dierlijke oorsprong (PbEU L 226);

      g. *verordening 183/2005:* Verordening (EG) nr. 183/2005 van het Europees Parlement en de Raad van 12 januari 2005
      tot vaststelling van voorschriften voor diervoederhygiëne (PbEU L 35);

      h. *verordening 885/2006:* Verordening (EG) nr. 885/2006 van de Commissie van 21 juni 2006 houdende
      uitvoeringsbepalingen van Verordening (EG) nr. 1290/2005 van de Raad met betrekking tot de erkenning van de
      betaalorganen en andere instanties en de goedkeuring van de rekeningen inzake het ELGF en het ELFPO (PbEU L 171);

      i. *verordening 1156/2006:* Verordening (EG) nr. 1156/2006 van de Commissie van 28 juli 2006 tot vaststelling,
      voor 2006, van de begrotingsmaxima voor de gedeeltelijke of facultatieve uitvoering van de bedrijfstoeslagregeling,
      de jaarlijkse totaalbedragen voor de regeling inzake één enkele areaalbetaling en de maximumbedragen voor de
      toekenning van de afzonderlijke suikerbetaling waarin Verordening (EG) nr. 1782/2003 van de Raad voorziet, en tot
      wijziging van die verordening (PbEG L 208);

      j. *verordening 552/2007:* Verordening (EG) nr. 552/2007 van de Commissie van 22 mei 2007 tot vaststelling van
      het maximumbedrag van de communautaire bijdrage in de financiering van de activiteitenprogramma’s in de sector
      olijfolie, tot vaststelling, voor 2007, van de begrotingsmaxima voor de gedeeltelijke of facultatieve uitvoering
      van de bedrijfstoeslagregeling en de jaarlijkse totaalbedragen voor de regeling inzake één enkele areaalbetaling
      waarin Verordening (EG) nr. 1782/2003 van de Raad voorziet, en tot wijziging van die verordening (PbEG L 131);

      k. *verordening 834/2007:* Verordening (EG) nr. 834/2007 van de Raad van 28 juni 2007 inzake de biologische
      productie en de etikettering van biologische producten en tot intrekking van Verordening (EEG) nr. 2092/91
      (PbEU L 189);

      l. *richtlijn 2008/71/EG:* richtlijn 2008/71/EG van de Raad van de Europese Unie van 15 juli 2008 met betrekking
      tot de identificatie en registratie van varkens (PbEU L 213);

      n. *verordening 765/2008:* Verordening (EG) nr. 765/2008 van het Europees Parlement en de Raad van 9 juli 2008 tot
      vaststelling van de eisen inzake accreditatie en markttoezicht betreffende het verhandelen van producten en tot
      intrekking van Verordening (EEG) nr. 339/93, (PbEU L 218);

      o. *verordening 674/2008:* Verordening (EG) nr. 674/2008 van de Commissie van 16 juli 2008 tot wijziging van
      Verordening (EG) nr. 1782/2003 van de Raad en Verordening (EG) nr. 247/2006 van de Raad en tot vaststelling, voor
      2008, van de begrotingsmaxima voor de gedeeltelijke of facultatieve uitvoering van de bedrijfstoeslagregeling en de
      jaarlijkse totaalbedragen voor de regeling inzake een enkele areaalbetaling waarin Verordening (EG) nr. 1782/2003
      voorziet (PbEU L 189);

      p. *verordening 889/2008:* Verordening (EG) nr. 889/2008 van de Commissie van 5 september 2008 tot vaststelling
      van bepalingen ter uitvoering van Verordening (EG) nr. 834/2007 van de Raad inzake de biologische productie en
      de etikettering van biologische producten, wat de biologische productie, de etikettering en de controle betreft
      (PbEU L 250);

      q. *verordening 73/2009:* Verordening (EG) Nr. 73/2009 van de Raad van 19 januari 2009 tot vaststelling van
      gemeenschappelijke voorschriften voor regelingen inzake rechtstreekse steunverlening aan landbouwers in het
      kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers,
      tot wijziging van Verordening (EG) nr. 1290/2005, (EG) nr. 247/2006, (EG) nr. 378/2007, en tot intrekking van
      Verordening (EG) nr. 1782/2003 (PbEU L 30);

      r. *verordening 1120/2009:* Verordening (EG) Nr. 1120/2009 van de Commissie van 29 oktober 2009 houdende bepalingen
      voor de uitvoering van de bedrijfstoeslagregeling waarin is voorzien bij titel III van Verordening (EG) nr. 73/2009
      van de Raad tot vaststelling van gemeenschappelijke voorschriften inzake rechtstreekse steunverlening in het
      kader van het gemeenschappelijk landbouwbeleid en tot vaststelling van bepaalde steunregelingen voor landbouwers
      (PbEU L 316);

      s. *verordening 1121/2009:* Verordening (EG) nr. 1121/2009 van de Commissie van 29 oktober 2009 houdende
      uitvoeringsbepalingen van Verordening (EG) nr. 73/2009 van de Raad met betrekking tot de bij de titels IV en V van
      die verordening ingestelde steunregelingen (PbEU L 316);

      t. *verordening 1122/2009:* Verordening (EG) nr. 1122/2009 van de Commissie van 30 november 2009 tot vaststelling
      van bepalingen ter uitvoering van Verordening (EG) nr. 73/2009 van de Raad wat betreft de randvoorwaarden, de
      modulatie en het geïntegreerd beheers- en controlesysteem in het kader van de bij die verordening ingestelde
      regelingen inzake rechtstreekse steunverlening aan landbouwers en ter uitvoering van Verordening (EG) nr. 1234/2007
      van de Raad wat betreft de randvoorwaarden in het kader van de steunregeling voor de wijnsector (PbEU L 316);

      u. *verordening 784/2011:* Uitvoeringsverordening (EU) nr. 784/2011 van de Commissie van 5 augustus 2011 inzake
      de vanaf 16 oktober 2011 te betalen voorschotten op de rechtstreekse betalingen uit hoofde van bijlage I bij
      Verordening (EG) nr. 73/2009 van de Raad tot vaststelling van gemeenschappelijke voorschriften voor regelingen
      inzake rechtstreekse steunverlening aan landbouwers in het kader van het gemeenschappelijk landbouwbeleid en tot
      vaststelling van bepaalde steunregelingen voor landbouwers (PbEU L 203).

      3 In verordening 73/2009 of de daarop gebaseerde verordeningen vastgestelde definities zijn van overeenkomstige
      toepassing.

      4 In de [Regeling identificatie en registratie van dieren][ref1] vastgestelde definities zijn van overeenkomstige
      toepassing.


