  - number: '35'
    text: |-
      1 Op aanvraag kan de minister de beschikking tot steunverlening wijzigen ten behoeve van een aanpassing van het
      investeringsplan. De steun die met de beschikking op grond van dit artikel wordt verstrekt is nooit hoger dan de
      steun die zou worden verstrekt op grond van de beschikking tot steunverlening.

      2 Een aanvraag als bedoeld in het eerste lid kan niet worden gegrond op de afwezigheid of niet tijdige
      beschikbaarheid van voor de uitvoering van het investeringsplan noodzakelijke vergunningen.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel35
  - number: '36'
    text: |-
      1 Indien [artikel 34, vierde lid, onderdeel c][ref1], van toepassing is, betaalt de minister op aanvraag steun voor
      tijdig gerealiseerde onderdelen van het investeringsplan.

      2 De aanvraag, bedoeld in het eerste lid, gaat in ieder geval vergezeld van documenten waaruit blijkt dat de
      landbouwer onderdelen van het investeringsplan heeft gerealiseerd en wat daarvoor de gemaakte kosten zijn.

      3 De minister behandelt een aanvraag als bedoeld in het eerste lid als een aanvraag tot steunvaststelling indien
      blijkt dat alle subsidiabele investeringen zijn gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel34
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel36
