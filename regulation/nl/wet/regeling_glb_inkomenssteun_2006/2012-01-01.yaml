      In deze paragraaf wordt verstaan onder:

      a. *managementmaatregelen:* besluiten, werkzaamheden en activiteiten die een vleeskuikenhouder structureel uitvoert
      om het ontstaan van contactdermatitis, zoals hakdermatitis en voetzoollaesies bij vleeskuikens te verminderen
      door het aanpassen van de productieprocessen en de bedrijfsvoering, uitgezonderd ten behoeve daarvan verrichte
      investeringen;

      b. *koppel:* groep vleeskuikens als bedoeld in [artikel 1, onderdeel g, van het Vleeskuikenbesluit 2010][ref1];

      c. *stal:* gebouw als bedoeld in [artikel 1, onderdeel k, van het Vleeskuikenbesluit 2010][ref2];

      d. *vleeskuiken:* dier als bedoeld in artikel 1, onderdeel l, van het Vleeskuikenbesluit 2010.


