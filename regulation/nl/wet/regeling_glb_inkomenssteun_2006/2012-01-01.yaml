  - number: 38a
    text: |-
      1 De minister verstrekt éénmalig specifieke steun aan landbouwers in de vorm van een financiële bijdrage voor het
      elektronisch merken van schapen of geiten.

      2 De specifieke steun bedraagt € 4 per schaap of geit, met dien verstande dat dit bedrag evenredig wordt verlaagd
      voor alle voor tegemoetkoming in aanmerking te nemen aanvragen indien het totaal van de voor tegemoetkoming in
      aanmerking te nemen aanvragen het bedrag van € 2.000.000 overstijgt.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel38a
  - number: 38b
    text: |-
      1 De steun, bedoeld in [artikel 38a, eerste lid][ref1], kan alleen in 2010 worden aangevraagd door landbouwers
      die op 15 mei 2010 eigenaar of huurder zijn van een landbouwonderneming waaraan een UBN is toegekend en waarvan
      op grond van [artikel 37, eerste lid, van de Regeling identificatie en registratie van dieren][ref2], zoals dit
      luidde op 1 november 2009, is aangegeven dat er op grond van dat UBN op dat moment in totaal meer dan 100 schapen
      of geiten werden gehouden.

      2 De minister verstrekt alleen steun voor het elektronisch merken van schapen en geiten die zijn geboren tot en met
      31 december 2009.

      3 De minister verleent uitsluitend steun indien 90% van de voor 1 januari 2010 geboren dieren die op 30 juni 2010
      aanwezig zijn op het UBN, elektronisch gemerkt zijn op 30 juni 2010.

      4 De minister betaalt de steun per schaap of geit dat tot en met 30 juni 2010 op naam van de landbouwer is
      geregistreerd in het I&R-systeem schapen en geiten.

      5 In afwijking van het derde en vierde lid verleent de minister steun op grond van [artikel 38a, eerste lid][ref3],
      aan landbouwers die in 2009 of 2010 zijn onderworpen aan de maatregel als bedoeld in
      [artikel 22, eerste lid, onderdeel f, van de Gezondheids- en welzijnswet voor dieren][ref4], voor het aantal
      schapen en geiten dat voldoet aan de overige voorschriften van deze paragraaf, dat wordt bepaald onvereenkomstig de
      berekening, omschreven in [bijlage 10][ref5].


