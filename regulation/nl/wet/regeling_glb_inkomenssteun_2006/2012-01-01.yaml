  - number: '16'
    text: |-
      1 De minister wijst op grond van artikel 21 van verordening 1120/2009 toeslagrechten uit de nationale reserve toe
      aan landbouwers.

      2 Landbouwers kunnen verzoeken om toepassing van het eerste lid, indien zij ten genoegen van de minister aantonen
      dat:

      a. zij in de periode van 1 januari 2006 tot en met 31 december 2009 een investering in uitbreiding van nieuwe
      stalcapaciteit hebben gerealiseerd van meer dan € 100.000,

      b. de investering rechtstreeks heeft geleid tot een stijging van het aantal dieren dat de landbouwer uiterlijk op 1
      april 2010 houdt,

      c. de investering uiterlijk op 31 december 2009 volledig is gerealiseerd en ten minste tot en met 31 december 2010
      in stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel16
  - number: '17'
    text: |-
      1 De toewijzing van toeslagrechten op grond van [artikel 16, eerste lid][ref1], geschiedt aan de hand van de
      volgende berekening:

      a. er worden vier diercategorieën en daarmee corresponderende vermenigvuldigingsfactoren vastgesteld,
      respectievelijk:

      i. vleeskalveren voor witvlees en rosévlees, jonger dan 8 maanden, met vermenigvuldigingsfactor 1,9,

      ii. vleeskalveren voor rosévlees, 8 maanden of ouder, met vermenigvuldigingsfactor 1,4,

      iii. vleesstieren, met vermenigvuldigingsfactor 1,0, en

      iv. overige volwassen runderen, met vermenigvuldigingsfactor 0,3,

      b. de vermenigvuldigingsfactor, bedoeld in onderdeel a, onderdeel i, wordt vermenigvuldigd met het aantal
      dieren dat binnen de totale stalcapaciteit kan worden gehouden en vervolgens vermenigvuldigd met het bedrag dat
      overeenstemt met het op grond van [artikel 10][ref2] berekende bedrag voor vleeskalveren.

      c. de vermenigvuldigingsfactor, bedoeld in onderdeel a, onderdelen ii, iii en iv, wordt vermenigvuldigd met het
      aantal dieren dat binnen de totale stalcapaciteit kan worden gehouden en vervolgens vermenigvuldigd met het bedrag
      dat overeenstemt met het op grond van [artikel 10][ref3] berekende bedrag voor volwassen runderen.

      2 Het op grond van het eerste lid berekende bedrag wordt met 0,90 vermenigvuldigd, vervolgens verminderd met het
      door de landbouwer ontvangen bedrag op grond van [artikel 10][ref4] voor volwassen runderen of kalveren, daarna
      verminderd met € 500 en verder evenredig verlaagd indien het totaal van de voor tegemoetkoming in aanmerking te
      nemen aanvragen het bedrag van € 8.500.000 overstijgt.

      3 Indien het op grond van het eerste en tweede lid berekende bedrag, met uitzondering van het door de
      landbouwer ontvangen bedrag op grond van [artikel 10][ref5] voor volwassen runderen of kalveren, toegepast
      op het extra aantal dieren dat door de investering in stalcapaciteit kan worden gehouden, lager is dan het op
      grond van het eerste en tweede lid berekende bedrag, geldt het lagere bedrag voor de toewijzing op grond van
      [artikel 16, eerste lid][ref6].


