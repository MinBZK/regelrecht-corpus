  - number: 15a
    text: |-
      1 Op grond van deze paragraaf verhoogde toeslagrechten, of toegewezen toeslagrechten, overschrijden niet de waarde
      van € 5.000 per toeslagrecht.

      2 Voor de uitvoering van de [artikelen 12 tot en met 15][ref1] wordt geen rekening gehouden met rechtshandelingen
      waarvan op grond van bepaalde feiten en omstandigheden kan worden aangenomen dat zij geen wezenlijke verandering
      van feitelijke verhoudingen ten doel hebben gehad, of dat die rechtshandelingen achterwege zouden zijn gebleven
      indien daarmee niet een kleiner aantal toeslagrechten zou zijn verkregen als bedoeld in artikel 64, tweede lid, van
      verordening 73/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel12
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 15b
    text: |-
      1 Landbouwers kunnen met een beroep op artikel 31 van verordening 73/2009 verzoeken om de verhoging van de waarde
      van toeslagrechten, of de toewijzing van nieuwe toeslagrechten, op grond van deze paragraaf op alternatieve wijze
      te berekenen.

      2 Een verzoek, bedoeld in het eerste lid, kan alleen worden gedaan indien:

      a. de productie van de landbouwer rechtstreeks is getroffen door overmacht of uitzonderlijke omstandigheden, en

      b. de directe betaling in enig jaar dat relevant is voor de van toepassing zijnde berekening, bedoeld in
      [bijlage 9][ref1], daardoor verminderde met meer dan € 500.

      3 De alternatieve berekening, bedoeld in het eerste lid, geschiedt in eerste instantie op basis van één of
      meerdere jaren, die relevant zijn voor de van toepassing zijnde berekening, bedoeld in [bijlage 9][ref2], waarin
      de productie van de landbouwer niet is beïnvloed door overmacht of uitzonderlijke omstandigheden. Indien door
      overmacht of uitzonderlijke omstandigheden de productie is beïnvloed in alle relevante jaren voor de van toepassing
      zijnde berekening, bedoeld in bijlage 9, geschiedt de berekening op basis van het door de minister te bepalen meest
      recente jaar dat niet door deze omstandigheden is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
      [ref2]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0019131
      - id: ref2
        bwb_id: BWBR0019131
  - number: 15c
    text: |-
      Landbouwers die hun aanspraak op toeslagrechten als bedoeld in de [artikelen 12 tot en met 15][ref1] hebben
      overgedragen in combinatie met de overdracht van een onderneming of een deel ervan, kunnen de minister verzoeken om
      toepassing van artikel 26 van verordening 1120/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel12
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel15c
    references:
