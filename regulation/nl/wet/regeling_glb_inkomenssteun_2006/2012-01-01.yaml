  - number: 70f
    text: |-
      1 De minister stelt de steun op grond van de betreffende steunregeling vast op nihil indien blijkt dat door,
      of ten behoeve van, de landbouwer een document, bedoeld in [artikel 25, eerste lid, onderdeel c][ref1],
      [artikel 36, tweede lid][ref2], [artikel 37, derde lid][ref3], [artikel 38j, eerste lid][ref4],
      [artikel 38w, tweede lid, onderdeel a][ref5], of [artikel 38x, eerste lid, onderdeel a][ref6], heeft vervalst of
      valselijk is opgemaakt, waardoor de opgegeven kosten hoger zijn dan de werkelijke kosten.

      2 Indien in het geval, bedoeld in het eerste lid, de door, of ten behoeve van, de landbouwer opgegeven kosten meer
      dan 20% hoger zijn dan de werkelijk gemaakte kosten, wordt de landbouwer voor het kalenderjaar volgend op het jaar
      waarvoor de steun is verleend, uitgesloten van steun op grond van de betreffende steunregeling.

      3 Indien komt vast te staan dat door, of ten behoeve van, de landbouwer, het certificaat als bedoeld in
      [artikel 38j, eerste lid][ref7], is vervalst, valselijk is opgemaakt, of de door de aanvrager opgegeven kosten meer
      dan 20% hoger zijn dan de werkelijk gemaakte kosten, wordt de landbouwer voor het kalenderjaar volgend op het jaar
      waarvoor de steun is verleend, uitgesloten van steunverlening op grond van de [artikelen 38j, eerste lid][ref8],
      [38p, eerste lid][ref9], en [38r, eerste lid][ref10].

      4 De landbouwer die in hetzelfde kalenderjaar meer dan een aanvraag indient, bedoeld in
      [artikel 38w, eerste lid][ref11], komt niet in aanmerking voor steun op grond van [artikel 38u][ref12].


