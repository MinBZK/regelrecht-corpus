        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '60'
    text: |-
      1 Indien verordening 73/2009 en de ter uitvoering daarvan vastgestelde Commissieverordeningen een beroep op
      overmacht of uitzonderlijke omstandigheden mogelijk maken in verband met het niet nakomen van voorwaarden of
      verplichtingen, meldt de landbouwer een geval van overmacht of uitzonderlijke omstandigheden overeenkomstig artikel
      75 van verordening 1122/2009 schriftelijk aan DR met betrekking tot de in [artikel 63][ref1], bedoelde regelingen
      binnen 10 werkdagen na de dag vanaf welke dit voor hem mogelijk is.

      2 De landbouwer voegt bij de melding bewijsstukken bij ter ondersteuning van zijn beroep op overmacht of
      buitengewone omstandigheden als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel63
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '61'
    text: |-
      1 Indien een bedrag aan subsidie ten onrechte is uitbetaald, wordt dit bedrag en de rente daarover overeenkomstig
      artikel 80 van verordening 1122/2009 teruggevorderd.

      2 De rente, bedoeld in het eerste lid, is de wettelijke rente in Nederland geldende op de laatste dag van de
      kalendermaand waarin de subsidie is betaald.

      3 Indien het bedrag, bedoeld in het eerste lid, niet meer bedraagt dan € 100,– exclusief rente, wordt
      overeenkomstig artikel 5 bis van verordening 885/2006 afgezien van terugvordering.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel61
  - number: '62'
    text: |-
      DR, organisaties die bewijsmateriaal leveren als bedoeld in artikel 46, tweede lid, van verordening
      1122/2009 en de ondernemingen die betrokken zijn bij de uitvoering van steunverstrekking op grond van
      [Hoofdstuk 2a, paragraaf 1][ref1], alsmede de instanties die belast zijn met het toezicht op de naleving van
      de in [artikel 3][ref2] en Hoofdstuk 2a, paragraaf 1, bedoelde voorwaarden wisselen de gegevens uit betreffende
      aanvragers die relevant zijn in het kader van bedoeld toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel3
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel62
