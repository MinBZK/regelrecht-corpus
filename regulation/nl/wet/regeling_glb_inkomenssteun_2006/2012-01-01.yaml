  - number: '44'
    text: |-
      Er worden geen rechtstreekse betalingen toegekend aan landbouwers indien het totaalbedrag van de in een bepaald
      kalenderjaar aangevraagde of toe te kennen rechtstreekse betalingen vóór toepassing van de in de artikelen 21 en 23
      van verordening 73/2009 vastgestelde verlagingen en uitsluitingen lager is dan € 500.
    url: https://wetten.overheid.nl/BWBR0019131/2012-01-01#Artikel44
  - number: '55'
    text: |-
      1 De landbouwer die aanspraak maakt op steun in het kader van een van de in
      [artikel 2, eerste lid, onder 2][ref1], bedoelde steunregelingen, maakt gebruik van de verzamelaanvraag, tenzij
      deze regeling een specifieke aanvraagprocedure voorschrijft.

      2 Voor de verzamelaanvraag maakt de landbouwer gebruik van een door de minister vastgesteld formulier dat door de
      landbouwer volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.

      3 De verzamelaanvraag wordt in de periode van 1 april tot en met 15 mei ingediend bij DR.

      4 Bij de verzamelaanvraag legt de landbouwer alle bewijsstukken over die het betrokken betaalorgaan nodig acht voor
      de beoordeling van de aanvraag.

      5 Van de wijziging, verbetering of intrekking van de verzamelaanvraag overeenkomstig Deel II, Titel II, van
      verordening 1122/2009 stelt de landbouwer DR schriftelijk in kennis.

      6 De landbouwer die aanspraak maakt op steun, bedoeld in [artikel 24, eerste lid][ref2], verstrekt tevens de
      volgende informatie bij de verzamelaanvraag:

      a. toestemming aan de minister om persoonsgegevens te verwerken ten behoeve van de controle op de naleving van
      deze regeling,

      b. een verklaring dat hij zich bewust is van alle voorwaarden voor verkrijging van deze steun,

      c. de naam van de verzekeraar met wie de verzekering is afgesloten, en

      d. een verklaring dat hij zich niet meer dan een keer verzekert voor dezelfde schade.

      7 De landbouwer die in aanmerking wil komen voor steun, bedoeld in de [artikelen 38a, eerste lid][ref3],
      [38d, eerste lid][ref4], [38f, eerste lid][ref5] of [38j, eerste lid][ref6], verklaart op de verzamelaanvraag dat
      hij zich bewust is van de voorwaarden voor het ontvangen van deze steun.

      8 De landbouwer die in aanmerking wil komen voor steun, bedoeld in de [artikelen 38a, eerste lid][ref7] en
      [38d, eerste lid][ref8], verleent de minister toestemming om de gegevens die zijn opgenomen in het I&R-systeem
      schapen en geiten en die betrekking hebben op zijn UBN te verwerken ten behoeve van de controle op de naleving van
      deze regeling.

      9 Landbouwers die steun aanvragen, bedoeld in [artikel 38j, eerste lid][ref9], vermelden op de verzamelaanvraag:

      a. het UBN waarop het certificaat betrekking heeft,

      b. een verklaring dat ze zullen voldoen aan het bepaalde in [artikel 38m, eerste lid][ref10],

      c. de sector waarin zij produceren overeenkomstig de voorwaarden van het certificeringssysteem,

      d. de dierenwelzijnsstandaard, bedoeld in [bijlage 6][ref11], waaraan zij zullen voldoen,

      e. dat zij zich bewust zijn van alle voorwaarden voor het verkrijgen van deze steun,

      f. dat zij toestemming verlenen om de relevante gegevens, persoonsgegevens daaronder begrepen, uit te wisselen
      tussen de minister en de verantwoordelijke voor het certificeringssysteem ten behoeve van de controle op de
      naleving van de steunvoorwaarden.

      10 Varkenshouders die steun aanvragen op grond van [artikel 38p, eerste lid][ref12], vermelden op de
      verzamelaanvraag:

      a. het UBN waar de managementmaatregel plaatsvindt,

      b. de maatregel of maatregelen, omschreven in [bijlage 7][ref13], die zij genomen hebben,

      c. het aantal dierplaatsen waarvoor de managementmaatregelen worden genomen,

      d. dat zij zich bewust zijn van alle voorwaarden voor het verkrijgen van deze steun, en

      e. dat zij toestemming verlenen om de relevante gegevens, persoonsgegevens daaronder begrepen, over aanwezigheid
      en behaalde resultaten, uit te wisselen tussen de minister en de aanbieder van de cursus, bedoeld in punt 13 van
      [bijlage 7][ref14].

      11 Vleeskuikenhouders die steun aanvragen op grond van [artikel 38r, eerste lid][ref15], vermelden op de
      verzamelaanvraag:

      a. het UBN waar de managementmaatregel plaatsvindt,

      b. de maatregel of maatregelen, omschreven in [bijlage 8][ref16], die zij genomen hebben,

      c. het aantal dierplaatsen waarvoor de managementmaatregelen worden genomen,

      d. dat zij zich bewust zijn van alle voorwaarden voor het verkrijgen van deze steun, en

      e. dat zij toestemming verlenen om de relevante gegevens, persoonsgegevens daaronder begrepen, over aanwezigheid en
      behaalde resultaten, uit te wisselen tussen de minister, het PPE, of de aanbieder van de cursus, bedoeld in punt 6
      van [bijlage 8][ref17].

      12 De landbouwer die het in aanmerking komende oppervlak van een perceel landbouwgrond wil uitbreiden met sloten
      als bedoeld in artikel 34, tweede lid, van verordening 1122/2009, identificeert deze op de verzamelaanvraag.

      13 Landbouwers vragen om toepassing van de [artikelen 12 tot en met 15][ref18], [artikel 15b][ref19] of
      [artikel 15c][ref20], door het indienen van de verzamelaanvraag.

      14 Landbouwers die een verzoek als bedoeld in [artikel 15b][ref21] willen indienen, verstrekken ten genoegen van de
      minister de benodigde informatie voor het vaststellen van het relevante jaar of de relevante jaren.

      15 Landbouwers die een verzoek als bedoeld in [artikel 15c][ref22] willen indienen, verstrekken:

      a. een kopie van het verkoopcontract,

      b. een omschrijving van de overgedragen aanspraken op bedrijfstoeslag,

      c. een omschrijving van de overgedragen deel van de landbouwonderneming, of landbouwondernemingen,

      d. een omschrijving van het aantal overgedragen hectares landbouwgrond.

      16 Met expliciete toestemming van de verkoper mag een koper het verzoek en de gegevens, bedoeld in het vijftiende
      lid, indienen op zijn verzamelaanvraag.


