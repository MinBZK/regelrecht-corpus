      1 De minister verstrekt op aanvraag steun in de vorm van een tegemoetkoming voor het verrichten van één of meerdere
      van de in [bijlage 8][ref1] omschreven managementmaatregelen.

      2 De steun bedraagt maximaal 60% van de respectievelijke forfaitaire kosten, omschreven in [bijlage 8][ref2].

      3 Het steunplafond bedraagt € 500.000.

      4 Steun als bedoeld in het eerste lid, wordt evenredig verlaagd voor alle voor steun in aanmerking te nemen
      aanvragen indien het totaal van de goedgekeurde aanvragen het steunplafond overstijgt.

      5 Landbouwers verrichten tenminste de in punt 6 van [bijlage 8][ref3] omschreven maatregel.

      6 Landbouwers verrichten de maatregelen, bedoeld in punt 3, 4 en 5 van [bijlage 8][ref4] gedurende het hele
      kalenderjaar van het jaar waarin zij de steun aanvragen.

      7 Landbouwers met een stal als bedoeld in punt E 5.6 of E 5.10, van de [bijlage bij de Regeling ammoniak en
      veehouderij](onbekend), komen niet in aanmerking voor steun voor managementmaatregelen, bedoeld in onderdeel 5, van
      punt 1, van [bijlage 8][ref5].

      8 De steun wordt verstrekt per dierplaats, waarbij bij aanvang van iedere ronde minimaal 17 dieren per m2 worden
      uitgezet in de vleeskuikenstal en waarbij de normen van het [Besluit welzijn productiedieren][ref6] en het
      [Vleeskuikenbesluit 2010][ref7] in acht worden genomen.


