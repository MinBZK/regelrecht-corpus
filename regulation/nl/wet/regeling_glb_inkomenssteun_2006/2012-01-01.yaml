  - number: 70e
    text: |-
      1 Behoudens wijzigingen in de beschikking tot steunverlening als bedoeld in [artikel 35][ref1] stelt de
      minister de steun, bedoeld in [artikel 29, eerste lid][ref2], vast op nihil als de aanvrager afwijkt van het
      investeringsplan voor de realisatie waarvan de minister aan de aanvrager steun heeft verleend.

      2 Indien komt vast te staan dat de aanvrager in de documenten, bedoeld in [artikel 37, derde lid][ref3],
      opzettelijk een foutieve weergave heeft gegeven van de werkelijk gemaakte kosten en de door aanvrager opgegeven
      kosten hoger zijn dan de werkelijke kosten, stelt de minister de steun vast op nihil.

      3 Indien [artikel 34, vierde lid, onderdeel c][ref4], van toepassing is, en de in het tweede lid bedoelde feiten
      betrekking hebben op de vaststelling van de steun voor het jaar waarin de steun is verleend, stelt de minister de
      steun voor het jaar volgend op het jaar waarin steun is verleend eveneens op nihil vast.

      4 Indien [artikel 34, vierde lid, onderdeel c][ref5], van toepassing is, en de in het tweede lid bedoelde feiten
      betrekking hebben op de vaststelling van de steun voor het jaar volgend op het jaar waarin steun is verleend, trekt
      de minister tevens de beschikking tot steunvaststelling voor het jaar waarin steun is verleend in en stelt de steun
      voor dat jaar alsnog vast op nihil.

      5 Indien in het geval, bedoeld in het tweede lid, de door aanvrager opgegeven kosten meer dan 20% hoger zijn dan de
      werkelijk gemaakte kosten, wordt de aanvrager voor het kalenderjaar volgend op het laatste jaar waarvoor de steun
      is verleend, uitgesloten van verlening van steun als bedoeld in [artikel 29, eerste lid][ref6].


