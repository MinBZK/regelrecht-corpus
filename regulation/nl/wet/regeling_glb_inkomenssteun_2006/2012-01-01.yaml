  - number: 38x
    text: |-
      1 De landbouwer aan wie steun is verleend als bedoeld in [38u][ref1]:

      a. verstrekt bewijsmateriaal waaruit ten genoegen van de minister blijkt dat de steunwaardige activiteiten zijn
      verricht en welke kosten daarvoor zijn gemaakt, en

      b. bewaart het bewijsmateriaal in een administratie die voldoet aan de voorschriften, bedoeld in
      [artikel 1:12, derde en vierde lid, van de Regeling LNV-subsidies][ref2].

      2 [Artikel 1:20, vijfde lid, van de Regeling LNV-subsidies][ref3] is van overeenkomstige toepassing bij de betaling
      van steun op grond van [artikel 38u][ref4].

      3 Indien bij de verstrekking van het bewijsmateriaal, bedoeld in het eerste lid, onderdeel a, blijkt dat de
      landbouwer een andere activiteit heeft verricht, dan komt deze activiteit, met inachtneming van de voorschriften
      van deze paragraaf, eveneens voor steun in aanmerking, met dien verstande dat de minister niet meer steun aan de
      landbouwer betaalt dan hem is verleend op grond van [artikel 38w, zesde lid][ref5].


