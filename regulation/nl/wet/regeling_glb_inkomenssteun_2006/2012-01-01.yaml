    text: |-
      De steun, bedoeld in [Hoofdstuk 2a, paragraaf 5][ref1], wordt verlaagd overeenkomstig artikel 58 van verordening
      1122/2009, indien blijkt dat de oppervlakte van de gezamenlijke vaarpercelen waarvoor de steun is aangevraagd
      groter is dan de oppervlakte van de vaarpercelen die op grond van artikel 57 van verordening 1122/2009 zijn
      geconstateerd.


