  - number: '32'
    text: |-
      1 Aanvragen voor steunverlening worden niet in behandeling genomen:

      a. indien deze zijn ingediend na de daarvoor gestelde periode, of

      b. indien de aanvraag tijdig is ingediend maar indien de daarbij verstrekte gegevens en bescheiden onvoldoende zijn
      voor de beoordeling van de aanvraag.

      2 Een landbouwer komt niet in aanmerking voor steun op grond van deze paragraaf indien op grond van
      [artikel 2:38 van de Regeling LNV-subsidies][ref1] al steun is verleend voor dezelfde subsidiabele activiteit.

      3 De landbouwer verleent aan de minister, bij steunaanvragen op grond van [artikel 29, eerste lid][ref2],
      toestemming om zijn gegevens, inclusief persoonsgegevens, uit te wisselen met de minister van Financiën,
      ten behoeve van de controle op de naleving van de steunvoorwaarden van deze regeling en van de
      [Aanwijzingsregeling willekeurige afschrijving en investeringsaftrek milieu-investeringen 2009][ref3].

      4 Indien het eerste lid, onderdeel b, van toepassing is, stelt de minister de landbouwer eerst in de gelegenheid om
      de ontbrekende gegevens binnen 14 werkdagen aan te vullen, alvorens op de aanvraag te beslissen.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel238
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0025316
