        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 70e.2
    text: |-
      Indien komt vast te staan dat de aanvrager in de documenten, bedoeld in [artikel 37, derde lid][ref1], opzettelijk
      een foutieve weergave heeft gegeven van de werkelijk gemaakte kosten en de door aanvrager opgegeven kosten hoger
      zijn dan de werkelijke kosten, stelt de minister de steun vast op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel37
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70e
    references:
      - id: ref1
