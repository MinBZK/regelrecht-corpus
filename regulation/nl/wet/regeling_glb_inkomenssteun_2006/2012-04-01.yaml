        hoofdstuk: 2a
        paragraaf: '5'
  - number: 70d
    text: |-
      Indien komt vast te staan dat de landbouwer de voorwaarden voor betaling van steun, bedoeld in
      [artikel 24, eerste lid][ref1], [artikel 29, eerste lid][ref2], [artikel 38j, eerste lid][ref3],
      [artikel 38p, eerste lid][ref4], [artikel 38r][ref5], respectievelijk [artikel 38u][ref6], niet heeft nageleefd,
      stelt de minister de steun vast op nihil.


