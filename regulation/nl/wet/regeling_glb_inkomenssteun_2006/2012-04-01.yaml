        artikel: 38x
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 70f.2
    text: |-
      Indien in het geval, bedoeld in het eerste lid, de door, of ten behoeve van, de landbouwer opgegeven kosten meer
      dan 20% hoger zijn dan de werkelijk gemaakte kosten, wordt de landbouwer voor het kalenderjaar volgend op het jaar
      waarvoor de steun is verleend, uitgesloten van steun op grond van de betreffende steunregeling.
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70f
  - number: 70f.3
    text: |-
      Indien komt vast te staan dat door, of ten behoeve van, de landbouwer, het certificaat als bedoeld in
      [artikel 38j, eerste lid][ref1], is vervalst, valselijk is opgemaakt, of de door de aanvrager opgegeven kosten meer
      dan 20% hoger zijn dan de werkelijk gemaakte kosten, wordt de landbouwer voor het kalenderjaar volgend op het jaar
      waarvoor de steun is verleend, uitgesloten van steunverlening op grond van artikel 38j, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38j
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70f
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38j
        hoofdstuk: 2a
        paragraaf: '7'
  - number: 70f.4
    text: |-
      De landbouwer die in hetzelfde kalenderjaar meer dan een aanvraag indient, bedoeld in
      [artikel 38w, eerste lid][ref1], komt niet in aanmerking voor steun op grond van [artikel 38u][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38w
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70f
