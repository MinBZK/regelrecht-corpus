  - number: 70a.3
    text: |-
      Aanvragen, bedoeld in [artikel 55d, zesde lid][ref1], komen niet voor goedkeuring in aanmerking indien deze worden
      ingediend na de in dat lid vastgestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55d
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70a
