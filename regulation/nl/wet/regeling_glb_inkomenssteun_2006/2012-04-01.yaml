        artikel: '37'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 70e.3
    text: |-
      Indien [artikel 34, vierde lid, onderdeel c][ref1], van toepassing is, en de in het tweede lid bedoelde feiten
      betrekking hebben op de vaststelling van de steun voor het jaar waarin de steun is verleend, stelt de minister de
      steun voor het jaar volgend op het jaar waarin steun is verleend eveneens op nihil vast.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel34
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70e
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '34'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 70e.4
    text: |-
      Indien [artikel 34, vierde lid, onderdeel c][ref1], van toepassing is, en de in het tweede lid bedoelde feiten
      betrekking hebben op de vaststelling van de steun voor het jaar volgend op het jaar waarin steun is verleend, trekt
      de minister tevens de beschikking tot steunvaststelling voor het jaar waarin steun is verleend in en stelt de steun
      voor dat jaar alsnog vast op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel34
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70e
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '34'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 70e.5
    text: |-
      Indien in het geval, bedoeld in het tweede lid, de door aanvrager opgegeven kosten meer dan 20% hoger zijn dan de
      werkelijk gemaakte kosten, wordt de aanvrager voor het kalenderjaar volgend op het laatste jaar waarvoor de steun
      is verleend, uitgesloten van verlening van steun als bedoeld in [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70e
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 70f.1
    text: |-
      De minister stelt de steun op grond van de betreffende steunregeling vast op nihil indien blijkt dat door,
      of ten behoeve van, de landbouwer een document, bedoeld in [artikel 25, eerste lid, onderdeel c][ref1],
      [artikel 36, tweede lid][ref2], [artikel 37, derde lid][ref3], [artikel 38j, eerste lid][ref4],
      [artikel 38w, tweede lid, onderdeel a][ref5], of [artikel 38x, eerste lid, onderdeel a][ref6], heeft vervalst of
      valselijk is opgemaakt, waardoor de opgegeven kosten hoger zijn dan de werkelijke kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel37
      [ref4]: https://wetten.overheid.nl/BWBR0019131#Artikel38j
      [ref5]: https://wetten.overheid.nl/BWBR0019131#Artikel38w
      [ref6]: https://wetten.overheid.nl/BWBR0019131#Artikel38x
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70f
    references:
      - id: ref1
