        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 70g
    text: |-
      Aanvragen als bedoeld in [artikel 55, elfde lid][ref1], die na 15 mei 2012 bij de minister worden ingediend, worden
      gereduceerd of uitgesloten volgens de in artikel 24 van verordening 1122/2009 vastgestelde systematiek.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2012-04-01#Artikel70g
    references:
