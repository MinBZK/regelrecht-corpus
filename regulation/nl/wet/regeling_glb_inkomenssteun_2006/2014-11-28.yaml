  - number: 70c
    text: |-
      De steun, bedoeld in [Hoofdstuk 2a, paragraaf 5][ref1], en bedoeld in [Hoofdstuk 2a, paragraaf 6][ref2], wordt
      verlaagd overeenkomstig artikel 58 van verordening 1122/2009, indien blijkt dat de oppervlakte van de gezamenlijke
      percelen waarvoor steun is aangevraagd groter is dan de oppervlakte van de percelen die op grond van artikel 57 van
      verordening 1122/2009 zijn geconstateerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70c
