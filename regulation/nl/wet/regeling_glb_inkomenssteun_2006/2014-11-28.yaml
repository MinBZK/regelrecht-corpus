  - number: '1.3'
    text: |-
      In verordening 73/2009 of de daarop gebaseerde verordeningen vastgestelde definities zijn van overeenkomstige
      toepassing.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel1
  - number: '1.4'
    text: |-
      In de [Regeling identificatie en registratie van dieren][ref1] vastgestelde definities zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '2.1'
    text: |-
      Overeenkomstig verordening 73/2009 en met inachtneming van ter uitvoering daarvan vastgestelde
      Commissieverordeningen en deze regeling:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel2
  - number: 2.1.1
    text: |-
      wijst de minister op aanvraag aan landbouwers toeslagrechten op grond van artikel 33, eerste lid, onderdeel b,
      onder ii en iv, van verordening 73/2009 in het kader van de bedrijfstoeslagregeling toe.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel2
  - number: 2.1.2
    text: 'verstrekt de minister op aanvraag aan landbouwers:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel2
  - number: 2.1.2.a
    text: een bedrijfstoeslag, of
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel2
  - number: 2.1.2.b
    text: |-
      specifieke steun op grond van [Hoofdstuk 2a][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019131
        hoofdstuk: 2a
  - number: '2.2'
    text: |-
      De Minister beslist op de aanvraag, bedoeld in het eerste lid, onder 2, uiterlijk op 30 juni van het jaar volgend
      op het jaar van indiening van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel2
  - number: '2.3'
    text: |-
      Vanaf 16 oktober 2011 betaalt de minister op grond van artikel 1 van verordening 784/2011, voorschotten van 50%
      van de betalingen voor de steunaanvragen, bedoeld in het eerste lid, onderdeel 2, onder a, die in 2011 zijn gedaan
      op voorwaarde dat voor die steunaanvragen de toetsing is afgerond van de subsidiabiliteitsvoorwaarden, bedoeld in
      artikel 20 van verordening 73/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel2
  - number: '3'
    text: |-
      Een landbouwer die een aanvraag heeft ingediend voor één van de in [artikel 2][ref1] genoemde steunregelingen neemt
      de volgende bepalingen in acht:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: 3.a
    text: |-
      de in de artikelen 4 en 5 van verordening 73/2009 bedoelde beheerseisen, opgenomen in [bijlage 1][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 3.b
    text: |-
      de in artikel 6 van verordening 73/2009 bedoelde minimumeisen inzake de goede landbouw- en milieuconditie,
      opgenomen in [bijlage 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: '4.1'
    text: |-
      De minister kan met inachtneming van artikel 4, eerste lid, van verordening 1122/2009 bepalen dat het landbouwers
      verboden is blijvend grasland om te zetten in land voor andere vormen van grondgebruik, behoudens voorafgaande
      ontheffing.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel4
  - number: '4.2'
    text: |-
      Een verzoek tot ontheffing wordt ingediend op een door de minister vastgesteld formulier dat door de landbouwer
      volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel4
  - number: '4.3'
    text: |-
      Bij de indiening van het verzoek tot ontheffing legt de landbouwer alle bewijsstukken over die de minister nodig
      acht voor de beoordeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel4
  - number: '5.1'
    text: |-
      Indien het aandeel van het blijvend grasland in de totale oppervlakte landbouwgrond als bedoeld in artikel 3,
      eerste lid, van verordening 1122/2009 met meer dan 10% dreigt af te nemen ten opzichte van het aandeel blijvend
      grasland in 2003, is de landbouwer die beschikt over land dat van blijvend grasland is omgezet in land voor andere
      vormen van grondgebruik, verplicht tot het opnieuw omzetten van land in blijvend grasland. De minister stelt de
      betrokken landbouwer in kennis van deze verplichting en de oppervlakte waarop deze betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel5
  - number: '5.2'
    text: |-
      De landbouwer aan wie de kennisgeving bedoeld in het eerste lid is gegeven, is verplicht tot het omzetten van
      land in blijvend grasland voor het moment van indienen van de eerstvolgende verzamelaanvraag en overeenkomstig de
      voorwaarden van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel5
  - number: '6'
    text: 'Met ingang van 1 januari 2011 komen niet voor verstrekking van steun ingevolge deze regeling in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel6
  - number: 6.a
    text: |-
      rechtspersonen, bedoeld in [artikel 2:1, eerste en tweede lid, van het Burgerlijk Wetboek][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '1'
  - number: 6.b
    text: |-
      bestuursorganen, bedoeld in [artikel 1:1, eerste lid, van de Algemene wet bestuursrecht][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 6.c
    text: |-
      al dan niet als belastingplichtige aangemerkte lichamen, bedoeld in
      [artikel 2, zevende lid, van de Wet op de vennootschapsbelasting 1969][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002672#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002672
        artikel: '2'
  - number: '9.1'
    text: |-
      De bedragen die een landbouwer op grond van de in [artikel 2][ref1] genoemde steunregelingen aan subsidies
      ontvangt, worden conform het bepaalde in artikel 7 van verordening 73/2009 procentueel verlaagd ten behoeve van
      modulatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '9.2'
    text: |-
      De minister past in voorkomend geval de lineaire verlaging toe, bedoeld in artikel 40, derde lid, tweede alinea,
      van verordening 73/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel9
  - number: '10'
    text: |-
      Overeenkomstig de artikelen 64 en 65 van verordening 73/2009 verhoogt de minister de waarde van de toeslagrechten
      die landbouwers op 15 mei 2010 in eigendom hebben, of wijst de minister aan landbouwers nieuwe toeslagrechten toe,
      volgens de berekening, opgenomen in [bijlage 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: '11.1'
    text: |-
      Overeenkomstig de artikelen 64 en 65 van Verordening 73/2009 verhoogt de minister de waarde van de toeslagrechten
      die landbouwers op 15 mei 2010 in eigendom hebben, of wijst de minister aan landbouwers nieuwe toeslagrechten toe
      die op grond van de volgende bepalingen in aanmerking komen voor toewijzing van toeslagrechten:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: 11.1.a
    text: artikel 31 van verordening 73/2009,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: 11.1.b
    text: artikel 26 van verordening 1120/2009, of
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: 11.1.c
    text: artikel 27 van verordening 1120/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: '11.2'
    text: |-
      Landbouwers kunnen verzoeken om toepassing van het eerste lid, onderdeel a, indien hun productie gedurende een of
      meer relevante referentiejaren als bedoeld in [bijlage 4][ref1], door een geval van overmacht of uitzonderlijke
      omstandigheden als bedoeld in artikel 31 van verordening 73/2009, dat zich vóór of gedurende die periode heeft
      voorgedaan is verminderd, hetgeen rechtstreeks ertoe heeft geleid dat de ontvangen directe betalingen in enig jaar
      van de relevante periode met meer dan € 500,– zijn verminderd. In dat geval wijst de minister de toeslagrechten
      van de landbouwer toe op basis van referentiejaren als bedoeld in bijlage 4, waarvan de productie niet is
      beïnvloed door het geval van overmacht of uitzonderlijke omstandigheden. Indien de productie in alle relevante
      referentiejaren, bedoeld in bijlage 4, door een geval van overmacht of uitzonderlijke omstandigheden is beïnvloed,
      wijst de minister de toeslagrechten van de landbouwer toe op basis van een door de minister te bepalen periode
      waarin de productie niet is beïnvloed door het geval van overmacht of uitzonderlijke omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: '11.3'
    text: |-
      Landbouwers die hun aanspraak op toeslagrechten, bedoeld in [artikel 10][ref1], voor 15 mei 2010 hebben
      overgedragen in combinatie met de overdracht van een onderneming met een UBN, kunnen verzoeken om toepassing
      van het eerste lid, onderdeel b. Houders van volwassen runderen of kalveren kunnen alleen een beroep doen op dit
      artikel ten aanzien van de dieren die in de referentieperiode, bedoeld in [bijlage 4][ref2] waren geconstateerd op
      het UBN.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
  - number: '11.4'
    text: |-
      Landbouwers die hun aanspraak op toeslagrechten, bedoeld in artikel 10, voor 15 mei 2010 hebben verhuurd aan een
      onderneming met een UBN, kunnen verzoeken om toepassing van het eerste lid, onderdeel c, als:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: 11.4.a
    text: het aantal verhuurde toeslagrechten niet hoger is dan het aantal verhuurde hectaren grond,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: 11.4.b
    text: de verhuurovereenkomst uiterlijk op 15 mei 2010 ingaat, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: 11.4.c
    text: de verhuurovereenkomst na 15 mei 2010 afloopt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: '11.5'
    text: De verhuurder kan toeslagrechten, bedoeld in het vierde lid, overdragen aan de huurder.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel11
  - number: '12'
    text: |-
      Ter zake van de integratie van de gekoppelde steun voor de productie en verwerking van zetmeelaardappelen, verhoogt
      de minister overeenkomstig artikel 64 van verordening 73/2009 de waarde van toeslagrechten die landbouwers op 15
      mei 2012 in eigendom hebben, of wijst de minister nieuwe toeslagrechten aan landbouwers toe, volgens de berekening,
      opgenomen in [bijlage 9][ref1], punt 1.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: '13'
    text: |-
      Ter zake van de integratie van de gekoppelde steun voor de productie van zaaizaad van vezelvlas, verhoogt de
      minister overeenkomstig artikel 65 van verordening 73/2009 de waarde van toeslagrechten die landbouwers op 15 mei
      2012 in eigendom hebben, of wijst de minister nieuwe toeslagrechten aan landbouwers toe, volgens de berekening,
      opgenomen in [bijlage 9][ref1], punt 2.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: '14'
    text: |-
      Ter zake van de integratie van de gekoppelde steun voor de verwerking van vezelvlas of hennep, verhoogt de minister
      overeenkomstig artikel 64 van verordening 73/2009 de waarde van toeslagrechten die landbouwers op 15 mei 2012 in
      eigendom hebben, of wijst de minister nieuwe toeslagrechten aan landbouwers toe, volgens de berekening, opgenomen
      in [bijlage 9][ref1], punt 3.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: '15'
    text: |-
      Ter zake van de integratie van de gekoppelde steun voor de verwerking van gedroogde voedergewassen, verhoogt de
      minister overeenkomstig artikel 64 van verordening 73/2009 de waarde van toeslagrechten die landbouwers op 15 mei
      2012 in eigendom hebben, of wijst de minister nieuwe toeslagrechten aan landbouwers toe, volgens de berekening,
      opgenomen in [bijlage 9, punt 4][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 15a.1
    text: |-
      Op grond van deze paragraaf verhoogde toeslagrechten, of toegewezen toeslagrechten, overschrijden niet de waarde
      van € 5.000 per toeslagrecht.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15a
  - number: 15a.2
    text: |-
      Voor de uitvoering van de [artikelen 12 tot en met 15][ref1] wordt geen rekening gehouden met rechtshandelingen
      waarvan op grond van bepaalde feiten en omstandigheden kan worden aangenomen dat zij geen wezenlijke verandering
      van feitelijke verhoudingen ten doel hebben gehad, of dat die rechtshandelingen achterwege zouden zijn gebleven
      indien daarmee niet een kleiner aantal toeslagrechten zou zijn verkregen als bedoeld in artikel 64, tweede lid, van
      verordening 73/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel12
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 15b.1
    text: |-
      Landbouwers kunnen met een beroep op artikel 31 van verordening 73/2009 verzoeken om de verhoging van de waarde
      van toeslagrechten, of de toewijzing van nieuwe toeslagrechten, op grond van deze paragraaf op alternatieve wijze
      te berekenen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15b
  - number: 15b.2
    text: 'Een verzoek, bedoeld in het eerste lid, kan alleen worden gedaan indien:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15b
  - number: 15b.2.a
    text: de productie van de landbouwer rechtstreeks is getroffen door overmacht of uitzonderlijke omstandigheden, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15b
  - number: 15b.2.b
    text: |-
      de directe betaling in enig jaar dat relevant is voor de van toepassing zijnde berekening, bedoeld in
      [bijlage 9][ref1], daardoor verminderde met meer dan € 500.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 15b.3
    text: |-
      De alternatieve berekening, bedoeld in het eerste lid, geschiedt in eerste instantie op basis van één of
      meerdere jaren, die relevant zijn voor de van toepassing zijnde berekening, bedoeld in [bijlage 9][ref1], waarin
      de productie van de landbouwer niet is beïnvloed door overmacht of uitzonderlijke omstandigheden. Indien door
      overmacht of uitzonderlijke omstandigheden de productie is beïnvloed in alle relevante jaren voor de van toepassing
      zijnde berekening, bedoeld in bijlage 9, geschiedt de berekening op basis van het door de minister te bepalen meest
      recente jaar dat niet door deze omstandigheden is getroffen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 15c
    text: |-
      Landbouwers die hun aanspraak op toeslagrechten als bedoeld in de [artikelen 12 tot en met 15][ref1] hebben
      overgedragen in combinatie met de overdracht van een onderneming of een deel ervan, kunnen de minister verzoeken om
      toepassing van artikel 26 of artikel 27 van verordening 1120/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel12
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15c
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 15d
    text: |-
      Na toepassing van het bepaalde in de [artikelen 12 tot en met 15c][ref1], verlaagt de minister op grond van artikel
      69, zesde lid, onderdeel b, van verordening 73/2009, op 15 mei 2012 de waarde van aan landbouwers toegewezen
      toeslagrechten met 1%.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel12
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15d
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 15e
    text: |-
      De waarde van alle toeslagrechten, bedoeld in artikel 40, tweede lid, van verordening 73/2009 wordt per 15 mei 2014
      verlaagd met 11%.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15e
  - number: 15f
    text: |-
      De minister verlaagt alle rechtstreekse betalingen met betrekking tot het kalenderjaar 2014, bedoeld in artikel 40,
      derde lid, van verordening 73/2009, met 1,5%.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel15f
  - number: '16.1'
    text: |-
      De minister wijst op grond van artikel 21 van verordening 1120/2009 toeslagrechten uit de nationale reserve toe
      aan landbouwers.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel16
  - number: '16.2'
    text: |-
      Landbouwers kunnen verzoeken om toepassing van het eerste lid, indien zij ten genoegen van de minister aantonen
      dat:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel16
  - number: 16.2.a
    text: |-
      zij in de periode van 1 januari 2006 tot en met 31 december 2009 een investering in uitbreiding van nieuwe
      stalcapaciteit hebben gerealiseerd van meer dan € 100.000,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel16
  - number: 16.2.b
    text: |-
      de investering rechtstreeks heeft geleid tot een stijging van het aantal dieren dat de landbouwer uiterlijk op 1
      april 2010 houdt,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel16
  - number: 16.2.c
    text: |-
      de investering uiterlijk op 31 december 2009 volledig is gerealiseerd en ten minste tot en met 31 december 2010 in
      stand wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel16
  - number: '17.1'
    text: |-
      De toewijzing van toeslagrechten op grond van [artikel 16, eerste lid][ref1], geschiedt aan de hand van de volgende
      berekening:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel16
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 17.1.a
    text: 'er worden vier diercategorieën en daarmee corresponderende vermenigvuldigingsfactoren vastgesteld, respectievelijk:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
  - number: 17.1.a.i
    text: vleeskalveren voor witvlees en rosévlees, jonger dan 8 maanden, met vermenigvuldigingsfactor 1,9,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
  - number: 17.1.a.ii
    text: vleeskalveren voor rosévlees, 8 maanden of ouder, met vermenigvuldigingsfactor 1,4,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
  - number: 17.1.a.iii
    text: vleesstieren, met vermenigvuldigingsfactor 1,0, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
  - number: 17.1.a.iv
    text: overige volwassen runderen, met vermenigvuldigingsfactor 0,3,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
  - number: 17.1.b
    text: |-
      de vermenigvuldigingsfactor, bedoeld in onderdeel a, onderdeel i, wordt vermenigvuldigd met het aantal dieren dat
      binnen de totale stalcapaciteit kan worden gehouden en vervolgens vermenigvuldigd met het bedrag dat overeenstemt
      met het op grond van [artikel 10][ref1] berekende bedrag voor vleeskalveren.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel10
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 17.1.c
    text: |-
      de vermenigvuldigingsfactor, bedoeld in onderdeel a, onderdelen ii, iii en iv, wordt vermenigvuldigd met het aantal
      dieren dat binnen de totale stalcapaciteit kan worden gehouden en vervolgens vermenigvuldigd met het bedrag dat
      overeenstemt met het op grond van [artikel 10][ref1] berekende bedrag voor volwassen runderen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel10
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '17.2'
    text: |-
      Het op grond van het eerste lid berekende bedrag wordt met 0,90 vermenigvuldigd, vervolgens verminderd met het
      door de landbouwer ontvangen bedrag op grond van [artikel 10][ref1] voor volwassen runderen of kalveren, daarna
      verminderd met € 500 en verder evenredig verlaagd indien het totaal van de voor tegemoetkoming in aanmerking te
      nemen aanvragen het bedrag van € 8.500.000 overstijgt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel10
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '17.3'
    text: |-
      Indien het op grond van het eerste en tweede lid berekende bedrag, met uitzondering van het door de landbouwer
      ontvangen bedrag op grond van [artikel 10][ref1] voor volwassen runderen of kalveren, toegepast op het
      extra aantal dieren dat door de investering in stalcapaciteit kan worden gehouden, lager is dan het op
      grond van het eerste en tweede lid berekende bedrag, geldt het lagere bedrag voor de toewijzing op grond van
      [artikel 16, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel16
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '18'
    text: |-
      Indien [artikel 16][ref1] van toepassing is, verhoogt de minister de waarde van de toeslagrechten die landbouwers
      op 15 mei 2010 in eigendom hebben, of wijst de minister nieuwe toeslagrechten toe aan landbouwers overeenkomstig de
      artikelen 64 en 65 van verordening 73/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel16
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '19'
    text: |-
      Indien als gevolg van overheidsinterventie de omvang van een bedrijf is verkleind, waardoor een landbouwer over
      minder hectaren subsidiabele grond beschikt dan het aantal dat overeenstemt met de toeslagrechten die hij in
      het kader van artikel 41, derde lid, van verordening 73/2009 zou krijgen, of heeft gekregen, komt de betrokken
      landbouwer overeenkomstig artikel 18 van verordening 1120/2009 in aanmerking voor toewijzing van toeslagrechten uit
      de nationale reserve.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel19
  - number: '20.1'
    text: 'Voor betalingen op basis van toeslagrechten komen uitsluitend in aanmerking landbouwers die:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel20
  - number: 20.1.a
    text: |-
      hun toeslagrechten activeren als bedoeld in artikel 34, eerste lid, van verordening 73/2009 en daartoe subsidiabele
      hectaren aangeven, overeenkomstig artikel 35, eerste lid, van deze verordening, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel20
  - number: 20.1.b
    text: deze subsidiabele hectaren tot hun beschikking hebben op 15 mei van enig jaar.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel20
  - number: '20.2'
    text: |-
      Onverminderd het bepaalde in artikel 57, tweede lid, van verordening 1122/2009, worden toeslagrechten in een
      zodanige volgorde uitbetaald, dat het behoud van toeslagrechten zoveel mogelijk voorgaat op uitbetaling van
      toeslagrechten met de hoogste waarde.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel20
  - number: '20.3'
    text: |-
      Onverminderd het bepaalde in artikel 57, derde lid, van verordening 1122/2009, vindt de betaling op basis van
      toeslagrechten, in afwijking van het tweede lid, op verzoek van de landbouwer plaats volgens een door hem bepaalde
      volgorde, welke hij uiterlijk op 15 mei kenbaar maakt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel20
  - number: '20.4'
    text: De minimumoppervlakte, bedoeld in artikel 13, negende lid, van verordening 1122/2009 bedraagt 0,01 ha.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel20
  - number: '21.1'
    text: |-
      In afwijking van [artikel 20][ref1] komen in aanmerking voor betalingen op basis van toeslagrechten, landbouwers
      die, zonder opgave van subsidiabele hectaren:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel20
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 21.1.a
    text: beschikken over bijzondere toeslagrechten waarop artikel 44 van verordening 73/2009 van toepassing is;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: 21.1.b
    text: minimaal 50% van de tijdens de referentieperiode uitgeoefende landbouwactiviteit, uitgedrukt in GVE, handhaven; en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: 21.1.c
    text: |-
      uiterlijk op 15 mei een verzoek doen, overeenkomstig artikel 14, derde lid, van verordening 1120/2009, tot
      toepassing van de speciale voorwaarden.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: '21.2'
    text: |-
      Ten bewijze van het voldoen aan de voorwaarden bedoeld in het eerste lid, onderdeel b, voorzover het schapen
      betreft, doet de landbouwer uiterlijk op 15 mei opgave op basis van zijn bedrijfsregister van het betrokken aantal
      dieren uitgedrukt in GVE.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: '21.3'
    text: |-
      Aan het minimumpercentage bedoeld in het eerste lid, onderdeel b, wordt geacht te zijn voldaan indien het
      gemiddelde aantal GVE 50%, doch gedurende een periode van 6 maanden, in geen geval minder dan 25% is.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: '21.4'
    text: |-
      Als bijzondere toeslagrechten als bedoeld in het eerste lid, onder a, worden overgedragen kan de verkrijger slechts
      in aanmerking komen voor het bepaalde in het eerste lid, indien:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: 21.4.a
    text: de bijzondere toeslagrechten in 2009, 2010 of 2011 worden overgedragen, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: 21.4.b
    text: alle bijzondere toeslagrechten van de vervreemder worden overgedragen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
  - number: '21.5'
    text: |-
      In zoverre in afwijking van het eerste lid, onderdeel b, wordt de te handhaven landbouwactiviteit, uitgedrukt in
      GVE, voor landbouwers die toeslagrechten krijgen toegewezen op basis van [artikel 16][ref1], berekend volgens de
      formule, opgenomen in [bijlage 5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
  - number: 21a.1
    text: |-
      Heide en natuurlijk grasland worden als subsidiabele hectare als bedoeld in artikel 34, tweede lid, van verordening
      73/2009 in aanmerking genomen indien deze percelen gedurende het betreffende premiejaar door gemiddeld minimaal
      0,15 GVE per hectare worden begraasd door schapen, geiten of runderen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21a
  - number: 21a.2
    text: |-
      Overeenkomstig artikel 34, vierde en vijfde lid, van verordening 1122/2009 worden met bomen beplante oppervlakten
      binnen een perceel landbouwgrond, met een plantdichtheid van meer dan 50 bomen per hectare, niet voor steun in
      aanmerking genomen. De voorgaande volzin is niet van toepassing op percelen waarop fruitteelt plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21a
  - number: 21a.3
    text: |-
      Onder hakhout met een korte omlooptijd als bedoeld in artikel 34, tweede lid, onder a, van verordening 73/2009
      wordt verstaan woudbomen met omlooptijd van maximaal 10 jaar en bestemd voor de energieproductie.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21a
  - number: 21a.4
    text: |-
      Indien naar het oordeel van de minister blijkt dat een perceel waarvoor steun is aangevraagd geheel of ten
      dele kennelijk niet voor de uitvoering van de landbouw wordt gebruikt of beschikbaar gehouden, dan komt de
      desbetreffende oppervlakte niet in aanmerking als subsidiabele landbouwgrond, bedoeld in artikel 34, eerste lid,
      van verordening 73/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21a
  - number: 21b
    text: |-
      Voor de toepassing van artikel 9 van verordening 1120/2009 wordt landbouwgrond die niet meer dan 90 dagen per
      jaar voor niet-landbouwactiviteiten wordt gebruikt, aangemerkt als overwegend voor landbouwdoeleinden gebruikte
      landbouwgrond.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21b
  - number: 21c.1
    text: |-
      Bij de constatering van de oppervlakte van percelen landbouwgrond worden sloten die zijn gelegen tussen percelen
      landbouwgrond en die niet breder zijn dan 4 meter overeenkomstig door de Europese Commissie aanvaarde meetmethoden
      gerekend tot de volledig gebruikte oppervlakte van de desbetreffende percelen, waarbij de breedte van de sloot voor
      de helft aan elk van de aan weerskanten van de sloot gelegen percelen wordt toegerekend.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21c
  - number: 21c.2
    text: |-
      Bij de constatering van de oppervlakte van percelen landbouwgrond worden sloten die zijn gelegen in een perceel
      landbouwgrond en die elk niet breder zijn dan 2 meter overeenkomstig door de Europese Commissie aanvaarde
      meetmethoden gerekend tot de volledig gebruikte oppervlakte van het desbetreffende perceel.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21c
  - number: 21c.3
    text: |-
      Bij de constatering van de oppervlakte van percelen landbouwgrond worden windhagen die zijn gelegen op een perceel
      landbouwgrond waarop fruitteelt plaatsvindt en die elk niet breder zijn dan 2 meter overeenkomstig de door de
      Europese Commissie aanvaarde meetmethoden gerekend tot de volledig gebruikte oppervlakte van het desbetreffende
      perceel.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21c
  - number: 21c.4
    text: |-
      De minimumoppervlakte, bedoeld in artikel 13, negende lid, van verordening 1122/2009, van sloten bedraagt 0,01
      hectare.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel21c
  - number: '22.1'
    text: |-
      Overdracht van toeslagrechten geschiedt met inachtneming van artikel 43 van verordening 73/2009 en de artikelen 26
      en 27 van verordening 1120/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel22
  - number: '22.2'
    text: |-
      Onverminderd de in verordening 73/2009, 1120/2009, 1122/2009 en 1121/2009 aan de betaling op basis van
      toeslagrechten gestelde voorwaarden kan de aanspraak op betaling in enig premiejaar op basis van de overgedragen
      toeslagrechten slechts worden gemaakt indien de cedent de minister uiterlijk op 31 maart van het desbetreffende
      premiejaar in kennis stelt van de overdracht.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel22
  - number: '23'
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel23
  - number: 23.a
    text: |-
      *open teelten:* open teelten van de sectoren akkerbouw, vollegrondsgroententeelt, bollenteelt, sierteelt,
      fruitteelt en boomkwekerij;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel23
  - number: 23.b
    text: |-
      *premie:* premie, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 23.c
    text: |-
      *schade-expert:* deskundige die de gedragscode van expertiseorganisaties van het Verbond van Verzekeraars of een
      daarmee gelijk te stellen gedragscode in acht neemt;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel23
  - number: 23.d
    text: |-
      *verzekeraar:* verzekeraar, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 23.e
    text: |-
      *verzekering:* verzekering als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: 23.f
    text: '*verzekeringspolis:* bewijs van verzekering tussen landbouwer en verzekeraar.'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel23
  - number: '24.1'
    text: |-
      De minister verstrekt specifieke steun aan landbouwers in de vorm van een financiële bijdrage voor premies ten
      behoeve van verzekeringen, die overeenkomstig [artikel 26, derde lid][ref1], zijn goedgekeurd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel26
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '26'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: '24.2'
    text: |-
      De steun bedraagt 65% van de verzekeringspremie, met dien verstande dat het steunpercentage evenredig
      wordt verlaagd voor alle voor tegemoetkoming in aanmerking te nemen aanvragen indien het totaal van de voor
      tegemoetkoming in aanmerking te nemen aanvragen het bedrag van € 13.333.000 per jaar overstijgt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel24
  - number: '24.3'
    text: De steun betreft uitsluitend de premie, exclusief belastingen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel24
  - number: '24.4'
    text: |-
      Geen steun wordt verstrekt indien de landbouwer van overheidswege een andere bijdrage ontvangt voor de premie,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel24
  - number: '24.5'
    text: |-
      Geen steun wordt verstrekt indien de landbouwer zijn teelt niet tegen alle ongunstige weersomstandigheden, bedoeld
      in [artikel 26, derde lid, onderdeel b][ref1], heeft verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel26
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '26'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: '24.6'
    text: |-
      Geen steun wordt verstrekt ten behoeve van de premie die wordt betaald voor de verzekering van de open teelt op
      landbouwgrond die is gelegen buiten Nederland.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel24
  - number: '25.1'
    text: 'De landbouwer verstrekt de volgende gegevens aan de minister:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel25
  - number: 25.1.a
    text: het polisnummer van de verzekering,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel25
  - number: 25.1.b
    text: een kopie van de verzekeringspolis, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel25
  - number: 25.1.c
    text: een bewijs van betaling van de definitieve verzekeringspremie.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel25
  - number: '25.2'
    text: |-
      De landbouwer is van de verplichting, bedoeld in het eerste lid, vrijgesteld indien de gegevens, bedoeld in het
      eerste lid, voor de in [artikel 55d, vijfde lid][ref1], vastgestelde termijn door de verzekeraar worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55d
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 55d
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '26.1'
    text: |-
      De voorwaarden van de verzekeringen, bedoeld in [artikel 24, eerste lid][ref1], worden op aanvraag goedgekeurd door
      de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '24'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: '26.2'
    text: 'De aanvraag, bedoeld in het eerste lid, gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.2.a
    text: een onderbouwing van de premie;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.2.b
    text: |-
      een verklaring dat de verzekeraar vooraf toestemming verleent aan de minister om persoonsgegevens te verwerken ten
      behoeve van de controle op de naleving van deze regeling;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.2.c
    text: |-
      een verklaring van de verzekeraar dat hij zijn administratie die betrekking heeft op de verzekeringsvoorwaarden ten
      minste 4 kalenderjaren na afloop van de verzekering ter beschikking houdt van de minister;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.2.d
    text: het standaardmodel van de verzekeringspolis, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.2.e
    text: |-
      documenten waarin de verzekeraar ten genoegen van de minister aantoont dat de verzekeringsvoorwaarden voldoen aan
      het bepaalde in deze regeling.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '26.3'
    text: 'De minister verleent uitsluitend goedkeuring aan de verzekeringsvoorwaarden indien:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.a
    text: 'het financieel verlies van de landbouwer wordt gedekt:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.a.i
    text: voor zover dat meer is dan 30% van de gemiddelde jaarproductie in de laatste drie jaar,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.a.ii
    text: als gevolg van een lagere opbrengst in kwantiteit of kwaliteit,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.a.iii
    text: dat optreedt op een aaneengesloten stuk grond waarop één enkel gewas wordt geteeld, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.a.iv
    text: redelijkerwijs is toe te rekenen aan ongunstige weersomstandigheden,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.b
    text: 'onder ongunstige weersomstandigheden in elk geval zijn begrepen:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.b.i
    text: |-
      weersomstandigheden die volgens een schade-expert of het Koninklijk Nederlands Meteorologisch Instituut met een
      natuurramp kunnen worden gelijkgesteld, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.b.ii
    text: |-
      de volgende ongunstige weersomstandigheden: regenval; droogte; (nacht)vorst; sneeuw; ijzel; storm; hagel; erosie en
      brand door blikseminslag;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.c
    text: alle open teelten verzekerd kunnen worden;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.d
    text: geen eisen worden gesteld aan de aard of hoeveelheid van de toekomstige productie door de verzekerde;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.e
    text: de voorwaarde wordt gesteld dat de schade wordt vastgesteld door een schade-expert;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.f
    text: |-
      niet wordt uitgekeerd voorzover de landbouwer van overheidswege een tegemoetkoming in de schade ontvangt die ertoe
      leidt dat hij meer compensatie ontvangt dan hij schade heeft geleden;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.g
    text: slechts één keer tot uitkering wordt gekomen voor een en de zelfde gebeurtenis bij dezelfde teelt,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.h
    text: de verzekering wordt aangegaan per kalenderjaar,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.i
    text: 'de verzekering geen dekking biedt voor:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.i.i
    text: genomen preventiemaatregelen, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: 26.3.i.ii
    text: |-
      bereddingsmaatregelen die genomen zijn op grond van de verzekeringspolis of [artikel 7:957 BW][ref1], maar waarbij
      geen verlies, bedoeld in onderdeel a, is opgetreden, en


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel957
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '957'
  - number: 26.3.j
    text: de verzekeraar verklaart dat hij niet meer dan een keer dezelfde schade van de landbouwer verzekert.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '26.4'
    text: |-
      De weersomstandigheden bedoeld in het derde lid, onderdeel b, worden geacht vooraf te zijn erkend door de minister,
      als bedoeld in artikel 70, vierde lid, tweede alinea, van verordening 73/2009. De minister kan in aanvulling
      daarop, na overleg met de brancheorganisatie van verzekeraars, ook andere ongunstige weersomstandigheden erkennen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '26.5'
    text: |-
      In afwijking van het derde lid, onderdeel a, mag een verzekering ook tot uitkering komen bij een financieel
      verlies van minder dan 30%, mits de verzekeraar ten genoegen van de minister onderscheidt welk deel van de
      premie betrekking heeft op vergoeding van het financieel verlies van de landbouwer van minder dan 30%. In dat
      geval heeft de steun slechts betrekking op het gedeelte van de premie dat ziet op verzekeringsvoorwaarden die in
      overeenstemming zijn met de bepalingen van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '26.6'
    text: Het onderscheid, bedoeld in het vijfde lid, moet helder zijn omschreven in de verzekeringsvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '26.7'
    text: |-
      In afwijking van het derde lid, onderdeel h, mag een verzekering voor meer dan een kalenderjaar worden aangegaan,
      mits de premie jaarlijks wordt betaald en de jaarlijkse premie betrekking heeft op de productie van één
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '26.8'
    text: De minister publiceert de goedgekeurde verzekeringsvoorwaarden op www.minlnv.nl.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '26.9'
    text: |-
      De minister keurt alleen een verzekering goed indien de verzekeraar verklaart dat de minister in kennis wordt
      gesteld van eventuele aanpassingen in de administratie van de verzekeraar, voorzover deze aanpassingen negatieve
      gevolgen hebben voor de betrouwbaarheid van de daarin verwerkte gegevens.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel26
  - number: '27.1'
    text: |-
      In afwijking van [artikel 26, derde lid, onderdeel e][ref1], mag de schade worden vastgesteld op basis van een
      rekenmodel.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel26
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '26'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: '27.2'
    text: Het rekenmodel wordt tezamen met de verzekeringsvoorwaarden goedgekeurd door de minister.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel27
  - number: '27.3'
    text: |-
      De minister keurt het rekenmodel uitsluitend goed indien de verzekeraar aantoont dat de uitkomsten van het
      rekenmodel vergelijkbaar zijn met een schadebeoordeling door een schade-expert. Het rekenmodel bevat daartoe
      tenminste de noodzakelijke gegevens om de schade vast te kunnen stellen aan de hand van bedrijfsspecifieke gegevens
      van het landbouwbedrijf zoals het gewas en grondsoort op perceelsniveau en de feitelijke weersomstandigheid die de
      schade veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel27
  - number: '27.4'
    text: |-
      De verzekeraar onderzoekt elk gebruik van het rekenmodel met behulp van een steekproef. De resultaten worden ter
      beschikking gehouden van de minister.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel27
  - number: '28'
    text: |-
      In deze paragraaf wordt verstaan onder *integraal duurzame stal of houderijsysteem*: stal of houderijsysteem dat
      voldoet aan bovenwettelijke normen op het gebied van dierenwelzijn en minimaal voldoet aan wettelijke normen op de
      gebieden: milieu, energie, diergezondheid, landschappelijke inpasbaarheid en arbeidsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel28
  - number: '29.1'
    text: |-
      De minister verstrekt op aanvraag steun aan houders van melkrunderen, vleesrunderen, varkens, vleeskalveren,
      pluimvee en konijnen voor:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
  - number: 29.1.a
    text: de bouw van een integraal duurzame stal of houderijsysteem;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
  - number: 29.1.b
    text: de verbouwing van een bestaande stal of houderijsysteem tot een integraal duurzame stal of houderijsysteem, of
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
  - number: 29.1.c
    text: |-
      de installatie van het noodzakelijke materieel voor de werking van de integraal duurzame stal of het integraal
      duurzame houderijsysteem.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
  - number: '29.2'
    text: |-
      Het steunpercentage bedraagt 45% van de in aanmerking komende kosten, bedoeld in [artikel 33, eerste lid][ref1],
      uit het investeringsplan die zijn gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel33
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '33'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '29.3'
    text: De minister verstrekt ten hoogste € 250.000 steun per aanvraag tot steunverlening.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
  - number: '29.4'
    text: |-
      Het steunplafond voor betalingen op grond van het eerste lid bedraagt voor aanvragen die zijn gedaan in de periode
      1 maart 2014 tot en met 31 maart 2014 € 9.500.000.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
  - number: '29.5'
    text: |-
      Indien blijkt dat het totale bedrag van de toe te kennen steun voor de steun, bedoeld in
      [artikel 37a, eerste lid][ref1], lager is dan het steunplafond, bedoeld in artikel 37a, vijfde lid, dan wordt het
      overblijvende bedrag zo nodig toegevoegd aan het steunplafond, bedoeld in het vierde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel37a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 37a
        hoofdstuk: 2a
        paragraaf: '3'
  - number: '30.1'
    text: |-
      De landbouwer verzoekt door middel van een aanvraag tot steunverlening om toekenning van steun op grond van
      [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '30.2'
    text: |-
      De aanvraag tot steunverlening gaat vergezeld van de documenten, bedoeld in
      [bijlage 2, hoofdstuk 4, onderdeel D, eerste alinea, onderdelen a, b en c, van de Regeling LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: '30.3'
    text: |-
      De landbouwer meldt bij de aanvraag tot steunverlening of hij in het bezit is van de in voorkomend geval
      noodzakelijke vergunningen voor de uitvoering van het investeringsplan, of dat hij deze heeft aangevraagd, en
      verklaart dat hij ermee bekend is dat het ontbreken van dergelijke vergunningen of de niet tijdige beschikbaarheid
      ervan geen grond is voor toepassing van [artikel 35][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel35
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '35'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '31.1'
    text: De landbouwer kan slechts één aanvraag tot steunverlening per jaar indienen op grond van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel31
  - number: '31.2'
    text: |-
      De landbouwer komt alleen voor steun op grond van [artikel 29, eerste lid][ref1], in aanmerking voor activiteiten
      die zijn verricht op of na de beslissing, bedoeld in [artikel 34, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel34
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '34'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '31.3'
    text: |-
      De landbouwer realiseert het investeringsplan of de door de minister bepaalde onderdelen daarvan binnen de termijn
      die de minister heeft gesteld in de beschikking tot steunverlening.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel31
  - number: '31.4'
    text: |-
      De landbouwer dient de aanvragen op grond van deze paragraaf in bij de minister met gebruikmaking van een
      daartoe door de minister verstrekt formulier en verklaart daarbij dat hij zich bewust is van de voorwaarden voor
      verkrijging van deze steun.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel31
  - number: '32.1'
    text: 'Aanvragen voor steunverlening worden niet in behandeling genomen:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel32
  - number: 32.1.a
    text: indien deze zijn ingediend na de daarvoor gestelde periode, of
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel32
  - number: 32.1.b
    text: |-
      indien de aanvraag tijdig is ingediend maar indien de daarbij verstrekte gegevens en bescheiden onvoldoende zijn
      voor de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel32
  - number: '32.2'
    text: |-
      Een landbouwer komt niet in aanmerking voor steun op grond van deze paragraaf indien op grond van
      [artikel 2:38 van de Regeling LNV-subsidies][ref1] al steun is verleend voor dezelfde subsidiabele activiteit.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '2'
  - number: '32.3'
    text: |-
      De landbouwer verleent aan de minister, bij steunaanvragen op grond van [artikel 29, eerste lid][ref1],
      toestemming om zijn gegevens, inclusief persoonsgegevens, uit te wisselen met de minister van Financiën,
      ten behoeve van de controle op de naleving van de steunvoorwaarden van deze regeling en van de
      [Aanwijzingsregeling willekeurige afschrijving en investeringsaftrek milieu-investeringen 2009][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0025316
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0025316
  - number: '32.4'
    text: |-
      Indien het eerste lid, onderdeel b, van toepassing is, stelt de minister de landbouwer eerst in de gelegenheid om
      de ontbrekende gegevens binnen 14 werkdagen aan te vullen, alvorens op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel32
  - number: '33.1'
    text: 'In aanmerking komende kosten zijn de meerkosten van investeringen in:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.1.a
    text: de bouw of inrichting van integraal duurzame en diervriendelijke stallen en houderijsystemen,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.1.b
    text: |-
      de verbetering van bestaande stallen en houderijsystemen tot integraal duurzame en diervriendelijke stallen en
      houderijsystemen, of
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.1.c
    text: |-
      de kosten voor de montage en installatie van het noodzakelijke materieel voor de werking van integraal duurzame en
      diervriendelijke stallen of houderijsystemen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: '33.2'
    text: 'De investeringen, bedoeld in het eerste lid, betreffen ten minste:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.2.a
    text: |-
      een aparte vrijloopruimte in de melkveestal voor afkalvende en zieke dieren of ligplekken in de melkveestal die
      zijn voorzien van een andere ondergrond dan beton, voor zover de stal of het houderijsysteem is bestemd voor
      runderen die worden gehouden ter productie van melk;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.2.b
    text: |-
      voorzieningen die daglicht toelaten in de stal of het houderijsysteem, voor zover deze respectievelijk dit is
      bestemd voor vleesrunderen;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.2.c
    text: |-
      groepshuisvesting zonder individuele ligboxen voor dragende zeugen met voerstations, trog- of vloervoedering, voor
      zover de stal of het houderijsysteem is bestemd voor varkens;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.2.d
    text: |-
      ligplekken die zijn voorzien van rubbermateriaal, voor zover de stal of het houderijsysteem bestemd is voor
      vleeskalveren;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.2.e
    text: |-
      een overdekte of niet-overdekte uitloop en voorzieningen die daglicht toelaten in de stal of het houderijsysteem,
      voor zover deze respectievelijk dit is bestemd voor pluimvee, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: 33.2.f
    text: |-
      groepshuisvesting met schuilmogelijkheden, plastic roosters en voorzieningen die daglicht toelaten in de stal of
      het houderijsysteem, voor zover deze respectievelijk dit is bestemd voor konijnen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: '33.3'
    text: |-
      Een investering komt alleen voor steun op grond van deze paragraaf in aanmerking indien deze noodzakelijk is voor
      de realisatie van een integraal duurzame stal of houderijsysteem.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: '33.4'
    text: |-
      Gangbare, reguliere of vervangingsinvesteringen en investeringen die gericht zijn op het voldoen aan bestaande
      wettelijke eisen, komen niet voor steun in aanmerking op grond van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: '33.5'
    text: |-
      Een investering die al uit hoofde van andere openbare middelen is gesubsidieerd of gefinancierd komt niet voor
      steun in aanmerking.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: '33.6'
    text: |-
      [Artikel 1:20, vijfde lid, van de Regeling LNV-subsidies][ref1] is van overeenkomstige toepassing bij de
      verstrekking van steun op grond van [artikel 29, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '33.7'
    text: BTW is niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel33
  - number: '34.1'
    text: |-
      De minister stelt een commissie in die advies uitbrengt over de onderdelen van het investeringsplan en over de
      rangschikking van de aanvragen voor steunverlening.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: '34.2'
    text: |-
      De minister rangschikt aanvragen tot steun als bedoeld in [artikel 29, eerste lid][ref1], die in de periode 1 maart
      2014 tot en met 31 maart 2014 zijn ingediend in de navolgende volgorde van categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 34.2.a
    text: |-
      aanvragen, afkomstig van houders van pluimvee die investeringen verrichten als bedoeld in
      [artikel 33, tweede lid, onderdeel e][ref1], voor dieren van de soort Gallus gallus die worden gehouden ten behoeve
      van de productie van vlees;


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel33
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '33'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: 34.2.b
    text: overige aanvragen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: '34.3'
    text: |-
      Indien het totaalbedrag van de ingediende aanvragen, bedoeld in het tweede lid, onderdeel a, hoger is dan het
      beschikbare budget, worden binnen desbetreffende categorie aanvragen gerangschikt volgens het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: '34.4'
    text: |-
      Indien het totaalbedrag van de ingediende aanvragen hoger is dan het beschikbare budget en nadat voor de
      aanvragen, bedoeld in het tweede lid, onderdeel a, een beschikking omtrent steunverlening als bedoeld in
      [artikel 29, eerste lid][ref1], is afgegeven, worden binnen de categorie, bedoeld in het tweede lid, onderdeel b,
      aanvragen gerangschikt volgens het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '34.5'
    text: 'Voor de toepassing van het derde en vierde lid wordt een aanvraag hoger gerangschikt naarmate:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.5.a
    text: |-
      de integraal duurzame stal of houderijsysteem waarin de landbouwer investeert in de beginfase van marktintroductie
      verkeert;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.5.b
    text: de investering in de integraal duurzame stal of houderijsysteem meer economisch of technisch perspectief heeft;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.5.c
    text: |-
      er voor de investering in de integraal duurzame stal of houderijsysteem een betere verhouding tussen de prijs en
      kwaliteit bestaat, gezien het aangevraagde steunbedrag en de verbetering van het dierenwelzijn;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.5.d
    text: |-
      er voor de investering in de integraal duurzame stal of houderijsysteem een betere verhouding tussen de prijs
      en kwaliteit bestaat, gezien het aangevraagde steunbedrag en de verbetering van het milieu, diergezondheid,
      arbeidsomstandigheden of landschappelijke inpasbaarheid, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.5.e
    text: |-
      de landbouwer al dan niet in het bezit is van de in voorkomend geval noodzakelijke vergunningen voor de
      uitvoering van het investeringsplan dan wel deze vergunningen heeft aangevraagd op het moment van de aanvraag tot
      steunverlening.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: '34.6'
    text: |-
      De minister beslist binnen vier maanden na de uiterste datum waarop aanvragen tot steunverlening als bedoeld in
      [artikel 30, eerste lid][ref1], kunnen worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel30
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '30'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '34.7'
    text: 'De beschikking tot steunverlening bevat de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.7.a
    text: het goedgekeurde investeringsplan, inclusief de essentiële onderdelen daarin;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.7.b
    text: de termijnen voor realisatie van onderdelen van het investeringsplan;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: 34.7.c
    text: de ten hoogste te verstrekken steun.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel34
  - number: '35.1'
    text: |-
      Op aanvraag kan de minister de beschikking tot steunverlening wijzigen ten behoeve van een aanpassing van het
      investeringsplan. De steun die met de beschikking op grond van dit artikel wordt verstrekt is nooit hoger dan de
      steun die zou worden verstrekt op grond van de beschikking tot steunverlening.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel35
  - number: '35.2'
    text: |-
      Een aanvraag als bedoeld in het eerste lid kan niet worden gegrond op de afwezigheid of niet tijdige
      beschikbaarheid van voor de uitvoering van het investeringsplan noodzakelijke vergunningen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel35
  - number: '37.1'
    text: Op aanvraag stelt de minister de steun vast.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37
  - number: '37.2'
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat in ieder geval vergezeld van de documenten waaruit blijkt dat de
      landbouwer het investeringsplan heeft gerealiseerd en wat daarvoor de gemaakte kosten zijn.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37
  - number: '37.3'
    text: |-
      Bij de steunvaststelling moet ten genoegen van de minister gebleken zijn dat de landbouwer heeft voldaan aan alle
      voorwaarden die bij de steunverlening zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37
  - number: '37.4'
    text: |-
      De minister stelt de steun ambtshalve vast indien er geen aanvraag is ingediend na afloop van de in
      [artikel 55d, tweede lid, onderdeel b][ref1], gestelde relevante termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55d
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 55d
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 37a.1
    text: |-
      De minister verstrekt op aanvraag steun aan landbouwers voor de koop en installatie van apparatuur, installaties of
      machines voor:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.a
    text: |-
      mechanische scheiding, zoals vijzelpers of schroefpersfilter, zeefbandpers, centrifuge of decanter, trommelfilter,
      kamerfilter, towerfilter;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.b
    text: bezinking;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.c
    text: vacuümdestillatie en dampcompressie;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.d
    text: het strippen of scrubben;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.e
    text: het indikken en drogen;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.f
    text: het composteren;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.g
    text: het maken van mestkorrels;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.h
    text: omgekeerde osmose, of
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.1.i
    text: monovergisting van mest.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.2
    text: 'Steun wordt uitsluitend verstrekt indien:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.2.a
    text: |-
      met de apparatuur, installaties of machines ten hoogste een hoeveelheid mest kan worden bewerkt die gelijk is aan
      de hoeveelheid mest die de landbouwonderneming die de steun heeft aangevraagd, heeft geproduceerd gedurende het
      kalenderjaar voorafgaand aan de aanvraag tot steun;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.2.b
    text: |-
      ten minste 60% van de hoeveelheid stikstof in de te bewerken mest, bedoeld in onderdeel a, kan worden toegepast op
      de landbouwgronden die in gebruik zijn bij de landbouwonderneming die de steun heeft aangevraagd, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.2.c
    text: |-
      de in aanmerking komende kosten, bedoeld in [artikel 38, vierde lid][ref1], ten minste € 20.000 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '38'
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 37a.3
    text: |-
      De hoeveelheid mest, bedoeld in het tweede lid, onderdeel a, wordt berekend aan de hand van de
      forfaitaire normen voor stikstofproductie voor de onderscheiden diersoorten en diercategorieën, bedoeld
      in [bijlage D van de Uitvoeringsregeling Meststoffenwet][ref1] en de hoeveelheid stikstof, bedoeld
      in het tweede lid, onderdeel b, wordt berekend aan de hand van de gebruiksnorm voor stikstof van
      170 kilogram per hectare landbouwgrond of, voor wat betreft bedrijven van de landbouwer, bedoeld in
      [artikel 25 Uitvoeringsregeling Meststoffenwet][ref2], 250 kilogram per hectare landbouwgrond.


      [ref1]: https://wetten.overheid.nl/BWBR0018989
      [ref2]: https://wetten.overheid.nl/BWBR0018989#Artikel25
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0018989
      - id: ref2
        bwb_id: BWBR0018989
        artikel: '25'
  - number: 37a.4
    text: |-
      De steun bedraagt 25% van de in aanmerking komende kosten uit de offerte die zijn gerealiseerd in de periode vanaf
      de datum van de steunverlening tot en met 28 februari 2015, met dien verstande dat de steun ten hoogste € 50.000
      bedraagt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.5
    text: |-
      Het steunplafond voor betalingen op grond van het eerste lid bedraagt voor aanvragen gedaan in de periode 1 maart
      2014 tot en met 31 maart 2014 € 5.000.000.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
  - number: 37a.6
    text: |-
      Indien blijkt dat het totale bedrag van de toe te kennen steun voor de steun, bedoeld in [artikel 29][ref1], lager
      is dan het steunplafond, bedoeld in artikel 29, vierde lid, dan wordt het overblijvende bedrag zo nodig toegevoegd
      aan het steunplafond, in het vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel37a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '38.1'
    text: |-
      De landbouwer verzoekt door middel van een aanvraag tot steunverlening om toekenning van steun op grond van
      [artikel 37a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel37a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 37a
        hoofdstuk: 2a
        paragraaf: '3'
  - number: '38.2'
    text: |-
      De aanvraag gaat vergezeld van de documenten, bedoeld in
      [bijlage 2, hoofdstuk 7, onderdeel D, eerste lid, onder a van de Regeling LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0021281
  - number: '38.3'
    text: |-
      De landbouwer, bedoeld in het eerste lid, verleent bij de aanvraag toestemming voor het gebruik van relevante
      gegevens ten aanzien van de mestproductie op en mestvervoer van zijn bedrijf ten behoeve van de controle op de
      voorwaarden, bedoeld in [artikel 37a, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel37a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 37a
        hoofdstuk: 2a
        paragraaf: '3'
  - number: '38.4'
    text: 'In aanmerking komende kosten zijn de kosten van investeringen in:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
  - number: 38.4.a
    text: apparatuur, installaties of machines waarvan de aanvrager de eerste gebruiker is;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
  - number: 38.4.b
    text: de kosten voor montage en installatie van het noodzakelijke materieel door een aannemer of leverancier.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
  - number: '38.5'
    text: |-
      De [artikelen 31][ref1], [32][ref2], [33, derde tot en met vijfde lid en zevende lid][ref3], zijn van
      overeenkomstige toepassing op de verstrekking van steun op grond van [artikel 37a, eerste lid][ref4], waarbij ‘het
      investeringsplan’ in artikel 31, derde lid, wordt gelezen als ‘de offerte’ en waarbij ‘een integraal duurzame stal
      of houderijsysteem’ in artikel 33, derde lid, wordt gelezen als: een mestbewerkingsinstallatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel33
      [ref4]: https://wetten.overheid.nl/BWBR0019131#Artikel37a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '31'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '32'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019131
        artikel: '33'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0019131
        artikel: 37a
        hoofdstuk: 2a
        paragraaf: '3'
  - number: '38.6'
    text: |-
      [Artikel 1:20, vijfde lid, van de Regeling LNV-subsidies][ref1] is van overeenkomstige toepassing bij de
      verstrekking van de steun op grond van [artikel 37a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel37a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: 37a
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 38a.1
    text: |-
      De minister rangschikt aanvragen tot steunverlening die in de periode 1 maart 2014 tot en met 31 maart 2014 zijn
      ingediend door loting.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38a
  - number: 38a.2
    text: |-
      Volgens de rangschikking, bedoeld in het eerste lid, komt de hoogst gerangschikte aanvraag het eerst voor steun
      in aanmerking.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38a
  - number: 38a.3
    text: |-
      De minister beslist uiterlijk vier maanden na de uiterste datum waarop aanvragen tot steunverlening als bedoeld in
      [artikel 38, eerste lid][ref1], kunnen worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '38'
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 38a.4
    text: 'De beschikking tot steunverlening bevat de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38a
  - number: 38a.4.a
    text: de goedgekeurde investeringen;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38a
  - number: 38a.4.b
    text: de termijn waarbinnen de investering wordt gerealiseerd;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38a
  - number: 38a.4.c
    text: de ten hoogste te verstrekken steun.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38a
  - number: 38b.1
    text: Op aanvraag van de landbouwer stelt de minister de steun vast.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38b
  - number: 38b.2
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat in ieder geval vergezeld van de documenten waaruit blijkt dat de
      apparatuur, installaties of machines zijn geleverd en geïnstalleerd en wat daarvoor de gemaakte kosten zijn.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38b
  - number: 38b.3
    text: |-
      Bij de steunvaststelling moet ten genoegen van de minister gebleken zijn dat de landbouwer heeft voldaan aan alle
      voorwaarden die bij de steunverlening zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38b
  - number: 38b.4
    text: |-
      Indien bij de verstrekking van de documenten, bedoeld in het tweede lid, blijkt dat de landbouwer andere apparatuur
      of een andere installatie of machine heeft gekocht en geïnstalleerd, dan komt deze koop en installatie, met
      inachtneming van de voorschriften van deze paragraaf, in plaats van de aangevraagde steun voor steun in aanmerking,
      met dien verstande dat de minister niet meer steun aan de landbouwer betaalt dan hem is verleend in de beschikking
      tot steunverlening, bedoeld in [artikel 38a, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38a
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 38b.5
    text: |-
      De minister stelt de steun ambtshalve vast indien er geen aanvraag is ingediend na afloop van de in
      [artikel 55d, tweede lid, onderdeel b][ref1], gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55d
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 55d
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 38e
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38e
  - number: 38e.a
    text: |-
      *vaarvergoeding:* vergoeding voor het verrichten van landbouwactiviteiten, als bedoeld in artikel 2, onder c, van
      verordening 73/2009, op een vaarperceel.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38e
  - number: 38e.b
    text: |-
      *vaarperceel:* perceel dat als zodanig is aangewezen in [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 38f.1
    text: |-
      De minister verstrekt specifieke steun aan landbouwers in de vorm van een vaarvergoeding van € 500 per hectare per
      jaar voor vaarpercelen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38f
  - number: 38f.2
    text: |-
      Indien voor het desbetreffende perceel reeds subsidie voor het uitrijden van ruige mest uit
      hoofde van de Subsidieverordening natuur- en landschapsbeheer van de onderscheiden provincies, de
      [Subsidieregeling agrarisch natuurbeheer][ref1] of de Subsidieregeling agrarisch natuurbeheer van de onderscheiden
      provincies wordt toegekend, wordt de steun, bedoeld in het eerste lid, verlaagd met het bedrag dat per hectare voor
      het desbetreffende perceel wordt ontvangen aan subsidie voor het uitrijden van ruige mest.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 38f.3
    text: |-
      De vaarvergoeding wordt evenredig verlaagd voor alle voor vaarvergoeding in aanmerking te nemen aanvragen
      indien het totaal van de voor steun in aanmerking te nemen aanvragen het bedrag van € 1.100.000 per kalenderjaar
      overstijgt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38f
  - number: 38g
    text: 'Een landbouwer komt uitsluitend in aanmerking voor steun op grond van deze paragraaf indien:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38g
  - number: 38g.a
    text: |-
      de totale oppervlakte van de vaarpercelen waarvoor hij steun op grond van deze paragraaf ontvangt tenminste 0,5
      hectare bedraagt;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38g
  - number: 38g.b
    text: |-
      hij in de verzamelaanvraag heeft aangegeven in te stemmen met de verwerking door de minister van de
      persoonsgegevens die betrekking hebben op de subsidie voor het uitrijden van ruige mest die de minister heeft
      verkregen in het kader van de subsidieaanvraag op grond van de Subsidieverordening natuur- en landschapsbeheer, de
      [Subsidieregeling agrarisch natuurbeheer][ref1] of de Subsidieregeling agrarisch natuurbeheer van de onderscheiden
      provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 38h
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38h
  - number: 38h.a
    text: '*vezelgewassen:* vezelvlas en vezelhennep;'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38h
  - number: 38h.b
    text: '*teler:* een natuurlijke- of rechtspersoon die vezelgewassen teelt;'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38h
  - number: 38h.c
    text: '*verwerken van vezelgewassen:* het scheiden van de vezels en houtachtige delen van de stengels van vezelgewassen;'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38h
  - number: 38h.d
    text: '*verwerker:* een natuurlijke- of rechtspersoon die vezelgewassen ten behoeve van de vezelwinning verwerkt.'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38h
  - number: 38i.1
    text: |-
      De minister verstrekt op aanvraag specifieke steun aan telers van vezelgewassen in de vorm van een
      instandhoudingsvergoeding van € 270 per hectare van de in 2014 geteelde oppervlakte vezelgewassen waarvan de teler
      de oogst zelf verwerkt, laat verwerken, of verkoopt aan een verwerker.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.2
    text: |-
      De steun, bedoeld in het eerste lid, wordt verstrekt voor ten hoogste de oppervlakte van de door de teler in 2014
      in zijn Gecombineerde Opgave opgegeven gewasareaal aan vezelgewassen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.3
    text: 'Een teler komt uitsluitend in aanmerking voor steun op grond van deze paragraaf indien:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.3.a
    text: |-
      in het geval dat de teler de oogst van de oppervlakte vezelgewassen waarvoor hij steun op grond van deze paragraaf
      aanvraagt verkoopt aan een verwerker, hij beschikt over een verkoopovereenkomst met een verwerker en deze
      verkoopovereenkomst gedurende 3 jaar nadat de steun is vastgesteld bewaart in zijn bedrijfsadministratie;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.3.b
    text: |-
      in het geval dat de teler de oogst van de oppervlakte vezelvlas waarvoor hij steun op grond van deze paragraaf
      aanvraagt laat verwerken door een verwerker, hij beschikt over een verwerkingsovereenkomst met een verwerker en
      deze verwerkingsovereenkomst gedurende 3 jaar nadat de steun is vastgesteld bewaart in zijn bedrijfsadministratie;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.3.c
    text: |-
      de oppervlakte vezelgewassen waarvoor hij steun op grond van deze paragraaf ontvangt tenminste 0,5 hectare
      bedraagt;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.3.d
    text: |-
      hij verklaart dat hij de vezelgewassen waarvoor hij steun op grond van deze paragraaf aanvraagt ten behoeve van de
      vezelwinning teelt en de vezelgewassen daartoe zelf zal verwerken of zal laten verwerken door een verwerker;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.3.e
    text: |-
      indien hij vezelhennep teelt, hij de oppervlakte, bedoeld in het eerste lid, gebruikt in overeenstemming met
      artikel 39, eerste volzin, van verordening 73/2009 en artikel 10 van verordening 1120/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.4
    text: |-
      De steun wordt evenredig verlaagd voor alle voor steun in aanmerking te nemen aanvragen op grond van deze paragraaf
      indien het totaal van de voor steun in aanmerking te nemen aanvragen het steunplafond van € 930.000 overstijgt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38i.5
    text: Een teler kan jaarlijks slechts één aanvraag indienen op grond van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38i
  - number: 38t
    text: |-
      In deze paragraaf wordt verstaan onder: - *GPS:* plaatsbepalingssysteem met behulp van satellieten;
        - bewaarplaats: bewaarplaats van plantaardige landbouwproducten behorend tot het bedrijf van de landbouwer die de
      steun aanvraagt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38t
  - number: 38u
    text: |-
      De minister verstrekt op aanvraag steun aan landbouwers in de vorm van een tegemoetkoming in de kosten van de
      onderstaande activiteiten:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.a
    text: 'de koop van:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.a.1°
    text: een ploeg die is uitgerust met een GPS-antenne voor bijsturing;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.a.2°
    text: |-
      spuitapparatuur die door sturing met GPS secties kan afsluiten of schoffelapparatuur die is uitgerust met een GPS-
      antenne voor bijsturing;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.a.3°
    text: |-
      bemestingsapparatuur die door sturing met GPS secties kan afsluiten of met behulp van sturing met GPS de
      strooibreedte en dosering kan aanpassen;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.a.4°
    text: beregeningapparatuur met vochtsensoren die door sturing met GPS en op basis van taakkaarten het vocht doseert;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.a.5°
    text: poot- en zaaiapparatuur die door sturing met GPS secties kan uitschakelen;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.b
    text: het verwijderen van asbest in een bewaarplaats, niet zijnde de herbouw van een bewaarplaats;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38u.c
    text: |-
      het isoleren van vloeren, wanden of plafonds van een bewaarplaats, niet inbegrepen de
      verwijdering van materialen, waardoor een warmteweerstand wordt bereikt als vastgesteld in
      __REF000___________________________________________________________________________________________________________
      ___;


      [ref1]: https://wetten.overheid.nl/BWBR0012054
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
    references:
      - id: ref1
        bwb_id: BWBR0012054
  - number: 38u.d
    text: |-
      regulering van het klimaat in een bewaarplaats door middel van een computer, inclusief daarmee verband houdende
      aanpassingen aan ventilatiesystemen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38u
  - number: 38v.1
    text: |-
      De steun, bedoeld in [artikel 38u][ref1], bedraagt 30% van de in aanmerking komende kosten met dien verstande dat
      zij ten hoogste € 50.000 steun per landbouwer bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38v
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38v.2
    text: Het steunplafond bedraagt € 12.300.000.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38v
  - number: 38v.3
    text: |-
      De landbouwer komt alleen voor steunverlening in aanmerking indien de totale kosten voor de uitvoering van de
      volledige activiteit hoger zijn dan € 15.000.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38v
  - number: 38v.4
    text: |-
      Gemaakte arbeidskosten komen voor steun in aanmerking indien deze zijn gemaakt door een aannemer of een
      leverancier, overeenkomstig de in [artikel 1:15, vijfde lid, van de Regeling LNV-subsidies][ref1], omschreven
      berekeningsmethode.


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38v
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
  - number: 38v.5
    text: BTW is niet subsidiabel.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38v
  - number: 38w.1
    text: |-
      De landbouwer kan slechts een aanvraag per jaar indienen voor steunverlening op grond van [artikel 38u][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38w.2
    text: 'De aanvraag voor steunverlening gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
  - number: 38w.2.a
    text: een omschrijving van de steunwaardige activiteit, inclusief een conceptfactuur of offerte,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
  - number: 38w.2.b
    text: het adres waar de landbouwer de steunwaardige activiteit realiseert, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
  - number: 38w.2.c
    text: |-
      een verklaring van de landbouwer waarin hij de minister toestemming geeft om zijn
      gegevens, inclusief persoonsgegevens, uit te wisselen met de minister van Financiën,
      ten behoeve van de controle op de naleving van deze specifieke steunregeling en de
      [Aanwijzingsregeling willekeurige afschrijving en investeringsaftrek milieu-investeringen 2009][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025316
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0025316
  - number: 38w.3
    text: |-
      De landbouwer kan steun aanvragen voor de aanschaf van verscheidene in [artikel 38u, onderdeel a][ref1], omschreven
      apparaten.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38w.4
    text: |-
      De landbouwer kan geen steun aanvragen op grond van meer dan één van de in [artikel 38u][ref1] onderscheiden
      onderdelen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38w.5
    text: De landbouwer kan alleen steun aanvragen voor activiteiten die verricht worden na de steunverlening.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
  - number: 38w.6
    text: |-
      De minister rangschikt aanvragen tot steun als bedoeld in [artikel 38u][ref1] die in de periode van 1 maart 2014
      tot en met 31 maart 2014 zijn ingediend in de navolgende volgorde van categorieën:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38w.6.a
    text: |-
      aanvragen, afkomstig van ondernemingen die in de drie jaren voorafgaand aan de
      aanvraag geen steun als bedoeld in [artikel 38u][ref1] of subsidie als bedoeld in
      [bijlage 2, hoofdstuk 7, categorie 2, van de Regeling LNV-subsidies][ref2] is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
      [ref2]: https://wetten.overheid.nl/BWBR0021281
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
      - id: ref2
        bwb_id: BWBR0021281
  - number: 38w.6.b
    text: overige aanvragen.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
  - number: 38w.7
    text: |-
      Indien het totaalbedrag van de ingediende aanvragen, bedoeld in het zesde lid, onderdeel a, hoger is dan het
      beschikbare budget, worden binnen desbetreffende categorie aanvragen door loting gerangschikt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
  - number: 38w.8
    text: |-
      Indien het totaalbedrag van de ingediende aanvragen hoger is dan het beschikbare budget en nadat voor de aanvragen,
      bedoeld in het zesde lid, onderdeel a, een beschikking omtrent steunverlening als bedoeld in [artikel 38u][ref1] is
      afgegeven, worden binnen de categorie, bedoeld in het zesde lid, onderdeel b, aanvragen door loting gerangschikt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38w
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38x.1
    text: |-
      De landbouwer aan wie steun is verleend als bedoeld in [38u][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38x
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38x.1.a
    text: |-
      verstrekt bewijsmateriaal waaruit ten genoegen van de minister blijkt dat de steunwaardige activiteiten zijn
      verricht, waaronder voor wat betreft de activiteiten, bedoeld in [artikel 38u, onderdeel a][ref1], de levering
      van de desbetreffende apparatuur op het bedrijf van de landbouwer die de steun aanvraagt, en welke kosten voor de
      desbetreffende activiteiten zijn gemaakt;


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38x
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38x.1.b
    text: |-
      bewaart het bewijsmateriaal in een administratie die voldoet aan de voorschriften, bedoeld in
      [artikel 1:12, derde en vierde lid, van de Regeling LNV-subsidies][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38x
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
  - number: 38x.2
    text: |-
      [Artikel 1:20, vijfde lid, van de Regeling LNV-subsidies][ref1] is van overeenkomstige toepassing bij de betaling
      van steun op grond van [artikel 38u][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021281#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38x
    references:
      - id: ref1
        bwb_id: BWBR0021281
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 38x.3
    text: |-
      Indien bij de verstrekking van het bewijsmateriaal, bedoeld in het eerste lid, onderdeel a, blijkt dat de
      landbouwer een andere activiteit heeft verricht, dan komt deze activiteit, met inachtneming van de voorschriften
      van deze paragraaf, in plaats van de aangevraagde steun voor steun in aanmerking, met dien verstande dat de
      minister niet meer steun aan de landbouwer betaalt dan hem is verleend op grond van [artikel 38w, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38w
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel38x
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38w
        hoofdstuk: 2a
        paragraaf: '11'
  - number: '44'
    text: |-
      Er worden geen rechtstreekse betalingen toegekend aan landbouwers indien het totaalbedrag van de in een bepaald
      kalenderjaar aangevraagde of toe te kennen rechtstreekse betalingen vóór toepassing van de in de artikelen 21 en 23
      van verordening 73/2009 vastgestelde verlagingen en uitsluitingen lager is dan € 500.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel44
  - number: '55.1'
    text: |-
      De landbouwer die aanspraak maakt op steun in het kader van een van de in [artikel 2, eerste lid, onder 2][ref1],
      bedoelde steunregelingen, maakt gebruik van de verzamelaanvraag, tenzij deze regeling een specifieke
      aanvraagprocedure voorschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '55.2'
    text: |-
      Voor de verzamelaanvraag maakt de landbouwer gebruik van een door de minister vastgesteld formulier dat door de
      landbouwer volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.3'
    text: De verzamelaanvraag wordt in de periode van 1 april tot en met 15 mei ingediend bij de minister.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.4'
    text: |-
      Bij de verzamelaanvraag legt de landbouwer alle bewijsstukken over die het betrokken betaalorgaan nodig acht voor
      de beoordeling van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.5'
    text: |-
      Van de wijziging, verbetering of intrekking van de verzamelaanvraag overeenkomstig Deel II, Titel II, van
      verordening 1122/2009 stelt de landbouwer de minister schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.6'
    text: |-
      De landbouwer die aanspraak maakt op steun, bedoeld in [artikel 24, eerste lid][ref1], verstrekt tevens de volgende
      informatie bij de verzamelaanvraag:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '24'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: 55.6.a
    text: |-
      toestemming aan de minister om persoonsgegevens te verwerken ten behoeve van de controle op de naleving van deze
      regeling,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: 55.6.b
    text: een verklaring dat hij zich bewust is van alle voorwaarden voor verkrijging van deze steun,
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: 55.6.c
    text: de naam van de verzekeraar met wie de verzekering is afgesloten, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: 55.6.d
    text: een verklaring dat hij zich niet meer dan een keer verzekert voor dezelfde schade.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.7'
    text: |-
      De landbouwer die in aanmerking wil komen voor steun, 38f, eerste lid of 38i, eerste lid, verklaart op de
      verzamelaanvraag dat hij zich bewust is van de voorwaarden voor het ontvangen van deze steun.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.8'
    text: |-
      De teler, bedoeld in artikel 38h, onderdeel b, die in aanmerking wil komen voor de steun, bedoeld in artikel 38i,
      eerste lid, geeft in de verzamelaanvraag, bedoeld in het eerste lid, aan:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: 55.8.a
    text: |-
      de oppervlakte van het areaal aan vezelgewassen waarvoor hij de steun, bedoeld in artikel 38i, eerste lid,
      aanvraagt;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: 55.8.b
    text: de informatie, als bedoeld in artikel 13, eerste lid, van verordening 1122/2009, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: 55.8.c
    text: de verklaring, bedoeld in artikel 38i, derde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.9'
    text: |-
      De landbouwer die het in aanmerking komende oppervlak van een perceel landbouwgrond wil uitbreiden met sloten
      of windhagen als bedoeld in artikel 34, tweede lid, van verordening 1122/2009, identificeert deze op de
      verzamelaanvraag.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
  - number: '55.10'
    text: |-
      Landbouwers die een verzoek als bedoeld in [artikel 15b][ref1] willen indienen, verstrekken ten genoegen van de
      minister de benodigde informatie voor het vaststellen van het relevante jaar of de relevante jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel15b
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '55.11'
    text: |-
      Landbouwers die geen toeslagrechten in eigendom hebben op 15 mei 2012 vragen om toepassing van de
      [artikelen 12 tot en met 15][ref1], door het indienen van de verzamelaanvraag waarin zij tevens verzoeken om de
      uitbetaling van bedrijfstoeslag.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel12
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55a.1
    text: |-
      De landbouwer die gebruik wil maken van [artikel 10][ref1], maar geen toeslagrechten in eigendom heeft op 15 mei
      2010, vraagt toeslagrechten aan door het indienen van een door de minister vastgesteld aanvraagformulier bij de
      minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel10
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55a.2
    text: De landbouwer dient het aanvraagformulier, bedoeld in het eerste lid, uiterlijk in op 15 mei 2010.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55a
  - number: 55b.1
    text: |-
      De landbouwer die gebruik wil maken van [artikel 11, eerste lid, onderdeel a][ref1], verstrekt ten genoegen van de
      minister de benodigde informatie voor het vaststellen van het relevante referentiejaar of referentiejaren.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel11
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55b.2
    text: |-
      De landbouwer die gebruik wil maken van [artikel 11, eerste lid, onderdeel b][ref1], verstrekt het een kopie
      van het verkoopcontract en een omschrijving van de overgedragen aanspraken op toeslagrechten, bedoeld in
      [artikel 10][ref2]. Daarbij worden ook de overgedragen landbouwondernemingen waaraan een UBN is toegekend en het
      aantal overgedragen hectares omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel10
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55b.3
    text: |-
      Een aanvraag en de gegevens, bedoeld in het tweede lid, mogen met expliciete toestemming van de verkoper ook met
      aanvraag van de koper worden ingediend.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55b
  - number: 55b.4
    text: |-
      De landbouwer die gebruik wil maken van [artikel 11, eerste lid, onderdeel c][ref1], verstrekt een kopie van het
      verhuurcontract en het aantal hectaren waarvoor hij de toeslagrechten verhuurt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel11
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55b.5
    text: |-
      De landbouwer die gebruik wil maken van [artikel 16, eerste lid][ref1], verstrekt ten genoegen van de minister de
      benodigde informatie voor het vaststellen van het voldoen aan de voorwaarden van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel16
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55b
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 55b.6
    text: |-
      De landbouwer dient de gegevens, bedoeld in dit artikel in voor 15 mei 2010, met een door de minister vastgesteld
      formulier, bij de minister.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55b
  - number: 55c.1
    text: |-
      Indien uit een ingediende verzamelaanvraag, een ingediende aanvraag om gebruik te maken van
      [artikel 11, eerste lid][ref1], of een ingediende aanvraag om gebruik te maken van [artikel 16, eerste lid][ref2],
      kennelijk en zonder voorbehoud blijkt dat een landbouwer een aanvraag tot vaststelling van
      toeslagrechten heeft willen doen, wordt de ingediende aanvraag beschouwd als een aanvraag als bedoeld in
      [artikel 55a, tweede lid][ref3], of [artikel 55b, zesde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel55a
      [ref4]: https://wetten.overheid.nl/BWBR0019131#Artikel55b
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55c
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0019131
        artikel: 55a
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0019131
        artikel: 55b
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 55c.2
    text: |-
      Voor de toepassing van het eerste lid wordt de aanvraag behandeld als een aanvraag die is ontvangen op 11 juni
      2010.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55c
  - number: 55d.1
    text: |-
      Aanvragen of gegevensverstrekkingen op grond van dit artikel worden bij de minister ingediend met gebruikmaking
      van het daartoe door de minister verstrekte formulier en gaan vergezeld van een verklaring dat de landbouwer zich
      bewust is van alle voorwaarden voor het verkrijgen van de steun.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
  - number: 55d.2
    text: |-
      De landbouwer die steun aanvraagt op grond van [artikel 29, eerste lid][ref1], of [artikel 37a, eerste lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel37a
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '29'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: 37a
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 55d.2.a
    text: |-
      dient de aanvraag, bedoeld in [artikel 30, eerste lid][ref1], respectievelijk [artikel 38, eerste lid][ref2], in
      bij de minister in de periode van 1 maart 2014 tot en met 31 maart 2014;


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel38
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '30'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '38'
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 55d.2.b
    text: |-
      dient de aanvraag, bedoeld in [artikel 37, eerste lid][ref1], respectievelijk [artikel 38b, eerste lid][ref2], in
      bij de minister in de periode van 1 december 2014 tot en met 28 februari 2015.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel38b
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '37'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: 38b
        hoofdstuk: 2a
        paragraaf: '3'
  - number: 55d.3
    text: |-
      De landbouwer die steun aanvraagt op grond van [artikel 38u][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38u
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 55d.3.a
    text: dient de aanvraag tot steunverlening in bij de minister in de periode van 1 maart 2014 tot en met 31 maart 2014, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
  - number: 55d.3.b
    text: |-
      dient de in [artikel 38x, eerste lid, onderdeel a][ref1], omschreven gegevens, in bij de minister vóór 28 februari
      2015.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38x
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 38x
        hoofdstuk: 2a
        paragraaf: '11'
  - number: 55d.4
    text: |-
      De landbouwer die steun aanvraagt op grond van [artikel 24, eerste lid][ref1], verstrekt de in
      [artikel 25, eerste lid][ref2], bedoelde gegevens aan de minister voor 1 november van het jaar waarin de steun
      is aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel25
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55d
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '24'
        hoofdstuk: 2a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '25'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: 55e
    text: |-
      De aanvraag, bedoeld in [artikel 26, eerste lid][ref1], wordt uiterlijk vóór 15 december voorafgaand aan het
      kalenderjaar waarop de verzekering betrekking heeft, ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel26
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55e
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '26'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: 55f.1
    text: |-
      Landbouwers die vragen om toepassing van [artikel 15b][ref1] of [artikel 15c][ref2], verstrekken de benodigde
      informatie uiterlijk op 15 mei 2012 op een daartoe door de minister vastgesteld formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel15b
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel15c
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55f
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: 15c
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55f.2
    text: |-
      Landbouwers die vragen om toepassing van [artikel 15b][ref1], verstrekken daarbij ten genoegen van de minister de
      benodigde informatie ten behoeve van de vaststelling van het relevante jaar of de relevante jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel15b
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55f
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 15b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55f.3
    text: |-
      Landbouwers die vragen om toepassing van [artikel 15c][ref1], verstrekken daarbij de gegevens als bedoeld in
      artikel 26, tweede en derde lid, van verordening 1120/2009, respectievelijk de gegevens als bedoeld in artikel 27,
      tweede en derde lid, van verordening 1120/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel15c
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55f
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 15c
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55f.4
    text: |-
      Met expliciete toestemming van de verkoper mag een koper het verzoek en de gegevens, bedoeld in artikel 26, derde
      lid, van verordening 1120/2009, indienen op een daartoe door de minister vastgesteld formulier.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel55f
  - number: '56'
    text: |-
      Bewijsstukken als bedoeld in [artikel 55, vierde lid][ref1], overlegt de landbouwer schriftelijk voor zover deze
      niet elektronisch overgelegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '57'
    text: |-
      De landbouwer, verzekeraar, verantwoordelijke voor een certificeringssysteem of controleur ten behoeve van een
      certificeringssysteem zijn verplicht op verzoek van de minister alle gewenste nadere inlichtingen, ter zake
      van de gegevens verschaft bij de ingediende aanvragen op grond van deze regeling, terstond en naar waarheid te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel57
  - number: '58.1'
    text: |-
      De bedrijfsadministratie wordt door de landbouwer op eerste vordering aan de met toezicht op de naleving van deze
      regeling belaste persoon ter inzage gegeven.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel58
  - number: '58.2'
    text: |-
      De landbouwer bewaart de bedrijfsadministratie op zijn bedrijf ten minste drie jaar na afloop van het jaar waarin
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel58
  - number: '59.1'
    text: |-
      Indien een bedrijf volledig wordt overgedragen nadat een verzamelaanvraag is ingediend en voordat aan alle
      voorwaarden voor het verstrekken van subsidie is voldaan, of indien een bedrijf volledig wordt overgedragen nadat
      de voor de toekenning van de steun vereiste handelingen zijn begonnen, maar voordat aan alle voorwaarden voor de
      toekenning van de steun is voldaan, wordt de aangevraagde subsidie overeenkomstig het tweede en derde lid verstrekt
      aan de overnemer, bedoeld in artikel 82 van verordening 1122/2009, dan wel aan de oorspronkelijke aanvrager.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
  - number: '59.2'
    text: 'De desbetreffende aangevraagde subsidie wordt verstrekt aan de overnemer indien:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
  - number: 59.2.a
    text: |-
      de minister de schriftelijke melding van de overdracht uiterlijk op de laatste dag van de in
      [artikel 55, derde lid][ref1], bedoelde termijn voor het indienen van de verzamelaanvraag ontvangt van de
      overnemer,


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 59.2.b
    text: |-
      de overnemer het betrokken betaalorgaan uiterlijk op de laatste dag van de in [artikel 55, derde lid][ref1],
      bedoelde termijn verzoekt om betaling van de door de wederpartij aangevraagde subsidie,


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 59.2.c
    text: de overnemer alle door de minister verlangde bewijsstukken overlegt, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
  - number: 59.2.d
    text: wordt voldaan aan alle voorwaarden voor de verstrekking van de steun.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
  - number: '59.3'
    text: 'De desbetreffende aangevraagde subsidie wordt verstrekt aan de oorspronkelijke aanvrager indien:'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
  - number: 59.3.a
    text: |-
      de minister de in het tweede lid, onder a, bedoelde melding niet of na de in [artikel 55 derde lid][ref1] bedoelde
      termijn van de overnemer heeft ontvangen,


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 59.3.b
    text: wordt voldaan aan alle voorwaarden voor de verstrekking van de steun, en
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
  - number: 59.3.c
    text: de oorspronkelijke aanvrager alle door de minister verlangde bewijsstukken overlegt.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59
  - number: 59a
    text: |-
      Een uitvoerende instantie zoals genoemd in de [artikelen 63 tot en met 65][ref1] is voor de regelingen
      die zij uitvoert bevoegd om het bedrag aan subsidie dat aan de landbouwer is toegekend te verrekenen met
      bestuursrechtelijke geldschulden die de desbetreffende landbouwer aan haar is verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel63
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '60.1'
    text: |-
      Indien verordening 73/2009 en de ter uitvoering daarvan vastgestelde Commissieverordeningen een beroep op overmacht
      of uitzonderlijke omstandigheden mogelijk maken in verband met het niet nakomen van voorwaarden of verplichtingen,
      meldt de landbouwer een geval van overmacht of uitzonderlijke omstandigheden overeenkomstig artikel 75 van
      verordening 1122/2009 schriftelijk aan de minister met betrekking tot de in [artikel 63][ref1], bedoelde regelingen
      binnen 10 werkdagen na de dag vanaf welke dit voor hem mogelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel63
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '60.2'
    text: |-
      De landbouwer voegt bij de melding bewijsstukken bij ter ondersteuning van zijn beroep op overmacht of buitengewone
      omstandigheden als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel60
  - number: '61.1'
    text: |-
      Indien een bedrag aan subsidie ten onrechte is uitbetaald, wordt dit bedrag en de rente daarover overeenkomstig
      artikel 80 van verordening 1122/2009 teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel61
  - number: '61.2'
    text: |-
      De rente, bedoeld in het eerste lid, is de wettelijke rente in Nederland geldende op de laatste dag van de
      kalendermaand waarin de subsidie is betaald.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel61
  - number: '61.3'
    text: |-
      Indien het bedrag, bedoeld in het eerste lid, niet meer bedraagt dan € 100,– exclusief rente, wordt overeenkomstig
      artikel 5 bis van verordening 885/2006 afgezien van terugvordering.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel61
  - number: '62'
    text: |-
      De Rijksdienst voor Ondernemend Nederland, organisaties die bewijsmateriaal leveren als bedoeld in artikel
      46, tweede lid, van verordening 1122/2009 en de ondernemingen die betrokken zijn bij de uitvoering van
      steunverstrekking op grond van [Hoofdstuk 2a, paragraaf 1][ref1], alsmede de instanties die belast zijn met het
      toezicht op de naleving van de in [artikel 3][ref2] en Hoofdstuk 2a, paragraaf 1, bedoelde voorwaarden wisselen de
      gegevens uit betreffende aanvragers die relevant zijn in het kader van bedoeld toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel3
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0019131
        hoofdstuk: 2a
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '67'
    text: |-
      De NVWA is verantwoordelijk voor de coördinatie van de controles ter plaatse op de naleving van de regeling als
      bedoeld in de artikelen 20 en 22 van verordening 73/2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel67
  - number: '68.1'
    text: |-
      Indien een landbouwer één of meer verplichtingen op grond van [artikel 3][ref1] niet naleeft, wordt overeenkomstig
      Deel II, Titel IV, hoofdstuk III van verordening 1122/2009 een korting opgelegd op het totale bedrag dat op grond
      van de in [artikel 2][ref2] bedoelde steunregelingen aan de landbouwer is of moet worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '68.2'
    text: |-
      Onverminderd artikel 77 van verordening 1122/2009, bedraagt de hoogte van de korting 1, 3 of 5% van het totale
      bedrag dat op grond van de in [artikel 3][ref1] bedoelde steunregelingen aan de landbouwer is of moet worden
      toegekend en wordt in geval van herhaalde of opzettelijke niet-naleving verhoogd overeenkomstig artikel 71 en 72
      van verordening 1122/2009.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel3
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '69'
    text: |-
      Indien een landbouwer andere dan de in [artikel 68][ref1] bedoelde voorwaarden of verplichtingen voortvloeiend
      uit verordening 73/2009 en de ter uitvoering daarvan vastgestelde Commissieverordeningen niet naleeft, wordt door
      de minister met betrekking tot de in [artikel 63, eerste lid][ref2], bedoelde regelingen overeenkomstig Deel II,
      Titel IV, hoofdstuk II van verordening 1122/2009 een korting opgelegd op het bedrag dat op grond van de betrokken
      steunregeling aan de landbouwer is of moet worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel63
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '63'
        hoofdstuk: '5'
        paragraaf: '2'
  - number: '70'
    text: |-
      Indien een landbouwer niet alle in artikel 13, achtste lid, van verordening 1122/2009 bedoelde oppervlakten opgeeft
      en daarbij het verschil tussen enerzijds de totale in de verzamelaanvraag aangegeven oppervlakte en anderzijds de
      som van de aangegeven oppervlakte en de totale oppervlakte van de niet-aangegeven percelen groter is dan 3% van de
      aangegeven oppervlakte, wordt het totale bedrag van de rechtstreekse betalingen die in dat jaar aan die landbouwer
      moet worden gedaan, als volgt verlaagd:
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70
  - number: 70.a
    text: indien het verschil groter is dan 3% en kleiner dan of gelijk aan 10% bedraagt de verlaging 1%;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70
  - number: 70.b
    text: indien het verschil groter is dan 10% en kleiner dan of gelijk aan 20% bedraagt de verlaging 2%;
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70
  - number: 70.c
    text: indien het verschil groter is dan 20% bedraagt de verlaging 3%.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70
  - number: 70a.1
    text: |-
      Aanvragen, bedoeld in [artikel 55d, tweede lid, onderdeel a, respectievelijk derde lid, onderdeel a][ref1], komen
      niet voor steunverlening in aanmerking indien de landbouwer deze verstrekt na de in die leden vastgestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55d
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: 55d
        hoofdstuk: '5'
        paragraaf: '1'
  - number: 70a.2
    text: |-
      De steun, bedoeld in [artikel 24, eerste lid][ref1], [artikel 29, eerste lid][ref2],
      [artikel 37a, eerste lid][ref3], artikel 38i, eerste lid, respectievelijk [artikel 38u][ref4] wordt verlaagd
      overeenkomstig de omschreven systematiek in artikel 23, eerste lid, van verordening 1122/2009, indien de
      landbouwer de in [artikel 55d, tweede lid, onderdeel b, derde lid onderdeel b, vierde lid][ref5], respectievelijk
      [artikel 43, vierde lid][ref6], omschreven aanvragen of gegevens verstrekt na de daarin bepaalde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel37a
      [ref4]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
      [ref5]: https://wetten.overheid.nl/BWBR0019131#Artikel55d
      [ref6]: https://wetten.overheid.nl/BWBR0019131#Artikel43
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70a
    references:
      - id: ref1
