        hoofdstuk: 2a
        paragraaf: '2'
  - number: 70f.1
    text: |-
      De minister stelt de steun op grond van de betreffende steunregeling vast op nihil indien blijkt dat door,
      of ten behoeve van, de landbouwer een document, bedoeld in [artikel 25, eerste lid, onderdeel c][ref1],
      [artikel 37, derde lid][ref2], [artikel 38b, tweede lid][ref3], [artikel 38i, derde lid, onderdelen a en b][ref4],
      [artikel 38w, tweede lid, onderdeel a][ref5], of [artikel 38x, eerste lid onderdeel a][ref6], heeft vervalst of
      valselijk is opgemaakt, waardoor de opgegeven kosten hoger zijn dan de werkelijke kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel38b
