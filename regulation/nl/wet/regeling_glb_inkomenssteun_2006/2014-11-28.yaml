        hoofdstuk: 2a
        paragraaf: '2'
  - number: 70e.2
    text: |-
      Indien komt vast te staan dat de aanvrager in de documenten, bedoeld in [artikel 37, derde lid][ref1] en
      [artikel 38b, tweede lid][ref2], opzettelijk een foutieve weergave heeft gegeven van de werkelijk gemaakte kosten
      en de door aanvrager opgegeven kosten hoger zijn dan de werkelijke kosten, stelt de minister de steun vast op
      nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel38b
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70e
