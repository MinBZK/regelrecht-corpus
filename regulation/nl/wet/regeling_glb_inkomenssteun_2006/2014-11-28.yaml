        paragraaf: '12'
  - number: 70d.3
    text: |-
      Indien komt vast te staan dat de vleeskalverhouder de voorwaarden voor steun als bedoeld in
      [artikel 41, onderdelen b tot en met p][ref1], niet heeft nageleefd wordt een korting opgelegd van 3% per niet
      nageleefde steunvoorwaarde.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel41
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70d
