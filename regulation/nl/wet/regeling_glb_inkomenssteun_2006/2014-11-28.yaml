        paragraaf: '3'
  - number: '77'
    text: Deze regeling treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel77
  - number: '78'
    text: 'Deze regeling wordt aangehaald als: ‘Regeling GLB-inkomenssteun 2006’.'
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel78
