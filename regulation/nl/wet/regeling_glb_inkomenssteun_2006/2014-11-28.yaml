  - number: 70d.2
    text: |-
      Indien komt vast te staan dat de overeenkomst, bedoeld in [artikel 41, onder a][ref1], gedurende de looptijd van
      het onderzoek, zoals beschreven in het in [Bijlage 8B][ref2] opgenomen model van de overeenkomst, is ontbonden
      wordt de in [artikel 40, eerste lid tot en met derde lid][ref3], bedoelde steun vastgesteld op nihil en worden
      eventuele reeds gedane betalingen teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0019131
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel40
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70d
