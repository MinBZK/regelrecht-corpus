  - number: 70d.1
    text: |-
      Indien komt vast te staan dat de landbouwer de voorwaarden voor betaling van steun als bedoeld in
      [artikel 24, eerste lid][ref1], [artikel 29, eerste lid][ref2], [artikel 38i, eerste lid][ref3], respectievelijk
      [artikel 38u][ref4], niet heeft nageleefd, stelt de minister de steun vast op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel38i
      [ref4]: https://wetten.overheid.nl/BWBR0019131#Artikel38u
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70d
