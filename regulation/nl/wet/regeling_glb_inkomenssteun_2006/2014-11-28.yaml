  - number: 70b
    text: |-
      Voor de toepassing van de artikelen 8, 23 en 28 van verordening 73/2009 en artikel 55 van verordening 1122/2009,
      gelden aanvragen voor betalingen op grond van [artikel 36, eerste lid][ref1], [artikel 37, eerste lid][ref2] en
      [artikel 38b, eerste lid][ref3], als ingediend in de periode van 1 tot en met 31 december van het jaar waarin de
      steun is verleend, respectievelijk als ingediend in de periode van 1 tot en met 31 december van het jaar dat volgt
      op het jaar waarin de aanvraag tot steunverlening is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel37
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel38b
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70b
