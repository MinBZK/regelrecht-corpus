    text: |-
      Aanvragen op grond van [artikel 55f, eerste lid][ref1], waarin wordt verzocht om toepassing van artikel 15b, die
      na 15 mei 2012 bij de minister worden ingediend, worden gereduceerd of uitgesloten volgens de in artikel 24 van
      verordening 1122/2009 vastgestelde systematiek.


