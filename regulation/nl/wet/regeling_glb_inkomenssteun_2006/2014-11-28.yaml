  - number: 70e.1
    text: |-
      Behoudens wijzigingen in de beschikking tot steunverlening als bedoeld in [artikel 35][ref1] stelt de minister de
      steun, bedoeld in [artikel 29, eerste lid][ref2], vast op nihil als de aanvrager afwijkt van de realisatie van een
      integraal duurzame stal of houderijsysteem waarvoor de minister aan de aanvrager steun heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel70e
