  - number: '71'
    text: |-
      De [Regeling GLB-inkomenssteun][ref1] wordt ingetrokken, maar blijft evenwel van toepassing op aanvragen ingediend
      vóór de inwerkingtreding van de onderhavige regeling waarop nog niet onherroepelijk is beslist en, in geval van
      slacht, op slachtingen en export verricht vóór de inwerkingtreding van de onderhavige regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017558
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0017558
  - number: 71a
    text: |-
      De Regeling GLB-inkomenssteun 2006 zoals die luidde vóór 1 januari 2009 blijft van toepassing op aanvragen die zijn
      ingediend vóór 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel71a
  - number: '72.1'
    text: |-
      De Regeling GLB-inkomenssteun 2006 zoals die luidde op 31 december 2013 blijft van toepassing op aanvragen die zijn
      ingediend vóór 1 januari 2014.
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel72
  - number: '72.2'
    text: |-
      Landbouwers die vóór 1 januari 2014 een steunaanvraag hebben ingediend, als bedoeld in
      [artikel 37, eerste lid][ref1], of [artikel 43, eerste lid][ref2], van de Regeling GLB-inkomenssteun 2006 zoals
      die luidde op 31 december 2013 op basis waarvan de minister in 2012 of 2013 steun heeft verleend, dienen uiterlijk
      op 28 februari 2014 een vaststellingsaanvraag in. Op desbetreffende vaststellingsaanvragen is de Regeling GLB-
      inkomenssteun 2006 van toepassing zoals die luidde op 31 december 2013.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel43
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '37'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '43'
        hoofdstuk: 2a
        paragraaf: '12'
  - number: '72.3'
    text: |-
      In afwijking van het eerste lid, is [artikel 70e, eerste lid][ref1], zoals deze luidt met ingang van 1 januari 2014
      van toepassing op steunaanvragen ingediend vóór 1 januari 2014.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel70e
    url: https://wetten.overheid.nl/BWBR0019131/2014-11-28#Artikel72
