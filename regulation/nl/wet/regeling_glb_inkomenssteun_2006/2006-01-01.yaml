    text: |-
      De zekerheid, bedoeld in [artikel 33, eerste lid, onderdeel b][ref1], wordt door het HPA vrijgegeven overeenkomstig
      artikel 158 van [verordening 1973/2004](32004R1973).


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel33
