        bwb_id: BWBR0019131
        artikel: '68'
        hoofdstuk: '5'
        paragraaf: '3'
  - number: '70'
    text: |-
      Indien een landbouwer niet alle in artikel 14, eerste lid, van [verordening 796/2004](32004R0796) bedoelde
      oppervlakten opgeeft en daarbij het verschil tussen enerzijds de totale in de verzamelaanvraag aangegeven
      oppervlakte en anderzijds de som van de aangegeven oppervlakte en de totale oppervlakte van de niet-aangegeven
      percelen groter is dan 3% van de aangegeven oppervlakte, wordt het totale bedrag van de rechtstreekse betalingen
      die in dat jaar aan die landbouwer moet worden gedaan, als volgt verlaagd:

      a. indien het verschil groter is dan 3% en kleiner dan of gelijk aan 10% bedraagt de verlaging 1%;

      b. indien het verschil groter is dan 10% en kleiner dan of gelijk aan 20% bedraagt de verlaging 2%;

      c. indien het verschil groter is dan 20% bedraagt de verlaging 3%.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel70
  - number: '71'
    text: |-
      De [Regeling GLB-inkomenssteun][ref1] wordt ingetrokken, maar blijft evenwel van toepassing op aanvragen ingediend
      vóór de inwerkingtreding van de onderhavige regeling waarop nog niet onherroepelijk is beslist en, in geval van
      slacht, op slachtingen en export verricht vóór de inwerkingtreding van de onderhavige regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017558
