  - number: '69'
    text: |-
      Indien een landbouwer andere dan de in [artikel 68][ref1] bedoelde voorwaarden of verplichtingen voortvloeiend uit
      [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan vastgestelde Commissieverordeningen niet naleeft,
      wordt door het betrokken betaalorgaan overeenkomstig Deel II, Titel IV, hoofdstuk I van [verordening 796/2004]
      (32004R0796) een korting opgelegd op het bedrag dat op grond van de betrokken steunregeling aan de landbouwer is of
      moet worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel68
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel69
    references:
