  - number: '17'
    text: |-
      1 De extra referentiebedragen worden voor landbouwers als bedoeld in [artikel 16, tweede lid][ref1], berekend op
      basis van de volgende methode:

      a. De toename, ten opzichte van de referentieperiode, in het jaar na en als gevolg van de investering in de
      betrokken productiecapaciteit, het in bezit krijgen, kopen of huren van grond, van het bedrag aan rechtstreekse
      betalingen, ontvangen op grond van de in bijlage VI van [verordening 1782/2003](32003R1782) genoemde
      steunregelingen, wordt berekend en aangepast volgens de methode beschreven in bijlage VII van [verordening
      1782/2003](32003R1782);

      b. Het resultaat van de berekening van onderdeel a) wordt verminderd met een bedrag van € 500,-- dat naar
      evenredigheid over de onderscheiden, op grond van de in dat onderdeel bedoelde steunregelingen, ontvangen extra
      bedragen wordt verdeeld; en

      c. De extra bedragen zoals berekend overeenkomstig onderdeel b) worden vermenigvuldigd met een nader door de
      minister vast te stellen percentage. Hij maakt dit percentage bij besluit bekend in de staatscourant.

      2 In afwijking van het eerste lid en [artikel 16, tweede lid][ref2], wordt op verzoek van de landbouwer voor de
      berekening van het extra referentiebedrag uitgegaan van het tweede jaar na de investering in productiecapaciteit
      of het in bezit krijgen, kopen of huren van grond, maar uiterlijk 2005, indien hij ten genoegen van de minister
      aantoont dat hij in het eerste jaar nadien niet in staat was de betrokken productiecapaciteit of grond ten volle
      te benutten.

      3 In afwijking van het eerste lid wordt het extra referentiebedrag vastgesteld op een bedrag van € 150,– per
      hectare:

      a. indien de landbouwer, bedoeld in [artikel 16, onderdeel b][ref3], de grond in bezit heeft gekregen na
      31 december 2004;

      b. indien de verhuur, bedoeld in [artikel 16, eerste lid, onderdeel d][ref4], afloopt na 31 december 2004.


