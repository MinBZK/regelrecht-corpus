      De landbouwer die voor de zetmeelproductie bestemde aardappelen produceert overeenkomstig artikelen 93 en 94 van
      [verordening 1782/2003](32003R1782) en hoofdstuk 6 van [verordening 1973/2004](32004R1973), komt in aanmerking voor
      subsidie op grond van de productiesteun voor zetmeelaardappelen als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
