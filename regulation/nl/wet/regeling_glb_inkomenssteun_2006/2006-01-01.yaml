  - number: '7'
    text: |-
      1 De landbouwer die percelen uit productie neemt in het kader van de bedrijfstoeslagregeling is verplicht deze
      percelen in te zaaien met een groenbemester onder de navolgende voorwaarden:

      a. het betreft een groenbemester, genoemd in [bijlage 2][ref1] bij deze regeling, die uiterlijk op 31 mei wordt
      ingezaaid;

      b. de groenbemester evenals het eventueel opgekomen onkruid wordt vóór 31 augustus niet van het perceel afgevoerd
      en wordt vanaf 31 augustus tot 15 januari niet van het bedrijf afgevoerd. De groenvoederproductie die onder meer
      door het inkuilen van de groenbemester in de periode tot 15 januari is ontstaan, mag niet van het bedrijf worden
      afgevoerd;

      c. de groenbemester is niet bestemd voor de productie van zaaizaad of pootgoed;

      d. de groenbemester wordt niet vóór 31 augustus voor agrarische doeleinden gebruikt en geeft niet vóór 15 januari
      aanleiding tot een groenvoederproductie die bedoeld is om te worden gecommercialiseerd;

      e. de groenbemester wordt niet vóór 31 augustus door enigerlei vorm van bewerking vernietigd.

      2 Op uit productie genomen percelen die zijn of worden ingezaaid met een groenbemester, is het gebruik van
      dierlijke meststoffen of overige organische meststoffen onder de volgende aanvullende voorwaarden geoorloofd:

      a. de inzaai met groenbemesters geschiedt met gebruikmaking van een zodanige hoeveelheid zaaizaad en op zodanige
      wijze dat een volledige en gelijkmatige opkomst van het gewas op het gehele betrokken perceel gegarandeerd is;

      b. in ieder geval in de periode van 15 juni tot en met 14 juli is het gewas zodanig ontwikkeld dat sprake is van
      een volledige en gelijkmatig bedekking van de betrokken percelen met een groenbemester.


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: '8'
    text: |-
      1 In afwijking van [artikel 7, eerste lid][ref1], is de landbouwer niet verplicht de uit productie genomen percelen
      in te zaaien met een groenbemester, indien:

      a. de landbouwer voor zijn gehele productie voldoet aan de voorschriften die zijn vastgesteld bij [verordening
      (EEG) nr. 2092/91](31991R2092);

      b. op last van de Plantenziektenkundige Dienst deze percelen onbegroeid worden gehouden ter bestrijding van
      quarantaineorganismen, of

      c. op last van HPA of Productschap Tuinbouw deze percelen onbegroeid worden gehouden ter bestrijding van
      knolcyperus.

      2 Ten bewijze dat de landbouwer voor zijn gehele productie voldoet aan de voorschriften die zijn vastgesteld bij
      [verordening (EEG) nr. 2092/91](31991R2092), gaat de verzamelaanvraag vergezeld van een bewijs van certificering
      door de Stichting SKAL te Zwolle voor het gehele bedrijf van de landbouwer.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel7
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '9'
    text: |-
      1 De bedragen die een landbouwer op grond van de in [artikel 2][ref1] genoemde steunregelingen en op grond van
      de [Regeling superheffing en melkpremie 2004][ref2] aan subsidies ontvangt, worden op grond van artikel 10 van
      [verordening 1782/2003](32003R1782) procentueel verlaagd ten behoeve van modulatie.

      2 De landbouwer ontvangt een extra bedrag aan subsidie dat gelijk is aan het bedrag dat voortvloeit uit toepassing
      van de verlaging op grond van het eerste lid over maximaal de eerste € 5.000,– aan subsidie waar de landbouwer uit
      hoofde van de in het eerste lid bedoelde steunregelingen voor het betrokken jaar aanspraak op heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0016539
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0016539
  - number: '10'
    text: |-
      1 Overeenkomstig titel III, en de daar genoemde bijlagen, van [verordening 1782/2003](32003R1782) en [verordening
      795/2004](32004R0795), worden toeslagrechten uitsluitend toegewezen aan landbouwers als bedoeld in artikel 33,
      eerste lid, onderdeel a en b, van [verordening 1782/2003](32003R1782) en aan landbouwers die toeslagrechten uit de
      nationale reserve verkrijgen.

      2 Geen toeslagrechten worden toegewezen aan landbouwers met een landbouwareaal kleiner dan 0,3 ha.

      3 Het tweede lid is niet van toepassing op landbouwers waarvoor toeslagrechten worden vastgesteld die aan speciale
      voorwaarden onderworpen zijn, zoals bedoeld in artikel 12, zesde lid, tweede alinea, van [verordening 795/2004]
      (32004R0795).
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel10
  - number: '11'
    text: |-
      1 De landbouwer dient uiterlijk op 15 mei 2006 de aanvragen tot vaststelling van toeslagrechten in op een daartoe
      vastgesteld aanvraagformulier.

      2 De landbouwer vult het aanvraagformulier volledig en naar waarheid in, ondertekent en dagtekent het en voorziet
      het van alle bijlagen.

      3 De landbouwer is verplicht alle bescheiden en informatie te verstrekken die voor de behandeling van de aanvraag
      noodzakelijk worden geacht, in het bijzonder ten bewijze dat hij ten tijde van het indienen van de aanvraag
      landbouwer is in de zin van artikel 2, onder a, van [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel11
  - number: '12'
    text: |-
      1 Onverminderd [artikel 11][ref1], wordt, in geval van verkoop als bedoeld in artikel 17 van [verordening 795/2004]
      (32004R0795), de aanvraag tot vaststelling van toeslagrechten, met inachtneming van voornoemd artikel, ingediend:

      a. door de verkoper, of

      b. door de koper met de uitdrukkelijke toestemming daartoe van de verkoper.

      2 Indien de aanvraag tot vaststelling van toeslagrechten wordt ingediend door de verkoper, verwijst de koper naar
      die aanvraag in zijn verzamelaanvraag.

      3 Onverminderd [artikel 11][ref2], wordt, in geval van verhuur als bedoeld in artikel 27 van [verordening 795/2004]
      (32004R0795), de aanvraag tot vaststelling van toeslagrechten door de verhuurder ingediend met inachtneming van
      voornoemd artikel en verwijst de huurder in zijn verzamelaanvraag naar eerstgenoemde aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel11
