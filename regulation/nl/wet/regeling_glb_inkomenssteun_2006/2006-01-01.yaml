  - number: '19'
    text: |-
      Indien als gevolg van overheidsinterventie de omvang van een bedrijf is verkleind, waardoor een landbouwer over
      minder hectaren subsidiabele grond beschikt dan het aantal dat overeenstemt met de toeslagrechten die hij in het
      kader van artikel 43 van [verordening 1782/2003](32003R1782) zou krijgen, of heeft gekregen, komt de betrokken
      landbouwer overeenkomstig artikel 7 van [verordening 795/2004](32004R0795) in aanmerking voor toewijzing van
      toeslagrechten uit de nationale reserve.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel19
  - number: '20'
    text: |-
      1 Voor betalingen op basis van toeslagrechten komen uitsluitend in aanmerking landbouwers die:

      a. subsidiabele hectaren opgeven, als bedoeld in artikel 44 van [verordening 1782/2003](32003R1782), waarbij ieder
      perceel een oppervlakte heeft van tenminste 0,3 ha,

      b. deze subsidiabele hectaren ter beschikking houden gedurende een periode van tenminste 10 maanden, waarvan de
      begindatum ligt tussen 1 september en 30 april,

      c. deze subsidiabele hectaren gebruiken in overeenstemming met artikel 51, waarbij secundaire teelt als bedoeld in
      onderdeel b van dat artikel is toegestaan, en artikel 52 van [verordening 1782/2003](32003R1782), en

      d. overeenkomstig artikel 54, zesde lid, van [verordening 1782/2003](32003R1782), eerst betaling vragen voor hun
      braakleggingstoeslagrechten.

      2 De landbouwer doet uiterlijk op 31 augustus daaraan voorafgaand opgave van de begindatum van de periode, bedoeld
      het eerste lid, onderdeel b, bij gebreke waarvan deze op 1 januari wordt gesteld.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel20
  - number: '21'
    text: |-
      1 In afwijking van [artikel 20][ref1] komen in aanmerking voor betalingen op basis van toeslagrechten, landbouwers
      die, zonder opgave van subsidiabele hectaren:

      a. beschikken over toeslagrechten met speciale voorwaarden, waarop artikel 49 van [verordening 1782/2003]
      (32003R1782) van toepassing is;

      b. minimaal 50% van de tijdens de referentieperiode uitgeoefende landbouwactiviteit, uitgedrukt in GVE, handhaven;
      en

      c. uiterlijk op 15 mei een verzoek doen, overeenkomstig artikel 30, derde lid bis, van [verordening 795/2004]
      (32004R0795), tot toepassing van de speciale voorwaarden.

      2 Ten bewijze van het voldoen aan de voorwaarden bedoeld in het eerste lid, onderdeel b, voorzover het ooien
      betreft, doet de landbouwer uiterlijk op 15 mei opgave op basis van zijn bedrijfsregister van het betrokken aantal
      dieren uitgedrukt in GVE.

      3 Aan het minimumpercentage bedoeld in het eerste lid, onderdeel b, wordt geacht te zijn voldaan indien het
      gemiddelde aantal GVE 50%, doch gedurende een periode van 10 maanden, in geen geval minder dan 25% is.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel20
