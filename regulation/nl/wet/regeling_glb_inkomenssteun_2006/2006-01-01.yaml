        paragraaf: '2'
  - number: '44'
    text: |-
      1 Overeenkomstig [verordening 1782/2003](32003R1782), [verordening 1973/2004](32004R1973) en de bepalingen van
      deze regeling, wordt aan landbouwers uitsluitend premie verstrekt ter zake van het slachten of uitvoeren naar een
      derde land van een rund dat op de datum van de slacht, onderscheidenlijk uitvoer naar een derde land, blijkens de
      gegevens uit het I & R-systeem:

      a. tenminste acht maanden oud is, of

      b. indien het een kalf betreft, meer dan een maand en minder dan acht maanden oud is met een slachtgewicht van ten
      hoogste 185 kg.

      2 De kalveren, bedoeld in het eerste lid, onderdeel b, die op de datum van de slacht onderscheidenlijk uitvoer naar
      een derde land, blijkens de gegevens uit het I & R-systeem minder dan zes maanden oud zijn, worden geacht aan de
      voorwaarde met betrekking tot het gewicht, genoemd in het eerste lid, onderdeel b, te hebben voldaan.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel44
  - number: '45'
    text: |-
      Slachtpremie wordt de landbouwer slechts verstrekt ten behoeve van runderen die:

      a. op zijn bedrijf, blijkens het I & R-systeem gedurende de aanhoudperiode zijn aangehouden;

      b. blijkens het I & R-systeem na afloop van de in onderdeel a genoemde periode binnen een maand worden geslacht
      in een abattoir waarvan de houder overeenkomstig de Regeling identificatie en registratie van dieren een
      bedrijfsregister bijhoudt of binnen één maand zijn geslacht in een abattoir in een andere lidstaat, dan wel binnen
      twee maanden zijn uitgevoerd naar een derde land; en

      c. overeenkomstig de bepalingen gesteld bij en krachtens [verordening 1760/2000](32000R1760) zijn geïdentificeerd
      en geregistreerd.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel45
  - number: '46'
    text: |-
      1 De aanhoudperiode, bedoeld in [artikel 45, onderdeel a][ref1], gedurende welke de runderen waarvoor slachtpremie
      is aangevraagd op het bedrijf moeten worden gehouden, beloopt een aaneengesloten periode van tenminste twee
      maanden.

      2 In afwijking van het eerste lid beloopt de aanhoudperiode voor kalveren die worden geslacht voordat zij de
      leeftijd van drie maanden hebben bereikt, een maand.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel45
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '45'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '47'
    text: |-
      Geen slachtpremie wordt verstrekt voor runderen waarvan de geboortedatum, de datum van aanvoer op en afvoer van het
      bedrijf van de landbouwer, of de datum van de slacht, onderscheidenlijk uitvoer naar een andere lidstaat of derde
      land, niet in het I & R-systeem zijn vermeld.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel47
  - number: '48'
    text: |-
      1 De slachtpremie voor runderen, als bedoeld in [artikel 44, eerste lid, onderdeel a][ref1], bedraagt het bedrag
      dat voortvloeit uit artikel 130, tweede lid, onderdeel a, van [verordening 1782/2003](32003R1782).

      2 De slachtpremie voor kalveren, als bedoeld in [artikel 44, eerste lid, onderdeel b][ref2], bedraagt het bedrag
      dat voortvloeit uit artikel 130, tweede lid, onderdeel b, van [verordening 1782/2003](32003R1782).


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel44
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel44
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '44'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '49'
    text: |-
      1 Om voor slachtpremie in aanmerking te komen dient de landbouwer, onverminderd [artikel 50][ref1] een
      deelnamemelding in bij DR, of, indien het de slachtpremie voor kalveren betreft, bij PVE.

      2 In de deelnamemelding verklaart de landbouwer in ieder geval in aanmerking te willen komen voor slachtpremie,
      alsmede dat ter zake van het slachten van op zijn bedrijf gehouden runderen in een in Nederland gelegen abattoir de
      aanvraag voor premie namens deze landbouwer door het betrokken abattoir wordt ingediend.

      3 Indien zich wijzigingen voordoen in de door de landbouwer op de deelnamemelding vermelde gegevens stelt hij DR,
      respectievelijk PVE, daarvan in kennis door middel van een nieuwe deelnamemelding, welke moet zijn ontvangen binnen
      veertien dagen nadat de desbetreffende wijziging is opgetreden.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel50
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '50'
    text: |-
      1 De landbouwer kan een aanvraag voor slachtpremie uitsluitend indienen bij DR, of indien het de slachtpremie
      kalveren betreft, bij PVE, na ontvangst van diens deelnamemelding.

      2 Aanvragen voor slachtpremie ter zake van het slachten van runderen in een in Nederland gelegen abattoir worden
      ingediend door melding van de slacht door het betrokken abattoir aan het I&R systeem, binnen 25 dagen na de slacht
      van het betrokken rund, op de wijze zoals bepaald in de [Regeling identificatie en registratie van dieren][ref1].

      3 Aanvragen voor slachtpremie ter zake van het slachten van runderen in een buiten Nederland gelegen abattoir
      worden ingediend binnen zes maanden na de slachtdatum, doch uiterlijk op de laatste dag van februari van het
      volgende jaar, waarbij de in artikel 121, eerste lid, aanhef en onder a, van [verordening 1973/2004](32004R1973)
      bedoelde bewijsstukken worden overgelegd.

      4 Aanvragen voor slachtpremie ter zake van de uitvoer van runderen naar een derde land worden ingediend binnen zes
      maanden na de datum waarop, blijkens de bij PVE berustende gegevens met betrekking tot de exportrestitutie, het
      betrokken rund het grondgebied van de Gemeenschap heeft verlaten, doch uiterlijk op de laatste dag van februari van
      het volgende jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0014538
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0014538
  - number: '51'
    text: |-
      1 Voor de aanvragen voor slachtpremie, bedoeld in [artikel 50, derde en vierde lid][ref1], maakt de landbouwer
      gebruik van een daartoe door DR, of indien het de slachtpremie voor kalveren betreft, door PVE, vastgesteld
      formulier dat door de landbouwer volledig en naar waarheid wordt ingevuld, ondertekend en gedagtekend.

      2 Bij de indiening van een formulier, bedoeld in het eerste lid, legt de landbouwer alle bewijsstukken over die DR,
      respectievelijk PVE, nodig acht voor de beoordeling of aanspraak op slachtpremie kan worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel50
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '50'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '52'
    text: |-
      De landbouwer die een slachtpremieaanvraag indient, is verplicht de tot zijn bedrijf behorende grond aan te geven.
      Daartoe maakt hij gebruik van de verzamelaanvraag, bedoeld in [artikel 55][ref1], met inachtneming van de daarvoor
      vastgestelde procedure.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '53'
    text: |-
      1 De landbouwer ontvangt geen slachtpremie naar aanleiding van de ingediende premieaanvragen, indien hij in het
      jaar waarin de premie is aangevraagd een overtreding heeft begaan van:

      a. [artikel 3 van het Besluit verboden stoffen Diergeneesmiddelenwet][ref1];

      b. [artikel 3 van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref2];

      c. verordeningen van het Productschap Vee en Vlees ter uitvoering van
      [artikel 2, eerste lid, van de Regeling verbod handel met bepaalde stoffen behandelde dieren en producten][ref3].

      2 Bij herhaling van de overtreding, bedoeld in het eerste lid, besluit de minister dat een landbouwer geen
      slachtpremie ontvangt gedurende twee jaren volgend op het jaar waarin de landbouwer de herhaalde overtreding heeft
      begaan.


      [ref1]: https://wetten.overheid.nl/BWBR0008785#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008825#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008825#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008785
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008825
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008825
        artikel: '2'
  - number: '54'
    text: |-
      Geen slachtpremie wordt verleend indien de slachtmelding wordt verricht door een abattoir dat door toepassing van
      artikel 62 van [verordening 796/2004](32004R0796) is uitgesloten van het recht verklaringen of certificaten af te
      geven met het oog op de toekenning van premie.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel54
  - number: '55'
    text: |-
      1 De landbouwer die aanspraak maakt op subsidie in het kader van een van de in
      [artikel 2, tweede lid, onderdeel a en b][ref1], bedoelde steunregelingen en de melkpremieaanvraag, maakt gebruik
      van de verzamelaanvraag.

      2 Voor de verzamelaanvraag maakt de landbouwer gebruik van een door de minister vastgesteld formulier dat door de
      landbouwer volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.

      3 De verzamelaanvraag wordt in de periode van 1 april tot en met 15 mei ingediend bij DR.

      4 Bij de verzamelaanvraag legt de landbouwer alle bewijsstukken over die het betrokken betaalorgaan nodig acht voor
      de beoordeling van de aanvraag.

      5 Van de wijziging, verbetering of intrekking van de verzamelaanvraag overeenkomstig Titel II van [verordening
      796/2004](32004R0796) stelt de landbouwer DR schriftelijk in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '56'
    text: |-
      1 In afwijking van [artikel 55][ref1] kan de landbouwer gebruik maken van een elektronisch formulier onder de
      voorwaarden van de Regeling electronische indiening GDI.

      2 Bewijsstukken als bedoeld in [artikel 55, vierde lid][ref2], die verlangd worden, overlegt de landbouwer
      schriftelijk voor zover deze niet elektronisch overgelegd kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '55'
        hoofdstuk: '5'
        paragraaf: '1'
  - number: '57'
    text: |-
      De landbouwer is verplicht het betrokken betaalorgaan op diens verzoek alle gewenste nadere inlichtingen, ter
      zake van de gegevens verschaft bij de verzamelaanvraag of de slachtpremieaanvraag, terstond en naar waarheid te
      verstrekken.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel57
  - number: '58'
    text: |-
      1 De landbouwer is verplicht in zijn bedrijfsadministratie alle in de betrokken verordening, deze regeling en door
      het betrokken betaalorgaan voorgeschreven bewijsstukken te bewaren.

      2 De bedrijfsadministratie wordt door de landbouwer op eerste vordering aan de met toezicht op de naleving van deze
      regeling belaste persoon ter inzage gegeven.

      3 De landbouwer bewaart de bedrijfsadministratie op zijn bedrijf ten minste drie jaar na afloop van het jaar waarin
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel58
  - number: '59'
    text: |-
      Indien een bedrijf volledig wordt overgedragen nadat een verzamelaanvraag of een slachtpremieaanvraag is ingediend
      en voordat aan alle voorwaarden voor het verstrekken van subsidie is voldaan, of indien een bedrijf volledig wordt
      overgedragen nadat de voor de toekenning van de steun vereiste handelingen zijn begonnen, maar voordat aan alle
      voorwaarden voor de toekenning van de steun is voldaan, kan aan de verkrijger van het bedrijf de desbetreffende
      aangevraagde subsidie worden verstrekt indien:

      a. het betrokken betaalorgaan de schriftelijke melding van de overdracht binnen een maand na de overdracht ontvangt
      van de verkrijger,

      b. de verkrijger het betrokken betaalorgaan verzoekt om betaling van de door de wederpartij aangevraagde subsidie,

      c. de verkrijger alle door het betrokken betaalorgaan verlangde bewijsstukken overlegt, en

      d. wordt voldaan aan alle voorwaarden voor de verstrekking van de premie.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel59
  - number: '60'
    text: |-
      1 In het geval [verordening 1782/2003](32003R1782) en de ter uitvoering daarvan vastgestelde Commissieverordeningen
      een beroep op overmacht of uitzonderlijke omstandigheden mogelijk maken in verband met het niet nakomen van
      voorwaarden of verplichtingen, meldt de landbouwer een geval van overmacht of uitzonderlijke omstandigheden
      overeenkomstig artikel 72 van [verordening 796/2004](32004R0796) schriftelijk aan het betrokken betaalorgaan binnen
      10 werkdagen na de dag vanaf welke dit voor hem mogelijk is.

      2 De landbouwer voegt bij de melding bewijsstukken bij ter ondersteuning van zijn beroep op overmacht of
      buitengewone omstandigheden als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel60
  - number: '61'
    text: |-
      1 Indien een bedrag aan subsidie ten onrechte is uitbetaald, wordt de onverschuldigd betaalde subsidie en de rente
      over dat bedrag overeenkomstig artikel 73 van [verordening 796/2004](32004R0796) teruggevorderd.

      2 De rente, bedoeld in het eerste lid, is de wettelijke rente in Nederland geldende op de laatste dag van de
      kalendermaand waarin de subsidie is betaald.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel61
  - number: '62'
    text: |-
      De betaalorganen dragen zorg voor de uitwisseling van gegevens betreffende aanvragers die relevant zijn in het
      kader van het toezicht op de naleving van de in [artikel 3 tot en met 8][ref1] bedoelde voorwaarden of relevant
      zijn voor de in [artikel 9][ref2] genoemde modulatie.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel9
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '3'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '9'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '63'
    text: |-
      1 DR is belast met de uitvoering van

      a. de bedrijfstoeslagregeling;

      b. de areaalbetaling voor noten;

      c. de steun voor energiegewassen;

      d. de premie voor eiwithoudende gewassen;

      e. de slachtpremie, met uitzondering van de slachtpremie voor kalveren;

      f. het uitbetalen van het extra steunbedrag op grond van artikel 12 van [verordening 1782/2003](32003R1782).

      2 Ter uitvoering van de subsidieregelingen genoemd in het eerste lid zal DR onder meer:

      a. toeslagrechten en braakleggingstoeslagrechten in het kader van de bedrijfstoeslagregeling vaststellen;

      b. subsidiebedragen berekenen en uitkeren;

      c. in voorkomend geval een overschrijding vaststellen van het maximum van voor noten aangevraagde subsidie als
      bedoeld in artikel 83 van [verordening 1782/2003](32003R1782);

      d. in voorkomend geval een overschrijding vaststellen van de maxima in het kader van de slachtpremiebetalingen als
      bedoeld in artikel 130 van [verordening 1782/2003](32003R1782);

      e. in voorkomend geval een overschrijding vaststellen van het maximum van extra steunbedrag als bedoeld in artikel
      12 van [verordening 1782/2003](32003R1782);

      f. kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), alsmede op grond
      van Titel II, hoofdstuk I en hoofdstuk IV, Titel IV, hoofdstuk I van [verordening 796/2004](32004R0796) en deze
      regeling;

      g. de hoogte van de korting wegens overtreding van de randvoorwaarden bepalen op grond van [verordening 1782/2003]
      (32003R1782), alsmede op grond van Titel IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling,
      mede ten behoeve van de overige betrokken betaalorganen;

      h. kortingen en uitsluitingen opleggen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling;

      i. relevante informatie uit de verzamelaanvraag doorgeven aan HPA, PVE en PZ.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel63
  - number: '64'
    text: |-
      1 Het HPA is belast met de uitvoering van:

      a. de steun voor zetmeelaardappelen;

      b. de steun voor zaaizaad van vezelvlas;

      2 Ter uitvoering van de subsidieregelingen genoemd in het eerste lid zal het HPA onder meer:

      a. subsidiebedragen berekenen en uitkeren;

      b. een eventuele overschrijding van het nationale maximum voor zaaizaad van vezelvlas vaststellen als bedoeld in
      artikel 99 van [verordening 1782/2003](32003R1782);

      c. kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), alsmede op grond
      van Titel II, hoofdstuk I en hoofdstuk IV, Titel IV, hoofdstuk I van [verordening 796/2004](32004R0796) en deze
      regeling;

      d. kortingen en uitsluitingen opleggen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling.

      3 Het HPA is bevoegde autoriteit voor:

      a. de verwerkers van energiegewassen, als bedoeld in Hoofdstuk 8 van [verordening 1973/2004](32004R1973);

      b. de verwerkers van grondstoffen, als bedoeld in hoofdstuk 16 van [verordening 1973/2004](32004R1973), met het
      oog op het verkrijgen van een of meer eindproducten welke zijn genoemd in bijlage XXIII van [verordening 1973/2004]
      (32004R1973).

      4 Het HPA regelt overigens, met inachtneming van [verordening 1782/2003](32003R1782), [verordening 796/2004]
      (32004R0796) en [verordening 1973/2004](32004R1973) en, zo nodig de aanwijzingen van de minister, al hetgeen voor
      een goede uitvoering van de in het eerste lid genoemde steunregelingen is vereist.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel64
  - number: '65'
    text: |-
      1 PVE is belast met de uitvoering van het onderdeel slachtpremie voor kalveren van de rundvleesbetalingen.

      2 Ter uitvoering zal PVE onder meer:

      a. subsidiebedragen berekenen en uitkeren;

      b. kortingen en uitsluitingen vaststellen op grond van [verordening 1782/2003](32003R1782), alsmede op grond
      van Titel II, hoofdstuk I en hoofdstuk IV, Titel IV, hoofdstuk I van [verordening 796/2004](32004R0796) en deze
      regeling;

      c. kortingen en uitsluitingen opleggen op grond van [verordening 1782/2003](32003R1782), alsmede op grond van Titel
      IV, hoofdstuk II van [verordening 796/2004](32004R0796) en deze regeling.

      3 PVE regelt overigens, met inachtneming van [verordening 1782/2003](32003R1782), [verordening 796/2004]
      (32004R0796) en [verordening 1973/2004](32004R1973) en, zo nodig de aanwijzingen van de minister, al hetgeen voor
      een goede uitvoering van de in het eerste lid genoemde steunregeling is vereist.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel65
  - number: '66'
    text: |-
      Onverminderd de [Regeling superheffing en melkpremie 2004][ref1] is PZ belast met de uitvoering van de
      melkpremieaanvraag met inachtneming van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0016539
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0016539
  - number: '67'
    text: |-
      De AID is verantwoordelijk voor de coördinatie van de controles ter plaatse op de naleving van de regeling als
      bedoeld in artikel 23 van [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel67
  - number: '68'
    text: |-
      1 Indien een landbouwer één of meer verplichtingen op grond van de [artikelen 3 tot en met 8][ref1] niet naleeft,
      wordt overeenkomstig Deel II, Titel IV, hoofdstuk II van [verordening 796/2004](32004R0796) een korting opgelegd
      op het totale bedrag dat op grond van de in [artikel 3][ref2] bedoelde steunregelingen aan de landbouwer is of moet
      worden toegekend.

      2 Onverminderd artikel 71 van [verordening 796/2004](32004R0796), bedraagt de hoogte van de korting 1, 3 of 5% van
      het totale bedrag dat op grond van de in [artikel 3][ref3] bedoelde steunregelingen aan de landbouwer is of moet
      worden toegekend en wordt in geval van herhaalde of opzettelijke niet-naleving verhoogd overeenkomstig artikel 66
      en 67 van [verordening 796/2004](32004R0796).


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel3
