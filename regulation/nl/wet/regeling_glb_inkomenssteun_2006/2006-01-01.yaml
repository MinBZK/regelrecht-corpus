  - number: '36'
    text: |-
      1 Indien de overeenkomst, bedoeld in [artikel 30][ref1], wordt gewijzigd of ontbonden nadat de landbouwer een
      verzamelaanvraag heeft ingediend kan de landbouwer slechts aanspraak maken op een subsidie indien de landbouwer
      aan DR respectievelijk de in Nederland gevestigde verwerker of inzamelaar aan het HPA, uiterlijk op 15 mei een
      origineel exemplaar dan wel een gewaarmerkt afschrift van de schriftelijke overeenkomst tussen de landbouwer en de
      eerste verwerker of inzamelaar, waarbij de overeenkomst wordt gewijzigd of ontbonden, overlegt.

      2 Onverminderd het bepaalde in het eerste lid staat DR toe dat de overeenkomst wordt gewijzigd of, voorzover dit
      gerechtvaardigd is, wordt ontbonden indien de landbouwer haar hiervan vooraf in kennis stelt en bewijsmateriaal
      overlegt waaruit blijkt, dat hij wegens specifieke omstandigheden de in de overeenkomst vermelde grondstoffen niet
      of niet volledig kan leveren. Indien de wijziging van de overeenkomst tot een vermindering van de oppervlakte leidt
      waarvoor de subsidie is aangevraagd, of indien de overeenkomst wordt ontbonden brengt de landbouwer om aanspraak op
      een subsidie te kunnen blijven maken de betrokken percelen in onbeteelde toestand en draagt hij er zorg voor dat de
      grondstoffen onder toezicht van de AID worden ondergewerkt of vernietigd.

      3 Na verkregen toestemming van DR als bedoeld in het tweede lid, legt de landbouwer een origineel exemplaar van
      de schriftelijke overeenkomst, dan wel een gewaarmerkt kopie daarvan binnen 20 werkdagen na haar sluiting over aan
      DR en stelt hij DR in kennis van de datum van de wijziging of ontbinding van de overeenkomst en de datum waarop
      de betrokken percelen in onbeteelde toestand worden gebracht en de grondstof wordt ondergewerkt of vernietigd.
      Laatstgenoemde datum is ten minste twee weken na deze kennisgeving gelegen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel30
