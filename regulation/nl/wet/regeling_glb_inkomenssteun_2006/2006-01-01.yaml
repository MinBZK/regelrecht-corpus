  - number: '18'
    text: |-
      1 Voor landbouwers als bedoeld in [artikel 16, eerste lid, onderdeel b][ref1], worden het aantal toeslagrechten en
      de waarde daarvan vastgesteld door het overeenkomstig [artikel 17][ref2] berekende extra referentiebedrag, te delen
      door het aantal in bezit gekregen hectaren.

      2 Voor landbouwers als bedoeld in [artikel 16, eerste lid, onderdeel c][ref3], worden het aantal toeslagrechten en
      de waarde daarvan:

      a. in geval van aankoop of lange termijn huur van grond vastgesteld door het op grond van [artikel 17][ref4]
      berekende extra referentiebedrag, te delen door het aantal gekochte of gehuurde hectaren,

      b. in geval van investeringen in stalcapaciteit, dieren, premierechten voor ooien of zoogkoeien en leveringsrechten
      voor zetmeelaardappelen, indien de landbouwer reeds toeslagrechten in eigendom heeft, vastgesteld door het op
      grond van [artikel 17][ref5] berekende extra referentiebedrag, te delen door dit aantal toeslagrechten en de waarde
      daarvan naar evenredigheid te verhogen,

      c. in geval van investeringen in stalcapaciteit, dieren of premierechten voor ooien of zoogkoeien, indien een
      landbouwer niet over hectaren beschikt en geen toeslagrechten in eigendom heeft, vastgesteld door het op grond van
      [artikel 17][ref6] berekende extra referentiebedrag, te delen door een waarde per eenheid die niet groter is dan
      € 5.000,–, waarbij de waarde van elk toeslagrecht gelijk is aan die waarde per eenheid.

      3 Voor landbouwers als bedoeld in [artikel 16, eerste lid, onderdeel d][ref7], die een bedrijf of een deel van een
      bedrijf hebben gehuurd, worden het aantal toeslagrechten en de waarde daarvan vastgesteld door het op grond van
      [artikel 17][ref8] berekende extra referentiebedrag te delen door het aantal gehuurde hectaren.

      4 Voor landbouwers als bedoeld in [artikel 16, eerste lid, onderdeel d][ref9], die grond hebben gekocht worden het
      aantal toeslagrechten en de waarde daarvan vastgesteld door het op grond van [artikel 17][ref10] berekende extra
      referentiebedrag te delen door het aantal gekochte hectaren.


