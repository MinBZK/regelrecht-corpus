  - number: '30'
    text: |-
      1 De verbouw van grondstoffen overeenkomstig [artikel 29][ref1] vindt plaats op basis van een schriftelijke
      overeenkomst die door de landbouwer is gesloten met een in een lidstaat van de Europese Unie gevestigde eerste
      verwerker of inzamelaar.

      2 De overeenkomst bevat:

      a. de gegevens, genoemd in artikel 147, tweede lid, van [verordening 1973/2004](32004R1973);

      b. de productieregio waarin de betrokken percelen zijn gelegen;

      c. het kalenderjaar waarin de grondstoffen zullen worden geoogst;

      d. de verplichting voor de landbouwer de totale hoeveelheid van de in de overeenkomst omschreven en tevens door
      middel van de toepasselijke GN-code aangeduide grondstof, welke wordt geproduceerd op de percelen waarop de
      overeenkomst betrekking heeft, te leveren aan de eerste verwerker of inzamelaar;

      e. de verplichting voor de eerste verwerker of inzamelaar de geleverde hoeveelheid grondstof volledig af te nemen
      en te verzekeren dat deze zal worden gebruikt voor de vervaardiging van één of meer van de in de overeenkomst
      omschreven en tevens door middel van de toepasselijke GN-code aangeduide eindproducten, als bedoeld in
      [artikel 29, eerste lid][ref2].

      3 In Nederland gevestigde eerste verwerkers of inzamelaars waarmee een overeenkomst wordt gesloten dienen door het
      HPA te zijn erkend.

      4 De erkenning wordt op aanvraag verleend en vindt eerst plaats nadat door de AID is vastgesteld dat de
      bedrijfsadministratie, de opslagruimten en, indien van toepassing, de productiewijze en -middelen voldoen aan de
      vereisten die daaraan moeten worden gesteld in verband met de controle op de bestemming die aan de grondstoffen
      moet worden gegeven.

      5 De landbouwer bewaart een origineel exemplaar van de met de eerste verwerker of inzamelaar gesloten overeenkomst
      of een gewaarmerkte kopie daarvan bij zijn bedrijfsadministratie, bedoeld in [artikel 58][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel58
