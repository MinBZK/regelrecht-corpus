  - number: '22'
    text: |-
      1 Overdracht van toeslagrechten geschiedt met in achtneming van artikel 46 van [verordening 1782/2003](32003R1782)
      en de artikelen 25 tot en met 27 van [verordening 795/2004](32004R0795).

      2 Aanspraak op betaling op basis van overgedragen toeslagrechten kan slechts worden gemaakt indien de cedent
      DR overeenkomstig artikel 25 van [verordening 795/2004](32004R0795) zes weken voor de overdracht doch uiterlijk
      op 31 maart, in kennis heeft gesteld van de voorgenomen overdracht en DR geen bezwaar heeft gemaakt tegen de
      overdracht wegens strijdigheid met [verordening 1782/2003](32003R1782) of [verordening 795/2004](32004R0795).
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel22
  - number: '23'
    text: |-
      Overeenkomstig artikel 53 van [verordening 1782/2003](32003R1782) worden op aanvraag braakleggingstoeslagrechten
      toegewezen aan landbouwers die tijdens de referentieperiode op grond van artikel 6, eerste lid, van [verordening
      (EG) nr. 1251/1999](31999R1251) verplicht waren om een deel van de tot hun bedrijf behorende grond braak te leggen.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel23
  - number: '24'
    text: |-
      1 Voor betalingen op basis van braakleggingstoeslagrechten komen uitsluitend in aanmerking landbouwers die hun
      grond uit productie nemen overeenkomstig artikel 54 tot en met 56 van [verordening 1782/2003](32003R1782), artikel
      32 tot en met 34 van [verordening 795/2004](32004R0795) en met in achtneming van de navolgende bepalingen.

      2 Een voor een braakleggingstoeslagrecht in aanmerking komende hectare, als bedoeld in artikel 54 van [verordening
      1782/2003](32003R1782), heeft:

      a. een oppervlakte van tenminste 0,1 ha en een breedte van tenminste 10 meter, en

      b. wordt beschikbaar gehouden als braakperceel gedurende een aaneengesloten periode, die loopt van uiterlijk
      15 januari tot en met 31 augustus daaropvolgend en gebruikt in overeenstemming met de in het eerste lid genoemde
      bepalingen.

      3 In afwijking van de minimumbreedte genoemd in het tweede lid, onderdeel a, is het de landbouwer toegestaan
      percelen van ten minste 5 meter breed met elk een oppervlakte van ten minste 0,05 hectare, uit productie te nemen,
      indien zij grenzen aan oppervlaktewater, onder de navolgende voorwaarden:

      a. de percelen worden ingezaaid met een groenbemester overeenkomstig [artikel 7, eerste lid][ref1];

      b. in afwijking van [artikel 7, tweede lid][ref2], worden op de betrokken percelen in de periode vanaf 15 januari
      tot en met 30 september:

        - geen dierlijke of overige organische meststoffen gebruikt,
        - geen fytofarmaceutische producten, herbiciden daaronder begrepen, gebruikt, behoudens voor de pleksgewijze
      bestrijding van onkruid die uit landbouwkundig oogpunt noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel7
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel24
