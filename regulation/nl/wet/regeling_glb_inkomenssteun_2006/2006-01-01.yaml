  - number: '13'
    text: |-
      1 De landbouwer die overeenkomstig artikel 40 van [verordening 1782/2003](32003R1782) verzoekt om berekening
      van het referentiebedrag op een andere basis omdat zijn productie gedurende de referentieperiode nadelig werd
      beïnvloed door een geval van overmacht of uitzonderlijke omstandigheden, stelt DR daarvan uiterlijk op 15 mei 2006
      schriftelijk in kennis, waarbij deze kennisgeving vergezeld gaat van relevant bewijsmateriaal.

      2 De landbouwer die tijdens de referentieperiode landbouwmilieuverbintenissen uit hoofde van [verordening (EEG)
      nr. 2078/92](31992R2078) en (EG) nr. 1257/1999 moest nakomen, kan overeenkomstig artikel 40, vijfde lid, van
      [verordening 1782/2003](32003R1782) verzoeken om berekening van het referentiebedrag op een andere basis en stelt
      DR daarvan uiterlijk op 15 mei 2006 schriftelijk in kennis, waarbij deze kennisgeving vergezeld gaat van relevant
      bewijsmateriaal.

      3 Het referentiebedrag bedoeld in artikel 40, vijfde lid, tweede alinea, van [verordening 1782/2003](32003R1782)
      wordt in voorkomend geval vastgesteld met inachtneming van artikel 16 van [verordening 795/2004](32004R0795).
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel13
  - number: '14'
    text: |-
      De nationale reserve, bedoeld in artikel 42 van [verordening 1782/2003](32003R1782), omvat het bedrag dat
      voortvloeit uit:

      a. de lineaire verlaging van de referentiebedragen, bedoeld in artikel 42, eerste lid, van [verordening 1782/2003]
      (32003R1782), van 0,25%;

      b. het verschil tussen het nationale maximum en de som van de referentiebedragen, bedoeld in artikel 42, tweede
      lid, van [verordening 1782/2003](32003R1782);

      c. de niet gebruikte toeslagrechten, bedoeld in de artikelen 42, achtste lid en 45, eerste lid, van [verordening
      1782/2003](32003R1782);

      d. in voorkomend geval, de lineaire verlagingen van de toeslagrechten, bedoeld in artikel 42, zevende lid, van
      [verordening 1782/2003](32003R1782).
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel14
  - number: '15'
    text: |-
      De bedragen, bedoeld in artikel 34, derde lid, tweede alinea, van [verordening 1782/2003](32003R1782), die
      overeenstemmen met de niet toegekende toeslagrechten vervallen aan de nationale reserve en komen vanaf 16 mei 2006
      opnieuw voor toewijzing beschikbaar.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel15
  - number: '16'
    text: |-
      1 Voor toewijzing van toeslagrechten uit de nationale reserve komen uitsluitend in aanmerking:

      a. melkveehouders op wie artikel 19 van [verordening 795/2004](32004R0795) van toepassing is;

      b. landbouwers die overeenkomstig een van de in artikel 20 van [verordening 795/2004](32004R0795) genoemde wijzen
      een bedrijf of een deel van een bedrijf in bezit hebben gekregen dat tijdens de referentieperiode was verhuurd,
      indien ten genoegen van de minister wordt aangetoond dat zij de betrokken grond in bezit hebben gekregen;

      c. landbouwers die overeenkomstig artikel 21 van [verordening 795/2004](32004R0795) geïnvesteerd hebben in
      productiecapaciteit of grond hebben gekocht, indien ten genoegen van de minister wordt aangetoond dat zij
      overeenkomstig artikel 21 van [verordening 795/2004](32004R0795), uiterlijk op 15 mei 2004:

        - geïnvesteerd hebben in stalcapaciteit, of deze voor tenminste zes jaar hebben gehuurd;
        - grond hebben gekocht, of voor tenminste zes jaar hebben gehuurd;
        - dieren hebben gekocht waarvoor een in bijlage VI bij [verordening 1782/2003](32003R1782) genoemde rechtstreekse
      betaling kon worden verkregen;
        - premierechten voor ooien of zoogkoeien hebben gekocht, of
        - leveringsrechten voor de voor zetmeelproductie bestemde aardappelen, bedoeld in [verordening 1766/1992]
      (31992R1766) van de Raad van 30 juni 1992 houdende een gemeenschappelijke ordening der markten in de sector granen
      hebben gekocht, voor zover deze ook daadwerkelijk worden benut.

      d. landbouwers die overeenkomstig artikel 22 van [verordening 795/2004](32004R0795) grond hebben gehuurd of
      aangekocht, indien ten genoegen van de minister wordt aangetoond dat zij deze grond uiterlijk op 15 mei 2004 hebben
      gehuurd respectievelijk gekocht;

      e. landbouwers die overeenkomstig artikel 23bis van [verordening 795/2004](32004R0795) op grond van een
      gerechtelijke uitspraak of bestuursrechtelijke uitspraak recht hebben op toewijzing van toeslagrechten of op
      verhoging van de waarde daarvan.

      2 Landbouwers als bedoeld in het eerste lid, onderdeel b tot en met d, komen uitsluitend in aanmerking voor
      toeslagrechten uit de nationale reserve voor zover:

      a. zij als gevolg van de investering in productiecapaciteit of het in bezit krijgen, kopen of huren van
      subsidiabele grond, in de zin van artikel 44, tweede lid, van [verordening 1782/2003](32003R1782), in het daarop
      volgende kalenderjaar, beschikken over meer:

      i. stalcapaciteit,

      ii. dieren waarvoor een in bijlage VI bij [verordening 1782/2003](32003R1782) genoemde rechtstreekse betaling kon
      worden verkregen,

      iii. premierechten voor ooien of zoogkoeien,

      iv. leveringsrechten voor de voor zetmeelproductie bestemde aardappelen en bijbehorend areaal, of

      v. hectaren, die recht hebben gegeven op de in bijlage VI van [verordening 1782/2003](32003R1782) genoemde
      rechtstreekse betalingen, in geval van steun voor aardappelzetmeel, gedroogde voedergewassen en zaaizaad, berekend
      overeenkomstig bijlage VII van [verordening 1782/2003](32003R1782) en alle voederareaal als bedoeld in artikel 43,
      derde lid, van [verordening 1782/2003](32003R1782),

      dan de betrokken productiecapaciteit of grond die in de referentieperiode beschikbaar was;

      b. zij op basis daarvan meer rechtstreekse betalingen hebben ontvangen, zoals berekend op grond van
      [artikel 17][ref1]; en

      c. voor zover deze bijkomende productiecapaciteit of grond nog geen recht geeft op toewijzing van toeslagrechten of
      referentiebedragen op basis van de referentieperiode.

      3 Een aanvraag tot vaststelling van toeslagrechten uit de nationale reserve vindt plaats overeenkomstig
      [artikel 11][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel11
