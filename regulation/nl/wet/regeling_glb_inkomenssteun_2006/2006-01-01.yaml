        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '28'
    text: |-
      De landbouwer kan een hectare als bedoeld in [artikel 24][ref1] door andere gronden vervangen, overeenkomstig 54,
      vijfde lid, van [verordening 1782/2003](32003R1782), indien:

      a. de perceelsindeling of de verkaveling van het bedrijf van overheidswege wordt gewijzigd of op grond van de
      Plantenziektewet beperkingen worden gesteld aan het telen van akkerbouwgewassen op het bedrijf;

      b. de oppervlakte van de vervangende gronden niet groter is dan de oppervlakte van het te vervangen perceel;

      c. voor zover van toepassing, de eigenaar, beperkt gebruiksgerechtigde, verpachter dan wel pachter van de te
      vervangen percelen heeft ingestemd met het vervangen van deze gronden; en

      d. voorafgaande aan het betrokken verkoopseizoen schriftelijk toestemming is verkregen van DR. Een schriftelijke
      aanvraag daartoe kan in de periode die loopt van 15 oktober tot en met 1 december worden ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '5'
  - number: '29'
    text: |-
      1 In afwijking van [artikel 7][ref1] mogen landbouwers overeenkomstig de bepalingen van hoofdstuk 16 van
      [verordening 1973/2004](32004R1973) en de [artikelen 30 tot en met 38][ref2], de overeenkomstig [artikel 24][ref3]
      uit productie genomen oppervlakte gebruiken voor het verbouwen van grondstoffen specifiek met het oog op verwerking
      van de grondstoffen in de Europese Gemeenschap tot een of meer eindproducten welke zijn genoemd in bijlage XXIII
      van [verordening 1973/2004](32004R1973) en welke niet zijn bestemd voor menselijke of dierlijke voeding.

      2 Geen subsidie wordt verstrekt voor de overeenkomstig [artikel 24][ref4] uit productie genomen percelen waarop de
      verbouw van aardperen, cichoreiwortels en suikerbieten plaatsvindt.

      3 Grondstoffen van GN-code 0701 90 10 mogen slechts worden verbouwd onder de navolgende voorwaarden:

      a. de betrokken percelen zijn in de drie voorafgaande teeltseizoenen niet met aardappelen bebouwd geweest;

      b. ten hoogste 25% van de totale oppervlakte akkerland van het bedrijf wordt gebruikt voor de teelt van
      aardappelen;

      c. gedurende de vijf kalenderjaren, die volgen op de onderhavige aardappelteelt, blijft een grondontsmetting
      achterwege;

      d. voor de onderhavige aardappelteelt worden slechts aardappelrassen gebruikt, waaraan blijkens de meest
      recente Beschrijvende Rassenlijst voor landbouwgewassen ten minste het cijfer 6 is toegekend voor de eigenschap
      ‘resistentie tegen Phytophthora in het loof’;

      e. voordat de onderhavige aardappelteelt aanvangt, wordt ieder daarvoor bestemd perceel door een door de minister
      aangewezen instelling onderzocht op aardappelmoeheid;

      f. indien een perceel, dat voor de onderhavige aardappelteelt wordt gebruikt, blijkens het in onderdeel e bedoelde
      onderzoek niet vrij is van aardappelmoeheid, worden daarop slechts aardappelen geteeld van rassen, die door de in
      onderdeel e bedoelde instelling zijn aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel7
