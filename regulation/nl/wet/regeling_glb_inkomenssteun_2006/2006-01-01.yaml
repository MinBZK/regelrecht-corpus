  - number: '25'
    text: |-
      Percelen die zijn bebost in het kader van de Regeling stimulering bosuitbreiding op landbouwgronden uit hoofde
      van een aanvraag die na 28 juni 1995 is ingediend, kunnen in aanmerking worden gebracht voor betaling op basis
      van braakleggingstoeslagrechten.
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel25
  - number: '26'
    text: |-
      In afwijking van [artikel 7][ref1] is het de landbouwer vanaf 15 juli toegestaan de in het kader van deze regeling
      uit productie genomen percelen ten behoeve van de oogst van het daaropvolgende kalenderjaar in te zaaien met de in
      [bijlage 3][ref2] bij deze regeling genoemde gewassen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '7'
        hoofdstuk: '1'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
  - number: '27'
    text: |-
      1 Onverminderd [artikel 24, eerste lid][ref1], komen eveneens voor betaling op basis van
      braakleggingstoeslagrechten in aanmerking, landbouwers die vanwege hun biologische productiemethoden
      overeenkomstig artikel 55, onderdeel a, van [verordening 1782/2003](32003R1782), zijn vrijgesteld van de
      braakleggingsverplichting, doch uitsluitend indien de verzamelaanvraag vergezeld gaat van een bewijs van
      certificering door de Stichting SKAL te Zwolle voor het gehele bedrijf van de landbouwer.

      2 In afwijking van [artikel 7, eerste lid][ref2], is het verbouwen van grondstoffen specifiek met het oog op
      verwerking van producten die niet in de eerste plaats zijn bestemd voor menselijke of dierlijke consumptie
      op uit productie genomen oppervlakten toegestaan, mits overeenkomstig de voorwaarden die voortvloeien uit de
      [artikelen 29 tot en met 38][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel29
    url: https://wetten.overheid.nl/BWBR0019131/2006-01-01#Artikel27
