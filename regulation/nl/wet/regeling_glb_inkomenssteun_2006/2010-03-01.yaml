      k. I&R-systeem: gecomputeriseerd gegevensbestand als bedoeld in artikel 5 van [Verordening (EG) nr. 1760/2000]
      (32000R1760) van het Europees Parlement en de Raad van de Europese Gemeenschappen van 17 juli 2000 tot
      vaststelling van een identificatie- en registratieregeling voor runderen en inzake de etikettering van rundvlees en
      rundvleesproducten en tot intrekking van [Verordening (EG) nr. 820/97](31997R0820) van de Raad;

      l. Suikersysteem 2006: op de voet van artikel 19, derde lid, van [Verordening (EG) nr. 1260/2001](32001R1260) van
