  - number: '63'
    text: |-
      DR is belast met de uitvoering van

      a. de bedrijfstoeslagregeling;

      b. de specifieke steun, bedoeld in [Hoofdstuk 2a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel63
