  - number: '2'
    text: |-
      1 Overeenkomstig verordening 73/2009 en met inachtneming van ter uitvoering daarvan vastgestelde
      Commissieverordeningen en deze regeling:

      1. wijst de minister op aanvraag aan landbouwers toeslagrechten op grond van artikel 33, eerste lid, onderdeel b,
      onder ii en iv, van verordening 73/2009 in het kader van de bedrijfstoeslagregeling toe.

      2. verstrekt de minister op aanvraag aan landbouwers subsidie op grond van:

      a. de bedrijfstoeslagregeling,

      b. de productiesteun voor zetmeelaardappelen en zaaizaad van vezelvlas,

      c. de specifieke steunregelingen als opgenomen in [Hoofdstuk 2a][ref1] van deze regeling.

      2 De Minister beslist op de aanvraag, bedoeld in het eerste lid, onder 2, uiterlijk op 30 juni van het jaar volgend
      op het jaar van indiening van de aanvraag.

      3 Vanaf 16 oktober 2009 betaalt de minister op grond van artikel 1 van verordening 691/2009, voorschotten van 70%
      van de betalingen voor de steunaanvragen, bedoeld in het eerste lid, onderdeel 2, subonderdeel a, die in 2009 zijn
      gedaan, op voorwaarde dat de toetsing van de subsidiabiliteitsvoorwaarden overeenkomstig artikel 20 van Verordening
      73/2009 is afgerond.

      4 Op de voet van verordening 1535/2007 betaalt de minister naast het voorschot, bedoeld in het derde lid, een
      aanvullend voorschot van 30% van de betalingen voor de steunaanvragen, bedoeld in het eerste lid, onderdeel
      2, subonderdeel a, die in 2009 zijn gedaan, op voorwaarde dat de toetsing van de subsidiabiliteitsvoorwaarden
      overeenkomstig artikel 20 van Verordening 73/2009 is afgerond.

      5 Landbouwers die een aanvullend voorschot ontvangen op grond van het vierde lid, controleren per
      landbouwonderneming of zij met inbegrip van het rentevoordeel dat zij als gevolg van het aanvullend voorschot
      zouden genieten in 2007, 2008 en 2009 in totaal niet meer dan € 7.500 aan de minimis-steun hebben ontvangen op
      grond van verordening 1535/2007. Indien dit het geval is, retourneren zij dit rentevoordeel onverwijld aan DR en
      stellen zij DR daarvan op de hoogte.

      6 Betalingen, ontvangen op grond van het derde en vierde lid, komen in mindering op betalingen die de landbouwer op
      of na 1 december 2009 zou ontvangen op grond van artikel 29, tweede lid, van Verordening 73/2009.


