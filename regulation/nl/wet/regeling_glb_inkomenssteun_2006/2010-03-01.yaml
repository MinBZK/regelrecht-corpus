  - number: '38'
    text: |-
      In deze paragraaf en [paragraaf 4][ref1] wordt verstaan onder:

      a. *I&R-systeem schapen en geiten:* systeem, bedoeld in
      [artikel 34, onderdeel a, van de Regeling identificatie en registratie van dieren][ref2];

      b. *schaap of geit:* schaap of geit, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __;

      c. *elektronisch merken:* het identificeren van een schaap of geit, overeenkomstig
      [artikel 12e, eerste lid, onderdelen a tot en met h, van de Regeling identificatie en registratie van dieren][ref4]
      .


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel34
