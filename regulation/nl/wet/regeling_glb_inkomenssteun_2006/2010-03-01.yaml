  - number: 55a
    text: |-
      1 De landbouwer die gebruik wil maken van [artikel 10][ref1], maar geen toeslagrechten in eigendom heeft op 15 mei
      2010, vraagt toeslagrechten aan door het indienen van een door DR vastgesteld aanvraagformulier bij de Directeur
      DR.

      2 De landbouwer dient het aanvraagformulier, bedoeld in het eerste lid, uiterlijk in op 15 mei 2010.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel10
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel55a
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 55b
    text: |-
      1 De landbouwer die gebruik wil maken van [artikel 11, eerste lid, onderdeel a][ref1], verstrekt ten genoegen van
      de minister de benodigde informatie voor het vaststellen van het relevante referentiejaar of referentiejaren.

      2 De landbouwer die gebruik wil maken van [artikel 11, eerste lid, onderdeel b][ref2], verstrekt het een
      kopie van het verkoopcontract en een omschrijving van de overgedragen aanspraken op toeslagrechten, bedoeld in
      [artikel 10][ref3]. Daarbij worden ook de overgedragen landbouwondernemingen waaraan een UBN is toegekend en het
      aantal overgedragen hectares omschreven.

      3 Een aanvraag en de gegevens, bedoeld in het tweede lid, mogen met expliciete toestemming van de verkoper ook met
      aanvraag van de koper worden ingediend.

      4 De landbouwer die gebruik wil maken van [artikel 11, eerste lid, onderdeel c][ref4], verstrekt een kopie van het
      verhuurcontract en het aantal hectaren waarvoor hij de toeslagrechten verhuurt.

      5 De landbouwer die gebruik wil maken van [artikel 16, eerste lid][ref5], verstrekt ten genoegen van de minister de
      benodigde informatie voor het vaststellen van het voldoen aan de voorwaarden van deze regeling.

      6 De landbouwer dient de gegevens, bedoeld in dit artikel in voor 15 mei 2010, met een door DR vastgesteld
      formulier, bij de Directeur DR.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel11
