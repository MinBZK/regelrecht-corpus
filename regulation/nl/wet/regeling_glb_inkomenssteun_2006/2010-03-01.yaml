  - number: '4'
    text: |-
      1 De minister kan met inachtneming van artikel 4, eerste lid, van verordening 1122/2009 bepalen dat het landbouwers
      verboden is blijvend grasland om te zetten in land voor andere vormen van grondgebruik, behoudens voorafgaande
      ontheffing.

      2 Een verzoek tot ontheffing wordt ingediend op een door DR vastgesteld formulier dat door de landbouwer volledig
      en naar waarheid is ingevuld, ondertekend en gedagtekend.

      3 Bij de indiening van het verzoek tot ontheffing legt de landbouwer alle bewijsstukken over die DR nodig acht voor
      de beoordeling van het verzoek.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel4
  - number: '5'
    text: |-
      1 Indien het aandeel van het blijvend grasland in de totale oppervlakte landbouwgrond als bedoeld in artikel 3,
      eerste lid, van verordening 1122/2009 met meer dan 10% dreigt af te nemen ten opzichte van het aandeel blijvend
      grasland in 2003, is de landbouwer die beschikt over land dat van blijvend grasland is omgezet in land voor andere
      vormen van grondgebruik, verplicht tot het opnieuw omzetten van land in blijvend grasland. De minister stelt de
      betrokken landbouwer in kennis van deze verplichting en de oppervlakte waarop deze betrekking heeft.

      2 De landbouwer aan wie de kennisgeving bedoeld in het eerste lid is gegeven, is verplicht tot het omzetten van
      land in blijvend grasland voor het moment van indienen van de eerstvolgende verzamelaanvraag en overeenkomstig de
      voorwaarden van de kennisgeving.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel5
  - number: '9'
    text: |-
      1 De bedragen die een landbouwer op grond van de in [artikel 2][ref1] genoemde steunregelingen aan subsidies
      ontvangt, worden conform het bepaalde in artikel 7 van verordening 73/2009 procentueel verlaagd ten behoeve van
      modulatie.

      2 De minister past in voorkomend geval de lineaire verlaging toe, bedoeld in artikel 8, eerste lid, laatste volzin,
      van verordening 73/2009.


