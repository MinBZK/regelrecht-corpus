        paragraaf: '1'
  - number: '27'
    text: |-
      1 In afwijking van [artikel 26, derde lid, onderdeel e][ref1], mag de schade worden vastgesteld op basis van een
      rekenmodel.

      2 Het rekenmodel wordt tezamen met de verzekeringsvoorwaarden goedgekeurd door de minister.

      3 De minister keurt het rekenmodel uitsluitend goed indien de verzekeraar aantoont dat de uitkomsten van het
      rekenmodel vergelijkbaar zijn met een schadebeoordeling door een schade-expert. Het rekenmodel bevat daartoe
      tenminste de noodzakelijke gegevens om de schade vast te kunnen stellen aan de hand van bedrijfsspecifieke gegevens
      van het landbouwbedrijf zoals het gewas en grondsoort op perceelsniveau en de feitelijke weersomstandigheid die de
      schade veroorzaakt.

      4 De verzekeraar onderzoekt elk gebruik van het rekenmodel met behulp van een steekproef. De resultaten worden ter
      beschikking gehouden van de minister.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel26
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '26'
        hoofdstuk: 2a
        paragraaf: '1'
  - number: '28'
    text: |-
      In deze paragraaf wordt verstaan onder *integraal duurzame stal of houderijsysteem*: stal of houderijsysteem dat
      voldoet aan bovenwettelijke normen op het gebied van dierenwelzijn en minimaal voldoet aan wettelijke normen op de
      gebieden: milieu, energie, diergezondheid, landschappelijke inpasbaarheid en arbeidsomstandigheden.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel28
  - number: '29'
    text: |-
      1 De minister verstrekt op aanvraag steun aan melkvee-, vleesvee-, schapen-, geiten-, varkens-, vleeskalveren-,
      pluimvee-, eenden-, kalkoenen- of konijnenhouders voor:

      a. de bouw van een integraal duurzame stal of houderijsysteem,

      b. de verbouwing van een bestaande stal of houderijsysteem tot een integraal duurzame stal of houderijsysteem, of

      c. de installatie van het noodzakelijke materieel voor de werking van de integraal duurzame en diervriendelijke
      stal of het integraal duurzame en diervriendelijke houderijsysteem.

      2 Het steunpercentage bedraagt 50% voor onderdelen van het investeringsplan die zijn gerealiseerd in de periode
      vanaf de datum van de aanvraag tot steunverlening tot 1 maart van het daaropvolgende jaar.

      3 Indien [artikel 34, vierde lid, onderdeel c][ref1], van toepassing is, bedraagt het steunpercentage 40% voor
      onderdelen van het investeringsplan die zijn gerealiseerd in de periode die begint na de in het tweede lid bedoelde
      periode, tot 1 maart van het daaropvolgende jaar.

      4 De minister verstrekt ten hoogste € 400.000 steun per aanvraag tot steunverlening.

      5 Het steunplafond, bedoeld in het eerste lid, bedraagt jaarlijks € 11.000.000, verminderd met het bedrag waarvoor
      nog aanspraak kan worden gemaakt op grond van beschikkingen tot steunverlening die in een voorgaand jaar zijn
      genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel34
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '34'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '30'
    text: |-
      1 De landbouwer dient de aanvraag tot steunverlening in:

      a. vanaf 1 februari tot en met 28 februari in het jaar 2010, of

      b. vanaf 1 januari tot en met 31 januari in de daaropvolgende jaren.

      2 De aanvraag tot steunverlening bevat een investeringsplan waarin de volgende gegevens zijn opgenomen:

      a. een omschrijving van de investeringen die de landbouwer wil doen om een integraal duurzame stal of
      houderijsysteem te realiseren,

      b. een omschrijving van de meerkosten van de integraal duurzame stal of houderijsysteem, ten opzichte van een stal
      of houderijsysteem gebouwd volgens gangbare technieken of alleen in overeenstemming met de wettelijke normen,

      c. een omschrijving van de integraal duurzame stal of houderijsysteem, de installatieprocedure en het onderscheid
      tussen de kostenonderdelen, en

      d. de fasen, periodes of tijdstippen waarin de landbouwer de investeringen zal realiseren, en

      e. een verklaring van een bank, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref1], dat de
      landbouwonderneming levensvatbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:1
  - number: '31'
    text: |-
      1 De landbouwer kan slechts één aanvraag tot steunverlening per jaar indienen op grond van deze paragraaf.

      2 De landbouwer mag niet zijn begonnen met het realiseren van onderdelen van het investeringsplan voor de aanvraag
      tot steunverlening is ingediend.

      3 De landbouwer realiseert het investeringsplan of de door de minister bepaalde onderdelen daarvan binnen de
      termijn die de minister heeft gesteld in de beschikking tot steunverlening.

      4 De landbouwer dient de aanvragen op grond van deze paragraaf in bij de Directeur DR met gebruikmaking van een
      daartoe door DR verstrekt formulier en verklaart daarbij dat hij zich bewust is van de voorwaarden voor verkrijging
      van deze steun.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel31
  - number: '32'
    text: |-
      1 Aanvragen voor steunverlening worden niet in behandeling genomen:

      a. indien deze zijn ingediend na de daarvoor gestelde periode, of

      b. indien de aanvraag tijdig is ingediend maar indien de daarbij verstrekte gegevens en bescheiden onvoldoende zijn
      voor de beoordeling van de aanvraag.

      2 Indien het eerste lid, onderdeel b, van toepassing is, stelt de minister de landbouwer eerst in de gelegenheid om
      de ontbrekende gegevens binnen 14 werkdagen aan te vullen, alvorens op de aanvraag te beslissen.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel32
  - number: '33'
    text: |-
      1 In aanmerking komende kosten zijn de meerkosten van investeringen in:

      a. de bouw of inrichting van integraal duurzame en diervriendelijke stallen en houderijsystemen,

      b. de verbetering van bestaande stallen en houderijsystemen tot integraal duurzame en diervriendelijke stallen en
      houderijsystemen, of

      c. de kosten voor de montage en installatie van het noodzakelijke materieel voor de werking van integraal duurzame
      en diervriendelijke stallen of houderijsystemen.

      2 Een investering komt alleen voor steun op grond van deze paragraaf in aanmerking indien deze noodzakelijk is voor
      de realisatie van een integraal duurzame stal of houderijsysteem.

      3 Gangbare, reguliere of vervangingsinvesteringen en investeringen die gericht zijn op het voldoen aan bestaande
      wettelijke eisen, komen niet voor steun in aanmerking op grond van deze paragraaf.

      4 Een investering die al uit hoofde van andere openbare middelen is gesubsidieerd of gefinancierd komt niet voor
      steun in aanmerking.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel33
  - number: '34'
    text: |-
      1 De minister stelt een commissie in die advies uitbrengt over de onderdelen van het investeringsplan en over de
      rangschikking van de aanvragen voor steunverlening.

      2 De minister rangschikt een aanvraag hoger naarmate:

      a. de integraal duurzame stal of houderijsysteem waarin de landbouwer investeert in de beginfase van
      marktintroductie verkeert,

      b. de investering in de integraal duurzame stal of houderijsysteem meer economisch of technisch perspectief heeft,

      c. er voor de investering in de integraal duurzame stal of houderijsysteem een betere verhouding tussen de prijs en
      kwaliteit bestaat, gezien het aangevraagde steunbedrag en de verbetering van het dierenwelzijn, en

      d. er voor de investering in de integraal duurzame stal of houderijsysteem een betere verhouding tussen de prijs
      en kwaliteit bestaat, gezien het aangevraagde steunbedrag en de verbetering van het milieu, diergezondheid,
      arbeidsomstandigheden of landschappelijke inpasbaarheid.

      3 De minister beslist binnen vier maanden na ontvangst van de aanvraag.

      4 De beschikking tot steunverlening bevat de volgende onderdelen:

      a. het goedgekeurde investeringsplan, inclusief de essentiële onderdelen daarin,

      b. de termijnen voor realisatie van onderdelen van het investeringsplan,

      c. de toestemming om bij uitzondering bepaalde onderdelen van het investeringsplan te realiseren in het jaar dat
      volgt op het jaar waarin de aanvraag tot steunverlening is ingediend, waarbij de landbouwer tevens verplicht wordt
      om:

      i. tenminste een aantal omschreven essentiële onderdelen van het investeringsplan te realiseren in het jaar waarin
      de aanvraag tot steunverlening is ingediend,

      ii. een aanvraag in te dienen, bedoeld in [artikel 36, eerste lid][ref1],

      d. de ten hoogste te verstrekken steun.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel36
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '36'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '35'
    text: |-
      Op aanvraag kan de minister de beschikking tot steunverlening wijzigen ten behoeve van een aanpassing van het
      investeringsplan. De steun die met de beschikking op grond van dit artikel wordt verstrekt is nooit hoger dan de
      steun die zou worden verstrekt op grond van de beschikking tot steunverlening.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel35
  - number: '36'
    text: |-
      1 Indien [artikel 34, vierde lid, onderdeel c][ref1], van toepassing is, betaalt de minister op aanvraag steun voor
      tijdig gerealiseerde onderdelen van het investeringsplan.

      2 Een aanvraag, bedoeld in het eerste lid:

      a. wordt ingediend in de periode van 1 december van het jaar waarin de steun is verleend, tot 1 maart van het
      daaropvolgend jaar, en

      b. gaat in ieder geval vergezeld van documenten waaruit blijkt dat de landbouwer heeft voldaan aan de op grond van
      [artikel 34, vierde lid, onderdeel c, subonderdeel i][ref2], gestelde verplichtingen en wat daarvoor de gemaakte
      kosten zijn,

      3 De steun, bedoeld in het eerste lid, is ten hoogste gelijk aan de steun die op grond van de beschikking tot
      steunverlening kan worden verstrekt, vermenigvuldigd met de verhouding tussen de kosten van alle subsidiabele
      investeringen en de gerealiseerde subsidiabele investeringen.

      4 De minister kan aanvullende documenten vragen alvorens te beslissen op de aanvraag, bedoeld in het eerste lid.

      5 De minister behandelt een aanvraag als bedoeld in het eerste lid als een aanvraag tot steunvaststelling indien
      blijkt dat alle subsidiabele investeringen zijn gerealiseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel34
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '34'
        hoofdstuk: 2a
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0019131
        artikel: '34'
        hoofdstuk: 2a
        paragraaf: '2'
  - number: '37'
    text: |-
      1 Op aanvraag stelt de minister de steun vast.

      2 De aanvraag tot steunvaststelling wordt ingediend:

      a. in de periode tussen 1 december van het jaar waarin de steun is verleend tot 1 maart van het daaropvolgende
      jaar, of

      b. in de periode tussen 1 december van het jaar dat volgt op het jaar waarin de aanvraag tot steunverlening
      is ingediend en waarop [artikel 34, vierde lid, onderdeel c][ref1], van toepassing is, tot 1 maart van het
      daaropvolgende jaar.

      3 De aanvraag, bedoeld in het eerste lid, gaat in ieder geval vergezeld van de documenten waaruit blijkt dat de
      landbouwer het investeringsplan heeft gerealiseerd en wat daarvoor de gemaakte kosten zijn.

      4 Bij de steunvaststelling moet ten genoegen van de minister gebleken zijn dat de landbouwer heeft voldaan aan alle
      voorwaarden die bij de steunverlening zijn gesteld.

      5 De minister vermindert het bedrag van de steun dat bij vaststelling wordt betaald, met steun die de aanvrager
      heeft of kon ontvangen op grond van [artikel 36, eerste lid][ref2].

      6 De minister stelt de steun ambtshalve vast indien er geen aanvraag is ingediend na afloop van de in het tweede
      lid gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel36
