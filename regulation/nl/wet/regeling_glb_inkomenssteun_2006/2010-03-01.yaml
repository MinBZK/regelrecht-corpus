  - number: '70'
    text: |-
      Indien een landbouwer niet alle in artikel 13, achtste lid, van verordening 1122/2009 bedoelde oppervlakten opgeeft
      en daarbij het verschil tussen enerzijds de totale in de verzamelaanvraag aangegeven oppervlakte en anderzijds de
      som van de aangegeven oppervlakte en de totale oppervlakte van de niet-aangegeven percelen groter is dan 3% van de
      aangegeven oppervlakte, wordt het totale bedrag van de rechtstreekse betalingen die in dat jaar aan die landbouwer
      moet worden gedaan, als volgt verlaagd:

      a. indien het verschil groter is dan 3% en kleiner dan of gelijk aan 10% bedraagt de verlaging 1%;

      b. indien het verschil groter is dan 10% en kleiner dan of gelijk aan 20% bedraagt de verlaging 2%;

      c. indien het verschil groter is dan 20% bedraagt de verlaging 3%.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel70
  - number: 70a
    text: |-
      De steun, bedoeld in [Hoofdstuk 2a, paragraaf 1][ref1], wordt verlaagd overeenkomstig artikel 23 van verordening
      1122/2009, indien de in [artikel 25][ref2] bedoelde kopieën en documenten worden verstrekt na de in dat artikel
      gestelde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Hoofdstuk2a
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel25
