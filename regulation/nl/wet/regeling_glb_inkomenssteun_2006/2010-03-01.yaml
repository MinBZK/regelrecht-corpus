  - number: 38e
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *vaarvergoeding:* vergoeding voor het verrichten van landbouwactiviteiten, als bedoeld in artikel 2, onder c,
      van verordening 73/2009, op een vaarperceel.

      b. *vaarperceel:* perceel dat als zodanig is aangewezen in [bijlage 3][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel38e
    references:
      - id: ref1
        bwb_id: BWBR0019131
  - number: 38f
    text: |-
      1 De minister verstrekt specifieke steun aan landbouwers in de vorm van een vaarvergoeding van € 500 per hectare
      per jaar voor vaarpercelen.

      2 De vaarvergoeding wordt evenredig verlaagd voor alle voor vaarvergoeding in aanmerking te nemen aanvragen
      indien het totaal van de voor steun in aanmerking te nemen aanvragen het bedrag van € 1.000.000 per kalenderjaar
      overstijgt.

      3 Indien voor het desbetreffende perceel reeds subsidie voor het uitrijden van ruige mest uit hoofde van de
      Subsidieverordening natuur- en landschapsbeheer, de [Subsidieregeling agrarisch natuurbeheer][ref1] of de
      Subsidieregeling agrarisch natuurbeheer van de onderscheiden provincies wordt toegekend, bedraagt de steun, bedoeld
      in het eerste lid, € 405,50 per hectare per jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel38f
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: 38g
    text: |-
      Een landbouwer komt uitsluitend in aanmerking voor steun op grond van deze paragraaf indien:

      a. de totale oppervlakte van de vaarpercelen waarvoor hij steun op grond van deze paragraaf ontvangt tenminste 0,5
      hectare bedraagt;

      b. hij in de verzamelaanvraag heeft aangegeven in te stemmen met de verwerking door DR van de persoonsgegevens
      die betrekking hebben op de subsidie voor het uitrijden van ruige mest die DR heeft verkregen in het
      kader van de subsidieaanvraag op grond van de Subsidieverordening natuur- en landschapsbeheer, de
      [Subsidieregeling agrarisch natuurbeheer][ref1] of de Subsidieregeling agrarisch natuurbeheer van de onderscheiden
      provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0011000
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel38g
    references:
      - id: ref1
        bwb_id: BWBR0011000
  - number: '42'
    text: |-
      De landbouwer die voor de zetmeelproductie bestemde aardappelen produceert overeenkomstig de artikelen 77 en 78
      van verordening 73/2009 en hoofdstuk 3 van verordening 1121/2009, komt in aanmerking voor subsidie op grond van de
      productiesteun voor zetmeelaardappelen als bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel42
