  - number: '25'
    text: |-
      1 De landbouwer verstrekt jaarlijks voor 1 augustus de volgende gegevens aan de minister:

      a. het polisnummer van de verzekering,

      b. een kopie van de verzekeringsvoorwaarden, en

      c. een bewijs van betaling van de definitieve verzekeringspremie.

      2 De landbouwer is van de verplichting, bedoeld in het eerste lid, vrijgesteld indien de gegevens, bedoeld in het
      eerste lid, door de verzekeraar worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel25
  - number: '26'
    text: |-
      1 De voorwaarden van de verzekeringen, bedoeld in [artikel 24, eerste lid][ref1], worden goedgekeurd door de
      minister.

      2 De aanvraag om goedkeuring van de verzekeringsvoorwaarden wordt door de verzekeraar uiterlijk op 31 december
      voorafgaand aan het kalenderjaar waarin de premie voor steun in aanmerking wordt gebracht, ingediend bij de
      minister. De aanvraag gaat vergezeld van:

      a. een onderbouwing van de premie;

      b. een verklaring dat de verzekeraar vooraf toestemming verleent aan de minister om persoonsgegevens te verwerken
      ten behoeve van de controle op de naleving van deze regeling;

      c. een verklaring van de verzekeraar dat hij zijn administratie die betrekking heeft op de verzekeringsvoorwaarden
      ten minste 4 kalenderjaren na afloop van de verzekering ter beschikking houdt van de minister;

      d. het standaardmodel van de verzekeringspolis, en

      e. documenten waarin de verzekeraar ten genoegen van de minister aantoont dat de verzekeringsvoorwaarden voldoen
      aan het bepaalde in deze regeling.

      3 De minister verleent uitsluitend goedkeuring aan de verzekeringsvoorwaarden indien:

      a. het financieel verlies van de landbouwer wordt gedekt:

      i. voor zover dat meer is dan 30% van de gemiddelde jaarproductie in de laatste drie jaar,

      ii. als gevolg van een lagere opbrengst in kwantiteit of kwaliteit,

      iii. dat optreedt op een aaneengesloten stuk grond waarop één enkel gewas wordt geteeld, en

      iv. redelijkerwijs is toe te rekenen aan ongunstige weersomstandigheden,

      b. onder ongunstige weersomstandigheden in elk geval zijn begrepen:

      i. weersomstandigheden die volgens een schade-expert of het Koninklijk Nederlands Meteorologisch Instituut met een
      natuurramp kunnen worden gelijkgesteld, en

      ii. de volgende ongunstige weersomstandigheden: regenval; droogte; (nacht)vorst; sneeuw; ijzel; storm; hagel;
      erosie en brand door blikseminslag;

      c. alle open teelten verzekerd kunnen worden;

      d. geen eisen worden gesteld aan de aard of hoeveelheid van de toekomstige productie door de verzekerde;

      e. de voorwaarde wordt gesteld dat de schade wordt vastgesteld door een schade-expert;

      f. niet wordt uitgekeerd voorzover de landbouwer van overheidswege een tegemoetkoming in de schade ontvangt die
      ertoe leidt dat hij meer compensatie ontvangt dan hij schade heeft geleden;

      g. slechts één keer tot uitkering wordt gekomen voor een en de zelfde gebeurtenis bij dezelfde teelt,

      h. de verzekering wordt aangegaan per kalenderjaar, en

      i. de verzekering geen dekking biedt voor genomen bereddings- en preventiemaatregelen.

      4 De weersomstandigheden bedoeld in het derde lid, onderdeel b, worden geacht vooraf te zijn erkend door de
      minister, als bedoeld in artikel 70, vierde lid, tweede alinea, van verordening 73/2009. De minister kan in
      aanvulling daarop, na overleg met de brancheorganisatie van verzekeraars, ook andere ongunstige weersomstandigheden
      erkennen.

      5 In afwijking van het derde lid, onderdeel a, mag een verzekering ook tot uitkering komen bij een financieel
      verlies van minder dan 30%, mits de verzekeraar ten genoegen van de minister onderscheidt welk deel van de
      premie betrekking heeft op vergoeding van het financieel verlies van de landbouwer van minder dan 30%. In dat
      geval heeft de steun slechts betrekking op het gedeelte van de premie dat ziet op verzekeringsvoorwaarden die in
      overeenstemming zijn met de bepalingen van deze paragraaf.

      6 Het onderscheid, bedoeld in het vijfde lid, moet helder zijn omschreven in de verzekeringsvoorwaarden.

      7 In afwijking van het derde lid, onderdeel h, mag een verzekering voor meer dan een kalenderjaar worden
      aangegaan, mits de premie jaarlijks wordt betaald en de jaarlijkse premie betrekking heeft op de productie van
      één kalenderjaar.

      8 De minister publiceert de goedgekeurde verzekeringsvoorwaarden op www.minlnv.nl.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel24
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel26
