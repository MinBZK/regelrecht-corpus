  - number: '24'
    text: |-
      1 De minister verstrekt specifieke steun aan landbouwers in de vorm van een financiële bijdrage voor premies ten
      behoeve van verzekeringen, die overeenkomstig [artikel 26, derde lid][ref1], zijn goedgekeurd.

      2 De steun bedraagt 65% van de verzekeringspremie, met dien verstande dat het steunpercentage evenredig
      wordt verlaagd voor alle voor tegemoetkoming in aanmerking te nemen aanvragen indien het totaal van de voor
      tegemoetkoming in aanmerking te nemen aanvragen het bedrag van € 13.000.000 per jaar overstijgt.

      3 De steun betreft uitsluitend de premie, exclusief belastingen.

      4 Geen steun wordt verstrekt indien de landbouwer van overheidswege een andere bijdrage ontvangt voor de premie,
      bedoeld in het eerste lid.

      5 Geen steun wordt verstrekt indien de landbouwer zijn teelt niet tegen alle ongunstige weersomstandigheden,
      bedoeld in [artikel 26, derde lid, onderdeel b][ref2], heeft verzekerd.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel26
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel24
