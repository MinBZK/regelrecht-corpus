        hoofdstuk: '1'
        paragraaf: '2'
  - number: '43'
    text: |-
      1 Een landbouwer die zaaizaad van vezelvlas produceert komt in aanmerking voor subsidie op grond van de
      productiesteun voor zaaizaad als bedoeld in [artikel 2][ref1], indien:

      a. het ingezaaide perceel een oppervlakte van ten minste 0,3 ha heeft;

      b. de productie plaatsvindt op basis van een vermeerderingscontract tussen de landbouwer en het
      zaaizaadhandelsbedrijf of de kweker;

      c. de betrokken zaaizaadhandelsbedrijven of kwekers geregistreerd zijn bij het HPA;

      d. het zaaizaad uiterlijk op 15 juni van het jaar volgend op de aanvraag in de handel is gebracht.

      2 In afwijking van het eerste lid, onderdeel b, overlegt de landbouwer een verklaring omtrent de productie in het
      geval hij ook zaaizaadhandelsbedrijf of kweker is voor het geproduceerde zaaizaad van vezelvlas.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel2
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0019131
        artikel: '2'
        hoofdstuk: '1'
        paragraaf: '2'
  - number: '44'
    text: |-
      Er worden geen rechtstreekse betalingen toegekend aan landbouwers indien het totaalbedrag van de in een bepaald
      kalenderjaar aangevraagde of toe te kennen rechtstreekse betalingen vóór toepassing van de in de artikelen 21 en 23
      van verordening 73/2009 vastgestelde verlagingen en uitsluitingen lager is dan € 500.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel44
  - number: '55'
    text: |-
      1 De landbouwer die aanspraak maakt op subsidie in het kader van een van de in
      [artikel 2, eerste lid, onder 2, onderdelen a, b en c][ref1], bedoelde steunregelingen, maakt gebruik van de
      verzamelaanvraag.

      2 Voor de verzamelaanvraag maakt de landbouwer gebruik van een door de minister vastgesteld formulier dat door de
      landbouwer volledig en naar waarheid is ingevuld, ondertekend en gedagtekend.

      3 De verzamelaanvraag wordt in de periode van 1 april tot en met 15 mei ingediend bij DR.

      4 Bij de verzamelaanvraag legt de landbouwer alle bewijsstukken over die het betrokken betaalorgaan nodig acht voor
      de beoordeling van de aanvraag.

      5 Van de wijziging, verbetering of intrekking van de verzamelaanvraag overeenkomstig Deel II, Titel II, van
      verordening 1122/2009 stelt de landbouwer DR schriftelijk in kennis.

      6 In afwijking van het derde lid geldt als uiterste datum voor het indienen van teeltcontracten voor
      zetmeelaardappelen 15 juni.

      7 De landbouwer die aanspraak maakt op steun, bedoeld in [artikel 24, eerste lid][ref2], verstrekt tevens de
      volgende informatie bij de verzamelaanvraag:

      a. toestemming aan de minister om persoonsgegevens te verwerken ten behoeve van de controle op de naleving van
      deze regeling,

      b. een verklaring dat hij zich bewust is van de voorwaarden voor verkrijging van deze steun, en

      c. de naam van de verzekeraar met wie de verzekering is afgesloten.

      8 De landbouwer die in aanmerking wil komen voor steun, bedoeld in de [artikelen 38a, eerste lid][ref3],
      [38d, eerste lid][ref4], of [38f, eerste lid][ref5], verklaart op de verzamelaanvraag dat hij zich bewust is van de
      voorwaarden voor het ontvangen van deze steun.

      9 De landbouwer die in aanmerking wil komen voor steun, bedoeld in de [artikelen 38a, eerste lid][ref6] en
      [38d, eerste lid][ref7], verleent de minister toestemming om de gegevens die zijn opgenomen in het I&R-systeem
      schapen en geiten en die betrekking hebben op zijn UBN te verwerken ten behoeve van de controle op de naleving van
      deze regeling.


