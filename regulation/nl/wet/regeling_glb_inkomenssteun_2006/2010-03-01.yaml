  - number: '69'
    text: |-
      Indien een landbouwer andere dan de in [artikel 68][ref1] bedoelde voorwaarden of verplichtingen voortvloeiend uit
      verordening 73/2009 en de ter uitvoering daarvan vastgestelde Commissieverordeningen niet naleeft, wordt door DR
      met betrekking tot de in [artikel 63, eerste lid][ref2], bedoelde regelingen en het HPA met betrekking tot de in
      [artikel 64, eerste lid][ref3], bedoelde regelingen, overeenkomstig Deel II, Titel IV, hoofdstuk I van verordening
      1122/2009 een korting opgelegd op het bedrag dat op grond van de betrokken steunregeling aan de landbouwer is of
      moet worden toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel68
