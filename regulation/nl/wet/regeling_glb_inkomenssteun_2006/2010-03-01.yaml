  - number: '71'
    text: |-
      De [Regeling GLB-inkomenssteun][ref1] wordt ingetrokken, maar blijft evenwel van toepassing op aanvragen ingediend
      vóór de inwerkingtreding van de onderhavige regeling waarop nog niet onherroepelijk is beslist en, in geval van
      slacht, op slachtingen en export verricht vóór de inwerkingtreding van de onderhavige regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0017558
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0017558
  - number: 71a
    text: |-
      De Regeling GLB-inkomenssteun 2006 zoals die luidde vóór 1 januari 2009 blijft van toepassing op aanvragen die zijn
      ingediend vóór 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel71a
  - number: '77'
    text: Deze regeling treedt in werking met ingang van 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel77
  - number: '78'
    text: 'Deze regeling wordt aangehaald als: ‘Regeling GLB-inkomenssteun 2006’.'
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel78
