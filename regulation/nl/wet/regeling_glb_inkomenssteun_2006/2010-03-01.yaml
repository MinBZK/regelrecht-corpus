  - number: 38c
    text: |-
      1 De minister verstrekt steun in de vorm van een jaarlijkse financiële bijdrage van € 650.

      2 De steun wordt evenredig verlaagd voor alle voor tegemoetkoming in aanmerking te nemen aanvragen indien het
      totaal van de voor tegemoetkoming in aanmerking te nemen aanvragen het bedrag van € 1.500.000 per kalenderjaar
      overstijgt.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel38c
  - number: 38d
    text: |-
      De steun, bedoeld in [artikel 38c][ref1], kan in enig jaar alleen worden aangevraagd door landbouwers die in het
      desbetreffende jaar op 15 mei eigenaar of huurder zijn van een landbouwonderneming waaraan een UBN is toegekend en
      waarvan op grond van [artikel 37, eerste lid, van de Regeling identificatie en registratie van dieren][ref2] op 1
      november van het voorafgaande jaar is gebleken dat er op dat moment op dat UBN in totaal meer dan 100 schapen of
      geiten werden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel38c
      [ref2]: https://wetten.overheid.nl/BWBR0014538#Artikel37
