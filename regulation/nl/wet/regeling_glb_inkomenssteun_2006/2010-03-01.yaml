        paragraaf: '1'
  - number: '57'
    text: |-
      De landbouwer is verplicht op verzoek van DR en het HPA alle gewenste nadere inlichtingen, ter zake van de gegevens
      verschaft bij de ingediende aanvragen op grond van deze regeling, terstond en naar waarheid te verstrekken.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel57
  - number: '58'
    text: |-
      1 De landbouwer is verplicht in zijn bedrijfsadministratie alle in de betrokken verordening, deze regeling en door
      DR en het HPA voorgeschreven bewijsstukken te bewaren.

      2 De bedrijfsadministratie wordt door de landbouwer op eerste vordering aan de met toezicht op de naleving van deze
      regeling belaste persoon ter inzage gegeven.

      3 De landbouwer bewaart de bedrijfsadministratie op zijn bedrijf ten minste drie jaar na afloop van het jaar waarin
      subsidie is aangevraagd.
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel58
  - number: '59'
    text: |-
      1 Indien een bedrijf volledig wordt overgedragen nadat een verzamelaanvraag is ingediend en voordat aan alle
      voorwaarden voor het verstrekken van subsidie is voldaan, of indien een bedrijf volledig wordt overgedragen nadat
      de voor de toekenning van de steun vereiste handelingen zijn begonnen, maar voordat aan alle voorwaarden voor de
      toekenning van de steun is voldaan, wordt de aangevraagde subsidie overeenkomstig het tweede en derde lid verstrekt
      aan de overnemer, bedoeld in artikel 82 van verordening 1122/2009, dan wel aan de oorspronkelijke aanvrager.

      2 De desbetreffende aangevraagde subsidie wordt verstrekt aan de overnemer indien:

      a. DR de schriftelijke melding van de overdracht uiterlijk op de laatste dag van de in
      [artikel 55, derde lid][ref1], bedoelde termijn voor het indienen van de verzamelaanvraag ontvangt van de
      overnemer,

      b. de overnemer het betrokken betaalorgaan uiterlijk op de laatste dag van de in [artikel 55, derde lid][ref2],
      bedoelde termijn verzoekt om betaling van de door de wederpartij aangevraagde subsidie,

      c. de overnemer alle door DR verlangde bewijsstukken overlegt, en

      d. wordt voldaan aan alle voorwaarden voor de verstrekking van de steun.

      3 De desbetreffende aangevraagde subsidie wordt verstrekt aan de oorspronkelijke aanvrager indien:

      a. DR de in het tweede lid, onder a, bedoelde melding niet of na de in [artikel 55 derde lid][ref3] bedoelde
      termijn van de overnemer heeft ontvangen,

      b. wordt voldaan aan alle voorwaarden voor de verstrekking van de steun, en

      c. de oorspronkelijke aanvrager alle door DR verlangde bewijsstukken overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0019131#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0019131#Artikel55
      [ref3]: https://wetten.overheid.nl/BWBR0019131#Artikel55
    url: https://wetten.overheid.nl/BWBR0019131/2010-03-01#Artikel59
