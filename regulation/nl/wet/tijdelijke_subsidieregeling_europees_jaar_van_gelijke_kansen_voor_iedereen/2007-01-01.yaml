---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: tijdelijke_subsidieregeling_europees_jaar_van_gelijke_kansen_voor_iedereen
regulatory_layer: WET
publication_date: '2006-12-18'
valid_from: '2007-01-01'
bwb_id: BWBR0020704
url: https://wetten.overheid.nl/BWBR0020704/2007-01-01
preamble:
  text: |-
    Gelet op de artikelen 3, eerste lid, 5 en8 van de Kaderwet SZW-subsidies;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder: - begunstigde: de subsidieaanvrager aan wie op grond van deze regeling
      subsidie is verleend;
        - de Minister: de Minister van Sociale Zaken en Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel1
  - number: '2'
    text: |-
      De Minister kan op aanvraag subsidie verstrekken als bijdrage in de kosten van een project, gericht op de
      bevordering van bewustwording met betrekking tot gelijke kansen voor iedereen.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel2
  - number: '3'
    text: |-
      Het subsidieplafond bedraagt per thema, genoemd in [artikel 6, onderdeel c][ref1], € 333.333,33.


      [ref1]: https://wetten.overheid.nl/BWBR0020704#Artikel6
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0020704
        artikel: '6'
  - number: '4.1'
    text: Projectsubsidie wordt aangevraagd door een in Nederland gevestigde rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: '4.2'
    text: De subsidie wordt verstrekt aan de subsidieaanvrager.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: '4.3'
    text: |-
      Projectsubsidie kan eveneens worden aangevraagd door een samenwerkingsverband van in Nederland gevestigde
      rechtspersonen. In dat geval treedt een van de partijen in het samenwerkingsverband namens dat samenwerkingsverband
      als subsidieaanvrager op. Bij de aanvraag ten behoeve van een samenwerkingsverband wordt een door de partijen
      in het samenwerkingsverband getekende verklaring overgelegd, waaruit blijkt dat de rechtspersoon die namens het
      samenwerkingsverband optreedt gemachtigd is het samenwerkingsverband in en buiten rechte te vertegenwoordigen.
      De projectsubsidie wordt verleend aan de rechtspersoon die namens het samenwerkingsverband optreedt als
      subsidieaanvrager.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: '4.4'
    text: Per subsidieaanvrager wordt één aanvraag ingediend.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: '4.5'
    text: |-
      Voor de toepassing van het vierde lid wordt naast de subsidieaanvrager, bedoeld in het eerste tot en derde lid, als
      subsidieaanvrager aangemerkt:
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: 4.5.a
    text: |-
      de rechtspersoon die de meerderheid van de aandelen dan wel anderszins de zeggenschap heeft in de
      subsidieaanvrager, bedoeld in het eerste tot en met derde lid;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: 4.5.b
    text: |-
      andere rechtspersonen waarin de rechtspersoon, bedoeld in onderdeel a, de meerderheid van de aandelen dan wel
      anderszins de zeggenschap heeft; en
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: 4.5.c
    text: |-
      rechtspersonen waarin de subsidieaanvrager, bedoeld in het eerste tot en met derde lid, de meerderheid van de
      aandelen dan wel anderszins de zeggenschap heeft.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel4
  - number: '5.1'
    text: |-
      De subsidieaanvrager maakt bij de indiening van de aanvraag gebruik van het daarvoor door de Minister verstrekte
      formulier, dat is ingericht overeenkomstig het model van [bijlage 1][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020704
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020704
  - number: '5.2'
    text: 'Bij de subsidieaanvraag wordt een projectplan overgelegd waarin is opgenomen:'
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: 5.2.a
    text: een opgave van de begindatum en de duur van het project;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: 5.2.b
    text: een beschrijving en analyse van het probleem waarop het project zich richt;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: 5.2.c
    text: een beschrijving van de doelstelling en beoogde resultaten van het project;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: 5.2.d
    text: |-
      een beschrijving van het instrument dat toegepast zal worden, de uit te voeren activiteiten, alsmede een tijdpad
      waarbinnen eventuele deelactiviteiten worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: 5.2.e
    text: een beschrijving van de wijze waarop de resultaten van het project worden geëvalueerd;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: 5.2.f
    text: |-
      een beschrijving van de wijze waarop de doelgroep actief is betrokken bij de opzet, uitvoering en evaluatie van het
      project; en
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: 5.2.g
    text: |-
      een beschrijving van de inbedding, overdraagbaarheid of verspreiding van de projectresultaten na afloop van de
      projectperiode.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: '5.3'
    text: |-
      Het projectplan, bedoeld in het tweede lid, gaat vergezeld van een uitgewerkte begroting die is ingericht
      overeenkomstig het model van [bijlage 2][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020704
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0020704
  - number: '5.4'
    text: De Minister ontvangt in de periode van 2 tot en met 31 januari 2007 de subsidieaanvraag.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel5
  - number: '6'
    text: 'Een project komt slechts voor subsidie in aanmerking indien:'
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.a
    text: het project na 28 februari 2007 van start gaat en uiterlijk 31 december 2007 wordt afgerond;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.b
    text: 'het project zich richt op de volgende gronden tot onderscheid tussen personen:'
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.b.1°
    text: godsdienst of levensovertuiging,
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.b.2°
    text: ras,
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.b.3°
    text: geslacht,
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.b.4°
    text: seksuele gerichtheid,
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.b.5°
    text: handicap of chronische ziekte, en
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.b.6°
    text: leeftijd;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.c
    text: het project betrekking heeft op het thema arbeidsmarkt, het thema wijk/buurt of het thema jongeren;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: 6.d
    text: de projectresultaten om niet beschikbaar worden gesteld aan de Minister en door hem aangewezen derden.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel6
  - number: '7.1'
    text: |-
      Uitsluitend begrote kosten van activiteiten die voor de ontwikkeling of uitvoering van het project als noodzakelijk
      zijn aan te merken en ten laste van de subsidieaanvrager blijven, komen voor subsidiëring in aanmerking.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel7
  - number: '7.2'
    text: |-
      Geen subsidie wordt verleend voor begrote kosten van activiteiten die voor de datum van subsidieverlening ten
      behoeve van het project zijn ontwikkeld of uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel7
  - number: '8'
    text: |-
      De subsidie bedraagt de subsidiabele kosten, bedoeld in [artikel 7][ref1], tot een maximum van € 50.000,– per
      project.


      [ref1]: https://wetten.overheid.nl/BWBR0020704#Artikel7
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020704
        artikel: '7'
  - number: '9.1'
    text: |-
      Voor het bepalen van het bereiken van het subsidieplafond worden de in de periode van 2 tot en met 31 januari 2007
      ontvangen volledige subsidieaanvragen in volgorde van datum van ontvangst behandeld.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel9
  - number: '9.2'
    text: |-
      Van een volledige subsidieaanvraag als bedoeld in het eerste lid is sprake, indien wordt voldaan aan
      [artikel 5][ref1]. Wanneer de subsidieaanvrager in de gelegenheid is gesteld om zijn onvolledige subsidieaanvraag
      aan te vullen, geldt als datum van ontvangst de datum van ontvangst van de volledige subsidieaanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0020704#Artikel5
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020704
        artikel: '5'
  - number: '9.3'
    text: |-
      Indien toekenning van aanvragen met betrekking tot een thema als bedoeld in [artikel 6, onderdeel c][ref1], die
      op dezelfde datum zijn binnengekomen leidt tot overschrijding van het subsidieplafond met betrekking tot dat
      thema wordt met betrekking tot die aanvragen de volgorde van behandeling door middel van loting door een notaris
      vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020704#Artikel6
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020704
        artikel: '6'
  - number: '9.4'
    text: |-
      Indien volledige toekenning van een subsidieaanvraag met betrekking tot een thema als bedoeld in
      [artikel 6, onderdeel c][ref1], zou leiden tot overschrijding van het subsidieplafond met betrekking tot dat thema
      wordt de subsidieaanvraag geheel afgewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0020704#Artikel6
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0020704
        artikel: '6'
  - number: '10'
    text: 'Op de subsidieaanvraag wordt in ieder geval afwijzend beslist, indien:'
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel10
  - number: 10.a
    text: |-
      niet wordt voldaan aan [artikel 2][ref1], [4][ref2], [5][ref3] of [6][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0020704#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0020704#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0020704#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0020704#Artikel6
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0020704
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0020704
        artikel: '4'
      - id: ref3
        bwb_id: BWBR0020704
        artikel: '5'
      - id: ref4
        bwb_id: BWBR0020704
        artikel: '6'
  - number: 10.b
    text: |-
      de kosten van het project naar het oordeel van de Minister niet in een redelijke verhouding staan tot de beoogde
      effecten;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel10
  - number: 10.c
    text: het aangevraagde subsidiebedrag minder bedraagt dan € 20.000,– of meer dan € 50.000,–;
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel10
  - number: 10.d
    text: |-
      onverminderd [artikel 6, eerste lid, onderdeel d][ref1], en
      [artikel 6, tweede lid, van de Algemene Regeling SZW-subsidies][ref2], voor de kosten, bedoeld in
      [artikel 7][ref3], op grond van enige andere regeling van de Minister subsidie wordt verleend of aanspraak bestaat
      op subsidie voor activiteiten als bedoeld in [artikel 2][ref4] die geheel of gedeeltelijk in diezelfde periode
      worden verricht als het project waarvoor op grond van deze regeling subsidie wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0009211#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0009211#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0020704#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0020704#Artikel2
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009211
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0009211
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0020704
        artikel: '7'
      - id: ref4
        bwb_id: BWBR0020704
        artikel: '2'
  - number: '11'
    text: |-
      Indien de gevraagde subsidie geheel of gedeeltelijk wordt verleend zendt de Minister aan de subsidieaanvrager een
      beschikking tot subsidieverlening met een voorschotverlening van 80% van de verleende subsidie.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel11
  - number: '12'
    text: |-
      De begunstigde verleent op verzoek van de Minister medewerking aan publicitaire en voorlichtingsactiviteiten in
      het kader van het Europees Jaar van gelijke kansen voor iedereen en draagt er zorg voor dat de projectresultaten
      presentabel zijn voor een door de Minister georganiseerde slotconferentie met betrekking tot de projecten.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel12
  - number: '13.1'
    text: |-
      De subsidie-ontvanger dient binnen vier maanden na afloop van de gesubsidieerde activiteiten dan wel na afloop van
      het tijdvak waarover subsidie is verleend, doch niet later dan 1 maart 2008, een verantwoording in bij de Minister.
      Bij deze verantwoording wordt een declaratie ingediend.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel13
  - number: '13.2'
    text: |-
      De Minister stelt de subsidie uiterlijk 1 maart 2008 vast indien de verantwoording, bedoeld in het eerste lid, is
      ingediend voor of op 5 januari 2008.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel13
  - number: '13.3'
    text: |-
      Indien de verantwoording, bedoeld in het eerste lid, is ingediend na 5 januari 2008 stelt de Minister de subsidie
      uiterlijk acht weken na ontvangst van de verantwoording vast.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onverminderd [afdeling 4.2.6 van de Algemene wet bestuursrecht][ref1] kan een beschikking tot verlening van
      projectsubsidie geheel of gedeeltelijk worden ingetrokken, en kunnen de op basis daarvan uitbetaalde bedragen
      kunnen worden teruggevorderd, in geval het project wordt uitgevoerd in afwijking van de bij de aanvraag gevoegde
      projectbeschrijving, voor zover de subsidieverlening daarop was gebaseerd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.6
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.6
  - number: '14.2'
    text: |-
      Intrekking en terugvordering op grond van het eerste lid vindt niet plaats, indien de afwijking vooraf aan de
      Minister is voorgelegd, en deze daarmee schriftelijk heeft ingestemd.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel14
  - number: '15.1'
    text: |-
      Met het toezicht op de naleving van deze regeling zijn belast de daartoe bij besluit van de Minister aangewezen
      ambtenaren van het Agentschap SZW en de Auditdienst, beide onderdeel van het Ministerie van Sociale Zaken en
      Werkgelegenheid.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel15
  - number: '15.2'
    text: |-
      De subsidieaanvrager verleent aan de toezichthouders alle medewerking die dezen redelijkerwijs kunnen vorderen bij
      de uitoefening van hun bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel15
  - number: '16.1'
    text: Deze regeling treedt in werking met ingang van 1 januari 2007 en vervalt met ingang van 1 januari 2009.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel16
  - number: '16.2'
    text: |-
      In afwijking van het eerste lid blijft de regeling, zoals die geldt op 31 december 2008, van toepassing op de
      financiële afwikkeling van de subsidie van de Minister aan de subsidieontvanger.
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel16
  - number: '17'
    text: 'Deze regeling wordt aangehaald als: Tijdelijke subsidieregeling Europees Jaar van gelijke kansen voor iedereen.'
    url: https://wetten.overheid.nl/BWBR0020704/2007-01-01#Artikel17
