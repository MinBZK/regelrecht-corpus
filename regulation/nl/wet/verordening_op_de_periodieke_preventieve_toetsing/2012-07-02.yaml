  - number: '11'
    text: |-
      1 De accountantspraktijk kan binnen een door het bestuur te stellen termijn schriftelijk commentaar op het
      toetsingsverslag als bedoeld in [artikel 10, tweede lid][ref1], aan het bestuur zenden.

      2 Het bestuur beperkt zich tot een marginale toetsing van het toetsingsverslag en stelt naar aanleiding hiervan en
      het eventuele commentaar als bedoeld in het vorige lid een eindoordeel vast, al dan niet voorzien van aanbevelingen
      en/of aanwijzingen voor het treffen van maatregelen ter correctie van geconstateerde tekortkomingen, dat hij binnen
      zes weken na afloop van de in het eerste lid bedoelde termijn ter kennis brengt van de accountantspraktijk. Het
      bestuur kan gemotiveerd afwijken van het voorstel van het toetsingsteam.

      3 Het bestuur kan de in het tweede lid genoemde termijn van zes weken verlengen.

      4 Het eindoordeel kan als volgt luiden:

      a. het interne stelsel van kwaliteitsbeheersing voldoet aan de daaraan te stellen eisen;

      b. het interne stelsel van kwaliteitsbeheersing voldoet niet aan de daaraan te stellen eisen.

      5 In het geval het eindoordeel luidt zoals omschreven in het vierde lid, onderdeel b van dit artikel:

        - dient de accountantspraktijk binnen een door het bestuur te stellen termijn een door het bestuur goed te keuren
      verbeterplan in; en
        - stelt het bestuur een termijn waarbinnen het stelsel van kwaliteitsbeheersing dient te worden aangepast aan de
      normen als bedoeld in [artikel 3][ref2].

      6 Indien uit het verbeterplan naar het oordeel van het bestuur blijkt dat te weinig of onvoldoende toereikende
      maatregelen zullen worden genomen ter correctie van de geconstateerde tekortkomingen, dan kan het bestuur volstaan
      met een gedeeltelijke goedkeuring van het verbeterplan en daarbij aangeven op welke onderdelen het verbeterplan
      tekortschiet.

      7 Voor het beoordelen van het in lid 5 van dit artikel bedoelde verbeterplan wordt aan de accountantspraktijk een
      tarief in rekening gebracht waarvan de hoogte in de Verordening op de tarieven periodieke preventieve toetsing
      is vastgesteld.

      8 De tijd welke het bestuur besteedt aan de beoordeling van een verbeterplan, schort niet de termijn op bedoeld in
      het vijfde lid, tweede onderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0014165#Artikel3
