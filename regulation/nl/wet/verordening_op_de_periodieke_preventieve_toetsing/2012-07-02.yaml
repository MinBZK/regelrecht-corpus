preamble:
  text: |-
    Gelet op artikel 24, eerste lid, van de Wet op de Accountants-Administratieconsulenten;

    Overwegende dat het in het belang van een goede beroepsuitoefening door Accountants-Administratieconsulenten
    wenselijk is te voorzien in een stelsel dat gericht is op beheersing van de kwaliteit van de beroepsuitoefening
    door Accountants-Administratieconsulenten die optreden als accountant in de zin van artikel 2, tweede lid, Gedrags-
    en Beroepsregels voor Accountants-Administratieconsulenten;

    Stelt de volgende verordening vast:
  url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze verordening wordt verstaan onder:

        - *accountant:* de Accountant-Administratieconsulent die werkzaam is als openbaar accountant;
        - *accountantspraktijk:* de accountantspraktijk, bedoeld in de [Verordening gedragscode][ref1];
        - *bestuur:* het bestuur van de NOvAA;
        - *dagdeel:* een tijdsperiode van drie uur;
        - *koepelorganisatie:* een organisatie waarvan een accountantspraktijk onderdeel uitmaakt of waarbij de
      accountantspraktijk is aangesloten en die bevoegd is aan de accountantspraktijk bindende regels voor de
      kwaliteitsbeheersing op te leggen, te toetsen en de naleving daarvan af te dwingen, alsmede een beroepsorganisatie
      die aan zijn leden een dwingend stelsel van kwaliteitsbeheersing heeft opgelegd, deze toetst en de naleving daarvan
      kan afdwingen;
        - *NOvAA:* de Nederlandse Orde van Accountants-Administratieconsulenten;
        - *openbaar accountant:* de openbaar accountant, bedoeld in de [Verordening gedragscode][ref2];
        - *Raad:* de individuele personen die op grond van
      [artikel 3, eerste lid, van de Verordening op de Raad van Toezicht Beroepsuitoefening AA’s][ref3] zijn of zullen
      worden benoemd als lid van de Raad van Toezicht Beroepsuitoefening AA’s;
        - *registeraccountant:* de registeraccountant, bedoeld in
      [artikel 1, eerste lid, van de Wet op de Registeraccountants][ref4];
        - *(her)toetsing:* de beoordeling van de kwaliteit van de beroepsuitoefening, niet betrekking hebbend op de
      verrichting van wettelijke controles, van een accountant die optreedt in een accountantspraktijk, door niet aan die
      accountantspraktijk gelieerde Accountants-Administratieconsulenten en registeraccountants;
        - *toetsingsteam:* het team dat door het bestuur voor een toetsing wordt samengesteld en belast is met de
      uitvoering van de toetsing van een accountantspraktijk;
        - *verbeterplan:* een op de in [artikel 11, tweede lid][ref5], bedoelde aanbevelingen en aanwijzingen gebaseerd
      document, waarin op planmatige en gestructureerde wijze wordt aangegeven welke maatregelen worden getroffen ter
      correctie van de geconstateerde tekortkomingen van het in [artikel 3, eerste lid][ref6], bedoelde stelsel van
      kwaliteitsbeheersing;
        - *voorzitter:* de voorzitter van de NOvAA;
        - *wettelijke controle:* de wettelijke controle, bedoeld in
      [artikel 1, eerste lid, onderdeel p, van de Wet toezicht accountantsorganisaties][ref7].


