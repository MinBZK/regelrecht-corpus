  - number: '15'
    text: |-
      1 Koepelorganisaties kunnen het bestuur verzoeken hun stelsel van kwaliteitsbeheersing te accrediteren.

      2 Ten behoeve van deze accreditatie toetst het bestuur de opzet en werking van het stelsel van
      kwaliteitsbeheersing.

      3 De kosten van de behandeling van een verzoek tot accreditatie, waaronder mede wordt begrepen de toetsing
      van de opzet en werking van het stelsel van kwaliteitsbeheersing, komen voor rekening van de desbetreffende
      koepelorganisatie.

      4 De accreditatie wordt verleend voor de duur van drie jaar of zoveel korter als het bestuur beslist.

      5 Het bestuur neemt een besluit binnen zestien weken na ontvangst van het verzoek als bedoeld in het eerste lid.

      6 Het bestuur kan aan de accreditatie voorwaarden verbinden.

      7 De koepelorganisatie doet onverwijld mededeling aan het bestuur van wijzigingen in het geaccrediteerde stelsel
      van kwaliteitsbeheersing.

      8 Het bestuur bericht de koepelorganisatie binnen een door het bestuur te stellen termijn welke gevolgen de
      wijzigingen hebben voor de accreditatie.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel15
  - number: 15a
    text: |-
      1 De kosten van een accreditatie als bedoeld in [artikel 15, derde lid][ref1], worden gevormd door het aantal
      aangevangen dagdelen dat de toetsers gezamenlijk bij de koepelorganisatie aan de toetsing hebben besteed,
      vermenigvuldigd met het tarief.

      2 Het tarief wordt jaarlijks door de ledenvergadering vastgesteld in de Verordening op de tarieven periodieke
      preventieve toetsing.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel15
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0014165
        artikel: '15'
        hoofdstuk: III
  - number: '17'
    text: |-
      Van vertrouwelijke gegevens in het kader van de toetsing verkregen, kan geen verder en ander gebruik worden gemaakt
      dan krachtens deze verordening is bepaald, tenzij bij wet anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel17
  - number: '18'
    text: |-
      1 De kosten van een toetsing komen voor rekening van de getoetste accountantspraktijk.

      2 De kosten van een toetsing worden gevormd door het aantal aangevangen dagdelen dat de toetsers gezamenlijk bij de
      accountantspraktijk aan de toetsing hebben besteed, vermenigvuldigd met het tarief.

      3 Het tarief wordt jaarlijks door de ledenvergadering vastgesteld in de Verordening op de tarieven periodieke
      preventieve toetsing.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel18
  - number: '19'
    text: In situaties die procedureel van aard zijn en waarin deze verordening niet voorziet, beslist het bestuur.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel19
  - number: 19a
    text: |-
      1 Besluiten en handelingen door de Raad verricht worden beschouwd als besluiten en handelingen krachtens mandaat of
      volmacht namens het bestuur verricht.

      2 Het bepaalde in het vorige lid werkt terug tot 1 januari 2003.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel19a
  - number: '20'
    text: |-
      1 Deze verordening treedt in werking de tweede dag na publicatie in de Staatscourant.

      2 Deze verordening wordt aangehaald als: Verordening op de periodieke preventieve toetsing.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel20
