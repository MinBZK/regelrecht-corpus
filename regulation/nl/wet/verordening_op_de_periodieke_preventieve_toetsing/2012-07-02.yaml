  - number: '12'
    text: |-
      1 In het geval het eindoordeel luidt als bedoeld in [artikel 11, vierde lid, onderdeel b][ref1], zal een
      hertoetsing plaatsvinden.

      2 In het geval het eindoordeel luidt als bedoeld in [artikel 11, vierde lid, onderdeel b][ref2], blijven het
      zevende, achtste lid en negende lid van [artikel 14][ref3] buiten toepassing.

      3 De hertoetsing vindt plaats na afloop van de in [artikel 11, vijfde lid][ref4] bedoelde termijn waarbinnen het
      stelsel van kwaliteitsbeheersing dient te worden aangepast.


