  - number: '2'
    text: |-
      Een accountantspraktijk wordt, om de kwaliteit van de beroepsuitoefening van een accountant te kunnen beoordelen,
      in beginsel eenmaal in de zes jaar aan toetsing onderworpen.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel2
  - number: '3'
    text: |-
      1 De accountant draagt er zorg voor dat de accountantspraktijk waarbij hij werkzaam is of waaraan hij is verbonden,
      beschikt over een stelsel van kwaliteitsbeheersing dat is afgestemd op de aard, omvang en het belang van de
      opdrachten, niet zijnde opdrachten tot het uitvoeren van wettelijke controles en waarmee wordt voldaan aan het
      bepaalde bij en krachtens de [Wet op de Accountants-Administratieconsulenten][ref1].

      2 De accountant verleent medewerking aan de toetsing van het stelsel van kwaliteitsbeheersing van de
      accountantspraktijk waarbij hij werkzaam is of waaraan hij is verbonden.

      3 De voorzitter kan zijn bevindingen in de vorm van een klacht ter kennis van de accountantskamer brengen indien
      hem bij de uitoefening van het toezicht van feiten of omstandigheden blijkt die grond kunnen opleveren tot het
      opleggen van een tuchtrechtelijke maatregel, althans tot gegrondverklaring van de klacht.

      4 Indien bij een accountantspraktijk meerdere accountants werkzaam zijn of aan een accountantspraktijk meerdere
      accountants verbonden zijn, bepaalt de voorzitter voor de toepassing van het derde lid, tegen welke accountants hij
      een klacht aanhangig maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0002856
  - number: '4'
    text: |-
      1 De toetsing houdt een onderzoek in waarbij wordt nagegaan of het interne stelsel van kwaliteitsbeheersing, niet
      betrekking hebbend op de verrichting van wettelijke controles, in opzet en werking voldoet aan het bij en krachtens
      de [Wet op de Accountants-Administratieconsulenten][ref1] bepaalde.

      2 De toetsing omvat alle vormen van dienstverlening binnen de accountantspraktijk, niet zijnde opdrachten tot het
      uitvoeren van wettelijke controles, waar de accountant optreedt.


      [ref1]: https://wetten.overheid.nl/BWBR0002856
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002856
  - number: '5'
    text: |-
      1 De toetsing wordt uitgevoerd aan de hand van door het bestuur vastgestelde toetsingsprogramma’s.

      2 Het bestuur maakt de in het eerste lid van dit artikel bedoelde toetsingsprogramma’s bekend aan de leden van
      de NOvAA.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel5
  - number: '6'
    text: |-
      1 Het bestuur is belast met de selectie en opleiding van de toetsers.

      2 De toetsers zijn Accountants-Administratieconsulenten of registeraccountants die werkzaam zijn als accountant of
      maximaal drie jaar geleden werkzaam zijn geweest als accountant en voldoen aan nader door het bestuur te stellen
      eisen.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel6
  - number: '7'
    text: |-
      1 Accountantspraktijken dienen de hen jaarlijks door het bestuur toegezonden vragenlijst binnen uiterlijk vier
      weken ingevuld te retourneren.

      2 Het bestuur stelt vast welke accountantspraktijken in een bepaald jaar in aanmerking komen voor een toetsing.

      3 Het bestuur stelt ten behoeve van elke toetsing een toetsingsteam samen.

      4 Het toetsingsteam is belast met de uitvoering van de toetsing van de accountantspraktijk.

      5 Bij het samenstellen van het toetsingsteam wordt rekening gehouden met de aard en de omvang van de te toetsen
      accountantspraktijk en met mogelijke feiten en omstandigheden waardoor de objectiviteit van de toetsers zou kunnen
      worden aangetast.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel7
  - number: '8'
    text: |-
      1 Het bestuur maakt de datum waarop de toetsing zal plaatsvinden, ten minste zes weken van tevoren bekend aan een
      accountantspraktijk.

      2 Indien een accountantspraktijk aannemelijk maakt dat een toetsing op de datum welke op grond van het eerste
      lid bekend is gemaakt, niet mogelijk is, kan het bestuur een andere datum bekend maken waarop de toetsing zal
      plaatsvinden.

      3 Indien het tweede lid toepassing vindt, kan het bestuur in overleg met een accountantspraktijk afwijken van de in
      het eerste lid genoemde termijn van zes weken.

      4 Het bestuur doet mededeling van de samenstelling van het toetsingsteam, alsmede van de termijn waarbinnen een
      verzoek als bedoeld in het vijfde lid van dit artikel kan worden ingediend.

      5 De accountantspraktijk kan binnen een door het bestuur te stellen termijn aan het bestuur verzoeken elk van de
      toetsers die de toetsing uitvoert te wraken op grond van feiten of omstandigheden waardoor de onpartijdigheid van
      de toetser zou kunnen worden aangetast.

      6 Indien het bestuur van oordeel is dat er sprake is van feiten of omstandigheden waardoor de objectiviteit van de
      toetser aangetast zou kunnen worden of de schijn wordt gewekt dat de objectiviteit van de toetsers aangetast zou
      kunnen worden, wijzigt hij de samenstelling van het toetsingsteam.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel8
  - number: '9'
    text: |-
      Indien zich over de wijze van uitvoering van de toetsing een meningsverschil voordoet tussen de aan toetsing
      onderworpen accountantspraktijk en het toetsingsteam, doet het bestuur op verzoek van de accountantspraktijk of het
      toetsingsteam een bindende uitspraak.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel9
  - number: '10'
    text: |-
      1 Het toetsingsteam bespreekt direct na afloop van de toetsing met de accountantspraktijk hetgeen is waargenomen
      tijdens de toetsing.

      2 Het toetsingsteam stelt binnen een door het bestuur te stellen termijn na de eindbespreking een toetsingsverslag
      samen.

      3 Het toetsingsverslag als bedoeld in het tweede lid omvat naast de waarnemingen van het toetsingsteam tevens een
      gemotiveerd voorstel voor een oordeel als bedoeld in [artikel 11, vierde lid][ref1].

      4 Het toetsingsteam kan bij het voorstel voor een oordeel zoals bedoeld in [artikel 11, vierde lid sub a][ref2]
      aanbevelingen doen voor het treffen van maatregelen ter verbetering. Bij het voorstel voor een oordeel zoals
      omschreven in [artikel 11, vierde lid sub b][ref3], kan het toetsingsteam naast het doen van aanbevelingen voor
      het treffen van maatregelen ter verbetering, tevens een voorstel doen voor aanwijzingen voor het treffen van
      maatregelen ter verbetering, rekening houdend met het bepaalde in [artikel 4, eerste lid][ref4].

      5 Het toetsingsteam stuurt het toetsingsverslag binnen een door het bestuur te stellen termijn aan het bestuur. Het
      bestuur draagt zorg voor verzending van het toetsingsverslag aan de accountantspraktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0014165#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0014165#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0014165#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0014165#Artikel4
