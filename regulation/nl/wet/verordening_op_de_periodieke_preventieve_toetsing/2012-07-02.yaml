  - number: '13'
    text: |-
      Indien de getoetste accountantspraktijk of de individuele accountant die werkzaam is bij of verbonden is aan de
      getoetste accountantspraktijk, de inhoud van het toetsingsverslag of het eindoordeel van het bestuur openbaar
      maakt,

      a. neemt hij het bepaalde in artikel A-150.2 van de Verordening gedragscode in acht en;

      b. vermeldt hij de datum waarop de meest recente (her)toetsing heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0014165/2012-07-02#Artikel13
  - number: '14'
    text: |-
      1 Het bestuur kan naar aanleiding van een daartoe door een accountantspraktijk schriftelijk ingediend en
      gedocumenteerd verzoek besluiten tijdelijke vrijstelling van een toetsing te verlenen.

      2 Een verzoek tot tijdelijke vrijstelling van de toetsing of de verlenging daarvan
      wordt eerst in behandeling genomen nadat het tarief hiervoor, waarvan de hoogte in de
      [Verordening op de tarieven periodieke preventie toetsing][ref1] is vastgesteld, door de desbetreffende
      accountantspraktijk is voldaan.

      3 Een tijdelijke vrijstelling wordt slechts verleend wanneer een accountantspraktijk tijdelijk niet in staat is te
      voldoen aan de normen, bedoeld in [artikel 3, eerste lid][ref2] doordat:

      a. de accountantspraktijk zich bevindt in een opstartfase of een afbouwfase;

      b. de accountantspraktijk als partij minder dan een jaar geleden betrokken is geweest, dan wel binnen een jaar
      betrokken zal raken bij een fusie met of een overname van een accountantspraktijk van vergelijkbare omvang; of

      c. de samenwerking tussen een aanzienlijk deel van de bij de accountantspraktijk werkzame accountants of de aan de
      accountantspraktijk verbonden accountants minder dan een jaar geleden is verbroken.

      4 Een tijdelijke vrijstelling kan slechts worden verleend voor de duur van maximaal één jaar met de mogelijkheid
      tot verlenging voor de duur van maximaal één jaar.

      5 Het bestuur neemt een beslissing binnen acht weken na ontvangst van het verzoek tot tijdelijke vrijstelling.

      6 Het bestuur kan de in het vijfde lid genoemde termijn verlengen met maximaal zes weken.

      7 Accountantspraktijken die zijn onderworpen aan een geaccrediteerd stelsel van kwaliteitsbeheersing zijn voor de
      duur van deze accreditatie vrijgesteld van toetsing door het bestuur.

      8 Accountantspraktijken die zijn onderworpen aan een stelsel van kwaliteitsbeheersing waarvoor een verzoek als
      bedoeld in [artikel 15, eerste lid][ref3], is ingediend, zijn gedurende de periode waarin het bestuur op het
      verzoek nog geen beslissing heeft genomen, vrijgesteld van toetsing door het bestuur.

      9 Accountantspraktijken die een aanvraag hebben ingediend voor toetreding tot een geaccrediteerde koepelorganisatie
      zijn, gedurende de periode waarin de koepelorganisatie op verzoek nog geen beslissing heeft genomen, vrijgesteld
      van toetsing door het bestuur.

      10 Het negende lid vindt geen toepassing nadat het bestuur met toepassing van
      [artikel 8, eerste en tweede lid][ref4], een datum bekend heeft gemaakt waarop de in [artikel 12, derde lid][ref5]
      bedoelde hertoetsing plaats zal vinden.


