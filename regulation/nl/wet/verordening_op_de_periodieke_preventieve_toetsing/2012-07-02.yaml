  - number: 1a
    text: |-
      1 Het bestuur verleent, voor zover dat zich verdraagt met
      [afdeling 10.1.1. van de Algemene Wet bestuursrecht][ref1], voor de uitoefening van de in deze verordening aan hem
      verstrekte bevoegdheden mandaat, volmacht en machtiging aan de Raad.

      2 Namens het bestuur kan de Raad ondermandaat verlenen voor de bevoegdheden genoemd in
      [artikel 14, lid 1 en 6][ref2].

      3 Over de inrichting en samenstelling van de Raad worden bij verordening nadere regels gesteld.


