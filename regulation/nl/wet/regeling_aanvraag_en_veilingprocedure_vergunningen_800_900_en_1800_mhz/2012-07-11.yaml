  - number: '7.4'
    text: |-
      In het geval, bedoeld in het eerste lid, worden in afwijking van [artikel 2, twaalfde lid][ref1], per
      aanvrager anders dan een nieuwkomer niet meer vergunningen verleend dan die gezamenlijk overeenkomen met 235
      activiteitspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: '8.1'
    text: |-
      Degene die voor een vergunning als bedoeld in [artikel 2, eerste lid][ref1], in aanmerking wil komen, dient een
      aanvraag in.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: '8.2'
    text: Een aanvrager kan uitsluitend aan de veiling deelnemen op eigen titel dan wel als lid van één groep.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.3'
    text: Per groep wordt ten hoogste één aanvraag ingediend.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.4'
    text: Een aanvraag van een nieuwkomer heeft betrekking op ten hoogste twee van de drie beschikbare vergunningen A1 en A2.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.5'
    text: |-
      Een aanvraag van een nieuwkomer heeft betrekking op ten hoogste 220 activiteitspunten en een aanvraag van een
      andere aanvrager dan een nieuwkomer heeft betrekking op ten hoogste 190 activiteitspunten.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.6'
    text: |-
      In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], of [5, eerste lid][ref2], heeft in afwijking
      van het vijfde lid, een aanvraag van een andere aanvrager dan een nieuwkomer betrekking op ten hoogste 205
      activiteitspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel5
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
  - number: '8.7'
    text: |-
      In het geval, bedoeld in de [artikelen 4, eerste lid][ref1], of [6, eerste lid][ref2], heeft in afwijking van het
      vijfde lid, een aanvraag van een nieuwkomer betrekking op ten hoogste 235 activiteitspunten en een aanvraag van een
      andere aanvrager dan een nieuwkomer betrekking op ten hoogste 220 activiteitspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel6
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
  - number: '8.8'
    text: |-
      In het geval, bedoeld in [7, eerste lid][ref1], heeft in afwijking van het vijfde lid, een aanvraag van zowel een
      nieuwkomer als een andere aanvrager dan een nieuwkomer betrekking op ten hoogste 235 activiteitspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '8.9'
    text: |-
      In de aanvraag worden de namen vermeld van ten minste één en ten hoogste vier natuurlijke personen, die ieder voor
      zich zelfstandig bevoegd zijn om namens de aanvrager handelingen te verrichten gedurende de veiling en die daartoe
      beschikken over een rechtsgeldige en toereikende volmacht.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.10'
    text: |-
      De aanvraag bevat verder de gegevens en bescheiden, bedoeld in [bijlage I][ref1], en wordt overeenkomstig het model
      in die bijlage ingedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: '8.11'
    text: De aanvraag is in de Nederlandse taal gesteld.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.12'
    text: |-
      Met de gegevens en bescheiden, bedoeld in het tiende lid, worden gelijkgesteld zodanige gegevens en bescheiden
      krachtens het recht van een van de andere lidstaten van de Europese Unie of een van de andere staten die partij
      zijn bij de Overeenkomst betreffende de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.13'
    text: |-
      De gegevens en bescheiden, bedoeld in het twaalfde lid, mogen in afwijking van het elfde lid, in een van de
      officiële talen van de Europese Unie of de Europese Economische Ruimte worden gesteld. In dat geval worden die
      gegevens en bescheiden vergezeld van een Nederlandse vertaling van die gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
  - number: '8.14'
    text: |-
      Op het tijdstip, bedoeld in [artikel 9, eerste lid][ref1], heeft de aanvrager overeenkomstig [artikel 15][ref2] een
      bedrag tot zekerheid van de gestanddoening van zijn bieding gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel15
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '15'
        paragraaf: '5'
  - number: '9.1'
    text: |-
      De aanvraag wordt uiterlijk op 16 juli 2012 om 14.00 uur per post ontvangen dan wel door persoonlijke overhandiging
      ontvangen op het volgende adres: Agentschap Telecom Ter attentie van: Veilingteam 800, 900 en 1800 MHz Emmasingel 1
      9726 AH Groningen
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel9
  - number: '9.2'
    text: Indien de aanvrager niet heeft voldaan aan de in het eerste lid gestelde eisen, wordt de aanvraag afgewezen.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel9
  - number: '10.1'
    text: |-
      De aanvrager informeert de minister onmiddellijk over een wijziging met betrekking tot de gegevens en bescheiden,
      bedoeld in [bijlage I][ref1], onderdeel A. Hij informeert de minister per post of door persoonlijke overhandiging
      van informatie over de wijziging op het adres, bedoeld in [artikel 9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel9
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
  - number: '10.2'
    text: |-
      De gegevens, bedoeld in [bijlage I][ref1], onderdeel B, worden niet gewijzigd na het tijdstip, bedoeld in
      [artikel 9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel9
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
  - number: '10.3'
    text: 'Indien de aanvrager niet heeft voldaan aan:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
  - number: 10.3.a
    text: |-
      de in [artikel 8, tweede, derde, negende, tiende, elfde of dertiende lid][ref1], gestelde eisen,


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
