preamble:
  text: |-
    Gelet op de artikelen 2a, 4, 6, 6a en 8 van het Frequentiebesluit;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.a
    text: '*aanvrager:* degene die een aanvraag heeft ingediend;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.b
    text: |-
      *nieuwkomer:* de aanvrager die op het in [artikel 9, eerste lid][ref1], genoemde tijdstip geen vergunninghouder
      is van een of meer vergunningen voor frequentieruimte binnen het bereik van 880–915 MHz en 925–960 MHz en die ook
      geen deel uitmaakt van een groep waarvan een of meer leden vergunninghouder zijn van een of meer vergunningen voor
      frequentieruimte binnen het bereik van 880–915 MHz en 925–960 MHz;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel9
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
  - number: 1.1.c
    text: '*biedronde:* een primaire biedronde, de aanvullende biedronde of de toewijzingsbiedronde;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.d
    text: '*onderband 800 MHz:* het frequentiebereik van 791–821 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.e
    text: '*bovenband 800 MHz:* het frequentiebereik van 832–862 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.f
    text: '*onderband 900 MHz:* het frequentiebereik van 880–915 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.g
    text: '*bovenband 900 MHz:* het frequentiebereik van 925–960 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.h
    text: '*onderband 1800 MHz:* het frequentiebereik van 1710–1780 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.i
    text: '*bovenband 1800 MHz:* het frequentiebereik van 1805–1875 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.j
    text: '*onderband 2100 MHz:* het frequentiebereik van 1959,7–1969,7 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.k
    text: '*bovenband 2100 MHz:* het frequentiebereik van 2149,7–2159,7 MHz;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.l
    text: '*deelnemer:*'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.l.1°
    text: |-
      in de [artikelen 14 tot en met 23][ref1], in [bijlage II][ref2], in de primaire biedronden en in de aanvullende
      biedronde: de aanvrager die voldoet aan de in [artikel 11][ref3] gestelde eisen en wiens aanvraag voldoet aan de in
      de [artikelen 8 tot en met 10][ref4] gestelde eisen en aan wie is meegedeeld dat hij is toegelaten tot de veiling;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0031069
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0031069#Artikel8
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0031069
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '11'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0031069
        artikel: '8'
        paragraaf: '3'
  - number: 1.1.l.2°
    text: |-
      in de toewijzingsbiedronde: de aanvrager, bedoeld onder 1°, wiens bieding onderdeel uitmaakt van de combinatie van
      winnende biedingen, bedoeld in [artikel 31][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel31
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '31'
        paragraaf: '7'
  - number: 1.1.m
    text: '*winnende deelnemer:*'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.m.1°
    text: |-
      in [bijlage III][ref1]: de deelnemer wiens bieding deel uitmaakt van de combinatie van winnende biedingen, bedoeld
      in [artikel 31][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel31
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '31'
        paragraaf: '7'
  - number: 1.1.m.2°
    text: |-
      in de toewijzingsbiedronde, in [bijlage IV][ref1] en in [artikel 43][ref2]: de deelnemer wiens bieding deel
      uitmaakt van de finale combinatie van winnende biedingen, bedoeld in [artikel 40][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel40
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '43'
        paragraaf: '9'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '40'
        paragraaf: '8'
  - number: 1.1.n
    text: |-
      *groep:* een groep als bedoeld in [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 1.1.o
    text: |-
      *rente:* de volgens actual/360 berekende rente op basis van de door de Europese Centrale Bank vastgestelde Euro
      Overnight Index Average, minus 100 basispunten, met een minimum van 0%;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.p
    text: '*winnende bieding:*'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.p.1°
    text: |-
      in de aanvullende biedronde en [bijlage III][ref1]: de bieding die deel uitmaakt van de combinatie van winnende
      biedingen, bedoeld in [artikel 31][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel31
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '31'
        paragraaf: '7'
  - number: 1.1.p.2°
    text: |-
      in de toewijzingsbiedronde: de bieding die deel uitmaakt van de finale combinatie van winnende biedingen, bedoeld
      in [artikel 40][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel40
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '40'
        paragraaf: '8'
  - number: 1.1.q
    text: |-
      *vertrouwelijke informatie:* informatie over een aanvrager die niet openbaar is en die, wanneer kenbaar gemaakt aan
      een andere aanvrager, diens beslissingen met betrekking tot de veiling beïnvloedt of kan beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.r
    text: |-
      *finale primaire bieding:* de laatste bieding met een activiteitsniveau hoger dan nul die een deelnemer in de
      primaire biedronde heeft uitgebracht;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.s
    text: '*pakket:* de specifieke combinatie van vergunningen in een bieding van een deelnemer;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: 1.1.t
    text: '*finale pakket:* het pakket waarop een deelnemer in zijn finale primaire bieding heeft geboden.'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: '1.2'
    text: |-
      Onder een groep wordt mede verstaan een rechtspersoon of andere juridische entiteit waarin twee of meer aanvragers
      gelijke aandelen houden of gelijke juridische zeggenschap hebben.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel1
  - number: '2.1'
    text: |-
      Ten behoeve van het gebruik van frequentieruimte voor terrestrische elektronische communicatie worden de volgende
      vergunningen door middel van een veiling verdeeld:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.a
    text: |-
      vergunning A1: vergunning voor het gebruik van frequentieruimte van twee keer 5 MHz in de onder- en bovenband 800
      MHz waarbij tussen beide frequentieruimten van 5 MHz steeds een afstand is van 41 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.b
    text: |-
      vergunning A2: vergunning voor het gebruik van frequentieruimte van twee keer 5 MHz in de onder- en bovenband 900
      MHz waarbij tussen beide frequentieruimten van 5 MHz steeds een afstand is van 45 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.c
    text: |-
      vergunning B: vergunning voor het gebruik van frequentieruimte van twee keer 5 MHz in de onder- en bovenband 800
      MHz waarbij tussen beide frequentieruimten van 5 MHz steeds een afstand is van 41 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.d
    text: |-
      vergunning C: vergunning voor het gebruik van frequentieruimte van twee keer 5 MHz in de onder- en bovenband 900
      MHz waarbij tussen beide frequentieruimten van 5 MHz steeds een afstand is van 45 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.e
    text: |-
      vergunning D: vergunning voor het gebruik van frequentieruimte van twee keer 5 MHz in de onder- en bovenband 1800
      MHz waarbij tussen beide frequentieruimten van 5 MHz steeds een afstand is van 95 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.f
    text: |-
      vergunning E: vergunning voor het gebruik van frequentieruimte van twee keer 5 MHz in de onder- en bovenband 2100
      MHz waarbij tussen beide frequentieruimten van 5 MHz steeds een afstand is van 190 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.g
    text: |-
      vergunning F: vergunning voor het gebruik van frequentieruimte van 14,6 MHz binnen het frequentiebereik 1900 en
      1904,9 MHz en tussen 2010 en 2019,7 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.h
    text: |-
      vergunning G: vergunning voor het gebruik van frequentieruimte van 5 MHz binnen het frequentiebereik 2565 en 2615
      MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.1.i
    text: 'vergunning H: vergunning voor het gebruik van de frequentieruimte tussen 2615–2620 MHz.'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.2'
    text: |-
      Voor de verdeling, bedoeld in het eerste lid, zijn twee vergunningen A1, één vergunning A2, vier vergunningen B,
      zes vergunningen C, veertien vergunningen D, twee vergunningen E, één vergunning F, tien vergunningen G en één
      vergunning H beschikbaar.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.3'
    text: Vergunningen A1 en A2 worden uitsluitend verleend aan nieuwkomers.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.4'
    text: Aan één nieuwkomer worden ten hoogste twee van de drie beschikbare vergunningen A1 en A2 verleend.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.5'
    text: |-
      Indien er een vergunning G wordt verleend aan een aanvrager, worden aan hem ten minste twee vergunningen G
      verleend, waarbij ter voorkoming van interferentie beperkingen worden opgelegd aan het gebruik van de laagst
      gelegen frequentieruimte van 5 MHz waarvoor die aanvrager een vergunning G verkrijgt.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.6'
    text: |-
      De vergunning H wordt verleend aan de aanvrager waaraan een vergunning G wordt verleend voor het gebruik van de
      frequentieruimte tussen 2610–2615 MHz.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.7'
    text: |-
      De vergunningen A1 en B worden zodanig verleend dat, met inachtneming van het bepaalde in het eerste tot en met
      vierde lid:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.7.a
    text: de vergunningen A1 en B tezamen in de onderband van alle aanvragers aaneengesloten zijn en beginnen bij 821 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.7.b
    text: de vergunningen A1 en B tezamen in de onderband per aanvrager aaneengesloten zijn.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.8'
    text: |-
      De vergunningen A2 en C worden zodanig verleend dat, met inachtneming van het bepaalde in het eerste tot en met
      vierde lid:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.8.a
    text: de vergunningen A2 en C tezamen in de onderband van alle aanvragers aaneengesloten zijn en beginnen bij 880 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.8.b
    text: de vergunningen A2 en C tezamen in de onderband per aanvrager aaneengesloten zijn.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.9'
    text: |-
      De vergunningen D worden zodanig verleend dat, met inachtneming van het bepaalde in het eerste tot en met vierde
      lid:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.9.a
    text: de vergunningen D in de onderband van alle aanvragers samen aaneengesloten zijn en beginnen bij 1710 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.9.b
    text: de vergunningen D in de onderband per aanvrager aaneengesloten zijn.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.10'
    text: |-
      De vergunningen G worden zodanig verleend dat, met inachtneming van het bepaalde in het eerste tot en met vierde
      lid:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.10.a
    text: |-
      de vergunningen G binnen het frequentiebereik van 2565 en 2615 MHz van alle aanvragers samen aaneengesloten zijn en
      beginnen bij 2565 MHz;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: 2.10.b
    text: de vergunningen G per aanvrager steeds betrekking hebben op aaneengesloten frequentieruimte.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.11'
    text: |-
      Per nieuwkomer worden niet meer vergunningen A1, A2, B, C, D, E, F of G verleend dan die gezamenlijk overeenkomen
      met 220 activiteitspunten.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '2.12'
    text: |-
      Per aanvrager anders dan een nieuwkomer worden niet meer vergunningen B, C, D, E, F of G verleend dan die
      gezamenlijk overeenkomen met 190 activiteitspunten.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel2
  - number: '3.1'
    text: |-
      Indien aanvragen die overeenkomstig de [artikelen 8 tot en met 10][ref1] zijn ingediend door nieuwkomers en die
      voldoen aan de in [artikel 11][ref2] gestelde eisen, in totaal ten aanzien van vergunningen A1 en A2 betrekking
      hebben op twee of meer vergunningen A1 en geen betrekking hebben op een vergunning A2, zijn in afwijking van
      [artikel 2, tweede lid][ref3], voor de verdeling, bedoeld in artikel 2, eerste lid, twee vergunningen A1, vier
      vergunningen B, zeven vergunningen C, veertien vergunningen D, twee vergunningen E, één vergunning F, tien
      vergunningen G en één vergunning H beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '11'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: '3.2'
    text: |-
      In het geval, bedoeld in het eerste lid, is [artikel 2, achtste lid][ref1], van toepassing, met dien verstande dat
      dit uitsluitend betrekking heeft op de verlening van vergunningen C.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: '3.3'
    text: |-
      In het geval, bedoeld in het eerste lid, worden in afwijking van [artikel 2, twaalfde lid][ref1], per
      aanvrager anders dan een nieuwkomer niet meer vergunningen verleend dan die gezamenlijk overeenkomen met 205
      activiteitspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: '4.1'
    text: |-
      Indien aanvragen die overeenkomstig de [artikelen 8 tot en met 10][ref1] zijn ingediend door nieuwkomers en die
      voldoen aan de in [artikel 11][ref2] gestelde eisen, in totaal ten aanzien van vergunningen A1 en A2 uitsluitend
      betrekking hebben op één vergunning A1 en geen betrekking hebben op een vergunning A2, zijn in afwijking van
      [artikel 2, tweede lid][ref3], voor de verdeling, bedoeld in artikel 2, eerste lid, één vergunning A1, vijf
      vergunningen B, zeven vergunningen C, veertien vergunningen D, twee vergunningen E, één vergunning F, tien
      vergunningen G en één vergunning H beschikbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel4
    references:
      - id: ref1
