    text: |-
      het in [artikel 8, veertiende lid][ref1], gestelde vereiste,


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '8'
        paragraaf: '3'
  - number: '10.4'
    text: |-
      De aanvrager heeft gedurende zeven werkdagen, te rekenen vanaf de dag nadat de mededeling, bedoeld in het derde
      lid, is verstuurd, de gelegenheid het verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
  - number: '10.5'
    text: |-
      De gegevens ten behoeve van het verzuimherstel, bedoeld in het derde lid, onder a, b en c, worden per post
      verzonden of door persoonlijke overhandiging ingediend op het adres, bedoeld in [artikel 9, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel9
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
  - number: '10.6'
    text: |-
      Het verzuimherstel, bedoeld in het derde lid, onder d, geschiedt overeenkomstig [artikel 15][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel15
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '15'
        paragraaf: '5'
  - number: '10.7'
    text: |-
      Indien het verzuim, bedoeld in het derde lid, onder a en d, binnen de termijn, genoemd
      in het vierde lid, niet is hersteld of de aanvraag na herstel niet voldoet aan de in
      [artikel 8, tweede, derde, negende, tiende, elfde, dertiende of veertiende lid][ref1], gestelde eisen, kan de
      minister besluiten de aanvraag overeenkomstig [artikel 4:5 van de Algemene wet bestuursrecht][ref2] niet te
      behandelen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '10.8'
    text: |-
      Indien het verzuim, bedoeld in het derde lid, onder b, binnen de termijn, genoemd in het vierde lid, niet is
      hersteld of de aanvraag na herstel niet voldoet aan het in [artikel 8, vierde lid][ref1], gestelde vereisten, wordt
      de aanvraag afgewezen voor zover deze betrekking heeft op meer vergunningen A1 en A2 dan waarvoor de nieuwkomer op
      grond van [artikel 2, vierde lid][ref2], in aanmerking kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: '10.9'
    text: |-
      Indien het verzuim, bedoeld in het derde lid, onder c, binnen de termijn, genoemd in het vierde lid, niet is
      hersteld of de aanvraag na herstel niet voldoet aan de in [artikel 8, vijfde, zesde, zevende of achtste lid][ref1]
      gestelde eisen, wordt de aanvraag afgewezen voor zover deze betrekking heeft op meer activiteitspunten dan
      waarvoor de aanvrager op grond van [artikel 2, elfde of twaalfde lid][ref2], [artikel 3, derde lid][ref3],
      [artikel 4, derde lid][ref4], [artikel 5, tweede lid][ref5], [artikel 6, derde lid][ref6], of
      [artikel 7, vierde lid][ref7], in aanmerking kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0031069#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0031069#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
