  - number: '7.3'
    text: |-
      In het geval, bedoeld in het eerste lid, is voorts [artikel 2, achtste lid][ref1], van toepassing, met dien
      verstande dat dit uitsluitend betrekking heeft op de verlening van vergunningen C.


