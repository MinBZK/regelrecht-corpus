  - number: '10.10'
    text: |-
      Indien het verzuim betrekking heeft op [artikel 8, tiende lid][ref1], bestaande uit een aangegeven voorkeur voor
      vergunning A1 of A2 terwijl de aanvrager geen nieuwkomer is, wordt de aanvraag afgewezen voor zover die betrekking
      heeft op vergunning A1 of A2 en wordt het aantal aangevraagde activiteitspunten dienovereenkomstig verminderd.
      Voordat de aanvraag wordt afgewezen, deelt de minister het voorgenomen besluit mee aan de betrokken aanvrager en
      wordt de aanvrager overeenkomstig het vierde lid in de gelegenheid gesteld om aan te geven naar welke vergunningen
      en welke frequentieruimte zijn voorkeur uitgaat.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '8'
        paragraaf: '3'
  - number: '10.11'
    text: |-
      Uiterlijk binnen twee weken nadat de minister overeenkomstig het zevende lid heeft besloten de aanvraag niet
      te behandelen, stort de minister de waarborgsom terug aan de betreffende aanvrager of stuurt de minister een
      schriftelijke verklaring als bedoeld in [bijlage II][ref1], onder II, onder 4, aan de bank van die aanvrager
      die ter zekerstelling een bankgarantie heeft overgelegd. De minister stuurt een kopie van deze verklaring aan de
      aanvrager. [Artikel 44, tweede lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel44
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '44'
        paragraaf: '10'
  - number: '11.1'
    text: |-
      De aanvrager is een privaatrechtelijke rechtspersoon naar Nederlands recht of het equivalent daarvan naar het
      recht van een van de overige lidstaten van de Europese Unie of een van de overige staten die partij zijn bij de
      Overeenkomst betreffende de Europese Economische Ruimte, en heeft zijn statutaire zetel, zijn hoofdbestuur of zijn
      hoofdvestiging binnen de Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
  - number: '11.2'
    text: 'De aanvrager voldoet voorts aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
  - number: 11.2.a
    text: de aanvrager verkeert niet in staat van faillissement of liquidatie;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
  - number: 11.2.b
    text: |-
      de aanvrager is geen surseance van betaling verleend, noch is door de aanvrager surseance van betaling aangevraagd,
      en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
  - number: 11.2.c
    text: |-
      er is geen beslag gelegd op een aanmerkelijk deel van het vermogen dan wel een of meer bedrijfsmiddelen van de
      aanvrager die een aanmerkelijk deel van het vermogen van de aanvrager vormen.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
  - number: '11.3'
    text: |-
      Met de eisen van het tweede lid worden gelijkgesteld zodanige eisen volgens het recht van een van de andere
      lidstaten van de Europese Unie of een van de andere staten die partij zijn bij de Overeenkomst betreffende de
      Europese Economische Ruimte.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
  - number: '11.4'
    text: |-
      Binnen zes weken na het tijdstip, bedoeld in [artikel 9, eerste lid][ref1], stelt de minister vast of de aanvrager
      wiens aanvraag in behandeling is genomen, voldoet aan de eisen, bedoeld in het eerste en tweede lid, en of hij een
      nieuwkomer is. Deze termijn kan eenmalig met ten hoogste vier weken worden verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel9
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
  - number: '11.5'
    text: |-
      Indien uit de aanvraag niet blijkt dat aan de eisen, bedoeld in het eerste en tweede lid, is voldaan, wijst de
      minister de aanvraag af.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel11
  - number: '12.1'
    text: |-
      Voor het vaststellen of er noodzaak is tot het veilen van de vergunningen A1 tot en met G wordt bij
      de toepassing van het tweede tot en met vijfde lid uitgegaan van de aanvragen die overeenkomstig de
      [artikelen 8 tot en met 10][ref1] zijn ingediend door aanvragers die voldoen aan de in [artikel 11][ref2] gestelde
      eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel11
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel12
