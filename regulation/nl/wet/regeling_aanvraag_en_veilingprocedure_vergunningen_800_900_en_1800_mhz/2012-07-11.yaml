      aan de in [artikel 11][ref2] gestelde eisen, geen betrekking hebben op een vergunning A1 en A2, zijn in afwijking
      van [artikel 2, tweede lid][ref3], voor de verdeling, bedoeld in artikel 2, eerste lid, zes vergunningen B,
      zeven vergunningen C, veertien vergunningen D, twee vergunningen E, één vergunning F, tien vergunningen G en één
      vergunning H beschikbaar.


