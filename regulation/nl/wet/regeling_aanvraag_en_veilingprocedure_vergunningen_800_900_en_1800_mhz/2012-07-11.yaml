  - number: '4.3'
    text: |-
      In het geval, bedoeld in het eerste lid, worden in afwijking van [artikel 2, twaalfde lid][ref1], per
      aanvrager anders dan een nieuwkomer niet meer vergunningen verleend dan die gezamenlijk overeenkomen met 220
      activiteitspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: '5.1'
    text: |-
      Indien aanvragen die overeenkomstig de [artikelen 8 tot en met 10][ref1] zijn ingediend door nieuwkomers
      en die voldoen aan de in [artikel 11][ref2] gestelde eisen, in totaal ten aanzien van vergunningen A1 en
      A2 uitsluitend betrekking hebben op één vergunning A1 en één of meer vergunningen A2, zijn in afwijking van
      [artikel 2, tweede lid][ref3], voor de verdeling, bedoeld in artikel 2, eerste lid, één vergunning A1, één
      vergunning A2, vijf vergunningen B, zes vergunningen C, veertien vergunningen D, twee vergunningen E, één
      vergunning F, tien vergunningen G en één vergunning H beschikbaar.


