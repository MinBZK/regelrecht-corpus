      die voldoen aan de in [artikel 11][ref2] gestelde eisen, in totaal ten aanzien van vergunningen A1 en A2 geen
      betrekking hebben op een vergunning A1 en betrekking hebben op één of meer vergunningen A2, zijn in afwijking
      van [artikel 2, tweede lid][ref3], voor de verdeling, bedoeld in artikel 2, eerste lid, één vergunning A2,
      zes vergunningen B, zes vergunningen C, veertien vergunningen D, twee vergunningen E, één vergunning F, tien
      vergunningen G en één vergunning H beschikbaar.


