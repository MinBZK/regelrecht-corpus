  - number: '12.14'
    text: |-
      In het geval, bedoeld in [artikel 7, eerste lid][ref1], worden in afwijking van het negende lid, de vergunningen
      B tot en met G met inachtneming van het bepaalde in de [artikelen 2, derde tot en met twaalfde lid][ref2], en 7,
      tweede tot en met vierde lid, onder toepassing van de [artikelen 36 tot en met 44][ref3] verleend, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel36
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '36'
        paragraaf: '8'
  - number: 12.14.a
    text: voldaan kan worden aan de vraag naar de vergunningen B tot en met G, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel12
  - number: 12.14.b
    text: |-
      een aanvrager voorkeur heeft uitgesproken voor specifieke frequentieruimte als bedoeld in [bijlage I][ref1], onder
      B.2, onderdeel f.


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: '12.15'
    text: |-
      In de gevallen, bedoeld in het negende tot en met veertiende lid, zijn de [artikelen 14 tot en met 23][ref1] van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
  - number: '13.1'
    text: |-
      De minister deelt de aanvragers zo spoedig mogelijk mee welke vergunningen overeenkomstig [artikel 12][ref1] worden
      verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel12
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '12'
        paragraaf: '4'
  - number: '13.2'
    text: |-
      Nadat de vergunningen, bedoeld in het eerste lid, zijn verleend, deelt de minister de aanvragers mee aan wie welke
      vergunningen zijn verleend.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel13
  - number: '14.1'
    text: |-
      Indien na toepassing van [artikel 12][ref1] de noodzaak van veilen is komen vast te staan, deelt de minister iedere
      aanvrager schriftelijk mee of hij als deelnemer wordt toegelaten tot de veiling. De minister deelt iedere aanvrager
      hierbij tevens mee voor hoeveel activiteitspunten hij op basis van de [artikelen 2, elfde of twaalfde lid][ref2],
      [3, derde lid][ref3], [4, derde lid][ref4], [5, tweede lid][ref5], [6, derde lid][ref6], of [7, vierde lid][ref7],
      vergunningen mag verwerven tijdens de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref5]: https://wetten.overheid.nl/BWBR0031069#Artikel5
      [ref6]: https://wetten.overheid.nl/BWBR0031069#Artikel6
      [ref7]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '12'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
      - id: ref7
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '14.2'
    text: 'De minister deelt iedere deelnemer hierbij tevens mee:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
  - number: 14.2.a
    text: |-
      welke vergunningen als bedoeld in [artikel 2, eerste lid, onder a tot en met h][ref1] worden geveild;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
  - number: 14.2.b
    text: hoeveel andere deelnemers zijn toegelaten tot de veiling;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
  - number: 14.2.c
    text: de datum en het tijdstip van aanvang van de veiling;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
  - number: 14.2.d
    text: |-
      het faxnummer voor het indienen van een verzoek als bedoeld in [artikel 21, tweede en vijfde lid][ref1], en van een
      schriftelijke bieding als bedoeld in artikel 21, eerste lid;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel21
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '21'
        paragraaf: '6'
  - number: 14.2.e
    text: |-
      het telefoonnummer waarop de minister ingeval van bijzondere omstandigheden als bedoeld in
      [artikel 17, tweede lid][ref1], bereikbaar is;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel17
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '17'
        paragraaf: '6'
  - number: 14.2.f
    text: de combinatie van zijn inlogcode en zijn wachtwoord;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
  - number: 14.2.g
    text: het internetadres waarop de deelnemer inlogt teneinde aan de veiling deel te nemen;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
  - number: 14.2.h
    text: de voor de veiling benodigde programmatuur.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel14
  - number: '15.1'
    text: Iedere deelnemer voldoet een bedrag tot zekerheid van de gestanddoening van zijn bieding.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
  - number: '15.2'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op een vergunning A1, bedraagt het bedrag, bedoeld in het
      eerste lid, € 35.000.000 per aangevraagde vergunning A1.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
  - number: '15.3'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op een vergunning A2, bedraagt het bedrag, bedoeld in het
      eerste lid, € 28.900.000 per aangevraagde vergunning A2.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
  - number: '15.4'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op ten hoogste vijftien activiteitspunten als bedoeld in
      [artikel 22, eerste lid, onder b tot en met e][ref1], bedraagt het bedrag, bedoeld in het eerste lid, € 200.000
      per activiteitspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: '15.5'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op ten minste zestien en ten hoogste vijfenveertig
      activiteitspunten als bedoeld in [artikel 22, eerste lid, onder b tot en met e][ref1], bedraagt het bedrag, bedoeld
      in het eerste lid, € 300.000 per activiteitspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: '15.6'
    text: |-
      Indien de aanvraag van een deelnemer betrekking heeft op zesenveertig of meer activiteitspunten als bedoeld in
      [artikel 22, eerste lid, onder b tot en met e][ref1], bedraagt het bedrag, bedoeld in het eerste lid, € 400.000
      per activiteitspunt.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: '15.7'
    text: |-
      Uiterlijk op het tijdstip, bedoeld in [artikel 9, eerste lid][ref1],:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel9
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
  - number: 15.7.a
    text: |-
      is het bedrag voor de aanvraag, bedoeld in [bijlage I][ref1], onder B.1, die betrekking heeft op het hoogste aantal
      activiteitspunten, onder vermelding van Waarborgsom Veiling 800, 900 en 1800 MHz ontvangen op bankrekeningnummer
      569994039, IBAN: NL49RBOS0569994039, SWIFT: RBOSNL2A ten name van Ministerie van Economische Zaken, Landbouw en
      Innovatie, Agentschap Telecom, Afdeling Finance & Control, of


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: 15.7.b
    text: |-
      is voor het bedrag voor de aanvraag, bedoeld in [bijlage I][ref1], onder B.1, die betrekking heeft op het hoogste
      aantal activiteitspunten, ter zekerheidstelling een bankgarantie volgens het model dat als [bijlage II][ref2] bij
      deze regeling is gevoegd, per post ontvangen op, dan wel door persoonlijke overhandiging ingediend op het adres,
      bedoeld in [artikel 9, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel9
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
  - number: '15.8'
    text: |-
      De deelnemer die heeft voldaan aan de verplichtingen, bedoeld in het eerste tot en met zevende lid, is
      gerechtigd om een bieding uit te brengen tijdens de eerste primaire biedronde of in een procedure als bedoeld in
      [artikel 12, negende tot en met veertiende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel12
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '12'
        paragraaf: '4'
  - number: '15.9'
    text: |-
      Indien het op grond van het zevende lid, onder a, betaalde bedrag op meer activiteitspunten betrekking heeft dan
      het aantal activiteitspunten dat is genoemd in de mededeling, bedoeld in [artikel 14, eerste lid][ref1], stort de
      minister uiterlijk twee weken nadat de mededeling is gedaan, dat deel van het bedrag terug dat betrekking heeft op
      het verschil in aantal activiteitspunten.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
  - number: '15.10'
    text: |-
      In het geval, bedoeld in het negende lid, vergoedt de minister de rente vanaf de dag waarop hij het bedrag, bedoeld
      in het zevende lid, onder a, heeft ontvangen op het bankrekeningnummer, genoemd in het zevende lid, tot en met de
      dag voorafgaand aan de dag waarop hij het deel van het bedrag, bedoeld in het negende lid, terugstort. De minister
      stort de rente terug op dezelfde dag waarop hij het deel van het bedrag, bedoeld in het negende lid, terugstort.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel15
  - number: '16.1'
    text: |-
      Een aanvrager, inbegrepen diegene die een aanvrager ten behoeve van de veiling bijstaat of een lid van de groep
      waartoe een aanvrager behoort, verspreidt geen vertrouwelijke informatie en doet geen vertrouwelijke informatie
      verspreiden aan een andere aanvrager of een derde, en maakt geen vertrouwelijke informatie openbaar.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel16
  - number: '16.2'
    text: |-
      Een aanvrager, inbegrepen diegene die een aanvrager ten behoeve van de veiling bijstaat of een lid van de groep
      waartoe een aanvrager behoort, onthoudt zich voorafgaand aan en gedurende de veilingprocedure van afspraken
      of gedragingen die afbreuk doen of kunnen doen aan een goed verloop van de veiling, de mededinging in de
      veilingprocedure daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel16
  - number: '16.3'
    text: |-
      Indien naar het oordeel van de minister sprake is van gedragingen in strijd met het eerste of tweede lid, kan de
      minister de veiling opschorten voor een termijn van ten hoogste één jaar.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel16
  - number: '16.4'
    text: |-
      De minister kan een aanvrager die naar het oordeel van de minister handelt in strijd met het eerste of tweede lid
      van deelname of van verdere deelname aan de veiling uitsluiten.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel16
  - number: '16.5'
    text: 'Indien een deelnemer in strijd heeft gehandeld met het eerste of tweede lid, kan de minister:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel16
  - number: 16.5.a
    text: de uitkomst van een of meer biedingen of biedronden ongeldig verklaren, of
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel16
  - number: 16.5.b
    text: besluiten dat een of meer biedronden opnieuw moeten worden gehouden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel16
  - number: '17.1'
    text: De veiling vindt plaats door middel van internet, met behulp van een elektronisch veilingsysteem.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel17
  - number: '17.2'
    text: 'Gedurende de veiling communiceert:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel17
  - number: 17.2.a
    text: de minister uitsluitend door middel van het elektronisch systeem met de deelnemers, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel17
  - number: 17.2.b
    text: een deelnemer uitsluitend per fax met de minister,
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel17
  - number: '17.3'
    text: |-
      In afwijking van het tweede lid, onder a, kan gedurende de veiling de communicatie tussen de minister en een
      deelnemer schriftelijk plaatsvinden door middel van het in [artikel 14, tweede lid, onder d][ref1], bedoelde
      faxnummer, indien sprake is van een elektronische storing als bedoeld in [artikel 21, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel21
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '21'
        paragraaf: '6'
  - number: '17.4'
    text: De veiling wordt uitsluitend op werkdagen gehouden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel17
  - number: '17.5'
    text: De minister leidt de veiling en draagt zorg voor een goed verloop van de veiling.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel17
  - number: '18.1'
    text: |-
      De minister kan de veiling opschorten voor een termijn van ten hoogste één jaar indien zich naar zijn oordeel
      bijzondere omstandigheden voordoen buiten de beïnvloedingssfeer van de minister of de deelnemers waardoor de
      veiling tijdelijk geen doorgang kan vinden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel18
  - number: '18.2'
    text: |-
      De minister kan indien dit om andere dan de in [artikel 16, derde en vijfde lid][ref1], genoemde redenen nodig is
      voor een eerlijk of efficiënt verloop van de veiling:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel16
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '16'
        paragraaf: '6'
  - number: 18.2.a
    text: de veiling opschorten voor een termijn van ten hoogste één jaar
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel18
  - number: 18.2.b
    text: een of meer biedingen of de uitkomst van van of meer biedronden ongeldig verklaren, of
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel18
  - number: 18.2.c
    text: besluiten dat een of meer biedronden opnieuw moeten worden gehouden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel18
  - number: '18.3'
    text: |-
      De minister kan een aanvrager die niet langer voldoet aan de eisen die in [artikel 11][ref1] zijn gesteld aan een
      aanvrager, uitsluiten van deelname of van verdere deelname aan de veiling.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel11
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '11'
        paragraaf: '3'
  - number: '18.4'
    text: |-
      Indien twee of meer aanvragers lid worden van één groep, sluit de minister aanvragers uit van deelname of van
      verdere deelname aan de veiling zodat niet meer dan één aanvrager per groep deelneemt aan de veiling.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel18
  - number: '19.1'
    text: De minister bepaalt wanneer de biedronden van de veiling plaatsvinden en de duur van die biedronden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel19
  - number: '19.2'
    text: Een deelnemer is onvoorwaardelijk en onherroepelijk aan zijn bieding gebonden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel19
  - number: '20.1'
    text: 'Een ongeldige bieding wordt niet in aanmerking genomen bij:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.1.a
    text: |-
      het bepalen van het einde van de primaire biedronde op basis van [artikel 27, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel27
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '27'
        paragraaf: '7'
  - number: 20.1.b
    text: |-
      het bepalen van het maximum aantal biedingen, bedoeld in [artikel 29, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel29
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '29'
        paragraaf: '7'
  - number: 20.1.c
    text: |-
      het opstellen van de lijst, bedoeld in [artikel 38][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel38
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '38'
        paragraaf: '8'
  - number: 20.1.d
    text: het vaststellen van de combinatie van winnende biedingen en de finale combinatie van winnende biedingen, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.1.e
    text: |-
      het bepalen van de prijzen op grond van [bijlagen III][ref1] en [IV][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031069
      [ref2]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
      - id: ref2
        bwb_id: BWBR0031069
  - number: '20.2'
    text: 'Een bieding is ongeldig wanneer niet is voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.2.a
    text: de bieding is uitgebracht en bevestigd door middel van het elektronisch veilingsysteem via internet;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.2.b
    text: |-
      de bieding voldoet aan het in [artikel 22, vijfde of zesde lid][ref1], bepaalde activiteitsniveau;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: 20.2.c
    text: |-
      de bieding in de primaire biedronde en de aanvullende biedronde door een nieuwkomer heeft uitsluitend betrekking
      op de vergunningen A1, A2, B, C, D, E, F of G. In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], of
      [4, eerste lid][ref2], heeft de bieding uitsluitend betrekking op de vergunningen A1, B, C, D, E, F of G. In het
      geval, bedoeld in [artikel 6, eerste lid][ref3], heeft de bieding uitsluitend betrekking op de vergunningen A2, B,
      C, D, E, F of G. In het geval, bedoeld in [artikel 7, eerste lid][ref4], heeft de bieding uitsluitend betrekking op
      de vergunningen B, C, D, E, F en G;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: 20.2.d
    text: |-
      de bieding in de primaire biedronde en de aanvullende biedronde door een andere aanvrager dan een nieuwkomer heeft
      uitsluitend betrekking op de vergunningen B, C, D, E, F of G;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.2.e
    text: |-
      de bieding in de primaire biedronde en de aanvullende biedronde geeft de aantallen vergunningen A1, A2, B, C, D,
      E, F en G aan waarop de bieding betrekking heeft, met dien verstande dat een bieding op vergunning G tenminste twee
      vergunningen G betreft;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.2.f
    text: |-
      in de aanvullende biedronde en in de toewijzingsbiedronde bevat de bieding een biedbedrag en wordt die bieding
      gedaan in eenheden van € 1000;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.2.g
    text: in een primaire biedronde is de bieding de eerste bieding van een deelnemer in die ronde;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.2.h
    text: |-
      het biedbedrag van de bieding in de aanvullende ronde voldoet aan de in [artikel 30][ref1] gestelde vereisten;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel30
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '30'
        paragraaf: '7'
  - number: 20.2.i
    text: |-
      in de toewijzingsbiedronde heeft de bieding van een deelnemer op een vergunning A1, A2, B, C, D, E of G uitsluitend
      betrekking op een alternatief voor frequentieruimte voor die vergunning A1, A2, B, C, D, E of G die voorkomt op de
      voor die deelnemer samengestelde lijst, bedoeld in [artikel 38][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel38
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '38'
        paragraaf: '8'
  - number: 20.2.j
    text: de bieding is in de Nederlandse taal gesteld, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.2.k
    text: de bieding is tijdig ingediend.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: '20.3'
    text: |-
      In afwijking van het tweede lid, onder a, is een bieding die is uitgebracht door middel van het elektronisch
      veilingsysteem via internet ongeldig en een schriftelijke bieding geldig, indien de betrokken deelnemer met
      betrekking tot die biedronde toestemming als bedoeld in [artikel 21][ref1] heeft gekregen voor het uitbrengen van
      een schriftelijke bieding, en die toestemming niet is ingetrokken overeenkomstig artikel 21, vijfde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel21
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '21'
        paragraaf: '6'
  - number: '20.4'
    text: |-
      Een schriftelijke bieding als bedoeld in het derde lid is ongeldig wanneer niet is voldaan aan de volgende
      voorwaarden:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.4.a
    text: de bieding voldoet aan de in het tweede lid, onder b tot en met k, gestelde voorwaarden;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.4.b
    text: |-
      de bieding wordt gedaan overeenkomstig het model in [bijlage V][ref1] bij deze regeling;


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: 20.4.c
    text: |-
      de bieding wordt ingediend door middel van het krachtens [artikel 14, tweede lid, onder d][ref1], meegedeelde
      faxnummer, of


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
  - number: 20.4.d
    text: de bieding is leesbaar en eenduidig.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: '20.5'
    text: |-
      Indien een deelnemer niet heeft voldaan aan de in het tweede lid, onder a tot en met j, gestelde voorwaarden,
      deelt de minister dit de deelnemer mee en stelt hij de deelnemer in de gelegenheid het verzuim door middel van
      het elektronisch veilingsysteem te herstellen binnen de duur van de betrokken biedronde, dan wel de verlengde
      biedronde, bedoeld in [artikel 23, eerste of tweede lid, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel23
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '23'
        paragraaf: '6'
  - number: '20.6'
    text: |-
      In afwijking van het vijfde lid wordt aan een deelnemer die toestemming heeft om een schriftelijke bieding in te
      dienen en die niet heeft voldaan aan de in het tweede lid, onder b tot en met j, gestelde voorwaarden of de in het
      vierde lid, onder b tot en met d, gestelde voorwaarden:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.6.a
    text: per fax meegedeeld dat hij niet aan de gestelde voorwaarden heeft voldaan, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: 20.6.b
    text: |-
      gelegenheid gegeven om het verzuim binnen een door de minster gestelde termijn te herstellen, met dien verstande
      dat de minister per deelnemer ten hoogste tienmaal gedurende de gehele veiling de gelegenheid kan geven om het
      verzuim te herstellen.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel20
  - number: '21.1'
    text: |-
      Indien een deelnemer door een elektronische storing niet in staat is om door middel van het elektronisch
      veilingsysteem een bieding uit te brengen, kan de minister toestemming geven om een bieding schriftelijk uit te
      brengen door middel van het in [artikel 14, tweede lid, onder d][ref1], bedoelde faxnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
  - number: '21.2'
    text: |-
      Een verzoek tot toestemming als bedoeld in het eerste lid, wordt schriftelijk ingediend via het in
      [artikel 14, tweede lid, onder d][ref1], bedoelde faxnummer, is met redenen omkleed en wordt door de minister
      ontvangen uiterlijk binnen 10 minuten na afloop van de biedronde.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
  - number: '21.3'
    text: |-
      De minister kan toestemming als bedoeld in het eerste lid geven voor een enkele primaire biedronde of voor meerdere
      primaire biedronden, voor de aanvullende biedronde of voor de toewijzingsbiedronde.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel21
  - number: '21.4'
    text: Aan de toestemming, bedoeld in het eerste lid, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel21
  - number: '21.5'
    text: |-
      De minister kan de toestemming, bedoeld in het eerste lid, op verzoek van de deelnemer intrekken, wanneer dit
      verzoek door middel van het in [artikel 14, tweede lid, onder d][ref1], bedoelde faxnummer schriftelijk wordt
      gedaan uiterlijk 10 minuten na afloop van de voorgaande biedronde, dan wel de verlengde biedronde, bedoeld in
      [artikel 23, eerste of tweede lid, onder b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel23
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '23'
        paragraaf: '6'
  - number: '22.1'
    text: 'Het aantal activiteitspunten bedraagt:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: 22.1.a
    text: 'met betrekking tot vergunning A1 of A2: 15;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: 22.1.b
    text: 'met betrekking tot vergunning B of C: 15;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: 22.1.c
    text: 'met betrekking tot vergunning D: 2;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: 22.1.d
    text: 'met betrekking tot vergunning E of F: 1;'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: 22.1.e
    text: |-
      met betrekking tot vergunning G: het aantal vergunningen waarop de bieding of de voorkeur, bedoeld in
      [bijlage I][ref1], onderdeel B, betrekking heeft minus 1.


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: '22.2'
    text: |-
      Het activiteitsniveau van een bieding is de som van de activiteitspunten van de vergunningen waarop de bieding
      betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: '22.3'
    text: 'Het activiteitsniveau van een deelnemer bedraagt:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: 22.3.a
    text: |-
      in de eerste primaire biedronde: het aantal activiteitspunten dat hem overeenkomstig
      [artikel 14, eerste lid][ref1], is meegedeeld;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
  - number: 22.3.b
    text: |-
      in elke volgende primaire biedronde: het aantal activiteitspunten van de bieding van de deelnemer in de voorgaande
      ronde;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: 22.3.c
    text: |-
      in de aanvullende biedronde: het aantal activiteitspunten van de bieding van de deelnemer in de laatste primaire
      biedronde, of, indien de deelnemer in de laatste primaire biedronde een activiteitsniveau van nul had: nul.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: '22.4'
    text: |-
      Indien een deelnemer in een primaire biedronde geen bieding uitbrengt of een ongeldige bieding uitbrengt, is het
      activiteitsniveau van de betreffende deelnemer in de volgende biedronde nul.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: '22.5'
    text: |-
      Het activiteitsniveau van de bieding die een deelnemer in een biedronde uitbrengt is niet hoger dan het
      activiteitsniveau van de deelnemer in die biedronde.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
  - number: '22.6'
    text: |-
      In afwijking van het vijfde lid kan het activiteitsniveau van een bieding in de aanvullende biedronde hoger zijn
      dan het activiteitsniveau van de deelnemer, maar niet hoger dan het aantal activiteitspunten dat hem op grond van
      [artikel 14, eerste lid][ref1], is meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel14
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '14'
        paragraaf: '5'
  - number: '23.1'
    text: |-
      Indien een deelnemer een biedronde laat verstrijken zonder dat hij een bieding uitbrengt, wordt die biedronde
      voor die deelnemer eenmalig van rechtswege verlengd met een termijn van 30 minuten, met dien verstande dat in ten
      hoogste twee primaire biedronden voor een deelnemer verlenging plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: '23.2'
    text: 'In afwijking van het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: 23.2.a
    text: |-
      kan de minister ingeval van bijzondere omstandigheden een deelnemer op zijn verzoek toestemming verlenen om zijn
      biedronde te verlengen met een door de minister te bepalen termijn;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: 23.2.b
    text: |-
      wordt, indien aan een deelnemer toestemming als bedoeld in [artikel 21, eerste lid][ref1], is gegeven, de
      betreffende biedronde voor die deelnemer verlengd met een door de minister te bepalen termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel21
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '21'
        paragraaf: '6'
  - number: '23.3'
    text: |-
      Het verzoek tot toestemming als bedoeld in het tweede lid, onder a, is met redenen omkleed en wordt ontvangen
      uiterlijk binnen 10 minuten na afloop van de biedronde of de verlengde biedronde, bedoeld in het eerste of tweede
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: '23.4'
    text: Aan de toestemming, bedoeld in het tweede lid, onder a, kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: '23.5'
    text: 'Een op grond van het eerste of tweede lid verlengde biedronde is afgelopen zodra:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: 23.5.a
    text: alle deelnemers wier biedronde is verlengd, een bieding hebben uitgebracht, of
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: 23.5.b
    text: de biedronde dan wel de verlengde biedronde voor een deelnemer is verstreken.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: '23.6'
    text: |-
      De minister deelt zo spoedig mogelijk aan alle deelnemers mee dat een biedronde voor een of meer deelnemers is
      verlengd.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel23
  - number: '24.1'
    text: De primaire biedronde bestaat uit één of meer biedronden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel24
  - number: '24.2'
    text: Een deelnemer brengt in een primaire biedronde per biedronde ten hoogste één bieding uit.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel24
  - number: '24.3'
    text: |-
      Een bieding in een primaire biedronde kan betrekking hebben op andere vergunningen dan waarvoor een deelnemer
      in zijn aanvraag, bedoeld in [bijlage I][ref1], onderdeel B, een voorkeur heeft uitgesproken, alsmede op andere
      vergunningen dan waarop zijn bieding in een voorgaande primaire biedronde betrekking had.


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: '24.4'
    text: |-
      Een bieding in een primaire biedronde ziet op het aantal vergunningen waarop een deelnemer biedt gelet op de in die
      biedronde geldende rondeprijs voor die vergunningen, bedoeld in [artikel 26][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel26
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '26'
        paragraaf: '7'
  - number: '25.1'
    text: |-
      De minister deelt elke deelnemer voor aanvang van de eerste primaire biedronde de aanvangstijd en de duur van de
      biedronde mee.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: '25.2'
    text: 'De minister deelt elke deelnemer zo spoedig mogelijk na het einde van een primaire biedronde mee:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: 25.2.a
    text: |-
      zijn activiteitsniveau, bedoeld in [artikel 22, derde lid, onder b][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: 25.2.b
    text: zijn verlengingsmogelijkheden in de volgende primaire biedronde;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: 25.2.c
    text: zijn bieding in de vorige biedronde;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: 25.2.d
    text: het bedrag van zijn hoogste bieding in de veiling tot dan toe;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: 25.2.e
    text: de aanvangstijd en de duur van de volgende biedronde;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: 25.2.f
    text: de rondeprijzen die in de volgende biedronde gelden per type vergunning, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: 25.2.g
    text: de totale vraag in de vorige biedronde per type vergunning.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
  - number: '25.3'
    text: |-
      In afwijking van het tweede lid, onder e en f, wordt geen informatie over een volgende primaire biedronde gegeven
      indien de primaire biedronden op grond van [artikel 27][ref1] eindigen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel27
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '27'
        paragraaf: '7'
  - number: '26.1'
    text: 'De rondeprijzen in de eerste primaire biedronde zijn:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: 26.1.a
    text: € 35.000.000,00 voor een vergunning A1 en B;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: 26.1.b
    text: € 28.900.000,00 voor een vergunning A2 en C;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: 26.1.c
    text: € 4.125.000,00 voor een vergunning D;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: 26.1.d
    text: € 810.000,00 voor een vergunning E;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: 26.1.e
    text: € 590.000,00 voor vergunning F;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: 26.1.f
    text: € 585.000,00 voor een vergunning G.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.2'
    text: |-
      In de tweede en volgende primaire biedronden verhoogt de minister de rondeprijzen, bedoeld in het eerste lid,
      overeenkomstig het derde tot en met vijftiende lid.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.3'
    text: |-
      De rondeprijs van vergunning A1 wordt in een biedronde verhoogd indien in de direct daaraan voorafgaande biedronde
      de vraag naar vergunning A1 groter is dan twee.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.4'
    text: |-
      In het geval, bedoeld in de [artikelen 4, eerste lid][ref1], of [5, eerste lid][ref2], wordt in afwijking van
      het derde lid, de rondeprijs van vergunning A1 in een biedronde verhoogd indien in de direct daaraan voorafgaande
      biedronde de vraag naar vergunning A1 groter is dan één.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel5
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
  - number: '26.5'
    text: |-
      De rondeprijs van vergunning A2 wordt in een biedronde verhoogd indien in de direct daaraan voorafgaande biedronde
      de vraag naar vergunning A2 groter is dan één.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.6'
    text: |-
      De rondeprijs van vergunning B wordt in een biedronde verhoogd indien in de direct daaraan voorafgaande biedronde
      de vraag naar vergunning B groter is dan vier.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.7'
    text: |-
      In het geval, bedoeld in de [artikelen 4, eerste lid][ref1], of [5, eerste lid][ref2], wordt in afwijking van
      het zesde lid, de rondeprijs van vergunning B in een biedronde verhoogd indien in de direct daaraan voorafgaande
      biedronde de vraag naar vergunning B groter is dan vijf.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel5
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
  - number: '26.8'
    text: |-
      In het geval, bedoeld in de [artikelen 6, eerste lid][ref1], of [7, eerste lid][ref2], wordt in afwijking van
      het zesde lid, de rondeprijs van vergunning B in een biedronde verhoogd indien in de direct daaraan voorafgaande
      biedronde de vraag naar vergunning B groter is dan zes.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '26.9'
    text: |-
      De rondeprijs van vergunning C wordt in een biedronde verhoogd indien in de direct daaraan voorafgaande biedronde
      de vraag naar vergunning C groter is dan zes.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.10'
    text: |-
      In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], [4, eerste lid][ref2], of [7, eerste lid][ref3], wordt
      in afwijking van het negende lid, de rondeprijs van vergunning C in een biedronde verhoogd indien in de direct
      daaraan voorafgaande biedronde de vraag naar vergunning C groter is dan zeven.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '26.11'
    text: |-
      De rondeprijs van vergunning D wordt verhoogd indien in de direct daaraan voorafgaande biedronde de vraag naar deze
      vergunningen groter is dan veertien.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.12'
    text: |-
      De rondeprijs van vergunning E wordt verhoogd indien in de direct daaraan voorafgaande biedronde de vraag naar deze
      vergunningen groter is dan twee.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.13'
    text: |-
      De rondeprijs van vergunning F wordt verhoogd indien in de direct daaraan voorafgaande biedronde de vraag naar deze
      vergunning groter is dan één.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.14'
    text: |-
      De rondeprijs van vergunning G wordt verhoogd indien in de direct daaraan voorafgaande biedronde de vraag naar deze
      vergunningen groter is dan tien.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.15'
    text: |-
      In de in het derde tot en met veertiende lid bedoelde gevallen verhoogt de minister in eenheden van € 1.000 de
      rondeprijs van een vergunning zodanig dat de verhoging van de rondeprijs van een vergunning in een biedronde ten
      hoogste 100% is ten opzichte van de rondeprijs voor die vergunning in de daaraan voorafgaande ronde.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '26.16'
    text: |-
      Indien dit naar het oordeel van de minister nodig is voor een evenwichtige vraagontwikkeling of een efficiënt
      verloop van de veiling kan hij afwijken van het vijftiende lid.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel26
  - number: '27.1'
    text: |-
      De primaire biedronden eindigen indien met inachtneming van het bepaalde in de
      [artikelen 2, derde tot en met twaalfde lid][ref1], [3, tweede en derde lid][ref2], [4, tweede en derde lid][ref3],
      [5, tweede lid][ref4], [6, tweede en derde lid][ref5], of [7, tweede tot en met vierde lid][ref6], voldaan kan
      worden aan de vraag naar vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0031069#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0031069#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '27.2'
    text: |-
      In afwijking van het eerste lid, kan de minister de primaire biedronden beëindigen indien dat naar de mening van de
      minister geboden is ten behoeve van een efficiënt veilingproces.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel27
  - number: '28.1'
    text: 'Na het einde van de primaire biedronden deelt de minister elke deelnemer mee:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel28
  - number: 28.1.a
    text: dat de primaire biedronden zijn geëindigd;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel28
  - number: 28.1.b
    text: wanneer de aanvullende biedronde een aanvang neemt, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel28
  - number: 28.1.c
    text: de duur van de aanvullende biedronde.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel28
  - number: '28.2'
    text: |-
      De minister deelt elke deelnemer voor aanvang van de aanvullende biedronde zijn activiteitsniveau als bedoeld in
      [artikel 22, derde lid, onder c][ref1], mee.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: '29.1'
    text: |-
      De aanvullende biedronde bestaat uit één biedronde waarin door een deelnemer meerdere biedingen kunnen worden
      gedaan.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel29
  - number: '29.2'
    text: Een deelnemer brengt in de aanvullende biedronde ten hoogste 2000 biedingen uit.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel29
  - number: '29.3'
    text: |-
      Een bieding in de aanvullende biedronde kan betrekking hebben op andere vergunningen dan waarvoor een deelnemer
      in zijn aanvraag, bedoeld in [bijlage I][ref1], onderdeel B, een voorkeur heeft uitgesproken, alsmede op andere
      vergunningen dan waarop zijn bieding in enige primaire biedronde betrekking had.


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: '29.4'
    text: |-
      De aanvang van de aanvullende biedronde is niet eerder dan ten minste een werkdag na het einde van de primaire
      biedronden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel29
  - number: '30.1'
    text: 'De minimaal te bieden bedragen in de aanvullende biedronde zijn:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: 30.1.a
    text: € 35.000.000,00 voor een vergunning A1 en B;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: 30.1.b
    text: € 28.900.000,00 voor een vergunning A2 en C;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: 30.1.c
    text: € 4.125.000,00 voor een vergunning D;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: 30.1.d
    text: € 810.000,00 voor een vergunning E;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: 30.1.e
    text: € 590.000,00 voor vergunning F;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: 30.1.f
    text: € 585.000,00 voor een vergunning G.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: '30.2'
    text: |-
      Indien een deelnemer in de aanvullende biedronde een bieding uitbrengt op hetzelfde pakket als waarop hij in een
      primaire biedronde heeft geboden, is het biedbedrag van de bieding in de aanvullende biedronde hoger dan de prijs
      voor dat pakket tegen de rondeprijzen in de primaire biedronde waarin hij er voor het laatst op heeft geboden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: '30.3'
    text: |-
      Onverminderd [artikel 22, zesde lid][ref1], geldt in de aanvullende biedronde voor biedingen van een deelnemer
      op andere pakketten dan zijn finale pakket, dat het biedbedrag voor pakket X niet hoger is dan de hoogste prijs
      waartegen de deelnemer op pakket Y heeft geboden in een primaire biedronde of in de aanvullende biedronde,
      vermeerderd met de prijs voor pakket X tegen de rondeprijzen in primaire biedronde n, verminderd met de prijs voor
      pakket Y tegen de rondeprijzen in primaire biedronde n, waarbij: - pakket X het pakket is waarop de deelnemer in de
      aanvullende biedronde een bieding uitbrengt,
        - primaire biedronde n de laatste primaire biedronde is waarin het activiteitsniveau van de deelnemer hoger dan of
      gelijk was aan het benodigd aantal activiteitspunten om een bieding uit te kunnen brengen op pakket X, en
        - pakket Y het pakket is waarop de deelnemer in primaire biedronde n een bieding uitbracht.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: '30.4'
    text: |-
      Onverminderd [artikel 22, zesde lid][ref1], geldt voor een deelnemer die zijn finale primaire bieding in een
      andere primaire biedronde dan de laatste primaire biedronde heeft uitgebracht, dat het biedbedrag in de aanvullende
      biedronde voor een bieding van deze deelnemer op zijn finale pakket niet hoger is dan de prijs voor dit pakket
      tegen de rondeprijzen in de primaire biedronde na de biedronde waarin hij zijn finale primaire bieding heeft
      uitgebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel22
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '22'
        paragraaf: '6'
  - number: '30.5'
    text: |-
      Indien een deelnemer zijn finale primaire bieding in de laatste primaire biedronde heeft uitgebracht, geldt in de
      aanvullende biedronde voor deze deelnemer geen maximumbedrag voor een bieding op zijn finale pakket.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel30
  - number: '31.1'
    text: De minister stelt overeenkomstig het tweede tot en met vierde lid de combinatie van winnende biedingen vast.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel31
  - number: '31.2'
    text: |-
      De combinatie van winnende biedingen is de combinatie van biedingen die zijn uitgebracht in de primaire biedronden
      of in de aanvullende ronden, die voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel31
  - number: 31.2.a
    text: de combinatie behelst ten hoogste één bieding per deelnemer;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel31
  - number: 31.2.b
    text: |-
      met inachtneming van het bepaalde in de [artikelen 2, derde tot en met twaalfde lid][ref1],
      [3, tweede en derde lid][ref2], [4, tweede en derde lid][ref3], [5, tweede lid][ref4],
      [6, tweede en derde lid][ref5], of [7, tweede tot en met vierde lid][ref6], heeft de combinatie betrekking op niet
      meer vergunningen dan er worden geveild;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0031069#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0031069#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: 31.2.c
    text: |-
      de combinatie heeft de hoogste opbrengst van de combinaties van biedingen die voldoen aan de onder a en b genoemde
      voorwaarden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel31
  - number: '31.3'
    text: |-
      Indien er meerdere combinaties van winnende biedingen voldoen aan het tweede lid wordt er opnieuw een aanvullende
      biedronde gehouden, met dien verstande dat er ten hoogste driemaal opnieuw een aanvullende biedronde wordt
      gehouden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel31
  - number: '31.4'
    text: |-
      Indien na het driemaal opnieuw houden van een aanvullende biedronde er nog steeds meerdere combinaties van
      winnende biedingen kunnen worden vastgesteld op basis van het tweede lid, wordt door middel van loting tussen alle
      combinaties van winnende biedingen, vastgesteld wat de combinatie van winnende biedingen is.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel31
  - number: '32.1'
    text: |-
      Nadat de combinatie van winnende biedingen door de minister is vastgesteld overeenkomstig [artikel 31][ref1],
      bepaalt de minister voor iedere winnende bieding een basisprijs op grond van [bijlage III][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '31'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
  - number: '32.2'
    text: |-
      De basisprijzen worden naar boven afgerond op eenheden van € 1.000, met dien verstande dat een deelnemer na
      afronding niet meer betaalt dan het biedbedrag van zijn winnende bieding.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel32
  - number: '33.1'
    text: |-
      Na het bepalen van de combinatie van winnende biedingen en de basisprijzen van iedere winnende bieding deelt de
      minister iedere deelnemer mee:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: 33.1.a
    text: |-
      welke deelnemers op grond van [artikel 31, eerste lid][ref1], vergunningen hebben gewonnen alsmede het aantal
      vergunningen A1, A2, B, C, D, E of G dat die deelnemers hebben gewonnen, en


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel31
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '31'
        paragraaf: '7'
  - number: 33.1.b
    text: dat de aanvullende biedronde is geëindigd.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: '33.2'
    text: De minister deelt voorts aan een deelnemer de basisprijs van zijn winnende bieding mee.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: '33.3'
    text: |-
      Na het bepalen van de combinatie van winnende biedingen en de basisprijzen van iedere winnende bieding maakt de
      minister openbaar:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: 33.3.a
    text: |-
      de namen van de deelnemers die op grond van [artikel 31, eerste lid][ref1], vergunningen A1, A2, B, C, D, E, F of G
      hebben gewonnen, en


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel31
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '31'
        paragraaf: '7'
  - number: 33.3.b
    text: het aantal vergunningen A1, A2, B, C, D, E of G dat een deelnemer heeft gewonnen.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: '33.4'
    text: |-
      In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], of [4, eerste lid][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel4
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
  - number: 33.4.a
    text: |-
      zijn het eerste lid, onder a, en derde lid, onder b, van toepassing, met dien verstande dat deze betrekking hebben
      op de vergunningen A1, B, C, D, E of G, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: 33.4.b
    text: |-
      is het derde lid, onder a, van toepassing, met dien verstande dat dit betrekking heeft op de vergunningen A1, B, C,
      D, E, F of G.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: '33.5'
    text: |-
      In het geval, bedoeld in [artikel 6, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel6
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
  - number: 33.5.a
    text: |-
      zijn het eerste lid, onder a, en derde lid, onder b, van toepassing, met dien verstande dat deze betrekking hebben
      op de vergunningen A2, B, C, D, E of G, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: 33.5.b
    text: |-
      is het derde lid, onder a, van toepassing, met dien verstande dat dit betrekking heeft op de vergunningen A2, B, C,
      D, E, F of G.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: '33.6'
    text: |-
      In het geval, bedoeld in [artikel 7, eerste lid][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: 33.6.a
    text: |-
      zijn het eerste lid, onder a, en derde lid, onder b, van toepassing, met dien verstande dat deze betrekking hebben
      op de vergunningen B, C, D, E of G, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: 33.6.b
    text: |-
      is het derde lid, onder a, van toepassing, met dien verstande dat dit betrekking heeft op de vergunningen B, C, D,
      E, F of G.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel33
  - number: '34.1'
    text: Vergunning F wordt verleend aan de deelnemer die op vergunning F de winnende bieding heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel34
  - number: '34.2'
    text: De minister deelt iedere deelnemer mee aan wie vergunning F is verleend.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel34
  - number: '34.3'
    text: |-
      De totaalprijs van vergunning F bestaat uit de op grond van [artikel 32][ref1] afgeronde basisprijs voor die
      vergunning.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel32
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '32'
        paragraaf: '7'
  - number: '35.1'
    text: |-
      Indien de combinatie van winnende biedingen, gelet op de [artikelen 2, derde tot en met twaalfde lid][ref1], of
      [5, eerste lid][ref2], zodanig is samengesteld dat een vergunning A1, A2, B, C, D, E of G uitsluitend betrekking
      heeft op één alternatief voor frequentieruimte als bedoeld in [artikel 38][ref3], dan wordt die vergunning verleend
      aan de deelnemer die op die vergunning de winnende bieding heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel38
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '38'
        paragraaf: '8'
  - number: '35.2'
    text: |-
      In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], of [4, eerste lid][ref2], is het eerste lid van
      toepassing, met dien verstande dat dit een vergunning A1, B, C, D, E of G betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel4
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
  - number: '35.3'
    text: |-
      In het geval, bedoeld in [artikel 6, eerste lid][ref1], is het eerste lid van toepassing, met dien verstande dat
      dit een vergunning A2, B, C, D, E of G betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel6
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
  - number: '35.4'
    text: |-
      In het geval, bedoeld in [artikel 7, eerste lid][ref1], is het eerste lid van toepassing, met dien verstande dat
      dit een vergunning B, C, D, E of G betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '35.5'
    text: |-
      De minister deelt iedere deelnemer mee aan wie de vergunningen, bedoeld in het eerste lid, zijn verleend, alsmede
      voor welke frequentieruimte de vergunningen zijn verleend.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel35
  - number: '35.6'
    text: |-
      De totaalprijs voor de in het eerste lid bedoelde vergunningen bestaat uit de op grond van [artikel 32][ref1]
      afgeronde basisprijs voor die vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel32
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '32'
        paragraaf: '7'
  - number: '36.1'
    text: 'Zo spoedig mogelijk na het einde van aanvullende biedronde, deelt de minister elke deelnemer mee:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel36
  - number: 36.1.a
    text: wanneer de toewijzingsbiedronde een aanvang neemt, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel36
  - number: 36.1.b
    text: de duur van de toewijzingsbiedronde.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel36
  - number: '36.2'
    text: |-
      De minister deelt voorts elke deelnemer voor aanvang van de toewijzingsbiedronde mee wat de alternatieven zijn
      waarop de betreffende deelnemer op grond van [artikel 38][ref1] kan bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel38
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '38'
        paragraaf: '8'
  - number: '37.1'
    text: |-
      De toewijzingsbiedronde bestaat uit een aparte toewijzingsbiedronde voor de typen vergunningen A1 en B tezamen,
      A2 en C tezamen, D, E en G die gelijktijdig plaatsvinden en waarin wordt bepaald voor welke frequentieruimte
      een deelnemer een vergunning verkrijgt, met dien verstande dat de toewijzingsbiedronde geen betrekking heeft op
      vergunningen die op grond van [artikel 35, eerste lid][ref1], zijn verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel35
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
  - number: '37.2'
    text: |-
      In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], en [4, eerste lid][ref2], is het eerste lid van
      toepassing, met dien verstande dat de toewijzingsbiedronde uit een aparte toewijzingsbiedronde bestaat voor de
      typen vergunningen A1 en B tezamen, C, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel4
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
  - number: '37.3'
    text: |-
      In het geval, bedoeld in [artikel 5, eerste lid][ref1], is het eerste lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel5
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
  - number: '37.4'
    text: |-
      In het geval, bedoeld in [artikel 6, eerste lid][ref1], is het eerste lid van toepassing, met dien verstande dat de
      toewijzingsbiedronde uit een aparte toewijzingsbiedronde bestaat voor de typen vergunningen A2 en C tezamen, B, C,
      D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel6
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
  - number: '37.5'
    text: |-
      In het geval, bedoeld in [artikel 7, eerste lid][ref1], is het eerste lid van toepassing, met dien verstande dat de
      toewijzingsbiedronde uit een aparte toewijzingsbiedronde bestaat voor elk van het type vergunning B, C, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '37.6'
    text: |-
      Een deelnemer kan in de toewijzingsbiedronde uitsluitend bieden op het type vergunningen, zoals voorkomend op de
      voor hem samengestelde lijst met alternatieven, bedoeld in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel38
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '38'
        paragraaf: '8'
  - number: '37.7'
    text: |-
      De aanvang van de toewijzingsbiedronde is niet eerder dan ten minste een werkdag na het einde van de aanvullende
      biedronde.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel37
  - number: '38.1'
    text: |-
      De minister stelt op basis van de [artikelen 31, eerste lid][ref1], en [35, eerste lid][ref2], voor iedere
      deelnemer een lijst samen met per type vergunning de alternatieven voor de frequentieruimte waarop hij gezien de
      aantallen vergunningen A1, A2, B, C, D, E en G die hij heeft gewonnen in de toewijzingsbiedronde kan bieden.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel35
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '31'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
  - number: '38.2'
    text: |-
      In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], en [4, eerste lid][ref2], is het eerste lid van
      toepassing, met dien verstande dat dit betrekking heeft op de vergunningen A1, B, C, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel4
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
  - number: '38.3'
    text: |-
      In het geval, bedoeld in [artikel 5, eerste lid][ref1], is het eerste lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel5
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '5'
        paragraaf: '2'
  - number: '38.4'
    text: |-
      In het geval, bedoeld in [artikel 6, eerste lid][ref1], is het eerste lid van toepassing, met dien verstande dat
      dit betrekking heeft op de vergunningen A2, B, C, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel6
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
  - number: '38.5'
    text: |-
      In het geval, bedoeld in [artikel 7, eerste lid][ref1], is het eerste lid van toepassing, met dien verstande dat
      dit betrekking heeft op de vergunningen B, C, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '39'
    text: |-
      Indien voor een alternatief voor frequentieruimte als bedoeld in [artikel 38][ref1] geen bieding wordt ontvangen,
      wordt voor dat alternatief uitgegaan van een biedbedrag van nul euro.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel38
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '38'
        paragraaf: '8'
  - number: '40.1'
    text: |-
      De minister stelt overeenkomstig het tweede en derde lid de finale combinatie van winnende biedingen voor de typen
      vergunningen A1 en B tezamen, A2 en C tezamen, D, E en G vast.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
  - number: '40.2'
    text: |-
      De finale combinatie van winnende biedingen voor een type vergunning is de combinatie van biedingen die voor dat
      type vergunningen zijn uitgebracht in de toewijzingsbiedronde die voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
  - number: 40.2.a
    text: |-
      de biedingen in de combinatie betreffen alternatieven voor frequentieruimte die voor het type vergunning waarop die
      biedingen betrekking hebben voorkomen op de lijst, bedoeld in [artikel 38][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel38
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '38'
        paragraaf: '8'
  - number: 40.2.b
    text: de combinatie heeft de hoogste opbrengst.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
  - number: '40.3'
    text: |-
      Indien voor de typen vergunningen A1 en B tezamen, A2 en C tezamen, D, E of G meerdere combinaties van winnende
      biedingen voldoen aan het tweede lid, wordt er voor dat type vergunning opnieuw een toewijzingsbiedronde gehouden,
      met dien verstande dat er ten hoogste driemaal opnieuw een toewijzingsbiedronde wordt gehouden.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
  - number: '40.4'
    text: |-
      Indien na het driemaal opnieuw houden van een toewijzingsbiedronde er nog steeds meerdere finale combinaties van
      winnende biedingen voor de typen vergunningen A1 en B tezamen, A2 en C tezamen, D, E of G kunnen worden vastgesteld
      op basis van het eerste en tweede lid, wordt door middel van loting tussen alle combinaties van winnende biedingen
      voor dat type vergunning uit de laatste toewijzingsbiedronde die voldoen aan het tweede lid, vastgesteld wat de
      finale combinatie van winnende biedingen voor dat type vergunning is.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
  - number: '40.5'
    text: |-
      In het geval, bedoeld in de [artikelen 3, eerste lid][ref1], en
      [4, eerste lid, zijn het eerste, derde en vierde lid][ref2], van toepassing, met dien verstande dat deze betrekking
      hebben op de vergunningen A1 en B tezamen, C, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel4
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '4'
        paragraaf: '2'
  - number: '40.6'
    text: |-
      In het geval, bedoeld in [artikel 6, eerste lid][ref1], zijn het eerste, derde en vierde lid, van toepassing, met
      dien verstande dat deze betrekking hebben op de vergunningen A2 en C tezamen, B, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel6
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '6'
        paragraaf: '2'
  - number: '40.7'
    text: |-
      In het geval, bedoeld in [artikel 7, eerste lid][ref1], zijn het eerste, derde en vierde lid, van toepassing, met
      dien verstande dat deze betrekking hebben op de vergunningen B, C, D, E en G.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel7
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '7'
        paragraaf: '2'
  - number: '41.1'
    text: |-
      Nadat de finale combinatie van winnende biedingen is vastgesteld, bepaalt de minister de extra prijzen op grond
      van [bijlage IV][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: '41.2'
    text: |-
      De extra prijzen, bedoeld in het eerste lid, worden naar boven afgerond op eenheden van € 1000, met dien verstande
      dat een deelnemer na afronding niet meer betaalt dan het biedbedrag van zijn winnende bieding.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel41
  - number: '41.3'
    text: |-
      De totaalprijs die een winnende deelnemer verschuldigd is voor de door hem gewonnen vergunningen, bestaat uit de op
      grond van [artikel 32, tweede lid][ref1], afgeronde basisprijs voor die vergunningen en de op grond van het tweede
      lid afgeronde extra prijs voor die vergunningen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel32
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '32'
        paragraaf: '7'
  - number: '42'
    text: |-
      De minister deelt de deelnemers zo spoedig mogelijk na het bepalen van de extra prijzen, bedoeld in
      [artikel 41, eerste lid][ref1], en het bepalen van de totaalprijzen, bedoeld in artikel 41, derde lid, mee:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel41
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '41'
        paragraaf: '8'
  - number: 42.a
    text: dat de veiling is afgelopen;
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel42
  - number: 42.b
    text: de identiteit van de winnende deelnemers en de door hen gewonnen vergunningen, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel42
  - number: 42.c
    text: |-
      de totaalprijzen die op grond van [artikel 41][ref1] zijn vastgesteld, inclusief een overzicht van basisprijzen en
      extra prijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel41
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '41'
        paragraaf: '8'
  - number: '43.1'
    text: |-
      Aan een winnende deelnemer wordt een vergunning verleend voor de door hem gewonnen vergunningen. De totaalprijs
      voor die vergunningen is gelijk aan het bedrag dat op grond van [artikel 41, derde lid][ref1], is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel41
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '41'
        paragraaf: '8'
  - number: '43.2'
    text: |-
      De minister wijst de overige aanvragen, voor zover dat nog niet is gebeurd op grond van de
      [artikelen 9, tweede lid][ref1], [10, achtste of negende lid][ref2], of [11, vijfde lid][ref3], af.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel11
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '9'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '10'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '11'
        paragraaf: '3'
  - number: '43.3'
    text: |-
      De minister maakt na de veiling de informatie, bedoeld in de [artikelen 34, tweede lid][ref1],
      [35, vijfde lid][ref2], en [42][ref3] openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel42
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '42'
        paragraaf: '8'
  - number: '44.1'
    text: |-
      Uiterlijk twee weken nadat de mededeling, bedoeld in [artikel 42][ref1], is gedaan:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel42
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '42'
        paragraaf: '8'
  - number: 44.1.a
    text: 'stort de minister de waarborgsom terug van de aanvrager:'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
  - number: 44.1.a.1°
    text: wiens bieding geen onderdeel is van de finale combinatie van winnende biedingen, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
  - number: 44.1.a.2°
    text: |-
      aan wie geen vergunning is verleend op grond van [artikel 34, eerste lid][ref1], of [35, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel35
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
  - number: 44.1.b
    text: |-
      stuurt de minister een schriftelijke verklaring als bedoeld in [bijlage II][ref1], onder II, onder 4, aan de bank
      van iedere aanvrager die ter zekerheidstelling een bankgarantie heeft overgelegd en:


      [ref1]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
  - number: 44.1.b.1°
    text: wiens bieding geen onderdeel is van de finale combinatie van winnende biedingen, en
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
  - number: 44.1.b.2°
    text: |-
      aan wie geen vergunning is verleend op grond van [artikel 34, eerste lid][ref1] of [32, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel32
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '32'
        paragraaf: '7'
  - number: 44.1.c
    text: |-
      betaalt de deelnemer wiens bieding onderdeel uitmaakt van de finale combinatie van winnende biedingen of aan
      wie een vergunning is verleend op grond van de [artikelen 34, eerste lid][ref1], of [35, eerste lid][ref2], en
      die een bankgarantie had gesteld, de door hem verschuldigde totaalprijs, door overmaking van dat bedrag op het
      bankrekeningnummer, genoemd in [artikel 15, zevende lid][ref3], onder vermelding van ‘Veiling 800, 900 en 1800
      MHz’. Zodra de verschuldigde totaalprijs is ontvangen stuurt de minister een schriftelijke verklaring als bedoeld
      in [bijlage II][ref4], onder II, onder 4, aan de bank van die deelnemer. De minister stuurt een kopie van deze
      verklaring aan de deelnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0031069
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '15'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0031069
  - number: 44.1.d
    text: |-
      wordt de waarborgsom van de deelnemer wiens bieding onderdeel uitmaakt van de finale combinatie van winnende
      biedingen of aan wie een vergunning is verleend op grond van de [artikelen 34, eerste lid][ref1], of
      [35, eerste lid][ref2], aangewend voor de betaling van de door hem verschuldigde totaalprijs, met dien verstande
      dat:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel35
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
  - number: 44.1.d.1°
    text: |-
      indien de waarborgsom minder dan de totaalprijs bedraagt, die deelnemer het restant van de totaalprijs betaalt door
      overmaking van dat restant op het bankrekeningnummer, genoemd in [artikel 15, zevende lid][ref1], onder vermelding
      van ‘Ministerie van Economische Zaken, Landbouw en Innovatie, Agentschap Telecom, veiling 800, 900 en 1800 MHz’,
      uiterlijk twee weken nadat de mededeling, bedoeld in [artikel 42][ref2], is gedaan, en


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel42
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '15'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '42'
        paragraaf: '8'
  - number: 44.1.d.2°
    text: |-
      indien de waarborgsom van die deelnemer meer dan de totaalprijs bedraagt, het bedrag van de waarborgsom
      dat resteert, aan die deelnemer wordt teruggestort, uiterlijk twee weken nadat de mededeling, bedoeld in
      [artikel 42][ref1], is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel42
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '42'
        paragraaf: '8'
  - number: '44.2'
    text: |-
      De minister vergoedt de rente over de gestorte waarborgsom vanaf de dag waarop hij de waarborgsom heeft ontvangen
      op het bankrekeningnummer, genoemd in [artikel 15, zevende lid][ref1], met dien verstande dat de rente wordt
      vergoed tot en met de dag:


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel15
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '15'
        paragraaf: '5'
  - number: 44.2.a
    text: |-
      voorafgaand aan de dag waarop de waarborgsom door de minister wordt teruggestort: voor de aanvrager wiens bieding
      geen onderdeel is van de finale combinatievan winnende biedingen en aan wie geen vergunning is verleend op grond
      van de [artikelen 34, eerste lid][ref1], of [35, eerste lid][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel35
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '34'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
  - number: 44.2.b
    text: |-
      waarop de mededeling, bedoeld in [artikel 42][ref1], is gedaan: voor de deelnemer wiens bieding onderdeel
      uitmaakt van de finale combinatie van winnende biedingen of aan wie een vergunning is verleend op grond van de
      [artikelen 34, eerste lid][ref2], of [35, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0031069#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0031069#Artikel35
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '42'
        paragraaf: '8'
      - id: ref2
        bwb_id: BWBR0031069
        artikel: '34'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0031069
        artikel: '35'
        paragraaf: '7'
  - number: '44.3'
    text: |-
      De minister vergoedt voorts aan een deelnemer van wie de waarborgsom meer bedraagt dan de totaalprijs, rente over
      het restant, bedoeld in het eerste lid, onder d, sub 2°, over de periode vanaf de dag waarop de mededeling, bedoeld
      in [artikel 42][ref1], is gedaan tot en met de dag voorafgaand aan de dag waarop de waarborgsom door de minister
      wordt teruggestort, met dien verstande dat er alleen rente wordt betaald over dat restant.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel42
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031069
        artikel: '42'
        paragraaf: '8'
  - number: '44.4'
    text: |-
      De minister stort de rente, bedoeld in het tweede en derde lid, terug op dezelfde dag waarop hij de waarborgsom of
      het bedrag dat resteert van de waarborgsom, terugstort.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel44
  - number: '45'
    text: Deze regeling treedt in werking met ingang van 16 april 2012.
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel45
  - number: '46'
    text: 'Deze regeling wordt aangehaald als: Regeling aanvraag- en veilingprocedure vergunningen 800, 900 en 1800 MHz.'
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel46
