        paragraaf: '2'
  - number: '4.2'
    text: |-
      In het geval, bedoeld in het eerste lid, is [artikel 2, achtste lid][ref1], van toepassing, met dien verstande dat
      dit uitsluitend betrekking heeft op de verlening van vergunningen C.


      [ref1]: https://wetten.overheid.nl/BWBR0031069#Artikel2
    url: https://wetten.overheid.nl/BWBR0031069/2012-07-11#Artikel4
    references:
      - id: ref1
