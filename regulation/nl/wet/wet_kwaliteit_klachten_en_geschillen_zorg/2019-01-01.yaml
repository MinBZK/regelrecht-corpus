  - number: 7a
    text: |-
      1 Onze Minister houdt een register in stand waarin ten behoeve van de bescherming van de gezondheid van cliënten
      gegevens worden verzameld over bij cliënten ingebrachte implantaten in overeenstemming met het bij of krachtens
      [artikel 7b][ref1] bepaalde.

      2 Het register wordt door Onze Minister gebruikt om:

      a. bij gesignaleerde risico’s met ingebrachte implantaten of met categorieën van implantaten inzicht te verkrijgen
      in het aantal betrokken cliënten en de mogelijke gevolgen van de risico’s voor de gezondheid van cliënten;

      b. zorgaanbieders en, door tussenkomst van deze, cliënten te informeren over de risico’s, bedoeld in onderdeel a,
      met het oog op de bescherming van de gezondheid van die cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7b
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 7b
        hoofdstuk: '2'
  - number: 7b
    text: |-
      1 De zorgverlener houdt in het dossier van een cliënt aantekening van bij of krachtens algemene maatregel van
      bestuur bepaalde gegevens van een bij die cliënt ingebracht implantaat op een wijze dat het ingebrachte implantaat
      kan worden herleid tot die cliënt.

      2 De zorgaanbieder verstrekt de geregistreerde gegevens, bedoeld in het eerste lid, over een bij een cliënt
      ingebracht implantaat ten behoeve van het register, bedoeld in [artikel 7a][ref1].

      3 De zorgverlener verstrekt schriftelijk aan een cliënt de gegevens, bedoeld in het eerste lid, over een bij die
      cliënt ingebracht implantaat.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de wijze waarop en de termijn
      waarbinnen de gegevens, bedoeld in het tweede en derde lid, worden verstrekt.

      5 Bij algemene maatregel van bestuur kunnen beperkingen worden gesteld aan de verplichtingen, bedoeld in het eerste
      en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7a
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 7a
        hoofdstuk: '2'
  - number: '8'
    text: |-
      1 De zorgaanbieder stelt een meldcode vast waarin stapsgewijs wordt aangegeven hoe met signalen van huiselijk
      geweld of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo snel en adequaat mogelijk
      hulp kan worden geboden.

      2 De zorgaanbieder bevordert de kennis en het gebruik van de meldcode.

      3 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel8
  - number: '9'
    text: |-
      1 Voor zover dit noodzakelijk is voor de goede werking van de systematische bewaking, beheersing en verbetering van
      de kwaliteit van de zorg, worden in een register als bedoeld in [artikel 7, tweede lid][ref1], zonder toestemming
      van de betrokkene, persoonsgegevens verwerkt betreffende intern gemelde incidenten, waaronder gegevens over
      gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene verordening gegevensbescherming.

      2 De zorgaanbieder stelt schriftelijk een interne procedure vast, waarin stapsgewijs wordt aangegeven hoe wordt
      omgegaan met signalen van incidenten. De zorgaanbieder bevordert de kennis en het gebruik van de procedure.

      3 De in het tweede lid bedoelde procedure is zodanig dat zij er redelijkerwijs aan bijdraagt dat zo snel en
      adequaat mogelijk bescherming kan worden geboden of maatregelen kunnen worden genomen, en waarborgt dat van
      persoonsgegevens geen kennis kan worden genomen door anderen dan de functionaris of functionarissen die met de
      behandeling van signalen van incidenten zijn belast.

      4 Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen de procedure in ieder geval
      bestaat.

      5 Degene die op grond van een wettelijk voorschrift of op grond van zijn beroep tot geheimhouding is verplicht,
      kan, zonder toestemming van de cliënt, overeenkomstig de vastgestelde procedure aan de daartoe aangewezen
      functionaris de gegevens, daaronder begrepen persoonsgegevens, gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15 van de Algemene verordening gegevensbescherming en andere bijzondere categorieën van persoonsgegevens
      als bedoeld in paragraaf 3.1 van de Uitvoeringswet Algemene verordening gegevensbescherming, verstrekken die
      noodzakelijk zijn te achten om een incident te onderzoeken.

      6 Gegevens in het register, bedoeld in [artikel 7, tweede lid][ref2], betreffende intern gemelde incidenten,
      behoudens die met betrekking tot een calamiteit of geweld in de zorgrelatie, kunnen niet in een civielrechtelijke,
      strafrechtelijke, bestuursrechtelijke of tuchtrechtelijke procedure als bewijs worden gebruikt, noch kan een
      disciplinaire maatregel, een bestuurlijke sanctie of een bestuurlijke maatregel daarop worden gebaseerd. In
      afwijking van de eerste volzin kunnen de gegevens voor het strafrechtelijk bewijs worden gebruikt indien zij
      redelijkerwijs niet op een andere manier kunnen worden verkregen.

      7 De gegevens in het register, bedoeld in [artikel 7, tweede lid][ref3], betreffende intern gemelde incidenten,
      zijn niet openbaar.

      8 De zorgaanbieder die zorg draagt voor een register als bedoeld in [artikel 7, tweede lid][ref4], is de
      verwerkingsverantwoordelijke als bedoeld in artikel 4 van de Algemene verordening gegevensbescherming voor dat
      register.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7
