  - number: '10'
    text: |-
      1 De zorgaanbieder verstrekt de cliёnt, teneinde hem in staat te stellen een weloverwogen keuze te maken tussen
      verschillende zorgaanbieders, op diens verzoek informatie over de door zorgaanbieder aangeboden zorg, waaronder
      begrepen de tarieven en de kwaliteit, alsmede over de ervaringen van cliënten met die zorg.

      2 De zorgaanbieder informeert de cliënt voorts over het al dan niet bestaan van een wetenschappelijk bewezen
      werkzaamheid van die zorg alsmede over de wachttijd.

      3 De zorgaanbieder doet aan een cliёnt, alsmede een vertegenwoordiger van de cliënt dan wel een nabestaande van de
      overleden cliënt, onverwijld mededeling van de aard en toedracht van incidenten bij de zorgverlening aan de cliёnt
      die voor de cliёnt merkbare gevolgen hebben of kunnen hebben en maakt van de aard en toedracht van incidenten
      aantekening in het dossier van de cliënt. Tevens wordt aantekening gemaakt van het tijdstip waarop het incident
      heeft plaatsgevonden en de namen van de betrokkenen bij het incident. Daarbij licht de zorgaanbieder de cliënt
      tevens in over de mogelijkheden om de gevolgen van het incident weg te nemen of te beperken.

      4 Op verzoek van de cliënt informeert de zorgaanbieder de cliënt over de rechten die uit deze wet voor hem
      voortvloeien.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel10
  - number: '11'
    text: |-
      1 De zorgaanbieder doet bij de inspectie onverwijld melding van:

      a. iedere calamiteit die bij de zorgverlening heeft plaatsgevonden;

      b. geweld in de zorgrelatie;

      c. de opzegging, ontbinding of niet-voortzetting van een overeenkomst als bedoeld in
      [artikel 4, eerste lid, onderdeel b][ref1], met een zorgverlener op grond van zijn oordeel dat de zorgverlener
      ernstig is tekort geschoten in zijn functioneren.

      2 De zorgaanbieder en de zorgverleners die zorg verlenen aan zijn cliënten, verstrekken bij en naar aanleiding
      van een melding als bedoeld in het eerste lid aan de ingevolge deze wet met toezicht belaste ambtenaar de
      gegevens, daaronder begrepen persoonsgegevens, gegevens over gezondheid als bedoeld in artikel 4, onderdeel
      15 van de Algemene verordening gegevensbescherming en andere bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld [paragraaf 3.1][ref2] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref3], die voor het onderzoeken van
      de melding noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref3]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
