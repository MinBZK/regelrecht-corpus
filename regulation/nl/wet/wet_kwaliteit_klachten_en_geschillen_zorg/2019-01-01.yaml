    text: |-
      1 De [Wet klachtrecht cliënten zorgsector][ref1] wordt ingetrokken.

      2 De [Wet klachtrecht cliënten zorgsector][ref2] blijft van toepassing met betrekking tot klachten, die voor
      het tijdstip van inwerkingtreding van het eerste lid zijn ingediend bij een klachtencommissie als bedoeld in
      [artikel 2 van die wet][ref3].

      3 Binnen een jaar na het tijdstip van inwerkingtreding van de hierna genoemde bepalingen draagt de zorgaanbieder
      zorg voor:

      a. vaststelling van een regeling als bedoeld in [artikel 13, eerste lid][ref4];

      b. aansluiting bij een geschilleninstantie als bedoeld in [artikel 18, eerste lid][ref5].

      4 Tot het tijdstip waarop een regeling als bedoeld in [artikel 13, eerste lid][ref6], van kracht is geworden,
      blijft een regeling, vastgesteld op grond van [artikel 2 van de Wet klachtrecht cliënten zorgsector][ref7], van
      toepassing op de behandeling van klachten.

      5 Een mededeling als bedoeld in [artikel 2, vijfde lid, onderdeel van de Wet klachtrecht cliënten zorgsector][ref8]
      wordt voor de toepassing van [artikel 21, eerste lid][ref9], gelijkgesteld aan een mededeling als bedoeld in
      [artikel 17, eerste lid][ref10].


