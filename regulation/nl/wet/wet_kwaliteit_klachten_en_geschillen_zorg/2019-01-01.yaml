  - number: '13'
    text: |-
      1 De zorgaanbieder treft, rekening houdende met de aard van de zorg en de categorie van cliënten waaraan zorg wordt
      verleend, schriftelijk een regeling voor een effectieve en laagdrempelige opvang en afhandeling van hem betreffende
      klachten, die voldoet aan het bepaalde in deze paragraaf.

      2 De zorgaanbieder stelt de regeling vast in overeenstemming met een representatief te achten organisatie van
      cliënten.

      3 Het tweede lid is niet van toepassing voor zover de regeling betrekking heeft op een instelling en de
      zorgaanbieder met betrekking tot de regeling voor die instelling op grond van enige wettelijke bepaling het advies
      of de instemming van een cliёntenraad moet verkrijgen.

      4 De zorgaanbieder brengt de regeling, alsmede een wijziging daarvan, op een daarvoor geschikte wijze onder de
      aandacht van de cliënten en vertegenwoordigers van cliёnten.

      5 Bij of krachtens algemene maatregel van bestuur worden eisen gesteld waaraan een regeling als bedoeld in het
      eerste lid in ieder geval moet voldoen.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel13
  - number: '14'
    text: |-
      1 Over een gedraging jegens een cliënt in het kader van de zorgverlening kan schriftelijk een klacht worden
      ingediend door de cliënt, een nabestaande van de overleden cliënt dan wel een vertegenwoordiger van de cliënt.

      2 Voorts kan over de weigering van de zorgaanbieder om een persoon in het kader van de zorgverlening als
      vertegenwoordiger van een cliёnt te beschouwen, door die persoon schriftelijk een klacht worden ingediend.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel14
  - number: '15'
    text: |-
      1 De zorgaanbieder wijst een of meer daartoe geschikt te achten personen aan die een klager op diens verzoek gratis
      van advies dienen met betrekking tot de indiening van een klacht en bijstaan bij het formuleren van de klacht en
      het onderzoeken van de mogelijkheden om tot een oplossing voor de klacht te komen.

      2 De zorgaanbieder waarborgt dat een aangewezen persoon als bedoeld in het eerste lid, indien deze in dienst is van
      de zorgaanbieder, zijn functie onafhankelijk kan uitvoeren en benadeelt hem niet wegens de wijze waarop hij zijn
      functie uitoefent.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel15
  - number: '16'
    text: |-
      1 Een klacht wordt zorgvuldig onderzocht.

      2 De behandeling van een klacht is gericht op het bereiken van een voor de klager en de zorgaanbieder bevredigende
      oplossing.

      3 De klager wordt op de hoogte gehouden van de voortgang van de behandeling van de klacht.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel16
  - number: '17'
    text: |-
      1 De klager ontvangt zo spoedig mogelijk, doch uiterlijk binnen zes weken na indiening van de klacht, een
      schriftelijke mededeling van de zorgaanbieder waarin met redenen omkleed is aangegeven tot welk oordeel het
      onderzoek van de klacht heeft geleid, welke beslissingen de zorgaanbieder over en naar aanleiding van de klacht
      heeft genomen en binnen welke termijn maatregelen waartoe is besloten, zullen zijn gerealiseerd.

      2 Indien het vereiste zorgvuldige onderzoek van een klacht daartoe naar het oordeel van de zorgaanbieder noodzaakt,
      kan de zorgaanbieder de in het eerste lid genoemde termijn met ten hoogste vier weken verlengen. De zorgaanbieder
      doet daarvan voor het verstrijken van de termijn schriftelijk mededeling aan de klager.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel17
  - number: '18'
    text: |-
      1 De zorgaanbieder is aangesloten bij een geschilleninstantie, die voldoet aan het bepaalde in deze paragraaf.

      2 Een geschilleninstantie is erkend door Onze Minister.

      3 Bij regeling van Onze Minister worden regels gesteld over de erkenning van een geschilleninstantie als bedoeld in
      het tweede lid.

      4 Bij regeling van Onze Minister van Defensie, in overeenstemming met Onze Minister, worden nadere regels gesteld
      aan de geschilleninstantie waarbij hij is aangesloten teneinde de deskundigheid inzake de militaire gezondheidszorg
      te waarborgen.

      5 De zorgaanbieder brengt de mogelijkheid om geschillen aan de geschilleninstantie voor te leggen alsmede een
      wijziging daarin, op daarvoor geschikte wijze onder de aandacht van de cliënten en vertegenwoordigers van cliёnten.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel18
  - number: '19'
    text: |-
      1 De geschilleninstantie heeft tot taak geschillen over gedragingen van een zorgaanbieder jegens een cliënt in het
      kader van de zorgverlening te beslechten.

      2 De geschilleninstantie is ingesteld door een of meer representatief te achten cliëntenorganisaties en door een of
      meer representatief te achten organisaties van zorgaanbieders.

      3 De geschilleninstantie oefent haar werkzaamheden uit op basis van een schriftelijke regeling, die waarborgt dat
      wordt voldaan aan het bepaalde in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel19
  - number: '20'
    text: |-
      De geschilleninstantie is bevoegd over een geschil een uitspraak te doen bij wege van bindend advies, alsmede een
      vergoeding van geleden schade toe te kennen tot in ieder geval € 25.000,–.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel20
  - number: '21'
    text: |-
      1 Een geschil met een zorgaanbieder kan schriftelijk ter beslechting aan de geschilleninstantie worden voorgelegd
      door een cliënt, een nabestaande van een overleden cliënt dan wel een vertegenwoordiger van de cliënt, indien:

      a. is gehandeld in strijd met [§1][ref1];

      b. de mededeling, bedoeld in [17, eerste lid][ref2], diens klacht naar zijn oordeel in onvoldoende mate wegneemt;

      c. van hem in redelijkheid niet kan worden verlangd dat hij onder de gegeven omstandigheden zijn klacht over een
      hem betreffende gedraging van de zorgaanbieder in het kader van de zorgverlening bij de zorgaanbieder indient.

      2 Een geschil kan voorts schriftelijk ter beslechting aan de geschilleninstantie worden voorgelegd door een persoon
      die door de zorgaanbieder ten onrechte niet als vertegenwoordiger is beschouwd, indien de mededeling, bedoeld in
      [artikel 17, eerste lid][ref3], diens klacht naar zijn oordeel in onvoldoende mate wegneemt.

      3 Voorts kan een geschil schriftelijk ter beslechting aan de geschilleninstantie worden voorgelegd door een
      stichting of vereniging met volledige rechtsbevoegdheid, mits een belang in het geding is dat de stichting of
      vereniging volgens haar statuten behartigt.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel17
