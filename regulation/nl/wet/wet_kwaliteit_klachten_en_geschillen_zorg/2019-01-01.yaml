  - number: '12'
    text: |-
      1 Onze Minister houdt een openbaar register in stand, waarin hij van alle zorgaanbieders de volgende gegevens
      opneemt:

      a. de naam of een andere aanduiding;

      b. de rechtsvorm;

      c. het Handelsregisternummer;

      d. het adres van vestiging;

      e. het adres of de adressen waarop of van waaruit de zorg wordt verleend;

      f. de vormen van zorg die worden verleend.

      2 Onze Minister draagt zorg dat het register, de op grond van
      [artikel 38 van de Wet marktordening gezondheidszorg][ref1] openbaar gemaakte informatie, het register, bedoeld
      in [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref2], de gegevens, bedoeld in de
      [artikelen 15][ref3] en [16 van de Wet toelating zorginstellingen][ref4] en de informatie over de kwaliteit van de
      verleende zorg, bedoeld in [artikel 66d van de Zorgverzekeringswet][ref5], in onderling verband zijn in te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0018906#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel66d
