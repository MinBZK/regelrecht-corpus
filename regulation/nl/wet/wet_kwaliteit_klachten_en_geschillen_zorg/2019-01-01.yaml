      1 Onze Minister is, in voorkomend geval in overeenstemming met Onze Minister wie het mede aangaat, bevoegd tot
      toepassing van bestuursdwang ter handhaving van het bepaalde bij of krachtens de [artikelen 13 tot en met 23][ref1]
      dan wel een krachtens [artikel 27][ref2] of [artikel 28][ref3] gegeven aanwijzing of bevel.

      2 Onze Minister is bevoegd een last onder dwangsom op te leggen aan de zorgaanbieder en de zorgverlener die
      geen gegevens verstrekken als bedoeld in de [artikelen 7b, tweede lid][ref4], en [11, tweede lid][ref5], of geen
      medewerking verleent aan de inzage van dossiers als bedoeld in [artikel 24, vierde lid][ref6].


