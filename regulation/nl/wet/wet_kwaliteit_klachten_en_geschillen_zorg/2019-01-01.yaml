  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de bij de maatregel aangewezen categorieën
      van zorgaanbieders:

      a. regels worden gesteld met betrekking tot het gebruik en periodieke kwaliteits- en veiligheidscontroles van bij
      of krachtens die maatregel aan te wijzen apparatuur die bij de zorgverlening wordt gebruikt, alsmede

      b. indien het kwaliteitsniveau van de zorg dit vereist, de bij de [artikelen 2, eerste lid][ref1], en [3][ref2]
      gestelde regels nader worden omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel3
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel5
