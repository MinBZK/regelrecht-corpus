  - number: '6'
    text: |-
      De zorgaanbieder die zorg verleent welke verblijf van de cliënt in een accommodatie gedurende het etmaal met zich
      brengt, draagt er zorg voor dat:

      a. geestelijke verzorging beschikbaar is, die zoveel mogelijk aansluit bij de godsdienst of levensovertuiging van
      de cliënt;

      b. voor zover het gaat om zorg als omschreven bij of krachtens de [Wet langdurige zorg][ref1], bij het opstellen
      van een huisvestingsplan voor de lange termijn, een ingrijpende verbouwing, nieuwbouw of verhuizing van een
      accommodatie, onderzoek wordt gedaan naar de leefwensen van de betrokken cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '7'
    text: |-
      1 De zorgaanbieder draagt zorg voor systematische bewaking, beheersing en verbetering van de kwaliteit van de zorg.

      2 De verplichting van het eerste lid houdt, de aard en omvang van de zorgverlening in aanmerking genomen, in:

      a. het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de zorg op
      zodanige wijze dat de gegevens voor eenieder vergelijkbaar zijn met gegevens van andere zorgaanbieders van dezelfde
      categorie;

      b. het aan de hand van de gegevens, bedoeld in onderdeel a, op systematische wijze toetsen of de wijze van
      uitvoering van [artikel 3][ref1] leidt tot goede zorg;

      c. het op basis van de uitkomst van de toetsing, bedoeld in onderdeel b, zo nodig veranderen van de wijze waarop
      [artikel 3][ref2] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel3
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel7
