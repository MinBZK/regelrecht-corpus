  - number: '28'
    text: |-
      1 Indien Onze Minister van oordeel is dat de organisatiestructuur van de zorgaanbieder in ernstige mate afbreuk
      doet aan het verlenen van goede zorg als bedoeld in [artikel 2][ref1], kan hij de aanwijzing, bedoeld in
      [artikel 27, eerste lid][ref2], in de vorm van een structurele maatregel aan de zorgaanbieder opleggen teneinde
      voortgaande inbreuk op de kwaliteit van de zorgverlening te voorkomen.

      2 Onze Minister geeft een aanwijzing als bedoeld in het eerste lid niet:

      a. dan nadat op diens verzoek over de bedrijfskundige gevolgen van de voorgenomen aanwijzing voor de zorgaanbieder
      een rapport als bedoeld in [artikel 21, eerste lid, van de Wet marktordening gezondheidszorg][ref3] is uitgebracht
      door de in dat artikel bedoelde zorgautoriteit, en

      b. indien het doel om voortgaande inbreuk op de kwaliteit van zorgverlening te voorkomen door middel van een even
      effectieve, voor de zorgaanbieder minder belastende maatregel kan worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel27
