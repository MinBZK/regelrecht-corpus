  - number: '26'
    text: |-
      1 De inspectie en de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref1],
      verstrekken elkaar desgevraagd de voor de uitoefening van hun taak benodigde inlichtingen en gegevens, alsmede
      inzage van zakelijke gegevens en bescheiden, voor zover dat voor de invulling van die taak redelijkerwijs nodig is.

      2 De inspectie verstrekt de Autoriteit persoonsgegevens de gegevens en inlichtingen die van belang kunnen zijn voor
      de uitoefening van diens wettelijke taken.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '27'
    text: |-
      1 Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens de [artikelen 2][ref1], [3][ref2],
      [4, eerste lid, onderdelen a en b][ref3], en [5 tot en met 10][ref4] niet wordt nageleefd, kan hij, in voorkomend
      geval in overeenstemming met Onze Minister wie het mede aangaat, de zorgaanbieder een schriftelijke aanwijzing
      geven.

      2 In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens de
      [artikelen 2][ref5], [3][ref6], [4, eerste lid, onderdelen a en b][ref7], en [5 tot en met 10][ref8] niet wordt
      nageleefd, alsmede de in verband daarmee te nemen maatregelen.

      3 Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder er aan moet voldoen.

      4 Indien het nemen van maatregelen in verband met gevaar voor de veiligheid of de gezondheid redelijkerwijs
      geen uitstel kan lijden, kan de met het toezicht belaste ambtenaar een schriftelijk bevel geven. In voorkomend
      geval wordt daarvan onverwijld mededeling gedaan aan Onze Minister wie het mede aangaat. Het bevel heeft een
      geldigheidsduur van zeven dagen, welke door Onze Minister, in voorkomend geval in overeenstemming met Onze Minister
      wie het mede aangaat, kan worden verlengd.

      5 De zorgaanbieder is verplicht binnen de daarbij gestelde termijn aan de aanwijzing onderscheidenlijk onmiddellijk
      aan het bevel te voldoen.

      6 De bevoegdheid tot het verlengen van de geldigheidsduur van een bevel wordt niet gemandateerd aan een ambtenaar
      van de inspectie.


