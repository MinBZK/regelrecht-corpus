  - number: '2'
    text: |-
      1 De zorgaanbieder biedt goede zorg aan.

      2 Onder goede zorg wordt verstaan zorg van goede kwaliteit en van goed niveau:

      a. die in ieder geval veilig, doeltreffend, doelmatig en cliëntgericht is, tijdig wordt verleend, en is afgestemd
      op de reële behoefte van de cliënt,

      b. waarbij zorgverleners handelen in overeenstemming met de op hen rustende verantwoordelijkheid,
      voortvloeiende uit de professionele standaard, waaronder de kwaliteitsstandaard, bedoeld in
      [artikel 1, onderdeel z, van de Zorgverzekeringswet][ref1], en

      c. waarbij de rechten van de cliënt zorgvuldig in acht worden genomen en de cliënt ook overigens met respect wordt
      behandeld.

      3 In afwijking van het eerste lid verleent een alternatieve-zorgaanbieder slechts zorg die buiten noodzaak niet
      leidt tot schade of een aanmerkelijke kans op schade voor de gezondheid van de cliënt, waarbij de rechten van de
      cliënt zorgvuldig in acht worden genomen en de cliënt ook overigens met respect wordt behandeld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
  - number: '3'
    text: |-
      De zorgaanbieder organiseert de zorgverlening op zodanige wijze, bedient zich zowel kwalitatief als kwantitatief
      zodanig van personele en materiële middelen en, voor zover nodig, bouwkundige voorzieningen en, indien hij een
      instelling is, draagt tevens zorg voor een zodanige toedeling van verantwoordelijkheden, bevoegdheden alsmede
      afstemmings- en verantwoordingsplichten, dat een en ander redelijkerwijs moet leiden tot het verlenen van goede
      zorg.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel3
  - number: '4'
    text: |-
      1 Indien de zorgaanbieder een instelling is:

      a. vergewist hij zich ervan dat de wijze waarop zorgverleners die zorg verlenen aan zijn cliënten, in het verleden
      hebben gefunctioneerd, niet in de weg staat aan het inzetten van de zorgverleners bij het verlenen van zorg;

      b. doet hij slechts zorg verlenen door zorgverleners of opdrachtnemers met wie hij, tenzij sprake is van een
      privaatrechtelijke of publiekrechtelijke dienstbetrekking, een schriftelijke overeenkomst heeft gesloten die
      waarborgt dat zij zich bij hun werkzaamheden laten leiden door de op de zorgaanbieder rustende wettelijke
      verplichtingen en de regels die de zorgaanbieder heeft vastgesteld omtrent de zorgverlening.

      2 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de situaties waarin een
      zorgaanbieder die een instelling is, in het bezit moet zijn van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] voor de zorgverleners die zorg verlenen aan
      zijn cliënten en voor andere personen dan zorgverleners die beroepsmatig met zijn cliënten in contact kunnen komen
      en over de eisen die aan die verklaring kunnen worden gesteld.

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de situaties waarin een
      zorgaanbieder die een solistisch werkende zorgverlener is, in het bezit moet zijn van een verklaring omtrent het
      gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref2].

      4 Een overeenkomst als bedoeld in het eerste lid, onderdeel b, treedt niet in de verantwoordelijkheid van de
      zorgverlener die voortvloeit uit de voor deze geldende professionele standaard.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0014194#Artikel28
