  - number: '25'
    text: |-
      1 De in [artikel 24][ref1] bedoelde ambtenaren onderzoeken meldingen van aanbieders en zorgverleners als bedoeld
      in [artikel 11][ref2] en andere meldingen, teneinde vast te stellen of sprake is van een situatie die voor de
      veiligheid van cliënten of de zorg een ernstige bedreiging kan betekenen, of met het oog op het belang van een
      goede zorg anderszins noodzaakt tot nader onderzoek.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:

      a. de wijze waarop een melding wordt gedaan en de gegevens, die de melding ten minste bevat;

      b. de wijze waarop een melding wordt onderzocht, en de termijnen waarbinnen aan de melder en andere betrokkenen
      schriftelijk wordt medegedeeld dat de melding nader wordt onderzocht dan wel niet nader wordt onderzocht dan wel
      wat de uitkomst van het onderzoek is;

      c. de wijze waarop de inspectie de zorgaanbieder op zijn verzoek informeert of is vastgesteld dat er sprake is van
      een situatie als bedoeld in het eerste lid;

      d. de gevallen waarin nader onderzoek van een melding achterwege blijft;

      e. de wijze waarop het onderzoek, buiten de gevallen, bedoeld onder d, wordt afgesloten en daarover informatie
      wordt verstrekt aan de melder en andere betrokkenen.

      3 Voor zover bij het onderzoeken van een melding gegevens van een cliënt ter beschikking van de inspectie zijn
      gekomen, ter zake waarvan de betrokken zorgverlener uit hoofde van zijn beroep tot geheimhouding verplicht is,
      geldt gelijke verplichting voor de ambtenaren van de inspectie jegens anderen dan de cliënt.

      4 Indien de inspectie vaststelt dat sprake is van een van de in het eerste lid bedoelde situaties, neemt hij
      passende maatregelen, het in kennis stellen van justitiële autoriteiten daaronder begrepen.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel25
