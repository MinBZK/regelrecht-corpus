  - number: '22'
    text: |-
      1 De geschilleninstantie doet uiterlijk binnen zes maanden na de voorlegging van het geschil uitspraak.

      2 In gevallen waarin dat, gelet op de aard van het geschil en de daarbij betrokken belangen, aangewezen is te
      achten, doet de geschilleninstantie in afwijking van het eerste lid op korte termijn een uitspraak.

      3 De geschilleninstantie maakt de uitspraken over de aan haar voorgelegde geschillen openbaar in zodanige vorm dat
      deze niet tot personen herleidbaar zijn, behoudens voor zover het de zorgaanbieder betreft.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel22
  - number: '23'
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit hoofdstuk en daarbij de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde
      van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht
      tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit
      zijn taak bij de uitvoering van dit hoofdstuk de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#Artikel23
  - number: '24'
    text: |-
      1 De ambtenaren van de inspectie zijn belast met het toezicht op de naleving van hetgeen bij of krachtens de
      [artikelen 2 tot en met 11][ref1] en [13 tot en met 23][ref2], dan wel in een aanwijzing of bevel als bedoeld in
      [artikel 27][ref3] of [artikel 28][ref4] is bepaald. Zij rapporteren daaromtrent aan Onze Minister.

      2 Het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 2][ref5] en [3][ref6] is mede
      gericht op het bevorderen van het gebruik van standaarden door zorgaanbieders en zorgverleners.

      3 De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, voor zover de woning deel uitmaakt van een bouwkundige
      voorziening voor het verlenen van zorg.

      4 De in het eerste lid bedoelde ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is
      en in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref7], bevoegd tot inzage van de
      dossiers van cliënten. Voor zover de betrokken zorgverlener uit hoofde van zijn beroep tot geheimhouding van het
      dossier verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.

      5 De in het eerste lid bedoelde ambtenaren zijn bevoegd het niet naleven door een zorgaanbieder van een
      verplichting die voor hem uit het bepaalde bij of krachtens deze wet voortvloeit, buiten behandeling te laten,
      tenzij sprake is van een situatie die voor de veiligheid van cliënten of de zorg een ernstige bedreiging kan
      betekenen, of het belang van goede zorg anderszins daaraan redelijkerwijs in de weg staat.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel13
