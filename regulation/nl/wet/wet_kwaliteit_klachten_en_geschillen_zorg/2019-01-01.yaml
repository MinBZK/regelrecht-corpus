preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is regels te stellen ten aanzien van de kwaliteit van
    zorg en de positie van cliënten in de zorg te versterken door regels te stellen ter bevordering van een effectieve
    behandeling van klachten door of vanwege zorgaanbieders en een met waarborgen omklede en onafhankelijke behandeling
    van geschillen tussen zorgaanbieders en cliënten;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037173/2019-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *accommodatie:* een door een zorgaanbieder voor het leveren van zorg bestemde ruimte;
        - *alternatieve-zorgaanbieder:* een solistisch werkende, niet-geregistreerde zorgverlener die andere zorg levert,
      dan wel een instelling die uitsluitend door niet-geregistreerde zorgverleners andere zorg doet verlenen;
        - *andere zorg:* handelingen op het gebied van de individuele gezondheidszorg als bedoeld in
      [artikel 1 van de Wet op de beroepen in de individuele gezondheidszorg][ref1], niet zijnde Wlz-zorg of Zvw-zorg,
      alsmede handelingen met een ander doel dan het bevorderen of bewaken van de gezondheid van de cliënt;
        - *calamiteit:* een niet-beoogde of onverwachte gebeurtenis, die betrekking heeft op de kwaliteit van de zorg en
      die tot de dood van een cliënt of een ernstig schadelijk gevolg voor een cliënt heeft geleid;
        - *cliënt:* een natuurlijke persoon die zorg vraagt of aan wie zorg wordt verleend;
        - *dossier:* de schriftelijk of elektronisch vastgelegde gegevens met betrekking tot de verlening van zorg aan
      een cliёnt;
        - *geweld in de zorgrelatie:* seksueel binnendringen van het lichaam van of ontucht met een cliënt, alsmede
      geweld jegens een cliënt, door iemand die in dienst of in opdracht van een instelling of opdrachtnemer van een
      instelling werkzaam is, dan wel door een andere cliënt met wie de cliënt gedurende het etmaal of een dagdeel in een
      accommodatie van een instelling verblijft;
        - *huiselijk geweld:* huiselijk geweld als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref2];
        - *huiselijke kring:* een familielid, een huisgenoot, de echtgenoot of voormalig echtgenoot of een mantelzorger;
        - *implantaat:* een implanteerbaar hulpmiddel als bedoeld in Bijlage IX van [Richtlijn 93/42/EEG](31993L0042) van
      de Raad van 14 juni 1993 betreffende medische hulpmiddelen (PbEG 1993, L 169);
        - *inspectie:* de Inspectie gezondheidszorg en jeugd;
        - *instelling:* een rechtspersoon die bedrijfsmatig zorg verleent, een organisatorisch verband van natuurlijke
      personen die bedrijfsmatig zorg verlenen of doen verlenen, alsmede een natuurlijke persoon die bedrijfsmatig zorg
      doet verlenen;
        - *kindermishandeling:* kindermishandeling als bedoeld in [artikel 1.1 van de Jeugdwet][ref3];
        - *klager:* de persoon die een klacht heeft ingediend;
        - *melding:* een schriftelijk of elektronisch bericht over: 1°. het functioneren van de zorg of de
      kwaliteitsborging van een aanbieder; 2°. het professioneel functioneren van een zorgverlener; 3°. een product of
      apparaat dat toepassing vindt in de zorg, of het handelen van het bij dat product of apparaat betrokken bedrijf;
        - *nabestaande:* a. de niet van tafel en bed gescheiden echtgenoot en de geregistreerde partner van de overledene;
      b. andere bloed- of aanverwanten van de overledene, mits deze reeds ten tijde van het overlijden geheel of ten
      dele in hun levensonderhoud voorzag of daartoe krachtens rechterlijke uitspraak verplicht was; c. degene die
      reeds vóór de gebeurtenis waarop de aansprakelijkheid berust, met de overledene in gezinsverband samenwoonde en
      in wier levensonderhoud hij geheel of voor een groot deel voorzag, voor zover aannemelijk is dat een en ander
      zonder het overlijden zou zijn voortgezet; d. degene die met de overledene in gezinsverband samenwoonde en in wiens
      levensonderhoud de overledene bijdroeg door het doen van de gemeenschappelijke huishouding; e. bloedverwanten van
      de overledene in de eerste graad en in de tweede graad in de zijlijn;
        - *niet-geregistreerde zorgverlener:* een zorgverlener die niet staat ingeschreven in een register als bedoeld in
      [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref4], noch een beroep uitoefent waarvan de
      opleiding krachtens [artikel 34, eerste lid, van die wet][ref5] is geregeld of aangewezen;
        - *Onze Minister:* Onze Minister van Volksgezondheid, Welzijn en Sport;
        - *solistisch werkende zorgverlener:* een zorgverlener die, anders dan in dienst of onmiddellijk of middellijk in
      opdracht van een instelling beroepsmatig zorg verleent;
        - *vertegenwoordiger:* de persoon of personen die een zorgaanbieder op grond van enige wettelijke bepaling in
      plaats van of naast de cliënt moet betrekken bij de nakoming van verplichtingen jegens de cliënt;
        - *Wlz-zorg:* zorg of dienst als omschreven bij of krachtens de [Wet langdurige zorg][ref6];
        - *zorg:* Wlz-zorg, Zvw-zorg en andere zorg;
        - *zorgaanbieder:* een instelling dan wel een solistisch werkende zorgverlener;
        - *zorgverlener:* een natuurlijke persoon die beroepsmatig zorg verleent.
        - *Zvw-zorg:* zorg of dienst als omschreven bij of krachtens de Zorgverzekeringswet.

      2 Als zorg in de zin van deze wet wordt aangemerkt zorg en andere diensten, voor de kosten
      waarvan een subsidie wordt verstrekt op grond van de [artikelen 3.3.3][ref7], [10.1.4][ref8], of
      [11.1.5, eerste lid, van de Wet langdurige zorg][ref9].

      3 Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat deze wet niet van toepassing is ten
      aanzien van doventolkzorg, farmaceutische zorg, hulpmiddelenzorg, verstrekking van verpleegartikelen en vervoer als
      omschreven bij of krachtens de [Zorgverzekeringswet][ref10] of de [Wet langdurige zorg][ref11].

      4 Op zorg voor zover deze betreft handelingen ter beoordeling van de gezondheidstoestand of medische
      begeleiding van een cliënt, verricht in opdracht van een ander dan die cliënt in verband met de vaststelling
      van aanspraken of verplichtingen, de toelating tot een verzekering of voorziening, of de beoordeling van
      de geschiktheid voor een opleiding, een arbeidsverhouding of de uitvoering van bepaalde werkzaamheden, zijn
      [artikel 10, eerste en tweede lid][ref12], en [hoofdstuk 3][ref13] niet van toepassing.

      5 Een instelling die binnen het kader van de binnen een andere instelling verleende zorg een deel van die zorg
      verleent, wordt niet aangemerkt als instelling in de zin van deze wet.

      6 Indien een instelling wordt gevormd door een organisatorisch verband van natuurlijke personen, richten de uit
      deze wet voortvloeiende verplichtingen zich tot ieder van die personen.

      7 Een zorgverzekeraar als bedoeld in[ artikel 1 van de Zorgverzekeringswet][ref14] of
      [artikel 1.1.1 van de Wet langdurige zorg][ref15] is voor de toepassing van deze wet slechts zorgaanbieder voor
      zover hij zorg doet verlenen door zorgverleners die bij hem in dienst zijn.


