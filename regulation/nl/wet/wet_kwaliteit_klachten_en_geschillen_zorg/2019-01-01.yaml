  - number: '30'
    text: |-
      1 Onze Minister is, in voorkomend geval in overeenstemming met Onze Minister wie het mede aangaat, bevoegd een
      bestuurlijke boete van ten hoogste € 33.500,– op te leggen ter zake van een handelen of nalaten in strijd met de
      [artikelen 7b, eerste tot en met derde lid][ref1], of [11, eerste lid][ref2], of het bepaalde bij of krachtens een
      algemene maatregel van bestuur als bedoeld in [artikel 4, tweede of derde lid][ref3].

      2 Degene die handelt of nalaat in strijd met [artikel 11, eerste lid][ref4], of het bepaalde bij of krachtens een
      algemene maatregel van bestuur als bedoeld in [artikel 4, tweede of derde lid][ref5], wordt gestraft met hechtenis
      van ten hoogste een jaar of een geldboete van de derde categorie.

      3 Het in het tweede lid strafbaar gestelde feit is een overtreding.


