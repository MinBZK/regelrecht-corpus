        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '30.3'
    text: Het in het tweede lid strafbaar gestelde feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel30
  - number: '31.1'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel31
  - number: '31.2'
    text: |-
      Onze Minister zendt binnen vier jaar na de inwerkingtreding van [artikelen 1, achtste lid][ref1],
      [11b, derde lid][ref2], [11c][ref3], [11d][ref4], [11e][ref5] aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van die paragraaf in de praktijk. In het bijzonder wordt hierbij aandacht
      geschonken aan de gevolgen voor de Wlz-zorg en Zvw-zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11b
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel11c
      [ref4]: https://wetten.overheid.nl/BWBR0037173#Artikel11d
