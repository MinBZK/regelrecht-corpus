  - number: '53'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel53
  - number: '54'
    text: 'Deze wet wordt aangehaald als: Wet kwaliteit, klachten en geschillen zorg.'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel54
