        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: '24'
        hoofdstuk: '4'
  - number: '30.1'
    text: |-
      Onze Minister is, in voorkomend geval in overeenstemming met Onze Minister wie het mede aangaat, bevoegd een
      bestuurlijke boete van ten hoogste € 33.500,– op te leggen ter zake van een handelen of nalaten in strijd met de
      [artikelen 7b, eerste tot en met derde lid][ref1], of [11, eerste lid][ref2], of het bepaalde bij of krachtens een
      algemene maatregel van bestuur als bedoeld in [artikel 4, tweede of derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel4
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 7b
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
