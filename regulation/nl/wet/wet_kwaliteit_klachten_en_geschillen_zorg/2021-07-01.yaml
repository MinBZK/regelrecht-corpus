      - id: ref3
        bwb_id: BWBR0035917
        artikel: '11'
  - number: '1.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald dat deze wet niet van toepassing is ten aanzien
      van doventolkzorg, farmaceutische zorg, hulpmiddelenzorg, verstrekking van verpleegartikelen en vervoer als
      omschreven bij of krachtens de [Zorgverzekeringswet][ref1] of de [Wet langdurige zorg][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0035917
  - number: '1.4'
    text: |-
      Op zorg voor zover deze betreft handelingen ter beoordeling van de gezondheidstoestand of medische begeleiding
      van een cliënt, verricht in opdracht van een ander dan die cliënt in verband met de vaststelling van
      aanspraken of verplichtingen, de toelating tot een verzekering of voorziening, of de beoordeling van de
      geschiktheid voor een opleiding, een arbeidsverhouding of de uitvoering van bepaalde werkzaamheden, zijn
      [artikel 10, eerste en tweede lid][ref1], en [hoofdstuk 3][ref2] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        hoofdstuk: '3'
  - number: '1.5'
    text: |-
      Deze wet is niet van toepassing in justitiële inrichtingen en instellingen voor de verpleging van ter beschikking
      gestelden voor zover daar een bijzondere wettelijke regeling geldt of de justitiële setting zich daartegen verzet.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: '1.6'
    text: |-
      Een instelling die binnen het kader van de binnen een andere instelling verleende zorg een deel van die zorg
      verleent, wordt niet aangemerkt als instelling in de zin van deze wet.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: '1.7'
    text: |-
      Indien een instelling wordt gevormd door een organisatorisch verband van natuurlijke personen, richten de uit deze
      wet voortvloeiende verplichtingen zich tot ieder van die personen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: '1.8'
    text: |-
      Een zorgverzekeraar als bedoeld in [artikel 1 van de Zorgverzekeringswet][ref1] of
      [artikel 1.1.1 van de Wet langdurige zorg][ref2] is voor de toepassing van deze wet slechts zorgaanbieder voor
      zover hij zorg doet verlenen door zorgverleners die bij hem in dienst zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel1
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035917
        artikel: '1'
  - number: '1.8'
    text: |-
      Een onderdeel van de professionele standaard respectievelijk een voorgedragen kwaliteitsstandaard heeft voor de
      toepassing van deze wet mogelijke substantiële financiële gevolgen voor de collectieve zorguitgaven indien:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: 1.8.a
    text: 'sprake is van:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: 1.8.a.1°
    text: een toename van het aantal in te zetten voltijdsequivalenten aan zorgverleners;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: 1.8.a.2°
    text: een verhoging van de kwalificaties van de in te zetten zorgverleners; of
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: 1.8.a.3°
    text: |-
      een nieuwe wijze van zorgverlening of een andere organisatie van het zorgproces waarbij bouwkundige, ruimtelijke,
      technische of organisatorische aanpassingen nodig zijn waarvoor een financiële investering nodig is; en
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: 1.8.b
    text: |-
      dat onderdeel respectievelijk die voorgedragen kwaliteitsstandaard breed toepasbaar is vanwege de vormen van zorg,
      het aantal zorgaanbieders of zorgverleners of cliënten waarop dat onderscheidenlijk die betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: '1.9'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de toepassing van het achtste lid. De
      voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
  - number: '2.1'
    text: De zorgaanbieder biedt goede zorg aan.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2
  - number: '2.2'
    text: 'Onder goede zorg wordt verstaan zorg van goede kwaliteit en van goed niveau:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2
  - number: 2.2.a
    text: |-
      die in ieder geval veilig, doeltreffend, doelmatig en cliëntgericht is, tijdig wordt verleend, en is afgestemd op
      de reële behoefte van de cliënt;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2
  - number: 2.2.b
    text: |-
      waarbij zorgaanbieders en zorgverleners handelen in overeenstemming met de op hen rustende verantwoordelijkheid,
      voortvloeiende uit de professionele standaard en de kwaliteitsstandaarden; en
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2
  - number: 2.2.c
    text: |-
      waarbij de rechten van de cliënt zorgvuldig in acht worden genomen en de cliënt ook overigens met respect wordt
      behandeld.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid verleent een alternatieve-zorgaanbieder slechts zorg die buiten noodzaak niet leidt
      tot schade of een aanmerkelijke kans op schade voor de gezondheid van de cliënt, waarbij de rechten van de cliënt
      zorgvuldig in acht worden genomen en de cliënt ook overigens met respect wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2
  - number: 2a.1
    text: |-
      Voor zover een onderdeel van de professionele standaard mogelijke substantiële financiële gevolgen
      voor de collectieve zorguitgaven heeft, hoeven zorgaanbieders en zorgverleners, in afwijking van
      [artikel 2, tweede lid, onderdeel b][ref1], uitsluitend te handelen in overeenstemming met dat onderdeel voor zover
      dat een kwaliteitsstandaard is.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2a.2
    text: |-
      Het eerste lid is niet van toepassing op die onderdelen van de professionele standaard die voor 5 juli 2018 al tot
      de professionele standaard behoorden.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2a
  - number: 2a.3
    text: |-
      Het Zorginstituut bevordert de eenduidige uitleg van de toepassing van het eerste lid op een onderdeel van de
      professionele standaard.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel2a
  - number: '3'
    text: |-
      De zorgaanbieder organiseert de zorgverlening op zodanige wijze, bedient zich zowel kwalitatief als kwantitatief
      zodanig van personele en materiële middelen en, voor zover nodig, bouwkundige voorzieningen en, indien hij een
      instelling is, draagt tevens zorg voor een zodanige toedeling van verantwoordelijkheden, bevoegdheden alsmede
      afstemmings- en verantwoordingsplichten, dat een en ander redelijkerwijs moet leiden tot het verlenen van goede
      zorg.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel3
  - number: 3a
    text: |-
      De zorgaanbieder behorend tot een van de daartoe bij algemene maatregel van bestuur aangewezen categorieën
      van zorgaanbieders voldoet aan de bij of krachtens algemene maatregel van bestuur te stellen eisen aan de
      beschikbaarheid en bereikbaarheid van acute zorg en de voorbereiding op het verlenen van die zorg die voor
      verschillende categorieën van aanbieders verschillend kunnen zijn.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel3a
  - number: '4.1'
    text: 'Indien de zorgaanbieder een instelling is:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel4
  - number: 4.1.a
    text: |-
      vergewist hij zich ervan dat de wijze waarop zorgverleners die zorg verlenen aan zijn cliënten, in het verleden
      hebben gefunctioneerd, niet in de weg staat aan het inzetten van de zorgverleners bij het verlenen van zorg;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel4
  - number: 4.1.b
    text: |-
      doet hij slechts zorg verlenen door zorgverleners of opdrachtnemers met wie hij, tenzij sprake is van een
      privaatrechtelijke of publiekrechtelijke dienstbetrekking, een schriftelijke overeenkomst heeft gesloten die
      waarborgt dat zij zich bij hun werkzaamheden laten leiden door de op de zorgaanbieder rustende wettelijke
      verplichtingen en de regels die de zorgaanbieder heeft vastgesteld omtrent de zorgverlening.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel4
  - number: '4.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de situaties waarin een
      zorgaanbieder die een instelling is, in het bezit moet zijn van een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1] voor de zorgverleners die zorg verlenen aan
      zijn cliënten en voor andere personen dan zorgverleners die beroepsmatig met zijn cliënten in contact kunnen komen
      en over de eisen die aan die verklaring kunnen worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '4.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de situaties waarin een
      zorgaanbieder die een solistisch werkende zorgverlener is, in het bezit moet zijn van een verklaring omtrent het
      gedrag als bedoeld in [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0014194#Artikel28
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0014194
        artikel: '28'
  - number: '4.4'
    text: |-
      Een overeenkomst als bedoeld in het eerste lid, onderdeel b, treedt niet in de verantwoordelijkheid van de
      zorgverlener die voortvloeit uit de voor deze geldende professionele standaard.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel4
  - number: '5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de bij de maatregel aangewezen categorieën
      van zorgaanbieders:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel5
  - number: 5.a
    text: |-
      regels worden gesteld met betrekking tot het gebruik en periodieke kwaliteits- en veiligheidscontroles van bij of
      krachtens die maatregel aan te wijzen apparatuur die bij de zorgverlening wordt gebruikt, alsmede
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel5
  - number: 5.b
    text: |-
      indien het kwaliteitsniveau van de zorg dit vereist, de bij de [artikelen 2, eerste lid][ref1], en [3][ref2]
      gestelde regels nader worden omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel3
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6'
    text: |-
      De zorgaanbieder die zorg verleent welke verblijf van de cliënt in een accommodatie gedurende het etmaal met zich
      brengt, draagt er zorg voor dat:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel6
  - number: 6.a
    text: |-
      geestelijke verzorging beschikbaar is, die zoveel mogelijk aansluit bij de godsdienst of levensovertuiging van
      de cliënt;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel6
  - number: 6.b
    text: |-
      voor zover het gaat om zorg als omschreven bij of krachtens de [Wet langdurige zorg][ref1], bij het opstellen
      van een huisvestingsplan voor de lange termijn, een ingrijpende verbouwing, nieuwbouw of verhuizing van een
      accommodatie, onderzoek wordt gedaan naar de leefwensen van de betrokken cliënten.


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: '7.1'
    text: De zorgaanbieder draagt zorg voor systematische bewaking, beheersing en verbetering van de kwaliteit van de zorg.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7
  - number: '7.2'
    text: 'De verplichting van het eerste lid houdt, de aard en omvang van de zorgverlening in aanmerking genomen, in:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7
  - number: 7.2.a
    text: |-
      het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de zorg op zodanige
      wijze dat de gegevens voor eenieder vergelijkbaar zijn met gegevens van andere zorgaanbieders van dezelfde
      categorie;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7
  - number: 7.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld in onderdeel a, op systematische wijze toetsen of de wijze van uitvoering
      van [artikel 3][ref1] leidt tot goede zorg;


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel3
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld in onderdeel b, zo nodig veranderen van de wijze waarop
      [artikel 3][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel3
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7a.1
    text: |-
      Onze Minister houdt een register in stand waarin ten behoeve van de bescherming van de gezondheid van cliënten
      gegevens worden verzameld over bij cliënten ingebrachte implantaten in overeenstemming met het bij of krachtens
      [artikel 7b][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7b
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 7b
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7a.2
    text: 'Het register wordt door Onze Minister gebruikt om:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7a
  - number: 7a.2.a
    text: |-
      bij gesignaleerde risico’s met ingebrachte implantaten of met categorieën van implantaten inzicht te verkrijgen in
      het aantal betrokken cliënten en de mogelijke gevolgen van de risico’s voor de gezondheid van cliënten;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7a
  - number: 7a.2.b
    text: |-
      zorgaanbieders en, door tussenkomst van deze, cliënten te informeren over de risico’s, bedoeld in onderdeel a, met
      het oog op de bescherming van de gezondheid van die cliënten.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7a
  - number: 7b.1
    text: |-
      De zorgverlener houdt in het dossier van een cliënt aantekening van bij of krachtens algemene maatregel van bestuur
      bepaalde gegevens van een bij die cliënt ingebracht implantaat op een wijze dat het ingebrachte implantaat kan
      worden herleid tot die cliënt.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7b
  - number: 7b.2
    text: |-
      De zorgaanbieder verstrekt de geregistreerde gegevens, bedoeld in het eerste lid, over een bij een cliënt
      ingebracht implantaat ten behoeve van het register, bedoeld in [artikel 7a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7a
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7b
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 7a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 7b.3
    text: |-
      De zorgverlener verstrekt schriftelijk aan een cliënt de gegevens, bedoeld in het eerste lid, over een bij die
      cliënt ingebracht implantaat.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7b
  - number: 7b.4
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld ten aanzien van de wijze waarop en de termijn
      waarbinnen de gegevens, bedoeld in het tweede en derde lid, worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7b
  - number: 7b.5
    text: |-
      Bij algemene maatregel van bestuur kunnen beperkingen worden gesteld aan de verplichtingen, bedoeld in het eerste
      en tweede lid.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel7b
  - number: '8.1'
    text: |-
      De zorgaanbieder stelt een meldcode vast waarin stapsgewijs wordt aangegeven hoe met signalen van huiselijk geweld
      of kindermishandeling wordt omgegaan en die er redelijkerwijs aan bijdraagt dat zo snel en adequaat mogelijk hulp
      kan worden geboden.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel8
  - number: '8.2'
    text: De zorgaanbieder bevordert de kennis en het gebruik van de meldcode.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel8
  - number: '8.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen een meldcode in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel8
  - number: '9.1'
    text: |-
      Voor zover dit noodzakelijk is voor de goede werking van de systematische bewaking, beheersing en verbetering van
      de kwaliteit van de zorg, worden in een register als bedoeld in [artikel 7, tweede lid][ref1], zonder toestemming
      van de betrokkene, persoonsgegevens verwerkt betreffende intern gemelde incidenten, waaronder gegevens over
      gezondheid als bedoeld in artikel 4, onderdeel 15 van de Algemene verordening gegevensbescherming.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.2'
    text: |-
      De zorgaanbieder stelt schriftelijk een interne procedure vast, waarin stapsgewijs wordt aangegeven hoe wordt
      omgegaan met signalen van incidenten. De zorgaanbieder bevordert de kennis en het gebruik van de procedure.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
  - number: '9.3'
    text: |-
      De in het tweede lid bedoelde procedure is zodanig dat zij er redelijkerwijs aan bijdraagt dat zo snel en adequaat
      mogelijk bescherming kan worden geboden of maatregelen kunnen worden genomen, en waarborgt dat van persoonsgegevens
      geen kennis kan worden genomen door anderen dan de functionaris of functionarissen die met de behandeling van
      signalen van incidenten zijn belast.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
  - number: '9.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt vastgesteld uit welke elementen de procedure in ieder geval
      bestaat.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
  - number: '9.5'
    text: |-
      Degene die op grond van een wettelijk voorschrift of op grond van zijn beroep tot geheimhouding is verplicht, kan,
      zonder toestemming van de cliënt, overeenkomstig de vastgestelde procedure aan de daartoe aangewezen functionaris
      de gegevens, daaronder begrepen persoonsgegevens, gegevens over gezondheid als bedoeld in artikel 4, onderdeel 15
      van de Algemene verordening gegevensbescherming en andere bijzondere categorieën van persoonsgegevens als bedoeld
      in paragraaf 3.1 van de Uitvoeringswet Algemene verordening gegevensbescherming, verstrekken die noodzakelijk zijn
      te achten om een incident te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
  - number: '9.6'
    text: |-
      Gegevens in het register, bedoeld in [artikel 7, tweede lid][ref1], betreffende intern gemelde incidenten,
      behoudens die met betrekking tot een calamiteit of geweld in de zorgrelatie, kunnen niet in een civielrechtelijke,
      strafrechtelijke, bestuursrechtelijke of tuchtrechtelijke procedure als bewijs worden gebruikt, noch kan een
      disciplinaire maatregel, een bestuurlijke sanctie of een bestuurlijke maatregel daarop worden gebaseerd. In
      afwijking van de eerste volzin kunnen de gegevens voor het strafrechtelijk bewijs worden gebruikt indien zij
      redelijkerwijs niet op een andere manier kunnen worden verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.7'
    text: |-
      De gegevens in het register, bedoeld in [artikel 7, tweede lid][ref1], betreffende intern gemelde incidenten, zijn
      niet openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.8'
    text: |-
      De zorgaanbieder die zorg draagt voor een register als bedoeld in [artikel 7, tweede lid][ref1], is de
      verwerkingsverantwoordelijke als bedoeld in artikel 4 van de Algemene verordening gegevensbescherming voor dat
      register.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.1'
    text: |-
      De zorgaanbieder verstrekt de cliёnt, teneinde hem in staat te stellen een weloverwogen keuze te maken tussen
      verschillende zorgaanbieders, op diens verzoek informatie over de door zorgaanbieder aangeboden zorg, waaronder
      begrepen de tarieven en de kwaliteit, alsmede over de ervaringen van cliënten met die zorg.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel10
  - number: '10.2'
    text: |-
      De zorgaanbieder informeert de cliënt voorts over het al dan niet bestaan van een wetenschappelijk bewezen
      werkzaamheid van die zorg alsmede over de wachttijd.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel10
  - number: '10.3'
    text: |-
      De zorgaanbieder doet aan een cliёnt, alsmede een vertegenwoordiger van de cliënt dan wel een nabestaande van de
      overleden cliënt, onverwijld mededeling van de aard en toedracht van incidenten bij de zorgverlening aan de cliёnt
      die voor de cliёnt merkbare gevolgen hebben of kunnen hebben en maakt van de aard en toedracht van incidenten
      aantekening in het dossier van de cliënt. Tevens wordt aantekening gemaakt van het tijdstip waarop het incident
      heeft plaatsgevonden en de namen van de betrokkenen bij het incident. Daarbij licht de zorgaanbieder de cliënt
      tevens in over de mogelijkheden om de gevolgen van het incident weg te nemen of te beperken.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel10
  - number: '10.4'
    text: |-
      Op verzoek van de cliënt informeert de zorgaanbieder de cliënt over de rechten die uit deze wet voor hem
      voortvloeien.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel10
  - number: '11.1'
    text: 'De zorgaanbieder doet bij de inspectie onverwijld melding van:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11
  - number: 11.1.a
    text: iedere calamiteit die bij de zorgverlening heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11
  - number: 11.1.b
    text: geweld in de zorgrelatie;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11
  - number: 11.1.c
    text: |-
      de opzegging, ontbinding of niet-voortzetting van een overeenkomst als bedoeld in
      [artikel 4, eerste lid, onderdeel b][ref1], met een zorgverlener op grond van zijn oordeel dat de zorgverlener
      ernstig is tekort geschoten in zijn functioneren.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel4
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '11.2'
    text: |-
      De zorgaanbieder en de zorgverleners die zorg verlenen aan zijn cliënten, verstrekken bij en naar aanleiding
      van een melding als bedoeld in het eerste lid aan de ingevolge deze wet met toezicht belaste ambtenaar de
      gegevens, daaronder begrepen persoonsgegevens, gegevens over gezondheid als bedoeld in artikel 4, onderdeel
      15 van de Algemene verordening gegevensbescherming en andere bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2], die voor het onderzoeken van
      de melding noodzakelijk zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: 11a.1
    text: |-
      Het Zorginstituut houdt een openbaar register bij waarin de kwaliteitsstandaarden en de meetinstrumenten zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11a
  - number: 11a.2
    text: |-
      De opname in het openbaar register geschiedt op basis van een voordracht als bedoeld in
      [artikel 11b, eerste lid][ref1], onderscheidenlijk [11f, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11b
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11f
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11a
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: 11f
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11b.1
    text: |-
      De voordracht van een kwaliteitsstandaard aan het Zorginstituut vindt plaats door tripartiete partijen gezamenlijk
      dan wel door de Adviescommissie Kwaliteit.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.2
    text: 'Een voorgedragen kwaliteitsstandaard voldoet aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.2.a
    text: |-
      hij bevat een verantwoorde beschrijving van de kwaliteit van een zorgproces of een deel van een zorgproces,
      waaronder in ieder geval wordt verstaan dat hij de innovatie van het zorgproces niet belemmert en dat de daarin
      opgenomen normen leiden tot doelmatige zorg en toepasbaar zijn in het toezicht;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.2.b
    text: hij bevat een cliëntenversie, een samenvatting en een onderhoudsplan;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.2.c
    text: |-
      hij voorkomt een onderscheid tussen zorg waarvan de uitgaven behoren tot de collectieve zorguitgaven en andere zorg
      in een kwaliteitsstandaard en tussen kwaliteitsstandaarden; en
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.2.d
    text: |-
      hij is verbonden met één of meer meetinstrumenten of bevat een planning waaruit blijkt wanneer dit het geval zal
      zijn.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.3
    text: |-
      Een voorgedragen kwaliteitsstandaard die mogelijke substantiële financiële gevolgen voor de collectieve
      zorguitgaven heeft bevat ook een kwalitatieve beschrijving van de directe gevolgen van die standaard voor de
      collectieve zorguitgaven en maakt een beoordeling van die gevolgen mogelijk.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.4
    text: |-
      Voor zover niet meteen na opname in het openbaar register aan de kwaliteitsstandaard kan worden voldaan, bevat de
      voorgedragen kwaliteitsstandaard ook een planning waaruit blijkt wanneer wel aan die standaard kan worden voldaan.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11b.5
    text: |-
      Het eerste tot en met het vierde lid zijn van overeenkomstige toepassing op een voorgedragen aanpassing van een
      kwaliteitsstandaard.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11b
  - number: 11c.1
    text: |-
      Het Zorginstituut neemt een voorgedragen kwaliteitsstandaard zonder mogelijke substantiële financiële
      gevolgen voor de collectieve zorguitgaven op in het openbaar register indien die voldoet aan
      [artikel 11b, eerste, tweede en vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11b
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11c.2
    text: |-
      Het Zorginstituut zendt een voorgedragen kwaliteitsstandaard die voldoet aan
      [artikel 11b, eerste, tweede en vierde lid][ref1] en mogelijke substantiële financiële gevolgen voor de collectieve
      zorguitgaven heeft, aan de zorgautoriteit voor het verrichten van een analyse naar de directe gevolgen van die
      standaard voor de collectieve zorguitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11b
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11c
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11b
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11c.3
    text: |-
      Het Zorginstituut besluit tot opname van een voorgedragen kwaliteitsstandaard als bedoeld in het tweede lid in
      het openbaar register indien uit de analyse van de zorgautoriteit blijkt dat het hanteren van die standaard door
      zorgaanbieders, naar verwachting niet leidt tot een toename van de collectieve zorguitgaven.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11c
  - number: 11c.4
    text: |-
      Het Zorginstituut vraagt, na een inhoudelijke afweging te hebben gedaan of de in voorgedragen kwaliteitsstandaard
      opgenomen normen leiden tot doelmatige zorg en het opstellen van een advies over die kwaliteitsstandaard, onder
      gelijktijdige toezending van de voorgedragen kwaliteitsstandaard, de analyse van de zorgautoriteit en het advies,
      toestemming aan Onze Minister voor het nemen van een besluit tot opname van de voorgedragen kwaliteitsstandaard in
      het openbaar register in het geval uit de analyse blijkt dat de voorgedragen kwaliteitsstandaard naar verwachting
      leidt tot een toename van de collectieve zorguitgaven.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11c
  - number: 11c.5
    text: |-
      De zorgautoriteit doet niet eerder mededeling van de analyse naar de gevolgen voor de collectieve zorguitgaven dan
      nadat het Zorginstituut het besluit tot opname van de voorgedragen kwaliteitsstandaard in het openbaar register op
      grond van het derde lid heeft genomen of de voorgedragen kwaliteitsstandaard op basis van het vierde lid aan Onze
      Minister heeft gezonden.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11c
  - number: 11c.6
    text: |-
      Het eerste tot en met het vijfde lid zijn van overeenkomstige toepassing op een voorgedragen aanpassing van een
      kwaliteitsstandaard.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11c
  - number: 11d.1
    text: |-
      Onze Minister kan de toestemming, bedoeld in [artikel 11c, vierde lid][ref1], weigeren indien hij overwegende
      bezwaren heeft tegen de verwachte toename van de collectieve zorguitgaven.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11c
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11d.2
    text: |-
      Voordat Onze Minister een besluit neemt tot het al dan niet geven van de toestemming, deelt hij binnen vier weken
      na toezending door het Zorginstituut de inhoud van dat besluit schriftelijk mede aan beide Kamers der Staten-
      Generaal.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11d
  - number: 11d.3
    text: |-
      Onze Minister kan in het geval dat de voorgedragen kwaliteitsstandaard zeer ingewikkeld, omstreden of omvangrijk is
      de termijn, bedoeld in het tweede lid, met vier weken verdagen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11d
  - number: 11d.4
    text: |-
      Onze Minister stelt het besluit zo spoedig mogelijk vast, maar niet eerder dan nadat 2 weken zijn verstreken
      na de mededeling, bedoeld in het tweede lid, of, in een geval als bedoeld in het derde lid, nadat 4 weken zijn
      verstreken.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11d
  - number: 11d.5
    text: |-
      Onze Minister doet gelijktijdig met het verlenen van toestemming of het weigeren daarvan aan het Zorginstituut
      mededeling van dit besluit in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11d
  - number: 11d.6
    text: |-
      Het Zorginstituut besluit tot opname van de voorgedragen kwaliteitsstandaard in het openbaar register indien Onze
      Minister op grond van [artikel 11c, vierde lid][ref1], daarvoor toestemming heeft gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11c
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11d
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11d.7
    text: |-
      Het eerste tot en met het zesde lid zijn van overeenkomstige toepassing op een voorgedragen aanpassing van een
      kwaliteitsstandaard.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11d
  - number: 11e.1
    text: |-
      Onze Minister maakt van zijn bevoegdheid, bedoeld in
      [artikel 22 van de Kaderwet zelfstandige bestuursorganen][ref1], slechts gebruik binnen drie maanden nadat het
      Zorginstituut in strijd met [artikel 11c, eerste, derde of vierde lid][ref2], of [artikel 11d, zesde lid][ref3],
      heeft besloten een voorgedragen kwaliteitsstandaard in het openbaar register op te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11c
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel11d
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11e
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: 11c
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: 11d
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11e.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een in het openbaar register opgenomen aanpassing van een
      kwaliteitsstandaard.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11e
  - number: 11f.1
    text: |-
      De voordracht van een meetinstrument aan het Zorginstituut vindt plaats door tripartiete partijen gezamenlijk dan
      wel de Adviescommissie Kwaliteit.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11f
  - number: 11f.2
    text: |-
      Het Zorginstituut neemt een voorgedragen meetinstrument in het openbaar register op indien deze kan worden
      aangemerkt als een verantwoord middel om te meten of goede zorg is geleverd.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11f
  - number: 11f.3
    text: |-
      Het Zorginstituut neemt een overeenkomstig het eerste lid voorgedragen meetinstrument niet op in het openbaar
      register indien het meetinstrument niet kan worden aangemerkt als een verantwoord middel om te meten of goede zorg
      is geleverd.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11f
  - number: 11f.4
    text: Het eerste tot en met het derde lid zijn van overeenkomstige toepassing op een aanpassing van een meetinstrument.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11f
  - number: 11g.1
    text: |-
      Het Zorginstituut stelt vast voor welke vormen van zorg een kwaliteitsstandaard of een meetinstrument nodig is dan
      wel een overeenkomstig [artikel 11a][ref1] in het openbaar register opgenomen kwaliteitsstandaard of meetinstrument
      wijziging behoeft. Hierbij bevordert het Zorginstituut de verspreiding van goede voorbeelden op het gebied van
      patiëntveiligheid.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11a
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11a
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11g.2
    text: |-
      Het Zorginstituut stelt een tijdstip vast waarop de kwaliteitsstandaard of het meetinstrument, bedoeld in het
      eerste lid, moet zijn opgesteld onderscheidenlijk aangepast.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11g
  - number: 11g.3
    text: |-
      Indien op het in het tweede lid bedoelde tijdstip geen kwaliteitsstandaard of meetinstrument is opgesteld
      onderscheidenlijk aangepast, kan het Zorginstituut de Adviescommissie Kwaliteit verzoeken binnen een
      nader te bepalen termijn hiervoor zorg te dragen en over de aldus opgestelde onderscheidenlijk aangepaste
      kwaliteitsstandaard overleg te plegen met relevante tripartiete partijen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11g
  - number: 11g.4
    text: |-
      Het Zorginstituut bevordert de ontwikkeling van de kwaliteit van zorg en het door zorgaanbieders aanbieden van
      goede zorg als bedoeld in [artikel 2, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11g
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 11h.1
    text: |-
      Het Zorginstituut verwerkt de persoonsgegevens waaronder gegevens over gezondheid als bedoeld in artikel 4,
      onderdeel 15, van de Algemene verordening gegevensbescherming, die noodzakelijk zijn voor de uitvoering van zijn
      opgedragen taken, bedoeld in [artikel 11g][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11g
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11h
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11g
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11h.2
    text: |-
      Het Zorginstituut verwerkt op grond van het eerste lid slechts persoonsgegevens indien daarop pseudonimisering
      als bedoeld in artikel 4, onderdeel 5, van de Algemene verordening gegevensbescherming is toegepast en vervolgens
      onafgebroken is gecontinueerd.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11h
  - number: 11h.3
    text: |-
      Artikel 21, eerste lid, tweede volzin, van de Algemene verordening gegevensbescherming, is bij de verwerking door
      het Zorginstituut niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11h
  - number: 11i.1
    text: |-
      Het Zorginstituut draagt zorg voor het verzamelen, samenvoegen en beschikbaar maken van informatie over de
      kwaliteit van verleende zorg:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11i
  - number: 11i.1.a
    text: |-
      met het oog op het recht van de cliënt een weloverwogen keuze te kunnen maken tussen verschillende zorgaanbieders;
      en
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11i
  - number: 11i.1.b
    text: ten behoeve van het toezicht door de ambtenaren van de inspectie.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11i
  - number: 11i.2
    text: |-
      Zorgaanbieders zijn verplicht de informatie, bedoeld in het eerste lid, te rapporteren op basis van de
      overeenkomstig [artikel 11a][ref1] in het openbaar register opgenomen meetinstrumenten.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11a
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11i
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11a
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11i.3
    text: |-
      Bij regeling van Onze Minister wordt de instantie aangewezen waar zorgaanbieders de in het tweede lid bedoelde
      informatie aanleveren.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11i
  - number: 11j.1
    text: |-
      De Adviescommissie Kwaliteit stelt op een verzoek van het Zorginstituut als bedoeld in
      [artikel 11g, derde lid][ref1], een voor te dragen kwaliteitsstandaard of een meetinstrument op.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11g
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11j
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 11g
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 11j.2
    text: |-
      De Adviescommissie Kwaliteit heeft tot taak het Zorginstituut te adviseren over aangelegenheden betreffende de
      kwaliteit van de zorgverlening, waaronder:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11j
  - number: 11j.2.a
    text: de meerjarenagenda en het werkprogramma van het Zorginstituut;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11j
  - number: 11j.2.b
    text: de samenhang tussen kwaliteitsstandaarden en de bekostiging van de zorg; en
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11j
  - number: 11j.2.c
    text: het inzichtelijk maken van informatie over de kwaliteit van zorg.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11j
  - number: 11j.3
    text: |-
      De Adviescommissie Kwaliteit kan ten behoeve van de uitvoering van haar werkzaamheden een of meer deskundigen op
      het gebied van een specifieke vorm van zorg inschakelen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel11j
  - number: '12.1'
    text: |-
      Onze Minister houdt een openbaar register in stand, waarin hij van alle zorgaanbieders de volgende gegevens
      opneemt:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
  - number: 12.1.a
    text: de naam of een andere aanduiding;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
  - number: 12.1.b
    text: de rechtsvorm;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
  - number: 12.1.c
    text: het Handelsregisternummer;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
  - number: 12.1.d
    text: het adres van vestiging;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
  - number: 12.1.e
    text: het adres of de adressen waarop of van waaruit de zorg wordt verleend;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
  - number: 12.1.f
    text: de vormen van zorg die worden verleend.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
  - number: '12.2'
    text: |-
      Onze Minister draagt zorg dat het register, de op grond van
      [artikel 38 van de Wet marktordening gezondheidszorg][ref1] openbaar gemaakte informatie, het register, bedoeld
      in [artikel 3 van de Wet op de beroepen in de individuele gezondheidszorg][ref2], de gegevens, bedoeld in de
      [artikelen 15][ref3] en [16 van de Wet toelating zorginstellingen][ref4] en de informatie over de kwaliteit van de
      verleende zorg, bedoeld in [artikel 66d van de Zorgverzekeringswet][ref5], in onderling verband zijn in te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018906#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0018906#Artikel16
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel66d
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '38'
      - id: ref2
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0018906
        artikel: '15'
      - id: ref4
        bwb_id: BWBR0018906
        artikel: '16'
      - id: ref5
        bwb_id: BWBR0018450
        artikel: 66d
  - number: '13.1'
    text: |-
      De zorgaanbieder treft, rekening houdende met de aard van de zorg en de categorie van cliënten waaraan zorg wordt
      verleend, schriftelijk een regeling voor een effectieve en laagdrempelige opvang en afhandeling van hem betreffende
      klachten, die voldoet aan het bepaalde in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel13
  - number: '13.2'
    text: |-
      De zorgaanbieder stelt de regeling vast in overeenstemming met een representatief te achten organisatie van
      cliënten.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel13
  - number: '13.3'
    text: |-
      Het tweede lid is niet van toepassing voor zover de regeling betrekking heeft op een instelling en de zorgaanbieder
      met betrekking tot de regeling voor die instelling op grond van enige wettelijke bepaling het advies of de
      instemming van een cliёntenraad moet verkrijgen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel13
  - number: '13.4'
    text: |-
      De zorgaanbieder brengt de regeling, alsmede een wijziging daarvan, op een daarvoor geschikte wijze onder de
      aandacht van de cliënten en vertegenwoordigers van cliёnten.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel13
  - number: '13.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen gesteld waaraan een regeling als bedoeld in het eerste
      lid in ieder geval moet voldoen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel13
  - number: '14.1'
    text: |-
      Over een gedraging jegens een cliënt in het kader van de zorgverlening kan schriftelijk een klacht worden ingediend
      door de cliënt, een nabestaande van de overleden cliënt dan wel een vertegenwoordiger van de cliënt.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel14
  - number: '14.2'
    text: |-
      Voorts kan over de weigering van de zorgaanbieder om een persoon in het kader van de zorgverlening als
      vertegenwoordiger van een cliёnt te beschouwen, door die persoon schriftelijk een klacht worden ingediend.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel14
  - number: '15.1'
    text: |-
      De zorgaanbieder wijst een of meer daartoe geschikt te achten personen aan die een klager op diens verzoek gratis
      van advies dienen met betrekking tot de indiening van een klacht en bijstaan bij het formuleren van de klacht en
      het onderzoeken van de mogelijkheden om tot een oplossing voor de klacht te komen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel15
  - number: '15.2'
    text: |-
      De zorgaanbieder waarborgt dat een aangewezen persoon als bedoeld in het eerste lid, indien deze in dienst is van
      de zorgaanbieder, zijn functie onafhankelijk kan uitvoeren en benadeelt hem niet wegens de wijze waarop hij zijn
      functie uitoefent.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel15
  - number: '16.1'
    text: Een klacht wordt zorgvuldig onderzocht.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel16
  - number: '16.2'
    text: |-
      De behandeling van een klacht is gericht op het bereiken van een voor de klager en de zorgaanbieder bevredigende
      oplossing.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel16
  - number: '16.3'
    text: De klager wordt op de hoogte gehouden van de voortgang van de behandeling van de klacht.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel16
  - number: '17.1'
    text: |-
      De klager ontvangt zo spoedig mogelijk, doch uiterlijk binnen zes weken na indiening van de klacht, een
      schriftelijke mededeling van de zorgaanbieder waarin met redenen omkleed is aangegeven tot welk oordeel het
      onderzoek van de klacht heeft geleid, welke beslissingen de zorgaanbieder over en naar aanleiding van de klacht
      heeft genomen en binnen welke termijn maatregelen waartoe is besloten, zullen zijn gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel17
  - number: '17.2'
    text: |-
      Indien het vereiste zorgvuldige onderzoek van een klacht daartoe naar het oordeel van de zorgaanbieder noodzaakt,
      kan de zorgaanbieder de in het eerste lid genoemde termijn met ten hoogste vier weken verlengen. De zorgaanbieder
      doet daarvan voor het verstrijken van de termijn schriftelijk mededeling aan de klager.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel17
  - number: '18.1'
    text: De zorgaanbieder is aangesloten bij een geschilleninstantie, die voldoet aan het bepaalde in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel18
  - number: '18.2'
    text: Een geschilleninstantie is erkend door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel18
  - number: '18.3'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld over de erkenning van een geschilleninstantie als bedoeld in
      het tweede lid.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel18
  - number: '18.4'
    text: |-
      Bij regeling van Onze Minister van Defensie, in overeenstemming met Onze Minister, worden nadere regels gesteld
      aan de geschilleninstantie waarbij hij is aangesloten teneinde de deskundigheid inzake de militaire gezondheidszorg
      te waarborgen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel18
  - number: '18.5'
    text: |-
      De zorgaanbieder brengt de mogelijkheid om geschillen aan de geschilleninstantie voor te leggen alsmede een
      wijziging daarin, op daarvoor geschikte wijze onder de aandacht van de cliënten en vertegenwoordigers van cliёnten.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel18
  - number: '19.1'
    text: |-
      De geschilleninstantie heeft tot taak geschillen over gedragingen van een zorgaanbieder jegens een cliënt in het
      kader van de zorgverlening te beslechten.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel19
  - number: '19.2'
    text: |-
      De geschilleninstantie is ingesteld door een of meer representatief te achten cliëntenorganisaties en door een of
      meer representatief te achten organisaties van zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel19
  - number: '19.3'
    text: |-
      De geschilleninstantie oefent haar werkzaamheden uit op basis van een schriftelijke regeling, die waarborgt dat
      wordt voldaan aan het bepaalde in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel19
  - number: '20'
    text: |-
      De geschilleninstantie is bevoegd over een geschil een uitspraak te doen bij wege van bindend advies, alsmede een
      vergoeding van geleden schade toe te kennen tot in ieder geval € 25.000,–.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel20
  - number: '21.1'
    text: |-
      Een geschil met een zorgaanbieder kan schriftelijk ter beslechting aan de geschilleninstantie worden voorgelegd
      door een cliënt, een nabestaande van een overleden cliënt dan wel een vertegenwoordiger van de cliënt, indien:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel21
  - number: 21.1.a
    text: |-
      is gehandeld in strijd met [§1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037173
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 21.1.b
    text: |-
      de mededeling, bedoeld in [17, eerste lid][ref1], diens klacht naar zijn oordeel in onvoldoende mate wegneemt;


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel17
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 21.1.c
    text: |-
      van hem in redelijkheid niet kan worden verlangd dat hij onder de gegeven omstandigheden zijn klacht over een hem
      betreffende gedraging van de zorgaanbieder in het kader van de zorgverlening bij de zorgaanbieder indient.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel21
  - number: '21.2'
    text: |-
      Een geschil kan voorts schriftelijk ter beslechting aan de geschilleninstantie worden voorgelegd door een persoon
      die door de zorgaanbieder ten onrechte niet als vertegenwoordiger is beschouwd, indien de mededeling, bedoeld in
      [artikel 17, eerste lid][ref1], diens klacht naar zijn oordeel in onvoldoende mate wegneemt.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel17
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '17'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '21.3'
    text: |-
      Voorts kan een geschil schriftelijk ter beslechting aan de geschilleninstantie worden voorgelegd door een stichting
      of vereniging met volledige rechtsbevoegdheid, mits een belang in het geding is dat de stichting of vereniging
      volgens haar statuten behartigt.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel21
  - number: '22.1'
    text: De geschilleninstantie doet uiterlijk binnen zes maanden na de voorlegging van het geschil uitspraak.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel22
  - number: '22.2'
    text: |-
      In gevallen waarin dat, gelet op de aard van het geschil en de daarbij betrokken belangen, aangewezen is te achten,
      doet de geschilleninstantie in afwijking van het eerste lid op korte termijn een uitspraak.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel22
  - number: '22.3'
    text: |-
      De geschilleninstantie maakt de uitspraken over de aan haar voorgelegde geschillen openbaar in zodanige vorm dat
      deze niet tot personen herleidbaar zijn, behoudens voor zover het de zorgaanbieder betreft.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel22
  - number: '23'
    text: |-
      Een ieder die betrokken is bij de uitvoering van dit hoofdstuk en daarbij de beschikking krijgt over gegevens
      waarvan hij het vertrouwelijke karakter kent of redelijkerwijs moet vermoeden, en voor wie niet reeds uit hoofde
      van ambt, beroep of wettelijk voorschrift ter zake van die gegevens een geheimhoudingsplicht geldt, is verplicht
      tot geheimhouding daarvan, behoudens voor zover enig wettelijk voorschrift hem tot bekendmaking verplicht of uit
      zijn taak bij de uitvoering van dit hoofdstuk de noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel23
  - number: '24.1'
    text: |-
      De ambtenaren van de inspectie zijn belast met het toezicht op de naleving van hetgeen bij of krachtens de
      [artikelen 2][ref1], [2a, eerste en tweede lid][ref2], [3 tot en met 11][ref3] en [13 tot en met 23][ref4], dan
      wel in een aanwijzing of bevel als bedoeld in [artikel 27][ref5] of [artikel 28][ref6] is bepaald. Zij rapporteren
      daaromtrent aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0037173#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0037173#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0037173#Artikel28
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: 2a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0037173
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0037173
        artikel: '27'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0037173
        artikel: '28'
        hoofdstuk: '4'
  - number: '24.2'
    text: |-
      Het toezicht op de naleving van het bepaalde bij of krachtens de [artikelen 2][ref1] en [3][ref2] is mede gericht
      op het bevorderen van het gebruik van standaarden door zorgaanbieders en zorgverleners.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel3
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '24.3'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd, met medeneming van de benodigde apparatuur, een woning
      binnen te treden zonder toestemming van de bewoner, voor zover de woning deel uitmaakt van een bouwkundige
      voorziening voor het verlenen van zorg.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel24
  - number: '24.4'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn, voor zover dat voor de vervulling van hun taak noodzakelijk is en
      in afwijking van [artikel 5:20, tweede lid, van de Algemene wet bestuursrecht][ref1], bevoegd tot inzage van de
      dossiers van cliënten. Voor zover de betrokken zorgverlener uit hoofde van zijn beroep tot geheimhouding van het
      dossier verplicht is, geldt gelijke verplichting voor de betrokken ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '24.5'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd het niet naleven door een zorgaanbieder van een verplichting
      die voor hem uit het bepaalde bij of krachtens deze wet voortvloeit, buiten behandeling te laten, tenzij sprake
      is van een situatie die voor de veiligheid van cliënten of de zorg een ernstige bedreiging kan betekenen, of het
      belang van goede zorg anderszins daaraan redelijkerwijs in de weg staat.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel24
  - number: '24.6'
    text: |-
      De in het eerste lid bedoelde ambtenaren volgen de eenduidige uitleg van het Zorginstituut, bedoeld in
      [artikel 2a, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2a
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 2a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '25.1'
    text: |-
      De in [artikel 24][ref1] bedoelde ambtenaren onderzoeken meldingen van aanbieders en zorgverleners als bedoeld
      in [artikel 11][ref2] en andere meldingen, teneinde vast te stellen of sprake is van een situatie die voor de
      veiligheid van cliënten of de zorg een ernstige bedreiging kan betekenen, of met het oog op het belang van een
      goede zorg anderszins noodzaakt tot nader onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '25.2'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: 25.2.a
    text: de wijze waarop een melding wordt gedaan en de gegevens, die de melding ten minste bevat;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: 25.2.b
    text: |-
      de wijze waarop een melding wordt onderzocht, en de termijnen waarbinnen aan de melder en andere betrokkenen
      schriftelijk wordt medegedeeld dat de melding nader wordt onderzocht dan wel niet nader wordt onderzocht dan wel
      wat de uitkomst van het onderzoek is;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: 25.2.c
    text: |-
      de wijze waarop de inspectie de zorgaanbieder op zijn verzoek informeert of is vastgesteld dat er sprake is van een
      situatie als bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: 25.2.d
    text: de gevallen waarin nader onderzoek van een melding achterwege blijft;
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: 25.2.e
    text: |-
      de wijze waarop het onderzoek, buiten de gevallen, bedoeld onder d, wordt afgesloten en daarover informatie wordt
      verstrekt aan de melder en andere betrokkenen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: '25.3'
    text: |-
      Voor zover bij het onderzoeken van een melding gegevens van een cliënt ter beschikking van de inspectie zijn
      gekomen, ter zake waarvan de betrokken zorgverlener uit hoofde van zijn beroep tot geheimhouding verplicht is,
      geldt gelijke verplichting voor de ambtenaren van de inspectie jegens anderen dan de cliënt.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: '25.4'
    text: |-
      Indien de inspectie vaststelt dat sprake is van een van de in het eerste lid bedoelde situaties, neemt hij passende
      maatregelen, het in kennis stellen van justitiële autoriteiten daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel25
  - number: '26.1'
    text: |-
      De inspectie en de Nederlandse Zorgautoriteit, bedoeld in de [Wet marktordening gezondheidszorg][ref1], verstrekken
      elkaar desgevraagd de voor de uitoefening van hun taak benodigde inlichtingen en gegevens, alsmede inzage van
      zakelijke gegevens en bescheiden, voor zover dat voor de invulling van die taak redelijkerwijs nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '26.2'
    text: |-
      De inspectie verstrekt de Autoriteit persoonsgegevens de gegevens en inlichtingen die van belang kunnen zijn voor
      de uitoefening van diens wettelijke taken.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel26
  - number: '27.1'
    text: |-
      Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens de [artikelen 2][ref1], [3][ref2],
      [4, eerste lid, onderdelen a en b][ref3], en [5 tot en met 10][ref4] niet wordt nageleefd, kan hij, in voorkomend
      geval in overeenstemming met Onze Minister wie het mede aangaat, de zorgaanbieder een schriftelijke aanwijzing
      geven.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0037173#Artikel5
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0037173
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '27.2'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens de
      [artikelen 2][ref1], [3][ref2], [4, eerste lid, onderdelen a en b][ref3], en [5 tot en met 10][ref4] niet wordt
      nageleefd, alsmede de in verband daarmee te nemen maatregelen.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0037173#Artikel5
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0037173
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '27.3'
    text: Een aanwijzing bevat de termijn waarbinnen de zorgaanbieder er aan moet voldoen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel27
  - number: '27.4'
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor de veiligheid of de gezondheid redelijkerwijs
      geen uitstel kan lijden, kan de met het toezicht belaste ambtenaar een schriftelijk bevel geven. In voorkomend
      geval wordt daarvan onverwijld mededeling gedaan aan Onze Minister wie het mede aangaat. Het bevel heeft een
      geldigheidsduur van zeven dagen, welke door Onze Minister, in voorkomend geval in overeenstemming met Onze Minister
      wie het mede aangaat, kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel27
  - number: '27.5'
    text: |-
      De zorgaanbieder is verplicht binnen de daarbij gestelde termijn aan de aanwijzing onderscheidenlijk onmiddellijk
      aan het bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel27
  - number: '27.6'
    text: |-
      De bevoegdheid tot het verlengen van de geldigheidsduur van een bevel wordt niet gemandateerd aan een ambtenaar van
      de inspectie.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel27
  - number: '28.1'
    text: |-
      Indien Onze Minister van oordeel is dat de organisatiestructuur van de zorgaanbieder in ernstige mate afbreuk
      doet aan het verlenen van goede zorg als bedoeld in [artikel 2][ref1], kan hij de aanwijzing, bedoeld in
      [artikel 27, eerste lid][ref2], in de vorm van een structurele maatregel aan de zorgaanbieder opleggen teneinde
      voortgaande inbreuk op de kwaliteit van de zorgverlening te voorkomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel27
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '27'
        hoofdstuk: '4'
  - number: '28.2'
    text: 'Onze Minister geeft een aanwijzing als bedoeld in het eerste lid niet:'
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel28
  - number: 28.2.a
    text: |-
      dan nadat op diens verzoek over de bedrijfskundige gevolgen van de voorgenomen aanwijzing voor de zorgaanbieder een
      rapport als bedoeld in [artikel 21, eerste lid, van de Wet marktordening gezondheidszorg][ref1] is uitgebracht door
      de in dat artikel bedoelde zorgautoriteit, en


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel21
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '21'
  - number: 28.2.b
    text: |-
      indien het doel om voortgaande inbreuk op de kwaliteit van zorgverlening te voorkomen door middel van een even
      effectieve, voor de zorgaanbieder minder belastende maatregel kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel28
  - number: '29.1'
    text: |-
      Onze Minister is, in voorkomend geval in overeenstemming met Onze Minister wie het mede aangaat, bevoegd tot
      toepassing van bestuursdwang ter handhaving van het bepaalde bij of krachtens de [artikelen 13 tot en met 23][ref1]
      dan wel een krachtens [artikel 27][ref2] of [artikel 28][ref3] gegeven aanwijzing of bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel28
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0037173
        artikel: '27'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: '28'
        hoofdstuk: '4'
  - number: '29.2'
    text: |-
      Onze Minister is bevoegd een last onder dwangsom op te leggen aan de zorgaanbieder en de zorgverlener die geen
      gegevens verstrekken als bedoeld in de [artikelen 7b, tweede lid][ref1], en [11, tweede lid][ref2], of geen
      medewerking verleent aan de inzage van dossiers als bedoeld in [artikel 24, vierde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel7b
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel24
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: 7b
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
