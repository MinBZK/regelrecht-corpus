  - number: '1.2'
    text: |-
      Als zorg in de zin van deze wet wordt aangemerkt zorg en andere diensten, voor de kosten waarvan
      een subsidie wordt verstrekt op grond van de [artikelen 3.3.3][ref1], [10.1.4][ref2], of
      [11.1.5, eerste lid, van de Wet langdurige zorg][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0035917#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0035917#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel11
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel1
    references:
      - id: ref1
