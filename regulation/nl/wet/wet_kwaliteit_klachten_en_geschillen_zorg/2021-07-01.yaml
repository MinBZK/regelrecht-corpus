  - number: '35.1'
    text: |-
      De [Wet klachtrecht cliënten zorgsector][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007414
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007414
  - number: '35.2'
    text: |-
      De [Wet klachtrecht cliënten zorgsector][ref1] blijft van toepassing met betrekking tot klachten, die voor
      het tijdstip van inwerkingtreding van het eerste lid zijn ingediend bij een klachtencommissie als bedoeld in
      [artikel 2 van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007414
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0007414
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
  - number: '35.3'
    text: |-
      Binnen een jaar na het tijdstip van inwerkingtreding van de hierna genoemde bepalingen draagt de zorgaanbieder
      zorg voor:
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel35
  - number: 35.3.a
    text: |-
      vaststelling van een regeling als bedoeld in [artikel 13, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel13
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 35.3.b
    text: |-
      aansluiting bij een geschilleninstantie als bedoeld in [artikel 18, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel18
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '18'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '35.4'
    text: |-
      Tot het tijdstip waarop een regeling als bedoeld in [artikel 13, eerste lid][ref1], van kracht is geworden,
      blijft een regeling, vastgesteld op grond van [artikel 2 van de Wet klachtrecht cliënten zorgsector][ref2], van
      toepassing op de behandeling van klachten.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0007414#Artikel2
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0037173
        artikel: '13'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007414
        artikel: '2'
  - number: '35.5'
    text: |-
      Een mededeling als bedoeld in [artikel 2, vijfde lid, onderdeel van de Wet klachtrecht cliënten zorgsector][ref1]
      wordt voor de toepassing van [artikel 21, eerste lid][ref2], gelijkgesteld aan een mededeling als bedoeld in
      [artikel 17, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007414#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel17
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel35
