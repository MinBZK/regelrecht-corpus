  - number: '32.1'
    text: |-
      De [Kwaliteitswet zorginstellingen][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0007850
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007850
  - number: '32.2'
    text: |-
      Het [Besluit kwaliteitseisen ziekenhuisbloedbanken][ref1] en het [Besluit zorgplanbespreking AWBZ-zorg][ref2]
      berusten op [artikel 5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0017831
      [ref2]: https://wetten.overheid.nl/BWBR0025521
      [ref3]: https://wetten.overheid.nl/BWBR0037173#Artikel5
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel32
