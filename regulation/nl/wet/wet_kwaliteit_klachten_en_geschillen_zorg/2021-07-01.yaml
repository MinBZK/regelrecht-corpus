  - number: '40'
    text: |-
      [Artikel 4, eerste lid, onderdeel b][ref1], geldt gedurende een jaar na het tijdstip van inwerkingtreding van dat
      artikelonderdeel niet voor op dat tijdstip geldende overeenkomsten tussen een zorgaanbieder en de zorgverleners
      en opdrachtnemers die hij zorg doet verlenen, mits zij niet in strijd zijn met de strekking van genoemd
      artikelonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel4
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel40
