        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0037173
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '30.2'
    text: |-
      Degene die handelt of nalaat in strijd met [artikel 11, eerste lid][ref1], of het bepaalde bij of krachtens een
      algemene maatregel van bestuur als bedoeld in [artikel 4, tweede of derde lid][ref2], wordt gestraft met hechtenis
      van ten hoogste een jaar of een geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0037173#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0037173#Artikel4
    url: https://wetten.overheid.nl/BWBR0037173/2021-07-01#Artikel30
    references:
      - id: ref1
