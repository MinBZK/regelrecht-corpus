preamble:
  text: |-
    Gezien de adviezen van de Voorlopige Commissie Nationale Parken van 4 juni 1992 en van 24 juni 1996;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:



            a
            minister:

              Minister van Landbouw, Natuurbeheer en Visserij;



            b
             overlegorgaan:

              overlegorgaan als bedoeld in [artikel 3][ref1];



            c
            nationaal park:

              gebied zoals omschreven in het Structuurschema Groene Ruimte (Kamerstukken II, 1992/93, 22 880, nr. 5,
      blz. 99).


      [ref1]: https://wetten.overheid.nl/BWBR0008300#Artikel3
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008300
        artikel: '3'
  - number: '2'
    text: |-
      Als nationaal park wordt aangewezen het gebied De Hamert, zoals aangegeven op de kaart die als bijlage behoort bij
      deze regeling.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel2
  - number: '3'
    text: Er is een overlegorgaan nationaal park De Hamert.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel3
  - number: '4'
    text: |-
      Het overlegorgaan heeft tot taak zorg te dragen voor de inrichting en het beheer van het nationaal park De Hamert.
      Daartoe behoort onder meer:

      a. het actualiseren van het beheers- en inrichtingsplan;

      b. het streven naar onderlinge afstemming van alle voor de inrichting en het beheer van belang zijnde plannen en
      activiteiten;

      c. het doen van voorstellen aan de minister voor de besteding van de voor het nationaal park De Hamert beschikbare
      middelen in het kader van een jaarlijks voortschrijdend meerjarenprogramma met bijbehorende begroting;

      d. besteding van gelden op basis van het door de minister goed te keuren meerjarenprogramma, het opstellen van
      projectplannen, controle op de besteding van gelden en coördinatie van de uitvoering van projecten binnen het kader
      van het beheers- en inrichtingsplan;

      e. het opstellen van een meerjarenprogramma voorlichting en educatie, ter bevordering en coördinatie van
      voorlichting en educatie met betrekking tot het nationaal park De Hamert.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel4
  - number: '5'
    text: |-
      Het overlegorgaan voert zijn taak uit overeenkomstig het beheers- en inrichtingsplan voor het nationaal park De
      Hamert van april 1991 en met inachtneming van hetgeen te dien aanzien door de minister bij brief van 15 augustus
      1996, kenmerk DN.964160, is gesteld.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel5
  - number: '6'
    text: |-
      In het overlegorgaan hebben zitting:

      a. één door de minister te benoemen lid, tevens voorzitter;

      b. vijf door de minister te benoemen leden, als vertegenwoordiger en op voordracht van onderscheidenlijk:

      1. de provincie Limburg;

      2. de gemeente Bergen;

      3. het gewest Noord-Limburg;

      4. het waterschap Peel en Maasvallei;

      5. de Stichting het Limburgs Landschap;

      c. één door de minister te benoemen lid als vertegenwoordiger van de kleine particuliere eigenaren;

      d. een rijksambtenaar, werkzaam bij de directie Zuid van het Ministerie van Landbouw, Natuurbeheer en Visserij.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel6
  - number: '7'
    text: |-
      1 Het overlegorgaan regelt de openbaarheid en de plaats van zijn vergadering, alsmede de overige aspecten van zijn
      inrichting en werkwijze.

      2 Het overlegorgaan brengt jaarlijks van zijn werkzaamheden verslag uit aan de minister.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel7
  - number: '8'
    text: |-
      Het secretariaat van het overlegorgaan berust bij een door de provincie Limburg te benoemen ambtenaar van die
      provincie.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel8
  - number: '9'
    text: |-
      Indien bij het overlegorgaan belangrijke verschillen van inzicht blijken te bestaan, doet de voorzitter van het
      overlegorgaan daarvan mededeling aan de minister, die daarop de naar zijn oordeel nodige stappen onderneemt.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel9
  - number: '10'
    text: De Regeling aanwijzing nationaal park in oprichting De Hamert wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel10
  - number: '11'
    text: Deze regeling treedt in werking met ingang van 30 oktober 1996.
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel11
  - number: '12'
    text: 'Deze regeling wordt aangehaald als: Regeling aanwijzing nationaal park De Hamert.'
    url: https://wetten.overheid.nl/BWBR0008300/1996-10-30#Artikel12
