---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht-mvp/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_op_het_specifiek_cultuurbeleid
regulatory_layer: WET
publication_date: '2015-12-18'
valid_from: '2015-01-01'
bwb_id: BWBR0005904
url: https://wetten.overheid.nl/BWBR0005904/2015-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het verstrekken van specifieke uitkeringen uit 's Rijks kas ten behoeve
    van cultuuruitingen wettelijk dient te worden geregeld, dat het wenselijk is het cultuurbeleid van het Rijk eenmaal
    per vier jaar in een nota vast te leggen en het verstrekken van subsidies ten behoeve van cultuuruitingen een
    grondslag in de wet te geven en voorts dat het wenselijk is de Minister van Welzijn, Volksgezondheid en Cultuur
    te machtigen tot het oprichten van privaatrechtelijke rechtspersonen die de verbreiding van cultuuruitingen
    bevorderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel1
  - number: 1.1.b
    text: |-
      cultuuruitingen: de cultuuruitingen op de terreinen van de cultuur waarover het beleid van Onze Minister zich
      uitstrekt;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel1
  - number: 1.1.c
    text: |-
      fonds: een privaatrechtelijke rechtspersoon die is opgericht op grond van de machtiging van [artikel 9][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel9
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '9'
        hoofdstuk: IV
  - number: 1.1.d
    text: |-
      de Raad: de Raad voor cultuur, bedoeld in [artikel 2a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel2a
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 2a
        hoofdstuk: IA
  - number: '1.2'
    text: |-
      De [artikelen 4 tot en met 8][ref1] zijn niet van toepassing op het verstrekken van subsidies ten behoeve van
      cultuuruitingen voorzover daarvoor bij of krachtens een andere wet regels zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '4'
        hoofdstuk: III
  - number: 1a
    text: Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel1a
  - number: '2'
    text: |-
      Onze Minister is belast met het scheppen van voorwaarden voor het in stand houden, ontwikkelen, sociaal en
      geografisch spreiden of anderszins verbreiden van cultuuruitingen; hij laat zich daarbij leiden door overwegingen
      van kwaliteit en verscheidenheid.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel2
  - number: 2a.1
    text: Er is een Raad voor cultuur.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel2a
  - number: 2a.2
    text: |-
      De Raad voor cultuur heeft tot taak de regering en de beide kamers der Staten-Generaal te adviseren over algemeen
      verbindende voorschriften of te voeren beleid van het Rijk op het terrein van de cultuur.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel2a
  - number: 2c.1
    text: |-
      Onder de Raad ressorteren twee commissies ter voorbereiding van de adviezen die Onze Minister vraagt ingevolge de
      [Monumentenwet 1988][ref1] onderscheidenlijk de [Wet tot behoud van cultuurbezit][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004471
      [ref2]: https://wetten.overheid.nl/BWBR0003659
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0004471
      - id: ref2
        bwb_id: BWBR0003659
  - number: 2c.2
    text: |-
      De commissies, bedoeld in het eerste lid, kunnen in afwijking van [artikel 16 van de Kaderwet adviescolleges][ref1]
      geheel of gedeeltelijk bestaan uit andere personen dan leden van de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel16
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '16'
  - number: 2c.3
    text: |-
      Ter voorbereiding van andere adviezen dan bedoeld in het eerste lid, kan de Raad tijdelijke commissies instellen
      die in afwijking van [artikel 16 van de Kaderwet adviescolleges][ref1] geheel of gedeeltelijk kunnen bestaan uit
      andere personen dan leden van de Raad.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel16
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '16'
  - number: 2c.4
    text: |-
      Op de in het tweede en derde lid bedoelde commissieleden zijn de
      [artikelen 11 tot en met 14 van de Kaderwet adviescolleges][ref1] van overeenkomstige toepassing, met dien
      verstande dat deze leden door Onze Minister worden benoemd, geschorst en ontslagen.


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel11
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel2c
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '11'
  - number: '3.1'
    text: |-
      Onze Minister bericht ten minste een keer in de vier jaar beide kamers der Staten-Generaal over de hoofdlijnen van
      het cultuurbeleid.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel3
  - number: '3.2'
    text: |-
      Bij wijziging van hoofdlijnen van het cultuurbeleid doet Onze Minister daarvan telkens mededeling aan beide kamers
      der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel3
  - number: '4'
    text: Onze Minister kan ten behoeve van cultuuruitingen subsidies verstrekken.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4
  - number: 4a.1
    text: |-
      Onze Minister stelt bij ministeriële regeling eenmaal per vier jaar regels vast voor de verstrekking van subsidies
      in de op die periode volgende periode van vier kalenderjaren.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4a
  - number: 4a.2
    text: 'De ministeriële regeling bevat in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4a
  - number: 4a.2.a
    text: een omschrijving van de activiteiten die voor subsidie in aanmerking komen;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4a
  - number: 4a.2.b
    text: de criteria die bij de subsidieverlening voor de onder a bedoelde activiteiten gehanteerd worden, en
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4a
  - number: 4a.2.c
    text: het financieel kader waarbinnen de subsidieverstrekking geschiedt.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4a
  - number: 4a.3
    text: |-
      De ministeriële regeling heeft betrekking op activiteiten die voor vier jaar voor subsidieverstrekking in
      aanmerking komen.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4a
  - number: 4a.4
    text: |-
      In afwijking van het derde lid kan Onze Minister in bijzondere gevallen subsidie verstrekken voor minder dan vier
      jaar.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4a
  - number: 4c.1
    text: Onze Minister verstrekt aan een fonds telkens voor een periode van vier kalenderjaren een subsidie.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4c
  - number: 4c.2
    text: |-
      In afwijking van het eerste lid kan Onze Minister voor minder dan vier kalenderjaren subsidie verstrekken, indien
      zich omstandigheden voordoen die daartoe aanleiding geven.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel4c
  - number: '5.1'
    text: |-
      Onze Minister kan op aanvraag ten behoeve van cultuuruitingen specifieke uitkeringen verstrekken van tenminste €
      4 500:
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: 5.1.a
    text: voor experimenten;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: 5.1.b
    text: ter bevordering van de totstandkoming van nieuwe voorzieningen;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: 5.1.c
    text: ter stimulering van activiteiten vanuit bestaande voorzieningen;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: 5.1.d
    text: ter bevordering van deskundigheid en onderzoek;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: 5.1.e
    text: ten behoeve van behoud van het cultureel erfgoed.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: '5.2'
    text: |-
      Specifieke uitkeringen als bedoeld in het eerste lid, onder *a*, *b*, *c* en *e*, worden gedurende ten hoogste 4
      jaren verstrekt.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: '5.3'
    text: Specifieke uitkeringen als bedoeld in het eerste lid, onder *d*, worden éénmalig verstrekt.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel5
  - number: '6'
    text: |-
      Onze Minister kan op aanvraag ten behoeve van cultuuruitingen specifieke uitkeringen verstrekken van tenminste €
      4 500 aan derden indien die subsidies gebaseerd zijn op een tussen Onze Minister en een provincie, een gemeente of
      het openbaar lichaam Bonaire, Sint Eustatius of Saba gemaakte bestuursovereenkomst.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel6
  - number: '7'
    text: |-
      Onze Minister kan ten behoeve van cultuuruitingen andere specifieke uitkeringen dan die bedoeld in
      de[ artikelen 5][ref1] en [6][ref2], verstrekken van tenminste € 4 500.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel6
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '5'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005904
        artikel: '6'
        hoofdstuk: III
  - number: '8.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het verstrekken van
      subsidies op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: '8.2'
    text: 'De regels, bedoeld in het eerste lid, kunnen betrekking hebben op:'
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.a
    text: de criteria op grond waarvan subsidie kan worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.b
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.c
    text: de vaststelling van een subsidieplafond;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.d
    text: de aanvraag van een subsidie;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.e
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.f
    text: de verplichtingen van de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.g
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8.2.h
    text: de betaling en terugvordering van de subsidie, alsmede het verlenen van voorschotten op de subsidie.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: '8.3'
    text: |-
      Indien bij of krachtens een algemene maatregel van bestuur, bedoeld in het eerste lid, wordt voorzien in een
      subsidieplafond, worden daarbij regels gesteld omtrent de wijze van verdeling.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: '8.4'
    text: |-
      Onverminderd de [artikelen 4a tot en met 4c][ref1] en [5, tweede en derde lid][ref2], kan bij een maatregel als
      bedoeld in het eerste lid worden bepaald dat een subsidie kan worden verstrekt voor perioden van ten hoogste vier
      jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel4a
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel5
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 4a
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0005904
        artikel: '5'
        hoofdstuk: III
  - number: '8.5'
    text: |-
      Onze Minister kan bij het verstrekken van een subsidie de ontvanger daarvan verplichtingen opleggen met
      inachtneming van het bepaalde bij of krachtens de maatregel, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: '8.6'
    text: |-
      De verplichtingen, bedoeld in het tweede lid, onderdeel f, en het vijfde lid, kunnen mede strekken ter bevordering
      van overheidsdoeleinden van algemene aard.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: '8.7'
    text: |-
      Uiterlijk een maand voordat de voordracht voor een maatregel als bedoeld in het eerste lid wordt gedaan, plaatst
      Onze Minister het ontwerp daarvan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8
  - number: 8a.1
    text: |-
      Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidie-ontvanger opgelegde verplichtingen
      zijn belast de bij besluit van Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8a
  - number: 8a.2
    text: |-
      De toezichthouder beschikt niet over de bevoegdheden, genoemd in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 8a.3
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8a
  - number: 8a.4
    text: |-
      Aan door Onze Minister verstrekte subsidies is de verplichting verbonden dat de subsidie-ontvanger aan een
      toezichthouder alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel8a
  - number: '9.1'
    text: |-
      Onze Minister wordt gemachtigd om namens de Staat tot oprichting of mede-oprichting over te gaan van
      privaatrechtelijke rechtspersonen met volledige rechtsbevoegdheid die tot doel hebben het instandhouden,
      ontwikkelen, sociaal en geografisch spreiden of anderszins verbreiden van één of meer cultuuruitingen te bevorderen
      door daartoe subsidies te verstrekken.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel9
  - number: '9.2'
    text: |-
      Onze Minister gaat tot oprichting of mede-oprichting van een privaatrechtelijke rechtspersoon als bedoeld in
      het eerste lid niet eerder over dan een maand nadat van het voornemen daartoe, onder overlegging van de concept-
      statuten, schriftelijk mededeling is gedaan aan beide Kamers van de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel9
  - number: 9a
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is van toepassing op een fonds, met uitzondering van
      [artikel 22 van die wet][ref2], voor zover het besluiten betreft die het bestuur van een fonds neemt ter uitvoering
      van de in [artikel 9, eerste lid][ref3], bedoelde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0005904#Artikel9
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel9a
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '22'
      - id: ref3
        bwb_id: BWBR0005904
        artikel: '9'
        hoofdstuk: IV
  - number: '10.1'
    text: |-
      Een besluit tot wijziging van de statuten treedt slechts in werking nadat Onze Minister daarmee heeft ingestemd. De
      [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '10.2'
    text: |-
      De leden van het bestuur van een fonds worden door Onze Minister benoemd, geschorst en ontslagen. In de statuten
      kan worden bepaald dat leden na voordracht van één of meer in de statuten genoemde organisaties kunnen worden
      benoemd.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel10
  - number: '10.3'
    text: |-
      Een fonds kan worden ontbonden door een besluit van het bestuur, welk besluit de goedkeuring van Onze Minister
      behoeft, alsmede door een besluit van Onze Minister gehoord het bestuur. In beide gevallen geeft het bestuur
      aan het liquidatiesaldo een bestemming die zoveel mogelijk in overeenstemming is met het doel van het fonds. Een
      besluit tot bestemming van het liquidatiesaldo treedt slechts in werking na goedkeuring door Onze Minister.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel10
  - number: '10.4'
    text: |-
      Het bestuur van een fonds stelt één of meer reglementen vast waarin in ieder geval worden vastgelegd de
      werkwijze, de procedures en de criteria die het bestuur bij het verstrekken van subsidies hanteert, alsmede de
      verplichtingen die aan de subsidie-ontvanger worden opgelegd. In deze reglementen kunnen voorts regels worden
      gesteld met betrekking tot de vaststelling van een subsidieplafond en de wijze van verdeling daarvan, de betaling
      en terugvordering van de subsidie alsmede de verlening van voorschotten op de subsidie. Onze Minister kan met
      betrekking tot genoemde onderwerpen het bestuur van een fonds voorschrijven ter zake een reglement te wijzigen. Een
      besluit tot vaststelling van een reglement of een wijziging daarvan treedt slechts in werking na goedkeuring door
      Onze Minister. Goedkeuring kan worden onthouden wegens strijd met het recht of het algemeen belang. Het niet tijdig
      bekendmaken van een besluit omtrent goedkeuring of een besluit tot verdaging van de beslissing omtrent goedkeuring
      heeft niet tot gevolg dat een besluit tot goedkeuring geacht wordt te zijn genomen.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel10
  - number: '10.5'
    text: |-
      Het bestuur van een fonds plaatst de statuten, wijzigingen daarvan, een reglement als bedoeld in het vierde lid,
      alsmede wijzigingen daarvan zo spoedig mogelijk na goedkeuring door Onze Minister in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel10
  - number: '11'
    text: |-
      Het bestuur van een fonds verstrekt subsidies als bedoeld in [artikel 9, eerste lid][ref1], bij beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel9
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '9'
        hoofdstuk: IV
  - number: '12.1'
    text: |-
      De fondsen opgericht door Onze Minister op grond van een machtiging krachtens de Fondsenwet scheppende kunsten
      (*Stb.* 1981, 355), gelden als fondsen, opgericht op grond van de machtiging van [artikel 9][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel9
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '9'
        hoofdstuk: IV
  - number: '12.2'
    text: |-
      De Stichting Fonds voor de letteren, opgericht bij akte van 28 juli 1965, en de Stichting Productiefonds voor
      Nederlandse Films, opgericht bij akte van 8 november 1956, gelden als fondsen, opgericht op grond van de machtiging
      van [artikel 9][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel9
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '9'
        hoofdstuk: IV
  - number: '12.3'
    text: |-
      De besturen van de fondsen, bedoeld in het eerste en tweede lid, dragen er zorg voor dat de statuten en reglementen
      als bedoeld in [artikel 10, eerste en vierde lid][ref1], binnen een jaar na inwerkingtreding van deze wet voldoen
      aan het bepaalde in [artikel 10][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0005904#Artikel10
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel12
    references:
