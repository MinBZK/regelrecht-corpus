        bwb_id: BWBR0005904
        artikel: '10'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0005904
        artikel: '10'
        hoofdstuk: IV
  - number: '14'
    text: De Fondsenwet scheppende kunsten (*Stb.* 1981, 355) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel14
  - number: '17'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip. Bij koninklijk besluit kan een ander
      tijdstip worden vastgesteld, waarop [artikel 8][ref1] in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel8
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: '8'
        hoofdstuk: III
  - number: '18'
    text: Deze wet kan worden aangehaald als Wet op het specifiek cultuurbeleid.
    url: https://wetten.overheid.nl/BWBR0005904/2015-01-01#Artikel18
