      In afwijking van [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref1] bedraagt de termijn voor het
      naar voren brengen van zienswijzen vier weken.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0018260/2009-01-01#ArtikelIV
