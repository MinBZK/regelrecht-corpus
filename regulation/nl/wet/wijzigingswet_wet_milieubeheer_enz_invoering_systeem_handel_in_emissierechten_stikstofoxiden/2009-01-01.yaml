preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is, om de emissies van stikstofoxiden in de lucht onder
    het voor Nederland geldende emissieplafond voor stikstofoxiden ingevolge richtlijn nr. 2001/81/EG van het Europees
    Parlement en de Raad van de Europese Unie van 23 oktober 2001 inzake nationale emissieplafonds voor bepaalde
    luchtverontreinigende stoffen (PbEG L 309) te brengen, in de Wet milieubeheer een regeling te treffen die handel in
    emissierechten voor stikstofoxiden mogelijk maakt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018260/2009-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Indien een aanvraag om een vergunning als bedoeld in [artikel 16.49, eerste lid][ref1], of
      [artikel 16.5, eerste lid][ref2], in verbinding met [artikel 16.5, tweede lid, van de Wet milieubeheer][ref3]
      wordt ingediend vóór de inwerkingtreding van [artikel I, onderdeel I][ref4], van deze wet, wordt die aanvraag
      aangemerkt als een aanvraag om een vergunning als bedoeld in [artikel 16.49, eerste lid][ref5], onderscheidenlijk
      [artikel 16.5, eerste lid][ref6], in verbinding met [artikel 16.5, tweede lid, van de Wet milieubeheer][ref7],
      zoals deze artikelen komen te luiden na de inwerkingtreding van [artikel I, onderdeel I][ref8], van deze wet.

      2 Indien de voorbereiding als bedoeld in [artikel 16.7][ref9] in verbinding met
      [artikel 16.49, tweede lid, van de Wet milieubeheer][ref10] heeft plaatsgevonden vóór de inwerkingtreding van
      [artikel I, onderdeel I][ref11], van deze wet, wordt die voorbereiding aangemerkt als een voorbereiding als bedoeld
      in [artikel 16.7][ref12] in verbinding met [artikel 16.49, tweede lid, van de Wet milieubeheer][ref13], zoals
      laatstbedoeld artikel komt te luiden na de inwerkingtreding van [artikel I, onderdeel I][ref14], van deze wet.


