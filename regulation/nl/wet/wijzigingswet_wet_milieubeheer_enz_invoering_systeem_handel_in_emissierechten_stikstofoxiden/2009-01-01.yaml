  - number: IV.2
    text: |-
      In afwijking van [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref1], neemt het bestuur van de
      emissieautoriteit zo spoedig mogelijk na de dag waarop [artikel I, onderdeel I][ref2], van deze wet in werking
      treedt, doch uiterlijk twee weken na die dag, een besluit op de aanvraag.


