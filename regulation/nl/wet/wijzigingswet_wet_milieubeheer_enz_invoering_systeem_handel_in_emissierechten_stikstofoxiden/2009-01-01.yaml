  - number: IV
    text: |-
      Met betrekking tot de voorbereiding van de beslissing op een ontvankelijke aanvraag om een vergunning
      als bedoeld in [artikel 16.49, eerste lid][ref1], of [artikel 16.5, eerste lid][ref2], in verbinding met
      [artikel 16.5, tweede lid, van de Wet milieubeheer][ref3], die wordt ingediend uiterlijk vier maanden voor de
      inwerkingtreding van [artikel I, onderdeel I][ref4], van deze wet, en de beslissing op die aanvraag geldt het
      volgende:

      1. In afwijking van [artikel 3:16, eerste lid, van de Algemene wet bestuursrecht][ref5] bedraagt de termijn voor
      het naar voren brengen van zienswijzen vier weken.

      2. In afwijking van [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref6], neemt het bestuur van
      de emissieautoriteit zo spoedig mogelijk na de dag waarop [artikel I, onderdeel I][ref7], van deze wet in werking
      treedt, doch uiterlijk twee weken na die dag, een besluit op de aanvraag.

      3. In afwijking van [artikel 20.3, eerste lid, van de Wet milieubeheer][ref8], bepaalt het bestuur van de
      emissieautoriteit dat het besluit terstond in werking treedt.

      4. Indien dit artikel eerder in werking treedt dan de Wet uniforme openbare voorbereidingsprocedure Awb, wordt tot
      het tijdstip waarop die wet in werking treedt:

      a. in het eerste lid in plaats van «[artikel 3:16, eerste lid][ref9]» gelezen: de
      [artikelen 3:11, eerste lid][ref10], en [3:13, derde lid][ref11];

      b. in het tweede lid in plaats van «In afwijking van
      [artikel 3:18, eerste lid, van de Algemene wet bestuursrecht][ref12], neemt het bestuur van de emissieautoriteit»
      gelezen: Het bestuur van de emissieautoriteit neemt.


