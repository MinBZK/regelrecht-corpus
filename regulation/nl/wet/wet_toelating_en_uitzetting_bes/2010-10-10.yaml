articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.a
    text: '*openbaar lichaam:* openbaar lichaam Bonaire, Sint Eustatius of Saba;'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.b
    text: '*Onze Minister:* Onze Minister van Justitie;'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.c
    text: |-
      *ambtenaren belast met de grensbewaking dan wel het toezicht op personen:* ambtenaren, bedoeld in
      [artikel 22a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 1.d
    text: |-
      *annulering van een visum:* intrekking van een visum met terugwerkende kracht tot en met het tijdstip van de
      verlening;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.e
    text: |-
      *machtiging tot voorlopig verblijf:* visum voor de toegang tot de openbare lichamen voor verblijf van meer dan
      drie maanden;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.f
    text: |-
      *referent:* een Nederlander of een in de openbare lichamen toegelaten en gevestigde vreemdeling dan wel het bevoegd
      gezag van een in de openbare lichamen kantoorhoudende rechtspersoon, die een aanvraag heeft ingediend omtrent een
      machtiging tot voorlopig verblijf ten behoeve van een vreemdeling;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.g
    text: |-
      *terugkeervisum:* visum voor de toegang tot de openbare lichamen van een visumplichtige persoon die de openbare
      lichamen tijdelijk zal verlaten;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.h
    text: |-
      *visum:* voor de toegang tot de openbare lichamen voor verblijf van niet langer dan drie maanden door Onze Minister
      van Buitenlandse Zaken afgegeven visum, alsmede een onder e of g bedoeld visum;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.i
    text: |-
      *verdragsvluchteling:* de vreemdeling die vluchteling is in de zin van het op 28 juli 1951 te Genève tot stand
      gekomen Verdrag betreffende de status van vluchtelingen (Trb. 1954, 88) en het op 31 januari 1967 te New York tot
      stand gekomen Protocol betreffende de status van vluchtelingen (Trb. 1967, 76) en op wie de bepalingen ervan van
      toepassing zijn;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1.j
    text: '*vreemdeling:* ieder die niet de Nederlandse nationaliteit bezit.'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1
  - number: 1a.1
    text: |-
      Deze wet is, met uitzondering van [hoofdstuk 2][ref1], van overeenkomstige toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1a
    references:
      - id: ref1
        bwb_id: BWBR0028571
        hoofdstuk: '2'
  - number: 1a.1.a
    text: Nederlanders, geboren buiten Bonaire, Sint Eustatius en Saba;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1a
  - number: 1a.1.b
    text: Nederlanders die buiten Bonaire, Sint Eustatius en Saba de Nederlandse nationaliteit verkregen hebben.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1a
  - number: 1a.2
    text: |-
      In afwijking van het eerste lid, is deze wet niet van overeenkomstige toepassing op Nederlanders die op dan wel in
      Aruba, Curaçao, Sint Maarten of het Europese deel van Nederland zijn geboren of de Nederlandse nationaliteit hebben
      verkregen, indien en voor zover deze wet niet op de vader of de moeder van toepassing is.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1a
  - number: 1a.3
    text: 'In afwijking van het eerste lid, is deze wet evenmin van overeenkomstige toepassing op Nederlanders, die:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1a
  - number: 1a.3.a
    text: |-
      direct voorafgaand aan 10 oktober 2010 gedurende een ononderbroken periode van tenminste een jaar hun woonplaats
      als bedoeld in artikel 10, eerste lid, van Boek 1 van het Burgerlijk Wetboek van de Nederlandse Antillen hebben
      gehad op de eilanden Bonaire, Sint Eustatius of Saba en die geboren zijn op dan wel in Aruba, Curaçao, Sint Maarten
      of het Europese deel van Nederland, dan wel in Aruba, Curaçao, Sint Maarten of het Europese deel van Nederland de
      Nederlandse nationaliteit verkregen hebben;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1a
  - number: 1a.3.b
    text: |-
      kinderen zijn van de onder a bedoelde Nederlanders en direct voorafgaand aan 10 oktober 2010 gedurende een
      ononderbroken periode van tenminste een jaar hun woonplaats hebben gehad op de eilanden Bonaire, Sint Eustatius
      of Saba.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel1a
  - number: '2'
    text: Toelating tot verblijf wordt van rechtswege toegekend of bij vergunning verleend.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2
  - number: 2a.1
    text: |-
      Onze Minister kan aan het hoofd van de desbetreffende Nederlandse diplomatieke of consulaire vertegenwoordiging
      aanwijzingen geven over de uitvoering van de bij of krachtens dit hoofdstuk gestelde regels inzake de verlening van
      de machtiging tot voorlopig verblijf door de ambtenaren werkzaam op die vertegenwoordiging door tussenkomst van en
      voor zover het de buitenlandse betrekkingen kan raken in overeenstemming met Onze Minister van Buitenlandse Zaken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2a
  - number: 2a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het bepaalde in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2a
  - number: 2b.1
    text: |-
      De aanvrager is, in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven regels, leges
      verschuldigd ter zake van de afdoening van een aanvraag tot het verlenen of wijzigen van een machtiging tot
      voorlopig verblijf dan wel terugkeervisum.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2b
  - number: 2b.2
    text: |-
      Het eerste lid is niet van toepassing indien op grond van de Rijkswet op de consulaire tarieven reeds een
      vergoeding is verschuldigd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2b
  - number: 2c.1
    text: |-
      De machtiging tot voorlopig verblijf wordt verleend onder beperkingen, verband houdend met het doel waarvoor het
      verblijf wordt toegestaan. Aan de machtiging kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2c.2
    text: |-
      Onze Minister kan het terugkeervisum met het oog op de bescherming van de belangen waarop het bepaalde bij of
      krachtens deze wet betrekking heeft onder beperkingen verlenen en daaraan voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2c.3
    text: |-
      Onze Minister kan alsnog voorschriften aan een reeds verleende machtiging tot voorlopig verblijf of reeds
      verleend terugkeervisum verbinden, voorschriften die daaraan zijn verbonden wijzigen, alsnog beperkingen daaraan
      verbinden, beperkingen wijzigen, de geldigheidsduur inkorten dan wel de machtiging tot voorlopig verblijf of het
      terugkeervisum intrekken:
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2c.3.a
    text: op verzoek van de vreemdeling;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2c.3.b
    text: indien uit naderhand gebleken feiten en omstandigheden komt vast te staan dat verlening ervan onjuist was;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2c.3.c
    text: |-
      indien feiten en omstandigheden zodanig zijn gewijzigd dat deze zich verzetten tegen de handhaving of ongewijzigde
      handhaving van het verleende; of
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2c.3.d
    text: indien de vreemdeling de op hem rustende verplichtingen krachtens deze wet niet naleeft.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2c.4
    text: |-
      Indien de vreemdeling nog geen toegang heeft verkregen kan Onze Minister de machtiging tot voorlopig verblijf
      annuleren op de gronden, vermeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2c
  - number: 2d.1
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze van indiening
      en de behandeling van een aanvraag tot verlening of wijziging van een machtiging tot voorlopig verblijf dan wel
      een terugkeervisum, daaronder begrepen de wijze waarop beschikkingen, kennisgevingen, mededelingen of berichten
      ingevolge dit hoofdstuk aan de vreemdeling of andere belanghebbenden worden bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2d
  - number: 2d.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kan worden bepaald in welke gevallen aan de verplichtingen die
      krachtens dit hoofdstuk op de betrokkene rusten kan worden voldaan door diens wettelijk vertegenwoordiger.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2d
  - number: 2e.1
    text: |-
      Indien Onze Minister besluit tot verlening van een machtiging tot voorlopig verblijf stelt hij de aanvrager daarvan
      schriftelijk in kennis. Een machtiging tot voorlopig verblijf kan tot uiterlijk drie maanden na de dagtekening van
      die kennisgeving worden afgegeven. In geval de machtiging tot voorlopig verblijf niet kan worden afgegeven in het
      land van herkomst of bestendig verblijf, op grond dat de Nederlandse vertegenwoordiging is gesloten of zich daar
      niet of niet langer bevindt, kan Onze Minister de termijn, bedoeld in de tweede volzin, eenmaal met ten hoogste
      drie maanden verlengen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2e
  - number: 2e.2
    text: |-
      De geldigheidsduur van een machtiging tot voorlopig verblijf bedraagt ten hoogste drie maanden vanaf de datum van
      afgifte, met dien verstande dat een machtiging tot voorlopig verblijf slechts een maal kan worden benut voor het
      verkrijgen van toegang tot een openbaar lichaam. De geldigheid van de machtiging tot voorlopig verblijf vervalt in
      elk geval met ingang van het tijdstip waarop de houder een aanvraag tot het verlenen van een verblijfsvergunning
      voor bepaalde tijd heeft gedaan. De geldigheidsduur van een machtiging tot voorlopig verblijf kan niet worden
      verlengd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2e
  - number: 2e.3
    text: |-
      De geldigheidsduur van een machtiging tot voorlopig verblijf kan de geldigheidsduur van het document
      voor grensoverschrijding van de vreemdeling niet overschrijden, met dien verstande dat het document voor
      grensoverschrijding na verloop van de machtiging tot voorlopig verblijf nog ten minste drie maanden geldig moet
      zijn. Onze Minister kan in bijzondere gevallen ontheffing verlenen van het bepaalde in de eerste volzin.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2e
  - number: 2e.4
    text: |-
      Onze Minister brengt de machtiging tot voorlopig verblijf aan in het document voor grensoverschrijding of op een
      blad waarop een visum kan worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2e
  - number: 2f.1
    text: 'De aanvraag om een machtiging tot voorlopig verblijf geschiedt:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2f
  - number: 2f.1.a
    text: |-
      bij de Nederlandse diplomatieke of consulaire vertegenwoordiging in het land van herkomst of van bestendig verblijf
      dan wel, bij gebreke daarvan, het dichtstbijzijnde land waar wel een vertegenwoordiging is gevestigd, dan wel bij
      het Kabinet van de Gouverneur van Aruba, Curaçao of Sint Maarten, door de vreemdeling in persoon;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2f
  - number: 2f.1.b
    text: bij Onze Minister door een referent.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2f
  - number: 2f.2
    text: |-
      De machtiging tot voorlopig verblijf wordt bij de vertegenwoordiging dan wel het Kabinet, bedoeld in het eerste
      lid, aan de vreemdeling in persoon afgegeven.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2f
  - number: 2f.3
    text: |-
      Onze Minister kan in overeenstemming met Onze Minister van Buitenlandse Zaken vrijstelling dan wel ontheffing
      verlenen van de verplichtingen, bedoeld in het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2f
  - number: 2g.1
    text: |-
      De vreemdeling dan wel de referent verstrekt Onze Minister de door hem voor de beoordeling van de aanvraag om een
      machtiging tot voorlopig verblijf verlangde gegevens en bescheiden desgevraagd in persoon.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2g
  - number: 2g.2
    text: |-
      Met het oog op de beoordeling van het vereiste ten aanzien van het beschikken over voldoende middelen van bestaan,
      gesteld bij of krachtens deze wet, kan Onze Minister van de vreemdeling zekerheidsstelling voor de daarmee gemoeide
      kosten verlangen tot een door Onze Minister te bepalen bedrag. Deze zekerheidsstelling kan mede omvatten het
      beschikken over een toereikende ziektekostenverzekering ter dekking van ziektekosten.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2g
  - number: 2h
    text: |-
      Onze Minister beslist binnen drie maanden na ontvangst van een aanvraag om verlening of wijziging van een
      machtiging tot voorlopig verblijf. Onze Minister kan deze termijn verlengen met ten hoogste drie maanden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2h
  - number: 2i.1
    text: 'Een terugkeervisum kan worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.1.a
    text: |-
      de vreemdeling niet door overlegging van documenten aannemelijk heeft gemaakt dat sprake is van een dringende reden
      die geen uitstel van vertrek mogelijk maakt;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.1.b
    text: de vreemdeling niet zelfstandig beschikt over een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.1.c
    text: |-
      de vreemdeling zich gedurende zijn verblijf in een openbaar lichaam aan maatregelen van toezicht op grond van deze
      wet heeft onttrokken;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.1.d
    text: |-
      uit een oogpunt van toezicht op grond van deze wet, opsporing of vervolging van strafbare feiten, tenuitvoerlegging
      van een vonnis of om andere gewichtige redenen bezwaar bestaat tegen vertrek van de vreemdeling uit de openbare
      lichamen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.1.e
    text: |-
      het naar het oordeel van Onze Minister in de rede ligt dat binnen de geldigheidsduur van het terugkeervisum
      een beslissing kan worden verwacht op een aanvraag tot het verlenen of verlengen van de geldigheidsduur van
      een verblijfsvergunning voor bepaalde tijd of onbepaalde tijd of wijziging daarvan, of op een bezwaarschrift of
      beroepschrift daaromtrent, terwijl bij of krachtens deze wet of een rechterlijke beslissing de uitzetting van de
      vreemdeling achterwege dient te blijven totdat op die aanvraag, dat bezwaar of beroep is beslist;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.1.f
    text: |-
      de vreemdeling in afwachting is van de beslissing op diens aanvraag om een verblijfsvergunning voor bepaalde tijd
      dan wel in afwachting is van de beslissing op een bezwaarschrift of beroepschrift tegen een dergelijke beslissing
      en is ingereisd zonder de benodigde machtiging tot voorlopig verblijf;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.1.g
    text: |-
      de vreemdeling een gevaar vormt voor de openbare orde of de nationale veiligheid dan wel zich schuldig heeft
      gemaakt aan of verdacht wordt van terrorisme, oorlogsmisdaden, of andere misdaden tegen de menselijkheid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2i.2
    text: |-
      Een terugkeervisum wordt geweigerd ten behoeve van de terugkeer uit het land van herkomst van de vreemdeling
      die houder is van een verblijfsvergunning voor bepaalde tijd verband houdend met bescherming als bedoeld in
      [artikel 12a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 12a
        hoofdstuk: '5'
  - number: 2i.3
    text: |-
      Een terugkeervisum wordt geweigerd ten behoeve van de terugkeer uit het land van herkomst van de vreemdeling die
      een aanvraag verband houdend met bescherming als bedoeld in [artikel 12a][ref1] heeft gedaan en die in afwachting
      is van een beslissing omtrent die aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 12a
        hoofdstuk: '5'
  - number: 2i.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van de gronden,
      bedoeld in het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2i
  - number: 2j.1
    text: |-
      De geldigheidsduur van een terugkeervisum kan de geldigheidsduur van de aan de vreemdeling verleende
      verblijfsvergunning voor bepaalde tijd niet overschrijden en bedraagt ten hoogste een jaar. Het terugkeer-visum kan
      worden verleend voor een of meer reizen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2j
  - number: 2j.2
    text: |-
      Indien de vreemdeling verblijf houdt in afwachting van de beslissing omtrent een verblijfsvergunning voor bepaalde
      tijd bedraagt de geldigheidsduur van een terugkeervisum ten hoogste drie maanden en is het geldig voor één reis.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2j
  - number: 2j.3
    text: Onze Minister kan vrijstelling dan wel ontheffing verlenen van het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2j
  - number: 2j.4
    text: De geldigheidsduur van een terugkeervisum kan niet worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2j
  - number: 2k.1
    text: |-
      Een terugkeervisum wordt door de vreemdeling in persoon aangevraagd. Onze Minister brengt het terugkeervisum aan in
      het document voor grensoverschrijding of op een blad waarop een visum kan worden aangebracht.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2k
  - number: 2k.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent de wijze van indiening
      en de behandeling van een aanvraag tot verlening van een terugkeervisum.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2k
  - number: 2l
    text: |-
      Onze Minister beslist binnen twee weken na ontvangst van een aanvraag om verlening van een terugkeervisum. Onze
      Minister kan deze termijn verlengen met ten hoogste twee weken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2l
  - number: 2m.1
    text: |-
      Een ieder begeeft zich bij grensoverschrijding langs een grensdoorlaatpost binnen de tijd dat deze is opengesteld
      en vervoegt zich aldaar bij een ambtenaar belast met de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2m
  - number: 2m.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de plaatsen aangewezen, waar, al dan niet tijdelijke,
      grensdoorlaatposten zijn gevestigd en worden de tijden vastgesteld gedurende welke de grensdoorlaatposten zijn
      opengesteld.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2m
  - number: 2n.1
    text: |-
      Degene aan wie de toegang is geweigerd, dient de openbare lichamen onmiddellijk te verlaten met inachtneming van
      daartoe gegeven aanwijzingen van de ambtenaar belast met de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2n
  - number: 2n.2
    text: |-
      Indien de persoon, bedoeld in het eerste lid, de openbare lichamen is binnengekomen aan boord van een vaartuig of
      luchtvaartuig in gebruik bij een vervoersonderneming, dient hij de openbare lichamen onmiddellijk te verlaten met
      dat vervoer of een hem door een ambtenaar belast met de grensbewaking aangewezen vervoermiddel.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2n
  - number: 2n.3
    text: |-
      De verplichtingen, bedoeld in het eerste en tweede lid, gelden niet indien de persoon, bedoeld in het eerste lid,
      een vreemdeling is die een aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd onder een
      beperking verband houdend met bescherming als bedoeld in [artikel 12a][ref1] heeft ingediend en daarop nog niet
      is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2n
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 12a
        hoofdstuk: '5'
  - number: 2o.1
    text: |-
      De vreemdeling aan wie de toegang is geweigerd kan worden verplicht zich op te houden in een door de ambtenaar
      belast met de grensbewaking aangewezen ruimte of plaats.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2o
  - number: 2o.2
    text: Een ruimte of plaats, bedoeld in het eerste lid, kan worden beveiligd tegen ongeoorloofd vertrek.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2o
  - number: 2o.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het voor
      de beveiligde ruimte of plaats, bedoeld in het tweede lid, geldende regime, waaronder begrepen de nodige
      beheersmaatregelen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2o
  - number: 2o.4
    text: |-
      Een krachtens het derde lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers der Staten-
      Generaal overgelegd. Hij treedt in werking op een tijdstip dat, nadat vier weken na de overlegging zijn verstreken,
      bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of door ten
      minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven dat het
      onderwerp bij wet wordt geregeld. In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk
      ingediend. Indien het voorstel van wet wordt ingetrokken of indien een van beide kamers van de Staten-Generaal
      besluit het voorstel niet aan te nemen, wordt de algemene maatregel van bestuur ingetrokken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2o
  - number: 2p
    text: |-
      Indien de vreemdeling aan wie de toegang is geweigerd op grond van enig wettelijk voorschrift dan wel een voor
      Nederland bindend besluit van een volkenrechtelijke organisatie zijn vrijheid is ontnomen, blijft de toegang
      geweigerd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2p
  - number: 2q.1
    text: |-
      De vervoerder door wiens tussenkomst een persoon aan een grens of binnen het grondgebied van de openbare lichamen
      wordt gebracht, neemt de nodige maatregelen en houdt het toezicht dat redelijkerwijs van hem kan worden gevorderd
      om te voorkomen dat door de persoon niet wordt voldaan aan [artikel 2r, eerste lid, onder a en b][ref1] dan wel een
      voor Nederland bindend besluit van een volkenrechtelijke organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel2r
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2q
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 2r
        hoofdstuk: '3'
  - number: 2q.2
    text: |-
      De vervoerder kan worden verplicht om een afschrift te nemen van het op de vreemdeling betrekking hebbende document
      voor grensoverschrijding en dit ter hand te stellen aan de ambtenaar belast met de grensbewaking.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2q
  - number: 2q.3
    text: |-
      De vervoerder, bedoeld in het eerste lid, kan ten behoeve van de grensbewaking en het tegengaan van illegale
      immigratie worden verplicht passagiersgegevens te verzamelen en te verstrekken aan de ambtenaren belast met de
      grensbewaking.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2q
  - number: 2q.4
    text: |-
      De vervoerder, bedoeld in het eerste lid, vervoert op aanwijzing van de ambtenaar belast met grensbewaking degene
      aan wie de toegang is geweigerd terug naar de plaats, het land of de derde staat van waar zij die persoon heeft
      vervoerd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2q
  - number: 2q.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van het eerste
      tot het met het derde lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2q
  - number: 2q.6
    text: |-
      Het eerste tot en met het derde lid zijn ook van toepassing op iedere vervoerder die zich buiten de openbare
      lichamen schuldig maakt aan schending van de in die leden bedoelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2q
  - number: 2r.1
    text: 'De ambtenaar belast met de grensbewaking weigert de toegang aan een vreemdeling die:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.1.a
    text: niet in het bezit is van een geldig document voor grensoverschrijding;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.1.b
    text: |-
      indien hij visumplichtig is, geen houder is van een voor toegang benodigd visum voor kort verblijf, terugkeervisum
      of machtiging tot voorlopig verblijf, tenzij de vreemdeling houder is van een geldige verblijfstitel;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.1.c
    text: het doel en de omstandigheden van het voorgenomen verblijf niet aannemelijk kan maken;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.1.d
    text: |-
      niet kan aantonen dat hij beschikt over voldoende middelen van bestaan voor zowel de duur van het voorgenomen
      verblijf als voor de terugreis naar de plaats of het land van herkomst of voor de doorreis naar een plaats of derde
      land waar de toegang is gewaarborgd, dan wel niet in staat is deze middelen rechtmatig te verwerven; of
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.1.e
    text: |-
      een gevaar vormt voor de openbare orde, de openbare veiligheid, de volksgezondheid of de internationale
      betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.2
    text: |-
      De ambtenaar belast met de grensbewaking kan de toegang tot de openbare lichamen weigeren aan een vreemdeling die
      eerder de maximale duur van het toegestane verblijf in de openbare lichamen heeft overschreden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.3
    text: |-
      De ambtenaar belast met de grensbewaking weigert de toegang aan de vreemdeling die is gesignaleerd ter fine van
      weigering van de toegang, tenzij Onze Minister de toegang noodzakelijk acht op grond van klemmende redenen van
      humanitaire aard, in het belang van het land of de internationale betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.4
    text: |-
      De ambtenaar belast met de grensbewaking weigert niet dan ingevolge een bijzondere aanwijzing van Onze Minister de
      toegang aan een vreemdeling die te kennen geeft dat hij bescherming nodig heeft.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2r.5
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het eerste tot
      en met het vierde lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2r
  - number: 2s.1
    text: |-
      De ambtenaar belast met de grensbewaking onderwerpt een ieder bij grensoverschrijding aan een minimale controle ter
      vaststelling van de identiteit en nationaliteit op basis van het document voor grensoverschrijding.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2s
  - number: 2s.2
    text: |-
      De minimale controle behelst een onderzoek van het document voor grensoverschrijding en op niet-systematische basis
      een onderzoek naar signaleringen ter fine van opsporing en een onderzoek naar signaleringen ter fine van weigering
      van toegang en verblijf.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2s
  - number: 2t.1
    text: |-
      De ambtenaar belast met de grensbewaking onderwerpt vreemdelingen bij grensoverschrijding aan een grondige
      controle.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
  - number: 2t.2
    text: |-
      De grondige controle behelst bij inreis de verificatie of is voldaan aan de voorwaarden voor toegang, gesteld bij
      of krachtens [artikel 2r][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel2r
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 2r
        hoofdstuk: '3'
  - number: 2t.3
    text: 'Bij de grondige controle kan bij uitreis worden onderzocht:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
  - number: 2t.3.a
    text: of de toegang van de vreemdeling tot de plaats, het land of de staat van bestemming redelijkerwijs is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
  - number: 2t.3.b
    text: |-
      of de vreemdeling de maximale duur van het toegestane verblijf in de openbare lichamen heeft overschreden, in welk
      geval dat wordt gesignaleerd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
  - number: 2t.3.c
    text: of de vreemdeling is gesignaleerd ter fine van opsporing of weigering van toegang en verblijf.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
  - number: 2t.4
    text: |-
      Bij of krachtens algemene maatregel van bestuur wordt bepaald hoe een signalering ter fine van weigering van
      de toegang wordt geregistreerd en onder welke voorwaarden de bevoegde autoriteiten, inbegrepen de bevoegde
      autoriteiten van Aruba, Curaçao en Sint Maarten, daarvan kennis kunnen nemen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
  - number: 2t.5
    text: |-
      In afwijking van [artikel 1a][ref1] is het eerste lid niet van overeenkomstige toepassing op Nederlanders.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2t
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 1a
        hoofdstuk: '1'
  - number: 2u.1
    text: |-
      Indien buitengewone of onvoorzienbare gebeurtenissen een zodanige verkeersdrukte veroorzaken dat ondanks volledige
      benutting van alle personele, facilitaire en organisatorische voorzieningen aan de grensdoorlaatpost onredelijk
      lange wachttijden ontstaan, kan de grenscontrole met instemming van Onze Minister tijdelijk worden versoepeld.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2u
  - number: 2u.2
    text: |-
      Bij de toepassing van het eerste lid kan niet worden afgeweken van [artikel 2v][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel2v
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2u
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 2v
        hoofdstuk: '3'
  - number: 2v.1
    text: De documenten voor grensoverschrijding van vreemdelingen worden bij grensoverschrijding afgestempeld.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2v.2
    text: 'In afwijking van het eerste lid wordt geen stempel aangebracht:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2v.2.a
    text: |-
      in de documenten voor grensoverschrijding van staatshoofden of hoogwaardigheidsbekleders wier aankomst vooraf langs
      diplomatieke weg officieel is aangekondigd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2v.2.b
    text: |-
      in de «crew member licences» of «crew member certificates» van piloten respectievelijk bemanningsleden van
      vliegtuigen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2v.2.c
    text: |-
      in de documenten voor grensoverschrijding van zeelieden die slechts gedurende het afmeren van hun schip in de
      binnengevaren haven van de openbare lichamen verblijven;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2v.2.d
    text: |-
      in de documenten voor grensoverschrijding van bemanningsleden en passagiers van cruiseschepen die uit hoofde van de
      door deze wet gestelde regels niet aan grenscontroles zijn onderworpen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2v.2.e
    text: op de sédula waarvan een Nederlander de houder is.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2v.3
    text: |-
      In afwijking van het eerste lid kan op verzoek van de vreemdeling van afstempeling worden afgezien, indien
      afstempeling voor deze vreemdeling tot ernstige moeilijkheden zou kunnen leiden. In dat geval wordt de in-
      of uitreis op een inlegblad geregistreerd met vermelding van de naam en het nummer van het document voor
      grensoverschrijding.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2v
  - number: 2w
    text: |-
      Bij afwezigheid van een inreisstempel in het document voor grensoverschrijding wordt aangenomen dat de houder
      daarvan niet of niet langer voldoet aan de voorwaarden inzake de maximale verblijfsduur, tenzij de houder het
      tegendeel aannemelijk maakt. In dat geval vermeldt de ambtenaar belast met de grensbewaking dan wel het toezicht
      op vreemdelingen overeenkomstig regels te stellen bij algemene maatregel van bestuur in het document voor
      grensoverschrijding van de vreemdeling op welke datum en welke plaats hij de openbare lichamen is ingereisd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2w
  - number: 2x.1
    text: |-
      In afwijking van de [artikelen 2s][ref1] en [2t][ref2] behoeven niet aan grenscontroles te worden onderworpen:


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel2s
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel2t
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2x
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 2s
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 2t
        hoofdstuk: '3'
  - number: 2x.1.a
    text: staatshoofden en hoogwaardigheidsbekleders, wier aankomst langs diplomatieke weg officieel is aangekondigd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2x
  - number: 2x.1.b
    text: |-
      piloten en bemanningsleden die houder zijn van een «crew member licence» of «crew member certificate» tijdens de
      uitoefening van hun functie; en
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2x
  - number: 2x.1.c
    text: bij of krachtens algemene maatregel van bestuur aangewezen andere categorieën van personen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2x
  - number: 2x.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen specifieke grenscontrolevoorschriften worden vastgesteld
      ten aanzien van de bij of krachtens het eerste lid aangewezen categorieën van personen, de verschillende soorten
      grenzen en de vervoermiddelen die voor de overschrijding van de grenzen van de openbare lichamen worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel2x
  - number: '3.1'
    text: 'Van rechtswege hebben toelating tot verblijf in de openbare lichamen:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.1.a
    text: vreemdelingen van overheidswege uitgezonden, zolang zij in overheidsdienst zijn;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.1.b
    text: |-
      vreemdelingen, die in dienst zijn geweest van een openbaar lichaam en uit dien hoofde pensioen of uitkering bij
      wijze van pensioen genieten, alsmede de niet hertrouwde weduwen van zodanige vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.1.c
    text: |-
      in de openbare lichamen als zodanig toegelaten beroepsconsuls, beroepsconsulaire ambtenaren en ander consulair
      personeel;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.1.d
    text: militairen, gedurende de tijd dat zij in de openbare lichamen zijn gestationeerd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.1.e
    text: |-
      opvarenden van tot de zee- of luchtmacht van enige mogendheid behorende schepen of luchtvaartuigen, gedurende de
      tijd, dat de openbare lichamen met toestemming van de bevoegde autoriteit worden aangedaan;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.1.f
    text: |-
      de niet van tafel en bed gescheiden echtgenoot en minderjarige kinderen van de onder a, b, c en d genoemde
      vreemdelingen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.1.g
    text: |-
      vreemdelingen, in een openbaar lichaam geboren, mits zij de leeftijd van zestien jaar hebben bereikt, en sedert hun
      geboorte onafgebroken in de openbare lichamen zijn toegelaten geweest.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: '3.2'
    text: |-
      Bij algemene maatregel van bestuur kan de categorie van rechtswege toegelatenen tot de openbare lichamen, bedoeld
      in het eerste lid, worden uitgebreid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: '3.3'
    text: |-
      Op een daartoe strekkende aanvraag wordt aan de vreemdelingen, bedoeld in het eerste lid, door Onze Minister een
      verklaring verstrekt waaruit blijkt dat zij van rechtswege toelating tot verblijf in de openbare lichamen hebben.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: '3.4'
    text: |-
      Aan de toelating tot verblijf van rechtswege kunnen ten aanzien van de echtgenoot van een toegelatene door Onze
      Minister voorwaarden worden verbonden met betrekking tot het uitoefenen van een bepaald beroep of bedrijf.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: '3.5'
    text: |-
      Eveneens hebben van rechtswege toelating tot verblijf Nederlanders, bedoeld in [artikel 1a][ref1], die meerderjarig
      zijn en beschikken over:


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel1a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 1a
        hoofdstuk: '1'
  - number: 3.5.a
    text: |-
      een verklaring van goed gedrag, gedurende de laatste vijf jaren, afgegeven door het bevoegde gezag binnen twee
      maanden voor hun aankomst in de openbare lichamen of een schriftelijke verklaring waaruit zulks genoegzaam blijkt,
      en
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: 3.5.b
    text: |-
      huisvesting en voldoende middelen van bestaan om in hun levensonderhoud te voorzien, overeenkomstig bij of
      krachtens algemene maatregel van bestuur te stellen regels.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: '3.6'
    text: |-
      Van rechtswege toelating tot verblijf hebben ook de minderjarige Nederlandse kinderen van de Nederlanders, bedoeld
      in het vijfde lid, indien een van die ouders het ouderlijk gezag heeft.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel3
  - number: '4.1'
    text: |-
      De periode, bedoeld in [artikel 3, eerste lid, onder g][ref1], wordt niet onderbroken door een verblijf buiten de
      openbare lichamen voor studiedoeleinden of wegens geneeskundige behandeling, tenzij de vreemdeling blijk geeft zijn
      toelating tot de openbare lichamen te willen opgeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
        hoofdstuk: '4'
  - number: '4.2'
    text: |-
      Indien de vreemdeling niet binnen een jaar na de voltooiing van zijn studie of de beëindiging van de geneeskundige
      behandeling, is teruggekeerd naar de openbare lichamen, wordt zijn toelating geacht te zijn vervallen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel4
  - number: '4.3'
    text: |-
      Het bepaalde in [artikel 13][ref1], blijft onverminderd van toepassing op de minderjarige, niet vallende
      onder de bepaling van [artikel 3, eerste lid, onder g][ref2], die buiten de openbare lichamen verblijft voor
      studiedoeleinden of wegens geneeskundige behandeling.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel3
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '13'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: '3'
        hoofdstuk: '4'
  - number: '5'
    text: 'De toelating van rechtswege eindigt:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel5
  - number: 5.a
    text: door het vervallen van de reden waarom zij is toegekend;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel5
  - number: 5.b
    text: |-
      ten aanzien van degene, die op grond van het bepaalde in [artikel 3, eerste lid, onder g][ref1], van rechtswege
      is toegelaten, door een onafgebroken verblijf van langer dan drie jaar buiten de openbare lichamen, tenzij de
      vreemdeling buiten de openbare lichamen verblijft voor studiedoeleinden of wegens geneeskundige behandeling. De
      bepaling van [artikel 4, tweede lid][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel4
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: '4'
        hoofdstuk: '4'
  - number: 5a
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het verblijf zonder
      verblijfsvergunning voor bepaalde tijd voor verblijf niet langer dan zes maanden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel5a
  - number: '6.1'
    text: |-
      Vreemdelingen die in de openbare lichamen verblijven en die niet bij of krachtens [artikel 3][ref1] of [5a][ref2]
      zijn toegelaten tot verblijf, behoeven een verblijfsvergunning voor bepaalde of onbepaalde tijd.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 5a
        hoofdstuk: '4'
  - number: '6.2'
    text: |-
      Een verblijfsvergunning voor bepaalde tijd wordt verleend voor ten hoogste vijf achtereenvolgende jaren. Bij
      algemene maatregel van bestuur kunnen regels worden gesteld over de geldigheidsduur van de verblijfsvergunning voor
      bepaalde tijd en de verlenging van de geldigheidsduur van de verblijfsvergunning voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel6
  - number: '7.1'
    text: |-
      De verblijfsvergunning voor bepaalde of onbepaalde tijd wordt verleend door Onze Minister. Onze Minister kan
      aan de vreemdeling, die toelating van rechtswege of bij vergunning verleend heeft, een document of schriftelijke
      verklaring verschaffen, waaruit die toelating blijkt. Onze Minister kan modellen vaststellen voor de documenten en
      de schriftelijke verklaring.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '7.2'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: 7.2.a
    text: de wijze van indiening en behandeling van een aanvraag;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: 7.2.b
    text: de gegevens die de vreemdeling in persoon moet verstrekken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '7.3'
    text: |-
      De vreemdeling is, in door Onze Minister te bepalen gevallen en volgens door Onze Minister te geven regels, leges
      verschuldigd ter zake van de afdoening van een aanvraag tot het verlenen, verlengen van de geldigheidsduur of
      wijzigen van een verblijfsvergunning voor bepaalde of onbepaalde tijd. Daarbij kan Onze Minister tevens bepalen
      dat de vreemdeling voor de afgifte van een document waaruit de verblijfspositie blijkt leges verschuldigd is,
      inbegrepen een verklaring als bedoeld in [artikel 3, derde lid][ref1]. Als betaling achterwege blijft, wordt de
      aanvraag niet in behandeling genomen dan wel het document niet afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
        hoofdstuk: '4'
  - number: '7.4'
    text: |-
      De verblijfsvergunning voor bepaalde of onbepaalde tijd wordt verleend met ingang van de dag waarop de vreemdeling
      heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet eerder dan met ingang van de dag waarop de
      aanvraag is ontvangen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '7.5'
    text: |-
      De geldigheidsduur van de verblijfsvergunning voor bepaalde tijd wordt verlengd met ingang van de dag waarop de
      vreemdeling heeft aangetoond dat hij aan alle voorwaarden voldoet, maar niet eerder dan met ingang van de dag na
      die waarop de geldigheidsduur van de verblijfsvergunning waarvoor verlenging is gevraagd, afloopt.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '7.6'
    text: |-
      Indien de vreemdeling de aanvraag tot verlenging dan wel de gegevens waaruit blijkt dat aan de voorwaarden wordt
      voldaan niet tijdig heeft ingediend en hem dit niet is toe te rekenen, kan de verblijfsvergunning voor bepaalde
      tijd worden verlengd met ingang van de dag na die waarop de geldigheidsduur van de verblijfsvergunning waarvoor
      verlenging is gevraagd afloopt.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '7.7'
    text: |-
      Een verblijfsvergunning voor bepaalde tijd wordt verleend onder beperkingen, verband houdende met het doel waarvoor
      het verblijf wordt toegestaan. Aan de verblijfsvergunning voor bepaalde tijd kunnen voorschriften worden verbonden.
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de beperkingen en voorschriften.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '7.8'
    text: |-
      De beperkingen en voorschriften, bedoeld in het zevende lid, kunnen op aanvraag van de vreemdeling worden gewijzigd
      met inachtneming van de procedure, voorgeschreven voor de verlening van de verblijfsvergunning voor bepaalde tijd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '7.9'
    text: |-
      Een verblijfsvergunning voor onbepaalde tijd wordt niet onder beperkingen verleend. Aan de verblijfsvergunning voor
      onbepaalde tijd worden geen voorschriften verbonden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel7
  - number: '8.1'
    text: |-
      Indien na een geheel of gedeeltelijk afwijzende beschikking een nieuwe aanvraag wordt gedaan is de vreemdeling
      gehouden nieuw gebleken feiten of veranderde omstandigheden te vermelden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel8
  - number: '8.2'
    text: |-
      Wanneer geen nieuw gebleken feiten of veranderde omstandigheden worden vermeld, kan Onze Minister de aanvraag
      afwijzen onder verwijzing naar zijn eerdere afwijzende beschikking zonder de vreemdeling in de gelegenheid te
      stellen de aanvraag aan te vullen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel8
  - number: '9.1'
    text: 'De verblijfsvergunning voor bepaalde of onbepaalde tijd kan door Onze Minister worden geweigerd:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.1.a
    text: |-
      indien de vreemdeling niet beschikt over een geldige machtiging tot voorlopig verblijf die overeenkomt met het
      verblijfsdoel waarvoor de verblijfsvergunning voor bepaalde tijd is aangevraagd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.1.b
    text: met het oog op de openbare orde of het algemeen belang, waaronder economische redenen mede worden begrepen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.1.c
    text: |-
      indien niet kan worden aangetoond dat degene voor wie toelating wordt verzocht over voldoende middelen van bestaan
      zal beschikken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: '9.2'
    text: De redenen tot weigering worden in de beslissing vermeld.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: '9.3'
    text: |-
      De aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd wordt niet afgewezen wegens het
      ontbreken van een geldige machtiging tot voorlopig verblijf, indien het betreft:
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.3.a
    text: |-
      de vreemdeling die de nationaliteit bezit van één der door Onze Minister in overeenstemming met Onze Minister van
      Buitenlandse Zaken bij ministeriële regeling aan te wijzen landen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.3.b
    text: de vreemdeling voor wie het, gelet op diens gezondheidstoestand, niet verantwoord is om te reizen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.3.c
    text: de vreemdeling die slachtoffer of getuige-aangever is van mensenhandel;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.3.d
    text: |-
      de vreemdeling die onmiddellijk voorafgaande aan de aanvraag in het bezit was van een verblijfsvergunning voor
      bepaalde tijd verband houdend met bescherming als bedoeld in [artikel 12a][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 12a
        hoofdstuk: '5'
  - number: 9.3.e
    text: |-
      de vreemdeling die tijdig een aanvraag heeft ingediend tot wijziging van een verblijfsvergunning voor bepaalde
      tijd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: 9.3.f
    text: de vreemdeling die behoort tot een bij algemene maatregel van bestuur aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: '9.4'
    text: |-
      De voordracht voor een krachtens het derde lid, onder f, vast te stellen algemene maatregel van bestuur wordt niet
      gedaan dan nadat het ontwerp in de Staatscourant is bekendgemaakt en aan een ieder de gelegenheid is geboden om
      binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis van Onze Minister
      te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-Generaal overgelegd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel9
  - number: '10'
    text: |-
      Hij die handelt in strijd met de hem verleende verblijfsvergunning voor bepaalde tijd, wordt geacht gehandeld te
      hebben zonder vergunning.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel10
  - number: '11.1'
    text: |-
      Bij algemene maatregel van bestuur, worden regelen gesteld inzake het storten van een waarborgsom, het bedrag
      hiervan, de kosten, welke daaruit bestreden mogen worden, de wijze van beheer, de gevallen waarin ontheffing kan
      worden verleend, de terugbetaling, de gevallen waarin na overlijden of vertrek van de vreemdeling de waarborgsom in
      de consignatiekas wordt gestort, alsmede al hetgeen verder in dit verband voorziening vereist.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: '11.2'
    text: 'De voorwaarde van het storten van een waarborgsom wordt niet gesteld aan:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.a
    text: |-
      minderjarige kinderen van een in de openbare lichamen geboren en aldaar woonachtige moeder, die tot haar huwelijk
      de Nederlandse nationaliteit had;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.b
    text: |-
      de onder a genoemde kinderen, die bij het bereiken van hun meerderjarigheid in de openbare lichamen hun woonplaats
      hebben;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.c
    text: |-
      minderjarige kinderen, in de openbare lichamen geboren, die de Nederlandse nationaliteit niet hebben en waarvan een
      der ouders in de openbare lichamen woonachtig is en langer dan tien achtereenvolgende jaren, krachtens vergunning
      is toegelaten;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.d
    text: |-
      de onder c genoemde kinderen, die bij het bereiken van hun meerderjarigheid in de openbare lichamen hun woonplaats
      hebben;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.e
    text: vrouwen geboren in de openbare lichamen, die tot hun huwelijk de Nederlandse nationaliteit hadden;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.f
    text: vreemdelingen die gehuwd zijn met een Nederlander, mits niet van tafel en bed gescheiden;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.g
    text: |-
      mannen, die gehuwd zijn met een in de openbare lichamen geboren vrouw, die de Nederlandse nationaliteit tot haar
      huwelijk had, mits niet van tafel en bed gescheiden;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.h
    text: de niet van tafel en bed gescheiden echtgenoot van de man die van rechtswege is toegelaten;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.i
    text: vreemdelingen die van rechtswege toelating tot verblijf hebben in de openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: 11.2.j
    text: |-
      de vreemdeling die een aanvraag heeft gedaan tot het verlenen van een verblijfsvergunning voor bepaalde tijd om
      redenen verband houdend met bescherming als bedoeld in [artikel 12a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 12a
        hoofdstuk: '5'
  - number: '11.3'
    text: De waarborgsom is niet vatbaar voor enig beslag, tenzij deze in de consignatiekas is gestort.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel11
  - number: '12'
    text: 'De toelating bij vergunning verleend eindigt:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
  - number: 12.a
    text: door verloop van de tijd waarvoor de verblijfsvergunning voor bepaalde tijd is afgegeven;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
  - number: 12.b
    text: door vertrek uit de openbare lichamen, indien het betreft een verblijfsvergunning voor bepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
  - number: 12.c
    text: |-
      door het verlaten van de woonplaats in een openbaar lichaam met het doel de woonplaats buiten de openbare lichamen
      te vestigen, indien het betreft een verblijfsvergunning voor bepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
  - number: 12.d
    text: |-
      door een ononderbroken verblijf buiten de openbare lichamen gedurende langer dan een jaar, behoudens in geval van
      overmacht en behoudens het geval, bedoeld in [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel4
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '4'
        hoofdstuk: '4'
  - number: 12.e
    text: door het verkrijgen van een toelating van rechtswege;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
  - number: 12.f
    text: door intrekking van de verblijfsvergunning;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
  - number: 12.g
    text: door uitzetting.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12
  - number: 12a.1
    text: |-
      Onze Minister kan een verblijfsvergunning voor bepaalde tijd verlenen om redenen verband houdend met bescherming
      aan de vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12a
  - number: 12a.1.a
    text: verdragsvluchteling is;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12a
  - number: 12a.1.b
    text: |-
      aannemelijk heeft gemaakt dat hij bij uitzetting een reëel risico loopt om te worden onderworpen aan folteringen,
      aan onmenselijke of vernederende behandelingen of bestraffingen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12a
  - number: 12a.1.c
    text: |-
      als echtgenoot of echtgenote of minderjarig kind feitelijk behoort tot het gezin van de vreemdeling, bedoeld onder
      a of b, die dezelfde nationaliteit heeft als die vreemdeling en gelijktijdig met deze vreemdeling de openbare
      lichamen is ingereisd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12a
  - number: 12a.1.d
    text: |-
      als partner of als meerderjarig kind zodanig afhankelijk is van de vreemdeling, bedoeld onder a of b, dat hij om
      die reden behoort tot het gezin van deze vreemdeling, die dezelfde nationaliteit heeft als deze vreemdeling en
      gelijktijdig met deze vreemdeling de openbare lichamen is ingereisd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12a
  - number: 12a.2
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel12a
  - number: '13'
    text: |-
      Ingeval de toelating van rechtswege toegekend of krachtens vergunning verleend eindigt, houdt tevens op de
      afhankelijke toelating van de gezinsleden.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel13
  - number: '14'
    text: |-
      De verblijfsvergunning voor bepaalde of onbepaalde tijd kan door Onze Minister bij een met redenen omklede
      beslissing worden ingetrokken:
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel14
  - number: 14.a
    text: |-
      op grond van een onherroepelijk geworden veroordeling terzake van een misdrijf tot een onvoorwaardelijke
      vrijheidsstraf van drie maanden of langer;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel14
  - number: 14.b
    text: met het oog op de goede zeden;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel14
  - number: 14.c
    text: indien dit in het algemeen belang wenselijk is;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel14
  - number: 14.d
    text: |-
      op grond van het verkeren in zodanige staat van behoeftigheid, dat de vreemdeling niet langer naar behoren in het
      onderhoud van zichzelf en zijn wettig gezin kan voorzien;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel14
  - number: 14.e
    text: |-
      indien de vreemdeling niet voldoet aan één of meer van de aan zijn verblijfsvergunning voor bepaalde tijd verbonden
      beperkingen of voorschriften.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel14
  - number: '15.1'
    text: |-
      Overeenkomstig bij algemene maatregel van bestuur te stellen regels kan, indien het belang van de openbare orde of
      de veiligheid zulks vordert, door Onze Minister de vrijheid van beweging worden beperkt van de vreemdeling die geen
      geldige verblijfsvergunning voor bepaalde of onbepaalde tijd bezit en geen toelating van rechtswege heeft.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15
  - number: '15.2'
    text: |-
      Toepassing van het eerste lid blijft achterwege indien en wordt beëindigd zodra de vreemdeling te kennen geeft de
      openbare lichamen te willen verlaten en hiertoe voor hem ook gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15
  - number: 15a.1
    text: |-
      Onze Minister kan de vreemdeling wiens aanvraag tot het verlenen van een verblijfsvergunning voor bepaalde tijd
      verband houdend met bescherming als bedoeld in [artikel 12a][ref1] is afgewezen, de aanwijzing geven zich op te
      houden in een bepaalde ruimte of op een bepaalde plaats en aldaar de aanwijzingen van de bevoegde autoriteit in
      acht te nemen, ook indien de beschikking waarbij de aanvraag is afgewezen nog niet onherroepelijk is dan wel de
      werking van de beschikking is opschort.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15a
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 12a
        hoofdstuk: '5'
  - number: 15a.2
    text: Op aanvraag van de vreemdeling kan een andere ruimte of plaats worden aangewezen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15a
  - number: 15a.3
    text: |-
      Een aanwijzing als bedoeld in het eerste lid blijft achterwege indien de vrijheid van beweging van de vreemdeling
      is beperkt in verband met het onderzoek naar de aanvraag om een verblijfsvergunning voor bepaalde tijd en de
      vreemdeling zich daadwerkelijk beschikbaar heeft gehouden en de beschikking tot afwijzing meer dan acht weken na de
      indiening van de aanvraag is gegeven.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15a
  - number: 15a.4
    text: |-
      De aanwijzing, bedoeld in het eerste lid, vervalt indien de beschikking waarbij de aanvraag is afgewezen is
      vernietigd of zodra het vertrek van de vreemdeling uit de ruimte of plaats nodig is om de openbare lichamen te
      verlaten.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15a
  - number: 15a.5
    text: |-
      De termijn, bedoeld in het derde lid, wordt opgeschort gedurende de termijn waarin de vreemdeling de beperking van
      zijn bewegingsvrijheid niet in acht heeft genomen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15a
  - number: 15b.1
    text: |-
      Indien zulks voor de uitzetting noodzakelijk is, kan Onze Minister in het geval, bedoeld in
      [artikel 15a, eerste lid][ref1], de vreemdeling een ruimte of plaats aanwijzen, die is beveiligd tegen ongeoorloofd
      vertrek.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel15a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 15a
        hoofdstuk: '8'
  - number: 15b.2
    text: |-
      De [artikelen 15a, tweede tot en met vijfde lid][ref1], en [15c, derde lid][ref2], zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel15a
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel15c
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15b
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 15a
        hoofdstuk: '8'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 15c
        hoofdstuk: '8'
  - number: 15c.1
    text: |-
      Indien het belang van de openbare orde of de nationale veiligheid zulks vordert, kan, met het oog op de uitzetting,
      door Onze Minister in bewaring worden gesteld de vreemdeling die:
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15c
  - number: 15c.1.a
    text: geen toelating van rechtswege en geen verblijfsvergunning voor bepaalde of onbepaalde tijd heeft;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15c
  - number: 15c.1.b
    text: |-
      het op grond van een besluit van Onze Minister of een rechterlijke beslissing is toegestaan de beslissing omtrent
      een verblijfsvergunning voor bepaalde of onbepaalde tijd in de openbare lichamen af te wachten.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15c
  - number: 15c.2
    text: |-
      Indien de voor de terugkeer van de vreemdeling noodzakelijke bescheiden voorhanden zijn, dan wel binnen korte
      termijn voorhanden zullen zijn, wordt het belang van de openbare orde geacht de bewaring van de vreemdeling te
      vorderen, tenzij de vreemdeling toelating van rechtswege heeft gehad of een verblijfsvergunning voor bepaalde of
      onbepaalde tijd heeft gehad.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15c
  - number: 15c.3
    text: |-
      Bewaring van een vreemdeling blijft achterwege indien en wordt beëindigd zodra de vreemdeling te kennen geeft de
      openbare lichamen te willen verlaten en hiertoe voor hem ook gelegenheid bestaat.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15c
  - number: 15c.4
    text: Bewaring krachtens het eerste lid, onder b, of het tweede lid, duurt in geen geval langer dan vier weken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15c
  - number: 15d
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld omtrent de toepassing van dit hoofdstuk. Daarbij
      kan worden voorzien in de mogelijkheid van verhaal van kosten van bewaring op de vreemdeling zelf en, indien hij
      minderjarig is, op degenen die het wettig gezag over hem uitoefenen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel15d
  - number: '16.1'
    text: |-
      De vreemdeling die niet of niet langer van rechtswege is toegelaten of een verblijfsvergunning voor
      bepaalde of onbepaalde tijd heeft en aan wie het niet of niet langer is toegestaan de beslissing omtrent een
      verblijfsvergunning voor bepaalde of onbepaalde tijd in de openbare lichamen af te wachten, verlaat de openbare
      lichamen binnen een in [artikel 16a][ref1] bepaalde termijn.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel16a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 16a
        hoofdstuk: '9'
        paragraaf: '1'
  - number: '16.2'
    text: |-
      Indien de werking van de beschikking, waarbij de aanvraag is afgewezen of de verblijfsvergunning is ingetrokken,
      is opgeschort, kan van de vreemdeling medewerking worden gevorderd aan de voorbereiding van het vertrek uit de
      openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16
  - number: 16a.1
    text: |-
      Nadat de toelating van rechtswege of bij vergunning verleend is geëindigd dan wel het de vreemdeling niet langer is
      toegestaan de beslissing omtrent een aanvraag tot het verlenen, wijzigen of verlengen van een verblijfsvergunning
      in de openbare lichamen af te wachten, verlaat de vreemdeling de openbare lichamen uit eigen beweging binnen vier
      weken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
  - number: 16a.2
    text: |-
      In afwijking van het eerste lid verlaat de vreemdeling, indien de beroepstermijn ongebruikt verstrijkt en
      tijdens die termijn de werking van de beschikking, waarbij de aanvraag is afgewezen of de verblijfsvergunning is
      ingetrokken dan wel niet is verlengd, is opgeschort, de openbare lichamen onmiddellijk.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
  - number: 16a.3
    text: 'In afwijking van het eerste lid verlaat de vreemdeling:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
  - number: 16a.3.a
    text: |-
      wiens toelating krachtens [artikel 5a][ref1] is geëindigd; of


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel5a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 5a
        hoofdstuk: '4'
  - number: 16a.3.b
    text: die onmiddellijk voorafgaand aan zijn binnenkomst in de openbare lichamen geen toelating heeft gehad,
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
  - number: 16a.4
    text: 'Onze Minister kan, in afwijking van het eerste lid, de vertrektermijn verkorten tot minder dan vier weken:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
  - number: 16a.4.a
    text: in het belang van de uitzetting; of
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
  - number: 16a.4.b
    text: in het belang van de openbare orde of nationale veiligheid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16a
  - number: 16b.1
    text: 'Onze Minister kan de vreemdeling uitzetten:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16b
  - number: 16b.1.a
    text: die geen toelating van rechtswege heeft;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16b
  - number: 16b.1.b
    text: die geen verblijfsvergunning voor bepaalde of onbepaalde tijd heeft;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16b
  - number: 16b.1.c
    text: |-
      aan wie het niet is toegestaan de beslissing omtrent een aanvraag tot het verlenen, verlengen of wijzigen van een
      verblijfsvergunning voor bepaalde of onbepaalde tijd in de openbare lichamen af te wachten, en
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16b
  - number: 16b.1.d
    text: die niet binnen een bij deze wet gestelde termijn de openbare lichamen uit eigen beweging heeft verlaten.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16b
  - number: 16b.2
    text: |-
      Indien de werking van de beschikking waarbij de aanvraag is afgewezen of waarbij de verblijfsvergunning voor
      bepaalde of onbepaalde tijd is ingetrokken is opgeschort, kan van de vreemdeling medewerking worden gevorderd aan
      de voorbereiding van de uitzetting.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16b
  - number: 16b.3
    text: |-
      Uitzetting blijft achterwege zolang het, gelet op de gezondheidstoestand van de vreemdeling of die van een van zijn
      gezinsleden, niet verantwoord is om te reizen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16b
  - number: 16c
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de toepassing van de [paragrafen 1][ref1] en 2
      van dit hoofdstuk. Daarbij kan worden voorzien in de mogelijkheid van verhaal van de kosten van uitzetting op de
      vreemdeling zelf en, indien hij minderjarig is, op degenen die het wettig gezag over hem uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Hoofdstuk9
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16c
    references:
      - id: ref1
        bwb_id: BWBR0028571
        hoofdstuk: '9'
        paragraaf: '1'
  - number: 16d.1
    text: 'De vreemdeling kan door Onze Minister ongewenst worden verklaard:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16d.1.a
    text: |-
      indien hij geen toelating van rechtswege of bij vergunning verleend heeft en hij bij herhaling een bij deze wet
      strafbaar gesteld feit heeft begaan;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16d.1.b
    text: |-
      indien hij bij onherroepelijk geworden rechterlijk vonnis is veroordeeld wegens een misdrijf waartegen een
      gevangenisstraf van drie jaren of meer is bedreigd dan wel hem ter zake de maatregel als bedoeld in artikel 39,
      derde lid, van het Wetboek van Strafrecht BES is opgelegd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16d.1.c
    text: |-
      indien hij geen toelating van rechtswege of bij vergunning verleend heeft en een gevaar vormt voor de openbare orde
      of de nationale veiligheid;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16d.1.d
    text: ingevolge een verdrag; of
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16d.1.e
    text: in het belang van de internationale betrekkingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16d.2
    text: |-
      Indien de bekendmaking van de beschikking, waarbij de vreemdeling ongewenst wordt verklaard, geschiedt door
      toezending, wordt van de beschikking mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16d.3
    text: |-
      De ongewenst verklaarde vreemdeling kan geen toelating van rechtswege of bij vergunning verleend hebben in de
      openbare lichamen. Hij kan evenmin toestemming hebben om de beslissing omtrent een verblijfsvergunning voor
      bepaalde of onbepaalde tijd in de openbare lichamen af te wachten.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16d
  - number: 16e.1
    text: Onze Minister kan op aanvraag van de vreemdeling besluiten tot opheffing van de ongewenstverklaring.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16e
  - number: 16e.2
    text: |-
      De ongewenstverklaring wordt opgeheven indien de vreemdeling tien jaren onafgebroken buiten de openbare lichamen
      verblijf heeft gehad en zich in die periode geen van de gronden, bedoeld in [artikel 16d, eerste lid][ref1], hebben
      voorgedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel16d
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 16d
        hoofdstuk: '9'
        paragraaf: '3'
  - number: 16e.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de toepassing van het eerste
      en tweede lid en [artikel 16d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel16d
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel16e
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 16d
        hoofdstuk: '9'
        paragraaf: '3'
  - number: '17.1'
    text: 'Aan de vreemdeling wordt schriftelijk mededeling gedaan van:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: 17.1.a
    text: |-
      de beschikking op een aanvraag om een verblijfsvergunning voor bepaalde of onbepaalde tijd, alsmede van de
      beperkingen en voorschriften, verbonden aan de verblijfsvergunning voor bepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: 17.1.b
    text: |-
      de beschikking, houdende wijziging van een verblijfsvergunning voor bepaalde tijd of van de daaraan verbonden
      beperkingen of voorschriften;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: 17.1.c
    text: de intrekking van een vergunning;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: 17.1.d
    text: de beschikking tot uitzetting;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: 17.1.e
    text: de beschikking tot inbewaringstelling;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: 17.1.f
    text: |-
      de beschikking op een aanvraag als bedoeld in [artikel 3, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel3
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '3'
        hoofdstuk: '4'
  - number: '17.2'
    text: |-
      De mededeling wordt zoveel mogelijk aan de vreemdeling in persoon gedaan. Ten aanzien van minderjarigen is
      mededeling aan de ouders of voogden voldoende.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: '17.3'
    text: |-
      De mededelingen genoemd in het eerste lid onder c, d en e worden niet gegeven dan na de vreemdeling ter zake
      te hebben gehoord dan wel opgeroepen om daarover te worden gehoord en moeten in ieder geval aan de vreemdeling,
      respectievelijk aan het hoofd van het wettig gezin worden gedaan.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel17
  - number: '18'
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel18
  - number: '19'
    text: |-
      In afwijking van de artikelen 16, eerste lid, en 56, eerste lid, van de Wet administratieve rechtspraak BES
      bedraagt de termijn voor het indienen van een beroep- of bezwaarschrift vier weken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel19
  - number: '20'
    text: 'Bij of krachtens algemene maatregel van bestuur, kunnen:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel20
  - number: 20.a
    text: |-
      met het oog op het algemeen belang algemene regelen worden vastgesteld, welke bij het verlenen van de in
      [artikel 6][ref1] vermelde verblijfsvergunningen in acht moeten worden genomen;


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel6
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '6'
        hoofdstuk: '5'
  - number: 20.b
    text: |-
      bepaalde havens, reden, landingsplaatsen en luchtvaartterreinen worden aangewezen, waarbuiten vreemdelingen niet
      mogen ontschepen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel20
  - number: 20.c
    text: |-
      de verplichtingen van de gezagvoerders en andere opvarenden van de in de openbare lichamen aankomende schepen en
      luchtvaartuigen worden geregeld, onverkort het bepaalde in [artikel 22][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: '22'
        hoofdstuk: '11'
  - number: 20.d
    text: regelingen worden getroffen in verband met het passagiersverkeer en ter bevordering van het toerisme;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel20
  - number: 20.e
    text: |-
      regelingen worden getroffen in verband met de toelating van ondernemers en werknemers ter bevordering van
      productieve investeringen in de openbare lichamen en de internationale handel en dienstverlening.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel20
  - number: '21.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van vreemdelingen die krachtens de bepalingen
      van deze wet verblijfsvergunning voor bepaalde of onbepaalde tijd hebben verkregen, regelen worden gesteld met
      betrekking tot hun vertrek uit de openbare lichamen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel21
  - number: '21.2'
    text: 'Het vertrek kan alleen worden geweigerd op grond:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel21
  - number: 21.2.a
    text: dat de vreemdeling vervolgd wordt wegens een misdrijf;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel21
  - number: 21.2.b
    text: |-
      dat hij terzake van een misdrijf is veroordeeld, gedurende de tijd dat het betreffende vonnis nog niet voor
      tenuitvoerlegging vatbaar is;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel21
  - number: 21.2.c
    text: dat hij alsnog moet ondergaan een vrijheidsstraf hem opgelegd bij in kracht van gewijsde gegaan vonnis;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel21
  - number: 21.2.d
    text: dat hij zijn financiële verplichtingen jegens de overheid niet is nagekomen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel21
  - number: 21.2.e
    text: dat hij in de openbare lichamen in militaire dienst is overeenkomstig de desbetreffende bepalingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel21
  - number: '22.1'
    text: |-
      De gezagvoerder, die niet tot verblijf in de openbare lichamen gerechtigde vreemdelingen heeft aangebracht, is
      verplicht die vreemdelingen voor zijn rekening weder uit de openbare lichamen te vervoeren of te doen vervoeren.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22
  - number: '22.2'
    text: |-
      Indien hij dit nalaat zullen de kosten aan de uitzetting van bedoelde vreemdelingen verbonden, zomede alle andere
      noodzakelijk gemaakte kosten op de gezagvoerder, de reder of de luchtvaartmaatschappij worden verhaald.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22
  - number: '22.3'
    text: |-
      Het vertrek van een schip of luchtvaartuig, dat in de openbare lichamen niet thuishoort, kan door Onze Minister
      met de sterke arm worden belet, zolang aan het in het eerste lid gestelde niet is voldaan of voor de voldoening van
      eventuele kosten geen genoegzame zekerheid is gesteld.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22
  - number: 22a.1
    text: |-
      Met het toezicht op de naleving en de uitvoering van de wettelijke voorschriften met betrekking tot de
      grensbewaking en met betrekking tot het toezicht op personen zijn belast:
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22a.1.a
    text: de ambtenaren van de Koninklijke marechaussee;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22a.1.b
    text: de ambtenaren van politie;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22a.1.c
    text: de bij besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22a.2
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22a.2.a
    text: de in het belang van de grensbewaking en het toezicht te treffen voorzieningen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22a.2.b
    text: |-
      de verplichtingen waaraan personen zijn onderworpen met het oog op de controle in het belang van de grensbewaking
      en het toezicht.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22a.3
    text: |-
      De ambtenaren van de Koninklijke Marechaussee, bedoeld in het eerste lid, onderdeel a, en de ambtenaren van
      politie, bedoeld in het eerste lid, onderdeel b, oefenen de grensbewaking uit onder leiding van de Commandant van
      de Koninklijke Marechaussee en het toezicht op personen onder leiding van de korpschef.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22a
  - number: 22b.1
    text: |-
      De korpschef en de Commandant der Koninklijke marechaussee geven Onze Minister door hem gevraagde inlichtingen over
      de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22b
  - number: 22b.2
    text: |-
      Onze Minister kan aan de korpschef en aan de Commandant der Koninklijke marechaussee aanwijzingen geven over
      de uitvoering van deze wet. Onze Minister kan individuele aanwijzingen geven aan de ambtenaren, bedoeld in
      [artikel 22a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22b
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22a
        hoofdstuk: '12'
        paragraaf: '1'
  - number: 22b.3
    text: 'Onze Minister kan aanwijzingen geven over de inrichting van de werkprocessen en bedrijfsvoering aan:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22b
  - number: 22b.3.a
    text: de korpschef, door tussenkomst van de beheerder van het politiekorps;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22b
  - number: 22b.3.b
    text: de Commandant van de Koninklijke marechaussee, door tussenkomst van de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22b
  - number: 22b.4
    text: Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste, tweede en derde lid.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22b
  - number: 22c
    text: |-
      Op de uitoefening van de in deze paragraaf bedoelde bevoegdheden is titel 5.2 van de Algemene wet bestuursrecht van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22c
  - number: 22d.1
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd,
      hetzij op grond van feiten en omstandigheden die, naar objectieve maatstaven gemeten, een redelijk vermoeden van
      illegaal verblijf opleveren hetzij ter bestrijding van illegaal verblijf na grensoverschrijding, personen staande
      te houden ter vaststelling van hun identiteit, nationaliteit en verblijfsrechtelijke positie. Degene die stelt
      Nederlander te zijn, maar dat niet kan aantonen, kan worden onderworpen aan de dwangmiddelen als bedoeld in het
      tweede en vijfde lid. Bij algemene maatregel van bestuur kunnen de documenten worden aangewezen waarover een
      vreemdeling moet beschikken ter vaststelling van zijn identiteit, nationaliteit en verblijfsrechtelijke positie.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22d
  - number: 22d.2
    text: |-
      Indien de identiteit van de staande gehouden persoon niet onmiddellijk kan worden vastgesteld, mag hij worden
      overgebracht naar een plaats bestemd voor verhoor. Hij wordt aldaar niet langer dan gedurende zes uren opgehouden,
      met dien verstande, dat de tijd tussen middernacht en negen uur voormiddags niet wordt meegerekend.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22d
  - number: 22d.3
    text: |-
      Indien de identiteit van de staande gehouden persoon onmiddellijk kan worden vastgesteld en indien blijkt dat
      deze persoon geen toelating tot verblijf geniet, dan wel niet onmiddellijk blijkt dat hij toelating tot verblijf
      heeft, mag hij worden overgebracht naar een plaats bestemd voor verhoor. Hij wordt aldaar niet langer dan gedurende
      zes uren opgehouden, met dien verstande, dat de tijd tussen middernacht en negen uur voormiddags niet wordt
      meegerekend.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22d
  - number: 22d.4
    text: |-
      Indien nog grond bestaat voor het vermoeden dat de opgehouden persoon geen toelating tot verblijf heeft, kan de in
      het tweede en derde lid bepaalde termijn door de Commandant van de Koninklijke marechaussee respectievelijk door de
      korpschef, in het belang van het onderzoek met ten hoogste acht en veertig uren worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22d
  - number: 22d.5
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn bevoegd de opgehouden persoon aan diens kleding of lichaam te
      onderzoeken, alsmede zaken van deze persoon te doorzoeken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22d
  - number: 22d.6
    text: |-
      Bij algemene maatregel van bestuur worden nadere regelen gegeven omtrent de toepassing van de voorgaande leden van
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22d
  - number: 22e.1
    text: |-
      Indien de ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen op
      grond van feiten en omstandigheden, naar objectieve maatstaven gemeten, een redelijk vermoeden hebben dat met
      een vervoermiddel personen worden vervoerd met betrekking tot wie zij een toezichthoudende taak hebben, zijn
      zij bevoegd het vervoermiddel te onderzoeken. De ambtenaren zijn in dat geval bevoegd van de bestuurder van het
      voertuig of van de schipper van het vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hen
      aangewezen plaats overbrengt teneinde het vervoermiddel te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22e
  - number: 22e.2
    text: |-
      Indien de ambtenaren belast met de grensbewaking op grond van feiten en omstandigheden, naar objectieve maatstaven
      gemeten, een redelijk vermoeden hebben dat met een luchtvaartuig personen worden vervoerd met betrekking tot wie
      zij een toezichthoudende taak hebben, zijn zij bevoegd het luchtvaartuig te onderzoeken. De ambtenaren zijn in dat
      geval bevoegd van de gezagvoerder van een luchtvaartuig te vorderen dat deze zijn luchtvaartuig naar een door hen
      aangewezen plaats overbrengt teneinde het luchtvaartuig te onderzoeken. Bij of krachtens algemene maatregel van
      bestuur kunnen nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22e
  - number: 22f.1
    text: |-
      De ambtenaren, belast met de grensbewaking, en de ambtenaren, belast met het toezicht op vreemdelingen, zijn
      bevoegd om, ter vervulling van hun taken, reis- en identiteitspapieren van personen in te nemen, tijdelijk in
      bewaring te nemen alsmede om hierin aantekeningen te maken. Bij of krachtens algemene maatregel van bestuur worden
      hierover nadere regels gesteld.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22f
  - number: 22f.2
    text: |-
      Het reis- of identiteitspapier wordt aan de vreemdeling teruggegeven indien hij te kennen geeft het openbaar
      lichaam te willen verlaten en hij ook daadwerkelijk vertrekt. Ingeval van uitzetting kan het reis- en
      identiteitspapier worden overgedragen aan de persoon belast met de grensbewaking in het land waar de toelating
      is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22f
  - number: 22g.1
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      een woning te betreden zonder toestemming van de bewoner, indien er op grond van feiten en omstandigheden, naar
      objectieve maatstaven gemeten, een redelijk vermoeden bestaat dat op deze plaats een vreemdeling verblijft die geen
      toelating tot verblijf heeft.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22g
  - number: 22g.2
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn tevens bevoegd elke plaats te betreden, daar onder begrepen een
      woning zonder de toestemming van de bewoner, voor zover dat nodig is ter uitzetting van de vreemdeling dan wel voor
      de inbewaringstelling van de vreemdeling op grond van [artikel 15c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel15c
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22g
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 15c
        hoofdstuk: '8'
  - number: 22h.1
    text: 'Bij algemene maatregel van bestuur kan ten aanzien van vreemdelingen worden voorzien in een verplichting tot:'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.1.a
    text: |-
      het kennis geven van verandering van woon- of verblijfplaats binnen de openbare lichamen en van vertrek naar een
      plaats buiten de openbare lichamen;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.1.b
    text: |-
      het verstrekken van gegevens welke van belang kunnen zijn voor de toepassing van de bij of krachtens deze wet
      gestelde regels;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.1.c
    text: het verlenen van medewerking aan het vastleggen van gegevens met het oog op identificatie;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.1.d
    text: |-
      het verlenen van medewerking aan een medisch onderzoek naar een ziekte aangewezen bij of krachtens de Wet voor de
      volksgezondheid BES, ter bescherming van de volksgezondheid of in het kader van de beoordeling van een aanvraag om
      een verblijfsvergunning voor bepaalde tijd of onbepaalde tijd;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.1.e
    text: aanmelding binnen een bepaalde termijn na binnenkomst in een openbaar lichaam;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.1.f
    text: periodieke aanmelding;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.1.g
    text: |-
      het inleveren van het document of schriftelijke verklaring waaruit de verblijfsvergunning voor bepaalde tijd of
      onbepaalde tijd dan wel het verblijf van rechtswege blijkt.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22h.2
    text: |-
      In gevallen waarin Onze Minister zulks in het belang van de openbare orde of de nationale veiligheid nodig
      oordeelt, kan hij aan een persoon op wie deze wet van toepassing is een individuele verplichting tot periodieke
      aanmelding bij de korpschef opleggen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22h
  - number: 22i.1
    text: |-
      De vreemdeling die in een openbaar lichaam verblijf houdt, houdt zich, in verband met het onderzoek naar de
      inwilligbaarheid van de aanvraag om een verblijfsvergunning voor bepaalde tijd beschikbaar op een door Onze
      Minister aangewezen plaats, overeenkomstig hem daartoe door de bevoegde autoriteit gegeven aanwijzingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22i
  - number: 22i.2
    text: |-
      Ter ondersteuning van het onderzoek of een aanvraag tot het verlenen van de verblijfsvergunning voor bepaalde
      tijd verband houdend met bescherming als bedoeld in [artikel 12a][ref1] kan worden ingewilligd, zijn de ambtenaren
      belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen bevoegd om een zodanige
      vreemdeling staande te houden en aan diens kleding of lichaam te onderzoeken, alsmede zijn bagage te doorzoeken
      met het oog op eventuele aanwezigheid van reis- of identiteitspapieren, documenten of bescheiden, die noodzakelijk
      zijn voor de beoordeling van zijn verzoek. Gelijke bevoegdheid bestaat indien die vreemdeling te kennen geeft een
      aanvraag te willen indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel12a
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22i
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 12a
        hoofdstuk: '5'
  - number: 22i.3
    text: |-
      De ambtenaren belast met de grensbewaking en de ambtenaren belast met het toezicht op vreemdelingen zijn bevoegd
      een zodanige vreemdeling die zich in verband met het onderzoek op een plaats als bedoeld in het eerste lid bevindt
      aan diens kleding of lichaam te onderzoeken, alsmede zijn bagage te doorzoeken met het oog op de veiligheid op
      die plaats.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22i
  - number: 22j
    text: |-
      In afwijking van artikel 16 van de Wet administratieve rechtspraak BES is het instellen van beroep als bedoeld
      in de [artikelen 22l][ref1] en [22n][ref2] tegen een besluit als bedoeld in [artikel 22k][ref3], niet aan enige
      termijn gebonden.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22l
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel22n
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel22k
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22j
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22l
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 22n
        hoofdstuk: '14'
      - id: ref3
        bwb_id: BWBR0028571
        artikel: 22k
        hoofdstuk: '14'
  - number: 22k.1
    text: |-
      Een aanwijzing op grond van [artikel 2o, eerste lid][ref1], [artikel 22i, eerste lid][ref2], de ophouding
      en de verlenging van de ophouding, bedoeld in [artikel 22d, tweede, derde en vierde lid][ref3], de weigering
      van de toegang, bedoeld in [artikel 2r][ref4], en een ingevolge hoofdstuk 8 genomen maatregel strekkende tot
      vrijheidsbeperking of vrijheidsontneming, wordt voor de toepassing van artikel 3 van de Wet administratieve
      rechtspraak BES gelijkgesteld met een beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel2o
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel22i
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel22d
      [ref4]: https://wetten.overheid.nl/BWBR0028571#Artikel2r
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22k
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 2o
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 22i
        hoofdstuk: '13'
      - id: ref3
        bwb_id: BWBR0028571
        artikel: 22d
        hoofdstuk: '12'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0028571
        artikel: 2r
        hoofdstuk: '3'
  - number: 22k.2
    text: Hoofdstuk 4 van de Wet administratieve rechtspraak BES is niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22k
  - number: 22k.3
    text: |-
      In afwijking van artikel 17 van de Wet administratieve rechtspraak BES wordt door de griffier van het Gerecht geen
      griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22k
  - number: 22l.1
    text: |-
      Uiterlijk op de achtentwintigste dag na de bekendmaking van een besluit tot oplegging van een vrijheidsontnemende
      maatregel als bedoeld in hoofdstuk 8 stelt Onze Minister het Gerecht, bedoeld in artikel 1, eerste lid, onderdeel
      b, van de Wet administratieve rechtspraak BES hiervan in kennis, tenzij de vreemdeling voordien zelf beroep heeft
      ingesteld. Zodra het Gerecht de kennisgeving heeft ontvangen wordt de vreemdeling geacht beroep te hebben ingesteld
      tegen het besluit tot oplegging van een vrijheidsontnemende maatregel. Het beroep strekt tevens tot een verzoek om
      toekenning van schadevergoeding.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22l
  - number: 22l.2
    text: |-
      Het Gerecht bepaalt onmiddellijk het tijdstip van het onderzoek ter terechtzitting. De zitting vindt uiterlijk
      op de veertiende dag na ontvangst van het beroepschrift dan wel de kennisgeving plaats. Het Gerecht roept de
      vreemdeling op om in persoon dan wel in persoon of bij raadsman en Onze Minister om bij gemachtigde te verschijnen
      teneinde te worden gehoord. In afwijking van artikel 23, eerste lid, tweede volzin, en het derde lid, van de Wet
      administratieve rechtspraak BES bedraagt de termijn voor het indienen van alle op het beroepschrift betrekking
      hebbende stukken en een verweerschrift vier weken na de dag van verzending van het beroepschrift aan Onze Minister
      en kan deze termijn niet worden verlengd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22l
  - number: 22l.3
    text: |-
      Het Gerecht doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak wordt binnen zeven dagen na de
      sluiting van het onderzoek gedaan.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22l
  - number: 22l.4
    text: |-
      Indien het Gerecht bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel in strijd
      is met deze wet dan wel bij afweging van alle daarbij betrokken belangen in redelijkheid niet gerechtvaardigd is,
      verklaart hij het beroep gegrond. In dat geval beveelt het Gerecht de opheffing van de maatregel of een wijziging
      van de wijze van tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22l
  - number: 22m.1
    text: |-
      In afwijking van artikel 76 van de Wet administratieve rechtspraak BES bedraagt de termijn voor het instellen van
      het hoger beroep één week.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22m
  - number: 22m.2
    text: |-
      In afwijking van de artikel 77, eerste lid, van de Wet administratieve rechtspraak BES wordt door de griffier van
      het Hof geen griffierecht geheven.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22m
  - number: 22n.1
    text: |-
      Indien het beroep, bedoeld in [artikel 22l][ref1], ongegrond is verklaard en de vreemdeling beroep instelt tegen
      het voortduren van de vrijheidsontneming, sluit het Gerecht het vooronderzoek binnen een week na ontvangst van het
      beroepschrift. In afwijking van artikel 35 van de Wet administratieve rechtspraak BES kan het Gerecht ook zonder
      toestemming van partijen bepalen dat het onderzoek ter zitting achterwege blijft.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22l
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22n
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22l
        hoofdstuk: '14'
  - number: 22n.2
    text: |-
      Het Gerecht doet mondeling of schriftelijk uitspraak. De schriftelijke uitspraak wordt binnen zeven dagen na de
      sluiting van het onderzoek gedaan.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22n
  - number: 22n.3
    text: |-
      Indien het Gerecht bij het beroep van oordeel is dat de toepassing of tenuitvoerlegging van de maatregel in strijd
      is met deze wet dan wel bij afweging van alle daarbij betrokken belangen in redelijkheid niet gerechtvaardigd is,
      verklaart hij het beroep gegrond. In dat geval beveelt het Gerecht de opheffing van de maatregel of een wijziging
      van de wijze van tenuitvoerlegging daarvan.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22n
  - number: 22o
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ten aanzien van de wijze van
      horen van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22o
  - number: 22p.1
    text: |-
      In afwijking van artikel 43, eerste lid, van de Wet administratieve rechtspraak BES kan de vreemdeling zich bij de
      gehoren ingevolge de [artikelen 22l][ref1] en [22n][ref2] uitsluitend door één of meer van zijn raadslieden doen
      bijstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22l
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel22n
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22p
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22l
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 22n
        hoofdstuk: '14'
  - number: 22p.2
    text: De raadsman wordt bij het horen in de gelegenheid gesteld de nodige opmerkingen te maken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22p
  - number: 22p.3
    text: Artikel 57, eerste lid, van het Wetboek van Strafvordering BES is van toepassing.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22p
  - number: 22q.1
    text: De vreemdeling is steeds bevoegd een of meer raadslieden te kiezen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22q
  - number: 22q.2
    text: Daartoe is ook zijn wettige vertegenwoordiger of zijn bijzondere gemachtigde bevoegd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22q
  - number: 22q.3
    text: |-
      Kan de vreemdeling zijn wil te dien aanzien niet doen blijken en heeft hij geen wettelijke vertegenwoordiger of
      bijzondere gemachtigde, dan is zijn echtgenoot of de meest gerede van zijn in de openbare lichamen verblijvende
      bloed- of aanverwanten, tot de vierde graad ingesloten, tot die keuze bevoegd. Het Gerecht kan ambtshalve één of
      meer raadslieden toevoegen indien de in de voorgaande volzin bedoelde personen niet in staat worden geacht de keuze
      binnen redelijke termijn te maken.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22q
  - number: 22q.4
    text: |-
      De ingevolge het tweede of derde lid gekozen raadsman treedt af zodra de vreemdeling zelf een raadsman heeft
      gekozen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22q
  - number: 22r.1
    text: |-
      Op verzoek van de vreemdeling wordt hem een raadsman toegevoegd zodra hem ingevolge deze wet zijn vrijheid is
      ontnomen. [Artikel 22q, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22q
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22r
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22q
        hoofdstuk: '14'
  - number: 22r.2
    text: |-
      Bevoegd tot het verlenen van een toevoeging zijn het Gerecht in geval van beroep en het Hof in geval van hoger
      beroep.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22r
  - number: 22r.3
    text: |-
      Voor zover de wet niet op andere wijze in de toevoeging voorziet, kan de instantie, aangewezen bij algemene
      maatregel van bestuur, aan de betrokkene op diens verzoek een raadsman toevoegen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22r
  - number: 22r.4
    text: |-
      Een overeenkomstig het voorgaande lid gedaan verzoek wordt ingewilligd in gevallen waarin aannemelijk is dat de
      vreemdeling niet in staat is de kosten van een gekozen raadsman te dragen en waarin ook overigens, naar het oordeel
      van de instantie, bedoeld in het voorgaande lid, voldoende grond voor toevoeging bestaat.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22r
  - number: 22s.1
    text: |-
      Bij verhindering of ontstentenis van de toegevoegde raadsman wordt zo nodig aan de vreemdeling onverwijld een
      andere raadsman toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22s
  - number: 22s.2
    text: Op verzoek van de toegevoegde raadsman of van de betrokkene kan een andere raadsman worden toegevoegd.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22s
  - number: 22s.3
    text: |-
      Toevoeging van een andere raadsman geschiedt door de instantie, bedoeld in [artikel 22r, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22r
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22s
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22r
        hoofdstuk: '14'
  - number: 22s.4
    text: |-
      Blijkt van de verhindering of ontstentenis van de raadsman pas tijdens het gehoor ingevolge de
      [artikelen 22l][ref1] en [22n][ref2], dan geeft het Gerecht last tot toevoeging van een andere raadsman aan de
      instantie, bedoeld in [artikel 22r, derde lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22l
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel22n
      [ref3]: https://wetten.overheid.nl/BWBR0028571#Artikel22r
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22s
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22l
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 22n
        hoofdstuk: '14'
      - id: ref3
        bwb_id: BWBR0028571
        artikel: 22r
        hoofdstuk: '14'
  - number: 22t
    text: |-
      Bij algemene maatregel van bestuur worden regelen gesteld omtrent de beloning van toegevoegde raadslieden en de
      vergoeding van hun onkosten.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22t
  - number: 22u
    text: |-
      Indien Onze Minister dit wenselijk oordeelt kan hij de beloning en vergoeding van een toevoeging ingevolge de
      [artikelen 22r][ref1] en [22s][ref2] verhalen op de goederen van de vreemdeling. Met betrekking tot de wijze van
      verhaal en de berekening van de te verhalen bedragen worden regelen gesteld bij algemene maatregel van bestuur.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22r
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel22s
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22u
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22r
        hoofdstuk: '14'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 22s
        hoofdstuk: '14'
  - number: 22v
    text: |-
      De raadsman heeft vrije toegang tot de vreemdeling. Hij kan hem alleen spreken en met hem brieven wisselen zonder
      dat van de inhoud door anderen kennis wordt genomen, een en ander onder het vereiste toezicht en met in achtneming
      van ingevolge deze wet gestelde regelen met betrekking tot het voor de ruimte of plaats, waar de vreemdeling zich
      bevindt, geldende regime.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22v
  - number: 22w
    text: |-
      Met betrekking tot de kennisgeving van gerechtelijke mededelingen ingevolge de [artikelen 22l tot en met 22s][ref1]
      zijn de artikelen 642 tot en met 647 van het Wetboek van Strafvordering BES van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22l
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22w
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22l
        hoofdstuk: '14'
  - number: 22x.1
    text: |-
      Indien het Gerecht de opheffing van een maatregel strekkende tot vrijheidsontneming beveelt, dan wel de
      vrijheidsontneming reeds voor de behandeling van het verzoek om opheffing van die maatregel wordt opgeheven,
      kan hij aan de vreemdeling een vergoeding ten laste van de Staat toekennen. Onder schade is begrepen het nadeel
      dat niet in vermogensschade bestaat. De artikelen 178 en 181 van het Wetboek van Strafvordering BES zijn van
      overeenkomstige toepassing. Indien de vreemdeling na het indienen van zijn verzoek is overleden, geschiedt de
      toekenning ten behoeve van zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22x
  - number: 22x.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing, indien het Hof de opheffing van de maatregel strekkende tot
      vrijheidsontneming beveelt.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel22x
  - number: '23.1'
    text: |-
      Onze Minister onderscheidenlijk de korpschef verstrekt andere bestuursorganen de gegevens betreffende de
      verblijfsrechtelijke positie van de vreemdeling welke zij behoeven ter uitvoering van hun taak.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel23
  - number: '23.2'
    text: |-
      Andere bestuursorganen zijn bevoegd uit eigen beweging en verplicht desgevraagd Onze Minister onderscheidenlijk de
      korpschef de gegevens te verstrekken die noodzakelijk zijn voor de uitvoering van deze wet. Deze bestuursorganen
      kunnen daarbij gebruik maken van het administratienummer, bedoeld in artikel 10 van de Wet basisadministratie
      persoonsgegevens BES.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel23
  - number: '23.3'
    text: |-
      De in het eerste en tweede lid bedoelde gegevensverstrekking vindt niet plaats indien de persoonlijke levenssfeer
      van de betrokkene daardoor onevenredig wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel23
  - number: '23.4'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de gevallen waarin en de wijze waarop in ieder
      geval gegevens dienen te worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel23
  - number: '23.5'
    text: |-
      Voor de toepassing van het eerste tot en met het vierde lid worden met bestuursorganen gelijk gesteld
      instellingsbesturen van uit de openbare kas bekostigde instellingen en bevoegde gezagsorganen van uit de openbare
      kas bekostigde scholen en instellingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel23
  - number: '24.1'
    text: |-
      Bijzondere persoonsgegevens als bedoeld in artikel 16 van de Wet bescherming persoonsgegevens BES kunnen worden
      verwerkt, voor zover deze gegevens noodzakelijk zijn voor de doelmatige en doeltref-fende uitvoering van de
      grensbewaking, de toelating, het verblijf en de uitzetting van vreemdelingen en het toezicht op vreemdelingen op
      grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel24
  - number: '24.2'
    text: |-
      De gegevens, bedoeld in het eerste lid, worden verwerkt door of namens Onze Minister en de in de
      [artikelen 22a][ref1] en [22b][ref2] aangewezen ambtenaren. Zij kunnen worden verwerkt door derden, voor zover
      deze betrokken zijn bij de uitvoering van deze wet en daartoe noodzakelijkerwijs de beschikking over deze gegevens
      moeten verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0028571#Artikel22a
      [ref2]: https://wetten.overheid.nl/BWBR0028571#Artikel22b
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0028571
        artikel: 22a
        hoofdstuk: '12'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0028571
        artikel: 22b
        hoofdstuk: '12'
        paragraaf: '1'
  - number: '24.3'
    text: |-
      Bij regeling van Onze Minister worden regels gesteld ter waarborging van de persoonlijke levenssfeer. Daarbij wordt
      in ieder geval geregeld:
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel24
  - number: 24.3.a
    text: op welke wijze de verwerking, bedoeld in het eerste lid, plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel24
  - number: 24.3.b
    text: |-
      op welke wijze door passende technische en organisatorische maatregelen deze gegevens worden beveiligd tegen
      verlies of onrechtmatige verwerking;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel24
  - number: 24.3.c
    text: welke gegevens, aan welke personen of instanties, voor welk doel en op welke wijze kunnen worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel24
  - number: 24.3.d
    text: |-
      op welke wijze wordt gewaarborgd dat de verwerkte persoonsgegevens slechts worden verwerkt voor het doel waarvoor
      ze zijn verzameld of voor zover het verwerken met dat doel verenigbaar is, alsmede hoe daarop wordt toegezien.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel24
  - number: '25'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen, ter uitvoering van een verdrag, dan wel van een voor
      Nederland verbindend besluit van een volkenrechtelijke organisatie, regels worden gesteld in verband met de
      toelating tot verblijf van vreemdelingen, waarbij ten gunste van deze vreemdelingen kan worden afgeweken van deze
      wet.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel25
  - number: '26.1'
    text: |-
      Hij die de aan zijn toelating verbonden beperkingen of voorschriften niet nakomt, wordt gestraft met hechtenis van
      ten hoogste zes maanden of een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel26
  - number: '26.2'
    text: |-
      Hij die de krachtens deze wet gegeven voorschriften en regelen overtreedt wordt gestraft met hechtenis van ten
      hoogste zes maanden of een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel26
  - number: '26.3'
    text: De feiten bij of krachtens dit artikel strafbaar gesteld worden beschouwd als overtredingen.
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel26
  - number: '27'
    text: 'Deze wet wordt aangehaald als: Wet toelating en uitzetting BES.'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel27
  - number: 28 en 29
    text: '[vervallen]'
    url: https://wetten.overheid.nl/BWBR0028571/2010-10-10#Artikel28_en_29
