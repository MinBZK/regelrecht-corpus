  - number: '9'
    text: |-
      Een vordering van de SVB als bedoeld in de [artikelen 7][ref1] en [8][ref2] is bevoorrecht en volgt onmiddellijk
      na de vorderingen uit [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0029984#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
