  - number: '6'
    text: |-
      Het recht op tegemoetkoming eindigt met ingang van de eerste dag van de maand volgend op de maand waarin de dag is
      gelegen dat niet meer aan de voorwaarden voor het recht op de tegemoetkoming wordt voldaan. Na het overlijden van
      de belastingplichtige eindigt het recht op tegemoetkoming evenwel met ingang van de dag na dat overlijden.
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel6
  - number: '7'
    text: |-
      1 Tegemoetkoming waarvan door de SVB is vastgesteld dat er geen recht op bestond als bedoeld in [artikel 3][ref1]
      vordert de SVB terug van de persoon die de tegemoetkoming heeft ontvangen.

      2 In afwijking van het eerste lid kan de SVB besluiten:

      a. geheel of gedeeltelijk van terugvordering af te zien indien daarvoor dringende redenen aanwezig zijn;

      b. van terugvordering af te zien indien het te vorderen bedrag een door Onze Minister vastgesteld bedrag niet te
      boven gaat.

      3 Degene van wie wordt teruggevorderd, is verplicht desgevraagd aan de SVB de inlichtingen te verstrekken die voor
      de terugvordering van belang zijn.

      4 De SVB kan het teruggevorderde bedrag invorderen bij dwangbevel.

      5 De SVB is bevoegd om het teruggevorderde bedrag te verrekenen met hetgeen de SVB uit hoofde van de andere door de
      SVB uitgevoerde wettelijke regelingen, aan de betrokkene verschuldigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '3'
        hoofdstuk: '2'
  - number: '8'
    text: |-
      1 In afwijking van [artikel 7, eerste lid][ref1], kan de SVB, op verzoek van de betrokkene besluiten gedeeltelijk
      van terugvordering of gedeeltelijk van verdere terugvordering af te zien door medewerking aan een schuldregeling,
      indien:

      a. redelijkerwijs te voorzien is dat de betrokkene niet zal kunnen voortgaan met het betalen van zijn schulden of
      indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;

      b. redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen van de overige
      schuldeisers zonder een zodanig besluit niet tot stand zal komen;

      c. een naar het oordeel van de SVB betrouwbaar voorstel tot schuldregeling is tot stand gekomen door tussenkomst
      van een schuldhulpverlener als bedoeld in [artikel 48 van de Wet op het consumentenkrediet][ref2];

      d. aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en

      e. uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref3].

      2 Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van
      de betrokkene gewijzigd indien:

      a. niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die
      voldoet aan de eisen, bedoeld in het eerste lid;

      b. de betrokkene, of zijn wettelijke vertegenwoordiger, zijn schuld aan de SVB niet overeenkomstig de
      schuldregeling voldoet; of

      c. onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een
      ander besluit zou hebben geleid.

      3 Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      uitoefening van de bevoegdheid om mee te werken aan schuldregelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004815#Artikel48
      [ref3]: https://wetten.overheid.nl/BWBR0001860#Artikel349
