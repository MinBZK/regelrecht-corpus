  - number: '13'
    text: |-
      1 Onze Minister verstrekt jaarlijks ten laste van ’s Rijks kas aan de SVB een uitkering voor de lasten van de
      door de SVB uitbetaalde tegemoetkomingen, bedoeld in [artikel 3, eerste lid][ref1], en de daaraan verbonden
      uitvoeringskosten.

      2 De SVB verantwoordt de lasten van de tegemoetkomingen en uitvoeringskosten  afzonderlijk.

      3 [Hoofdstuk 8 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref2] is van overeenkomstige toepassing
      voor begroting, beheer en verantwoording door de SVB van de uitvoering van deze wet.

      4 Bij ministeriële regeling kunnen regels worden gesteld voor de berekening van het bedrag van de uitkering en de
      daarvoor noodzakelijke gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk8
