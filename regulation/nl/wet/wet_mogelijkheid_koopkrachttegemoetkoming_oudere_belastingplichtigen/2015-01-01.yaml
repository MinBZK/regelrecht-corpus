  - number: '2'
    text: De SVB is belast met de uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel2
  - number: '3'
    text: |-
      De binnenlandse of buitenlandse belastingplichtige die de leeftijd heeft bereikt waarop recht kan ontstaan op
      de ouderenkorting, heeft recht op een tegemoetkoming. Bij algemene maatregel van bestuur wordt de hoogte van
      de tegemoetkoming vastgesteld en kan worden bepaald in welke gevallen voor het vaststellen van het recht op
      tegemoetkoming een ander tijdvak in aanmerking wordt genomen dan het kalenderjaar van het recht op tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel3
  - number: '4'
    text: |-
      Het recht op de tegemoetkoming ontstaat van rechtswege op de eerste dag van de maand, waarin aan de voorwaarden,
      genoemd in [artikel 3][ref1], is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel3
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0029984
        artikel: '3'
        hoofdstuk: '2'
  - number: '5'
    text: |-
      1 Indien de SVB de beschikking heeft over gegevens op basis waarvan aannemelijk is dat de betrokkene een
      binnenlandse of buitenlandse belastingplichtige is die recht heeft op de tegemoetkoming, vindt de betaling van de
      tegemoetkoming plaats zonder dat dit bij beschikking is vastgesteld en geschiedt deze als regel maandelijks.

      2 De tegemoetkoming wordt niet betaald over kalenderjaren met betrekking waartoe de aanvraag, bedoeld in het vierde
      lid, niet is ingediend binnen vijf jaar na dat kalenderjaar. De SVB kan in bijzondere gevallen afwijken van de
      eerste zin.

      3 Indien blijkt dat de betaling van de tegemoetkoming ten onrechte achterwege is gebleven, betaalt de SVB de
      tegemoetkoming alsnog binnen acht weken nadat de SVB met dit feit bekend is geworden.

      4 Degene aan wie geen tegemoetkoming wordt betaald, kan de SVB verzoeken alsnog tot betaling van tegemoetkoming
      over te gaan indien aannemelijk is dat hij recht heeft op de tegemoetkoming. Desgevraagd legt deze persoon nadere,
      door de SVB te bepalen bescheiden over. De SVB beslist binnen acht weken na de datum van ontvangst van de aanvraag,
      bedoeld in de eerste zin.

      5 Indien de beslissing niet binnen acht weken na ontvangst van de aanvraag kan worden genomen, verlengt de SVB de
      termijn, genoemd in het vierde lid, met een redelijke termijn en stelt de SVB de aanvrager daarvan schriftelijk
      in kennis.

      6 Indien de tegemoetkoming in het buitenland wordt uitbetaald, geschiedt de betaling, in afwijking van
      [artikel 4:89, derde lid, van de Algemene wet bestuursrecht][ref1], op het tijdstip waarop de rekening van de
      daartoe door de schuldeiser aangewezen bank wordt gecrediteerd.

      7 Wanneer degene aan wie de tegemoetkoming zou worden betaald een ander machtigt om de tegemoetkoming in ontvangst
      te nemen, onderscheidenlijk een verleende machtiging intrekt, wordt daaraan gevolg gegeven met ingang van een
      betalingstermijn, aanvangende na de dag, waarop de machtiging wordt ingediend, onderscheidenlijk waarop van haar
      intrekking mededeling wordt gedaan, doch niet later dan de eerste dag van de tweede maand na de dag van indiening,
      onderscheidenlijk intrekking van de machtiging.

      8 De SVB is bevoegd om de betaling van de tegemoetkoming te schorsen indien zij van oordeel is of vermoedt dat:

      a. niet langer aannemelijk is dat betrokkene een binnenlandse of buitenlandse belastingplichtige is die recht heeft
      op de tegemoetkoming;

      b. betrokkene zijn verplichting op grond van [artikel 11][ref2] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel489
      [ref2]: https://wetten.overheid.nl/BWBR0029984#Artikel11
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel5
