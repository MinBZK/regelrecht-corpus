  - number: '10'
    text: |-
      1 De tegemoetkoming is:

      a. onvervreemdbaar, en

      b. niet vatbaar voor verpanding, belening of beslag.

      2 Volmacht tot ontvangst van de tegemoetkoming, onder welke vorm of welke benaming ook door de belastingplichtige
      verleend, is steeds herroepelijk.

      3 Elk beding strijdig met enige bepaling van dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel10
  - number: '11'
    text: |-
      Een ieder die de tegemoetkoming ontvangt, deelt aan de SVB desgevraagd of uit eigen beweging onverwijld alle feiten
      en omstandigheden mee, waarvan hem redelijkerwijs duidelijk moet zijn dat zij van invloed kunnen zijn op het recht
      op een tegemoetkoming.
    url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#Artikel11
  - number: '12'
    text: |-
      1 Indien aan het niet naleven van [artikel 11][ref1] te wijten is dat ten onrechte tegemoetkoming is uitbetaald,
      is de SVB bevoegd een bestuurlijke boete op te leggen van ten hoogste 100 percent van het op grond van
      [artikel 7, eerste lid][ref2], terug te vorderen bedrag.

      2 De bevoegdheid tot het opleggen van de boete, genoemd in het eerste lid, vervalt door verloop van vijf jaren
      na het einde van het kalenderjaar waarin de SVB bekend was of redelijkerwijs had kunnen zijn met het niet naleven
      van [artikel 11][ref3].

      3 Wanneer degene die de tegemoetkoming ontvangt of heeft ontvangen bepaalde informatie op een later tijdstip
      verstrekt dan bedoeld in [artikel 11][ref4] maar vóórdat hij weet of redelijkerwijs kon vermoeden dat de informatie
      bij de SVB bekend is, legt de SVB geen bestuurlijke boete op.


      [ref1]: https://wetten.overheid.nl/BWBR0029984#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029984#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0029984#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0029984#Artikel11
