preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een regeling te introduceren die de mogelijkheid biedt
    oudere belastingplichtigen een tegemoetkoming toe te kennen ter compensatie van verlies van koopkracht als gevolg
    van beleidsmaatregelen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0029984/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop gebaseerde bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *binnenlandse belastingplichtige:* belastingplichtige als bedoeld in
      [artikel 2.1, eerste lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref1];
        - *buitenlandse belastingplichtige:* belastingplichtige als bedoeld in
      [artikel 2.1, eerste lid, onderdeel b, van de Wet inkomstenbelasting 2001][ref2], die aantoont dat ten minste 90%
      van zijn wereldinkomen, na toepassing van regelingen ter voorkoming van dubbele belasting, in Nederland aan de
      belastingheffing naar het inkomen is onderworpen;
        - *ouderenkorting:* heffingskorting als bedoeld in de [artikelen 8.17 van de Wet inkomstenbelasting 2001][ref3] en
      [22b van de Wet op de loonbelasting 1964][ref4];
        - *de SVB:* de Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel2.1
