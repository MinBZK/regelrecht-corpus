  - number: '3'
    text: |-
      1 De dienst mag voor de in [artikel 2, onder a tot en met d, j, en p tot en met r][ref1], bedoelde activiteiten
      prijzen in rekening brengen.

      2 De in [artikel 2][ref2] bedoelde activiteiten en de hiervoor door de dienst in rekening te brengen prijzen dienen
      te voldoen aan de volgende voorwaarden:

      a. de exploitatie mag niet ten koste gaan van de in artikel 4b, eerste en tweede lid, onderdeel a, bedoelde taken;

      b. de exploitatie mag niet leiden tot concurrentieverstoring;

      c. de exploitatie dient na vijf jaar in het totaal tenminste kostendekkend te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0008144#Artikel2
