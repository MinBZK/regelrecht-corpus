  - number: 2a
    text: |-
      In het kader van het experiment met begeleid rijden als bedoeld in
      [hoofdstuk VIIIb van het Reglement rijbewijzen][ref1] worden aan de Dienst Wegverkeer de volgende taken opgedragen:

      a. het registreren van aanmeldingen als begeleider in het kader van het experiment begeleid rijden en het
      beoordelen van de aangemelde personen op hun geschiktheid als begeleider;

      b. het behandelen van aanvragen voor begeleiderspassen en de afgifte van begeleiderspassen;

      c. het verwerken van gegevens omtrent de begeleider en de begeleiderspas in het rijbewijzenregister;

      d. het innen van de kosten van de aanvraag van de begeleiderspas als bedoeld in
      [artikel 173u, eerste lid, van het Reglement rijbewijzen][ref2] die € 35,00 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#HoofdstukVIIIb
      [ref2]: https://wetten.overheid.nl/BWBR0008074#Artikel173u
    url: https://wetten.overheid.nl/BWBR0008144/2011-11-09#Artikel2a
    references:
      - id: ref1
