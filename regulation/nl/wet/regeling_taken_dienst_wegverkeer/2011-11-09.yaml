preamble:
  text: |-
    Gelet op artikel 4b, tweede lid, onderdeel b, van de Wegenverkeerswet 1994 en artikel 15 van het Informatiestatuut
    Dienst Wegverkeer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008144/2011-11-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:



            de minister:

              de Minister van Verkeer en Waterstaat;



            de dienst:

              de Dienst Wegverkeer;



            derden:

              personen en organisaties binnen en buiten de Rijksoverheid;




              [richtlijn nr. 2000/30/EG](32000L0030):

              [richtlijn nr. 2000/30/EG](32000L0030) van het Europees Parlement en de Raad van de Europese Unie van 6
      juni 2000 betreffende de technische controle langs de weg van bedrijfsvoertuigen die in de Gemeenschap deelnemen
      aan het verkeer (PbEG L 203).
    url: https://wetten.overheid.nl/BWBR0008144/2011-11-09#Artikel1
  - number: 1a
    text: |-
      Een wijziging van [richtlijn nr. 2000/30/EG](32000L0030) gaat voor de toepassing van deze regeling gelden met
      ingang van de datum waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008144/2011-11-09#Artikel1a
  - number: '2'
    text: |-
      Aan de dienst worden de volgende taken opgedragen:

      a. het zo doelmatig mogelijk benutten van faciliteiten en middelen die de dienst in het kader van de eigen
      taakuitoefening ter beschikking staan. In het kader daarvan kan de dienst deze faciliteiten en middelen, zoals
      bijvoorbeeld test- en computerfaciliteiten, aan derden aanbieden;

      b. het verrichten van testen en keuringen van voertuigen en voertuigonderdelen voor zover deze testen en keuringen
      weliswaar niet worden voorgeschreven voor de toelating of het gebruik van de voertuigen en voertuigonderdelen
      in Nederland doch waarom wordt verzocht ten behoeve van de toelating en het gebruik van deze voertuigen en
      voertuigonderdelen in andere landen;

      c. het op verzoek verstrekken van een zwaar transportverklaring, een draagvermogensbrief, of voor samenstellen,
      met een laadlengte van tenminste 18 meter of een vergelijkbare laadlengte indien de voertuigen zijn ingericht
      voor het vervoer van afneembare laadstructuren bestaande uit ten hoogste drie voertuigen en ingericht voor het
      vervoer van goederen waarvan de totale lengte niet meer bedraagt dan 25,25 meter en de totale massa niet meer dan
      60 ton, af te geven keuringscertificaten of andere documenten dan wel te verrichten handelingen, ten behoeve van
      het door gemeenten, provincies of de dienst verlenen van ontheffingen op basis van de [artikelen 149][ref1] en
      [149a, tweede lid, van de Wegenverkeerswet 1994][ref2];

      d. het op verzoek van gemeenten en provincies bemiddelen bij het verlenen van ontheffingen als bedoeld in
      [artikel 149 van de Wegenverkeerswet 1994][ref3];

      e. het afgeven van vervangende kentekenbewijzen in geval van vermissing van de bijbehorende kentekenplaten;
      [artikel 55 van de Wegenverkeerswet 1994][ref4] is van overeenkomstige toepassing;

      f. het raadplegen langs geautomatiseerde weg van de in de gemeentelijke basisadministratie persoonsgegevens
      opgenomen persoonsgegevens van de in het rijbewijzenregister geregistreerde houders van een rijbewijs ten behoeve
      van het actualiseren van die persoonsgegevens in het rijbewijzenregister en het attenderen van de houders van een
      rijbewijs op het verstrijken van de geldigheidsduur;

      g.

      h. het op verzoek verstrekken van een verklaring omtrent de verkrijging van kentekenplaten als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______;

      i. het verzamelen van gegevens en het verstrekken daarvan aan instellingen van volkenrechtelijke organisaties en
      aan de instanties van de lidstaten van volkenrechtelijke organisaties voor zover daartoe op grond van een besluit
      van die organisaties een verplichting bestaat;

      j. het op verzoek aanwijzen van bromfietsen, niet zijnde brommobielen, of motorfietsen, bedoeld in
      [artikel 60 van het Reglement Verkeersregels en Verkeerstekens 1990][ref6], die voldoen aan de eisen ten behoeve
      van een vrijstelling van de helmdraagplicht;

      k. het ter uitvoering van [richtlijn nr. 2000/30/EG](32000L0030) verrichten van het controle-onderdeel inspectie
      van de uitlaatemissie van de technische controle langs de weg van bedrijfsvoertuigen, het verzamelen van gegevens
      omtrent ernstige gebreken aan bedrijfsvoertuigen die in de andere lidstaten van de Europese Unie tot het verkeer
      zijn toegelaten en het verstrekken van deze gegevens aan de bevoegde instanties van de betrokken lidstaten;

      l. het verzenden van brieven naar houders van een kentekenbewijs ten behoeve van de attendering op de in
      [artikel 72 van de Wegenverkeerswet 1994][ref7] opgenomen verplichting;

      m. het instandhouden en beheren van een systeem voor de centrale landelijke registratie van gestolen brom- en
      snorfietsen en het aan de hand van een framenummer verstrekken van het gegeven of een brom- of snorfiets als
      gestolen gesignaleerd is;

      n. het instandhouden en beheren van een systeem van registratie van tachograafkaarten en daarbij behorende gegevens
      van betrokkenen;

      o. het verrichten van testen en keuringen van emissieverminderende voertuigonderdelen of voertuigonderdelen
      ter vermindering van de geluidbelasting, voor zover deze testen en keuringen niet worden voorgeschreven voor de
      toelating of het gebruik van deze voertuigonderdelen in Nederland;

      p. het toezien op de uitvoering van de overeenkomsten door middel waarvan een natuurlijke persoon of rechtspersoon
      is aangemerkt als gekwalificeerd voor het verrichten van de inbouw van emissieverminderende voertuigonderdelen en
      het opnemen van de in dit kader noodzakelijke gegevens in het kentekenregister;

      q. Het verzenden van brieven naar houders van een kentekenbewijs in het kader van een terugroepactie als bedoeld
      in [artikel 2, tweede lid, onderdeel e, van de Regeling gegevensverstrekking kentekenregister 2008][ref8] tegen een
      door de Dienst Wegverkeer vastgesteld tarief:

      1°. op uitdrukkelijk verzoek van de producent of importeur van motorrijtuigen of aanhangwagens of van onderdelen en
      uitrustingstukken van deze motorrijtuigen, of

      2°. ingeval van door de Dienst Wegverkeer geconstateerd misbruik door de in onderdeel 1 bedoelde partijen of een
      door hen ingeschakelde derde van de in het kader van een eerdere terugroepactie verstrekte gegevens;

      r. het ontwikkelen, in stand houden en beheren van een systeem voor de centrale registratie van parkeer- en
      verblijfsrechten gekoppeld aan individuele kentekens ten behoeve van gemeenten alsmede het ter beschikking stellen
      van informatie uit deze registratie aan daartoe gerechtigde partijen;

      s. het bewaren van strafrechtelijk in beslag genomen rijbewijzen en kentekenbewijzen;

      t. het verlenen van erkenningen als bedoeld in de [artikelen 132f, eerste lid][ref9], en
      [132k, eerste lid, van de wet][ref10].


