      verordening;


      [ref1]: https://wetten.overheid.nl/BWBR0036478#Artikel1
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0036478
        artikel: '1'
  - number: 2.dd
    text: |-
      het houden van toezicht op de naleving en de handhaving van de eisen opgenomen in de artikelen 4 tot en met
      7 van de gedelegeerde verordening (EU) 885/2013, bedoeld in [artikel 1.1 van de ITS-Regeling][ref1], door de
