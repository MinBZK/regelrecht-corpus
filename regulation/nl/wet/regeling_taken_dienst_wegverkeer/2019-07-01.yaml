        bwb_id: BWBR0036478
        artikel: '1'
  - number: 2.ee
    text: het op verzoek keuren van hittewerende bekleding van LPG-tankauto’s overeenkomstig NTA 8820:2015;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.ff
    text: |-
      het ter uitvoering van verordening 19/2011, uitvoeringsverordening 901/2014 en uitvoeringsverordening 2015/504
      toekennen van een wereldfabrikantenidentificatienummer (WMI);
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.gg
    text: |-
      het voorbereiden en monitoren van een vergunning als bedoeld in [artikel 149aa][ref1], alsmede het vaststellen en
      innen van de kosten op grond van artikel 149aa, achtste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149aa
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 149aa
  - number: 2a
    text: |-
      In het kader van het experiment met begeleid rijden als bedoeld in
      [hoofdstuk VIIIb van het Reglement rijbewijzen][ref1] worden aan de Dienst Wegverkeer de volgende taken opgedragen:


      [ref1]: https://wetten.overheid.nl/BWBR0008074#HoofdstukVIIIb
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        hoofdstuk: VIIIb
  - number: 2a.a
    text: |-
      het registreren van aanmeldingen als begeleider in het kader van het experiment begeleid rijden en het beoordelen
      van de aangemelde personen op hun geschiktheid als begeleider;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2a
  - number: 2a.b
    text: het behandelen van aanvragen voor begeleiderspassen en de afgifte van begeleiderspassen;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2a
  - number: 2a.c
    text: het verwerken van gegevens omtrent de begeleider en de begeleiderspas in het rijbewijzenregister;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2a
  - number: 2a.d
    text: |-
      het innen van de kosten van de aanvraag van de begeleiderspas als bedoeld in
      [artikel 173u, eerste lid, van het Reglement rijbewijzen][ref1] die € 35,00 bedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0008074#Artikel173u
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0008074
        artikel: 173u
  - number: '3.1'
    text: |-
      De dienst mag voor de activiteiten, bedoeld in
      [artikel 2, onder a tot en met d, j, p tot en met r, t, u, w, z en ee][ref1], prijzen in rekening brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0008144#Artikel2
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008144
        artikel: '2'
  - number: '3.2'
    text: |-
      De in [artikel 2][ref1] bedoelde activiteiten en de hiervoor door de dienst in rekening te brengen prijzen dienen
      te voldoen aan de volgende voorwaarden:


      [ref1]: https://wetten.overheid.nl/BWBR0008144#Artikel2
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008144
        artikel: '2'
  - number: 3.2.a
    text: |-
      de exploitatie mag niet ten koste gaan van de in [artikel 4b, eerste en tweede lid, onderdeel a][ref1], bedoelde
      taken;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel4b
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 4b
  - number: 3.2.b
    text: de exploitatie mag niet leiden tot concurrentieverstoring;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel3
  - number: 3.2.c
    text: de exploitatie dient na vijf jaar in het totaal tenminste kostendekkend te zijn.
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel3
  - number: '4'
    text: |-
      De artikelen 5, 8 en 9 van de Regeling sturing van en toezicht op de Dienst Wegverkeer en
      [artikel 18 van de Beleidsregel sturing van en toezicht op de Dienst Wegverkeer][ref1] zijn van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0032371#Artikel18
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0032371
        artikel: '18'
  - number: '5'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 juli 1996.
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel5
  - number: '6'
    text: 'Deze regeling wordt aangehaald als: Regeling taken Dienst Wegverkeer.'
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel6
