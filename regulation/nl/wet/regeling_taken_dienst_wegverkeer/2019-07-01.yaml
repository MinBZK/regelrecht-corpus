      betrekking tot beperkingen voor het wegtransport op grond van de Implementatiewet EG-richtlijn infrastructuur
      ruimtelijke informatie;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.bb
    text: |-
