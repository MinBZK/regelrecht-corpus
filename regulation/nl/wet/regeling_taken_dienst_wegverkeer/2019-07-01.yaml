$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_taken_dienst_wegverkeer
regulatory_layer: WET
publication_date: '2025-10-28'
valid_from: '2019-07-01'
bwb_id: BWBR0008144
url: https://wetten.overheid.nl/BWBR0008144/2019-07-01
preamble:
  text: |-
    Gelet op artikel 4b, tweede lid, onderdeel b, van de Wegenverkeerswet 1994 en artikel 15 van het Informatiestatuut
    Dienst Wegverkeer;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder: - *de minister:* de Minister van Infrastructuur en Milieu;
        - *de dienst:* de Dienst Wegverkeer;
        - *derden:* personen en organisaties binnen en buiten de Rijksoverheid;
        - *richtlijn 2014/47/EU:* [richtlijn 2014/47](32014L0047)/EU van het Europees Parlement en de Raad van 3 april 2014
      betreffende de technische controle langs de weg van bedrijfsvoertuigen die in de Unie aan het verkeer deelnemen en
      tot intrekking van [richtlijn 2000/30/EG](32000L0030) (PbEU 2014, L 127);
        - *richtlijn 2004/52/EG:* [Richtlijn 2004/52/EG](32004L0052) van het Europees Parlement en de Raad van 29 april
      2004 betreffende de interoperabiliteit van elektronische tolheffingssystemen voor het wegverkeer in de Gemeenschap
      (PbEU 2004, L 166);
        - *beschikking 2009/750/EG:* Beschikking 2009/750/EG van de Commissie van 6 oktober 2009 tot definiëring van de
      Europese elektronische tolheffingsdienst en de bijbehorende technische onderdelen (PbEU 2009, L 268);
        - *verordening 1071/2009/EG:* Verordening (EU) nr. 1071/2009/EG van het Europees Parlement en de Raad van 21
      oktober 2009 tot vaststelling van gemeenschappelijke regels betreffende de voorwaarden waaraan moet zijn voldaan
      om het beroep van wegvervoerondernemer uit te oefenen en tot intrekking van [Richtlijn 96/26/EG](31996L0026) van de
      Raad (PbEU 2009, L 300);
        - *verordening 406/2010:* Verordening (EU) nr. 406/2010 van de Commissie van 26 april 2010 tot uitvoering van
      [Verordening (EG) nr. 79/2009](32009R0079) van het Europees parlement en de Raad betreffende de typegoedkeuring van
      motorvoertuigen op waterstof (PbEU 2010, 122);
        - *VN/ECE-reglement 110:* Reglement nr. 110 van de Economische Commissie voor Europa van de Verenigde Naties (VN/
      ECE) inzake uniforme bepalingen voor de goedkeuring van specifieke onderdelen van motorvoertuigen die gecomprimeerd
      aardgas (cng) als brandstof gebruiken en voertuigen met betrekking tot de installatie van specifieke onderdelen van
      een goedgekeurd type voor het gebruik van gecomprimeerd aardgas (cng) als brandstof;
        - *NTA 8820:2015:* Nederlandse Technische Afspraak 8820, Hittewerende systemen voor LPG-tankwagens voor de
      bevoorrading van LPG-motorbrandstof aan tankstations, zoals gepubliceerd door het Nederlands Normalisatie-instituut
      op 1 maart 2015;
        - *verordening 19/2011:* Verordening (EU) nr. 19/2011 van de Commissie van 11 januari 2011 betreffende
      typegoedkeuringsvoorschriften voor de voorgeschreven constructieplaat en voor het voertuigidentificatienummer
      van motorvoertuigen en aanhangwagens daarvan en tot uitvoering van Verordening (EG) nr. 661/2009 van het Europees
      Parlement en de Raad betreffende typegoedkeuringsvoorschriften voor de algemene veiligheid van motorvoertuigen,
      aanhangwagens daarvan en daarvoor bestemde systemen, onderdelen en technische eenheden (PbEU 2011, L 8);
        - *uitvoeringsverordening 901/2014:* Uitvoeringsverordening (EU) nr. 901/2014 van de Commissie van 18 juli 2014 tot
      uitvoering van Verordening (EU) nr. 168/2013 van het Europees Parlement en de Raad wat betreft de administratieve
      voorschriften voor de goedkeuring van en het markttoezicht op twee- of driewielige voertuigen en vierwielers (PbEU
      2014, L 249);
        - *uitvoeringsverordening 2015/504:* Uitvoeringsverordening (EU) 2015/504 van de Commissie van 11 maart 2015 tot
      uitvoering van Verordening (EU) nr. 167/2013 van het Europees Parlement en de Raad wat betreft de administratieve
      voorschriften voor de goedkeuring van en het markttoezicht op landbouw- en bosbouwvoertuigen (PbEU 2015, L 85).
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel1
  - number: 1a
    text: |-
      Een wijziging van [richtlijn 2014/47](32014L0047)/EU gaat voor de toepassing van deze regeling gelden met ingang
      van de datum waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel1a
  - number: '2'
    text: 'Aan de dienst worden de volgende taken opgedragen:'
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.a
    text: |-
      het zo doelmatig mogelijk benutten van faciliteiten en middelen die de dienst in het kader van de eigen
      taakuitoefening ter beschikking staan. In het kader daarvan kan de dienst deze faciliteiten en middelen, zoals
      bijvoorbeeld test- en computerfaciliteiten, aan derden aanbieden;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.b
    text: |-
      het verrichten van testen en keuringen van voertuigen en voertuigonderdelen voor zover deze testen en keuringen
      weliswaar niet worden voorgeschreven voor de toelating of het gebruik van de voertuigen en voertuigonderdelen
      in Nederland doch waarom wordt verzocht ten behoeve van de toelating en het gebruik van deze voertuigen en
      voertuigonderdelen in andere landen;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.c
    text: |-
      het op verzoek verstrekken van een SERT document, een ontheffingsattest, of voor samenstellen, met een laadlengte
      van tenminste 18 meter of een vergelijkbare laadlengte indien de voertuigen zijn ingericht voor het vervoer
      van afneembare laadstructuren bestaande uit ten hoogste drie voertuigen en ingericht voor het vervoer van
      goederen waarvan de totale lengte niet meer bedraagt dan 25,25 meter en de totale massa niet meer dan 60 ton,
      af te geven keuringscertificaten of andere documenten dan wel te verrichten handelingen, ten behoeve van het
      door gemeenten, provincies of de dienst verlenen van ontheffingen op basis van de [artikelen 149][ref1] en
      [149a, tweede lid, van de Wegenverkeerswet 1994][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel149a
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 149a
  - number: 2.d
    text: |-
      het op verzoek van gemeenten en provincies bemiddelen bij het verlenen van ontheffingen als bedoeld in
      [artikel 149 van de Wegenverkeerswet 1994][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel149
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '149'
  - number: 2.e
    text: |-
      het afgeven van vervangende kentekenbewijzen in geval van vermissing van de bijbehorende kentekenplaten;
      [artikel 55 van de Wegenverkeerswet 1994][ref1] is van overeenkomstige toepassing;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel55
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '55'
  - number: 2.f
    text: |-
      het raadplegen langs geautomatiseerde weg van de in de basisregistratie personen opgenomen persoonsgegevens van
      de in het rijbewijzenregister geregistreerde houders van een rijbewijs ten behoeve van het actualiseren van die
      persoonsgegevens in het rijbewijzenregister en het attenderen van de houders van een rijbewijs op het verstrijken
      van de geldigheidsduur;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.h
    text: |-
      het op verzoek verstrekken van een verklaring omtrent de verkrijging van kentekenplaten als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ____;


      [ref1]: https://wetten.overheid.nl/BWBR0007091#Artikel9e
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007091
        artikel: 9e
  - number: 2.i
    text: |-
      het verzamelen van gegevens en het verstrekken daarvan aan instellingen van volkenrechtelijke organisaties en aan
      de instanties van de lidstaten van volkenrechtelijke organisaties voor zover daartoe op grond van een besluit van
      die organisaties een verplichting bestaat;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.j
    text: |-
      het op verzoek aanwijzen van bromfietsen, niet zijnde brommobielen, of motorfietsen, bedoeld in
      [artikel 60 van het Reglement Verkeersregels en Verkeerstekens 1990][ref1], die voldoen aan de eisen ten behoeve
      van een vrijstelling van de helmdraagplicht;


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel60
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '60'
  - number: 2.k
    text: 'het ter uitvoering van [richtlijn 2014/47](32014L0047)/EU:'
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.1°
    text: verrichten van de nadere controles,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.2°
    text: ten behoeve van de nadere controles ter beschikking stellen van de keuringslocaties en -faciliteiten,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.3°
    text: beheren van het risicoclassificatiesysteem en het verstrekken van gegevens daaruit aan bevoegde instanties,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.4°
    text: |-
      zijn van nationaal contactpunt en het ten gevolge daarvan verzamelen van gegevens omtrent initiële en nadere
      controles van voertuigen die zich voortbewegen op het grondgebied van de lidstaten van de Europese Unie,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.5°
    text: |-
      registeren van grote of gevaarlijke gebreken aan voertuigen die in andere lidstaten van de Europese Unie zijn
      ingeschreven of gebreken die resulteren in een (gedeeltelijk) verbod om voertuigen die zijn ingeschreven in een
      andere lidstaat van de Europese Unie te gebruiken en het uitwisselen van die gegevens met andere contactpunten van
      de lidstaten van de Europese Unie,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.6°
    text: verzoeken om passende follow-upmaatregelen aan de bevoegde instantie van de betrokken lidstaten,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.7°
    text: verlenen van hulp aan de contactpunten van andere betrokken lidstaten,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.8°
    text: |-
      verstrekken van de informatie, bedoeld in artikel 20 van [richtlijn 2014/47](32014L0047)/EU, aan de Europese
      Commissie,
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.k.9°
    text: zorg dragen voor elke andere informatie-uitwisseling;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.l
    text: |-
      het verzenden van brieven naar tenaamgestelden van in het kentekenregister geregistreerde voertuigen ten behoeve
      van de attendering op de in [artikel 72 van de Wegenverkeerswet 1994][ref1] opgenomen verplichting;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel72
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '72'
  - number: 2.m
    text: |-
      het instandhouden en beheren van een systeem voor de centrale landelijke registratie van gestolen brom- en
      snorfietsen en het aan de hand van een framenummer verstrekken van het gegeven of een brom- of snorfiets als
      gestolen gesignaleerd is;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.n
    text: |-
      het instandhouden en beheren van een systeem van registratie van tachograafkaarten en daarbij behorende gegevens
      van betrokkenen;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.o
    text: |-
      het verrichten van testen en keuringen van emissieverminderende voertuigonderdelen of voertuigonderdelen ter
      vermindering van de geluidbelasting, voor zover deze testen en keuringen niet worden voorgeschreven voor de
      toelating of het gebruik van deze voertuigonderdelen in Nederland;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.p
    text: |-
      het toezien op de uitvoering van de overeenkomsten door middel waarvan een natuurlijke persoon of rechtspersoon is
      aangemerkt als gekwalificeerd voor het verrichten van de inbouw van emissieverminderende voertuigonderdelen en het
      opnemen van de in dit kader noodzakelijke gegevens in het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.q
    text: |-
      het verzenden van brieven naar tenaamgestelden van in het kentekenregister
      geregistreerde voertuigen in het kader van een terugroepactie als bedoeld in
      [artikel 2, tweede lid, onderdeel e, van de Regeling gegevensverstrekking kentekenregister 2008][ref1] tegen een
      door de Dienst Wegverkeer vastgesteld tarief:


      [ref1]: https://wetten.overheid.nl/BWBR0024045#Artikel2
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0024045
        artikel: '2'
  - number: 2.q.1°
    text: |-
      op uitdrukkelijk verzoek van de producent of importeur van motorrijtuigen of aanhangwagens of van onderdelen en
      uitrustingstukken van deze motorrijtuigen, of
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.q.2°
    text: |-
      ingeval van door de Dienst Wegverkeer geconstateerd misbruik door de in onderdeel 1 bedoelde partijen of een door
      hen ingeschakelde derde van de in het kader van een eerdere terugroepactie verstrekte gegevens;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.r
    text: 'het beheren van en het verstrekken van informatie aan daartoe gerechtigde partijen uit een register van:'
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.r.1°
    text: parkeer- en verblijfsrechten gekoppeld aan individuele kentekens ten behoeve van gemeenten, en
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.r.2°
    text: statische parkeergegevens ten behoeve van een ieder;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.s
    text: het bewaren van strafrechtelijk in beslag genomen rijbewijzen en kentekenbewijzen;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.t
    text: |-
      het functioneren als centraal aanspreekpunt voor informatie betreffende rijbewijzen met een microchip en het
      uitvoeren van taken verband houdende met de microchip op het rijbewijs, de daarmee samenhangende uitvoering van
      de EU-typegoedkeuringsprocedure, het nemen van passende maatregelen inzake de bescherming van de gegevens, alsmede
      activiteiten in verband met het verlenen of intrekken van EU-typegoedkeuringscertificaten, bedoeld in artikel 5
      van Verordening (EU) nr. 383/2012 van de Commissie van 4 mei 2012 tot vaststelling van de technische voorschriften
      betreffende rijbewijzen met een ingebouwd opslagmedium (microchip) (Pb EU L 120);
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.u
    text: |-
      het aanwijzen van een technische dienst voor het uitvoeren van een periodieke herkwalificatie als bedoeld in
      bijlage 3, artikel 4.1.4, van VN/ECE-reglement 110 en artikel 2 van verordening 406/2010;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.v
    text: |-
      het ter uitvoering van artikel 18 van verordening 1071/2009/EG in de hoedanigheid van nationaal contactpunt met
      andere lidstaten uitwisselen van gegevens over veroordelingen en sancties met betrekking tot ondernemingen en
      vervoersmanagers in het wegvervoer en de status van geschiktheid van vervoermanagers;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.w
    text: |-
      het beoordelen van een voertuig en de daarbij aangeleverde documentatie in het kader van de
      procedure tot aanwijzing voor toelating tot het verkeer op de weg van een motorrijtuig als bedoeld in
      [artikel 20b, eerste lid, van de Wegenverkeerswet 1994][ref1] en het houden van toezicht op de conformiteit van de
      productie van die motorrijtuigen;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel20b
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 20b
  - number: 2.x
    text: |-
      het ter uitvoering van richtlijn 2004/52/EG beoordelen van aanvragen voor registratie als aanbieder van een
      elektronisch heffingssysteem, het registreren daarvan conform het bepaalde in artikel 3 van de beschikking
      2009/750/EG, het bijhouden en publiceren van een elektronisch register met de in Nederland geregistreerde
      aanbieders, het uitvoeren van artikel 19, eerste lid, onderdeel b, van de beschikking 2009/750/EG en indien die
      uitvoering hiertoe aanleiding geeft, het intrekken van de registratie;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.y
    text: het vastleggen in het rijbewijzenregister van verklaringen in verband met de afgifte van rijbewijzen;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.z
    text: |-
      het op basis van [artikel 25b, derde lid, van het Kentekenreglement][ref1] eveneens bij afwezigheid van deel I
      bij de bevoegde autoriteiten van de lidstaat waar het voertuig voordien was ingeschreven langs schriftelijke of
      elektronische weg de bevestiging verkrijgen dat de aanvrager het recht heeft om het voertuig in een andere lidstaat
      in te schrijven;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel25b
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 25b
