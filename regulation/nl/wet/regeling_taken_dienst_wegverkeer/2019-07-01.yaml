      vervanging van een voor 1 januari 2014 voor dat motorvoertuig of die aanhangwagen afgegeven kentekenbewijs;
    url: https://wetten.overheid.nl/BWBR0008144/2019-07-01#Artikel2
  - number: 2.cc
    text: |-
      het houden van toezicht op de naleving en de handhaving van de eisen opgenomen in de artikelen 3 tot en met 8 van
      de gedelegeerde verordening (EU) 886/2013, bedoeld in [artikel 1.1 van de ITS-Regeling][ref1], door wegbeheerders
