preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het Burgerlijk Wetboek, de Telecommunicatiewet en de Wet op de
    economische delicten moeten worden aangepast aan richtlijn nr. 99/93/EG van het Europees Parlement en de Raad van
    de Europese Unie van 13 december 1999 betreffende een gemeenschappelijk kader voor elektronische handtekeningen
    (PbEG L 13);

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0015046/2003-05-21#ArtikelAanhef
articles:
  - number: V
    text: 'Deze wet wordt aangehaald als: Wet elektronische handtekeningen.'
    url: https://wetten.overheid.nl/BWBR0015046/2003-05-21#ArtikelV
  - number: VI
    text: |-
      Deze wet treedt in werking met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0015046/2003-05-21#ArtikelVI
