  - number: '13'
    text: |-
      1 De Wet van 7 december 1883, *Stb.* 202, ter uitvoering van de op 6 mei 1882 te 's-Gravenhage gesloten
      overeenkomst tot regeling van de politie der visserij in de Noordzee, buiten de territoriale wateren, wordt
      ingetrokken.

      2 Indien voor het vaartuig een verklaring is afgegeven overeenkomstig [artikel 4][ref1] van genoemde wet, vervangt
      die verklaring het in [artikel 2, eerste lid][ref2], van deze wet bedoelde document, zolang nog geen vijf jaar
      verstreken zijn na het tijdstip van inwerkingtreding van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel4
