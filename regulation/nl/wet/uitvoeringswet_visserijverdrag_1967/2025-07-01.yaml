        artikel: 5:18
  - number: '10'
    text: |-
      1 Handelen of nalaten in strijd met de voorschriften gesteld bij of krachtens de [artikelen 2, eerste lid][ref1],
      [3][ref2], [4][ref3], [5][ref4], [6][ref5] en [7][ref6] van deze wet wordt gestraft met hechtenis van ten
      hoogste zes maanden of geldboete van de derde categorie.

      2 De feiten, strafbaar gesteld in het eerste lid, zijn overtredingen.


