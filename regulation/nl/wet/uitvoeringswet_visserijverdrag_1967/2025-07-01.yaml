        artikel: '1'
  - number: '2'
    text: |-
      1 De schipper van een Nederlands vissersvaartuig is verplicht te zorgen dat aan boord een document aanwezig is
      waaruit de nationaliteit van het vaartuig blijkt.

      2 Het in het vorige lid bedoelde document wordt afgegeven door de houder van het centraal visserijregister. Bij of
      krachtens algemene maatregel van bestuur worden regels gesteld omtrent de vorm van het document en de stukken die
      bij de aanvrage daarvan moeten worden overgelegd.
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel2
  - number: '3'
    text: |-
      De schipper van een Nederlands vissersvaartuig zorgt dat aan boord een zich in goede staat bevindende vlag van het
      Koninkrijk aanwezig is, en dat deze op vordering van de daartoe bevoegde autoriteiten wordt gehesen. Hij onthoudt
      zich van alle handelingen waardoor twijfel zou kunnen ontstaan over de nationaliteit van zijn vaartuig.
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel3
  - number: '4'
    text: |-
      De schipper van een Nederlands vissersvaartuig is verplicht de voorschriften in acht te nemen die in Bijlage III
      van het Verdrag zijn gesteld met betrekking tot de aan boord te gebruiken lichten, seinen en signalen.
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel4
  - number: '5'
    text: |-
      De schipper van een Nederlands vissersvaartuig is verplicht de voorschriften in acht te nemen, die in Bijlage IV
      van het Verdrag zijn gesteld met betrekking tot het merken van vistuig.
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel5
  - number: '6'
    text: |-
      De eigenaar of, in geval van rompbevrachting, de rompbevrachter van een Nederlands vissersvaartuig zorgt dat het
      dusdanig is uitgerust, dat de schipper aan de in de [artikelen 2, eerste lid][ref1], [3][ref2], [4][ref3] en
      [5][ref4] omschreven verplichtingen kan voldoen. Hij zorgt tevens dat het duidelijk zichtbaar de naam vermeldt
      van de gemeente waar het in het plaatselijk visserij-register is ingeschreven, alsmede de naam waaronder het is
      geregistreerd.


      [ref1]: https://wetten.overheid.nl/BWBR0002897#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002897#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002897#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002897#Artikel5
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel6
