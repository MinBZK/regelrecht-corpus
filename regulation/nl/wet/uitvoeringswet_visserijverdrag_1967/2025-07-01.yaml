  - number: '14'
    text: 'Deze wet kan worden aangehaald als: Uitvoeringswet Visserijverdrag 1967.'
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel14
  - number: '15'
    text: |-
      Deze wet treedt in werking met ingang van de dag waarop het Verdrag van Londen van 1 juni 1967 inzake de
      uitoefening van de visserij op de Noordatlantische Oceaan voor Nederland in werking treedt.
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel15
