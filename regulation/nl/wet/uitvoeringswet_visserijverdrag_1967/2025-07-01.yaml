  - number: '9'
    text: |-
      Met het toezicht op de naleving van de bepalingen van het Verdrag zijn belast de ambtenaren, die
      overeenkomstig het bepaalde bij en krachtens artikel 9 van het Verdrag hiertoe zijn aangewezen. De
      toezichthouder is bevoegd, met medeneming van de benodigde apparatuur, een woning binnen te treden
      zonder toestemming van de bewoner. De toezichthouder beschikt niet over de bevoegdheid, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel9
    references:
