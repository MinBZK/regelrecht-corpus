  - number: '7'
    text: |-
      De schipper van een Nederlands vaartuig is verplicht de voorschriften in acht te nemen die in Bijlage V van het
      Verdrag zijn gesteld met betrekking tot het manoeuvreren van vaartuigen en het achterwege laten van handelingen
      waardoor schade aan andere vaartuigen of vistuig zou kunnen ontstaan.
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel7
  - number: '8'
    text: |-
      De [artikelen 2, eerste lid][ref1], [3][ref2], [4][ref3], [5][ref4] en [7][ref5] van deze wet zijn
      van overeenkomstige toepassing op de schippers van vaartuigen die de nationaliteit bezitten van een andere
      staat die partij is bij dit Verdrag, indien het vaartuig zich bevindt in de visserijzone, bedoeld in
      [artikel 1, vierde lid, onder a, van de Visserijwet 1963][ref6].


