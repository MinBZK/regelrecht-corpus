  - number: '12'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn belast:

      1°. de bij of krachtens de [artikelen 141][ref1] en [539d van het Wetboek van Strafvordering][ref2] aangewezen
      ambtenaren;

      2°. de door Onze Minister van Infrastructuur en Milieu aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
