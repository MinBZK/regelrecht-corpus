preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is regels te stellen tot uitvoering van het op 1 juni
    1967 te Londen tot stand gekomen Verdrag inzake de uitoefening van de visserij op de Noordatlantische Oceaan, met
    Bijlagen en Aanhangsel;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Deze wet verstaat onder:

      a. "het Verdrag": het op 1 juni 1967 te Londen tot stand gekomen Verdrag inzake de uitoefening van de visserij op
      de Noordatlantische Oceaan, met Bijlagen en Aanhangsel (*Trb.* 1968, 54);

      b. "vissersvaartuig": elk vaartuig dat bedrijfsmatig wordt gebruikt voor de visserij op die delen van de
      Atlantische Oceaan en de Noordelijke IJszee, en de daarmede in verbinding staande zeeën, waarop het Verdrag van
      toepassing is;

      c. "vaartuig": elk vissersvaartuig en elk vaartuig dat bedrijfsmatig wordt gebruikt voor de verwerking van vis, het
      bevoorraden van, of het verlenen van diensten aan vissersvaartuigen;

      d. "schipper": elke gezagvoerder van een vaartuig of degene die deze vervangt.

      2 Een vaartuig geldt als Nederlands indien het in overwegende mate vanuit Nederland wordt geëxploiteerd, in de
      regel in Nederland havent en voor ten minste twee derde gedeelte toebehoort aan:

      a. één of meer natuurlijke personen die de nationaliteit van een der lid-staten van de Europese Gemeenschappen dan
      wel van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte bezitten of

      b. één of meer rechtspersonen die in overeenstemming met de wetgeving van een lid-staat van de Europese
      Gemeenschappen dan wel van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte zijn opgericht en die hun statutaire zetel, hun hoofdbestuur of hun hoofdvestiging binnen de Europese
      Gemeenschappen dan wel binnen een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte hebben.

      3 Het exploiteren van een vaartuig bedoeld in het tweede lid, kan mede plaatsvinden door middel van een
      nevenvestiging als bedoeld in [artikel 1, onderdeel l, van de Handelsregisterwet 2007][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021777#Artikel1
    url: https://wetten.overheid.nl/BWBR0002897/2025-07-01#Artikel1
    references:
