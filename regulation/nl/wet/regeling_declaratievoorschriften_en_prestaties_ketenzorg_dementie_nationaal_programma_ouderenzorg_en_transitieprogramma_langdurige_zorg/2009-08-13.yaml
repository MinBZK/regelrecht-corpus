    Heeft de Nederlandse Zorgautoriteit de volgende regeling vastgesteld:
  url: https://wetten.overheid.nl/BWBR0026234/2009-08-13#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Deze regeling is van toepassing op zorgaanbieders die zorg leveren als bedoeld in de [Wmg][ref1], voor zover ze
      prestaties Ketenzorg dementie of Nationaal Programma Ouderenzorg (NPO) leveren of Transitieprogramma langdurige
      zorg (TPLZ).


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0026234/2009-08-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: '2'
    text: |-
      In deze regeling wordt verstaan onder:

      - *Prestaties ketenzorg dementie, nationaal programma ouderenzorg en transitieprogramma langdurige zorg:* De
      prestatie ketenzorg dementie, de prestatie nationaal programma ouderenzorg en de prestatie transitieprogramma
      langdurige zorg zijn kortdurende kleinschalige experimenten waarbij: • de prestatie al die zorg omvat, die valt
      onder de Leidraad Ketenzorg Dementie, of onder het nationaal programma ouderenzorg of onder het transitieprogramma
      langdurige zorg. • het zorgkantoor en zorgaanbieder zelf een beschrijving geven van de nieuwe prestatie zodanig dat
      de zorg voor desbetreffende cliënten duidelijk is verwoord inclusief de beoogde uitkomsten van die zorg.
      - *Kortdurend kleinschalige experiment:* Onder kortdurende kleinschalige experimenten worden verstaan experimenten
      die: a. een looptijd hebben van maximaal drie kalenderjaren na startdatum van het kortdurend kleinschalig
      experiment; b. gericht zijn op nieuwe of vernieuwende zorglevering met een betere prijs/kwaliteitsverhouding, op
      efficiënte zorgorganisatie; c. beperkt zijn tot een specifieke zorgprestatie waarbij zorgaanbieders en zorgkantoren
      alleen op lokaal/regionaal niveau betrokken zijn; d. niet louter tot doel hebben over te gaan op vrije prijzen; en
      e. controleerbare en verifieerbare resultaten in de testomgeving zullen opleveren.
      - *Betere prijs/kwaliteitsverhouding:* Een betere prijs/kwaliteitsverhouding zoals verwoord in 2.2 b betekent dat
      zorgkantoren en zorgaanbieders: • de kwaliteit van de zorg voor de cliënt verhogen zonder de prijs van de zorg
      te verhogen; • de prijs van de zorg verlagen zonder dat de kwaliteit van de zorg voor de cliënt wordt verlaagd, •
      zowel de kwaliteit van de zorg voor de cliënt verhogen als de prijs van de zorg verlagen, óf • de kwaliteit van de
      zorg voor de cliënt verhogen met een in verhouding beperkte toename in de prijs.
    url: https://wetten.overheid.nl/BWBR0026234/2009-08-13#Artikel2
  - number: '3'
    text: |-
      3.1 De registratie van de gegevens zoals genoemd in [artikel 4][ref1] heeft tot doel:

      De ontwikkelingen van ketenzorg dementie en het nationaal programma ouderenzorg en de daaruit volgende resultaten
      in de zorgverlening in relatie tot de betaalbaarheid, toegankelijkheid en kwaliteit van de zorg te kunnen volgen,
      toetsen en evalueren.

      3.2 De declaratievoorschriften zoals in [artikel 5][ref2] hebben tot doel:

      a. Rechtmatige declaratie mogelijk te maken;

      b. Dubbele declaraties te voorkomen; en

      c. Voorkomen onnodige administratieve lasten.


      [ref1]: https://wetten.overheid.nl/BWBR0026234#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0026234#Artikel5
    url: https://wetten.overheid.nl/BWBR0026234/2009-08-13#Artikel3
    references:
      - id: ref1
