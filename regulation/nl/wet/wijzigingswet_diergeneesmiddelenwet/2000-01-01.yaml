preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in de Diergeneesmiddelenwet een mogelijkheid op te
    nemen om de kosten van wijzigingen van registraties en van onderzoek ter plaatse ten behoeve van een vergunning
    voor fabrikanten of leveranciers van diergeneesmiddelen in rekening te brengen, alsmede enkele van de wet
    afwijkende bepalingen die op grond van artikel 49 van de wet bij of krachtens algemene maatregel van bestuur zijn
    gesteld ter implementatie van een aantal richtlijnen van de Raad van de Europese Gemeenschappen in de wet op te
    nemen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009952/2000-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      [Artikel I, onderdeel O][ref1], is uitsluitend van toepassing op diergeneesmiddelen waarvoor een aanvraag tot
      registratie of tot verlenging van de registratie is ingediend op of na de dag waarop deze wet in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0009952#ArtikelI
    url: https://wetten.overheid.nl/BWBR0009952/2000-01-01#ArtikelII
    references:
      - id: ref1
        bwb_id: BWBR0009952
        artikel: I
  - number: III
    text: |-
      Na de inwerkingtreding van deze wet:

      a.

      b. berust het [Eisen- en controlebesluit vergunningen diergeneesmiddelen 1993][ref1] op de [artikelen 23][ref2],
      [39][ref3], [40, vierde lid][ref4], en [42 van de Diergeneesmiddelenwet][ref5];

      c. berust het [Besluit gemedicineerd voeder][ref6] op
      [artikel 42, eerste lid, onderdelen a, b, d en f, en tweede lid, van de Diergeneesmiddelenwet][ref7];

      d. berust de Regeling vergunningen diergeneesmiddelen op de [artikelen 1, tweede lid, onderdeel d][ref8],
      [24][ref9] en [27 van de Diergeneesmiddelenwet][ref10].


