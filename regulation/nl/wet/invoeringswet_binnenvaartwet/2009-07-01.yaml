preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is de invoering van de Binnenvaartwet te regelen,
    alsmede een aantal wetten waarin wordt verwezen naar de Binnenschepenwet, de Wet vervoer binnenvaart en de Wet
    vaartijden en bemanningssterkte binnenvaart aan te passen aan de Binnenvaartwet;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023849/2009-07-01#ArtikelAanhef
