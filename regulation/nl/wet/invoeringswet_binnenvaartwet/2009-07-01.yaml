  - number: '17'
    text: |-
      Ten aanzien van aanvragen ter verkrijging van een certificaat van onderzoek, een meetbrief, een vaarbewijs, een
      medische verklaring, een verklaring met betrekking tot de vereiste kennis en bekwaamheid om een schip te voeren,
      een scheepsregistratienummer of een ontheffing op grond van respectievelijk de [Binnenschepenwet][ref1], de
      [Wet vervoer binnenvaart][ref2] of de [Wet vaartijden en bemanningssterkte binnenvaart][ref3], ingediend ten minste
      vier weken voor het tijdstip van inwerkingtreding van de desbetreffende artikelen van de [Binnenvaartwet][ref4],
      blijft op de behandeling daarvan het recht zoals dat gold voor dat tijdstip van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003443
      [ref2]: https://wetten.overheid.nl/BWBR0005319
      [ref3]: https://wetten.overheid.nl/BWBR0006029
      [ref4]: https://wetten.overheid.nl/BWBR0023009
    url: https://wetten.overheid.nl/BWBR0023849/2009-07-01#Artikel17
