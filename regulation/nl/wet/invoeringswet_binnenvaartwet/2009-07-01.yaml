  - number: '19'
    text: |-
      Op rechtsgedingen, welke bij het in werking treden van de [Binnenvaartwet][ref1] aanhangig zijn, blijven
      ten aanzien van de rechterlijke bevoegdheid en van de rechtsvordering, zowel in eerste aanleg als in verdere
      instantie, de regelen bij of krachtens de [Binnenschepenwet][ref2], de [Wet vervoer binnenvaart][ref3] en de
      [Wet vaartijden en bemanningssterkte binnenvaart][ref4] van toepassing, zoals deze gelden ten tijde van de
      inleidende dagvaarding.


