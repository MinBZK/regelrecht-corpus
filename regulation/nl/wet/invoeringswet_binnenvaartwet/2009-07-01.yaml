  - number: '18'
    text: |-
      Indien tegen een besluit krachtens respectievelijk de [Binnenschepenwet][ref1], de [Wet vervoer binnenvaart][ref2]
      of de [Wet vaartijden en bemanningssterkte binnenvaart][ref3], voorafgaande aan de inwerkingtreding
      van de [Binnenvaartwet][ref4], een bezwaar- of beroepschrift is ingediend, blijven op de behandeling
      daarvan de regelen bij of krachtens de [Binnenschepenwet][ref5], de [Wet vervoer binnenvaart][ref6] en de
      [Wet vaartijden en bemanningssterkte binnenvaart][ref7], zoals die luidden voor dat tijdstip, van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003443
      [ref2]: https://wetten.overheid.nl/BWBR0005319
