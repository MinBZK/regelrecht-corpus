  - number: 1.2.1
    text: De SVB heeft haar zetel te Amstelveen.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.2
  - number: 1.2.2
    text: Het UWV heeft zijn zetel te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.2
  - number: '1.4'
    text: Besluiten van het UWV en de SVB,
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.4
  - number: 1.4.a
    text: |-
      tot het verwerven en vervreemden van eigendom van registergoederen die afzonderlijk een bedrag van € 250.000,– niet
      te boven gaan;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.4
  - number: 1.4.b
    text: |-
      tot het aangaan en beëindigen van overeenkomsten tot huur of verhuur van registergoederen die afzonderlijk een
      bedrag op jaarbasis van € 1.000.000,– niet te boven gaan;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.4
  - number: 1.5.1
    text: |-
      De verwerking van gegevens door het UWV en de SVB bij de uitvoering van andere werkzaamheden, bedoeld in
      [artikel 73a, eerste lid, van de Wet SUWI][ref1], vindt uitsluitend plaats indien:


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 73a
  - number: 1.5.1.a
    text: de gegevens noodzakelijk zijn voor de uitvoering van die andere dan wettelijke taken;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.5
  - number: 1.5.1.b
    text: de gegevens systematisch worden verwerkt; en
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.5
  - number: 1.5.1.c
    text: |-
      de gegevens, en de wijze van verwerking daarvan, zijn omschreven in de overeenkomst op grond waarvan de andere dan
      wettelijke taken worden verricht.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.5
  - number: 1.5.2
    text: |-
      De gegevensverstrekking door het UWV en de SVB aan derden, bedoeld in
      [artikel 73a, tweede lid, van de Wet SUWI][ref1], geschiedt slechts indien de gegevens systematisch worden
      verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 73a
  - number: 1.5.3
    text: |-
      Bij het verstrekken van gegevens op verzoek aan een derde, bedoeld in
      [artikel 73a, tweede lid, van de Wet SUWI][ref1], brengen het UWV en de SVB de kosten van die verstrekking in
      rekening aan die derde.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73a
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.5
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: 73a
  - number: '1.6'
    text: |-
      Het UWV en de SVB brengen voor het verrichten van andere werkzaamheden, bedoeld in
      [artikel 5, eerste lid, van de Wet SUWI][ref1], zodanige prijzen in rekening aan de opdrachtgever dat valt aan te
      nemen dat, gerekend over het desbetreffende jaar, alle directe en indirecte aan die andere taken toe te rekenen
      lasten door de te verwachten baten zijn gedekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '5'
  - number: '1.7'
    text: |-
      De minister wijst een rechtspersoon aan waar het secretariaat van de landelijke cliëntenraad, bedoeld in
      [artikel 8, vierde lid, van de Wet SUWI][ref1], wordt ondergebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel8
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '8'
  - number: 2.1.1
    text: |-
      De minister stelt jaarlijks voor 1 december de omvang van de middelen van de landelijke cliëntenraad als bedoeld in
      [artikel 8, vierde lid, van de Wet SUWI][ref1], vast aan de hand van een jaarplan met begroting.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel8
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '8'
  - number: 2.1.2
    text: 'Deze middelen zijn bestemd voor:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
  - number: 2.1.2.a
    text: de kosten van het secretariaat en ondersteuning van de landelijke cliëntenraad;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
  - number: 2.1.2.b
    text: de kosten ten behoeve van leden van de landelijke cliëntenraad en in verband met de taakuitoefening door de raad;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
  - number: 2.1.2.c
    text: |-
      kosten in verband met in het jaarplan opgenomen onderzoeken naar cliëntenparticipatie in het domein van werk en
      inkomen en activiteiten ter bevordering van deze cliëntenparticipatie.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
  - number: 2.1.3
    text: |-
      De minister kan toestaan, dat de middelen worden aangewend voor meer activiteiten dan in het jaarplan met begroting
      zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
  - number: 2.1.4
    text: De minister kan besluiten de omvang van de middelen te wijzigen.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
  - number: 2.1.5
    text: |-
      Ten behoeve van de landelijke cliëntenraad worden geen verplichtingen aangegaan en geen uitgaven gedaan die leiden
      tot overschrijding van de vastgestelde middelen.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.1
  - number: 2.2.1
    text: |-
      Elk jaar wordt ten behoeve van het beschikbaar stellen van de middelen voor de landelijke cliëntenraad voor 1
      juli van het jaar voorafgaande aan het begrotingsjaar een beknopt concept jaarplan met een globale begroting en
      voor 1 oktober van dat jaar een jaarplan met begroting en een voorstel voor de hoogte van de twee voorschotten,
      ingediend.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.2
  - number: 2.2.2
    text: |-
      De middelen worden in twee delen bij wijze van voorschot betaald: de eerste termijn op of omstreeks 10 januari van
      het jaar waarop de middelen betrekking hebben, en op of omstreeks 1 juli het restant.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.2
  - number: 2.2.3
    text: |-
      Uiterlijk 15 maart van het jaar volgend op het jaar waarop het jaarverslag betrekking heeft, wordt aan de minister
      een jaarverslag van de landelijke cliëntenraad voorzien van jaarrekening met controleverklaring gezonden.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.2
  - number: 2.2.4
    text: |-
      De controleverklaring wordt verzorgd door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 2.2.5
    text: De minister stelt de definitieve middelen voor het jaar waarover verantwoording is afgelegd vast.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel2.2
  - number: 3.1.1
    text: |-
      De melding, bedoeld in [artikel 37 van de Pensioenwet][ref1] en
      [artikel 45 van de Wet verplichte beroepspensioenregeling][ref2], van de arbeidsongeschiktheid van deelnemers,
      bedoeld in [artikel 1 van de Pensioenwet][ref3] en [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4],
      door het UWV aan een pensioenuitvoerder, bedoeld in artikel 1 van de Pensioenwet en artikel 1 van de Wet verplichte
      beroepspensioenregeling, betreft de verwerking van gegevens over de aanvraag voor een uitkering op grond van de Wet
      werk en inkomen naar arbeidsvermogen of de Wet op de arbeidsongeschiktheidsuitkering, waarbij:


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '37'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '45'
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '1'
  - number: 3.1.1.a
    text: een pensioenuitvoerder een bestand van deelnemers en gewezen deelnemers verstrekt aan het UWV;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.1
  - number: 3.1.1.b
    text: |-
      het UWV de gegevens van de deelnemers en de gewezen deelnemers in verband brengt met gegevens van personen die een
      arbeidsongeschiktheidsuitkering van het UWV hebben aangevraagd;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.1
  - number: 3.1.1.c
    text: |-
      het UWV de gegevens van deelnemers en gewezen deelnemers naar aanleiding van een aanvraag voor een uitkering op
      grond van de in de aanhef genoemde arbeidsongeschiktheidsverzekeringswetten verstrekt aan een pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.1
  - number: 3.1.2
    text: |-
      Het UWV verstrekt de gegevens, bedoeld in het eerste lid, aan de pensioenuitvoerder door middel van een daarvoor
      door het UWV ingerichte elektronische voorziening.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.1
  - number: 3.1.3
    text: |-
      Voor de levering van de gegevens, bedoeld in het eerste lid, brengt het UWV geen kosten in rekening bij de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.1
  - number: 3.2.1
    text: |-
      De pensioenuitvoerder verwerkt de gegevens van de melding uitsluitend voor de uitvoering van de pensioenregeling
      of beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.2
  - number: 3.2.2
    text: |-
      Indien de pensioenuitvoerder de werkzaamheden uitbesteedt als bedoeld in [artikel 34 van de Pensioenwet][ref1] en
      [artikel 43 van de Wet verplichte beroepspensioenregeling][ref2] en deze uitbesteding inhoudt, dat de daar genoemde
      derde bewerker is in de zin van de [Wet bescherming persoonsgegevens][ref3] voor de pensioenuitvoerder, verstrekt
      het UWV de gegevens aan deze derde.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel43
      [ref3]: https://wetten.overheid.nl/BWBR0028067
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '34'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '43'
      - id: ref3
        bwb_id: BWBR0028067
  - number: 3.2.3
    text: |-
      Het UWV overlegt over de inrichting van de elektronische voorziening, bedoeld in [artikel 3.1, tweede lid][ref1],
      met een vertegenwoordiging van de pensioenuitvoerders.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel3
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.1'
  - number: 3.3.1
    text: |-
      Op verzoek van een college van burgemeester en wethouders verstrekt het UWV aan de hand van het
      meegeleverde burgerservicenummer en aanvullende identificerende gegevens adresgegevens als bedoeld in
      [artikel 5.9, eerste lid, onderdeel i, van het Besluit SUWI][ref1], die het UWV verwerkt in de polisadministratie,
      bedoeld in [artikel 33 van de Wet SUWI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel33
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '33'
  - number: 3.3.2
    text: |-
      De adresgegevens, bedoeld in het eerste lid, die door het UWV worden verstrekt betreffen de in
      [Bijlage I bij het Besluit SUWI][ref1] onder Straatadres Nederland tot en met Straatadres buitenland genoemde
      gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013267
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
  - number: 3.3.3
    text: |-
      Het UWV verstrekt de gegevens, bedoeld in het tweede lid, op de door het college van burgemeester en wethouders bij
      het verzoek aangegeven wijze of verwerkt die gegevens in het kader van de gezamenlijke elektronische voorzieningen
      SUWI.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.3
  - number: 3.3.4
    text: |-
      Het UWV en de colleges van burgemeester en wethouders verwerken de adresgegevens, bedoeld in eerste en tweede lid,
      in het kader van de gezamenlijke elektronische voorzieningen SUWI op de wijze, bedoeld in [artikel 6.2][ref1],
      [6.3][ref2] en [6.4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0013280#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0013280#Artikel6
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref2
        bwb_id: BWBR0013280
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
      - id: ref3
        bwb_id: BWBR0013280
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6.1'
  - number: 3.3.5
    text: |-
      Het UWV bepaalt bij de uitvoering van taken als bedoeld in
      [artikel 5.21, eerste en tweede lid, van het Besluit SUWI][ref1], op welke wijze bij de toepassing van het vierde
      lid, inhoud wordt gegeven aan de gegevensverwerking op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
  - number: 3.3.6
    text: |-
      Het UWV verstrekt de gegevens, bedoeld in het tweede lid, zonder gebruikmaking van de gezamenlijke elektronische
      voorzieningen, maximaal vier maal in een kalenderjaar aan het zelfde college van burgemeester en wethouders.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.3
  - number: 3.3.7
    text: |-
      Onverminderd het vierde lid beëindigt het UWV de gegevensverwerking op grond van dit artikel, indien
      het college van burgemeester en wethouders de gegevens voor een ander doel dan het doel, genoemd in
      [artikel 5.9, eerste lid, onderdeel i, van het Besluit SUWI][ref1] gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
  - number: '3.4'
    text: |-
      In deze paragraaf wordt verstaan onder:

            a
            arbeidsverhouding:

              de rechtsbetrekking tussen een werkgever en een natuurlijk persoon, krachtens welke deze persoon verplicht
      is, arbeid te verrichten voor die werkgever;



            b
             jaaropgave:

              de jaaropgave, bedoeld in [artikel 8 van het Loonadministratiebesluit][ref1];



            c
             melding sociale verzekeringen:

              de melding sociale verzekeringen, bedoeld in de[ artikelen 1][ref2] en
      [4 van het Besluit melding sociale verzekeringen][ref3];



            d
             uitkeringsgerechtigde:

              verzekerde die recht heeft op een uitkering of arbeidsondersteuning krachtens de
      [Ziektewet][ref4], de [WW][ref5], de [Wet werk en inkomen naar arbeidsvermogen][ref6], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref7], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8],
      de [Wet werk en arbeidsondersteuning jonggehandicapten][ref9], de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriteria][ref10], [TW][ref11] of de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref12];



            e
             uitkeringsverhouding:

              de rechtsbetrekking ter zake van een recht op uitkering of arbeidsondersteuning krachtens
      de [Ziektewet][ref13], de [WW][ref14], de[ Wet werk en inkomen naar arbeidsvermogen][ref15],
      de [Wet op de arbeidsongeschiktheidsverzekering][ref16], de
      [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref17], de
      [Wet werk en arbeidsondersteuning jonggehandicapten][ref18], de
      [Tijdelijke wet beperking inkomensgevolgen arbeidsongeschiktheidscriterium][ref19], de [TW][ref20] of de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref21], tussen een uitkeringsgerechtigde en het UWV;



            f
             verzekerde:

              de werknemer in de zin van de werknemersverzekeringen, of
      degene, die door het UWV als verzekerde wordt beschouwd, dan wel belanghebbende is in de zin van
      [artikel 1 van de Wet arbeidsongeschiktheidsvoorziening militairen][ref22].



            g
             verzekerdenadministratie:

              een systeem, dan wel een geheel van systemen of delen daarvan, door middel waarvan de in deze regeling
      gedefinieerde gegevens van verzekerden op systematische wijze worden vastgelegd om te kunnen worden geraadpleegd,
      uitgewisseld en samengevoegd en in onderling verband te kunnen worden gebracht, dat door het UWV wordt beheerd als
      bedoeld in [artikel 33, tweede lid, van de Wet SUWI][ref23], zoals die bepaling luidde op de dag voorafgaande aan
      de datum van inwerkingtreding van [artikel 5 van de Invoeringswet Wet financiering sociale verzekeringen][ref24];



            h
             verzekeringsverhouding:

              de rechtsbetrekking ter zake van een wettelijke verzekering als
      bedoeld in [artikel 30 van de Wet SUWI][ref25], dan wel op grond van de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref26], tussen een verzekerde en het UWV waarbij hij
      geregistreerd is als verzekerde;



            i
             code SZ:

              een aanduiding waarmee de wet, op grond waarvan de verzekerings- of uitkeringsverhouding bestaat, wordt
      aangegeven;



            j
            overwerk:

              arbeid verricht buiten de voor de betrokkene vastgestelde dagelijkse werktijd, voorzover daardoor deze
      werktijd wordt overschreden;



            k
            feestdag:

              Nieuwjaarsdag, Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede Pinksterdag en Eerste en Tweede
      Kerstdag.


