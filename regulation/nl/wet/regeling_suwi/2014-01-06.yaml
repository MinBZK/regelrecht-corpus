  - number: 3.5.1
    text: |-
      Ten behoeve van de uitvoering van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1] en de wettelijke
      regelingen, bedoeld in [artikel 30 van de Wet SUWI][ref2], worden in de verzekerdenadministratie ten aanzien van
      elke verzekerde ten minste de volgende gegevens door het UWV vastgelegd:


      [ref1]: https://wetten.overheid.nl/BWBR0002822
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
    references:
      - id: ref1
        bwb_id: BWBR0002822
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 3.5.1.a
    text: 'persoonsgegeven: burgerservicenummer;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.b
    text: 'werkgeversgegeven: aansluitingsnummer;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.c
    text: 'gegevens van de arbeidsverhouding:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.c.1º
    text: datum aanvang arbeidsverhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.c.2º
    text: datum einde arbeidsverhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.d
    text: 'gegevens van de verzekeringsverhouding:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.d.1º
    text: datum aanvang verzekeringsverhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.d.2º
    text: datum einde verzekeringsverhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.d.3º
    text: code SZ verzekeringsverhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.e
    text: 'gegevens van de uitkeringsverhouding:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.e.1º
    text: datum aanvang uitkeringsverhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.e.2º
    text: datum einde uitkeringsverhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.1.e.3º
    text: code SZ uitkeringsverhouding.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.2
    text: |-
      In de verzekerdenadministratie kunnen door het UWV andere dan de in het eerste lid genoemde gegevens worden
      vastgelegd als aan de volgende voorwaarden is voldaan:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.2.a
    text: de additionele gegevens die in de verzekerdenadministratie worden vastgelegd zijn actueel en betrouwbaar;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.5.2.b
    text: |-
      de vastlegging van de additionele gegevens staat een toekomstige uitbreiding van de in het eerste lid genoemde
      gegevens niet in de weg.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.5
  - number: 3.6.1
    text: |-
      Tussen de in de verzekerdenadministratie opgenomen gegevens moeten ten minste zodanige verbanden kunnen worden
      gelegd, dat vastgesteld kan worden:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.a
    text: |-
      per verzekerde: welke verzekerings-, arbeids- en uitkeringsverhoudingen van hem zijn geregistreerd en op welke
      periode deze betrekking hebben;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.b
    text: 'per arbeidsverhouding: op welke verzekerde en op welke werkgever die arbeidsverhouding betrekking heeft;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.c
    text: 'per verzekeringsverhouding:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.c.1º
    text: op welke verzekerde de verzekeringsverhouding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.c.2º
    text: op welke wet de verzekeringsverhouding berust;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.d
    text: 'per uitkeringsverhouding:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.d.1º
    text: op welke uitkeringsgerechtigde de uitkeringsverhouding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.1.d.2º
    text: op welke wet de uitkeringsverhouding berust.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.6.2
    text: Het leggen van een verband met een wet gebeurt door aanduiding van de desbetreffende wet met de code SZ-wet.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.6
  - number: 3.7.1
    text: |-
      Het UWV houdt de gegevens bedoeld in [artikel 3.5, onderdelen a tot en met e][ref1], gedurende ten minste vijf
      kalenderjaren na het jaar waarin deze gegevens zijn opgenomen, beschikbaar ten behoeve van raadplegingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel3
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.7
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.7.2
    text: |-
      Vanaf het moment dat een verzekerde de leeftijd van 65 jaar bereikt of voor het bereiken van die leeftijd
      overlijdt, worden de hem betreffende, in de verzekerdenadministratie opgenomen gegevens, gedurende vijf jaren te
      rekenen vanaf dat moment door het UWV bewaard.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.7
  - number: 3.8.1
    text: |-
      Het UWV baseert de vulling en het onderhoud van de verzekerdenadministratie op ontvangst, verificatie en verwerking
      van onder meer de volgende berichten en gegevensstromen:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.1.a
    text: de melding sociale verzekering;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.1.b
    text: |-
      een mededeling als bedoeld in [artikel 59 van de Wet SUWI][ref1], zoals die bepaling luidde op de dag voorafgaande
      aan de datum van inwerkingtreding van [artikel 5 van de Invoeringswet Wet financiering sociale verzekeringen][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0017747#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0017747
        artikel: '5'
  - number: 3.8.1.c
    text: |-
      een schriftelijk verzoek, afkomstig van de verzekerde, tot verbetering, aanvulling of verwijdering van hem
      betreffende gegevens;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.1.d
    text: gegevensverstrekking door de verzekerde naar aanleiding van een aanvraag voor een uitkering;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.1.e
    text: de jaaropgave;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.1.f
    text: verificatieberichten;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.1.g
    text: informatie uit hoofde van een door het UWV verrichte looncontrole of fraude-onderzoek.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.2
    text: |-
      In afwijking van het bepaalde in het eerste lid vindt de vastlegging van een arbeidsverhouding en
      verzekeringsverhouding door middel van de berichten bedoeld in de onderdelen b tot en met d en f van het eerste lid
      plaats zodra het bestaan van de arbeidsverhouding en verzekeringsverhouding wordt aangetoond.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.8.3
    text: |-
      De in het eerste lid, onderdelen a tot en met c, bedoelde berichten en gegevensstromen worden bewaard voor een
      periode van ten minste 5 jaren na afloop van het kalenderjaar waarin de gegevens in de verzekerdenadministratie
      zijn verwerkt.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.8
  - number: 3.9.1
    text: |-
      Na ontvangst van de melding sociale verzekering verwerkt het UWV de daaraan te ontlenen gegevens binnen een week in
      de verzekerdenadministratie.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.9
  - number: 3.9.2
    text: |-
      Na ontvangst van de jaaropgave verwerkt het UWV de daaraan te ontlenen gegevens binnen zesentwintig weken in de
      verzekerdenadministratie.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.9
  - number: 3.10.1
    text: |-
      Het UWV verifieert de in het tweede lid genoemde gegevens bij de authentieke bron bij de eerste opname van gegevens
      over de verzekerde in de verzekerdenadministratie en vervolgens, indien daartoe aanleiding is.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.10
  - number: 3.10.2
    text: |-
      Voor de in [artikel 3.5][ref1] bedoelde gegevens gelden als authentieke bron:


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel3
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.2.a
    text: 'burgerservicenummer: de beheersvoorziening BSN;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.10
  - number: 3.10.2.b
    text: 'gegevens van de arbeidsverhouding: de administratie van de werkgever.'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.10
  - number: 3.10.3
    text: |-
      Voor de in [artikel 3.5][ref1] genoemde gegevens waarvoor in het tweede lid geen persoon of instelling als
      authentieke bron is aangemerkt, geldt als authentieke bron het UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel3
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.10
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '3'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: 3.10.4
    text: |-
      De verificatie bij eerste opname van gegevens over de verzekerde vindt plaats binnen vier weken na ontvangst van
      die gegevens.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.10
  - number: 3.11.1
    text: |-
      Het UWV houdt in het belang van de gegevensuitwisseling die noodzakelijk is voor de uitvoering van de in
      [artikel 30 Wet SUWI][ref1] genoemde wetten een gemeenschappelijke verwijsindex op de verzekerdenadministratie
      in stand.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: 3.11.2
    text: |-
      Van de verzekerde, met wie het UWV een verzekeringsverhouding of een uitkeringsverhouding heeft, worden in de
      gemeenschappelijk verwijsindex, zodanig dat zij direct te raadplegen zijn, ten minste de volgende verwijsgegevens
      opgenomen:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.11.2.a
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.11.2.b
    text: de aard van de verhouding, waarbij de aard van de uitkeringsverhouding wordt aangeduid met de code SZ-wet;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.11.2.c
    text: gegevens over het UWV-onderdeel en de locatie waar de verhouding is geadministreerd;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.11.2.d
    text: de begindatum van de verhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.11.2.e
    text: de einddatum van de verhouding;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.11.2.f
    text: het dossiernummer, behorend bij de verhouding.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.11.3
    text: |-
      Wanneer een verzekerde geen verzekeringsverhouding of uitkeringsverhouding meer heeft met het UWV, blijven de
      verwijsgegevens ten minste vijf jaar na het einde van de laatste verzekeringsverhouding of uitkeringsverhouding in
      de gemeenschappelijke verwijsindex bewaard.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.11
  - number: 3.12.1
    text: |-
      Het UWV verwerkt wekelijks gegevens met betrekking tot arbeidskrachten afkomstig van werkgevers die zich in het
      kader van de uitoefening van hun bedrijf of beroep bezighouden met het ter beschikking stellen van arbeidskrachten.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: 3.12.2
    text: 'De gegevens, bedoeld in het eerste lid, betreffen:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: 3.12.2.a
    text: het aantal dagen en aantal uren waarop arbeid is verricht;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: 3.12.2.b
    text: het aantal uren waarop overwerk is verricht;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: 3.12.2.c
    text: het aantal uren waarover onverminderde doorbetaling van loon heeft plaatsgevonden in verband met een feestdag;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: 3.12.2.d
    text: |-
      het aantal uren waarover onverminderde doorbetaling van loon heeft plaatsgevonden in verband met ziekte
      als bedoeld in [artikel 629 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1] of verlof op grond van de
      [Wet arbeid en zorg][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '629'
      - id: ref2
        bwb_id: BWBR0013008
  - number: 3.12.2.e
    text: |-
      het aantal uren waarop de werknemer geen arbeid heeft verricht en waarover hij onverminderde doorbetaling van zijn
      loon heeft genoten;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: 3.12.2.f
    text: het kantooradres en telefoonnummer van de werkgever, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: 3.12.2.g
    text: de resterende aanspraak op vakantie in uren.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel3.12
  - number: '4.1'
    text: |-
      De subsidie, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________, en de door het UWV aan het re-integratiebedrijf of de arbodienst maximaal te
      vergoeden kosten van de uitvoering van de persoonsgebonden re-integratieovereenkomst, bedoeld in
      __REF001___________________________________________________________________________________________________________
      _________ bedragen ten hoogste € 3630,– per cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019058
        artikel: '2'
  - number: '4.6'
    text: |-
      Het UWV en de overheidswerkgever stellen regels omtrent voorwaarden waaraan een re-integratiebedrijf, deskundige
      persoon of arbodienst moet voldoen, alvorens met dat bedrijf, die persoon of die dienst een individuele re-
      integratieovereenkomst wordt gesloten. Die regels hebben in elk geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.6
  - number: 4.6.1°
    text: uitsluitingsgronden;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.6
  - number: 4.6.2°
    text: kwaliteitseisen;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.6
  - number: 4.6.3°
    text: ervaringseisen.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.6
  - number: 4.7.1
    text: |-
      Het UWV en de overheidswerkgever kunnen uitsluitend een individuele re-integratieovereenkomst sluiten indien de
      aanvraag vergezeld gaat van een door of namens de aanvrager, bedoeld in [artikel 4.2, eerste lid][ref1], danwel
      [artikel 4.2a, eerste lid, van het Besluit SUWI][ref2], opgesteld plan waarin in elk geval zijn opgenomen:


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '4'
  - number: 4.7.1.1°
    text: het opleidingsniveau en het burgerservicenummer van de aanvrager;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.7
  - number: 4.7.1.2°
    text: |-
      een beschrijving van de werkzaamheden die op grond van de individuele re-integratieovereenkomst zullen worden
      verricht;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.7
  - number: 4.7.1.3°
    text: |-
      de verwachte begin- en einddatum van de werkzaamheden die op grond van de individuele re-integratieovereenkomst
      zullen worden verricht;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.7
  - number: 4.7.1.4°
    text: de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.7
  - number: 4.7.1.5°
    text: |-
      een opgave van de kosten van de werkzaamheden die op grond van de individuele re-integratieovereenkomst zullen
      worden verricht.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.7
  - number: 4.7.2
    text: |-
      Het UWV en de overheidswerkgever kunnen een termijn bepalen waarbinnen de aanvrager, bedoeld in het eerste lid, een
      aanvraag om een individuele re-integratieovereenkomst kan indienen.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.7
  - number: '4.8'
    text: 'In de individuele re-integratieovereenkomst wordt in elk geval geregeld:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.8
  - number: 4.8.a
    text: |-
      dat een door het UWV of de overheidswerkgever te bepalen deel van de kosten van de door het re-integratiebedrijf,
      de deskundige persoon of de arbodienst verrichte werkzaamheden slechts door het UWV of de overheidswerkgever wordt
      vergoed indien de persoon, ten behoeve van wie een individuele re-integratieovereenkomst is gesloten, binnen drie
      maanden nadat de werkzaamheden bedoeld in dit contract zijn geëindigd het verrichten van arbeid duurzaam heeft
      hervat, waarbij het UWV of de overheidswerkgever voor personen verschillende definities van duurzame werkhervatting
      mag hanteren;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.8
  - number: 4.8.b
    text: |-
      dat het re-integratiebedrijf, de deskundige persoon of de arbodienst op door het UWV of de overheidswerkgever
      te bepalen tijdstippen bij het UWV of de overheidswerkgever een rapportage indient waarin een beschrijving is
      opgenomen van de werkzaamheden die zijn verricht ten behoeve van de inschakeling in het arbeidsproces van de
      persoon. In de rapportage wordt een prognose voor de resterende periode van het traject beschreven;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.8
  - number: 4.8.c
    text: |-
      dat de overeenkomst door beide partijen slechts wegens gewichtige redenen tussentijds door opzegging kan worden
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel4.8
  - number: '5.2'
    text: Het UWV en de SVB dienen ieder jaarlijks vóór 1 juli een ontwerp-jaarplan met begroting bij de minister in.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.2
  - number: 5.3.1
    text: Het UWV, de SVB en het IB bieden ieder hun jaarplan met begroting jaarlijks vóór 1 oktober aan de minister aan.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.3
  - number: 5.3.2
    text: |-
      De jaarplannen met begrotingen van het UWV , de SVB, en het IB bevatten in elk geval een omschrijving van de
      onderwerpen die zijn genoemd in de bij deze regeling behorende [bijlagen VI][ref1], [VIII][ref2] en [XI][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013280
      [ref3]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013280
      - id: ref3
        bwb_id: BWBR0013280
  - number: 5.3.3
    text: |-
      Het jaarplan van het UWV bestaat uit twee afzonderlijke delen, waarvan één deel uitsluitend betrekking heeft op het
      in [artikel 5.21, tweede lid, van het Besluit SUWI][ref1] bedoelde organisatieonderdeel en het andere deel op het
      UWV met uitzondering van het bedoelde organisatieonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
  - number: 5.3.4
    text: |-
      De delen van het jaarplan die betrekking hebben op het in [artikel 5.21, tweede lid, van het Besluit SUWI][ref1]
      bedoelde organisatieonderdeel bevatten in elk geval een omschrijving van de onderwerpen die zijn genoemd in de bij
      deze regeling behorende [bijlage XX][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0013280
  - number: 5.10a.1
    text: |-
      De jaarverslagen van het UWV en de SVB bevatten in elk geval een omschrijving van de onderwerpen die zijn genoemd
      in de bij deze regeling behorende bijlagen, [VI][ref1] en [VIII][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10a
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013280
  - number: 5.10a.2
    text: |-
      De in de jaarrekening van het UWV en de SVB op te nemen egalisatiereserve, bedoeld in
      [artikel 52 van de Wet SUWI][ref1], heeft slechts betrekking op de uitvoeringskosten. De egalisatiereserve bedraagt
      ten hoogste 5 procent van het over de voorgaande 3 jaar toegekende budget voor de uitvoeringskosten, bedoeld in
      [artikel 48, eerste lid, van de Wet SUWI][ref2] en bedraagt niet minder dan nul. Dotatie en onttrekking aan en
      vrijval van de egalisatiereserve wordt afzonderlijk vermeld en toegelicht in de jaarrekening.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel48
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10a
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '52'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '48'
  - number: 5.10a.3
    text: |-
      De tussentijdse verslagen van het UWV en de SVB bevatten in elk geval een omschrijving van de onderwerpen die zijn
      genoemd in de bij deze regeling behorende bijlagen, [VI][ref1] en [VIII][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10a
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013280
  - number: 5.10a.4
    text: |-
      Het jaarverslag, de tussentijdse verslagen en de jaarrekening van het UWV bestaan uit twee afzonderlijke delen,
      waarvan één deel uitsluitend betrekking heeft op het in [artikel 5.21, tweede lid, van het Besluit SUWI][ref1]
      bedoelde organisatieonderdeel en het andere deel op het UWV met uitzondering van het bedoelde organisatieonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10a
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
  - number: 5.10a.5
    text: |-
      De delen van het jaarverslag en de tussentijdse verslagen die betrekking hebben op het in
      [artikel 5.21, tweede lid, van het Besluit SUWI][ref1] bedoelde organisatieonderdeel bevatten in elk geval een
      omschrijving van de onderwerpen die zijn genoemd in de bij deze regeling behorende [bijlage XX][ref2]. Het tweede
      lid is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10a
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0013280
  - number: 5.10a.6
    text: |-
      Het jaarverslag, de jaarrekening en de tussentijdse verslagen van het IB bevatten in ieder geval een omschrijving
      van de onderwerpen, die zijn opgenomen in [bijlage XI][ref1]. Het IB vormt een egalisatiereserve met
      overeenkomstige toepassing van [artikel 33 van de Kaderwet zelfstandige bestuursorganen][ref2], waarbij het tweede
      lid van overeenkomstige toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel33
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10a
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '33'
  - number: 5.10b.1
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.a
    text: 'getrouwheid: de overeenstemming van de in de verantwoording opgenomen informatie met de werkelijkheid;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.b
    text: |-
      financiële rechtmatigheid: de overeenstemming van de totstandkoming van de baten en lasten en de balans met de
      in Europese regelgeving, Nederlandse wetten, algemene maatregelen van bestuur, ministeriële regelingen, andere
      algemeen verbindende voorschriften en beleidsregels die in de Staatscourant zijn gepubliceerd, opgenomen bepalingen
      die de uitkomst van een financiële transactie kunnen beïnvloeden;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.c
    text: 'doelmatigheid: de relatie tussen de prestaties en de ingezette middelen;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.d
    text: 'financiële fout: een fout die financiële consequenties heeft;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.e
    text: |-
      onzekerheden: de baten en lasten waarover de accountant geen toereikende controle-informatie heeft verkregen als
      gevolg van leemten in de administratieve organisatie of interne controle of ontoereikend beleid ter voorkoming en
      bestrijding van misbruik en oneigenlijk gebruik;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.f
    text: 'auditrisico: het inherente risico, het interne beheersingsrisico en het ontdekkingsrisico tezamen;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.g
    text: |-
      goedkeuringstolerantie: het bedrag van de financiële fouten respectievelijk het bedrag van de onzekerheden blijkend
      uit de accountantscontrole van de jaarrekening, dat een goedkeurende verklaring bij de jaarrekening niet in de
      weg staat;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.h
    text: |-
      omvangsbasis: de totale baten, of totale lasten, of de som van baten en lasten voor de jaarrekening als geheel,
      respectievelijk per wet voor de bevindingen per wet;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.1.i
    text: |-
      bedrijfsvoeringsparagraaf: onderdeel van het jaarverslag waarin, mede gebaseerd op risicoanalyse, verantwoording
      wordt afgelegd over de bedrijfsvoering.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10b.2
    text: |-
      Deze paragraaf is van toepassing op de accountantscontrole bij de jaarrekening die wordt opgesteld door het UWV, de
      SVB, en het IB.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10b
  - number: 5.10c.1
    text: |-
      De accountant stelt ten behoeve van zijn onderzoek een controleplan en werkprogramma’s op waarin hij de opzet en de
      wijze van uitvoering van het onderzoek en de daarbij gehanteerde normen vastlegt.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.2
    text: |-
      De accountant sluit bij zijn onderzoek aan bij de regels die gelden voor de accountantscontrole voor de
      rijksoverheid tenzij in deze regeling afwijkingen zijn vastgelegd.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.3
    text: |-
      De accountant verricht de werkzaamheden met het oog op de afgifte van de verklaring zodanig dat daarbij een
      auditrisico van vijf procent per onderzochte omvangsbasis is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.4
    text: |-
      De accountant onderzoekt of de voorgeschreven informatie in de jaarrekening is opgenomen en of de informatie in het
      jaarverslag niet strijdig is met deze informatie.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.5
    text: |-
      De accountant onderzoekt de getrouwheid van de in het jaarverslag opgenomen jaarrekening alsmede van de in de
      bedrijfsvoeringsparagraaf opgenomen rapportage over de rechtmatigheid.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.6
    text: |-
      De accountant stelt de controlebevindingen vast van de uitvoering van de in de
      [artikelen 30, eerste lid, onderdeel a][ref1], [32d, eerste en tweede lid][ref2], en
      [34, eerste lid, onderdelen a en d, van de Wet SUWI][ref3] genoemde taken, voor zover het gaat om de
      uitvoering van wettelijke regelingen waarin uitkeringen of voorzieningen worden toegekend en waarvan de
      kosten ten laste komen van het Ministerie van Sociale Zaken en Werkgelegenheid, of de fondsen, bedoeld in
      [artikel 1, onderdelen f, g, j tot en met n en w, van de Wfsv][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel32d
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel1
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
    references:
      - id: ref1
