  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

            a

              *WWB:*


              [ Wet werk en bijstand][ref1];



            b

              *IOAW:*


              [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref2];



            c

              *Wfsv:*


              [ Wet financiering sociale verzekeringen][ref3];



            d






            e

              *WW:*


              [Werkloosheidswet][ref4];



            f

              *Wet SUWI:*


              [Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];



            g






            h






            i

              *UWV:*


              het Uitvoeringsinstituut werknemersverzekeringen, genoemd in [hoofdstuk 5 van de Wet SUWI][ref6];



            j

              *SVB:*


              de Sociale verzekeringsbank, genoemd in [hoofdstuk 6 van de Wet SUWI][ref7];



            k

              *IB:*


              Het Inlichtingenbureau, bedoeld in [artikel 1, onderdeel m, van de Wet SUWI][ref8]



            l






            m

              *re-integratiebedrijf:*


              natuurlijke persoon of rechtspersoon die in het kader van de uitoefening van beroep of bedrijf de
      inschakeling van personen in het arbeidsproces bevordert;



            n

              *arbodienst:*


              een arbodienst als bedoeld in de [Arbeidsomstandighedenwet][ref9];



            o

              *minister:*


              de Minister van Sociale Zaken en Werkgelegenheid;



            p






            q

              *arbeidsmarktinstrumenten:*


              het geheel van activiteiten dat in verband met de inschakeling in het arbeidsproces van een werkzoekende
      kan worden ingezet;



            r

              *melding:*


              de melding, bedoeld in [artikel 44, tweede lid, van de WWB][ref10],
      [artikel 16a, tweede lid, van de IOAW][ref11] of [artikel 16a, tweede lid, van de IOAZ][ref12];



            s

              *basisgegevens:*


              gegevens die in een al dan niet door de minister gedefinieerde vorm beschikbaar zijn bij het UWV en de SVB;



            t

              *TW:*


              [Toeslagenwet][ref13];



            u

              *VNG:*


              Vereniging van Nederlandse Gemeenten;



            v

              *IWI:*


              de Inspectie Werk en Inkomen, genoemd in [hoofdstuk 7 van de Wet SUWI][ref14];



            w

              *Invoeringswet SUWI:*


              [Invoeringswet Wet structuur uitvoeringsorganisatie werk en inkomen][ref15].


