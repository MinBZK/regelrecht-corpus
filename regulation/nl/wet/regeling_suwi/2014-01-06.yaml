        artikel: '1'
  - number: 5.10c.7
    text: |-
      De omvangsbasis wordt voor elk van de taken, bedoeld in het zesde lid, op overeenkomstige wijze als voor de
      omvangsbasis voor de jaarrekening als geheel bepaald. Bij het bepalen van de omvang van de controle op het niveau
      van een wet houdt de accountant rekening met de volgende toleranties in verhouding tot de gehanteerde omvangsbasis:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.7.a
    text: 'wet ≤ € 50 miljoen: tolerantie = 10%;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.7.b
    text: 'wet > € 50 miljoen en < € 500 miljoen: tolerantie = € 5 miljoen;'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.7.c
    text: 'wet ≥ € 500 miljoen: tolerantie = 1%.'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10c.8
    text: De accountant onderzoekt de doelmatigheid van het beheer en de organisatie.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10c
  - number: 5.10d.1
    text: |-
      Ten behoeve van zijn verklaring bepaalt de accountant de omvang van financiële fouten en onzekerheden die het
      getrouwe beeld van de jaarrekening en de daarbij behorende financiële toelichtingen dan wel het getrouwe beeld van
      de rechtmatigheidsinformatie in de bedrijfsvoeringsparagraaf aantasten.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
  - number: 5.10d.2
    text: |-
      Voor wat betreft de financiële fouten en onzekerheden die het getrouwe beeld van de jaarrekening en de daarbij
      behorende financiële toelichtingen aantasten, bepaalt de accountant de omvang als volgt:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
  - number: 5.10d.2.a
    text: financiële fouten en onzekerheden in de baten als percentage van de totale baten;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
  - number: 5.10d.2.b
    text: financiële fouten en onzekerheden in de lasten als percentage van de totale lasten, en
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
  - number: 5.10d.2.c
    text: financiële fouten en onzekerheden in de baten en lasten tezamen als percentage van de som van baten en lasten.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
  - number: 5.10d.3
    text: |-
      De accountant toetst de hoogste van de drie financiële foutpercentages en drie onzekerheidspercentages, bedoeld
      in het tweede lid, aan de in onderstaande tabel opgenomen toleranties en baseert daarop de strekking van zijn
      verklaring.









                    Goedkeuringstoleranties


                    Goedkeurende verklaring


                    Verklaring met beperking


                    Verklaring met oordeelonthouding


                    Afkeurende verklaring






                    Financiële fouten in de verantwoording


                    ≤ 1%


                    > 1% en ≤ 3%



                    > 3%




                    Onzekerheden in de controle


                    ≤ 3%


                    > 3% en ≤ 10%


                    > 10%
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
  - number: 5.10d.4
    text: |-
      Bij de bepaling van de strekking van de uiteindelijke controleverklaring weegt de accountant het getrouwe beeld
      van de jaarrekening en de rechtmatigheidsrapportage in de bedrijfsvoeringsparagraaf, waaronder de getrouwheid van
      de rapportage over het gevoerde beleid ter voorkoming en bestrijding van misbruik en oneigenlijk gebruik. Voor de
      getrouwheid van de rechtmatigheidsrapportage geldt geen kwantitatieve goedkeuringstolerantie.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
  - number: 5.10d.5
    text: |-
      De controleverklaring wordt opgesteld overeenkomstig de modellen die zijn opgenomen in [bijlage XXII][ref1]
      behorende bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10d
    references:
      - id: ref1
        bwb_id: BWBR0013280
  - number: 5.10e.1
    text: |-
      Het UWV, de SVB, en het IB dragen er zorg voor dat de minister door middel van het verslag van bevindingen inzicht
      wordt geboden in de belangrijkste uitkomsten van de controlewerkzaamheden van de accountant, in elk geval met
      betrekking tot:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
  - number: 5.10e.1.a
    text: fouten en onzekerheden voor de bepaling van de strekking van de controleverklaring;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
  - number: 5.10e.1.b
    text: |-
      overige fouten en onzekerheden die niet worden gehanteerd voor de bepaling van de strekking van de
      controleverklaring;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
  - number: 5.10e.1.c
    text: |-
      de doelmatigheid van het beheer en de organisatie, zoals omschreven in de bij deze regeling behorende
      [bijlage XXIII][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
    references:
      - id: ref1
        bwb_id: BWBR0013280
  - number: 5.10e.1.d
    text: het jaarverslag, voor wat betreft de prestatie-indicatoren en kengetallen;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
  - number: 5.10e.1.e
    text: het jaarverslag, voor wat betreft de bedrijfsvoeringsparagraaf.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
  - number: 5.10e.2
    text: |-
      De accountant hanteert bij zijn controlewerkzaamheden als toetsingskader voor de onderdelen, genoemd in het eerste
      lid: bij a. de getrouwheid; bij b. de getrouwheid; bij c. de ordelijke en controleerbare totstandkoming; bij d.
      de ordelijke, controleerbare en deugdelijke totstandkoming voor wat betreft de prestatie-indicatoren; bij e. de
      ordelijke en controleerbare totstandkoming van de bedrijfsvoeringsparagraaf en de getrouwheid voor wat betreft de
      rechtmatigheidsrapportage in de bedrijfsvoeringsparagraaf.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
  - number: 5.10e.3
    text: |-
      De accountant onderzoekt de rechtmatige uitvoering van de regelingen, bedoeld in
      [artikel 6, vierde lid, van de Wet SUWI][ref1], en vermeldt de uitkomsten van dit onderzoek in het verslag van
      bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel6
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.10e
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '6'
  - number: 5.11.1
    text: |-
      Het UWV en de SVB dragen zorg voor de elektronische beschikbaarheid van gegevens ten behoeve van de minister en de
      IWI, voor zover die gegevens noodzakelijk zijn voor het toezicht en de andere taken van de minister.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.11
  - number: 5.11.2
    text: |-
      Het UWV en de SVB dragen er zorg voor dat de gegevens, bedoeld in het eerste lid, voorzover zij zijn verwerkt voor
      de uitvoering van de aan het UWV en de SVB opgedragen taken, tenminste vijf jaar worden bewaard nadat de taak ten
      aanzien van de geregistreerde persoon is geëindigd.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.11
  - number: 5.11.3
    text: |-
      Na afloop van de termijn, bedoeld in het derde lid, bewaren het UWV en de SVB de gegevens slechts ten behoeve van
      historische of wetenschappelijke doeleinden.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.11
  - number: 5.12.1
    text: |-
      Uiterlijk op de in de [bijlagen VI][ref1] en [VIII][ref2] genoemde tijdstippen verstrekken het UWV en de SVB aan de
      minister een rapportage over de door hen beheerde fondsen op de wijze als in de [bijlagen VI][ref3] en [VIII][ref4]
      is aangegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013280
      [ref3]: https://wetten.overheid.nl/BWBR0013280
      [ref4]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013280
      - id: ref3
        bwb_id: BWBR0013280
      - id: ref4
        bwb_id: BWBR0013280
  - number: 5.12.2
    text: |-
      Het UWV en de SVB verstrekken ten behoeve van het jaarverslag van het Ministerie van Sociale Zaken en
      Werkgelegenheid de informatie, bedoeld in de bij deze regeling behorende [bijlagen VI][ref1], en [VIII][ref2] op
      het in deze bijlagen bepaalde tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013280
  - number: 5.14.1
    text: |-
      Op verzoek van de minister respectievelijk de IWI verstrekken het UWV en de SVB gegevens en informatie aan personen
      of instanties die in zijn opdracht of met zijn instemming onderzoek of analyses uitvoeren.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.14
  - number: 5.14.2
    text: |-
      Op verzoek van de minister respectievelijk de IWI verstrekken het UWV en de SVB gegevens en informatie aan personen
      of instanties die in zijn opdracht bewerker zijn van de gegevens uit deze regeling.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.14
  - number: 5.14.3
    text: |-
      Op verzoek van de minister verstrekken het UWV en de SVB informatie aan door hem aangewezen
      internationaalrechtelijke organisaties.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.14
  - number: 5.14.4
    text: |-
      Op verzoek van de minister verstrekt het UWV gegevens en informatie aan de minister van Binnenlands Zaken
      en Koninkrijksrelaties. Het UWV levert in ieder geval binnen zes weken na afloop van elk kwartaal de in
      [bijlage IX][ref1] genoemde rapportages en jaarlijks, binnen drie maanden na afloop van het jaar, de in
      [bijlage IX][ref2] genoemde bestanden.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013280
  - number: 5.14.5
    text: |-
      Het UWV en de SVB plegen overleg met de personen of instanties, bedoeld in het eerste, tweede, derde en vierde lid,
      over de inhoud, de vorm, de wijze en het tijdstip waarop de informatieverstrekking, bedoeld in het eerste, tweede,
      derde en vierde lid, plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.14
  - number: 5.14.6
    text: |-
      De minister en de IWI dragen er zorg voor, dat de personen en instanties, bedoeld in het eerste, tweede, derde en
      vierde lid, van het UWV en de SVB niet meer gegevens en informatie krijgen dan noodzakelijk is voor de uitvoering
      van het onderzoek dan wel voor de taak ten behoeve waarvan bedoelde personen of instanties de gegevens en
      informatie ontvangen en overleggen met het UWV en de SVB over de wijze waarop dit kan worden bereikt.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.14
  - number: 5.15.1
    text: |-
      Het UWV en de SVB brengen rapporten over onderzoek dat door of in opdracht van de uitvoeringsorganisatie is
      uitgevoerd, ter kennis van de minister. De rapporten over onderzoeken, waarvan de minister niet reeds op de hoogte
      was of kon zijn, worden uiterlijk twee weken voor openbaarmaking aan de minister verstrekt.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.15
  - number: 5.15.2
    text: |-
      Het UWV en de SVB maken rapporten met informatie als bedoeld in [artikel 5.12][ref1] en
      [artikel 5.14, eerste lid][ref2], niet eerder dan twee dagen na verstrekking aan de minister, openbaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013280#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.15
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0013280
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.15.3
    text: |-
      In geval van de openbaarmaking, bedoeld in dit artikel, wordt de minister uiterlijk 48 uur voor de verwachte
      publicatietermijn geïnformeerd over de wijze waarop dit zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.15
  - number: 5.15.4
    text: |-
      De minister kan op verzoek van het UWV en de SVB toestaan, dat van de termijnen, bedoeld in dit artikel wordt
      afgeweken.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.15
  - number: 5.16.1
    text: |-
      Het UWV en de SVB dragen zorg voor een deugdelijke administratie en organisatie, waaronder begrepen dusdanige
      procedures en voorzieningen dat er, mede gelet op de stand van de kennis op het terrein van de kwaliteitszorg,
      voldoende waarborgen aanwezig zijn voor:
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.16
  - number: 5.16.1.a
    text: |-
      het kunnen voldoen aan de informatieverplichtingen, bedoeld in [§ 5.2.1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0013280
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: 5.16.1.b
    text: tijdige verstrekking van gegevens en informatie;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.16
  - number: 5.16.1.c
    text: voldoende actualiteit;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.16
  - number: 5.16.1.d
    text: |-
      het voldoen aan het normenkader voor de betrouwbaarheid van de niet-financiële informatie zoals opgenomen in de bij
      deze regeling behorende [bijlage XVII][ref1] (‘Normenkader betrouwbaarheid niet-financiële informatie’);


      [ref1]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0013280
  - number: 5.16.1.e
    text: continuïteit van de verstrekking en opslag van gegevens en informatie.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.16
  - number: 5.16.2
    text: |-
      Het UWV en de SVB rapporteren in de bedrijfsvoeringsparagraaf in het jaarverslag over de kwaliteit van de
      informatievoorziening en over de wijze waarop deze is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.16
  - number: 5.17a.1
    text: |-
      Het UWV, de SVB en stellen de minister en de IWI zo spoedig mogelijk in kennis van hun voornemens tot het door
      één of meer andere rechtspersonen of natuurlijke personen laten verrichten van werkzaamheden op het terrein van
      facilitaire dienstverlening of personeelsbeleid, indien het zwaarwegend karakter ervan daartoe naar hun oordeel
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.17a
  - number: 5.17a.2
    text: 'Een kennisgeving als bedoeld in het eerste lid omvat in elk geval de volgende informatie:'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.17a
  - number: 5.17a.2.a
    text: |-
      een zodanige beschrijving van de door derden te verrichten werkzaamheden, dat daaruit blijkt in welke relatie deze
      tot de kerntaken staan;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.17a
  - number: 5.17a.2.b
    text: de contractduur;
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.17a
  - number: 5.17a.2.c
    text: de volumegegevens en (geraamde) financiële omvang van het contract; en
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.17a
  - number: 5.17a.2.d
    text: |-
      indien in verband met de werkzaamheden inzage in of overdracht van cliëntgegevens plaatsvindt: een beschrijving van
      aard en hoeveelheid daarvan.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.17a
  - number: '5.18'
    text: |-
      De minister wijzigt de bepalingen in deze paragraaf en de daarbij behorende bijlagen slechts na overleg met het UWV
      en de SVB.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.18
  - number: 5.21.1
    text: |-
      Het UWV en de SVB brengen hun besluiten van algemene strekking binnen twee weken na vaststelling schriftelijk ter
      kennis van de IWI.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.21
  - number: 5.21.2
    text: Het eerste lid is niet van toepassing ten aanzien van besluiten die goedkeuring van de Minister behoeven.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.21
  - number: 5.22.1
    text: |-
      Het UWV, de SVB en het IB rapporteren vóór 15 maart van elk jaar over de opzet en werking van het stelsel van
      maatregelen en procedures, gericht op het waarborgen van een exclusieve, integere, beschikbare en controleerbare
      gegevensverwerking.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.22
  - number: 5.22.2
    text: |-
      De rapportage wordt vergezeld van een oordeel van een tot de Nederlandse Orde van Register EDP-Auditors toegelaten
      persoon of van een verklaring van getrouwheid van een dergelijke persoon.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel5.22
  - number: 6.1.1
    text: |-
      In [bijlage II][ref1] bij deze regeling zijn de gegevens uit
      [Bijlage II, bedoeld in artikel 5.2a van het Besluit SUWI][ref2] opgenomen, waarop
      [artikel 5.2a, eerste lid][ref3], van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013267
      [ref3]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013267
      - id: ref3
        bwb_id: BWBR0013267
        artikel: '5'
  - number: 6.1.2
    text: |-
      In de [bijlage][ref1] wordt bij de gegevens aangegeven vanaf welk moment
      [artikel 5.2a, eerste lid, van het Besluit SUWI][ref2] voor de verwerking van die gegevens van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
  - number: 6.2.1
    text: |-
      In [bijlage XII][ref1] (Gegevensregister SUWI 9.0) bij deze regeling is het Gegevensregister SUWI opgenomen,
      bedoeld in [artikel 5.20 van het Besluit SUWI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
  - number: 6.2.2
    text: |-
      In [bijlage XVIII][ref1] (Gegevensregister IB 2.7) bij deze regeling zijn gegevens opgenomen als bedoeld in
      [artikel 5.24, tweede lid, van het Besluit SUWI][ref2], die door het IB worden verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
  - number: '6.3'
    text: |-
      In [bijlage I][ref1] (‘Stelselontwerp & Beveiliging Gezamenlijke elektronische voorzieningen SUWI’) bij
      deze regeling is het Stelselontwerp gezamenlijke elektronische voorzieningen SUWI opgenomen, bedoeld in
      [artikel 5.21, vierde lid, van het Besluit SUWI][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.3
    references:
      - id: ref1
        bwb_id: BWBR0013280
      - id: ref2
        bwb_id: BWBR0013267
        artikel: '5'
  - number: 6.4.1
    text: |-
      Het UWV, de SVB, de colleges van burgemeester en wethouders, het IB en op de gezamenlijke elektronische
      voorzieningen SUWI aangesloten niet SUWI-partijen dragen zorg voor de beveiliging van de gegevensuitwisselingen
      die plaatsvinden in het kader van de gezamenlijke elektronische voorzieningen SUWI, tegen inbreuk op de
      beschikbaarheid, integriteit en vertrouwelijkheid, overeenkomstig hetgeen over de voor het stelsel van maatregelen
      en procedures te hanteren normen wordt bepaald in [bijlage I][ref1] (‘Stelselontwerp & Beveiliging Gezamenlijke
      elektronische Voorzieningen SUWI’).


      [ref1]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0013280
  - number: 6.4.2
    text: |-
      Het UWV, de SVB, de colleges van burgemeester en wethouders, het IB en op de gezamenlijke elektronische
      voorzieningen SUWI aangesloten niet- SUWI- partijen geven ieder in een beveiligingsplan aan op welke wijze zij
      invulling geven aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.4
  - number: 6.4.3
    text: |-
      [Artikel 5.22][ref1] is van overeenkomstige toepassing op het gebruik en de inrichting van de gezamenlijke
      elektronische voorzieningen SUWI.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.4
    references:
      - id: ref1
        bwb_id: BWBR0013280
        artikel: '5'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '6.5'
    text: |-
      Bij het tot stand komen van de overeenkomst als bedoeld in [artikel 5.23, eerste lid, van het Besluit SUWI][ref1]
      wordt het in [bijlage III][ref2] bij deze regeling opgenomen protocol in acht genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0013280
  - number: 6.6.1
    text: |-
      De Stichting Inlichtingenbureau wordt aangewezen als de instelling, bedoeld in
      [artikel 1, onderdeel p, van de Wet SUWI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel1
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '1'
  - number: 6.6.2
    text: |-
      De Stichting Inlichtingenbureau informeert de Minister telkens schriftelijk over elke uitbreiding van andere taken
      dan de taak, bedoeld in [artikel 1, onderdeel m, van de Wet SUWI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel1
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel6.6
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '1'
  - number: 7.10.1
    text: |-
      Indien op 1 januari 2002 een dienstbetrekking bestaat met een werknemer, wiens eerste dag van ongeschiktheid
      tot het verrichten van arbeid wegens ziekte is gelegen voor die datum en ten aanzien van wie het Landelijk
      instituut sociale verzekeringen op die dag een taak heeft op grond van [artikel 8, eerste lid][ref1], en
      [artikel 10 van de Wet REA][ref2], zoals die artikelen luidden op de dag voorafgaand aan 1 januari 2002, heeft in
      afwijking van [artikel 8][ref3] en [10 van de Wet REA][ref4], het UWV de taak tot bevordering van de inschakeling
      in het arbeidsproces van die werknemer op grond [artikel 10 van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref5]: https://wetten.overheid.nl/BWBR0009565#Artikel10
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref5
        bwb_id: BWBR0009565
        artikel: '10'
  - number: 7.10.2
    text: |-
      Indien de eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte van een werknemer is
      gelegen voor 1 januari 2003, is [artikel 8, eerste lid, van de Wet REA][ref1], indien vaststaat dat in het
      bedrijf van de werkgever geen passende arbeid voorhanden is, voor de werkgever niet van toepassing en is
      [artikel 10 van de Wet REA][ref2] van toepassing, tenzij de werkgever het UWV schriftelijk meldt, dat hij de taak
      op grond van [artikel 8 van de Wet REA][ref3] zal verrichten ten aanzien van zo'n werknemer.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel8
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '8'
  - number: 7.10.3
    text: |-
      Bij toepassing van het tweede lid, vervult het UWV zijn taak, bedoeld in [artikel 10 van de Wet REA][ref1]
      slechts nadat de werkgever aan het UWV een reïntegratieverslag heeft verstrekt dat is opgesteld op grond
      van [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref2], dan wel met toepassing van
      [artikel 8, achtste lid, van de Wet REA][ref3] of een reïntegratieplan aan het UWV heeft verstrekt dat is opgesteld
      op grond van [artikel 71a van de WAO][ref4], zoals dat artikel luidde voor 1 april 2002.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
      [ref3]: https://wetten.overheid.nl/BWBR0009565#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel71a
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002524
        artikel: 71a
      - id: ref3
        bwb_id: BWBR0009565
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: 71a
  - number: 7.10.4
    text: |-
      Indien op grond van dit artikel het UWV een taak heeft op grond van [artikel 10 van de Wet REA][ref1] zijn
      in geval van het eerste lid, [artikel XV, eerste en zesde lid, van de Wet verbetering poortwachter][ref2]
      van overeenkomstige toepassing. In geval van het tweede lid is de eerste zin van
      [artikel 34a, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0013063#ArtikelXV
      [ref3]: https://wetten.overheid.nl/BWBR0002524#Artikel34a
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0013063
        artikel: XV
      - id: ref3
        bwb_id: BWBR0002524
        artikel: 34a
  - number: 7.10.5
    text: |-
      Bij de toepassing van dit artikel is [artikel 43 van de Wet REA][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009565#Artikel43
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0009565
        artikel: '43'
  - number: 7.10.6
    text: |-
      [Artikel 4.11 van het Besluit SUWI][ref1] is niet van toepassing zolang [artikel 8 van de Wet REA][ref2] op grond
      van dit artikel niet van toepassing is op de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009565#Artikel8
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0009565
        artikel: '8'
  - number: '8.2'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst en werkt terug tot en met 1 januari 2002.
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel8.2
  - number: '8.3'
    text: 'Deze regeling wordt aangehaald als: Regeling SUWI.'
    url: https://wetten.overheid.nl/BWBR0013280/2014-01-06#Artikel8.3
