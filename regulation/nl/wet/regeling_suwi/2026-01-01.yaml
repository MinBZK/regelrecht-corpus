        bwb_id: BWBR0013060
        artikel: '30'
  - number: '3.6'
    text: |-
      1 Tussen de in de verzekerdenadministratie opgenomen gegevens moeten ten minste zodanige verbanden kunnen worden
      gelegd, dat vastgesteld kan worden:

      a. per verzekerde: welke verzekerings-, arbeids- en uitkeringsverhoudingen van hem zijn geregistreerd en op welke
      periode deze betrekking hebben;

      b. per arbeidsverhouding: op welke verzekerde en op welke werkgever die arbeidsverhouding betrekking heeft;

      c. per verzekeringsverhouding:

      1º. op welke verzekerde de verzekeringsverhouding betrekking heeft;

      2º. op welke wet de verzekeringsverhouding berust;

      d. per uitkeringsverhouding:

      1º. op welke uitkeringsgerechtigde de uitkeringsverhouding betrekking heeft;

      2º. op welke wet de uitkeringsverhouding berust.

      2 Het leggen van een verband met een wet gebeurt door aanduiding van de desbetreffende wet met de code SZ-wet.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.6
  - number: '3.7'
    text: |-
      1 Het UWV houdt de gegevens bedoeld in [artikel 3.5, onderdelen a tot en met e][ref1], gedurende ten minste vijf
      kalenderjaren na het jaar waarin deze gegevens zijn opgenomen, beschikbaar ten behoeve van raadplegingen.

      2 Vanaf het moment dat een verzekerde de leeftijd van 65 jaar bereikt of voor het bereiken van die leeftijd
      overlijdt, worden de hem betreffende, in de verzekerdenadministratie opgenomen gegevens, gedurende vijf jaren te
      rekenen vanaf dat moment door het UWV bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.7
