  - number: 5.10a
    text: |-
      1 De jaarverslagen van het UWV en de SVB bevatten in elk geval een omschrijving van de onderwerpen die zijn genoemd
      in de bij deze regeling behorende bijlagen, [VI][ref1] en [VIII][ref2].

      2 De in de jaarrekening van het UWV en de SVB op te nemen egalisatiereserve, bedoeld in
      [artikel 52 van de Wet SUWI][ref3], heeft slechts betrekking op de uitvoeringskosten. De egalisatiereserve bedraagt
      ten hoogste 5 procent van het over de voorgaande 3 jaar toegekende budget voor de uitvoeringskosten, bedoeld in
      [artikel 48, eerste lid, van de Wet SUWI][ref4] en bedraagt niet minder dan nul. Dotatie en onttrekking aan en
      vrijval van de egalisatiereserve wordt afzonderlijk vermeld en toegelicht in de jaarrekening.

      3 De tussentijdse verslagen van het UWV en de SVB bevatten in elk geval een omschrijving van de onderwerpen die
      zijn genoemd in de bij deze regeling behorende bijlagen, [VI][ref5] en [VIII][ref6].

      4 Het jaarverslag, de tussentijdse verslagen en de jaarrekening van het UWV bestaan uit twee afzonderlijke delen,
      waarvan één deel uitsluitend betrekking heeft op het in [artikel 5.21, tweede lid, van het Besluit SUWI][ref7]
      bedoelde organisatieonderdeel en het andere deel op het UWV met uitzondering van het bedoelde organisatieonderdeel.

      5 De delen van het jaarverslag en de tussentijdse verslagen die betrekking hebben op het in
      [artikel 5.21, tweede lid, van het Besluit SUWI][ref8] bedoelde organisatieonderdeel bevatten in elk geval een
      omschrijving van de onderwerpen die zijn genoemd in de bij deze regeling behorende [bijlage XX][ref9]. Het tweede
      lid is van overeenkomstige toepassing.

      6 Het jaarverslag, de jaarrekening en de tussentijdse verslagen van het BIDN bevatten in ieder geval een
      omschrijving van de onderwerpen, die zijn opgenomen in [bijlage XI][ref10]. Het BIDN vormt een egalisatiereserve
      met overeenkomstige toepassing van [artikel 33 van de Kaderwet zelfstandige bestuursorganen][ref11], waarbij het
      tweede lid van overeenkomstige toepassing is.

      7 De jaarverslagen van het UWV bevatten voor de jaren 2021 tot en met 2025 een kassiersverslag als bedoeld
      in [artikel 5.10f][ref12]. De bij deze regeling behorende [bijlage VI][ref13] is niet van toepassing op het
      kassiersverslag.


