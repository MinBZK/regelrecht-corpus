  - number: 5.10d
    text: |-
      1 Ten behoeve van zijn verklaring bepaalt de accountant de omvang van financiële fouten en onzekerheden die het
      getrouwe beeld van de jaarrekening en de daarbij behorende financiële toelichtingen dan wel het getrouwe beeld van
      de rechtmatigheidsinformatie in de bedrijfsvoeringsparagraaf aantasten.

      2 Voor wat betreft de financiële fouten en onzekerheden die het getrouwe beeld van de jaarrekening en de daarbij
      behorende financiële toelichtingen aantasten, bepaalt de accountant de omvang als volgt:

      a. financiële fouten en onzekerheden in de baten als percentage van de totale baten;

      b. financiële fouten en onzekerheden in de lasten als percentage van de totale lasten, en

      c. financiële fouten en onzekerheden in de baten en lasten tezamen als percentage van de som van baten en lasten.

      3 De accountant toetst de hoogste van de drie financiële foutpercentages en drie onzekerheidspercentages, bedoeld
      in het tweede lid, aan de in onderstaande tabel opgenomen toleranties en baseert daarop de strekking van zijn
      verklaring.











                    Goedkeuringstoleranties


                    Goedkeurende verklaring


                    Verklaring met beperking


                    Verklaring met oordeelonthouding


                    Afkeurende verklaring






                    Financiële fouten in de verantwoording


                    ≤ 1%


                    > 1% en ≤ 3%



                    > 3%




                    Onzekerheden in de controle


                    ≤ 3%


                    > 3% en ≤ 10%


                    > 10%







      4 Bij de bepaling van de strekking van de uiteindelijke controleverklaring weegt de accountant het getrouwe beeld
      van de jaarrekening en de rechtmatigheidsrapportage in de bedrijfsvoeringsparagraaf, waaronder de getrouwheid van
      de rapportage over het gevoerde beleid ter voorkoming en bestrijding van misbruik en oneigenlijk gebruik. Voor de
      getrouwheid van de rechtmatigheidsrapportage geldt geen kwantitatieve goedkeuringstolerantie.

      5 De controleverklaring wordt opgesteld overeenkomstig de modellen die zijn opgenomen in [bijlage XXII][ref1]
      behorende bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.10d
