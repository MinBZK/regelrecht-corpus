  - number: '7.10'
    text: |-
      1 Indien op 1 januari 2002 een dienstbetrekking bestaat met een werknemer, wiens eerste dag van ongeschiktheid
      tot het verrichten van arbeid wegens ziekte is gelegen voor die datum en ten aanzien van wie het Landelijk
      instituut sociale verzekeringen op die dag een taak heeft op grond van [artikel 8, eerste lid][ref1], en
      [artikel 10 van de Wet REA][ref2], zoals die artikelen luidden op de dag voorafgaand aan 1 januari 2002, heeft in
      afwijking van [artikel 8][ref3] en [10 van de Wet REA][ref4], het UWV de taak tot bevordering van de inschakeling
      in het arbeidsproces van die werknemer op grond [artikel 10 van die wet][ref5].

      2 Indien de eerste dag van ongeschiktheid tot het verrichten van arbeid wegens ziekte van een werknemer is
      gelegen voor 1 januari 2003, is [artikel 8, eerste lid, van de Wet REA][ref6], indien vaststaat dat in het
      bedrijf van de werkgever geen passende arbeid voorhanden is, voor de werkgever niet van toepassing en is
      [artikel 10 van de Wet REA][ref7] van toepassing, tenzij de werkgever het UWV schriftelijk meldt, dat hij de taak
      op grond van [artikel 8 van de Wet REA][ref8] zal verrichten ten aanzien van zo'n werknemer.

      3 Bij toepassing van het tweede lid, vervult het UWV zijn taak, bedoeld in [artikel 10 van de Wet REA][ref9]
      slechts nadat de werkgever aan het UWV een reïntegratieverslag heeft verstrekt dat is opgesteld op grond
      van [artikel 71a van de Wet op de arbeidsongeschiktheidsverzekering][ref10], dan wel met toepassing van
      [artikel 8, achtste lid, van de Wet REA][ref11] of een reïntegratieplan aan het UWV heeft verstrekt dat is
      opgesteld op grond van [artikel 71a van de WAO][ref12], zoals dat artikel luidde voor 1 april 2002.

      4 Indien op grond van dit artikel het UWV een taak heeft op grond van [artikel 10 van de Wet REA][ref13] zijn
      in geval van het eerste lid, [artikel XV, eerste en zesde lid, van de Wet verbetering poortwachter][ref14]
      van overeenkomstige toepassing. In geval van het tweede lid is de eerste zin van
      [artikel 34a, eerste lid, van de Wet op de arbeidsongeschiktheidsverzekering][ref15] niet van toepassing.

      5 Bij de toepassing van dit artikel is [artikel 43 van de Wet REA][ref16] van toepassing.

      6 [Artikel 4.11 van het Besluit SUWI][ref17] is niet van toepassing zolang [artikel 8 van de Wet REA][ref18] op
      grond van dit artikel niet van toepassing is op de werkgever.


