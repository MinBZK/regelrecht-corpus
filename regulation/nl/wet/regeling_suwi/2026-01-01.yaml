  - number: '2.1'
    text: |-
      1 De minister stelt jaarlijks voor 1 december de omvang van de middelen van de landelijke cliëntenraad als bedoeld
      in [artikel 8, vierde lid, van de Wet SUWI][ref1], vast aan de hand van een jaarplan met begroting.

      2 Deze middelen zijn bestemd voor:

      a. de kosten van het secretariaat en ondersteuning van de landelijke cliëntenraad;

      b. de kosten ten behoeve van leden van de landelijke cliëntenraad en in verband met de taakuitoefening door de
      raad;

      c. kosten in verband met in het jaarplan opgenomen onderzoeken naar cliëntenparticipatie in het domein van werk en
      inkomen en activiteiten ter bevordering van deze cliëntenparticipatie.

      3 De minister kan toestaan, dat de middelen worden aangewend voor meer activiteiten dan in het jaarplan met
      begroting zijn opgenomen.

      4 De minister kan besluiten de omvang van de middelen te wijzigen.

      5 Ten behoeve van de landelijke cliëntenraad worden geen verplichtingen aangegaan en geen uitgaven gedaan die
      leiden tot overschrijding van de vastgestelde middelen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel8
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '8'
  - number: '2.2'
    text: |-
      1 Elk jaar wordt ten behoeve van het beschikbaar stellen van de middelen voor de landelijke cliëntenraad voor 1
      juli van het jaar voorafgaande aan het begrotingsjaar een beknopt concept jaarplan met een globale begroting en
      voor 1 oktober van dat jaar een jaarplan met begroting en een voorstel voor de hoogte van de twee voorschotten,
      ingediend.

      2 De middelen worden in twee delen bij wijze van voorschot betaald: de eerste termijn op of omstreeks 10 januari
      van het jaar waarop de middelen betrekking hebben, en op of omstreeks 1 juli het restant.

      3 Uiterlijk 15 maart van het jaar volgend op het jaar waarop het jaarverslag betrekking heeft, wordt aan de
      minister een jaarverslag van de landelijke cliëntenraad voorzien van jaarrekening met controleverklaring gezonden.

      4 De controleverklaring wordt verzorgd door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1].

      5 De minister stelt de definitieve middelen voor het jaar waarover verantwoording is afgelegd vast.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
