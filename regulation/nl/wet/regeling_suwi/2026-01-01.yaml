  - number: '3.13'
    text: |-
      Het UWV verstrekt periodiek de in [bijlage IV][ref1] vermelde gegevens uit de registratie arbeidsbeperkten, bedoeld
      in artikel [38d van de Wfsv][ref2], en uit de polisadministratie, bedoeld in [artikel 33 van de Wet SUWI][ref3],
