  - number: 5.10e
    text: |-
      1 Het UWV, de SVB, en het BIDN dragen er zorg voor dat de minister door middel van het verslag van bevindingen
      inzicht wordt geboden in de belangrijkste uitkomsten van de controlewerkzaamheden van de accountant, in elk geval
      met betrekking tot:

      a. fouten en onzekerheden voor de bepaling van de strekking van de controleverklaring;

      b. overige fouten en onzekerheden die niet worden gehanteerd voor de bepaling van de strekking van de
      controleverklaring;

      c. de doelmatigheid van het beheer en de organisatie, zoals omschreven in de bij deze regeling behorende
      [bijlage XXIII][ref1];

      d. het jaarverslag, voor wat betreft de prestatie-indicatoren en kengetallen;

      e. het jaarverslag, voor wat betreft de bedrijfsvoeringsparagraaf.

      2 De accountant hanteert bij zijn controlewerkzaamheden als toetsingskader voor de onderdelen, genoemd in het
      eerste lid:

      bij a. de getrouwheid;

      bij b. de getrouwheid;

      bij c. de ordelijke en controleerbare totstandkoming;

      bij d. de ordelijke, controleerbare en deugdelijke totstandkoming voor wat betreft de prestatie-indicatoren;

      bij e. de ordelijke en controleerbare totstandkoming van de bedrijfsvoeringsparagraaf en de getrouwheid voor wat
      betreft de rechtmatigheidsrapportage in de bedrijfsvoeringsparagraaf.

      3 De accountant onderzoekt de rechtmatige uitvoering van de regelingen, bedoeld in
      [artikel 6, vierde lid, van de Wet SUWI][ref2], en vermeldt de uitkomsten van dit onderzoek in het verslag van
      bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel6
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.10e
