  - number: '3.14'
    text: |-
      Het UWV heeft tot taak om personen die mogelijk kwalificeren als jonggehandicapte, op grond van
      [artikel 1a:1, derde lid, van de Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref1], te faciliteren in
      het doen van een aanvraag, en is bevoegd personen uit deze doelgroep gericht te benaderen.


      [ref1]: https://wetten.overheid.nl/BWBR0008657#Artikel1a1
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.14
