  - number: 5.10b
    text: |-
      1 Voor de toepassing van deze paragraaf wordt verstaan onder:

      a. getrouwheid: de overeenstemming van de in de verantwoording opgenomen informatie met de werkelijkheid;

      b. financiële rechtmatigheid: de overeenstemming van de totstandkoming van de baten en lasten en de balans met
      de in Europese regelgeving, Nederlandse wetten, algemene maatregelen van bestuur, ministeriële regelingen, andere
      algemeen verbindende voorschriften en beleidsregels die in de Staatscourant zijn gepubliceerd, opgenomen bepalingen
      die de uitkomst van een financiële transactie kunnen beïnvloeden;

      c. doelmatigheid: de relatie tussen de prestaties en de ingezette middelen;

      d. financiële fout: een fout die financiële consequenties heeft;

      e. onzekerheden: de baten en lasten waarover de accountant geen toereikende controle-informatie heeft verkregen als
      gevolg van leemten in de administratieve organisatie of interne controle of ontoereikend beleid ter voorkoming en
      bestrijding van misbruik en oneigenlijk gebruik;

      f. auditrisico: het inherente risico, het interne beheersingsrisico en het ontdekkingsrisico tezamen;

      g. goedkeuringstolerantie: het bedrag van de financiële fouten respectievelijk het bedrag van de onzekerheden
      blijkend uit de accountantscontrole van de jaarrekening, dat een goedkeurende verklaring bij de jaarrekening niet
      in de weg staat;

      h. omvangsbasis: de totale baten, of totale lasten, of de som van baten en lasten voor de jaarrekening als geheel,
      respectievelijk per wet voor de bevindingen per wet;

      i. bedrijfsvoeringsparagraaf: onderdeel van het jaarverslag waarin, mede gebaseerd op risicoanalyse, verantwoording
      wordt afgelegd over de bedrijfsvoering.

      2 Deze paragraaf is van toepassing op de accountantscontrole bij de jaarrekening die wordt opgesteld door het UWV,
      de SVB, en het BIDN.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.10b
  - number: 5.10c
    text: |-
      1 De accountant stelt ten behoeve van zijn onderzoek een controleplan en werkprogramma’s op waarin hij de opzet en
      de wijze van uitvoering van het onderzoek en de daarbij gehanteerde normen vastlegt.

      2 De accountant sluit bij zijn onderzoek aan bij de regels die gelden voor de accountantscontrole voor de
      rijksoverheid tenzij in deze regeling afwijkingen zijn vastgelegd.

      3 De accountant verricht de werkzaamheden met het oog op de afgifte van de verklaring zodanig dat daarbij een
      auditrisico van vijf procent per onderzochte omvangsbasis is gewaarborgd.

      4 De accountant onderzoekt of de voorgeschreven informatie in de jaarrekening is opgenomen en of de informatie in
      het jaarverslag niet strijdig is met deze informatie.

      5 De accountant onderzoekt de getrouwheid van de in het jaarverslag opgenomen jaarrekening alsmede van de in de
      bedrijfsvoeringsparagraaf opgenomen rapportage over de rechtmatigheid.

      6 De accountant stelt de controlebevindingen vast van de uitvoering van de in de
      [artikelen 30, eerste lid, onderdeel a][ref1], [32d, eerste en tweede lid][ref2], en
      [34, eerste lid, onderdelen a en d, van de Wet SUWI][ref3] genoemde taken, voor zover het gaat om de
      uitvoering van wettelijke regelingen waarin uitkeringen of voorzieningen worden toegekend en waarvan de
      kosten ten laste komen van het Ministerie van Sociale Zaken en Werkgelegenheid, of de fondsen, bedoeld in
      [artikel 1, onderdelen f, g, j tot en met n en w, van de Wfsv][ref4].

      7 De omvangsbasis wordt voor elk van de taken, bedoeld in het zesde lid, op overeenkomstige wijze als voor de
      omvangsbasis voor de jaarrekening als geheel bepaald. Bij het bepalen van de omvang van de controle op het niveau
      van een wet houdt de accountant rekening met de volgende toleranties in verhouding tot de gehanteerde omvangsbasis:

      a. wet ≤ € 50 miljoen: tolerantie = 10%;

      b. wet > € 50 miljoen en < € 500 miljoen: tolerantie = € 5 miljoen;

      c. wet ≥ € 500 miljoen: tolerantie = 1%.

      8 De accountant onderzoekt de doelmatigheid van het beheer en de organisatie.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel32d
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel34
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel1
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.10c
