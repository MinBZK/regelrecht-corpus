  - number: '5.11'
    text: |-
      1 Het UWV en de SVB dragen zorg voor de elektronische beschikbaarheid van gegevens ten behoeve van de minister en
      de Nederlandse Arbeidsinspectie, voor zover die gegevens noodzakelijk zijn voor het toezicht en de andere taken van
      de minister.

      2 Het UWV en de SVB dragen er zorg voor dat de gegevens, bedoeld in het eerste lid, voorzover zij zijn verwerkt
      voor de uitvoering van de aan het UWV en de SVB opgedragen taken, tenminste vijf jaar worden bewaard nadat de taak
      ten aanzien van de geregistreerde persoon is geëindigd.

      3 Na afloop van de termijn, bedoeld in het derde lid, bewaren het UWV en de SVB de gegevens slechts ten behoeve van
      historische of wetenschappelijke doeleinden.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.11
  - number: '5.12'
    text: |-
      1 Uiterlijk op de in de [bijlagen VI][ref1] en [VIII][ref2] genoemde tijdstippen verstrekken het UWV en de SVB
      aan de minister een rapportage over de door hen beheerde fondsen op de wijze als in de [bijlagen VI][ref3] en
      [VIII][ref4] is aangegeven.

      2 Het UWV en de SVB verstrekken ten behoeve van het jaarverslag van het Ministerie van Sociale Zaken en
      Werkgelegenheid de informatie, bedoeld in de bij deze regeling behorende [bijlagen VI][ref5], en [VIII][ref6] op
      het in deze bijlagen bepaalde tijdstip.


