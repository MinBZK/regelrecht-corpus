  - number: '1.6'
    text: |-
      Het UWV en de SVB brengen voor het verrichten van andere werkzaamheden, bedoeld in
      [artikel 5, eerste lid, van de Wet SUWI][ref1], zodanige prijzen in rekening aan de opdrachtgever dat valt aan te
      nemen dat, gerekend over het desbetreffende jaar, alle directe en indirecte aan die andere taken toe te rekenen
      lasten door de te verwachten baten zijn gedekt.


