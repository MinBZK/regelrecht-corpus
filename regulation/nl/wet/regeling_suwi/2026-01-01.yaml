        bwb_id: BWBR0013280
        artikel: '3.5'
        hoofdstuk: '3'
        paragraaf: '3.2'
  - number: '3.8'
    text: |-
      1 Het UWV baseert de vulling en het onderhoud van de verzekerdenadministratie op ontvangst, verificatie en
      verwerking van onder meer de volgende berichten en gegevensstromen:

      a. de melding sociale verzekering;

      b. een mededeling als bedoeld in [artikel 59 van de Wet SUWI][ref1], zoals die
      bepaling luidde op de dag voorafgaande aan de datum van inwerkingtreding van
      [artikel 5 van de Invoeringswet Wet financiering sociale verzekeringen][ref2];

      c. een schriftelijk verzoek, afkomstig van de verzekerde, tot verbetering, aanvulling of verwijdering van hem
      betreffende gegevens;

      d. gegevensverstrekking door de verzekerde naar aanleiding van een aanvraag voor een uitkering;

      e. de jaaropgave;

      f. verificatieberichten;

      g. informatie uit hoofde van een door het UWV verrichte looncontrole of fraude-onderzoek.

      2 In afwijking van het bepaalde in het eerste lid vindt de vastlegging van een arbeidsverhouding en
      verzekeringsverhouding door middel van de berichten bedoeld in de onderdelen b tot en met d en f van het eerste lid
      plaats zodra het bestaan van de arbeidsverhouding en verzekeringsverhouding wordt aangetoond.

      3 De in het eerste lid, onderdelen a tot en met c, bedoelde berichten en gegevensstromen worden bewaard voor een
      periode van ten minste 5 jaren na afloop van het kalenderjaar waarin de gegevens in de verzekerdenadministratie
      zijn verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0017747#Artikel5
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.8
