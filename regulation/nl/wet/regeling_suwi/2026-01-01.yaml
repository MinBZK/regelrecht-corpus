  - number: '5.14'
    text: |-
      1 Op verzoek van de minister respectievelijk de Nederlandse Arbeidsinspectie verstrekken het UWV en de SVB
      gegevens en informatie aan personen of instanties die in zijn opdracht of met zijn instemming onderzoek of analyses
      uitvoeren.

      2 Op verzoek van de minister respectievelijk de Nederlandse Arbeidsinspectie verstrekken het UWV en de SVB gegevens
      en informatie aan personen of instanties die in zijn opdracht bewerker zijn van de gegevens uit deze regeling.

      3 Op verzoek van de minister verstrekken het UWV en de SVB informatie aan door hem aangewezen
      internationaalrechtelijke organisaties.

      4 Op verzoek van de minister verstrekt het UWV gegevens en informatie aan de Minister van Binnenlandse Zaken
      en Koninkrijksrelaties voor zover deze gegevens noodzakelijk zijn voor statistische doeleinden ten behoeve
      van de coördinatie van het overheidspersoneelsbeleid of aan de Minister van Onderwijs, Cultuur en Wetenschap
      voor zover deze gegevens noodzakelijk zijn voor statistische doeleinden ten behoeve van de coördinatie van
      het onderwijspersoneelsbeleid. Het UWV levert periodiek volgens [bijlage IX][ref1], de in bijlage IX genoemde
      bestanden.

      5 Het UWV en de SVB plegen overleg met de personen of instanties, bedoeld in het eerste, tweede, derde en vierde
      lid, over de inhoud, de vorm, de wijze en het tijdstip waarop de informatieverstrekking, bedoeld in het eerste,
      tweede, derde en vierde lid, plaatsvindt.

      6 De minister en de Nederlandse Arbeidsinspectie dragen er zorg voor, dat de personen en instanties, bedoeld
      in het eerste, tweede, derde en vierde lid, van het UWV en de SVB niet meer gegevens en informatie krijgen dan
      noodzakelijk is voor de uitvoering van het onderzoek dan wel voor de taak ten behoeve waarvan bedoelde personen
      of instanties de gegevens en informatie ontvangen en overleggen met het UWV en de SVB over de wijze waarop dit kan
      worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.14
    references:
      - id: ref1
        bwb_id: BWBR0013280
  - number: '5.15'
    text: |-
      1 Het UWV en de SVB brengen rapporten over onderzoek dat door of in opdracht van de uitvoeringsorganisatie is
      uitgevoerd, ter kennis van de minister. De rapporten over onderzoeken, waarvan de minister niet reeds op de hoogte
      was of kon zijn, worden uiterlijk twee weken voor openbaarmaking aan de minister verstrekt.

      2 Het UWV en de SVB maken rapporten met informatie als bedoeld in [artikel 5.12][ref1] en
      [artikel 5.14, eerste lid][ref2], niet eerder dan twee dagen na verstrekking aan de minister, openbaar.

      3 In geval van de openbaarmaking, bedoeld in dit artikel, wordt de minister uiterlijk 48 uur voor de verwachte
      publicatietermijn geïnformeerd over de wijze waarop dit zal plaatsvinden.

      4 De minister kan op verzoek van het UWV en de SVB toestaan, dat van de termijnen, bedoeld in dit artikel wordt
      afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel5.12
      [ref2]: https://wetten.overheid.nl/BWBR0013280#Artikel5.14
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.15
    references:
