  - number: '3.3'
    text: |-
      1 Op verzoek van een college van burgemeester en wethouders verstrekt het UWV aan de hand van het
      meegeleverde burgerservicenummer en aanvullende identificerende gegevens adresgegevens als bedoeld in
      [artikel 5.9, eerste lid, onderdeel i, van het Besluit SUWI][ref1], die het UWV verwerkt in de polisadministratie,
      bedoeld in [artikel 33 van de Wet SUWI][ref2].

      2 De adresgegevens, bedoeld in het eerste lid, die door het UWV worden verstrekt betreffen de in
      [Bijlage I bij het Besluit SUWI][ref3] onder Straatadres Nederland tot en met Straatadres buitenland genoemde
      gegevens.

      3 Het UWV verstrekt de gegevens, bedoeld in het tweede lid, op de door het college van burgemeester en wethouders
      bij het verzoek aangegeven wijze of verwerkt die gegevens in het kader van de gezamenlijke elektronische
      voorzieningen SUWI.

      4 Het UWV en de colleges van burgemeester en wethouders verwerken de adresgegevens, bedoeld in eerste en tweede
      lid, in het kader van de gezamenlijke elektronische voorzieningen SUWI op de wijze, bedoeld in [artikel 6.2][ref4],
      [6.3][ref5] en [6.4][ref6].

      5 Het UWV bepaalt bij de uitvoering van taken als bedoeld in
      [artikel 5.21, eerste en tweede lid, van het Besluit SUWI][ref7], op welke wijze bij de toepassing van het vierde
      lid, inhoud wordt gegeven aan de gegevensverwerking op grond van dit artikel.

      6 Het UWV verstrekt de gegevens, bedoeld in het tweede lid, zonder gebruikmaking van de gezamenlijke elektronische
      voorzieningen, maximaal vier maal in een kalenderjaar aan het zelfde college van burgemeester en wethouders.

      7 Onverminderd het vierde lid beëindigt het UWV de gegevensverwerking op grond van dit artikel, indien
      het college van burgemeester en wethouders de gegevens voor een ander doel dan het doel, genoemd in
      [artikel 5.9, eerste lid, onderdeel i, van het Besluit SUWI][ref8] gebruikt.


