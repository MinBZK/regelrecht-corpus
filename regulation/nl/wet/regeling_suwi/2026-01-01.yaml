  - number: '5.22'
    text: |-
      1 Het UWV, de SVB en het BIDN rapporteren vóór 15 maart van elk jaar over de opzet en werking van het stelsel van
      maatregelen en procedures, gericht op het waarborgen van een exclusieve, integere, beschikbare en controleerbare
      gegevensverwerking.

      2 De rapportage wordt vergezeld van een oordeel van een tot de Nederlandse Orde van Register EDP-Auditors
      toegelaten persoon of van een verklaring van getrouwheid van een dergelijke persoon.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.22
