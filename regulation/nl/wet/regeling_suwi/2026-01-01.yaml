  - number: '3.11'
    text: |-
      1 Het UWV houdt in het belang van de gegevensuitwisseling die noodzakelijk is voor de uitvoering van de in
      [artikel 30 Wet SUWI][ref1] genoemde wetten een gemeenschappelijke verwijsindex op de verzekerdenadministratie
      in stand.

      2 Van de verzekerde, met wie het UWV een verzekeringsverhouding of een uitkeringsverhouding heeft, worden in de
      gemeenschappelijk verwijsindex, zodanig dat zij direct te raadplegen zijn, ten minste de volgende verwijsgegevens
      opgenomen:

      a. het burgerservicenummer;

      b. de aard van de verhouding, waarbij de aard van de uitkeringsverhouding wordt aangeduid met de code SZ-wet;

      c. gegevens over het UWV-onderdeel en de locatie waar de verhouding is geadministreerd;

      d. de begindatum van de verhouding;

      e. de einddatum van de verhouding;

      f. het dossiernummer, behorend bij de verhouding.

      3 Wanneer een verzekerde geen verzekeringsverhouding of uitkeringsverhouding meer heeft met het UWV, blijven de
      verwijsgegevens ten minste vijf jaar na het einde van de laatste verzekeringsverhouding of uitkeringsverhouding in
      de gemeenschappelijke verwijsindex bewaard.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.11
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '30'
  - number: '3.12'
    text: |-
      1 Het UWV verwerkt wekelijks gegevens met betrekking tot arbeidskrachten afkomstig van werkgevers die zich in het
      kader van de uitoefening van hun bedrijf of beroep bezighouden met het ter beschikking stellen van arbeidskrachten.

      2 De gegevens, bedoeld in het eerste lid, betreffen:

      a. het aantal dagen en aantal uren waarop arbeid is verricht;

      b. het aantal uren waarop overwerk is verricht;

      c. het aantal uren waarover onverminderde doorbetaling van loon heeft plaatsgevonden in verband met een feestdag;

      d. het aantal uren waarover onverminderde doorbetaling van loon heeft plaatsgevonden in verband met ziekte
      als bedoeld in [artikel 629 lid 1 van Boek 7 van het Burgerlijk Wetboek][ref1] of verlof op grond van de
      [Wet arbeid en zorg][ref2];

      e. het aantal uren waarop de werknemer geen arbeid heeft verricht en waarover hij onverminderde doorbetaling van
      zijn loon heeft genoten;

      f. het kantooradres en telefoonnummer van de werkgever, bedoeld in het eerste lid;

      g. de resterende aanspraak op vakantie in uren.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref2]: https://wetten.overheid.nl/BWBR0013008
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.12
