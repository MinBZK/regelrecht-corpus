  - number: '6.4'
    text: |-
      1 Het UWV, de SVB, de colleges van burgemeester en wethouders, het BIDN en op de gezamenlijke elektronische
      voorzieningen SUWI aangesloten niet SUWI-partijen dragen zorg voor de beveiliging van de gegevensuitwisselingen
      die plaatsvinden in het kader van de gezamenlijke elektronische voorzieningen SUWI, tegen inbreuk op de
      beschikbaarheid, integriteit en vertrouwelijkheid, overeenkomstig hetgeen over de voor het stelsel van maatregelen
      en procedures te hanteren normen wordt bepaald in [bijlage I][ref1] (‘Stelselontwerp & Beveiliging Gezamenlijke
      elektronische Voorzieningen SUWI’).

      2 Het UWV, de SVB, de colleges van burgemeester en wethouders, het BIDN en op de gezamenlijke elektronische
      voorzieningen SUWI aangesloten niet- SUWI- partijen geven ieder in een beveiligingsplan aan op welke wijze zij
      invulling geven aan het eerste lid.

      3 [Artikel 5.22][ref2] is van overeenkomstige toepassing op het gebruik en de inrichting van de gezamenlijke
      elektronische voorzieningen SUWI.


