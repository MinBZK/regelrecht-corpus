      1 De SVB heeft haar zetel te Amstelveen.

      2 Het UWV heeft zijn zetel te Amsterdam.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel1.2
  - number: '1.4'
    text: |-
      Besluiten van het UWV en de SVB,

      a. tot het verwerven en vervreemden van eigendom van registergoederen die afzonderlijk een bedrag van € 250.000,–
      niet te boven gaan;

      b. tot het aangaan en beëindigen van overeenkomsten tot huur of verhuur van registergoederen die afzonderlijk een
      bedrag op jaarbasis van € 1.000.000,– niet te boven gaan;

      behoeven niet de voorafgaande instemming van de minister, bedoeld in
      [artikel 47, eerste lid, van de Wet SUWI][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel47
