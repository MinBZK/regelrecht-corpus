  - number: '3.5'
    text: |-
      1 Ten behoeve van de uitvoering van de [Wet arbeidsongeschiktheidsvoorziening militairen][ref1] en de wettelijke
      regelingen, bedoeld in [artikel 30 van de Wet SUWI][ref2], worden in de verzekerdenadministratie ten aanzien van
      elke verzekerde ten minste de volgende gegevens door het UWV vastgelegd:

      a. persoonsgegeven: burgerservicenummer;

      b. werkgeversgegeven: aansluitingsnummer;

      c. gegevens van de arbeidsverhouding:

      1º. datum aanvang arbeidsverhouding;

      2º. datum einde arbeidsverhouding;

      d. gegevens van de verzekeringsverhouding:

      1º. datum aanvang verzekeringsverhouding;

      2º. datum einde verzekeringsverhouding;

      3º. code SZ verzekeringsverhouding;

      e. gegevens van de uitkeringsverhouding:

      1º. datum aanvang uitkeringsverhouding;

      2º. datum einde uitkeringsverhouding;

      3º. code SZ uitkeringsverhouding.

      2 In de verzekerdenadministratie kunnen door het UWV andere dan de in het eerste lid genoemde gegevens worden
      vastgelegd als aan de volgende voorwaarden is voldaan:

      a. de additionele gegevens die in de verzekerdenadministratie worden vastgelegd zijn actueel en betrouwbaar;

      b. de vastlegging van de additionele gegevens staat een toekomstige uitbreiding van de in het eerste lid genoemde
      gegevens niet in de weg.


      [ref1]: https://wetten.overheid.nl/BWBR0002822
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel30
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.5
