  - number: '3.1'
    text: |-
      1 De melding, bedoeld in [artikel 37 van de Pensioenwet][ref1] en
      [artikel 45 van de Wet verplichte beroepspensioenregeling][ref2], van de arbeidsongeschiktheid van deelnemers,
      bedoeld in [artikel 1 van de Pensioenwet][ref3] en [artikel 1 van de Wet verplichte beroepspensioenregeling][ref4],
      door het UWV aan een pensioenuitvoerder, bedoeld in artikel 1 van de Pensioenwet en artikel 1 van de Wet verplichte
      beroepspensioenregeling, betreft de verwerking van gegevens over de aanvraag voor een uitkering op grond van de Wet
      werk en inkomen naar arbeidsvermogen of de Wet op de arbeidsongeschiktheidsuitkering, waarbij:

      a. een pensioenuitvoerder een bestand van deelnemers en gewezen deelnemers verstrekt aan het UWV;

      b. het UWV de gegevens van de deelnemers en de gewezen deelnemers in verband brengt met gegevens van personen die
      een arbeidsongeschiktheidsuitkering van het UWV hebben aangevraagd;

      c. het UWV de gegevens van deelnemers en gewezen deelnemers naar aanleiding van een aanvraag voor een uitkering op
      grond van de in de aanhef genoemde arbeidsongeschiktheidsverzekeringswetten verstrekt aan een pensioenuitvoerder.

      2 Het UWV verstrekt de gegevens, bedoeld in het eerste lid, aan de pensioenuitvoerder door middel van een daarvoor
      door het UWV ingerichte elektronische voorziening.

      3 Voor de levering van de gegevens, bedoeld in het eerste lid, brengt het UWV geen kosten in rekening bij de
      pensioenuitvoerder.


