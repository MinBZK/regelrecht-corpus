articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder:

        - *basisgegevens:* gegevens die in een al dan niet door de minister gedefinieerde vorm beschikbaar zijn bij het UWV
      en de SVB;
        - *BIDN:* het Bureau Informatiediensten Nederland, genoemd in [artikel 1, onderdeel m, van de Wet SUWI][ref1];
        - *melding:* de melding, bedoeld in [artikel 44, tweede lid, van de Participatiewet][ref2],
      [artikel 16a, tweede lid, van de IOAW][ref3] of [artikel 16a, tweede lid, van de IOAZ][ref4];
        - *minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *TW:* de [Toeslagenwet][ref5];
        - *Wajong:* [Wet werk en arbeidsondersteuning jonggehandicapten][ref6];
        - *WIA:* [Wet werk en inkomen naar arbeidsvermogen][ref7];


