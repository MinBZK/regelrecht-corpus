  - number: 5.10g
    text: |-
      1 Het kassiersverslag heeft betrekking op de in [artikel 15 van de regeling][ref1] bedoelde taak en bevat in elk
      geval een omschrijving van de onderwerpen die zijn genoemd in de bij deze regeling behorende [bijlage XXV][ref2].

      2 Op het kassiersverslag zijn de [artikelen 5.10b][ref3],
      [5.10c, eerste tot en met derde en vijfde lid][ref4], [5.10d, eerste tot en met vierde lid][ref5] en
      [5.10e, eerste lid, onderdelen a en b, en tweede lid, onderdelen a en b][ref6], van overeenkomstige toepassing, met
      dien verstande dat in plaats van 'jaarrekening' moet worden gelezen 'kassiersverslag' en in plaats van 'baten en
      lasten' moet worden gelezen 'ontvangsten en uitgaven'.

      3 De accountant onderzoekt of de voorgeschreven informatie in het kassiersverslag is opgenomen.

      4 De accountant stelt de controlebevindingen vast van de uitvoering van de in de in
      [artikel 15 van de regeling][ref7] bedoelde taak.


