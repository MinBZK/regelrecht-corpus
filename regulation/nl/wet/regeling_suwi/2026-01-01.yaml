  - number: '3.4'
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. arbeidsverhouding: de rechtsbetrekking tussen een werkgever en een natuurlijk persoon, krachtens welke deze
      persoon verplicht is, arbeid te verrichten voor die werkgever;

      b. jaaropgave: de jaaropgave, bedoeld in [artikel 8 van het Loonadministratiebesluit][ref1];

      c. melding sociale verzekeringen: de melding sociale verzekeringen, bedoeld in de[ artikelen 1][ref2] en
      [4 van het Besluit melding sociale verzekeringen][ref3];

      d. uitkeringsgerechtigde: verzekerde die recht heeft op een uitkering of arbeidsondersteuning
      krachtens de [Ziektewet][ref4], de [WW][ref5], de [Wet werk en inkomen naar arbeidsvermogen][ref6], de
      [Wet op de arbeidsongeschiktheidsverzekering][ref7], de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref8],
      de [Wajong][ref9], [TW][ref10] of de [Wet arbeidsongeschiktheidsvoorziening militairen][ref11];

      e. uitkeringsverhouding: de rechtsbetrekking ter zake van een recht op uitkering
      of arbeidsondersteuning krachtens de [Ziektewet][ref12], de [WW][ref13],
      de[ Wet werk en inkomen naar arbeidsvermogen][ref14], de [Wet op de arbeidsongeschiktheidsverzekering][ref15],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref16], de [Wajong][ref17], de [TW][ref18] of de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref19], tussen een uitkeringsgerechtigde en het UWV;

      f. verzekerde:

      1°. de werknemer in de zin van de werknemersverzekeringen, of

      2°. degene, die door het UWV als verzekerde wordt beschouwd, dan wel belanghebbende is in de zin van
      [artikel 1 van de Wet arbeidsongeschiktheidsvoorziening militairen][ref20].

      g. verzekerdenadministratie: een systeem, dan wel een geheel van systemen of delen daarvan, door middel
      waarvan de in deze regeling gedefinieerde gegevens van verzekerden op systematische wijze worden vastgelegd
      om te kunnen worden geraadpleegd, uitgewisseld en samengevoegd en in onderling verband te kunnen worden
      gebracht, dat door het UWV wordt beheerd als bedoeld in [artikel 33, tweede lid, van de Wet SUWI][ref21],
      zoals die bepaling luidde op de dag voorafgaande aan de datum van inwerkingtreding van
      [artikel 5 van de Invoeringswet Wet financiering sociale verzekeringen][ref22];

      h. verzekeringsverhouding: de rechtsbetrekking ter zake van een wettelijke verzekering
      als bedoeld in [artikel 30 van de Wet SUWI][ref23], dan wel op grond van de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref24], tussen een verzekerde en het UWV waarbij hij
      geregistreerd is als verzekerde;

      i. code SZ: een aanduiding waarmee de wet, op grond waarvan de verzekerings- of uitkeringsverhouding bestaat, wordt
      aangegeven;

      j. overwerk: arbeid verricht buiten de voor de betrokkene vastgestelde dagelijkse werktijd, voorzover daardoor deze
      werktijd wordt overschreden;

      k. feestdag: Nieuwjaarsdag, Eerste en Tweede Paasdag, Hemelvaartsdag, Eerste en Tweede Pinksterdag en Eerste en
      Tweede Kerstdag.


