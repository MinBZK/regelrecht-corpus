  - number: 5.21c
    text: |-
      De verslaglegging van het uitvoeringsplan, bedoeld in [artikel 2.6, zesde lid, van het Besluit SUWI][ref1]
      bevat ten minste de behaalde resultaten, bedoeld in artikel 2.6, derde lid, onder c, van het Besluit SUWI, van
      afzonderlijke gemeenten en UWV.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2.6
