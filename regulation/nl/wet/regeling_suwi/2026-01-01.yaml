        artikel: '59'
      - id: ref2
        bwb_id: BWBR0017747
        artikel: '5'
  - number: '3.9'
    text: |-
      1 Na ontvangst van de melding sociale verzekering verwerkt het UWV de daaraan te ontlenen gegevens binnen een week
      in de verzekerdenadministratie.

      2 Na ontvangst van de jaaropgave verwerkt het UWV de daaraan te ontlenen gegevens binnen zesentwintig weken in
      de verzekerdenadministratie.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      1 Het UWV verifieert de in het tweede lid genoemde gegevens bij de authentieke bron bij de eerste opname van
      gegevens over de verzekerde in de verzekerdenadministratie en vervolgens, indien daartoe aanleiding is.

      2 Voor de in [artikel 3.5][ref1] bedoelde gegevens gelden als authentieke bron:

      a. burgerservicenummer: de beheersvoorziening BSN;

      b. gegevens van de arbeidsverhouding: de administratie van de werkgever.

      3 Voor de in [artikel 3.5][ref2] genoemde gegevens waarvoor in het tweede lid geen persoon of instelling als
      authentieke bron is aangemerkt, geldt als authentieke bron het UWV.

      4 De verificatie bij eerste opname van gegevens over de verzekerde vindt plaats binnen vier weken na ontvangst van
      die gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Artikel3.5
      [ref2]: https://wetten.overheid.nl/BWBR0013280#Artikel3.5
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.10
