        bwb_id: BWBR0013280
        artikel: '5.12'
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0013280
        artikel: '5.14'
        hoofdstuk: '5'
        paragraaf: '5.2'
  - number: '5.16'
    text: |-
      1 Het UWV en de SVB dragen zorg voor een deugdelijke administratie en organisatie, waaronder begrepen dusdanige
      procedures en voorzieningen dat er, mede gelet op de stand van de kennis op het terrein van de kwaliteitszorg,
      voldoende waarborgen aanwezig zijn voor:

      a. het kunnen voldoen aan de informatieverplichtingen, bedoeld in [§ 5.2.1][ref1];

      b. tijdige verstrekking van gegevens en informatie;

      c. voldoende actualiteit;

      d. het voldoen aan het normenkader voor de betrouwbaarheid van de niet-financiële informatie zoals opgenomen in de
      bij deze regeling behorende [bijlage XVII][ref2] (‘Normenkader betrouwbaarheid niet-financiële informatie’);

      e. continuïteit van de verstrekking en opslag van gegevens en informatie.

      2 Het UWV en de SVB rapporteren in de bedrijfsvoeringsparagraaf in het jaarverslag over de kwaliteit van de
      informatievoorziening en over de wijze waarop deze is gewaarborgd.


      [ref1]: https://wetten.overheid.nl/BWBR0013280#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0013280
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.16
    references:
      - id: ref1
        bwb_id: BWBR0013280
        hoofdstuk: '5'
        paragraaf: '5.2'
      - id: ref2
        bwb_id: BWBR0013280
  - number: 5.17a
    text: |-
      1 Het UWV, de SVB en stellen de minister en de Nederlandse Arbeidsinspectie zo spoedig mogelijk in kennis van
      hun voornemens tot het door één of meer andere rechtspersonen of natuurlijke personen laten verrichten van
      werkzaamheden op het terrein van facilitaire dienstverlening of personeelsbeleid, indien het zwaarwegend karakter
      ervan daartoe naar hun oordeel aanleiding geeft.

      2 Een kennisgeving als bedoeld in het eerste lid omvat in elk geval de volgende informatie:

      a. een zodanige beschrijving van de door derden te verrichten werkzaamheden, dat daaruit blijkt in welke relatie
      deze tot de kerntaken staan;

      b. de contractduur;

      c. de volumegegevens en (geraamde) financiële omvang van het contract; en

      d. indien in verband met de werkzaamheden inzage in of overdracht van cliëntgegevens plaatsvindt: een beschrijving
      van aard en hoeveelheid daarvan.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.17a
  - number: '5.18'
    text: |-
      De minister wijzigt de bepalingen in deze paragraaf en de daarbij behorende bijlagen slechts na overleg met het UWV
      en de SVB.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel5.18
  - number: 5.21a
    text: |-
      Als personen en bestuursorganen als bedoeld in [artikel 64, eerste lid, aanhef en onder d, van de Wet SUWI][ref1]
      worden aangewezen:

      a. de Minister van Justitie en Veiligheid, voor zover het betreft de uitvoering van taken door de Immigratie- en
      Naturalisatiedienst;

      b. het bestuur van een openbaar lichaam, waaraan bij gemeenschappelijke regeling als bedoeld in
      [artikel 10, tweede lid, van de Wet gemeenschappelijke regelingen][ref2] de uitvoering is overgedragen van de taken
      die bij of krachtens de in [artikel 62, eerste lid, van de Wet SUWI][ref3] genoemde wetten aan de colleges van
      burgemeester en wethouders zijn opgedragen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0003740#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel62
