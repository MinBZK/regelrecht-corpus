      - id: ref1
        bwb_id: BWBR0008657
        artikel: 1a:1
  - number: '3.15'
    text: |-
      1 Met het oog op het koppelen van vraag en aanbod op de arbeidsmarkt en in het onderwijs, stelt het UWV een
      geüniformeerde set van beschrijvingen van vaardigheden, kennisgebieden en talenbeheersing beschikbaar aan bedrijven
      en instellingen, ten behoeve van de ontwikkeling van toepassingen.

      2 Het UWV stelt de set publiek en centraal beschikbaar op een portaal, in de vorm van Linked Open Data via een
      aparte gateway. Het UWV beheert het portaal en de bijbehorende centrale servicedesk, en biedt gebruiksondersteuning
      aan bedrijven en instellingen.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel3.15
  - number: '4.1'
    text: |-
      De subsidie, bedoeld in
      __REF000___________________________________________________________________________________________________________
      _________, en de door het UWV aan het re-integratiebedrijf of de arbodienst maximaal te
      vergoeden kosten van de uitvoering van de persoonsgebonden re-integratieovereenkomst, bedoeld in
      __REF001___________________________________________________________________________________________________________
      _________ bedragen ten hoogste € 3630,– per cliënt.


      [ref1]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
      [ref2]: https://wetten.overheid.nl/BWBR0019058#Artikel2.7a
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0019058
        artikel: 2.7a
      - id: ref2
        bwb_id: BWBR0019058
        artikel: 2.7a
  - number: '4.6'
    text: |-
      Het UWV en de overheidswerkgever stellen regels omtrent voorwaarden waaraan een re-integratiebedrijf, deskundige
      persoon of arbodienst moet voldoen, alvorens met dat bedrijf, die persoon of die dienst een individuele re-
      integratieovereenkomst wordt gesloten.

      Die regels hebben in elk geval betrekking op:

      1°. uitsluitingsgronden;

      2°. kwaliteitseisen;

      3°. ervaringseisen.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel4.6
  - number: '4.7'
    text: |-
      1 Het UWV en de overheidswerkgever kunnen uitsluitend een individuele re-integratieovereenkomst sluiten indien de
      aanvraag vergezeld gaat van een door of namens de aanvrager, bedoeld in [artikel 4.2, eerste lid][ref1], danwel
      [artikel 4.2a, eerste lid, van het Besluit SUWI][ref2], opgesteld plan waarin in elk geval zijn opgenomen:

      1°. het opleidingsniveau en het burgerservicenummer van de aanvrager;

      2°. een beschrijving van de werkzaamheden die op grond van de individuele re-integratieovereenkomst zullen worden
      verricht;

      3°. de verwachte begin- en einddatum van de werkzaamheden die op grond van de individuele re-integratieovereenkomst
      zullen worden verricht;

      4°. de beroepsactiviteiten die de aanvrager naar verwachting na afloop van die periode kan vervullen;

      5°. een opgave van de kosten van de werkzaamheden die op grond van de individuele re-integratieovereenkomst zullen
      worden verricht.

      2 Het UWV en de overheidswerkgever kunnen een termijn bepalen waarbinnen de aanvrager, bedoeld in het eerste lid,
      een aanvraag om een individuele re-integratieovereenkomst kan indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4.2
      [ref2]: https://wetten.overheid.nl/BWBR0013267#Artikel4.2a
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4.2'
      - id: ref2
        bwb_id: BWBR0013267
        artikel: 4.2a
  - number: '4.8'
    text: |-
      In de individuele re-integratieovereenkomst wordt in elk geval geregeld:

      a. dat een door het UWV of de overheidswerkgever te bepalen deel van de kosten van de door het re-
      integratiebedrijf, de deskundige persoon of de arbodienst verrichte werkzaamheden slechts door het UWV of de
      overheidswerkgever wordt vergoed indien de persoon, ten behoeve van wie een individuele re-integratieovereenkomst
      is gesloten, binnen drie maanden nadat de werkzaamheden bedoeld in dit contract zijn geëindigd het verrichten van
      arbeid duurzaam heeft hervat, waarbij het UWV of de overheidswerkgever voor personen verschillende definities van
      duurzame werkhervatting mag hanteren;

      b. dat het re-integratiebedrijf, de deskundige persoon of de arbodienst op door het UWV of de overheidswerkgever
      te bepalen tijdstippen bij het UWV of de overheidswerkgever een rapportage indient waarin een beschrijving is
      opgenomen van de werkzaamheden die zijn verricht ten behoeve van de inschakeling in het arbeidsproces van de
      persoon. In de rapportage wordt een prognose voor de resterende periode van het traject beschreven;

      c. dat de overeenkomst door beide partijen slechts wegens gewichtige redenen tussentijds door opzegging kan worden
      beëindigd.
    url: https://wetten.overheid.nl/BWBR0013280/2026-01-01#Artikel4.8
  - number: '5.3'
    text: |-
      1 Het UWV, de SVB en het BIDN bieden ieder hun jaarplan met begroting jaarlijks vóór 1 november aan de minister
      aan. Zij bieden hun conceptjaarplan jaarlijks vóór 1 oktober aan.

      2 De jaarplannen met begrotingen van het UWV , de SVB, en het BIDN bevatten in elk geval een omschrijving van de
      onderwerpen die zijn genoemd in de bij deze regeling behorende [bijlagen VI][ref1], [VIII][ref2] en [XI][ref3].

      3 Het jaarplan van het UWV bestaat uit twee afzonderlijke delen, waarvan één deel uitsluitend betrekking heeft op
      het in [artikel 5.21, tweede lid, van het Besluit SUWI][ref4] bedoelde organisatieonderdeel en het andere deel op
      het UWV met uitzondering van het bedoelde organisatieonderdeel.

      4 De delen van het jaarplan die betrekking hebben op het in [artikel 5.21, tweede lid, van het Besluit SUWI][ref5]
      bedoelde organisatieonderdeel bevatten in elk geval een omschrijving van de onderwerpen die zijn genoemd in de bij
      deze regeling behorende [bijlage XX][ref6].


