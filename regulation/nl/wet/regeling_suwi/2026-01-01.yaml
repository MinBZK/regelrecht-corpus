  - number: 5.21b
    text: |-
      Het gezamenlijk aanspreekpunt, bedoeld in [artikel 2.5, derde lid, van het Besluit SUWI][ref1] gebruikt ten minste
      de naam ‘werkgeversservicepunt’ in combinatie met de naam van de arbeidsmarktregio.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel2.5
