  - number: '1.5'
    text: |-
      1 De verwerking van gegevens door het UWV en de SVB bij de uitvoering van andere werkzaamheden, bedoeld in
      [artikel 73a, eerste lid, van de Wet SUWI][ref1], vindt uitsluitend plaats indien:

      a. de gegevens noodzakelijk zijn voor de uitvoering van die andere dan wettelijke taken;

      b. de gegevens systematisch worden verwerkt; en

      c. de gegevens, en de wijze van verwerking daarvan, zijn omschreven in de overeenkomst op grond waarvan de andere
      dan wettelijke taken worden verricht.

      2 De gegevensverstrekking door het UWV en de SVB aan derden, bedoeld in
      [artikel 73a, tweede lid, van de Wet SUWI][ref2], geschiedt slechts indien de gegevens systematisch worden
      verstrekt.

      3 Bij het verstrekken van gegevens op verzoek aan een derde, bedoeld in
      [artikel 73a, tweede lid, van de Wet SUWI][ref3], brengen het UWV en de SVB de kosten van die verstrekking in
      rekening aan die derde.


