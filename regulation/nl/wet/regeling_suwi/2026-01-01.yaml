  - number: '3.2'
    text: |-
      1 De pensioenuitvoerder verwerkt de gegevens van de melding uitsluitend voor de uitvoering van de pensioenregeling
      of beroepspensioenregeling.

      2 Indien de pensioenuitvoerder de werkzaamheden uitbesteedt als bedoeld in [artikel 34 van de Pensioenwet][ref1] en
      [artikel 43 van de Wet verplichte beroepspensioenregeling][ref2] en deze uitbesteding inhoudt, dat de daar genoemde
      derde bewerker is in de zin van de [Wet bescherming persoonsgegevens][ref3] voor de pensioenuitvoerder, verstrekt
      het UWV de gegevens aan deze derde.

      3 Het UWV overlegt over de inrichting van de elektronische voorziening, bedoeld in [artikel 3.1, tweede lid][ref4],
      met een vertegenwoordiging van de pensioenuitvoerders.


