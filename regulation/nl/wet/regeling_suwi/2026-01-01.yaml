  - number: 3.3a
    text: |-
      Indien het UWV gegevens verstrekt aan derden als bedoeld in [artikel 73, tweede lid, van de Wet SUWI][ref1], brengt
      het UWV deze derden ter zake van deze gegevenslevering kosten in rekening volgens door het UWV vastgestelde en voor
      aanvang van het kalenderjaar gepubliceerde tarieven. Het UWV kan bij de vaststelling van tarieven rekening houden
      met kosten voor ontwikkeling van systemen voor de verstrekking van gegevens, kosten voor aansluiting van ontvangers
      van de gegevens op systemen van het UWV en kosten per verstrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel73
