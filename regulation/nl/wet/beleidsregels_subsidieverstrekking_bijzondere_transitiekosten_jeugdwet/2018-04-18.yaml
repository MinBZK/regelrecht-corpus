---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: beleidsregels_subsidieverstrekking_bijzondere_transitiekosten_jeugdwet
regulatory_layer: WET
publication_date: '2014-07-29'
valid_from: '2018-04-18'
bwb_id: BWBR0035391
url: https://wetten.overheid.nl/BWBR0035391/2018-04-18
preamble:
  text: |-
    Gelet op artikel 5 van de begroting van VWS;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
  - number: 1.1.a
    text: |-
      *jeugdhulp:* jeugdhulp als bedoeld in [artikel 1.1 van de Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 1.1.b
    text: |-
      *jeugdreclassering:* jeugdreclassering als bedoeld in [artikel 1.1 van de Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 1.1.c
    text: |-
      *kinderbeschermingsmaatregelen:* kinderbeschermingsmaatregelen als bedoeld in [artikel 1.1 van de Jeugdwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0034925#Artikel1
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0034925
        artikel: '1'
  - number: 1.1.d
    text: |-
      *organisatie:* aanbieder van jeugdhulp, organisatie voor advisering en verwerking van meldingen inzake huiselijk
      geweld of kindermishandeling of uitvoerder van kinderbeschermingsmaatregelen of jeugdreclassering;
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
  - number: 1.1.e
    text: '*voorziening:* vorm van jeugdhulp of uitvoering van kinderbeschermingsmaatregelen of jeugdreclassering;'
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
  - number: 1.1.f
    text: |-
      *Autoriteit:* Transitie Autoriteit Jeugd bedoeld in het [Instellingsbesluit Transitie Autoriteit Jeugd][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035002
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0035002
  - number: 1.1.g
    text: '*minister:* Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
  - number: 1.1.h
    text: |-
      *jaaromzet in 2013:* jaaromzet zoals die valt af te leiden uit de door een accountant gecontroleerde jaarrekening
      2013 van de aanvragende organisatie;
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
  - number: 1.1.i
    text: '*intramurale plaats:* jeugdhulp in combinatie met 24-uurs verblijf.'
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
  - number: '1.2'
    text: |-
      Indien de besluiten van de minister op grond van deze regeling betrekking hebben op een subsidieverstrekking
      aan een organisatie die uitvoerder is van kinderbeschermingsmaatregelen of jeugdreclassering worden de besluiten
      genomen mede namens de Minister van Veiligheid en Justitie.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
  - number: '1.3'
    text: |-
      Op de verstrekking van subsidies door de minster op grond van deze regeling is de
      [Kaderregeling subsidies OCW, SZW en VWS][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: '1.4'
    text: |-
      Op de verstrekking van subsidies op grond van deze regeling aan een organisatie die uitvoerder is van
      kinderbeschermingsmaatregelen of jeugdreclassering is de [Kaderregeling subsidies OCW, SZW en VWS][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037603
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0037603
  - number: '2'
    text: 'De minister kan aan een organisatie een subsidie verstrekken:'
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel2
  - number: 2.c
    text: |-
      ten behoeve van de kosten die een organisatie, die voor de bekostiging van een voorziening afhankelijk is van een
      groot aantal gemeenten, moet maken om aan haar financiële verplichtingen te kunnen voldoen, indien die bekostiging
      door gemeenten, ondanks aantoonbare inspanningen van de organisatie, vanwege het grote aantal betrokken gemeenten
      mogelijk gedurende enige tijd op zich laat wachten. Van een groot aantal betrokkenen is sprake:
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel2
  - number: 2.c.1
    text: |-
      indien een organisatie zowel in ten minste 10 samenwerkingsregio’s een omzet heeft behaald van ten minste 2% per
      regio als in ten hoogste 2 samenwerkingsregio’s een omzet van ten hoogste 30% per regio heeft behaald en in alle
      andere regio’s een omzet van ten hoogste 20% per regio heeft behaald, of
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel2
  - number: 2.c.2
    text: |-
      indien de organisatie in tenminste 20 gemeenten omzet heeft gerealiseerd en in tenminste 3 samenwerkingsregio’s
      minimaal 2% van de omzet heeft behaald en gecontracteerd is voor minimaal 20 intramurale plaatsen.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel2
  - number: '3.1'
    text: |-
      Een aanvraag om een subsidie als bedoeld in [artikel 2, onder c][ref1] kan tot uiterlijk 1 januari 2019 worden
      ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0035391#Artikel2
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0035391
        artikel: '2'
  - number: '3.2'
    text: Een aanvraag die op of na 1 januari 2019 wordt ingediend, wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel3
  - number: '4.1'
    text: |-
      De Autoriteit brengt op verzoek van de minister advies uit over de op de aanvraag van een subsidie te nemen
      beslissing.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel4
  - number: '4.2'
    text: Bij de beslissing op de aanvraag tot subsidieverlening betrekt de minister het advies van de Autoriteit.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel4
  - number: '5.1'
    text: |-
      Een subsidie als bedoeld in [artikel 2, onder a][ref1], wordt alleen verstrekt indien de organisatie de voorziening
      lopende het jaar 2015 blijft bieden zolang dat nodig is om continuïteit te verzekeren en de voorziening daarna
      beëindigt.


      [ref1]: https://wetten.overheid.nl/BWBR0035391#Artikel2
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0035391
        artikel: '2'
  - number: '5.2'
    text: |-
      De subsidie bedraagt niet meer dan 80% van dat deel van de jaaromzet in 2013 van de organisatie dat de voorziening
      betreft waarvoor de subsidie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel5
  - number: '6.1'
    text: |-
      Een subsidie als bedoeld in [artikel 2, onder b][ref1], wordt alleen verstrekt indien:


      [ref1]: https://wetten.overheid.nl/BWBR0035391#Artikel2
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035391
        artikel: '2'
  - number: 6.1.a
    text: sprake is van vermindering van de bekostiging van een voorziening;
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel6
  - number: 6.1.b
    text: |-
      de organisatie voldoende aannemelijk maakt dat zij in staat is om de organisatie na aanpassing aan de eisen die de
      gemeenten stellen aan de bekostiging, voort te zetten;
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel6
  - number: 6.1.c
    text: |-
      de organisatie maatregelen neemt die noodzakelijk zijn om, met gebruikmaking van de gevraagde subsidie, lasten en
      baten met elkaar in evenwicht te brengen;
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel6
  - number: 6.1.d
    text: de organisatie de kosten waarvoor de subsidie wordt gevraagd redelijkerwijs niet zelf kan dragen;
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel6
  - number: 6.1.e
    text: |-
      de subsidie in verhouding tot dat deel van de jaaromzet in 2013 van de organisatie dat de voorziening betreft
      waarvoor de subsidie wordt gevraagd, door de Autoriteit als redelijk wordt beoordeeld.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel6
  - number: '6.2'
    text: |-
      Indien de minister en de Minister van Veiligheid en Justitie jegens een gemeente bestuurlijke maatregelen hebben
      getroffen die zien op het sluiten van een overeenkomst met een organisatie en van de gemeente en de organisatie
      redelijkerwijs niet verwacht mag worden dat zij de kosten bedoeld in [artikel 2, onder b][ref1], volledig voor hun
      rekening nemen, kan eveneens een subsidie als bedoeld in artikel 2, onder b, verstrekt worden.


      [ref1]: https://wetten.overheid.nl/BWBR0035391#Artikel2
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0035391
        artikel: '2'
  - number: '7.1'
    text: |-
      Een subsidie als bedoeld in [artikel 2, onder c][ref1], bedraagt maximaal 15% van dat deel van de omzet van de
      organisatie dat de voorzieningen betreft waar de subsidieaanvraag betrekking op heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0035391#Artikel2
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0035391
        artikel: '2'
  - number: '7.2'
    text: |-
      De subsidie wordt door de subsidie ontvanger uiterlijk binnen één jaar na de verlening terugbetaald. De subsidie
      wordt daarna op nihil vastgesteld.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel7
  - number: '8.1'
    text: Het subsidieplafond voor de verstrekking van subsidies op grond van deze regeling bedraagt € 200 miljoen.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel8
  - number: '8.2'
    text: De minister verdeelt het beschikbare bedrag in volgorde van datum van ontvangst van de aanvragen.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel8
  - number: '9.1'
    text: Deze regeling treedt in werking met ingang van 1 oktober 2014.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel9
  - number: '9.2'
    text: Deze regeling vervalt met ingang van 1 oktober 2019.
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel9
  - number: '10'
    text: 'Deze regeling wordt aangehaald als: Beleidsregels subsidieverstrekking bijzondere transitiekosten Jeugdwet.'
    url: https://wetten.overheid.nl/BWBR0035391/2018-04-18#Artikel10
