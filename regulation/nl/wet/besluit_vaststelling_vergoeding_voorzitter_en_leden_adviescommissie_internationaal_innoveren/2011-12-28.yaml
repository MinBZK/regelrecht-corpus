  - number: '2'
    text: >-
      Het Besluit van de Minister van Economische Zaken tot vaststelling vergoeding leden Adviescommissie Internationaal
      Innoveren van 10 maart 2010 (Stcrt. 2010, 16568) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0030977/2011-12-28#Artikel2
  - number: '3'
    text: >-
      Dit besluit treedt in werking met ingang van de dag na de dagtekening van de Staatscourant waarin het wordt
      geplaatst en werkt terug tot en met 1 januari 2011 en vervalt met ingang van 1 januari 2012.
    url: https://wetten.overheid.nl/BWBR0030977/2011-12-28#Artikel3
