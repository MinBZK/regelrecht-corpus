articles:
  - number: '1'
    text: |-
      1 Aan de voorzitter van de Adviescommissie Internationaal Innoveren wordt een vaste
      vergoeding per maand toegekend, waarbij de salarisschaal wordt vastgesteld op schaal 18 van
      [bijlage B van het Bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref1] en de arbeidsduurfactor op 0,104.

      2 Aan de leden Van der Vies, De Lange, Heij en Broekhoff van de Adviescommissie Internationaal Innoveren
      wordt een vaste vergoeding per maand toegekend, waarbij de salarisschaal wordt vastgesteld op schaal 16 van
      [bijlage B van het Bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref2] en de arbeidsduurfactor op 0,059.

      3 Aan de leden McGillivray, Lettinga en Beunder van de Adviescommissie Internationaal Innoveren wordt
      een vaste vergoeding per maand toegekend, waarbij de salarisschaal wordt vastgesteld op schaal 16 van
      [bijlage B van het Bezoldigingsbesluit burgerlijke rijksambtenaren 1984][ref3] en de arbeidsduurfactor op 0,046.


