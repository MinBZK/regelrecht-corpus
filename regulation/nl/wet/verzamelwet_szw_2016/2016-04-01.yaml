        artikel: XX
  - number: XXXV.2
    text: Dit artikel vervalt zes maanden na de inwerkingtreding van het artikelonderdeel, genoemd in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0037319/2016-04-01#ArtikelXXXV
  - number: XXXVI
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en kunnen terugwerken
      tot en met een in dat besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen
      daarvan verschillend kan worden vastgesteld. In dat besluit wordt zo nodig toepassing gegeven aan
      [artikel 12 van de Wet raadgevend referendum][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0036443#Artikel12
