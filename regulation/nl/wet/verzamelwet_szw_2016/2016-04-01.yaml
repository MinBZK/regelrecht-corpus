preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om enige wijzigingen in de wetgeving op het terrein van
    het Ministerie van Sociale Zaken en Werkgelegenheid aan te brengen;

    Zo is het dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-Generaal,
    hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0037319/2016-04-01#ArtikelAanhef
articles:
  - number: XXXV.1
    text: |-
      Onze Minister van Sociale Zaken en Werkgelegenheid kan de bedragen, genoemd in de
      [artikelen VIII, onderdeel I][ref1], [XIX, onderdeel Aa][ref2], en [XX, onderdeel Aa][ref3], van deze wet
      eenmalig aanpassen na de datum van inwerkingtreding van dat artikelonderdeel.


      [ref1]: https://wetten.overheid.nl/BWBR0037319#ArtikelVIII
      [ref2]: https://wetten.overheid.nl/BWBR0037319#ArtikelXIX
      [ref3]: https://wetten.overheid.nl/BWBR0037319#ArtikelXX
    url: https://wetten.overheid.nl/BWBR0037319/2016-04-01#ArtikelXXXV
