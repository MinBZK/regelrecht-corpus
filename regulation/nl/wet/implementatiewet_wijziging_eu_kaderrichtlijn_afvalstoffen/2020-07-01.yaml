    text: |-
      1 Deze wet treedt in werking met ingang van 1 juli 2020, met uitzondering van [artikel I, onderdeel D][ref1].
      Indien het Staatsblad waarin deze wet wordt geplaatst, wordt uitgegeven op of na 1 juli 2020, treedt zij in werking
      met ingang van de dag na de datum van uitgifte van het Staatsblad waarin zij wordt geplaatst.

      2 [Artikel I, onderdeel D][ref2], treedt in werking op een bij koninklijk besluit te bepalen tijdstip.


