preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het noodzakelijk is, ter implementatie van Richtlijn (EU) 2018/851 van
    het Europees Parlement en de Raad van 30 mei 2018 tot wijziging van Richtlijn 2008/98/EG betreffende afvalstoffen
    (PbEU L 150), de Wet milieubeheer en enkele andere wetten te wijzigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State van het Koninkrijk gehoord, en met gemeen overleg
    der Staten-Generaal, de bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden
    en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0043601/2020-07-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      [Artikel 15.36 van de Wet milieubeheer][ref1], zoals dat artikel luidde voor inwerkingtreding van
      [artikel I, onderdeel H][ref2] van deze wet, blijft tot 5 januari 2023 van toepassing op regelingen voor
      uitgebreide producentenverantwoordelijkheid die voor 4 juli 2018 zijn vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel15.36
      [ref2]: https://wetten.overheid.nl/BWBR0043601#ArtikelI
