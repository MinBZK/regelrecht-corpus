  - number: '12'
    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan natuurlijke personen en
      rechtspersonen voor zover zij bij het als effectenbemiddelaar aanbieden of verrichten van diensten cliënten
      aanbrengen bij:

      a. een beleggingsinstelling;

      b. een effecteninstelling die ingevolge een vergunning als bedoeld in [artikel 7, eerste lid, van de wet][ref2] of
      ingevolge [artikel 7, tweede lid][ref3], [aanhef en onder h, i of j, van de wet](onbekend) als effectenbemiddelaar
      of vermogensbeheerder diensten mag aanbieden of verrichten; of

      c. een effecteninstelling die ingevolge de [artikelen 13][ref4], [14][ref5], [15][ref6], [16][ref7], [17][ref8] of
      [18][ref9] is vrijgesteld van [artikel 7, eerste lid, van de wet][ref10].

      2 Onverminderd [artikel 20][ref11] wordt aan de vrijstelling, bedoeld in het eerste lid, het voorschrift
      verbonden dat de natuurlijke persoon of rechtspersoon bij het als effectenbemiddelaar aanbieden of verrichten
      van de in het eerste lid bedoelde diensten de regels, bedoeld in [artikel 24][ref12] van het besluit, naleeft.
      [Artikel 26, eerste lid][ref13], van het besluit is van overeenkomstige toepassing.


