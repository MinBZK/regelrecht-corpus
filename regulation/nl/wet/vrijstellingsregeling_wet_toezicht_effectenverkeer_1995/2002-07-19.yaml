  - number: '13'
    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan natuurlijke personen en
      rechtspersonen voor zover zij bij het als effectenbemiddelaar aanbieden of verrichten van diensten orders met
      betrekking tot niet in deel B van de bijlage bij de richtlijn beleggingsdiensten genoemde effecten als bedoeld
      in de wet of orders met betrekking tot de instrumenten, genoemd onder 1 van deel B van die bijlage, voor
      rekening van cliënten aanbrengen bij een effecteninstelling die is aangesloten bij een organisatie als bedoeld in
      [artikel 9 van de wet][ref2], op grond van een met die effecteninstelling gesloten overeenkomst.

      2 Van [artikel 7, eerste lid, van de wet][ref3] wordt vrijstelling verleend aan natuurlijke personen en
      rechtspersonen voor zover zij bij het als vermogensbeheerder aanbieden of verrichten van diensten orders met
      betrekking tot niet in deel B van de bijlage bij de richtlijn beleggingsdiensten genoemde effecten als bedoeld in
      de wet voor rekening van cliënten aanbrengen bij een effecteninstelling die is aangesloten bij een organisatie als
      bedoeld in [artikel 9 van de wet][ref4], op grond van een met die effecteninstelling gesloten overeenkomst.

      3 Onverminderd [artikel 20][ref5] wordt aan de vrijstelling, bedoeld in het eerste en tweede lid, het
      voorschrift verbonden dat de natuurlijke persoon of rechtspersoon bij het als effectenbemiddelaar dan wel als
      vermogensbeheerder aanbieden of verrichten van de in het eerste onderscheidenlijk tweede lid bedoelde diensten de
      voor de desbetreffende effectenbeurs te hanteren regels naleeft.


