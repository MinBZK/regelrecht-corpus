  - number: '15'
    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan
      particuliere participatiemaatschappijen die ingevolge de [artikelen 4][ref2] of
      [32 van het Besluit particuliere participatiemaatschappijen][ref3] zijn erkend, voor zover zij als
      effectenbemiddelaar diensten aanbieden of verrichten die betrekking hebben op aandelen in hun eigen geplaatste
      kapitaal.

      2 Onverminderd [artikel 20][ref4] wordt aan de vrijstelling, bedoeld in het eerste lid, het voorschrift verbonden
      dat de particuliere participatiemaatschappij bij het als effectenbemiddelaar aanbieden of verrichten van de in
      het eerste lid bedoelde diensten de regels, bedoeld in de [artikelen 24][ref5], [25][ref6] en [28][ref7] van het
      besluit, naleeft. [Artikel 26, eerste lid][ref8], van het besluit is van overeenkomstige toepassing.


