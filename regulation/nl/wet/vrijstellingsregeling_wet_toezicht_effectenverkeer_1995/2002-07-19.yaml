  - number: '10'
    text: |-
      Van de op grond van [artikel 5, eerste lid, van de wet][ref1] gestelde regels wordt vrijstelling verleend
      aan instellingen te wier laste uitsluitend effecten zijn uitgegeven waarvan het aanbod dan wel het in het
      vooruitzicht gestelde aanbod ingevolge de [artikelen 3][ref2], [4][ref3] of [9][ref4] is vrijgesteld van
      [artikel 3, eerste lid, van de wet][ref5].


