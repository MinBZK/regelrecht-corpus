  - number: 11a
    text: |-
      1 Van [artikel 6a, eerste lid, van de wet][ref1] wordt vrijstelling verleend indien het een openbaar bod betreft
      op effecten waar geen rechtstreeks of potentieel stemrecht aan verbonden is, met uitzondering van niet-royeerbare
      certificaten.

      2 Van [artikel 6a, eerste lid, van de wet][ref2] wordt vrijstelling verleend indien het een openbaar bod betreft op
      effecten die door de bieder zelf zijn uitgegeven.

      3 Van [artikel 6b van de wet][ref3] wordt vrijstelling verleend indien effecten in regelmatig beursverkeer of met
      toepassing van de artikelen 92a, 201a of 336 van Boek 2 van het Burgerlijk Wetboek worden verworven of indien de
      effecten worden verworven ingevolge een openbaar bod waarvan de aanmeldingstermijn geheel of ten dele samenvalt met
      een openbaar bod dat door een derde wordt uitgebracht op de doelvennootschap.

      4 Van [artikel 9i, onder b][ref4], [artikel 9k, onder b][ref5], en [artikel 9m, onder i][ref6], van het besluit
      wordt vrijstelling verleend indien het een openbaar bod op effecten betreft in een beleggingsinstelling, waarvan de
      rechten van deelneming door haar vrij ingekocht en verkocht worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel6a
