  - number: '2'
    text: |-
      1 Van artikel 3, eerste lid, van de wet wordt vrijstelling verleend indien een aanbod dan wel een in het
      vooruitzicht gesteld aanbod uitsluitend is gericht tot natuurlijke personen of rechtspersonen die beroeps- of
      bedrijfsmatig handelen of beleggen in effecten.

      2 Aan de vrijstelling, bedoeld in het eerste lid, wordt het voorschrift verbonden dat in het aanbod dan wel in
      het biedingsbericht alsmede in advertenties en documenten waarin het aanbod in het vooruitzicht wordt gesteld,
      wordt vermeld dat het aanbod uitsluitend is onderscheidenlijk zal zijn gericht tot de in het eerste lid genoemde
      personen. Een afschrift van een biedingsbericht wordt vooraf aan de toezichthouder overgelegd.
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel2
  - number: '3'
    text: |-
      1 Van artikel 3, eerste lid, van de wet wordt vrijstelling verleend indien een aanbod dan wel een in het
      vooruitzicht gesteld aanbod uitsluitend is gericht tot personen die gevestigd dan wel woonachtig zijn of hun gewone
      verblijfplaats hebben buiten Nederland.

      2 Aan de vrijstelling, bedoeld in het eerste lid, worden de volgende voorschriften verbonden:

      a. in het aanbod dan wel in het biedingsbericht alsmede in advertenties en documenten waarin het aanbod in het
      vooruitzicht wordt gesteld, wordt vermeld dat het aanbod niet is onderscheidenlijk zal zijn gericht tot personen
      die gevestigd dan wel woonachtig zijn of hun gewone verblijfplaats hebben in Nederland;

      b. ter zake van het aanbod dan wel van het biedingsbericht alsmede van advertenties en documenten waarin het aanbod
      in het vooruitzicht wordt gesteld, wordt voldaan aan bij en krachtens wettelijk voorschrift gestelde regels van
      de staat waarin de personen tot wie het aanbod is onderscheidenlijk zal zijn gericht, gevestigd dan wel woonachtig
      zijn of hun gewone verblijfplaats hebben;

      c. een verklaring van de uitgevende instelling dat is voldaan aan de regels, bedoeld onder b, wordt voorafgaand aan
      het aanbod aan de toezichthouder overgelegd;

      d. de verklaring, bedoeld onder c, wordt opgenomen in het onder a bedoelde biedingsbericht en in de onder a
      bedoelde advertenties en documenten.
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel3
  - number: '4'
    text: |-
      Van artikel 3, eerste lid, van de wet wordt vrijstelling verleend indien de effecten worden aangeboden in coupures
      ter waarde van ten minste € 45378,02 of de tegenwaarde daarvan in vreemde valuta.
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel4
  - number: '5'
    text: |-
      Van [artikel 3, eerste lid, van de wet][ref1] wordt vrijstelling verleend indien de effecten worden aangeboden
      om niet.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel5
