  - number: '16'
    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan
      bedrijfspensioenfondsen, ondernemingspensioenfondsen en ondernemingsspaarfondsen als bedoeld in
      [artikel 1, eerste lid, onder b, c onderscheidenlijk d, van de Pensioen- en spaarfondsenwet][ref2], die krachtens
      die wet aan het toezicht van de Pensioen- & Verzekeringskamer zijn onderworpen en die als vermogensbeheerder
      uitsluitend diensten aanbieden aan of verrichten voor de desbetreffende bedrijfstak dan wel onderneming waarmee zij
      zijn verbonden.

      2 Van [artikel 7, eerste lid, van de wet][ref3] wordt vrijstelling verleend aan natuurlijke personen en
      rechtspersonen voor zover zij als vermogensbeheerder uitsluitend diensten aanbieden aan of verrichten voor een
      fonds als bedoeld in het eerste lid of een daaraan gelieerd fonds, mits de natuurlijke persoon of de rechtspersoon
      is verbonden aan het fonds waaraan de diensten worden aangeboden of waarvoor de diensten worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel7
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel16
