        artikel: '3'
  - number: '6'
    text: |-
      Van [artikel 3, eerste lid, van de wet][ref1] wordt vrijstelling verleend indien een aanbod dan wel een in
      het vooruitzicht gesteld aanbod betrekking heeft op Euro-effecten waarvoor geen algemene reclamecampagne of
      colportagecampagne wordt gevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
  - number: '7'
    text: |-
      Van [artikel 3, eerste lid, van de wet][ref1] wordt vrijstelling verleend indien een aanbod dan wel een in het
      vooruitzicht gesteld aanbod betrekking heeft op schuldbrieven, inschrijvingen in schuldregisters en soortgelijke
      rechten, die een oorspronkelijke looptijd van ten hoogste een jaar hebben en die worden uitgegeven door een
      kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
  - number: '8'
    text: |-
      Van [artikel 3, eerste lid, van de wet][ref1] wordt vrijstelling verleend indien een aanbod dan wel een
      in het vooruitzicht gesteld aanbod betrekking heeft op rechten van deelneming in een beleggingsinstelling
      die ingevolge artikel 1 van de regeling van de Minister van Financiën van 9 oktober 1990 tot uitvoering
      van [artikel 14 van de Wet toezicht beleggingsinstellingen][ref2] (Stcrt. 198) is vrijgesteld van
      [artikel 4, eerste lid, van de Wet toezicht beleggingsinstellingen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004809#Artikel14
