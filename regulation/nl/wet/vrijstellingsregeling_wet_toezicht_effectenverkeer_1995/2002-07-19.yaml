articles:
  - number: '1'
    text: |-
      In deze regeling wordt - voor zover niet anders is bepaald - verstaan onder:



            a
             wet:

              de [Wet toezicht effectenverkeer 1995][ref1];



            b
             besluit:

              het [Besluit toezicht effectenverkeer 1995][ref2];



            c
            de toezichthouder:

              de Stichting Autoriteit Financiële Markten;.



            d
             kredietinstelling:

              een onderneming of instelling die ingevolge
      [artikel 52, tweede lid, onder a, b, c of d, van de Wet toezicht kredietwezen 1992][ref3] is geregistreerd;



            e
             beleggingsinstelling:

              een onderneming of instelling die ingevolge [artikel 18 van de Wet toezicht beleggingsinstellingen][ref4]
      is geregistreerd of die ingevolge artikel 1 van de regeling van de Minister van Financiën van 9 oktober 1990
      tot uitvoering van [artikel 14 van de Wet toezicht beleggingsinstellingen][ref5] (Stcrt. 198) is vrijgesteld van
      [artikel 4, eerste lid, van de Wet toezicht beleggingsinstellingen][ref6];



            f
            Euro-effecten: effecten:

              die worden overgenomen en geplaatst door een syndicaat waarvan tenminste twee leden zijn gevestigd in
      verschillende lid-staten; en
      die voor ten minste 60% worden geplaatst door syndicaatsleden die zijn gevestigd in een of meer andere staten dan
      die waar de uitgevende instelling is gevestigd; en
      waarop alleen kan worden ingeschreven of die in eerste instantie alleen kunnen worden gekocht door bemiddeling van
      een kredietinstelling of van een andere instelling die beroeps- of bedrijfsmatig een of meer van de werkzaamheden
      verricht, genoemd onder 7 en 8 van bijlage I van [Richtlijn nr. 2000/12/EG](32000L0012) van het Europees Parlement
      en de Raad van de Europese Unie van 20 maart 2000 betreffende de toegang tot en de uitoefening van de werkzaamheden
      van kredietinstellingen (PbEG L 126).


      [ref1]: https://wetten.overheid.nl/BWBR0007657
