  - number: '22'
    text: |-
      1 Onverminderd [artikel 13][ref1] wordt van [artikel 7, eerste lid, van de wet][ref2] vrijstelling verleend
      aan natuurlijke personen en rechtspersonen voor zover zij bij het als effectenbemiddelaar of vermogensbeheerder
      aanbieden of verrichten van diensten effectenorders voor rekening van cliënten aanbrengen bij een
      effecteninstelling die is aangesloten bij een organisatie als bedoeld in [artikel 9 van de wet][ref3], op grond
      van een voor de datum van inwerkingtreding van [artikel 7, eerste lid, van de wet][ref4] met die effecteninstelling
      gesloten overeenkomst.

      2 De vrijstelling, bedoeld in het eerste lid, is van toepassing tot de laatste dag van de derde kalendermaand na de
      datum van inwerkingtreding van [artikel 7, eerste lid, van de wet][ref5].

      3 In afwijking van het tweede lid blijft de vrijstelling, bedoeld in het eerste lid, van toepassing op degene
      die tijdens de in het tweede lid bedoelde periode bij de toezichthouder een aanvraag voor een vergunning heeft
      ingediend, tot de tweede dag nadat de toezichthouder zijn besluit inzake die aanvraag heeft verzonden.

      4 Aan de vrijstelling, bedoeld in het eerste lid, wordt het voorschrift verbonden dat de natuurlijke
      persoon of rechtspersoon bij het als effectenbemiddelaar of vermogensbeheerder aanbieden of verrichten van
      de in het eerste lid bedoelde diensten de voor de desbetreffende effectenbeurs te hanteren regels naleeft.
      [Artikel 20, tweede tot en met vierde lid][ref6], is van overeenkomstige toepassing.


