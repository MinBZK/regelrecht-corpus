  - number: '14'
    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan natuurlijke personen en
      rechtspersonen voor zover zij als effectenbemiddelaar of vermogensbeheerder diensten met betrekking tot niet in
      deel B van de bijlage bij de richtlijn beleggingsdiensten genoemde effecten als bedoeld in de wet aanbieden aan
      of verrichten voor natuurlijke personen of rechtspersonen die beroeps- of bedrijfsmatig handelen of beleggen in
      effecten.

      2 Onverminderd [artikel 20][ref2] wordt aan de vrijstelling, bedoeld in het eerste lid, het voorschrift verbonden
      dat de natuurlijke of rechtspersoon bij het als effectenbemiddelaar dan wel als vermogensbeheerder aanbieden of
      verrichten van de in het eerste lid bedoelde diensten de regels, bedoeld in [artikel 23][ref3] van het besluit,
      naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
