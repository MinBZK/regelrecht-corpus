  - number: '17'
    text: |-
      Van artikel 7, eerste lid, van de wet wordt vrijstelling verleend aan naamloze vennootschappen en besloten
      vennootschappen waarvan de aandelen in het kapitaal uitsluitend kunnen worden gehouden door een besloten kring
      van bloed- of aanverwanten en die bij het als vermogensbeheerder aanbieden of verrichten van diensten uitsluitend
      diensten aanbieden aan of verrichten voor de tot die kring behorende natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel17
  - number: '18'
    text: |-
      Van artikel 7, eerste lid, van de wet wordt vrijstelling verleend aan natuurlijke personen en rechtspersonen
      voor zover zij als effectenbemiddelaar ten behoeve van een beleggingsinstelling de mogelijkheid aanbieden,
      door het openen van een rekening, vorderingen te verkrijgen luidende in effecten, waarbij door middel van deze
      rekening transacties kunnen worden bewerkstelligd met betrekking tot rechten van deelneming in de betrokken
      beleggingsinstelling of in een aan die beleggingsinstelling gelieerde beleggingsinstelling, mits de natuurlijke
      persoon of de rechtspersoon is verbonden aan de beleggingsinstelling ten behoeve waarvan de bedoelde mogelijkheid
      wordt geboden.
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel18
  - number: '19'
    text: |-
      1 De houder van een gereglementeerde markt als bedoeld in artikel 22, vierde lid, van de wet die het voornemen
      heeft om in Nederland een effectenbeurs te houden, stelt de minister van dit voornemen in kennis. Deze
      inkennisstelling geschiedt, voor zover van toepassing, onder opgave van de volgende gegevens:

      a. de naam en het adres van de statutaire zetel van de houder van de effectenbeurs, alsmede het adres van haar
      hoofdkantoor indien dat afwijkt van het adres van de statutaire zetel;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van de
      effectenbeurs zijn vermeld; en

      c. de voor de effectenbeurs te hanteren regels.

      2 De houder van een effectenbeurs op wie de in artikel 22, vierde lid, van de wet bedoelde vrijstelling van
      toepassing is, stelt Onze Minister binnen vijf werkdagen in kennis van wijzigingen in de gegevens, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007777/2002-07-19#Artikel19
  - number: '20'
    text: |-
      1 Aan de vrijstelling, bedoeld in de [artikelen 12][ref1] tot en met [15][ref2], wordt het voorschrift verbonden
      dat de effecteninstelling de toezichthouder in kennis stelt van haar voornemen om een of meer van de in die
      artikelen bedoelde diensten aan te bieden of te verrichten. Deze inkennisstelling geschiedt, voor zover van
      toepassing, onder opgave van de volgende gegevens:

      a. de naam en het adres van de statutaire zetel van de effecteninstelling, alsmede het adres van haar hoofdkantoor
      indien dat afwijkt van het adres van de statutaire zetel;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van de
      effecteninstelling zijn vermeld;

      c. de identiteit van de personen, bedoeld in [artikel 10][ref3] van het besluit; en

      d. indien de voorgenomen werkzaamheden, bedoeld onder b, diensten als bedoeld in de [artikelen 12][ref4] of
      [13][ref5] betreffen, de gegevens, bedoeld onder a, van de beleggingsinstelling of effecteninstelling waarbij de
      effecteninstelling cliënten aanbrengt onderscheidenlijk van de effecteninstelling waarmee zij een overeenkomst
      heeft gesloten.

      2 Aan de vrijstelling, bedoeld in de [artikelen 12][ref6] tot en met [15][ref7], wordt het voorschrift verbonden
      dat de effecteninstelling de toezichthouder binnen vijf werkdagen in kennis stelt van wijzigingen in de gegevens,
      bedoeld in het eerste lid.

      3 Een effecteninstelling als bedoeld in [artikel 13][ref8] richt de inkennisstelling, bedoeld in het eerste
      en tweede lid, aan de houder van de desbetreffende effectenbeurs. Deze houder legt de betrokken gegevens
      onderscheidenlijk wijzigingen onverwijld aan de toezichthouder over.

      4 Aan de vrijstelling, bedoeld in de [artikelen 12][ref9] tot en met [18][ref10], wordt het voorschrift verbonden
      dat de effecteninstelling slechts gebruik mag maken van in Nederland geboden faciliteiten die de effecteninstelling
      in staat stellen transacties te verrichten op een effectenbeurs:

      a. waarvan de houder een erkenning heeft als bedoeld in [artikel 22, eerste lid, van de wet][ref11] of een
      vrijstelling of een ontheffing als bedoeld in [artikel 25, eerste lid, van de wet][ref12]; of

      b. op de houder waarvan de in [artikel 22, vierde lid, van de wet][ref13] bedoelde vrijstelling van toepassing is,

      voor zover de reikwijdte van de erkenning, ontheffing dan wel vrijstelling dit toelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007777#Artikel12
