  - number: 18a
    text: |-
      1 Van [artikel 18a, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan een instelling waarvan de
      beleggingstransacties in effecten, met uitzondering van obligaties uitgegeven door de Staat, andere overheden
      en intergouvernementele organisaties, gedurende het voorafgaande kalenderjaar ten hoogste € 20 miljoen hebben
      bedragen. Transacties in effecten waarvan het beheer is overgedragen aan een derde, op zodanige voorwaarden dat de
      instelling geen invloed heeft op de fondsselectie of op afzonderlijke effectentransacties, worden hierbij buiten
      beschouwing gelaten. Vrijstelling wordt telkens verleend met ingang van 1 december van het lopende kalenderjaar
      voor een periode van een jaar.

      2 Tot de beleggingstransacties in effecten, bedoeld in het eerste lid, worden niet gerekend:

      a. de transacties van een bijkantoor of buitenlandse dochtermaatschappij van een in Nederland gevestigde
      instelling; en

      b. de transacties van een buiten Nederland gevestigde onderneming waarvan de instelling een bijkantoor is.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel18a
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel18a
