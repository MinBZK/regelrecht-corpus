articles:
  - number: '1'
    text: |-
      In deze regeling wordt - voor zover niet anders is bepaald - verstaan onder:



            a
             wet:

              de [Wet toezicht effectenverkeer 1995][ref1];



            b
             besluit:

              het [Besluit toezicht effectenverkeer 1995][ref2];



            c
            de toezichthouder:

              de Stichting Autoriteit Financiële Markten;.



            d
             kredietinstelling:

              een onderneming of instelling die ingevolge
      [artikel 52, tweede lid, onder a, b, c of d, van de Wet toezicht kredietwezen 1992][ref3] is geregistreerd;



            e
             beleggingsinstelling:

              een onderneming of instelling die is ingeschreven in het register, bedoeld in
      [artikel 18, eerste lid, onderdeel b, van de Wet toezicht beleggingsinstellingen][ref4], dan wel is vrijgesteld
      ingevolge de [Vrijstellingsregeling Wet toezicht beleggingsinstellingen ][ref5](Stcrt. 198);



            f
             gereglementeerde markt:

              een markt als bedoeld in [artikel 1, onderdeel l, van het besluit][ref6].


