  - number: 1e
    text: |-
      1 Van [artikel 3, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het aanbieden van effecten aan
      het publiek indien:

      a. terzake van een eerdere aanbieding van dezelfde effecten aan het publiek [artikel 1b][ref2],
      [1c, tweede lid][ref3], of [1g][ref4] van toepassing was;

      b. terzake van een eerdere toelating van dezelfde effecten tot de handel op een gereglementeerde markt
      [artikel 1b, eerste lid][ref5], of [1d][ref6] van toepassing was; of

      c. terzake van een eerdere aanbieding in Nederland van dezelfde effecten aan het publiek of terzake van een eerdere
      toelating van dezelfde effecten tot de handel op een in Nederland gelegen of functionerende gereglementeerde markt
      een prospectus algemeen verkrijgbaar is gesteld dat is goedgekeurd door de toezichthouder of een toezichthoudende
      instantie van een andere lidstaat.

      2 Van [artikel 3, eerste lid, van de wet][ref7], wordt vrijstelling verleend voor het toelaten van effecten tot de
      handel op een gereglementeerde markt indien terzake van de eerdere toelating van dezelfde effecten tot de handel
      op dezelfde gereglementeerde markt een prospectus algemeen verkrijgbaar is gesteld dat is goedgekeurd door de
      toezichthouder of een toezichthoudende instantie van een andere lidstaat.

      3 Van [artikel 3, eerste lid, van de wet][ref8], wordt vrijstelling verleend voor het aan het publiek aanbieden
      van aandelen, of certificaten daarvan, indien op de toelating daarvan tot de handel op de gereglementeerde markt
      [artikel 1d, aanhef en onder a][ref9], van toepassing is en mits terzake van een eerdere toelating tot de handel op
      dezelfde gereglementeerde markt van dezelfde aandelen, of certificaten daarvan, van dezelfde categorie of klasse,
      een prospectus algemeen verkrijgbaar is gesteld dat is goedgekeurd door de toezichthouder of een toezichthoudende
      instantie van een andere lidstaat.

      4 Van [artikel 3, eerste lid, van de wet][ref10], wordt vrijstelling verleend voor het aan het publiek aanbieden
      van aandelen, of certificaten daarvan, die voortkomen uit de conversie of omruiling van andere effecten of uit de
      uitoefening van rechten verbonden aan andere effecten, indien:

      a. terzake van de aanbieding van die andere effecten aan het publiek een prospectus algemeen verkrijgbaar is
      gesteld dat is goedgekeurd door de toezichthouder of door een toezichthoudende instantie van een andere lidstaat;
      en

      b. de aan het publiek aan te bieden aandelen, of certificaten daarvan, van dezelfde categorie of klasse zijn als de
      effecten die reeds zijn aangeboden aan het publiek.


