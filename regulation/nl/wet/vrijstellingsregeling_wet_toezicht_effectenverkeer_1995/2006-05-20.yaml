  - number: '19'
    text: |-
      1 De houder van een gereglementeerde markt als bedoeld in artikel 22, vierde lid, van de wet die het voornemen
      heeft om in Nederland een effectenbeurs te houden, stelt de minister van dit voornemen in kennis. Deze
      inkennisstelling geschiedt, voor zover van toepassing, onder opgave van de volgende gegevens:

      a. de naam en het adres van de statutaire zetel van de houder van de effectenbeurs, alsmede het adres van haar
      hoofdkantoor indien dat afwijkt van het adres van de statutaire zetel;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van de
      effectenbeurs zijn vermeld; en

      c. de voor de effectenbeurs te hanteren regels.

      2 De houder van een effectenbeurs op wie de in artikel 22, vierde lid, van de wet bedoelde vrijstelling van
      toepassing is, stelt Onze Minister binnen vijf werkdagen in kennis van wijzigingen in de gegevens, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel19
  - number: '20'
    text: |-
      1 Aan de vrijstelling, bedoeld in de [artikelen 12][ref1], [14][ref2], [15][ref3] en [18][ref4], wordt het
      voorschrift verbonden dat de effecteninstelling de toezichthouder in kennis stelt van haar voornemen om een of meer
      van de in die artikelen bedoelde diensten aan te bieden of te verrichten. Deze inkennisstelling geschiedt, voor
      zover van toepassing, onder opgave van de volgende gegevens:

      a. de naam en het adres van de statutaire zetel van de effecteninstelling, alsmede het adres van haar hoofdkantoor
      indien dat afwijkt van het adres van de statutaire zetel;

      b. een programma van werkzaamheden waarin de voorgenomen werkzaamheden en de organisatiestructuur van de
      effecteninstelling zijn vermeld; en

      c. de identiteit van de personen, bedoeld in [artikel 10][ref5] van het besluit.

      2 Aan de vrijstelling, bedoeld in de [artikelen 12][ref6], [14][ref7], [15][ref8] en [18][ref9], wordt het
      voorschrift verbonden dat de effecteninstelling de toezichthouder binnen vijf werkdagen in kennis stelt van
      wijzigingen in de gegevens, bedoeld in het eerste lid.

      3 Aan de vrijstelling, bedoeld in de [artikelen 12][ref10], [14][ref11], [15][ref12] en [17][ref13], wordt het
      voorschrift verbonden dat de effecteninstelling slechts gebruik mag maken van in Nederland geboden faciliteiten die
      de effecteninstelling in staat stellen transacties te verrichten op een effectenbeurs:

      a. waarvan de houder een erkenning heeft als bedoeld in [artikel 22, eerste lid, van de wet][ref14] of een
      vrijstelling of een ontheffing als bedoeld in [artikel 25, eerste lid, van de wet][ref15]; of

      b. op de houder waarvan de in [artikel 22, vierde lid, van de wet][ref16] bedoelde vrijstelling van toepassing is,

      voor zover de reikwijdte van de erkenning, ontheffing dan wel vrijstelling dit toelaat.


