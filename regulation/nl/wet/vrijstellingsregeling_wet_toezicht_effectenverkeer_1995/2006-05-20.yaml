  - number: 1g
    text: |-
      Van [artikel 3, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het aanbieden van
      effecten aan het publiek indien de effecten worden aangeboden aan een persoon, niet zijnde een
      professionele marktpartij, die een schriftelijke overeenkomst van lastgeving heeft afgesloten met een
      vermogensbeheerder, als bedoeld in [artikel 1, onderdeel c van de wet][ref2], die beschikt over een
      vergunning op grond van [artikel 7, vierde lid][ref3], of is uitgezonderd van de vergunningplicht op grond van
      [artikel 7, tweede lid, onder h, i, of j, van de wet][ref4], op grond waarvan is bepaald dat de volmachtgever geen
      invloed kan uitoefenen op transacties die de vermogensbeheerder als gevolmachtigde verricht of bewerkstelligt.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref4]: https://wetten.overheid.nl/BWBR0007657#Artikel7
