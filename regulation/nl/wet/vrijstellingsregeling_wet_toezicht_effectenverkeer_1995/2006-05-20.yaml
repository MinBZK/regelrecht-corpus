        artikel: 1a
  - number: 1i
    text: |-
      1 Van [artikel 3, vierde lid, van de wet][ref1], wordt vrijstelling verleend voor het aanbieden of het in het
      vooruitzicht stellen van een aanbieding:

      a. van effecten die tot de handel op een op grond van [artikel 22 van de wet][ref2] erkende effectenbeurs dan wel
      op een buiten Nederland gevestigde en van overheidswege toegelaten effectenbeurs zijn toegelaten of zullen worden
      toegelaten; of

      b. van effecten aan bestuurders, leden van de raad van commissarissen of werknemers van de uitgevende instelling
      van die effecten, of aan bestuurders, leden van de raad van commissarissen of werknemers van een met die uitgevende
      instelling in een groep verbonden rechtspersoon, vennootschap of instelling.

      2 Het verbod, bedoeld in [artikel 3, vierde lid, van de wet][ref3], is niet van toepassing voorzover terzake van
      een eerdere aanbieding van dezelfde effecten een prospectus algemeen verkrijgbaar is gesteld dat voldoet aan het in
      [hoofdstuk 2 van het besluit][ref4] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0007708#HoofdstukII
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel1i
