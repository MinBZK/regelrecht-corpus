  - number: 23c
    text: |-
      1 Van [artikel 3, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het aanbieden van effecten aan
      het publiek als bedoeld in [artikel 1a, tweede lid][ref2], indien terzake van een eerdere aanbieding van dezelfde
      effecten aan het publiek in Nederland of terzake van een eerdere toelating van dezelfde effecten tot de handel op
      een in Nederland gelegen of functionerende gereglementeerde markt, als bedoeld in [artikel 1, onderdeel f][ref3],
      een prospectus algemeen verkrijgbaar is gesteld dat voldeed aan het recht zoals dat gold ten tijde van die eerdere
      aanbieding of toelating, en:

      a. terzake van die eerdere aanbieding of toelating aan de overige toepasselijke wettelijke vereisten is voldaan; en

      b. die eerdere aanbieding of toelating voor 1 juli 2005 is geëindigd of voltooid.

      2 Van [artikel 3, eerste lid, van de wet][ref4], wordt vrijstelling verleend voor het toelaten van effecten tot
      de handel op een gereglementeerde markt als bedoeld in [artikel 1, onderdeel f][ref5], indien terzake van een
      eerdere toelating van dezelfde effecten tot de handel op dezelfde gereglementeerde markt een prospectus algemeen
      verkrijgbaar is gesteld dat voldeed aan het recht zoals dat gold ten tijde van die eerdere toelating, en:

      a. terzake van die eerdere toelating aan de overige toepasselijke wettelijke vereisten is voldaan; en

      b. die eerdere toelating voor 1 juli 2005 is voltooid.

      3 Van [artikel 3, eerste lid, van de wet][ref6], wordt vrijstelling verleend voor het aan het publiek
      aanbieden als bedoeld in [artikel 1a, tweede lid][ref7], van aandelen, of certificaten daarvan, indien op de
      toelating daarvan tot de handel op de gereglementeerde markt als bedoeld in [artikel 1, onderdeel f][ref8],
      [artikel 1d, aanhef en onder a][ref9], van toepassing is en terzake van een eerdere toelating tot de handel op
      dezelfde gereglementeerde markt van tot diezelfde categorie of klasse behorende aandelen of certificaten een
      prospectus algemeen verkrijgbaar is gesteld dat voldeed aan het recht zoals dat gold ten tijde van die eerdere
      toelating, en:

      a. terzake van die eerdere toelating aan de overige toepasselijke wettelijke vereisten is voldaan; en

      b. die eerdere toelating voor 1 juli 2005 is voltooid.


