  - number: '2'
    text: |-
      1 Van [artikel 3, vierde lid, van de wet][ref1] wordt vrijstelling verleend indien een aanbod dan wel een in het
      vooruitzicht gesteld aanbod uitsluitend is gericht tot natuurlijke personen of rechtspersonen die beroeps- of
      bedrijfsmatig handelen of beleggen in effecten, of die wordt gecombineerd met een aanbieding van effecten die van
      [artikel 3, vierde lid, van de wet][ref2] is vrijgesteld op grond van het in deze paragraaf bepaalde.

      2 Aan de vrijstelling, bedoeld in het eerste lid, wordt het voorschrift verbonden dat in het aanbod dan wel in het
      informatiememorandum alsmede in advertenties en documenten waarin het aanbod in het vooruitzicht wordt gesteld,
      wordt vermeld dat het aanbod uitsluitend is onderscheidenlijk zal zijn gericht tot de in het eerste lid bedoelde
      personen, dan wel dat het aanbod wordt gecombineerd met een of meerdere vrijstellingen uit deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '3'
  - number: 2a
    text: |-
      Van [artikel 3, vierde lid, van de wet][ref1] wordt vrijstelling verleend voor het aanbieden, of het in het
      vooruitzicht stellen van een aanbieding, van effecten aan minder dan 100 natuurlijke personen of rechtspersonen,
      niet zijnde natuurlijke personen of rechtspersonen als bedoeld in [artikel 2, eerste lid][ref2], per staat.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007777#Artikel2
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel2a
    references:
