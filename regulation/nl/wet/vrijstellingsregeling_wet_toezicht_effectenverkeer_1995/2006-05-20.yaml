  - number: '17'
    text: |-
      Van artikel 7, eerste lid, van de wet wordt vrijstelling verleend aan naamloze vennootschappen en besloten
      vennootschappen waarvan de aandelen in het kapitaal uitsluitend kunnen worden gehouden door een besloten kring
      van bloed- of aanverwanten en die bij het als vermogensbeheerder aanbieden of verrichten van diensten uitsluitend
      diensten aanbieden aan of verrichten voor de tot die kring behorende natuurlijke personen.
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel17
  - number: '18'
    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan beheerders van
      beleggingsinstellingen als bedoeld in [artikel 6, vierde lid, van de Wet toezicht beleggingsinstellingen][ref2]. Op
      deze beheerders zijn de [artikelen 24 tot en met 32a van het besluit][ref3] van overeenkomstige toepassing.

      2 Van [artikel 7, eerste lid, van de wet][ref4] wordt vrijstelling verleend aan
      beheerders van beleggingsinstellingen als bedoeld in [17a, eerste lid][ref5], of
      [17b van de Wet toezicht beleggingsinstellingen][ref6]. Op deze beheerders is [artikel 43 van het besluit][ref7]
      van overeenkomstige toepassing.


