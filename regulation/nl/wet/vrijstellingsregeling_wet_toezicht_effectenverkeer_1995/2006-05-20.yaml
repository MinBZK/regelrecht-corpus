  - number: 23a
    text: |-
      1 Het verbod, bedoeld in artikel 7, eerste lid, van de wet, is tot de eerste dag van de derde kalendermaand na het
      tijdstip van inwerkingtreding van deze regeling niet van toepassing op natuurlijke personen en rechtspersonen die
      op dat tijdstip op grond van artikel 18 van deze regeling waren vrijgesteld van het verbod.

      2 Het eerste lid blijft na afloop van de in dat lid bedoelde periode van toepassing op de natuurlijke persoon of
      rechtspersoon die voor het einde van die periode een aanvraag voor een vergunning als bedoeld in artikel 7 van de
      wet heeft ingediend, tot het tijdstip waarop onherroepelijk op diens aanvraag is beslist.
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel23a
  - number: 23b
    text: |-
      1 Van [artikel 3, eerste lid, van de wet][ref1] wordt tot 30 juni 2006 vrijstelling verleend voor het aanbieden van
      effecten aan het publiek als bedoeld in [artikel 1a, tweede lid][ref2], alsmede voor het toelaten van die effecten
      tot de handel op een gereglementeerde markt als bedoeld in [artikel 1, onderdeel f][ref3], indien het aanbieden
      van effecten aan het publiek voor het tijdstip van inwerkingtreding van dit artikel is aangevangen en op dat
      tijdstip nog niet is geëindigd en terzake van de aanbieding van de effecten aan het publiek een prospectus algemeen
      verkrijgbaar is gesteld dat voldeed aan het recht zoals dat gold voor dat tijdstip.

      2 Ten aanzien van een in het eerste lid bedoelde aanbieding van effecten aan het publiek en, voor zover van
      toepassing, de toelating van die effecten tot de handel op een gereglementeerde markt blijft tot 30 juni
      2006 het recht van toepassing zoals dat gold voor het tijdstip van inwerkingtreding van dit artikel, tenzij
      de toezichthouder of de toezichthoudende instantie van een andere lidstaat met betrekking tot die aanbieding
      of toelating na dat tijdstip een prospectus heeft goedgekeurd op grond van [artikel 1b][ref4], [1c][ref5] of
      [1d van het besluit][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
