        artikel: 18a
  - number: 18b
    text: |-
      Van [artikel 18a, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan:

      a. een instelling als bedoeld in [artikel 7, tweede lid, onder a, van de wet][ref2] waarop
      [artikel 20 van de Wet toezicht verzekeringsbedrijf 1993][ref3] van toepassing is;

      b. een instelling als bedoeld in [artikel 7, tweede lid, onder f, van de wet][ref4] die is vrijgesteld
      van de in [artikel 4, eerste en tweede lid, van de Wet toezicht beleggingsinstellingen][ref5]
      vervatte verboden en die niet is vrijgesteld op grond van [artikel 1][ref6] of
      [artikel 2b, eerste lid, onderdeel b of c, van de Vrijstellingsregeling Wet toezicht beleggingsinstellingen][ref7];

      c. een kredietinstelling die is vrijgesteld van [artikel 6, eerste lid][ref8], [artikel 31, eerste lid][ref9],
      [artikel 32, eerste lid][ref10] of [artikel 38, eerste lid, van de Wet toezicht kredietwezen 1992][ref11].


