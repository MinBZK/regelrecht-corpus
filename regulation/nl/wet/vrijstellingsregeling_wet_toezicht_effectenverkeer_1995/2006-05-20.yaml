        bwb_id: BWBR0007657
        artikel: '3'
  - number: '6'
    text: |-
      Van [artikel 3, vierde, van de wet][ref1] wordt vrijstelling verleend indien een aanbod dan wel een in het
      vooruitzicht gesteld aanbod betrekking heeft op schuldbrieven, inschrijvingen in schuldregisters en soortgelijke
      rechten, die een oorspronkelijke looptijd van ten hoogste een jaar hebben en die worden uitgegeven door een
      kredietinstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
  - number: '7'
    text: |-
      Van [artikel 3, vierde lid, van de wet][ref1], wordt vrijstelling verleend voor het aanbieden of het in het
      vooruitzicht stellen van een aanbieding van rechten van deelneming in een beleggingsinstelling die niet op verzoek
      van de houder ten laste van de activa direct of indirect worden ingekocht of terugbetaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
  - number: '8'
    text: |-
      Van [artikel 3, vierde lid, van de wet][ref1] wordt vrijstelling verleend indien een aanbod dan wel een in het
      vooruitzicht gesteld aanbod betrekking heeft op effecten die worden uitgegeven door een lid-staat, door een
      territoriaal publiekrechtelijk lichaam van een lid-staat of door een internationale publiekrechtelijke instelling
      waarin een of meer lid-staten deelnemen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel8
    references:
