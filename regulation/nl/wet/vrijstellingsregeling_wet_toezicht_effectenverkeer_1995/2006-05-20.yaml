  - number: '21'
    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan in Nederland gevestigde natuurlijke
      personen en rechtspersonen die zijn aangesloten bij een organisatie waarvan de leden toegang hebben tot een
      gereglementeerde markt als bedoeld in artikel 1, onder 13, van de richtlijn beleggingsdiensten waarvan de houder
      in een andere lid-staat is gevestigd, voor zover zij als effectenbemiddelaar of vermogensbeheerder diensten
      aanbieden of verrichten die betrekking hebben op effecten die zijn toegelaten tot de notering aan de desbetreffende
      gereglementeerde markt.

      2 De vrijstelling, bedoeld in het eerste lid, is van toepassing tot de laatste dag van de derde kalendermaand na de
      datum van inwerkingtreding van [artikel 7, eerste lid, van de wet][ref2].

      3 In afwijking van het tweede lid blijft de vrijstelling, bedoeld in het eerste lid, van toepassing op degene
      die tijdens de in het tweede lid bedoelde periode bij de toezichthouder een aanvraag voor een vergunning heeft
      ingediend, tot de tweede dag nadat de toezichthouder zijn besluit inzake die aanvraag heeft verzonden.

      4 Aan de vrijstelling, bedoeld in het eerste lid, wordt het voorschrift verbonden dat de natuurlijke persoon
      of rechtspersoon bij het als effectenbemiddelaar of vermogensbeheerder aanbieden of verrichten van de in het
      eerste lid bedoelde diensten de voor de desbetreffende gereglementeerde markt te hanteren regels naleeft.
      [Artikel 20, tweede lid en vierde lid][ref3], aanhef en onder b, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0007777#Artikel20
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel21
