  - number: 1h
    text: |-
      1 Deze paragraaf is uitsluitend van toepassing op het aanbieden, of het in het vooruitzicht stellen van een
      aanbieding, van effecten die geen effecten zijn als bedoeld in [artikel 1a, onderdeel d, van het besluit][ref1].

      2 Ter zake van een aanbieding van effecten kunnen meerdere van de in deze paragraaf opgenomen vrijstellingen
      gelijktijdig van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007708#Artikel1a
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel1h
