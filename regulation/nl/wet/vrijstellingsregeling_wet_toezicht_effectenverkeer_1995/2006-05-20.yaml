  - number: '23'
    text: |-
      1 Onverminderd [artikel 14][ref1] wordt van [artikel 7, eerste lid, van de wet][ref2] vrijstelling verleend aan
      natuurlijke personen en rechtspersonen voor zover zij als effectenbemiddelaar of vermogensbeheerder diensten
      aanbieden aan of verrichten voor natuurlijke personen of rechtspersonen die beroeps- of bedrijfsmatig handelen
      of beleggen in effecten, indien zij deze diensten ook reeds aanboden aan dan wel verrichtten voor de betrokken
      personen voor de datum van inwerkingtreding van [artikel 7, eerste lid, van de wet][ref3] en uit dien hoofde waren
      opgenomen in het register, bedoeld in [artikel 15 van de Wet][ref4] toezicht effectenverkeer.

      2 De vrijstelling, bedoeld in het eerste lid, is van toepassing tot de laatste dag van de derde kalendermaand na de
      datum van inwerkingtreding van [artikel 7, eerste lid, van de wet][ref5].

      3 In afwijking van het tweede lid blijft de vrijstelling, bedoeld in het eerste lid, van toepassing op degene
      die tijdens de in het tweede lid bedoelde periode bij de toezichthouder een aanvraag voor een vergunning heeft
      ingediend, tot de tweede dag nadat de toezichthouder zijn besluit inzake die aanvraag heeft verzonden.

      4 Aan de vrijstelling, bedoeld in het eerste lid, wordt het voorschrift verbonden dat de natuurlijke
      persoon of rechtspersoon bij het als effectenbemiddelaar of vermogensbeheerder aanbieden of verrichten van
      de in het eerste lid bedoelde diensten de regels, bedoeld in [artikel 23][ref6] van het besluit, naleeft.
      [Artikel 20, tweede en vierde lid][ref7], is van overeenkomstige toepassing.


