  - number: 1f
    text: |-
      1 In het register, bedoeld in [artikel 4, derde lid, van de wet][ref1], worden ingeschreven:

      a. rechtspersonen of vennootschappen met zetel in Nederland anders dan bedoeld in
      [artikel 1a, derde lid, onderdeel d][ref2], die de toezichthouder hebben verzocht om als professionele marktpartij
      te worden aangemerkt;

      b. natuurlijke personen met woonplaats in Nederland die de toezichthouder hebben verzocht om als professionele
      marktpartij te worden aangemerkt en die aan ten minste twee van de volgende drie criteria voldoen:

      1°. in de loop van de vier voorafgaande kwartalen heeft de natuurlijke persoon ten minste tien omvangrijke
      transacties per kwartaal op de financiële markten verricht;

      2°. de natuurlijke persoon heeft een effectenportefeuille met een omvang van ten minste € 500.000;

      3°. de natuurlijke persoon is ten minste een jaar werkzaam geweest in de financiële sector in het kader van een
      beroepsbezigheid die kennis van beleggingen in effecten vereist.

      2 Aan uitgevende instellingen, als bedoeld in [artikel 1, onderdeel b][ref3], van het besluit en degene die
      voornemens is een aanbieding van effecten te doen wordt desgevraagd, tegen betaling van de kostprijs, inzage
      verleend in het register of afschrift verstrekt uit het register.

      3 De toezichthouder draagt onverwijld zorg voor de doorhaling in het register van een inschrijving, indien een
      ingeschrevene, rechtsopvolger of erfgenaam daarvan, daarom verzoekt.

      4 Met het oog op de adequate werking van de financiële markten kan de toezichthouder een inschrijving in het
      register doorhalen.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007777#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0007777#Artikel1
