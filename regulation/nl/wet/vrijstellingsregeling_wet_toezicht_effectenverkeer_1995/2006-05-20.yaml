  - number: 1a
    text: |-
      1 Deze paragraaf is uitsluitend van toepassing op effecten als bedoeld in
      [artikel 1a, onderdeel d, van het besluit][ref1].

      2 Voor de toepassing van deze paragraaf wordt verstaan onder aanbieden van effecten aan het publiek: aanbieden van
      effecten aan het publiek als bedoeld in [artikel 1a, onderdeel a, van het besluit][ref2].

      3 Voor de toepassing van deze paragraaf wordt verstaan onder professionele marktpartij:

      a. een ieder die onder toezicht staat van de toezichthoudende autoriteit bedoeld in
      [artikel 1, onderdeel e, van het besluit][ref3], of van een toezichthoudende instantie van een andere staat om op
      de financiële markten actief te mogen zijn;

      b. een ieder die, anderszins een gereglementeerde activiteit op de financiële markten uitoefent;

      c. de Staat der Nederlanden, tot de centrale overheid behorende buitenlands overheidslichamen,
      de Nederlandsche Bank N.V., buitenlandse centrale banken, openbare lichamen als bedoeld in
      [artikel 1, onderdeel a, van de Wet financiering decentrale overheden][ref4] dan wel daarmee vergelijkbare
      buitenlandse decentrale overheidslichamen, internationale en supranationale instellingen;

      d. een rechtspersoon of vennootschap die volgens de meest recente jaarrekening of geconsolideerde jaarrekening aan
      ten minste twee van de volgende drie criteria voldoet:

      1°. een gemiddeld aantal werknemers gedurende het boekjaar van 250 of meer;

      2°. een waarde van de activa volgens de balans van ten minste € 43 miljoen;

      3°. een jaarlijkse netto-omzet van ten minste € 50 miljoen;

      e. een rechtspersoon, vennootschap of natuurlijke persoon als bedoeld in [artikel 1f, eerste lid][ref5];

      f. een rechtspersoon of vennootschap met als enig ondernemingsdoel het beleggen in effecten;

      g. rechtspersonen of vennootschappen die speciaal zijn opgericht voor het verrichten van transacties tot het
      verkrijgen van activa als bedoeld in [artikel 364 van Boek 2 van het Burgerlijk Wetboek][ref6] die strekken tot
      zekerheid van aangeboden of aan te bieden effecten, voor zover zij zodanige transacties verrichten.


