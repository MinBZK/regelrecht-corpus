        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007777
        artikel: '2'
        hoofdstuk: II
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Van [artikel 3, vierde lid, van de wet][ref1] wordt vrijstelling verleend voor het doen of het in het
      vooruitzicht stellen van een aanbieding die uitsluitend is gericht tot personen die buiten Nederland gevestigd
      of woonachtig zijn dan wel hun gewone verblijfplaats hebben buiten Nederland of die wordt gecombineerd met een
      aanbieding van effecten die van [artikel 3, vierde lid, van de wet][ref2] is vrijgesteld op grond van het in deze
      paragraaf bepaalde.

      2 Aan de vrijstelling, bedoeld in het eerste lid, worden de volgende voorschriften verbonden:

      a. in het aanbod dan wel in het informatiememorandum waarin het aanbod wordt gedaan alsmede in advertenties en
      documenten waarin het aanbod in het vooruitzicht wordt gesteld wordt vermeld tot wie het aanbod is gericht;

      b. ter zake van het aanbod dan wel van het informatiememorandum waarin het aanbod wordt gedaan alsmede van
      advertenties en documenten waarin het aanbod in het vooruitzicht wordt gesteld, wordt voldaan aan bij of krachtens
      wettelijk voorschrift gestelde regels van de staat waarin de personen tot wie het aanbod is onderscheidenlijk zal
      zijn gericht, gevestigd dan wel woonachtig zijn of hun gewone verblijfplaats hebben;

      c. een verklaring van de uitgevende instelling dat is voldaan aan de regels, bedoeld onder b, wordt voorafgaand aan
      het aanbod aan de toezichthouder overgelegd;

      d. de verklaring, bedoeld onder c, wordt opgenomen in het onder a bedoelde informatiememorandum waarin het aanbod
      wordt gedaan en in de onder a bedoelde advertenties en documenten.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '3'
  - number: '4'
    text: |-
      Van [artikel 3, vierde lid, van de wet][ref1] wordt vrijstelling verleend indien de effecten worden aangeboden in
      coupures ter waarde van ten minste € 50 000 of de tegenwaarde daarvan in vreemde valuta.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
  - number: 4a
    text: |-
      1 Van [artikel 3, vierde lid, van de wet][ref1] wordt vrijstelling verleend indien de effecten die worden
      aangeboden slechts kunnen worden verkregen als pakket tegen een waarde van ten minste € 50 000 of de tegenwaarde
      daarvan in vreemde valuta.

      2 Aan de vrijstelling, bedoeld in het eerste lid, worden de volgende voorschriften verbonden:

      a. in het aanbod dan wel in het informatiememorandum waarin het aanbod wordt gedaan alsmede in advertenties en
      documenten waarin het aanbod in het vooruitzicht wordt gesteld, wordt vermeld dat de effecten uitsluitend worden
      aangeboden als pakket tegen een waarde van tenminste € 50 000;

      b. een afschrift van het informatiememorandum waarin het aanbod wordt gedaan alsmede afschriften van de
      advertenties en documenten waarin het aanbod in het vooruitzicht wordt gesteld, worden voorafgaand aan de
      aanbieding aan de toezichthouder overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '3'
  - number: '5'
    text: |-
      Van [artikel 3, vierde lid, van de wet][ref1] wordt vrijstelling verleend indien de effecten worden aangeboden
      om niet.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
    url: https://wetten.overheid.nl/BWBR0007777/2006-05-20#Artikel5
    references:
