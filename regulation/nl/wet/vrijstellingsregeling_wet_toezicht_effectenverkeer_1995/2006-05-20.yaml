        artikel: '3'
  - number: '9'
    text: |-
      1 Van de op grond van [artikel 5, eerste lid, van de wet][ref1] gestelde regels wordt vrijstelling verleend aan de
      uitgevende instelling waarvan uitsluitend effecten, als bedoeld in [artikel 1a, eerste lid][ref2], zijn aangeboden
      in een aanbieding van effecten aan het publiek als bedoeld in [artikel 1a, tweede lid,][ref3] die ingevolge
      [artikel 1b][ref4], [1c][ref5], [1e, eerste lid, aanhef en onder a en c][ref6], of [1g][ref7] is vrijgesteld van
      [artikel 3, eerste lid, van de wet][ref8].

      2 Van de op grond van [artikel 5, eerste lid, van de wet][ref9] gestelde regels wordt vrijstelling verleend aan de
      uitgevende instelling waarvan uitsluitend effecten, als bedoeld in [artikel 1a, eerste lid][ref10], zijn aangeboden
      in een aanbieding van effecten aan het publiek als bedoeld in [artikel 1a, tweede lid][ref11], vanuit Nederland.


