  - number: 18c
    text: |-
      Van [artikel 18a, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan:

      a. een instelling als bedoeld in [artikel 7, tweede lid, onder a, van de wet][ref2] met zetel buiten Nederland, die
      diensten verricht in Nederland;

      b. een buiten Nederland gevestigde kredietinstelling of financiële instelling als bedoeld in
      [artikel 1, onderdeel a, onder 1°, onderscheidenlijk onderdeel c, van de Wet toezicht kredietwezen 1992][ref3],
      niet zijnde een instelling als bedoeld in [artikel 7, tweede lid, onder h][ref4], die diensten verricht in
      Nederland;

      c. een instelling als bedoeld in [artikel 7, tweede lid, onder f][ref5], met zetel buiten
      Nederland, die haar rechten van deelneming in Nederland aanbiedt in overeenstemming met
      [artikel 17 van de Wet toezicht beleggingsinstellingen][ref6].


