    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan degene die op naam
      en voor rekening van cliënten orders doorgeeft aan een effecteninstelling waaraan een vergunning als
      bedoeld in [artikel 7, eerste lid, van de wet][ref2] is verleend of een effecteninstelling als bedoeld in
      [artikel 7, tweede lid, onderdelen h, i, of j, van de wet][ref3] voorzover dat gebeurt in het kader van
      werkzaamheden waarvan het verrichten hem is toegestaan op grond van de [Wet financiële dienstverlening][ref4].

      2 Aan de vrijstelling, bedoeld in het eerste lid, worden de volgende voorschriften verbonden:

      a. door of namens de effectenbemiddelaar worden geen transacties uitgevoerd voor rekening van cliënten met een
      zodanige frequentie of van een zodanige omvang dat dit gezien de omstandigheden kennelijk slechts strekt tot
      bevoordeling van de effectenbemiddelaar;

      b. de effectenbemiddelaar onthoudt zich van het in rekening brengen van onevenredig hoge commissies of andere
      vergoedingen.

      [Artikel 16 van het besluit][ref5] is van overeenkomstige toepassing.


