  - number: 1c
    text: |-
      1 Van [artikel 3, eerste lid, van de wet][ref1], wordt vrijstelling verleend aan een aanbieding van effecten aan
      het publiek indien:

      a. de effecten worden aangeboden aan professionele marktpartijen;

      b. de effecten in Nederland worden aangeboden aan minder dan 100 natuurlijke personen of rechtspersonen, niet
      zijnde professionele marktpartijen;

      c. de aangeboden effecten slechts kunnen worden verworven tegen een tegenwaarde van ten minste € 50.000 per
      belegger;

      d. de nominale waarde van de aangeboden effecten per effect ten minste € 50.000 bedraagt; of

      e. de effecten deel uitmaken van een aanbieding waarbij de totale tegenwaarde van de aanbieding van effecten aan
      het publiek minder dan € 100.000 bedraagt, welk grensbedrag berekend wordt over een periode van twaalf maanden.

      2 Het verbod, bedoeld in [artikel 3, eerste lid, van de wet][ref2] is niet van toepassing op het aanbieden aan het
      publiek van de volgende categorieën effecten:

      a. aandelen of certificaten daarvan uitgegeven ter vervanging van reeds uitgegeven aandelen of certificaten
      daarvan van dezelfde categorie of klasse, indien de uitgifte van deze nieuwe waardebewijzen geen verhoging van het
      geplaatst kapitaal tot gevolg heeft;

      b. effecten die worden aangeboden bij een overname door middel van een openbaar bod tot ruil, indien een document
      algemeen verkrijgbaar is dat informatie bevat die gelijkwaardig is aan de informatie die het prospectus bevat;

      c. effecten die worden aangeboden of toegewezen dan wel toe te wijzen zijn bij een fusie of splitsing, indien een
      document beschikbaar is dat informatie bevat die gelijkwaardig is aan de informatie die het prospectus bevat;

      d. aandelen of certificaten daarvan die kosteloos worden aangeboden, toegewezen of zullen worden toegewezen aan de
      aandeelhouders, en dividenden die worden uitgekeerd in de vorm van aandelen of certificaten daarvan van dezelfde
      categorie of klasse als de waardebewijzen waarop de dividenden worden uitgekeerd, indien een document beschikbaar
      wordt gesteld dat informatie bevat over het aantal aangeboden waardebewijzen, de kenmerken van de waardebewijzen,
      de redenen voor de aanbieding en de bijzonderheden daarvan; of

      e. effecten die door een werkgever waarvan effecten reeds tot de handel op een gereglementeerde markt zijn
      toegelaten, of door een met die werkgever in een groep verbonden rechtspersoon, vennootschap of instelling, worden
      aangeboden of toegewezen dan wel toe te wijzen zijn aan huidige of voormalige bestuurders, huidige of voormalige
      leden van de raad van commissarissen of huidige of voormalige werknemers, indien een document beschikbaar wordt
      gesteld dat informatie bevat over het aantal aangeboden effecten, de kenmerken van de effecten, de redenen voor de
      aanbieding en de bijzonderheden daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel3
