  - number: 23d
    text: |-
      Van de op grond van [artikel 5, eerste lid, van de wet][ref1] gestelde regels wordt vrijstelling verleend aan een
      uitgevende instelling waarvan voor 1 juli 2005 uitsluitend effecten zijn aangeboden in een aanbieding van effecten
      aan het publiek als bedoeld in [artikel 1a, tweede lid][ref2], indien de uitgevende instelling terzake van die
      aanbieding op grond van het recht zoals dat gold voor dat tijdstip was vrijgesteld van de regels die betrekking
      hebben op periodieke verslaggeving inzake de financiële positie van de uitgevende instelling alsmede op feiten
      omtrent de uitgevende instelling waarvan een aanzienlijke invloed op de koers van de effecten van de uitgevende
      instelling kan uitgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0007777#Artikel1a
