    text: |-
      1 Van [artikel 7, eerste lid, van de wet][ref1] wordt vrijstelling verleend aan natuurlijke personen en
      rechtspersonen voor zover zij bij het als effectenbemiddelaar aanbieden of verrichten van diensten cliënten
      aanbrengen bij:

      a. een beleggingsinstelling die is ingeschreven in het register bedoeld in
      [artikel 18, eerste lid, onderdeel b, of onderdeel e, van de Wet toezicht beleggingsinstellingen][ref2], dan wel is
      vrijgesteld ingevolge de [Vrijstellingsregeling Wet toezicht beleggingsinstellingen][ref3];

      b. een beheerder die is ingeschreven in het register, bedoeld in
      [artikel 18, eerste lid, onderdeel a of onderdeel c, van de Wet toezicht beleggingsinstellingen][ref4], dan wel is
      vrijgesteld ingevolge de [Vrijstellingsregeling Wet toezicht beleggingsinstellingen][ref5] (Stcrt. 198);

      c. een effecteninstelling die ingevolge een vergunning als bedoeld in [artikel 7, eerste lid, van de wet][ref6] of
      ingevolge [artikel 7, tweede lid][ref7], [aanhef en onder h, i of j, van de wet](onbekend) als effectenbemiddelaar
      of vermogensbeheerder diensten mag aanbieden of verrichten; of

      d. een effecteninstelling die ingevolge de [artikelen 14][ref8], [15][ref9], [16][ref10] of [17][ref11] is
      vrijgesteld van [artikel 7, eerste lid, van de wet][ref12].

      2 Onverminderd [artikel 20][ref13] wordt aan de vrijstelling, bedoeld in het eerste lid, het voorschrift
      verbonden dat de natuurlijke persoon of rechtspersoon bij het als effectenbemiddelaar aanbieden of verrichten
      van de in het eerste lid bedoelde diensten de regels, bedoeld in [artikel 24 van het besluit][ref14], naleeft.
      [Artikel 26, eerste lid, van het besluit][ref15] is van overeenkomstige toepassing.


