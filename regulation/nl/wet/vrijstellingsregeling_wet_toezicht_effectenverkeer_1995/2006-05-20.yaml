  - number: 1b
    text: |-
      1 Van [artikel 3, eerste lid, van de wet][ref1], wordt vrijstelling verleend indien het een aanbieding van effecten
      aan het publiek of een toelating van effecten tot de handel op een gereglementeerde markt betreft van:

      a. effecten zonder aandelenkarakter als bedoeld in [artikel 1a, onderdeel f, van het besluit][ref2] die worden
      uitgegeven door een lidstaat of een decentraal overheidslichaam van een lidstaat, een openbare internationale
      instelling waarbij een of meer lidstaten aangesloten zijn, de Europese Centrale Bank of een centrale bank van een
      lidstaat;

      b. aandelen in het kapitaal van een centrale bank van een lidstaat;

      c. effecten die onvoorwaardelijk en onherroepelijk gegarandeerd zijn door een lidstaat of door een van de
      decentrale overheidslichamen van een lidstaat;

      d. effecten die zijn uitgegeven door een vereniging als bedoeld in
      [artikel 26 van Boek 2 van het Burgerlijk Wetboek][ref3], of door een instelling zonder winstoogmerk, met het oog
      op het verwerven van de middelen die nodig zijn om haar niet commerciële doelen te verwezenlijken;

      e. effecten zonder aandelenkarakter als bedoeld in [artikel 1a, onderdeel f, van het besluit][ref4] die worden
      uitgegeven door een kredietinstelling, indien deze effecten:

      1°. doorlopend worden aangeboden aan het publiek of onderdeel uitmaken van aanbiedingen aan het publiek of
      toelatingen tot de handel op een gereglementeerde markt waarbij over een periode van twaalf maanden sprake is van
      ten minste twee afzonderlijke aanbiedingen of toelatingen van effecten van eenzelfde categorie of klasse;

      2°. niet achtergesteld, converteerbaar of omwisselbaar zijn;

      3°. geen recht geven tot het inschrijven op of verwerven van andere categorieën effecten en niet aan een derivaat
      gekoppeld zijn;

      4°. de ontvangst van terugbetaalbare deposito's belichamen;

      5°. gedekt zijn door een depositogarantiestelsel dat valt onder [richtlijn nr. 94/19/EG](31994L0019) van het
      Europees Parlement en de Raad van de Europese Unie van 30 mei 1994 inzake de depositogarantiestelsels (PbEG L 135);
      of

      f. effecten zonder aandelenkarakter die worden uitgegeven door een kredietinstelling als bedoeld in
      [artikel 1, onderdeel d][ref5], waarbij de totale tegenwaarde van de aanbieding minder dan € 50 miljoen bedraagt,
      welk grensbedrag wordt berekend over een periode van twaalf maanden, indien deze effecten:

      1°. doorlopend worden aangeboden aan het publiek of onderdeel uitmaken van aanbiedingen aan het publiek of
      toelatingen tot de handel op een gereglementeerde markt waarbij over een periode van twaalf maanden sprake is van
      ten minste twee afzonderlijke aanbiedingen of toelatingen van effecten van eenzelfde categorie of klasse;

      2°. niet achtergesteld, converteerbaar of omwisselbaar zijn; en

      3°. geen recht geven tot het inschrijven op of verwerven van andere categorieën effecten en niet aan een derivaat
      gekoppeld zijn.

      2 Van [artikel 3, eerste lid, van de wet][ref6], wordt vrijstelling verleend indien het effecten
      betreft die deel uitmaken van een aanbieding van effecten aan het publiek in Nederland waarbij de totale
      tegenwaarde van de aanbieding, berekend over een periode van twaalf maanden, minder dan € 2,5 miljoen
      bedraagt, tenzij de effecten rechten van deelneming betreffen in een beleggingsinstelling als bedoeld in
      [artikel 1, onderdeel c, van de Wet toezicht beleggingsinstellingen][ref7], die niet op verzoek van de houder ten
      laste van de activa direct of indirect worden ingekocht of terugbetaald.

      3 Terzake van een aanbieding van effecten aan het publiek of een toelating van effecten tot de handel op een
      gereglementeerde markt, als bedoeld in het eerste lid, onderdeel a, c, of f, of een aanbieding van effecten aan
      het publiek als bedoeld in het tweede lid, kan degene die de aanbieding doet of de aanvrager van de toelating
      tot de handel, onverminderd het bepaalde in het eerste lid, aan de toezichthouder om een verklaring als bedoeld
      in [artikel 1f, eerste lid][ref8], van het besluit verzoeken, indien een prospectus algemeen verkrijgbaar wordt
      gesteld dat voldoet aan het bepaalde in [hoofdstuk IA van het besluit][ref9] en aan de overige bepalingen van
      [hoofdstuk IA van het besluit][ref10] wordt voldaan.


