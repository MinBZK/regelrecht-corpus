  - number: 1d
    text: |-
      Van [artikel 3, eerste lid, van de wet][ref1], wordt vrijstelling verleend voor het toelaten tot de handel op een
      gereglementeerde markt van:

      a. aandelen of certificaten daarvan die, bezien over een periode van twaalf maanden, minder dan tien procent
      vertegenwoordigen van het aantal aandelen of certificaten daarvan van dezelfde categorie of klasse die reeds zijn
      toegelaten tot de handel op dezelfde gereglementeerde markt;

      b. aandelen of certificaten daarvan die zijn uitgegeven ter vervanging van aandelen of certificaten daarvan van
      dezelfde categorie of klasse die reeds zijn toegelaten tot de handel op dezelfde gereglementeerde markt, en waarvan
      de uitgifte niet leidt tot een verhoging van het geplaatst kapitaal;

      c. effecten die worden aangeboden bij een overname door middel van een openbaar bod tot ruil, indien een document
      beschikbaar is dat informatie bevat die gelijkwaardig is aan de informatie die het prospectus bevat;

      d. effecten die worden aangeboden, zijn of zullen worden toegewezen in verband met een fusie of splitsing, indien
      een document beschikbaar is dat informatie bevat die gelijkwaardig is aan de informatie die het prospectus bevat;

      e. aandelen of certificaten daarvan die kosteloos worden aangeboden, zijn of zullen worden toegewezen aan de
      aandeelhouders of als dividend worden uitgekeerd in de vorm van aandelen of certificaten daarvan van dezelfde
      categorie of klasse als de waardebewijzen waarop zij worden uitgekeerd, indien deze waardebewijzen van dezelfde
      categorie of klasse zijn als de waardebewijzen die reeds tot de handel op dezelfde gereglementeerde markt
      zijn toegelaten en een document beschikbaar wordt gesteld dat informatie bevat over het aantal aangeboden
      waardebewijzen, de kenmerken van de waardebewijzen, de redenen voor de aanbieding en de bijzonderheden daarvan;

      f. effecten die door een werkgever of een met die werkgever in een groep verbonden rechtspersoon, vennootschap of
      instelling worden aangeboden, toegewezen of zullen worden toegewezen, aan zijn huidige of voormalige bestuurders,
      huidige of voormalige leden van de raad van commissarissen of huidige of voormalige werknemers, indien die effecten
      van dezelfde categorie of klasse zijn als de effecten die reeds tot de handel op dezelfde gereglementeerde markt
      zijn toegelaten en een document beschikbaar wordt gesteld dat informatie bevat over het aantal aangeboden effecten,
      de kenmerken van de effecten, de redenen voor de aanbieding en de bijzonderheden daarvan;

      g. aandelen of certificaten daarvan die voortkomen uit de conversie of omruiling van andere effecten of uit
      de uitoefening van rechten verbonden aan andere effecten, indien die aandelen of certificaten daarvan van
      dezelfde categorie of klasse zijn als de aandelen of certificaten daarvan die reeds tot de handel op dezelfde
      gereglementeerde markt zijn toegelaten; of

      h. effecten die reeds tot de handel op een andere dan de in de aanhef bedoelde gereglementeerde markt zijn
      toegelaten indien:

      1°. deze effecten, of effecten van dezelfde categorie of klasse, gedurende meer dan achttien maanden toegelaten
      zijn tot de handel op die andere gereglementeerde markt;

      2°. voor effecten die voor het eerst tot de handel op een gereglementeerde markt worden toegelaten na
      inwerkingtreding van de prospectusrichtlijn, en bij de toelating tot de handel op die andere gereglementeerde markt
      een goedgekeurd prospectus is uitgebracht dat conform [artikel 1q van het besluit][ref2] algemeen verkrijgbaar
      is gesteld;

      3°. het prospectus voor deze effecten, indien deze na 30 juni 1983 voor het eerst tot de notering zijn toegelaten
      overeenkomstig [richtlijn nr. 80/390/EEG](31980L0390) van het Europees Parlement en de Raad van de Europese Unie
      van 17 maart 1980 tot coördinatie van de eisen gesteld aan de opstelling van, het toezicht op en de verspreiding
      van het prospectus dat gepubliceerd moet worden voor de toelating van effecten tot de officiële notering aan een
      effectenbeurs (PbEG L 100) of [richtlijn nr. 2001/34/EG](32001L0034) van het Europees Parlement en de Raad de
      Europese Unie van 28 mei 2001 betreffende de toelating van effecten tot de officiële notering aan een effectenbeurs
      en de informatie die over deze effecten moet worden gepubliceerd (PbEG L 184) is goedgekeurd, tenzij het bepaalde
      onder 2° van toepassing is;

      4°. de geldende verplichtingen inzake handel op die andere gereglementeerde markt zijn vervuld;

      5°. degene die verzoekt om toelating van effecten tot de handel op de gereglementeerde markt, een samenvatting
      algemeen verkrijgbaar stelt in een taal die wordt aanvaard door de toezichthouder;

      6°. de samenvatting op de in [artikel 1q van het besluit][ref3] bedoelde wijze algemeen verkrijgbaar wordt gesteld;
      en

      7°. de inhoud van de samenvatting voldoet aan [artikel 1j van het besluit][ref4] en in de samenvatting vermeld
      wordt waar het meest recente prospectus te verkrijgen is en waar de uitgevende instelling de financiële informatie
      op grond van zijn doorlopende informatieverplichtingen ter beschikking stelt.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007708#Artikel1q
      [ref3]: https://wetten.overheid.nl/BWBR0007708#Artikel1q
      [ref4]: https://wetten.overheid.nl/BWBR0007708#Artikel1j
