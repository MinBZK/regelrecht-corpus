  - number: '12'
    text: |-
      1 Indien aan de keuring een negatieve gevolgtrekking dan wel een positieve gevolgtrekking onder bepaalde
      beperkingen wordt verbonden, heeft de keurling het recht op herkeuring. De keurling maakt zijn wens daartoe met
      redenen omkleed kenbaar binnen een week nadat de genoemde gevolgtrekking aan hem is medegedeeld. De keuringvrager
      treft een regeling voor herkeuring door een onafhankelijk geneeskundige.

      2 De door de keuringvrager te nemen beslissing wordt uitgesteld totdat de uitslag van de herkeuring hem is
      medegedeeld.

      3 De kosten van de herkeuring worden gedragen door de keuringvrager. Deze mag echter een redelijke bijdrage van de
      keurling verlangen.
    url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#Artikel12
  - number: '13'
    text: |-
      1 De in [artikel 9][ref1] bedoelde organisaties kunnen een onafhankelijke klachtencommissie instellen.

      2 De commissie neemt klachten met betrekking tot het in of op grond van deze wet geregelde en de afspraken bedoeld
      in [artikel 9][ref2] in ontvangst en doet aan de klager en degene over wie is geklaagd, haar oordeel over de klacht
      toekomen.

      3 De in [artikel 9][ref3] bedoelde organisaties stellen het reglement van de klachtencommissie vast.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0008819#Artikel9
