  - number: '14'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld omtrent het bepaalde in de
      [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4], [6][ref5], [7][ref6], [8][ref7] en [13][ref8].

      2 Indien en voor zover binnen drie jaren na de inwerkingtreding van deze wet geen afspraken, als bedoeld in de
      [artikelen 9][ref9] en [13][ref10], zijn gemaakt of indien die afspraken niet voldoen aan bij of krachtens deze wet
      gestelde eisen, worden bij algemene maatregel van bestuur daaromtrent regels gesteld.

      3 Een krachtens het eerste of tweede lid vastgestelde algemene maatregel van bestuur wordt aan de beide kamers
      der Staten-Generaal overgelegd. Hij treedt in werking op een tijdstip dat nadat vier weken na de overlegging zijn
      verstreken bij koninklijk besluit wordt vastgesteld, tenzij binnen die termijn door of namens een der kamers of
      door ten minste een vijfde van het grondwettelijk aantal leden van een der kamers de wens te kennen wordt gegeven
      dat het onderwerp van de algemene maatregel van bestuur bij wet wordt geregeld.

      In dat geval wordt een daartoe strekkend voorstel van wet zo spoedig mogelijk ingediend. Indien het voorstel van
      wet wordt ingetrokken of indien een van de beide kamers van de Staten-Generaal besluit het voorstel niet aan te
      nemen, wordt de algemene maatregel van bestuur ingetrokken.


