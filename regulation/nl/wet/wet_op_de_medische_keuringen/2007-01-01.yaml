  - number: '8'
    text: |-
      1 De keuringvrager legt met inachtneming van de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4], [6][ref5]
      en [7][ref6] het doel van de keuring, de vragen welke ten aanzien van de gezondheid zullen worden gesteld, en de
      medische onderzoeken welke mogen worden verricht, schriftelijk vast.

      2 Tijdig voor de aanvang van de keuring wordt aan de keurling op begrijpelijke wijze schriftelijk informatie
      gegeven over doel, vragen en onderzoeken, als bedoeld in het eerste lid, en over diens rechten bij keuringen.


