  - number: '10'
    text: |-
      1 De keurend arts en de geneeskundig adviseur oefenen hun taak uit met behoud van hun zelfstandig oordeel op het
      gebied van hun deskundigheid en van hun onafhankelijkheid ten opzichte van de keuringvrager.

      2 De keurend arts en de geneeskundig adviseur zijn verplicht tot geheimhouding van hetgeen hen over de keurling
      bekend is, en dragen zorg voor een zodanige bewaring van de desbetreffende gegevens dat deze niet voor derden
      toegankelijk zijn.

      3 De keurend arts, respectievelijk de geneeskundig adviseur delen aan de keuringvrager niet meer mee dan voor het
      doel van de keuring strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#Artikel10
  - number: '11'
    text: |-
      De keurling heeft het recht medewerking te weigeren aan een keuring of een onderdeel daarvan indien ten aanzien
      daarvan niet voldaan is aan de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4], [6][ref5], [7][ref6]
      of [8][ref7].


