preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtspositie van degenen die een medische keuring
    ondergaan in verband met een burgerrechtelijke arbeidsverhouding die bij of krachtens de Ziektewet of de Wet op
    de Arbeidsongeschiktheidsverzekering als dienstbetrekking wordt aangemerkt, een burgerrechtelijke pensioen- of
    levensverzekering of een verzekering wegens arbeidsongeschiktheid naar burgerlijk recht, te versterken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. keuring: vragen over de gezondheidstoestand van de keurling en het verrichten van medisch onderzoek in verband
      met het aangaan of wijzigen van:

      1°. een burgerrechtelijke arbeidsverhouding die bij of krachtens de [Ziektewet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] of de [Wet op de Arbeidsongeschiktheidsverzekering][ref3] als
      dienstbetrekking wordt aangemerkt,

      2°. een aanstelling in openbare dienst,

      3°. een burgerrechtelijke pensioen- of levensverzekering,

      4°. een pensioenovereenkomst als bedoeld in [artikel 1 van de Pensioenwet][ref4], dan wel een pensioenregeling ten
      aanzien waarvan [artikel 3 van de Wet verplichte beroepspensioenregeling][ref5] toepassing heeft gevonden of de
      pensioenregeling waaraan deelneming verplicht is op grond van de Wet op het notarisambt,

      5°. een verzekering wegens arbeidsongeschiktheid naar burgerlijk recht, of

      6°. een verzekering als bedoeld in [artikel 4, vijfde lid][ref6], met betrekking tot een in Nederland gelegen
      risico;

      b. keurling: een persoon die een keuring ondergaat;

      c. keuringvrager: de (aanstaande) werkgever of (aanstaande) verzekeraar die een keuring van een (aspirant-)
      werknemer of (aspirant-) verzekerde vergt;

      d. keurend arts: de geneeskundige die de keuring verricht en de keuringvrager zijn gevolgtrekking mededeelt dan wel
      de geneeskundig adviseur van zijn bevindingen op de hoogte stelt;

      e. geneeskundig adviseur: de persoon die aan de keuringvrager in diens opdracht op basis van de keuring van de
      keurend arts de mededeling, bedoeld in het [derde lid van artikel 10][ref7], doet;

      f. vragengrens: het over drie jaren gerekend totaal te verzekeren bedrag waar beneden de in [artikel 5][ref8]
      genoemde vragen niet mogen worden gesteld en het in [artikel 6][ref9] genoemde onderzoek niet mag worden verricht.


