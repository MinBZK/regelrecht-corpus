  - number: '2'
    text: |-
      1 Keuringen worden naar hun aard, inhoud en omvang beperkt tot het doel waarvoor zij worden verricht.

      2 Keuringsgegevens mogen slechts worden gebruikt voor het doel waarvoor zij zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij een keuring worden geen vragen gesteld en geen medische onderzoeken verricht die een onevenredige inbreuk
      betekenen op de persoonlijke levenssfeer van de keurling.

      2 In ieder geval mogen geen onderdeel van een medisch onderzoek bij een keuring uitmaken:

      a. onderzoek waarvan het te verwachten belang voor de keuringvrager niet opweegt tegen de risico's daarvan voor de
      keurling, waaronder begrepen onderzoek specifiek gericht op het verkrijgen van kennis over de kans op een ernstige
      ziekte waarvoor geen geneeswijze voorhanden is, dan wel waarvan de ontwikkeling niet door medisch ingrijpen kan
      worden voorkomen of in evenwicht gehouden, of van kennis over een aanwezige, niet behandelbare ernstige ziekte
      welke naar verwachting eerst na langere tijd manifest zal worden;

      b. onderzoek dat anderszins voor de keurling een onevenredig zware belasting met zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#Artikel3
  - number: '4'
    text: |-
      1 Keuringen in verband met het aangaan en wijzigen van een burgerrechtelijke arbeidsverhouding die
      bij of krachtens de [Ziektewet][ref1], de [Wet werk en inkomen naar arbeidsvermogen][ref2] of de
      [Wet op de Arbeidsongeschiktheidsverzekering][ref3] als dienstbetrekking wordt aangemerkt, of in verband met
      een aanstelling in openbare dienst worden slechts verricht indien aan de vervulling van de functie, waarop de
      arbeidsverhouding of aanstelling in openbare dienst betrekking heeft, bijzondere eisen op het punt van de medische
      geschiktheid moeten worden gesteld. Onder medische geschiktheid voor de functie wordt begrepen de bescherming van
      de gezondheid en veiligheid van de keurling en van derden bij de uitvoering van de desbetreffende arbeid.

      2 Een keuring in verband met het aangaan van een burgerrechtelijke arbeidsverhouding die bij
      of krachtens de [Ziektewet][ref4], de [Wet werk en inkomen naar arbeidsvermogen][ref5] of de
      [Wet op de Arbeidsongeschiktheidsverzekering][ref6] als dienstbetrekking wordt aangemerkt, of in verband met
      een aanstelling in openbare dienst wordt eerst verricht nadat alle overige beoordelingen van de geschiktheid van
      de aspirant-werknemer of aspirant-ambtenaar hebben plaats gevonden en de werkgever op grond daarvan voornemens
      is de keurling aan te stellen. Indien tot de beoordelingen bedoeld in de eerste volzin een onderzoek naar de
      antecedenten van de aspirant-werknemer of aspirant-ambtenaar behoort dan wel een veiligheidsonderzoek als bedoeld
      in de [Wet veiligheidsonderzoeken][ref7] moet worden ingesteld, kan op verzoek van de keurling de keuring in
      verband met het aangaan van een burgerrechtelijke arbeidsverhouding die bij of krachtens de [Ziektewet][ref8], de
      [Wet werk en inkomen naar arbeidsvermogen][ref9] of de [Wet op de Arbeidsongeschiktheidsverzekering][ref10] als
      dienstbetrekking wordt aangemerkt, of in verband met een aanstelling in openbare dienst voorafgaand aan zodanig
      onderzoek worden verricht. De keuring in verband met het aangaan van een aanstelling als militair ambtenaar
      of politie-ambtenaar kan steeds worden verricht voorafgaande aan een met betrekking tot hem in te stellen
      antecedentenonderzoek of veiligheidsonderzoek.

      Bij andere beoordelingen dan de medische keuring mogen geen vragen worden gesteld noch anderszins inlichtingen
      worden ingewonnen over de gezondheidstoestand van de keurling en over diens ziekteverzuim in het verleden.

      3 Geen keuring vindt plaats voor deelneming aan een pensioenregeling ten aanzien waarvan
      [artikel 5 van de Wet verplichte beroepspensioenregeling][ref11] toepassing heeft gevonden of de pensioenregeling
      waaraan deelneming verplicht is op grond van de [Wet op het notarisambt][ref12] dan wel voor de deelneming
      aan een pensioenregeling als bedoeld in [artikel 1 van de Pensioenwet][ref13]. Indien de pensioenvoorziening
      keuzemogelijkheden biedt voor een individuele deelnemer kan, in afwijking van de eerste volzin, indien het een
      deelnemer betreft met een arbeidsovereenkomst voor onbepaalde tijd die een wijziging wenst ten aanzien van een
      eerder gemaakte keuze, wel een keuring plaatsvinden.

      4 Voor zover niet ondergebracht bij een pensioenvoorziening dan wel pensioenregeling, als bedoeld in het
      derde lid, vindt geen keuring plaats voor deelneming aan een aanvullende arbeidsongeschiktheidsverzekering
      die aan de burgerrechtelijke arbeidsverhouding die bij of krachtens de [Ziektewet][ref14], de
      [Wet werk en inkomen naar arbeidsvermogen][ref15] of de [Wet op de Arbeidsongeschiktheidsverzekering][ref16] als
      dienstbetrekking wordt aangemerkt, of in verband met een aanstelling in openbare dienst is verbonden.

      5 Voorzover sprake is van een arbeidsverhouding die bij of krachtens de [Ziektewet][ref17], de
      [Wet werk en inkomen naar arbeidsvermogen][ref18] of de [Wet op de arbeidsongeschiktheidsverzekering][ref19]
      als dienstbetrekking wordt aangemerkt of van een aanstelling in openbare dienst, vindt geen keuring plaats
      in verband met een door de werkgever te sluiten of gesloten verzekering ter dekking van het risico van
      doorbetaling van loon als bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref20],
      of van de betaling van een uitkering als bedoeld in [artikel 83 van de Wet werk en inkomen][ref21]
      naar arbeidsvermogen dan wel betaling van arbeidsongeschiktheidsuitkering als bedoeld in
      [artikel 75a van de Wet op de Arbeidsongeschiktheidsverzekering][ref22].

      6 Geen uitsluiting of vermindering van rechten op grond van ziekten, aandoeningen of gebreken wordt bedongen door
      de verzekeraar bij de deelneming aan een voorziening dan wel regeling als bedoeld in het derde lid en bij het
      aangaan of wijzigen van een verzekering als bedoeld in het vierde en vijfde lid, voorzover ingevolge deze leden een
      keuringsverbod geldt.


