  - number: '6'
    text: |-
      In afwijking van [artikel 3][ref1] mag bij het aangaan of wijzigen van een verzekering als bedoeld in
      [artikel 5][ref2], een medisch onderzoek naar Aids of seropositiviteit voor Aids worden verricht:

      a. indien de te sluiten verzekering de vragengrens, bedoeld in [artikel 5, tweede lid][ref3], overschrijdt, of

      b. indien de te sluiten verzekering de vragengrens, bedoeld in [artikel 5, tweede lid][ref4], niet overschrijdt,
      maar het antwoord van de keurling op de in het licht van de [artikelen 2][ref5] en [3, eerste lid][ref6],
      gerechtvaardigde vragen daartoe aanleiding geeft.


