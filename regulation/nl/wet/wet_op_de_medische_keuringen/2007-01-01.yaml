  - number: '15'
    text: |-
      Onze Minister van Volksgezondheid, Welzijn en Sport zendt in overeenstemming met Onze Minister van Sociale Zaken
      en Werkgelegenheid binnen drie jaar na de inwerkingtreding van deze wet, en vervolgens telkens na vijf jaar, aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#Artikel15
  - number: '16'
    text: |-
      1 Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.

      2 In het koninklijk besluit bedoeld in het eerste lid kan worden bepaald dat ten aanzien van de keuringen, bedoeld
      in artikel 5, de artikelen 5, 9, 11, 12 en 13 op een later tijdstip in werking treden, doch niet later dan drie
      jaren na het in het eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Wet op de medische keuringen.'
    url: https://wetten.overheid.nl/BWBR0008819/2007-01-01#Artikel17
