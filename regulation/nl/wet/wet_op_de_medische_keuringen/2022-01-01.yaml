      - id: ref7
        bwb_id: BWBR0002524
  - number: '4.3'
    text: |-
      Geen keuring vindt plaats voor deelneming aan een pensioenregeling ten aanzien waarvan
      [artikel 5 van de Wet verplichte beroepspensioenregeling][ref1] toepassing heeft gevonden of de pensioenregeling
      waaraan deelneming verplicht is op grond van de [Wet op het notarisambt][ref2] dan wel voor de deelneming
      aan een pensioenregeling als bedoeld in [artikel 1 van de Pensioenwet][ref3]. Indien de pensioenvoorziening
      keuzemogelijkheden biedt voor een individuele deelnemer kan, in afwijking van de eerste volzin, indien het een
      deelnemer betreft met een arbeidsovereenkomst voor onbepaalde tijd die een wijziging wenst ten aanzien van een
      eerder gemaakte keuze, wel een keuring plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0010388
      [ref3]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0010388
      - id: ref3
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '4.4'
    text: |-
      Voor zover niet ondergebracht bij een pensioenvoorziening dan wel pensioenregeling, als bedoeld in het
      derde lid, vindt geen keuring plaats voor deelneming aan een aanvullende arbeidsongeschiktheidsverzekering
      die aan de burgerrechtelijke arbeidsverhouding die bij of krachtens de [Ziektewet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] of de [Wet op de Arbeidsongeschiktheidsverzekering][ref3] als
      dienstbetrekking wordt aangemerkt, of in verband met een aanstelling in openbare dienst is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
  - number: '4.5'
    text: |-
      Voorzover sprake is van een arbeidsverhouding die bij of krachtens de [Ziektewet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] of de [Wet op de arbeidsongeschiktheidsverzekering][ref3]
      als dienstbetrekking wordt aangemerkt of van een aanstelling in openbare dienst, vindt geen keuring plaats in
      verband met een door de werkgever te sluiten of gesloten verzekering ter dekking van het risico van doorbetaling
      van loon als bedoeld in [artikel 629, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref4], of van de
      betaling van een uitkering als bedoeld in [artikel 84 van de Wet werk en inkomen naar arbeidsvermogen][ref5]
      dan wel betaling van arbeidsongeschiktheidsuitkering als bedoeld in
      [artikel 75a van de Wet op de Arbeidsongeschiktheidsverzekering][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel629
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel84
      [ref6]: https://wetten.overheid.nl/BWBR0002524#Artikel75a
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
