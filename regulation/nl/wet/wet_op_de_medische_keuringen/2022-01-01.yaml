        artikel: '629'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '84'
      - id: ref6
        bwb_id: BWBR0002524
        artikel: 75a
  - number: '4.6'
    text: |-
      Geen uitsluiting of vermindering van rechten op grond van ziekten, aandoeningen of gebreken wordt bedongen door
      de verzekeraar bij de deelneming aan een voorziening dan wel regeling als bedoeld in het derde lid en bij het
      aangaan of wijzigen van een verzekering als bedoeld in het vierde en vijfde lid, voorzover ingevolge deze leden een
      keuringsverbod geldt.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel4
  - number: '5.1'
    text: |-
      Bij een keuring in verband met het aangaan of wijzigen van een verzekering mogen geen vragen worden gesteld over
      in [artikel 3, tweede lid, onderdeel a][ref1], genoemde ziekten, voor zover die op erfelijkheid betrekking hebben,
      bij de bloedverwanten van de aspirant-verzekerde en, tenzij de ziekte manifest is, bij de aspirant-verzekerde
      zelf en over onderzoek bij de aspirant-verzekerde en bij diens bloedverwanten gericht op de erfelijke aanleg voor
      ziekte en de resultaten van dergelijk onderzoek, indien de te sluiten verzekering de vragengrens niet overschrijdt.
      Bij de behandeling van de aanvrage voor het aangaan of wijzigen van een verzekering en bij een keuring in dat
      verband mogen geen uit andere hoofde reeds bij de keuringvrager, de keurend arts of geneeskundig adviseur aanwezige
      erfelijke gegevens over de aspirantverzekerde en diens bloedverwanten worden gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel3
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '3'
  - number: '5.2'
    text: |-
      Voor arbeidsongeschiktheidsverzekeringen, voor zover niet vallende onder [artikel 4, vierde lid][ref1], bedraagt de
      vragengrens € 36 249,–  voor het eerste jaar van arbeidsongeschiktheid en € 24 267,–  voor de daaropvolgende jaren
      van arbeidsongeschiktheid. Voor levensverzekeringen bedraagt de vragengrens € 250 000 . Bedoelde bedragen worden
      elke drie jaar bij ministeriële regeling aangepast aan de consumentenprijsindex.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel4
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '4'
  - number: '6'
    text: |-
      In afwijking van [artikel 3][ref1] mag bij het aangaan of wijzigen van een verzekering als bedoeld in
      [artikel 5][ref2], een medisch onderzoek naar Aids of seropositiviteit voor Aids worden verricht:


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel5
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '5'
  - number: 6.a
    text: |-
      indien de te sluiten verzekering de vragengrens, bedoeld in [artikel 5, tweede lid][ref1], overschrijdt, of


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel5
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '5'
  - number: 6.b
    text: |-
      indien de te sluiten verzekering de vragengrens, bedoeld in [artikel 5, tweede lid][ref1], niet overschrijdt,
      maar het antwoord van de keurling op de in het licht van de [artikelen 2][ref2] en [3, eerste lid][ref3],
      gerechtvaardigde vragen daartoe aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0008819#Artikel3
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0008819
        artikel: '3'
  - number: '7'
    text: |-
      In afwijking van [artikel 3][ref1] kan, indien dit vanwege een dringend algemeen belang noodzakelijk is, Onze
      Minister van Volksgezondheid, Welzijn en Sport ten aanzien van een zich nieuw voordoende ziekte die valt onder
      [artikel 3, tweede lid, onderdeel a][ref2], bij ministeriële regeling bepalen dat artikel 6 van overeenkomstige
      toepassing is, totdat over deze ziekte afspraken als bedoeld in [artikel 9][ref3] zijn gemaakt. Het ontwerp van
      een ministeriële regeling als bedoeld in de eerste volzin wordt ten minste vier weken voordat de regeling wordt
      vastgesteld, toegezonden aan de beide kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008819#Artikel9
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0008819
        artikel: '9'
  - number: '8.1'
    text: |-
      De keuringvrager legt met inachtneming van de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4], [6][ref5]
      en [7][ref6] het doel van de keuring, de vragen welke ten aanzien van de gezondheid zullen worden gesteld, en de
      medische onderzoeken welke mogen worden verricht, schriftelijk vast.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008819#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008819#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0008819#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0008819#Artikel7
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel8
