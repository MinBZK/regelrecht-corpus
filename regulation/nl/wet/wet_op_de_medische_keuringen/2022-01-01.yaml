        artikel: '7'
      - id: ref7
        bwb_id: BWBR0008819
        artikel: '8'
  - number: '12.1'
    text: |-
      Indien aan de keuring een negatieve gevolgtrekking dan wel een positieve gevolgtrekking onder bepaalde beperkingen
      wordt verbonden, heeft de keurling het recht op herkeuring. De keurling maakt zijn wens daartoe met redenen
      omkleed kenbaar binnen een week nadat de genoemde gevolgtrekking aan hem is medegedeeld. De keuringvrager treft een
      regeling voor herkeuring door een onafhankelijk geneeskundige.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel12
  - number: '12.2'
    text: |-
      De door de keuringvrager te nemen beslissing wordt uitgesteld totdat de uitslag van de herkeuring hem is
      medegedeeld.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel12
  - number: '12.3'
    text: |-
      De kosten van de herkeuring worden gedragen door de keuringvrager. Deze mag echter een redelijke bijdrage van de
      keurling verlangen.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel12
  - number: '13.1'
    text: |-
      De in [artikel 9][ref1] bedoelde organisaties kunnen een onafhankelijke klachtencommissie instellen, voor zover de
      klachtenbehandeling geen betrekking heeft op een keuring als bedoeld in [artikel 4, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel4
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '4'
  - number: '13.2'
    text: |-
      De commissie neemt klachten met betrekking tot het in of op grond van deze wet geregelde en de afspraken bedoeld
      in [artikel 9][ref1] in ontvangst en doet aan de klager en degene over wie is geklaagd, haar oordeel over de klacht
      toekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel9
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '9'
  - number: '13.3'
    text: |-
      De in [artikel 9][ref1] bedoelde organisaties stellen het reglement van de klachtencommissie vast.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel9
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '9'
  - number: '14.1'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over het verrichten van keuringen als bedoeld in
      [artikel 4, eerste lid][ref1], en de vragen welke ten aanzien van de gezondheid zullen worden gesteld, bedoeld
      in [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel8
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '8'
  - number: '14.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de instelling, de werkwijze en de
      openbaarmaking van het oordeel van een onafhankelijke klachtencommissie voor klachten over keuringen als bedoeld in
      [artikel 4, eerste lid][ref1]. Bij de vaststelling van die regels:


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel4
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '4'
  - number: 14.2.a
    text: kan de medewerking van de Sociaal-Economische Raad worden ingeroepen; en
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel14
  - number: 14.2.b
    text: |-
      kunnen voor de klachtencommissie in afwijking van [artikel 37 van de Wet op de Sociaal-Economische Raad][ref1] ook
      personen van niet in de Sociaal-Economische Raad vertegenwoordigde organisaties worden aangezocht.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel37
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '37'
  - number: '14.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld ter uitvoering van de [artikelen 2][ref1],
      [3][ref2], [4][ref3], [5][ref4], [6][ref5], [7][ref6], [8][ref7] en [13, tweede en derde lid][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008819#Artikel4
