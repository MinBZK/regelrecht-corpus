  - number: '8.2'
    text: |-
      Tijdig voor de aanvang van de keuring wordt aan de keurling op begrijpelijke wijze schriftelijk informatie gegeven
      over doel, vragen en onderzoeken, als bedoeld in het eerste lid, en over diens rechten bij keuringen.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel8
  - number: '9'
    text: |-
      Representatieve organisaties van de werkgevers, respectievelijk de verzekeraars, representatieve
      organisaties van werknemers, respectievelijk de consumenten en patiënten en de representatieve organisatie
      van de artsen kunnen afspraken maken over de omschrijving van het doel van de keuring, als bedoeld in het
      [eerste lid van artikel 2][ref1], het verrichten van keuringen als bedoeld in het [eerste lid van artikel 4][ref2],
      en over de vragen en medische onderzoeken, als bedoeld in de [artikelen 3][ref3], [5][ref4], [6][ref5],
      [7][ref6] en [8][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0008819#Artikel3
      [ref4]: https://wetten.overheid.nl/BWBR0008819#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0008819#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0008819#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0008819#Artikel8
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel9
    references:
