    text: |-
      een aanstelling voor een functie als genoemd in [artikel 3 van de Ambtenarenwet 2017][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel3
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
    references:
      - id: ref1
