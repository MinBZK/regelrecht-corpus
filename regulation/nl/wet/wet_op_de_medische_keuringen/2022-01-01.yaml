    text: een burgerrechtelijke pensioen- of levensverzekering,
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
  - number: 1.a.4°
    text: |-
      een pensioenovereenkomst als bedoeld in [artikel 1 van de Pensioenwet][ref1], dan wel een pensioenregeling ten
      aanzien waarvan [artikel 3 van de Wet verplichte beroepspensioenregeling][ref2] toepassing heeft gevonden of de
      pensioenregeling waaraan deelneming verplicht is op grond van de Wet op het notarisambt,


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
