  - number: '16.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel16
  - number: '16.2'
    text: |-
      In het koninklijk besluit bedoeld in het eerste lid kan worden bepaald dat ten aanzien van de keuringen, bedoeld in
      artikel 5, de artikelen 5, 9, 11, 12 en 13 op een later tijdstip in werking treden, doch niet later dan drie jaren
      na het in het eerste lid bedoelde tijdstip.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel16
  - number: '17'
    text: 'Deze wet wordt aangehaald als: Wet op de medische keuringen.'
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel17
