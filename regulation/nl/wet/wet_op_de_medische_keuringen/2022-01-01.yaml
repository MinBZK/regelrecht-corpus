    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
  - number: 1.a.1°
    text: |-
      een burgerrechtelijke arbeidsverhouding die bij of krachtens de [Ziektewet][ref1], de
      [Wet werk en inkomen naar arbeidsvermogen][ref2] of de [Wet op de Arbeidsongeschiktheidsverzekering][ref3] als
      dienstbetrekking wordt aangemerkt,


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
