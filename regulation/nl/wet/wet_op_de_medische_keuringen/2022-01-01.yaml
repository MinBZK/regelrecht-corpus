preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de rechtspositie van degenen die een medische keuring
    ondergaan in verband met een burgerrechtelijke arbeidsverhouding die bij of krachtens de Ziektewet of de Wet op
    de Arbeidsongeschiktheidsverzekering als dienstbetrekking wordt aangemerkt, een burgerrechtelijke pensioen- of
    levensverzekering of een verzekering wegens arbeidsongeschiktheid naar burgerlijk recht, te versterken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
  - number: 1.a
    text: |-
      keuring: vragen over de gezondheidstoestand van de keurling en het verrichten van medisch onderzoek in verband met
