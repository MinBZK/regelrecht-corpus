        bwb_id: BWBR0018831
        artikel: '3'
  - number: 1.a.5°
    text: een verzekering wegens arbeidsongeschiktheid naar burgerlijk recht, of
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
  - number: 1.a.6°
    text: |-
      een verzekering als bedoeld in [artikel 4, vijfde lid][ref1], met betrekking tot een in Nederland gelegen risico;


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel4
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
    references:
      - id: ref1
