        artikel: '4'
  - number: 1.b
    text: 'keurling: een persoon die een keuring ondergaat;'
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
  - number: 1.c
    text: |-
      keuringvrager: de (aanstaande) werkgever of (aanstaande) verzekeraar die een keuring van een (aspirant-) werknemer
      of (aspirant-) verzekerde vergt;
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
  - number: 1.d
    text: |-
      keurend arts: de geneeskundige die de keuring verricht en de keuringvrager zijn gevolgtrekking mededeelt dan wel de
      geneeskundig adviseur van zijn bevindingen op de hoogte stelt;
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
  - number: 1.e
    text: |-
      geneeskundig adviseur: de persoon die aan de keuringvrager in diens opdracht op basis van de keuring van de keurend
      arts de mededeling, bedoeld in het [derde lid van artikel 10][ref1], doet;


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel10
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '10'
  - number: 1.f
    text: |-
      vragengrens: het over drie jaren gerekend totaal te verzekeren bedrag waar beneden de in [artikel 5][ref1] genoemde
      vragen niet mogen worden gesteld en het in [artikel 6][ref2] genoemde onderzoek niet mag worden verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel6
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '6'
  - number: '2.1'
    text: Keuringen worden naar hun aard, inhoud en omvang beperkt tot het doel waarvoor zij worden verricht.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel2
  - number: '2.2'
    text: Keuringsgegevens mogen slechts worden gebruikt voor het doel waarvoor zij zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel2
  - number: '3.1'
    text: |-
      Bij een keuring worden geen vragen gesteld en geen medische onderzoeken verricht die een onevenredige inbreuk
      betekenen op de persoonlijke levenssfeer van de keurling.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel3
  - number: '3.2'
    text: 'In ieder geval mogen geen onderdeel van een medisch onderzoek bij een keuring uitmaken:'
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel3
  - number: 3.2.a
    text: |-
      onderzoek waarvan het te verwachten belang voor de keuringvrager niet opweegt tegen de risico's daarvan voor de
      keurling, waaronder begrepen onderzoek specifiek gericht op het verkrijgen van kennis over de kans op een ernstige
      ziekte waarvoor geen geneeswijze voorhanden is, dan wel waarvan de ontwikkeling niet door medisch ingrijpen kan
      worden voorkomen of in evenwicht gehouden, of van kennis over een aanwezige, niet behandelbare ernstige ziekte
      welke naar verwachting eerst na langere tijd manifest zal worden;
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel3
  - number: 3.2.b
    text: onderzoek dat anderszins voor de keurling een onevenredig zware belasting met zich meebrengt.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel3
  - number: '4.1'
    text: |-
      Keuringen in verband met het aangaan en wijzigen van een burgerrechtelijke arbeidsverhouding die
      bij of krachtens de [Ziektewet][ref1], de [Wet werk en inkomen naar arbeidsvermogen][ref2] of de
      [Wet op de Arbeidsongeschiktheidsverzekering][ref3] als dienstbetrekking wordt aangemerkt, of in verband met
      een aanstelling in openbare dienst worden slechts verricht indien aan de vervulling van de functie, waarop de
      arbeidsverhouding of aanstelling in openbare dienst betrekking heeft, bijzondere eisen op het punt van de medische
      geschiktheid moeten worden gesteld. Onder medische geschiktheid voor de functie wordt begrepen de bescherming van
      de gezondheid en veiligheid van de keurling en van derden bij de uitvoering van de desbetreffende arbeid.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
  - number: '4.2'
    text: |-
      Een keuring in verband met het aangaan van een burgerrechtelijke arbeidsverhouding die bij
      of krachtens de [Ziektewet][ref1], de [Wet werk en inkomen naar arbeidsvermogen][ref2] of de
      [Wet op de Arbeidsongeschiktheidsverzekering][ref3] als dienstbetrekking wordt aangemerkt, of in verband met
      een aanstelling in openbare dienst wordt eerst verricht nadat alle overige beoordelingen van de geschiktheid van
      de aspirant-werknemer of aspirant-ambtenaar hebben plaats gevonden en de werkgever op grond daarvan voornemens
      is de keurling aan te stellen. Indien tot de beoordelingen bedoeld in de eerste volzin een onderzoek naar de
      antecedenten van de aspirant-werknemer of aspirant-ambtenaar behoort dan wel een veiligheidsonderzoek als bedoeld
      in de [Wet veiligheidsonderzoeken][ref4] moet worden ingesteld, kan op verzoek van de keurling de keuring in
      verband met het aangaan van een burgerrechtelijke arbeidsverhouding die bij of krachtens de [Ziektewet][ref5],
      de [Wet werk en inkomen naar arbeidsvermogen][ref6] of de [Wet op de Arbeidsongeschiktheidsverzekering][ref7] als
      dienstbetrekking wordt aangemerkt, of in verband met een aanstelling in openbare dienst voorafgaand aan zodanig
      onderzoek worden verricht. De keuring in verband met het aangaan van een aanstelling als militair ambtenaar
      of politie-ambtenaar kan steeds worden verricht voorafgaande aan een met betrekking tot hem in te stellen
      antecedentenonderzoek of veiligheidsonderzoek. Het is aan een ander dan een keurend arts niet toegestaan vragen
      te stellen noch anderszins inlichtingen in te winnen over de gezondheidstoestand van de keurling of over diens
      ziekteverzuim in het verleden.


      [ref1]: https://wetten.overheid.nl/BWBR0001888
      [ref2]: https://wetten.overheid.nl/BWBR0019057
      [ref3]: https://wetten.overheid.nl/BWBR0002524
      [ref4]: https://wetten.overheid.nl/BWBR0008277
      [ref5]: https://wetten.overheid.nl/BWBR0001888
      [ref6]: https://wetten.overheid.nl/BWBR0019057
      [ref7]: https://wetten.overheid.nl/BWBR0002524
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001888
      - id: ref2
        bwb_id: BWBR0019057
      - id: ref3
        bwb_id: BWBR0002524
