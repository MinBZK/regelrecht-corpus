        artikel: '8'
  - number: '10.1'
    text: |-
      De keurend arts en de geneeskundig adviseur oefenen hun taak uit met behoud van hun zelfstandig oordeel op het
      gebied van hun deskundigheid en van hun onafhankelijkheid ten opzichte van de keuringvrager.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel10
  - number: '10.2'
    text: |-
      De keurend arts en de geneeskundig adviseur zijn verplicht tot geheimhouding van hetgeen hen over de keurling
      bekend is, en dragen zorg voor een zodanige bewaring van de desbetreffende gegevens dat deze niet voor derden
      toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel10
  - number: '10.3'
    text: |-
      De keurend arts, respectievelijk de geneeskundig adviseur delen aan de keuringvrager niet meer mee dan voor het
      doel van de keuring strikt noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel10
  - number: '11'
    text: |-
      De keurling heeft het recht medewerking te weigeren aan een keuring of een onderdeel daarvan indien ten aanzien
      daarvan niet voldaan is aan de [artikelen 2][ref1], [3][ref2], [4][ref3], [5][ref4], [6][ref5], [7][ref6]
      of [8][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0008819#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0008819#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0008819#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0008819#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0008819#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0008819#Artikel7
      [ref7]: https://wetten.overheid.nl/BWBR0008819#Artikel8
    url: https://wetten.overheid.nl/BWBR0008819/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0008819
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0008819
        artikel: '3'
      - id: ref3
