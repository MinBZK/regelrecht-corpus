  - number: '13'
    text: |-
      1 Krachtens de regelgeving van de Europese Gemeenschappen zijn geen maatregelen genomen, houdende instelling
      van een verbod om de betreffende partij vlees uit de betrokken Lid-Staat in te voeren of houdende de machtiging
      tot instelling van een verbod om de betreffende partij vlees in Nederland in te voeren, noch is de Lid-Staat
      van verzending ingevolge die regelgeving gehouden de afgifte van de certificaten of vervoersdocumenten, zulks in
      verband met de invoer in Nederland, op te schorten.

      2 Ingevolge de regelgeving van de Lid-Staat van verzending is er geen verbod om de betrokken partij vlees op het
      grondgebied van die Lid-Staat in de handel te brengen.

      3 Ten aanzien van de betrokken partij vlees is, in voorkomend geval, voldaan aan de ingevolge artikel 9 van
      [richtlijn 89/662/EEG](31989L0662) vastgestelde regelgeving van de Europese Gemeenschap of van de lid-staat van
      verzending zelf, in geval van een uitbraak van een epidemische dierziekte in de lid-staat van verzending.
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel13
  - number: '14'
    text: |-
      1 De partij vlees gaat:

      a. indien zij voor Nederland is bestemd, tot en met de ontvangst door de handelaar genoemd in de hierna bedoelde
      documenten, vergezeld van:

        - voorzover de partij van oorsprong afkomstig is uit een lid-staat, het document, dat dienaangaande is vereist op
      grond van [artikel 5][ref1];
        - voorzover de partij van oorsprong afkomstig is uit een derde land, doch via een lid-staat op Nederlands
      grondgebied wordt gebracht een Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening
      282/2004/EG](32004R0282) en van een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van [richtlijn
      97/78/EG](31997L0078);

      b. indien zij voor een lidstaat is bestemd, tijdens het vervoer over Nederlands grondgebied vergezeld van:

        - voorzover de partij van oorsprong afkomstig is uit een lidstaat, van het document, dat dienaangaande is vereist
      op grond van [artikel 6][ref2], alsmede, in voorkomend geval, van het document dat door de lid-staat van bestemming
      voor de invoer in dat land wordt vereist;
        - voorzover de partij van oorsprong afkomstig is uit een derde land, doch via een lid-staat op Nederlands
      grondgebied wordt gebracht, een Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening
      282/2004/EG](32004R0282) en van een gewaarmerkt afschrift als bedoeld in artikel 7, vierde lid, van [richtlijn
      97/78/EG](31997L0078).

      c. indien zij voor een derde land is bestemd, tijdens het vervoer over Nederlands grondgebied vergezeld van:

        - het bij de partij behorende document;
        - een Gemeenschappelijk veterinair document van binnenkomst als bedoeld in [verordening 282/2004/EG](32004R0282),
      waarin is aangegeven langs welke grensinspectiepost als bedoeld in artikel 2, tweede lid, van [richtlijn 97/78/EG]
      (31997L0078) de partij de Gemeenschap verlaat.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel5
