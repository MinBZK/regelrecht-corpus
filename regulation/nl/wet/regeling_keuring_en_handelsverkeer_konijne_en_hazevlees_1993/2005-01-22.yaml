    text: |-
      Konijnevlees of hazevlees, bestemd voor gebruik in Nederland, wordt slechts voorzien van:

      a. een merk als bedoeld in [artikel 27, onderdeel b, onder i][ref1], indien het vlees voldoet
      aan [artikel 3, eerste lid, onderdelen a tot en met f, h][ref2], en i en indien wordt voldaan aan
      [artikel 33, onderdeel 1][ref3], en 34, onderdeel 2;

      b. een merk als bedoeld in [artikel 27, onderdeel b, onder 3][ref4], indien:

      1. het vlees:

        - is ingevoerd vanuit een derde land als bedoeld in [artikel 7, onderdeel b][ref5], en
        - ook overigens voldoet aan [artikel 7][ref6] en het merk, bedoeld in [artikel 7, onderdeel a][ref7], is vernietigd
      ten gevolge van het uitsnijden en ompakken van het vlees, dan wel

      2. het vlees afkomstig is uit een inrichting als bedoeld in [artikel 31, vierde lid][ref8].


