  - number: '15'
    text: |-
      1 De handelaar die betrokken is bij het vervoer, bedoeld in [artikel 5][ref1], onderscheidenlijk [artikel 6][ref2],
      van het aldaar bedoelde vlees bestemd voor Nederland of een Lid-Staat, is ingeschreven in een register dat wordt
      bijgehouden door de Minister, terwijl die registratie niet is getroffen door een beslissing als bedoeld in het
      derde lid.

      2 De handelaar die overeenkomstig het eerste lid is geregistreerd:

      a. geeft van elke aanvoer van een partij vlees tussen 08.00 uur en 17.00 uur en ten laatste op de dag, niet zijnde
      een zaterdag, zondag of algemeen erkende feestdag, voorafgaande aan de dag van aankomst op de plaats waar de
      handelaar het partij vlees ontvangt, kennis aan de VWA, onder opgave van deze plaats, het vermoedelijke tijdstip
      van aankomst alsmede van de hoeveelheid en de soort vlees;

      b. volgt de instructies van de ambtenaar in verband met een controle op en biedt desgevraagd de aangevoerde partij
      vlees aan de ambtenaar ten onderzoek aan en overlegt desgevraagd de in [artikel 14, eerste lid][ref3], bedoelde,
      voor het vervoer in het kader van de invoer van het betrokken vlees uit Lid-Staten voorgeschreven documenten en
      geeft alle medewerking en verstrekt alle inlichtingen die voor deze controle noodzakelijk worden geacht;

      c. voert een administratie waarin ten minste de leveringen van vlees en de eventuele verdere bestemming van het
      vlees zijn vermeld en waarin alle op de partijen vlees betrekking hebbende bescheiden, en met name de in onderdeel
      b bedoelde documenten, zijn opgenomen;

      d. bewaart de vorenbedoelde administratie gedurende ten minste drie jaren;

      e. gaat voorafgaand aan de ontvangst, onderscheidenlijk de verdere verdeling of verhandeling van elke partij vlees
      na of aan de voorwaarden, gesteld in de [artikelen 13][ref4] en [14][ref5], voor zover deze betrekking hebben op de
      invoer van het betrokken vlees uit Lid-Staten, is voldaan;

      f. meldt onmiddellijk nalatigheden en onregelmatigheden met betrekking tot een levering van een partij vlees aan
      de VWA;

      3 Indien een handelaar zijn in het tweede lid bedoelde verplichtingen niet nakomt of in strijd handelt met
      [artikel 5:20 van de Algemene wet bestuursrecht][ref6], kan de Minister beslissen dat zijn in het eerste lid
      bedoelde registratie wordt doorgehaald dan wel niet wordt erkend. Doorhaling dan wel niet-erkenning geschiedt niet
      dan na voorafgaande schriftelijke waarschuwing door de Minister en na het verstrijken van een daarbij te stellen
      termijn, waarbinnen aan de vorenbedoelde voorschriften moet worden voldaan.


