    text: |-
      1 Bij de in- of doorvoer van een partij producten die door een derde land zijn geweigerd en vanuit het grondgebied
      van de Europese Gemeenschap naar het betrokken derde land zijn verzonden, wordt voldaan aan:

      a. [artikel 20, eerste en vierde lid][ref1];

      b. artikel 15, eerste lid, onderdeel a, van [richtlijn 97/78/EG](31997L0078).

      2 Op de in het eerste lid bedoeld partij zijn de artikelen 2.17, achtste en twaalfde lid, 2.18a, 2.19, eerste lid,
      en 2.22, eerste lid, tweede lid, vijfde lid en zesde lid, van de Regeling keuring en handel dierlijke producten van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel20
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel22
