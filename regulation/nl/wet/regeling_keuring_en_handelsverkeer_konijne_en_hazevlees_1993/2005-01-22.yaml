      1 De [artikelen 13 tot en met 22][ref1] gelden niet voor een partij vlees als bedoeld in artikel 16, eerste lid,
      van [richtlijn 97/78/EG](31997L0078), met dien verstande dat onder commerciële monsters als bedoeld in artikel
      16, eerste lid, onderdeel e, van [richtlijn 97/78/EG](31997L0078) wordt verstaan handelsmonsters als bedoeld in
      [artikel 1.1, eerste lid, van de Regeling keuring en handel dierlijke producten][ref2], en, mits met inachtneming
      van artikel 8 van [verordening 136/2004/EG](32004R0136), wordt voldaan aan artikel 16, eerste lid, van [richtlijn
      97/78/EG](31997L0078).

      2 Vlees als bedoeld in [artikel 16, eerste lid, onderdelen e tot en met f][ref3], wordt aangevoerd via een
      inspectiepost.

      3 Tenzij met de Minister anders is overeengekomen, geeft de belanghebbende bij de lading van de aanvoer als
      bedoeld in het tweede lid tenminste 24 uur voor de aankomst schriftelijk kennis aan de VWA, onder opgaven van het
      vermoedelijke tijdstip van aankomst, van de hoeveelheid en van de herkomst en van de soort producten.


