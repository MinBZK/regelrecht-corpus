  - number: '8'
    text: |-
      Het vervoer van uit een derde land afkomstig konijnevlees of hazevlees van enige plaats in Nederland naar het
      grondgebied van en bestemd voor een Lid-Staat of een derde land, niet zijnde Noorwegen, is slechts toegestaan
      indien:

      a. is voldaan aan [artikel 7, onderdeel e][ref1], en het vlees vergezeld gaat van het certificaat, bedoeld in
      [artikel 7, onderdeel b][ref2];

      b. voor zover het vlees eerst in Nederland is ingevoerd en daarna wordt uitgevoerd naar een lid-staat of Noorwegen,
      deze staat heeft ingestemd met het op zijn grondgebied brengen van het vlees en tevens wordt voldaan aan de
      voorschriften die door die staat ter zake van de invoer van dat vlees worden gesteld, met dien verstande dat:

      1º. indien de partij in Nederland niet is verwerkt of omgepakt, de partij, voorzien van het keurmerk bedoeld in
      [artikel 27, onderdeel b, onder 4][ref3], vergezeld gaat van een gewaarmerkt afschrift van het certificaat bedoeld
      in [artikel 7, onderdeel b][ref4], met dien verstande dat op dit afschrift of op een afzonderlijk certificaat
      tevens door de officiële dierenarts is verklaard dat de partij voldoet aan de voorschriften van [richtlijn 91/495/
      EEG](31991L0495) en is ingevoerd overeenkomstig de Nederlandse voorschriften;

      2º. indien de partij in Nederland is verwerkt of omgepakt en het vlees daarbij is voorzien van een merk als
      bedoeld in [artikel 27, onderdeel b, onder 3][ref5], de partij vergezeld gaat van een door de officiële dierenarts
      ingevuld en ondertekend certificaat overeenkomstig het model van bijlage II van [richtlijn 91/495/EEG](31991L0495),
      waarop tevens door de officiële dierenarts is verklaard dat het vlees is ingevoerd overeenkomstig de Nederlandse
      voorschriften.

      c. is voldaan aan de eisen van [artikel 6, eerste lid, onderdeel b][ref6];

      d. het vlees behoorlijk is verpakt en op voldoende hygiënische wijze wordt vervoerd, en

      e. is voldaan aan [verordening 136/2004/EG](32004R0136) en, voor zover van toepassing, de
      [artikelen 19 tot en met 24][ref7];

      f. is voldaan aan:

      1°. de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van [verordening
      1829/2003](32003R1829);

      2°. de artikelen 4, eerste, tweede, vierde en zesde lid, en 5, eerste en tweede lid, van [verordening 1830/2003]
      (32003R1830).


