  - number: '16'
    text: |-
      De vervoerder van het vlees volgt de instructies van de ambtenaar in verband met een controle op. Desverlangd
      biedt hij het vlees de ambtenaar ten onderzoek aan en overlegt hij de in [artikel 14, eerste lid][ref1], bedoelde
      documenten. Bij een zodanig onderzoek verleent hij alle medewerking en verstrekt hij alle inlichtingen die voor het
      onderzoek noodzakelijk worden geacht.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel14
