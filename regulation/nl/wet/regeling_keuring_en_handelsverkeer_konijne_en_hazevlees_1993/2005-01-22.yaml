    text: |-
      1 Erkenning van een slachthuis onderscheidenlijk een uitsnijderij geschiedt door de Minister van Landbouw,
      Natuurbeheer en Visserij.

      2 Een erkenning wordt verleend indien uit een door de officiële dierenarts ingesteld onderzoek is gebleken
      dat wordt voldaan aan de voorschriften, bedoeld in artikel 4.16, eerste lid, van de Regeling keuring en handel
      dierlijke producten.

      3 Een inrichting die is erkend op grond van artikel 4.16 van de Regeling keuring en handel dierlijke producten, op
      grond van [artikel 9 van de Regeling uitvoer vers vlees en vleesbereidingen 1985][ref1] of op grond van krachtens
      de [Vleeskeuringswet][ref2] ter implementatie van [richtlijn 64/433/EEG](31964L0433) gestelde regelen kan tevens
      worden erkend voor het slachten van konijnen of hazen onderscheidenlijk voor uitsnijden van het vlees daarvan, mits
      wordt voldaan aan artikel 14, eerste lid, van [richtlijn 91/495/EEG](31991L0495).

      4 Een erkenning wordt eveneens verleend indien:

      a. voor zover het betreft een slachthuis, in de inrichting niet meer dan 3000 dieren per week en niet meer dan
      150.000 dieren per jaar worden geslacht;

      b. voor zover het betreft een uitsnijderij:

      1. de inrichting niet in een inrichting als bedoeld in het tweede of derde lid is gelegen, met uitzondering van een
      inrichting die is erkend op grond van krachtens de [Vleeskeuringswet][ref3] ter implementatie van artikel 4, tweede
      lid, van [richtlijn 64/433/EEG](31964L0433) gestelde regelen;

      2. indien de inrichting tevens is erkend op grond van krachtens de [Vleeskeuringswet][ref4] ter implementatie van
      artikel 4, tweede lid, van [richtlijn 64/433/EEG](31964L0433) gestelde regelen, in die inrichting in totaal niet
      meer dan 5 ton vlees per week wordt geproduceerd, en

      3. in andere gevallen dan als bedoeld onder 2, in de inrichting in totaal niet meer dan 3 ton vlees per week wordt
      geproduceerd, en

      c. uit een door de officiële dierenarts ingesteld onderzoek is gebleken dat:

      1. de inrichting voldoet aan de erkeningsvoorwaarden van bijlage II van [richtlijn 71/118/EEG](31971L0118), zoals
      deze richtlijn is gewijzigd bij de richtlijn van de Raad van de Europese Gemeenschappen van 17 december 1992,
      nr. 92/116/EEG, tot wijziging en bijwerking van [Richtlijn 71/118/EEG](31971L0118) inzake gezondheidsvraagstukken
      op het gebied van het handelsverkeer in vers vlees van pluimvee (PbEG L 62), met dien verstande dat de bevoegde
      autoriteit, genoemd in laatstgenoemde bijlage, de officiële dierenarts is;

      2. in de inrichting aan de VWA de voorzieningen, bedoeld in artikel 4.16, tweede lid, van de Regeling keuring en
      handel dierlijke producten om niet ter beschikking worden gesteld;

      3. het vlees, afkomstig uit de inrichting:

        - wordt gemerkt met het merk, bedoeld in [artikel 27, onderdeel b, onder 3][ref5];
        - wordt bestemd om op de plaatselijke markt hetzij vers, hetzij na verwerking, rechtstreeks aan detailhandelaren of
      aan de consument te worden verkocht zonder voorverpakking of voorafgaande onmiddellijke verpakking;
        - onder hygiënische omstandigheden naar zijn bestemming wordt vervoerd.

      4. voor zover het betreft de inrichting, bedoeld in onderdeel a:

        - de exploitant, de eigenaar of diens vertegenwoordiger een register bijhoudt op grond waarvan de volgende gegevens
      kunnen worden gecontroleerd: 1º de inkomende dieren en de uitgaande slachtproducten; 2º de uitgevoerde controles;
      3º de resultaten van de controles, en ervoor zorgdraagt dat de gegevens desgevraagd aan de officiële dierenarts
      worden meegedeeld;
        - door of namens de onder 1° genoemde personen de officiële dierenarts op de hoogte wordt gebracht van het tijdstip
      van slachten, het aantal dieren en de herkomst ervan;
        - indien de officiële dierenarts of diens assistent niet bij het slachten aanwezig kan zijn, het vlees de
      inrichting slechts verlaat nadat een keuring na het slachten is verricht, die op de dag van het slachten heeft
      plaatsgevonden;
        - van de inrichting afkomstig, voor menselijke consumptie ongeschikt verklaard vlees wordt gemerkt op een door de
      Minister vastgestelde wijze;

      5. voor zover het een uitsnijderij betreft, hoofdstuk III, punt 10, hoofdstuk VI, hoofdstuk VIII en hoofdstuk
      IX, punt 42, van bijlage I van [richtlijn 71/118/EEG](31971L0118) niet van toepassing zijn op de opslag en het
      uitsnijden, en

      6. is gewaarborgd dat in de inrichting de overige hygiëne- en keuringsvoorschriften van [richtlijn 71/118/EEG]
      (31971L0118), voor zover van toepassing, worden nageleefd;

      5 Een erkenning wordt door de Minister ingetrokken, indien blijkt dat niet of niet meer wordt voldaan aan de
      voorschriften, bedoeld in het tweede, derde onderscheidenlijk vierde lid, dan wel indien blijkt dat niet wordt
      voldaan aan [artikel 29][ref6]. Intrekking geschiedt niet dan na voorafgaande schriftelijke waarschuwing door de
      Minister en na het verstrijken van een daarbij te stellen termijn, waarbinnen aan de evenbedoelde voorschriften en
      beperkingen moet worden voldaan.

      6 Het toezicht op de naleving van de voorschriften, bedoeld in het tweede, derde en vierde lid, berust bij de
      officiële dierenarts.


