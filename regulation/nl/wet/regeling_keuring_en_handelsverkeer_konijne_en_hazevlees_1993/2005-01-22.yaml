  - number: '18'
    text: |-
      1 Indien wordt vermoed of geconstateerd dat er verwekkers van ziekten, zoönosen of andere aandoeningen, bedoeld in
      artikel 7, eerste lid, onderdeel a, van [richtlijn 89/662/EEG](31989L0662), aanwezig zijn of het vlees afkomstig
      zijn uit een met een epidemische dierziekte besmet gebied, kan de Minister, indien hij de aanwezigheid van
      verwekkers van ziekten, zoönosen of andere aandoeningen vermoedt, gelasten dat de partij in tijdelijke afzondering
      wordt geplaatst, dan wel worden de maatregelen uitgevoerd, bedoeld in [artikel 7, eerste lid, onderdeel a][ref1],
      eerste alinea, van [richtlijn 89/662/EEG](31989L0662), al naar gelang de Minister daaromtrent heeft besloten.

      2 Indien wordt vermoed of geconstateerd dat overigens niet wordt voldaan aan de voorschriften van de onderhavige
      regeling dan wel aan de van toepassing zijnde communautaire voorschriften, kan de Minister, indien hij vermoedt
      dat niet wordt voldaan aan vorenbedoelde voorschriften, gelasten dat de partij in tijdelijke afzondering
      wordt geplaatst, dan wel wordt één van de maatregelen, bedoeld in artikel 7, eerste lid, onderdeel b, van
      [richtlijn 89/662/EEG](31989L0662), waartoe de Minister heeft besloten, uitgevoerd. Indien zulks op grond van
      de veterinairrechtelijke voorschriften mogelijk is, neemt de Minister dat besluit overeenkomstig de keuze van de
      afzender of diens gemachtigde.

      3 Een besluit als bedoeld in het eerste of het tweede lid, wordt ter kennis gebracht van de afzender of diens
      gemachtigde met vermelding van de redenen. Desgevraagd geschiedt die kennisgeving schriftelijk, met vermelding van
      datum en uur waarop het besluit is genomen.

      4 Een besluit als bedoeld in het eerste en tweede lid laat onverlet het recht van de afzender van de partij
      producten om, overeenkomstig [artikel 8, tweede lid][ref2], vierde alinea, van [richtlijn 89/662/EEG](31989L0662),
      binnen een maand na de kennisgeving, bedoeld in het derde lid, het advies van een veterinair deskundige in te
      winnen, met dien verstande evenwel, dat de Minister te allen tijde kan beslissen om de maatregelen, bedoeld in het
      eerste lid, onmiddellijk uit te voeren, indien zulks noodzakelijk is om redenen van gezondheidsbescherming.

      5 De kosten van de in het eerste en tweede lid bedoelde maatregelen komen zonder vergoeding van Staatswege voor
      rekening van de afzender of diens gemachtigde, dan wel van de afnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel7
