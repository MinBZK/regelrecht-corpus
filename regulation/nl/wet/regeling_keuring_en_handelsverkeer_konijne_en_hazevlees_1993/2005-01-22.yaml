        paragraaf: '10'
  - number: '35'
    text: |-
      1 Artikel 4.24, eerste lid, van de Regeling keuring en handel dierlijke producten, is van overeenkomstige
      toepassing op konijne- en hazevlees.

      2 De Minister kan ontheffing verlenen van de [artikelen 2][ref1] tot en met [34][ref2]. Aan een ontheffing kunnen
      voorschriften worden verbonden. Een ontheffing kan onder beperkingen worden verleend.

      3 [Paragraaf 9][ref3] is niet van toepassing op:

      a. het afstaan van konijne- of hazevlees door fokkers met een jaarproductie van minder dan 10.000 stuks, in
      hoeveelheden van maximaal 50 geslachte dieren per week tot maximaal 500 geslachte dieren per jaar, rechtstreeks aan
      de eindverbruiker op het bedrijf of op de dichtstbijgelegen weekmarkt, met uitzondering van venthandel en verkoop
      door middel van verzending, en

      b. het afstaan van konijne- of hazevlees door een kleine producent, niet zijnde de eigenaar of exploitant van een
      erkende inrichting, in hoeveelheden van maximaal 50 geslachte dieren per week tot maximaal 500 geslachte dieren per
      jaar, rechtstreeks aan de eindverbruiker voor eigen verbruik, met uitzondering van venthandel, verkoop door middel
      van verzending en verkoop op markten.

      4 In de gevallen bedoeld in het derde lid, houdt de fokker dan wel de producent een register bij van het aantal
      dieren dat op zijn bedrijf wordt aan- en afgevoerd, alsmede van het aantal geslachte dieren dat wordt afgeleverd.
      Bedoelde gegevens worden terstond na de aan- of afvoer in het register genoteerd. De dieren worden in een andere
      ruimte geslacht dan waar zij worden gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006051#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0006051#Paragraaf9
