  - number: '17'
    text: |-
      1 Het vervoer over Nederlands grondgebied van een uit een derde land verzonden partij vlees, die via het
      grondgebied van een lid-staat in het kader van de doorvoer naar het betrokken derde land op Nederlands grondgebied
      wordt gebracht, is slechts toegestaan indien het vervoer over Nederlands grondgebied geschiedt onder douanetoezicht
      tot op de plaats waar het Nederlands grondgebied wordt verlaten in verzegelde voertuigen of verzegelde containers
      en zonder splitsing of, tenzij de partij overeenkomstig het tweede lid wordt opgeslagen, lossing van de partij.

      2 Op de in het eerste lid bedoelde partij zijn de [artikelen 2.23][ref1], [2.23a][ref2], [2.23c][ref3] en
      [2.23e van de Regeling keuring en handel dierlijke producten][ref4] van overeenkomstige toepassing, met dien
      verstande opslag in een van de in [artikel 2.23a][ref5] genoemde opslagruimten is toegestaan, mits elders geen
      opslag heeft plaatsgevonden.


