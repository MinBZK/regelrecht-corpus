  - number: '36'
    text: |-
      1 Een wijziging van een of meer onderdelen van de in [artikel 1][ref1] bedoelde dan wel genoemde richtlijnen treedt
      voor de toepassing van de artikelen uit deze regeling, waarin naar die onderdelen wordt verwezen, in werking met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven.

      2 De Minister doet van een wijzigingsrichtlijn als bedoeld in het eerste lid mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel1
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel36
    references:
