  - number: '6'
    text: |-
      1 Het vervoer van een partij konijnevlees of hazevlees als bedoeld in [artikel 5][ref1], welke partij in Nederland
      niet is verwerkt of omgepakt, van de plaats waar de handelaar de partij ontvangt naar het grondgebied van en
      bestemd voor een Lid-Staat of Noorwegen is slechts toegestaan indien:

      a. eventuele opslag van het vlees heeft plaatsgehad overeenkomstig [artikel 3, eerste lid, onderdeel h][ref2];

      b. het vlees geen tekenen van bederf of andere ondeugdelijkheden vertoont;

      c. het vlees is voorzien van een keurmerk als bedoeld in [artikel 3, eerste lid, onderdeel g][ref3];

      d. het vlees vergezeld gaat van het desbetreffende certificaat, bedoeld in [artikel 5, eerste lid][ref4];

      e. het vervoer plaatsvindt overeenkomstig [artikel 3, eerste lid, onderdeel i][ref5], en

      f. overigens is voldaan aan [artikel 5][ref6].

      2 Het vervoer van een partij konijnevlees of hazevlees als bedoeld in [artikel 5][ref7], welke partij in Nederland
      is verwerkt of omgepakt, van de plaats waar de handelaar de partij ontvangt naar het grondgebied en bestemd voor
      een Lid-Staat of Noorwegen is slechts toegestaan indien:

      a. de verwerking of ompakking van het vlees op hygiënische wijze heeft plaatsgevonden in een erkende uitsnijderij
      als bedoeld in [artikel 31, tweede lid][ref8], en

      b. is voldaan aan het eerste lid, onderdelen a tot en met f.

      3 Het vervoer van een partij konijnevlees of hazevlees als bedoeld in [artikel 5][ref9] van enige plaats in
      Nederland naar het grondgebied van en bestemd voor een derde land is slechts toegestaan, indien:

      a. de partij vergezeld gaat van een bij de partij behorend document, en

      b. voor zover de partij afkomstig is uit een lid-staat, is voldaan aan, voor zover van toepassing, de
      [artikelen 13 tot en met 18][ref10], dan wel

      c. voor zover de partij afkomstig is uit Noorwegen, is voldaan aan [verordening 136/2004/EG](32004R0136) en, voor
      zover van toepassing, de [artikelen 19 tot en met 24][ref11].

      4 In aanvulling op het eerste, tweede en derde lid, is het vervoer van een partij konijnenvlees of hazenvlees als
      bedoeld in [artikel 5][ref12] van enige plaats in Nederland naar het grondgebied van een Lid-Staat of derde land
      slechts toegestaan indien is voldaan aan de eisen, gesteld in:

      1°. de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van [verordening
      1829/2003](32003R1829);

      2°. de artikelen 4, eerste, tweede, vierde en zesde lid, en 5, eerste en tweede lid, van [verordening 1830/2003]
      (32003R1830).


