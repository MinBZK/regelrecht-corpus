preamble:
  text: |-
    Gelt op Richtlijn 89/662/EEG van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire
    controles in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne
    markt (PbEG L 395), op Richtlijn 90/675/EEG van de Raad van de Europese Gemeenschappen van 10 december 1990 tot
    vaststelling van de beginselen voor de organisatie van de veterinaire controles voor producten uit derde landen die
    in de Gemeenschap worden binnengebracht (PbEG L 373), alsmede op Richtlijn 91/495/EEG van de Raad van de Europese
    Gemeenschappen van 27 november 1990 inzake gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de
    productie en het in de handel brengen van konijnevlees en vlees van gekweekt wild (PbEG L 268);

    Gelet op Beschikking 92/571/EEG van de Commissie van de Europese Gemeenschappen van 15 december 1992 tot
    vaststelling van nieuwe overgangsmaatregelen om de overgang naar de bij Richtlijn 90/675/EEG van de Raad
    vastgestelde regeling inzake veterinaire controles te vergemakkelijken (PbEG L 367), op Beschikking nr. 93/13/EEG
    van de Commissie van de Europese Gemeenschappen van 22 december 1992, tot vaststelling van de procedures voor de
    veterinaire controles in de inspectieposten aan de grens van de Gemeenschap bij het binnenbrengen van producten uit
    derde landen (PbEG 1993, L 9), alsmede op Beschikking nr. 93/14/EEG van de Commissie van de Europese Gemeenschappen
    van 23 december 1992 tot vaststelling van uitvoeringsbepalingen inzake de veterinaire controles van producten uit
    derde landen in vrije entrepots, vrije zones en douane-entrepots, alsmede tijdens het vervoer van een derde land
    naar een ander derde land via de Gemeenschap (PbEG 1993, L 9);

    Gelet op de artikelen 13, eerste en tweede lid, 19, 26 en 28 van de Landbouwwet;

    Gelet op het advies van het Productschap voor Pluimvee en Eieren en het Bedrijfschap Pluimveehandel en -industrie;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:




              *richtlijn 64/433/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 26 juni 1964, betreffende gezondheidsvoorschriften
      voor de productie en het in de handel brengen van vers vlees (PbEG L 121);




              *richtlijn 71/118/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 15 februari 1971 inzake gezondheidsvraagstukken op
      het gebied van het handelsverkeer in vers vlees van pluimvee (PbEG L 55);




              *richtlijn 89/662/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 11 december 1989 inzake veterinaire controles
      in het intracommunautaire handelsverkeer in het vooruitzicht van de totstandbrenging van de interne markt (PbEG
      L 395);




              *richtlijn 91/495/EEG:*


              richtlijn van de Raad van de Europese Gemeenschappen van 27 november 1990 inzake gezondheidsvoorschriften
      en veterinairrechtelijke voorschriften voor de productie en het in de handel brengen van konijnevlees en vlees van
      gekweekt wild (PbEG L 268);




              [richtlijn 97/78/EG](31997L0078):

              [richtlijn nr. 97/78/EG](31997L0078) van de Raad van de Europese Unie van 18 december 1997 tot vaststelling
      van de beginselen voor de organisatie van de veterinaire controles voor producten die uit derde landen in de
      Gemeenschap worden binnengebracht (PbEG, L 24);




              *beschikking 2000/585/EG:*


              beschikking (EG) nr. 2000/585 van de Commissie van de Europese Gemeenschappen van 7 september 2000
      houdende vaststelling van een lijst van derde landen waaruit de lidstaten de invoer toestaan van konijnevlees
      en van bepaalde soorten vlees van vrij en van gekweekt wild, en houdende vaststelling van veterinairrechtelijke
      voorschriften, gezondheidsvoorschriften en voorschriften inzake de veterinaire certificering voor die invoer (PbEU
      2004, L 73);




              *beschikking 2004/280/EG:*


              Beschikking (EG) nr. 2004/280 van de Commissie van de Europese Gemeenschappen van 19 maart 2004 tot
      vaststelling van overgangsmaatregelen voor het in de handel brengen van bepaalde producten van dierlijke oorsprong,
      verkregen in Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije, Malta, Polen, Slovenië en Slowakije (PbEU
      L 87);




              [verordening 1829/2003](32003R1829):

              verordening (EG) nr. 1829/2003 van het Europees Parlement en de Raad van de Europese Unie van 22 september
      2003 inzake genetisch gemodificeerde levensmiddelen en diervoeders (PbEU L 268);




              [verordening 1830/2003](32003R1830):

              verordening (EG) nr. 1830/2003 van het Europees Parlement en de Raad van de Europese Unie van 22 september
      2003 betreffende de traceerbaarheid van genetisch gemodificeerde organismen en de traceerbaarheid van met genetisch
      gemodificeerde organismen geproduceerde levensmiddelen en diervoeders en tot wijziging van [Richtlijn 2001/18/EG]
      (32001L0018) (PbEU L 268);




              [verordening 136/2004/EG](32004R0136):

              [verordening (EG) nr. 136/2004](32004R0136) van de Commissie van de Europese Gemeenschappen van 22 januari
      2004 tot vaststelling van procedures voor de veterinaire controles in de grensinspectieposten van de Gemeenschap
      bij het binnenbrengen van producten uit derde landen (PbEU L 21);




              *konijnen:*


              tamme konijnen;




              *konijnevlees:*


              alle voor menselijke consumptie geschikte delen van konijnen;




              *hazen:*


              hazen die in gevangenschap zijn gekweekt, gehouden of geslacht;




              *hazevlees:*


              alle voor menselijke consumptie geschikte delen van hazen;




              *konijnevlees of hazevlees:*


              konijnevlees, hazevlees, gedode wilde konijnen of gedode wilde hazen;




              *VWA:*


              de Voedsel en Waren Autoriteit, ingesteld bij besluit van de Minister van Volksgezondheid, Welzijn en Sport
      van 8 juli 2002 (Stcrt. 127);




              *Minister:*


              Minister van Landbouw, Natuur en Voedselkwaliteit;




              *officiële dierenarts:*


              dierenarts verbonden aan de VWA;




              *ambtenaar:*


              ambtenaar als bedoeld in
      [artikel 114, eerste of tweede lid, van de Gezondheids- en welzijnswet voor dieren][ref1];




              *erkende inspectiepost:*


              op Nederlands grondgebied gelegen inspectiepost die is aangewezen en erkend overeenkomstig het bepaalde in
      artikel 6 van [richtlijn 97/78/EG](31997L0078);




              *douane-entrepot:*


              opslagruimte als bedoeld in [verordening (EEG) nr. 2503/88](31988R2503) van de Raad van de Europese
      Gemeenschappen van 25 juli 1988 betreffende de douane-entrepots (PbEG L 225);




              *vrij entrepot:*


              opslagruimte als bedoeld in artikel 1, vierde lid, onder a en b, van [verordening (EEG) nr. 2504/88]
      (31988R2504) van de Raad van de Europese Gemeenschappen van 25 juli 1988 betreffende de vrije zones en de vrije
      entrepots (PbEG L 225);




              *ruimte voor tijdelijke opslag:*


              opslagruimte als bedoeld in [verordening (EEG) nr. 4151/88](31988R4151) van de Raad van de Europese
      Gemeenschappen van 21 december 1988 tot vaststelling van de bepalingen die van toepassing zijn op goederen die het
      douanegebied van de Gemeenschap worden binnengebracht (PbEG L 367);



            lid-staat:

              lid-staat van de Europese Unie, niet zijnde Nederland;



            derde land:

              land, niet zijnde Nederland en niet zijnde een lid-staat;.




              *partij vlees:*


              hoeveelheid vlees van dezelfde aard waar voor eenzelfde certificaat of document geldt, die met hetzelfde
      vervoermiddel wordt vervoerd en afkomstig is uit hetzelfde land of gedeelte van een land;




              *handelaar:*


              elke natuurlijke persoon of rechtspersoon, zijnde de eerste ontvanger op Nederlands grondgebied van een
      partij vlees afkomstig uit een Lid-Staat;




              *importeur:*


              elke natuurlijk persoon of rechtspersoon die vlees met het oog op de invoer of de doorvoer bij een erkende
      inspectiepost ten onderzoek aanbiedt, dan wel zijn gemachtigde;



            belanghebbende bij de lading:

              belanghebbende bij de lading als bedoeld in artikel 2, tweede lid, van [richtlijn 97/78/EG](31997L0078).


