  - number: '32'
    text: Aan een erkend slachthuis, onderscheidenlijk een erkende uitsnijderij wordt een toelatingsnummer toegekend.
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel32
  - number: '33'
    text: |-
      Zolang een slachthuis is erkend draagt de eigenaar, het hoofd of de bestuurder van het slachthuis ervoor zorg dat
      aan de navolgende voorschriften is voldaan:

      1. al de konijnen of hazen die in het slachthuis worden geslacht, worden aan de officiële dierenarts ter keuring
      voor en na het slachten aangeboden, op zodanige wijze dat de keuringen, bedoeld in de hoofdstukken I en II van
      bijlage I van [richtlijn 91/495/EEG](31991L0495) worden gewaarborgd, waarbij de aanwijzingen van de officiële
      dierenarts of diens assistent worden opgevolgd;

      2. er wordt een zodanige administratie gevoerd, dat daaruit te allen tijde het aantal ter keuring aangeboden
      konijnen of hazen, het aantal eenheden en het gewicht van het goedgekeurde konijne- of hazevlees, de voorraad
      en de afgeleverde hoeveelheid konijne- of hazevlees alsmede het gebruik en de voorraad van merkplaatjes en van
      keurmerken voorziene onmiddellijke verpakkingen en etiketten als bedoeld in hoofdstuk III van bijlage I, behorende
      bij [richtlijn 91/495/EEG](31991L0495) kan worden gekend;

      3. de in onderdeel 2 bedoelde bescheiden worden terstond desgevraagd ter inzage gegeven aan de bevoegde officiële
      dierenarts. Aan deze ambtenaar wordt desverlangd toegang verleend tot het gehele bedrijf;

      4. dieren of delen daarvan, die bij de in onderdeel 1 bedoelde keuring niet geschikt worden bevonden voor
      menselijke consumptie respectievelijk konijne- of hazevlees dat anderszins door de officiële dierenarts of diens
      assistent niet geschikt wordt bevonden voor menselijke consumptie worden onmiddellijk verzameld op de wijze als
      bedoeld in hoofdstuk V, onderdeel 27, van bijlage I van [richtlijn 71/118/EEG](31971L0118) ten einde onder toezicht
      van de bevoegde officiële dierenarts of diens assistent onbruikbaar te worden gemaakt voor menselijke consumptie en
      ter destructie te worden bestemd.
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel33
  - number: '34'
    text: |-
      Zolang een uitsnijderij erkend is dient de eigenaar, het hoofd of de bestuurder van de uitsnijderij ervoor zorg te
      dragen dat aan de navolgende voorschriften is voldaan:

      1. er mag slechts konijne- of hazevlees op zijn bedrijf worden aangevoerd dat voldoet aan het gestelde in
      [artikel 3, eerste lid, onderdeel a tot en met e, g, h][ref1] en i;

      2. konijnevlees of hazevlees wordt op hygiënische wijze behandeld, verpakt en onder koeling bewaard, zulks ten
      genoegen van de officiële dierenarts of diens assistent, waarbij hun aanwijzingen worden opgevolgd en waarbij
      wordt voldaan aan hoofdstuk II van bijlage I, van bij [richtlijn 71/118/EEG](31971L0118) en hoofdstuk III van die
      bijlage, voor zover dit hoofdstuk op uitsnijderijen van toepassing is;

      3. er wordt een zodanige administratie gevoerd dat daaruit te allen tijde blijkt:

      a. welke hoeveelheden konijne- of hazevlees iedere dag zijn aangevoerd;

      b. van welke slachthuizen onderscheidenlijk uitsnijderijen dit vlees afkomstig is;

      c. van welke soort het vlees afkomstig is en de aard der delen of organen;

      d. welke producten in welke hoeveelheden per dag zijn vervaardigd;

      e. welke voorraad producten in de vries- en koelruimten aanwezig is en de afgeleverde hoeveelheid per dag;

      f. het verbruik en de voorraad van keurmerken en van keurmerken voorziene verpakkingen en etiketten als bedoeld in
      hoofdstuk III van bijlage I van [richtlijn 91/495/EEG](31991L0495) en artikel 27, onderdeel b, onder 1 en 2;

      4. de in onderdeel 3 bedoelde bescheiden worden terstond desgevraagd ter inzage gegeven aan de in onderdeel 2
      bedoelde ambtenaar. Aan deze ambtenaar wordt desverlangd toegang verleend tot het gehele bedrijf;

      5. ten aanzien van dieren of delen daarvan, die niet geschikt worden bevonden voor menselijke consumptie, dient te
      worden gehandeld op de wijze als bedoeld in [artikel 33, onderdeel 4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0006051#Artikel33
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel34
