      1 Ten aanzien van het vervaardigen, het in voorraad hebben en het gebruiken van het keurmerk, bedoeld in
      [artikel 3, eerste lid, onderdeel g][ref1], is artikel 4.22 van de Regeling keuring en handel dierlijke producten
      van overeenkomstige toepassing.

      2 Het gebruik van het keurmerk, bedoeld in het eerste lid, is slechts toegestaan in een
      slachthuis als bedoeld in [artikel 3, eerste lid, onderdeel a][ref2], mits is voldaan aan
      [artikel 3, eerste lid, onderdelen b tot en met g][ref3], en in een uitsnijderij als bedoeld in
      [artikel 3, eerste lid, onderdeel h][ref4], mits is voldaan aan de voorschriften, bedoeld in dat artikelonderdeel;


