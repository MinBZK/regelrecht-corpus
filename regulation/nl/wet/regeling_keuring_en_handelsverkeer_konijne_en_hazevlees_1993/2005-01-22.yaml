    text: |-
      1 Het vervoer van:

      a. een partij konijnevlees verkregen van in Nederland geslachte konijnen;

      b. een partij in Nederland uitgesneden konijnevlees;

      c. een partij hazevlees van in Nederland geslachte hazen, of

      d. een partij in Nederland uitgesneden hazevlees,

      van enige plaats in Nederland en bestemd voor een Lid-Staat of Noorwegen is slechts toegestaan indien:

      1º voor zover het betreft konijnevlees, de partij vergezeld gaat van een gezondheidscertificaat als bedoeld in
      bijlage II van [richtlijn 91/495/EEG](31991L0495);

      2º voor zover het betreft hazevlees, de partij vergezeld gaat van een gezondheidscertificaat als bedoeld in bijlage
      IV van [richtlijn 91/495/EEG](31991L0495);

      3º het certificaat, bedoeld in onderdeel 1 onderscheidenlijk 2 is opgesteld in overeenstemming met
      [artikel 3, tweede lid][ref1], tweede alinea, van [richtlijn 91/495/EEG](31991L0495), terwijl tevens in voorkomend
      geval op het betrokken certificaat de ingevolge de regelgeving van de Europese Gemeenschappen voorgeschreven
      vermeldingen voorkomen, en

      4º is voldaan aan, voor zover van toepassing, het bepaalde in artikel 3, tweede lid, van [richtlijn 89/662/EEG]
      (31989L0662).

      5º op grond van de regelgeving van de Europese Gemeenschap of de Toezichthoudende Autoriteit van de Europese
      Vrijhandelsassociatie geen verbod geldt om de partij naar het grondgebied van die lid-staat, onderscheidenlijk
      Noorwegen te vervoeren.

      2 De in het eerste lid bedoelde certificaten worden afgegeven door de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel3
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel2
    references:
