  - number: '5'
    text: |-
      1 Het vervoer van een uit een Lid-Staat of Noorwegen verzonden partij konijnevlees of hazevlees van de plaats waar
      de partij op Nederlands grondgebied wordt gebracht naar de plaats waar de handelaar de partij ontvangt is slechts
      toegestaan indien:

      a. de betrokken partij voldoet aan artikel 3 van [richtlijn 91/495/EEG](31991L0495), en ten bewijze daarvan
      vergezeld gaat van een certificaat als bedoeld in bijlage II onderscheidenlijk bijlage IV van die richtlijn,
      afgegeven in overeenstemming met artikel 3, tweede lid, tweede alinea, van [richtlijn 91/495/EEG](31991L0495), en

      b. voor zover de partij is verzonden vanuit een lid-staat, is voldaan aan de [artikelen 13 tot en met 18][ref1],
      dan wel

      c. voor zover de partij is verzonden vanuit Noorwegen, is voldaan aan [verordening 136/2004/EG](32004R0136) en de
      [artikelen 19 tot en met 24][ref2].

      2 In afwijking van het eerste lid, aanhef en onderdeel a, is het vervoer als bedoeld in het eerste lid, aanhef,
      tot en met 30 april 2005 eveneens toegestaan van een uit Tsjechië, Estland, Cyprus, Letland, Litouwen, Hongarije,
      Malta, Polen, Slovenië of Slowakije verzonden partij konijnevlees of hazevlees, die vóór 1 mei 2004 is verkregen
      in een inrichting die erkend was voor uitvoer naar de Europese Gemeenschap, indien de partij voorzien is van het
      keurmerk, bedoeld in artikel 3, onderdeel a, van beschikking 2004/280/EG, mits het certificaat of document dat de
      producten vergezelt, door de bevoegde autoriteiten van het land van herkomst is voorzien van de verklaring: ‘Vóór 1
      mei 2004 geproduceerd overeenkomstig Beschikking 2004/280/EG van de Commissie.’

      3 Het vervoer van een uit een Lid-Staat of Noorwegen verzonden partij konijnevlees of hazevlees van de plaats
      waar de handelaar de partij ontvangt naar de plaats van bestemming is slechts toegestaan indien voldaan is aan
      [artikel 3, eerste lid, onderdelen g en i][ref3], met dien verstande dat voor partijen konijnevlees of hazevlees
      als bedoeld in het tweede lid als keurmerk, bedoeld in [artikel 3, eerste lid, onderdeel g][ref4], ook het keurmerk
      geldt, bedoeld in artikel 3, onderdeel a, van beschikking 2004/280/EG.


