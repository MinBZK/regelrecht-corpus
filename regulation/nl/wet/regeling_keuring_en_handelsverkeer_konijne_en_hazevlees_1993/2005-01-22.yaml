    text: |-
      1 Noch krachtens artikel 22, eerste lid, eerste gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078), noch
      krachtens andere regelgeving van de Europese Gemeenschappen zijn maatregelen genomen houdende instelling van een
      verbod om het betrokken vlees in de Europese Gemeenschappen dan wel in Nederland in te voeren.

      2 Ten aanzien van de betrokken partij vlees is, in voorkomend geval, voldaan aan de op grond van artikel 22,
      eerste lid, tweede en derde gedachtenstreepje, van [richtlijn 97/78/EG](31997L0078) dan wel op grond van andere
      regelgeving van de Europese Gemeenschap vastgestelde bijzondere voorschriften.
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel19
  - number: '20'
    text: |-
      1 Een partij producten, rechtstreeks afkomstig uit een derde land, wordt aangevoerd via een erkende inspectiepost.

      2 De melding van de aanvoer van een partij vindt plaats aan de VWA overeenkomstig artikel 2 van [verordening
      136/2004/EG](32004R0136).

      3 Indien terzake van het vervoer in het kader van de in- of doorvoer van het betrokken vlees op grond van
      [artikel 5][ref1], onderscheidenlijk [6][ref2], voorzover het vlees afkomstig is uit Noorwegen, dan wel op grond
      van [artikel 7][ref3], onderscheidenlijk [8][ref4], voorzover het vlees afkomstig is uit een ander derde land,
      een ander document is vereist, wordt dit document bij aankomst op de erkende inspectiepost aan de ambtenaar ter
      beschikking gesteld, met dien verstande dat:

      a. indien de partij is bestemd voor een lidstaat, tevens een door of namens de bevoegde autoriteit van die lidstaat
      geautoriseerde verklaring ter beschikking wordt gesteld, waarin de ter zake van de invoer in deze lidstaat gestelde
      veterinairrechtelijke en sanitaire eisen zijn opgenomen;

      b. indien de partij is bestemd voor een derde land en indien opslag op het grondgebied van de Europese
      Gemeenschappen in een douane-entrepot of ruimte voor tijdelijke opslag is voorzien, uit dat document blijkt dat is
      voldaan aan de voorschriften voor invoer in Nederland onderscheidenlijk in de betreffende lid-staat.

      4 De partij producten wordt door de belanghebbende bij de lading bij aankomst op de inspectiepost ter onderzoek
      aangeboden aan de ambtenaar.

      5 De in het derde lid bedoeld documenten zijn originelen waarvan de geldigheidsduur niet is verstreken. Zij zijn,
      voorzover van toepassing, in overeenstemming met de regelgeving van de Europese Gemeenschap opgesteld en afgegeven,
      volledig ingevuld, gedagtekend en ondertekend.

      6 Op de in het eerste lid bedoelde partij producten zijn de [artikelen 2.17, zesde tot en met twaalfde lid][ref5],
      en [2.17a tot en met 2.23m, van de Regeling keuring en handel dierlijke producten][ref6] van overeenkomstige
      toepassing.

      7 Voor de toepassing van de in het zesde lid bedoelde artikelen wordt voor "keuringsdierenarts" gelezen: ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0006051#Artikel5
