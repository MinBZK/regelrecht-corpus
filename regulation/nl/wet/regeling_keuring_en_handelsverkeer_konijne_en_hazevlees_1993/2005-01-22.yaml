        artikel: '3'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 De Minister geeft een certificaat als bedoeld in [artikel 2][ref1] slechts af, indien:

      a. het konijne- of hazevlees is verkregen in een erkend slachthuis als bedoeld in
      [artikel 31, tweede of vierde lid][ref2];

      b. de konijnen onderscheidenlijk hazen waarvan het vlees afkomstig is, voor het slachten zijn gekeurd
      overeenkomstig hoofdstuk I van bijlage I van [richtlijn 91/495/EEG](31991L0495) en daarbij geschikt zijn bevonden
      om te worden geslacht;

      c. het konijne- of hazevlees is behandeld onder bevredigende hygiënische omstandigheden overeenkomstig hoofdstuk V
      van bijlage I van [richtlijn 71/118/EEG](31971L0118), met uitzondering van de onderdelen 28bis en 28ter daarvan;

      d. het konijne- of hazevlees na het slachten is gekeurd overeenkomstig hoofdstuk II van bijlage I van [richtlijn
      91/495/EEG](31991L0495) en met inachtneming van artikel 3, eerste lid, onderdeel e, van die richtlijn;

      e. het konijne- of hazevlees na de keuring na het slachten onder bevredigende hygiënische omstandigheden is
      opgeslagen overeenkomstig hoofdstuk IV van bijlage I van [richtlijn 91/495/EEG](31991L0495), met inachtneming
      van artikel 3, eerste lid, onderdeel g, van die richtlijn en met dien verstande dat artikel 33, vierde lid, van
      overeenkomstige toepassing is;

      f. het konijne- of hazevlees, voor zover dat niet herkomstig is uit een derde land, niet zijnde Noorwegen, is
      voorzien van een keurmerk als bedoeld in hoofdstuk III van bijlage I van [richtlijn 91/495/EEG](31991L0495).

      g. voor zover het delen van geslachte dieren of uitgebeend konijne- of hazevlees betreft, onverminderd de
      onderdelen a tot en met g, het konijne- of hazevlees is verkregen in een erkende uitsnijderij als bedoeld in
      [artikel 31, tweede of vierde lid][ref3], met inachtneming van hoofdstuk VIII van bijlage I van [richtlijn 71/118/
      EEG](31971L0118);

      h. het vervoer van het konijne- of hazevlees onder bevredigende hygiënische omstandigheden plaatsvindt,
      overeenkomstig hoofdstuk V van bijlage I van [richtlijn 91/495/EEG](31991L0495);

      i. is voldaan aan:

      1°. de artikelen 4, eerste, tweede en zesde lid, 8, eerste lid, 9, eerste en derde lid, en 13 van [verordening
      1829/2003](32003R1829);

      2°. de artikelen 4, eerste, tweede, vierde en zesde lid, en 5, eerste en tweede lid, van [verordening 1830/2003]
      (32003R1830).

      2 Voor menselijke consumptie wordt ongeschikt verklaard:

      a. konijnevlees en hazevlees, waarvan is geconstateerd dat het een van de gebreken vertoont als bedoeld in artikel
      13, onderdeel a, van [richtlijn 91/495/EEG](31991L0495), en konijnevlees en hazevlees dat een behandeling heeft
      ondergaan als bedoeld in artikel 13, onderdeel c, van die richtlijn;

      b. voor zover een besluit is genomen als bedoeld in artikel 13, onderdeel b, van [richtlijn 91/495/EEG]
      (31991L0495), welk besluit in de Staatscourant is bekendgemaakt, konijnevlees en hazevlees waaraan stoffen
      zijn toegevoegd waardoor het vlees gevaarlijk of schadelijk kan worden voor de volksgezondheid, zoals bepaald
      overeenkomstig genoemd besluit.

      3 Tot afgifte van een certificaat als bedoeld in het eerste lid wordt slechts overgegaan, indien de partij vlees
      vergezeld gaat van een daartoe bestemd, op deze partij betrekking hebbend, aanvraagformulier.


