  - number: '7'
    text: |-
      1 Het vervoer van uit een derde land, niet zijnde Noorwegen, verzonden konijnenvlees of hazenvlees van de plaats
      waar de partij on Nederlands grondgebied wordt gebracht naar de plaats van bestemming is slechts toegestaan indien:

      a. het vlees afkomstig is uit een derde land of deel van een derde land dat voor de betrokken diersoort waarvan het
      vlees afkomstig is, vermeld staat op de lijst in bijlage II bij beschikking 2000/585/EG;

      b. het vlees vergezeld gaat van een op de partij betrekking hebbend gezondheidscertificaat waarvan het model
      overeenstemt met het voor de betrokken vleessoort uit het betrokken land van herkomst in beschikking 2000/585/EG
      vastgestelde model;

      c. het vlees voldoet aan de voorschriften die zijn vermeld op het in onderdeel b bedoelde certificaat en in
      beschikking 2000/585/EG, en

      d. het vlees afkomstig is uit een inrichting die, zodra deze is vastgesteld en in werking getreden, voorkomt op
      de voor konijnen- of hazenvlees uit het betrokken land van herkomst geldende voorlopige lijst van inrichtingen
      als bedoeld in beschikking 95/408/EG van de Raad van de Europese Unie van 22 juni 1995 tot vaststelling van
      voorschriften voor het opstellen voor een overgangsperiode van voorlopige lijsten van inrichtingen in derde
      landen waaruit de lid-staten bepaalde producten van dierlijke oorsprong, visserijproducten en levende tweekleppige
      weekdieren mogen invoeren (PbEG L 243), die alsdan ter inzage ligt in de bibliotheek van het Ministerie van
      Landbouw, Natuurbeheer en Visserij in Den Haag, met dien verstande dat indien bij de vaststelling van voornoemde
      lijst is voorzien in overgangsbepalingen het vlees met inachtneming van die bepalingen afkomstig mag zijn uit een
      inrichting die voldoet aan artikel 3 van [richtlijn 91/495/EEG](31991L0495).

      2 Een partij konijnen- of hazenvlees afkomstig uit Nieuw-Zeeland mag in afwijking van hetgeen in het eerste lid,
      onderdeel b, dan wel [paragraaf 2 van hoofdstuk 3 van de Regeling keuring en handel dierlijke producten][ref1]
      is bepaald ten aanzien van de voor dierlijke producten uit derde landen voorgeschreven gezondheidscertificaten,
      vergezeld gaan van een op de partij betrekking hebbend gezondheidscertificaat dat ingevolge de regelgeving van
      de Europese Gemeenschap ter uitvoering van de Overeenkomst van 17 december 1996 tussen de Europese Gemeenschap
      en Nieuw-Zeeland inzake sanitaire maatregelen voor de handel in levende dieren en dierlijke producten (PbEG 1997,
      L 57) is vastgesteld, indien de desbetreffende partij voldoet aan de ingevolge vorenbedoelde regelgeving gestelde
      bijkomende voorwaarden.

      3 Het vlees is niet afkomstig van konijnen waaraan stoffen zijn toegediend die ingevolge artikel 3, onderdeel
      a, van [richtlijn 96/22/EG](31996L0022) van de Raad van de Europese Gemeenschappen van 29 april 1996 betreffende
      het gebruik, in de veehouderij, van bepaalde stoffen met thyreostatische werking, alsmede van ß-agonisten en tot
      intrekking van de [Richtlijnen 81/602/EEG](31981L0602), [88/146/EEG](31988L0146) en [88/299/EEG](31988L0299) (PbEG
      L 125), niet aan konijnen mogen worden toegediend, tenzij aan de voorwaarden ingevolge artikel 11 van genoemde
      richtlijn is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Paragraaf2
