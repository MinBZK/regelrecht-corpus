    text: |-
      Degene die voornemens is konijnen of hazen bedrijfsmatig te slachten dan wel konijnevlees of hazevlees
      bedrijfsmatig uit te snijden waarschuwt de officiële dierenarts ten behoeve van de keuring van het vlees de werkdag
      tevoren tussen 8.15 en 17.00 en verleent de door de officiële dierenarts of diens assistenten verlangde medewerking
      of doet die medewerking verlenen.
    url: https://wetten.overheid.nl/BWBR0006051/2005-01-22#Artikel26
  - number: '27'
    text: |-
      Onverminderd het bepaalde in de [artikelen 2][ref1] tot en met [8][ref2] is het bedrijfsmatig slachten van
      konijnen of hazen alsmede het bedrijfsmatig voorhanden en in voorraad hebben, te koop aanbieden, afleveren,
      vervoeren, kopen, vervreemden en uitsnijden van konijnevlees of hazevlees slechts toegestaan indien:

      a. voor wat betreft het slachten van konijnen of hazen, alsmede het uitsnijden van het vlees daarvan, dit geschiedt
      in een op grond van [artikel 31][ref3] erkend slachthuis respectievelijk erkende uitsnijderij;

      b. voor wat betreft het voorhanden en in voorraad hebben, het te koop aanbieden, afleveren, vervoeren, kopen en
      vervreemden van konijnevlees of hazevlees het vlees is voorzien van:

      1. een door of vanwege de officiële dierenarts aangebracht keurmerk overeenkomstig
      [artikel 3, eerste lid, onderdeel g][ref4];

      2. een merk als bedoeld in hoofdstuk III van bijlage I van [richtlijn 91/495/EEG](31991L0495);

      3. een merk als bedoeld in hoofdstuk III van bijlage I van [richtlijn 91/495/EEG](31991L0495), met dien verstande
      dat de letters ‘EEG’ worden vervangen door het woord: GOEDGEKEURD, dan wel

      4. een merk als bedoeld in [artikel 7, onderdeel a][ref5];

      terwijl de opslag van het vlees geschiedt overeenkomstig [artikel 3, eerste lid, onderdeel f][ref6].


