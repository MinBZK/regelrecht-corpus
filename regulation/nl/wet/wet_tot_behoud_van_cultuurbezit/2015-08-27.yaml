  - number: '7'
    text: |-
      1 Het is verboden een beschermd voorwerp ter veiling te brengen, te vervreemden, te bezwaren, te verhuren, in
      bruikleen te geven of bij boedelscheiding aan een niet-ingezetene toe te delen, alvorens het voornemen daartoe
      schriftelijk aan de inspecteur is gemeld. Het is verboden de verblijfplaats van een beschermd voorwerp te wijzigen
      alvorens het voornemen daartoe schriftelijk aan de inspecteur is gemeld.

      2 Gedurende vier weken na de datum van verzending van de melding is het verboden zonder toestemming van de
      inspecteur of van Onze Minister een in het eerste lid bedoelde handeling te verrichten. Tenzij na melding van het
      ter veiling brengen van een beschermd voorwerp door Onze Minister daartegen geen bedenkingen zijn aangevoerd of
      naar aanleiding van het ter veiling brengen van een roerende zaak [artikel 3a, eerste lid][ref1], toepassing heeft
      gevonden, kan Onze Minister deze termijn met ten hoogste acht weken verlengen. Dit lid is niet van toepassing
      indien de melding slechts het voornemen tot verplaatsing binnen Nederland betreft.

      3 Indien een in het eerste lid bedoelde handeling strekt tot het brengen van een beschermd voorwerp buiten
      Nederland, kan slechts Onze Minister toestemming geven. Na verloop van de al dan niet verlengde termijn van het
      vorige lid zonder dat bedenkingen zijn aangevoerd, bevestigt Onze Minister binnen acht dagen na een verzoek daartoe
      schriftelijk dat geen bedenkingen bestaan tegen een handeling, mits verricht binnen een jaar na melding. In de
      bevestiging worden de handeling en de datum aangegeven.

      4 Een in het eerste lid bedoelde handeling is eveneens verboden nadat Onze Minister hem die de melding heeft
      gedaan, binnen de al dan niet verlengde termijn van het tweede lid, schriftelijk in kennis heeft gesteld van zijn
      bedenkingen tegen de handeling. De bedenkingen kunnen slechts zijn gegrond op de overweging dat het teloorgaan van
      het beschermd voorwerp voor het in Nederland aanwezige cultuurbezit te duchten is.

      5 Indien geen bedenkingen zijn aangevoerd, is een handeling als bedoeld in het eerste lid betreffende hetzelfde
      beschermd voorwerp opnieuw verboden, nadat een jaar is verstreken sinds de datum van de melding.

      6 Indien bedenkingen zijn aangevoerd en Onze Minister deze intrekt, is een handeling als bedoeld in het eerste lid
      betreffende hetzelfde beschermd voorwerp opnieuw verboden, nadat een jaar is verstreken sinds de dag waarop die
      intrekking aan de eigenaar is meegedeeld.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel3a
