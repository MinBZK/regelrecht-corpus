  - number: 14a
    text: |-
      1 Het is verboden een roerende zaak die integrerend deel uitmaakt van een openbare collectie die vermeld staat in
      de inventarislijst van een museum, een archief of een vaste collectie van een bibliotheek, en waarvan de Staat of
      een ander openbaar lichaam eigenaar is, buiten Nederland te brengen zonder dat de eigenaar daartoe schriftelijk
      toestemming heeft gegeven. Indien de eigenaar zich te dier zake niet verklaart, kan zijn toestemming op verzoek van
      een belanghebbende worden vervangen door een vergunning van Onze Minister.

      2 Het verbod, bedoeld in het eerste lid, geldt eveneens ten aanzien van een roerende zaak die integrerend deel
      uitmaakt van:

      a. een inventarislijst van roerende zaken van cultuurhistorische of wetenschappelijke betekenis waarvan een
      kerkgenootschap, een zelfstandig onderdeel daarvan, of een ander genootschap op religieuze grondslag eigenaar is;

      b. een openbare collectie die vermeld staat in de inventarislijst van een museum, een archief of een vaste
      collectie van een bibliotheek, en waarvan de eigendom berust bij een privaatrechtelijke rechtspersoon die in
      overwegende mate wordt gefinancierd door subsidie, die door de Staat of een ander overheidslichaam wordt verstrekt
      en die door Onze Minister voor de toepassing van dit verbod is aangewezen;

      c. de inventarislijst die door Onze Minister wordt bijgehouden van roerende zaken van cultuurhistorische of
      wetenschappelijke betekenis.

      3 Het verbod, bedoeld in het eerste lid, geldt bovendien voor:

      a. beschermde monumenten en onderdelen daarvan in de zin van [artikel 1, onder d, van de Monumentenwet 1988][ref1];

      b. onrechtmatig opgegraven voorwerpen;

      c. archiefbescheiden en onderdelen daarvan in de zin van
      [artikel 1, onder c, nummers 1°, 2° en 3°, van de Archiefwet 1995][ref2], mits zij ouder zijn dan vijftig jaren.

      4 [Artikel 9, tweede lid][ref3], is van overeenkomstige toepassing.


