  - number: 3c
    text: |-
      1 Onze Minister houdt van de beschermde voorwerpen en beschermde verzamelingen een lijst van beschermde voorwerpen
      bij.

      2 Op de lijst wordt in ieder geval vermeld:

      a. voorzover het betreft een beschermd voorwerp: een beschrijving van dat beschermd voorwerp en de reden tot
      aanwijzing daarvan, en

      b. voorzover het betreft een beschermde verzameling: een algemene omschrijving van die beschermde verzameling, een
      opsomming van de beschermde voorwerpen die tot die beschermde verzameling behoren, en de reden tot aanwijzing van
      die beschermde verzameling.

      3 Een vermelding op de lijst mag slechts met toestemming van de eigenaar een aanduiding bevatten van de naam van
      de eigenaar of een zijner verwanten dan wel van de verblijfplaats van het beschermd voorwerp of de beschermde
      verzameling.

      4 Een afschrift van de lijst, zonder vermelding van eigenaren en verblijfplaatsen van de beschermde voorwerpen
      en beschermde verzamelingen, ligt kosteloos voor een ieder ter inzage op het Ministerie van Onderwijs, Cultuur en
      Wetenschap. Afschrift daarvan wordt tegen vergoeding van de kosten verstrekt.
    url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#Artikel3c
  - number: 3d
    text: |-
      1 Onze Minister kan ambtshalve of op verzoek van de eigenaar wijzigingen aanbrengen in de beschrijving van een
      beschermd voorwerp dan wel in de algemene omschrijving of de opsomming van een beschermde verzameling, een en ander
      voorzover het betreft verbetering van gegevens van feitelijke aard.

      2 Onze Minister kan, de Raad gehoord, de aanwijzing als beschermd voorwerp of als beschermde verzameling
      beëindigen, de reden tot aanwijzing wijzigen en roerende zaken aan de opsomming van een beschermde verzameling
      toevoegen of in die opsomming schrappen.
    url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#Artikel3d
  - number: '4'
    text: |-
      1 Aanwijzing van een roerende zaak als beschermd voorwerp of opneming van een roerende zaak in de opsomming van een
      beschermde verzameling kan slechts met toestemming van de eigenaar, indien deze zaak:

      a. eigendom is van zijn vervaardiger of van de erfgenaam van de vervaardiger;

      b. eigendom is van degene die het in Nederland heeft gebracht of degene die het binnen vijf jaar, nadat het in
      Nederland is gebracht, heeft verworven of hun erfgenaam.

      2 Het bepaalde in het vorige lid is ook van toepassing op een erfgenaam, die de roerende zaak anders dan door
      vererving heeft verkregen.

      3 Het bepaalde in het eerste lid is slechts van toepassing op een erfgenaam tot dertig jaar of voorzover het
      archiefbescheiden betreft vijftig jaar na het overlijden van de erflater.

      4 Indien de eigendom, bedoeld in het eerste lid, onderdeel b, toebehoort aan of is verworven door een
      rechtspersoon, is het eerste lid slechts van toepassing tot dertig jaar of voorzover het archiefbescheiden betreft
      vijftig jaar nadat de rechtspersoon het voorwerp in Nederland heeft doen brengen onderscheidenlijk de eigendom van
      het voorwerp binnen vijf jaar, nadat het in Nederland is gebracht, heeft verworven.

      5 Het terugvoeren naar Nederland van een roerende zaak die tijdelijk buiten Nederland heeft verbleven, geldt niet
      als het in Nederland brengen in de zin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#Artikel4
  - number: '5'
    text: |-
      1 Indien een roerende zaak als bedoeld in [artikel 2, eerste lid][ref1], een verzameling of een deel daarvan:

      a. berust onder iemand die tijdelijk zijn woonplaats naar Nederland verplaatst;

      b. door een niet-ingezetene wordt uitgeleend voor tentoonstelling in Nederland;

      c. wegens hiermee vergelijkbare omstandigheden naar het oordeel van Onze Minister, de Raad gehoord, niet in
      Nederland thuis behoort; zegt Onze Minister desgevraagd of eigener beweging toe, dat deze niet wordt aangewezen als
      beschermd voorwerp onderscheidenlijk beschermde verzameling.

      2 Onze Minister trekt de toezegging in, wanneer de omstandigheden, op grond waarvan zij is gedaan niet meer
      aanwezig zijn. In zulk een geval gaat Onze Minister niet over tot toepassing van deze wet binnen één jaar na de
      datum van intrekking.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel2
