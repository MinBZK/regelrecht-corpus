  - number: 3a
    text: |-
      1 In spoedgevallen kan Onze Minister roerende zaken als bedoeld in [artikel 2, eerste lid][ref1], of een
      verzameling als bedoeld in [artikel 3, eerste lid][ref2], als beschermd voorwerp onderscheidenlijk als beschermde
      verzameling aanwijzen, voordat het advies van de Raad is ingewonnen. In dat geval wordt het advies van de Raad
      gevraagd tegelijkertijd met de aanwijzing.

      2 Bij de bekendmaking van een aanwijzing als bedoeld in het eerste lid vermeldt Onze Minister dat de Raad nog niet
      is gehoord.


