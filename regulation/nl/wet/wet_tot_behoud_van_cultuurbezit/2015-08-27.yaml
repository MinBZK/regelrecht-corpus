  - number: '12'
    text: |-
      1 Onze Minister treedt onverwijld na de kennisgeving van bedenkingen als bedoeld in [artikel 7, vierde lid][ref1],
      met de eigenaar in onderhandeling over de koopprijs en de overige verkoopvoorwaarden.

      2 Indien de onderhandelingen niet tot overeenstemming leiden, wordt de prijs op verzoek van de meest gerede
      partij vastgesteld door de rechtbank Den Haag, tenzij de eigenaar te kennen geeft af te zien van de in
      [artikel 7, eerste lid][ref2], bedoelde handeling of Onze Minister de daartegen aangevoerde bedenkingen intrekt.

      3 Alvorens te beslissen wint de rechtbank advies van deskundigen in. De griffier zendt een afschrift van het
      deskundigenadvies aan de verzoeker en de wederpartij. Deze kunnen binnen een door de rechter te bepalen termijn hun
      beschouwingen over het advies ter griffie indienen.

      4 Tegen beschikkingen op grond van dit artikel staat uitsluitend beroep in cassatie open.


