  - number: 3b
    text: |-
      1 Indien Onze Minister op grond van [artikel 3a][ref1] een verzameling als beschermde verzameling aanwijst,
      kan hij, in afwijking van artikel 3, eerste lid, tweede volzin, bij de aanwijzing volstaan met een algemene
      omschrijving van die verzameling.

      2 Onze Minister stelt zo spoedig mogelijk na een aanwijzing als bedoeld in het eerste lid, de eigenaar en de Raad
      gehoord, alsnog een opsomming vast van de tot de beschermde verzameling behorende roerende zaken.

      3 Zolang nog geen opsomming van de beschermde verzameling is vastgesteld, is iedere roerende zaak die
      redelijkerwijs onder de algemene omschrijving van die beschermde verzameling valt, een beschermd voorwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel3a
