preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het behoud van het Nederlands cultuurbezit te
    bevorderen door het vaststellen van bepalingen die de mogelijkheid openen te voorkomen dat voorwerpen van
    bijzondere cultuur-historische of wetenschappelijke betekenis teloorgaan voor het Nederlands cultuurbezit;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. beschermd voorwerp: een roerende zaak die op grond van [artikel 2][ref1] is aangewezen als beschermd voorwerp,
      dan wel ingevolge [artikel 3, derde lid][ref2], of [artikel 3b, derde lid][ref3], beschermd voorwerp is;

      b. verzameling: roerende zaken, die uit cultuurhistorisch of wetenschappelijk oogpunt bij elkaar behoren;

      c. beschermde verzameling: een verzameling die op grond van [artikel 3][ref4] is aangewezen als beschermde
      verzameling;

      d. de Raad: de Raad voor cultuur, bedoeld in [artikel 2a van de Wet op het specifiek cultuurbeleid][ref5];

      e. Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;

      f. de inspecteur: de als zodanig bij besluit van Onze Minister aangewezen ambtenaar.

      2 Van een besluit als bedoeld in het eerste lid, onderdeel f, wordt mededeling gedaan door plaatsing in de
      Staatscourant.


