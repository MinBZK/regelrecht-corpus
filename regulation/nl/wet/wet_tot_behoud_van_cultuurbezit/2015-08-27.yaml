  - number: '2'
    text: |-
      1 Onze Minister kan, de Raad gehoord, roerende zaken van bijzondere cultuurhistorische of wetenschappelijke
      betekenis, die als onvervangbaar en onmisbaar behoren te worden behouden voor het Nederlands cultuurbezit,
      aanwijzen als beschermd voorwerp.

      2 Onvervangbaar als bedoeld in het eerste lid is een roerende zaak, waarvan geen of nagenoeg geen andere gelijke of
      gelijksoortige voorwerpen in goede staat in Nederland aanwezig zijn.

      3 Onmisbaar als bedoeld in het eerste lid is een roerende zaak, die tenminste een van de volgende functies heeft:

      a. een symboolfunctie, waaronder wordt verstaan de functie van een roerende zaak als duidelijke herinnering aan
      personen of gebeurtenissen, die voor de Nederlandse geschiedenis van overtuigend belang zijn;

      b. een schakelfunctie, waaronder wordt verstaan de functie van een roerende zaak als wezenlijk element in een
      ontwikkeling, die voor de wetenschapsbeoefening, met inbegrip van de beoefening der cultuurgeschiedenis, in
      Nederland van overtuigend belang is;

      c. een ijkfunctie, waaronder wordt verstaan de functie van een roerende zaak als wezenlijke bijdrage in het
      onderzoek of de kennis van andere belangrijke voorwerpen van kunst of wetenschap.
    url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#Artikel2
  - number: '3'
    text: |-
      1 Onze Minister kan, de eigenaar en de Raad gehoord, een verzameling van bijzondere cultuurhistorische of
      wetenschappelijke betekenis, die hetzij als zodanig, hetzij door een of meer van de roerende zaken die er een
      wezenlijk onderdeel van uitmaken, als onvervangbaar en onmisbaar behoort te worden behouden voor het Nederlands
      cultuurbezit, aanwijzen als beschermde verzameling. De aanwijzing gaat vergezeld van een algemene omschrijving van
      de beschermde verzameling en van een opsomming van de roerende zaken die tot de beschermde verzameling behoren.

      2 [Artikel 2, tweede en derde lid][ref1], is van overeenkomstige toepassing.

      3 Iedere roerende zaak die deel uitmaakt van een opsomming als bedoeld in het eerste lid is een beschermd voorwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel2
