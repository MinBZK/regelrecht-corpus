  - number: '18'
    text: |-
      De inspecteur en de in [artikel 15, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd te vorderen dat de bewoner
      hun een beschermd voorwerp, een roerende zaak als bedoeld in [artikel 14a][ref2], of een cultuurgoed als bedoeld in
      [artikel 14b][ref3], die in de woning aanwezig zijn, toont.


