  - number: '9'
    text: |-
      1 De eigenaar van een beschermd voorwerp is verplicht degene aan wie hij het voorwerp vervreemdt of aan wie hij
      met betrekking tot het voorwerp rechten verleent te voren in te lichten over dat dat voorwerp is aangewezen als
      beschermd voorwerp.

      2 Hij die een beschermd voorwerp onder zich heeft is verplicht het aan de inspecteur op diens aanvraag te tonen en
      de vermissing of het teniet gaan ervan onverwijld aan hem te melden.
    url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#Artikel9
  - number: '10'
    text: |-
      1 Een kennisgeving van Onze Minister tot het aanvoeren van bedenkingen geldt gedurende drie maanden als aanbod
      van de Staat tot aankoop op de in [artikel 12][ref1] geregelde wijze van het beschermd voorwerp door de Staat
      voorzover:

      a. bedenkingen zijn aangevoerd tegen vervreemding daarvan of

      b. bedenkingen zijn aangevoerd tegen toedeling daarvan aan een niet-ingezetene of

      c. bedenkingen zijn aangevoerd tegen verplaatsing naar de - buiten Nederland gelegen - vaste woonplaats van de
      eigenaar.

      2 Onze Minister en de eigenaar van het beschermd voorwerp kunnen de in het eerste lid bedoelde termijn in onderling
      overleg verlengen.

      3 De in het eerste lid bedoelde termijn wordt opgeschort, zolang over een aanbod van de Staat tot aankoop van een
      beschermd voorwerp:

      a. bij de rechtbank Den Haag een procedure als bedoeld in [artikel 12, tweede lid][ref2], aanhangig is, of

      b. tussen de Staat en de eigenaar een overeenkomst tot arbitrage bestaat.

      4 Het aanvoeren van bedenkingen geldt niet als een aanbod tot aankoop, indien bij de kennisgeving daarvan een
      mededeling is gedaan als bedoeld in [artikel 8][ref3].


