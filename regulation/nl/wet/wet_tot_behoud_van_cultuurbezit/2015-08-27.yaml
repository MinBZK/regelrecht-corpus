  - number: 14b
    text: |-
      1 Het is verboden zonder vergunning van Onze Minister of van een andere bevoegde autoriteit als bedoeld in artikel
      2, tweede lid, van verordening (EG) nr. 116/2009 van de Raad van de Europese Unie van 18 december 2008 betreffende
      de uitvoer van cultuurgoederen (PbEU L. 39), cultuurgoederen die behoren tot een categorie, vermeld in de bijlage
      bij genoemde verordening, uit te voeren buiten het grondgebied van de lidstaten van de Europese Unie.

      2 Onze Minister kan bepalen dat het verbod, bedoeld in het eerste lid, niet geldt ten aanzien van oudheidkundige
      voorwerpen ouder dan honderd jaren, die afkomstig zijn van opgravingen en vondsten op het land en in de zee dan
      wel van oudheidkundige locaties, wanneer deze goederen van beperkt archeologisch of wetenschappelijk belang zijn en
      mits zij niet rechtstreeks afkomstig zijn van opgravingen, vondsten en archeologische locaties in een lidstaat van
      de Europese Unie, en zij zich legaal op de markt bevinden.
    url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#Artikel14b
  - number: '15'
    text: |-
      1 Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de inspecteur en de bij
      besluit van Onze Minister daartoe aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003659/2015-08-27#Artikel15
  - number: '16'
    text: |-
      1 Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast:

      a. de inspecteur en de in [artikel 15, eerste lid][ref2], bedoelde ambtenaren, voorzover zij daartoe bij besluit
      van Onze Minister van Veiligheid en Justitie zijn aangewezen;

      b. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.

      Deze ambtenaren zijn tevens belast met de opsporing van de feiten strafbaar gesteld in de [artikelen 179][ref3] tot
      en met [182][ref4] en [184 van het Wetboek van Strafrecht][ref5], voorzover deze feiten betrekking hebben op een
      bevel, vordering of handeling, gedaan of ondernomen door henzelf.

      2 De in het eerste lid bedoelde ambtenaren zijn belast met het op verzoek van een lidstaat van de Europese Unie
      of van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte opsporen van
      een door die staat in het verzoek omschreven roerende zaak die krachtens de nationale wetgeving van die staat een
      cultuurgoed is in de zin van artikel 2, onder 1, van Richtlijn 2014/60/EU van het Europees Parlement en de Raad van
      15 mei 2014 betreffende de teruggave van cultuurgoederen die op onrechtmatige wijze buiten het grondgebied van een
      lidstaat zijn gebracht en houdende wijziging van Verordening (EU) nr. 1024/2012 (PbEU 2014, L 159), mits die zaak
      in de zin van die richtlijn op onrechtmatige wijze buiten het grondgebied van die staat is gebracht.

      3 Een wijziging van de richtlijn 2014/60/EU gaat voor de toepassing van dit artikel gelden met ingang van de dag
      waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel besluit, dat in
      de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.

      4 Van een besluit als bedoeld in het eerste lid, onderdeel *a*, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.


