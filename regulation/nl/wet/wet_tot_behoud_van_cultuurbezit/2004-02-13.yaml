---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_tot_behoud_van_cultuurbezit
regulatory_layer: WET
publication_date: '2015-12-18'
valid_from: '2004-02-13'
bwb_id: BWBR0003659
url: https://wetten.overheid.nl/BWBR0003659/2004-02-13
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is het behoud van het Nederlands cultuurbezit te
    bevorderen door het vaststellen van bepalingen die de mogelijkheid openen te voorkomen dat voorwerpen van
    bijzondere cultuur-historische of wetenschappelijke betekenis teloorgaan voor het Nederlands cultuurbezit;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
  - number: 1.1.a
    text: |-
      beschermd voorwerp: een roerende zaak die op grond van [artikel 2][ref1] is aangewezen als beschermd voorwerp, dan
      wel ingevolge [artikel 3, derde lid][ref2], of [artikel 3b, derde lid][ref3], beschermd voorwerp is;


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003659#Artikel3b
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003659
        artikel: '3'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0003659
        artikel: 3b
        hoofdstuk: II
  - number: 1.1.b
    text: 'verzameling: roerende zaken, die uit cultuurhistorisch of wetenschappelijk oogpunt bij elkaar behoren;'
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
  - number: 1.1.c
    text: |-
      beschermde verzameling: een verzameling die op grond van [artikel 3][ref1] is aangewezen als beschermde
      verzameling;


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel3
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '3'
        hoofdstuk: II
  - number: 1.1.d
    text: |-
      de Raad: de Raad voor cultuur, bedoeld in [artikel 2a van de Wet op het specifiek cultuurbeleid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005904#Artikel2a
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005904
        artikel: 2a
  - number: 1.1.e
    text: 'Onze Minister: Onze Minister van Onderwijs, Cultuur en Wetenschap;'
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
  - number: 1.1.f
    text: 'de inspecteur: de als zodanig bij besluit van Onze Minister aangewezen ambtenaar.'
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
  - number: '1.2'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel f, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister kan, de Raad gehoord, roerende zaken van bijzondere cultuurhistorische of wetenschappelijke
      betekenis, die als onvervangbaar en onmisbaar behoren te worden behouden voor het Nederlands cultuurbezit,
      aanwijzen als beschermd voorwerp.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel2
  - number: '2.2'
    text: |-
      Onvervangbaar als bedoeld in het eerste lid is een roerende zaak, waarvan geen of nagenoeg geen andere gelijke of
      gelijksoortige voorwerpen in goede staat in Nederland aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel2
  - number: '2.3'
    text: 'Onmisbaar als bedoeld in het eerste lid is een roerende zaak, die tenminste een van de volgende functies heeft:'
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel2
  - number: 2.3.a
    text: |-
      een symboolfunctie, waaronder wordt verstaan de functie van een roerende zaak als duidelijke herinnering aan
      personen of gebeurtenissen, die voor de Nederlandse geschiedenis van overtuigend belang zijn;
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel2
  - number: 2.3.b
    text: |-
      een schakelfunctie, waaronder wordt verstaan de functie van een roerende zaak als wezenlijk element in een
      ontwikkeling, die voor de wetenschapsbeoefening, met inbegrip van de beoefening der cultuurgeschiedenis, in
      Nederland van overtuigend belang is;
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel2
  - number: 2.3.c
    text: |-
      een ijkfunctie, waaronder wordt verstaan de functie van een roerende zaak als wezenlijke bijdrage in het onderzoek
      of de kennis van andere belangrijke voorwerpen van kunst of wetenschap.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister kan, de eigenaar en de Raad gehoord, een verzameling van bijzondere cultuurhistorische of
      wetenschappelijke betekenis, die hetzij als zodanig, hetzij door een of meer van de roerende zaken die er een
      wezenlijk onderdeel van uitmaken, als onvervangbaar en onmisbaar behoort te worden behouden voor het Nederlands
      cultuurbezit, aanwijzen als beschermde verzameling. De aanwijzing gaat vergezeld van een algemene omschrijving van
      de beschermde verzameling en van een opsomming van de roerende zaken die tot de beschermde verzameling behoren.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3
  - number: '3.2'
    text: |-
      [Artikel 2, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel2
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '2'
        hoofdstuk: II
  - number: '3.3'
    text: Iedere roerende zaak die deel uitmaakt van een opsomming als bedoeld in het eerste lid is een beschermd voorwerp.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3
  - number: 3a.1
    text: |-
      In spoedgevallen kan Onze Minister roerende zaken als bedoeld in [artikel 2, eerste lid][ref1], of een verzameling
      als bedoeld in [artikel 3, eerste lid][ref2], als beschermd voorwerp onderscheidenlijk als beschermde verzameling
      aanwijzen, voordat het advies van de Raad is ingewonnen. In dat geval wordt het advies van de Raad gevraagd
      tegelijkertijd met de aanwijzing.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel3
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '2'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0003659
        artikel: '3'
        hoofdstuk: II
  - number: 3a.2
    text: |-
      Bij de bekendmaking van een aanwijzing als bedoeld in het eerste lid vermeldt Onze Minister dat de Raad nog niet
      is gehoord.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3a
  - number: 3b.1
    text: |-
      Indien Onze Minister op grond van [artikel 3a][ref1] een verzameling als beschermde verzameling aanwijst, kan hij,
      in afwijking van artikel 3, eerste lid, tweede volzin, bij de aanwijzing volstaan met een algemene omschrijving van
      die verzameling.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: 3a
        hoofdstuk: II
  - number: 3b.2
    text: |-
      Onze Minister stelt zo spoedig mogelijk na een aanwijzing als bedoeld in het eerste lid, de eigenaar en de Raad
      gehoord, alsnog een opsomming vast van de tot de beschermde verzameling behorende roerende zaken.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3b
  - number: 3b.3
    text: |-
      Zolang nog geen opsomming van de beschermde verzameling is vastgesteld, is iedere roerende zaak die redelijkerwijs
      onder de algemene omschrijving van die beschermde verzameling valt, een beschermd voorwerp.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3b
  - number: 3c.1
    text: |-
      Onze Minister houdt van de beschermde voorwerpen en beschermde verzamelingen een lijst van beschermde voorwerpen
      bij.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3c
  - number: 3c.2
    text: 'Op de lijst wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3c
  - number: 3c.2.a
    text: |-
      voorzover het betreft een beschermd voorwerp: een beschrijving van dat beschermd voorwerp en de reden tot
      aanwijzing daarvan, en
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3c
  - number: 3c.2.b
    text: |-
      voorzover het betreft een beschermde verzameling: een algemene omschrijving van die beschermde verzameling, een
      opsomming van de beschermde voorwerpen die tot die beschermde verzameling behoren, en de reden tot aanwijzing van
      die beschermde verzameling.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3c
  - number: 3c.3
    text: |-
      Een vermelding op de lijst mag slechts met toestemming van de eigenaar een aanduiding bevatten van de naam van
      de eigenaar of een zijner verwanten dan wel van de verblijfplaats van het beschermd voorwerp of de beschermde
      verzameling.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3c
  - number: 3c.4
    text: |-
      Een afschrift van de lijst, zonder vermelding van eigenaren en verblijfplaatsen van de beschermde voorwerpen en
      beschermde verzamelingen, ligt kosteloos voor een ieder ter inzage op het Ministerie van Onderwijs, Cultuur en
      Wetenschap. Afschrift daarvan wordt tegen vergoeding van de kosten verstrekt.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3c
  - number: 3d.1
    text: |-
      Onze Minister kan ambtshalve of op verzoek van de eigenaar wijzigingen aanbrengen in de beschrijving van een
      beschermd voorwerp dan wel in de algemene omschrijving of de opsomming van een beschermde verzameling, een en ander
      voorzover het betreft verbetering van gegevens van feitelijke aard.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3d
  - number: 3d.2
    text: |-
      Onze Minister kan, de Raad gehoord, de aanwijzing als beschermd voorwerp of als beschermde verzameling beëindigen,
      de reden tot aanwijzing wijzigen en roerende zaken aan de opsomming van een beschermde verzameling toevoegen of in
      die opsomming schrappen.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel3d
  - number: '4.1'
    text: |-
      Aanwijzing van een roerende zaak als beschermd voorwerp of opneming van een roerende zaak in de opsomming van een
      beschermde verzameling kan slechts met toestemming van de eigenaar, indien deze zaak:
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel4
  - number: 4.1.a
    text: eigendom is van zijn vervaardiger of van de erfgenaam van de vervaardiger;
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel4
  - number: 4.1.b
    text: |-
      eigendom is van degene die het in Nederland heeft gebracht of degene die het binnen vijf jaar, nadat het in
      Nederland is gebracht, heeft verworven of hun erfgenaam.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel4
  - number: '4.2'
    text: |-
      Het bepaalde in het vorige lid is ook van toepassing op een erfgenaam, die de roerende zaak anders dan door
      vererving heeft verkregen.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel4
  - number: '4.3'
    text: |-
      Het bepaalde in het eerste lid is slechts van toepassing op een erfgenaam tot dertig jaar of voorzover het
      archiefbescheiden betreft vijftig jaar na het overlijden van de erflater.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel4
  - number: '4.4'
    text: |-
      Indien de eigendom, bedoeld in het eerste lid, onderdeel b, toebehoort aan of is verworven door een rechtspersoon,
      is het eerste lid slechts van toepassing tot dertig jaar of voorzover het archiefbescheiden betreft vijftig jaar
      nadat de rechtspersoon het voorwerp in Nederland heeft doen brengen onderscheidenlijk de eigendom van het voorwerp
      binnen vijf jaar, nadat het in Nederland is gebracht, heeft verworven.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel4
  - number: '4.5'
    text: |-
      Het terugvoeren naar Nederland van een roerende zaak die tijdelijk buiten Nederland heeft verbleven, geldt niet als
      het in Nederland brengen in de zin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel4
  - number: '5.1'
    text: |-
      Indien een roerende zaak als bedoeld in [artikel 2, eerste lid][ref1], een verzameling of een deel daarvan:


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel2
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '2'
        hoofdstuk: II
  - number: 5.1.a
    text: berust onder iemand die tijdelijk zijn woonplaats naar Nederland verplaatst;
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel5
  - number: 5.1.b
    text: door een niet-ingezetene wordt uitgeleend voor tentoonstelling in Nederland;
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel5
  - number: 5.1.c
    text: |-
      wegens hiermee vergelijkbare omstandigheden naar het oordeel van Onze Minister, de Raad gehoord, niet in Nederland
      thuis behoort; zegt Onze Minister desgevraagd of eigener beweging toe, dat deze niet wordt aangewezen als beschermd
      voorwerp onderscheidenlijk beschermde verzameling.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister trekt de toezegging in, wanneer de omstandigheden, op grond waarvan zij is gedaan niet meer aanwezig
      zijn. In zulk een geval gaat Onze Minister niet over tot toepassing van deze wet binnen één jaar na de datum van
      intrekking.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel5
  - number: '6'
    text: |-
      Aanwijzing als beschermd voorwerp geldt tevens als aanwijzing in de zin van artikel 1 van de op 17 november 1970 te
      Parijs tot stand gekomen overeenkomst (*Trb.* 1972, nr. 50) inzake de middelen om de onrechtmatige invoer, uitvoer
      of eigendomsoverdracht van culturele goederen te verbieden.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel6
  - number: '7.1'
    text: |-
      Het is verboden een beschermd voorwerp ter veiling te brengen, te vervreemden, te bezwaren, te verhuren, in
      bruikleen te geven of bij boedelscheiding aan een niet-ingezetene toe te delen, alvorens het voornemen daartoe
      schriftelijk aan de inspecteur is gemeld. Het is verboden de verblijfplaats van een beschermd voorwerp te wijzigen
      alvorens het voornemen daartoe schriftelijk aan de inspecteur is gemeld.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel7
  - number: '7.2'
    text: |-
      Gedurende vier weken na de datum van verzending van de melding is het verboden zonder toestemming van de inspecteur
      of van Onze Minister een in het eerste lid bedoelde handeling te verrichten. Tenzij na melding van het ter veiling
      brengen van een beschermd voorwerp door Onze Minister daartegen geen bedenkingen zijn aangevoerd of naar aanleiding
      van het ter veiling brengen van een roerende zaak [artikel 3a, eerste lid][ref1], toepassing heeft gevonden, kan
      Onze Minister deze termijn met ten hoogste acht weken verlengen. Dit lid is niet van toepassing indien de melding
      slechts het voornemen tot verplaatsing binnen Nederland betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel3a
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: 3a
        hoofdstuk: II
  - number: '7.3'
    text: |-
      Indien een in het eerste lid bedoelde handeling strekt tot het brengen van een beschermd voorwerp buiten Nederland,
      kan slechts Onze Minister toestemming geven. Na verloop van de al dan niet verlengde termijn van het vorige
      lid zonder dat bedenkingen zijn aangevoerd, bevestigt Onze Minister binnen acht dagen na een verzoek daartoe
      schriftelijk dat geen bedenkingen bestaan tegen een handeling, mits verricht binnen een jaar na melding. In de
      bevestiging worden de handeling en de datum aangegeven.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel7
  - number: '7.4'
    text: |-
      Een in het eerste lid bedoelde handeling is eveneens verboden nadat Onze Minister hem die de melding heeft
      gedaan, binnen de al dan niet verlengde termijn van het tweede lid, schriftelijk in kennis heeft gesteld van zijn
      bedenkingen tegen de handeling. De bedenkingen kunnen slechts zijn gegrond op de overweging dat het teloorgaan van
      het beschermd voorwerp voor het in Nederland aanwezige cultuurbezit te duchten is.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel7
  - number: '7.5'
    text: |-
      Indien geen bedenkingen zijn aangevoerd, is een handeling als bedoeld in het eerste lid betreffende hetzelfde
      beschermd voorwerp opnieuw verboden, nadat een jaar is verstreken sinds de datum van de melding.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel7
  - number: '7.6'
    text: |-
      Indien bedenkingen zijn aangevoerd en Onze Minister deze intrekt, is een handeling als bedoeld in het eerste lid
      betreffende hetzelfde beschermd voorwerp opnieuw verboden, nadat een jaar is verstreken sinds de dag waarop die
      intrekking aan de eigenaar is meegedeeld.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel7
  - number: '8'
    text: |-
      Onze Minister kan in zijn in [artikel 7, vierde lid][ref1], bedoelde kennisgeving meedelen dat het verbod
      niet geldt voorzover aan de gemelde handeling uitvoering wordt gegeven met inachtneming van de door hem in die
      kennisgeving vermelde voorschriften. Deze voorschriften mogen slechts strekken ter voorkoming van het teloorgaan
      van het beschermd voorwerp voor het in Nederland aanwezige cultuurbezit.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel7
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '7'
        hoofdstuk: III
  - number: '9.1'
    text: |-
      De eigenaar van een beschermd voorwerp is verplicht degene aan wie hij het voorwerp vervreemdt of aan wie hij
      met betrekking tot het voorwerp rechten verleent te voren in te lichten over dat dat voorwerp is aangewezen als
      beschermd voorwerp.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel9
  - number: '9.2'
    text: |-
      Hij die een beschermd voorwerp onder zich heeft is verplicht het aan de inspecteur op diens aanvraag te tonen en de
      vermissing of het teniet gaan ervan onverwijld aan hem te melden.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel9
  - number: '10.1'
    text: |-
      Een kennisgeving van Onze Minister tot het aanvoeren van bedenkingen geldt gedurende drie maanden als aanbod van de
      Staat tot aankoop op de in [artikel 12][ref1] geregelde wijze van het beschermd voorwerp door de Staat voorzover:


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel12
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '12'
        hoofdstuk: III
  - number: 10.1.a
    text: bedenkingen zijn aangevoerd tegen vervreemding daarvan of
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
  - number: 10.1.b
    text: bedenkingen zijn aangevoerd tegen toedeling daarvan aan een niet-ingezetene of
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
  - number: 10.1.c
    text: |-
      bedenkingen zijn aangevoerd tegen verplaatsing naar de - buiten Nederland gelegen - vaste woonplaats van de
      eigenaar.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
  - number: '10.2'
    text: |-
      Onze Minister en de eigenaar van het beschermd voorwerp kunnen de in het eerste lid bedoelde termijn in onderling
      overleg verlengen.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
  - number: '10.3'
    text: |-
      De in het eerste lid bedoelde termijn wordt opgeschort, zolang over een aanbod van de Staat tot aankoop van een
      beschermd voorwerp:
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
  - number: 10.3.a
    text: |-
      bij de arrondissementsrechtbank te 's-Gravenhage een procedure als bedoeld in [artikel 12, tweede lid][ref1],
      aanhangig is, of


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel12
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '12'
        hoofdstuk: III
  - number: 10.3.b
    text: tussen de Staat en de eigenaar een overeenkomst tot arbitrage bestaat.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
  - number: '10.4'
    text: |-
      Het aanvoeren van bedenkingen geldt niet als een aanbod tot aankoop, indien bij de kennisgeving daarvan een
      mededeling is gedaan als bedoeld in [artikel 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel8
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '8'
        hoofdstuk: III
  - number: '12.1'
    text: |-
      Onze Minister treedt onverwijld na de kennisgeving van bedenkingen als bedoeld in artikel 7, vierde lid, met de
      eigenaar in onderhandeling over de koopprijs en de overige verkoopvoorwaarden.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel12
  - number: '12.2'
    text: |-
      Indien de onderhandelingen niet tot overeenstemming leiden, wordt de prijs op verzoek van de meest gerede partij
      vastgesteld door de arrondissementsrechtbank te 's-Gravenhage, tenzij de eigenaar te kennen geeft af te zien van de
      in [artikel 7, eerste lid][ref1], bedoelde handeling of Onze Minister de daartegen aangevoerde bedenkingen intrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel7
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '7'
        hoofdstuk: III
  - number: '12.3'
    text: |-
      Alvorens te beslissen wint de rechtbank advies van deskundigen in. De griffier zendt een afschrift van het
      deskundigenadvies aan de verzoeker en de wederpartij. Deze kunnen binnen een door de rechter te bepalen termijn hun
      beschouwingen over het advies ter griffie indienen.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel12
  - number: '12.4'
    text: Tegen beschikkingen op grond van dit artikel staat uitsluitend beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel12
  - number: '13.1'
    text: |-
      Binnen één maand nadat de koopprijs ingevolge [artikel 12][ref1] onherroepelijk is vastgesteld, kan Onze Minister
      aan de eigenaar meedelen van het aanvoeren van bedenkingen af te zien en kan de eigenaar mededelen van het
      verrichten van de gemelde handelingen af te zien.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel12
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '12'
        hoofdstuk: III
  - number: '13.2'
    text: |-
      Indien aan het bepaalde in het vorige lid geen uitvoering wordt gegeven geldt de vastgestelde koopprijs als
      overeengekomen tussen partijen.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel13
  - number: '14.1'
    text: |-
      Voorzover ingevolge [artikel 7][ref1] aangevoerde bedenkingen die niet hebben geleid tot aankoop door de Staat,
      het nut van bepaalde uitgaven van een belanghebbende teniet hebben gedaan, vergoedt de Staat deze uitgaven. De
      Staat vergoedt geen uitgaven die wegens de mogelijkheid dat bedenkingen zouden worden aangevoerd redelijkerwijs
      achterwege hadden moeten blijven. De aanvraag wordt gericht tot Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel7
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '7'
        hoofdstuk: III
  - number: '14.2'
    text: Geschillen voortvloeiend uit dit artikel worden berecht door de rechter te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14
  - number: 14a.1
    text: |-
      Het is verboden een roerende zaak die integrerend deel uitmaakt van een openbare collectie die vermeld staat in
      de inventarislijst van een museum, een archief of een vaste collectie van een bibliotheek, en waarvan de Staat of
      een ander openbaar lichaam eigenaar is, buiten Nederland te brengen zonder dat de eigenaar daartoe schriftelijk
      toestemming heeft gegeven. Indien de eigenaar zich te dier zake niet verklaart, kan zijn toestemming op verzoek van
      een belanghebbende worden vervangen door een vergunning van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14a
  - number: 14a.2
    text: |-
      Het verbod, bedoeld in het eerste lid, geldt eveneens ten aanzien van een roerende zaak die integrerend deel
      uitmaakt van:
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14a
  - number: 14a.2.a
    text: |-
      een inventarislijst van roerende zaken van cultuurhistorische of wetenschappelijke betekenis waarvan een
      kerkgenootschap, een zelfstandig onderdeel daarvan, of een ander genootschap op religieuze grondslag eigenaar is;
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14a
  - number: 14a.2.b
    text: |-
      een openbare collectie die vermeld staat in de inventarislijst van een museum, een archief of een vaste collectie
      van een bibliotheek, en waarvan de eigendom berust bij een privaatrechtelijke rechtspersoon die in overwegende mate
      wordt gefinancierd door subsidie, die door de Staat of een ander overheidslichaam wordt verstrekt en die door Onze
      Minister voor de toepassing van dit verbod is aangewezen;
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14a
  - number: 14a.2.c
    text: |-
      de inventarislijst die door Onze Minister wordt bijgehouden van roerende zaken van cultuurhistorische of
      wetenschappelijke betekenis.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14a
  - number: 14a.3
    text: |-
      [Artikel 9, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel9
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14a
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '9'
        hoofdstuk: III
  - number: 14b.1
    text: |-
      Het is verboden zonder vergunning van Onze Minister of van een andere bevoegde autoriteit als bedoeld in
      [artikel 2, tweede lid][ref1], van [verordening (EEG) nr. 3911/92](31992R3911) van de Raad van de Europese
      Gemeenschappen van 9 december 1992 betreffende de uitvoer van cultuurgoederen (*PbEG* L 395), cultuurgoederen die
      behoren tot een categorie, vermeld in de bijlage bij genoemde verordening, uit te voeren buiten het grondgebied van
      de lidstaten van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel2
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14b
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '2'
        hoofdstuk: II
  - number: 14b.2
    text: |-
      Onze Minister kan bepalen dat het verbod, bedoeld in het eerste lid, niet geldt ten aanzien van oudheidkundige
      voorwerpen ouder dan honderd jaren, die afkomstig zijn van opgravingen en vondsten op het land en in de zee dan
      wel van oudheidkundige locaties, wanneer deze goederen van beperkt archeologisch of wetenschappelijk belang zijn en
      mits zij niet rechtstreeks afkomstig zijn van opgravingen, vondsten en archeologische locaties in een lidstaat van
      de Europese Unie, en zij zich legaal op de markt bevinden.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel14b
  - number: '15.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens deze wet bepaalde zijn belast de inspecteur en de bij
      besluit van Onze Minister daartoe aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel15
  - number: '15.2'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens de [artikelen 14][ref1] en [14][ref2] bepaalde zijn tevens
      belast de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel14a
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel14b
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: 14a
        hoofdstuk: IIIA
      - id: ref2
        bwb_id: BWBR0003659
        artikel: 14b
        hoofdstuk: IIIB
  - number: '15.3'
    text: Van een besluit als bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel15
  - number: '16.1'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 16.1.a
    text: |-
      de inspecteur en de in [artikel 15, eerste lid][ref1], bedoelde ambtenaren, voorzover zij daartoe bij besluit van
      Onze Minister van Justitie zijn aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel15
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '15'
        hoofdstuk: IV
  - number: 16.1.b
    text: de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel16
  - number: 16.1.Deze
    text: |-
      ambtenaren zijn tevens belast met de opsporing van de feiten strafbaar gesteld in de [artikelen 179][ref1] tot
      en met [182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voorzover deze feiten betrekking hebben op een
      bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '16.2'
    text: |-
      De in het eerste lid bedoelde ambtenaren zijn belast met het op verzoek van een lidstaat van de Europese Unie of
      van een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte opsporen van
      een door die staat in het verzoek omschreven roerende zaak die krachtens de nationale wetgeving van die staat een
      cultuurgoed is in de zin van [artikel 1, onder 1][ref1], van [richtlijn nr. 93/7/EEG](31993L0007) van de Raad van
      de Europese Gemeenschappen van 15 maart 1993 betreffende de teruggave van cultuurgoederen die op onrechtmatige
      wijze buiten het grondgebied van een lidstaat zijn gebracht (*PbEG* L 74), mits die zaak in de zin van die
      richtlijn op onrechtmatige wijze buiten het grondgebied van die staat is gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel1
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '1'
        hoofdstuk: I
  - number: '16.3'
    text: |-
      Een wijziging van de [richtlijn nr. 93/7/EEG](31993L0007) gaat voor de toepassing van dit artikel gelden met
      ingang van de dag waarop aan de betrokken wijzigingsrichtlijn uitvoering moet zijn gegeven, tenzij bij ministerieel
      besluit, dat in de Staatscourant wordt bekend gemaakt, een ander tijdstip wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel16
  - number: '16.4'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onderdeel *a*, wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel16
  - number: '17'
    text: |-
      De inspecteur en de in de [artikelen 15, eerste lid][ref1], en [16][ref2] bedoelde ambtenaren zijn bevoegd, met
      medeneming van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel16
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '15'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003659
        artikel: '16'
        hoofdstuk: IV
  - number: '18'
    text: |-
      De inspecteur en de in [artikel 15, eerste lid][ref1], bedoelde ambtenaren zijn bevoegd te vorderen dat de bewoner
      hun een beschermd voorwerp, een roerende zaak als bedoeld in [artikel 14a][ref2], of een cultuurgoed als bedoeld in
      [artikel 14b][ref3], die in de woning aanwezig zijn, toont.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0003659#Artikel14a
      [ref3]: https://wetten.overheid.nl/BWBR0003659#Artikel14b
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '15'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0003659
        artikel: 14a
        hoofdstuk: IIIA
      - id: ref3
        bwb_id: BWBR0003659
        artikel: 14b
        hoofdstuk: IIIB
  - number: '19'
    text: |-
      Op de in [artikel 15, tweede lid][ref1], bedoelde ambtenaren is [hoofdstuk 2, paragraaf 3, van de Douanewet][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003659#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007632#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0003659
        artikel: '15'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0007632
        hoofdstuk: '2'
  - number: '21'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regelen worden gesteld ter uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel21
  - number: '22'
    text: 'Deze wet wordt aangehaald als: Wet tot behoud van cultuurbezit.'
    url: https://wetten.overheid.nl/BWBR0003659/2004-02-13#Artikel22
