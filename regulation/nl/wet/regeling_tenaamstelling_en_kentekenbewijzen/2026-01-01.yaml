  - number: '8'
    text: |-
      1 Indien een voertuig voorgoed buiten Nederland is gebracht en niet meer kan worden voldaan aan de
      [artikelen 31 tot en met 33 van het Kentekenreglement][ref1], verklaart de Dienst Wegverkeer de tenaamstelling
      vervallen, indien een verklaring van een autoriteit in het buitenland bij hem is ingeleverd, waaruit blijkt dat
      het voertuig in het buitenland achterblijft. In dat geval behoeven de betrokken kentekenplaten niet te worden
      ingeleverd bij de Dienst Wegverkeer.

      2 Als categorieën van voertuigen bedoeld in [artikel 40b, zesde lid, onderdeel b, van het Kentekenreglement][ref2]
      worden aangewezen:

      a. een motorfiets,

      b. een bedrijfsauto met een maximum massa van meer dan 3500 kg,

      c. een landbouw- of bosbouwtrekker,

      d. een motorrijtuig met beperkte snelheid,

      e. een mobiele machine,

      f. een aanhangwagen, of;

      g. een ander voertuig dan de in de onderdelen a tot en met g genoemde, niet zijnde een voertuig als genoemd in
      [artikel 1 van het Besluit beheer autowrakken][ref3], voor zover het voertuig 15 jaar of ouder is.

      3 Indien het voertuig definitief bestemd is voor gebruik buiten de weg, bedoeld in
      [artikel 40b, derde lid, onderdeel c, van het Kentekenreglement][ref4], verklaart de Dienst Wegverkeer de
      tenaamstelling vervallen indien het voertuig bestemd is om als voertuig buiten de weg te worden gebruikt ten
      behoeve van:

      a. bedrijfsmatig gebruik op een bedrijfsterrein dat geen deel uitmaakt van een weg en dit aannemelijk wordt gemaakt
      aan de hand van:

      1°. een opgave van het unieke nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref5]; en

      2°. een document waaruit het gebruiksdoel van het desbetreffende terrein blijkt of een huurcontract;

      b. bedrijfsmatig gebruik voor landbouw of bosbouw op een terrein dat geen deel uitmaakt van een weg en dit
      aannemelijk wordt gemaakt aan de hand van:

      1°. een opgave van het unieke nummer, bedoeld in [artikel 9, onderdeel a, van de Handelsregisterwet 2007][ref6], of
      een overeenkomst; en

      2°. een document waaruit het gebruiksdoel van het desbetreffende terrein blijkt;

      c. educatieve doeleinden en dit aannemelijk wordt gemaakt aan de hand van een verklaring waaruit blijkt dat de
      melding geschiedt door een opleidingsinstituut in de autobranche of een instituut waar bijzondere rijopleidingen
      worden gegeven dan wel door de brandweer;

      d. auto- of motorsport en dit aannemelijk wordt gemaakt aan de hand van een kopie van een licentie van de KNAC
      Nationale Autosport Federatie, de Koninklijke Nederlandse Motorrijders Vereniging of de Motorsport Organisatie
      Nederland, dan wel

      e. het gebruik als museumvoertuig.

      4 Indien een voertuig voorgoed buiten Nederland wordt gebracht door een ander dan een erkend bedrijf en de
      betrokken kentekenplaten vermist zijn, verklaart de Dienst Wegverkeer de tenaamstelling vervallen mits een daartoe
      strekkende verklaring op een door de Dienst Wegverkeer voorgeschreven wijze bij deze dienst wordt ingediend.


