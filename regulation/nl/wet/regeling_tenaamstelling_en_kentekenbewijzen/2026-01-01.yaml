        artikel: '2.1'
  - number: '5'
    text: |-
      Als documenten, als bedoeld in [artikel 27, achtste lid, van het Kentekenreglement][ref1], worden aangewezen:

      a. een legitimatiebewijs als bedoeld in
      [artikel 2 van de Regeling legitimatievoorschriften tenaamstelling en kentekenplaten][ref2], en

      b. een ingevulde en ondertekende verklaring van een door de Dienst Wegverkeer vastgesteld model.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007091#Artikel2
