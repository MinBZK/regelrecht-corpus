    text: |-
      1 Op basis van de Wegenverkeerswet afgegeven modellen van kentekenbewijzen en delen daarvan, registratiebewijzen,
      kopieën deel III en ontvangstbewijzen behouden hun geldigheid tot het moment waarop zij op basis van de
      [Wegenverkeerswet 1994][ref1] hun geldigheid verliezen. Op basis van de Wegenverkeerswet afgegeven modellen
      vrijwaringsbewijzen behouden hun geldigheid.

      2 Ontvangstbewijzen afgegeven volgens model D.2 van de bijlage zoals
