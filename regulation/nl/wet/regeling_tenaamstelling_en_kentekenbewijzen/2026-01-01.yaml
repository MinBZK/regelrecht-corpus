articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      *personenauto, bedrijfsauto, landbouw- of bosbouwtrekker, motorrijtuig met beperkte snelheid, mobiele machine,
      motorfiets, bromfiets, driewielig motorrijtuig en aanhangwagen*:

      hetgeen daaronder wordt verstaan in [artikel 1.1 van de Regeling voertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1.1
    url: https://wetten.overheid.nl/BWBR0007090/2026-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '1.1'
  - number: '2'
    text: |-
      1 Voor kentekenbewijzen en delen daarvan worden de volgende, in de bijlage bij deze regeling opgenomen, modellen
      vastgesteld:

      a. een kentekencard, afgegeven voor een personenauto, een motorfiets, een bromfiets, een driewielig motorrijtuig,
      een aanhangwagen, een bedrijfsauto, een landbouw- of bosbouwtrekker, een motorrijtuig met beperkte snelheid of een
      mobiele machine: model D.1;

      b. een na 31 december 2013 afgegeven kentekenbewijs deel II: model D.2;

      c. een kentekenbewijs, bevattende de enkele letter A, E, H, K, L, N, P, S, T, V, W of X en twee groepen van twee
      cijfers (kentekenbewijs voor weging en onderzoek): model 1.1;

      d. een kentekenbewijs dat is afgegeven voor een voertuig dat door de Dienst Wegverkeer is gekeurd ingevolge
      [artikel 26 van de wet][ref1], in afwachting van de verkrijging van een tweedelig kentekenbewijs (voorlopig
      kentekenbewijs): model 2.1;

      e. een deel I van een driedelig kentekenbewijs voor een personenauto, een motorfiets, een driewielig motorrijtuig,
      een aanhangwagen of een bedrijfsauto dan wel een deel I van een kentekenbewijs, bevattende een handelaarskenteken
      of de lettergroep BN of GN en twee groepen van twee cijfers: model 5.1;

      f. een voor 1 juni 2004 afgegeven deel II van een driedelig kentekenbewijs voor een personenauto, een motorfiets,
      een driewielig motorrijtuig of een aanhangwagen dan wel voor een bedrijfsauto: model 10.1;

      g. een voor 1 juni 2004 afgegeven bedrijfsvoorraad deel II: model 11.1;

      h. een overschrijvingsbewijs: model 13.1;

      i. een deel I A van een na 30 mei 2004 afgegeven kentekenbewijs voor een personenauto, een motorfiets, een
      bromfiets, een driewielig motorrijtuig, een aanhangwagen of een bedrijfsauto, een deel I A van een na 30 mei 2004
      afgegeven kentekenbewijs, bevattende de lettergroep AA, CD of CDJ dan wel de lettergroep BN of GN en twee groepen
      van twee cijfers dan wel een deel I van een na 30 mei 2004 maar voor 1 april 2015 afgegeven kentekenbewijs,
      bevattende een handelaarskenteken: model 14.1;

      j. een deel I B van een na 30 mei 2004 afgegeven kentekenbewijs voor een personenauto, een motorfiets, een
      bromfiets, een driewielig motorrijtuig, een aanhangwagen of een bedrijfsauto dan wel een deel I B van een na 30 mei
      2004 afgegeven kentekenbewijs, bevattende de lettergroep AA, CD of CDJ dan wel de lettergroep BN of GN en twee
      groepen van twee cijfers: model 15.1;

      k. een bedrijfsvoorraad deel I B: model 16.1 of model 16.2;

      l. een deel II van een na 30 mei 2004 afgegeven tweedelig kentekenbewijs: model 17.1;

      m. een na 30 mei 2004 maar voor 1 april 2015 afgegeven kentekenbewijs, bevattende een kenteken als bedoeld in
      [artikel 4, derde lid, onderdeel b, van het Kentekenreglement][ref2] (transitokentekenbewijs): model: 19.1;

      n. een kentekencard bevattende een handelaarskenteken: model 5.2;

      o. een kentekencard bevattende een kenteken als bedoeld in
      [artikel 4, derde lid, onderdeel b, van het Kentekenreglement][ref3] (transitokenteken): model 19.2.

      2 De volgende, in de bijlage van dit besluit opgenomen, modellen worden vastgesteld:

      a. een vrijwaringsbewijs, afgegeven door de Dienst Wegverkeer: model A.1;

      b. een vrijwaringsbewijs, afgegeven door een erkend bedrijf: model B.1 of model B.2;

      c. een vrijwaringsbewijs, na 30 mei 2004 afgegeven door de Dienst Wegverkeer: model A.2;

      d. een schorsingsverslag, af te geven door de Dienst Wegverkeer: model D.3;

      e. een tenaamstellingsverslag: af te geven door de Dienst Wegverkeer: model D.4.


