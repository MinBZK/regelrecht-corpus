  - number: '3'
    text: |-
      De afgifte van een kentekenbewijs geschiedt elektronisch in het geval de aanvraag betrekking heeft op een kenteken
      als bedoeld in [artikel 4, derde lid, onderdeel c, van het Kentekenreglement][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel4
    url: https://wetten.overheid.nl/BWBR0007090/2026-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: '4'
  - number: '4'
    text: |-
      De gegevens, bedoeld in [artikel 58y, vierde lid, van het Kentekenreglement][ref1], die bij een aanvraag voor
      inschrijving en tenaamstelling als bedoeld in artikel 58x, eerste lid, van het Kentekenreglement worden verstrekt
      zijn:

      a. het voertuigidentificatienummer, bedoeld in [artikel 2.1 van de Regeling voertuigen][ref2];

      b. het nummer van de aanwijzing, bedoeld in artikel 20b van de wet, die voor dat voertuig is verleend indien de
      aanvrager daarover beschikt;

      c. het bouwjaar, merk en type van het voertuig;

      d. foto’s waarop de kenmerken van het voertuig, waaronder in ieder geval het voertuigidentificatienummer, zichtbaar
      zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel58y
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0007090/2026-01-01#Artikel4
    references:
