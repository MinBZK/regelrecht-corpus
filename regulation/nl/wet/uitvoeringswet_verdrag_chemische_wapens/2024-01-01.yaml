preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 12 van de Grondwet, noodzakelijk is regels te
    stellen ter uitvoering van het Verdrag tot verbod van de ontwikkeling, de produktie, de aanleg van voorraden en het
    gebruik van chemische wapens en inzake de vernietiging van deze wapens;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. verdrag: het op 13 januari 1993 te Parijs tot stand gekomen Verdrag tot verbod van de ontwikkeling, de
      produktie, de aanleg van voorraden en het gebruik van chemische wapens en inzake de vernietiging van deze wapens
      (*Trb.* 1993, 162);

      b. stoffen: chemische elementen en hun verbindingen, zoals zij voorkomen in hun natuurlijke toestand of bij de
      produktie ontstaan, met inbegrip van de additieven die nodig zijn voor het behoud van de stabiliteit van het
      produkt en de onzuiverheden ten gevolge van het produktieprocédé;

      c. giftige stoffen: stoffen die door hun fysische of chemische inwerking op levensprocessen van mensen en dieren de
      dood, tijdelijke functie-aantasting of blijvende schade kunnen veroorzaken;

      d. voorlopers: chemische reagentia die zijn betrokken bij enigerlei stap in de produktie van een giftige stof,
      ongeacht de wijze van produktie, waartoe mede behoren hoofdbestanddelen van binaire of verscheidene bestanddelen
      bevattende chemische systemen;

      e. chemische wapens:

      1. giftige stoffen en hun voorlopers, die niet zijn bestemd voor doeleinden die ingevolge het verdrag zijn
      toegestaan, tenzij het betreft hoeveelheden die met die doeleinden niet in overeenstemming zijn;

      2. munitie en andere inzetmiddelen, ontworpen om de dood of andere schade te veroorzaken door de toxische
      eigenschappen van giftige stoffen, die kunnen vrijkomen als gevolg van het gebruik van zodanige munitie en andere
      inzetmiddelen;

      3. uitrusting ontworpen voor gebruik dat rechtstreeks verband houdt met het gebruik van munitie en andere
      inzetmiddelen;

      f. inrichting: een inrichting als bedoeld in de Verificatiebijlage, afdeling I, onderdeel 6, van het verdrag;

      g. fabriekscomplex, fabriek en eenheid: hetgeen daaronder wordt verstaan in afdeling I, onderdeel 6, van de
      Verificatiebijlage bij het verdrag;

      h. produceren van stoffen: vormen van stoffen door middel van een chemische reactie;

      i. verwerken van stoffen: toepassen van een fysisch proces, zoals de formulering, extractie en zuivering, waarbij
      de stoffen niet worden omgezet in andere stoffen;

      j. verbruiken van stoffen: omzetten in andere stoffen door middel van een chemische reactie;

      k. Douanewetboek van de Unie: Verordening (EU) nr. 952/2013 van het Europees Parlement en van de Raad van 9 oktober
      2013 tot vaststelling van het douanewetboek van de Unie (PbEU 2013, L 269);

      l. invoer: het binnenbrengen van goederen in Nederland, anders dan voor doorvoer;

      m. uitvoer: het doen verlaten van goederen van Nederland, anders dan voor doorvoer;

      n. internationale routine-inspectie: een inspectie als bedoeld in artikel VI, paragrafen 3, 4 en 5, van het verdrag
      ter verificatie van de naleving daarvan;

      o. internationale uitdagingsinspectie: een inspectie als bedoeld in artikel IX, paragraaf 8, van het verdrag ter
      verificatie van de naleving daarvan;

      p. internationaal inspectieteam: inspecteurs en inspectie-assistenten, door de Directeur-Generaal van de
      Organisatie voor het Verbod van Chemische Wapens belast met het verrichten van een internationale routine- of
      uitdagingsinspectie;

      q. begeleidingsteam: de door Onze Minister tot begeleiding van het internationaal inspectieteam aangewezen
      ambtenaren;

      r. Onze Minister: Onze Minister voor Buitenlandse Handel en Ontwikkelingssamenwerking;

      s. doorvoer: het vervoer van goederen die uitsluitend Nederland worden binnengebracht om via Nederland te worden
      vervoerd naar een bestemming buiten Nederland.

      2 Voor de toepassing van de bij of krachtens deze wet ter zake van invoer vastgestelde bepalingen worden goederen
      als bedoeld in artikel 79, eerste lid, van het Douanewetboek van de Unie geacht te zijn geplaatst onder de
      douaneregeling, bedoeld in artikel 5, onderdeel 16, onder a, van dat wetboek.
    url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#Artikel1
  - number: '2'
    text: |-
      1 Het is verboden chemische wapens te ontwikkelen, te produceren, anderszins te verwerven, op te slaan, voorhanden
      te hebben, over te dragen of te gebruiken.

      2 Het is verboden met het oog op de ontwikkeling, produktie, verwerving, opslag, overdracht of het gebruik van
      chemische wapens giftige stoffen, daarbij inbegrepen hun voorlopers, te ontwikkelen, te produceren, anderszins te
      verwerven, voorhanden te hebben, over te dragen of te gebruiken.

      3 Het eerste lid is niet van toepassing ingeval de [Wet Oorlogsstrafrecht][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0002099
    url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002099
  - number: '3'
    text: |-
      1 Het is verboden bij of krachtens algemene maatregel van bestuur aangewezen stoffen te ontwikkelen, te produceren,
      anderszins te verwerven, op te slaan, voorhanden te hebben, over te dragen of te gebruiken. Tot de aan te wijzen
      stoffen behoren de stoffen, bedoeld in artikel VI, paragraaf 3, van het verdrag.

      2 Het eerste lid is niet van toepassing ten aanzien van het produceren van de stoffen in laboratoria
      in hoeveelheden van minder dan 100 gram per jaar per inrichting, indien de stoffen zijn bestemd voor
      onderzoeksdoeleinden of voor medische dan wel farmaceutische doeleinden.

      3 Het eerste lid is voorts niet van toepassing ten aanzien van het ontwikkelen, het produceren, het verwerven,
      het opslaan, het voorhanden hebben en het gebruiken van de stoffen voor onderzoek, medische, farmaceutische of
      beschermingsdoeleinden in een door Onze Minister aangewezen inrichting.

      4 Onze Minister kan een ontheffing verlenen van het verbod in het eerste lid voor:

      a. het produceren, het verwerven, het opslaan, het voorhanden hebben en het gebruiken van de stoffen voor onderzoek
      dan wel medische of farmaceutische doeleinden in een andere dan in het derde lid bedoelde inrichting, indien de
      hoeveelheid van die stoffen minder dan 10 kg per jaar is;

      b. het overdragen van de stoffen ten behoeve van de onder *a* genoemde doeleinden naar een inrichting als bedoeld
      in het derde lid en vierde lid onder *a*, of naar een staat die partij is bij het verdrag, tenzij de stoffen zijn
      bestemd voor doorvoer naar een staat die geen partij is bij het verdrag.
    url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#Artikel3
  - number: '4'
    text: |-
      1 Degene die een inrichting als bedoeld in [artikel 3, tweede lid][ref1], in bedrijf houdt, verstrekt aan Onze
      Minister de gegevens die zijn aangewezen bij algemene maatregel van bestuur. Tot de aan te wijzen gegevens behoren
      de gegevens, bedoeld in de Verificatiebijlage, afdeling VI (D), paragrafen 13 tot en met 16, van het verdrag. De
      eerste volzin is niet van toepassing indien de inrichting een ziekenhuis betreft.

      2 Degene die een inrichting als bedoeld in [artikel 3, derde lid][ref2], in bedrijf houdt, verstrekt aan Onze
      Minister de gegevens die zijn aangewezen bij algemene maatregel van bestuur. Tot de aan te wijzen gegevens behoren
      de gegevens, bedoeld in de Verificatiebijlage, afdeling VI (D), paragrafen 13 tot en met 16, van het verdrag.

      3 Degene die een ontheffing als bedoeld in [artikel 3, vierde lid, onder a][ref3], heeft verkregen, verstrekt aan
      Onze Minister de gegevens die zijn aangewezen bij algemene maatregel van bestuur. Tot de aan te wijzen gegevens
      behoren de gegevens, bedoeld in de Verificatiebijlage, afdeling VI (D), paragrafen 17 tot en met 20, van het
      verdrag.

      4 Degene die een ontheffing als bedoeld in [artikel 3, vierde lid, onder b][ref4], heeft verkregen, verstrekt aan
      Onze Minister de gegevens, die zijn aangewezen bij algemene maatregel van bestuur. Tot de aan te wijzen gegevens
      behoren de gegevens, bedoeld in de Verificatiebijlage, afdeling VI (B), paragrafen 5 en 6, van het verdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007434#Artikel3
