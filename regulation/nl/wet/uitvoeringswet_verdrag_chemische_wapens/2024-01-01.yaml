  - number: '5'
    text: |-
      1 Degene die een inrichting in bedrijf houdt waar bij of krachtens algemene maatregel van bestuur aangewezen
      stoffen worden geproduceerd, verwerkt of verbruikt in hoeveelheden, aangegeven bij die algemene maatregel van
      bestuur, verstrekt aan Onze Minister de gegevens, die zijn aangewezen bij algemene maatregel van bestuur. Tot de
      aan te wijzen stoffen behoren de stoffen, bedoeld in artikel VI, paragrafen 4 en 5, van het verdrag. Tot de aan te
      wijzen gegevens behoren de gegevens, bedoeld in de Verificatiebijlage, afdeling VII (A), paragrafen 6 tot en met 8,
      onderscheidenlijk afdeling VIII (A), paragrafen 6 tot en met 8, van het verdrag.

      2 Degene die een inrichting in bedrijf houdt of heeft gehouden waar de in het eerste lid bedoelde stoffen zijn
      geproduceerd in de periode van 1 januari 1946 tot en met de inwerkingtreding van deze wet, met het doel chemische
      wapens te ontwikkelen, verstrekt aan Onze Minister de gegevens, die zijn aangewezen bij algemene maatregel van
      bestuur. Tot de aan te wijzen gegevens behoren de gegevens, bedoeld in de Verificatiebijlage, afdeling VII (A),
      paragraaf 10, onderscheidenlijk afdeling VIII (A), paragraaf 10, van het verdrag.

      3 Degene die de in het eerste lid bedoelde stoffen in- of uitvoert, doet aan Onze Minister mededeling van de in- en
      uitgevoerde hoeveelheden, gespecificeerd naar land van herkomst of bestemming.
    url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#Artikel5
  - number: '6'
    text: |-
      Degene die een inrichting als bedoeld in artikel VI, paragraaf 6, van het verdrag in bedrijf houdt waar bij of
      krachtens in algemene maatregel van bestuur aangewezen stoffen worden geproduceerd in hoeveelheden, aangegeven bij
      die maatregel, verstrekt aan Onze Minister de gegevens die zijn aangewezen bij algemene maatregel van bestuur. Tot
      de aan te wijzen stoffen behoren de stoffen, bedoeld in artikel VI, paragraaf 6, van het verdrag, en de gegevens,
      bedoeld in de Verificatiebijlage, afdeling IX, paragrafen 4 tot en met 6 van het verdrag.
    url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#Artikel6
  - number: '7'
    text: |-
      Degene die overeenkomstig de [artikelen 4 tot en met 6][ref1] een kennisgeving heeft gedaan, bewaart de in die
      artikelen bedoelde gegevens ten minste tot vijf jaar na de indiening van de kennisgeving.


      [ref1]: https://wetten.overheid.nl/BWBR0007434#Artikel4
    url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#Artikel7
