  - number: '12'
    text: |-
      1 Onze Minister wijst het hoofd van het begeleidingsteam aan.

      2 Het hoofd van het begeleidingsteam is bij een internationale routine- of uitdagingsinspectie bevoegd van een
      ieder alle medewerking te vorderen die nodig is voor de uitvoering van de taken die bij het verdrag zijn opgedragen
      aan het internationale inspectieteam en het begeleidingsteam.
    url: https://wetten.overheid.nl/BWBR0007434/2024-01-01#Artikel12
  - number: '13'
    text: |-
      1 Het internationale inspectieteam is bevoegd om, vergezeld door het begeleidingsteam en met medeneming van de
      benodigde apparatuur, bij het verrichten van een internationale routine-inspectie fabriekscomplexen, fabrieken
      en eenheden te betreden voor zover het dat voor de uitvoering van die inspectie nodig acht. Het hoofd van het
      begeleidingsteam kan daartoe zo nodig de hulp van de sterke arm inroepen.

      2 Het internationale inspectieteam is bevoegd om, vergezeld door het begeleidingsteam en met medeneming van de
      benodigde apparatuur, bij het verrichten van een internationale uitdagingsinspectie elke plaats te betreden voor
      zover het dat voor de uitvoering van die inspectie nodig acht. Het hoofd van het begeleidingsteam kan daartoe zo
      nodig de hulp van de sterke arm inroepen.

      3 In afwijking van [artikel 1, eerste lid, van de Algemene wet op het binnentreden][ref1] rust de verplichting
      zich voorafgaand aan het binnentreden in een woning te legitimeren en mededeling te doen van het doel van het
      binnentreden op de leden van het begeleidingsteam.

      4 In afwijking van [artikel 2, eerste lid, van de Algemene wet op het binnentreden][ref2] is het internationale
      inspectieteam, vergezeld door het begeleidingsteam, bevoegd om zonder machtiging een woning binnen te treden zonder
      toestemming van de bewoner.

      5 Het hoofd van het begeleidingsteam maakt het schriftelijk verslag, bedoeld in
      [artikel 10, eerste lid, van de Algemene wet op het binnentreden][ref3]. In dit verslag vermeldt hij tevens de
      namen en de hoedanigheden van de leden van het begeleidingsteam en van de inspecteurs.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0006763#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0006763#Artikel10
