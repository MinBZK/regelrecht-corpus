      aangewezen ambtenaren, alsmede jegens de ambtenaren die zijn belast met de opsporing van overtredingen van het
      bij of krachtens [artikel 2][ref3], [3, eerste lid][ref4], [4][ref5], [5][ref6], [6][ref7], [7][ref8] of
      [8][ref9] bepaalde, niet van toepassing op de ambtenaren, bedoeld in artikel 32 van de Arbeidsomstandighedenwet en
      [artikel 18.6 van de Omgevingswet][ref10].


