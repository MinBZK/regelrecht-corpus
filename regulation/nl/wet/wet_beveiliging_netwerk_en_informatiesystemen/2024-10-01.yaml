  - number: '2'
    text: 'Onze Minister is:'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel2
  - number: 2.a
    text: het centrale contactpunt;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel2
  - number: 2.b
    text: 'voor aanbieders van een essentiële dienst: het CSIRT;'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel2
  - number: 2.c
    text: |-
      de instantie voor de behandeling van vrijwillige meldingen als bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel16
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '3.1'
    text: |-
      Onze Minister heeft, ter voorkoming of beperking van het uitvallen van de beschikbaarheid of het verlies van
      integriteit van netwerk- en informatiesystemen van vitale aanbieders, en van andere aanbieders die onderdeel zijn
      van de rijksoverheid, ter verdere versterking van de digitale weerbaarheid van de Nederlandse samenleving en ter
      uitvoering van de NIB-richtlijn, de volgende taken:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.1.a
    text: de taken van het centrale contactpunt;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.1.b
    text: |-
      voor aanbieders van een essentiële dienst: de in bijlage I, onder 2, van de NIB-richtlijn genoemde taken van het
      CSIRT;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.1.c
    text: |-
      het bijstaan van de in de aanhef bedoelde aanbieders bij het treffen van maatregelen om de continuïteit van hun
      diensten te waarborgen of te herstellen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.1.d
    text: |-
      het informeren en adviseren van deze aanbieders en anderen in en buiten Nederland over dreigingen en incidenten met
      betrekking tot de in de aanhef bedoelde netwerk- en informatiesystemen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.1.e
    text: |-
      het verrichten van analyses en technisch onderzoek ten behoeve van de onder b, c en d genoemde taken, naar
      aanleiding van de onder d bedoelde dreigingen en incidenten of aanwijzingen daarvoor, niet zijnde onderzoek naar
      personen of organisaties die voor die dreigingen of incidenten verantwoordelijk zijn of die daar anderszins aan
      bijdragen of hebben bijgedragen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: '3.2'
    text: |-
      Voorts heeft Onze Minister, ter voorkoming van nadelige maatschappelijke gevolgen in en buiten Nederland, tot
      taak: het verstrekken van ingevolge het eerste lid, onder e, verkregen gegevens over dreigingen en incidenten met
      betrekking tot andere netwerk- en informatiesystemen dan bedoeld in de aanhef van het eerste lid aan:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.2.a
    text: |-
      organisaties die objectief kenbaar tot taak hebben om andere organisaties of het publiek daarover te
      informeren, aangewezen bij regeling van Onze Minister of behorend tot een bij die regeling aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.2.b
    text: CSIRT’s;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.2.c
    text: |-
      andere computercrisisteams, aangewezen bij regeling van Onze Minister of behorend tot een bij die regeling
      aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.2.d
    text: |-
      aanbieders van internettoegangs- en internetcommunicatiediensten ten behoeve van het informeren van gebruikers van
      die diensten;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: 3.2.e
    text: |-
      Onze Minister van Economische Zaken en Klimaat, ten behoeve van de uitvoering van de taken, bedoeld in
      [artikel 2, eerste lid, van de Wet bevordering digitale weerbaarheid bedrijven][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0050130#Artikel2
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0050130
        artikel: '2'
  - number: 3.2.f
    text: |-
      aanbieders, niet zijnde een vitale aanbieder of een andere aanbieder die onderdeel is van de rijksoverheid, indien
      een dreiging of incident aanzienlijke gevolgen heeft of kan hebben voor de continuïteit van hun dienstverlening en
      voor de verstrekking van gegevens een onder a tot en met c of e bedoelde organisatie ontbreekt.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
  - number: '3.3'
    text: |-
      Voorts heeft Onze Minister tot taak: de behandeling van vrijwillige meldingen als bedoeld in [artikel 16][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel16
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '4.1'
    text: |-
      De bevoegde autoriteit, bedoeld in artikel 8, eerste lid, van de NIB-richtlijn, is voor de sectoren, genoemd in
      bijlage II van die richtlijn:






                    *Bevoegde autoriteit*


                    *Sector*






                    Onze Minister van Economische Zaken en Klimaat


                    energie




                    digitale infrastructuur




                    De Nederlandsche Bank N.V.


                    bankwezen




                    infrastructuur voor de financiële markt




                    Onze Minister van Infrastructuur en Waterstaat


                    vervoer




                    levering en distributie van drinkwater




                    Onze Minister voor Medische Zorg


                    gezondheidszorg
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel4
  - number: '4.2'
    text: 'Voor de digitale diensten, genoemd in bijlage III van de NIB-richtlijn, is:'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel4
  - number: 4.2.a
    text: |-
      de bevoegde autoriteit, bedoeld in artikel 8, eerste lid, van de NIB-richtlijn: Onze Minister van Economische Zaken
      en Klimaat;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel4
  - number: 4.2.b
    text: 'het CSIRT: de bij koninklijk besluit aangewezen instantie.'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel4
  - number: '4.3'
    text: |-
      De bevoegde autoriteit heeft voor wat betreft de aanbieders van een essentiële dienst in de betrokken sector of
      sectoren, onderscheidenlijk voor de digitaledienstverleners, tot taak zorg te dragen voor de bestuursrechtelijke
      handhaving van het bepaalde bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel4
  - number: '4.4'
    text: |-
      Het CSIRT voor digitale diensten heeft voor wat betreft digitaledienstverleners de in bijlage I, onder 2, van de
      NIB-richtlijn genoemde taken.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel4
  - number: '5.1'
    text: |-
      Bij algemene maatregel van bestuur of bij besluit van een bij die maatregel genoemd bestuursorgaan worden
      aangewezen:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel5
  - number: 5.1.a
    text: aanbieders van een essentiële dienst of categorieën van zodanige aanbieders;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel5
  - number: 5.1.b
    text: andere vitale aanbieders of categorieën van zodanige aanbieders.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel5
  - number: '5.2'
    text: |-
      Bij de toepassing van het eerste lid, onder a, worden de artikelen 5 en 6 van de NIB-richtlijn en bijlage II van
      die richtlijn in acht genomen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel5
  - number: '6'
    text: |-
      Voor zover artikel 1, zevende lid, van de NIB-richtlijn van toepassing is, kan bij algemene maatregel van bestuur
      worden bepaald dat daarbij aangewezen, bij of krachtens deze wet gestelde voorschriften niet gelden voor daarbij
      aangewezen categorieën van aanbieders van essentiële diensten of digitaledienstverleners.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel6
  - number: '7.1'
    text: |-
      De aanbieder van een essentiële dienst en de digitaledienstverlener nemen passende en evenredige technische
      en organisatorische maatregelen om de risico’s voor de beveiliging van hun netwerk- en informatiesystemen te
      beheersen. De maatregelen zorgen, gezien de stand van de techniek, voor een niveau van beveiliging dat is afgestemd
      op de risico's die zich voordoen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel7
  - number: '7.2'
    text: |-
      De in het eerste lid bedoelde maatregelen van de digitaledienstverlener houden in elk geval rekening met de
      volgende aspecten:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel7
  - number: 7.2.a
    text: de beveiliging van systemen en voorzieningen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel7
  - number: 7.2.b
    text: behandeling van incidenten;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel7
  - number: 7.2.c
    text: het beheer van de bedrijfscontinuïteit;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel7
  - number: 7.2.d
    text: toezicht, controle en testen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel7
  - number: 7.2.e
    text: inachtneming van de internationale normen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel7
  - number: '8'
    text: |-
      De aanbieder van een essentiële dienst en de digitaledienstverlener nemen passende maatregelen om incidenten die de
      beveiliging van de voor de verlening van de betrokken dienst gebruikte netwerk- en informatiesystemen aantasten, te
      voorkomen en de gevolgen van dergelijke incidenten zo veel mogelijk te beperken, teneinde de continuïteit van die
      dienst te waarborgen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel8
  - number: '9'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven over de maatregelen, bedoeld in
      de [artikelen 7][ref1] en [8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0041515#Artikel8
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '7'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0041515
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '10.1'
    text: |-
      De vitale aanbieder, aangewezen op grond van [artikel 5, eerste lid, onder a of b][ref1], meldt onverwijld bij
      Onze Minister:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel5
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '5'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 10.1.a
    text: een incident met aanzienlijke gevolgen voor de continuïteit van de door hem verleende dienst;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
  - number: 10.1.b
    text: |-
      een inbreuk op de beveiliging van netwerk- en informatiesystemen die aanzienlijke gevolgen kan hebben voor de
      continuïteit van de door hem verleende dienst.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
  - number: '10.2'
    text: |-
      De aanbieder van een essentiële dienst meldt een incident als bedoeld in het eerste lid, onder a, ook onverwijld
      bij de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
  - number: '10.3'
    text: |-
      Onverminderd [artikel 13][ref1] meldt de aanbieder van een essentiële dienst een incident bij een
      digitaledienstverlener onverwijld bij Onze Minister en bij de bevoegde autoriteit, als dat incident aanzienlijke
      gevolgen heeft voor de continuïteit van zijn essentiële dienst.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel13
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '10.4'
    text: |-
      Om te bepalen of een incident aanzienlijke gevolgen heeft voor de continuïteit van de essentiële dienst, worden in
      elk geval in aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
  - number: 10.4.a
    text: het aantal gebruikers dat door de verstoring van de dienst wordt getroffen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
  - number: 10.4.b
    text: de duur van het incident;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
  - number: 10.4.c
    text: de omvang van het geografische gebied dat door het incident is getroffen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
  - number: '10.5'
    text: |-
      In afwijking van [artikel 1][ref1] wordt in het derde lid onder digitaledienstverlener tevens de
      digitaledienstverlener verstaan die niet valt onder de jurisdictie van Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel1
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '1'
        hoofdstuk: '1'
  - number: '11'
    text: |-
      De in [artikel 10][ref1] bedoelde melding omvat in ieder geval:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel10
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 11.a
    text: de aard en omvang van het incident;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel11
  - number: 11.b
    text: het vermoedelijke tijdstip van de aanvang van het incident;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel11
  - number: 11.c
    text: de mogelijke gevolgen in en buiten Nederland van het incident;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel11
  - number: 11.d
    text: een prognose van de hersteltijd;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel11
  - number: 11.e
    text: |-
      zo mogelijk, de door de aanbieder genomen of te nemen maatregelen om de gevolgen van het incident te beperken of
      herhaling hiervan te voorkomen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel11
  - number: 11.f
    text: de contactgegevens van de functionaris die verantwoordelijk is voor het doen van de melding.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel11
  - number: '12.1'
    text: |-
      Desgevraagd verstrekt de aanbieder die een melding als bedoeld in [artikel 10, eerste of derde lid][ref1], bij Onze
      Minister heeft gedaan, Onze Minister onverwijld alle overige gegevens die noodzakelijk zijn om:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel10
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 12.1.a
    text: |-
      de aanbieder bij te staan bij het treffen van maatregelen om de continuïteit van zijn diensten te waarborgen of
      te herstellen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel12
  - number: 12.1.b
    text: |-
      de risico’s in te schatten voor de netwerk- en informatiesystemen, bedoeld in
      [artikel 3, eerste lid, aanhef][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel3
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '3'
        hoofdstuk: '2'
  - number: '12.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing als de aanbieder een incident heeft gemeld bij de bevoegde
      autoriteit en deze de door haar ontvangen gegevens heeft verstrekt aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel12
  - number: '13.1'
    text: |-
      Een digitaledienstverlener meldt een incident met aanzienlijke gevolgen voor de verlening van de door hem verleende
      dienst in de Europese Unie onverwijld bij:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: 13.1.a
    text: het CSIRT voor digitale diensten, en
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: 13.1.b
    text: de bevoegde autoriteit.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: '13.2'
    text: |-
      Om te bepalen of een incident aanzienlijke gevolgen heeft als bedoeld in het eerste lid, worden in elk geval in
      aanmerking genomen:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: 13.2.a
    text: het aantal gebruikers dat door de verstoring van de dienst wordt getroffen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: 13.2.b
    text: de duur van het incident;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: 13.2.c
    text: de omvang van het geografische gebied dat door het incident is getroffen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: 13.2.d
    text: de omvang van de verstoring van de werking van de dienst;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: 13.2.e
    text: de omvang van de gevolgen voor de economische en maatschappelijke activiteiten.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: '13.3'
    text: |-
      Het eerste lid geldt alleen als de digitaledienstverlener toegang heeft tot de informatie die nodig is om te
      beoordelen of het incident aanzienlijke gevolgen heeft als bedoeld in dat lid.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel13
  - number: '14.1'
    text: |-
      Desgevraagd verstrekt de digitaledienstverlener die een melding als bedoeld in
      [artikel 13, eerste lid, onder a][ref1], bij het CSIRT voor digitale diensten heeft gedaan, het CSIRT voor digitale
      diensten onverwijld alle overige gegevens die noodzakelijk zijn om:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel13
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 14.1.a
    text: |-
      de digitaledienstverlener bij te staan bij het treffen van maatregelen om de continuïteit van zijn diensten te
      waarborgen of te herstellen;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel14
  - number: 14.1.b
    text: de risico’s in te schatten voor de netwerk- en informatiesystemen van andere digitaledienstverleners.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel14
  - number: '14.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing als de digitaledienstverlener een incident heeft gemeld bij de
      bevoegde autoriteit en zij de door haar ontvangen gegevens heeft verstrekt aan het CSIRT voor digitale diensten.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel14
  - number: '15'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gegeven over de
      [artikelen 10 tot en met 13][ref1], waaronder regels over:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel10
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 15.a
    text: |-
      de gegevens die ter uitvoering van de [artikelen 10][ref1], [11][ref2] en [13][ref3] worden verstrekt;


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041515#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0041515#Artikel13
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0041515
        artikel: '11'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0041515
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 15.b
    text: |-
      de wijze waarop een melding als bedoeld in [artikel 10][ref1] of [13][ref2] wordt gedaan en waarop gegevens als
      bedoeld in [artikel 12][ref3] worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041515#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0041515#Artikel12
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0041515
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0041515
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '16.1'
    text: |-
      Als een incident aanzienlijke gevolgen heeft voor de continuïteit van een dienst maar niet valt onder de meldplicht
      van [paragraaf 3][ref1], kan de betrokken dienstverlener dat incident melden bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0041515
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '16.2'
    text: Onze Minister neemt de melding niet in behandeling als dat hem onevenredig of overmatig zou belasten.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel16
  - number: '16.3'
    text: 'Onze Minister kan de melding ter behandeling doorsturen naar:'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel16
  - number: 16.3.a
    text: een ander CSIRT;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel16
  - number: 16.3.b
    text: |-
      een ander computercrisisteam, aangewezen bij regeling van Onze Minister of behorend tot een bij die regeling
      aangewezen categorie.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel16
  - number: '17.1'
    text: |-
      Onze Minister verwerkt gegevens, waaronder persoonsgegevens, ten behoeve van de in [artikel 3][ref1] genoemde
      doeleinden en taken. Hij is verwerkingsverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel3
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '3'
        hoofdstuk: '2'
  - number: '17.2'
    text: |-
      De bevoegde autoriteit verwerkt gegevens, waaronder persoonsgegevens, ten behoeve van de in
      [artikel 4, derde lid][ref1], genoemde taak. Zij is verwerkingsverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel4
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '4'
        hoofdstuk: '3'
  - number: '17.3'
    text: |-
      Het CSIRT voor digitale diensten verwerkt gegevens, waaronder persoonsgegevens, ten behoeve van de taken, genoemd
      in bijlage I van de NIB-richtlijn. Het is verwerkingsverantwoordelijke.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister kan een rechtspersoon of een orgaan daarvan verzoeken om gegevens te verstrekken die noodzakelijk
      zijn voor de vervulling van de in [artikel 3, eerste lid, onder b tot en met e][ref1], genoemde taken.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel3
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '3'
        hoofdstuk: '2'
  - number: '18.2'
    text: |-
      De rechtspersoon of het orgaan kan op grond van het eerste lid gevraagde persoonsgegevens ook aan Onze Minister
      verstrekken als die verstrekking onverenigbaar is met de doeleinden waarvoor de persoonsgegevens zijn verzameld.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel18
  - number: '19.1'
    text: |-
      Ter uitvoering van artikel 10, derde lid, eerste volzin, van de NIB-richtlijn stelt het CSIRT voor digitale
      diensten Onze Minister op de hoogte van gedane meldingen als bedoeld in [artikel 13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel13
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '19.2'
    text: |-
      Als blijkt uit een melding door een aanbieder van een essentiële dienst van een incident als bedoeld in
      [artikel 10, eerste lid, onder a, of derde lid][ref1], of [artikel 16, eerste lid][ref2], dat het incident
      aanzienlijke gevolgen heeft voor de continuïteit van een essentiële dienst in een andere lidstaat van de Europese
      Unie, stelt Onze Minister het centrale contactpunt van die lidstaat daarvan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0041515#Artikel16
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0041515
        artikel: '16'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '19.3'
    text: |-
      Op verzoek van de bevoegde autoriteit of uit eigen beweging stuurt Onze Minister de in het tweede lid bedoelde
      melding door naar het centrale contactpunt van de andere getroffen lidstaat.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel19
  - number: '19.4'
    text: |-
      Als dat passend is en in elk geval als twee of meer lidstaten getroffen zijn, stelt Onze Minister het centrale
      contactpunt van de getroffen lidstaten op de hoogte van een bij het CSIRT voor digitale diensten gemeld incident
      als bedoeld in [artikel 13, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel13
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '19.5'
    text: |-
      Als blijkt uit gegevens die Onze Minister heeft ontvangen van een centraal contactpunt in een andere lidstaat dat
      een daar gemeld incident aanzienlijke gevolgen heeft voor de continuïteit van:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel19
  - number: 19.5.a
    text: 'een essentiële dienst in Nederland: stelt Onze Minister de bevoegde autoriteit daarvan op de hoogte;'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel19
  - number: 19.5.b
    text: |-
      een digitale dienst in Nederland: stelt Onze Minister het CSIRT voor digitale diensten en de bevoegde autoriteit
      daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel19
  - number: '20.1'
    text: |-
      Ter uitvoering van de in [artikel 3][ref1] genoemde taken verstrekt Onze Minister geen vertrouwelijke gegevens met
      betrekking tot een aanbieder als:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel3
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '3'
        hoofdstuk: '2'
  - number: 20.1.a
    text: de geheimhouding van die gegevens onvoldoende is gewaarborgd, of
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: 20.1.b
    text: onvoldoende is gewaarborgd dat zij uitsluitend worden gebruikt voor het doel waarvoor zij worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: '20.2'
    text: |-
      Ter uitvoering van de in [artikel 3][ref1] genoemde taken kan Onze Minister vertrouwelijke gegevens die herleid
      kunnen worden tot een aanbieder, zonder diens instemming uitsluitend verstrekken voor zover dat dienstig is aan
      het bevorderen van maatregelen ter voorkoming of beperking van een verstoring van het maatschappelijk verkeer.
      Ingevolge de eerste volzin worden uitsluitend gegevens verstrekt aan:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel3
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '3'
        hoofdstuk: '2'
  - number: 20.2.a
    text: |-
      organisaties die objectief kenbaar tot taak hebben om andere organisaties of het publiek te informeren over
      dreigingen en incidenten met betrekking tot hun netwerk- en informatiesystemen, aangewezen bij regeling van Onze
      Minister of behorend tot een bij die regeling aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: 20.2.b
    text: CSIRT’s;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: 20.2.c
    text: |-
      andere computercrisisteams, aangewezen bij regeling van Onze Minister of behorend tot een bij die regeling
      aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: 20.2.d
    text: |-
      de inlichtingen- en veiligheidsdiensten, bedoeld in de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0039896
  - number: 20.2.e
    text: |-
      Onze Minister van Economische Zaken en Klimaat, ten behoeve van de uitvoering van de taken, bedoeld in
      [artikel 2, eerste lid, van de Wet bevordering digitale weerbaarheid bedrijven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050130#Artikel2
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0050130
        artikel: '2'
  - number: '20.3'
    text: |-
      Als een vitale aanbieder, of een andere aanbieder die onderdeel is van de rijksoverheid, onvoldoende gevolg geeft
      aan een door Onze Minister gegeven advies, kan Onze Minister in het advies opgenomen gegevens als bedoeld in het
      tweede lid verstrekken aan de bevoegde autoriteit of Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: '20.4'
    text: 'Voor zover dat noodzakelijk is om ernstige maatschappelijke gevolgen te voorkomen of te beperken:'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: 20.4.a
    text: |-
      verstrekt Onze Minister onverwijld gegevens als bedoeld in het tweede lid aan de bevoegde autoriteit of Onze
      betrokken Minister;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: 20.4.b
    text: |-
      kan Onze Minister, na raadpleging van de betrokken aanbieder, gegevens als bedoeld in het tweede lid verstrekken
      aan andere organisaties of over die gegevens mededelingen doen aan het publiek.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: '20.5'
    text: Het eerste lid geldt niet voor de in het vierde lid, onder b, bedoelde mededelingen aan het publiek.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
  - number: '20.6'
    text: |-
      Het tweede lid geldt niet voor zover dat nodig is ter uitvoering van
      [artikel 19, tweede tot en met vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel19
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '19'
        hoofdstuk: '5'
  - number: '20.7'
    text: |-
      De [Wet open overheid][ref1] is niet van toepassing op gegevens als bedoeld in het tweede lid, behalve voor zover
      die gegevens milieu-informatie inhouden als bedoeld in [artikel 19.1a van de Wet milieubeheer][ref2]. De eerste
      volzin geldt ook als de gegevens bij een ander overheidsorgaan berusten na verstrekking op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0045754
      [ref2]: https://wetten.overheid.nl/BWBR0003245#Artikel19
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0045754
      - id: ref2
        bwb_id: BWBR0003245
        artikel: '19'
  - number: '21.1'
    text: |-
      Ter uitvoering van de in bijlage I, onder 2, van de NIB-richtlijn genoemde taken verstrekt het CSIRT voor digitale
      diensten geen vertrouwelijke gegevens met betrekking tot een digitaledienstverlener als:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: 21.1.a
    text: de geheimhouding van die gegevens onvoldoende is gewaarborgd, of
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: 21.1.b
    text: onvoldoende is gewaarborgd dat zij uitsluitend worden gebruikt voor het doel waarvoor zij worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: '21.2'
    text: |-
      Ter uitvoering van de in bijlage I, onder 2, van de NIB-richtlijn genoemde taken kan het CSIRT voor digitale
      diensten vertrouwelijke gegevens die herleid kunnen worden tot een digitaledienstverlener, zonder diens instemming
      uitsluitend verstrekken voor zover dat dienstig is aan het bevorderen van maatregelen ter voorkoming of beperking
      van een verstoring van het maatschappelijk verkeer. Ingevolge de eerste volzin worden uitsluitend gegevens
      verstrekt aan:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: 21.2.a
    text: CSIRT’s;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: 21.2.b
    text: |-
      andere computercrisisteams, aangewezen bij regeling van Onze Minister of behorend tot een bij die regeling
      aangewezen categorie;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: 21.2.c
    text: |-
      de inlichtingen- en veiligheidsdiensten, bedoeld in de [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0039896
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0039896
  - number: 21.2.d
    text: |-
      Onze Minister van Economische Zaken en Klimaat, ten behoeve van de uitvoering van de taken, bedoeld in
      [artikel 2, eerste lid, van de Wet bevordering digitale weerbaarheid bedrijven][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0050130#Artikel2
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0050130
        artikel: '2'
  - number: '21.3'
    text: |-
      Als een digitaledienstverlener onvoldoende gevolg geeft aan een door het CSIRT voor digitale diensten gegeven
      advies, kan het CSIRT voor digitale diensten in het advies opgenomen gegevens als bedoeld in het tweede lid
      verstrekken aan de bevoegde autoriteit of Onze Minister van Economische Zaken en Klimaat.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: '21.4'
    text: |-
      Voor zover dat noodzakelijk is om ernstige economische of sociale gevolgen te voorkomen of te beperken verstrekt
      het CSIRT voor digitale diensten onverwijld gegevens als bedoeld in het tweede lid aan de bevoegde autoriteit of
      Onze betrokken Minister.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
  - number: '21.5'
    text: |-
      Het tweede lid geldt niet voor zover dat nodig is ter uitvoering van [artikel 19, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel19
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '19'
        hoofdstuk: '5'
  - number: '21.6'
    text: |-
      [Artikel 20, zevende lid][ref1], is van overeenkomstige toepassing op gegevens als bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel20
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '20'
        hoofdstuk: '5'
  - number: '22.1'
    text: |-
      Ter uitvoering van de in [artikel 4, derde lid][ref1], genoemde taak verstrekt de bevoegde autoriteit geen
      vertrouwelijke gegevens met betrekking tot een aanbieder van een essentiële dienst of een digitaledienstverlener
      die zij ingevolge deze wet verkrijgt, als:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel4
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '4'
        hoofdstuk: '3'
  - number: 22.1.a
    text: de geheimhouding van die gegevens onvoldoende is geborgd, of
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel22
  - number: 22.1.b
    text: onvoldoende is gewaarborgd dat zij uitsluitend worden gebruikt voor het doel waarvoor zij worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel22
  - number: '22.2'
    text: |-
      [Artikel 20, zevende lid][ref1], is van overeenkomstige toepassing op vertrouwelijke gegevens als bedoeld in het
      eerste lid die herleid kunnen worden tot een aanbieder van een essentiële dienst of een digitaledienstverlener.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel20
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '20'
        hoofdstuk: '5'
  - number: '23'
    text: |-
      Onverminderd [artikel 20, vierde lid, onder b][ref1], kan de bevoegde autoriteit, na raadpleging van de betrokken
      aanbieder:


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel20
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '20'
        hoofdstuk: '5'
  - number: 23.a
    text: |-
      als publieke bewustwording nodig is om een incident te voorkomen of een lopend incident te beheersen: het publiek
      informeren over een gemeld incident als bedoeld in [artikel 10, eerste lid, onder a][ref1], of vorderen dat de
      aanbieder dit doet;


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel10
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '10'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: 23.b
    text: |-
      als publieke bewustwording nodig is om een incident te voorkomen of een lopend incident te beheersen, of wanneer
      de openbaarmaking van het incident anderszins in het algemeen belang is: het publiek informeren over een gemeld
      incident als bedoeld in [artikel 13, eerste lid][ref1], of vorderen dat de digitaledienstverlener dit doet.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel13
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '13'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '24'
    text: Dit hoofdstuk is alleen van toepassing op aanbieders van een essentiële dienst en digitaledienstverleners.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel24
  - number: '25.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van de
      bevoegde autoriteit aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel25
  - number: '25.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel25
  - number: '26.1'
    text: |-
      De bevoegde autoriteit kan een aanbieder van een essentiële dienst bij besluit de verplichting opleggen dat de
      aanbieder:
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel26
  - number: 26.1.a
    text: |-
      een onafhankelijke deskundige laat onderzoeken of de door de aanbieder genomen maatregelen voldoen aan de
      [artikelen 7][ref1] en [8][ref2] en aan de nadere regels, bedoeld in [artikel 9][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0041515#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0041515#Artikel9
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '7'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0041515
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0041515
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: 26.1.b
    text: |-
      de resultaten van dat onderzoek binnen een bij het besluit gestelde redelijke termijn verstrekt aan de bevoegde
      autoriteit.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel26
  - number: '26.2'
    text: Het onderzoek wordt uitgevoerd op een door de bevoegde autoriteit voorgeschreven wijze.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel26
  - number: '26.3'
    text: Tenzij bij algemene maatregel van bestuur anders is bepaald, draagt de aanbieder de kosten van het onderzoek.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel26
  - number: '26.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel26
  - number: '27'
    text: |-
      De bevoegde autoriteit kan degene die niet voldoet aan [artikel 7][ref1] of [8][ref2] of aan de nadere regels,
      bedoeld in [artikel 9][ref3], door middel van het geven van een aanwijzing verplichten om binnen een daarbij
      gestelde redelijke termijn de daarbij omschreven maatregelen te nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0041515#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0041515#Artikel9
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '7'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0041515
        artikel: '8'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0041515
        artikel: '9'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '28'
    text: |-
      De bevoegde autoriteit is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van het bepaalde
      bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel28
  - number: '29.1'
    text: 'De bevoegde autoriteit kan aan de overtreder een bestuurlijke boete opleggen in geval van:'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
  - number: 29.1.a
    text: overtreding van het bepaalde bij of krachtens deze wet;
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
  - number: 29.1.b
    text: |-
      overtreding van [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '29.2'
    text: 'De boete bedraagt ten hoogste:'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
  - number: 29.2.a
    text: |-
      in geval van overtreding van [artikel 12][ref1] of van
      [artikel 5:20, eerste lid, van de Algemene wet bestuursrecht][ref2]: 1 miljoen euro;


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0041515
        artikel: '12'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: 29.2.b
    text: 'in geval van een andere overtreding: 5 miljoen euro.'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
  - number: '29.3'
    text: |-
      De werking van het besluit tot oplegging van de boete wordt opgeschort totdat de beroepstermijn is verstreken of,
      als beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
  - number: '29.4'
    text: Verzet schorst de tenuitvoerlegging van een dwangbevel dat strekt tot invordering van de boete.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
  - number: '29.5'
    text: |-
      [Artikel 184 van het Wetboek van Strafrecht][ref1] is niet van toepassing op de overtreding, bedoeld in het eerste
      lid, onder b.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '34'
    text: |-
      De [Wet gegevensverwerking en meldplicht cybersecurity][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0039866
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0039866
  - number: '35'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan, voor verschillende taken of voor verschillende categorieën van aanbieders of diensten
      verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel35
  - number: '36'
    text: 'Deze wet wordt aangehaald als: Wet beveiliging netwerk- en informatiesystemen.'
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel36
