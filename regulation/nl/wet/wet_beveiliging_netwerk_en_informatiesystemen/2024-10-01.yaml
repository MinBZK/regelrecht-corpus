preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het gelet op richtlijn (EU) 2016/1148 noodzakelijk is om wettelijke
    bepalingen vast te stellen ter bevordering van de beveiliging van netwerk- en informatiesystemen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanbieder:* overheidsorganisatie of
      privaatrechtelijke rechtspersoon die een dienst exploiteert, beheert of beschikbaar stelt;
        - *aanbieder van een essentiële dienst:* aanbieder van een essentiële dienst als bedoeld in artikel 4 van de NIB-
      richtlijn, aangewezen op grond van [artikel 5, eerste lid, onder a][ref1];
        - *beveiliging van netwerk- en informatiesystemen, digitale dienst, incident, netwerk- en informatiesysteem, norm,
      onderscheidenlijk afbreekrisico:* hetgeen daaronder wordt verstaan in artikel 4 van de NIB-richtlijn;
        - *bevoegde autoriteit:* bevoegde autoriteit, genoemd in [artikel 4][ref2];
        - *centraal contactpunt:* centraal contactpunt als bedoeld in artikel 8, derde lid, van de NIB-richtlijn;
        - *CSIRT:* Computer security incident response team als bedoeld in artikel 9 van de NIB-richtlijn;
        - *CSIRT voor digitale diensten:* CSIRT, aangewezen op grond van [artikel 4, tweede lid, onder b][ref3];
        - *digitaledienstverlener:* rechtspersoon die een digitale dienst aanbiedt en gelet op artikel 18, eerste en
      tweede lid, van de NIB-richtlijn onder de jurisdictie van Nederland valt, met uitzondering van kleine en micro-
      ondernemingen als bedoeld in artikel 16, elfde lid, van de NIB-richtlijn;
        - *NIB-richtlijn:* richtlijn (EU) 2016/1148 van het Europees Parlement en de Raad van 6 juli 2016 houdende
      maatregelen voor een hoog gemeenschappelijk niveau van beveiliging van netwerk- en informatiesystemen in de Unie
      (PbEU 2016, L 194);
        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *vitale aanbieder:* a. aanbieder van een essentiële dienst; b. aanbieder van een andere dienst waarvan de
      continuïteit van vitaal belang is voor de Nederlandse samenleving.


      [ref1]: https://wetten.overheid.nl/BWBR0041515#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0041515#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0041515#Artikel4
    url: https://wetten.overheid.nl/BWBR0041515/2024-10-01#Artikel1
    references:
