preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het bijzonder voor de veiligheid van de scheepvaart voor
    onze kust en voor de bescherming van het zeemilieu van belang is dat Nederland zijn territoriale zee tot twaalf
    zeemijlen uitbreidt;

    Dat het tevens wenselijk is ter gelegenheid van deze uitbreiding preciseringen aan te brengen in de grens tussen de
    binnenwateren en de territoriale zee van Nederland;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003748/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De territoriale zee van Nederland strekt zich uit tot de lijn, waarvan elk punt gelegen is op een afstand
      van twaalf internationale zeemijlen, zijnde tweeëntwintig kilometer en tweehonderd vierentwintig meter, gemeten
      zeewaarts vanaf het dichtstbijgelegen punt van de laagwaterlijn langs de kust, met dien verstande dat, waar
      geheel of gedeeltelijk binnen deze afstand van deze laagwaterlijn een natuurlijk gevormde, bij eb droogvallende
      bodemverheffing is gelegen, die bij hoogtij onder water komt, gemeten wordt vanaf het dichtstbijgelegen punt van de
      laagwaterlijn van die bodemverheffing.

      2 De laagwaterlijn is de dieptelijn van nul meter, zoals aangegeven op de grootschalige Nederlandse zeekaarten,
      uitgegeven vanwege de Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0003748/2024-01-01#Artikel1
  - number: '2'
    text: |-
      1 De laagwaterlijn langs de kust vormt, met de in het tweede en vierde lid genoemde basislijnen, voor zover deze
      zeewaarts daarvan zijn gelegen, de grens tussen de binnenwateren en de territoriale zee van Nederland.

      2 Basislijnen worden getrokken door de bogen van de grootcirkels die over de kortste afstand de hierna te noemen
      punten verbinden:

      a. In de mond van de Westerschelde:

      Punt A, snijpunt van de Nederlands-Belgische landgrens met de laagwaterlijn, voor de toepassing van deze wet geacht
      te liggen op 51°22'25",0 Noorderbreedte en 3°21'52",5 Oosterlengte.

      Punt B, het licht Molenhoofd op de kust van Walcheren, gelegen op 51°31'38",1 Noorderbreedte en 3°26'07",9
      Oosterlengte.

      b. Tussen Den Helder en Texel:

      Punt C, de lichttoren Kijkduin bij Den Helder, gelegen op 52°57'22",5 Noorderbreedte en 4°43'39",8 Oosterlengte;
      vandaar naar

      Punt D, op het eiland Noorderhaaks, gelegen op 52°58'24",0 Noorderbreedte en 4°39'30",0 Oosterlengte; vandaar naar
      Punt E, het Loodsmansduin (oriënteertafel) op het eiland Texel, gelegen op 53°01'21",2 Noorderbreedte en 4°43'45",6
      Oosterlengte.

      c. Tussen Texel en Vlieland:

      Punt F, de lichttoren van Eierland op het eiland Texel, gelegen op 53°10'58",4 Noorderbreedte en 4°51'23",7
      Oosterlengte.

      Punt G, het reddingshuisje op het eiland Vlieland, gelegen op 53°13'27",6 Noorderbreedte en 4°53'12",3
      Oosterlengte.

      d. Tussen Vlieland en Terschelling:

      Punt H, de lichttoren Vuurduin op het eiland Vlieland, gelegen op 53°17'47",7 Noorderbreedte en 5°03'34",3
      Oosterlengte.

      Punt J, de lichttoren Brandaris op het eiland Terschelling, gelegen op 53°21'39",8 Noorderbreedte en 5°12'55",9
      Oosterlengte.

      e. Tussen Terschelling en Ameland:

      Punt K, het baken Noordkaap op het eiland Terschelling, gelegen op 53°26'40",6 Noorderbreedte en 5°32'47",1
      Oosterlengte.

      Punt L, de lichttoren van Ameland, gelegen op 53°26'59",9 Noorderbreedte en 5°37'37",2 Oosterlengte.

      f. Tussen Ameland en Schiermonnikoog:

      Punt M, de kaap op de oostpunt van Ameland, gelegen op 53°27'50",0 Noorderbreedte en 5°55'49",4 Oosterlengte.

      Punt N, de lichttoren van Schiermonnikoog, gelegen op 53°29'15",3 Noorderbreedte en 6°08'52",1 Oosterlengte.

      g. Tussen Schiermonnikoog en Rottumeroog:

      Punt O, de kaap op de zuidoostpunt van Schiermonnikoog, gelegen op 53°29'50",5 Noorderbreedte en 6°17'56",1
      Oosterlengte; vandaar naar

      Punt P, het baken op de Boschplaat, gelegen op 53°31'48",9 Noorderbreedte en 6°27'42",4 Oosterlengte; vandaar naar

      Punt Q, de Grote Kaap op Rottumeroog, gelegen op 53°32'39",1 Noorderbreedte en 6°34'39",0 Oosterlengte.

      3 De ligging van de punten A t/m Q, genoemd in het tweede lid, is uitgedrukt in lengte en breedte volgens Europese
      coördinaten (1e Vereffening 1950).

      4 In de Maasmond en in de havenmonden van Scheveningen en IJmuiden geldt als basislijn de verbindingslijn van de
      lichten op de koppen der havenhoofden.
    url: https://wetten.overheid.nl/BWBR0003748/2024-01-01#Artikel2
  - number: '3'
    text: |-
      1 De zijwaartse begrenzing van de territoriale zee zal worden bepaald in overeenstemming met de Staten van welke de
      territoriale zee grenst aan die van Nederland.

      2 Voor de toepassing van de Nederlandse wetgeving wordt de grens tussen de binnenwateren en de territoriale zee in
      de monding van de Eems gevormd door de verbindingslijn van de Grote Kaap van Rottumeroog, gelegen op 53°32'39",1
      Noorderbreedte en 6°34'39",0 Oosterlengte en de grote lichttoren van Borkum, gelegen op 53°35'22",2 Noorderbreedte
      en 6°39'48",3 Oosterlengte, voorzover die lijn over Nederlands gebied loopt.
    url: https://wetten.overheid.nl/BWBR0003748/2024-01-01#Artikel3
  - number: '9'
    text: |-
      1 Deze wet treedt in werking op de eerste dag van de derde maand volgend op de datum van uitgifte van het
      *Staatsblad* waarin zij wordt geplaatst.

      2 Zij kan worden aangehaald als: Wet grenzen Nederlandse territoriale zee.
    url: https://wetten.overheid.nl/BWBR0003748/2024-01-01#Artikel9
