preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het, in het belang van goede arbeidsomstandigheden in de onderneming
    wenselijk is de verantwoordelijkheid van werkgevers en werknemers voor het arbeidsomstandighedenbeleid te
    vergroten, de regelgeving zoveel mogelijk te beperken, te vereenvoudigen en te verduidelijken en daartoe de
    Arbeidsomstandighedenwet 1998 te wijzigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020772/2007-01-01#ArtikelAanhef
articles:
  - number: II
    text: |-
      Indien voor het tijdstip waarop [artikel I][ref1] in werking treedt, een eis tot naleving is gesteld, een
      beschikking tot het opleggen van een bestuurlijke boete is gegeven, een beschikking tot toepassing van
      bestuursdwang is gegeven dan wel een last onder dwangsom is opgelegd wegens overtreding van het bij of krachtens
      de [Arbeidsomstandighedenwet 1998][ref2] bepaalde, blijft het voor dat tijdstip ten aanzien van een zodanige
      beschikking geldende recht van toepassing tot het tijdstip waarop die beschikking onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0020772#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0010346
