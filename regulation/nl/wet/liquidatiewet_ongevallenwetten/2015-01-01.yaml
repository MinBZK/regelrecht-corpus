  - number: '8'
    text: |-
      1 Het dagloon, dat aan de in [artikel 4, eerste lid][ref1], genoemde uitkering als bedoeld in artikel
      15 van de Ongevallenwet 1921 of artikel 36 van de Land- en Tuinbouwongevallenwet 1922 en aan de in
      [artikel 5, eerste lid][ref2], genoemde uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37
      van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet 1919 ten
      grondslag is gelegd, wordt - indien dit dagloon is vastgesteld op het bedrag, bepaald krachtens het eerste lid
      van [artikel 9 van de Coördinatiewet Sociale Verzekering][ref3], zoals dat artikel luidde op de dag, voorafgaande
      aan die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref4], genoemde wetten werden ingetrokken -
      opnieuw vastgesteld met inachtneming van het bepaalde bij of krachtens het vierde lid of [artikel 22][ref5] en
      met inachtneming van het in [artikel 17, eerste lid, van de Wet financiering sociale verzekeringen][ref6] bedoelde
      bedrag, eventueel verhoogd of verlaagd krachtens [artikel 9a van die wet][ref7].

      2 Aan de aan [artikel 4][ref8], [5][ref9], [6][ref10] of [7][ref11] ontleende uitkering wordt
      geen hoger dagloon ten grondslag gelegd dan het bedrag, bepaald krachtens het eerste lid van
      [artikel 9 van de Coördinatiewet Sociale Verzekering][ref12], zoals dat artikel luidde op de dag, voorafgaande aan
      die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref13], genoemde wetten werden ingetrokken:

      a. indien en voor zolang die uitkering is berekend naar een verlies aan geschiktheid tot werken van niet meer dan
      25%;

      b. voor zover die uitkering wordt verleend over een tijdvak, gelegen na de dag waarop de uitkeringsgerechtigde
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref14], heeft
      bereikt.

      3 Bij toekenning van een uitkering op grond van het bepaalde in [artikel 4][ref15], [6][ref16] of [7][ref17] en bij
      toepassing van het eerste lid, een en ander zonder toepassing van het bepaalde bij of krachtens artikel 15, derde
      lid, van de Ongevallenwet 1921 of artikel 36, derde lid, van de Land- en Tuinbouwongevallenwet 1922, komt bij de
      berekening van het dagloon, dat aan de uitkering ten grondslag wordt gelegd, het dagloon, hetwelk meer bedraagt dan
      5/6 van het in het eerste lid bedoelde maximum dagloon, voor dat meerdere niet in aanmerking.

      4 Onze Minister stelt, onverminderd het overigens in dit artikel bepaalde, de bedragen vast, welke voor de
      toepassing van deze wet zullen gelden als daglonen, die aan de uitkeringen als bedoeld in artikel 2, eerste lid,
      onder *a*, van de Zeeongevallenwet 1919 ten grondslag worden gelegd.

      5 Het bepaalde bij of krachtens de [artikelen 17][ref18], [18][ref19], [20][ref20], [23][ref21],
      [24][ref22], [25][ref23] en [27 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref24] en
      [artikel 15 van de Wet op de arbeidsongeschiktheidsverzekering][ref25] - met uitzondering van het vijfde lid en
      de tweede volzin van het achtste lid van dat artikel - is van overeenkomstige toepassing met betrekking tot het
      dagloon, waarnaar de aan [artikel 4][ref26], [5][ref27], [6][ref28] of [7][ref29] ontleende uitkering als bedoeld
      in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste
      lid, onder *a*, van de Zeeongevallenwet 1919 ingevolge het bepaalde in de voorgaande leden en in artikel 22 is
      berekend. Het bepaalde in de vorige volzin is niet van toepassing in de gevallen, omschreven in het tweede lid,
      onder *a* en *b*.


