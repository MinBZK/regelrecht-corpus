  - number: '4'
    text: |-
      1 Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a en b][ref1], genoemde
      wetten worden ingetrokken, recht heeft op een uitkering als bedoeld in artikel 15 van de Ongevallenwet 1921 of
      artikel 36 van de Land- en Tuinbouwongevallenwet 1922, behoudt dit recht en heeft vervolgens recht op een uitkering
      als bedoeld in artikel 16 van de Ongevallenwet 1921 of artikel 37 van de Land- en Tuinbouwongevallenwet 1922,
      indien en voor zolang hij deze rechten zou hebben gehad, indien genoemde wetten niet zouden zijn ingetrokken.

      2 Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a en b][ref2], genoemde
      wetten worden ingetrokken, ten gevolge van een hem op eerstbedoelde dag overkomen ongeval ongeschikt wordt tot
      het verrichten van zijn werk, heeft recht op een uitkering als bedoeld in artikel 15 van de Ongevallenwet 1921 of
      artikel 36 van de Land- en Tuinbouwongevallenwet 1922 en vervolgens ter zake van aan vorenbedoelde ongeschiktheid
      aansluitende gehele of gedeeltelijke ongeschiktheid tot werken ten gevolge van dat ongeval, recht op een uitkering
      als bedoeld in artikel 16 van de Ongevallenwet 1921 of artikel 37 van de Land- en Tuinbouwongevallenwet 1922,
      indien en voor zolang hij deze rechten zou hebben gehad, indien genoemde wetten niet zouden zijn ingetrokken.

      3 Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref3],
      genoemde wetten worden ingetrokken, ten gevolge van een hem op eerstbedoelde dag overkomen ongeval ongeschikt wordt
      tot werken, terwijl hij ter zake van die ongeschiktheid geen recht heeft op uitkering ingevolge het bepaalde in
      het vorige lid, heeft recht op een uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van
      de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet 1919, indien en
      voor zolang hij dit recht zou hebben gehad, indien genoemde wetten niet zouden zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002553#Artikel3
