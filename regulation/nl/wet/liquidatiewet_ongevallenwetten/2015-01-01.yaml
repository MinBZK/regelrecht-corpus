  - number: '5'
    text: |-
      1 Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref1],
      genoemde wetten worden ingetrokken, recht heeft op een uitkering als bedoeld in artikel 16 van de Ongevallenwet
      1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de
      Zeeongevallenwet 1919, terwijl alsdan nog geen jaar is verstreken na de dag van het ongeval, ter zake waarvan die
      uitkering is verleend, behoudt bedoeld recht, indien en voor zolang hij dit recht zou hebben gehad, indien genoemde
      wetten niet zouden zijn ingetrokken.

      2 In afwijking van het bepaalde in het vorige lid vervalt het daar bedoelde recht met ingang van de dag,
      waarop de in [artikel 3, eerste lid, onder a, b en c][ref2], genoemde wetten worden ingetrokken, indien de
      betrokkene met ingang van die dag uit anderen hoofde een arbeidsongeschiktheidsuitkering ontleent aan de
      [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel3
