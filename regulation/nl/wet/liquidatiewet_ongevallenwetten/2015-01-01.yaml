  - number: '22'
    text: |-
      De bepalingen van de in [artikel 3, eerste lid][ref1], genoemde wetten en van haar uitvoeringsbesluiten, zoals deze
      luidden op de dag, voorafgaande aan die, waarop die wetten werden ingetrokken, blijven, voor zover bij of krachtens
      deze wet niet anders is bepaald, van kracht ten aanzien van de in dit hoofdstuk vervatte regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel22
