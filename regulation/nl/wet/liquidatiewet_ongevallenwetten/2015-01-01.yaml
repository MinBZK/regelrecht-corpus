  - number: '11'
    text: |-
      1 Het in [artikel 4][ref1], [5][ref2] of [6][ref3] geregelde recht op een uitkering als bedoeld in
      artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel
      2, eerste lid, onder *a*, van de Zeeongevallenwet 1919 eindigt indien of zodra de betrokkene aan de
      [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref4] een arbeidsongeschiktheidsuitkering ontleent.

      2 Het in de [artikelen 4][ref5], [5][ref6], [6][ref7], [7][ref8] en [9, tweede lid][ref9], geregelde recht
      op een uitkering bestaat slechts zolang de ongeschiktheid, ter zake waarvan de in genoemde artikelen bedoelde
      uitkering wordt verleend, onafgebroken voortduurt.


