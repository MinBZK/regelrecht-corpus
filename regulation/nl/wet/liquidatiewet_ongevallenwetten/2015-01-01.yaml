  - number: '15'
    text: |-
      1 De nagelaten betrekkingen van degene, die ten gevolge van een hem vóór de dag, waarop de in
      [artikel 3, eerste lid, onder a, b en c][ref1], genoemde wetten worden ingetrokken, overkomen ongeval overlijdt:

      a. hetzij binnen een jaar na de dag, voorafgaande aan eerstbedoelde dag;

      b. hetzij tijdens het genot van een uitkering ontleend aan deze wet of ontleend aan de
      [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref2] met toepassing van [artikel 13][ref3], [14][ref4]
      of [15 van die wet][ref5] dan wel terwijl [artikel 6, vierde lid][ref6], [artikel 7, tweede lid][ref7], of
      [artikel 11, eerste lid, van deze wet][ref8] toepassing heeft gevonden,

      hebben recht op een uitkering als bedoeld in artikel 19, onder 2°, van de Ongevallenwet 1921, artikel 40, onder 2°,
      van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, tweede lid, van de Zeeongevallenwet 1919, indien en voor
      zolang zij dit recht zouden hebben gehad, indien genoemde wetten niet zouden zijn ingetrokken. Bij de berekening
      van de in de vorige volzin laatstbedoelde uitkering komt het dagloon, hetwelk meer bedraagt dan het bedrag, bepaald
      krachtens het eerste lid van [artikel 9 van de Coördinatiewet Sociale Verzekering][ref9], zoals dat artikel luidde
      op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref10], genoemde wetten
      werden ingetrokken, voor dat meerdere niet in aanmerking.

      2 Het bepaalde in de eerste volzin van het vorige lid is niet van toepassing, indien het recht op een uitkering als
      bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel
      2, eerste lid, onder *a*, van de Zeeongevallenwet 1919 van degene, aan wiens overlijden het in het vorige lid
      bedoelde recht wordt ontleend, ingevolge het bepaalde in [artikel 17][ref11] of [18][ref12] wordt afgekocht.


