  - number: '19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regelen gesteld voor de berekening van de contante waarde
      als bedoeld in de [artikelen 17][ref1] en [18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel18
