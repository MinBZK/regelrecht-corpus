  - number: '6'
    text: |-
      1 Degene, die op of na de dag, waarop de in [artikel 3, eerste lid, onder a en b][ref1], genoemde wetten worden
      ingetrokken, doch binnen 183 dagen na een hem vóór bedoelde dag overkomen ongeval, ten gevolge van dat ongeval
      ongeschikt wordt tot het verrichten van zijn werk, heeft ter zake van die ongeschiktheid recht op een uitkering
      als bedoeld in artikel 15 van de Ongevallenwet 1921 of artikel 36 van de Land- en Tuinbouwongevallenwet 1922 en
      vervolgens, ter zake van aan vorenbedoelde ongeschiktheid aansluitende gehele of gedeeltelijke ongeschiktheid tot
      werken ten gevolge van dat ongeval, recht op een uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921 of
      artikel 37 van de Land- en Tuinbouwongevallenwet 1922, indien en voor zolang hij deze rechten zou hebben gehad,
      indien genoemde wetten niet zouden zijn ingetrokken.

      2 Degene, die op of na de dag, waarop de in [artikel 3, eerste lid, onder a, b en c][ref2], genoemde wetten worden
      ingetrokken, doch binnen een jaar na een hem vóór bedoelde dag overkomen ongeval ten gevolge van dat ongeval
      geheel of gedeeltelijk ongeschikt wordt tot werken, terwijl hij ter zake van die ongeschiktheid geen recht heeft
      op uitkering ingevolge het bepaalde in het vorige lid, heeft ter zake van die ongeschiktheid recht op een uitkering
      als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of
      artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet 1919, indien en voor zolang hij dat recht zou hebben
      gehad, indien genoemde wetten niet zouden zijn ingetrokken.

      3 Onverminderd het bepaalde in [artikel 10][ref3] komen de in de vorige leden bedoelde rechten op uitkering slechts
      toe aan degene, die op de dag, waarop de ongeschiktheid intreedt, de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], heeft bereikt of op bedoelde dag anders dan op grond
      van het bepaalde in [artikel 6, eerste lid, onder a of b, van de Wet op de arbeidsongeschiktheidsverzekering][ref5]
      niet ingevolge die wet verzekerd is, noch op grond van het bepaalde in [artikel 17, eerste lid, van die wet][ref6]
      beschouwd wordt alsof hij verzekerd was gebleven.

      4 Het in het tweede lid bedoelde recht op uitkering komt niet toe aan degene, die op de dag, waarop de in dat lid
      bedoelde ongeschiktheid intreedt, aan de [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref7] een vóór
      die dag ingegane arbeidsongeschiktheidsuitkering ontleent.

      5 De in het eerste en tweede lid bedoelde uitkering wordt over het tijdvak, gedurende hetwelk ter zake van de
      in die leden bedoelde ongeschiktheid tevens recht bestaat op ziekengeld ingevolge de [Ziektewet][ref8], slechts
      uitbetaald, indien en voor zover die uitkering het ziekengeld overtreft.


