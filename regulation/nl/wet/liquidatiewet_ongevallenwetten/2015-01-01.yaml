  - number: 34a
    text: |-
      Het bestuur van de Sociale Verzekeringsbank doet aan het einde van het boekjaar 1966 geen wetenschappelijke balans
      van het Landbouwongevallenfonds opmaken.
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel34a
  - number: '35'
    text: |-
      1 Het saldo van de in [artikel 34][ref1] bedoelde balans komt ten laste van het Rijk.

      2 Het na toepassing van het vorige lid bij de afwikkeling van de ten laste van het Landbouwongevallenfonds komende
      verplichtingen blijkend tekort onderscheidenlijk overschot komt ten laste onderscheidenlijk ten bate van het Rijk.

      3 Onze Minister en Onze Minister van Financiën kunnen met betrekking tot het bepaalde in de vorige leden regelen
      stellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel34
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '34'
        hoofdstuk: V
        paragraaf: '2'
  - number: '36'
    text: |-
      1 Een besluit van een risicodrager ingevolge de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet 1922 of
      de Zeeongevallenwet 1919 tot collectieve overdracht van een vermogensoverschot behoeft de goedkeuring van Onze
      Minister, gehoord de Sociale Verzekeringsraad.

      2 Onze Minister kan, gehoord de Sociale Verzekeringsraad, bepalen, dat een door hem aan te geven gedeelte van het
      in het vorige lid bedoelde overschot van de collectieve overdracht wordt uitgezonderd en aan door hem aan te wijzen
      personen wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel36
  - number: '37'
    text: |-
      1 Een vrijwillige verzekering als bedoeld in artikel 87 van de Ongevallenwet 1921 of artikel 99 van de Land- en
      Tuinbouwongevallenwet 1922 eindigt met ingang van de dag, waarop genoemde wetten worden ingetrokken.

      2 De over een tijdvak, gelegen na de dag, voorafgaande aan die, waarop de in het vorige lid genoemde wetten worden
      ingetrokken, betaalde premie wordt aan de verzekerde terugbetaald.
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel37
  - number: 38a
    text: |-
      1 Er bestaat geen burgerrechtelijke aansprakelijkheid voor schade, welke het gevolg is van ongevallen,
      plaatsgevonden hebbend vóór de dag, waarop de in [artikel 3, eerste lid, onder a, b, en c][ref1], genoemde wetten
      worden ingetrokken, indien en voorzover zulks ook niet het geval zou zijn geweest, indien die wetten niet zouden
      zijn ingetrokken.

      2 Degene, die naar burgerlijk recht gehouden is tot vergoeding van schade als gevolg van een vóór de dag, waarop de
      in [artikel 3, eerste lid, onder a en b][ref2], genoemde wetten worden ingetrokken, plaatsgevonden hebbend ongeval,
      terzake waarvan een risicodrager in de zin van bedoelde wetten lasten heeft te dragen, is jegens die risicodrager
      aansprakelijk tot zodanig bedrag als betrokkene jegens die risicodrager aansprakelijk zou zijn geweest, indien die
      wetten niet zouden zijn ingetrokken.

      3 Bij de vaststelling van de schadevergoeding, waarop degene, aan wie een uitkering, afkoopsom of bijslag ingevolge
      deze wet wordt verleend, naar burgerlijk recht aanspraak kan maken, houdt de rechter rekening met de aanspraken,
      die hij krachtens deze wet heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel3
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel38a
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0002553
        artikel: '3'
        hoofdstuk: II
  - number: '39'
    text: Hetgeen nog ter uitvoering van deze wet nodig is, wordt door Onze Minister geregeld.
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel39
  - number: '40'
    text: Deze wet kan worden aangehaald onder de titel "Liquidatiewet ongevallenwetten".
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel40
  - number: '41'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een door Ons te bepalen tijdstip, dat voor de
      onderscheidene artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel41
