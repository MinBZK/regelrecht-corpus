  - number: '32'
    text: |-
      1 Bij de vaststelling van de bijdrage als bedoeld in de laatste volzin van artikel 40, tweede lid, van de
      Ongevallenwet 1921 over het jaar 1966 wordt met het saldo van de in [artikel 31][ref1] eerstbedoelde balans
      rekening gehouden.

      2 In afwijking van het bepaalde in artikel 40, zesde lid, van de Ongevallenwet 1921 doet het bestuur van de Sociale
      Verzekeringsbank aan het einde van het boekjaar 1966 geen wetenschappelijke balans van het Ongevallenfonds opmaken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel31
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '31'
        hoofdstuk: V
        paragraaf: '1'
  - number: '33'
    text: |-
      1 Het saldo van de balans, opgemaakt per het door Onze Minister ingevolge [artikel 31][ref1] bepaalde tijdstip,
      wordt - onverminderd het bepaalde in het volgende lid - terugbetaald aan of verrekend met degenen, die over het
      jaar 1966 ten bate van het Ongevallenfonds premie ingevolge die wet hebben betaald onderscheidenlijk verschuldigd
      zijn, naar evenredigheid van de door hen betaalde onderscheidenlijk verschuldige premie ingevolge die wet.

      2 Onze Minister kan, gehoord de Sociale Verzekeringsraad, bepalen, dat de in het vorige lid bedoelde terugbetaling
      of verrekening achterwege blijft, indien de geringe omvang van het terug te betalen onderscheidenlijk te verrekenen
      bedrag daartoe aanleiding geeft.

      3 Het na toepassing van de vorige leden bij de afwikkeling van de ten laste van het Ongevallenfonds komende
      verplichtingen blijkend overschot onderscheidenlijk tekort in dat fonds komt ten bate onderscheidenlijk ten laste
      van het Arbeidsongeschiktheidsfonds.

      4 Onze Minister kan regelen stellen met betrekking tot het bepaalde in de vorige leden.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel31
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '31'
        hoofdstuk: V
        paragraaf: '1'
  - number: '34'
    text: |-
      Het bestuur van de Sociale Verzekeringsbank doet per de dag, voorafgaande aan die, waarop de Land- en
      Tuinbouwongevallenwet 1922 wordt ingetrokken, een liquidatiebalans van het Landbouwongevallenfonds opmaken. De
      in de vorige volzin bedoelde balans wordt opgemaakt op de grondslagen, vastgesteld bij of krachtens de algemene
      maatregel van bestuur als bedoeld in [artikel 28, tweede lid][ref1]. Onder de passiva worden opgenomen de op grond
      van [artikel 3, tweede lid][ref2], de [artikelen 4][ref3] en [5][ref4], in verbinding met de [artikelen 22][ref5]
      en [25, eerste lid, onder a en b][ref6], en het bepaalde bij of krachtens [artikel 28][ref7] ten laste van genoemd
      fonds komende verplichtingen alsmede de kosten, welke naar schatting aan de liquidatie van genoemd fonds zijn
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002553#Artikel4
