  - number: '26'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen ten aanzien van de uitvoering van de afwikkeling van de
      in de [artikelen 3, tweede lid][ref1], [4 tot en met 7][ref2], [9 tot en met 11][ref3], [14 tot en met 18][ref4]
      en [21][ref5] geregelde rechten regelen worden gesteld, waarbij van het bij de [artikelen 3, tweede lid][ref6],
      [22][ref7] en [23][ref8] bepaalde kan worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
