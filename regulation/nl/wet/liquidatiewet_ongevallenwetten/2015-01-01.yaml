  - number: '20'
    text: |-
      Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder d tot en met g][ref1],
      genoemde wetten worden ingetrokken, recht heeft op een bijslag ingevolge het bepaalde bij of krachtens die wetten
      uit hoofde van een recht op een uitkering ingevolge artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land-
      en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet 1919, heeft geen recht
      meer op bedoelde bijslag met ingang van de dag, waarop de in [artikel 3, eerste lid, onder d tot en met g][ref2],
      genoemde wetten worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel3
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel20
