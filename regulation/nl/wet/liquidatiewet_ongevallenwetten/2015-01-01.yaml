  - number: '21'
    text: |-
      Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder d tot en met g][ref1],
      genoemde wetten worden ingetrokken, recht heeft op een bijslag ingevolge het bepaalde bij of krachtens die wetten
      uit hoofde van een recht op een uitkering ingevolge artikel 19, onder 2°, van de Ongevallenwet 1921, artikel
      40, onder 2°, van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, tweede lid, van de Zeeongevallenwet 1919,
      behoudt het recht op bedoelde bijslag, indien en voor zolang hij dat recht zou hebben behouden, indien de in
      [artikel 3, eerste lid, onder d tot en met g][ref2], genoemde wetten niet zouden zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel3
