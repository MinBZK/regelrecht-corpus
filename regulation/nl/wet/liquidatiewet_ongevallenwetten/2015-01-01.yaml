  - number: '27'
    text: |-
      Onverminderd het bepaalde in de volgende paragraaf vervallen de verplichtingen ingevolge de Ongevallenwet
      1921, de Land- en Tuinbouwongevallenwet 1922 en de Zeeongevallenwet 1919 van de risicodragers ingevolge die
      wetten met ingang van de dag, waarop die wetten worden ingetrokken, met uitzondering van de verplichtingen,
      welke betrekking hebben op tijdvakken, gelegen vóór die dag en van de verplichtingen, omschreven in
      [artikel 25, eerste lid, onder ][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel25
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '25'
        hoofdstuk: III
        paragraaf: '7'
  - number: '28'
    text: |-
      1 De risicodragers ingevolge de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet 1922 en de Zeeongevallenwet
      1919 dragen de contante waarde van bij algemene maatregel van bestuur aan te wijzen verplichtingen ingevolge
      genoemde wetten over aan het Arbeidsongeschiktheidsfonds. In het geval, bedoeld in artikel 6, eerste lid, onder II,
      van de Zeeongevallenwet 1919 zijn de reder en de verzekeraar of andere derde als daarbedoeld hoofdelijk verbonden
      tegenover het Arbeidsongeschiktheidsfonds.

      2 Al hetgeen betrekking heeft op de vaststelling van de in het vorige lid bedoelde contante waarde, de vaststelling
      van de waarde der door de in dat lid bedoelde risicodragers aan het Arbeidsongeschiktheidsfonds over te dragen
      vermogensbestanddelen en de overdracht daarvan wordt bij of krachtens algemene maatregel van bestuur geregeld.
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel28
  - number: '29'
    text: |-
      Het Rijk draagt de volgens bij of krachtens algemene maatregel van bestuur te stellen regelen vast te stellen
      contante waarde van de op grond van het bepaalde in [artikel 21][ref1] gehandhaafde bijslagen over aan het
      Arbeidsongeschiktheidsfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel21
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002553
        artikel: '21'
        hoofdstuk: III
        paragraaf: '6'
  - number: '31'
    text: |-
      Het bestuur van de Sociale Verzekeringsbank doet per de dag, voorafgaande aan die, waarop de Ongevallenwet
      1921 wordt ingetrokken, en per een door Onze Minister nader te bepalen tijdstip een liquidatiebalans van het
      Ongevallenfonds opmaken. In afwijking van het bepaalde in [artikel 40, zesde lid][ref1], van genoemde wet worden
      de in de vorige volzin bedoelde balansen opgemaakt op de grondslagen, vastgesteld bij of krachtens de algemene
      maatregel van bestuur als bedoeld in [artikel 28, tweede lid][ref2]. Onder de passiva worden opgenomen de op grond
      van [artikel 3, tweede lid][ref3], de [artikelen 4][ref4] en [5][ref5], in verbinding met de [artikelen 22][ref6]
      en [25, eerste lid, onder a en b][ref7], en het bepaalde bij of krachtens [artikel 28][ref8] ten laste van
      genoemd fonds komende verplichtingen alsmede de kosten, welke naar schatting aan de liquidatie van genoemd fonds
      zijn verbonden. Onder de passiva wordt geen algemene reserve als bedoeld in artikel 40, zevende lid, van de
      Ongevallenwet 1921 opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel28
      [ref3]: https://wetten.overheid.nl/BWBR0002553#Artikel3
