  - number: '7'
    text: |-
      1 Degene, die binnen het jaar, aanvangende op de dag, waarop de in [artikel 3, eerste lid, onder a, b en c][ref1],
      genoemde wetten worden ingetrokken, geheel of gedeeltelijk ongeschikt wordt tot werken ten gevolge van een hem vóór
      die dag overkomen ongeval, terwijl hij ter zake van die ongeschiktheid geen recht heeft op uitkering ingevolge het
      bepaalde in [artikel 6][ref2], heeft ter zake van die ongeschiktheid recht op een uitkering als bedoeld in artikel
      16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder
      *a*, van de Zeeongevallenwet 1919, mits hij dit recht zou hebben gehad, indien genoemde wetten niet zouden zijn
      ingetrokken.

      2 Het in het vorige lid bedoelde recht op uitkering komt niet toe aan degene, die op de dag, waarop de in het
      vorige lid bedoelde ongeschiktheid intreedt, aan de [Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref3]
      een vóór die dag ingegane arbeidsongeschiktheidsuitkering ontleent.

      3 Het bepaalde in [artikel 6, derde lid][ref4], is van overeenkomstige toepassing.


