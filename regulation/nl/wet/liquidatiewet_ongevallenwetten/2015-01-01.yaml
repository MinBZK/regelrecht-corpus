        bwb_id: BWBR0002553
        artikel: '3'
        hoofdstuk: II
  - number: '23'
    text: |-
      1 De in [artikel 17][ref1] bedoelde afkoopsommen worden vastgesteld en betaalbaar gesteld door het
      uitvoeringsorgaan, dat de uitkering, waarvoor de afkoopsom in de plaats treedt, heeft toegekend.

      2 De in [artikel 18][ref2] bedoelde afkoopsommen worden vastgesteld en betaalbaar gesteld door de
      bedrijfsvereniging, die de aldaar genoemde arbeidsongeschiktheidsuitkering heeft beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel18
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel23
