  - number: '13'
    text: |-
      Het op grond van het bepaalde in artikel 25, eerste lid, of artikel 87*c*, derde lid, van de Ongevallenwet
      1921, dan wel artikel 48, eerste lid, of artikel 95*c*, derde lid, van de Land- en Tuinbouwongevallenwet
      1922 geven van een opleiding alsmede het op grond van het bepaalde in artikel 25, tweede lid, of
      artikel 87*c*, eerste lid, van de Ongevallenwet 1921, dan wel artikel 48, derde lid, of artikel 95*c*,
      eerste lid, van de Land- en Tuinbouwongevallenwet 1922, verlenen van een toelage wegens kosten van
      onderhoud en huisvesting, onderscheidenlijk wegens loonschade, worden - onverminderd het bepaalde in
      [artikel 45 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref1] - beëindigd met ingang van de
      dag, waarop de in [artikel 3, eerste lid, onder a en b][ref2], genoemde wetten worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002551#Artikel45
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel3
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel13
