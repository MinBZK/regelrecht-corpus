  - number: '10'
    text: |-
      1 Degene, die recht heeft op een uitkering als bedoeld in [artikel 4][ref1], [5][ref2] of [6][ref3], heeft -
      onverminderd het bepaalde in [artikel 14 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref4] en
      in [artikel 17][ref5] - indien hij op de laatste dag van de maand, volgende op die, waarin een jaar na het ongeval,
      ter zake waarvan bedoelde uitkering is verleend, is verstreken, de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], niet heeft bereikt, geen recht meer op die uitkering
      met ingang van de dag, volgende op de laatste dag van eerderbedoeld jaar.

      2 Het recht op een uitkering als bedoeld in [artikel 7][ref7] van degene, die op de laatste dag
      van de maand, waarin de in dat artikel bedoelde ongeschiktheid intreedt, de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref8], niet heeft
      bereikt, wordt omgezet, hetzij in een recht op een uitkering overeenkomstig het bepaalde in
      [artikel 15 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref9], hetzij in een recht op een
      afkoopsom als bedoeld in [artikel 17][ref10].

      3 Degene, die recht heeft op een uitkering als bedoeld in [artikel 7][ref11] en op de laatste dag van de
      maand, waarin de in dat artikel bedoelde ongeschiktheid intreedt, de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref12], heeft bereikt, behoudt dat recht, indien en voor
      zolang hij dat recht zou hebben behouden, indien de in [artikel 3, eerste lid, onder a, b en c][ref13], genoemde
      wetten niet zouden zijn ingetrokken. Het bepaalde in [artikel 6, vijfde lid][ref14], is van toepassing.


