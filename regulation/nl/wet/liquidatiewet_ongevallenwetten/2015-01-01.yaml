preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in verband met de regeling inzake een verplichte
    verzekering van loontrekkenden tegen geldelijke gevolgen van langdurige arbeidsongeschiktheid de wettelijke
    ongevallenverzekering te liquideren en daarmede verband houdende voorzieningen te treffen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en van de tot haar uitvoering genomen besluiten wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Volksgezondheid;

      b. Ongevallenwet 1921, Land- en Tuinbouwongevallenwet 1922 en Zeeongevallenwet 1919: de Ongevallenwet 1921, de
      Land- en Tuinbouwongevallenwet 1922, onderscheidenlijk de Zeeongevallenwet 1919, zoals deze wetten luidden op de
      dag, voorafgaande aan die, waarop zij werden ingetrokken;

      c. ongeval: een ongeval, in verband met de dienstbetrekking of de uitoefening van een verzekeringsplichtig bedrijf
      overkomen, als bedoeld in de Ongevallenwet 1921, de Land- en Tuinbouwongevallenwet 1922 of de Zeeongevallenwet
      1919, alsmede hetgeen in die wetten mede als ongeval, in verband met de dienstbetrekking overkomen, werd beschouwd,
      dan wel daarmede werd gelijkgesteld;

      d. 1. Ongevallenfonds: het Ongevallenfonds als bedoeld in artikel 40, zesde lid, van de Ongevallenwet 1921;

      2. Landbouwongevallenfonds: het Landbouwongevallenfonds als bedoeld in artikel 1, eerste lid, onder *d*, van de
      Land- en Tuinbouwongevallenwet 1922;

      e. risicodrager ingevolge de Ongevallenwet 1921: de Sociale Verzekeringsbank als beheerder van het Ongevallenfonds,
      de werkgever aan wie krachtens artikel 54 van genoemde wet is toegestaan het risico der bij die wet geregelde
      verzekering zelf te dragen en de naamloze vennootschap of de rechtspersoonlijkheid bezittende vereniging -
      daaronder begrepen een wederkerige verzekerings- of waarborgmaatschappij - aan wie krachtens artikel 54 van de
      Ongevallenwet 1921 door een werkgever het risico der in die wet geregelde verzekering is overgedragen;

      f. risicodrager ingevolge de Land- en Tuinbouwongevallenwet 1922: de Sociale Verzekeringsbank als beheerder van het
      Landbouwongevallenfonds en de bedrijfsvereniging, bedoeld in artikel 1, eerste lid, onder *e*, van genoemde wet;

      g. risicodrager ingevolge de Zeeongevallenwet 1919:

      1. in het geval, bedoeld in artikel 6, eerste lid, onder I, van die wet: de reder;

      2. in het geval, bedoeld in artikel 6, eerste lid, onder II, van die wet: de reder alsmede de verzekeraar of andere
      derde als daar bedoeld;

      3. in het geval, bedoeld in artikel 6, tweede lid, van die wet: de reder alsmede de Staat der Nederlanden als
      verzekeraar als daar bedoeld;

      4. het Rijk voor zover ingevolge artikel 10, derde lid, van die wet de uitkeringen ingevolge die wet ten laste van
      het Rijk komen;

      h. Arbeidsongeschiktheidsfonds: het Arbeidsongeschiktheidsfonds als bedoeld in
      [hoofdstuk III, § 2, van de Wet op de arbeidsongeschiktheidsverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Paragraaf2
