  - number: '18'
    text: |-
      1 Degene, die arbeidsongeschiktheidsuitkering ontleent, dan wel mede ontleent, aan [artikel 13][ref1], [14][ref2]
      of [15 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref3], onderscheidenlijk degene, ten aanzien
      van wie [artikel 6, vierde lid][ref4], [artikel 7, tweede lid][ref5], of [artikel 11, eerste lid][ref6], toepassing
      vindt en die van de dag, waarop zijn recht op bedoelde uitkering is ingegaan, onderscheidenlijk van de dag, met
      ingang van welke [artikel 6, vierde lid][ref7], [artikel 7, tweede lid][ref8], of [artikel 11, eerste lid][ref9],
      toepassing vindt, tot en met de dag voorafgaand aan die waarop hij de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref10], bereikt, onafgebroken recht op
      arbeidsongeschiktheidsuitkering heeft gehad, heeft recht op een afkoopsom ter hoogte van de contante waarde van
      de uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet
      1922 of artikel 2, eerste lid, onder a, van de Zeeongevallenwet 1919, waarop hij - indien genoemde wetten niet
      zouden zijn ingetrokken - recht zou hebben gehad op de dag waarop hij de pensioengerechtigde leeftijd, bedoeld
      in artikel 7a, eerste lid, van de Algemene Ouderdomswet, bereikt, ter zake van het ongeval, waarvoor hem het
      recht op uitkering is verleend in aansluiting waaraan hem vorenbedoelde arbeidsongeschiktheidsuitkering is
      toegekend, onderscheidenlijk ter zake van het ongeval, waarvoor hem het recht op uitkering is verleend, ten
      aanzien waarvan [artikel 11, eerste lid][ref11], is toegepast of waarvoor hem op grond van het bepaalde in
      [artikel 6, vierde lid][ref12], of [artikel 7, tweede lid][ref13], geen recht op uitkering is toegekend.

      2 Bij de berekening van de in het vorige lid bedoelde afkoopsom komt het dagloon, hetwelk meer bedraagt dan het
      bedrag, bepaald krachtens het eerste lid van [artikel 9 van de Coördinatiewet Sociale Verzekering][ref14], zoals
      dat artikel luidde op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref15],
      genoemde wetten werden ingetrokken, voor dat meerdere niet in aanmerking.


