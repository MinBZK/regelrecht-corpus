  - number: '17'
    text: |-
      1 Degene, die op grond van het bepaalde in [artikel 9, eerste lid][ref1], geen recht meer heeft op een
      uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet
      1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet 1919 en die op de dag, waarop de in
      [artikel 3, eerste lid, onder a, b en c][ref2], genoemde wetten worden ingetrokken, recht op die uitkering,
      berekend naar een ongeschiktheid tot werken van niet meer dan 25%, zou hebben gehad, indien genoemde wetten
      niet zouden zijn ingetrokken, heeft recht op een afkoopsom ter hoogte van de contante waarde van laatstbedoelde
      uitkering.

      2 Degene, die op grond van het bepaalde in [artikel 10, eerste lid][ref3], geen recht meer heeft op een uitkering
      als bedoeld in [artikel 4][ref4], [5][ref5] of [6][ref6] en die op de dag, met ingang van welke het recht op
      die uitkering vervalt, recht op die uitkering, berekend naar een ongeschiktheid tot werken van niet meer dan 25%,
      zou hebben behouden, indien het bepaalde in [artikel 10, eerste lid][ref7], niet op hem van toepassing zou zijn
      geweest, heeft recht op een afkoopsom ter hoogte van de contante waarde van laatstbedoelde uitkering.

      3 Degene, die op grond van het bepaalde in [artikel 7][ref8] recht heeft op een uitkering als bedoeld in artikel
      16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid,
      onder *a*, van de Zeeongevallenwet 1919, berekend naar een ongeschiktheid tot werken van niet meer dan 25%,
      en die op de laatste dag van de maand, waarin de in eerstgenoemd artikel bedoelde ongeschiktheid intreedt, de
      pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref9], niet heeft
      bereikt, heeft recht op een afkoopsom ter hoogte van de contante waarde van die uitkering.

      4 Het bepaalde in het eerste lid is niet van toepassing op degene, die op de in dat lid bedoelde dag:

      a. recht op meer dan één uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land-
      en Tuinbouwongevallenwet 1922, of artikel 2, eerste lid, onder *a* van de Zeeongevallenwet 1919, zou hebben gehad,
      indien genoemde wetten niet zouden zijn ingetrokken, mits de som van de percentages ongeschiktheid tot werken,
      waarnaar deze uitkeringen zouden zijn berekend, meer dan 25 zou hebben bedragen;

      b. recht op toekenning van een arbeidsongeschiktheidsuitkering aan [artikel 3][ref10], [4][ref11] of
      [12 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref12] ontleent.

      5 Het bepaalde in het tweede onderscheidenlijk het derde lid is niet van toepassing op degene, die op de in het
      tweede lid bedoelde dag onderscheidenlijk op de dag, waarop de in [artikel 7][ref13] bedoelde ongeschiktheid tot
      werken intreedt:

      a. aan [artikel 4][ref14], [5][ref15], [6][ref16] of [7][ref17] recht op meer dan één uitkering als bedoeld in
      artikel 16 van de Ongevallenwet 1921, artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste
      lid, onder *a*, van de Zeeongevallenwet 1919 zou hebben ontleend, indien het bepaalde in [artikel 10][ref18] of
      [11, eerste lid][ref19], niet op hem van toepassing zou zijn geweest, mits de som van de percentages ongeschiktheid
      tot werken, waarnaar deze uitkeringen zouden zijn berekend, meer dan 25 zou hebben bedragen;

      b. recht op toekenning van een arbeidsongeschiktheidsuitkering aan [artikel 4][ref20] of
      [12 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref21] ontleent.


