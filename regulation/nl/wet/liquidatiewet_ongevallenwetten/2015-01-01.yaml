  - number: '25'
    text: |-
      1 De op grond van het bepaalde in dit hoofdstuk te verlenen uitkeringen, afkoopsommen en bijslagen, alsmede de
      administratiekosten ter zake daarvan en de daarover door de in het tweede lid of in [artikel 23, tweede lid][ref1],
      genoemde organen ingevolge enige wet verschuldigde premies, die niet daarop in mindering kunnen worden gebracht,
      komen ten laste van het Arbeidsongeschiktheidsfonds, met uitzondering van:

      a. de aan [artikel 4][ref2] of [5][ref3] ontleende uitkering gedurende het eerste jaar na de dag van
      het ongeval, ter zake waarvan bedoelde uitkering is verleend, tot het bedrag, waarop die uitkering,
      ten hoogste berekend naar een dagloon ter hoogte van het bedrag, bepaald krachtens het eerste lid van
      [artikel 9 van de Coördinatiewet Sociale Verzekering][ref4], zoals dat artikel luidde op de dag, voorafgaande aan
      die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref5], genoemde wetten werden ingetrokken, en voorts
      zonder toepassing van [artikel 8, vijfde lid][ref6], zou zijn gesteld;

      b. de administratiekosten ter zake van de aan [artikel 4][ref7] ontleende uitkering gedurende de eerste zes weken
      na de dag van het ongeval.

      2 Het Arbeidsongeschiktheidsfonds schiet aan de Sociale Verzekeringsbank, de bedrijfsverenigingen als bedoeld in
      artikel 13 van de Land- en Tuinbouwongevallenwet 1922 en de Vereeniging "Zee-Risico" desgevraagd gelden voor ter
      financiering van de door haar ingevolge het bepaalde in dit hoofdstuk te verrichten betalingen.

      3 De Sociale Verzekeringsraad kan regelen stellen omtrent de verrekening van betalingen tussen de in het vorige
      lid genoemde organen alsmede omtrent de berekening van de ten laste van het Arbeidsongeschiktheidsfonds te brengen
      administratiekosten.


