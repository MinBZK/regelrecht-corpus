  - number: '2'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt met lichamelijk letsel, gevolg van een ongeval,
      gelijkgesteld lichamelijk letsel in een betrekkelijk korte tijd ontstaan als bedoeld in artikel 1, vierde lid, van
      de Ongevallenwet 1921 en artikel 2, vierde lid, van de Land- en Tuinbouwongevallenwet 1922.
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel2
  - number: '3'
    text: |-
      1 Onverminderd het overigens bij of krachtens deze wet bepaalde worden met ingang van de dag, waarop
      [artikel 19 van de Wet op de arbeidsongeschiktheidsverzekering][ref1] in werking treedt, ingetrokken:

      a. de wet van 2 januari 1901, *Stb.* 1, (Ongevallenwet 1921);

      b. de wet van 20 mei 1922, *Stb.* 365, (Land- en Tuinbouwongevallenwet 1922);

      c. de wet van 8 mei 1915, *Stb.* 214, (Zeeongevallenwet 1919);

      d. de wet van 26 mei 1950, *Stb.* K 191, (Wet tot aanvulling der ongevallenrenten);

      e. de wet van 4 juli 1957, *Stb.* 223, (Wet compensatie premie [Algemene Ouderdomswet][ref2]
      ongevallenrentetrekkers);

      f. de wet van 10 oktober 1962, *Stb.* 394, tot tijdelijke verdere verhoging van ongevalsuitkeringen;

      g. de wet van 13 februari 1964, *Stb.* 62, tot tijdelijke verdere verhoging van ongevalsuitkeringen;

      h. de wet van 1 maart 1946, *Stb.* G 46, betreffende ongevallenverzekering van werknemers, die bij hun
      arbeid in ernstige mate aan het gevaar blootstaan te worden getroffen door ongevallen, welke als gevolg van
      oorlogshandelingen plaatshebben;

      i. de wet van 24 juli 1903, *Stb.* 245, ter voorkoming van gelijktijdig genot van wegens hetzelfde feit toegekende
      tijdelijke uitkering of rente ingevolge de Ongevallenwet 1901 en pensioen of onderstand ten laste van de Staat;

      j. de wet van 25 november 1953, *Stb.* 560, betreffende ongevallenverzekering van de vrijwillige brandweer.

      2 De bepalingen van de in het vorige lid genoemde wetten en van haar uitvoeringsbesluiten, zoals deze luidden op
      de dag, voorafgaande aan die, waarop die wetten werden ingetrokken, blijven van toepassing ten aanzien van rechten,
      bevoegdheden en verplichtingen, betrekking hebbende op tijdvakken, gelegen vóór de in het vorige lid bedoelde dag.

      3 Het bepaalde in artikel 10 van de in het eerste lid, onder *f*, in artikel 4 van de in dat lid, onder *h*, en in
      artikel 9 van de in dat lid, onder *j*, genoemde wet blijft van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002524#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel3
