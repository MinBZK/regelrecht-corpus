  - number: '14'
    text: |-
      Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref1],
      genoemde wetten worden ingetrokken, recht heeft op een uitkering als bedoeld in artikel 19, onder 2°, van de
      Ongevallenwet 1921, artikel 40, onder 2°, van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, tweede lid, van
      de Zeeongevallenwet 1919, behoudt dit recht, indien en voor zolang hij dit recht zou hebben gehad, indien genoemde
      wetten niet zouden zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel14
