  - number: '9'
    text: |-
      1 Degene, die op de dag, voorafgaande aan die, waarop de in [artikel 3, eerste lid, onder a, b en c][ref1], genoemde
      wetten worden ingetrokken, recht heeft op een uitkering als bedoeld in artikel 16 van de Ongevallenwet 1921,
      artikel 37 van de Land- en Tuinbouwongevallenwet 1922 of artikel 2, eerste lid, onder *a*, van de Zeeongevallenwet
      1919, ter zake van een ongeval, dat plaatsvond een jaar of langer vóór laatstbedoelde dag, heeft - onverminderd
      het bepaalde in [artikel 13 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref2] en in
      [artikel 17][ref3] - indien hij op de laatste dag van de maand, met ingang van welke die wetten worden ingetrokken,
      de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref4], niet
      heeft bereikt, geen recht meer op bedoelde uitkering met ingang van de eerste dag van die maand.

      2 De in het eerste lid bedoelde persoon behoudt, mits hij op de laatste dag van de maand, met ingang van welke
      de in [artikel 3, eerste lid, onder a, b en c][ref5], genoemde wetten worden ingetrokken, de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref6], heeft bereikt, het recht op
      de in het eerste lid bedoelde uitkering, indien en voor zolang hij dat recht zou hebben behouden, indien bedoelde
      wetten niet zouden zijn ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0002553#Artikel17
