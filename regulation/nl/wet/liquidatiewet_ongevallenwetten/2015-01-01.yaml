  - number: '16'
    text: |-
      Ten aanzien van een overlijden als bedoeld in [artikel 15][ref1] bestaat recht op schadeloosstelling voor
      lijkbezorging als bedoeld in artikel 19, onder 1°, van de Ongevallenwet 1921, artikel 40, onder 1°, van de
      Land- en Tuinbouwongevallenwet 1922 of artikel 2, twaalfde lid, van de Zeeongevallenwet 1919, voor degene,
      die dit recht zou hebben gehad, indien genoemde wetten niet zouden zijn ingetrokken. Het bepaalde in de
      [tweede volzin van het eerste lid van artikel 15][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel15
