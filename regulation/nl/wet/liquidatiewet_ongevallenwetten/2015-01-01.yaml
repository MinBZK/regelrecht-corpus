  - number: '12'
    text: |-
      1 Het recht op genees- en heelkundige behandeling of vergoeding daarvoor als bedoeld in
      artikel 14 van de Ongevallenwet 1921, artikel 35 van de Land- en Tuinbouwongevallenwet 1922 of
      artikel 2, achtste lid, van de Zeeongevallenwet 1919 ter zake van een vóór de dag, waarop de in
      [artikel 3, eerste lid, onder a, b en c][ref1], genoemde wetten worden ingetrokken, plaatsgevonden hebbend
      ongeval, vervalt met ingang van bedoelde dag, onverminderd het bepaalde bij of krachtens het tweede lid,
      [artikel 44 van de Wet overgangsregeling arbeidsongeschiktheidsverzekering][ref2], en hoofdstuk II, § 3, van de Wet
      op de arbeidsongeschiktheidsverzekering.

      2 Degene, die op de dag, waarop de in [artikel 3, eerste lid, onder c][ref3], genoemde wet wordt ingetrokken,
      ter zake van een hem vóór die dag overkomen ongeval ingevolge het bepaalde in artikel 2, achtste lid, van de
      Zeeongevallenwet 1919 in verbinding met het bepaalde in artikel 1, derde lid, van het Koninklijk besluit van 22
      mei 1947, *Stb.* H 153, recht heeft op vrij vervoer, hieronder begrepen de kosten van onderhoud en nachtverblijf
      gedurende de reis, behoudt dit recht, indien hij dit recht zou hebben behouden, indien genoemde wet niet zou zijn
      ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002551#Artikel44
      [ref3]: https://wetten.overheid.nl/BWBR0002553#Artikel3
