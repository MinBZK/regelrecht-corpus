        paragraaf: '5'
  - number: '24'
    text: |-
      1 Aan de belanghebbende wordt schriftelijk kennis gegeven van een beslissing, welke verband houdt met het recht op
      een afkoopsom als bedoeld in [artikel 17][ref1] of [18][ref2].

      2 Een kennisgeving als bedoeld in het vorige lid, is gedagtekend, vermeldt de gronden, waarop de beslissing berust,
      alsmede naam en adres van het college, waarbij ingevolge het bepaalde in het vierde lid beroep kan worden ingesteld
      en de termijn van beroep.

      3 Tegen een beslissing, waarvan ingevolge het bepaalde in het eerste lid schriftelijk kennis wordt gegeven, staat
      voor de belanghebbende beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0002553#Artikel17
      [ref2]: https://wetten.overheid.nl/BWBR0002553#Artikel18
    url: https://wetten.overheid.nl/BWBR0002553/2015-01-01#Artikel24
