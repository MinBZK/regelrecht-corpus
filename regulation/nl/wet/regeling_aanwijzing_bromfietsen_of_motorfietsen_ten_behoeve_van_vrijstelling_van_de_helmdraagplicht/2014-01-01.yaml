  - number: '8'
    text: |-
      Deze regeling treedt in werking op het tijdstip waarop het koninklijk besluit van 18 oktober 2001, houdende
      wijziging van het Reglement verkeersregels en verkeerstekens 1990 en het [Voertuigreglement][ref1] (wijzigingen
      helmdraagplicht) (Stb. 519) in werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006746
