articles:
  - number: '1'
    text: |-
      Onder de vermelding in deze regeling van een EG-richtlijn wordt verstaan hetgeen daaronder
      wordt begrepen in [artikel 1.2 van de Regeling voertuigen][ref1], met inbegrip van de ingevolge
      [artikel 1.3, eerste lid, van de Regeling voertuigen][ref2] bekendgemaakte wijzigingen.
      [Artikel 1.3, tweede lid, van de Regeling voertuigen][ref3] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1.2
