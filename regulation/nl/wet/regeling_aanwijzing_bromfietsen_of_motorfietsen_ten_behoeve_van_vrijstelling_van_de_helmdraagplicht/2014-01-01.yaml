  - number: '2'
    text: |-
      1 Door de Dienst Wegverkeer wordt een type bromfiets, niet zijnde brommobiel, of motorfiets als bedoeld in artikel
      60, tweede lid, van het Reglement verkeersregels en verkeerstekens op aanvraag aangewezen ten behoeve van een
      vrijstelling van de helmdraagplicht als bedoeld in artikel 60, indien dit type:

      a. een typegoedkeuring op grond van artikel 22 van de wet heeft verkregen,

      b. volgens een aan de Dienst Wegverkeer overgelegd testrapport voldoet aan de in [artikel 4][ref1] opgenomen eisen,
      en

      c. voldoet aan het gestelde in [artikel 5][ref2].

      2 In de aanwijzing worden de zitplaatsen genoemd waarvoor de vrijstelling geldt.

      3 De aanwijzing van een type bromfiets, niet zijnde brommobiel, of motorfiets wordt door de Directeur van de Dienst
      Wegverkeer bekendgemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0012978#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0012978#Artikel5
    url: https://wetten.overheid.nl/BWBR0012978/2014-01-01#Artikel2
    references:
      - id: ref1
