        artikel: '5'
        paragraaf: '2'
  - number: '3'
    text: |-
      1 Van een motorfiets behorend tot een aangewezen type:

      a. wordt in het kentekenregister aangetekend dat er een vrijstelling is verleend ten
      aanzien van de verplichting tot het dragen van een goed passende helm als bedoeld in
      [artikel 60, eerste lid, van het Reglement verkeersregels en verkeerstekens 1990][ref1];

      b. worden in het kentekenregister de zitplaatsen vermeld waarvoor deze vrijstelling geldt.

      2 Op verzoek van de aanvrager verstrekt de Dienst Wegverkeer een bewijs van vrijstelling als bedoeld in het eerste
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0004825#Artikel60
    url: https://wetten.overheid.nl/BWBR0012978/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004825
        artikel: '60'
  - number: '4'
    text: >-
      1 Uit het testrapport blijkt dat de bromfiets, niet zijnde brommobiel, of motorfiets is onderworpen aan de volgende
      testen:


      a. een zijdelingse aanrijding door een personenauto (testconfiguratie 1);


      b. een frontale botsing tussen de bromfiets, niet zijnde brommobiel, of de motorfiets en personenauto onder een
      hoek van 45° (tekstconfiguratie 2);


      c. een zijdelingse aanrijding van de bromfiets, niet zijnde brommobiel, of de motorfiets tegen een personenauto
      onder een hoek van 45° (testconfiguratie 4);


      d. een schampende frontale aanrijding tussen een personenauto en de bromfiets, niet zijnde brommobiel, of de
      motorfiets (testconfiguratie 6);


      e. een zijdelingse aanrijding van de bromfiets, niet zijnde brommobiel, of de motorfiets tegen een personenauto
      (testconfiguratie 7);


      f. kanteltest en test daksterkte als beschreven in de bijlage;


      g. een test betreffende de uitstekende delen, bedoeld in het derde hoofdstuk van [richtlijn 97/24/EG](31997L0024).


      2 De testen genoemd in het eerste lid, onderdelen a tot en met e, worden uitgevoerd overeenkomstig de daarbij
      aangegeven testconfiguraties, zoals opgenomen in NEN-ISO 13232-2 (februari 1997), paragraaf 4.3.1, waarbij wanneer
      het een test betreft ten behoeve van de aanwijzing van een bromfiets, niet zijnde een brommobiel, de snelheid kan
      worden beperkt tot 12,5 meter per seconde.


      3 Uit het testrapport blijkt dat een voldoende beschermingsniveau wordt gewaarborgd, met dien verstande dat bij de
      testen genoemd in het eerste lid, onderdelen a tot en met e, en de kanteltest, bedoeld in onderdeel f, de maximale
      waarde van de belasting van de kop van de testdummy de waarde van HPC=1000 niet is overschreden.


      4 Met de in dit artikel bedoelde testen worden gelijkgesteld testen die aan ten minste gelijkwaardige eisen
      voldoen.
    url: https://wetten.overheid.nl/BWBR0012978/2014-01-01#Artikel4
  - number: '5'
    text: >-
      1 De ruiten in de veiligheidscel voldoet aan paragraaf 1.1 of 1.2 van hoofdstuk 12 van bijlage I van [richtlijn
      97/24/EG](31997L0024).


      2 De buitenranden van de veiligheidscel voldoen, ter voorkoming van beknelling van het hoofd of ledematen, aan
      hoofdstuk 3 van bijlage II van [richtlijn 97/24/EG](31997L0024), tenzij stootkussens in mogelijke risicogebieden
      voor het hoofd en ledematen zijn aangebracht.


      3 De gordelbevestigingspunten en het gordelsysteem voldoen aan hoofdstuk 11 van [richtlijn 97/24/EG](31997L0024).


      4 Indien het gordelsysteem, bedoeld in het derde lid, met de hand wordt bediend, is in het directe zichtveld van de
      bestuurder een waarschuwingssignaal van een passende lichtsterkte aangebracht, dat brandt indien bij een in bedrijf
      zijnde motor het gordelsysteem niet of niet volledig is aangelegd.


      5 Het waarschuwingssignaal, bedoeld in het derde lid, voldoet aan afbeelding 9 van bijlage III van [richtlijn
      nr. 78/316/EEG](31978L0316) van de Raad van 21 december 1977 inzake de onderlinge aanpassing van de wetgevingen
      der Lid-Staten betreffende de binneninrichting van motorvoertuigen (identificatie van bedieningsorganen,
      verklikkerlichten en meters) (PbEG L 81).


      6 Het waarschuwingssignaal, bedoeld in het derde lid, behoeft niet aanwezig te zijn indien het voertuig zodanig
      ontworpen is dat de motor het voertuig niet kan voortbewegen wanneer het gordelsysteem niet volledig is aangelegd.
    url: https://wetten.overheid.nl/BWBR0012978/2014-01-01#Artikel5
  - number: '6'
    text: |-
      Een wijziging van [richtlijn 97/24/EG](31997L0024), van bijlage III van [richtlijn nr. 78/316/EEG](31978L0316)
      van de Raad van 21 december 1977 inzake de onderlinge aanpassing van de wetgevingen der Lid-Staten betreffende
      de binneninrichting van motorvoertuigen (identificatie van bedieningsorganen, verklikkerlichten en meters) (PbEG
      L 81) of van bijlage II van [richtlijn nr. 96/27/EG](31996L0027) van het Europees Parlement en de Raad van de
      Europese Unie van 20 mei 1996 betreffende de bescherming van de inzittenden van motorvoertuigen bij zijdelingse
      botsingen en houdende wijziging van [richtlijn nr. 70/156/EEG](31970L0156) (PbEG L 169) gaat voor de toepassing van
      de [artikelen 1][ref1], [4][ref2] en [5][ref3] en de bijlage, gelden met ingang van de dag waarop de betrokken
      wijzigingsrichtlijn ingevolge [artikel 1.3 van de Regeling voertuigen][ref4] voor de toepassing van dat besluit in
      werking treedt.


      [ref1]: https://wetten.overheid.nl/BWBR0012978#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012978#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0012978#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0025798#Artikel1.3
