preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is om de Wet op het financieel toezicht en de Wet
    financiële markten BES te wijzigen teneinde een aansprakelijkheidsbeperking in te voeren voor De Nederlandsche Bank
    N.V. en de Stichting Autoriteit Financiële Markten en dat het voorts wenselijk is regels te stellen met betrekking
    tot de beloning van dagelijks beleidsbepalers van financiële ondernemingen die staatssteun genieten in verband met
    de stabiliteit van het financieel stelsel;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031680/2015-02-07#ArtikelAanhef
articles:
  - number: III
    text: |-
      [Artikel 1:25d van de Wet op het financieel toezicht][ref1] is niet van toepassing op een handelen of nalaten van
      De Nederlandsche Bank N.V., de stichting Autoriteit Financiële Markten, de leden van hun organen en hun werknemers
      dat vóór het in werking treden van deze wet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel125d
    url: https://wetten.overheid.nl/BWBR0031680/2015-02-07#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: 1:25d
  - number: Va
    text: |-
      In afwijking van [artikel 1:102, derde lid, van de Wet op het financieel toezicht][ref1] beslist de Autoriteit
      Financiële Markten binnen twaalf maanden na ontvangst op een aanvraag van een vergunning voor het in Nederland
      aanbieden van beleggingsobjecten als bedoeld in [artikel 1:1 van die wet][ref2], voor zover die aanvraag is
      ingediend door een natuurlijke persoon, rechtspersoon of vennootschap die voor 1 januari 2012 beleggingsobjecten
      heeft aangeboden voor een nominaal bedrag van ten minste € 50 000 en minder dan € 100 000. Bij ministeriële
      regeling kan die termijn twee maal worden verlengd met een periode van ten hoogste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1102
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel11
    url: https://wetten.overheid.nl/BWBR0031680/2015-02-07#ArtikelVa
    references:
      - id: ref1
