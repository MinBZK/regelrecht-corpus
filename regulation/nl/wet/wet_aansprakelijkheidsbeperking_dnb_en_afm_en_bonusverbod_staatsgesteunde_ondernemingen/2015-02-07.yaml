        artikel: 1:1
  - number: VI
    text: |-
      1 Deze wet, met uitzondering van de [artikelen IV][ref1], [V][ref2] en [Va][ref3], treedt in werking op een bij
      koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen verschillend kan worden vastgesteld.

      2 De [artikelen IV][ref4], [V][ref5] en [Va][ref6] treden in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin deze wet wordt geplaatst. De [artikelen IV][ref7] en [V][ref8] werken, voor
      financiële ondernemingen waaraan na 6 oktober 2011 steun wordt verleend, terug tot en met 6 oktober 2011.


