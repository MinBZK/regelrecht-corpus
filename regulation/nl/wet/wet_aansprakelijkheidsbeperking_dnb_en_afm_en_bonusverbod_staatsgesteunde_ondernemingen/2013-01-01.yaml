preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging hebben genomen, dat het wenselijk is om de Wet op het financieel toezicht en de Wet
    financiële markten BES te wijzigen teneinde een aansprakelijkheidsbeperking in te voeren voor De Nederlandsche Bank
    N.V. en de Stichting Autoriteit Financiële Markten en dat het voorts wenselijk is regels te stellen met betrekking
    tot de beloning van dagelijks beleidsbepalers van financiële ondernemingen die staatssteun genieten in verband met
    de stabiliteit van het financieel stelsel;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      [Artikel 1:25d van de Wet op het financieel toezicht][ref1] is niet van toepassing op een handelen of nalaten van
      De Nederlandsche Bank N.V., de stichting Autoriteit Financiële Markten, de leden van hun organen en hun werknemers
      dat vóór het in werking treden van deze wet heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: V.1
    text: |-
      [Artikel 1:112 van de Wet op het financieel toezicht][ref1] is niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: V.1.a
    text: |-
      beloningen over perioden waarin voorafgaand aan de inwerkingtreding van dat artikel steun is genoten, indien die
      steun reeds voor 6 oktober 2011 was verleend en voorafgaand aan het tijdstip van inwerkingtreding van dat artikel
      was beëindigd;
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelV
  - number: V.1.b
    text: |-
      beloningen van dagelijks beleidsbepalers, niet zijnde bestuurders, voor zover het steun betreft die is verleend aan
      een financiële onderneming voor 7 februari 2012.
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelV
  - number: V.2
    text: |-
      [Artikel 1:112, eerste lid, aanhef en onderdeel a, van de Wet op het financieel toezicht][ref1] is, indien een
      financiële onderneming op het tijdstip van inwerkingtreding van dat artikel steun geniet en deze steun reeds
      voor 6 oktober 2011 was verleend, niet van toepassing op reeds voor 26 oktober 2011 toegekende, maar nog niet
      uitgekeerde beloningen van haar bestuurders.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: V.3
    text: |-
      In afwijking van [artikel 1:112, eerste lid, onderdeel b, van de Wet op het financieel toezicht][ref1] wordt,
      indien een financiële onderneming op het tijdstip van inwerkingtreding van dat artikel steun geniet, en deze
      steun reeds voor 6 oktober 2011 was verleend, bij het bepalen van de waarde van de overige delen van de beloning
      van haar bestuurders uitgegaan van de waarde die deze overige delen van de beloning hadden op het tijdstip van
      inwerkingtreding van dat artikel, met dien verstande dat de voor de toepassing van artikel 1:112, eerste lid,
      onderdeel b, in acht te nemen waarde ten hoogste 120% van de waarde op 26 oktober 2011 bedraagt.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: V.4
    text: |-
      In een geval als bedoeld in [artikel 1:112, vijfde of zesde lid, van de Wet op het financieel toezicht][ref1] wordt
      voor de toepassing van het tweede en derde lid voor «financiële onderneming» gelezen: de aan het hoofd van de groep
      staande groepsmaatschappij, onderscheidenlijk de binnen de groep hiërarchisch hoogste groepsmaatschappij met zetel
      in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0020368
        artikel: '1'
  - number: Va
    text: |-
      In afwijking van [artikel 1:102, derde lid, van de Wet op het financieel toezicht][ref1] beslist de Autoriteit
      Financiële Markten binnen twaalf maanden na ontvangst op een aanvraag van een vergunning voor het in Nederland
      aanbieden van beleggingsobjecten als bedoeld in [artikel 1:1 van die wet][ref2], voor zover die aanvraag is
      ingediend door een natuurlijke persoon, rechtspersoon of vennootschap die voor 1 januari 2012 beleggingsobjecten
      heeft aangeboden voor een nominaal bedrag van ten minste € 50 000 en minder dan € 100 000. Bij ministeriële
      regeling kan die termijn twee maal worden verlengd met een periode van ten hoogste zes maanden.


      [ref1]: https://wetten.overheid.nl/BWBR0020368#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020368#Artikel1
    url: https://wetten.overheid.nl/BWBR0031680/2013-01-01#ArtikelVa
    references:
