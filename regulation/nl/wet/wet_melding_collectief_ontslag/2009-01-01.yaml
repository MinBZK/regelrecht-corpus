$id: wet_melding_collectief_ontslag
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2009-01-01'
bwb_id: BWBR0003026
url: https://wetten.overheid.nl/BWBR0003026/2009-01-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is werkgevers die voornemens zijn tot collectief ontslag
    van werknemers over te gaan, te verplichten dit te melden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel1
  - number: 1.a
    text: '*Onze Minister*, Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel1
  - number: 1.b
    text: |-
      *werkgever* en *werknemer:* partijen bij een arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.c
    text: |-
      bevoegd gezag: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] dan
      wel een organisatie uit het bedrijfsleven waaraan door Onze Minister op grond van
      [artikel 32 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] de bevoegdheid tot het verlenen van
      toestemming krachtens [artikel 6, eerste lid, van dat Besluit][ref3] is overgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel6
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002014
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '6'
  - number: 1.d
    text: '*werkgebied:* een door Onze Minister vastgesteld gebied.'
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel1
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op het doen eindigen van een dienstbetrekking:'
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel2
  - number: 2.1.a
    text: waarvoor geen toestemming van het bevoegd gezag vereist is;
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel2
  - number: 2.1.b
    text: uitsluitend om redenen die de persoon van de werknemer betreffen.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel2
  - number: '2.2'
    text: |-
      Deze wet is voorts niet van toepassing op het doen eindigen van dienstbetrekkingen wegens het aflopen van de
      seizoenarbeid voor het verrichten waarvan zij werden aangegaan. Onze Minister kan arbeid aanwijzen, die voor de
      toepassing van de vorige volzin in ieder geval als seizoenarbeid wordt beschouwd. Een zodanige aanwijzing wordt in
      de *Nederlandse Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel2
  - number: '2.3'
    text: |-
      In afwijking van het eerste lid zijn de[ artikelen 3][ref1] en [4, eerste en tweede lid][ref2] van deze wet tevens
      van toepassing op het doen eindigen van dienstbetrekkingen ten gevolge van faillissement van de werkgever of
      toepassing ten aanzien van hem van de schuldsaneringsregeling natuurlijke personen.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003026#Artikel4
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003026
        artikel: '4'
        paragraaf: '2'
  - number: '3.1'
    text: |-
      Een werkgever die voornemens is de dienstbetrekkingen van ten minste twintig werknemers, werkzaam in één
      werkgebied, op een of meer binnen een tijdvak van drie maanden gelegen tijdstippen te doen eindigen, meldt dit
      ter tijdige raadpleging schriftelijk aan de belanghebbende verenigingen van werknemers. Een gelijke schriftelijke
      melding doet hij aan het bevoegd gezag; in geval van faillissement alleen op verzoek van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel3
  - number: '3.2'
    text: |-
      Voor de berekening van het in het eerste lid bedoelde aantal werknemers wordt met de in dat lid bedoelde wijze
      van beëindiging van de dienstbetrekking gelijk gesteld een verzoek tot ontbinding van de arbeidsovereenkomst
      als bedoeld in [artikel 685 van Boek 7 van het Burgerlijk Wetboek][ref1], ingediend door de werkgever om een of
      meer redenen die geen betrekking hebben op de persoon van de werknemer, op voorwaarde dat het aantal ingediende
      verzoeken gelijk is aan of hoger is dan vijf.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
  - number: '3.3'
    text: |-
      De raadpleging, bedoeld in het eerste lid, heeft ten minste betrekking op de mogelijkheden om de collectieve
      ontslagen te voorkomen of in aantal te verminderen alsook op de mogelijkheid de gevolgen ervan te verzachten, door
      het nemen van sociale begeleidingsmaatregelen, meer bepaald om bij te dragen tot de herplaatsing of de omscholing
      van de ontslagen werknemers.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel3
  - number: '3.4'
    text: |-
      Als belanghebbende vereniging van werknemers wordt beschouwd een vereniging van werknemers, die in de onderneming
      werkzame personen onder haar leden telt, krachtens haar statuten ten doel heeft de belangen van haar leden als
      werknemers te behartigen, als zodanig in de betrokken onderneming of bedrijfstak werkzaam is, voorts ten minste
      twee jaar in het bezit is van rechtspersoonlijkheid en als zodanig aan de werkgever bekend is. Deze bekendheid
      wordt verondersteld, indien de vereniging aan de werkgever schriftelijk heeft te kennen gegeven dat zij prijs stelt
      op meldingen van voornemens als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel3
  - number: '4.1'
    text: |-
      De werkgever doet bij de meldingen, bedoeld in [artikel 3, eerste lid][ref1], opgave van de overwegingen die tot
      het daar bedoelde voornemen hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: 'De werkgever doet bij de meldingen voorts zo nauwkeurig mogelijk opgave van:'
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: 4.2.a
    text: |-
      het aantal werknemers wier dienstbetrekkingen hij voornemens is te doen eindigen, met een onderverdeling naar
      beroep of functie, leeftijd en geslacht, alsmede het aantal werknemers dat hij gewoonlijk in dienst heeft;
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: 4.2.b
    text: het tijdstip of de tijdstippen waarop hij de dienstbetrekkingen volgens zijn voornemen zal doen eindigen.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: 4.2.c
    text: de criteria die aangelegd zullen worden bij het selecteren van de voor ontslag in aanmerking komende werknemers;
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: 4.2.d
    text: de wijze van berekening van eventuele afvloeiingsuitkeringen.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: '4.3'
    text: |-
      De werkgever doet de melding aan het bevoegd gezag vergezeld gaan van een afschrift van de melding aan de
      belanghebbende verenigingen van werknemers. Hij zendt aan deze verenigingen een afschrift van de melding aan het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: '4.4'
    text: 'Ten slotte geeft de werkgever bij de melding aan het bevoegd gezag op:'
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: 4.4.a
    text: of voor de onderneming waarin de betrokken werknemers werkzaam zijn, een ondernemingsraad is ingesteld;
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: 4.4.b
    text: |-
      of het voornemen van de werkgever verband houdt met een besluit als bedoeld in
      [artikel 25, eerste lid, van de Wet op de ondernemingsraden][ref1]; en zo ja,


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
  - number: 4.4.c
    text: |-
      het tijdstip waarop de ondernemingsraad over het betrokken besluit is of zal worden geraadpleegd, dan wel daarvan
      in kennis gesteld en geraadpleegd over de uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: '4.5'
    text: |-
      De werkgever houdt het bevoegd gezag op de hoogte van de raadpleging van de belanghebbende verenigingen van
      werknemers en van de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel4
  - number: '5'
    text: |-
      Indien bij een melding aan het bevoegd gezag de ingevolge [artikel 4, eerste t/m vierde lid][ref1] vereiste
      gegevens niet volledig zijn verstrekt, zendt het bevoegd gezag aan de werkgever een schriftelijke mededeling,
      aangevende welke gegevens nog ontbreken. Zolang de ontbrekende gegevens niet zijn verstrekt, wordt de melding
      geacht niet te zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel4
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '4'
        paragraaf: '2'
  - number: '6.1'
    text: |-
      Het bevoegd gezag neemt verzoeken om toestemming tot het doen eindigen van de dienstbetrekkingen van werknemers ter
      uitvoering van een voornemen als bedoeld in [artikel 3, eerste lid][ref1], niet eerder in behandeling dan een maand
      nadat dat voornemen is gemeld zoals bedoeld in de[ artikelen 3-5][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: '6.2'
    text: |-
      Indien uit de melding blijkt, dat de ondernemingsraad van de betrokken onderneming alsnog geraadpleegd dient
      te worden of indien de belanghebbende verenigingen van werknemers door de werkgever nog niet voor het plegen
      van overleg zijn uitgenodigd, neemt het bevoegd gezag de in het eerste lid bedoelde verzoeken niet eerder in
      behandeling dan nadat aan dit gezag gebleken is dat die raadpleging heeft plaatsgevonden, onderscheidenlijk dat die
      uitnodiging is gedaan.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel6
  - number: '6.3'
    text: |-
      Het bevoegd gezag kan het eerste en het tweede lid ten aanzien van daar bedoelde verzoeken buiten toepassing laten,
      indien die toepassing de herplaatsing van de met het ontslag bedreigde werknemers of de werkgelegenheid van de
      overige werknemers in de betrokken onderneming in gevaar zou brengen.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel6
  - number: '6.4'
    text: |-
      Een besluit tot het buiten toepassing laten van het eerste en tweede lid behoeft de goedkeuring van Onze Minister.
      De goedkeuring kan slechts worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel6
  - number: 6a
    text: |-
      Indien de melding wordt ondersteund door een verklaring van de belanghebbende verenigingen van werknemers dat zij
      zijn geraadpleegd en dat zij zich ermee kunnen verenigen, kunnen de verzoeken onmiddellijk in behandeling worden
      genomen.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel6a
  - number: '7.1'
    text: |-
      Zodra het bevoegd gezag heeft vastgesteld dat een werkgever binnen een tijdvak van drie maanden heeft verzocht
      om toestemming tot het doen eindigen van de dienstbetrekkingen van ten minste twintig werknemers zonder dat
      die werkgever een die werknemers omvattende melding als bedoeld in [artikel 3, eerste lid][ref1], heeft gedaan,
      neemt het bevoegd gezag de verzoeken waarop het nog niet heeft beslist niet of niet verder in behandeling. Van de
      toepassing van de vorige volzin doet het bevoegd gezag schriftelijk mededeling aan de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De werkgever wordt alsdan geacht voornemens te zijn de dienstbetrekkingen van de in het eerste lid bedoelde
      werknemers binnen een tijdvak van drie maanden te doen eindigen.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel7
  - number: '7.3'
    text: |-
      De behandeling van de verzoeken waarop nog niet is beslist, wordt niet eerder aangevangen of voortgezet dan twee
      maanden nadat de werkgever overeenkomstig de[ artikelen 3-5][ref1] een melding heeft gedaan welke alle in het
      eerste lid bedoelde werknemers omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: '7.4'
    text: |-
      [Artikel 6, tweede, derde en vierde lid][ref1], en [artikel 6a][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0003026#Artikel6a
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '6'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0003026
        artikel: 6a
        paragraaf: '2'
  - number: '8'
    text: |-
      Ieder die uit hoofde van zijn functie bij een vereniging van werknemers of in een commissie die het bevoegd gezag
      van advies dient, kennis neemt van een melding als bedoeld in [artikel 3, eerste lid][ref1] is verplicht tot
      geheimhouding van deze melding en van de inhoud daarvan, indien de werkgever dit bij die melding, onder opgave van
      redenen, uitdrukkelijk heeft verzocht. Deze verplichting vervalt zodra de verzoeken om toestemming tot ontslag in
      behandeling worden genomen, dan wel zoveel eerder als daaromtrent overeenstemming wordt bereikt tussen de werkgever
      en de verenigingen van werknemers aan welke de melding is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: '9.1'
    text: 'Deze wet kan worden aangehaald als: Wet melding collectief ontslag.'
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel9
  - number: '9.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003026/2009-01-01#Artikel9
