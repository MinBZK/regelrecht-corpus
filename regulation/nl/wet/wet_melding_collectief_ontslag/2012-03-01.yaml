$id: wet_melding_collectief_ontslag
regulatory_layer: WET
publication_date: '2016-07-21'
valid_from: '2012-03-01'
bwb_id: BWBR0003026
url: https://wetten.overheid.nl/BWBR0003026/2012-03-01
preamble:
  text: |-
    Wij Juliana, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is werkgevers die voornemens zijn tot collectief ontslag
    van werknemers over te gaan, te verplichten dit te melden;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel1
  - number: 1.a
    text: '*Onze Minister*, Onze Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel1
  - number: 1.b
    text: |-
      *werkgever* en *werknemer:* partijen bij een arbeidsovereenkomst als bedoeld in
      [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: 1.c
    text: |-
      bevoegd gezag: het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1] dan
      wel een organisatie uit het bedrijfsleven waaraan door Onze Minister op grond van
      [artikel 32 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref2] de bevoegdheid tot het verlenen van
      toestemming krachtens [artikel 6, eerste lid, van dat Besluit][ref3] is overgedragen;


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0002014#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0002014#Artikel6
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0002014
        artikel: '32'
      - id: ref3
        bwb_id: BWBR0002014
        artikel: '6'
  - number: 1.d
    text: '*werkgebied:* een door Onze Minister vastgesteld gebied.'
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel1
  - number: '2.1'
    text: 'Deze wet is niet van toepassing op het beëindigen van:'
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel2
  - number: 2.1.a
    text: |-
      een arbeidsverhouding als bedoeld in [artikel 2 van het Buitengewoon Besluit Arbeidsverhoudingen 1945][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002014#Artikel2
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002014
        artikel: '2'
  - number: 2.1.b
    text: een arbeidsovereenkomst uitsluitend om redenen die de persoon van de werknemer betreffen;
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel2
  - number: 2.1.c
    text: een arbeidsovereenkomst tijdens de proeftijd;
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel2
  - number: 2.1.d
    text: een arbeidsovereenkomst met bestuurders van naamloze en besloten vennootschappen.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel2
  - number: '2.2'
    text: |-
      Deze wet is voorts niet van toepassing op het beëindigen van arbeidsovereenkomsten wegens het aflopen van de
      seizoenarbeid voor het verrichten waarvan zij werden aangegaan. Onze Minister kan arbeid aanwijzen, die voor de
      toepassing van de vorige volzin in ieder geval als seizoenarbeid wordt beschouwd. Een zodanige aanwijzing wordt in
      de *Nederlandse Staatscourant* bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel2
  - number: '3.1'
    text: |-
      Een werkgever die voornemens is de arbeidsovereenkomsten van ten minste twintig werknemers, werkzaam in één
      werkgebied, op een of meer binnen een tijdvak van drie maanden gelegen tijdstippen te beëindigen, meldt dit ter
      tijdige raadpleging schriftelijk aan de belanghebbende verenigingen van werknemers. Een gelijke schriftelijke
      melding doet hij aan het bevoegd gezag; in geval van faillissement alleen op verzoek van het bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel3
  - number: '3.2'
    text: |-
      De raadpleging, bedoeld in het eerste lid, heeft ten minste betrekking op de mogelijkheden om de collectieve
      ontslagen te voorkomen of in aantal te verminderen alsook op de mogelijkheid de gevolgen ervan te verzachten, door
      het nemen van sociale begeleidingsmaatregelen, meer bepaald om bij te dragen tot de herplaatsing of de omscholing
      van de werknemers ten aanzien van wie bij de werkgever het voornemen bestaat de arbeidsovereenkomst te beëindigen.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel3
  - number: '3.3'
    text: |-
      Als belanghebbende vereniging van werknemers wordt beschouwd een vereniging van werknemers, die in de onderneming
      werkzame personen onder haar leden telt, krachtens haar statuten ten doel heeft de belangen van haar leden als
      werknemers te behartigen, als zodanig in de betrokken onderneming of bedrijfstak werkzaam is, voorts ten minste
      twee jaar in het bezit is van rechtspersoonlijkheid en als zodanig aan de werkgever bekend is. Deze bekendheid
      wordt verondersteld, indien de vereniging aan de werkgever schriftelijk heeft te kennen gegeven dat zij prijs stelt
      op meldingen van voornemens als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel3
  - number: '4.1'
    text: |-
      De werkgever doet bij de meldingen, bedoeld in [artikel 3, eerste lid][ref1], opgave van de overwegingen die tot
      het daar bedoelde voornemen hebben geleid.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: '4.2'
    text: 'De werkgever doet bij de meldingen voorts zo nauwkeurig mogelijk opgave van:'
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: 4.2.a
    text: |-
      het aantal werknemers wier arbeidsovereenkomsten hij voornemens is te beëindigen, met een onderverdeling naar
      beroep of functie, leeftijd en geslacht, alsmede het aantal werknemers dat hij gewoonlijk in dienst heeft;
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: 4.2.b
    text: het tijdstip of de tijdstippen waarop hij de arbeidsovereenkomsten volgens zijn voornemen zal beëindigen.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: 4.2.c
    text: de criteria die aangelegd zullen worden bij het selecteren van de voor ontslag in aanmerking komende werknemers;
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: 4.2.d
    text: de wijze van berekening van eventuele afvloeiingsuitkeringen;
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: 4.2.e
    text: de wijze waarop hij voornemens is de arbeidsovereenkomsten met zijn werknemers te beëindigen.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: '4.3'
    text: |-
      De werkgever doet de melding aan het bevoegd gezag vergezeld gaan van een afschrift van de melding aan de
      belanghebbende verenigingen van werknemers. Hij zendt aan deze verenigingen een afschrift van de melding aan het
      bevoegd gezag.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: '4.4'
    text: 'Ten slotte geeft de werkgever bij de melding aan het bevoegd gezag op:'
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: 4.4.a
    text: of voor de onderneming waarin de betrokken werknemers werkzaam zijn, een ondernemingsraad is ingesteld;
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: 4.4.b
    text: |-
      of het voornemen van de werkgever verband houdt met een besluit als bedoeld in
      [artikel 25, eerste lid, van de Wet op de ondernemingsraden][ref1]; en zo ja,


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel25
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '25'
  - number: 4.4.c
    text: |-
      het tijdstip waarop de ondernemingsraad over het betrokken besluit is of zal worden geraadpleegd, dan wel daarvan
      in kennis gesteld en geraadpleegd over de uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: '4.5'
    text: |-
      De werkgever houdt het bevoegd gezag op de hoogte van de raadpleging van de belanghebbende verenigingen van
      werknemers en van de ondernemingsraad.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: '4.6'
    text: |-
      Het derde tot en met vijfde lid zijn niet van toepassing op het beëindigen van een arbeidsovereenkomst ten gevolge
      van faillissement van de werkgever of toepassing ten aanzien van hem van de schuldsaneringsregeling natuurlijke
      personen.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel4
  - number: '5'
    text: |-
      Indien bij een melding aan het bevoegd gezag de ingevolge [artikel 4, eerste t/m vierde lid][ref1] vereiste
      gegevens niet volledig zijn verstrekt, zendt het bevoegd gezag aan de werkgever een schriftelijke mededeling,
      aangevende welke gegevens nog ontbreken. Zolang de ontbrekende gegevens niet zijn verstrekt, wordt de melding
      geacht niet te zijn gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel4
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '4'
        paragraaf: '2'
  - number: 5a.1
    text: |-
      De arbeidsovereenkomst kan niet eerder door de werkgever worden opgezegd, op verzoek van de werkgever
      door de rechter worden ontbonden op grond van veranderingen in de omstandigheden als bedoeld in
      [artikel 685 van Boek 7 van het Burgerlijk Wetboek][ref1] of op initiatief van de werkgever door middel van een
      beëindigingsovereenkomst worden beëindigd, dan een maand nadat het voornemen daartoe is gemeld, tenzij uit een
      verklaring van de belanghebbende verenigingen van werknemers blijkt dat zij zijn geraadpleegd en dat zij zich met
      de beëindigingen kunnen verenigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
  - number: 5a.2
    text: |-
      Het eerste lid is niet van toepassing indien een arbeidsovereenkomst wordt beëindigd ten gevolge van het
      faillissement van de werkgever of toepassing ten aanzien van hem van de schuldsaneringsregeling natuurlijke
      personen.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel5a
  - number: '6.1'
    text: |-
      Het bevoegd gezag neemt verzoeken om toestemming tot het mogen opzeggen van de arbeidsovereenkomsten van werknemers
      niet eerder in behandeling, dan wel neemt verzoeken waarop het nog niet heeft beslist niet verder in behandeling
      dan nadat:
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6
  - number: 6.1.a
    text: de werkgever aan de verplichting tot melding heeft voldaan; en
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6
  - number: 6.1.b
    text: |-
      uit een schriftelijke verklaring van de werkgever blijkt dat de belanghebbende verenigingen van werknemers en de
      ondernemingsraad zijn geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6
  - number: '6.2'
    text: |-
      Het bevoegd gezag kan de verplichting tot raadpleging, bedoeld in het eerste lid, onderdeel b, buiten toepassing
      laten indien de werkgever aannemelijk maakt dat de naleving hiervan de herplaatsing van de met ontslag bedreigde
      werknemers of de werkgelegenheid van de overige werknemers in de betrokken onderneming in gevaar zou brengen.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6
  - number: '6.3'
    text: |-
      Een besluit als bedoeld in het tweede lid behoeft de goedkeuring van Onze Minister. De goedkeuring kan slechts
      worden onthouden wegens strijd met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6
  - number: 6a.1
    text: |-
      Een verzoek van de werkgever om de arbeidsovereenkomst met een werknemer om bedrijfseconomische
      redenen te ontbinden op grond van veranderingen in de omstandigheden, bedoeld in
      [artikel 685 van Boek 7 van het Burgerlijk Wetboek][ref1] kan de rechter slechts inwilligen, indien hij
      zich ervan heeft vergewist of het verzoek verband houdt met een voorgenomen beëindiging als bedoeld in
      [artikel 3, eerste lid][ref2], en zo ja, of bij het verzoekschrift een schriftelijke verklaring is gevoegd van:


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel685
      [ref2]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '685'
      - id: ref2
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: 6a.1.a
    text: het bevoegd gezag waaruit blijkt dat aan de verplichting tot melding is voldaan; en
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6a
  - number: 6a.1.b
    text: |-
      de werkgever waaruit blijkt dat de belanghebbende verenigingen van werknemers en de ondernemingsraad zijn
      geraadpleegd.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6a
  - number: 6a.2
    text: |-
      Indien niet is voldaan aan de verplichting tot raadpleging, bedoeld in het eerste lid, onderdeel b, kan de rechter
      een verzoek om de arbeidsovereenkomst te ontbinden slechts inwilligen, zo nodig met buiten toepassing laten van
      de termijn, bedoeld in [artikel 5a, eerste lid][ref1], indien de werkgever aannemelijk maakt dat de naleving van
      die verplichting de herplaatsing van de met ontslag bedreigde werknemers of de werkgelegenheid van de overige
      werknemers in de betrokken onderneming in gevaar zou brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel5a
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel6a
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: 5a
        paragraaf: '2'
  - number: '7.1'
    text: |-
      De opzegging door de werkgever, behoudens in het geval het bevoegd gezag daarvoor toestemming heeft
      verleend met toepassing van artikel 6, tweede en derde lid, en een op initiatief van de werkgever gesloten
      beëindigingsovereenkomst zijn vernietigbaar, indien:
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7
  - number: 7.1.a
    text: de werkgever niet aan de verplichting tot melding heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7
  - number: 7.1.b
    text: de werkgever de belanghebbende verenigingen van werknemers en de ondernemingsraad, niet heeft geraadpleegd; of
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7
  - number: 7.1.c
    text: |-
      niet is voldaan aan [artikel 5a, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel5a
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: 5a
        paragraaf: '2'
  - number: '7.2'
    text: |-
      De werknemer kan gedurende zes maanden na de opzegging van de arbeidsovereenkomst of het aangaan van de
      beëindigingsovereenkomst een beroep doen op een vernietigingsgrond als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7
  - number: 7a
    text: |-
      Voor de toepassing van deze wet wordt de werkgever geacht aan de verplichting tot raadpleging van een
      belanghebbende vereniging van werknemers te hebben voldaan indien deze vereniging:
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7a
  - number: 7a.a
    text: |-
      geen gevolg geeft aan een schriftelijke uitnodiging daartoe van de werkgever, mits die uitnodiging ten minste twee
      weken voor de datum van het overleg door de vereniging is ontvangen; of
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7a
  - number: 7a.b
    text: schriftelijk heeft aangegeven af te zien van raadpleging.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel7a
  - number: '8'
    text: |-
      Ieder die uit hoofde van zijn functie bij een vereniging van werknemers of in een commissie die het bevoegd gezag
      van advies dient, kennis neemt van een melding als bedoeld in [artikel 3, eerste lid][ref1] is verplicht tot
      geheimhouding van deze melding en van de inhoud daarvan, indien de werkgever dit bij die melding, onder opgave van
      redenen, uitdrukkelijk heeft verzocht. Deze verplichting vervalt zodra de verzoeken om toestemming tot het mogen
      opzeggen van de arbeidsovereenkomst of verzoeken om ontbinding van de arbeidsovereenkomst in behandeling worden
      genomen, dan wel zoveel eerder als daaromtrent overeenstemming wordt bereikt tussen de werkgever en de verenigingen
      van werknemers aan welke de melding is gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0003026#Artikel3
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0003026
        artikel: '3'
        paragraaf: '2'
  - number: '9.1'
    text: 'Deze wet kan worden aangehaald als: Wet melding collectief ontslag.'
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel9
  - number: '9.2'
    text: Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0003026/2012-03-01#Artikel9
