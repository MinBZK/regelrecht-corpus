preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje- Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de toepassing van het profijtbeginsel bij
    de watersysteemheffing te versterken, meer ruimte te geven aan waterschappen om beter in te spelen op
    klimaatadaptatie, de energietransitie en de circulaire economie, en enkele knelpunten in de waterschapsheffingen op
    te lossen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050855/2026-01-01#ArtikelAanhef
articles:
  - number: IV
    text: |-
      Ten aanzien van belastingen die betrekking hebben op belastingtijdvakken die zijn aangevangen voor het tijdstip
      van inwerkingtreding van deze wet, en op belastbare feiten die zich voor dat tijdstip hebben voorgedaan,
      blijven [hoofdstuk XVII][ref1] en [XVIIb van de Waterschapswet][ref2] en [artikel 7.5 van de Waterwet][ref3] van
      toepassing zoals deze luidden op het tijdstip onmiddellijk voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel I][ref4] onderscheidenlijk [artikel II][ref5] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVII
      [ref2]: https://wetten.overheid.nl/BWBR0005108#HoofdstukXVIIb
      [ref3]: https://wetten.overheid.nl/BWBR0025458#Artikel7.5
      [ref4]: https://wetten.overheid.nl/BWBR0050855#ArtikelI
      [ref5]: https://wetten.overheid.nl/BWBR0050855#ArtikelII
