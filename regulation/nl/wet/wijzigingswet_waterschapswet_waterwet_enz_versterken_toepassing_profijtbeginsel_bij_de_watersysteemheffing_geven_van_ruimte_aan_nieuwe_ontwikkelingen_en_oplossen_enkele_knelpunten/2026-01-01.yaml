  - number: V
    text: |-
      Ten aanzien van de behandeling van bezwaar of beroep dat voor het tijdstip van inwerkingtreding van deze wet is
      gemaakt onderscheidenlijk is ingesteld, blijft het recht zoals dat gold op dat tijdstip van toepassing.
    url: https://wetten.overheid.nl/BWBR0050855/2026-01-01#ArtikelV
  - number: VI
    text: |-
      Ten aanzien van een bezwaar dat voor het tijdstip van inwerkingtreding van deze wet is gemaakt, blijft wat betreft
      de wettelijke termijnen het recht gelden zoals dat luidde onmiddellijk voorafgaande aan dat tijdstip.
    url: https://wetten.overheid.nl/BWBR0050855/2026-01-01#ArtikelVI
  - number: X
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050855/2026-01-01#ArtikelX
