  - number: 125h
    text: |-
      1 Het bevoegd gezag mag geen onderscheid maken tussen ambtenaren in de arbeidsvoorwaarden op grond van het al dan
      niet tijdelijk karakter van de aanstelling, tenzij een dergelijk onderscheid objectief gerechtvaardigd is.

      2 Het bevoegd gezag stelt de ambtenaar die is aangesteld in tijdelijke dienst tijdig en duidelijk in kennis van een
      vacature met een dienstverband voor onbepaalde tijd.

      3 Het bevoegd gezag mag het dienstverband met de ambtenaar niet beëindigen wegens de omstandigheid dat betrokkene
      in of buiten rechte een beroep heeft gedaan op het bepaalde in het eerste lid of terzake bijstand heeft verleend.

      4 Het College, genoemd in [artikel 1 van de Wet College voor de rechten van de mens][ref1], kan onderzoeken of een
      onderscheid is of wordt gemaakt als bedoeld in het eerste lid. De [artikelen 10][ref2], [11][ref3], [12][ref4],
      [13][ref5], [22][ref6] en [23 van de Wet College voor de rechten van de mens][ref7] zijn van overeenkomstige
      toepassing.

      5 Het bevoegd gezag mag de ambtenaar niet benadelen wegens de omstandigheid dat de ambtenaar in of buiten rechte
      een beroep heeft gedaan op het bepaalde in het eerste lid of terzake bijstand heeft verleend.


