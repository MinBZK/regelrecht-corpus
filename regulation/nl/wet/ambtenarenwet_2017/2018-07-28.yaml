  - number: 125f
    text: |-
      1 Bij algemene maatregel van bestuur kunnen voor categorieën van ambtenaren die door of vanwege het Rijk
      zijn aangesteld en die uit hoofde van hun functie kennis kunnen nemen van zeer geheime of geheime gegevens
      betreffende de veiligheid of andere gewichtige belangen van de staat, voorschriften worden gesteld betreffende de
      verplichtingen waaraan deze ambtenaren zijn onderworpen in verband met het anders dan in de uitoefening van hun
      functie reizen naar en het verblijven in landen waarin het verblijf door deze ambtenaren een bijzonder risico voor
      de veiligheid of andere gewichtige belangen van de staat kan opleveren en die er toe strekken dit risico zoveel
      mogelijk te beperken.

      2 Een algemene maatregel van bestuur als bedoeld in het eerste lid treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125f
  - number: 125g
    text: |-
      1 Het bevoegd gezag mag geen onderscheid maken tussen ambtenaren op grond van een verschil in arbeidsduur in de
      voorwaarden waaronder een aanstelling wordt verleend, verlengd dan wel beëindigd, tenzij een dergelijk onderscheid
      objectief gerechtvaardigd is.

      2 Het bevoegd gezag mag het dienstverband met de ambtenaar niet beëindigen wegens de omstandigheid dat betrokkene
      in of buiten rechte een beroep heeft gedaan op het eerste lid of terzake bijstand heeft verleend.

      3 Het College, genoemd in [artikel 1 van de Wet College voor de rechten van de mens][ref1], kan onderzoeken of
      een onderscheid is of wordt gemaakt als bedoeld in dit artikel. De [artikelen 10][ref2], [11][ref3], [12][ref4],
      [13][ref5], [22][ref6] en [23 van de Wet College voor de rechten van de mens][ref7] zijn van overeenkomstige
      toepassing.

      4 Het bevoegd gezag mag de werknemer niet benadelen wegens de omstandigheid dat de werknemer in of buiten rechte
      een beroep heeft gedaan op het bepaalde in het eerste lid of terzake bijstand heeft verleend.


