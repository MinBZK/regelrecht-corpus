  - number: '115'
    text: |-
      1 In deze titel wordt verstaan onder bezoldiging:

      a. de bedragen - onder de benaming bezoldiging of welke benaming ook - waarop de ambtenaar als zodanig uit hoofde
      van zijn dienstbetrekking aanspraak heeft:

      b. de bedragen - onder de benaming pensioen, wachtgeld, uitkering of welke benaming ook - waarop de gewezen
      ambtenaar als zodanig uit hoofde van zijn vroegere dienstbetrekking aanspraak heeft of waarop zijn nagelaten
      betrekkingen uit hoofde van zijn overlijden aanspraak hebben.

      2 Onder ambtenaar worden in deze titel mede verstaan de nagelaten betrekkingen van een ambtenaar die uit hoofde van
      zijn overlijden pensioen genieten.

      3 Beslag omvat in deze titel ook de vordering bedoeld in [artikel 19 van de Invorderingswet 1990][ref1] (*Stb.*
      221).


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: '116'
    text: |-
      1 Op bezoldiging is, voor zover in deze titel niet anders is bepaald, beslag mogelijk overeenkomstig de
      voorschriften van het gemene recht.

      2 Kostenvergoedingen welke verband houden met de dienstverrichting zijn niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel116
  - number: 116a
    text: Door de Staat of de openbare lichamen onverschuldigd betaalde bezoldiging kan worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel116a
  - number: '117'
    text: |-
      1 Met de door de Staat of de openbare lichamen verschuldigde bezoldiging kan worden verrekend hetgeen de ambtenaar
      als zodanig aan hen zelf verschuldigd is.

      2 Verrekening kan plaatshebben ondanks gelegd beslag of toegepaste korting als bedoeld in
      [artikel 118, eerste lid][ref1].

      3 Verrekening is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn, met dien verstande
      dat verrekening van hetgeen wegens genoten huisvesting of voeding is verschuldigd eveneens kan plaatsvinden met dat
      deel van de bezoldiging dat de beslagvrije voet als bedoeld in [artikel 475][ref2] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel118
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '118'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '118'
    text: |-
      1 De Staat en de openbare lichamen kunnen op de bezoldiging ten behoeve van een schuldeiser van de ambtenaar een
      korting toepassen, mits de ambtenaar de vordering van de schuldeiser erkent of het bestaan van de vordering blijkt
      uit een in kracht van gewijsde gegane rechterlijke uitspraak dan wel uit een authentieke akte.

      2 Korting is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn.

      3 Beslag, faillissement, surséance van betaling en toepassing ten aanzien van de ambtenaar van de
      schuldsaneringsregeling natuurlijke personen sluiten korting uit.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel118
  - number: '119'
    text: |-
      Voor de toepassing van de [artikelen 475][ref1], en [475][ref2] worden, onverminderd
      [artikel 117, tweede lid][ref3], en [artikel 118, derde lid][ref4], verrekening en korting gelijkgesteld met
      beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0001947#Artikel118
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
