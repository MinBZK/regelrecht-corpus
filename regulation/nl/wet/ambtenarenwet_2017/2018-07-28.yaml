preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat regelen betreffende den rechtstoestand van ambtenaren behooren te
    worden gesteld;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Ambtenaar in de zin van deze wet is degene, die is aangesteld om in openbare dienst werkzaam te zijn.

      2 Tot den openbaren dienst behooren alle diensten en bedrijven door den Staat en de openbare lichamen beheerd.

      3 Niet is ambtenaar in de zin van deze wet degene, met wie een arbeidsovereenkomst naar burgerlijk recht is
      gesloten.

      4 Tenzij het tegendeel blijkt, zijn in deze wet onder ambtenaren gewezen ambtenaren begrepen.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel1
  - number: '2'
    text: |-
      1 [Titel III][ref1] en [IIIa][ref2] zijn niet van toepassing op:

        - ministers en staatssecretarissen;
        - de commissarissen van de Koning;
        - gedeputeerden;
        - burgemeesters;
        - wethouders;
        - de Rijksvertegenwoordiger voor de openbare lichamen Bonaire, Sint Eustatius en Saba;
        - krachtens de [Grondwet][ref3] of de wet voor hun leven benoemde ambtenaren;
        - de Nationale ombudsman en de substituut-ombudsmannen;
        - notarissen en gerechtsdeurwaarders;
        - de voorzitter, de leden, de plaatsvervangende leden en de buitengewone leden van de Autoriteit persoonsgegevens,
      bedoeld in [artikel 6 van de Uitvoeringswet Algemene verordening persoonsgegevens][ref4];
        - de leden van dagelijkse besturen van waterschappen, waaronder de voorzitters;
        - de voorzitter, de plaatsvervangende voorzitters en de andere leden van de Sociaal-Economische Raad;
        - het personeel in dienst van de Sociaal-Economische Raad;
        - de leden van de Raden van bestuur van het Uitvoeringsinstituut werknemersverzekeringen en de Sociale
      verzekeringsbank, bedoeld in de [Wet structuur uitvoeringsorganisatie werk en inkomen][ref5];
        - de Nederlandse beroepsorganisatie van accountants, de leden van het bestuur van dit lichaam en de leden van
      andere bij of krachtens de [Wet op het accountantsberoep][ref6] ingestelde colleges;
        - de voorzitter, de ondervoorzitter en de andere leden van het bestuur van de Organisatie ter verbetering van de
      binnenvisserij;
        - de voorzitter en de leden van het Zorginstituut Nederland, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref7];
        - de voorzitter en de leden van het College sanering zorginstellingen, bedoeld in de
      [Wet toelating zorginstellingen][ref8];
        - de voorzitter en de leden van de Nederlandse Zorgautoriteit, bedoeld in de
      [Wet marktordening gezondheidszorg][ref9];
        - militaire ambtenaren;
        - onbezoldigde ambtenaren, behorende tot het personeel van de buitenlandse dienst;
        - de leden en de plaatsvervangende leden van het College voor de rechten van de mens;
        - de leden van een adviescollege als bedoeld in de [Kaderwet adviescolleges][ref10], niet zijnde een adviescollege
      als bedoeld in [artikel 3 van die wet][ref11];
        - de voorzitter en de andere leden van het bestuur van het Bureau Financieel Toezicht, bedoeld in
      [artikel 110, eerste lid, van de Wet op het notarisambt][ref12];
        - de voorzitter en de plaatsvervangend voorzitter van de Koninklijke Notariële Beroepsorganisatie, de andere leden
      van het bestuur van dit lichaam en de leden van het bestuur van de ringen en hun plaatsvervangers;
        - de voorzitter en plaatsvervangend voorzitter van de Koninklijke Beroepsorganisatie van Gerechtsdeurwaarders en de
      andere leden van het bestuur van dit lichaam;
        - de voorzitter en de leden van de commissie van toezicht, bedoeld in de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref13];
        - de leden van de afdeling klachtbehandeling van de commissie van toezicht, bedoeld in de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref14];
        - de leden van de toetsingscommissie inzet bevoegdheden, bedoeld in de
      [Wet op de inlichtingen- en veiligheidsdiensten 2017][ref15];
        - de leden van de raad van toezicht, bedoeld in
      [artikel 6, tweede lid, van de Wet taken meteorologie en seismologie][ref16];
        - het lid van het Centraal Bestuur voor de Arbeidsvoorziening, bedoeld in de [Arbeidsvoorzieningswet 1996][ref17];
        - de deskundige leden, bedoeld in de [artikelen 48, derde lid][ref18], [55a, tweede lid][ref19],
      [66, tweede en derde lid][ref20], [67, derde lid][ref21], [69, tweede lid][ref22], en
      [70, tweede lid, van de Wet op de rechterlijke organisatie][ref23], de militaire leden, bedoeld in de
      [artikelen 54, derde lid][ref24], [55, tweede lid][ref25], en [68, tweede lid, van diezelfde wet][ref26], en hun
      plaatsvervangers;
        - de leden van zelfstandige bestuursorganen aan wie een schadeloosstelling als bedoeld in
      [artikel 14, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref27] is toegekend;
        - de buitengriffiers en de waarnemend griffiers, bedoeld in de [artikelen 14, vierde lid][ref28], en
      [73, tweede lid, van de Wet op de rechterlijke organisatie][ref29];
        - de voorzitter en de leden van het CAK, genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref30];
        - de voorzitter en de leden van het CIZ, genoemd in [7.1.1, eerste lid, van de Wet langdurige zorg][ref31].

      2 De [artikelen 125][ref32], [125bis][ref33], [125ter][ref34], [125quater][ref35], [125quinquies][ref36],
      [125a][ref37], [125c][ref38], [125d][ref39], [125f][ref40] en [126][ref41], alsmede
      [Titel IIIa][ref42], zijn niet van toepassing op de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, onderdelen 5° tot en met 10°, van de Wet op de rechterlijke organisatie][ref43].


