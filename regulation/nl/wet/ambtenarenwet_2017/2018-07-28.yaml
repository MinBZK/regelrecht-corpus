    text: |-
      1 In afwijking van de in [artikel 127c, eerste en tweede lid][ref1], genoemde termijn van 6 weken, geldt
      tot een bij koninklijk besluit te bepalen tijdstip een termijn van dertien weken voor de werknemer die de in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref2] bedoelde leeftijd heeft bereikt.

      2 Indien de ongeschiktheid wegens ziekte een aanvang heeft genomen voor de datum waarop de werknemer de in het
      eerste lid bedoelde leeftijd heeft bereikt, geldt vanaf die datum de in het eerste lid genoemde termijn, voor zover
      het totale tijdvak niet meer bedraagt dan 104 weken.

      3 Met ingang van het tijdstip, bedoeld in het eerste lid, geldt de in
      [artikel 127c, eerste lid, onderdeel a][ref3], genoemde termijn van zes weken, voor zover het totale tijdvak niet
      meer bedraagt dan dertien weken.

      4 Het tijdstip, bedoeld in het eerste lid, wordt niet eerder vastgesteld, dan nadat:

      a. Onze Minister van Sociale Zaken en Werkgelegenheid een verslag over de doeltreffendheid en de effecten van de
      [Wet werken na de AOW-gerechtigde leeftijd][ref4] (Kamerstukken ) in de praktijk gedurende de eerste twee jaren na
      inwerkingtreding van die wet, aan de beide kamers der Staten-Generaal heeft gezonden; en

      b. acht weken zijn verstreken nadat het voornemen tot het vaststellen van dat tijdstip is meegedeeld aan de beide
      kamers der Staten-Generaal.


