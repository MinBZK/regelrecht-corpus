  - number: '134'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden bepalingen vastgesteld betreffende de gevallen waarin
      en de voorwaarden waaronder door of vanwege het rijk indienstneming op arbeidsovereenkomst naar burgerlijk recht
      kan plaatshebben. De [artikelen 125][ref1] en [artikel 648 van Boek 7 van het Burgerlijk Wetboek][ref2] zijn van
      overeenkomstige toepassing.

      2 Omtrent dezelfde onderwerpen worden door het bevoegd gezag der provinciën, gemeenten en waterschappen,
      bepalingen vastgesteld, indien door of vanwege die lichamen indienstneming op arbeidsovereenkomst naar
      burgerlijk recht plaatsheeft. De [artikelen 125][ref3], [126][ref4] en [133, tweede lid, van deze wet][ref5] en
      [artikel 648 van Boek 7 van het Burgerlijk Wetboek][ref6] zijn van overeenkomstige toepassing.

      3 Het tweede lid is niet van toepassing op de dienstbetrekking, bedoeld in de [Wet sociale werkvoorziening][ref7].


