      1 Binnen één jaar na de invoering van [artikel 125][ref1] moet aan dit artikel uitvoering zijn gegeven.

      2 De door het bevoegd gezag der provinciën, gemeenten, waterschappen, veenschappen en veenpolders op het oogenblik
      van de invoering van [artikel 125][ref2] vastgestelde voorschriften, die betreffen onderwerpen in dat artikel
      vermeld, blijven bij die invoering van kracht en worden geacht tot uitvoering van [artikel 125][ref3] te zijn
      gegeven.


