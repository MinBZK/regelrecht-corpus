        artikel: '117'
      - id: ref4
        bwb_id: BWBR0001947
        artikel: '118'
  - number: '120'
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de bezoldiging
      geschiedt de verdeling naar evenredigheid der inschulden, voor zover niet de ene schuldeiser voorrang heeft boven
      de anderen.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel120
  - number: '121'
    text: |-
      1 Overdracht, inpandgeving of elke andere handeling, waardoor de ambtenaar enig recht op zijn bezoldiging aan een
      derde toekent is slechts geldig voor dat deel van de bezoldiging waarop beslag geldig zou zijn.

      2 Een volmacht tot voldoening of invordering van de bezoldiging is slechts geldig indien zij schriftelijk is
      verleend en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel121
  - number: '122'
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlasten de Staat of het openbare lichaam, indien een gegeven opdracht tot de betaling of afgifte niet
      meer tijdig kon worden ingetrokken, toen de Staat of het openbare lichaam van het eindigen van de volmacht kennis
      kreeg.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel122
  - number: '124'
    text: |-
      De bepalingen van deze titel vinden overeenkomstige toepassing op de bezoldiging, ingevolge enig algemeen
      verbindend voorschrift verschuldigd door de Staat of enig openbaar lichaam hier te lande aan personen, die niet
      zijn ambtenaar, gewezen ambtenaar of nagelaten betrekking van een ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel124
  - number: '125'
    text: |-
      1 Voor zover deze onderwerpen niet reeds bij of krachtens de wet zijn geregeld, worden voor de ambtenaren, door of
      vanwege het rijk aangesteld, bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld betreffende:

      a. aanstelling, schorsing en ontslag;

      b. het onderzoek naar de geschiktheid en de bekwaamheid;

      c. bezoldiging en wachtgeld;

      d. diensttijden;

      e. verlof en vakantie;

      f. voorzieningen in verband met ziekte;

      g. bescherming bij de arbeid;

      h. woon-, verblijfs- en bereikbaarheidsverplichtingen;

      i. medezeggenschap;

      j. overige rechten en verplichtingen;

      k. disciplinaire straffen, met dien verstande dat een boete dan wel een inhouding of korting op de bezoldiging per
      opgelegde disciplinaire straf ten hoogste gelijk is aan het bedrag van het salaris van de ambtenaar over anderhalve
      maand;

      l. de instelling en werkwijze van commissies waaraan de beslissing met uitsluiting van administratieve organen is
      opgedragen, voor zover deze worden mogelijk gemaakt;

      m. de wijze, waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gepleegd over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaren, alsmede de gevallen
      waarin overeenstemming in dat overleg dient te worden bereikt;

      n. de gevallen waarin berichten inzake de rechtspositie van de ambtenaar in afwijking van
      [artikel 2:14, eerste lid, van de Algemene wet bestuursrecht][ref1] uitsluitend elektronisch verzonden behoeven te
      worden en de voorwaarden die daarbij in acht worden genomen.

      2 Het bevoegd gezag van provincies, gemeenten en waterschappen stelt voor de ambtenaar door of vanwege deze
      lichamen aangesteld, onder gelijk voorbehoud voorschriften vast omtrent de onderwerpen, genoemd in het eerste lid.
      Als ambtenaar aangesteld door of vanwege een waterschap wordt aangemerkt hij die is aangesteld door het in het
      reglement van die instelling daartoe aangewezen gezag teneinde in dienst van het waterschap werkzaam te zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel214
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 2:14
  - number: 125bis
    text: |-
      Het is de voorzitter, de leden en de secretaris van commissies als bedoeld in
      [artikel 125, eerste lid, onderdeel l][ref1], alsmede hun plaatsvervangers verboden:

      a. hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie
      wordt gevorderd;

      b. de gevoelens te openbaren die bij de beraadslaging zijn geuit;

      c. over een voor hen aanhangige zaak of over een zaak die naar zij weten of redelijkerwijs kunnen vermoeden voor
      hen aanhangig zal worden, op enigerlei bijzondere wijze in contact te treden met partijen, hun gemachtigden of
      hun raadslieden.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125bis
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
  - number: 125ter
    text: Het bevoegd gezag en de ambtenaar zijn verplicht zich als een goed werkgever en een goed ambtenaar te gedragen.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125ter
  - number: 125quater
    text: |-
      Het bevoegd gezag van ambtenaren die door of vanwege het rijk, de provincies, de gemeenten of de waterschappen
      zijn aangesteld,

      a. voert een integriteitsbeleid dat is gericht op het bevorderen van goed ambtelijk handelen en dat in ieder geval
      aandacht besteedt aan het bevorderen van integriteitsbewustzijn en aan het voorkomen van misbruik van bevoegdheden,
      belangenverstrengeling en discriminatie;

      b. zorgt ervoor dat het integriteitsbeleid een vast onderdeel uitmaakt van het personeelsbeleid in ieder geval door
      integriteit in functioneringsgesprekken en werkoverleg aan de orde te stellen en door het aanbieden van scholing en
      vorming op het gebied van integriteit;

      c. draagt zorg voor de totstandkoming van een gedragscode voor goed ambtelijk handelen;

      d. stelt in overeenstemming met de Tweede Kamer, onderscheidenlijk provinciale staten, de raad of het algemeen
      bestuur, vast op welke wijze jaarlijks verantwoording wordt afgelegd over het gevoerde integriteitsbeleid en over
      de naleving van de gedragscode.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125quater
  - number: 125quinquies
    text: |-
      1 Voor zover deze onderwerpen niet bij of krachtens de wet zijn geregeld, worden voor de ambtenaren, door of
      vanwege het rijk aangesteld, bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld betreffende:

      a. de verplichte aflegging van de eed of belofte door de ambtenaar bij zijn aanstelling;

      b. de melding en de registratie van nevenwerkzaamheden die de belangen van de dienst voor zover deze in verband
      staan met de functievervulling, kunnen raken;

      c. de openbaarmaking van de krachtens onderdeel b geregistreerde nevenwerkzaamheden van ambtenaren aangesteld
      in een functie waarvoor ter bescherming van de integriteit van de openbare dienst openbaarmaking van
      nevenwerkzaamheden noodzakelijk is;

      d. het verbieden van nevenwerkzaamheden waardoor de goede vervulling van de functie of de goede functionering
      van de openbare dienst, voor zover deze in verband staat met de functievervulling, niet in redelijkheid zou zijn
      verzekerd;

      e. de melding van financiële belangen respectievelijk van het bezit van en transacties in effecten, die de belangen
      van de dienst voor zover deze in verband staan met de functievervulling, kunnen raken voor ambtenaren aangesteld in
      een functie waaraan in het bijzonder het risico van financiële belangenverstrengeling of het risico van oneigenlijk
      gebruik van koersgevoelige informatie verbonden is;

      f. een procedure voor het omgaan met bij een ambtenaar levende vermoedens van misstanden binnen de organisatie waar
      hij werkzaam is.

      2 Het bevoegd gezag van provincies, gemeenten en waterschappen stelt voor de ambtenaren door of vanwege deze
      lichamen aangesteld, onder gelijk voorbehoud voorschriften vast omtrent de onderwerpen, genoemd in het eerste lid.
      Als ambtenaar aangesteld door of vanwege een waterschap wordt aangemerkt hij die is aangesteld door het in het
      reglement van die instelling daartoe aangewezen gezag teneinde in dienst van het waterschap werkzaam te zijn.

      3 De ambtenaar die te goeder trouw en naar behoren een vermoeden van een misstand als bedoeld in
      [artikel 1, onderdeel d, van de Wet Huis voor klokkenluiders][ref1] meldt, zal als gevolg daarvan geen nadelige
      gevolgen voor zijn rechtspositie ondervinden tijdens en na de behandeling van deze melding bij het bevoegd gezag of
      de daartoe bevoegde instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel1
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125quinquies
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '1'
  - number: 125a
    text: |-
      1 De ambtenaar dient zich te onthouden van het openbaren van gedachten of gevoelens of van de uitoefening van
      het recht tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze rechten de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met
      zijn functievervulling, niet in redelijkheid zou zijn verzekerd.

      2 Het eerste lid is, voor wat betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:

      a. een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1] of

      b. een vakvereniging.

      3 De ambtenaar is verplicht tot geheimhouding van hetgeen hem in verband met zijn functie ter kennis is gekomen,
      voor zover die verplichting uit de aard der zaak volgt.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 125b
    text: |-
      De ambtenaar is niet gehouden tot dienstverrichting op voor hem op grond van zijn godsdienst of levensovertuiging
      geldende feest- en rustdagen, tenzij het dienstbelang dit onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125b
  - number: 125c
    text: |-
      1 Een ambtenaar, die een functie in publiekrechtelijke colleges, waarin hij is benoemd of verkozen, gezien de
      omvang van de daaruit voortvloeiende werkzaamheden, niet gelijktijdig kan vervullen met zijn ambt, wordt in verband
      daarmede tijdelijk ontheven van de waarneming van zijn ambt, tenzij het dienstbelang zich tegen ontheffing verzet.
      Betreffende het doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur voor de door of
      vanwege het rijk aangestelde ambtenaren, dan wel door het bevoegde gezag der provincies, gemeenten en waterschappen
      voor de ambtenaren door of vanwege deze lichamen aangesteld, regels worden gesteld.

      2 Indien de ambtenaar in verband met een functie in publiekrechtelijke colleges, waarin hij is benoemd of verkozen,
      niet op grond van het eerste lid van de waarneming van zijn ambt is ontheven, wordt hem voor het bijwonen van
      vergaderingen en zittingen van deze colleges en voor het verrichten van daaruit voortvloeiende werkzaamheden ten
      behoeve van deze colleges, buitengewoon verlof verleend, tenzij het dienstbelang zich tegen verlofverlening verzet.
      Betreffende het doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur voor de door of
      vanwege het rijk aangestelde ambtenaren, dan wel door het bevoegde gezag der provincies, gemeenten en waterschappen
      voor de ambtenaren door of vanwege deze lichamen aangesteld, regels worden gesteld.

      3 Aan de ambtenaar wordt, tenzij het dienstbelang zich tegen verlofverlening verzet, buitengewoon verlof verleend
      voor aan te wijzen activiteiten van of voor vakorganisaties van overheidspersoneel overeenkomstig regels te stellen
      bij of krachtens algemene maatregel van bestuur voor de door of vanwege het rijk aangestelde ambtenaren, dan wel
      door het bevoegde gezag der provinciën, gemeenten en waterschappen voor de ambtenaren door of vanwege deze lichamen
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125c
  - number: 125d
    text: |-
      De ambtenaar is verplicht tijdens het verblijf op zijn werk zich te onderwerpen aan een in het belang van de dienst
      door het bevoegde gezag gelast onderzoek aan zijn lichaam of aan zijn kleding of van zijn daar aanwezige goederen.
      Het bevoegd gezag, op wiens last het onderzoek plaatsheeft, neemt de nodige maatregelen ten einde daarbij een
      onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001947/2018-07-28#Artikel125d
  - number: 125e
    text: |-
      1 Voor de vervulling van een vertrouwensfunctie komt slechts in aanmerking degene die Nederlander is. Degene die
      geen Nederlander is, kan niettemin worden aangesteld wanneer het dienstbelang dat bepaaldelijk vordert.

      2 Aan een ambtenaar kan eervol ontslag worden verleend, indien hij op grond van het bepaalde in
      [artikel 5, derde lid][ref1], of [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een
      vertrouwensfunctie moet worden ontheven.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter zake van het bepaalde in
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
