    text: |-
      Bij voorschriften of regels op grond van [artikel 125, eerste en tweede lid][ref1], van de Ambtenarenwet
      en van [artikel 47, eerste lid, van de Politiewet 2012][ref2], kan ten gunste van de ambtenaar die de in
      [artikel 127, eerste lid][ref3], bedoelde leeftijd heeft bereikt, van de [artikelen 127 tot en met 127d][ref4]
      worden afgeweken.


