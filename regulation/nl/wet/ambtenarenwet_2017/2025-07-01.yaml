  - number: '3'
    text: |-
      Een overheidswerkgever sluit geen arbeidsovereenkomst met:

      a. degenen die zijn benoemd in het ambt van een eenhoofdig bestuursorgaan of als lid van een orgaan of college dat
      onderdeel uitmaakt van een krachtens publiekrecht ingestelde rechtspersoon, mits zij niet werkzaam zijn onder de
      verantwoordelijkheid van een ander bestuursorgaan;

      b. 1°. de rechterlijke ambtenaren, bedoeld in
      [artikel 1, onderdeel b, van de Wet op de rechterlijke organisatie][ref1];

      2°. de deskundige leden, bedoeld in de [artikelen 48, tweede lid][ref2], [55a, tweede lid][ref3],
      [66, tweede en derde lid][ref4], [67, derde lid][ref5], [69, tweede lid][ref6], en
      [70, tweede lid, van de Wet op de rechterlijke organisatie][ref7] en hun plaatsvervangers;

      3°. de militaire leden, bedoeld in de [artikelen 54, derde lid][ref8], [55, tweede lid][ref9], en
      [68, tweede lid, van de Wet op de rechterlijke organisatie][ref10] en hun plaatsvervangers;

      4°. de bij de Centrale Raad van Beroep en het College van Beroep voor het bedrijfsleven werkzame leden met
      rechtspraak belast, bedoeld in [artikel 2, eerste lid, onderdeel a, van de Beroepswet][ref11] onderscheidenlijk
      [artikel 3, eerste lid, onderdeel a, van de Wet bestuursrechtspraak bedrijfsorganisatie][ref12], alsmede de aldaar
      werkzame senior-gerechtsauditeurs en gerechtsauditeurs, bedoeld in [artikel 4, tweede lid, van de Beroepswet][ref13]
      onderscheidenlijk [artikel 5, tweede lid, van de Wet bestuursrechtspraak bedrijfsorganisatie][ref14];

      5°. de voorzitters en leden, bedoeld in [artikel 8.16, derde lid][ref15], en
      [8.36, derde lid, van de Wet dieren][ref16], en hun plaatsvervangers;

      6°. de personen die deel uitmaken van een orgaan als bedoeld in
      [artikel 13, tweede lid, van de Landbouwkwaliteitswet][ref17];

      7°. de voorzitter en leden van de Accountantskamer, bedoeld in
      [artikel 11 van de Wet tuchtrechtspraak accountants][ref18], en hun plaatsvervangers;

      8°. de voorzitter en leden, bedoeld in [artikel 30 van de Loodsenwet][ref19], en hun plaatsvervangers;

      9°. de voorzitter en leden van het tuchtcollege voor de scheepvaart, bedoeld in
      [artikel 37 van de Wet bemanning zeeschepen][ref20], en hun plaatsvervangers;

      10°. de voorzitter en leden van de kamers voor het notariaat, bedoeld in
      [artikel 94 van de Wet op het notarisambt][ref21], en hun plaatsvervangers;

      11°. de voorzitter en leden-advocaten van de raden van discipline, bedoeld in
      [artikel 46b van de Advocatenwet][ref22], en hun plaatsvervangers;

      12°. de voorzitter en leden-advocaten van het hof van discipline, bedoeld in
      [artikel 51van de Advocatenwet][ref23], en hun plaatsvervangers;

      13°. de voorzitter en de leden van de kamer voor gerechtsdeurwaarders, bedoeld in
      [artikel 35van de Gerechtsdeurwaarderswet][ref24], en hun plaatsvervangers;

      14°. de voorzitters en leden van een tuchtcollege, bedoeld in de [artikelen 55][ref25] en
      [56 van de Wet op de beroepen in de individuele gezondheidszorg][ref26], en hun plaatsvervangers.

      15°. de voorzitters en leden van de grondkamers, bedoeld in
      [artikel 2, eerste lid, van de Uitvoeringswet grondkamers][ref27], en hun plaatsvervangers, alsmede de leden van
      de Centrale grondkamer, bedoeld in [artikel 13, eerste lid, van de Uitvoeringswet grondkamers][ref28], en hun
      plaatsvervangers.

      c. de militaire ambtenaren, bedoeld in [artikel 1, eerste lid, onderdeel a, van de Wet ambtenaren defensie][ref29],
      alsmede de burgerlijke ambtenaren, bedoeld in [artikel 12o, eerste lid, van de Wet ambtenaren defensie][ref30];

      d. de dienstplichtigen, bedoeld in [artikel 1, eerste lid, onderdeel b, van de Kaderwet dienstplicht][ref31];

      e. notarissen en waarnemend notarissen als bedoeld in [artikel 2][ref32] onderscheidenlijk
      [artikel 29 van de Wet op het notarisambt][ref33] alsmede gerechtsdeurwaarders en waarnemend gerechtsdeurwaarders
      als bedoeld in [artikel 2][ref34] onderscheidenlijk [artikel 23 van de Gerechtsdeurwaarderswet][ref35];

      f. de ambtenaren van de politie, bedoeld in [artikel 2 van de Politiewet 2012][ref36], en de plaatsvervanger van de
      directeur van de Politieacademie, bedoeld in [artikel 76, eerste lid, van de Politiewet 2012][ref37].


