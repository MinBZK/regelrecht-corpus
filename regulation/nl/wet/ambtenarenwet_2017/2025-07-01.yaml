preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat regelen betreffende den rechtstoestand van ambtenaren behooren te
    worden gesteld;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Ambtenaar in de zin van deze wet is degene die krachtens een arbeidsovereenkomst naar Nederlands recht met een
      overheidswerkgever werkzaam is.

      2 Ambtenaar is tevens degene die met een overheidswerkgever is overeengekomen zonder aanspraak op loon als
      bedoeld in [artikel 610 van Boek 7 van het Burgerlijk Wetboek][ref1] een functie te vervullen die is aangewezen
      bij algemene maatregel van bestuur, waarvan de voordracht geschiedt door Onze Minister van Binnenlandse Zaken en
      Koninkrijksrelaties.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel610
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '610'
  - number: '2'
    text: |-
      1 Overheidswerkgever in de zin van deze wet zijn:

      a. de staat;

      b. de provincies;

      c. de gemeenten;

      d. de waterschappen;

      e. de openbare lichamen voor beroep en bedrijf;

      f. de andere openbare lichamen waaraan krachtens de [Grondwet][ref1] verordenende bevoegdheid is toegekend;

      g. de Europese groeperingen voor territoriale samenwerking met een statutaire zetel in Nederland;

      h. de overige krachtens publiekrecht ingestelde rechtspersonen; en

      i. andere dan krachtens publiekrecht ingestelde rechtspersonen, waarvan een orgaan is bekleed met openbaar gezag,
      waarbij de uitoefening van dat gezag de kernactiviteit van de rechtspersoon vormt.

      2 Geen overheidswerkgever in de zin van deze wet zijn:

      a. gemeenten, voor zover het betreft de instandhouding van openbare scholen als bedoeld in onderdeel a van de
      begripsbepaling van openbare school in [artikel 1 van de Wet op het primair onderwijs][ref2], onderdeel a van de
      begripsbepaling van openbare school in [artikel 1 van de Wet op de expertisecentra][ref3], en onderdeel a of b van
      de begripsbepaling van openbare school in [artikel 1.1 van de Wet voortgezet onderwijs 2020][ref4];

      b. openbare rechtspersonen als bedoeld in [artikel 47 van de Wet op het primair onderwijs][ref5],
      [artikel 50 van de Wet op de expertisecentra][ref6] en [artikel 3.4 van de Wet voortgezet onderwijs 2020][ref7];

      c. openbare instellingen als bedoeld in [artikel 1.1.1 van de Wet educatie en beroepsonderwijs][ref8];

      d. de openbare instellingen, bedoeld in [onderdelen a, h en j, onder 1, van de bijlage behorende bij de Wet op het
      hoger onderwijs en wetenschappelijk onderzoek](onbekend);

      e. de instellingen voor wetenschappelijk onderzoek, bedoeld in
      [artikel 1.5 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref9];

      f. de Nederlandse organisatie voor wetenschappelijk onderzoek, bedoeld in
      [artikel 2, eerste lid, van de Wet op de Nederlandse organisatie voor wetenschappelijk onderzoek][ref10];

      g. de Nederlandse Organisatie voor toegepast-natuurwetenschappelijk onderzoek TNO, genoemd in
      [artikel 3, eerste lid, van de TNO-wet][ref11].


