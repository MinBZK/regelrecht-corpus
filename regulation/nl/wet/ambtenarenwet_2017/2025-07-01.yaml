  - number: '16'
    text: |-
      1 Krachtens deze wet genomen besluiten die zijn genomen voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel I van de Wet normalisering rechtspositie ambtenaren][ref1], behouden hun geldigheid.

      2 Ten aanzien van de mogelijkheid om bezwaar te maken of beroep in te stellen alsmede de behandeling van zodanig
      bezwaar of beroep tegen een op grond van deze wet genomen besluit of handeling dat voor het in het eerste lid
      bedoelde tijdstip is bekendgemaakt, blijft het recht van toepassing zoals dat gold voor dat tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0039393#ArtikelI
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0039393
        artikel: I
  - number: '17'
    text: |-
      1 De krachtens deze wet en [artikel 15, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1],
      zoals deze luidden voorafgaand aan het tijdstip van inwerkingtreding van
      [artikel I van de Wet normalisering rechtspositie ambtenaren][ref2], vastgestelde algemeen verbindende
      voorschriften vervallen.

      2 De in het eerste lid bedoelde algemeen verbindende voorschriften blijven van kracht ten aanzien van te
      verstrekken uitkeringen aan ambtenaren als bedoeld in artikel 1, eerste lid, van de Ambtenarenwet, wier
      dienstverband op het in het eerste lid bedoelde tijdstip reeds is beëindigd. De in deze voorschriften opgenomen
      bedragen kunnen worden geïndexeerd op de in deze voorschriften bepaalde wijze.

      3 Voor zover en voor zolang op het in het eerste lid bedoelde tijdstip geen collectieve arbeidsovereenkomst is
      gesloten waarbij een overheidswerkgever partij is, blijft een in het eerste lid bedoeld voorschrift verbindend voor
      ambtenaren als bedoeld in artikel 1, eerste lid, van de Ambtenarenwet en hun werkgever als ware het een collectieve
      arbeidsovereenkomst, voor zover niet in strijd met deze wet of dwingendrechtelijke bepalingen van burgerlijk recht.

      4 Het eerste tot en met derde lid zijn niet van toepassing op algemeen verbindende voorschriften, voor zover zij
      betrekking hebben op de rechtspositie van degenen met wie op grond van [artikel 3][ref3] geen arbeidsovereenkomst
      wordt gesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0039393#ArtikelI
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel3
