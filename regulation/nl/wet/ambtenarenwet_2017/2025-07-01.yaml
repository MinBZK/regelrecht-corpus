        bwb_id: BWBR0001947
        artikel: '5'
        paragraaf: '2'
  - number: '9'
    text: |-
      De ambtenaar en de gewezen ambtenaar zijn verplicht tot geheimhouding van hetgeen hen in verband met hun functie
      ter kennis is gekomen, voor zover die verplichting uit de aard der zaak volgt.
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel9
  - number: '10'
    text: |-
      1 De ambtenaar onthoudt zich van het openbaren van gedachten of gevoelens of van de uitoefening van het recht
      tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze rechten de goede vervulling
      van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met zijn
      functievervulling, niet in redelijkheid zou zijn verzekerd.

      2 Het eerste lid is, voor wat betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:

      a. een politieke groepering waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1];

      b. een vakvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '11'
    text: |-
      De ambtenaar is verplicht tijdens het verblijf op zijn werk zich te onderwerpen aan een in het belang van de
      dienst door de overheidswerkgever gelast onderzoek aan zijn lichaam of aan zijn kleding of van zijn daar aanwezige
      goederen. De overheidswerkgever op wiens last het onderzoek plaatsheeft, neemt de nodige maatregelen ten einde
      daarbij een onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel11
  - number: '12'
    text: |-
      1 Voor de vervulling van een vertrouwensfunctie komt slechts in aanmerking degene die Nederlander is. Degene die
      geen Nederlander is, kan niettemin in aanmerking komen wanneer het dienstbelang dat bepaaldelijk vordert.

      2 De arbeidsovereenkomst met een ambtenaar kan worden opgezegd, indien hij op grond van het bepaalde in
      [artikel 5, derde lid][ref1], of [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een
      vertrouwensfunctie moet worden ontheven.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter zake van het bepaalde in
      dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '10'
  - number: '13'
    text: |-
      1 Bij algemene maatregel van bestuur kunnen voor categorieën van ambtenaren met wie de staat een
      arbeidsovereenkomst is aangegaan en die uit hoofde van hun functie kennis kunnen nemen van zeer geheime of
      geheime gegevens betreffende de veiligheid of andere gewichtige belangen van de staat, voorschriften worden
      gesteld betreffende de verplichtingen waaraan deze ambtenaren zijn onderworpen in verband met het anders dan in de
      uitoefening van hun functie reizen naar en het verblijven in landen waarin het verblijf door deze ambtenaren een
      bijzonder risico voor de veiligheid of andere gewichtige belangen van de staat kan opleveren en die er toe strekken
      dit risico zoveel mogelijk te beperken.

      2 In de in het eerste lid bedoelde algemene maatregel van bestuur kan worden bepaald dat de in die maatregel
      opgenomen voorschriften tevens betrekking hebben op gewezen ambtenaren.

      3 Een algemene maatregel van bestuur als bedoeld in het eerste lid treedt niet eerder in werking dan twee maanden
      na de datum van uitgifte van het Staatsblad waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel13
  - number: 13a
    text: |-
      Bij koninklijk besluit wordt besloten tot het aangaan van een arbeidsovereenkomst ter zake van bij of
      krachtens algemene maatregel van bestuur aangewezen functies. Tot beëindiging van de arbeidsovereenkomst
      wordt bij koninklijk besluit besloten, tenzij de Staat de arbeidsovereenkomst opzegt op grond van
      [artikel 677 van Boek 7 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel677
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel13a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '677'
  - number: 13b
    text: |-
      1 Ten aanzien van de ambtenaren van de Staten-Generaal gelden de voor alle ambtenaren geldende arbeidsvoorwaarden
      die zijn opgenomen in de laatstelijk afgesloten collectieve arbeidsovereenkomst voor ambtenaren die krachtens een
      arbeidsovereenkomst met de Staat werkzaam zijn.

      2 Op verzoek van de Staten-Generaal kunnen in de collectieve arbeidsovereenkomst, bedoeld in het eerste lid, andere
      arbeidsvoorwaarden voor de ambtenaren van de Staten-Generaal worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel13b
  - number: '14'
    text: |-
      1 Met ingang van het tijdstip van inwerkingtreding van
      [artikel I van de Wet normalisering rechtspositie ambtenaren][ref1] wordt de aanstelling die voor dat
      tijdstip is verleend aan een ambtenaar als bedoeld in artikel 1, eerste lid, van de Ambtenarenwet, die op
      het tijdstip van inwerkingtreding van artikel I van de Wet normalisering rechtspositie ambtenaren aanspraak
      had op bezoldiging als bedoeld in artikel 115 van de Ambtenarenwet die kwalificeert als loon in de zin
      van [artikel 610, eerste lid, van Boek 7 van het Burgerlijk Wetboek][ref2] van rechtswege omgezet in een
      arbeidsovereenkomst naar burgerlijk recht. Van de arbeidsovereenkomst maken deel uit de op dat tijdstip ten aanzien
      van de ambtenaar bestaande beslissingen, afspraken en toezeggingen inzake zijn arbeidsvoorwaarden, waaronder in
      ieder geval zijn begrepen: duur van het dienstverband, bezoldiging, werktijden, rooster, verlof, faciliteiten voor
      de uitoefening van de functie en studiefaciliteiten.

      2 Met ingang van het tijdstip van inwerkingtreding van
      [artikel I van de Wet normalisering rechtspositie ambtenaren][ref3] wordt de aanstelling die voor dat tijdstip is
      verleend aan een ambtenaar als bedoeld in het eerste lid die geen aanspraak had op bezoldiging als bedoeld in het
      eerste lid van rechtswege omgezet in een overeenkomst. Van de overeenkomst maken deel uit de op dat tijdstip ten
      aanzien van de ambtenaar bestaande beslissingen, afspraken en toezeggingen inzake het verrichten van de arbeid,
      waaronder in ieder geval zijn begrepen: duur van het dienstverband, kostenvergoedingen, werktijden, rooster,
      verlof, faciliteiten voor de uitoefening van de functie en studiefaciliteiten.

      3 Met ingang van het tijdstip van inwerkingtreding van
      [artikel I van de Wet normalisering rechtspositie ambtenaren][ref4] worden aanstellingen verleend voorafgaand aan
      de aanstelling, bedoeld in het eerste lid, als arbeidsovereenkomsten naar burgerlijk recht beschouwd.

      4 De voorgaande leden zijn niet van toepassing op personen als bedoeld in [artikel 3][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0039393#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel610
      [ref3]: https://wetten.overheid.nl/BWBR0039393#ArtikelI
      [ref4]: https://wetten.overheid.nl/BWBR0039393#ArtikelI
      [ref5]: https://wetten.overheid.nl/BWBR0001947#Artikel3
