  - number: 3a
    text: |-
      1 Overheidswerkgevers kunnen een onderzoek naar de geschiktheid en de bekwaamheid voor een functie
      als ambtenaar doen. Indien noodzakelijk kunnen zij daarbij bijzondere categorieën van persoonsgegevens
      en persoonsgegevens van strafrechtelijke aard als bedoeld in [paragraaf 3.1][ref1] onderscheidenlijk
      [paragraaf 3.2 van de Uitvoeringswet Algemene verordening gegevensbescherming][ref2] verwerken.

      2 Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de soorten persoonsgegevens die
      verwerkt kunnen worden.


      [ref1]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.1
      [ref2]: https://wetten.overheid.nl/BWBR0040940#Paragraaf3.2
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0040940
        paragraaf: '3.1'
      - id: ref2
        bwb_id: BWBR0040940
        paragraaf: '3.2'
  - number: '4'
    text: |-
      1 Een overheidswerkgever voert een integriteitsbeleid dat is gericht op het bevorderen van goed ambtelijk handelen
      en dat in ieder geval aandacht besteedt aan het bevorderen van integriteitsbewustzijn en aan het voorkomen van
      misbruik van bevoegdheden, belangenverstrengeling en discriminatie.

      2 Een overheidswerkgever zorgt ervoor dat het integriteitsbeleid een vast onderdeel uitmaakt van het
      personeelsbeleid, in ieder geval door integriteit in functioneringsgesprekken en werkoverleg aan de orde te stellen
      en door het aanbieden van scholing en vorming op het gebied van integriteit.

      3 Een overheidswerkgever draagt zorg voor de totstandkoming van een gedragscode voor goed ambtelijk handelen.

      4 Een overheidswerkgever maakt jaarlijks een verantwoording met betrekking tot de uitvoering van dit artikel
      openbaar.

      5 Bij algemene maatregel van bestuur kunnen nadere regels worden vastgesteld met betrekking tot het derde lid.
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel4
  - number: '5'
    text: |-
      1 Een overheidswerkgever draagt zorg voor:

      a. de aflegging van de eed of belofte door de ambtenaar bij zijn indiensttreding;

      b. de registratie van nevenwerkzaamheden van ambtenaren die de belangen van de dienst voor zover deze in verband
      staan met hun functievervulling, kunnen raken;

      c. de openbaarmaking van de krachtens onderdeel b geregistreerde nevenwerkzaamheden van ambtenaren aangesteld
      in een functie waarvoor ter bescherming van de integriteit van de openbare dienst openbaarmaking van
      nevenwerkzaamheden noodzakelijk is;

      d. de aanwijzing van ambtenaren die werkzaamheden verrichten waaraan in het bijzonder het risico van financiële
      belangenverstrengeling of het risico van oneigenlijk gebruik van koersgevoelige informatie verbonden is, het
      aanwijzen van de financiële belangen die zij niet mogen bezitten of verwerven en de registratie van de door hen
      gedane meldingen als bedoeld in [artikel 8, tweede lid, onderdeel b][ref1];

      e. een procedure voor het omgaan met bij een ambtenaar levende vermoedens van misstanden binnen de organisatie waar
      hij werkzaam is.

      2 Bij algemene maatregel van bestuur kunnen nadere regels worden vastgesteld met betrekking tot het bepaalde in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel8
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '8'
        paragraaf: '3'
  - number: '6'
    text: |-
      1 De ambtenaar is gehouden de bij of krachtens de wet op hem rustende en uit zijn functie voortvloeiende
      verplichtingen te vervullen en zich ook overigens te gedragen zoals een goed ambtenaar betaamt.

      2 Het niet naleven van het eerste lid geldt voor de toepassing van het Burgerlijk Wetboek als een tekortkoming in
      het nakomen van de plichten welke de arbeidsovereenkomst aan de ambtenaar oplegt.
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel6
  - number: '7'
    text: |-
      De ambtenaar legt een eed of belofte af, overeenkomstig een bij algemene maatregel van bestuur vastgesteld
      formulier, dat voor verschillende functies verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel7
  - number: '8'
    text: |-
      1 Het is de ambtenaar niet toegestaan:

      a. nevenwerkzaamheden te verrichten waardoor de goede vervulling van de functie of de goede functionering van
      de openbare dienst, voor zover deze in verband staat met zijn functievervulling, niet in redelijkheid zou zijn
      verzekerd;

      b. middellijk of onmiddellijk deel te nemen aan aannemingen en leveringen ten behoeve van openbare diensten, tenzij
      de overheidswerkgever waarmee hij een arbeidsovereenkomst heeft daarvoor toestemming heeft verleend;

      c. financiële belangen te hebben, effecten te bezitten of effectentransacties te verrichten waardoor de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met
      zijn functievervulling, niet in redelijkheid zou zijn verzekerd;

      d. financiële belangen te bezitten of te verwerven, welke door de overheidswerkgever waarmee hij een
      arbeidsovereenkomst heeft zijn aangewezen op de voet van [artikel 5, eerste lid, onderdeel d][ref1];

      e. zonder toestemming van de overheidswerkgever giften, vergoedingen, beloningen en beloften van een derde aan te
      nemen of hierom te vragen, indien de ambtenaar als ambtenaar met deze derde betrekkingen onderhoudt.

      2 De ambtenaar is verplicht aan de overheidswerkgever waarmee hij een arbeidsovereenkomst heeft:

      a. opgave te doen van de nevenwerkzaamheden die hij verricht of voornemens is te gaan verrichten, die de belangen
      van de dienst voor zover deze in verband staan met zijn functievervulling, kunnen raken;

      b. indien hij is aangewezen in de zin van [artikel 5, eerste lid, onderdeel d][ref2], melding te doen van zijn
      financiële belangen alsmede van het bezit van en transacties met effecten die de belangen van de openbare dienst
      voor zover deze in verband staat met zijn functievervulling, kunnen raken en daaromtrent desgevraagd nadere
      informatie te verschaffen.

      3 Bij algemene maatregel van bestuur kunnen regels worden gesteld over de toepassing van het eerste en tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel5
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel8
    references:
