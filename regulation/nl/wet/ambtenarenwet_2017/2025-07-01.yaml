  - number: '15'
    text: |-
      1 [Artikel 5:6, eerste lid, van de Arbeidstijdenwet][ref1] is van toepassing in geval de ambtenaar voorafgaande aan
      het tijdstip van inwerkingtreding van [artikel I van de Wet normalisering rechtspositie ambtenaren][ref2] wegens
      de aard van de arbeid op regelmatige basis op zondag werkzaam was, ongeacht de aanwezigheid van een beding over die
      arbeid op zondag.

      2 De ambtenaar die op het in het eerste lid bedoelde tijdstip is benoemd of gekozen in een functie als bedoeld in
      artikel 125c, eerste of tweede lid, zoals dat luidde voorafgaand aan dat tijdstip, behoudt de verleende ontheffing
      van de waarneming van zijn ambt onderscheidenlijk het verleende buitengewoon verlof. Ingeval op de bezoldiging een
      inhouding wordt toegepast over de tijd dat hij verlof geniet, blijven deze inhouding en de daarop van toepassing
      zijnde regels van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0007671#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0039393#ArtikelI
    url: https://wetten.overheid.nl/BWBR0001947/2025-07-01#Artikel15
