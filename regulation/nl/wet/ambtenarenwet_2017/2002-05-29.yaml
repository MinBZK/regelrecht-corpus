  - number: '115.1'
    text: 'In deze titel wordt verstaan onder bezoldiging:'
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel115
  - number: 115.1.a
    text: |-
      de bedragen - onder de benaming bezoldiging of welke benaming ook - waarop de ambtenaar als zodanig uit hoofde van
      zijn dienstbetrekking aanspraak heeft:
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel115
  - number: 115.1.b
    text: |-
      de bedragen - onder de benaming pensioen, wachtgeld, uitkering of welke benaming ook - waarop de gewezen ambtenaar
      als zodanig uit hoofde van zijn vroegere dienstbetrekking aanspraak heeft of waarop zijn nagelaten betrekkingen uit
      hoofde van zijn overlijden aanspraak hebben.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel115
  - number: '115.2'
    text: |-
      Onder ambtenaar worden in deze titel mede verstaan de nagelaten betrekkingen van een ambtenaar die uit hoofde van
      zijn overlijden pensioen genieten.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel115
  - number: '115.3'
    text: |-
      Beslag omvat in deze titel ook de vordering bedoeld in [artikel 19 van de Invorderingswet 1990][ref1] (*Stb.* 221).


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: '116.1'
    text: |-
      Op bezoldiging is, voor zover in deze titel niet anders is bepaald, beslag mogelijk overeenkomstig de voorschriften
      van het gemene recht.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel116
  - number: '116.2'
    text: Kostenvergoedingen welke verband houden met de dienstverrichting zijn niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel116
  - number: '117.1'
    text: |-
      Met de door de Staat of de openbare lichamen verschuldigde bezoldiging kan worden verrekend hetgeen de ambtenaar
      als zodanig aan hen zelf verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel117
  - number: '117.2'
    text: |-
      Verrekening kan plaatshebben ondanks gelegd beslag of toegepaste korting als bedoeld in
      [artikel 118, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel118
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '118'
  - number: '117.3'
    text: |-
      Verrekening is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn, met dien verstande dat
      verrekening van hetgeen wegens genoten huisvesting of voeding is verschuldigd eveneens kan plaatsvinden met dat
      deel van de bezoldiging dat de beslagvrije voet als bedoeld in [artikel 475][ref1] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel117
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475d
  - number: '118.1'
    text: |-
      De Staat en de openbare lichamen kunnen op de bezoldiging ten behoeve van een schuldeiser van de ambtenaar een
      korting toepassen, mits de ambtenaar de vordering van de schuldeiser erkent of het bestaan van de vordering blijkt
      uit een in kracht van gewijsde gegane rechterlijke uitspraak dan wel uit een authentieke akte.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel118
  - number: '118.2'
    text: Korting is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel118
  - number: '118.3'
    text: |-
      Beslag, faillissement, surséance van betaling en toepassing ten aanzien van de ambtenaar van de
      schuldsaneringsregeling natuurlijke personen sluiten korting uit.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel118
  - number: '119'
    text: |-
      Voor de toepassing van de [artikelen 475][ref1], en [475][ref2] worden, onverminderd
      [artikel 117, tweede lid][ref3], en [artikel 118, derde lid][ref4], verrekening en korting gelijkgesteld met
      beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475d
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel117
      [ref4]: https://wetten.overheid.nl/BWBR0001947#Artikel118
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel119
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475b
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475d
      - id: ref3
        bwb_id: BWBR0001947
        artikel: '117'
      - id: ref4
        bwb_id: BWBR0001947
        artikel: '118'
  - number: '120'
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de bezoldiging
      geschiedt de verdeling naar evenredigheid der inschulden, voor zover niet de ene schuldeiser voorrang heeft boven
      de anderen.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel120
  - number: '121.1'
    text: |-
      Overdracht, inpandgeving of elke andere handeling, waardoor de ambtenaar enig recht op zijn bezoldiging aan een
      derde toekent is slechts geldig voor dat deel van de bezoldiging waarop beslag geldig zou zijn.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel121
  - number: '121.2'
    text: |-
      Een volmacht tot voldoening of invordering van de bezoldiging is slechts geldig indien zij schriftelijk is verleend
      en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel121
  - number: '122'
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlasten de Staat of het openbare lichaam, indien een gegeven opdracht tot de betaling of afgifte niet
      meer tijdig kon worden ingetrokken, toen de Staat of het openbare lichaam van het eindigen van de volmacht kennis
      kreeg.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel122
  - number: '123'
    text: |-
      Tenzij in bijzondere wetten anders is bepaald, verjaren rechtsvorderingen ter zake van bezoldigingen door
      verloop van vijf jaren na de aanvang van de dag, volgend op die waarop de vordering opeisbaar is geworden. De
      [artikelen 316 tot en met 323 van Boek 3 van het Burgerlijk Wetboek][ref1] zijn van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005291#Artikel316
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0005291
        artikel: '316'
  - number: '124'
    text: |-
      De bepalingen van deze titel vinden overeenkomstige toepassing op de bezoldiging, ingevolge enig algemeen
      verbindend voorschrift verschuldigd door de Staat of enig openbaar lichaam hier te lande aan personen, die niet
      zijn ambtenaar, gewezen ambtenaar of nagelaten betrekking van een ambtenaar.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel124
  - number: '125.1'
    text: |-
      Voor zover deze onderwerpen niet reeds bij of krachtens de wet zijn geregeld, worden voor de ambtenaren, door of
      vanwege het rijk aangesteld, bij of krachtens algemene maatregel van bestuur voorschriften vastgesteld betreffende:
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.a
    text: aanstelling, schorsing en ontslag;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.b
    text: het onderzoek naar de geschiktheid en de bekwaamheid;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.c
    text: bezoldiging en wachtgeld;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.d
    text: diensttijden;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.e
    text: verlof en vakantie;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.f
    text: voorzieningen in verband met ziekte;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.g
    text: bescherming bij de arbeid;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.h
    text: woon-, verblijfs- en bereikbaarheidsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.i
    text: medezeggenschap;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.j
    text: |-
      de melding en de registratie van nevenwerkzaamheden die de belangen van de dienst voor zover deze in verband staan
      met de functievervulling, kunnen raken;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.k
    text: |-
      het verbieden van nevenwerkzaamheden waardoor de goede vervulling van de functie of de goede functionering van
      de openbare dienst, voor zover deze in verband staat met de functievervulling, niet in redelijkheid zou zijn
      verzekerd;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.l
    text: overige rechten en verplichtingen;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.m
    text: disciplinaire straffen;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.n
    text: |-
      de instelling en werkwijze van commissies waaraan de beslissing met uitsluiting van administratieve organen is
      opgedragen, voor zover deze worden mogelijk gemaakt;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125.1.o
    text: |-
      de wijze, waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gepleegd over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaren, alsmede de gevallen
      waarin overeenstemming in dat overleg dient te worden bereikt.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: '125.2'
    text: |-
      Onder gelijk voorbehoud stelt het bevoegd gezag der provinciën, gemeenten, waterschappen, veenschappen en
      veenpolders voor de ambtenaren, door of vanwege deze lichamen aangesteld, voorschriften vast omtrent de onderwerpen
      in het eerste lid genoemd. Als ambtenaar aangesteld door of vanwege een waterschap, veenschap of veenpolder, wordt
      aangemerkt hij, die is aangesteld door het in het reglement dier instelling daartoe aangewezen gezag, teneinde in
      dienst van het waterschap, het veenschap of den veenpolder werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: '125.3'
    text: |-
      Alle bestaande en vast te stellen voorschriften, afkomstig van het bevoegd gezag der provinciën, gemeenten,
      waterschappen, veenschappen en veenpolders, houdende regeling van onderwerpen in het eerste lid genoemd, waaronder
      begrepen die, tot welker vaststelling de bevoegdheid wordt ontleend aan bijzondere wetten, worden geacht ter
      uitvoering van dit artikel te zijn gegeven.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125
  - number: 125bis
    text: |-
      Het is de voorzitter, de leden en de secretaris van commissies als bedoeld in
      [artikel 125, eerste lid, onderdeel ][ref1], alsmede hun plaatsvervangers verboden:


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125bis
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
  - number: 125bis.a
    text: |-
      hetgeen zij als zodanig te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie wordt
      gevorderd;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125bis
  - number: 125bis.b
    text: de gevoelens te openbaren die bij de beraadslaging zijn geuit;
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125bis
  - number: 125bis.c
    text: |-
      over een voor hen aanhangige zaak of over een zaak die naar zij weten of redelijkerwijs kunnen vermoeden voor hen
      aanhangig zal worden, op enigerlei bijzondere wijze in contact te treden met partijen, hun gemachtigden of hun
      raadslieden.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125bis
  - number: 125a.1
    text: |-
      De ambtenaar dient zich te onthouden van het openbaren van gedachten of gevoelens of van de uitoefening van
      het recht tot vereniging, tot vergadering en tot betoging, indien door de uitoefening van deze rechten de goede
      vervulling van zijn functie of de goede functionering van de openbare dienst, voor zover deze in verband staat met
      zijn functievervulling, niet in redelijkheid zou zijn verzekerd.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125a
  - number: 125a.2
    text: 'Het eerste lid is, voor wat betreft het recht van vereniging, niet van toepassing op het lidmaatschap van:'
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125a
  - number: 125a.2.a
    text: |-
      een politieke groepering, waarvan de aanduiding is ingeschreven overeenkomstig de [Kieswet][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 125a.2.b
    text: een vakvereniging.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125a
  - number: 125a.3
    text: |-
      De ambtenaar is verplicht tot geheimhouding van hetgeen hem in verband met zijn functie ter kennis is gekomen, voor
      zover die verplichting uit de aard der zaak volgt.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125a
  - number: 125b
    text: |-
      De ambtenaar is niet gehouden tot dienstverrichting op voor hem op grond van zijn godsdienst of levensovertuiging
      geldende feest- en rustdagen, tenzij het dienstbelang dit onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125b
  - number: 125c.1
    text: |-
      Een ambtenaar, die een functie in publiekrechtelijke colleges, waarin hij is benoemd of verkozen, gezien de omvang
      van de daaruit voortvloeiende werkzaamheden, niet gelijktijdig kan vervullen met zijn ambt, wordt in verband
      daarmede tijdelijk ontheven van de waarneming van zijn ambt, tenzij het dienstbelang zich tegen ontheffing verzet.
      Betreffende het doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur voor de door of
      vanwege het rijk aangestelde ambtenaren, dan wel door het bevoegde gezag der provincies, gemeenten en waterschappen
      voor de ambtenaren door of vanwege deze lichamen aangesteld, regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125c
  - number: 125c.2
    text: |-
      Indien de ambtenaar in verband met een functie in publiekrechtelijke colleges, waarin hij is benoemd of verkozen,
      niet op grond van het eerste lid van de waarneming van zijn ambt is ontheven, wordt hem voor het bijwonen van
      vergaderingen en zittingen van deze colleges en voor het verrichten van daaruit voortvloeiende werkzaamheden ten
      behoeve van deze colleges, buitengewoon verlof verleend, tenzij het dienstbelang zich tegen verlofverlening verzet.
      Betreffende het doorbetalen van bezoldiging kunnen bij of krachtens algemene maatregel van bestuur voor de door of
      vanwege het rijk aangestelde ambtenaren, dan wel door het bevoegde gezag der provincies, gemeenten en waterschappen
      voor de ambtenaren door of vanwege deze lichamen aangesteld, regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125c
  - number: 125c.3
    text: |-
      Aan de ambtenaar wordt, tenzij het dienstbelang zich tegen verlofverlening verzet, buitengewoon verlof verleend
      voor aan te wijzen activiteiten van of voor vakorganisaties van overheidspersoneel overeenkomstig regels te stellen
      bij of krachtens algemene maatregel van bestuur voor de door of vanwege het rijk aangestelde ambtenaren, dan wel
      door het bevoegde gezag der provinciën, gemeenten en waterschappen voor de ambtenaren door of vanwege deze lichamen
      aangesteld.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125c
  - number: 125d
    text: |-
      De ambtenaar is verplicht tijdens het verblijf op zijn werk zich te onderwerpen aan een in het belang van de dienst
      door het bevoegde gezag gelast onderzoek aan zijn lichaam of aan zijn kleding of van zijn daar aanwezige goederen.
      Het bevoegd gezag, op wiens last het onderzoek plaatsheeft, neemt de nodige maatregelen ten einde daarbij een
      onredelijke of onbehoorlijke bejegening te voorkomen.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125d
  - number: 125e.1
    text: |-
      Voor de vervulling van een vertrouwensfunctie komt slechts in aanmerking degene die Nederlander is. Degene die geen
      Nederlander is, kan niettemin worden aangesteld wanneer het dienstbelang dat bepaaldelijk vordert.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125e
  - number: 125e.2
    text: |-
      Aan een ambtenaar kan eervol ontslag worden verleend, indien hij op grond van het bepaalde in
      [artikel 5, derde lid][ref1], of [artikel 10, tweede lid, van de Wet veiligheidsonderzoeken][ref2] uit een
      vertrouwensfunctie moet worden ontheven.


      [ref1]: https://wetten.overheid.nl/BWBR0008277#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel10
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125e
    references:
      - id: ref1
        bwb_id: BWBR0008277
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '10'
  - number: 125e.3
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld ter zake van het bepaalde in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125e
  - number: 125f.1
    text: |-
      Bij algemene maatregel van bestuur kunnen voor categorieën van ambtenaren die door of vanwege het Rijk
      zijn aangesteld en die uit hoofde van hun functie kennis kunnen nemen van zeer geheime of geheime gegevens
      betreffende de veiligheid of andere gewichtige belangen van de staat, voorschriften worden gesteld betreffende de
      verplichtingen waaraan deze ambtenaren zijn onderworpen in verband met het anders dan in de uitoefening van hun
      functie reizen naar en het verblijven in landen waarin het verblijf door deze ambtenaren een bijzonder risico voor
      de veiligheid of andere gewichtige belangen van de staat kan opleveren en die er toe strekken dit risico zoveel
      mogelijk te beperken.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125f
  - number: 125f.2
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid treedt niet eerder in werking dan twee maanden na
      de datum van uitgifte van het *Staatsblad* waarin hij is geplaatst. Van de plaatsing wordt onverwijld mededeling
      gedaan aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125f
  - number: 125g.1
    text: |-
      Het bevoegd gezag mag geen onderscheid maken tussen ambtenaren op grond van een verschil in arbeidsduur in de
      voorwaarden waaronder een aanstelling wordt verleend, verlengd dan wel beëindigd, tenzij een dergelijk onderscheid
      objectief gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125g
  - number: 125g.2
    text: |-
      Het bevoegd gezag mag het dienstverband met de ambtenaar niet beëindigen wegens de omstandigheid dat betrokkene in
      of buiten rechte een beroep heeft gedaan op het eerste lid.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125g
  - number: 125g.3
    text: |-
      De Commissie gelijke behandeling, genoemd in [artikel 11 van de Algemene wet gelijke behandeling][ref1], kan
      onderzoeken of een onderscheid is of wordt gemaakt als bedoeld in dit artikel. De [artikelen 12][ref2], [13][ref3],
      [14][ref4], [15][ref5], [20, tweede lid][ref6], en [33 van de Algemene wet gelijke behandeling][ref7] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0006502#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0006502#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0006502#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0006502#Artikel14
      [ref5]: https://wetten.overheid.nl/BWBR0006502#Artikel15
      [ref6]: https://wetten.overheid.nl/BWBR0006502#Artikel20
      [ref7]: https://wetten.overheid.nl/BWBR0006502#Artikel33
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel125g
    references:
      - id: ref1
        bwb_id: BWBR0006502
        artikel: '11'
      - id: ref2
        bwb_id: BWBR0006502
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0006502
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0006502
        artikel: '14'
      - id: ref5
        bwb_id: BWBR0006502
        artikel: '15'
      - id: ref6
        bwb_id: BWBR0006502
        artikel: '20'
      - id: ref7
        bwb_id: BWBR0006502
        artikel: '33'
  - number: '126.1'
    text: |-
      Indien het bevoegd gezag eener provincie nalatig blijft aan [artikel 125][ref1] uitvoering te geven, of wel,
      ingeval Wij aanvulling, wijziging of intrekking van gegeven uitvoeringsvoorschriften gewenscht achten, zoodanige
      aanvulling, wijziging of intrekking ondanks daartoe strekkende aanmaning binnen een te stellen termijn van ten
      minste drie maanden niet tot stand brengt, zijn Wij bevoegd Gedeputeerde Staten uit te noodigen het noodzakelijk
      besluit vast te stellen. Blijven ook Gedeputeerde Staten in gebreke, of, ingeval aan hen in de reglementen der
      waterschappen, veenschappen en veenpolders het geven van uitvoering aan [artikel 125][ref2] is opgedragen, blijven
      zij daarin nalatig of brengen zij de door Ons gewenschte aanvulling, wijziging of intrekking niet tot stand in
      voege en binnen een termijn als vorenomschreven, zoo geschiedt de vaststelling door Ons. Een ingevolge dit lid
      vastgesteld besluit wordt geacht van het bevoegd gezag afkomstig te zijn. De afkondiging geschiedt binnen veertien
      dagen, nadat het besluit door het bevoegd gezag is ontvangen; in het gebruikelijke formulier van afkondiging worden
      daarbij de noodzakelijke wijzigingen aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
      - id: ref2
        bwb_id: BWBR0001947
        artikel: '125'
  - number: '126.2'
    text: |-
      Voordat wordt overgegaan tot de in het eerste lid bedoelde aanmaning tot aanvulling, wijziging of intrekking
      van gegeven uitvoeringsvoorschriften wordt de Raad van State gehoord. [Artikel 18][ref1] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002367#Artikel18a
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0002367
        artikel: 18a
  - number: '126.3'
    text: |-
      Indien het naar Ons oordeel wenselijk is de werking of de verdere werking van uitvoeringsvoorschriften, als in het
      eerste lid bedoeld, op te schorten, kunnen Wij deze uitvoeringsvoorschriften schorsen. Ons besluit tot schorsing
      wordt in het *Staatsblad* geplaatst. De schorsing stuit onmiddellijk de werking van de geschorste bepalingen. Zijn
      Wij binnen een tijdvak van een jaar na de schorsing niet overgegaan tot de in het eerste lid bedoelde aanmaning,
      dan neemt de schorsing dientengevolge een einde. Gedeputeerde Staten brengen in dat geval het einde der schorsing,
      voor zover deze een afgekondigd besluit betrof, ter openbare kennis.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel126
  - number: '126.4'
    text: |-
      Ten aanzien van een besluit, dat naar het oordeel van de commissaris van de Koning voor de in het
      eerste lid bedoelde aanvulling, wijziging of intrekking in aanmerking komt, is het bepaalde in
      [artikel 266 van de Provinciewet][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel266
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '266'
  - number: '126.5'
    text: 'De voorgaande leden vinden mede toepassing:'
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel126
  - number: 126.5.a
    text: |-
      voor de voorschriften, vast te stellen door het bevoegde gezag der gemeenten, met dien verstande dat voor
      Gedeputeerde Staten, burgemeester en wethouders, en voor de commissaris van de Koning, de burgemeester in de plaats
      treden en dat in plaats van [artikel 266 van de Provinciewet][ref1], [artikel 273 van de Gemeentewet][ref2] (*Stb.*
      1992, 96) wordt gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel266
      [ref2]: https://wetten.overheid.nl/BWBR0005416#Artikel273
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: '266'
      - id: ref2
        bwb_id: BWBR0005416
        artikel: '273'
  - number: 126.5.b
    text: |-
      voor de voorschriften vast te stellen door het bevoegd gezag der waterschappen, veenschappen en veenpolders, met
      dien verstande, dat voor zoover de uitvoering van [artikel 125][ref1] geheel of gedeeltelijk aan de besturen der
      instellingen zelf is overgelaten, de uitnoodiging wordt gericht tot het door Ons aangewezen gezag of een door Ons
      benoemden bijzonderen commissaris.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel126
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
  - number: '133.1'
    text: |-
      Binnen één jaar na de invoering van [artikel 125][ref1] moet aan dit artikel uitvoering zijn gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
  - number: '133.2'
    text: |-
      De door het bevoegd gezag der provinciën, gemeenten, waterschappen, veenschappen en veenpolders op het oogenblik
      van de invoering van [artikel 125][ref1] vastgestelde voorschriften, die betreffen onderwerpen in dat artikel
      vermeld, blijven bij die invoering van kracht en worden geacht tot uitvoering van [artikel 125][ref2] te zijn
      gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
      - id: ref2
        bwb_id: BWBR0001947
        artikel: '125'
  - number: '134.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden bepalingen vastgesteld betreffende de gevallen waarin en
      de voorwaarden waaronder door of vanwege het rijk indienstneming op arbeidsovereenkomst naar burgerlijk recht
      kan plaatshebben. De [artikelen 125][ref1] en [artikel 648 van Boek 7 van het Burgerlijk Wetboek][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel648
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: 125a
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '648'
  - number: '134.2'
    text: |-
      Omtrent dezelfde onderwerpen worden door het bevoegd gezag der provinciën, gemeenten en waterschappen,
      bepalingen vastgesteld, indien door of vanwege die lichamen indienstneming op arbeidsovereenkomst naar
      burgerlijk recht plaatsheeft. De [artikelen 125][ref1], [126][ref2] en [133, tweede lid, van deze wet][ref3] en
      [artikel 648 van Boek 7 van het Burgerlijk Wetboek][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125a
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel126
      [ref3]: https://wetten.overheid.nl/BWBR0001947#Artikel133
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel648
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel134
