preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat regelen betreffende den rechtstoestand van ambtenaren behooren te
    worden gesteld;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#ArtikelAanhef
articles:
  - number: '1.1'
    text: Ambtenaar in de zin van deze wet is degene, die is aangesteld om in openbare dienst werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel1
  - number: '1.2'
    text: Tot den openbaren dienst behooren alle diensten en bedrijven door den Staat en de openbare lichamen beheerd.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel1
  - number: '1.3'
    text: Niet is ambtenaar in de zin van deze wet degene, met wie een arbeidsovereenkomst naar burgerlijk recht is gesloten.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel1
  - number: '1.4'
    text: Tenzij het tegendeel blijkt, zijn in deze wet onder ambtenaren gewezen ambtenaren begrepen.
    url: https://wetten.overheid.nl/BWBR0001947/2002-05-29#Artikel1
