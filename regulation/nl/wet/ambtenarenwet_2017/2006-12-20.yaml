preamble:
  text: |-
    Wij WILHELMINA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of hooren lezen, salut! doen te weten:

    Alzoo Wij in overweging genomen hebben, dat regelen betreffende den rechtstoestand van ambtenaren behooren te
    worden gesteld;

    Zoo is het, dat Wij, den Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0001947/2006-12-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: Ambtenaar in de zin van deze wet is degene, die is aangesteld om in openbare dienst werkzaam te zijn.
    url: https://wetten.overheid.nl/BWBR0001947/2006-12-20#Artikel1
  - number: '1.2'
    text: Tot den openbaren dienst behooren alle diensten en bedrijven door den Staat en de openbare lichamen beheerd.
    url: https://wetten.overheid.nl/BWBR0001947/2006-12-20#Artikel1
  - number: '1.3'
    text: Niet is ambtenaar in de zin van deze wet degene, met wie een arbeidsovereenkomst naar burgerlijk recht is gesloten.
    url: https://wetten.overheid.nl/BWBR0001947/2006-12-20#Artikel1
  - number: '1.4'
    text: Tenzij het tegendeel blijkt, zijn in deze wet onder ambtenaren gewezen ambtenaren begrepen.
    url: https://wetten.overheid.nl/BWBR0001947/2006-12-20#Artikel1
  - number: '2.1'
    text: |-
      [Titel III][ref1] is niet van toepassing op: - ministers en staatssecretarissen;
        - de commissarissen van de Koning;
        - krachtens de [Grondwet][ref2] of de wet voor hun leven benoemde ambtenaren;
        - de Nationale ombudsman en de substituut-ombudsmannen;
        - notarissen en gerechtsdeurwaarders;
        - de voorzitter, de leden, de plaatsvervangende leden en de buitengewone leden van het College bescherming
      persoonsgegevens, bedoeld in [artikel 51 van de Wet bescherming persoonsgegevens][ref3];
        - de leden van dagelijkse besturen van waterschappen, met uitzondering van de voorzitters;
        - de voorzitter, de plaatsvervangende voorzitters en de andere leden van de Sociaal-Economische Raad, de
      voorzitters en de plaatsvervangende voorzitters van de produkt-, de hoofdbedrijf- en de bedrijfschappen en de
      leden van de besturen van deze lichamen, alsmede degenen die deel uitmaken van organen van lichamen als bedoeld in
      [artikel 110 van de Wet op de Bedrijfsorganisatie][ref4];
        - het personeel in dienst van de Sociaal-Economische Raad, de produkt-, de hoofdbedrijf- en de bedrijfschappen en
      de lichamen, bedoeld in [artikel 110 van de Wet op de Bedrijfsorganisatie][ref5];
        - de leden van de Raden van bestuur en de Raden van advies van de Centrale organisatie werk en
      inkomen, het Uitvoeringsinstituut werknemersverzekeringen en de Sociale verzekeringsbank, bedoeld in de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref6];
        - de voorzitter en de plaatsvervangende voorzitter van het Nederlands Instituut van Registeraccountants, de leden
      van het bestuur van dit lichaam en de leden van de andere bij of krachtens de [Wet op de Registeraccountants][ref7]
      ingestelde colleges;
        - de voorzitter, de ondervoorzitter en de andere leden van het bestuur van de Organisatie ter verbetering van de
      binnenvisserij;
        - de voorzitter en de leden van het College voor zorgverzekeringen, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref8], en het personeel van het bedoelde college;
        - de voorzitter en de leden van het College bouw zorginstellingen en van het College sanering zorginstellingen,
      bedoeld in de [Wet toelating zorginstellingen][ref9];
        - de voorzitter en de plaatsvervangende voorzitter van de Nederlandse Orde van Accountants-
      Administratieconsulenten, de leden van het bestuur van dit lichaam en de leden van de andere bij of krachtens de
      [Wet op de Accountants-Administratieconsulenten][ref10] ingestelde colleges;
        - de voorzitter en de leden van de Nederlandse Zorgautoriteit, bedoeld in de
      [Wet marktordening gezondheidszorg][ref11];
        - militaire ambtenaren;
        - onbezoldigde ambtenaren, behorende tot het personeel van de buitenlandse dienst;
        - de leden van de Commissie gelijke behandeling, bedoeld in de [Algemene wet gelijke behandeling][ref12];
        - de leden van een adviescollege als bedoeld in de [Kaderwet adviescolleges][ref13], niet zijnde een adviescollege
      als bedoeld in [artikel 3 van die wet][ref14];
        - de voorzitter en de andere leden van het bestuur van het Bureau Financieel Toezicht, bedoeld in
      [artikel 110, eerste lid, van de Wet op het notarisambt][ref15];
        - de voorzitter en de plaatsvervangend voorzitter van de Koninklijke Notariële Beroepsorganisatie, de andere leden
      van het bestuur van dit lichaam en de leden van het bestuur van de ringen en hun plaatsvervangers;
        - de voorzitter en plaatsvervangend voorzitter van de Koninklijke Beroepsorganisatie van Gerechtsdeurwaarders en de
      andere leden van het bestuur van dit lichaam;
        - de voorzitter en de leden van de commissie van toezicht, bedoeld in de
      [Wet op de inlichtingen- en veiligheidsdiensten 2002][ref16];
        - wethouders;
        - de leden van de KNMI-raad, bedoeld in
      [artikel 11 van de Wet op het Koninklijk Nederlands Meteorologisch Instituut][ref17];
        - de leden en de plaatsvervangende leden van de Raad voor werk en inkomen, bedoeld in de
      [Wet structuur uitvoeringsorganisatie werk en inkomen][ref18];
        - het lid van het Centraal Bestuur voor de Arbeidsvoorziening, bedoeld in de [Arbeidsvoorzieningswet 1996][ref19];
        - de deskundige leden, bedoeld in de [artikelen 48, derde lid][ref20],
      [66, tweede lid][ref21], [67, derde lid][ref22], [69, tweede lid][ref23], en
      [70, tweede lid, van de Wet op de rechterlijke organisatie][ref24] en hun plaatsvervangers;
        - gedeputeerden.


