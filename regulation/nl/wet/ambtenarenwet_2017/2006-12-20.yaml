  - number: '2.2'
    text: |-
      De [artikelen 125][ref1], [125bis][ref2], [125ter][ref3], [125quater][ref4], [125quinquies][ref5],
      [125a][ref6], [125c][ref7], [125d][ref8], [125f][ref9] en [126][ref10] zijn niet van toepassing op de
      rechterlijke ambtenaren, bedoeld in de [artikelen 1, onder b, onderdelen 4° tot en met 8°][ref11], en
      [145 van de Wet op de rechterlijke organisatie][ref12].


