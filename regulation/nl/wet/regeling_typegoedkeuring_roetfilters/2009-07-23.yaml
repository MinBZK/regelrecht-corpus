preamble:
  text: |-
    Gelet op de artikelen 21, eerste lid, en 22, eerste lid, van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling en de bijlagen wordt verstaan onder:

        - *richtlijn 88/77:* [richtlijn 88/77/EEG](31988L0077) van de Raad van de Europese Gemeenschap van 3 december
      1987 (PbEG 1988, L36) inzake de onderlinge aanpassing van de wetgevingen van de lidstaten met betrekking tot
      maatregelen tegen de emissie van verontreinigende gassen en deeltjes door voertuigmotoren met compressieontsteking
      en de emissie van verontreinigende gassen door op aardgas of vloeibaar petroleumgas lopende voertuigmotoren met
      elektrische ontsteking (PbEG 1988, L 36);
        - *richtlijn 2005/55:* [richtlijn 2005/55/EG](32005L0055) van het Europees Parlement en de Raad van de Europese
      Unie van 28 september 2005 inzake de onderlinge aanpassing van de wetgevingen van de lidstaten met betrekking tot
      maatregelen tegen de emissie van verontreinigende gassen en deeltjes door voertuigmotoren met compressieontsteking
      en de emissie van verontreinigende gassen door op aardgas of vloeibaar petroleumgas lopende voertuigmotoren met
      elektrische ontsteking (PbEU L 275);
        - *roetfilter:* voorziening ter nabehandeling van het uitlaatgas ter vermindering van de uitstoot van deeltjes door
      mechanische of aërodynamische afvang, alsmede door diffusie- of traagheidseffecten.
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel1
  - number: '2'
    text: |-
      De Dienst Wegverkeer verleent een nationale typegoedkeuring voor een type roetfilter bestemd voor het achteraf
      monteren op motorvoertuigen die bij de toelating tot het verkeer op de weg voldoen aan [richtlijn 88/77]
      (31988L0077) of [richtlijn 2005/55](32005L0055), indien aan de in deze regeling en de bijlagen bij deze regeling
      opgenomen eisen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel2
  - number: '3'
    text: |-
      Een typegoedkeuring die op grond van een overeenkomst tussen de Dienst Wegverkeer en de fabrikant is afgegeven voor
      een roetfilter, bestemd voor de in [artikel 2][ref1] bedoelde motorvoertuigen, dat voor de inwerkingtreding van
      deze regeling achteraf in een motorvoertuig is ingebouwd, wordt gelijkgesteld met een typegoedkeuring als bedoeld
      in [artikel 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0026149#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0026149#Artikel2
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0026149
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0026149
        artikel: '2'
  - number: '4'
    text: |-
      Bij de aanvraag worden documenten gevoegd waaruit blijkt dat wordt voldaan aan [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026149
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0026149
  - number: '5'
    text: |-
      1 De houder van een typegoedkeuring als bedoeld in [artikel 2][ref1] verstrekt bij elk roetfilter dat hij op de
      markt brengt een montagehandleiding en een afschrift van het goedkeuringscertificaat.

      2 De montagehandleiding is opgesteld in de Nederlandse taal en bevat minimaal de volgende informatie:

      a. de naam of het handelsmerk van de fabrikant van het retrofit roetfilter;

      b. het type van het retrofit roetfilter;

      c. het Nederlandse goedkeuringsnummer en, indien van toepassing, het Duitse goedkeuringsnummer;

      d. van de voertuig- of motortypen (met vermelding van het bouwjaar) waarvoor het retrofit roetfilter is
      goedgekeurd:

      1°. het merk;

      2°. het type (handelsbenaming);

      3°. de bouwjaren, zonodig in combinatie met de chassis identificatienummers;

      4°. het motortype (motorcode);

      5°. de euroklasse(s) van de motoren;

      6°. de motorinhoud;

      7°. het aantal cilinders;

      8°. het motorvermogen;

      e. voldoende informatie voor een gekwalificeerd pesoon om het retrofit roetfilter op het voertuig te monteren;

      f. de criteria en methodes waarop of waarmee moet worden beoordeeld of de motor van het voertuig waarop het
      filter moet worden gemonteerd in een zodanige conditie verkeert dat een goede werking van het filter gedurende de
      voorgeschreven levensduur mag worden verwacht;

      g. de plaats van het retrofit roetfilter waar, na montage van het filter op het voertuig, de laatste vier cijfers
      (afmeldcode) van het voertuigidentificatienummer (VIN) kunnen worden ingeslagen of -gegraveerd.


      [ref1]: https://wetten.overheid.nl/BWBR0026149#Artikel2
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0026149
        artikel: '2'
  - number: '6'
    text: |-
      De houder van de typegoedkeuring draagt er zorg voor dat wordt voldaan aan [artikel 21, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0026149
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0026149
  - number: '7'
    text: |-
      Met een verklaring dat het roetfilter voldoet aan de bijlagen wordt gelijkgesteld een verklaring van goedkeuring,
      afgegeven door een onafhankelijke keuringsinstelling in een andere lidstaat van de Europese Unie dan wel in
      een staat, niet zijnde een lidstaat van de Europese Unie, die partij is bij een daartoe strekkend of mede
      daartoe strekkend Verdrag dat Nederland bindt, welke verklaring is afgegeven op basis van onderzoekingen die een
      beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de bijlagen wordt nagestreefd.
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van de eerste dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0026149/2009-07-23#Artikel8
  - number: '9'
    text: 'Deze regeling wordt aangehaald als: Regeling typegoedkeuring roetfilters.'
