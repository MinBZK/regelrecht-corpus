preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het wenselijk is het recht van het kind op een gezonde en evenwichtige
    ontwikkeling en groei naar zelfstandigheid ook in de regeling van de maatregelen van kinderbescherming meer
    centraal te stellen, en voorts te verduidelijken dat bij alle beslissingen het belang van het kind een eerste
    overweging dient te zijn, en dat daartoe Boek 1 van het Burgerlijk Wetboek, het Wetboek van Burgerlijke
    Rechtsvordering, de Wet op de jeugdzorg en de Pleegkinderenwet dienen te worden gewijzigd;


    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034989/2015-01-01#ArtikelAanhef
articles:
  - number: V
    text: >-
      Onze Ministers zenden binnen vijf jaar na de inwerkingtreding van de wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0034989/2015-01-01#ArtikelV
  - number: VI
    text: >-
      De wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0034989/2015-01-01#ArtikelVI
