  - number: '12'
    text: |-
      1 Het is verboden bloedproducten, niet zijnde bloedproducten die krachtens de [Geneesmiddelenwet][ref1] moeten
      worden geregistreerd, af te leveren aan anderen dan:

      a. de Bloedvoorzieningsorganisatie;

      b. krachtens [artikel 5 van de Wet toelating zorginstellingen][ref2] als ziekenhuis toegelaten instellingen,
      apothekers en apotheekhoudende huisartsen die in het bezit zijn van een vergunning als bedoeld in
      [artikel 61, tiende of elfde lid, van de Geneesmiddelenwet][ref3];

      c. door Onze Minister aangewezen andere personen, rechts personen daaronder begrepen.

      2 Aflevering als bedoeld in het eerste lid, onder *b*, is uitsluitend toegestaan aan de
      Bloedvoorzieningsorganisatie.

      3 Onze Minister wijst slechts de personen aan, bedoeld in het eerste lid, onder *c*, indien naar zijn oordeel
      het belang van een in geneeskundig opzicht doelmatige voorziening in de behoefte aan bloedproducten zulks vordert
      dan wel een bijzondere omstandigheid daartoe aanleiding geeft. [Artikel 3, derde en vierde lid][ref4], is van
      overeenkomstige toepassing. Zodanige aanwijzing, alsmede wijziging of intrekking ervan, wordt bekendgemaakt in
      de *Staatscourant*.


      [ref1]: https://wetten.overheid.nl/BWBR0021505
      [ref2]: https://wetten.overheid.nl/BWBR0018906#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0021505#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0009079#Artikel3
