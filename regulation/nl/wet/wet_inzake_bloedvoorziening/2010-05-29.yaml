  - number: '25'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van de wet en vervolgens telkens na vier jaar, aan de
      beide Kamers der Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van de wet.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel25
  - number: '27'
    text: Deze wet treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet inzake bloedvoorziening.'
