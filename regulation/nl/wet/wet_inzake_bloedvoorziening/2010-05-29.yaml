preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet inzake bloedtransfusie te vervangen door een Wet
    inzake bloedvoorziening in verband met het instellen van één landelijke organisatie voor bloedvoorziening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

      a. Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;

      b. Bloedvoorzieningsorganisatie: de krachtens [artikel 3, eerste lid][ref1], aangewezen rechtspersoon;

      c. donor: persoon die een deel van zijn bloed of een bestanddeel van een deel van zijn bloed afstaat voor gebruik
      in het kader van de geneeskundige behandeling van andere personen of ten behoeve van wetenschappelijk onderzoek;

      d. inzamelen van bloed: het werven, oproepen en keuren van donoren en het bij donoren afnemen van bloed,
      bloedcellen of bloedplasma;

      e. product: menselijk bloed, alsmede daaruit afgescheiden bestanddelen, waaraan al dan niet een andere substantie
      is toegevoegd;

      f. tussenproduct: product, niet geschikt voor toediening aan de mens;

      g. bloedproduct: product, geschikt voor toediening aan de mens;

      h. bloedvoorziening: het geheel van maatregelen en middelen terzake van onder meer het inzamelen van bloed en het
      bereiden en afleveren van tussenproducten en bloedproducten;

      i. derde land: de staat die niet lid is van de Europese Unie of die niet partij is bij de Overeenkomst betreffende
      de Europese Economische Ruimte.

      2 Met een donor wordt gelijkgesteld de persoon die een deel van zijn bloed of een bestanddeel van een deel van zijn
      bloed laat afzonderen ten behoeve van de geneeskundige behandeling van zichzelf.

      3 [De artikelen 4, eerste lid][ref2], [12, tweede lid][ref3], [13, eerste lid][ref4], [15, eerste lid][ref5],
      [16, eerste lid][ref6], en [17, eerste lid][ref7] en de daarop berustende bepalingen zijn niet van toepassing op
      bloed of een bestanddeel van bloed dat ofwel is afgestaan uitsluitend ten behoeve van de geneeskundige behandeling
      van een bepaalde andere persoon, ofwel is afgezonderd ten behoeve van de geneeskundige behandeling van de donor
      zelf; de genoemde artikelen zijn evenmin van toepassing op uit dat bloed bereide bloedproducten.


