  - number: '7'
    text: |-
      1 De Bloedvoorzieningsorganisatie dient jaarlijks vóór 1 december een begroting en een beleidsplan in bij Onze
      Minister.

      2 Onze Minister kan bij ministeriële regeling regels stellen over de inrichting van de begroting en het
      beleidsplan.

      3 De begroting en het beleidsplan behoeven de goedkeuring van Onze Minister.

      4 Onze Minister onthoudt zijn goedkeuring aan de begroting of het beleidsplan indien deze in strijd zijn met het
      bepaalde bij of krachtens deze wet, waaronder begrepen het plan, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel2
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '2'
        hoofdstuk: II
  - number: '8'
    text: |-
      1 De Bloedvoorzieningsorganisatie brengt jaarlijks vóór 1 juni verslag uit aan Onze Minister over de vervulling
      van haar taken en de uitvoering van de werkzaamheden. Onze Minister kan regels stellen over de inrichting van het
      verslag.

      2 Zodra de Bloedvoorzieningsorganisatie beschikt over het definitieve jaarverslag en de definitieve jaarrekening,
      stelt zij deze aan onze Minister ter beschikking.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel8
  - number: '9'
    text: |-
      1 De Bloedvoorzieningsorganisatie is verplicht Onze Minister voor een goede uitvoering van deze wet de door hem
      gevraagde gegevens te verstrekken.

      2 De Bloedvoorzieningsorganisatie is verplicht wijzigingen in de organisatie, het personeel of het materieel, die
      ingrijpende gevolgen hebben voor het vervullen van de in [het eerste lid van artikel 3][ref1] bedoelde taken, mede
      te delen aan Onze Minister.

      3 De Bloedvoorzieningsorganisatie is verplicht Onze Minister onverwijld in kennis te stellen van elk geval
      van risico's voor het leven of de gezondheid van mensen, ontstaan of te vrezen als gevolg van gebreken aan
      bloedproducten, die van haar afkomstig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '10'
    text: |-
      1 Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens [de artikelen 5][ref1], [6][ref2],
      [8][ref3] of [9][ref4] niet of in onvoldoende mate of op onjuiste wijze wordt nageleefd, kan hij de
      Bloedvoorzieningsorganisatie een schriftelijke aanwijzing geven.

      2 In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens
      [de artikelen 5][ref5], [6][ref6], [8][ref7] of [9][ref8] niet of in onvoldoende mate of op onjuiste
      wijze wordt nageleefd, de in verband daarmee te nemen maatregelen, alsmede de termijn waarbinnen de
      Bloedvoorzieningsorganisatie aan de aanwijzing moet voldoen.

      3 Indien het nemen van maatregelen in verband met gevaar voor de gezondheid redelijkerwijs geen uitstel kan leiden,
      kan de ingevolge artikel 20 met het toezicht belaste ambtenaar een schriftelijk bevel geven. Het bevel heeft een
      geldigheidsduur van zeven dagen, welke door Onze Minister telkens met eenzelfde periode kan worden verlengd zolang
      naar het oordeel van Onze Minister het gevaar voor de gezondheid niet is geweken.

      4 De Bloedvoorzieningsorganisatie is verplicht volledig en binnen de daarbij gestelde termijn aan de aanwijzing
      onderscheidenlijk onmiddellijk aan het bevel te voldoen.

      5 Indien de Bloedvoorzieningsorganisatie inzake het vierde lid in gebreke blijft, kan de Minister een bewindvoerder
      over de Bloedvoorzieningsorganisatie aanstellen.


