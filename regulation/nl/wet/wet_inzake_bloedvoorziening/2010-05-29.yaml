  - number: '22'
    text: |-
      1 De Wet inzake bloedtransfusie wordt ingetrokken.

      2 De registratie van een bloedproduct die heeft plaats gevonden krachtens artikel 24 van de Wet inzake
      bloedtransfusie, wordt gelijkgesteld met de verlening van een handelsvergunning of een parallelhandelsvergunning
      als bedoeld in [artikel 40][ref1] onderscheidenlijk [48 van de Geneesmiddelenwet][ref2].

      3 De regelingen berustend op de artikelen 24 en 25, onderscheidenlijk 26, 27 en 29 van de Wet inzake
      bloedtransfusie, blijven van kracht tot zij bij koninklijk besluit, onderscheidenlijk bij ministeriële regeling,
      worden ingetrokken. Zij kunnen tussentijds door toepassing van de genoemde artikelen nog worden gewijzigd.

      4 Een vergunning, verleend krachtens artikel 30 of artikel 31 van de Wet inzake bloedtransfusie, wordt
      gelijkgesteld met een vergunning op grond van [artikel 15 ][ref3]onderscheidenlijk de [artikelen 16][ref4] en
      [17][ref5] van de onderhavige wet.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
