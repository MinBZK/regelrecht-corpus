  - number: '14'
    text: |-
      Het is verboden de aflevering van bloedproducten en tussenproducten te laten geschieden tegen een vergoeding die
      meer bedraagt dan de kosten welke ten behoeve van het inzamelen van bloed, het bereiden of het afleveren zijn
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel14
  - number: '15'
    text: |-
      1 Het is verboden bloedproducten en tussenproducten uit een derde land in te voeren zonder vergunning van Onze
      Minister.

      2 Onze Minister verleent een vergunning slechts indien naar zijn oordeel het belang van een in geneeskundig opzicht
      doelmatige voorziening in de behoefte aan bloedproducten zulks vordert dan wel een bijzondere omstandigheid daartoe
      aanleiding geeft.

      3 Indien het in het tweede lid genoemde belang zulks vordert, onderscheidenlijk indien een bijzondere omstandigheid
      daartoe aanleiding geeft, kan Onze Minister voorschriften aan de vergunning verbinden of de vergunning onder
      beperkingen verlenen. De vergunning kan worden ingetrokken; [artikel 3, vierde lid][ref1], is van overeenkomstige
      toepassing.

      4 Het in het eerste lid vervatte verbod geldt niet:

      a. ten aanzien van een persoon die bij het overschrijden van de grens in het bezit is van een hoeveelheid van een
      bloedproduct, welke kennelijk voor eigen gebruik is bestemd;

      b. ten aanzien van een instelling van wetenschappelijk onderzoek, voor zover het in te voeren bloedproduct of
      tussenproduct bestemd is voor wetenschappelijk onderzoek;

      c. ten aanzien van een product dat is bestemd om als monster te worden overgelegd bij een aanvraag tot registratie
      krachtens de [Geneesmiddelenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0021505
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0021505
  - number: '16'
    text: |-
      1 Het is verboden bloedproducten en tussenproducten uit te voeren naar een derde land zonder vergunning van Onze
      Minister.

      2 Onze Minister verleent slechts een vergunning indien naar zijn oordeel het belang van een doelmatige voorziening
      in de behoefte aan bloedproducten daardoor niet wordt geschaad.

      3 Onze Minister kan aan de vergunning voorschriften verbinden of de vergunning onder beperkingen verlenen. De
      vergunning kan worden ingetrokken; [artikel 3, vierde lid][ref1], is van overeenkomstige toepassing.

      4 Het in het eerste lid vervatte verbod geldt niet ten aanzien van:

      a. een persoon die bij het overschrijden van de grens in het bezit is van een hoeveelheid van een bloedproduct,
      welke kennelijk voor eigen gebruik bestemd is;

      b. de vereniging «Het Nederlandse Rode Kruis» voorzover de uitvoer geschiedt in het kader van de hulpverlening
      overeenkomstig de statuten van die vereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
