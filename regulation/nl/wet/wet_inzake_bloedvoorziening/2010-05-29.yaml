  - number: '18'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat bij het indienen van een aanvraag om een aanwijzing als
      bedoeld in [de artikelen 12, eerste lid, onder ][ref1], en [13, eerste lid, onder ][ref2], dan wel een vergunning
      als bedoeld in [de artikelen 15, eerste lid][ref3], [16, eerste lid][ref4], en [17, eerste lid][ref5], een bedrag
      moet worden betaald, waarvan de hoogte bij die maatregel wordt geregeld, doch ten hoogste de kosten verbonden aan
      de aanwijzing of vergunning mag bedragen. Onze Minister kan regels stellen omtrent de wijze van betaling.


