  - number: '17'
    text: |-
      1 Het is verboden bloedproducten als bedoeld in [artikel 12, eerste lid][ref1], en tussenproducten uit te voeren
      naar een staat die lid is van de Europese Unie of die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte zonder vergunning van Onze Minister.

      2 Onze Minister verleent slechts een vergunning indien naar zijn oordeel het belang van een doelmatige voorziening
      in de behoefte aan bloedproducten daardoor niet wordt geschaad.

      3 Onze Minister kan aan de vergunning voorschriften verbinden of de vergunning onder beperkingen verlenen. De
      vergunning kan worden ingetrokken; [artikel 3, vierde lid][ref2], is van overeenkomstige toepassing.

      4 Het in het eerste lid vervatte verbod geldt niet ten aanzien van:

      a. een persoon die bij het overschrijden van de grens in het bezit is van een hoeveelheid van een bloedproduct,
      welke kennelijk voor eigen gebruik bestemd is;

      b. de vereniging «Het Nederlandse Rode Kruis» voor zover de uitvoer geschiedt in het kader van de hulpverlening
      overeenkomstig de statuten van die vereniging;

      c. de Bloedvoorzieningsorganisatie;

      d. voor wat betreft tussenproducten, de krachtens [artikel 13, eerste lid, onder d][ref3], aangewezen personen,
      rechtspersonen daaronder begrepen.


