      1 Hij die handelt in strijd met:

      a. de artikelen 4, eerste of tweede lid, 10, vierde lid, 12, eerste of tweede lid, 13, eerste lid, 14, 15, eerste
      lid, 16, eerste lid, of 17, eerste lid;

      b. een krachtens de artikelen 12, derde lid, 13, derde lid, 15, derde lid, 16, derde lid, of 17, derde lid, aan
      een aanwijzing onderscheidenlijk vergunning verbonden voorschrift; wordt gestraft met hechtenis van ten hoogste zes
      maanden of geldboete van de vierde categorie.

      2 De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel19
  - number: 19a
    text: |-
      1 Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 33 500,– op te leggen ter
      zake van een gedraging die in strijd is met [artikel 4, eerste of tweede lid][ref1], [12][ref2],
      [13, eerste of derde lid][ref3], [14][ref4], [15, eerste of derde lid][ref5], [16, eerste of derde lid][ref6],
      of [17, eerste lid][ref7].

      2 Onze Minister is bevoegd een last onder dwangsom op te leggen ter zake van een gedraging die in strijd is met een
      krachtens [artikel 10][ref8] gegeven aanwijzing of bevel.


