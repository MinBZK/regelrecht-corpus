  - number: '4'
    text: |-
      1 Het is aan anderen dan de Bloedvoorzieningsorganisatie verboden bloed in te zamelen.

      2 Het is verboden aan een donor andere dan door hem in redelijkheid gemaakte kosten te vergoeden.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel4
  - number: '5'
    text: |-
      1 De Bloedvoorzieningsorganisatie voert de werkzaamheden betreffende het inzamelen van bloed en het bereiden van
      bloedproducten, alsmede het bewaren, verpakken, etiketteren, vervoeren en afleveren daarvan, op verantwoorde wijze
      uit. Onder verantwoord wordt in ieder geval verstaan: doeltreffend en doelmatig alsmede gericht op een zo hoog
      mogelijke kwaliteit van de bloedproducten en een zo groot mogelijke veiligheid van donor en gebruiker.

      2 Onze Minister kan de Bloedvoorzieningsorganisatie omtrent het eerste lid voorschriften geven. Deze voorschriften
      kunnen onder meer betrekking hebben op:

      a. de personen die bij de uitvoering van de werkzaamheden zijn betrokken;

      b. de ruimten waarin en de middelen waarmee de werkzaamheden worden uitgevoerd;

      c. het inzamelen van bloed;

      d. het bereiden van tussenproducten en bloedproducten uit het ingezamelde bloed, alsmede het bewaren, verpakken,
      etiketteren, vervoeren en afleveren daarvan;

      e. het voeren van een administratie en het verwerken van de geadministreerde gegevens.

      3 De voorschriften worden in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel5
  - number: '6'
    text: |-
      1 Het uitvoeren van [artikel 5][ref1] omvat mede de systematische bewaking, beheersing en verbetering van de
      kwaliteit van de werkzaamheden en het eindproduct.

      2 Ter uitvoering van het eerste lid draagt de Bloedvoorzieningsorganisatie in ieder geval zorg voor:

      a. het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de werkzaamheden
      en het tussen- of bloedproduct;

      b. het aan de hand van de gegevens, bedoeld onder *a*, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 5][ref2] leidt tot een verantwoorde uitvoering van de werkzaamheden;

      c. het op basis van de uitkomst van de toetsing, bedoeld onder *b*, zo nodig veranderen van de wijze waarop
      [artikel 5][ref3] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel5
