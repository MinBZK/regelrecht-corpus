  - number: '20'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van het
      Staatstoezicht op de volksgezondheid.

      2 Bij besluit van Onze Minister kunnen andere ambtenaren geheel of gedeeltelijk worden belast met het in het eerste
      lid bedoelde toezicht. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan door plaatsing in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0009079/2010-05-29#Artikel20
  - number: '21'
    text: |-
      1 Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren, aangewezen bij besluit van
      Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Justitie. Deze ambtenaren zijn
      tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en
      [184 van het Wetboek van Strafrecht][ref3], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      3 Bij de uitoefening van hun taak dragen de ambtenaren een legitimatiebewijs bij zich.

      4 Onverminderd [artikel 1, eerste en tweede lid, van de Algemene wet op het binnentreden][ref4] tonen zij hun
      legitimatiebewijs desgevraagd aanstonds.

      5 Het legitimatiebewijs bevat een foto van de ambtenaar en vermeldt in ieder geval diens naam en hoedanigheid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
