  - number: '18.1'
    text: |-
      De kosten die samenhangen met het in behandeling nemen van de aanvraag van een aanwijzing als bedoeld in de
      [artikelen 12, eerste lid, onder e][ref1], en [13, eerste lid, onder d][ref2], of een vergunning als bedoeld in
      de [artikelen 15, eerste lid][ref3], [16, eerste lid][ref4], en [17, eerste lid][ref5], kunnen ten laste worden
      gebracht van de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0009079#Artikel15
