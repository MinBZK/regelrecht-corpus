  - number: '20.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de ambtenaren van de
      Inspectie gezondheidszorg en jeugd.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel20
  - number: '20.2'
    text: |-
      Bij besluit van Onze Minister kunnen andere ambtenaren geheel of gedeeltelijk worden belast met het in het eerste
      lid bedoelde toezicht. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan door plaatsing in
      de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel20
  - number: '21.1'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de ambtenaren, aangewezen bij besluit van
      Onze Minister van Volksgezondheid, Welzijn en Sport en Onze Minister van Justitie. Deze ambtenaren zijn
      tevens belast met de opsporing van de feiten, strafbaar gesteld in de [artikelen 179 tot en met 182][ref2] en
      [184 van het Wetboek van Strafrecht][ref3], voor zover deze feiten betrekking hebben op een bevel, vordering of
      handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '21.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel21
  - number: '21.3'
    text: Bij de uitoefening van hun taak dragen de ambtenaren een legitimatiebewijs bij zich.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel21
  - number: '21.4'
    text: |-
      Onverminderd [artikel 1, eerste en tweede lid, van de Algemene wet op het binnentreden][ref1] tonen zij hun
      legitimatiebewijs desgevraagd aanstonds.


      [ref1]: https://wetten.overheid.nl/BWBR0006763#Artikel1
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006763
        artikel: '1'
  - number: '21.5'
    text: Het legitimatiebewijs bevat een foto van de ambtenaar en vermeldt in ieder geval diens naam en hoedanigheid.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel21
  - number: '22.1'
    text: De Wet inzake bloedtransfusie wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel22
  - number: '22.2'
    text: |-
      De registratie van een bloedproduct die heeft plaats gevonden krachtens artikel 24 van de Wet inzake
      bloedtransfusie, wordt gelijkgesteld met de verlening van een handelsvergunning of een parallelhandelsvergunning
      als bedoeld in [artikel 40][ref1] onderscheidenlijk [48 van de Geneesmiddelenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel48
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '48'
  - number: '22.3'
    text: |-
      De regelingen berustend op de artikelen 24 en 25, onderscheidenlijk 26, 27 en 29 van de Wet inzake bloedtransfusie,
      blijven van kracht tot zij bij koninklijk besluit, onderscheidenlijk bij ministeriële regeling, worden ingetrokken.
      Zij kunnen tussentijds door toepassing van de genoemde artikelen nog worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel22
  - number: '22.4'
    text: |-
      Een vergunning, verleend krachtens artikel 30 of artikel 31 van de Wet inzake bloedtransfusie, wordt gelijkgesteld
      met een vergunning op grond van [artikel 15 ][ref1]onderscheidenlijk de [artikelen 16][ref2] en [17][ref3] van de
      onderhavige wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009079#Artikel17
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '15'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '16'
        hoofdstuk: IV
      - id: ref3
        bwb_id: BWBR0009079
        artikel: '17'
        hoofdstuk: IV
  - number: '26.1'
    text: |-
      De Bloedvoorzieningsorganisatie vraagt binnen twee maanden na inwerkingtreding van de
      [artikelen 3a tot en met 3e][ref1] toestemming aan Onze Minister voor het laten uitvoeren van werkzaamheden die
      essentieel zijn voor de uitvoering van de taken, bedoeld in [artikel 3, eerste lid][ref2], die op het moment van
      inwerkingtreding van de artikel 3a tot en met 3e al werden uitgevoerd door één of meerdere andere rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: 3a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '26.2'
    text: |-
      De [artikelen 3a][ref1] en [3b][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel3b
