        artikel: '17'
        hoofdstuk: IV
  - number: '1.4'
    text: |-
      Deze wet is niet van toepassing op producten welke zijn afgenomen ten behoeve van het stellen van een diagnose bij
      degene van wie het product is afgenomen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister stelt met het oog op een doeltreffende en doelmatige bloedvoorziening telkens voor een periode van
      drie jaar een plan vast. Uitgangspunten daarbij zijn dat
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel2
  - number: 2.1.a
    text: |-
      gestreefd wordt naar landelijke zelfvoorziening met vrijwillig en om niet gegeven bloed dat zonder winstoogmerk
      bewerkt en geleverd wordt, en
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel2
  - number: 2.1.b
    text: |-
      de organisatie ten behoeve van zodanige voorziening moet voldoen aan hoge eisen van veiligheid, doelmatigheid en
      kwaliteit.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister stelt bij de voorbereiding van het plan de bij de bloedvoorziening betrokken instanties in de
      gelegenheid om hun opvattingen ter zake naar voren te brengen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel2
  - number: '2.3'
    text: |-
      Onze Minister zendt een afschrift van het plan aan de beide Kamers der Staten-Generaal. Van het plan wordt
      mededeling gedaan in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister wijst één rechtspersoon aan die ter uitvoering van het plan, bedoeld in [artikel 2][ref1], tot taak
      heeft:


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel2
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '2'
        hoofdstuk: II
  - number: 3.1.a
    text: het jaarlijks ramen van de behoefte aan bloed, tussenproducten en bloedproducten;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.1.b
    text: het inzamelen van bloed;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.1.c
    text: |-
      het bereiden van tussenproducten en bloedproducten uit het ingezamelde bloed, alsmede het bewaren, verpakken,
      etiketteren, vervoeren en afleveren daarvan, met uitzondering van bloedproducten waarvoor op grond van
      [artikel 40 van de Geneesmiddelenwet][ref1] een vergunning verplicht is voor het in de handel brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 3.1.d
    text: |-
      het zorg dragen voor de beschikbaarheid van bloedproducten die mede zijn bereid uit het in Nederland ingezamelde
      bloed en waarvoor op grond van [artikel 40 van de Geneesmiddelenwet][ref1] een vergunning verplicht is voor het in
      de handel brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: '3.2'
    text: 'De aanwijzing vindt slechts plaats indien wordt voldaan aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.2.a
    text: de rechtspersoon is gevestigd in Nederland;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.2.b
    text: de werkzaamheid van de rechtspersoon is niet gericht op het behalen van winst;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.2.c
    text: |-
      de rechtspersoon is, wat betreft zijn organisatie, personeel en materieel, in staat de in het eerste lid bedoelde
      taken op verantwoorde wijze te vervullen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: '3.3'
    text: |-
      Onze Minister kan aan de aanwijzing beperkingen stellen en voorschriften verbinden. Hij kan na de aanwijzing de
      beperkingen en voorschriften wijzigen en nieuwe beperkingen en voorschriften vaststellen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: '3.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de maximale relatieve of
      nominale omvang van door de Bloedvoorzieningsorganisatie uitgevoerde andere activiteiten dan de in het eerste lid
      bedoelde.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: '3.5'
    text: Onze Minister kan de aanwijzing intrekken indien
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.5.a
    text: de rechtspersoon daarom verzoekt;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.5.b
    text: |-
      de rechtspersoon een of meer van de in het eerste lid bedoelde taken niet of niet verantwoord vervult of het
      bepaalde bij of krachtens deze wet niet naleeft;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.5.c
    text: naar het oordeel van Onze Minister het belang van een doelmatige bloedvoorziening zulks vordert; dan wel
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3.5.d
    text: een bijzondere omstandigheid daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: '3.6'
    text: |-
      De aanwijzing alsmede de daaraan gestelde beperkingen en verbonden voorschriften of de intrekking van de aanwijzing
      worden in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3
  - number: 3a.1
    text: |-
      De Bloedvoorzieningsorganisatie kan in het belang van een doelmatige bloedvoorziening en met toestemming
      van Onze Minister werkzaamheden of goederen die essentieel zijn voor de uitvoering van de taken, bedoeld in
      [artikel 3, eerste lid, onder c en d][ref1], uit laten voeren door onderscheidenlijk in eigendom overdragen aan,
      één of meerdere andere rechtspersonen.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 3a.2
    text: |-
      De toestemming wordt minimaal vier maanden voor de beoogde datum waarop de werkzaamheden door een andere
      rechtspersoon worden uitgevoerd, dan wel de goederen aan een andere rechtspersoon in eigendom worden overgedragen,
      door de Bloedvoorzieningsorganisatie gezamenlijk met de andere rechtspersoon aangevraagd. Onze Minister beslist
      binnen drie maanden op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3a
  - number: 3a.3
    text: |-
      [Artikel 3, tweede lid, onder c, derde en zesde lid][ref1], is op de toestemming van overeenkomstige toepassing,
      met dien verstande dat in plaats van «aanwijzing» wordt gelezen: toestemming.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 3a.4
    text: |-
      In de beschikking waarbij de toestemming aan de Bloedvoorzieningsorganisatie en aan één of meerdere andere
      rechtspersonen als bedoeld in het eerste lid, wordt verleend, wordt per andere rechtspersoon bepaald welke van
      de bevoegdheden, bedoeld in de [artikelen 5, tweede lid][ref1], [7, derde en vierde lid][ref2], [8][ref3],
      [9, derde en vierde lid][ref4], [10, eerste en vijfde lid][ref5], en [11][ref6], ten aanzien van deze rechtspersoon
      kunnen worden uitgeoefend. Onze Minister kan deze bevoegdheden slechts uitoefenen indien dit noodzakelijk is voor
      een goede uitvoering van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0009079#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009079#Artikel9
      [ref5]: https://wetten.overheid.nl/BWBR0009079#Artikel10
      [ref6]: https://wetten.overheid.nl/BWBR0009079#Artikel11
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '7'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009079
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009079
        artikel: '9'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0009079
        artikel: '10'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0009079
        artikel: '11'
        hoofdstuk: II
  - number: 3a.5
    text: |-
      Van de bevoegdheden die ten aanzien van de Bloedvoorzieningsorganisatie kunnen worden uitgeoefend, kan geen gebruik
      worden gemaakt op zodanige wijze dat andere rechtspersonen als bedoeld in het eerste lid, worden onderworpen aan
      bevoegdheden als bedoeld in het vierde lid, waar de beschikking tot toestemming niet in voorziet.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3a
  - number: 3b.1
    text: |-
      Toestemming als bedoeld in [artikel 3a, eerste lid][ref1], wordt niet verleend indien een andere rechtspersoon als
      bedoeld in artikel 3a, eerste lid, op winst is gericht, tenzij het laten uitvoeren van deze werkzaamheden door deze
      rechtspersoon of het in eigendom overdragen van deze goederen aan deze rechtspersoon geen nadelen oplevert voor de
      bloedvoorziening en de doelmatigheid van de bloedvoorziening ten goede komt.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3a
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: 3a
        hoofdstuk: II
  - number: 3b.2
    text: |-
      De toestemming, bedoeld in [artikel 3a, eerste lid][ref1], kan indien deze is gegeven voor het uitvoeren van
      werkzaamheden die essentieel zijn voor de uitvoering van de taken, bedoeld in [artikel 3, eerste lid][ref2],
      worden ingetrokken. Artikel 3, vijfde lid, is van overeenkomstige toepassing, met dien verstande dat in plaats van
      «aanwijzing» wordt gelezen: toestemming, bedoeld in artikel 3a, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3b
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: 3a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 3c.1
    text: |-
      Onze Minister kan vanwege bijzondere omstandigheden in het belang van een doelmatige bloedvoorziening dan wel met
      oog op een algemeen belang dat buiten de bloedvoorziening ligt, op aanvraag van de Bloedvoorzieningsorganisatie met
      betrekking tot een andere activiteit dan de in [artikel 3, eerste lid][ref1], bedoelde, ontheffing verlenen van de
      regels gesteld krachtens artikel 3, vierde lid. Aan de ontheffing kunnen voorwaarden worden verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3c
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 3c.2
    text: |-
      Onze Minister beslist binnen drie maanden op de aanvraag, bedoeld in het eerste lid. Van de beschikking wordt
      mededeling gedaan in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3c
  - number: 3d.1
    text: |-
      Met uitzondering van de situaties bedoeld in [artikel 14][ref1] brengt de Bloedvoorzieningsorganisatie indien zij
      economische activiteiten verricht ten behoeve van andere rechtspersonen, die rechtspersonen ten minste de integrale
      kosten van dat product of die dienst in rekening.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel14
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '14'
        hoofdstuk: III
  - number: 3d.2
    text: |-
      [Artikel 25i, derde lid, van de Mededingingswet][ref1] is van overeenkomstige toepassing alsmede de regels die
      krachtens [artikel 25m, eerste lid, van de Mededingingswet][ref2] zijn gesteld inzake de toepassing van artikel 25i
      van de Mededingingswet.


      [ref1]: https://wetten.overheid.nl/BWBR0008691#Artikel25i
      [ref2]: https://wetten.overheid.nl/BWBR0008691#Artikel25m
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0008691
        artikel: 25i
      - id: ref2
        bwb_id: BWBR0008691
        artikel: 25m
  - number: 3d.3
    text: |-
      De Bloedvoorzieningsorganisatie gebruikt de gegevens die zij heeft verkregen bij de uitvoering van de taken,
      bedoeld in [artikel 3, eerste lid][ref1], alleen voor andere activiteiten dan bedoeld in artikel 3, eerste lid,
      indien deze gegevens onder dezelfde voorwaarden aan vergelijkbare categorieën derden beschikbaar kunnen worden
      gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3d
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 3e.1
    text: |-
      Indien de Bloedvoorzieningsorganisatie andere activiteiten dan de in [artikel 3, eerste lid][ref1], bedoelde of
      de daarbij behorende goederen wil overdragen aan een andere rechtspersoon, vraagt de Bloedvoorzieningsorganisatie
      hiervoor toestemming aan Onze Minister indien deze overdracht gevolgen heeft voor de uitvoering van de taken,
      bedoeld in artikel 3, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3e
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 3e.2
    text: |-
      Onze Minister kan de toestemming weigeren of daaraan voorwaarden verbinden indien de overdracht aantoonbaar
      nadelige gevolgen kan hebben voor de bloedvoorziening.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3e
  - number: 3e.3
    text: |-
      De toestemming wordt minimaal vier maanden voor de beoogde datum van de overdracht door de
      Bloedvoorzieningsorganisatie aangevraagd. Onze Minister beslist binnen drie maanden op de aanvraag en doet van de
      beschikking mededeling in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel3e
  - number: '4.1'
    text: Het is aan anderen dan de Bloedvoorzieningsorganisatie verboden bloed in te zamelen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel4
  - number: '4.2'
    text: Het is verboden aan een donor andere dan door hem in redelijkheid gemaakte kosten te vergoeden.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel4
  - number: '5.1'
    text: |-
      De Bloedvoorzieningsorganisatie voert de werkzaamheden betreffende het inzamelen van bloed en het bereiden van
      bloedproducten, alsmede het bewaren, verpakken, etiketteren, vervoeren en afleveren daarvan, op verantwoorde wijze
      uit. Onder verantwoord wordt in ieder geval verstaan: doeltreffend en doelmatig alsmede gericht op een zo hoog
      mogelijke kwaliteit van de bloedproducten en een zo groot mogelijke veiligheid van donor en gebruiker.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: '5.2'
    text: |-
      Onze Minister kan de Bloedvoorzieningsorganisatie omtrent het eerste lid voorschriften geven. Deze voorschriften
      kunnen onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: 5.2.a
    text: de personen die bij de uitvoering van de werkzaamheden zijn betrokken;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: 5.2.b
    text: de ruimten waarin en de middelen waarmee de werkzaamheden worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: 5.2.c
    text: het inzamelen van bloed;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: 5.2.d
    text: |-
      het bereiden van tussenproducten en bloedproducten uit het ingezamelde bloed, alsmede het bewaren, verpakken,
      etiketteren, vervoeren en afleveren daarvan;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: 5.2.e
    text: het voeren van een administratie en het verwerken van de geadministreerde gegevens.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: '5.3'
    text: De voorschriften worden in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel5
  - number: '6.1'
    text: |-
      Het uitvoeren van [artikel 5][ref1] omvat mede de systematische bewaking, beheersing en verbetering van de
      kwaliteit van de werkzaamheden en het eindproduct.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel5
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '5'
        hoofdstuk: II
  - number: '6.2'
    text: 'Ter uitvoering van het eerste lid draagt de Bloedvoorzieningsorganisatie in ieder geval zorg voor:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel6
  - number: 6.2.a
    text: |-
      het op systematische wijze verzamelen en registreren van gegevens betreffende de kwaliteit van de werkzaamheden en
      het tussen- of bloedproduct;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel6
  - number: 6.2.b
    text: |-
      het aan de hand van de gegevens, bedoeld onder *a*, op systematische wijze toetsen in hoeverre de wijze van
      uitvoering van [artikel 5][ref1] leidt tot een verantwoorde uitvoering van de werkzaamheden;


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel5
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '5'
        hoofdstuk: II
  - number: 6.2.c
    text: |-
      het op basis van de uitkomst van de toetsing, bedoeld onder *b*, zo nodig veranderen van de wijze waarop
      [artikel 5][ref1] wordt uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel5
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '5'
        hoofdstuk: II
  - number: '7.1'
    text: De Bloedvoorzieningsorganisatie dient jaarlijks een begroting en een beleidsplan in bij Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel7
  - number: '7.2'
    text: Onze Minister kan regels stellen over de inrichting en datum van indiening van de begroting en het beleidsplan.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel7
  - number: '7.3'
    text: De begroting en het beleidsplan behoeven de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel7
  - number: '7.4'
    text: |-
      Onze Minister onthoudt zijn goedkeuring aan de begroting of het beleidsplan indien deze in strijd zijn met het
      bepaalde bij of krachtens deze wet, waaronder begrepen het plan, bedoeld in [artikel 2][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel2
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '2'
        hoofdstuk: II
  - number: '8.1'
    text: |-
      De Bloedvoorzieningsorganisatie brengt jaarlijks voor 1 juli verslag uit aan Onze Minister over de vervulling
      van haar taken en de uitvoering van de werkzaamheden. Onze Minister kan regels stellen over de inrichting van het
      verslag.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel8
  - number: '8.2'
    text: |-
      Zodra de Bloedvoorzieningsorganisatie beschikt over het definitieve jaarverslag en de definitieve jaarrekening,
      stelt zij deze aan onze Minister ter beschikking.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel8
  - number: '8.3'
    text: |-
      Het tweede lid is van overeenkomstige toepassing op rechtspersonen waarover de Bloedvoorzieningsorganisatie
      overheersende invloed kan uitoefenen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel8
  - number: '9.1'
    text: |-
      De Bloedvoorzieningsorganisatie is verplicht Onze Minister de voor een goede uitvoering van deze wet door hem
      gevraagde gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel9
  - number: '9.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op een andere rechtspersoon als bedoeld in
      [artikel 3a, eerste lid][ref1], en rechtspersonen waarover de Bloedvoorzieningsorganisatie overheersende invloed
      kan uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3a
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: 3a
        hoofdstuk: II
  - number: '9.3'
    text: |-
      De Bloedvoorzieningsorganisatie is verplicht wijzigingen in de organisatie, het personeel of het materieel, die
      ingrijpende gevolgen hebben voor het vervullen van de in [het eerste lid van artikel 3][ref1] bedoelde taken, mede
      te delen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '9.4'
    text: |-
      De Bloedvoorzieningsorganisatie is verplicht Onze Minister onverwijld in kennis te stellen van elk geval
      van risico's voor het leven of de gezondheid van mensen, ontstaan of te vrezen als gevolg van gebreken aan
      bloedproducten, die van haar afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel9
  - number: '10.1'
    text: |-
      Indien Onze Minister van oordeel is dat het bepaalde bij of krachtens [de artikelen 5][ref1], [6][ref2],
      [8][ref3] of [9][ref4] niet of in onvoldoende mate of op onjuiste wijze wordt nageleefd, kan hij de
      Bloedvoorzieningsorganisatie een schriftelijke aanwijzing geven.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009079#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009079#Artikel9
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009079
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009079
        artikel: '9'
        hoofdstuk: II
  - number: '10.2'
    text: |-
      In de aanwijzing geeft Onze Minister met redenen omkleed aan op welke punten het bepaalde bij of krachtens
      [de artikelen 5][ref1], [6][ref2], [8][ref3] of [9][ref4] niet of in onvoldoende mate of op onjuiste
      wijze wordt nageleefd, de in verband daarmee te nemen maatregelen, alsmede de termijn waarbinnen de
      Bloedvoorzieningsorganisatie aan de aanwijzing moet voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0009079#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0009079#Artikel9
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '5'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0009079
        artikel: '8'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0009079
        artikel: '9'
        hoofdstuk: II
  - number: '10.3'
    text: |-
      Indien het nemen van maatregelen in verband met gevaar voor de gezondheid redelijkerwijs geen uitstel kan leiden,
      kan de ingevolge artikel 20 met het toezicht belaste ambtenaar een schriftelijk bevel geven. Het bevel heeft een
      geldigheidsduur van zeven dagen, welke door Onze Minister telkens met eenzelfde periode kan worden verlengd zolang
      naar het oordeel van Onze Minister het gevaar voor de gezondheid niet is geweken.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel10
  - number: '10.4'
    text: |-
      De Bloedvoorzieningsorganisatie is verplicht volledig en binnen de daarbij gestelde termijn aan de aanwijzing
      onderscheidenlijk onmiddellijk aan het bevel te voldoen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel10
  - number: '10.5'
    text: |-
      Indien de Bloedvoorzieningsorganisatie inzake het vierde lid in gebreke blijft, kan de Minister een bewindvoerder
      over de Bloedvoorzieningsorganisatie aanstellen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel10
  - number: '10.6'
    text: |-
      Het derde en vierde lid zijn van overeenkomstige toepassing op een andere rechtspersoon als bedoeld in
      [artikel 3a, eerste lid][ref1], voor zover het gevaar voor de gezondheid samenhangt met de werkzaamheden die
      essentieel zijn voor de uitvoering van de taken, bedoeld in [artikel 3, eerste lid][ref2], en voor zover niet
      bij of krachtens een andere wet is voorzien in de bevoegdheid tot het opleggen van een bevel ten aanzien van die
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3a
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: 3a
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '11'
    text: |-
      Indien Onze Minister van oordeel is dat de Bloedvoorzieningsorganisatie haar taken, genoemd in
      [het eerste lid van artikel 3][ref1], niet op verantwoorde wijze vervult, kan hij ter zake regels vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 11a.1
    text: |-
      Onze Minister van Defensie is bevoegd om bloedproducten en tussenproducten afgeleverd te krijgen, te bewaren,
      te verpakken, te etiketteren en te vervoeren ten behoeve van de militaire bloedvoorziening en ten behoeve van
      wetenschappelijk onderzoek in dat kader, alsmede bloedproducten en tussenproducten te bewerken ten behoeve van
      dit onderzoek.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel11a
  - number: 11a.2
    text: |-
      Onze Minister van Defensie is bevoegd om bloedproducten te bewerken tot tussenproducten met als doel deze
      producten te conserveren. Onze Minister van Defensie is tevens bevoegd om deze tussenproducten te bewerken tot
      bloedproducten.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel11a
  - number: 11a.3
    text: |-
      Onze Minister van Defensie is bevoegd om producten uit Nederland uit te voeren als deze bestemd zijn om gebruikt
      te worden in de militaire bloedvoorziening. Onze Minster van Defensie is tevens bevoegd om de eerder uitgevoerde
      producten in te voeren in Nederland.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel11a
  - number: 11a.4
    text: |-
      Onze Minister van Defensie is bevoegd om na voorafgaande toestemming van Onze Minister, bloedproducten of
      tussenproducten afgeleverd te krijgen van anderen dan de Bloedvoorzieningsorganisatie.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel11a
  - number: 11a.5
    text: |-
      Onze Minister van Defensie neemt bij het uitoefenen van de taken, bedoeld in dit artikel, de bij ministeriële
      regeling gestelde regels, ter uitvoering van besluiten van instellingen van de Europese Unie en andere besluiten
      van volkenrechtelijke organisaties, in acht.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel11a
  - number: '12.1'
    text: |-
      Het is verboden bloedproducten, niet zijnde bloedproducten die krachtens de [Geneesmiddelenwet][ref1] moeten worden
      geregistreerd, af te leveren aan anderen dan:


      [ref1]: https://wetten.overheid.nl/BWBR0021505
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0021505
  - number: 12.1.a
    text: de Bloedvoorzieningsorganisatie;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
  - number: 12.1.b
    text: |-
      een ziekenhuis dat in het bezit is van een toelatingsvergunning als bedoeld in
      [artikel 4, eerste lid, van de Wet toetreding zorgaanbieders][ref1], apothekers en
      apotheekhoudende huisartsen die in het bezit zijn van een vergunning als bedoeld in
      [artikel 61, tiende of elfde lid, van de Geneesmiddelenwet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0043797#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel61
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0043797
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '61'
  - number: 12.1.c
    text: |-
      voor zover het bloedplasma betreft, aan personen, rechtspersonen daaronder begrepen, die in het bezit zijn van een
      vergunning als bedoeld in [artikel 18, eerste lid, van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
  - number: 12.1.d
    text: rechtspersonen die producten niet gebruiken voor toediening aan de mens;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
  - number: 12.1.e
    text: door Onze Minister aangewezen andere personen, rechtspersonen daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
  - number: '12.2'
    text: Aflevering als bedoeld in het eerste lid, onder b, is uitsluitend toegestaan aan de Bloedvoorzieningsorganisatie.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
  - number: '12.3'
    text: |-
      Aflevering als bedoeld in het eerste lid, onder c, mag slechts geschieden voor zover het bloedplasma afkomstig is
      van vrijwillige donoren aan wie ten hoogste een vergoeding is gegeven als bedoeld in [artikel 4, tweede lid][ref1],
      en het bloedplasma is onderzocht op de aanwezigheid van via bloed of bloedplasma overdraagbare ziekteverwekkers, op
      een wijze die kwalitatief overeenkomt met de werkwijze zoals die in Nederland wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel4
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '4'
        hoofdstuk: II
  - number: '12.4'
    text: |-
      Onze Minister wijst slechts de personen aan, bedoeld in het eerste lid, onder e, indien naar zijn oordeel het
      belang van een in geneeskundig opzicht doelmatige voorziening in de behoefte aan bloedproducten zulks vordert
      dan wel een bijzondere omstandigheid daartoe aanleiding geeft. [Artikel 3, derde en vijfde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '13.1'
    text: 'Het is verboden tussenproducten af te leveren aan anderen dan:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel13
  - number: 13.1.a
    text: de Bloedvoorzieningsorganisatie;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel13
  - number: 13.1.b
    text: |-
      personen, rechtspersonen daaronder begrepen, die in het bezit zijn van een vergunning als bedoeld in
      [artikel 18, eerste lid, van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel18
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '18'
  - number: 13.1.c
    text: rechtspersonen die producten niet gebruiken voor toediening aan de mens;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel13
  - number: 13.1.d
    text: door Onze Minister aangewezen andere personen, rechtspersonen daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel13
  - number: '13.2'
    text: |-
      Aflevering als bedoeld in het eerste lid, onder *b*, mag slechts geschieden voorzover de tussenproducten
      zijn bereid uit plasma van vrijwillige donoren aan wie ten hoogste een vergoeding is gegeven als bedoeld
      in [artikel 4, tweede lid][ref1], en het bloed dat is gebruikt voor de bereiding ervan, is onderzocht op de
      aanwezigheid van via bloed of bloedplasma overdraagbare ziekteverwekkers, kwalitatief overeenkomende met de
      werkwijze zoals die in Nederland wordt gehanteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel4
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '4'
        hoofdstuk: II
  - number: '13.3'
    text: |-
      Onze Minister wijst slechts de personen aan, bedoeld in het eerste lid, onder d, indien naar zijn oordeel het
      belang van een doelmatige voorziening in de behoefte aan bloedproducten daardoor niet wordt geschaad, dan wel een
      bijzondere omstandigheid daartoe aanleiding geeft. [Artikel 3, derde en vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '14.1'
    text: |-
      Het is verboden de aflevering van bloedproducten en tussenproducten te laten geschieden tegen een vergoeding die
      meer bedraagt dan de kosten welke ten behoeve van het inzamelen van bloed, het bereiden of het afleveren zijn
      gemaakt.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel14
  - number: '14.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel14
  - number: 14.2.a
    text: |-
      bloedproducten waarvoor op grond van [artikel 40 van de Geneesmiddelenwet][ref1] een vergunning verplicht is voor
      het in de handel brengen;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel40
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '40'
  - number: 14.2.b
    text: |-
      bloedproducten en tussenproducten die bestemd zijn om te dienen als grondstof voor de productie van bloedproducten
      als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel14
  - number: '14.3'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor het bepalen van de minimumprijs voor bloedproducten en
      tussenproducten als bedoeld in het tweede lid, onder b, die door de Bloedvoorzieningsorganisatie zijn ingezameld.
      Hierbij kunnen voor verschillende producten verschillende regels worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel14
  - number: '14.4'
    text: |-
      Voor zover de Bloedvoorzieningsorganisatie beschikking heeft over winst die is behaald bij de aflevering van
      producten als bedoeld in het tweede lid, wordt deze winst slechts gebruikt ten behoeve van de uitvoering van de
      taken, bedoeld in het [artikel 3, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '15.1'
    text: |-
      Het is verboden bloedproducten en tussenproducten uit een derde land in te voeren zonder vergunning van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel15
  - number: '15.2'
    text: |-
      Onze Minister verleent een vergunning slechts indien naar zijn oordeel het belang van een in geneeskundig opzicht
      doelmatige voorziening in de behoefte aan bloedproducten zulks vordert dan wel een bijzondere omstandigheid daartoe
      aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel15
  - number: '15.3'
    text: |-
      Indien het in het tweede lid genoemde belang zulks vordert, onderscheidenlijk indien een bijzondere omstandigheid
      daartoe aanleiding geeft, kan Onze Minister voorschriften aan de vergunning verbinden of de vergunning onder
      beperkingen verlenen. De vergunning kan worden ingetrokken; [artikel 3, vijfde lid][ref1], is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '15.4'
    text: 'Het in het eerste lid vervatte verbod geldt niet:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel15
  - number: 15.4.a
    text: |-
      ten aanzien van een persoon die bij het overschrijden van de grens in het bezit is van een hoeveelheid van een
      bloedproduct, welke kennelijk voor eigen gebruik is bestemd;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel15
  - number: 15.4.b
    text: ten aanzien van rechtspersonen die producten niet gebruiken voor toediening aan de mens;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel15
  - number: 15.4.c
    text: |-
      ten aanzien van een product dat is bestemd om als monster te worden overgelegd bij een aanvraag tot registratie
      krachtens de [Geneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0021505
  - number: '16.1'
    text: |-
      Het is verboden bloedproducten en tussenproducten uit te voeren naar een derde land zonder vergunning van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister verleent slechts een vergunning indien naar zijn oordeel het belang van een doelmatige voorziening in
      de behoefte aan bloedproducten daardoor niet wordt geschaad.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel16
  - number: '16.3'
    text: |-
      Onze Minister kan aan de vergunning voorschriften verbinden of de vergunning onder beperkingen verlenen. De
      vergunning kan worden ingetrokken; [artikel 3, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel16
    references:
