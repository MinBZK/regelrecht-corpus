  - number: '19.2'
    text: De in het eerste lid strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel19
  - number: 19a.1
    text: |-
      Onze Minister is bevoegd een bestuurlijke boete van ten hoogste € 33 500,– op te leggen ter zake van een gedraging
      die in strijd is met [artikel 4, eerste of tweede lid][ref1], [12][ref2], [13, eerste of derde lid][ref3],
      [14][ref4], [15, eerste of derde lid][ref5], [16, eerste of derde lid][ref6], of [17, eerste lid][ref7].


