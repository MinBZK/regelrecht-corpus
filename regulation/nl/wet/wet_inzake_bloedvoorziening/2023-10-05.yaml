        hoofdstuk: II
  - number: '27'
    text: Deze wet treedt in werking met ingang van 1 januari 1998.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel27
  - number: '28'
    text: 'Deze wet wordt aangehaald als: Wet inzake bloedvoorziening.'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel28
