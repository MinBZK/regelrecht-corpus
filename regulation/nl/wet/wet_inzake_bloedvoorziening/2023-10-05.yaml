        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: '16.4'
    text: 'Het in het eerste lid vervatte verbod geldt niet ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel16
  - number: 16.4.a
