---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_inzake_bloedvoorziening
regulatory_layer: WET
publication_date: '2007-03-20'
valid_from: '2023-10-05'
bwb_id: BWBR0009079
url: https://wetten.overheid.nl/BWBR0009079/2023-10-05
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de Wet inzake bloedtransfusie te vervangen door een Wet
    inzake bloedvoorziening in verband met het instellen van één landelijke organisatie voor bloedvoorziening;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.b
    text: |-
      Bloedvoorzieningsorganisatie: de krachtens [artikel 3, eerste lid][ref1], aangewezen rechtspersoon;


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel3
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '3'
        hoofdstuk: II
  - number: 1.1.c
    text: 'rechtspersonen die producten niet gebruiken voor toediening aan de mens: rechtspersonen:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.c.1°
    text: |-
      die producten uitsluitend gebruiken ten behoeve van wetenschappelijk onderzoek, educatie of het valideren van
      diagnostische of medische hulpmiddelen,
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.c.2°
    text: die producten niet gebruiken voor toediening aan de mens, en
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.c.3°
    text: |-
      die enkel producten afleveren of afgeleverd krijgen voor zover het belang van een doelmatige voorziening in de
      behoefte aan producten daardoor niet wordt geschaad;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.d
    text: |-
      donor: persoon die een deel van zijn bloed of een bestanddeel van een deel van zijn bloed afstaat voor gebruik in
      het kader van de geneeskundige behandeling van andere personen, ten behoeve van wetenschappelijk onderzoek of ten
      behoeve van rechtspersonen die producten niet gebruiken voor toediening aan de mens;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.e
    text: |-
      inzamelen van bloed: het werven, oproepen en keuren van donoren en het bij donoren afnemen van bloed, bloedcellen
      of bloedplasma;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.f
    text: |-
      product: menselijk bloed, alsmede daaruit afgescheiden bestanddelen, waaraan al dan niet een andere substantie
      is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.g
    text: 'tussenproduct: product, niet geschikt voor toediening aan de mens;'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.h
    text: 'bloedproduct: product, geschikt voor toediening aan de mens;'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.i
    text: |-
      bloedvoorziening: het geheel van maatregelen en middelen terzake van onder meer het inzamelen van bloed en het
      bereiden en afleveren van tussenproducten en bloedproducten;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.j
    text: |-
      derde land: de staat die niet lid is van de Europese Unie of die niet partij is bij de Overeenkomst betreffende de
      Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.k
    text: |-
      overheersende invloed: de situatie waarin de Bloedvoorzieningsorganisatie al dan niet rechtstreeks ten aanzien van
      een andere rechtspersoon:
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.k.1°
    text: de meerderheid van het geplaatste kapitaal bezit;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.k.2°
    text: over de meerderheid van de stemmen beschikt die aan de door de rechtspersoon uitgegeven aandelen zijn verbonden; of
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: 1.1.k.3°
    text: |-
      meer dan de helft van de leden van het bestuurs-, leidinggevend- of toezichthoudend orgaan van het bedrijf kan
      benoemen.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: '1.2'
    text: |-
      Met een donor wordt gelijkgesteld de persoon die een deel van zijn bloed of een bestanddeel van een deel van zijn
      bloed laat afzonderen ten behoeve van de geneeskundige behandeling van zichzelf.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
  - number: '1.3'
    text: |-
      [De artikelen 4, eerste lid][ref1], [12, tweede lid][ref2], [13, eerste lid][ref3], [15, eerste lid][ref4],
      [16, eerste lid][ref5], en [17, eerste lid][ref6] en de daarop berustende bepalingen zijn niet van toepassing op
      bloed of een bestanddeel van bloed dat ofwel is afgestaan uitsluitend ten behoeve van de geneeskundige behandeling
      van een bepaalde andere persoon, ofwel is afgezonderd ten behoeve van de geneeskundige behandeling van de donor
      zelf; de genoemde artikelen zijn evenmin van toepassing op uit dat bloed bereide bloedproducten.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0009079#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0009079#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0009079#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0009079#Artikel16
      [ref6]: https://wetten.overheid.nl/BWBR0009079#Artikel17
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0009079
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0009079
        artikel: '12'
