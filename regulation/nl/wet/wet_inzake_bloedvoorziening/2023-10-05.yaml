  - number: 19a.2
    text: |-
      Onze Minister is bevoegd een last onder dwangsom op te leggen ter zake van een gedraging die in strijd is met een
      krachtens [artikel 10][ref1] gegeven aanwijzing of bevel.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel10
