  - number: 16.4.b
    text: |-
      de vereniging «Het Nederlandse Rode Kruis» voorzover de uitvoer geschiedt in het kader van de hulpverlening
      overeenkomstig de statuten van die vereniging;
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel16
  - number: 16.4.c
    text: rechtspersonen die producten niet gebruiken voor toediening aan de mens.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel16
  - number: '17.1'
    text: |-
      Het is verboden bloedproducten als bedoeld in [artikel 12, eerste lid][ref1], en tussenproducten uit te voeren naar
      een staat die lid is van de Europese Unie of die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte zonder vergunning van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0009079#Artikel12
