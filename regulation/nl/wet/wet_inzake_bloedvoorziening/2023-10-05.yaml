  - number: '18.2'
    text: |-
      Bij de houder van de aanwijzing of de vergunning, bedoeld in het eerste lid, kan jaarlijks een vergoeding in
      rekening worden gebracht.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel18
  - number: '18.3'
    text: |-
      De bedragen ter vergoeding van de kosten en de hoogte van de jaarlijkse vergoeding worden bij ministeriële regeling
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel18
  - number: '19.1'
    text: 'Hij die handelt in strijd met:'
    url: https://wetten.overheid.nl/BWBR0009079/2023-10-05#Artikel19
  - number: 19.1.a
    text: |-
      de [artikelen 4, eerste of tweede lid][ref1], [10, vierde lid][ref2], [12, eerste of tweede lid][ref3],
      [13, eerste lid][ref4], [14][ref5], [15, eerste lid][ref6], [16, eerste lid][ref7], of [17, eerste lid][ref8];


