---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: mandaatregeling_ministerie_van_justitie_2002
regulatory_layer: WET
publication_date: '2005-05-24'
valid_from: '2003-01-22'
bwb_id: BWBR0014343
url: https://wetten.overheid.nl/BWBR0014343/2003-01-22
preamble:
  text: |-
    Gelet op de artikelen 10:3 en 10:21 van de Algemene wet bestuursrecht, artikel 27, vierde lid, van de
    Comptabiliteitswet en artikel 4, eerste lid, van het Algemeen Rijksambtenarenreglement;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel1
  - number: 1.a
    text: 'bewindspersoon: de Minister van Justitie onderscheidenlijk de Minister voor Vreemdelingenbeleid en Integratie;'
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel1
  - number: 1.b
    text: 'mandaat: de bevoegdheid om in naam van de bewindspersoon besluiten te nemen;'
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel1
  - number: 1.c
    text: 'ministerie: hetgeen daaronder wordt verstaan in de Organisatieregeling Ministerie van Justitie 2002.'
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel1
  - number: '2.1'
    text: |-
      Aan de secretaris-generaal wordt mandaat verleend ten aanzien van de tot het ministerie behorende aangelegenheden
      die naar aard of inhoud niet een zodanig gewicht hebben dat zij door de bewindspersoon behoren te worden afgedaan.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: '2.2'
    text: |-
      Aan de bewindspersoon blijft voorbehouden de bevoegdheid tot het nemen van besluiten die zijn neergelegd in een
      document, gericht tot:
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: 2.2.a
    text: de Koningin;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: 2.2.b
    text: de raad van ministers van het Koninkrijk, de ministerraad of een daaruit gevormde onderraad of commissie;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: 2.2.c
    text: de voorzitter van de Eerste of Tweede Kamer der Staten-Generaal of van een uit die Kamer gevormde commissie;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: 2.2.d
    text: de vice-president van de Raad van State van het Koninkrijk of de vice-president van de Raad van State;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: 2.2.e
    text: de president van de Algemene Rekenkamer;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: 2.2.f
    text: |-
      de Nationale ombudsman, indien de strekking daarvan is dat aan een aanbeveling van de Nationale ombudsman geen
      gevolg wordt gegeven.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel2
  - number: '3.1'
    text: 'De secretaris-generaal wordt toegestaan ondermandaat te verlenen aan:'
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel3
  - number: 3.1.a
    text: een directeur-generaal;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel3
  - number: 3.1.b
    text: de plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel3
  - number: 3.1.c
    text: andere bij het ministerie werkzame ambtenaren, voorzover zij niet ressorteren onder een directeur-generaal.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel3
  - number: '3.2'
    text: Verleend ondermandaat kan steeds één hiërarchisch niveau verder worden doorgegeven.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel3
  - number: '4'
    text: |-
      De secretaris-generaal wordt aangewezen als hoofd van dienst in de zin van artikel 4, eerste lid, van het Algemeen
      Rijksambtenarenreglement ten aanzien van:
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel4
  - number: 4.a
    text: de directeuren-generaal;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel4
  - number: 4.b
    text: de plaatsvervangend secretaris-generaal;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel4
  - number: 4.c
    text: |-
      de hoofden en directeuren van de in artikel 2, onderdeel a, van de Organisatieregeling Ministerie van Justitie
      2002 genoemde dienstonderdelen die rechtstreeks ressorteren onder de secretaris-generaal, met uitzondering van de
      directeuren, bedoeld in artikel 2 van het Taak- en bevoegdheidsbesluit plv. secretaris-generaal Justitie.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel4
  - number: '5'
    text: |-
      Bij verhindering van de secretaris-generaal is de plaatsvervangend secretaris-generaal bevoegd. Indien ook deze
      verhinderd is, is een van de directeuren-generaal bevoegd, in volgorde van de datum van benoeming.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel5
  - number: '6.1'
    text: |-
      De directeuren-generaal dragen zorg voor het bijhouden van openbare registers betreffende mandaten die zijn
      verleend aan ambtenaren, werkzaam bij de onder hen ressorterende dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel6
  - number: '6.2'
    text: |-
      De directeur Personeel & Organisatie draagt zorg voor een openbaar register betreffende mandaten die zijn verleend
      aan ambtenaren, werkzaam bij de rechtstreeks onder de secretaris-generaal ressorterende dienstonderdelen.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel6
  - number: '6.3'
    text: In de registers worden de functies vermeld van de desbetreffende ambtenaren.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel6
  - number: '7.1'
    text: |-
      Voor de toepassing van deze regeling en de daarop berustende bepalingen worden met mandaat gelijkgesteld de
      verlening van:
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel7
  - number: 7.1.a
    text: volmacht om in naam van de bewindspersoon privaatrechtelijke rechtshandelingen te verrichten;
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel7
  - number: 7.1.b
    text: |-
      machtiging om in naam van de bewindspersoon handelingen te verrichten die noch een besluit, noch een
      privaatrechtelijke rechtshandeling zijn.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel7
  - number: '7.2'
    text: |-
      Voor de toepassing van artikel 3 geldt dat het doorgeven van een volmacht om privaatrechtelijke rechtshandelingen
      te verrichten slechts is toegestaan voor zover het regelmatig voorkomende rechtshandelingen betreft.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel7
  - number: '8'
    text: |-
      Vóór het tijdstip van inwerkingtreding van deze regeling genomen besluiten waarin mandaat, ondermandaat,
      volmacht of machtiging is verleend of doorgegeven aan functionarissen werkzaam bij onder een directoraat-generaal
      ressorterende directies en diensten waarin op het tijdstip van inwerkingtreding van deze regeling niet is voorzien,
      blijven van kracht voorzover zij niet strijdig zijn met het bepaalde bij of krachtens deze regeling, totdat op
      grond van deze regeling is voorzien in ondermandaat dan wel doorgifte van volmacht of machtiging of het betrokken
      besluit wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel8
  - number: '9'
    text: De Mandaatregeling Ministerie van Justitie 1997, kenmerk DDS 625191 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel9
  - number: '10'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de datum van dagtekening van de Staatscourant
      waarin zij wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel10
  - number: '11'
    text: 'Deze regeling wordt aangehaald als: Mandaatregeling Ministerie van Justitie 2002.'
    url: https://wetten.overheid.nl/BWBR0014343/2003-01-22#Artikel11
