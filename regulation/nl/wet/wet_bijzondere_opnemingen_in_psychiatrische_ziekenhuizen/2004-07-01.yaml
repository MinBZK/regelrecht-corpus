  - number: '48'
    text: |-
      1 Tenzij voortzetting van het verblijf in het psychiatrisch ziekenhuis als vrijwillig patiënt gewenst is en
      betrokkene blijk geeft van de nodige bereidheid daartoe, verleent de geneesheer-directeur een patiënt op wie
      [hoofdstuk II][ref1] toepassing heeft gevonden, ontslag uit het ziekenhuis zodra zich één van de volgende
      omstandigheden voordoet:

      a. de betrokkene niet of niet langer in zijn geestvermogens gestoord of gevaarlijk is dan wel het gevaar door
      tussenkomst van personen of instellingen buiten een psychiatrisch ziekenhuis kan worden afgewend;

      b. de geldigheidsduur van een der in hoofdstuk II, paragrafen 1 tot en met 4, bedoelde rechterlijke machtigingen
      is verstreken, tenzij voor het einde van de termijn een verzoek is gedaan tot het verlenen van een aansluitende
      rechterlijke machtiging; in dat geval verleent de geneesheer-directeur ontslag

      1°. zodra op het verzoek is beschikt en de beschikking niet strekt tot voortgezet verblijf;

      2°. zodra de termijn voor het geven van de beschikking is verstreken;

      c. door de officier geen verzoek wordt gedaan of door de rechter afwijzend wordt beschikt ter zake van een
      machtiging tot voortzetting van de inbewaringstelling ten aanzien van een met toepassing van artikel 20 in het
      ziekenhuis verblijvend persoon dan wel - indien binnen de daarvoor gestelde termijn geen beschikking is gegeven -
      zodra de termijn voor het geven van de beschikking is verstreken; of

      d. door de rechter ontslag na toepassing van [artikel 49][ref2] wordt bevolen.

      2 In afwijking van het bepaalde in het eerste lid, onder *b*, ten tweede, en onder *c*, verleent de geneesheer-
      directeur hangende het onderzoek van de rechter geen ontslag, indien de rechter de beschikking niet binnen de
      gestelde termijn heeft gegeven ten gevolge van het horen van een deskundige op verzoek van de betrokken patiënt.

      3 [Artikel 45, eerste lid, laatste volzin, tweede lid, laatste volzin en zesde lid][ref3], is van overeenkomstige
      toepassing. De geneesheer-directeur stelt tevoren de echtgenoot, de wettelijke vertegenwoordiger alsmede de naaste
      (familie)betrekkingen van de patiënt op de hoogte van het voorgenomen ontslag.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel49
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel45
