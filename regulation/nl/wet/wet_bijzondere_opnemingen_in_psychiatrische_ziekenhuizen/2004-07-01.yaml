  - number: '74'
    text: |-
      1 Machtigingen, verleend op grond van artikel 17, 23 of 24 van de wet van 27 april 1884, *Stb.* 96, tot regeling
      van het Staatstoezicht op krankzinnigen, en machtigingen, verleend op grond van de [artikelen 387][ref1] en
      [388 van Boek 1 van het Burgerlijk Wetboek][ref2], waarvan de geldigheidsduur nog niet is verstreken op het
      krachtens [artikel 80, tweede lid][ref3], vastgestelde tijdstip, worden voor de toepassing van deze wet aangemerkt
      als machtiging tot voortgezet verblijf als bedoeld in [artikel 15][ref4] van deze wet. Zij blijven tot het eind
      van hun geldigheidsduur, doch in elk geval gedurende negen weken na het krachtens [artikel 80, tweede lid][ref5],
      vastgestelde tijdstip van kracht.

      2 Inbewaringstellingen als bedoeld in artikel 35*b* van de wet van 27 april 1884, *Stb.* 96, tot regeling
      van het Staatstoezicht op krankzinnigen, die op grond van een beslissing van de rechter krachtens artikel
      35*i*, eerste lid, van die wet zijn voortgezet, en waarvan de geldigheidsduur nog niet is verstreken op
      het krachtens [artikel 80, tweede lid][ref6], vastgestelde tijdstip, worden voor de toepassing van deze wet
      aangemerkt als machtigingen tot voortzetting van de inbewaringstelling als bedoeld in hoofdstuk II, paragraaf
      3. Zij blijven tot het eind van hun geldigheidsduur, doch in elk geval gedurende twee weken na het krachtens
      [artikel 80, tweede lid][ref7], vastgestelde tijdstip van kracht.

      3 Inbewaringstellingen als bedoeld in artikel 35*b* van de wet van 27 april 1884, *Stb.* 96, tot regeling van
      het Staatstoezicht op krankzinnigen, naar aanleiding waarvan op het krachtens [artikel 80, tweede lid][ref8],
      vastgestelde tijdstip nog geen vordering als bedoeld in artikel 35*i* van die wet is ingesteld, worden aangemerkt
      als een last tot inbewaringstelling. De [artikelen 25][ref9] en [26][ref10] zijn van toepassing met dien verstande
      dat de berichtgeving door de burgemeester - voor zover zij niet reeds voor bovenbedoeld tijdstip is geschied -
      in elk geval plaatsvindt binnen de aangegeven termijnen na dit tijdstip. [Artikel 27][ref11] is van toepassing
      met dien verstande dat - indien de berichtgeving van de burgemeester voor bovenbedoeld tijdstip is geschied - het
      verzoek van de officier, bedoeld in het [eerste lid van artikel 27][ref12] in elk geval wordt gedaan binnen de
      aangegeven termijn na dit tijdstip.

      4 De behandeling van verzoekschriften en requisitoiren tot het verkrijgen van een machtiging op grond van
      artikel 17 van de wet van 27 april 1884, *Stb.* 96, tot regeling van het Staatstoezicht op krankzinnigen, en
      van vorderingen van officieren van justitie, ingesteld op grond van artikel 35*i* van die wet, waarop nog niet
      is beslist op het krachtens [artikel 80, tweede lid][ref13], vastgestelde tijdstip, wordt met toepassing van de
      genoemde wet voortgezet, met dien verstande dat de rechter

        - op vorderingen op grond van artikel 17 van die wet beschikt als ware de vordering ingesteld met toepassing van
      hoofdstuk II, § 1, van deze wet, en
        - op vorderingen op grond van artikel 35*i* van die wet beschikt als ware de vordering een verzoek in de zin van
      [artikel 27, eerste lid][ref14], van deze wet.

      5 De behandeling van verzoekschriften en requisitoiren tot het verkrijgen van een machtiging op grond
      van artikel 23 of 24 van de wet van 27 april 1884, *Stb.* 96, tot regeling van het Staatstoezicht op
      krankzinnigen, dan wel van een machtiging of een verlenging daarvan op grond van de [artikelen 387][ref15]
      en [388 van Boek 1 van het Burgelijk Wetboek][ref16], waarop nog niet is beslist op het krachtens
      [artikel 80, tweede lid][ref17], vastgestelde tijdstip, wordt niet voortgezet.

      6 Omtrent de patiënten, ten aanzien van wie ingevolge het eerste en tweede lid machtigingen en inbewaringstellingen
      van kracht blijven, worden aan de inspecteur en de officier van justitie de door Onze Minister te bepalen gegevens
      verstrekt binnen een daarbij door Onze Minister te stellen termijn.


