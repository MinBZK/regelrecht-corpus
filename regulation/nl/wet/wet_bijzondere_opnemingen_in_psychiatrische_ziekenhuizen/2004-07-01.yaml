  - number: '32'
    text: |-
      1 De rechter kan op verzoek van de officier van justitie een machtiging verlenen om een persoon die gestoord is
      in zijn geestvermogens en die bereid is deswege in een psychiatrisch ziekenhuis een behandeling te ondergaan, in
      een psychiatrisch ziekenhuis op te nemen of te doen verblijven, ook indien die bereidheid tijdens de duur van de
      machtiging komt te ontbreken.

      2 Een machtiging als bedoeld in het eerste lid kan slechts worden verleend indien naar het oordeel van de rechter

      a. de betrokkene gevaar veroorzaakt, en

      b. het gevaar niet door tussenkomst van personen of instellingen buiten een psychiatrisch ziekenhuis kan worden
      afgewend.

      3 Een machtiging als bedoeld in het eerste lid kan, behoudens in het geval, bedoeld in het vijfde lid, slechts
      worden verleend indien het verzoek door de officier van justitie is gedaan op verzoek van betrokkene.

      4 Een betrokkene als bedoeld in het derde lid, kan zijn een minderjarige, een persoon die onder curatele is
      gesteld dan wel ten behoeve van wie een mentorschap is ingesteld, indien deze tot een redelijke waardering van zijn
      belangen ter zake in staat kan worden geacht. Zodanige persoon kan hiertoe in rechte optreden.

      5 Indien betrokkene minderjarig is, onder curatele is gesteld dan wel indien ten behoeve van hem een mentorschap is
      ingesteld, kan het verzoek van betrokkene worden gedaan door zijn ouders die het gezag uitoefenen dan wel een van
      hen, zijn voogd onderscheidenlijk zijn curator of zijn mentor, doch slechts indien de betrokkene daarmee instemt.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel32
  - number: '33'
    text: |-
      1 Het verzoek van betrokkene, bedoeld in [artikel 32, derde lid][ref1], wordt schriftelijk gedaan bij de officier
      van justitie bij de volgens [artikel 7, eerste lid][ref2], bevoegde rechtbank.

      2 In het verzoek moet het psychiatrisch ziekenhuis worden genoemd, waarin opneming of verder verblijf wordt
      verzocht.

      3 Bij het verzoek moeten worden overgelegd

      a. een verklaring van een psychiater, verbonden aan het in het verzoek genoemde psychiatrisch ziekenhuis, waaruit
      blijkt dat de persoon die de plaatsing verzoekt of met wiens instemming de plaatsing wordt verzocht, gestoord is in
      zijn geestvermogens en dat het geval, bedoeld in [artikel 32, tweede lid, onder a en b][ref3], zich voordoet;

      b. een door de onder a bedoelde psychiater tezamen met betrokkene opgesteld behandelingsplan.

      4 De verklaring moet ten hoogste zeven dagen voor het verzoek zijn opgemaakt en door de psychiater zijn
      ondertekend. De verklaring is met redenen omkleed.

      5 Het behandelingsplan moet ten hoogste zeven dagen voor het verzoek zijn opgemaakt en door de psychiater en de
      betrokkene zijn ondertekend.

      6 [Artikel 6, eerste lid][ref4], is van overeenkomstige toepassing.

      7 Met betrekking tot de behandeling van het verzoekschrift door de rechter zijn de [artikelen 8][ref5], [8a][ref6]
      en [11 tot en met 14][ref7], van overeenkomstige toepassing.


