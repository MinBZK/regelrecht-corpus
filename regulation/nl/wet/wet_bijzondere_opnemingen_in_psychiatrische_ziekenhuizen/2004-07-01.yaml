        artikel: '67'
        hoofdstuk: X
  - number: '69'
    text: |-
      1 Met gevangenisstraf van ten hoogste drie jaren of geldboete van de derde categorie wordt gestraft hij, die
      opzettelijk iemand wederrechtelijk van de vrijheid berooft of beroofd houdt door deze persoon, zonder dat gebleken
      is van de nodige bereidheid daartoe, in een psychiatrisch ziekenhuis of ziekenhuis, niet zijnde een psychiatrisch
      ziekenhuis, te doen opnemen, op te nemen of diens verblijf aldaar te doen voortduren, terwijl hij weet dat de
      daarvoor benodigde bescheiden, als bedoeld in de [artikelen 53][ref1] en [54][ref2], niet zijn overgelegd of
      aanwezig zijn.

      2 In afwijking van het bepaalde in het eerste lid wordt als opzettelijk iemand wederrechtelijk van zijn vrijheid
      beroven, aangemerkt het in een zwakzinnigeninrichting of verpleeginrichting doen opnemen of opnemen, hoewel de
      betrokkene blijk heeft gegeven van verzet daartegen, terwijl de in het eerste lid bedoelde bescheiden niet zijn
      overgelegd of aanwezig zijn.

      3 Met gevangenisstraf van ten hoogste twee jaren of geldboete van de derde categorie wordt gestraft
      hij, die opzettelijk in strijd met het bepaalde bij of krachtens [artikel 38, vijfde lid][ref3], of
      [39, eerste en tweede lid][ref4], middelen of maatregelen toepast met betrekking tot een patiënt op wie
      [hoofdstuk II][ref5] dan wel [artikel 60][ref6] toepassing heeft gevonden, of die op grond van een uitspraak van
      de strafrechter als bedoeld in [artikel 37, tweede lid, van het Wetboek van Strafrecht][ref7] in een psychiatrisch
      ziekenhuis verblijft.

      4 De in dit artikel strafbaar gestelde feiten zijn misdrijven.


