  - number: '46'
    text: |-
      1 De geneesheer-directeur trekt het in [artikel 45][ref1] bedoelde verlof in, wanneer de uit de stoornis van de
      geestvermogens voortvloeiende gevaarlijkheid van betrokkene dit noodzakelijk maakt en wanneer het gevaar niet
      door tussenkomst van personen of instellingen buiten een psychiatrisch ziekenhuis kan worden afgewend. Het verlof
      kan door de geneesheer-directeur worden ingetrokken wanneer de patiënt de gestelde voorwaarden niet nakomt of op
      verzoek van de patiënt. De geneesheer-directeur pleegt overleg met de ingevolge [artikel 45, vierde lid][ref2],
      aangewezen toezichthoudende instelling of persoon. De geneesheer-directeur stelt de patiënt uiterlijk vier dagen na
      de intrekking van het verlof schriftelijk in kennis van zijn beslissing, onder mededeling van de redenen die tot de
      intrekking hebben geleid.

      2 Met betrekking tot het besluit van de geneesheer-directeur tot intrekking van het verlof staat voor betrokkene en
      voor ieder der in [artikel 4, eerste lid][ref3], bedoelde personen de mogelijkheid open de officier van justitie te
      verzoeken de beslissing van de rechter te verzoeken overeenkomstig [artikel 14e, derde en vierde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel45
