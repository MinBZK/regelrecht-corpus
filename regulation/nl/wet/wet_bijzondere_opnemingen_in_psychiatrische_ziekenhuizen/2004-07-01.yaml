      1 Bij algemene maatregel van bestuur kunnen aanvullende regels worden gegeven ter waarborging van de rechten van de
      personen op wie [hoofdstuk II][ref1] toepassing heeft gevonden.

      2 Een algemene maatregel van bestuur op grond van het eerste lid of op grond van [artikel 37, vierde lid][ref2],
      [38, derde lid, tweede volzin][ref3], [39, tweede lid][ref4], of [41, tweede lid][ref5], wordt vastgesteld op de
      voordracht van Onze Minister in overeenstemming met Onze Minister van Justitie.


