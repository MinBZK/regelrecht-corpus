        artikel: '39'
        hoofdstuk: III
  - number: '40'
    text: |-
      1 De poststukken, gericht aan of afkomstig van een patiënt op wie [hoofdstuk II][ref1] toepassing heeft gevonden,
      kunnen in aanwezigheid van de patiënt worden onderworpen aan een controle op meegezonden voorwerpen.

      2 Tenzij de bezoeker een advocaat of procureur is die als raadsman van de patiënt optreedt, dan wel een justitiële
      autoriteit, de hoofdinspecteur of de inspecteur, kunnen beperkingen in het recht op het ontvangen van bezoek
      overeenkomstig de daarvoor geldende huisregels worden opgelegd, doch slechts:

      a. indien van het bezoek ernstige nadelige gevolgen moeten worden gevreesd voor de gezondheidstoestand van de
      patiënt, voor zover dit telkenmale uit een uitdrukkelijke verklaring van de voor zijn behandeling verantwoordelijke
      persoon blijkt, dan wel

      b. indien dit ter voorkoming van verstoring van de orde in het ziekenhuis, zoals die in de huisregels is
      beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.

      3 Beperkingen in het recht op bewegingsvrijheid in en rond het ziekenhuis overeenkomstig de daarvoor geldende
      huisregels kunnen, anders dan als middel of maatregel, aangegeven bij algemene maatregel van bestuur krachtens
      [artikel 39, tweede lid][ref2], worden opgelegd:

      a. indien naar het oordeel van de voor de behandeling verantwoordelijke persoon van de uitoefening van het recht op
      de bewegingsvrijheid ernstige nadelige gevolgen moeten worden gevreesd voor de gezondheidstoestand van de patiënt,
      dan wel

      b. indien dit ter voorkoming van verstoring van de orde in het ziekenhuis, zoals die in de huisregels is
      beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.

      4 Beperkingen in het recht op vrij telefoonverkeer overeenkomstig de daarvoor geldende huisregels kunnen, tenzij
      het betreft verkeer met een advocaat of procureur die als raadsman van de patiënt optreedt, dan wel een justitiële
      autoriteit, de hoofdinspecteur of de inspecteur, worden opgelegd:

      a. indien naar het oordeel van de voor de behandeling verantwoordelijke persoon van de uitoefening van het recht op
      vrij telefoonverkeer ernstige nadelige gevolgen moeten worden gevreesd voor de gezondheidstoestand van de patiënt,
      dan wel

      b. indien dit ter voorkoming van verstoring van de orde in het ziekenhuis, zoals die in de huisregels is
      beschreven, of ter voorkoming van strafbare feiten noodzakelijk is.

      5 Van de oplegging van beperkingen overeenkomstig het tweede, derde of vierde lid wordt onverwijld mededeling
      gedaan aan de geneesheer-directeur.

      6 Ten aanzien van beslissingen als bedoeld in het tweede tot en met het vierde lid kan toepassing van
      [artikel 4:8 van de Algemene wet bestuursrecht][ref3] achterwege worden gelaten indien de patiënt op grond van de
      stoornis van zijn geestvermogens niet in staat is zijn wil te bepalen met betrekking tot de voorgenomen beslissing.
      In dat geval wordt zo mogelijk de in [artikel 38, tweede lid, tweede volzin][ref4], bedoelde persoon gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel39
