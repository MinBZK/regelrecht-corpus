  - number: 37a
    text: |-
      De geneesheer-directeur draagt er zorg voor dat voor een patiënt aantekening wordt gehouden van diens geestelijke
      en lichamelijke toestand, van de op hem toegepaste behandeling en de effecten ervan. De aantekening wordt gehouden
      op een zodanige manier en met zodanige regelmaat dat zij duidelijk inzicht geeft in het ziekteverloop.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel37a
  - number: '38'
    text: |-
      1 De geneesheer-directeur draagt zorg dat zo spoedig mogelijk na de opneming van een patiënt op wie
      [hoofdstuk II][ref1] toepassing heeft gevonden, door de voor de behandeling verantwoordelijke persoon, in overleg
      met de patiënt, een behandelingsplan wordt opgesteld. [Artikel 36, tweede lid][ref2], is van overeenkomstige
      toepassing.

      2 De voor de behandeling verantwoordelijke persoon pleegt voor het opstellen van het behandelingsplan overleg met
      de instelling of de psychiater die de patiënt voorafgaande aan zijn opneming behandelde of begeleidde, alsmede
      met de huisarts van de patiënt. Indien de behandelende persoon beslist dat de patiënt niet in staat kan worden
      geacht tot een redelijke waardering van zijn belangen ter zake van de voorgestelde behandeling, pleegt hij ter zake
      overleg met de wettelijke vertegenwoordiger van de patiënt of, indien deze ontbreekt, met de persoon die daartoe
      door de patiënt schriftelijk is gemachtigd. Ontbreekt ook zodanige persoon of treedt deze niet op, dan wordt
      overleg gepleegd met de echtgenoot van de patiënt, tenzij deze dat niet wenst, dan wel, indien ook zodanige persoon
      ontbreekt, met een ouder, kind, broer of zus van de patiënt, tenzij deze persoon dat niet wenst, een en ander voor
      zover dit overleg verenigbaar is met de zorg van een goed hulpverlener.

      3 Het behandelingsplan, bedoeld in het eerste lid, is erop gericht de stoornis zo te verbeteren dat het gevaar
      op grond waarvan de patiënt, zonder van de bereidheid daartoe te hebben blijk gegeven, in het ziekenhuis moet
      verblijven, wordt weggenomen. Bij algemene maatregel van bestuur worden eisen gesteld, waaraan een behandelingsplan
      ten minste moet voldoen. Bij algemene maatregel van bestuur kunnen voorts ten aanzien van daarbij aangegeven
      categorieën van behandelingsmiddelen of -maatregelen regels worden gegeven met betrekking tot de wijze waarop tot
      toepassing daarvan moet worden besloten.

      4 Indien het in het overleg, bedoeld in het eerste en tweede lid, niet mogelijk is overeenstemming te bereiken over
      het behandelingsplan, stelt de behandelende persoon de geneesheer-directeur hiervan in kennis.

      5 Indien het overleg over het behandelingsplan niet tot overeenstemming heeft geleid kan met betrekking tot de
      patiënt geen behandeling worden toegepast. Evenmin kan een behandeling worden toegepast indien weliswaar het
      overleg over het behandelingsplan tot overeenstemming heeft geleid doch de patiënt of, in geval van toepassing
      van de tweede volzin van het tweede lid, de met het oog op overleg aangewezen persoon of personen zich daartegen
      verzetten met dien verstande dat, ook al is de desbetreffende toestemming van die persoon of die personen
      verkregen, de behandeling niet kan worden toegepast, indien de patiënt zich daartegen verzet. In afwijking van de
      beide voorgaande volzinnen kan niettemin het voorgestelde, onderscheidenlijk het overeengekomen behandelingsplan
      worden toegepast voor zover dit volstrekt noodzakelijk is om gevaar voor de patiënt of anderen, voortvloeiende
      uit de stoornis van de geestvermogens, af te wenden. Bij algemene maatregel van bestuur kunnen categorieën van
      behandelingsmiddelen of -maatregelen worden aangewezen, die niet mogen worden toegepast bij een behandeling als
      bedoeld in de derde volzin.

      6 De geneesheer-directeur geeft uiterlijk bij het begin van een behandeling met toepassing van de derde volzin van
      het vijfde lid, daarvan kennis aan de inspecteur. Hij vermeldt daarbij ten minste welke personen verantwoordelijk
      zijn voor de beslissing tot een zodanige behandeling over te gaan en de redenen die aan de beslissing ten
      grondslag lagen. Indien de behandeling wordt toegepast terwijl de patiënt zich daartegen verzet, vermeldt de
      geneesheer-directeur tevens of de patiënt in staat kan worden geacht, gebruik te maken van de regeling, vervat in
      [artikel 41][ref3]. Hij geeft voorts zo spoedig mogelijk na het begin van een zodanige behandeling daarvan kennis
      aan de in het tweede lid, tweede volzin, bedoelde personen. Van de beëindiging van een zodanige behandeling geeft
      hij kennis aan de inspecteur.

      7 De inspecteur stelt na beëindiging van elke behandeling met toepassing van het vijfde lid, derde volzin, een
      onderzoek in of de beslissing tot een zodanige behandeling over te gaan, zorgvuldig is genomen en of de uitvoering
      van de behandeling zorgvuldig is geschied.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel41
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel38
