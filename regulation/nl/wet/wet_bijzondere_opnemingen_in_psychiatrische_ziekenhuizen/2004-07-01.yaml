  - number: '20'
    text: |-
      1 De burgemeester kan in het geval, bedoeld in het tweede lid, bij beschikking lastgeven dat een persoon die
      zich in zijn gemeente bevindt, gedurende de periode, benodigd voor de toepassing van [artikel 27][ref1], in
      bewaring wordt gesteld, indien deze persoon twaalf jaar of ouder is en geen blijk geeft van de nodige bereidheid
      zich in een psychiatrisch ziekenhuis te doen opnemen dan wel een van de andere omstandigheden, bedoeld in
      [artikel 2, derde en vierde lid][ref2], zich voordoet. De burgemeester kan de uitoefening van de bevoegdheid,
      bedoeld in de eerste volzin, delegeren aan een wethouder.

      2 De burgemeester kan slechts lastgeven tot inbewaringstelling als bedoeld in het eerste lid, indien naar zijn
      oordeel

      a. de betrokkene gevaar veroorzaakt,

      b. het ernstige vermoeden bestaat dat een stoornis van de geestvermogens de betrokkene het gevaar doet veroorzaken,

      c. het gevaar zo onmiddellijk dreigend is dat toepassing van paragraaf 1 van dit hoofdstuk niet kan worden
      afgewacht, en

      d. het gevaar niet door tussenkomst van personen of instellingen buiten een psychiatrisch ziekenhuis kan worden
      afgewend.

      3 Bij of krachtens algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in
      overeenstemming met Onze Minister van Binnenlandse Zaken, worden nadere voorschriften gegeven met betrekking tot de
      beschikking, bedoeld in het eerste lid. Een afschrift van de beschikking wordt aan betrokkene uitgereikt.

      4 Het ten uitvoer leggen van een krachtens het eerste lid gegeven beschikking draagt de burgemeester op aan een
      of meer ambtenaren, aangesteld voor de uitvoering van de politietaak, die zich voorzien van de bijstand van een of
      meer personen met kennis van de zorg voor personen die gestoord zijn in hun geestvermogens. De bedoelde ambtenaren
      kunnen daartoe elke plaats betreden waar de op te nemen persoon zich bevindt, voor zover dat redelijkerwijs voor de
      vervulling van hun taak nodig is.

      5 De door de burgemeester aangewezen personen kunnen aan de betrokkene voorwerpen ontnemen die een gevaar voor de
      veiligheid van de betrokkene of van anderen kunnen opleveren. Zij zijn bevoegd hem daartoe aan de kleding of aan
      het lichaam te onderzoeken.

      6 Zo mogelijk worden de overeenkomstig het vijfde lid ontnomen voorwerpen met de betrokkene overgebracht naar het
      psychiatrisch ziekenhuis waarin hij wordt opgenomen. In het ziekenhuis wordt de patiënt een bewijs van ontvangst
      afgegeven waarin die voorwerpen zijn omschreven. De voorwerpen worden voor de patiënt bewaard, voor zover dit niet
      in strijd is met enig wettelijk voorschrift.

      7 Bij de opneming van de betrokkene in het psychiatrisch ziekenhuis wordt door de door de burgemeester aangewezen
      personen een afschrift van de beschikking, bedoeld in het eerste lid, aan het ziekenhuis overgelegd. Tenzij
      het geval, bedoeld in [artikel 2, vierde lid][ref3], zich heeft voorgedaan, wordt daarbij tevens overgelegd een
      afschrift van de in [artikel 21][ref4] bedoelde geneeskundige verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005700#Artikel21
