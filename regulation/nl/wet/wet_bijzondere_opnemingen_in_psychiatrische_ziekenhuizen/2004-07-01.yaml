  - number: '67'
    text: |-
      1 De officieren van justitie bezoeken op onbepaalde tijden de bij gezamenlijk besluit van Onze Minister van
      Justitie en Onze Minister aangewezen psychiatrische ziekenhuizen in hun ambtsgebied om zich ervan te verzekeren
      dat niemand daarin wederrechtelijk wordt opgenomen of verblijft. Zij besteden daarbij ook aandacht aan de juiste
      uitvoering van [artikel 36, derde en vierde lid][ref1], en [artikel 40][ref2], van het bepaalde krachtens artikel
      44 en van de [hoofdstukken IV][ref3] en VI, § 1. Het [derde tot en met vijfde lid van artikel 63][ref4], voor zover
      betrekking hebbend op psychiatrische ziekenhuizen, en [artikel 64, eerste lid][ref5], zijn van overeenkomstige
      toepassing.

      2 Bij het in het eerste lid bedoelde besluit wordt de frequentie van de bezoeken van de officieren van justitie
      bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel36
