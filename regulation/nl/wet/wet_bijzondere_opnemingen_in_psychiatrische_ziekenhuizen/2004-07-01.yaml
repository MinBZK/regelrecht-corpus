  - number: '66'
    text: |-
      1 Het openbaar ministerie is belast met de tenuitvoerlegging van de krachtens deze wet gegeven rechterlijke
      beschikkingen op verzoeken, gedaan naar aanleiding van een daartoe ontvangen verzoek als bedoeld in
      [hoofdstuk II, § 1][ref1] en [2][ref2], dan wel zonder daaraan voorafgaand verzoek. Het openbaar
      ministerie is voor zover nodig voorts belast met de tenuitvoerlegging van de rechterlijke beschikkingen op
      verzoeken, gedaan op een verzoek als bedoeld in [artikel 32][ref3] en van de beslissingen, genomen krachtens
      [artikel 14d, eerste lid][ref4].

      2 Het openbaar ministerie doet de in het eerste lid bedoelde taak uitvoeren door ambtenaren, aangesteld voor de
      uitvoering van de politietaak, die zich voorzien van de bijstand van een of meer personen met kennis van de zorg
      voor personen die gestoord zijn in hun geestvermogens. De bedoelde ambtenaren kunnen daartoe elke plaats betreden
      waar de op te nemen persoon zich bevindt, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.

      3 De ambtenaren, bedoeld in het tweede lid, kunnen aan de betrokkene voorwerpen ontnemen, die een gevaar voor de
      veiligheid van betrokkene of van anderen kunnen opleveren. Zij zijn bevoegd hem daartoe aan de kleding of aan het
      lichaam te onderzoeken.

      4 Zo mogelijk worden de overeenkomstig het derde lid ontnomen voorwerpen met de betrokkene overgebracht naar het
      psychiatrisch ziekenhuis waarin hij wordt opgenomen. In het ziekenhuis wordt de patiënt een bewijs van ontvangst
      afgegeven, waarin die voorwerpen zijn omschreven. De voorwerpen worden voor de patiënt bewaard, voor zover dit niet
      in strijd is met enig wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel32
      [ref4]: https://wetten.overheid.nl/BWBR0005700#Artikel14d
