  - number: '4'
    text: |-
      1 Tot het indienen van een verzoek, gericht op het verkrijgen van een voorlopige machtiging als bedoeld in
      [artikel 2][ref1], zijn bevoegd:

      a. de echtgenoot;

      b. de ouders dan wel een van hen, voor zover zij niet van het gezag zijn ontheven of ontzet, en elke meerderjarige
      bloedverwant in de rechte lijn, niet zijnde een ouder, en in de zijlijn tot en met de tweede graad;

      c. de voogd, de curator of de mentor van de betrokkene.

      2 Het verzoek wordt schriftelijk gedaan aan de officier van justitie bij de ingevolge [artikel 7][ref2] bevoegde
      rechtbank.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel2
