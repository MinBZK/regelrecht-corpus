  - number: '3'
    text: |-
      In afwijking van het bepaalde in [artikel 2, derde lid, onder a][ref1], is voor opneming en verblijf van een
      persoon in een zwakzinnigeninrichting of verpleeginrichting de in [artikel 2][ref2] bedoelde machtiging vereist,
      indien de betrokkene blijk geeft van verzet tegen opneming of verblijf.


