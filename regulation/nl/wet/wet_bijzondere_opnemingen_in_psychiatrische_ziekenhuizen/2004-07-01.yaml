  - number: '29'
    text: |-
      1 Met betrekking tot de behandeling van de zaak door de rechter is [artikel 8, eerste, tweede en derde lid][ref1],
      van overeenkomstige toepassing.

      2 De rechter doet zich zo mogelijk voorlichten door personen uit de naaste omgeving van de betrokkene, door de arts
      die de geneeskundige verklaring, bedoeld in [artikel 21][ref2], heeft opgemaakt en door de instelling of psychiater
      die de betrokkene begeleidt. [Artikel 8, zesde lid, eerste volzin][ref3], zevende, achtste, negende en tiende lid,
      is van overeenkomstige toepassing.

      3 De rechter beslist binnen drie dagen te rekenen vanaf de dag na die van het indienen van het verzoekschrift door
      de officier van justitie. De [Algemene termijnenwet][ref4] is op de termijn, bedoeld in [de eerste volzin][ref5],
      van toepassing.

      4 [Artikel 9, tweede, derde en vierde lid][ref6], is van overeenkomstige toepassing. Indien de betrokkene op het
      tijdstip waarop het verzoekschrift tot voortzetting van de inbewaringstelling werd ingediend, nog niet in een
      psychiatrisch ziekenhuis was opgenomen, zijn de [artikelen 11][ref7] en [12, eerste lid][ref8], van overeenkomstige
      toepassing.

      5 Tegen de beschikking op een verzoek tot het verlenen van een machtiging tot voortzetting van de
      inbewaringstelling staat geen gewoon rechtsmiddel open.


