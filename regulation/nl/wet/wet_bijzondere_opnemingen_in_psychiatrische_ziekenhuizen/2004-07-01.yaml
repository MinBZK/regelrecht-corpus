  - number: 14d
    text: |-
      1 De geneesheer-directeur van het psychiatrisch ziekenhuis, bedoeld in [artikel 14a, vijfde lid][ref1], doet de
      betrokkene opnemen in een psychiatrisch ziekenhuis, indien buiten de inrichting het gevaar niet langer kan worden
      afgewend door de naleving van de voorwaarden. De geneesheer-directeur kan de betrokkene doen opnemen, wanneer
      deze de gestelde voorwaarden niet naleeft of op verzoek van de betrokkene. De opneming geschiedt niet dan nadat
      de geneesheer-directeur als bedoeld in [artikel 14a, vijfde lid][ref2], de betrokkene in de gelegenheid heeft
      gesteld om te worden gehoord en niet dan nadat hij betrokkene kort tevoren heeft onderzocht of doen onderzoeken
      door een psychiater die niet bij de behandeling betrokken was. Deze psychiater verschaft aan de behandelaar een
      schriftelijke verklaring ter zake van zijn instemming.

      2 De opneming geschiedt voor ten hoogste de termijn van de resterende geldigheidsduur van de voorwaardelijke
      machtiging, welke van de beslissing van de geneesheer-directeur af geldt als voorlopige machtiging. De geneesheer-
      directeur stelt de betrokkene uiterlijk vier dagen na zijn beslissing tot opneming daarvan schriftelijk in kennis
      onder mededeling van de redenen van de beslissing. Een afschrift van de mededeling wordt gezonden aan de officier
      van justitie bij de rechtbank die de voorwaardelijke machtiging heeft verleend.

      3 De personen, bedoeld in [artikel 4, eerste lid][ref3], kunnen de geneesheer-directeur verzoeken toepassing te
      geven aan het eerste lid.

      4 De geneesheer-directeur van het psychiatrisch ziekenhuis doet van de opneming mededeling aan de griffier van de
      rechtbank die de voorwaardelijke machtiging heeft verleend.

      5 De [artikelen 10, tweede lid][ref4], en [12, eerste lid][ref5], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel14a
