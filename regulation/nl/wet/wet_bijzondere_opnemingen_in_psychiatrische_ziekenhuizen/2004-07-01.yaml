  - number: '35'
    text: |-
      1 Indien degene ten aanzien van wie door de officier van justitie een verzoek is gedaan tot het verlenen van een
      der machtigingen als bedoeld in dit hoofdstuk, dan wel tot het geven van een beslissing inzake ontslag als bedoeld
      in [artikel 49, derde of tiende lid][ref1], nadeel heeft geleden doordat de rechter of de officier van justitie een
      der bepalingen, vervat in dit hoofdstuk of in [artikel 49][ref2], niet in acht heeft genomen, kent de rechter deze
      op verzoek van betrokkene een naar billijkheid vast te stellen schadevergoeding toe ten laste van de Staat.

      2 Het verzoek tot schadevergoeding kan worden gedaan bij een zelfstandig verzoek bij een verweerschrift als bedoeld
      in [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3], of bij een desbetreffend
      verzoekschrift ter gelegenheid van het verhoor van de betrokkene dan wel bij een afzonderlijk verzoekschrift,
      binnen drie maanden te rekenen vanaf de dag waarop de betrokkene redelijkerwijs bekend kon zijn met de schending
      van het voorschrift waarop zijn verzoek betrekking heeft, of, indien in beroep in cassatie over die schending is
      geklaagd, binnen zes weken na de dagtekening van de beschikking van de Hoge Raad.

      3 Indien het verzoek tot schadevergoeding wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van de
      betrokkene is [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref4] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel49
