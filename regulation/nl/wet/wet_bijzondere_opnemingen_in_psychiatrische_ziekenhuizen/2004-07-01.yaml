  - number: '6'
    text: |-
      1 Indien een verzoek als bedoeld in [artikel 4][ref1], is gedaan, doet de officier van justitie bij de rechter
      een verzoek tot het verlenen van een voorlopige machtiging, tenzij hij het verzoek, bedoeld in [artikel 4][ref2],
      kennelijk ongegrond acht of minder dan een jaar verstreken is sedert een vorig verzoek tot het verlenen van een
      voorlopige machtiging is afgewezen dat op dezelfde persoon betrekking had, en uit het nieuwe verzoek als bedoeld in
      [artikel 4][ref3] niet blijkt van nieuwe feiten.

      2 Indien zich naar het oordeel van de officier van justitie een geval voordoet als bedoeld in [artikel 2][ref4],
      doet hij, ook indien hij daartoe ingevolge het eerste lid niet verplicht is, bij de rechter een verzoek tot het
      verlenen van een voorlopige machtiging.

      3 Indien de beslissing van de officier van justitie inzake het doen van het verzoek betrekking heeft op een persoon
      die reeds in een psychiatrisch ziekenhuis verblijft, deelt de officier zijn beslissing schriftelijk mede aan de
      geneesheer-directeur van dat psychiatrisch ziekenhuis.

      4 Een verzoek tot het verlenen van een voorlopige machtiging ten aanzien van een persoon die reeds in een
      psychiatrisch ziekenhuis verblijft, wordt zo spoedig mogelijk gedaan, doch in elk geval binnen twee weken na de dag
      van verzending van de verklaring van de geneesheer-directeur, bedoeld in [artikel 5, eerste lid][ref5].

      5 Bij het verzoek tot het verlenen van een voorlopige machtiging worden de in [artikel 5][ref6] bedoelde bescheiden
      alsmede - indien aanwezig - het verzoek, bedoeld in [artikel 4][ref7], overgelegd.


