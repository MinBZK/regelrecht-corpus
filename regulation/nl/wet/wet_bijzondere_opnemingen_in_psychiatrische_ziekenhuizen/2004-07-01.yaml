  - number: '64'
    text: |-
      1 Een inspecteur bevindende dat een patiënt in een psychiatrisch ziekenhuis, niet zijnde een zwakzinnigeninrichting
      of verpleeginrichting, verblijft, terwijl niet is gebleken van de nodige bereidheid tot het verblijf in het
      ziekenhuis, en bij de patiëntenadministratie geen afschrift aanwezig is van een van de in de [artikelen 53][ref1]
      en [54][ref2] bedoelde bescheiden, voor deze patiënt op dat tijdstip van kracht, nodigt de geneesheer-directeur uit
      hem mee te delen op grond van welke bescheiden deze patiënt in het psychiatrisch ziekenhuis is opgenomen.

      2 Het eerste lid is van overeenkomstige toepassing indien de inspecteur bevindt dat in een zwakzinnigeninrichting
      of verpleeginrichting personen verblijven die blijk geven van verzet tegen dat verblijf, terwijl bij de
      patiëntenadministratie geen afschrift aanwezig is van een van de in de [artikelen 53][ref3] en [54][ref4] bedoelde
      bescheiden.

      3 De inspecteur geeft zo nodig de officier in wiens ambtsgebied het psychiatrisch ziekenhuis is gelegen, zo spoedig
      mogelijk kennis van de door de geneesheer-directeur verstrekte mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel54
