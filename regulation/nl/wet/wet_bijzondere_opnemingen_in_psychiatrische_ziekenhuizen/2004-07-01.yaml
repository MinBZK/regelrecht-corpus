  - number: '2'
    text: |-
      1 De rechter kan op verzoek van de officier van justitie een voorlopige machtiging verlenen om iemand die gestoord
      is in zijn geestvermogens, in een psychiatrisch ziekenhuis te doen opnemen en te doen verblijven. Indien de
      betrokkene reeds vrijwillig in een psychiatrisch ziekenhuis verblijft, strekt de machtiging er toe het verblijf te
      doen voortduren.

      2 Een machtiging als bedoeld in het eerste lid, kan slechts worden verleend indien naar het oordeel van de rechter

      a. de stoornis van de geestvermogens de betrokkene gevaar doet veroorzaken, en

      b. het gevaar niet door tussenkomst van personen of instellingen buiten een psychiatrisch ziekenhuis kan worden
      afgewend.

      3 Voor opneming en verblijf in een psychiatrisch ziekenhuis is een machtiging als bedoeld in het eerste lid
      vereist, indien ter zake daarvan

      a. de betrokkene geen blijk geeft van de nodige bereidheid en twaalf jaar of ouder is,

      b. de ouders die gezamenlijk of de ouder die alleen het gezag over de betrokkene uitoefenen, de voogd, de curator
      dan wel de mentor, van oordeel zijn dat opneming en verblijf niet moeten plaatsvinden, of

      c. de ouders die gezamenlijk het gezag over de betrokkene uitoefenen, van mening verschillen.

      4 In het geval, bedoeld in de tweede volzin van het eerste lid, is de machtiging vereist indien de daartoe met
      overeenkomstige toepassing van het derde lid bevoegde persoon of personen ervan blijk geven het vrijwillig verblijf
      in een psychiatrisch ziekenhuis te willen beëindigen, tenzij die persoon of personen te kennen geven de behandeling
      in een ander door deze persoon of personen aangewezen psychiatrisch ziekenhuis te willen doen voortzetten en dat
      ziekenhuis bereid is de betrokkene op te nemen.

      5 Met betrekking tot het in het derde lid, onder *a*, bedoelde blijk geven van de nodige bereidheid is
      [artikel 453 van Boek 1 van het Burgerlijk Wetboek][ref1] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel453
