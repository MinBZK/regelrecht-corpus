        bwb_id: BWBR0005700
        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '27'
    text: |-
      1 Indien de officier van justitie na ontvangst van de in [artikel 25, tweede lid][ref1], bedoelde bescheiden van
      oordeel is dat het gevaar, bedoeld in [artikel 20, tweede lid][ref2], zich ten aanzien van de in bewaring gestelde
      persoon voordoet, doet hij uiterlijk op de dag na de datum van ontvangst van deze stukken die niet is een zaterdag,
      zondag of algemeen erkende feestdag als bedoeld in de [Algemene termijnenwet ][ref3](*Stb.* 1964, 314), bij de
      rechter een verzoek tot het verlenen van een machtiging tot voortzetting van de inbewaringstelling van die persoon.
      De officier deelt aan de geneesheer-directeur van het psychiatrisch ziekenhuis waarin de betrokkene verblijft,
      schriftelijk mede dat het verzoekschrift is ingediend of dat hij heeft besloten geen verzoekschrift in te dienen.

      2 Bij het verzoek van de officier van justitie worden overgelegd de beschikking van de burgemeester,
      bedoeld in [artikel 20, eerste lid][ref4], en de geneeskundige verklaring, bedoeld in [artikel 21][ref5].
      [Artikel 5, vierde en vijfde lid][ref6], is van overeenkomstige toepassing.

      3 Bevoegd is de rechtbank van het arrondissement waarin het ziekenhuis waarin de patiënt is opgenomen, is gelegen.
      [Artikel 7, tweede lid][ref7], is van overeenkomstige toepassing.


