  - number: '8'
    text: |-
      1 Alvorens op het verzoek tot het verlenen van een voorlopige machtiging te beschikken, hoort de rechter degene
      ten aanzien van wie de machtiging is verzocht, tenzij de rechter vaststelt dat de betrokkene niet bereid is zich
      te doen horen. Indien de betrokkene in Nederland verblijft, maar buiten staat is zich naar de rechtbank te begeven,
      zal de rechter, door de griffier vergezeld, hem te zijner verblijfplaats horen. Indien de betrokkene reeds in
      een psychiatrisch ziekenhuis of in een ziekenhuis, niet zijnde een psychiatrisch ziekenhuis, verblijft, wordt
      de rechter, vergezeld van de griffier, door het ziekenhuis in de gelegenheid gesteld hem aldaar te horen. Indien
      de betrokkene niet in Nederland verblijft, wordt de verdere behandeling van het verzoek tot het verlenen van een
      voorlopige machtiging aangehouden totdat hij in Nederland kan worden gehoord.

      2 De betrokkene die minderjarig is, onder curatele is gesteld dan wel ten behoeve van wie een mentorschap is
      ingesteld, is bekwaam in deze procedure in rechte op te treden.

      3 De rechter geeft het bureau rechtsbijstandvoorziening last tot toevoeging van een raadsman aan de betrokkene,
      tenzij de betrokkene daartegen bedenkingen heeft. De [artikelen 38][ref1], [39][ref2], [45 tot en met 49][ref3],
      [50, eerste lid][ref4], en [51 van het Wetboek van Strafvordering][ref5] zijn van overeenkomstige toepassing.

      4 De rechter doet zich, zo mogelijk, voorlichten door:

      a. degene die het verzoek, bedoeld in [artikel 4][ref6], heeft ingediend;

      b. de echtgenoot;

      c. degene door wie de betrokkene wordt verzorgd;

      d. de ouders van de betrokkene die het gezag uitoefenen;

      e. de voogd, de curator of de mentor van de betrokkene;

      f. de instelling of psychiater die de betrokkene behandelt of begeleidt;

      g. degene die de verklaring, bedoeld in [artikel 5][ref7], heeft afgegeven.

      5 De rechter kan zich doen voorlichten door een of meer van de in [artikel 4][ref8] bedoelde bloedverwanten die het
      verzoek niet hebben ingediend.

      6 De rechter kan onderzoek door deskundigen bevelen en is bevoegd deze deskundigen alsmede getuigen op te roepen.
      De rechter roept de door de betrokkene opgegeven deskundigen en getuigen op, tenzij hij van oordeel is dat door
      het achterwege blijven daarvan de betrokkene redelijkerwijs niet in zijn belangen kan zijn geschaad. Indien hij een
      opgegeven deskundige of getuige niet heeft opgeroepen, vermeldt hij de reden daarvan in de beschikking.

      7 Indien de rechter dit gewenst oordeelt, kan hij de personen, bedoeld in het vierde lid, onder *a* en *g*
      verplichten te verschijnen.

      8 Indien de rechter zich doet voorlichten door een of meer der personen, bedoeld in het vierde, vijfde en zesde
      lid, buiten tegenwoordigheid van de betrokkene, wordt de zakelijke inhoud van de verstrekte inlichtingen aan de
      betrokkene medegedeeld.

      9 De betrokkene of zijn raadsman wordt in de gelegenheid gesteld zijn zienswijze kenbaar te maken naar aanleiding
      van de mededelingen en verklaringen van de personen, bedoeld in het vierde, vijfde en zesde lid.

      10 Kosten van getuigen en deskundigen in verband met de toepassing van het zesde lid, komen ten laste van 's Rijks
      kas.


