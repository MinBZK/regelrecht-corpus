    text: |-
      1 Met geldboete van de tweede categorie wordt gestraft hij, die

        - in strijd handelt met het bepaalde bij of krachtens [artikel 3][ref1];
        - niet voldoet aan een ingevolge [artikel 10, tweede lid][ref2], opgelegde verplichting;
        - geen gevolg geeft aan een beschikking van de rechter, houdende een bevel tot het verschaffen van een verklaring
      als bedoeld in [artikel 14g, eerste lid][ref3];
        - niet voldoet aan een ingevolge [artikel 24][ref4] opgelegde verplichting;
        - in strijd handelt met het bepaalde bij of krachtens [artikel 37][ref5],
      [38, eerste of tweede lid, derde lid, vierde volzin, of zesde lid][ref6], [39, derde lid][ref7], [57][ref8] of
      [63, derde, vierde of vijfde lid][ref9];
        - in strijd handelt met het bepaalde krachtens [artikel 44, eerste lid][ref10] of [56, vierde lid][ref11], voor
      zover zulks in de algemene maatregel van bestuur krachtens die artikelleden wordt bepaald;
        - voorwaarden aan verlof of voorwaardelijk ontslag verbindt in strijd met het bepaalde bij of krachtens
      [artikel 45, derde lid][ref12], en [artikel 47, tweede lid][ref13], juncto [artikel 45, derde lid][ref14];
        - geen gevolg geeft aan een beschikking van de rechter, houdende een beslissing als bedoeld
      in [artikel 41, zevende lid][ref15], [46, tweede lid][ref16], [47, derde lid][ref17], of
      [49, derde of tiende lid][ref18].

      2 De in dit artikel strafbaar gestelde feiten zijn overtredingen.


