  - number: '50'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in
      overeenstemming met Onze Minister van Justitie, kunnen nadere regels worden gegeven met betrekking tot het in dit
      hoofdstuk bepaalde.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel50
  - number: '51'
    text: |-
      1 De [artikelen 10, tweede lid][ref1], [15][ref2] tot en met [18][ref3], [36 tot en met 50][ref4]
      en [56 tot en met 58][ref5] zijn, onverminderd het bepaalde in het tweede lid, van overeenkomstige
      toepassing met betrekking tot personen die op grond van een uitspraak van de strafrechter als bedoeld in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref6] in een psychiatrisch ziekenhuis verblijven.

      2 Met betrekking tot degenen die op grond van deze wet in een psychiatrisch ziekenhuis verblijven, zijn, indien
      zij tevens ter beschikking zijn gesteld met bevel tot verpleging van overheidswege, de [artikelen 47][ref7],
      [48][ref8] en [49][ref9] niet van toepassing en wordt [artikel 45][ref10] met dien verstande toegepast dat verlof
      door de geneesheer-directeur slechts wordt verleend in overeenstemming met Onze Minister van Justitie. Met het oog
      op de tenuitvoerlegging van het bevel tot verpleging van overheidswege kan de geneesheer-directeur het verblijf
      in het psychiatrisch ziekenhuis, bedoeld in dit lid en het eerste lid, na overleg met Onze Minister van Justitie,
      beëindigen. Het voorgaande is van overeenkomstige toepassing op degenen die op grond van deze wet en tevens met
      toepassing van [artikel 15, vijfde lid, van de Penitentiaire beginselenwet][ref11] in een psychiatrisch ziekenhuis
      verblijven.

      3 De [artikelen 36 tot en met 41][ref12], [44][ref13], [56][ref14], [57][ref15] en [58][ref16] zijn van
      overeenkomstige toepassing met betrekking tot personen die ter beschikking zijn gesteld met bevel tot verpleging
      van overheidswege en met betrekking tot personen aan wie de maatregel van plaatsing in een inrichting voor
      jeugdigen is opgelegd, indien die verpleging dan wel de tenuitvoerlegging van die maatregel plaatsvindt in een
      psychiatrisch ziekenhuis, niet zijnde een justitiële inrichting voor verpleging van ter beschikking gestelden als
      bedoeld in [artikel 90, quinquies, tweede lid, van het Wetboek van Strafrecht][ref17].


