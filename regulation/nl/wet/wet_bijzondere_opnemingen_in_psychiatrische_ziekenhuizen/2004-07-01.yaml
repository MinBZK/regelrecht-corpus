  - number: '57'
    text: |-
      De geneesheer-directeur draagt, met het oog op het in het kader van deze wet uit te oefenen toezicht, zorg dat van
      elke toepassing van een middel of maatregel, aangewezen krachtens [artikel 39, tweede lid][ref1], en van de redenen
      die daartoe hebben geleid, aantekening wordt gehouden in een register, ingericht naar een door Onze Minister vast
      te stellen model.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel39
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel57
