        artikel: '39'
        hoofdstuk: III
  - number: '58'
    text: |-
      1 De geneesheer-directeur doet eens per maand, met het oog op zijn bevoegdheden in het kader van deze wet aan de
      inspecteur en aan de officier van justitie, in wier ambtsgebied het ziekenhuis is gelegen, opgave van de namen
      der patiënten,

        - die zijn opgenomen, onder mededeling van de daarbij overgelegde bescheiden, als bedoeld in [artikel 53][ref1];
        - aan wie verlof voor langer dan 60 uren of voorwaardelijk ontslag is verleend op grond van de [artikelen 45][ref2]
      of [47, eerste lid, onder][ref3] mededeling van de daaraan verbonden voorschriften onderscheidenlijk voorwaarden;
        - wier verlof of voorwaardelijk ontslag is ingetrokken op grond van [artikel 46][ref4] of [47, derde lid][ref5];
        - aan wie ontslag is verleend op grond van [artikel 48][ref6];
        - die zijn gestorven, onder mededeling van de doodsoorzaak.

      2 De geneesheer-directeur zendt voorts eens per maand aan de inspecteur, in wiens ambtsgebied het ziekenhuis is
      gelegen, een afschrift van de in het register, bedoeld in [artikel 57][ref7], in de voorafgaande maand ingeschreven
      middelen en maatregelen.

      3 De geneesheer-directeur zendt tevens eens per maand met betrekking tot met toepassing van § 3 van hoofdstuk II
      opgenomen patiënten wier inbewaringstelling in de desbetreffende maand is beëindigd, aan de inspecteur een kort
      verslag, houdende de bevindingen van de behandelende persoon gedurende de periode van de inbewaringstelling.

      4 Indien een met toepassing van [hoofdstuk II][ref8] opgenomen patiënt of een patiënt als bedoeld in
      [artikel 51][ref9] afwezig is zonder dat hem verlof of voorwaardelijk ontslag is verleend, wordt daarvan
      onverwijld mededeling gedaan aan de inspecteur en de officier van justitie. De officier van justitie verleent zo
      nodig medewerking in het belang van een zo spoedig mogelijk terugbrengen van de patiënt naar het psychiatrisch
      ziekenhuis. Van de terugkeer van een patiënt na ongeoorloofde afwezigheid wordt eveneens onverwijld mededeling
      gedaan aan de inspecteur en de officier van justitie.

      5 Bij of krachtens algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in
      overeenstemming met Onze Minister van Justitie, kunnen nadere voorschriften worden gegeven ten aanzien van het in
      het eerste en vierde lid bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel53
