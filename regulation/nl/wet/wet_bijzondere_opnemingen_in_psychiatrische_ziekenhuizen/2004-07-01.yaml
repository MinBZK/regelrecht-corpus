  - number: '68'
    text: |-
      De officieren van justitie leggen hun bevindingen tijdens de bezoeken, bedoeld in [artikel 67, eerste lid][ref1],
      vast in een jaarlijks verslag. Zij zenden deze verslagen aan Onze Minister van Justitie aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel67
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel68
