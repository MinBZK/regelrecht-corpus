  - number: '49'
    text: |-
      1 Een met toepassing van [hoofdstuk II, §§ 1 tot en met 4][ref1], in een psychiatrisch ziekenhuis verblijvende
      patiënt, ieder der in [artikel 4, eerste lid][ref2], bedoelde personen alsmede de inspecteur en de officier van
      justitie, in wier ambtsgebied het psychiatrisch ziekenhuis is gelegen, kan aan de geneesheer-directeur van het
      psychiatrisch ziekenhuis het voorwaardelijk ontslag of het ontslag van de patiënt uit het ziekenhuis verzoeken.

      2 De geneesheer-directeur beslist op het verzoek met inachtneming van [artikel 47][ref3], onderscheidenlijk
      [artikel 48][ref4]. De beslissing wordt aan de inspecteur medegedeeld. Voor de toepassing van het derde en het
      tiende lid wordt met een afwijzende beslissing van de geneesheer-directeur gelijk gesteld het niet beslissen binnen
      twee weken na ontvangst van het verzoek.

      3 In geval van een afwijzende beslissing kan degene die de beslissing heeft verkregen, zo deze niet is de officier
      van justitie, de officier van justitie verzoeken de beslissing van de rechter te verzoeken. Het verzoek aan de
      officier van justitie wordt schriftelijk gedaan; bij het verzoek wordt gevoegd afschrift van het oorspronkelijk
      verzoek alsmede van de beslissing van de geneesheer-directeur.

      4 De inspecteur geeft desgevraagd of eigener beweging aan de officier van justitie schriftelijk zijn oordeel over
      het ontslagverzoek.

      5 Onverminderd het bepaalde in het zesde lid verzoekt de officier van justitie na ontvangst van het in het
      derde lid bedoelde verzoek met de bijbehorende stukken zo spoedig mogelijk de beslissing van de rechter. Aan de
      verzoeker wordt schriftelijk medegedeeld of het in de eerste volzin bedoelde verzoek door de officier van justitie
      is ingesteld.

      6 De officier van justitie behoeft geen gevolg te geven aan het in het derde lid bedoelde verzoek indien hij de
      verzoeker kennelijk niet ontvankelijk acht dan wel indien tijdens de vier maanden, voorafgaande aan het verzoek,
      reeds een verzoek door hem is ingediend bij de rechter en uit het nieuwe verzoek aan de officier van justitie niet
      blijkt van nieuwe feiten.

      7 Indien het verzoek aan de officier van justitie, bedoeld in het derde lid, afkomstig is van een ander dan de
      betrokken patiënt, hoort de officier van justitie de patiënt. Indien de patiënt bezwaar heeft tegen het uitlokken
      van een rechterlijke uitspraak over zijn ontslag uit het ziekenhuis, behoeft de officier van justitie evenmin
      gevolg te geven aan het verzoek.

      8 Een door de officier van justitie ingesteld verzoek om de beslissing van de rechter als bedoeld in het derde lid
      vervalt wanneer met betrekking tot dezelfde patiënt door de officier van justitie een verzoek tot het verlenen van
      een machtiging tot voortgezet verblijf wordt gedaan.

      9 [Artikel 8][ref5] is van overeenkomstige toepassing met dien verstande dat het verzoek,
      indien dit afkomstig is van de patiënt, wordt behandeld door de meervoudige kamer van
      arrondissementsrechtbank.[ Artikel 9, eerste lid, tweede volzin, en vijfde lid][ref6], is van overeenkomstige
      toepassing. De griffier zendt zo spoedig mogelijk een afschrift van de beschikking aan de verzoeker, de patiënt, zo
      deze niet is de verzoeker, de geneesheer-directeur en aan de inspecteur.

      10 Indien een beschikking tot ontslag onder voorwaarden wordt genomen, is
      [artikel 45, eerste lid, tweede volzin, derde, vierde en vijfde lid][ref7], van overeenkomstige toepassing.

      11 In geval van een afwijzende beslissing op een door de officier van justitie gedaan verzoek als bedoeld in
      het eerste lid, kan de officier van justitie bij de rechter een verzoek doen tot het bevelen van ontslag onder
      voorwaarden dan wel ontslag. Het negende en tiende lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel4
