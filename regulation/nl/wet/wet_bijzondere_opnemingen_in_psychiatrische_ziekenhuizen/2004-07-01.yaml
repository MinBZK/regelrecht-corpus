  - number: '13'
    text: |-
      Aan de geneesheer-directeur en aan de voor de behandeling verantwoordelijke persoon geeft de griffier desgevraagd
      nadere inlichtingen omtrent hetgeen de rechter bij de behandeling van het verzoek tot het verlenen van een
      voorlopige machtiging tot voorlichting heeft gediend.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel13
  - number: '14'
    text: |-
      Bij of krachtens algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in
      overeenstemming met Onze Minister van Justitie, worden nadere voorschriften gegeven met betrekking tot
      het verzoekschrift, bedoeld in [artikel 4][ref1], en de verklaringen, bedoeld in [artikel 5][ref2] en
      [artikel 14a, vierde lid][ref3].


