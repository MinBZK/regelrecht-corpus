  - number: '42'
    text: |-
      De inspecteur, bevindend dat een patiënt die zich tegen de toepassing van een behandeling verzet, niet in
      staat kan worden geacht gebruik te maken van de regeling, vervat in [artikel 41][ref1], kan een verzoekschrift
      indienen ter verkrijging van de beslissing van de rechter over de noodzaak de behandeling waartegen de
      patiënt zich verzet, toe te passen. Hij doet in zijn verzoekschrift gemotiveerd van zijn zienswijze blijken.
      [Artikel 41, twaalfde lid, eerste volzin, veertiende en vijftiende lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel41
