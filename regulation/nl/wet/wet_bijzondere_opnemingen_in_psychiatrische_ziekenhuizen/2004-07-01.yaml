  - number: 14f
    text: |-
      [Artikel 14d, eerste lid][ref1], vindt geen toepassing indien:

      a. de in [artikel 14g, eerste lid][ref2], bedoelde verklaring, al dan niet na toepassing van
      [artikel 14g, vierde lid][ref3], is verschaft;

      b. de geldigheidsduur van de voorwaardelijke machtiging is verstreken, tenzij voor het einde van de termijn een
      verzoekschrift is ingediend tot het verlenen van een aansluitende machtiging, zolang niet op dat verzoekschrift
      afwijzend is beschikt en zolang de termijn voor het geven van de beschikking niet is verstreken;

      c. ten aanzien van betrokkene een inbewaringstelling is gelast.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel14d
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel14g
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel14g
