  - number: '37'
    text: |-
      1 Het bestuur van het ziekenhuis draagt ervoor zorg dat een patiënt op wie [hoofdstuk II][ref1] toepassing
      heeft gevonden, de echtgenoot, de wettelijke vertegenwoordiger alsmede de naaste (familie)betrekkingen van de
      patiënt zo spoedig mogelijk na zijn opneming in het bezit worden gesteld van een schriftelijk overzicht van de
      in het ziekenhuis geldende huisregels alsmede van de op grond van deze wet aan de patiënt toekomende rechten.
      In het overzicht, bedoeld in de vorige volzin, is opgenomen het adres waaronder het bestuur van het ziekenhuis
      bereikbaar is voor klachten als bedoeld in [artikel 41, eerste lid][ref2]. Tevens wordt de patiënt schriftelijk
      medegedeeld dat zijn behandelingsgegevens worden opgenomen in een voor hem aan te leggen patiëntendossier.
      [Artikel 36, tweede lid][ref3], is van overeenkomstige toepassing.

      2 Indien ten aanzien van een reeds in een psychiatrisch ziekenhuis verblijvende patiënt hoofdstuk II, par. 3,
      toepassing heeft gevonden, draagt het bestuur van het ziekenhuis ervoor zorg dat de betrokkene, de echtgenoot,
      de wettelijke vertegenwoordiger alsmede zijn naaste (familie)betrekkingen zo spoedig mogelijk na het geven van de
      last door de burgemeester onderscheidenlijk na zijn opneming in het bezit worden gesteld van een afschrift van de
      beschikking van de burgemeester.

      3 De voor de behandeling verantwoordelijke persoon draagt zorg dat de patiënt een mondelinge toelichting terzake
      ontvangt.

      4 Bij algemene maatregel van bestuur worden nadere regels gegeven met betrekking tot het in het eerste lid
      bepaalde. Daartoe behoren in elk geval eisen waaraan de in dat lid bedoelde huisregels en het in dat lid bedoelde
      patiëntendossier ten minste moeten voldoen.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel36
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel37
