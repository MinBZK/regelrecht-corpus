  - number: '41'
    text: |-
      1 De patiënt, elke andere in het ziekenhuis verblijvende patiënt en ieder der in
      [artikel 4, eerste lid][ref1], bedoelde personen kan tegen een beslissing als bedoeld in
      [artikel 38, tweede lid, tweede volzin, en vijfde lid, derde volzin][ref2] en de [artikelen 39][ref3] en
      [40][ref4], alsmede tegen niet-toepassing van het overeengekomen behandelingsplan een schriftelijke klacht indienen
      bij het bestuur van het psychiatrisch ziekenhuis.

      2 Het bestuur van een ziekenhuis belast een commissie met de behandeling van en de beslissing op klachten
      als bedoeld in het eerste lid. Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de
      samenstelling van de commissies en met betrekking tot de wijze waarop klachten worden behandeld.

      3 Het adres waar een klacht moet worden ingediend, wordt door de zorg van de geneesheer-directeur door bevestiging
      van een schriftelijke mededeling dienaangaande op de daarvoor in aanmerking komende plaatsen in het ziekenhuis
      bekendgemaakt.

      4 De commissie kan de beslissing waartegen de klacht is gericht, schorsen.

      5 Een klacht kan buiten behandeling worden gelaten, indien een gelijke klacht nog in behandeling is.

      6 De commissie geeft binnen twee weken na ontvangst van de klacht of, indien het betreft een klacht tegen een
      beslissing die ten tijde van de indiening geen gevolg meer heeft of waaraan in de tijd dat de klacht bij de
      commissie aanhangig is het gevolg is komen te vervallen, binnen vier weken na ontvangst van de klacht, van zijn
      met redenen omklede beslissing op de klacht of van het niet in behandeling nemen daarvan op grond van het bepaalde
      in het vijfde lid, kennis aan de klager, de betrokken patiënt, de behandelende persoon, de geneesheer-directeur en
      de inspecteur.

      7 Indien de commissie niet tijdig een beslissing heeft genomen of indien de beslissing van de commissie niet
      inhoudt dat de klacht gegrond is, kan de klager de inspecteur schriftelijk vragen een verzoekschrift in te dienen
      ter verkrijging van de beslissing van de rechter over de klacht. De klager voegt bij dit verzoek afschrift van de
      klacht en van de beslissing van de commissie of van de mededeling dat de klacht niet in behandeling is genomen.

      8 De inspecteur behoeft geen gevolg te geven aan het verzoek, indien hij de klager kennelijk niet ontvankelijk
      acht. In andere gevallen is hij verplicht binnen twee weken een verzoekschrift in te dienen, waarin de beslissing
      van de rechter over de klacht wordt gevraagd.

      9 Indien het verzoek afkomstig is van een ander dan de betrokken patiënt, hoort de inspecteur de patiënt om vast
      te stellen of deze bezwaar heeft tegen het uitlokken van een rechterlijke uitspraak over de klacht. De inspecteur
      kan slechts om gewichtige redenen besluiten aan het verzoek gevolg te geven, indien de patiënt hiertegen bezwaar
      gevoelt.

      10 Indien de inspecteur gevolg geeft aan het verzoek, doet hij in zijn verzoekschrift ten behoeve van de rechter
      met redenen omkleed van zijn zienswijze blijken.

      11 Indien de patiënt de klager is, kan hij, onverminderd zijn bevoegdheid toepassing te geven aan het zevende lid,
      in de gevallen, bedoeld in de eerste volzin van het zevende lid, zelf een verzoekschrift bij de rechter indienen
      ter verkrijging van diens beslissing over de klacht. De tweede volzin van het zevende lid is van overeenkomstige
      toepassing.

      12 [Artikel 8 met uitzondering van het derde lid][ref5] is met betrekking tot de behandeling van een verzoekschrift
      als bedoeld in het achtste of elfde lid, van overeenkomstige toepassing. Indien niet blijkt dat de klager reeds een
      raadsman heeft, kan uitsluitend de rechter aan het bureau rechtsbijstandvoorziening last geven tot toevoeging van
      een raadsman.

      13 Indien de rechter de klacht kennelijk ongegrond acht, kan hij zonder behandeling ter terechtzitting onmiddellijk
      op het verzoekschrift beschikken.

      14 De rechter beslist binnen vier weken na het indienen van het verzoekschrift. Tegen de beslissing van de rechter
      staat geen gewoon rechtsmiddel open.

      15 De griffier zendt zo spoedig mogelijk een afschrift van de beschikking aan de klager, de patiënt, zo deze niet
      is de klager, de raadsman van de patiënt, de behandelende persoon, de geneesheer-directeur, het bestuur en aan
      de inspecteur.

      16 Ten aanzien van een klacht als bedoeld in het eerste lid zijn de [hoofdstukken 6][ref6]
      en[ 7 van de Algemene wet bestuursrecht][ref7] niet van toepassing.


