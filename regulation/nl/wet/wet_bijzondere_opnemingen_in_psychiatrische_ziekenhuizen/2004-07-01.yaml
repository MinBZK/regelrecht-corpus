  - number: '16'
    text: |-
      1 Bij een verzoek van een persoon als bedoeld in [artikel 4][ref1], gericht op het verkrijgen van een machtiging
      tot voortgezet verblijf, moet worden overgelegd een verklaring van de geneesheer-directeur van het psychiatrisch
      ziekenhuis waarin de betrokkene is opgenomen. Uit de verklaring dient te blijken dat het geval, bedoeld in
      [artikel 15][ref2], zich voordoet.

      2 Met betrekking tot de verklaring van de geneesheer-directeur zijn de
      [artikelen 5, eerste lid, tweede volzin][ref3], [5, derde lid, derde volzin][ref4] en [14][ref5] van
      overeenkomstige toepassing.

      3 Met betrekking tot het verzoek van de officier van justitie is [artikel 6, eerste, tweede en derde lid][ref6],
      van overeenkomstige toepassing.

      4 Bij het verzoek van de officier van justitie moet worden overgelegd de verklaring, bedoeld in het eerste
      lid. Bij die verklaring is een afschrift gevoegd van de in [artikel 37a][ref7] bedoelde aantekeningen en van
      het in [artikel 38][ref8] bedoelde behandelingsplan. Indien het behandelingsplan nog niet tot stand is gekomen
      wordt daarvan bij de verklaring mededeling gedaan, onder vermelding van de daarvoor bestaande redenen. Indien
      [artikel 38, vijfde lid, derde volzin][ref9], toepassing heeft gevonden wordt daarvan, onder vermelding van de
      redenen, bij de verklaring mededeling gedaan.

      5 Bevoegd is de rechtbank van het arrondissement waarin het ziekenhuis waarin de patiënt is opgenomen, is gelegen.
      [Artikel 7, tweede lid][ref10], is van overeenkomstige toepassing.


