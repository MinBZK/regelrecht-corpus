  - number: '75'
    text: |-
      1 De bevoegdheid van de provisionele bewindvoerder, benoemd met toepassing van artikel 33 van de wet van 27 april
      1884, *Stb.* 96, tot regeling van het Staatstoezicht op krankzinnigen, eindigt na verloop van zes maanden na het in
      [artikel 80, eerste lid][ref1], vermelde tijdstip, tenzij

      a. binnen die termijn een beschikking waarbij met betrekking tot de patiënt een curatele
      is uitgesproken, een bewind als bedoeld in titel 19 of een mentorschap als bedoeld in
      [titel 20 van Boek 1 van het Burgelijk Wetboek][ref2] is ingesteld, onherroepelijk is geworden;

      b. binnen die termijn aan de patiënt ontslag wordt verleend uit het psychiatrisch ziekenhuis;

      c. een verzoek of vordering tot ondercuratelestelling, tot onderbewindstelling als bedoeld in titel 19, of tot
      instelling van een mentorschap als bedoeld in [titel 20 van Boek 1 van het Burgelijk Wetboek][ref3] is gedaan en
      daarop binnen die termijn niet onherroepelijk is beslist.

      2 In de gevallen, bedoeld in het eerste lid, onder *a* en *b*, eindigt de bevoegdheid op de daar bedoelde
      tijdstippen.

      3 In het geval, bedoeld in het eerste lid, onder *c*, eindigt de bevoegdheid op het tijdstip van het onherroepelijk
      worden van de op dat verzoek of op die vordering gegeven beschikking.

      4 Met betrekking tot het uit artikel 32 van de wet van 27 april 1884, *Stb.* 96, tot regeling van het
      Staatstoezicht op krankzinnigen, voortvloeiende verlies van het beheer van de eigen goederen is het in de
      voorgaande leden bepaalde van overeenkomstige toepassing.

      5 De patiënt die op grond van artikel 32 van de wet van 27 april 1884, *Stb.* 96, tot regeling van het
      Staatstoezicht op krankzinnigen, het beheer over de goederen van anderen heeft verloren, herkrijgt dit beheer niet
      door de inwerkingtreding van [artikel 73, eerste lid][ref4], van deze wet.


