  - number: '30'
    text: |-
      De machtiging tot voortzetting van de inbewaringstelling heeft een geldigheidsduur van drie weken na haar
      dagtekening, onverminderd het bepaalde in de [artikelen 48][ref1] en [49][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel48
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel49
