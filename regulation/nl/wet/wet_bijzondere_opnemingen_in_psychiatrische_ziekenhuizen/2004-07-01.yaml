  - number: '28'
    text: |-
      1 Degene ten aanzien van wie een last is gegeven tot inbewaringstelling, kan de rechter verzoeken een
      schadevergoeding toe te kennen op de grond dat de door de burgemeester gegeven last onrechtmatig was.

      2 Het verzoek kan worden ingediend als zelfstandig verzoek bij een verweerschrift als bedoeld in
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1], of bij een desbetreffend
      verzoekschrift ter gelegenheid van zijn verhoor, dan wel, indien de officier van justitie geen verzoek als
      bedoeld in [artikel 27, eerste lid][ref2], doet, binnen zes weken nadat de last is gegeven, bij een afzonderlijk
      verzoekschrift.

      3 Indien het verzoek wordt ingediend bij verzoekschrift ter gelegenheid van het verhoor van de betrokkene is
      [artikel 282, vierde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel282
