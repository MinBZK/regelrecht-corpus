  - number: '24'
    text: |-
      Indien binnen 24 uur na het tijdstip waarop de beschikking van de burgemeester is gegeven, door de daarvoor in
      aanmerking komende psychiatrische ziekenhuizen nog niet tot opneming is overgegaan, kan de burgemeester na overleg
      met de inspecteur in wiens ambtsgebied zijn gemeente is gelegen, een van de bovenbedoelde ziekenhuizen bevelen de
      betrokkene op te nemen. Het betrokken ziekenhuis is verplicht de betrokkene op te nemen.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel24
  - number: '25'
    text: |-
      1 De burgemeester draagt zorg dat onverwijld de inspecteur en de officier van justitie, in wier ambtsgebied zijn
      gemeente is gelegen, van de inbewaringstelling telefonisch of mondeling op de hoogte worden gesteld. Indien het
      ziekenhuis waarin de betrokkene zich ten tijde van de mededeling bevindt, is gelegen buiten het ambtsgebied van
      de inspecteur en de officier van justitie die op grond van de eerste volzin door de burgemeester op de hoogte
      moeten worden gesteld, worden ook de inspecteur en de officier van justitie, in wier ambtsgebied het ziekenhuis is
      gelegen, overeenkomstig het in de eerste volzin bepaalde op de hoogte gesteld.

      2 Zo spoedig mogelijk nadat de beschikking is gegeven, doch in elk geval niet later dan de volgende dag, die niet
      is een zaterdag, zondag of algemeen erkende feestdag als bedoeld in de Algemene termijnenwet, zendt de burgemeester
      aan de in het eerste lid bedoelde functionarissen bij aangetekend schrijven een afschrift van de beschikking en van
      de in [artikel 21][ref1] bedoelde geneeskundige verklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel21
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '21'
        hoofdstuk: II
        paragraaf: '3'
  - number: '26'
    text: |-
      Bij de opneming geeft de burgemeester aan de echtgenoot, de wettelijke vertegenwoordiger en de naaste (familie)
      betrekking van de betrokkene zo mogelijk kennis van de door hem op grond van [artikel 20][ref1] gegeven beschikking
      en van de opneming.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel20
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel26
    references:
