  - number: '15'
    text: |-
      1 De rechter kan op verzoek van de officier van justitie met betrekking tot een persoon die ingevolge een
      voorlopige machtiging in een psychiatrisch ziekenhuis verblijft, een machtiging tot voortgezet verblijf verlenen.

      2 Een machtiging tot voortgezet verblijf kan slechts worden verleend indien naar het oordeel van de rechter:

      a. de stoornis van de geestvermogens van de betrokkene ook na verloop van de geldigheidsduur van de lopende
      machtiging aanwezig zal zijn en deze stoornis betrokkene ook dan gevaar zal doen veroorzaken, en

      b. het gevaar niet door tussenkomst van personen of instellingen buiten het ziekenhuis kan worden afgewend.

      3 Met betrekking tot de voortzetting van het verblijf van de betrokkene in het psychiatrisch ziekenhuis na verloop
      van de geldigheidsduur van de lopende machtiging zijn [artikel 2, derde en vierde lid][ref1], en [artikel 4][ref2]
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel4
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel15
