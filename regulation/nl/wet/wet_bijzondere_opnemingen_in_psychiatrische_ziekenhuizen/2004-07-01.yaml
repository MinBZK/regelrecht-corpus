  - number: '7'
    text: |-
      1 Bevoegd is de rechtbank van de woonplaats van de betrokkene of, bij gebreke van een woonplaats in Nederland, van
      zijn werkelijk verblijf dan wel, indien het verzoek tot het verlenen van een voorlopige machtiging wordt gedaan in
      een geval als bedoeld in [artikel 2, vierde lid][ref1], de rechtbank van het arrondissement waarin het ziekenhuis
      waarin de betrokkene verblijft, gelegen is.

      2 Indien, in een geval als bedoeld in [artikel 2, vierde lid][ref2], de betrokkene, nadat de verklaring bedoeld
      in [artikel 5, eerste lid][ref3], ter kennis van het openbaar ministerie is gekomen, is overgebracht naar een
      ziekenhuis in een ander arrondissement, kan de oorspronkelijk bevoegde officier van justitie dan wel - na het
      verzoek van de officier van justitie - de oorspronkelijk bevoegde rechter besluiten de behandeling van de zaak
      voort te zetten. De rechter kan evenwel verwijzing van de behandeling van het verzoek naar de rechter van dat
      andere arrondissement bevelen.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel2
