  - number: '31'
    text: |-
      1 Met betrekking tot een persoon die ingevolge een machtiging tot voortzetting van de inbewaringstelling als
      bedoeld in [artikel 27, eerste lid][ref1], in een ziekenhuis verblijft, zijn de [artikelen 2][ref2], [3][ref3],
      [4][ref4], [6, eerste, tweede en derde lid][ref5], [8 tot en met 13][ref6], [14a tot en met 14c][ref7] en
      [16][ref8] van overeenkomstige toepassing.

      2 Het verzoekschrift wordt door de officier van justitie ingediend voor het einde van de geldigheidsduur van de
      lopende machtiging.


