  - number: 14g
    text: |-
      1 De behandelaar verschaft aan de betrokkene, indien deze niet langer in zijn geestvermogens is gestoord
      of gevaarlijk is, in het geval, bedoeld in [artikel 14f, onderdeel b][ref1], of indien de rechter na
      toepassing van [artikel 14g, vierde lid][ref2], zulks heeft bevolen, een schriftelijke verklaring ter zake.
      [Artikel 45, eerste lid, laatste volzin][ref3], is van overeenkomstige toepassing.

      2 De betrokkene, ieder van de in [artikel 4, eerste lid][ref4], bedoelde personen alsmede de inspecteur en de
      officier van justitie in wier ambtsgebied de woonplaats van de betrokkene is gelegen, kunnen aan de behandelaar
      verzoeken een verklaring als bedoeld in het eerste lid, te verschaffen.

      3 De beslissing op het verzoek wordt aan de inspecteur medegedeeld. Voor de toepassing van het vierde lid wordt met
      een afwijzende beslissing van de behandelaar gelijkgesteld het niet beslissen binnen twee weken na ontvangst van
      het verzoek.

      4 In geval van een afwijzende beslissing kan degene die de beslissing heeft verkregen,
      de officier van justitie verzoeken de beslissing van de rechter te verzoeken.
      [Artikel 14e, eerste lid, tweede volzin, en tweede tot en met vierde lid][ref5], en [artikel 49, zesde lid][ref6],
      zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel14f
