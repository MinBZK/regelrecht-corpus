  - number: '52'
    text: |-
      Voor de uitvoering van het bij of krachtens deze wet bepaalde, voor zover van toepassing op personen ten aanzien
      van wie krachtens enige wettelijke bepaling Onze Minister van Justitie medeverantwoordelijkheid draagt, handelt
      Onze Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel52
  - number: '53'
    text: |-
      1 Door een psychiatrisch ziekenhuis worden personen door wie of ten aanzien van wie in de zin van
      [hoofdstuk II][ref1] geen blijk wordt gegeven van de nodige bereidheid tot opneming of verblijf, slechts opgenomen
      tegen overlegging van één der in het tweede lid bedoelde bescheiden, dat op die personen betrekking heeft.

      2 De in het eerste lid bedoelde bescheiden zijn:

      a. een afschrift van een rechterlijke beschikking, houdende een machtiging als bedoeld in
      [hoofdstuk II, §§ 1][ref2] of [4][ref3];

      b. een afschrift van een beschikking van de burgemeester of de rechter als bedoeld in [hoofdstuk II, § 3][ref4];

      c. een afschrift van een beslissing van de geneesheer-directeur en een afschrift van een verklaring als
      bedoeld in [artikel 14d, eerste lid][ref5], alsmede een afschrift van de rechterlijke beschikking, houdende een
      voorwaardelijke machtiging;

      d. een uittreksel uit een uitspraak van de strafrechter als bedoeld in
      [artikel 37, eerste lid, van het Wetboek van Strafrecht][ref6], voor zover die uitspraak betrekking heeft op de
      opneming;

      e. een uittreksel uit een rechterlijke uitspraak, waarbij met toepassing van [artikel 37b][ref7] of
      [artikel 38c van het Wetboek van Strafrecht][ref8] bevel wordt gegeven tot verpleging van overheidswege van een ter
      beschikking gestelde, voor zover die beslissing betrekking heeft op de terbeschikkingstelling en dit bevel;

      f. een afschrift van een last tot plaatsing in een inrichting voor verpleging van ter beschikking gestelden als
      bedoeld in [artikel 13 van het Wetboek van Strafrecht][ref9];

      g. een afschrift van een tot opneming strekkende beschikking op grond van het bij en krachtens de Penitentiaire
      beginselenwet bepaalde;

      h. een uittreksel uit een rechtelijke uitspraak, waarbij met toepassing van [artikel 77][ref10] plaatsing in een
      inrichting voor jeugdigen wordt bevolen, voor zover die uitspraak betrekking heeft op deze maatregel;

      i. een afschrift van een tot opneming voor onderzoek of observatie strekkende beschikking op grond van enige
      daartoe de mogelijkheid openende wettelijke bepaling.

      3 In afwijking van het bepaalde in het eerste lid ten aanzien van een persoon door wie niet blijk wordt
      gegeven van de nodige bereidheid, is bij opneming en verblijf van een persoon in een zwakzinnigeninrichting of
      verpleeginrichting overlegging van de bescheiden, bedoeld in het tweede lid, vereist, indien door die persoon blijk
      wordt gegeven van verzet tegen opneming en verblijf.


