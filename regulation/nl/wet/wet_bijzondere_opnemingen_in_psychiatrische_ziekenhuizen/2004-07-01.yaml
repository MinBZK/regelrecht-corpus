  - number: '72'
    text: |-
      De voordracht voor een krachtens [artikel 14][ref1], [23][ref2], [37][ref3], [38][ref4], [39][ref5], [41][ref6],
      [44][ref7], [50][ref8], [58][ref9], [60][ref10] of [62][ref11] vast te stellen algemene maatregel van bestuur
      wordt niet gedaan dan nadat het ontwerp in de *Staatscourant* is bekend gemaakt en aan een ieder de gelegenheid
      is geboden om binnen vier weken na de dag waarop de bekendmaking is geschied, wensen en bedenkingen ter kennis
      van Onze Minister te brengen. Gelijktijdig met de bekendmaking wordt het ontwerp aan de beide kamers der Staten-
      Generaal overgelegd.


