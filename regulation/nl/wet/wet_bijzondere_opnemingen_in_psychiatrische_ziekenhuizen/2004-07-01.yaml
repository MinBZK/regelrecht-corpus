preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de wet van 27 april 1884, Stb. 96, tot regeling van het
    Staatstoezicht op krankzinnigen door een nieuwe wet te vervangen en de nieuwe wet, in aanmerking genomen de in het
    algemeen op het gebied van de zorg voor de volksgezondheid bestaande regelingen, in hoofdzaak betrekking te doen
    hebben op personen die op grond van een rechterlijke uitspraak in een psychiatrisch ziekenhuis worden opgenomen
    of verblijven;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      a. Onze Minister: Onze Minister van Welzijn, Volksgezondheid en Cultuur;

      b. hoofdinspecteur: de bevoegde hoofdinspecteur van het Staatstoezicht op de volksgezondheid;

      c. inspecteur: de bevoegde inspecteur van het Staatstoezicht op de volksgezondheid;

      d. stoornis van de geestvermogens: een gebrekkige ontwikkeling of ziekelijke stoornis van de geestvermogens;

      e. gestoord zijn in zijn geestvermogens: een stoornis van de geestvermogens hebben;

      f. gevaar:

      1°. gevaar voor degene, die het veroorzaakt, hetgeen onder meer bestaat uit:

      a. het gevaar dat betrokkene zich van het leven zal beroven of zichzelf ernstig lichamelijk letsel zal toebrengen;

      b. het gevaar dat betrokkene maatschappelijk te gronde gaat;

      c. het gevaar dat betrokkene zichzelf in ernstige mate zal verwaarlozen;

      d. het gevaar dat betrokkene met hinderlijk gedrag agressie van anderen zal oproepen.

      2°. gevaar voor een of meer anderen, hetgeen onder meer bestaat uit:

      a. het gevaar dat betrokkene een ander van het leven zal beroven of hem ernstig lichamelijk letsel zal toebrengen;

      b. het gevaar voor de psychische gezondheid van een ander;

      c. het gevaar dat betrokkene een ander, die aan zijn zorg is toevertrouwd, zal verwaarlozen.

      3°. gevaar voor de algemene veiligheid van personen of goederen;

      g. echtgenoot: de niet van tafel en bed gescheiden echtgenoot;

      h. psychiatrisch ziekenhuis: een door Onze Minister als psychiatrisch ziekenhuis, verpleeginrichting dan wel
      zwakzinnigeninrichting aangemerkte zorginstelling of afdeling daarvan, gericht op behandeling, verpleging en
      verblijf van personen die gestoord zijn in hun geestvermogens en mede geschikt voor de desbetreffende categorie van
      met toepassing van [hoofdstuk VI][ref1], § 1, of [hoofdstuk VIII][ref2] opgenomen personen;

      i. arts: een persoon die bevoegd is de titel van arts te voeren;

      j. psychiater: een arts die bevoegd is de titel van psychiater of zenuwarts te voeren;

      k. instelling: een rechtspersoonlijkheid bezittende vereniging, stichting of instelling, welke zich blijkens haar
      statuten of reglementen toelegt op het bevorderen van de psycho-sociale of de sociaal-psychiatrische zorg ten
      behoeve van personen die gestoord zijn in hun geestvermogens;

      l. inbewaringstelling: de inbewaringstelling, bedoeld in [artikel 20][ref3];

      m. patiëntenvertrouwenspersoon:

      a. persoon die in een psychiatrisch ziekenhuis werkzaam is om, onafhankelijk van het bestuur en van personen
      in dienst van het ziekenhuis, aan patiënten in het ziekenhuis op hun verzoek advies en bijstand te verlenen in
      aangelegenheden, samenhangend met hun opneming en verblijf in het ziekenhuis;

      b. persoon die onafhankelijk van de behandelaar aan patiënten op hun verzoek advies en bijstand verleent in
      aangelegenheden samenhangend met een voorwaardelijke machtiging.

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde heeft degene die met betrokkene een duurzame
      gemeenschappelijke huishouding heeft of met betrokkene een geregistreerd partnerschap is aangegaan, gelijke
      bevoegdheden als de echtgenoot.

      3 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder "geneesheer-directeur" mede verstaan
      de arts die, hoewel geen directeursfunctie bekledende, belast is met de zorg voor de algemene gang van zaken op
      geneeskundig gebied in het psychiatrisch ziekenhuis.

      4 Voor de toepassing van deze wet wordt onder "rechter" verstaan de enkelvoudige of meervoudige kamer van de
      rechtbank voor het behandelen en beslissen van burgerlijke zaken, met dien verstande dat aan de behandeling van
      zaken met betrekking tot minderjarige personen de kinderrechter deelneemt.

      5 Onze Minister kan bepalen, welk college voor de toepassing van deze wet ten aanzien van psychiatrische
      ziekenhuizen van Rijk, provincie of gemeente als bestuur wordt aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukVI
      [ref2]: https://wetten.overheid.nl/BWBR0005700#HoofdstukVIII
