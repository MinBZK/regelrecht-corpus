  - number: '11'
    text: |-
      De geneesheer-directeur van het psychiatrisch ziekenhuis waarin de betrokkene is opgenomen, doet van deze opneming
      zo spoedig mogelijk mededeling aan de griffier van de rechtbank die de machtiging heeft verleend, en aan de
      officier van justitie bij die rechtbank.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel11
  - number: '12'
    text: |-
      1 Na ontvangst van de in [artikel 11][ref1] bedoelde mededeling geeft de griffier van het verlenen van de
      voorlopige machtiging - onder vermelding van het psychiatrisch ziekenhuis waarin de betrokkene ingevolge de
      machtiging verblijft - kennis aan:

      a. de in [artikel 8, vierde lid, onder b tot en met g][ref2] bedoelde personen of instelling en de huisarts van
      de betrokkene;

      b. de inspecteur en de officier van justitie in wier ambtsgebieden het psychiatrisch ziekenhuis gelegen is.

      2 De griffier stelt desgevraagd andere personen en instellingen die door de rechter zijn gehoord, met uitzondering
      van de persoon, bedoeld in [artikel 8, vierde lid, onder a][ref3], in kennis van het verlenen van de voorlopige
      machtiging onder vermelding van de naam en het adres van het psychiatrisch ziekenhuis waarin de betrokkene is
      opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel8
