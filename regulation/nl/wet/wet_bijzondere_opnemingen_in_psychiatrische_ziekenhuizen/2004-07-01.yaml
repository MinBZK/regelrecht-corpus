  - number: '21'
    text: |-
      1 De burgemeester gelast een inbewaringstelling niet dan nadat een, bij voorkeur niet-behandelend, psychiater
      of, zo dat niet mogelijk is, een, bij voorkeur niet-behandelend arts, niet psychiater zijnde, een schriftelijke
      verklaring heeft verstrekt waaruit met inachtneming van het bepaalde in het tweede en derde lid, blijkt dat het
      geval, bedoeld in [artikel 20, tweede lid][ref1], zich voordoet.

      2 Indien de arts die de verklaring afgeeft, geen psychiater is, pleegt hij zo mogelijk tevoren overleg met een
      psychiater en wel, indien de betrokkene onder behandeling is van een psychiater, bij voorkeur met die psychiater;
      indien de arts die de verklaring afgeeft, niet is de huisarts van de patiënt, pleegt hij zo mogelijk tevoren
      overleg met de huisarts. Indien overleg als bedoeld in de eerste volzin niet heeft plaatsgevonden, vermeldt de arts
      die de verklaring afgeeft, de reden daarvan in de verklaring.

      3 Alvorens de verklaring af te geven onderzoekt de arts, zo enigszins mogelijk, de betrokkene.

      4 Bij of krachtens algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in
      overeenstemming met Onze Minister van Justitie, worden nadere voorschriften gegeven ten aanzien van de
      geneeskundige verklaring, bedoeld in de voorgaande leden.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel20
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel21
