  - number: '45'
    text: |-
      1 Indien de uit de stoornis van de geestvermogens voortvloeiende gevaarlijkheid van een met toepassing van
      [hoofdstuk II][ref1] in een psychiatrisch ziekenhuis niet zijnde een zwakzinnigeninrichting of verpleeginrichting,
      opgenomen patiënt zover is verminderd dat het verantwoord is hem tijdelijk in de maatschappij te doen terugkeren,
      geeft de geneesheer-directeur hem, voor zover dit in het belang van de patiënt gewenst is, verlof het psychiatrisch
      ziekenhuis niet zijnde een zwakzinnigeninrichting of verpleeginrichting, voor een daarbij aan te geven periode te
      verlaten. Zo mogelijk en nodig wordt tevoren overleg gepleegd met de in [artikel 4, eerste lid][ref2], bedoelde
      personen, met degene door wie de patiënt voorafgaande aan zijn opneming in een ziekenhuis werd verzorgd, alsmede
      met de instelling of psychiater, die betrokkene voorafgaande aan zijn opneming behandelde of begeleidde, en de
      huisarts van betrokkene.

      2 Verlof voor een aaneengesloten periode van meer dan 60 uren kan per kalenderjaar ten hoogste twee maal worden
      gegeven en wel telkens voor ten hoogste twee weken. Indien overwogen wordt het verlof langer dan 60 uren te doen
      duren, wordt overleg gepleegd met de inspecteur in wiens ambtsgebied het psychiatrisch ziekenhuis is gelegen.

      3 Aan het verlof kunnen voorwaarden betreffende de behandeling of het gedrag van de patiënt, voorzover dit gedrag
      het gevaar voortvloeiend uit de stoornis van de geestvermogens, beïnvloedt, worden verbonden. De voorwaarden mogen
      de vrijheid van godsdienst of levensovertuiging dan wel de staatkundige vrijheid niet beperken. De geneesheer-
      directeur verleent slechts verlof indien de patiënt zich bereid heeft verklaard tot naleving van de voorwaarden.

      4 Tot de voorwaarden, bedoeld in het derde lid, kan de opdracht behoren dat de betrokkene zich stelt onder toezicht
      van een daarbij aangewezen instelling of natuurlijke persoon, die hem bij de naleving van de andere voorwaarden
      hulp en steun verleent.

      5 Onze Minister stelt een lijst samen van instellingen die aangewezen kunnen worden voor het uitoefenen van
      toezicht, als in het vierde lid bedoeld.

      6 De geneesheer-directeur verschaft aan de patiënt bij het verlenen van verlof een schriftelijke verklaring,
      inhoudende dat aan hem verlof is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel4
