  - number: '17'
    text: |-
      1 Het verzoekschrift van de officier van justitie tot het verlenen van een machtiging tot voortgezet verblijf wordt
      ingediend tijdens de zesde of vijfde week voor het einde van de geldigheidsduur van de lopende machtiging.

      2 De rechter beslist binnen vier weken na het indienen van het verzoekschrift. De [artikelen 8][ref1], [8a][ref2],
      [9, tweede tot en met vijfde lid][ref3], [12][ref4], [13][ref5] en [14][ref6] zijn van overeenkomstige toepassing.

      3 De machtiging tot voortgezet verblijf, bedoeld in [artikel 15, eerste lid][ref7], heeft een geldigheidsduur van
      ten hoogste een jaar na haar dagtekening, onverminderd het bepaalde in de [artikelen 48][ref8] en [49][ref9].

      4 Indien het verzoek van de officier van justitie betrekking heeft op een machtiging tot voortgezet verblijf
      in een zwakzinnigeninrichting of een verpleeginrichting, kan, indien te verwachten valt dat de omstandigheden,
      bedoeld in [artikel 2, tweede lid][ref10], zich zullen blijven voordoen, een machtiging worden verleend die
      een geldigheidsduur heeft van ten hoogste vijf jaren, onverminderd het bepaalde in de [artikelen 48][ref11] en
      [49][ref12].

      5 De beschikking, bedoeld in het derde lid, is bij voorraad uitvoerbaar.


