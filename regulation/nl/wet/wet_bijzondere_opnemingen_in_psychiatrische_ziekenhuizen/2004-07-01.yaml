  - number: '23'
    text: |-
      1 De burgemeester tekent zo spoedig mogelijk op de beschikking, bedoeld in [artikel 20, eerste lid][ref1], de door
      hem ontvangen gegevens omtrent toepassing van de overige artikelen van deze paragraaf aan.

      2 De schriftelijke beschikking van de burgemeester, de in [artikel 21][ref2] bedoelde geneeskundige verklaring
      en een afschrift van het opgemaakte proces-verbaal, worden gedurende vijf jaren ter gemeentesecretarie bewaard en
      vervolgens vernietigd. De in de loop van deze termijn ontvangen stukken betreffende deze patiënt worden daarbij
      gevoegd.

      3 De in het tweede lid bedoelde persoonsgegevens worden verzameld met het oog op de rechtspositie van de patiënt en
      zijn vertegenwoordigers alsmede met het oog op het toezicht in het kader van deze wet.

      4 Is de beschikking niet ten uitvoer gelegd, dan wordt daarop de reden van niet-tenuitvoerlegging aangetekend. Het
      tweede lid is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel21
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel23
