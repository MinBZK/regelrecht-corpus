  - number: 58a
    text: |-
      De behandelaar doet aan de inspecteur en aan de officier van justitie in wier ambtsgebied de woonplaats van de
      betrokkene is gelegen, zo spoedig mogelijk mededeling van de naam van degene aan wie hij een verklaring als bedoeld
