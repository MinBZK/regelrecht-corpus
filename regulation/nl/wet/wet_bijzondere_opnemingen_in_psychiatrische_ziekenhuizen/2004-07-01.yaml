        artikel: '20'
        hoofdstuk: II
        paragraaf: '3'
  - number: '22'
    text: |-
      1 De burgemeester draagt, tenzij de betrokkene daartegen bedenkingen heeft, er zorg voor dat de betrokkene
      binnen 24 uur na het tijdstip waarop de beschikking, bedoeld in [artikel 20, eerste lid][ref1], wordt gegeven,
      wordt bijgestaan door een raadsman. De [artikelen 38][ref2], [39][ref3], [40][ref4], [45 tot en met 49][ref5],
      [50, eerste lid][ref6], en [51 van het Wetboek van Strafvordering][ref7] zijn van overeenkomstige toepassing.

      2 Bij algemene maatregel van bestuur, vast te stellen op de voordracht van Onze Minister in overeenstemming met
      Onze Minister van Justitie, kunnen regels worden gegeven ten aanzien van de toepassing van de eerste volzin van het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel20
