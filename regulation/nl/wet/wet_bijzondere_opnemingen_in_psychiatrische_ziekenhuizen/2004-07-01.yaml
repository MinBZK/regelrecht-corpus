  - number: '59'
    text: |-
      1 Bij algemene maatregel van bestuur worden regels gegeven met betrekking tot de taak en de bevoegdheden van de
      patiëntenvertrouwenspersoon.

      2 Bij algemene maatregel van bestuur kan worden bepaald dat het bestuur van een psychiatrisch ziekenhuis, behorende
      tot een bij de maatregel aan te wijzen categorie, ervoor zorg draagt dat een patiënt kan worden bijgestaan door
      een patiëntenvertrouwenspersoon.

      3 Een algemene maatregel van bestuur op grond van het eerste of tweede lid wordt vastgesteld op de voordracht van
      Onze Minister in overeenstemming met Onze Minister van Justitie.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel59
  - number: '60'
    text: |-
      1 Opneming en verblijf in een zwakzinnigeninrichting of verpleeginrichting van een persoon die twaalf jaar
      of ouder is en geen blijk geeft van de nodige bereidheid ter zake, vindt in de gevallen dat niet ingevolge
      [artikel 2, derde lid, onder b of c][ref1], dan wel ingevolge [artikel 3][ref2] een machtiging is vereist,
      uitsluitend plaats, indien een commissie als bedoeld in het derde lid, die opneming noodzakelijk oordeelt.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld betreffende de behandeling van een aanvraag
      voor opneming en verblijf in een zwakzinnigeninrichting of verpleeginrichting in de gevallen dat ingevolge het
      eerste lid een commissie oordeelt over de noodzaak van die opneming en dat verblijf.

      3 Bij algemene maatregel van bestuur worden niet aan een zwakzinnigeninrichting of verpleeginrichting gebonden
      commissies ingesteld of aangewezen die met betrekking tot een aanvraag als bedoeld in het tweede lid, oordelen over
      de noodzaak van opneming en verblijf in een zwakzinnigeninrichting of verpleeginrichting.

      4 De in het derde lid bedoelde noodzaak is aanwezig, indien de betrokkene zich ten gevolge van de stoornis van de
      geestvermogens niet buiten de inrichting kan handhaven.

      5 Voorafgaand aan de behandeling van de aanvraag, bedoeld in het tweede lid, wordt de betrokkene mondeling en
      schriftelijk medegedeeld dat hij zich kan verzetten tegen opneming en verblijf in een zwakzinnigeninrichting of
      verpleeginrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel3
