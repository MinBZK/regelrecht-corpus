  - number: '5'
    text: |-
      1 Bij een verzoek als bedoeld in [artikel 4][ref1], moet worden overgelegd een verklaring van een psychiater die de
      betrokkene met het oog daarop kort te voren heeft onderzocht maar niet bij diens behandeling betrokken was. In het
      geval, bedoeld in [artikel 2, vierde lid][ref2], moet worden overgelegd een verklaring van de geneesheer-directeur
      van het ziekenhuis waarin betrokkene verblijft, die:

      a. indien hij niet bij de behandeling betrokken was, betrokkene met het oog daarop kort tevoren heeft onderzocht of
      doen onderzoeken door een psychiater die niet bij de behandeling betrokken was, of

      b. indien hij bij de behandeling betrokken was, betrokkene met het oog daarop kort tevoren heeft doen onderzoeken
      door een psychiater die niet bij de behandeling betrokken was.

      Uit de verklaring dient te blijken dat de persoon op wie de verklaring betrekking heeft, is gestoord in zijn
      geestvermogens en dat een geval als bedoeld in [artikel 2][ref3] zich voordoet.

      De geneeskundige verklaring verschaft inzicht in de actuele situatie van de betrokkene. De verklaring moet met
      redenen zijn omkleed en zijn ondertekend.

      2 Indien in een geval als bedoeld in [artikel 2, vierde lid][ref4], een verklaring zal worden opgemaakt met het oog
      op een verzoek tot het verlenen van een voorlopige machtiging als bedoeld in [artikel 2, eerste lid][ref5], wordt
      de betrokkene daarvan in kennis gesteld.

      3 De psychiater, bedoeld in de eerste volzin van het eerste lid, pleegt zo mogelijk tevoren overleg met de
      huisarts en de behandelend psychiater van de betrokkene. Indien dit overleg niet heeft plaatsgevonden, vermeldt de
      psychiater de reden daarvan in de verklaring. In het geval bedoeld in [artikel 2, vierde lid][ref6], pleegt degene
      die het onderzoek uitvoert tevoren overleg met de behandelend psychiater.

      4 Indien de betrokkene minderjarig is, moet tevens worden overgelegd een uittreksel uit het in
      [artikel 244 van Boek 1 van het Burgerlijk Wetboek][ref7] bedoelde register, of een verklaring van de griffier van
      de rechtbank dat ten aanzien van de minderjarige het register geen gegevens bevat.

      5 Indien de betrokkene onder curatele is gesteld, moet tevens worden overgelegd een uittreksel uit het in
      [artikel 391 van Boek 1 van het Burgerlijk Wetboek][ref8] bedoelde register.

      6 Indien ten behoeve van de betrokkene een mentorschap is ingesteld, moet tevens worden overgelegd een afschrift
      van de beschikking waarbij het mentorschap is ingesteld alsmede van die waarbij een mentor is benoemd.


