  - number: 46a
    text: |-
      De geneesheer-directeur geeft een met toepassing van hoofdstuk II in een zwakzinnigeninrichting of
      verpleeginrichting opgenomen patiënt verlof voor zover en voor zolang het verantwoord is hem buiten de inrichting
      te laten verblijven.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel46a
  - number: '47'
    text: |-
      1 Indien de uit de stoornis van de geestvermogens voortvloeiende gevaarlijkheid van een met toepassing van
      [hoofdstuk II][ref1] in een psychiatrisch ziekenhuis verblijvende patiënt zover is verminderd dat het verlenen
      van ontslag uit het psychiatrisch ziekenhuis onder daaraan te verbinden voorwaarden verantwoord is, verleent de
      geneesheer-directeur hem, voor zover dit in het belang van de patiënt gewenst is, voorwaardelijk ontslag.

      2 [Artikel 45, eerste lid, laatste volzin, derde lid, en vierde, vijfde en zesde lid][ref2], is van overeenkomstige
      toepassing. De geneesheer-directeur stelt tevoren de echtgenoot, de wettelijke vertegenwoordiger alsmede de naaste
      (familie) betrekkingen van de patiënt op de hoogte van het voorgenomen voorwaardelijk ontslag.

      3 Met betrekking tot intrekking van het voorwaardelijk ontslag is [artikel 46][ref3] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel45
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel46
