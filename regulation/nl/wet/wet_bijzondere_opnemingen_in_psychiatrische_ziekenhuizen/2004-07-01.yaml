      Indien het verblijf van een persoon in een psychiatrisch ziekenhuis op grond van rechterlijke machtigingen als
      bedoeld in de [artikelen 2][ref1], [15][ref2] en [18][ref3], zonder onderbreking ten minste vijf jaren heeft
