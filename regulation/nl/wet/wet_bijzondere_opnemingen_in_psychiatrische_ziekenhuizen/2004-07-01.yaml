  - number: 14a
    text: |-
      1 De rechter kan op verzoek van de officier van justitie met betrekking tot een persoon die gestoord is in zijn
      geestvermogens en twaalf jaar of ouder is, een voorwaardelijke machtiging verlenen.

      2 Een voorwaardelijke machtiging kan slechts worden verleend, indien naar het oordeel van de rechter:

      a. de stoornis van de geestvermogens betrokkene gevaar doet veroorzaken, en

      b. het gevaar buiten een psychiatrisch ziekenhuis, niet zijnde een zwakzinnigeninrichting of een
      verpleeginrichting, slechts door het stellen en naleven van voorwaarden kan worden afgewend.

      3 [Artikel 4][ref1] is van toepassing, met dien verstande dat de betrokkene ook zelf een verzoek tot het verkrijgen
      van een voorwaardelijke machtiging kan indienen.

      4 Bij een verzoek als bedoeld in [artikel 4][ref2], gericht op het verkrijgen van een voorwaardelijke machtiging,
      moet worden overgelegd een verklaring van een psychiater die de betrokkene met het oog daarop kort tevoren heeft
      onderzocht, maar niet bij diens behandeling betrokken was. Uit de verklaring dient te blijken dat de persoon
      op wie de verklaring betrekking heeft, gestoord is in zijn geestvermogens en dat een geval als bedoeld in het
      tweede lid zich voordoet. De verklaring verschaft inzicht in de actuele geestelijke gezondheidstoestand van de
      betrokkene. De verklaring is met redenen omkleed en ondertekend. [Artikel 5, derde tot en met zesde lid][ref3], en
      de [artikelen 6 tot en met 8a][ref4] zijn van overeenkomstige toepassing. [Artikel 9][ref5] is van overeenkomstige
      toepassing, met dien verstande dat de griffier tevens een afschrift van de beschikking inzake de voorwaardelijke
      machtiging aan de inspecteur zendt. [Artikel 10, eerste lid, eerste volzin][ref6], is van overeenkomstige
      toepassing.

      5 De rechter verleent een voorwaardelijke machtiging slechts indien een behandelingsplan wordt overgelegd dat met
      instemming van de betrokkene door de psychiater die verantwoordelijk zal zijn voor de behandeling, verder te noemen
      de behandelaar, is opgesteld. Het behandelingsplan bevat de therapeutische middelen die zullen worden toegepast
      teneinde buiten de inrichting het gevaar af te wenden. Het behandelingsplan regelt de wijze waarop de behandelaar
      er op toeziet dat het gevaar buiten de inrichting wordt afgewend. [Artikel 38, tweede lid, eerste volzin][ref7], is
      van overeenkomstige toepassing. Het krachtens [artikel 38, derde lid][ref8], omtrent het behandelingsplan, bedoeld
      in [artikel 38, eerste lid][ref9], bepaalde is op dit behandelingsplan van overeenkomstige toepassing. In het
      behandelplan wordt mededeling gedaan van het psychiatrisch ziekenhuis dat bereid is de betrokkene op te nemen als
      deze de voorwaarden niet naleeft of het gevaar niet langer buiten een psychiatrisch ziekenhuis kan worden afgewend
      door de naleving van de voorwaarden.

      6 Het verlenen van een voorwaardelijke machtiging geschiedt in elk geval onder de voorwaarde dat betrokkene zich
      onder behandeling stelt van de behandelaar, overeenkomstig het overgelegde behandelingsplan.

      7 Naast de in het zesde lid bedoelde voorwaarde kan de rechter bij de voorwaardelijke machtiging voorwaarden
      stellen betreffende het gedrag van de betrokkene, voorzover dit gedrag het gevaar, voortvloeiend uit de stoornis
      van de geestvermogens, beïnvloedt. De voorwaarden mogen de vrijheid van godsdienst of levensovertuiging dan wel de
      staatkundige vrijheid niet beperken.

      8 De rechter geeft slechts toepassing aan het eerste lid, indien de betrokkene zich bereid heeft verklaard tot
      naleving van de voorwaarden.

      9 Vanaf het moment dat voor betrokkene een voorwaardelijke machtiging geldt, verleent de
      patiëntenvertrouwenspersoon op verzoek van betrokkene advies en bijstand.

      10 De behandelaar draagt ervoor zorg dat betrokkene zo spoedig mogelijk in het bezit wordt gesteld van een
      schriftelijk overzicht van de op grond van deze wet aan hem toekomende rechten; de behandelaar draagt er tevens
      zorg voor dat betrokkene een mondelinge toelichting terzake ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel5
