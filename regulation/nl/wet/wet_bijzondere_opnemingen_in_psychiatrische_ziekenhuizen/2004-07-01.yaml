  - number: '56'
    text: |-
      1 De geneesheer-directeur draagt zorg dat in het patiëntendossier van een persoon die met toepassing van
      [hoofdstuk II][ref1] in een psychiatrisch ziekenhuis verblijft, aantekening wordt gehouden van:

      a. het op grond van [artikel 38][ref2] opgestelde behandelingsplan;

      b. de voortgang per maand in de uitvoering van dit plan;

      c. de medewerking van betrokkene aan de uitvoering van dit plan;

      d. indien over een behandelingsplan geen overeenstemming is bereikt, de reden daarvoor alsmede het daartoe door de
      voor de behandeling verantwoordelijke persoon gedane voorstel of de daartoe gedane voorstellen;

      e. indien [artikel 38, vijfde lid, derde volzin][ref3], toepassing heeft gevonden, de behandeling die is toegepast,
      en de redenen die hiertoe hebben geleid;

      f. de toepassing van [artikel 39][ref4] ten aanzien van betrokkene en de redenen die hiertoe hebben geleid.

      2 De geneesheer-directeur draagt voorts zorg dat in het patiëntendossier aantekening wordt gehouden van:

      a. andere beslissingen als bedoeld in de [hoofdstukken III][ref5] en [IV][ref6] en de gronden waarop deze
      beslissingen zijn genomen;

      b. de ontvangen afschriften van rechterlijke beslissingen en uittreksels daaruit alsmede de afschriften van
      beschikkingen van de burgemeester als bedoeld in hoofdstuk II, § 3;

      c. ontvangen of afgegeven geneeskundige verklaringen als bedoeld in de [artikelen 5, eerste lid][ref7],
      [16, eerste lid][ref8], [20, zevende lid][ref9], en [33, derde lid][ref10].

      3 De in het tweede lid, onder *b*, bedoelde afschriften en uittreksels, alsmede afschriften van de in het tweede
      lid, onder *c*, bedoelde verklaringen worden bij het desbetreffende patiëntendossier bewaard gedurende ten
      minste vijf jaren na de dagtekening van de beschikking, doch ten hoogste tot na verloop van vijf jaren na het
      einde van het verblijf van de betrokkene in het ziekenhuis, en vervolgens vernietigd. Bij het desbetreffende
      patiëntendossier wordt voorts een afschrift bewaard van het bewijs van ontvangst dat aan de patiënt overeenkomstig
      [artikel 20, zesde lid][ref11], [36, vierde lid][ref12] en [66, vierde lid][ref13], is afgegeven.

      4 Bij algemene maatregel van bestuur worden in het belang van de bescherming van de persoonlijke levenssfeer regels
      gegeven met betrekking tot de termijn gedurende welke de in het dossier opgenomen gegevens worden bewaard en met
      betrekking tot de overdracht van het dossier aan derden.

      5 Het bijhouden van het patiëntendossier geschiedt met het oog op de kwaliteit van de individuele hulpverlening en
      op de rechtspositie van de patiënt en zijn vertegenwoordigers.


