  - number: '63'
    text: |-
      1 Onverminderd het bepaalde in [artikel 64][ref1] alsmede de hun bij of krachtens andere wettelijke bepalingen
      opgedragen taken hebben de hoofdinspecteur en de inspecteurs tot taak te waken voor de op het terrein van de
      volksgezondheid betrekking hebbende belangen van alle personen wier geestvermogens zijn gestoord. Zij zien deswege
      toe op een verantwoorde behandeling, verpleging, verzorging en bejegening van deze personen.

      2 De hoofdinspecteur en inspecteurs beschikken over de bevoegdheden, genoemd in de
      [artikelen 5:15 tot en met 5:17 van de Algemene wet bestuursrecht][ref2] voor zover dit redelijkerwijs voor de
      vervulling van hun in het eerste lid bedoelde taak noodzakelijk is. Zij zijn daarbij tevens bevoegd, met medeneming
      van de benodigde apparatuur, een woning binnen te treden zonder toestemming van de bewoner.

      3 Het bestuur van een ziekenhuis, al dan niet een psychiatrisch ziekenhuis zijnde, de daaraan verbonden
      geneeskundigen alsmede alle anderen die een persoon die gestoord is in zijn geestvermogens, behandelen, verplegen
      of verzorgen, geven aan de genoemde ambtenaren alle door hen verlangde inlichtingen, voor zover dit redelijkerwijs
      voor de vervulling van hun in het eerste lid bedoelde taak nodig is.

      4 Het bestuur van een ziekenhuis, al dan niet een psychiatrisch ziekenhuis zijnde, alsmede het bestuur van elke
      organisatie waardoor personen die gestoord zijn in hun geestvermogens worden gehuisvest, onderzocht of behandeld,
      verlenen aan de genoemde ambtenaren inzage van de patiëntendossiers.

      5 Het bestuur van een ziekenhuis of organisatie als bedoeld in het vierde lid, stelt de genoemde ambtenaren in
      de gelegenheid met de personen die gestoord zijn in hun geestvermogens te spreken, al dan niet op verzoek van die
      personen.

      6 Bevindende dat zich met betrekking tot een zich in de maatschappij bevindende persoon wiens geestvermogens zijn
      gestoord, een geval voordoet als bedoeld in [artikel 2][ref3], geven de genoemde ambtenaren daarvan kennis aan de
      officier van justitie.[ Artikel 6, eerste lid][ref4], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel64
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel515
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0005700#Artikel6
