  - number: 8a
    text: |-
      Indien de rechtbank op grond van het door haar ingestelde onderzoek zich afvraagt of in de gegeven omstandigheden
      een andere maatregel dan de verzochte niet passender is, kan zij dit gevoelen aan de officier van justitie kenbaar
      maken; zo nodig bepaalt de rechtbank daarbij dat de behandeling op een later tijdstip wordt voortgezet.
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel8a
  - number: '9'
    text: |-
      1 De rechter beslist zo spoedig mogelijk. Indien het verzoek tot het verlenen van een voorlopige machtiging
      betrekking heeft op een persoon die reeds in een psychiatrisch ziekenhuis verblijft, beslist de rechter in elk
      geval binnen drie weken na het indienen van het verzoekschrift.

      2 De griffier zendt een afschrift van de beschikking inzake de machtiging aan:

      a. de betrokkene;

      b. de raadsman van de betrokkene;

      c. de ouders die het gezag uitoefenen, de voogd, de curator of de mentor;

      d. de echtgenoot van de betrokkene of degene door wie de betrokkene wordt verzorgd;

      e. de verzoeker indien deze niet is een der onder *c* of *d* genoemde personen;

      f. de officier van justitie.

      3 Van een beschikking waarbij op het verzoek tot het verlenen van de voorlopige machtiging afwijzend wordt beslist,
      geeft de griffier tevens kennis aan de huisarts van de betrokkene en aan de inspecteur.

      4 Bij de kennisgeving aan de huisarts en de inspecteur, bedoeld in het derde lid, voegt de griffier afschrift van
      de geneeskundige verklaring, bedoeld in [artikel 5][ref1].

      5 Tegen de beschikking op een verzoek tot het verlenen van een voorlopige machtiging staat geen hoger beroep open.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel5
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0005700
        artikel: '5'
        hoofdstuk: II
        paragraaf: '1'
  - number: '10'
    text: |-
      1 De beschikking van de rechter is bij voorraad uitvoerbaar. De voorlopige machtiging kan niet meer ten uitvoer
      worden gelegd wanneer meer dan twee weken na haar dagtekening zijn verlopen.

      2 Indien in de eerste week na de dagtekening van de voorlopige machtiging, niet zijnde een machtiging in een geval
      als bedoeld in [artikel 3][ref1], door de daarvoor in aanmerking komende psychiatrische ziekenhuizen nog niet
      tot opneming is overgegaan, kan de officier van justitie, na overleg met de inspecteur, een van de bovenbedoelde
      ziekenhuizen bevelen de betrokkene op te nemen. Hij legt zodanige verplichting niet op dan nadat hij de geneesheer-
      directeur van het desbetreffende ziekenhuis heeft gehoord. Het desbetreffende ziekenhuis is verplicht de betrokkene
      op te nemen.

      3 Bij de opneming van de betrokkene in een psychiatrisch ziekenhuis wordt een afschrift van de in [artikel 5][ref2]
      bedoelde geneeskundige verklaring aan het ziekenhuis overgelegd.

      4 De voorlopige machtiging heeft een geldigheidsduur van ten hoogste zes maanden na haar dagtekening, onverminderd
      het bepaalde in de [artikelen 48][ref3] en [49][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel48
      [ref4]: https://wetten.overheid.nl/BWBR0005700#Artikel49
