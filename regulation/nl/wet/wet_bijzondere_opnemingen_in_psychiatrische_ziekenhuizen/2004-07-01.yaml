  - number: '39'
    text: |-
      1 Met betrekking tot een patiënt op wie [hoofdstuk II][ref1] toepassing heeft gevonden, kunnen, anders dan ter
      uitvoering van een behandelingsplan met inachtneming van [artikel 38][ref2], geen middelen of maatregelen worden
      toegepast dan ter overbrugging van tijdelijke noodsituaties welke door de patiënt in het ziekenhuis als gevolg van
      de stoornis van de geestvermogens worden veroorzaakt.

      2 De middelen en maatregelen die kunnen worden toegepast in gevallen als bedoeld in het eerste lid, worden bij
      algemene maatregel van bestuur aangewezen. Daarbij worden termijnen aangegeven, gedurende welke ten hoogste de
      onderscheidene middelen en maatregelen met betrekking tot een bepaalde patiënt mogen worden toegepast.

      3 De geneesheer-directeur geeft zo spoedig mogelijk na het begin van de toepassing van een middel of maatregel
      als bedoeld in de vorige leden daarvan kennis aan de echtgenoot, de wettelijke vertegenwoordiger of, ingeval deze
      ontbreken, de naaste (familie)betrekkingen, en in ieder geval aan de inspecteur.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel38
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel39
