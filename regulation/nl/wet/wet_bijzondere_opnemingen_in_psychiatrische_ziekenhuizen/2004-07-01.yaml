  - number: 39a
    text: |-
      De kennisgeving van de geneesheer-directeur aan de inspecteur bedoeld in de [artikelen 38, zesde lid][ref1], en
      [39, derde lid][ref2], geschiedt op een daartoe door Onze Minister voorgeschreven formulier.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0005700#Artikel39
    url: https://wetten.overheid.nl/BWBR0005700/2004-07-01#Artikel39a
