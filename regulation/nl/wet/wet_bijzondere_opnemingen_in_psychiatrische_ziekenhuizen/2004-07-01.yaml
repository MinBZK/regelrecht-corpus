  - number: 14b
    text: |-
      1 Het behandelingsplan kan met instemming van de betrokkene door de behandelaar worden gewijzigd. Afschrift van
      een gewijzigd behandelingsplan wordt terstond gezonden aan de griffier van de rechtbank die de voorwaardelijke
      machtiging heeft verleend, en aan de officier van justitie bij die rechtbank.

      2 Het bij de [artikelen 37, eerste lid, derde volzin][ref1], en
      [56, eerste lid, onderdelen a tot en met c, tweede lid, onderdelen b en c, derde en vijfde lid][ref2], alsmede het
      krachtens [artikel 37, vierde lid][ref3], en [artikel 56, vierde lid][ref4], omtrent het patiëntendossier bepaalde
      is van overeenkomstige toepassing.

      3 De betrokkene of de behandelaar kan de officier van justitie verzoeken de beslissing van de rechter omtrent het
      wijzigen van de voorwaarden of het aanwijzen van een andere behandelaar te verzoeken. Het verzoek van de betrokkene
      of de behandelaar wordt schriftelijk gedaan.

      4 De officier van justitie verzoekt na ontvangst zo spoedig mogelijk de beslissing van de rechter.

      5 De rechter kan op verzoek van de officier van justitie de voorwaarden wijzigen of een andere behandelaar
      aanwijzen. De [artikelen 8][ref5] en [14a, zesde tot en met achtste lid][ref6], zijn van overeenkomstige
      toepassing.


