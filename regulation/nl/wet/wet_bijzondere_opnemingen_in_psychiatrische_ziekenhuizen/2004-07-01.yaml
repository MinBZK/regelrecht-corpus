  - number: '54'
    text: |-
      1 Indien door of ten aanzien van een in een ziekenhuis, al dan niet zijnde een psychiatrisch ziekenhuis, op
      grond van één der in [artikel 53, tweede lid][ref1], bedoelde beslissingen opgenomen persoon na verloop van
      de geldigheidsduur daarvan in de zin van [hoofdstuk II][ref2] geen blijk wordt gegeven van de bereidheid tot
      voortzetting van het verblijf, dan wel indien door of ten aanzien van een niet op grond van één der bedoelde
      beslissingen opgenomen persoon in de zin van [hoofdstuk II][ref3] blijk wordt gegeven van de wil tot beëindiging
      van het verblijf, wordt het verblijf door het ziekenhuis slechts voortgezet tegen overlegging van één der in het
      tweede lid bedoelde bescheiden, dat op die persoon betrekking heeft. In afwijking van het bepaalde in de voorgaande
      volzin betreffende het blijk geven van de bereidheid door de opgenomen persoon, dient in het geval dat een
      machtiging is verleend op grond van [artikel 3][ref4], na verloop van de geldigheidsduur van die machtiging aan de
      in de eerste volzin gestelde voorwaarde te worden voldaan, indien door de opgenomen persoon blijk wordt gegeven aan
      verzet tegen voortzetting van het verblijf.

      2 De in het eerste lid bedoelde bescheiden zijn:

      a. een afschrift van een rechterlijke beschikking, houdende een machtiging als bedoeld in hoofdstuk II, paragrafen
      1, 2, 3 of [4][ref5];

      b. een mededeling van de officier van justitie ingevolge [artikel 16, derde lid][ref6], juncto
      [artikel 6, derde lid][ref7], dat door hem een verzoek is gedaan tot het verkrijgen van een machtiging tot
      voortgezet verblijf;

      c. een afschrift van een beschikking van de strafrechter tot verlenging van de terbeschikkingstelling op grond
      van [artikel 38][ref8];

      d. een afschrift van een tot verlenging van het verblijf strekkende beslissing op grond van enige daartoe de
      mogelijkheid opende wettelijke bepaling.


