      1 Onverminderd het bepaalde in de [artikelen 48][ref1] en [49][ref2] wordt de machtiging op eigen verzoek als
      bedoeld in [artikel 32][ref3] gegeven voor een door de rechter te bepalen duur, welke niet langer kan zijn dan een
      jaar en niet korter dan een half jaar na haar dagtekening.

      2 De rechter beslist zo spoedig mogelijk.

      3 De [artikelen 2 tot en met 19][ref4] zijn ten aanzien van degene die op grond van een machtiging als bedoeld
      in [artikel 32][ref5] in een psychiatrisch ziekenhuis verblijft van overeenkomstige toepassing na verloop van de
      geldigheidsduur van die machtiging.


