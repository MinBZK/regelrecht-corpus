  - number: '43'
    text: |-
      1 De patiënt op wie [hoofdstuk II][ref1] toepassing heeft gevonden, kan, onverminderd zijn recht om zelf een
      overplaatsing te bewerkstelligen, aan de geneesheer-directeur mondeling of schriftelijk overplaatsing verzoeken
      naar een al dan niet door hem met name genoemd ander ziekenhuis.

      2 Indien de geneesheer-directeur van oordeel is dat het in het belang van de patiënt is aan het verzoek gevolg te
      geven, neemt hij terzake de nodige stappen.

      3 Indien de geneesheer-directeur meent aan het verzoek niet te kunnen voldoen, stelt hij schriftelijk de patiënt
      daarvan in kennis, onder mededeling van de redenen waarom hij meent aan het verzoek geen gevolg te kunnen geven.
      Hij zendt een afschrift van zijn beslissing aan de inspecteur.

      4 De inspecteur hoort zo nodig de patiënt. Indien de inspecteur overplaatsing gewenst voorkomt, treft hij de nodige
      maatregelen om opneming in een ander ziekenhuis te bewerkstelligen. De geneesheer-directeur draagt op aanwijzing
      van de inspecteur zorg voor overbrenging van de patiënt naar het andere ziekenhuis.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
