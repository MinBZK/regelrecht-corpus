  - number: '55'
    text: |-
      1 Bij overplaatsing naar een ander ziekenhuis, al dan niet zijnde een psychiatrisch ziekenhuis, geschiedt de
      opneming daarin onder overlegging van een afschrift van een beslissing als bedoeld in de [artikelen 53][ref1] en
      [54][ref2], op dat tijdstip van kracht voor de betrokken patiënt.

      2 De geneesheer-directeur van het ziekenhuis, al dan niet zijnde een psychiatrisch ziekenhuis, waarin de patiënt na
      overplaatsing is opgenomen, geeft van de overplaatsing zo spoedig mogelijk kennis aan de griffier van de rechtbank
      of het gerechtshof dan wel aan de burgemeester die de in het eerste lid bedoelde beslissing heeft genomen.

      3 De griffier geeft van de overplaatsing van de patiënt - onder vermelding van het ziekenhuis waar betrokkene is
      opgenomen - kennis aan de personen en instellingen, die op grond van de [artikelen 9, tweede lid, onder e][ref3],
      en [12, eerste en tweede lid][ref4], door hem zijn in kennis gesteld van de in het eerste lid bedoelde beslissing,
      alsmede aan de inspecteur en aan de officier van justitie, in wier ambtsgebied het ziekenhuis is gelegen, indien de
      overplaatsing geschiedde naar een ziekenhuis in een ander ambtsgebied.

      4 De burgemeester die de in het eerste lid bedoelde beslissing heeft genomen, geeft van de overplaatsing van de
      patiënt - onder vermelding van het ziekenhuis waar betrokkene is opgenomen - kennis aan de personen die door hem op
      grond van de [artikelen 25][ref5] en [26][ref6] zijn in kennis gesteld van de in het eerste lid bedoelde beslissing
      of van een andere overplaatsing, alsmede aan de inspecteur en de officier van justitie, in wier ambtsgebied het
      ziekenhuis is gelegen, indien de overplaatsing geschiedde naar een ziekenhuis in een ander ambtsgebied.

      5 Het tweede, derde en vierde lid zijn niet van toepassing met betrekking tot patiënten die zijn opgenomen onder
      overlegging van een afschrift van een beslissing als bedoeld in [artikel 53, tweede lid, onder d, e, f en g][ref7],
      of [artikel 54, tweede lid, onder c][ref8].


