      1 De artikelen 32-35 van de wet van 27 april 1884, *Stb.* 96, tot regeling van het Staatstoezicht op krankzinnigen
      worden ingetrokken op het in [artikel 80, eerste lid][ref1], vermelde tijdstip.

      2 De overige bepalingen van de wet van 27 april 1884, *Stb.* 96, tot regeling van het Staatstoezicht op
      krankzinnigen worden ingetrokken op het krachtens [artikel 80, tweede lid][ref2], vastgestelde tijdstip.


