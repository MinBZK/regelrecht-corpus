  - number: '36'
    text: |-
      1 Het bestuur van een psychiatrisch ziekenhuis draagt zorg dat aan een patiënt op wie [hoofdstuk II][ref1]
      toepassing heeft gevonden, aan de echtgenoot, de wettelijke vertegenwoordiger alsmede aan de naaste (familie)
      betrekkingen van de patiënt, zo spoedig mogelijk na zijn opneming schriftelijk wordt medegedeeld welke arts of
      andere persoon in het ziekenhuis in het bijzonder verantwoordelijk zal zijn voor zijn behandeling.

      2 Met betrekking tot een patiënt op wie [hoofdstuk II][ref2], §§ 2 of [4][ref3] toepassing heeft gevonden terwijl
      hij reeds in het psychiatrisch ziekenhuis verbleef, wordt aan het eerste lid uitvoering gegeven zo spoedig mogelijk
      na het verlenen van de rechterlijke machtiging.

      3 Bij opneming in het ziekenhuis of op een later tijdstip kunnen aan de patiënt op wie [hoofdstuk II][ref4]
      toepassing heeft gevonden, slechts de voorwerpen worden ontnomen die een gevaar kunnen opleveren voor zijn
      veiligheid of de goede gang van zaken in het ziekenhuis. De patiënt kan daartoe aan zijn kleding of aan het lichaam
      worden onderzocht.

      4 Indien de patiënt voorwerpen als bedoeld in het vorige lid worden ontnomen, wordt hem een bewijs van ontvangst
      afgegeven, waarin die voorwerpen zijn omschreven. De voorwerpen worden voor de patiënt bewaard, voor zover dit niet
      in strijd is met enig wettelijk voorschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref2]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
      [ref3]: https://wetten.overheid.nl/BWBR0005700#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005700#HoofdstukII
