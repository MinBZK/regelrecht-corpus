---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_voorraadvorming_aardolieproducten_2001
regulatory_layer: WET
publication_date: '2013-01-17'
valid_from: '2013-01-01'
bwb_id: BWBR0012373
url: https://wetten.overheid.nl/BWBR0012373/2013-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om regels te stellen met het oog op het zo doelmatig
    mogelijk voldoen aan internationale verplichtingen tot het aanhouden van minimumvoorraden aardolieproducten,
    voortvloeiend uit de Overeenkomst inzake een Internationaal Energieprogramma (Trb. 1975, 47) en uit richtlijn nr.
    68/414/EEG van de Raad van de Europese Gemeenschappen van 20 december 1968 houdende verplichting voor de Lid-Staten
    van de Europese Economische Gemeenschap om minimumvoorraden aardolie en/of aardolieprodukten in opslag te houden
    (PbEG L 208), en daartoe de Wet voorraadvorming aardolieprodukten integraal te herzien;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.a
    text: |-
      bilateraal akkoord: tussen Nederland en een andere lidstaat van de Europese Unie geldend verdrag als bedoeld in
      artikel 3 van de bijlage bij de Overeenkomst inzake een Internationaal Energieprogramma (Trb. 1975, 47) en artikel
      7, eerste tot en met derde lid, van richtlijn 2006/67/EG;
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.b
    text: 'COVA: Stichting Centraal Orgaan Voorraadvorming Aardolieprodukten;'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.c
    text: |-
      internationale verplichtingen: verplichtingen tot het aanhouden van een voorraad aardolieproducten, voortvloeiend
      uit de Overeenkomst inzake een Internationaal Energieprogramma (Trb. 1975, 47) en uit richtlijn 2006/67/EG;
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.d
    text: 'Onze Minister: Onze Minister van Economische Zaken, Landbouw en Innovatie;'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.e
    text: 'referentiejaar: kalenderjaar dat voorafgaat aan het voorraadjaar;'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.f
    text: |-
      richtlijn 2006/67/EG: richtlijn 2006/67/EG van de Raad van 24 juli 2006 houdende verplichting voor de lidstaten om
      minimumvoorraden ruwe aardolie en/of aardolieproducten in opslag te houden (PbEU L 217).
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.g
    text: |-
      uitslag: uitslag als bedoeld in [artikel 2 van de Wet op de accijns][ref1], met uitzondering van afleveringen met
      bestemming internationale zeevaart;


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel2
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '2'
  - number: 1.h
    text: 'voorraadjaar: tijdvak van 12 maanden dat begint op 1 april van enig jaar;'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
  - number: 1.i
    text: |-
      voorraadplichtige: degene die op grond van deze wet een wettelijke voorraad moet aanhouden of zich daartoe heeft
      verbonden bij een overeenkomst als bedoeld in [artikel 5, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel5
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 1.j
    text: |-
      wettelijke voorraad: voorraad aardolieproducten waarmee wordt beoogd aan de voor Nederland geldende internationale
      verplichtingen te voldoen, alsmede de extra voorraad die COVA aanhoudt op grond van [artikel 7, tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel7
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde worden aardolieproducten verdeeld in de volgende
      categorieën:
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel2
  - number: 2.1.a
    text: lichte olie,
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel2
  - number: 2.1.b
    text: halfzware olie en gasolie,
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel2
  - number: 2.1.c
    text: zware stookolie,
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel2
  - number: 2.1.d
    text: vloeibaar gemaakt petroleumgas.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onder de in het eerste lid genoemde producten wordt verstaan hetgeen ingevolge de [artikelen 26][ref1] en
      [28 van de Wet op de accijns][ref2] onder deze producten wordt verstaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel28
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0005251
        artikel: '28'
  - number: '3.1'
    text: |-
      De hoeveelheid aardolieproducten die Nederland ter naleving van zijn internationale verplichtingen moet aanhouden,
      wordt als volgt verdeeld:
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel3
  - number: 3.1.a
    text: |-
      elke vergunninghouder voor een of meer accijnsgoederenplaatsen voor minerale oliën als bedoeld in
      [artikel 39 van de Wet op de accijns][ref1], die in het referentiejaar een hoeveelheid aardolieproducten
      heeft uitgeslagen die in totaal ligt boven de in het tweede lid bedoelde drempel, houdt gedurende het
      voorraadjaar van elke categorie aardolieproducten die hij heeft uitgeslagen, de hoeveelheid aan, bedoeld in
      [artikel 4, eerste lid][ref2],


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0012373#Artikel4
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0012373
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3.1.b
    text: |-
      COVA houdt de hoeveelheid aan, bedoeld in [artikel 7][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel7
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.2'
    text: De hoogte van de drempel wordt bepaald bij algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel3
  - number: '3.3'
    text: Het eerste lid, onderdeel a, is niet van toepassing op de Nederlandse krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel3
  - number: '4.1'
    text: |-
      De hoeveelheid aardolieproducten die wordt aangehouden door een voorraadplichtige niet zijnde COVA, wordt bepaald
      door:
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel4
  - number: 4.1.a
    text: |-
      de drempel, bedoeld in [artikel 3, eerste lid, onderdeel a][ref1], te verdelen over de diverse categorieën
      aardolieproducten naar rato van zijn uitslag van elke categorie in het referentiejaar;


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel3
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 4.1.b
    text: |-
      per categorie aardolieproducten zijn in het referentiejaar uitgeslagen hoeveelheid te verminderen met de
      hoeveelheid die is berekend met toepassing van onderdeel a, en
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel4
  - number: 4.1.c
    text: |-
      de met toepassing van onderdeel b berekende hoeveelheid te vermenigvuldigen met een percentage dat bij algemene
      maatregel van bestuur wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel4
  - number: '4.2'
    text: |-
      De omvang van de verplichting wordt berekend naar de aangiften, bedoeld in
      [artikel 53 van de Wet op de accijns][ref1], over het referentiejaar. De omvang van de verplichting over uitslag
      waarvoor geen aangifte is gedaan omdat geen accijns is verschuldigd, wordt berekend op een bij ministeriële
      regeling te bepalen wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel53
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005251
        artikel: '53'
  - number: '4.3'
    text: |-
      Het percentage, bedoeld in het eerste lid, onderdeel c, is gebaseerd op de gemiddelde voorraad
      waarover, bij een normale bedrijfsvoering, ten minste een substantieel deel van de voorraadplichtigen
      beschikt. Dat percentage kan worden gecorrigeerd in verband met de effecten van de drempel, bedoeld in
      [artikel 3, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel3
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.1'
    text: |-
      Onze Minister kan op aanvraag besluiten dat aan de verplichting, bedoeld in
      [artikel 3, eerste lid, onderdeel a][ref1], door twee of meer voorraadplichtigen gezamenlijk mag worden voldaan,
      al dan niet doordat een derde zich er bij overeenkomst toe verbindt de gezamenlijke voorraadverplichting te zullen
      naleven.


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel3
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '5.2'
    text: |-
      De aanvraag wordt slechts geweigerd indien in de aanvraag naar het oordeel van Onze Minister onvoldoende
      aannemelijk is gemaakt dat de betrokken voorraadplichtigen gedurende het voorraadjaar of de voorraadjaren waarop de
      aanvraag betrekking heeft, daadwerkelijk gezamenlijk aan hun voorraadverplichting zullen voldoen.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel5
  - number: '5.3'
    text: |-
      De aanvraag wordt ingediend vóór 1 maart die voorafgaat aan het voorraadjaar of de voorraadjaren waarop de aanvraag
      betrekking heeft. Onze Minister beslist binnen vier weken. Onze Minister kan zijn besluit onder beperkingen
      verlenen. Onze Minister kan aan zijn besluit voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel5
  - number: '5.4'
    text: De voorraadplichtige meldt het niet naleven van de gezamenlijke voorraadverplichting onverwijld aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel5
  - number: '5.5'
    text: 'Onze Minister kan zijn besluit met ingang van een door hem te bepalen datum wijzigen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel5
  - number: 5.5.a
    text: op aanvraag van een of meer belanghebbenden, of
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel5
  - number: 5.5.b
    text: |-
      ambtshalve, indien hij het aannemelijk acht dat de betrokken voorraadplichtigen niet aan hun gezamenlijke
      voorraadverplichting voldoen of zullen voldoen.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel5
  - number: '6.1'
    text: |-
      De gegevens die zijn verstrekt bij een melding als bedoeld in [artikel 5, vierde lid][ref1], kunnen ten aanzien van
      degene die deze gegevens heeft verstrekt niet dienen:


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel5
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 6.1.a
    text: als grondslag voor of ten behoeve van een opsporingsonderzoek of een vervolging, noch
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel6
  - number: 6.1.b
    text: |-
      als bewijs terzake van een telastelegging, voor zover dit opsporingsonderzoek, die vervolging of die telastelegging
      betrekking heeft op overtreding van [artikel 3, eerste lid, onderdeel a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel3
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.2'
    text: |-
      Degene die de melding heeft gedaan, is niet aansprakelijk voor schade die een andere betrokken voorraadplichtige
      of de derde, bedoeld in [artikel 5, eerste lid][ref1], dientengevolge lijdt, tenzij aannemelijk wordt gemaakt dat
      gelet op alle feiten en omstandigheden in redelijkheid niet tot melding had mogen worden overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel5
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '5'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '7.1'
    text: |-
      De hoeveelheid aardolieproducten die wordt aangehouden door COVA, wordt per categorie aardolieproducten bepaald
      door de voor Nederland geldende internationale verplichtingen te verminderen met de totale hoeveelheid die de
      andere voorraadplichtigen dan COVA moeten aanhouden.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel7
  - number: '7.2'
    text: |-
      Onze Minister kan bepalen dat de hoeveelheid die COVA op grond van het eerste lid aanhoudt, met een door hem te
      bepalen hoeveelheid wordt verhoogd.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel7
  - number: '7.3'
    text: |-
      Onze Minister maakt de totale door COVA aan te houden hoeveelheid tijdig voorafgaand aan het voorraadjaar aan COVA
      bekend.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel7
  - number: '8.1'
    text: |-
      Onze Minister kan, indien dit naar zijn oordeel noodzakelijk is in verband met een oliecrisis of dreigende
      oliecrisis, bij ministeriële regeling bepalen dat de wettelijke voorraad met een door hem te bepalen gedeelte mag
      worden verminderd.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel8
  - number: '8.2'
    text: |-
      Een krachtens het eerste lid vastgestelde regeling kan beperkingen inhouden, waaronder een beperking van de
      categorieën aardolieproducten waarvan de wettelijke voorraad mag worden verminderd.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel8
  - number: '8.3'
    text: |-
      Onze Minister ziet er op toe, dat indien er sprake is van een oliecrisis of dreigende oliecrisis, geen speculatie
      in of het achterhouden van voorraden zal plaatsvinden. Bij algemene maatregel van bestuur worden nadere regels
      gesteld.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel8
  - number: '9.1'
    text: |-
      Indien de voorraadplichtige aantoont dat is voldaan aan de verhouding en het bepaalde in artikel 5, tweede en derde
      lid, van richtlijn 2006/67/EG, mag hij de wettelijke voorraad per categorie aardolieproducten naar die verhouding
      en dat bepaalde vervangen door ruwe aardolie, halffabrikaten of componenten waaruit die producten kunnen worden
      vervaardigd.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel9
  - number: '9.2'
    text: |-
      De voorraadplichtige kan aantonen dat is voldaan aan de verhouding en het bepaalde in artikel 5, tweede en derde
      lid, van richtlijn 2006/67/EG, door gebruik te maken van jaarlijks door Onze Minister terzake verstrekte gegevens.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel9
  - number: '9.3'
    text: |-
      Voor zover uit [artikel 3][ref1] voortvloeit dat de wettelijke voorraad moet worden aangehouden als vloeibaar
      gemaakt petroleumgas, kan de voorraadplichtige in plaats daarvan volstaan met het aanhouden van een zelfde
      hoeveelheid lichte olie. Op deze lichte olie zijn het eerste en tweede lid van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel3
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '10.1'
    text: |-
      Een product wordt slechts tot de wettelijke voorraad gerekend, indien het zich bevindt in een lidstaat van de
      Europese Unie.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel10
  - number: '10.2'
    text: |-
      Als het product zich niet in Nederland bevindt, wordt het slechts tot de wettelijke voorraad gerekend indien is
      voldaan aan het betrokken bilaterale akkoord.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel10
  - number: '10.3'
    text: |-
      Onze Minister kan, indien dit naar zijn oordeel noodzakelijk is in verband met een oliecrisis of dreigende
      oliecrisis, bepalen dat de wettelijke voorraad die zich niet in Nederland bevindt binnen een door Onze Minister te
      bepalen termijn naar Nederland wordt overgebracht.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel10
  - number: '11.1'
    text: |-
      Een product wordt slechts tot de wettelijke voorraad gerekend, indien het op elk moment dat de voorraadplichtige
      daarom verzoekt, daadwerkelijk te zijner beschikking staat.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel11
  - number: '11.2'
    text: |-
      Als de voorraadplichtige niet enig rechthebbende is op het product, wordt het slechts tot de wettelijke voorraad
      gerekend indien hij ten aanzien daarvan een beschikkingsrecht heeft:
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel11
  - number: 11.2.a
    text: dat is ingegaan per de eerste van een kalendermaand, en
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel11
  - number: 11.2.b
    text: een geldingsduur heeft van ten minste een maand.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel11
  - number: '11.3'
    text: |-
      Onze Minister kan bepalen dat de voorraadplichtige enig rechthebbende dient te zijn op ten minste een door de
      Minister te bepalen gedeelte van de wettelijke voorraad: a. ingeval de voorraadplichtige COVA is: indien Onze
      Minister dat noodzakelijk acht uit oogpunt van zekerheid van voorziening van aardolieproducten; b. ingeval de
      voorraadplichtige niet COVA is: indien is gebleken dat in het verleden door deze voorraadplichtige of ten opzichte
      van deze voorraadplichtige, niet werd voldaan aan het eerste lid.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel11
  - number: '12.1'
    text: 'Tot de wettelijke voorraad worden niet gerekend producten:'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: 12.1.a
    text: die zich bevinden in leidingen of verwerkingsinstallaties van een raffinaderij,
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: 12.1.b
    text: die zich bevinden in pijpleidingen, tankauto's of tankwagons,
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: 12.1.c
    text: die, al dan niet uitsluitend, voorhanden zijn voor rechtstreekse aflevering ten behoeve van het wegverkeer,
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: 12.1.d
    text: die zich bevinden in bunkerstations ten behoeve van de zeescheepvaart,
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: 12.1.e
    text: |-
      die zijn geplaatst onder de douaneregeling douanevervoer, bedoeld in artikel 4, onderdeel 16, onder b, van
      [verordening (EEG) nr. 2913/92](31992R2913) van de Raad van de Europese Gemeenschappen van 12 oktober 1992 tot
      vaststelling van het communautair douanewetboek (PbEG L 302), of
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: 12.1.f
    text: |-
      waarvan op grond van een verdrag tussen Nederland en een andere staat is gewaarborgd, dat Nederland de overbrenging
      naar die andere staat niet zal belemmeren.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: '12.2'
    text: |-
      Voorts wordt niet tot de wettelijke voorraad gerekend ruwe aardolie die zich bevindt in installaties die gebruikt
      worden voor de winning van ruwe aardolie.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel12
  - number: '13.1'
    text: |-
      De voorraadplichtige verstrekt aan Onze Minister gegevens omtrent de omvang en samenstelling van zijn wettelijke
      voorraad en overige voorraad aardolieproducten, ruwe aardolie, halffabrikaten en componenten, zijn rechtsbetrekking
      daartoe, alsmede omtrent de kosten van het naleven van zijn voorraadverplichting, als bij ministeriële regeling
      bepaald.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel13
  - number: '13.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing op degene die, zelf niet voorraadplichtig, ten behoeve van een
      voorraadplichtige een wettelijke voorraad beheert.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel13
  - number: '13.3'
    text: |-
      De regeling, bedoeld in het eerste lid, kan slechts betrekking hebben op de inhoud van de gevraagde gegevens, op de
      wijze waarop zij worden verstrekt, en op de tijdstippen waarop zij worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel13
  - number: '14.1'
    text: |-
      Onze Minister kan op aanvraag ontheffing verlenen van de [artikelen 3, eerste lid, onderdeel a][ref1], en
      [13][ref2]. Een ontheffing kan onder beperkingen worden verleend. Aan een ontheffing kunnen voorschriften worden
      verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0012373#Artikel13
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0012373
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '14.2'
    text: 'De ontheffing kan worden gewijzigd of ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel14
  - number: 14.2.a
    text: op aanvraag van een of meer belanghebbenden, of
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel14
  - number: 14.2.b
    text: ambtshalve, indien dit naar het oordeel van Onze Minister om gewichtige redenen noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel14
  - number: '15.1'
    text: Onze Minister draagt er zorg voor dat er een Stichting Centraal Orgaan Voorraadvorming Aardolieprodukten is.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel15
  - number: '15.2'
    text: |-
      COVA heeft tot taak om, met inachtneming van de vereiste zekerheid van voorziening van aardolieproducten, haar
      wettelijke voorraad tegen zo laag mogelijke kosten aan te houden, en te doen al hetgeen daarvoor bevorderlijk kan
      zijn.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel15
  - number: '16.1'
    text: Het bestuur van COVA bestaat uit ten minste drie en ten hoogste zeven leden.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel16
  - number: '16.2'
    text: |-
      Onze Minister benoemt en ontslaat de voorzitter en de plaatsvervangende voorzitter van het bestuur, alsmede
      de overige leden en plaatsvervangende leden. Eén lid en zijn plaatsvervanger benoemt en ontslaat hij in
      overeenstemming met Onze Minister van Financiën.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel16
  - number: '17.1'
    text: Slechts Onze Minister kan de statuten van COVA wijzigen.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel17
  - number: '17.2'
    text: |-
      Onze Minister kan, het bestuur van COVA gehoord, COVA aanwijzingen geven, die hij voor een goede taakvervulling
      van COVA noodzakelijk acht. Deze aanwijzingen kunnen onder meer betrekking hebben op de soorten producten die COVA
      dient aan te houden, op de wijze en plaats van opslag daarvan en op de aanwending van de voorraden van COVA bij een
      oliecrisis of dreigende oliecrisis.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel17
  - number: '17.3'
    text: |-
      COVA verstrekt desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel17
  - number: '18.1'
    text: |-
      De begroting van inkomsten en uitgaven en de jaarrekening van COVA behoeven, na door het bestuur van COVA te zijn
      vastgesteld, de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel18
  - number: '18.2'
    text: |-
      Het bestuur van COVA biedt jaarlijks vóór 1 februari aan Onze Minister ter goedkeuring de begroting voor het
      komende kalenderjaar aan, vergezeld van de nodige toelichting en bescheiden. Indien de begroting niet vóór de
      aanvang van het kalenderjaar waarvoor zij moet dienen, is goedgekeurd, kan Onze Minister COVA machtigen bepaalde
      uitgaven te doen.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel18
  - number: '18.3'
    text: |-
      Het bestuur van COVA biedt Onze Minister jaarlijks vóór 1 juli aan de rekening van inkomsten en uitgaven over het
      afgelopen kalenderjaar, alsmede een overzicht van de grootte en samenstelling van het vermogen aan het einde van
      dat jaar en een bijbehorende toelichting. De overgelegde stukken behoeven een verklaring van een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], die door het bestuur van COVA
      is benoemd. Zij gaan verder vergezeld van een verslag van de accountant, bevattende opmerkingen waartoe diens
      onderzoek aanleiding geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '18.4'
    text: |-
      De goedkeuring van de jaarrekening strekt, voor zover het de daarbij goedgekeurde inkomsten en uitgaven
      betreft, tot décharge van het bestuur, behoudens in geval van later gebleken valsheid in bewijsstukken of andere
      onregelmatigheden.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel18
  - number: '19.1'
    text: |-
      Indien COVA naar het oordeel van Onze Minister haar taak ernstig verwaarloost, kan Onze Minister de noodzakelijke
      voorzieningen treffen, zo nodig met afwijking van de statuten van COVA.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel19
  - number: '19.2'
    text: |-
      De voorzieningen worden, spoedeisende gevallen uitgezonderd, niet eerder getroffen dan nadat COVA in de gelegenheid
      is gesteld om binnen een door Onze Minister gestelde termijn alsnog haar taak naar behoren uit te voeren.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel19
  - number: '20'
    text: De staat is aansprakelijk voor schulden van COVA, die mochten overblijven na haar liquidatie als rechtspersoon.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel20
  - number: '21.1'
    text: |-
      Onder de naam voorraadheffing wordt een heffing geheven van de in [artikel 2][ref1] bedoelde producten. De
      voorraadheffing strekt tot financiering van de exploitatiekosten van COVA.


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel2
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '2'
        hoofdstuk: '1'
  - number: '21.2'
    text: |-
      De voorraadheffing wordt vanwege Onze Minister van Financiën door de rijksbelastingdienst geheven en ingevorderd
      als ware het accijns.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel21
  - number: '21.3'
    text: Onze Minister van Financiën keert de opbrengst van de voorraadheffing uit aan COVA.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel21
  - number: '22.1'
    text: 'De heffing bedraagt voor:'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel22
  - number: 22.1.a
    text: lichte olie, per 1000 L bij een temperatuur van 15 graden Celsius € 5,90
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel22
  - number: 22.1.b
    text: halfzware olie, per 1000 L bij een temperatuur van 15 graden Celsius € 5,90
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel22
  - number: 22.1.c
    text: gasolie, per 1000 L bij een temperatuur van 15 graden Celsius € 5,90
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel22
  - number: 22.1.d
    text: vloeibaar gemaakt petroleumgas, per 1000 kilogram € 5,90
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel22
  - number: '22.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen de in het eerste lid genoemde bedragen worden gewijzigd of op nihil
      gesteld.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel22
  - number: '22.3'
    text: |-
      De voordracht van een algemene maatregel van bestuur tot verhoging van een of meer van de in het eerste lid
      genoemde bedragen, wordt niet eerder gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal
      is overgelegd.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel22
  - number: '24.1'
    text: 'Bij besluit van Onze Minister aangewezen ambtenaren zijn belast met het toezicht op de naleving van:'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel24
  - number: 24.1.a
    text: |-
      het bij of krachtens [hoofdstuk 2][ref1] bepaalde, met uitzondering van [artikel 21][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0012373#Artikel21
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0012373
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0012373
        artikel: '21'
        hoofdstuk: '2'
  - number: 24.1.b
    text: |-
      het bepaalde bij of krachtens een bilateraal akkoord, voor zover dit betrekking heeft op het niet in Nederland
      aanhouden van een wettelijke voorraad.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel24
  - number: '24.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel24
  - number: '25'
    text: |-
      Dit hoofdstuk heeft uitsluitend betrekking op het, op grond van een bilateraal akkoord, in Nederland aanhouden
      van een voorraad aardolieproducten ten behoeve van een andere staat dan Nederland, dan wel ten behoeve van een
      onderdaan van die staat.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel25
  - number: '26.1'
    text: 'Onze Minister kan de aanvraag tot het mogen aanhouden van de voorraad slechts weigeren indien:'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel26
  - number: 26.1.a
    text: |-
      toestemming naar zijn oordeel zou kunnen leiden tot een situatie die in strijd zou zijn met het betrokken
      bilaterale akkoord, of
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel26
  - number: 26.1.b
    text: |-
      weigering naar zijn oordeel anderszins noodzakelijk is met het oog op de naleving van voor Nederland geldende
      internationale verplichtingen.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel26
  - number: '26.2'
    text: |-
      Indien de aanvraag is geweigerd op grond van het eerste lid, onderdeel b, is degene die de aanvraag had ingediend
      verplicht om met COVA te onderhandelen over het door COVA aanhouden van de betrokken voorraad aardolieproducten als
      wettelijke voorraad.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel26
  - number: '27'
    text: |-
      [Artikel 13][ref1] is van overeenkomstige toepassing op degene die de voorraad aanhoudt.


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel13
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '28.1'
    text: |-
      Met het toezicht op de naleving van het bij of krachtens een bilateraal akkoord bepaalde, zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel28
  - number: '28.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel28
  - number: '30'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet en vervolgens telkens na vier jaar aan de
      Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van het functioneren van COVA, alsmede over
      de effecten van deze wet op de Nederlandse economie.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel30
  - number: 31a
    text: |-
      Indien richtlijn 68/414/EEG wordt ingetrokken en wordt vervangen door een codificatie van die richtlijn, worden
      voor zover nodig bij besluit van Onze Minister de verwijzingen in de [artikel 1, onderdelen a en c][ref1], en
      [artikel 9, eerste en tweede lid][ref2], naar de artikelen van richtlijn 68/414/EEG alsmede de aanduiding van
      de richtlijn in [artikel 1, onderdeel f][ref3], in overeenstemming gebracht met de corresponderende artikelen en
      aanduiding van de gecodificeerde richtlijn. Van dit besluit wordt mededeling gedaan in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0012373#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0012373#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0012373#Artikel1
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel31a
    references:
      - id: ref1
        bwb_id: BWBR0012373
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0012373
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0012373
        artikel: '1'
        hoofdstuk: '1'
  - number: '32.1'
    text: De Wet voorraadvorming aardolieprodukten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel32
  - number: '32.2'
    text: |-
      De bepalingen van de Wet voorraadvorming aardolieprodukten blijven van toepassing met betrekking tot feiten
      die leiden tot de verschuldigdheid van voorraadheffing of tot de voldoening van voorraadheffing, die hebben
      plaatsgevonden voor 1 april 2001 en met betrekking tot strafbare feiten die hebben plaatsgevonden voor die datum.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel32
  - number: '33'
    text: |-
      De artikelen van deze wet treden in werking met ingang van een bij koninklijk besluit te bepalen tijdstip, dat voor
      de verschillende artikelen of onderdelen daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel33
  - number: '34'
    text: 'Deze wet wordt aangehaald als: Wet voorraadvorming aardolieproducten 2001.'
    url: https://wetten.overheid.nl/BWBR0012373/2013-01-01#Artikel34
