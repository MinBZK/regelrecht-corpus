preamble:
  text: |-
    Gelet op artikel 43 van de Wet op de jeugdzorg en de artikelen 11, 15 en 17 van het Besluit beleidsinformatie
    jeugdzorg;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 De stichtingen verstrekken de gegevens, bedoeld in [artikel 44, eerste lid, van de Wet op de jeugdzorg][ref1]
      aan gedeputeerde staten van de betrokken provincie en de betrokken zorgverzekeraars volgens een daartoe opgesteld
      informatieprotocol.

      2 De raad voor de kinderbescherming verstrekt de gegevens, bedoeld in
      [artikel 44, tweede lid, van de Wet op de jeugdzorg][ref2] aan gedeputeerde staten van de betrokken provincie
      volgens een daartoe opgesteld informatieprotocol.

      3 De rechtspersoon die is aanvaard door Onze Minister van Justitie ten behoeve
      van de uitoefening van de taken, bedoeld in [artikel 254, tweede lid][ref3], of
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref4], verstrekt ten behoeve van de verwerking,
      bedoeld in [artikel 42, eerste en tweede lid, van de Wet op de jeugdzorg][ref5] gegevens aan Onze Minister van
      Justitie volgens een daartoe opgesteld informatieprotocol.

      4 Gedeputeerde staten van de betrokken provincie verstrekken de gegevens, bedoeld in
      [artikel 44, derde lid, van de Wet op de jeugdzorg][ref6] aan Onze Ministers volgens een daartoe opgesteld
      informatieprotocol.


