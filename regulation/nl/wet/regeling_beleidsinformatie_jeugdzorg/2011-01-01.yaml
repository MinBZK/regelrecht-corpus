---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_beleidsinformatie_jeugdzorg
regulatory_layer: WET
publication_date: '2011-11-03'
valid_from: '2011-01-01'
bwb_id: BWBR0018673
url: https://wetten.overheid.nl/BWBR0018673/2011-01-01
preamble:
  text: |-
    Gelet op artikel 43 van de Wet op de jeugdzorg en de artikelen 11, 15 en 17 van het Besluit beleidsinformatie
    jeugdzorg;

    Besluiten:
  url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      De stichtingen verstrekken de gegevens, bedoeld in [artikel 44, eerste lid, van de Wet op de jeugdzorg][ref1]
      aan gedeputeerde staten van de betrokken provincie en de betrokken zorgverzekeraars volgens een daartoe opgesteld
      informatieprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
    machine_readable:
      produces:
        legal_character: INFORMATIEF
      input:
        - name: gegevens_artikel_44_eerste_lid
          type: object
          description: Gegevens bedoeld in artikel 44, eerste lid, van de Wet op de jeugdzorg
      output:
        - name: gegevens_verstrekt_volgens_protocol_stichtingen
          type: boolean
          description: Bevestigt dat stichtingen de gegevens verstrekken volgens het informatieprotocol
      actions:
        - name: check_protocol_compliance_stichtingen
          description: Controleer of gegevens worden verstrekt volgens het informatieprotocol
          operation:
            EQUALS:
              - informatieprotocol.gegevens
              - gegevens_artikel_44_eerste_lid
  - number: '1.2'
    text: |-
      De raad voor de kinderbescherming verstrekt de gegevens, bedoeld in
      [artikel 44, tweede lid, van de Wet op de jeugdzorg][ref1] aan gedeputeerde staten van de betrokken provincie
      volgens een daartoe opgesteld informatieprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
    machine_readable:
      produces:
        legal_character: INFORMATIEF
      input:
        - name: gegevens_artikel_44_tweede_lid
          type: object
          description: Gegevens bedoeld in artikel 44, tweede lid, van de Wet op de jeugdzorg
      output:
        - name: gegevens_verstrekt_volgens_protocol_raad_kinderbescherming
          type: boolean
          description: Bevestigt dat de Raad voor de Kinderbescherming de gegevens verstrekken volgens het informatieprotocol
      actions:
        - name: check_protocol_compliance_raad_kinderbescherming
          description: Controleer of gegevens worden verstrekt volgens het informatieprotocol
          operation:
            EQUALS:
              - informatieprotocol.gegevens
              - gegevens_artikel_44_tweede_lid
  - number: '1.3'
    text: |-
      De rechtspersoon die is aanvaard door Onze Minister van Justitie ten behoeve
      van de uitoefening van de taken, bedoeld in [artikel 254, tweede lid][ref1], of
      [artikel 302, tweede lid, van Boek 1 van het Burgerlijk Wetboek][ref2], verstrekt ten behoeve van de verwerking,
      bedoeld in [artikel 42, eerste en tweede lid, van de Wet op de jeugdzorg][ref3] gegevens aan Onze Minister van
      Justitie volgens een daartoe opgesteld informatieprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel254
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel302
      [ref3]: https://wetten.overheid.nl/BWBR0016637#Artikel42
    url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '254'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '302'
      - id: ref3
        bwb_id: BWBR0016637
        artikel: '42'
    machine_readable:
      produces:
        legal_character: INFORMATIEF
      input:
        - name: gegevens_artikel_42
          type: object
          description: Gegevens bedoeld in artikel 42, eerste en tweede lid, van de Wet op de jeugdzorg
      output:
        - name: gegevens_verstrekt_volgens_protocol_rechtspersoon
          type: boolean
          description: Bevestigt dat de rechtspersoon de gegevens verstrekken volgens het informatieprotocol
      actions:
        - name: check_protocol_compliance_rechtspersoon
          description: Controleer of gegevens worden verstrekt volgens het informatieprotocol
          operation:
            EQUALS:
              - informatieprotocol.gegevens
              - gegevens_artikel_42
  - number: '1.4'
    text: |-
      Gedeputeerde staten van de betrokken provincie verstrekken de gegevens, bedoeld in
      [artikel 44, derde lid, van de Wet op de jeugdzorg][ref1] aan Onze Ministers volgens een daartoe opgesteld
      informatieprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0016637#Artikel44
    url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0016637
        artikel: '44'
    machine_readable:
      produces:
        legal_character: INFORMATIEF
      input:
        - name: gegevens_artikel_44_derde_lid
          type: object
          description: Gegevens bedoeld in artikel 44, derde lid, van de Wet op de jeugdzorg
      output:
        - name: gegevens_verstrekt_volgens_protocol_gedeputeerde_staten
          type: boolean
          description: Bevestigt dat gedeputeerde staten de gegevens verstrekken volgens het informatieprotocol
      actions:
        - name: check_protocol_compliance_gedeputeerde_staten
          description: Controleer of gegevens worden verstrekt volgens het informatieprotocol
          operation:
            EQUALS:
              - informatieprotocol.gegevens
              - gegevens_artikel_44_derde_lid
  - number: '2'
    text: |-
      De informatieprotocollen, bedoeld in [artikel 1, eerste tot en met het vierde lid][ref1], bevatten de gegevens
      die worden verstrekt, de wijze waarop de gegevens worden verstrekt, de tijdvakken waarop de gegevens die worden
      verstrekt, betrekking hebben en de termijn waarbinnen de gegevens worden verstrekt. De informatieprotocollen zijn
      goedgekeurd door Onze Ministers zoals deze zijn opgenomen in de bijlagen bij de toelichting.


      [ref1]: https://wetten.overheid.nl/BWBR0018673#Artikel1
    url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018673
        artikel: '1'
    machine_readable:
      produces:
        legal_character: INFORMATIEF
      output:
        - name: informatieprotocol
          type: object
          description: Bevat de gegevens, wijze van verstrekken, tijdvakken, en termijn voor gegevensverstrekking
          fields:
            gegevens:
              type: object
              description: De gegevens die worden verstrekt
            wijze_van_verstrekking:
              type: string
              description: De wijze waarop de gegevens worden verstrekt
            tijdvakken:
              type: list
              description: De tijdvakken waarop de gegevens betrekking hebben
              items:
                type: string
            termijn:
              type: string
              description: De termijn waarbinnen de gegevens worden verstrekt
      actions:
        - name: construct_informatieprotocol
          description: Construeer het informatieprotocol volgens artikel 2
          operation:
            OBJECT:
              gegevens: gegevens
              wijze_van_verstrekking: wijze_van_verstrekking
              tijdvakken: tijdvakken
              termijn: termijn
      open_terms:
        - id: informatieprotocol
          type: object
          required: true
          delegated_to: ministers
          delegation_type: MINISTERIELE_REGELING
          legal_basis: artikel 2 Regeling beleidsinformatie jeugdzorg
  - number: '3'
    text: 'Deze regeling wordt aangehaald als: Regeling beleidsinformatie jeugdzorg.'
    url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#Artikel3
  - number: '4'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0018673/2011-01-01#Artikel4
