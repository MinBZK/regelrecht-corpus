$id: wijzigingswet_wet_educatie_en_beroepsonderwijs_enz_aanscherping_eisen_examencommissies_middelbaar_beroepsonderwijs_en_technische_aanpassing
regulatory_layer: WET
publication_date: '2017-02-15'
valid_from: '2017-08-01'
bwb_id: BWBR0039194
url: https://wetten.overheid.nl/BWBR0039194/2017-08-01
preamble:
  text: >-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.


    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:


    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de kwaliteit van de examinering wenselijk is om
    de eisen met betrekking tot examencommissies in het middelbaar beroepsonderwijs aan te scherpen en daartoe de Wet
    educatie en beroepsonderwijs en de Wet educatie en beroepsonderwijs BES te wijzigen;


    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0039194/2017-08-01#ArtikelAanhef
articles:
  - number: IIIA
    text: >-
      Onze Minister van Onderwijs, Cultuur en Wetenschap zendt binnen vijf jaar na de inwerkingtreding van deze wet aan
      de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0039194/2017-08-01#ArtikelIIIA
  - number: IV
    text: >-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip dat voor de verschillende artikelen en
      onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0039194/2017-08-01#ArtikelIV
