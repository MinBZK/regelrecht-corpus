preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is de regeldruk te verminderen door onder meer het aantal
    bestaande vergunningen af te schaffen dan wel te vereenvoudigen alsmede een aantal uitgewerkte wetten in te trekken
    met het oog op verlaging van het aantal regels dat als onnodige last voor de burger geldt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0023549/2010-01-01#ArtikelAanhef
