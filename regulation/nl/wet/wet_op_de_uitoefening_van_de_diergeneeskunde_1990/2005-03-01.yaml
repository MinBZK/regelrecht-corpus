  - number: '1.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald, dat voor toepassing van deze wet en de daarop berustende
      bepalingen met uitoefening van de diergeneeskunde wordt gelijkgesteld het als beroep verrichten van bij of
      krachtens die maatregel aangewezen handelingen met betrekking tot het transplanteren van eicellen of embryo’s van
      dieren.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel1
  - number: '1.3'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt het verrichten van dierproeven of proeven
      in de zin van de [Wet op de dierproeven][ref1] (*Stb.* 1977, 67) niet als "uitoefening van de diergeneeskunde"
      aangemerkt, tenzij deze handelingen plaatsvinden op verzoek van de houder van het desbetreffende dier met het oog
      op dat dier zelf.


      [ref1]: https://wetten.overheid.nl/BWBR0003081
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0003081
  - number: '1.4'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald dat voor de toepassing van deze wet en de daarop berustende
      bepalingen in die maatregel aangewezen handelingen, verricht bij daarbij aangewezen dieren of door daarbij
      aangewezen categorieën van personen, niet als "uitoefening van de diergeneeskunde" worden aangemerkt.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel1
  - number: '2'
    text: |-
      Tot de uitoefening van de diergeneeskunde zijn, onverminderd het bepaalde in de [artikelen 3][ref1], [4][ref2],
      [5][ref3] en [6][ref4], slechts dierenartsen toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel5
      [ref4]: https://wetten.overheid.nl/BWBR0004730#Artikel6
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '5'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004730
        artikel: '6'
        hoofdstuk: II
  - number: '3.1'
    text: |-
      Onze Minister kan personen of groepen van personen, die buiten Nederland de bevoegdheid tot uitoefening van de
      diergeneeskunde in haar volle omvang hebben verkregen, tot de uitoefening van de diergeneeskunde toelaten.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel3
  - number: '3.2'
    text: Aan de toelating kunnen voorschriften worden verbonden. Zij kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel3
  - number: '3.3'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen zijn de krachtens het eerste lid toegelaten
      personen met dierenartsen gelijkgesteld.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel3
  - number: '3.4'
    text: |-
      Alvorens een beslissing op grond van het eerste lid wordt genomen, wordt de faculteit der diergeneeskunde van de
      Rijksuniversiteit te Utrecht gehoord, tenzij de toelating voortvloeit uit verplichtingen opgelegd op grond van
      internationale overeenkomsten.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel3
  - number: '3.5'
    text: |-
      Degenen die op het moment van inwerkingtreding van dit artikel krachtens artikel 3, eerste lid, van de Wet op de
      Uitoefening van de Diergeneeskunst (*Stb.* 1954, 572) zijn toegelaten tot de uitoefening van de diergeneeskunde,
      worden geacht onder dezelfde voorwaarden te zijn toegelaten krachtens het eerste lid van dit artikel.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel3
  - number: '4.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de toelating van anderen dan
      dierenartsen tot de uitoefening van de diergeneeskunde in beperkte omvang.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: '4.2'
    text: |-
      De in het eerste lid bedoelde regelen bevatten in elk geval een omschrijving van de aard van de werkzaamheden
      waartoe een toelating zich kan uitstrekken. Zij kunnen voorts onder meer betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: 4.2.a
    text: |-
      een voor een toelating af te leggen examen, de voorwaarden voor het afleggen van dat examen en een voor het
      afleggen van dat examen te volgen opleiding;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: 4.2.b
    text: |-
      de wijze waarop de werkzaamheden worden uitgeoefend, waarbij kan worden bepaald dat deze slechts onder leiding, op
      aanwijzing of onder controle van een dierenarts mogen geschieden;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: 4.2.c
    text: een nadere omschrijving van de verhouding van degene die is toegelaten, tot die dierenarts;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: 4.2.d
    text: de geldigheidsduur van een toelating;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: 4.2.e
    text: de gevallen waarin een toelating kan worden ingetrokken;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: 4.2.f
    text: het verbinden van voorschriften en beperkingen aan een toelating.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel4
  - number: '5'
    text: |-
      Degenen die op het moment van inwerkingtreding van dit artikel in het bezit zijn van een geldige, hun ingevolge
      artikel 5, tweede lid, van de Wet op de Uitoefening van de Diergeneeskunst verleende vergunning tot uitoefening van
      de verloskunde, zijn toegelaten tot het als beroep verlenen van hulp met betrekking tot de geboorte of verwijdering
      van een vrucht van dieren van in die vergunning genoemde soorten, voor zover deze hulp bestaat uit:
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel5
  - number: 5.a
    text: |-
      het zonder operatie of verdoving van het moederdier mogelijk maken van de geboorte van de vrucht, dan wel het
      verkleinen van de vrucht en het verwijderen ervan in gedeelten zonder operatie of verdoving, niet zijnde epiduraal
      anesthesie, van het moederdier;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel5
  - number: 5.b
    text: |-
      het door hem die de onder *a* bedoelde hulp verleent, op het moederdier vóór of onmiddellijk na de geboorte of
      verwijdering van de vrucht toepassen van door Onze Minister aangewezen handelingen welke direct met die geboorte of
      verwijdering verband houden.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel5
  - number: '6.1'
    text: |-
      Degenen die op het moment van inwerkingtreding van dit artikel in het bezit zijn van een geldige, hun ingevolge
      artikel 5, tweede lid, van de Wet op de Uitoefening van de Diergeneeskunst verleende vergunning tot het kastreren,
      zijn toegelaten tot het als beroep verrichten van een of meer der navolgende handelingen:
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel6
  - number: 6.1.a
    text: |-
      het onvruchtbaar maken van mannelijke biggen en ramlammeren en, voor zover de in de aanhef genoemde vergunning
      zich hiertoe uitstrekt, van andere mannelijke varkens en mannelijke schapen en hengsten, stieren, bokken, reuen en
      katers, een en ander mits de primaire geslachtsklieren bij deze dieren op de normale plaats aanwezig zijn en geen
      afwijkingen vertonen;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel6
  - number: 6.1.b
    text: |-
      het langs de weg van een operatie behandelen van scrotaalbreuken bij varkens, voor zover deze ingreep
      tegelijkertijd met het onvruchtbaar maken plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel6
  - number: 6.1.c
    text: het toepassen van plaatselijke verdoving bij de onder *a* en *b* genoemde ingrepen;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel6
  - number: 6.1.d
    text: het behandelen met wondpoeders van wonden welke een direct gevolg zijn van de onder *a* en *b* genoemde ingrepen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel6
  - number: '6.2'
    text: |-
      Onze Minister kan regelen stellen omtrent de wijze waarop de in het eerste lid bedoelde personen de aldaar onder
      *a* en *b* genoemde ingrepen mogen verrichten alsmede omtrent de diergeneesmiddelen die zij daarbij mogen toepassen
      en de wijze waarop zij deze mogen toepassen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel6
  - number: '7.1'
    text: |-
      Het onvruchtbaar maken van dieren, het verrichten van operaties bij dieren en het toepassen bij dieren van
      diergeneesmiddelen aangewezen krachtens [artikel 29 van de Diergeneesmiddelenwet][ref1] is, voor zover een en ander
      niet als beroep geschiedt, aan anderen dan dierenartsen verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '29'
  - number: '7.2'
    text: 'Het in het eerste lid gestelde verbod geldt niet:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel7
  - number: 7.2.a
    text: |-
      voor zover een handeling, als daar bedoeld, wordt verricht in het kader van onderzoekingen in daarvoor door Onze
      Minister aangewezen diergeneeskundige instellingen en instellingen van wetenschap of onderzoek;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel7
  - number: 7.2.b
    text: |-
      voor zover een handeling, als daar bedoeld, wordt verricht door hen, die ingevolge de [artikelen 4][ref1],
      [5][ref2] en [6][ref3] diezelfde handeling als beroep mogen verrichten;


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel6
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '6'
        hoofdstuk: II
  - number: 7.2.c
    text: |-
      voor het onvruchtbaar maken van mannelijke biggen door de houders van die dieren voor zover en voor zolang zulks
      door Onze Minister is toegestaan en met inachtneming van de daarbij gestelde regelen;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel7
  - number: 7.2.d
    text: |-
      voor het toepassen bij dieren van de in het eerste lid bedoelde diergeneesmiddelen, met uitzondering van die welke
      krachtens [artikel 30, vierde lid, van de Diergeneesmiddelenwet][ref1] zijn aangewezen, door de houder van dieren,
      voor zover en voor zolang de dierenarts die de dieren behandelt, dit noodzakelijk acht.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel30
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0003818
        artikel: '30'
  - number: '7.3'
    text: |-
      Onze Minister kan geheel of gedeeltelijk van het in het eerste lid gestelde verbod vrijstelling of ontheffing
      verlenen. Aan een vrijstelling of ontheffing kunnen voorschriften worden verbonden. Zij kunnen onder beperkingen
      worden verleend.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel7
  - number: '8.1'
    text: |-
      Het is aan anderen dan dierenartsen verboden in het openbaar aan te kondigen, dat zij de diergeneeskunde
      uitoefenen, of de titel te voeren van dierenarts dan wel een andere titel, aanduiding of vermelding te bezigen die
      bij het publiek redelijkerwijs de indruk kan vestigen dat zij de hoedanigheid van dierenarts bezitten.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel8
  - number: '8.2'
    text: |-
      In afwijking van het bepaalde in het eerste lid, is het degenen die ingevolge de [artikelen 4][ref1], [5][ref2] of
      [6][ref3] zijn toegelaten, toegestaan in het openbaar aan te kondigen dat zij de werkzaamheden uitoefenen waarvoor
      zij zijn toegelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel6
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '5'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '6'
        hoofdstuk: II
  - number: '9.1'
    text: |-
      Alvorens werkzaam te zijn op het gebied van de uitoefening van de diergeneeskunde is een dierenarts, behoudens het
      bepaalde in het zesde lid, gehouden zich aan te melden bij een door Onze Minister aangewezen ambtenaar.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel9
  - number: '9.2'
    text: |-
      Dierenartsen, dierverloskundigen en kastreurs die op het moment van inwerkingtreding van dit artikel reeds werkzaam
      zijn op het gebied van de uitoefening van de diergeneeskunde, zijn gehouden zich onverwijld aan te melden bij de in
      het eerste lid bedoelde ambtenaar.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel9
  - number: '9.3'
    text: |-
      Onze Minister stelt regelen omtrent de wijze waarop de aanmelding dient te geschieden en omtrent de gegevens die
      met betrekking tot de aanmelding moeten worden verstrekt. Van de aanmelding wordt een bewijs afgegeven.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel9
  - number: '9.4'
    text: |-
      Indien na de aanmelding, bedoeld in het eerste en tweede lid, de daarbij verstrekte gegevens zijn gewijzigd, is de
      dierenarts, dierverloskundige of kastreur gehouden deze wijzigingen onverwijld op de door Onze Minister bepaalde
      wijze ter kennis te brengen van de in het eerste lid bedoelde ambtenaar.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel9
  - number: '9.5'
    text: |-
      De dierenarts, dierverloskundige of kastreur is gehouden, om wanneer hij ophoudt werkzaam te zijn op het gebied van
      de uitoefening van de diergeneeskunde, van dat feit onverwijld schriftelijk kennis te geven aan de in het eerste
      lid bedoelde ambtenaar.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel9
  - number: '9.6'
    text: |-
      Onze Minister kan van het bepaalde in het eerste lid vrijstelling verlenen. Aan een vrijstelling kunnen
      voorschriften worden verbonden. Zij kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel9
  - number: '10.1'
    text: |-
      Onze Minister draagt zorg dat dierenartsen, dierverloskundigen en kastreurs die werkzaam zijn op het gebied
      van de uitoefening van de diergeneeskunde, worden ingeschreven in een register van praktizerende dierenartsen,
      onderscheidenlijk een register van dierverloskundigen en kastreurs.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel10
  - number: '10.2'
    text: |-
      Inschrijving vindt echter niet plaats zolang de betrokkene krachtens een onherroepelijk geworden rechterlijke of
      tuchtrechtelijke beslissing de bevoegdheid tot de uitoefening van de diergeneeskunde mist.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel10
  - number: '10.3'
    text: |-
      Een inschrijving wordt doorgehaald, indien de betrokkene in de in het tweede lid genoemde omstandigheid is komen te
      verkeren dan wel anderszins is opgehouden werkzaam te zijn op het gebied van de uitoefening van de diergeneeskunde.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel10
  - number: '10.4'
    text: |-
      In het register worden ten minste de naam van de dierenarts, dierverloskundige of kastreur en het adres of de
      adressen waar deze de praktijk uitoefent, vermeld alsmede de aard van de praktijk.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel10
  - number: '10.5'
    text: 'Onze Minister stelt regelen omtrent:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel10
  - number: 10.5.a
    text: de inrichting van het register;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel10
  - number: 10.5.b
    text: de wijze waarop kennis kan worden genomen van de in het register opgenomen gegevens.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel10
  - number: '11.1'
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de erkenning van specialismen in de
      uitoefening van de diergeneeskunde, omtrent de aan de erkenning als specialist te verbinden titels en omtrent
      de aanwijzing van en het stellen van eisen aan organisaties of instellingen die zich met de regeling van en de
      opleiding tot specialismen in de uitoefening van de diergeneeskunde hebben belast.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: '11.2'
    text: 'Bij een algemene maatregel van bestuur als bedoeld in het eerste lid wordt in elk geval bepaald dat:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: 11.2.a
    text: |-
      de organisatie of instelling naar het oordeel van Onze Minister representatief moet zijn voor de beoefenaren van
      het beroep;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: 11.2.b
    text: |-
      de door de organisatie of instelling vastgestelde reglementen die het specialisme regelen de goedkeuring van Onze
      Minister behoeven;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: 11.2.c
    text: de specialisten-opleiding moet voldoen aan door Onze Minister te stellen regelen;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: 11.2.d
    text: |-
      de erkenning als specialist en het verwerven van de daaraan verbonden titel te voeren niet afhankelijk mag zijn van
      het lidmaatschap van de organisatie of instelling;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: 11.2.e
    text: |-
      dat de erkenning als specialist kan worden ingetrokken, indien de betrokkene gedurende een bepaalde tijd het
      specialisme niet daadwerkelijk heeft beoefend.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: '11.3'
    text: |-
      Het is aan anderen dan degenen die als specialist zijn erkend, verboden in het openbaar aan te kondigen dat zij als
      specialist werkzaam zijn of de daaraan verbonden titel te voeren, dan wel enige andere aanduiding of vermelding te
      bezigen die bij het publiek redelijkerwijs de indruk kan vestigen dat zij als specialist zijn erkend.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel11
  - number: '12'
    text: 'Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel12
  - number: 12.a
    text: |-
      de beschikking over en de inrichting van praktijkruimten, de inrichting van klinieken en ziekenhuizen voor dieren,
      alsmede omtrent de technische uitrusting en apparatuur;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel12
  - number: 12.b
    text: verplichte deelneming aan bij- of nascholing.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel12
  - number: 12a
    text: |-
      Bij algemene maatregel van bestuur kunnen regelen worden gesteld omtrent het brengen in Nederland, gebruiken,
      voorhanden hebben, in voorraad hebben, verkopen, te koop aanbieden, kopen en afleveren van bij die maatregel
      aangewezen elektromedische apparaten die bij de uitoefening van de diergeneeskunde worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel12a
  - number: '13.1'
    text: |-
      Het ontwerp van een algemene maatregel van bestuur, bedoeld in de [artikelen 4][ref1] en [11][ref2], wordt
      gelijktijdig in de *Nederlandse Staatscourant* bekend gemaakt en aan de beide Kamers der Staten-Generaal
      overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel11
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '4'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '11'
        hoofdstuk: II
  - number: '13.2'
    text: |-
      Gedurende 30 dagen vanaf de dag waarop de bekendmaking is geschied, kan een ieder wensen en bezwaren met betrekking
      tot het ontwerp ter kennis brengen van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel13
  - number: '13.3'
    text: |-
      Een algemene maatregel van bestuur als bedoeld in het eerste lid treedt niet eerder in werking dan een maand na de
      datum van uitgifte van het *Staatsblad* waarin hij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel13
  - number: '14'
    text: |-
      Op een dierenarts kunnen een of meer van de maatregelen, bedoeld in [artikel 16][ref1], worden toegepast, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel16
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '16'
        hoofdstuk: III
  - number: 14.a
    text: |-
      hij door enig handelen of nalaten te kort schiet in de zorg die hij in zijn hoedanigheid behoort te betrachten ten
      opzichte van een of meer dieren met betrekking tot welke zijn hulp is ingeroepen, wordt verleend of in geval van
      nood behoort te worden verleend;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel14
  - number: 14.b
    text: |-
      hij op andere wijze in zodanige mate te kort schiet in hetgeen van hem als beoefenaar van de diergeneeskunde mag
      worden verwacht, dat daardoor voor de gezondheidszorg voor dieren ernstige schade kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel14
  - number: '15'
    text: |-
      Op een para-veterinair, een dierverloskundige of een kastreur kunnen een of meer van de maatregelen, bedoeld in
      [artikel 16][ref1], worden toegepast, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel16
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '16'
        hoofdstuk: III
  - number: 15.a
    text: |-
      hij door enig handelen of nalaten te kort schiet in de zorg die hij in zijn hoedanigheid behoort te betrachten ten
      opzichte van een of meer dieren met betrekking tot welke zijn hulp is ingeroepen, wordt verleend of in geval van
      nood behoort te worden verleend;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel15
  - number: 15.b
    text: |-
      hij op andere wijze in zodanige mate te kort schiet in hetgeen van hem als beoefenaar van de diergeneeskunde in
      beperkte omvang mag worden verwacht, dat daardoor voor de gezondheidszorg voor dieren ernstige schade kan ontstaan.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel15
  - number: '16.1'
    text: |-
      De maatregelen die op grond van de [artikelen 14][ref1] en [15][ref2] kunnen worden opgelegd, zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: 16.1.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: 16.1.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: 16.1.c
    text: |-
      geldboete van de tweede categorie als bedoeld in [artikel 23, vierde lid, van het Wetboek van strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '23'
  - number: 16.1.d
    text: |-
      gehele of gedeeltelijke schorsing voor ten hoogste een jaar van een dierenarts, para-veterinair, dierverloskundige
      of kastreur in de hem bij of krachtens deze wet verleende bevoegdheid tot uitoefening van de diergeneeskunde;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: 16.1.e
    text: |-
      gehele of gedeeltelijke ontzegging aan een dierenarts, para-veterinair, dierverloskundige of kastreur van de hem
      bij of krachtens deze wet verleende bevoegdheid tot uitoefening van de diergeneeskunde.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: '16.2'
    text: |-
      De in het eerste lid, onder *c*, vermelde maatregel kan gelijktijdig worden opgelegd met een der maatregelen,
      vermeld [onder ][ref1] en [][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel16
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '16'
        hoofdstuk: III
  - number: '16.3'
    text: |-
      Bij oplegging van de maatregelen, vermeld in het eerste lid, onder *a-d*, kan tevens worden bevolen dat de
      beslissing in de *Nederlandse Staatscourant* zal worden bekendgemaakt en aan in de beslissing aangewezen
      tijdschriften of nieuwsbladen ter bekendmaking zal worden aangeboden, al dan niet met weglating van de namen of de
      woonplaatsen van de daarin genoemde personen, alsmede van andere gegevens welke omtrent die personen aanwijzingen
      bevatten.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: '16.4'
    text: |-
      Een beslissing waarbij de maatregel, vermeld in het eerste lid, onder *e*, is opgelegd, wordt steeds bekendgemaakt
      op de in het derde lid omschreven wijze.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: '16.5'
    text: |-
      De geldboete komt ten bate van de Staat. In de beslissing kunnen twee of meer termijnen worden vastgesteld waarin
      zij moet worden voldaan. Degene aan wie een boete is opgelegd, wordt door een door Onze Minister aan te wijzen
      ambtenaar bij gedagtekende brief uitgenodigd de verschuldigde geldboete binnen de gestelde termijn dan wel met
      inachtneming van de gestelde termijnen te betalen, onder kennisgeving dat de schuldenaar anders door de middelen
      bij de wet bepaald tot betaling zal worden gedwongen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: '16.6'
    text: |-
      Indien de schuldenaar niet binnen de gestelde termijn betaalt, maant de ambtenaar hem schriftelijk aan om alsnog
      binnen tien dagen na de dagtekening van de aanmaning te betalen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: '16.7'
    text: |-
      Indien de schuldenaar na de aanmaning in gebreke blijft, kan de invordering van de verschuldigde geldboete en de
      aanmaningskosten geschieden bij een door de ambtenaar uit te vaardigen dwangbevel.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: '16.8'
    text: |-
      De betekening en de tenuitvoerlegging van een dwangbevel geschieden door de zorg van de ontvanger, bedoeld in
      [artikel 2, eerste lid, onderdeel i, van de Invorderingswet 1990][ref1], en door de belastingdeurwaarder, bedoeld
      in [artikel 2, eerste lid, onderdeel j, van die wet][ref2] met toepassing van de [artikelen 13][ref3] en [14][ref4]
      van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0004770#Artikel14
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '13'
      - id: ref4
        bwb_id: BWBR0004770
        artikel: '14'
  - number: '16.9'
    text: |-
      Zolang de ontvanger met de zorg voor de invordering is belast, kan hij een vordering doen op grond van
      [artikel 19 van de Invorderingswet 1990][ref1] alsmede verrekenen op grond van [artikel 24][ref2] van die wet.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel24
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '24'
  - number: '16.10'
    text: |-
      De ontvanger kan zolang hij met de zorg voor de invordering is belast onder door hem te stellen voorwaarden aan
      een schuldenaar voor een bepaalde tijd schriftelijk uitstel van betaling verlenen. Gedurende het uitstel wordt de
      dwanginvordering geschorst. Het uitstel kan tussentijds schriftelijk worden beëindigd.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
  - number: '16.11'
    text: |-
      Met betrekking tot het verzet tegen de tenuitvoerlegging van een dwangbevel is
      [artikel 17 van de Invorderingswet 1990][ref1] van overeenkomstige toepassing met dien verstande dat in dat artikel
      voor "de ontvanger die het dwangbevel heeft uitgevaardigd" telkens moet worden gelezen: de met de tenuitvoerlegging
      van het dwangbevel belaste ontvanger.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel17
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '17'
  - number: '16.12'
    text: |-
      De kosten van aanmaning en van verdere vervolging worden berekend op de voet van de
      [Kostenwet invordering rijksbelastingen][ref1] (*Stb.* 1969, 83). De [artikelen 6][ref2] en
      [7 van de Invorderingswet 1990][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002645
      [ref2]: https://wetten.overheid.nl/BWBR0004770#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0004770#Artikel7
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0002645
      - id: ref2
        bwb_id: BWBR0004770
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0004770
        artikel: '7'
  - number: '17.1'
    text: |-
      Bij de oplegging van de maatregelen, vermeld in [artikel 16, eerste lid, onder ][ref1], kan worden bevolen
      dat daaraan geheel of voor een bepaald gedeelte geen uitvoering zal worden gegeven, tenzij bij latere
      beslissing anders mocht worden gelast op grond dat de betrokkene voor het einde van een bij het bevel te
      bepalen proeftijd van ten hoogste drie jaren zich heeft schuldig gemaakt aan een gedraging, bedoeld in
      [artikel 14, onderscheidenlijk in artikel 15][ref2], dan wel gedurende die proeftijd een bijzondere voorwaarde,
      welke in de beslissing mocht zijn gesteld, niet heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '16'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: '17.2'
    text: |-
      Bij de beslissing bedoeld in het eerste lid kan als bijzondere voorwaarde worden gesteld dat de betrokken
      dierenarts, para-veterinair, dierverloskundige of kastreur de door zijn gedraging veroorzaakte schade geheel of tot
      een bij de beslissing te bepalen gedeelte binnen een daarbij te stellen termijn, korter dan de proeftijd, vergoedt.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel17
  - number: '18.1'
    text: |-
      In bijzondere gevallen kunnen Wij, het veterinaire tuchtcollege gehoord, de dierenarts, para-veterinair,
      dierverloskundige of kastreur, aan wie de hem bij of krachtens deze wet verleende bevoegdheid tot uitoefening van
      de diergeneeskunde geheel of gedeeltelijk is ontzegd, op zijn verzoek in die bevoegdheid herstellen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel18
  - number: '18.2'
    text: Herstel kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel18
  - number: '19.1'
    text: Er is een veterinair tuchtcollege dat is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel19
  - number: '19.2'
    text: |-
      Het veterinair tuchtcollege is belast met de behandeling in eerste aanleg van zaken, de [artikelen 14][ref1] en
      [15][ref2] betreffende.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: '19.3'
    text: 'Het veterinair tuchtcollege bestaat uit de volgende leden:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel19
  - number: 19.3.a
    text: een rechtsgeleerde die voorzitter is;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel19
  - number: 19.3.b
    text: vier dierenartsen en een door Onze Ministers te bepalen aantal para-veterinairen, dierverloskundigen en kastreurs.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel19
  - number: '19.4'
    text: |-
      De in het derde lid bedoelde dierenartsen, para-veterinairen, dierverloskundigen en kastreurs dienen werkzaam te
      zijn op het gebied van de uitoefening van de diergeneeskunde.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel19
  - number: '20.1'
    text: |-
      De voorzitter en de overige leden, alsmede voor elk hunner een of meer plaatsvervangers, worden voor de tijd van
      zes jaren door Onze Ministers benoemd. Zij zijn bij hun aftreden weder benoembaar. Op eigen verzoek kunnen zij door
      Onze Ministers worden ontslagen. De benoemingstermijn van hem die wordt benoemd ter vervulling van een tussentijdse
      vacature, eindigt bij het verstrijken van de benoemingstermijn van degene in wiens plaats hij is getreden.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel20
  - number: '20.2'
    text: |-
      Voor de in het eerste lid bedoelde plaatsvervangers gelden dezelfde vereisten van benoembaarheid als voor de leden
      die zij vervangen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel20
  - number: '20.3'
    text: |-
      Het veterinair tuchtcollege heeft een secretaris en zo nodig een plaatsvervangend secretaris die rechtsgeleerden
      zijn. Zij worden door Onze Ministers benoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel20
  - number: '20.4'
    text: |-
      Onze Ministers verlenen aan de leden en hun plaatsvervangers ontslag met ingang van de maand, volgend op
      die, waarin de betrokkenen de leeftijd van zeventig jaren hebben bereikt. Zij verlenen aan de leden en hun
      plaatsvervangers eveneens ontslag bij verlies van een vereiste voor hun benoembaarheid.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel20
  - number: '21.1'
    text: |-
      Tussen de leden, de plaatsvervangende leden, de secretaris en de plaatsvervangend secretaris mag niet bestaan de
      verhouding van echtgenoten, geregistreerde partners” bloed- en aanverwanten tot de derde graad ingesloten, een
      maatschap of ander duurzaam samenwerkingsverband tot het uitoefenen van de diergeneeskunde of de verhouding van
      werkgever tot werknemer.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel21
  - number: '21.2'
    text: |-
      Indien het huwelijk of het geregistreerd partnerschap eerst mocht worden aangegaan na de benoeming, zal de
      jongstbenoemde der echtgenoten of geregistreerde partners zijn ambt niet kunnen behouden.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel21
  - number: '21.3'
    text: |-
      Indien de aanverwantschap eerst mocht zijn ontstaan na de benoeming, zal degene, die haar veroorzaakte, zijn ambt
      niet kunnen behouden, behoudens door Onze Ministers te verlenen vergunning.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel21
  - number: '21.4'
    text: De aanverwantschap houdt op door de ontbinding van het huwelijk dat haar veroorzaakte.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel21
  - number: '22'
    text: |-
      Het in de [artikelen 46c, tweede lid](onbekend), [46d, tweede lid](onbekend), [46f](onbekend), [46g, eerste en
      tweede lid](onbekend), [46i met uitzondering van het eerste lid, onderdeel c](onbekend), [46j](onbekend), [46l,
      eerste lid, onderdeel a, en derde lid](onbekend), [46m](onbekend), [46o](onbekend)en [46p, eerste tot en met vijfde
      lid, van de Wet rechtspositie rechterlijke ambtenaren](onbekend) voor de leden van de rechterlijke macht bepaalde
      is van overeenkomstige toepassing ten aanzien van de leden van het veterinair tuchtcollege en hun plaatsvervangers.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel22
  - number: '23.1'
    text: |-
      De voorzitter is bevoegd ambtshalve aan de leden en hun plaatsvervangers, die de waardigheid van hun ambt, hun
      ambtsbezigheden of ambtsplichten verwaarlozen of die zich schuldig maken aan overtreding van [artikel 24][ref1], de
      nodige waarschuwing te doen, na hen in de gelegenheid te hebben gesteld om te worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel24
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '24'
        hoofdstuk: III
        afdeling: '1'
  - number: '23.2'
    text: |-
      De voorzitter van het veterinair beroepscollege, bedoeld in [artikel 26][ref1], heeft gelijke bevoegdheid ten
      aanzien van de voorzitter van het veterinair tuchtcollege en diens plaatsvervangers.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel26
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '26'
        hoofdstuk: III
        afdeling: '2'
  - number: '24.1'
    text: |-
      Zij die deel uitmaken van het veterinair tuchtcollege en hun plaatsvervangers mogen zich noch direct noch
      indirect over enige aangelegenheid, welke door hen behandeld wordt of waarvan zij weten of vermoeden dat deze
      door hen behandeld zal worden, in enig bijzonder onderhoud of gesprek inlaten met partijen of hun raadslieden of
      gemachtigden, noch daarover enige bijzondere inlichting of schriftelijk stuk aannemen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel24
  - number: '24.2'
    text: |-
      Het is hun die deel uitmaken van het veterinair tuchtcollege, en hun plaatsvervangers verboden hetgeen zij als
      zodang te weten zijn gekomen verder bekend te maken dan voor de uitoefening van hun functie gevorderd wordt. De
      verplichting tot geheimhouding geldt niet tegenover ambtenaren van politie of justitie, voor zover mededeling aan
      hen op grond van een wettelijk voorschrift is vereist.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel24
  - number: '24.3'
    text: |-
      Zij die deel uitmaken van het veterinair tuchtcollege en hun plaatsvervangers zijn verplicht het geheim te bewaren
      omtrent de gevoelens die in de raadkamer over aanhangige zaken zijn geuit.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel24
  - number: '24.4'
    text: |-
      Het bepaalde in het tweede en derde lid geldt ook voor de secretaris van het veterinair tuchtcollege en zijn
      plaatsvervanger.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel24
  - number: '25'
    text: |-
      De voorzitter, de overige leden en hun plaatsvervangers, ontvangen een vacatiegeld, alsmede van reis- en
      verblijfkosten en van verdere verschotten, volgens door Onze Ministers te stellen regelen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel25
  - number: '26.1'
    text: Er is een veterinair beroepscollege dat is gevestigd te 's-Gravenhage.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel26
  - number: '26.2'
    text: |-
      Het veterinair beroepscollege is, onverminderd het in [artikel 27][ref1] bepaalde, belast met de behandeling in
      beroep van zaken, de [artikelen 14][ref2] en [15][ref3] betreffende.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '27'
        hoofdstuk: III
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: '26.3'
    text: 'Het veterinair beroepscollege bestaat uit de volgende leden:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel26
  - number: 26.3.a
    text: drie rechtsgeleerden waarvan één voorzitter is;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel26
  - number: 26.3.b
    text: twee dierenartsen en een door Onze Ministers te bepalen aantal para-veterinairen, dierverloskundigen en kastreurs.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel26
  - number: '26.4'
    text: |-
      De in het derde lid bedoelde dierenartsen, para-veterinairen, dierverloskundigen en kastreurs dienen werkzaam te
      zijn op het gebied van de uitoefening van de diergeneeskunde.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel26
  - number: '26.5'
    text: |-
      Het lidmaatschap van het veterinair beroepscollege is niet verenigbaar met het lidmaatschap van het veterinair
      tuchtcollege. Het bepaalde in de [artikelen 20-23, eerste lid][ref1], [24][ref2] en [25][ref3] is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel25
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '20'
        hoofdstuk: III
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '24'
        hoofdstuk: III
        afdeling: '1'
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '25'
        hoofdstuk: III
        afdeling: '1'
  - number: '27.1'
    text: Het veterinair beroepscollege waakt tegen nodeloze vertraging van het onderzoek door het veterinair tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel27
  - number: '27.2'
    text: |-
      Het veterinair beroepscollege kan zich de stukken doen overleggen en een termijn stellen, binnen welke de
      beslissing moet zijn genomen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel27
  - number: '27.3'
    text: |-
      Indien het veterinair tuchtcollege hieraan niet voldoet, kan het veterinair beroepscollege de behandeling van de
      zaak aan zich trekken en in hoogste ressort beslissen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel27
  - number: '28'
    text: |-
      Het veterinair tuchtcollege houdt zitting in een samenstelling bestaande uit vijf leden, te weten de voorzitter,
      alsmede:
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel28
  - number: 28.a
    text: 'indien de klacht gericht is tegen een dierenarts: vier dierenartsen;'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel28
  - number: 28.b
    text: 'indien de klacht is gericht tegen een para-veterinair: twee para-veterinairen en twee dierenartsen;'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel28
  - number: 28.c
    text: 'indien de klacht gericht is tegen een dierverloskundige: twee dierverloskundigen en twee dierenartsen;'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel28
  - number: 28.d
    text: 'indien de klacht gericht is tegen een kastreur: twee kastreurs en twee dierenartsen.'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel28
  - number: '29.1'
    text: |-
      Een zaak, [artikel 14][ref1] of [artikel 15][ref2] betreffende, wordt bij het veterinair tuchtcollege aanhangig
      gemaakt door een schriftelijke klacht van degene die rechtstreeks in zijn belang is getroffen, dan wel van een door
      Onze Minister aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: '29.2'
    text: |-
      Zodra een klacht is ingekomen, stelt de voorzitter een voorlopig onderzoek in. De ambtenaar, bedoeld in het vorige
      lid, verleent daarbij desgevraagd medewerking.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel29
  - number: '29.3'
    text: |-
      Blijkt dat de klacht is ingediend door iemand die daartoe niet ingevolge het eerste lid bevoegd is, dan verklaart
      het veterinair tuchtcollege de klager zonder nader onderzoek bij met reden omklede beslissing schriftelijk niet
      ontvankelijk. Blijkt dat de klacht kennelijk ongegrond is in die zin, dat de feiten waarop zij berust niet tot
      toepassing van [artikel 14][ref1] of [artikel 15][ref2] kunnen leiden, dan kan het veterinair tuchtcollege zonder
      verder onderzoek de klacht bij met reden omklede beslissing schriftelijk afwijzen.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: '29.4'
    text: |-
      Intrekken van de klacht, nadat deze is ingekomen, of staking van de werkzaamheden door de persoon over wie geklaagd
      is, heeft op de verdere behandeling geen invloed, wanneer naar het oordeel van de in het eerste lid bedoelde
      ambtenaar het algemeen belang vordert, dat de behandeling wordt voortgezet of wanneer de persoon over wie geklaagd
      is, schriftelijk heeft verklaard voortzetting van de behandeling van de klacht te verlangen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel29
  - number: '30.1'
    text: |-
      Zij die deel uitmaken van het veterinair tuchtcollege kunnen zich verschonen en kunnen worden gewraakt, indien te
      hunnen aanzien feiten of omstandigheden bestaan, waardoor in het algemeen de rechterlijke onpartijdigheid schade
      zou kunnen lijden.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel30
  - number: '30.2'
    text: |-
      Over wraking of verschoning wordt ten spoedigste beslist door hen die deel uitmaken van het veterinair
      tuchtcollege, met uitzondering van degene die wordt gewraakt of die verlangt zich te verschonen. Bij staking van
      stemmen wordt de wraking onderscheidenlijk de verschoning toegewezen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel30
  - number: '31.1'
    text: |-
      De behandeling van een zaak, [artikel 14][ref1] of [artikel 15][ref2] betreffende, door het veterinair tuchtcollege
      geschiedt in een openbare zitting, tenzij het veterinair tuchtcollege om gewichtige redenen beveelt, dat de
      behandeling van de zaak geheel of gedeeltelijk met gesloten deuren zal plaatsvinden. Het bevel daartoe houdt de
      overwegingen in waarop het steunt.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: '31.2'
    text: De beslissing in een door het veterinair tuchtcollege behandelde zaak wordt in het openbaar uitgesproken.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel31
  - number: '31.3'
    text: |-
      Tijd en plaats van een openbare zitting of van een openbare uitspraak worden ten minste veertien dagen en ten
      hoogste een maand tevoren in de *Staatscourant* bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel31
  - number: '32.1'
    text: |-
      Behoudens in de gevallen, bedoeld in [artikel 29, derde lid][ref1], neemt het veterinair tuchtcollege geen
      beslissing aangaande een ingediende klacht dan na verhoor, althans behoorlijke oproeping van de persoon over wie
      geklaagd is en van de klager.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '29'
        hoofdstuk: III
  - number: '32.2'
    text: |-
      De persoon over wie geklaagd is kan - tenzij het veterinair tuchtcollege beveelt dat hij in persoon zal verschijnen
        - zich ter terechtzitting doen vertegenwoordigen door een daartoe gemachtigde. Hij kan zich door een raadsman doen
      bijstaan.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel32
  - number: '32.3'
    text: |-
      Het veterinair tuchtcollege kan weigeren bepaalde personen die geen advocaat zijn, als gemachtigde of als raadsman
      toe te laten. Bij zodanige weigering houdt het veterinair tuchtcollege de zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel32
  - number: '32.4'
    text: |-
      De persoon over wie geklaagd is en zijn raadsman worden in de gelegenheid gesteld ten minste 14 dagen vóór de
      aanvang van het onderzoek op de terechtzitting van de processtukken kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel32
  - number: '33.1'
    text: |-
      Het veterinair tuchtcollege kan, hetzij ten verzoeke van de persoon over wie geklaagd is, hetzij ten verzoeke van
      de klager, hetzij ambtshalve, getuigen en deskundigen oproepen en horen. De oproeping geschiedt bij aangetekende
      brief. Ieder die als getuige of deskundige is opgeroepen, is verplicht aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel33
  - number: '33.2'
    text: |-
      Verschijnt een getuige of een deskundige op de oproeping niet, dan doet de officier van justitie bij de rechtbank
      te 's-Gravenhage op verzoek van het veterinair tuchtcollege hem dagvaarden. Hij is verplicht na dagvaarding te
      verschijnen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel33
  - number: '33.3'
    text: |-
      Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier van justitie, bedoeld in
      het vorige lid, op verzoek van het veterinair tuchtcollege hem andermaal dagvaarden, desverzocht met bevel tot
      medebrenging.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel33
  - number: '33.4'
    text: |-
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: '33.5'
    text: De getuigen zijn verplicht getuigenis af te leggen, de deskundigen hun diensten als zodanig te verlenen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel33
  - number: '33.6'
    text: |-
      Ten aanzien van getuigen en deskundigen zijn de [artikelen 217-219 van het Wetboek van Strafvordering][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: '33.7'
    text: |-
      De getuigen en deskundigen ontvangen desverkiezende op vertoon van hun oproeping of dagvaarding schadeloosstelling
      overeenkomstig het bij of krachtens de [Wet tarieven in strafzaken][ref1] (*Stb.* 1963, 130) bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0002406
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002406
  - number: '34'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regelen worden gesteld met betrekking tot de rechtsgang, welke
      waarborgen geven voor een deugdelijke berechting.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel34
  - number: '35.1'
    text: |-
      De beslissing van het veterinair tuchtcollege aangaande een ingediende klacht houdt de overweging in waarop zij
      steunt en wordt op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel35
  - number: '35.2'
    text: 'De secretaris van het veterinair tuchtcollege zendt van de beslissing onverwijld bij aangetekende brief afschrift:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel35
  - number: 35.2.a
    text: aan de persoon over wie geklaagd is;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel35
  - number: 35.2.b
    text: aan de klager;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel35
  - number: 35.2.c
    text: |-
      aan de ambtenaar, bedoeld in [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '29'
        hoofdstuk: III
  - number: '35.3'
    text: |-
      De secretaris van het veterinair tuchtcollege verstrekt desgevraagd aan de gerechten en het openbaar ministerie
      inlichtingen omtrent onherroepelijke beslissingen.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel35
  - number: '36'
    text: |-
      Beslissingen van het veterinair tuchtcollege, genomen met een ander aantal personen of in een andere samenstelling,
      dan is voorgeschreven, zijn nietig.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel36
  - number: '37.1'
    text: |-
      Tegen een beslissing van het veterinair tuchtcollege aangaande een ingediende klacht kan binnen twee maanden na de
      dag van verzending van de in [artikel 35, tweede lid][ref1], bedoelde aangetekende brief beroep worden ingesteld
      bij het veterinair beroepscollege:


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel35
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '35'
        hoofdstuk: III
  - number: 37.1.a
    text: door de persoon over wie geklaagd is, indien de klacht geheel of gedeeltelijk gegrond verklaard is;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
  - number: 37.1.b
    text: |-
      door de klager, indien zijn klacht geheel of gedeeltelijk ongegrond verklaard is dan wel indien ingevolge
      [artikel 29, derde lid][ref1], de klager niet-ontvankelijk is verklaard of zijn klacht is afgewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '29'
        hoofdstuk: III
  - number: 37.1.c
    text: |-
      door de ambtenaar, bedoeld in [artikel 29, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '29'
        hoofdstuk: III
  - number: '37.2'
    text: |-
      Het beroep wordt ingesteld bij een met redenen omkleed beroepschrift, te zamen met een gewaarmerkt afschrift van de
      beslissing, waartegen het beroep gericht is. Het beroep schorst de beslissing.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
  - number: '37.3'
    text: |-
      Het veterinair beroepscollege kan degene die beroep heeft ingesteld niet-ontvankelijk verklaren, het beroep
      verwerpen of het beroep gegrond verklaren.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
  - number: '37.4'
    text: |-
      Indien het veterinair beroepscollege het beroep gegrond verklaart dan wel bij de behandeling van het beroep op
      andere dan de in het beroepschrift aangevoerde gronden tot het oordeel komt, dat de in eerste aanleg gegeven
      beslissing niet kan worden gehandhaafd, vernietigt het deze beslissing en doet de zaak alsdan zelf af.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
  - number: '37.5'
    text: Het veterinair beroepscollege kan het veterinair tuchtcollege uitnodigen inlichtingen te verstrekken.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
  - number: '37.6'
    text: |-
      Indien alleen de persoon over wie geklaagd is, beroep heeft ingesteld, kan het veterinair beroepscollege slechts
      met eenparigheid van stemmen een beslissing geven die een wijziging te zijnen nadele brengt in hetgeen door het
      veterinair tuchtcollege was beslist.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel37
  - number: '38'
    text: |-
      Het veterinair beroepscollege houdt zitting in een samenstelling bestaande uit vijf leden, te weten de drie
      rechtsgeleerden waaronder de voorzitter, alsmede:
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel38
  - number: 38.a
    text: 'indien de klacht gericht is tegen een dierenarts: twee dierenartsen;'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel38
  - number: 38.b
    text: 'indien de klacht gericht is tegen een para-veterinair: een para-veterinair en een dierenarts;'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel38
  - number: 38.c
    text: 'indien de klacht gericht is tegen een dierverloskundige: een dierverloskundige en een dierenarts;'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel38
  - number: 38.d
    text: 'indien een klacht gericht is tegen een kastreur: een kastreur en een dierenarts.'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel38
  - number: '39'
    text: |-
      Het bepaalde in de [artikelen 30-34][ref1] en [36][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel36
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '30'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '36'
        hoofdstuk: III
  - number: '40.1'
    text: De beslissing in beroep houdt de overweging in waarop zij steunt en wordt op schrift gesteld.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel40
  - number: '40.2'
    text: |-
      De secretaris van het veterinair beroepscollege zendt van de beslissing onverwijld bij aangetekende brief
      afschrift:
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel40
  - number: 40.2.a
    text: aan de persoon over wie geklaagd is;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel40
  - number: 40.2.b
    text: aan de klager;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel40
  - number: 40.2.c
    text: |-
      aan de ambtenaar, bedoeld in [artikel 29, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '29'
        hoofdstuk: III
  - number: 40.2.d
    text: aan het veterinair tuchtcollege.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel40
  - number: '40.3'
    text: |-
      Hij verstrekt desgevraagd aan de gerechten en het openbaar ministerie inlichtingen omtrent beslissingen van het
      veterinair beroepscollege.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel40
  - number: '41'
    text: 'Bij algemene maatregel van bestuur kunnen regelen worden gesteld inzake:'
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel41
  - number: 41.a
    text: |-
      de tenuitvoerlegging van de maatregelen, vemeld in [artikel 16, eerste lid, onder ][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel16
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '16'
        hoofdstuk: III
  - number: 41.b
    text: |-
      de uitvoering van de bevelen, bedoeld in [artikel 17][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel17
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '17'
        hoofdstuk: III
  - number: 41.c
    text: |-
      de klachten, bedoeld in [artikel 29][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '29'
        hoofdstuk: III
  - number: 41.d
    text: al hetgeen verder voor een goede tuchtrechtspraak voorziening behoeft.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel41
  - number: '42.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel42
  - number: '42.2'
    text: |-
      Met de opsporing van de bij deze wet strafbaar gestelde feiten zijn, onverminderd
      [artikel 141 van het Wetboek van Strafvordering][ref1], belast de daartoe aangewezen buitengewone
      opsporingsambtenaren. Deze ambtenaren zijn tevens belast met de opsporing van feiten, strafbaar gesteld in
      de [artikelen 179 tot en met 182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor zover deze feiten
      betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '42.3'
    text: |-
      De in het eerste en tweede lid bedoelde ambtenaren die in de uitoefening van hun taak kennis bekomen van een
      tuchtvergrijp als bedoeld in [de artikelen 14][ref1] en [15][ref2], doen daarvan onverwijld mededeling aan de
      krachtens [artikel 29, eerste lid][ref3], aangewezen ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel29
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '29'
        hoofdstuk: III
  - number: '42.4'
    text: Van een besluit als bedoeld in dit artikel wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel42
  - number: '43'
    text: |-
      De in [artikel 42, tweede lid][ref1], bedoelde ambtenaren hebben toegang tot elke plaats, voor zover dat
      redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel42
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '42'
        hoofdstuk: IV
  - number: '44'
    text: |-
      De [artikelen 5:13][ref1] en [5:16 tot en met 5:20 van de Algemene wet bestuursrecht][ref2] zijn van
      overeenkomstige toepassing ten aanzien van de in [artikel 42, tweede lid][ref3], bedoelde ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel42
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '42'
        hoofdstuk: IV
  - number: '45'
    text: |-
      De in [artikel 42, tweede lid][ref1], bedoelde ambtenaren zijn voorts te allen tijde bevoegd tot inbeslagneming van
      daarvoor vatbare voorwerpen. Zij kunnen daartoe hun uitlevering vorderen.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel42
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '42'
        hoofdstuk: IV
  - number: '47.1'
    text: |-
      Overtreding van het bepaalde bij de [artikelen 7, eerste lid][ref1], en [8][ref2], en het bepaalde krachtens
      de [artikelen 4, eerste lid][ref3], [6, tweede lid][ref4], [11, derde lid][ref5], [12][ref6] en [12][ref7] wordt
      gestraft met geldboete van de derde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004730#Artikel6
      [ref5]: https://wetten.overheid.nl/BWBR0004730#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0004730#Artikel12
      [ref7]: https://wetten.overheid.nl/BWBR0004730#Artikel12a
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '7'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '8'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '4'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0004730
        artikel: '6'
        hoofdstuk: II
      - id: ref5
        bwb_id: BWBR0004730
        artikel: '11'
        hoofdstuk: II
      - id: ref6
        bwb_id: BWBR0004730
        artikel: '12'
        hoofdstuk: II
      - id: ref7
        bwb_id: BWBR0004730
        artikel: 12a
        hoofdstuk: II
  - number: '47.2'
    text: |-
      Overtreding van het bepaalde bij [artikel 46][ref1] en bij of krachtens [artikel 9][ref2] wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel9
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '46'
        hoofdstuk: IV
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '9'
        hoofdstuk: II
  - number: '48'
    text: |-
      De bij [artikel 47][ref1] strafbaar gestelde feiten worden beschouwd als overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0004730#Artikel47
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0004730
        artikel: '47'
        hoofdstuk: IV
  - number: '49'
    text: |-
      Het bepaalde in [artikel 195 van het Wetboek van Strafrecht][ref1] vindt overeenkomstige toepassing ten aanzien van
      een persoon, bedoeld in de [artikelen 14][ref2] en [15][ref3],


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0004730#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel15
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '195'
      - id: ref2
        bwb_id: BWBR0004730
        artikel: '14'
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0004730
        artikel: '15'
        hoofdstuk: III
  - number: 49.1°
    text: |-
      die, hoewel hij bij onherroepelijk geworden uitspraak geheel of gedeeltelijk is geschorst in de uitoefening van de
      hem bij of krachtens deze wet verleende bevoegdheid tot uitoefening van de diergeneeskunde, tijdens die schorsing
      de diergeneeskunde of het onderdeel ervan waarop die uitspraak betrekking heeft, uitoefent;
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel49
  - number: 49.2°
    text: |-
      die, hoewel hem bij onherroepelijk geworden uitspraak de hem bij of krachtens deze wet verleende bevoegdheid tot
      uitoefening van de diergeneeskunde geheel of gedeeltelijk is ontzegd, de diergeneeskunde of het onderdeel ervan
      waarop die uitspraak betrekking heeft, uitoefent.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel49
  - number: '50'
    text: |-
      De krachtens deze wet vastgestelde regelen van algemene aard worden, voor zover zij niet zijn vervat in een
      algemene maatregel van bestuur, bekendgemaakt in de Nederlandse Staatscourant.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel50
  - number: '51'
    text: De Wet op de Uitoefening van de Diergeneeskunst (*Stb.* 1954, 372) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel51
  - number: '52.1'
    text: |-
      Deze wet kan worden aangehaald als: Wet op de uitoefening van de diergeneeskunde, met bijvoeging van het jaartal
      van het *Staatsblad* waarin zij is geplaatst.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel52
  - number: '52.2'
    text: |-
      Zij treedt in werking op een door Ons te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen van
      artikelen verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#Artikel52
