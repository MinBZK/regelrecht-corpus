preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het noodzakelijk is nieuwe regelen te stellen met betrekking tot de
    uitoefening van de diergeneeskunde, en tevens voorzieningen te treffen inzake de tuchtrechtspraak voor personen die
    de diergeneeskunde, al dan niet in volle omvang, uitoefenen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0004730/2005-03-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: Onze Minister: Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit; Onze Ministers: Onze Ministers van Landbouw, Natuur en Voedselkwaliteit
      en van Justitie gezamenlijk; dierenarts: degene a. aan wie op grond van het afleggen van een examen
      van een opleiding in het wetenschappelijk onderwijs door een universiteit dan wel de Open Universiteit
      waarop de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] betrekking heeft, de graad
      Master op het gebied van de diergeneeskunde is verleend, of b. die op grond van het met goed gevolg
      afleggen van een afsluitend examen van de opleiding diergeneeskunde in het bezit is van een getuigschrift
      van het met goed gevolg afgelegd hebben van het afsluitend examen van die opleiding, bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2]. para-veterinair: degene die krachtens
      [artikel 4][ref3] is toegelaten tot de uitoefening van de diergeneeskunde in beperkte omvang; dierverloskundige:
      degene die ingevolge [artikel 5][ref4] is toegelaten tot de daarbedoelde handelingen; kastreur: degene die
      ingevolge [artikel 6][ref5] is toegelaten tot de daarbedoelde handelingen; onvruchtbaar maken: het tijdelijk of
      blijvend opheffen van het vermogen van een mannelijk of vrouwelijk dier tot voortplanting; operatie: instrumentele
      ingreep bij dieren, gepaard gaande met verbreking van de natuurlijke samenhang van levende weefsels, het afnemen
      van bloed daaronder begrepen; diergeneesmiddel en biologisch diagnosticum: hetgeen daaronder wordt verstaan in
      de [Diergeneesmiddelenwet][ref6]; houder van dieren: eigenaar, houder of hoeder van dieren; uitoefening van de
      diergeneeskunde: 'het als beroep verrichten van een of meer der navolgende handelingen: a. het onderzoeken van'
      een dier, het voorschrijven of toepassen van een behandeling, operatie daaronder begrepen, bij een dier, één en
      ander voor zover zulks strekt ter voorkoming of genezing van een infectieziekte of een parasitaire ziekte bij dat
      dier dan wel ter genezing, leniging, onderkenning of opheffing van een aandoening, ziekte, ziekteverschijnsel,
      in- of uitwendig letsel, pijn of gebrek bij dat dier; b. het toepassen bij een dier van algemene of plaatselijke
      verdoving, bedwelming in slachterijen of slachthuizen daaronder niet begrepen; c. het verlenen van hulp met
      betrekking tot de geboorte of verwijdering van een vrucht van een dier, waaronder begrepen het verrichten van
      daarmede verband houdende operaties; d. het onvruchtbaar maken van een dier; e. het verrichten op een gezond dier
      van andere operaties dan die welke behoren tot de onder *c* en *d* genoemde handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005682
      [ref2]: https://wetten.overheid.nl/BWBR0005682
      [ref3]: https://wetten.overheid.nl/BWBR0004730#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0004730#Artikel5
      [ref5]: https://wetten.overheid.nl/BWBR0004730#Artikel6
      [ref6]: https://wetten.overheid.nl/BWBR0003818
