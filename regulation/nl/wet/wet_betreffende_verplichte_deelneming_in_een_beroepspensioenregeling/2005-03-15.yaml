  - number: '22'
    text: |-
      Telkenjare brengt de Pensioen- & Verzekeringskamer aan Ons verslag uit omtrent haar bevindingen betreffende de
      toepassing van deze wet.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel22
  - number: '23'
    text: |-
      De rechtspersoon is verplicht tot vergoeding van kosten, welke aan de uitvoering van deze wet zijn verbonden. Onze
      Minister stelt hiervoor nadere regelen vast.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel23
  - number: '25'
    text: Bij algemene maatregel van bestuur kunnen nadere regelen tot uitvoering van deze wet worden gegeven.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel25
  - number: '26'
    text: |-
      Onze Minister kan in bijzondere, individuele gevallen voorwaardelijk of onvoorwaardelijk en al of niet voor
      een bepaalde tijd van het bepaalde bij of krachtens de [artikelen 2, eerste en vierde lid][ref1], [7][ref2],
      [8, eerste en tweede lid][ref3], [15][ref4], [18][ref5], [25][ref6] en [29][ref7] vrijstelling verlenen. De
      Pensioen- & Verzekeringskamer verstrekt Onze Minister desgevraagd de ter zake benodigde inlichtingen.


