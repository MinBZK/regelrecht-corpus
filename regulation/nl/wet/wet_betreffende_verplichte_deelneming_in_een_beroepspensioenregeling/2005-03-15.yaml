        artikel: '2'
  - number: '2'
    text: |-
      1 Onze Minister kan, op verzoek van een of meer naar zijn oordeel voor de betrokken tak van beroep voldoende
      representatieve organisaties van beroepsgenoten, het deelnemen in een door beroepsgenoten vastgestelde
      beroepspensioenregeling voor alle of een of meer bepaalde groepen van beroepsgenoten verplicht stellen. De Sociaal-
      Economische Raad en de Pensioen- & Verzekeringskamer verstrekken Onze Minister desgevraagd de ter zake benodigde
      inlichtingen.

      2 Een beroepspensioenregeling houdt in:

      a. hetzij de oprichting van een beroepspensioenfonds, dat in een zodanige regeling als uitvoeringsorgaan van die
      regeling is opgenomen;

      b. hetzij de verplichting voor de betrokken beroepsgenoten tot het nakomen van de beroepspensioenregeling door
      middel van overeenkomsten van verzekering naar eigen keuze van de deelnemer te sluiten met onder a bedoelde
      beroepspensioenfonds, voorzover de beroepspensioenregeling hiertoe de mogelijkheid opent, of met een verzekeraar:

      1°. die in het bezit is van de ingevolge [artikel 24, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref1]
      vereiste vergunning of heeft voldaan aan de ingevolge [artikel 37][ref2] of [38 van die wet][ref3] vereiste
      procedure met betrekking tot een bijkantoor in Nederland; of

      2°. die heeft voldaan aan de vereiste procedure als bedoeld in de
      [artikelen 111, eerste lid, onderdelen a tot en met c, of tweede lid][ref4],
      [113, eerste of vierde lid][ref5], [116, eerste lid, onderdelen a tot en met c, of derde lid][ref6], of
      [118, tweede of vijfde lid, van genoemde wet][ref7] indien het de aldaar bedoelde dienstverrichting naar Nederland
      betreft;

      c. hetzij voor een deel van de regeling het onder a, voor het overblijvende deel van de regeling het onder b
      bepaalde.

      3 Alvorens een verzoek, als in het eerste lid bedoeld, wordt ingewilligd, is onderscheidenlijk zijn de organisatie
      of organisaties van beroepsgenoten verplicht een rechtspersoon met volledige rechtsbevoegdheid in het leven te
      roepen, welke blijkens zijn statuten en reglementen:

      a. hetzij als beroepspensioenfonds de beroepspensioenregeling zal uitvoeren;

      b. hetzij erop zal toezien, dat de betrokken beroepsgenoten de beroepspensioenregeling nakomen op de wijze als in
      artikel 2, tweede lid, onder b, bedoeld;

      c. hetzij een deel van de beroepspensioenregeling als beroepspensioenfonds zal uitvoeren en voor het overblijvende
      deel van de beroepspensioenregeling erop zal toezien, dat de betrokken beroepsgenoten dit deel nakomen op de wijze
      als in artikel 2, tweede lid, onder b, bedoeld.

      4 Indien ingevolge het eerste lid het deelnemen in een beroepspensioenregeling is verplicht gesteld, zijn degenen,
      voor wie deze verplichtstelling geldt, verplicht tot naleving van het bij of krachtens de statuten en reglementen
      van de rechtspersoon te hunnen aanzien bepaalde.

      5 De in het vierde lid opgelegde verplichting geldt niet ten aanzien van bepalingen van de statuten en reglementen,
      welke ten doel hebben de beslissing van de rechter omtrent twistgedingen uit te sluiten.

      6 De verplichting tot het deelnemen in een beroepspensioenregeling kan door Onze Minister voor alle of een
      of meer bepaalde groepen van beroepsgenoten worden ingetrokken. De Sociaal-Economische Raad en de Pensioen- &
      Verzekeringskamer verstrekken Onze Minister desgevraagd de ter zake benodigde inlichtingen.

      7 De verplichting tot het deelnemen in een beroepspensioenregeling wordt ingetrokken, indien:

      a. wijziging wordt gebracht in de financiële opzet van het beroepspensioenfonds en de grondslagen, waarop het rust,
      zoals deze blijken uit de in [artikel 5, eerste lid, onder b][ref8], bedoelde actuariële nota;

      b. de statuten en reglementen van de rechtspersoon worden gewijzigd,

      tenzij Onze Minister heeft verklaard tegen die wijzigingen geen bedenkingen te hebben. De Sociaal-Economische Raad
      en de Pensioen- & Verzekeringskamer verstrekken Onze Minister desgevraagd de ter zake benodigde inlichtingen.

      8 Van de bevoegdheden, bedoeld in het eerste, zesde en zevende lid, kan mandaat worden verleend.


