preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een wettelijke regeling vast te stellen betreffende
    verplichte deelneming in een beroepspensioenregeling;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bepaalde bij of krachtens deze wet wordt verstaan onder:

      a. Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;

      b. beroepsgenoot: een natuurlijk persoon, die in een bepaalde tak van beroep het tot die tak van beroep behorende
      beroep uitoefent;

      c. pensioen: ouderdoms-, invaliditeits-, weduwen-, weduwnaars-, partner- en wezenpensioen alsmede pensioen ten
      behoeve van de achtergebleven geregistreerde partner;

      d. beroepspensioenregeling: een regeling van pensioen in de betrokken tak van beroep ten behoeve van beroepsgenoten
      en gewezen beroepsgenoten;

      e. rechtspersoon: de rechtspersoon als in [artikel 2, derde lid][ref1], bedoeld;

      f. beroepspensioenfonds: een in een tak van beroep werkend fonds, dat is opgericht ter uitvoering van een
      beroepspensioenregeling;

      g. deelnemer: ieder, die ingevolge de statuten en enig pensioenreglement, vastgesteld voor een
      beroepspensioenregeling, in die regeling deelneemt;

      h. "Pensioen- & Verzekeringskamer": de Pensioen- & Verzekeringskamer, bedoeld in
      [artikel 2, eerste lid, van de Wet toezicht verzekeringsbedrijf 1993][ref2].

      2 Een beroepspensioenregeling kan meer dan één tak van beroep omvatten; ook kan de werking van zodanige regeling
      zijn beperkt tot een deel van een tak van beroep en een deel van het land.


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006509#Artikel2
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel1
