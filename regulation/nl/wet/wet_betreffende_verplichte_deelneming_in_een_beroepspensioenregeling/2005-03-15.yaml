  - number: '27'
    text: |-
      1 Hij, die niet voldoet aan het bepaalde in [artikel 2, vierde lid][ref1], 16, derde lid, 17, 18 of 20, tweede en
      vierde lid, 21, tweede lid, wordt gestraft met geldboete van de tweede categorie.

      2 Hij, die niet voldoet aan het bepaalde in [artikel 16, eerste en tweede lid][ref2], voor zover in de statuten
      of reglementen van de rechtspersoon is bepaald, dat iedere beroepsgenoot verplicht is tot het bijhouden van een
      boekhouding, als in het eerste lid van dat artikel bedoeld, wordt gestraft met geldboete van de tweede categorie.

      3 Op hem, die onderworpen is aan een in de betrokken tak van beroep op of krachtens de wet gebaseerde
      tuchtrechtspraak, welke mede betrekking heeft op de in dit artikel met betrekking tot [artikel 16][ref3] strafbaar
      gestelde feiten, is het bepaalde in het [eerste en tweede lid van artikel 27][ref4] niet van toepassing.

      4 Met gelijke straf als in het eerste lid aangeduid wordt gestraft overtreding van voorschriften, krachtens deze
      wet gegeven, voor zover uitdrukkelijk als strafbaar feit in de zin van dit artikel aangeduid.

      5 De bij of krachtens deze wet strafbaar gestelde feiten worden beschouwd als overtredingen.


