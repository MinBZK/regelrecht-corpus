  - number: '3'
    text: |-
      Onze Minister doet mededeling in de *Staatscourant* van:

      a. de indiening van een verzoek, als in [artikel 2, eerste lid][ref1], bedoeld, waarbij tevens de termijn wordt
      vermeld, waarbinnen zienswijzen schriftelijk bij hem naar voren kunnen worden gebracht;

      b. de verplichtstelling van het deelnemen in een beroepspensioenregeling;

      c. de verklaring van geen bedenkingen ten aanzien van wijziging van de statuten en reglementen van de
      rechtspersoon;

      d. de intrekking van een verplichtstelling van het deelnemen in een beroepspensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel2
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel3
