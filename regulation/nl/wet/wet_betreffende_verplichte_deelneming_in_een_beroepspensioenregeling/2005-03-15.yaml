        artikel: '2'
  - number: '4'
    text: |-
      Indien het verzoek, als in [artikel 2, eerste lid][ref1], bedoeld, niet is ingediend door een of meer, naar
      het oordeel van Onze Minister voor de betrokken tak van beroep voldoende representatieve, organisaties van
      beroepsgenoten, of de in [artikel 3, onder ][ref2], bedoelde zienswijzen hem daartoe aanleiding geven, kan Onze
      Minister de verzoekers in de gelegenheid stellen hem aannemelijk te maken, dat een belangrijke meerderheid van
      beroepsgenoten het verzoek ondersteunt. Blijkt dit het geval te zijn, dan zijn de verzoekers ontvankelijk. In het
      laatste geval is het bepaalde in [artikel 2, eerste lid][ref3], overigens van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002830#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002830#Artikel2
