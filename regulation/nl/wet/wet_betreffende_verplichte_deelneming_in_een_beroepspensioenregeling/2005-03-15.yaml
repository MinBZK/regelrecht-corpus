  - number: '5'
    text: |-
      1 Een verzoek, als in [artikel 2, eerste lid][ref1], bedoeld, wordt niet ingewilligd, indien:

      a. Onze Minister niet is gebleken, dat de beroepsgenoten door de betrokken organisatie of organisaties
      van beroepsgenoten tijdig op de hoogte zijn gesteld van het voornemen tot een verzoek als in
      [artikel 2, eerste lid][ref2], bedoeld;

      b. Onze Minister bedenkingen heeft tegen de financiële opzet van een beroepspensioenfonds en de grondslagen, waarop
      het rust, zoals deze blijken uit een bij het verzoek te voegen gemotiveerde actuariële nota;

      c. in de statuten en reglementen van de rechtspersoon, die geheel of gedeeltelijk als beroepspensioenfonds
      de beroepspensioenregeling zal uitvoeren, bepalingen ontbreken, welke beantwoorden aan de in de
      [artikelen 2, derde lid, sub ][ref3], [7][ref4], [8, eerste en tweede lid][ref5], en [15][ref6] alsmede
      de [artikelen 5][ref7], [9][ref8], [10][ref9] en [10b van de Pensioen- en spaarfondsenwet][ref10]
      gegeven voorschriften, behoudens in gevallen, waarin [artikel 26][ref11] dan wel
      [artikel 29 van de Pensioen- en spaarfondsenwet][ref12] toepassing vindt;

      d. in de statuten en reglementen van de rechtspersoon, die, overeenkomstig [artikel 2, derde lid, onder ][ref13],
      toezicht op de nakoming van de beroepspensioenregeling zal houden, bepalingen ontbreken, welke beantwoorden
      aan de in de [artikelen 2, derde lid, sub ][ref14], [7][ref15], [8, eerste lid][ref16], en [15][ref17], alsmede
      [artikel 5 van de Pensioen en spaarfondsenwet][ref18] gegeven voorschriften, behoudens in gevallen, waarin
      [artikel 26][ref19] dan wel [artikel 29 van de Pensioen- en spaarfondsenwet][ref20] toepassing vindt;

      e. Onze Minister van oordeel is, dat de belangen der deelnemers, gewezen deelnemers en andere belanghebbenden niet
      voldoende zijn gewaarborgd in de statuten en reglementen van de rechtspersoon;

      f. Onze Minister bedenkingen heeft tegen een of meer bepalingen van de statuten en reglementen van de
      rechtspersoon.

      2 Onze Minister kan, met betrekking tot het eerste lid nadere regels vaststellen.


