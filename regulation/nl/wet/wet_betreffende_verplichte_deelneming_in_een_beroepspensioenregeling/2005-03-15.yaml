  - number: '6'
    text: |-
      Met betrekking tot een beroepspensioenregeling, ten aanzien waarvan [artikel 2, eerste lid][ref1], toepassing heeft
      gevonden, geldt gedurende de tijd, dat de verplichting tot het deelnemen in de regeling bestaat, het bepaalde bij
      of krachtens de [artikelen 7][ref2] tot en met [31][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002830#Artikel7
