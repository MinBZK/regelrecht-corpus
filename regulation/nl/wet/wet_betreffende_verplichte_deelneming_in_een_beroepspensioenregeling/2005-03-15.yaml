  - number: '7'
    text: |-
      Het bestuur van de rechtspersoon wordt gevormd door daartoe door de deelnemers of door de in
      [artikel 2, eerste lid][ref1], bedoelde representatieve organisatie of organisaties van beroepsgenoten aangewezen
      personen.


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel2
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0002830
        artikel: '2'
  - number: '8'
    text: |-
      1 In de statuten en reglementen van de rechtspersoon worden bepalingen opgenomen betreffende:

      a. de tak van beroep of het deel van de tak van beroep en het deel van het land, waarvoor de
      beroepspensioenregeling geldt;

      b. de doelstelling van de rechtspersoon;

      c. het beheer van de rechtspersoon;

      d. de wijze, waarop de bestuursleden worden aangewezen;

      e. de categorieën van deelnemers en hun aanspraken, rechten en verplichtingen;

      f. de aanspraken, rechten en verplichtingen van de deelnemers voor het geval hun verplichting tot het deelnemen
      ingevolge [artikel 2, zesde lid][ref1], wordt ingetrokken;

      g. de wijze, waarop tegemoet wordt gekomen ten aanzien van personen, die gemoedsbezwaren hebben tegen elke vorm
      van verzekering;

      h. de wijziging van de statuten en reglementen.

      2 In de statuten en reglementen van de rechtspersoon, die als beroepspensioenfonds de beroepspensioenregeling zal
      uitvoeren, worden bovendien bepalingen opgenomen betreffende:

      a. de inkomsten van het fonds;

      b. de belegging van de gelden;

      c. de liquidatie van het fonds, met name ook wat betreft de verplichtingen van de liquidateurs en de bestemming van
      de bezittingen van het fonds;

      d. de wijziging van de aanspraken, rechten en verplichtingen van de deelnemers, gewezen deelnemers en overige
      belanghebbenden in gevallen, waarin de financiële toestand van het fonds daartoe aanleiding geeft.

      3 Onze Minister kan met betrekking tot het eerste en tweede lid nadere regels vaststellen.


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel2
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0002830
        artikel: '2'
  - number: '14'
    text: |-
      Het bestuur van de rechtspersoon is verplicht aan Onze Minister mededeling te doen van alle genomen besluiten van
      algemene strekking.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel14
  - number: '15'
    text: |-
      1 Het bestuur van de rechtspersoon zorgt, dat de belanghebbenden in het bezit worden gesteld van de geldende
      statuten en reglementen van de rechtspersoon.

      2 Het bestuur van de rechtspersoon verstrekt op verzoek aan de deelnemer en de gewezen deelnemer binnen drie
      maanden een opgave van de hoogte van de opgebouwde aanspraken.

      Het bestuur van de rechtspersoon kan een vergoeding vragen van de aan de opgave verbonden kosten.

      3 Jaarlijks verstrekt het bestuur van de rechtspersoon de beroepsgenoot een opgave van de aan het
      desbetreffende of voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen. Het eerste jaar
      waarover de opgave van de waardeaangroei van de pensioenaanspraken als bedoeld in de eerste volzin wordt verstrekt
      is 2001.

      4 Het bestuur van de rechtspersoon verstrekt op verzoek van de beroepsgenoot een opgave van de over
      de jaren 1994 tot en met 2000 toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref2] en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3.127
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3.127'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3.127'
  - number: '16'
    text: |-
      1 In de statuten of enig pensioenreglement van de rechtspersoon kan worden bepaald, dat iedere beroepsgenoot
      verplicht is tot het bijhouden van een zodanige boekhouding, dat daaruit de gegevens blijken welke de rechtspersoon
      nodig heeft voor de vaststelling van het deelnemerschap en van de aanspraken, rechten en verplichtingen van die
      beroepsgenoot.

      2 Iedere beroepsgenoot is verplicht de rechtspersoon inzage te verlenen in de in het eerste lid bedoelde
      boekhouding en in de bescheiden die daaraan ten grondslag liggen, voor zover daaruit de in dat lid bedoelde
      gegevens zijn af te leiden.

      3 Iedere beroepsgenoot is verplicht desverlangd de inlichtingen te verstrekken welke de rechtspersoon nodig heeft
      voor de vaststelling van het deelnemerschap en van de aanspraken, rechten en verplichtingen van die beroepsgenoot.

      4 Degene, die de inzage van de boekhouding en bescheiden en de verstrekking van de gegevens, in de voorgaande leden
      bedoeld, weigert, kan zich niet met vrucht beroepen op enige geheimhoudingsplicht, ook niet al mocht deze hem bij
      wetsvoorschrift zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel16
  - number: '17'
    text: |-
      1 Ieder van de bestuurders van de rechtspersoon is verplicht te zorgen, dat het bepaalde bij of krachtens deze
      wet en de [Pensioen- en spaarfondsenwet ][ref1]alsmede de bepalingen van de statuten en reglementen van de
      rechtspersoon worden nageleefd.

      2 Ieder van de bestuurders van een beroepspensioenfonds is verplicht te zorgen, dat het beleid van het fonds
      wordt gevoerd overeenkomstig de in [artikel 9b van de Pensioen- en spaarfondsenwet][ref2] bedoelde actuariële en
      bedrijfstechnische nota.


      [ref1]: https://wetten.overheid.nl/BWBR0002089
      [ref2]: https://wetten.overheid.nl/BWBR0002089#Artikel9b
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002089
      - id: ref2
        bwb_id: BWBR0002089
        artikel: 9b
  - number: '18'
    text: |-
      Ieder van de bestuurders en ieder lid van het personeel van de rechtspersoon is verplicht kosteloos aan de
      Pensioen- & Verzekeringskamer de inlichtingen te verstrekken welke deze verlangt.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel18
  - number: 18a
    text: |-
      1 Het toezicht op de uitvoering van deze wet berust bij de Pensioen- & Verzekeringskamer.

      2 Onze Minister kan met betrekking tot de uitvoering van de [artikelen 8][ref1], [16][ref2] en [29][ref3] aan de
      Pensioen- & Verzekeringskamer aanwijzingen van algemene aard geven betreffende de uitoefening van de haar bij of
      krachtens deze wet opgelegde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002830#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002830#Artikel29
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel18a
