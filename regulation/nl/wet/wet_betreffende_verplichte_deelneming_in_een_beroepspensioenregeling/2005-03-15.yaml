  - number: '28'
    text: |-
      Van burgerlijke rechtsvorderingen ter zake van deelneming in en uitkering op grond van een beroepspensioenregeling
      neemt de kantonrechter kennis.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel28
  - number: 28a
    text: |-
      In afwijking van[artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond van
      deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel87
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel28a
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 8:7
  - number: '29'
    text: |-
      1 Overdracht, inpandgeving of elke andere handeling, waardoor de deelnemer of gewezen deelnemer enig recht op
      zijn pensioen of op zijn aanspraak op pensioen aan een ander toekent, is slechts geldig indien zij geschiedt met
      goedkeuring van de rechtspersoon. Aan deze goedkeuring kunnen beperkingen en voorwaarden worden verbonden. Zij is
      bovendien slechts geldig voor zover beslag op het pensioen geldig zou zijn bij ontbreken van andere inkomsten.

      2 Volmacht tot invordering van het pensioen, onder welke vorm of welke benaming ook verleend, is steeds
      herroepelijk.

      3 Elk beding, strijdig met een van de voorgaande leden is nietig.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel29
  - number: '30'
    text: |-
      Inlichtingen uit de basisadministratie persoonsgegevens en inlichtingen en uittreksels uit de registers van de
      burgerlijke stand, welke met het oog op deelneming in een beroepspensioenregeling of uitkering op grond van een
      beroepspensioenregeling ten aanzien van deelnemers of gewezen deelnemers in een zodanige regeling worden gevraagd,
      zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0002830/2005-03-15#Artikel30
  - number: '31'
    text: |-
      1

      2 Indien na aanneming bij aangetekende brief een met betrekking tot de rechtspersoon ter zake van achterstallige
      premies ontstane schuld binnen dertig dagen niet wordt voldaan, kan de rechtspersoon, ten deze vertegenwoordigd
      door zijn voorzitter en secretaris, daarna die schuld invorderen bij dwangbevel.

      3 De in het vorige lid bedoelde aanmaning vermeldt de tekst van het tweede en vijfde tot en met negende lid van dit
      artikel en van het vierde lid van artikel 2.

      4 Het dwangbevel houdt in:

      a. de naam en de zetel van het beroepspensioenfonds;

      b. de naam van de voorzitter en van de secretaris van het fonds;

      c. de naam, het beroep, de woonplaats en het adres van de schuldenaar;

      d. het bedrag van de achterstallige premies en dat van de wettelijke of reglementaire renten of reglementaire
      boeten, voor zover daarop aanspraak wordt gemaakt, alsmede de gronden waarop de vordering berust;

      e. de datum waarop de in het tweede lid van dit artikel bedoelde aanmaning is geschied;

      f. de tekst van het zesde en zevende lid van dit artikel.

      5 Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] kan worden tenuitvoergelegd.

      6 Het dwangbevel kan niet ten uitvoer worden gelegd voordat acht dagen na de betekening daarvan zijn verstreken.
      Degene, aan wie het dwangbevel is gericht, kan gedurende dertig dagen na de betekening door middel van
      dagvaarding in verzet komen bij de kantonrechter van de rechtbank van het arrondissement waarin hij zijn woon- of
      verblijfplaats heeft.

      7 Het verzet stuit de tenuitvoerlegging van het dwangbevel; een aangevangen tenuitvoerlegging wordt geschorst.

      8 Indien het verzet zich richt of mede richt tegen de hoogte van de gevorderde rente of boete en deze de rechter
      bovenmatig voorkomt, kan hij die ten aanzien van het hem voorgelegde geval verminderen of opheffen.

      9 Het recht tot invordering bij dwangbevel strekt zich uit tot de kosten van vervolging.


