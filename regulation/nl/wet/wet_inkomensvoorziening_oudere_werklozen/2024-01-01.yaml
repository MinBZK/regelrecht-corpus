preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een inkomensvoorziening voor oudere werkloze werknemers
    tot stand te brengen in verband met de wijziging van het WW-stelsel en de bijzondere arbeidsmarktpositie van
    ouderen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - *aanvrager:* de persoon
      die een aanvraag voor een uitkering op grond van deze wet heeft ingediend dan wel schriftelijke toestemming heeft
      gegeven om een aanvraag in te dienen;
        - *eerste dag van werkloosheid:* de eerste dag van werkloosheid, bedoeld in
      [artikel 16a van de Werkloosheidswet][ref1];
        - *minimumloon:* het minimumloon per maand, bedoeld in
      [artikel 8, eerste lid, onderdeel b, van de Wet minimumloon en minimumvakantiebijslag][ref2];
        - *Onze Minister:* Onze Minister van Sociale Zaken en Werkgelegenheid;
        - *re-integratiebedrijf:* een natuurlijke persoon dan wel een rechtspersoon die in het kader van de uitoefening van
      beroep of bedrijf de inschakeling van personen in de arbeid bevordert;
        - *uitkeringsgerechtigde:* de persoon die recht heeft op een uitkering op grond van deze wet;
        - *uitreiziger:* persoon ten aanzien van wie op grond van een melding van de opsporingsdiensten of inlichtingen-
      en veiligheidsdiensten, gericht aan het UWV, is gebleken dat het gegronde vermoeden bestaat dat deze persoon zich
      buiten Nederland bevindt met het doel om zich aan te sluiten bij een organisatie die is geplaatst op de lijst van
      organisaties, bedoeld in [artikel 14, vierde lid, van de Rijkswet op het Nederlanderschap][ref3];
        - *UWV:* Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref4];
        - *vrijheidsstraf of vrijheidsbenemende maatregel:* een bij onherroepelijk geworden vonnis opgelegde vrijheidsstraf
      of vrijheidsbenemende maatregel als bedoeld in het [Wetboek van Strafrecht][ref5];
        - *werkgever:* de werkgever in de zin van de [Werkloosheidswet][ref6];
        - *werknemer:* de werknemer in de zin van de [Werkloosheidswet][ref7];
        - *WGA-uitkering:* de werkhervattingsuitkering gedeeltelijk arbeidsgeschikten, bedoeld in
      [hoofdstuk 7, van de Wet werk en inkomen naar arbeidsvermogen][ref8].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel16a
      [ref2]: https://wetten.overheid.nl/BWBR0002638#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0003738#Artikel14
