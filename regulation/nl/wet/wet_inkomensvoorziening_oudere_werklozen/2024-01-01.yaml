      [ref5]: https://wetten.overheid.nl/BWBR0001854
      [ref6]: https://wetten.overheid.nl/BWBR0004045
      [ref7]: https://wetten.overheid.nl/BWBR0004045
      [ref8]: https://wetten.overheid.nl/BWBR0019057#Hoofdstuk7
