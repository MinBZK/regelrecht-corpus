  - number: '2.1'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.1.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.1.b
    text: 'gehuwd: als partner geregistreerd;'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.1.c
    text: 'gehuwde: als partner geregistreerde.'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: '2.2'
    text: 'Voor de toepassing van deze wet en de daarop berustende bepalingen wordt:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.2.a
    text: |-
      als gehuwd of als echtgenoot mede aangemerkt de ongehuwde meerderjarige die met een andere ongehuwde meerderjarige
      een gezamenlijke huishouding voert, tenzij het betreft een bloedverwant in de eerste graad of een bloedverwant in
      de tweede graad indien er bij één van de bloedverwanten in de tweede graad sprake is van zorgbehoefte;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.2.b
    text: als ongehuwd mede aangemerkt de persoon die duurzaam gescheiden leeft van de persoon met wie hij gehuwd is.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: '2.3'
    text: |-
      Van een gezamenlijke huishouding is sprake indien twee personen hun hoofdverblijf in dezelfde woning hebben en zij
      blijk geven zorg te dragen voor elkaar door middel van het leveren van een bijdrage in de kosten van de huishouding
      dan wel anderszins.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: '2.4'
    text: |-
      Een gezamenlijke huishouding wordt in ieder geval aanwezig geacht indien de betrokkenen hun hoofdverblijf hebben in
      dezelfde woning, en:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.4.a
    text: |-
      zij met elkaar gehuwd zijn geweest of in de periode van twee jaar voorafgaand aan de aanvraag van een uitkering op
      grond van deze wet voor de toepassing van deze wet daarmee gelijk zijn gesteld;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.4.b
    text: uit hun relatie een kind is geboren of erkenning heeft plaatsgevonden van een kind van de een door de ander;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.4.c
    text: |-
      zij zich wederzijds verplicht hebben tot een bijdrage aan de huishouding op grond van een geldend
      samenlevingscontract; of
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: 2.4.d
    text: |-
      zij op grond van een registratie worden aangemerkt als een gezamenlijke huishouding die naar aard en strekking
      overeenkomt met de gezamenlijke huishouding, bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: '2.5'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot hetgeen wordt verstaan onder het
      blijk geven zorg te dragen voor een ander als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: '2.6'
    text: |-
      Bij algemene maatregel van bestuur wordt vastgesteld welke registraties, en gedurende welk tijdvak, in aanmerking
      worden genomen voor de toepassing van het vierde lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: '2.7'
    text: |-
      Onder bloedverwant in de eerste graad als bedoeld in het tweede lid, onderdeel a, wordt mede verstaan een
      meerderjarig aangehuwd kind of een meerderjarig voormalig pleegkind van de ongehuwde meerderjarige.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
  - number: '2.8'
    text: |-
      Onder voormalig pleegkind als bedoeld in het zevende lid wordt verstaan een pleegkind voor wie de ongehuwde
      meerderjarige een pleegvergoeding ontving of ontvangt op grond van de [Wet op de jeugdzorg][ref1] of de
      [Jeugdwet][ref2], of kinderbijslag ontving op grond van de [Algemene Kinderbijslagwet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0016637
      [ref2]: https://wetten.overheid.nl/BWBR0034925
      [ref3]: https://wetten.overheid.nl/BWBR0002368
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0016637
      - id: ref2
        bwb_id: BWBR0034925
      - id: ref3
        bwb_id: BWBR0002368
  - number: '3.1'
    text: 'Recht op uitkering op grond van deze wet heeft de persoon:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
  - number: 3.1.a
    text: wiens eerste dag van werkloosheid tussen 30 september 2006 en 1 januari 2024 ligt;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
  - number: 3.1.b
    text: die op die dag 60 jaar en 4 maanden of ouder is;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
  - number: 3.1.c
    text: |-
      die op die dag voldeed aan de voorwaarde, bedoeld in
      [artikel 42, tweede lid, onderdeel a of b, van de Werkloosheidswet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '42'
  - number: 3.1.d
    text: |-
      op wie geen uitsluitingsgrond van toepassing is als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.2'
    text: 'Tevens heeft recht op uitkering op grond van deze wet de persoon:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
  - number: 3.2.a
    text: |-
      die terzake van een eerder recht op uitkering op grond van de [Werkloosheidswet][ref1] aan de voorwaarden, bedoeld
      in het eerste lid, onderdelen a, b en c, voldoet;


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: 3.2.b
    text: |-
      voor wie nadien een nieuw recht op uitkering op grond van de Werkloosheidswet is ontstaan terzake waarvan
      [artikel 42b van de Werkloosheidswet][ref1] toepassing heeft gevonden of terzake waarvan voldaan is aan de
      voorwaarde, bedoeld in [artikel 42, tweede lid, onderdeel a of b, van de Werkloosheidswet][ref2], en


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel42b
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel42
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 42b
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '42'
  - number: 3.2.c
    text: |-
      op wie geen uitsluitingsgrond van toepassing is als bedoeld in [artikel 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '3.3'
    text: |-
      Het tweede lid is niet van toepassing indien het eerdere recht, bedoeld in het tweede lid, onderdeel a,
      geheel niet geldend is gemaakt als gevolg van een maatregel van blijvend gehele weigering als bedoeld in
      [artikel 27, eerste en tweede lid, van de Werkloosheidswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: '27'
  - number: '3.4'
    text: |-
      Het recht op uitkering ontstaat op de dag na de dag waarop de geldende uitkeringsduur op grond
      van de [Werkloosheidswet][ref1] is verstreken, tenzij op de dag voorafgaand aan het verstrijken
      van de uitkeringsduur een maatregel van blijvend gehele weigering van de uitkering op grond van
      [artikel 27, eerste of tweede lid, van de Werkloosheidswet][ref2] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0004045#Artikel27
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0004045
        artikel: '27'
  - number: 3a.1
    text: 'Recht op een uitkering op grond van deze wet heeft tevens de persoon:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3a
  - number: 3a.1.a
    text: |-
      voor wie tussen 31 december 2007 en 1 januari 2024 recht is ontstaan op de loongerelateerde uitkering van de WGA-
      uitkering;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3a
  - number: 3a.1.b
    text: |-
      die op de dag dat het recht op de loongerelateerde uitkering van de WGA-uitkering ontstond 60 jaar en 4 maanden of
      ouder is, en
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3a
  - number: 3a.1.c
    text: |-
      op wie geen uitsluitingsgrond als bedoeld in [artikel 6][ref1] van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 3a.2
    text: |-
      Het recht op een uitkering op grond van dit artikel ontstaat op de dag na de dag waarop de geldende uitkeringsduur
      van de loongerelateerde uitkering van de WGA-uitkering is verstreken en kan niet eerder ontstaan dan na
      inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3a
  - number: 3a.3
    text: |-
      Het eerste lid is niet van toepassing indien
      [artikel 59, zesde lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] toepassing heeft gevonden, tenzij
      de eerste dag van de werkloosheid op grond waarvan een uitkering op grond van de [Werkloosheidswet][ref2] werd
      ontvangen als bedoeld in dat artikel, lag op of na 1 oktober 2006 en de persoon op die dag 60 jaar en 4 maanden of
      ouder was.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '59'
      - id: ref2
        bwb_id: BWBR0004045
  - number: '4.1'
    text: Het UWV stelt op aanvraag vast of recht op een uitkering op grond van deze wet bestaat.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel4
  - number: '4.2'
    text: Een aanvraag wordt ingediend bij het UWV.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel4
  - number: '4.3'
    text: |-
      Het recht op uitkering kan niet worden vastgesteld over perioden gelegen voor 26 weken voorafgaand aan de dag
      waarop de aanvraag om uitkering werd ingediend. Het UWV is bevoegd in bijzondere gevallen af te wijken van de
      vorige zin.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel4
  - number: '5'
    text: |-
      Indien geen recht op uitkering is ontstaan omdat op de persoon, bedoeld in [artikel 3, eerste lid][ref1], en
      [artikel 3a, eerste lid][ref2], een of meer uitsluitingsgronden van toepassing waren, ontstaat alsnog recht op die
      uitkering op de dag dat zich geen van deze uitsluitingsgronden meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel3a
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '6.1'
    text: 'Voor het recht op uitkering gelden de volgende uitsluitingsgronden:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.1.a
    text: het buiten Nederland wonen of verblijf houden anders dan wegens vakantie;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.1.b
    text: |-
      het niet rechtmatig verblijf houden in de zin van [artikel 8 van de Vreemdelingenwet 2000][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0011823#Artikel8
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0011823
        artikel: '8'
  - number: 6.1.c
    text: het rechtens zijn vrijheid zijn ontnomen;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.1.d
    text: het zich onttrekken aan de tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.1.e
    text: het genieten van vakantie;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.1.f
    text: |-
      het bereiken of bereikt hebben van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: 6.1.g
    text: een uitreiziger zijn.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: '6.2'
    text: |-
      Het eerste lid, onderdeel a, is niet van toepassing ten aanzien van de persoon die gedurende het buitenlands
      verblijf meewerkt aan activiteiten die bevorderlijk zijn voor zijn inschakeling in de arbeid, mits:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.2.a
    text: die activiteiten niet langer duren dan zes maanden;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.2.b
    text: |-
      die activiteiten blijkens een intentieverklaring een reëel uitzicht bieden op een aansluitende dienstbetrekking
      voor ten minste zes maanden;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.2.c
    text: |-
      die activiteiten plaatsvinden in een lidstaat van de Europese Unie, in een andere staat die partij is bij de
      Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland; en
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.2.d
    text: |-
      het bedrag dat het UWV is verschuldigd ter zake van die activiteiten niet hoger is dan het op grond van
      [artikel 4.2, derde lid, van het Besluit SUWI][ref1] vastgestelde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0013267#Artikel4
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013267
        artikel: '4'
  - number: '6.3'
    text: |-
      Voor de toepassing van dit artikel wordt onder intentieverklaring verstaan: een ondertekende verklaring waarin de
      ondertekenaar aangeeft dat hij het voornemen heeft om een persoon die meewerkt aan activiteiten die bevorderlijk
      zijn voor zijn inschakeling in de arbeid, na afloop van die activiteiten in dienst te nemen.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: '6.4'
    text: |-
      Het eerste lid, onderdeel c, is niet van toepassing op bij algemene maatregel van bestuur aan te wijzen categorieën
      personen waarbij tenuitvoerlegging van een vrijheidsstraf of vrijheidsbenemende maatregel plaatsvindt buiten een
      penitentiaire inrichting of een instelling voor de verpleging van ter beschikking gestelden.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: '6.5'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld voor gevallen waarin toepassing van het eerste lid,
      onderdelen a tot en met e en onderdeel g, tot onbillijkheden zou kunnen leiden, op grond waarvan die onderdelen
      niet van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: '6.6'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.6.a
    text: het begrip vakantie genieten, bedoeld in het eerste lid, onderdeel e;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: 6.6.b
    text: |-
      de vaststelling van de periode gedurende welke de aanvrager of uitkeringsgerechtigde in afwijking van het eerste
      lid, onderdeel d, met behoud van zijn recht op uitkering vakantie kan genieten.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel6
  - number: '7'
    text: 'Het recht op een uitkering eindigt:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel7
  - number: 7.a
    text: met ingang van de dag waarop er ten aanzien van de uitkeringsgerechtigde een uitsluitingsgrond van toepassing is;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel7
  - number: 7.b
    text: de dag volgend op de dag waarop de uitkeringsgerechtigde overlijdt.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel7
  - number: '8'
    text: |-
      Indien geen recht op een uitkering meer bestaat omdat op de persoon, bedoeld in [artikel 3, eerste lid][ref1], en
      [artikel 3a, eerste lid][ref2], een of meer uitsluitingsgronden als bedoeld in [artikel 6][ref3] van toepassing
      waren, herleeft het recht op die uitkering op de dag dat zich ten aanzien van die persoon geen van deze
      uitsluitingsgronden meer voordoet.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel3a
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '9.1'
    text: |-
      Onverminderd [artikel 19][ref1] herziet het UWV beschikkingen op grond van deze wet of trekt dergelijke
      beschikkingen in, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel19
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '19'
        hoofdstuk: '4'
  - number: 9.1.a
    text: |-
      als gevolg van het niet of niet volledig nakomen van [artikel 12][ref1], [13][ref2], [14][ref3] of [15][ref4] en de
      daarop berustende bepalingen het recht op een uitkering ten onrechte is vastgesteld of de hoogte van de uitkering
      ten onrechte op een te hoog bedrag is vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0024394#Artikel15
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '13'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '14'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0024394
        artikel: '15'
        hoofdstuk: '3'
  - number: 9.1.b
    text: anderszins de uitkering ten onrechte of tot een te hoog bedrag is vastgesteld;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel9
  - number: 9.1.c
    text: |-
      het niet of niet behoorlijk nakomen van de verplichting bedoeld in [artikel 12][ref1] ertoe leidt dat niet kan
      worden vastgesteld of nog recht op uitkering bestaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '9.2'
    text: Indien daarvoor dringende redenen zijn, kan het UWV geheel of gedeeltelijk van herziening of intrekking afzien.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel9
  - number: '10.1'
    text: 'De uitkering bedraagt per kalendermaand: 0,7 x (A – B). Hierbij staat A voor:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
  - number: 10.1.a
    text: |-
      het maandloon, bedoeld in [artikel 1b, tweede lid, onderdeel a, van de Werkloosheidswet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0004045#Artikel1b
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
        artikel: 1b
  - number: 10.1.b
    text: |-
      het maandloon, bedoeld in
      [artikel 13, vierde lid, onderdeel a, van de Wet werk en inkomen naar arbeidsvermogen][ref1],
      met dien verstande dat A niet meer bedraagt dan 10/7 maal het bedrag, genoemd in
      [artikel 2, tweede lid, onderdeel b, onder 1°, van de Toeslagenwet][ref2] vermenigvuldigd met 21,75; en B staat
      voor het inkomen per kalendermaand.


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel2
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '13'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '2'
  - number: '10.2'
    text: |-
      Het bedrag, bedoeld in het eerste lid, wordt herzien op de wijze als bedoeld in
      [artikel 14 van de Wet minimumloon en minimumvakantiebijslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel14
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '14'
  - number: '10.3'
    text: Onder inkomen als bedoeld in het eerste lid wordt verstaan inkomen uit arbeid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
  - number: '10.4'
    text: Op de uitkering wordt overig inkomen geheel in mindering gebracht.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
  - number: '10.5'
    text: |-
      Bij algemene maatregel van bestuur wordt bepaald wat wordt verstaan onder inkomen uit arbeid als bedoeld in het
      derde lid en overig inkomen als bedoeld in het vierde lid. Daarbij kan tevens worden bepaald dat nader te bepalen
      inkomen dat gedeeltelijk, niet of niet langer wordt genoten als gevolg van gewijzigde omstandigheden of enig
      handelen of nalaten van betrokkene in aanmerking wordt genomen alsof het wel volledig wordt genoten.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
  - number: '10.6'
    text: |-
      Voor zover het recht op uitkering op grond van de [Werkloosheidswet][ref1] gedeeltelijk is geëindigd door het
      verrichten van werkzaamheden als lid van de Eerste Kamer der Staten-Generaal, van een vertegenwoordigend orgaan
      van een publiekrechtelijk lichaam dat bij rechtstreekse verkiezing wordt samengesteld, of een algemeen bestuur
      van een waterschap, staat bij de toepassing van het eerste lid A, in afwijking in zoverre van het eerste lid, voor
      het minimumloon.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0004045
  - number: '11'
    text: |-
      De uitkeringsgerechtigde heeft recht op ondersteuning bij arbeidsinschakeling en met inachtneming van de daarvoor
      geldende wettelijke bepalingen, op de naar het oordeel van het UWV noodzakelijk geachte voorziening gericht op
      arbeidsinschakeling.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel11
  - number: '12.1'
    text: |-
      De aanvrager, de uitkeringsgerechtigde en de instelling waaraan op grond van [artikel 30][ref1] een uitkering
      op grond van deze wet wordt uitbetaald, verstrekt op verzoek of uit eigen beweging zo spoedig mogelijk alle
      informatie, waarvan het hem redelijkerwijs duidelijk moet zijn dat die van invloed kan zijn op het recht op
      uitkering, de hoogte van de uitkering of de betaling van de uitkering, waaronder mede is begrepen informatie in het
      kader van re-integratie, aan het UWV. Deze verplichting geldt niet voor zover een recht op uitkering niet geldend
      kan worden gemaakt als gevolg van een blijvend gehele weigering. Deze verplichting geldt niet indien die feiten
      en omstandigheden door het UWV kunnen worden vastgesteld op grond van bij wettelijk voorschrift als authentiek
      aangemerkte gegevens of kunnen worden verkregen uit bij ministeriële regeling aan te wijzen administraties. Bij
      ministeriële regeling wordt bepaald voor welke gegevens de tweede zin van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel30
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '30'
        hoofdstuk: '5'
  - number: '12.2'
    text: 'De aanvrager en de uitkeringsgerechtigde:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: 12.2.a
    text: |-
      voldoen aan elke oproep van het UWV of van een of meer door het UWV aangewezen personen om aanwezig te zijn op een
      door of vanwege het UWV te bepalen plaats voor beantwoording van vragen als bedoeld in onderdeel b, het meewerken
      aan onderzoek als bedoeld in onderdeel c of het naleven van de controlevoorschriften, bedoeld in onderdeel d;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: 12.2.b
    text: |-
      beantwoorden vragen die door het UWV of door een of meer door het UWV aangewezen personen in verband met het recht
      op uitkering op grond van deze wet worden gesteld;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: 12.2.c
    text: |-
      werken mee aan een voor hen gewenst onderzoek naar hun arbeidsgeschiktheid door een arts, een psycholoog of een
      beroepskeuze-adviseur;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: 12.2.d
    text: |-
      leven door het UWV vastgestelde voorschriften als bedoeld in [artikel 17][ref1] na.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel17
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '17'
        hoofdstuk: '3'
  - number: '12.3'
    text: 'De verplichtingen, bedoeld in het eerste en tweede lid, zijn van overeenkomstige toepassing ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: 12.3.a
    text: het re-integratiebedrijf dat in opdracht van het UWV werkzaamheden verricht; of
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: 12.3.b
    text: |-
      personen die met toestemming van het UWV zijn aangewezen door een re-integratiebedrijf als bedoeld in onderdeel
      a, voor zover dit noodzakelijk is voor de uitvoering van de bij overeenkomst aan deze personen en rechtspersonen
      opgedragen taken.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: '12.4'
    text: |-
      De uitkeringsgerechtigde die bij deelname aan een re-integratietraject zijn re-integratieverplichtingen niet
      naleeft, deelt de reden daarvan onmiddellijk mede aan het re-integratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel12
  - number: '13.1'
    text: |-
      De aanvrager en de uitkeringsgerechtigde gedragen zich zodanig dat zij door hun doen en laten het Toeslagenfonds,
      bedoeld in [artikel 31 van de Toeslagenwet][ref1], niet benadelen of zouden kunnen benadelen. Onder benadeling in
      de zin van dit lid is niet begrepen een gedraging als bedoeld in [artikel 12][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0004043#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0004043
        artikel: '31'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '13.2'
    text: |-
      De aanvrager en de uitkeringsgerechtigde voorkomen dat zij door eigen toedoen geen algemeen geaccepteerde arbeid
      behouden.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel13
  - number: '13.3'
    text: |-
      De aanvrager of de uitkeringsgerechtigde heeft door eigen toedoen geen algemeen geaccepteerde arbeid behouden
      indien:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel13
  - number: 13.3.a
    text: |-
      hieraan een dringende reden ten grondslag ligt in de zin van
      [artikel 678 van Boek 7 van het Burgerlijk Wetboek][ref1] en de aanvrager of de uitkeringsgerechtigde ter zake een
      verwijt gemaakt kan worden;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel678
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '678'
  - number: 13.3.b
    text: |-
      de dienstbetrekking is beëindigd door of op verzoek van de aanvrager of de uitkeringsgerechtigde zonder dat aan de
      voortzetting ervan zodanige bezwaren waren verbonden, dat deze voortzetting redelijkerwijs niet van hem kon worden
      gevergd.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel13
  - number: '13.4'
    text: |-
      Het niet voeren van verweer door de aanvrager of de uitkeringsgerechtigde tegen of het instemmen van de aanvrager
      of de uitkeringsgerechtigde met de beëindiging van de dienstbetrekking door of op verzoek van de werkgever leidt
      niet tot overtreding van de verplichting, bedoeld in het eerste of tweede lid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel13
  - number: '14.1'
    text: |-
      De aanvrager en de uitkeringsgerechtigde trachten in voldoende mate de mogelijkheden tot het verrichten van
      algemeen geaccepteerde arbeid te behouden of te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel14
  - number: '14.2'
    text: |-
      Ter naleving van de plicht, bedoeld in het eerste lid, zijn de aanvrager en de uitkeringsgerechtigde in elk geval
      verplicht:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel14
  - number: 14.2.a
    text: |-
      zich geneeskundig te laten behandelen of aanwijzingen van een arts op te volgen indien het UWV of het re-
      integratiebedrijf in opdracht van het UWV, op grond van het advies van een arts daartoe opdracht geeft en de
      genezing niet te belemmeren;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel14
  - number: 14.2.b
    text: |-
      mee te werken aan activiteiten of werkzaamheden, gericht op inschakeling in de arbeid, die het UWV wenselijk acht
      voor verkrijging van mogelijkheden tot verrichten van algemeen geaccepteerde arbeid;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel14
  - number: 14.2.c
    text: |-
      mee te werken aan aanpassing van de arbeidsplaats en aan persoongebonden voorzieningen die het UWV verstrekt voor
      verkrijging van mogelijkheden tot verrichten van algemeen geaccepteerde arbeid en zo nodig trachten die aanpassing
      en die voorzieningen te verkrijgen.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel14
  - number: '15'
    text: De aanvrager en de uitkeringsgerechtigde
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel15
  - number: 15.a
    text: staan als werkzoekende geregistreerd en verlengen die registratie tijdig;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel15
  - number: 15.b
    text: trachten in voldoende mate algemeen geaccepteerde arbeid te verkrijgen;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel15
  - number: 15.c
    text: aanvaarden aangeboden algemeen geaccepteerde arbeid;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel15
  - number: 15.d
    text: |-
      stellen geen eisen in verband met door hen te verrichten arbeid die het aanvaarden of verkrijgen van algemeen
      geaccepteerde arbeid belemmeren;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel15
  - number: 15.e
    text: voorkomen dat zij door eigen toedoen geen algemeen geaccepteerde arbeid verkrijgen;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel15
  - number: 15.f
    text: |-
      onthouden zich van zeer ernstige misdragingen jegens de met de uitvoering van deze wet belaste personen en
      instanties tijdens het verrichten van hun werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel15
  - number: '16.1'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld waarbij groepen personen worden vrijgesteld van de
      verplichtingen, bedoeld in de [artikelen 12, tweede lid, onderdeel c][ref1], [14][ref2] en [15][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel15
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '14'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '15'
        hoofdstuk: '3'
  - number: '16.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan aan aanvragers en
      uitkeringsgerechtigden in individuele gevallen tijdelijk ontheffing kan worden verleend van verplichtingen, hen
      opgelegd op grond van de [artikelen 12, tweede lid, onderdeel c][ref1], [14][ref2] en [15][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel14
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel15
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '14'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '15'
        hoofdstuk: '3'
  - number: '17.1'
    text: 'Het UWV stelt een uitkeringsreglement vast, dat bepalingen bevat omtrent:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel17
  - number: 17.1.a
    text: voorschriften ten behoeve van een doelmatige controle;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel17
  - number: 17.1.b
    text: voorschriften met betrekking tot het genieten van vakantie tijdens de duur van de uitkering;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel17
  - number: 17.1.c
    text: andere voorwaarden die aan het ontvangen van uitkering zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel17
  - number: '17.2'
    text: |-
      Het op grond van het eerste lid door het UWV vastgestelde uitkeringsreglement behoeft goedkeuring van Onze
      Minister.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel17
  - number: '18'
    text: |-
      De werkgever is verplicht de aanvrager en de uitkeringsgerechtigde gelegenheid te geven tot het uitoefenen van de
      hen bij of krachtens deze wet toegekende bevoegdheden en tot het nakomen van de bij of krachtens deze wet opgelegde
      verplichtingen, voor zover de uitoefening van die bevoegdheden en de nakoming van die verplichtingen niet buiten de
      arbeidstijd kan geschieden.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel18
  - number: '19.1'
    text: |-
      Het UWV weigert een uitkering op grond van deze wet blijvend geheel indien de aanvrager of de uitkeringsgerechtigde
      de verplichting bedoeld in [artikel 13, tweede lid][ref1], niet is nagekomen. Indien het niet nakomen van de
      verplichting die persoon niet in overwegende mate kan worden verweten weigert het UWV in afwijking van de eerste
      zin de uitkering over een periode van 26 weken gedeeltelijk door de uitkering te halveren.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel13
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '13'
        hoofdstuk: '3'
  - number: '19.2'
    text: |-
      Het UWV weigert een uitkering op grond van deze wet indien de aanvrager of de uitkeringsgerechtigde een
      verplichting als bedoeld in [artikel 15, onderdeel c, of e][ref1], niet of niet behoorlijk is nagekomen blijvend
      naar de mate waarin die persoon met het verrichten van de betreffende arbeid inkomen zou kunnen hebben verwerven.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel15
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '15'
        hoofdstuk: '3'
  - number: '19.3'
    text: |-
      Het UWV weigert een uitkering op grond van deze wet tijdelijk of blijvend, geheel of
      gedeeltelijk indien de aanvrager of de uitkeringsgerechtigde een verplichting hem op grond van de
      [artikelen 12][ref1], [13, eerste lid][ref2], [14][ref3], of [15 onderdelen a, b, of d][ref4], of
      [artikel 55, tweede lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], niet of niet
      behoorlijk is nagekomen, dan wel de verplichting, bedoeld in [artikel 12, eerste lid][ref6], niet binnen de door
      het UWV daarvoor vastgestelde termijn is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0013060#Artikel15
      [ref5]: https://wetten.overheid.nl/BWBR0013060#Artikel55
      [ref6]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0013060
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0013060
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0013060
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0013060
        artikel: '15'
      - id: ref5
        bwb_id: BWBR0013060
        artikel: '55'
      - id: ref6
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '19.4'
    text: |-
      Een maatregel als bedoeld in het derde lid wordt afgestemd op de ernst van de gedraging en de mate waarin de
      aanvrager of de uitkeringsgerechtigde de gedraging verweten kan worden. Van het opleggen van een maatregel wordt in
      elk geval afgezien, indien elke vorm van verwijtbaarheid ontbreekt.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
  - number: '19.5'
    text: |-
      Het UWV kan afzien van het opleggen van een maatregel als bedoeld in het derde of vierde lid en volstaan met het
      geven van een schriftelijke waarschuwing ter zake van het niet tijdig nakomen van een verplichting als bedoeld in
      [artikel 12, eerste lid][ref1], indien het niet tijdig nakomen van de verplichting, niet heeft geleid tot het ten
      onrechte of tot een te hoog bedrag verlenen van uitkering, of ter zake van het zich niet houden aan een voorschrift
      als bedoeld in [artikel 15, onderdelen a of b][ref2], tenzij het niet tijdig nakomen van de verplichting, of het
      zich niet houden aan de voorschriften, plaatsvindt binnen een periode van twee jaar te rekenen vanaf de datum
      waarop eerder aan de werknemer een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel15
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '15'
        hoofdstuk: '3'
  - number: '19.6'
    text: Het UWV kan afzien van het opleggen van een maatregel indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
  - number: '19.7'
    text: |-
      Het opleggen van een maatregel blijft achterwege indien voor dezelfde gedraging een bestuurlijke boete als bedoeld
      in [artikel 21][ref1] wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel21
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '21'
        hoofdstuk: '4'
  - number: '19.8'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot het derde en vierde lid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel19
  - number: '20'
    text: |-
      Indien het UWV een maatregel als bedoeld in [artikel 19][ref1] heeft opgelegd, zet het in geval van herleving van
      het recht op uitkering als bedoeld in [artikel 8][ref2] een weigering van de uitkering voort.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel8
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '19'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '21.1'
    text: |-
      Het UWV legt een bestuurlijke boete op van ten hoogste het benadelingsbedrag wegens het niet of niet
      behoorlijk nakomen door de aanvrager of de uitkeringsgerechtigde van de verplichting, bedoeld in
      [artikel 12, eerste lid][ref1]. Indien de feiten en omstandigheden, bedoeld in artikel 12, eerste lid, niet of niet
      behoorlijk zijn medegedeeld en deze overtreding opzettelijk is begaan, bedraagt de bestuurlijke boete ten hoogste
      het bedrag van de vijfde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].
      Indien de feiten en omstandigheden, bedoeld in artikel 12, eerste lid, niet of niet behoorlijk zijn medegedeeld
      en deze overtreding niet opzettelijk is begaan, bedraagt de bestuurlijke boete ten hoogste het bedrag van de derde
      categorie, bedoeld in artikel 23, vierde lid, van het Wetboek van Strafrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '21.2'
    text: |-
      In dit artikel wordt onder benadelingsbedrag verstaan het brutobedrag dat als gevolg van het niet of niet
      behoorlijk nakomen van de verplichting, bedoeld in [artikel 12, eerste lid][ref1], ten onrechte of tot een te hoog
      bedrag aan uitkering is ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '21.3'
    text: |-
      Indien het niet of niet behoorlijk nakomen door de aanvrager of de uitkeringsgerechtigde van de
      verplichting, bedoeld in [artikel 12, eerste lid][ref1], niet heeft geleid tot een benadelingsbedrag,
      legt het UWV een bestuurlijke boete op van ten hoogste het bedrag van de tweede categorie, bedoeld in
      [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel23
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '23'
  - number: '21.4'
    text: |-
      Het UWV kan afzien van het opleggen van een bestuurlijke boete en volstaan met het geven van een schriftelijke
      waarschuwing wegens het niet of niet behoorlijk nakomen door de aanvrager of de uitkeringsgerechtigde van de
      verplichting, bedoeld in [artikel 12, eerste lid][ref1], in situaties die bij algemene maatregel van bestuur
      worden bepaald, tenzij het niet of niet behoorlijk nakomen van de verplichting plaatsvindt binnen een periode van
      twee jaar te rekenen vanaf de datum waarop eerder aan de werknemer een zodanige waarschuwing is gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '21.5'
    text: |-
      Het UWV legt een bestuurlijke boete op wegens het niet of niet behoorlijk nakomen door de aanvrager of de
      uitkeringsgerechtigde van de verplichting, bedoeld in [artikel 12, eerste lid][ref1], als gevolg waarvan
      ten onrechte of tot een te hoog bedrag aan uitkering is ontvangen, van ten hoogste 150 procent van het
      benadelingsbedrag, met overeenkomstige toepassing van het eerste lid, indien binnen een tijdvak van vijf jaar
      voorafgaand aan de dag van het begaan van de overtreding een eerdere bestuurlijke boete of strafrechtelijke sanctie
      is opgelegd wegens een eerdere overtreding, bestaande uit eenzelfde gedraging, die onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '21.6'
    text: |-
      Onder eenzelfde gedraging als bedoeld in het vijfde lid wordt verstaan het niet of niet behoorlijk nakomen van
      de verplichting, bedoeld in de [artikelen 12, eerste lid][ref1], van deze wet, [12 van de Toeslagenwet][ref2],
      [25 van de Werkloosheidswet][ref3], [80 van de Wet op de arbeidsongeschiktheidsverzekering][ref4],
      [27, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref5], [31, eerste lid][ref6], of
      [49 van de Ziektewet][ref7], als gevolg waarvan ten onrechte of tot een te hoog bedrag aan uitkering, ziekengeld of
      toeslag is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0004045#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0002524#Artikel80
      [ref5]: https://wetten.overheid.nl/BWBR0019057#Artikel27
      [ref6]: https://wetten.overheid.nl/BWBR0001888#Artikel31
      [ref7]: https://wetten.overheid.nl/BWBR0001888#Artikel49
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '12'
      - id: ref3
        bwb_id: BWBR0004045
        artikel: '25'
      - id: ref4
        bwb_id: BWBR0002524
        artikel: '80'
      - id: ref5
        bwb_id: BWBR0019057
        artikel: '27'
      - id: ref6
        bwb_id: BWBR0001888
        artikel: '31'
      - id: ref7
        bwb_id: BWBR0001888
        artikel: '49'
  - number: '21.7'
    text: |-
      In afwijking van het vijfde lid is het in dat lid genoemde tijdvak van vijf jaar tien jaar indien wegens de
      eerdere overtreding, bedoeld in het vijfde lid, de aanvrager of de uitkeringsgerechtigde is gestraft met een
      onvoorwaardelijke gevangenisstraf.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
  - number: '21.8'
    text: Het UWV kan afzien van het opleggen van een bestuurlijke boete indien daarvoor dringende redenen aanwezig zijn.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
  - number: '21.9'
    text: |-
      Degene aan wie een bestuurlijke boete is opgelegd, is verplicht desgevraagd aan het UWV de inlichtingen te
      verstrekken die voor de tenuitvoerlegging van de bestuurlijke boete van belang zijn.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
  - number: '21.10'
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld over de hoogte van de bestuurlijke boete.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
  - number: '21.11'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de wijze van tenuitvoerlegging van de
      beschikking waarbij de bestuurlijke boete is opgelegd.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
  - number: '21.12'
    text: |-
      In afwijking van [artikel 8:69 van de Algemene wet bestuursrecht][ref1] kan de rechter in beroep of hoger beroep
      het bedrag waarop de bestuurlijke boete is vastgesteld ook ten nadele van de aanvrager of de uitkeringsgerechtigde
      wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '21.13'
    text: |-
      Indien ten aanzien van een overtreding waarvoor een bestuurlijke boete is opgelegd geen sprake is geweest van
      opzet of grove schuld, en voorts is gebleken dat binnen een jaar nadat de bestuurlijke boete is opgelegd niet
      nogmaals een overtreding wegens eenzelfde gedraging als bedoeld in het zesde lid is begaan, is het UWV bevoegd op
      verzoek van degene aan wie de bestuurlijke boete is opgelegd, de bestuurlijke boete geheel of gedeeltelijk kwijt
      te schelden bij medewerking aan een schuldregeling. [Artikel 35a, eerste, derde en vierde lid][ref1], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel35a
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: 35a
        hoofdstuk: '5'
  - number: '21.14'
    text: |-
      Het besluit tot kwijtschelding, bedoeld in het dertiende lid, wordt ingetrokken of ten nadele van degene aan wie
      de bestuurlijke boete is opgelegd herzien indien binnen vijf jaar na het besluit tot kwijtschelding wederom een
      overtreding is begaan wegens eenzelfde gedraging als bedoeld in het zesde lid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel21
  - number: '22'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de termijn waarvoor uitstel van betaling van de
      bestuurlijke boete kan worden verleend.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel22
  - number: '24.1'
    text: |-
      Het UWV verrekent de bestuurlijke boete en een eerdere bestuurlijke boete wegens eenzelfde gedraging als
      bedoeld in [artikel 21, vijfde lid][ref1], met een uitkering op grond van deze wet, de [Ziektewet][ref2],
      de [Wet werk en inkomen naar arbeidsvermogen][ref3], de [Wet op de arbeidsongeschiktheidsverzekering][ref4],
      de [Wet arbeidsongeschiktheidsverzekering zelfstandigen][ref5], de
      [Wet arbeidsongeschiktheidsvoorziening jonggehandicapten][ref6], de
      [Wet arbeidsongeschiktheidsvoorziening militairen][ref7], de [Wet arbeid en zorg][ref8], de
      [Werkloosheidswet][ref9] of een toeslag op grond van de [Toeslagenwet][ref10], die de overtreder ontvangt.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0001888
      [ref3]: https://wetten.overheid.nl/BWBR0019057
      [ref4]: https://wetten.overheid.nl/BWBR0002524
      [ref5]: https://wetten.overheid.nl/BWBR0008656
      [ref6]: https://wetten.overheid.nl/BWBR0008657
      [ref7]: https://wetten.overheid.nl/BWBR0002822
      [ref8]: https://wetten.overheid.nl/BWBR0013008
      [ref9]: https://wetten.overheid.nl/BWBR0004045
      [ref10]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '21'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0001888
      - id: ref3
        bwb_id: BWBR0019057
      - id: ref4
        bwb_id: BWBR0002524
      - id: ref5
        bwb_id: BWBR0008656
      - id: ref6
        bwb_id: BWBR0008657
      - id: ref7
        bwb_id: BWBR0002822
      - id: ref8
        bwb_id: BWBR0013008
      - id: ref9
        bwb_id: BWBR0004045
      - id: ref10
        bwb_id: BWBR0004043
  - number: '24.2'
    text: |-
      Onverminderd het eerste lid kan het UWV de bestuurlijke boete verrekenen met een vordering die degene aan wie de
      bestuurlijke boete is opgelegd op hem heeft.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
  - number: '24.3'
    text: |-
      De Sociale verzekeringsbank onderscheidenlijk de gemeente betaalt het bedrag van de bestuurlijke boete, zonder
      dat daarvoor een machtiging nodig is, op zijn verzoek aan het UWV indien de overtreder een uitkering ontvangt
      op grond van de [Algemene Ouderdomswet][ref1], de [Algemene nabestaanden wet][ref2], de [Participatiewet][ref3],
      de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0007795
      [ref3]: https://wetten.overheid.nl/BWBR0015703
      [ref4]: https://wetten.overheid.nl/BWBR0004044
      [ref5]: https://wetten.overheid.nl/BWBR0004163
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0007795
      - id: ref3
        bwb_id: BWBR0015703
      - id: ref4
        bwb_id: BWBR0004044
      - id: ref5
        bwb_id: BWBR0004163
  - number: '24.4'
    text: |-
      De in [artikel 479g van het Wetboek van Burgerlijke Rechtsvordering][ref1] aan de raad voor de
      kinderbescherming toegekende bevoegdheid komt gelijkelijk toe aan het UWV. Indien het UWV gebruik
      maakt van deze bevoegdheid, geschiedt de bekendmaking van het dwangbevel, in afwijking van
      [artikel 4:123, eerste lid, van de Algemene wet bestuursrecht][ref2], door middel van toezending per post aan
      degene aan wie de boete is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel479g
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 479g
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '24.5'
    text: |-
      Zolang de overtreder zijn verplichting, bedoeld in [artikel 21, negende lid][ref1], niet of niet behoorlijk
      nakomt:


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel21
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '21'
        hoofdstuk: '4'
  - number: 24.5.a
    text: |-
      is het UWV in afwijking van [artikel 4:93, vierde lid, van de Algemene wet bestuursrecht][ref1] bevoegd tot
      verrekening van de bestuurlijke boete voor zover beslag op de vordering van de schuldeiser nietig zou zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 24.5.b
    text: |-
      geldt de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1], in afwijking van
      [artikel 4:116 van de Algemene wet bestuursrecht][ref2], niet bij de invordering van een bestuurlijke boete bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '24.6'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld omtrent de hoogte van het op grond van
      [artikel 24, eerste of tweede lid][ref1], te verrekenen bedrag en de termijn of termijnen waarbinnen deze
      verrekening plaatsvindt.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel24
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '24'
        hoofdstuk: '4'
  - number: '25'
    text: |-
      Indien het UWV de aanvrager of de uitkeringsgerechtigde de uitkering op grond van deze wet tijdelijk of blijvend,
      geheel of gedeeltelijk heeft geweigerd dan wel hem een bestuurlijke boete heeft opgelegd, stelt het UWV het re-
      integratiebedrijf dat ten behoeve van die persoon werkzaamheden gericht op vergroting van de mogelijkheden tot het
      verrichten van arbeid of op inschakeling in arbeid verricht, van dat besluit in kennis voor zover dat noodzakelijk
      is voor de uitvoering van de werkzaamheden door het re-integratiebedrijf.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel25
  - number: '26'
    text: Het UWV betaalt de uitkering waarop op grond van deze wet recht bestaat per maand achteraf.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel26
  - number: '27'
    text: |-
      De uitkeringsgerechtigde die over een maand recht heeft op een uitkering op grond van deze wet, heeft over die
      maand recht op vakantie-uitkering.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel27
  - number: 27a.1
    text: |-
      De vakantie-uitkering bedraagt 8 procent van het bedrag aan uitkering op grond van deze wet, waarop recht bestond
      in het tijdvak van twaalf maanden, voorafgaande aan de maand mei.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel27a
  - number: 27a.2
    text: |-
      Indien het percentage van de vakantiebijslag, bedoeld in
      [artikel 15, eerste lid, van de Wet minimumloon en minimumvakantiebijslag][ref1], wordt gewijzigd, treedt dit
      gewijzigde percentage in de plaats van het in het eerste lid genoemde percentage. Het gewijzigde percentage wordt
      in aanmerking genomen over de uitkering waarop op grond van deze wet recht bestaat vanaf de dag waarop de wijziging
      ingaat.


      [ref1]: https://wetten.overheid.nl/BWBR0002638#Artikel15
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel27a
    references:
      - id: ref1
        bwb_id: BWBR0002638
        artikel: '15'
  - number: 27a.3
    text: |-
      Het UWV betaalt de vakantie-uitkering jaarlijks in de maand mei over de aan die maand voorafgaande maanden, of,
      indien het recht op uitkering eerder dan in de maand mei geheel eindigt, in de desbetreffende maand.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel27a
  - number: 27a.4
    text: De vakantie-uitkering wordt betaald zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel27a
  - number: '29.1'
    text: |-
      Na het overlijden van de uitkeringsgerechtigde wordt met ingang van de dag na het overlijden een
      overlijdensuitkering uitbetaald:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: 29.1.a
    text: aan de echtgenoot van de uitkeringsgerechtigde;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: 29.1.b
    text: |-
      bij ontstentenis van de echtgenoot, aan het minderjarige kind of de minderjarige kinderen tot wie de overledene in
      familierechtelijke betrekking stond;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: 29.1.c
    text: |-
      bij ontstentenis van de in de onderdelen a en b bedoelde personen, aan degenen met wie de overledene in
      gezinsverband leefde.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: '29.2'
    text: |-
      De overlijdensuitkering is gelijk aan het bedrag van de uitkering over een periode van één kalendermaand, berekend
      naar de hoogte van die uitkering op de dag of laatstelijk voor de dag van overlijden van de persoon, bedoeld in
      [artikel 3, eerste lid][ref1], en [artikel 3a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel3a
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '29.3'
    text: |-
      In verband met het overlijden van de uitkeringsgerechtigde is [artikel 6, eerste lid, onderdeel f][ref1], niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '29.4'
    text: |-
      De overlijdensuitkering wordt ambtshalve of op verzoek aan de rechthebbende of rechthebbenden, genoemd in het
      eerste lid, door het UWV uitbetaald.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: '29.5'
    text: |-
      Het bedrag van de overlijdensuitkering wordt verminderd met het bedrag aan uitkering dat over na het overlijden
      gelegen dagen, reeds is uitbetaald.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: '29.6'
    text: De overlijdensuitkering is niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: '29.7'
    text: De overlijdensuitkering wordt in een bedrag ineens uitbetaald.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel29
  - number: '30.1'
    text: |-
      Indien de uitkeringsgerechtigde aanspraak heeft op verstrekking of vergoeding van zorg als bedoeld
      in de [Wet langdurige zorg][ref1] en op grond van die wet een bijdrage voor die zorg verschuldigd
      is, is het UWV bevoegd de uitkering tot het bedrag van die bijdrage in plaats van aan de
      uitkeringsgerechtigde, zonder diens machtiging uit te betalen aan het Zorginstituut Nederland, genoemd in
      [artikel 58, eerste lid, van de Zorgverzekeringswet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0035917
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel58
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0035917
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '58'
  - number: '30.2'
    text: |-
      Indien aan de uitkeringsgerechtigde aan wie een uitkering op grond van deze wet is toegekend, een
      maatwerkvoorziening of persoonsgebonden budget wordt verstrekt voor beschermd wonen als bedoeld in
      [artikel 1.1.1 van de Wet maatschappelijke ondersteuning 2015][ref1], en hij op grond van die [wet][ref2] hiervoor
      een bijdrage is verschuldigd, is het UWV bevoegd de uitkering tot het bedrag van die bijdrage in plaats van aan
      de uitkeringsgerechtigde, aan wie die uitkering is toegekend, zonder diens machtiging uit te betalen aan het CAK,
      genoemd in [artikel 6.1.1, eerste lid, van de Wet langdurige zorg][ref3], dat voor de gemeente de bijdrage int.


      [ref1]: https://wetten.overheid.nl/BWBR0035362#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0035362
      [ref3]: https://wetten.overheid.nl/BWBR0035917#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0035362
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0035362
      - id: ref3
        bwb_id: BWBR0035917
        artikel: '6'
  - number: '30.3'
    text: |-
      Indien de uitkeringsgerechtigde in een inrichting ter verpleging van geesteszieken of van zwakzinnigen is opgenomen
      en het UWV, van de desbetreffende inrichting of van het college van burgemeester en wethouders van de gemeente die
      de opnamekosten betaalt, het verzoek ontvangt om de uitkering aan die inrichting of die gemeente uit te betalen, is
      het UWV bevoegd dat verzoek zonder het stellen van andere voorwaarden in te willigen.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel30
  - number: '30.4'
    text: |-
      Indien het eerste of tweede lid toepassing vindt, heeft de in het derde lid bedoelde bevoegdheid betrekking op het
      gedeelte van de uitkering dat niet aan de in het eerste of tweede lid genoemde instantie wordt uitbetaald.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel30
  - number: '30.5'
    text: |-
      Een herziening van de uitkering op grond van het eerste of tweede lid als gevolg van een wijziging van de
      verschuldigde bijdrage vindt plaats zonder dat dit bij beschikking is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel30
  - number: '31'
    text: |-
      De uitkering op grond van deze wet die niet in ontvangst is genomen of is ingevorderd binnen 2 jaar na de dag van
      betaalbaarstelling wordt niet meer betaald.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel31
  - number: '32'
    text: |-
      Voor zover bij of krachtens deze wet niet anders is bepaald, wordt een voorschot op de uitkering beschouwd als een
      uitkering op grond van deze wet.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel32
  - number: '33.1'
    text: |-
      Onverminderd [artikel 32][ref1] schort het UWV de betaling van de uitkering op of schorst de betaling, indien het
      op grond van duidelijke aanwijzingen van oordeel is of het gegronde vermoedens heeft dat:


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel32
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '32'
        hoofdstuk: '5'
  - number: 33.1.a
    text: het recht op uitkering niet of niet meer bestaat;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33
  - number: 33.1.b
    text: recht op een lagere uitkering bestaat; of
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33
  - number: 33.1.c
    text: |-
      de aanvrager of de uitkeringsgerechtigde een verplichting als bedoeld in de
      [artikelen 12, eerste of tweede lid][ref1], [13][ref2], [14][ref3], of [15][ref4] niet is nagekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0024394#Artikel15
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '13'
        hoofdstuk: '3'
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '14'
        hoofdstuk: '3'
      - id: ref4
        bwb_id: BWBR0024394
        artikel: '15'
        hoofdstuk: '3'
  - number: '33.2'
    text: |-
      Indien een re-integratiebedrijf aan het UWV heeft gemeld dat het gegronde vermoeden bestaat dat een aanvrager of
      een uitkeringsgerechtigde onvoldoende medewerking verleent aan de op hem betrekking hebbende werkzaamheden van het
      re-integratiebedrijf, neemt het UWV een besluit omtrent de gehele of gedeeltelijke opschorting of schorsing van de
      betaling van de uitkering aan die persoon voor de duur van ten hoogste acht weken.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33
  - number: '33.3'
    text: |-
      Het UWV stelt het re-integratiebedrijf in kennis van een besluit tot opschorting of schorsing als bedoeld in het
      tweede lid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33
  - number: 33a.1
    text: |-
      Is van de aanvrager of ontvanger van een uitkering bij het UWV een adres in Nederland bekend, terwijl in de
      basisregistratie personen ambtshalve is opgenomen dat hij is vertrokken naar een onbekend land van verblijf,
      dan verzoekt het UWV hem de afwijkende registratie in de basisregistratie personen binnen een redelijke termijn
      ongedaan te laten maken.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33a
  - number: 33a.2
    text: |-
      Wanneer na afloop van deze termijn, de afwijkende registratie niet is beëindigd of als uit de basisregistratie
      personen niet blijkt dat het college van burgemeester en wethouders van de desbetreffende gemeente de gegevens over
      het adres in onderzoek heeft genomen, schort het UWV de betaling van de uitkering aan de persoon, die recht heeft
      op de uitkering, op.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33a
  - number: 33a.3
    text: |-
      De opschorting wordt beëindigd zodra is vastgesteld dat de persoon, bedoeld in het tweede lid, in het buitenland
      woont of verblijft of dat een adres in Nederland in de basisregistratie personen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33a
  - number: 33a.4
    text: |-
      Indien het onderzoek van het college van burgemeester en wethouders is afgerond en de persoon, bedoeld in
      het tweede lid, in de basisregistratie personen ambtshalve opgenomen blijft met gegevens over het vertrek uit
      Nederland, schort het UWV de betaling van de uitkering op tot verblijf in het buitenland kan worden vastgesteld of
      een adres in Nederland in de basisregistratie personen is opgenomen.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel33a
  - number: '34.1'
    text: |-
      Een uitkering die op grond van deze wet onverschuldigd is betaald en hetgeen als gevolg van een beschikking als
      bedoeld in [artikel 9][ref1] of [19][ref2] door het UWV onverschuldigd is betaald of verstrekt wordt door het UWV
      teruggevorderd.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel19
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '19'
        hoofdstuk: '4'
  - number: '34.2'
    text: |-
      De uitkering wordt van de aanvrager of de uitkeringsgerechtigde teruggevorderd indien blijkt dat deze over
      dezelfde periode waarover een uitkering op grond van deze wet is verleend, later inkomsten ontvangt waarmee bij de
      vaststelling van de uitkering rekening zou zijn gehouden.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel34
  - number: '34.3'
    text: |-
      De persoon van wie wordt teruggevorderd verstrekt desgevraagd aan het UWV de inlichtingen die voor de
      terugvordering van belang zijn.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel34
  - number: '35.1'
    text: |-
      In afwijking van [artikel 34, eerste en derde lid][ref1], kan het UWV besluiten van terugvordering of van verdere
      terugvordering af te zien, indien de persoon van wie wordt teruggevorderd:


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel34
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '34'
        hoofdstuk: '5'
  - number: 35.1.a
    text: gedurende vijf jaar volledig aan zijn betalingsverplichtingen heeft voldaan;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
  - number: 35.1.b
    text: |-
      gedurende vijf jaar niet volledig aan zijn betalingsverplichtingen heeft voldaan, maar het achterstallige bedrag
      over die periode, vermeerderd met de daarover verschuldigde wettelijke rente en de op de invordering betrekking
      hebbende kosten, alsnog heeft betaald;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
  - number: 35.1.c
    text: |-
      gedurende vijf jaar geen betalingen heeft verricht en niet aannemelijk is dat hij deze op enig moment zal gaan
      verrichten; of
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
  - number: 35.1.d
    text: een bedrag, overeenkomend met ten minste 50% van de restsom in één keer aflost.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
  - number: '35.2'
    text: |-
      De in het eerste lid, onderdelen a, b en c, genoemde termijn is tien jaar indien de terugvordering het gevolg is
      van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '35.3'
    text: 'De in het eerste lid, onder a en b, genoemde termijn is drie jaar indien:'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
  - number: 35.3.a
    text: |-
      het gemiddelde inkomen van de belanghebbende in die periode de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref1] niet te boven is gegaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 35.3.b
    text: |-
      de terugvordering niet het gevolg is van het niet of niet behoorlijk nakomen van de verplichting, bedoeld in
      [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
  - number: '35.4'
    text: |-
      Indien daarvoor dringende redenen aanwezig zijn kan het UWV besluiten geheel of gedeeltelijk van terugvordering af
      te zien.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
  - number: '35.5'
    text: |-
      In afwijking van [artikel 34, eerste en derde lid][ref1], kan het UWV, onder bij ministeriële regeling te stellen
      voorwaarden, besluiten van terugvordering af te zien indien het terug te vorderen bedrag een bij ministeriële
      regeling vast te stellen bedrag niet te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel34
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '34'
        hoofdstuk: '5'
  - number: 35a.1
    text: |-
      In afwijking van artikel 34, eerste en derde lid, kan het UWV, op verzoek van de belanghebbende of zijn wettelijke
      vertegenwoordiger, besluiten gedeeltelijk van terugvordering of gedeeltelijk van verdere terugvordering af te zien
      door medewerking aan een schuldregeling, indien:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.1.a
    text: |-
      redelijkerwijs te voorzien is dat de belanghebbende niet zal kunnen voortgaan met het betalen van zijn schulden of
      indien hij in de toestand verkeert dat hij heeft opgehouden te betalen;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.1.b
    text: |-
      redelijkerwijs te voorzien is dat een schuldregeling met betrekking tot alle vorderingen, behoudens de in het
      tweede lid bedoelde vorderingen, van de overige schuldeisers zonder een zodanig besluit niet tot stand zal komen;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.1.c
    text: |-
      een naar het oordeel van het UWV betrouwbaar voorstel voor een schuldregeling tot stand is gekomen door tussenkomst
      van een schuldhulpverlener als bedoeld in [artikel 48 van de Wet op het consumentenkrediet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004815#Artikel48
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0004815
        artikel: '48'
  - number: 35a.1.d
    text: aannemelijk is dat medewerking aan een schuldregeling niet concurrentieverstorend werkt; en
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.1.e
    text: |-
      uitdeling in het kader van de schuldregeling plaatsvindt overeenkomstig
      [artikel 349 van de Faillissementswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel349
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '349'
  - number: 35a.2
    text: |-
      Het eerste lid is niet van toepassing indien een vordering is ontstaan door het opzettelijk of door grove schuld
      niet nakomen door de belanghebbende van de verplichting, bedoeld in [artikel 12, eerste lid][ref1], en hiervoor een
      boete als bedoeld in [artikel 21][ref2] is opgelegd, dan wel indien hiervoor aangifte is gedaan op grond van het
      [Wetboek van Strafrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '12'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '21'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0001854
  - number: 35a.3
    text: |-
      Het besluit tot het afzien van terugvordering of van verdere terugvordering wordt ingetrokken of ten nadele van
      belanghebbende gewijzigd indien:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.3.a
    text: |-
      niet binnen twaalf maanden nadat dat besluit is bekendgemaakt, een schuldregeling tot stand is gekomen die voldoet
      aan de eisen, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.3.b
    text: de belanghebbende zijn schuld aan het UWV niet overeenkomstig de schuldregeling voldoet; of
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.3.c
    text: |-
      onjuiste of onvolledige gegevens zijn verstrekt en de verstrekking van juiste of volledige gegevens tot een ander
      besluit zou hebben geleid.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35a.4
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot dit artikel nadere regels worden gesteld ten aanzien van de
      bevoegdheid om mee te werken aan schuldregelingen.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35a
  - number: 35b
    text: |-
      Een vordering van het UWV als bedoeld in [artikel 34][ref1] en [35a][ref2] is bevoorrecht en volgt onmiddellijk na
      de vorderingen, bedoeld in [artikel 288 van Boek 3 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel35a
      [ref3]: https://wetten.overheid.nl/BWBR0005291#Artikel288
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel35b
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '34'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: 35a
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0005291
        artikel: '288'
  - number: '36.1'
    text: |-
      Het UWV kan de onverschuldigd betaalde uitkering, bedoeld in [artikel 34, eerste lid][ref1], invorderen bij
      dwangbevel.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel34
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '34'
        hoofdstuk: '5'
  - number: '36.2'
    text: |-
      [Artikel 24][ref1] is van overeenkomstige toepassing, met dien verstande dat indien het
      gemiddelde inkomen van de belanghebbende gedurende drie jaar de beslagvrije voet bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2] niet te boven is gegaan, het
      UWV de aflossingsbedragen lager vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '24'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
  - number: '37'
    text: |-
      Bij ministeriële regeling kunnen regels worden gesteld met betrekking tot de [artikelen 34][ref1], [35][ref2] en
      [36][ref3] alsmede omtrent de termijn waarvoor uitstel van betaling kan worden verleend van hetgeen onverschuldigd
      is betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel36
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '34'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '35'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '36'
        hoofdstuk: '5'
  - number: '39.1'
    text: Een uitkering op grond van deze wet is onvervreemdbaar en niet vatbaar voor verpanding of belening.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel39
  - number: '39.2'
    text: |-
      Volmacht tot ontvangst van een uitkering op grond van deze wet onder welke vorm of benaming ook verleend, is steeds
      herroepelijk.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel39
  - number: '39.3'
    text: Elke beding strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel39
  - number: '40.1'
    text: |-
      De op grond van deze wet te betalen uitkeringen, de door het UWV verschuldigde inkomensafhankelijke bijdrage,
      bedoeld in [artikel 42 van de Zorgverzekeringswet][ref1] en de aan de uitvoering van deze wet verbonden kosten
      komen ten laste van het Toeslagenfonds, bedoeld in [artikel 31 van de Toeslagenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0004043#Artikel31
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '42'
      - id: ref2
        bwb_id: BWBR0004043
        artikel: '31'
  - number: '40.2'
    text: |-
      Ter dekking van de uitkeringen en de kosten, bedoeld in het eerste lid, wordt het Toeslagenfonds voorzien van
      middelen van het Rijk alsmede van de met de toepassing van [artikel 21][ref1] verkregen boeten.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel21
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '21'
        hoofdstuk: '4'
  - number: '40.3'
    text: |-
      Het UWV beheert en administreert afzonderlijk de middelen tot dekking van de uitgaven, bedoeld in het eerste lid,
      in de vorm van een onderdeel van het Toeslagenfonds.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel40
  - number: '42.1'
    text: |-
      Een beschikking over de betaling van een voorschot op grond van
      [artikel 4:95 van de Algemene wet bestuursrecht][ref1] wordt gegeven binnen vier weken na ontvangst van de
      aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '42.2'
    text: |-
      Indien een beschikking als bedoeld in het eerste lid niet binnen de toepasselijke termijn kan worden gegeven, wordt
      dit schriftelijk aan de aanvrager medegedeeld onder vermelding van een zo kort mogelijke termijn waarbinnen de
      beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel42
  - number: '44'
    text: |-
      In afwijking van [artikel 7:10, eerste lid, van de Algemene wet bestuursrecht][ref1] beslist het UWV binnen dertien
      weken na ontvangst van het bezwaarschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel7
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '7'
  - number: '45'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van de behandeling van bezwaarschriften
      tegen besluiten, waaraan een medische of arbeidskundige beoordeling ten grondslag ligt.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel45
  - number: '46.1'
    text: |-
      De werkgever die zijn verplichting als bedoeld in [artikel 18][ref1] niet nakomt, wordt gestraft met hechtenis van
      ten hoogste een maand of geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel18
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '18'
        hoofdstuk: '3'
  - number: '46.2'
    text: Het in het eerste lid omschreven strafbare feit is een overtreding.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel46
  - number: '47.1'
    text: |-
      Tegen uitspraken van de Centrale Raad van Beroep kan ieder der partijen beroep in cassatie instellen terzake
      van schending of verkeerde toepassing van [artikel 2, tweede tot en met zesde lid][ref1] en de daarop berustende
      bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel2
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '2'
        hoofdstuk: '1'
  - number: '47.2'
    text: |-
      Op dit beroep zijn de voorschriften betreffende het beroep in cassatie tegen de uitspraken van de gerechtshoven
      inzake beroepen in belastingzaken van overeenkomstige toepassing, waarbij de Centrale Raad van Beroep de plaats
      inneemt van een gerechtshof.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel47
  - number: '48.1'
    text: |-
      De volgende algemene maatregelen van bestuur berusten met ingang van de dag van inwerkingtreding van de
      desbetreffende bepalingen van deze wet mede op de bij die maatregelen genoemde artikelen van deze wet:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
  - number: 48.1.a
    text: |-
      het [Besluit aanwijzing registraties gezamenlijke huishouding 1998][ref1]: [artikel 2, zesde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009280
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel2
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0009280
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '2'
        hoofdstuk: '1'
  - number: 48.1.b
    text: |-
      het [Besluit extramurale vrijheidsbeneming en sociale zekerheid][ref1]: [artikel 6, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011136
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011136
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 48.1.c
    text: |-
      het [Boetebesluit socialezekerheidswetten][ref1]: [artikel 21, vijfde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0011708
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel21
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0011708
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '21'
        hoofdstuk: '4'
  - number: 48.1.d
    text: |-
      het [Maatregelenbesluit socialezekerheidswetten][ref1]: [artikel 19, achtste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022445
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel19
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0022445
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '19'
        hoofdstuk: '4'
  - number: 48.1.e
    text: |-
      het [Besluit ontheffing verplichtingen WW en Wet WIA][ref1]: [artikel 16, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020483
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel16
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0020483
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '16'
        hoofdstuk: '3'
  - number: '48.2'
    text: |-
      De volgende ministeriële regelingen berusten met ingang van de dag van inwerkingtreding van de desbetreffende
      bepalingen van deze wet mede op de bij die regelingen genoemde artikelen van deze wet:
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
  - number: 48.2.a
    text: |-
      de [Regeling tenuitvoerlegging bestuurlijke boeten en terugvordering onverschuldigde betalingen][ref1]:
      [artikel 22][ref2] en [artikel 37][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0026017
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel22
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel37
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0026017
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '22'
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '37'
        hoofdstuk: '5'
  - number: 48.2.b
    text: |-
      de [Regeling terugvordering geringe bedragen][ref1]: [artikel 35, vierde lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0009254
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel35
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0009254
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '35'
        hoofdstuk: '5'
  - number: 48.2.c
    text: |-
      de [Regeling vrijstelling verplichtingen WW en Wet WIA][ref1]: [artikel 16, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0019305
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel16
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0019305
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '16'
        hoofdstuk: '3'
  - number: 48.2.d
    text: |-
      de [Vakantieregeling WW][ref1]: [artikel 6, zesde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0016004
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel6
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0016004
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 48a.1
    text: |-
      Ten aanzien van de persoon wiens eerste dag van werkloosheid is gelegen voor de inwerkingtreding van de
      Wet van 11 december 2019 tot wijziging van de Wet inkomensvoorziening oudere werklozen in verband met het
      verlengen van de werkingsduur van die wet en het verhogen van de toetredingsleeftijd (Stb. 2019, 481), blijft
      [artikel 3, eerste lid, onderdeel b][ref1], van toepassing zoals dat luidde op de dag voor die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0024394#Artikel3
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0024394
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 48a.2
    text: |-
      Ten aanzien van de persoon wiens recht op uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1]
      is ontstaan voor de inwerkingtreding van de Wet van 11 december 2019 tot wijziging van de Wet inkomensvoorziening
      oudere werklozen in verband met het verlengen van de werkingsduur van die wet en het verhogen van de
      toetredingsleeftijd (Stb. 2019, 481) blijft [artikel 3a, eerste lid, onderdeel b, en derde lid][ref2], van
      toepassing zoals dat luidde op de dag voor die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel3a
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0024394
        artikel: 3a
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 48c
    text: |-
      Ten aanzien van de persoon wiens eerste werkloosheidsdag is gelegen voor de dag van inwerkingtreding van
      [artikel XXXII, onderdeel C, van de Wet werk en zekerheid][ref1] blijft [artikel 10][ref2] van toepassing zoals dat
      luidde op de dag voor die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0035254#ArtikelXXXII
      [ref2]: https://wetten.overheid.nl/BWBR0024394#Artikel10
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48c
    references:
      - id: ref1
        bwb_id: BWBR0035254
        artikel: XXXII
      - id: ref2
        bwb_id: BWBR0024394
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 48d
    text: |-
      Ten aanzien van de persoon wiens recht op uitkering op grond van de [Wet werk en inkomen naar arbeidsvermogen][ref1]
      is ontstaan voor de dag van inwerkingtreding van [artikel XXXII, onderdeel C, van de Wet werk en zekerheid][ref2]
      blijft [artikel 10][ref3] van toepassing zoals dat luidde op de dag voor die inwerkingtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0019057
      [ref2]: https://wetten.overheid.nl/BWBR0035254#ArtikelXXXII
      [ref3]: https://wetten.overheid.nl/BWBR0024394#Artikel10
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0019057
      - id: ref2
        bwb_id: BWBR0035254
        artikel: XXXII
      - id: ref3
        bwb_id: BWBR0024394
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '49'
    text: |-
      Onze Minister zendt binnen 2 jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel49
  - number: '50.1'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel50
  - number: '50.2'
    text: Deze wet vervalt met ingang van 1 januari 2034.
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel50
  - number: '51'
    text: 'Deze wet wordt aangehaald als: Wet inkomensvoorziening oudere werklozen.'
    url: https://wetten.overheid.nl/BWBR0024394/2024-01-01#Artikel51
