preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat er een rijbewijsplicht komt voor het besturen van
    landbouw- en bosbouwtrekkers en motorrijtuigen met beperkte snelheid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelAanhef
articles:
  - number: III
    text: |-
      Aanvragen tot afgifte van het op grond van [artikel 20, eerste lid, van de Arbeidsomstandighedenwet][ref1] af te
      geven certificaat van vakbekwaamheid, bedoeld in [artikel 9.36 van het Arbeidsomstandighedenbesluit][ref2] zoals
      dat artikel luidde op de dag voorafgaande aan het tijdstip van inwerkingtreding van [artikel I][ref3] van deze wet
      die voor dat tijdstip zijn ingediend, worden behandeld overeenkomstig de bepalingen die tot dat tijdstip golden
      voor de afgifte van dat certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0036167#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0036167
        artikel: I
  - number: IV.1
    text: |-
      Op grond van [artikel 20, eerste lid, van de Arbeidsomstandighedenwet][ref1] afgegeven certificaten van
      vakbekwaamheid als bedoeld in [artikel 9.36 van het Arbeidsomstandighedenbesluit][ref2] die zijn afgegeven voor de
      inwerkingtreding van [artikel I][ref3] van deze wet geven de bevoegdheid tot het besturen van rijbewijsplichtige
      voertuigen van de categorie T tot uiterlijk één jaar na de inwerkingtreding van artikel I van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0036167#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0010346
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0008498
        artikel: '9'
      - id: ref3
        bwb_id: BWBR0036167
        artikel: I
  - number: IV.2
    text: |-
      Gedurende de in het eerste lid bedoelde termijn is ten aanzien van houders van het in het eerste lid bedoelde
      certificaat [artikel 107, eerste lid, van de Wegenverkeerswet 1994][ref1] niet van toepassing op het besturen van
      bij algemene maatregel van bestuur aangewezen landbouw- en bosbouwtrekkers en motorrijtuigen met beperkte snelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel107
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '107'
  - number: IV.3
    text: |-
      Tot uiterlijk één jaar na de datum van inwerkingtreding van [artikel I][ref1] van deze wet wordt aan houders van
      het in het eerste lid bedoelde certificaat op aanvraag en tegen betaling van het daarvoor vastgestelde tarief
      overeenkomstig bij algemene maatregel van bestuur vastgestelde eisen een rijbewijs afgegeven dat geldig is voor
      het besturen van bij algemene maatregel van bestuur aangewezen landbouw- en bosbouwtrekkers en motorrijtuigen met
      beperkte snelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelIV
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: I
  - number: V.1
    text: |-
      Personen aan wie voor het tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet een rijbewijs is
      afgegeven voor de categorie B, dan wel ten aanzien van wie voor genoemd tijdstip het besluit tot afgifte van een
      rijbewijs voor de categorie B is genomen, zijn tevens bevoegd tot het besturen van bij algemene maatregel van
      bestuur aangewezen landbouw- en bosbouwtrekkers en motorrijtuigen met beperkte snelheid tot uiterlijk tien jaar na
      inwerkingtreding van artikel I van deze wet, dan wel tot het tijdstip waarop een nieuw of vervangend rijbewijs voor
      de categorie B wordt afgegeven, indien dit tijdstip valt binnen genoemde periode van tien jaar.


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: I
  - number: V.2
    text: |-
      Aan personen aan wie voor het tijdstip van de inwerkingtreding van [artikel I][ref1] van deze wet een rijbewijs
      is afgegeven voor de categorie B dat op dat tijdstip nog geldig is of waarvan de geldigheid voor dat tijdstip is
      verlopen door het verstrijken van de geldigheidsduur, dan wel ten aanzien van wie voor genoemd tijdstip het besluit
      tot afgifte van een rijbewijs voor de categorie B is genomen, wordt tot uiterlijk tien jaar na dat tijdstip van
      inwerkingtreding op aanvraag en tegen betaling van het daarvoor vastgestelde tarief overeenkomstig bij algemene
      maatregel van bestuur vastgestelde eisen een rijbewijs afgegeven dat mede geldig is voor het besturen van bij
      algemene maatregel van bestuur aangewezen landbouwen bosbouwtrekkers en motorrijtuigen met beperkte snelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelI
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelV
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: I
  - number: V.3
    text: |-
      Het eerste en tweede lid gelden niet ten aanzien van houders van een rijbewijs B die dat rijbewijs hebben verkregen
      op of na hun zeventiende verjaardag, maar voor hun achttiende verjaardag, gedurende de periode dat zij alleen onder
      begeleiding een motorrijtuig van de rijbewijscategorie B mogen besturen.
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelV
  - number: V.4
    text: |-
      Voor de toepassing van het eerste tot en met derde lid wordt onder rijbewijs mede verstaan een geldig rijbewijs
      voor de categorie B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of een
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland, waarvan de
      houder in Nederland woonachtig is.
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelV
  - number: VI.1
    text: |-
      Voor de toepassing van dit artikel en de daarop rustende bepalingen wordt onder agrarisch onderwijs verstaan
      praktijkonderwijs verzorgd door een bedrijf of organisatie in opdracht van agrarische opleidingscentra en
      afdelingen en onderwijs dat wordt verzorgd door:
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
  - number: VI.1.a
    text: |-
      een agrarisch opleidingscentrum als bedoeld in [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '1'
  - number: VI.1.b
    text: |-
      een school of scholengemeenschap voor voortgezet onderwijs waar het de afdeling landbouw en natuurlijke omgeving,
      bedoeld in [artikel 10c van de Wet op het voortgezet onderwijs][ref1] betreft, of


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10c
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10c
  - number: VI.1.c
    text: |-
      een school voor praktijkonderwijs als bedoeld in [artikel 10f van de Wet voortgezet onderwijs][ref1],
      voor zover deze een scholengemeenschap vormt met een agrarisch opleidingscentrum als bedoeld in
      [artikel 1.3.3 van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10f
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel1
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: 10f
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '1'
  - number: VI.2
    text: |-
      Gedurende een periode van twee jaar vanaf het tijdstip van inwerkingtreding van [artikel II][ref1] van deze wet is
      [artikel 7, vijfde lid, van de Wet rijonderricht motorrijtuigen 1993][ref2] niet van toepassing op:


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0006073#Artikel7
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: II
      - id: ref2
        bwb_id: BWBR0006073
        artikel: '7'
  - number: VI.2.a
    text: |-
      personen die op het tijdstip van inwerkingtreding van [artikel II][ref1] van deze wet in dienst zijn van een
      instelling voor agrarisch onderwijs, in het schooljaar voorafgaand aan dat tijdstip reeds zulk onderwijs gaven en
      in het bezit zijn van een bij ministeriële regeling vastgestelde pas;


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: II
  - number: VI.2.b
    text: |-
      personen die op het tijdstip van inwerkingtreding van [artikel II][ref1] van deze wet beschikken over een bij
      ministeriële regeling aangewezen, geldige bevoegdheidspas van de Stichting Bevordering Verkeerseducatie.


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelII
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0036167
        artikel: II
  - number: VI.3
    text: |-
      In aanvulling op het tweede lid is gedurende de in dat lid bedoelde periode
      [artikel 12b van de Wet rijonderricht motorrijtuigen 1993][ref1] niet van toepassing op de in het tweede lid,
      onderdeel a, bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006073#Artikel12b
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVI
    references:
      - id: ref1
        bwb_id: BWBR0006073
        artikel: 12b
  - number: VII.1
    text: |-
      Op de eerste vordering van de in [artikel 159 van de Wegenverkeerswet 1994][ref1] bedoelde personen is de
      bestuurder van een landbouw- of bosbouwtrekker of een motorrijtuig met beperkte snelheid verplicht dat motorrijtuig
      te doen stilhouden, alsmede het in [artikel IV, eerste lid][ref2], van deze wet bedoelde certificaat van
      vakbekwaamheid behoorlijk ter inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0036167#ArtikelIV
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
      - id: ref2
        bwb_id: BWBR0036167
        artikel: IV
  - number: VII.2
    text: |-
      Op de eerste vordering van de in [artikel 159 van de Wegenverkeerswet 1994][ref1] bedoelde personen zijn de in
      [artikel VI, tweede lid][ref2], van deze wet bedoelde personen verplicht de in dat lid bedoelde pas behoorlijk ter
      inzage af te geven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel159
      [ref2]: https://wetten.overheid.nl/BWBR0036167#ArtikelVI
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVII
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '159'
      - id: ref2
        bwb_id: BWBR0036167
        artikel: VI
  - number: VII.3
    text: |-
      Overtreding van het eerste en tweede lid wordt als overtreding gestraft met hechtenis van ten hoogste twee maanden
      of een geldboete van de tweede categorie.
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVII
  - number: VIIa
    text: |-
      Onze Minister van Infrastructuur en Milieu zendt binnen twee jaar na de inwerkingtreding van deze wet aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVIIa
  - number: VIII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036167/2021-04-24#ArtikelVIII
