preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het wenselijk is dat er een rijbewijsplicht komt voor het besturen van
    landbouw- en bosbouwtrekkers en motorrijtuigen met beperkte snelheid;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0036167/2022-08-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      Aanvragen tot afgifte van het op grond van [artikel 20, eerste lid, van de Arbeidsomstandighedenwet][ref1] af te
      geven certificaat van vakbekwaamheid, bedoeld in [artikel 9.36 van het Arbeidsomstandighedenbesluit][ref2] zoals
      dat artikel luidde op de dag voorafgaande aan het tijdstip van inwerkingtreding van [artikel I][ref3] van deze wet
      die voor dat tijdstip zijn ingediend, worden behandeld overeenkomstig de bepalingen die tot dat tijdstip golden
      voor de afgifte van dat certificaat.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0008498#Artikel9.36
