  - number: VII
    text: |-
      1 Op de eerste vordering van de in [artikel 159 van de Wegenverkeerswet 1994][ref1] bedoelde personen is de
      bestuurder van een landbouw- of bosbouwtrekker of een motorrijtuig met beperkte snelheid verplicht dat motorrijtuig
      te doen stilhouden, alsmede het in [artikel IV, eerste lid][ref2], van deze wet bedoelde certificaat van
      vakbekwaamheid behoorlijk ter inzage af te geven.

      2 Op de eerste vordering van de in [artikel 159 van de Wegenverkeerswet 1994][ref3] bedoelde personen zijn de in
      [artikel VI, tweede lid][ref4], van deze wet bedoelde personen verplicht de in dat lid bedoelde pas behoorlijk ter
      inzage af te geven.

      3 Overtreding van het eerste en tweede lid wordt als overtreding gestraft met hechtenis van ten hoogste twee
      maanden of een geldboete van de tweede categorie.


