  - number: IV
    text: |-
      1 Op grond van [artikel 20, eerste lid, van de Arbeidsomstandighedenwet][ref1] afgegeven certificaten van
      vakbekwaamheid als bedoeld in [artikel 9.36 van het Arbeidsomstandighedenbesluit][ref2] die zijn afgegeven voor de
      inwerkingtreding van [artikel I][ref3] van deze wet geven de bevoegdheid tot het besturen van rijbewijsplichtige
      voertuigen van de categorie T tot uiterlijk één jaar na de inwerkingtreding van artikel I van deze wet.

      2 Gedurende de in het eerste lid bedoelde termijn is ten aanzien van houders van het in het eerste lid bedoelde
      certificaat [artikel 107, eerste lid, van de Wegenverkeerswet 1994][ref4] niet van toepassing op het besturen van
      bij algemene maatregel van bestuur aangewezen landbouw- en bosbouwtrekkers en motorrijtuigen met beperkte snelheid.

      3 Tot uiterlijk één jaar na de datum van inwerkingtreding van [artikel I][ref5] van deze wet wordt aan houders
      van het in het eerste lid bedoelde certificaat op aanvraag en tegen betaling van het daarvoor vastgestelde tarief
      overeenkomstig bij algemene maatregel van bestuur vastgestelde eisen een rijbewijs afgegeven dat geldig is voor
      het besturen van bij algemene maatregel van bestuur aangewezen landbouw- en bosbouwtrekkers en motorrijtuigen met
      beperkte snelheid.


      [ref1]: https://wetten.overheid.nl/BWBR0010346#Artikel20
