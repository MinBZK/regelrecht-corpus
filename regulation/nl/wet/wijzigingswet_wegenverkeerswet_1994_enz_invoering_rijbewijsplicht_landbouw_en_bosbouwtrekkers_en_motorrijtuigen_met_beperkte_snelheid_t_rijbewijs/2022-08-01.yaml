  - number: V
    text: |-
      1 Personen aan wie voor het tijdstip van inwerkingtreding van [artikel I][ref1] van deze wet een rijbewijs is
      afgegeven voor de categorie B, dan wel ten aanzien van wie voor genoemd tijdstip het besluit tot afgifte van een
      rijbewijs voor de categorie B is genomen, zijn tevens bevoegd tot het besturen van bij algemene maatregel van
      bestuur aangewezen landbouw- en bosbouwtrekkers en motorrijtuigen met beperkte snelheid tot uiterlijk tien jaar na
      inwerkingtreding van artikel I van deze wet, dan wel tot het tijdstip waarop een nieuw of vervangend rijbewijs voor
      de categorie B wordt afgegeven, indien dit tijdstip valt binnen genoemde periode van tien jaar.

      2 Aan personen aan wie voor het tijdstip van de inwerkingtreding van [artikel I][ref2] van deze wet een rijbewijs
      is afgegeven voor de categorie B dat op dat tijdstip nog geldig is of waarvan de geldigheid voor dat tijdstip is
      verlopen door het verstrijken van de geldigheidsduur, dan wel ten aanzien van wie voor genoemd tijdstip het besluit
      tot afgifte van een rijbewijs voor de categorie B is genomen, wordt tot uiterlijk tien jaar na dat tijdstip van
      inwerkingtreding op aanvraag en tegen betaling van het daarvoor vastgestelde tarief overeenkomstig bij algemene
      maatregel van bestuur vastgestelde eisen een rijbewijs afgegeven dat mede geldig is voor het besturen van bij
      algemene maatregel van bestuur aangewezen landbouwen bosbouwtrekkers en motorrijtuigen met beperkte snelheid.

      3 Het eerste en tweede lid gelden niet ten aanzien van houders van een rijbewijs B die dat rijbewijs hebben
      verkregen op of na hun zeventiende verjaardag, maar voor hun achttiende verjaardag, gedurende de periode dat zij
      alleen onder begeleiding een motorrijtuig van de rijbewijscategorie B mogen besturen.

      4 Voor de toepassing van het eerste tot en met derde lid wordt onder rijbewijs mede verstaan een geldig rijbewijs
      voor de categorie B, afgegeven door het daartoe bevoegde gezag in een andere lidstaat van de Europese Unie of een
      staat die partij is bij de Overeenkomst betreffende de Europese Economische Ruimte of in Zwitserland, waarvan de
      houder in Nederland woonachtig is.


      [ref1]: https://wetten.overheid.nl/BWBR0036167#ArtikelI
      [ref2]: https://wetten.overheid.nl/BWBR0036167#ArtikelI
