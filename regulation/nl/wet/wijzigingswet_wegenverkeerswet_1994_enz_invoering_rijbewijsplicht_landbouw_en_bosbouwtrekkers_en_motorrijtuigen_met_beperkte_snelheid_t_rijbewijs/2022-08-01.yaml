  - number: VIIa
    text: |-
      Onze Minister van Infrastructuur en Milieu zendt binnen twee jaar na de inwerkingtreding van deze wet aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0036167/2022-08-01#ArtikelVIIa
  - number: VIII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0036167/2022-08-01#ArtikelVIII
