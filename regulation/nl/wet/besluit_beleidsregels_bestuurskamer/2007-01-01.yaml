  - number: '2.1'
    text: |-
      1 Onderdeel van de toetsing door de Bestuurskamer van verordeningen van bedrijfslichamen, op grond
      van de in de wet neergelegde goedkeuringstaak van de Sociaal-Economische Raad en binnen het kader van
      [artikel 128, eerste lid, van de wet][ref1], vormen:

      a. de beleidsregels die in de hoofdstukken van dit besluit zijn opgenomen;

      b. de Modellen voor verordeningen en besluiten bedrijfslichamen, behorend bij dit besluit als [bijlage 1][ref2];

      c. het Draaiboek EG-/WTO-notificatie voor de publiekrechtelijke; bedrijfsorganisatie, behorend bij dit besluit
      als [bijlage 2][ref3].

      2 Een bedrijfslichaam maakt bij een verzoek tot goedkeuring van een verordeninggebruik van de 'Geleidebrief
      aanvraag goedkeuring verordening', volgens het model behorend bij dit besluit als [bijlage 3][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel128
      [ref2]: https://wetten.overheid.nl/BWBR0015680
      [ref3]: https://wetten.overheid.nl/BWBR0015680
      [ref4]: https://wetten.overheid.nl/BWBR0015680
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel2.1
    references:
      - id: ref1
