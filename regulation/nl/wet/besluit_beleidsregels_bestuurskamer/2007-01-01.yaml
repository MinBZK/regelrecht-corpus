  - number: '2.2'
    text: |-
      1 De Bestuurskamer kan een besluit omtrent goedkeuring verdagen, onder meer indien zij dit in verband met de
      naleving of juiste naleving van de in het vorige artikel bedoelde beleidsregels nodig oordeelt.

      2 Indien de Bestuurskamer een besluit tot verdaging heeft genomen krijgt het betrokken bedrijfslichaam daarvan
      onverwijld mededeling.

      3 Indien de Bestuurskamer een besluit tot verdaging heeft genomen in verband met de noodzaak tot notificatie op
      grond van de notificatierichtlijn of melding van steunmaatregelen door het bedrijfslichaam, wordt het besluit
      tot verdaging tegelijkertijd in afschrift gezonden aan de Minister van Economische Zaken of de Minister van
      Landbouw, Natuur en Voedselkwaliteit. De Bestuurskamer neemt het besluit omtrent goedkeuring na ontvangst van een
      schriftelijke mededeling van de minister dat de desbetreffende verordening geen wijziging behoeft.

      4 Indien een verordening waarvan de Bestuurskamer de beslissing tot goedkeuring heeft verdaagd, door het
      bedrijfslichaam wordt gewijzigd, biedt het bedrijfslichaam een aangepaste verordening aan de Bestuurskamer ter
      goedkeuring aan.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel2.2
  - number: '3.1'
    text: |-
      1 Tot het tot stand brengen van nieuwe regelingen wordt alleen besloten, indien de noodzaak daarvan is komen vast
      te staan.

      2 Met het doen van uitspraken en toezeggingen over nieuwe regelingen wordt grote terughoudendheid betracht.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      Alvorens tot het treffen van een regeling wordt besloten, worden de volgende stappen gezet:

      a. kennis wordt vergaard van de relevante feiten en omstandigheden met betrekking tot het bewuste onderwerp;

      b. de doelstellingen die worden nagestreefd, worden zo concreet en nauwkeurig mogelijk vastgesteld;

      c. onderzocht wordt of de gekozen doelstellingen kunnen worden bereikt door middel van het zelfregulerend vermogen
      in de betrokken sector of sectoren dan wel daarvoor publiekrechtelijke interventie noodzakelijk is;

      d. indien publiekrechtelijke interventie noodzakelijk is, wordt onderzocht of de gekozen doelstellingen kunnen
      worden bereikt door aanpassing of beter gebruik van bestaande instrumenten dan wel, indien dit niet mogelijk
      blijkt, welke andere mogelijkheden daartoe bestaan;

      e. de diverse mogelijkheden worden zorgvuldig tegen elkaar afgewogen.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Bij het bepalen van de keuze voor een mogelijkheid tot publiekrechtelijke interventie om een doelstelling te
      bereiken wordt zoveel mogelijk aangesloten bij het zelfregulerend vermogen in de betrokken sector of sectoren.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.3
  - number: '3.4'
    text: |-
      Bij de afweging van verschillende mogelijkheden tot publiekrechtelijke interventie om een doelstelling te bereiken
      wordt in ieder geval gelet op de volgende aspecten:

      a. de mate waarin verwacht mag worden dat een regeling het beoogde doel zal helpen te verwezenlijken;

      b. de neveneffecten van een regeling;

      c. de lasten van een regeling voor de overheid en de publiekrechtelijke bedrijfsorganisatie enerzijds en burgers,
      bedrijven en instellingen anderzijds.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.4
  - number: '3.5'
    text: |-
      1 Gestreefd wordt naar duidelijkheid en eenvoud van regelingen en naar een bestendig karakter daarvan.

      2 Indien een regeling bij wijze van experiment dient te worden ingevoerd, wordt het tijdelijk karakter in de
      regeling tot uitdrukking gebracht.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.5
  - number: '3.6'
    text: |-
      1 Tot het treffen van een regeling wordt niet besloten dan nadat is nagegaan of in voldoende mate handhaving te
      realiseren valt.

      2 Hierbij wordt onderzocht of handhaving het beste langs tuchtrechtelijke of strafrechtelijke weg dan wel op andere
      wijze kan plaatsvinden. [Artikel 104 van de wet][ref1] is daarbij van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel104
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.6
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '104'
  - number: '3.7'
    text: |-
      Een regeling wordt op zodanige wijze ingericht dat zij zo weinig mogelijk conflicten oproept. Daartoe wordt onder
      meer aan het volgende voldaan:

      a. het aantal beslismomenten waartoe toepassing van de regeling aanleiding geeft, wordt tot een minimum beperkt;

      b. de aard en omvang van uitkeringen, voorzieningen en andere voordelen worden zo duidelijk mogelijk in algemeen
      verbindende voorschriften of goed kenbaar gemaakte beleidsregels omschreven.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.7
  - number: '3.8'
    text: |-
      Bij de keuze voor een bepaalde regeling wordt gestreefd naar zo beperkt mogelijke lasten voor burgers, bedrijven en
      instellingen, voor zover niet uitdrukkelijk het opleggen van lasten wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.8
  - number: '3.9'
    text: |-
      Bij de keuze voor een bepaalde regeling wordt eveneens gestreefd naar zo beperkt mogelijke lasten voor de overheid
      en de publiekrechtelijke bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.9
  - number: '3.10'
    text: |-
      De voor een of meer belanghebbenden nadelige gevolgen van een regeling mogen niet onevenredig zijn in verhouding
      tot de met de regeling te dienen doelen.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.10
  - number: '3.11'
    text: |-
      1 Bij de toekenning van bestuursbevoegdheden wordt de uitoefening daarvan zoveel mogelijk genormeerd.

      2 Met het oog hierop worden discretionaire bevoegdheden en bevoegdheden met vage toepassingscriteria niet
      toegekend, tenzij daarvoor goede gronden zijn.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.11
  - number: '3.12'
    text: |-
      Bij het ontwerpen van regelingen wordt onderzocht welke hogere regels de vrijheid van regeling ten aanzien van het
      betrokken onderwerp hebben ingeperkt.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel3.12
  - number: '4.1'
    text: |-
      1 Een bedrijfslichaam kan een financiële relatie slechts aangaan of voortzetten indien aan de volgende
      uitgangspunten is voldaan:

      a. het doel van de financiële relatie is herleidbaar tot de taken en bevoegdheden van het bedrijfslichaam, bedoeld
      in [artikel 71 van de wet][ref1] en in zijn instellingsbesluit;

      b. het doel van de financiële relatie is niet of niet goed te bereiken door middel van financiering door
      privaatrechtelijke organisaties;

      c. het bedrijfslichaam kan de desbetreffende activiteiten niet of niet goed zelf uitvoeren;

      d. de activiteiten komen in beginsel ten goede aan alle ondernemingen waarvoor het bedrijfslichaam is ingesteld, of
      die behoren tot een bepaalde branche of sector binnen zijn werkingssfeer, en de daarbij betrokken personen; en

      e. er is voorzien in een tijdige evaluatie van de doelmatigheid en de doeltreffendheid van de financiële relatie.

      2 Het bedrijfslichaam licht schriftelijk toe op welke wijze de financiële relatie aan de in het eerste lid genoemde
      uitgangspunten voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel71
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '71'
  - number: '4.2'
    text: |-
      1 Indien een bedrijfslichaam voornemens is subsidie per boekjaar aan een rechtspersoon met
      volledige rechtsbevoegdheid te verstrekken, bepaalt het bij verordening of bij besluit dat
      [afdeling 4.2.8 van de Algemene wet bestuursrecht][ref1] daarop van toepassing is.

      2 Bij verordening of bij besluit kan tevens de wijze waarop de in het eerste lid bedoelde afdeling wordt toegepast,
      alsmede het gedeeltelijk of geheel achterwege laten van de toepassing worden bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.2.8
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.2.8
  - number: '5.1'
    text: |-
      Indien een bedrijfslichaam de in [artikel 126, zesde lid van de Wet op de bedrijfsorganisatie][ref1] bedoelde
      mogelijkheid toepast om een aftrek op een heffing toe te staan, komen voor die aftrek in aanmerking:

      a. de ondernemers die, al dan niet rechtstreeks, lid zijn van een organisatie van ondernemers die een of meer leden
      in zijn bestuur heeft benoemd;

      b. de ondernemers die, al dan niet rechtstreeks, lid zijn van een organisatie van ondernemers die een vereniging
      met volledige rechtsbevoegdheid is en die:

      1e krachtens haar statutaire doelstelling haar werkzaamheid kan uitstrekken tot ten minste een belangrijk gedeelte
      van het terrein waarop het bedrijfslichaam een taak heeft te vervullen,

      2e voldoet aan de kwalitatieve representativiteitscriteria, genoemd in de
      [artikelen 3 tot en met 7 van de Verordening representativiteit organisaties][ref2],

      3e tot de werkingssfeer van het bedrijfslichaam behorende leden heeft, waarvan het gewogen aantal niet-onbetekenend
      is,

      4e met betrekking tot de behartiging van sociaal-economische belangen van ondernemers een positie van enige
      betekenis inneemt binnen de groep van ondernemers die zij beoogt te organiseren, hetgeen onder meer kan blijken uit
      de mate van representativiteit binnen die groep, de deelname aan het arbeidsvoorwaardenoverleg, het verrichten van
      studies of diensten die ook buiten die groep van belang worden geacht en de deelname aan regelmatig overleg met de
      overheid, en

      5e haar activiteiten, al dan niet door middel van een federatie van gelijksoortige organisaties, landelijk
      ontplooit.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0011641#Artikel3
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '126'
      - id: ref2
        bwb_id: BWBR0011641
        artikel: '3'
  - number: '5.2'
    text: |-
      Aan de leden van een in [artikel 5.1, onder b][ref1], bedoelde organisatie wordt de aftrek slechts toegestaan
      op grond van een daartoe strekkend verzoek van het bestuur van die organisatie aan het bestuur van het
      bedrijfslichaam.


      [ref1]: https://wetten.overheid.nl/BWBR0015680#Artikel5.1
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0015680
        artikel: '5.1'
        hoofdstuk: '5'
  - number: '6.1'
    text: |-
      De vergoedingen die bedrijfslichamen op grond van [artikel 77 van de Wet op de bedrijfsorganisatie][ref1]
      verstrekken worden onderscheiden in een vacatievergoeding en een vergoeding van reis- en verblijfkosten.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel77
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '77'
  - number: '6.2'
    text: |-
      De vacatievergoeding wordt door het bestuur vastgesteld hetzij op een bedrag per vergadering, hetzij op een bedrag
      per dagdeel waarin wordt vergaderd. De vacatievergoeding bedraagt per vergadering of dagdeel ten hoogste het bedrag
      dat de Sociaal-Economische Raad in de Verordening vergoedingen aan leden van de raad, het dagelijks bestuur en de
      commissies voor enig jaar vaststelt.

      Indien de vergoeding op een bedrag per vergadering wordt vastgesteld, geldt als voorwaarde dat voor twee of meer
      vergaderingen die binnen één dagdeel aanvangen en eindigen, slechts eenmaal een vacatievergoeding wordt toegekend.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel6.2
  - number: '6.3'
    text: |-
      De vergoeding van reis- en verblijfkosten wordt door het bestuur vastgesteld hetzij in de vorm van een regeling
      waarbij de werkelijk gemaakte kosten op declaratie worden vergoed, hetzij in de vorm van een passend te achten
      forfaitaire vergoeding waarin met de afstand tussen woonplaats en vergaderplaats rekening is gehouden.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel6.3
  - number: '6.4'
    text: |-
      In de vergoedingenregelingen dienen de presentielijsten van de vergaderingen als het uitsluitende bewijs dat de
      betrokken personen de vergaderingen bijwoonden of voorzaten.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel6.4
  - number: '6.5'
    text: |-
      De vergoedingen, bedoeld in [artikel 83 van de Wet op de bedrijfsorganisatie][ref1], worden door het bestuur
      vastgesteld op een bedrag voor elk dagdeel dat de voorzitter per week als regel voor het bedrijfslichaam werkzaam
      is. Het aantal dagdelen wordt in overleg tussen voorzitter en bestuur per kalenderjaar bepaald. Het bedrag per
      dagdeel en het aantal in aanmerking genomen dagdelen worden in de verordening vermeld. Het totaal van de vaste
      vergoedingen, onverschillig onder welke benaming en voor welk doel zij worden toegekend, bedraagt op jaarbasis per
      dagdeel ten hoogste dertig keer het bedrag dat de Sociaal-Economische Raad in de Verordening vergoedingen aan leden
      van de raad, het dagelijks bestuur en de commissies voor enig jaar vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0002058#Artikel83
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel6.5
    references:
      - id: ref1
        bwb_id: BWBR0002058
        artikel: '83'
  - number: '6.6'
    text: |-
      Aan de voorzitter kan naast de vaste vergoedingen een vergoeding van de werkelijk gemaakte reis- en verblijfkosten
      worden toegekend.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel6.6
  - number: '6.7'
    text: |-
      In afwijking van het bovenstaande kunnen de vaste vergoedingen voor voorzitters van (hoofd)productschappen door
      het bestuur bij verordening worden vastgesteld op ten hoogste het bedrag van schaal 16, genoemd in de cao voor de
      PBO, verhoogd met 16,5 procent, afgerond op hele euro’s en uitgaande van een voltijdse functievervulling. Daarnaast
      kan het bestuur arbeidsvoorwaarden van het personeel van het bedrijfslichaam van toepassing verklaren op bedoelde
      voorzitters. In de verordening wordt verwezen naar de toepasselijke arbeidsvoorwaarden, zo nodig onder vermelding
      van bedragen of percentages.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel6.7
  - number: '7.1'
    text: Het Besluit beleidsregel subsidieverstrekking wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel7.1
  - number: '7.2'
    text: Het Besluit beleidsregel Schilthuisaftrek wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel7.2
  - number: '7.3'
    text: Het Besluit beleidsregels toetsingsprocedure verordeningen en uitvoeringsbesluiten wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel7.3
  - number: '7.4'
    text: Dit besluit wordt gepubliceerd in het Verordeningenblad Bedrijfsorganisatie.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel7.4
  - number: '7.5'
    text: Dit besluit treedt in werking met ingang van 1 januari 2004.
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel7.5
  - number: '7.6'
    text: 'Dit besluit wordt aangehaald als: Besluit beleidsregels Bestuurskamer.'
    url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#Artikel7.6
