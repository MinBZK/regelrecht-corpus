preamble:
  text: |-
    Gelet op de artikelen 77, 83, 94, 119, 124, vierde lid, en 126, zevende lid, in samenhang met artikel 128, eerste
    lid, van de Wet op de bedrijfsorganisatie;

    Gelet op de Delegatieverordening Bestuurskamer (RE 6/2000);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015680/2007-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. wet: [Wet op de bedrijfsorganisatie][ref1];

      b. Bestuurskamer: commissie, ingesteld bij besluit RE 6/1994 van de Sociaal- Economische Raad op grond van
      [artikel 19 van de wet][ref2];

      c. bedrijfslichaam: een hoofdproduct-, product-, hoofdbedrijf- of bedrijfschap als bedoeld in
      [artikel 66 van de wet][ref3];

      d. financiële relatie:

      1e. het verstrekken van subsidie;

      2e. het uitbesteden van een dienst in relatie tot de in [artikel 71 van de wet][ref4] beschreven taak van
      bedrijfslichamen

      e. Verordening representativiteit organisaties: verordening RE 3/2001 van de Sociaal- Economische Raad van 15
      september 2000;

      f. verordening: verordening als bedoeld in de [artikelen 93][ref5], [119][ref6] en [126 van de wet][ref7];

      g. notificatierichtlijn: [Richtlijn nr. 98/34/EG](31998L0034) van het Europees Parlement en de Raad van de Europese
      Unie van 22 juni 1998 betreffende een informatieprocedure op het gebied van normen en technische voorschriften en
      regels betreffende de diensten van de informatiemaatschappij;

      h. steunmaatregelen: steunmaatregelen als bedoeld in de [artikelen 87](onbekend) en [88](onbekend) (ex [artikelen
      92](onbekend) en [93) van het Verdrag tot oprichting van de Europese Gemeenschap](onbekend);

      i. melding: het op de hoogte brengen van de Europese Commissie van een verordening tot invoering of wijziging
      van een steunmaatregel, als bedoeld in [artikel 88](onbekend) (ex [artikel 93), derde lid, van het Verdrag tot
      oprichting van de Europese Gemeenschap](onbekend);

      j. dagdeel: de delen van een dag waarvan het eerste aanvangt op het tijdstip van aanvang van de eerste bijgewoonde
      vergadering en het tweede en derde aanvangen nadat sedert dat tijdstip vijf respectievelijk tien uren zijn
      verstreken.


