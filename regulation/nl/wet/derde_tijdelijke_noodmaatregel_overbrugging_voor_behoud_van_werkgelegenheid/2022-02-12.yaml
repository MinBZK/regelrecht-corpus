  - number: '13'
    text: |-
      1 De werkgever aan wie subsidie wordt verleend is verplicht bij de aanvraag van de vaststelling van de subsidie
      een verklaring over de naleving van de subsidievoorwaarden, afgegeven door een accountant als bedoeld in
      [artikel 1 van de Wet op het accountantsberoep][ref1], te overleggen. Deze verklaring voldoet aan standaarden die
      door de Koninklijke Nederlandse Beroepsorganisatie van Accountants zijn vastgesteld, met inachtneming van het in de
      bijlage bij deze regeling opgenomen Accountantsprotocol.

      2 Van de verplichting om een verklaring van een accountant over te leggen is de werkgever vrijgesteld, indien het
      totale voorschot per tranche dat is verstrekt aan die natuurlijke persoon, rechtspersoon of groep als bedoeld in
      [artikel 5, zevende lid][ref2], minder is dan € 125.000. In afwijking van de vorige zin geldt de vrijstelling van
      de verplichting om een verklaring van een accountant over te leggen niet indien de totale subsidie per tranche voor
      die natuurlijke persoon, rechtspersoon of groep als bedoeld in [artikel 6, zevende lid][ref3], wordt vastgesteld op
      een bedrag van € 125.000 of meer, of indien de werkgever heeft verzocht om toepassing van artikel 6.

      3 De werkgever die op grond van het tweede lid is vrijgesteld van de verplichting om een verklaring van een
      accountant over te leggen, overlegt ten behoeve van de vaststelling van de subsidie het in de bijlage bij deze
      regeling opgenomen formulier met een verklaring van een deskundige derde waarmee de omzetdaling wordt bevestigd. De
      Minister wijst aan welke deskundige derden een verklaring kunnen afgeven.

      4 Van de verplichting om een verklaring van een deskundige derde te overleggen is de werkgever vrijgesteld,
      indien het totale voorschot per tranche voor die natuurlijke persoon, rechtspersoon of groep als bedoeld in
      [artikel 5, zevende lid][ref4], dat verstrekt is minder dan € 40.000 bedraagt. In afwijking van de vorige zin geldt
      de vrijstelling van de verplichting om een verklaring van een deskundige derde te overleggen niet indien de totale
      subsidie per tranche voor die natuurlijke persoon, rechtspersoon of groep als bedoeld in artikel 5, zevende lid,
      wordt vastgesteld op een bedrag van € 40.000 of meer.


      [ref1]: https://wetten.overheid.nl/BWBR0032573#Artikel1
