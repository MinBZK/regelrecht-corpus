  - number: '15'
    text: |-
      De Minister kan op grond van dit hoofdstuk aan een werkgever, die gedurende een aaneengesloten periode van drie
      kalendermaanden in de periode van 1 oktober 2020 tot en met 28 februari 2021 verwacht te worden geconfronteerd met
      een daling van de omzet van ten minste 20%, per loonheffingennummer een subsidie verlenen over de loonsom in de
      periode van 1 oktober 2020 tot en met 31 december 2020.
    url: https://wetten.overheid.nl/BWBR0044201/2022-02-12#Artikel15
  - number: '16'
    text: |-
      1 De hoogte van de subsidie is de uitkomst van:

      A x B x 3 x 1,4 x 0,8

      Hierbij staat:

      A voor het percentage van de omzetdaling;

      B voor de loonsom waarbij wordt uitgegaan van de totale loonsom van werknemers waarvoor de werkgever het loon heeft
      uitbetaald in het tijdvak, bedoeld in het tweede, derde of vierde lid, met dien verstande dat:

      a. de uitbetaling van vakantiebijslag in het gehanteerde aangiftetijdvak niet wordt meegenomen
      bij de vaststelling van de loonsom, met uitzondering van de uitbetaling van vakantiebijslag
      door de werkgever die geen vakantiebijslag voor de werknemer reserveert, als bedoeld in
      [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref1] zoals dat luidde op 31 december 2021;

      b. de loonsom wordt vermenigvuldigd met 0,926, indien de werkgever geen vakantiebijslag voor de werknemer
      reserveert, als bedoeld in [artikel 5, derde lid, van het Dagloonbesluit werknemersverzekeringen][ref2] zoals dat
      luidde op 31 december 2021;

      c. de loonsom wordt verminderd met een extra periode salaris dat naast het reguliere loon en vakantiebijslag wordt
      uitbetaald in het tijdvak, bedoeld in het tweede, derde of vierde lid; en

      d. het in aanmerking te nemen loon per werknemer niet meer bedraagt dan tweemaal het maximale dagloon, bedoeld
      in [artikel 17 van de Wet financiering sociale verzekeringen][ref3], maal 21,75, berekend na toepassing van de
      onderdelen a tot en met c.

      2 Voor de loonsom, bedoeld in het eerste lid, wordt uitgegaan van het loon over de maand juni 2020. Indien er
      sprake is van een aangiftetijdvak van vier weken, wordt uitgegaan van het loon over het zevende aangiftetijdvak van
      het jaar 2020, waarbij de loonsom in dat aangiftetijdvak wordt verhoogd met 8,33 procent.

      3 Indien er geen loongegevens zijn over het tijdvak, bedoeld in het tweede lid, wordt uitgegaan van het loon over
      de maand april van het jaar 2020. Indien er sprake is van een aangiftetijdvak van vier weken, wordt uitgegaan
      van het loon over het vierde aangiftetijdvak van het jaar 2020, waarbij de loonsom in dat aangiftetijdvak wordt
      verhoogd met 8,33 procent.

      4 Indien er geen sprake is van een aangiftetijdvak van een maand of vier weken, wordt het loon per werknemer
      herleid naar een loon per aangiftetijdvak van een maand.

      5 Indien de loonsom als bedoeld onder de letter C meer dan 10%, naar beneden afgerond, lager is dan driemaal de
      loonsom als bedoeld in het eerste lid, onder de letter B, wordt de subsidie verlaagd met:

      ((0,9B x 3) – C) x 1,4 x 0,8

      Hierbij staat:

      B voor de loonsom, zoals berekend op grond van het eerste lid tot en met vierde lid;

      C voor de loonsom over de periode 1 oktober 2020 tot en met 31 december 2020, met dien verstande dat het eerste en
      het vierde lid van overeenkomstige toepassing zijn, waarbij de gehanteerde aangiftetijdvakken het tiende tot en met
      het twaalfde aangiftetijdvak van het jaar 2020 zijn.

      6 Indien er sprake is van een werkgever die per vier weken aangifte doet voor de loonheffingen, wordt de loonsom,
      bedoeld in het vijfde lid, onder de letter C, bepaald door het elfde tot en met het dertiende aangiftetijdvak van
      het jaar 2020 te hanteren, waarbij de loonsom in die aangiftetijdvakken worden verhoogd met 8,33 procent.

      7 De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van de letter
      B, bedoeld in het eerste lid, worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 26 augustus
      2020 is ingediend, alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden.

      8 De in aanmerking te nemen gegevens uit de loonaangifte van de werkgever ten behoeve van de bepaling van de letter
      C, bedoeld in het vijfde lid, worden beoordeeld op grond van de loonaangifte zoals die uiterlijk op 15 februari
      2021 is ingediend, alsmede de aanvullingen daarop die uiterlijk op die datum hebben plaatsgevonden. Indien de
      loonaangifte na laatstgenoemde datum naar beneden wordt bijgesteld, kan de Minister besluiten de gewijzigde
      loonaangifte in aanmerking te nemen voor de vaststelling van de loonsom, bedoeld in het vijfde lid, onder de letter
      C.

      9 De subsidie wordt verlaagd met 5% indien de werkgever niet heeft voldaan aan de verplichting, bedoeld in
      [artikel 12, onderdeel e][ref4].


