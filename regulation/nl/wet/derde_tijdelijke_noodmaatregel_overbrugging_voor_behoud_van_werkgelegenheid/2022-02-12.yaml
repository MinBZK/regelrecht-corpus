  - number: '12'
    text: |-
      Aan de werkgever aan wie subsidie wordt verleend, worden de volgende verplichtingen opgelegd:

      a. de werkgever is verplicht de subsidie uitsluitend aan te wenden voor het doel waarvoor de subsidie is verstrekt,
      met dien verstande dat de subsidie in ieder geval wordt aangewend voor de betaling van loonkosten;

      b. de werkgever is verplicht de ondernemingsraad of personeelsvertegenwoordiging, bedoeld in de
      [Wet op de ondernemingsraden][ref1], of bij het ontbreken daarvan, de werknemers te informeren over de
      subsidieverlening;

      c. de werkgever is verplicht zich in te spannen om werknemers te stimuleren om deel te nemen aan een
      ontwikkeladvies of aan scholing;

      d. de werkgever is verplicht zich in te spannen om bij te dragen aan de begeleiding naar ander werk voor werknemers
      van wie de arbeidsovereenkomst eindigt of van wie hij het voornemen heeft de arbeidsovereenkomst te beëindigen of
      niet voort te zetten;

      e. indien de werkgever tijdens de subsidieperiode van een tranche, waarvoor hij subsidie heeft aangevraagd,
      een verzoek om toestemming doet om de arbeidsovereenkomst van één of meer werknemers op te zeggen op grond van
      [artikel 669, derde lid, onderdeel a, van Boek 7 van het Burgerlijk Wetboek][ref2] is hij verplicht om in die
      subsidieperiode contact op te nemen met UWV voor ondersteuning bij de begeleiding naar ander werk;

      f. de werkgever voert een zodanig controleerbare administratie dat alle voor de vaststelling van de subsidie van
      belang zijnde gegevens kunnen worden nagegaan en verleent desgevraagd tot vijf jaar na de datum van vaststelling
      van de subsidie inzage in deze administratie;

      g. de werkgever doet de loonaangifte op grond van de [Wet op de loonbelasting 1964][ref3] op de voorgeschreven
      momenten;

      h. de werkgever meldt onverwijld en schriftelijk aan de Minister indien zich omstandigheden voordoen die van belang
      kunnen zijn voor een beslissing tot wijziging, intrekking of vaststelling van de subsidie;

      i. de werkgever overlegt na afloop van de periode waarover subsidie is verleend een definitieve opgave van de
      omzetdaling in de omzetperiode; en

      j. de werkgever werkt tot vijf jaar na de datum van vaststelling van de subsidie, onder meer door het verschaffen
      van de daartoe benodigde inlichtingen, gegevens en bescheiden, mee aan door of namens de Minister ingesteld
      onderzoek dat erop is gericht de Minister inlichtingen te verschaffen die van belang zijn voor het nemen van een
      besluit over het verstrekken van de subsidie, de vaststelling van de rechtmatigheid daarvan, of de ontwikkeling van
      het beleid van de Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0002747
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel669
      [ref3]: https://wetten.overheid.nl/BWBR0002471
