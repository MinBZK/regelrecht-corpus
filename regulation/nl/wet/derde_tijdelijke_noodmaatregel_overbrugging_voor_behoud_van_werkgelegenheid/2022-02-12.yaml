    text: |-
      Onverminderd [artikel 4:35, eerste en tweede lid, van de Algemene wet bestuursrecht][ref1] wordt de
      subsidieverlening geweigerd, indien of voor zover:

      a. niet of onvoldoende aannemelijk is dat de omzetdaling van de betreffende werkgever ten minste het
      minimumpercentage zal zijn, bedoeld in [artikel 15][ref2], [18][ref3], of [21][ref4];

      b. het rekeningnummer dat bij de aanvraag is opgegeven niet correspondeert met het in de aanvraag opgegeven
      loonheffingennummer en de daaraan verbonden rekeninggegevens;

      c. geen loongegevens beschikbaar zijn in de polisadministratie, bedoeld in
      [artikel 33 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref5], over de aangiftetijdvakken
      van de tranches waarvoor subsidie is aangevraagd, bedoeld in [artikel 16, tweede tot en met vierde lid][ref6],
      [19, tweede tot en met vierde lid][ref7], of [22, tweede tot en met vierde lid][ref8]; of

      d. de aanvraag anderszins niet voldoet aan de in deze regeling gestelde eisen.


