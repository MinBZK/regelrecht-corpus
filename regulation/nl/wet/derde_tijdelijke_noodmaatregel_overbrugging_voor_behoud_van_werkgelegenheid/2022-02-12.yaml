preamble:
  text: |-
    Gelet op artikel de artikelen 3, eerste lid, en 8, eerste lid, van de Kaderwet SZW-subsidies en artikel 32d, tweede
    lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0044201/2022-02-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *eerste tranche subsidieregeling:* de
      [Eerste tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid][ref1];
        - *tweede tranche subsidieregeling:* de
      [Tweede tijdelijke noodmaatregel overbrugging voor behoud van werkgelegenheid][ref2];
        - *tranche:* derde tranche, vierde tranche of vijfde tranche;
        - *derde tranche:* de subsidie, bedoeld in [hoofdstuk 2][ref3];
        - *vierde tranche:* de subsidie, bedoeld in [hoofdstuk 3][ref4];
        - *vijfde tranche:* de subsidie, bedoeld in [hoofdstuk 4][ref5];
        - *extra periode salaris:* extra loon dat naast het reguliere loon en vakantiebijslag wordt uitbetaald naar
      aanleiding van afspraken in de individuele of collectieve arbeidsovereenkomst, en dat niet afhankelijk is van
      bedrijfsresultaten of kwalitatieve of kwantitatieve prestaties van de werknemer;
        - *loon:* het loon, bedoeld in [artikel 16 van de Wet financiering sociale verzekeringen][ref6], voor zover
      het betreft loon uit tegenwoordige dienstbetrekking, met uitzondering van uitkeringen in het kader van de
      [Ziektewet][ref7] door eigenrisicodragers;
        - *loonsom:* het loon van alle werknemers, behorende tot een loonheffingennummer;
        - *loonheffingennummer:* het nummer, genoemd in
      [artikel 1a.1, tweede lid, onderdeel b, onder 1, van de Regeling gegevensuitvraag loonaangifte][ref8];
        - *Minister:* de Minister van Sociale Zaken en Werkgelegenheid;
        - *omzetdaling:* een daling van de omzet als bedoeld in [artikel 5, eerste lid][ref9];
        - *omzetperiode:* de omzetperiode, bedoeld in [artikel 4][ref10];
        - *referentie-omzet:* de omzet, bedoeld in [artikel 5 tweede lid][ref11], waarmee wordt vergeleken om de
      omzetdaling, bedoeld in artikel 5, eerste lid, te berekenen;
        - *UWV:* het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref12];
        - *werkgever:* een werkgever als bedoeld in
      [artikel 1, onderdeel q of r, van de Wet financiering sociale verzekeringen][ref13];
        - *werknemer:* een werknemer als bedoeld in
      [artikel 1, onderdeel o of p, van de Wet financiering sociale verzekeringen][ref14].

      2 Onder omzet wordt in deze regeling verstaan de netto-omzet zoals gedefinieerd in
      [artikel 377, zesde lid, van Boek 2 van het Burgerlijk Wetboek][ref15] gecorrigeerd voor de in de winst-
      en-verliesrekening verantwoorde wijziging in onderhanden projecten en bepaald op basis van grondslagen en
      detailtoepassingen die consistent zijn met de grondslagen en detailtoepassingen zoals deze door de werkgever zijn
      gehanteerd in de laatste voor 1 oktober 2020 vastgestelde jaarrekening, mits deze conform de wet- en regelgeving
      is opgesteld. Voor natuurlijke personen is dit de omzetbepaling die de basis is geweest voor de laatst vastgestelde
      aangifte voor de [Wet inkomstenbelasting 2001][ref16], mits deze conform de wet- en regelgeving is opgesteld. Alle
      baten die voortkomen uit de uitvoering van normale activiteiten van een organisatie, ook als deze gewoonlijk met
      een andere term dan omzet worden aangeduid, vallen onder omzet in de zin van deze regeling. Onder omzet wordt in
      deze regeling niet verstaan de subsidie die de werkgever ontvangt op grond van de eerste tranche subsidieregeling
      en de tweede tranche subsidieregeling, alsmede op grond van deze regeling, en de subsidie die de werkgever over
      de omzetperiode ontvangt van de Staatssecretaris van Economische Zaken en Klimaat ter tegemoetkoming in de vaste
      lasten in verband met de maatregelen ter bestrijding van de verdere verspreiding van COVID-19.


