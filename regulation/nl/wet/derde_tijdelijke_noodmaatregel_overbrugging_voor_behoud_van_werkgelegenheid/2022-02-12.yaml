  - number: '5'
    text: |-
      1 De omzetdaling wordt vastgesteld door het verschil tussen de referentie-omzet en de omzet in de omzetperiode te
      delen door de referentie-omzet. De uitkomst van deze berekening wordt uitgedrukt in hele procenten en naar boven
      afgerond.

      2 De referentie-omzet, bedoeld in het eerste lid, is de omzet over het kalenderjaar 2019, gedeeld door vier.

      3 Als de werkgever de bedrijfsuitoefening na 1 januari 2019 is aangevangen, dan is de referentie-omzet, bedoeld
      in het eerste lid, de omzet over de periode vanaf de eerste volledige kalendermaand vanaf de aanvang van de
      bedrijfsuitoefening tot en met 29 februari 2020, gedeeld door het aantal maanden waarvan de omzet in aanmerking
      wordt genomen, vermenigvuldigd met drie.

      4 Als de werkgever na 1 januari 2019 een economische eenheid heeft overgenomen in de zin van
      [artikel 7:662 van het Burgerlijk Wetboek][ref1], of middels een aandelentransactie zeggenschap heeft verkregen
      over een rechtspersoon of vennootschap die onderdeel is geworden van een groep als bedoeld in het zevende lid,
      dan wordt de referentie-omzet, bedoeld in het eerste lid, berekend door de omzet over de periode vanaf de eerste
      volledige kalendermaand vanaf de overgang tot en met 29 februari 2020, te delen door het aantal maanden waarvan de
      omzet in aanmerking wordt genomen, en te vermenigvuldigen met drie. Dit lid wordt toegepast, indien de werkgever
      daar bij de subsidieaanvraag om verzoekt.

      5 Als een werkgever in de periode van 2 januari 2019 tot en met 1 februari 2020 een onderdeel of activiteit heeft
      afgestoten, dan is de referentie-omzet, bedoeld in het eerste lid, de omzet vanaf de eerste volledige kalendermaand
      vanaf de afstoting van het onderdeel of de activiteit tot en met 29 februari 2020, gedeeld door het aantal maanden
      waarvan de omzet in aanmerking wordt genomen, vermenigvuldigd met drie. Als in de periode van 2 januari 2019 tot en
      met 1 februari 2020 meerdere onderdelen of activiteiten zijn afgestoten, wordt gerekend vanaf de eerste volledige
      kalendermaand vanaf de afstoting van het laatste onderdeel of de laatste activiteit.

      6 Voor de omzetdaling wordt uitgegaan van de omzetdaling van de natuurlijke of rechtspersoon.

      7 Indien de rechtspersoon of vennootschap onderdeel is van een groep als bedoeld in
      [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2], wordt, in afwijking van het zesde lid, uitgegaan van
      de omzetdaling van de groep zoals deze op 1 oktober 2020 bestond. Indien de rechtspersoon een dochtermaatschappij
      is van een ander als bedoeld in [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref3], worden de
      dochtermaatschappij en de rechtspersoon voor de werking van deze regeling behandeld als waren zij een groep. Voor
      de bepaling van de omzetdaling als bedoeld in de eerste zin worden de Nederlandse rechtspersonen en vennootschappen
      in aanmerking genomen, alsmede buitenlandse rechtspersonen en vennootschappen met loon in Nederland.

      8 Subsidies en baten die betrekking hebben op een langere periode dan de omzetperiode en de periode, bedoeld in het
      tweede lid, worden naar rato aan de betreffende perioden toegerekend voor de bepaling van de omzetdaling, bedoeld
      in het eerste lid.


