  - number: '7'
    text: |-
      1 De werkgever kan per tranche een subsidieaanvraag indienen door middel van een door de Minister beschikbaar
      gesteld formulier.

      2 Een subsidieaanvraag wordt ingediend in de volgende tijdvakken:

      a. voor aanvragen voor de derde tranche op grond van [hoofdstuk 2][ref1], van 16 november 2020 tot en met
      13 december 2020 en van 15 december 2020, 9.00 uur, tot en met 27 december 2020;

      b. voor aanvragen voor de vierde tranche op grond van [hoofdstuk 3][ref2], van 15 februari 2021 tot en met 14 maart
      2021;

      c. voor aanvragen voor de vijfde tranche op grond van [hoofdstuk 4][ref3], van 6 mei 2021 tot en met 30 juni 2021.

      3 De werkgever kan eenmaal per loonheffingennummer per tranche een subsidieaanvraag indienen.

      4 In de subsidieaanvraag wordt in ieder geval vermeld:

      a. de verwachte omzetdaling;

      b. de omzetperiode, tenzij uit [artikel 4, tweede of derde lid][ref4], voortvloeit welke omzetperiode gehanteerd
      wordt;

      c. het loonheffingennummer;

      d. het door de Kamer van Koophandel toegekend uniek nummer als bedoeld in de [Handelsregisterwet 2007][ref5],
      indien de werkgever daarover beschikt;

      e. het rekeningnummer uit een land dat valt onder de EU-Verordening/260/2012, waarop de werkgever betalingen van de
      Belastingdienst inzake loonheffingen ontvangt; en

      f. of een verzoek als bedoeld in [artikel 5, vierde lid][ref6], wordt gedaan.

      5 In de subsidieaanvraag verklaart de werkgever dat voldaan zal worden aan de verplichting, bedoeld
      in [artikel 14][ref7] en dat indien [artikel 6][ref8] wordt toegepast, het groepshoofd, bedoeld in
      [artikel 406, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref9] en de moedermaatschappij, bedoeld in
      [artikel 24a van Boek 2 van het Burgerlijk Wetboek][ref10], daarmee instemmen.

      6 Indien de werkgever onderdeel is van een groep als bedoeld in [artikel 5, zevende lid][ref11], of indien de
      werkgever meerdere loonheffingennummers heeft, wordt hetzelfde percentage, bedoeld in het vierde lid, onderdeel a,
      alsook dezelfde omzetperiode, bedoeld in het vierde lid, onderdeel b, voor alle rechtspersonen en vennootschappen
      binnen de groep respectievelijk de loonheffingennummers gehanteerd. In afwijking van de eerste zin hoeft voor de
      werkgever die onderdeel is van een groep als bedoeld in artikel 5, zevende lid, niet hetzelfde percentage, bedoeld
      in het vierde lid, onderdeel a te worden gehanteerd als het percentage dat voor de groep wordt gehanteerd, als de
      werkgever bij de aanvraag tot vaststelling verzoekt [artikel 6][ref12] toe te passen.

      7 De subsidieaanvraag wordt elektronisch gedaan, tenzij op www.uwv.nl kenbaar wordt gemaakt dat een schriftelijke
      subsidieaanvraag ook mogelijk is.

      8 Door het indienen van een aanvraag stemt de werkgever ermee in dat de volgende gegevens uit het subsidiedossier
      openbaar gemaakt kunnen worden:

      a. de naam en de vestigingsplaats van werkgever;

      b. het verstrekte voorschot; en

      c. de vastgestelde subsidie.


