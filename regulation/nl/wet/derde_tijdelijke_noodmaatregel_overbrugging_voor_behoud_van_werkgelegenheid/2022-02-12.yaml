  - number: '24'
    text: |-
      1 De werkgever vraagt de vaststelling van de subsidie voor de derde tranche aan na 3 oktober 2021 en uiterlijk
      op 22 februari 2023 en voor de vierde en vijfde tranche na 30 januari 2022 en uiterlijk op 22 februari 2023. De
      vaststelling van de subsidie wordt voor elke tranche afzonderlijk aangevraagd door middel van een door de Minister
      vast te stellen formulier. [Artikel 7, zevende lid][ref1], is van overeenkomstige toepassing.

      2 Bij de aanvraag van de vaststelling worden voor iedere tranche waarover subsidie is verleend in ieder geval
      meegezonden:

      a. de definitieve gegevens over de omzetdaling in de omzetperiode, alsmede informatie waaruit dit blijkt;

      b. een verklaring waaruit blijkt of in de periode, bedoeld in [artikel 5, vijfde lid][ref2], onderdelen of
      activiteiten zijn afgestoten;

      c. de verklaring van een accountant of een derde, bedoeld in [artikel 13, eerste en derde lid][ref3]; en

      d. een verklaring dat voldaan is aan [artikel 12, onderdelen a, b, en f tot en met j][ref4] en [artikel 14][ref5]
      genoemde verplichtingen;

      3 De werkgever die bij de aanvraag van de vaststelling verzoekt om toepassing van [artikel 6][ref6] verklaart voor
      iedere tranche waarvoor hij toepassing van artikel 6 verzoekt dat voldaan is aan de voorwaarden van artikel 6 en
      zendt voor iedere tranche een verklaring van een accountant mee waaruit dat blijkt.

      4 Indien een natuurlijke persoon of rechtspersoon of groep als bedoeld in [artikel 5, zevende lid][ref7], een
      verklaring van een accountant dient te overleggen op grond van [artikel 13, eerste lid][ref8], of een verklaring
      van een deskundige derde op grond van artikel 13, derde lid, vult de werkgever, die geen verklaring van een
      accountant, respectievelijk verklaring van een deskundige derde heeft meegezonden, op verzoek van de minister de
      aanvraag binnen 14 weken met de benodigde verklaring aan.

      5 De subsidies worden vastgesteld aan de hand van de berekeningswijze, bedoeld in [artikel 16][ref9], [19][ref10],
      of [22][ref11], met dien verstande dat de subsidie voor een tranche in ieder geval op nihil wordt vastgesteld,
      indien:

      a. de omzetdaling in de omzetperiode voor die tranche minder bedraagt dan het tranchegebonden minimumpercentage,
      bedoeld in [artikel 15][ref12], [18][ref13] of [21][ref14];

      b. de werkgever voor die tranche geen verklaring van een accountant, als bedoeld in
      [artikel 13, eerste lid][ref15], of een verklaring van een deskundige derde als bedoeld in artikel 13, derde lid,
      verstrekt, tenzij hij daarvan op grond van artikel 13, tweede en vierde lid, is vrijgesteld; of

      c. de werkgever die verzocht heeft om toepassing van [artikel 6][ref16], voor die tranche niet voldoet aan de
      voorwaarden in artikel 6; of

      d. indien met betrekking tot die tranche in strijd is gehandeld met een verplichting, als bedoeld in
      [artikel 14][ref17].

      6 De Minister stelt de subsidies vast binnen 52 weken na ontvangst van de aanvraag, bedoeld in het eerste lid.


