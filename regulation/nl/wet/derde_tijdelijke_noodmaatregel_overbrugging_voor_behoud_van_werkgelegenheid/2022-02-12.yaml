  - number: '3'
    text: |-
      Het doel van deze regeling is om werkgevers tegemoet te komen in de betaling van de loonkosten, indien sprake
      is van een acute terugval in de omzet met ten minste een per tranche verschillend minimumpercentage, gedurende
      een periode van drie maanden, vanwege een vermindering in bedrijvigheid door buitengewone omstandigheden die in
      redelijkheid niet tot het normale ondernemersrisico kunnen worden gerekend, voor zover geen winst of bonussen
      worden uitgekeerd of eigen aandelen worden aangekocht, zodat werkgevers zoveel mogelijk werknemers in dienst kunnen
      houden en werkgevers zich samen met de werknemers kunnen voorbereiden op en aanpassen aan de nieuwe economische
      situatie.
    url: https://wetten.overheid.nl/BWBR0044201/2022-02-12#Artikel3
  - number: '4'
    text: |-
      1 De omzetperiode is de aaneengesloten periode van drie kalendermaanden als bedoeld in [artikel 15][ref1],
      [18][ref2] of [21][ref3], die de werkgever kiest.

      2 Als aan een werkgever subsidie is verleend op grond van de [tweede tranche subsidieregeling][ref4],
      dan sluit de omzetperiode, bedoeld in [artikel 15][ref5], aan op de omzetperiode bedoeld in
      [artikel 10, vierde lid, onderdeel b, van de tweede tranche subsidieregeling][ref6].

      3 Als aan een werkgever subsidie is verleend op grond van de direct voorafgaande tranche, dan sluit de omzetperiode
      aan op de omzetperiode zoals die voor die voorafgaande tranche is gehanteerd.

      4 Het tweede lid is niet van toepassing indien de werkgever voorafgaand aan de subsidieaanvraag, bedoeld in
      [artikel 7, tweede lid, onder a][ref7], verzocht heeft de beschikking tot subsidieverlening op grond van de tweede
      tranche subsidieregeling in te trekken.

      5 Het derde lid is niet van toepassing indien de werkgever:

      a. voor 15 februari 2021 verzocht heeft de beschikking tot subsidieverlening op grond van de derde tranche in te
      trekken, of;

      b. voor 1 april 2021, verzocht heeft de beschikking tot subsidieverlening op grond van de vierde tranche in te
      trekken.


