    text: |-
      Onverminderd [artikel 4:56 van de Algemene wet bestuursrecht][ref1], schort de Minister de betaling van een
      voorschot als bedoeld in [artikel 9][ref2] op, indien:

      a. sprake is van een ernstig vermoeden dat niet voldaan wordt aan de voorwaarden of de verplichtingen, bedoeld in
      [artikel 12, onderdelen a, b, en f tot en met j][ref3], [artikel 13][ref4] en [14][ref5], die zijn verbonden aan de
      subsidie; of

      b. indien een melding van de werkgever daartoe aanleiding geeft.


