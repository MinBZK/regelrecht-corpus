articles:
  - number: '1'
    text: |-
      Als instellingen van wetenschap of onderzoek, bedoeld in
      [artikel 37, tweede lid, van de Diergeneesmiddelenwet][ref1] (Stb. 1985, 410), worden aangewezen:

      a. de Stichting Centraal Diergeneeskundig Instituut;

      b. de Faculteit der Diergeneeskunde van de Rijksuniversiteit te Utrecht;

      c. het Rijksinstituut voor Volksgezondheid en Milieuhygiëne.


      [ref1]: https://wetten.overheid.nl/BWBR0003818#Artikel37
