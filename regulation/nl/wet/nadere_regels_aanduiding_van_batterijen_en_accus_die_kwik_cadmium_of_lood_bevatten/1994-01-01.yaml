$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: nadere_regels_aanduiding_van_batterijen_en_accus_die_kwik_cadmium_of_lood_bevatten
regulatory_layer: WET
publication_date: '2008-09-18'
valid_from: '1994-01-01'
bwb_id: BWBR0006253
url: https://wetten.overheid.nl/BWBR0006253/1994-01-01
preamble:
  text: |-
    Gelet op richtlijn nr. 93/86/EEG van de Commissie van de Europese Gemeenschappen van 4 oktober 1993 betreffende
    aanpassing aan de technische vooruitgang van Richtlijn 91/157/EEG van de Raad inzake batterijen en accu's die
    gevaarlijke stoffen bevatten (PbEG L 264,51) en op artikel 3, eerste en tweede lid, en artikel 5, tweede lid, van
    het koninklijk besluit van 15 september 1992 tot vaststelling van regels inzake batterijen en accu's die kwik,
    cadmium of lood bevatten (Stb. 486);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

            besluit:

              het koninklijk besluit van 15 september 1992 (Stb. 486) tot vaststelling van regels inzake batterijen en
      accu's die kwik, cadmium of lood bevatten;



            aanduiding:

              de aanduiding, bedoeld in artikel 3, eerste lid, van het besluit.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel1
  - number: '2.1'
    text: |-
      De aanduiding op batterijen of accu's bestaat uit een teken voor gescheiden inzameling en een teken dat de
      aanwezigheid van de metalen kwik, cadmium of lood aangeeft.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel2
  - number: '2.2'
    text: De aanduiding wordt aangebracht door degene die de batterijen of accu's vervaardigt of in Nederland invoert.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel2
  - number: '2.3'
    text: |-
      Onverminderd het bepaalde in het tweede lid, draagt degene die apparaten vervaardigt of in Nederland invoert, die
      een of meer batterijen bevatten, ervoor zorg dat deze batterijen zijn voorzien van een aanduiding.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel2
  - number: '3.1'
    text: |-
      Het teken voor gescheiden inzameling bestaat uit een afbeelding van een afvalbak met een kruis erdoor, zoals
      aangegeven in de bij deze regeling behorende bijlage.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel3
  - number: '3.2'
    text: |-
      Degene die ingevolge [artikel 2][ref1] de batterijen of accu's voorziet van het teken, bepaalt welke van de twee
      afbeeldingen, aangegeven in de bij deze regeling behorende bijlage, voor de betrokken batterijen of accu's als
      inzamelteken geldt.


      [ref1]: https://wetten.overheid.nl/BWBR0006253#Artikel2
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006253
        artikel: '2'
  - number: '4.1'
    text: |-
      Het teken dat de aanwezigheid van de metalen kwik, cadmium of lood in batterijen of accu's aangeeft, bestaat uit
      het chemisch symbool voor het metaal dat in de betrokken batterijen of accu's aanwezig is.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel4
  - number: '4.2'
    text: 'Het chemisch symbool is:'
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel4
  - number: 4.2.a
    text: 'voor kwik: Hg,'
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel4
  - number: 4.2.b
    text: 'voor cadmium: Cd,'
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel4
  - number: 4.2.c
    text: 'voor lood: Pb.'
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel4
  - number: '5.1'
    text: |-
      Het teken voor gescheiden inzameling, bedoeld in [artikel 3][ref1], heeft een oppervlakte van 3% van de oppervlakte
      van de grootste zijde van de batterij of accu of, ingeval van een ronde batterij of accu, van 3% van de helft van
      de totale zij-oppervlakte van de batterij of de accu. De maximale oppervlakte van het teken bedraagt 25 cm².


      [ref1]: https://wetten.overheid.nl/BWBR0006253#Artikel3
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006253
        artikel: '3'
  - number: '5.2'
    text: |-
      Het chemisch symbool, dat ingevolge [artikel 4][ref1] als teken op de batterij of accu wordt aangebracht, heeft
      een oppervlakte van ten minste 25% van de oppervlakte van het inzamelteken. Het wordt aangebracht onder het
      inzamelteken.


      [ref1]: https://wetten.overheid.nl/BWBR0006253#Artikel4
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006253
        artikel: '4'
  - number: '5.3'
    text: De tekens, bedoeld in het eerste en tweede lid, worden aangebracht op de batterij of de accu.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel5
  - number: '5.4'
    text: |-
      Indien de oppervlakte van het inzamelteken minder is dan 0,25 cm², worden het inzamelteken en het symbool, bedoeld
      in [artikel 4][ref1], aangebracht op de verpakking. De oppervlakte van het inzamelteken bedraagt in dat geval
      1 cm².


      [ref1]: https://wetten.overheid.nl/BWBR0006253#Artikel4
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0006253
        artikel: '4'
  - number: '5.4'
    text: De tekens zijn zodanig aangebracht dat ze goed zichtbaar zijn, duidelijk leesbaar en onuitwisbaar.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel5
  - number: '6'
    text: |-
      Het aanduiden van een batterij of accu op een wijze die misleidend is ten aanzien van de aanduiding, bedoeld in
      [artikel 2][ref1], is verboden.


      [ref1]: https://wetten.overheid.nl/BWBR0006253#Artikel2
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0006253
        artikel: '2'
  - number: '7'
    text: |-
      Ten aanzien van batterijen of accu's die op 1 januari 1994 reeds in de Europese Gemeenschappen zijn vervaardigd
      of ingevoerd, blijft het verbod, bedoeld in artikel 3, eerste lid, van het besluit tot 1 januari 1996 buiten
      toepassing.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel7
  - number: '8'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 1994. Deze regeling zal met de toelichting in de
      Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006253/1994-01-01#Artikel8
