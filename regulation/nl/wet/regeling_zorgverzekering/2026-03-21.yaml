      - id: ref3
        bwb_id: BWBR0018715
        artikel: '7.10'
        hoofdstuk: '7'
  - number: 7.4a
    text: |-
      De zorgverzekeraar verstrekt aan het CAK voor 1 oktober van het jaar waarin een uitkering als bedoeld in
      [artikel 118a van de wet][ref1] wordt verstrekt, van zijn verzekerden of gewezen verzekerden die in dat jaar de
      leeftijd van achttien jaar hebben bereikt of nog zullen bereiken en die in de twee kalenderjaren, voorafgaande
      aan dat jaar voldoen aan de voorwaarden, bedoeld in [artikel 8.3, eerste lid][ref2], of in een DKG als bedoeld in
      artikel 8.3, tweede lid, zijn ingedeeld, de volgende persoonsgegevens:

      a. het burgerservicenummer;

      b. het bank- of girorekeningnummer.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel8.3
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '8.3'
        hoofdstuk: '8'
  - number: '7.5'
    text: |-
      1 De zorgverzekeraar stelt voorafgaand aan de uitvoering van materiële controle het doel ervan vast door te
      bepalen wanneer voldoende zekerheid is verkregen dat de door de zorgaanbieder in rekening gebrachte prestatie is
      geleverd of die geleverde prestatie het meest was aangewezen gezien de gezondheidstoestand van de verzekerde. Bij
      de vaststelling neemt de zorgverzekeraar het bij of krachtens de [Wet marktordening gezondheidszorg][ref1] door de
      Nederlandse Zorgautoriteit bepaalde met betrekking tot het uitvoeren van controles in acht.

      2 De vaststelling door de zorgverzekeraar wanneer voldoende zekerheid is verkregen dat de geleverde prestatie het
      meest was aangewezen gezien de gezondheidstoestand van de verzekerde, geschiedt met inachtneming van het bepaalde
      in [artikel 2.1 van het Besluit zorgverzekering][ref2] en zodanig dat voor verzekerden en zorgaanbieders zoveel
      mogelijk inzichtelijk is welke maatstaven daarbij gelden.

      3 De zorgverzekeraar mag verzekerden met gebruikmaking van persoonsgegevens waarover hij in verband met de
      uitvoering van de zorgverzekering reeds beschikt enquêteformulieren zenden om onderzoek te doen

      1°. of de in rekening gebrachte zorg daadwerkelijk is verleend, en

      2°. naar de door die verzekerden ervaren kwaliteit van de verzekerde zorg die een zorgaanbieder verleent of heeft
      verleend.

      4 Bij de verzending van enquêteformulieren als bedoeld in het derde lid informeert de zorgverzekeraar de verzekerde
      erover dat hij niet verplicht is tot beantwoording van de gestelde vragen en dat onthouden van medewerking op geen
      enkele wijze tot zijn nadeel zal strekken.

      5 De zorgverzekeraar draagt er zorg voor dat terug ontvangen enquêteformulieren als bedoeld in het derde lid,
      onderdeel 2°, niet herleidbaar zijn tot personen en dat niet herleidbaar is welke verzekerden geen formulier hebben
      teruggestuurd.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2.1
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0020078
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2.1'
  - number: '7.6'
    text: |-
      1 De zorgverzekeraar voert een algemene risicoanalyse uit op basis van gegevens waarover deze in verband met de
      uitvoering van de zorgverzekering beschikt.

      2 De zorgverzekeraar stelt op basis van de in het eerste lid uitgevoerde algemene risicoanalyse een algemeen
      controleplan vast, waarin de objecten van materiële controle en de in te zetten controle-instrumenten zijn
      opgenomen.

      3 Het naar aanleiding van de algemene risicoanalyse opgestelde algemene controleplan voorziet niet in de inzet van
      het controle-instrument detailcontrole.

      4 Indien uit het uitgevoerde algemene controleplan blijkt dat het controledoel, bedoeld in
      [artikel 7.5, eerste lid][ref1], is bereikt, kan alleen detailcontrole worden uitgevoerd als er van een ander dan
      de zorgverzekeraar afkomstige of uit de uitgevoerde controle voortvloeiende aanwijzingen zijn waaruit blijkt dat er
      sprake is van onvoldoende zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.5
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7.5'
        hoofdstuk: '7'
  - number: '7.7'
    text: |-
      De zorgverzekeraar maakt informatie openbaar over het ingevolge [artikel 7.5][ref1] vastgestelde controledoel en
      het ingevolge [artikel 7.6][ref2] vastgestelde algemene controleplan op een zodanige wijze dat die informatie voor
      verzekerden en zorgaanbieders gemakkelijk verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.5
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7.5'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7.6'
        hoofdstuk: '7'
  - number: '7.8'
    text: |-
      1 De zorgverzekeraar voert geen detailcontrole uit, dan nadat is voldaan aan de volgende voorwaarden:

      a. de zorgverzekeraar heeft een specifieke risicoanalyse verricht op de bevindingen uit het uitgevoerde algemene
      controleplan bedoeld in [artikel 7.6, tweede lid][ref1];

      b. de zorgverzekeraar heeft naar aanleiding van de specifieke risicoanalyse een specifiek controleplan en specifiek
      controledoel opgesteld, waarin de objecten van materiële controle en de methoden van detailcontrole zijn opgenomen;

      c. het overeenkomstig onderdeel b vastgestelde specifieke doel van de materiële controle kan zonder detailcontrole
      niet worden bereikt;

      d. uit het specifieke controleplan blijkt dat de detailcontrole niet verder gaat dan gelet op het met het
      onderzoeksdoel en de omstandigheden van het te onderzoeken geval noodzakelijk is;

      e. de zorgverzekeraar heeft de zorgaanbieder voorafgaand aan de uitvoering van de detailcontrole toereikende – en
      op verzoek van de zorgaanbieder schriftelijke – informatie verstrekt waarin wordt gemotiveerd hoe is voldaan aan de
      in dit lid genoemde voorwaarden.

      2 Indien bij de uitvoering van detailcontrole persoonsgegevens van verzekerden worden verwerkt, geschiedt dit onder
      verantwoordelijkheid van een medisch adviseur in opdracht van de zorgverzekeraar en is deze op voorafgaand verzoek
      van de zorgaanbieder aanwezig bij dit deel van de controle.

      3 In afwijking van het eerste lid kan de zorgverzekeraar met betrekking tot een individuele verzekerde
      detailcontrole uitvoeren zonder dat de in dat lid genoemde voorwaarden van toepassing zijn, indien deze verzekerde
      ten behoeve van de materiële controle schriftelijk toestemming aan de zorgaanbieder heeft gegeven voor verstrekking
      van hem betreffende gegevens over gezondheid aan de zorgverzekeraar. De zorgverzekeraar verwerkt bij de
      detailcontrole niet meer gegevens dan gelet op het onderzoeksdoel en de omstandigheden van het geval noodzakelijk
      is.

      4 De zorgverzekeraar informeert de zorgaanbieder over de zakelijke inhoud van de voorgenomen uitkomsten van de
      detailcontrole en stelt de zorgaanbieder in de gelegenheid daarop binnen een redelijke termijn te reageren. De
      zorgverzekeraar betrekt de reactie van de zorgaanbieder bij de vaststelling van de definitieve uitkomsten van de
      detailcontrole en bericht deze uitkomsten aan de zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7.6'
        hoofdstuk: '7'
  - number: '7.9'
    text: |-
      1 De zorgverzekeraar legt de specifieke risicoanalyse en de uitvoering van detailcontroles in zijn administratie
      vast om toetsing door en verantwoording aan toezichthouders mogelijk te maken. Daarbij worden niet meer
      persoonsgegevens, waaronder gegevens over gezondheid, verwerkt dan voor dit doel noodzakelijk is.

      2 De zorgverzekeraar bewaart na detailcontroles de daarbij verwerkte persoonsgegevens van verzekerden niet langer
      dan noodzakelijk is voor het doel waarvoor zij zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.9
  - number: '7.10'
    text: |-
      1 Bij fraudeonderzoek zijn de voorwaarden bedoeld in [artikel 7.8, eerste lid, onderdelen b en d][ref1], van
      overeenkomstige toepassing, en is de in onderdeel e bedoelde voorwaarde van overeenkomstige toepassing voor zo ver
      het onderzoeksbelang of het belang van de bescherming van de persoonlijke levenssfeer van de betrokken verzekerde
      zich daar niet tegen verzet.

      2 In afwijking van het eerste lid kan de zorgverzekeraar met betrekking tot een individuele verzekerde
      detailcontrole uitvoeren zonder dat de in dat lid genoemde voorwaarden van toepassing zijn, indien deze verzekerde
      ten behoeve van het fraudeonderzoek schriftelijk toestemming heeft gegeven voor verstrekking van hem betreffende
      gegevens over gezondheid aan de zorgverzekeraar. De zorgverzekeraar verwerkt bij de detailcontrole niet meer
      gegevens dan gelet op het onderzoeksdoel en de omstandigheden van het geval noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.8
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7.8'
        hoofdstuk: '7'
  - number: '7.11'
    text: |-
      De zorgverzekeraar verwerkt de persoonsgegevens, bedoeld in [artikel 87, eerste en tweede lid, van de wet][ref1]
      slechts verder voor de uitvoering van de zorgverzekering en de aanvullende ziektekostenverzekering indien en voor
      zo ver dit noodzakelijk is voor de doelen omschreven in [artikel 7.1][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7.1
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.11
    references:
