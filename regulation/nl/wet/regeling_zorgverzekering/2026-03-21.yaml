  - number: 6.9.1
    text: |-
      1 Het Zorginstituut verstrekt patiënten en zorgaanbieders uit een lidstaat van de Europese Unie op verzoek algemene
      informatie over de rechten en aanspraken op grensoverschrijdende zorg, in het bijzonder over de voorwaarden met
      betrekking tot de vergoeding van zorgkosten, de procedures voor toegang tot en vaststelling van aanspraken en de
      rechtsmiddelen die daarbij voor hen openstaan en de namen en contactgegevens van de nationale contactpunten in
      andere lidstaten.

      2 In de informatie wordt duidelijk onderscheid gemaakt tussen de rechten die patiënten hebben op grond van
      Richtlijn 2011/24/EU en Verordening (EG) Nr. 883/2004 van het Europees Parlement en de Raad van 29 april 2004,
      betreffende de coördinatie van socialezekerheidsstelsels (Pb EU 2004, L 166).
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.1
  - number: 6.9.2
    text: |-
      1 Het Zorginstituut verstrekt patiënten uit een andere lidstaat van wie de behandeling in Nederland plaatsvindt op
      verzoek informatie over:

        - zorgaanbieders, waaronder informatie over het recht van een specifieke zorgaanbieder om diensten te verlenen of
      mogelijke beperkingen ten aanzien van zijn praktijk;
        - patiëntenrechten, klachtenregelingen en rechtsmiddelen overeenkomstig de Nederlandse wetgeving;
        - de wettelijke en bestuursrechtelijke opties om geschillen te beslechten, onder meer als schade ontstaat als
      gevolg van zorg die wordt verleend of voorgeschreven in Nederland;
        - kwaliteits- en veiligheidsnormen en -richtsnoeren die in Nederland zijn vastgesteld, inclusief de bepalingen over
      toezicht op en beoordeling van zorgaanbieders en over de vraag op welke zorgaanbieders deze normen en richtsnoeren
      van toepassing zijn;
        - informatie over de toegankelijkheid van ziekenhuizen voor personen met een handicap.

      2 De informatie wordt gemakkelijk toegankelijk gemaakt en voor zover nodig met elektronische middelen en in een
      voor personen met een handicap toegankelijk formaat beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.2
  - number: 6.9.3
    text: |-
      1 Het Zorginstituut overlegt met patiëntenorganisaties, zorgaanbieders en zorgverzekeraars over de uitvoering van
      Richtlijn 2011/24/EU.

      2 Het Zorginstituut werkt nauw samen met de Europese Commissie en bevordert informatie-uitwisseling met andere
      nationale contactpunten.

      3 Het Zorginstituut verleent andere lidstaten alle bijstand die voor de uitvoering van Richtlijn 2011/24/EU nodig
      is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.3
  - number: 6.9.4
    text: |-
      Het Zorginstituut verstrekt patiënten informatie over de gegevens die op grond van Uitvoeringsrichtlijn 2012/52/
      EU van de Commissie tot vaststelling van maatregelen om de erkenning van in een andere lidstaat verstrekte medische
      recepten te vergemakkelijken (Pb EU 2012, L 356) moeten worden opgenomen in recepten die worden verstrekt in een
      andere lidstaat dan de lidstaat waar de genees- of hulpmiddelen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.4
  - number: 6.9.5
    text: Het Zorginstituut betrekt met ingang van 1 januari 2017 het CAK bij de uitvoering van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.5
  - number: 6a.1
    text: |-
      De Sociale verzekeringsbank wordt aangewezen als de publiekrechtelijke rechtspersoon, bedoeld in
      [artikel 13a, achtste lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel13a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 13a
  - number: 6a.2
    text: |-
      1 De ondersteuning, bedoeld in [artikel 13a van de Zorgverzekeringswet][ref1] bestaat uit:

      a. het namens de verzekerde die ten aanzien van zijn zorgverlener inhoudingsplichtige is, indienen van declaraties
      bij zijn zorgverzekeraar, ontvangen van de vergoedingen van zijn zorgverzekeraar, betalen van zijn zorgverleners
      met de ontvangen vergoedingen, voeren van een salarisadministratie en doen van aangiften en afdrachten;

      b. de verzekerde bijstaan of doen bijstaan in zijn werkgeverstaken of opdrachtgeverschap waaronder ten aanzien van
      ziekte, ontslag, arbeidsomstandighedenregelgeving, zaakschade, aansprakelijkheid en rechtsbijstand.

      2 De ondersteuning wordt kosteloos verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel13a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 13a
  - number: 6a.3
    text: |-
      1 De Sociale verzekeringsbank stelt voorwaarden aan het verkrijgen van de ondersteuning voor zover dit voor de
      uitvoerbaarheid van de ondersteuning redelijkerwijs van belang is.

      2 De Sociale verzekeringsbank legt haar werkwijze vast en informeert verzekerden en zorgverzekeraars hierover.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.3
  - number: 6a.4
    text: |-
      1 De verzekerde verleent medewerking aan de Sociale verzekeringsbank voor zover dat van hem ten behoeve van de
      uitvoerbaarheid van de ondersteuning redelijkerwijs kan worden verwacht.

      2 De verzekerde doet aan de Sociale verzekeringsbank op verzoek of onverwijld uit eigen beweging mededeling
      van gegevens waarvan hem redelijkerwijs duidelijk moet zijn dat zij noodzakelijk zijn voor het uitvoeren van de
      ondersteuning.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.4
  - number: 6a.5
    text: |-
      De Sociale verzekeringsbank kan de ondersteuning geheel of gedeeltelijk weigeren, opschorten of beëindigen indien
      de verzekerde niet meer beschikt over een Zvw-pgb of indien niet of niet langer wordt voldaan aan het gestelde bij
      of krachtens de [artikelen 6a.3][ref1] en [6a.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6a.3
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel6a.4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.5
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: 6a.3
        hoofdstuk: 6a
      - id: ref2
        bwb_id: BWBR0018715
        artikel: 6a.4
        hoofdstuk: 6a
  - number: 6a.6
    text: |-
      1 De Minister verstrekt de Sociale verzekeringsbank jaarlijks een bijdrage voor de kosten van de ondersteuning.

      2 De Sociale verzekeringsbank dient vóór 1 oktober een aanvraag, voorzien van een begroting met toelichting, tot
      verlening van een bijdrage voor het daaropvolgende jaar in bij de Minister.

      3 Binnen 13 weken na ontvangst van de aanvraag besluit de Minister over het verlenen van de bijdrage en van
      voorschotten op de bijdrage.

      4 De Minister kan de Sociale verzekeringsbank bij de verlening van de bijdrage verplichtingen opleggen met
      betrekking tot de uitvoering van de ondersteuning of het verkrijgen van de bijdrage.

      5 Na afloop van het jaar waarvoor de bijdrage is verstrekt, dient de Sociale verzekeringbank vóór 1 juli een
      aanvraag, voorzien van een financieel verslag met toelichting, tot vaststelling van de bijdrage in bij de Minister.

      6 Binnen 13 weken na ontvangst van de aanvraag besluit de Minister over het vaststellen van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.6
  - number: '7.1'
    text: |-
      1 Als persoonsgegevens, waaronder gegevens over gezondheid, die voor een zorgverzekeraar noodzakelijk zijn voor de
      uitvoering van de zorgverzekering of van de [Zorgverzekeringswet][ref1] worden aangemerkt de in [artikel 7.2][ref2]
      bedoelde persoonsgegevens.

      2 Een zorgverzekeraar mag de in het eerste lid bedoelde gegevens gebruiken voor het verrichten van formele controle
      dan wel materiële controle ten behoeve van:

      a. de geheel of gedeeltelijke betaling aan een zorgaanbieder;

      b. de geheel of gedeeltelijke vergoeding aan een verzekerde van het in rekening gebrachte tarief voor aan een
      verzekerde geleverde prestatie;

      c. de vaststelling van de eigen bijdragen van een verzekerde;

      d. de vaststelling van een verplicht of vrijwillig eigen risico van een verzekerde, en

      e. het verrichten van fraudeonderzoek.

      3 Een zorgverzekeraar mag de in het eerste lid bedoelde gegevens gebruiken voor het uitoefenen van verhaalsrecht.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7.2'
        hoofdstuk: '7'
  - number: '7.2'
    text: |-
      De zorgverzekeraar beschikt ten behoeve van de in het voorgaande artikel aangegeven doelen en van de uitvoering van
      [artikel 7.4a][ref1], over de volgende gegevens van de verzekerde:

      a. naam, adres, postcode en woonplaats;

      b. polisnummer, burgerservicenummer, geslacht en geboortedatum;

      c. de prestatiebeschrijving van de aan de verzekerde geleverde prestatie;

      d. wanneer en in voorkomend geval ten gevolge van welke catastrofe als bedoeld in
      [artikel 33, eerste lid, onderdeel a, van de Zorgverzekeringswet][ref2], de prestatie is geleverd;

      e. het voor de geleverde prestatie in rekening gebrachte tarief;

      f. de gegevens die op grond van een declaratieregeling moeten worden verstrekt;

      g. de gegevens die noodzakelijk zijn om vast te stellen of de prestatie behoort tot het verzekerde pakket van die
      verzekerde en

      h. het bank- of girorekeningnummer;

      i. overige gegevens die noodzakelijk zijn voor het verrichten van materiële controle dan wel fraudeonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.4a
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: 7.4a
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 7.2a
    text: |-
      1 Dit artikel is van toepassing indien een zorgaanbieder de kosten van gespecialiseerde geestelijke gezondheidszorg
      door tussenkomst van VECOZO B.V. in rekening brengt bij een zorgverzekeraar.

      2 Mits vermeld in een declaratieregeling die van toepassing is voor een zorgaanbieder, bedoeld in het
      eerste lid, beschikt de zorgverzekeraar, met inachtneming van het bepaalde bij of krachtens dit artikel,
      over het gegeven zorgvraagzwaarte van de verzekerde voor de analyses en controles als bedoeld in de
      [artikelen 7.6 tot en met 7.9][ref1], met het oog op de uitvoering van formele en materiële controle ten
      behoeve van de in [artikel 7.1, tweede lid][ref2], aangegeven doelen en voor zover dat noodzakelijk is voor de
      zorgverzekeraar om te voldoen aan zijn verplichting om gegevens te leveren aan het Zorginstituut ten behoeve van de
      uitvoering van de [Zorgverzekeringswet][ref3].

      3 De zorgaanbieder, bedoeld in het eerste lid, verstrekt de gegevens die op grond van het bij of krachtens
      [artikel 38 van de Wet marktordening gezondheidszorg][ref4] bepaalde moeten worden verstrekt, aan de
      zorgverzekeraar door tussenkomst van VECOZO B.V.

      4 Het gegeven zorgvraagzwaarte, bedoeld in het tweede lid, wordt door VECOZO B.V. gemaskeerd alvorens VECOZO B.V.
      dat gemaskeerde gegeven, met de overige gegevens bedoeld in het derde lid, aan de zorgverzekeraar verstrekt.

      5 De zorgverzekeraar ontvangt de door de zorgaanbieder verstrekte gegevens, bedoeld in het derde lid, van VECOZO
      B.V., waarbij het gegeven zorgvraagzwaarte van de verzekerde is gemaskeerd.

      6 De zorgverzekeraar verstrekt gegevens bedoeld in het vijfde lid aan Vektis C.V. ten behoeve van het maken van
      analyses voor zorgaanbieders en zorgverzekeraars die noodzakelijk zijn voor de uitvoering van de zorgverzekering
      of de [Zorgverzekeringswet][ref5] en ten behoeve van het verrichten van controle of fraudeonderzoek, waarbij het
      gegeven zorgvraagzwaarte van de verzekerde is gemaskeerd.

      7 Vektis C.V. ontvangt de door de zorgaanbieder verstrekte gegevens, bedoeld in het derde lid, van VECOZO B.V.,
      waarbij het gegeven zorgvraagzwaarte van de verzekerde niet is gemaskeerd.

      8 Vektis C.V. verstrekt op verzoek van een zorgverzekeraar aan die zorgverzekeraar het gegeven zorgvraagzwaarte
      indien en voor zover dat noodzakelijk is voor de zorgverzekeraar om te voldoen aan zijn verplichting om gegevens te
      leveren aan het Zorginstituut ten behoeve van de uitvoering van de [Zorgverzekeringswet][ref6], nadat het gegeven
      zorgvraagzwaarte door Vektis C.V. is versleuteld.

      9 De zorgverzekeraar verstrekt op verzoek van het Zorginstituut aan deze het gegeven zorgvraagzwaarte, zoals dat
      gegeven door Vektis C.V. is versleuteld, ten behoeve van de uitvoering van de [Zorgverzekeringswet][ref7] door
      het Zorginstituut.

      10 Vektis C.V. verstrekt op verzoek van het Zorginstituut aan deze de sleutel om het door Vektis C.V. versleutelde
      gegeven zorgvraagzwaarte te ontsleutelen ten behoeve van de uitvoering van de [Zorgverzekeringswet][ref8] door
      het Zorginstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.6
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7.1
      [ref3]: https://wetten.overheid.nl/BWBR0018450
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel38
      [ref5]: https://wetten.overheid.nl/BWBR0018450
      [ref6]: https://wetten.overheid.nl/BWBR0018450
      [ref7]: https://wetten.overheid.nl/BWBR0018450
      [ref8]: https://wetten.overheid.nl/BWBR0018450
