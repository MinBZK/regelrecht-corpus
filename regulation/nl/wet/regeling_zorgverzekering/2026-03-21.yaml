        artikel: '2.4'
  - number: '2.1'
    text: |-
      De zorg bedoeld in [artikel 2.4 van het Besluit zorgverzekering][ref1] omvat niet:

      a. behandeling van bovenoogleden die verlamd of verslapt zijn, anders dan bij verlamming of verslapping die een
      ernstige gezichtsveldbeperking tot gevolg heeft dan wel het gevolg is van een aangeboren afwijking of een bij de
      geboorte aanwezige chronische aandoening;

      b. liposuctie van de buik;

      c. een behandeling van plastisch-chirurgische aard die strekt tot borstconstructie of vervanging van een
      borstprothese, anders dan na een gehele of gedeeltelijke borstamputatie of bij agenesie of aplasie van de borst bij
      vrouwen en de daarmee vergelijkbare situatie bij een vastgestelde transsexualiteit;

      d. het operatief verwijderen van een borstprothese zonder medische noodzaak;

      e. behandelingen tegen snurken met uvuloplastiek;

      f. behandelingen gericht op sterilisatie dan wel op het ongedaan maken daarvan;

      g. behandelingen gericht op circumcisie, anders dan medisch noodzakelijk;

      h. behandeling van aanpassingsstoornissen;

      i. hulp bij werk- en relatieproblemen;

      j. behandeling van plagiocefalie en brachycefalie zonder craniosynostose met een redressiehelm;

      k. de verstrekking van een geregistreerd geneesmiddel met een in [bijlage 0][ref2] bij deze regeling genoemde
      werkzame stof in het kader van een daarbij vermelde geneeskundige behandeling;

      l. uitwendige hulpmiddelen te gebruiken bij de behandeling van diabetes voor het controleren en reguleren van
      stoornissen in de bloedsuikerspiegel, met inbegrip van de ketonen teststrips en insulinepompen.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.4
