  - number: '5.5'
    text: |-
      De inkomsten, bedoeld in [artikel 45, vierde lid, van de Zorgverzekeringswet][ref1], betreffen voor het berekenen
      van de bijdragepercentages die met ingang van 1 januari 2026 gelden telkens met betrekking tot het desbetreffende
      kalenderjaar:

      a. het geraamde totaalbedrag aan nominale rekenpremies, bedoeld in
      [artikel 1, onderdeel aa, van het Besluit zorgverzekering][ref2] voor alle zorgverzekeringen waarvoor premie
      moet worden betaald, vermeerderd met het geraamde totaalbedrag dat de zorgverzekeraars van hun verzekerden zullen
      ontvangen ten gevolge van een door hen vast te stellen opslag op deze nominale rekenpremies;

      b. het geraamde totaalbedrag aan eigen bijdragen, bedoeld in
      [artikel 11, derde lid, van de Zorgverzekeringswet][ref3];

      c. het geraamde totaalbedrag aan verplicht eigen risico dat door verzekerden zal worden betaald;

      d. de aan het Zorgverzekeringsfonds toe te voegen rijksbijdrage, bedoeld in
      [artikel 54 van de Zorgverzekeringswet][ref4], alsmede bijdragen als bedoeld in
      [artikel 87a van de Wet financiering sociale verzekeringen][ref5];

      e. het geraamde totaalbedrag aan inkomensafhankelijke bijdragen als bedoeld in
      [artikel 41 van de Zorgverzekeringswet][ref6] dat van inhoudingsplichtigen en verzekeringsplichtigen geheven zal
      worden, verminderd met het geraamde bedrag, bedoeld in [artikel 42, achtste lid, van die wet][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel45
