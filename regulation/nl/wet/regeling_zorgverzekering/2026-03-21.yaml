  - number: '7.3'
    text: |-
      1 De zorgaanbieder is verplicht tenzij bij of krachtens deze regeling anders wordt bepaald de in
      [artikel 7.2, onderdeel a tot en met g][ref1], bedoelde gegevens te verstrekken aan:

      a. de zorgverzekeraar, of een door die zorgverzekeraar daartoe aangewezen persoon, indien die zorgaanbieder het
      tarief voor de geleverde prestatie krachtens een door hem met de zorgverzekeraar gesloten overeenkomst rechtstreeks
      bij die zorgverzekeraar in rekening brengt;

      b. de verzekerde, indien de zorgaanbieder het tarief voor de geleverde prestatie bij de verzekerde in rekening
      brengt.

      2 De zorgaanbieder is verplicht de in [artikel 7.2, onderdeel i][ref2], bedoelde gegevens desgevraagd te
      verstrekken aan de zorgverzekeraar of aan een door die zorgverzekeraar daartoe aangewezen persoon.

      3 Voor de door de zorgverzekeraar of de verwerker aangewezen persoon gelden dezelfde wettelijke voorschriften
      inzake de geheimhouding van de verwerkte gegevens als voor de zorgverzekeraar of de verwerker die hem heeft
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.2
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7.2
