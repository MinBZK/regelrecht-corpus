  - number: 6.6.5
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. *grondslag:* product van de gemiddelde vereveningsbijdrage, en het werkelijke aantal verzekerden dat de
      zorgverzekeraar in het catastrofejaar had;

      b. *gemiddelde vereveningsbijdrage:* vastgestelde vereveningsbijdrage per verzekerde, die wordt berekend
      door de som van de op grond van [artikel 34 van de wet][ref1] met betrekking tot het catastrofejaar voor alle
      zorgverzekeraars vastgestelde vereveningsbijdragen te delen door het werkelijke totaalaantal verzekerden in dat
      jaar;

      c. *de catastrofeschadelast:* de som van de gerealiseerde kosten van de zorgverzekeraar ten gevolge van de
      catastrofe in het catastrofejaar en het daaropvolgende kalenderjaar, die het Zorginstituut op grond van het tweede
      en derde lid in aanmerking neemt.

      2 Het Zorginstituut neemt als gerealiseerde kosten in aanmerking kosten ten gevolge van de betrokken catastrofe die
      zorgaanbieders overeenkomstig hetgeen bij of krachtens de [Wet marktordening gezondheidzorg][ref2] is geregeld met
      tarieven in rekening brengen met hantering van:

      a. daartoe door het Zorginstituut aangewezen prestatiebeschrijvingen voor zorg of andere diensten die op grond van
      de zorgverzekeringen zijn verzekerd en rechtstreeks betrekking hebben op individuele verzekerden; of

      b. een prestatiebeschrijving voor meerkosten in verband met de catastrofe en voor zover het kosten betreft anders
      dan bedoeld in onderdeel a, de zorgverzekeraar op de door het Zorginstituut aangegeven wijze aantoont dat die
      kosten:

      1°. betrekking hebben op zorg of andere diensten die grond van de zorgverzekeringen zijn verzekerd, en

      2°. zijn gebaseerd op aan zorgaanbieders betaalde tarieven op grond van schriftelijke afspraken die mede gelet op
      de bijzondere omstandigheden van de catastrofe, leiden tot een plausibele bepaling van die meerkosten.

      3 Het Zorginstituut neemt niet als gerealiseerde kosten in aanmerking:

      a. kosten, die voor rekening van verzekerden zijn gekomen op grond van het verplicht eigen risico;

      b. kosten waarvoor een zorgverzekeraar compensatie heeft verkregen of zal verkrijgen ten laste van de
      rijksbegroting, bedoeld in [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref3] op grond van daartoe
      door dat instituut aangewezen regelingen;

      c. kosten die zorgaanbieders met tarieven in rekening hebben gebracht met hantering van de prestatiebeschrijving
      'continuïteitsbijdrage' voor de onderdekking van doorlopende kosten.

      4 De vast te stellen extra bijdrage, bedraagt bij:

      a. een catastrofeschadelast van 4% of minder van de grondslag, nihil.

      b. een catastrofeschadelast van meer dan 4% van de grondslag en minder dan 10% van de grondslag, het bedrag ter
      grootte van 5/3 vermenigvuldigd met het verschil tussen die catastrofelast en 4% van de grondslag;

      c. een catastrofeschadelast van 10% of meer en niet meer dan 20% van de grondslag, het bedrag ter grootte van die
      catastrofeschadelast, en

      d. een catastrofeschadelast van meer dan 20% van de grondslag, het bedrag ter grootte van 20% van de grondslag.

      5 Het Zorginstituut stelt overeenkomstig de door hem opgestelde beleidsregels de extra bijdrage
      lager vast dan op grond van het vierde lid, indien dat instituut ten aanzien van de zorgverzekeraar
      [artikel 6.6.2, vijfde lid][ref4], heeft toegepast. Het Zorginstituut stelt de extra bijdrage op nihil vast indien
      de zorgverzekeraar het verzoek om toekenning van de extra bijdrage na het einde van het tweede kalenderjaar volgend
      op het catastrofejaar heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel2.1
      [ref4]: https://wetten.overheid.nl/BWBR0018715#Artikel6.6.2
