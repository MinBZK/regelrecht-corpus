        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '8.5'
    text: 'Deze regeling wordt aangehaald als: Regeling zorgverzekering.'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel8.5
