      gevolg van een beslissing als bedoeld in [artikel 2.50, vijfde lid][ref2], niet zijn aangewezen, geregistreerde
      geneesmiddelen ten aanzien waarvan het voornemen tot aanwijzing als bedoeld in artikel 2.50, achtste lid, niet is
      uitgevoerd en geregistreerde geneesmiddelen die als gevolg van een wijziging van [bijlage 1][ref3] niet meer zijn
      aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018715
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018715
