  - number: 5.4.3
    text: |-
      In afwijking van het eerste of tweede lid, wordt het percentage vastgesteld op nihil over
      bijdrage-inkomen voortvloeiende uit werkzaamheden van een verzekeringsplichtige aan boord van
      een zeeschip in de zin van het Burgerlijk Wetboek, mits de werkgever of de scheepsbeheerder,
      bedoeld in [artikel 1 van de Wet bemanning zeeschepen][ref1], het risico als bedoeld in
      [hoofdstuk 3 van de Zorgverzekeringswet][ref2], op grond van een verdragsrechtelijke bepaling of een bepaling die
      daarop stoelt, in belangrijke mate voor zijn rekening neemt zolang deze verzekeringsplichtige niet is teruggekeerd
      of heeft kunnen terugkeren naar het land waar hij zijn woonplaats of gewone verblijfplaats heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0050681#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Hoofdstuk3
