  - number: 6.5.4
    text: |-
      1 De inspanningen tot inning van de premie, bedoeld in [artikel 18bb, eerste lid, van de Zorgverzekeringswet][ref1],
      bestaan uit:

      a. het uiterlijk vanaf tien werkdagen na de uiterste datum voor betaling van de premie treffen of, indien
      noodzakelijk, door derden laten treffen van maatregelen tot inning en incasso van de premie die betamelijk zijn en
      in redelijkheid verlangd kunnen worden en waarbij kosten voor de verzekeringnemer zoveel mogelijk voorkomen worden
      door:

      1°. de verzekeringnemer te informeren indien een automatische incasso van de premie niet slaagt;

      2°. de verzekeringnemer kosteloos een aanmaning te sturen;

      3°. de verzekeringnemer een tweede en derde aanmaning te sturen;

      4°. niet elke premiefactuur afzonderlijk te verzwaren met incassokosten;

      b. de verzekeringnemer die in verzuim verkeert tot nakoming van een betalingsregeling bedoeld in
      [artikel 18a, eerste lid, van de Zorgverzekeringswet][ref2], ten minste eenmalig in staat te stellen dit verzuim
      te herstellen;

      c. communicatiemiddelen in te zetten die zijn afgestemd op de verzekeringnemers ten behoeve waarvan de inspanningen
      worden geleverd.

      2 De medewerking, bedoeld in [artikel 18c, vierde lid, van de Zorgverzekeringswet][ref3], bestaat uit:

      a. het bevorderen dat verzekeringnemers niet langer de bestuursrechtelijke premie, bedoeld in
      [artikel 18d, eerste lid, van de Zorgverzekeringswet][ref4] verschuldigd zullen zijn door:

      1°. het periodiek, doch ten minste jaarlijks, aanbieden en vervolgens uitvoeren van een redelijke, op
      de omstandigheden van de verzekeringnemer afgestemd betalingsregeling waarin alle uit de zorgverzekering
      voortvloeiende schulden van de verzekeringnemer aan de zorgverzekeraar zijn betrokken, met kwijtschelding van
      eventuele restschulden, ten behoeve van de verzekeringnemers die naar verwachting van de zorgverzekeraar aan de
      betalingsregeling zullen kunnen voldoen;

      2°. het verlenen van medewerking aan het tot stand brengen en uitvoeren van betalingsregelingen en schuldsanering
      die ten minste in overeenstemming zijn met de door de Vereniging voor schuldhulpverlening en sociaal bankieren
      gehanteerde richtlijnen;

      3°. het in overleg met gemeenten verlenen van medewerking aan de uitvoering van [artikel 6.5.6][ref5];

      b. het inzetten van communicatiemiddelen die zijn afgestemd op de verzekeringnemers ten behoeve waarvan de
      medewerking wordt geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18bb
