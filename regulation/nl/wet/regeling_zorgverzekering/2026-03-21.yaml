  - number: '2.50'
    text: |-
      1 De registratiehouder kan bij de Minister een aanvraag indienen om een geneesmiddel aan te wijzen ingevolge
      [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref1].

      2 De aanvraag geschiedt met gebruikmaking van een door de Minister vast te stellen formulier. Daarbij worden de
      gegevens en de bescheiden verschaft die voor de beslissing op de aanvraag nodig zijn. De datum van ontvangst wordt
      aan de aanvrager meegedeeld.

      3 Indien de overgelegde gegevens en bescheiden onvoldoende zijn, stelt de Minister de aanvrager in de gelegenheid
      binnen een door hem te bepalen termijn de aanvraag aan te vullen.

      4 De Minister hoort over de aanvraag het Zorginstituut.

      5 De Minister beslist binnen 90 dagen na ontvangst van de aanvraag. Deze termijn wordt opgeschort met ingang van de
      dag waarop de Minister de aanvrager uitnodigt de aanvraag aan te vullen, tot de dag waarop de aanvraag is aangevuld
      of de daarvoor gestelde termijn ongebruikt is verstreken.

      6 De inhoud van het voorgenomen besluit, voor zover betrekking hebbend op de aanvraag, wordt aan de aanvrager
      meegedeeld. Daarbij wordt tevens het oordeel van het Zorginstituut toegezonden en wordt de motivering vermeld,
      tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat. Aan de aanvrager wordt meegedeeld
      welke rechtsmiddelen hem ter beschikking staan.

      7 Het tweede tot en met het zesde lid zijn van overeenkomstige toepassing indien de registratiehouder verzoekt
      om herziening van een besluit ingevolge het eerste lid en hij daartoe nieuw gebleken feiten of veranderde
      omstandigheden aanvoert.

      8 Indien de Minister voornemens is een geneesmiddel ambtshalve aan te wijzen ingevolge
      [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref2] dan wel zodanige aanwijzing te
      wijzigen, deelt hij de registratiehouder uiterlijk een maand voor de beoogde datum van inwerkingtreding de
      zakelijke inhoud van het voorgenomen besluit mede. Het vierde en zesde lid zijn van overeenkomstige toepassing.

      9 Indien het een geneesmiddel betreft met dezelfde werkzame bestanddelen, van dezelfde
      sterkte en in dezelfde farmaceutische vorm als een geneesmiddel dat reeds ingevolge
      [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref3] is aangewezen, zijn het tweede tot en
      met vierde lid, het zesde lid, tweede volzin, en het zevende en achtste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2.8
      [ref3]: https://wetten.overheid.nl/BWBR0018492#Artikel2.8
