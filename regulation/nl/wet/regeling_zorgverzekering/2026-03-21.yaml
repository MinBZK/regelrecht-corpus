  - number: 6.6.1
    text: |-
      In deze paragraaf wordt verstaan onder:

      a. *catastrofe:* catastrofe als bedoeld in [artikel 33, eerste lid, onderdeel a, van de wet][ref1];

      b. *catastrofejaar:* catastrofejaar als bedoeld in [artikel 33, eerste lid, onderdeel b, van de wet][ref2];

      c. *extra bijdrage:* bijdrage als bedoeld in [artikel 33 van de wet][ref3];

      d. *prestatiebeschrijving:* beschrijving van een prestatie als bedoeld in
      [artikel 50, eerste lid, onderdeel d, van de Wet marktordening gezondheidszorg][ref4];

      e. *tarief:* tarief als bedoeld in
      [artikel 1, eerste lid, onderdeel k, van de Wet marktordening gezondheidszorg][ref5];

      f. *wet:* [Zorgverzekeringswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
