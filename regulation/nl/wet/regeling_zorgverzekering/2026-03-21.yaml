  - number: '2.41'
    text: |-
      1 Voor de berekening van een vergoedingslimiet wordt uitgegaan van een standaarddosis van het werkzame bestanddeel
      van het geneesmiddel.

      2 De standaarddosis wordt bepaald op basis van de Defined Daily Dose, tenzij de Defined Daily Dose lager is dan de
      in Nederland geadviseerde minimale dosering of hoger is dan de in Nederland geadviseerde maximale dosering.

      3 Indien een werkzaam bestanddeel onder verschillende zout- of estervormen in de handel is en bij de Defined
      Daily Dose geen onderscheid is gemaakt naar de zout- of estervorm, wordt de standaarddosis voor de verschillende
      zout- of estervormen, voor zover mogelijk, herleid tot de zout- of estervorm die het meest voorkomt in de in
      [artikel 2.39][ref1] genoemde bronnen.

      4 Voor uitwendig toegepaste dermatologica geldt als standaarddosis 1 gram, 1 ml of 100 cm2, afhankelijk van de
      gehanteerde hoeveelheidsmaat.

      5 De standaarddosis wordt zoveel mogelijk vastgesteld met overeenkomstige toepassing van de methodiek, gehanteerd
      bij de vaststelling van de Defined Daily Dose, indien:

      a. voor een geneesmiddel geen Defined Daily Dose is vastgesteld, of

      b. de Defined Daily Dose lager is dan de in Nederland geadviseerde minimale dosering of hoger is dan de in
      Nederland geadviseerde maximale dosering.

      6 In afwijking van het eerste tot en met vijfde lid wordt bij geneesmiddelen waarvoor geldt dat de duur van de
      medicatie wordt bekort door de hoeveelheid per dag gegeven werkzame bestanddelen te verhogen, uitgegaan van de
      standaardkuur.

      7 De vergoedingslimiet van een geneesmiddel wordt opnieuw vastgesteld, indien:

      a. de Defined Daily Dose van dat geneesmiddel bij een herziening van de Defined Daily Doses van een categorie van
      geneesmiddelen in de Anatomical Therapeutic Chemical Classification op niveau 4 wordt gewijzigd ten opzichte van de
      Defined Daily Dose waarvan eerder bij de bepaling van de standaarddosis was uitgegaan,

      b. voor dat geneesmiddel de standaarddosis was bepaald overeenkomstig het vijfde lid, aanhef en onderdeel a, en
      voor dat geneesmiddel een Defined Daily Dose wordt vastgesteld, of

      c. wijziging optreedt in de in Nederland geadviseerde minimale of maximale dosering van een geneesmiddel, bedoeld
      in het vijfde lid, aanhef en onderdeel b, en die wijziging zou leiden tot een andere standaarddosis dan die
      waarvan bij de indeling van dat geneesmiddel in de desbetreffende groep van onderling vervangbare geneesmiddelen
      is uitgegaan.

      8 Indien de Defined Daily Dose van een geneesmiddel of van geneesmiddelen, van de prijs waarvan is uitgegaan
      voor de berekening van een vergoedingslimiet, bij een herziening van de Defined Daily Dose van een categorie
      van geneesmiddelen in de Anatomical Therapeutic Chemical Classification op niveau 4 wordt gewijzigd, wordt de
      vergoedingslimiet voor de groep onderling vervangbare geneesmiddelen waartoe dat geneesmiddel behoort, opnieuw
      vastgesteld. Bij de berekening van de nieuwe vergoedingslimiet worden slechts betrokken de geneesmiddelen die
      betrokken zijn bij de eerdere berekening van de vergoedingslimiet.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.39
