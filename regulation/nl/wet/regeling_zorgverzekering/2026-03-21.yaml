  - number: 6.3.1a
    text: |-
      In de [artikelen 6.3.2 tot en met 6.3.4][ref1] wordt verstaan onder:

      a. *bijdrageplichtige:* eenieder die krachtens [artikel 69 van de Zorgverzekeringswet][ref2] in verbinding met
      [artikel 6.3.1][ref3] een bijdrage verschuldigd is,

      b. *hoofdbijdrageplichtige:* een bijdrageplichtige met een of meer gezinsleden die niet bijdrageplichtig zouden
      zijn geweest indien zij niet tot het gezin van de hoofdbijdrageplichtige zouden hebben behoord,

      c. *gezinslid:* een tot het gezin van een hoofdbijdrageplichtige of een verzekeringsplichtige behorend gezinslid
      dat niet bijdrageplichtig zou zijn geweest indien hij niet tot het gezin van de hoofdbijdrageplichtige of een
      verzekeringsplichtige zou hebben behoord.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6.3.2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0018715#Artikel6.3.1
