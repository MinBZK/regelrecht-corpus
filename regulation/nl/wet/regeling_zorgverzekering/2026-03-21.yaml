        artikel: '1'
  - number: '2.6'
    text: |-
      De aangewezen hulpmiddelen en verbandmiddelen zijn:

      a. Uitwendige hulpmiddelen ter volledige of gedeeltelijke vervanging van anatomische eigenschappen van onderdelen
      van het menselijk lichaam of bedekking daarvan, als omschreven in [artikel 2.8][ref1];

      b. Uitwendige hulpmiddelen voor het ademhalingsstelsel als omschreven in [artikel 2.9][ref2];

      c. uitwendige hulpmiddelen gerelateerd aan stoornissen in de hoorfunctie, als omschreven in [artikel 2.10][ref3];

      d. uitwendige hulpmiddelen te gebruiken bij urinelozing en defecatie als omschreven in [artikel 2.11][ref4];

      e. uitwendige hulpmiddelen gerelateerd aan stoornissen in het bewegingssysteem, als omschreven in
      [artikel 2.12][ref5];

      f. uitwendige hulpmiddelen gerelateerd aan stoornissen in de visuele functie als omschreven in
      [artikel 2.13][ref6];

      g. hulpmiddelen gerelateerd aan stoornissen in de mate van bewustzijn;

      h.

      i. hulpmiddelen voor anticonceptionele doeleinden als omschreven in [artikel 2.16][ref7];

      j. hulpmiddelen die samenhangen met verzorging en verpleging op bed, als omschreven in [artikel 2.17][ref8];

      k. hulpmiddelen te gebruiken bij stoornissen in de functies van de huid als omschreven in [artikel 2.18][ref9];

      l. injectiespuiten als omschreven in [artikel 2.19][ref10];

      m. uitwendige hulpmiddelen te gebruiken bij het langdurig compenseren van het functieverlies van aderen bij het
      transport van bloed en het functieverlies van lymfevaten bij het transport van lymfe;

      n. uitwendige hulpmiddelen te gebruiken bij stoornissen in de functies van het hematologisch systeem;

      o. uitwendige hulpmiddelen te gebruiken bij het controleren en reguleren van stoornissen in de bloedsuikerspiegel,
      met inbegrip van de ketonen teststrips en insulinepompen bij de behandeling van diabetes;

      p. draagbare, uitwendige infuuspompen als omschreven in [artikel 2.22][ref11];

      q.

      r. hulpmiddelen voor het toedienen van voeding als omschreven in [artikel 2.24][ref12];

      s. uitwendige hulpmiddelen gerelateerd aan en ter compensatie van beperkingen in het spreken;

      t. hulpmiddelen voor communicatie, informatievoorziening en signalering als omschreven in [artikel 2.26][ref13];

      u.

      v.

      w.

      x.

      y. uitwendige elektrostimulators tegen chronische pijn met toebehoren;

      z.

      aa.

      bb.

      cc.

      dd.

      ee.

      ff.

      gg.

      hh. met thuisdialyse samenhangende kosten als omschreven in [artikel 2.29][ref14].


