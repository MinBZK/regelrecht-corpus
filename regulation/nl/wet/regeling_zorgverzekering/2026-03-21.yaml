  - number: '5.3'
    text: |-
      Het bijdrage-inkomen, bedoeld in [artikel 43, derde lid, van de Zorgverzekeringswet][ref1], dat voor de heffing
      van de inkomensafhankelijke bijdrage, bedoeld in [artikel 41 van die wet][ref2], ten hoogste in aanmerking wordt
      genomen, wordt voor het jaar 2026 vastgesteld op het bedrag, bedoeld in [artikel 5.2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel41
