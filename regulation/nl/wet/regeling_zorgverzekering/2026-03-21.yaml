      1 De eigen bijdrage voor ziekenvervoer bedraagt € 134,00 per kalenderjaar.

      2 De eigen bijdrage is niet verschuldigd:

      a. voor vervoer van een instelling waarin de verzekerde ten laste van de zorgverzekering of de verplichte
      verzekering voor langdurige zorg is opgenomen naar een andere instelling waarin de verzekerde ten laste van de
      zorgverzekering of de verplichte verzekering voor langdurige zorg wordt opgenomen voor het ondergaan van een
      specialistisch onderzoek of een specialistische behandeling waarvoor in de eerstbedoelde instelling niet de
      mogelijkheid bestaat;

      b. voor vervoer van een instelling als bedoeld in onderdeel a naar een persoon of instelling voor het ondergaan
      van een specialistisch onderzoek of een specialistische behandeling ten laste van de zorgverzekering waarvoor in de
      eerstbedoelde instelling niet de mogelijkheid bestaat, alsmede het vervoer terug naar die instelling;

      c. voor vervoer van een instelling waarin de verzekerde ten laste van de bijzondere ziektekostenverzekering
      is opgenomen naar een persoon of instelling voor een tandheelkundige behandeling ten laste van de bijzondere
      ziektekostenverzekering, waarvoor in de eerstbedoelde instelling niet de mogelijkheid bestaat, alsmede het vervoer
      terug naar die instelling;

      d. voor logeren, bedoeld in [artikel 2.14, zesde lid, van het Besluit zorgverzekering][ref1].


