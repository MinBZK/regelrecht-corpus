  - number: '4.5'
    text: |-
      1 Over het dagelijkse creditsaldo van de rekening-courant is de Minister
      van Financiën aan het Zorginstituut een rente verschuldigd overeenkomstig
      [artikel 4, eerste lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref1].

      2 Over het dagelijkse debetsaldo van de rekening-courant is het Zorginstituut een rente verschuldigd overeenkomstig
      [artikel 4, vijfde lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref2].

      3 De Minister van Financiën verrekent achteraf de over een kalenderjaar verschuldigde creditrente met de over dat
      jaar verschuldigde debetrente.

      Het saldo wordt geboekt op de rekening-courant per de eerste kalenderdag na afloop van het jaar waarop de credit-
      respectievelijk debetrente betrekking heeft. Daartoe stelt de Minister van Financiën een rentenota op.


      [ref1]: https://wetten.overheid.nl/BWBR0040289#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0040289#Artikel4
