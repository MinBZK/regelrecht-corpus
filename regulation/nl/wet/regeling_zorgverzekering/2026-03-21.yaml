  - number: '4.4'
    text: |-
      1 Ten gunste van de rekening-courant, bedoeld in [artikel 4.2][ref1], worden door het Ministerie van Financiën
      tevens geboekt:

      a. de bijdragen van het Rijk aan de rekening-couranthouder ten behoeve van het Zorgverzekeringsfonds;

      b. de afdrachten van de door de rijksbelastingdienst geïnde bijdragen aan de rekening-couranthouder ten behoeve van
      het Zorgverzekeringsfonds;

      c. de creditrente, bedoeld in [artikel 4.5, vierde lid][ref2].

      2 Ten laste van de rekeningen-courant, bedoeld in [artikel 4.2][ref3], wordt door het Ministerie van Financiën
      tevens geboekt de debetrente, bedoeld in [artikel 4.5, vierde lid][ref4].

      3 De boekingen, bedoeld in het eerste lid, onderdeel b, worden door het Ministerie van Financiën van
      valutadata voorzien, zodanig dat deze data overeenkomen met de gemiddelde data waarop de bijdragen door de
      rijksbelastingdienst worden geïnd.


