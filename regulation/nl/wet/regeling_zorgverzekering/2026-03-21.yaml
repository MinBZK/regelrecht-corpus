      van [artikel 13, eerste lid, onderdeel a][ref1], artikel 13, tweede lid, onderdeel
      c, artikel 13, derde lid, onderdeel a, artikel 13, vierde lid, onderdeel c,
      [artikel 14, eerste lid, onderdeel a][ref2], [artikel 15, eerste lid, onderdeel c, sub 1°][ref3], of
