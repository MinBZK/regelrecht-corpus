  - number: '2.10'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel c][ref1], omvatten:

      a. hulpmiddelen ter correctie van stoornissen in de hoorfunctie voor zover er sprake is van een revalideerbaar oor
      met ten minste een verlies van 35 dB of ernstig oorsuizen;

      b. hulpmiddelen ter compensatie van beperkingen in het luisteren of beperkingen in het gebruik van
      communicatieapparatuur, indien de hulpmiddelen als bedoeld onder a, hiervoor onvoldoende verbetering bieden dan wel
      indien deze hulpmiddelen substitueren voor de hulpmiddelen als bedoeld onder a.

      2 De zorg, bedoeld in het eerste lid, omvat niet deels implanteerbare hoorhulpmiddelen.

      3 Een indicatie voor de in het eerste lid bedoelde hulpmiddelen is eveneens aanwezig als sprake is van een
      bijzondere individuele zorgvraag.

      4 Voor signaalhonden geldt dat een tegemoetkoming kan worden verleend in de redelijk te achten gebruikskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2.6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.11'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel d][ref1], omvatten uitwendige hulpmiddelen met al dan niet
      inwendige onderdelen te gebruiken bij stoornissen in de functies gerelateerd aan urinelozing en defecatie.

      2 De zorg, bedoeld in het eerste lid, omvat ingeval van absorberende incontinentie-absorptiematerialen:

      a. materiaal voor verzekerden van drie of vier jaar indien sprake is van een niet-fysiologische vorm van
      incontinentie;

      b. materiaal voor verzekerden van vijf jaar en ouder, tenzij sprake is van kortdurende incontinentie of van
      enuresis nocturna.

      3 De zorg, bedoeld in het eerste lid, omvat niet:

      a. schoonmaakmiddelen en geurmiddelen;

      b. huidbeschermende middelen anders dan bij stomapatiënten, voor zover deze niet vallen onder de te verzekeren
      prestatie farmaceutische zorg;

      c. kleding, met uitzondering van netbroekjes;

      d. plaswekkers voor de behandeling van enuresis nocturna;

      e. beschermende onderleggers, tenzij sprake is van een

      bijzondere individuele zorgvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
    references:
      - id: ref1
