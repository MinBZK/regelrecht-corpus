  - number: '2.39'
    text: |-
      Bij de aanwijzing op grond van [artikel 2.8 van het Besluit zorgverzekering][ref1] en bij de toepassing van deze
      paragraaf wordt uitsluitend acht geslagen op:

      a. het registerdossier,

      b. de publicaties onder auspiciën van de World Health Organization over de Defined Daily Dose en de Anatomical
      Therapeutical Chemical Classification,

      c. de in medisch-farmaceutische kringen gebruikelijke farmacologische en farmacotherapeutische handboeken,

      d. publicaties in tijdschriften die in medisch-farmaceutische kringen als betrouwbare bronnen voor
      geneesmiddeleninformatie gelden,

      e. gegevens afkomstig van farmaco-economisch onderzoek, en

      f. andere gegevens en bescheiden als bedoeld in [artikel 42 van de Geneesmiddelenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2.8
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel42
