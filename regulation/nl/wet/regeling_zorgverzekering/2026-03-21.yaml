  - number: '2.9'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel b][ref1], omvatten uitwendige hulpmiddelen voor het geheel
      of gedeeltelijk opheffen van de gevolgen van stoornissen in de functie van het ademhalingsstelsel, met inbegrip van
      stoffen die met behulp van deze hulpmiddelen worden toegediend, te weten:

      a. zuurstof;

      b. stoffen die gecertificeerd zijn als medisch hulpmiddel in de zin van de [Wet op de medische hulpmiddelen][ref2].

      2 De zorg, bedoeld in het eerste lid, omvat ingeval van zuurstofapparatuur tevens vergoeding van stroomkosten.

      3 De zorg, bedoeld in het eerste lid, omvat niet:

      a. apparatuur voor chronische ademhalingsondersteuning;

      b. apparatuur die uitsluitend wordt ingezet ter vermindering van snurken.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
