articles:
  - number: '1'
    text: |-
      1 Deze regeling verstaat onder:

      a. de Minister: de Minister van Volksgezondheid, Welzijn en Sport;

      b. specialité: een geneesmiddel als bedoeld in [artikel 1, eerste lid, onderdeel p, van de Geneesmiddelenwet][ref1];

      c. preparaat: een geneesmiddel als bedoeld in [artikel 1, eerste lid, onderdeel q, van de Geneesmiddelenwet][ref2];

      d. branded generic: een specialité die in de handel wordt gebracht onder een benaming waarin de stofnaam is vermeld
      en waaraan een merkaanduiding is toegevoegd;

      e. combinatiepreparaat: een geneesmiddel dat meer dan één werkzaam bestanddeel bevat;

      f. registerdossier: uittreksel van het register, bedoeld in [artikel 53 van de Geneesmiddelenwet][ref3] en een
      afschrift van de in [artikel 46, tweede lid, van die wet][ref4] bedoelde goedkeuring van de samenvatting van
      productkenmerken dan wel een afschrift van de vergunning, bedoeld in artikel 3, eerste lid, van de [Verordening
      (EG) nr. 726/2004](32004R0726) van het Europees Parlement en de Raad van 31 maart 2004 tot vaststelling van
      communautaire procedures voor het verlenen van vergunningen en het toezicht op geneesmiddelen voor menselijk en
      diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau (PbEG L 136) en een afschrift van
      de in artikel 57, tweede lid, van die verordening bedoelde samenvatting van de productkenmerken;

      g. registratiehouder: degene op wiens naam een geneesmiddel in het register, bedoeld in onderdeel f, staat
      ingeschreven dan wel degene die voor een geneesmiddel een vergunning heeft ingevolge artikel 3, eerste lid, van de
      verordening, bedoeld in onderdeel f;

      h. Taxe: gegevens over prijzen en vergoeding van geneesmiddelen, opgenomen in de G-standaard die is uitgegeven door
      Z-index B.V.;

      i. Defined Daily Dose: de dagdosis van een geneesmiddel, als vastgesteld onder verantwoordelijkheid van het WHO
      Collaborating Centre for Drug Statistics Methodology;

      j. Anatomical Therapeutic Chemical Classification: de classificatie van geneesmiddelen, samengesteld onder
      verantwoordelijkheid van het WHO Collaborating Centre for Drug Statistics Methodology;

      k. standaardkuur: de totale hoeveelheid van het werkzame bestanddeel van een geneesmiddel dat, blijkens de
      dosering, vermeld in het registerdossier, wordt gegeven;

      l. referentiehoeveelheid: de hoeveelheid van een werkzaam bestanddeel, in een farmaceutische vorm gebracht,
      waarmee, gegeven de standaarddosis en het gebruikelijke aantal keren per dag dat het geneesmiddel wordt gegeven om
      die standaarddosis te bereiken, de gebruikelijke dagelijkse dosering kan worden bereikt, met dien verstande dat bij
      keuze tussen een retardvorm en een niet-retardvorm wordt uitgegaan van de niet-retardvorm;

      m. dbc: diagnose behandeling combinatie;

      n. *een rekening-courant*: een rekening in de centrale administratie van ’s rijks schatkist bij het ministerie
      van Financiën op naam van een rekening-couranthouder, waarop dagelijks het geldelijk tegoed (positief of negatief)
      wordt bijgehouden van de betrokken rekening-couranthouder bij het Rijk en de mutaties in het tegoed;

      o. *de rekening-couranthouder*: het Zorginstituut;

      p. *Euribor*: de dagelijks door de European Banking Federation vastgestelde rente waartegen op de geldmarkt
      interbancair deposito’s in euro’s van verschillende looptijden worden aangeboden in landen waar de euro
      betaalmiddel is;

      q. *prestatie*: een prestatie als omschreven bij of krachtens [artikel 11 van de Zorgverzekeringswet][ref5];

      r. *prestatiebeschrijving*:

      1°. een beschrijving van de prestatie zoals die op grond van de [Wet marktordening gezondheidszorg][ref6] voor een
      zorgaanbieder is vastgesteld dan wel

      2°. een beschrijving van de prestatie zoals die tussen de verzekerde en de zorgaanbieder is overeengekomen indien
      voor die zorgaanbieder niet een prestatiebeschrijving op grond van de [Wet marktordening gezondheidszorg][ref7]
      behoeft te worden vastgesteld;

      s. *declaratieregeling*: een regeling bedoeld in
      [artikel 38, derde lid, onder b, van de Wet marktordening gezondheidszorg][ref8];

      t. *formele controle*: een onderzoek waarbij de zorgverzekeraar nagaat of het tarief dat door een zorgaanbieder
      voor een prestatie in rekening is gebracht:

      1°. een prestatie betreft, welke is geleverd aan een bij die zorgverzekeraar verzekerde persoon;

      2°. een prestatie betreft, welke behoort tot het verzekerde pakket van die persoon,

      3°. een prestatie betreft, tot levering waarvan de zorgaanbieder bevoegd is, en

      4°. het tarief betreft, dat voor die prestatie krachtens de [Wet marktordening gezondheidszorg][ref9] is
      vastgesteld of een tarief is dat voor die prestatie met de zorgaanbieder is overeengekomen;

      u. *materiële controle*: een onderzoek waarbij de zorgverzekeraar nagaat of de door de zorgaanbieder in rekening
      gebrachte prestatie is geleverd en die geleverde prestatie het meest was aangewezen gezien de gezondheidstoestand
      van de verzekerde;

      v. *fraudeonderzoek*: een onderzoek waarbij de zorgverzekeraar nagaat of de verzekerde of de zorgaanbieder valsheid
      in geschrifte, bedrog, benadeling van rechthebbenden of verduistering pleegt of tracht te plegen ten nadele van bij
      de totstandkoming of uitvoering van een overeenkomst van zorgverzekering betrokken personen en organisaties met het
      doel een prestatie, vergoeding, betaling of ander voordeel te krijgen waarop de verzekerde dan wel de zorgaanbieder
      geen recht heeft of recht kan hebben;

      w. *verhaalsrecht*: het recht van de verzekeraar op grond van
      [artikel 962 van Boek 7 van het Burgerlijk Wetboek][ref10] de schade die is veroorzaakt door anderen dan de
      verzekerde op deze derden te verhalen;

      x. *detailcontrole:* onderzoek door de zorgverzekeraar naar bij de zorgaanbieder berustende persoonsgegevens met
      betrekking tot eigen verzekerden ten behoeve van materiële controle of fraudeonderzoek;

      y. *algemene risicoanalyse*: een analyse die erop is gericht te bepalen op welke gegevens de materiële controle of
      het fraudeonderzoek zich zal richten;

      z. *specifieke risicoanalyse:* een analyse die erop is gericht te bepalen op welke gegevens en op welke
      zorgaanbieders of categorieën van zorgaanbieders de detailcontrole zich zal richten;

      aa. *verwerker:* degene bedoeld in artikel 4, onderdeel 8, van de Algemene verordening gegevensbescherming;

      bb. *grensoverschrijdende zorg:* zorg waarop de [Zorgverzekeringswet][ref11] recht geeft en die verzekerden buiten
      Nederland hebben genoten;

      cc. *rapport zorgvraagzwaarte:* algemeen aanvaard rapport over zorgvraagzwaarte;

      dd. *zorgvraagzwaarte:* zorgvraagzwaarte zoals beschreven in het rapport zorgvraagzwaarte;

      ee. *Richtlijn 2011/24/EU:* Richtlijn 2011/24/EU van het Europees Parlement en de Raad van 9 maart 2011 betreffende
      de toepassing van de rechten van patiënten bij grensoverschrijdende gezondheidszorg (Pb EU 2011, L 88);

      ff. *gegevens over gezondheid:* gegevens over gezondheid, als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming;

      gg. *Covid-19:* de ziekte veroorzaakt door coronavirus-SARS-CoV-2;

      hh. geneeskundige behandeling: behandeling in het kader van geneeskundige zorg als bedoeld in
      [artikel 2.4 van het Besluit zorgverzekering][ref12].

      2 Voor de toepassing van deze regeling wordt onder mogendheid mede verstaan de Nederlandse Antillen en Aruba.


