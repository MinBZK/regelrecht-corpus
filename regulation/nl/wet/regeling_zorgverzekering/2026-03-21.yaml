  - number: '2.19'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel l][ref1], omvatten injectiespuiten met toebehoren dan wel
      injectiepennen met toebehoren, indien sprake is van een aandoening die een langdurig gebruik van deze middelen
      noodzakelijk maakt, met uitzondering van gebruik bij behandeling van diabetes.

      2 Een hulpmiddel als bedoeld in het eerste lid omvat tevens een aan een handicap aangepaste uitvoering, indien de
      verzekerde ten gevolge van een ernstige motorische handicap dan wel een verminderd gezichtsvermogen redelijkerwijs
      niet kan volstaan met een injectiespuit of injectiepen in een niet aangepaste uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2.6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.22'
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel p][ref1], omvatten draagbare, uitwendige infuuspompen met
      toebehoren, indien sprake is van continue parenterale toediening in de thuissituatie van een geneesmiddel dat valt
      onder de farmaceutische zorg, bedoeld in [artikel 2.8 van het Besluit zorgverzekering][ref2], met uitzondering
      van insuline.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2.8
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.22
