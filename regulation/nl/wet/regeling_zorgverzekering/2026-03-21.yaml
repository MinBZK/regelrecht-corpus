        artikel: '2.6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.17'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel j][ref1], omvatten:

      a. bedden in speciale uitvoering met inbegrip van daarvoor bestemde matrassen;

      b. anti-decubitusbedden, -matrassen en -overtrekken ter behandeling en preventie van decubitus;

      c. dekenbogen, bedhekken, bedrugsteunen en bedtafels;

      d. bedgalgen en hulpmiddelen voor het zelfstandig in en uit bed komen;

      e. glij- en rollakens;

      f. bedverkorters, -verlengers en -verhogers;

      g. ondersteken;

      h. bedbeschermende onderleggers, indien het verlies van bloed en exsudaat dusdanige hygiënische problemen oplevert
      dat deze slechts door gebruik van een bedbeschermende onderlegger kunnen worden ondervangen;

      i. infuusstandaarden.

      2 De hulpmiddelen, bedoeld in het eerste lid, kunnen ook worden aangewend als het gebruik daarvan strekt tot behoud
      van de zelfredzaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2.6'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '2.18'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel k][ref1], omvatten hulpmiddelen ter behandeling
      van stoornissen in de functies van de huid, niet zijnde hulpmiddelen voor het veranderen en handhaven van
      lichaamshouding en antidecubitusbedden, -matrassen en -overtrekken die vallen onder de in de [artikelen 2.12][ref2]
      en [2.17][ref3] omschreven hulpmiddelen.

      2 In geval van hulpmiddelen ter behandeling van stoornissen in de functie van de huid, zoals bedoeld in het eerste
      lid, dient sprake te zijn van:

      a. een complexe wond of een hoog risico daarop,

      b. ernstige littekens, of

      c. een chronische huidaandoening.

      3 Ingeval van allergeenvrij schoeisel gaat het om volledig individueel vervaardigd schoeisel, voor zover de
      verzekerde redelijkerwijs niet kan volstaan met confectieschoenen.

      4 De zorg, bedoeld in het eerste lid, omvat niet:

      a. inlegzolen, en

      b. smeerbare middelen, tenzij sprake is van behandeling van een complexe wond of een ernstig litteken.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0018715#Artikel2.17
