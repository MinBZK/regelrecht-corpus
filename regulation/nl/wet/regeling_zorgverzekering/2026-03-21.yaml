      Het Zvw-pgb wordt in ieder geval geweigerd indien:

      a. de verzekerde, of, indien de verzekerde de leeftijd van 18 jaar nog niet heeft bereikt, één van diens ouders of
      voogden, failliet is verklaard;

      b. ten aanzien van de verzekerde of, indien de verzekerde de leeftijd van 18 jaar nog niet heeft bereikt, één van
      diens ouders of voogden, de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een
      verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29b
  - number: 2.29c
    text: |-
      1 Het Zvw-pgb wordt geweigerd indien de verzekerde door een andere vertegenwoordiger wordt geholpen dan:

      a. een wettelijk vertegenwoordiger van de verzekerde,

      b. een bloed- of aanverwante in de eerste of tweede graad van de verzekerde of,

      c. de echtgenoot, de geregistreerde partner of een andere levensgezel van de verzekerde.

      2 De verzekerde die door een vertegenwoordiger wordt geholpen kan het Zvw-pgb worden geweigerd indien een gegronde
      reden bestaat om aan te nemen dat de vertegenwoordiger:

      a. bij een eerdere verstrekking van een Zvw-pgb waarbij deze als vertegenwoordiger optrad niet heeft bijgedragen
      aan nakoming van de daaraan verbonden verplichtingen,

      b. blijkens de basisregistratie personen niet beschikt over een woonadres,

      c. zijn vrijheid is ontnomen,

      d. onder de schuldsaneringsregeling natuurlijke personen valt, dan wel een verzoek tot van toepassing verklaring
      van die regeling bij de rechtbank is ingediend of deze derde failliet is verklaard,

      e. anderszins onvoldoende zal bijdragen aan het nakomen van de voor de verzekerde aan het Zvw-pgb verbonden
      verplichtingen, of

      f. de hulp tegen betaling verleent.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
