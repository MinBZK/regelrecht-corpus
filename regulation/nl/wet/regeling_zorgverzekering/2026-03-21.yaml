  - number: 6.5.5
    text: |-
      1 Het CAK verstrekt een zorgverzekeraar per kalenderjaar een bijdrage voor het onder de dekking van de
      zorgverzekering houden van verzekerden voor wier zorgverzekering de bestuursrechtelijke premie verschuldigd is.

      2 De bijdrage wordt berekend met de formule (A + B + C) * D, waarbij wordt verstaan onder:

      A: de som van het aantal maanden per verzekerde waarin ter zake van de zorgverzekering de bestuursrechtelijke
      premie verschuldigd was in het kalenderjaar;

      B: de som van het aantal maanden per verzekerde waarvoor de bestuursrechtelijke premie in het kalenderjaar niet
      verschuldigd was omdat de melding, bedoeld in [artikel 18c, eerste lid, van de Zorgverzekeringswet][ref1], ten
      gevolge van de toepasselijkheid van het tweede lid, onderdeel b, c of d, van dat artikel nog niet kon worden
      gedaan;

      C: de som van het aantal maanden per verzekerde waarin sprake is van een omstandigheid als bedoeld in
      [artikel 18d, vierde lid, onderdeel b of c, van de Zorgverzekeringswet][ref2] tot en met de maand waarin de
      zorgverzekeraar het CAK meldt dat hiervan sprake is, maar maximaal twee maanden;

      D: de standaardpremie als bedoeld in [artikel 4 van de Wet op de zorgtoeslag][ref3], gedeeld door twaalf.

      3 Het CAK verleent maandelijks ambtshalve een voorschot op de bijdrage dat wordt berekend op basis van het aantal
      verzekerden waarop het tweede lid in de periode tot en met de desbetreffende maand van toepassing is.

      4 De bijdrage en het maandelijkse voorschot worden berekend aan de hand van de volgende gegevens:

      a. het bestand van personen die op grond van een zorgverzekering verzekerd zijn;

      b. het bestand van personen ten aanzien waarvan het CAK de bestuursrechtelijke premie
      heft naar aanleiding van de meldingen, bedoeld in de [artikelen 18c, eerste lid][ref4], en
      [18d, derde lid en vierde lid, onderdeel b, van de Zorgverzekeringswet][ref5], en rekening houdend met de
      toepassing van de [artikelen 6.5.6][ref6] en [6.5.7][ref7].

      5 De zorgverzekeraar administreert:

      a. zijn meldingen, bedoeld in de [artikelen 18c, eerste lid][ref8], en
      [18d, derde lid en vierde lid, onderdeel b, van de Zorgverzekeringswet][ref9];

      b. het aantal maanden per verzekerde waarvoor de bestuursrechtelijke premie in het kalenderjaar niet verschuldigd
      was omdat de melding, bedoeld in [artikel 18c, eerste lid, van de Zorgverzekeringswet][ref10] ten gevolge van de
      toepasselijkheid van het tweede lid, onderdeel b, c of d, van dat artikel nog niet kon worden gedaan;

      c. de toepassing van de [artikelen 6.5.6][ref11] en [6.5.7][ref12] op zijn verzekeringsnemers;

      d. de verzekerden die de bestuursrechtelijke premie verschuldigd zijn en hij onverminderd onder de dekking van de
      zorgverzekering heeft gehouden.

      6 Het CAK kan bepalen dat de zorgverzekeraar uiterlijk 1 mei van het jaar volgende op het kalenderjaar ten
      behoeve waarvan de bijdrage is verstrekt op door het CAK te bepalen wijze opgave per kalendermaand doet uit
      de administratie, bedoeld in het vijfde lid. Daarbij kan het CAK bepalen dat de opgave is voorzien van een
      assurancerapport van een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref13],
      opgesteld overeenkomstig een door het CAK vastgesteld model met inachtneming van een door het CAK vastgesteld
      accountantsprotocol.

      7 Uiterlijk 1 september van het jaar volgende op het kalenderjaar ten behoeve waarvan de bijdrage is verstrekt
      stelt het CAK de bijdrage ambtshalve vast.

      8 Het CAK is bevoegd het verschil tussen de vastgestelde bijdrage en de bevoorschotte bijdrage te verrekenen met
      over een later kalenderjaar te verstrekken voorschotten op de bijdrage.


