      1 De eigen bijdrage voor een geneesmiddel dat is ingedeeld in een groep van onderling vervangbare geneesmiddelen
      bedraagt de kosten van dat geneesmiddel, voor zover de toepasselijke vergoedingslimiet, omgerekend naar de
      desbetreffende hoeveelheid, lager is dan de inkoopprijs die vermeld staat in de Taxe, verhoogd met de over het
      verschil verschuldigde omzetbelasting.

      2 In de jaren 2019 tot en met 2026 is de verzekerde voor geneesmiddelen als bedoeld in het eerste lid niet meer dan
      € 250 aan eigen bijdragen per kalenderjaar verschuldigd.

      3 Indien een zorgverzekering niet op 1 januari van een kalenderjaar ingaat of eindigt, wordt voor die overeenkomst
      het bedrag, bedoeld in het tweede lid, vermenigvuldigd met een breuk waarvan de teller gelijk is aan het aantal
      dagen in dat kalenderjaar waarover de zorgverzekering zal lopen of heeft gelopen, en de noemer aan het aantal dagen
      in het desbetreffende kalenderjaar.

      4 Het op grond van het derde lid berekende bedrag wordt afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.32
  - number: '2.33'
    text: |-
      1 Indien de aanschaffingskosten van hulpmiddelen ter volledige of gedeeltelijke vervanging van haar hoger zijn dan
      € 497,50 bedraagt de eigen bijdrage het verschil tussen de aanschaffingskosten en dat bedrag.

      2 De eigen bijdrage voor een hoortoestel of tinnitusmaskeerder voor een verzekerde van achttien jaar of ouder
      bedraagt vijfentwintig procent van de aanschafkosten.

      3 De eigen bijdrage voor orthopedische en allergeenvrij schoenen bedraagt:

      a. € 135,00 per paar, indien de verzekerde zestien jaar of ouder is;

      b. € 67,50 per paar, indien de verzekerde jonger is dan zestien jaar.

      4 De eigen bijdrage voor lenzen en brillenglazen bedraagt:

      a. € 66,00 per lens, indien sprake is van lenzen met een gebruiksduur langer dan een jaar;

      b. € 132,00 per kalenderjaar, indien sprake is van lenzen met een gebruiksduur korter dan een jaar. Ingeval slechts
      één oog dient te worden gecorrigeerd bedraagt de eigen bijdrage € 66,00 per kalenderjaar;

      c. € 66,00 per brillenglas, met een maximum van € 132,00 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
