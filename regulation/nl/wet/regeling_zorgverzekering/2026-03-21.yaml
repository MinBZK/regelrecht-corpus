  - number: '2.2'
    text: |-
      1 De zorg, bedoeld in de [artikelen 2.4][ref1] en [2.6 van het Besluit zorgverzekering][ref2] omvat tevens:

      a. van 1 juli 2021 tot 1 april 2027 blaasinstillatie met blaasspoelvloeistoffen met chondroïtinesulfaat of
      hyaluronzuur- voor de behandeling van patiënten met blaaspijnsyndroom met niet transurethraal behandelbare Hunnerse
      laesies voor zover de verzekerde deelneemt aan onderzoek als bedoeld in het tweede lid naar deze zorg;

      b.

      c.

      d.

      e.

      f.

      g. van 1 januari 2020 tot 1 januari 2029, hypertherme intraperitoneale chemotherapie toegevoegd aan primaire
      debulking bij patiënten met stadium III ovariumcarcinoom voor zover de verzekerde deelneemt aan onderzoek als
      bedoeld in het tweede lid, onderdeel a, naar deze zorg;

      h. in afwijking van [artikel 2.1, onderdeel k][ref3], juncto [bijlage 0, onderdeel 6][ref4], van 1 januari 2020 tot
      1 januari 2027 nusinersen voor de behandeling van patiënten met 5q spinale spieratrofie die 9,5 jaar en ouder zijn,
      voor zover de verzekerde deelneemt aan onderzoek als bedoeld in het tweede lid naar deze zorg.

      2 Als onderzoek naar zorg wordt aangemerkt:

      a. hoofdonderzoek naar de effectiviteit of kosteneffectiviteit van de zorg, en

      b. aanvullend landelijk observationeel onderzoek naar de zorg, dat in samenwerking met het hoofdonderzoek wordt
      opgezet en verricht indien:

      1°. de verzekerde, behoudens de zorginhoudelijke criteria, niet voldoet aan de criteria voor deelname aan het
      hoofdonderzoek,

      2°. de verzekerde niet heeft deelgenomen aan het hoofdonderzoek en de inclusie voor dat hoofdonderzoek is
      beëindigd, of

      3°. de verzekerde heeft deelgenomen aan het hoofdonderzoek zonder de zorg te hebben ontvangen en de deelname aan
      het hoofdonderzoek voor die verzekerde is voltooid.

      3 In afwijking van het eerste lid, onderdelen a en h, en onderdeel 136 van [bijlage 2][ref5] bij deze regeling
      is deelname van de verzekerde aan onderzoek als bedoeld in het tweede lid niet vereist indien het onderzoek is
      voltooid en:

      a. zolang het Zorginstituut niet heeft beoordeeld in hoeverre de zorg voldoet aan
      [artikel 2.1, tweede lid, van het Besluit zorgverzekering][ref6]; of

      b. voor zover het Zorginstituut heeft geoordeeld dat de zorg geheel of gedeeltelijk voldoet aan
      [artikel 2.1, tweede lid, van het Besluit zorgverzekering][ref7] en heeft geadviseerd om bij of krachtens
      de Zorgverzekeringswet te regelen dat die zorg geheel of gedeeltelijk behoort tot de prestaties, bedoeld in
      [artikel 11, eerste lid, van die wet][ref8]:

      1°. zolang de Minister geen standpunt als bedoeld in [artikel 24 van de Kaderwet adviescolleges][ref9] heeft
      ingenomen over het advies van het Zorginstituut; of

      2°. indien de Minister blijkens een standpunt als bedoeld in onderdeel b, onder 1°, voornemens is regels als
      bedoeld in onderdeel b, aanhef, te stellen: zolang die regels nog niet in werking zijn getreden.

      4 Het derde lid is niet van toepassing indien het onderzoek, bedoeld in het tweede lid, voortijdig is stopgezet.


