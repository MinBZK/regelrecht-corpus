  - number: 2.9.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel b][ref1], omvatten uitwendige hulpmiddelen voor het geheel of
      gedeeltelijk opheffen van de gevolgen van stoornissen in de functie van het ademhalingsstelsel, met inbegrip van
      stoffen die met behulp van deze hulpmiddelen worden toegediend, te weten:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.9.1.a
    text: zuurstof;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
  - number: 2.9.1.b
    text: |-
      stoffen die gecertificeerd zijn als medisch hulpmiddel in de zin van de [Wet op de medische hulpmiddelen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002697
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
    references:
      - id: ref1
        bwb_id: BWBR0002697
  - number: 2.9.2
    text: De zorg, bedoeld in het eerste lid, omvat ingeval van zuurstofapparatuur tevens vergoeding van stroomkosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
  - number: 2.9.3
    text: 'De zorg, bedoeld in het eerste lid, omvat niet:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
  - number: 2.9.3.a
    text: apparatuur voor chronische ademhalingsondersteuning;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
  - number: 2.9.3.b
    text: apparatuur die uitsluitend wordt ingezet ter vermindering van snurken.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.9
  - number: 2.10.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel c][ref1], omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.10.1.a
    text: |-
      hulpmiddelen ter correctie van stoornissen in de hoorfunctie voor zover er sprake is van een revalideerbaar oor met
      ten minste een verlies van 35 dB of ernstig oorsuizen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.10
  - number: 2.10.1.b
    text: |-
      hulpmiddelen ter compensatie van beperkingen in het luisteren of beperkingen in het gebruik van
      communicatieapparatuur, indien de hulpmiddelen als bedoeld onder a, hiervoor onvoldoende verbetering bieden dan wel
      indien deze hulpmiddelen substitueren voor de hulpmiddelen als bedoeld onder a.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.10
  - number: 2.10.2
    text: De zorg, bedoeld in het eerste lid, omvat niet deels implanteerbare hoorhulpmiddelen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.10
  - number: 2.10.3
    text: |-
      Een indicatie voor de in het eerste lid bedoelde hulpmiddelen is eveneens aanwezig als sprake is van een bijzondere
      individuele zorgvraag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.10
  - number: 2.10.4
    text: Voor signaalhonden geldt dat een tegemoetkoming kan worden verleend in de redelijk te achten gebruikskosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.10
  - number: 2.11.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel d][ref1], omvatten uitwendige hulpmiddelen met al dan niet
      inwendige onderdelen te gebruiken bij stoornissen in de functies gerelateerd aan urinelozing en defecatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.11.2
    text: 'De zorg, bedoeld in het eerste lid, omvat ingeval van absorberende incontinentie-absorptiematerialen:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.2.a
    text: |-
      materiaal voor verzekerden van drie of vier jaar indien sprake is van een niet-fysiologische vorm van
      incontinentie;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.2.b
    text: |-
      materiaal voor verzekerden van vijf jaar en ouder, tenzij sprake is van kortdurende incontinentie of van enuresis
      nocturna.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.3
    text: 'De zorg, bedoeld in het eerste lid, omvat niet:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.3.a
    text: schoonmaakmiddelen en geurmiddelen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.3.b
    text: |-
      huidbeschermende middelen anders dan bij stomapatiënten, voor zover deze niet vallen onder de te verzekeren
      prestatie farmaceutische zorg;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.3.c
    text: kleding, met uitzondering van netbroekjes;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.3.d
    text: plaswekkers voor de behandeling van enuresis nocturna;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.11.3.e
    text: beschermende onderleggers, tenzij sprake is van een
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.11
  - number: 2.12.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel e][ref1], omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.1.a
    text: |-
      hulpmiddelen ter correctie van gestoorde functies van het bewegingssysteem, aan beweging verwante functies of
      anatomische eigenschappen van structuren verwant aan beweging, toe te passen bij een ernstige aandoening, waarop de
      verzekerde permanent en niet uitsluitend bij sportactiviteiten is aangewezen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.1.b
    text: |-
      hulpmiddelen, niet zijnde een hulpmiddel voor verzorging en verpleging op bed als omschreven in
      [artikel 2.17][ref1], ter compensatie van beperkingen bij het:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.12.1.b.1°
    text: lopen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.1.b.2°
    text: gebruiken van hand en arm;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.1.b.3°
    text: veranderen en handhaven lichaamshouding;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.1.b.4°
    text: zich wassen en zorgdragen voor de toiletgang;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.1.b.5°
    text: gebruik van communicatieapparatuur.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.2
    text: |-
      In het geval van rolstoelen, drempelhulpen, transferhulpmiddelen en hulpmiddelen voor het zich wassen en zorgdragen
      voor de toiletgang gaat het om zorg voor een beperkte of onzekere duur.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.3
    text: De zorg, bedoeld in het eerste lid, onderdeel b, omvat niet
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.3.a
    text: hulpmiddelen die een compensatie bieden voor beperkingen bij het uitvoeren van huishoudelijke taken;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.3.b
    text: eenvoudige hulpmiddelen te gebruiken bij beperkingen bij het eten en drinken;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.3.c
    text: aan functiebeperkingen aangepaste stoelen, waarbij de aanpassing uitsluitend een sta-opsysteem betreft;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.3.d
    text: eenvoudige hulpmiddelen ter compensatie van beperkingen in het lopen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.12.4
    text: Voor ADL-honden geldt dat een tegemoetkoming kan worden verleend in de redelijk te achten gebruikskosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
  - number: 2.13.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel f][ref1], omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.13.1.a
    text: |-
      hulpmiddelen ter correctie van stoornissen in de visuele functie van het oog en van functies van aan het oog
      verwante structuren;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.1.b
    text: hulpmiddelen ter compensatie van beperkingen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.1.b.1°
    text: in het lezen, schrijven of gebruik van telecommunicatieapparatuur;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.1.b.2°
    text: bij het om obstakels heenlopen of bij de oriëntatie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.2
    text: 'De zorg, bedoeld in het eerste lid, omvat niet:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.2.a
    text: brillenglazen of filterglazen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.2.b
    text: brilmonturen voor brillenglazen of filterglazen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.2.c
    text: eenvoudige hulpmiddelen voor lezen en schrijven.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.3
    text: 'In het geval van lenzen dient:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.3.a
    text: |-
      de stoornis het gevolg te zijn van een medische aandoening of een trauma, waarbij lenzen tot een grotere
      verbetering in de functies gezichtsscherpte of kwaliteit van de visus leiden dan brillenglazen, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.3.b
    text: |-
      bij verzekerden jonger dan achttien jaar sprake te zijn van pathologische myopie met een refractieafwijking van ten
      minste –6 dioptrieën.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.4
    text: |-
      In afwijking van het tweede lid, onderdeel a, omvat de zorg brillenglazen en filterglazen voor verzekerden tot
      achttien jaar, indien:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.4.a
    text: |-
      er sprake is van indicatie voor lenzen als bedoeld in het derde lid, maar het dragen van lenzen niet de voorkeur
      heeft,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.4.b
    text: de verzekerde aan een of beide ogen geopereerd is vanwege een lensafwijking, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.4.c
    text: de verzekerde lijdt aan zuivere accommodatieve esotropie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: 2.13.5
    text: Voor blindengeleidehonden geldt dat een tegemoetkoming kan worden verleend in de redelijk te achten gebruikskosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
  - number: '2.16'
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel i,][ref1] omvatten, uitsluitend voor verzekerden jonger dan
      eenentwintig jaar:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.16.a
    text: pessaria;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.16
  - number: 2.16.b
    text: koperhoudende spiraaltjes.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.16
  - number: 2.17.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel j][ref1], omvatten:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.17.1.a
    text: bedden in speciale uitvoering met inbegrip van daarvoor bestemde matrassen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.b
    text: anti-decubitusbedden, -matrassen en -overtrekken ter behandeling en preventie van decubitus;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.c
    text: dekenbogen, bedhekken, bedrugsteunen en bedtafels;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.d
    text: bedgalgen en hulpmiddelen voor het zelfstandig in en uit bed komen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.e
    text: glij- en rollakens;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.f
    text: bedverkorters, -verlengers en -verhogers;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.g
    text: ondersteken;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.h
    text: |-
      bedbeschermende onderleggers, indien het verlies van bloed en exsudaat dusdanige hygiënische problemen oplevert dat
      deze slechts door gebruik van een bedbeschermende onderlegger kunnen worden ondervangen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.1.i
    text: infuusstandaarden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.17.2
    text: |-
      De hulpmiddelen, bedoeld in het eerste lid, kunnen ook worden aangewend als het gebruik daarvan strekt tot behoud
      van de zelfredzaamheid.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.17
  - number: 2.18.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel k][ref1], omvatten hulpmiddelen ter behandeling van stoornissen
      in de functies van de huid, niet zijnde hulpmiddelen voor het veranderen en handhaven van lichaamshouding en
      antidecubitusbedden, -matrassen en -overtrekken die vallen onder de in de [artikelen 2.12][ref2] en [2.17][ref3]
      omschreven hulpmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.18.2
    text: |-
      In geval van hulpmiddelen ter behandeling van stoornissen in de functie van de huid, zoals bedoeld in het eerste
      lid, dient sprake te zijn van:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.18.2.a
    text: een complexe wond of een hoog risico daarop,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.18.2.b
    text: ernstige littekens, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.18.2.c
    text: een chronische huidaandoening.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.18.3
    text: |-
      Ingeval van allergeenvrij schoeisel gaat het om volledig individueel vervaardigd schoeisel, voor zover de
      verzekerde redelijkerwijs niet kan volstaan met confectieschoenen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.18.4
    text: 'De zorg, bedoeld in het eerste lid, omvat niet:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.18.4.a
    text: inlegzolen, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.18.4.b
    text: smeerbare middelen, tenzij sprake is van behandeling van een complexe wond of een ernstig litteken.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.18
  - number: 2.19.1
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel l][ref1], omvatten injectiespuiten met toebehoren dan wel
      injectiepennen met toebehoren, indien sprake is van een aandoening die een langdurig gebruik van deze middelen
      noodzakelijk maakt, met uitzondering van gebruik bij behandeling van diabetes.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 2.19.2
    text: |-
      Een hulpmiddel als bedoeld in het eerste lid omvat tevens een aan een handicap aangepaste uitvoering, indien de
      verzekerde ten gevolge van een ernstige motorische handicap dan wel een verminderd gezichtsvermogen redelijkerwijs
      niet kan volstaan met een injectiespuit of injectiepen in een niet aangepaste uitvoering.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.19
  - number: '2.22'
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel p][ref1], omvatten draagbare, uitwendige infuuspompen met
      toebehoren, indien sprake is van continue parenterale toediening in de thuissituatie van een geneesmiddel dat valt
      onder de farmaceutische zorg, bedoeld in [artikel 2.8 van het Besluit zorgverzekering][ref2], met uitzondering
      van insuline.


