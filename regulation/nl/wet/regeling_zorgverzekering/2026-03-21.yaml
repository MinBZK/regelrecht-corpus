  - number: '2.45'
    text: |-
      1 Indien er binnen een groep van onderling vervangbare geneesmiddelen een geneesmiddel is, waarvan de prijs per
      standaarddosis gelijk is aan de in [artikel 2.44][ref1] bedoelde berekeningsbasis, is de vergoedingslimiet voor de
      geneesmiddelen uit die groep gelijk aan de prijs per standaarddosis van dat geneesmiddel.

      2 Indien er binnen een groep van onderling vervangbare geneesmiddelen geen geneesmiddel is waarvan de prijs per
      standaarddosis gelijk is aan de in [artikel 2.44][ref2] bedoelde berekeningsbasis, is de vergoedingslimiet voor
      de geneesmiddelen uit die groep gelijk aan de prijs per standaarddosis van het geneesmiddel die zo dicht mogelijk
      onder de berekeningsbasis ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.44
