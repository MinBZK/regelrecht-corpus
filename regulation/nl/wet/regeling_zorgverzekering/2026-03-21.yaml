    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29
  - number: 2.29a.1
    text: |-
      Tenzij het zorg betreft waarop de [artikelen 50 tot en met 56 van de Wet marktordening gezondheidszorg][ref1]
      van toepassing zijn, wordt met een Zvw-pgb ten hoogste € 30,84 per uur vergoed voor de zorg als bedoeld in
      [artikel 2.15a van het Besluit zorgverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.29a.2
    text: |-
      In afwijking van het bedrag, genoemd in het eerste lid, bedraagt de vergoeding ten hoogste
      een door de zorgverzekeraar te bepalen bedrag per uur indien de verzekerde kan aantonen
      dat de zorg is verleend door een persoon die is ingeschreven in het register, bedoeld in
      [artikel 3 van Wet de op de beroepen in de individuele gezondheidszorg][ref1], voor het uitoefenen van een beroep
      voor het verlenen van zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006251#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
    references:
      - id: ref1
        bwb_id: BWBR0006251
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.29a.3
    text: |-
      Het tweede lid is niet van toepassing indien de zorgverlener een bloed- of aanverwante in de eerste of tweede graad
      of de echtgenoot, geregistreerde partner of andere levensgezel is van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.4
    text: |-
      De vergoeding, bedoeld in het tweede lid, is ten hoogste gelijk aan het tarief dat door de zorgautoriteit op grond
      van de [Wet marktordening gezondheidszorg][ref1] voor de desbetreffende zorg is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 2.29a.5
    text: 'In afwijking van het eerste en tweede lid, worden de bedragen, bedoeld in voornoemde leden, ook vergoed indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.5.a
    text: |-
      de zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref1], in de periode van 1 maart 2020 tot en
      met 30 juni 2020, als gevolg van de maatregelen in verband met Covid-19, door de zorgverlener niet is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.29a.5.b
    text: deze niet-verleende zorg door de zorgverlener bij de verzekerde in rekening is gebracht; en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.5.c
    text: de zorgverlener hiervoor niet is gecompenseerd op grond van de werkgeverstaken van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.6
    text: |-
      De verzekerde houdt, via een door de zorgverzekeraar beschikbaar gesteld formulier, een registratie bij van de
      bedragen die hij vergoedt op grond van het vijfde lid. Deze registratie stelt hij op verzoek van de zorgverzekeraar
      ter beschikking.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.7
    text: 'In afwijking van het eerste en tweede lid, worden de bedragen, bedoeld in voornoemde leden, ook vergoed indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.7.a
    text: |-
      de zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref1], in de periode van 1 oktober 2020 tot
      en met 31 december 2021, door de zorgverlener niet is verleend in verband met:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.29a.7.a.1°
    text: een besmetting van de verzekerde of de zorgverlener met Covid-19,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.7.a.2°
    text: een noodzakelijke quarantaine van de verzekerde of diens zorgverlener vanwege Covid-19, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.7.a.3°
    text: |-
      het niet kunnen verlenen overeenkomstig de maatregelen in verband met Covid-
      19 aan de budgethouder vanwege een beperking bij de budgethouder als bedoeld in
      [artikel 6.6, tweede lid, onderdelen d en e, van de Tijdelijke regeling maatregelen covid-19][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0044416#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
    references:
      - id: ref1
        bwb_id: BWBR0044416
        artikel: '6'
  - number: 2.29a.7.b
    text: de niet-verleende zorg door de zorgverlener bij de verzekerde in rekening is gebracht; en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.7.c
    text: de zorgverlener hiervoor niet is gecompenseerd op grond van de werkgeverstaken van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.8
    text: |-
      De verzekerde houdt, via een door de zorgverzekeraar beschikbaar gesteld formulier, een registratie bij van de
      bedragen die hij vergoedt op grond van het zevende lid. In de registratie is opgenomen:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.8.a
    text: |-
      ingeval van besmetting met Covid-19 van de verzekerde: een bewijsstuk waaruit blijkt dat de zorg niet kon worden
      geleverd in verband met deze besmetting;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.8.b
    text: |-
      ingeval van een noodzakelijke quarantaine van de verzekerde in verband met Covid-19: een bewijsstuk of de tussen
      de verzekerde en de zorgverlener overeengekomen afspraken, waaruit blijkt dat de zorg niet kon worden geleverd in
      verband met deze quarantaine;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.8.c
    text: |-
      ingeval van besmetting met Covid-19 of noodzakelijke quarantaine van de zorgverlener in verband met Covid-19: een
      bewijsstuk of de tussen de zorgverlener en de verzekerde overeengekomen afspraken waaruit blijkt dat de zorg niet
      kon worden geleverd in verband met deze besmetting of noodzakelijke quarantaine;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.8.d
    text: |-
      ingeval van de in het tweede lid, onderdeel a, subonderdeel 3°, bedoelde situatie: een specificatie wanneer de zorg
      om deze reden niet kon worden geleverd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.9
    text: |-
      De verzekerde stelt, op verzoek van de zorgverzekeraar, de registratie, bedoeld in het achtste lid, ter
      beschikking.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.10
    text: 'In afwijking van het eerste en tweede lid, worden de bedragen, bedoeld in voornoemde leden, ook vergoed indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.10.a
    text: |-
      de zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref1] door de zorgverlener als gevolg van
      het ontvangen van een vaccinatie voor Covid-19, voor ten hoogste twee uur, niet is verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.29a.10.b
    text: de niet-verleende zorg door de zorgverlener bij de verzekerde in rekening is gebracht; en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.10.c
    text: de zorgverlener hiervoor niet is gecompenseerd op grond van de werkgeverstaken van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29a.11
    text: |-
      De verzekerde houdt, via een door de zorgverzekeraar beschikbaar gesteld formulier, een registratie bij van de
      bedragen die hij vergoedt op grond van het elfde lid. In de eigen administratie van budgethouder neemt budgethouder
      tevens een specificatie op van wanneer de zorg om deze reden niet kon worden geleverd. Deze registratie stelt hij
      op verzoek van de zorgverzekeraar ter beschikking.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29a
  - number: 2.29b
    text: 'Het Zvw-pgb wordt in ieder geval geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29b
  - number: 2.29b.a
    text: |-
      de verzekerde, of, indien de verzekerde de leeftijd van 18 jaar nog niet heeft bereikt, één van diens ouders of
      voogden, failliet is verklaard;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29b
  - number: 2.29b.b
    text: |-
      ten aanzien van de verzekerde of, indien de verzekerde de leeftijd van 18 jaar nog niet heeft bereikt, één van
      diens ouders of voogden, de schuldsaneringsregeling natuurlijke personen van toepassing is verklaard, dan wel een
      verzoek daartoe bij de rechtbank is ingediend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29b
  - number: 2.29c.1
    text: 'Het Zvw-pgb wordt geweigerd indien de verzekerde door een andere vertegenwoordiger wordt geholpen dan:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.1.a
    text: een wettelijk vertegenwoordiger van de verzekerde,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.1.b
    text: een bloed- of aanverwante in de eerste of tweede graad van de verzekerde of,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.1.c
    text: de echtgenoot, de geregistreerde partner of een andere levensgezel van de verzekerde.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.2
    text: |-
      De verzekerde die door een vertegenwoordiger wordt geholpen kan het Zvw-pgb worden geweigerd indien een gegronde
      reden bestaat om aan te nemen dat de vertegenwoordiger:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.2.a
    text: |-
      bij een eerdere verstrekking van een Zvw-pgb waarbij deze als vertegenwoordiger optrad niet heeft bijgedragen aan
      nakoming van de daaraan verbonden verplichtingen,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.2.b
    text: blijkens de basisregistratie personen niet beschikt over een woonadres,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.2.c
    text: zijn vrijheid is ontnomen,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.2.d
    text: |-
      onder de schuldsaneringsregeling natuurlijke personen valt, dan wel een verzoek tot van toepassing verklaring van
      die regeling bij de rechtbank is ingediend of deze derde failliet is verklaard,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.2.e
    text: |-
      anderszins onvoldoende zal bijdragen aan het nakomen van de voor de verzekerde aan het Zvw-pgb verbonden
      verplichtingen, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.29c.2.f
    text: de hulp tegen betaling verleent.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.29c
  - number: 2.30.1
    text: |-
      Het bedrag, bedoeld in [artikel 2.14, tweede lid, van het Besluit zorgverzekering][ref1], bedraagt € 0,40 per
      kilometer.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.30.2
    text: |-
      De vergoeding, bedoeld in [artikel 2.14, zesde lid, van het Besluit zorgverzekering][ref1], bedraagt ten hoogste
      € 94,50 per nacht.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.30.3
    text: |-
      De vergoeding, bedoeld in [artikel 2.12, vierde lid, van het Besluit zorgverzekering][ref1], bedraagt € 94,50 per
      nacht.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.30
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.31.1
    text: |-
      De eigen bijdrage voor zorg als bedoeld in [artikel 2.7, eerste lid, van het Besluit zorgverzekering][ref1], voor
      zover het gaat om zorg die niet rechtstreeks in verband staat met de indicatie voor bijzondere tandheelkundige
      hulp, bedraagt een bedrag ter grootte van het bedrag dat bij de desbetreffende verzekerde in rekening zou worden
      gebracht indien artikel 2.7, eerste lid, van het Besluit zorgverzekering niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.31.2
    text: |-
      De eigen bijdrage bedraagt voor een uitneembare volledige prothetische voorziening, bedoeld in
      [artikel 2.7, vijfde lid, onderdeel b, van het Besluit zorgverzekering][ref1], vijfentwintig procent van de kosten
      van die voorziening.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.31
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.31.3
    text: |-
      In afwijking van het tweede lid geldt voor een uitneembare volledige prothetische voorziening te plaatsen op
      tandheelkundige implantaten, een eigen bijdrage van:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.31
  - number: 2.31.3.a
    text: tien procent van de kosten van die voorziening, indien het gaat om een prothetische voorziening voor de onderkaak;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.31
  - number: 2.31.3.b
    text: acht procent van de kosten van die voorziening, indien het gaat om een prothetische voorziening voor de bovenkaak.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.31
  - number: 2.31.4
    text: |-
      De eigen bijdrage voor reparaties of overzetting van een uitneembare volledige prothetische voorziening bedraagt
      tien procent van de kosten van die reparatie of overzetting.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.31
  - number: 2.32.1
    text: |-
      De eigen bijdrage voor een geneesmiddel dat is ingedeeld in een groep van onderling vervangbare geneesmiddelen
      bedraagt de kosten van dat geneesmiddel, voor zover de toepasselijke vergoedingslimiet, omgerekend naar de
      desbetreffende hoeveelheid, lager is dan de inkoopprijs die vermeld staat in de Taxe, verhoogd met de over het
      verschil verschuldigde omzetbelasting.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.32
  - number: 2.32.2
    text: |-
      In de jaren 2019 tot en met 2026 is de verzekerde voor geneesmiddelen als bedoeld in het eerste lid niet meer dan
      € 250 aan eigen bijdragen per kalenderjaar verschuldigd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.32
  - number: 2.32.3
    text: |-
      Indien een zorgverzekering niet op 1 januari van een kalenderjaar ingaat of eindigt, wordt voor die overeenkomst
      het bedrag, bedoeld in het tweede lid, vermenigvuldigd met een breuk waarvan de teller gelijk is aan het aantal
      dagen in dat kalenderjaar waarover de zorgverzekering zal lopen of heeft gelopen, en de noemer aan het aantal dagen
      in het desbetreffende kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.32
  - number: 2.32.4
    text: Het op grond van het derde lid berekende bedrag wordt afgerond op hele euro’s.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.32
  - number: 2.33.1
    text: |-
      Indien de aanschaffingskosten van hulpmiddelen ter volledige of gedeeltelijke vervanging van haar hoger zijn dan
      € 497,50 bedraagt de eigen bijdrage het verschil tussen de aanschaffingskosten en dat bedrag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.2
    text: |-
      De eigen bijdrage voor een hoortoestel of tinnitusmaskeerder voor een verzekerde van achttien jaar of ouder
      bedraagt vijfentwintig procent van de aanschafkosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.3
    text: 'De eigen bijdrage voor orthopedische en allergeenvrij schoenen bedraagt:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.3.a
    text: € 135,00 per paar, indien de verzekerde zestien jaar of ouder is;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.3.b
    text: € 67,50 per paar, indien de verzekerde jonger is dan zestien jaar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.4
    text: 'De eigen bijdrage voor lenzen en brillenglazen bedraagt:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.4.a
    text: € 66,00 per lens, indien sprake is van lenzen met een gebruiksduur langer dan een jaar;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.4.b
    text: |-
      € 132,00 per kalenderjaar, indien sprake is van lenzen met een gebruiksduur korter dan een jaar. Ingeval slechts
      één oog dient te worden gecorrigeerd bedraagt de eigen bijdrage € 66,00 per kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.33.4.c
    text: € 66,00 per brillenglas, met een maximum van € 132,00 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.33
  - number: 2.36.1
    text: De eigen bijdrage voor kraamzorg ten huize van de verzekerde bedraagt € 5,70 per uur.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.36
  - number: 2.36.2
    text: |-
      De eigen bijdrage voor kraamzorg verleend in een instelling zonder dat verblijf in de instelling medisch
      noodzakelijk is, bedraagt voor zowel de moeder als het kind € 22,50 per dag, die wordt vermeerderd met het bedrag
      waarmee het tarief van de instelling € 161,50 per dag te boven gaat.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.36
  - number: 2.37.1
    text: De eigen bijdrage voor ziekenvervoer bedraagt € 134,00 per kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.37
  - number: 2.37.2
    text: 'De eigen bijdrage is niet verschuldigd:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.37
  - number: 2.37.2.a
    text: |-
      voor vervoer van een instelling waarin de verzekerde ten laste van de zorgverzekering of de verplichte verzekering
      voor langdurige zorg is opgenomen naar een andere instelling waarin de verzekerde ten laste van de zorgverzekering
      of de verplichte verzekering voor langdurige zorg wordt opgenomen voor het ondergaan van een specialistisch
      onderzoek of een specialistische behandeling waarvoor in de eerstbedoelde instelling niet de mogelijkheid bestaat;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.37
  - number: 2.37.2.b
    text: |-
      voor vervoer van een instelling als bedoeld in onderdeel a naar een persoon of instelling voor het ondergaan van
      een specialistisch onderzoek of een specialistische behandeling ten laste van de zorgverzekering waarvoor in de
      eerstbedoelde instelling niet de mogelijkheid bestaat, alsmede het vervoer terug naar die instelling;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.37
  - number: 2.37.2.c
    text: |-
      voor vervoer van een instelling waarin de verzekerde ten laste van de bijzondere ziektekostenverzekering is
      opgenomen naar een persoon of instelling voor een tandheelkundige behandeling ten laste van de bijzondere
      ziektekostenverzekering, waarvoor in de eerstbedoelde instelling niet de mogelijkheid bestaat, alsmede het vervoer
      terug naar die instelling;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.37
  - number: 2.37.2.d
    text: |-
      voor logeren, bedoeld in [artikel 2.14, zesde lid, van het Besluit zorgverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.37
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: '2.38'
    text: |-
      Als gezondheidsbevorderend of op preventie gericht programma, bedoeld in
      [artikel 2.17, tweede lid, onderdeel b, van het Besluit zorgverzekering][ref1], worden aangewezen programma’s met
      betrekking tot diabetes, depressie, hart- en vaatziekten, chronisch obstructief longlijden, overgewicht, dementie,
      trombosezorg, incontinentiezorg of stoppen met roken.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.38
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: '2.39'
    text: |-
      Bij de aanwijzing op grond van [artikel 2.8 van het Besluit zorgverzekering][ref1] en bij de toepassing van deze
      paragraaf wordt uitsluitend acht geslagen op:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.39
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.39.a
    text: het registerdossier,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.39
  - number: 2.39.b
    text: |-
      de publicaties onder auspiciën van de World Health Organization over de Defined Daily Dose en de Anatomical
      Therapeutical Chemical Classification,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.39
  - number: 2.39.c
    text: de in medisch-farmaceutische kringen gebruikelijke farmacologische en farmacotherapeutische handboeken,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.39
  - number: 2.39.d
    text: |-
      publicaties in tijdschriften die in medisch-farmaceutische kringen als betrouwbare bronnen voor
      geneesmiddeleninformatie gelden,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.39
  - number: 2.39.e
    text: gegevens afkomstig van farmaco-economisch onderzoek, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.39
  - number: 2.39.f
    text: |-
      andere gegevens en bescheiden als bedoeld in [artikel 42 van de Geneesmiddelenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel42
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.39
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '42'
  - number: 2.40.1
    text: 'Geneesmiddelen worden als onderling vervangbaar aangemerkt, indien zij:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.1.a
    text: bij een gelijksoortig indicatiegebied kunnen worden toegepast,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.1.b
    text: via een gelijke toedieningsweg worden toegediend, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.1.c
    text: in het algemeen voor dezelfde leeftijdscategorie zijn bestemd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.2
    text: |-
      Bij de toedieningswegen wordt een onderscheid gemaakt in toediening door middel van injectie waarbij systemisch het
      gewenste effect wordt beoogd, toediening niet door middel van een injectie waarbij systemisch het gewenste effect
      wordt beoogd, toediening door middel van injectie waarbij lokaal het gewenste effect wordt beoogd en toediening
      niet door middel van een injectie waarbij lokaal het gewenste effect wordt beoogd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.3
    text: 'In afwijking van het eerste en tweede lid worden geneesmiddelen niet als onderling vervangbaar aangemerkt, indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.3.a
    text: tussen die geneesmiddelen verschillen in eigenschappen bestaan,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.3.b
    text: |-
      deze verschillen in eigenschappen zich voordoen of kunnen voordoen bij de gehele patiëntenpopulatie, bij welke de
      geneesmiddelen kunnen worden toegepast, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.3.c
    text: |-
      uit de gegevens en bescheiden, bedoeld in [artikel 2.39][ref1], blijkt dat deze verschillen in eigenschappen,
      tezamen genomen, bepalend zijn voor de keuze van het geneesmiddel door de arts.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.40.4
    text: |-
      In afwijking van het eerste en tweede lid worden geneesmiddelen die behoren tot een subgroep die alleen uit
      preparaten bestaat of alleen uit specialités onder dezelfde merknaam, niet als onderling vervangbaar beschouwd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.5
    text: |-
      In afwijking van het eerste, tweede en derde lid wordt een combinatiepreparaat als onderling vervangbaar
      aangemerkt met een in een groep van onderling vervangbare geneesmiddelen opgenomen geneesmiddel, niet zijnde een
      combinatiepreparaat, dat een werkzaam bestanddeel bevat dat voorkomt in het combinatiepreparaat, indien:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.5.a
    text: |-
      alle werkzame bestanddelen van het combinatiepreparaat voorkomen in geneesmiddelen, niet zijnde
      combinatiepreparaten, die zijn opgenomen in een groep van onderling vervangbare geneesmiddelen, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.5.b
    text: |-
      de in onderdeel a bedoelde geneesmiddelen langs dezelfde toedieningsweg worden toegediend en in het algemeen voor
      dezelfde leeftijdscategorie zijn bestemd als het combinatiepreparaat.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.40.6
    text: |-
      Het vijfde lid is niet van toepassing op combinatiepreparaten van oestrogenen en progestagenen en
      combinatiepreparaten van thiazide- en kaliumsparende diuretica.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.40
  - number: 2.41.1
    text: |-
      Voor de berekening van een vergoedingslimiet wordt uitgegaan van een standaarddosis van het werkzame bestanddeel
      van het geneesmiddel.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.2
    text: |-
      De standaarddosis wordt bepaald op basis van de Defined Daily Dose, tenzij de Defined Daily Dose lager is dan de in
      Nederland geadviseerde minimale dosering of hoger is dan de in Nederland geadviseerde maximale dosering.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.3
    text: |-
      Indien een werkzaam bestanddeel onder verschillende zout- of estervormen in de handel is en bij de Defined
      Daily Dose geen onderscheid is gemaakt naar de zout- of estervorm, wordt de standaarddosis voor de verschillende
      zout- of estervormen, voor zover mogelijk, herleid tot de zout- of estervorm die het meest voorkomt in de in
      [artikel 2.39][ref1] genoemde bronnen.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.41.4
    text: |-
      Voor uitwendig toegepaste dermatologica geldt als standaarddosis 1 gram, 1 ml of 100 cm2, afhankelijk van de
      gehanteerde hoeveelheidsmaat.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.5
    text: |-
      De standaarddosis wordt zoveel mogelijk vastgesteld met overeenkomstige toepassing van de methodiek, gehanteerd bij
      de vaststelling van de Defined Daily Dose, indien:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.5.a
    text: voor een geneesmiddel geen Defined Daily Dose is vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.5.b
    text: |-
      de Defined Daily Dose lager is dan de in Nederland geadviseerde minimale dosering of hoger is dan de in Nederland
      geadviseerde maximale dosering.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.6
    text: |-
      In afwijking van het eerste tot en met vijfde lid wordt bij geneesmiddelen waarvoor geldt dat de duur van de
      medicatie wordt bekort door de hoeveelheid per dag gegeven werkzame bestanddelen te verhogen, uitgegaan van de
      standaardkuur.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.7
    text: 'De vergoedingslimiet van een geneesmiddel wordt opnieuw vastgesteld, indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.7.a
    text: |-
      de Defined Daily Dose van dat geneesmiddel bij een herziening van de Defined Daily Doses van een categorie van
      geneesmiddelen in de Anatomical Therapeutic Chemical Classification op niveau 4 wordt gewijzigd ten opzichte van de
      Defined Daily Dose waarvan eerder bij de bepaling van de standaarddosis was uitgegaan,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.7.b
    text: |-
      voor dat geneesmiddel de standaarddosis was bepaald overeenkomstig het vijfde lid, aanhef en onderdeel a, en voor
      dat geneesmiddel een Defined Daily Dose wordt vastgesteld, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.7.c
    text: |-
      wijziging optreedt in de in Nederland geadviseerde minimale of maximale dosering van een geneesmiddel, bedoeld
      in het vijfde lid, aanhef en onderdeel b, en die wijziging zou leiden tot een andere standaarddosis dan die
      waarvan bij de indeling van dat geneesmiddel in de desbetreffende groep van onderling vervangbare geneesmiddelen
      is uitgegaan.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.41.8
    text: |-
      Indien de Defined Daily Dose van een geneesmiddel of van geneesmiddelen, van de prijs waarvan is uitgegaan
      voor de berekening van een vergoedingslimiet, bij een herziening van de Defined Daily Dose van een categorie
      van geneesmiddelen in de Anatomical Therapeutic Chemical Classification op niveau 4 wordt gewijzigd, wordt de
      vergoedingslimiet voor de groep onderling vervangbare geneesmiddelen waartoe dat geneesmiddel behoort, opnieuw
      vastgesteld. Bij de berekening van de nieuwe vergoedingslimiet worden slechts betrokken de geneesmiddelen die
      betrokken zijn bij de eerdere berekening van de vergoedingslimiet.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.41
  - number: 2.42.1
    text: |-
      Voor zover een groep van onderling vervangbare geneesmiddelen bestaat uit geneesmiddelen die voor 1 oktober 1998
      geregistreerd waren en de prijs daarvan voorkwam in de op dat tijdstip geldende Taxe, wordt voor de berekening
      van de vergoedingslimiet voor de tot die groep behorende geneesmiddelen uitgegaan van de prijzen, vermeld in de
      bedoelde Taxe.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.42
  - number: 2.42.2
    text: |-
      Indien een groep van onderling vervangbare geneesmiddelen bestaat uit geneesmiddelen die na het in het eerste lid
      bedoelde tijdstip geregistreerd zijn of waarvan de prijs voor het eerst voorkwam in een na dat tijdstip verschenen
      Taxe, wordt voor de berekening van de vergoedingslimiet voor de tot die groep behorende geneesmiddelen uitgegaan
      van de prijs van het geneesmiddel, waarvan de prijs het eerst in de Taxe is vermeld.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.42
  - number: 2.42.3
    text: |-
      Bij de berekening van de vergoedingslimiet worden de prijzen van parallel geïmporteerde geneesmiddelen en van
      combinatiepreparaten als bedoeld in [artikel 2.40, vijfde lid][ref1], buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.42
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.43.1
    text: Per groep van onderling vervangbare geneesmiddelen wordt een gemiddelde prijs berekend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.43
  - number: 2.43.2
    text: |-
      Voor de berekening van de gemiddelde prijs wordt de groep verdeeld in subgroepen van geneesmiddelen die hetzelfde
      werkzame bestanddeel of dezelfde combinatie van werkzame bestanddelen hebben.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.43
  - number: 2.43.3
    text: |-
      Binnen een subgroep wordt voor de specialités met eenzelfde merknaam, met uitzondering van de branded generics, een
      gemiddelde prijs per standaarddosis berekend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.43
  - number: 2.43.4
    text: |-
      Binnen een subgroep wordt voor andere geneesmiddelen dan die, bedoeld in het derde lid, een gemiddelde prijs per
      standaarddosis berekend. Die prijs is het gemiddelde van de laagste prijzen van de geneesmiddelen in dezelfde
      farmaceutische vorm.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.43
  - number: 2.43.5
    text: |-
      Per subgroep worden de ingevolge het derde en vierde lid berekende gemiddelde prijzen per standaarddosis opgeteld
      en wordt die uitkomst gemiddeld, zodat een prijs per subgroep wordt verkregen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.43
  - number: 2.43.6
    text: Indien in de Taxe voor een specialité meer dan één prijs wordt vermeld, wordt uitgegaan van de laagste prijs.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.43
  - number: 2.44.1
    text: |-
      Indien de groep van onderling vervangbare geneesmiddelen bestaat uit slechts één subgroep, is de in
      [artikel 2.43, vijfde lid][ref1], bedoelde prijs per subgroep de basis voor de berekening van de vergoedingslimiet
      van de tot die groep behorende geneesmiddelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.44
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.44.2
    text: 'Indien de groep van onderling vervangbare geneesmiddelen bestaat uit meer dan één subgroep, worden, indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.44
  - number: 2.44.2.a
    text: |-
      de geneesmiddelen behoren tot één categorie in de Anatomical Therapeutic Chemical Classification op niveau 4, alle
      prijzen per subgroep bij elkaar opgeteld en wordt vervolgens het gemiddelde ervan berekend;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.44
  - number: 2.44.2.b
    text: |-
      de geneesmiddelen behoren tot verschillende categorieën op niveau 4 van de Anatomical Therapeutic Chemical
      Classification, de prijzen voor de verschillende subgroepen, voor zover behorend tot dezelfde categorie, gemiddeld,
      worden de aldus berekende prijzen voor de afzonderlijke categorieën opnieuw gemiddeld en vormt het aldus verkregen
      gemiddelde de berekeningsbasis voor de bepaling van de vergoedingslimiet.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.44
  - number: 2.45.1
    text: |-
      Indien er binnen een groep van onderling vervangbare geneesmiddelen een geneesmiddel is, waarvan de prijs per
      standaarddosis gelijk is aan de in [artikel 2.44][ref1] bedoelde berekeningsbasis, is de vergoedingslimiet voor de
      geneesmiddelen uit die groep gelijk aan de prijs per standaarddosis van dat geneesmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.45.2
    text: |-
      Indien er binnen een groep van onderling vervangbare geneesmiddelen geen geneesmiddel is waarvan de prijs per
      standaarddosis gelijk is aan de in [artikel 2.44][ref1] bedoelde berekeningsbasis, is de vergoedingslimiet voor
      de geneesmiddelen uit die groep gelijk aan de prijs per standaarddosis van het geneesmiddel die zo dicht mogelijk
      onder de berekeningsbasis ligt.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.45
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.46.1
    text: |-
      Indien van een geneesmiddel verschillende toedieningssterkten bestaan, wordt de vergoedingslimiet, berekend
      overeenkomstig de [artikelen 2.41 tot en met 2.45][ref1], voor het geneesmiddel met de kleinste toedieningssterkte
      gecorrigeerd door de ongecorrigeerde vergoedingslimiet te vermenigvuldigen met 2/10 maal het quotiënt van de
      referentiehoeveelheid en de kleinste toedieningssterkte van dat geneesmiddel, vermeerderd met 8/10.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.46.2
    text: |-
      Voor geneesmiddelen die voor andere leeftijdscategorieën dan volwassenen zijn bestemd, is de referentiehoeveelheid
      de hoeveelheid die voorkomt in het preparaat van de hoogste hoeveelheid van die andere leeftijdscategorieën.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.46
  - number: 2.46.3
    text: De dimensie van de referentiehoeveelheid moet gelijk zijn aan de dimensie van de kleinste toedieningsvorm.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.46
  - number: 2.46.4
    text: |-
      Bij geneesmiddelen als bedoeld in de [artikelen 2.40, vijfde lid][ref1], en [2.41, zesde lid][ref2], blijven het
      eerste tot en met het derde lid buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.46
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.47.1
    text: |-
      De vergoedingslimiet van een combinatiepreparaat als bedoeld in [artikel 2.40, vijfde lid][ref1], is gelijk
      aan de som van de vergoedingslimieten voor de geneesmiddelen, niet zijnde combinatiepreparaten, die de werkzame
      bestanddelen bevatten die in het combinatiepreparaat voorkomen en die langs dezelfde toedieningsweg worden
      toegediend en in het algemeen voor dezelfde leeftijdscategorie zijn bestemd als het combinatiepreparaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.47
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.47.2
    text: |-
      Indien de in het eerste lid bedoelde geneesmiddelen die geen combinatiepreparaten zijn, een in het
      combinatiepreparaat voorkomend werkzaam bestanddeel bevatten in een andere hoeveelheid of in een andere
      toedieningsvorm dan die welke in het combinatiepreparaat voorkomt, wordt uitgegaan van de vergoedingslimieten, die
      voor die geneesmiddelen zouden hebben gegolden indien die geneesmiddelen dat werkzame bestanddeel zouden hebben
      bevat in de hoeveelheid en de toedieningsvorm die in het combinatiepreparaat voorkomt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.47
  - number: '2.48'
    text: |-
      Voor zover de toepassing van de [artikelen 2.40 tot en met 2.47][ref1] naar het oordeel van de Minister tot een
      uitkomst leidt die niet in overeenstemming is met de strekking daarvan, kan de Minister een besluit nemen in
      afwijking daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.48
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 2.50.1
    text: |-
      De registratiehouder kan bij de Minister een aanvraag indienen om een geneesmiddel aan te wijzen ingevolge
      [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.50.2
    text: |-
      De aanvraag geschiedt met gebruikmaking van een door de Minister vast te stellen formulier. Daarbij worden de
      gegevens en de bescheiden verschaft die voor de beslissing op de aanvraag nodig zijn. De datum van ontvangst wordt
      aan de aanvrager meegedeeld.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
  - number: 2.50.3
    text: |-
      Indien de overgelegde gegevens en bescheiden onvoldoende zijn, stelt de Minister de aanvrager in de gelegenheid
      binnen een door hem te bepalen termijn de aanvraag aan te vullen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
  - number: 2.50.4
    text: De Minister hoort over de aanvraag het Zorginstituut.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
  - number: 2.50.5
    text: |-
      De Minister beslist binnen 90 dagen na ontvangst van de aanvraag. Deze termijn wordt opgeschort met ingang van de
      dag waarop de Minister de aanvrager uitnodigt de aanvraag aan te vullen, tot de dag waarop de aanvraag is aangevuld
      of de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
  - number: 2.50.6
    text: |-
      De inhoud van het voorgenomen besluit, voor zover betrekking hebbend op de aanvraag, wordt aan de aanvrager
      meegedeeld. Daarbij wordt tevens het oordeel van het Zorginstituut toegezonden en wordt de motivering vermeld,
      tenzij redelijkerwijs kan worden aangenomen dat daaraan geen behoefte bestaat. Aan de aanvrager wordt meegedeeld
      welke rechtsmiddelen hem ter beschikking staan.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
  - number: 2.50.7
    text: |-
      Het tweede tot en met het zesde lid zijn van overeenkomstige toepassing indien de registratiehouder verzoekt
      om herziening van een besluit ingevolge het eerste lid en hij daartoe nieuw gebleken feiten of veranderde
      omstandigheden aanvoert.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
  - number: 2.50.8
    text: |-
      Indien de Minister voornemens is een geneesmiddel ambtshalve aan te wijzen ingevolge
      [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref1] dan wel zodanige aanwijzing te
      wijzigen, deelt hij de registratiehouder uiterlijk een maand voor de beoogde datum van inwerkingtreding de
      zakelijke inhoud van het voorgenomen besluit mede. Het vierde en zesde lid zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.50.9
    text: |-
      Indien het een geneesmiddel betreft met dezelfde werkzame bestanddelen, van dezelfde
      sterkte en in dezelfde farmaceutische vorm als een geneesmiddel dat reeds ingevolge
      [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref1] is aangewezen, zijn het tweede tot en
      met vierde lid, het zesde lid, tweede volzin, en het zevende en achtste lid niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.50
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 3.1.1
    text: 'De zorgverzekeraar neemt in ieder geval in zijn uitvoeringsverslag op:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
  - number: 3.1.1.a
    text: |-
      het profiel, de organisatiestructuur en het gevoerde en voorgenomen beleid bij de uitvoering van de
      [Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 3.1.1.b
    text: de wijze waarop hij uitvoering geeft aan de zorgplicht;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
  - number: 3.1.1.c
    text: de wijze waarop hij uitvoering geeft aan de acceptatieplicht en het verbod op premiedifferentiatie;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
  - number: 3.1.1.d
    text: |-
      de wijze waarop hij de afhandeling van klachten van de verzekerden heeft georganiseerd alsmede de resultaten
      daarvan;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
  - number: 3.1.1.e
    text: de wijze waarop hij uitvoering geeft aan gedragscodes waaraan hij zich heeft verbonden;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
  - number: 3.1.1.f
    text: |-
      of hij het Protocol incassotraject wanbetalers [Zorgverzekeringswet][ref1] is nagekomen, en zo nee, welke
      onderdelen niet, waarom niet, en wat hij in de plaats van die onderdelen aan incassowerkzaamheden heeft verricht;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 3.1.1.g
    text: |-
      algemene gegevens over de honorering van directie en bestuur van de zorgverzekeraar voor de uitvoering van de
      [Zorgverzekeringswet][ref1]


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 3.1.1.h
    text: |-
      gegevens over zijn relaties met aanbieder van zorg en de wijze waarop hij stuurt op de kwaliteit van door hen
      geleverde zorg.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
  - number: 3.1.2
    text: |-
      Het uitvoeringsverslag wordt, voor zover het gaat om de in het vorige lid genoemde aspecten, ingericht
      overeenkomstig een door de zorgautoriteit beschikbaar te stellen model.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel3.1
  - number: '4.1'
    text: |-
      De reserve, bedoeld in [artikel 39, vierde lid, van de Zorgverzekeringswet][ref1] wordt vastgesteld op nihil.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel39
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '39'
  - number: '4.2'
    text: |-
      In de centrale administratie van ’s rijks schatkist wordt een rekening-courant geopend op naam van
      het Zorginstituut ten behoeve van de financiële middelen van het Zorgverzekeringsfonds op grond van
      [artikel 40, tweede lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel40
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '40'
  - number: 4.3.1
    text: |-
      De betaalrekeningen van het Zorginstituut bij in Nederland gevestigde banken worden door het Ministerie van
      Financiën in overeenstemming met de betrokken banken opgenomen in concernverband met betaalrekeningen van ’s rijks
      schatkist bij die banken.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.3
  - number: 4.3.2
    text: |-
      Dagelijks op nader in overleg met de betrokken banken te bepalen tijdstippen worden de op de betaalrekeningen
      van het Zorginstituut voorkomende positieve saldi overgeboekt naar ’s rijks schatkist, dan wel worden voorkomende
      negatieve saldi aangevuld vanuit ’s rijks schatkist. De hiermee samenhangende mutaties op de betaalrekeningen
      worden door het Ministerie van Financiën ten gunste dan wel ten laste van de rekening-courant, bedoeld in
      [artikel 4.2][ref1], geboekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.3
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.3.3
    text: |-
      Het Ministerie van Financiën sluit met het Zorginstituut een overeenkomst ter uitwerking van het gebruik van de
      rekening-courant.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.3
  - number: 4.3.4
    text: |-
      In de overeenkomst, bedoeld in het derde lid, worden afspraken vastgelegd over de wederzijdse informatievoorziening
      tussen enerzijds het Ministerie van Financiën en anderzijds het Zorginstituut en kan bij wijze van uitzondering
      afgesproken worden om een betaalrekening buiten het concernverband als bedoeld in het eerste lid te houden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.3
  - number: 4.4.1
    text: |-
      Ten gunste van de rekening-courant, bedoeld in [artikel 4.2][ref1], worden door het Ministerie van Financiën tevens
      geboekt:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.1.a
    text: de bijdragen van het Rijk aan de rekening-couranthouder ten behoeve van het Zorgverzekeringsfonds;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.4
  - number: 4.4.1.b
    text: |-
      de afdrachten van de door de rijksbelastingdienst geïnde bijdragen aan de rekening-couranthouder ten behoeve van
      het Zorgverzekeringsfonds;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.4
  - number: 4.4.1.c
    text: |-
      de creditrente, bedoeld in [artikel 4.5, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.2
    text: |-
      Ten laste van de rekeningen-courant, bedoeld in [artikel 4.2][ref1], wordt door het Ministerie van Financiën tevens
      geboekt de debetrente, bedoeld in [artikel 4.5, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '4'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '4'
        hoofdstuk: '4'
  - number: 4.4.3
    text: |-
      De boekingen, bedoeld in het eerste lid, onderdeel b, worden door het Ministerie van Financiën van
      valutadata voorzien, zodanig dat deze data overeenkomen met de gemiddelde data waarop de bijdragen door de
      rijksbelastingdienst worden geïnd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.4
  - number: 4.5.1
    text: |-
      Over het dagelijkse creditsaldo van de rekening-courant is de Minister
      van Financiën aan het Zorginstituut een rente verschuldigd overeenkomstig
      [artikel 4, eerste lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040289#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0040289
        artikel: '4'
  - number: 4.5.2
    text: |-
      Over het dagelijkse debetsaldo van de rekening-courant is het Zorginstituut een rente verschuldigd overeenkomstig
      [artikel 4, vijfde lid, van de Regeling schatkistbankieren RWT’s en andere rechtspersonen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0040289#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.5
    references:
      - id: ref1
        bwb_id: BWBR0040289
        artikel: '4'
  - number: 4.5.3
    text: |-
      De Minister van Financiën verrekent achteraf de over een kalenderjaar verschuldigde creditrente met de over dat
      jaar verschuldigde debetrente. Het saldo wordt geboekt op de rekening-courant per de eerste kalenderdag na afloop
      van het jaar waarop de credit- respectievelijk debetrente betrekking heeft. Daartoe stelt de Minister van Financiën
      een rentenota op.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.5
  - number: '4.6'
    text: De rekening-couranthouder is bevoegd een bedrag van ten hoogste € 2,5 miljoen buiten de rekening-courant te houden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.6
  - number: 4.7.1
    text: |-
      De Minister van Volksgezondheid, Welzijn en Sport voert ten behoeve van de beoordeling van de rechtmatigheid van
      de verstrekkingen van uitkeringen als bedoeld in [artikel 118a, eerste lid, van de Zorgverzekeringswet][ref1] een
      statistische steekproef uit.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
  - number: 4.7.2
    text: |-
      Bij de accountantscontrole van de jaarrekening, bedoeld in het [74, eerste lid, van de Zorgverzekeringswet][ref1]
      worden de resultaten van de steekproef, bedoeld in het eerste lid, betrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel74
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.7
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '74'
  - number: 5.1.1
    text: |-
      Het in [artikel 42, eerste lid, onderdeel b, van de Zorgverzekeringswet][ref1] bedoelde tijdstip is de eerste
      dag van de kalendermaand volgende op de maand waarin de verzekeringsplichtige de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt, met dien verstande
      dat dit tijdstip gelijk is aan de datum waarop een definitieve vaststelling van een bijstandsuitkering als
      bedoeld in [artikel 5, aanhef, en onder a, van de Participatiewet][ref3], of van een uitkering als bedoeld
      in de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] plaatsvindt, indien
      dat tijdstip later ligt dan eerstbedoeld tijdstip.


