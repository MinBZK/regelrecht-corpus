  - number: '2.5'
    text: |-
      1 In [bijlage 1][ref1] bij deze regeling worden genoemd:

      a. de op grond van [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref2] aangewezen
      geregistreerde geneesmiddelen;

      b. de op grond van [artikel 2.1, vijfde lid, van het Besluit zorgverzekering][ref3] aangewezen geneesmiddelen.

      2 In [bijlage 2][ref4] bij deze regeling worden vermeld:

      a. categorieën van geneesmiddelen, bedoeld in het eerste lid, onderdeel a, waarvoor de farmaceutische zorg slechts
      aflevering van dat geneesmiddel omvat indien voldaan is aan de bij die categorieën vermelde criteria;

      b. de voorwaarden waaronder en de termijn gedurende welke de farmaceutische zorg, bedoeld in de aanhef van
      [artikel 2.8, eerste lid, van het Besluit zorgverzekering][ref5] de geneesmiddelen, bedoeld in het eerste lid,
      onderdeel b, omvat.

      3 Polymere, oligomere, monomere en modulaire dieetpreparaten behoren slechts tot de farmaceutische zorg indien
      voldaan is aan [onderdeel 1 van bijlage 2][ref6] van deze regeling.

      4 In [bijlage 3][ref7], onderdelen A en B, bij deze regeling worden genoemd de geregistreerde geneesmiddelen die
      als gevolg van een beslissing als bedoeld in [artikel 2.50, vijfde lid][ref8], niet zijn aangewezen, geregistreerde
      geneesmiddelen ten aanzien waarvan het voornemen tot aanwijzing als bedoeld in artikel 2.50, achtste lid, niet is
      uitgevoerd en geregistreerde geneesmiddelen die als gevolg van een wijziging van [bijlage 1][ref9] niet meer zijn
      aangewezen.

      5 Farmaceutische zorg, bedoeld in
      [artikel 2.8, eerste lid, onderdeel b, onder 1°, van het Besluit zorgverzekering][ref10], omvat geneesmiddelen die
      gelijkwaardig of nagenoeg gelijkwaardig zijn aan:

      a. een geregistreerd UR-geneesmiddel als bedoeld in [artikel 1, eerste lid, onder s, van de Geneesmiddelenwet][ref11]
      waarover blijkens [bijlage 1][ref12] en [3][ref13] bij deze regeling geen besluit over de aanwijzing, bedoeld in
      [artikel 2.8, eerste lid, onderdeel a, van het Besluit zorgverzekering][ref14], is genomen;

      b. een in [bijlage 3][ref15], onderdeel A, bij deze regeling genoemd niet aangewezen, geregistreerd geneesmiddel
      als bedoeld in [artikel 1, eerste lid, onder s, van de Geneesmiddelenwet][ref16], mits aan daarbij vermelde
      criteria wordt voldaan.


