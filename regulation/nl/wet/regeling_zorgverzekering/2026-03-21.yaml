  - number: '2.8'
    text: |-
      Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel a][ref1], omvatten:

      a. hulpmiddelen ter volledige of gedeeltelijke vervanging van:

      1°. de onderste en bovenste extremiteiten, inclusief oplaadinrichting en batterijen indien het gaat om hulpmiddelen
      met een energievoorziening;

      2°. de mamma;

      3°. de stembanden, voor zover deze hulpmiddelen niet vallen onder geneeskundige zorg zoals medisch-specialisten die
      plegen te bieden;

      4°. het haar indien sprake is van gehele of gedeeltelijke kaalhoofdigheid als gevolg van een medische aandoening of
      behandeling van medische aard;

      b. hulpmiddelen ter volledige of gedeeltelijke vervanging of bedekking van:

      1°. de oogbol;

      2°. het gelaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.8
