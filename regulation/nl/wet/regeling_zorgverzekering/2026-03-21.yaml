  - number: '2.7'
    text: |-
      1 Indien in de [artikelen 2.8 tot en met 2.36][ref1] een leeftijd is vermeld, wordt bedoeld de leeftijd van de
      verzekerde op het moment waarop hij zich wendt tot de aanbieder van het hulpmiddel.

      2 Indien een hulpmiddel in bruikleen wordt gegeven, omvat het hulpmiddel tevens vergoeding van de kosten van
      vervoer van het hulpmiddel naar en van de woning van de verzekerde, van het regelmatig onderhoud ervan alsmede van
      de voor gebruik, ontsmetting en reiniging van de apparatuur benodigde chemicaliën.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.8
