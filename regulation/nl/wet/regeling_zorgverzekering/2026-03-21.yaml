  - number: 6.3a.2
    text: |-
      1 Het CAK verstrekt slechts een vergoeding indien betrokkene gedurende de periode:

      a. ingeschreven heeft gestaan bij het orgaan van de woonplaats, bedoeld in
      [artikel 123, eerste lid, onderdeel a, van de Zorgverzekeringswet][ref1]; of

      b. heeft voldaan aan de voorwaarden die voor het recht op verstrekkingen voor zorg golden overeenkomstig de
      wetgeving waarvan met terugwerkende kracht is vastgesteld dat deze niet van toepassing was.

      2 In afwijking van het eerste lid kan het CAK ook een vergoeding verstrekken indien betrokkene niet heeft voldaan
      aan het eerste lid en hij jegens het CAK aannemelijk heeft gemaakt dat hem dat niet verweten kan worden.

      3 Voor vergoeding komen in aanmerking de kosten van gedurende de periode verleende zorg en overige diensten als
      bedoeld bij en krachtens [artikel 11 van de Zorgverzekeringswet][ref2] verminderd met:

      a. kosten die hoger zijn dan in de Nederlandse marktomstandigheden in redelijkheid passend is te achten;

      b. hetgeen betrokkene als eigen bijdrage had moeten betalen indien hij in de periode krachtens een zorgverzekering
      recht zou hebben gehad op de zorg of overige diensten; en

      c. hetgeen betrokkene als verplicht eigen risico had moeten betalen indien hij in de periode krachtens een
      zorgverzekering recht zou hebben gehad op de zorg of overige diensten.

      4 Het CAK bepaalt de hoogte van de vergoeding op basis van gegevens van:

      a. het orgaan van de woonplaats als bedoeld in het eerste lid, onderdeel a;

      b. het bevoegd orgaan van de staat waarvan de wetgeving achteraf bezien niet van toepassing was; of

      c. facturen van zorgaanbieders.

      5 Indien uit de gegevens, bedoeld in het vierde lid, niet kan worden afgeleid of en zo ja, in welke mate, de
      verleende zorg of overige diensten meer of andere werkzaamheden betreffen dan de zorg en overige diensten, bedoeld
      bij en krachtens [artikel 11 van de Zorgverzekeringswet][ref3], is het CAK bevoegd om, in afwijking van de aanhef
      van het derde lid, ook de kosten van de verleende extra of andere zorg of overige diensten te vergoeden.

      6 Het CAK is bevoegd om kosten buiten vergoeding te laten indien deze:

      a. al op grond van de wetgeving, bedoeld in het eerste lid, onderdeel b, zijn voldaan, en

      b. niet door het bevoegd orgaan, bedoeld in het vierde lid, onderdeel b, worden teruggevorderd.

      7 Het CAK betaalt de vergoeding:

      a. indien de betrokkene de kosten van de zorg inmiddels voor eigen rekening heeft genomen: aan de betrokkene;

      b. indien onderdeel a niet van toepassing is: aan het orgaan van de woonplaats, bedoeld in het eerste lid,
      onderdeel a, aan het bevoegd orgaan van de staat, bedoeld in het vierde lid, onderdeel b, of, indien het zorgkosten
      als bedoeld in het vierde lid, onderdeel c, betreft, aan de zorgaanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel123
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel11
