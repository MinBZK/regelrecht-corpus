  - number: '2.40'
    text: |-
      1 Geneesmiddelen worden als onderling vervangbaar aangemerkt, indien zij:

      a. bij een gelijksoortig indicatiegebied kunnen worden toegepast,

      b. via een gelijke toedieningsweg worden toegediend, en

      c. in het algemeen voor dezelfde leeftijdscategorie zijn bestemd.

      2 Bij de toedieningswegen wordt een onderscheid gemaakt in toediening door middel van injectie waarbij systemisch
      het gewenste effect wordt beoogd, toediening niet door middel van een injectie waarbij systemisch het gewenste
      effect wordt beoogd, toediening door middel van injectie waarbij lokaal het gewenste effect wordt beoogd en
      toediening niet door middel van een injectie waarbij lokaal het gewenste effect wordt beoogd.

      3 In afwijking van het eerste en tweede lid worden geneesmiddelen niet als onderling vervangbaar aangemerkt,
      indien:

      a. tussen die geneesmiddelen verschillen in eigenschappen bestaan,

      b. deze verschillen in eigenschappen zich voordoen of kunnen voordoen bij de gehele patiëntenpopulatie, bij welke
      de geneesmiddelen kunnen worden toegepast, en

      c. uit de gegevens en bescheiden, bedoeld in [artikel 2.39][ref1], blijkt dat deze verschillen in eigenschappen,
      tezamen genomen, bepalend zijn voor de keuze van het geneesmiddel door de arts.

      4 In afwijking van het eerste en tweede lid worden geneesmiddelen die behoren tot een subgroep die alleen uit
      preparaten bestaat of alleen uit specialités onder dezelfde merknaam, niet als onderling vervangbaar beschouwd.

      5 In afwijking van het eerste, tweede en derde lid wordt een combinatiepreparaat als onderling vervangbaar
      aangemerkt met een in een groep van onderling vervangbare geneesmiddelen opgenomen geneesmiddel, niet zijnde een
      combinatiepreparaat, dat een werkzaam bestanddeel bevat dat voorkomt in het combinatiepreparaat, indien:

      a. alle werkzame bestanddelen van het combinatiepreparaat voorkomen in geneesmiddelen, niet zijnde
      combinatiepreparaten, die zijn opgenomen in een groep van onderling vervangbare geneesmiddelen, en

      b. de in onderdeel a bedoelde geneesmiddelen langs dezelfde toedieningsweg worden toegediend en in het algemeen
      voor dezelfde leeftijdscategorie zijn bestemd als het combinatiepreparaat.

      6 Het vijfde lid is niet van toepassing op combinatiepreparaten van oestrogenen en progestagenen en
      combinatiepreparaten van thiazide- en kaliumsparende diuretica.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.39
