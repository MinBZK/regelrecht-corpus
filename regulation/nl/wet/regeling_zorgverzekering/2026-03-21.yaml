        paragraaf: '1'
  - number: '2.12'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel e][ref1], omvatten:

      a. hulpmiddelen ter correctie van gestoorde functies van het bewegingssysteem, aan beweging verwante functies of
      anatomische eigenschappen van structuren verwant aan beweging, toe te passen bij een ernstige aandoening, waarop de
      verzekerde permanent en niet uitsluitend bij sportactiviteiten is aangewezen.

      b. hulpmiddelen, niet zijnde een hulpmiddel voor verzorging en verpleging op bed als omschreven in
      [artikel 2.17][ref2], ter compensatie van beperkingen bij het:

      1°. lopen;

      2°. gebruiken van hand en arm;

      3°. veranderen en handhaven lichaamshouding;

      4°. zich wassen en zorgdragen voor de toiletgang;

      5°. gebruik van communicatieapparatuur.

      2 In het geval van rolstoelen, drempelhulpen, transferhulpmiddelen en hulpmiddelen voor het zich wassen en
      zorgdragen voor de toiletgang gaat het om zorg voor een beperkte of onzekere duur.

      3 De zorg, bedoeld in het eerste lid, onderdeel b, omvat niet

      a. hulpmiddelen die een compensatie bieden voor beperkingen bij het uitvoeren van huishoudelijke taken;

      b. eenvoudige hulpmiddelen te gebruiken bij beperkingen bij het eten en drinken;

      c. aan functiebeperkingen aangepaste stoelen, waarbij de aanpassing uitsluitend een sta-opsysteem betreft;

      d. eenvoudige hulpmiddelen ter compensatie van beperkingen in het lopen.

      4 Voor ADL-honden geldt dat een tegemoetkoming kan worden verleend in de redelijk te achten gebruikskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel2.17
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.12
