      1 De eigen bijdrage voor zorg als bedoeld in [artikel 2.7, eerste lid, van het Besluit zorgverzekering][ref1],
      voor zover het gaat om zorg die niet rechtstreeks in verband staat met de indicatie voor bijzondere tandheelkundige
      hulp, bedraagt een bedrag ter grootte van het bedrag dat bij de desbetreffende verzekerde in rekening zou worden
      gebracht indien artikel 2.7, eerste lid, van het Besluit zorgverzekering niet van toepassing is.

      2 De eigen bijdrage bedraagt voor een uitneembare volledige prothetische voorziening, bedoeld in
      [artikel 2.7, vijfde lid, onderdeel b, van het Besluit zorgverzekering][ref2], vijfentwintig procent van de kosten
      van die voorziening.

      3 In afwijking van het tweede lid geldt voor een uitneembare volledige prothetische voorziening te plaatsen op
      tandheelkundige implantaten, een eigen bijdrage van:

      a. tien procent van de kosten van die voorziening, indien het gaat om een prothetische voorziening voor de
      onderkaak;

      b. acht procent van de kosten van die voorziening, indien het gaat om een prothetische voorziening voor de
      bovenkaak.

      4 De eigen bijdrage voor reparaties of overzetting van een uitneembare volledige prothetische voorziening bedraagt
      tien procent van de kosten van die reparatie of overzetting.


