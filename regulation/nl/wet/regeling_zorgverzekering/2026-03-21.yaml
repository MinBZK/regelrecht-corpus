  - number: 6.5.6
    text: |-
      1 Onverminderd [artikel 18d, tweede lid, onderdelen a, b en c, van de Zorgverzekeringswet][ref1] is de
      bestuursrechtelijke premie, bedoeld in artikel 18d, eerste lid, van die wet niet meer verschuldigd met ingang van
      de eerste dag van de maand volgende op de maand waarin de verzekeringnemer aan de volgende voorwaarden voldoet:

      a. de verzekeringnemer ontvangt algemene bijstand als bedoeld in [artikel 5 van de Participatiewet][ref2];

      b. de verzekeringnemer heeft gedurende een periode van ten minste twaalf aaneengesloten maanden algemene bijstand
      ontvangen of de schulden van de verzekeringnemer voortvloeiende uit de zorgverzekering bedragen in totaal minder
      dan € 600;

      c. de verzekeringnemer is verzekerd op basis van een modelovereenkomst als bedoeld in
      [artikel 18 van de Zorgverzekeringswet][ref3] die is aangewezen in een in dat artikel bedoelde overeenkomst die
      het college van burgemeester en wethouders heeft gesloten ten behoeve van of mede ten behoeve van ontvangers
      van algemene bijstand, tenzij de verzekeringnemer een zorgverzekering heeft bij een zorgverzekeraar die geen
      deel uitmaakt van een groep in de zin van [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref4] met de
      zorgverzekeraar waarmee de overeenkomst is gesloten;

      d. de verzekeringnemer heeft het verplicht eigen risico van de zorgverzekering verzekerd of zorgt voor gespreide
      dan wel tijdige betaling van het verplicht eigen risico;

      e. de verzekeringnemer heeft een zorgverzekering zonder vrijwillig eigen risico;

      f. de zorgverzekeraar heeft het bedrag van de schulden van de verzekeringnemer voortvloeiende uit de
      zorgverzekering dat eventueel resteert na afloop van de in onderdeel g bedoelde termijn, kwijtgescholden onder
      voorwaarde van de betalingen, bedoeld in onderdeel g, de toezegging, bedoeld in onderdeel h, en de betalingen,
      bedoeld in het tweede lid;

      g. onder gebruikmaking van de bevoegdheid die het college van burgemeester en wethouders heeft op grond van
      [artikel 57 van de Participatiewet][ref5] wordt in overeenstemming met de zorgverzekeraar of zorgverzekeraars
      gedurende maximaal 36 maanden de premie van de zorgverzekering en de aflossing van de schulden van de
      verzekeringnemer voortvloeiende uit de zorgverzekering of zorgverzekeringen ingehouden op de algemene bijstand van
      de verzekeringnemer en aan de zorgverzekeraar of zorgverzekeraars betaald;

      h. de verzekeringnemer zegt toe vanaf het moment dat geen algemene bijstand wordt verleend zorg te dragen voor
      voortzetting van de betalingen, bedoeld in onderdeel g;

      i. de verzekeringnemer stemt er mee in aan de voorwaarden, bedoeld onder c, d, e en h te
      blijven voldoen gedurende de periode, bedoeld onder g, onder voorbehoud van de toepassing van
      [artikel 18d, tweede lid, onderdelen b en c, van de Zorgverzekeringswet][ref6].

      2 De bestuursrechtelijke premie, bedoeld in [artikel 18d, eerste lid, van die wet][ref7] is wederom verschuldigd
      met ingang van de eerste dag van de maand volgende op de maand waarin niet meer wordt voldaan aan de voorwaarde,
      bedoeld in het eerste lid, onderdeel c, d, e of g, of waarin de verzekeringnemer waaraan geen algemene bijstand
      meer wordt verleend niet meer zorg draagt voor voortzetting van de betalingen, bedoeld in het eerste lid, onderdeel
      g.


