  - number: '5.7'
    text: |-
      1 Voor de toepassing van dit artikel en van [artikel 5.8][ref1] worden de landen van het Koninkrijk der Nederlanden
      aangemerkt als afzonderlijke mogendheden.

      2 Tot het loon, bedoeld in [artikel 42 van de Zorgverzekeringswet][ref2], of het bijdrage-inkomen, bedoeld in
      [artikel 43 van die wet][ref3], behoren niet:

      a. uitkeringen ingevolge de sociale-zekerheidswetgeving van een andere mogendheid die zijn onderworpen aan
      premieheffing krachtens een wettelijke regeling inzake ziektekosten van die andere mogendheid;

      b. ten aanzien van degene die verzekeringsplichtig is en die tevens werkzaamheden verricht of heeft verricht buiten
      het Europese deel van Nederland:

      1° het gedeelte van het loon of het bijdrage-inkomen dat onderworpen is aan heffing van inkomensafhankelijke premie
      als bedoeld in het [Besluit zorgverzekering BES][ref4],

      2° het gedeelte van het loon of het bijdrage-inkomen, waarop ingevolge een internationale regeling inzake sociale
      zekerheid die tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere
      mogendheid van toepassing is,

      3° het gedeelte van het loon of het bijdrage-inkomen, dat, bij gebreke van een internationale regeling, is
      onderworpen aan premieheffing krachtens een wettelijke regeling inzake ziektekosten van een andere mogendheid;

      c. ten aanzien van degene die niet is uitgezonderd van de volksverzekeringen op
      grond van [artikel 13, eerste lid, onderdeel a][ref5], artikel 13, tweede lid,
      onderdeel c, artikel 13, derde lid, onderdeel a, artikel 13, vierde lid, onderdeel c,
      [artikel 14, eerste lid, onderdeel a][ref6], [artikel 15, eerste lid, onderdeel c, sub 1°][ref7], of
      __REF003___________________________________________________________________________________________________________
      ____________ omdat zij de in die artikelen bedoelde andere werkzaamheden verrichten: het belastbare loon uit de
      dienstbetrekking uit hoofde waarvan hij zou zijn uitgezonderd van de volksverzekeringen indien hij die andere
      werkzaamheden niet zou hebben verricht.


