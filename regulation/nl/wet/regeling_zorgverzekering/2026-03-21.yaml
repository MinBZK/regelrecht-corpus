  - number: 6.5.7
    text: |-
      1 Onverminderd [artikel 18d, tweede lid, onderdelen a, b en c, van de Zorgverzekeringswet][ref1] is de
      bestuursrechtelijke premie, bedoeld in artikel 18d, eerste lid, van die wet niet meer verschuldigd met ingang van
      de eerste dag van de maand volgende op de maand waarin de verzekeringnemer aan de volgende voorwaarden voldoet:

      a. ten aanzien van de verzekeringnemer is een bewind als bedoeld in
      [artikel 431, eerste lid, onderdeel a of b, van Boek 1 van het Burgerlijk Wetboek][ref2] ingesteld;

      b. de verzekeringnemer heeft het verplicht eigen risico van de zorgverzekering verzekerd of zorgt voor gespreide
      dan wel tijdige betaling van het verplicht eigen risico;

      c. de verzekeringnemer heeft een zorgverzekering zonder vrijwillig eigen risico;

      d. de zorgverzekeraar heeft het bedrag van de schulden van de verzekeringnemer voortvloeiende uit de
      zorgverzekering dat eventueel resteert na afloop van de in onderdeel e bedoelde termijn, kwijtgescholden onder
      voorwaarde van de betalingen, bedoeld in onderdeel e, de toezegging, bedoeld in onderdeel f, en de betalingen,
      bedoeld in het tweede lid;

      e. onder gebruikmaking van zijn bevoegdheden op grond van [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref3]
      draagt de bewindvoerder er in overeenstemming met de zorgverzekeraar of zorgverzekeraars zorg voor dat gedurende
      maximaal 36 maanden de premie van de zorgverzekering en de aflossing van de schulden van de verzekeringnemer
      voortvloeiende uit de zorgverzekering of zorgverzekeringen aan de zorgverzekeraar of zorgverzekeraars worden
      betaald;

      f. de verzekeringnemer zegt toe vanaf het moment dat het bewind eindigt zorg te dragen voor voortzetting van de
      betalingen, bedoeld in onderdeel e;

      g. de bewindvoerder en de verzekeringnemer stemmen er mee in aan de voorwaarden, bedoeld onder b, c
      en f, te blijven voldoen gedurende de periode, bedoeld onder e, onder voorbehoud van de toepassing van
      [artikel 18d, tweede lid, onderdelen b en c, van de Zorgverzekeringswet][ref4].

      2 De bestuursrechtelijke premie, bedoeld in [artikel 18d, eerste lid, van die wet][ref5] is wederom verschuldigd
      met ingang van de eerste dag van de maand volgende op de maand waarin niet meer wordt voldaan aan de voorwaarde,
      bedoeld in het eerste lid, onderdeel b, c of f, of waarin het bewind is geëindigd niet meer zorg draagt voor
      voortzetting van de betalingen, bedoeld in het eerste lid, onderdeel e.


