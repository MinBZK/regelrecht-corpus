  - number: '5.1'
    text: |-
      1 Het in [artikel 42, eerste lid, onderdeel b, van de Zorgverzekeringswet][ref1] bedoelde tijdstip is de eerste
      dag van de kalendermaand volgende op de maand waarin de verzekeringsplichtige de pensioengerechtigde leeftijd,
      bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref2], heeft bereikt, met dien verstande
      dat dit tijdstip gelijk is aan de datum waarop een definitieve vaststelling van een bijstandsuitkering als
      bedoeld in [artikel 5, aanhef, en onder a, van de Participatiewet][ref3], of van een uitkering als bedoeld
      in de [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte werkloze werknemers][ref4] of de
      [Wet inkomensvoorziening oudere en gedeeltelijk arbeidsongeschikte gewezen zelfstandigen][ref5] plaatsvindt, indien
      dat tijdstip later ligt dan eerstbedoeld tijdstip.

      2 De in [artikel 42, eerste lid, onderdeel b, van de Zorgverzekeringswet][ref6] bedoelde bestanddelen van het loon
      zijn:

      a. uitkeringen ingevolge een pensioenregeling of regeling voor vervroegde uittreding als bedoeld in de
      [Wet op de loonbelasting 1964][ref7], niet zijnde een uitkering ingevolge een regeling voor vervroegde
      uittreding die vóór 1 januari 2006 is ingegaan en op grond waarvan de uitkeringsgerechtigde ingevolge
      [artikel 1, onderdeel g, van het Aanwijzingsbesluit verzekerden Zfw][ref8] verzekerd was ingevolge de
      [Ziekenfondswet][ref9];

      b. uitkeringen of pensioenen krachtens of vanwege een pensioenregeling als bedoeld in
      [artikel 2, eerste lid, onder c en d, van de Toeslagwet Indonesische Pensioenen 1956][ref10], het
      Pensioenreglement Nederlands Nieuw Guinea (Gouvernementsblad van Nederlands Nieuw Guinea 1958, 83), de
      Wet aanpassing Pensioenvoorziening Bijstandskorps, de [Garantiewet Surinaamse Pensioenen][ref11] of de
      [Toeslagregeling pensioenen Suriname en Nederlandse Antillen][ref12];

      c. uitkeringen en verstrekkingen ingevolge een aanspraak of daarmee gelijkgesteld bedrag als bedoeld in
      [artikel 39f van de Wet op de loonbelasting 1964][ref13];

      d. inkomsten als bedoeld in
      [artikel 11, eerste lid, onderdelen a, d, f, i, j, k, l, of v van het Uitvoeringsbesluit loonbelasting 1965][ref14]
      ;

      e. uitkeringen ingevolge de [Algemene Ouderdomswet][ref15];

      f. uitkeringen als bedoeld in [artikel 47a van de Participatiewet][ref16];

      g. overbruggingsuitkeringen ingevolge een aanspraak op het overbruggingsfonds van de Stichting Contractspelersfonds
      KNVB en de Stichting Nederlands Wielrennersfonds, en

      h. uitkeringen ingevolge de derde afdeling van de [Algemene pensioenwet politieke ambtsdragers][ref17] die worden
      ontvangen door een afgetreden lid van de Tweede Kamer van wie de arbeidsverhouding gedurende het lidmaatschap van
      de Tweede Kamer ingevolge [artikel 4, aanhef en onderdeel f, van de Wet op de loonbelasting 1964][ref18] voor de
      toepassing van die wet als dienstbetrekking werd beschouwd.


