      1 De zorgverzekeraar neemt in ieder geval in zijn uitvoeringsverslag op:

      a. het profiel, de organisatiestructuur en het gevoerde en voorgenomen beleid bij de uitvoering van de
      [Zorgverzekeringswet][ref1];

      b. de wijze waarop hij uitvoering geeft aan de zorgplicht;

      c. de wijze waarop hij uitvoering geeft aan de acceptatieplicht en het verbod op premiedifferentiatie;

      d. de wijze waarop hij de afhandeling van klachten van de verzekerden heeft georganiseerd alsmede de resultaten
      daarvan;

      e. de wijze waarop hij uitvoering geeft aan gedragscodes waaraan hij zich heeft verbonden;

      f. of hij het Protocol incassotraject wanbetalers [Zorgverzekeringswet][ref2] is nagekomen, en zo nee, welke
      onderdelen niet, waarom niet, en wat hij in de plaats van die onderdelen aan incassowerkzaamheden heeft verricht;

      g. algemene gegevens over de honorering van directie en bestuur van de zorgverzekeraar voor de uitvoering van de
      [Zorgverzekeringswet][ref3]

      h. gegevens over zijn relaties met aanbieder van zorg en de wijze waarop hij stuurt op de kwaliteit van door hen
      geleverde zorg.

      2 Het uitvoeringsverslag wordt, voor zover het gaat om de in het vorige lid genoemde aspecten, ingericht
      overeenkomstig een door de zorgautoriteit beschikbaar te stellen model.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450
