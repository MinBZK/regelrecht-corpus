      de voorwaarden waaronder en de termijn gedurende welke de farmaceutische zorg, bedoeld in de aanhef van
      [artikel 2.8, eerste lid, van het Besluit zorgverzekering][ref1] de geneesmiddelen, bedoeld in het eerste lid,
      onderdeel b, omvat.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.5.3
