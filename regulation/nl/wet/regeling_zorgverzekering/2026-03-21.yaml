  - number: 5.8.1
    text: |-
      Ten aanzien van degene die gedurende een deel van het kalenderjaar niet verzekeringsplichtig is ingevolge de
      [Zorgverzekeringswet][ref1], wordt voor de bijdrageheffing bij wege van aanslag als bijdrage-inkomen geen hoger
      bedrag in aanmerking genomen dan het bijdrage-inkomen verminderd met het gedeelte daarvan waarop, ingevolge een
      internationale regeling inzake sociale zekerheid die tussen Nederland en een of meer andere mogendheden van kracht
      is, de wetgeving van een andere mogendheid van toepassing is, of dat, bij gebreke van een internationale regeling,
      is onderworpen aan premieheffing krachtens een wettelijke regeling inzake ziektekosten van een andere mogendheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 5.8.2
    text: |-
      Ten aanzien van degene die gedurende een deel van het kalenderjaar anders dan door overlijden niet
      verzekeringsplichtig is ingevolge de [Zorgverzekeringwet][ref1], wordt voor de bijdrageheffing als bijdrage-inkomen
      ten hoogste in aanmerking genomen het bedrag dat naar tijdsevenredigheid is afgeleid van het bedrag, bedoeld in
      [artikel 5.3][ref2], tenzij toepassing van de bepalingen in de Zorgverzekeringswet of van de overige bepalingen in
      deze regeling tot een lager bijdrage-inkomen leidt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel5
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.8
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '5'
        hoofdstuk: '5'
  - number: '5.9'
    text: |-
      Indien voor de heffing van de inkomensafhankelijke bijdrage bij wege van aanslag het bijdrage-inkomen wordt bepaald
      door middel van tijdsevenredige vaststelling, wordt daarbij:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.9
  - number: 5.9.a
    text: een kalenderjaar op 360 dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.9
  - number: 5.9.b
    text: een kalendermaand op 30 dagen gesteld;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.9
  - number: 5.9.c
    text: de dag waarop het tijdvak aanvangt, als een gehele dag in aanmerking genomen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.9
  - number: 5.9.d
    text: de dag waarop het tijdvak eindigt, niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.9
  - number: 5.11.1
    text: |-
      De ontvangsten per bijdragejaar van de combineerde heffing van de loonbelasting, de premies voor de sociale
      verzekeringen en de bijdrage voor de Zorgverzekeringswet alsmede de daarop betrekking hebbende belasting- en
      invorderingsrente en boeteontvangsten worden uitgesplitst in een voor de afdracht vastgesteld verdeelpercentage
      per bijdragejaar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.11
  - number: 5.11.2
    text: |-
      Het verdeelpercentage in het eerste lid wordt maandelijks per bijdragejaar opnieuw berekend op basis van het
      relatieve aandeel van de bijdragen [Zorgverzekeringswet][ref1] in alle ontvangen collectieve aangiften en opgelegde
      naheffingen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 5.11.3
    text: |-
      Alle ontvangen gelden over het bijdragejaar worden verdeeld op basis van het verdeelpercentage, bedoeld in het
      eerste lid. De mutatie ten opzichte van de vorige periode vormt het af te dragen bedrag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.11
  - number: 5.11.4
    text: |-
      In het tweede jaar na afloop’ van het bijdragejaar wordt het verdeelpercentage voor het betreffende bijdragejaar
      definitief vastgesteld. Dit percentage wordt gehanteerd voor alle betalingen die daarna binnenkomen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.11
  - number: 5.11.5
    text: |-
      In geval van bijzondere omstandigheden kan de Minister van Financiën, op verzoek van de rijksbelastingdienst,
      besluiten om de termijn, bedoeld in het vierde lid, te verlengen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.11
  - number: 5.12.1
    text: |-
      De ontvangsten van de overige inkomensafhankelijke bijdragen overeenkomstig
      [artikel 49, derde lid, van de Zorgverzekeringswet][ref1] worden maandelijks vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel49
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '49'
  - number: 5.12.2
    text: |-
      De onder het eerste lid genoemde ontvangsten zijn inclusief de eventuele belasting- en invorderingsrente en
      boeteontvangsten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.12
  - number: 5.13.1
    text: |-
      De inspecteur verleent vooruitlopend op een beschikking als bedoeld in
      [artikel 50, eerste lid, van de Zorgverzekeringswet][ref1] een voorschot indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel50
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '50'
  - number: 5.13.1.a
    text: het bedrag van de teveel betaalde bijdrage vermoedelijk ten minste € 100 zal bedragen, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
  - number: 5.13.1.b
    text: |-
      het bijdrage-inkomen waarover inkomensafhankelijke bijdrage wordt of is ingehouden afkomstig is van verschillende
      inhoudingsplichtigen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
  - number: 5.13.2
    text: 'Het eerste lid is niet van toepassing met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
  - number: 5.13.2.a
    text: |-
      personen die op grond van [artikel 2, tweede lid, onderdeel b, van de Zorgverzekeringswet][ref1] niet
      verzekeringsplichtig zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
  - number: 5.13.2.b
    text: |-
      personen die voor 1 april van het kalenderjaar waarop het voorschot betrekking heeft, aangeven geen voorschot te
      willen ontvangen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
  - number: 5.13.3
    text: |-
      De inspecteur kan het voorschot al dan niet op verzoek herzien. Een verzoek tot herziening van het voorschot kan
      worden ingediend tot 1 december van het kalenderjaar waarop het voorschot betrekking heeft.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
  - number: 5.13.4
    text: |-
      Indien de inspecteur een verzoek om verlening dan wel herziening van een voorschot geheel of gedeeltelijk afwijst,
      gebeurt dit bij voor bezwaar vatbare beschikking.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
  - number: 5.13.5
    text: |-
      Voorschotten worden verrekend met de beschikking, bedoeld in
      [artikel 50, eerste lid, van de Zorgverzekeringswet][ref1], dan wel – voor zoveel nodig – bij een door de
      inspecteur te nemen voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel50
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.13
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '50'
  - number: 6.2.1
    text: |-
      In [paragraaf 2][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0018715
        hoofdstuk: '6'
        paragraaf: '2'
  - number: 6.2.1.a
    text: '*subsidiejaar:* kalenderjaar ten behoeve waarvan de subsidie wordt verstrekt;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
  - number: 6.2.1.b
    text: |-
      *interventie:* kortdurende en doelgerichte behandeling die langs elektronische weg wordt verleend aan een anonieme
      persoon waarvan voor aanvang van de behandeling is vastgesteld dat deze daarvoor in aanmerking komt;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
  - number: 6.2.1.c
    text: '*volledige interventie:* interventie die in het subsidiejaar is aangevangen en voltooid;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
  - number: 6.2.1.d
    text: |-
      *onvolledige interventie:* interventie die: - in het subsidiejaar is aanvangen en niet is voltooid of
        - in het jaar voorafgaand aan het subsidiejaar is aangevangen en in het subsidiejaar is voltooid;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
  - number: 6.2.1.e
    text: |-
      *organisatie:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid of rechtspersoon die krachtens
      publiekrecht is ingesteld;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
  - number: 6.2.1.f
    text: |-
      *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 6.2.1.g
    text: |-
      *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel361
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.1
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '361'
  - number: 6.2.2.1
    text: |-
      Het Zorginstituut kan aan een organisatie een subsidie verstrekken voor het door middel van interventies verlenen
      van geneeskundige geestelijke gezondheidszorg zoals huisartsen en klinisch-psychologen plegen te bieden, niet
      zijnde gespecialiseerde geestelijke gezondheidszorg, aan personen met een lichte tot matig ernstige, niet
      chronische psychische problematiek, inclusief de daarbij behorende diagnostiek of toegeleiding naar die zorg.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.2.2
    text: De subsidie kan voor meerdere soorten interventies worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.2.3
    text: 'De subsidie wordt uitsluitend verstrekt:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.2.3.a
    text: voor interventies die voldoen aan de stand van de wetenschap en de praktijk;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.2.3.b
    text: ten behoeve van personen die om psychische redenen noodzakelijkerwijs anoniem zijn;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.2.3.c
    text: |-
      voor interventies die uitgevoerd worden onder verantwoordelijkheid van een persoon die is ingeschreven in een
      register als bedoeld in de [Wet op de beroepen in de individuele gezondheidszorg][ref1] voor een beroep dat
      relevant is voor de interventie;


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 6.2.2.3.d
    text: aan organisaties voor geneeskundige geestelijke gezondheidszorg of verslavingszorg;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.2.3.e
    text: |-
      voor het soort interventies dat reeds gedurende het laatste kwartaal van het jaar voorafgaand aan het subsidiejaar
      door de organisatie werden verleend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.2.4
    text: Geen subsidie wordt verstrekt voor het vaststellen of een persoon in aanmerking komt voor een interventie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
  - number: 6.2.3
    text: De subsidie wordt per kalenderjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.3
  - number: 6.2.4.1
    text: De te verlenen subsidie bedraagt per organisatie niet minder dan € 74.000 en niet meer dan € 1.042.000.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.4
  - number: 6.2.4.2
    text: Een aanvraag van minder dan € 74.000 wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.4
  - number: 6.2.4.3
    text: Op een aanvraag van meer dan € 1.042.000 kan ten hoogste een subsidie van € 1.042.000 worden verleend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.4
  - number: 6.2.4.4
    text: De subsidie bedraagt maximaal € 464 per volledige interventie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.4
  - number: 6.2.4.5
    text: |-
      De subsidie voor een onvolledige interventie bedraagt de helft van de subsidie voor een volledige interventie van
      dezelfde soort.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.4
  - number: 6.2.5.1
    text: Het subsidieplafond voor het verstrekken van subsidie bedraagt over het kalenderjaar 2025 € 4.576.000.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.5
  - number: 6.2.5.2
    text: |-
      Indien het totaal van de te verlenen subsidiebedragen hoger is dan het subsidieplafond verdeelt het Zorginstituut
      het ingevolge het subsidieplafond beschikbare bedrag evenredig over de ingediende aanvragen voor zover deze voor
      subsidie in aanmerking komen met dien verstande dat deze verdeling niet leidt tot een verlening van minder dan
      € 74.000.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.5
  - number: 6.2.6.1
    text: Voor een aanvraag tot verlening van subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.6
  - number: 6.2.6.2
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.6
  - number: 6.2.7.1
    text: |-
      Een aanvraag tot verlening van subsidie wordt ontvangen uiterlijk dertien weken voor de aanvang van het jaar
      waarvoor de subsidie wordt aangevraagd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.7
  - number: 6.2.7.2
    text: Een aanvraag die na de termijn, bedoeld in het eerste lid, wordt ontvangen, wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.7
  - number: 6.2.8.1
    text: |-
      Bij de aanvraag tot verlening van de subsidie worden per soort interventie waarvoor de subsidie wordt aangevraagd
      de volgende gegevens verstrekt:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.1.a
    text: een omschrijving van de interventie en de doelstelling daarvan;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.1.b
    text: een onderbouwde opgave van het aantal volledige en onvolledige interventies;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.1.c
    text: een onderbouwde opgave van de kosten per interventie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.2
    text: |-
      Bij de aanvraag tot verlening van de subsidie worden voorts de volgende gegevens verstrekt, waarbij indien nodig
      onderscheid wordt gemaakt naar soort interventie waarvoor de subsidie wordt aangevraagd:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.2.a
    text: |-
      de wijze waarop de aanvrager vaststelt dat de interventie wordt verleend aan een persoon die om psychische redenen
      noodzakelijkerwijs anoniem is;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.2.b
    text: de wijze waarop de aanvrager de anonimiteit waarborgt van de persoon waaraan de interventie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.2.c
    text: het beleid van de aanvrager ter beveiliging van de gegevensverwerking met betrekking tot de interventies;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
  - number: 6.2.8.2.d
    text: |-
      de inschrijving in een register als bedoeld in de [Wet op de beroepen in de individuele gezondheidszorg][ref1] van
      de beroepsbeoefenaar of beroepsbeoefenaren onder wiens verantwoordelijkheid de interventies verleend worden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 6.2.9.1
    text: 'De aanvraag tot verlening van de subsidie gaat vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.9
  - number: 6.2.9.1.a
    text: |-
      een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.9
  - number: 6.2.9.1.b
    text: |-
      een afschrift van de volmacht voor het ondertekenen van de aanvraag, indien de aanvraag is ondertekend door een of
      meer andere personen dan de personen die op grond van de statuten bevoegd zijn de aanvrager te vertegenwoordigen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.9
  - number: 6.2.9.1.c
    text: een afschrift van de inschrijving van de aanvrager in het Handelsregister.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.9
  - number: 6.2.9.2
    text: |-
      De stukken, bedoeld in het eerste lid, onderdelen a en c, kunnen achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit mag gaan dat deze gegevens bij het Zorginstituut bekend zijn.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.9
  - number: 6.2.9.3
    text: |-
      Op verzoek van het Zorginstituut overlegt de aanvrager de laatst opgemaakte jaarrekening of, indien deze ontbreekt,
      een verslag over de financiële positie van de aanvrager op het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.9
  - number: 6.2.10.1
    text: |-
      Indien de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag of indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of
      de voorbereiding van de beschikking stelt het Zorginstituut de subsidieaanvrager in de gelegenheid de aanvraag tot
      verlening van de subsidie binnen drie weken aan te vullen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.10
  - number: 6.2.10.2
    text: |-
      Het Zorginstituut besluit de aanvraag niet in behandeling te nemen indien de aanvraag niet of niet voldoende is
      aangevuld binnen de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.10
  - number: 6.2.11
    text: |-
      Het Zorginstituut besluit voor de aanvang van het kalenderjaar waarvoor de subsidie wordt aangevraagd over de
      verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.11
  - number: 6.2.12
    text: 'Het Zorginstituut vermeldt in het besluit tot verlening van de subsidie in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.12
  - number: 6.2.12.a
    text: het maximumbedrag dat aan subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.12
  - number: 6.2.12.b
    text: het bedrag dat per soort interventie voor een volledige interventie aan subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.12
  - number: 6.2.13
    text: Het Zorginstituut kan bij het besluit tot subsidieverlening ambtshalve voorschotten verlenen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.13
  - number: 6.2.14
    text: 'De subsidieontvanger zorgt ervoor dat:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.14
  - number: 6.2.14.a
    text: de doelstellingen van de gesubsidieerde interventies op doelmatige wijze worden nagestreefd;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.14
  - number: 6.2.14.b
    text: de gesubsidieerde interventies op verantwoorde wijze worden uitgevoerd;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.14
  - number: 6.2.14.c
    text: de voor de uitvoering van de gesubsidieerde interventies benodigde middelen op verantwoorde wijze worden beheerd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.14
  - number: 6.2.15.1
    text: |-
      De subsidieontvanger houdt een zodanig ingerichte administratie bij dat daarin altijd kan worden nagegaan het
      aantal gerealiseerde volledige en onvolledige interventies, onderscheiden naar soort interventie, alsmede de voor
      de vaststelling van de subsidie van belang zijnde rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.15
  - number: 6.2.15.2
    text: De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.15
  - number: 6.2.15.3
    text: |-
      De administratie en de daartoe behorende bescheiden worden gedurende tien jaren na de vaststelling van de subsidie
      bewaard.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.15
  - number: 6.2.16.1
    text: 'De subsidieontvanger meldt meteen aan het Zorginstituut indien:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.16
  - number: 6.2.16.1.a
    text: |-
      het aannemelijk is geworden dat de interventies waarvoor de subsidie is verleend niet, niet tijdig of niet geheel
      zullen worden verricht,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.16
  - number: 6.2.16.1.b
    text: het aannemelijk is geworden dat niet of niet geheel aan de subsidieverplichtingen zal worden voldaan, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.16
  - number: 6.2.16.1.c
    text: |-
      zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.16
  - number: 6.2.16.2
    text: De melding wordt schriftelijk gedaan en voorzien van een toelichting.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.16
  - number: 6.2.16.3
    text: Bij de melding worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.16
  - number: 6.2.17.1
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens het Zorginstituut ingesteld onderzoek dat erop is gericht het Zorginstituut
      inlichtingen te verschaffen die van belang zijn voor het nemen van een besluit over het verstrekken van de
      subsidie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.17
  - number: 6.2.17.2
    text: |-
      De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen te
      verschaffen die van belang zijn voor de ontwikkeling van het beleid van de minister.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.17
  - number: 6.2.17.3
    text: De subsidieontvanger verplicht zijn accountant tot medewerking aan het onderzoek.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.17
  - number: 6.2.18.1
    text: Voor een aanvraag tot vaststelling van de subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.18
  - number: 6.2.18.2
    text: Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.18
  - number: 6.2.19.1
    text: |-
      De subsidieontvanger dient binnen tweeëntwintig weken na afloop van het subsidiejaar een aanvraag in tot
      vaststelling van de subsidie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.19
  - number: 6.2.19.2
    text: Het Zorginstituut kan ontheffing verlenen van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.19
  - number: 6.2.20.1
    text: |-
      De subsidieontvanger doet in de aanvraag tot vaststelling van de subsidie per soort interventie opgave van het
      aantal volledige en onvolledige interventies dat in het subsidiejaar is gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.20
  - number: 6.2.20.2
    text: |-
      De subsidieontvanger toont in de aanvraag tot vaststelling aan dat is voldaan aan de aan de verleende subsidie
      verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.20
  - number: 6.2.21.1
    text: |-
      Indien de subsidie € 125.000 of meer bedraagt, legt de subsidieontvanger tevens verantwoording af door het
      overleggen van een assurancerapport.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.21
  - number: 6.2.21.2
    text: |-
      Het assurancerapport is opgesteld door een accountant overeenkomstig een door het Zorginstituut vastgesteld model
      met inachtneming van een door het Zorginstituut vastgesteld accountantsprotocol.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.21
  - number: 6.2.22.1
    text: |-
      De subsidie wordt vastgesteld op basis van het aantal volledige en onvolledige interventies dat in het subsidiejaar
      is gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.22
  - number: 6.2.22.2
    text: |-
      De subsidie bedraagt per gerealiseerde volledige interventie het bedrag waarvan de hoogte bij de verlening voor dat
      soort interventies is genoemd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.22
  - number: 6.2.22.3
    text: |-
      De subsidie bedraagt per gerealiseerde onvolledige interventie de helft van het bedrag waarvan de hoogte bij de
      verlening voor dat soort interventies is genoemd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.22
  - number: 6.2.22.4
    text: |-
      Indien het bedrag van de subsidie berekend overeenkomstig de voorgaande leden minder is dan € 50.000, wordt de
      subsidie op nihil vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.22
  - number: 6.2.22.5
    text: De subsidie bedraagt niet meer dan het maximumbedrag dat aan subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.22
  - number: 6.2.23
    text: |-
      Binnen tweeëntwintig weken na ontvangst van de aanvraag tot vaststelling van de subsidie neemt het Zorginstituut
      een besluit op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.23
  - number: 6.3.1.1
    text: |-
      De door een persoon als bedoeld in [artikel 69, eerste, vijftiende of zestiende lid, van de Zorgverzekeringwet][ref1]
      verschuldigde bijdrage wordt berekend door de grondslag van de bijdrage te vermenigvuldigen met het getal dat
      wordt berekend uit de verhouding tussen de gemiddelde uitgaven voor zorg voor een persoon ten laste van de sociale
      zorgverzekering in het woonland van deze persoon, en de gemiddelde uitgaven voor zorg voor een persoon uit hoofde
      van de [Zorgverzekeringswet][ref2] en de [Wet langdurige zorg][ref3] in Nederland.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0018450
      [ref3]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0018450
      - id: ref3
        bwb_id: BWBR0035917
  - number: 6.3.1.2
    text: 'De grondslag van de bijdrage is gelijk aan de som van:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
  - number: 6.3.1.2.a
    text: |-
      een inkomensafhankelijke bijdrage ter hoogte van de inkomensafhankelijke bijdrage die de persoon, bedoeld in het
      eerste lid, op grond van [paragraaf 5.2 van de Zorgverzekeringswet][ref1] verschuldigd zou zijn geweest indien hij
      verzekeringsplichtig zou zijn geweest,


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Paragraaf5.2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        paragraaf: '5.2'
  - number: 6.3.1.2.b
    text: |-
      een inkomensafhankelijke bijdrage, berekend overeenkomstig de op grond van de
      [Wet financiering sociale verzekeringen][ref1] verschuldigde premie voor de [Wet langdurige zorg][ref2],
      en verminderd met het bedrag waarop de partner van degene die de bijdrage verschuldigd is volgens de
      [artikelen 8.9][ref3] en [8.9a van de Wet inkomstenbelasting 2001][ref4] recht zou hebben indien degene die de
      bijdrage verschuldigd is verzekerd zou zijn ingevolge de [Wet langdurige zorg][ref5], voor zover op grond van deze
      bepalingen geen teruggave in de inkomstenbelasting is verleend, en,


      [ref1]: https://wetten.overheid.nl/BWBR0017745
      [ref2]: https://wetten.overheid.nl/BWBR0035917
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0011353#Artikel8
      [ref5]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0017745
      - id: ref2
        bwb_id: BWBR0035917
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0011353
        artikel: '8'
      - id: ref5
        bwb_id: BWBR0035917
  - number: 6.3.1.2.c
    text: |-
      vanaf de eerste dag van de kalendermaand volgende op de kalendermaand waarin deze persoon de leeftijd van
      achttien jaar heeft bereikt, een bijdrage per maand overeenkomende met eentwaalfde van het bedrag van de
      geraamde gemiddelde premie voor een verzekerde voor een zorgverzekering in het berekeningsjaar, bedoeld in
      [artikel 4 van de Wet op de zorgtoeslag][ref1] (hierna: nominale deel).


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '4'
  - number: 6.3.1.3
    text: |-
      De peildatum voor de vaststelling van het in het eerste lid genoemde woonland is telkens de eerste dag van de
      kalendermaand volgende op de kalendermaand waarin een wijziging van het woonland heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
  - number: 6.3.1.4
    text: |-
      Voor de toepassing van de [Wet op de zorgtoeslag][ref1] wordt het in het tweede lid bedoelde nominale deel, als
      premie voor een zorgverzekering beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0018451
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018451
  - number: 6.3.1.5
    text: |-
      De bijdrage die een pensioen- of renteverstrekkend orgaan als bedoeld in
      [artikel 69, zesde lid, van de Zorgverzekeringswet][ref1] verschuldigd is, is gelijk aan de inkomensafhankelijke
      bijdrage die dit orgaan over het loon als bedoeld in [artikel 42 van die wet][ref2] verschuldigd zou zijn geweest,
      indien degene aan wie hij het pensioen of de rente verstrekt, in Nederland zou hebben gewoond, vermenigvuldigd met
      het getal, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel42
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '42'
  - number: 6.3.1.6
    text: |-
      De inkomensgegevens, benodigd voor de berekening van de in het tweede lid bedoelde grondslag
      en de in het vijfde lid bedoelde bijdrage, worden ontleend aan het toetsingsinkomen, bedoeld in
      [artikel 8, eerste en tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
  - number: 6.3.1.7
    text: |-
      Indien het in [artikel 8, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref1]
      bedoelde, niet in Nederland belastbaar inkomen niet is vastgesteld op grond van
      [artikel 8a van de Algemene wet inkomensafhankelijke regelingen][ref2], wordt het door de rijksbelastingdienst
      vastgesteld met overeenkomstige toepassing van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0018472#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018472#Artikel8a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018472
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018472
        artikel: 8a
  - number: 6.3.1.8
    text: |-
      Ter zake van de opgaaf van niet in Nederland belastbaar inkomen is de [Algemene wet inzake rijksbelastingen][ref1],
      met uitzondering van [Hoofdstuk VIIIA][ref2], van toepassing als ware deze opgaaf een aangifte inkomstenbelasting.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0002320#HoofdstukVIIIA
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0002320
        hoofdstuk: VIIIA
  - number: 6.3.1.9
    text: |-
      Het verhoudingsgetal, bedoeld in het eerste lid, wordt per land genoemd in [bijlage 4][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018715
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1
    references:
      - id: ref1
        bwb_id: BWBR0018715
  - number: 6.3.1a
    text: |-
      In de [artikelen 6.3.2 tot en met 6.3.4][ref1] wordt verstaan onder:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1a
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.3.1a.a
    text: |-
      *bijdrageplichtige:* eenieder die krachtens [artikel 69 van de Zorgverzekeringswet][ref1] in verbinding met
      [artikel 6.3.1][ref2] een bijdrage verschuldigd is,


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.3.1a.b
    text: |-
      *hoofdbijdrageplichtige:* een bijdrageplichtige met een of meer gezinsleden die niet bijdrageplichtig zouden zijn
      geweest indien zij niet tot het gezin van de hoofdbijdrageplichtige zouden hebben behoord,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1a
  - number: 6.3.1a.c
    text: |-
      *gezinslid:* een tot het gezin van een hoofdbijdrageplichtige of een verzekeringsplichtige behorend gezinslid
      dat niet bijdrageplichtig zou zijn geweest indien hij niet tot het gezin van de hoofdbijdrageplichtige of een
      verzekeringsplichtige zou hebben behoord.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1a
  - number: 6.3.1b
    text: |-
      De voor een gezinslid van een verzekeringsplichtige verschuldigde bijdrage, bedoeld in [artikel 6.3.1][ref1], wordt
      door het CAK geheven en geïnd bij de verzekeringsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.1b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.3.2.1
    text: |-
      Organen die pensioen of rente uitkeren dan wel werkgevers, verrichten de hen door het CAK opgedragen
      werkzaamheden ter voorbereiding en uitvoering van de heffings- en inningsbeschikkingen, bedoeld in
      [artikel 69, zevende lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '69'
  - number: 6.3.2.2
    text: |-
      De werkzaamheden, bedoeld in het eerste lid, houden ten minste in dat, nadat zij daartoe door het CAK van de
      benodigde gegevens zijn voorzien:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
  - number: 6.3.2.2.a
    text: |-
      organen die pensioen of rente uitkeren bijdragen die bijdrageplichtige personen verschuldigd zijn op het pensioen
      of de rente van die bijdrageplichtigen inhouden,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
  - number: 6.3.2.2.b
    text: |-
      organen die pensioen of rente aan een hoofdbijdrageplichtige uitkeren de bijdrage die diens gezinsleden
      verschuldigd zijn op het pensioen of de rente van die hoofdbijdrageplichtige inhouden, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
  - number: 6.3.2.2.c
    text: |-
      werkgevers van grensarbeiders de bijdragen van gezinsleden van die grensarbeiders op het loon van de grensarbeider
      inhouden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
  - number: 6.3.2.3
    text: |-
      Het CAK kan een orgaan dat pensioen of rente uitkeert of een werkgever van een grensarbeider opdragen een bijdrage
      op het pensioen, de rente of op het loon in te houden en af te dragen, zolang het CAK niet beschikt over de
      gegevens, bedoeld in het tweede lid. In dat geval berekent het orgaan of de werkgever de bijdrage uitgaande van de
      bij hem bekende gegevens over de samenstelling van het gezin van de bijdrageplichtige.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
  - number: 6.3.2.4
    text: |-
      Indien een bijdrageplichtige recht heeft op meer dan één pensioen of rente, wordt het in
      [artikel 6.3.1, tweede lid][ref1], bedoelde nominale deel van de bijdrage dat hij en zijn eventuele gezinsleden
      verschuldigd zijn ingehouden op het pensioen dat of de rente die het eerst is toegekend. Indien dit pensioen of
      deze rente daartoe niet toereikend is, kan het CAK hetzelfde of een ander orgaan opdragen het restant op een ander
      pensioen of een andere rente in te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.3.2.5
    text: |-
      Voor de inhouding van het door een gezinslid verschuldigde nominale deel van de bijdrage op het pensioen of de
      rente van de hoofdbijdrageplichtige dan wel op het loon van de grensarbeider, worden wijzigingen in de situatie
      van dat gezinslid die in de loop van een kalendermaand doch na de eerste dag van die maand plaatsvinden, eerst in
      aanmerking genomen vanaf de eerste dag van de daaropvolgende kalendermaand.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
  - number: 6.3.2.6
    text: |-
      Voor de toepassing van het tweede lid wordt een toeslag, waaronder begrepen een toeslag als bedoeld in de
      [Toeslagenwet][ref1], een toelage of enige aanvulling, onder welke benaming ook, op het pensioen of de rente dan
      wel op het loon van een grensarbeider die door het orgaan of de werkgever in het algemeen met dezelfde regelmaat
      en gelijktijdig met de uitkering betaalbaar wordt gesteld, als onderdeel van het pensioen, van de rente of van het
      loon aangemerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0004043
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0004043
  - number: 6.3.2.7
    text: |-
      Onder de in het eerste lid bedoelde organen die pensioen of rente uitkeren worden mede verstaan werkgevers aan wie
      op grond van [artikel 40 van de Wet financiering sociale verzekeringen][ref1] toestemming is verleend het risico te
      dragen van de betalingen, bedoeld in [artikel 40, eerste lid, van die wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0017745#Artikel40
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '40'
      - id: ref2
        bwb_id: BWBR0017745
        artikel: '40'
  - number: 6.3.3.1
    text: |-
      Het verschil tussen de door de bijdrageplichtigen verschuldigde bijdrage en de
      ingehouden en afgedragen of anderszins geïnde bijdragen wordt, met inachtneming van het
      [zesde tot en met het achtste lid van artikel 6.3.1][ref1] en het tweede lid van dit artikel, door het CAK
      vastgesteld en verrekend, geïnd of uitgekeerd. Uitkering vindt plaats aan de bijdrageplichtige dan wel, indien
      [artikel 6.3.1b][ref2] van toepassing is, aan de verzekeringsplichtige.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.3.3.2
    text: |-
      De in [artikel 6.3.1, eerste lid][ref1], bedoelde persoon die aanspraak maakt op één of meer van de in
      [hoofdstuk 8 van de Wet inkomstenbelasting 2001][ref2] vermelde heffingskortingen niet zijnde de algemene
      heffingskorting, de jonggehandicaptenkorting, de ouderenkorting of de alleenstaande ouderenkorting, kan het CAK
      verzoeken daar bij de vaststelling van het verschil, bedoeld in het eerste lid, rekening mee te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0011353
        hoofdstuk: '8'
  - number: 6.3.3.3
    text: |-
      Indien slechts een bijdrage als bedoeld in [artikel 6.3.1, tweede lid, onderdeel c][ref1], verschuldigd is, stelt
      het CAK het in het eerste lid bedoelde verschil vast vóór 1 april van het jaar volgend op het kalenderjaar waarop
      de bijdrage betrekking heeft. In andere gevallen stelt het CAK het verschil voor 30 september van het jaar volgend
      op kalenderjaar waarop de bijdrage betrekking heeft voorlopig vast, en stelt het het verschil uiterlijk zes maanden
      na het tijdstip waarop zowel de aanslag inkomstenbelasting als de beschikking niet in Nederland belastbaar inkomen
      onherroepelijk zijn geworden, definitief vast.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.3
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 6.3.3.4
    text: |-
      Bij de vaststelling van het in het eerste lid bedoelde verschil brengt het CAK enkelvoudige wettelijke rente in
      rekening over te weinig geheven of geïnde bijdrage dan wel vergoedt het wettelijke rente ingeval van teveel geheven
      of geïnde bijdrage, over het tijdvak dat aanvangt op de dag na het einde van het kalenderjaar waarop de bijdrage
      betrekking heeft en eindigt op de dag van de dagtekening van de vaststelling door het CAK.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.3
  - number: 6.3.3.5
    text: Het CAK is bevoegd het te restitueren bedrag te verrekenen met een verschuldigde bijdrage.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3.3
  - number: 6.3a.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *betrokkene:* persoon als bedoeld in
      [artikel 68b, eerste lid, van de Zorgverzekeringswet][ref1];
        - *bijdrage:* bijdrage als bedoeld in [artikel 68b, vijfde lid, van de Zorgverzekeringswet][ref2];
        - *periode:* periode als bedoeld in [artikel 68b, tweede lid, van de Zorgverzekeringswet][ref3];
        - *vergoeding:* vergoeding als bedoeld in [artikel 68b, eerste lid, van de Zorgverzekeringswet][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel68b
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel68b
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel68b
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel68b
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 68b
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 68b
      - id: ref3
        bwb_id: BWBR0018450
        artikel: 68b
      - id: ref4
        bwb_id: BWBR0018450
        artikel: 68b
  - number: 6.3a.2.1
    text: 'Het CAK verstrekt slechts een vergoeding indien betrokkene gedurende de periode:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.1.a
    text: |-
      ingeschreven heeft gestaan bij het orgaan van de woonplaats, bedoeld in
      [artikel 123, eerste lid, onderdeel a, van de Zorgverzekeringswet][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel123
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '123'
  - number: 6.3a.2.1.b
    text: |-
      heeft voldaan aan de voorwaarden die voor het recht op verstrekkingen voor zorg golden overeenkomstig de wetgeving
      waarvan met terugwerkende kracht is vastgesteld dat deze niet van toepassing was.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.2
    text: |-
      In afwijking van het eerste lid kan het CAK ook een vergoeding verstrekken indien betrokkene niet heeft voldaan aan
      het eerste lid en hij jegens het CAK aannemelijk heeft gemaakt dat hem dat niet verweten kan worden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.3
    text: |-
      Voor vergoeding komen in aanmerking de kosten van gedurende de periode verleende zorg en overige diensten als
      bedoeld bij en krachtens [artikel 11 van de Zorgverzekeringswet][ref1] verminderd met:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 6.3a.2.3.a
    text: kosten die hoger zijn dan in de Nederlandse marktomstandigheden in redelijkheid passend is te achten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.3.b
    text: |-
      hetgeen betrokkene als eigen bijdrage had moeten betalen indien hij in de periode krachtens een zorgverzekering
      recht zou hebben gehad op de zorg of overige diensten; en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.3.c
    text: |-
      hetgeen betrokkene als verplicht eigen risico had moeten betalen indien hij in de periode krachtens een
      zorgverzekering recht zou hebben gehad op de zorg of overige diensten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.4
    text: 'Het CAK bepaalt de hoogte van de vergoeding op basis van gegevens van:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.4.a
    text: het orgaan van de woonplaats als bedoeld in het eerste lid, onderdeel a;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.4.b
    text: het bevoegd orgaan van de staat waarvan de wetgeving achteraf bezien niet van toepassing was; of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.4.c
    text: facturen van zorgaanbieders.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.5
    text: |-
      Indien uit de gegevens, bedoeld in het vierde lid, niet kan worden afgeleid of en zo ja, in welke mate, de
      verleende zorg of overige diensten meer of andere werkzaamheden betreffen dan de zorg en overige diensten, bedoeld
      bij en krachtens [artikel 11 van de Zorgverzekeringswet][ref1], is het CAK bevoegd om, in afwijking van de aanhef
      van het derde lid, ook de kosten van de verleende extra of andere zorg of overige diensten te vergoeden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 6.3a.2.6
    text: 'Het CAK is bevoegd om kosten buiten vergoeding te laten indien deze:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.6.a
    text: al op grond van de wetgeving, bedoeld in het eerste lid, onderdeel b, zijn voldaan, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.6.b
    text: niet door het bevoegd orgaan, bedoeld in het vierde lid, onderdeel b, worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.7
    text: 'Het CAK betaalt de vergoeding:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.7.a
    text: 'indien de betrokkene de kosten van de zorg inmiddels voor eigen rekening heeft genomen: aan de betrokkene;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.2.7.b
    text: |-
      indien onderdeel a niet van toepassing is: aan het orgaan van de woonplaats, bedoeld in het eerste lid,
      onderdeel a, aan het bevoegd orgaan van de staat, bedoeld in het vierde lid, onderdeel b, of, indien het zorgkosten
      als bedoeld in het vierde lid, onderdeel c, betreft, aan de zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.2
  - number: 6.3a.3.1
    text: |-
      De bijdrage is gelijk aan een bedrag per maand overeenkomende met een twaalfde van het bedrag van de
      geraamde gemiddelde premie voor een verzekerde voor een zorgverzekering in het berekeningsjaar, bedoeld in
      [artikel 4 van de Wet op de zorgtoeslag][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.3
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '4'
  - number: 6.3a.3.2
    text: |-
      De bijdrage wordt berekend over de gehele periode, bedoeld in
      [artikel 68b, tweede lid, van de Zorgverzekeringswet][ref1], met uitzondering van de periode tot en met de
      kalendermaand waarin de in dat lid bedoelde persoon de leeftijd van achttien jaar bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel68b
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.3
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 68b
  - number: 6.3a.3.3
    text: |-
      Voor de toepassing van de [Wet op de zorgtoeslag][ref1] wordt de bijdrage volledig als premie voor een
      zorgverzekering beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0018451
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.3
    references:
      - id: ref1
        bwb_id: BWBR0018451
  - number: 6.3a.4
    text: |-
      [Artikel 4:15, eerste lid, aanhef en onderdeel b, en het vierde lid, van de Algemene wet bestuursrecht][ref1]
      geldt voor het geven van een beschikking op een aanvraag als bedoeld in
      [artikel 68b, eerste lid, van de Zorgverzekeringswet][ref2] ook indien het CAK noodzakelijke informatie aan een
      Nederlandse instantie heeft gevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel68b
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.3a.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 68b
  - number: 6.4.1.1
    text: |-
      Voor het bepalen van het saldo van de rekening, als bedoeld in
      [artikel 70, eerste lid, van de Zorgverzekeringswet][ref1] gaat het CAK uit van de bijdragevervangende
      belasting, bedoeld in [artikel 57, eerste lid, van de Zorgverzekeringswet][ref2], die de rijksbelastingdienst
      met overeenkomstige toepassing van [artikel 49, tweede, derde en vierde lid, van de Zorgverzekeringswet][ref3]
      vaststelt.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel49
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '57'
      - id: ref3
        bwb_id: BWBR0018450
        artikel: '49'
  - number: 6.4.1.2
    text: |-
      Zolang de bijdragevervangende belasting over enig jaar nog niet is vastgesteld, bepaalt het CAK het
      saldo van de rekening voorlopig op grond van het bedrag van de bijdragevervangende belasting over het
      voorafgaande jaar of, indien over het voorafgaande jaar geen bijdragevervangende belasting is vastgesteld,
      het bedrag van de over het voorafgaande jaar verschuldigde inkomensafhankelijke bijdrage, bedoeld in
      [artikel 43, eerste lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel43
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '43'
  - number: 6.4.1.3
    text: |-
      Een vaststelling als bedoeld in het eerste lid, die afwijkt van het bedrag, bedoeld in het tweede lid, wordt
      verrekend met het saldo van de rekening.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
  - number: 6.4.1.4
    text: |-
      Een verzoek als bedoeld in [artikel 70, vijfde lid, van de Zorgverzekeringswet][ref1] wordt ontvangen uiterlijk
      binnen twee kalenderjaren volgend op het kalenderjaar waarin de verlening van de desbetreffende zorg of overige
      diensten is aangevangen. Indien de laatste gemoedsbezwaarde waarvoor de rekening in stand wordt gehouden is
      overleden of verzekeringsplichtig is geworden, wordt het verzoek in afwijking van de eerste volzin ontvangen
      uiterlijk binnen zes maanden volgend op het kalenderjaar waarin de laatste gemoedsbezwaarde is overleden of
      verzekeringsplichtig is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
  - number: 6.4.1.5
    text: |-
      Het CAK besluit op verzoeken die zijn ontvangen van 1 januari tot en met 30 juni van enig jaar uiterlijk 1 november
      van dat jaar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
  - number: 6.4.1.6
    text: |-
      Een uitkering als bedoeld in [artikel 70, vierde lid, onder a, van de Zorgverzekeringswet][ref1] wordt uitsluitend
      gedaan op basis van een originele nota.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
  - number: 6.4.1.7
    text: Het CAK kan de uitkering in gedeelten doen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
  - number: 6.4.1.8
    text: |-
      Het CAK brengt de uitkering in mindering op het saldo van de rekening met dien verstande dat de uitkering niet
      hoger is dan het saldo van de rekening.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
  - number: 6.4.1.9
    text: |-
      Het CAK kan de uitkering doen uiterlijk tot en met drie kalenderjaren volgend op het kalenderjaar waarin de zorg
      is aangevangen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.1
  - number: 6.4.2.1
    text: |-
      Een gemoedsbezwaarde die een gezamenlijke huishouding met een of meer andere gemoedsbezwaarden verlaat, kan het CAK
      verzoeken een evenredig gedeelte van het saldo van de in [artikel 70, tweede lid, van de Zorgverzekeringswet][ref1]
      bedoelde rekening, over te maken op een voor hem te openen rekening als bedoeld in artikel 70, eerste lid van de
      Zorgverzekeringswet.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '70'
  - number: 6.4.2.2
    text: |-
      Het verzoek wordt ontvangen uiterlijk 30 juni van het kalenderjaar volgend op het jaar waarin de gemoedsbezwaarde
      de gezamenlijke huishouding verlaat.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.2
  - number: 6.4.2.3
    text: |-
      Het evenredig gedeelte wordt bepaald op basis van het saldo dat resteert nadat een besluit is genomen op alle
      verzoeken die het CAK heeft ontvangen in het jaar waarin de gemoedsbezwaarde de gezamenlijke huishouding verlaat.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4.2
  - number: 6.4a.1
    text: |-
      De bestanden, bedoeld in [artikel 9a, eerste lid, van de Zorgverzekeringswet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel9a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 9a
  - number: 6.4a.1.a
    text: |-
      het bestand van personen die verzekerd zijn op grond van de [Wet langdurige zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 6.4a.1.b
    text: |-
      het bestand met personen als bedoeld in [artikel 2, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
  - number: 6.4a.1.c
    text: |-
      het bestand met personen als bedoeld in [artikel 2, tweede lid, onderdeel b, van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
  - number: 6.4a.1.d
    text: het bestand van personen die op grond van een zorgverzekering verzekerd zijn.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4a.1
  - number: 6.4b.1
    text: |-
      De bestanden, bedoeld in [artikel 6, vijfde lid, van de Zorgverzekeringswet][ref1] zijn:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '6'
  - number: 6.4b.1.a
    text: |-
      het bestand van personen die verzekerd zijn op grond van de [Wet langdurige zorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0035917
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4b.1
    references:
      - id: ref1
        bwb_id: BWBR0035917
  - number: 6.4b.1.b
    text: |-
      het bestand van personen als bedoeld in [artikel 2, tweede lid, onderdeel a, van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '2'
  - number: 6.4b.1.c
    text: het bestand van personen die op grond van een zorgverzekering verzekerd zijn.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.4b.1
  - number: 6.5.1
    text: |-
      Bij samenloop over eenzelfde tijdvak van bestuursrechtelijke premieheffing met één of meer van de navolgende,
      ingevolge de socialezekerheidswetgeving voorgeschreven inhoudingen of verrekeningen, gaat de bestuursrechtelijke
      premieheffing voor:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.1
  - number: 6.5.1.a
    text: |-
      door het Uitvoeringsinstituut werknemersverzekeringen, genoemd in
      [hoofdstuk 5 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], de Sociale verzekeringsbank,
      genoemd in [hoofdstuk 6 van die wet][ref2], of door een college van burgemeester en wethouders verrichte
      inhouding of verrekening van een door één van deze instanties in het kader van een door die instantie uitgevoerde
      socialezekerheidswet opgelegde bestuurlijke boete,


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.1
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: 6.5.1.b
    text: |-
      inhoudingen of verrekeningen als bedoeld in [artikel 24, tweede juncto eerste lid, van de Wet inburgering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0020611#Artikel24
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.1
    references:
      - id: ref1
        bwb_id: BWBR0020611
        artikel: '24'
  - number: 6.5.2.1
    text: |-
      De gemiddelde premie, bedoeld in de [artikelen 18d, eerste lid][ref1], en
      [18e, tweede lid, van de Zorgverzekeringswet][ref2] is gelijk aan de geraamde gemiddelde premie voor een
      zorgverzekering, bedoeld in [artikel 4 van de Wet op de zorgtoeslag][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18e
      [ref3]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18e
      - id: ref3
        bwb_id: BWBR0018451
        artikel: '4'
  - number: 6.5.2.2
    text: |-
      De bestuursrechtelijke premies, bedoeld in de [artikel 18d, eerste lid][ref1], en
      [18e, eerste lid, van de Zorgverzekeringwet][ref2], bedragen per maand € 172,70.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18e
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18e
  - number: 6.5.3
    text: |-
      Indien na beëindiging van de verschuldigdheid van de bestuursrechtelijke premie ter zake van die premie een
      restschuld bestaat, maakt het CAK voor de inning daarvan geen gebruik meer van de instrumenten, bedoeld in
      [artikel 18f, tweede of zesde lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18f
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.3
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18f
  - number: 6.5.3a
    text: |-
      Het CAK stort 23 procent van de in enig kalenderjaar geïnde bestuursrechtelijke premies, bedoeld in
      [artikel 18d van de Zorgverzekeringswet][ref1], in 's Rijks kas.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.3a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.4.1
    text: |-
      De inspanningen tot inning van de premie, bedoeld in [artikel 18bb, eerste lid, van de Zorgverzekeringswet][ref1],
      bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18bb
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18bb
  - number: 6.5.4.1.a
    text: |-
      het uiterlijk vanaf tien werkdagen na de uiterste datum voor betaling van de premie treffen of, indien
      noodzakelijk, door derden laten treffen van maatregelen tot inning en incasso van de premie die betamelijk zijn en
      in redelijkheid verlangd kunnen worden en waarbij kosten voor de verzekeringnemer zoveel mogelijk voorkomen worden
      door:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.1.a.1°
    text: de verzekeringnemer te informeren indien een automatische incasso van de premie niet slaagt;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.1.a.2°
    text: de verzekeringnemer kosteloos een aanmaning te sturen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.1.a.3°
    text: de verzekeringnemer een tweede en derde aanmaning te sturen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.1.a.4°
    text: niet elke premiefactuur afzonderlijk te verzwaren met incassokosten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.1.b
    text: |-
      de verzekeringnemer die in verzuim verkeert tot nakoming van een betalingsregeling bedoeld in
      [artikel 18a, eerste lid, van de Zorgverzekeringswet][ref1], ten minste eenmalig in staat te stellen dit verzuim
      te herstellen;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18a
  - number: 6.5.4.1.c
    text: |-
      communicatiemiddelen in te zetten die zijn afgestemd op de verzekeringnemers ten behoeve waarvan de inspanningen
      worden geleverd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.2
    text: |-
      De medewerking, bedoeld in [artikel 18c, vierde lid, van de Zorgverzekeringswet][ref1], bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
  - number: 6.5.4.2.a
    text: |-
      het bevorderen dat verzekeringnemers niet langer de bestuursrechtelijke premie, bedoeld in
      [artikel 18d, eerste lid, van de Zorgverzekeringswet][ref1] verschuldigd zullen zijn door:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.4.2.a.1°
    text: |-
      het periodiek, doch ten minste jaarlijks, aanbieden en vervolgens uitvoeren van een redelijke, op de omstandigheden
      van de verzekeringnemer afgestemd betalingsregeling waarin alle uit de zorgverzekering voortvloeiende schulden
      van de verzekeringnemer aan de zorgverzekeraar zijn betrokken, met kwijtschelding van eventuele restschulden, ten
      behoeve van de verzekeringnemers die naar verwachting van de zorgverzekeraar aan de betalingsregeling zullen kunnen
      voldoen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.2.a.2°
    text: |-
      het verlenen van medewerking aan het tot stand brengen en uitvoeren van betalingsregelingen en schuldsanering
      die ten minste in overeenstemming zijn met de door de Vereniging voor schuldhulpverlening en sociaal bankieren
      gehanteerde richtlijnen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.4.2.a.3°
    text: |-
      het in overleg met gemeenten verlenen van medewerking aan de uitvoering van [artikel 6.5.6][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 6.5.4.2.b
    text: |-
      het inzetten van communicatiemiddelen die zijn afgestemd op de verzekeringnemers ten behoeve waarvan de medewerking
      wordt geleverd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.4
  - number: 6.5.5.1
    text: |-
      Het CAK verstrekt een zorgverzekeraar per kalenderjaar een bijdrage voor het onder de dekking van de
      zorgverzekering houden van verzekerden voor wier zorgverzekering de bestuursrechtelijke premie verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.5.2
    text: 'De bijdrage wordt berekend met de formule (A + B + C) * D, waarbij wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: '6.5.5.2.A:'
    text: |-
      de som van het aantal maanden per verzekerde waarin ter zake van de zorgverzekering de bestuursrechtelijke premie
      verschuldigd was in het kalenderjaar;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: '6.5.5.2.B:'
    text: |-
      de som van het aantal maanden per verzekerde waarvoor de bestuursrechtelijke premie in het kalenderjaar niet
      verschuldigd was omdat de melding, bedoeld in [artikel 18c, eerste lid, van de Zorgverzekeringswet][ref1], ten
      gevolge van de toepasselijkheid van het tweede lid, onderdeel b, c of d, van dat artikel nog niet kon worden
      gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
  - number: '6.5.5.2.C:'
    text: |-
      de som van het aantal maanden per verzekerde waarin sprake is van een omstandigheid als bedoeld in
      [artikel 18d, vierde lid, onderdeel b of c, van de Zorgverzekeringswet][ref1] tot en met de maand waarin de
      zorgverzekeraar het CAK meldt dat hiervan sprake is, maar maximaal twee maanden;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: '6.5.5.2.D:'
    text: |-
      de standaardpremie als bedoeld in [artikel 4 van de Wet op de zorgtoeslag][ref1], gedeeld door twaalf.


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel4
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0018451
        artikel: '4'
  - number: 6.5.5.3
    text: |-
      Het CAK verleent maandelijks ambtshalve een voorschot op de bijdrage dat wordt berekend op basis van het aantal
      verzekerden waarop het tweede lid in de periode tot en met de desbetreffende maand van toepassing is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.5.4
    text: 'De bijdrage en het maandelijkse voorschot worden berekend aan de hand van de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.5.4.a
    text: het bestand van personen die op grond van een zorgverzekering verzekerd zijn;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.5.4.b
    text: |-
      het bestand van personen ten aanzien waarvan het CAK de bestuursrechtelijke premie heft
      naar aanleiding van de meldingen, bedoeld in de [artikelen 18c, eerste lid][ref1], en
      [18d, derde lid en vierde lid, onderdeel b, van de Zorgverzekeringswet][ref2], en rekening houdend met de
      toepassing van de [artikelen 6.5.6][ref3] en [6.5.7][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
      [ref3]: https://wetten.overheid.nl/BWBR0018715#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18d
      - id: ref3
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref4
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 6.5.5.5
    text: 'De zorgverzekeraar administreert:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.5.5.a
    text: |-
      zijn meldingen, bedoeld in de [artikelen 18c, eerste lid][ref1], en
      [18d, derde lid en vierde lid, onderdeel b, van de Zorgverzekeringswet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
      - id: ref2
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.5.5.b
    text: |-
      het aantal maanden per verzekerde waarvoor de bestuursrechtelijke premie in het kalenderjaar niet verschuldigd
      was omdat de melding, bedoeld in [artikel 18c, eerste lid, van de Zorgverzekeringswet][ref1] ten gevolge van de
      toepasselijkheid van het tweede lid, onderdeel b, c of d, van dat artikel nog niet kon worden gedaan;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18c
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18c
  - number: 6.5.5.5.c
    text: |-
      de toepassing van de [artikelen 6.5.6][ref1] en [6.5.7][ref2] op zijn verzekeringsnemers;


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 6.5.5.5.d
    text: |-
      de verzekerden die de bestuursrechtelijke premie verschuldigd zijn en hij onverminderd onder de dekking van de
      zorgverzekering heeft gehouden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.5.6
    text: |-
      Het CAK kan bepalen dat de zorgverzekeraar uiterlijk 1 mei van het jaar volgende op het kalenderjaar ten
      behoeve waarvan de bijdrage is verstrekt op door het CAK te bepalen wijze opgave per kalendermaand doet uit
      de administratie, bedoeld in het vijfde lid. Daarbij kan het CAK bepalen dat de opgave is voorzien van een
      assurancerapport van een accountant als bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1],
      opgesteld overeenkomstig een door het CAK vastgesteld model met inachtneming van een door het CAK vastgesteld
      accountantsprotocol.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 6.5.5.7
    text: |-
      Uiterlijk 1 september van het jaar volgende op het kalenderjaar ten behoeve waarvan de bijdrage is verstrekt stelt
      het CAK de bijdrage ambtshalve vast.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.5.8
    text: |-
      Het CAK is bevoegd het verschil tussen de vastgestelde bijdrage en de bevoorschotte bijdrage te verrekenen met over
      een later kalenderjaar te verstrekken voorschotten op de bijdrage.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.5
  - number: 6.5.6.1
    text: |-
      Onverminderd [artikel 18d, tweede lid, onderdelen a, b en c, van de Zorgverzekeringswet][ref1] is de
      bestuursrechtelijke premie, bedoeld in artikel 18d, eerste lid, van die wet niet meer verschuldigd met ingang van
      de eerste dag van de maand volgende op de maand waarin de verzekeringnemer aan de volgende voorwaarden voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.6.1.a
    text: |-
      de verzekeringnemer ontvangt algemene bijstand als bedoeld in [artikel 5 van de Participatiewet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel5
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '5'
  - number: 6.5.6.1.b
    text: |-
      de verzekeringnemer heeft gedurende een periode van ten minste twaalf aaneengesloten maanden algemene bijstand
      ontvangen of de schulden van de verzekeringnemer voortvloeiende uit de zorgverzekering bedragen in totaal minder
      dan € 600;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
  - number: 6.5.6.1.c
    text: |-
      de verzekeringnemer is verzekerd op basis van een modelovereenkomst als bedoeld in
      [artikel 18 van de Zorgverzekeringswet][ref1] die is aangewezen in een in dat artikel bedoelde overeenkomst die
      het college van burgemeester en wethouders heeft gesloten ten behoeve van of mede ten behoeve van ontvangers
      van algemene bijstand, tenzij de verzekeringnemer een zorgverzekering heeft bij een zorgverzekeraar die geen
      deel uitmaakt van een groep in de zin van [artikel 24b van Boek 2 van het Burgerlijk Wetboek][ref2] met de
      zorgverzekeraar waarmee de overeenkomst is gesloten;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel24b
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 24b
  - number: 6.5.6.1.d
    text: |-
      de verzekeringnemer heeft het verplicht eigen risico van de zorgverzekering verzekerd of zorgt voor gespreide dan
      wel tijdige betaling van het verplicht eigen risico;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
  - number: 6.5.6.1.e
    text: de verzekeringnemer heeft een zorgverzekering zonder vrijwillig eigen risico;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
  - number: 6.5.6.1.f
    text: |-
      de zorgverzekeraar heeft het bedrag van de schulden van de verzekeringnemer voortvloeiende uit de zorgverzekering
      dat eventueel resteert na afloop van de in onderdeel g bedoelde termijn, kwijtgescholden onder voorwaarde van de
      betalingen, bedoeld in onderdeel g, de toezegging, bedoeld in onderdeel h, en de betalingen, bedoeld in het tweede
      lid;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
  - number: 6.5.6.1.g
    text: |-
      onder gebruikmaking van de bevoegdheid die het college van burgemeester en wethouders heeft op grond van
      [artikel 57 van de Participatiewet][ref1] wordt in overeenstemming met de zorgverzekeraar of zorgverzekeraars
      gedurende maximaal 36 maanden de premie van de zorgverzekering en de aflossing van de schulden van de
      verzekeringnemer voortvloeiende uit de zorgverzekering of zorgverzekeringen ingehouden op de algemene bijstand van
      de verzekeringnemer en aan de zorgverzekeraar of zorgverzekeraars betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel57
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '57'
  - number: 6.5.6.1.h
    text: |-
      de verzekeringnemer zegt toe vanaf het moment dat geen algemene bijstand wordt verleend zorg te dragen voor
      voortzetting van de betalingen, bedoeld in onderdeel g;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
  - number: 6.5.6.1.i
    text: |-
      de verzekeringnemer stemt er mee in aan de voorwaarden, bedoeld onder c, d, e en h te
      blijven voldoen gedurende de periode, bedoeld onder g, onder voorbehoud van de toepassing van
      [artikel 18d, tweede lid, onderdelen b en c, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.6.2
    text: |-
      De bestuursrechtelijke premie, bedoeld in [artikel 18d, eerste lid, van die wet][ref1] is wederom verschuldigd
      met ingang van de eerste dag van de maand volgende op de maand waarin niet meer wordt voldaan aan de voorwaarde,
      bedoeld in het eerste lid, onderdeel c, d, e of g, of waarin de verzekeringnemer waaraan geen algemene bijstand
      meer wordt verleend niet meer zorg draagt voor voortzetting van de betalingen, bedoeld in het eerste lid, onderdeel
      g.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.6
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.7.1
    text: |-
      Onverminderd [artikel 18d, tweede lid, onderdelen a, b en c, van de Zorgverzekeringswet][ref1] is de
      bestuursrechtelijke premie, bedoeld in artikel 18d, eerste lid, van die wet niet meer verschuldigd met ingang van
      de eerste dag van de maand volgende op de maand waarin de verzekeringnemer aan de volgende voorwaarden voldoet:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.7.1.a
    text: |-
      ten aanzien van de verzekeringnemer is een bewind als bedoeld in
      [artikel 431, eerste lid, onderdeel a of b, van Boek 1 van het Burgerlijk Wetboek][ref1] ingesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0002656#Artikel431
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
    references:
      - id: ref1
        bwb_id: BWBR0002656
        artikel: '431'
  - number: 6.5.7.1.b
    text: |-
      de verzekeringnemer heeft het verplicht eigen risico van de zorgverzekering verzekerd of zorgt voor gespreide dan
      wel tijdige betaling van het verplicht eigen risico;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
  - number: 6.5.7.1.c
    text: de verzekeringnemer heeft een zorgverzekering zonder vrijwillig eigen risico;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
  - number: 6.5.7.1.d
    text: |-
      de zorgverzekeraar heeft het bedrag van de schulden van de verzekeringnemer voortvloeiende uit de zorgverzekering
      dat eventueel resteert na afloop van de in onderdeel e bedoelde termijn, kwijtgescholden onder voorwaarde van de
      betalingen, bedoeld in onderdeel e, de toezegging, bedoeld in onderdeel f, en de betalingen, bedoeld in het tweede
      lid;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
  - number: 6.5.7.1.e
    text: |-
      onder gebruikmaking van zijn bevoegdheden op grond van [Titel 19 van Boek 1 van het Burgerlijk Wetboek][ref1]
      draagt de bewindvoerder er in overeenstemming met de zorgverzekeraar of zorgverzekeraars zorg voor dat gedurende
      maximaal 36 maanden de premie van de zorgverzekering en de aflossing van de schulden van de verzekeringnemer
      voortvloeiende uit de zorgverzekering of zorgverzekeringen aan de zorgverzekeraar of zorgverzekeraars worden
      betaald;


      [ref1]: https://wetten.overheid.nl/BWBR0002656
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
    references:
      - id: ref1
        bwb_id: BWBR0002656
  - number: 6.5.7.1.f
    text: |-
      de verzekeringnemer zegt toe vanaf het moment dat het bewind eindigt zorg te dragen voor voortzetting van de
      betalingen, bedoeld in onderdeel e;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
  - number: 6.5.7.1.g
    text: |-
      de bewindvoerder en de verzekeringnemer stemmen er mee in aan de voorwaarden, bedoeld onder b, c en
      f, te blijven voldoen gedurende de periode, bedoeld onder e, onder voorbehoud van de toepassing van
      [artikel 18d, tweede lid, onderdelen b en c, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.5.7.2
    text: |-
      De bestuursrechtelijke premie, bedoeld in [artikel 18d, eerste lid, van die wet][ref1] is wederom verschuldigd
      met ingang van de eerste dag van de maand volgende op de maand waarin niet meer wordt voldaan aan de voorwaarde,
      bedoeld in het eerste lid, onderdeel b, c of f, of waarin het bewind is geëindigd niet meer zorg draagt voor
      voortzetting van de betalingen, bedoeld in het eerste lid, onderdeel e.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.5.7
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: 6.6.1
    text: 'In deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.1
  - number: 6.6.1.a
    text: |-
      *catastrofe:* catastrofe als bedoeld in [artikel 33, eerste lid, onderdeel a, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 6.6.1.b
    text: |-
      *catastrofejaar:* catastrofejaar als bedoeld in [artikel 33, eerste lid, onderdeel b, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 6.6.1.c
    text: |-
      *extra bijdrage:* bijdrage als bedoeld in [artikel 33 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 6.6.1.d
    text: |-
      *prestatiebeschrijving:* beschrijving van een prestatie als bedoeld in
      [artikel 50, eerste lid, onderdeel d, van de Wet marktordening gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel50
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '50'
  - number: 6.6.1.e
    text: |-
      *tarief:* tarief als bedoeld in [artikel 1, eerste lid, onderdeel k, van de Wet marktordening gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel1
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '1'
  - number: 6.6.1.f
    text: |-
      *wet:* [Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 6.6.2.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.1.a
    text: |-
      *grondslag:* product van de gemiddelde vereveningsbijdrage, en het op het moment van de toekenning van
      de vereveningsbijdrage over het catastrofejaar verwacht aantal verzekerden dat de zorgverzekeraar in het
      catastrofejaar had;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.1.b
    text: |-
      *gemiddelde vereveningsbijdrage:* toegekende vereveningsbijdrage per verzekerde, die wordt berekend door de som
      van de op grond van [artikel 32 van de wet][ref1] met betrekking tot het catastrofejaar voor alle zorgverzekeraars
      toegekende vereveningsbijdragen te delen door het verwachte totaalaantal verzekerden in dat jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '32'
  - number: 6.6.2.1.c
    text: |-
      *de catastrofeschadelast:* de som van de verwachte kosten van de zorgverzekeraar ten gevolge van de catastrofe in
      het catastrofejaar en het daaropvolgende kalenderjaar, die het Zorginstituut op grond van het tweede en derde lid
      in aanmerking neemt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.2
    text: |-
      Het Zorginstituut neemt als verwachte kosten in aanmerking kosten ten gevolge van de betrokken catastrofe die
      zorgaanbieders overeenkomstig hetgeen bij of krachtens de [Wet marktordening gezondheidzorg][ref1] is geregeld met
      tarieven in rekening brengen met hantering van:


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 6.6.2.2.a
    text: |-
      daartoe door het Zorginstituut aangewezen prestatiebeschrijvingen voor zorg of andere diensten die op grond van de
      zorgverzekeringen zijn verzekerd en rechtstreeks betrekking hebben op individuele verzekerden; of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.2.b
    text: |-
      een prestatiebeschrijving voor meerkosten in verband met de catastrofe en voor zover het kosten betreft anders dan
      bedoeld in onderdeel a, de zorgverzekeraar op de door het Zorginstituut aangegeven wijze aantoont dat die kosten
      betrekking hebben op zorg of andere diensten die op grond van de zorgverzekeringen zijn verzekerd;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.3
    text: 'Het Zorginstituut neemt niet als verwachte kosten in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.3.a
    text: |-
      kosten waarvoor de zorgverzekeraar naar verwachting compensatie verkrijgt ten laste van de rijksbegroting,
      bedoeld in [artikel 2.1 van de Comptabiliteitswet 2016][ref1], op grond van daartoe door dat instituut aangewezen
      regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: 6.6.2.3.b
    text: |-
      kosten die zorgaanbieders met tarieven in rekening brengen met hantering van de prestatiebeschrijving
      “continuïteitsbijdrage” voor de onderdekking van doorlopende kosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.4
    text: 'De toe te kennen extra bijdrage, bedraagt bij:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.4.a
    text: |-
      een catastrofeschadelast van meer dan 4% van de grondslag en minder dan 10% van de grondslag het bedrag ter grootte
      van 5/3 vermenigvuldigd met het verschil tussen die catastrofelast en 4% van de grondslag;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.4.b
    text: |-
      een catastrofeschadelast van 10% of meer en niet meer dan 20% van de grondslag, het bedrag ter grootte van die
      catastrofeschadelast, en een catastrofeschadelast van meer dan 20% van de grondslag, het bedrag ter grootte van 20%
      van de grondslag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.2.5
    text: |-
      Het Zorginstituut kent overeenkomstig de beleidsregels, bedoeld in [artikel 33, vijfde lid, van de wet][ref1] een
      lagere extra bijdrage toe dan op grond van het vierde lid, indien de zorgverzekeraar het verzoek om toekenning
      van de extra bijdrage niet voor het einde van het kalenderjaar volgend op het catastrofejaar, heeft ingediend.
      Het Zorginstituut kent een extra bijdrage van nihil toe indien de zorgverzekeraar het verzoek om toekenning van de
      extra bijdrage na het einde van het tweede kalenderjaar volgend op het catastrofejaar heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 6.6.2.6
    text: |-
      De toepassing van het vijfde lid blijft ten aanzien van de zorgverzekeraar achterwege indien redelijkerwijs niet
      kan worden geoordeeld dat hij in verzuim is geweest.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.2
  - number: 6.6.3
    text: |-
      De betaling van de toegekende extra bijdrage geschiedt overeenkomstig de door het Zorginstituut vastgestelde
      beleidsregels, waarin ten minste een betaalschema is opgenomen dat rekening houdt met het betaalschema van de
      zorgverzekeraar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.3
  - number: 6.6.4
    text: |-
      Een zorgverzekeraar aan wie het Zorginstituut een extra bijdrage heeft toegekend neemt in de afzonderlijke
      administratie, bedoeld in [artikel 33, derde lid, van de wet][ref1] op:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.4
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 6.6.4.a
    text: |-
      de gerealiseerde kosten in het catastrofejaar en het daaropvolgende kalenderjaar ten gevolge van de catastrofe voor
      zorg of andere diensten die op grond van de zorgverzekeringen zijn verzekerd en rechtstreeks betrekking hebben op
      individuele verzekerden;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.4
  - number: 6.6.4.b
    text: |-
      de gerealiseerde kosten in het catastrofejaar en het daaropvolgende kalenderjaar anders dan bedoeld in onderdeel
      a, ten gevolge van de catastrofe voor op grond van de zorgverzekeringen verzekerde zorg of andere diensten die de
      zorgaanbieders met tarieven in rekening hebben gebracht met hantering van een prestatiebeschrijving voor meerkosten
      in verband met de catastrofe en de wijze waarop deze zijn bepaald;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.4
  - number: 6.6.4.c
    text: |-
      het deel van de gerealiseerde kosten, bedoeld in onderdeel a, dat voor rekening van verzekerden is gekomen op grond
      van het verplicht eigen risico;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.4
  - number: 6.6.4.d
    text: |-
      het deel van de gerealiseerde kosten, bedoeld in de onderdelen a en b, waarvoor de zorgverzekeraar
      compensatie heeft verkregen of zal verkrijgen ten laste van de rijksbegroting als bedoeld in
      [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref1], op grond van de door het Zorginstituut daartoe
      aangewezen regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.4
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: 6.6.4.e
    text: |-
      de gerealiseerde kosten in het catastrofejaar en het daaropvolgende kalenderjaar die de zorgaanbieders met tarieven
      in rekening hebben gebracht met hantering van de prestatiebeschrijving 'continuïteitsbijdrage' voor de onderdekking
      van doorlopende kosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.4
  - number: 6.6.5.1
    text: 'In dit artikel wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.1.a
    text: |-
      *grondslag:* product van de gemiddelde vereveningsbijdrage, en het werkelijke aantal verzekerden dat de
      zorgverzekeraar in het catastrofejaar had;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.1.b
    text: |-
      *gemiddelde vereveningsbijdrage:* vastgestelde vereveningsbijdrage per verzekerde, die wordt berekend door de som
      van de op grond van [artikel 34 van de wet][ref1] met betrekking tot het catastrofejaar voor alle zorgverzekeraars
      vastgestelde vereveningsbijdragen te delen door het werkelijke totaalaantal verzekerden in dat jaar;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel34
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '34'
  - number: 6.6.5.1.c
    text: |-
      *de catastrofeschadelast:* de som van de gerealiseerde kosten van de zorgverzekeraar ten gevolge van de catastrofe
      in het catastrofejaar en het daaropvolgende kalenderjaar, die het Zorginstituut op grond van het tweede en derde
      lid in aanmerking neemt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.2
    text: |-
      Het Zorginstituut neemt als gerealiseerde kosten in aanmerking kosten ten gevolge van de betrokken catastrofe die
      zorgaanbieders overeenkomstig hetgeen bij of krachtens de [Wet marktordening gezondheidzorg][ref1] is geregeld met
      tarieven in rekening brengen met hantering van:


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 6.6.5.2.a
    text: |-
      daartoe door het Zorginstituut aangewezen prestatiebeschrijvingen voor zorg of andere diensten die op grond van de
      zorgverzekeringen zijn verzekerd en rechtstreeks betrekking hebben op individuele verzekerden; of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.2.b
    text: |-
      een prestatiebeschrijving voor meerkosten in verband met de catastrofe en voor zover het kosten betreft anders dan
      bedoeld in onderdeel a, de zorgverzekeraar op de door het Zorginstituut aangegeven wijze aantoont dat die kosten:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.2.b.1°
    text: betrekking hebben op zorg of andere diensten die grond van de zorgverzekeringen zijn verzekerd, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.2.b.2°
    text: |-
      zijn gebaseerd op aan zorgaanbieders betaalde tarieven op grond van schriftelijke afspraken die mede gelet op de
      bijzondere omstandigheden van de catastrofe, leiden tot een plausibele bepaling van die meerkosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.3
    text: 'Het Zorginstituut neemt niet als gerealiseerde kosten in aanmerking:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.3.a
    text: kosten, die voor rekening van verzekerden zijn gekomen op grond van het verplicht eigen risico;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.3.b
    text: |-
      kosten waarvoor een zorgverzekeraar compensatie heeft verkregen of zal verkrijgen ten laste van de rijksbegroting,
      bedoeld in [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref1] op grond van daartoe door dat instituut
      aangewezen regelingen;


      [ref1]: https://wetten.overheid.nl/BWBR0039429#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
    references:
      - id: ref1
        bwb_id: BWBR0039429
        artikel: '2'
  - number: 6.6.5.3.c
    text: |-
      kosten die zorgaanbieders met tarieven in rekening hebben gebracht met hantering van de prestatiebeschrijving
      'continuïteitsbijdrage' voor de onderdekking van doorlopende kosten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.4
    text: 'De vast te stellen extra bijdrage, bedraagt bij:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.4.a
    text: een catastrofeschadelast van 4% of minder van de grondslag, nihil.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.4.b
    text: |-
      een catastrofeschadelast van meer dan 4% van de grondslag en minder dan 10% van de grondslag, het bedrag ter
      grootte van 5/3 vermenigvuldigd met het verschil tussen die catastrofelast en 4% van de grondslag;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.4.c
    text: |-
      een catastrofeschadelast van 10% of meer en niet meer dan 20% van de grondslag, het bedrag ter grootte van die
      catastrofeschadelast, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.4.d
    text: een catastrofeschadelast van meer dan 20% van de grondslag, het bedrag ter grootte van 20% van de grondslag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
  - number: 6.6.5.5
    text: |-
      Het Zorginstituut stelt overeenkomstig de door hem opgestelde beleidsregels de extra bijdrage
      lager vast dan op grond van het vierde lid, indien dat instituut ten aanzien van de zorgverzekeraar
      [artikel 6.6.2, vijfde lid][ref1], heeft toegepast. Het Zorginstituut stelt de extra bijdrage op nihil vast indien
      de zorgverzekeraar het verzoek om toekenning van de extra bijdrage na het einde van het tweede kalenderjaar volgend
      op het catastrofejaar heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.5
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '6'
  - number: 6.7.1
    text: |-
      In deze paragraaf wordt verstaan onder: - *budget:* door de zorgautoriteit vastgesteld tarief voor geheel van
      prestaties;
        - *gereguleerd tarief:* door de zorgautoriteit op grond van de [Wet marktordening gezondheidszorg][ref1]
      vastgesteld vast tarief onderscheidenlijk bedrag dat ten minste of ten hoogste als tarief in rekening kan worden
      gebracht;
        - *laatste budgetjaar:* kalenderjaar onmiddellijk voorafgaande aan het jaar waarin voor de aangewezen categorie van
      zorgaanbieders een prestatiebekostigingssysteem is gaan gelden;
        - *opbrengstverschil:* door de zorgautoriteit vastgesteld verschil tussen het budget en de opbrengsten van de
      zorgaanbieder over het laatste budgetjaar ter zake van diagnose behandeling combinaties waarvoor in het laatste
      budgetjaar een gereguleerd tarief gold;
        - *percentage opbrengstverschil voor de zorgverzekeraar:* relatieve deel van het opbrengstverschil dat de
      zorgautoriteit naar rato van zijn marktaandeel aan de zorgverzekeraar heeft toegedeeld;
        - *prestatiebekostigingssysteem:* bekostigingssysteem voor een zorgaanbieder op basis van uitgevoerde diagnose
      behandeling combinaties;
        - *schadelastbedrag:* door de zorgverzekeraars vergoede bedrag;
        - *zorgaanbieder:* zorgaanbieder als bedoeld [1, onderdeel c, van de Wet marktordening gezondheidszorg][ref2] die
      behoort tot een in [artikel 6.7.2, eerste lid][ref3], aangewezen categorie;
        - *zorgautoriteit:* Nederlandse Zorgautoriteit, genoemd in
      [artikel 3 van de Wet marktordening gezondheidszorg][ref4];
        - *Zorginstituut:* Zorginstituut Nederland, genoemd in [artikel 58 van de Zorgverzekeringswet][ref5];
        - *zorgverzekeraar:* zorgverzekeraar als bedoeld in [artikel 1, onderdeel b, van de Zorgverzekeringswet][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0020078
      [ref2]: https://wetten.overheid.nl/BWBR0020078#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018715#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0020078#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0018450#Artikel58
      [ref6]: https://wetten.overheid.nl/BWBR0018450#Artikel1
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.1
    references:
      - id: ref1
        bwb_id: BWBR0020078
      - id: ref2
        bwb_id: BWBR0020078
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0018715
        artikel: '6'
        hoofdstuk: '6'
        paragraaf: '7'
      - id: ref4
        bwb_id: BWBR0020078
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0018450
        artikel: '58'
      - id: ref6
        bwb_id: BWBR0018450
        artikel: '1'
  - number: 6.7.2.1
    text: |-
      Als categorieën zorgaanbieders op grond van [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref1], worden
      aangewezen:


      [ref1]: https://wetten.overheid.nl/BWBR0034659#ArtikelIIIa
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
    references:
      - id: ref1
        bwb_id: BWBR0034659
        artikel: IIIa
  - number: 6.7.2.1.a
    text: algemene ziekenhuizen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.b
    text: academische ziekenhuizen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.c
    text: revalidatie instellingen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.d
    text: radiotherapeutische centra;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.e
    text: dialyse centra;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.f
    text: audiologische centra;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.g
    text: klinisch genetische centra;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.h
    text: het Oogziekenhuis in Rotterdam;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.i
    text: epilepsie-instellingen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.j
    text: long-astma-instellingen, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.1.k
    text: het Beatrixoord in Haren (Groningen).
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
  - number: 6.7.2.2
    text: |-
      Het Zorginstituut neemt bij de toepassing van [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref1], de door
      een zorgaanbieder geleverde diagnose behandeling combinaties in aanmerking waarvoor in het laatste budgetjaar een
      door de zorgautoriteit vastgesteld gereguleerd tarief gold en die in het laatste budgetjaar zijn geopend en in het
      daaropvolgende kalenderjaar zijn afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0034659#ArtikelIIIa
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
    references:
      - id: ref1
        bwb_id: BWBR0034659
        artikel: IIIa
  - number: 6.7.3.1
    text: |-
      Het Zorginstituut berekent de bedragen, bedoeld in [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref1],
      overeenkomstig het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0034659#ArtikelIIIa
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
    references:
      - id: ref1
        bwb_id: BWBR0034659
        artikel: IIIa
  - number: 6.7.3.2
    text: 'Het Zorginstituut:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.a
    text: 'bepaalt per zorgaanbieder de som van:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.a.1°
    text: |-
      50% van het schadelastbedrag ter zake van de diagnose behandeling combinaties waarvoor een gereguleerd tarief
      gold die in het kalenderjaar voorafgaand aan het laatste budgetjaar zijn geopend en in het laatste budgetjaar zijn
      afgesloten,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.a.2°
    text: |-
      het schadelastbedrag ter zake van de diagnose behandeling combinaties waarvoor een gereguleerd tarief gold die in
      het laatste budgetjaar zijn geopend en afgesloten,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.a.3°
    text: |-
      50% van het schadelastbedrag ter zake van de diagnose behandeling combinaties waarvoor een gereguleerd tarief gold
      en die in het laatste budgetjaar zijn geopend en in het daaropvolgende kalenderjaar zijn afgesloten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.b
    text: |-
      bepaalt per zorgaanbieder het quotiënt van 50% van het schadelastbedrag, bedoeld in onderdeel a, onder 3º, en van
      de uitkomst van onderdeel a;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.c
    text: vermenigvuldigt de uitkomst van onderdeel b met het opbrengstverschil van de zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.d
    text: |-
      vermenigvuldigt per zorgaanbieder de uitkomst van onderdeel c met het percentage opbrengstverschil voor de
      zorgverzekeraar, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.3.2.e
    text: sommeert per zorgverzekeraar de uitkomsten per zorgaanbieder van onderdeel d.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
  - number: 6.7.4
    text: |-
      De verrekening, bedoeld in [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref1], vindt plaats bij de
      vaststelling van de vereveningsbijdrage over het laatste budgetjaar van de aangewezen categorie van zorgaanbieders.


      [ref1]: https://wetten.overheid.nl/BWBR0034659#ArtikelIIIa
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.4
    references:
      - id: ref1
        bwb_id: BWBR0034659
        artikel: IIIa
  - number: 6.8.1
    text: |-
      Het Zorginstituut verstrekt aan het landelijk politiekorps, bedoeld in
      [artikel 25, eerste lid, van de Politiewet 2012][ref1], uitkeringen ter vergoeding van de kosten van zorg
      en overige diensten als bedoeld in [artikel 11, eerste lid, van de Zorgverzekeringswet][ref2] verleend door
      zorgaanbieders aan personen die zijn opgenomen in het stelsel van Bewaken & Beveiligen van het Openbaar Ministerie
      en aan wie de maatregel anonimiteit is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.8
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 6.8.2
    text: |-
      De in het eerste lid bedoelde uitkeringen worden uitsluitend verstrekt op verzoek van het landelijk politiekorps,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.8
  - number: 6.9.1.1
    text: |-
      Het Zorginstituut verstrekt patiënten en zorgaanbieders uit een lidstaat van de Europese Unie op verzoek algemene
      informatie over de rechten en aanspraken op grensoverschrijdende zorg, in het bijzonder over de voorwaarden met
      betrekking tot de vergoeding van zorgkosten, de procedures voor toegang tot en vaststelling van aanspraken en de
      rechtsmiddelen die daarbij voor hen openstaan en de namen en contactgegevens van de nationale contactpunten in
      andere lidstaten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.1
  - number: 6.9.1.2
    text: |-
      In de informatie wordt duidelijk onderscheid gemaakt tussen de rechten die patiënten hebben op grond van Richtlijn
      2011/24/EU en Verordening (EG) Nr. 883/2004 van het Europees Parlement en de Raad van 29 april 2004, betreffende de
      coördinatie van socialezekerheidsstelsels (Pb EU 2004, L 166).
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.1
  - number: 6.9.2.1
    text: |-
      Het Zorginstituut verstrekt patiënten uit een andere lidstaat van wie de behandeling in Nederland plaatsvindt op
      verzoek informatie over: - zorgaanbieders, waaronder informatie over het recht van een specifieke zorgaanbieder om
      diensten te verlenen of mogelijke beperkingen ten aanzien van zijn praktijk;
        - patiëntenrechten, klachtenregelingen en rechtsmiddelen overeenkomstig de Nederlandse wetgeving;
        - de wettelijke en bestuursrechtelijke opties om geschillen te beslechten, onder meer als schade ontstaat als
      gevolg van zorg die wordt verleend of voorgeschreven in Nederland;
        - kwaliteits- en veiligheidsnormen en -richtsnoeren die in Nederland zijn vastgesteld, inclusief de bepalingen over
      toezicht op en beoordeling van zorgaanbieders en over de vraag op welke zorgaanbieders deze normen en richtsnoeren
      van toepassing zijn;
        - informatie over de toegankelijkheid van ziekenhuizen voor personen met een handicap.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.2
  - number: 6.9.2.2
    text: |-
      De informatie wordt gemakkelijk toegankelijk gemaakt en voor zover nodig met elektronische middelen en in een voor
      personen met een handicap toegankelijk formaat beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.2
  - number: 6.9.3.1
    text: |-
      Het Zorginstituut overlegt met patiëntenorganisaties, zorgaanbieders en zorgverzekeraars over de uitvoering van
      Richtlijn 2011/24/EU.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.3
  - number: 6.9.3.2
    text: |-
      Het Zorginstituut werkt nauw samen met de Europese Commissie en bevordert informatie-uitwisseling met andere
      nationale contactpunten.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.3
  - number: 6.9.3.3
    text: Het Zorginstituut verleent andere lidstaten alle bijstand die voor de uitvoering van Richtlijn 2011/24/EU nodig is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.3
  - number: 6.9.4
    text: |-
      Het Zorginstituut verstrekt patiënten informatie over de gegevens die op grond van Uitvoeringsrichtlijn 2012/52/
      EU van de Commissie tot vaststelling van maatregelen om de erkenning van in een andere lidstaat verstrekte medische
      recepten te vergemakkelijken (Pb EU 2012, L 356) moeten worden opgenomen in recepten die worden verstrekt in een
      andere lidstaat dan de lidstaat waar de genees- of hulpmiddelen worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.4
  - number: 6.9.5
    text: Het Zorginstituut betrekt met ingang van 1 januari 2017 het CAK bij de uitvoering van deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.9.5
  - number: 6a.1
    text: |-
      De Sociale verzekeringsbank wordt aangewezen als de publiekrechtelijke rechtspersoon, bedoeld in
      [artikel 13a, achtste lid, van de Zorgverzekeringswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel13a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 13a
  - number: 6a.2.1
    text: |-
      De ondersteuning, bedoeld in [artikel 13a van de Zorgverzekeringswet][ref1] bestaat uit:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel13a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 13a
  - number: 6a.2.1.a
    text: |-
      het namens de verzekerde die ten aanzien van zijn zorgverlener inhoudingsplichtige is, indienen van declaraties bij
      zijn zorgverzekeraar, ontvangen van de vergoedingen van zijn zorgverzekeraar, betalen van zijn zorgverleners met de
      ontvangen vergoedingen, voeren van een salarisadministratie en doen van aangiften en afdrachten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.2
  - number: 6a.2.1.b
    text: |-
      de verzekerde bijstaan of doen bijstaan in zijn werkgeverstaken of opdrachtgeverschap waaronder ten aanzien van
      ziekte, ontslag, arbeidsomstandighedenregelgeving, zaakschade, aansprakelijkheid en rechtsbijstand.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.2
  - number: 6a.2.2
    text: De ondersteuning wordt kosteloos verstrekt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.2
  - number: 6a.3.1
    text: |-
      De Sociale verzekeringsbank stelt voorwaarden aan het verkrijgen van de ondersteuning voor zover dit voor de
      uitvoerbaarheid van de ondersteuning redelijkerwijs van belang is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.3
  - number: 6a.3.2
    text: De Sociale verzekeringsbank legt haar werkwijze vast en informeert verzekerden en zorgverzekeraars hierover.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.3
  - number: 6a.4.1
    text: |-
      De verzekerde verleent medewerking aan de Sociale verzekeringsbank voor zover dat van hem ten behoeve van de
      uitvoerbaarheid van de ondersteuning redelijkerwijs kan worden verwacht.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.4
  - number: 6a.4.2
    text: |-
      De verzekerde doet aan de Sociale verzekeringsbank op verzoek of onverwijld uit eigen beweging mededeling van
      gegevens waarvan hem redelijkerwijs duidelijk moet zijn dat zij noodzakelijk zijn voor het uitvoeren van de
      ondersteuning.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.4
  - number: 6a.5
    text: |-
      De Sociale verzekeringsbank kan de ondersteuning geheel of gedeeltelijk weigeren, opschorten of beëindigen indien
      de verzekerde niet meer beschikt over een Zvw-pgb of indien niet of niet langer wordt voldaan aan het gestelde bij
      of krachtens de [artikelen 6a.3][ref1] en [6a.4][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel6a
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel6a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.5
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: 6a
        hoofdstuk: 6a
      - id: ref2
        bwb_id: BWBR0018715
        artikel: 6a
        hoofdstuk: 6a
  - number: 6a.6.1
    text: De Minister verstrekt de Sociale verzekeringsbank jaarlijks een bijdrage voor de kosten van de ondersteuning.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.6
  - number: 6a.6.2
    text: |-
      De Sociale verzekeringsbank dient vóór 1 oktober een aanvraag, voorzien van een begroting met toelichting, tot
      verlening van een bijdrage voor het daaropvolgende jaar in bij de Minister.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.6
  - number: 6a.6.3
    text: |-
      Binnen 13 weken na ontvangst van de aanvraag besluit de Minister over het verlenen van de bijdrage en van
      voorschotten op de bijdrage.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.6
  - number: 6a.6.4
    text: |-
      De Minister kan de Sociale verzekeringsbank bij de verlening van de bijdrage verplichtingen opleggen met betrekking
      tot de uitvoering van de ondersteuning of het verkrijgen van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.6
  - number: 6a.6.5
    text: |-
      Na afloop van het jaar waarvoor de bijdrage is verstrekt, dient de Sociale verzekeringbank vóór 1 juli een
      aanvraag, voorzien van een financieel verslag met toelichting, tot vaststelling van de bijdrage in bij de Minister.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.6
  - number: 6a.6.6
    text: Binnen 13 weken na ontvangst van de aanvraag besluit de Minister over het vaststellen van de bijdrage.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6a.6
  - number: 7.1.1
    text: |-
      Als persoonsgegevens, waaronder gegevens over gezondheid, die voor een zorgverzekeraar noodzakelijk zijn voor de
      uitvoering van de zorgverzekering of van de [Zorgverzekeringswet][ref1] worden aangemerkt de in [artikel 7.2][ref2]
      bedoelde persoonsgegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.1.2
    text: |-
      Een zorgverzekeraar mag de in het eerste lid bedoelde gegevens gebruiken voor het verrichten van formele controle
      dan wel materiële controle ten behoeve van:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
  - number: 7.1.2.a
    text: de geheel of gedeeltelijke betaling aan een zorgaanbieder;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
  - number: 7.1.2.b
    text: |-
      de geheel of gedeeltelijke vergoeding aan een verzekerde van het in rekening gebrachte tarief voor aan een
      verzekerde geleverde prestatie;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
  - number: 7.1.2.c
    text: de vaststelling van de eigen bijdragen van een verzekerde;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
  - number: 7.1.2.d
    text: de vaststelling van een verplicht of vrijwillig eigen risico van een verzekerde, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
  - number: 7.1.2.e
    text: het verrichten van fraudeonderzoek.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
  - number: 7.1.3
    text: Een zorgverzekeraar mag de in het eerste lid bedoelde gegevens gebruiken voor het uitoefenen van verhaalsrecht.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.1
  - number: '7.2'
    text: |-
      De zorgverzekeraar beschikt ten behoeve van de in het voorgaande artikel aangegeven doelen en van de uitvoering van
      [artikel 7.4a][ref1], over de volgende gegevens van de verzekerde:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2.a
    text: naam, adres, postcode en woonplaats;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2.b
    text: polisnummer, burgerservicenummer, geslacht en geboortedatum;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2.c
    text: de prestatiebeschrijving van de aan de verzekerde geleverde prestatie;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2.d
    text: |-
      wanneer en in voorkomend geval ten gevolge van welke catastrofe als bedoeld in
      [artikel 33, eerste lid, onderdeel a, van de Zorgverzekeringswet][ref1], de prestatie is geleverd;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '33'
  - number: 7.2.e
    text: het voor de geleverde prestatie in rekening gebrachte tarief;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2.f
    text: de gegevens die op grond van een declaratieregeling moeten worden verstrekt;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2.g
    text: |-
      de gegevens die noodzakelijk zijn om vast te stellen of de prestatie behoort tot het verzekerde pakket van die
      verzekerde en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2.h
    text: het bank- of girorekeningnummer;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2.i
    text: overige gegevens die noodzakelijk zijn voor het verrichten van materiële controle dan wel fraudeonderzoek.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2
  - number: 7.2a.1
    text: |-
      Dit artikel is van toepassing indien een zorgaanbieder de kosten van gespecialiseerde geestelijke gezondheidszorg
      door tussenkomst van VECOZO B.V. in rekening brengt bij een zorgverzekeraar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
  - number: 7.2a.2
    text: |-
      Mits vermeld in een declaratieregeling die van toepassing is voor een zorgaanbieder, bedoeld in het
      eerste lid, beschikt de zorgverzekeraar, met inachtneming van het bepaalde bij of krachtens dit artikel,
      over het gegeven zorgvraagzwaarte van de verzekerde voor de analyses en controles als bedoeld in de
      [artikelen 7.6 tot en met 7.9][ref1], met het oog op de uitvoering van formele en materiële controle ten
      behoeve van de in [artikel 7.1, tweede lid][ref2], aangegeven doelen en voor zover dat noodzakelijk is voor de
      zorgverzekeraar om te voldoen aan zijn verplichting om gegevens te leveren aan het Zorginstituut ten behoeve van de
      uitvoering van de [Zorgverzekeringswet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0018450
  - number: 7.2a.3
    text: |-
      De zorgaanbieder, bedoeld in het eerste lid, verstrekt de gegevens die op grond van het bij of krachtens
      [artikel 38 van de Wet marktordening gezondheidszorg][ref1] bepaalde moeten worden verstrekt, aan de
      zorgverzekeraar door tussenkomst van VECOZO B.V.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '38'
  - number: 7.2a.4
    text: |-
      Het gegeven zorgvraagzwaarte, bedoeld in het tweede lid, wordt door VECOZO B.V. gemaskeerd alvorens VECOZO B.V. dat
      gemaskeerde gegeven, met de overige gegevens bedoeld in het derde lid, aan de zorgverzekeraar verstrekt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
  - number: 7.2a.5
    text: |-
      De zorgverzekeraar ontvangt de door de zorgaanbieder verstrekte gegevens, bedoeld in het derde lid, van VECOZO
      B.V., waarbij het gegeven zorgvraagzwaarte van de verzekerde is gemaskeerd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
  - number: 7.2a.6
    text: |-
      De zorgverzekeraar verstrekt gegevens bedoeld in het vijfde lid aan Vektis C.V. ten behoeve van het maken van
      analyses voor zorgaanbieders en zorgverzekeraars die noodzakelijk zijn voor de uitvoering van de zorgverzekering
      of de [Zorgverzekeringswet][ref1] en ten behoeve van het verrichten van controle of fraudeonderzoek, waarbij het
      gegeven zorgvraagzwaarte van de verzekerde is gemaskeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 7.2a.7
    text: |-
      Vektis C.V. ontvangt de door de zorgaanbieder verstrekte gegevens, bedoeld in het derde lid, van VECOZO B.V.,
      waarbij het gegeven zorgvraagzwaarte van de verzekerde niet is gemaskeerd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
  - number: 7.2a.8
    text: |-
      Vektis C.V. verstrekt op verzoek van een zorgverzekeraar aan die zorgverzekeraar het gegeven zorgvraagzwaarte
      indien en voor zover dat noodzakelijk is voor de zorgverzekeraar om te voldoen aan zijn verplichting om gegevens te
      leveren aan het Zorginstituut ten behoeve van de uitvoering van de [Zorgverzekeringswet][ref1], nadat het gegeven
      zorgvraagzwaarte door Vektis C.V. is versleuteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 7.2a.9
    text: |-
      De zorgverzekeraar verstrekt op verzoek van het Zorginstituut aan deze het gegeven zorgvraagzwaarte, zoals dat
      gegeven door Vektis C.V. is versleuteld, ten behoeve van de uitvoering van de [Zorgverzekeringswet][ref1] door
      het Zorginstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 7.2a.10
    text: |-
      Vektis C.V. verstrekt op verzoek van het Zorginstituut aan deze de sleutel om het door Vektis C.V. versleutelde
      gegeven zorgvraagzwaarte te ontsleutelen ten behoeve van de uitvoering van de [Zorgverzekeringswet][ref1] door
      het Zorginstituut.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2a
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 7.2b.1
    text: |-
      VECOZO B.V. en Vektis C.V. dragen zorg voor passende technische en organisatorische maatregelen om persoonsgegevens
      te beveiligen bij de verwerkingen, bedoeld in [artikel 7.2a][ref1], tegen verlies of tegen enige vorm van
      onrechtmatige verwerking.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2b.2
    text: |-
      De door Vektis C.V. aan zorgaanbieders en zorgverzekeraars te verstrekken analyses, bedoeld in
      [artikel 7.2a][ref1], bevatten geen tot individuele verzekerden te herleiden zorgvraagzwaartegegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2b.3
    text: |-
      Voor VECOZO B.V. en Vektis C.V. gelden dezelfde wettelijke voorschriften inzake geheimhouding van de verwerkte
      gegevens, bedoeld in [artikel 7.2a][ref1], als voor de zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2b.4
    text: |-
      Personen werkzaam bij of ten behoeve van VECOZO B.V. en Vektis C.V. voor wie niet reeds uit hoofde van ambt
      of beroep een geheimhoudingplicht geldt, zijn verplicht tot geheimhouding van de gegevens die zij op grond van
      [artikel 7.2a][ref1] verwerken, behoudens voor zover enig wettelijk voorschrift hen tot mededeling verplicht.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2b.5
    text: |-
      De zorgverzekeraar beschikt niet over de sleutel om het versleutelde gegeven zorgvraagzwaarte, bedoeld in
      [artikel 7.2a][ref1] te ontsleutelen.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2b.6
    text: |-
      De zorgverzekeraar beschikt, met inachtneming van het bepaalde in de [artikelen 7.5 tot en met 7.11][ref1]
      inzake de uitvoering van materiële controle, over het gegeven zorgvraagzwaarte indien op grond van analyse op
      basis van geaggregeerde gegevens of naar aanleiding van een ander signaal er reden is voor het instellen van
      nadere formele of materiële controles, met dien verstande dat indien en voor zover dat noodzakelijk is voor die
      controles, het gegeven zorgvraagzwaarte van de patiënt of de gegevens die noodzakelijk zijn voor het onderbouwen
      en afleiden van het gegeven zorgvraagzwaarte van de desbetreffende patiënt herleidbaar naar die individuele patiënt
      wordt, respectievelijk worden verwerkt onder verantwoordelijkheid van een medisch adviseur in opdracht van de
      zorgverzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2b.7
    text: |-
      De zorgautoriteit kan in een declaratieregeling, bedoeld in [artikel 7.2a, tweede lid][ref1], en onder daarbij te
      stellen voorwaarden, voorschriften of beperkingen, bepalen:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.2b.7.a
    text: op welke wijze het gegeven zorgvraagzwaarte moet worden gemaskeerd en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
  - number: 7.2b.7.b
    text: dat de verplichting tot verstrekken van het gegeven zorgvraagzwaarte bij uitzondering niet van toepassing is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2b
  - number: 7.2c.1
    text: |-
      Dit artikel is van toepassing indien de verzekerde of de zorgaanbieder namens de verzekerde de kosten van
      gespecialiseerde geestelijke gezondheidszorg zonder tussenkomst van VECOZO B.V. in rekening brengt bij diens
      zorgverzekeraar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2c
  - number: 7.2c.2
    text: |-
      De zorgverzekeraar beschikt, met inachtneming van het bepaalde bij of krachtens dit artikel, niet over het tot een
      individuele verzekerde te herleiden zorgvraagzwaartegegeven.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2c
  - number: 7.2c.3
    text: |-
      De zorgaanbieder, bedoeld in het eerste lid, verstrekt de gegevens, die op grond van het bij of krachtens
      [artikel 38 van de Wet marktordening gezondheidszorg][ref1] bepaalde moeten worden verstrekt aan de verzekerde of
      namens een verzekerde aan diens zorgverzekeraar, zonder tussenkomst van VECOZO B.V.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2c
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '38'
  - number: 7.2c.4
    text: |-
      Het [zesde en zevende lid van artikel 7.2b][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.2c
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.1
    text: |-
      De zorgaanbieder is verplicht tenzij bij of krachtens deze regeling anders wordt bepaald de in
      [artikel 7.2, onderdeel a tot en met g][ref1], bedoelde gegevens te verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.1.a
    text: |-
      de zorgverzekeraar, of een door die zorgverzekeraar daartoe aangewezen persoon, indien die zorgaanbieder het tarief
      voor de geleverde prestatie krachtens een door hem met de zorgverzekeraar gesloten overeenkomst rechtstreeks bij
      die zorgverzekeraar in rekening brengt;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.3
  - number: 7.3.1.b
    text: de verzekerde, indien de zorgaanbieder het tarief voor de geleverde prestatie bij de verzekerde in rekening brengt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.3
  - number: 7.3.2
    text: |-
      De zorgaanbieder is verplicht de in [artikel 7.2, onderdeel i][ref1], bedoelde gegevens desgevraagd te verstrekken
      aan de zorgverzekeraar of aan een door die zorgverzekeraar daartoe aangewezen persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.3
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.3.3
    text: |-
      Voor de door de zorgverzekeraar of de verwerker aangewezen persoon gelden dezelfde wettelijke voorschriften inzake
      de geheimhouding van de verwerkte gegevens als voor de zorgverzekeraar of de verwerker die hem heeft aangewezen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.3
  - number: 7.4.1
    text: |-
      De zorgverzekeraar verricht materiële controle op de wijze zoals bepaald in de
      [artikelen 7.2a tot en met 7.2c][ref1] en [7.5 tot en met 7.9][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.2
    text: |-
      De zorgaanbieder is verplicht zijn medewerking te verlenen aan de overeenkomstig het eerste lid uitgevoerde
      materiële controle.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4
  - number: 7.4.3
    text: |-
      De zorgverzekeraar verricht fraudeonderzoek op de wijze zoals bepaald in [artikel 7.10][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.4.4
    text: |-
      De zorgaanbieder is verplicht zijn medewerking te verlenen aan overeenkomstig het derde lid uitgevoerd
      fraudeonderzoek.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4
  - number: 7.4a
    text: |-
      De zorgverzekeraar verstrekt aan het CAK voor 1 oktober van het jaar waarin een uitkering als bedoeld in
      [artikel 118a van de wet][ref1] wordt verstrekt, van zijn verzekerden of gewezen verzekerden die in dat jaar de
      leeftijd van achttien jaar hebben bereikt of nog zullen bereiken en die in de twee kalenderjaren, voorafgaande
      aan dat jaar voldoen aan de voorwaarden, bedoeld in [artikel 8.3, eerste lid][ref2], of in een DKG als bedoeld in
      artikel 8.3, tweede lid, zijn ingedeeld, de volgende persoonsgegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118a
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel8
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4a
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 118a
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '8'
        hoofdstuk: '8'
  - number: 7.4a.a
    text: het burgerservicenummer;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4a
  - number: 7.4a.b
    text: het bank- of girorekeningnummer.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.4a
  - number: 7.5.1
    text: |-
      De zorgverzekeraar stelt voorafgaand aan de uitvoering van materiële controle het doel ervan vast door te bepalen
      wanneer voldoende zekerheid is verkregen dat de door de zorgaanbieder in rekening gebrachte prestatie is geleverd
      of die geleverde prestatie het meest was aangewezen gezien de gezondheidstoestand van de verzekerde. Bij de
      vaststelling neemt de zorgverzekeraar het bij of krachtens de [Wet marktordening gezondheidszorg][ref1] door de
      Nederlandse Zorgautoriteit bepaalde met betrekking tot het uitvoeren van controles in acht.


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 7.5.2
    text: |-
      De vaststelling door de zorgverzekeraar wanneer voldoende zekerheid is verkregen dat de geleverde prestatie het
      meest was aangewezen gezien de gezondheidstoestand van de verzekerde, geschiedt met inachtneming van het bepaalde
      in [artikel 2.1 van het Besluit zorgverzekering][ref1] en zodanig dat voor verzekerden en zorgaanbieders zoveel
      mogelijk inzichtelijk is welke maatstaven daarbij gelden.


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 7.5.3
    text: |-
      De zorgverzekeraar mag verzekerden met gebruikmaking van persoonsgegevens waarover hij in verband met de uitvoering
      van de zorgverzekering reeds beschikt enquêteformulieren zenden om onderzoek te doen
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
  - number: 7.5.3.1°
    text: of de in rekening gebrachte zorg daadwerkelijk is verleend, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
  - number: 7.5.3.2°
    text: |-
      naar de door die verzekerden ervaren kwaliteit van de verzekerde zorg die een zorgaanbieder verleent of heeft
      verleend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
  - number: 7.5.4
    text: |-
      Bij de verzending van enquêteformulieren als bedoeld in het derde lid informeert de zorgverzekeraar de verzekerde
      erover dat hij niet verplicht is tot beantwoording van de gestelde vragen en dat onthouden van medewerking op geen
      enkele wijze tot zijn nadeel zal strekken.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
  - number: 7.5.5
    text: |-
      De zorgverzekeraar draagt er zorg voor dat terug ontvangen enquêteformulieren als bedoeld in het derde lid,
      onderdeel 2°, niet herleidbaar zijn tot personen en dat niet herleidbaar is welke verzekerden geen formulier hebben
      teruggestuurd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.5
  - number: 7.6.1
    text: |-
      De zorgverzekeraar voert een algemene risicoanalyse uit op basis van gegevens waarover deze in verband met de
      uitvoering van de zorgverzekering beschikt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.6
  - number: 7.6.2
    text: |-
      De zorgverzekeraar stelt op basis van de in het eerste lid uitgevoerde algemene risicoanalyse een algemeen
      controleplan vast, waarin de objecten van materiële controle en de in te zetten controle-instrumenten zijn
      opgenomen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.6
  - number: 7.6.3
    text: |-
      Het naar aanleiding van de algemene risicoanalyse opgestelde algemene controleplan voorziet niet in de inzet van
      het controle-instrument detailcontrole.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.6
  - number: 7.6.4
    text: |-
      Indien uit het uitgevoerde algemene controleplan blijkt dat het controledoel, bedoeld in
      [artikel 7.5, eerste lid][ref1], is bereikt, kan alleen detailcontrole worden uitgevoerd als er van een ander dan
      de zorgverzekeraar afkomstige of uit de uitgevoerde controle voortvloeiende aanwijzingen zijn waaruit blijkt dat er
      sprake is van onvoldoende zekerheid.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.6
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: '7.7'
    text: |-
      De zorgverzekeraar maakt informatie openbaar over het ingevolge [artikel 7.5][ref1] vastgestelde controledoel en
      het ingevolge [artikel 7.6][ref2] vastgestelde algemene controleplan op een zodanige wijze dat die informatie voor
      verzekerden en zorgaanbieders gemakkelijk verkrijgbaar is.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.7
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.8.1
    text: 'De zorgverzekeraar voert geen detailcontrole uit, dan nadat is voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.8.1.a
    text: |-
      de zorgverzekeraar heeft een specifieke risicoanalyse verricht op de bevindingen uit het uitgevoerde algemene
      controleplan bedoeld in [artikel 7.6, tweede lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.8.1.b
    text: |-
      de zorgverzekeraar heeft naar aanleiding van de specifieke risicoanalyse een specifiek controleplan en specifiek
      controledoel opgesteld, waarin de objecten van materiële controle en de methoden van detailcontrole zijn opgenomen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.8.1.c
    text: |-
      het overeenkomstig onderdeel b vastgestelde specifieke doel van de materiële controle kan zonder detailcontrole
      niet worden bereikt;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.8.1.d
    text: |-
      uit het specifieke controleplan blijkt dat de detailcontrole niet verder gaat dan gelet op het met het
      onderzoeksdoel en de omstandigheden van het te onderzoeken geval noodzakelijk is;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.8.1.e
    text: |-
      de zorgverzekeraar heeft de zorgaanbieder voorafgaand aan de uitvoering van de detailcontrole toereikende – en op
      verzoek van de zorgaanbieder schriftelijke – informatie verstrekt waarin wordt gemotiveerd hoe is voldaan aan de in
      dit lid genoemde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.8.2
    text: |-
      Indien bij de uitvoering van detailcontrole persoonsgegevens van verzekerden worden verwerkt, geschiedt dit onder
      verantwoordelijkheid van een medisch adviseur in opdracht van de zorgverzekeraar en is deze op voorafgaand verzoek
      van de zorgaanbieder aanwezig bij dit deel van de controle.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.8.3
    text: |-
      In afwijking van het eerste lid kan de zorgverzekeraar met betrekking tot een individuele verzekerde detailcontrole
      uitvoeren zonder dat de in dat lid genoemde voorwaarden van toepassing zijn, indien deze verzekerde ten behoeve
      van de materiële controle schriftelijk toestemming aan de zorgaanbieder heeft gegeven voor verstrekking van hem
      betreffende gegevens over gezondheid aan de zorgverzekeraar. De zorgverzekeraar verwerkt bij de detailcontrole niet
      meer gegevens dan gelet op het onderzoeksdoel en de omstandigheden van het geval noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.8.4
    text: |-
      De zorgverzekeraar informeert de zorgaanbieder over de zakelijke inhoud van de voorgenomen uitkomsten van de
      detailcontrole en stelt de zorgaanbieder in de gelegenheid daarop binnen een redelijke termijn te reageren. De
      zorgverzekeraar betrekt de reactie van de zorgaanbieder bij de vaststelling van de definitieve uitkomsten van de
      detailcontrole en bericht deze uitkomsten aan de zorgaanbieder.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.8
  - number: 7.9.1
    text: |-
      De zorgverzekeraar legt de specifieke risicoanalyse en de uitvoering van detailcontroles in zijn administratie
      vast om toetsing door en verantwoording aan toezichthouders mogelijk te maken. Daarbij worden niet meer
      persoonsgegevens, waaronder gegevens over gezondheid, verwerkt dan voor dit doel noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.9
  - number: 7.9.2
    text: |-
      De zorgverzekeraar bewaart na detailcontroles de daarbij verwerkte persoonsgegevens van verzekerden niet langer dan
      noodzakelijk is voor het doel waarvoor zij zijn verkregen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.9
  - number: 7.10.1
    text: |-
      Bij fraudeonderzoek zijn de voorwaarden bedoeld in [artikel 7.8, eerste lid, onderdelen b en d][ref1], van
      overeenkomstige toepassing, en is de in onderdeel e bedoelde voorwaarde van overeenkomstige toepassing voor zo ver
      het onderzoeksbelang of het belang van de bescherming van de persoonlijke levenssfeer van de betrokken verzekerde
      zich daar niet tegen verzet.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.10
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7.10.2
    text: |-
      In afwijking van het eerste lid kan de zorgverzekeraar met betrekking tot een individuele verzekerde detailcontrole
      uitvoeren zonder dat de in dat lid genoemde voorwaarden van toepassing zijn, indien deze verzekerde ten behoeve
      van het fraudeonderzoek schriftelijk toestemming heeft gegeven voor verstrekking van hem betreffende gegevens over
      gezondheid aan de zorgverzekeraar. De zorgverzekeraar verwerkt bij de detailcontrole niet meer gegevens dan gelet
      op het onderzoeksdoel en de omstandigheden van het geval noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.10
  - number: '7.11'
    text: |-
      De zorgverzekeraar verwerkt de persoonsgegevens, bedoeld in [artikel 87, eerste en tweede lid, van de wet][ref1]
      slechts verder voor de uitvoering van de zorgverzekering en de aanvullende ziektekostenverzekering indien en voor
      zo ver dit noodzakelijk is voor de doelen omschreven in [artikel 7.1][ref2] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7.11
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '87'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7'
        hoofdstuk: '7'
  - number: 7a.1.1
    text: |-
      De gegevens als bedoeld in [artikel 122a, tiende lid, van de Zorgverzekeringswet][ref1], bestaan uit:


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 122a
  - number: 7a.1.1.a
    text: de prestatiebeschrijving van de aan de vreemdeling geleverde prestatie;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7a.1
  - number: 7a.1.1.b
    text: het voor de geleverde prestatie in rekening gebrachte tarief;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7a.1
  - number: 7a.1.1.c
    text: |-
      de in verband met het voor die prestatie in rekening gebrachte tarief ontvangen betalingen of vergoedingen van de
      vreemdeling, zijn verzekeraar of derden;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7a.1
  - number: 7a.1.1.d
    text: de leeftijd, de nationaliteit, de initialen en het geslacht van de vreemdeling.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7a.1
  - number: 7a.1.2
    text: Bij de gegevens, bedoeld in het eerste lid, wordt vermeld wanneer de prestatie is geleverd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7a.1
  - number: 7b.1.1
    text: |-
      Als uitvoering van de zorgverzekeringen en de [Zorgverzekeringswet][ref1], bedoeld in
      [artikel 89, eerste lid, van de Zorgverzekeringswet][ref2], worden in ieder geval aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel89
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '89'
  - number: 7b.1.1.a
    text: |-
      werkzaamheden gericht op het voorkomen of verminderen van achterstand van de betaling door een verzekeringnemer
      van de premie, het verplicht eigen risico, het vrijwillig eigen risico, de eigen bijdragen, de eigen betalingen, de
      rente, de incasso- en deurwaarderskosten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.1.b
    text: |-
      werkzaamheden die erop gericht zijn te bewerkstelligen dat een verzekeringnemer niet langer een bestuursrechtelijke
      premie verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.2
    text: |-
      Voor de uitvoering van de werkzaamheden bedoeld in het eerste lid is het noodzakelijk dat de zorgverzekeraar en het
      college van burgemeester en wethouders de volgende gegevens uitwisselen:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.2.a
    text: |-
      naam, adres, postcode, woonplaats, telefoonnummer, e-mailadres, geboortedatum en burgerservicenummer van de op de
      zorgpolis vermelde verzekeringnemer en verzekerden;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.2.b
    text: |-
      het unieke zorgverzekeraarsidentificatienummer van de zorgverzekeraar, de zorgpolis en gegevens over de toepassing
      van [artikel 18 van de Zorgverzekeringswet][ref1] ten behoeve van de verzekeringnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '18'
  - number: 7b.1.2.c
    text: |-
      de door de verzekeringnemer verschuldigde bedragen met betrekking tot de premie, het verplicht eigen risico, het
      vrijwillig eigen risico, de eigen bijdragen, de eigen betalingen, de rente, de incasso- en deurwaarderskosten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.2.d
    text: |-
      gegevens over de toepassing van [afdeling 3.3.2 van de Zorgverzekeringswet][ref1] door de zorgverzekeraar ten
      aanzien van de verzekeringnemer;


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Afdeling3.3.2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        afdeling: 3.3.2
  - number: 7b.1.2.e
    text: |-
      de bedragen die op de bijstand, bedoeld in [artikel 5 van de Participatiewet][ref1], van de verzekeringnemer ten
      behoeve van de zorgverzekeraar worden ingehouden en betaalbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0015703#Artikel5
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0015703
        artikel: '5'
  - number: 7b.1.3
    text: |-
      Voor de uitvoering van de werkzaamheden bedoeld in het eerste lid, onderdeel b, verstrekt het CAK op verzoek aan
      het college van burgemeester en wethouders de volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.3.a
    text: naam, adres, postcode, woonplaats, geboortedatum en burgerservicenummer van de verzekeringnemer;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.3.b
    text: het unieke zorgverzekeraarsidentificatienummer van de zorgverzekeraar;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
  - number: 7b.1.3.c
    text: |-
      de door de verzekeringnemer verschuldigde bestuursrechtelijke premie, bedoeld in
      [artikel 18d, eerste lid, van de Zorgverzekeringswet][ref1], de datum vanaf wanneer de verzekeringnemer de
      bestuursrechtelijke premie verschuldigd is en de wijze van inning van de bestuursrechtelijke premie.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7b.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 18d
  - number: '8.1'
    text: |-
      Indien de verzekerde op het tijdstip van inwerkingtreding van deze regeling in het bezit is van een hoortoestel
      als bedoeld in [artikel 2.14, eerste lid, onderdeel a][ref1], wordt dit toestel voor de toepassing van
      [artikel 2.14, derde tot en met het zesde lid][ref2], beschouwd als te zijn verstrekt op grond van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel8.1
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 8.2.1
    text: |-
      Ter zake van het verlenen van zorg of diensten in ziekenhuizen en medisch-specialistische zorg anders dan in
      ziekenhuizen, is [artikel 118, eerste lid, van de Zorgverzekeringswet][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel118
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel8.2
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '118'
  - number: 8.2.2
    text: |-
      Het eerste lid is niet van toepassing op instellingen waarin een enkelvoudige onderzoek- of behandelfunctie wordt
      uitgeoefend, klinische revalidatie-instellingen, centra voor epileptici, brandwondencentra en astmacentra.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel8.2
  - number: '8.4'
    text: |-
      Deze regeling treedt in werking met ingang van 1 januari 2006, met uitzondering van de [artikelen 2.2][ref1] en
      [2.3][ref2] die in werking treden met ingang van 1 januari 2007.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel8.4
    references:
