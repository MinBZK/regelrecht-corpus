$id: regeling_zorgverzekering
regulatory_layer: WET
publication_date: '2014-12-19'
valid_from: '2026-03-21'
bwb_id: BWBR0018715
url: https://wetten.overheid.nl/BWBR0018715/2026-03-21
preamble:
  text: |-
    Handelende in overeenstemming met de Minister van Financiën en de Minister van Sociale Zaken en Werkgelegenheid,

    Gelet op de artikelen 32, vierde lid, 35, vierde lid, 38, tweede lid, 39, vierde lid, 40, vijfde, tiende en elfde
    lid, 43, tweede lid, 45, tweede en vierde lid, 46, eerste lid, 47, 50, vierde lid, 52, 53, 59, negende lid, 68,
    eerste tot en met vierde lid, 69, tweede en vijfde lid, 70, elfde lid, 75, derde en vierde lid, 87, derde en zesde
    lid, 88, vierde lid, 89, zesde lid, 106, derde lid, 118, eerste lid, van de Zorgverzekeringswet en de artikelen
    2.4, tweede en derde lid, 2.7, zesde lid,2.8, eerste, tweede, vijfde en zesde lid, 2.9, 2.12, tweede lid, 2.14,
    tweede lid, 2.16, 3.1, tweede lid, 3.3, derde lid, 3.4, tweede lid, 3.5, derde lid, 3.6, derde lid, 3.8, vierde
    lid, 3.9, eerste, derde, vierde en vijfde lid, 3.10, eerste en tweede lid, 3.11, eerste tot en met derde lid, 3.12,
    eerste tot en met derde lid, 3.15 derde lid en 3.17 van het Besluit zorgverzekering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'Deze regeling verstaat onder:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.a
    text: 'de Minister: de Minister van Volksgezondheid, Welzijn en Sport;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.b
    text: |-
      specialité: een geneesmiddel als bedoeld in [artikel 1, eerste lid, onderdeel p, van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 1.1.c
    text: |-
      preparaat: een geneesmiddel als bedoeld in [artikel 1, eerste lid, onderdeel q, van de Geneesmiddelenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel1
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '1'
  - number: 1.1.d
    text: |-
      branded generic: een specialité die in de handel wordt gebracht onder een benaming waarin de stofnaam is vermeld en
      waaraan een merkaanduiding is toegevoegd;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.e
    text: 'combinatiepreparaat: een geneesmiddel dat meer dan één werkzaam bestanddeel bevat;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.f
    text: |-
      registerdossier: uittreksel van het register, bedoeld in [artikel 53 van de Geneesmiddelenwet][ref1] en een
      afschrift van de in [artikel 46, tweede lid, van die wet][ref2] bedoelde goedkeuring van de samenvatting van
      productkenmerken dan wel een afschrift van de vergunning, bedoeld in artikel 3, eerste lid, van de [Verordening
      (EG) nr. 726/2004](32004R0726) van het Europees Parlement en de Raad van 31 maart 2004 tot vaststelling van
      communautaire procedures voor het verlenen van vergunningen en het toezicht op geneesmiddelen voor menselijk en
      diergeneeskundig gebruik en tot oprichting van een Europees Geneesmiddelenbureau (PbEG L 136) en een afschrift van
      de in artikel 57, tweede lid, van die verordening bedoelde samenvatting van de productkenmerken;


      [ref1]: https://wetten.overheid.nl/BWBR0021505#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0021505#Artikel46
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0021505
        artikel: '53'
      - id: ref2
        bwb_id: BWBR0021505
        artikel: '46'
  - number: 1.1.g
    text: |-
      registratiehouder: degene op wiens naam een geneesmiddel in het register, bedoeld in onderdeel f, staat
      ingeschreven dan wel degene die voor een geneesmiddel een vergunning heeft ingevolge artikel 3, eerste lid, van de
      verordening, bedoeld in onderdeel f;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.h
    text: |-
      Taxe: gegevens over prijzen en vergoeding van geneesmiddelen, opgenomen in de G-standaard die is uitgegeven door Z-
      index B.V.;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.i
    text: |-
      Defined Daily Dose: de dagdosis van een geneesmiddel, als vastgesteld onder verantwoordelijkheid van het WHO
      Collaborating Centre for Drug Statistics Methodology;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.j
    text: |-
      Anatomical Therapeutic Chemical Classification: de classificatie van geneesmiddelen, samengesteld onder
      verantwoordelijkheid van het WHO Collaborating Centre for Drug Statistics Methodology;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.k
    text: |-
      standaardkuur: de totale hoeveelheid van het werkzame bestanddeel van een geneesmiddel dat, blijkens de dosering,
      vermeld in het registerdossier, wordt gegeven;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.l
    text: |-
      referentiehoeveelheid: de hoeveelheid van een werkzaam bestanddeel, in een farmaceutische vorm gebracht, waarmee,
      gegeven de standaarddosis en het gebruikelijke aantal keren per dag dat het geneesmiddel wordt gegeven om die
      standaarddosis te bereiken, de gebruikelijke dagelijkse dosering kan worden bereikt, met dien verstande dat bij
      keuze tussen een retardvorm en een niet-retardvorm wordt uitgegaan van de niet-retardvorm;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.m
    text: 'dbc: diagnose behandeling combinatie;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.n
    text: |-
      *een rekening-courant*: een rekening in de centrale administratie van ’s rijks schatkist bij het ministerie van
      Financiën op naam van een rekening-couranthouder, waarop dagelijks het geldelijk tegoed (positief of negatief)
      wordt bijgehouden van de betrokken rekening-couranthouder bij het Rijk en de mutaties in het tegoed;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.o
    text: '*de rekening-couranthouder*: het Zorginstituut;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.p
    text: |-
      *Euribor*: de dagelijks door de European Banking Federation vastgestelde rente waartegen op de geldmarkt
      interbancair deposito’s in euro’s van verschillende looptijden worden aangeboden in landen waar de euro
      betaalmiddel is;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.q
    text: |-
      *prestatie*: een prestatie als omschreven bij of krachtens [artikel 11 van de Zorgverzekeringswet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 1.1.r
    text: '*prestatiebeschrijving*:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.r.1°
    text: |-
      een beschrijving van de prestatie zoals die op grond van de [Wet marktordening gezondheidszorg][ref1] voor een
      zorgaanbieder is vastgesteld dan wel


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 1.1.r.2°
    text: |-
      een beschrijving van de prestatie zoals die tussen de verzekerde en de zorgaanbieder is overeengekomen indien voor
      die zorgaanbieder niet een prestatiebeschrijving op grond van de [Wet marktordening gezondheidszorg][ref1] behoeft
      te worden vastgesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 1.1.s
    text: |-
      *declaratieregeling*: een regeling bedoeld in
      [artikel 38, derde lid, onder b, van de Wet marktordening gezondheidszorg][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020078
        artikel: '38'
  - number: 1.1.t
    text: |-
      *formele controle*: een onderzoek waarbij de zorgverzekeraar nagaat of het tarief dat door een zorgaanbieder voor
      een prestatie in rekening is gebracht:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.t.1°
    text: een prestatie betreft, welke is geleverd aan een bij die zorgverzekeraar verzekerde persoon;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.t.2°
    text: een prestatie betreft, welke behoort tot het verzekerde pakket van die persoon,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.t.3°
    text: een prestatie betreft, tot levering waarvan de zorgaanbieder bevoegd is, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.t.4°
    text: |-
      het tarief betreft, dat voor die prestatie krachtens de [Wet marktordening gezondheidszorg][ref1] is vastgesteld of
      een tarief is dat voor die prestatie met de zorgaanbieder is overeengekomen;


      [ref1]: https://wetten.overheid.nl/BWBR0020078
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0020078
  - number: 1.1.u
    text: |-
      *materiële controle*: een onderzoek waarbij de zorgverzekeraar nagaat of de door de zorgaanbieder in rekening
      gebrachte prestatie is geleverd en die geleverde prestatie het meest was aangewezen gezien de gezondheidstoestand
      van de verzekerde;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.v
    text: |-
      *fraudeonderzoek*: een onderzoek waarbij de zorgverzekeraar nagaat of de verzekerde of de zorgaanbieder valsheid
      in geschrifte, bedrog, benadeling van rechthebbenden of verduistering pleegt of tracht te plegen ten nadele van bij
      de totstandkoming of uitvoering van een overeenkomst van zorgverzekering betrokken personen en organisaties met het
      doel een prestatie, vergoeding, betaling of ander voordeel te krijgen waarop de verzekerde dan wel de zorgaanbieder
      geen recht heeft of recht kan hebben;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.w
    text: |-
      *verhaalsrecht*: het recht van de verzekeraar op grond van [artikel 962 van Boek 7 van het Burgerlijk Wetboek][ref1]
      de schade die is veroorzaakt door anderen dan de verzekerde op deze derden te verhalen;


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel962
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '962'
  - number: 1.1.x
    text: |-
      *detailcontrole:* onderzoek door de zorgverzekeraar naar bij de zorgaanbieder berustende persoonsgegevens met
      betrekking tot eigen verzekerden ten behoeve van materiële controle of fraudeonderzoek;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.y
    text: |-
      *algemene risicoanalyse*: een analyse die erop is gericht te bepalen op welke gegevens de materiële controle of het
      fraudeonderzoek zich zal richten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.z
    text: |-
      *specifieke risicoanalyse:* een analyse die erop is gericht te bepalen op welke gegevens en op welke zorgaanbieders
      of categorieën van zorgaanbieders de detailcontrole zich zal richten;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.aa
    text: '*verwerker:* degene bedoeld in artikel 4, onderdeel 8, van de Algemene verordening gegevensbescherming;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.bb
    text: |-
      *grensoverschrijdende zorg:* zorg waarop de [Zorgverzekeringswet][ref1] recht geeft en die verzekerden buiten
      Nederland hebben genoten;


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: 1.1.cc
    text: '*rapport zorgvraagzwaarte:* algemeen aanvaard rapport over zorgvraagzwaarte;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.dd
    text: '*zorgvraagzwaarte:* zorgvraagzwaarte zoals beschreven in het rapport zorgvraagzwaarte;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.ee
    text: |-
      *Richtlijn 2011/24/EU:* Richtlijn 2011/24/EU van het Europees Parlement en de Raad van 9 maart 2011 betreffende de
      toepassing van de rechten van patiënten bij grensoverschrijdende gezondheidszorg (Pb EU 2011, L 88);
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.ff
    text: |-
      *gegevens over gezondheid:* gegevens over gezondheid, als bedoeld in artikel 4, onderdeel 15 van de Algemene
      verordening gegevensbescherming;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.gg
    text: '*Covid-19:* de ziekte veroorzaakt door coronavirus-SARS-CoV-2;'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: 1.1.hh
    text: |-
      geneeskundige behandeling: behandeling in het kader van geneeskundige zorg als bedoeld in
      [artikel 2.4 van het Besluit zorgverzekering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: '1.2'
    text: Voor de toepassing van deze regeling wordt onder mogendheid mede verstaan de Nederlandse Antillen en Aruba.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel1
  - number: '2.1'
    text: |-
      De zorg bedoeld in [artikel 2.4 van het Besluit zorgverzekering][ref1] omvat niet:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.1.a
    text: |-
      behandeling van bovenoogleden die verlamd of verslapt zijn, anders dan bij verlamming of verslapping die een
      ernstige gezichtsveldbeperking tot gevolg heeft dan wel het gevolg is van een aangeboren afwijking of een bij de
      geboorte aanwezige chronische aandoening;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.b
    text: liposuctie van de buik;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.c
    text: |-
      een behandeling van plastisch-chirurgische aard die strekt tot borstconstructie of vervanging van een
      borstprothese, anders dan na een gehele of gedeeltelijke borstamputatie of bij agenesie of aplasie van de borst bij
      vrouwen en de daarmee vergelijkbare situatie bij een vastgestelde transsexualiteit;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.d
    text: het operatief verwijderen van een borstprothese zonder medische noodzaak;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.e
    text: behandelingen tegen snurken met uvuloplastiek;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.f
    text: behandelingen gericht op sterilisatie dan wel op het ongedaan maken daarvan;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.g
    text: behandelingen gericht op circumcisie, anders dan medisch noodzakelijk;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.h
    text: behandeling van aanpassingsstoornissen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.i
    text: hulp bij werk- en relatieproblemen;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.j
    text: behandeling van plagiocefalie en brachycefalie zonder craniosynostose met een redressiehelm;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.1.k
    text: |-
      de verstrekking van een geregistreerd geneesmiddel met een in [bijlage 0][ref1] bij deze regeling genoemde werkzame
      stof in het kader van een daarbij vermelde geneeskundige behandeling;


      [ref1]: https://wetten.overheid.nl/BWBR0018715
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0018715
  - number: 2.1.l
    text: |-
      uitwendige hulpmiddelen te gebruiken bij de behandeling van diabetes voor het controleren en reguleren van
      stoornissen in de bloedsuikerspiegel, met inbegrip van de ketonen teststrips en insulinepompen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.1
  - number: 2.2.1
    text: |-
      De zorg, bedoeld in de [artikelen 2.4][ref1] en [2.6 van het Besluit zorgverzekering][ref2] omvat tevens:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.2.1.a
    text: |-
      van 1 juli 2021 tot 1 april 2027 blaasinstillatie met blaasspoelvloeistoffen met chondroïtinesulfaat of
      hyaluronzuur- voor de behandeling van patiënten met blaaspijnsyndroom met niet transurethraal behandelbare Hunnerse
      laesies voor zover de verzekerde deelneemt aan onderzoek als bedoeld in het tweede lid naar deze zorg;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.1.g
    text: |-
      van 1 januari 2020 tot 1 januari 2029, hypertherme intraperitoneale chemotherapie toegevoegd aan primaire debulking
      bij patiënten met stadium III ovariumcarcinoom voor zover de verzekerde deelneemt aan onderzoek als bedoeld in het
      tweede lid, onderdeel a, naar deze zorg;
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.1.h
    text: |-
      in afwijking van [artikel 2.1, onderdeel k][ref1], juncto [bijlage 0, onderdeel 6][ref2], van 1 januari 2020 tot
      1 januari 2027 nusinersen voor de behandeling van patiënten met 5q spinale spieratrofie die 9,5 jaar en ouder zijn,
      voor zover de verzekerde deelneemt aan onderzoek als bedoeld in het tweede lid naar deze zorg.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018715
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0018715
        artikel: '2'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018715
  - number: 2.2.2
    text: 'Als onderzoek naar zorg wordt aangemerkt:'
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.2.a
    text: hoofdonderzoek naar de effectiviteit of kosteneffectiviteit van de zorg, en
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.2.b
    text: |-
      aanvullend landelijk observationeel onderzoek naar de zorg, dat in samenwerking met het hoofdonderzoek wordt
      opgezet en verricht indien:
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.2.b.1°
    text: |-
      de verzekerde, behoudens de zorginhoudelijke criteria, niet voldoet aan de criteria voor deelname aan het
      hoofdonderzoek,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.2.b.2°
    text: de verzekerde niet heeft deelgenomen aan het hoofdonderzoek en de inclusie voor dat hoofdonderzoek is beëindigd, of
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.2.b.3°
    text: |-
      de verzekerde heeft deelgenomen aan het hoofdonderzoek zonder de zorg te hebben ontvangen en de deelname aan het
      hoofdonderzoek voor die verzekerde is voltooid.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.3
    text: |-
      In afwijking van het eerste lid, onderdelen a en h, en onderdeel 136 van [bijlage 2][ref1] bij deze regeling
      is deelname van de verzekerde aan onderzoek als bedoeld in het tweede lid niet vereist indien het onderzoek is
      voltooid en:


      [ref1]: https://wetten.overheid.nl/BWBR0018715
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0018715
  - number: 2.2.3.a
    text: |-
      zolang het Zorginstituut niet heeft beoordeeld in hoeverre de zorg voldoet aan
      [artikel 2.1, tweede lid, van het Besluit zorgverzekering][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
  - number: 2.2.3.b
    text: |-
      voor zover het Zorginstituut heeft geoordeeld dat de zorg geheel of gedeeltelijk voldoet aan
      [artikel 2.1, tweede lid, van het Besluit zorgverzekering][ref1] en heeft geadviseerd om bij of krachtens
      de Zorgverzekeringswet te regelen dat die zorg geheel of gedeeltelijk behoort tot de prestaties, bedoeld in
      [artikel 11, eerste lid, van die wet][ref2]:


      [ref1]: https://wetten.overheid.nl/BWBR0018492#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel11
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0018492
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018450
        artikel: '11'
  - number: 2.2.3.b.1°
    text: |-
      zolang de Minister geen standpunt als bedoeld in [artikel 24 van de Kaderwet adviescolleges][ref1] heeft ingenomen
      over het advies van het Zorginstituut; of


      [ref1]: https://wetten.overheid.nl/BWBR0008159#Artikel24
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0008159
        artikel: '24'
  - number: 2.2.3.b.2°
    text: |-
      indien de Minister blijkens een standpunt als bedoeld in onderdeel b, onder 1°, voornemens is regels als bedoeld in
      onderdeel b, aanhef, te stellen: zolang die regels nog niet in werking zijn getreden.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.2.4
    text: Het derde lid is niet van toepassing indien het onderzoek, bedoeld in het tweede lid, voortijdig is stopgezet.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.2
  - number: 2.5.1
    text: |-
