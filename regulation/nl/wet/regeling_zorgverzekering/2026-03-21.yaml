  - number: '7.4'
    text: |-
      1 De zorgverzekeraar verricht materiële controle op de wijze zoals bepaald in de
      [artikelen 7.2a tot en met 7.2c][ref1] en [7.5 tot en met 7.9][ref2].

      2 De zorgaanbieder is verplicht zijn medewerking te verlenen aan de overeenkomstig het eerste lid uitgevoerde
      materiële controle.

      3 De zorgverzekeraar verricht fraudeonderzoek op de wijze zoals bepaald in [artikel 7.10][ref3].

      4 De zorgaanbieder is verplicht zijn medewerking te verlenen aan overeenkomstig het derde lid uitgevoerd
      fraudeonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel7.2a
