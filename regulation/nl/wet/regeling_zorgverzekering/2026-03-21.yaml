        paragraaf: '1'
  - number: 2.7.2
    text: |-
      Indien een hulpmiddel in bruikleen wordt gegeven, omvat het hulpmiddel tevens vergoeding van de kosten van vervoer
      van het hulpmiddel naar en van de woning van de verzekerde, van het regelmatig onderhoud ervan alsmede van de voor
      gebruik, ontsmetting en reiniging van de apparatuur benodigde chemicaliën.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.7
  - number: '2.8'
    text: |-
