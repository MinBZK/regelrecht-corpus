  - number: 7.2c
    text: |-
      1 Dit artikel is van toepassing indien de verzekerde of de zorgaanbieder namens de verzekerde de kosten van
      gespecialiseerde geestelijke gezondheidszorg zonder tussenkomst van VECOZO B.V. in rekening brengt bij diens
      zorgverzekeraar.

      2 De zorgverzekeraar beschikt, met inachtneming van het bepaalde bij of krachtens dit artikel, niet over het tot
      een individuele verzekerde te herleiden zorgvraagzwaartegegeven.

      3 De zorgaanbieder, bedoeld in het eerste lid, verstrekt de gegevens, die op grond van het bij of krachtens
      [artikel 38 van de Wet marktordening gezondheidszorg][ref1] bepaalde moeten worden verstrekt aan de verzekerde of
      namens een verzekerde aan diens zorgverzekeraar, zonder tussenkomst van VECOZO B.V.

      4 Het [zesde en zevende lid van artikel 7.2b][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020078#Artikel38
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel7.2b
