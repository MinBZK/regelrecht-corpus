        hoofdstuk: '5'
  - number: '5.9'
    text: |-
      Indien voor de heffing van de inkomensafhankelijke bijdrage bij wege van aanslag het bijdrage-inkomen wordt bepaald
      door middel van tijdsevenredige vaststelling, wordt daarbij:

      a. een kalenderjaar op 360 dagen gesteld;

      b. een kalendermaand op 30 dagen gesteld;

      c. de dag waarop het tijdvak aanvangt, als een gehele dag in aanmerking genomen;

      d. de dag waarop het tijdvak eindigt, niet in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.9
  - number: '5.11'
    text: |-
      1 De ontvangsten per bijdragejaar van de combineerde heffing van de loonbelasting, de premies voor de sociale
      verzekeringen en de bijdrage voor de Zorgverzekeringswet alsmede de daarop betrekking hebbende belasting- en
      invorderingsrente en boeteontvangsten worden uitgesplitst in een voor de afdracht vastgesteld verdeelpercentage
      per bijdragejaar.

      2 Het verdeelpercentage in het eerste lid wordt maandelijks per bijdragejaar opnieuw berekend op basis van het
      relatieve aandeel van de bijdragen [Zorgverzekeringswet][ref1] in alle ontvangen collectieve aangiften en opgelegde
      naheffingen.

      3 Alle ontvangen gelden over het bijdragejaar worden verdeeld op basis van het verdeelpercentage, bedoeld in het
      eerste lid. De mutatie ten opzichte van de vorige periode vormt het af te dragen bedrag.

      4 In het tweede jaar na afloop’ van het bijdragejaar wordt het verdeelpercentage voor het betreffende bijdragejaar
      definitief vastgesteld. Dit percentage wordt gehanteerd voor alle betalingen die daarna binnenkomen.

      5 In geval van bijzondere omstandigheden kan de Minister van Financiën, op verzoek van de rijksbelastingdienst,
      besluiten om de termijn, bedoeld in het vierde lid, te verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.11
    references:
      - id: ref1
        bwb_id: BWBR0018450
  - number: '5.12'
    text: |-
      1 De ontvangsten van de overige inkomensafhankelijke bijdragen overeenkomstig
      [artikel 49, derde lid, van de Zorgverzekeringswet][ref1] worden maandelijks vastgesteld.

      2 De onder het eerste lid genoemde ontvangsten zijn inclusief de eventuele belasting- en invorderingsrente en
      boeteontvangsten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel49
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.12
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: '49'
  - number: '5.13'
    text: |-
      1 De inspecteur verleent vooruitlopend op een beschikking als bedoeld in
      [artikel 50, eerste lid, van de Zorgverzekeringswet][ref1] een voorschot indien:

      a. het bedrag van de teveel betaalde bijdrage vermoedelijk ten minste € 100 zal bedragen, en

      b. het bijdrage-inkomen waarover inkomensafhankelijke bijdrage wordt of is ingehouden afkomstig is van
      verschillende inhoudingsplichtigen.

      De eerste volzin is van overeenkomstige toepassing op een verzoek van de verzekeringsplichtige die voldoet aan
      de in die volzin genoemde voorwaarden, mits het verzoek is ingediend na 30 mei doch voor 1 december van het
      kalenderjaar waarop het voorschot betrekking heeft.

      2 Het eerste lid is niet van toepassing met betrekking tot:

      a. personen die op grond van [artikel 2, tweede lid, onderdeel b, van de Zorgverzekeringswet][ref2] niet
      verzekeringsplichtig zijn;

      b. personen die voor 1 april van het kalenderjaar waarop het voorschot betrekking heeft, aangeven geen voorschot te
      willen ontvangen.

      3 De inspecteur kan het voorschot al dan niet op verzoek herzien. Een verzoek tot herziening van het voorschot kan
      worden ingediend tot 1 december van het kalenderjaar waarop het voorschot betrekking heeft.

      4 Indien de inspecteur een verzoek om verlening dan wel herziening van een voorschot geheel of gedeeltelijk
      afwijst, gebeurt dit bij voor bezwaar vatbare beschikking.

      5 Voorschotten worden verrekend met de beschikking, bedoeld in
      [artikel 50, eerste lid, van de Zorgverzekeringswet][ref3], dan wel – voor zoveel nodig – bij een door de
      inspecteur te nemen voor bezwaar vatbare beschikking.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel50
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018450#Artikel50
