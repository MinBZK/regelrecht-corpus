        artikel: '87'
      - id: ref2
        bwb_id: BWBR0018715
        artikel: '7.1'
        hoofdstuk: '7'
  - number: 7a.1
    text: |-
      1 De gegevens als bedoeld in [artikel 122a, tiende lid, van de Zorgverzekeringswet][ref1], bestaan uit:

      a. de prestatiebeschrijving van de aan de vreemdeling geleverde prestatie;

      b. het voor de geleverde prestatie in rekening gebrachte tarief;

      c. de in verband met het voor die prestatie in rekening gebrachte tarief ontvangen betalingen of vergoedingen van
      de vreemdeling, zijn verzekeraar of derden;

      d. de leeftijd, de nationaliteit, de initialen en het geslacht van de vreemdeling.

      2 Bij de gegevens, bedoeld in het eerste lid, wordt vermeld wanneer de prestatie is geleverd.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel122a
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel7a.1
    references:
      - id: ref1
        bwb_id: BWBR0018450
        artikel: 122a
  - number: 7b.1
    text: |-
      1 Als uitvoering van de zorgverzekeringen en de [Zorgverzekeringswet][ref1], bedoeld in
      [artikel 89, eerste lid, van de Zorgverzekeringswet][ref2], worden in ieder geval aangemerkt:

      a. werkzaamheden gericht op het voorkomen of verminderen van achterstand van de betaling door een verzekeringnemer
      van de premie, het verplicht eigen risico, het vrijwillig eigen risico, de eigen bijdragen, de eigen betalingen, de
      rente, de incasso- en deurwaarderskosten;

      b. werkzaamheden die erop gericht zijn te bewerkstelligen dat een verzekeringnemer niet langer een
      bestuursrechtelijke premie verschuldigd is.

      2 Voor de uitvoering van de werkzaamheden bedoeld in het eerste lid is het noodzakelijk dat de zorgverzekeraar en
      het college van burgemeester en wethouders de volgende gegevens uitwisselen:

      a. naam, adres, postcode, woonplaats, telefoonnummer, e-mailadres, geboortedatum en burgerservicenummer van de op
      de zorgpolis vermelde verzekeringnemer en verzekerden;

      b. het unieke zorgverzekeraarsidentificatienummer van de zorgverzekeraar, de zorgpolis en gegevens over de
      toepassing van [artikel 18 van de Zorgverzekeringswet][ref3] ten behoeve van de verzekeringnemer;

      c. de door de verzekeringnemer verschuldigde bedragen met betrekking tot de premie, het verplicht eigen risico, het
      vrijwillig eigen risico, de eigen bijdragen, de eigen betalingen, de rente, de incasso- en deurwaarderskosten;

      d. gegevens over de toepassing van [afdeling 3.3.2 van de Zorgverzekeringswet][ref4] door de zorgverzekeraar ten
      aanzien van de verzekeringnemer;

      e. de bedragen die op de bijstand, bedoeld in [artikel 5 van de Participatiewet][ref5], van de verzekeringnemer ten
      behoeve van de zorgverzekeraar worden ingehouden en betaalbaar gesteld.

      3 Voor de uitvoering van de werkzaamheden bedoeld in het eerste lid, onderdeel b, verstrekt het CAK op verzoek aan
      het college van burgemeester en wethouders de volgende gegevens:

      a. naam, adres, postcode, woonplaats, geboortedatum en burgerservicenummer van de verzekeringnemer;

      b. het unieke zorgverzekeraarsidentificatienummer van de zorgverzekeraar;

      c. de door de verzekeringnemer verschuldigde bestuursrechtelijke premie, bedoeld in
      [artikel 18d, eerste lid, van de Zorgverzekeringswet][ref6], de datum vanaf wanneer de verzekeringnemer de
      bestuursrechtelijke premie verschuldigd is en de wijze van inning van de bestuursrechtelijke premie.


      [ref1]: https://wetten.overheid.nl/BWBR0018450
      [ref2]: https://wetten.overheid.nl/BWBR0018450#Artikel89
