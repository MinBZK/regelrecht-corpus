  - number: 6.3a.3
    text: |-
      1 De bijdrage is gelijk aan een bedrag per maand overeenkomende met een twaalfde van het bedrag van de
      geraamde gemiddelde premie voor een verzekerde voor een zorgverzekering in het berekeningsjaar, bedoeld in
      [artikel 4 van de Wet op de zorgtoeslag][ref1].

      2 De bijdrage wordt berekend over de gehele periode, bedoeld in
      [artikel 68b, tweede lid, van de Zorgverzekeringswet][ref2], met uitzondering van de periode tot en met de
      kalendermaand waarin de in dat lid bedoelde persoon de leeftijd van achttien jaar bereikt.

      3 Voor de toepassing van de [Wet op de zorgtoeslag][ref3] wordt de bijdrage volledig als premie voor een
      zorgverzekering beschouwd.


      [ref1]: https://wetten.overheid.nl/BWBR0018451#Artikel4
