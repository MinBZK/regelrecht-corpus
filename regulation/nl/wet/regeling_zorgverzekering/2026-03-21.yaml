  - number: 6.6.3
    text: |-
      De betaling van de toegekende extra bijdrage geschiedt overeenkomstig de door het Zorginstituut vastgestelde
      beleidsregels, waarin ten minste een betaalschema is opgenomen dat rekening houdt met het betaalschema van de
      zorgverzekeraar.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.6.3
  - number: 6.6.4
    text: |-
      Een zorgverzekeraar aan wie het Zorginstituut een extra bijdrage heeft toegekend neemt in de afzonderlijke
      administratie, bedoeld in [artikel 33, derde lid, van de wet][ref1] op:

      a. de gerealiseerde kosten in het catastrofejaar en het daaropvolgende kalenderjaar ten gevolge van de catastrofe
      voor zorg of andere diensten die op grond van de zorgverzekeringen zijn verzekerd en rechtstreeks betrekking hebben
      op individuele verzekerden;

      b. de gerealiseerde kosten in het catastrofejaar en het daaropvolgende kalenderjaar anders dan bedoeld in onderdeel
      a, ten gevolge van de catastrofe voor op grond van de zorgverzekeringen verzekerde zorg of andere diensten die de
      zorgaanbieders met tarieven in rekening hebben gebracht met hantering van een prestatiebeschrijving voor meerkosten
      in verband met de catastrofe en de wijze waarop deze zijn bepaald;

      c. het deel van de gerealiseerde kosten, bedoeld in onderdeel a, dat voor rekening van verzekerden is gekomen op
      grond van het verplicht eigen risico;

      d. het deel van de gerealiseerde kosten, bedoeld in de onderdelen a en b, waarvoor de zorgverzekeraar
      compensatie heeft verkregen of zal verkrijgen ten laste van de rijksbegroting als bedoeld in
      [artikel 2.1, eerste lid, van de Comptabiliteitswet 2016][ref2], op grond van de door het Zorginstituut daartoe
      aangewezen regelingen;

      e. de gerealiseerde kosten in het catastrofejaar en het daaropvolgende kalenderjaar die de zorgaanbieders met
      tarieven in rekening hebben gebracht met hantering van de prestatiebeschrijving 'continuïteitsbijdrage' voor de
      onderdekking van doorlopende kosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel2.1
