  - number: 7.2b
    text: |-
      1 VECOZO B.V. en Vektis C.V. dragen zorg voor passende technische en organisatorische maatregelen om
      persoonsgegevens te beveiligen bij de verwerkingen, bedoeld in [artikel 7.2a][ref1], tegen verlies of tegen enige
      vorm van onrechtmatige verwerking.

      2 De door Vektis C.V. aan zorgaanbieders en zorgverzekeraars te verstrekken analyses, bedoeld in
      [artikel 7.2a][ref2], bevatten geen tot individuele verzekerden te herleiden zorgvraagzwaartegegevens.

      3 Voor VECOZO B.V. en Vektis C.V. gelden dezelfde wettelijke voorschriften inzake geheimhouding van de verwerkte
      gegevens, bedoeld in [artikel 7.2a][ref3], als voor de zorgverzekeraar.

      4 Personen werkzaam bij of ten behoeve van VECOZO B.V. en Vektis C.V. voor wie niet reeds uit hoofde van ambt
      of beroep een geheimhoudingplicht geldt, zijn verplicht tot geheimhouding van de gegevens die zij op grond van
      [artikel 7.2a][ref4] verwerken, behoudens voor zover enig wettelijk voorschrift hen tot mededeling verplicht.

      5 De zorgverzekeraar beschikt niet over de sleutel om het versleutelde gegeven zorgvraagzwaarte, bedoeld in
      [artikel 7.2a][ref5] te ontsleutelen.

      6 De zorgverzekeraar beschikt, met inachtneming van het bepaalde in de [artikelen 7.5 tot en met 7.11][ref6]
      inzake de uitvoering van materiële controle, over het gegeven zorgvraagzwaarte indien op grond van analyse op
      basis van geaggregeerde gegevens of naar aanleiding van een ander signaal er reden is voor het instellen van
      nadere formele of materiële controles, met dien verstande dat indien en voor zover dat noodzakelijk is voor die
      controles, het gegeven zorgvraagzwaarte van de patiënt of de gegevens die noodzakelijk zijn voor het onderbouwen
      en afleiden van het gegeven zorgvraagzwaarte van de desbetreffende patiënt herleidbaar naar die individuele patiënt
      wordt, respectievelijk worden verwerkt onder verantwoordelijkheid van een medisch adviseur in opdracht van de
      zorgverzekeraar.

      7 De zorgautoriteit kan in een declaratieregeling, bedoeld in [artikel 7.2a, tweede lid][ref7], en onder daarbij te
      stellen voorwaarden, voorschriften of beperkingen, bepalen:

      a. op welke wijze het gegeven zorgvraagzwaarte moet worden gemaskeerd en

      b. dat de verplichting tot verstrekken van het gegeven zorgvraagzwaarte bij uitzondering niet van toepassing is.


