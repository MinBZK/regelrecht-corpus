  - number: 6.7.2
    text: |-
      1 Als categorieën zorgaanbieders op grond van [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref1], worden
      aangewezen:

      a. algemene ziekenhuizen;

      b. academische ziekenhuizen;

      c. revalidatie instellingen;

      d. radiotherapeutische centra;

      e. dialyse centra;

      f. audiologische centra;

      g. klinisch genetische centra;

      h. het Oogziekenhuis in Rotterdam;

      i. epilepsie-instellingen;

      j. long-astma-instellingen, en

      k. het Beatrixoord in Haren (Groningen).

      2 Het Zorginstituut neemt bij de toepassing van [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref2], de door
      een zorgaanbieder geleverde diagnose behandeling combinaties in aanmerking waarvoor in het laatste budgetjaar een
      door de zorgautoriteit vastgesteld gereguleerd tarief gold en die in het laatste budgetjaar zijn geopend en in het
      daaropvolgende kalenderjaar zijn afgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0034659#ArtikelIIIa
      [ref2]: https://wetten.overheid.nl/BWBR0034659#ArtikelIIIa
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.2
    references:
      - id: ref1
        bwb_id: BWBR0034659
        artikel: IIIa
      - id: ref2
        bwb_id: BWBR0034659
        artikel: IIIa
  - number: 6.7.3
    text: |-
      1 Het Zorginstituut berekent de bedragen, bedoeld in [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref1],
      overeenkomstig het tweede lid.

      2 Het Zorginstituut:

      a. bepaalt per zorgaanbieder de som van:

      1°. 50% van het schadelastbedrag ter zake van de diagnose behandeling combinaties waarvoor een gereguleerd tarief
      gold die in het kalenderjaar voorafgaand aan het laatste budgetjaar zijn geopend en in het laatste budgetjaar zijn
      afgesloten,

      2°. het schadelastbedrag ter zake van de diagnose behandeling combinaties waarvoor een gereguleerd tarief gold die
      in het laatste budgetjaar zijn geopend en afgesloten,

      3°. 50% van het schadelastbedrag ter zake van de diagnose behandeling combinaties waarvoor een gereguleerd tarief
      gold en die in het laatste budgetjaar zijn geopend en in het daaropvolgende kalenderjaar zijn afgesloten;

      b. bepaalt per zorgaanbieder het quotiënt van 50% van het schadelastbedrag, bedoeld in onderdeel a, onder 3º, en
      van de uitkomst van onderdeel a;

      c. vermenigvuldigt de uitkomst van onderdeel b met het opbrengstverschil van de zorgaanbieder;

      d. vermenigvuldigt per zorgaanbieder de uitkomst van onderdeel c met het percentage opbrengstverschil voor de
      zorgverzekeraar, en

      e. sommeert per zorgverzekeraar de uitkomsten per zorgaanbieder van onderdeel d.


      [ref1]: https://wetten.overheid.nl/BWBR0034659#ArtikelIIIa
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.7.3
    references:
      - id: ref1
        bwb_id: BWBR0034659
        artikel: IIIa
  - number: 6.7.4
    text: |-
      De verrekening, bedoeld in [artikel IIIA, eerste lid, van de Veegwet VWS 2013][ref1], vindt plaats bij de
      vaststelling van de vereveningsbijdrage over het laatste budgetjaar van de aangewezen categorie van zorgaanbieders.


