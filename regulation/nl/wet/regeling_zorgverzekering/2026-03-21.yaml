  - number: 2.29a
    text: |-
      1 Tenzij het zorg betreft waarop de [artikelen 50 tot en met 56 van de Wet marktordening gezondheidszorg][ref1]
      van toepassing zijn, wordt met een Zvw-pgb ten hoogste € 30,84 per uur vergoed voor de zorg als bedoeld in
      [artikel 2.15a van het Besluit zorgverzekering][ref2].

      2 In afwijking van het bedrag, genoemd in het eerste lid, bedraagt de vergoeding ten hoogste
      een door de zorgverzekeraar te bepalen bedrag per uur indien de verzekerde kan aantonen
      dat de zorg is verleend door een persoon die is ingeschreven in het register, bedoeld in
      [artikel 3 van Wet de op de beroepen in de individuele gezondheidszorg][ref3], voor het uitoefenen van een beroep
      voor het verlenen van zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref4].

      3 Het tweede lid is niet van toepassing indien de zorgverlener een bloed- of aanverwante in de eerste of tweede
      graad of de echtgenoot, geregistreerde partner of andere levensgezel is van de verzekerde.

      4 De vergoeding, bedoeld in het tweede lid, is ten hoogste gelijk aan het tarief dat door de zorgautoriteit op
      grond van de [Wet marktordening gezondheidszorg][ref5] voor de desbetreffende zorg is vastgesteld.

      5 In afwijking van het eerste en tweede lid, worden de bedragen, bedoeld in voornoemde leden, ook vergoed indien:

      a. de zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref6], in de periode van 1 maart 2020 tot
      en met 30 juni 2020, als gevolg van de maatregelen in verband met Covid-19, door de zorgverlener niet is verleend;

      b. deze niet-verleende zorg door de zorgverlener bij de verzekerde in rekening is gebracht; en

      c. de zorgverlener hiervoor niet is gecompenseerd op grond van de werkgeverstaken van de verzekerde.

      6 De verzekerde houdt, via een door de zorgverzekeraar beschikbaar gesteld formulier, een registratie bij van de
      bedragen die hij vergoedt op grond van het vijfde lid. Deze registratie stelt hij op verzoek van de zorgverzekeraar
      ter beschikking.

      7 In afwijking van het eerste en tweede lid, worden de bedragen, bedoeld in voornoemde leden, ook vergoed indien:

      a. de zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref7], in de periode van 1 oktober 2020
      tot en met 31 december 2021, door de zorgverlener niet is verleend in verband met:

      1°. een besmetting van de verzekerde of de zorgverlener met Covid-19,

      2°. een noodzakelijke quarantaine van de verzekerde of diens zorgverlener vanwege Covid-19, of

      3°. het niet kunnen verlenen overeenkomstig de maatregelen in verband met Covid-
      19 aan de budgethouder vanwege een beperking bij de budgethouder als bedoeld in
      [artikel 6.6, tweede lid, onderdelen d en e, van de Tijdelijke regeling maatregelen covid-19][ref8];

      b. de niet-verleende zorg door de zorgverlener bij de verzekerde in rekening is gebracht; en

      c. de zorgverlener hiervoor niet is gecompenseerd op grond van de werkgeverstaken van de verzekerde.

      8 De verzekerde houdt, via een door de zorgverzekeraar beschikbaar gesteld formulier, een registratie bij van de
      bedragen die hij vergoedt op grond van het zevende lid. In de registratie is opgenomen:

      a. ingeval van besmetting met Covid-19 van de verzekerde: een bewijsstuk waaruit blijkt dat de zorg niet kon worden
      geleverd in verband met deze besmetting;

      b. ingeval van een noodzakelijke quarantaine van de verzekerde in verband met Covid-19: een bewijsstuk of de tussen
      de verzekerde en de zorgverlener overeengekomen afspraken, waaruit blijkt dat de zorg niet kon worden geleverd in
      verband met deze quarantaine;

      c. ingeval van besmetting met Covid-19 of noodzakelijke quarantaine van de zorgverlener in verband met Covid-19:
      een bewijsstuk of de tussen de zorgverlener en de verzekerde overeengekomen afspraken waaruit blijkt dat de zorg
      niet kon worden geleverd in verband met deze besmetting of noodzakelijke quarantaine;

      d. ingeval van de in het tweede lid, onderdeel a, subonderdeel 3°, bedoelde situatie: een specificatie wanneer de
      zorg om deze reden niet kon worden geleverd.

      9 De verzekerde stelt, op verzoek van de zorgverzekeraar, de registratie, bedoeld in het achtste lid, ter
      beschikking.

      10 In afwijking van het eerste en tweede lid, worden de bedragen, bedoeld in voornoemde leden, ook vergoed indien:

      a. de zorg als bedoeld in [artikel 2.15a van het Besluit zorgverzekering][ref9] door de zorgverlener als gevolg van
      het ontvangen van een vaccinatie voor Covid-19, voor ten hoogste twee uur, niet is verleend;

      b. de niet-verleende zorg door de zorgverlener bij de verzekerde in rekening is gebracht; en

      c. de zorgverlener hiervoor niet is gecompenseerd op grond van de werkgeverstaken van de verzekerde.

      11 De verzekerde houdt, via een door de zorgverzekeraar beschikbaar gesteld formulier, een registratie bij van de
      bedragen die hij vergoedt op grond van het elfde lid. In de eigen administratie van budgethouder neemt budgethouder
      tevens een specificatie op van wanneer de zorg om deze reden niet kon worden geleverd. Deze registratie stelt hij
      op verzoek van de zorgverzekeraar ter beschikking.


