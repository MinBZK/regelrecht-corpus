      1 Indien van een geneesmiddel verschillende toedieningssterkten bestaan, wordt de vergoedingslimiet, berekend
      overeenkomstig de [artikelen 2.41 tot en met 2.45][ref1], voor het geneesmiddel met de kleinste toedieningssterkte
      gecorrigeerd door de ongecorrigeerde vergoedingslimiet te vermenigvuldigen met 2/10 maal het quotiënt van de
      referentiehoeveelheid en de kleinste toedieningssterkte van dat geneesmiddel, vermeerderd met 8/10.

      2 Voor geneesmiddelen die voor andere leeftijdscategorieën dan volwassenen zijn bestemd, is de
      referentiehoeveelheid de hoeveelheid die voorkomt in het preparaat van de hoogste hoeveelheid van die andere
      leeftijdscategorieën.

      3 De dimensie van de referentiehoeveelheid moet gelijk zijn aan de dimensie van de kleinste toedieningsvorm.

      4 Bij geneesmiddelen als bedoeld in de [artikelen 2.40, vijfde lid][ref2], en [2.41, zesde lid][ref3], blijven het
      eerste tot en met het derde lid buiten toepassing.


