  - number: 6.6.2
    text: |-
      1 In dit artikel wordt verstaan onder:

      a. *grondslag:* product van de gemiddelde vereveningsbijdrage, en het op het moment van de toekenning van
      de vereveningsbijdrage over het catastrofejaar verwacht aantal verzekerden dat de zorgverzekeraar in het
      catastrofejaar had;

      b. *gemiddelde vereveningsbijdrage:* toegekende vereveningsbijdrage per verzekerde, die wordt berekend door de som
      van de op grond van [artikel 32 van de wet][ref1] met betrekking tot het catastrofejaar voor alle zorgverzekeraars
      toegekende vereveningsbijdragen te delen door het verwachte totaalaantal verzekerden in dat jaar;

      c. *de catastrofeschadelast:* de som van de verwachte kosten van de zorgverzekeraar ten gevolge van de catastrofe
      in het catastrofejaar en het daaropvolgende kalenderjaar, die het Zorginstituut op grond van het tweede en derde
      lid in aanmerking neemt.

      2 Het Zorginstituut neemt als verwachte kosten in aanmerking kosten ten gevolge van de betrokken catastrofe die
      zorgaanbieders overeenkomstig hetgeen bij of krachtens de [Wet marktordening gezondheidzorg][ref2] is geregeld met
      tarieven in rekening brengen met hantering van:

      a. daartoe door het Zorginstituut aangewezen prestatiebeschrijvingen voor zorg of andere diensten die op grond van
      de zorgverzekeringen zijn verzekerd en rechtstreeks betrekking hebben op individuele verzekerden; of

      b. een prestatiebeschrijving voor meerkosten in verband met de catastrofe en voor zover het kosten betreft anders
      dan bedoeld in onderdeel a, de zorgverzekeraar op de door het Zorginstituut aangegeven wijze aantoont dat die
      kosten betrekking hebben op zorg of andere diensten die op grond van de zorgverzekeringen zijn verzekerd;

      3 Het Zorginstituut neemt niet als verwachte kosten in aanmerking:

      a. kosten waarvoor de zorgverzekeraar naar verwachting compensatie verkrijgt ten laste van de rijksbegroting,
      bedoeld in [artikel 2.1 van de Comptabiliteitswet 2016][ref3], op grond van daartoe door dat instituut aangewezen
      regelingen;

      b. kosten die zorgaanbieders met tarieven in rekening brengen met hantering van de prestatiebeschrijving
      “continuïteitsbijdrage” voor de onderdekking van doorlopende kosten.

      4 De toe te kennen extra bijdrage, bedraagt bij:

      a. een catastrofeschadelast van meer dan 4% van de grondslag en minder dan 10% van de grondslag het bedrag ter
      grootte van 5/3 vermenigvuldigd met het verschil tussen die catastrofelast en 4% van de grondslag;

      b. een catastrofeschadelast van 10% of meer en niet meer dan 20% van de grondslag, het bedrag ter grootte van die
      catastrofeschadelast, en een catastrofeschadelast van meer dan 20% van de grondslag, het bedrag ter grootte van 20%
      van de grondslag.

      5 Het Zorginstituut kent overeenkomstig de beleidsregels, bedoeld in [artikel 33, vijfde lid, van de wet][ref4]
      een lagere extra bijdrage toe dan op grond van het vierde lid, indien de zorgverzekeraar het verzoek om toekenning
      van de extra bijdrage niet voor het einde van het kalenderjaar volgend op het catastrofejaar, heeft ingediend.
      Het Zorginstituut kent een extra bijdrage van nihil toe indien de zorgverzekeraar het verzoek om toekenning van de
      extra bijdrage na het einde van het tweede kalenderjaar volgend op het catastrofejaar heeft ingediend.

      6 De toepassing van het vijfde lid blijft ten aanzien van de zorgverzekeraar achterwege indien redelijkerwijs niet
      kan worden geoordeeld dat hij in verzuim is geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0020078
      [ref3]: https://wetten.overheid.nl/BWBR0039429#Artikel2.1
      [ref4]: https://wetten.overheid.nl/BWBR0018450#Artikel33
