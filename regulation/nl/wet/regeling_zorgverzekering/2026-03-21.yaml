  - number: 6.3.2
    text: |-
      1 Organen die pensioen of rente uitkeren dan wel werkgevers, verrichten de hen door het CAK opgedragen
      werkzaamheden ter voorbereiding en uitvoering van de heffings- en inningsbeschikkingen, bedoeld in
      [artikel 69, zevende lid, van de Zorgverzekeringswet][ref1].

      2 De werkzaamheden, bedoeld in het eerste lid, houden ten minste in dat, nadat zij daartoe door het CAK van de
      benodigde gegevens zijn voorzien:

      a. organen die pensioen of rente uitkeren bijdragen die bijdrageplichtige personen verschuldigd zijn op het
      pensioen of de rente van die bijdrageplichtigen inhouden,

      b. organen die pensioen of rente aan een hoofdbijdrageplichtige uitkeren de bijdrage die diens gezinsleden
      verschuldigd zijn op het pensioen of de rente van die hoofdbijdrageplichtige inhouden, en

      c. werkgevers van grensarbeiders de bijdragen van gezinsleden van die grensarbeiders op het loon van de
      grensarbeider inhouden.

      3 Het CAK kan een orgaan dat pensioen of rente uitkeert of een werkgever van een grensarbeider opdragen een
      bijdrage op het pensioen, de rente of op het loon in te houden en af te dragen, zolang het CAK niet beschikt over
      de gegevens, bedoeld in het tweede lid. In dat geval berekent het orgaan of de werkgever de bijdrage uitgaande van
      de bij hem bekende gegevens over de samenstelling van het gezin van de bijdrageplichtige.

      4 Indien een bijdrageplichtige recht heeft op meer dan één pensioen of rente, wordt het in
      [artikel 6.3.1, tweede lid][ref2], bedoelde nominale deel van de bijdrage dat hij en zijn eventuele gezinsleden
      verschuldigd zijn ingehouden op het pensioen dat of de rente die het eerst is toegekend. Indien dit pensioen of
      deze rente daartoe niet toereikend is, kan het CAK hetzelfde of een ander orgaan opdragen het restant op een ander
      pensioen of een andere rente in te houden.

      5 Voor de inhouding van het door een gezinslid verschuldigde nominale deel van de bijdrage op het pensioen of de
      rente van de hoofdbijdrageplichtige dan wel op het loon van de grensarbeider, worden wijzigingen in de situatie
      van dat gezinslid die in de loop van een kalendermaand doch na de eerste dag van die maand plaatsvinden, eerst in
      aanmerking genomen vanaf de eerste dag van de daaropvolgende kalendermaand.

      6 Voor de toepassing van het tweede lid wordt een toeslag, waaronder begrepen een toeslag als bedoeld in de
      [Toeslagenwet][ref3], een toelage of enige aanvulling, onder welke benaming ook, op het pensioen of de rente dan
      wel op het loon van een grensarbeider die door het orgaan of de werkgever in het algemeen met dezelfde regelmaat
      en gelijktijdig met de uitkering betaalbaar wordt gesteld, als onderdeel van het pensioen, van de rente of van het
      loon aangemerkt.

      7 Onder de in het eerste lid bedoelde organen die pensioen of rente uitkeren worden mede verstaan werkgevers aan
      wie op grond van [artikel 40 van de Wet financiering sociale verzekeringen][ref4] toestemming is verleend het
      risico te dragen van de betalingen, bedoeld in [artikel 40, eerste lid, van die wet][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0018715#Artikel6.3.1
      [ref3]: https://wetten.overheid.nl/BWBR0004043
      [ref4]: https://wetten.overheid.nl/BWBR0017745#Artikel40
      [ref5]: https://wetten.overheid.nl/BWBR0017745#Artikel40
