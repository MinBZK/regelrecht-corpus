  - number: 6.2.1
    text: |-
      In [paragraaf 2][ref1] wordt verstaan onder:

      a. *subsidiejaar:* kalenderjaar ten behoeve waarvan de subsidie wordt verstrekt;

      b. *interventie:* kortdurende en doelgerichte behandeling die langs elektronische weg wordt verleend aan een
      anonieme persoon waarvan voor aanvang van de behandeling is vastgesteld dat deze daarvoor in aanmerking komt;

      c. *volledige interventie:* interventie die in het subsidiejaar is aangevangen en voltooid;

      d. *onvolledige interventie:* interventie die:

        - in het subsidiejaar is aanvangen en niet is voltooid of
        - in het jaar voorafgaand aan het subsidiejaar is aangevangen en in het subsidiejaar is voltooid;

      e. *organisatie:* privaatrechtelijke rechtspersoon met volledige rechtsbevoegdheid of rechtspersoon die krachtens
      publiekrecht is ingesteld;

      f. *accountant:* accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref2];

      g. *jaarrekening:* jaarrekening als bedoeld in [artikel 361 van Boek 2 van het Burgerlijk Wetboek][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel393
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel361
