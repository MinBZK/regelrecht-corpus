  - number: 6.2.2
    text: |-
      1 Het Zorginstituut kan aan een organisatie een subsidie verstrekken voor het door middel van interventies
      verlenen van geneeskundige geestelijke gezondheidszorg zoals huisartsen en klinisch-psychologen plegen te bieden,
      niet zijnde gespecialiseerde geestelijke gezondheidszorg, aan personen met een lichte tot matig ernstige, niet
      chronische psychische problematiek, inclusief de daarbij behorende diagnostiek of toegeleiding naar die zorg.

      2 De subsidie kan voor meerdere soorten interventies worden verstrekt.

      3 De subsidie wordt uitsluitend verstrekt:

      a. voor interventies die voldoen aan de stand van de wetenschap en de praktijk;

      b. ten behoeve van personen die om psychische redenen noodzakelijkerwijs anoniem zijn;

      c. voor interventies die uitgevoerd worden onder verantwoordelijkheid van een persoon die is ingeschreven in
      een register als bedoeld in de [Wet op de beroepen in de individuele gezondheidszorg][ref1] voor een beroep dat
      relevant is voor de interventie;

      d. aan organisaties voor geneeskundige geestelijke gezondheidszorg of verslavingszorg;

      e. voor het soort interventies dat reeds gedurende het laatste kwartaal van het jaar voorafgaand aan het
      subsidiejaar door de organisatie werden verleend.

      4 Geen subsidie wordt verstrekt voor het vaststellen of een persoon in aanmerking komt voor een interventie.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.2
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 6.2.3
    text: De subsidie wordt per kalenderjaar verstrekt.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.3
  - number: 6.2.4
    text: |-
      1 De te verlenen subsidie bedraagt per organisatie niet minder dan € 74.000 en niet meer dan € 1.042.000.

      2 Een aanvraag van minder dan € 74.000 wordt afgewezen.

      3 Op een aanvraag van meer dan € 1.042.000 kan ten hoogste een subsidie van € 1.042.000 worden verleend.

      4 De subsidie bedraagt maximaal € 464 per volledige interventie.

      5 De subsidie voor een onvolledige interventie bedraagt de helft van de subsidie voor een volledige interventie van
      dezelfde soort.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.4
  - number: 6.2.5
    text: |-
      1 Het subsidieplafond voor het verstrekken van subsidie bedraagt over het kalenderjaar 2025 € 4.576.000.

      2 Indien het totaal van de te verlenen subsidiebedragen hoger is dan het subsidieplafond verdeelt het Zorginstituut
      het ingevolge het subsidieplafond beschikbare bedrag evenredig over de ingediende aanvragen voor zover deze voor
      subsidie in aanmerking komen met dien verstande dat deze verdeling niet leidt tot een verlening van minder dan
      € 74.000.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.5
  - number: 6.2.6
    text: |-
      1 Voor een aanvraag tot verlening van subsidie wordt een door het Zorginstituut vastgesteld formulier gebruikt.

      2 Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.6
  - number: 6.2.7
    text: |-
      1 Een aanvraag tot verlening van subsidie wordt ontvangen uiterlijk dertien weken voor de aanvang van het jaar
      waarvoor de subsidie wordt aangevraagd.

      2 Een aanvraag die na de termijn, bedoeld in het eerste lid, wordt ontvangen, wordt afgewezen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.7
  - number: 6.2.8
    text: |-
      1 Bij de aanvraag tot verlening van de subsidie worden per soort interventie waarvoor de subsidie wordt aangevraagd
      de volgende gegevens verstrekt:

      a. een omschrijving van de interventie en de doelstelling daarvan;

      b. een onderbouwde opgave van het aantal volledige en onvolledige interventies;

      c. een onderbouwde opgave van de kosten per interventie.

      2 Bij de aanvraag tot verlening van de subsidie worden voorts de volgende gegevens verstrekt, waarbij indien nodig
      onderscheid wordt gemaakt naar soort interventie waarvoor de subsidie wordt aangevraagd:

      a. de wijze waarop de aanvrager vaststelt dat de interventie wordt verleend aan een persoon die om psychische
      redenen noodzakelijkerwijs anoniem is;

      b. de wijze waarop de aanvrager de anonimiteit waarborgt van de persoon waaraan de interventie wordt verleend;

      c. het beleid van de aanvrager ter beveiliging van de gegevensverwerking met betrekking tot de interventies;

      d. de inschrijving in een register als bedoeld in de [Wet op de beroepen in de individuele gezondheidszorg][ref1]
      van de beroepsbeoefenaar of beroepsbeoefenaren onder wiens verantwoordelijkheid de interventies verleend worden.


      [ref1]: https://wetten.overheid.nl/BWBR0006251
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.8
    references:
      - id: ref1
        bwb_id: BWBR0006251
  - number: 6.2.9
    text: |-
      1 De aanvraag tot verlening van de subsidie gaat vergezeld van:

      a. een afschrift van de oprichtingsakte van de rechtspersoon dan wel van de statuten zoals deze laatstelijk zijn
      gewijzigd;

      b. een afschrift van de volmacht voor het ondertekenen van de aanvraag, indien de aanvraag is ondertekend
      door een of meer andere personen dan de personen die op grond van de statuten bevoegd zijn de aanvrager te
      vertegenwoordigen;

      c. een afschrift van de inschrijving van de aanvrager in het Handelsregister.

      2 De stukken, bedoeld in het eerste lid, onderdelen a en c, kunnen achterwege blijven, indien de aanvrager er
      redelijkerwijs van uit mag gaan dat deze gegevens bij het Zorginstituut bekend zijn.

      3 Op verzoek van het Zorginstituut overlegt de aanvrager de laatst opgemaakte jaarrekening of, indien deze
      ontbreekt, een verslag over de financiële positie van de aanvrager op het moment van de aanvraag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.9
  - number: 6.2.10
    text: |-
      1 Indien de aanvrager niet heeft voldaan aan enig wettelijk voorschrift voor het in behandeling nemen van de
      aanvraag of indien de verstrekte gegevens en bescheiden onvoldoende zijn voor de beoordeling van de aanvraag of
      de voorbereiding van de beschikking stelt het Zorginstituut de subsidieaanvrager in de gelegenheid de aanvraag tot
      verlening van de subsidie binnen drie weken aan te vullen.

      2 Het Zorginstituut besluit de aanvraag niet in behandeling te nemen indien de aanvraag niet of niet voldoende is
      aangevuld binnen de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.10
  - number: 6.2.11
    text: |-
      Het Zorginstituut besluit voor de aanvang van het kalenderjaar waarvoor de subsidie wordt aangevraagd over de
      verlening van de subsidie.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.11
  - number: 6.2.12
    text: |-
      Het Zorginstituut vermeldt in het besluit tot verlening van de subsidie in ieder geval:

      a. het maximumbedrag dat aan subsidie wordt verleend;

      b. het bedrag dat per soort interventie voor een volledige interventie aan subsidie wordt verleend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.12
  - number: 6.2.13
    text: Het Zorginstituut kan bij het besluit tot subsidieverlening ambtshalve voorschotten verlenen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.13
  - number: 6.2.14
    text: |-
      De subsidieontvanger zorgt ervoor dat:

      a. de doelstellingen van de gesubsidieerde interventies op doelmatige wijze worden nagestreefd;

      b. de gesubsidieerde interventies op verantwoorde wijze worden uitgevoerd;

      c. de voor de uitvoering van de gesubsidieerde interventies benodigde middelen op verantwoorde wijze worden
      beheerd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.14
  - number: 6.2.15
    text: |-
      1 De subsidieontvanger houdt een zodanig ingerichte administratie bij dat daarin altijd kan worden nagegaan het
      aantal gerealiseerde volledige en onvolledige interventies, onderscheiden naar soort interventie, alsmede de voor
      de vaststelling van de subsidie van belang zijnde rechten en verplichtingen.

      2 De administratie wordt op overzichtelijke, controleerbare en doelmatige wijze ingericht.

      3 De administratie en de daartoe behorende bescheiden worden gedurende tien jaren na de vaststelling van de
      subsidie bewaard.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.15
  - number: 6.2.16
    text: |-
      1 De subsidieontvanger meldt meteen aan het Zorginstituut indien:

      a. het aannemelijk is geworden dat de interventies waarvoor de subsidie is verleend niet, niet tijdig of niet
      geheel zullen worden verricht,

      b. het aannemelijk is geworden dat niet of niet geheel aan de subsidieverplichtingen zal worden voldaan, of

      c. zich andere omstandigheden voordoen of zullen voordoen die van belang kunnen zijn voor een beslissing tot
      wijziging, intrekking of vaststelling van de subsidie.

      2 De melding wordt schriftelijk gedaan en voorzien van een toelichting.

      3 Bij de melding worden de relevante stukken overgelegd.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.16
  - number: 6.2.17
    text: |-
      1 De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens het Zorginstituut ingesteld onderzoek dat erop is gericht het Zorginstituut
      inlichtingen te verschaffen die van belang zijn voor het nemen van een besluit over het verstrekken van de
      subsidie.

      2 De subsidieontvanger werkt, onder meer door het verschaffen van de daartoe benodigde inlichtingen, gegevens en
      bescheiden, mee aan door of namens de minister ingesteld onderzoek dat erop is gericht de minister inlichtingen te
      verschaffen die van belang zijn voor de ontwikkeling van het beleid van de minister.

      3 De subsidieontvanger verplicht zijn accountant tot medewerking aan het onderzoek.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.17
  - number: 6.2.18
    text: |-
      1 Voor een aanvraag tot vaststelling van de subsidie wordt een door het Zorginstituut vastgesteld formulier
      gebruikt.

      2 Het aanvraagformulier wordt ondertekend door een persoon die bevoegd is de aanvrager te vertegenwoordigen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.18
  - number: 6.2.19
    text: |-
      1 De subsidieontvanger dient binnen tweeëntwintig weken na afloop van het subsidiejaar een aanvraag in tot
      vaststelling van de subsidie.

      2 Het Zorginstituut kan ontheffing verlenen van de termijn, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.19
  - number: 6.2.20
    text: |-
      1 De subsidieontvanger doet in de aanvraag tot vaststelling van de subsidie per soort interventie opgave van het
      aantal volledige en onvolledige interventies dat in het subsidiejaar is gerealiseerd.

      2 De subsidieontvanger toont in de aanvraag tot vaststelling aan dat is voldaan aan de aan de verleende subsidie
      verbonden verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.20
  - number: 6.2.21
    text: |-
      1 Indien de subsidie € 125.000 of meer bedraagt, legt de subsidieontvanger tevens verantwoording af door het
      overleggen van een assurancerapport.

      2 Het assurancerapport is opgesteld door een accountant overeenkomstig een door het Zorginstituut vastgesteld model
      met inachtneming van een door het Zorginstituut vastgesteld accountantsprotocol.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.21
  - number: 6.2.22
    text: |-
      1 De subsidie wordt vastgesteld op basis van het aantal volledige en onvolledige interventies dat in het
      subsidiejaar is gerealiseerd.

      2 De subsidie bedraagt per gerealiseerde volledige interventie het bedrag waarvan de hoogte bij de verlening voor
      dat soort interventies is genoemd.

      3 De subsidie bedraagt per gerealiseerde onvolledige interventie de helft van het bedrag waarvan de hoogte bij de
      verlening voor dat soort interventies is genoemd.

      4 Indien het bedrag van de subsidie berekend overeenkomstig de voorgaande leden minder is dan € 50.000, wordt de
      subsidie op nihil vastgesteld.

      5 De subsidie bedraagt niet meer dan het maximumbedrag dat aan subsidie is verleend.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.22
  - number: 6.2.23
    text: |-
      Binnen tweeëntwintig weken na ontvangst van de aanvraag tot vaststelling van de subsidie neemt het Zorginstituut
      een besluit op de aanvraag.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel6.2.23
  - number: 6.3.1
    text: |-
      1 De door een persoon als bedoeld in
      [artikel 69, eerste, vijftiende of zestiende lid, van de Zorgverzekeringwet][ref1] verschuldigde bijdrage
      wordt berekend door de grondslag van de bijdrage te vermenigvuldigen met het getal dat wordt berekend uit de
      verhouding tussen de gemiddelde uitgaven voor zorg voor een persoon ten laste van de sociale zorgverzekering
      in het woonland van deze persoon, en de gemiddelde uitgaven voor zorg voor een persoon uit hoofde van de
      [Zorgverzekeringswet][ref2] en de [Wet langdurige zorg][ref3] in Nederland.

      2 De grondslag van de bijdrage is gelijk aan de som van:

      a. een inkomensafhankelijke bijdrage ter hoogte van de inkomensafhankelijke bijdrage die de persoon, bedoeld in het
      eerste lid, op grond van [paragraaf 5.2 van de Zorgverzekeringswet][ref4] verschuldigd zou zijn geweest indien hij
      verzekeringsplichtig zou zijn geweest,

      b. een inkomensafhankelijke bijdrage, berekend overeenkomstig de op grond van de
      [Wet financiering sociale verzekeringen][ref5] verschuldigde premie voor de [Wet langdurige zorg][ref6],
      en verminderd met het bedrag waarop de partner van degene die de bijdrage verschuldigd is volgens de
      [artikelen 8.9][ref7] en [8.9a van de Wet inkomstenbelasting 2001][ref8] recht zou hebben indien degene die de
      bijdrage verschuldigd is verzekerd zou zijn ingevolge de [Wet langdurige zorg][ref9], voor zover op grond van deze
      bepalingen geen teruggave in de inkomstenbelasting is verleend, en,

      c. vanaf de eerste dag van de kalendermaand volgende op de kalendermaand waarin deze persoon de leeftijd
      van achttien jaar heeft bereikt, een bijdrage per maand overeenkomende met eentwaalfde van het bedrag van de
      geraamde gemiddelde premie voor een verzekerde voor een zorgverzekering in het berekeningsjaar, bedoeld in
      [artikel 4 van de Wet op de zorgtoeslag][ref10] (hierna: nominale deel).

      Voor de toepassing van deze bepaling wordt onder een partner verstaan een partner in de zin van
      [artikel 1.2 van de Wet inkomstenbelasting 2001][ref11].

      3 De peildatum voor de vaststelling van het in het eerste lid genoemde woonland is telkens de eerste dag van de
      kalendermaand volgende op de kalendermaand waarin een wijziging van het woonland heeft plaatsgevonden.

      4 Voor de toepassing van de [Wet op de zorgtoeslag][ref12] wordt het in het tweede lid bedoelde nominale deel, als
      premie voor een zorgverzekering beschouwd.

      5 De bijdrage die een pensioen- of renteverstrekkend orgaan als bedoeld in
      [artikel 69, zesde lid, van de Zorgverzekeringswet][ref13] verschuldigd is, is gelijk aan de inkomensafhankelijke
      bijdrage die dit orgaan over het loon als bedoeld in [artikel 42 van die wet][ref14] verschuldigd zou zijn geweest,
      indien degene aan wie hij het pensioen of de rente verstrekt, in Nederland zou hebben gewoond, vermenigvuldigd met
      het getal, bedoeld in het eerste lid.

      6 De inkomensgegevens, benodigd voor de berekening van de in het tweede lid bedoelde grondslag
      en de in het vijfde lid bedoelde bijdrage, worden ontleend aan het toetsingsinkomen, bedoeld in
      [artikel 8, eerste en tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref15].

      7 Indien het in [artikel 8, tweede lid, van de Algemene wet inkomensafhankelijke regelingen][ref16]
      bedoelde, niet in Nederland belastbaar inkomen niet is vastgesteld op grond van
      [artikel 8a van de Algemene wet inkomensafhankelijke regelingen][ref17], wordt het door de rijksbelastingdienst
      vastgesteld met overeenkomstige toepassing van dat artikel.

      8 Ter zake van de opgaaf van niet in Nederland belastbaar inkomen is de
      [Algemene wet inzake rijksbelastingen][ref18], met uitzondering van [Hoofdstuk VIIIA][ref19], van toepassing als
      ware deze opgaaf een aangifte inkomstenbelasting.

      9 Het verhoudingsgetal, bedoeld in het eerste lid, wordt per land genoemd in [bijlage 4][ref20] bij deze regeling.


