    text: |-
      het gedeelte van het loon of het bijdrage-inkomen dat onderworpen is aan heffing van inkomensafhankelijke premie
      als bedoeld in het [Besluit zorgverzekering BES][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0029404
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.7
    references:
      - id: ref1
        bwb_id: BWBR0029404
