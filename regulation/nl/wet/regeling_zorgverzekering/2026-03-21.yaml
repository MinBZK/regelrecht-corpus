  - number: 5.7.1
    text: |-
      Voor de toepassing van dit artikel en van [artikel 5.8][ref1] worden de landen van het Koninkrijk der Nederlanden
      aangemerkt als afzonderlijke mogendheden.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel5
