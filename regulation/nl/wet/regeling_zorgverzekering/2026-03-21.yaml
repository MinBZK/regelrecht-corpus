      het gedeelte van het loon of het bijdrage-inkomen, waarop ingevolge een internationale regeling inzake sociale
      zekerheid die tussen Nederland en een of meer andere mogendheden van kracht is, de wetgeving van een andere
      mogendheid van toepassing is,
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel5.7
