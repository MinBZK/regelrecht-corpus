      voldaan is aan [onderdeel 1 van bijlage 2][ref1] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018715
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.5
    references:
      - id: ref1
        bwb_id: BWBR0018715
  - number: 2.5.4
    text: |-
