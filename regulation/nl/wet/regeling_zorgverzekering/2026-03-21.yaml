        bwb_id: BWBR0018450
        artikel: '40'
  - number: '4.3'
    text: |-
      1 De betaalrekeningen van het Zorginstituut bij in Nederland gevestigde banken worden door het Ministerie van
      Financiën in overeenstemming met de betrokken banken opgenomen in concernverband met betaalrekeningen van ’s rijks
      schatkist bij die banken.

      2 Dagelijks op nader in overleg met de betrokken banken te bepalen tijdstippen worden de op de betaalrekeningen
      van het Zorginstituut voorkomende positieve saldi overgeboekt naar ’s rijks schatkist, dan wel worden voorkomende
      negatieve saldi aangevuld vanuit ’s rijks schatkist. De hiermee samenhangende mutaties op de betaalrekeningen
      worden door het Ministerie van Financiën ten gunste dan wel ten laste van de rekening-courant, bedoeld in
      [artikel 4.2][ref1], geboekt.

      3 Het Ministerie van Financiën sluit met het Zorginstituut een overeenkomst ter uitwerking van het gebruik van de
      rekening-courant.

      4 In de overeenkomst, bedoeld in het derde lid, worden afspraken vastgelegd over de wederzijdse
      informatievoorziening tussen enerzijds het Ministerie van Financiën en anderzijds het Zorginstituut en kan bij
      wijze van uitzondering afgesproken worden om een betaalrekening buiten het concernverband als bedoeld in het eerste
      lid te houden.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel4.2
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel4.3
