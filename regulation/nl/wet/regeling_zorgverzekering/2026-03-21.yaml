  - number: '2.43'
    text: |-
      1 Per groep van onderling vervangbare geneesmiddelen wordt een gemiddelde prijs berekend.

      2 Voor de berekening van de gemiddelde prijs wordt de groep verdeeld in subgroepen van geneesmiddelen die hetzelfde
      werkzame bestanddeel of dezelfde combinatie van werkzame bestanddelen hebben.

      3 Binnen een subgroep wordt voor de specialités met eenzelfde merknaam, met uitzondering van de branded generics,
      een gemiddelde prijs per standaarddosis berekend.

      4 Binnen een subgroep wordt voor andere geneesmiddelen dan die, bedoeld in het derde lid, een gemiddelde prijs
      per standaarddosis berekend. Die prijs is het gemiddelde van de laagste prijzen van de geneesmiddelen in dezelfde
      farmaceutische vorm.

      5 Per subgroep worden de ingevolge het derde en vierde lid berekende gemiddelde prijzen per standaarddosis opgeteld
      en wordt die uitkomst gemiddeld, zodat een prijs per subgroep wordt verkregen.

      6 Indien in de Taxe voor een specialité meer dan één prijs wordt vermeld, wordt uitgegaan van de laagste prijs.
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.43
  - number: '2.44'
    text: |-
      1 Indien de groep van onderling vervangbare geneesmiddelen bestaat uit slechts één subgroep, is de in
      [artikel 2.43, vijfde lid][ref1], bedoelde prijs per subgroep de basis voor de berekening van de vergoedingslimiet
      van de tot die groep behorende geneesmiddelen.

      2 Indien de groep van onderling vervangbare geneesmiddelen bestaat uit meer dan één subgroep, worden, indien:

      a. de geneesmiddelen behoren tot één categorie in de Anatomical Therapeutic Chemical Classification op niveau 4,
      alle prijzen per subgroep bij elkaar opgeteld en wordt vervolgens het gemiddelde ervan berekend;

      b. de geneesmiddelen behoren tot verschillende categorieën op niveau 4 van de Anatomical Therapeutic Chemical
      Classification, de prijzen voor de verschillende subgroepen, voor zover behorend tot dezelfde categorie, gemiddeld,
      worden de aldus berekende prijzen voor de afzonderlijke categorieën opnieuw gemiddeld en vormt het aldus verkregen
      gemiddelde de berekeningsbasis voor de bepaling van de vergoedingslimiet.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.43
