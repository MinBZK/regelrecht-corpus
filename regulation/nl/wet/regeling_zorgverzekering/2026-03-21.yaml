  - number: '2.13'
    text: |-
      1 Hulpmiddelen als bedoeld in [artikel 2.6, onderdeel f][ref1], omvatten:

      a. hulpmiddelen ter correctie van stoornissen in de visuele functie van het oog en van functies van aan het oog
      verwante structuren;

      b. hulpmiddelen ter compensatie van beperkingen;

      1°. in het lezen, schrijven of gebruik van telecommunicatieapparatuur;

      2°. bij het om obstakels heenlopen of bij de oriëntatie.

      2 De zorg, bedoeld in het eerste lid, omvat niet:

      a. brillenglazen of filterglazen;

      b. brilmonturen voor brillenglazen of filterglazen;

      c. eenvoudige hulpmiddelen voor lezen en schrijven.

      3 In het geval van lenzen dient:

      a. de stoornis het gevolg te zijn van een medische aandoening of een trauma, waarbij lenzen tot een grotere
      verbetering in de functies gezichtsscherpte of kwaliteit van de visus leiden dan brillenglazen, of

      b. bij verzekerden jonger dan achttien jaar sprake te zijn van pathologische myopie met een refractieafwijking van
      ten minste –6 dioptrieën.

      4 In afwijking van het tweede lid, onderdeel a, omvat de zorg brillenglazen en filterglazen voor verzekerden tot
      achttien jaar, indien:

      a. er sprake is van indicatie voor lenzen als bedoeld in het derde lid, maar het dragen van lenzen niet de voorkeur
      heeft,

      b. de verzekerde aan een of beide ogen geopereerd is vanwege een lensafwijking, of

      c. de verzekerde lijdt aan zuivere accommodatieve esotropie.

      5 Voor blindengeleidehonden geldt dat een tegemoetkoming kan worden verleend in de redelijk te achten
      gebruikskosten.


      [ref1]: https://wetten.overheid.nl/BWBR0018715#Artikel2.6
    url: https://wetten.overheid.nl/BWBR0018715/2026-03-21#Artikel2.13
