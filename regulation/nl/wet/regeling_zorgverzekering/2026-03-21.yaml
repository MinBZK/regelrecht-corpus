  - number: 6.4.2
    text: |-
      1 Een gemoedsbezwaarde die een gezamenlijke huishouding met een of meer andere
      gemoedsbezwaarden verlaat, kan het CAK verzoeken een evenredig gedeelte van het saldo van de in
      [artikel 70, tweede lid, van de Zorgverzekeringswet][ref1] bedoelde rekening, over te maken op een voor hem te
      openen rekening als bedoeld in artikel 70, eerste lid van de Zorgverzekeringswet.

      2 Het verzoek wordt ontvangen uiterlijk 30 juni van het kalenderjaar volgend op het jaar waarin de gemoedsbezwaarde
      de gezamenlijke huishouding verlaat.

      3 Het evenredig gedeelte wordt bepaald op basis van het saldo dat resteert nadat een besluit is genomen op alle
      verzoeken die het CAK heeft ontvangen in het jaar waarin de gemoedsbezwaarde de gezamenlijke huishouding verlaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018450#Artikel70
