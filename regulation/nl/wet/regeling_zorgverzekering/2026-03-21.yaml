  - number: '5.4'
    text: |-
      1 Het percentage, bedoeld in [artikel 45, eerste lid, van de Zorgverzekeringswet][ref1], wordt vastgesteld op 6,10.

      2 Het percentage, bedoeld in [artikel 45, tweede lid, van de Zorgverzekeringswet][ref2], wordt vastgesteld op 4,85.

      3 In afwijking van het eerste of tweede lid, wordt het percentage vastgesteld op nihil over
      bijdrage-inkomen voortvloeiende uit werkzaamheden van een verzekeringsplichtige aan boord van
      een zeeschip in de zin van het Burgerlijk Wetboek, mits de werkgever of de scheepsbeheerder,
      bedoeld in [artikel 1 van de Wet bemanning zeeschepen][ref3], het risico als bedoeld in
      [hoofdstuk 3 van de Zorgverzekeringswet][ref4], op grond van een verdragsrechtelijke bepaling of een bepaling die
      daarop stoelt, in belangrijke mate voor zijn rekening neemt zolang deze verzekeringsplichtige niet is teruggekeerd
      of heeft kunnen terugkeren naar het land waar hij zijn woonplaats of gewone verblijfplaats heeft.

      4 Indien het loon waarover de inhoudingsplichtige inkomensafhankelijke bijdrage verschuldigd is meer bedraagt
      dan het bedrag, genoemd in [artikel 5.2][ref5], en is samengesteld uit bestanddelen waarover een verschillend
      bijdragepercentage is verschuldigd, worden de bestanddelen zodanig toegerekend dat het bijdragepercentage van 6,10
      het eerst in aanmerking wordt genomen, en daarna het percentage van 0.

      5 Indien het bijdrage-inkomen waarover de verzekeringsplichtige inkomensafhankelijke bijdrage verschuldigd
      is meer bedraagt dan het bedrag, bedoeld in [artikel 5.3][ref6], en is samengesteld uit bestanddelen waarover
      een verschillend bijdragepercentage is verschuldigd, worden de bestanddelen zodanig toegerekend dat het
      bijdragepercentage van 4,85 het eerst in aanmerking wordt genomen, en daarna het percentage van 0.


