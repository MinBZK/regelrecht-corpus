  - number: 1.6.1.6.2
    text: |-
      De [Awb][ref1] is niet van toepassing op de opsporing en de vervolging van strafbare feiten, alsmede de
      tenuitvoerlegging van strafrechtelijke beslissingen ([art. 1:6 Awb][ref2]). Op een transactie-aanbod aan de
      verdachte/belastingplichtige in fiscale- en douanestrafzaken is de [Awb][ref3] niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.6
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref3
        bwb_id: BWBR0005537
  - number: '1.7'
    text: |-
      Voor het belastingrecht geldt een aantal uitzonderingen op de algemene regels van de [Awb][ref1]:


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 1.7.1
    text: |-
      De aanvang van de bezwaar- en beroepstermijn blijft gesteld op de dag volgend op die van de dagtekening van (het
      afschrift van) de beschikking, en niet op de dag na die waarop het besluit is bekendgemaakt. Door deze bepaling
      blijft de huidige praktijk gehandhaafd.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.7
  - number: 1.7.2
    text: |-
      Het doen van aangifte is geen aanvraag in de zin van [art. 1:3, derde lid, Awb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
  - number: '1.8'
    text: |-
      In het kader van de invoering van de [Awb][ref1] is de[ AWR][ref2] op een aantal punten aangepast. Ook is voor
      het belastingrecht een aantal afwijkingen van de [Awb][ref3] opgenomen. Zie § 1.7. Desondanks blijft het mogelijk
      dat bij de uitvoering hiaten dan wel overlappingen worden geconstateerd. In dat geval is het uitgangspunt dat de
      bepalingen van de [AWR][ref4] -als bijzondere wet- in beginsel voorgaan op de bepalingen van de [Awb][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0002320
      [ref3]: https://wetten.overheid.nl/BWBR0005537
      [ref4]: https://wetten.overheid.nl/BWBR0002320
      [ref5]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.8
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0002320
      - id: ref3
        bwb_id: BWBR0005537
      - id: ref4
        bwb_id: BWBR0002320
      - id: ref5
        bwb_id: BWBR0005537
  - number: '2.1'
    text: |-
      De [Awb][ref1] is van toepassing op besluiten van bestuursorganen. De inspecteur, de ontvanger, de directeur,
      de minister en de staatssecretaris zijn bestuursorgaan in de zin van de [Awb][ref2]. Het hoofd van de eenheid is
      aangewezen als inspecteur en ontvanger. Organen van de rechterlijke macht zijn geen bestuursorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
  - number: '2.2'
    text: |-
      De [Awb][ref1] verstaat onder belanghebbende: degene wiens belang rechtstreeks bij een besluit is betrokken. Voor
      de Belastingdienst kan dit worden ingevuld als degene wiens belang rechtstreeks bij de heffing of invordering
      van belasting is betrokken. Dit is degene voor wie uit de heffing of invordering rechtstreeks rechten of
      verplichtingen voortvloeien, derhalve de belastingplichtige, de inhoudingsplichtige, de belastingschuldige en de
      aansprakelijkgestelde.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '2.3'
    text: |-
      Onder besluit wordt verstaan: een schriftelijk vastgelegde publiekrechtelijke rechtshandeling van een
      bestuursorgaan. Te onderscheiden zijn: besluiten van algemene strekking en beschikkingen. Bij besluiten van
      algemene strekking kan worden gedacht aan beleidsregels. Beschikkingen zijn besluiten in een concreet geval die
      zich veelal tot een enkele belanghebbende richten. Bij het besluitbegrip staan de volgende begrippen centraal:
      schriftelijk, publiekrechtelijk, rechtshandeling en bestuursorgaan.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.3
  - number: 2.3.2.3.1
    text: |-
      Een besluit moet schriftelijk kenbaar worden gemaakt. Een mondelinge beslissing is geen besluit in de zin van de
      [Awb][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 2.3.2.3.2
    text: |-
      De meeste beslissingen van de Belastingdienst worden genomen op grond van zijn publiekrechtelijke taak. Deze
      beslissingen vallen onder de werking van de [Awb][ref1]. Rechtshandelingen naar burgerlijk recht zijn evenwel
      uitgesloten van de werking van de [Awb][ref2]. Voor de Belastingdienst valt hierbij te denken aan het aanvragen
      van een faillissement door de ontvanger en het beslissen op verzoeken om coulancerente. Via de schakelbepaling
      van [artikel 3:1, tweede lid, Awb][ref3] is de overheid ook bij privaatrechtelijk handelen gebonden aan de Awb-
      bepalingen over zorgvuldigheid en belangenafweging.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 2.3.2.3.3
    text: |-
      Kenmerkend voor de rechtshandeling is dat het gaat om een handelen waarmee een rechtsgevolg wordt beoogd. De
      rechtshandeling onderscheidt zich daarin van het feitelijk handelen. Het behandelen van klachten en verrichten van
      voorbereidingshandelingen hebben in het algemeen geen rechtsgevolg en vormen dus geen rechtshandelingen.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.3
  - number: 2.4.2.4.1
    text: |-
      Onder aanvraag wordt verstaan: een verzoek van een belanghebbende om een besluit te nemen. De aanvrager verzoekt
      de Belastingdienst een beschikking af te geven. Te denken valt aan aanvragen voor een beschikking vermindering
      loonbelasting, verzoeken om toepassing van de fiscale eenheid in de vennootschapsbelasting en de diverse
      vergunningen in het douanerecht.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.4
  - number: 2.4.2.4.2
    text: |-
      Verzoeken om algemene informatie en het indienen van klachten worden niet gezien als aanvraag; de reactie hierop is
      over het algemeen geen rechtshandeling (er is geen rechtsgevolg) zodat geen beschikking tot stand komt.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.4
  - number: 2.4.2.4.3
    text: |-
      Indien de verstrekte informatie bindend is voor de Belastingdienst kan wel sprake zijn van rechtsgevolg,
      bijvoorbeeld ingeval de inspecteur vooraf duidelijk zijn standpunt bepaalt waaraan hij bij de aanslagregeling
      gebonden is. In veel gevallen maakt de standpuntbepaling vooraf echter deel uit van het traject dat uiteindelijk
      wordt voltooid met het vaststellen van de belastingaanslag. In dat geval mist een dergelijke standpuntbepaling
      zelfstandigheid en is geen sprake van een beschikking. Zie ook [bijlagen I][ref1], II en III.


      [ref1]: https://wetten.overheid.nl/BWBR0008847
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0008847
  - number: 2.4.2.4.4
    text: |-
      Het doen van aangifte (w.o. het indienen van een T-biljet of J-biljet) moet worden gezien als het voldoen aan de
      verplichtingen op grond van de [AWR][ref1] en niet als het doen van een aanvraag in de zin van de [Awb][ref2]. De
      aanslag is daarom geen beschikking op aanvraag maar een ambtshalve beschikking. Dit neemt niet weg dat doen van
      aangifte door de belastingplichtige in bepaalde gevallen gelijkenis vertoont met het doen van een aanvraag. Ter
      voorkoming van misverstanden is in [artikel 8, tweede lid, AWR][ref3] opgenomen dat het doen van aangifte geen
      aanvraag is in de zin van [artikel 1:3, derde lid van de Awb][ref4]. De aanvraag van een beschikking wordt verder
      behandeld in § 5.3.


      [ref1]: https://wetten.overheid.nl/BWBR0002320
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0002320#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel1
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.4
    references:
      - id: ref1
        bwb_id: BWBR0002320
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0002320
        artikel: '8'
      - id: ref4
        bwb_id: BWBR0005537
        artikel: '1'
  - number: 2.5.2.5.1
    text: |-
      Bezwaar is: het gebruik maken van de ingevolge een wettelijk voorschrift bestaande bevoegdheid, voorziening tegen
      een besluit te vragen bij het bestuursorgaan dat het besluit heeft genomen. Voor de toepassing van wettelijke
      voorschriften over bezwaar en beroep worden met een besluit gelijkgesteld:
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.5
  - number: 2.5.2.5.1.a
    text: de schriftelijke weigering een besluit te nemen, en
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.5
  - number: 2.5.2.5.1.b
    text: het niet tijdig nemen van een besluit.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.5
  - number: 2.5.2.5.2
    text: |-
      Beroep kan op twee manieren worden ingesteld: - bij een ander bestuursorgaan dan het bestuursorgaan dat het
      primaire besluit heeft genomen, of
        - bij een administratieve rechter (zoals bijvoorbeeld de belastingrechter). Indien de bijzondere wet voorschrijft
      dat beroep bij een ander bestuursorgaan moet worden ingesteld, is sprake van administratief beroep.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel2.5
  - number: '3.1'
    text: |-
      [Hoofdstuk 2 Awb][ref1] geeft een aantal bepalingen over het verkeer tussen burgers en bestuursorganen. Deze
      bepalingen gelden voor al het handelen van de Belastingdienst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel3.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '2'
  - number: '3.2'
    text: |-
      Een ieder kan zich ter behartiging van zijn belangen in het verkeer met bestuursorganen laten bijstaan of door een
      gemachtigde laten vertegenwoordigen ([art. 2:1 Awb][ref1]). Het optreden van een gemachtigde heeft tot gevolg dat
      het contact tussen belastingplichtige en de Belastingdienst -afgezien van de persoonlijke oproeping- in beginsel
      via de gemachtigde loopt. Dit heeft bijvoorbeeld in de bezwaarfase als consequentie dat de eenheid die bevoegd is
      op het bezwaar te beslissen, de op de zaak betrekking hebbende stukken in ieder geval aan de gemachtigde toezendt
      ([6:17 Awb][ref2]), zulks met inachtneming van [hoofdstuk 4.3 VIV 1993][ref3]. Ook al heeft een belastingplichtige
      een gemachtigde, dan betekent dit niet dat ieder contact tussen belastingplichtige en de Belastingdienst via de
      gemachtigde moet lopen. Zowel de aard van de contacten als de bedoeling van de belastingplichtige zijn factoren
      die hierbij een rol kunnen spelen. Als voorbeeld waarin de Belastingdienst ook met belastingplichtige contact kan
      opnemen, geldt de situatie waarin de kennis van de gemachtigde irrelevant is (bijvoorbeeld de aankondiging van een
      bezoek in het kader van een ’waarneming ter plaatse’) of de gevraagde informatie uitsluitend van belastingplichtige
      te verkrijgen is. Twijfelt de Belastingdienst in een bepaald geval aan de vertegenwoordigingsbevoegdheid, dan
      kan om een schriftelijke machtiging van de opdrachtgever worden verzocht. Ook van een advocaat of procureur
      kan de overlegging van een volmacht worden verlangd. Dit laatste is echter niet meer mogelijk tijdens een
      beroepsprocedure voor de rechter. De bepalingen in de[Awb][ref4] inzake bijstand en vertegenwoordiging gelden naast
      de [artikelen 41 t/m 46 van de AWR][ref5]. In de [Awb][ref6] zijn echter expliciet een aantal regels opgenomen die
      niet voorkomen in de [AWR][ref7]:


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0010092#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0005537
      [ref5]: https://wetten.overheid.nl/BWBR0002320#Artikel41
      [ref6]: https://wetten.overheid.nl/BWBR0005537
      [ref7]: https://wetten.overheid.nl/BWBR0002320
