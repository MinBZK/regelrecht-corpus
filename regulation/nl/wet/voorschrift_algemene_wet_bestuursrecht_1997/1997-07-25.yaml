  - number: 3.2.-
    text: |-
      het bestuursorgaan kan bijstand of vertegenwoordiging door een persoon tegen wie ernstige bezwaren bestaan,
      weigeren ([art. 2:2, eerste lid, Awb][ref1]);


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 3.2.-
    text: |-
      de belanghebbende en de persoon tegen wie (als vertegenwoordiger) ernstige bezwaren bestaan worden onverwijld
      schriftelijk van de weigering in kennis gesteld ([art. 2:2, tweede lid, Awb][ref1]); en


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 3.2.‐
    text: |-
      het bestuursorgaan kan advocaten en procureurs niet als vertegenwoordigers weigeren
      ([art. 2:2, derde lid, Awb][ref1]).


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel3.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '2'
  - number: '3.3'
    text: |-
      Correspondentie die is gericht aan een onbevoegde eenheid of zelfs geheel niet bestemd is voor de Belastingdienst
      wordt doorgezonden aan de competente eenheid of andere instantie waarvoor deze is bestemd. De afzender wordt van de
      doorzending op de hoogte gesteld. Indien het niet duidelijk is voor welke instantie de correspondentie bestemd is,
      vindt terugzending plaats aan de afzender. Voor het doorzenden van bezwaar- en beroepschriften geldt een speciale
      regeling; zie § 6.1.4.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel3.3
  - number: '3.4'
    text: |-
      De geheimhoudingsbepaling van de [Awb][ref1] vormt een aanvulling op de geheimhoudingsbepalingen in de diverse
      fiscale wetten. De fiscale geheimhoudingsbepalingen zijn strakker en blijven onverkort van kracht zodat geen sprake
      is van een wijziging van de bestaande praktijk. Nadere voorschriften rond de geheimhoudingsplicht zijn gegeven in
      het [VIV 1993][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0010092
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel3.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0010092
  - number: '4.1'
    text: |-
      De Belastingdienst is bij zijn handelen niet alleen gebonden aan in wetgeving neergelegde rechtsregels, maar
      ook aan ongeschreven recht. Bij het ongeschreven recht moet vooral worden gedacht aan de algemene beginselen van
      behoorlijk bestuur. In de [Awb][ref1] is een aantal van deze beginselen in wetteksten vastgelegd (gecodificeerd).
      In [afdeling 3.2 Awb][ref2] (zorgvuldigheid en belangenafweging) zijn de volgende beginselen opgenomen: - bij de
      voorbereiding van een besluit vergaart het bestuursorgaan de nodige kennis omtrent de relevante feiten en af te
      wegen belangen. Hierbij mag de Belastingdienst in het algemeen afgaan op de door belastingplichtige verstrekte
      gegevens. De Belastingdienst behoeft niet zelf ter plekke de feiten te gaan vaststellen ingeval belanghebbende
      onvoldoende gegevens heeft verstrekt;
        - het bestuursorgaan gebruikt de bevoegdheid tot het nemen van een besluit niet voor een ander doel dan waarvoor
      die bevoegdheid is verleend;
        - het bestuursorgaan weegt de rechtstreeks bij het besluit betrokken belangen af, voor zover niet uit een wettelijk
      voorschrift of uit de aard van de uit te oefenen bevoegdheid een beperking voortvloeit;
        - de voor een of meer belanghebbenden nadelige gevolgen van een besluit mogen niet onevenredig zijn in verhouding
      tot de met het besluit te dienen doelen. Het opnemen van deze beginselen in [hoofdstuk 3 Awb][ref3] betekent
      dat zij een algemeen toepassingsbereik hebben en op alle handelingen van bestuursorganen van toepassing zijn.
      De bepalingen zijn dan ook van toepassing op alle beschikkingen die door de Belastingdienst worden gegeven.
      [Hoofdstuk 3 Awb][ref4] is met uitzondering van [artikel 3:40][ref5] (een besluit treedt niet in werking voordat
      het is bekendgemaakt) volledig van toepassing op de [Invorderingswet 1990][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref6]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel4.1
