preamble:
  text: |-
    Besluit:

    Vast te stellen het Voorschrift Algemene wet bestuursrecht 1997.
  url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'De Awb geeft:'
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.1
  - number: 1.1.1
    text: algemene regels van bestuursrecht;
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.1
  - number: 1.1.2
    text: een algemene regeling van het bestuursprocesrecht.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.1
  - number: '1.2'
    text: |-
      In de eerste tranche worden algemene regels gegeven over een aantal elementaire bestuursrechtelijke onderwerpen,
      zoals de beginselen van behoorlijk bestuur, de totstandkoming van beschikkingen en de bezwaarschriftprocedure. Deze
      tranche is in werking getreden op 1 januari 1994.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.2
  - number: '1.3'
    text: |-
      De tweede tranche heeft tot doel de uniformering van het bestuursprocesrecht. Dit bestuursprocesrecht is als
      [hoofdstuk 8 opgenomen in de Awb][ref1]. Het uniforme bestuursprocesrecht geldt -vooralsnog- niet voor het
      belastingrecht. Deze tranche is in werking getreden op 1 januari 1994.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '8'
  - number: '1.4'
    text: |-
      In de derde tranche worden onderwerpen van uiteenlopende aard geregeld. Voor het belastingrecht zijn met name de
      regels inzake mandaat van belang. Deze tranche zal vermoedelijk op 1 januari 1998 in werking treden.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel1.4
  - number: '1.5'
    text: |-
      Awb: [Algemene wet bestuursrecht][ref1] AWR: [Algemene wet inzake rijksbelastingen][ref2]
      WIB: [Wet op de internationale bijstandsverlening bij de heffing van belastingen][ref3] WOB:
      [Wet openbaarheid van bestuur][ref4] CDW: [Verordening (EEG) nr. 2913/92](31992R2913) van de Raad van
      12 oktober 1992 tot vaststelling van het Communautair douanewetboek (Pb.EG. 1992, L 302) VIV 1993:
      [Voorschrift informatieverstrekking 1993][ref5]


