  - number: 1.5.1.5.1
    text: |-
      Dit voorschrift heeft geen betrekking op het bestuursprocesrecht van [hoofdstuk 8 van de Awb][ref1]. Het
      voorschrift bestaat uit een algemeen deel met bijlagen. In het algemeen deel wordt ingegaan op de regels
      van het bestuursrecht zoals deze per 1 januari 1994 gelden voor de Belastingdienst. Deze regels zijn
      “middeloverschrijdend”. Dit voorschrift is eveneens van toepassing op de invordering. [Bijlage I][ref2] is
      specifiek gericht op het douanerecht. In bijlage II wordt de [Awb][ref3] benaderd per belastingmiddel. In deze
      bijlage, die niet uitputtend is bedoeld, is per beslismoment vermeld hoe de beslissing in de zin van de [Awb][ref4]
      kan worden aangeduid. Bijlage III tenslotte bevat een overzicht van de beslismomenten in het invorderingsproces
      in relatie tot de [Awb][ref5]. Het algemene deel van het voorschrift volgt zoveel mogelijk de indeling van de
      [Awb][ref6]. Bespreking vindt plaats per onderwerp.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
      [ref2]: https://wetten.overheid.nl/BWBR0008847
