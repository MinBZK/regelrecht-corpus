  - number: 4.2.4.2.1
    text: |-
      In [afdeling 4.1.4 Awb][ref1] is het motiveringsbeginsel vastgelegd. Het motiveringsbeginsel houdt in dat uit
      de motivering van de beschikking moet blijken dat de feiten op de juiste wijze zijn vastgesteld en dat deze
      vaststelling heeft kunnen leiden tot de genomen beslissing. De motivering moet aan belanghebbende kenbaar worden
      gemaakt. Bij het in werking treden van de derde tranche van de [Awb][ref2] wordt het motiveringsbeginsel van
      [hoofdstuk 4 Awb][ref3] overgeheveld naar [hoofdstuk 3][ref4]. Het motiveringsbeginsel krijgt daardoor een ruimer
      toepassingsbereik en is ook op de [Invorderingswet 1990][ref5] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk3
      [ref5]: https://wetten.overheid.nl/BWBR0004770
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel4.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.4
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0005537
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0005537
        hoofdstuk: '3'
      - id: ref5
        bwb_id: BWBR0004770
  - number: 4.2.4.2.2
    text: |-
      In de praktijk wordt bij afwijking van de aangifte aangegeven op welke punten de afwijking betrekking heeft.
      In verreweg de meeste gevallen wordt dat door de belastingplichtige een voldoende motivering geacht. Indien een
      aanslag conform de aangifte wordt vastgesteld, kan ervan worden uitgegaan dat aan vermelding van de motivering geen
      behoefte zal bestaan. Verzoekt belastingplichtige echter binnen een redelijke termijn alsnog om een (aanvullende)
      motivering, dan wordt deze verstrekt.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel4.2
  - number: 4.2.4.2.3
    text: |-
      De motivering wordt vermeld bij de bekendmaking van het besluit. Bij geautomatiseerde verwerking kan het voorkomen
      dat het formele besluit wordt verzonden vanuit het Automatiseringscentrum te Apeldoorn en de motivering van het
      besluit vanuit de lokale eenheid. In dat geval wordt de motivering zo snel mogelijk verzonden zodat deze voor
      of gelijktijdig met de formele beschikking belanghebbende bereikt. Bij vereiste spoed (bijvoorbeeld dreigende
      verjaring voor het opleggen van een belastingaanslag) kan het besluit zonder motivering worden bekendgemaakt zodat
      het besluit direct in werking kan treden. Het bestuursorgaan verstrekt de motivering dan binnen een week na de
      bekendmaking van het besluit. De termijn voor het instellen van bezwaar of beroep vangt aan met ingang van de dag
      na die van dagtekening van het afschrift van het formele besluit (zie ook § 6.1.2.).
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel4.2
  - number: 4.2.4.2.4
    text: |-
      Voor de motivering mag worden verwezen naar controlerapporten en FIOD-rapporten voor zover daaruit de motivering
      blijkt en de desbetreffende passages aan belanghebbende bekend zijn gemaakt.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel4.2
  - number: '4.3'
    text: |-
      Indien tegen een besluit bezwaar kan worden gemaakt of beroep kan worden ingesteld, wordt daarvan bij de
      bekendmaking en bij de mededeling van het besluit melding gemaakt. Hierbij wordt vermeld door wie, binnen welke
      termijn en bij welk orgaan bezwaar kan worden gemaakt of beroep kan worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel4.3
  - number: '4.4'
    text: |-
      Een besluit treedt in werking nadat het is bekendgemaakt ([art. 3:40 Awb][ref1]). Voor de
      [Invorderingswet 1990][ref2] geldt dat een besluit in werking kan treden voordat het is bekendgemaakt aangezien
      [art. 3:40 Awb][ref3] voor deze wet toepassing mist. De bekendmaking van beschikkingen geschiedt door toezending of
      uitreiking aan belanghebbende. Fiscaal beleid wordt gepubliceerd in het Infobulletin van de FIOD.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0004770
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel3
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel4.4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0004770
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '3'
  - number: 5.1.5.1.1
    text: |-
      In dit hoofdstuk wordt ingegaan op de soorten beschikkingen die er zijn en de voorschriften die gelden bij de
      totstandkoming van beschikkingen. [Hoofdstuk 4, Titel 4.1 van de Awb][ref1] geeft een aantal bepalingen over
      beschikkingen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 5.1.5.1.2
    text: |-
      In § 2.3 is het begrip beschikking gedefinieerd als een besluit in een concreet geval. De [Awb][ref1] kent
      een materieel beschikkingsbegrip dat wil zeggen dat niet de benaming, maar de inhoud van de publiekrechtelijke
      rechtshandeling bepalend is. Voldoet een bepaalde handeling aan de definitie van een beschikking, dan is er sprake
      van een beschikking in de zin van de [Awb][ref2]. De bepalingen van de [Awb][ref3] met betrekking tot beschikkingen
      zijn in dat geval van toepassing. Het belastingrecht kent een formeel beschikkingsbegrip, waardoor uitsluitend
      bezwaar en beroep mogelijk is tegen een op grond van een belastingwet genomen besluit dat in een belastingwet als
      voor bezwaar vatbare beschikking wordt aangeduid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
      [ref3]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
      - id: ref3
        bwb_id: BWBR0005537
  - number: 5.2.5.2.1
    text: |-
      Beschikkingen kunnen in een aantal categorieën worden ingedeeld. De belangrijkste worden hierna vermeld. Het is
      mogelijk dat een beschikking onder meerdere categorieën is te rangschikken.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.2
  - number: 5.2.5.2.2
    text: |-
      Een beschikking op aanvraag volgt op een verzoek van belanghebbende een besluit te nemen. Zo is bijvoorbeeld een
      beslissing van een inspecteur op een verzoek om vermindering loonbelasting/premie volksverzekeringen of aanvraag
      voor een vergunning in het douanerecht als een beschikking op aanvraag aan te merken. De inspecteur is bij het
      geven van een beschikking op aanvraag gebonden aan een wettelijke beslistermijn (zie § 5.4).
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.2
  - number: 5.2.5.2.3
    text: |-
      Ambtshalve beschikkingen zijn beschikkingen die niet op aanvraag worden gegeven. De grootste groep ambtshalve
      beschikkingen wordt gevormd door de belastingaanslagen. Het doen van aangifte is immers geen aanvraag in de zin van
      [art. 1:3, derde lid, Awb][ref1] (zie § 1.7). In de[ AWR][ref2] is met betrekking tot belastingaanslagen bepaald
      dat de bevoegdheid tot het vaststellen van de aanslag vervalt door verloop van drie jaren na het tijdstip waarop de
      belastingschuld is ontstaan. Voor naheffings- en navorderingsaanslagen geldt dat de bevoegdheid tot het vaststellen
      ervan vervalt door verloop van vijf jaren na het tijdstip waarop de belastingschuld is ontstaan. Indien voor het
      doen van aangifte uitstel is verleend, worden deze termijnen met de duur van dit uitstel verlengd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002320
  - number: 5.2.5.2.4
    text: |-
      Een financiële beschikking is een beschikking die strekt tot het vaststellen van een financiële verplichting of
      aanspraak. Hieronder vallen bijvoorbeeld belastingaanslagen en beschikkingen inzake bestuurlijke boeten. Financiële
      beschikkingen kunnen zowel op aanvraag (zie § 5.2.2) als ambtshalve worden gegeven (zie § 5.2.3).
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.2
  - number: 5.2.5.2.5
    text: |-
      Beslissingen die genomen worden ter voorbereiding van een beschikking worden met uitzondering van de voorlopige
      aanslag niet aangemerkt als zelfstandige beschikkingen. Het gaat hier bijvoorbeeld om beslissingen die onderdeel
      vormen van het vaststellen van een aanslag. Het afgeven van een zogenaamde ruling in de vennootschapsbelasting
      wordt daarom gezien als een niet zelfstandige beslissing. De beslissing ter zake van een ruling vormt onderdeel van
      de uiteindelijke aanslag.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.2
  - number: 5.2.5.2.6
    text: |-
      In [bijlage I][ref1] wordt ingegaan op de afwijkingen die gelden bij de toepassing van de bepalingen van het CDW.
      In bijlage II is van een aantal veel voorkomende beslissingen per belastingmiddel ([AWR][ref2],VpB, IB, VB, LB,
      OB en Douane) aangegeven of sprake is van een beschikking op aanvraag of van een ambtshalve beschikking. Daarbij
      is tevens aangegeven of de beschikking voor bezwaar vatbaar is of niet. Bedoelde lijst is niet uitputtend bedoeld
      en heeft uitsluitend indicatieve betekenis. Voor het invorderingsproces is de lijst met beslismomenten in bijlage
      III opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0008847
      [ref2]: https://wetten.overheid.nl/BWBR0002320
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.2
    references:
      - id: ref1
        bwb_id: BWBR0008847
      - id: ref2
        bwb_id: BWBR0002320
  - number: 5.3.5.3.1
    text: De aanvraag van een beschikking wordt schriftelijk ingediend, tenzij bij wettelijk voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.3
  - number: 5.3.5.3.2
    text: |-
      De aanvraag wordt ondertekend en bevat: - naam en adres van de aanvrager;
        - de dagtekening;
        - een aanduiding van de beschikking die wordt gevraagd;
        - de gegevens en bescheiden die voor de beslissing op aanvraag nodig zijn en waarover de aanvrager redelijkerwijs
      de beschikking kan krijgen. Het bestuursorgaan kan voor het indienen van aanvragen en het verstrekken van gegevens
      (standaard)formulieren vaststellen Ingevolge de [artikelen 47 tot en met 56 AWR][ref1] beschikt de inspecteur over
      de wettelijke bevoegdheid tot het vragen van nadere inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel47
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: '47'
  - number: 5.3.5.3.3
    text: |-
      In [artikel 4:3 Awb][ref1] is bepaald dat de aanvrager van een beschikking kan weigeren gegevens en bescheiden te
      verschaffen voor zover het belang daarvan voor de beslissing van het bestuursorgaan niet opweegt tegen het belang
      van de eerbiediging van de persoonlijke levenssfeer, met inbegrip van de bescherming van medische en psychologische
      onderzoeksresultaten, of tegen het belang van de bescherming van bedrijfs- en fabricagegevens. Deze bepaling
      vindt echter geen toepassing indien bij wettelijk voorschrift is bepaald dat deze gegevens dienen te worden
      overgelegd. Omdat de inspecteur op grond van de [artikelen 47 tot en met 56 AWR][ref2] beschikt over een wettelijke
      bevoegdheid tot het vragen van inlichtingen heeft [artikel 4:3 Awb][ref3] voor de fiscaliteit geen feitelijke
      betekenis. Opgemerkt wordt dat op de gegevens die de inspecteur krachtens deze bevoegdheid verkrijgt (net zo als
      op alle andere gegevens die de Belastingdienst verkrijgt), de geheimhoudingsplicht van [artikel 67 AWR][ref4] van
      toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0002320#Artikel47
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0002320#Artikel67
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0002320
        artikel: '47'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref4
        bwb_id: BWBR0002320
        artikel: '67'
  - number: 5.3.5.3.4
    text: |-
      Indien de aanvrager geen gebruik maakt van het voorgeschreven (standaard)formulier kan de aanvraag buiten
      behandeling worden gesteld. Het buiten behandeling stellen van de aanvraag kan pas plaats vinden nadat de
      behandelend ambtenaar aan de aanvrager een formulier heeft verzonden met het verzoek het formulier binnen een
      bepaalde termijn ingevuld te retourneren en de aanvrager vervolgens hieraan niet voldoet ([art. 4:5 Awb][ref1]).
      Kan de aanvraag niet behandeld worden omdat de aanvrager verzuimd heeft de benodigde gegevens te verstrekken,
      dan wordt de aanvrager alsnog in de gelegenheid gesteld zijn aanvraag aan te vullen. De behandelend ambtenaar
      stelt de aanvrager hiervoor een redelijke termijn. In Nederland geldt het Nederlands als de taal van het
      bestuurlijk verkeer, tenzij bij wettelijk voorschrift anders is bepaald. Ingevolge [artikel 2:7 Awb][ref2] kan
      belastingplichtige de Friese taal gebruiken voorzover de eenheden van de Belastingdienst in de provincie Friesland
      zijn gevestigd. Indien de aanvraag of een onderdeel daarvan in een vreemde taal is gesteld, niet zijnde het
      Nederlands c.q. het Fries, en een vertaling nodig wordt geoordeeld voor de behandeling, wordt de aanvrager verzocht
      binnen een redelijke termijn zorg te dragen voor een vertaling. De aanvraag wordt buiten behandeling gesteld
      indien de aanvrager heeft verzuimd de aanvraag aan te vullen, het (standaard)formulier (alsnog) in te vullen of een
      vertaling te verstrekken binnen de gestelde termijn en hierdoor behandeling van de aanvraag onmogelijk is geworden.
      Deze beslissing wordt hem binnen vier weken na het verstrijken van de gestelde termijn schriftelijk meegedeeld
      onder opgaaf van redenen en is vatbaar voor bezwaar en beroep. Indien de aanvrager alsnog -na het verstrijken van
      de gestelde termijn- de gevraagde gegevens verstrekt, is sprake van een nieuwe aanvraag die in behandeling wordt
      genomen. Is op dat moment nog geen schriftelijke beslissing genomen op de eerste aanvraag dan vindt die alsnog
      plaats. In deze beschikking wordt vermeld dat deze gegeven is op grond van beide aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel2
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '2'
  - number: 5.3.5.3.5
    text: |-
      Indien belanghebbende een nieuwe aanvraag doet nadat op zijn eerdere aanvraag afwijzend is beslist, moet hij nieuw
      gebleken feiten en omstandigheden vermelden. Laat hij dit na dan kan de aanvraag worden afgewezen onder verwijzing
      naar de eerdere beschikking.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.3
  - number: 5.4.5.4.1
    text: |-
      De bepalingen over de beslistermijn zijn alleen van toepassing op de beschikkingen op aanvraag. De beslissing
      op een aanvraag dient binnen de wettelijk gestelde termijn gegeven te worden. Indien geen wettelijke termijn is
      gesteld, geldt een redelijke termijn. Die termijn is in ieder geval verstreken indien niet binnen acht weken na
      ontvangst van de aanvraag een beslissing is genomen of kennisgeving is gedaan aan belanghebbende als bedoeld in §
      5.4.3. Hierbij moet worden bedacht dat in een aantal gevallen een redelijke beslistermijn korter dient te zijn dan
      acht weken. Indien de aanvraag onvolledig is, wordt de aanvrager in de gelegenheid gesteld zijn aanvraag aan te
      vullen binnen een redelijke termijn. De beslistermijn wordt in dat geval opgeschort tot de dag waarop de aanvraag
      is aangevuld of de daarvoor gestelde termijn ongebruikt is verstreken.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.4
  - number: 5.4.5.4.2
    text: |-
      Op grond van [artikel 5a AWR][ref1] heeft de inspecteur een wettelijke termijn van één jaar om op een aanvraag te
      beslissen. De Belastingdienst maakt van deze bepaling echter in beginsel geen gebruik, tenzij omstandigheden een
      langere beslistermijn rechtvaardigen. Hierbij kan bijvoorbeeld worden gedacht aan gecompliceerde zaken of gevallen
      waarin belastingplichtige weigert mee te werken aan een voortvarende afhandeling van zijn aanvraag. Voor het
      beslissen op een aanvraag geldt dus in beginsel de Awb-termijn van (maximaal) acht weken. Omdat de beslistermijn
      voor inspecteursbeschikkingen op aanvraag formeel is bepaald op één jaar kan belanghebbende geen bezwaar maken
      wegens het niet tijdig beslissen op de aanvraag als de inspecteur de termijn van [artikel 4:13 Awb][ref2] (zie §
      5.4.1) niet realiseert.


      [ref1]: https://wetten.overheid.nl/BWBR0002320#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.4
    references:
      - id: ref1
        bwb_id: BWBR0002320
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 5.4.5.4.3
    text: |-
      Indien het niet mogelijk blijkt de beschikking op aanvraag binnen acht weken na ontvangst van de aanvraag te geven,
      wordt de aanvrager daarvan zo spoedig mogelijk in kennis gesteld. Daarbij wordt aangegeven waarom de beschikking
      nog niet kan worden gegeven en binnen welke termijn de beschikking wel tegemoet kan worden gezien.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.4
  - number: 5.5.5.5.1
    text: |-
      De [Awb][ref1] verplicht in een aantal gevallen vóór het vaststellen van een beschikking de aanvrager of een
      belanghebbende in de gelegenheid te stellen zijn zienswijze naar voren te brengen. De [Awb][ref2] onderscheidt
      horen ter zake van een beschikking op aanvraag en horen ter zake van ambtshalve beschikkingen. Zie § 5.5.2, resp.
      § 5.5.3. Indien de beschikking conform de aanvraag wordt vastgesteld, hoeft belanghebbende niet te worden gehoord.
      Voor het horen in de bezwaarfase wordt verwezen naar § 6.2.1.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0005537
      - id: ref2
        bwb_id: BWBR0005537
  - number: 5.5.5.5.2
    text: |-
      Voordat de aanvraag tot het geven van een beschikking geheel of gedeeltelijk wordt afgewezen wordt de aanvrager in
      de gelegenheid gesteld zijn zienswijze naar voren te brengen indien:
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.2.a
    text: de afwijzing zou steunen op gegevens over feiten en belangen die de aanvrager betreffen, en
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.2.b
    text: die gegevens afwijken van gegevens die de aanvrager ter zake zelf heeft verstrekt.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.3
    text: |-
      Voordat een beschikking wordt gegeven waartegen een belanghebbende die de beschikking niet heeft aangevraagd
      (ambtshalve beschikking) naar verwachting bedenkingen zal hebben, wordt die belanghebbende in de gelegenheid
      gesteld zijn zienswijze naar voren te brengen indien:
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.3.a
    text: de beschikking zou steunen op gegevens over feiten en belangen die de belanghebbende betreffen, en
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.3.b
    text: die gegevens niet door belanghebbende zelf ter zake zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.4
    text: |-
      Belanghebbende kan naar keuze schriftelijk of mondeling zijn zienswijze naar voren brengen. De hoorplicht moet niet
      al te formeel worden opgevat. Voldoende is dat belanghebbende in enige vorm de gelegenheid krijgt zijn zienswijze
      naar voren te brengen. De meest aangewezen weg is om belanghebbende telefonisch te benaderen en het gesprek
      schriftelijk vast te leggen. In de bezwaarfase gelden andere eisen (zie § 6.2.1).
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.5
    text: 'Van het horen kan worden afgezien in geval:'
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.5.a
    text: de vereiste spoed zich daartegen verzet;
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.5.b
    text: |-
      belanghebbende reeds in de gelegenheid is gesteld zijn zienswijze bij een eerdere beschikking of bij een ander
      bestuursorgaan naar voren te brengen en zich sindsdien geen nieuwe feiten of omstandigheden hebben voorgedaan;
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 5.5.5.5.5.c
    text: |-
      het met de beschikking beoogde doel slechts kan worden bereikt indien belanghebbende daarvan niet reeds tevoren in
      kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel5.5
  - number: 6.1.6.1.1
    text: 'Het bezwaarschrift wordt ondertekend en bevat ten minste:'
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.1.a
    text: de naam en het adres van de indiener;
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.1.b
    text: de dagtekening;
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.1.c
    text: een omschrijving van het besluit waartegen het bezwaar is gericht;
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.1.d
    text: de gronden van het bezwaar (de motivering).
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.2
    text: |-
      De termijn voor het indienen van het bezwaarschrift is zes weken. Deze termijn vangt aan: - met ingang van de dag
      na die van dagtekening van een aanslagbiljet of van het afschrift van een voor bezwaar vatbare beschikking. Als
      de dag van dagtekening is gelegen vóór de dag van de bekendmaking, vangt de termijn aan op de dag na die van de
      bekendmaking, ofwel
        - met ingang van de dag na die van de voldoening of de inhouding onderscheidenlijk de afdracht. De eenheid
      bevestigt de ontvangst van het bezwaarschrift in beginsel schriftelijk.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.3
    text: |-
      Een bezwaar- of beroepschrift is tijdig ingediend indien het voor het einde van de termijn is ontvangen. Bij
      verzending per post is een bezwaar- of beroepschrift tijdig ingediend indien het voor het einde van de termijn ter
      post is bezorgd, mits het niet later dan een week na afloop van de termijn is ontvangen ([art. 6:9 Awb][ref1]).
      Indien een bezwaarschrift binnen zeven weken na de dagtekening van de aanslag of de beschikking waartegen het
      bezwaar zich richt door de inspecteur is ontvangen, wordt het aannemelijk geacht dat het bezwaarschrift tijdig
      ter post is bezorgd, tenzij uit het bezwaarschrift blijkt of anderszins is komen vast te staan dat de termijn is
      overschreden. Dit laatste doet zich bijvoorbeeld voor als het bezwaarschrift door belanghebbende is voorzien van
      een dagtekening waaruit blijkt dat het bezwaarschrift buiten de termijn ter post moet zijn bezorgd. Opgemerkt wordt
      dat verzending per fax niet geldt als verzending per post; (van) een per fax verzonden bezwaar- of beroepschrift
      dient (de eerste pagina) blijkens de ontvangstapparatuur van de Belastingdienst, uiterlijk op de laatste dag van de
      bezwaar- of beroepstermijn om 23.59 uur te zijn ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
  - number: 6.1.6.1.4
    text: |-
      Indien het bezwaarschrift wordt ingediend bij de Belastingdienst, terwijl de Belastingdienst niet het bevoegde
      bestuursorgaan is, dan wel bij een onbevoegde eenheid, wordt het, nadat daarop de datum van ontvangst is
      aangetekend, zo spoedig mogelijk doorgezonden aan het bevoegde bestuursorgaan, c.q. de bevoegde eenheid. De eenheid
      doet hiervan schriftelijk mededeling aan de afzender. Als uit het bezwaarschrift niet blijkt bij welk orgaan
      het thuis hoort en dit ook niet uit het geschrift is af te leiden, wordt het teruggezonden aan de afzender. Het
      tijdstip van de indiening bij de onbevoegde eenheid c.q. het onbevoegde bestuursorgaan is bepalend voor de vraag
      of het bezwaarschrift tijdig is ingediend indien: - bij de bekendmaking van de beschikking waartegen het bezwaar
      zich richt, is verzuimd melding te maken bij welk bestuursorgaan, binnen welke termijn, bezwaar kan worden gemaakt,
      dan wel
        - de onbevoegdheid van het orgaan voor de indiener van het bezwaarschrift op een andere grond onduidelijk kon zijn.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.5
    text: |-
      In het belastingrecht staat alleen bezwaar en beroep open tegen beschikkingen die in de belastingwet als voor
      bezwaar vatbaar zijn aangemerkt. Het is in het belastingrecht dan ook niet mogelijk om in bezwaar te gaan tegen
      niet-zelfstandige beslissingen met uitzondering van de voorlopige aanslag (zie § 5.2.5.). Een beslissing inzake
      de procedure ter voorbereiding van een beschikking is evenmin vatbaar voor bezwaar, tenzij deze beslissing de
      belastingplichtige, los van het voor te bereiden besluit, rechtstreeks in zijn belang treft ([art. 6:3 Awb][ref1]).
      Deze bepaling is in de [Awb][ref2] opgenomen om te voorkomen dat loutere procedurebeslissingen, zoals bijvoorbeeld
      het bericht dat de beslistermijn wordt verdaagd, ook aan bezwaar kunnen worden onderworpen. Voor het belastingrecht
      geldt dat deze beslissingen sowieso niet voor bezwaar vatbaar zijn aangezien het belastingrecht een gesloten
      systeem van rechtsmiddelen kent (zie § 6.2.9).


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0005537
  - number: 6.1.6.1.6
    text: 'De inspecteur verklaart het bezwaar niet-ontvankelijk als:'
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.6.a
    text: het bezwaarschrift is ingediend ná afloop van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.6.b
    text: |-
      het bezwaarschrift is ingediend vóór het begin van de bezwaartermijn, tenzij de beschikking ten tijde van de
      indiening wel al genomen is of de indiener redelijkerwijs kon menen dat dit wel reeds het geval was. In dat geval
      kan de behandeling worden aangehouden tot het begin van de bezwaartermijn.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.1.6.1.7
    text: |-
      De belastingplichtige kan zijn bezwaarschrift schriftelijk intrekken. De inspecteur bevestigt de intrekking
      schriftelijk. Tijdens het horen (zie § 6.2 e.v.) kan de intrekking ook mondeling geschieden. Van de intrekking
      wordt melding gemaakt in het verslag dat van het horen moet worden gemaakt( zie § 6.2.5).
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.1
  - number: 6.2.6.2.1
    text: |-
      De hoorplicht vormt een essentieel onderdeel van de bezwaarschriftprocedure. Daarom moet de inspecteur, alvorens
      hij uitspraak doet op het bezwaarschrift, belastingplichtige in de gelegenheid hebben gesteld om te worden gehoord.
      De inspecteur hoort belastingplichtige in beginsel op kantoor. Telefonisch horen is in de bezwaarfase geen horen
      in de zin van de [Awb][ref1]. Het is echter mogelijk, voordat een uitnodiging om te worden gehoord wordt verzonden,
      telefonisch contact op te nemen met de indiener van het bezwaarschrift om een en ander te vragen en verduidelijkt
      te krijgen. Belastingplichtige kan dan laten weten aan het horen geen behoefte (meer) te hebben, bijvoorbeeld omdat
      onduidelijkheden en/of misverstanden tijdens dat gesprek zijn weggenomen of duidelijk is geworden dat volledig aan
      het bezwaar wordt tegemoet gekomen (zie ook § 6.2.2.). Alleen wanneer belastingplichtige uitdrukkelijk verklaart
      geen bezwaar te hebben tegen telefonisch horen, mag telefonisch worden gehoord.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 6.2.6.2.2
    text: |-
      Van het horen van de belastingplichtige kan volgens de[Awb][ref1] worden afgezien als: - het bezwaar kennelijk
      niet-ontvankelijk is (zie § 6.1.6);
        - de belastingplichtige heeft verklaard geen gebruik te willen maken van het recht te worden gehoord;
        - aan het bezwaar volledig tegemoet wordt gekomen;
        - het bezwaar kennelijk ongegrond is. Is sprake van een kennelijk niet-ontvankelijk bezwaarschrift of is het
      bezwaarschrift kennelijk ongegrond dan hoort de inspecteur belastingplichtige toch indien belastingplichtige daarom
      heeft verzocht. Het horen strekt er immers mede toe om een zo gefundeerd mogelijke (ambtshalve) beslissing te
      kunnen nemen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: 6.2.6.2.3
    text: |-
      De belastingplichtige krijgt, indien nodig, tenminste een week voordat hij wordt gehoord, de gelegenheid de stukken
      in te zien die betrekking hebben op de zaak. Het betreft alleen die stukken die op grond van [hoofdstuk 4.3 van
      het VIV 1993](onbekend) kunnen worden verstrekt. Bij de oproep voor het horen wordt vermeld waar en wanneer deze
      stukken ter inzage liggen. Belastingplichtige kan tegen vergoeding afschriften verkrijgen. Als uitgangspunt hierbij
      geldt hetgeen is bepaald in het [Besluit tarieven openbaarheid van bestuur][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005869
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
    references:
      - id: ref1
        bwb_id: BWBR0005869
  - number: 6.2.6.2.4
    text: |-
      Het horen van de belastingplichtige vindt plaats door een ambtenaar die niet bij de totstandkoming van de
      beschikking betrokken is geweest. Dit gaat niet zover dat degene die heeft geparafeerd of een collegiale toetsing
      heeft uitgevoerd, niet mag horen. Met de woorden ’niet bij de totstandkoming van de beschikking betrokken is
      geweest’ wordt gedoeld op de ambtenaar die met een hoge mate van zelfstandigheid het betreffende besluit heeft
      voorbereid en over de betrokken casus eerder een oordeel heeft gevormd. Op verzoek van belanghebbende mag worden
      gehoord door de oorspronkelijke besluitnemer en kunnen door hem meegebrachte getuigen en deskundigen worden
      gehoord.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
  - number: 6.2.6.2.5
    text: |-
      De ambtenaar die belastingplichtige heeft gehoord, maakt van het horen een verslag. Het verslag bevat een
      weergave van de besproken onderwerpen en de standpunten van de inspecteur en belastingplichtige. Het verslag
      wordt toegezonden aan belastingplichtige c.q. zijn gemachtigde. Een kopie wordt in het dossier bewaard. Als
      belastingplichtige het niet eens is met de inhoud van het verslag, kan hij de ambtenaar hierover informeren. De
      ambtenaar maakt hiervan schriftelijk melding.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
  - number: 6.2.6.2.6
    text: |-
      Wanneer na het horen de inspecteur feiten of omstandigheden bekend worden die voor de op het bezwaar te
      nemen beslissing van aanmerkelijk belang kunnen zijn, deelt hij dit aan belastingplichtige mee en stelt hij
      belastingplichtige binnen een redelijke termijn in de gelegenheid daarover te worden gehoord. Hierbij gelden
      dezelfde regels als bij de eerste keer dat belastingplichtige werd gehoord.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
  - number: 6.2.6.2.7
    text: |-
      Voor de afdoening van bezwaarschriften geldt, dat deze in beginsel binnen de termijnen van de Awb
      ([artikel 7:10 Awb][ref1]) worden afgehandeld. De hoofdregel daarbij is dat de inspecteur binnen zes weken na
      ontvangst van het bezwaarschrift uitspraak doet. Voldoet het bezwaarschrift niet aan de minimumeisen (zie § 6.1.1.)
      dan stelt de inspecteur belanghebbende in de gelegenheid het bezwaarschrift binnen een redelijke termijn aan te
      vullen. De termijn die belanghebbende nodig heeft om het bezwaarschrift aan te vullen dan wel ongebruikt laat
      verstrijken, schort de beslistermijn voor de inspecteur op. Kan de inspecteur niet binnen zes weken (of binnen
      zes weken verlengd met de periode gedurende welke de beslistermijn is opgeschort) op het bezwaarschrift beslissen
      dan kan hij de beslistermijn met ten hoogste vier weken verlengen. Hij doet hiervan schriftelijk mededeling aan
      belanghebbende. In overleg met belanghebbende is verder uitstel mogelijk. De[ AWR (artikel 25)][ref2] geeft de
      inspecteur formeel een beslistermijn van één jaar met de mogelijkheid deze termijn - met schriftelijke toestemming
      van of vanwege de minister - met maximaal één jaar te verlengen. Van deze mogelijkheid maakt de Belastingdienst
      alleen in uitzonderingsgevallen gebruik. Hierbij kan worden gedacht aan massaal ingediende bezwaarschriften
      waarover de Belastingdienst nog geen definitief standpunt heeft ingenomen of indien belanghebbende weigert mee
      te werken aan een voortvarende afhandeling van zijn bezwaarschrift. Omdat de beslistermijn voor bezwaarschriften
      formeel is bepaald op één jaar kan belanghebbende geen beroep instellen wegens het niet tijdig beslissen op het
      bezwaarschrift als de inspecteur de termijn(en) van [artikel 7:10 Awb][ref3] niet realiseert (zie ook § 6.2.9). Zie
      voor pro-forma bezwaarschriften § 6.1.1.


