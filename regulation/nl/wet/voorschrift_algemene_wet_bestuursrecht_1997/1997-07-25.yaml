  - number: 6.2.6.2.8
    text: |-
      De beschikking moet berusten op een deugdelijke motivering. Deze motivering wordt bij de bekendmaking van de
      beslissing vermeld. Als belastingplichtige op grond van een in § 6.2.2. vermelde reden niet is gehoord, wordt in de
      motivering tevens aangegeven op welke grond dat is geschied. Indien de mogelijkheid openstaat tegen de beschikking
      beroep in te stellen, wordt aangegeven voor wie, binnen welke termijn en bij welk orgaan de mogelijkheid van beroep
      openstaat.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
  - number: 6.2.6.2.9
    text: |-
      Als de inspecteur te laat op het bezwaarschrift beslist, kan de belastingplichtige na afloop van de daarvoor
      geldende beslistermijn beroep instellen (zie § 2.5.1).Het indienen van het beroepschrift is in deze gevallen niet
      aan een termijn gebonden. Wel kan de rechter het beroep niet-ontvankelijk verklaren indien het onredelijk laat is
      ingediend. De inspecteur beslist in beginsel altijd op het bezwaarschrift. Voor ambtshalve besluiten waarvoor in de
      wet is vastgesteld dat zij binnen een bepaalde termijn moeten worden genomen, zal na afloop van die termijn sprake
      zijn van het niet tijdig nemen van een besluit.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
  - number: 6.2.6.2.10
    text: |-
      De inspecteur kan in geval van een bezwaarschrift gericht tegen een beschikking waarbij sprake is van een
      schending van een vormvoorschrift, de beschikking in stand laten als blijkt dat belastingplichtige hierdoor niet
      is benadeeld. Onder schending van een vormvoorschrift wordt verstaan een schending van een voorschrift dat geen
      eisen stelt aan de materiële eisen van een besluit, maar ziet op de procedure van de totstandkoming of de wijze
      waarop het besluit moet worden genomen of vastgelegd. Hiervan kan sprake zijn indien een besluit onvoldoende is
      gemotiveerd.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel6.2
  - number: '7.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst. Het Voorschrift Algene wet bestuursrecht, regeling van 14 oktober 1993, nr. AFZ93/8554 (Stcrt.
      993, 2090, zoals gewijzigd op 24 december 1993, nr. AFZ93/10954) komt hiermee te vervallen.
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel7.1
  - number: '7.2'
    text: 'Deze regeling kan worden aangehaald als: Voorschrift Algemene wet bestuursrecht 1997.'
    url: https://wetten.overheid.nl/BWBR0008847/1997-07-25#Artikel7.2
