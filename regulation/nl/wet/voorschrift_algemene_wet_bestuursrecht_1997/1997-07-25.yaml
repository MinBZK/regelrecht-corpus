  - number: 1.6.1.6.1
    text: |-
      De [hoofdstukken 4][ref1], [6][ref2] en [7][ref3], alsmede [artikel 3:40 van de Awb][ref4] zijn niet van
      toepassing op de [Invorderingswet 1990][ref5]. De reden hiervoor is dat in de [Invorderingswet 1990][ref6]
      bestuursrechtelijke en privaatrechtelijke rechtshandelingen sterk met elkaar zijn verweven. Het zou dan
      onoverzichtelijk zijn voor bepaalde -namelijk de bestuursrechtelijke- rechtshandelingen de [hoofdstukken 4][ref7],
      [6][ref8] en [7][ref9] wel te laten gelden, en voor andere niet. In verband met de verrekeningsbevoegdheid van de
      ontvanger ([artikel 24 Invorderingswet 1990][ref10]) is in [artikel 1 van de Invorderingswet 1990][ref11][artikel
      3:40](onbekend) (een besluit treedt niet in werking voordat het is bekendgemaakt) buiten toepassing verklaard.
      Wel van toepassing op de [Invorderingswet 1990][ref12] zijn o.m. de algemene bepalingen betreffende het verkeer
      tussen burgers en bestuursorganen ([Hoofdstuk 2][ref13]) en de bepalingen over zorgvuldigheid en belangenafweging
      bij de voorbereiding van besluiten ([Hoofdstuk 3][ref14]). De [Awb][ref15] is wel volledig van toepassing op de
      [Kostenwet invordering rijksbelastingen][ref16]. Zie voor de invordering uitvoeriger bijlage III.


