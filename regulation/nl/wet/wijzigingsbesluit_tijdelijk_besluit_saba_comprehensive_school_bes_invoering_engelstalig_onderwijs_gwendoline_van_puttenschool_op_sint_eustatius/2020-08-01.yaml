articles:
  - number: II
    text: |-
      1 Het [Tijdelijk besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref1] vindt met ingang van
      1 augustus 2015 toepassing op het eerste leerjaar aan de Gwendoline van Puttenschool en vindt successievelijk per
      volgend schooljaar toepassing op de opvolgende leerjaren.

      2 Met betrekking tot de leerjaren waarop het
      [Tijdelijk besluit Saba Comprehensive School en Gwendoline van Puttenschool BES][ref2] nog geen
      toepassing vindt aan de Gwendoline van Puttenschool, blijven van toepassing de bij of krachtens de
      [Wet voortgezet onderwijs BES][ref3] gegeven voorschriften, zoals luidend op 31 juli 2015.

      3 Dit artikel vervalt met ingang van 1 augustus 2021.


