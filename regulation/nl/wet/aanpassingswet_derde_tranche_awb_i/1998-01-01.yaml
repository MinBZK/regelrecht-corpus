$id: aanpassingswet_derde_tranche_awb_i
regulatory_layer: WET
publication_date: '1997-11-18'
valid_from: '1998-01-01'
bwb_id: BWBR0008994
url: https://wetten.overheid.nl/BWBR0008994/1998-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het gewenst is de bijzondere wetten aan te passen aan de derde tranche
    van de Algemene wet bestuursrecht;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#ArtikelAanhef
articles:
  - number: '17'
    text: 'Met ingang van het tijdstip van inwerkingtreding van deze wet:'
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel17
  - number: 17.a
    text: |-
      komen de taken en bevoegdheden van het college van burgemeester en wethouders met betrekking tot de heffing van
      gemeentelijke belastingen ten aanzien van belastingaanslagen die voor dat tijdstip reeds zijn vastgesteld, toe aan
      de in [artikel 231, tweede lid, onderdeel ][ref1] bedoelde ambtenaar;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
  - number: 17.b
    text: |-
      worden de vaststelling van en de werkzaamheden in het kader van de heffing van gemeentelijke belastingen
      met betrekking tot de in onderdeel *a* bedoelde belastingaanslagen die voor dat tijdstip door of
      namens het college van burgemeester en wethouders zijn verricht, geacht te zijn verricht door de in
      [artikel 231, tweede lid, onderdeel ][ref1] bedoelde ambtenaar;


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel231
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '231'
  - number: 17.c
    text: |-
      komen de taken en bevoegdheden van het college van gedeputeerde staten met betrekking tot de heffing van
      provinciale belastingen ten aanzien van belastingaanslagen die voor dat tijdstip reeds zijn vastgesteld, toe aan de
      in [artikel 227][ref1] bedoelde ambtenaar;


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
  - number: 17.d
    text: |-
      worden de vaststelling van en de werkzaamheden in het kader van de heffing van provinciale belastingen met
      betrekking tot de in onderdeel c bedoelde belastingaanslagen die voor dat tijdstip door of namens het college van
      gedeputeerde staten zijn verricht, geacht te zijn verricht door de in [artikel 227][ref1] bedoelde ambtenaar.


      [ref1]: https://wetten.overheid.nl/BWBR0005645#Artikel227a
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0005645
        artikel: 227a
  - number: '15'
    text: 'Met ingang van het tijdstip van inwerkingtreding van deze wet:'
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel15
  - number: 15.a
    text: |-
      komen de taken en bevoegdheden van het dagelijks bestuur van een waterschap met betrekking tot de heffing van
      waterschapsbelastingen ten aanzien van belastingaanslagen die voor dat tijdstip reeds zijn vastgesteld, toe aan de
      in [artikel 123, derde lid, onderdeel ][ref1] bedoelde ambtenaar van dat waterschap;


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
  - number: 15.b
    text: |-
      worden de vaststelling van en de werkzaamheden in het kader van de heffing van waterschapsbelastingen
      met betrekking tot de in onderdeel a bedoelde belastingaanslagen die voor dat tijdstip door of
      namens het dagelijks bestuur van een waterschap zijn verricht, geacht te zijn verricht door de in
      [artikel 123, derde lid, onderdeel ][ref1] bedoelde ambtenaar van dat waterschap.


      [ref1]: https://wetten.overheid.nl/BWBR0005108#Artikel123
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005108
        artikel: '123'
  - number: '1'
    text: |-
      De tekst van de [Algemene wet bestuursrecht][ref1] wordt in het *Staatsblad* geplaatst.


      [ref1]: https://wetten.overheid.nl/BWBR0005537
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005537
  - number: '2'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel2
  - number: '3'
    text: 'Deze wet wordt aangehaald als: Aanpassingswet derde tranche Awb I.'
    url: https://wetten.overheid.nl/BWBR0008994/1998-01-01#Artikel3
