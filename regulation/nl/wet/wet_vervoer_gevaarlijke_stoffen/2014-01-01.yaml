  - number: '51'
    text: De Wet Gevaarlijke Stoffen wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel51
  - number: '52'
    text: |-
      Op de dag voor de datum van inwerkingtreding van deze wet geldende besluiten die zijn vastgesteld krachtens de Wet
      Gevaarlijke Stoffen, worden geacht te zijn vastgesteld krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel52
  - number: '59.1'
    text: |-
      Onverminderd de [artikelen 7, eerste lid, en 8, eerste lid, van de Coördinatiewet uitzonderingstoestanden][ref1]
      kan, ingeval buitengewone omstandigheden dit noodzakelijk maken, bij koninklijk beluit, op voordracht van Onze
      Minister-President, [artikel 60][ref2] in werking worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007981#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel60
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007981
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '60'
        hoofdstuk: VI
  - number: '59.2'
    text: |-
      Wanneer het in het eerste lid bedoelde besluit is genomen, wordt onverwijld een voorstel van wet aan de Tweede
      Kamer der Staten-Generaal gezonden omtrent het voortduren van de werking van de bij het in het eerste lid bedoelde
      besluit in werking gestelde bepaling.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel59
  - number: '59.3'
    text: |-
      Wordt het voorstel van wet door de Staten-Generaal verworpen, dan wordt bij koninklijk besluit, op voordracht van
      Onze Minister-President, de bepaling die ingevolge het eerste lid in werking is gesteld, onverwijld buiten werking
      gesteld.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel59
  - number: '59.4'
    text: |-
      Bij koninklijk besluit, op voordracht van Onze Minister-President, wordt de bepaling die ingevolge het eerste lid
      in werking is gesteld, buiten werking gesteld zodra de omstandigheden dit naar Ons oordeel toelaten.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel59
  - number: '59.5'
    text: |-
      Het in het eerste, derde en vierde lid bedoelde besluit wordt op de daarin te bepalen wijze bekendgemaakt. Het
      treedt in werking terstond na de bekendmaking.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel59
  - number: '59.6'
    text: Het besluit, bedoeld in het eerste, derde en vierde lid, wordt in ieder geval geplaatst in het *Staatsblad*.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel59
  - number: '61'
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende
      hoofdstukken, paragrafen, artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel61
  - number: '62'
    text: 'Deze wet kan worden aangehaald als: Wet vervoer gevaarlijke stoffen.'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel62
