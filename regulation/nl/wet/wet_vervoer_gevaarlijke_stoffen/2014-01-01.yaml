---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_vervoer_gevaarlijke_stoffen
regulatory_layer: WET
publication_date: '1996-07-09'
valid_from: '2014-01-01'
bwb_id: BWBR0007606
url: https://wetten.overheid.nl/BWBR0007606/2014-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het op grond van maatschappelijke ontwikkelingen noodzakelijk is in
    het belang van de openbare veiligheid nieuwe regels te geven voor het vervoer van gevaarlijke stoffen, welke mede
    kunnen dienen ter uitvoering van verdragen of besluiten van volkenrechtelijke organisaties;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: Onze Minister van Verkeer en Waterstaat;'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b
    text: 'gevaarlijke stoffen:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.1°
    text: ontplofbare stoffen en voorwerpen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.2°
    text: samengeperste, vloeibaar gemaakte of onder druk opgeloste gassen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.3°
    text: brandbare vloeistoffen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.4°
    text: brandbare vaste stoffen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.5°
    text: voor zelfontbranding vatbare stoffen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.6°
    text: stoffen die bij aanraking met water brandbare gassen ontwikkelen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.7°
    text: stoffen die de verbranding bevorderen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.8°
    text: organische peroxiden,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.9°
    text: giftige stoffen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.10°
    text: infectueuze stoffen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.11°
    text: bijtende stoffen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.b.12°
    text: andere stoffen die voor de mens of het milieu gevaarlijk kunnen zijn,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.c
    text: 'vervoermiddel: voertuig of vaartuig;'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: 1.1.d
    text: |-
      binnenwateren: de wateren die in Nederland zijn gelegen binnen een langs de Nederlandse kust gaande, krachtens
      [artikel 1, eerste lid, onderdeel ][ref1] aangewezen lijn;


      [ref1]: https://wetten.overheid.nl/BWBR0001876#Artikel1
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0001876
        artikel: '1'
  - number: 1.1.e
    text: 'internationaal vervoer: vervoer waarbij de Nederlandse grens wordt gepasseerd.'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen worden onder gevaarlijke stoffen mede verstaan: voorwerpen die
      zodanige stoffen met behoud van de gevaarlijke eigenschappen bevatten.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel1
  - number: '2.1'
    text: 'Deze wet is van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.a
    text: het vervoeren van gevaarlijke stoffen met een vervoermiddel over land, per spoor en over de binnenwateren;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.b
    text: |-
      het ten behoeve van vervoer met een vervoermiddel over land, per spoor en over de binnenwateren aanbieden en
      aannemen van gevaarlijke stoffen;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.c
    text: |-
      het laten staan en het laten liggen van een vervoermiddel, waarin of waarop zich gevaarlijke stoffen of resten
      daarvan bevinden;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.d
    text: |-
      het ten behoeve van het vervoer beladen van een container of vervoermiddel met gevaarlijke stoffen en het lossen
      van die stoffen daaruit;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.e
    text: het nederleggen van gevaarlijke stoffen tijdens het vervoer;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.f
    text: het verpakken van gevaarlijke stoffen ten behoeve van het vervoer daarvan;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.g
    text: |-
      het ten behoeve van het vervoer vullen van een daarvoor bestemde container, tank, verpakking of vervoermiddel met
      gevaarlijke stoffen en het lossen van die stoffen daaruit;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.h
    text: |-
      het exploiteren van een container, tank, verpakking of vervoermiddel ten behoeve van het vervoer van gevaarlijke
      stoffen;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.i
    text: het ontvangen van gevaarlijke stoffen tijdens of aansluitend op het vervoer;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: 2.1.j
    text: |-
      de overige met het vervoer van gevaarlijke stoffen rechtstreeks samenhangende handelingen, waaronder de beveiliging
      van de vervoersketen, voor zover daaromtrent bij of krachtens algemene maatregel van bestuur als bedoeld in
      [artikel 3][ref1], regels zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel3
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
  - number: '2.2'
    text: |-
      Deze wet is niet van toepassing op handelingen als bedoeld in het eerste lid voor zover deze betrekking hebben
      op het internationale vervoer van gevaarlijke stoffen met vervoermiddelen die in eigendom toebehoren aan of zich
      bevinden onder de verantwoordelijkheid van de krijgsmacht of van de krijgsmacht van een bondgenootschappelijke
      mogendheid.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
  - number: '2.3'
    text: |-
      Deze wet is niet van toepassing op handelingen als bedoeld in het eerste lid voor zover deze worden verricht met
      splijtstoffen, ertsen of radioactieve stoffen als bedoeld in [artikel 1 van de Kernenergiewet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002402#Artikel1
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002402
        artikel: '1'
  - number: '2.4'
    text: |-
      Deze wet is niet van toepassing op handelingen als bedoeld in het eerste lid voor zover deze
      betrekking hebben op het vervoer dat uitsluitend plaatsvindt binnen een inrichting als bedoeld in
      [artikel 1.1 van de Wet milieubeheer][ref1], tenzij dit vervoer plaatsvindt over de openbare weg.


      [ref1]: https://wetten.overheid.nl/BWBR0003245#Artikel1
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003245
        artikel: '1'
  - number: '3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden gevaarlijke stoffen of categorieën van gevaarlijke stoffen
      aangewezen, ten aanzien waarvan het verrichten van de handelingen, bedoeld in [artikel 2, eerste lid][ref1], en het
      verrichten van deze handelingen met bij of krachtens die maatregel aangewezen vervoermiddelen:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: 3.a
    text: niet is toegestaan; of
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel3
  - number: 3.b
    text: is toegestaan mits de bij of krachtens die maatregel terzake gestelde regels in acht zijn genomen.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel3
  - number: 3a.1
    text: |-
      Bij ministeriële regeling kunnen in het belang van de openbare veiligheid regels worden gesteld met betrekking
      tot de handelingen, bedoeld in [artikel 2, eerste lid][ref1], voor zover die worden verricht op of in de openbare
      lichamen Bonaire, Sint Eustatius en Saba met bij of krachtens die maatregel aangewezen gevaarlijke stoffen. De
      regels kunnen voor elk van de openbare lichamen verschillend zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: 3a.2
    text: |-
      De in het eerste lid bedoelde regels hebben in elk geval betrekking op de vervoermiddelen waarmee de handelingen,
      bedoeld in het eerste lid, worden verricht.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel3a
  - number: 3a.3
    text: |-
      Het is verboden de handelingen, bedoeld in het eerste lid, te verrichten anders dan met inachtneming van de
      krachtens het eerste lid gestelde regels.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel3a
  - number: 3a.4
    text: |-
      De [artikelen 9, eerste tot en met vierde lid][ref1], [10][ref2], [10a][ref3], [34][ref4] en [49][ref5] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel10
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel10a
      [ref4]: https://wetten.overheid.nl/BWBR0007606#Artikel34
      [ref5]: https://wetten.overheid.nl/BWBR0007606#Artikel49
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '9'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '10'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007606
        artikel: 10a
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0007606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0007606
        artikel: '49'
        hoofdstuk: V
  - number: '4'
    text: |-
      Het is verboden de handelingen, bedoeld in [artikel 2, eerste lid][ref1], te verrichten ten aanzien van gevaarlijke
      stoffen en met vervoermiddelen die zijn aangewezen ingevolge [artikel 3, onderdeel ][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel3
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
  - number: '5'
    text: |-
      Het is verboden de handelingen, bedoeld in [artikel 2, eerste lid][ref1], te verrichten ten aanzien van gevaarlijke
      stoffen en met vervoermiddelen die zijn aangewezen ingevolge [artikel 3, onderdeel ][ref2], anders dan met
      inachtneming van de in dat onderdeel bedoelde regels.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel3
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
  - number: '6'
    text: |-
      De regels, bedoeld in [artikel 3, onderdeel ][ref1], kunnen onder meer betrekking hebben op:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel3
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
  - number: 6.a
    text: |-
      eisen ten aanzien van constructie, inrichting en uitrusting van vervoermiddelen, waarmee gevaarlijke stoffen worden
      vervoerd;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.b
    text: keuring van vervoermiddelen als bedoeld in onderdeel *a*;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.c
    text: |-
      aanduidingen die de vervoermiddelen bij het vervoeren van daartoe bij of krachtens algemene maatregel van bestuur
      aangewezen gevaarlijke stoffen, zowel in beladen als in lege, ongereinigde toestand, dienen te voeren;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.d
    text: |-
      het verwijderen of bedekken van aanduidingen als bedoeld in onderdeel *c*, na het lossen en reinigen of ontgassen
      van het vervoermiddel;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.e
    text: reinigen van vervoermiddelen waarmee gevaarlijke stoffen zijn vervoerd;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.f
    text: onderzoek van gevaarlijke stoffen naar hun eigenschappen;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.g
    text: |-
      eisen ten aanzien van de verpakking van gevaarlijke stoffen, met inbegrip van de daarbij behorende inrichting of
      uitrusting, en het testen of keuren daarvan;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.h
    text: aanduidingen of aanwijzingen op de verpakking, bedoeld in onderdeel *g*;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.i
    text: |-
      deskundigheid van personen die handelingen met gevaarlijke stoffen als bedoeld in [artikel 2, eerste lid][ref1],
      verrichten, afgifte van vakbekwaamheidscertificaten en erkenning van vakbekwaamheidscertificaten afgegeven in
      andere landen;


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: 6.j
    text: vervoeren van gevaarlijke stoffen onder bepaalde meteorologische omstandigheden;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.k
    text: vervoeren van gevaarlijke stoffen door tunnels;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.l
    text: |-
      eisen ten aanzien van constructie, inrichting en uitrusting van inrichtingen of werktuigen met behulp waarvan
      gevaarlijke stoffen worden geladen of gelost;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.m
    text: keuring van de inrichtingen of werktuigen, bedoeld in onderdeel *l*;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
  - number: 6.n
    text: |-
      melding voorafgaande aan het verrichten van een handeling als bedoeld in [artikel 2, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '7'
    text: |-
      Tunnels als bedoeld in [artikel 6, onderdeel ][ref1], die zijn bestemd voor het wegverkeer, worden aangeduid door
      borden overeenkomstig het daartoe krachtens de [Wegenverkeerswet 1994][ref2] aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '6'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0006622
  - number: '8.1'
    text: |-
      De regels, bedoeld in [artikel 3, onderdeel ][ref1], kunnen worden gesteld bij of krachtens algemene
      maatregel van bestuur op voordracht van Onze Minister van Defensie, voor zover het betreft de onderwerpen,
      bedoeld in [artikel 6, onderdelen ][ref2] en voor zover het tevens betreft de handelingen, bedoeld in
      [artikel 2, eerste lid][ref3], met ontplofbare stoffen en voorwerpen, verricht met of ten aanzien van
      vervoermiddelen die in eigendom toebehoren aan of zich bevinden onder de verantwoordelijkheid van de krijgsmacht of
      van de krijgsmacht van een andere mogendheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '6'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '8.2'
    text: |-
      Onze Minister van Defensie kan in bijzondere gevallen ontheffing of vrijstelling verlenen van het bepaalde
      krachtens het eerste lid. Artikel 9 tweede, derde en vierde lid, is van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel8
  - number: '9.1'
    text: |-
      Onze Minister kan in bijzondere gevallen ontheffing of vrijstelling verlenen van het bepaalde bij of krachtens de
      [artikelen 3][ref1], [4][ref2] of [5][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel5
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '4'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0007606
        artikel: '5'
        hoofdstuk: II
  - number: '9.2'
    text: Onze Minister kan een ontheffing weigeren op gronden aan de openbare veiligheid ontleend.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
  - number: '9.3'
    text: Onze Minister kan een ontheffing of vrijstelling onder beperkingen verlenen of daaraan voorschriften verbinden.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
  - number: '9.4'
    text: 'Onze Minister kan een ontheffing wijzigen of intrekken:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
  - number: 9.4.a
    text: op verzoek van de aanvrager,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
  - number: 9.4.b
    text: indien blijkt dat de in verband met de aanvraag daarvan verstrekte gegevens in strijd met de waarheid zijn,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
  - number: 9.4.c
    text: indien de daarin opgenomen beperkingen of voorschriften niet of niet volledig in acht worden genomen,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
  - number: 9.4.d
    text: op gronden aan de openbare veiligheid ontleend.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
  - number: '9.5'
    text: |-
      Het eerste lid is niet van toepassing op regels gesteld krachtens [artikel 8, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel8
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '8'
        hoofdstuk: II
  - number: '10'
    text: |-
      Het is verboden te handelen in strijd met een beperking waaronder een ontheffing of een vrijstelling als bedoeld
      in de [artikelen 8, tweede lid][ref1], en [9][ref2] is verleend of met een voorschrift dat aan een zodanige
      ontheffing of vrijstelling is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel9
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '8'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '9'
        hoofdstuk: II
  - number: 10a.1
    text: |-
      Onze Minister kan instanties erkennen die belast zijn met de door hem aan te geven, in het kader van de krachtens
      [artikel 3, onderdeel b][ref1], vastgestelde regels te verrichten taken. De taken kunnen mede betrekking hebben op
      het afgeven van certificaten of het erkennen van andere documenten dan wel voorschriften alsmede op het verlenen
      van de op grond van de regels bij of krachtens [artikel 3][ref2] benodigde goedkeuring.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel3
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel10a
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '3'
        hoofdstuk: II
  - number: 10a.2
    text: |-
      Onze Minister stelt regels met betrekking tot de voorwaarden om voor erkenning in aanmerking te komen, de werkwijze
      van de erkende instanties, de periodieke verslaglegging over de verrichte werkzaamheden, alsmede de uitoefening van
      het toezicht op de erkende instanties.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel10a
  - number: 10a.3
    text: |-
      Onze Minister kan aan de erkenning voorschriften verbinden betreffende de uit te voeren taken, welke voorschriften
      mede betrekking kunnen hebben op de door de erkende instantie in rekening te brengen tarieven.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel10a
  - number: 10a.4
    text: |-
      Onze Minister kan de erkenning schorsen dan wel intrekken indien de betrokken instantie niet meer voldoet aan de
      bij of krachtens deze wet gestelde regels. De betrokken instantie verstrekt desgevraagd de inlichtingen en verleent
      inzage in de zakelijke gegevens en bescheiden aan onze Minister die deze ten behoeve van zijn taakuitoefening nodig
      oordeelt.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel10a
  - number: '11.1'
    text: |-
      Degene die met een voertuig langs de weg gevaarlijke stoffen vervoert is verplicht de krachtens de
      [Wegenverkeerswet 1994][ref1] als zodanig aangeduide bebouwde kommen van gemeenten te vermijden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '11.2'
    text: 'Het eerste lid is niet van toepassing voor zover het vervoer binnen de bebouwde kom noodzakelijk is:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel11
  - number: 11.2.a
    text: ten behoeve van het laden of lossen, of
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel11
  - number: 11.2.b
    text: omdat er redelijkerwijs geen route buiten de bebouwde kom beschikbaar is.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel11
  - number: '12.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden in het belang van de openbare veiligheid gevaarlijke stoffen
      aangewezen die uitsluitend over de op grond van [artikel 18][ref1] aangewezen wegen mogen worden vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel18
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '18'
        hoofdstuk: III
        paragraaf: '3'
  - number: '12.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen in het belang van de openbare veiligheid gevaarlijke
      stoffen worden aangewezen die over de op grond van de [artikelen 26][ref1] of [30][ref2] aangewezen vaarwegen
      onderscheidenlijk spoorwegen niet mogen worden vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel30
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '26'
        hoofdstuk: III
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '30'
        hoofdstuk: III
        paragraaf: '5'
  - number: '12.3'
    text: |-
      Bij een aanwijzing als bedoeld in het eerste of tweede lid kan worden bepaald in welke gevallen de aangewezen wegen
      moeten worden gevolgd of de aangewezen vaarwegen of spoorwegen niet mogen worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel12
  - number: '13'
    text: |-
      Voor de toepassing van deze paragraaf worden onder wegen verstaan de voor het openbaar verkeer openstaande wegen in
      de zin van de [Wegenverkeerswet 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0006622
  - number: '14.1'
    text: |-
      Onze Minister wijst ten behoeve van het vervoer van krachtens [artikel 12, eerste lid][ref1], aangewezen
      gevaarlijke stoffen een landelijk net van wegen aan dat bestaat uit bij het Rijk in beheer zijnde wegen of
      weggedeelten.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '14.2'
    text: Van het besluit, bedoeld in het eerste lid, wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel14
  - number: '15.1'
    text: |-
      Onze Minister pleegt bij de voorbereiding van een besluit als bedoeld in [artikel 14][ref1] overleg met de besturen
      van de betrokken openbare lichamen.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '15.2'
    text: |-
      Op de voorbereiding van het besluit is [afdeling 3.4 van de Algemene wet bestuursrecht][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '16.1'
    text: |-
      Provinciale staten wijzen ten behoeve van het vervoer van krachtens [artikel 12][ref1] aangewezen gevaarlijke
      stoffen een provinciaal net van wegen aan, dat bestaat uit bij de provincie of bij de waterschappen in
      beheer zijnde wegen of weggedeelten. Voorzover de aanwijzing van het landelijk net van wegen, bedoeld in
      [artikel 14, eerste lid][ref2], gevolgen heeft voor het provinciale net van wegen, gebeurt de aanwijzing van het
      provinciale net van wegen binnen een jaar na een aanwijzing van het landelijk net van wegen.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel14
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '16.2'
    text: |-
      Provinciale staten dragen er zorg voor dat het wegennet, bedoeld in het eerste lid, aansluit op het landelijke
      wegennet, bedoeld in [artikel 14, eerste lid][ref1], en op de krachtens het eerste lid aangewezen wegennetten van
      de aangrenzende provincies.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: '16.3'
    text: |-
      Met het oog op de afstemming met het crisisplan als bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref1],
      zenden provinciale staten een ontwerp van hun besluit aan de besturen van veiligheidsregio’s.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: '16.4'
    text: |-
      De [artikelen 14, tweede lid][ref1], en [15, tweede lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel15
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
  - number: '18.1'
    text: |-
      De gemeenteraad kan op het grondgebied van zijn gemeente wegen of weggedeelten aanwijzen, waarover de krachtens
      [artikel 12][ref1] aangewezen gevaarlijke stoffen bij uitsluiting mogen worden vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '18.2'
    text: |-
      Wegen of weggedeelten die bij het Rijk, de provincie of het waterschap in beheer zijn, kunnen slechts worden
      aangewezen, voor zover deze deel uitmaken van de wegennetten, bedoeld in [artikel 14, eerste lid][ref1], of
      [artikel 16, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel16
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '16'
        hoofdstuk: III
        paragraaf: '3'
  - number: '18.3'
    text: 'De gemeenteraad draagt er zorg voor dat de aan te wijzen wegen of weggedeelten aansluiten op:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
  - number: 18.3.a
    text: |-
      het landelijke wegennet, bedoeld in [artikel 14, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
  - number: 18.3.b
    text: |-
      het provinciale wegennet, bedoeld in [artikel 16, eerste lid][ref1],


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel16
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '16'
        hoofdstuk: III
        paragraaf: '3'
  - number: 18.3.c
    text: |-
      de wegen of weggedeelten in de aangrenzende gemeente voor zover ten aanzien daarvan toepassing is gegeven aan het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
  - number: '18.4'
    text: |-
      Met het oog op de afstemming met het crisisplan, bedoeld in [artikel 16 van de Wet veiligheidsregio’s][ref1],
      zendt de gemeenteraad een ontwerp van zijn besluit aan het bestuur van de veiligheidsregio.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel16
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '16'
  - number: '18.5'
    text: |-
      De [artikelen 14, tweede lid][ref1], en [15, tweede lid][ref2], zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel15
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
  - number: '18.6'
    text: |-
      Binnen een jaar nadat het provinciale wegennet, bedoeld in [artikel 16, eerste lid][ref1], is aangewezen wordt
      een reeds van kracht zijnde gemeentelijke aanwijzing als bedoeld in het eerste lid, zo nodig in overeenstemming
      gebracht met het derde lid, aanhef en onderdelen a en b.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel16
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '16'
        hoofdstuk: III
        paragraaf: '3'
  - number: '20'
    text: |-
      De wegen of weggedeelten, bedoeld in [artikel 18, eerste lid][ref1], worden aangeduid door borden overeenkomstig
      het daartoe krachtens de [Wegenverkeerswet 1994][ref2] aangewezen model.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0006622
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '18'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0006622
  - number: '21'
    text: |-
      Het is verboden in gemeenten, waar krachtens de[ artikelen 18, eerste lid][ref1], en [20][ref2] wegen of
      weggedeelten zijn aangewezen en aangeduid, de krachtens [artikel 12][ref3] aangewezen gevaarlijke stoffen te
      vervoeren over andere dan de aangewezen en aangeduide wegen of weggedeelten.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel12
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '18'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '20'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '22.1'
    text: |-
      Burgemeester en wethouders kunnen indien dat noodzakelijk is voor het laden en lossen, ontheffing verlenen van het
      bepaalde in [artikel 21][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel21
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '22.2'
    text: |-
      Het in [artikel 9, tweede tot en met vierde lid][ref1], ten aanzien van ontheffingen bepaalde is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel9
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel22
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '9'
        hoofdstuk: II
  - number: '23.1'
    text: |-
      Op verzoek van Onze Minister van Defensie verlenen burgemeester en wethouders ontheffing van het bepaalde in
      [artikel 21][ref1] voor het vervoer met vervoermiddelen die in eigendom toebehoren aan of zich bevinden onder de
      verantwoordelijkheid van de krijgsmacht of van de krijgsmacht van een andere mogendheid:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel21
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: 23.1.a
    text: ten behoeve van het laden en lossen op militaire locaties;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel23
  - number: 23.1.b
    text: |-
      ten behoeve van het ruimen van ontploffingsgevaarlijke stoffen door onder Onze Minister van Defensie ressorterende
      opruimingsdiensten van explosieven.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel23
  - number: '23.2'
    text: De ontheffing kan onder beperkingen worden verleend en daaraan kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel23
  - number: '23.3'
    text: |-
      Burgemeester en wethouders kunnen op verzoek van Onze Minister van Defensie ontheffing verlenen van het bepaalde in
      [artikel 21][ref1], indien dat noodzakelijk is ten behoeve van militaire oefeningen. Artikel 9, tweede tot en met
      vierde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel21
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '21'
        hoofdstuk: III
        paragraaf: '3'
  - number: '24'
    text: |-
      Het is verboden te handelen in strijd met een beperking, waaronder een ontheffing als bedoeld in
      [artikel 22, eerste lid][ref1], en[ 23, eerste lid][ref2], is verleend of met een voorschrift dat aan een zodanige
      ontheffing is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel22
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel23
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '22'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '23'
        hoofdstuk: III
        paragraaf: '3'
  - number: '25'
    text: |-
      Voor de toepassing van deze paragraaf worden onder vaarwegen verstaan de voor het openbaar scheepvaartverkeer
      openstaande binnenwateren.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel25
  - number: '26.1'
    text: |-
      Onze Minister kan vaarwegen of gedeelten daarvan aanwijzen, waarover de krachtens [artikel 12, tweede lid][ref1],
      daartoe aangewezen gevaarlijke stoffen niet mogen worden vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '26.2'
    text: |-
      De [artikelen 14, tweede lid][ref1], en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel15
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
  - number: '27'
    text: |-
      Het is verboden de krachtens [artikel 12, tweede lid][ref1], aangewezen gevaarlijke stoffen te vervoeren over de
      krachtens [artikel 26][ref2] aangewezen vaarwegen of gedeelten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel26
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '26'
        hoofdstuk: III
        paragraaf: '4'
  - number: '28.1'
    text: |-
      Van het bepaalde in [artikel 27][ref1] kan indien dat noodzakelijk is voor het laden en lossen, ontheffing worden
      verleend door:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel27
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '27'
        hoofdstuk: III
        paragraaf: '4'
  - number: 28.1.a
    text: |-
      Onze Minister indien de ontheffing betrekking heeft op het vervoeren over bij het Rijk of bij anderen dan
      publiekrechtelijke rechtspersonen in beheer zijnde vaarwegen of gedeelten daarvan;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel28
  - number: 28.1.b
    text: |-
      gedeputeerde staten indien de ontheffing betrekking heeft op het vervoeren over bij de provincie of de
      waterschappen in beheer zijnde vaarwegen of gedeelten daarvan;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel28
  - number: 28.1.c
    text: |-
      burgemeester en wethouders indien de ontheffing betrekking heeft op het vervoeren over bij de gemeente in beheer
      zijnde vaarwegen of gedeelten daarvan.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel28
  - number: '28.2'
    text: |-
      Het in [artikel 9, tweede tot en met vierde lid][ref1], ten aanzien van ontheffingen bepaalde is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel9
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '9'
        hoofdstuk: II
  - number: '29'
    text: |-
      Het is verboden te handelen in strijd met een beperking, waaronder een ontheffing als bedoeld in
      [artikel 28, eerste lid][ref1], is verleend of met een voorschrift dat aan een zodanige ontheffing is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel28
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '28'
        hoofdstuk: III
        paragraaf: '4'
  - number: '30.1'
    text: |-
      Onze Minister kan spoorwegen of gedeelten daarvan aanwijzen, waarover de krachtens [artikel 12, tweede lid][ref1],
      aangewezen gevaarlijke stoffen niet mogen worden vervoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
  - number: '30.2'
    text: |-
      De [artikelen 14, tweede lid][ref1], en [15][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel15
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '15'
        hoofdstuk: III
        paragraaf: '3'
  - number: '31'
    text: |-
      Het is verboden de krachtens [artikel 12, tweede lid][ref1], aangewezen gevaarlijke stoffen te vervoeren over de
      krachtens [artikel 30][ref2] aangewezen spoorwegen of gedeelten daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel30
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '12'
        hoofdstuk: III
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '30'
        hoofdstuk: III
        paragraaf: '5'
  - number: '32.1'
    text: |-
      Onze Minister kan indien dat noodzakelijk is voor het laden en lossen, ontheffing verlenen van het bepaalde in
      [artikel 31][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel31
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '31'
        hoofdstuk: III
        paragraaf: '5'
  - number: '32.2'
    text: |-
      Het in [artikel 9, tweede tot en met vierde lid][ref1], ten aanzien van ontheffingen bepaalde is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel9
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '9'
        hoofdstuk: II
  - number: '33'
    text: |-
      Het is verboden te handelen in strijd met een beperking, waaronder een ontheffing als bedoeld in
      [artikel 32, eerste lid][ref1], is verleend of met een voorschrift dat aan een zodanige ontheffing is verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel32
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '32'
        hoofdstuk: III
        paragraaf: '5'
  - number: '34.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Ministerie van Verkeer en Waterstaat.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel34
  - number: '34.2'
    text: |-
      Met het toezicht op de naleving van de handelingen bedoeld in [artikel 2, eerste lid][ref1], verricht met of ten
      aanzien van vervoermiddelen die in eigendom toebehoren aan, of zich bevinden onder de verantwoordelijkheid van
      de krijgsmacht of van de krijgsmacht van een andere mogendheid zijn belast de bij besluit van Onze Minister, in
      overeenstemming met Onze Minister van Defensie, aangewezen ambtenaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '34.3'
    text: |-
      Onze Minister kan, in overeenstemming met Onze Ministers wie het mede aangaat, bij besluit andere dan de in het
      eerste en tweede lid bedoelde ambtenaren aanwijzen die zijn belast met het toezicht op de naleving van het bepaalde
      bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel34
  - number: '34.4'
    text: |-
      De toezichthouders, bedoeld in het tweede en derde lid, beschikken niet over de bevoegdheid, genoemd in
      [artikel 5:18 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '34.5'
    text: |-
      Onze Minister kan met het oog op de coördinatie van het beleid ten aanzien van het toezicht op de naleving
      beleidsregels stellen.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel34
  - number: '34.6'
    text: |-
      Van een besluit als bedoeld in het eerste, tweede of derde lid wordt mededeling gedaan door plaatsing in de
      *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel34
  - number: '44.1'
    text: |-
      Met de opsporing van overtredingen van bij of krachtens deze wet gestelde voorschriften zijn, onverminderd het
      bepaalde bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1], belast:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 44.1.a
    text: |-
      de ambtenaren, bedoeld in [artikel 34, eerste lid][ref1], voor zover daartoe bij besluit van Onze Minister en Onze
      Minister van Justitie aangewezen;


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel34
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 44.1.b
    text: |-
      voor zover het betreft de handelingen bedoeld in [artikel 34, tweede lid][ref1]: de bij besluit van Onze Minister
      en Onze Ministers van Defensie en van Justitie aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel34
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '34'
        hoofdstuk: IV
        paragraaf: '1'
  - number: 44.1.c
    text: |-
      de bij besluit van Onze Minister en Onze Minister van Justitie, en waar nodig Onze Ministers wie het mede aangaat,
      aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44
  - number: '44.2'
    text: |-
      Onze Minister kan de bevoegdheid tot opsporing van de ambtenaren, bedoeld in het eerste lid, onder *c* bij de
      aldaar bedoelde aanwijzing beperken.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44
  - number: '44.3'
    text: |-
      De ambtenaren, bedoeld in het eerste lid, zijn tevens belast met de opsporing van de feiten, strafbaar gesteld
      in de [artikelen 179][ref1] tot en met [182][ref2] en [184 van het Wetboek van Strafrecht][ref3], voor zover deze
      feiten betrekking hebben op een bevel, vordering of handeling, gedaan of ondernomen door henzelf.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel179
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel182
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel184
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '179'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '182'
      - id: ref3
        bwb_id: BWBR0001854
        artikel: '184'
  - number: '44.4'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44
  - number: 44a.1
    text: |-
      Handelingen in strijd met [artikel 3a, tweede en derde lid][ref1], voor zover opzettelijk begaan, zijn misdrijven
      en worden gestraft met een gevangenisstraf van ten hoogste zes jaren of geldboete van ten hoogste de vijfde
      categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel3a
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44a
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: 3a
        hoofdstuk: II
  - number: 44a.2
    text: |-
      Handelingen, als bedoeld in het eerste lid, die geen misdrijven zijn, zijn overtredingen en worden gestraft met
      hechtenis van ten hoogste een jaar of geldboete van de vierde categorie.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44a
  - number: 44a.3
    text: 'Als bijkomende straf kan worden opgelegd:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44a
  - number: 44a.3.a
    text: |-
      gehele of gedeeltelijke stillegging van de onderneming van de veroordeelde, waarin de overtreding is begaan voor
      een tijd van ten hoogste een jaar; of,
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44a
  - number: 44a.3.b
    text: verbeurdverklaring van de voorwerpen, genoemd in artikel 35 van het Wetboek van Strafvordering BES.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44a
  - number: 44a.4
    text: |-
      Met het opsporen van de in het eerste en tweede lid strafbaar gestelde feiten zijn, onverminderd de bij of
      krachtens artikel 184 van het Wetboek van Strafvordering BES aangewezen ambtenaren, de door Onze Minister van
      Justitie, in overeenstemming met Onze Minister, aangewezen ambtenaren belast.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44a
  - number: 44b.1
    text: |-
      Indien tegen de verdachte ernstige bezwaren zijn gerezen en tevens de belangen, welke door het vermoedelijk
      overtreden voorschrift worden beschermd, een onmiddellijk ingrijpen vereisen, is de officier van justitie in alle
      zaken als bedoeld in [artikel 44a, eerste en tweede lid][ref1], bevoegd zolang de behandeling ter terechtzitting
      nog niet is aangevangen, de verdachte bij te betekenen kennisgeving als voorlopige maatregel te bevelen:


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel44a
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: 44a
        hoofdstuk: IV
        paragraaf: '2'
  - number: 44b.1.a
    text: zich te onthouden van bepaalde handelingen;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
  - number: 44b.1.b
    text: |-
      zorg te dragen, dat in het bevel aangeduide voorwerpen, welke vatbaar zijn voor inbeslagneming, opgeslagen en
      bewaard worden ter plaatse, in het bevel aangegeven.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
  - number: 44b.2
    text: De voorgenoemde bevelen zijn dadelijk uitvoerbaar en worden onverwijld aan de verdachte betekend.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
  - number: 44b.3
    text: |-
      De voorgenoemde bevelen verliezen hun kracht door een tijdsverloop van zes maanden en blijven uiterlijk van kracht
      totdat de rechterlijke einduitspraak in de zaak, waarin zij zijn gegeven, onherroepelijk is geworden. Zij kunnen
      tussentijds door de officier van justitie bij aan de verdachte te betekenen kennisgeving worden gewijzigd of
      ingetrokken of door het gerecht, waarvoor de zaak wordt vervolgd, worden gewijzigd of opgeheven. Het gerecht kan
      dit doen ambtshalve, op de voordracht van de rechter-commissaris, met het gerechtelijk vooronderzoek belast, of op
      het verzoek van de verdachte; deze wordt steeds gehoord, althans behoorlijk opgeroepen, tenzij:
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
  - number: 44b.3.a
    text: |-
      het gerecht reeds aanstonds tot wijziging overeenkomstig het verzoek van de verdachte dan wel tot opheffing
      besluit;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
  - number: 44b.3.b
    text: |-
      nog geen twee maanden zijn verstreken sedert op een vorig verzoek van de verdachte van gelijke strekking is
      beslist.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
  - number: 44b.4
    text: |-
      Tegen voorgenoemde rechterlijke beschikkingen kan het openbaar ministerie binnen veertien dagen en de verdachte
      binnen veertien dagen na de betekening in hoger beroep komen bij het Gemeenschappelijk Hof, bedoeld in
      [artikel 14, eerste lid, van de Rijkswet Gemeenschappelijk Hof van Justitie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0028070#Artikel14
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
    references:
      - id: ref1
        bwb_id: BWBR0028070
        artikel: '14'
  - number: 44b.5
    text: De artikelen 43, tiende en elfde lid, van het Wetboek van Strafvordering BES zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44b
  - number: 44c.1
    text: |-
      Indien de zaak eindigt hetzij zonder oplegging van straf of maatregel, hetzij met oplegging van een zodanige straf
      of maatregel dat de opgelegde voorlopige maatregel als onevenredig hard moet worden beschouwd, kan het gerecht, op
      verzoek van de gewezen verdachte hem een geldelijke tegemoetkoming ten laste van de Staat toekennen voor de schade,
      welke hij ten gevolge van de opgelegde voorlopige maatregel werkelijk heeft geleden.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44c
  - number: 44c.2
    text: De artikelen 179 tot en met 181 van het Wetboek van Strafvordering BES zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel44c
  - number: '45'
    text: |-
      De uitreiking van gerechtelijke mededelingen in zaken betreffende overtredingen van het bepaalde bij of krachtens
      deze wet, begaan door een niet in Nederland gevestigde onderneming, kan eveneens geschieden aan de bestuurder
      van het betrokken voertuig of aan de schipper van het betrokken vaartuig die zich bereid verklaart de mededeling
      onverwijld te doen toekomen aan degene voor wie zij is bestemd.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel45
  - number: 45a
    text: |-
      Ingeval bij of krachtens deze wet wordt verwezen naar in het kader van de Internationale Maritieme Organisatie van
      de Verenigde Naties tot stand gekomen besluiten die betrekking hebben op het vervoer van gevaarlijke stoffen met
      zeeschepen, kan overtreding van deze besluiten ook als strafbaar feit worden aangemerkt indien deze besluiten in de
      Engelse taal zijn gesteld en bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel45a
  - number: '46'
    text: |-
      Onze Minister is bevoegd tot oplegging van een last onder bestuursdwang ter handhaving van de bij of krachtens deze
      wet gestelde verplichtingen.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel46
  - number: '47'
    text: |-
      Degene die een handeling als bedoeld in [artikel 2, eerste lid][ref1], verricht, is verplicht indien zich daarbij
      voorvallen, waardoor gevaar voor de openbare veiligheid is ontstaan of is te duchten, of ongevallen voordoen
      daarvan onverwijld mededeling te doen aan Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
  - number: '48.1'
    text: |-
      Onze Minister kan van degenen die handelingen als bedoeld in [artikel 2, eerste lid][ref1], verrichten, alle
      inlichtingen vragen die naar zijn redelijk oordeel nodig zijn ten behoeve van het analyseren van voorvallen en
      ongevallen als bedoeld in [artikel 47][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel47
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '2'
        hoofdstuk: I
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007606
        artikel: '47'
        hoofdstuk: V
  - number: '48.2'
    text: |-
      De betrokkenen zijn verplicht de gevraagde inlichtingen volledig en naar waarheid te verstrekken binnen een door
      Onze Minister in redelijkheid te stellen termijn.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel48
  - number: '48.3'
    text: |-
      Zij die uit hoofde van hun beroep of ambt tot geheimhouding verplicht zijn, kunnen zich verschonen van het
      verschaffen van inlichtingen, doch uitsluitend voor zover het betreft hetgeen hun in die hoedanigheid is
      toevertrouwd.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel48
  - number: '49.1'
    text: 'Degene die een verzoek doet aan de rijksoverheid tot:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: 49.1.a
    text: het verlenen of wijzigen van een ontheffing ingevolge deze wet;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: 49.1.b
    text: het verrichten van een keuring ingevolge deze wet; of
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: 49.1.c
    text: |-
      het afgeven of wijzigen van ingevolge deze wet vereiste documenten; is voor de behandeling van dat verzoek een
      vergoeding van de kosten verschuldigd.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: '49.2'
    text: 'Bij ministeriële regeling:'
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: 49.2.a
    text: |-
      worden de vergoedingen, bedoeld in het eerste lid, vastgesteld, met dien verstande, dat per soort van handeling de
      geraamde opbrengst van de vergoedingen de geraamde uitgaven terzake niet te boven gaat;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: 49.2.b
    text: |-
      kan worden bepaald dat, indien anderen dan Onze Minister de in het eerste lid bedoelde werkzaamheden verrichten,
      zij zelf daarvoor de vergoedingen alsmede de wijze van betaling van deze vergoedingen vaststellen met inachtneming
      van de bij ministeriële regeling gegeven voorschriften;
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: 49.2.c
    text: wordt bepaald aan wie de vergoedingen, bedoeld in het eerste lid, verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel49
  - number: '50'
    text: |-
      Tegen een besluit als bedoeld in de [artikelen 14, eerste lid][ref1], [16, eerste lid][ref2],
      [18, eerste lid][ref3], [26, eerste lid][ref4], en [30, eerste lid][ref5], staat beroep open als bedoeld in
      [Hoofdstuk 8 van de Algemene wet bestuursrecht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0007606#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007606#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0007606#Artikel18
      [ref4]: https://wetten.overheid.nl/BWBR0007606#Artikel26
      [ref5]: https://wetten.overheid.nl/BWBR0007606#Artikel30
      [ref6]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0007606/2014-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007606
        artikel: '14'
        hoofdstuk: III
