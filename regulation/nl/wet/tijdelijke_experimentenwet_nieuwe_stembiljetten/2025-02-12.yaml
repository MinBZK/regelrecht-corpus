    text: |-
      1 In de publicatie, bedoeld in [artikel G 1, achtste lid][ref1], onderscheidenlijk
      [artikel G 2, achtste lid, van de Kieswet][ref2], doet het centraal stembureau tevens mededeling van de op
      grond van deze wet en de [Kieswet][ref3] door hem geregistreerde logo’s van politieke groeperingen, voor zover de
      registratie daarvan onherroepelijk is.

      2 De [artikelen G 4][ref4] en [G 5, eerste lid, aanhef en onder b, en tweede lid, van de Kieswet][ref5] zijn van
      overeenkomstige toepassing.

      3 [Artikel Q 6, eerste lid, van de Kieswet][ref6] is van overeenkomstige toepassing.

      4 Een geregistreerd logo van een politieke groepering werkt niet door indien de aanduiding van de politieke
      groepering niet doorwerkt.


