  - number: '11'
    text: |-
      1 Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met inachtneming van het
      in deze paragraaf bepaalde.

      2 De bij of krachtens deze wet gestelde bepalingen betreffende de verkiezing van de leden van de gemeenteraad,
      onderscheidenlijk provinciale staten, zijn, voor zover deze paragraaf niet anders bepaalt, van overeenkomstige
      toepassing op de verkiezing van de leden van de eilandsraad, onderscheidenlijk het kiescollege.

      3 Voor de toepassing van artikel 2 wordt:

      a. in plaats van «gemeenteraad» gelezen «eilandsraad»;

      b. in plaats van «gemeente» of «provincie» gelezen «openbaar lichaam»;

      c. in plaats van «provinciale staten» gelezen «het kiescollege».
    url: https://wetten.overheid.nl/BWBR0047212/2025-02-12#Artikel11
  - number: '12'
    text: |-
      1 Indien het betreft een verzoek om registratie van een logo ten behoeve van de verkiezing van de leden van een
      kiescollege, wordt:

      a. in [artikel 6, eerste lid][ref1], in plaats van «voor de verkiezing van de leden van de Tweede Kamer» gelezen
      «voor de verkiezing van de leden van de Tweede Kamer of voor de verkiezing van de leden van de eilandsraad»;

      b. in [artikel 6, tweede lid][ref2], in plaats van «een reeds op grond van dit artikel of een op grond
      van [artikel G 1a van de Kieswet][ref3]» gelezen «een reeds op grond van dit artikel, een op grond van
      [artikel 8][ref4], in samenhang met [artikel 11, tweede lid][ref5], of een op grond van artikel G 1a van de
      Kieswet, geregistreerd logo van een andere politieke groepering, of met een logo waarvoor reeds eerder op grond van
      dit artikel een registratieverzoek is ontvangen, en daardoor verwarring te duchten is».

      2 In de publicatie, bedoeld in [artikel Ya 15, derde lid, van de Kieswet][ref6] doet het centraal stembureau tevens
      mededeling van de ingevolge deze wet door hem geregistreerde logo’s van politieke groeperingen, voor zover de
      registratie daarvan onherroepelijk is.

      3 [Artikel Ya 26 van de Kieswet][ref7] is van overeenkomstige toepassing.

      4 De [artikelen Ya 43][ref8], [Ya 45][ref9] en [Ya 46, eerste, derde en vijfde lid, van de Kieswet][ref10] zijn
      van overeenkomstige toepassing op een beschikking die is genomen op grond van de [artikelen 5][ref11], [6][ref12]
      en [8 tot en met 10][ref13].


