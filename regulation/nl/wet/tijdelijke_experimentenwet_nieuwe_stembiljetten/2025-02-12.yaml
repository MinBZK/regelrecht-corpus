  - number: '3'
    text: |-
      1 De experimenten vinden voor zover mogelijk plaats overeenkomstig hetgeen bij en krachtens de [Kieswet][ref1]
      is bepaald.

      2 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over de experimenten. Deze regels
      kunnen op het naastlagere niveau afwijken van het bepaalde bij of krachtens de volgende onderdelen:

      a. de [artikelen J 4, eerste en vijfde lid][ref2], [J 6b][ref3], [J 7][ref4], [J 9][ref5], [J 12][ref6],
      [J 16][ref7], [J 18, eerste lid][ref8], [J 19 tot en met J 21][ref9],[ J 25 tot en met J 27][ref10],
      [J 29][ref11], [J 31][ref12], [K 4, vierde lid][ref13], [K 11][ref14], [L 11, tweede lid][ref15], en
      [L 17 van de Kieswet][ref16], met betrekking tot de inrichting van het stemlokaal, het verloop van gecombineerde
      stemmingen, het ter kennis brengen van de kandidatenlijsten, de werkwijze en samenstelling van het stembureau, de
      vormgeving van de (vervangende) stempas, de kiezerspas en het volmachtbewijs, de vormgeving en beschikbaarstelling
      van stembiljetten en de wijze waarop de stem wordt uitgebracht;

      b. de [artikelen N 1 tot en met N 12 van de Kieswet][ref17], met betrekking tot de taken en werkwijze van het
      stembureau tijdens de stemopneming;

      c. de [artikelen Na 4][ref18], [Na 11 tot en met Na 25][ref19], [Na 27, tweede lid][ref20],
      [O 3, tweede lid][ref21], [O 6, tweede lid][ref22], [P 1d, vierde lid][ref23], [P 1e][ref24] en
      [V 4a, vierde lid, van de Kieswet][ref25], met betrekking tot de taken en werkwijze van het gemeentelijk
      stembureau, het hoofdstembureau en het centraal stembureau tijdens de stemopneming en een nieuwe opneming van
      stembiljetten;

      d. de [artikelen T 2 tot en met T 11][ref26], [V 4b, tweede en derde lid][ref27], en
      [Ya 30, derde lid, van de Kieswet][ref28], met betrekking tot de wijze waarop de stem wordt uitgebracht alsmede
      de taken en werkwijze van het stembureau en het vertegenwoordigend orgaan tijdens de stemopneming en een nieuwe
      opneming van stembiljetten bij de verkiezing van de leden van de Eerste Kamer der Staten-Generaal;

      e. de [artikelen Y 2][ref29], [Y 24][ref30] en [Y 39 van de Kieswet][ref31], met betrekking tot de werkwijze
      tijdens de verkiezing van de Nederlandse leden van het Europees Parlement.

      3 De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


