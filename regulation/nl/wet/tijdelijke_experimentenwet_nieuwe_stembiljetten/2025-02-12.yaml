preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de uitvoerbaarheid van de stemopneming en het
    toegankelijker maken van het stemmen wenselijk is tijdelijke regels vast te stellen voor experimenten met nieuwe
    stembiljetten ten behoeve van het gebruik in het stemlokaal;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0047212/2025-02-12#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0047212/2025-02-12#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan besluiten dat bij een verkiezing als bedoeld in de [Kieswet][ref1] of de
      [Wet algemene regels herindeling][ref2] een experiment plaatsvindt met als doel de invoering van een stembiljet met
      een handzaam formaat, ten behoeve van het gebruik in het stemlokaal, dat:

      a. eenvoudig te tellen is, ter bevordering van de uitvoerbaarheid en daarmee de kwaliteit van de stemopneming; en

      b. geschikt is voor het afbeelden van logo’s van politieke groeperingen, ter bevordering van de toegankelijkheid
      van het stemmen.

      2 Onze Minister kan, behoudens in het geval, bedoeld in het derde lid, na instemming van de gemeenteraad, een
      gemeente aanwijzen waar wordt geëxperimenteerd.

      3 Bij een verkiezing van de leden van de Eerste Kamer kan Onze Minister, na instemming van provinciale staten, een
      provincie aanwijzen waar wordt geëxperimenteerd.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0003718
    url: https://wetten.overheid.nl/BWBR0047212/2025-02-12#Artikel2
