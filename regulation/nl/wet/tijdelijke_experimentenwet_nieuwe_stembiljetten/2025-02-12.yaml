  - number: '4'
    text: |-
      1 Onze Minister wijst de voorzieningen aan die bij een experiment worden gebruikt.

      2 Een voorziening wordt slechts aangewezen indien:

      a. de inzet van de voorziening geen afbreuk doet aan het geheime karakter van de stemming; en

      b. de transparantie, controleerbaarheid en betrouwbaarheid van de verkiezing niet worden verminderd.

      3 Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de voorzieningen.
    url: https://wetten.overheid.nl/BWBR0047212/2025-02-12#Artikel4
  - number: '5'
    text: |-
      Iedere politieke groepering die een aanduiding heeft ingeschreven of inschrijft in het register,
      bedoeld in [artikel G 1 van de Kieswet][ref1], dient bij het centraal stembureau voor de verkiezing
      van de leden van de Tweede Kamer, indien bij deze verkiezing sprake is van een experiment als
      bedoeld in [artikel 2, eerste lid][ref2], van deze wet, een schriftelijk verzoek in, als bedoeld in
      [artikel G 1a, eerste lid, van de Kieswet][ref3], om het logo waarmee zij voor die verkiezing op de
      kandidatenlijst wenst te worden vermeld, bij te schrijven in het register. Indien een politieke groepering waarvan
      wel een aanduiding in het register staat ingeschreven op de tweeënveertigste dag voor de kandidaatstelling geen
      logo heeft geregistreerd, wordt voor de toepassing van de registraties in het verkiezingsproces enkel gebruik
      gemaakt van de in het register opgenomen aanduiding van de politieke groepering.


      [ref1]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
      [ref2]: https://wetten.overheid.nl/BWBR0047212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004627#ArtikelG_1
