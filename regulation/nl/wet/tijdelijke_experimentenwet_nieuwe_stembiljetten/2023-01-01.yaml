      - id: ref2
        bwb_id: BWBR0004627
  - number: '10.3'
    text: |-
      [Artikel Q 6, eerste lid, van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel10
