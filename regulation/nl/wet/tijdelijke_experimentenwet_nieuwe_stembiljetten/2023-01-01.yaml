  - number: '10.1'
    text: |-
      In de publicatie, bedoeld in [artikel G 1, achtste lid][ref1], onderscheidenlijk
      [artikel G 2, achtste lid, van de Kieswet][ref2], doet het centraal stembureau tevens mededeling van de op
      grond van deze wet en de [Kieswet][ref3] door hem geregistreerde logo’s van politieke groeperingen, voor zover de
      registratie daarvan onherroepelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
      [ref3]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel10
