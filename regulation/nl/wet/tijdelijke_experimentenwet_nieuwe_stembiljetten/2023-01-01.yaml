    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: 8.2.a
    text: |-
      voor het tweede lid, onderdeel c, wordt gelezen «het logo geheel of in hoofdzaak overeenstemt met een reeds op
      grond van dit artikel, een op grond van [artikel 6][ref1] of een op grond van [artikel G 1a van de Kieswet][ref2],
      geregistreerd logo van een andere politieke groepering, of met een logo waarvoor reeds eerder op grond van dit
      artikel een registratieverzoek is ontvangen, en daardoor verwarring te duchten is»;


      [ref1]: https://wetten.overheid.nl/BWBR0047212#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0047212
        artikel: '6'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0004627
  - number: 8.2.b
    text: |-
      in afwijking van het derde lid wordt van de beslissing mededeling gedaan aan de gemachtigde en op de in de gemeente
      gebruikelijke wijze.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel8
  - number: '8.3'
    text: |-
      [Artikel G 5, eerste lid, aanhef en onder a, en tweede lid, van de Kieswet][ref1] is van overeenkomstige
      toepassing op een besluit dat is genomen op grond van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '9.1'
    text: |-
      Iedere politieke groepering die een aanduiding heeft ingeschreven of inschrijft in het register, bedoeld
      in [artikel Q 6 van de Kieswet][ref1], en waarvan het logo niet reeds bij het centraal stembureau voor
      de verkiezing van de leden van de Tweede Kamer is geregistreerd, dient bij het centraal stembureau voor de
      verkiezing van de leden van de Eerste Kamer, indien bij deze verkiezing sprake is van een experiment als bedoeld
      in [artikel 2, eerste lid][ref2], van deze wet, een schriftelijk verzoek in om het logo waarmee zij voor die
      verkiezing op de kandidatenlijst wenst te worden vermeld, bij te schrijven in het register. De verzoeken die zijn
      ontvangen of aangevuld als bedoeld in [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref3], na de
      negenentwintigste dag voor de kandidaatstelling, blijven voor de daaropvolgende verkiezing buiten behandeling.
      Indien een politieke groepering waarvan wel een aanduiding in het register staat ingeschreven op die dag geen logo
      heeft geregistreerd, wordt voor de toepassing van de registraties in het verkiezingsproces enkel gebruik gemaakt
      van de in het register opgenomen aanduiding van de politieke groepering.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0047212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel9
