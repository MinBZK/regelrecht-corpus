      - id: ref3
        bwb_id: BWBR0004627
  - number: '10.2'
    text: |-
      De [artikelen G 4][ref1] en [G 5, eerste lid, aanhef en onder b, en tweede lid, van de Kieswet][ref2] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel10
