preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het ter bevordering van de uitvoerbaarheid van de stemopneming en het
    toegankelijker maken van het stemmen wenselijk is tijdelijke regels vast te stellen voor experimenten met nieuwe
    stembiljetten ten behoeve van het gebruik in het stemlokaal;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Binnenlandse Zaken en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel1
  - number: '2.1'
    text: |-
      Onze Minister kan besluiten dat bij een verkiezing als bedoeld in de [Kieswet][ref1] of de
      [Wet algemene regels herindeling][ref2] een experiment plaatsvindt met als doel de invoering van een stembiljet met
      een handzaam formaat, ten behoeve van het gebruik in het stemlokaal, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0003718
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0003718
  - number: 2.1.a
    text: eenvoudig te tellen is, ter bevordering van de uitvoerbaarheid en daarmee de kwaliteit van de stemopneming; en
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel2
  - number: 2.1.b
    text: |-
      geschikt is voor het afbeelden van logo’s van politieke groeperingen, ter bevordering van de toegankelijkheid van
      het stemmen.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan, behoudens in het geval, bedoeld in het derde lid, na instemming van de gemeenteraad, een
      gemeente aanwijzen waar wordt geëxperimenteerd.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel2
  - number: '2.3'
    text: |-
      Bij een verkiezing van de leden van de Eerste Kamer kan Onze Minister, na instemming van provinciale staten, een
      provincie aanwijzen waar wordt geëxperimenteerd.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel2
