        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0047212
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '9.2'
    text: |-
      [Artikel G 1a, tweede tot en met zesde lid, van de Kieswet][ref1] is van overeenkomstige toepassing, met dien
      verstande dat voor het tweede lid, onderdeel c, wordt gelezen «het logo geheel of in hoofdzaak overeenstemt
      met een reeds op grond van dit artikel of een op grond van artikel G 1a van de Kieswet, geregistreerd logo van
      een andere politieke groepering, of met een logo waarvoor reeds eerder op grond van voornoemde artikelen een
      registratieverzoek is ontvangen, en daardoor verwarring te duchten is».


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0004627
  - number: '9.3'
    text: |-
      [Artikel Q 6, vijfde lid, van de Kieswet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel9
