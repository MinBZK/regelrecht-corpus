  - number: '10.4'
    text: |-
      Een geregistreerd logo van een politieke groepering werkt niet door indien de aanduiding van de politieke
      groepering niet doorwerkt.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel10
  - number: '11.1'
    text: |-
      Deze wet is mede van toepassing in de openbare lichamen Bonaire, Sint Eustatius en Saba, met inachtneming van het
      in deze paragraaf bepaalde.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel11
  - number: '11.2'
    text: |-
      De bij of krachtens deze wet gestelde bepalingen betreffende de verkiezing van de leden van de gemeenteraad,
      onderscheidenlijk provinciale staten, zijn, voor zover deze paragraaf niet anders bepaalt, van overeenkomstige
      toepassing op de verkiezing van de leden van de eilandsraad, onderscheidenlijk het kiescollege.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel11
  - number: '11.3'
    text: 'Voor de toepassing van artikel 2 wordt:'
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel11
  - number: 11.3.a
    text: in plaats van «gemeenteraad» gelezen «eilandsraad»;
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel11
  - number: 11.3.b
    text: in plaats van «gemeente» of «provincie» gelezen «openbaar lichaam»;
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel11
  - number: 11.3.c
    text: in plaats van «provinciale staten» gelezen «het kiescollege».
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel11
  - number: '12.1'
    text: |-
      Indien het betreft een verzoek om registratie van een logo ten behoeve van de verkiezing van de leden van een
      kiescollege, wordt:
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel12
  - number: 12.1.a
    text: |-
      in [artikel 6, eerste lid][ref1], in plaats van «voor de verkiezing van de leden van de Tweede Kamer» gelezen «voor
      de verkiezing van de leden van de Tweede Kamer of voor de verkiezing van de leden van de eilandsraad»;


      [ref1]: https://wetten.overheid.nl/BWBR0047212#Artikel6
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel12
