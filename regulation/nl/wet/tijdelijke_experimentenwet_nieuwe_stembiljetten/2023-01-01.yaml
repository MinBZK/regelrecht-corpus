  - number: '3.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel3
  - number: '4.1'
    text: Onze Minister wijst de voorzieningen aan die bij een experiment worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel4
  - number: '4.2'
    text: 'Een voorziening wordt slechts aangewezen indien:'
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel4
  - number: 4.2.a
    text: de inzet van de voorziening geen afbreuk doet aan het geheime karakter van de stemming; en
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel4
  - number: 4.2.b
    text: de transparantie, controleerbaarheid en betrouwbaarheid van de verkiezing niet worden verminderd.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel4
  - number: '4.3'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over de voorzieningen.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel4
  - number: '5'
    text: |-
      Iedere politieke groepering die een aanduiding heeft ingeschreven of inschrijft in het register,
      bedoeld in [artikel G 1 van de Kieswet][ref1], dient bij het centraal stembureau voor de verkiezing
      van de leden van de Tweede Kamer, indien bij deze verkiezing sprake is van een experiment als
      bedoeld in [artikel 2, eerste lid][ref2], van deze wet, een schriftelijk verzoek in, als bedoeld in
      [artikel G 1a, eerste lid, van de Kieswet][ref3], om het logo waarmee zij voor die verkiezing op de
      kandidatenlijst wenst te worden vermeld, bij te schrijven in het register. Indien een politieke groepering waarvan
      wel een aanduiding in het register staat ingeschreven op de tweeënveertigste dag voor de kandidaatstelling geen
      logo heeft geregistreerd, wordt voor de toepassing van de registraties in het verkiezingsproces enkel gebruik
      gemaakt van de in het register opgenomen aanduiding van de politieke groepering.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0047212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0004627
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0004627
      - id: ref2
        bwb_id: BWBR0047212
        artikel: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0004627
  - number: '6.1'
    text: |-
      Iedere politieke groepering die een aanduiding heeft ingeschreven of inschrijft in het register, bedoeld
      in [artikel G 2 van de Kieswet][ref1], en waarvan het logo niet reeds bij het centraal stembureau voor de
      verkiezing van de leden van de Tweede Kamer is geregistreerd, dient bij het centraal stembureau voor de verkiezing
      van de leden van de provinciale staten, indien bij deze verkiezing sprake is van een experiment als bedoeld
      in [artikel 2, eerste lid][ref2], van deze wet, een schriftelijk verzoek in om het logo waarmee zij voor die
      verkiezing op de kandidatenlijst wenst te worden vermeld, bij te schrijven in het register. De verzoeken die zijn
      ontvangen of aangevuld als bedoeld in [artikel 4:5, eerste lid, van de Algemene wet bestuursrecht][ref3], na
      de tweeënveertigste dag voor de kandidaatstelling, blijven voor de daaropvolgende verkiezing buiten behandeling.
      Indien een politieke groepering waarvan wel een aanduiding in het register staat ingeschreven op die dag geen logo
      heeft geregistreerd, wordt voor de toepassing van de registraties in het verkiezingsproces enkel gebruik gemaakt
      van de in het register opgenomen aanduiding van de politieke groepering.


      [ref1]: https://wetten.overheid.nl/BWBR0004627
      [ref2]: https://wetten.overheid.nl/BWBR0047212#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel4
