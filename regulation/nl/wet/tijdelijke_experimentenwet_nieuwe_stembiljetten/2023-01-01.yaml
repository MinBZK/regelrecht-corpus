  - number: '22.1'
    text: |-
      Deze wet, met uitzondering van de artikelen 17 en 18, treedt in werking met ingang van de dag na de datum van
      uitgifte van het Staatsblad waarin zij wordt geplaatst en vervalt tien jaar na het tijdstip van inwerkingtreding.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel22
  - number: '22.2'
    text: Artikel 17 treedt in werking met ingang van tien jaar na het tijdstip van inwerkingtreding van deze wet.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel22
  - number: '22.3'
    text: Artikel 18 treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0047212/2023-01-01#Artikel22
  - number: '23'
    text: 'Deze wet wordt aangehaald als: Tijdelijke experimentenwet nieuwe stembiljetten.'
