  - number: 3:12
    text: |-
      1 De Projectdirectie Nieuwe Huisvesting staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De projectdirectie valt onder de verantwoordelijkheid van de plaatsvervangend secretaris-generaal.

      3 De projectdirectie heeft de volgende taken:

      a) het bevorderen van het totstandkomen van nieuwe huisvesting en de bijbehorende voorzieningen voor het
      kerndepartement;

      b) het voorbereiden van de verhuizing;

      c) het voeren van overleg met de ontwerpende en uitvoerende partijen waaronder het verzorgen van
      interdepartementale afstemming en afstemming met de betrokken gemeente;

      d) de zorg voor een adequate informatievoorziening over het project.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel312
  - number: 3:13
    text: |-
      1 Het gemeenschappelijk secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen staat onder leiding van een secretaris en een plaatsvervangend secretaris.

      2 Het secretariaat heeft tot taak beide raden inhoudelijk en administratief te ondersteunen bij hun advisering.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel313
  - number: 3:14
    text: |-
      1 Het directoraat-generaal Management Openbare Dienst staat onder leiding van een directeur-generaal en een
      plaatsvervangend directeur-generaal, tevens directeur van een van de directies, genoemd in het derde lid.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van de
      hoofddoelstellingen van het ministerie, voorzover deze betreffen:

      a) het arbeidsvoorwaardenbeleid;

      b) het zorgpersoneelsbeleid;

      c) het informatiebeleid voor de openbare sector;

      d) de organisatie en kwaliteit van de rijksdienst.

      3 Het directoraat-generaal bestaat uit de volgende dienstonderdelen:

      a) de stafafdeling Management en Personeelsbeleid (SMP);

      b) de directie Arbeidszaken Overheid (AO);

      c) de directie Informatiebeleid Openbare Sector (IOS);

      d) de directie Personeelsmanagement Rijksdienst (PMR);

      e) het agentschap Informatievoorziening Overheidspersoneel (IVOP);

      f) het agentschap Centrale Archief Selectiedienst (CAS);

      g) de afdeling Organisatie en Kwaliteit Rijksdienst (OKR).
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel314
  - number: 3:15
    text: |-
      1 De stafafdeling Management en Personeelsbeleid staat onder leiding van een hoofd.

      2 De stafafdeling heeft tot taak het ondersteunen bij de uitvoering van de beleids- en beheertaken van de
      directeur-generaal Management en Openbare Dienst, voor de directies Arbeidszaken Overheid en Personeelsmanagement
      Rijksdienst en de stafafdeling Management en Personeelsbeleid, de agentschappen IVOP en CAS, het Service Centre
      DGMP i.o en het SSC HRM i.o.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel315
  - number: 3:16
    text: |-
      1 De directie Arbeidszaken Overheid staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het ondersteunen van de minister bij diens taken ten aanzien van de arbeidszaken met betrekking tot de gehele
      overheid door middel van beleidsontwikkeling, advisering, regelgeving en informatievoorziening;

      b) het inhoudelijk en administratief ondersteunen van het Verbond Sectorwerkgevers Overheid;

      c) het adviseren over macro-economische en sociaal-economische politiek.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel316
  - number: 3:17
    text: |-
      1 De directie Informatiebeleid Openbare Sector staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft de volgende taken:

      a) het ontwikkelen van het informatiebeleid van de openbare sector en de coördinatie daarvan;

      b) het bevorderen van de verbetering van de publieke dienstverlening aan en publieke toegankelijkheid van
      overheidsinformatie voor de burger, de overheid en het bedrijfsleven door beleidsontwikkeling en het stimuleren
      van toepassingen;

      c) het bevorderen van informatiebeveiliging;

      d) het ontwikkelen van beleid betreffende de digitale duurzaamheid en archivering;

      e) het ontwikkelen van beleid betreffende de elektronische infrastructuur van de openbare sector en het toezien op
      de uitvoering daarvan.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel317
  - number: 3:18
    text: |-
      1 De directie Personeelsmanagement Rijksdienst staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft tot taak het ontwikkelen van beleid, het adviseren en het totstandbrengen van regelgeving voor
      de sector Rijk, met betrekking tot:

      a) arbeidsmarktbeleid;

      b) personeelsontwikkeling;

      c) arbeidsvoorwaarden;

      d) sociaal zekerheid, pensioenen en zorg;

      e) formatiemanagement;

      f) informatie en financiering met betrekking tot de factor arbeid.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel318
  - number: 3:19
    text: |-
      1 Het agentschap Informatievoorziening Overheidspersoneel staat onder leiding van een directeur en een
      plaatsvervangend directeur.

      2 Het agentschap heeft tot taak (het zorgdragen voor) het ontwerpen, ontwikkelen, bouwen, instandhouden
      en exploiteren van (informatie)systemen op het gebied van de salarisverwerking en de financiële
      personeelsadministratie en het adviserende dienaangaande.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel319
  - number: 3:20
    text: |-
      1 Het agentschap Centrale Archief Selectiedienst staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 Het agentschap valt onder de verantwoordelijkheid van de plaatsvervangend directeur-generaal Management Openbare
      Dienst.

      3 Het agentschap heeft de taken, bedoeld in het [besluit van 12 december 1996][ref1], houdende regels met
      betrekking tot taak en werkwijze van de Centrale Archief Selectiedienst.


      [ref1]: https://wetten.overheid.nl/BWBR0008412
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel320
    references:
      - id: ref1
        bwb_id: BWBR0008412
  - number: 3:21
    text: |-
      1 De afdeling Organisatie en Kwaliteit Rijksdienst (OKR) staat onder leiding van een hoofd en een plaatsvervangend
      hoofd.

      2 De afdeling heeft tot taak het bevorderen van de kwaliteit van de organisatie en van het functioneren van de
      Rijksdienst.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel321
  - number: 3:22
    text: |-
      1 Het directoraat-generaal Koninkrijksrelaties en Bestuur staat onder leiding van een directeur-generaal en een
      plaatsvervangend directeur-generaal, tevens directeur van een van de directies, genoemd in het derde lid.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van de
      hoofddoelstellingen van het ministerie, voorzover deze betreffen:

      a) het bevorderen van een doelmatig, doeltreffend en democratisch openbaar bestuur, waaronder begrepen
      de identiteitsinfrastructuur en de relaties met de overige onderdelen van het koninkrijk, de EU en andere
      internationale instellingen;

      b) het zorgdragen voor een optimale sturing en coördinatie van de samenwerking van de activiteiten van het
      ministerie op Europees en internationaal niveau;

      c) het zorgdragen voor goede relaties met en coördinatie van de samenwerking met de Nederlandse Antillen en Aruba;

      d) het zorgdragen voor een goede en adequate organisatie en wetgeving met betrekking tot het Nederlandse
      openbaar bestuur, o.a. met betrekking tot de financiën van gemeenten en provincies (het Gemeentefonds en het
      Provinciefonds);

      e) het zorgdragen voor een effectief grotestedenbeleid en in overleg met de overige ministeries zorgdragen voor
      goede interbestuurlijke relaties, beredeneerd vanuit de eigenstandige positie van provincies en gemeenten;

      f) het zorgdragen voor een goed GBA-stelsel en voor een goed functionerend reisdocumentenstelsel en het daarbij
      behorende persoonsinformatiebeleid;

      3 Het directoraat-generaal bestaat uit de volgende dienstonderdelen:

      a) het stafbureau Constitutionele Zaken en Koninkrijksrelaties (SCZK);

      b) het stafbureau Openbaar Bestuur (SOB);

      c) de directie Koninkrijksrelaties (KR);

      d) de directie Grotestedenbeleid en Interbestuurlijke Betrekkingen (GSIB);

      e) de directie Bestuurlijke en Financiële Organisatie (BFO);

      f) de directie Coördinatie Internationaal Beleid (CIB);

      g) het agentschap Basisadministratie Persoonsgegevens en Reisdocumenten (BPR);

      h) de Vertegenwoordiging van het ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie (PVEU);

      i) de Vertegenwoordiging van Nederland in Aruba (VNO);

      j) de Vertegenwoordiging van Nederland in de Nederlandse Antillen (VNW);

      k) de afdeling Kabinetszaken (KZ).
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel322
  - number: 3:23
    text: |-
      1 De stafafdeling Constitutionele Zaken en Koninkrijksrelaties staat onder leiding van een hoofd.

      2 De stafafdeling heeft tot taak:

        - het ondersteunen bij de uitvoering van de beleids- en beheertaken van de directeur-generaal Koninkrijksrelaties
      en Bestuur voor de directie Koninkrijksrelaties, de directie Coördinatie Internationaal Beleid, de
      Vertegenwoordigingen van Nederland in de Nederlandse Antillen en in Aruba, de Vertegenwoordiging van het Ministerie
      bij de Permanente Vertegenwoordiging van Nederland bij de Europese Unie en de stafafdeling Constitutionele Zaken
      en Koninkrijksrelaties;
        - het ondersteunen bij de uitvoering van de beleids- en beheertaken van de plaatsvervangend secretaris-generaal
      voor de directie Constitutionele Zaken en Wetgeving;
        - Het ontwikkelen van een directieoverstijgende beleidsstrategie, het bevorderen van de algemene
      beleidscoördinatie, het stimuleren en coördineren van de primair bij de beleidsdirecties liggende
      beleidsevaluatietaak.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel323
  - number: 3:24
    text: |-
      1 Het stafbureau Openbaar Bestuur staat onder leiding van een hoofd.

      2 Het stafbureau heeft tot taak:

        - het ondersteunen bij de uitvoering van de beleids- en beheertaken van de directeur-generaal Koninkrijksrelaties
      en Bestuur voor de directie Grote Stedenbeleid en Interbestuurlijke Betrekkingen, de directie Bestuurlijke en
      Financiële Organisatie (met uitzondering van de afdeling Organisatie en Kwaliteit Rijksdienst), het agentschap
      Basisadministratie Persoonsgegevens en Reisdocumenten, de afdeling Kabinetszaken en het stafbureau Openbaar
      Bestuur;
        - het ondersteunen bij de uitvoering van de beleids- en beheertaken van de directeur-generaal Management Openbare
      Dienst voor de directie Informatiebeleid Openbare Sector, de afdeling Organisatie en Kwaliteit Rijksdienst en het
      agentschap Central Archief Selectiedienst.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel324
  - number: 3:25
    text: |-
      1 De directie Koninkrijksrelaties staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het ontwikkelen van het samenwerkingsbeleid in algemene zin respectievelijk van het Nederlands beleid met
      betrekking tot de samenwerkingsrelatie met de Nederlandse Antillen en Aruba;

      b) de ontwikkeling, coördinatie en uitvoering van de samenwerking en het onderhouden van betrekkingen met de
      Nederlandse Antillen en Aruba;

      c) het coördineren van het beleid van de ministeries die Koninkrijkstaken vervullen.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel325
  - number: 3:26
    text: |-
      1 De directie Grotestedenbeleid en Interbestuurlijke Betrekkingen staat onder leiding van een directeur en een
      plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het coördineren van het intra- en interdepartementale beleid met betrekking tot de grote steden;

      b) het toezien op een heldere verantwoordelijkheidsverdeling tussen rijk, provincies en gemeenten en het bevorderen
      van de samenwerking tussen overheidslagen.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel326
  - number: 3:27
    text: |-
      1 De directie Bestuurlijke en Financiële Organisatie staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft tot taak het ontwikkelen van beleid en wetgeving met betrekking tot de inrichting, werking en
      financiering van het binnenlands bestuur, in het bijzonder de provincies en gemeenten.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel327
  - number: 3:28
    text: |-
      1 De directie Coördinatie Internationaal Beleid staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft de volgende taken:

      a) het binnen het ministerie coördineren en zorgdragen voor een eenduidige opstelling van het ministerie in de
      Europese en internationale aangelegenheden;

      b) het vertegenwoordigen van het ministerie in het algemeen coördinerende interdepartementale Europees en
      internationaal overleg;

      c) het adviseren van de ambtelijke en politieke leiding van het ministerie inzake Europese en internationale
      aangelegenheden;

      d) het initiëren van de beleidsontwikkeling en het stellen van prioriteiten ten aanzien van Europese en
      internationale aangelegenheden van het ministerie;

      e) het ten behoeve van voornoemde taken onderhouden van de primaire contacten van het ministerie met de Europese
      Commissie, internationale organisaties die voor het ministerie van belang zijn, de permanente Vertegenwoordiging
      van Nederland bij de EU te Brussel en alle overige bilaterale contacten die voortvloeien uit de werkzaamheden van
      de directie;

      f) het fungeren als eerste aanspreekpunt naar buiten toe voor Europese en internationale aangelegenheden;

      g) het zorgdragen voor een goede informatie- en communicatiestructuur in het ministerie inzake Europese en overige
      internationale aangelegenheden;

      h) het op de hoogte zijn en geïnformeerd worden over alle Europese en internationale aangelegenheden van het
      ministerie;

      i) het behartigen van Europese en internationale zaken waarvoor niet een ander dienstonderdeel van het ministerie
      als primair verantwoordelijk is aangewezen (algemene en dienstoverstijgende onderwerpen).
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel328
  - number: 3:29
    text: |-
      1 Het agentschap Basisadministratie Persoonsgegevens en Reisdocumenten staat onder leiding van een directeur en een
      plaatsvervangend directeur.

      2 Het agentschap is belast met taken met betrekking tot:

      a) de instandhouding van de gemeentelijke basisadministratie persoonsgegevens;

      b) het beleid inzake reisdocumenten en de uitvoering van de [Paspoortwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005212
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel329
    references:
      - id: ref1
        bwb_id: BWBR0005212
  - number: 3:30
    text: |-
      1 De Vertegenwoordiging van het ministerie bij de Permanente Vertegenwoordiging van het Koninkrijk der Nederlanden
      bij de Europese Unie staat onder leiding van een ambassaderaad.

      2 De Vertegenwoordiging heeft de volgende taken:

      a) het behartigen van de belangen van het ministerie bij de Europese Unie;

      b) het ondersteunen van de Permanente Vertegenwoordiger van Nederland bij de Europese Unie met betrekking tot
      aangelegenheden die het ministerie aangaan;

      c) het voorbereiden ter plaatse van, het deelnemen aan en het rapporteren over Europese overleggen.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel330
  - number: 3:31
    text: |-
      1 De Vertegenwoordiging van Nederland in Aruba staat onder leiding van een Vertegenwoordiger en een
      plaatsvervangend Vertegenwoordiger.

      2 De Vertegenwoordiging heeft de volgende taken (koninklijk besluit van 24 april 1997, regelende de positie
      en functie van Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen
      onderscheidenlijk Aruba):

      a) het optreden als vertegenwoordiger van de Nederlandse regering bij de regering van Aruba;

      b) het onderhouden van contacten met de regering van Aruba, alsmede met andere autoriteiten van Aruba;

      c) het informeren van de ministers en de ambtelijke leiding van het ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in Aruba;

      d) het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en
      andere autoriteiten aan Aruba.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel331
  - number: 3:32
    text: |-
      1 De Vertegenwoordiging van Nederland in de Nederlandse Antillen staat onder leiding van een Vertegenwoordiger en
      een plaatsvervangend Vertegenwoordiger.

      2 De Vertegenwoordiging heeft de volgende taken (koninklijk besluit van 24 april 1997, regelende de positie
      en functie van Vertegenwoordiger van de Nederlandse regering bij de regering van de Nederlandse Antillen
      onderscheidenlijk Aruba):

      a) het optreden als vertegenwoordiger van de Nederlandse regering bij de regering en de eilandbesturen van de
      Nederlandse Antillen;

      b) het onderhouden van contacten met de regering en de eilandbesturen, alsmede met andere autoriteiten in de
      Nederlandse Antillen;

      c) het informeren van de ministers en de ambtelijke leiding van het ministerie over de politieke, bestuurlijke,
      financiële, maatschappelijke en sociaal-economische ontwikkelingen in de Nederlandse Antillen;

      d) het voorbereiden en begeleiden van bezoeken van Nederlandse ministers en staatssecretarissen, bestuurders en
      andere autoriteiten aan de Nederlandse Antillen.

      e) het zorgdragen voor het monitoren van afspraken in het kader van het samenwerkingsbeleid.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel332
  - number: 3:33
    text: |-
      1 De afdeling Kabinetszaken staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De afdeling heeft de volgende taken:

      a) het voorbereiden van de benoeming en het ontslag van burgemeesters en commissarissen van de Koningin;

      b) het uitvoeren van beleid en regelgeving inzake de rechtspositie van burgemeesters en commissarissen van de
      Koningin en het ontwikkelen van personeelsbeleid voor burgemeesters;

      c) het ontwikkelen en uitvoeren van beleid betreffende koninklijke onderscheidingen en het behandelen van zaken met
      betrekking tot de Kanselarij der Nederlandse Orden en het Kapittel voor de Civiele Orden;

      d) het voorbereiden van de benoeming en het ontslag van de leden van de Algemene Rekenkamer, de Raad van State, de
      Hoge Raad van Adel en het Kapittel voor de Civiele Orden;

      e) het uitvoeren van de [Wet op de Adeldom][ref1] en het behandelen van zaken met betrekking tot de Hoge Raad van
      Adel.


      [ref1]: https://wetten.overheid.nl/BWBR0006667
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel333
    references:
      - id: ref1
        bwb_id: BWBR0006667
  - number: 3:34
    text: |-
      1 Het directoraat-generaal Openbare Orde en Veiligheid staat onder leiding van een directeur-generaal en een
      plaatsvervangend directeur-generaal.

      2 Het directoraat-generaal heeft tot taak al datgene te verrichten dat dienstig is ter verwezenlijking van de
      hoofddoelstellingen van het ministerie, voorzover deze het bevorderen van de openbare orde en veiligheid betreffen.

      3 Het directoraat-generaal bestaat uit de volgende dienstonderdelen:

      a) het stafbureau Openbare Orde en Veiligheid (SOOV);

      b) de directie Politie (POL);

      c) de directie Rampenbeheersing en Brandweer (RB);

      d) de directie Veiligheid, Informatiebeleid en Projecten (VIP);

      e) het Nationaal Coördinatiecentrum (NCC);

      f) het agentschap Informatie- en communicatietechnologie Organisatie (ITO);

      g) het agentschap Korps landelijke politiediensten (KLPD);

      h) het bureau Korpsbeheer en relatiebeheer agentschappen (KOBRA);

      i) het bureau Landelijk Management Development Politie en Brandweer;

      j) de Eenheid Beveiliging en Bewaking.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel334
  - number: 3:35
    text: |-
      1 Het stafbureau Openbare Orde en Veiligheid staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 Het stafbureau heeft tot taak het ondersteunen van de directeur-generaal en de dienstonderdelen van het
      directoraat-generaal Openbare Orde en Veiligheid bij de uitvoering van de beleids- en beheertaken.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel335
  - number: 3:36
    text: |-
      1 De directie Politie staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het onderhouden van het bestuurlijk-juridische bestel waarbinnen politie en veiligheidszorg gestalte krijgen;

      b) de zorg voor de instandhouding en uitvoering van een budgetverdeelsysteem en het uitoefenen van het financieel
      toezicht op de politie;

      c) de zorg voor het beheer op afstand van de politie en het stellen van regels hierover;

      d) de zorg voor een adequate informatievoorziening over het beheer in algemene zin;

      e) het bijdragen aan de kwaliteit, efficiency en effectiviteit van de politiezorg;

      f) het bijdragen aan en het bevorderen van de kwaliteit en kwantiteit van het politiepersoneel;

      g) het vervullen van een primaire rol bij of het verlenen van bijstand bij door de directeur-generaal aangewezen
      wetgevingsprojecten;

      h) het bevorderen van de internationale samenwerking op het terrein van politie, openbare orde en veiligheidsbeleid
      en de handhaving van de internationale rechtsorde.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel336
  - number: 3:37
    text: |-
      1 De directie Rampenbeheersing en Brandweer staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft de volgende taken:

      a) het ontwikkelen, voorbereiden en coördineren van nationaal en internationaal beleid inzake brandweerzorg,
      rampenbestrijding en crisisbeheersing;

      b) het ontwikkelen en uitvoeren van veiligheidsbeleid;

      c) het bijdragen aan en het bevorderen van de kwaliteit van de brandweer- en rampenbestrijdingsorganisatie alsmede
      het personeel en materieel daarvan;

      d) het ontwikkelen en uitvoeren van een management-developmentbeleid voor brandweerofficieren;

      e) het opstellen en onderhouden van nationale en internationale wet- en regelgeving inzake brandweerzorg,
      rampenbestrijding en crisisbeheersing.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel337
  - number: 3:38
    text: |-
      1 De directie Veiligheid, Informatiebeleid en Projecten staat onder leiding van een directeur en een
      plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het ontwikkelen en uitvoeren van integraal veiligheidsbeleid;

      b) het voeren van het inhoudelijk secretariaat van de Raad voor Justitie, Bestuur en Veiligheid en van de
      Interdepartementale Commissie voor Veiligheid en Rechtshandhaving;

      c) het ontwikkelen en uitvoeren van strategisch onderzoek over openbare orde en veiligheid;

      d) het ontwikkelen en uitvoeren van strategisch beleid voor de informatievoorziening ten behoeve van de politie-
      en brandweerorganisatie;

      e) het mede voeren van het inhoudelijk secretariaat van de tijdelijke Regieraad Informatie en Communicatie
      Technologie Politie;

      f) het opzetten en uitvoeren van projecten met betrekking tot openbare orde en veiligheid.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel338
  - number: 3:39
    text: |-
      1 Het Nationaal Coördinatiecentrum staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 Het Nationaal Coördinatiecentrum heeft de volgende taken:

      a) het bijstaan van de minister in de uitoefening van diens bevoegdheden en verantwoordelijkheden met betrekking
      tot openbare orde en veiligheid;

      b) het coördineren van het overheidsoptreden onder crisisomstandigheden of de dreiging daarvan;

      c) het mede-ontwikkelen en uitvoeren van een crisisbeheersingsbeleid ter voorbereiding van de Rijksoverheid op
      crisisomstandigheden en van het algemene openbare orde- en veiligheidsbeleid;

      d) het adviseren over en het coördineren van openbare orde en veiligheidsmaatregelen met betrekking tot
      staatsbezoeken, andere bezoeken van buitenlandse hoge gasten, alsmede in overige gevallen.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel339
  - number: 3:40
    text: |-
      1 Het agentschap Informatie- en communicatietechnologie Organisatie staat onder leiding van een algemeen directeur
      en een operationeel directeur, tevens plaatsvervangend directeur.

      2 Het agentschap heeft de volgende taken:

      a) het verrichten van werkzaamheden met betrekking tot de informatie- en communicatiehuishouding en het beheer
      daarvan ten behoeve van de taakuitvoering en het beheer van de politie, waaronder het ontwikkelen en beheren van de
      infrastructuren en de informatie- en communicatiesystemen ten behoeve van de politie;

      b) het desgevraagd verrichten van werkzaamheden op het terrein van de informatie- en communicatiehuishouding en het
      beheer daarvan ten behoeve van een regionaal politiekorps of het Korps landelijke politiediensten, indien dit naar
      het oordeel van de minister noodzakelijk is voor de taakuitvoering van de politie;

      c) het desgevraagd verrichten van werkzaamheden op het terrein van de informatie- en communicatiehuishouding en
      het beheer daarvan ten behoeve van een tot de Rijksdienst behorende dienst, een regionaal brandweerkorps of een
      centrale post voor het ambulancevervoer, indien dit naar het oordeel van de minister noodzakelijk is voor de
      taakuitvoering van de politie.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel340
  - number: 3:41
    text: |-
      1 Het agentschap Korps landelijke politiediensten staat onder leiding van een korpschef en een plaatsvervangend
      korpschef.

      2 Het agentschap is belast met de taken, bedoeld in [artikel 38 van de Politiewet 1993][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel38
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel341
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: '38'
  - number: 3:42
    text: |-
      1 Het bureau Korpsbeheer en relatiebeheer agentschappen staat onder leiding van een hoofd en een plaatsvervangend
      hoofd.

      2 Het bureau heeft de volgende taken:

      a) het adviseren en ondersteunen van de directeur-generaal bij de uitvoering van diens taken als gemandateerd
      beheerder van het Korps landelijke politiediensten en als beheerder van het agentschap Informatie- en
      communicatietechnologie Organisatie;

      b) het faciliteren van het Korps landelijke politiediensten en het agentschap Informatie- en
      communicatietechnologie Organisatie in de relatie met de beheerder;

      c) het faciliteren van de beleidsbepaling en kaderstelling ten aanzien van het Korps landelijke politiediensten en
      het agentschap Informatie- en communicatietechnologie Organisatie;

      d) het faciliteren van het Korps landelijke politiediensten en het agentschap Informatie- en
      communicatietechnologie Organisatie in de relaties met het ministerie.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel342
  - number: 3:43
    text: |-
      1 Het bureau Landelijk Management Development politie en brandweer staat onder leiding van een hoofd en een
      plaatsvervangend hoofd.

      2 Het bureau heeft de volgende taken:

      a) het samen met het politieveld en het brandweerveld vormgeven, ontwikkelen en uitvoeren van het landelijk
      management developmentbeleid voor de politie en brandweer en daarbij behorende instrumenten, in afstemming met het
      regionaal beleid;

      b) het realiseren van een landelijke infrastructuur van het management development voor de politie en brandweer;

      c) het zorgdragen voor de voorbereiding van en advisering omtrent Kroonbenoemingen bij de politie;

      d) het adviseren omtrent benoemingen in de strategische top van de brandweer.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel343
  - number: 3:43a_bis
    text: |-
      1 De Eenheid Bewaking en Beveiliging staat onder leiding van een Nationaal Coördinator Bewaking en Beveiliging en
      een plaatsvervangend Nationaal Coördinator Bewaking en Beveiliging.

      2 De Eenheid Bewaking en Beveiliging heeft de volgende taken:

      a. de ontwikkeling, implementatie, beheer en evaluatie van het integraal bewakings- en beveiligingsbeleid;

      b. het inzamelen en evalueren van informatie van de diensten (politiekorpsen, Algemene Inlichtingen- en
      Veiligheidsdienst, Militaire Inlichtingen- en Veiligheidsdienst, Beveiligingsambtenaren) ten behoeve van dreigings-
      en risico-analyses;

      c. het verzorgen van het voorzitterschap en het secretariaat van de Evaluatie Driehoek, van het Afstemmingsoverleg
      Bewaking en Beveiliging en van het Uitvoeringsoverleg;

      d. het zorgdragen voor communicatie met (potentieel) bedreigde personen en instanties;

      e. het geven van opdrachten en adviezen inzake bewaking en beveiliging aan onder meer regionale politiekorpsen,
      Koninklijke marechaussee, Korps Landelijke Politie Diensten, Dienst Koninklijke en Diplomatieke Beveiliging, en het
      monitoren van de uitvoering;

      f. het adviseren en begeleiden van het decentraal domein inzake bewaking en beveiliging;

      g. kwaliteitsborging en innovatie van het proces van bewaken en beveiligen, in het bijzonder op het vlak van de
      uitvoering (technische en technologische maatregelen).
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel343a
  - number: 3:44
    text: |-
      1 De Algemene Inlichtingen- en Veiligheidsdienst staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De Algemene Inlichtingen- en Veiligheidsdienst heeft de taken, bedoeld in
      [artikel 6 van de Wet op de inlichtingen- en veiligheidsdiensten 2002][ref1].

      3 De Algemene Inlichtingen- en Veiligheidsdienst bestaat uit de volgende dienstonderdelen:

      a) de directie Democratische Rechtsorde (DRO);

      b) de directie Staatsveiligheid (SV);

      c) de directie Beveiliging (BC);

      d) de directie Bijzondere Inlichtingenmiddelen (BI);

      e) de directie Bedrijfsvoering (BV);

      f) de directie Strategie en Juridische Zaken (SJZ);

      g) de directie Inlichtingen Buitenland (IB);


      [ref1]: https://wetten.overheid.nl/BWBR0013409#Artikel6
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel344
    references:
      - id: ref1
        bwb_id: BWBR0013409
        artikel: '6'
  - number: 3:45
    text: |-
      1 De directie Democratische Rechtsorde staat onder leiding van een directeur.

      2 De directie heeft tot taak het verrichten van onderzoek naar personen en organisaties die een bedreiging kunnen
      vormen voor de democratische rechtsorde, de veiligheid van de Staat of andere gewichtige belangen van de Staat,
      aangaande:

      a) tegenkrachten bij integratie;

      b) terrorisme;

      c) politiek (gewelddadig) activisme.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel345
  - number: 3:46
    text: |-
      1 De directie Staatsveiligheid staat onder leiding van een directeur.

      2 De directie heeft tot taak het verrichten van onderzoek naar personen en organisaties die een bedreiging kunnen
      vormen voor de democratische rechtsorde, de veiligheid van de Staat of andere gewichtige belangen van de Staat,
      aangaande:

      a) ongewenste bemoeienis van vreemde mogendheden;

      b) bedreiging internationale rechtsorde;

      c) integriteitsaantastingen.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel346
  - number: 3:47
    text: |-
      1 De directie Beveiliging staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a) het bevorderen van de beveiliging van gegevens waarvan de geheimhouding door het belang van de Staat wordt
      geboden;

      b) het bevorderen van de beveiliging van onderdelen van overheid en bedrijfsleven die van vitaal belang zijn voor
      de instandhouding van het maatschappelijk leven;

      c) het bevorderen van de beveiliging van verbindingen waarmee gegevens worden verzonden waarvan de geheimhouding
      door het belang van de Staat wordt geboden;

      d) het verrichten van veiligheidsonderzoeken naar personen die vertrouwensfuncties vervullen of gaan vervullen bij
      overheid en bedrijfsleven;

      e) het begeleiden van preventieve integriteitonderzoeken en het behandelen van meldingen over aantastingen van de
      integriteit bij de overheid.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel347
  - number: 3:48
    text: |-
      1 De directie Bijzondere Inlichtingenmiddelen staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a) het toegankelijk maken en ontsluiten van open bronnen en open bronnen informatie;

      b) leveren van bijzondere operationele informatie en diensten;

      c) het verzorgen van de relaties met buitenlandse inlichtingen- en veiligheidsdiensten.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel348
  - number: 3:49
    text: |-
      1 De directie Bedrijfsvoering staat onder leiding van een directeur.

      2 De directie heeft tot taak het ondersteunen van de organisatie op facilitair gebied, het geven van
      managementadvies en het leveren van centrale voorzieningen.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel349
  - number: 3:50
    text: |-
      1 De directie Strategie en Juridische Zaken staat onder leiding van een directeur.

      2 De directie heeft de volgende taken:

      a) het ondersteunen van de dienstleiding en het managementteam van de Algemene Inlichtingen- en Veiligheidsdienst;

      b) het ontwikkelen en bewaken van de strategische koers, juridische en parlementaire aangelegenheden en de interne
      en externe communicatie.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel350
  - number: 3:51
    text: |-
      1 De directie Inlichtingen Buitenland staat onder leiding van een directeur.

      2 De directie verricht de inlichtingentaak met betrekking tot het buitenland.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel351
  - number: 3:52
    text: |-
      1 Het Bureau Algemene Bestuursdienst staat onder leiding van een directeur-generaal en een plaatsvervangend
      directeur-generaal.

      2 Het bureau heeft de volgende taken:

      a) het adviseren van ministers en secretarissen-generaal over de benoeming van ambtenaren in functies als lid van
      de Algemene Bestuursdienst;

      b) het leiden van de selectieprocedure, het vaststellen van een voorselectie van kandidaten en het uitvoeren van de
      taken inzake aanstelling, benoeming en ontslag van ambtenaren als lid van de topmanagementgroep, ter vervulling van
      de functies van secretaris-generaal, van directeur-generaal en van enkele vergelijkbare functionarissen;

      c) het verzorgen van werkgeverstaken (waaronder het opdragen van passende werkzaamheden, het zoeken naar
      een aansluitende vervolgbenoeming, dan wel het begeleiden bij outplacement) ten aanzien van leden van de
      topmanagementgroep, in geval diens benoeming in een functie genoemd onder b) is geëindigd;

      d) het ontwikkelen en uitvoeren van management developmentbeleid voor de leden van de Algemene Bestuursdienst,
      inclusief het in samenspraak met ministeries ontwikkelen van activiteiten ten behoeve van de borging van de in- en
      doorstroom in de Algemene Bestuursdienst;

      e) het in samenspraak met ministeries vaststellen van kwaliteitseisen ten behoeve van functies binnen de Algemene
      Bestuursdienst;

      f) het ontwikkelen van activiteiten ten behoeve van de borging van toekomstige instroom in de Algemene
      Bestuurdienst;

      g) het ontwikkelen van beleid ter bevordering van mobiliteit tussen de Algemene Bestuursdienst en andere
      (overheids)instellingen, Nederlandse ambtenaren bij de EU en andere internationale organisaties;

      h) het verstrekken van adviezen inzake individuele loopbaanontwikkeling en management-development, alsmede de
      coördinatie van werkafspraken, coaching en counseling ten behoeve van leden van de Algemene Bestuursdienst;

      i) het bevorderen van onderlinge bekendheid en betrokkenheid van de leden van de Algemene Bestuursdienst;

      j) het adviseren over de uitvoering van het beleid met betrekking tot de Algemene Bestuursdienst;

      k) het ontwikkelen van strategisch beleid met betrekking tot de vorming van de Algemene Bestuursdienst;

      l) het leveren van bijdragen aan het te ontwikkelen management- en personeelsbeleid voor de gehele rijksdienst.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel352
  - number: 3:53
    text: |-
      1 De Inspectie Openbare Orde en Veiligheid staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 De inspectie heeft de taken, bedoeld in [artikel 53a van de Politiewet 1993][ref1] en
      [artikel 19 van de Brandweerwet 1985][ref2], en andere bij wet opgedragen taken.

      3 De inspectie bestaat uit de volgende onderdelen:

      a) de clusters Brandweerzorg, Rampenbestrijding, Politiezorg en Politie-onderwijs;

      b) het stafbureau Inspectie Openbare Orde en Veiligheid (SIOOV).


      [ref1]: https://wetten.overheid.nl/BWBR0006299#Artikel53a
      [ref2]: https://wetten.overheid.nl/BWBR0003764#Artikel19
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel353
    references:
      - id: ref1
        bwb_id: BWBR0006299
        artikel: 53a
      - id: ref2
        bwb_id: BWBR0003764
        artikel: '19'
  - number: 3:54
    text: |-
      1 Het stafbureau Inspectie Openbare Orde en Veiligheid staat onder leiding van een hoofd.

      2 Het stafbureau heeft tot taak het ondersteunen van het hoofd van de inspectie en de onderdelen van de inspectie
      bij de uitvoering van de beleids- en beheerstaken.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel354
  - number: 4:1
    text: |-
      Tot de taak van de Centrale Stafdiensten, de directoraten-generaal, de Algemene Inlichtingen- en Veiligheidsdienst
      en de Inspectie Openbare Orde en Veiligheid behoort voorts de uitvoering van andere taken dan hiervoor genoemd,
      in opdracht van een minister of de secretaris-generaal, voor zover hogere wet- en regelgeving zich daartegen niet
      verzet.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel41
  - number: 4:2
    text: |-
      1 De secretaris-generaal stelt met inachtneming van dit besluit de inrichting van de onder de plaatsvervangend
      secretaris-generaal, de directeuren-generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst en het
      hoofd van de Inspectie Openbare Orde en Veiligheid ressorterende dienstonderdelen voor zover nodig nader vast.

      2 De vaststelling, bedoeld in het eerste lid, geschiedt bij schriftelijk besluit op voordracht van de
      plaatsvervangend secretaris-generaal, de directeur-generaal, het hoofd van de Algemene Inlichtingen- en
      Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid, ieder voor zover het hem aangaat, na
      advisering door de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel42
  - number: 4:3
    text: |-
      1 De directeur Personeel en Organisatie is belast met het beheer van dit besluit.

      2 De secretaris-generaal, de plaatsvervangend secretaris-generaal, de directeuren-generaal, het hoofd van de
      Algemene Inlichtingen- en Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid, ieder voor
      zover het hem aangaat, zijn verantwoordelijk voor een juiste, volledige en tijdige aanlevering aan de directeur
      Personeel en Organisatie van de gegevens die een goed beheer van dit besluit mogelijk maken.

      3 Het beheer en de aanlevering van gegevens geschieden met inachtneming van de desbetreffende (richtlijnen inzake)
      administratieve organisatiebeschrijvingen.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel43
  - number: 4:4
    text: |-
      Wijziging van dit besluit is voorbehouden aan de Minister van Binnenlandse Zaken en Koninkrijksrelaties, in
      overeenstemming met de Minister voor Bestuurlijke Vernieuwing en Koninkrijksrelaties, en geschiedt op voordracht
      van de directeur Personeel en Organisatie.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel44
  - number: 4:5
    text: |-
      Dit besluit treedt in werking met ingang van de tweede dag na plaatsing van dit besluit in de Staatscourant en
      werkt terug tot en met 1 september 2003.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel45
  - number: 4:6
    text: 'Dit besluit wordt aangehaald als: Organisatiebesluit BZK 2003.'
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel46
  - number: 4:7
    text: |-
      1 De volgende besluiten worden ingetrokken:

        - [Organisatiebesluit BZK van 13 december 2001][ref1];
        - Organisatiebesluit DGCZK van 25 januari 2002;
        - Organisatiebesluit DGOB van 25 januari 2002;
        - Organisatiebesluit DGMP van 25 januari 2002;

      2 Na inwerkingtreding van het Organisatiebesluit BZK 2003 berust het besluit
      [Algemene Inlichtingen- en Veiligheidsdienst (Organisatiebesluit AIVD)][ref2] op
      [artikel 4:2 van dit besluit][ref3].


