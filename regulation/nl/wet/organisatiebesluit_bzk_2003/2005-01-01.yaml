  - number: 3:2
    text: |-
      1 De Centrale Stafdiensten staan onder leiding van de plaatsvervangend secretaris-generaal en een loco
      plaatsvervangend secretaris-generaal, tevens directeur van een van de directies, genoemd in het derde lid.

      2 De Centrale Stafdiensten hebben tot taak het ondersteunen van de Algemene Leiding bij het aansturen en het
      coördineren van de bedrijfsvoering van het ministerie.

      3 De Centrale Stafdiensten bestaan uit de volgende dienstonderdelen:

      a) het stafbureau Centrale Stafdiensten (SCS);

      b) het Bureau Secretaris-Generaal (BSG);

      c) de directie Informatievoorziening (I);

      d) de directie Financieel-Economische Zaken (FEZ);

      e) de directie Personeel en Organisatie (P&O);

      f) de Auditdienst (AD);

      g) de directie Voorlichting en Communicatie (VLC);

      h) de directie Facilitaire Zaken (FAZ);

      i) de directie Constitutionele Zaken en Wetgeving (CZW);

      j) de projectdirectie Nieuwe Huisvesting (PNH);

      k) het gemeenschappelijke secretariaat van de Raad voor het openbaar bestuur en de Raad voor de financiële
      verhoudingen (SRob/Rfv).
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel32
  - number: 3:3
    text: |-
      1 Het stafbureau Centrale Stafdiensten staat onder leiding van een hoofd.

      2 Het stafbureau heeft tot taak het ondersteunen van de plaatsvervangend secretaris-generaal en de dienstonderdelen
      van de Centrale Stafdiensten, met uitzondering van de directie Constitutionele Zaken en Wetgeving, bij de
      uitvoering van de beleids- en beheertaken.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel33
  - number: 3:4
    text: |-
      1 Het Bureau Secretaris-Generaal staat onder leiding van een hoofd en een plaatsvervangend hoofd.

      2 Het bureau heeft de volgende taken:

      a) het beheers- en beleidsmatig ondersteunen en adviseren van de Algemene Leiding en de ministers;

      b) het voeren van het secretariaat van ministeriebrede overleggen;

      c) het coördineren van aangelegenheden met betrekking tot het parlement of de ministerraad;

      d) het ondersteunen van de secretaris-generaal in diens taken en verantwoordelijkheden met betrekking tot de
      beveiliging van het ministerie;

      e) het coördineren en bevorderen van strategische kennisontwikkeling.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel34
  - number: 3:5
    text: |-
      1 De directie Informatievoorziening staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft tot taak het ondersteunen van de primaire (beleids)processen van het ministerie door middel
      van het ongestoord laten functioneren van infrastructurele voorzieningen, het inzetten van kennis en advies over
      informatievoorziening in brede zin en het inzetten van informatie- en communicatietechnologie daarbij in het
      bijzonder.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel35
  - number: 3:6
    text: |-
      1 De directie Financieel-Economische Zaken staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft de taken, bedoeld in:

      a) [artikel 21 van de Comptabiliteitswet][ref1];

      b) het [Besluit taak FEZ][ref2];

      c) [artikel 3, zevende lid, van het Beheersbesluit KABGNA/KABGA 1998][ref3].

      3 Voor zover dit uit de taken voortvloeit, rapporteert de directeur in afwijking van
      [artikel 3:2, eerste lid][ref4], rechtstreeks aan de secretaris-generaal van het ministerie.


