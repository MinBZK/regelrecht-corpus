  - number: 3:11
    text: |-
      1 De directie Constitutionele Zaken en Wetgeving staat onder leiding van een directeur en een plaatsvervangend
      directeur.

      2 De directie heeft de volgende taken:

      a) de zorg voor het [Statuut van het Koninkrijk der Nederlanden][ref1];

      b) de herziening van de [Grondwet][ref2] en het voorbereiden van wetgeving met een sterk constitutionele grondslag;

      c) het toetsen van regelingen, met inbegrip van conceptverdragen, en bestuur aan de [Grondwet][ref3] en aan
      verdragsbepalingen met constitutionele aspecten;

      d) het voorbereiden van de wetgeving over de Hoge Colleges van Staat en over rechtsbescherming in ruime zin;

      e) het vervullen van een primaire rol bij door de minister aangewezen wetgevingsprojecten;

      f) het medebehandelend van alle aangelegenheden inzake de totstandkoming van wet- en regelgeving van het
      ministerie;

      g) het behandelen van constitutionele vraagstukken op het terrein van het kiesrecht;

      h) het voeren van het secretariaat van de Kiesraad;

      i) het coördineren van Europeesrechtelijke aangelegenheden;

      j) het behandelen van bijzondere opdrachten van een minister of de Algemene Leiding, civielrechtelijke kwesties en
      andere juridische aangelegenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002154
      [ref2]: https://wetten.overheid.nl/BWBR0001840
      [ref3]: https://wetten.overheid.nl/BWBR0001840
