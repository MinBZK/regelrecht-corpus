preamble:
  text: |-
    Gelet op artikel 2, eerste lid, van het Coördinatiebesluit inrichting organisatie en formatie rijksdienst;

    Gezien het advies van de Groepsondernemingsraad;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#ArtikelAanhef
articles:
  - number: 1:1
    text: |-
      In dit besluit wordt verstaan onder:

        - ministerie: het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;
        - minister: de Minister van Binnenlandse Zaken en Koninkrijksrelaties of de Minister voor Bestuurlijke Vernieuwing
      en Koninkrijksrelaties.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel11
  - number: 2:1
    text: |-
      1 De hoofdstructuur van het ministerie bestaat uit de volgende dienstonderdelen:

      a) de Algemene Leiding (ALGL);

      b) de Centrale Stafdiensten

      c) het directoraat-generaal Management Openbare Dienst (DGMOD);

      d) het directoraat-generaal Koninkrijksrelaties en Bestuur (DGKB);

      e) het directoraat-generaal Openbare Orde en Veiligheid (DGOOV);

      f) de Algemene Inlichtingen- en Veiligheidsdienst (AIVD);

      g) het Bureau Algemene Bestuursdienst (BABD);

      h) de Inspectie Openbare Orde en Veiligheid (IOOV);

      i) het projectdirectoraat-generaal Programma Andere Overheid (pDGPAO).

      2 De Algemene Leiding ressorteert onder de minister.

      3 De overige in het eerste lid genoemde dienstonderdelen ressorteren onder de secretaris-generaal van het
      ministerie.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel21
  - number: 2:2
    text: |-
      1 Er is een Bestuursraad van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      2 De Bestuursraad is samengesteld uit de secretaris-generaal, de plaatsvervangend secretaris-generaal, de
      directeuren-generaal en het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst. De leden kunnen zich
      incidenteel laten vervangen door hun plaatsvervangers of in uitzonderlijke gevallen door een andere rechtstreeks
      onder hen ressorterende functionaris. De Inspectie Openbare Orde en Veiligheid kan in de Bestuursraad worden
      vertegenwoordigd door de secretaris-generaal.

      3 Het overleg in de Bestuursraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de
      onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van respectievelijk het bereiken van
      overeenstemming over de departementale beleids- en beheerskaders alsmede het toezien op de uitvoering van deze
      kaders.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      5 Het secretariaat van de Bestuursraad wordt gevoerd door het hoofd van het Bureau Secretaris-Generaal.

      6 De Bestuursraad regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel22
  - number: 2:3
    text: |-
      1 Er is een Centraal HRM-beraad van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Het Centraal HRM-beraad is samengesteld uit de secretaris-generaal, de plaatsvervangend secretaris-generaal, de
      directeuren-generaal, het hoofd van de Algemene Inlichtingen- en Veiligheidsdienst en de directeur Personeel en
      Organisatie. De leden kunnen zich incidenteel laten vervangen door hun plaatsvervangers. De Inspectie Openbare Orde
      en Veiligheid kan in het Centraal HRM-beraad vertegenwoordigd worden door de secretaris-generaal.

      3 Het overleg in het Centraal HRM-beraad heeft, onverminderd het bepaalde in de departementale mandaat- en
      volmachtbesluiten over de bevoegdheden van de afzonderlijke leden van de Bestuursraad ten aanzien van de
      onderwerpen die in het overleg aan de orde komen, ten doel het bespreken van respectievelijk het bereiken van
      overeenstemming over aspecten van het departementale personeelsbeleid en personele aangelegenheden alsmede het
      toezien op de uitvoering hiervan. In het overleg komen in ieder geval de volgende aangelegenheden aan de orde:

        - de beleidsontwikkeling van management-development bij het ministerie;
        - de benoeming van functionarissen in schaal 14 en hoger bij het ministerie;
        - de werkzaamheden van het Centraal HRM-beraad met betrekking tot de personeelsschouw, zoals aangegeven in het
      departementale beleid ter zake.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voor zover niet anders is besloten of uit de
      wet voortvloeit.

      5 Het secretariaat wordt gevoerd door de Centrale MD-functionaris van de directie Personeel en Organisatie.

      6 Het Centraal HRM-beraad regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel23
  - number: 2:4
    text: |-
      1 Er is een Audit Committee van het Ministerie van Binnenlandse Zaken en Koninkrijksrelaties.

      2 Het Audit Committee is samengesteld uit de leden van de Bestuursraad, de directeur Financieel-Economische Zaken
      en de directeur Auditdienst, danwel personen die deze leden vertegenwoordigen. Aan het Audit Committee is een
      externe deelnemer toegevoegd. De directeur Personeel en Organisatie, de directeur Informatievoorziening en de
      directeur Facilitaire Zaken kunnen worden uitgenodigd voor vergaderingen van het Audit Committee.

      3 Het Audit Committee vormt zich een oordeel over de opzet en werking van de bedrijfsvoeringfunctie, over het
      samenstel van de producten vanuit de DG-functie, control, audit en certificering; over het auditjaarplan, over
      uit te voeren onderzoeken en over de uitkomsten van bedrijfsvoeringonderzoeken en de controle. Het Audit Committee
      adviseert de SG over de maatregelen zo nodig moeten worden genomen.

      4 Al hetgeen in de vergaderingen aan de orde komt is vertrouwelijk, voorzover niet anders is besloten of uit de uit
      de wet voortvloeit.

      5 Het secretariaat wordt gevoerd door het hoofd Control Financieel Management van de directie Financieel-
      Economische Zaken.

      6 Het Audit Committee regelt de eigen werkwijze.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel24
  - number: 3:1
    text: |-
      1 De Algemene Leiding bestaat uit de secretaris-generaal en, voor zover het betreft de toepassing van
      [artikel 6:3 van het MV-besluit secretaris-generaal BZK][ref1] en de vervanging van de secretaris-generaal, de
      plaatsvervangend secretaris-generaal.

      2 De secretaris-generaal is belast met de ambtelijke leiding van het ministerie
      ([koninklijk besluit van 18 oktober 1988][ref2], Stb. 1988, 499, houdende regeling van de functie en
      verantwoordelijkheid van de secretaris-generaal).

      3 Tot de taak van de ambtelijke leiding, bedoeld in het tweede lid, behoort in ieder geval:

      a) het informeren en adviseren van de ministers over hen of het ministerie betreffende aangelegenheden;

      b) het zorgdragen voor de coördinatie en integratie van beleidsvoorbereiding, beleidsontwikkeling en
      beleidsuitvoering binnen het ministerie;

      c) het uitoefenen van de algemene controlfunctie bij het ministerie;

      d) het rechtstreeks leiding geven aan de plaatsvervangend secretaris-generaal, de directeuren-generaal, het hoofd
      van de Algemene Inlichtingen- en Veiligheidsdienst en het hoofd van de Inspectie Openbare Orde en Veiligheid;

      e) het voorzitterschap van de Bestuursraad, het Centraal HRM-beraad en het Audit Committee;

      f) het zorgdragen voor, het nemen van besluiten over en het geven van algemene aanwijzingen ten aanzien van het
      algemene beleid en beheer inzake de bedrijfsvoering en de formatie van het ministerie;

      g) het voeren van overleg met de Groepsondernemingsraad en de centrales van verenigingen van ambtenaren, bedoeld in
      [artikel 113 van het Algemeen Rijksambtenarenreglement][ref3];

      h) het optreden als gemachtigd ambtenaar in de zin van de
      [Uitvoeringsregeling openbaarheid van bestuur Binnenlandse Zaken][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0015591#Artikel63
