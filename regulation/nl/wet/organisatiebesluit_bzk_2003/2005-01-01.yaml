    text: |-
      1 De Auditdienst staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De Auditdienst heeft de taken, bedoeld in:

      a) [artikel 66 van de Comptabiliteitswet 2001][ref1];

      b) het [Besluit taak DAD][ref2];

      c) [artikel 3, achtste lid, van het Beheersbesluit KABGNA/KABGA 1998][ref3].

      3 [Artikel 3:2, eerste lid][ref4], is uitsluitend van toepassing op de beheersmatige aangelegenheden betreffende
