  - number: 3:9
    text: |-
      1 De directie Voorlichting en Communicatie staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft de volgende taken:

      a) het vergroten van de toegankelijkheid van voorgenomen en aanvaard beleid door openbaarmaking, verklaring en
      toelichting;

      b) het inzetten van communicatie van beleidsontwikkeling tot beleidsuitvoering;

      c) het adviseren van de politieke en ambtelijke leiding over de interne en externe communicatie;

      d) het organiseren van het Nationaal Voorlichtingscentrum.
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel39
  - number: 3:10
    text: |-
      1 De directie Facilitaire Zaken staat onder leiding van een directeur en een plaatsvervangend directeur.

      2 De directie heeft tot taak het voorbereiden en ontwikkelen van beleid en uitvoeren van aangelegenheden met
      betrekking tot:

      a) bouwzaken en huisvesting;

      b) dienstverlening binnen het kernministerie;

      c) verwerving en beheer van goederen en diensten;

      d) bewaking en beveiliging van het kernministerie;

      e) brandveiligheid en bedrijfshulpverlening bij het kernministerie.

      Onder kernministerie worden in dit lid verstaan de onderdelen van het ministerie die in Den Haag zijn gevestigd
      op de Schedeldoekshaven, de Kalvermarkt, de Herengracht, de Fluwelen Burgwal, de Bezuidenhoutseweg en de Juliana
      van Stolberglaan.

      3 De directeur Facilitaire Zaken is tevens Coördinerend Directeur Inkoop. Deze heeft de volgende taken:

      a) het zorgdragen voor de coördinatie van het contractbeheer en de totstandkoming van een rechtmatig en doelmatig
      departementaal aanschaffingsbeleid, gericht op de verwerving van materiële zaken en diensten, alsmede op het
      aanbesteden van werken;

      b) het zorgdragen voor de vastlegging van richtlijnen voor het contractbeheer en het inkoopproces in de
      administratieve organisatie van het ministerie en het toezien op de uitvoering van de vastgelegde procedures,
      waaronder de toepassing van EG-richtlijnen voor leveringen, werken en diensten;

      c) het bevorderen van de aanwending en uitwisseling van beschikbare kennis en ervaring binnen het ministerie en het
      periodiek voeren van overleg met de departementale inkoopgemachtigden en met de departementale vertegenwoordiger
      bij het Interdepartementaal Overlegorgaan Europese Aanbestedingsvoorschriften;

      d) het coördineren van de informatievoorziening aan de Minister van Economische Zaken krachtens de
      [Raamwet EEG-voorschriften aanbestedingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005937
    url: https://wetten.overheid.nl/BWBR0015590/2005-01-01#Artikel310
