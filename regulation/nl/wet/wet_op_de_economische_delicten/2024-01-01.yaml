  - number: 1a.3°
    text: |-
      overtredingen van voorschriften, gesteld bij of krachtens: de [Kernenergiewet][ref1], de
      [artikelen 4, eerste lid][ref2], [36, eerste lid][ref3], en – voor zover aangeduid als strafbare feiten –
        [73][ref4]; de [Meststoffenwet][ref5], de [artikelen 4][ref6], [5][ref7], [5a][ref8], [6][ref9],
      [9, tweede en derde lid][ref10], [11, tweede en derde lid][ref11], [13, vierde lid][ref12], [15][ref13],
      [16][ref14], [34][ref15], [35][ref16], [36][ref17], [37][ref18], [38, derde lid][ref19], en [40][ref20]; de
      [Omgevingswet][ref21], de [artikelen 2.38][ref22], [2.40, eerste lid][ref23], [4.1, eerste lid][ref24], in
      overige gevallen dan bedoeld onder 1°, [4.3, eerste lid, aanhef en onder g, k en p, en vierde lid][ref25],
      met uitzondering van voorschriften als bedoeld in artikel 4.3, eerste lid, aanhef en onder k, in samenhang met
      [artikel 4.31, tweede lid, onder a][ref26], [5.1, eerste lid, aanhef en onder f en g][ref27], [5.3][ref28], in
      overige gevallen dan bedoeld onder categorie 1°, [5.4][ref29], in overige gevallen dan bedoeld onder categorie 1°,
      [5.5, derde lid, vierde lid, aanhef en onder b, en vijfde lid, aanhef en onder b][ref30], [5.37, tweede lid][ref31],
      [8.5][ref32], [10.2][ref33], [10.3][ref34], [10.6 tot en met 10.10][ref35], [10.10c tot en met 10.10h][ref36],
      [10.13 tot en met 10.15][ref37], [10.16, eerste en tweede lid][ref38], [10.17][ref39], [10.18][ref40],
      [10.19, eerste en tweede lid][ref41], [10.19a][ref42], [10.20][ref43], [10.21, eerste lid][ref44], [10.24][ref45],
      [10.25][ref46], [10.27, eerste en tweede lid][ref47], [20.3][ref48] en [20.6][ref49]; de [Visserijwet 1963][ref50],
      de [artikelen 2a][ref51], [3][ref52] en [3a][ref53], voor zover de overtreding van die voorschriften in de EU-
      verordening ter uitvoering waarvan zij strekken niet als ernstige inbreuk wordt aangemerkt, [4][ref54], [7][ref55],
      voor zover wordt gevist met meer dan twee hengels of de peur, [9][ref56], [16][ref57] en [21][ref58], voor zover
      wordt gevist met de hengel of de peur, dan wel overtreding van voorschriften, verbonden aan op grond van het
      bepaalde bij of krachtens de [artikelen 7][ref59] en [21 van de Visserijwet 1963][ref60] verleende schriftelijke
      toestemmingen en huurovereenkomsten; de [Wet bescherming Antarctica][ref61], de [artikelen 19, tweede lid][ref62],
      en [33][ref63]; de [Wet dieren][ref64], [artikelen 2.18a][ref65], [3.3 tot en met 3.7][ref66],
      al dan niet in samenhang met [artikel 6.2, eerste lid][ref67], [artikel 6.4, eerste lid][ref68],
      of [artikel 7.5, derde lid][ref69]; de [Wet gewasbeschermingsmiddelen en biociden][ref70]: de
      [artikelen 20, tweede en derde, lid][ref71], [28, eerste lid, onderdeel e][ref72], [29][ref73], [45][ref74],
      [71][ref75], [72][ref76], [73][ref77], [75][ref78], [76][ref79], [77][ref80], [78, tweede lid][ref81], en
      [115][ref82]; de [Wet luchtvaart][ref83], de [artikelen 6.60, eerste lid][ref84], [6.61, tweede lid][ref85],
      [6.61a][ref86], en [6.62, tweede lid][ref87]; de [Wet milieubeheer][ref88], de [artikelen 10.23][ref89] –
      voor zover aangeduid als strafbare feiten – , [10.60, zesde lid, onder a en onder b][ref90], in verbinding met
      onderdeel a, en zevende lid, onder a, onder b, in verbinding met onderdeel a, en onder c en [15.53][ref91]; de
      [Wet van 13 mei 1993, Stb. 283, tot uitbreiding en wijziging van de Wet milieubeheer (afvalstoffen)][ref92],
      [artikel VII][ref93], voor zover het betreft gemeentelijke verordeningen, vastgesteld krachtens artikel 2 van de
      Afvalstoffenwet; de [Wet vervoer gevaarlijke stoffen][ref94]: de [artikelen 47][ref95] en [48, tweede lid][ref96];
      de [Wet voorkoming verontreiniging door schepen][ref97], [artikel 12, tweede lid, onderdeel c][ref98].


