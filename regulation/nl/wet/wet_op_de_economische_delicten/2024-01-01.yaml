    text: |-
      overtredingen van voorschriften, gesteld bij of krachtens: de [Erfgoedwet][ref1], de
      [artikelen 5.1, eerste lid][ref2], en [5.10, eerste lid][ref3]; de [Kernenergiewet][ref4], de
      [artikelen 14][ref5], [22, eerste lid][ref6], [26, tweede lid][ref7], [28][ref8], [33, eerste lid][ref9],
      [37, eerste lid][ref10], [39][ref11], [67, eerste en vierde lid][ref12], [68][ref13] en
      [76, derde lid][ref14]; de [Omgevingswet][ref15], de [artikelen 2.45, eerste en derde lid][ref16],
      [4.3, eerste lid, aanhef en onder a, d, e, j, l, m en o, en tweede lid, aanhef en onder c][ref17],
      met uitzondering van voorschriften als bedoeld in artikel 4.3, eerste lid, aanhef en onder l, in
      samenhang met [artikel 4.32, tweede lid, aanhef en onder c en derde lid, aanhef en onder a][ref18],
      [5.1, eerste lid, aanhef en onder a][ref19], in overige gevallen dan bedoeld onder categorie
      1°, c en e, en tweede lid, aanhef en onder a, d en e, [5.5, tweede lid][ref20], [5.6][ref21],
      [5.52, tweede lid, aanhef en onder a][ref22], in verbinding met artikel 5.1, eerste lid, aanhef en onder
      a en c, en tweede lid, aanhef en onder a, d, en e, en 5.5, tweede lid, [10.10b, eerste lid][ref23],
      en [23.1, eerste lid][ref24]; de [Wegenverkeerswet 1994](onbekend), [artikel 20g][ref25], de krachtens
      [artikel 29][ref26] en [31][ref27] genoemde artikelen van een EU-verordening of -richtlijn in verband
      met de goedkeuring van motorvoertuigen en de [artikelen 20ga][ref28], [29a][ref29], [30][ref30],
      [30a][ref31] en [33][ref32]; de [Wet bescherming Antarctica][ref33], de [artikelen 3, eerste lid][ref34],
      [3a, eerste en vierde lid][ref35], [5][ref36], [6, eerste en tweede lid][ref37], [7a, eerste en tweede lid][ref38],
      [8][ref39], [24a][ref40], [25, eerste en tweede lid][ref41], [25b, eerste lid][ref42], [25c, tweede lid][ref43],
      [25f, eerste lid][ref44], [29][ref45] en [30][ref46]; de [Wet milieubeheer][ref47], de artikelen
      [8.42a, eerste lid][ref48], [8.43][ref49], [9.2.1.3][ref50], [9.2.1.4][ref51], [9.2.2.2][ref52],
      [9.2.3.2][ref53], [9.2.3.4][ref54], [9.2.3.5, tweede lid][ref55], [9.3.3, tweede en derde lid][ref56],
      [9.3a.3, tweede en derde lid][ref57], [9.4.4 tot en met 9.4.7][ref58], [9.4.9][ref59], [9.5.1][ref60],
      [9.5.2][ref61], [9.5.4][ref62], [9.5.6][ref63][10.29, eerste lid][ref64], [10.38][ref65],
      [10.40, eerste en tweede lid][ref66], [10.40a, tweede lid][ref67], [10.41, eerste en tweede lid][ref68],
      [10.42, eerste lid][ref69], [10.43, eerste lid][ref70], [10.44, eerste en derde lid][ref71],
      [10.45, eerste lid, onderdeel a][ref72], [10.46, eerste lid][ref73], [10.48, derde lid][ref74],
      [10.55][ref75], [10.60, vijfde lid, onder a, onder b][ref76], in verbinding met onderdeel a,
      en onder c, [11A.2, eerste, derde en vierde lid][ref77], [11A.3, aanhef en onderdeel b][ref78],
      [15.32, eerste en tweede lid][ref79], [17.12, tweede lid][ref80], en [17.13, tweede en zesde lid][ref81],
