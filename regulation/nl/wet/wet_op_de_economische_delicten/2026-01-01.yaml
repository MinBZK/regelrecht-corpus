      1 Onder de opsporingsambtenaren, bedoeld in de [artikelen 18 tot en met 23][ref1], worden
      mede begrepen de ambtenaren, die ingevolge [artikel 83 van de Kernenergiewet][ref2],
      [artikel 28, eerste lid, van de Natuurbeschermingswet][ref3], artikel 30, onder 3°, van de Vogelwet 1936,
      artikel 8, eerste lid, van de Wet bedreigde uitheemse diersoorten, [artikel 11.1 van de Wet luchtvaart][ref4] of
      [artikel 44 van de Wet vervoer gevaarlijke stoffen][ref5], zijn belast met de opsporing van strafbare feiten.

      2 Bij de opsporing van overtredingen van voorschriften gesteld bij of krachtens de
      [Wet vervoer gevaarlijke stoffen][ref6] of [titel 6.5 van de Wet luchtvaart][ref7] komen de bevoegdheden, genoemd
      in [artikel 21][ref8], slechts toe aan de krachtens [artikel 44 van de Wet vervoer gevaarlijke stoffen][ref9]
      of krachtens [artikel 11.1 van de Wet luchtvaart][ref10] aangewezen ambtenaren van het Ministerie van Verkeer en
      Waterstaat en van het militair Korps controleurs gevaarlijke stoffen.


