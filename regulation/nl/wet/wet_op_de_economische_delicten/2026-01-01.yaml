preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, het Besluit berechting economische delicten
    te vervangen door een wet, die de doeltreffendheid bevordert van de opsporing, vervolging en berechting van
    handelingen, welke schadelijk zijn voor het economische leven, en die in het bijzonder daarin meer eenheid brengt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#ArtikelAanhef
articles:
  - number: '1'
