  - number: '87'
    text: |-
      1 Deze wet treedt in werking op een nader door Ons te bepalen tijdstip, dat voor onderscheidene groepen van
      economische delicten en voor onderscheidene voorschriften verschillend kan zijn.

      2 Zij kan worden aangehaald als 'Wet op de economische delicten'.
