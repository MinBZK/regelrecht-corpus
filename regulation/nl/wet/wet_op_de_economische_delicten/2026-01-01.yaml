      ernstige inbreuk wordt aangemerkt, [4, eerste, tweede, derde en vijfde lid][ref331], [7, eerste lid][ref332],
      voor zover wordt gevist met meer dan twee hengels of de peur, [9, eerste, derde, vierde en zevende lid][ref333],
      [16][ref334] en [21, eerste lid][ref335], voor zover wordt gevist met de hengel of de peur, dan wel overtreding van
      voorschriften, verbonden aan op grond van het bepaalde bij of krachtens de [artikelen 7, tweede lid][ref336], en
      [21, tweede lid, van de Visserijwet 1963][ref337] verleende schriftelijke toestemmingen en huurovereenkomsten;

      de [Wet bescherming Antarctica][ref338], de [artikelen 19, tweede lid][ref339], en [33][ref340];

      de [Wet dieren][ref341], [artikelen 2.18a][ref342], [3.3 tot en met 3.7][ref343], al dan niet in samenhang met
      [artikel 6.2, eerste lid][ref344], [artikel 6.4, eerste lid][ref345], of [artikel 7.5, derde lid][ref346];

      de [Wet gewasbeschermingsmiddelen en biociden][ref347]: de [artikelen 20, tweede en derde, lid][ref348],
      [28, eerste lid, onderdeel e][ref349], [29][ref350], [45][ref351], [71][ref352], [72][ref353], [73][ref354],
      [75][ref355], [76][ref356], [77][ref357], [78, tweede lid][ref358], en [115][ref359];

      de [Wet luchtvaart][ref360], de [artikelen 6.60, eerste lid][ref361], [6.61, tweede lid][ref362], [6.61a][ref363],
      en [6.62, tweede lid][ref364];

      de [Wet milieubeheer][ref365], de [artikelen 10.23][ref366] – voor zover aangeduid als strafbare feiten – ,
      [10.60, zesde lid, onder a en onder b][ref367], in verbinding met onderdeel a, en zevende lid, onder a, onder b, in
      verbinding met onderdeel a, en onder c en [15.53][ref368];

      de [Wet van 13 mei 1993, Stb. 283, tot uitbreiding en wijziging van de Wet milieubeheer (afvalstoffen)][ref369],
      [artikel VII][ref370], voor zover het betreft gemeentelijke verordeningen, vastgesteld krachtens artikel 2 van
      de Afvalstoffenwet;

      de [Wet vervoer gevaarlijke stoffen][ref371]: de [artikelen 47][ref372] en [48, tweede lid][ref373];

