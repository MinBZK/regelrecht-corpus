  - number: '2'
    text: |-
      1 De economische delicten, bedoeld in [artikel 1, onder 1° en 2°][ref1], en [artikel 1][ref2], zijn misdrijven,
      voor zover zij opzettelijk zijn begaan; voor zover deze economische delicten geen misdrijven zijn, zijn zij
      overtredingen.

      2 In afwijking van het eerste lid zijn overtredingen van voorschriften, gesteld krachtens
      [artikel 15, tweede lid, van de Distributiewet][ref3], overtredingen, terwijl overtredingen van andere
      voorschriften, gesteld krachtens de [Distributiewet][ref4], overtredingen zijn, voor zover deze wet in werking is
      getreden op grond van [artikel 2 van de Wet uitvoering Internationaal Energieprogramma][ref5].

      3 De economische delicten, bedoeld in [artikel 1, onder 3°][ref6], zijn misdrijven of overtredingen, al naar
      gelang zij in de desbetreffende voorschriften als misdrijf dan wel als overtreding zijn gekenmerkt.

      4 De economische delicten, bedoeld in [artikel 1, onder 4°][ref7], en [artikel 1][ref8], zijn overtredingen.

      5 De economische delicten, bedoeld in [artikel 1, onder 5°][ref9], zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0001997#Artikel15
      [ref4]: https://wetten.overheid.nl/BWBR0001997
      [ref5]: https://wetten.overheid.nl/BWBR0003235#Artikel2
      [ref6]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref7]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref8]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
      [ref9]: https://wetten.overheid.nl/BWBR0002063#Artikel1
