  - number: '7'
    text: |-
      De bijkomende straffen zijn:

      a. ontzetting van de rechten, genoemd in
      [artikel 28, eerste lid, onder 1°, 2°, 4° en 5° van het Wetboek van Strafrecht][ref1], voor een tijd, de duur
      der vrijheidsstraf ten minste zes maanden en ten hoogste zes jaren te boven gaande, of, in geval van veroordeling
      tot geldboete als enige hoofdstraf, voor een tijd van ten minste zes maanden en ten hoogste zes jaren;

      b.

      c. gehele of gedeeltelijke stillegging van de onderneming van de veroordeelde, waarin het economische delict is
      begaan, voor een tijd van ten hoogste een jaar;

      d. verbeurdverklaring van de voorwerpen, genoemd in [artikel 33][ref2];

      e. verbeurdverklaring van voorwerpen, behorende tot de onderneming van de veroordeelde, waarin het economische
      delict is begaan, voor zover zij soortgelijk zijn aan en met betrekking tot het delict verband houden met die,
      genoemd in [artikel 33][ref3];

      f. gehele of gedeeltelijke ontzetting van bepaalde rechten of gehele of gedeeltelijke ontzegging van bepaalde
      voordelen, welke rechten of voordelen de veroordeelde in verband met zijn onderneming van overheidswege zijn of
      zouden kunnen worden toegekend, voor een tijd van ten hoogste twee jaren;

      g. openbaarmaking van de rechterlijke uitspraak.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel33a
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel33a
