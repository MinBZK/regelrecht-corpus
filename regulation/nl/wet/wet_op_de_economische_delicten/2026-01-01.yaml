  - number: 30a
    text: |-
      1 Van de beschikking van het hof kan het openbaar ministerie binnen veertien dagen en de verdachte binnen veertien
      dagen na de betekening beroep in cassatie instellen.

      2 De verdachte is, op straffe van niet-ontvankelijkheid, verplicht binnen een maand na het instellen van dat beroep
      bij de Hoge Raad der Nederlanden door een advocaat een schriftuur te doen indienen, houdende zijn middelen van
      cassatie.

      3 [Artikel 57][ref1] is van overeenkomstige toepassing.

      4 De Hoge Raad beslist zo spoedig mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel57
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel30a
