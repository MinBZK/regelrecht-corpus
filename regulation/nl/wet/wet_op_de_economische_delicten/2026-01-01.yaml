  - number: 18a
    text: |-
      1 Ingeval van verdenking van een misdrijf waarvoor een geldboete van de vierde categorie kan worden opgelegd kunnen
      voorwerpen inbeslaggenomen worden tot bewaring van het recht tot verhaal voor een ter zake van dat misdrijf op te
      leggen maatregel als bedoeld in [artikel 8, onderdeel d][ref1].

      2 Op inbeslagneming op grond van het eerste lid zijn de bepalingen uit het [Wetboek van Strafvordering][ref2]
      die betrekking hebben op inbeslagneming op grond van [artikel 94a][ref3] van dat wetboek, van overeenkomstige
      toepassing.


