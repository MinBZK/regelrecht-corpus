  - number: '8'
    text: |-
      Maatregelen zijn:

      a. de maatregelen voorzien in [Titel IIA van het Eerste Boek van het Wetboek van Strafrecht][ref1];

      b. onderbewindstelling van de onderneming van de veroordeelde, waarin het economisch delict is begaan, in geval
      van misdrijf voor een tijd van ten hoogste drie jaren en in geval van overtreding voor een tijd van ten hoogste
      twee jaren;

      c. het opleggen van de verplichting tot verrichting van hetgeen wederrechtelijk is nagelaten, tenietdoening van
      hetgeen wederrechtelijk is verricht en verrichting van prestaties tot het goedmaken van een en ander, alles op
      kosten van de veroordeelde, voor zover de rechter niet anders bepaalt;

      d. het opleggen van de verplichting tot het vergoeden van de kosten die ten laste van de staat komen in verband met
      de vernietiging van voorwerpen die ernstig gevaar opleveren voor de leefomgeving of voor de volksgezondheid en ten
      aanzien waarvan:

      1°. de maatregel, bedoeld in [artikel 36b, eerste lid, van het Wetboek van Strafrecht][ref2], wordt opgelegd;

      2°. de maatregel, bedoeld in [artikel 36b, eerste lid, van het Wetboek van Strafrecht][ref3], had
      kunnen worden opgelegd maar waarvan door de veroordeelde afstand is gedaan op de wijze, bedoeld in
      [artikel 116, tweede lid, aanhef en onderdeel c, van het Wetboek van Strafvordering][ref4]; of

      3°. een machtiging tot vernietiging als bedoeld in
      [artikel 117, eerste lid, van het Wetboek van Strafvordering][ref5] is verleend, voor zover het voorwerpen betreft
      die van zodanige aard zijn dat het ongecontroleerde bezit daarvan in strijd is met de wet of het algemeen belang.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel36b
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel36b
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel116
      [ref5]: https://wetten.overheid.nl/BWBR0001903#Artikel117
