  - number: '36'
    text: |-
      1 Bij toepassing van [artikel 257a van het Wetboek van Strafvordering][ref1] kan tevens de aanwijzing worden
      gegeven dat wordt verricht hetgeen wederrechtelijk is nagelaten, tenietgedaan hetgeen wederrechtelijk is verricht
      en dat prestaties tot het goedmaken van een en ander worden verricht, alles op kosten van de verdachte, voor zover
      niet anders wordt bepaald.

      2 Indien de verdachte een rechtspersoon is, behoeft deze, in afwijking van
      [artikel 257c, tweede lid, van het Wetboek van Strafvordering][ref2], slechts onder bijstand van een
      raadsman te worden gehoord als de strafbeschikking betalingsverplichtingen uit hoofde van geldboete en
      schadevergoedingsmaatregel bevat welke afzonderlijk of gezamenlijk meer belopen dan € 10 000.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel257a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel257c
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel36
