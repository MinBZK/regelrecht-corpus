  - number: '62'
    text: |-
      1 Het Besluit voorlopige tuchtmaatregelen voedselvoorziening (*Staatsblad*, No. F 284) wordt ingetrokken.

      2 De voorlopige tuchtmaatregelen, op het tijdstip van inwerkingtreding van deze wet van kracht, worden gehandhaafd.
      Het bepaalde in de [Titels IV][ref1] en [V][ref2] is op deze maatregelen van toepassing, met dien verstande, dat:

      a. voorlopige tuchtmaatregelen, bevolen door een ambtenaar voor de tuchtrechtspraak, worden geacht te zijn bevolen
      door de officier van justitie bij de rechtbank van het arrondissement, waarin de ambtenaar voor de tuchtrechtspraak
      bevoegd was;

      b. voorlopige tuchtmaatregelen, bevolen door een tuchtrechter voor de voedselvoorziening, worden geacht te zijn
      bevolen door de rechtbank van het arrondissement, waarin de tuchtrechter bevoegd was;

      c. voorlopige tuchtmaatregelen, bevolen door het Centraal College voor de Tuchtrechtspraak, worden geacht te zijn
      bevolen door het gerechtshof binnen welks rechtsgebied de tuchtrechter bevoegd was, die in eerste aanleg uitspraak
      heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002063
      - id: ref2
        bwb_id: BWBR0002063
  - number: '63'
    text: |-
      1 De wet van 24 Mei 1947, tot opneming van de mogelijkheid van voorlopige maatregelen ter zake van overtreding van
      prijsvoorschriften (*Staatsblad* No. H 156) wordt ingetrokken.

      2 De voorlopige maatregelen, op het tijdstip van inwerkingtreding van deze wet van kracht, worden, gedurende
      hoogstens zes maanden nadat zij zijn genomen, gehandhaafd. Het bepaalde in de [Titels IV][ref1] en [V][ref2] is
      overigens op deze maatregelen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel63
