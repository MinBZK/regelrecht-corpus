  - number: '18'
    text: |-
      1 De opsporingsambtenaren zijn in het belang van de opsporing bevoegd tot inbeslagneming van daarvoor vatbare
      voorwerpen voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij kunnen daartoe hun
      uitlevering vorderen.

      2 Voor inbeslagneming van voorwerpen ter verbeurdverklaring uit hoofde van [artikel 7, onder e][ref1], behoeven zij
      evenwel de machtiging van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
