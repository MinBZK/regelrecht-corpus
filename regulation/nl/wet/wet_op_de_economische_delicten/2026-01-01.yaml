  - number: '10'
    text: |-
      1 Bij de uitspraak, waarbij een bijkomende straf of een maatregel, als vermeld in [artikel 8][ref1], wordt
      opgelegd, worden, voor zoveel nodig, alle bijzonderheden en gevolgen naar behoefte geregeld, daaronder begrepen bij
      onderbewindstelling de benoeming van een of meer bewindvoerders. Bij oplegging van een bijkomende straf als vermeld
      in [artikel 7, onder c][ref2], kan bovendien worden bevolen, dat de veroordeelde

      hem van overheidswege ten behoeve van zijn onderneming verstrekte bescheiden inlevert;

      in zijn onderneming aanwezige voorraden onder toezicht verkoopt;

      en zijn medewerking verleent bij inventarisatie van die voorraden.

      2 Onverminderd het bepaalde in de [artikelen 6:4:9][ref3] en [6:6:26 van het Wetboek van Strafvordering][ref4]
      kan de rechter die de bijkomende straf of maatregel heeft opgelegd, na ontvangst van een vordering van het openbaar
      ministerie of op verzoek van de veroordeelde bij latere beslissing alsnog een regeling geven als vorenbedoeld,
      dan wel in de reeds gegeven regeling wijziging brengen of terzake een aanvullende regeling geven. De behandeling
      van de zaak vindt plaats met gesloten deuren; de uitspraak geschiedt in het openbaar. De beslissing is met redenen
      omkleed; zij is niet aan enig rechtsmiddel onderworpen.

      3 Wij behouden Ons voor, nadere voorschriften te geven ter uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel649
      [ref4]: https://wetten.overheid.nl/BWBR0001903#Artikel6626
