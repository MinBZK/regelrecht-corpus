  - number: 8a
    text: |-
      1 De maatregel vermeld in [artikel 8, onder d][ref1], kan op vordering van het openbaar ministerie door de rechter
      worden opgelegd aan degene die is veroordeeld wegens een economisch delict.

      2 De rechter kan het te betalen bedrag lager vaststellen dan de kosten, bedoeld in het eerste lid.
      [Artikel 36e, vijfde lid, vijfde en zesde volzin, van het Wetboek van Strafrecht][ref2] is van overeenkomstige
      toepassing.


