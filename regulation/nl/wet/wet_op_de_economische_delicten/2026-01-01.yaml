        bwb_id: BWBR0002063
        artikel: '49'
  - number: '58'
    text: |-
      In overleg met Onze Minister van Justitie kunnen lichamen met een publieke taak belast, hiertoe bevoegd verklaard
      door een Onzer andere Ministers, wie het aangaat, ten dienste van de opsporing, vervolging en berechting van
      economische delicten ambtenaren benoemen, die het contact onderhouden met het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel58
  - number: 58a
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen in het belang van een doelmatige handhaving regels
      worden gesteld over de samenwerking van de personen en instanties die belast zijn met de opsporing van economische
      delicten onderling en met de bestuursorganen die belast zijn met de bestuursrechtelijke handhaving van het bepaalde
      bij of krachtens de in de [artikelen 1][ref1] en [1a][ref2] genoemde wetten.

      2 De regels, bedoeld in het eerste lid, kunnen onder meer betrekking hebben op het volgens een strategie en
      programma uitoefenen van bevoegdheden tot opsporing van overtredingen van nader aangeduide wettelijke voorschriften
      en de afstemming daarvan met de uitoefening van bevoegdheden ten behoeve van de bestuursrechtelijke handhaving.

      3 Over de uitoefening van de taken en bevoegdheden in het kader van de samenwerking, bedoeld in het eerste lid,
      overlegt Onze Minister van Veiligheid en Justitie regelmatig gezamenlijk met Onze Minister(s) die het mede aangaat,
      het openbaar ministerie en de bestuursorganen, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel58a
    references:
