  - number: '3'
    text: |-
      Deelneming aan een binnen het Rijk in Europa gepleegd economisch delict is strafbaar ook indien de deelnemer zich
      buiten het Rijk aan het feit heeft schuldig gemaakt.
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel3
  - number: '4'
    text: |-
      Waar in deze wet in het algemeen of in het bijzonder wordt gesproken van een economisch delict, dat een misdrijf
      oplevert, wordt medeplichtigheid aan en poging tot zodanig delict daaronder begrepen, voor zover niet uit enige
      bepaling het tegendeel volgt.
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel4
  - number: '5'
    text: |-
      Tenzij bij de wet anders is bepaald, kunnen ter zake van economische delicten geen andere voorzieningen met de
      strekking van straf of tuchtmaatregel worden getroffen dan de straffen en maatregelen, overeenkomstig deze wet op
      te leggen.
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel5
  - number: '6'
    text: |-
      1 Hij, die een economisch delict begaat, wordt gestraft:

      1°. in geval van misdrijf, voor zover het betreft een economisch delict, bedoeld in [artikel 1, onder 1°][ref1],
      of in [artikel 1a, onder 1°][ref2], met gevangenisstraf van ten hoogste zes jaren, taakstraf of geldboete van de
      vijfde categorie;

      2°. in geval van een ander misdrijf met gevangenisstraf van ten hoogste twee jaren, taakstraf of geldboete van de
      vierde categorie;

      3°. indien hij van het plegen van het misdrijf als bedoeld onder 2° een gewoonte heeft gemaakt, met gevangenisstraf
      van ten hoogste vier jaren, taakstraf of geldboete van de vijfde categorie;

      4°. in geval van overtreding, voor zover het betreft een economisch delict bedoeld in [artikel 1, onder 1°][ref3],
      of in [artikel 1a, onder 1°][ref4], met hechtenis van ten hoogste een jaar, taakstraf of geldboete van de vierde
      categorie;

      5°. in geval van een andere overtreding, met hechtenis van ten hoogste zes maanden, taakstraf of geldboete van de
      vierde categorie.

      Indien de waarde der goederen, waarmede of met betrekking tot welke het economisch delict is begaan, of die geheel
      of gedeeltelijk door middel van het economisch delict zijn verkregen, hoger is dan het vierde gedeelte van het
      maximum der geldboete welke in de gevallen onder 1° tot en met 5° kan worden opgelegd, kan, onverminderd het
      bepaalde in [artikel 23, zevende lid, van het Wetboek van Strafrecht][ref5], een geldboete worden opgelegd van de
      naast hogere categorie.

      2 Bovendien kunnen de bijkomende straffen, vermeld in [artikel 7][ref6], en de maatregelen, vermeld in
      [artikel 8][ref7], worden opgelegd, onverminderd de oplegging, in de daarvoor in aanmerking komende gevallen, van
      de maatregelen, elders in wettelijke bepalingen voorzien.

      3 In afwijking van het bepaalde in het eerste en tweede lid wordt hij, die een voorschrift, gesteld krachtens
      [artikel 15, tweede lid, van de Distributiewet][ref8], of gesteld bij of krachtens de [artikelen 10.2][ref9],
      [10.3][ref10], [10.6 tot en met 10.10a][ref11], [10.10c tot en met 10.10h][ref12], [10.13 tot en met 10.15][ref13],
      [10.16, eerste en tweede lid][ref14], [10.17][ref15], [10.18][ref16], [10.19, eerste en tweede lid][ref17],
      [10.19a][ref18], [10.20][ref19], [10.21, eerste lid][ref20], [10.21a][ref21], [10.24][ref22], [10.25][ref23],
      [10.27, eerste en tweede lid van de Omgevingswet][ref24], overtreedt gestraft met hechtenis van ten hoogste twee
      maanden of geldboete van de eerste categorie.

      4 In afwijking van het bepaalde in het eerste lid wordt hij die een
      voorschrift overtreedt, gesteld bij of krachtens de [artikelen 2][ref25] en
      [3, eerste lid, van de Uitvoeringswet verdrag chemische wapens][ref26], __REF002___________________________________
      ____________________________, dan wel de [artikelen 2, eerste en derde lid][ref28], [3][ref29] en
      [4 van de Uitvoeringswet verdrag biologische wapens][ref30], gestraft met gevangenisstraf van ten hoogste acht
      jaren of geldboete van de vijfde categorie, indien het feit opzettelijk is begaan met een terroristisch oogmerk
      als bedoeld in [artikel 83a van het Wetboek van Strafrecht][ref31], dan wel met het oogmerk om een terroristisch
      misdrijf als bedoeld in [artikel 83 van dat wetboek][ref32] voor te bereiden of gemakkelijk te maken.


