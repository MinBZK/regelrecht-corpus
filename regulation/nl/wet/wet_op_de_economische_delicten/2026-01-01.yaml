  - number: '14'
    text: |-
      1 De tenuitvoerlegging van een veroordeling tot de betaling van kosten, andere dan die van openbaarmaking van de
      rechterlijke uitspraak, geschiedt op de wijze van de tenuitvoerlegging ener veroordeling tot geldboete, met dien
      verstande, dat geen vervangende vrijheidsstraf wordt toegepast.

      2 In afwijking van het eerste lid geschiedt de tenuitvoerlegging van de in [artikel 8 onder d][ref1]
      vermelde maatregel op de wijze van tenuitvoerlegging van de maatregel, bedoeld in
      [artikel 36e van het Wetboek van Strafrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
