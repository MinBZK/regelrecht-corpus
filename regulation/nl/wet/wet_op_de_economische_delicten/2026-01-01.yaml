  - number: '29'
    text: |-
      1 Indien tegen de verdachte ernstige bezwaren zijn gerezen en tevens de belangen, welke door het vermoedelijk
      overtreden voorschrift worden beschermd, een onmiddellijk ingrijpen vereisen, kan het gerecht in alle zaken,
      economische delicten betreffende, met uitzondering van die, bedoeld in [artikel 6, derde lid][ref1], vóór de
      behandeling ter terechtzitting, op de vordering van het openbaar ministerie, en, indien de zaak te zijner zitting
      wordt behandeld, mede ambtshalve, als voorlopige maatregel bevelen:

      a. gehele of gedeeltelijke stillegging van de onderneming van de verdachte, waarin het economische delict wordt
      vermoed te zijn begaan;

      b. onderbewindstelling van de onderneming van de verdachte, waarin het economische delict wordt vermoed te zijn
      begaan;

      c. gehele of gedeeltelijke ontzetting van bepaalde rechten of gehele of gedeeltelijke ontzegging van bepaalde
      voordelen, welke rechten of voordelen de verdachte in verband met zijn onderneming van overheidswege zijn of zouden
      kunnen worden toegekend;

      d. dat de verdachte zich onthoude van bepaalde handelingen;

      e. dat de verdachte zorg drage, dat in het bevel aangeduide voorwerpen, welke vatbaar zijn voor inbeslagneming,
      opgeslagen en bewaard worden ter plaatse, in het bevel aangegeven.

      2 Op de vorengenoemde bevelen is [artikel 10, eerste lid][ref2], van overeenkomstige toepassing.

      3 De vorengenoemde bevelen verliezen hun kracht door een tijdsverloop van zes maanden en blijven uiterlijk van
      kracht totdat de rechterlijke einduitspraak in de zaak, waarin zij zijn gegeven, onherroepelijk is geworden. Zij
      kunnen door het gerecht, waarvoor de zaak wordt vervolgd, eenmaal met ten hoogste zes maanden worden verlengd en
      worden gewijzigd of opgeheven. Het gerecht kan dit doen ambtshalve, op de vordering van het openbaar ministerie en,
      voor wat betreft wijziging of opheffing van de bevelen, tevens op het verzoek van de verdachte; deze wordt steeds
      gehoord, althans behoorlijk opgeroepen, tenzij:

      1°. het gerecht reeds aanstonds tot wijziging overeenkomstig het verzoek van de verdachte dan wel tot opheffing
      besluit;

      2°. nog geen twee maanden zijn verstreken sedert op een vorig verzoek van de verdachte van gelijke strekking is
      beslist.

      Het gerecht beslist op een verzoek van de verdachte binnen vijf dagen, nadat het ter griffie is ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel10
