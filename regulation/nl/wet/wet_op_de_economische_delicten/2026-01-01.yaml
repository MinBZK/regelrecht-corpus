  - number: '16'
    text: |-
      1 Indien aannemelijk is dat iemand die, alvorens in zijn zaak een onherroepelijke uitspraak is gedaan, is
      overleden, zich heeft schuldig gemaakt aan een economisch delict, kan de rechter bij beschikking op de vordering
      van het openbaar ministerie:

      a. de verbeurdverklaring van reeds in beslag genomen voorwerpen uitspreken; artikel 10 vindt overeenkomstige
      toepassing;

      b. ten laste van de boedel van de overledene de in artikel 8, onder *c* vermelde maatregel opleggen.

      2 De beschikking wordt door de griffier openbaar gemaakt in de *Nederlandse Staatscourant* en in een of meer door
      de rechter aan te wijzen nieuwsbladen, terwijl bovendien een afschrift van de beschikking aan het sterfhuis wordt
      betekend.

      3 Elke belanghebbende kan binnen drie maanden na de in het vorige lid bedoelde openbaarmaking of betekening een
      bezwaarschrift ter griffie indienen.

      4 De officier van justitie wordt gehoord; de belanghebbende wordt gehoord, althans behoorlijk opgeroepen.

      5 De rechter geeft een met redenen omklede beslissing; deze is niet aan enig rechtsmiddel onderworpen.

      6 Het in het eerste lid, in de aanhef en onder *a*, in het derde, het vierde en in het vijfde lid, bepaalde
      geldt mede, indien aannemelijk is, dat een onbekende zich schuldig heeft gemaakt aan een economisch delict. De
      beschikking wordt door de griffier openbaar gemaakt in de *Nederlandse Staatscourant* en in één of meer door de
      rechter aan te wijzen nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel16
  - number: '17'
    text: |-
      1 Met de opsporing van economische delicten zijn belast:

      1°. de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;

      2°. de door Onze Minister van Veiligheid en Justitie, in overeenstemming met Onze andere Ministers, wie het
      aangaat, aangewezen ambtenaren;

      3°. de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.

      2 Alle met de opsporing van economische delicten belaste ambtenaren zijn tevens belast met de opsporing van de
      economische delicten, genoemd in de [artikelen 26][ref2], [33][ref3] en [34][ref4].

      3 [Artikel 142, tweede en vierde lid, van het Wetboek van Strafvordering][ref5] is van overeenkomstige toepassing
      op de in het eerste lid, onder 2° en 3°, bedoelde opsporingsambtenaren.

      4 Van een besluit als bedoeld in het eerste lid, onder 2°, wordt mededeling gedaan door plaatsing in de
      Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel26
