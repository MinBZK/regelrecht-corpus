  - number: 24a
    text: |-
      1 Een ieder is verplicht aan de opsporingsambtenaren binnen de door hen gestelde redelijke termijn alle medewerking
      te verlenen die deze redelijkerwijs kunnen vorderen bij de uitoefening van de hen krachtens deze titel toekomende
      bevoegdheden.

      2 Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het
      verlenen van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.

      3 De opsporingsambtenaren zijn bevoegd op kosten van de overtreder door feitelijk handelen op te treden tegen
      hetgeen in strijd met de in het eerste lid bedoelde verplichting is of wordt gedaan, gehouden of nagelaten, voor
      zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002063/2026-01-01#Artikel24a
  - number: '25'
    text: |-
      Voor zover daarvan niet in deze wet of de in [artikel 1][ref1] en [artikel 1a][ref2] genoemde wetten en
      besluiten is afgeweken, gelden ten aanzien van de opsporing van economische delicten de bepalingen van het
      [Wetboek van Strafvordering][ref3].


