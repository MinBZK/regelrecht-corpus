  - number: '2.1'
    text: |-
      De economische delicten, bedoeld in [artikel 1, onder 1° en 2°][ref1], en [artikel 1][ref2], zijn misdrijven,
      voor zover zij opzettelijk zijn begaan; voor zover deze economische delicten geen misdrijven zijn, zijn zij
      overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: '2.2'
    text: |-
      In afwijking van het eerste lid zijn overtredingen van voorschriften, gesteld krachtens
      [artikel 15, tweede lid, van de Distributiewet][ref1], overtredingen, terwijl overtredingen van andere
      voorschriften, gesteld krachtens de [Distributiewet][ref2], overtredingen zijn, voor zover deze wet in werking is
      getreden op grond van [artikel 2 van de Wet uitvoering Internationaal Energieprogramma][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001997#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0001997
      [ref3]: https://wetten.overheid.nl/BWBR0003235#Artikel2
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0001997
        artikel: '15'
      - id: ref2
        bwb_id: BWBR0001997
      - id: ref3
        bwb_id: BWBR0003235
        artikel: '2'
  - number: '2.3'
    text: |-
      De economische delicten, bedoeld in [artikel 1, onder 3°][ref1], zijn misdrijven of overtredingen, al naar gelang
      zij in de desbetreffende voorschriften als misdrijf dan wel als overtreding zijn gekenmerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '2.4'
    text: |-
      De economische delicten, bedoeld in [artikel 1, onder 4°][ref1], en [artikel 1][ref2], zijn overtredingen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: '2.5'
    text: |-
      De economische delicten, bedoeld in [artikel 1, onder 5°][ref1], zijn misdrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '3'
    text: |-
      Deelneming aan een binnen het Rijk in Europa gepleegd economisch delict is strafbaar ook indien de deelnemer zich
      buiten het Rijk aan het feit heeft schuldig gemaakt.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel3
  - number: '4'
    text: |-
      Waar in deze wet in het algemeen of in het bijzonder wordt gesproken van een economisch delict, dat een misdrijf
      oplevert, wordt medeplichtigheid aan en poging tot zodanig delict daaronder begrepen, voor zover niet uit enige
      bepaling het tegendeel volgt.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel4
  - number: '5'
    text: |-
      Tenzij bij de wet anders is bepaald, kunnen ter zake van economische delicten geen andere voorzieningen met de
      strekking van straf of tuchtmaatregel worden getroffen dan de straffen en maatregelen, overeenkomstig deze wet op
      te leggen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel5
  - number: '6.1'
    text: 'Hij, die een economisch delict begaat, wordt gestraft:'
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
  - number: 6.1.1°
    text: |-
      in geval van misdrijf, voor zover het betreft een economisch delict, bedoeld in [artikel 1, onder 1°][ref1], of in
      [artikel 1][ref2], met gevangenisstraf van ten hoogste zes jaren, taakstraf of geldboete van de vijfde categorie;


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: 6.1.2°
    text: |-
      in geval van een ander misdrijf met gevangenisstraf van ten hoogste twee jaren, taakstraf of geldboete van de
      vierde categorie;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
  - number: 6.1.3°
    text: |-
      in geval van overtreding, voor zover het betreft een economisch delict bedoeld in [artikel 1, onder 1°][ref1], of
      in [artikel 1][ref2], met hechtenis van ten hoogste een jaar, taakstraf of geldboete van de vierde categorie;


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: 6.1.4°
    text: |-
      in geval van een andere overtreding, met hechtenis van ten hoogste zes maanden, taakstraf of geldboete van de
      vierde categorie.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
  - number: '6.2'
    text: |-
      Bovendien kunnen de bijkomende straffen, vermeld in [artikel 7][ref1], en de maatregelen, vermeld in
      [artikel 8][ref2], worden opgelegd, onverminderd de oplegging, in de daarvoor in aanmerking komende gevallen, van
      de maatregelen, elders in wettelijke bepalingen voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel8
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '8'
  - number: '6.3'
    text: |-
      In afwijking van het bepaalde in het eerste en tweede lid wordt hij, die een voorschrift, gesteld krachtens
      [artikel 15, tweede lid, van de Distributiewet][ref1], overtreedt gestraft met hechtenis van ten hoogste twee
      maanden of geldboete van de eerste categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0001997#Artikel15
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0001997
        artikel: '15'
  - number: '6.4'
    text: |-
      In afwijking van het bepaalde in het eerste lid wordt hij die een voorschrift overtreedt, gesteld bij of krachtens
      de [artikelen 2][ref1] en [3, eerste lid, van de Uitvoeringswet verdrag chemische wapens][ref2], dan wel de
      [artikelen 2, eerste en derde lid][ref3], [3][ref4] en [4 van de Uitvoeringswet verdrag biologische wapens][ref5],
      gestraft met gevangenisstraf van ten hoogste acht jaren of geldboete van de vijfde
      categorie, indien het feit opzettelijk is begaan met een terroristisch oogmerk als bedoeld in
      [artikel 83a van het Wetboek van Strafrecht][ref6], dan wel met het oogmerk om een terroristisch misdrijf als
      bedoeld in [artikel 83 van dat wetboek][ref7] voor te bereiden of gemakkelijk te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0007434#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007434#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0003385#Artikel2
      [ref4]: https://wetten.overheid.nl/BWBR0003385#Artikel3
      [ref5]: https://wetten.overheid.nl/BWBR0003385#Artikel4
      [ref6]: https://wetten.overheid.nl/BWBR0001854#Artikel83a
      [ref7]: https://wetten.overheid.nl/BWBR0001854#Artikel83
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007434
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0007434
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0003385
        artikel: '2'
      - id: ref4
        bwb_id: BWBR0003385
        artikel: '3'
      - id: ref5
        bwb_id: BWBR0003385
        artikel: '4'
      - id: ref6
        bwb_id: BWBR0001854
        artikel: 83a
      - id: ref7
        bwb_id: BWBR0001854
        artikel: '83'
  - number: '7'
    text: 'De bijkomende straffen zijn:'
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel7
  - number: 7.a
    text: |-
      ontzetting van de rechten, genoemd in
      [artikel 28, eerste lid, onder 1°, 2°, 4° en 5° van het Wetboek van Strafrecht][ref1], voor een tijd, de duur
      der vrijheidsstraf ten minste zes maanden en ten hoogste zes jaren te boven gaande, of, in geval van veroordeling
      tot geldboete als enige hoofdstraf, voor een tijd van ten minste zes maanden en ten hoogste zes jaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel28
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '28'
  - number: 7.c
    text: |-
      gehele of gedeeltelijke stillegging van de onderneming van de veroordeelde, waarin het economische delict is
      begaan, voor een tijd van ten hoogste een jaar;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel7
  - number: 7.d
    text: |-
      verbeurdverklaring van de voorwerpen, genoemd in [artikel 33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 33a
  - number: 7.e
    text: |-
      verbeurdverklaring van voorwerpen, behorende tot de onderneming van de veroordeelde, waarin het economische delict
      is begaan, voor zover zij soortgelijk zijn aan en met betrekking tot het delict verband houden met die, genoemd
      in [artikel 33][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel33a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: 33a
  - number: 7.f
    text: |-
      gehele of gedeeltelijke ontzetting van bepaalde rechten of gehele of gedeeltelijke ontzegging van bepaalde
      voordelen, welke rechten of voordelen de veroordeelde in verband met zijn onderneming van overheidswege zijn of
      zouden kunnen worden toegekend, voor een tijd van ten hoogste twee jaren;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel7
  - number: 7.g
    text: openbaarmaking van de rechterlijke uitspraak.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel7
  - number: '8'
    text: 'Maatregelen zijn:'
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel8
  - number: 8.a
    text: |-
      de maatregelen voorzien in [Titel IIA van het Eerste Boek van het Wetboek van Strafrecht][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: 8.b
    text: |-
      onderbewindstelling van de onderneming van de veroordeelde, waarin het economisch delict is begaan, in geval van
      misdrijf voor een tijd van ten hoogste drie jaren en in geval van overtreding voor een tijd van ten hoogste twee
      jaren;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel8
  - number: 8.c
    text: |-
      het opleggen van de verplichting tot verrichting van hetgeen wederrechtelijk is nagelaten, tenietdoening van
      hetgeen wederrechtelijk is verricht en verrichting van prestaties tot het goedmaken van een en ander, alles op
      kosten van de veroordeelde, voor zover de rechter niet anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel8
  - number: '9'
    text: |-
      De maatregelen vermeld in [artikel 8, onder b en c][ref1], kunnen te zamen met straffen en met andere maatregelen
      worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '8'
  - number: '10.1'
    text: |-
      Bij de uitspraak, waarbij een bijkomende straf of een maatregel, als vermeld in [artikel 8][ref1], wordt
      opgelegd, worden, voor zoveel nodig, alle bijzonderheden en gevolgen naar behoefte geregeld, daaronder begrepen
      bij onderbewindstelling de benoeming van een of meer bewindvoerders. Bij oplegging van een bijkomende straf als
      vermeld in [artikel 7, onder c][ref2], kan bovendien worden bevolen, dat de veroordeelde hem van overheidswege ten
      behoeve van zijn onderneming verstrekte bescheiden inlevert; in zijn onderneming aanwezige voorraden onder toezicht
      verkoopt; en zijn medewerking verleent bij inventarisatie van die voorraden.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '7'
  - number: '10.2'
    text: |-
      Onverminderd het bepaalde in [artikel 577b van het Wetboek van Strafvordering][ref1] kan de rechter die de
      bijkomende straf of maatregel heeft opgelegd, na ontvangst van een vordering van het openbaar ministerie of op
      verzoek van de veroordeelde bij latere beslissing alsnog een regeling geven als vorenbedoeld, dan wel in de reeds
      gegeven regeling wijziging brengen of terzake een aanvullende regeling geven. De behandeling van de zaak vindt
      plaats met gesloten deuren; de uitspraak geschiedt in het openbaar. De beslissing is met redenen omkleed; zij is
      niet aan enig rechtsmiddel onderworpen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel577b
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 577b
  - number: '10.3'
    text: Wij behouden Ons voor, nadere voorschriften te geven ter uitvoering van dit artikel.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel10
  - number: '11.1'
    text: |-
      Voor zover de rechter niet anders bepaalt, heeft een bewindvoerder, krachtens het voorgaande artikel
      of [artikel 29][ref1] benoemd, dezelfde rechten en verplichtingen als de bewindvoerder, bedoeld in
      [artikel 409 van Boek 1 van het Burgerlijk Wetboek][ref2], en kan zonder zijn machtiging geen ander persoon enige
      daad van beheer in de onderneming verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0002656#Artikel409
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0002656
        artikel: '409'
  - number: '11.2'
    text: |-
      De beschikking tot onderbewindstelling wordt door de griffier van het gerecht in feitelijke aanleg, dat de
      beschikking heeft gegeven, openbaar gemaakt in de *Nederlandse Staatscourant* en in één of meer door de rechter
      aan te wijzen nieuwsbladen. De beschikking tot onderbewindstelling wordt in het handelsregister ingeschreven met
      toepassing van het krachtens de [Handelsregisterwet 1996][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007893
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007893
  - number: '13.1'
    text: Het recht tot uitvoering van verbeurdverklaring vervalt niet door de dood van de veroordeelde.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel13
  - number: '13.2'
    text: |-
      De in [artikel 8 onder b][ref1] vermelde maatregel vervalt door de dood van de veroordeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '8'
  - number: '14'
    text: |-
      De tenuitvoerlegging van een veroordeling tot de betaling van kosten, andere dan die van openbaarmaking van de
      rechterlijke uitspraak, geschiedt op de wijze van de tenuitvoerlegging ener veroordeling tot geldboete, met dien
      verstande, dat geen vervangende vrijheidsstraf wordt toegepast.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel14
  - number: '16.1'
    text: |-
      Indien aannemelijk is dat iemand die, alvorens in zijn zaak een onherroepelijke uitspraak is gedaan, is overleden,
      zich heeft schuldig gemaakt aan een economisch delict, kan de rechter bij beschikking op de vordering van het
      openbaar ministerie:
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: 16.1.a
    text: |-
      de verbeurdverklaring van reeds in beslag genomen voorwerpen uitspreken; artikel 10 vindt overeenkomstige
      toepassing;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: 16.1.b
    text: ten laste van de boedel van de overledene de in artikel 8, onder *c* vermelde maatregel opleggen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: '16.2'
    text: |-
      De beschikking wordt door de griffier openbaar gemaakt in de *Nederlandse Staatscourant* en in een of meer door
      de rechter aan te wijzen nieuwsbladen, terwijl bovendien een afschrift van de beschikking aan het sterfhuis wordt
      betekend.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: '16.3'
    text: |-
      Elke belanghebbende kan binnen drie maanden na de in het vorige lid bedoelde openbaarmaking of betekening een
      bezwaarschrift ter griffie indienen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: '16.4'
    text: De officier van justitie wordt gehoord; de belanghebbende wordt gehoord, althans behoorlijk opgeroepen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: '16.5'
    text: De rechter geeft een met redenen omklede beslissing; deze is niet aan enig rechtsmiddel onderworpen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: '16.6'
    text: |-
      Het in het eerste lid, in de aanhef en onder *a*, in het derde, het vierde en in het vijfde lid, bepaalde
      geldt mede, indien aannemelijk is, dat een onbekende zich schuldig heeft gemaakt aan een economisch delict. De
      beschikking wordt door de griffier openbaar gemaakt in de *Nederlandse Staatscourant* en in één of meer door de
      rechter aan te wijzen nieuwsbladen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel16
  - number: '17.1'
    text: 'Met de opsporing van economische delicten zijn belast:'
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel17
  - number: 17.1.1°
    text: |-
      de bij of krachtens [artikel 141 van het Wetboek van Strafvordering][ref1] aangewezen ambtenaren;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: 17.1.2°
    text: |-
      de door Onze Minister van Justitie, in overeenstemming met Onze andere Ministers, wie het aangaat, aangewezen
      ambtenaren;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel17
  - number: 17.1.3°
    text: de ambtenaren van de rijksbelastingdienst, bevoegd inzake douane.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel17
  - number: '17.2'
    text: |-
      Alle met de opsporing van economische delicten belaste ambtenaren zijn tevens belast met de opsporing van de
      economische delicten, genoemd in de [artikelen 26][ref1], [33][ref2] en [34][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel33
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel34
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '26'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '33'
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '34'
  - number: '17.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gegeven omtrent de beëdiging van de opsporingsambtenaren, voor
      zover daarin niet reeds is voorzien.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel17
  - number: '17.4'
    text: |-
      Van een besluit als bedoeld in het eerste lid, onder 2°, wordt mededeling gedaan door plaatsing in de
      Staatscourant.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel17
  - number: '18.1'
    text: |-
      De opsporingsambtenaren zijn in het belang van de opsporing bevoegd tot inbeslagneming van daarvoor vatbare
      voorwerpen voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij kunnen daartoe hun
      uitlevering vorderen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel18
  - number: '18.2'
    text: |-
      Voor inbeslagneming van voorwerpen ter verbeurdverklaring uit hoofde van [artikel 7, onder e][ref1], behoeven zij
      evenwel de machtiging van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '7'
  - number: '19.1'
    text: |-
      De opsporingsambtenaren zijn in het belang van de opsporing bevoegd inzage te vorderen van gegevens en bescheiden,
      voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel19
  - number: '19.2'
    text: Zij zijn bevoegd van de gegevens en bescheiden kopieën te maken.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel19
  - number: '19.3'
    text: |-
      Indien het maken van kopieën niet ter plaatse kan geschieden, zijn zij bevoegd de gegevens en bescheiden voor dat
      doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel19
  - number: '20'
    text: |-
      De opsporingsambtenaren hebben in het belang van de opsporing toegang tot elke plaats, voor zover dat
      redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel20
  - number: '21.1'
    text: |-
      De opsporingsambtenaren zijn bevoegd in het belang van de opsporing zaken te onderzoeken, aan opneming te
      onderwerpen en daarvan monsters te nemen, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel21
  - number: '21.2'
    text: Zij zijn bevoegd daartoe verpakkingen te openen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel21
  - number: '21.3'
    text: |-
      Zij nemen op verzoek van de belanghebbende indien mogelijk een tweede monster, tenzij bij of krachtens wettelijk
      voorschrift anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel21
  - number: '21.4'
    text: |-
      Indien het onderzoek, de opneming of de monsterneming niet ter plaatse kan geschieden, zijn zij bevoegd de zaken
      voor dat doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel21
  - number: '21.5'
    text: De genomen monsters worden voor zover mogelijk teruggegeven.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel21
  - number: '21.6'
    text: |-
      De belanghebbende wordt op zijn verzoek zo spoedig mogelijk in kennis gesteld van de resultaten van het onderzoek,
      de opneming of de monsterneming.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel21
  - number: '23.1'
    text: |-
      De opsporingsambtenaren zijn bevoegd in het belang van de opsporing vervoermiddelen te onderzoeken met het oog op
      de naleving van de voorschriften, bedoeld in de [artikelen 1][ref1] en [1a][ref2], voor zover dat redelijkerwijs
      voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: '23.2'
    text: |-
      Zij zijn bevoegd in het belang van de opsporing vervoermiddelen waarmee naar hun redelijk oordeel zaken
      worden vervoerd op hun lading te onderzoeken met het oog op de naleving van de voorschriften, bedoeld in de
      [artikelen 1][ref1] en [1a][ref2], voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: '23.3'
    text: |-
      Zij zijn bevoegd van de bestuurder van een vervoermiddel inzage te vorderen van de wettelijk voorgeschreven
      bescheiden met het oog op de naleving van de voorschriften, bedoeld in de [artikelen 1][ref1] en [1a][ref2], voor
      zover dat redelijkerwijs voor de vervulling van hun taak nodig is.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
  - number: '23.4'
    text: |-
      Zij zijn bevoegd met het oog op de uitoefening van deze bevoegdheden van de bestuurder van een voertuig of van de
      schipper van een vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hem aangewezen plaats
      overbrengt, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23
  - number: '23.5'
    text: De kosten van overbrenging komen ten laste van de betrokkene, indien een strafbaar feit wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23
  - number: '23.6'
    text: De in dit artikel genoemde bevoegdheden kunnen tevens worden uitgeoefend jegens personen, die zaken vervoeren.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23
  - number: 23a.1
    text: |-
      Onder de opsporingsambtenaren, bedoeld in de [artikelen 18 tot en met 23][ref1], worden
      mede begrepen de ambtenaren, die ingevolge [artikel 83 van de Kernenergiewet][ref2],
      [artikel 28, eerste lid, van de Natuurbeschermingswet][ref3], artikel 30, onder 3°, van
      de Vogelwet 1936, artikel 8, eerste lid, van de Wet bedreigde uitheemse diersoorten,
      [artikel 96 van de Wet inzake de luchtverontreiniging][ref4], [artikel 11.1 van de Wet luchtvaart][ref5] of
      [artikel 44 van de Wet vervoer gevaarlijke stoffen][ref6], zijn belast met de opsporing van strafbare feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0002402#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0002611#Artikel28
      [ref4]: https://wetten.overheid.nl/BWBR0002731#Artikel96
      [ref5]: https://wetten.overheid.nl/BWBR0005555#Artikel11
      [ref6]: https://wetten.overheid.nl/BWBR0007606#Artikel44
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0002402
        artikel: '83'
      - id: ref3
        bwb_id: BWBR0002611
        artikel: '28'
      - id: ref4
        bwb_id: BWBR0002731
        artikel: '96'
      - id: ref5
        bwb_id: BWBR0005555
        artikel: '11'
      - id: ref6
        bwb_id: BWBR0007606
        artikel: '44'
  - number: 23a.2
    text: |-
      Bij de opsporing van overtredingen van voorschriften gesteld bij of krachtens de
      [Wet vervoer gevaarlijke stoffen][ref1] of [titel 6.5 van de Wet luchtvaart][ref2] komen de bevoegdheden, genoemd
      in [artikel 21][ref3], slechts toe aan de krachtens [artikel 44 van de Wet vervoer gevaarlijke stoffen][ref4]
      of krachtens [artikel 11.1 van de Wet luchtvaart][ref5] aangewezen ambtenaren van het Ministerie van Verkeer en
      Waterstaat en van het militair Korps controleurs gevaarlijke stoffen.


      [ref1]: https://wetten.overheid.nl/BWBR0007606
      [ref2]: https://wetten.overheid.nl/BWBR0005555
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel21
      [ref4]: https://wetten.overheid.nl/BWBR0007606#Artikel44
      [ref5]: https://wetten.overheid.nl/BWBR0005555
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel23a
    references:
      - id: ref1
        bwb_id: BWBR0007606
      - id: ref2
        bwb_id: BWBR0005555
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '21'
      - id: ref4
        bwb_id: BWBR0007606
        artikel: '44'
      - id: ref5
        bwb_id: BWBR0005555
  - number: '24.1'
    text: |-
      Onze Minister van Justitie en - na overleg met deze - elk Onzer andere Ministers, wie het aangaat,
      zijn bevoegd regelen te stellen omtrent de wijze, waarop de vordering tot stilhouden, omschreven in
      [artikel 23, vierde lid][ref1], wordt gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel23
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '23'
  - number: '24.2'
    text: |-
      Onze Minister van Justitie en elk Onzer andere Ministers, wie het aangaat, zijn bevoegd te bepalen, dat ter
      verzekering van de richtige opsporing van economische delicten op openbare land- en waterwegen versperringen worden
      aangebracht.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel24
  - number: 24a.1
    text: |-
      Een ieder is verplicht aan de opsporingsambtenaren binnen de door hen gestelde redelijke termijn alle medewerking
      te verlenen die deze redelijkerwijs kunnen vorderen bij de uitoefening van de hen krachtens deze titel toekomende
      bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel24a
  - number: 24a.2
    text: |-
      Zij die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen het verlenen
      van medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel24a
  - number: 24a.3
    text: |-
      De opsporingsambtenaren zijn bevoegd op kosten van de overtreder door feitelijk handelen op te treden tegen hetgeen
      in strijd met de in het eerste lid bedoelde verplichting is of wordt gedaan, gehouden of nagelaten, voor zover dat
      redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel24a
  - number: '25'
    text: |-
      Voor zover daarvan niet in deze wet of de in [artikel 1][ref1] en [artikel 1a][ref2] genoemde wetten en
      besluiten is afgeweken, gelden ten aanzien van de opsporing van economische delicten de bepalingen van het
      [Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0001903
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: 1a
      - id: ref3
        bwb_id: BWBR0001903
  - number: '26'
    text: |-
      Het opzettelijk niet voldoen aan een vordering, krachtens enig voorschrift van deze wet gedaan door een
      opsporingsambtenaar, is een economisch delict.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel26
  - number: '28.1'
    text: |-
      Indien tegen de verdachte ernstige bezwaren zijn gerezen en tevens de belangen, welke door het vermoedelijk
      overtreden voorschrift worden beschermd, een onmiddellijk ingrijpen vereisen, is de officier van justitie in
      alle zaken, economische delicten betreffende, met uitzondering van die, bedoeld in [artikel 6, derde lid][ref1],
      bevoegd, zolang de behandeling ter terechtzitting nog niet is aangevangen, de verdachte bij deze te betekenen
      kennisgeving als voorlopige maatregel te bevelen:


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel6
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '6'
  - number: 28.1.a
    text: zich te onthouden van bepaalde handelingen;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel28
  - number: 28.1.b
    text: |-
      zorg te dragen, dat in het bevel aangeduide voorwerpen, welke vatbaar zijn voor inbeslagneming, opgeslagen en
      bewaard worden ter plaatse, in het bevel aangegeven.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel28
  - number: '28.2'
    text: |-
      Op de vorengenoemde bevelen is [artikel 10, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel10
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '10'
  - number: '28.3'
    text: |-
      De vorengenoemde bevelen verliezen hun kracht door een tijdsverloop van zes maanden en blijven uiterlijk van
      kracht, totdat de rechterlijke einduitspraak in de zaak, waarin zij zijn gegeven, onherroepelijk is geworden. Zij
      kunnen tussentijds door de officier van justitie bij aan de verdachte te betekenen kennisgeving worden gewijzigd
      of ingetrokken of door het gerecht, waarvoor de zaak wordt vervolgd, worden gewijzigd of opgeheven. Het gerecht kan
      dit doen ambtshalve, op de voordracht van de rechter-commissaris, met het gerechtelijk vooronderzoek belast, of op
      het verzoek van de verdachte; deze wordt steeds gehoord, althans behoorlijk opgeroepen, tenzij:
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel28
  - number: 28.3.1°
    text: |-
      het gerecht reeds aanstonds tot wijziging overeenkomstig het verzoek van de verdachte dan wel tot opheffing
      besluit;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel28
  - number: 28.3.2°
    text: |-
      nog geen twee maanden zijn verstreken sedert op een vorig verzoek van de verdachte van gelijke strekking is
      beslist.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel28
  - number: '29.1'
    text: |-
      Indien tegen de verdachte ernstige bezwaren zijn gerezen en tevens de belangen, welke door het vermoedelijk
      overtreden voorschrift worden beschermd, een onmiddellijk ingrijpen vereisen, kan het gerecht in alle zaken,
      economische delicten betreffende, met uitzondering van die, bedoeld in [artikel 6, derde lid][ref1], vóór de
      behandeling ter terechtzitting, op de vordering van het openbaar ministerie, op de voordracht van de rechter-
      commissaris, met het gerechtelijk vooronderzoek belast, en, indien de zaak te zijner zitting wordt behandeld, mede
      ambtshalve, als voorlopige maatregel bevelen:


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel6
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '6'
  - number: 29.1.a
    text: |-
      gehele of gedeeltelijke stillegging van de onderneming van de verdachte, waarin het economische delict wordt
      vermoed te zijn begaan;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: 29.1.b
    text: |-
      onderbewindstelling van de onderneming van de verdachte, waarin het economische delict wordt vermoed te zijn
      begaan;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: 29.1.c
    text: |-
      gehele of gedeeltelijke ontzetting van bepaalde rechten of gehele of gedeeltelijke ontzegging van bepaalde
      voordelen, welke rechten of voordelen de verdachte in verband met zijn onderneming van overheidswege zijn of zouden
      kunnen worden toegekend;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: 29.1.d
    text: dat de verdachte zich onthoude van bepaalde handelingen;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: 29.1.e
    text: |-
      dat de verdachte zorg drage, dat in het bevel aangeduide voorwerpen, welke vatbaar zijn voor inbeslagneming,
      opgeslagen en bewaard worden ter plaatse, in het bevel aangegeven.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: '29.2'
    text: |-
      Op de vorengenoemde bevelen is [artikel 10, eerste lid][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel10
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '10'
  - number: '29.3'
    text: |-
      De vorengenoemde bevelen verliezen hun kracht door een tijdsverloop van zes maanden en blijven uiterlijk van kracht
      totdat de rechterlijke einduitspraak in de zaak, waarin zij zijn gegeven, onherroepelijk is geworden. Zij kunnen
      door het gerecht, waarvoor de zaak wordt vervolgd, eenmaal met ten hoogste zes maanden worden verlengd en worden
      gewijzigd of opgeheven. Het gerecht kan dit doen ambtshalve, op de voordracht van de rechter-commissaris, met het
      gerechtelijk vooronderzoek belast, op de vordering van het openbaar ministerie en, voor wat betreft wijziging of
      opheffing van de bevelen, tevens op het verzoek van de verdachte; deze wordt steeds gehoord, althans behoorlijk
      opgeroepen, tenzij:
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: 29.3.1°
    text: |-
      het gerecht reeds aanstonds tot wijziging overeenkomstig het verzoek van de verdachte dan wel tot opheffing
      besluit;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: 29.3.2°
    text: |-
      nog geen twee maanden zijn verstreken sedert op een vorig verzoek van de verdachte van gelijke strekking is
      beslist.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel29
  - number: '30.1'
    text: |-
      Van de in de [artikelen 28][ref1] en [29][ref2] bedoelde rechterlijke bevelen en beschikkingen kan het openbaar
      ministerie binnen veertien dagen en de verdachte binnen veertien dagen na de betekening in beroep komen bij het
      gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel29
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '29'
  - number: '30.2'
    text: Het hof beslist zo spoedig mogelijk. De verdachte wordt gehoord, althans behoorlijk opgeroepen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel30
  - number: 30a.1
    text: |-
      Van de beschikking van het hof kan het openbaar ministerie binnen veertien dagen en de verdachte binnen veertien
      dagen na de betekening beroep in cassatie instellen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel30a
  - number: 30a.2
    text: |-
      De verdachte is, op straffe van niet-ontvankelijkheid, verplicht binnen een maand na het instellen van dat beroep
      bij de Hoge Raad der Nederlanden door een advocaat een schriftuur te doen indienen, houdende zijn middelen van
      cassatie.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel30a
  - number: 30a.3
    text: |-
      [Artikel 57][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel57
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel30a
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '57'
  - number: 30a.4
    text: De Hoge Raad beslist zo spoedig mogelijk.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel30a
  - number: '31'
    text: |-
      De in de [artikelen 28][ref1], [29][ref2], [30][ref3] en [30a][ref4] bedoelde bevelen en beschikkingen zijn
      dadelijk uitvoerbaar. Zij worden onverwijld aan de verdachte betekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel29
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel30
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel30a
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '28'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '29'
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '30'
      - id: ref4
        bwb_id: BWBR0002063
        artikel: 30a
  - number: '32.1'
    text: |-
      Indien de zaak eindigt hetzij zonder oplegging van straf of maatregel, hetzij met oplegging van een zodanige straf
      of maatregel, dat de opgelegde voorlopige maatregel als onevenredig hard moet worden beschouwd, kan het gerecht,
      op verzoek van de gewezen verdachte of van zijn erfgenamen, hem of zijn erfgenamen een geldelijke tegemoetkoming
      ten laste van de Staat toekennen voor de schade, welke hij ten gevolge van de opgelegde voorlopige maatregel
      werkelijk heeft geleden. Tot deze toekenning is bevoegd het gerecht in feitelijke aanleg, waarvoor de zaak tijdens
      de beëindiging daarvan werd vervolgd of anders het laatst werd vervolgd.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel32
  - number: '32.2'
    text: |-
      De [artikelen 89, derde en vierde lid][ref1], [90-91][ref2] en [93 van het Wetboek van Strafvordering][ref3] vinden
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '89'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '90'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: '93'
  - number: '32.3'
    text: |-
      Indien de gewezen verdachte na het indienen van zijn verzoek of na de instelling van hoger beroep overleden is,
      geschiedt de toekenning ten behoeve van zijn erfgenamen.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel32
  - number: '33'
    text: |-
      Het opzettelijk handelen of nalaten in strijd met een bijkomende straf, als bedoeld in
      [artikel 7, onder a, c of f][ref1], een maatregel, als vermeld in [artikel 8][ref2], een regeling, als bedoeld
      in [artikel 10][ref3], of een voorlopige maatregel, of het ontduiken van zodanige bijkomende straf, maatregel,
      regeling of voorlopige maatregel is een economisch delict.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel10
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel33
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '8'
      - id: ref3
        bwb_id: BWBR0002063
        artikel: '10'
  - number: '34'
    text: |-
      Het opzettelijk, al dan niet door middel van een ander, onttrekken van vermogensbestanddelen aan verhaal of
      tenuitvoerlegging van een krachtens deze wet opgelegde straf, maatregel of voorlopige maatregel is een economisch
      delict.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel34
  - number: '35.1'
    text: |-
      Rechtshandelingen in strijd met het bepaalde in de [artikelen 33][ref1] en [34][ref2] zijn nietig.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel33
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel34
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '33'
      - id: ref2
        bwb_id: BWBR0002063
        artikel: '34'
  - number: '35.2'
    text: |-
      Op de nietigheid kan geen beroep worden gedaan ten nadele van hem, die van de oplegging van de straf, de maatregel
      of de voorlopige maatregel onkundig was, tenzij hij ernstige reden had het bestaan er van te vermoeden.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel35
  - number: '35.3'
    text: |-
      Ten aanzien van de echtgenoot of geregistreerde partner, de bloed- of aanverwanten tot in de derde graad en de
      personen in dienst van degene, te wiens laste de straf, de maatregel of de voorlopige maatregel is uitgesproken,
      wordt aangenomen, dat zij ernstige reden hebben gehad de oplegging van de straf, de maatregel of de voorlopige
      maatregel te vermoeden, behoudens tegenbewijs.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel35
  - number: '36'
    text: |-
      Bij toepassing van [artikel 74 van het Wetboek van Strafrecht][ref1] kan ter voorkoming van de strafvervolging
      wegens economische delicten naast de aldaar in het tweede lid genoemde voorwaarden, als voorwaarde worden gesteld
      dat wordt verricht hetgeen wederrechtelijk is nagelaten, tenietgedaan hetgeen wederrechtelijk is verricht en dat
      prestaties tot het goedmaken van een en ander worden verricht, alles op kosten van de verdachte, voor zover niet
      anders wordt bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '37.1'
    text: |-
      Wij behouden Ons voor, op de voordracht van Onze Minister van Justitie, gedaan na overleg met Onze andere
      Ministers, wie het aangaat, aan door Ons bijzonderlijk hiertoe aangewezen lichamen of personen, met een publieke
      taak belast, binnen door Ons te stellen grenzen tot wederopzeggens toe de bevoegdheid te verlenen, die bij
      [artikel 74 van het Wetboek van Strafrecht][ref1] aan de officier van justitie is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0001854#Artikel74
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0001854
        artikel: '74'
  - number: '37.2'
    text: |-
      De personen en lichamen, bekleed met de bevoegdheid, bedoeld in het eerste lid, maken hiervan gebruik onder
      toezicht van en volgens richtlijnen, te geven door het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel37
  - number: '38'
    text: |-
      De kennisneming van economische delicten in eerste aanleg is bij uitsluiting opgedragen aan de rechtbank.
      Economische delicten worden behandeld en beslist door de economische kamers van de rechtbank, bedoeld in
      [artikel 52 van Wet op de rechterlijke organisatie][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel52
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '52'
  - number: '39.1'
    text: |-
      De economische kamers van de rechtbank, bedoeld in [artikel 52 van de Wet op de rechterlijke organisatie][ref1],
      behandelen en beslissen ook zaken betreffende strafbare feiten die geen economische delicten zijn, indien de
      rechtbank bevoegd is tot kennisneming van die strafbare feiten en die strafbare feiten zijn begaan in samenhang
      met een of meer economische delicten, en die strafbare feiten ten laste zijn gelegd samen met een of meer van die
      economische delicten.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel52
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '52'
  - number: '39.2'
    text: |-
      Berechting door een andere dan de economische kamer is mogelijk indien economische delicten zijn begaan in
      samenhang met een of meer strafbare feiten, niet zijnde economische delicten waarvan de rechtbank bevoegd is kennis
      te nemen en die economische delicten ten laste zijn gelegd samen met een of meer van die andere strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel39
  - number: '43'
    text: De economische kamers kunnen ook zitting houden buiten de plaats, waar de zetel van de rechtbank gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel43
  - number: '45'
    text: |-
      De bepalingen van deze titel brengen geen wijziging in de bevoegdheden van de kinderrechter, behoudens het bepaalde
      in [artikel 38][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel38
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '38'
  - number: '46'
    text: De behandeling door de raadkamer vindt plaats in het openbaar.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel46
  - number: '47'
    text: |-
      In afwijking in zoverre van het bepaalde in [artikel 261 van het Wetboek van Strafvordering][ref1] kan voor de
      dagvaarding betreffende een economisch delict worden volstaan met een korte aanduiding van het feit, dat te laste
      wordt gelegd, met vermelding omstreeks welke tijd en waar ter plaatse het begaan zou zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel261
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '261'
  - number: '48.1'
    text: |-
      Op het rechtgeding voor de economische politierechter zijn de [artikelen 367 tot en met 381][ref1], alsmede
      [398, onder 2°, van het Wetboek van Strafvordering][ref2] van overeenkomstige toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel367
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel398
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '367'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '398'
  - number: 48.1.1°
    text: |-
      in afwijking van [artikel 376, eerste lid][ref1], indien de dagvaarding enkel inhoudt een korte aanduiding en
      vermelding als bedoeld in het vorige artikel, de officier van justitie ter terechtzitting bij de aanvang van het
      onderzoek mondeling of, na voorlezing, schriftelijk nadere opgave van het feit kan doen en alsdan tot die nadere
      opgave verplicht is, indien naar het oordeel van de rechter de verdachte door die enkele aanduiding en vermelding
      in zijn verdediging benadeeld zou worden;


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel376
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '376'
  - number: 48.1.2°
    text: |-
      schorsing van het onderzoek eveneens geschiedt, indien de officier van justitie uitstel verzoekt voor het doen van
      nadere opgave van het feit.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel48
  - number: '48.2'
    text: |-
      Het bepaalde in het eerste lid, onder 1°-2°, vindt overeenkomstige toepassing, indien bij dagvaarding voor de
      meervoudige kamer is volstaan met een korte aanduiding en vermelding als bedoeld in [artikel 47][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel47
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '47'
  - number: '52'
    text: |-
      De economische kamers van de gerechtshoven, bedoeld in [artikel 64 van de Wet op de rechterlijke organisatie][ref1],
      behandelen en beslissen uitsluitend zaken waarin door de economische kamers van de rechtbanken vonnis is gewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001830#Artikel64
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0001830
        artikel: '64'
  - number: '53.1'
    text: In zaken betreffende economische delicten treedt als raadkamer een economische kamer op.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel53
  - number: '53.2'
    text: De behandeling door de raadkamer vindt plaats in het openbaar.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel53
  - number: '54'
    text: De economische kamers kunnen ook zitting houden buiten de plaats, waar de zetel van het hof gevestigd is.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel54
  - number: '58'
    text: |-
      In overleg met Onze Minister van Justitie kunnen lichamen met een publieke taak belast, hiertoe bevoegd verklaard
      door een Onzer andere Ministers, wie het aangaat, ten dienste van de opsporing, vervolging en berechting van
      economische delicten ambtenaren benoemen, die het contact onderhouden met het openbaar ministerie.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel58
  - number: '59'
    text: |-
      Van de ambtenaren van de Fiscale Inlichtingen- en Opsporingsdienst zijn degenen, die daartoe door Onze Minister
      van Justitie zijn aangewezen, hulpofficier van justitie ten aanzien van het voorbereidende onderzoek naar de
      overtredingen der voorschriften gesteld bij of krachtens de [Wet financiële betrekkingen buitenland 1994][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006547
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0006547
  - number: '60.1'
    text: Het Besluit berechting economische delicten (*Staatsblad* No. E 135) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel60
  - number: '60.2'
    text: |-
      Zaken, betreffende overtredingen van de voorschriften, genoemd in [artikel 1][ref1], op het tijdstip van
      inwerkingtreding van deze wet bij een kantonrechter, een arrondissements-rechtbank, een gerechtshof of de Hoge Raad
      der Nederlanden aanhangig, worden, onverminderd [artikel 1, tweede lid, van het Wetboek van Strafrecht][ref2] en
      het vierde lid van dit artikel, afgedaan volgens de tot op dat tijdstip geldende regelen.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel1
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0001854
        artikel: '1'
  - number: '60.3'
    text: |-
      Zaken, op het tijdstip van inwerkingtreding van deze wet bij een tuchtrechter voor de prijzen aanhangig, worden
      bij de arrondissements-rechtbank opnieuw aanhangig gemaakt. Is echter de behandeling door de tuchtrechter zover
      gevorderd, dat nog slechts een einduitspraak behoeft te worden gedaan, dan doet de tuchtrechter uitspraak met
      inachtneming van de regelen, geldende tot evengenoemd tijdstip.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel60
  - number: '60.4'
    text: |-
      Voor zover zaken betreffende overtredingen van voorschriften, genoemd in [artikel 1][ref1], op het tijdstip van
      inwerkingtreding van deze wet nog niet in hoger beroep aanhangig zijn, geschiedt behandeling in hoger beroep bij
      uitsluiting door het gerechtshof binnen welks rechtsgebied de rechter bevoegd was, die in eerste aanleg uitspraak
      heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '1'
  - number: '60.5'
    text: |-
      Met betrekking tot de tenuitvoerlegging van uitspraken van tuchtrechters voor de prijzen treedt in de plaats
      van de tuchtrechter voor de prijzen het openbaar ministerie bij de rechtbank van het arrondissement, waarin de
      tuchtrechter bevoegd was.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel60
  - number: '60.6'
    text: |-
      De ingevolge het Besluit berechting economische delicten opgelegde bijkomende straffen, bedoeld in artikel 1,
      eerste lid, II, onder *a* en *b*, van dit besluit, worden geacht te zijn bijkomende straffen, als bedoeld in
      [artikel 7, eerste lid, onderscheidenlijk onder ][ref1]; zij worden geacht te zijn opgelegd krachtens deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '7'
  - number: '62.1'
    text: Het Besluit voorlopige tuchtmaatregelen voedselvoorziening (*Staatsblad*, No. F 284) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel62
  - number: '62.2'
    text: |-
      De voorlopige tuchtmaatregelen, op het tijdstip van inwerkingtreding van deze wet van kracht, worden gehandhaafd.
      Het bepaalde in de [Titels IV][ref1] en [V][ref2] is op deze maatregelen van toepassing, met dien verstande, dat:


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002063
      - id: ref2
        bwb_id: BWBR0002063
  - number: 62.2.a
    text: |-
      voorlopige tuchtmaatregelen, bevolen door een ambtenaar voor de tuchtrechtspraak, worden geacht te zijn bevolen
      door de officier van justitie bij de rechtbank van het arrondissement, waarin de ambtenaar voor de tuchtrechtspraak
      bevoegd was;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel62
  - number: 62.2.b
    text: |-
      voorlopige tuchtmaatregelen, bevolen door een tuchtrechter voor de voedselvoorziening, worden geacht te zijn
      bevolen door de rechtbank van het arrondissement, waarin de tuchtrechter bevoegd was;
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel62
  - number: 62.2.c
    text: |-
      voorlopige tuchtmaatregelen, bevolen door het Centraal College voor de Tuchtrechtspraak, worden geacht te zijn
      bevolen door het gerechtshof binnen welks rechtsgebied de tuchtrechter bevoegd was, die in eerste aanleg uitspraak
      heeft gedaan.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel62
  - number: '63.1'
    text: |-
      De wet van 24 Mei 1947, tot opneming van de mogelijkheid van voorlopige maatregelen ter zake van overtreding van
      prijsvoorschriften (*Staatsblad* No. H 156) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel63
  - number: '63.2'
    text: |-
      De voorlopige maatregelen, op het tijdstip van inwerkingtreding van deze wet van kracht, worden, gedurende
      hoogstens zes maanden nadat zij zijn genomen, gehandhaafd. Het bepaalde in de [Titels IV][ref1] en [V][ref2] is
      overigens op deze maatregelen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002063
      [ref2]: https://wetten.overheid.nl/BWBR0002063
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0002063
      - id: ref2
        bwb_id: BWBR0002063
  - number: '87.1'
    text: |-
      Deze wet treedt in werking op een nader door Ons te bepalen tijdstip, dat voor onderscheidene groepen van
      economische delicten en voor onderscheidene voorschriften verschillend kan zijn.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel87
  - number: '87.2'
    text: Zij kan worden aangehaald als 'Wet op de economische delicten'.
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel87
