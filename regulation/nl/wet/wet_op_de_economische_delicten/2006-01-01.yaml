preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, het Besluit berechting economische delicten
    te vervangen door een wet, die de doeltreffendheid bevordert van de opsporing, vervolging en berechting van
    handelingen, welke schadelijk zijn voor het economische leven, en die in het bijzonder daarin meer eenheid brengt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Economische delicten zijn:'
    url: https://wetten.overheid.nl/BWBR0002063/2006-01-01#Artikel1
  - number: 1.1°
    text: |-
      overtredingen van voorschriften, gesteld bij of krachtens: de [Distributiewet][ref1], de [artikelen 4][ref2],
      [5][ref3], [6][ref4], [7][ref5], [8][ref6], [15, tweede, vierde en vijfde lid][ref7], [16][ref8]
      en [17][ref9]; de [Diergeneesmiddelenwet][ref10], de [artikelen 2, eerste lid][ref11], [7][ref12],
      [13][ref13], [17, eerste lid][ref14], [18][ref15], [21, eerste lid][ref16], [24, tweede lid][ref17],
      [30, eerste lid][ref18], [31, eerste lid][ref19], [32][ref20], [33][ref21], [37, eerste lid][ref22],
      [38][ref23], [44, eerste lid][ref24], en [49][ref25]; de [Gezondheids- en welzijnswet voor dieren]
      (onbekend), de [artikelen 17 tot en met 21][ref26], [25][ref27], [26][ref28], [29][ref29], [30][ref30],
      [31b][ref31], [98][ref32], [100][ref33] en [101a][ref34]; de [Hamsterwet][ref35], de [artikelen 3][ref36]
      en [4][ref37]; de [In- en uitvoerwet][ref38], de [artikelen 2, eerste en vierde lid][ref39],
      [2a, eerste, derde en vijfde lid][ref40], [5][ref41], [7, eerste lid][ref42], en [18][ref43], voor zover
      betrekking hebbende op goederen die in een krachtens [die wet][ref44] vastgesteld invoer- of uitvoerbesluit
      onderscheidenlijk krachtens [artikel 2, vierde lid][ref45], of [7, eerste lid, van die wet][ref46] vastgestelde
      ministeriële regeling worden aangemerkt als strategische goederen, [artikel 2a, zesde lid][ref47], en
      [artikel 3][ref48]; de [Kaderwet diervoeders][ref49], de [artikelen 2][ref50], [3][ref51], [4][ref52],
      [5][ref53], [7][ref54], [8][ref55], [9][ref56], [16][ref57], [26][ref58], [27][ref59], [28][ref60], [29][ref61],
      [31][ref62], [32][ref63], [33, onderdelen a, b, c en e][ref64], [34][ref65], [37][ref66] en [39][ref67]; de
      [Landbouwwet][ref68], [artikel 19][ref69]; de [Noodwet financieel verkeer][ref70], de [artikelen 3][ref71],
      [4][ref72], [5][ref73], [6][ref74], [11][ref75], [12][ref76], [17][ref77], [18][ref78], [26][ref79] en
      [28, tweede lid][ref80]; de [Noodwet voedselvoorziening][ref81], de [artikelen 6][ref82], [7][ref83],
      [9][ref84], [10][ref85], [11, tweede lid][ref86], [12][ref87], [13][ref88], [22][ref89], [23][ref90],
      [24, eerste lid][ref91], [25][ref92] en [29][ref93]; de [Overgangswet elektriciteitsproductiesector][ref94],
      de [artikelen 8, tweede lid][ref95], en [12][ref96]; de [Prijzennoodwet][ref97], de [artikelen 5][ref98],
      [6, tweede lid][ref99], en - voor zover aangeduid als strafbare feiten - [8][ref100] en [9][ref101]; de
      [Sanctiewet 1977][ref102], de [artikelen 2][ref103], [7][ref104] en [9][ref105], voor zover betrekking hebbend
      op de onderwerpen, bedoeld in [artikel 3][ref106]; de [Spoorwegwet][ref107], [artikel 96, tweede lid][ref108];
      de [Telecommunicatiewet][ref109], de [artikelen 3.3, eerste lid][ref110], [3.10][ref111], [10.5][ref112],
      [10.16, eerste lid][ref113], [10.19, eerste lid][ref114], [15.2a][ref115], [18.8][ref116] en [18.9][ref117];
      de [Uitvoeringswet verdrag biologische wapens][ref118], de [artikelen 2, eerste en derde lid][ref119],
      [3][ref120] en [4][ref121]; de [Uitvoeringswet verdrag chemische wapens][ref122], de
      [artikelen 2][ref123] en [3, eerste lid][ref124]; de [Waterleidingwet][ref125], [artikel 3i][ref126];
      de [Wet goedkeuring en uitvoering Markham-overeenkomst][ref127][artikel 6][ref128]; de
      [Wet financiële betrekkingen buitenland 1994][ref129], [artikel 5, eerste lid][ref130]; de
      [Wet op de geneesmiddelenvoorziening][ref131], de [artikelen 2, derde lid][ref132] en [3, vierde lid][ref133];
      de [Wet voorkoming misbruik chemicaliën][ref134], [artikelen 2][ref135], [3][ref136], [5][ref137],
      [10 onder ][ref138], en [12][ref139].


