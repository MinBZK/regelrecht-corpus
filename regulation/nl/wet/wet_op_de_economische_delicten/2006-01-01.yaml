    text: |-
      overtredingen van voorschriften, gesteld bij of krachtens: de [Bestrijdingsmiddelenwet 1962][ref1],
      de [artikelen 2, vijfde, zesde en zevende lid][ref2], [5a, derde lid][ref3], ,
      [10, tweede lid][ref4], [11][ref5], [11a][ref6], [12][ref7] en [13a tot en met 15][ref8];
      de [Destructiewet][ref9], de [artikelen 3, eerste, tweede en derde lid][ref10], [4a][ref11],
      [6][ref12], [9][ref13], [10, eerste en vijfde lid][ref14], [11][ref15], [12][ref16],
      [13, eerste, tweede, derde, vierde en vijfde lid][ref17], [15][ref18], [17, eerste lid][ref19],
      en [25, vierde lid][ref20]; de [Flora- en faunawet][ref21], de [artikelen 10][ref22], [16][ref23],
      [37, eerste en tweede lid][ref24], [38, eerste lid][ref25], [50, eerste, tweede en derde lid][ref26], [51][ref27],
      [52][ref28], [53][ref29], [54, eerste lid][ref30], [58][ref31], [59, tweede lid][ref32], [60, vijfde lid][ref33],
      [62, eerste lid][ref34], [63, eerste lid][ref35], [64, tweede lid][ref36], [67, zesde lid][ref37],
      [72, vijfde lid][ref38], [74, eerste lid][ref39], [74a, eerste lid][ref40], [79, tweede lid][ref41],
      [81, eerste lid][ref42], en [111, eerste lid][ref43]. de [Grondwaterwet][ref44], [artikel 11][ref45]; de
      [Kernenergiewet][ref46], de [artikelen 36, eerste lid][ref47], en - voor zover aangeduid als strafbare feiten -
      [73][ref48]; de [Meststoffenwet][ref49], de [artikelen 3][ref50], [4][ref51], [5][ref52], [5c, tweede lid][ref53],
      [5e, vijfde lid][ref54], [5g, derde lid][ref55], [6][ref56], [6a][ref57], [59][ref58], [59a][ref59][59b][ref60],
      [59c][ref61], [59d, derde lid,][ref62] en [61][ref63]; de [Wet bescherming Antarctica][ref64], de
      [artikelen 19, tweede lid][ref65], en [33][ref66] de [Wet geluidhinder][ref67], de [artikelen 2][ref68],
      [3][ref69], [8][ref70], [9][ref71], [10][ref72], [170, tweede lid][ref73], en [175][ref74]; de
      [Wet inzake de luchtverontreiniging][ref75], de [artikelen 92, onder a][ref76], in verband met de
      [artikelen 13][ref77], [14][ref78] en [86, tweede lid][ref79], [92, onder c][ref80], en [92, onder d][ref81];
      de [Wet luchtvaart][ref82], de [artikelen 6.60, eerste lid][ref83], [6.61, tweede lid][ref84],
      [6.61a][ref85], en [6.62, tweede lid][ref86]. de [Wet milieubeheer][ref87], de [artikelen 10.23][ref88]
      – voor zover aangeduid als strafbare feiten – en [artikel 10.60, tweede lid, onder d en e][ref89]; de
      [Wet van 13 mei 1993, Stb. 283, tot uitbreiding en wijziging van de Wet milieubeheer (afvalstoffen)][ref90],
      [artikel VII][ref91], voor zover het betreft gemeentelijke verordeningen, vastgesteld krachtens artikel 2 van de
      Afvalstoffenwet; de [Wet vervoer gevaarlijke stoffen][ref92]: de [artikelen 47][ref93] en [48, tweede lid][ref94];
      de [Wet voorkoming verontreiniging door schepen][ref95], [artikel 12, tweede lid, onderdeel c][ref96].


