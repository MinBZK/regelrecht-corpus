      Rijnvaartakte (Trb. 1955, 161); het [Buitengewoon Besluit Arbeidsverhoudingen 1945][ref21], [artikel 8][ref22]; de
      [Drank- en Horecawet][ref23], de artikelen 2, 3, 4, 12 tot en met 19, 20, eerste tot en met zesde lid, 21, 22, 24,
      25, 25a tot en met 25d, 29, derde lid, 35, tweede en vierde lid, en 38; [Drinkwaterwet][ref24], de artikelen 14,
      36, 37, 42, eerste lid, 43, 44 en 47; de [Gezondheids- en welzijnswet voor dieren][ref25], de [artikelen 38][ref26],
      [45][ref27], 55, 65 en [76][ref28]; de [Handelsregisterwet 2007][ref29], de [artikelen 27][ref30]
