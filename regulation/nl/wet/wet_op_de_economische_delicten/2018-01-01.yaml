preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is, het Besluit berechting economische delicten
    te vervangen door een wet, die de doeltreffendheid bevordert van de opsporing, vervolging en berechting van
    handelingen, welke schadelijk zijn voor het economische leven, en die in het bijzonder daarin meer eenheid brengt;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002063/2018-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: 'Economische delicten zijn:'
    url: https://wetten.overheid.nl/BWBR0002063/2018-01-01#Artikel1
  - number: 1.1°
    text: |-
      overtredingen van voorschriften, gesteld bij of krachtens: de [Aanpassingswet Algemene douanewet][ref1],
      artikel XLIX, eerste lid; de [Algemene douanewet][ref2], de [artikelen 1:4, eerste en tweede lid][ref3], en
      [3:1][ref4], voorzover betrekking hebbend op goederen die ingevolge regelingen van internationaal of nationaal
      recht worden aangemerkt als strategische goederen; de [Arbeidsomstandighedenwet][ref5], de artikelen 6, eerste
      lid, eerste volzin, 28, zesde lid, 28a, zesde lid, 32, en – voor zover aangewezen als strafbare feiten – de
      artikelen 6, eerste lid, tweede volzin, en 16, tiende lid; de [Arbeidstijdenwet][ref6], de artikelen 8:3, 8:3a,
      zesde lid, en een niet naleven als bedoeld in artikel 11:3; de [Distributiewet][ref7], de [artikelen 4][ref8],
      [5][ref9], [6][ref10], [7][ref11], [8][ref12], [15, tweede, vierde en vijfde lid][ref13], [16][ref14] en
      [17][ref15]; [Drinkwaterwet][ref16], de artikelen: 4, eerste lid, 21, 22, 23, 25 tot en met 35, 38, 49 en 51;
      de [Geneesmiddelenwet][ref17], de artikelen 18, eerste lid, 28, eerste lid, 37, derde lid, 38, eerste lid,
      39, eerste lid, 40, eerste en tweede lid, 61, eerste lid, 62, eerste en derde lid, 67 en 67a, eerste lid; de
      [Gezondheids- en welzijnswet voor dieren][ref18], de [artikelen 17 tot en met 21][ref19], [25][ref20], [26][ref21],
      [29][ref22], [30][ref23], [31b][ref24], [81b][ref25], [81c][ref26], [98][ref27], [100][ref28] en [101a][ref29];
      de [Hamsterwet][ref30], de [artikelen 3][ref31] en [4][ref32]; de [Landbouwwet][ref33], [artikel 19][ref34]; de
      [Mijnbouwwet][ref35], de artikelen 6, 13, tweede lid, 22, vijfde lid, 23, 25, artikel 29, eerste en derde lid,
      31d, eerste lid, 31i, 33, 33a, 34, eerste en derde lid, 36, tweede en derde lid, 39, 40, 41, 42, 43, 44, 45, 45b,
      45c, 45d, 45e, 45f, 45g, 45h, 45i, 45j, 45k, 45l, 45m, 45n, 45o, 45p, 45q, 46, 47, 48, 49, 50, 51, 52, 91, tweede
      lid, 102, 120, 123, 130 en 151; de [Noodwet financieel verkeer][ref36], de [artikelen 3][ref37], [4][ref38],
      [5][ref39], [6][ref40], [11][ref41], [12][ref42], [17][ref43], [18][ref44], [26][ref45] en [28, tweede lid][ref46];
      de [Noodwet voedselvoorziening][ref47], de [artikelen 6][ref48], [7][ref49], [9][ref50], [10][ref51],
      [11, tweede lid][ref52], [12][ref53], [13][ref54], [22][ref55], [23][ref56], [24, eerste lid][ref57], [25][ref58]
      en [29][ref59]; de [Overgangswet elektriciteitsproductiesector][ref60], de [artikelen 8, tweede lid][ref61],
      en [12][ref62]; de [Prijzennoodwet][ref63], de [artikelen 5][ref64], [6, tweede lid][ref65], en - voor zover
      aangeduid als strafbare feiten - [8][ref66] en [9][ref67]; de [Sanctiewet 1977][ref68], de [artikelen 2][ref69],
      [7][ref70] en [9][ref71], voor zover betrekking hebbend op de onderwerpen, bedoeld in [artikel 3][ref72]; de
      [Spoorwegwet][ref73], [artikel 96, tweede lid][ref74]; de [Telecommunicatiewet][ref75], de artikelen 3.13,
      eerste lid, 3.22, 10.1, 10.11, tweede lid, 10.15, eerste lid, 10.17, eerste lid, 11a.1, vijfde en zesde lid,
      en 18.9; de [Uitvoeringswet verdrag biologische wapens][ref76], de [artikelen 2, eerste en derde lid][ref77],
      [3][ref78] en [4][ref79]; de [Uitvoeringswet verdrag chemische wapens][ref80], de [artikelen 2][ref81] en
      [3, eerste lid][ref82]; de Verordening (EU) nr. 596/2014 van het Europees Parlement en de Raad van 16 april
      2014 betreffende marktmisbruik en inhoudende intrekking van Richtlijn 2003/6/EG van het Europees Parlement
      en de Raad en Richtlijnen 2003/124, 2003/125/EG en 2004/72/EG van de Commissie (PbEU 2014 L 173), de
      artikelen 14 en 15; de [Wet allocatie arbeidskrachten door intermediairs][ref83], artikel 22, zesde lid; de
      [Wet arbeid vreemdelingen][ref84], artikel 17b, zesde lid; de [Wet dieren][ref85], de artikelen 2.2, vijfde lid,
      negende en tiende lid voor wat betreft de onderwerpen, bedoeld in het tiende lid, onderdelen a en e en onderdeel
      r, voor zover dat onderdeel betrekking heeft op regels als bedoeld in onderdeel e, 2.7, eerste en tweede lid voor
      wat betreft de onderwerpen, bedoeld in het tweede lid, onderdeel a, onder 1°, 2.8, eerste lid, onderdeel b en
      c, 2.10, tweede tot en met vierde lid, 2.12, 2.17, 2.18, eerste en tweede lid, 2.19, eerste lid, 2.20, eerste en
      tweede lid voor wat betreft de onderwerpen, bedoeld in het tweede lid, onderdelen a, onder 1°, b, c, e en f, 2.21,
      eerste en derde lid, 2.22, eerste en derde lid, 2.25, eerste en derde lid, 3.1, eerste en tweede lid voor wat
      betreft de onderwerpen, bedoeld in het tweede lid, onderdelen a, b, d, f, i, j, k, l, m en n, 3.2, 5.1, derde lid,
      tweede volzin, 5.4, eerste lid, 5.5, eerste lid, 5.6, eerste en vijfde lid, 5.11, eerste lid, 5.12, eerste lid,
      5.15, eerste en vierde lid, 8.4, en artikel 2.8, eerste lid, onderdeel a, en derde en vierde lid voor wat betreft
      de onderwerpen, bedoeld in het vierde lid, onderdelen a, b en c, voor zover deze overtredingen plaatsvinden in de
      uitoefening van een bedrijf waar dieren van krachtens artikel 2.3, tweede lid, aangewezen soorten of categorieën,
      worden gehouden, artikel 5.10, eerste lid, voor zover deze overtredingen plaatsvinden in de uitoefening van een
      bedrijf, of een of meer van de voornoemde bepalingen in samenhang met artikel 6.2, eerste lid, artikel 6.4, eerste
      lid, of artikel 7.5, derde lid; de [Wet goedkeuring en uitvoering Markham-overeenkomst][ref86][artikel 6][ref87];
      de [Wet financiële betrekkingen buitenland 1994][ref88], [artikel 5, eerste lid][ref89]; de
      [Wet lokaal spoor, artikel 49, tweede lid][ref90]; de [Wet minimumloon en minimumvakantiebijslag][ref91],
      artikel 18i, zesde lid; de [Wet precursoren voor explosieven][ref92], artikel 3, eerste en tweede lid; de
      [Wet ruimtevaartactiviteiten][ref93], de [artikelen 3, eerste en derde lid][ref94], [7, derde lid][ref95], en
      [10][ref96]; de [Wet strategische diensten][ref97], de artikelen 2, eerste, tweede en vierde lid, 3, eerste lid,
      4, eerste, derde, vierde en vijfde lid, 5, eerste en tweede lid, 6, eerste en tweede lid, 7, eerste, tweede en
      derde lid, 8, 9, eerste lid, 10, eerste lid, 11, 15 en 22; de [Wet voorkoming misbruik chemicaliën][ref98], de
      [artikelen 2, onder a][ref99], en [4, tweede lid][ref100].


