      overtredingen van voorschriften, gesteld bij of krachtens: de [Elektriciteitswet 1998][ref1], artikel 86i, eerste
      lid; de [Gaswet][ref2], artikel 66h, eerste lid; de [Prijzenwet][ref3], de [artikelen 2][ref4], [3][ref5],
      en - voor zover aangeduid als strafbare feiten - [11][ref6]; de Verordening (EU) nr. 596/2014 van het Europees
      Parlement en de Raad van 16 april 2014 betreffende marktmisbruik en inhoudende intrekking van Richtlijn 2003/6/
      EG van het Europees Parlement en de Raad en Richtlijnen 2003/124, 2003/125/EG en 2004/72/EG van de Commissie
      (PbEU 2014 L 173), artikel 11; de [Warenwet][ref7], [artikel 21, tweede lid][ref8], [27, derde lid][ref9],
      [30, derde lid][ref10]; de [Wet op het financieel toezicht][ref11], de [artikelen 5:70, eerste lid][ref12],
      [5:72][ref13], [5:74, eerste en vierde lid][ref14], [5:76][ref15] en [5:77][ref16]; de [Wet luchtvaart][ref17],
      [artikel 6.52][ref18]; de [Wet op de kansspelen][ref19], de artikelen 1, eerste lid, onder a, b en d, 7c,
      tweede lid, 13, 14, 27, 30b, eerste lid, 30h, eerste lid, 30m, eerste lid, en 30t, eerste, tweede en vijfde
      lid; de [Wet personenvervoer 2000][ref20], de artikelen 7, 76, eerste lid, en 76e, tweede en derde lid; de
      [Woningwet][ref21], [artikel 29a][ref22].


