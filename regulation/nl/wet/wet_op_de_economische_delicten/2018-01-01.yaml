  - number: 1a.3°
    text: |-
      overtredingen van voorschriften, gesteld bij of krachtens: de [Kernenergiewet][ref1], de
      [artikelen 4, eerste lid][ref2], [36, eerste lid][ref3], en – voor zover aangeduid als strafbare
      feiten – [73][ref4]; de [Meststoffenwet][ref5], de [artikelen 4][ref6], [5][ref7], [6][ref8],
      [9, tweede en derde lid][ref9], [11, vijfde lid][ref10], [13, vierde lid][ref11], [15][ref12],
      [16][ref13], [34][ref14], [35][ref15], [36][ref16], [37][ref17], [38, derde lid][ref18], en [40][ref19]; de
      [Visserijwet 1963][ref20], de [artikelen 2a][ref21], [3][ref22] en [3a][ref23], voor zover de overtreding
      van die voorschriften in de EU- verordening ter uitvoering waarvan zij strekken niet als ernstige inbreuk
      wordt aangemerkt, [4][ref24], [7][ref25], voor zover wordt gevist met meer dan twee hengels of de peur,
      [9][ref26], [16][ref27] en [21][ref28], voor zover wordt gevist met de hengel of de peur, dan wel overtreding
      van voorschriften, verbonden aan op grond van het bepaalde bij of krachtens de [artikelen 7][ref29]
      en [21 van de Visserijwet 1963][ref30] verleende schriftelijke toestemmingen en huurovereenkomsten; de
      [Waterwet][ref31], [artikel 6.24, tweede lid][ref32], tenzij de desbetreffende vergunning uitsluitend
      berust op een verordening van een waterschap; de [Wet algemene bepalingen omgevingsrecht][ref33],
      [artikel 2.2][ref34] en [artikel 2.3, aanhef en onder c][ref35]; de [Wet bescherming Antarctica][ref36], de
      [artikelen 19, tweede lid][ref37], en [33][ref38]; de [Wet dieren][ref39], [artikelen 3.3 tot en met 3.6][ref40],
      al dan niet in samenhang met [artikel 6.2, eerste lid][ref41], [artikel 6.4, eerste lid][ref42],
      of [artikel 7.5, derde lid][ref43]; de [Wet gewasbeschermingsmiddelen en biociden][ref44]: de
      [artikelen 20, tweede lid][ref45], [28, eerste lid, onderdeel e][ref46], [29][ref47], [45][ref48],
      [71][ref49], [72][ref50], [73][ref51], [75][ref52], [76][ref53], [77][ref54], [78, tweede lid][ref55], en
      [115][ref56]; de [Wet inzake de luchtverontreiniging][ref57], [artikel 92, onder a tot en met c][ref58];
      de [Wet luchtvaart][ref59], de [artikelen 6.60, eerste lid][ref60], [6.61, tweede lid][ref61],
      [6.61a][ref62], en [6.62, tweede lid][ref63]; de [Wet milieubeheer][ref64], de [artikelen 10.23][ref65]
      – voor zover aangeduid als strafbare feiten – , [10.60, zesde lid, onder a en onder b][ref66], in
      verbinding met onderdeel a, en zevende lid, onder a, onder b, in verbinding met onderdeel a, en
      onder c, [12.14, eerste en tweede lid][ref67] en [15.53][ref68]; de [Wet natuurbescherming][ref69],
      [artikelen 3.20, derde lid][ref70], [3.21][ref71], [3.22, eerste lid][ref72], [3.23][ref73],
      [3.24, vijfde lid][ref74], [3.26, eerste en tweede lid][ref75], [3.27][ref76], [3.28, zevende lid][ref77],
      [3.30, eerste, derde en vijfde lid][ref78], [3.32, eerste lid][ref79], [3.33, eerste lid][ref80]; de
      [Wet van 13 mei 1993, Stb. 283, tot uitbreiding en wijziging van de Wet milieubeheer (afvalstoffen)][ref81],
      [artikel VII][ref82], voor zover het betreft gemeentelijke verordeningen, vastgesteld krachtens artikel 2 van de
      Afvalstoffenwet; de [Wet vervoer gevaarlijke stoffen][ref83]: de [artikelen 47][ref84] en [48, tweede lid][ref85];
      de [Wet voorkoming verontreiniging door schepen][ref86], [artikel 12, tweede lid, onderdeel c][ref87].


