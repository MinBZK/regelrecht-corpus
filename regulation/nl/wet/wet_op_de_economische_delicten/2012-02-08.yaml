  - number: '18'
    text: |-
      1 De opsporingsambtenaren zijn in het belang van de opsporing bevoegd tot inbeslagneming van daarvoor vatbare
      voorwerpen voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is. Zij kunnen daartoe hun
      uitlevering vorderen.

      2 Voor inbeslagneming van voorwerpen ter verbeurdverklaring uit hoofde van [artikel 7, onder e][ref1], behoeven zij
      evenwel de machtiging van de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel7
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '7'
  - number: '19'
    text: |-
      1 De opsporingsambtenaren zijn in het belang van de opsporing bevoegd inzage te vorderen van gegevens en
      bescheiden, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.

      2 Zij zijn bevoegd van de gegevens en bescheiden kopieën te maken.

      3 Indien het maken van kopieën niet ter plaatse kan geschieden, zijn zij bevoegd de gegevens en bescheiden voor dat
      doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel19
  - number: '20'
    text: |-
      De opsporingsambtenaren hebben in het belang van de opsporing toegang tot elke plaats, voor zover dat
      redelijkerwijs voor de vervulling van hun taak nodig is.
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel20
  - number: '21'
    text: |-
      1 De opsporingsambtenaren zijn bevoegd in het belang van de opsporing zaken te onderzoeken, aan opneming te
      onderwerpen en daarvan monsters te nemen, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.

      2 Zij zijn bevoegd daartoe verpakkingen te openen.

      3 Zij nemen op verzoek van de belanghebbende indien mogelijk een tweede monster, tenzij bij of krachtens wettelijk
      voorschrift anders is bepaald.

      4 Indien het onderzoek, de opneming of de monsterneming niet ter plaatse kan geschieden, zijn zij bevoegd de zaken
      voor dat doel voor korte tijd mee te nemen tegen een door hen af te geven schriftelijk bewijs.

      5 De genomen monsters worden voor zover mogelijk teruggegeven.

      6 De belanghebbende wordt op zijn verzoek zo spoedig mogelijk in kennis gesteld van de resultaten van het
      onderzoek, de opneming of de monsterneming.
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel21
  - number: '23'
    text: |-
      1 De opsporingsambtenaren zijn bevoegd in het belang van de opsporing vervoermiddelen te onderzoeken met het oog
      op de naleving van de voorschriften, bedoeld in de [artikelen 1][ref1] en [1a][ref2], voor zover dat redelijkerwijs
      voor de vervulling van hun taak nodig is.

      2 Zij zijn bevoegd in het belang van de opsporing vervoermiddelen waarmee naar hun redelijk oordeel zaken
      worden vervoerd op hun lading te onderzoeken met het oog op de naleving van de voorschriften, bedoeld in de
      [artikelen 1][ref3] en [1a][ref4], voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.

      3 Zij zijn bevoegd van de bestuurder van een vervoermiddel inzage te vorderen van de wettelijk voorgeschreven
      bescheiden met het oog op de naleving van de voorschriften, bedoeld in de [artikelen 1][ref5] en [1a][ref6], voor
      zover dat redelijkerwijs voor de vervulling van hun taak nodig is.

      4 Zij zijn bevoegd met het oog op de uitoefening van deze bevoegdheden van de bestuurder van een voertuig of van de
      schipper van een vaartuig te vorderen dat deze zijn vervoermiddel stilhoudt en naar een door hem aangewezen plaats
      overbrengt, voor zover dat redelijkerwijs voor de vervulling van hun taak nodig is.

      5 De kosten van overbrenging komen ten laste van de betrokkene, indien een strafbaar feit wordt vastgesteld.

      6 De in dit artikel genoemde bevoegdheden kunnen tevens worden uitgeoefend jegens personen, die zaken vervoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
      [ref3]: https://wetten.overheid.nl/BWBR0002063#Artikel1
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel1a
