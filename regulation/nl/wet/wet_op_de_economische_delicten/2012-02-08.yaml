  - number: '32'
    text: |-
      1 Indien de zaak eindigt hetzij zonder oplegging van straf of maatregel, hetzij met oplegging van een zodanige
      straf of maatregel, dat de opgelegde voorlopige maatregel als onevenredig hard moet worden beschouwd, kan het
      gerecht, op verzoek van de gewezen verdachte of van zijn erfgenamen, hem of zijn erfgenamen een geldelijke
      tegemoetkoming ten laste van de Staat toekennen voor de schade, welke hij ten gevolge van de opgelegde voorlopige
      maatregel werkelijk heeft geleden. Tot deze toekenning is bevoegd het gerecht in feitelijke aanleg, waarvoor de
      zaak tijdens de beëindiging daarvan werd vervolgd of anders het laatst werd vervolgd.

      2 De [artikelen 89, derde en vierde lid][ref1], [90-91][ref2] en [93 van het Wetboek van Strafvordering][ref3]
      vinden overeenkomstige toepassing.

      3 Indien de gewezen verdachte na het indienen van zijn verzoek of na de instelling van hoger beroep overleden is,
      geschiedt de toekenning ten behoeve van zijn erfgenamen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel89
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel90
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel93
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel32
