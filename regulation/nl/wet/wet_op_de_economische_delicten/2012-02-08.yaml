  - number: '8'
    text: |-
      Maatregelen zijn:

      a. de maatregelen voorzien in [Titel IIA van het Eerste Boek van het Wetboek van Strafrecht][ref1];

      b. onderbewindstelling van de onderneming van de veroordeelde, waarin het economisch delict is begaan, in geval
      van misdrijf voor een tijd van ten hoogste drie jaren en in geval van overtreding voor een tijd van ten hoogste
      twee jaren;

      c. het opleggen van de verplichting tot verrichting van hetgeen wederrechtelijk is nagelaten, tenietdoening van
      hetgeen wederrechtelijk is verricht en verrichting van prestaties tot het goedmaken van een en ander, alles op
      kosten van de veroordeelde, voor zover de rechter niet anders bepaalt.


      [ref1]: https://wetten.overheid.nl/BWBR0001854
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001854
  - number: '9'
    text: |-
      De maatregelen vermeld in [artikel 8, onder b en c][ref1], kunnen te zamen met straffen en met andere maatregelen
      worden opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002063
        artikel: '8'
  - number: '10'
    text: |-
      1 Bij de uitspraak, waarbij een bijkomende straf of een maatregel, als vermeld in [artikel 8][ref1], wordt
      opgelegd, worden, voor zoveel nodig, alle bijzonderheden en gevolgen naar behoefte geregeld, daaronder begrepen bij
      onderbewindstelling de benoeming van een of meer bewindvoerders. Bij oplegging van een bijkomende straf als vermeld
      in [artikel 7, onder c][ref2], kan bovendien worden bevolen, dat de veroordeelde

      hem van overheidswege ten behoeve van zijn onderneming verstrekte bescheiden inlevert;

      in zijn onderneming aanwezige voorraden onder toezicht verkoopt;

      en zijn medewerking verleent bij inventarisatie van die voorraden.

      2 Onverminderd het bepaalde in [artikel 577b van het Wetboek van Strafvordering][ref3] kan de rechter die de
      bijkomende straf of maatregel heeft opgelegd, na ontvangst van een vordering van het openbaar ministerie of op
      verzoek van de veroordeelde bij latere beslissing alsnog een regeling geven als vorenbedoeld, dan wel in de reeds
      gegeven regeling wijziging brengen of terzake een aanvullende regeling geven. De behandeling van de zaak vindt
      plaats met gesloten deuren; de uitspraak geschiedt in het openbaar. De beslissing is met redenen omkleed; zij is
      niet aan enig rechtsmiddel onderworpen.

      3 Wij behouden Ons voor, nadere voorschriften te geven ter uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0002063#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel577b
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel10
