  - number: '13'
    text: |-
      1 Het recht tot uitvoering van verbeurdverklaring vervalt niet door de dood van de veroordeelde.

      2 De in [artikel 8 onder b][ref1] vermelde maatregel vervalt door de dood van de veroordeelde.


      [ref1]: https://wetten.overheid.nl/BWBR0002063#Artikel8
    url: https://wetten.overheid.nl/BWBR0002063/2012-02-08#Artikel13
