    volgende regeling vast:
  url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#ArtikelAanhef
articles:
  - number: '1'
    text: 'In deze regeling wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.a)
    text: |-
      de wet: de [Wet toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
  - number: 1.b)
    text: |-
      het besluit: het [Besluit toezicht effectenverkeer 1995][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007708
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007708
  - number: 1.c)
    text: |-
      uitgevende instelling: een onderneming of instelling te wier laste effecten zijn of worden uitgegeven in of vanuit
      Nederland buiten een besloten kring;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.d)
    text: |-
      effecteninstelling: een effectenbemiddelaar of vermogensbeheerder als bedoeld in
      [artikel 1, onder b, respectievelijk c, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 1.e)
    text: 'Bank: De Nederlandsche Bank NV;'
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.f)
    text: |-
      effectenbeurs: een effectenbeurs als bedoeld in [artikel 1, onder e, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 1.g)
    text: |-
      financiële instrumenten: effecten als bedoeld in [artikel 1, sub a, van de wet][ref1]
      en rente-, valuta- of aandelenswaps of soortgelijke overeenkomsten als bedoeld in
      [artikel 1, sub b, ten vijfde, onderscheidenlijk sub c, ten tweede, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 1.h)
    text: 'effectendiensten:'
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(1)
    text: |-
      het ontvangen van orders van cliënten met betrekking tot financiële instrumenten en het op naam en voor rekening
      van die cliënten doorgeven van die orders aan een andere effecteninstelling;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(2)
    text: |-
      het ontvangen van orders van cliënten met betrekking tot financiële instrumenten en het voor rekening van die
      cliënten uitvoeren of doen uitvoeren van die orders alsmede het anderszins bijeenbrengen van koper en verkoper ter
      zake van transacties in financiële instrumenten;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(3)
    text: |-
      het uitvoeren van transacties met betrekking tot financiële instrumenten voor eigen rekening, anders dan bij
      uitgifte van financiële instrumenten als bedoeld onder sub 5 en anders dan in het kader van het onderhouden van een
      markt als bedoeld onder sub 6;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(4)
    text: |-
      het aanbieden van de mogelijkheid om door het openen van een rekening vorderingen te verkrijgen, luidende in
      effecten, waarbij door middel van deze rekening transacties in effecten kunnen worden bewerkstelligd;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(5)
    text: het overnemen of plaatsen van financiële instrumenten bij uitgifte;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(6)
    text: |-
      het verrichten van transacties met betrekking tot financiële instrumenten teneinde een markt in financiële
      instrumenten te onderhouden;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(7)
    text: |-
      het optreden als plaatselijke onderneming. Een plaatselijke onderneming is een effecteninstelling die op een in
      een lidstaat van de Organisatie voor Economische Samenwerking en Ontwikkeling gevestigde en onder toezicht staande
      effectenbeurs voor opties of voor rechten op overdracht op termijn van goederen, of voor soortgelijke effecten,
      uitsluitend effectendiensten verricht als bedoeld onder:
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(7).(a)
    text: sub 2, voor zover als cliënt uitsluitend andere tot die effectenbeurs toegelaten effecteninstellingen optreden;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(7).(b)
    text: |-
      sub 3, voor zover als tegenpartij uitsluitend andere tot die effectenbeurs toegelaten effecteninstellingen
      optreden; en/of
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(7).(c)
    text: |-
      sub 6, voor zover als tegenpartij uitsluitend andere tot die effectenbeurs toegelaten effecteninstellingen
      optreden,
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(8)
    text: 'het verrichten van vermogensbeheer. Vermogensbeheer is:'
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(8).(a)
    text: |-
      het op grond van een overeenkomst verrichten van het beheer over financiële instrumenten die toebehoren aan een
      cliënt, dan wel over aan deze cliënt toebehorende middelen ter belegging in financiële instrumenten, daaronder het
      op naam en voor rekening van die cliënt doorgeven van orders met betrekking tot financiële instrumenten aan een
      andere effecteninstelling; en/of
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.h).(8).(b)
    text: |-
      het op grond van een overeenkomst verrichten van het beheer over financiële instrumenten die toebehoren aan een
      cliënt, dan wel over aan deze cliënt toebehorende middelen ter belegging in financiële instrumenten, daaronder
      het voor rekening van die cliënt uitvoeren of doen uitvoeren van transacties met betrekking tot financiële
      instrumenten;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.i)
    text: |-
      kredietinstelling: tenzij anders aangegeven, een kredietinstelling die is ingeschreven in het register als bedoeld
      in [artikel 21 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel21
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '21'
  - number: 1.j)
    text: |-
      financiële instelling: een financiële instelling als gedefinieerd in artikel 1, onderdeel 5 van [Richtlijn 2000/12/
      EG](32000L0012) van 20 maart 2000 (L 126/1);
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
  - number: 1.k)
    text: |-
      groep: tenzij anders aangegeven, een groep als bedoeld in [artikel 1, onderdeel g, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 1.l)
    text: |-
      effecten: effecten als bedoeld in [artikel 1, sub a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: '2'
    text: |-
      Een effecteninstelling beschikt doorlopend over een eigen vermogen als omschreven in [bijlage 1][ref1], van ten
      minste:


      [ref1]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013315
  - number: 2.a)
    text: |-
      35.000 euro, als de effecteninstelling de effectendienst bedoeld in [artikel 1, onder h, sub 1][ref1], verricht,
      mits de effecteninstelling deze dienst niet, overeenkomstig [artikel 13][ref2] of [14 van de wet][ref3], verricht
      of voornemens is te verrichten in een andere staat die partij is bij de Overeenkomst betreffende de Europese
      Economische Ruimte;


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel14
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '1'
        paragraaf: '01'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0007657
        artikel: '14'
  - number: 2.b)
    text: |-
      50.000 euro, als de effecteninstelling een of meer van de volgende effectendiensten verricht: - de effectendienst
      bedoeld in [artikel 1, onder h, sub 1][ref1], indien de effecteninstelling deze dienst, overeenkomstig
      [artikel 13][ref2] of [14 van de wet][ref3] verricht of voornemens is te verrichten in een andere staat die partij
      is bij de Overeenkomst betreffende de Europese Economische Ruimte;
        - de effectendienst bedoeld in [artikel 1, onder h, sub 2, sub 7 of sub 8][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007657#Artikel13
      [ref3]: https://wetten.overheid.nl/BWBR0007657#Artikel14
      [ref4]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0007657
        artikel: '13'
      - id: ref3
        bwb_id: BWBR0007657
        artikel: '14'
      - id: ref4
        bwb_id: BWBR0007657
        artikel: '1'
  - number: 2.c)
    text: |-
      730.000 euro, als de effecteninstelling, al dan niet naast de onder a en b genoemde effectendiensten, een of meer
      van de effectendiensten bedoeld in [artikel 1, onder h, sub 3, sub 4, sub 5 of sub 6][ref1] verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007657#Artikel1
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0007657
        artikel: '1'
  - number: '3.1'
    text: |-
      Een effecteninstelling, met uitzondering van de plaatselijke onderneming, beschikt doorlopend over een
      toetsingsvermogen als omschreven in [bijlage 1][ref1], dat ten minste de som bedraagt van de in [bijlage 2][ref2]
      omschreven kapitaalvereisten.


      [ref1]: https://wetten.overheid.nl/BWBR0013315
      [ref2]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0013315
      - id: ref2
        bwb_id: BWBR0013315
  - number: '3.2'
    text: |-
      Een plaatselijke onderneming voldoet aan de voor de effectenbeurs waartoe de plaatselijke onderneming is toegelaten
      geldende regels met betrekking tot de vereiste financiële waarborgen voor plaatselijke ondernemingen.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel3
  - number: '4.1'
    text: |-
      Onverminderd het bedrag van het in [artikel 3][ref1] bedoelde toetsingsvermogen, beschikt een effecteninstelling,
      met uitzondering van de plaatselijke onderneming, over een toetsingsvermogen van ten minste 25% van de vaste kosten
      van de effecteninstelling in het afgelopen boekjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel3
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '3'
        paragraaf: '02'
  - number: '4.2'
    text: 'De vaste kosten als bedoeld in het eerste lid, omvatten alle kosten, met uitzondering van:'
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: 4.2.a)
    text: |-
      de variabele kosten van werknemers waarvan het dienstverband niet onverwijld en zonder schadeloosstelling kan
      worden opgezegd;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: 4.2.b)
    text: de kosten van werknemers waarvan het dienstverband onverwijld en zonder schadeloosstelling kan worden opgezegd;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: 4.2.c)
    text: de variabele kosten betreffende de voor de effecteninstelling verrichte effectendiensten;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: 4.2.d)
    text: de afschrijvingen;
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: 4.2.e)
    text: |-
      de rentekosten over achtergestelde leningen als bedoeld in [bijlage 1, rubriek 1.2.1.f][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0013315
  - number: 4.2.f)
    text: de buitengewone kosten met een eenmalig karakter; en
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: 4.2.g)
    text: de overige, door de Bank schriftelijk goedgekeurde, variabele kosten.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: '4.3'
    text: |-
      De Bank kan het krachtens het eerste lid vereiste toetsingsvermogen aanpassen in geval dat naar haar oordeel sprake
      is van aanzienlijke wijzigingen in de werkzaamheden van de effecteninstelling sinds het voorgaande boekjaar.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: '4.4'
    text: |-
      Wanneer de effecteninstelling haar werkzaamheden niet gedurende een volledig boekjaar heeft uitgeoefend, bedraagt
      het vereiste een kwart van het in het programma van werkzaamheden van de effecteninstelling begrote cijfer voor de
      vaste kosten, tenzij de Bank aanpassing van dit programma verlangt.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel4
  - number: '5'
    text: |-
      Onverminderd [artikel 3][ref1] bewaakt en beheerst een effecteninstelling, met uitzondering van de plaatselijke
      onderneming, de omvang van haar grote risico's overeenkomstig de voorschriften in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '3'
        paragraaf: '02'
      - id: ref2
        bwb_id: BWBR0013315
  - number: '6.1'
    text: |-
      De ingevolge de [artikelen 2][ref1], [3][ref2] en [4][ref3] gestelde kapitaalvereisten worden berekend op niet-
      geconsolideerde basis.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013315#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0013315#Artikel4
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '2'
        paragraaf: '02'
      - id: ref2
        bwb_id: BWBR0013315
        artikel: '3'
        paragraaf: '02'
      - id: ref3
        bwb_id: BWBR0013315
        artikel: '4'
        paragraaf: '02'
  - number: '6.2'
    text: |-
      Een effecteninstelling die deel uit maakt van een groep waartoe een of meer andere financiële instellingen behoren,
      voert systemen in voor de bewaking van de bronnen van eigen en vreemd vermogen van alle andere instellingen binnen
      de groep en van de grote risico's binnen de groep.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel6
  - number: '6.3'
    text: |-
      Een effecteninstelling rapporteert de Bank omtrent alle risico's binnen een groep die de financiële positie van de
      effecteninstelling in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel6
  - number: '6.4'
    text: 'De effecteninstelling dient te voldoen aan de door de Bank te stellen bijzondere regels betreffende:'
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel6
  - number: 6.4.a)
    text: |-
      het, onverminderd de [artikelen 3][ref1] en [4][ref2], door de effecteninstelling aan te houden toetsingsvermogen;
      en/of


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013315#Artikel4
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '3'
        paragraaf: '02'
      - id: ref2
        bwb_id: BWBR0013315
        artikel: '4'
        paragraaf: '02'
  - number: 6.4.b)
    text: |-
      beperkingen van de omvang van de al dan niet uit de balans blijkende verplichtingen tussen de effecteninstelling en
      de andere instellingen die deel uitmaken van de groep waartoe ook de effecteninstelling behoort,
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel6
  - number: '7.1'
    text: |-
      Een effecteninstelling waardeert de activa en passiva, alsmede de niet uit de balans blijkende rechten en
      verplichtingen, op grondslagen die voldoen aan normen die in het maatschappelijk verkeer als aanvaardbaar worden
      beschouwd.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel7
  - number: '7.2'
    text: |-
      De handelsportefeuille van de effecteninstelling wordt dagelijks gewaardeerd tegen de marktwaarde dan wel, indien
      de marktwaarde niet direct te bepalen is, tegen de geschatte opbrengstwaarde, berekend op basis van financiële
      berekeningstechnieken die voldoen aan normen die in het maatschappelijk verkeer als aanvaardbaar worden beschouwd.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel7
  - number: '7.3'
    text: Met betrekking tot de toegepaste waarderingsmethode dient een bestendige gedragslijn te worden gevolgd.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel7
  - number: '8.1'
    text: |-
      Een effecteninstelling waarop [artikel 4, eerste lid][ref1], van toepassing is, rapporteert door middel van
      staten overeenkomstig de door de Bank te verstrekken modellen aan de Bank per ultimo van iedere maand, uiterlijk
      op de tiende werkdag na afloop van de desbetreffende maand, over de balans, resultatenrekening, de stand van het
      toetsingsvermogen alsmede over de grote risico's als bedoeld in [bijlage 2][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '4'
        paragraaf: '02'
      - id: ref2
        bwb_id: BWBR0013315
  - number: '8.2'
    text: |-
      In afwijking van het eerste lid, rapporteert de effecteninstelling die de effectendiensten als bedoeld in
      [artikel 1, onder h, sub 1][ref1] of [8a][ref2], verricht, door middel van staten overeenkomstig de door de Bank te
      verstrekken modellen, aan de Bank per ultimo van ieder kwartaal, uiterlijk op de vijftiende werkdag na afloop van
      het desbetreffende kwartaal, over de balans, resultatenrekening, de stand van het toetsingsvermogen alsmede over de
      grote risico's als bedoeld in [bijlage 2][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0013315#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '1'
        paragraaf: '01'
      - id: ref2
        bwb_id: BWBR0013315
        artikel: '8'
        paragraaf: '02'
      - id: ref3
        bwb_id: BWBR0013315
  - number: '8.3'
    text: |-
      De effecteninstelling als bedoeld in het eerste of tweede lid rapporteert de Bank onverwijld indien het aanwezige
      toetsingsvermogen daalt onder de grenswaarde van 120% van het toetsingsvermogen waarover de effecteninstelling
      ingevolge [artikel 3, eerste lid][ref1], en [artikel 4, eerste lid][ref2], dient te beschikken.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0013315#Artikel4
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '3'
        paragraaf: '02'
      - id: ref2
        bwb_id: BWBR0013315
        artikel: '4'
        paragraaf: '02'
  - number: '8.4'
    text: |-
      Een effecteninstelling als bedoeld in [artikel 2][ref1] rapporteert de Bank onverwijld indien het aanwezige eigen
      vermogen daalt onder de voor die instelling ingevolge [artikel 2][ref2] vereiste eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0013315#Artikel2
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '2'
        paragraaf: '02'
      - id: ref2
        bwb_id: BWBR0013315
        artikel: '2'
        paragraaf: '02'
  - number: '8.5'
    text: |-
      Onverminderd het eerste tot en met het tweede lid, rapporteert een effecteninstelling zoveel vaker aan de Bank als
      de Bank dat eist.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8
  - number: 8a.1
    text: |-
      In dit artikel wordt verstaan onder International Accounting Standards (IAS)/International Financial Reporting
      Standards (IFRS): de door de International Accounting Standards Board vastgestelde en door de Europese Commissie
      goedgekeurde standaarden en de daarbij behorende interpretaties voor jaarrekeningen, bedoeld in artikel 2 van de
      [Verordening (EG) nr. 1606/2002](32002R1606) van het Europees Parlement en de Raad van de Europese Unie van 19 juli
      2002 betreffende de toepassing van internationale standaarden voor jaarrekeningen (PbEG L 243).
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8a
  - number: 8a.2
    text: |-
      Een effecteninstelling die in haar jaarrekening overgaat op IAS/IFRS, gaat in de rapportages als bedoeld in
      [artikel 8][ref1] eveneens over op IAS/IFRS. De effecteninstelling kan in deze rapportages uitsluitend overgaan
      op IAS/IFRS aan het begin van een boekjaar. Een effecteninstelling kan niet terugkomen op een eenmaal gemaakte
      overgang op IAS/IFRS.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel8
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '8'
        paragraaf: '02'
  - number: 8a.3
    text: |-
      Een effecteninstelling die overgaat op IAS/IFRS dient eenmalig een aanvullende rapportage als bedoeld in
      [artikel 8][ref1] in bij de Bank, op basis van IAS/IFRS en naar de stand op het moment van overgang op IAS/IFRS.
      De effecteninstelling licht bij deze eenmalige aanvullende rapportage tevens belangrijke verschillen toe met
      betrekking tot de omvang en de samenstelling van het toetsingsvermogen, zoals deze resulteren uit deze eenmalige
      aanvullende rapportage onderscheidenlijk uit de reguliere rapportage als bedoeld in [artikel 8][ref2], ingevuld
      naar de stand aan het einde van het laatste boekjaar voorafgaand aan het moment van overgang op IAS/IFRS.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0013315#Artikel8
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '8'
        paragraaf: '02'
      - id: ref2
        bwb_id: BWBR0013315
        artikel: '8'
        paragraaf: '02'
  - number: 8a.4
    text: |-
      De effecteninstelling dient de in het derde lid bedoelde aanvullende rapportage in bij de Bank gelijktijdig met
      de eerstvolgende reguliere rapportage als bedoeld in [artikel 8][ref1] na het moment van overgang op IAS/IFRS.
      In het geval een effecteninstelling in haar jaarrekening overgaat of is overgegaan op IAS/IFRS met ingang van een
      boekjaar dat is aangevangen voor 1 juli 2005, dient de effecteninstelling de in het derde lid bedoelde aanvullende
      rapportage uiterlijk in bij de Bank op de tiende werkdag van juli 2005, indien zij maandelijks rapporteert, dan wel
      uiterlijk op de vijftiende werkdag van juli 2005, indien zij op kwartaalbasis rapporteert.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel8
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '8'
        paragraaf: '02'
  - number: '9'
    text: |-
      Een effecteninstelling, niet zijnde een kredietinstelling, als bedoeld in [artikel 15 Nadere regeling
      gedragstoezicht effectenverkeer 2002](onbekend) respectievelijk een effecteninstelling, zijnde een
      kredietinstelling, als bedoeld in [artikel 16 Nadere regeling gedragstoezicht effectenverkeer 2002](onbekend),
      maakt enkel gebruik van de aldaar bedoelde effectengiro respectievelijk bewaarinstelling indien - de
      effectengiro respectievelijk de bewaarinstelling beschikt over een bedrag aan eigen vermogen als omschreven in
      [bijlage I][ref1], met inachtneming van [rubriek 2.5.3 van bijlage 2][ref2], van ten minste 125.000 euro;
        - de Bank bij de effectengiro respectievelijk de bewaarinstelling alle inlichtingen kan inwinnen of doen inwinnen,
      die naar het oordeel van de Bank nodig zijn voor het toezicht op het eigen vermogen; en
        - de effectengiro respectievelijk de bewaarinstelling zorg draagt voor een adequate administratieve organisatie met
      betrekking tot de in bewaring genomen effecten en gelden respectievelijk effecten, overeenkomstig [bijlage 3][ref3]
      van deze regeling, voor zover nodig voor het toezicht op het eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0013315
      [ref2]: https://wetten.overheid.nl/BWBR0013315
      [ref3]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0013315
      - id: ref2
        bwb_id: BWBR0013315
      - id: ref3
        bwb_id: BWBR0013315
  - number: '10.1'
    text: |-
      Een effecteninstelling beschikt, met het oog op het adequaat functioneren van de effecteninstelling en de naleving
      van bij of krachtens de [wet][ref1] gestelde vereisten, over een adequate administratieve organisatie en een
      systeem van interne controle overeenkomstig de regels in [bijlage 3][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007657
      [ref2]: https://wetten.overheid.nl/BWBR0013315
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007657
      - id: ref2
        bwb_id: BWBR0013315
  - number: '10.2'
    text: |-
      De in het eerste lid bedoelde administratieve organisatie en het systeem van interne controle, worden op
      systematische wijze beschreven, regelmatig geëvalueerd en zonodig geactualiseerd.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel10
  - number: '11'
    text: |-
      Een effecteninstelling, zijnde een kredietinstelling, draagt zorg voor de vastlegging in een daartoe opgezette
      administratie, van alle binnen het bedrijf van de effecteninstelling geconstateerde overtredingen van de bij of
      krachtens de [wet][ref1] gestelde regels door haar medewerkers en rapporteert ten minste per kwartaal, uiterlijk op
      de tiende werkdag na afloop van het desbetreffende kwartaal, aan de Bank.


      [ref1]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007657
  - number: '12.1'
    text: |-
      In het geval een effecteninstelling, zijnde een kredietinstelling, voornemens is een medewerker in dienst te nemen
      die werkzaam zal zijn op het gebied van de door de [wet][ref1] bestreken en door de effecteninstelling, zijnde
      een kredietinstelling, uitgeoefende diensten, wint de effecteninstelling, zijnde een kredietinstelling, in het
      kader van zijn oordeelsvorming over de deskundigheid en betrouwbaarheid van betrokkene ten minste schriftelijke
      inlichtingen in bij de werkgever of werkgevers bij welke betrokkene gedurende de laatste 5 jaar werkzaam is
      geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007657
  - number: '12.2'
    text: |-
      De effecteninstelling, zijnde een kredietinstelling, is verplicht van betrokkene als bedoeld in het eerste lid te
      eisen dat deze onvoorwaardelijk toestemming verleent voor het inwinnen van inlichtingen.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel12
  - number: '12.3'
    text: |-
      Een effecteninstelling waaraan inlichtingen over een betrokkene als bedoeld in het eerste lid worden gevraagd is
      verplicht deze inlichtingen schriftelijk dan wel elektronisch binnen drie weken na de in het eerste lid bedoelde
      aanvraag te verstrekken.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel12
  - number: '13'
    text: |-
      Deze regeling kan worden aangehaald als 'Nadere regeling prudentieel toezicht effectenverkeer 2002'. Deze regeling
      treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij wordt geplaatst en
      werkt terug tot en met 1 september 2002.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel13
  - number: '14'
    text: 'Overgangsregeling:'
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel14
  - number: '14.1'
    text: |-
      Als modellen in de zin van [artikel 8][ref1] worden aangewezen de modellen die op basis van de [Nadere regeling
      1999 door de Autoriteit Financiële Markten](onbekend) waren vastgesteld, met dien verstande dat voor 'Autoriteit-
      FM' voortaan 'De Nederlandsche Bank' moet worden gelezen.


      [ref1]: https://wetten.overheid.nl/BWBR0013315#Artikel8
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0013315
        artikel: '8'
        paragraaf: '02'
  - number: '14.2'
    text: |-
      Door de Autoriteit-FM genomen besluiten of gegeven oordelen op basis van de [artikelen 7](onbekend), [9](onbekend)
      en [11 van de Nadere regeling toezicht effectenverkeer 1999](onbekend), zoals deze luidde voor de inwerkingtreding
      van dit besluit, worden geacht te zijn genomen door de Bank.
    url: https://wetten.overheid.nl/BWBR0013315/2005-06-24#Artikel14
