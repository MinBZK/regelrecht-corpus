  - number: '12'
    text: |-
      1. De netto-tonnage bedraagt 0,30 × de GT.

      2. De bruto- en netto-tonnage worden naar beneden afgerond op een getal zonder decimalen.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel12
  - number: 12a
    text: |-
      De bepalingen van dit hoofdstuk zijn van toepassing op vissersvaartuigen met een lengte over alles van minder dan
      15 meter.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel12a
  - number: 12b
    text: |-
      De bruto-tonnage van een vissersvaartuig wordt vastgesteld overeenkomstig artikel 4, tweede lid, van [verordening
      (EU) 2017/1130](32017R1130) van het Europees Parlement en de Raad van 14 juni 2017 houdende definities van de
      kenmerken van vissersvaartuigen (PbEU 2017, L 169).
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel12b
  - number: 12c
    text: |-
      1 De netto-tonnage bedraagt 0,30 × de GT.

      2 De bruto- en netto-tonnage worden naar beneden afgerond op een getal zonder decimalen.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel12c
  - number: '13'
    text: Het besluit metingsvoorschriften 1982 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel13
  - number: '14'
    text: 'Deze regeling kan worden aangehaald als: Regeling metingsvoorschriften.'
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel14
  - number: '15'
    text: |-
      Deze regeling treedt in werking met ingang van 1 juli 1993.

      Deze regeling zal met de toelichting in de Staatscourant worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel15
