        artikel: '2'
  - number: '2'
    text: |-
      1 De tonnage van een schip wordt onderscheiden naar bruto-tonnage en netto-tonnage.

      2 De bruto- en de netto-tonnage worden berekend volgens de bepalingen van deze regeling.

      3 De bruto- en de netto-tonnage van nieuwe typen schepen waarvan de bouwkenmerken zodanig zijn, dat zij de
      toepassing van de bepalingen van deze voorschriften onredelijk of onuitvoerbaar maken, worden vastgesteld door de
      Minister van Infrastructuur en Milieu.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel2
  - number: '3'
    text: |-
      De bepalingen van dit hoofdstuk zijn van toepassing op alle schepen, met uitzondering van:

      a. pleziervaartuigen met een lengte van minder dan 24 meter;

      b. vissersvaartuigen met een lengte over alles van minder dan 15 meter.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel3
  - number: '4'
    text: |-
      De bruto-tonnage (GT) van een schip wordt vastgesteld door middel van de volgende formule:

      GT = K1 V

      Waarbij:

        - V = het totale volume van alle ingesloten ruimten van het schip in kubieke meters,
        - K1 = 0.2 + 0.02 V (of volgens de tabel in bijlage II).
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel4
  - number: '5'
    text: |-
      1 De netto-tonnage (NT) van een schip wordt vastgesteld door middel van de volgende formule:

      NT = K2 Vc (4d/3D)² + K3 (N1 + N2/10),

      waarbij:

      a) de faktor (4d/3D)² niet groter mag zijn dan 1;

      b) de term K2 Vc (4d/3D)² niet minder mag zijn dan 0,25 GT; en

      c) NT niet minder mag zijn dan 0,30 GT,

      en waarbij:

        - Vc = het totale volume van de ladingsruimten in kubieke meters,
        - K2 = 0.2 + 0.02 log Vc (of zoals volgens tabel in bijlage II),
        - K3 = 1.25 (GT + 10000)/10000,
        - D = holte naar de mal midscheeps gemeten in meters als omschreven in [artikel 2, onder b][ref1],
        - d = diepgang naar de mal midscheeps gemeten in meters als omschreven in het tweede lid van dit artikel.
        - N1 = aantal slaapplaatsen voor passagiers in hutten met niet meer dan acht kooien,
        - N2 = aantal overige passagiers,
        - N1 + N2 = totaal aantal passagiers dat het schip volgens het veiligheidscertificaat voor passagiersschepen mag
      vervoeren; indien N1 + N2 minder is dan 13, worden N1 en N2 geacht gelijk te zijn aan nul,
        - GT = bruto-tonnage van het schip als vastgesteld krachtens het bepaalde in [artikel 4][ref2].

      2 de diepgang naar de mal d, bedoeld in het eerste lid van dit artikel, is een van de navolgende diepgangen:

      a. de diepgang overeenkomende met de lijn voor zomeruitwatering, niet de lijn voor houtvaartuitwatering zijnde,
      zoals aangegeven op het uitwateringscertificaat;

      b. voor passagiersschepen de diepgang overeenkomende met de hoogstgelegen indelingslastlijn zoals aangegeven op het
      veiligheidscertificaat voor passagiersschepen;

      c. voor schepen waaraan geen uitwateringslijn is toegekend: de maximaal toegestane diepgang dan wel 75 procent van
      de holte naar de mal midscheeps gemeten als omschreven in [artikel 2, onder b][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0006017#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0006017#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0006017#Artikel2
