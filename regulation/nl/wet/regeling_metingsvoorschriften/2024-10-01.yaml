  - number: '6'
    text: |-
      1 Indien de kenmerken van een schip, met name de in de [artikelen 4][ref1] en [5][ref2] omschreven V, Vc, D, N1
      of N2 worden gewijzigd en deze wijziging een vermeerdering van de krachtens [artikel 5][ref3] vastgestelde netto-
      tonnage ten gevolge heeft, wordt de met de nieuwe kenmerken overeenkomende netto-tonnage van het schip onverwijld
      vastgesteld en toegepast.

      2 Voor een schip waaraan gelijktijdig uitwateringslijnen zoals bedoeld in
      [artikel 5, tweede lid, onder a en b][ref4] zijn toegekend, wordt slechts een netto-tonnage vastgesteld krachtens
      [artikel 5][ref5], welke tonnage wordt berekend naar de toegekende uitwateringslijn die behoort bij het vervoer
      waaraan met het schip wordt deelgenomen.

      3 Indien de kenmerken van een schip, met name de in de [artikelen 4][ref6] en [5][ref7] omschreven V, Vc, D,
      N1 of N2 worden gewijzigd of als de desbetreffende toegekende uitwateringslijn, bedoeld in het tweede lid van
      dit artikel, niet meer van toepassing is door een verandering van het met het schip verrichte vervoer, en een
      zodanige wijziging leidt tot een vermindering van de netto-tonnage van het schip, zoals vastgesteld krachtens
      [artikel 5][ref8], mag niet worden overgegaan tot uitgifte van een nieuwe Internationale Meetbrief (1969) waarop
      de aldus vastgestelde netto-tonnage is vermeld, alvorens twaalf maanden zijn verstreken na de datum waarop de
      oorspronkelijke Meetbrief was uitgegeven.

      Het bepaalde in het derde lid van dit artikel is evenwel niet van toepassing in de volgende gevallen:

      a. als op het schip, dat de vlag heeft gevoerd van een andere Staat, de [Meetbrievenwet 1981][ref9] van toepassing
      wordt;

      b. als het schip veranderingen of wijzigingen ondergaat die door de Minister van Infrastructuur en Milieu
      ingrijpend geacht worden, zoals het wegnemen van een bovenbouw, waardoor een wijziging van de toegekende
      uitwateringslijn noodzakelijk wordt; of

      c. voor passagiersschepen, die worden gebruikt voor het vervoer van grote aantallen dekpassagiers tijdens speciale
      vaarten, zoals bij voorbeeld het vervoeren van pelgrims.


