  - number: '7'
    text: |-
      1 Alle volumes begrepen in de berekening van bruto- en netto-tonnages worden gemeten, tot de binnenzijde van de
      huid of tot de begrenzingswanden bij metalen schepen en tot de buitenzijde van de huid of tot de binnenzijde van
      de begrenzingswanden bij schepen gebouwd van een ander materiaal, waarbij aangebrachte isolatie of soortgelijke
      materialen niet in aanmerking worden genomen.

      2 Het volume van uitbouwsels wordt in het totale volume begrepen.

      3 Het volume van voor de zee openstaande ruimten mag van het totale volume worden afgetrokken.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel7
  - number: '8'
    text: |-
      1 Alle metingen bedoeld voor de berekening van volumes, worden verricht tot op 1 centimeter nauwkeurig.

      2 De volumes worden berekend volgens voor de betrokken ruimte algemeen aanvaarde methoden en met een voor de
      Minister van Infrastructuur en Milieu aanvaardbare nauwkeurigheid.

      3 De berekening dient voldoende gedetailleerd te zijn om gemakkelijke verificatie mogelijk te maken.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel8
  - number: '9'
    text: De bepalingen van dit hoofdstuk zijn van toepassing op pleziervaartuigen met een lengte van minder dan 24 meter.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel9
  - number: '10'
    text: De romplengte en de rompbreedte worden uitgedrukt in meters tot twee cijfers achter de komma nauwkeurig.
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel10
