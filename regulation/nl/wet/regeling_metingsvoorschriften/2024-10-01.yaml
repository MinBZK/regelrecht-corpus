preamble:
  text: |-
    Overwegende dat het noodzakelijk is ter juiste uitvoering van het Meetbrievenbesluit 1981 nadere regelen vast te
    stellen overeenkomstig de bepalingen inzake de vaststelling van de bruto-tonnage en netto-tonnage van een schip,
    zoals vermeld in Bijlage I van het op 23 juni 1969 tot stand gekomen Internationaal Verdrag betreffende de meting
    van schepen, met bijlagen (Trb. 1970, 122);

    Gelet op artikel 10, eerste lid, van het Meetbrievenbesluit 1981;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt, tenzij anders is bepaald, verstaan onder:



            a

              *bovendek:*


              het bovenste aan weer en wind blootgestelde volledige dek, voorzien van permanente, dicht tegen weer en
      wind zijnde, middelen tot afsluiting van alle openingen in de aan weer en wind blootgestelde gedeelten van het dek,
      en waar beneden alle openingen in de zijden van het schip zijn voorzien van permanente middelen tot waterdichte
      afsluiting. Op een schip met een verspringend bovendek wordt het laagste gedeelte van het blootgestelde dek en de
      voortzetting van dat gedeelte evenwijdig aan het verhoogde gedeelte als bovendek beschouwd;



            b

              *holte naar de mal:*


              de vertikale afstand gemeten van de bovenkant van de kiel tot de onderkant van het bovendek in de zijde.
      Bij houten en composiet schepen wordt de afstand gemeten vanaf de onderkant van de sponning in de kiel. Indien de
      vorm in het onderste gedeelte van het grootspant hol verloopt of indien dikke zandstroken zijn aangebracht, wordt
      de afstand gemeten van het punt, waar de lijn die van het vlakke deel van het scheepsvlak naar hart schip wordt
      doorgetrokken, de zijkant van de kiel snijdt;
      bij schepen waar de overgang van huidbeplating naar de dekbeplating als een rond gezette plaat is uitgevoerd, moet
      de holte naar de mal worden gemeten tot het snijpunt van de doorgestrookte lijn van de bovenkant van de balken met
      de doorgestrookte lijn van de buitenkant der spanten;
      indien het bovendek verspringt en het verhoogde gedeelte zich uitstrekt voorbij het punt waar de holte naar de
      mal moet worden bepaald, wordt de holte naar de mal gemeten tot de lijn die vanaf het lage gedeelte van het dek
      evenwijdig aan het verhoogde gedeelte wordt doorgetrokken;



            c

              *breedte:*


              de grootste breedte van het schip midscheeps gemeten op de buitenkant van de spanten bij een schip met een
      metalen huid en op de buitenkant van de huid bij een schip met een huid van een ander materiaal;



            d

              *ingesloten ruimten:*


              alle ruimten, die begrensd worden door de huid van het vaartuig, door vaste of verplaatsbare wanden of
      schotten, door dekken of afdekkingen, anders dan vaste of wegneembare dekzeilen. Onderbrekingen van het dek,
      openingen in de scheepshuid, in een dek of een afdekking van een ruimte, in de wanden of schotten van een ruimte,
      doen, evenmin als het ontbreken van een wand of een schot, niet af aan het feit dat een ruimte een ingesloten
      ruimte is;



            e

              *niet in de tonnage begrepen ruimten:*


              ruimten als hieronder omschreven, die niet behoren tot het volume van de ingesloten ruimten:
              een ruimte gelegen binnen een bovenbouw, grenzend aan een zich van dek tot dek uitstrekkende eindopening –
      waarbij een gordijnplaat, met een hoogte van niet meer dan 25 millimeter boven die van de aangrenzende dekbalken,
      niet in aanmerking wordt genomen – en welke opening een breedte heeft van 90 procent of meer van de dekbreedte ter
      plaatse van de opening. Deze bepaling dient zodanig te worden toegepast, dat van de ingesloten ruimten alleen die
      ruimte niet in de tonnage wordt begrepen, welke gelegen is tussen de werkelijke eindopening en een lijn evenwijdig
      aan de lijn of het vlak van de opening op een afstand van die opening, gelijk aan de helft van de dekbreedte ter
      plaatse van de opening (figuur 1 van bijlage I);
      indien de breedte van de ruimte door een bepaalde constructie, met uitzondering van het naar elkaar toelopen van
      de huidbeplating, minder wordt dan 90 procent van de dekbreedte, wordt alleen de ruimte, gelegen tussen de lijn van
      de opening en een evenwijdige lijn door het punt waar de dwarsscheepse breedte van de ruimte gelijk aan of minder
      wordt dan 90 procent van de dekbreedte, niet in de tonnage van ingesloten ruimten begrepen (figuren 2, 3 en 4 van
      bijlage I);
      wanneer een tussenruimte, op verschansingen of op open relingwerk na geheel open, twee willekeurige ruimten,
      waarvan een of beide volgens het hiervoor onder 1° en/of 2° vermelde aangemerkt kunnen worden als niet in de
      tonnage begrepen ruimten van elkaar scheidt, zal de betrokken ruimte of zullen de betrokken ruimten niet als
      zodanig aangemerkt worden, indien de afstand tussen de twee ruimten minder is dan de kleinste halve dekbreedte ter
      plaatse van de scheiding (figuren 5 en 6 van bijlage I);
      een overdekte ruimte, blootgesteld aan weer en wind, met aan de blootgestelde zijden geen andere verbinding met
      de scheepsromp dan de voor ondersteuning benodigde stutten. In een dergelijke ruimte kunnen open relingwerk of
      een verschansing en gordijnplaat aangebracht worden, of stutten aan de scheepszijden, mits de afstand tussen de
      bovenkant van het relingwerk en de gordijnplaat niet minder bedraagt dan 0,75 meter of een derde van de hoogte van
      de ruimte, welke van beide de grootste is (figuur 7 van bijlage I);
      een ruimte in een zich van boord tot boord uitstrekkende bovenbouw gelegen tussen tegenover elkaar gelegen
      zijopeningen met een hoogte niet minder dan 0,75 meter of een derde van de bovenbouwhoogte, welke van beide de
      grootste is. Indien in een dergelijke bovenbouw de opening slechts aan één zijde is aangebracht, zal de ruimte,
      welke als niet in de tonnage begrepen ruimte wordt aangemerkt, binnenwaarts gemeten, vanaf de opening, beperkt
      worden tot een maximum van de helft van de dekbreedte ter plaatse van de opening (figuur 8 van bijlage I);
      een ruimte in een bovenbouw, onmiddellijk gelegen onder een niet afgedekte opening in het daarboven gelegen dek,
      mits een dergelijke opening aan weer en wind is blootgesteld en de ruimte, welke niet als de ingesloten ruimte
      wordt aangemerkt, begrensd wordt door de oppervlakte van de opening (figuur 9 van bijlage I);
      een nis in een buitenwand van een aan weer en wind blootgestelde bovenbouw, waarvan de opening zonder mogelijkheden
      tot afsluiting, zich van dek tot dek uitstrekt, mits de binnenwaarts gelegen breedte nergens groter is dan de
      breedte bij de ingang en de binnenwaartse lengte in de bovenbouw niet groter is dan tweemaal de breedte van de
      ingang (figuur 10 van bijlage I);
              De onder 1° tot en met 7° omschreven ruimten worden evenwel behandeld als ‘ingesloten ruimten’ indien:
              de ruimte is voorzien van planken of andere middelen voor het vastzetten van lading of voorraden; of
      de openingen zijn voorzien van enige middelen tot sluiting; of
      de constructie voorziet in enige mogelijkheid tot het sluiten van die openingen;



            f

              *passagiers:*


              alle personen aan boord met uitzondering van:
              de kapitein en de schepelingen of andere personen die, in welke hoedanigheid dan ook, aan boord ten behoeve
      van het schip in dienst of tewerkgesteld zijn;
      kinderen beneden de leeftijd van één jaar.



            g

              *ladingruimten:*


              ingesloten ruimten, begrepen in de berekening van de netto-tonnage, die geschikt zijn voor het vervoer van
      uit het schip te lossen lading, mits zodanige ruimten eveneens begrepen zijn in de berekening van de bruto-tonnage.
      Deze ladingruimten worden kenbaar gemaakt door hen te merken, met de letters CC (Cargo Compartment) die zodanig
      moeten worden aangebracht dat ze tenminste 100 millimeter hoog en duidelijk zichtbaar zijn;



            h

              *dicht tegen weer en wind:*


              zodanig dicht dat onder alle omstandigheden die zich op zee kunnen voordoen, geen water in het schip kan
      binnendringen;



            i

              *bruto-tonnage:*


              de maat van de totale inhoud van een schip vastgesteld volgens de bepalingen van deze regeling;



            j

              *netto-tonnage:*


              de maat van de nuttige capaciteit van een schip vastgesteld volgens de bepalingen van deze regeling;



            k

              *pleziervaartuig:*


              een vaartuig dat uitsluitend voor sportbeoefening of vrijetijdsbesteding wordt gebezigd en waarmee geen
      passagiers tegen vergoeding worden vervoerd;



            l

              *motorjacht:*


              een pleziervaartuig dat hoofdzakelijk door middel van één of meer werktuigen wordt voortbewogen;



            m

              *zeiljacht:*


              een pleziervaartuig dat hoofdzakelijk door middel van één of meer zeilen wordt voortbewogen;



            n

              *vissersvaartuig:*


              een zeevissersschip in de zin van [artikel 2, derde lid, van boek 8 van het Burgerlijk Wetboek][ref1];



            o

              *romplengte:*


              de totale lengte van de romp, gemeten in het langsscheepse middenvlak evenwijdig aan de ontwerp
      geladen waterlijn tussen het voorste deel van het bovenste uiteinde van de voorsteven en het achterste deel
      van de achtersteven of spiegel, met inbegrip van alle structurele en integrale delen van de romp waaronder
      mede begrepen houten en metalen voor- en achterstevens, verschansingen, permanente berghouten en romp/dek-
      verbindingen en met uitzondering van rondhouten, boegsprieten, preekstoelen aan beide einden van het vaartuig,
      voorstevenbeslag, roeren, buitenboord- motoren of buitenboordaandrijvingen inclusief bevestigingspunten, zwem- of
      aanlandingsbordessen en wegneembare stootranden;



            p

              *rompbreedte:*


              de grootste breedte van de romp, met inbegrip van alle structurele en integrale delen van de romp waaronder
      mede begrepen verschansingen, permanente berghouten en romp/dek-verbindingen en met uitzondering van zwaarden en
      buitenboordaandrijvingen inclusief bevestigingspunten, relingwerk, beslag en wegneembare stootranden;



            q

              *lengte over alles:*


              de lengte zoals omschreven in artikel 2, eerste lid, van de verordening nr. 86/2930/EEG van de Raad van de
      Europese Gemeenschappen van 22 september 1986 houdende definities van de kenmerken van vissersvaartuigen (PbEG L
      274), naar de tekst zoals deze bij die verordening is vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005034#Artikel2
    url: https://wetten.overheid.nl/BWBR0006017/2024-10-01#Artikel1
