  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede verstaan onder beroepspensioenvereniging: een daarmee
      door Onze Minister gelijkgestelde instelling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel1
  - number: '2.1'
    text: |-
      Een uitkering voor een gemoedsbezwaarde als bedoeld in
      [artikel 64, eerste lid, onderdeel a, van de Wet financiering sociale verzekeringen][ref1] is geen pensioen in de
      zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0017745#Artikel64
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0017745
        artikel: '64'
  - number: '2.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld op grond waarvan
      aanvullingen op een loonaanvullingsuitkering of een vervolguitkering als bedoeld in
      [artikel 60, eerste lid, van de Wet werk en inkomen naar arbeidsvermogen][ref1] die geen
      arbeidsongeschiktheidspensioen zijn als bedoeld in [artikel 1][ref2] worden aangemerkt als
      arbeidsongeschiktheidspensioen als bedoeld in [dat artikel][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0019057#Artikel60
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019057
        artikel: '60'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '1'
        hoofdstuk: '1'
  - number: '2.3'
    text: |-
      De voordracht voor een krachtens het tweede lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
  - number: '2.4'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld met betrekking tot kapitaalregelingen of
      premieregelingen waarbij het op de pensioendatum beschikbaar komende kapitaal wordt gesplitst in een deel dat wordt
      aangewend voor aankoop van een direct ingaande tijdelijke uitkering en een deel dat later wordt aangewend voor de
      aankoop van een, op de tijdelijke uitkering aansluitende, levenslange uitkering. In deze regeling:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
  - number: 2.4.a
    text: |-
      kunnen dergelijke uitkeringen, en daarbij horende uitkeringen voor nabestaanden, worden gelijkgesteld met een
      pensioen als bedoeld in [artikel 1][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '1'
        hoofdstuk: '1'
  - number: 2.4.b
    text: |-
      kan worden bepaald dat dit pensioen voldoet aan de [artikelen 31][ref1] en [75][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel75
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '31'
        hoofdstuk: '3'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '75'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 2.4.c
    text: |-
      kan worden bepaald dat pensioenuitvoerders verplicht zijn mee te werken aan splitsing zoals beschreven in de
      aanhef; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
  - number: 2.4.d
    text: kunnen regels worden gesteld betreffende een goede uitvoering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
  - number: '2.5'
    text: |-
      De regeling, bedoeld in het vierde lid, is uitsluitend van toepassing indien de pensioendatum is gelegen na
      31 december 2008 en het op de pensioendatum beschikbaar komende kapitaal nog niet is aangewend voor aankoop van een
      levenslange uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
  - number: '2.6'
    text: |-
      Waar in deze wet sprake is van de Nederlandse sociale en arbeidswetgeving betreft dit in ieder geval de
      [artikelen 1][ref1], [2][ref2], [19 tot en met 23][ref3], [28 tot en met 39][ref4], [44][ref5], [45][ref6],
      [48 tot en met 64][ref7], [66 tot en met 103][ref8] en [105][ref9].


