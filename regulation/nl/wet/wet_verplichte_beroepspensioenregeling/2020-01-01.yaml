bwb_id: BWBR0018831
url: https://wetten.overheid.nl/BWBR0018831/2020-01-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in verband met modernisering van de pensioenwetgeving,
    de Wet betreffende verplichte deelneming in een beroepspensioenregeling in te trekken en te vervangen door een
    nieuwe wet ter zake;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder: - aanspraakgerechtigde:
      persoon die begunstigde is voor een nog niet ingegaan pensioen;
        - accountant: een accountant als bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1];
        - afkoop: iedere handeling waardoor pensioenaanspraken en pensioenrechten hun pensioenbestemming verliezen,
      behoudens in geval van toepassing van de [artikelen 66, zesde lid][ref2], [129][ref3] of [214a, tweede lid][ref4],
      of van [artikel 3A:85 van de Wet op het financieel toezicht][ref5];
        - arbeidsongeschiktheidspensioen: een geldelijke, vastgestelde uitkering wegens arbeidsongeschiktheid van de
      beroepsgenoot of gewezen beroepsgenoot, waarop recht bestaat nadat de arbeidsongeschiktheid 104 weken heeft geduurd
      of, indien er sprake is van een beroepsgenoot in loondienst, waarop recht bestaat na afloop van de periode bedoeld
      in [artikel 29, eerste lid, van de Ziektewet][ref6] of, indien de beroepsgenoot Ziektewetuitkering ontvangt, na
      afloop van de periode bedoeld in artikel 29, vijfde en tiende lid, van de Ziektewet;
        - basispensioenregeling: de collectieve beroepspensioenregeling of het deel van de beroepspensioenregeling waaraan
      de beroepsgenoot op basis van de beroepspensioenregeling gehouden is om deel te nemen;
        - beëindiging van de deelneming: het beëindigen van de pensioenverwerving op basis van de beroepspensioenregeling
      anders dan door: 1°. het overlijden van de beroepsgenoot; of 2°. het ingaan van het ouderdomspensioen;
        - beroepsgenoot: een natuurlijk persoon die deel uitmaakt van een bepaalde beroepsgroep;
        - beroepspensioenfonds: een voor een bepaalde beroepsgroep werkend pensioenfonds, als bedoeld in
      [artikel 1 van de Pensioenwet][ref7], dat is opgericht ter uitvoering van een beroepspensioenregeling;
        - beroepspensioenregeling: 1°. door beroepsgenoten overeengekomen rechten en plichten ten aanzien van pensioen
      ten behoeve van beroepsgenoten en gewezen beroepsgenoten, dan wel 2°. indien de aan een beroepspensioenregeling
      deelnemende zelfstandige of beroepsgenoot in een andere lidstaat dan Nederland is gevestigd, een overeenkomst, een
      trustakte of voorschriften waarin is bepaald welke pensioenuitkeringen worden toegezegd en onder welke voorwaarden;
        - beroepspensioenvereniging: een vereniging waarvan beroepsgenoten lid zijn en die volledige rechtsbevoegdheid
      bezit, waarvan het statutaire doel uitsluitend omvat het verzorgen van een beroepspensioenregeling en waarbij het
      lidmaatschap niet automatisch voortvloeit uit het lidmaatschap van enig andere organisatie of uit het deelnemen in
      een beroepspensioenregeling;
        - bevoegde autoriteiten: nationale autoriteiten van andere lidstaten dan Nederland als bedoeld in artikel 6,
      onderdeel 8, van [richtlijn 2016/2341](32016L2341)/EU;
        - bijdrage: iedere geldsom die wordt voldaan aan een pensioenuitvoerder in het kader van de uitvoering van
      beroepspensioenregelingen en uitvoeringsovereenkomsten;
        - bijzonder partnerpensioen: de aanspraak op partnerpensioen die op grond van
      [artikel 68, eerste, tweede of derde lid][ref8], verkregen wordt door de gewezen partner;
        - buitenlandse instelling: een instelling met zetel buiten Nederland, niet zijnde een pensioeninstelling
      of verzekeraar in een andere lidstaat, een van de Europese Gemeenschappen of een instelling als bedoeld in
      [artikel 81, tweede lid][ref9];
        - collectief toedelingsmechanisme: wijze waarop financiële mee- en tegenvallers collectief worden verwerkt in
      variabele uitkeringen;
        - deelnemer: de beroepsgenoot die op grond van een beroepspensioenregeling pensioenaanspraken verwerft jegens de
      pensioenuitvoerder;
        - dekkingsgraad: de verhouding tussen het vermogen inzake de bij een beroepspensioenfonds ondergebrachte
      beroepspensioenregeling of beroepspensioenregelingen en de technische voorzieningen van een beroepspensioenfonds;
        - elektronisch: door middel van een elektronische informatiedrager die de ontvanger in staat stelt de verstrekte
      informatie duurzaam te bewaren;
        - gedetacheerd beroepsgenoot: een beroepsgenoot die in een andere lidstaat wordt gedetacheerd om daar te werken en
      die krachtens titel II van verordening (EEG) nr.1408/71 van de Raad van de Europese gemeenschappen van 14 juni 1971
      betreffende de toepassing van de sociale zekerheidsregelingen op loontrekkenden en hun gezinnen, die zich binnen de
      gemeenschap verplaatsten (Pb EG L 149), onderworpen blijft aan de wetgeving van de lidstaat van oorsprong;
        - gepensioneerde: pensioengerechtigde voor wie het ouderdomspensioen is ingegaan;
        - gewezen deelnemer: de beroepsgenoot of gewezen beroepsgenoot die geen pensioenaanspraken op grond van de
      beroepspensioenregeling meer verwerft jegens de pensioenuitvoerder en die bij beëindiging van de deelneming
      pensioenaanspraken heeft behouden jegens de pensioenuitvoerder;
        - kapitaalregeling: een beroepspensioenregeling inzake een vastgesteld kapitaal dat uiterlijk op de pensioendatum
      wordt omgezet in een vastgestelde of variabele pensioenuitkering;
        - lidstaat: een lidstaat van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese Unie, die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
        - nabestaandenpensioen: partnerpensioen of wezenpensioen;
        - nettopensioen: ouderdomspensioen of nabestaandenpensioen in de vorm van een nettopensioen als bedoeld in
      [afdeling 5.3B van de Wet inkomstenbelasting 2001][ref10];
        - ontvangende pensioenuitvoerder: de pensioenuitvoerder aan wie in het kader van waardeoverdracht waarde wordt
      overgedragen;
        - Onze Minister: Onze Minister van Sociale Zaken en Werkgelegenheid;
        - ouderdomspensioen: een geldelijke uitkering, die vastgesteld of variabel is, voor de beroepsgenoot of de gewezen
      beroepsgenoot bij wijze van inkomensvoorziening bij ouderdom;
        - overdrachtswaarde: de ten behoeve van de waardeoverdracht vastgestelde waarde van de over te dragen
      pensioenaanspraken of pensioenrechten;
        - overdragende pensioenuitvoerder: de pensioenuitvoerder die in het kader van waardeoverdracht waarde overdraagt
      aan een andere pensioenuitvoerder;
        - partner: echtgenoot, geregistreerde partner of partner in de zin van de beroepspensioenregeling;
        - partnerpensioen: een geldelijke uitkering, die vastgesteld of variabel is, voor de echtgenoot, de geregistreerde
      partner of de partner, de gewezen echtgenoot, de gewezen geregistreerde partner of gewezen partner wegens het
      overlijden van de beroepsgenoot of gewezen beroepsgenoot;
        - partnerrelatie: huwelijk, geregistreerd partnerschap of partnerrelatie in de zin van de beroepspensioenregeling;
        - pensioen: ouderdomspensioen, arbeidsongeschiktheidspensioen of nabestaandenpensioen;
        - pensioenaanspraak: het recht op een nog niet ingegaan pensioen, uitgezonderd overeengekomen voorwaardelijke
      toeslagverlening;
        - pensioenbewaarder: de pensioenbewaarder, bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref11];
        - pensioeneenheid: eenheid van deelname in een beleggingsportefeuille, waarbij de waarde fluctueert met de
      koersontwikkeling van deze portefeuille en eventueel met de ontwikkeling van de levensverwachting;
        - pensioengerechtigde: persoon voor wie op grond van de beroepspensioenregeling het pensioen is ingegaan;
        - pensioeninstelling uit een andere lidstaat: een op basis van kapitaaldekking gefinancierde instelling, ongeacht
      de rechtsvorm, die zetel heeft in een andere lidstaat dan Nederland en die onafhankelijk van enige bijdragende
      onderneming of bedrijfstak is opgericht met als doel het verstrekken van arbeidsgerelateerde pensioenuitkeringen
      op basis van een als volgt gesloten overeenkomst: 1°. individueel of collectief tussen een of meerdere werkgevers
      en een of meerdere werknemers of hun respectievelijke vertegenwoordigers, of 2°. individueel of collectief met
      zelfstandigen, en die hiermee rechtstreeks verband houdende werkzaamheden verricht;
        - pensioenrecht: het recht op een ingegaan pensioen, uitgezonderd overeengekomen voorwaardelijke toeslagverlening;
        - pensioenreglement: de door de pensioenuitvoerder opgestelde regeling met betrekking tot de verhouding tussen
      pensioenuitvoerder en deelnemer;
        - pensioenuitvoerder: een beroepspensioenfonds, of een premiepensioeninstelling of verzekeraar die zetel heeft
      in Nederland;
        - pensioenverplichtingen: verplichtingen van de pensioenuitvoerder uit hoofde van pensioenaanspraken en
      pensioenrechten;
        - premie: de in geld uitgedrukte periodiek vastgestelde structurele prestatie die verschuldigd is aan de
      pensioenuitvoerder en die bestemd is voor de verzekering van pensioen en de daaraan verbonden kosten;
        - premiepensioeninstelling: een premiepensioeninstelling die op grond van de
      [Wet op het financieel toezicht][ref12] in Nederland het bedrijf van premiepensioeninstelling mag uitoefenen;
        - premieregeling: een beroepspensioenregeling inzake een vastgestelde premie die uiterlijk op de pensioendatum
      wordt omgezet in een vastgestelde of variabele pensioenuitkering;
        - richtlijn 2016/2341/EU: [richtlijn 2016/2341](32016L2341)/EU van het Europees Parlement en de Raad van
      14 december 2016 betreffende de werkzaamheden van en het toezicht op instellingen voor bedrijfspensioenvoorziening
      (IBPV’s) (PbEU L 2016, 354);
        - risicovrije rente: de door De Nederlandsche Bank N.V. gepubliceerde actuele rentetermijnstructuur;
        - scheiding: echtscheiding, ontbinding van het huwelijk na scheiding van tafel en bed, beëindiging van een
      geregistreerd partnerschap anders dan door dood, vermissing of omzetting van een geregistreerd partnerschap in een
      huwelijk of beëindiging van een partnerrelatie in de zin van de pensioenovereenkomst;
        - schriftelijk: in schrifttekens op papier;
        - toedelingskring: groep personen waarop een collectief toedelingsmechanisme wordt toegepast;
        - toeslag: 'een verhoging van: 1°. een pensioenrecht; 2°. een pensioenaanspraak van een gewezen deelnemer, mits'
      die verhoging bij een kapitaalregeling niet voortvloeit uit rente- of winstdeling of bij een premieregeling
      niet voorvloeit uit behaald beleggingsrendement; 3°. een pensioenaanspraak van een deelnemer op grond van een
      uitkeringsregeling gebaseerd op het middelloonstelsel of gebaseerd op een vastebedragenregeling, mits de verhoging
      geen verband houdt met een verhoging van de pensioengrondslag, de toename van het in aanmerking te nemen aantal
      jaren of een wijziging van de beroepspensioenregeling; of 4°. een pensioenaanspraak van een gepensioneerde ten
      behoeve van zijn partner;
        - toezichthouder: de Stichting Autoriteit Financiële Markten of De Nederlandsche Bank N.V., ieder voor zover belast
      met de uitoefening van het toezicht bij of krachtens [artikel 146][ref13];
        - uitkeringsregeling: een beroepspensioenregeling inzake een vastgestelde pensioenuitkering;
        - uitvoeringsovereenkomst: de overeenkomst tussen de beroepspensioenvereniging en de pensioenuitvoerder over de
      uitvoering van de beroepspensioenregeling;
        - verplichtstelling: de verplichte deelneming in een beroepspensioenregeling op grond van
      [artikel 5, eerste lid][ref14];
        - verzekeraar: een verzekeraar die op grond van de [Wet op het financieel toezicht][ref15] in Nederland het bedrijf
      van levensverzekeraar of schadeverzekeraar mag uitoefenen;
        - voorwaarden in verband met de partnerrelatie: huwelijkse voorwaarden, voorwaarden van een geregistreerd
      partnerschap of voorwaarden in verband met een partnerrelatie in de zin van de beroepspensioenregeling;
        - vrijwillige pensioenregeling: het deel van de beroepspensioenregeling waaraan de beroepsgenoot op basis van de
      beroepspensioenregeling de mogelijkheid heeft om deel te nemen;
        - waardeoverdracht: iedere handeling waarbij de waarde van opgebouwde pensioenaanspraken of pensioenrechten
      wordt aangewend ten behoeve van: 1°. andere pensioenaanspraken of pensioenrechten bij dezelfde of een andere
      pensioenuitvoerder; of 2°. dezelfde pensioenaanspraken of pensioenrechten bij een andere pensioenuitvoerder;
        - wezenpensioen: een geldelijke, vastgestelde uitkering voor een kind tot wie de overleden beroepsgenoot of gewezen
      beroepsgenoot als ouder in familierechtelijke betrekking stond of voor diens stief- of pleegkind, wegens het
      overlijden van de beroepsgenoot of gewezen beroepsgenoot;
        - zetel: de plaats waar een rechtspersoon volgens zijn statuten of reglementen is gevestigd of, indien het een
      pensioenfonds, beroepspensioenfonds of pensioeninstelling uit een andere lidstaat betreft, de plaats waar deze
      volgens zijn statuten of reglementen is gevestigd en zijn hoofdbestuur heeft of, indien het een pensioeninstelling
      uit een andere lidstaat betreft die geen rechtspersoon is of een natuurlijke persoon betreft, de plaats waar die
      pensioeninstelling of persoon zijn hoofdbestuur heeft.


