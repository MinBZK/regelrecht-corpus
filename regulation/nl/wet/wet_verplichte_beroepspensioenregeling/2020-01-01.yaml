  - number: '2.7'
    text: |-
      Een nettolijfrente als bedoeld in [artikel 5.16, tweede lid, van de Wet inkomstenbelasting 2001][ref1] is geen
      pensioen in de zin van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel2
