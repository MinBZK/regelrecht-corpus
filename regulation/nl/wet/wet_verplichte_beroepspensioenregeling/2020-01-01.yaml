        artikel: 57a
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: '214.14'
    text: |-
      Indien een verzekeraar en een pensioengerechtigde ter zake van een pensioen waarvan de ingangsdatum is gelegen
      tussen 1 januari 2014 en 8 juli 2015 en dat is gebaseerd op een premieregeling of een kapitaalregeling, zijn
      overeengekomen dat de pensioenuitkering wordt omgezet in een kapitaal dat wordt aangewend voor een variabele
      uitkering, is, in afwijking van [artikel 81, derde lid][ref1], de verzekeraar die geen variabele uitkeringen
      uitvoert, verplicht om op verzoek van de pensioengerechtigde het kapitaal over te dragen aan een andere
      pensioenuitvoerder ten behoeve van de aankoop van een variabele uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
