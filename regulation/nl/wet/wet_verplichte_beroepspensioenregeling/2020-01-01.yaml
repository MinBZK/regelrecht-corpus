  - number: 214a.1
    text: |-
      [Artikel 66, zesde lid][ref1], is van toepassing indien de deelneming eindigt vanaf het tijdstip van
      inwerkingtreding van [artikel II, onderdeel E, van de Wet waardeoverdracht klein pensioen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0040435#ArtikelII
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214a
