        artikel: '5'
  - number: '2.8'
    text: |-
      Voor de toepassing van de [artikelen 75c][ref1], [132, derde lid, onderdeel a][ref2], [143a][ref3], [144][ref4]
      en [145, onderdeel b][ref5], wordt, voor zover het gaat om verzekeren bij een verzekeraar, onder verzekeraar mede
      verstaan een herverzekeraar als bedoeld in [artikel 1:1 van de Wet op het financieel toezicht][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel75c
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel132
