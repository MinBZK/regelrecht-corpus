  - number: 214a.5
    text: |-
      Indien de deelneming is geëindigd voor 1 januari 2018 heeft de pensioenuitvoerder, in afwijking van de
      [artikelen 77][ref1] en [78][ref2], het recht om op zijn vroegst twee jaar na beëindiging van de deelneming
      pensioenaanspraken van een gewezen deelnemer af te kopen, indien op basis van de tot het tijdstip van beëindiging
      van de deelneming opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op
      de reguliere ingangsdatum, getoetst per 1 januari van dat jaar, minder zal bedragen dan het in artikel 78, eerste
      lid, onderdeel a, genoemde bedrag, tenzij de gewezen deelnemer binnen twee jaar na beëindiging van de deelneming
      een procedure tot waardeoverdracht is gestart. De pensioenuitvoerder die gebruik wil maken van dit recht informeert
      de gewezen deelnemer over zijn besluit hieromtrent binnen zes maanden na afloop van de periode van twee jaar na
      beëindiging van de deelneming en gaat over tot uitbetaling van de afkoopwaarde binnen die termijn van zes maanden.
      Artikel 78, vierde en vijfde lid, is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214a
    references:
