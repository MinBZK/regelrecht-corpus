        artikel: 110c
        hoofdstuk: '4'
  - number: '214.7'
    text: |-
      Indien een persoon die het beleid van een beroepspensioenfonds bepaalt of mede bepaalt voorafgaand aan het tijdstip
      van inwerkingtreding van [artikel VI van de Wet versterking bestuur pensioenfondsen][ref1] deskundig is in verband
      met de uitoefening van het bedrijf van het beroepspensioenfonds wordt die persoon vanaf dat tijdstip geacht
      geschikt te zijn als bedoeld in [artikel 110, derde lid][ref2], en vanaf het tijdstip van inwerkingtreding van
      [artikel II, onderdeel C, van de Wet versterking bestuur pensioenfondsen][ref3], [artikel 110c, eerste lid][ref4],
      zolang niet een wijziging in de relevante feiten en omstandigheden een redelijke aanleiding geeft tot een
      beoordeling of herbeoordeling van die geschiktheid.


      [ref1]: https://wetten.overheid.nl/BWBR0033702#ArtikelVI
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0033702#ArtikelII
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
