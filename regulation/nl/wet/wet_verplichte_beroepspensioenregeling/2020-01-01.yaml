        bwb_id: BWBR0018831
        artikel: '60'
        hoofdstuk: '3'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 57a
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: '51.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
  - number: '52.1'
    text: |-
      De pensioenuitvoerder verstrekt degene die gewezen partner wordt en een aanspraak verkrijgt op bijzonder
      partnerpensioen:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel52
  - number: 52.1.a
    text: een opgave van de opgebouwde pensioenaanspraak op partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel52
  - number: 52.1.b
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel52
  - number: 52.1.c
    text: informatie die voor de gewezen partner specifiek van belang is; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel52
  - number: 52.1.d
    text: |-
      informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: '52.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel52
  - number: '53.1'
    text: |-
      De pensioenuitvoerder verstrekt de gewezen partner met aanspraak op bijzonder partnerpensioen ten minste een keer
      in vijf jaar:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel53
  - number: 53.1.a
    text: een opgave van de opgebouwde aanspraak op partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel53
  - number: 53.1.b
    text: informatie over toeslagverlening; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel53
  - number: 53.1.c
    text: |-
      informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: '53.2'
    text: |-
      De pensioenuitvoerder informeert de gewezen partner binnen drie maanden na een wijziging van het toeslagbeleid over
      die wijziging.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel53
  - number: '53.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel53
  - number: '54.1'
    text: 'De pensioenuitvoerder verstrekt degene die pensioengerechtigde wordt:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel54
  - number: 54.1.a
    text: een opgave van zijn pensioenrecht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel54
  - number: 54.1.b
    text: een opgave van de opgebouwde aanspraken op nabestaandenpensioen wanneer de beroepspensioenregeling daarin voorziet;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel54
  - number: 54.1.c
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel54
  - number: 54.1.d
    text: |-
      informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: 54.1.e
    text: |-
      informatie die voor degene die pensioengerechtigde wordt specifiek in het kader van de pensioeningang van belang
      is.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel54
  - number: '54.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel54
  - number: '55.1'
    text: 'De pensioenuitvoerder verstrekt de pensioengerechtigde jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: 55.1.a
    text: een opgave van zijn pensioenrecht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: 55.1.b
    text: een opgave van de opgebouwde aanspraken op nabestaandenpensioen wanneer de beroepspensioenregeling daarin voorziet;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: 55.1.c
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: 55.1.d
    text: |-
      informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: 55.1.e
    text: informatie over garanties; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: 55.1.f
    text: informatie over het land waar het pensioen is ondergebracht en de toezichthouder waar het pensioen onder valt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: '55.2'
    text: |-
      De pensioenuitvoerder informeert de pensioengerechtigde binnen drie maanden na een voor hem relevante wijziging in
      het pensioenreglement over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij
      de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: '55.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55
  - number: 55a.1
    text: |-
      De pensioenuitvoerder die bereid is op te treden als ontvangende pensioenuitvoerder informeert degene die het
      uit een kapitaalregeling of premieregeling voortvloeiende kapitaal op de pensioendatum wenst aan te wenden voor
      een variabele uitkering over de voor hem relevante gevolgen en risico’s bij een variabele uitkering waaronder
      een opgave van de hoogte van de variabele uitkeringen en een opgave van de hoogte van de vastgestelde uitkeringen
      indien het kapitaal daarvoor zou worden aangewend. Deze opgaven worden, voor zover het ouderdomspensioen betreft,
      tevens weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario. De
      pensioenuitvoerder die een spreidingsperiode van langer dan vijf jaar aanbiedt, informeert de deelnemer expliciet
      over de voor hem relevante gevolgen en risico’s daarvan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55a
  - number: 55a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie, de rekenregels en de wijze waarop de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel55a
  - number: '56.1'
    text: |-
      De pensioenuitvoerder informeert een deelnemer voorafgaand aan de deelneming in de vrijwillige pensioenregeling
      over:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: 56.1.a
    text: de inhoud van de vrijwillige pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: 56.1.b
    text: een opgave van de reglementair te bereiken pensioenaanspraken uit hoofde van de vrijwillige pensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: 56.1.c
    text: de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: 56.1.d
    text: |-
      vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: 56.1.e
    text: voor zover van toepassing, informatie over beleggingsresultaten; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: 56.1.f
    text: |-
      voor zover van toepassing, informatie over de structuur van de kosten die door deelnemers, gewezen deelnemers en
      pensioengerechtigden worden gedragen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: '56.2'
    text: |-
      De opgave van de reglementair te bereiken pensioenaanspraken wordt, voor zover het ouderdomspensioen betreft,
      tevens weergegeven op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: '56.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te hanteren rekenregels.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56
  - number: 56a.1
    text: |-
      Een beroepspensioenfonds neemt in zijn bestuursverslag informatie op over de uitvoeringskosten over het
      verslagjaar, waarbij worden onderscheiden: administratieve uitvoeringskosten, de kosten van vermogensbeheer en
      transactiekosten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56a
  - number: 56a.2
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel56a
  - number: '57.1'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer, de gewezen partner of de pensioengerechtigde
      op verzoek:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: 57.1.a
    text: |-
      informatie over de gehanteerde aannamen bij de weergave van ouderdomspensioen op basis van een pessimistisch
      scenario, een verwacht scenario en een optimistisch scenario;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: 57.1.b
    text: de voor hem relevante informatie over beleggingen; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: 57.1.c
    text: informatie over andere bij algemene maatregel van bestuur te bepalen onderwerpen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: '57.2'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, de gewezen deelnemer of de gewezen partner op verzoek informatie die
      specifiek voor hem relevant is waaronder een indicatie van het mogelijk te bereiken kapitaal op de pensioendatum
      bij premieregelingen waarbij de premie wordt belegd en een indicatie van de hoogte van de in te kopen periodieke
      uitkeringen bij aanwending van het mogelijk te bereiken kapitaal bij kapitaalregelingen en premieregelingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: '57.3'
    text: |-
      De indicaties, bedoeld in het tweede lid, worden, voor zover het ouderdomspensioen betreft, tevens weergegeven op
      basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: '57.4'
    text: |-
      De pensioenuitvoerder verstrekt de gewezen partner op verzoek de informatie in [artikel 53, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel53
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: '57.5'
    text: |-
      De pensioenuitvoerder verstrekt de pensioengerechtigde op verzoek een opgave van zijn pensioenrecht, waarbij
      deze gegevens voor zover het ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch
      scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: '57.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te hanteren rekenregels.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57
  - number: 57a.1
    text: |-
      De pensioenuitvoerder stelt op zijn website voor in ieder geval de deelnemer, gewezen deelnemer, gewezen partner of
      pensioengerechtigde beschikbaar:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.1.a
    text: |-
      informatie over de beroepspensioenregeling als bedoeld in [artikel 48][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel48
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: 57a.1.b
    text: verdere informatie over de beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.1.c
    text: informatie over uitvoeringskosten; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.1.d
    text: het bestuursverslag en de jaarrekening.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.2
    text: |-
      Voor zover van toepassing stelt de pensioenuitvoerder op zijn website voor de deelnemer, gewezen deelnemer, gewezen
      partner of pensioengerechtigde beschikbaar:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.2.a
    text: informatie over de gevolgen van significante wijzigingen in de technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.2.b
    text: informatie over het financieel crisisplan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.2.c
    text: informatie over het herstelplan of geactualiseerd herstelplan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.2.d
    text: het pensioenreglement; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.2.e
    text: de uitvoeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.3
    text: |-
      Voor zover van toepassing stelt de pensioenuitvoerder op zijn website voor een ieder de verklaring inzake
      beleggingsbeginselen beschikbaar.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.4
    text: |-
      In het bestuursverslag, bedoeld in het eerste lid, onderdeel d, neemt een beroepspensioenfonds informatie
      op over de haalbaarheidstoets en de reële dekkingsgraad. Een pensioenuitvoerder neemt in het bestuursverslag
      informatie op over de totale waarde en de bestemming van de pensioenaanspraken die vervallen, bedoeld in
      [artikel 66, zesde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel66
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 57a.5
    text: |-
      Indien de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde hierom verzoekt verstrekt
      de pensioenuitvoerder de in het eerste tot en met derde lid bedoelde informatie en stukken elektronisch of
      schriftelijk.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: 57a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer het opnemen van gegevens over de vergelijkbaarheid van onderdelen van de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel57a
  - number: '58.1'
    text: |-
      De pensioenuitvoerder verstrekt deelnemers, gewezen deelnemers en gepensioneerden die zich in een andere lidstaat
      vestigen informatie over hun pensioenaanspraken en pensioenrechten en over de mogelijkheden die hun op grond van de
      pensioenregeling worden geboden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58
  - number: '58.2'
    text: |-
      De informatie die op grond van het eerste lid wordt verstrekt is ten minste overeenkomstig de informatie die wordt
      verstrekt aan deelnemers, gewezen deelnemers en gepensioneerden die in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58
  - number: 58a.1
    text: |-
      Voorafgaand aan de totstandkoming van een overeenkomst inzake een pensioenuitkering stelt een verzekeraar die
      bereid is op te treden als ontvangende pensioenuitvoerder, op basis van informatie die verstrekt is door de
      betrokkene die het uit een kapitaalregeling of premieregeling voortvloeiende kapitaal op de pensioendatum wenst aan
      te wenden voor een pensioenuitkering, de wensen en behoeften van de betrokkene vast en verstrekt hij de betrokkene
      informatie over overeenkomsten inzake een pensioenuitkering om hem in staat te stellen met kennis van zaken een
      beslissing te nemen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58a
  - number: 58a.2
    text: |-
      Een door de verzekeraar voorgestelde pensioenuitkering is in overeenstemming met de wensen en behoeften van de
      betrokkene.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58a
  - number: 58a.3
    text: De verzekeraar neemt op zorgvuldige wijze de gerechtvaardigde belangen van de betrokkene in acht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58a
  - number: 58a.4
    text: |-
      De Autoriteit Financiële Markten geeft met betrekking tot het derde lid slechts toepassing aan [artikel 166][ref1]
      bij evidente misstanden die het vertrouwen in de verzekeraar of in de financiële markten kunnen schaden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 58b
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      informatieverstrekking door een verzekeraar over een overeenkomst inzake een pensioenuitkering en de
      dienstverlening.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58b
  - number: 58c
    text: |-
      Indien een verzekeraar de betrokkene adviseert over een overeenkomst inzake een pensioenuitkering, licht de
      verzekeraar de overwegingen toe die ten grondslag liggen aan zijn advies voor zover dit nodig is voor een goed
      begrip van zijn advies.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel58c
  - number: '59.1'
    text: |-
      De informatie die de pensioenuitvoerder verstrekt of beschikbaar stelt is correct, duidelijk en evenwichtig. De
      informatie wordt tijdig verstrekt of beschikbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel59
  - number: '59.2'
    text: |-
      De pensioenuitvoerder bevordert dat persoonlijke informatie aansluit bij de informatiebehoefte en kenmerken van de
      deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel59
  - number: '59.3'
    text: |-
      De pensioenuitvoerder bevordert dat de informatie de deelnemer, gewezen deelnemer, gewezen partner of
      pensioengerechtigde inzicht geeft in de keuzemogelijkheden die er zijn in de beroepspensioenregeling en de gevolgen
      van belangrijke gebeurtenissen voor het pensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel59
  - number: '59.4'
    text: |-
      De informatie, bedoeld in de [artikelen 49, eerste lid][ref1], [51, eerste lid][ref2], [53, eerste lid][ref3],
      en [55, eerste lid][ref4], wordt verstrekt door middel van een uniform pensioenoverzicht. In het uniform
      pensioenoverzicht wordt een verwijzing opgenomen naar de website van de pensioenuitvoerder, de website waarop het
      pensioenregister te raadplegen is en wordt gewezen op de mogelijkheden die [artikel 57][ref5] biedt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel49
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel51
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel53
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel55
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel57
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '49'
        hoofdstuk: '3'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '51'
        hoofdstuk: '3'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '53'
        hoofdstuk: '3'
        paragraaf: '2.2'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '55'
        hoofdstuk: '3'
        paragraaf: '2.2'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '57'
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: '59.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel
      over onder meer het uniform pensioenoverzicht en het verstrekken van informatie door middel van het uniform
      pensioenoverzicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel59
  - number: '60.1'
    text: |-
      De pensioenuitvoerder verstrekt de informatie elektronisch of schriftelijk. Er wordt ten hoogste eenmaal per jaar
      gewisseld tussen schriftelijke verstrekking en elektronische verstrekking van de informatie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: '60.2'
    text: |-
      De pensioenuitvoerder informeert de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde
      schriftelijk of elektronisch over het voornemen tot elektronische verstrekking.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: '60.3'
    text: |-
      De pensioenuitvoerder verstrekt de informatie schriftelijk, indien de deelnemer, gewezen deelnemer, gewezen partner
      of pensioengerechtigde over het voornemen tot elektronische verstrekking, bedoeld in het tweede lid:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: 60.3.a
    text: schriftelijk is geïnformeerd en hij bezwaar heeft gemaakt tegen elektronische verstrekking; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: 60.3.b
    text: elektronisch om instemming is gevraagd en hij niet heeft ingestemd met elektronische verstrekking.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: '60.4'
    text: |-
      Indien de pensioenuitvoerder de deelnemer of de gewezen deelnemer elektronisch informatie verstrekt,
      is hij verplicht de elektronisch verstrekte informatie te bewaren tot één jaar na het overlijden van de
      pensioengerechtigde dan wel tot één jaar na het aflopen van de uitkering aan de nabestaanden. De deelnemer of de
      gewezen deelnemer kan ten hoogste eenmaal per jaar de elektronisch verstrekte informatie opvragen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: '60.5'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer, gewezen deelnemer, gewezen partner of pensioengerechtigde aan wie de
      informatie elektronisch wordt verstrekt, op verzoek een papieren afschrift van de informatie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: '60.6'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel60
  - number: '61.1'
    text: |-
      De pensioenuitvoerder kan zich voor het schriftelijk verstrekken van de informatie, bedoeld in de
      [artikelen 49 tot en met 55][ref1], houden aan het laatst hem bekende adres van de deelnemer, gewezen deelnemer,
      pensioengerechtigde of gewezen partner.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel27
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '27'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '61.2'
    text: |-
      Indien dit adres onjuist blijkt te zijn, raadpleegt de pensioenuitvoerder de basisregistratie personen over het
      adres van de deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel61
  - number: '61.3'
    text: |-
      Indien de pensioenuitvoerder kosten maakt in verband met werkzaamheden die voortvloeien uit het feit dat de
      deelnemer, gewezen deelnemer, pensioengerechtigde of gewezen partner verzuimd heeft de pensioenuitvoerder omtrent
      een wijziging van adres te informeren, kan de pensioenuitvoerder deze kosten bij deze in rekening brengen, maar
      kunnen deze kosten niet direct in mindering worden gebracht op de uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel61
  - number: '61.4'
    text: |-
      Indien het bij de pensioenuitvoerder bekende adres voor de elektronische verstrekking van informatie onjuist
      blijkt, verstrekt de pensioenuitvoerder de informatie schriftelijk.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel61
  - number: '62.1'
    text: |-
      Er is een pensioenregister, ingericht en in stand gehouden door de pensioenuitvoerders, dat tot doel heeft op
      duidelijke en begrijpelijke wijze de aanspraakgerechtigde of de pensioengerechtigde in de gelegenheid te stellen
      gegevens over zijn pensioenaanspraken en pensioenrechten te raadplegen, waarbij deze gegevens, voor zover het
      ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch scenario, een verwacht
      scenario en een optimistisch scenario. Het pensioenregister heeft verder tot doel inzicht te geven in de hoogte
      van het te bereiken pensioen, de keuzes ten aanzien van het pensioen, waaronder de mogelijkheid tot omzetting
      in een variabele uitkering, en de gevolgen van deze keuzes en van belangrijke gebeurtenissen op het pensioen
      van de aanspraakgerechtigde of de pensioengerechtigde. Onder pensioenaanspraken en pensioenrechten in de zin van
      dit artikel worden tevens verstaan aanspraken op ouderdomspensioen en recht op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0002221
  - number: '62.2'
    text: |-
      Het pensioenregister heeft mede tot doel op verzoek de pensioenuitvoerder te informeren bij welke andere
      pensioenuitvoerder een gewezen deelnemer pensioenaanspraken opbouwt ten behoeve van de toepassing van
      [artikel 81a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 81a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '62.3'
    text: |-
      De pensioenuitvoerder verstrekt op verzoek van de aanspraakgerechtigde of de pensioengerechtigde tijdig zijn
      gegevens met betrekking tot pensioenaanspraken en pensioenrechten door middel van het pensioenregister.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
  - number: '62.4'
    text: |-
      De Sociale verzekeringsbank, genoemd in
      [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], verstrekt op verzoek
      van de aanspraakgerechtigde of de pensioengerechtigde tijdig zijn gegevens over verzekeringstijdvakken
      en daarop gebaseerde aanspraak op ouderdomspensioen en recht op ouderdomspensioen op grond van de
      [Algemene Ouderdomswet][ref2] door middel van het pensioenregister.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0002221
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0002221
  - number: '62.5'
    text: |-
      De gegevens die op grond van het derde en vierde lid worden verstrekt door middel van het pensioenregister worden
      in dat kader uitsluitend gebruikt voor het in het eerste en tweede lid omschreven doel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
  - number: '62.6'
    text: |-
      Een door Onze Minister aan te wijzen instelling ontwikkelt en beheert het pensioenregister en draagt zorg voor
      de tijdige verwerking van de gegevens, bedoeld in het derde en vierde lid, en het goed functioneren van het
      pensioenregister.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
  - number: '62.7'
    text: |-
      De instelling, bedoeld in het zesde lid, is verwerker in de zin van de Algemene verordening gegevensbescherming
      voor het verwerken van de gegevens die door de pensioenuitvoerders en de Sociale verzekeringsbank, genoemd
      in [hoofdstuk 6 van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref1], door middel van het
      pensioenregister worden verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0013060#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0013060
        hoofdstuk: '6'
  - number: '62.8'
    text: |-
      De instelling, bedoeld in het zesde lid, stelt in verband met haar rol als verwerker als bedoeld in het zevende
      lid een reglement vast waarin regels worden gesteld met betrekking tot het ontwikkelen en beheren van het
      pensioenregister. Dit reglement bevat in ieder geval regels over de gegevens die verstrekt worden, de wijze waarop
      deze gegevens verstrekt worden en de bekostiging en beveiliging van het pensioenregister.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
  - number: '62.9'
    text: Het reglement alsmede elke wijziging daarvan behoeft de goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
  - number: '62.10'
    text: |-
      Hetgeen bij of krachtens [hoofdstuk 6][ref1] van toepassing is bij het toezicht op de uitvoering van dit artikel
      door pensioenuitvoerders is van overeenkomstige toepassing op de uitvoering van dit artikel door de instelling,
      bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018831
        hoofdstuk: '6'
  - number: '62.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de scenario’s, de actualisatie van de te verstrekken gegevens, het opnemen van gegevens met betrekking
      tot de keuzes ten aanzien van het pensioen en de gevolgen van deze keuzes en van belangrijke gebeurtenissen op het
      pensioen en de fasering van het opnemen van deze gegevens.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel62
  - number: '63.1'
    text: |-
      Bij de uitvoering van een premieregeling met beleggingsvrijheid in de opbouwfase is de pensioenuitvoerder
      verantwoordelijk voor de beleggingen en handelt daarbij overeenkomstig [artikel 130][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel130
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '130'
        hoofdstuk: '5'
  - number: '63.2'
    text: |-
      De pensioenuitvoerder biedt de deelnemer en de gewezen deelnemer de mogelijkheid de verantwoordelijkheid voor de
      beleggingen over te nemen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63
  - number: '63.3'
    text: |-
      Indien de deelnemer of de gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft overgenomen,
      adviseert de pensioenuitvoerder de deelnemer of de gewezen deelnemer over de spreiding van de beleggingen in
      relatie tot de duur van de periode tot pensioendatum, waarbij het beleggingsrisico kleiner wordt naarmate de
      pensioendatum nadert.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63
  - number: '63.4'
    text: |-
      De pensioenuitvoerder onderzoekt ten minste een keer per jaar of de beleggingen van de deelnemer of gewezen
      deelnemer zich binnen de op basis van het derde lid gestelde grenzen bevinden en informeert de deelnemer en de
      gewezen deelnemer hierover.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63
  - number: '63.5'
    text: |-
      Bij de uitvoering, bedoeld in het eerste lid, handelt de pensioenuitvoerder in het belang van de deelnemer of
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63
  - number: '63.6'
    text: |-
      Ten behoeve van het advies, bedoeld in het derde lid, wint de pensioenuitvoerder informatie in over de financiële
      positie, kennis, ervaring, doelstellingen en risicobereidheid van de deelnemer of gewezen deelnemer, voor zover
      dit redelijkerwijs relevant is voor het advies. Het advies wordt, voor zover redelijkerwijs mogelijk, mede op deze
      informatie gebaseerd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63
  - number: '63.7'
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels gesteld worden met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63
  - number: 63a.1
    text: |-
      Bij de uitvoering van een premieregeling zonder beleggingsvrijheid in de opbouwfase of een variabele
      uitkering voortvloeiend uit een premieregeling of kapitaalregeling is de pensioenuitvoerder verantwoordelijk
      voor de beleggingen en voert een beleggingsbeleid overeenkomstig [artikel 130][ref1]. Bij de uitvoering
      van dit beleggingsbeleid wordt rekening gehouden met de leeftijd van de deelnemers, gewezen deelnemers of
      pensioengerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel130
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '130'
        hoofdstuk: '5'
  - number: 63a.2
    text: |-
      Bij de uitvoering, bedoeld in het eerste lid, handelt de pensioenuitvoerder in het belang van de deelnemer, gewezen
      deelnemer of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63a
  - number: 63a.3
    text: |-
      Indien de pensioenuitvoerder bij uitvoering van een variabele uitkering verschillende beleggingsprofielen hanteert,
      wordt voor de pensioengerechtigde een beleggingsprofiel toegepast dat passend is gezien zijn risicoprofiel. De
      pensioenuitvoerder informeert de pensioengerechtigde over het vastgestelde risicoprofiel en het beleggingsprofiel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63a
  - number: 63a.4
    text: |-
      De pensioenuitvoerder toetst periodiek het risicoprofiel van de pensioengerechtigde. Indien een wijziging in het
      risicoprofiel daartoe aanleiding geeft past de pensioenuitvoerder een ander, passend, beleggingsprofiel toe en
      informeert de pensioengerechtigde hierover.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63a
  - number: 63a.5
    text: |-
      Ten behoeve van het risicoprofiel, bedoeld in het derde en vierde lid, wint de pensioenuitvoerder informatie in
      over de financiële positie, kennis, ervaring, doelstellingen en risicobereidheid van de pensioengerechtigde, voor
      zover dit redelijkerwijs relevant is voor het beleggingsprofiel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63a
  - number: 63a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de uitvoering van het beleggingsbeleid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel63a
  - number: '64'
    text: |-
      De pensioenuitvoerder betaalt de uitkering uit hoofde van een pensioenrecht op verzoek van de pensioengerechtigde
      in een andere lidstaat van de Europese Unie dan de lidstaat waar die pensioenuitvoerder is gevestigd, waarbij
      transactiekosten op de uitkering uit hoofde van het pensioenrecht in mindering kunnen worden gebracht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel64
  - number: '65.1'
    text: |-
      Een pensioenuitvoerder kan voor de deelnemer die gewezen beroepsgenoot wordt een vrijwillige voortzetting van
      de beroepspensioenregeling uitvoeren indien de vrijwillige voortzetting gedurende ten hoogste drie jaar vanaf de
      beëindiging van het beroep voortduurt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel65
  - number: '65.2'
    text: |-
      In afwijking van het eerste lid geldt een termijn van tien jaar voor zover de genoemde gewezen beroepsgenoot,
      aansluitend aan de beëindiging van het beroep, gedurende die periode winst uit onderneming geniet als bedoeld in
      [artikel 3.8 van de Wet inkomstenbelasting 2001][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '65.3'
    text: |-
      Van de in het eerste lid genoemde termijn kan worden afgeweken indien het beëindigen van het beroep van die
      deelnemer wordt veroorzaakt door arbeidsongeschiktheid. De periode waarin sprake kan zijn van vrijwillige
      voortzetting is dan ten hoogste drie jaar of de duur van de arbeidsongeschiktheid indien deze langer is.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel65
  - number: '65.4'
    text: |-
      De deelnemer die vrijwillig wil voortzetten doet binnen negen maanden vanaf de beëindiging van het beroep een
      verzoek daartoe bij de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel65
  - number: '65.5'
    text: |-
      De vrijwillige voortzetting begint uiterlijk vijftien maanden na beëindiging van het beroep.
      [Artikel 22, derde lid][ref1], is niet van toepassing op de periode vanaf de beëindiging van het beroep tot het
      begin van de vrijwillige voortzetting.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '22'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '66.1'
    text: |-
      Bij beëindiging van de deelneming behoudt de gewezen deelnemer de tot dat moment opgebouwde pensioenaanspraken
      indien er sprake is van een uitkeringsregeling of een kapitaalregeling. Deze pensioenaanspraak dient
      volledig gefinancierd te zijn op het moment van beëindiging. In geval van premievrijmaking op grond van
      [artikel 39, vierde lid][ref1], wordt daarmee bij de vaststelling van de opgebouwde aanspraken rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel39
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: '66.2'
    text: |-
      Bij een premieregeling wordt bij beëindiging van de deelneming de vaststelling van de pensioenaanspraken als volgt
      uitgevoerd: het tot op dat moment ontstane kapitaal voortvloeiend uit de tot de beëindiging beschikbaar gestelde
      premies wordt:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
  - number: 66.2.a
    text: belegd tot de pensioendatum;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
  - number: 66.2.b
    text: aangewend voor de aankoop van een verzekerd kapitaal dat beschikbaar komt op de pensioendatum; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
  - number: 66.2.c
    text: |-
      aangewend voor een verzekerde vastgestelde uitkering vanaf de pensioendatum, al dan niet in combinatie met een
      aanspraak op nabestaandenpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
  - number: '66.3'
    text: |-
      Indien de opzet van de premieregeling zodanig is dat de beschikbaar gestelde premie direct, en niet pas bij de
      beëindiging van de deelneming, wordt aangewend voor een uitkering of kapitaal, dan geldt het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
  - number: '66.4'
    text: |-
      Deelnemers en andere aanspraakgerechtigden die na beëindiging van de deelneming aan een beroepspensioenregeling
      naar een andere lidstaat van de Europese Unie verhuizen behouden hun pensioenaanspraak in dezelfde mate als
      deelnemers en andere aanspraakgerechtigden die na beëindiging van de deelneming in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
  - number: '66.5'
    text: |-
      Indien de pensioenregeling voorziet in een partnerpensioen op risicobasis behoudt de deelnemer, die na beëindiging
      van de deelneming recht heeft op een uitkering op grond van de [Werkloosheidswet][ref1] gedurende de periode
      dat hij de uitkering ontvangt, aanspraak op partnerpensioen ten behoeve van zijn partner. De hoogte van het
      partnerpensioen wordt vastgesteld alsof hetzelfde pensioen op opbouwbasis zou zijn overeengekomen, waarbij rekening
      wordt gehouden met het partnerpensioen verkregen op grond van [artikel 73][ref2]. Dit lid is van overeenkomstige
      toepassing op de deelnemer, die na beëindiging van de deelneming recht heeft op werkloosheidsuitkering van zijn
      woonland.


      [ref1]: https://wetten.overheid.nl/BWBR0004045
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel73
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0004045
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '73'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '66.6'
    text: |-
      In afwijking van het eerste en tweede lid en [artikel 129][ref1] vervallen de pensioenaanspraken van een deelnemer
      bij beëindiging van de deelneming, indien op basis van de tot het tijdstip van beëindiging opgebouwde aanspraak
      op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum niet meer
      zal bedragen dan € 2,– per jaar. De eerste zin is niet van toepassing indien de deelnemer verhuist naar een andere
      lidstaat en hij de pensioenuitvoerder daarover bij beëindiging van de deelneming heeft geïnformeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: '67'
    text: |-
      Indien de pensioenregeling voorziet in een partnerpensioen is het opnemen van onbetaald verlof tot een maximum
      van 18 maanden door de deelnemer tijdens de deelneming niet van invloed op de dekking uit hoofde van het
      partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel67
  - number: '68.1'
    text: |-
      Indien de partnerrelatie van een deelnemer eindigt door scheiding verkrijgt de gewezen partner van de deelnemer
      een zodanige aanspraak op partnerpensioen als de deelnemer ten behoeve van die gewezen partner zou hebben behouden
      indien op het tijdstip van scheiding zijn deelneming zou zijn geëindigd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: '68.2'
    text: |-
      Indien de partnerrelatie van een gewezen deelnemer eindigt door scheiding, en de gewezen deelnemer ten behoeve van
      die partner een aanspraak op partnerpensioen heeft behouden bij beëindigen van de deelneming, gaat de aanspraak
      over op de gewezen partner van de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: '68.3'
    text: |-
      Indien de partnerrelatie van een gepensioneerde eindigt door scheiding, en de gepensioneerde ten behoeve van
      die partner een aanspraak op partnerpensioen heeft behouden bij het ingaan van het ouderdomspensioen, gaat die
      aanspraak over op de gewezen partner van de gepensioneerde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: '68.4'
    text: |-
      Het eerste, tweede en derde lid, vindt geen toepassing indien de partners bij voorwaarden in verband met de
      partnerrelatie of een schriftelijk gesloten overeenkomst met betrekking tot de scheiding anders overeenkomen. Deze
      voorwaarden of overeenkomst zijn respectievelijk is slechts geldig indien de pensioenuitvoerder zich bereid heeft
      verklaard hiermee in te stemmen en bereid is een uit de afwijking voortvloeiend risico te dekken dan wel het niveau
      van de uitkering aan te passen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: '68.5'
    text: |-
      Een gewezen partner met een recht op bijzonder partnerpensioen als bedoeld in het eerste, tweede of derde lid,
      heeft het recht dit te vervreemden aan een eerdere of latere partner van de overleden deelnemer, gewezen deelnemer
      of gepensioneerde, mits:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: 68.5.a
    text: de pensioenuitvoerder bereid is een eventueel uit die overdracht voortvloeiende wijziging van het risico te dekken;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: 68.5.b
    text: de vervreemding onherroepelijk is; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: 68.5.c
    text: dit wordt overeengekomen bij notarieel verleden akte.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: '68.6'
    text: |-
      Indien na toepassing van het eerste of tweede lid de gewezen partner overlijdt voordat de deelnemer of gewezen
      deelnemer overlijdt, maakt de aanspraak op het partnerpensioen vanaf het moment van overlijden van de gewezen
      partner weer deel uit van de pensioenaanspraken van de deelnemer of gewezen deelnemer, bedoeld in het eerste en
      tweede lid, voor zover dit in de betrokken beroepspensioenregeling is bepaald.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel68
  - number: '69.1'
    text: |-
      Indien een ouderdomspensioenrecht van een gepensioneerde die geen gewezen deelnemer is geweest wordt verhoogd
      door middel van een toeslag, wordt het ouderdomspensioenrecht van een gepensioneerde die wel gewezen deelnemer is
      geweest in dezelfde mate verhoogd indien zij in dezelfde beroepspensioenregeling hebben deelgenomen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: '69.2'
    text: |-
      Indien een recht op partnerpensioen van de partner van een overleden gepensioneerde die geen gewezen deelnemer is
      geweest wordt verhoogd door middel van een toeslag, worden de partnerpensioenrechten:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: 69.2.a
    text: ten behoeve van de partners van overleden gepensioneerden die gewezen deelnemer zijn geweest;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: 69.2.b
    text: ten behoeve van de partners van overleden gewezen deelnemers;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: 69.2.c
    text: ten behoeve van de partners van overleden deelnemers; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: 69.2.d
    text: van de gewezen partners met een bijzonder partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: '69.3'
    text: |-
      Indien een ouderdomspensioenrecht wordt verhoogd door middel van een toeslag, wordt de aanspraak op
      ouderdomspensioen van een gewezen deelnemer die in dezelfde beroepspensioenregeling heeft deelgenomen in dezelfde
      mate verhoogd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: '69.4'
    text: |-
      Indien een aanspraak op partnerpensioen van een gepensioneerde die geen gewezen deelnemer is geweest wordt verhoogd
      door middel van een toeslag, worden de partnerpensioenaanspraken:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: 69.4.a
    text: ten behoeve van de partner van een gepensioneerde die wel gewezen deelnemer is geweest;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: 69.4.b
    text: ten behoeve van de partner van een gewezen deelnemer; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: 69.4.c
    text: van de gewezen partner van de gewezen deelnemer met een bijzonder partnerpensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: '69.5'
    text: Bij de verlening van toeslagen op partnerpensioen wordt geen onderscheid gemaakt tussen partners.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel69
  - number: '70'
    text: |-
      Een rechtsvordering tegen een pensioenuitvoerder tot het doen van een uitkering verjaart niet bij leven van de
      pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel70
  - number: '71'
    text: |-
      Op een pensioenaanspraak die of een pensioenrecht dat een tot verevening gerechtigde echtgenoot of
      geregistreerde partner op grond van [artikel 5 van de Wet verevening pensioenrechten bij scheiding][ref1]
      verwerft, zijn de [artikelen 69][ref2] en [73][ref3] niet van overeenkomstige toepassing en zijn de
      [artikelen 82 tot en met 85][ref4], [87][ref5], [88][ref6] en [93 tot en met 97][ref7] van overeenkomstige
      toepassing indien de beroepspensioenregeling daarin voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel69
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel87
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel88
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel93
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '69'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '73'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '87'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref7
        bwb_id: BWBR0018831
        artikel: '93'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '72.1'
    text: |-
      Indien een beroepspensioenregeling voorziet in de opbouw van een ouderdomspensioen en een partnerpensioen,
      biedt de beroepspensioenregeling aan de deelnemer of gewezen deelnemer met betrekking tot perioden van opbouw
      vanaf 1 januari 2006, ongeacht zijn burgerlijke staat, het recht in elk geval met ingang van de datum waarop
      het ouderdomspensioen ingaat of kan ingaan, in plaats van partnerpensioen te kiezen voor één van de volgende
      wijzigingen van het ouderdomspensioen:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: 72.1.a
    text: een hoger ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: 72.1.b
    text: een eerder ingaand ouderdomspensioen; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: 72.1.c
    text: een hoger en een eerder ingaand ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.2'
    text: Het eerste lid is niet van toepassing op de aanspraak op bijzonder partnerpensioen van de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.3'
    text: |-
      Indien er in de beroepspensioenregeling geen recht op de keuzemogelijkheid als bedoeld in het eerste lid is
      opgenomen heeft de deelnemer of gewezen deelnemer het recht om te kiezen voor één van deze mogelijkheden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.4'
    text: |-
      De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.5'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan het
      vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het ouderdomspensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het partnerpensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.6'
    text: |-
      Bij de keuze, bedoeld in het eerste of derde lid, is de toestemming vereist van de partner die begunstigde is voor
      het in het eerste lid bedoelde partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.7'
    text: Het vierde en vijfde lid zijn van toepassing op pensioenaanspraken die vanaf 1 januari 2007 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.8'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.9'
    text: |-
      In afwijking van het zevende lid kunnen het vierde en vijfde lid van toepassing zijn op pensioenaanspraken die zijn
      opgebouwd voor 1 januari 2007 indien dit is overeengekomen in de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.10'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '72.11'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste tot en met het
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel72
  - number: '73.1'
    text: |-
      Indien een beroepspensioenregeling voorziet in een ouderdomspensioen, heeft de deelnemer of gewezen deelnemer het
      recht, in plaats van ouderdomspensioen of een deel van het ouderdomspensioen, te kiezen voor partnerpensioen in
      elk geval:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: 73.1.a
    text: bij beëindiging van de deelneming; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: 73.1.b
    text: met ingang van de datum waarop het ouderdomspensioen ingaat of kan ingaan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '73.2'
    text: |-
      Indien een beroepspensioenregeling voorziet in een ouderdomspensioen, biedt de pensioenuitvoerder de deelnemer
      bij beëindiging van de deelneming en in het laatste jaar voor ingang van het ouderdomspensioen standaard de
      mogelijkheid, genoemd in het eerste lid, aan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '73.3'
    text: |-
      De pensioenuitvoerder waarborgt dat bij gebruikmaking van het keuzerecht geen onderscheid gemaakt wordt tussen
      mannen en vrouwen door vaststelling van een ruilvoet of opbouwkeuzevoet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '73.4'
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van een ruilvoet of opbouwkeuzevoet dat voldaan wordt aan het
      vereiste van collectieve actuariële gelijkwaardigheid hetgeen inhoudt dat de collectieve actuariële waarde van
      het partnerpensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats van het ouderdomspensioen, bedoeld in
      het eerste lid, ongeacht de datum waarop de keuze wordt gemaakt, ten minste gelijkwaardig is aan de op dezelfde
      grondslagen berekende collectieve actuariële waarde van dat ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '73.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de inhoud van
      de keuzemogelijkheid, de wijze waarop de keuzemogelijkheid wordt geboden en de collectieve actuariële
      gelijkwaardigheid, bedoeld in het vierde lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '73.6'
    text: |-
      De in het eerste lid omschreven mogelijkheid heeft geen betrekking op het deel van een ouderdomspensioen waarop een
      recht op uitbetaling rust als bedoeld in [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: '73.7'
    text: |-
      Indien de deelnemer of gewezen deelnemer niet binnen de door de pensioenuitvoerder gestelde termijn reageert op de
      keuzemogelijkheid die hem ingevolge het tweede lid in het laatste jaar voor de ingang van het ouderdomspensioen is
      aangeboden, gaat de pensioenuitvoerder over tot het uitruilen van het ouderdomspensioen in partnerpensioen indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: 73.7.a
    text: |-
      de beroepspensioenregeling niet voorziet in een aanspraak op partnerpensioen vanaf de datum waarop het
      ouderdomspensioen ingaat; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: 73.7.b
    text: de deelnemer of gewezen deelnemer gehuwd is of een geregistreerde partnerrelatie heeft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '73.8'
    text: |-
      In de beroepspensioenregeling wordt bepaald wat de verhouding is tussen ouderdomspensioen en partnerpensioen na
      uitruil als bedoeld in het zevende lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '73.9'
    text: |-
      Indien de uitruil, bedoeld in het zevende lid, ertoe zou leiden dat het ouderdomspensioen op jaarbasis lager wordt
      dan het op grond van [artikel 78][ref1] bepaalde bedrag wordt de in het achtste lid bedoelde verhouding tussen
      ouderdomspensioen en partnerpensioen zodanig aangepast dat het ouderdomspensioen op jaarbasis meer bedraagt dan het
      op grond van artikel 78 bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '73.10'
    text: |-
      Indien een beroepspensioenregeling voorziet in een partnerpensioen op risicobasis kan in de beroepspensioenregeling
      worden bepaald dat het zevende lid, aanhef en onderdeel b, van overeenkomstige toepassing is bij beëindiging van de
      deelneming. Het achtste en negende lid is van toepassing.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel73
  - number: '74.1'
    text: 'Indien de beroepspensioenregeling de deelnemer of gewezen deelnemer de mogelijkheid biedt:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: 74.1.a
    text: |-
      in plaats van een bepaald soort pensioen geheel of gedeeltelijk te kiezen voor een ander soort pensioen, dan het
      pensioen, bedoeld in de [artikelen 72][ref1] en [73][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel73
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '72'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '73'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 74.1.b
    text: de ingangsdatum van het ouderdomspensioen te vervroegen of uit te stellen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: 74.1.c
    text: |-
      de hoogte van het ouderdomspensioen te laten variëren als bedoeld in [artikel 75][ref1]; of


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel75
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '75'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 74.1.d
    text: tot een keuze anders dan bedoeld in de voorgaande onderdelen,
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: '74.2'
    text: |-
      Bij gebruikmaking van een in het eerste lid bedoelde keuzemogelijkheid is de toestemming vereist van de partner
      die begunstigde is voor partnerpensioen indien de hoogte daarvan door gebruikmaking van de keuzemogelijkheid wordt
      verlaagd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: '74.3'
    text: Het eerste lid is van toepassing op pensioenaanspraken die vanaf 1 januari 2007 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: '74.4'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid van toepassing indien het recht op die
      premievrije voortzetting is ontstaan op of na 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: '74.5'
    text: |-
      In afwijking van het derde lid kan het eerste lid van toepassing zijn op pensioenaanspraken die zijn opgebouwd voor
      1 januari 2007 indien dit is overeengekomen in de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: '74.6'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel74
  - number: '75.1'
    text: 'De hoogte van een pensioen kan na ingang variëren mits:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75
  - number: 75.1.a
    text: de laagste uitkering niet minder bedraagt dan 75% van de hoogste uitkering; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75
  - number: 75.1.b
    text: de mate van variatie uiterlijk op de ingangsdatum van het pensioen wordt vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75
  - number: '75.2'
    text: |-
      Voor de toepassing van het eerste lid blijft in de periode tussen de ingangsdatum van het pensioen en het bereiken
      van de pensioengerechtigde leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1],
      van de uitkering buiten aanmerking het gedeelte dat overeenkomt met het bedrag bedoeld in
      [artikel 18d, derde lid, van de Wet op de loonbelasting 1964][ref2]. Ingeval de pensioengerechtigde leeftijd,
      bedoeld in artikel 7a, eerste lid, van de Algemene Ouderdomswet, na de ingangsdatum van het pensioen wordt
      verlaagd, wordt voor de toepassing van de eerste zin uitgegaan van de pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet, die van toepassing was voor deze verlaging.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel18d
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 18d
  - number: '75.3'
    text: |-
      In afwijking in zoverre van het eerste lid, onderdeel b, wordt bij een aanpassing van de pensioengerechtigde
      leeftijd, bedoeld in [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], na de ingang van het pensioen,
      de mate van variatie uiterlijk vastgesteld bij het bereiken van de hoogste pensioengerechtigde leeftijd, bedoeld in
      artikel 7a, eerste lid, van de Algemene Ouderdomswet, die op enig moment na de ingangsdatum van het pensioen geldt
      of heeft gegolden voor de pensioengerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '75.4'
    text: |-
      Voor de toepassing van het eerste lid wordt bij variabele uitkeringen de mate van variatie vastgesteld uitgaande
      van de rendementsverwachtingen op de ingangsdatum van het pensioen. Bij variabele uitkeringen blijven aanpassingen
      buiten aanmerking voor zover deze het gevolg zijn van de omstandigheid dat de opgetreden ontwikkeling van
      de levensverwachting, de behaalde sterfteresultaten of de behaalde beleggingsresultaten tot hogere of lagere
      uitkeringen leiden dan op de ingangsdatum van het pensioen het uitgangspunt was.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75
  - number: '75.5'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75
  - number: 75a.1
    text: |-
      Onverminderd [artikel 75][ref1] kan de hoogte van een variabele uitkering na de ingangsdatum van het pensioen
      variëren door de verwerking van financiële mee- of tegenvallers als gevolg van het beleggingsrisico, de
      ontwikkeling van het sterfteresultaat of de ontwikkeling van de levensverwachting.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel75
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '75'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 75a.2
    text: |-
      De verwerking van financiële mee- of tegenvallers die het gevolg zijn van het beleggingsrisico of van de
      ontwikkeling van de levensverwachting gebeurt door middel van individuele toedeling of door middel van een
      collectief toedelingsmechanisme. De verwerking van financiële mee- of tegenvallers die het gevolg zijn van het
      sterfteresultaat gebeurt door middel van een collectief toedelingsmechanisme.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.3
    text: |-
      De hoogte van een variabele uitkering kan ook variëren door een, uiterlijk op de ingangsdatum van het pensioen
      vastgestelde, periodieke vaste daling of vaste stijging van de uitkering. De periodieke vaste daling bedraagt ten
      hoogste 35% van het verschil tussen de parameter voor aandelenrendement en de risicovrije rente.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.4
    text: |-
      De pensioenuitvoerder past een collectief toedelingsmechanisme toe op een toedelingskring die bestaat uit
      pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.5
    text: |-
      In afwijking van het vierde lid kunnen deelnemers of gewezen deelnemers deel uitmaken van de
      toedelingskring in de laatste tien jaar voorafgaand aan de pensioenrichtleeftijd, bedoeld in
      [artikel 18a, zesde lid, van de Wet op de loonbelasting 1964][ref1]. De deelname van deelnemers of
      gewezen deelnemers aan de toedelingskring vindt plaats door tijdsevenredige toetreding tot het collectief
      toedelingsmechanisme in deze periode.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
  - number: 75a.6
    text: |-
      Bij toepassing van een collectief toedelingsmechanisme wordt ten minste een maal per jaar op het niveau van de
      toedelingskring het financiële resultaat vastgesteld en verwerkt. Bij een collectief toedelingsmechanisme kan een
      spreidingsperiode worden gehanteerd van maximaal tien jaar. Gedurende de spreidingsperiode worden uitsluitend de
      uitkeringen en aanspraken van de bij aanvang van de spreidingsperiode tot de toedelingskring behorende personen in
      gelijke stappen aangepast. Bij de vaststelling van de hoogte van de jaarlijkse aanpassing wordt rekening gehouden
      met de verwachte resterende levensverwachting van de toedelingskring.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.7
    text: |-
      Bij toepassing van een collectief toedelingsmechanisme voor het beleggingsrisico wordt de projectierente gebaseerd
      op de risicovrije rente. De vormgeving van het collectief toedelingsmechanisme voor het beleggingsrisico en
      de hoogte van een periodieke vaste daling als bedoeld in het derde lid zijn zodanig dat er op voorhand geen
      herverdelingseffecten tussen leeftijdsgroepen plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.8
    text: |-
      Bij verwerking van financiële mee- of tegenvallers door middel van individuele toedeling wordt de projectierente
      gebaseerd op de risicovrije rente. Bij individuele toedeling wordt ten minste een maal per jaar het financiële
      resultaat vastgesteld en verwerkt, waarbij een spreidingsperiode van maximaal tien jaar kan worden gehanteerd. Bij
      de vaststelling van de omvang van de periodieke aanpassing van de uitkeringshoogte gedurende de spreidingsperiode
      wordt rekening gehouden met de verwachte resterende levensverwachting van de pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.9
    text: 'Bij of krachtens algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.9.a
    text: kunnen regels worden gesteld voor de uitkering gebaseerd op pensioeneenheden; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75a.9.b
    text: |-
      worden nadere regels gesteld over dit artikel over onder meer het collectief toedelingsmechanisme en de
      projectierente
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75a
  - number: 75b.1
    text: |-
      Bij een kapitaalregeling of een premieregeling die voorziet in uitkering van een aan te wenden kapitaal op de
      pensioendatum, legt de pensioenuitvoerder de deelnemer of gewezen deelnemer in elk geval voorafgaand aan de datum
      waarop het ouderdomspensioen ingaat of kan ingaan de keuze voor tussen een vastgestelde uitkering of een variabele
      uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75b
  - number: 75b.2
    text: |-
      Bij het bieden van de keuze verstrekt de pensioenuitvoerder de deelnemer of gewezen deelnemer de voor hem relevante
      informatie over de gevolgen en risico’s bij deze keuze waaronder een opgave van de hoogte van de vastgestelde
      uitkeringen en een opgave van de hoogte van de variabele uitkeringen. Deze opgaven worden tevens weergegeven op
      basis van een pessimistisch scenario, een verwacht scenario en een optimistisch scenario.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75b
  - number: 75b.3
    text: |-
      Een pensioenuitvoerder die niet zowel vastgestelde als variabele uitkeringen uitvoert meldt dit aan de deelnemer
      of gewezen deelnemer. De pensioenuitvoerder verstrekt de in het tweede lid bedoelde informatie voor de uitkering
      die hij uitvoert en wijst de deelnemer of gewezen deelnemer op de mogelijkheden tot waardeoverdracht, bedoeld in de
      [artikelen 88][ref1], [89][ref2], en [89a, tweede lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel89a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75b
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '89'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: 89a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 75b.4
    text: |-
      Indien de deelnemer of gewezen deelnemer niet binnen de door de pensioenuitvoerder gestelde termijn reageert op
      de keuzemogelijkheid die hem ingevolge het eerste lid is geboden, gaat de pensioenuitvoerder die vastgestelde
      uitkeringen uitvoert op de ingangsdatum van het pensioen over tot verstrekking van een vastgestelde uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75b
  - number: 75b.5
    text: |-
      Een beroepspensioenfonds dat uitsluitend variabele uitkeringen uitvoert waarbij deelnemers of gewezen deelnemers
      deel uitmaken van de toedelingskring waarop een collectief toedelingsmechanisme voor het beleggingsrisico wordt
      toegepast, legt de deelnemer of gewezen deelnemer, voorafgaand aan de eerste toetreding tot de toedelingskring,
      de keuze tot toetreding voor. Het tweede tot en met vierde lid zijn bij deze keuze van overeenkomstige
      toepassing, met dien verstande dat de partijen die betrokken zijn bij de vaststelling, wijziging of intrekking
      van de beroepspensioenregeling kunnen overeenkomen dat een deelnemer of gewezen deelnemer toetreedt tot de
      toedelingskring, indien de deelnemer of gewezen deelnemer niet binnen de door het beroepspensioenfonds gestelde
      termijn reageert op de keuzemogelijkheid die hem ingevolge de eerste zin is geboden. Bij het bieden van de keuze
      wijst het beroepspensioenfonds in dit geval expliciet op de consequenties van niet of niet tijdig reageren door de
      deelnemer of gewezen deelnemer. Voor zover de deelnemer of gewezen deelnemer is toegetreden tot de toedelingskring
      zijn het eerste tot en met vierde lid voorafgaand aan de datum waarop het ouderdomspensioen ingaat of kan ingaan
      niet van toepassing.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75b
  - number: 75b.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie, de rekenregels en de wijze waarop de informatie wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75b
  - number: 75c
    text: |-
      De toezichthouder kan een pensioenuitvoerder die een variabele uitkering uitvoert de verplichting opleggen om
      binnen een door de toezichthouder te stellen termijn over te gaan tot verzekering bij een verzekeraar, overdracht
      aan een verzekeraar of onderbrenging bij een beroepspensioenfonds indien dit naar het oordeel van de toezichthouder
      noodzakelijk is in verband met de actuariële en bedrijfstechnische risico’s met betrekking tot deze variabele
      uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel75c
  - number: '76.1'
    text: |-
      Vervreemding of elke andere handeling, waardoor de aanspraakgerechtigde of de pensioengerechtigde enig recht op
      zijn pensioenaanspraken of pensioenrechten aan een ander toekent is nietig, tenzij:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel76
  - number: 76.1.a
    text: |-
      verpanding plaatsvindt voor het verlenen van zekerheid voor het verkrijgen van uitstel van betaling als bedoeld in
      [artikel 25, vijfde lid, van de Invorderingswet 1990][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: 76.1.b
    text: |-
      vervreemding plaatsvindt op grond van [artikel 68, vijfde lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel68
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '68'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 76.1.c
    text: |-
      verevening plaatsvindt op basis van de [Wet verevening pensioenrechten bij scheiding][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: 76.1.d
    text: |-
      in het kader van een verrekening van pensioenrechten bij scheiding in plaats van de aanspraakgerechtigde of de
      pensioengerechtigde diens gewezen partner respectievelijk diens partner wordt aangewezen als begunstigde voor het
      geheel of een deel van het ouderdomspensioen, mits de pensioenuitvoerder hiermee instemt; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel76
  - number: 76.1.e
    text: |-
      in het kader van een verrekening van pensioenrechten bij scheiding de waarde van het geheel of een deel van het
      ouderdomspensioen van de aanspraakgerechtigde of de pensioengerechtigde bij dezelfde pensioenuitvoerder wordt
      aangewend voor een ouderdomspensioen op het leven van diens gewezen partner respectievelijk diens partner, mits de
      pensioenuitvoerder hiermee instemt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel76
  - number: '76.2'
    text: |-
      Een volmacht tot invordering van uitkeringen uit hoofde van een pensioenrecht, onder welke vorm of welke benaming
      ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel76
  - number: '77.1'
    text: |-
      Afkoop is slechts mogelijk in bij of krachtens de [artikelen 78 tot en met 80a][ref1] bedoelde situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '77.2'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel77
  - number: '78.1'
    text: |-
      De pensioenuitvoerder heeft het recht om bij de ingang van het ouderdomspensioen een aanspraak op ouderdomspensioen
      en andere aanspraken ten behoeve van de gepensioneerde of zijn nabestaanden af te kopen, indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: 78.1.a
    text: de uitkering van het ouderdomspensioen op de ingangsdatum minder bedraagt dan € 497,27 per jaar; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: 78.1.b
    text: |-
      de gepensioneerde geen bezwaar maakt tegen de afkoop indien de deelneming is geëindigd voor 1 januari 2007 of de
      gepensioneerde instemt met de afkoop indien de deelneming is geëindigd vanaf 1 januari 2007.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '78.2'
    text: 'De pensioenuitvoerder heeft het recht om pensioenaanspraken van een gewezen deelnemer af te kopen, indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: 78.2.a
    text: |-
      op basis van de tot het tijdstip van beëindiging van de deelneming opgebouwde aanspraak op ouderdomspensioen de
      uitkering van het ouderdomspensioen op jaarbasis op de reguliere ingangsdatum, getoetst per 1 januari van dat jaar,
      minder zal bedragen dan het in het eerste lid, onderdeel a, genoemde bedrag;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: 78.2.b
    text: |-
      de gewezen deelnemer geen bezwaar maakt tegen de afkoop indien de deelneming is geëindigd voor 1 januari 2007 of de
      gewezen deelnemer instemt met de afkoop indien de deelneming is geëindigd vanaf 1 januari 2007; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: 78.2.c
    text: |-
      in geval de deelneming is geëindigd vanaf 1 januari 2018, de pensioenuitvoerder na beëindiging van de deelneming
      ten minste vijf maal tevergeefs heeft gepoogd de overdrachtswaarde van de pensioenaanspraken van een gewezen
      deelnemer over te dragen als bedoeld in [artikel 81a][ref1] en na de beëindiging van de deelneming of, indien
      de deelneming is geëindigd tussen 1 januari 2018 en 1 januari 2019, na 1 januari 2019, ten minste vijf jaar is
      verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 81a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '78.3'
    text: |-
      De pensioenuitvoerder die gebruik wil maken van het in het eerste lid bedoelde recht informeert de gepensioneerde
      over zijn besluit hierover voor de ingang van het pensioen en gaat over tot uitbetaling van de afkoopwaarde binnen
      zes maanden na de ingang van het pensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '78.4'
    text: |-
      De pensioenuitvoerder stelt de afkoopwaarde ter beschikking aan de gepensioneerde dan wel de gewezen deelnemer,
      met uitzondering van de afkoopwaarde van een bijzonder partnerpensioen, die ter beschikking wordt gesteld aan de
      gewezen partner.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '78.5'
    text: |-
      De pensioenuitvoerder betaalt de uitkering op de dag dat de aanspraken of rechten vervallen in verband met de
      afkoop.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '78.6'
    text: |-
      Het in het eerste lid, onderdeel a, genoemde bedrag wordt telkens gewijzigd met ingang van 1 januari op basis
      van de consumentenprijsindex Alle Huishoudens, zoals berekend door het Centraal Bureau voor de Statistiek. De
      wijziging wordt bepaald door de procentuele wijziging die dat indexcijfer over de maand oktober, voorafgaand aan
      de aanpassing, heeft ondergaan ten opzichte van de maand oktober van het daaraan voorafgaande jaar. Het gewijzigde
      bedrag wordt door of namens Onze Minister meegedeeld in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '78.7'
    text: |-
      De pensioenuitvoerder waarborgt met betrekking tot perioden van opbouw vanaf 1 januari 2007 bij de vaststelling van
      de afkoopwaarde door vaststelling van een afkoopvoet dat geen onderscheid gemaakt wordt tussen mannen en vrouwen
      waarbij voldaan wordt aan het vereiste van collectieve actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '78.8'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '78.9'
    text: |-
      Indien de pensioenuitvoerder wil afkopen op of na de reguliere ingangsdatum van het ouderdomspensioen en
      het moment waarop de pensioenuitvoerder wil afkopen ligt voor of op de datum waarop het ouderdomspensioen op
      grond van de [Algemene Ouderdomswet][ref1] ingaat, dan heeft de betrokkene het recht ervoor te kiezen dat het
      ouderdomspensioen waarop de afkoop betrekking heeft, ingaat op de eerste dag van de maand volgend op de datum
      waarop het ouderdomspensioen op grond van de Algemene Ouderdomswet ingaat. De pensioenuitvoerder koopt af op het
      moment dat het ouderdomspensioen waarop de afkoop betrekking heeft ingaat. [Artikel 74, eerste lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002221
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel74
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0002221
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '74'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '78.10'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld over het vaststellen van de
      afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel78
  - number: '79.1'
    text: |-
      De pensioenuitvoerder heeft jegens de nabestaanden het recht om een recht op partnerpensioen of wezenpensioen
      ten behoeve van de nabestaanden van dezelfde deelnemer, gewezen deelnemer of gepensioneerde af te kopen, indien
      de uitkering van het partnerpensioen of wezenpensioen op jaarbasis op de ingangsdatum minder bedraagt dan het
      op basis van [artikel 78][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de beroepspensioenregeling en
      uitvoeringsovereenkomst is beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '79.2'
    text: |-
      De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de nabestaande hierover
      binnen zes maanden na de ingangsdatum en gaat binnen die termijn over tot uitbetaling van de afkoopwaarde aan de
      nabestaande.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel79
  - number: '79.3'
    text: |-
      De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn het partnerpensioen of wezenpensioen afkopen
      indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel79
  - number: 79.3.a
    text: de nabestaande daarmee instemt; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel79
  - number: 79.3.b
    text: |-
      indien de hoogte van het partnerpensioen of wezenpensioen op jaarbasis per 1 januari van dat jaar lager is dan het
      op basis van [artikel 78][ref1] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '79.4'
    text: |-
      [Artikel 78, vijfde, zevende, achtste en tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '80.1'
    text: |-
      De pensioenuitvoerder heeft jegens de gewezen partner het recht om een aanspraak op bijzonder partnerpensioen
      af te kopen indien de uitkering van het partnerpensioen op jaarbasis op de ingangsdatum minder zal bedragen dan
      het op basis van [artikel 78][ref1] bepaalde bedrag, tenzij dit recht op afkoop in de beroepspensioenregeling en
      uitvoeringsovereenkomst is beperkt of uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '80.2'
    text: |-
      De pensioenuitvoerder die gebruik maakt van het in het eerste lid bedoelde recht informeert de gewezen partner
      hierover binnen zes maanden na de melding van de scheiding en gaat binnen die termijn over tot uitbetaling van de
      afkoopwaarde aan de gewezen partner.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80
  - number: '80.3'
    text: 'De pensioenuitvoerder kan na de in het tweede lid bedoelde termijn afkopen indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80
  - number: 80.3.a
    text: de gewezen partner daarmee instemt; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80
  - number: 80.3.b
    text: |-
      indien de hoogte van het partnerpensioen op jaarbasis per 1 januari van dat jaar lager is dan het op basis van
      [artikel 78][ref1] bepaalde bedrag.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '80.4'
    text: |-
      [Artikel 78, vijfde, zevende, achtste en tiende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 80a.1
    text: |-
      Een pensioenuitvoerder is verplicht om op verzoek van de gerechtigde tot een pensioen over te gaan
      tot afkoop van het deel van de pensioenaanspraken dat uitgaat boven de begrenzingen die zijn opgenomen
      in de [hoofdstukken IIB][ref1] en [VIII van de Wet op de loonbelasting 1964][ref2]. De eerste zin
      is niet van toepassing met betrekking tot een nettopensioen, tenzij sprake is van toepassing van
      [artikel 5.17e, vijfde lid, onderdeel a, van de Wet inkomstenbelasting 2001][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: VIII
      - id: ref3
        bwb_id: BWBR0011353
        artikel: '5'
  - number: 80a.2
    text: |-
      Voor de toepassing van dit artikel zijn de [artikelen 3.18, vierde en vijfde lid][ref1], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref2] van overeenkomstige toepassing voor
      zover aan de beroepspensioenregeling wordt deelgenomen door deelnemers die niet worden aangemerkt als werknemer in
      de zin van de [Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80a
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002471
  - number: 80a.3
    text: |-
      De afkoopwaarde wordt door de pensioenuitvoerder aan de deelnemer of gewezen deelnemer ter beschikking gesteld,
      met uitzondering van de afkoopwaarde voor een bijzonder partnerpensioen die ter beschikking wordt gesteld aan de
      gewezen partner.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80a
  - number: 80a.4
    text: |-
      De pensioenuitvoerder waarborgt bij de vaststelling van de afkoopwaarde door vaststelling van een afkoopvoet dat
      geen onderscheid gemaakt wordt tussen mannen en vrouwen waarbij voldaan wordt aan het vereiste van collectieve
      actuariële gelijkwaardigheid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80a
  - number: 80a.5
    text: |-
      Het vierde lid heeft betrekking op pensioenaanspraken die zijn opgebouwd vanaf 1 januari 2015, tenzij in de
      beroepspensioenregeling is overeengekomen dat het vierde lid tevens betrekking heeft op pensioenaanspraken die zijn
      opgebouwd voor die datum.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80a
  - number: 80a.6
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80a
  - number: 80a.7
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen er regels worden gesteld aan het vaststellen van de
      afkoopwaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel80a
  - number: '81.1'
    text: |-
      Voor de toepassing van de [artikelen 81a tot en met 100a][ref1] wordt onder ontvangende pensioenuitvoerder mede
      verstaan een pensioenfonds als bedoeld in [artikel 1 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
  - number: '81.2'
    text: |-
      Bij regeling van Onze Minister kunnen instellingen worden aangewezen jegens wie een pensioenuitvoerder een
      verplichting tot waardeoverdracht heeft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81
  - number: '81.3'
    text: |-
      Waardeoverdracht is slechts mogelijk in de in de [artikelen 81a tot en met 100a][ref1] bedoelde situaties.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '81.4'
    text: |-
      Voor de toepassing van de [artikelen 81a tot en met 100a][ref1] wordt onder een beroepspensioenfonds
      dat optreedt als ontvangende pensioenuitvoerder mede verstaan een pensioenfonds als bedoeld in
      [artikel 1 van de Pensioenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0020809#Artikel1
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0020809
        artikel: '1'
  - number: 81a.1
    text: |-
      De pensioenuitvoerder heeft het recht om na beëindiging van de deelneming de overdrachtswaarde van de
      pensioenaanspraken van een gewezen deelnemer over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.1.a
    text: |-
      op basis van de opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de
      reguliere ingangsdatum minder zal bedragen dan het op basis van [artikel 78][ref1] bepaalde bedrag;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 81a.1.b
    text: |-
      de pensioenuitvoerder bij de toepassing van dit lid niet een lager maximum hanteert dan het in onderdeel a bedoelde
      bedrag;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.1.c
    text: de opgebouwde aanspraak geen nettopensioen betreft; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.1.d
    text: |-
      de waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij de
      ontvangende pensioenuitvoerder van de nieuwe beroepspensioenregeling of de werkgever.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.2
    text: |-
      De ontvangende pensioenuitvoerder is verplicht de overdrachtswaarde aan te wenden ter verwerving van
      pensioenaanspraken voor de deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.3
    text: |-
      De ontvangende pensioenuitvoerder waarborgt dat de actuariële waarde van de door de deelnemer te verwerven
      pensioenaanspraken ten minste gelijk is aan de op dezelfde grondslagen berekende waarde van de over te dragen
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.4
    text: |-
      De overdragende en ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.5
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: 81a.6
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld over dit artikel onder meer over de
      berekening van de overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel81a
  - number: '82.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: 82.1.a
    text: er sprake is van een individuele beëindiging van de deelneming; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: 82.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij de
      ontvangende pensioenuitvoerder van de nieuwe beroepspensioenregeling of de werkgever;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: '82.2'
    text: |-
      De ontvangende pensioenuitvoerder is verplicht om na een verzoek tot waardeoverdracht van een deelnemer de
      overdrachtswaarde aan te wenden ter verwerving van pensioenaanspraken voor die deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: '82.3'
    text: |-
      De plicht van de overdragende pensioenuitvoerder om de waarde rechtstreeks over te dragen en de plicht van
      de ontvangende pensioenuitvoerder om de waarde aan te wenden ontstaat indien de deelnemer na aanvang van de
      verwerving van pensioenaanspraken in de door de ontvangende pensioenuitvoerder uitgevoerde pensioenregeling een
      opgave heeft gevraagd van zijn pensioenaanspraken aan de ontvangende pensioenuitvoerder en daarna het verzoek tot
      waardeoverdracht doet aan de ontvangende pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: '82.4'
    text: |-
      De ontvangende pensioenuitvoerder waarborgt dat de actuariële waarde van de door de deelnemer te verwerven
      pensioenaanspraken ten minste gelijk is aan de op dezelfde grondslagen berekende waarde van de over te dragen
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: '82.5'
    text: |-
      De overdragende en de ontvangende pensioenuitvoerder brengen in het kader van de waardeoverdracht geen kosten in
      rekening bij de gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: '82.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: '82.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van nadere aan de
      waardeoverdracht te stellen voorwaarden en eisen, de berekening van de overdrachtswaarde, de waarde van met de
      overdrachtswaarde te verwerven pensioenaanspraken alsmede de in acht te nemen procedures.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82
  - number: 82a
    text: |-
      De in [artikel 82][ref1] genoemde plicht tot waardeoverdracht geldt niet indien na de waardeoverdracht de
      voor de bedrijfspensioenvoorziening geldende wetgeving van een andere staat dan Nederland op de overgedragen
      pensioenaanspraken van toepassing is en de mogelijkheden tot afkoop van de waarde van de overgedragen
      pensioenaanspraken na de waardeoverdracht ruimer zijn dan op basis van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '83'
    text: |-
      De in [artikel 82][ref1] genoemde plicht tot waardeoverdracht geldt niet zolang:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 83.a
    text: |-
      de overdragende of ontvangende pensioenuitvoerder een beroepspensioenfonds is waarbij gezien de
      beleidsdekkingsgraad de technische voorzieningen niet meer volledig door waarden worden gedekt; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel83
  - number: 83.b
    text: 'de overdragende of ontvangende pensioenuitvoerder een verzekeraar is:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel83
  - number: 83.b.1°
    text: |-
      ten aanzien waarvan een besluit als bedoeld in [artikel 3A:85 van de Wet op het financieel toezicht](onbekend) is
      genomen; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel83
  - number: 83.b.2°
    text: die failliet is.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel83
  - number: 83a.1
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over de tijdelijke inperking van de in
      [artikel 82][ref1] genoemde plicht tot waardeoverdracht in verband met aanvullende bijdragen van de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel83a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 83a.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel83a
  - number: '84'
    text: |-
      De in [artikel 82][ref1] en [99][ref2] genoemde plicht tot waardeoverdracht geldt niet met betrekking tot
      pensioenaanspraken indien de deelneming is geëindigd vóór 1 januari 2006.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel99
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '99'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '85.1'
    text: |-
      Indien de in [artikel 83][ref1] genoemde omstandigheden niet meer van toepassing zijn, herleven de in
      [artikel 82][ref2] bedoelde plichten van de overdragende pensioenuitvoerder en de ontvangende pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '85.2'
    text: |-
      Een overdragende pensioenuitvoerder die in de periode waarin de in [artikel 83][ref1] bedoelde omstandigheden op
      hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert, wanneer deze omstandigheden
      niet meer van toepassing zijn, alle deelnemers die in die periode gewezen deelnemer zijn geworden en de betrokken
      ontvangende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '85.3'
    text: |-
      Een ontvangende pensioenuitvoerder die in de periode waarin de in [artikel 83][ref1] genoemde omstandigheden op
      hem van toepassing zijn verzoeken tot waardeoverdracht heeft gekregen, informeert wanneer deze omstandigheden niet
      meer van toepassing zijn, alle deelnemers die in die periode een verzoek tot waardeoverdracht hebben gedaan en de
      betrokken overdragende pensioenuitvoerders over de mogelijkheid alsnog waarde over te dragen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '86.1'
    text: |-
      Indien in de in [artikel 82][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 86.1.a
    text: |-
      de deelnemer niet voldaan heeft aan een in de algemene maatregel van bestuur op grond van
      [artikel 82, zevende lid][ref1], opgenomen voorwaarde om binnen een termijn een opgave te vragen; of


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 86.1.b
    text: |-
      sprake is van de in [artikel 84][ref1] bedoelde situatie,


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel84
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '84'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '86.2'
    text: |-
      Indien in de in [artikel 82][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat, omdat er geen sprake
      is van een individuele beëindiging, is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 86.2.a
    text: |-
      wordt voldaan aan de in [artikel 82, eerste lid, onderdeel b, tweede en derde zin en vierde lid][ref1], genoemde
      voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 86.2.b
    text: |-
      de overdragende en de ontvangende pensioenuitvoerders aan wie door een groep gewezen deelnemers verzoeken tot
      waardeoverdracht worden gedaan, dit schriftelijk hebben gemeld aan de toezichthouder; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
  - number: 86.2.c
    text: |-
      de toezichthouder binnen drie maanden na de melding geen verbod tot waardeoverdracht heeft opgelegd aan een van
      beide pensioenuitvoerders.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
  - number: '86.3'
    text: |-
      Indien de financiering van de aanspraken van de gewezen deelnemer bij de overdragende pensioenuitvoerder nog niet
      is voltooid overeenkomstig [artikel 66][ref1] kan de pensioenuitvoerder ondanks de lagere waarde en de daaruit bij
      de ontvangende pensioenuitvoerder resulterende lagere pensioenaanspraken de waarde overdragen indien de gewezen
      deelnemer en zijn partner schriftelijk hiermee instemmen en mits sprake is van de in [artikel 84][ref2] bedoelde
      situatie.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel84
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '84'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '86.4'
    text: |-
      Indien in de in [artikel 82][ref1] bedoelde situatie geen plicht tot waardeoverdracht bestaat omdat sprake is van
      de in [artikel 83a][ref2] bedoelde situatie is de pensioenuitvoerder bevoegd tot waardeoverdracht indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel83a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 83a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 86.4.a
    text: |-
      voldaan wordt aan de in [artikel 82, eerste en vierde lid][ref1], genoemde voorwaarden; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 86.4.b
    text: de werkgever bereid is de aanvullende bijdragen te betalen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel86
  - number: '87.1'
    text: |-
      De pensioenuitvoerder is verplicht om op verzoek van de deelnemer of gewezen deelnemer de waarde van diens
      pensioenaanspraken aan te wenden in het kader van het keuzerecht overeenkomstig de [artikelen 72][ref1] en
      [73][ref2] of de keuzemogelijkheden overeenkomstig [artikel 74][ref3] of [75b][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel74
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel75b
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '72'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '73'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '74'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 75b
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '87.2'
    text: |-
      De pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de deelnemer of
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel87
  - number: '88.1'
    text: |-
      Een beroepspensioenfonds is bevoegd om op verzoek van de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde de waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalregeling of
      een premieregeling die voorziet in de uitkering van een aan te wenden kapitaal op de pensioendatum, per de
      pensioendatum rechtstreeks over te dragen aan een andere pensioenuitvoerder indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: 88.1.a
    text: de beroepspensioenregeling hierin voorziet;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: 88.1.b
    text: |-
      de overdrachtswaarde zodanig door het overdragende beroepspensioenfonds wordt vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: 88.1.c
    text: |-
      indien de ontvangende pensioenuitvoerder een beroepspensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: '88.2'
    text: |-
      In afwijking van het eerste lid is een beroepspensioenfonds verplicht op verzoek van de deelnemer, gewezen
      deelnemer of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken als bedoeld in het eerste lid, per
      de pensioendatum rechtstreeks over te dragen aan een andere pensioenuitvoerder indien voldaan wordt aan de in het
      eerste lid, onderdelen b en c en tweede zin, genoemde voorwaarden en:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: 88.2.a
    text: |-
      het beroepspensioenfonds uitsluitend variabele uitkeringen uitvoert en het pensioenkapitaal na de overdracht
      wordt aangewend voor een vastgestelde uitkering, tenzij de deelnemer of gewezen deelnemer voor de pensioendatum
      deel uitmaakt van de toedelingskring waarop een collectief toedelingsmechanisme voor het beleggingsrisico wordt
      toegepast; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: 88.2.b
    text: |-
      het beroepspensioenfonds uitsluitend vastgestelde uitkeringen uitvoert en het pensioenkapitaal na de overdracht
      wordt aangewend voor een variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: '88.3'
    text: Het eerste lid, onderdeel b, is van toepassing op pensioenaanspraken die vanaf 1 januari 2007 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: '88.4'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid, onderdeel b, van toepassing indien het recht
      op die premievrije voortzetting is ontstaan op of na 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: '88.5'
    text: |-
      In afwijking van het derde lid kunnen de in het eerste lid, onderdeel b, opgenomen voorwaarden van toepassing
      zijn op pensioenaanspraken die zijn opgebouwd voor 1 januari 2007 indien dit is overeengekomen in de
      beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: '88.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: '88.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel88
  - number: '89.1'
    text: |-
      De verzekeraar is verplicht om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de
      waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalregeling of een premieregeling die voorziet
      in de uitkering van een aan te wenden kapitaal op de pensioendatum, per de pensioendatum rechtstreeks over te
      dragen aan een andere pensioenuitvoerder indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: 89.1.a
    text: |-
      de overdrachtswaarde zodanig door de overdragende verzekeraar wordt vastgesteld dat de voor mannen en vrouwen te
      verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: 89.1.b
    text: |-
      indien de ontvangende pensioenuitvoerder een beroepspensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds pensioenaanspraken heeft jegens dat beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: '89.2'
    text: Het eerste lid, onderdeel a, is van toepassing op pensioenaanspraken die vanaf 1 januari 2007 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: '89.3'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die aanspraken worden opgebouwd, is het eerste lid, onderdeel a, van toepassing indien het recht
      op die premievrije voortzetting is ontstaan op of na 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: '89.4'
    text: |-
      In afwijking van het tweede lid kunnen de in het eerste lid, onderdeel a, opgenomen voorwaarden van toepassing
      zijn op pensioenaanspraken die zijn opgebouwd voor 1 januari 2007 indien dit is overeengekomen in de
      beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: '89.5'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: '89.6'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89
  - number: 89a.1
    text: |-
      De premiepensioeninstelling is verplicht de waarde van de pensioenaanspraken van de deelnemer, gewezen deelnemer
      of andere aanspraakgerechtigde op de datum van omzetting van de aanspraken in een vastgestelde pensioenuitkering
      rechtstreeks over te dragen aan een door de premiepensioeninstelling aangewezen verzekeraar.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.2
    text: |-
      In afwijking van het eerste lid is de premiepensioeninstelling verplicht op verzoek van de deelnemer, gewezen
      deelnemer of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken per de pensioendatum rechtstreeks
      over te dragen aan een pensioenuitvoerder die door de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde
      is aangewezen. Daarbij gelden de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.2.a
    text: |-
      indien de door de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde aangewezen pensioenuitvoerder een
      beroepspensioenfonds is, de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde al pensioenaanspraken heeft
      jegens dat pensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.2.b
    text: |-
      de ontvangende pensioenuitvoerder hanteert dezelfde methode als de premiepensioeninstelling om aan het vereiste van
      gelijke behandeling van mannen en vrouwen te voldoen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.3
    text: |-
      De overdrachtswaarde wordt door de premiepensioeninstelling zodanig vastgesteld dat de voor mannen en vrouwen te
      verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële gelijkwaardigheid op
      basis van dezelfde grondslagen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.4
    text: Het derde lid is van toepassing op pensioenaanspraken die vanaf 1 januari 2007 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.5
    text: |-
      Voor zover het pensioenaanspraken betreft die als gevolg van een premievrije voortzetting van die aanspraken worden
      opgebouwd, is het derde lid van toepassing indien het recht op die premievrije voortzetting is ontstaan op of na
      1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.6
    text: |-
      In afwijking van het vierde lid kunnen de in het derde lid opgenomen voorwaarden van toepassing
      zijn op pensioenaanspraken die zijn opgebouwd voor 1 januari 2007 indien dit is overeengekomen in de
      beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.7
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89a.8
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89a
  - number: 89b.1
    text: |-
      Onverminderd de [artikelen 88][ref1], [89][ref2] en [89a][ref3] is de pensioenuitvoerder bevoegd om op verzoek
      van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde de waarde van zijn pensioenaanspraken welke
      voortvloeien uit een kapitaalregeling of een premieregeling op de datum van omzetting van de aanspraken in een
      pensioenuitkering rechtstreeks over te dragen aan een andere pensioenuitvoerder indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel89
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel89a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89b
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '89'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: 89a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 89b.1.a
    text: de beroepspensioenregeling hierin voorziet;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89b
  - number: 89b.1.b
    text: |-
      de overdrachtswaarde zodanig door de overdragende pensioenuitvoerder wordt vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89b
  - number: 89b.1.c
    text: |-
      indien de ontvangende pensioenuitvoerder een beroepspensioenfonds is, de deelnemer, gewezen deelnemer of andere
      aanspraakgerechtigde reeds aanspraken heeft jegens dit beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89b
  - number: 89b.2
    text: |-
      [Artikel 88, derde tot en met zevende lid][ref1], en [artikel 89a, tweede lid, onderdeel b][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel88
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel89a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel89b
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 89a
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '90.1'
    text: |-
      In geval van overdracht van pensioenkapitaal op de pensioendatum ten behoeve van aankoop van een periodieke
      pensioenuitkering, draagt de overdragende pensioenuitvoerder het pensioenkapitaal over:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel90
  - number: 90.1.a
    text: |-
      aan de door de deelnemer of gewezen deelnemer aangewezen ontvangende pensioenuitvoerder op de pensioendatum of
      binnen acht weken na het verzoek hiertoe van de deelnemer of gewezen deelnemer indien deze dat verzoek minder dan
      acht weken voor de pensioendatum heeft gedaan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel90
  - number: 90.1.b
    text: |-
      aan de door de aanspraakgerechtigde, niet zijnde de deelnemer of gewezen deelnemer, aangewezen ontvangende
      pensioenuitvoerder binnen acht weken na het verzoek hiertoe van die aanspraakgerechtigde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel90
  - number: '90.2'
    text: |-
      De overdragende pensioenuitvoerder is verplicht tot vergoeding van de schade die de deelnemer, gewezen deelnemer
      of andere aanspraakgerechtigde ondervindt ten gevolge van de aan die pensioenuitvoerder toerekenbare niet tijdige
      overdracht; de schade is ten minste gelijk aan de wettelijke rente op het over te dragen pensioenkapitaal.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel90
  - number: '91.1'
    text: |-
      De pensioenuitvoerder is op verzoek van de beroepspensioenvereniging bevoegd tot collectieve waardeoverdracht
      indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: 91.1.a
    text: |-
      de waardeoverdracht ertoe strekt in verband met de beëindiging van de uitvoeringsovereenkomst tussen de
      beroepspensioenvereniging en de overdragende pensioenuitvoerder de waarde onder te brengen bij de ontvangende
      pensioenuitvoerder met wie de beroepspensioenvereniging een uitvoeringsovereenkomst heeft gesloten; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: 91.1.b
    text: |-
      de waardeoverdracht ertoe strekt in verband met een wijziging van de beroepspensioenregeling de waarde van
      pensioenaanspraken of pensioenrechten aan te wenden bij dezelfde pensioenuitvoerder overeenkomstig die gewijzigde
      beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: '91.2'
    text: 'Bij een collectieve waardeoverdracht als bedoeld in het eerste lid wordt voldaan aan de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: 91.2.a
    text: |-
      de deelnemers, gewezen deelnemers, gewezen partners of de pensioengerechtigden hebben geen bezwaren jegens de
      pensioenuitvoerder kenbaar gemaakt tegen de waardeoverdracht nadat zij over het voornemen schriftelijk zijn
      geïnformeerd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: 91.2.b
    text: |-
      de overdrachtswaarde wordt door de overdragende pensioenuitvoerder zodanig vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: 91.2.c
    text: |-
      het voornemen tot waardeoverdracht aan een pensioenuitvoerder wordt door de overdragende pensioenuitvoerder
      uiterlijk drie maanden voor de beoogde datum van waardeoverdracht schriftelijk gemeld aan de toezichthouder en de
      toezichthouder heeft binnen die periode geen verbod tot waardeoverdracht opgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: '91.3'
    text: |-
      Het tweede lid, onderdelen a en c, is niet van toepassing voor zover de wijziging van de beroepspensioenregeling,
      bedoeld in het eerste lid, onderdeel b, inhoudt dat de pensioenaanspraken worden omgezet in pensioenaanspraken die
      zijn berekend op basis van een hogere pensioenrichtleeftijd en voldaan wordt aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: 91.3.a
    text: |-
      de nieuwe pensioenrichtleeftijd betreft een pensioenrichtleeftijd als bedoeld in
      [artikel 18a, zesde lid, van de Wet op de loonbelasting 1964][ref1], zoals dit artikel op enig moment luidt of
      luidde;


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
  - number: 91.3.b
    text: |-
      de beroepspensioenregeling voorziet in de mogelijkheid de ingangsdatum van het pensioen te vervroegen naar de
      ingangsdatum voor de wijziging; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: 91.3.c
    text: |-
      bij de vervroeging worden in de flexibiliseringfactoren naar de ingangsdatum van het pensioen voor de wijziging
      geen selectiefactoren in aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: '91.4'
    text: Het tweede lid, onderdeel b, is van toepassing op pensioenaanspraken die vanaf 1 januari 2007 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: '91.5'
    text: |-
      Op pensioenaanspraken die voor de in het vierde lid genoemde datum zijn opgebouwd is de eis van individuele
      actuariële gelijkwaardigheid, bedoeld in [artikel 82, vierde lid][ref1], van toepassing, tenzij in de
      beroepspensioenregeling is overeengekomen dat de voorwaarden, bedoeld in het tweede lid, onderdeel b, van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '91.6'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd is onderdeel b van het tweede lid van toepassing indien
      het recht op die premievrije voortzetting is ontstaan op of na 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: '91.7'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: '91.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel91
  - number: '92.1'
    text: |-
      De pensioenuitvoerder is verplicht tot waardeoverdracht aan een andere pensioenuitvoerder bij liquidatie van de
      eerstgenoemde pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: '92.2'
    text: 'In geval van een waardeoverdracht als bedoeld in het eerste lid gelden de volgende voorwaarden:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: 92.2.a
    text: |-
      het voornemen tot waardeoverdracht aan een pensioenuitvoerder wordt door de overdragende pensioenuitvoerder
      uiterlijk drie maanden voor de beoogde datum van waardeoverdracht schriftelijk gemeld aan de toezichthouder en de
      toezichthouder heeft binnen die periode geen verbod tot waardeoverdracht opgelegd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: 92.2.b
    text: |-
      de overdrachtswaarde wordt zodanig door de overdragende pensioenuitvoerder vastgesteld dat de voor mannen
      en vrouwen te verwerven pensioenrechten gelijk zijn, waarbij aan het vereiste van collectieve actuariële
      gelijkwaardigheid op basis van dezelfde grondslagen wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: '92.3'
    text: Het tweede lid, onderdeel b, is van toepassing op pensioenaanspraken die vanaf 1 januari 2007 zijn opgebouwd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: '92.4'
    text: |-
      Op pensioenaanspraken die voor de in het derde lid genoemde datum zijn opgebouwd is de eis van individuele
      actuariële gelijkwaardigheid, bedoeld in [artikel 82, vierde lid][ref1], van toepassing tenzij in de
      beroepspensioenregeling is overeengekomen dat de voorwaarden, bedoeld in het tweede lid, onderdeel b, van
      toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '92.5'
    text: |-
      Voorzover het bij de toepassing van het eerste lid pensioenaanspraken betreft die als gevolg van een premievrije
      voortzetting van die pensioenaanspraken worden opgebouwd is onderdeel b van het tweede lid van toepassing indien
      het recht op die premievrije voortzetting is ontstaan op of na 1 januari 2006.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: '92.6'
    text: Elk beding strijdig met dit artikel is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: '92.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld aan het vaststellen van de
      overdrachtswaarde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel92
  - number: '93.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen aan een pensioeninstelling uit een andere lidstaat
      of een verzekeraar met een zetel buiten Nederland als bedoeld in [artikel 8][ref1], indien voldaan wordt aan de
      in [artikel 82][ref2] genoemde voorwaarden, met dien verstande dat de in [artikel 83][ref3] gestelde eis inzake de
      ontvangende pensioenuitvoerder niet van toepassing is, en mits:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel82
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 93.1.a
    text: |-
      de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1], met de waardeoverdracht instemt; en


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: 93.1.b
    text: |-
      de mogelijkheden tot afkoop van de waarde van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer
      zijn dan op basis van deze wet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel93
  - number: '93.2'
    text: |-
      Indien op grond van de in [artikel 83][ref1] genoemde omstandigheden tijdelijk geen plicht tot waardeoverdracht
      bestaat, maar deze plicht overeenkomstig [artikel 85][ref2] herleeft, is [artikel 85, derde lid][ref3], niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel85
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '85'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '85'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '93.3'
    text: |-
      De overdragende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel93
  - number: '94.1'
    text: |-
      De pensioenuitvoerder is verplicht om na een verzoek van de gewezen deelnemer tot waardeoverdracht de
      overdrachtswaarde van diens pensioenaanspraken over te dragen aan een van de Europese Gemeenschappen of aan een op
      grond van [artikel 81, tweede lid][ref1], door Onze Minister aangewezen instelling, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '81'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 94.1.a
    text: er sprake is van beëindiging van de deelneming;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel94
  - number: 94.1.b
    text: |-
      die waardeoverdracht ertoe strekt het de gewezen deelnemer mogelijk te maken pensioenaanspraken te verwerven bij
      een van de Europese Gemeenschappen of de aangewezen genoemde instelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel94
  - number: 94.1.c
    text: de waarde rechtstreeks wordt overgedragen aan de betrokken Europese Gemeenschap of de aangewezen instelling; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel94
  - number: 94.1.d
    text: |-
      de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1], met de waardeoverdracht instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: '94.2'
    text: |-
      De overdragende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      gewezen deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel94
  - number: '94.3'
    text: |-
      De op grond van [artikel 82, zevende lid][ref1], bij of krachtens algemene maatregel van bestuur gestelde regels
      ten aanzien van de berekening van de overdrachtswaarde zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: '95.1'
    text: |-
      De pensioenuitvoerder die een verzoek tot waardeoverdracht ontvangt van een gewezen deelnemer waarbij beoogd wordt
      de waarde over te dragen aan een buitenlandse instelling, meldt dit aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
  - number: '95.2'
    text: |-
      Waardeoverdracht aan een buitenlandse instelling is alleen mogelijk wanneer ten genoegen van de toezichthouder
      wordt aangetoond dat:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
  - number: 95.2.a
    text: |-
      voldaan wordt aan de in [artikel 82, eerste lid][ref1], genoemde voorwaarden;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel82
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '82'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 95.2.b
    text: |-
      de in [artikel 83][ref1] bedoelde omstandigheden op de overdragende pensioenuitvoerder niet van toepassing zijn;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 95.2.c
    text: de buitenlandse instelling de pensioenregeling uitvoert waaraan de beroepsgenoot deelneemt;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
  - number: 95.2.d
    text: de buitenlandse instelling in het land van vestiging is onderworpen aan een vorm van overheidstoezicht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
  - number: 95.2.e
    text: |-
      de vermogens van de instelling en de werkgever juridisch zijn gescheiden door het bestaan van een aparte
      juridische entiteit van de instelling, door een speciale preferentieregeling ten gunste van pensioengerechtigden
      of anderszins;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
  - number: 95.2.f
    text: |-
      de mogelijkheden tot afkoop van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer zijn dan op
      basis van deze wet; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
  - number: 95.2.g
    text: |-
      de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1], met de waardeoverdracht instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: '96'
    text: |-
      De pensioenuitvoerder is bevoegd om op verzoek van de gewezen deelnemer de waarde van zijn pensioenaanspraken over
      te dragen aan een pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland als
      bedoeld in [artikel 8][ref1], indien wordt voldaan aan de in [artikel 86][ref2] opgenomen voorwaarden, en mits:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel86
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '86'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 96.a
    text: |-
      de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1], met de waardeoverdracht instemt; en


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: 96.b
    text: |-
      de mogelijkheden tot afkoop van de waarde van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer
      zijn dan op basis van deze wet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel96
  - number: '97'
    text: |-
      De pensioenuitvoerder is bevoegd om op verzoek van de deelnemer, gewezen deelnemer of andere aanspraakgerechtigde
      de waarde van zijn pensioenaanspraken welke voortvloeien uit een kapitaalregeling of een premieregeling per
      de pensioendatum rechtstreeks over te dragen aan een pensioeninstelling uit een andere lidstaat of verzekeraar
      met zetel buiten Nederland als bedoeld in [artikel 8][ref1], indien wordt voldaan aan de in [artikel 88][ref2]
      opgenomen voorwaarden, en mits:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel88
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '88'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 97.a
    text: |-
      de tot verevening gerechtigde echtgenoot, bedoeld in
      [artikel 2 van de Wet verevening pensioenrechten bij scheiding][ref1], met de waardeoverdracht instemt; en


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel2
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '2'
  - number: 97.b
    text: |-
      de mogelijkheden tot afkoop van de waarde van de overgedragen pensioenaanspraken na de waardeoverdracht niet ruimer
      zijn dan op basis van deze wet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel97
  - number: '98.1'
    text: |-
      De pensioenuitvoerder is bevoegd om op verzoek van de beroepspensioenvereniging over te gaan tot collectieve
      waardeoverdracht overeenkomstig [artikel 91][ref1], indien de beroepspensioenvereniging een uitvoeringsovereenkomst
      heeft gesloten met een pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland als
      bedoeld in [artikel 8][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel8
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '8'
        hoofdstuk: '2'
  - number: '98.2'
    text: |-
      Aan de in [artikel 92][ref1] geformuleerde verplichting tot waardeoverdracht in geval van liquidatie kan ook worden
      voldaan door waardeoverdracht aan een pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel
      buiten Nederland als bedoeld in [artikel 8][ref2] in plaats van aan een pensioenuitvoerder.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel8
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '92'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '8'
        hoofdstuk: '2'
  - number: 98a.1
    text: |-
      Een beroepspensioenfonds of premiepensioeninstelling is met inachtneming van [artikel 98][ref1] slechts bevoegd
      over te gaan tot collectieve waardeoverdracht naar een pensioeninstelling uit een andere lidstaat, indien
      de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft,
      goedkeuring hebben verleend voor de collectieve waardeoverdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel98
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '98'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 98a.2
    text: 'Ten behoeve van een aanvraag tot goedkeuring van een collectieve waardeoverdracht als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.2.a
    text: |-
      stelt het beroepspensioenfonds of de premiepensioeninstelling de informatie over de aan de voorgenomen collectieve
      waardeoverdracht verbonden voorwaarden tijdig ter beschikking aan de betrokken deelnemers, gewezen deelnemers en
      pensioengerechtigden, waarbij de deelnemers, gewezen deelnemers en pensioengerechtigden tevens worden geïnformeerd
      over het goedkeuringsrecht, bedoeld in onderdeel b; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.2.b
    text: |-
      is vereist dat een tweederdemeerderheid van de deelnemers en gewezen deelnemers en een tweederdemeerderheid van de
      pensioengerechtigden die hebben gereageerd op een daartoe strekkend schriftelijk verzoek het voorgenomen besluit
      met betrekking tot de collectieve waardeoverdracht hebben goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.3
    text: |-
      De bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel
      heeft kunnen alleen goedkeuring verlenen voor de collectieve waardeoverdracht indien de toezichthouder die
      bevoegde autoriteiten heeft meegedeeld toestemming te verlenen voor de collectieve waardeoverdracht. De
      [artikelen 91, tweede lid, onderdeel c][ref1], en [92, tweede lid, onderdeel a][ref2], zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel91
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel92
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '92'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 98a.4
    text: 'De toezichthouder verleent alleen toestemming voor de collectieve waardeoverdracht, indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.4.a
    text: |-
      in geval van een gedeeltelijke collectieve waardeoverdracht de langetermijnbelangen van de deelnemers,
      gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden van het resterende deel van de
      beroepspensioenregeling afdoende worden beschermd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.4.b
    text: |-
      de individuele pensioenaanspraken en pensioenrechten van de deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en pensioengerechtigden na de collectieve waardeoverdracht minstens gelijk blijven; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.4.c
    text: |-
      de met de over te dragen beroepspensioenregeling overeenkomende activa toereikend en passend zijn om de over te
      dragen passiva, technische voorzieningen en andere verplichtingen en rechten te dekken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.5
    text: |-
      De toezichthouder deelt de resultaten van zijn beoordeling binnen acht weken na ontvangst van de aanvraag tot
      goedkeuring met de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.6
    text: |-
      Indien de collectieve waardeoverdracht in een grensoverschrijdende activiteit resulteert, informeert de
      toezichthouder de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft binnen vier weken na ontvangst van het besluit waarmee goedkeuring wordt verleend voor de collectieve
      waardeoverdracht over de bepalingen van de Nederlandse sociale en arbeidswetgeving die van toepassing zijn op de
      beroepspensioenregeling waarvan de waarde is overgedragen. De [artikelen 194, tweede lid][ref1], [195][ref2] en
      [196][ref3] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel194
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel195
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel196
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '194'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '195'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '196'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 98a.7
    text: |-
      De kosten van de collectieve waardeoverdracht komen niet ten laste van de bij het beroepspensioenfonds
      of de premiepensioeninstelling resterende deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: 98a.8
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel98a
  - number: '99.1'
    text: |-
      Indien een pensioenuitvoerder het verzoek krijgt om in het kader van waardeoverdracht een waarde van een
      pensioeninstelling uit een andere lidstaat of een verzekeraar met zetel buiten Nederland aan te nemen die verband
      houdt met een beroepspensioenregeling waarop deze wet tot het tijdstip van waardeoverdracht niet van toepassing is,
      is de pensioenuitvoerder gehouden daarvoor als ontvangende pensioenuitvoerder op te treden, mits:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel99
  - number: 99.1.a
    text: |-
      die waardeoverdracht ertoe strekt het de verzoekende deelnemer mogelijk te maken pensioenaanspraken te verwerven
      bij de ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel99
  - number: 99.1.b
    text: |-
      op de pensioenuitvoerder de in [artikel 83][ref1] genoemde omstandigheden niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 99.1.c
    text: |-
      aan de pensioenuitvoerder geen voorwaarden in verband met de waardeoverdracht worden gesteld die in strijd zijn met
      deze wet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel99
  - number: '99.2'
    text: |-
      De ontvangende pensioenuitvoerder brengt in het kader van de waardeoverdracht geen kosten in rekening bij de
      deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel99
  - number: '100'
    text: |-
      Indien een pensioenuitvoerder het verzoek krijgt om in het kader van waardeoverdracht een waarde van een
      buitenlandse instelling aan te nemen die verband houdt met een pensioenregeling waarop deze wet tot het
      tijdstip van waardeoverdracht niet van toepassing is, is de pensioenuitvoerder bevoegd daarvoor als ontvangende
      pensioenuitvoerder op te treden, mits:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100
  - number: 100.a
    text: |-
      die waardeoverdracht ertoe strekt het de verzoekende deelnemer mogelijk te maken pensioenaanspraken te verwerven
      bij de ontvangende pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100
  - number: 100.b
    text: |-
      op de pensioenuitvoerder de in [artikel 83][ref1] genoemde omstandigheden niet van toepassing zijn; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel83
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '83'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 100.c
    text: |-
      aan de pensioenuitvoerder geen voorwaarden in verband met de waardeoverdracht worden gesteld die in strijd zijn met
      deze wet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100
  - number: 100a.1
    text: |-
      Een beroepspensioenfonds of premiepensioeninstelling is bevoegd een collectieve waardeoverdracht van een
      pensioeninstelling uit een andere lidstaat aan te nemen, mits de toezichthouder goedkeuring heeft verleend voor de
      collectieve waardeoverdracht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.2
    text: |-
      Het beroepspensioenfonds of de premiepensioeninstelling dient de aanvraag tot goedkeuring van een collectieve
      waardeoverdracht als bedoeld in het eerste lid in bij de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3
    text: 'De aanvraag tot goedkeuring bevat de volgende gegevens:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3.a
    text: |-
      de schriftelijke overeenkomst tussen het beroepspensioenfonds of de premiepensioeninstelling en de
      pensioeninstelling uit de andere lidstaat met de voorwaarden van de voorgenomen collectieve waardeoverdracht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3.b
    text: een beschrijving van de belangrijkste kenmerken van de over te dragen beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3.c
    text: |-
      een beschrijving van de over te dragen passiva of technische voorzieningen en andere verplichtingen en rechten, en
      de overeenkomstige activa of de geldwaarde daarvan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3.d
    text: |-
      de naam, alsmede de plaats van vestiging van het hoofdbestuur, van het beroepspensioenfonds of de
      premiepensioeninstelling en de pensioeninstelling uit de andere lidstaat en de lidstaten waar deze instellingen
      zijn geregistreerd of een vergunning hebben verkregen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3.e
    text: de namen van de betrokken zelfstandigen of beroepsgenoten;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3.f
    text: |-
      een bewijs dat een, op basis van het recht van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar
      zetel heeft, vastgestelde meerderheid van de betrokken deelnemers, gewezen deelnemers en pensioengerechtigden of,
      in voorkomend geval, een meerderheid van hun vertegenwoordigers, de overdracht heeft goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.3.g
    text: |-
      in voorkomend geval, de namen van de lidstaten waarvan de geldende sociale en arbeidswetgeving van toepassing is op
      de betrokken beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.4
    text: |-
      De toezichthouder stuurt de aanvraag tot goedkeuring, bedoeld in het tweede lid, na ontvangst onverwijld aan de
      bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5
    text: |-
      Na ontvangst van de beoordeling van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit
      de andere lidstaat haar zetel heeft, neemt de toezichthouder een besluit omtrent het verlenen of weigeren van
      goedkeuring voor de collectieve waardeoverdracht, met dien verstande dat:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5.a
    text: |-
      indien de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft
      geen toestemming hebben verleend voor de collectieve waardeoverdracht een inhoudelijke beoordeling van de aanvraag
      tot goedkeuring van de collectieve waardeoverdracht door de toezichthouder achterwege kan blijven en goedkeuring
      voor de collectieve waardeoverdracht wordt geweigerd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5.b
    text: |-
      indien de bevoegde autoriteiten toestemming hebben verleend voor de collectieve waardeoverdracht, de toezichthouder
      goedkeuring verleent voor de collectieve waardeoverdracht, mits:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5.b.1°
    text: de aanvraag tot goedkeuring de gegevens, bedoeld in het derde lid, bevat;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5.b.2°
    text: |-
      de administratieve structuur, de financiële positie van het beroepspensioenfonds of de premiepensioeninstelling en
      de goede reputatie of de beroepskwalificaties of beroepservaring van de personen die het beroepspensioenfonds of de
      premiepensioeninstelling besturen met de voorgenomen collectieve waardeoverdracht verenigbaar zijn;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5.b.3°
    text: |-
      de langetermijnbelangen van de deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden
      van het beroepspensioenfonds of de premiepensioeninstelling en het overgedragen deel van de beroepspensioenregeling
      tijdens en na de collectieve waardeoverdracht afdoende worden beschermd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5.b.4°
    text: |-
      de technische voorzieningen van het beroepspensioenfonds of de premiepensioeninstelling op het moment van de
      collectieve waardeoverdracht volledig door kapitaal zijn gedekt, indien de collectieve waardeoverdracht in een
      grensoverschrijdende activiteit resulteert; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.5.b.5°
    text: |-
      de over te dragen activa toereikend en passend zijn om de over te dragen passiva, technische voorzieningen en
      andere verplichtingen en rechten te dekken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.6
    text: |-
      De toezichthouder deelt het besluit tot het verlenen of weigeren van goedkeuring voor de collectieve
      waardeoverdracht binnen drie maanden na ontvangst van de aanvraag tot goedkeuring mee aan het beroepspensioenfonds
      of de premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.7
    text: |-
      De toezichthouder deelt de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat
      haar zetel heeft het in het zesde lid bedoelde besluit mee, binnen twee weken nadat het is genomen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.8
    text: |-
      De toezichthouder deelt informatie over de toepasselijke bepalingen van sociale en arbeidswetgeving ontvangen van
      de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit de andere lidstaat haar zetel heeft binnen
      een week na ontvangst mee aan het beroepspensioenfonds of de premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.9
    text: |-
      De kosten van de collectieve waardeoverdracht komen niet ten laste van de bij het beroepspensioenfonds
      of de premiepensioeninstelling bestaande deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en
      pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: 100a.10
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel100a
  - number: '101'
    text: |-
      Inlichtingen uit de basisregistratie personen en inlichtingen en uittreksels uit de registers van de burgerlijke
      stand, die de pensioenuitvoerder nodig heeft met het oog op de uitvoering van zijn taak, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel101
  - number: '102.1'
    text: Het burgerservicenummer kan door de pensioenuitvoerder bij het verwerken van persoonsgegevens worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel102
  - number: '102.2'
    text: 'De pensioenuitvoerder gebruikt dit burgerservicenummer uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel102
  - number: 102.2.a
    text: in het verkeer met de persoon op wie het nummer betrekking heeft; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel102
  - number: 102.2.b
    text: |-
      in contacten met personen en instanties voor zover deze zelf bevoegd zijn gebruik te maken van het
      burgerservicenummer bij het verwerken van persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel102
  - number: '103.1'
    text: |-
      Bij voorwaardelijke toeslagverlening door een verzekeraar dient er een consistent geheel te zijn tussen de gewekte
      verwachtingen, de financiering en het realiseren van voorwaardelijke toeslagen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel103
  - number: '103.2'
    text: Bij regeling van Onze Minister wordt invulling gegeven aan de consistentie, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel103
  - number: '103.3'
    text: |-
      Een toeslag is alleen voorwaardelijk indien in de beroepspensioenregeling, de uitvoeringsovereenkomst,
      het pensioenreglement, de opgaven op grond van de [artikelen 48 tot en met 57a][ref1] alsmede in de
      overige, persoonlijke, informatieverstrekking over toeslagverlening door de pensioenuitvoerder een
      voorwaardelijkheidsverklaring is opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel48
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '48'
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: '103.4'
    text: Bij regeling van Onze Minister kunnen regels worden gesteld over de inhoud van de voorwaardelijkheidsverklaring.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel103
  - number: '104'
    text: 'Een pensioenuitvoerder vermeldt in zijn bestuursverslag of in het afgelopen boekjaar:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel104
  - number: 104.a
    text: |-
      aan de pensioenuitvoerder dwangsommen en bestuurlijke boeten zijn opgelegd, en zo ja, hoeveel deze in totaal hebben
      bedragen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel104
  - number: 104.b
    text: |-
      een aanwijzing als bedoeld in [artikel 166][ref1] aan de pensioenuitvoerder is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 104.c
    text: |-
      een bewindvoerder als bedoeld in [artikel 168][ref1] is aangesteld;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel168
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '168'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 104.d
    text: |-
      een herstelplan als bedoeld in [artikel 133][ref1] of [artikel 134][ref2] van toepassing is;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel134
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '134'
        hoofdstuk: '5'
  - number: 104.e
    text: |-
      de beëindiging van de situatie, bedoeld in [artikel 167][ref1], waarin de bevoegdheidsuitoefening van alle of
      bepaalde organen van een beroepspensioenfonds is gebonden aan toestemming van de toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel167
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '167'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '105'
    text: |-
      Overlijdt een deelnemer, gewezen deelnemer of gepensioneerde ten gevolge van een van het risico uitgesloten oorzaak
      en betrof het een partnerpensioen op opbouwbasis, dan keert de pensioenuitvoerder aan de partner een periodieke
      uitkering van partnerpensioen uit die gebaseerd is op de premievrije waarde berekend naar de dag voorafgaande aan
      het overlijden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel105
  - number: 105a
    text: |-
      De Nederlandse sociale en arbeidswetgeving is niet van toepassing voor zover een pensioenuitvoerder een
      pensioenregeling uitvoert waarop de voor de bedrijfspensioenvoorziening geldende regels van een andere staat dan
      Nederland van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel105a
  - number: '106'
    text: Een beroepspensioenfonds is een rechtspersoon met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel106
  - number: '107.1'
    text: |-
      De oprichters melden de voorgenomen oprichting van een beroepspensioenfonds uiterlijk zes weken voor de beoogde
      datum van oprichting aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
  - number: '107.2'
    text: Het beroepspensioenfonds meldt binnen drie maanden na zijn oprichting deze oprichting aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
  - number: '107.3'
    text: 'Bij de melding, bedoeld in het eerste lid, worden gevoegd:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
  - number: 107.3.a
    text: een authentiek afschrift van de akte van oprichting van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
  - number: 107.3.b
    text: een door het bestuur gewaarmerkt exemplaar van het reglement of de reglementen van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
  - number: 107.3.c
    text: een door het bestuur gewaarmerkt afschrift van de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
  - number: 107.3.d
    text: |-
      een actuariële en bedrijfstechnische nota als bedoeld in [artikel 140][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '140'
        hoofdstuk: '5'
  - number: 107.3.e
    text: een eventuele overeenkomst tot verzekering, overdracht of onderbrenging.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel107
  - number: '108'
    text: 'Het beroepspensioenfonds zendt:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel108
  - number: 108.a
    text: een authentiek afschrift van de akte houdende wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel108
  - number: 108.b
    text: een door het bestuur gewaarmerkt exemplaar van wijziging van de reglementen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel108
  - number: 108.c
    text: een door het bestuur gewaarmerkt afschrift van de wijzigingen in de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel108
  - number: 108.d
    text: |-
      een door het bestuur gewaarmerkt afschrift van de wijzigingen in de actuariële en bedrijfstechnische nota als
      bedoeld in [artikel 140][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '140'
        hoofdstuk: '5'
  - number: 108.e
    text: |-
      een door het bestuur gewaarmerkt afschrift van de wijzigingen in de eventuele overeenkomst tot verzekering,
      overdracht of onderbrenging,
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel108
  - number: '109'
    text: |-
      Het bestuur van een beroepspensioenfonds bestaat uit vertegenwoordigers van de beroepspensioenvereniging die de
      verplichtstelling heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel109
  - number: 109a.1
    text: |-
      Het bestuur van een beroepspensioenfonds draagt in overleg met de overige organen van het beroepspensioenfonds
      zorg voor de vastlegging van de doelstellingen en beleidsuitgangspunten, waaronder de risicohouding, van het
      beroepspensioenfonds. De organen van het beroepspensioenfonds gebruiken deze doelstellingen en uitgangspunten
      bij de toetsing van de opdrachtaanvaarding van de door vertegenwoordigers van beroepspensioenverenigingen
      overeengekomen beroepspensioenregelingen, en bij de besluitvorming, de verantwoording, de advisering, en het
      toezicht binnen het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel109a
  - number: 109a.2
    text: |-
      Het bestuur van een beroepspensioenfonds streeft er naar van de vertegenwoordigers, bedoeld in het eerste lid, zo
      veel mogelijk duidelijkheid te verkrijgen over de doelstellingen, het ambitieniveau van de toeslagverlening en de
      risicohouding, die ten grondslag liggen aan de beroepspensioenregelingen die de vertegenwoordigers als opdracht in
      uitvoering aan het beroepspensioenfonds geven.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel109a
  - number: 109a.3
    text: |-
      Het bestuur van een beroepspensioenfonds draagt zorg voor de formele opdrachtaanvaarding van de door de
      vertegenwoordigers, bedoeld in het eerste lid, aan het beroepspensioenfonds opgedragen beroepspensioenregelingen.
      Het bestuur toetst bij de opdrachtaanvaarding voor het beroepspensioenfonds als geheel en voor de relevante
      beleidsgebieden aan de doelstellingen en uitgangspunten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel109a
  - number: 109a.4
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel109a
  - number: '110.1'
    text: |-
      Het intern toezicht bij een beroepspensioenfonds wordt uitgeoefend door een raad van toezicht, door jaarlijkse
      visitatie of door de niet uitvoerende bestuurders indien de bestuurstaken worden verdeeld over uitvoerende en niet
      uitvoerende bestuurders.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110
  - number: '110.2'
    text: |-
      Indien het intern toezicht wordt uitgeoefend door niet uitvoerende bestuurders zijn
      [artikel 129a van Boek 2 van het Burgerlijk Wetboek][ref1] en [artikel 110a, tweede lid][ref2], van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel129a
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 129a
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 110a
        hoofdstuk: '4'
  - number: 110a.1
    text: |-
      De raad van toezicht of de visitatiecommissie bestaat uit ten minste drie natuurlijke personen. De leden van de
      raad van toezicht of de visitatiecommissie zijn onafhankelijk en laten dit tot uiting komen in het toezicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.2
    text: |-
      De raad van toezicht heeft tot taak toezicht te houden op het beleid van het bestuur en op de algemene gang
      van zaken in het beroepspensioenfonds. De raad van toezicht is ten minste belast met het toezien op adequate
      risicobeheersing en evenwichtige belangenafweging door het bestuur en legt verantwoording af over de uitvoering
      van de taken en de uitoefening van de bevoegdheden aan het verantwoordingsorgaan en in het bestuursverslag. De raad
      van toezicht staat het bestuur met raad ter zijde. [Artikel 9 van Boek 2 van het Burgerlijk Wetboek][ref1] is van
      overeenkomstige toepassing op de leden van de raad van toezicht.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel9
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '9'
  - number: 110a.3
    text: 'Aan de goedkeuring van de raad van toezicht zijn onderworpen de besluiten van het bestuur tot vaststelling van:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.3.a
    text: het bestuursverslag en de jaarrekening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.3.b
    text: de profielschets voor bestuurders;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.3.c
    text: het beleid inzake beloningen, met uitzondering van de beloning van de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.3.d
    text: |-
      gehele of gedeeltelijke overdracht van de verplichtingen van het beroepspensioenfonds of de overname van
      verplichtingen door het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.3.e
    text: liquidatie, fusie of splitsing van het beroepspensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.3.f
    text: |-
      het omzetten van het beroepspensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: 110a.4
    text: |-
      De statuten voorzien in een regeling voor geschillen over goedkeuring van besluiten door de raad van toezicht.
      Het ontbreken van de goedkeuring van de raad van toezicht op een besluit als bedoeld in het derde lid tast de
      vertegenwoordigingsbevoegdheid van bestuur of bestuurders niet aan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.5
    text: |-
      De raad van toezicht meldt disfunctioneren van het bestuur aan het verantwoordingsorgaan en aan de partij die
      bevoegd is tot benoeming van het bestuur. Indien de partij die bevoegd is tot benoeming van het bestuur naar
      aanleiding van de melding niet binnen een redelijke termijn, naar tevredenheid van de raad van toezicht, handelt,
      meldt de raad van toezicht het disfunctioneren van het bestuur aan De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.6
    text: De raad van toezicht stelt een profielschets op voor leden van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.7
    text: |-
      Het bestuur van het beroepspensioenfonds en de raad van toezicht komen ten minste tweemaal per kalenderjaar in
      vergadering bijeen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.8
    text: |-
      De visitatiecommissie heeft tot taak toezicht te houden op het beleid van het bestuur en op de algemene gang
      van zaken in het beroepspensioenfonds. De visitatiecommissie is ten minste belast met het toezien op adequate
      risicobeheersing en evenwichtige belangenafweging door het bestuur en legt verantwoording af over de uitvoering van
      de taken aan het verantwoordingsorgaan en in het bestuursverslag.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.9
    text: |-
      Het beroepspensioenfonds verstrekt desgevraagd aan de raad van toezicht of de visitatiecommissie tijdig alle
      inlichtingen en gegevens, die deze voor de vervulling van zijn taak redelijkerwijs nodig heeft. De inlichtingen
      worden desgevraagd schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110a.10
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld inzake dit artikel die onder
      meer betrekking hebben op de bevoegdheden van de raad van toezicht ten aanzien van benoeming en ontslag van
      bestuurders.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110a
  - number: 110b.1
    text: Ten minste twee natuurlijke personen bepalen het dagelijks beleid van een beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110b
  - number: 110b.2
    text: |-
      De personen die het beleid van een beroepspensioenfonds bepalen of mede bepalen richten zich bij de vervulling
      van hun taak naar de belangen van de bij het beroepspensioenfonds betrokken deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en de pensioengerechtigden en zorgen ervoor dat dezen zich door hen op evenwichtige wijze
      vertegenwoordigd kunnen voelen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110b
  - number: 110b.3
    text: |-
      Iedere bestuurder van een beroepspensioenfonds is bevoegd een deskundige te raadplegen, of zich krachtens een
      bestuursbesluit, waarbij ten minste één vierde van de bestuurders zich daarvoor heeft uitgesproken, ter vergadering
      door een deskundige te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110b
  - number: 110c.1
    text: |-
      Het beleid van een beroepspensioenfonds wordt bepaald of mede bepaald door personen die geschikt zijn in verband
      met de uitoefening van het bedrijf van het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.2
    text: |-
      Het intern toezicht van een beroepspensioenfonds door een visitatiecommissie wordt uitgeoefend door personen die
      geschikt zijn voor de uitoefening van dit toezicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.3
    text: |-
      De risicobeheerfunctie, interne auditfunctie en actuariële functie bij een beroepspensioenfonds worden uitgeoefend
      door personen die geschikt zijn voor de uitoefening van deze functies.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.4
    text: |-
      Het beleid van een beroepspensioenfonds wordt bepaald of mede bepaald door personen wier betrouwbaarheid
      buiten twijfel staat. Het intern toezicht van een beroepspensioenfonds door een visitatiecommissie en de
      risicobeheerfunctie, interne auditfunctie en actuariële functie bij een beroepspensioenfonds worden uitgeoefend
      door personen wier betrouwbaarheid buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.5
    text: |-
      Het bestuur van het beroepspensioenfonds meldt elke wijziging in de samenstelling van de personen die het beleid
      van het beroepspensioenfonds bepalen of mede bepalen vooraf aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.6
    text: 'Een wijziging als bedoeld in het vijfde lid wordt niet doorgevoerd indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.6.a
    text: |-
      de toezichthouder binnen zes weken na ontvangst van de melding van de wijziging aan het beroepspensioenfonds bekend
      maakt dat hij niet met de voorgenomen wijziging instemt; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.6.b
    text: |-
      de toezichthouder om nadere gegevens of inlichtingen heeft verzocht en binnen zes weken na ontvangst van die
      gegevens of inlichtingen aan het beroepspensioenfonds bekend maakt dat hij niet met de voorgenomen wijziging
      instemt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.7
    text: |-
      Indien zich een wijziging voordoet van de antecedenten die van invloed is op de betrouwbaarheid van de personen die
      het beleid van het beroepspensioenfonds bepalen of mede bepalen stelt het beroepspensioenfonds de toezichthouder
      daarvan onverwijld schriftelijk in kennis.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.8
    text: |-
      De betrouwbaarheid van een persoon staat buiten twijfel wanneer dat eenmaal door de toezichthouder voor de
      toepassing van deze wet is vastgesteld, zolang niet een wijziging in de relevante feiten of omstandigheden een
      redelijke aanleiding geeft tot een nieuwe beoordeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110c.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel. Die
      regels hebben onder meer betrekking op de misdrijven die, indien begaan door een persoon als bedoeld in het vierde
      lid, met het oog op de belangen die de wet beoogt te beschermen, tot de vaststelling leiden dat de betrouwbaarheid
      van die persoon niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110c
  - number: 110ca
    text: |-
      Bestuurders en leden van de raad van toezicht van een beroepspensioenfonds hebben voldoende tijd
      beschikbaar om hun functie naar behoren uit te oefenen. Bij algemene maatregel van bestuur worden nadere
      regels gesteld. De [artikelen 132a][ref1], [142a][ref2], [242a][ref3], [252a][ref4], [297a][ref5] en
      [297b van Boek 2 van het Burgerlijk Wetboek][ref6] zijn niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel132a
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel142a
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel242a
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel252a
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel297a
      [ref6]: https://wetten.overheid.nl/BWBR0003045#Artikel297b
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110ca
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: 132a
      - id: ref2
        bwb_id: BWBR0003045
        artikel: 142a
      - id: ref3
        bwb_id: BWBR0003045
        artikel: 242a
      - id: ref4
        bwb_id: BWBR0003045
        artikel: 252a
      - id: ref5
        bwb_id: BWBR0003045
        artikel: 297a
      - id: ref6
        bwb_id: BWBR0003045
        artikel: 297b
  - number: 110d.1
    text: Een beroepspensioenfonds stelt een verantwoordingsorgaan in.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.2
    text: |-
      In het verantwoordingsorgaan zijn de deelnemers en de pensioengerechtigden evenredig op basis van onderlinge
      getalsverhoudingen vertegenwoordigd. De leden van het verantwoordingsorgaan vormen een zo evenwichtig mogelijke
      afspiegeling van de betreffende geleding.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.3
    text: |-
      Op grond van door het bestuur van het beroepspensioenfonds vast te stellen criteria kunnen naast de in het
      tweede lid bedoelde vertegenwoordigers ook één of meer vertegenwoordigers van gewezen deelnemers in het
      verantwoordingsorgaan zitting hebben.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.4
    text: |-
      Het bestuur van het beroepspensioenfonds gaat over tot verkiezing van de leden van het verantwoordingsorgaan die de
      deelnemers, gewezen deelnemers en pensioengerechtigden vertegenwoordigen:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.4.a
    text: op eigen initiatief van het beroepspensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.4.b
    text: |-
      indien dit wordt verzocht door ten minste 1% van de deelnemers, gewezen deelnemers en pensioengerechtigden of door
      ten minste 500 deelnemers, gewezen deelnemers en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.5
    text: Het verantwoordingsorgaan heeft recht op overleg met het intern toezicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.6
    text: |-
      Het bestuur van het beroepspensioenfonds en het verantwoordingsorgaan komen ten minste tweemaal per kalenderjaar in
      vergadering bijeen. Tijdens deze vergaderingen worden de aangelegenheden aan de orde gesteld waarover het bestuur
      van het beroepspensioenfonds of het verantwoordingsorgaan overleg wenselijk acht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110d.7
    text: |-
      Het beroepspensioenfonds verstrekt desgevraagd aan het verantwoordingsorgaan tijdig alle inlichtingen en gegevens,
      die deze voor de vervulling van zijn taak redelijkerwijze nodig heeft. De inlichtingen worden desgevraagd
      schriftelijk verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110d
  - number: 110e.1
    text: |-
      Het bestuur van het beroepspensioenfonds legt verantwoording af aan het verantwoordingsorgaan over het beleid en de
      wijze waarop het is uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.2
    text: |-
      Het verantwoordingsorgaan heeft de bevoegdheid een oordeel te geven over het handelen van het bestuur aan de hand
      van het bestuursverslag, de jaarrekening en andere informatie, waaronder de bevindingen van het intern toezicht,
      over het door het bestuur uitgevoerde beleid, evenals over beleidskeuzes voor de toekomst. Dit oordeel wordt, samen
      met de reactie van het bestuur daarop, bekend gemaakt en in het bestuursverslag opgenomen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3
    text: 'Het beroepspensioenfonds stelt het verantwoordingsorgaan in de gelegenheid advies uit te brengen over:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.a
    text: het beleid inzake beloningen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.b
    text: de vorm en inrichting van het intern toezicht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.c
    text: de profielschets voor leden van de raad van toezicht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.d
    text: het vaststellen en wijzigen van een interne klachten- en geschillenprocedure;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.e
    text: het vaststellen en wijzigen van het communicatie- en voorlichtingsbeleid;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.f
    text: |-
      gehele of gedeeltelijke overdracht van de verplichtingen van het beroepspensioenfonds of de overname van
      verplichtingen door het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.g
    text: liquidatie, fusie of splitsing van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.h
    text: het sluiten, wijzigen of beëindigen van een uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.3.i
    text: |-
      het omzetten van het beroepspensioenfonds in een andere rechtsvorm, bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: 110e.3.j
    text: de samenstelling van de feitelijke premie en de hoogte van de premiecomponenten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.4
    text: |-
      Het verantwoordingsorgaan adviseert het bestuur naar aanleiding van de melding van disfunctioneren van het bestuur,
      bedoeld in [artikel 110a, vijfde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel110a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 110a
        hoofdstuk: '4'
  - number: 110e.5
    text: |-
      Het advies van het verantwoordingsorgaan wordt op een zodanig tijdstip gevraagd dat het van wezenlijke invloed kan
      zijn op de in het derde lid bedoelde besluiten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.6
    text: |-
      Bij het vragen van advies wordt aan het verantwoordingsorgaan een overzicht verstrekt van de beweegredenen
      voor het besluit en van de gevolgen die het besluit naar verwachting voor de deelnemers, gewezen deelnemers en
      pensioengerechtigden zal hebben.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.7
    text: |-
      Het beroepspensioenfonds deelt het verantwoordingsorgaan zo spoedig mogelijk schriftelijk mee, of het een
      advies niet of niet geheel volgt, waarbij tevens wordt meegedeeld waarom van het advies of van een daarin vervat
      minderheidsadvies wordt afgeweken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110e.8
    text: |-
      In de statuten van het beroepspensioenfonds kunnen aan het verantwoordingsorgaan verdere bevoegdheden dan de in
      deze wet genoemde worden toegekend.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110e
  - number: 110f
    text: 'Een beroepspensioenfonds informeert het verantwoordingsorgaan onverwijld schriftelijk over:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110f
  - number: 110f.a
    text: |-
      de verplichting tot opstelling van een herstelplan als bedoeld in [artikel 133][ref1] of [artikel 134][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel134
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '134'
        hoofdstuk: '5'
  - number: 110f.b
    text: |-
      de aanstelling van een bewindvoerder als bedoeld in [artikel 168][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel168
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '168'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 110f.c
    text: |-
      de beëindiging van de situatie, bedoeld in [artikel 167][ref1], waarin de bevoegdheiduitoefening van alle of
      bepaalde organen van een beroepspensioenfonds is gebonden aan toestemming van een of meer door de toezichthouder
      aangewezen personen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel167
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110f
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '167'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 110g.1
    text: |-
      Een beroepspensioenfonds staat de leden van het verantwoordingsorgaan het gebruik toe van de voorzieningen waarover
      het kan beschikken, voor zover dat redelijkerwijs voor de vervulling van hun taken nodig is.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110g
  - number: 110g.2
    text: |-
      Ten aanzien van de rechten en bevoegdheden van het verantwoordingsorgaan in verhouding tot het bestuur
      van het beroepspensioenfonds zijn de [artikelen 10][ref1], [16][ref2], [17][ref3], [18][ref4] en
      [22 van de Wet op de ondernemingsraden][ref5] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002747#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002747#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0002747#Artikel17
      [ref4]: https://wetten.overheid.nl/BWBR0002747#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002747#Artikel22
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110g
    references:
      - id: ref1
        bwb_id: BWBR0002747
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002747
        artikel: '16'
      - id: ref3
        bwb_id: BWBR0002747
        artikel: '17'
      - id: ref4
        bwb_id: BWBR0002747
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002747
        artikel: '22'
  - number: 110h
    text: |-
      In het bestuursverslag van een beroepspensioenfonds wordt gerapporteerd over de samenstelling naar leeftijd en
      geslacht van het verantwoordingsorgaan en het bestuur en over de inspanningen die zijn verricht om diversiteit in
      de organen van het beroepspensioenfonds te bevorderen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel110h
  - number: '111'
    text: |-
      Iedere bepaling die het lidmaatschap van het bestuur, de raad van toezicht, de visitatiecommissie of het
      verantwoordingsorgaan onmogelijk maakt op grond van het bereikt hebben van een bepaalde leeftijd is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel111
  - number: '112'
    text: |-
      Iedere bepaling die een goedkeuringsrecht inhoudt van een partij, die geen orgaan is van het beroepspensioenfonds,
      inzake een besluit of voorgenomen besluit van het beroepspensioenfonds is nietig, tenzij in deze wet anders is
      bepaald.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel112
  - number: '113.1'
    text: 'In de statuten van een beroepspensioenfonds worden in ieder geval bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.a
    text: het doel van het beroepspensioenfonds, waaronder een omschrijving van de werkingssfeer;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.b
    text: de bestemming van de middelen van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.c
    text: het beheer van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.d
    text: de inkomsten van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.e
    text: de belegging van de gelden;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.f
    text: de wijze waarop de bestuurders worden benoemd en ontslagen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.g
    text: de wijziging van de statuten;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.h
    text: |-
      de liquidatie van het beroepspensioenfonds, waaronder begrepen de verplichtingen van de liquidateuren en de
      bestemming van de bezittingen van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.i
    text: de wijze waarop het intern toezicht is georganiseerd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.j
    text: de wijze waarop de leden van de raad van toezicht dan wel de visitatiecommissie worden benoemd en ontslagen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113.1.k
    text: |-
      de toepassing van [artikel 110b, derde lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel110b
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 110b
        hoofdstuk: '4'
  - number: 113.1.l
    text: de wijze waarop de leden van het verantwoordingsorgaan worden benoemd en ontslagen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: '113.2'
    text: |-
      De omschrijving van de werkingssfeer, bedoeld in het eerste lid, onderdeel a, vindt plaats door het omschrijven van
      de activiteiten van de beroepsgroep.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113
  - number: 113a.1
    text: |-
      Voor omzetting van een beroepspensioenfonds in een andere rechtsvorm als bedoeld in
      [artikel 18 van Boek 2 van het Burgerlijk Wetboek][ref1] is een verklaring van geen bezwaar van de toezichthouder
      vereist. De toezichthouder verleent de verklaring indien hij van oordeel is dat de belangen van deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden, en de pensioengerechtigden voldoende gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel18
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113a
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '18'
  - number: 113a.2
    text: Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld terzake van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel113a
  - number: '114.1'
    text: |-
      Een beroepspensioenfonds verricht slechts activiteiten in verband met pensioen en werkzaamheden die daarmee verband
      houden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel114
  - number: '114.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ter zake van activiteiten die door
      beroepspensioenfondsen kunnen worden verricht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel114
  - number: '115.1'
    text: |-
      Een beroepspensioenfonds kan uitsluitend een vrijwillige pensioenregeling uitvoeren, indien dit een aanvulling op
      een door datzelfde beroepspensioenfonds uitgevoerde basispensioenregeling betreft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel115
  - number: '115.2'
    text: |-
      Een beroepspensioenfonds kan een fiscaal bovenmatige beroepspensioenregeling uitsluitend uitvoeren als vrijwillige
      pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel115
  - number: '115.3'
    text: |-
      Onder een fiscaal bovenmatige beroepspensioenregeling als bedoeld in het tweede lid wordt verstaan: een
      pensioenregeling die niet blijft binnen de begrenzingen die zijn opgenomen in de [hoofdstukken IIB][ref1] en
      [VIII van de Wet op de loonbelasting 1964][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002471#HoofdstukIIB
      [ref2]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0002471
        hoofdstuk: IIB
      - id: ref2
        bwb_id: BWBR0002471
        hoofdstuk: VIII
  - number: '115.4'
    text: |-
      Voor de toepassing van het derde lid zijn de [artikelen 3.18, vierde en vijfde lid][ref1], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref2] van overeenkomstige toepassing voor
      zover aan de beroepspensioenregeling wordt deelgenomen door deelnemers die niet worden aangemerkt als werknemer in
      de zin van de [Wet op de loonbelasting 1964][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0002471
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel115
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref3
        bwb_id: BWBR0002471
  - number: 115a.1
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de uitvoering van een nettopensioen door een
      beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel115a
  - number: 115a.2
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel115a
  - number: '116'
    text: |-
      Een vrijwillige pensioenregeling in de vorm van een uitkeringsregeling welke wordt uitgevoerd door een
      beroepspensioenfonds voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel116
  - number: 116.a
    text: |-
      de premie voor de vrijwillige pensioenregeling bedraagt in enig jaar niet meer dan een derde van de over dat jaar
      verschuldigde premie voor de basispensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel116
  - number: 116.b
    text: |-
      de premie voor de vrijwillige pensioenregeling is voor alle deelnemers gelijk of bedraagt voor alle deelnemers
      een gelijk percentage van de gerealiseerde omzet, het gerealiseerde inkomen of het gerealiseerde loon dan wel het
      gedeelte van de gerealiseerde omzet, het gerealiseerde inkomen of gerealiseerde loon dat voor de pensioenberekening
      in aanmerking wordt genomen, met dien verstande dat voor verschillende soorten pensioen en voor verschillende
      pensioenregelingen verschillende premies kunnen worden vastgesteld; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel116
  - number: 116.c
    text: |-
      de kosten verbonden aan het toeslagbeleid worden niet ten laste gebracht van de individuele deelnemers, maar ten
      laste van de collectiviteit van het beroepspensioenfonds en voor de toeslagverlening gelden dezelfde voorwaarden
      die van toepassing zijn op de basispensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel116
  - number: '117'
    text: |-
      Een vrijwillige pensioenregeling in de vorm van een kapitaalregeling welke wordt uitgevoerd door een
      beroepspensioenfonds voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel117
  - number: 117.a
    text: |-
      de premie voor de vrijwillige pensioenregeling bedraagt in enig jaar niet meer dan een derde van de over dat jaar
      verschuldigde premie voor de basispensioenregeling; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel117
  - number: 117.b
    text: |-
      indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het opgebouwde kapitaal
      omgezet in een pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering indien dat ook met
      betrekking tot de basispensioenregeling geschiedt of de basispensioenregeling een uitkeringsregeling betreft
      en zijn daarop overeenkomstige voorwaarden van toepassing als welke gelden bij de basispensioenregeling bij
      beëindiging van de deelneming door deze omstandigheden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel117
  - number: '118'
    text: |-
      Een vrijwillige pensioenregeling in de vorm van een premieregeling welke wordt uitgevoerd door een
      beroepspensioenfonds voldoet aan de volgende voorwaarden:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel118
  - number: 118.a
    text: |-
      de premie voor de vrijwillige pensioenregeling bedraagt in enig jaar niet meer dan een derde van de over dat jaar
      verschuldigde premie voor de basispensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel118
  - number: 118.b
    text: |-
      indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het kapitaal dat is
      ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde rendementen omgezet in een
      pensioenrecht of pensioenaanspraak in de vorm van een periodieke uitkering, indien dat ook met betrekking tot
      de basispensioenregeling geschiedt of de basispensioenregeling een uitkeringsregeling betreft en zijn daarop
      overeenkomstige voorwaarden van toepassing als welke gelden bij de basispensioenregeling bij beëindiging van de
      deelneming door deze omstandigheden; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel118
  - number: 118.c
    text: |-
      indien de deelnemer overlijdt dan wel gepensioneerde of gewezen deelnemer wordt, wordt het kapitaal dat is
      ontstaan uit de som van de beschikbaar gestelde premies en de daarop behaalde rendementen omgezet in een verzekerd
      kapitaal, indien dat ook met betrekking tot de basispensioenregeling geschiedt of de basispensioenregeling
      een kapitaalregeling betreft en zijn daarop overeenkomstige voorwaarden van toepassing als welke gelden bij de
      basispensioenregeling bij beëindiging van de deelneming door deze omstandigheden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel118
  - number: '119'
    text: |-
      Indien een beroepspensioenfonds meerdere beroepspensioenregelingen uitvoert vormen deze beroepspensioenregelingen
      financieel één geheel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel119
  - number: '120'
    text: |-
      Een beroepspensioenfonds kan de mogelijkheid bieden tot verhoging van de pensioenaanspraken indien het deel
      van de pensioenaanspraken dat voortvloeit uit deze inkoop overeenkomstig de pensioenaanspraken op grond van de
      basispensioenregeling wordt behandeld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel120
  - number: 120a.1
    text: |-
      Een beroepspensioenfonds draagt de eigendom van een pensioenvermogen slechts over aan een pensioenbewaarder nadat
      hij met deze een overeenkomst inzake het beheer en de bewaring van het pensioenvermogen heeft gesloten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel120a
  - number: 120a.2
    text: |-
      Het beroepspensioenfonds treft maatregelen opdat de pensioenbewaarder slechts met zijn medewerking over de
      bestanddelen van het pensioenvermogen zal beschikken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel120a
  - number: 120a.3
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de inhoud van de overeenkomst, bedoeld
      in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel120a
  - number: '121.1'
    text: |-
      Een beroepspensioenfonds stelt toereikende technische voorzieningen vast met betrekking tot het geheel van
      pensioenverplichtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel121
  - number: '121.2'
    text: 'De berekening wordt uitgevoerd met inachtneming van de volgende beginselen:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel121
  - number: 121.2.a
    text: de technische voorzieningen worden berekend op basis van marktwaardering;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel121
  - number: 121.2.b
    text: |-
      de voor de berekening van de technische voorzieningen gebruikte grondslagen inzake overlijden of
      arbeidsongeschiktheid en levensverwachting worden gebaseerd op prudente beginselen; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel121
  - number: 121.2.c
    text: |-
      de methode en de grondslag van de berekening van de technische voorzieningen blijven van boekjaar tot boekjaar
      ongewijzigd, tenzij wijzigingen daarin gerechtvaardigd zijn als gevolg van een verandering van de juridische,
      demografische of economische omstandigheden die aan de hypothesen ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel121
  - number: '121.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de wijze van berekening van het minimum
      bedrag van de technische voorzieningen, de daarbij in acht te nemen voorzichtigheidsmarges en kunnen regels worden
      gesteld over de frequentie waarmee de technische voorzieningen worden berekend.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel121
  - number: '122'
    text: Ouderdomspensioen wordt gefinancierd op basis van kapitaaldekking.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel122
  - number: '123.1'
    text: 'Een beroepspensioenfonds stelt een kostendekkende premie vast die bestaat uit:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel123
  - number: 123.1.a
    text: de premie die actuarieel benodigd is in verband met de aangroei van de pensioenverplichtingen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel123
  - number: 123.1.b
    text: |-
      de opslag die nodig is voor het bij de aangroei van de pensioenverplichtingen behorende vereist eigen vermogen als
      bedoeld in [artikel 127][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: 123.1.c
    text: |-
      de opslag die nodig is voor de bij de aangroei van de pensioenverplichtingen behorende uitvoeringskosten van het
      beroepspensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel123
  - number: 123.1.d
    text: |-
      de premie die actuarieel benodigd is ten behoeve van toeslagverlening indien gekozen is voor financiering op de
      wijze, bedoeld in [artikel 132, vierde lid, onderdeel a, b of d][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel132
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel123
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '132'
        hoofdstuk: '5'
  - number: '123.2'
    text: |-
      De kostendekkende premie kan worden gedempt met een voortschrijdend gemiddelde van de rente of met verwacht
      rendement.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel123
  - number: '123.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer het dempen van de kostendekkende premie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel123
  - number: '124.1'
    text: |-
      Een beroepspensioenfonds kan uitsluitend korting verlenen op de kostendekkende premie of de gedempte premie en kan
      uitsluitend terugstorten indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel124
  - number: 124.1.a
    text: |-
      gezien de beleidsdekkingsgraad ten aanzien van de pensioenverplichtingen wordt voldaan aan de
      [artikelen 121][ref1], [127][ref2] en [128][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel128
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '121'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '128'
        hoofdstuk: '5'
  - number: 124.1.b
    text: |-
      de voorwaardelijke toeslagen zowel met betrekking tot de voorgaande tien jaar zijn verleend als ook in de toekomst
      kunnen worden verleend; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel124
  - number: 124.1.c
    text: |-
      de korting op de pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1] in de voorgaande tien jaar
      gecompenseerd is.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel124
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: '124.2'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel124
  - number: '125'
    text: 'Een beroepspensioenfonds vermeldt in zijn jaarrekening en bestuursverslag:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel125
  - number: 125.a
    text: |-
      de hoogte van de totale kostendekkende premie, bedoeld in [artikel 123, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel123
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '123'
        hoofdstuk: '5'
  - number: 125.b
    text: |-
      de hoogte van de totale gedempte premie, bedoeld in [artikel 123, tweede lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel123
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel125
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '123'
        hoofdstuk: '5'
  - number: 125.c
    text: de hoogte van de totale feitelijke premie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel125
  - number: 125a
    text: |-
      Onverminderd [artikel 125][ref1] vermeldt een beroepspensioenfonds in zijn jaarrekening en bestuursverslag de
      samenstelling van de feitelijke premie en de hoogte van de premiecomponenten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel125
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel125a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '125'
        hoofdstuk: '5'
  - number: '126.1'
    text: 'Een beroepspensioenfonds beschikt over een minimaal vereist eigen vermogen, tenzij:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel126
  - number: 126.1.a
    text: een beroepspensioenfonds tot volledige overdracht of onderbrenging is overgegaan; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel126
  - number: 126.1.b
    text: |-
      de toezichthouder heeft ingestemd met het feit dat het beroepspensioenfonds daarom niet beschikt over een minimaal
      vereist eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel126
  - number: '126.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden de omvang en de samenstelling van het minimaal vereist eigen
      vermogen bepaald.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel126
  - number: '127.1'
    text: Een beroepspensioenfonds beschikt over een vereist eigen vermogen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel127
  - number: '127.2'
    text: |-
      Een beroepspensioenfonds stelt het vereist eigen vermogen zodanig vast dat met een zekerheid van 97½ procent wordt
      voorkomen dat het beroepspensioenfonds binnen een periode van één jaar over minder waarden beschikt dan de hoogte
      van de technische voorzieningen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel127
  - number: '127.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld inzake de berekening en de
      samenstelling van het vereist eigen vermogen, bedoeld in het eerste lid, en het bepaalde in het tweede lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel127
  - number: '128'
    text: |-
      De technische voorzieningen en de aan het beroepspensioenfonds verstrekte leningen worden volledig door waarden
      gedekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel128
  - number: 128a.1
    text: |-
      De beleidsdekkingsgraad van een beroepspensioenfonds is de gemiddelde dekkingsgraad van de 12 maanden voorafgaand
      aan het moment van vaststelling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel128a
  - number: 128a.2
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de
      beleidsdekkingsgraad en het moment van vaststelling van de beleidsdekkingsgraad.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel128a
  - number: 128b.1
    text: |-
      Een beroepspensioenfonds is verplicht om jaarlijks de hoogte van de reële dekkingsgraad van het
      beroepspensioenfonds aan de toezichthouder te melden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel128b
  - number: 128b.2
    text: Bij regeling van Onze Minister worden regels gesteld over de reële dekkingsgraad.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel128b
  - number: '129.1'
    text: 'Een beroepspensioenfonds kan verworven pensioenaanspraken en pensioenrechten uitsluitend verminderen indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel129
  - number: 129.1.a
    text: |-
      het beroepspensioenfonds gezien de beleidsdekkingsgraad niet voldoet aan de bij of krachtens [artikel 126][ref1]
      gestelde eisen ten aanzien van het minimaal vereist eigen vermogen of de bij of krachtens [artikel 127][ref2]
      gestelde eisen ten aanzien van het vereist eigen vermogen;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: 129.1.b
    text: |-
      het beroepspensioenfonds niet in staat is binnen een redelijke termijn te voldoen aan [artikel 126][ref1] of
      [artikel 127][ref2], zonder dat de belangen van deelnemers, gewezen deelnemers, pensioengerechtigden of andere
      aanspraakgerechtigden onevenredig worden geschaad; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: 129.1.c
    text: |-
      alle overige beschikbare sturingsmiddelen, met uitzondering van het beleggingsbeleid, zijn ingezet in het
      herstelplan, bedoeld in [artikel 133][ref1] of [artikel 134][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel134
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel129
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '134'
        hoofdstuk: '5'
  - number: '129.2'
    text: |-
      Een beroepspensioenfonds informeert de deelnemers, gewezen deelnemers en pensioengerechtigden onverwijld
      schriftelijk over het besluit tot vermindering van pensioenaanspraken en pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel129
  - number: '129.3'
    text: |-
      De vermindering, bedoeld in het eerste lid, kan op zijn vroegst drie maanden nadat de pensioengerechtigden
      hierover zijn geïnformeerd en een maand nadat de deelnemers, gewezen deelnemers en toezichthouder hierover zijn
      geïnformeerd, worden gerealiseerd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel129
  - number: '129.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel129
  - number: '130.1'
    text: |-
      Een beroepspensioenfonds voert een beleggingsbeleid dat in overeenstemming is met de prudent-person regel en met
      name gebaseerd is op de volgende uitgangspunten:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel130
  - number: 130.1.a
    text: de waarden worden belegd in het belang van aanspraak- en pensioengerechtigden; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel130
  - number: 130.1.b
    text: de beleggingen worden gewaardeerd op basis van marktwaardering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel130
  - number: '130.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden ter waarborging van het prudente beleggingsbeleid nadere
      regels gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel130
  - number: '130.3'
    text: |-
      De eisen die zijn opgenomen in het eerste lid, aanhef en onderdeel b, en de regels die op grond van het tweede
      lid worden gesteld ten aanzien van de diversificatie van waarden zijn niet van toepassing op beleggingen in
      staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel130
  - number: '130.4'
    text: |-
      Een beroepspensioenfonds vermeldt in zijn bestuursverslag op welke wijze in het beleggingsbeleid rekening wordt
      gehouden met milieu en klimaat, mensenrechten en sociale verhoudingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel130
  - number: '131.1'
    text: |-
      Een beroepspensioenfonds gaat geen leningen aan, tenzij de lening tijdelijk wordt aangegaan voor
      liquiditeitsdoelstellingen en treedt niet namens derde partijen op als garant.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel131
  - number: '131.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld ten aanzien van het eerste lid met
      betrekking tot de tijdelijkheid van de lening en de liquiditeitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel131
  - number: '132.1'
    text: Een beroepspensioenfonds stelt beleid vast met betrekking tot de voorwaardelijke toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: '132.2'
    text: 'Voor een beroepspensioenfonds geldt bij de voorwaardelijke toeslagverlening het volgende:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.2.a
    text: |-
      bij een beleidsdekkingsgraad onder een bij algemene maatregel van bestuur te bepalen niveau wordt geen toeslag
      verleend;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.2.b
    text: er wordt niet meer toeslag verleend dan naar verwachting in de toekomst te realiseren is; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.2.c
    text: |-
      incidentele toeslagverlening om in het verleden niet toegekende toeslag of in het verleden doorgevoerde
      vermindering van pensioenaanspraken en pensioenrechten te compenseren kan worden verleend indien die
      toeslagverlening geen gevolgen heeft voor de toeslagverlening in de toekomst overeenkomstig onderdeel b, de
      beleidsdekkingsgraad het niveau van het vereist eigen vermogen, bedoeld in [artikel 127][ref1], behoudt en in enig
      jaar ten hoogste een vijfde van het vermogen dat voor deze toeslagverlening beschikbaar is, wordt aangewend.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: '132.3'
    text: 'Het tweede lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.3.a
    text: een beroepspensioenfonds volledig verzekerd is bij een verzekeraar; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.3.b
    text: anderszins sprake is van bij of krachtens algemene maatregel van bestuur te bepalen bijzondere omstandigheden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: '132.4'
    text: 'Beroepspensioenfondsen kunnen de voorwaardelijke toeslagverlening financieren door:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.4.a
    text: het creëren van technische voorzieningen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.4.b
    text: het creëren van eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.4.c
    text: het putten uit het eigen vermogen boven het vereist eigen vermogen ten behoeve van de toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.4.d
    text: het hanteren van een opslag op de premie; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: 132.4.e
    text: overrendement.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: '132.5'
    text: Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel132
  - number: '133.1'
    text: |-
      Wanneer de beleidsdekkingsgraad van een beroepspensioenfonds per het einde van een kalenderkwartaal is komen te
      liggen onder de bij of krachtens [artikel 127][ref1] gestelde eisen ten aanzien van het vereist eigen vermogen,
      meldt het beroepspensioenfonds dit onverwijld aan de toezichthouder. Wanneer de beleidsdekkingsgraad van een
      beroepspensioenfonds, waarvan het minimaal vereist eigen vermogen hoger is dan het vereist eigen vermogen, per
      het einde van een kalenderkwartaal is komen te liggen onder de bij of krachtens [artikel 126][ref2] gestelde
      eisen ten aanzien van het minimaal vereist eigen vermogen, meldt het beroepspensioenfonds dit onverwijld aan de
      toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel126
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
  - number: '133.2'
    text: |-
      In de in de eerste zin van het eerste lid bedoelde situatie dient het beroepspensioenfonds binnen drie maanden
      of zoveel eerder als de toezichthouder bepaalt ter instemming bij de toezichthouder een concreet en haalbaar
      herstelplan in, tenzij het beroepspensioenfonds gezien de beleidsdekkingsgraad op dat moment weer voldoet aan
      [artikel 127][ref1]. In het herstelplan werkt het beroepspensioenfonds uit hoe het uiterlijk binnen tien jaar zal
      voldoen aan artikel 127.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: '133.3'
    text: |-
      In afwijking van het tweede lid kan de toezichthouder, in verband met de specifieke situatie van het
      beroepspensioenfonds en in het belang van de aanspraak- en pensioengerechtigden, bepalen dat voor het herstelplan
      een kortere termijn geldt dan tien jaar.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
  - number: '133.4'
    text: |-
      Een beroepspensioenfonds dat bijdragen ontvangt van een in een andere lidstaat gevestigde zelfstandige of
      beroepsgenoot en een beleidsdekkingsgraad heeft die ligt onder de bij of krachtens [artikel 126][ref1] gestelde
      eisen ten aanzien van het minimaal vereist eigen vermogen werkt in het herstelplan tevens uit hoe het binnen een
      jaar zal voldoen aan artikel 126.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel126
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
  - number: '133.5'
    text: |-
      Het herstelplan vertoont een in beginsel tijdsevenredig herstel. In afwijking hiervan kan het herstelplan een meer
      dan tijdsevenredig herstel vertonen in de eerste helft van de looptijd van het herstelplan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
  - number: '133.6'
    text: |-
      Het herstelplan gaat uiterlijk zes maanden nadat de beleidsdekkingsgraad is komen te liggen onder de bij of
      krachtens [artikel 127][ref1] gestelde eisen in. Het beroepspensioenfonds handelt onverwijld overeenkomstig het
      herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: '133.7'
    text: |-
      Het beroepspensioenfonds stelt jaarlijks de beleidsdekkingsgraad vast op het moment waarop een situatie als
      bedoeld in het eerste lid is vastgesteld. Zo nodig in afwijking van de vorige zin kan het beroepspensioenfonds
      de beleidsdekkingsgraad jaarlijks vaststellen per het einde van het vierde kalenderkwartaal, door de eerste
      vaststelling van de beleidsdekkingsgraad na het moment waarop een situatie als bedoeld in het eerste lid, is
      vastgesteld te vervroegen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
  - number: '133.8'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel die
      onder meer betrekking hebben op de periode tot het herstelplan ingaat.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel133
  - number: '134.1'
    text: |-
      Wanneer de beleidsdekkingsgraad die op grond van [artikel 133, zevende lid][ref1], is vastgesteld ligt onder
      de bij of krachtens [artikel 127][ref2] gestelde eisen ten aanzien van het vereist eigen vermogen, dient het
      beroepspensioenfonds binnen drie maanden of zoveel eerder als de toezichthouder bepaalt ter instemming bij de
      toezichthouder een concreet en haalbaar geactualiseerd herstelplan in.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: '134.2'
    text: |-
      In het in het eerste lid bedoelde herstelplan werkt het beroepspensioenfonds uit hoe het in dezelfde termijn als
      de termijn die het beroepspensioenfonds bij het herstelplan op grond van [artikel 133, tweede lid][ref1], heeft
      gebruikt, zal voldoen aan [artikel 127][ref2]. Het beroepspensioenfonds kan, rekening houdend met de specifieke
      situatie van het beroepspensioenfonds en in het belang van aanspraak- en pensioengerechtigden, een andere termijn
      hanteren voor het geactualiseerd herstelplan indien de toezichthouder daarmee instemt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
  - number: '134.3'
    text: |-
      [Artikel 133, vierde tot en met achtste lid][ref1], is van toepassing op de geactualiseerde herstelplannen. Op het
      moment dat het geactualiseerde herstelplan ingaat vervangt dit een eerder vastgesteld herstelplan of geactualiseerd
      herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel134
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
  - number: '134.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel134
  - number: '135.1'
    text: |-
      Indien de beleidsdekkingsgraad in een situatie als bedoeld in [artikel 133, eerste lid][ref1], of vastgesteld
      op grond van artikel 133, zevende lid, zes maal opeenvolgend ligt onder de bij of krachtens [artikel 126][ref2]
      gestelde eisen ten aanzien van het minimaal vereist eigen vermogen en de dekkingsgraad bij die laatste vaststelling
      ook onder dat niveau ligt neemt het beroepspensioenfonds binnen zes maanden maatregelen waardoor de dekkingsgraad
      van het beroepspensioenfonds direct voldoet aan artikel 126. Voor zover het bij de maatregelen vermindering
      van pensioenaanspraken en pensioenrechten betreft worden deze direct in de technische voorzieningen verwerkt en
      ofwel direct doorgevoerd, ofwel in beginsel evenredig gespreid in de tijd gedurende maximaal de termijn die wordt
      gebruikt voor het herstelplan dat is opgesteld na constatering van de situatie, bedoeld in de eerste zin.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel126
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
  - number: '135.2'
    text: |-
      Voor een beroepspensioenfonds dat bijdragen ontvangt van een in een andere lidstaat gevestigde zelfstandige of
      beroepsgenoot geldt in plaats van het in het eerste lid genoemde aantal van zes een aantal van twee.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel135
  - number: '135.3'
    text: |-
      Indien een beroepspensioenfonds in de situatie, bedoeld in het eerste lid, maatregelen heeft genomen waardoor de
      dekkingsgraad direct voldoet aan [artikel 126][ref1], begint voor de volgende toepassing van het eerste lid een
      nieuwe termijn. Indien een beroepspensioenfonds in de situatie, bedoeld in het eerste lid, geen maatregelen heeft
      genomen omdat bij de laatste vaststelling van de beleidsdekkingsgraad de dekkingsgraad niet onder het minimaal
      vereist eigen vermogen lag, is het eerste lid van overeenkomstige toepassing bij iedere volgende vaststelling van
      de beleidsdekkingsgraad op grond van [artikel 133, zevende lid][ref2], totdat de beleidsdekkingsgraad ligt op of
      boven het niveau van het minimaal vereist eigen vermogen of de beleidsdekkingsgraad en de dekkingsgraad liggen
      onder dat niveau.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel133
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel135
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
  - number: '135.4'
    text: Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel135
  - number: '136.1'
    text: |-
      De toezichthouder kan, rekening houdend met de specifieke situatie van het beroepspensioenfonds en in
      het belang van de aanspraak- en pensioengerechtigden, op aanvraag van een beroepspensioenfonds geheel
      of gedeeltelijk ontheffing verlenen van het bij of krachtens de [artikelen 126][ref1], [127][ref2],
      [129, eerste lid, onderdeel a][ref3], [132][ref4], [133][ref5], [134][ref6] en [135][ref7] bepaalde, indien het
      beroepspensioenfonds aantoont dat daaraan redelijkerwijs niet kan worden voldaan en dat de doeleinden die deze
      artikelen beogen te bereiken anderszins worden bereikt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel126
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel129
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel132
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel134
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel135
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '132'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '134'
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0018831
        artikel: '135'
        hoofdstuk: '5'
  - number: '136.2'
    text: |-
      In afwijking van het eerste lid kan de toezichthouder geen ontheffing verlenen van [artikel 133, vierde lid][ref1],
      en [artikel 135, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel135
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel136
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '135'
        hoofdstuk: '5'
  - number: '136.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld waaraan de houder van een ontheffing
      dient te voldoen en met betrekking tot het verlenen van de ontheffing.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel136
  - number: '137'
    text: |-
      Bij regeling van Onze Minister, na overleg met de toezichthouder, kan vrijstelling worden verleend van de in
      [artikel 133][ref1] genoemde termijn van tien jaar en het in [artikel 135][ref2] genoemde aantal van zes, indien
      er sprake is van een uitzonderlijke economische situatie waardoor een groot aantal beroepspensioenfondsen niet
      kan voldoen aan de bij of krachtens deze wet gestelde vereisten inzake het vereist eigen vermogen en het minimaal
      vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel135
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel137
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '135'
        hoofdstuk: '5'
  - number: '138.1'
    text: |-
      Een beroepspensioenfonds richt zijn organisatie zodanig in dat deze een beheerste en integere bedrijfsvoering
      waarborgt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: '138.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot het eerste lid. De regels
      hebben in ieder geval betrekking op:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: 138.2.a
    text: het beheersen van bedrijfsprocessen en bedrijfrisico’s;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: 138.2.b
    text: integriteit;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: 138.2.c
    text: 'de soliditeit van het beroepspensioenfonds, waaronder wordt verstaan:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: 138.2.c.1°
    text: het beheersen van financiële risico’s; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: 138.2.c.2°
    text: het beheersen van andere risico’s die de soliditeit van het beroepspensioenfonds kunnen aantasten;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: 138.2.d
    text: het beheersen van de financiële positie over de lange termijn door periodiek een haalbaarheidstoets te maken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138
  - number: 138a.1
    text: Een beroepspensioenfonds beschikt over een risicobeheerfunctie, interne auditfunctie en actuariële functie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138a
  - number: 138a.2
    text: |-
      De houders van de risicobeheerfunctie, interne auditfunctie of actuariële functie rapporteren materiële
      bevindingen en aanbevelingen op het gebied dat onder hun verantwoordelijkheid valt aan het bestuur van het
      beroepspensioenfonds. Indien de houder van de risicobeheerfunctie, interne auditfunctie of actuariële functie
      tevens bestuurder is van het beroepspensioenfonds worden de materiële bevindingen en aanbevelingen ook
      gerapporteerd aan de raad van toezicht of de visitatiecommissie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138a
  - number: 138a.3
    text: |-
      De houders van de risicobeheerfunctie, interne auditfunctie of actuariële functie melden het de toezichthouder
      zo spoedig mogelijk indien het bestuur van het beroepspensioenfonds niet tijdig passende corrigerende maatregelen
      treft, nadat het bestuur op grond van het tweede lid op de hoogte is gesteld van:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138a
  - number: 138a.3.a
    text: |-
      een substantieel risico dat het beroepspensioenfonds niet aan een bij of krachtens de wet gesteld vereiste van
      significante betekenis zal voldoen en dit ernstige gevolgen kan hebben voor de belangen van deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden of pensioengerechtigden; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138a
  - number: 138a.3.b
    text: |-
      een significante inbreuk op de voor het beroepspensioenfonds en haar activiteiten geldende bij of krachtens de wet
      gestelde vereisten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138a
  - number: 138a.4
    text: |-
      Het beroepspensioenfonds draagt er zorg voor dat de houder van de risicobeheerfunctie, interne auditfunctie of
      actuariële functie die op grond van het derde lid te goeder trouw en naar behoren een melding heeft gedaan bij de
      toezichthouder als gevolg van deze melding niet wordt benadeeld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138a
  - number: 138a.5
    text: Bij algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138a
  - number: 138b
    text: De toezichthouder kan een beroepspensioenfonds de verplichting opleggen om een stresstest uit te voeren.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel138b
  - number: '139.1'
    text: |-
      Bij algemene maatregel van bestuur worden, ten behoeve van de berekeningen, bedoeld bij de [artikelen 121][ref1],
      [123][ref2], [132][ref3], [133][ref4], [134][ref5], [135][ref6] en [138][ref7], regels gesteld over:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel121
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel123
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel132
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel134
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel135
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel138
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '121'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '123'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '132'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '134'
        hoofdstuk: '5'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '135'
        hoofdstuk: '5'
      - id: ref7
        bwb_id: BWBR0018831
        artikel: '138'
        hoofdstuk: '5'
  - number: 139.1.a
    text: het minimale percentage van het gemiddelde loon- of prijsindexcijfer;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: 139.1.b
    text: het maximaal te hanteren gemiddelde rendement op vastrentende waarden;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: 139.1.c
    text: de maximaal te hanteren risicopremies op onder andere aandelen en onroerend goed; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: 139.1.d
    text: een uniforme set met economische scenario’s.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: '139.2'
    text: |-
      De in het eerste lid bedoelde regels worden uiterlijk iedere vijf jaren getoetst, rekening houdend met financieel-
      economische ontwikkelingen in het verleden en realistische inzichten ten aanzien van toekomstige financieel-
      economische verwachtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: '139.3'
    text: |-
      Voordat de voordracht van de in het eerste lid bedoelde algemene maatregel van bestuur wordt gedaan vraagt Onze
      Minister het oordeel van een commissie bestaande uit onafhankelijke leden die door Onze Minister worden aangewezen,
      waaronder een voorzitter. Daarbij wordt tevens het oordeel van de commissie gevraagd over de technische uitwerking
      van de grondslagen voor de waardering van pensioenverplichtingen met een lange termijn.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: '139.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het derde lid
      bedoelde commissie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: '139.5'
    text: |-
      De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel139
  - number: '140.1'
    text: |-
      Het beroepspensioenfonds stelt een actuariële en bedrijfstechnische nota vast waarin in elk geval een omschrijving
      is opgenomen van de wijze waarop uitvoering wordt gegeven aan het bij of krachtens de [artikelen 35][ref1], 121
      tot en met 132 en [138][ref2] bepaalde. Daarbij wordt de samenstelling van de feitelijke premie en de hoogte
      van de premiecomponenten opgenomen. De actuariële en bedrijfstechnische nota bevat voorts een verklaring inzake
      beleggingsbeginselen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel138
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '138'
        hoofdstuk: '5'
  - number: '140.2'
    text: 'De actuariële en bedrijfstechnische nota van een beroepspensioenfonds bevat verder:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
  - number: 140.2.a
    text: |-
      een financieel crisisplan waarin het beroepspensioenfonds beschrijft welke maatregelen ingezet kunnen worden in
      de situatie dat niet aan de vereisten gesteld bij of krachtens [artikel 127][ref1] zal worden voldaan en welke
      maatregelen ingezet kunnen worden in de situatie, bedoeld in [artikel 135, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel127
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel135
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '127'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '135'
        hoofdstuk: '5'
  - number: 140.2.b
    text: |-
      het niveau van de beleidsdekkingsgraad vanaf welke premiekortingen en terugstortingen als bedoeld in
      [artikel 124][ref1] zijn toegestaan; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel124
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '124'
        hoofdstuk: '5'
  - number: 140.2.c
    text: een beschrijving van de overige sturingsmiddelen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
  - number: '140.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld ten aanzien van de actuariële en
      bedrijfstechnische nota.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
  - number: '140.4'
    text: |-
      Voorzover risico’s zijn overgedragen, verzekerd of ondergebracht kan de omschrijving, bedoeld in het eerste lid,
      beperkt blijven tot een verwijzing naar hetgeen daarover in de betreffende overeenkomsten is opgenomen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
  - number: '140.5'
    text: |-
      De verklaring inzake beleggingsbeginselen wordt om de drie jaren en voorts onverwijld na iedere belangrijke
      wijziging van het beleggingsbeleid herzien.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel140
  - number: '141'
    text: |-
      Een beroepspensioenfonds met zetel in Nederland stelt binnen zes maanden na afloop van het boekjaar de jaarrekening
      en het bestuursverslag overeenkomstig [titel 9, Boek 2 van het Burgerlijk Wetboek][ref1] vast, met dien verstande
      dat [artikel 390 van genoemd wetboek][ref2] niet van toepassing is en dat de in [artikel 360, derde lid][ref3],
      [396][ref4] en [397 van genoemd wetboek][ref5] geformuleerde uitzonderingen niet van toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0003045
      [ref2]: https://wetten.overheid.nl/BWBR0003045#Artikel390
      [ref3]: https://wetten.overheid.nl/BWBR0003045#Artikel360
      [ref4]: https://wetten.overheid.nl/BWBR0003045#Artikel396
      [ref5]: https://wetten.overheid.nl/BWBR0003045#Artikel397
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel141
    references:
      - id: ref1
        bwb_id: BWBR0003045
      - id: ref2
        bwb_id: BWBR0003045
        artikel: '390'
      - id: ref3
        bwb_id: BWBR0003045
        artikel: '360'
      - id: ref4
        bwb_id: BWBR0003045
        artikel: '396'
      - id: ref5
        bwb_id: BWBR0003045
        artikel: '397'
  - number: '142.1'
    text: Een beroepspensioenfonds doet het boekjaar gelijk lopen met het kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: '142.2'
    text: |-
      Een beroepspensioenfonds verstrekt periodiek binnen de daartoe vastgestelde termijnen staten aan de toezichthouder
      die de toezichthouder nodig heeft voor de juiste uitoefening van zijn taak, bedoeld in [artikel 146][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel146
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '146'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '142.3'
    text: 'De staten omvatten uitsluitend:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.a
    text: informatie over de organisatie van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.b
    text: een bestuursverslag;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.c
    text: een balans;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.d
    text: informatie over financiële relaties en transacties van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.e
    text: een rekening van baten en lasten;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.f
    text: informatie inzake de dekkingsgraad, de beleidsdekkingsgraad en de reële dekkingsgraad;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.g
    text: informatie inzake het vereist eigen vermogen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.h
    text: |-
      actuariële staten, gewaarmerkt door een bevoegde actuaris, waaronder een actuarieel verslag voorzien van een
      verklaring van een actuaris;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.i
    text: informatie over het deelnemersbestand;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.j
    text: |-
      informatie inzake de uitgevoerde beroepspensioenregeling en eventueel andere door het beroepspensioenfonds
      uitgevoerde regelingen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.k
    text: premiegegevens;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.l
    text: informatie inzake verzekering;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.m
    text: informatie inzake verplichtingen van het beroepspensioenfonds voor risico van de deelnemers;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.n
    text: informatie over het herstelplan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.o
    text: informatie over de haalbaarheidstoets;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.p
    text: informatie over toeslagverlening; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.3.q
    text: informatie over vermindering van pensioenaanspraken en pensioenrechten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: '142.4'
    text: |-
      Met zijn verklaring bedoeld in het derde lid, onderdeel h, bevestigt de actuaris dat hij zich ervan heeft overtuigd
      dat voldaan is aan de artikelen 121 tot en met 135. Hij is bevoegd zijn verklaring nader toe te lichten of op enig
      punt een voorbehoud te maken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: '142.5'
    text: |-
      De staten zijn periodiek voorzien van een verklaring omtrent de getrouwheid, afgegeven door een accountant. Ten
      bewijze dat de staten door hem zijn onderzocht, waarmerkt de accountant de staten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: '142.6'
    text: 'Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.6.a
    text: de inhoud en de modellen van de staten; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: 142.6.b
    text: de wijze, de periodiciteit en de termijnen van de verstrekking.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel142
  - number: '143.1'
    text: |-
      De bevoegde actuaris die het actuarieel verslag waarmerkt, is onafhankelijk van het beroepspensioenfonds en
      verricht geen andere werkzaamheden voor het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel143
  - number: '143.2'
    text: |-
      Het is de waarmerkende actuaris niet toegestaan de werkzaamheden, bedoeld in [artikel 142, vierde lid][ref1], uit
      te oefenen voor een beroepspensioenfonds wanneer een andere actuaris of andere deskundige die behoort tot dezelfde
      organisatie als de waarmerkende actuaris, andere werkzaamheden verricht voor hetzelfde beroepspensioenfonds, tenzij
      de organisatie van de waarmerkende actuaris een door de toezichthouder goedgekeurde gedragscode heeft over de
      onafhankelijkheid van de waarmerkende actuaris.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel143
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '142'
        hoofdstuk: '5'
  - number: '143.3'
    text: |-
      In afwijking van het eerste lid kan de waarmerkende actuaris andere werkzaamheden voor het beroepspensioenfonds
      verrichten, voor zover het gaat om werkzaamheden van de actuariële functie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel143
  - number: 143a
    text: |-
      Een beroepspensioenfonds kan niet overgaan tot verzekering bij een verzekeraar indien de verzekering gebaseerd
      is op een kapitaalcontract. Een kapitaalcontract is een overeenkomst tussen een beroepspensioenfonds en een
      verzekeraar waarbij geldt dat:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel143a
  - number: 143a.a
    text: risico’s van het beroepspensioenfonds gedurende de contractsperiode worden verzekerd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel143a
  - number: 143a.b
    text: |-
      de daarbij behorende pensioenaanspraken en pensioenrechten na afloop van de contractsperiode niet op verzoek van
      het beroepspensioenfonds premievrij bij de verzekeraar achter kunnen worden gelaten; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel143a
  - number: 143a.c
    text: |-
      de waarden die behoren bij het ouderdomspensioen of nabestaandenpensioen op kapitaalbasis gedurende de
      contractsperiode geheel of gedeeltelijk in juridisch eigendom van de verzekeraar zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel143a
  - number: '144'
    text: |-
      De toezichthouder kan een beroepspensioenfonds de verplichting opleggen om binnen een door de toezichthouder te
      stellen termijn over te gaan tot verzekering bij een verzekeraar, overdracht aan een verzekeraar of onderbrenging
      bij een beroepspensioenfonds indien dit naar het oordeel van de toezichthouder noodzakelijk is in verband met:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel144
  - number: 144.a
    text: de actuariële en bedrijfstechnische opzet van het beroepspensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel144
  - number: 144.b
    text: de deskundigheid en betrouwbaarheid van het bestuur.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel144
  - number: '145'
    text: |-
      Wanneer een beroepspensioenregeling eindigt en er geen sprake meer is van verwerving van pensioen tijdens
      een periode waarin de beleidsdekkingsgraad van het beroepspensioenfonds ligt onder de bij of krachtens
      [artikel 126][ref1] gestelde eisen ten aanzien van het minimaal vereist eigen vermogen:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel126
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel145
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
  - number: 145.a
    text: stelt het beroepspensioenfonds de toezichthouder hiervan op de hoogte;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel145
  - number: 145.b
    text: |-
      gaat het beroepspensioenfonds binnen een door de toezichthouder te stellen termijn over tot het verzekeren
      bij een verzekeraar, overdragen aan een verzekeraar of onderbrengen bij een beroepspensioenfonds van de
      pensioenverplichtingen op basis van een procedure welke ter kennis en instemming van de toezichthouder wordt
      gebracht; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel145
  - number: 145.c
    text: |-
      stelt het beroepspensioenfonds een algemeen overzicht van de procedure, bedoeld in onderdeel b, beschikbaar voor
      de deelnemers, gewezen deelnemers en pensioengerechtigden of de vertegenwoordigers van de genoemde personen in
      overeenstemming met het vertrouwelijkheidbeginsel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel145
  - number: '146.1'
    text: De Stichting Autoriteit Financiële Markten is belast met het gedragstoezicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: '146.2'
    text: |-
      Gedragstoezicht is toezicht gericht op de naleving van de normen ten aanzien van voorlichting door
      pensioenuitvoerders aan deelnemers, gewezen deelnemers, gewezen partners en pensioengerechtigden en de normen
      ten aanzien van de advisering van de deelnemer of gewezen deelnemer bij de uitvoering van premieregelingen met
      beleggingsvrijheid waarbij de deelnemer of gewezen deelnemer de verantwoordelijkheid voor de beleggingen heeft
      overgenomen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: '146.3'
    text: De Nederlandsche Bank N.V. is belast met het prudentieel toezicht en het materieel toezicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: '146.4'
    text: |-
      Prudentieel toezicht is toezicht gericht op de normen ten aanzien van de financiële soliditeit van
      beroepspensioenfondsen, het bijdragen aan de financiële stabiliteit van de sector van beroepspensioenfondsen en het
      beschermen van de rechten van deelnemers, gewezen deelnemers, andere aanspraakgerechtigden en pensioengerechtigden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: '146.5'
    text: |-
      Materieel toezicht is toezicht gericht op alle normen in deze wet die geen onderdeel uitmaken van gedrags- of
      prudentieel toezicht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: '146.6'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn de bij besluit van de
      toezichthouder aangewezen personen belast. Van een besluit als bedoeld in de eerste volzin wordt mededeling gedaan
      door plaatsing in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: '146.7'
    text: 'Bij algemene maatregel van bestuur:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: 146.7.a
    text: |-
      worden regels gesteld omtrent de toedeling van de taken en bevoegdheden met betrekking tot het prudentieel
      toezicht, het gedragstoezicht en het materieel toezicht van deze wet aan de toezichthouders;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: 146.7.b
    text: worden regels gesteld over de wijze waarop de toezichthouders samenwerken; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: 146.7.c
    text: |-
      worden eisen gesteld aan de toezichthouders, waaronder voorschriften gericht op een zodanige besluitvorming binnen
      de toezichthouder dat een onafhankelijke vervulling van de uit deze wet voortvloeiende taken en bevoegdheden is
      gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel146
  - number: '147.1'
    text: |-
      De toezichthouder treedt bij de uitoefening van het toezicht op de naleving van deze wet niet in de beoordeling van
      de individuele rechtsverhouding tussen:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel147
  - number: 147.1.a
    text: een pensioenuitvoerder en een beroepspensioenvereniging;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel147
  - number: 147.1.b
    text: een pensioenuitvoerder en een beroepsgenoot; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel147
  - number: 147.1.c
    text: een pensioenuitvoerder en een aanspraak- of pensioengerechtigde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel147
  - number: '147.2'
    text: Het eerste lid is niet van toepassing op de uitvoeringsovereenkomst en het pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel147
  - number: '148.1'
    text: |-
      In aanvulling op [artikel 19, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1] draagt de
      toezichthouder met betrekking tot de uitoefening van zijn taken en bevoegdheden uit hoofde van deze wet zorg voor
      een voor de onder toezicht staanden kenbare, transparante en consistente uitvoering.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel19
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel148
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '19'
  - number: '148.2'
    text: De toezichthouder hanteert bij de uitoefening van zijn taak een vooruitziende en risicogebaseerde benadering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel148
  - number: '148.3'
    text: |-
      De toezichthouder neemt bij de uitoefening van zijn taak de gevolgen in overweging die zijn besluiten, met name in
      noodsituaties, kunnen hebben voor de stabiliteit van het financiële stelsel van alle andere betrokken lidstaten,
      uitgaande van de op het desbetreffende tijdstip beschikbare informatie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel148
  - number: '148.4'
    text: Het toezicht omvat een passende combinatie van werkzaamheden op afstand en controles ter plaatse.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel148
  - number: '158'
    text: 'Onze Minister houdt toezicht op:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel158
  - number: 158.a
    text: de rechtmatigheid van de uitvoering van deze wet door de toezichthouder;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel158
  - number: 158.b
    text: de doeltreffendheid van de uitvoering van deze wet door de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel158
  - number: '159.1'
    text: |-
      Indien Onze Minister de toezichthouder gegevens of inlichtingen vraagt die naar zijn oordeel nodig zijn voor een
      onderzoek naar de wijze waarop de toezichthouder de uit deze wet voortvloeiende taken en bevoegdheden uitvoert of
      heeft uitgevoerd, geschiedt de verstrekking daarvan met inachtneming van dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel159
  - number: '159.2'
    text: |-
      De toezichthouder verstrekt kosteloos aan Onze Minister de in het eerste lid bedoelde gegevens of inlichtingen.
      Indien Onze Minister de toezichthouder vraagt bepaalde gegevens of inlichtingen te verstrekken die op grond van
      deze wet omtrent afzonderlijke pensioenuitvoerders, werkgevers of natuurlijke personen zijn verstrekt of zijn
      verkregen, is de toezichthouder niet verplicht deze gegevens of inlichtingen te verstrekken, indien deze betrekking
      hebben op of herleidbaar zijn tot een afzonderlijke pensioenuitvoerder, werkgever of natuurlijke persoon, met
      uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar zijn tot een pensioenuitvoerder
      of werkgever ten aanzien waarvan surséance van betaling is verleend, die in staat van faillissement is verklaard of
      op grond van een rechterlijke uitspraak is ontbonden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel159
  - number: '159.3'
    text: |-
      Onze Minister kan een derde opdragen de gegevens of inlichtingen die hem ingevolge het tweede lid zijn verstrekt
      te onderzoeken en aan hem verslag uit te brengen. Tevens kan Onze Minister de derde die in zijn opdracht
      handelt, machtigen namens hem gegevens of inlichtingen in te winnen, in welk geval het eerste en tweede lid van
      overeenkomstige toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel159
  - number: '159.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij ingevolge het tweede of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over de toereikendheid van deze wet of de wijze waarop de
      toezichthouder de bij of krachtens deze wet opgedragen taken en toegekende bevoegdheden uitoefent of heeft
      uitgeoefend.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel159
  - number: '159.5'
    text: |-
      Onze Minister en degenen die in zijn opdracht handelen zijn verplicht tot geheimhouding van de op grond van het
      tweede lid, tweede volzin, ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel159
  - number: '159.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      uit het onderzoek openbaar maken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel159
  - number: '159.7'
    text: |-
      De Wet openbaarheid van bestuur en de Wet Nationale ombudsman zijn niet van toepassing met betrekking tot de in dit
      artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht werkende derde onder zich heeft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel159
  - number: '160.1'
    text: |-
      Onze Minister kan aan de toezichthouder een aanwijzing geven over de uitoefening van de aan de toezichthouder bij
      of krachtens deze wet opgedragen taken en toegekende bevoegdheden wanneer de toezichthouder hierin naar het oordeel
      van Onze Minister tekort schiet. Onze Minister treedt daarbij niet in individuele gevallen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel160
  - number: '160.2'
    text: De toezichthouder is gehouden overeenkomstig de aanwijzing te handelen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel160
  - number: '161'
    text: |-
      De bevoegdheid om de noodzakelijke voorzieningen te treffen, genoemd in
      [artikel 23, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], alsmede de verplichtingen, genoemd
      in artikel 23, tweede en derde lid, van de Kaderwet zelfstandige bestuursorganen, worden ten aanzien van ernstige
      verwaarlozing door de toezichthouder van de bij of krachtens deze wet opgedragen taken uitgeoefend dan wel
      uitgevoerd door Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel23
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel161
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '23'
  - number: 161a.1
    text: |-
      Onze Minister kan beleidsregels vaststellen ten aanzien van de toepassing door de toezichthouders van
      [Hoofdstuk 6][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel161a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        hoofdstuk: '6'
  - number: 161a.2
    text: De beleidsregels worden in de Staatscourant bekendgemaakt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel161a
  - number: '162'
    text: |-
      De pensioenuitvoerder, de beroepspensioenvereniging, de accountant en de actuaris verstrekken aan de toezichthouder
      kosteloos de door deze gevorderde inlichtingen, gegevens en bescheiden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel162
  - number: '163.1'
    text: De toezichthouder kan ten behoeve van het toezicht op de naleving van deze wet van een ieder inlichtingen vorderen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel163
  - number: '163.2'
    text: |-
      De [artikelen 5:13][ref1] en [5:20 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '163.3'
    text: |-
      Voorzover de toezichthouder voor het uitoefenen van het gedragstoezicht ten aanzien van beroepspensioenfondsen
      waaraan de andere toezichthouder een vergunning heeft verleend of welke in het register is opgenomen, gegevens
      nodig heeft over aspecten van de bedrijfsvoering, bedoeld in [artikel 138, tweede lid, onderdeel a en b][ref1],
      vordert de eerstgenoemde toezichthouder geen inlichtingen, dan nadat de andere toezichthouder is verzocht deze
      gegevens te verstrekken en is gebleken dat de andere toezichthouder niet aan dit verzoek tegemoet kan komen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel138
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel163
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '138'
        hoofdstuk: '5'
  - number: '163.4'
    text: |-
      Van het derde lid kan, na overleg met de andere toezichthouder, worden afgeweken indien sprake is van een redelijk
      vermoeden van een overtreding van de regels bij of krachtens deze wet gesteld en onverwijlde spoed, gelet op de
      betrokken belangen, dat vereist.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel163
  - number: '164.1'
    text: |-
      De pensioenuitvoerder en de beroepspensioenvereniging zijn verplicht de zakelijke gegevens en bescheiden die
      betrekking hebben op beroepspensioenregelingen en andere bij of krachtens deze wet geregelde onderwerpen in
      Nederland beschikbaar te hebben en deze gedurende ten minste zeven jaren na het boekjaar waarop ze betrekking
      hebben beschikbaar te houden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel164
  - number: '164.2'
    text: Het eerste lid is niet van toepassing op een verzekeraar met zetel in een andere lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel164
  - number: '165.1'
    text: |-
      Een accountant die het onderzoek naar de staten, bedoeld in [artikel 142, vijfde lid][ref1], uitvoert meldt de
      toezichthouder zo spoedig mogelijk elke omstandigheid waarvan hij bij de uitvoering van het onderzoek kennis heeft
      gekregen en die:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '142'
        hoofdstuk: '5'
  - number: 165.1.a
    text: in strijd is met deze wet;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
  - number: 165.1.b
    text: de nakoming van de door het beroepspensioenfonds aangegane verplichtingen bedreigt; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
  - number: 165.1.c
    text: leidt tot de weigering van het afgeven van de verklaring omtrent de getrouwheid of tot het maken van voorbehouden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
  - number: '165.2'
    text: |-
      Het eerste lid, aanhef en onderdelen a en b, is van overeenkomstige toepassing op de actuaris die het onderzoek
      naar de staten, bedoeld in [artikel 142, vierde lid][ref1], uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '142'
        hoofdstuk: '5'
  - number: '165.3'
    text: |-
      De accountant of actuaris verstrekt zo spoedig mogelijk kosteloos alle inlichtingen aan de toezichthouder die deze
      redelijkerwijs nodig heeft voor het toezicht op de naleving van deze wet. De toezichthouder stelt het betrokken
      beroepspensioenfonds in de gelegenheid aanwezig te zijn bij het verstrekken van inlichtingen door de accountant
      of actuaris.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
  - number: '165.4'
    text: De accountant of actuaris biedt desgevraagd de toezichthouder inzicht in zijn controlewerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
  - number: '165.5'
    text: |-
      De accountant of actuaris die op grond van dit artikel tot een melding of het verstrekken van inlichtingen aan
      de toezichthouder is overgegaan, is niet aansprakelijk voor schade die een derde als gevolg daarvan lijdt, tenzij
      aannemelijk wordt gemaakt dat, gelet op alle feiten en omstandigheden, in redelijkheid niet tot melding of het
      verstrekken van inlichtingen had mogen worden overgegaan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel165
  - number: '166.1'
    text: |-
      De toezichthouder kan een pensioenuitvoerder die niet voldoet aan hetgeen bij of krachtens deze wet is bepaald,
      door middel van het geven van een aanwijzing verplichten om binnen een door de toezichthouder gestelde redelijke
      termijn ten aanzien van in de aanwijzingsbeschikking aangegeven punten een bepaalde gedragslijn te volgen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel166
  - number: '166.2'
    text: |-
      De toezichthouder kan een aanwijzing als bedoeld in het eerste lid eveneens aan een beroepspensioenfonds geven
      indien hij tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, de liquiditeit of de
      bedrijfsvoering van het beroepspensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel166
  - number: '167.1'
    text: |-
      De toezichthouder kan besluiten een of meer personen te benoemen als curator ten aanzien van alle of bepaalde
      organen van het beroepspensioenfonds indien dat beroepspensioenfonds niet voldoet aan hetgeen ingevolge deze wet
      is bepaald.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: '167.2'
    text: 'Het besluit ingevolge het eerste lid wordt slechts genomen:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.2.a
    text: |-
      nadat door het beroepspensioenfonds niet of niet volledig binnen de gestelde termijn aan een aanwijzing als bedoeld
      in [artikel 166][ref1] gevolg is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 167.2.b
    text: |-
      indien de in het eerste lid bedoelde overtreding een adequate functionering van het beroepspensioenfonds ernstig
      in gevaar brengt en dat beroepspensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te
      brengen over het voorgenomen besluit; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.2.c
    text: |-
      indien de in het eerste lid bedoelde overtreding de belangen van de aanspraak- en pensioengerechtigden ernstig in
      gevaar brengt en dat beroepspensioenfonds voorafgaand in de gelegenheid is gesteld zijn zienswijze naar voren te
      brengen over het voorgenomen besluit.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: '167.3'
    text: |-
      Onverminderd het eerste en tweede lid kan de toezichthouder besluiten een of meer personen te benoemen als
      curator ten aanzien van alle of bepaalde organen of vertegenwoordigers van een beroepspensioenfonds indien hij
      bij dat beroepspensioenfonds tekenen ontwaart van een ontwikkeling die het eigen vermogen, de solvabiliteit, of de
      liquiditeit van dat beroepspensioenfonds in gevaar kunnen brengen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: '167.4'
    text: |-
      Het benoemingsbesluit bevat onder meer een beschrijving van de belangen waardoor de curator zich dient te laten
      leiden. De toezichthouder benoemt de curator voor ten hoogste twee jaren, met de mogelijkheid om deze termijn
      telkens voor ten hoogste een jaar te verlengen; de verlenging wordt terstond van kracht. Met ingang van het
      tijdstip waarop het besluit tot benoeming van de curator aan het beroepspensioenfonds is bekendgemaakt mogen de
      desbetreffende organen of vertegenwoordigers hun bevoegdheden slechts uitoefenen na goedkeuring door de curator en
      met inachtneming van de opdrachten van de curator.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: '167.5'
    text: 'Na de benoeming van een curator:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.5.a
    text: verlenen de organen en de vertegenwoordigers van het beroepspensioenfonds de curator alle medewerking;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.5.b
    text: |-
      kan de toezichthouder de betrokken organen of vertegenwoordigers van het beroepspensioenfonds toestaan bepaalde
      rechtshandelingen zonder goedkeuring te verrichten;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.5.c
    text: kan de toezichthouder te allen tijde de door hem aangewezen curator vervangen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.5.d
    text: |-
      is voor schade ten gevolge van handelingen, die zijn verricht in strijd met een besluit als bedoeld in het eerste
      of derde lid, elke persoon die deel uitmaakt van het orgaan van het beroepspensioenfonds dat deze handelingen
      verrichtte, hoofdelijk aansprakelijk tegenover het beroepspensioenfonds, tenzij het verrichten van deze handelingen
      niet aan hem is te verwijten en hij niet nalatig is geweest in het treffen van maatregelen om de gevolgen daarvan
      af te wenden;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.5.e
    text: |-
      zijn de handelingen, bedoeld in onderdeel d, voorzover deze rechtshandelingen zijn, vernietigbaar, indien de
      wederpartij wist of behoorde te weten dat de vereiste goedkeuring ontbrak.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: '167.6'
    text: |-
      Zodra de omstandigheid, bedoeld in het eerste of derde lid niet langer aanwezig is, trekt de toezichthouder het
      besluit tot benoeming van de curator in. De toezichthouder maakt het besluit tot intrekking onverwijld bekend aan
      het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: '167.7'
    text: |-
      De toezichthouder kent aan een op grond van het eerste lid aangewezen persoon een bezoldiging toe. De bezoldiging
      komt ten laste van:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.7.a
    text: het beroepspensioenfonds of, wanneer de financiële omstandigheden van het beroepspensioenfonds dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: 167.7.b
    text: de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel167
  - number: '168.1'
    text: |-
      Op verzoek van de toezichthouder kan de ondernemingskamer van het gerechtshof Amsterdam over een
      beroepspensioenfonds een bewindvoerder aanstellen, indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: 168.1.a
    text: |-
      een beroepspensioenfonds blijk geeft van een zodanig wanbeleid dat de belangen van de aanspraak- en
      pensioengerechtigden een onmiddellijke voorziening vereisen; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: 168.1.b
    text: het bestuur is komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: '168.2'
    text: |-
      De toezichthouder dient zijn verzoekschrift tot aanstelling van een bewindvoerder in tweevoud in. De griffier doet
      een exemplaar van het verzoekschrift onverwijld aan het beroepspensioenfonds toekomen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: '168.3'
    text: |-
      Indien de ondernemingskamer het verzoek toewijst, bepaalt zij de duur waarvoor de bewindvoerder wordt aangesteld.
      Zij kan deze duur op verzoek van de toezichthouder of van de bewindvoerder verlengen dan wel verkorten. De
      ondernemingskamer kent de bewindvoerder een bezoldiging toe ten laste van:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: 168.3.a
    text: het beroepspensioenfonds of, wanneer de financiële omstandigheden van het beroepspensioenfonds dit niet toestaan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: 168.3.b
    text: de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: '168.4'
    text: |-
      De bewindvoerder treedt in de plaats van het bestuur of een of meerdere door de ondernemingskamer aangewezen leden
      van het bestuur van het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: '168.5'
    text: |-
      De voorlopige tenuitvoerlegging van de beschikking tot aanstelling van een bewindvoerder kan worden bevolen, indien
      het verzoek daartoe is gedaan op een van de gronden, genoemd in het eerste lid, onderdelen a en b.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel168
  - number: '169.1'
    text: |-
      Indien een accountant of actuaris niet of niet meer de nodige waarborgen biedt dat deze zijn taak met betrekking
      tot het beroepspensioenfonds naar behoren zal kunnen vervullen, kan de toezichthouder ten aanzien van deze
      accountant of actuaris bepalen dat hij niet langer bevoegd is de in deze wet bedoelde verklaringen met betrekking
      tot dat beroepspensioenfonds af te leggen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel169
  - number: '169.2'
    text: De toezichthouder doet mededeling van het besluit, bedoeld in het eerste lid, aan het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel169
  - number: '170.1'
    text: |-
      De toezichthouder kan een last onder dwangsom opleggen ter zake van een overtreding van de voorschriften, gesteld
      bij of krachtens deze wet en van [artikel 5:20 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel170
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '170.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter zake van de uitoefening van de bevoegdheid tot het
      opleggen van een last onder dwangsom.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel170
  - number: '171.1'
    text: |-
      De toezichthouder kan een bestuurlijke boete opleggen ter zake van een overtreding van voorschriften,
      gesteld bij of krachtens de artikelen [8][ref1], [21][ref2], [22][ref3], [23][ref4], [25][ref5], [26][ref6],
      [35][ref7], [36][ref8], [38][ref9], [39, eerste lid][ref10], 39, zevende lid, voor zover het betreft de
      overeenkomstige toepassing van artikel 39, eerste lid, [43][ref11], [44][ref12], [46 tot en met 59][ref13],
