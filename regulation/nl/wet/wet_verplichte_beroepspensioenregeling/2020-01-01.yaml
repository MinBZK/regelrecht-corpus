  - number: '214.8'
    text: |-
      Een beroepspensioenfonds dat in het eerste jaar na het tijdstip van inwerkingtreding van
      [artikel II, onderdeel N, van de Wet aanpassing financieel toetsingskader][ref1] niet voldoet aan de bij of
      krachtens [artikel 127][ref2] gestelde eisen, dient een herstelplan in op grond van [artikel 133][ref3], waarbij
      het beroepspensioenfonds, in afwijking van artikel 133, tweede lid, uitwerkt hoe het binnen 12 jaar zal voldoen
      aan artikel 127. Een beroepspensioenfonds dat in het tweede jaar na het tijdstip van inwerkingtreding van
      artikel II, onderdeel N, van de Wet aanpassing financieel toetsingskader niet voldoet aan de bij of krachtens
      artikel 127 gestelde eisen, dient een herstelplan in op grond van artikel 133 of [artikel 134][ref4], waarbij het
      beroepspensioenfonds, in afwijking van artikel 133, tweede lid, of artikel 134, tweede lid, uitwerkt hoe het binnen
      11 jaar zal voldoen aan artikel 127. Indien een beroepspensioenfonds een herstelplan heeft vastgesteld met een
      termijn van 12 of 11 jaar is artikel 134, tweede lid, voor zover het betreft het hanteren van een gelijke termijn
      voor herstelplannen, van toepassing vanaf het vierde jaar na het tijdstip van inwerkingtreding van artikel II,
      onderdeel N, van de Wet aanpassing financieel toetsingskader.


      [ref1]: https://wetten.overheid.nl/BWBR0036084#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel127
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel134
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
