        artikel: II
  - number: 214a.2
    text: |-
      Indien de deelneming is geëindigd voor het tijdstip van inwerkingtreding van
      [artikel II, onderdeel E, van de Wet waardeoverdracht klein pensioen][ref1] heeft de pensioenuitvoerder het recht
      om pensioenaanspraken van een gewezen deelnemer te laten vervallen indien op basis van de tot het tijdstip van
      beëindiging opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de
      reguliere ingangsdatum niet meer zal bedragen dan € 2,– per jaar. De pensioenuitvoerder die gebruik maakt van het
      recht, bedoeld in de eerste zin, informeert de gewezen deelnemers hierover.


      [ref1]: https://wetten.overheid.nl/BWBR0040435#ArtikelII
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214a
    references:
