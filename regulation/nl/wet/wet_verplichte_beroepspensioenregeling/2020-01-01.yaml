  - number: '214.6'
    text: |-
      De personen die op het tijdstip van inwerkingtreding van
      [artikel VI van de Wet versterking bestuur pensioenfondsen][ref1] deel uitmaken van de raad van toezicht van een
      beroepspensioenfonds, worden tot het einde van hun op dat tijdstip lopende benoemingstermijn, doch uiterlijk tot
      1 januari 2017, geacht geschikt te zijn als bedoeld in [artikel 110, derde lid][ref2], en, vanaf het tijdstip
      van inwerkingtreding van [artikel II, onderdeel C, van de Wet versterking bestuur pensioenfondsen][ref3],
      [artikel 110c, eerste lid][ref4], en betrouwbaar als bedoeld in artikel 110, vijfde lid, en vanaf het tijdstip van
      inwerkingtreding van artikel II, onderdeel C, van de Wet versterking bestuur pensioenfondsen, artikel 110c, vierde
      lid, zolang niet een wijziging in de relevante feiten, omstandigheden of antecedenten een redelijke aanleiding
      geeft tot een beoordeling van die geschiktheid of betrouwbaarheid.


      [ref1]: https://wetten.overheid.nl/BWBR0033702#ArtikelVI
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel110
      [ref3]: https://wetten.overheid.nl/BWBR0033702#ArtikelII
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
