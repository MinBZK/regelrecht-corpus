  - number: '214.12'
    text: |-
      In afwijking van [artikel 81, derde lid][ref1], is de pensioenuitvoerder verplicht om op verzoek
      van de pensioengerechtigde die vanaf 8 juli 2015 gebruik is gaan maken van de regeling, bedoeld in
      [artikel 2, vierde lid][ref2], het deel van het kapitaal dat nog niet is aangewend voor aankoop van een levenslange
      uitkering over te dragen aan een andere pensioenuitvoerder ten behoeve van de aankoop van een levenslange
      uitkering.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel2
