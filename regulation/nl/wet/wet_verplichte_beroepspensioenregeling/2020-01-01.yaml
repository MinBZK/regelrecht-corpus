        paragraaf: '4'
  - number: 214a.6
    text: |-
      In afwijking van het vijfde lid en de [artikelen 77][ref1] en [78, tweede lid][ref2], heeft de
      pensioenuitvoerder tot 1 juli 2019 het recht om pensioenaanspraken van een gewezen deelnemer af te kopen
      indien de deelneming is geëindigd in 2017 of 2018 en op basis van de tot het tijdstip van beëindiging
      opgebouwde aanspraak op ouderdomspensioen de uitkering van het ouderdomspensioen op jaarbasis op de
      reguliere ingangsdatum niet meer zal bedragen dan € 2,– per jaar. Bij toepassing van deze bepaling is
      [artikel 19b, vierde lid, van de Wet op de loonbelasting 1964][ref3] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel77
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel78
      [ref3]: https://wetten.overheid.nl/BWBR0002471#Artikel19b
