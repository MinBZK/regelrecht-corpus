  - number: '3.2'
    text: |-
      Het verminderen of vervallen van een uitkering op grond van een verzekeringsovereenkomst als bedoeld in het
      eerste lid op basis van [artikel 930, derde tot en met vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref1]
      is niet mogelijk, tenzij door een deelnemer niet is voldaan aan de in
      [artikel 928 van Boek 7 van het Burgerlijk Wetboek][ref2] omschreven mededelingsplicht betreffende zijn risico.
      In dat geval beperkt de vermindering of het verval van de uitkering zich tot het risico met betrekking tot de in
      de eerste zin bedoelde persoon. Voorzover de eerste zin in de weg staat aan vermindering dan wel verval van een
      uitkering, heeft het beroepspensioenfonds of de verzekeraar een recht van verhaal op de beroepspensioenvereniging.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel930
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '930'
      - id: ref2
        bwb_id: BWBR0005290
        artikel: '928'
  - number: '3.3'
    text: |-
      Een beding als bedoeld in [artikel 941, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is nietig wanneer
      dit is opgenomen in een verzekeringsovereenkomst als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel941
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '941'
  - number: '3.4'
    text: |-
      Voor zover bepalingen van de [titels 17][ref1] en [18 van Boek 7 van het Burgerlijk Wetboek][ref2] strijden met
      deze wet blijven die bepalingen van [Boek 7 van het Burgerlijk Wetboek][ref3] buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005290
      - id: ref2
        bwb_id: BWBR0005290
      - id: ref3
        bwb_id: BWBR0005290
  - number: '4'
    text: |-
      De [Wet op het financieel toezicht][ref1] is niet van toepassing op de verhouding tussen een verzekeraar of een
      premiepensioeninstelling en een aanspraak- of pensioengerechtigde, tenzij in deze wet anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: 4a.1
    text: |-
      Voor zover een algemeen pensioenfonds als bedoeld in [artikel 1 van de Pensioenwet][ref1] voor de uitvoering
      van een of meerdere beroepspensioenregelingen een afgescheiden vermogen aanhoudt is hetgeen bij of krachtens
      de [artikelen 1 tot en met 34][ref2], [36 tot en met 105a][ref3], [109a][ref4], [115 tot en met 118][ref5],
      [120 tot en met 214a][ref6] is bepaald van overeenkomstige toepassing met dien verstande dat daarbij voor
      beroepspensioenfonds wordt gelezen: algemeen pensioenfonds.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel36
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel109a
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel115
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel210
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '1.3'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: 109a
        hoofdstuk: '4'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '115'
        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '210'
        hoofdstuk: '7'
  - number: 4a.2
    text: |-
      [Artikel 35][ref1] is van overeenkomstige toepassing met dien verstande dat in de uitvoeringsovereenkomst met een
      algemeen pensioenfonds ook een regeling wordt opgenomen met betrekking tot:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel35
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: 4a.2.a
    text: de voorwaarden die gelden bij beëindiging van de uitvoeringsovereenkomst, bedoeld in het eerste lid, onderdeel h;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
  - number: 4a.2.b
    text: |-
      de kosten die verband houden met de uitvoering van de beroepspensioenregeling en die in mindering kunnen worden
      gebracht op een afgescheiden vermogen dat wordt aangehouden door een algemeen pensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
  - number: 4a.2.c
    text: |-
      de kosten die ten laste kunnen worden gebracht van de premie voor een afgescheiden vermogen dat wordt aangehouden
      door een algemeen pensioenfonds; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
  - number: 4a.2.d
    text: de afspraken die met een algemeen pensioenfonds worden gemaakt over de kwaliteit van de dienstverlening.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
  - number: 4a.3
    text: |-
      Indien een algemeen pensioenfonds een beroepspensioenregeling die is beëindigd uitvoert waarbij geen
      beroepspensioenvereniging meer betrokken is, stelt het algemeen pensioenfonds een uitvoeringsreglement op dat,
      voor zover van toepassing, voldoet aan de eisen die in [artikel 35][ref1] en het tweede lid ten aanzien van de
      uitvoeringsovereenkomst zijn gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel35
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: 4a.4
    text: |-
      [Artikel 91][ref1] is van overeenkomstige toepassing bij een verzoek van de beroepspensioenvereniging tot
      collectieve waardeoverdracht die ertoe strekt de waarde onder te brengen in een andere collectiviteitkring bij
      hetzelfde algemeen pensioenfonds. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld
      over collectieve waardeoverdracht als bedoeld in artikel 91 in de situatie van een beroepspensioenregeling die is
      beëindigd waarbij geen beroepspensioenvereniging meer betrokken is.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel91
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '91'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 4a.5
    text: |-
      [Artikel 92][ref1] is van overeenkomstige toepassing bij een collectieve waardeoverdracht door een algemeen
      pensioenfonds aan een andere pensioenuitvoerder of een andere collectiviteitkring bij hetzelfde algemeen
      pensioenfonds bij beëindiging van een collectiviteitkring.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel92
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '92'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 4a.6
    text: |-
      Indien een beroepspensioenfonds een algemeen pensioenfonds wordt is [artikel 92][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel92
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '92'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 4a.7
    text: |-
      [Artikel 110f][ref1] is van overeenkomstige toepassing met dien verstande dat voor verantwoordingsorgaan wordt
      gelezen: verantwoordingsorgaan of belanghebbendenorgaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel110f
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 110f
        hoofdstuk: '4'
  - number: 4a.8
    text: |-
      De beroepspensioenregelingen die onder dezelfde verplichtstelling vallen vormen financieel een geheel en zijn,
      voor de toepassing van [artikel 123 van de Pensioenwet][ref1], een collectiviteitkring waarvoor een algemeen
      pensioenfonds een afgescheiden vermogen aanhoudt. De vrijwillige pensioenregeling maakt deel uit van het zelfde
      afgescheiden vermogen als de basispensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0020809#Artikel123
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
    references:
      - id: ref1
        bwb_id: BWBR0020809
        artikel: '123'
  - number: 4a.9
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot de kosten, bedoeld
      in het tweede lid, onderdeel b en c en de afspraken, bedoeld in het tweede lid, onderdeel d.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel4a
  - number: '5.1'
    text: |-
      Onze Minister kan het deelnemen in een beroepspensioenregeling voor een of meer bepaalde groepen van beroepsgenoten
      verplicht stellen indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
  - number: 5.1.a
    text: daartoe een aanvraag wordt gedaan door een beroepspensioenvereniging, en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
  - number: 5.1.b
    text: |-
      die beroepspensioenvereniging een naar het oordeel van de minister belangrijke meerderheid van de beroepsgenoten
      die tot de beroepsgroep behoren, vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
  - number: '5.2'
    text: 'Van de verplichtstelling zijn uitgesloten:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
  - number: 5.2.a
    text: |-
      arbitrale bedingen als bedoeld in [artikel 1020, vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1020
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1020'
  - number: 5.2.b
    text: |-
      beroepspensioenregelingen die niet blijven binnen de begrenzingen die zijn opgenomen in
      [artikel 18a van de Wet op de loonbelasting 1964][ref1] en die niet krachtens [artikel 19d van die wet][ref2]
      zijn aangewezen, behalve indien en zolang de in artikel 18a van die wet opgenomen begrenzingen op grond van
      [hoofdstuk VIII van die wet op die beroepspensioenregelingen][ref3] niet van toepassing zijn of sprake is van een
      nettopensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel18a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel19d
      [ref3]: https://wetten.overheid.nl/BWBR0002471#HoofdstukVIII
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0002471
        artikel: 18a
      - id: ref2
        bwb_id: BWBR0002471
        artikel: 19d
      - id: ref3
        bwb_id: BWBR0002471
        hoofdstuk: VIII
  - number: '5.3'
    text: |-
      Indien zowel zelfstandig werkzame beroepsgenoten als beroepsgenoten die in loondienst werkzaam zijn deelnemen
      aan de beroepspensioenregeling wordt pas voldaan aan het eerste lid, onderdeel b, wanneer voor beide groepen
      afzonderlijk is aangetoond dat de beroepspensioenvereniging een belangrijke meerderheid van die beroepsgenoten
      vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
  - number: '5.4'
    text: |-
      Voor de toepassing van het tweede lid, onderdeel b, zijn de [artikelen 3.18, vierde en vijfde lid][ref1], en
      [3.95, eerste lid, tweede volzin, van de Wet inkomstenbelasting 2001][ref2] alsmede de daarop berustende bepalingen
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '6.1'
    text: |-
      De aanvraag, bedoeld in [artikel 5][ref1], gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: 6.1.a
    text: |-
      een verklaring waaruit blijkt dat aan [artikel 5, eerste lid, onderdeel b][ref1], wordt voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: 6.1.b
    text: |-
      een gewaarmerkt exemplaar van de op het moment van de aanvraag geldende statuten en reglementen van de
      beroepspensioenvereniging.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: '6.2'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een beroepspensioenfonds gaat de aanvraag tevens vergezeld
      van:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: 6.2.a
    text: een authentiek afschrift van de akte van oprichting van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: 6.2.b
    text: een door het bestuur gewaarmerkt exemplaar van het reglement of de reglementen van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: 6.2.c
    text: een door het bestuur gewaarmerkt afschrift van de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: 6.2.d
    text: |-
      een actuariële en bedrijfstechnische nota als bedoeld in [artikel 140][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel140
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '140'
        hoofdstuk: '5'
  - number: 6.2.e
    text: een eventuele overeenkomst tot overdracht of verzekering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: '6.3'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een verzekeraar of een premiepensioeninstelling gaat de
      aanvraag tevens vergezeld van:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: 6.3.a
    text: |-
      een door het bestuur van de beroepspensioenvereniging gewaarmerkt afschrift van de getekende overeenkomst tussen de
      verzekeraar of de premiepensioeninstelling en de beroepspensioenvereniging;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: 6.3.b
    text: |-
      een door de beroepspensioenvereniging gewaarmerkt afschrift van de getekende wijzigingsovereenkomst indien er een
      wijziging van de overeenkomst heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: '6.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de aanvraag alsmede met betrekking tot de bij te voegen
      stukken nadere regels worden gesteld, waarbij kan worden bepaald dat de indiening van de aanvraag uitsluitend langs
      elektronische weg kan geschieden, tenzij naar het oordeel van Onze Minister sprake is van omstandigheden die zich
      daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel6
  - number: '7.1'
    text: |-
      Zolang de verplichtstelling duurt zijn de [artikelen 7, derde en vierde lid, tot en met artikel 214a][ref1] en de
      daarop berustende bepalingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel7
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '7'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      Na beëindiging van de verplichtstelling blijven de [artikelen 7, derde en vierde lid, tot en met artikel 214a][ref1]
      en de daarop berustende bepalingen van toepassing voorzover ze betrekking hebben op de periode waarover de
      verplichtstelling duurde.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel7
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '7'
        hoofdstuk: '2'
  - number: '7.3'
    text: De deelnemers leven de beroepspensioenregeling en de daarop gebaseerde besluiten na.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel7
  - number: '7.4'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een beroepspensioenfonds leven de deelnemers de statuten
      van dat beroepspensioenfonds en de daarop gebaseerde besluiten na.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel7
  - number: '8'
    text: 'Een beroepspensioenregeling wordt uitgevoerd door:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel8
  - number: 8.a
    text: een pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel8
  - number: 8.b
    text: |-
      een pensioeninstelling uit een andere lidstaat die beschikt over een daartoe verleende vergunning als bedoeld in
      [artikel 193][ref1] en de bevoegde autoriteiten in kennis heeft gesteld als bedoeld in [artikel 193][ref2]; of


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel193
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel193
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '193'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '193'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 8.c
    text: |-
      een verzekeraar met een zetel buiten Nederland, mits die verzekeraar op grond van de
      [Wet op het financieel toezicht][ref1] in Nederland het bedrijf van levensverzekeraar of schadeverzekeraar mag
      uitoefenen.


      [ref1]: https://wetten.overheid.nl/BWBR0020368
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0020368
  - number: '9.1'
    text: |-
      Onze Minister kan de verplichtstelling wijzigen indien daartoe een aanvraag wordt gedaan door een
      beroepspensioenvereniging die voldoet aan [artikel 5, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      [Artikel 5, tweede tot en met vierde lid][ref1], en
      [artikel 6, eerste lid, onderdeel a, tweede lid, onderdeel d, en derde lid, onderdeel b][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel6
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '6'
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een beroepspensioenfonds gaat de aanvraag tevens vergezeld
      van:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel9
  - number: 9.3.a
    text: |-
      een authentiek afschrift van de akte houdende wijziging van de statuten indien er een wijziging van de statuten
      heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel9
  - number: 9.3.b
    text: |-
      een door het beroepspensioenfonds gewaarmerkt exemplaar van de wijzigingen van de reglementen indien er een
      wijziging van de reglementen heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel9
  - number: '9.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot het eerste en tweede lid nadere regels worden gesteld, waarbij
      kan worden bepaald dat de indiening van de aanvraag uitsluitend langs elektronische weg kan geschieden, tenzij er
      naar het oordeel van Onze Minister sprake is van omstandigheden die zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel9
  - number: '10.1'
    text: |-
      Indien een wijziging van de beroepspensioenregeling heeft plaatsgevonden zendt de beroepspensioenvereniging een
      door haar gewaarmerkt afschrift van wijziging van de beroepspensioenregeling, binnen twee weken nadat de wijziging
      tot stand is gekomen aan Onze Minister en aan de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel10
  - number: '10.2'
    text: Onze Minister doet mededeling in de Staatscourant van de wijziging van de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel10
  - number: '11.1'
    text: |-
      Op verzoek van Onze Minister toont de beroepspensioenvereniging die voortzetting van de verplichtstelling wenst
      binnen acht weken na dat verzoek aan dat nog wordt voldaan aan [artikel 5, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      Onze Minister doet het verzoek, bedoeld in het eerste lid, ten minste acht weken voordat er vijf
      jaren zijn verstreken sinds de datum waarop voor het laatst is gebleken dat wordt voldaan aan
      [artikel 5, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '11.3'
    text: |-
      Als de datum waarop voor het laatst is gebleken dat nog wordt voldaan aan
      [artikel 5, eerste lid, onderdeel b][ref1] wordt aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: 11.3.a
    text: de datum waarop de verplichtstelling is opgelegd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
  - number: 11.3.b
    text: de datum waarop de verplichtstelling is gewijzigd, of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
  - number: 11.3.c
    text: |-
      de datum waarop na het verzoek van Onze Minister, bedoeld in het eerste lid of [artikel 12][ref1] is aangetoond dat
      aan de daar gestelde eisen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel12
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '12'
        hoofdstuk: '2'
  - number: '11.4'
    text: |-
      Indien de beroepspensioenvereniging niet binnen acht weken na het verzoek, bedoeld in het eerste lid, heeft
      aangetoond dat nog wordt voldaan aan [artikel 5, eerste lid, onderdeel b][ref1], doet Onze Minister daarvan
      mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '11.5'
    text: |-
      [Artikel 5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '12.1'
    text: |-
      Acht weken voordat er twee jaren zijn verstreken sinds de mededeling, bedoeld in [artikel 11, vierde lid][ref1],
      doet Onze Minister opnieuw een verzoek als bedoeld in [artikel 11, eerste lid][ref2]. Indien de
      beroepspensioenvereniging, binnen acht weken na dat verzoek niet aantoont dat nog wordt voldaan aan
      [artikel 5, eerste lid, onderdeel b][ref3], trekt Onze Minister met betrekking tot de betrokken beroepsgroep de
      verplichtstelling in.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '11'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '11'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '12.2'
    text: |-
      Indien uitsluitend met betrekking tot de beroepsgenoten die in loondienst werkzaam zijn door de
      beroepspensioenvereniging niet is aangetoond dat nog wordt voldaan aan [artikel 5, eerste lid, onderdeel b][ref1],
      trekt Onze Minister de verplichtstelling in afwijking van het eerste lid, slechts in met betrekking tot die groep.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '13.1'
    text: |-
      Onverminderd [artikel 14][ref1] trekt Onze Minister de verplichtstelling in indien daartoe een aanvraag wordt
      gedaan door een beroepspensioenvereniging die voldoet aan [artikel 5, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '14'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '13.2'
    text: |-
      Onverminderd [artikel 14][ref1] kan Onze Minister de verplichtstelling intrekken voor een of meer bepaalde groepen
      van beroepsgenoten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel14
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '14'
        hoofdstuk: '2'
  - number: 13.2.a
    text: daartoe een aanvraag wordt gedaan door een beroepspensioenvereniging,
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
  - number: 13.2.b
    text: |-
      die beroepspensioenvereniging een naar het oordeel van de minister belangrijke meerderheid van die groep of groepen
      beroepsgenoten vertegenwoordigt, en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
  - number: 13.2.c
    text: |-
      deze intrekking niet tot gevolg heeft dat de verplichtstelling slechts resteert voor beroepsgenoten die in
      loondienst werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
  - number: '13.3'
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een verklaring waaruit blijkt dat wordt voldaan aan het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
  - number: '13.4'
    text: |-
      De aanvraag, bedoeld in het tweede lid, gaat vergezeld van een verklaring waaruit blijkt dat wordt voldaan aan het
      tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
  - number: '13.5'
    text: |-
      [Artikel 5, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '13.6'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de aanvragen, bedoeld in het eerste lid en tweede lid, alsmede
      met betrekking tot de bij te voegen stukken nadere regels worden gesteld, waarbij kan worden bepaald dat de
      indiening van de aanvragen uitsluitend langs elektronische weg kan geschieden, tenzij er naar het oordeel van Onze
      Minister sprake is van omstandigheden die zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel13
  - number: '14.1'
    text: |-
      In uitzonderlijke gevallen kan Onze Minister de verplichtstelling ambtshalve voor alle of voor één of meer bepaalde
      groepen van deelnemers intrekken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel14
  - number: '14.2'
    text: |-
      Van een uitzonderlijk geval is in ieder geval sprake indien er geen bijdragen meer aan de pensioenuitvoerder worden
      gedaan dan wel indien het een beroepspensioenregeling als bedoeld in [artikel 5, tweede lid, onderdeel b][ref1],
      betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '15.1'
    text: |-
      Bij een besluit tot intrekking van de verplichtstelling geeft Onze Minister aan per welke datum de
      verplichtstelling wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van [artikel 12][ref1] en [13][ref2] trekt Onze Minister de verplichtstelling niet in zolang tegen
      die intrekking overwegende bezwaren bestaan in verband met de bescherming van de rechten van de deelnemers, gewezen
      deelnemers, andere aanspraakgerechtigden en pensioengerechtigden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel13
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '12'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '13'
        hoofdstuk: '2'
  - number: '15.3'
    text: |-
      Bij de intrekking kunnen door Onze Minister ter bescherming van de rechten van de deelnemers, gewezen deelnemers,
      andere aanspraakgerechtigden en pensioengerechtigden voorschriften worden gegeven met betrekking tot hun rechten
      en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel15
  - number: '15.4'
    text: |-
      Bij het besluit van intrekking kan Onze Minister voorschrijven dat de beroepspensioenvereniging binnen zes maanden
      na dat besluit bij de toezichthouder een plan voor afbouw indient.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel15
  - number: '15.5'
    text: |-
      Vanaf de dag van publicatie in de Staatscourant van het besluit tot intrekking van de verplichtstelling worden geen
      nieuwe deelnemers tot de beroepspensioenregeling toegelaten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel15
  - number: '16.1'
    text: 'Onze Minister doet mededeling in de Staatscourant van:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.a
    text: een aanvraag tot verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.b
    text: een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.c
    text: een aanvraag betreffende wijziging van de verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.d
    text: een wijziging van de verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.e
    text: een aanvraag tot intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.f
    text: een voornemen tot ambtshalve intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.g
    text: een intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: 16.1.h
    text: het niet verder in behandeling nemen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: '16.2'
    text: |-
      Bij de mededelingen, bedoeld in het eerste lid, onderdelen a, c, e en f, vermeldt Onze Minister de termijn
      waarbinnen zienswijzen tegen de inhoud van hetgeen is meegedeeld schriftelijk bij hem naar voren kunnen worden
      gebracht. Bij ministeriële regeling kan worden bepaald dat de indiening van de zienswijze uitsluitend langs
      elektronische weg kan plaatsvinden, tenzij er naar het oordeel van Onze Minister sprake is van omstandigheden die
      zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel16
  - number: '17.1'
    text: |-
      Indien tijdens detachering in Nederland de betaling van premies in een andere lidstaat wordt voortgezet, is de in
      Nederland gedetacheerde beroepsgenoot vrijgesteld van de verplichting tot het betalen van premies in Nederland.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel17
  - number: '17.2'
    text: Een gedetacheerd beroepsgenoot kan tijdens de detachering blijven deelnemen aan de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel17
  - number: '18.1'
    text: |-
      Onverminderd [artikel 17][ref1] kan onze Minister een persoon die slechts tijdelijk in Nederland werkzaam is, op
      aanvraag in een bijzonder, individueel geval voorwaardelijk of onvoorwaardelijk voor de periode dat die persoon in
      Nederland werkzaam is ontheffing verlenen van de verplichtstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel17
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '17'
        hoofdstuk: '2'
  - number: '18.2'
    text: |-
      Bij ministeriële regeling kunnen nadere regels met betrekking tot de aanvraag worden gesteld, waarbij voor de
      indiening van de aanvraag kan worden bepaald dat deze uitsluitend langs elektronische weg kan geschieden, tenzij er
      naar het oordeel van Onze Minister sprake is van omstandigheden die zich daartegen verzetten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel18
  - number: '19.1'
    text: |-
      Van de verplichtstelling, wordt op zijn aanvraag, door de pensioenuitvoerder ontheffing verleend aan de persoon die
      gemoedsbezwaren heeft tegen iedere vorm van verzekering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel19
  - number: '19.2'
    text: |-
      Bij ministeriële regeling worden met betrekking tot het eerste lid nadere regels gesteld. Bij ministeriële regeling
      worden tevens regels gesteld betreffende de gevolgen van de ontheffing, alsmede betreffende de intrekking van de
      ontheffing.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel19
  - number: 19a
    text: |-
      De [Kaderwet zelfstandige bestuursorganen][ref1] is niet van toepassing op de pensioenuitvoerder die een
      beroepspensioenregeling uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel19a
    references:
      - id: ref1
        bwb_id: BWBR0020495
  - number: '20.1'
    text: Een beroepspensioenregeling is in overwegende mate bestemd voor zelfstandig werkende beroepsgenoten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel20
  - number: '20.2'
    text: Een beroepspensioenregeling bevat in ieder geval een basispensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel20
  - number: '20.3'
    text: |-
      Een beroepspensioenregeling kan meer dan één beroepsgroep omvatten of zijn beperkt tot een deel van een
      beroepsgroep.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel20
  - number: '21.1'
    text: |-
      De pensioenuitvoerder stelt een pensioenreglement vast in overeenstemming met de beroepspensioenregeling en de
      uitvoeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel21
  - number: '21.2'
    text: 'In het pensioenreglement worden in ieder geval bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel21
  - number: 21.2.a
    text: de beroepsgroep of het deel van de beroepsgroep waarvoor de beroepspensioenregeling geldt;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel21
  - number: 21.2.b
    text: de wijze waarop de pensioenuitvoerder omgaat met inkomende waarden in het kader van waardeoverdracht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel21
  - number: 21.2.c
    text: |-
      de hoogte van de ruilvoet en de opbouwkeuzevoet, bedoeld in [artikel 72][ref1] en [73][ref2], en de afkoopvoet,
      bedoeld in [artikel 78][ref3]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel72
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel78
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '72'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '73'
        hoofdstuk: '3'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '78'
        hoofdstuk: '3'
        paragraaf: '4'
  - number: 21.2.d
    text: |-
      de kortingsregel, bedoeld in [artikel 129][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: '22.1'
    text: |-
      Uitsluiting van deelneming aan een beroepspensioenregeling op grond van het aantal uren dat het beroep wordt
      uitgeoefend, het gerealiseerde inkomen, het overeengekomen loon of de gerealiseerde omzet, is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel22
  - number: '22.2'
    text: |-
      Uitsluiting van deelneming aan een beroepspensioenregeling op grond van de leeftijd van een beroepsgenoot is niet
      toegestaan indien de beroepsgenoot eenentwintig jaar of ouder is.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel22
  - number: '22.3'
    text: |-
      Het verwerven van pensioenaanspraken op grond van een beroepspensioenregeling kan, indien in de
      beroepspensioenregeling is voorzien in een wachttijd of drempelperiode, met betrekking tot ouderdomspensioen
      worden uitgesteld met ten hoogste twee maanden. Wachttijden of drempelperioden zijn niet toegestaan voor het
      nabestaandenpensioen en het arbeidsongeschiktheidspensioen. Indien een gewezen beroepsgenoot nog niet in de
      beroepspensioenregeling is opgenomen, maar er door of namens hem een bijdrage is betaald, dan wordt de som van de
      bijdragen aan hem terugbetaald of wordt, in geval de gewezen beroepsgenoot het beleggingsrisico draagt, de som van
      de gestorte bijdragen of de met deze bijdragen gerealiseerde beleggingswaarde aan hem terugbetaald.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel22
  - number: '22.4'
    text: Elk beding in strijd met het eerste, tweede en derde lid is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel22
  - number: '23.1'
    text: |-
      De premie is voor alle deelnemers gelijk of bedraagt voor alle deelnemers een gelijk percentage van de
      gerealiseerde omzet, het gerealiseerde inkomen of het gerealiseerde loon dan wel van het gedeelte van de
      gerealiseerde omzet, het gerealiseerde inkomen of gerealiseerde loon dat voor de pensioenberekening in aanmerking
      wordt genomen, met dien verstande dat er voor verschillende vormen van pensioen verschillende premies kunnen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel23
  - number: '23.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel23
  - number: 23.2.a
    text: premieregelingen, en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel23
  - number: 23.2.b
    text: premies ten behoeve van vrijwillige pensioenregelingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel23
  - number: '24.1'
    text: |-
      De beroepspensioenregeling kan een verplichting voor iedere deelnemer inhouden tot het bijhouden van een zodanige
      boekhouding, dat daaruit de gegevens blijken welke de pensioenuitvoerder nodig heeft voor de vaststelling van het
      deelnemerschap en de pensioenaanspraken, pensioenrechten en verplichtingen van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel24
  - number: '24.2'
    text: |-
      Iedere deelnemer verleent de pensioenuitvoerder desgevraagd inzage in de in het eerste lid bedoelde boekhouding
      en in de bescheiden die daaraan ten grondslag liggen, voor zover daaruit de in dat lid bedoelde gegevens zijn af
      te leiden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel24
  - number: '24.3'
    text: |-
      Iedere deelnemer verstrekt desgevraagd de inlichtingen welke de pensioenuitvoerder nodig heeft voor de vaststelling
      van het deelnemerschap en de pensioenaanspraken, pensioenrechten en verplichtingen van die deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel24
  - number: '24.4'
    text: |-
      De persoon, die de inzage van de boekhouding en bescheiden en de verstrekking van de gegevens weigert, kan zich
      niet met vrucht beroepen op enige geheimhoudingsplicht, ook al mocht deze hem bij wet zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel24
  - number: '25.1'
    text: |-
      Het is een beroepspensioenfonds verboden bijdragen te ontvangen van een zelfstandige of beroepsgenoot die is
      gevestigd in een andere lidstaat dan Nederland:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel25
  - number: 25.1.a
    text: zonder een daartoe door de toezichthouder verleende vergunning; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel25
  - number: 25.1.b
    text: |-
      zonder de toezichthouder van het voornemen daartoe in kennis te hebben gesteld, op de wijze, bedoeld in
      [artikel 26][ref1], en met inachtneming van [artikel 190][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel190
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '190'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '25.2'
    text: |-
      Voor de toepassing van het eerste lid, [artikel 133, vierde lid][ref1], [artikel 135, tweede lid][ref2], en de
      [paragrafen 4.2][ref3] en [4.3][ref4] wordt onder het ontvangen van bijdragen verstaan het ontvangen van bijdragen
      voor de uitvoering van een pensioenregeling die afkomstig is uit een andere lidstaat dan de lidstaat waar het
      beroepspensioenfonds gevestigd is.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel135
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Hoofdstuk6
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '135'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0018831
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018831
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '26.1'
    text: |-
      Een beroepspensioenfonds stelt de toezichthouder in kennis van een voornemen bijdragen te gaan ontvangen van een in
      een andere lidstaat gevestigde zelfstandige of beroepsgenoot.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel26
  - number: '26.2'
    text: 'De kennisgeving, bedoeld in het eerste lid, gaat vergezeld van een opgave van:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel26
  - number: 26.2.a
    text: |-
      de lidstaat waar de zelfstandige of beroepsgenoot is gevestigd, die in voorkomend geval wordt opgegeven door de
      zelfstandige of beroepsgenoot;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel26
  - number: 26.2.b
    text: de naam van de in de andere lidstaat gevestigde zelfstandige of beroepsgenoot; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel26
  - number: 26.2.c
    text: |-
      de voornaamste kenmerken van de beroepspensioenregeling die voor die zelfstandige of beroepsgenoot zal worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel26
  - number: '27'
    text: |-
      Het beroepspensioenfonds neemt bij de uitvoering van een beroepspensioenregeling voor een in een andere lidstaat
      dan Nederland gevestigde zelfstandige of beroepsgenoot de op bedrijfspensioenvoorziening toepasselijke bepalingen
      van de sociale en arbeidswetgeving en de voorschriften die krachtens titel IV van [richtlijn 2016/2341]
      (32016L2341)/EU moeten worden nageleefd, in acht. De Nederlandse sociale en arbeidswetgeving is niet van toepassing
      op de uitvoering van de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel27
  - number: '28'
    text: 'De beroepspensioenregeling houdt in:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel28
  - number: 28.a
    text: een uitkeringsregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel28
  - number: 28.b
    text: een kapitaalregeling; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel28
  - number: 28.c
    text: een premieregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel28
  - number: 28a.1
    text: |-
      Bij een kapitaalregeling of een premieregeling wordt het kapitaal voortvloeiend uit de beschikbaar gestelde premies
      uiterlijk op de pensioendatum omgezet in een vastgestelde uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel28a
  - number: 28a.2
    text: |-
      In afwijking van het eerste lid kan het kapitaal vanaf de pensioendatum geheel of gedeeltelijk worden gebruikt voor
      de financiering van een variabele uitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel28a
  - number: '29'
    text: |-
      De uitkering, het kapitaal en de premie in het kader van een beroepspensioenregeling luiden in een Nederlands
      wettig betaalmiddel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel29
  - number: '30'
    text: |-
      In de beroepspensioenregeling wordt bepaald of er toeslagen worden verleend en, zo ja, wat het ambitieniveau is en
      welke voorwaarden gelden bij de toeslagverlening.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel30
  - number: '31.1'
    text: |-
      Indien een beroepspensioenregeling voorziet in een ouderdomspensioen, wordt in de regeling bepaald
      dat dat pensioen levenslang wordt uitgekeerd aan de gepensioneerde, tenzij het ouderdomspensioen
      uitsluitend voorziet in een uitkering tot het bereiken van de pensioengerechtigde leeftijd, bedoeld in
      [artikel 7a, eerste lid, van de Algemene Ouderdomswet][ref1], of tot het bereiken van de pensioenleeftijd voor het
      levenslange ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0002221
        artikel: 7a
  - number: '31.2'
    text: Elk beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel31
  - number: '32.1'
    text: |-
      Indien een beroepspensioenregeling voorziet in een partnerpensioen ten behoeve van een partner met wie de deelnemer
      niet gehuwd is, noch een geregistreerd partnerschap heeft, gelden voor deze partner ten aanzien van de wijze van
      vaststelling van het partnerpensioen dezelfde rechten en plichten als voor een gehuwde of geregistreerde partner.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel32
  - number: '32.2'
    text: Elk beding in strijd met het eerste lid is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel32
  - number: '33'
    text: |-
      De verwerving van pensioenaanspraken in het kader van een uitkeringsregeling of een kapitaalregeling vindt
      gedurende de deelneming ten minste evenredig in de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel33
  - number: 33a
    text: Het doorberekenen van kosten in het kader van een premieregeling vindt evenredig in de tijd plaats.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel33a
  - number: '34.1'
    text: |-
      In geval van verlaging van de pensioengrondslag van een beroepsgenoot worden de op grond van de
      beroepspensioenregeling tot het tijdstip van verlaging opgebouwde pensioenaanspraken niet gewijzigd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel34
  - number: '34.2'
    text: |-
      In geval van verlaging van de pensioengrondslag blijven de opgebouwde pensioenaanspraken behouden en worden de
      pensioenaanspraken vastgesteld overeenkomstig [artikel 66][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel66
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '34.3'
    text: Elk beding in strijd met het eerste of tweede lid is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel34
  - number: '35.1'
    text: |-
      In de uitvoeringsovereenkomst wordt in ieder geval een regeling opgenomen met betrekking tot de volgende
      onderwerpen:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.a
    text: de wijze waarop de verschuldigde premie wordt vastgesteld;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.b
    text: |-
      de wijze waarop en termijnen waarin de verschuldigde premie moet worden voldaan met inachtneming van
      [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel36
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: 35.1.c
    text: de informatie welke door de beroepsgenoot aan de pensioenuitvoerder wordt verstrekt;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.d
    text: de procedures welke gelden bij het niet nakomen van premiebetalingsverplichtingen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.e
    text: |-
      de procedures welke gelden bij het opstellen en wijzigen van het pensioenreglement in verband met het sluiten en
      wijzigen van een beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.f
    text: de maatstaven voor en voorwaarden waaronder toeslagverlening plaatsvindt;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.g
    text: |-
      de uitgangspunten en procedures welke gelden ten aanzien van de besluitvorming over vermogenstekorten en
      vermogensoverschotten dan wel winstdeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.h
    text: |-
      de voorwaarden die gelden bij beëindiging van een met een verzekeraar of premiepensioeninstelling
      gesloten uitvoeringsovereenkomst. In deze regeling worden de belangen van zowel de verzekeraar of de
      premiepensioeninstelling als de beroepspensioenvereniging vanuit actuarieel en bedrijfseconomisch oogpunt op
      evenwichtige wijze gewaarborgd door rekening te houden met:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.h.1°
    text: de overige voorwaarden in de uitvoeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.h.2°
    text: de gehanteerde tarieven; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.h.3°
    text: de winstdelingsvorm.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.1.i
    text: |-
      de criteria die de premiepensioeninstelling hanteert bij de keuze voor een verzekeraar voor de inkoop van een
      pensioenuitkering.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: '35.2'
    text: |-
      In de uitvoeringsovereenkomst wordt, voor zover overeengekomen, een regeling opgenomen met betrekking tot de
      volgende onderwerpen:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.2.a
    text: |-
      in geval van premiekorting of terugstorting: de voorwaarden waaronder sprake is van premiekorting of terugstorting,
      de wijze van vaststelling van de hoogte van de premiekorting of terugstorting en de bestemming ervan;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.2.b
    text: de mogelijkheid tot vrijwillige voortzetting van de beroepspensioenregeling na beëindiging van het beroep; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: 35.2.c
    text: de rechten en verplichtingen met betrekking tot vrijwillige pensioenregelingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel35
  - number: '36'
    text: |-
      In de uitvoeringsovereenkomst wordt vastgelegd hoe de betaling van de premies door de beroepsgenoot aan de
      pensioenuitvoerder geschiedt, waarbij aan de volgende voorwaarden wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel36
  - number: 36.a
    text: 'een beroepsgenoot voldoet de premie aan de pensioenuitvoerder uiterlijk binnen:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel36
  - number: 36.a.1°
    text: |-
      twee maanden na afloop van elke maand waarover de premie verschuldigd is indien de pensioenuitvoerder op basis van
      actuele loonsomgegevens zijn administratie voert; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel36
  - number: 36.a.2°
    text: een maand na afloop van elk kwartaal waarover de premie verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel36
  - number: 36.b
    text: |-
      wanneer de premie op basis van een langere termijn dan een kwartaal wordt vastgesteld en in rekening gebracht,
      is deze termijn ten hoogste gelijk aan een jaar en voldoet de beroepsgenoot uiterlijk binnen een maand na
      afloop van elk kwartaal een vierde gedeelte van de verschuldigde jaarpremie op basis van een schatting van de
      pensioenuitvoerder, aan de pensioenuitvoerder; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel36
  - number: 36.c
    text: |-
      de totale jaarpremie wordt uiterlijk binnen zes maanden na afloop van het kalenderjaar voldaan aan de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel36
  - number: '37'
    text: |-
      De in [artikel 36][ref1] genoemde termijnen gelden niet indien sprake is van een beëindiging van de deelneming. In
      dat geval wordt de ten tijde van de beëindiging nog verschuldigde premie binnen dertien weken voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel36
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: '38'
    text: |-
      Een beroepspensioenfonds informeert elk kwartaal schriftelijk de deelnemers, gewezen deelnemers en
      pensioengerechtigden wanneer sprake is van een premieachterstand ter grootte van 5% van de totale door
      het beroepspensioenfonds te ontvangen jaarpremie en tevens niet voldaan wordt aan de bij of krachtens
      [artikel 126][ref1] geldende eisen inzake het minimaal vereist eigen vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel126
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '126'
        hoofdstuk: '5'
  - number: '39.1'
    text: |-
      Een verzekeraar informeert de deelnemers wanneer de premieachterstand het noodzakelijk maakt de opbouw van
      pensioenaanspraken te beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde te laten
      vervallen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel39
  - number: '39.2'
    text: |-
      Een verzekeraar kan de in het eerste lid bedoelde mededeling aan de deelnemers pas doen indien hij zich aantoonbaar
      heeft ingespannen om de achterstallige premie te innen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel39
  - number: '39.3'
    text: |-
      De verzekeraar kan op zijn vroegst drie maanden na de in het eerste lid bedoelde mededeling de opbouw van
      pensioenaanspraken beëindigen door premievrijmaking of pensioenaanspraken zonder premievrije waarde laten
      vervallen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel39
  - number: '39.4'
    text: |-
      De premievrijmaking, bedoeld in het derde lid, vindt op zijn vroegst plaats per de datum die vijf maanden voor het
      tijdstip van informeren van de deelnemers is gelegen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel39
  - number: '39.5'
    text: |-
      De dekking van het arbeidsongeschiktheidsrisico of het overlijdensrisico blijft volledig in stand tot drie maanden
      na de in het eerste lid bedoelde mededeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel39
  - number: '39.6'
    text: |-
      Bij de premievrijmaking wordt de verzekering premievrij voortgezet zonder verrekening van premie en rente met de
      pensioenaanspraken. Kosten, voor zover voortvloeiend uit het premievrij maken, worden evenmin verrekend met de
      pensioenaanspraken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel39
  - number: '39.7'
    text: Dit artikel is van overeenkomstige toepassing op een premiepensioeninstelling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel39
  - number: '40'
    text: |-
      In een uitvoeringsovereenkomst met een verzekeraar met zetel buiten Nederland waarin bij de totstandkoming of op
      een later tijdstip wordt gekozen voor ander dan Nederlands recht, wordt de volgende clausule opgenomen: Ongeacht
      het gekozen rechtsstelsel is ten aanzien van deze uitvoeringsovereenkomst in ieder geval de Wet verplichte
      beroepspensioenregeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel40
  - number: '41'
    text: |-
      Een pensioenuitvoerder heeft tot taak een beroepspensioenregeling uit te voeren op basis van een
      uitvoeringsovereenkomst.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel41
  - number: '42.1'
    text: |-
      Een pensioenuitvoerder richt zijn organisatie zodanig in dat een goed bestuur is gewaarborgd waardoor er in ieder
      geval:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel42
  - number: 42.1.a
    text: verantwoording wordt afgelegd aan de aanspraak- en pensioengerechtigden; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel42
  - number: 42.1.b
    text: intern toezicht is.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel42
  - number: '42.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen met betrekking tot het eerste lid regels worden gesteld. Die regels
      kunnen in het bijzonder betrekking hebben op de naleving van in die algemene maatregel van bestuur aan te wijzen
      principes voor goed pensioenfondsbestuur.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel42
  - number: '43.1'
    text: |-
      Indien een pensioenuitvoerder werkzaamheden uitbesteedt aan een derde draagt hij er zorg voor dat deze derde de bij
      of krachtens deze wet gestelde regels, die van toepassing zijn op de uitbestedende pensioenuitvoerder, naleeft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: '43.2'
    text: 'Door de pensioenuitvoerder mogen de volgende werkzaamheden niet worden uitbesteed:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: 43.2.a
    text: |-
      taken en werkzaamheden van personen die het dagelijks beleid bepalen, daaronder mede verstaan het vaststellen van
      beleid en het afleggen van verantwoording over het gevoerde beleid;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: 43.2.b
    text: het opstellen van en toezien op het strategisch beleid ten aanzien van vermogensbeheer;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: 43.2.c
    text: |-
      werkzaamheden waarvan uitbesteding de verantwoordelijkheid van de uitvoerder voor de organisatie en beheersing van
      bedrijfsprocessen en het toezicht daarop kan ondermijnen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: 43.2.d
    text: |-
      indien de uitbesteding een belemmering kan vormen voor een adequaat toezicht op de naleving van het bij of
      krachtens de Wet verplichte beroepspensioenregeling bepaalde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: '43.3'
    text: 'Bij of krachtens algemene maatregel van bestuur kunnen:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: 43.3.a
    text: werkzaamheden worden aangewezen die niet mogen worden uitbesteed;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: 43.3.b
    text: |-
      regels worden gesteld met betrekking tot de uitbesteding in verband met het toezicht op de naleving van het bij of
      krachtens deze wet bepaalde; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: 43.3.c
    text: regels worden gesteld met betrekking tot de beheersing van risico’s die verband houden met de uitbesteding.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel43
  - number: '44.1'
    text: |-
      De pensioenuitvoerder registreert de deelnemingsjaren van de deelnemers en verstrekt hierover informatie aan de
      deelnemers en gewezen deelnemers.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel44
  - number: '44.2'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot het eerste lid waaronder de
      perioden die in aanmerking komen als deelnemingsjaren.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel44
  - number: '45.1'
    text: |-
      Het Uitvoeringsinstituut werknemersverzekeringen meldt de arbeidsongeschiktheid van een deelnemer aan de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel45
  - number: '45.2'
    text: Bij regeling van Onze Minister worden regels gesteld ten aanzien van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel45
  - number: '46.1'
    text: |-
      De pensioenuitvoerder verstrekt gegevens betreffende een deelnemer, een gewezen deelnemer, een andere
      aanspraakgerechtigde of een pensioengerechtigde slechts aan de desbetreffende persoon.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: '46.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: 46.2.a
    text: er sprake is van een wettelijke verplichting tot gegevensverstrekking;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: 46.2.b
    text: gegevensverstrekking noodzakelijk is voor de uitvoering van de beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: 46.2.c
    text: gegevensverstrekking noodzakelijk is in verband met waardeoverdracht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: 46.2.d
    text: |-
      het gegevensverstrekking betreft aan de toezichthouder voorzover deze gegevensverstrekking nodig is voor de
      vervulling van zijn bij of krachtens deze wet opgelegde taken, of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: 46.2.e
    text: |-
      er sprake is van het verstrekken van naam-, adres- en woonplaatsgegevens aan verenigingen met volledige
      rechtsbevoegdheid die als statutair doel of mede als statutair doel hebben het behartigen van de belangen van
      haar leden als belanghebbenden bij een beroepspensioenregeling, dan wel aan de beroepspensioenvereniging die als
      uitsluitend statutair doel heeft het verzorgen van de beroepspensioenregeling van de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: '46.3'
    text: |-
      In afwijking van het eerste lid kan een deelnemer, gewezen deelnemer, een andere aanspraakgerechtigde of een
      pensioengerechtigde, de pensioenuitvoerder machtigen zijn gegevens te verstrekken aan een door hem aan te wijzen
      derde. De pensioenuitvoerder onthoudt zich daarbij van suggesties met betrekking tot de aan te wijzen derde.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: '46.4'
    text: |-
      Indien er gegevensverstrekking als bedoeld in het tweede lid, onderdeel b of onderdeel e heeft plaatsgevonden,
      zijn het eerste, tweede en derde lid van overeenkomstige toepassing op de natuurlijke- of rechtspersoon aan wie
      de gegevens zijn verstrekt. Indien de rechtspersoon naast de werkzaamheden uit hoofde waarvan de gegevens zijn
      verstrekt ook andere werkzaamheden verricht, wordt bij de toepassing van het derde lid, de rechtspersoon als derde
      aangemerkt voor zover het de andere werkzaamheden betreft.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel46
  - number: '47.1'
    text: |-
      Behoudens het geven van algemene informatie, geeft de pensioenuitvoerder deelnemers, gewezen deelnemers, andere
      aanspraakgerechtigden en pensioengerechtigden slechts informatie over de beroepspensioenregeling die door de
      pensioenuitvoerder zelf wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel47
  - number: '47.2'
    text: |-
      De pensioenuitvoerder die een beroepspensioenregeling uitvoert hanteert gelijke voorwaarden voor alle aanbieders
      van reclame-uitingen in informatiedragers van de pensioenuitvoerder. Deze voorwaarden worden op een voor een ieder
      toegankelijke wijze gepubliceerd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel47
  - number: '47.3'
    text: |-
      Indien er in verband met de uitvoering van een beroepspensioenregeling gegevensverstrekking, als bedoeld in
      [artikel 46, tweede lid, onderdeel b][ref1], heeft plaatsgevonden, is het eerste lid van overeenkomstige toepassing
      op de natuurlijke- of rechtspersoon aan wie de gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel46
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '46'
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: '48.1'
    text: |-
      De pensioenuitvoerder informeert de deelnemer bij toetreding tot de beroepspensioenregeling binnen drie maanden
      over de kenmerken van de beroepspensioenregeling, waaronder de mogelijkheid te kiezen voor een variabele uitkering,
      de uitvoering van de beroepspensioenregeling en over persoonlijke omstandigheden die een actie van de deelnemer
      kunnen vergen. De deelnemer wordt daarbij tevens gewezen op de website van de pensioenuitvoerder en op de
      mogelijkheid het pensioenregister te raadplegen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel48
  - number: '48.2'
    text: |-
      De pensioenuitvoerder informeert de deelnemer binnen drie maanden na een wijziging in de beroepspensioenregeling
      over die wijziging en de mogelijkheid om het gewijzigde pensioenreglement op te vragen bij de pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel48
  - number: '48.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld met betrekking tot dit artikel over
      onder meer de te verstrekken informatie.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel48
  - number: '49.1'
    text: 'De pensioenuitvoerder verstrekt de deelnemer jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.a
    text: een opgave van de verworven pensioenaanspraken;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.b
    text: |-
      een opgave van de aan het voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken
      overeenkomstig [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen;


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: 49.1.c
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.d
    text: |-
      informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: 49.1.e
    text: informatie over een variabele uitkering;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.f
    text: informatie over de reglementaire pensioenleeftijd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.g
    text: |-
      een opgave van de reglementair te bereiken pensioenaanspraken, waarbij deze gegevens voor zover het
      ouderdomspensioen betreft, tevens weergegeven worden op basis van een pessimistisch scenario, een verwacht scenario
      en een optimistisch scenario, met de waarschuwing dat de projecties kunnen verschillen van de definitieve hoogte
      van de te ontvangen pensioenuitkeringen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.h
    text: informatie over de premie betaald door de beroepsgenoot;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.i
    text: informatie over garanties;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.j
    text: informatie over het land waar het pensioen is ondergebracht en de toezichthouder waar het pensioen onder valt;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.k
    text: voor zover van toepassing, informatie over de dekkingsgraad naar Nederlandse maatstaf; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: 49.1.l
    text: voor zover van toepassing, informatie over de ingehouden kosten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: '49.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de in het eerste
      lid bedoelde opgaven en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel49
  - number: '50.1'
    text: 'Voor zover van toepassing verstrekt de pensioenuitvoerder de deelnemer bij beëindiging van de deelneming:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel50
  - number: 50.1.a
    text: |-
      een opgave van de opgebouwde pensioenaanspraken op grond van [artikel 66][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel66
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: 50.1.b
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel50
  - number: 50.1.c
    text: informatie die voor de deelnemer specifiek in het kader van de beëindiging relevant is;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel50
  - number: 50.1.d
    text: informatie over omstandigheden die betrekking hebben op het functioneren van de pensioenuitvoerder; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel50
  - number: 50.1.e
    text: |-
      informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: '50.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld met betrekking tot de in het eerste lid
      bedoelde opgave en informatie en de wijze waarop deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel50
  - number: '51.1'
    text: 'De pensioenuitvoerder verstrekt de gewezen deelnemer jaarlijks:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
  - number: 51.1.a
    text: |-
      een opgave van zijn opgebouwde pensioenaanspraken, waarbij deze gegevens voor zover het ouderdomspensioen betreft,
      tevens weergegeven worden op basis van een pessimistisch scenario, een verwacht scenario en een optimistisch
      scenario, met de waarschuwing dat de projecties kunnen verschillen van de definitieve hoogte van de te ontvangen
      pensioenuitkeringen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
  - number: 51.1.b
    text: informatie over toeslagverlening;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
  - number: 51.1.c
    text: |-
      informatie over vermindering van pensioenaanspraken en pensioenrechten op grond van [artikel 129][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel129
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '129'
        hoofdstuk: '5'
  - number: 51.1.d
    text: informatie over een variabele uitkering;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
  - number: 51.1.e
    text: informatie over de reglementaire pensioenleeftijd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
  - number: 51.1.f
    text: informatie over garanties;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel51
  - number: 51.1.g
