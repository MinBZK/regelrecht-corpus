  - number: '214.13'
    text: |-
      [Artikel 57a, eerste lid, onderdelen a en b, en tweede lid, onderdelen d en e][ref1], is niet van toepassing op
      informatie en stukken met betrekking tot tijdvakken gelegen voor 1 januari 2016. Indien de deelnemer, gewezen
      deelnemer, gewezen partner of pensioengerechtigde hierom verzoekt verstrekt de pensioenuitvoerder deze informatie
      en stukken schriftelijk of elektronisch. Artikel 57a, eerste en tweede lid, is voor gewezen deelnemers, gewezen
      partners en pensioengerechtigden van toepassing, indien de beroepsgenoot of gewezen beroepsgenoot op of na 1 juli
      2016 deelnemer was.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel57a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
    references:
