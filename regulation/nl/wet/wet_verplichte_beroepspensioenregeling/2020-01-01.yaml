  - number: '171.2'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld met betrekking tot de uitoefening van de bevoegdheid,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel171
  - number: '174.1'
    text: |-
      Het bedrag van de bestuurlijke boete wordt bepaald bij algemene maatregel van bestuur, met dien verstande dat
      de bestuurlijke boete voor een afzonderlijke overtreding ten hoogste € 4 000 000 bedraagt. Indien tijdens het
      plegen van de overtreding nog geen vijf jaren zijn verlopen sedert het opleggen van een bestuurlijke boete aan de
      overtreder ter zake van eenzelfde overtreding, wordt het bedrag van de bestuurlijke boete, bedoeld in de eerste
      volzin, voor een afzonderlijke overtreding verdubbeld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel174
  - number: '174.2'
    text: |-
      De algemene maatregel van bestuur, bedoeld in het eerste lid, bepaalt bij elke daarin omschreven overtreding het
      bedrag van de deswege op te leggen bestuurlijke boete. De overtredingen worden gerangschikt in categorieën naar
      zwaarte van de overtreding met de daarbij behorende basisbedragen, minimumbedragen en maximumbedragen. Daarbij
      wordt de volgende indeling gebruikt:








                    Categorie


                    Basisbedrag


                    Minimumbedrag


                    Maximumbedrag






                    1


                    € 10 000,–


                    € 0,–


                    € 10 000,–




                    2


                    € 500 000,–


                    € 0,–


                    € 1 000 000,–




                    3


                    € 2 000 000,–


                    € 0,–


                    € 4 000 000,–
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel174
  - number: '174.3'
    text: |-
      In afwijking van het eerste en tweede lid kan de toezichthouder de hoogte van de bestuurlijke boete vaststellen
      op ten hoogste twee keer het bedrag van het voordeel dat de overtreder door de overtreding heeft verkregen indien
      diens voordeel groter is dan € 2 000 000.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel174
  - number: '179.1'
    text: |-
      Indien tegen een besluit tot het opleggen van een bestuurlijke boete bezwaar of beroep wordt aangetekend, schorst
      dit de verplichting tot betaling van de bestuurlijke boete totdat de beroepstermijn is verstreken of, indien beroep
      is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel179
  - number: '179.2'
    text: De schorsing van de verplichting tot betaling schorst niet de berekening van de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel179
  - number: '180.1'
    text: |-
      De toezichthouder maakt een besluit tot het opleggen van een bestuurlijke sanctie openbaar. De openbaarmaking
      geschiedt zodra het besluit onherroepelijk is geworden. Indien tegen het besluit bezwaar, beroep of hoger beroep is
      ingesteld, maakt de toezichthouder de uitkomst daarvan tezamen met het besluit openbaar.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel180
  - number: '180.2'
    text: |-
      In aanvulling op [artikel 5:2, eerste lid, onderdeel a, van de Algemene wet bestuursrecht][ref1] wordt onder
      bestuurlijke sanctie mede verstaan: het door de toezichthouder wegens een overtreding beëindigen of beperken van
      een recht of bevoegdheid alsmede het opleggen van een verbod.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel180
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '180.3'
    text: |-
      De toezichthouder kan besluiten openbaarmaking uit te stellen, er niet toe over te gaan of het in een zodanige vorm
      te doen dat het besluit niet herleidbaar is tot een individuele rechtspersoon of een natuurlijk persoon, indien:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel180
  - number: 180.3.a
    text: |-
      de openbaarmaking van de identiteit van de rechtspersoon of van de identiteit of de persoonlijke gegevens van een
      natuurlijk persoon onevenredig wordt geacht;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel180
  - number: 180.3.b
    text: de openbaarmaking de stabiliteit van de financiële markten in gevaar brengt; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel180
  - number: 180.3.c
    text: |-
      de openbaarmaking een lopend strafrechtelijk onderzoek of een lopend onderzoek door de toezichthouder naar
      mogelijke overtredingen ondermijnt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel180
  - number: '180.4'
    text: |-
      In afwijking van het derde lid blijft openbaarmaking van een besluit tot het opleggen van een bestuurlijke boete
      slechts achterwege, indien openbaarmaking de stabiliteit van de financiële markten in gevaar zou brengen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel180
  - number: '183.1'
    text: |-
      De toezichthouder kan met het oog op de bescherming van de belangen van de pensioen- of aanspraakgerechtigden ter
      openbare kennis brengen, indien nodig onder vermelding van de overwegingen die tot die kennisgeving hebben geleid:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel183
  - number: 183.1.a
    text: |-
      overtreding van de verbodsbepalingen uit deze wet en de overtredingen, bedoeld in [artikel 195][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel195
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '195'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 183.1.b
    text: |-
      het feit ter zake waarvan een aanwijzing als bedoeld in [artikel 166, tweede lid][ref1], is gegeven, het feit dat
      de aanwijzing is gegeven en de door de beroepspensioenfonds te volgen gedragslijn, alsmede de naam, het adres en de
      vestigingsplaats van de beroepspensioenfonds aan wie de aanwijzing is gegeven;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 183.1.c
    text: |-
      het feit dat een herstelplan als bedoeld in [artikel 133][ref1] of [artikel 135][ref2] is ingediend, alsmede de
      naam, het adres en de vestigingsplaats van het beroepspensioenfonds dat het herstelplan heeft ingediend.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel133
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel135
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel183
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '133'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '135'
        hoofdstuk: '5'
  - number: '183.2'
    text: |-
      Bij regeling van Onze Minister kunnen regels worden gesteld ter zake van de uitoefening van de bevoegdheden,
      bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel183
  - number: '184'
    text: |-
      Alvorens over te gaan tot openbaarmaking op grond van [artikel 180, eerste lid][ref1], of
      [artikel 183, eerste lid][ref2], neemt de toezichthouder een besluit tot openbaarmaking. Dit besluit bevat de
      openbaar te maken gegevens, alsmede de wijze waarop en de termijn waarna de openbaarmaking zal plaatsvinden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel183
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel184
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '180'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '183'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '185.1'
    text: |-
      De toezichthouder gaat pas over tot openbaarmaking op grond van [artikel 180, eerste lid][ref1], of
      [artikel 183, eerste lid][ref2], nadat vijf werkdagen zijn verstreken na de dag waarop het besluit tot
      openbaarmaking, bedoeld in [artikel 184][ref3], aan de belanghebbende is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel180
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel183
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel184
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '180'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '183'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '184'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '185.2'
    text: |-
      Indien de belanghebbende verzoekt om een voorlopige voorziening als bedoeld in
      [artikel 8:81 van de Algemene wet bestuursrecht][ref1] om openbaarmaking op grond van
      [artikel 180, eerste lid][ref2], of [artikel 183, eerste lid][ref3], te voorkomen, wordt de openbaarmaking
      opgeschort totdat er een uitspraak is van de voorzieningenrechter.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel180
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel183
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel185
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '180'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '183'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 185a.1
    text: |-
      De toezichthouder beëindigt het openbaar beschikbaar houden van informatie onverwijld indien het besluit tot
      openbaarmaking, bedoeld in [artikel 184][ref1], wordt ingetrokken of door de bestuursrechter onherroepelijk is
      vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel184
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel185a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '184'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 185a.2
    text: |-
      In de gevallen, bedoeld in het eerste lid, biedt de toezichthouder de belanghebbende aan de intrekking of de
      vernietiging openbaar te maken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel185a
  - number: '186'
    text: |-
      De toezichthouder maakt een besluit tot het aanstellen van een bewindvoerder ingevolge deze wet na bekendmaking
      openbaar, tenzij de openbaarmaking van het besluit in strijd is of zou kunnen komen met het doel van het door de
      toezichthouder uit te oefenen toezicht op de naleving van deze wet.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel186
  - number: '187'
    text: |-
      De vergunning, bedoeld in [artikel 25, eerste lid, onderdeel a][ref1], wordt op aanvraag door de toezichthouder
      verleend wanneer het beroepspensioenfonds:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel25
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 187.a
    text: |-
      is ingeschreven in het register, bedoeld in [artikel 204][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel204
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '204'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 187.b
    text: |-
      voldoet aan de [artikelen 110c][ref1], [121][ref2], [138][ref3] en [142, tweede lid][ref4] en titel IV van
      [richtlijn 2016/2341](32016L2341)/EU.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel110c
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel121
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel138
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel187
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 110c
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '121'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '138'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '142'
        hoofdstuk: '5'
  - number: '188'
    text: |-
      De toezichthouder kan de vergunning, bedoeld in [artikel 25, eerste lid, onderdeel a][ref1], geheel of gedeeltelijk
      intrekken of daaraan nadere voorschriften verbinden wanneer:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel25
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 188.a
    text: |-
      het pensioenfonds niet langer voldoet aan [artikel 187][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel187
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel188
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '187'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 188.b
    text: |-
      de bij de aanvraag verstrekte gegevens onjuist of onvolledig zijn en de verstrekking van de juiste of volledige
      gegevens tot een andere beschikking op de aanvraag tot verlening van de vergunning zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel188
  - number: 188.c
    text: de verlening van de vergunning anderszins onjuist was en het fonds dit wist of behoorde te weten; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel188
  - number: 188.d
    text: |-
      van de vergunning gedurende twee jaren, na de dagtekening van de beschikking waarbij de vergunning is verleend,
      geen gebruik is gemaakt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel188
  - number: '189.1'
    text: |-
      De toezichthouder doet binnen drie maanden na ontvangst van de gegevens, bedoeld in [artikel 26, tweede lid][ref1],
      mededeling van deze gegevens aan de bevoegde autoriteiten van de lidstaat waar de zelfstandige of
      beroepsgenoot is gevestigd, tenzij het beroepspensioenfonds niet beschikt over de vergunning, bedoeld in
      [artikel 25, eerste lid, onderdeel a][ref2], of de toezichthouder reden heeft te betwijfelen dat de administratieve
      structuur of de financiële positie van het beroepspensioenfonds, of de deskundigheid en betrouwbaarheid van de
      personen die het fonds besturen met de in die lidstaat voorgenomen activiteiten verenigbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel26
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel25
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel189
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '189.2'
    text: |-
      De toezichthouder doet gelijktijdig mededeling aan het fonds van de verstrekking van de gegevens aan de bevoegde
      autoriteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel189
  - number: '189.3'
    text: |-
      De toezichthouder doet mededeling aan het fonds van informatie over de toepasselijke bepalingen van sociale en
      arbeidswetgeving, ontvangen van de bevoegde autoriteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel189
  - number: '190'
    text: |-
      Een beroepspensioenfonds kan na ontvangst van de mededeling, bedoeld in [artikel 189, derde lid][ref1], dan
      wel nadat zes weken zijn verstreken na ontvangst van de mededeling, bedoeld in [artikel 189, tweede lid][ref2],
      beginnen met het uitvoeren van de voorgenomen pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel189
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel190
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '189'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '189'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '191.1'
    text: |-
      De toezichthouder verbiedt een beroepspensioenfonds bijdragen te ontvangen van een zelfstandige of beroepsgenoot
      die is gevestigd in een andere lidstaat wanneer de toezichthouder reden heeft tot twijfel als bedoeld in
      [artikel 189, eerste lid][ref1]. Het verbod wordt uitgevaardigd binnen drie maanden na ontvangst van de gegevens,
      bedoeld in [artikel 26, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel189
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel26
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '189'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '191.2'
    text: |-
      De toezichthouder kan een fonds verbieden nog langer bijdragen te ontvangen van een zelfstandige of beroepsgenoot
      die is gevestigd in een andere lidstaat wanneer door de bevoegde autoriteiten van de lidstaat waarvan de voor
      bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is, melding heeft gemaakt van een
      door het fonds gemaakte inbreuk op de toepasselijke sociale en arbeidswetgeving.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel191
  - number: '191.3'
    text: |-
      De toezichthouder legt een verbod als bedoeld in dit artikel op in de vorm van een aanwijzing als bedoeld in
      [artikel 166][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel191
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '192'
    text: |-
      De toezichthouder neemt, in coördinatie met de bevoegde autoriteiten van de lidstaat waarvan de voor
      bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de beroepspensioenregeling,
      de nodige maatregelen om ervoor te zorgen dat een beroepspensioenfonds een einde maakt aan een vastgestelde inbreuk
      op de toepasselijke regelgeving.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel192
  - number: '193'
    text: |-
      Het is een pensioeninstelling uit een andere lidstaat verboden bijdragen te aanvaarden van een in Nederland
      gevestigde zelfstandige of beroepsgenoot zonder:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel193
  - number: 193.a
    text: |-
      een daartoe verleende vergunning van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een
      andere lidstaat haar zetel heeft; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel193
  - number: 193.b
    text: |-
      de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling zetel heeft in kennis te hebben gesteld van het
      voornemen een beroepspensioenregeling uit te voeren voor een in Nederland gevestigde zelfstandige of beroepsgenoot.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel193
  - number: 193a
    text: |-
      Een pensioeninstelling uit een andere lidstaat neemt bij de uitvoering van een beroepspensioenregeling waarop de
      Nederlandse sociale en arbeidswetgeving van toepassing is deze wetgeving in acht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel193a
  - number: '194.1'
    text: |-
      De toezichthouder informeert, binnen zes weken na de datum van ontvangst van gegevens als bedoeld in
      [artikel 26, tweede lid][ref1], de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een andere
      lidstaat haar zetel heeft en die deze gegevens hebben verstrekt, over de bepalingen van de Nederlandse sociale
      en arbeidswetgeving die van toepassing zijn op de beroepspensioenregeling waaraan wordt bijgedragen door de in
      Nederland gevestigde zelfstandige of beroepsgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel26
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel194
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '1'
  - number: '194.2'
    text: |-
      De toezichthouder stelt de bevoegde autoriteiten, bedoeld in het eerste lid, in kennis van elke significante
      wijziging in de op de beroepspensioenregeling toepasselijke sociale en arbeidswetgeving die gevolgen kan hebben
      voor de kenmerken van de pensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel194
  - number: '195'
    text: |-
      Wanneer de toezichthouder blijkt dat een pensioeninstelling uit een andere lidstaat bij de uitvoering van een
      pensioenregeling waaraan wordt bijgedragen door een in Nederland gevestigde zelfstandige of beroepsgenoot in
      strijd met de Nederlandse sociale en arbeidswetgeving handelt, stelt de toezichthouder de bevoegde autoriteiten
      van de lidstaat waar de pensioeninstelling haar zetel heeft hiervan onverwijld in kennis, onder mededeling van deze
      kennisgeving aan de pensioeninstelling uit een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel195
  - number: '196.1'
    text: |-
      Indien een pensioeninstelling uit een andere lidstaat inbreuk blijft maken op de op de pensioenregeling
      toepasselijke Nederlandse sociale en arbeidswetgeving, in weerwil van de door de bevoegde autoriteiten van de
      lidstaat waar de pensioeninstelling uit een andere lidstaat haar zetel heeft getroffen maatregelen of omdat
      die bevoegde autoriteiten geen passende maatregelen hebben getroffen, kan de toezichthouder, na die bevoegde
      autoriteiten daarvan in kennis te hebben gesteld, passende maatregelen nemen om de inbreuk op de toepasselijke
      regelgeving door de pensioeninstelling te beëindigen en, voorzover zulks volstrekt noodzakelijk is, de
      pensioeninstelling te beletten activiteiten te verrichten voor de Nederlandse bijdragende zelfstandige of
      beroepsgenoot.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel196
  - number: '196.2'
    text: |-
      De toezichthouder kan, ter uitvoering van het eerste lid, de bevoegdheden, bedoeld in de [artikelen 166][ref1],
      [170][ref2] en [171][ref3] toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel166
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel170
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel171
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '170'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '171'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '196.3'
    text: |-
      De toezichthouder kan, na toepassing van [artikel 195][ref1], de bevoegdheden, bedoeld in de [artikelen 166][ref2],
      [170][ref3] en [171][ref4] toepassen wanneer een pensioeninstelling uit een andere lidstaat [artikel 193][ref5]
      niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel195
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel166
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel170
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel171
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel193
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel196
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '195'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '170'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '171'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '193'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '197.1'
    text: |-
      De toezichthouder verstrekt op verzoek, kosteloos, aan Onze Minister alle gegevens en inlichtingen die voor
      het door Onze Minister te voeren beleid inzake pensioen en het onderzoek naar de toereikendheid van deze wet
      noodzakelijk zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel197
  - number: '197.2'
    text: |-
      De toezichthouder beheert ten behoeve van de uitvoering van de in het eerste lid bedoelde taak een databank,
      stelt een informatieplan en een beheersplan op en zendt deze plannen aan Onze Minister. De toezichthouder zendt
      wijzigingen in het informatieplan en het beheersplan aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel197
  - number: '197.3'
    text: |-
      Pensioenuitvoerders verstrekken de toezichthouder desgevraagd en kosteloos alle gegevens en inlichtingen die deze
      nodig heeft voor het vervullen van de in het eerste lid beschreven taak.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel197
  - number: '197.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de in de databank op te nemen
      gegevens en inlichtingen, de wijze waarop de gegevens en inlichtingen worden verwerkt en beheerd en de instellingen
      aan wie gegevens uit de databank worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel197
  - number: '198.1'
    text: |-
      Het is een ieder die uit hoofde van de toepassing van deze wet of van ingevolge deze wet genomen besluiten enige
      taak vervult of heeft vervuld, verboden van vertrouwelijke gegevens of inlichtingen die ingevolge deze wet dan wel
      ingevolge [afdeling 5.2 van de Algemene wet bestuursrecht][ref1] zijn verstrekt of verkregen of van een persoon of
      instantie als bedoeld in [artikel 197, derde lid][ref2], onderscheidenlijk [199, eerste lid][ref3], zijn ontvangen,
      verder of anders gebruik te maken of daaraan verder of anders bekendheid te geven dan voor de uitvoering van zijn
      taak of door deze wet wordt geëist.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling5.2
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel197
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel199
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel198
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: '5.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '197'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '199'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '198.2'
    text: |-
      In afwijking van het eerste lid kan de toezichthouder met gebruikmaking van vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van zijn taak op grond van deze wet, mededelingen doen, indien deze niet kunnen worden
      herleid tot afzonderlijke personen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel198
  - number: '198.3'
    text: |-
      In afwijking van het eerste lid publiceert de toezichthouder geaggregeerde statistische gegevens over de
      voornaamste aspecten van de toepassing van het prudentieel kader.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel198
  - number: '198.4'
    text: |-
      In afwijking van het eerste lid kan de toezichthouder met gebruikmaking van vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van zijn taak op grond van deze wet, vergelijkbare, niet geaggregeerde statistische
      gegevens van beroepspensioenfondsen publiceren, teneinde inzicht te geven in de financiële situatie van deze
      beroepspensioenfondsen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel198
  - number: '198.5'
    text: |-
      Bij algemene maatregel van bestuur worden nadere regels gesteld over de gegevens die door de toezichthouder
      gepubliceerd kunnen worden, over de procedure bij publicatie en de te hanteren termijnen voorafgaand daaraan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel198
  - number: '199.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van zijn taak op grond van deze wet, verstrekken aan de andere toezichthouder of een
      toezichthoudende instantie, tenzij:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 199.1.a
    text: het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.1.b
    text: |-
      het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      pensioenuitvoerders;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.1.c
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.1.d
    text: de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.1.e
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met
      de belangen die deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.1.f
    text: |-
      onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: '199.2'
    text: |-
      Voorzover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de toezichthouder deze niet aan de andere toezichthouder of aan een andere toezichthoudende
      instantie, tenzij de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: '199.3'
    text: |-
      Indien een toezichthoudende instantie aan de toezichthouder die de vertrouwelijke gegevens of inlichtingen op grond
      van het eerste of tweede lid heeft verstrekt, verzoekt om die vertrouwelijke gegevens of inlichtingen te mogen
      gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthouder dat verzoek slechts in:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.3.a
    text: indien het beoogde gebruik niet in strijd is met het eerste of tweede lid; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.3.b
    text: |-
      voorzover die toezichthoudende instantie op een andere wijze dan in deze wet voorzien vanuit Nederland met
      inachtneming van de daarvoor geldende wettelijke procedures voor dat andere doel de beschikking over die gegevens
      of inlichtingen zou kunnen verkrijgen; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199.3.c
    text: |-
      na overleg met Onze Minister van Veiligheid en Justitie, indien het in de aanhef bedoelde verzoek betrekking heeft
      op een onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: '199.4'
    text: |-
      De Autoriteit Financiële Markten dan wel het organisatieonderdeel van De Nederlandsche Bank N.V. dat is belast
      met de in [artikel 146, derde lid][ref1], genoemde taak kan vertrouwelijke informatie of gegevens verstrekken aan
      het organisatieonderdeel van De Nederlandsche Bank N.V. dat is belast met het vervullen van haar monetaire taak,
      voorzover de vertrouwelijke gegevens of inlichtingen dienstig zijn voor de uitoefening van die taak.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel146
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '146'
        hoofdstuk: '6'
        paragraaf: '1'
  - number: '199.5'
    text: |-
      Het eerste tot en met derde lid is van overeenkomstige toepassing op het uitwisselen van vertrouwelijke gegevens of
      inlichtingen tussen de met verschillende taken belaste organisatieonderdelen van de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199
  - number: 199a
    text: |-
      De toezichthouder kan, in afwijking van [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van zijn taak op grond van deze wet, verstrekken aan het Europees Comité voor
      systeemrisico’s, de Europese Autoriteit voor verzekeringen en bedrijfspensioenen, de Europese Bankautoriteit en
      de Europese Autoriteit voor effecten en markten, voor zover de vertrouwelijke gegevens of inlichtingen dienstig
      zijn voor de uitoefening van hun respectieve taken. [Artikel 199, eerste tot en met derde lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel199
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '199'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 199b.1
    text: |-
      De toezichthouder deelt de gegevens uit het register, bedoeld in [artikel 204][ref1], mee aan de Europese
      Autoriteit voor verzekeringen en bedrijfspensioenen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel204
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199b
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '204'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 199b.2
    text: |-
      De toezichthouder stelt de Europese Autoriteit voor verzekeringen en bedrijfspensioenen in kennis van een besluit
      om de activiteiten van een beroepspensioenfonds te verbieden of beperken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199b
  - number: 199b.3
    text: |-
      De toezichthouder neemt bij de uitvoering van haar taak op grond van de wet artikel 32, derde lid, [Richtlijn
      2016/97](32016L0097) van het Europees Parlement en de Raad van 20 januari 2016 betreffende verzekeringsdistributie
      (herschikking) (PbEU 2016, L 26) in acht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199b
  - number: 199c
    text: |-
      De toezichthouder verstrekt, in afwijking van [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of
      inlichtingen verkregen bij de uitvoering van zijn taak op grond van deze wet, aan een tijdelijke enquêtecommissie
      van het Europees Parlement, bedoeld in artikel 226 van het Verdrag betreffende de werking van de Europese Unie.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel199c
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '200.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de uitvoering van de hem ingevolge deze wet opgedragen taak, verstrekken aan een persoon als bedoeld
      in de onderdelen a, b, c, d of e voorzover de gegevens of inlichtingen dienstig zijn voor de uitoefening van zijn
      taak:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 200.1.a
    text: |-
      een bewindvoerder die ingevolge [artikel 168][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel168
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '168'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: 200.1.b
    text: |-
      een rechter-commissaris die ingevolge [artikel 223a van de Faillissementswet][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel223a
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: 223a
  - number: 200.1.c
    text: |-
      een bewindvoerder die ingevolge [artikel 215, tweede lid, van de Faillissementswet][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel215
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '215'
  - number: 200.1.d
    text: |-
      een rechter-commissaris die ingevolge [artikel 14 van de Faillissementswet][ref1] is benoemd;


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel14
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '14'
  - number: 200.1.e
    text: |-
      een curator die ingevolge [artikel 14 van de Faillissementswet][ref1] is aangesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001860#Artikel14
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0001860
        artikel: '14'
  - number: '200.2'
    text: 'De toezichthouder verstrekt geen vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste lid:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
  - number: 200.2.a
    text: |-
      indien de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen
      komen met de belangen die deze wet beoogt te beschermen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
  - number: 200.2.b
    text: |-
      indien de vertrouwelijke gegevens of inlichtingen zijn verkregen van de andere toezichthouder of een
      toezichthoudende instantie, en deze andere toezichthouder of die toezichthoudende instantie niet instemt met het
      verstrekken van de vertrouwelijke gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
  - number: '200.3'
    text: |-
      De curator die is aangesteld in het faillissement van een pensioenuitvoerder kan, in afwijking van
      [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen als bedoeld in het eerste lid verstrekken
      aan de rechtbank, voorzover die geen betrekking hebben op een onderneming die betrokken is of betrokken is geweest
      bij een poging de pensioenuitvoerder in staat te stellen zijn activiteiten voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '200.4'
    text: |-
      [Artikel 198, eerste lid][ref1], laat onverlet de toepasselijkheid van de bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref2] welke betrekking hebben op het als getuige of als partij in een
      comparitie van partijen dan wel als deskundige in burgerlijke zaken afleggen van een verklaring omtrent gegevens
      of inlichtingen verkregen bij de vervulling van zijn ingevolge deze wet opgedragen taak, voorzover het gaat om
      vertrouwelijke gegevens of inlichtingen omtrent een pensioenuitvoerder die in staat van faillissement is verklaard
      of op grond van een rechterlijke uitspraak is ontbonden. De vorige volzin is niet van toepassing op vertrouwelijke
      gegevens of inlichtingen die betrekking hebben op een onderneming die betrokken is of betrokken is geweest bij een
      poging de desbetreffende pensioenuitvoerder in staat te stellen zijn activiteiten voort te zetten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0001827
  - number: '200.5'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 198, eerste lid][ref1], gegevens over het aantal deelnemers bij
      een pensioenuitvoerder verstrekken aan de op grond van [artikel 62, zesde lid][ref2], aangewezen instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel62
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel200
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '62'
        hoofdstuk: '3'
        paragraaf: '2.2'
  - number: '201.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 198][ref1], vertrouwelijke gegevens of inlichtingen verkregen
      bij de uitvoering van de hem ingevolge deze wet opgedragen taak, verstrekken aan een instantie die is belast met
      de uitoefening van strafvorderlijke bevoegdheden of aan een deskundige die door een dergelijke instantie met een
      opdracht is belast, voor zover de verlangde gegevens of inlichtingen noodzakelijk zijn voor de uitvoering van die
      opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '201.2'
    text: |-
      Indien de instantie, bedoeld in het eerste lid, het voornemen heeft toepassing te geven aan de bevoegdheid
      tot het bij de toezichthouder vorderen van de uitlevering van een voor inbeslagneming vatbaar voorwerp
      of aan de bevoegdheid tot het vorderen van de inzage of een afschrift van bescheiden als bedoeld in
      [artikel 96a][ref1], [105][ref2] of [126a van het Wetboek van Strafvordering][ref3], of [artikel 18][ref4] of
      [19 van de Wet op de economische delicten][ref5], en de vordering betreft vertrouwelijke gegevens of inlichtingen
      als bedoeld in [artikel 198, eerste lid][ref6], stelt die instantie voorafgaand aan de uitoefening van haar
      bevoegdheid de toezichthouder in de gelegenheid zijn zienswijze hierover kenbaar te maken.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel96a
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel126a
      [ref4]: https://wetten.overheid.nl/BWBR0002063#Artikel18
      [ref5]: https://wetten.overheid.nl/BWBR0002063#Artikel19
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel198
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel201
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: 96a
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '105'
      - id: ref3
        bwb_id: BWBR0001903
        artikel: 126a
      - id: ref4
        bwb_id: BWBR0002063
        artikel: '18'
      - id: ref5
        bwb_id: BWBR0002063
        artikel: '19'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '202.1'
    text: |-
      De toezichthouder kan, in afwijking van [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of inlichtingen
      verkregen bij de vervulling van de hem ingevolge deze wet opgedragen taak, verstrekken aan:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 202.1.a
    text: |-
      een accountant die het onderzoek naar de staten uitvoert, bedoeld in [artikel 142, vijfde lid][ref1], of die is
      belast met de wettelijke controle van de jaarrekening van een pensioenuitvoerder, voorzover de vertrouwelijke
      gegevens of inlichtingen betrekking hebben op die pensioenuitvoerder en noodzakelijk zijn voor de controle;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '142'
        hoofdstuk: '5'
  - number: 202.1.b
    text: |-
      een actuaris die het onderzoek naar de staten uitvoert, bedoeld in [artikel 142, vierde lid][ref1], of die is
      belast met de wettelijke controle van een pensioenuitvoerder, voorzover de vertrouwelijke gegevens of inlichtingen
      betrekking hebben op die pensioenuitvoerder en noodzakelijk zijn voor de controle; of


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '142'
        hoofdstuk: '5'
  - number: 202.1.c
    text: |-
      de Europese Centrale Bank, een buitenlandse nationale centrale bank of een andere buitenlandse instantie die
      is belast met een soortgelijke taak, handelend in haar hoedanigheid van monetaire autoriteit, voor zover de
      vertrouwelijke gegevens of inlichtingen dienstig zijn voor de uitoefening van haar wettelijke taken, waaronder de
      monetaire taak en de daarmee samenhangende beschikbaarstelling van liquide middelen, de uitoefening van toezicht op
      betalings- clearing- en afwikkelsystemen en de waarborging van de stabiliteit van het financiële stelsel, of voor
      de taakuitoefening van een andere buitenlandse instantie die is belast met het toezicht op betalingssystemen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: '202.2'
    text: 'De toezichthouder verstrekt geen vertrouwelijke gegevens of inlichtingen op grond van het eerste lid indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.2.a
    text: het doel waarvoor de vertrouwelijke gegevens of inlichtingen zullen worden gebruikt onvoldoende bepaald is;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.2.b
    text: |-
      het beoogde gebruik van de vertrouwelijke gegevens of inlichtingen niet past in het kader van het toezicht op
      pensioenuitvoerders;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.2.c
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen zich niet zou verdragen met de Nederlandse wet of de
      openbare orde;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.2.d
    text: de geheimhouding van de vertrouwelijke gegevens of inlichtingen niet in voldoende mate is gewaarborgd;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.2.e
    text: |-
      de verstrekking van de vertrouwelijke gegevens of inlichtingen redelijkerwijs in strijd is of zou kunnen komen met
      de belangen die deze wet beoogt te beschermen; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.2.f
    text: |-
      onvoldoende is gewaarborgd dat de vertrouwelijke gegevens of inlichtingen niet zullen worden gebruikt voor een
      ander doel dan waarvoor deze worden verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: '202.3'
    text: |-
      Voorzover de gegevens of inlichtingen, bedoeld in het eerste lid, zijn verkregen van een toezichthoudende
      instantie, verstrekt de toezichthouder deze niet aan de andere toezichthouder of aan een andere toezichthoudende
      instantie, tenzij de toezichthoudende instantie waarvan de gegevens of inlichtingen zijn verkregen uitdrukkelijk
      heeft ingestemd met de verstrekking van de gegevens of inlichtingen en in voorkomend geval heeft ingestemd met het
      gebruik voor een ander doel dan waarvoor de gegevens of inlichtingen zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: '202.4'
    text: |-
      Indien een instantie of persoon als bedoeld in het eerste lid aan de toezichthouder die de vertrouwelijke gegevens
      of inlichtingen op grond van dat lid heeft verstrekt, verzoekt om die vertrouwelijke gegevens of inlichtingen te
      mogen gebruiken voor een ander doel dan waarvoor zij zijn verstrekt, willigt de toezichthouder dat verzoek slechts
      in:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.4.a
    text: indien het beoogde gebruik niet in strijd is met het eerste, tweede of derde lid; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.4.b
    text: |-
      voorzover die instantie of persoon op een andere wijze dan in deze wet voorzien met inachtneming van de daarvoor
      geldende wettelijke procedures voor dat andere doel de beschikking over die gegevens of inlichtingen zou kunnen
      verkrijgen; en
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202.4.c
    text: |-
      na overleg met Onze Minister van Veiligheid en Justitie indien het in de aanhef bedoelde verzoek betrekking heeft
      op een onderzoek naar strafbare feiten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202
  - number: 202a.1
    text: |-
      De toezichthouder verstrekt, in afwijking van [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of
      inlichtingen verkregen bij de uitvoering van de hem ingevolge deze wet opgedragen taak, aan de Algemene
      Rekenkamer, voor zover de gegevens of inlichtingen naar het oordeel van de Algemene Rekenkamer noodzakelijk zijn
      voor de uitoefening van haar wettelijke taak op grond van [artikel 7.24 van de Comptabiliteitswet 2016][ref2].
      [Artikel 202, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0039429#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel202
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0039429
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '202'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 202a.2
    text: |-
      De Algemene Rekenkamer is verplicht tot geheimhouding van de op grond van het eerste lid ontvangen vertrouwelijke
      gegevens of inlichtingen en kan die slechts openbaar maken indien deze niet herleid kunnen worden tot afzonderlijke
      personen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202a
  - number: 202b.1
    text: |-
      De toezichthouder verstrekt, in afwijking van [artikel 198, eerste lid][ref1], vertrouwelijke gegevens of
      inlichtingen verkregen bij de uitvoering van de hem ingevolge deze wet opgedragen taak, aan een commissie
      als bedoeld in [artikel 2, tweede lid, van de Wet op de parlementaire enquête 2008][ref2], voor zover de
      gegevens of inlichtingen naar het oordeel van die commissie noodzakelijk zijn voor de vervulling van haar taak.
      [Artikel 202, derde lid][ref3], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel198
      [ref2]: https://wetten.overheid.nl/BWBR0023825#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel202
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202b
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '198'
        hoofdstuk: '6'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0023825
        artikel: '2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '202'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: 202b.2
    text: |-
      De commissie, bedoeld in het eerste lid, is verplicht tot geheimhouding van de op grond van het eerste lid
      ontvangen vertrouwelijke gegevens of inlichtingen en kan die slechts openbaar maken indien deze niet te herleiden
      zijn tot afzonderlijke personen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel202b
  - number: '203'
    text: De toezichthouder organiseert ten minste één keer per jaar een overleg met belanghebbenden aangaande pensioenen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel203
  - number: '204'
    text: |-
      De toezichthouder beheert een register waarin alle beroepspensioenfondsen met zetel in Nederland worden
      ingeschreven. In het register wordt, indien van toepassing, vermeld in welke lidstaten een fonds pensioenregelingen
      uitvoert.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel204
  - number: '205'
    text: |-
      De toezichthouder is verplicht nauw samen te werken met de Europese Commissie en de bevoegde autoriteiten uit
      andere lidstaten dan Nederland, overeenkomstig [richtlijn 2016/2341](32016L2341)/EU.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel205
  - number: '206.1'
    text: |-
      De toezichthouder kan desgevraagd in bijzondere gevallen van het bepaalde bij of krachtens
      [artikel 142, eerste en tweede lid][ref1], ontheffing verlenen, indien hij van oordeel is, dat de belangen van de
      personen die betrokken zijn bij een pensioenregeling voldoende gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel142
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel206
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '142'
        hoofdstuk: '5'
  - number: '206.2'
    text: De ontheffing wordt verleend bij beschikking.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel206
  - number: '207.1'
    text: De ontheffing kan onder beperkingen worden verleend.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel207
  - number: '207.2'
    text: Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel207
  - number: '207.3'
    text: 'De ontheffing kan worden ingetrokken wanneer:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel207
  - number: 207.3.a
    text: een of meer van de redenen waarom zij is verleend is of zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel207
  - number: 207.3.b
    text: |-
      na de verlening zich zodanige feiten of omstandigheden hebben voorgedaan of zijn gebleken dat, indien deze ook ten
      tijde van de verlening bekend waren geweest, de ontheffing niet of niet in die vorm zou zijn verleend;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel207
  - number: 207.3.c
    text: een of meer van de daaraan verbonden voorschriften niet wordt nageleefd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel207
  - number: '207.4'
    text: De toezichthouder stelt beleidsregels vast over de verlening van ontheffing.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel207
  - number: '208.1'
    text: |-
      Onze Minister zendt in aanvulling op [artikel 18, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref1]
      alle van belang zijnde door de toezichthouder aan Onze Minister uitgebrachte toezichtrapportages, in de vorm waarin
      zij aan hem zijn voorgelegd, zo nodig voorzien van zijn oordeel, aan de Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel18
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '18'
  - number: '208.2'
    text: |-
      De verplichting om elke vijf jaar een verslag aan beide kamers der Staten-Generaal te zenden ten behoeve van de
      beoordeling van de doelmatigheid en doeltreffendheid van het functioneren van een zelfstandig bestuursorgaan,
      bedoeld in [artikel 39, eerste lid, van de Kaderwet zelfstandige bestuursorganen][ref1], berust ten aanzien van het
      functioneren van de toezichthouder op grond van deze wet bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel39
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel208
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '39'
  - number: '209.1'
    text: |-
      Overtreding van de [artikelen 107, tweede en derde lid][ref1], [162][ref2], [164][ref3],
      [165, eerste tot en met vierde lid][ref4], en [167, vijfde lid, onderdeel a][ref5], wordt gestraft met een
      geldboete van de tweede categorie. Overtreding van [artikel 166, eerste lid][ref6], wordt gestraft met een
      geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel107
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel162
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel164
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel165
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel167
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel166
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel209
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '107'
        hoofdstuk: '4'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '162'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '164'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '165'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '167'
        hoofdstuk: '6'
        paragraaf: '4'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '166'
        hoofdstuk: '6'
        paragraaf: '4'
  - number: '209.2'
    text: |-
      Met een geldboete van de tweede categorie wordt gestraft overtreding van voorschriften, krachtens deze wet bij
      algemene maatregel van bestuur gegeven, voor zover uitdrukkelijk als strafbaar feit in de zin dezer wet aangeduid.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel209
  - number: '209.3'
    text: De in of krachtens dit artikel strafbaar gestelde feiten zijn overtredingen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel209
  - number: '210.1'
    text: |-
      Indien een premie na aanmaning per aangetekende brief niet of niet geheel binnen dertig dagen wordt voldaan
      kan de pensioenuitvoerder, vertegenwoordigd door de personen die op grond van de statuten bevoegd zijn de
      pensioenuitvoerder in rechte te vertegenwoordigen, de premie, wettelijke of reglementaire renten of reglementaire
      boeten en de aanmaningskosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: '210.2'
    text: |-
      De in het eerste lid bedoelde aanmaning vermeldt de inhoud van het eerste en vierde tot en met het achtste lid van
      dit artikel en van [artikel 7, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel7
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '7'
        hoofdstuk: '2'
  - number: '210.3'
    text: 'Het dwangbevel houdt in:'
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: 210.3.a
    text: de naam en de zetel van de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: 210.3.b
    text: de namen van de vertegenwoordigers, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: 210.3.c
    text: de naam, het beroep, de woonplaats en het adres van de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: 210.3.d
    text: |-
      het bedrag van de achterstallige premies, dat van de wettelijke of reglementaire renten of reglementaire boeten,
      voorzover daarop aanspraak wordt gemaakt en de aanmaningskosten voorzover daarop aanspraak wordt gemaakt, alsmede
      de gronden waarop de vordering berust;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: 210.3.e
    text: de datum waarop de in het eerste lid bedoelde aanmaning is geschied.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: '210.4'
    text: |-
      Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '210.5'
    text: |-
      Het dwangbevel kan niet ten uitvoer worden gelegd voordat acht dagen na de betekening daarvan zijn verstreken. De
      persoon aan wie het dwangbevel is gericht kan gedurende dertig dagen na de betekening door het instellen van een
      vordering tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de kantonrechter van de plaats waar
      hij woont. Indien de persoon buiten Nederland woont dan wel in Nederland geen vaste woonplaats heeft, kan hij in
      verzet komen bij de kantonrechter van de rechtbank van het arrondissement waarin het kantoor is gevestigd van de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: '210.6'
    text: Het verzet schorst de tenuitvoerlegging van het dwangbevel voorzover deze door het verzet wordt bestreden.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: '210.7'
    text: |-
      Indien het verzet zich richt of mede richt tegen de hoogte van de gevorderde reglementaire rente of reglementaire
      boete, kan de rechter indien deze hem bovenmatig voorkomt, de bedongen reglementaire rente of reglementaire boete
      matigen, met dien verstande dat deze niet minder kan bedragen dan de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: '210.8'
    text: Het recht tot invorderen bij dwangbevel strekt zich uit tot de kosten van vervolging.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel210
  - number: '211'
    text: |-
      Voor burgerlijke rechtsvorderingen ter zake van deelneming in en uitkering op grond van een beroepspensioenregeling
      is de kantonrechter bevoegd.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211
  - number: 211a.1
    text: |-
      Het verantwoordingsorgaan kan bij de ondernemingskamer van het gerechtshof Amsterdam beroep instellen tegen een
      besluit betreffende een aangelegenheid als bedoeld in [artikel 110e, derde lid][ref1], indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel110e
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 110e
        hoofdstuk: '4'
  - number: 211a.1.a
    text: |-
      het verantwoordingsorgaan met betrekking tot dat besluit niet voorafgaand in de gelegenheid is gesteld advies uit
      te brengen;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.1.b
    text: dat besluit niet in overeenstemming is met het advies van het verantwoordingsorgaan; of
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.1.c
    text: |-
      feiten en omstandigheden bekend zijn geworden die, waren zij aan het verantwoordingsorgaan bekend geweest ten tijde
      van het uitbrengen van zijn advies, aanleiding zouden kunnen zijn geweest om dat advies niet uit te brengen zoals
      het is uitgebracht.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.2
    text: |-
      Het beroep wordt ingediend bij verzoekschrift, binnen acht weken nadat het verantwoordingsorgaan van het besluit in
      kennis is gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.3
    text: Het beroepspensioenfonds wordt van het ingestelde beroep in kennis gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.4
    text: |-
      Het verzoek is niet-ontvankelijk indien met betrekking tot dezelfde aangelegenheid een aanwijzing is gegeven door
      de toezichthouder.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.5
    text: |-
      Het beroep kan uitsluitend worden ingesteld ter zake dat het beroepspensioenfonds bij afweging van de betrokken
      belangen niet in redelijkheid tot zijn besluit had kunnen komen.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.6
    text: |-
      De ondernemingskamer behandelt het verzoek met de meeste spoed. Alvorens te beslissen kan zij, ook ambtshalve,
      deskundigen, alsmede bij het beroepspensioenfonds werkzame personen horen. Indien de ondernemingskamer het beroep
      gegrond bevindt, kan zij, indien het verantwoordingsorgaan daarom heeft verzocht, een of meer van de volgende
      voorzieningen treffen:
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.6.a
    text: |-
      het opleggen van de verplichting aan het beroepspensioenfonds om het besluit geheel of ten dele in te trekken,
      alsmede om aan te wijzen gevolgen van dat besluit ongedaan te maken;
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.6.b
    text: |-
      het opleggen van een verbod aan het beroepspensioenfonds om handelingen te verrichten of te doen verrichten ter
      uitvoering van het besluit of onderdelen daarvan.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.7
    text: |-
      Het beroepspensioenfonds voldoet aan de getroffen voorziening; een voorziening kan door derden verworven rechten
      echter niet aantasten.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.8
    text: |-
      De ondernemingskamer kan haar beslissing op een verzoek tot het treffen van voorzieningen voor een door haar te
      bepalen termijn aanhouden, indien beide partijen daar om verzoeken, dan wel indien het beroepspensioenfonds op zich
      neemt het besluit waartegen beroep is ingesteld, in te trekken of te wijzigen, of bepaalde gevolgen van het besluit
      ongedaan te maken.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.9
    text: |-
      Nadat het verzoekschrift is ingediend kan de ondernemingskamer, zo nodig onverwijld, voorlopige voorzieningen
      treffen. De derde zin van het zesde lid en het zevende lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.10
    text: Van een beschikking van de ondernemingskamer staat uitsluitend beroep in cassatie open.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: 211a.11
    text: |-
      De kosten van het voeren van rechtsgedingen door het verantwoordingsorgaan komen ten laste van het
      beroepspensioenfonds indien zij redelijkerwijs noodzakelijk zijn voor de vervulling van de taak van het
      verantwoordingsorgaan en het beroepspensioenfonds van de te maken kosten vooraf in kennis is gesteld. In
      rechtsgedingen tussen het beroepspensioenfonds en het verantwoordingsorgaan kan het verantwoordingsorgaan niet in
      de proceskosten worden veroordeeld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel211a
  - number: '212.1'
    text: |-
      Het verantwoordingsorgaan of de raad van toezicht kan een verzoek in het kader van het recht van enquête, bedoeld
      in [afdeling 2 van titel 8 van Boek 2 van het Burgerlijk Wetboek][ref1], indienen bij de ondernemingskamer van het
      gerechtshof Amsterdam.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Afdeling2
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0003045
        afdeling: '2'
  - number: '212.2'
    text: |-
      De [artikelen 346 tot en met 359 van Boek 2 van het Burgerlijk Wetboek][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel346
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel212
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '346'
  - number: '212.3'
    text: |-
      De kosten die verband houden met het indienen van het in het eerste lid bedoelde verzoek komen ten laste van
      het beroepspensioenfonds indien zij redelijkerwijs noodzakelijk zijn voor de vervulling van de taak van het
      verantwoordingsorgaan of de raad van toezicht en het beroepspensioenfonds van de te maken kosten vooraf in kennis
      is gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel212
  - number: '213'
    text: |-
      Onze Minister zendt binnen drie jaar na inwerkingtreding van de [Wet verbeterde premieregeling][ref1] aan de
      Staten-Generaal een verslag over de doeltreffendheid en de effecten van die wet in de praktijk.


      [ref1]: https://wetten.overheid.nl/BWBR0038177
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel213
    references:
      - id: ref1
        bwb_id: BWBR0038177
  - number: '214.1'
    text: |-
      Ten aanzien van een beroepspensioenregeling die voor 1 januari 2006 is verplichtgesteld, doet Onze Minister de
      eerste keer het verzoek, bedoeld in [artikel 11, eerste lid][ref1], ten minste acht weken voordat er vijf jaren
      zijn verstreken sinds 1 januari 2006, tenzij er na 1 januari 2006 een wijziging van de verplichtstelling heeft
      plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel11
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '11'
        hoofdstuk: '2'
  - number: '214.2'
    text: |-
      [Artikel 17][ref1] is slechts van toepassing op detacheringen die op of na 25 juli 2001 zijn aangevangen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel17
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '17'
        hoofdstuk: '2'
  - number: '214.3'
    text: |-
      De laatste volzin van [artikel 66, eerste lid][ref1], is ten aanzien van aanspraken die zijn opgebouwd voor
      1 januari 2006 en die op 1 januari 2006 niet voldoen aan de laatste volzin van [artikel 66, eerste lid][ref2],
      gedurende tien jaren na 1 januari 2006 niet van toepassing, met dien verstande dat de financiering van die
      aanspraken ten minste in gelijke delen per kalenderjaar plaatsvindt. De toezichthouder kan toestaan dat, in
      afwijking van de eerste zin, gedurende een langere periode, maar niet langer dan gedurende vijftien jaar geen
      toepassing wordt gegeven aan de laatste volzin van [artikel 66, eerste lid][ref3], voor zover dat noodzakelijk is
      ter voorkoming van onaanvaardbare financiële gevolgen voor de betrokken beroepspensioenregeling of de betrokken
      beroepsgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel66
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel66
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel66
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '66'
        hoofdstuk: '3'
        paragraaf: '3'
  - number: '214.4'
    text: |-
      Voor de toepassing van [artikel 8][ref1] wordt onder «een daartoe door een beroepspensioenvereniging opgericht
      beroepspensioenfonds» mede verstaan een beroepspensioenfonds dat een beroepspensioenregeling uitvoert die voor
      1 januari 2006 is verplichtgesteld of ten aanzien waarvan voor die datum een aanvraag tot verplichtstelling is
      gedaan, met betrekking tot de uitvoering van die regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel8
    url: https://wetten.overheid.nl/BWBR0018831/2020-01-01#Artikel214
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '8'
        hoofdstuk: '2'
  - number: '214.5'
    text: |-
      Indien een beroepspensioenfonds voor de datum van inwerkingtreding van
      [artikel II, onderdeel E, van de Verzamelwet pensioenen 2012][ref1] is overgegaan tot verzekering bij een
      verzekeraar op basis van een kapitaalcontract als bedoeld in [artikel 143a][ref2] geldt het verbod tot verzekering
      op basis van een kapitaalcontract, bedoeld in artikel 143a, na afloop van het contract of een verlenging daarvan
      doch uiterlijk vijf jaar na het tijdstip van inwerkingtreding van artikel II, onderdeel E, van de Verzamelwet
      pensioenen 2012.


      [ref1]: https://wetten.overheid.nl/BWBR0030853#ArtikelII
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel143a
