  - number: '116.21'
    text: |-
      De geldboetes op grond van
      [artikel 27 van de Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref1], zoals dat luidde op
      de dag voorafgaand aan de inwerkingtreding van [artikel 3, eerste lid][ref2], gesteld op strafbare feiten waarvoor
      op grond van deze wet slechts een dwangsom of een bestuurlijke boete kan worden opgelegd en die zijn begaan voor
      het tijdstip waarop [artikel 3, eerste lid][ref3], in werking treedt, blijven van toepassing op deze strafbare
      feiten.


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel3
