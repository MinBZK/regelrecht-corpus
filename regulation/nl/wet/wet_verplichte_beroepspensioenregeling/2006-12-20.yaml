  - number: '63.1'
    text: Het boekjaar van een beroepspensioenfonds loopt van 1 januari tot en met 31 december.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel63
  - number: '63.2'
    text: |-
      Het beroepspensioenfonds legt aan De Nederlandsche Bank N.V. jaarlijks binnen zes maanden na afloop van het
      boekjaar een jaarrekening, een jaarverslag en overige gegevens over het verstreken boekjaar over, waarin een
      volledig beeld van de financiële toestand van het fonds gegeven wordt en waaruit ten genoegen van De Nederlandsche
      Bank N.V. blijkt dat wordt voldaan aan het bepaalde bij en krachtens deze wet en dat de belangen van de bij het
      beroepspensioenfonds betrokken deelnemers, gewezen deelnemers, pensioengerechtigden en overige belanghebbenden
      voldoende gewaarborgd geacht kunnen worden. In de jaarrekening en het jaarverslag wordt rekening gehouden met
      iedere door het beroepspensioenfonds uitgevoerde beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel63
  - number: '63.3'
    text: |-
      Het beroepspensioenfonds ten aanzien waarvan [artikel 58][ref1] toepassing vindt, legt aan De Nederlandsche Bank
      N.V. bovendien jaarlijks binnen zes maanden na afloop van het boekjaar een actuarieel verslag betreffende het
      beroepspensioenfonds over, voorzien van de verklaring van een actuaris.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel58
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '63.4'
    text: |-
      De jaarrekening moet zijn voorzien van een verklaring omtrent de getrouwheid, ondertekend door een accountant als
      bedoeld in [artikel 393, eerste lid, van Boek 2, van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '63.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de wijze waarop
      wordt voldaan aan de verplichtingen, bedoeld in het eerste tot en met het vierde lid. Daarbij kunnen regels worden
      gesteld omtrent het in bepaalde gevallen meermalen per jaar overleggen van gegevens of verklaringen als bedoeld in
      dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel63
  - number: '63.6'
    text: |-
      De Nederlandsche Bank N.V. kan regels stellen met betrekking tot de wijze van overlegging van de in dit artikel
      bedoelde bescheiden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel63
  - number: '64'
    text: |-
      In de verzekeringsovereenkomst waarin bij de totstandkoming of op een later tijdstip wordt gekozen voor ander
      dan Nederlands recht, wordt de volgende clausule opgenomen: Ongeacht het gekozen rechtsstelsel is op deze
      verzekeringsovereenkomst in elk geval de Wet verplichte beroepspensioenregeling van toepassing.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel64
  - number: '65.1'
    text: 'Begunstigde(n) in de verzekeringsovereenkomsten zijn:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel65
  - number: 65.1.a
    text: 'voor de ouderdoms- en invaliditeitsvoorzieningen: de deelnemer;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel65
  - number: 65.1.b
    text: |-
      voor de toegezegde weduwen-, weduwnaars- of partnervoorziening al naar gelang van de aard van de voorziening: de
      deelnemer dan wel diens echtgenoot of partner;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel65
  - number: 65.1.c
    text: |-
      voor de toegezegde wezenvoorziening: de pensioengerechtigde kinderen, een en ander behoudens de
      [artikelen 34][ref1] en [42][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel42
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '2.1'
  - number: '65.2'
    text: |-
      Mits de verzekeraar daarmee instemt kan worden bepaald dat in het kader van een verrekening van pensioenrechten
      bij echtscheiding respectievelijk scheiding van tafel en bed in plaats van de verzekerde diens gewezen echtgenoot
      respectievelijk diens echtgenoot wordt aangewezen als begunstigde voor het geheel of een deel van de toegezegde
      ouderdomsvoorziening.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel65
  - number: '66'
    text: |-
      De actuariële methoden, volgens welke de berekening van premievrije waarden en afkoopwaarden geschiedt alsmede elke
      wijziging daarvan, worden door de verzekeraar aan De Nederlandsche Bank N.V. medegedeeld. Die methoden mogen worden
      toegepast zolang De Nederlandsche Bank N.V. daartegen geen bezwaar heeft gemaakt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel66
  - number: '67'
    text: |-
      Elk bewijs van verzekering als bedoeld in deze wet wordt voorzien van het opschrift: Verzekeringsovereenkomst als
      bedoeld in [artikel 6, onderdeel b][ref1], van de Wet verplichte beroepspensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel6
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '6'
        hoofdstuk: '2'
  - number: 67a.1
    text: |-
      De [artikelen 929][ref1], [935, eerste lid][ref2], [936, tweede tot en met zesde lid][ref3],
      [941, vijfde lid][ref4],[ 969][ref5], [972][ref6], [977, tweede lid][ref7], [978][ref8], [979][ref9],
      [980, tweede lid][ref10] en [983 van Boek 7 van het Burgerlijk Wetboek ][ref11]zijn niet van toepassing op
      verzekeringsovereenkomsten die worden gesloten in verband met een beroepspensioenregeling als bedoeld in
      [artikel 1, eerste lid, onderdeel e][ref12], van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel929
      [ref2]: https://wetten.overheid.nl/BWBR0005290#Artikel935
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel936
      [ref4]: https://wetten.overheid.nl/BWBR0005290#Artikel941
      [ref5]: https://wetten.overheid.nl/BWBR0005290#Artikel969
      [ref6]: https://wetten.overheid.nl/BWBR0005290#Artikel972
      [ref7]: https://wetten.overheid.nl/BWBR0005290#Artikel977
      [ref8]: https://wetten.overheid.nl/BWBR0005290#Artikel978
      [ref9]: https://wetten.overheid.nl/BWBR0005290#Artikel979
      [ref10]: https://wetten.overheid.nl/BWBR0005290#Artikel980
      [ref11]: https://wetten.overheid.nl/BWBR0005290#Artikel983
      [ref12]: https://wetten.overheid.nl/BWBR0018831#Artikel1
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '929'
      - id: ref2
