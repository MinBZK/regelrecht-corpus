  - number: '102.1'
    text: De pensioenuitvoerder vergoedt de kosten die aan de uitvoering van deze wet zijn verbonden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel102
  - number: '102.2'
    text: |-
      Onze Minister stelt nadere regels vast over het vergoeden van de kosten, bedoeld in het eerste
      lid, waarbij van het eerste lid kan worden afgeweken indien een verzekeraar op grond van
      [artikel 186 van de Wet toezicht verzekeringsbedrijf 1993][ref1] ook kosten vergoedt.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel186
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '186'
  - number: '103.1'
    text: |-
      Indien een premie na aanmaning per aangetekende brief niet of niet geheel binnen dertig dagen wordt voldaan
      kan de pensioenuitvoerder, vertegenwoordigd door de personen die op grond van de statuten bevoegd zijn de
      pensioenuitvoerder in rechte te vertegenwoordigen, de premie, wettelijke of reglementaire renten of reglementaire
      boeten en de aanmaningskosten invorderen bij dwangbevel.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: '103.2'
    text: |-
      De in het eerste lid bedoelde aanmaning vermeldt de inhoud van het eerste en vierde tot en met het achtste lid van
      dit artikel en van [artikel 5, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '103.3'
    text: 'Het dwangbevel houdt in:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: 103.3.a
    text: de naam en de zetel van de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: 103.3.b
    text: de namen van de vertegenwoordigers, bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: 103.3.c
    text: de naam, het beroep, de woonplaats en het adres van de schuldenaar;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: 103.3.d
    text: |-
      het bedrag van de achterstallige premies, dat van de wettelijke of reglementaire renten of reglementaire boeten,
      voorzover daarop aanspraak wordt gemaakt en de aanmaningskosten voorzover daarop aanspraak wordt gemaakt, alsmede
      de gronden waarop de vordering berust;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: 103.3.e
    text: de datum waarop de in het eerste lid bedoelde aanmaning is geschied.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: '103.4'
    text: |-
      Het dwangbevel levert een executoriale titel op, die met toepassing van de voorschriften van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] ten uitvoer kan worden gelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '103.5'
    text: |-
      Het dwangbevel kan niet ten uitvoer worden gelegd voordat acht dagen na de betekening daarvan zijn verstreken. De
      persoon aan wie het dwangbevel is gericht kan gedurende dertig dagen na de betekening door middel van dagvaarding
      tegen de tenuitvoerlegging van een dwangbevel in verzet komen bij de kantonrechter van de plaats waar hij
      woont. Indien de persoon buiten Nederland woont dan wel in Nederland geen vaste woonplaats heeft, kan hij in
      verzet komen bij de kantonrechter van de rechtbank van het arrondissement waarin het kantoor is gevestigd van de
      pensioenuitvoerder.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: '103.6'
    text: Het verzet schorst de tenuitvoerlegging van het dwangbevel voorzover deze door het verzet wordt bestreden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: '103.7'
    text: |-
      Indien het verzet zich richt of mede richt tegen de hoogte van de gevorderde reglementaire rente of reglementaire
      boete, kan de rechter indien deze hem bovenmatig voorkomt, de bedongen reglementaire rente of reglementaire boete
      matigen, met dien verstande dat deze niet minder kan bedragen dan de wettelijke rente.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: '103.8'
    text: Het recht tot invorderen bij dwangbevel strekt zich uit tot de kosten van vervolging.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel103
  - number: '104.1'
    text: |-
      Voor burgerlijke rechtsvorderingen ter zake van deelneming in en uitkering op grond van een beroepspensioenregeling
      is de kantonrechter bevoegd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel104
  - number: '104.2'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht][ref1] is voor beroepen tegen besluiten op grond
      van deze wet de rechtbank te Rotterdam bevoegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel104
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '105'
    text: |-
      Inlichtingen uit de gemeentelijke basisadministratie persoonsgegevens en inlichtingen en uittreksels uit de
      registers van de burgerlijke stand, welke met het oog op deelneming in een beroepspensioenregeling of uitkering op
      grond van beroepspensioenregeling ten aanzien van deelnemers, gewezen deelnemers, of pensioengerechtigden aan de
      pensioenuitvoerder worden verstrekt, zijn vrij van leges.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel105
  - number: '116.1'
    text: |-
      Op een aanvraag tot het verplichtstellen van deelneming in een bepaalde beroepspensioenregeling
      ontvangen voor de inwerkingtreding van [artikel 3, eerste lid][ref1], beslist Onze Minister volgens de
      [Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref2] zoals deze luidde ten tijde van de
      ontvangst van de aanvraag.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002830
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002830
  - number: '116.2'
    text: |-
      Op bezwaar- en beroepschriften die zijn ingediend voor de inwerkingtreding van [artikel 3, eerste lid][ref1], wordt
      beslist op grond van de [Wet betreffende verplichte deelneming in een beroepspensioenfonds][ref2] zoals deze luidde
      ten tijde van de indiening.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0002830
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0002830
  - number: '116.3'
    text: |-
      Een verplichting tot het deelnemen in een beroepspensioenregeling op grond van
      [artikel 2, eerste lid, van de Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref1], zoals
      dat luidde op de dag voorafgaand aan de inwerkingtreding van [artikel 3, eerste lid][ref2], wordt aangemerkt als
      een verplichtstelling op grond van [artikel 3, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002830#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel116
    references:
      - id: ref1
        bwb_id: BWBR0002830
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '116.4'
    text: |-
      Ten aanzien van een beroepspensioenregeling die voor de inwerkingtreding van [artikel 9, eerste lid][ref1],
      is verplichtgesteld, doet Onze Minister de eerste keer het verzoek, bedoeld in [artikel 9, eerste lid][ref2],
      ten minste acht weken voordat er vijf jaren zijn verstreken sinds de datum van inwerkingtreding van
      [artikel 9, eerste lid][ref3], tenzij er na de inwerkingtreding van [artikel 9, eerste lid][ref4], een wijziging
      van de verplichtstelling heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel9
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel9
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel116
    references:
