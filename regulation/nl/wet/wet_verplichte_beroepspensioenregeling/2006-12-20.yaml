  - number: '116.10'
    text: |-
      [Artikel 35][ref1] en [artikel 39, derde lid][ref2], zijn ten aanzien van een beroepspensioenregeling die voor
      de inwerkingtreding van dat artikel respectievelijk artikellid is verplichtgesteld of ten aanzien waarvan voor de
      inwerkingtreding van dat artikel respectievelijk artikellid een aanvraag tot verplichtstelling is gedaan, eerst van
      toepassing met ingang van het tweede jaar na het tijdstip van inwerkingtreding van dat artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel39
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel116
