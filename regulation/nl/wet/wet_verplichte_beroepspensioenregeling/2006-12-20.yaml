  - number: '116.15'
    text: |-
      Bij de toepassing van [artikel 42][ref1] is op pensioen of aanspraken op pensioen die voor 1 januari 2007 zijn
      opgebouwd [artikel 43, onderdeel f][ref2] van toepassing, tenzij [artikel 42][ref3] wordt toegepast in verband met
      een keuze als bedoeld in [artikel 37][ref4] of [38][ref5] en de pensioenuitvoerder in de beroepspensioenregeling
      [artikel 42, eerste lid, onderdeel d en e][ref6], van toepassing heeft verklaard.


