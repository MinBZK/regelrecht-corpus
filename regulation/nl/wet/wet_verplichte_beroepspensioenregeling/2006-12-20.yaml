        paragraaf: '10'
  - number: '87'
    text: 'Voor de toepassing van deze paragraaf wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel87
  - number: 87.a
    text: 'beboetbaar feit: een gedraging in strijd met deze wet terzake waarvan een bestuurlijke boete kan worden opgelegd;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel87
  - number: 87.b
    text: |-
      boete: de bestuurlijke sanctie die bestaat uit de onvoorwaardelijke verplichting tot het betalen van een bepaalde
      geldsom aan De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel87
