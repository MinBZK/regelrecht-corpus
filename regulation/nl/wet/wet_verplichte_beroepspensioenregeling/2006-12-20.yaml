---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_verplichte_beroepspensioenregeling
regulatory_layer: WET
publication_date: '2021-01-21'
valid_from: '2006-12-20'
bwb_id: BWBR0018831
url: https://wetten.overheid.nl/BWBR0018831/2006-12-20
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is in verband met modernisering van de pensioenwetgeving,
    de Wet betreffende verplichte deelneming in een beroepspensioenregeling in te trekken en te vervangen door een
    nieuwe wet ter zake;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#ArtikelAanhef
articles:
  - number: '1.1'
    text: 'In deze wet en de daarop berustende bepalingen wordt verstaan onder:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.a
    text: 'Onze Minister: de Minister van Sociale Zaken en Werkgelegenheid;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.b
    text: 'pensioen: ouderdoms-, invaliditeits-, weduwen-, weduwnaars-, partner- en wezenpensioen;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.c
    text: 'nabestaandenpensioen: weduwen-, weduwnaars-, partner- en wezenpensioen;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.d
    text: 'beroepsgenoot: een natuurlijk persoon die deel uitmaakt van een bepaalde beroepsgroep;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.e
    text: 'beroepspensioenregeling:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.e.1°
    text: |-
      door beroepsgenoten overeengekomen rechten en plichten ten aanzien van pensioen ten behoeve van beroepsgenoten en
      gewezen beroepsgenoten, dan wel
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.e.2°
    text: |-
      indien de aan een beroepspensioenregeling deelnemende zelfstandige of beroepsgenoot in een andere lidstaat
      dan Nederland is gevestigd, een overeenkomst, een trustakte of voorschriften waarin is bepaald welke
      pensioenuitkeringen worden toegezegd en onder welke voorwaarden;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.f
    text: |-
      deelnemer: de beroepsgenoot die op grond van een beroepspensioenregeling pensioenaanspraken verwerft jegens de
      pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.g
    text: |-
      gewezen deelnemer: de beroepsgenoot of gewezen beroepsgenoot die geen pensioenaanspraken op grond van de
      beroepspensioenregeling meer verwerft jegens de pensioenuitvoerder en die bij beëindiging van de deelneming
      pensioenaanspraken heeft behouden jegens de pensioenuitvoerder;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.h
    text: 'pensioengerechtigde: de persoon voor wie op grond van de beroepspensioenregeling pensioen is ingegaan;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.i
    text: |-
      beroepspensioenvereniging: een vereniging waarvan beroepsgenoten lid zijn en die volledige rechtsbevoegdheid
      bezit, waarvan het statutair doel uitsluitend omvat het verzorgen van een beroepspensioenregeling en waarbij het
      lidmaatschap niet automatisch voortvloeit uit het lidmaatschap van enig andere organisatie;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.j
    text: |-
      beroepspensioenfonds: een voor een bepaalde beroepsgroep werkend pensioenfonds, dat is opgericht ter uitvoering van
      een beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.k
    text: |-
      verzekeraar: een verzekeraar die op grond van de [Wet toezicht verzekeringsbedrijf 1993][ref1] gekwalificeerd is
      tot het sluiten van een verzekering of verzekeringen van pensioen in of naar Nederland;


      [ref1]: https://wetten.overheid.nl/BWBR0006509
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
  - number: 1.1.l
    text: 'pensioenuitvoerder: het beroepspensioenfonds en de verzekeraar;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.m
    text: |-
      verzekeringsovereenkomst: een overeenkomst van schadeverzekering of een overeenkomst van levensverzekering als
      bedoeld in [artikel 1, eerste lid, onderdelen a en b, van de Wet toezicht verzekeringsbedrijf 1993][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel1
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '1'
  - number: 1.1.n
    text: |-
      verplichtstelling: de verplichte deelneming in een beroepspensioenregeling op grond van
      [artikel 3, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: 1.1.o
    text: |-
      premie: de in geld uitgedrukte prestatie verschuldigd aan de pensioenuitvoerder bestemd voor de verzekering van
      pensioen en de daaraan verbonden kosten;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.p
    text: |-
      basispensioenvoorziening: het deel van de beroepspensioenregeling waaraan elke beroepsgenoot in ieder geval
      deelneemt;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.q
    text: |-
      vrijwillige pensioenvoorziening: een pensioenvoorziening die deel uitmaakt van de beroepspensioenregeling en
      waarbij de beroepsgenoot de keuze heeft hieraan deel te nemen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.r
    text: |-
      beschikbare premieregeling: een beroepspensioenregeling waarbij als uitgangspunt uitsluitend de premie wordt
      genomen waarbij die premie resulteert in een kapitaal dat wordt omgezet in pensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.s
    text: |-
      pensioeninstelling uit een andere lidstaat: een op basis van kapitaaldekking gefinancierde instelling, ongeacht
      de rechtsvorm, die zetel heeft in een andere lidstaat dan Nederland en die onafhankelijk van enige bijdragende
      onderneming of bedrijfstak is opgericht met als doel het verstrekken van arbeidsgerelateerde pensioenuitkeringen op
      basis van een als volgt gesloten overeenkomst:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.s.1°
    text: |-
      individueel of collectief tussen een of meerdere werkgevers en een of meerdere werknemers of hun respectievelijke
      vertegenwoordigers, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.s.2°
    text: met zelfstandigen,
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.t
    text: |-
      zetel: de plaats waar een rechtspersoon volgens zijn statuten of reglementen is gevestigd of, indien het een
      beroepspensioenfonds of pensioeninstelling uit een andere lidstaat betreft, de plaats waar deze volgens zijn
      statuten of reglementen is gevestigd en zijn hoofdbestuur heeft of, indien het een pensioeninstelling uit
      een andere lidstaat betreft die geen rechtspersoon is of een natuurlijke persoon betreft, de plaats waar die
      pensioeninstelling of persoon zijn hoofdbestuur heeft;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.u
    text: |-
      lidstaat: een lidstaat van de Europese Unie alsmede een staat, niet zijnde een lidstaat van de Europese Unie, die
      partij is bij de Overeenkomst betreffende de Europese Economische Ruimte;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.v
    text: |-
      [richtlijn 2003/41/EG](32003L0041): [richtlijn nr. 2003/41/EG](32003L0041) van het Europees Parlement en de
      Raad van de Europese Unie van 3 juni 2003 betreffende de werkzaamheden van en het toezicht op instellingen voor
      bedrijfspensioenvoorziening (PbEG L 235/10);
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: 1.1.w
    text: |-
      bevoegde autoriteiten: de nationale autoriteiten van andere lidstaten dan Nederland die op grond van artikel 6,
      onderdeel g, van [richtlijn 2003/41/EG](32003L0041) zijn aangewezen om de in die richtlijn vastgelegde taken te
      verrichten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt mede verstaan onder beroepspensioenvereniging: een daarmee
      door Onze Minister gelijkgestelde instelling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel1
  - number: '2'
    text: 'In deze wet en de daarop berustende bepalingen wordt gelijkgesteld met:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: 2.a
    text: 'echtgenoot: geregistreerde partner;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: 2.b
    text: 'echtgenoten: geregistreerde partners;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: 2.c
    text: 'huwelijk: geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: 2.d
    text: 'huwelijkse voorwaarden: voorwaarden van een geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: 2.e
    text: 'scheiding of echtscheiding: beëindiging van een geregistreerd partnerschap anders dan door de dood of vermissing;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: 2.f
    text: 'weduwe of weduwnaar: achtergebleven partij bij een geregistreerd partnerschap;'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: 2.g
    text: 'weduwen- en weduwnaarspensioen: pensioen ten behoeve van achtergebleven geregistreerde partners.'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel2
  - number: '3.1'
    text: |-
      Onze Minister kan het deelnemen in een beroepspensioenregeling voor een of meer bepaalde groepen van beroepsgenoten
      verplicht stellen indien:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel3
  - number: 3.1.a
    text: daartoe een aanvraag wordt gedaan door een beroepspensioenvereniging, en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel3
  - number: 3.1.b
    text: |-
      die beroepspensioenvereniging een naar het oordeel van de minister belangrijke meerderheid van de beroepsgenoten
      die tot de beroepsgroep behoren, vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel3
  - number: '3.2'
    text: |-
      Van de verplichtstelling zijn arbitrale bedingen als bedoeld in
      [artikel 1020, vijfde lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1] uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel1020
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '1020'
  - number: '3.3'
    text: |-
      Indien zowel zelfstandig werkzame beroepsgenoten als beroepsgenoten die in loondienst werkzaam zijn deelnemen
      aan de beroepspensioenregeling wordt pas voldaan aan het eerste lid, onderdeel b, wanneer voor beide groepen
      afzonderlijk is aangetoond dat de beroepspensioenvereniging een belangrijke meerderheid van die beroepsgenoten
      vertegenwoordigt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel3
  - number: '3.4'
    text: |-
      Vrijwillige pensioenvoorzieningen als bedoeld in
      [artikel 13, vierde lid, onderdeel d, onder 2°, van de Wet toezicht verzekeringsbedrijf 1993][ref1]
      worden gelijkgesteld met in de verplichtgestelde beroepspensioenregelingen opgenomen verplichte
      basispensioenvoorzieningen.


      [ref1]: https://wetten.overheid.nl/BWBR0006509#Artikel13
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006509
        artikel: '13'
  - number: '4.1'
    text: |-
      De aanvraag, bedoeld in [artikel 3][ref1], gaat vergezeld van:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: 4.1.a
    text: |-
      een verklaring waaruit blijkt dat aan [artikel 3, eerste lid, onderdeel b][ref1], wordt voldaan;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: 4.1.b
    text: |-
      een gewaarmerkt exemplaar van de op het moment van de aanvraag geldende statuten en reglementen van de
      beroepspensioenvereniging.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: '4.2'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een beroepspensioenfonds gaat de aanvraag tevens vergezeld
      van:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: 4.2.a
    text: een authentiek afschrift van de akte van oprichting van het desbetreffende beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: 4.2.b
    text: |-
      een door het bestuur van het beroepspensioenfonds gewaarmerkt exemplaar van de reglementen van het
      beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: 4.2.c
    text: |-
      een actuariële en bedrijfstechnische nota als bedoeld in [artikel 61][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel61
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '4.3'
    text: 'Indien de beroepspensioenregeling wordt uitgevoerd door een verzekeraar gaat de aanvraag tevens vergezeld van:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: 4.3.a
    text: |-
      een door het bestuur van de beroepspensioenvereniging gewaarmerkt afschrift van de getekende overeenkomst tussen de
      verzekeraar en de beroepspensioenvereniging;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: 4.3.b
    text: |-
      een door de beroepspensioenvereniging gewaarmerkt afschrift van de getekende wijzigingsovereenkomst indien er een
      wijziging van de overeenkomst heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: '4.4'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de aanvraag alsmede met betrekking tot de bij te voegen stukken
      nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel4
  - number: '5.1'
    text: |-
      Zolang de verplichtstelling duurt zijn de [artikelen 5, derde en vierde lid, tot en met artikel 105][ref1] en de
      daarop berustende bepalingen van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '5.2'
    text: |-
      Na beëindiging van de verplichtstelling blijven de [artikelen 5, derde en vierde lid, tot en met artikel 105][ref1]
      en de daarop berustende bepalingen van toepassing voorzover ze betrekking hebben op de periode waarover de
      verplichtstelling duurde.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '5'
        hoofdstuk: '2'
  - number: '5.3'
    text: De deelnemers leven de beroepspensioenregeling en de daarop gebaseerde besluiten na.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel5
  - number: '5.4'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een beroepspensioenfonds leven de deelnemers de statuten
      van dat beroepspensioenfonds en de daarop gebaseerde besluiten na.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel5
  - number: '6'
    text: 'Een beroepspensioenregeling wordt uitgevoerd door:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel6
  - number: 6.a
    text: een daartoe door een beroepspensioenvereniging opgericht beroepspensioenfonds; of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel6
  - number: 6.b
    text: |-
      een verzekeraar, op grond van één daartoe door een beroepspensioenvereniging met die verzekeraar gesloten
      verzekeringsovereenkomst;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel6
  - number: 6.c
    text: |-
      een pensioeninstelling uit een andere lidstaat, die beschikt over een daartoe verleende vergunning, bedoeld
      in [artikel 71i, onderdeel a][ref1], en de bevoegde autoriteiten in kennis heeft gesteld als bedoeld in
      [artikel 71i, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel71i
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel71i
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 71i
        hoofdstuk: '6'
        paragraaf: 3c
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 71i
        hoofdstuk: '6'
        paragraaf: 3c
  - number: '7.1'
    text: |-
      Onze Minister kan de verplichtstelling wijzigen indien daartoe een aanvraag wordt gedaan door een
      beroepspensioenvereniging die voldoet aan [artikel 3, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '7.2'
    text: |-
      [Artikel 3, derde lid][ref1] en
      [artikel 4, eerste lid, onderdeel a, tweede lid, onderdeel c, en derde lid, onderdeel b][ref2], zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel4
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '4'
        hoofdstuk: '2'
  - number: '7.3'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een beroepspensioenfonds gaat de aanvraag tevens vergezeld
      van:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel7
  - number: 7.3.a
    text: |-
      een authentiek afschrift van de akte houdende wijziging van de statuten indien er een wijziging van de statuten
      heeft plaatsgevonden;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel7
  - number: 7.3.b
    text: |-
      een door het beroepspensioenfonds gewaarmerkt exemplaar van de wijzigingen van de reglementen indien er een
      wijziging van de reglementen heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel7
  - number: '7.4'
    text: Bij ministeriële regeling kunnen met betrekking tot het eerste en tweede lid nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel7
  - number: '8.1'
    text: |-
      Indien een wijziging van de beroepspensioenregeling heeft plaatsgevonden zendt de beroepspensioenvereniging een
      door haar gewaarmerkt afschrift van wijziging van de beroepspensioenregeling, binnen twee weken nadat de wijziging
      tot stand is gekomen aan Onze Minister en aan De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel8
  - number: '8.2'
    text: |-
      Onze Minister doet mededeling in de Staatscourant van de wijziging van de beroepspensioenregeling
      en vermeldt dat binnen vier weken bij hem zienswijzen omtrent het al dan niet voldoen aan
      [artikel 3, eerste lid, onderdeel b][ref1], naar voren kunnen worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.3'
    text: |-
      Indien de zienswijzen daartoe aanleiding geven verzoekt Onze Minister binnen acht weken na de
      mededeling in de Staatscourant de beroepspensioenvereniging aan te tonen dat nog wordt voldaan aan
      [artikel 3, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '8.4'
    text: |-
      [Artikel 3, derde lid][ref1], [artikel 9, vierde lid][ref2], [artikel 10][ref3] en [artikel 13][ref4] zijn van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel13
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '9'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '10'
        hoofdstuk: '2'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '13'
        hoofdstuk: '2'
  - number: '9.1'
    text: |-
      Op verzoek van Onze Minister toont de beroepspensioenvereniging die voortzetting van de verplichtstelling wenst
      binnen acht weken na dat verzoek aan dat nog wordt voldaan aan [artikel 3, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '9.2'
    text: |-
      Onze Minister doet het verzoek, bedoeld in het eerste lid, ten minste acht weken voordat er vijf
      jaren zijn verstreken sinds de datum waarop voor het laatst is gebleken dat wordt voldaan aan
      [artikel 3, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '9.3'
    text: |-
      Als de datum waarop voor het laatst is gebleken dat nog wordt voldaan aan
      [artikel 3, eerste lid, onderdeel b][ref1] wordt aangemerkt:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: 9.3.a
    text: de datum waarop de verplichtstelling is opgelegd;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
  - number: 9.3.b
    text: de datum waarop de verplichtstelling is gewijzigd, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
  - number: 9.3.c
    text: |-
      de datum waarop na het verzoek van Onze Minister, bedoeld in het eerste lid, [artikel 8, derde lid][ref1] of
      [artikel 10][ref2] is aangetoond dat aan de daar gestelde eisen wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel10
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '8'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '10'
        hoofdstuk: '2'
  - number: '9.4'
    text: |-
      Indien de beroepspensioenvereniging niet binnen acht weken na het verzoek, bedoeld in het eerste lid, heeft
      aangetoond dat nog wordt voldaan aan [artikel 3, eerste lid, onderdeel b][ref1], doet Onze Minister daarvan
      mededeling in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '9.5'
    text: |-
      [Artikel 3, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.1'
    text: |-
      Acht weken voordat er twee jaren zijn verstreken sinds de mededeling, bedoeld in [artikel 9, vierde lid][ref1],
      doet Onze Minister opnieuw een verzoek als bedoeld in [artikel 9, eerste lid][ref2]. Indien de
      beroepspensioenvereniging, binnen acht weken na dat verzoek niet aantoont dat nog wordt voldaan aan
      [artikel 3, eerste lid, onderdeel b][ref3], trekt Onze Minister met betrekking tot de betrokken beroepsgroep de
      verplichtstelling in.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '9'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '9'
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '10.2'
    text: |-
      Indien uitsluitend met betrekking tot de beroepsgenoten die in loondienst werkzaam zijn door de
      beroepspensioenvereniging niet is aangetoond dat nog wordt voldaan aan [artikel 3, eerste lid, onderdeel b][ref1],
      trekt Onze Minister de verplichtstelling in afwijking van het eerste lid, slechts in met betrekking tot die groep.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.1'
    text: |-
      Onverminderd [artikel 12][ref1] trekt Onze Minister de verplichtstelling in indien daartoe een aanvraag wordt
      gedaan door een beroepspensioenvereniging die voldoet aan [artikel 3, eerste lid, onderdeel b][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '12'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.2'
    text: |-
      Onverminderd [artikel 12][ref1] kan Onze Minister de verplichtstelling intrekken voor een of meer bepaalde groepen
      van beroepsgenoten indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel12
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '12'
        hoofdstuk: '2'
  - number: 11.2.a
    text: daartoe een aanvraag wordt gedaan door een beroepspensioenvereniging,
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
  - number: 11.2.b
    text: |-
      die beroepspensioenvereniging een naar het oordeel van de minister belangrijke meerderheid van die groep of groepen
      beroepsgenoten vertegenwoordigt, en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
  - number: 11.2.c
    text: |-
      deze intrekking niet tot gevolg heeft dat de verplichtstelling slechts resteert voor beroepsgenoten die in
      loondienst werkzaam zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
  - number: '11.3'
    text: |-
      De aanvraag, bedoeld in het eerste lid, gaat vergezeld van een verklaring waaruit blijkt dat wordt voldaan aan het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
  - number: '11.4'
    text: |-
      De aanvraag, bedoeld in het tweede lid, gaat vergezeld van een verklaring waaruit blijkt dat wordt voldaan aan het
      tweede lid, onderdeel b.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
  - number: '11.5'
    text: |-
      [Artikel 3, derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '3'
        hoofdstuk: '2'
  - number: '11.6'
    text: |-
      Bij ministeriële regeling kunnen met betrekking tot de aanvragen, bedoeld in het eerste lid en tweede lid, alsmede
      met betrekking tot de bij te voegen stukken nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel11
  - number: '12.1'
    text: |-
      In uitzonderlijke gevallen kan Onze Minister de verplichtstelling ambtshalve voor alle of voor één of meer bepaalde
      groepen van deelnemers intrekken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel12
  - number: '12.2'
    text: |-
      Van een uitzonderlijk geval is in ieder geval sprake indien er in een beroepspensioenfonds geen activiteiten
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel12
  - number: '13.1'
    text: |-
      Bij een besluit tot intrekking van de verplichtstelling geeft Onze Minister aan per welke datum de
      verplichtstelling wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel13
  - number: '13.2'
    text: |-
      In afwijking van [artikel 10][ref1] en [11][ref2] trekt Onze Minister de verplichtstelling niet in zolang tegen
      die intrekking overwegende bezwaren bestaan in verband met de bescherming van de rechten van de deelnemers, gewezen
      deelnemers, pensioengerechtigden of andere rechthebbenden op pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel11
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '10'
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '11'
        hoofdstuk: '2'
  - number: '13.3'
    text: |-
      Bij de intrekking kunnen door Onze Minister ter bescherming van de rechten van de deelnemers, gewezen deelnemers,
      pensioengerechtigden of andere rechthebbenden op pensioen voorschriften worden gegeven met betrekking tot hun
      rechten en verplichtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel13
  - number: '13.4'
    text: |-
      Bij het besluit van intrekking kan Onze Minister voorschrijven dat de beroepspensioenvereniging binnen zes maanden
      na dat besluit bij De Nederlandsche Bank N.V. een plan voor afbouw indient.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel13
  - number: '13.5'
    text: |-
      Vanaf de dag van publicatie in de Staatscourant van het besluit tot intrekking van de verplichtstelling worden geen
      nieuwe deelnemers tot de beroepspensioenregeling toegelaten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel13
  - number: '14.1'
    text: 'Onze Minister doet mededeling in de Staatscourant van:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.a
    text: een aanvraag tot verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.b
    text: een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.c
    text: een aanvraag betreffende wijziging van de verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.d
    text: een wijziging van de verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.e
    text: een aanvraag tot intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.f
    text: een voornemen tot ambtshalve intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.g
    text: een intrekking van een verplichtstelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: 14.1.h
    text: het niet verder in behandeling nemen van een aanvraag.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: '14.2'
    text: |-
      Bij de mededelingen, bedoeld in het eerste lid, onderdelen a, c, e en f, vermeldt Onze Minister de termijn
      waarbinnen zienswijzen tegen de inhoud van hetgeen is meegedeeld schriftelijk bij hem naar voren kunnen worden
      gebracht.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel14
  - number: '15.1'
    text: |-
      In dit artikel wordt verstaan onder gedetacheerd beroepsgenoot: een beroepsgenoot die in een andere lidstaat wordt
      gedetacheerd om daar te werken en die krachtens titel II van [verordening (EEG) nr. 1408/71](31971R1408) van de
      Raad van de Europese gemeenschappen van 14 juni 1971 betreffende de toepassing van de sociale zekerheidsregelingen
      op loontrekkenden en hun gezinnen, die zich binnen de gemeenschap verplaatsten (Pb EG L 149), onderworpen blijft
      aan de wetgeving van de lidstaat van oorsprong.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel15
  - number: '15.2'
    text: |-
      Indien tijdens detachering in Nederland de betaling van premies in een andere lidstaat wordt voorgezet, is de in
      Nederland gedetacheerde beroepsgenoot vrijgesteld van de verplichting tot het betalen van premies in Nederland.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel15
  - number: '16.1'
    text: |-
      Onverminderd [artikel 15][ref1] kan onze Minister een persoon die slechts tijdelijk in Nederland werkzaam is, op
      aanvraag in een bijzonder, individueel geval voorwaardelijk of onvoorwaardelijk voor de periode dat die persoon in
      Nederland werkzaam is ontheffing verlenen van de verplichtstelling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel15
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '15'
        hoofdstuk: '2'
  - number: '16.2'
    text: Bij ministeriële regeling kunnen nadere regels met betrekking tot de aanvraag worden gesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel16
  - number: '17.1'
    text: |-
      Van de verplichtstelling, wordt op zijn aanvraag, door de pensioenuitvoerder ontheffing verleend aan de persoon die
      gemoedsbezwaren heeft tegen iedere vorm van verzekering.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel17
  - number: '17.2'
    text: |-
      Bij ministeriële regeling worden met betrekking tot het eerste lid nadere regels gesteld. Bij ministeriële regeling
      worden tevens regels gesteld betreffende de gevolgen van de ontheffing, alsmede betreffende de intrekking van de
      ontheffing.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel17
  - number: '18.1'
    text: Een beroepspensioenregeling is in overwegende mate bestemd voor zelfstandig werkende beroepsgenoten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel18
  - number: '18.2'
    text: Een beroepspensioenregeling bevat in ieder geval een basispensioenvoorziening.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel18
  - number: '18.3'
    text: |-
      Een beroepspensioenregeling kan meer dan één beroepsgroep omvatten of zijn beperkt tot een deel van een
      beroepsgroep.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel18
  - number: '19.1'
    text: De inhoud van de beroepspensioenregeling wordt opgenomen in een pensioenreglement.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel19
  - number: '19.2'
    text: 'In het pensioenreglement worden bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel19
  - number: 19.2.a
    text: beroepsgroep of het deel van de beroepsgroep waarvoor de beroepspensioenregeling geldt;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel19
  - number: 19.2.b
    text: de soorten deelnemers;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel19
  - number: 19.2.c
    text: de aanspraken die de deelneming geeft, en het systeem van financiering van die aanspraken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel19
  - number: '19.3'
    text: |-
      In het pensioenreglement wordt tevens de datum van de inwerkingtreding van de bepalingen vermeld, en in geval van
      wijziging van die bepalingen, de datum van inwerkingtreding van die wijziging.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel19
  - number: '19.4'
    text: |-
      Indien de beroepspensioenregeling wordt uitgevoerd door een verzekeraar wordt de inhoud van de
      beroepspensioenregeling tevens opgenomen in het verzekeringscontract dat wordt gesloten tussen de
      beroepspensioenvereniging en de verzekeraar.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel19
  - number: '20'
    text: |-
      Uitsluiting van deelneming aan een beroepspensioenregeling op grond van het aantal uren dat het beroep wordt
      uitgeoefend, het gerealiseerde inkomen, het overeengekomen loon of de gerealiseerde omzet, is niet toegestaan.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel20
  - number: '21.1'
    text: |-
      De premie is voor alle deelnemers gelijk of bedraagt voor alle deelnemers een gelijk percentage van de
      gerealiseerde omzet, het gerealiseerde inkomen of het gerealiseerde loon dan wel van het gedeelte van de
      gerealiseerde omzet, het gerealiseerde inkomen of gerealiseerde loon dat voor de pensioenberekening in aanmerking
      wordt genomen, met dien verstande dat er voor verschillende vormen van pensioen verschillende premies kunnen worden
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel21
  - number: '21.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel21
  - number: 21.2.a
    text: beschikbare premieregelingen, en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel21
  - number: 21.2.b
    text: premies ten behoeve van vrijwillige pensioenvoorzieningen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel21
  - number: '22.1'
    text: |-
      De beroepspensioenregeling kan een verplichting voor iedere deelnemer inhouden tot het bijhouden van een zodanige
      boekhouding, dat daaruit de gegevens blijken welke de pensioenuitvoerder nodig heeft voor de vaststelling van het
      deelnemerschap en de aanspraken, rechten en verplichtingen van de deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22
  - number: '22.2'
    text: |-
      Iedere deelnemer verleent de pensioenuitvoerder desgevraagd inzage in de in het eerste lid bedoelde boekhouding
      en in de bescheiden die daaraan ten grondslag liggen, voor zover daaruit de in dat lid bedoelde gegevens zijn af
      te leiden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22
  - number: '22.3'
    text: |-
      Iedere deelnemer verstrekt desgevraagd de inlichtingen welke de pensioenuitvoerder nodig heeft voor de vaststelling
      van het deelnemerschap en de aanspraken, rechten en verplichtingen van die deelnemer.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22
  - number: '22.4'
    text: |-
      De persoon, die de inzage van de boekhouding en bescheiden en de verstrekking van de gegevens weigert, kan zich
      niet met vrucht beroepen op enige geheimhoudingsplicht, ook al mocht deze hem bij wet zijn opgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22
  - number: 22a
    text: |-
      Het is een beroepspensioenfonds verboden bijdragen te ontvangen van een zelfstandige of beroepsgenoot die is
      gevestigd in een andere lidstaat dan Nederland:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22a
  - number: 22a.a
    text: zonder een daartoe door De Nederlandsche Bank N.V. verleende vergunning; en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22a
  - number: 22a.b
    text: |-
      zonder De Nederlandsche Bank N.V. van het voornemen daartoe in kennis te hebben gesteld, op de wijze, bedoeld in
      [artikel 22b][ref1], en met inachtneming van [artikel 71f][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22b
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel71f
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 22b
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 71f
        hoofdstuk: '6'
        paragraaf: 3b
  - number: 22b.1
    text: |-
      Een beroepspensioenfonds stelt De Nederlandsche Bank N.V. in kennis van een voornemen bijdragen te gaan ontvangen
      van een in een andere lidstaat gevestigde zelfstandige of beroepsgenoot.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22b
  - number: 22b.2
    text: 'De kennisgeving, bedoeld in het eerste lid, gaat vergezeld van een opgave van:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22b
  - number: 22b.2.a
    text: de lidstaat waar de zelfstandige of beroepsgenoot is gevestigd;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22b
  - number: 22b.2.b
    text: de naam van de in de andere lidstaat gevestigde zelfstandige of beroepsgenoot; en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22b
  - number: 22b.2.c
    text: |-
      de voornaamste kenmerken van de beroepspensioenregeling die voor die zelfstandige of beroepsgenoot zal worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22b
  - number: 22c
    text: |-
      Het beroepspensioenfonds neemt bij de uitvoering van een beroepspensioenregeling voor een in een andere lidstaat
      dan Nederland gevestigde zelfstandige of beroepsgenoot de op bedrijfspensioenvoorziening toepasselijke bepalingen
      van de sociale en arbeidswetgeving en de voorschriften die krachtens de artikelen 11 en 18, zevende lid, van
      [richtlijn 2003/41/EG](32003L0041) moeten worden nageleefd, in acht. De Nederlandse sociale en arbeidswetgeving is
      niet van toepassing op de uitvoering van de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel22c
  - number: '23.1'
    text: |-
      De pensioenuitvoerder verstrekt gegevens betreffende een deelnemer, een gewezen deelnemer, een pensioengerechtigde
      of een andere rechthebbende op pensioen slechts aan de desbetreffende persoon.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: '23.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: 23.2.a
    text: er sprake is van een wettelijke verplichting tot gegevensverstrekking;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: 23.2.b
    text: gegevensverstrekking noodzakelijk is voor de uitvoering van de beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: 23.2.c
    text: |-
      gegevensverstrekking noodzakelijk is in verband met de toepassing van de [artikelen 41][ref1], [42][ref2] of
      [43][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel43
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '2.1'
  - number: 23.2.d
    text: |-
      het gegevensverstrekking betreft aan De Nederlandsche Bank N.V. voorzover deze gegevensverstrekking nodig is voor
      de vervulling van haar krachtens deze wet opgelegde taken, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: 23.2.e
    text: |-
      er sprake is van het verstrekken van naam-, adres- en woonplaatsgegevens aan verenigingen met volledige
      rechtsbevoegdheid die als statutair doel of mede als statutair doel hebben het behartigen van de belangen van haar
      leden als belanghebbenden bij een beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: '23.3'
    text: |-
      Indien er gegevensverstrekking als bedoeld in het tweede lid, onderdeel b of onderdeel e heeft plaatsgevonden, zijn
      het eerste en het tweede lid van overeenkomstige toepassing op de persoon of de rechtspersoon aan wie de gegevens
      zijn verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: '23.4'
    text: |-
      In afwijking van het eerste lid kan een deelnemer, gewezen deelnemer, de pensioengerechtigde of andere
      rechthebbende op pensioen, de pensioenuitvoerder machtigen zijn gegevens te verstrekken aan een door hem aan te
      wijzen derde. De pensioenuitvoerder onthoudt zich daarbij van suggesties met betrekking tot de aan te wijzen derde.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel23
  - number: '24.1'
    text: |-
      Behoudens het geven van algemene informatie, geeft de pensioenuitvoerder deelnemers, gewezen deelnemers,
      pensioengerechtigden en andere rechthebbenden op pensioen slechts informatie over de beroepspensioenregeling die
      door de pensioenuitvoerder zelf wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel24
  - number: '24.2'
    text: |-
      Indien er in verband met de uitvoering van een beroepspensioenregeling gegevensverstrekking, als bedoeld in
      [artikel 23, tweede lid, onderdeel b][ref1], heeft plaatsgevonden, is het eerste lid van overeenkomstige toepassing
      op de persoon of de rechtspersoon aan wie de gegevens zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel23
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '23'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: '25.1'
    text: |-
      De pensioenuitvoerder zorgt dat de deelnemers bij toetreding tot de beroepspensioenregeling schriftelijk op de
      hoogte gesteld worden van de inhoud van de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel25
  - number: '25.2'
    text: |-
      De deelnemers worden door de pensioenuitvoerder schriftelijk op de hoogte gesteld van de wijzigingen in de
      beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel25
  - number: '25.3'
    text: |-
      De pensioenuitvoerder stelt de belanghebbenden in staat desgewenst tussentijds van de geldende
      beroepspensioenregeling kennis te nemen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel25
  - number: '26.1'
    text: |-
      Bij toetreding tot de beroepspensioenregeling verstrekt de pensioenuitvoerder een opgave van de hoogte van het te
      bereiken reglementaire pensioen dan wel van de verzekerde bedragen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel26
  - number: '26.2'
    text: |-
      Jaarlijks verstrekt de pensioenuitvoerder aan de deelnemer een opgave van de hoogte van het te bereiken
      reglementaire pensioen dan wel van de verzekerde bedragen. De opgave is uitgesplitst naar ouderdomspensioen,
      nabestaandenpensioen en invaliditeitspensioen. Bij ministeriële regeling kunnen regels worden gesteld met
      betrekking tot de per pensioen, genoemd in de tweede volzin, op te geven gegevens.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel26
  - number: '26.3'
    text: |-
      De pensioenuitvoerder verstrekt op verzoek van de deelnemer en de gewezen deelnemer binnen drie maanden een opgave
      van de hoogte van de opgebouwde aanspraken. De pensioenuitvoerder kan een vergoeding vragen van de aan de opgave
      verbonden kosten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel26
  - number: '26.4'
    text: |-
      Jaarlijks verstrekt de pensioenuitvoerder een opgave van de aan het desbetreffende of
      voorafgaande kalenderjaar toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '26.5'
    text: |-
      De pensioenuitvoerder verstrekt op verzoek van de deelnemer een opgave van de over de jaren
      1994 tot en met 2000 toe te rekenen waardeaangroei van pensioenaanspraken overeenkomstig
      [artikel 3.127 van de Wet inkomstenbelasting 2001][ref1] en de daarop berustende bepalingen.


      [ref1]: https://wetten.overheid.nl/BWBR0011353#Artikel3
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel26
    references:
      - id: ref1
        bwb_id: BWBR0011353
        artikel: '3'
  - number: '26.6'
    text: |-
      De pensioenuitvoerder verstrekt eenmalig aan de deelnemers, en aan de gewezen deelnemers eenmalig op verzoek,
      een opgave van de premievrije waarde op 1 januari 2006 van de aanspraken, opgebouwd ten behoeve van een
      pensioenuitkering in de periode voorafgaand aan de datum waarop de deelnemer of gewezen deelnemer de leeftijd van
      65 jaar bereikt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel26
  - number: '26.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het bepaalde in het zesde lid, de wijze
      waarop de premievrije waarde wordt berekend en het tijdvak waarbinnen de eenmalige opgave wordt verstrekt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel26
  - number: '27'
    text: 'De pensioenuitvoerder verstrekt een bewijsstuk ter zake van de bestaande aanspraken aan:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel27
  - number: 27.a
    text: |-
      de deelnemer bij het bereiken van de pensioengerechtigde leeftijd en bij ingang van een uitkering krachtens een
      invaliditeitsvoorziening;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel27
  - number: 27.b
    text: |-
      degenen, die rechthebbenden zijn op nabestaandenpensioen, na het overlijden van de deelnemer dan wel diens
      echtgenoot of partner;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel27
  - number: 27.c
    text: |-
      de gewezen echtgenoot, bedoeld in [artikel 34][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel34
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel27
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '1.2'
  - number: '28'
    text: |-
      De opbouw en de financiering van de pensioenaanspraken vinden gedurende het deelnemerschap ten minste evenredig in
      tijd plaats.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel28
  - number: '29.1'
    text: |-
      Indien in een ouderdomspensioen is voorzien verkrijgt de deelnemer, tenzij [artikel 33][ref1] toepassing vindt, bij
      het eindigen van zijn deelneming anders dan door overlijden of het bereiken van de pensioengerechtigde leeftijd ten
      minste een premievrije aanspraak op ouderdomspensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel33
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1.2'
  - number: '29.2'
    text: |-
      De premievrije aanspraak op ouderdomspensioen bestaat uit het verschil tussen het ouderdomspensioen dat
      de deelnemer zou hebben gekregen als hij zou hebben deelgenomen tot de pensioengerechtigde leeftijd en het
      ouderdomspensioen dat hij zou hebben gekregen als hij zou hebben deelgenomen vanaf het tijdstip waarop zijn
      deelneming eindigde tot de pensioengerechtigde leeftijd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel29
  - number: '29.3'
    text: |-
      Bij de berekening bedoeld in het tweede lid wordt, voor wat betreft de gegevens die voor de vaststelling van
      de pensioenaanspraken van belang zijn, uitgegaan van die gegevens, zoals deze gelden op het tijdstip waarop de
      deelneming eindigt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel29
  - number: '29.4'
    text: |-
      Indien het gaat om een beroepspensioenregeling in de vorm van een beschikbare premieregeling is het tweede lid niet
      van toepassing en geldt dat de deelnemer bij beëindiging van de deelneming ten minste een premievrije aanspraak op
      ouderdomspensioen verkrijgt op grond van de betaalde en nog verschuldigde premies naarmate de voor pensioeningang
      vereiste duur van de deelneming is verstreken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel29
  - number: '30'
    text: |-
      Indien in een weduwen- of weduwnaarspensioen respectievelijk een partnerpensioen is voorzien, verkrijgt de
      deelnemer, tenzij [artikel 33][ref1] toepassing vindt, bij beëindiging van de deelneming anders dan door
      overlijden of het bereiken van de pensioengerechtigde leeftijd ten behoeve van zijn echtgenoot respectievelijk
      zijn partner een door de pensioenuitvoerder naar redelijkheid vast te stellen premievrije aanspraak op weduwen- of
      weduwnaarspensioen respectievelijk partnerpensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel33
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '33'
        hoofdstuk: '3'
        paragraaf: '1.2'
  - number: '31'
    text: |-
      De pensioenuitvoerder verstrekt de deelnemer bij beëindiging van de deelneming een opgave bevattende de hoogte van
      de premievrije aanspraken als bedoeld in de [artikelen 29][ref1] en [30][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel30
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1.2'
  - number: '32.1'
    text: |-
      De aanspraak, bedoeld in [artikel 29][ref1] en [30][ref2], dient in elk geval steeds aan het einde van ieder
      kalenderjaar dan wel, indien dat eerder is, bij beëindiging van de deelneming volledig te zijn gefinancierd.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel30
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1.2'
  - number: '32.2'
    text: |-
      De Nederlandsche Bank N.V. kan op grond van bijzondere omstandigheden een langere termijn, van ten hoogste dertien
      weken, toestaan voor de financiering als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel32
  - number: '33.1'
    text: |-
      De beroepspensioenregeling kan inhouden dat een deelnemer die korter dan een jaar heeft deelgenomen aan de
      beroepspensioenregeling bij beëindiging van de deelneming anders dan door overlijden of het bereiken van de
      pensioengerechtigde leeftijd een uitkering ontvangt die ten minste gelijk is aan de betaalde premies voor pensioen
      dat een premievrije aanspraak oplevert, tenzij hij elders verworven pensioenaanspraken heeft ingebracht.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel33
  - number: '33.2'
    text: |-
      De beroepspensioenregeling kan in plaats van het in het eerste lid bedoelde tijdstip, waarop de deelneming eindigt,
      een later tijdstip van uitkering noemen, doch niet later dan twee jaren na het eindigen van die deelneming, noch
      later dan het tijdstip waarop de pensioengerechtigde leeftijd wordt bereikt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel33
  - number: '34.1'
    text: |-
      Indien het huwelijk van een deelnemer eindigt door echtscheiding of ontbinding na scheiding van tafel en bed,
      verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of weduwnaarspensioen, als de
      deelnemer ten behoeve van die gewezen echtgenoot zou hebben verkregen, indien op het tijdstip van de echtscheiding
      of de ontbinding van het huwelijk zijn deelneming zou zijn geëindigd anders dan door overlijden of het bereiken van
      de pensioengerechtigde leeftijd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel34
  - number: '34.2'
    text: |-
      Indien het huwelijk van een gewezen deelnemer of de pensioengerechtigde eindigt door echtscheiding of ontbinding
      na scheiding van tafel en bed, verkrijgt zijn gewezen echtgenoot een zodanige premievrije aanspraak op weduwen- of
      weduwnaarspensioen, als de gewezen deelnemer of de pensioengerechtigde ten behoeve van die gewezen echtgenoot heeft
      verkregen bij het eindigen van zijn deelneming.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel34
  - number: '34.3'
    text: |-
      Het eerste en tweede lid zijn niet van toepassing indien de echtgenoten bij huwelijkse voorwaarden of bij een bij
      geschrift gesloten overeenkomst met het oog op de scheiding anders overeenkomen. De overeenkomst is slechts geldig
      indien aan de overeenkomst een verklaring van de pensioenuitvoerder is gehecht, dat deze bereid is een uit de
      afwijking voortvloeiend pensioenrisico te dekken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel34
  - number: '35.1'
    text: |-
      De aanspraak op ouderdomspensioen van een deelnemer of gewezen deelnemer wordt zonder toestemming van
      diens echtgenoot niet bij overeenkomst tussen die deelnemer of gewezen deelnemer en de pensioenuitvoerder
      verminderd anders dan bij afkoop zoals voorzien bij of krachtens deze wet, tenzij de echtgenoten het recht op
      pensioenverevening op grond van de [Wet verevening pensioenrechten bij scheiding][ref1] hebben uitgesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0006641
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0006641
  - number: '35.2'
    text: |-
      De aanspraak op weduwen- of weduwnaarspensioen ten behoeve van de echtgenoot van een deelnemer of gewezen deelnemer
      wordt zonder toestemming van die echtgenoot niet bij overeenkomst tussen de deelnemer of de gewezen deelnemer en de
      pensioenuitvoerder verminderd anders dan bij afkoop zoals voorzien bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel35
  - number: '35.3'
    text: Elk beding, strijdig met het bepaalde in het eerste en tweede lid, is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel35
  - number: '36'
    text: |-
      Indien [artikel 5 van de Wet verevening pensioenrechten bij scheiding][ref1] toepassing vindt is het bepaalde
      bij of krachtens deze wet van overeenkomstige toepassing op het eigen recht op pensioen van de tot verevening
      gerechtigde echtgenoot.


      [ref1]: https://wetten.overheid.nl/BWBR0006641#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0006641
        artikel: '5'
  - number: '37.1'
    text: |-
      Indien in een beroepspensioenregeling wordt voorzien in een ouderdomspensioen en een nabestaandenpensioen dat
      bij beëindiging van de deelneming een premievrije aanspraak oplevert, wordt aan een deelnemer of een gewezen
      deelnemer, ongeacht zijn burgerlijke staat, de mogelijkheid geboden, in elk geval met ingang van de datum waarop
      het ouderdomspensioen ingaat of kan ingaan, in plaats van nabestaandenpensioen te kiezen voor één of meer van de
      volgende vormen van ouderdomspensioen:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: 37.1.a
    text: een hoger ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: 37.1.b
    text: een eerder ingaand ouderdomspensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: 37.1.c
    text: een hoger en eerder ingaand ouderdomspensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: '37.2'
    text: 'Het eerste lid is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: 37.2.a
    text: het vrijwillige nabestaandenpensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: 37.2.b
    text: het wezenpensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: 37.2.c
    text: |-
      de aanspraak van de gewezen echtgenoot, bedoeld in [artikel 34, eerste en tweede lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel34
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: '1.2'
  - number: '37.3'
    text: |-
      De collectieve actuariële waarde van het ouderdomspensioen, bedoeld in het eerste lid, dat wordt gekozen in plaats
      van het nabestaandenpensioen, bedoeld in het eerste lid, is ongeacht de datum waarop de keuze wordt gemaakt, ten
      minste gelijkwaardig aan de collectieve actuariële waarde van dat nabestaandenpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: '37.4'
    text: |-
      Bij de keuze, bedoeld in het eerste lid, is, in voorkomend geval in afwijking van [artikel 35, tweede lid][ref1],
      de toestemming van de echtgenoot vereist of is de toestemming van de partner die is aangemeld in het kader van een
      partnerpensioen vereist. Voor de toepassing van dit artikellid is [artikel 42, eerste lid, onderdeel c][ref2], niet
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel35
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel42
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '2.1'
  - number: '37.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de inhoud
      van de keuzemogelijkheid, de wijze waarop de keuzemogelijkheid wordt geboden en de collectieve actuariële
      gelijkwaardigheid als bedoeld in het derde lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel37
  - number: '38.1'
    text: |-
      Indien in een beroepspensioenregeling de deelnemer of gewezen deelnemer de mogelijkheid wordt geboden in plaats
      van een bepaald pensioen geheel of gedeeltelijk te kiezen voor een ander soort pensioen, anders dan bedoeld in
      [artikel 37][ref1], is de collectieve actuariële waarde van dat andere pensioen ten minste gelijkwaardig aan de
      collectieve actuariële waarde van het eerst genoemde pensioen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel37
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: '38.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot de
      inhoud van de keuzemogelijkheid, de wijze waarop de keuzemogelijkheid geboden wordt en de collectieve actuariële
      gelijkwaardigheid als bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel38
  - number: '39.1'
    text: |-
      Overdracht, inpandgeving of elke andere handeling, waardoor de deelnemer, gewezen deelnemer of
      pensioengerechtigde enig recht op zijn pensioen of zijn aanspraak op pensioen aan een ander toekent,
      anders dan het verlenen van zekerheid voor het verkrijgen van uitstel van betaling als bedoeld in
      [artikel 25, vierde lid, van de Invorderingswet 1990][ref1] is slechts geldig voor zover beslag op zijn pensioen
      geldig zou zijn bij ontbreken van andere inkomsten.


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel25
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '25'
  - number: '39.2'
    text: Volmacht tot invordering van het pensioen, onder welke vorm of welke benaming ook verleend, is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel39
  - number: '39.3'
    text: |-
      Onverminderd de [artikelen 40][ref1], [41][ref2], [42][ref3] en [43][ref4] kan pensioen of een aanspraak op
      pensioen slechts worden afgekocht in bij ministeriële regeling te bepalen gevallen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel42
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel43
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '40'
        hoofdstuk: '3'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '2.1'
  - number: '39.4'
    text: Elk beding strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel39
  - number: '40.1'
    text: |-
      In afwijking van [artikel 39, derde lid][ref1], heeft zowel de pensioenuitvoerder zonder toestemming van de
      rechthebbende, als de rechthebbende zonder toestemming van de pensioenuitvoerder het recht tot afkoop van zijn
      pensioen, indien het ouderdomspensioen op het tijdstip van ingang een bij ministeriële regeling bepaald bedrag niet
      te boven gaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel39
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '39'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: '40.2'
    text: De afkoopsom wordt ter hand gesteld van de rechthebbende.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel40
  - number: '40.3'
    text: |-
      In het geval de rechthebbende zich in het buitenland heeft gevestigd, geldt voor het in het eerste lid bedoelde
      bedrag het tweevoudige en is de pensioenuitvoerder op verzoek van de rechthebbende verplicht voor het tijdstip van
      ingang aanspraken op pensioen af te kopen indien op het tijdstip van afkoop de hoogte van de pensioenaanspraak het
      tweevoudige van het in het eerste lid bedoelde bedrag niet te boven gaat.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel40
  - number: '40.4'
    text: |-
      Het bedrag, bedoeld in het eerste lid, wordt bij ministeriële regeling telkens herzien met ingang van 1 januari
      met hetzelfde percentage waarmee de consumentenindex Alle Huishoudens, zoals dat wordt berekend door het Centraal
      Bureau voor de Statistiek, over de maand oktober daaraan voorafgaande naar boven of beneden afwijkt van die index
      over de maand oktober van het jaar voorafgaande aan de eerstgenoemde maand oktober.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel40
  - number: '40.5'
    text: De afkoopsom is voor mannen en vrouwen gelijk.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel40
  - number: '40.6'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent het vijfde lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel40
  - number: '40.7'
    text: Elk beding strijdig met dit artikel, is nietig.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel40
  - number: '41.1'
    text: |-
      Een pensioenuitvoerder is verplicht in geval van individuele beëindiging van de deelneming anders dan door
      overlijden of het bereiken van de pensioengerechtigde leeftijd op verzoek van een gewezen deelnemer aanspraken op
      pensioen af te kopen, indien:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
  - number: 41.1.a
    text: |-
      die afkoop waaraan geen besluit van de beroepspensioenvereniging ten grondslag ligt, ertoe strekt het de
      rechthebbende mogelijk te maken om onder aanwending van de afkoopsom pensioen of aanspraken op pensioen te
      verwerven overeenkomstig een andere pensioenregeling in de zin van deze wet of een andere pensioenvoorziening
      in de zin van de [Pensioen- en spaarfondsenwet][ref1], bij de instelling waar die andere pensioenregeling of
      pensioenvoorziening is ondergebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 41.1.b
    text: de afkoopsom rechtstreeks wordt overgedragen aan die instelling, en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
  - number: 41.1.c
    text: |-
      de aanspraken op pensioen worden verworven jegens een pensioenuitvoerder of jegens een pensioenfonds als bedoeld in
      de [Pensioen- en spaarfondsenwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: '41.2'
    text: 'Het eerste lid is niet van toepassing indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
  - number: 41.2.a
    text: |-
      de financiële toestand van het beroepspensioenfonds waardeoverdracht naar het oordeel van De Nederlandsche Bank
      N.V. niet toelaat;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
  - number: 41.2.b
    text: 'niet alle premies zijn betaald aan de verzekeraar: voorzover deze premies niet zijn betaald.'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
  - number: '41.3'
    text: |-
      Een pensioenuitvoerder is verplicht op verzoek van een deelnemer de afkoopsom op grond
      van het eerste lid, [artikel 32b, eerste lid van de Pensioen- en spaarfondsenwet][ref1] en
      [artikel 16a van de Regelen verzekeringsovereenkomsten Pensioen- en Spaarfondsenwet][ref2] aan te wenden ter
      verwerving van aanspraken op pensioen voor die deelnemer.


      [ref1]: https://wetten.overheid.nl/BWBR0002089#Artikel32b
      [ref2]: https://wetten.overheid.nl/BWBR0004195#Artikel16a
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0002089
        artikel: 32b
      - id: ref2
        bwb_id: BWBR0004195
        artikel: 16a
  - number: '41.4'
    text: |-
      Met betrekking tot het eerste en derde lid worden bij of krachtens algemene maatregel van bestuur regels gesteld
      ten aanzien van de berekening van de waarde van de af te kopen aanspraken op pensioen en de met de afkoopsom
      in te kopen aanspraken op pensioen alsmede de in acht te nemen procedure. Deze regels kunnen met betrekking tot
      aanspraken op nabestaandenpensioen het recht op afkoop van de gewezen deelnemer beperken. De Stichting van de
      Arbeid verstrekt Onze Minister desgevraagd de ter zake benodigde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
  - number: '41.5'
    text: |-
      Een pensioenuitvoerder is verplicht op verzoek van een gewezen deelnemer bij diens aanstelling in vaste dienst van
      een van de Europese Gemeenschappen een premievrije aanspraak op ouderdomspensioen als bedoeld in [artikel 29][ref1]
      af te kopen en de afkoopsom over te dragen aan de betrokken Gemeenschap. Bij de berekening van de afkoopsom zijn de
      rekenregels van het derde lid van toepassing. Een pensioenuitvoerder is bevoegd op verzoek van de gewezen deelnemer
      en diens echtgenoot of partner een premievrije aanspraak op weduwen-, weduwnaars- of partnerpensioen als bedoeld in
      [artikel 30][ref2] in de in de eerste zin bedoelde afkoop en overdracht te betrekken.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel30
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '29'
        hoofdstuk: '3'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '30'
        hoofdstuk: '3'
        paragraaf: '1.2'
  - number: '42.1'
    text: |-
      Onverminderd het tweede lid en de [artikelen 41][ref1] en [43][ref2] is een pensioenuitvoerder uitsluitend bevoegd
      pensioen of aanspraken op pensioen af te kopen voor zover de beroepspensioenregeling dat mogelijk maakt en indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel43
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '43'
        hoofdstuk: '3'
        paragraaf: '2.1'
  - number: 42.1.a
    text: de rechthebbende daarmee instemt;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
  - number: 42.1.b
    text: |-
      de afkoop ertoe strekt het de rechthebbende mogelijk te maken om onder aanwending van de afkoopsom pensioen of
      aanspraken op pensioen te verwerven overeenkomstig dezelfde beroepspensioenregeling of de afkoop ertoe strekt
      uitvoering te geven aan een besluit van de beroepspensioenvereniging om onder aanwending van de afkoopsom pensioen
      of aanspraken op pensioen te verwerven overeenkomstig een andere beroepspensioenregeling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
  - number: 42.1.c
    text: met de pensioenbelangen van de echtgenoot of de gewezen echtgenoot op redelijke wijze rekening is gehouden;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
  - number: 42.1.d
    text: |-
      de afkoopsom of zodanig wordt vastgesteld dat het te verwerven pensioen voor mannen en vrouwen gelijk is of, indien
      sprake is van een beschikbare premieregeling, zodanig wordt vastgesteld dat de omvang van het te verwerven pensioen
      naar het inzicht op het tijdstip van vaststelling van de afkoopsom gelijk is;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
  - number: 42.1.e
    text: |-
      onverminderd de [artikelen 37][ref1] en [38][ref2], het in te kopen pensioen collectief actuarieel gelijkwaardig is
      aan het af te kopen pensioen;


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel38
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: '1.3'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '38'
        hoofdstuk: '3'
        paragraaf: '1.3'
  - number: 42.1.f
    text: |-
      de aanspraken op pensioen worden verworven jegens een pensioenuitvoerder of jegens een pensioenfonds als bedoeld in
      de [Pensioen- en spaarfondsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 42.1.g
    text: |-
      het voornemen tot afkoop door het beroepspensioenfonds uiterlijk drie maanden voor de beoogde datum van afkoop
      schriftelijk wordt gemeld aan De Nederlandsche Bank N.V. in die gevallen waarin er sprake is van groepsgewijze
      afkoop en De Nederlandsche Bank N.V. binnen die periode niet van eventuele bezwaren heeft doen blijken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
  - number: '42.2'
    text: In het geval van liquidatie van het beroepspensioenfonds kan afkoop overeenkomstig het eerste lid plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
  - number: '42.3'
    text: |-
      Een pensioenuitvoerder is, voorzover de beroepspensioenregeling dat mogelijk maakt bevoegd aanspraken op pensioen
      af te kopen, indien die afkoop ertoe strekt het de rechthebbende mogelijk te maken om op de datum waarop het
      pensioen ingaat onder aanwending van de afkoopsom bij een andere instelling pensioen te verwerven, mits de
      afkoopsom rechtstreeks wordt overgedragen aan die instelling en wordt voldaan het eerste lid, onderdeel a, c, d en
      e en f.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel42
  - number: '43'
    text: |-
      Onverminderd de [artikelen 41][ref1] en [42][ref2] is een pensioenuitvoerder uitsluitend bevoegd pensioen of
      aanspraken op pensioen bij beëindiging van de deelneming af te kopen voor zover de beroepspensioenregeling dat
      mogelijk maakt en indien:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel41
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel42
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '41'
        hoofdstuk: '3'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '42'
        hoofdstuk: '3'
        paragraaf: '2.1'
  - number: 43.a
    text: de rechthebbende daarmee instemt;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
  - number: 43.b
    text: |-
      die afkoop waaraan geen besluit van de beroepspensioenvereniging ten grondslag ligt, ertoe strekt het de
      rechthebbende mogelijk te maken om onder aanwending van de afkoopsom pensioen of aanspraken op pensioen te
      verwerven overeenkomstig een andere pensioenregeling als bedoeld in deze wet of een andere pensioenvoorziening
      in de zin van de [Pensioen- en spaarfondsenwet][ref1] bij de instelling waar die andere pensioenregeling of
      pensioenvoorziening is ondergebracht;


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 43.c
    text: de afkoopsom rechtstreeks wordt overgedragen aan die instelling;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
  - number: 43.d
    text: |-
      het pensioen of de aanspraken op pensioen worden verworven jegens een pensioenuitvoerder of jegens een
      pensioenfonds als bedoeld in de [Pensioen- en spaarfondsenwet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002089
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0002089
  - number: 43.e
    text: met de pensioenbelangen van de echtgenoot of gewezen echtgenoot op redelijke wijze rekening is gehouden;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
  - number: 43.f
    text: |-
      het pensioen of de aanspraak op pensioen door de instelling jegens welke het pensioen of aanspraak op pensioen
      wordt verworven, aldus wordt vastgesteld, dat de actuariële waarde ervan ten minste gelijk is aan de op dezelfde
      grondslagen berekende actuariële waarde van het af te kopen pensioen of de af te kopen aanspraken op pensioen, en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
  - number: 43.g
    text: |-
      het voornemen tot afkoop door het beroepspensioenfonds uiterlijk drie maanden voor de beoogde datum van afkoop
      schriftelijk wordt gemeld aan De Nederlandsche Bank N.V. in die gevallen waarin sprake is van groepsgewijze afkoop
      en De Nederlandsche Bank N.V. binnen die periode niet van eventuele bezwaren heeft doen blijken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel43
  - number: '44.1'
    text: |-
      Indien een instelling op ingegane ouderdomspensioenen van pensioengerechtigden die tot de ingang van hun
      pensioen aan de beroepspensioenregeling hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft de
      pensioengerechtigde die aan dezelfde beroepspensioenregeling heeft deelgenomen maar voorafgaand aan de ingang van
      zijn pensioen gewezen deelnemer was er jegens de instelling recht op dat hem op zijn ingegaan ouderdomspensioen
      overeenkomstige toeslagen worden verleend met inachtneming van dezelfde uitgangspunten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel44
  - number: '44.2'
    text: |-
      Op de overeenkomstige toeslagen kunnen in mindering worden gebracht toeslagen op ingegaan ouderdomspensioen welke
      de pensioengerechtigde over hetzelfde tijdvak uit andere hoofde ontvangt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel44
  - number: '44.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de weduwe of weduwnaar van de gewezen deelnemer of
      pensioengerechtigde voor wat betreft toeslagen op weduwenof weduwnaarspensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel44
  - number: '44.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de partner van een gewezen deelnemer na het
      overlijden van die gewezen deelnemer voor wat betreft toeslagen op zijn partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel44
  - number: '44.5'
    text: |-
      Bij ministeriële regeling wordt aangegeven wat voor de toepassing van dit artikel onder gewezen deelnemer wordt
      verstaan.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel44
  - number: '45.1'
    text: |-
      Indien een instelling op ingegane ouderdomspensioenen van pensioengerechtigden die tot de ingang van hun
      pensioen aan de beroepspensioenregeling hebben deelgenomen toeslagen, hoe ook genaamd, verleent, heeft de
      gewezen deelnemer die aan dezelfde regeling heeft deelgenomen, er jegens die instelling recht op dat hem op zijn
      premievrije aanspraak op ouderdomspensioen overeenkomstige toeslagen worden verleend met inachtneming van dezelfde
      uitgangspunten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel45
  - number: '45.2'
    text: |-
      Op de overeenkomstige toeslagen kunnen in mindering worden gebracht toeslagen op zijn premievrije aanspraak op
      ouderdomspensioen welke de gewezen deelnemer over hetzelfde tijdvak uit anderen hoofde ontvangt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel45
  - number: '45.3'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de gewezen deelnemer voor wat betreft toeslagen op
      zijn premievrije aanspraak op weduwen- of weduwnaarpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel45
  - number: '45.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de gewezen deelnemer wat betreft toeslagen op zijn
      premievrije aanspraak op partnerpensioen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel45
  - number: '45.5'
    text: |-
      Bij ministeriële regeling wordt aangegeven wat voor de toepassing van dit artikel onder gewezen deelnemer wordt
      verstaan.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel45
  - number: '46.1'
    text: |-
      In dit artikel wordt verstaan onder gedetacheerd beroepsgenoot: een beroepsgenoot die in een andere lidstaat wordt
      gedetacheerd om daar te werken en die krachtens titel II van [verordening (EEG) nr. 1408/71](31971R1408) van de
      Raad van de Europese gemeenschappen van 14 juni 1971 betreffende de toepassing van de sociale zekerheidsregelingen
      op loontrekkenden en hun gezinnen, die zich binnen de gemeenschap verplaatsten (Pb EG L 149), onderworpen blijft
      aan de wetgeving van de lidstaat van oorsprong.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel46
  - number: '46.2'
    text: Een gedetacheerd beroepsgenoot kan tijdens de detachering blijven deelnemen aan de beroepspensioenregeling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel46
  - number: '47'
    text: |-
      Deelnemers en andere rechthebbenden die zich na beëindiging van de deelneming aan een beroepspensioenregeling
      naar een andere lidstaat begeven behouden hun aanspraak op pensioen in dezelfde mate als deelnemers en andere
      rechthebbenden die na beëindiging van de deelneming in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel47
  - number: '48.1'
    text: |-
      De pensioenuitvoerder verstrekt deelnemers en gewezen deelnemers die zich naar een andere lidstaat begeven
      informatie over hun aanspraken op pensioen en over de mogelijkheden die hen op grond van de beroepspensioenregeling
      worden geboden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel48
  - number: '48.2'
    text: |-
      De informatie die op grond van het eerste lid wordt verstrekt is ten minste overeenkomstig de informatie die wordt
      verstrekt aan deelnemers en gewezen deelnemers die in Nederland blijven.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel48
  - number: '49'
    text: |-
      De pensioenuitvoerder betaalt het pensioen op verzoek van de rechthebbende in een andere lidstaat dan de lidstaat
      waar die pensioenuitvoerder is gevestigd, waarbij transactiekosten op het pensioen in mindering gebracht kunnen
      worden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel49
  - number: '50'
    text: Een beroepspensioenfonds is een rechtspersoon met volledige rechtsbevoegdheid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel50
  - number: '51.1'
    text: |-
      Het bestuur van een beroepspensioenfonds is verplicht binnen drie maanden na oprichting van het fonds dit te melden
      bij De Nederlandsche Bank N.V. door middel van een door De Nederlandsche Bank N.V. vast te stellen formulier.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel51
  - number: '51.2'
    text: |-
      Binnen de in het eerste lid genoemde termijn zendt het bestuur van het beroepspensioenfonds een afschrift van de
      akte van oprichting, en een door het bestuur gewaarmerkt exemplaar van de reglementen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel51
  - number: '52.1'
    text: |-
      Het bestuur van een beroepspensioenfonds bestaat uit vertegenwoordigers van de beroepspensioenvereniging die de
      verplichtstelling heeft aangevraagd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel52
  - number: '52.2'
    text: |-
      Elke bestuurder van een beroepspensioenfonds is bevoegd een deskundige te raadplegen, en zich krachtens een
      bestuursbesluit, waarbij ten minste één vierde van de bestuurders zich daarvoor heeft uitgesproken, ter vergadering
      door een deskundige te laten bijstaan.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel52
  - number: '53.1'
    text: Het dagelijks beleid van een beroepspensioenfonds wordt bepaald door ten minste twee personen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.2'
    text: |-
      De deskundigheid, reputatie, beroepskwalificatie en beroepservaring van de personen die het beleid van een
      beroepspensioenfonds bepalen of mede bepalen, dient naar het oordeel van De Nederlandsche Bank N.V. voldoende
      te zijn met het oog op de belangen van de bij het beroepspensioenfonds betrokken deelnemers, gewezen deelnemers,
      pensioengerechtigden en overige belanghebbenden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.3'
    text: |-
      De voornemens, handelingen of antecedenten van de personen die het beleid van het beroepspensioenfonds bepalen
      of mede bepalen, mogen De Nederlandsche Bank N.V. geen aanleiding geven tot het oordeel dat, met het oog op de
      belangen, bedoeld in het tweede lid, de betrouwbaarheid van deze personen niet buiten twijfel staat.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.4'
    text: |-
      De personen die het beleid van een beroepspensioenfonds bepalen of mede bepalen richten zich bij de vervulling
      van hun taak naar de belangen van de bij het fonds betrokken deelnemers, gewezen deelnemers, pensioengerechtigden
      en overige belanghebbenden en zorgen ervoor dat deze zich door hen op evenwichtige wijze vertegenwoordigd kunnen
      voelen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.5'
    text: |-
      Het bestuur van het beroepspensioenfonds brengt elke wijziging in de samenstelling van de personen die het beleid
      van het fonds bepalen of mede bepalen vooraf ter kennis aan De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.6'
    text: |-
      Een wijziging als bedoeld in het vijfde lid wordt niet doorgevoerd indien De Nederlandsche Bank N.V. binnen
      zes weken na ontvangst van de melding, of, indien De Nederlandsche Bank N.V. om nadere gegevens of inlichtingen
      heeft verzocht, binnen zes weken na ontvangst van die gegevens of inlichtingen, aan het bestuur van het
      beroepspensioenfonds bekend maakt dat zij niet met de voorgenomen wijziging instemt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.7'
    text: |-
      Indien zich een wijziging voordoet van de antecedenten, bedoeld in het derde lid, stelt het bestuur van het
      beroepspensioenfonds De Nederlandsche Bank N.V. daarvan onverwijld schriftelijk is kennis.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.8'
    text: De Nederlandsche Bank N.V. stelt beleidsregels vast met betrekking tot de toepassing van dit artikel.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
  - number: '53.9'
    text: |-
      De Nederlandsche Bank N.V. verstrekt aan een autoriteit die op grond van de [Wet toezicht kredietwezen 1992][ref1],
      de [Wet toezicht beleggingsinstellingen][ref2] onderscheidenlijk de [Wet toezicht effectenverkeer 1995][ref3]
      belast is met het toezicht op kredietinstellingen, beleggingsinstellingen onderscheidenlijk effectenbemiddelaars en
      vermogensbeheerders de gegevens of inlichtingen die zij verkregen heeft bij de vervulling van de haar op grond van
      deze wet opgedragen taak en die betrekking hebben op de deskundigheid van personen als bedoeld in het tweede lid,
      onderscheidenlijk de voornemens, de handelingen of de antecedenten van personen als bedoeld in het derde lid, voor
      zover De Nederlandsche Bank N.V. van oordeel is dat deze gegevens of inlichtingen van belang zijn of zouden kunnen
      zijn voor het toezicht dat door die andere autoriteit wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0005792
      [ref2]: https://wetten.overheid.nl/BWBR0004809
      [ref3]: https://wetten.overheid.nl/BWBR0007657
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0005792
      - id: ref2
        bwb_id: BWBR0004809
      - id: ref3
        bwb_id: BWBR0007657
  - number: '54.1'
    text: |-
      Een beroepspensioenfonds beschikt over een gedragscode die voor bestuurders en medewerkers van het
      beroepspensioenfonds voorschriften geeft ter voorkoming van belangenconflicten, van misbruik en oneigenlijk gebruik
      van de bij het beroepspensioenfonds aanwezig informatie.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel54
  - number: '54.2'
    text: |-
      De Nederlandsche Bank N.V. kan regels stellen met betrekking tot de inhoud de gedragscode, bedoeld in het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel54
  - number: '55.1'
    text: |-
      Ieder van de bestuurders van het beroepspensioenfonds draagt er zorg voor dat het bepaalde bij of krachtens deze
      wet alsmede de bepalingen van de statuten en reglementen van het beroepspensioenfonds worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel55
  - number: '55.2'
    text: |-
      Ieder van de bestuurders van een beroepspensioenfonds is verplicht te zorgen, dat het beleid van het fonds wordt
      gevoerd overeenkomstig de in [artikel 61][ref1] bedoelde actuariële en bedrijfstechnische nota.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel61
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '56.1'
    text: 'In de statuten van het beroepspensioenfonds worden bepalingen opgenomen betreffende:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: 56.1.a
    text: de doelstelling van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: 56.1.b
    text: het beheer van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: 56.1.c
    text: de inkomsten van het beroepspensioenfonds;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: 56.1.d
    text: de belegging van gelden;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: 56.1.e
    text: de wijze waarop de bestuursleden worden aangewezen dan wel gekozen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: 56.1.f
    text: |-
      de wijziging van de statuten en reglementen, met name ook wat betreft wijziging van de rechten en plichten van de
      deelnemers, gewezen deelnemers, pensioengerechtigden en overige belanghebbenden in gevallen waarin de financiële
      toestand van het beroepspensioenfonds daartoe aanleiding geeft;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: 56.1.g
    text: |-
      de liquidatie van het beroepspensioenfonds, met name ook wat betreft de verplichtingen van de liquidateuren en de
      bestemming van de bezittingen van het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: '56.2'
    text: |-
      Het is niet toegestaan in de statuten van een beroepspensioenfonds bepalingen op te nemen die het
      bestuurslidmaatschap onmogelijk maken op grond van de hoedanigheid van gewezen deelnemer, pensioengerechtigde of op
      grond van het bereikt hebben van een bepaalde leeftijd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel56
  - number: '57'
    text: |-
      De voor pensioenen bestemde gelden van een beroepspensioenfonds worden, tenzij [artikel 58][ref1] toepassing vindt,
      aangewend tot het overdragen of het herverzekeren van het risico dat voortspruit uit de in de statuten en enig
      pensioenreglement van het beroepspensioenfonds neergelegde verplichtingen, door het sluiten van overeenkomsten van
      verzekering met een verzekeraar.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel58
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '58.1'
    text: |-
      Als uit een actuariële en bedrijfstechnische nota als bedoeld in [artikel 61][ref1], blijkt dat wordt voldaan aan
      het bepaalde bij en krachtens de [artikelen 32][ref2], [60][ref3], [61][ref4] en [62][ref5] en bovendien aan de
      eisen die op grond van het tweede lid worden gesteld, behoeft overdracht of herverzekering van het risico, bedoeld
      in [artikel 57][ref6] niet plaats te hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel32
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel61
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel62
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel57
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1.2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref6
        bwb_id: BWBR0018831
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '58.2'
    text: |-
      Zodra het beroepspensioenfonds verplichtingen heeft ten aanzien waarvan [artikel 57][ref1] geen toepassing heeft
      gevonden, doet het bestuur van het fonds daarvan onverwijld mededeling aan De Nederlandsche Bank N.V. Het bepaalde
      bij en krachtens [artikel 61, tweede en derde lid][ref2] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel61
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '59.1'
    text: |-
      Een beroepspensioenfonds stelt toereikende technische voorzieningen vast met betrekking tot het geheel van uit
      de statuten en reglementen voortvloeiende pensioenverplichtingen en beschikt te allen tijde over voldoende en
      passende activa om deze technische voorzieningen te dekken. De technische voorzieningen worden elk jaar berekend.
      De berekening wordt uitgevoerd en gewaarmerkt door een actuaris op grond van de met het bij of krachtens deze wet
      bepaalde overeenstemmende actuariële methoden en met inachtneming van de volgende beginselen:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.1.a
    text: |-
      het minimumbedrag van de technische voorzieningen wordt berekend aan de hand van een voldoende prudente actuariële
      waardering, rekening houdend met alle verplichtingen inzake uitkeringen en inzake bijdragen, overeenkomstig
      de door het beroepspensioenfonds uitgevoerde beroepspensioenregeling. Het minimumbedrag moet voldoende zijn
      om te waarborgen dat de uitbetaling van reeds verschuldigde pensioenen aan de pensioengerechtigden, kan worden
      voortgezet, en om de verplichtingen te weerspiegelen die voortvloeien uit de opgebouwde pensioenrechten van de
      deelnemers. De economische en actuariële hypothesen die voor de waardering van de passiva worden gehanteerd, worden
      eveneens op prudente wijze bepaald, waarbij een redelijke marge voor negatieve afwijkingen in acht wordt genomen,
      indien van toepassing;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.1.b
    text: |-
      de toegepaste maximale rentepercentages worden op prudente wijze bepaald. Bij de bepaling van deze prudente
      rentepercentages wordt rekening gehouden met:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.1.b.1°
    text: |-
      het rendement van de overeenkomstige activa die door het beroepspensioenfonds worden beheerd en met de toekomstige
      beleggingsopbrengsten, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.1.b.2°
    text: marktrendementen van kwalitatief hoogwaardige of staatsobligaties;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.1.c
    text: |-
      de voor de berekening van de technische voorzieningen gebruikte tabellen inzake overlijden of arbeidsongeschiktheid
      en levensverwachting worden gebaseerd op prudente beginselen, rekening houdend met de hoofdkenmerken van de
      deelnemersgroep en de beroepspensioenregelingen, in het bijzonder de verwachte veranderingen in de relevante
      risico's;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.1.d
    text: |-
      de methode en de grondslag van de berekening van de technische voorzieningen blijven van boekjaar tot boekjaar
      ongewijzigd, tenzij wijzigingen daarin gerechtvaardigd zijn als gevolg van een verandering van de juridische,
      demografische of economische omstandigheden die aan de hypothesen ten grondslag liggen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: '59.2'
    text: |-
      Een beroepspensioenfonds dat niet volledig het risico, bedoeld in [artikel 57][ref1], heeft overgedragen of
      herverzekerd houdt, naast de technische voorzieningen, permanent bij wijze van buffer een eigen vermogen aan dat:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel57
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 59.2.a
    text: |-
      in overeenstemming is met het soort risico en de aard van het eigen vermogen met betrekking tot het geheel van de
      uit de statuten en reglementen voortvloeiende pensioenverplichtingen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.2.b
    text: vrij is van alle voorzienbare verplichtingen; en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59.2.c
    text: |-
      dient als veiligheidskapitaal om verschillen op te vangen tussen de verwachte en daadwerkelijke uitgaven en
      winsten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: '59.3'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld over de berekening van het minimumbedrag van het
      eigen vermogen, bedoeld in het tweede lid, overeenkomstig de artikelen 27 en 28 van [richtlijn nr. 2002/83/
      EG](32002L0083) van het Europees Parlement en de Raad van de Europese Unie van 5 november 2002 betreffende
      levensverzekering (PbEG L 345/24).
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59
  - number: 59a.1
    text: |-
      Een beroepspensioenfonds kan, indien het geen beroepspensioenregelingen uitvoert voor een of meerdere deelnemers
      die in een andere lidstaat dan Nederland zijn gevestigd, in afwijking van [artikel 59, eerste lid][ref1], gedurende
      een korte periode over onvoldoende activa beschikken, mits het beroepspensioenfonds beschikt over een daartoe
      opgesteld en door De Nederlandsche Bank N.V. goedgekeurd herstelplan.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel59
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 59a.2
    text: |-
      Wanneer een beroepspensioenfonds niet meer over voldoende activa beschikt, dient het een concreet en haalbaar
      herstelplan in om tijdig de activa, die noodzakelijk zijn om de technische voorzieningen volledig te dekken, te
      herstellen. Het herstelplan houdt rekening met de gehele, specifieke situatie van het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59a
  - number: 59a.3
    text: |-
      Wanneer een beroepspensioenregeling tijdens de periode, bedoeld in het eerste en tweede lid, wordt beëindigd, stelt
      het beroepspensioenfonds De Nederlandsche Bank N.V. hiervan op de hoogte en stelt het fonds een procedure vast
      om de op de beëindigde beroepspensioenregeling betrekking hebbende activa en passiva aan een ander pensioenfonds,
      beroepspensioenfonds, verzekeraar of pensioeninstelling uit een andere lidstaat over te dragen, welke procedure ter
      kennis van De Nederlandsche Bank N.V. wordt gebracht.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59a
  - number: 59a.4
    text: |-
      Het beroepspensioenfonds stelt, wanneer het derde lid van toepassing is, een algemeen overzicht van de
      procedure, bedoeld in het derde lid, beschikbaar voor de deelnemers, gewezen deelnemers, pensioengerechtigden,
      andere rechthebbenden op pensioen of de vertegenwoordigers van de genoemde personen in overeenstemming met het
      vertrouwelijkheidsbeginsel.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel59a
  - number: '60.1'
    text: |-
      Een beroepspensioenfonds voert een beleggingsbeleid dat in overeenstemming is met de prudent person-regel en met
      name met de volgende voorschriften:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: 60.1.a
    text: |-
      de activa worden belegd in het belang van de deelnemers, gewezen deelnemers, pensioengerechtigden en andere
      rechthebbenden op pensioen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: 60.1.b
    text: |-
      de activa worden op zodanige wijze belegd dat de veiligheid, de kwaliteit, de liquiditeit en het rendement
      van de portefeuille als geheel zijn gewaarborgd. Activa die ter dekking van de technische voorzieningen worden
      aangehouden, worden voorts belegd op een wijze die strookt met de aard en de duur van de verwachte toekomstige
      pensioenuitkeringen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: 60.1.c
    text: |-
      de activa worden hoofdzakelijk op gereglementeerde markten belegd. Beleggingen in niet tot de handel op een
      gereglementeerde financiële markt toegelaten activa, worden tot een prudent niveau beperkt;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: 60.1.d
    text: |-
      beleggingen in derivaten zijn toegestaan voorzover deze bijdragen tot een vermindering van het beleggingsrisico
      of een doeltreffend portefeuillebeheer vergemakkelijken. Dergelijke beleggingen worden op een prudente basis
      gewaardeerd, met inachtneming van de onderliggende activa, en worden mede in aanmerking genomen bij de waardering
      van de activa van het beroepspensioenfonds. Het beroepspensioenfonds vermijdt voorts een bovenmatig risico met
      betrekking tot één en dezelfde tegenpartij en tot andere derivatenverrichtingen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: 60.1.e
    text: |-
      de activa worden naar behoren gediversifieerd zodat een bovenmatige afhankelijkheid van of vertrouwen in bepaalde
      activa, of een bepaalde emittent of groep van ondernemingen en risicoaccumulatie in de portefeuille als geheel
      worden vermeden. Beleggingen in activa, uitgegeven door dezelfde emittent of door emittenten die tot dezelfde groep
      behoren, mogen het beroepspensioenfonds niet blootstellen aan bovenmatige risicoconcentratie;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: 60.1.f
    text: |-
      beleggingen in de bijdragende onderneming worden beperkt tot ten hoogste 5% van de portefeuille als geheel, en
      ingeval de bijdragende onderneming tot een groep behoort, worden beleggingen in de ondernemingen die tot dezelfde
      groep als de bijdragende onderneming behoren, beperkt tot ten hoogste 10% van de portefeuille. Wanneer een groep
      van ondernemingen aan het beroepspensioenfonds bijdragen betaalt, geschieden beleggingen in deze bijdragende
      ondernemingen prudent, waarbij rekening wordt gehouden met de noodzaak van een behoorlijke diversificatie.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: '60.2'
    text: Het eerste lid, onderdelen e en f, is niet van toepassing op beleggingen in staatsobligaties.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: '60.3'
    text: |-
      Het eerste lid, onderdeel f, is niet van toepassing tot 23 september 2010, tenzij het beroepspensioenfonds
      bijdragen ontvangt van een of meerdere ondernemingen die zetel hebben in een andere lidstaat dan Nederland.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: '60.4'
    text: |-
      Het is een beroepspensioenfonds verboden leningen aan te gaan of namens derde partijen als garant op te treden,
      tenzij de lening tijdelijk wordt aangegaan voor liquiditeitsdoelstellingen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: '60.5'
    text: |-
      In dit artikel wordt verstaan onder «bijdragende onderneming»: een onderneming of ander lichaam, ongeacht of
      deze een of meer natuurlijke personen of rechtspersonen die optreden als werkgever of zelfstandige, dan wel een
      combinatie daarvan, omvat of hieruit bestaat, en die aan een beroepspensioenfonds bijdragen betaalt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60
  - number: 60a
    text: |-
      Een beroepspensioenfonds verricht slechts activiteiten in verband met pensioenuitkeringen en werkzaamheden die
      daarmee verband houden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel60a
  - number: '61.1'
    text: |-
      Het beroepspensioenfonds stelt een actuariële en bedrijfstechnische nota vast waarin in elk geval een omschrijving
      is opgenomen van de wijze waarop uitvoering wordt gegeven aan het bepaalde in het tweede lid en het bepaalde bij en
      krachtens de [artikelen 32][ref1], [59][ref2], [59a][ref3], [60][ref4], en [62][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel32
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel59a
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel60
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel62
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '32'
        hoofdstuk: '3'
        paragraaf: '1.2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: 59a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '61.2'
    text: |-
      Een beroepspensioenfonds beschikt over goede administratieve en boekhoudkundige procedures en adequate interne
      controlemechanismen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel61
  - number: '61.3'
    text: |-
      In de actuariële en bedrijfstechnische nota wordt een verklaring inzake beleggingsbeginselen opgenomen
      welke verklaring ten minste onderwerpen omvat als toegepaste wegingsmethoden voor beleggingsrisico's, de
      risicobeheersprocedures en de strategische allocatie van activa in het licht van de aard en de looptijd van de
      pensioenverplichtingen. Deze verklaring wordt om de drie jaren en voorts onverwijld na iedere belangrijke wijziging
      van het beleggingsbeleid herzien.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel61
  - number: '61.4'
    text: |-
      Het bestuur van het fonds legt de in het eerste lid bedoeld nota alsmede iedere wijziging daarvan onverwijld over
      aan De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel61
  - number: '61.5'
    text: |-
      De Nederlandsche Bank N.V. kan regels stellen met betrekking tot de tijdstippen en de wijze waarop uitvoering wordt
      gegeven aan het vierde lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel61
  - number: '62'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld met betrekking tot de
      [artikelen 59][ref1], [59a][ref2], [60][ref3] en [61][ref4]. Daarbij kan worden bepaald dat ingeval van overdracht
      of herverzekering als bedoeld in [artikel 57][ref5], [artikel 61][ref6] en die regels, met uitzondering van
      [artikel 61, derde lid][ref7], niet van toepassing zijn dan wel dat daarvan mag worden afgeweken.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel59
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel59a
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel60
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel61
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel57
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel61
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel61
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '59'
