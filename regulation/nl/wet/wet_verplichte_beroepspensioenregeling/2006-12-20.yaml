  - number: '116.9'
    text: |-
      [Artikel 32][ref1] is ten aanzien van aanspraken die zijn opgebouwd voor de inwerkingtreding van
      [artikel 3, eerste lid][ref2], voorzover het aanspraken betreft die op de datum van inwerkingtreding van dat
      artikellid niet voldoen aan de eis van [artikel 32, eerste lid][ref3], gedurende tien jaar na het tijdstip van
      inwerkingtreding van [artikel 3, eerste lid][ref4], niet van toepassing, met dien verstande dat de financiering van
      die aanspraken ten minste in gelijke delen per kalenderjaar plaatsvindt. De Nederlandsche Bank kan toestaan dat,
      in afwijking van de eerste zin gedurende een langere periode, maar niet langer dan gedurende vijftien jaar geen
      toepassing wordt gegeven aan [artikel 32][ref5], voor zover dat noodzakelijk is ter voorkoming van onaanvaardbare
      financiële gevolgen voor de betrokken beroepspensioenregeling of de betrokken beroepsgenoten.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel32
