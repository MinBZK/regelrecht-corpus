  - number: '86'
    text: |-
      De werkzaamheden in verband met het opleggen van een dwangsom worden verricht door personen die niet betrokken zijn
      geweest bij het vaststellen van het niet naleven van de in [artikel 85][ref1] genoemde voorschriften en het daaraan
      voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel85
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel86
