  - number: '116.16'
    text: |-
      [Artikel 52, eerste lid][ref1], en [artikel 56, tweede lid][ref2], zijn ten aanzien van een beroepspensioenfonds
      waarvan de beroepspensioenregeling voor de inwerkingtreding van dat artikellid is verplichtgesteld of ten aanzien
      waarvan voor de inwerkingtreding van dat artikellid een aanvraag tot verplichtstelling is gedaan, eerst van
      toepassing met ingang van het derde jaar na het tijdstip van inwerkingtreding van het betreffende artikellid.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel56
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel116
