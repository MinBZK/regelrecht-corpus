  - number: '89.1'
    text: Beboetbare feiten kunnen worden begaan door natuurlijke personen en rechtspersonen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: '89.2'
    text: 'Indien een beboetbaar feit wordt begaan door een rechtspersoon kan de boete worden opgelegd aan:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: 89.2.1°
    text: de rechtspersoon, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: 89.2.2°
    text: |-
      degene die opdracht heeft gegeven tot de gedraging waardoor de verplichtingen die voortvloeien uit deze wet of de
      daarop berustende bepalingen niet zijn nageleefd alsmede tegen hem die feitelijke leiding heeft gegeven aan die
      gedraging, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: 89.2.3°
    text: de onder 1° en 2° genoemde tezamen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: '89.3'
    text: 'Voor de toepassing van het eerste en tweede lid wordt met een rechtspersoon gelijkgesteld:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: 89.3.1°
    text: de vennootschap zonder rechtspersoonlijkheid, en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: 89.3.2°
    text: de maatschap.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel89
  - number: '90.1'
    text: |-
      Het bedrag van de boete wordt bepaald als voorzien in de bijlage met dien verstande dat de boete voor een
      afzonderlijke overtreding ten hoogste € 907 560 bedraagt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel90
  - number: '90.2'
    text: In de bijlage wordt bepaald bij elke daarin omschreven overtreding het bedrag van de deswege op te leggen boete.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel90
  - number: '90.3'
    text: De bijlage kan bij algemene maatregel van bestuur worden gewijzigd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel90
  - number: '90.4'
    text: |-
      De Nederlandsche Bank N.V. kan het bedrag van de boete lager stellen dan in de bijlage is bepaald, indien het
      bedrag van de boete in een bepaald geval op grond van bijzondere omstandigheden onevenredig hoog moet worden
      geacht.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel90
  - number: '91'
    text: |-
      De persoon jegens wie door De Nederlandsche Bank N.V. een handeling is verricht waaraan hij in redelijkheid de
      gevolgtrekking kan verbinden dat hem wegens het begaan van een beboetbaar feit een boete zal worden opgelegd, is
      niet verplicht ter zake daarvan enige verklaring af te leggen. Hij wordt hiervan in kennis gesteld alvorens hem
      mondeling om informatie wordt gevraagd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel91
  - number: '92.1'
    text: |-
      Indien De Nederlandsche Bank N.V. voornemens is om de persoon door wie een beboetbaar feit is begaan een boete op
      te leggen, wordt deze hiervan in kennis gesteld onder vermelding van de gronden waarop het voornemen berust.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel92
  - number: '92.2'
    text: |-
      In afwijking van [afdeling 4.1.2 van de Algemene wet bestuursrecht][ref1] stelt De Nederlandsche Bank N.V. binnen
      een door hem te bepalen termijn de persoon, bedoeld in het eerste lid, in de gelegenheid om naar keuze schriftelijk
      of mondeling zijn zienswijze naar voren te brengen alvorens de boete wordt opgelegd, tenzij het een overtreding
      betreft die in de bijlage of de algemene maatregel van bestuur, bedoeld in [artikel 90][ref2] is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling4.1.2
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel90
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 4.1.2
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '90'
        hoofdstuk: '6'
        paragraaf: '11'
  - number: '93'
    text: |-
      De werkzaamheden in verband met het opleggen van een boete worden verricht door personen die niet betrokken zijn
      geweest bij het vaststellen van het niet naleven van de in [artikel 88][ref1] genoemde artikelen en de daarop
      berustende bepalingen en het daaraan voorafgaande onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel88
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '88'
        hoofdstuk: '6'
        paragraaf: '11'
  - number: '94.1'
    text: Een boete wordt opgelegd bij beschikking van De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel94
  - number: '94.2'
    text: 'In de beschikking wordt in ieder geval vermeld:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel94
  - number: 94.2.a
    text: het beboetbare feit ter zake waarvan de boete opgelegd wordt, alsmede het overtreden voorschrift;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel94
  - number: 94.2.b
    text: de hoogte van de boete en de gegevens op basis waarvan de hoogte van de boete is bepaald, en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel94
  - number: 94.2.c
    text: de termijn, waarbinnen de boete moet worden betaald.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel94
  - number: '95.1'
    text: |-
      De werking van de beschikking waarbij een boete wordt opgelegd wordt geschorst totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel95
  - number: '95.2'
    text: |-
      In afwijking van het eerste lid wordt de werking van de beschikking tot oplegging van een boete voor een
      overtreding die op grond van [artikel 92, tweede lid][ref1], is aangewezen, opgeschort totdat de bezwaartermijn is
      verstreken of, indien bezwaar is gemaakt, op het bezwaar is beslist.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel92
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '11'
  - number: '96.1'
    text: |-
      De bevoegdheid een boete op te leggen vervalt na verloop van drie jaren na de dag waarop het beboetbare feit is
      begaan.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel96
  - number: '96.2'
    text: De beslissing om een boete op te leggen stuit de in het eerste lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel96
  - number: '97.1'
    text: De boete wordt betaald binnen zes weken na de inwerkingtreding van de beschikking waarbij zij is opgelegd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel97
  - number: '97.2'
    text: |-
      De boete wordt vermeerderd met de wettelijke rente, te rekenen vanaf de dag waarop sinds de bekendmaking
      van de beschikking zes weken zijn verstreken, tenzij het een overtreding betreft die op grond van
      [artikel 92, tweede lid][ref1], is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel92
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '92'
        hoofdstuk: '6'
        paragraaf: '11'
  - number: '98.1'
    text: |-
      Bij gebreke van betaling van de boete stuurt De Nederlandsche Bank N.V. schriftelijk een aanmaning om binnen
      twee weken alsnog aan de verplichtingen te voldoen. De verschuldigde boete wordt verhoogd met de kosten die op de
      aanmaning betrekking hebben.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel98
  - number: '98.2'
    text: |-
      De aanmaning bevat de aanzegging, dat de boete, voor zover deze binnen de in de aanmaning gestelde termijn niet
      wordt voldaan, wordt ingevorderd overeenkomstig [artikel 99][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel99
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '99'
        hoofdstuk: '6'
        paragraaf: '11'
  - number: '99.1'
    text: |-
      Bij gebreke van betaling van de boete vordert De Nederlandsche Bank N.V. van de persoon aan wie de boete is
      opgelegd de verschuldigde boete, verhoogd met de op de aanmaning en invordering betrekking hebbende kosten, bij
      dwangbevel in.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel99
  - number: '99.2'
    text: |-
      Het dwangbevel wordt op kosten van de natuurlijke persoon of rechtspersoon aan wie de boete
      is opgelegd bij deurwaardersexploot betekend en levert een executoriale titel op in de zin van
      [Boek 2 van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel99
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '99.3'
    text: |-
      Gedurende zes weken na de dag van betekening van het dwangbevel staat verzet tegen het dwangbevel open door
      dagvaarding van De Nederlandsche Bank N.V.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel99
  - number: '99.4'
    text: Het verzet wordt niet gegrond op de stelling dat de boete ten onrechte of op een te hoge geldsom is vastgesteld.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel99
  - number: '99.5'
    text: |-
      Het verzet schorst de tenuitvoerlegging niet, tenzij de president van de rechtbank in kort geding desgevraagd
      anders beslist.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel99
  - number: '100.1'
    text: |-
      De Nederlandsche Bank N.V. verstrekt op verzoek van Onze Minister gegevens of inlichtingen die naar zijn oordeel
      nodig zijn voor een onderzoek naar de toereikendheid van deze wet en de daarop berustende bepalingen of de wijze
      waarop De Nederlandsche Bank N.V. deze wet en de daarop berustende bepalingen uitvoert of heeft uitgevoerd, indien
      dat ter wille van het bedrijfseconomisch toezicht nodig blijkt, alsmede gegevens of inlichtingen die betrekking
      hebben op de uitvoering van de artikelen, genoemd in [artikel 101][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel101
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '101'
        hoofdstuk: '6'
        paragraaf: '12'
  - number: '100.2'
    text: |-
      De Nederlandsche Bank N.V. verstrekt de in het eerste lid bedoelde gegevens of inlichtingen. Indien Onze Minister
      De Nederlandsche Bank N.V. vraagt bepaalde gegevens of inlichtingen te verstrekken die op grond van hetgeen in deze
      wet en de daarop berustende bepalingen is bepaald over afzonderlijke beroepspensioenfondsen zijn verstrekt of zijn
      verkregen, en die geen betrekking hebben op de uitvoering van de artikelen, genoemd in [artikel 101][ref1] is De
      Nederlandsche Bank N.V. niet verplicht deze gegevens of inlichtingen te verstrekken aan Onze Minister indien deze
      betrekking hebben op of herleidbaar zijn tot een afzonderlijk beroepspensioenfonds, rechtspersoon, vennootschap
      of natuurlijke persoon, met uitzondering van gegevens of inlichtingen die betrekking hebben op of herleidbaar
      zijn tot een pensioenfonds dat in staat van faillissement is verklaard of op grond van een rechterlijke uitspraak
      is ontbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel101
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '101'
        hoofdstuk: '6'
        paragraaf: '12'
  - number: '100.3'
    text: |-
      Onze Minister is bevoegd een derde op te dragen de gegevens of inlichtingen die hem op grond van het eerste
      lid zijn verstrekt te onderzoeken en aan hem verslag uit te brengen. Ook kan Onze Minister de derde die in zijn
      opdracht handelt, machtigen namens hem gegevens of inlichtingen in te winnen. In dat geval zijn het eerste en
      tweede lid van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
  - number: '100.4'
    text: |-
      Onze Minister gebruikt de gegevens of inlichtingen die hij op grond van het eerste of derde lid heeft verkregen
      uitsluitend voor het vormen van zijn oordeel over:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
  - number: 100.4.a
    text: de toereikendheid van deze wet en de daarop berustende bepalingen, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
  - number: 100.4.b
    text: |-
      de wijze waarop De Nederlandsche Bank N.V. deze wet en de daarop berustende bepalingen uitvoert of heeft
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
  - number: '100.5'
    text: |-
      Onze Minister en de derde bedoeld in het derde lid, zijn verplicht tot geheimhouding van de op grond van het tweede
      lid, tweede volzin, ontvangen gegevens of inlichtingen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
  - number: '100.6'
    text: |-
      Niettegenstaande het vierde en vijfde lid kan Onze Minister de aan de gegevens of inlichtingen ontleende
      bevindingen en de daaruit getrokken conclusies aan de Staten-Generaal mededelen en de conclusies in algemene zin
      openbaar maken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
  - number: '100.7'
    text: |-
      De [Wet openbaarheid van bestuur][ref1] en de [Wet Nationale ombudsman][ref2] zijn niet van toepassing met
      betrekking tot de in dit artikel bedoelde gegevens of inlichtingen die Onze Minister of de in zijn opdracht
      werkende onder zich heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0005252
      - id: ref2
        bwb_id: BWBR0003372
  - number: '101'
    text: |-
      Bij ministeriële regeling worden regels gesteld omtrent de uitvoering door De Nederlandsche Bank N.V. van
      de [artikelen 20][ref1], [21][ref2], [23][ref3], [24][ref4], [29][ref5], [30][ref6], [34][ref7], [35][ref8],
      [37][ref9], [38][ref10], [39][ref11], [40][ref12], [41][ref13], [42][ref14], [43][ref15], [44][ref16], [45][ref17],
      [70][ref18] en [71][ref19].


