      [artikel 26 van de Wet betreffende verplichte deelneming in een beroepspensioenregeling][ref1] zoals
      [dat artikel][ref2] luidde op de dag voorafgaand aan de inwerkingtreding van [artikel 16][ref3], wordt aangemerkt
