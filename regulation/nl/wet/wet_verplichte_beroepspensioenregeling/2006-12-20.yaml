  - number: '84.2'
    text: |-
      Geen ontheffing wordt verleend, wanneer het verzoek daartoe betrekking heeft op afkoop van pensioen of een
      aanspraak op pensioen, anders dan met het oog op verwerving van aanspraken op pensioen jegens een in het buitenland
      gevestigde instelling.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
  - number: '84.3'
    text: De ontheffing kan onder beperkingen worden verleend. Aan de ontheffing kunnen voorschriften worden verbonden.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
  - number: '84.4'
    text: 'De ontheffing kan worden ingetrokken indien:'
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
  - number: 84.4.a
    text: één of meer van de redenen waarom zij is verleend is of zijn vervallen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
  - number: 84.4.b
    text: |-
      zich na de verlening zodanige feiten of omstandigheden hebben voorgedaan, dat indien deze ook ten tijde van de
      verlening bekend waren geweest, de ontheffing niet of niet in die vorm zou zijn verleend, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
  - number: 84.4.c
    text: één of meer van de aan de ontheffing verbonden beperkingen of voorschriften niet wordt of worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
  - number: '84.5'
    text: |-
      De Nederlandsche Bank N.V. stelt beleidsregels vast over het nemen van beslissingen ter zake van ontheffing. De
      beleidsregels worden gepubliceerd in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
  - number: '85.1'
    text: |-
      De Nederlandsche Bank N.V. kan een last onder dwangsom opleggen ter zake van het niet naleven van
      voorschriften, gesteld bij of krachtens de [artikelen 6][ref1], [19][ref2], [20][ref3], [21][ref4],
      [22a][ref5], [22c][ref6], [23][ref7], [24][ref8], 26a, [28][ref9], [32][ref10], [37][ref11], [38][ref12],
