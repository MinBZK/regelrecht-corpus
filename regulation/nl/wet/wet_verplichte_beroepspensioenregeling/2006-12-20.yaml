  - number: '116.23'
    text: |-
      Voor de toepassing van [artikel 6][ref1] wordt onder «een daartoe door een beroepspensioenvereniging opgericht
      beroepspensioenfonds» mede verstaan een beroepspensioenfonds dat een beroepspensioenregeling uitvoert die voor
      de inwerkingtreding van [artikel 3][ref2] is verplichtgesteld of ten aanzien waarvan voor de inwerkingtreding
      van [dat artikel][ref3] een aanvraag tot verplichtstelling is gedaan, met betrekking tot de uitvoering van die
      regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel3
