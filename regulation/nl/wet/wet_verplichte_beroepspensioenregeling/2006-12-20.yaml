      - id: ref5
        bwb_id: BWBR0005290
        artikel: '969'
      - id: ref6
        bwb_id: BWBR0005290
        artikel: '972'
      - id: ref7
        bwb_id: BWBR0005290
        artikel: '977'
      - id: ref8
        bwb_id: BWBR0005290
        artikel: '978'
      - id: ref9
        bwb_id: BWBR0005290
        artikel: '979'
      - id: ref10
