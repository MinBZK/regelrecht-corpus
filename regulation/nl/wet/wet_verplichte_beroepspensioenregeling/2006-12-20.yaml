  - number: '116.17'
    text: |-
      Ten aanzien van personen die al op 31 december 2000 het beleid van het beroepspensioenfonds bepaalden of mede
      bepaalden kan een beoordeling als bedoeld in [artikel 53, tweede en derde lid][ref1], achterwege blijven voor de
      resterende duur van hun aanstellings- of benoemingstermijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel53
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel116
