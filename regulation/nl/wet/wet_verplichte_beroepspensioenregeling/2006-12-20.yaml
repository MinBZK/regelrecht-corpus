        artikel: '1'
        hoofdstuk: '1'
  - number: 67a.2
    text: |-
      Het verminderen of vervallen van een uitkering op grond van een verzekeringsovereenkomst als bedoeld in het
      eerste lid op basis van [artikel 930, derde tot en met vijfde lid, van Boek 7 van het Burgerlijk Wetboek][ref1]
      is niet mogelijk, tenzij door een deelnemer als bedoeld in [artikel 1, eerste lid, onderdeel f][ref2], niet
      is voldaan aan de in [artikel 928 van Boek 7 van het Burgerlijk Wetboek][ref3] omschreven mededelingsplicht
      betreffende zijn risico. In dat geval beperkt de vermindering of het verval van de uitkering zich tot het risico
      met betrekking tot de in de eerste zin bedoelde persoon. Voorzover de eerste zin in de weg staat aan vermindering
      dan wel verval van een uitkering, heeft het beroepspensioenfonds of de verzekeraar een recht van verhaal op de
      beroepspensioenvereniging of de werkgever.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel930
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel1
      [ref3]: https://wetten.overheid.nl/BWBR0005290#Artikel928
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '930'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '1'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0005290
        artikel: '928'
  - number: 67a.3
    text: |-
      Een beding als bedoeld in [artikel 941, vierde lid, van Boek 7 van het Burgerlijk Wetboek][ref1] is nietig wanneer
      dit is opgenomen in een verzekeringsovereenkomst als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005290#Artikel941
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0005290
        artikel: '941'
  - number: 67a.4
    text: |-
      Voor zover bepalingen van de [titels 17][ref1] en [18 van Boek 7 van het Burgerlijk Wetboek][ref2] strijden met
      deze wet blijven die bepalingen van de [titels 17][ref3] en[ 18 van Boek 7 van het Burgerlijk Wetboek][ref4] buiten
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005290
      [ref2]: https://wetten.overheid.nl/BWBR0005290
      [ref3]: https://wetten.overheid.nl/BWBR0005290
      [ref4]: https://wetten.overheid.nl/BWBR0005290
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel67a
    references:
      - id: ref1
        bwb_id: BWBR0005290
      - id: ref2
        bwb_id: BWBR0005290
      - id: ref3
        bwb_id: BWBR0005290
      - id: ref4
        bwb_id: BWBR0005290
  - number: '68'
    text: |-
      De Nederlandsche Bank N.V. is belast met het toezicht op de naleving van deze wet en de daarop berustende
      bepalingen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel68
  - number: '69'
    text: |-
      De Nederlandsche Bank N.V. brengt jaarlijks aan Onze Minister verslag uit over haar werkzaamheden en bevindingen
      over de toepassing van deze wet en de daarop berustende bepalingen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel69
  - number: '70.1'
    text: |-
      De Nederlandsche Bank N.V. verzamelt en bewerkt voor het door Onze Minister te voeren beleid inzake
      beroepspensioenregelingen de daarvoor van belang zijnde gegevens over beroepspensioenregelingen en over het aantal
      personen dat onder de werking van die regelingen valt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel70
  - number: '70.2'
    text: |-
      Onze Minister of de Sociaal Economische Raad kunnen beschikken over de resultaten van de uitvoering van het eerste
      lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel70
  - number: '70.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen nadere regels worden gesteld met betrekking tot het soort gegevens van
      pensioenuitvoerders waarover Onze Minister of de Sociaal Economische Raad kunnen beschikken bij de uitvoering van
      het eerste en tweede lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel70
  - number: '71.1'
    text: |-
      De pensioenuitvoerder verstrekt op verzoek van De Nederlandsche Bank N.V. alle gegevens die noodzakelijk zijn voor
      de uitvoering van [artikel 70, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel70
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '70'
        hoofdstuk: '6'
        paragraaf: '3'
  - number: '71.2'
    text: |-
      De Nederlandsche Bank N.V. organiseert ten minste een keer per jaar een overleg met belanghebbenden aangaande
      pensioenen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71
  - number: 71a
    text: |-
      De Nederlandsche Bank N.V. beheert een register waarin alle beroepspensioenfondsen met zetel in Nederland worden
      ingeschreven. In het register wordt, indien een vergunning is verleend als bedoeld in [artikel 22a][ref1], een
      beknopte weergave van de inhoud van de aan het fonds verleende vergunning opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22a
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71a
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 71b
    text: |-
      De Nederlandsche Bank N.V. is verplicht nauw samen te werken met de Europese Commissie en de bevoegde autoriteiten
      uit andere lidstaten dan Nederland, zoals voorgeschreven door [richtlijn 2003/41/EG](32003L0041).
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71b
  - number: 71c
    text: |-
      De vergunning, bedoeld in [artikel 22a, onderdeel a][ref1], wordt op aanvraag door De Nederlandsche Bank N.V.
      verleend wanneer het beroepspensioenfonds:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22a
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 71c.a
    text: |-
      is ingeschreven in het register, bedoeld in [artikel 71a][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel71a
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 71a
        hoofdstuk: '6'
        paragraaf: '3'
  - number: 71c.b
    text: |-
      voldoet aan de [artikelen 19, tweede lid, onderdeel c][ref1], [53, tweede lid][ref2], [59, eerste lid][ref3], en
      26a.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel53
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel59
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71c
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '19'
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 71d
    text: |-
      De Nederlandsche Bank N.V. kan de vergunning, bedoeld in [artikel 22a, onderdeel a][ref1], geheel of gedeeltelijk
      intrekken of daaraan nadere voorschriften verbinden wanneer:


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22a
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 71d.a
    text: |-
      het beroepspensioenfonds niet langer voldoet aan [artikel 71c][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel71c
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71d
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 71c
        hoofdstuk: '6'
        paragraaf: 3a
  - number: 71d.b
    text: |-
      de bij de aanvraag verstrekte gegevens onjuist of onvolledig zijn en de verstrekking van de juiste of volledige
      gegevens tot een andere beschikking op de aanvraag tot verlening van de vergunning zou hebben geleid;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71d
  - number: 71d.c
    text: de verlening van de vergunning anderszins onjuist was en het fonds dit wist of behoorde te weten, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71d
  - number: 71d.d
    text: |-
      van de vergunning gedurende twee jaren, na de dagtekening van de beschikking waarbij de vergunning is verleend,
      geen gebruik is gemaakt.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71d
  - number: 71e.1
    text: |-
      De Nederlandsche Bank N.V. doet, binnen drie maanden na ontvangst van de gegevens, bedoeld in
      [artikel 22b, tweede lid][ref1], mededeling van deze gegevens aan de bevoegde autoriteiten van de lidstaat waar
      de zelfstandige of beroepsgenoot is gevestigd, tenzij het beroepspensioenfonds niet beschikt over een vergunning
      als bedoeld in [artikel 22a, onderdeel a][ref2], of De Nederlandsche Bank N.V. reden heeft te betwijfelen dat
      de administratieve structuur of de financiële positie van het beroepspensioenfonds, of de goede reputatie en de
      beroepskwalificaties of beroepservaring van de personen die het fonds besturen met de in die lidstaat voorgenomen
      activiteiten verenigbaar zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22b
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel22a
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71e
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 22b
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 71e.2
    text: |-
      De Nederlandsche Bank N.V. doet gelijktijdig mededeling aan het beroepspensioenfonds van de verstrekking van de
      gegevens aan de bevoegde autoriteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71e
  - number: 71e.3
    text: |-
      De Nederlandsche Bank N.V. doet mededeling aan het fonds van informatie over de toepasselijke bepalingen van
      sociale en arbeidswetgeving, ontvangen van de bevoegde autoriteiten, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71e
  - number: 71f
    text: |-
      Een beroepspensioenfonds kan na ontvangst van de mededeling, bedoeld in [artikel 71e, derde lid][ref1], dan wel
      nadat twee maanden zijn verstreken na ontvangst van de mededeling, bedoeld in [artikel 71e, tweede lid][ref2],
      beginnen met het uitvoeren van de voorgenomen pensioenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel71e
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel71e
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71f
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 71e
        hoofdstuk: '6'
        paragraaf: 3b
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 71e
        hoofdstuk: '6'
        paragraaf: 3b
  - number: 71g.1
    text: |-
      De Nederlandsche Bank N.V. verbiedt een beroepspensioenfonds bijdragen te ontvangen van een zelfstandige of
      beroepsgenoot die is gevestigd in een andere lidstaat dan Nederland wanneer De Nederlandsche Bank N.V. reden heeft
      tot twijfel als bedoeld in [artikel 71e, eerste lid][ref1], of het fonds niet beschikt over een vergunning, bedoeld
      in [artikel 22a, onderdeel a][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel71e
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel22a
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71g
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 71e
        hoofdstuk: '6'
        paragraaf: 3b
      - id: ref2
        bwb_id: BWBR0018831
        artikel: 22a
        hoofdstuk: '3'
        paragraaf: '1'
  - number: 71g.2
    text: |-
      De Nederlandsche Bank N.V. kan een beroepspensioenfonds verbieden nog langer bijdragen te ontvangen van een
      zelfstandige of beroepsgenoot die is gevestigd in een andere lidstaat dan Nederland wanneer door de bevoegde
      autoriteiten van de lidstaat waarvan de voor bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving
      van toepassing is, melding heeft gemaakt van een door het fonds gemaakte inbreuk op de toepasselijke sociale en
      arbeidswetgeving.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71g
  - number: 71g.3
    text: |-
      De Nederlandsche Bank N.V. legt een verbod als bedoeld in dit artikel op in de vorm van een aanwijzing als bedoeld
      in [artikel 81][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71g
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '7'
  - number: 71h
    text: |-
      De Nederlandsche Bank N.V. neemt, in coördinatie met de bevoegde autoriteiten van de lidstaat waarvan de voor
      bedrijfspensioenvoorziening geldende sociale en arbeidswetgeving van toepassing is op de beroepspensioenregeling,
      de nodige maatregelen om ervoor te zorgen dat een beroepspensioenfonds een einde maakt aan een vastgestelde inbreuk
      op de toepasselijke regelgeving.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71h
  - number: 71i
    text: |-
      Het is een pensioeninstelling uit een andere lidstaat verboden bijdragen te aanvaarden van een in Nederland
      gevestigde zelfstandige of beroepsgenoot zonder:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71i
  - number: 71i.a
    text: |-
      een daartoe verleende vergunning van de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een
      andere lidstaat haar zetel heeft; en
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71i
  - number: 71i.b
    text: |-
      zonder de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling zetel heeft in kennis te hebben
      gesteld van het voornemen een pensioenregeling uit te voeren voor een in Nederland gevestigde zelfstandige of
      beroepsgenoot.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71i
  - number: 71j.1
    text: |-
      De Nederlandsche Bank N.V. informeert, binnen twee maanden na de datum van ontvangst van gegevens als bedoeld in
      [artikel 22b, tweede lid][ref1], de bevoegde autoriteiten van de lidstaat waar de pensioeninstelling uit een andere
      lidstaat haar zetel heeft en die deze gegevens hebben verstrekt, over de bepalingen van de Nederlandse sociale
      en arbeidswetgeving die van toepassing zijn op de pensioenregeling waaraan wordt bijgedragen door de in Nederland
      gevestigde zelfstandige of beroepsgenoot en de [artikelen 25][ref2], [26][ref3] en 26a.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel22b
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel26
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71j
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 22b
        hoofdstuk: '3'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 71j.2
    text: |-
      De Nederlandsche Bank N.V. stelt de bevoegde autoriteiten, bedoeld in het eerste lid, in kennis van elke
      significante wijziging in de op de beroepspensioenregeling toepasselijke sociale en arbeidswetgeving die gevolgen
      kan hebben voor de kenmerken van de pensioenregeling en voorts van iedere wijziging in de [artikelen 25][ref1],
      [26][ref2] en 26a.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel26
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71j
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 71k
    text: |-
      Wanneer bij het toezicht door De Nederlandsche Bank N.V. blijkt dat de pensioeninstelling uit een andere lidstaat
      bij de uitvoering van een pensioenregeling waaraan door een in Nederland gevestigde zelfstandige of beroepsgenoot
      wordt bijgedragen in strijd met de Nederlandse sociale en arbeidswetgeving of de [artikelen 25][ref1],
      [26][ref2] en 26a handelt, stelt De Nederlandsche Bank N.V. de bevoegde autoriteiten van de lidstaat waar de
      pensioeninstelling haar zetel heeft hiervan onverwijld in kennis, onder mededeling van deze kennisgeving aan de
      pensioeninstelling uit een andere lidstaat.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel26
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71k
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '26'
        hoofdstuk: '3'
        paragraaf: '2'
  - number: 71l.1
    text: |-
      Indien een pensioeninstelling uit een andere lidstaat inbreuk blijft maken op de op de pensioenregeling
      toepasselijke Nederlandse sociale en arbeidswetgeving, in weerwil van de door de bevoegde autoriteiten van de
      lidstaat waar de pensioeninstelling uit een andere lidstaat haar zetel heeft getroffen maatregelen of omdat
      die bevoegde autoriteiten geen passende maatregelen hebben getroffen, kan De Nederlandsche Bank N.V., na die
      bevoegde autoriteiten daarvan in kennis te hebben gesteld, passende maatregelen nemen om de inbreuk op de
      toepasselijke regelgeving door de pensioeninstelling te beëindigen en, voorzover zulks volstrekt noodzakelijk
      is, de pensioeninstelling te beletten activiteiten te verrichten voor de Nederlandse bijdragende zelfstandige of
      beroepsgenoot.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71l
  - number: 71l.2
    text: |-
      De Nederlandsche Bank N.V. kan, ter uitvoering van het eerste lid, de bevoegdheden, bedoeld in de
      [artikelen 81][ref1], [85][ref2] en [87][ref3], toepassen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel85
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel87
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71l
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '85'
        hoofdstuk: '6'
        paragraaf: '10'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '87'
        hoofdstuk: '6'
        paragraaf: '11'
  - number: 71l.3
    text: |-
      De Nederlandsche Bank N.V. kan, na toepassing van [artikel 71k][ref1], de bevoegdheden, bedoeld in de
      [artikelen 81][ref2], [85][ref3] en [87][ref4], toepassen wanneer een pensioeninstelling uit een andere lidstaat
      [artikel 71h][ref5] niet naleeft.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel71k
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel85
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel87
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel71h
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel71l
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: 71k
        hoofdstuk: '6'
        paragraaf: 3c
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '7'
      - id: ref3
        bwb_id: BWBR0018831
        artikel: '85'
        hoofdstuk: '6'
        paragraaf: '10'
      - id: ref4
        bwb_id: BWBR0018831
        artikel: '87'
        hoofdstuk: '6'
        paragraaf: '11'
      - id: ref5
        bwb_id: BWBR0018831
        artikel: 71h
        hoofdstuk: '6'
        paragraaf: 3b
  - number: '72.1'
    text: |-
      De Nederlandsche Bank N.V. is bevoegd inzage te vorderen van zakelijke gegevens en bescheiden van een
      pensioenuitvoerder waarop deze wet en de daarop berustende bepalingen van toepassing zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel72
  - number: '72.2'
    text: |-
      De Nederlandsche Bank N.V. kan personen bij uitdrukkelijke en bijzondere machtiging aanwijzen om de in het eerste
      lid neergelegde bevoegdheid uit te oefenen. Op de in de eerste volzin bedoelde gemachtigde personen zijn de
      [artikelen 5:13][ref1] en [5:15 van de Algemene wet bestuursrecht][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '72.3'
    text: |-
      Een ieder die de zakelijke gegevens en bescheiden, bedoeld in het eerste lid onder zich heeft, legt deze daartoe
      door De Nederlandsche Bank N.V. gevorderd open.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel72
  - number: '72.4'
    text: |-
      De pensioenuitvoerder en de beroepspensioenvereniging hebben de zakelijke gegevens en bescheiden in Nederland
      beschikbaar en houden deze gedurende ten minste zeven jaren na het boekjaar waarop ze betrekking hebben
      beschikbaar.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel72
  - number: '72.5'
    text: |-
      Het vierde lid is niet van toepassing op een verzekeraar met een zetel in een andere lidstaat van de Europese Unie
      of een pensioeninstelling uit een andere lidstaat.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel72
  - number: '73'
    text: |-
      De pensioenuitvoerder en de beroepspensioenvereniging verstrekken De Nederlandsche Bank N.V. binnen de door haar
      te bepalen termijn kosteloos de inlichtingen die zij voor de vervulling van de haar bij deze wet of de daarop
      berustende bepalingen opgelegde taak nodig acht.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel73
  - number: '74.1'
    text: |-
      De accountant, bedoeld in [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1], biedt desgevraagd
      aan De Nederlandsche Bank N.V. inzicht in zijn controlewerkzaamheden en verstrekt haar alle overige inlichtingen
      die redelijkerwijze kunnen worden geacht nodig te zijn voor de vervulling van de haar bij deze wet of de daarop
      berustende bepalingen opgelegde taak.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '74.2'
    text: |-
      De accountant, bedoeld in het eerste lid, meldt De Nederlandsche Bank N.V. zo spoedig mogelijk elke omstandigheid
      waarvan hij bij de uitvoering van zijn werkzaamheden die bestaan uit het opstellen van een verklaring over de
      getrouwheid, kennis heeft gekregen en die:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel74
  - number: 74.2.a
    text: in strijd is met deze wet of de daarop berustende bepalingen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel74
  - number: 74.2.b
    text: de nakoming van de door het beroepspensioenfonds aangegane verplichtingen bedreigt, of
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel74
  - number: 74.2.c
    text: |-
      leidt tot weigering van het afgeven van de verklaring over de getrouwheid of tot het maken van voorbehouden
      daaromtrent.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel74
  - number: '74.3'
    text: |-
      De accountant die op grond van het tweede lid een melding aan De Nederlandsche Bank N.V. heeft gedaan, is niet
      aansprakelijk voor schade die een derde als gevolg daarvan lijdt, tenzij aannemelijk wordt dat hij gelet op alle
      feiten en omstandigheden, in redelijkheid die melding niet had mogen doen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel74
  - number: '75.1'
    text: |-
      [Artikel 74, eerste en tweede lid, onderdelen a en b][ref1], is van overeenkomstige toepassing op de actuaris die
      het actuarieel verslag van een verklaring voorziet.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel74
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '75.2'
    text: |-
      De actuaris die een melding aan De Nederlandsche Bank N.V. overeenkomstig
      [artikel 74, tweede lid, onderdelen a en b][ref1], heeft gedaan, is niet aansprakelijk voor schade die een derde
      als gevolg daarvan lijdt, tenzij aannemelijk wordt dat hij, gelet op alle feiten en omstandigheden, in redelijkheid
      die melding niet had mogen doen.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel74
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '74'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '76.1'
    text: |-
      Tot het opstellen van de in [artikel 75, eerste lid][ref1], bedoelde verklaring, alsmede tot het verrichten van
      andere tot de normale beroepsbezigheden van actuarissen behorende werkzaamheden voor een beroepspensioenfonds
      is tegenover De Nederlandsche Bank N.V. bevoegd degene, tegen wiens aanwijzing of handhaving bij het fonds De
      Nederlandsche Bank N.V. geen bedenkingen heeft geuit.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel75
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '75'
        hoofdstuk: '6'
        paragraaf: '5'
  - number: '76.2'
    text: |-
      De Nederlandsche Bank N.V. kan tegen de aanwijzing of handhaving van een actuaris slechts bedenkingen uiten, indien
      de betrokkene, naar het oordeel van De Nederlandsche Bank N.V., niet of niet meer de nodige waarborgen biedt, dat
      hij de hem toevertrouwde taak naar behoren zal vervullen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel76
  - number: '77.1'
    text: |-
      Ter bevordering van een goede vervulling van de haar bij deze wet en de daarop berustende bepalingen opgelegde
      taken, kan De Nederlandsche Bank N.V. getuigen en deskundigen oproepen welke personen verplicht zijn op die oproep
      te verschijnen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel77
  - number: '77.2'
    text: |-
      Het in het eerste lid bedoelde oproepen van getuigen en deskundigen gebeurt op de door De Nederlandsche Bank N.V.
      te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel77
  - number: '77.3'
    text: |-
      Het oproepen van getuigen en deskundigen door middel van dagvaarding gebeurt door een deurwaarder of een voor
      de uitvoering van de politietaak aangestelde ambtenaar of een andere ambtenaar of functionaris, voor zover
      die ambtenaar of functionaris door Onze Minister van Justitie daartoe op de door de [artikelen 586][ref1] en
      [587 van het Wetboek van Strafvordering][ref2] voorgeschreven wijze is aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel586
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel587
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '586'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '587'
  - number: '77.4'
    text: De termijn van het oproepen bedraagt ten minste drie vrije dagen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel77
  - number: '78.1'
    text: |-
      Indien een getuige of deskundige geen gehoor geeft aan de dagvaarding, maakt De Nederlandsche Bank N.V. daarvan
      proces-verbaal op. Zij kan een getuige of deskundige een tweede keer doen dagvaarden en daarbij een bevel tot
      medebrenging voegen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel78
  - number: '78.2'
    text: |-
      Tot het uitbrengen van een dagvaarding en tot de tenuitvoerlegging van een bevel tot medebrenging verleent het
      openbaar ministerie desgevorderd zijn tussenkomst.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel78
  - number: '79.1'
    text: |-
      De Nederlandsche Bank N.V. is bevoegd de getuige de eed af te nemen.
      [Artikel 177 van het Wetboek van Burgerlijke Rechtsvordering][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel177
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '177'
  - number: '79.2'
    text: De getuigen zijn verplicht getuigenis af te leggen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel79
  - number: '79.3'
    text: De deskundigen verrichten hun taak onpartijdig en naar beste weten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel79
  - number: '79.4'
    text: |-
      Personen die uit hoofde van ambt, beroep of wettelijk voorschrift verplicht zijn tot geheimhouding, kunnen hun
      medewerking weigeren, voor zover dit uit hun geheimhoudingsplicht voortvloeit.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel79
  - number: '79.5'
    text: |-
      Tot het afnemen van verhoren van getuigen en deskundigen houdt De Nederlandsche Bank N.V. zitting ter plaatse, door
      haar naar gelang van de omstandigheden te bepalen. Zij kan aan een of meer van de leden van haar bestuur opdragen
      een getuige of deskundige te gaan horen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel79
  - number: '80.1'
    text: |-
      Aan getuigen en deskundigen wordt op hun verlangen door de directie van De Nederlandsche Bank N.V. vergoeding
      toegekend overeenkomstig [artikel 8:36 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel8
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '8'
  - number: '80.2'
    text: |-
      De kosten van de verrichtingen van deurwaarders worden berekend op de voet van het tarief van gerechtskosten in
      strafzaken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel80
  - number: '81.1'
    text: |-
      In het kader van het toezicht op grond van deze wet kan De Nederlandsche Bank N.V. indien zij dat noodzakelijk acht
      in het belang van de deelnemers, de gewezen deelnemers, pensioengerechtigden, of andere belanghebbenden, aan een
      beroepspensioenfonds een aanwijzing geven onder mededeling van de termijn waarbinnen aan die aanwijzing moet worden
      voldaan.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel81
  - number: '81.2'
    text: |-
      Het in het eerste lid bedoelde beroepspensioenfonds volgt de aanwijzing binnen de door De Nederlandsche Bank N.V.
      gestelde termijn op.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel81
  - number: '82.1'
    text: |-
      Indien aan een aanwijzing als bedoeld in [artikel 81][ref1] binnen de in [dat artikel][ref2] gestelde termijn
      niet of onvoldoende gevolg is gegeven, kan De Nederlandsche Bank N.V. aan het beroepspensioenfonds aanzeggen
      dat het vanaf een bepaald tijdstip zijn bevoegdheden slechts mag uitoefenen na toestemming door een of meer door
      De Nederlandsche Bank N.V. aangewezen personen en met inachtneming van de aanwijzingen van deze personen. De
      aanzegging wordt terstond van kracht.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel81
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel81
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0018831
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '7'
      - id: ref2
        bwb_id: BWBR0018831
        artikel: '81'
        hoofdstuk: '6'
        paragraaf: '7'
  - number: '82.2'
    text: |-
      Indien naar het oordeel van De Nederlandsche Bank N.V. onverwijld ingrijpen noodzakelijk is, kan zij zonder
      voorafgaande aanwijzing onmiddellijk uitvoering geven aan het eerste lid, nadat zij het beroepspensioenfonds in de
      gelegenheid heeft gesteld zijn mening over de onmiddellijke uitvoering te geven.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
  - number: '82.3'
    text: |-
      Het beroepspensioenfonds verleent de door De Nederlandsche Bank N.V. aangewezen personen alle medewerking.
      De Nederlandsche Bank N.V. kan het bestuur van het beroepspensioenfonds toestaan bepaalde handelingen zonder
      machtiging te verrichten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
  - number: '82.4'
    text: |-
      De door De Nederlandsche Bank N.V. aangewezen personen oefenen hun bevoegdheden uit gedurende ten hoogste
      twee jaren na de bekendmaking van de aanzegging, bedoeld in het eerste lid, behoudens de bevoegdheid van De
      Nederlandsche Bank N.V. om deze termijn te verlengen telkens voor ten hoogste een jaar. Een zodanige verlenging
      maakt De Nederlandsche Bank N.V. aan het beroepspensioenfonds bekend. De verlenging wordt terstond van kracht.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
  - number: '82.5'
    text: De Nederlandsche Bank N.V. kan te allen tijde de door haar aangewezen personen door anderen vervangen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
  - number: '82.6'
    text: |-
      Voor schade ten gevolge van handelingen, die zijn verricht in strijd met een aanzegging als bedoeld in het
      eerste lid, zijn degenen die deze handelingen als orgaan van het beroepspensioenfonds verrichten, persoonlijk
      aansprakelijk tegenover het beroepspensioenfonds. Het beroepspensioenfonds kan de ongeldigheid van deze handelingen
      inroepen, indien de wederpartij wist dat de vereiste toestemming ontbrak of daarvan niet onkundig kon zijn.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
  - number: '82.7'
    text: |-
      De Nederlandsche Bank N.V. trekt in elk geval de maatregel, bedoeld in het eerste lid, in zodra zij van oordeel is,
      dat deze maatregel niet langer noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
  - number: '82.8'
    text: |-
      De Nederlandsche Bank N.V. kan aan een op grond van het eerste lid aangewezen persoon een bezoldiging toekennen ten
      laste van het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel82
  - number: '83.1'
    text: |-
      Op verzoek van De Nederlandsche Bank N.V. kan de ondernemingskamer van het gerechtshof te Amsterdam over een
      beroepspensioenfonds een bewindvoerder aanstellen, indien:
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: 83.1.a
    text: |-
      het beheer van een beroepspensioenfonds blijk geeft van een zodanig wanbeleid dat de belangen van de deelnemers en
      andere gerechtigden een onmiddellijke voorziening vereisen;
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: 83.1.b
    text: het bestuur van het beroepspensioenfonds is komen te ontbreken.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: '83.2'
    text: De Nederlandsche Bank N.V. dient haar verzoekschrift tot aanstelling van een bewindvoerder in tweevoud in.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: '83.3'
    text: De griffier doet een exemplaar van het verzoekschrift onverwijld aan het beroepspensioenfonds toekomen.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: '83.4'
    text: |-
      Indien de ondernemingskamer het verzoek toewijst, bepaalt zij de duur waarvoor de bewindvoerder is aangesteld. Zij
      kan deze duur op verzoek van De Nederlandsche Bank N.V. of van de bewindvoerder verlengen dan wel verkorten.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: '83.5'
    text: De ondernemingskamer kan de bewindvoerder een bezoldiging toekennen ten laste van het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: '83.6'
    text: De bewindvoerder treedt in de plaats van het bestuur van het beroepspensioenfonds.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: '83.7'
    text: |-
      De voorlopige tenuitvoerlegging van de beschikking tot aanstelling van een bewindvoerder kan worden bevolen, indien
      het verzoek daartoe is gedaan op de grond, genoemd in het eerste lid, onderdeel a.
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel83
  - number: '84.1'
    text: |-
      De Nederlandsche Bank N.V. kan desgevraagd in bijzondere gevallen van het bepaalde bij of
      krachtens de [artikelen 29, eerste en tweede lid][ref1], [30][ref2], [31][ref3], [33][ref4],
      [42, eerste lid, onderdeel f][ref5], [43, onderdeel d][ref6], [53, eerste lid][ref7] en
      [63, eerste tot en met derde lid][ref8] ontheffing verlenen, indien zij van oordeel is, dat de belangen van de
      personen die betrokken zijn bij een beroepspensioenregeling voldoende gewaarborgd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel30
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel31
      [ref4]: https://wetten.overheid.nl/BWBR0018831#Artikel33
      [ref5]: https://wetten.overheid.nl/BWBR0018831#Artikel42
      [ref6]: https://wetten.overheid.nl/BWBR0018831#Artikel43
      [ref7]: https://wetten.overheid.nl/BWBR0018831#Artikel53
      [ref8]: https://wetten.overheid.nl/BWBR0018831#Artikel63
    url: https://wetten.overheid.nl/BWBR0018831/2006-12-20#Artikel84
