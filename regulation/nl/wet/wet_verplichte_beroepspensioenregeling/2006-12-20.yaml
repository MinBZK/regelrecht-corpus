  - number: '116.22'
    text: |-
      Ten behoeve van een beroepspensioenregeling die voor de inwerkingtreding van [artikel 3][ref1] is verplichtgesteld
      of ten aanzien waarvan voor de inwerkingtreding van [dat artikel][ref2] een aanvraag tot verplichtstelling
      is gedaan wordt binnen een jaar na de inwerkingtreding van [dat artikel][ref3] een beroepspensioenvereniging
      opgericht.


      [ref1]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0018831#Artikel3
      [ref3]: https://wetten.overheid.nl/BWBR0018831#Artikel3
