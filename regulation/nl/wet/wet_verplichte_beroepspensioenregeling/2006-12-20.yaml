      [dat artikel][ref2] is verplichtgesteld of ten aanzien waarvan voor de inwerkingtreding van [dat artikel][ref3] een
      aanvraag tot verplichtstelling is gedaan, eerst van toepassing met ingang van het tweede jaar na het tijdstip van
      inwerkingtreding van [dat artikel][ref4].


