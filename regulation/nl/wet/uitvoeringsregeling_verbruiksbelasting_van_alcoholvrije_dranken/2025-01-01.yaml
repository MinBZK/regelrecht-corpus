    text: |-
      1 Een verzoek om teruggaaf van belasting als bedoeld in
      [artikel 33, eerste lid, onderdelen a en b, van de wet][ref1], voor alcoholvrije dranken, die zijn verloren
      gegaan of onder ambtelijk toezicht zijn vernietigd, wordt ingediend uiterlijk drie maanden na afloop van het
      kalenderkwartaal waarin de alcoholvrije dranken zijn verloren gegaan of onder ambtelijk toezicht zijn vernietigd.

      2 In de administratie van degene die verzoekt om teruggaaf van belasting zijn de volgende gegevens opgenomen:

      a. de soort en de hoeveelheid van de goederen of de andere voor de vaststelling van het bedrag van de teruggaaf van
      belang zijnde gegevens;

      b. het tijdstip, de plaats en de oorzaak van het verloren gaan, dan wel de vermelding van de ambtelijke verklaring
      van de vernietiging;

      c. wanneer mededeling is gedaan van het verloren gaan; en

      d. de soort en de hoeveelheid van de restanten van verloren gegane goederen en andere van belang zijnde gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel33
