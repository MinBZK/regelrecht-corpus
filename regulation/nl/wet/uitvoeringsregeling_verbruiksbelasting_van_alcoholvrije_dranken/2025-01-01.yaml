  - number: '13'
    text: |-
      1 Een vergunninghouder van een inrichting die tevens vergunninghouder is van één of meer andere inrichtingen kan op
      verzoek één aangifte voor die plaatsen tezamen doen, indien:

      a. de administratie van de desbetreffende inrichtingen op één centrale plaats wordt gevoerd;

      b. de centrale administratie en de administratieve organisatie van de desbetreffende inrichtingen zodanig is dat
      het toezicht op de heffing is gewaarborgd en uit de administratie op duidelijke wijze blijkt op welke inrichtingen
      de onderscheiden posten van die aangifte betrekking hebben.

      2 Het verzoek wordt ingediend bij de inspecteur onder wie de plaats ressorteert waar de centrale administratie
      wordt gevoerd. Een afschrift van het verzoek wordt gezonden naar de inspecteurs die de vergunningen voor de
      desbetreffende inrichtingen hebben verleend.

      3 De toestemming voor toepassing van het eerste lid wordt opgenomen in de vergunningen voor de desbetreffende
      inrichtingen. Daarbij kunnen aanvullende voorwaarden worden opgenomen omtrent het doen van de verzamelaangifte en
      de wijze waarop de administratie en de administratieve organisatie van de desbetreffende inrichtingen moeten zijn
      ingericht.

      4 Op de toestemming zijn de [artikelen 45 tot en met 50 van de Wet op de accijns][ref1] van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005251#Artikel45
    url: https://wetten.overheid.nl/BWBR0005812/2025-01-01#Artikel13
    references:
