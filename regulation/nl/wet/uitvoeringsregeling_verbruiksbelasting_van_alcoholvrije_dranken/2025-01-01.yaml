  - number: '43'
    text: |-
      1 De vergunninghouder van een inrichting doet van het verloren gaan van alcoholvrije dranken in zijn inrichting
      ten gevolge van ongeval of overmacht onverwijld mededeling aan de inspecteur onder opgaaf van het tijdstip en de
      oorzaak van het verloren gaan.

      2 Het eerste lid is van overeenkomstige toepassing op het verloren gaan van alcoholvrije dranken ten gevolge van
      ongeval of overmacht tijdens het overbrengen van goederen waarvoor de belasting nog niet is geheven.

      3 Van een voorgenomen vernietiging van in een inrichting voorhanden zijnde alcoholvrije dranken die onbruikbaar
      of onverkoopbaar zijn geworden, wordt uiterlijk twee werkdagen voor de voorgenomen vernietiging door de
      vergunninghouder van de inrichting mededeling gedaan aan de inspecteur, onder vermelding van het tijdstip waarop de
      vernietiging zal plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0005812/2025-01-01#Artikel43
