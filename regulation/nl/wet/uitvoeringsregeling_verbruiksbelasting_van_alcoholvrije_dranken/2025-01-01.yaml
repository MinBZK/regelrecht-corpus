      1 Deze regeling treedt in werking op het tijdstip waarop de
      [Wet op de verbruiksbelastingen van alcoholvrije dranken en van enkele andere produkten][ref1] in werking treedt.

      2 Deze regeling kan worden aangehaald als Uitvoeringsregeling verbruiksbelasting van alcoholvrije dranken.


