  - number: '2'
    text: |-
      Deze regeling verstaat onder:

      a. *wet:* [Wet op de verbruiksbelasting van alcoholvrije dranken][ref1];

      b. *besluit:* [Uitvoeringsbesluit verbruiksbelasting van alcoholvrije dranken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005802
      [ref2]: https://wetten.overheid.nl/BWBR0005804
    url: https://wetten.overheid.nl/BWBR0005812/2025-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0005802
      - id: ref2
        bwb_id: BWBR0005804
  - number: '3'
    text: |-
      1 Als vervoersopdracht als bedoeld in [artikel 2][ref1] van het besluit dienen te worden gebruikt:

      a. een kopie van de verkoopfactuur van de desbetreffende alcoholvrije dranken; of

      b. een door de vergunninghouder van de inrichting opgemaakt vervoersbescheid.

      2 Als vervoersopdracht als bedoeld in [artikel 8][ref2] van het besluit dienen te worden gebruikt:

      a. een kopie van de aankoopfactuur van de desbetreffende alcoholvrije dranken;

      b. een exemplaar van de op grond van de wettelijke bepalingen, bedoeld in
      [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref3], gedane aangifte voor het vrije verkeer; of

      c. een exemplaar van de aangifte waarmee de desbetreffende alcoholvrije dranken op grond van de wettelijke
      bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref4], binnen Nederland
      worden gebracht.

      3 Op de als vervoersopdracht gebruikte bescheiden moet worden vermeld: vervoersopdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005804#Artikel8
      [ref3]: https://wetten.overheid.nl/BWBR0023746#Artikel11
      [ref4]: https://wetten.overheid.nl/BWBR0023746#Artikel11
