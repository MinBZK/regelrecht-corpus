    text: |-
      Een op grond van [artikel 36 van de wet][ref1] gevorderd monster wordt:

      a. genomen onder toezicht van de inspecteur of een door hem aangewezen ambtenaar;

      b. zodanig verpakt, dat de identiteit van het monster is gewaarborgd; en

      c. onderzocht in of in opdracht van het Laboratorium van de Belastingdienst met gebruikmaking van internationaal
      erkende onderzoeksmethoden.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel36
