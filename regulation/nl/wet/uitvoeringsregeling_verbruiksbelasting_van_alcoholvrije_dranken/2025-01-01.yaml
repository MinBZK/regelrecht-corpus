      1 Vrijstelling van belasting ter zake van de uitslag van alcoholvrije dranken uit een inrichting wordt verleend
      in gevallen waarin bij invoer deze goederen met toepassing van de [artikelen 7:8][ref1], [7:9][ref2] of
      [7:11 van de Algemene douaneregeling][ref3] met vrijstelling van rechten bij invoer zouden kunnen worden betrokken.

      2 Vóór de uitslag dient een vergunning van de inspecteur te zijn verkregen. De vergunninghouder van de inrichting
      dient daartoe een verzoek in bij de inspecteur.

      3 De inspecteur beslist op het verzoek bij voor bezwaar vatbare beschikking


