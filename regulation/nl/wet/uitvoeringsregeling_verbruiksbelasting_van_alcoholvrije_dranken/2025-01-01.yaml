  - number: '4'
    text: |-
      Als een bescheid als bedoeld in [artikel 5 van het besluit][ref1] kan worden gebruikt:

      a. een factuur; of

      b. een vervoersbescheid.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel5
