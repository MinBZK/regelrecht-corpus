  - number: '11'
    text: |-
      1 Indien de inspecteur op grond van [artikel 12 van het besluit][ref1] voorwaarden stelt voor een vergunning
      voor een inrichting waar alcoholvrije dranken worden vervaardigd, kan daarbij worden bepaald dat ter zake van de
      vervaardiging werkaangiften moeten worden gedaan.

      2 De werkaangiften dienen ten minste twee werkdagen voor de aanvang van de vervaardiging te worden ingediend bij
      de inspecteur.

      3 In de werkaangifte dienen te worden vermeld:

      a. de voorgenomen te vervaardigen hoeveelheden; en

      b. de tijdstippen waarop de vervaardiging aanvangt en wordt beëindigd.

      4 De werkaangifte kan per werkweek geschieden.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel12
    url: https://wetten.overheid.nl/BWBR0005812/2025-01-01#Artikel11
    references:
