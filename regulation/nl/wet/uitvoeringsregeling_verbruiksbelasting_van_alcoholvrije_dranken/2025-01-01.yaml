  - number: '15'
    text: |-
      1 In het verzoek om een vergunning als bedoeld in het in [artikel 29, derde lid, van de wet][ref1] van
      overeenkomstige toepassing verklaarde [artikel 65, vierde lid, van de Wet op de accijns][ref2], dienen te worden
      vermeld:

      a. de persoon op wiens naam de vergunning dient te worden gesteld;

      b. de hoeveelheid alcoholvrije dranken, onderscheiden naar soort, die naar verwachting per jaar zal worden
      betrokken;

      c. de locatie en de inrichting van het bedrijf;

      d. de hoeveelheid alcoholvrije dranken, onderscheiden naar soort, die naar verwachting per jaar met vrijstelling
      wordt vervaardigd of verbruikt;

      e. de administratie en de administratieve organisatie met betrekking tot het bedrijf waarvoor de vergunning wordt
      gevraagd.

      2 Met betrekking tot het verlenen, het aanpassen en het intrekken van de vergunning zijn de
      [artikelen 45 tot en met 50 van de Wet op de accijns][ref3] van overeenkomstige toepassing.


