  - number: '20'
    text: |-
      1 Een verzoek om teruggaaf van belasting als bedoeld in [artikel 32 van de wet][ref1] wordt ingediend uiterlijk
      drie maanden na afloop van het kalenderkwartaal waarin:

      a. de alcoholvrije dranken zijn gebruikt overeenkomstig een bestemming als bedoeld in
      [artikel 29, eerste lid, van de wet][ref2]; of

      b. de alcoholvrije dranken een bestemming als bedoeld in [artikel 30 van de wet][ref3] hebben gevolgd.

      2 De verklaring, bedoeld in [artikel 19 van het besluit][ref4], bevat in het geval van levering aan een schip de
      volgende gegevens:

      a. een uniek identificeerbaar nummer;

      b. de naam en het adres van degene die de goederen levert;

      c. de naam en het adres van de eigenaar of exploitant van het schip;

      d. de naam van het schip en het registratienummer;

      e. de plaats van levering;

      f. het reisdoel van het schip;

      g. de soort en de hoeveelheid van de goederen die zijn geleverd;

      h. de datum van levering;

      i. de naam en handtekening van de eigenaar of exploitant van het schip of zijn vertegenwoordiger aan boord van
      het schip;

      j. in geval van levering uit een schip, de naam en het registratienummer van het schip van waaruit is geleverd.

      3 De verklaring, bedoeld in [artikel 19 van het besluit][ref5], bevat in het geval van levering aan een
      luchtvaartuig de volgende gegevens:

      a. een uniek identificeerbaar nummer;

      b. de naam en het adres van degene die de alcoholvrije dranken levert;

      c. de naam en het adres van de eigenaar of exploitant van het luchtvaartuig;

      d. het registratienummer van het luchtvaartuig waarvoor de goederen zijn bestemd;

      e. het vertrek- en eindpunt van de vlucht;

      f. de plaats van levering;

      g. de soort en de hoeveelheid van de goederen die zijn geleverd;

      h. de datum van levering;

      i. de naam en handtekening van de eigenaar of exploitant van het luchtvaartuig of zijn vertegenwoordiger aan boord
      van het luchtvaartuig.

      4 De verklaring, bedoeld in het tweede en derde lid, wordt in het Nederlands of in het Engels opgesteld.


