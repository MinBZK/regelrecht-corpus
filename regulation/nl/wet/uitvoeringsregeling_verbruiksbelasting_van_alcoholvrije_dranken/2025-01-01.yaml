  - number: '5'
    text: |-
      [Artikel 4, derde lid, van de wet][ref1] vindt uitsluitend toepassing indien de hoeveelheid, bedoeld in
      [artikel 6 van het besluit][ref2], niet meer bedraagt dan 25 liter.


