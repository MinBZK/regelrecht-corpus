  - number: '8'
    text: |-
      Indien alcoholvrije dranken zijn verpakt in kleinhandelsverpakking, wordt het volume in aanmerking genomen
      dat op de verpakking is vermeld, mits de wijze waarop dat is vastgesteld en de aanduiding ervan voldoen aan de
      voorschriften gesteld bij het [Warenwetbesluit hoeveelheden voorverpakkingen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0035560
    url: https://wetten.overheid.nl/BWBR0005812/2025-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0035560
  - number: '9'
    text: |-
      1 Een plaats waar geen alcoholvrije dranken worden vervaardigd, kan uitsluitend als inrichting voor de opslag van
      alcoholvrije dranken in aanmerking komen, indien de hoeveelheid die aldaar gemiddeld over een jaar voorhanden is,
      meer bedraagt dan 50 000 liter.

      2 In afwijking van het eerste lid kan de inspecteur onder door hem te stellen voorwaarden een vergunning voor een
      inrichting verlenen als de gemiddeld over een jaar voorhanden zijnde voorraad gelijk is aan of lager is dan 50 000
      liter, indien en voor zover de alcoholvrije dranken vanuit die inrichting in belangrijke mate worden overgebracht
      naar een ondernemer of een publiekrechtelijk lichaam, anders dan als ondernemer, in een andere lidstaat of naar een
      derde land.
    url: https://wetten.overheid.nl/BWBR0005812/2025-01-01#Artikel9
  - number: '10'
    text: |-
      1 In afwijking van het in [artikel 14, tweede lid, van de wet][ref1] van overeenkomstige toepassing verklaarde
      [artikel 40, tweede lid, van de Wet op de accijns][ref2] kunnen als inrichting in aanmerking komen:

      a. plaatsen van waaruit alcoholvrije dranken worden geleverd met vrijstelling van belasting als bedoeld in
      [artikel 19][ref3];

      b. plaatsen van waaruit, onder door de inspecteur te stellen voorwaarden, alcoholvrije dranken worden afgeleverd
      aan verbruikers;

      c. plaatsen waarvoor een vergunning als bedoeld in [artikel 15a, tweede lid, van de wet][ref4] is verleend;

      d. plaatsen van waaruit door buitenlandse NAVO-strijdkrachten als bedoeld in het in [artikel 31 van de wet][ref5]
      van overeenkomstige toepassing verklaarde [artikel 69 van de Wet op de accijns][ref6] alcoholvrije dranken
      rechtstreeks worden geleverd aan personeel van die strijdkrachten of hun gezinsleden.

      2 Voor de toepassing van dit artikel wordt verstaan onder:

      a. *NAVO-statusverdrag:* het op 19 juni 1951 te Londen tot stand gekomen Verdrag tussen de Staten die partij zijn
      bij het Noord-Atlantisch Verdrag, nopens de rechtspositie van hun krijgsmachten (Trb. 1951, 114);

      b. *Hoofdkwartierenprotocol:* het op 28 augustus 1952 te Parijs tot stand gekomen Protocol bij het op 19 juni
      1951 te Londen gesloten Verdrag tussen de Staten die partij zijn bij het Noord-Atlantische Verdrag – nopens
      de rechtspositie van hun krijgsmachten – nopens de rechtspositie van internationale militaire hoofdkwartieren,
      ingesteld uit hoofde van het Noord-Atlantisch Verdrag (Trb. 1953, 11);

      c. *gezinslid:*

      1°. een inwonende persoon als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag
      of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol;

      2°. een niet-inwonend kind als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-Statusverdrag
      of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol dat afhankelijk
      is van een lid van een krijgsmacht of civiele dienst voor zijn onderhoud, voor zover dat kind zich op Nederlands
      grondgebied bevindt;

      3°. een niet-inwonende partner als bedoeld in artikel I, eerste lid, aanhef en onderdeel c, van het NAVO-
      Statusverdrag of als bedoeld in artikel 3, eerste lid, aanhef en onderdeel c, van het Hoofdkwartierenprotocol, voor
      zover die partner zich op Nederlands grondgebied bevindt;

      4°. een persoon voor wie een NAVO-strijdkracht (Delegatieleider) verklaart dat deze de status heeft van ‘afgeleide
      NAVO-statusgerechtigde ’of ‘afgeleide Paris Protocol-gerechtigde’;

      5°. een partner als bedoeld in [artikel 5a van de Algemene wet inzake rijksbelastingen][ref7].


