        artikel: '45'
  - number: '14'
    text: |-
      1 Voor de belasting die de vergunninghouder van een inrichting verschuldigd is of kan worden, stelt hij zekerheid.
      De zekerheid wordt bepaald op basis van het belastingbelang.

      2 Het belastingbelang is de som van het bedrag dat wordt vertegenwoordigd door de hoeveelheid alcoholvrije dranken
      die:

        - gemiddeld in de inrichting voorhanden is;
        - gemiddeld in een aangiftetijdvak wordt uitgeslagen;
        - gemiddeld in een aangiftetijdvak met een vervoersopdracht of een ander daartoe aangewezen bescheid wordt
      overgebracht naar een andere inrichting, een ondernemer dan wel een publiekrechtelijk lichaam, anders dan als
      ondernemer, in een andere lidstaat of een derde land;
        - gemiddeld in een aangiftetijdvak met toepassing van [artikel 2, zesde lid, van het besluit][ref1] wordt
      overgebracht naar een andere inrichting;
        - gemiddeld in een aangiftetijdvak met een vervoersopdracht vanuit een derde land, vanuit een plaats voor
      tijdelijke opslag of na beëindiging van een EU-douaneregeling wordt overgebracht naar de inrichting.

      3 Indien op grond van [artikel 13][ref2] toestemming is verleend voor het doen van één aangifte voor twee of meer
      inrichtingen worden de afzonderlijke zekerheidstellingen voor de desbetreffende inrichtingen vervangen door één
      zekerheid die voor die inrichtingen tezamen van toepassing is. Het hierbij in acht te nemen belastingbelang wordt
      gevormd door het totale belastingbelang dat op basis van het tweede lid voor de desbetreffende inrichtingen is
      vastgesteld.

      4 De zekerheid bedraagt ten minste 5 percent en ten hoogste 100 percent van het belastingbelang met een maximum van
      € 2.250.000.

      5 Geen zekerheidstelling is vereist wanneer een overheidslichaam de belasting verschuldigd is of kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0005804#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005812#Artikel13
