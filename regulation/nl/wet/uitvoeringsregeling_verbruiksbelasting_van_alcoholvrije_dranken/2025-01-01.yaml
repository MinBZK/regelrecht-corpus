  - number: '18'
    text: |-
      1 Degene die in het bezit is van een vergunning als bedoeld in [artikel 17, eerste lid, van het besluit][ref1],
      dient in zijn administratie met betrekking tot de alcoholvrije dranken die worden gebruikt voor onderzoek,
      kwaliteitscontroles of smaaktesten buiten de inrichting op overzichtelijke wijze bij te houden:

      a. de soort en de hoeveelheid van de goederen;

      b. het tijdstip van de overbrenging van de goederen;

      c. het tijdstip van de overbrenging van de na afloop van het onderzoek, de controle of de smaaktest resterende
      goederen alsmede de plaats waar de goederen naar worden overgebracht. In de administratie worden ingeval van
      overbrenging naar een andere inrichting dan die van de in de aanhef bedoelde vergunninghouder de naam, het adres en
      het vergunningnummer van de vergunninghouder van die andere inrichting vermeld.

      2 Bij de in het eerste lid bedoelde administratie bewaart degene die de alcoholvrije dranken met vrijstelling
      uitslaat dan wel invoert:

      a. een afschrift van het ingevolge [artikel 17, tweede lid, van het besluit][ref2] gedane verzoek en van de daarbij
      overgelegde schriftelijke opdracht voor de onderzoeken, controles of smaaktesten;

      b. ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende alcoholvrije dranken worden
      overgebracht naar een derde land: elektronische of geprinte exemplaren van het uitvoergeleidedocument of de
      aangifte ten uitvoer alsmede van de bevestiging van uitgang, welke documenten zijn vereist op grond van de
      wettelijke bepalingen, bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref3];

      c. ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende alcoholvrije dranken worden
      overgebracht naar een andere lidstaat: een afschrift van het bescheid als bedoeld in [artikel 4][ref4].

      d. ingeval de na afloop van het onderzoek, de controle of de smaaktest resterende alcoholvrije dranken worden
      vernietigd onder ambtelijk toezicht een afschrift van de ter zake opgemaakte ambtelijke verklaring.

      3 Degene die de alcoholvrije dranken met vrijstelling invoert bewaart bij de in het eerste lid bedoelde
      administratie tevens een afschrift van de voor de desbetreffende goederen ingevolge de wettelijke bepalingen,
      bedoeld in [artikel 1:1, eerste en tweede lid, van de Algemene douanewet][ref5], gedane aangifte voor het vrije
      verkeer.


