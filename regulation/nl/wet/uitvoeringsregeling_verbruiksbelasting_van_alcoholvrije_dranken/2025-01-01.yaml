        bwb_id: BWBR0005804
        artikel: '12'
  - number: '12'
    text: |-
      1 In een verzoek om een vergunning voor een inrichting dienen met betrekking tot hetgeen in
      het in [artikel 15, tweede lid, van de wet][ref1] van overeenkomstige toepassing verklaarde
      [artikel 42, eerste en tweede lid, van de Wet op de accijns][ref2], is bepaald, in elk geval te worden vermeld:

      a. een omschrijving van de aard van het bedrijf waaruit onder meer moet blijken of de vergunning mede wordt
      gevraagd voor de vervaardiging van alcoholvrije dranken of uitsluitend voor het voorhanden hebben van alcoholvrije
      dranken;

      b. het adres en de kadastrale aanduiding van de plaats waar de inrichting wordt gevestigd; en

      c. een omschrijving van de administratie en de administratieve organisatie, alsmede het adres waar de administratie
      wordt gehouden.

      2 Indien toepassing van [artikel 2, zesde lid, van het besluit][ref3] wordt gewenst, wordt dit in het verzoek,
      bedoeld in het eerste lid, opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0005802#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0005251#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0005804#Artikel2
