  - number: '5'
    text: |-
      1 Indien de wijziging tot stand is gebracht en in werking is getreden zonder toepassing van
      [artikel 4, eerste lid][ref1], zendt de vennootschap of een dergenen die krachtens [artikel 1][ref2] tot wijziging
      bevoegd zijn, dan wel een daartoe in de akte, bedoeld in [artikel 2][ref3], aangewezen persoon, een verzoek
      om bekrachtiging van de wijziging tot Onze Minister van Justitie van het deel van het Koninkrijk, waarheen
      de plaats van vestiging der vennootschap is overgebracht. Het verzoekschrift moet binnen vier weken na de
      inwerkingtreding der wijziging worden ingediend bij een Onzer Ministers van Justitie of bij een Onzer diplomatieke
      vertegenwoordigingen in het buitenland. Bij het verzoek worden de in [artikel 4, derde lid, onder ][ref4], bedoelde
      stukken overgelegd.

      2 De wijziging verliest van rechtswege haar kracht met ingang van het tijdstip, waarop de bekrachtiging wordt
      geweigerd, dan wel het voorschrift van het eerste lid niet is in acht genomen. Wordt de bekrachtiging van een
      gedeelte der wijziging geweigerd, dan verliest deze alleen voor dit gedeelte haar kracht.

      3 Indien de bekrachtiging van de wijziging in haar geheel wordt geweigerd, eindigt de bevoegdheid der bestuurders,
      die overeenkomstig [artikel 1, achtste lid][ref5], zijn benoemd, met ingang van het tijdstip, waarop de weigering
      van de bekrachtiging is bekendgemaakt.


