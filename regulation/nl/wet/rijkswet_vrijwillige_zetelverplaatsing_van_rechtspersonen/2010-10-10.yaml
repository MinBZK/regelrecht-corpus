  - number: '13'
    text: |-
      1 Elke wijziging van de akte van oprichting, als in [artikel 12][ref1] bedoeld, behoeft de toestemming of de
      bekrachtiging van Onze Minister van Justitie van het betrokken deel van het Koninkrijk.

      2 Ten aanzien van de toestemming is [artikel 4, eerste en derde lid][ref2], van overeenkomstige toepassing, met
      dien verstande dat de in [artikel 4, derde lid][ref3], bedoelde stukken worden gezonden aan Onze Minister die de
      toestemming heeft verleend.

      3 Ten aanzien van de bekrachtiging is [artikel 5][ref4] van toepassing, met dien verstande dat het verzoek om
      bekrachtiging wordt gericht tot Onze Minister van Justitie van het deel van het Koninkrijk, waar de vennootschap
      gevestigd is.

      4 De [artikelen 6, eerste en tweede lid][ref5], en [7][ref6] zijn van toepassing, met dien verstande dat de
      intrekking der toestemming of bekrachtiging geschiedt door Onze in het vorige lid genoemde Minister van Justitie
      met Onze machtiging.

      5 [Artikel 8][ref7] is van overeenkomstige toepassing.


