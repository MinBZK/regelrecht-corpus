        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0002561
        artikel: '17'
        afdeling: '6'
  - number: '29'
    text: |-
      1 Besluiten en beslissingen, strekkende tot het overbrengen van de plaats van vestiging en tot het aanbrengen
      van andere veranderingen in de akte van oprichting, statuten of reglementen, als bedoeld in de wet van 26 april
      1940 (*Stb.* 200), waarop bij de inwerkingtreding van deze rijkswet nog niet de goedkeuring of bekrachtiging is
      verkregen, worden aangemerkt als te zijn genomen met het oog op het in deze rijkswet bepaalde en behouden hun
      kracht zolang zij niet zijn ingetrokken door een orgaan dat krachtens deze rijkswet tot het nemen van zodanige
      besluiten of beslissingen bevoegd is.

      2 Wijzigingen of ontwerp-wijzigingen van de akte van oprichting en andere handelingen, goedgekeurd of bekrachtigd
      op grond van de wet van 26 april 1940 (*Stb.* 200), verliezen haar effect niet door de intrekking van die wet, ook
      niet indien op het tijdstip van intrekking een aan die wijzigingen of handelingen verbonden voorwaarde of termijn
      nog niet was vervuld onderscheidenlijk verstreken.

      3 Met betrekking tot de rechtsgevolgen van de in het vorige lid bedoelde wijzigingen en handelingen, alsmede
      de verplichtingen die op de rechtspersoon of haar organen rusten, geldt deze rijkswet met ingang van haar
      inwerkingtreding.

      4 Voor de toepassing van de Rijkswet vrijwillige zetelverplaatsing van rechtspersonen en de daarop rustende
      bepalingen worden naamloze en besloten vennootschappen die bij de inwerkingtreding van de Rijkswet aanpassing
      rijkswetten aan de oprichting van de nieuwe landen de staat hebben van een vennootschap opgericht naar Nederlands-
      Antilliaans recht beschouwd als vennootschap in de zin van de algemene bepaling, eerste lid, naar gelang hun plaats
      van vestiging.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel29
  - number: '30'
    text: 'Deze rijkswet kan worden aangehaald onder de titel: Rijkswet vrijwillige zetelverplaatsing van rechtspersonen.'
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel30
  - number: '31'
    text: |-
      1 Deze rijkswet is verbindend voor het gehele Koninkrijk.

      2 Zij treedt in werking op een door Ons te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel31
