preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het, mede gelet op artikel 38, vierde lid, van het Statuut voor het
    Koninkrijk, wenselijk is de in de wet van 26 april 1940 (Stb. 200) vervatte regelen in zake zetelverplaatsing van
    rechtspersonen te vervangen door een herziene regeling bij rijkswet;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Door desbetreffende wijziging van de akte van oprichting kan de plaats van vestiging van een in Nederland, Aruba,
      Curaçao of Sint Maarten gevestigde vennootschap worden overgebracht naar een ander deel van het Koninkrijk der
      Nederlanden.

      2 Bevoegd tot deze wijziging van de akte van oprichting zijn het bestuur der vennootschap en de algemene
      vergadering van aandeelhouders.

      3 Eveneens zijn tot deze wijziging bevoegd een of meer hiertoe door het bestuur of de algemene vergadering bij
      notariële akte in de Nederlandse taal aangewezen personen. Het bestuur, onderscheidenlijk de algemene vergadering,
      kan de aanwijzing te allen tijde bij notariële akte in de Nederlandse taal intrekken.

      4 Het bestuur en de algemene vergadering kunnen tot een wijziging, aanwijzing of intrekking, als bedoeld in het
      tweede en derde lid, slechts overgaan met inachtneming van de bepalingen der wet en der akte van oprichting,
      geldende voor de totstandkoming van bestuursbesluiten, onderscheidenlijk van besluiten van de algemene vergadering
      tot wijziging van de akte van oprichting, met dien verstande dat het bestuur geen toestemming of medewerking
      van de algemene vergadering, van een ander orgaan der vennootschap of van derden behoeft. Indien ingevolge de
      bepalingen der wet en der akte van oprichting besluitvorming van aandeelhouders op andere wijze dan in een algemene
      vergadering van aandeelhouders kan geschieden, geldt daarbij een met inachtneming van die bepalingen tot stand
      gekomen besluit als een besluit van de algemene vergadering.

      5 De vennootschap kan van een aanwijzing als bedoeld in het derde lid, te allen tijde mededeling doen aan Onze
      Ministers van Justitie van de onderscheidene delen van het Koninkrijk of aan een of meer hunner, onder bijvoeging
      van een afschrift der aanwijzing. Van een intrekking der aanwijzing wordt op dezelfde wijze onverwijld mededeling
      gedaan aan Onze Ministers, tot wie de vorige mededeling was gericht. Onze voornoemde Ministers zenden onverwijld
      aan de vennootschap een ontvangstbevestiging van deze mededelingen.

      6 Een wijziging van de akte van oprichting, strekkende tot overbrenging van de plaats van vestiging naar een deel
      van het Koninkrijk, waar zich geen mededeling bevindt betreffende een niet ingetrokken aanwijzing, als bedoeld in
      het vorige lid, kan ook tot stand worden gebracht:

      a. door elke bestuurder van de vennootschap;

      b. door hen die volgens de akte van oprichting tot het beheer van de vennootschap bevoegd zijn in geval van
      ontstentenis of belet van de bestuurders.

      7 De wijziging, bedoeld in dit artikel, houdt tevens zodanige veranderingen in de akte van oprichting in, dat
      deze akte in overeenstemming wordt gebracht met het vennootschapsrecht van het deel van het Koninkrijk waarheen
      de plaats van vestiging van de naamloze vennootschap wordt overgebracht. De wijziging kan andere veranderingen
      inhouden.

      8 Bij de wijziging, bedoeld in dit artikel, kunnen een of meer personen tot bestuurder van de vennootschap worden
      benoemd. Voor zover bij hun benoeming niet anders is bepaald, wordt de vennootschap tegenover derden door ieder
      dezer bestuurders vertegenwoordigd.

      9 Bij een aanwijzing, als bedoeld in het derde lid, kunnen de bevoegdheden, omschreven in het zevende en achtste
      lid, voor de aangewezen personen worden uitgesloten of beperkt.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel1
  - number: '2'
    text: |-
      1 De wijziging en de benoemingen, bedoeld in [artikel 1][ref1], geschieden op straffe van nietigheid bij notariële
      akte. De akte wordt verleden in de Nederlandse taal.

      2 De wijziging treedt in werking met ingang van de dag, waarop de akte is verleden, tenzij daarvoor in de akte een
      later tijdstip is bepaald. Is de inwerkingtreding afhankelijk gesteld van de vervulling van een voorwaarde, dan
      geschiedt zij met ingang van de dag, waarop die voorwaarde is vervuld.

      3 De benoemingen treden gelijktijdig met de wijziging in werking.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel1
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel2
