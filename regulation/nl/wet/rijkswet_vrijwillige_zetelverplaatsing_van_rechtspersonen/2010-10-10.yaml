  - number: '12'
    text: |-
      1 Door desbetreffende wijziging van de akte van oprichting kan de plaats van vestiging van een vennootschap, welke
      gevestigd is in een der delen van het Koninkrijk, worden overgebracht naar een andere plaats in hetzelfde deel met
      overeenkomstige toepassing van het bepaalde in [artikel 1, tweede tot en met negende lid][ref1].

      2 De wijziging en de in [artikel 1, achtste lid][ref2], bedoelde benoemingen geschieden op straffe van nietigheid
      bij notariële akte. De akte wordt verleden in de Nederlandse taal.

      3 Ten aanzien van de inwerkingtreding is [artikel 2, tweede en derde lid][ref3], van overeenkomstige toepassing.


