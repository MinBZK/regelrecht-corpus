  - number: '15'
    text: |-
      1 De plaats van vestiging van een in enig deel van het Koninkrijk der Nederlanden gevestigde rechtspersoon die geen
      vennootschap in de zin van het eerste lid van de algemene bepaling is, kan worden overgebracht naar een ander deel
      van het Koninkrijk of naar een andere plaats in hetzelfde deel.

      2 Bevoegd tot deze beslissing is het bestuur van de rechtspersoon. [Artikel 1, vierde lid][ref1], is van
      overeenkomstige toepassing.

      3 Eveneens zijn tot deze beslissing bevoegd een of meer hiertoe door het bestuur van de rechtspersoon bij notariële
      akte in de Nederlandse taal aangewezen personen. Het bestuur van de rechtspersoon kan de aanwijzing te allen tijde
      intrekken.

      4 Het bestuur van de rechtspersoon kan van een aanwijzing als bedoeld in het vorige lid, te allen tijde mededeling
      doen aan Onze Ministers van Justitie van de onderscheidene delen van het Koninkrijk of aan een of meer hunner onder
      bijvoeging van een afschrift der aanwijzing. Van een intrekking der aanwijzing wordt op dezelfde wijze onverwijld
      mededeling gedaan aan Onze Ministers, tot wie de vorige mededeling was gericht. Onze voornoemde Ministers zenden
      onverwijld aan de rechtspersoon een ontvangstbevestiging van deze mededelingen.

      5 Een beslissing, strekkende tot overbrenging van de plaats van vestiging naar een deel van het Koninkrijk, waar
      zich geen mededeling bevindt betreffende een niet ingetrokken aanwijzing, als bedoeld in het vorige lid, kan ook
      tot stand worden gebracht:

      a. door elke bestuurder van de rechtspersoon;

      b. door hen die volgens de statuten en reglementen van de rechtspersoon tot haar beheer bevoegd zijn in geval van
      ontstentenis of belet van de bestuurders.

      6 De beslissing, bedoeld in dit artikel, kan tevens andere veranderingen in de statuten en reglementen van de
      rechtspersoon inhouden.

      7 Bij de beslissing, bedoeld in dit artikel, kunnen een of meer personen tot bestuurder van de rechtspersoon worden
      benoemd. Voor zover bij hun benoeming niet anders is bepaald, wordt de rechtspersoon tegenover derden door ieder
      dezer bestuurders vertegenwoordigd.

      8 Bij een aanwijzing, als bedoeld in het derde lid, kunnen de bevoegdheden, omschreven in het zesde en zevende lid,
      voor de aangewezen personen worden uitgesloten of beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel1
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel15
