  - number: '6'
    text: |-
      1 De toestemming of de bekrachtiging wordt slechts geweigerd, voor zover naar het oordeel van de autoriteit die
      bevoegd is haar te verlenen:

      a. niet aannemelijk is dat de wijziging van de akte van oprichting ten tijde van haar inwerkingtreding of
      bekrachtiging op grond van oorlog, onmiddellijk oorlogsgevaar, revolutie of daarmee vergelijkbare buitengewone
      omstandigheden in het belang der vennootschap zal worden of werd geboden; of

      b. de wijze waarop de wijziging van de akte van oprichting tot stand is gekomen, in strijd is met deze Rijkswet of
      met het recht van het deel van het Koninkrijk, waar de vennootschap gevestigd was; of

      c. de wijziging van de akte van oprichting in strijd is met deze Rijkswet of met het vennootschapsrecht van het
      deel van het Koninkrijk, waarheen de plaats van vestiging zal worden of is overgebracht.

      2 De geldigheid van wijzigingen waarin is toegestemd of bekrachtigde wijzigingen van de akte van oprichting kan
      niet worden betwist op grond dat de vereisten van het vorige lid niet in acht zouden zijn genomen.

      3 Indien toestemming of bekrachtiging geheel of gedeeltelijk is geweigerd, deelt Onze betrokken Minister van
      Justitie de weigering onverwijld mede aan Onzer Ministers van Justitie van de andere delen van het Koninkrijk. In
      een mededeling als bedoeld in de eerste volzin worden de redenen voor de weigering genoemd.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel6
  - number: '7'
    text: |-
      1 Onze Minister van Justitie van het deel van het Koninkrijk, waar de vennootschap - hetzij voor, hetzij na de
      inwerkingtreding der overplaatsing - gevestigd is, kan met Onze machtiging de toestemming of de bekrachtiging van
      de wijziging van de akte van oprichting geheel of gedeeltelijk intrekken, indien later blijkt van omstandigheden,
      welke de weigering van deze toestemming of bekrachtiging in zoverre gewettigd zouden hebben.

      2 De wijziging verliest van rechtswege haar kracht met ingang van het tijdstip, waarop de toestemming of
      bekrachtiging wordt ingetrokken. Wordt de toestemming of bekrachtiging van een gedeelte der wijziging ingetrokken,
      dan verliest deze alleen voor dit gedeelte haar kracht.

      3 Indien de toestemming of bekrachtiging van de wijziging in haar geheel wordt ingetrokken, eindigt de bevoegdheid
      der bestuurders, die overeenkomstig [artikel 1, achtste lid][ref1], zijn benoemd, met ingang van het tijdstip,
      waarop de intrekking van de toestemming of de bekrachtiging is bekendgemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel1
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel7
