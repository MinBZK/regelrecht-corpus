  - number: '3'
    text: |-
      1 Elke wijziging van de akte van oprichting van een vennootschap als in [artikel 1][ref1] bedoeld, behoeft de
      toestemming of de bekrachtiging van Onze Minister van Justitie in Nederland, respectievelijk Onze Minister van
      Justitie in Aruba, in Curaçao of in Sint Maarten.

      2 Ieder die op het ogenblik van het tot stand brengen van een wijziging van de akte van oprichting, als in
      [artikel 1][ref2] bedoeld, bevoegd was zulk een wijziging aan te brengen, is bevoegd de veranderingen aan te
      brengen welke nodig mochten blijken om de in het vorige lid bedoelde bekrachtiging te verkrijgen.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0002561#Artikel1
