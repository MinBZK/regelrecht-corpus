  - number: '4'
    text: |-
      1 De toestemming wordt uitsluitend op een ontwerp van de wijziging verleend, en wel door Onze Minister van Justitie
      van het deel van het Koninkrijk, waar de vennootschap gevestigd is.

      2 Onze Minister die de toestemming heeft verleend, zendt onverwijld een afschrift van de beschikking houdende
      toestemming en van het ontwerp waarvoor bij deze beschikking toestemming is verleend aan Onze Minister van Justitie
      van het deel van het Koninkrijk, waarheen de plaats van vestiging der vennootschap zal worden overgebracht. Onze
      laatstgenoemde Minister van Justitie zendt vervolgens onverwijld aan de vennootschap een verklaring waaruit blijkt
      dat, wanneer een wijziging van de akte van oprichting overeenkomstig het ontwerp waarvoor toestemming is verleend
      te eniger tijd in werking mocht treden, de vennootschap alsdan ingevolge deze rijkswet van rechtswege de staat zal
      bezitten van een rechtspersoon, opgericht volgens het recht van het deel van het Koninkrijk waarvan deze verklaring
      afkomstig is.

      3 Zo spoedig mogelijk na het verlijden van de in [artikel 2][ref1] bedoelde akte zendt de vennootschap dan wel
      degene of een dergenen, die de wijziging hebben verricht, aan beide in het vorige lid genoemde Ministers van
      Justitie:

      a. de tekst van de akte van oprichting, zoals deze vóór de wijziging luidde;

      b. een opgave van datum en nummer van de beschikking houdende toestemming;

      c. een authentiek afschrift van de in [artikel 2][ref2] bedoelde akte;

      d. indien de wijziging met toepassing van [artikel 1, derde lid][ref3], is verricht: een authentiek afschrift van
      de aldaar bedoelde akte.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002561#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0002561#Artikel1
