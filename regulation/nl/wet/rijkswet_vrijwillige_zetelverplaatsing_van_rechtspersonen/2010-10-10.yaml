  - number: '18'
    text: |-
      1 Van het tijdstip af, waarop de plaats van vestiging van een rechtspersoon overeenkomstig deze rijkswet naar een
      ander deel van het Koninkrijk is overgebracht of teruggebracht, bezit hij de staat van een volgens het recht van
      dat deel van het Koninkrijk opgerichte rechtspersoon en wordt hij door het aldaar geldende recht beheerst.

      2 De bevoegde organen van het deel van het Koninkrijk, waarheen overeenkomstig deze rijkswet de plaats van
      vestiging van een of meer rechtspersonen is overgebracht, kunnen echter met betrekking tot deze rechtspersonen
      afwijkende deviezenrechtelijke voorschriften treffen.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel18
  - number: '19'
    text: |-
      1 Heeft een rechtspersoon een recht of bevoegdheid verkregen, voor het behoud waarvan het gevestigd zijn in, of
      het opgericht zijn volgens het recht van een bepaald deel van het Koninkrijk een vereiste of voorwaarde is, dan
      wordt dit vereiste of deze voorwaarde voor vervuld gehouden, zolang de rechtspersoon ingevolge toepassing van deze
      rijkswet in een ander deel van het Koninkrijk gevestigd is.

      2 Heeft een rechtspersoon een recht of bevoegdheid verkregen, voor het behoud waarvan een vereiste of voorwaarde
      is, dat een of meer van zijn bestuurders, commissarissen of vertegenwoordigers ingezetene zijn van, dan wel
      woonachtig of geboren zijn in een bepaald deel van het Koninkrijk, dan wordt, zolang de rechtspersoon ingevolge
      toepassing van deze rijkswet in een ander deel van het Koninkrijk gevestigd is, dit vereiste of deze voorwaarde
      voor vervuld gehouden, indien even zovele van zijn bestuurders, commissarissen of vertegenwoordigers ingezetene
      zijn van, dan wel woonachtig of geboren zijn in enig deel van het Koninkrijk.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel19
  - number: '20'
    text: |-
      1 Zolang de verplaatsing van de zetel van een rechtspersoon overeenkomstig deze rijkswet nog niet in werking is
      getreden, kan zij, zelfs indien daarvoor reeds toestemming was verleend, worden ingetrokken door het bestuur van
      de rechtspersoon, door een daartoe door het bestuur bij notariële akte in de Nederlandse taal aangewezen persoon
      of door degene die de verplaatsing van de zetel tot stand heeft gebracht. Indien het betreft een vennootschap
      als bedoeld in het eerste lid van de algemene bepaling, kan de intrekking of de aanwijzing van een tot intrekking
      bevoegde persoon ook geschieden door de algemene vergadering. [Artikel 1, vierde lid][ref1], is van overeenkomstige
      toepassing. Door de intrekking vervallen alle overeenkomstig deze rijkswet gedane benoemingen en in de akte van
      oprichting of in de statuten en reglementen aangebrachte andere veranderingen.

      2 Eveneens kan, zolang de verplaatsing van de zetel van een rechtspersoon overeenkomstig deze rijkswet nog niet in
      werking is getreden, door de in het vorige lid genoemde personen en organen een nadere wijziging worden aangebracht
      met betrekking tot benoemingen en andere veranderingen, als bedoeld in de laatste zin van het vorige lid, onder
      handhaving van de zetelverplaatsing zelf. De nadere wijziging van de andere veranderingen in de akte van oprichting
      of in de statuten en reglementen behoeft toestemming of bekrachtiging op dezelfde wijze als in deze rijkswet is
      voorgeschreven ten aanzien van de zetelverplaatsing en de tegelijk daarmede aangebrachte andere veranderingen.

      3 De intrekking en de nadere wijziging, vermeld in de vorige leden, geschieden op straffe van nietigheid bij
      notariële akte. De akte wordt verleden in de Nederlandse taal.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel1
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0002561
        artikel: '1'
        afdeling: '1'
  - number: '21'
    text: |-
      1 De notariële akten, voorgeschreven in deze rijkswet, kunnen bestaan in een notarieel proces-verbaal van de
      bestuursvergadering of van de algemene vergadering, waarin het desbetreffende besluit is genomen.

      2 Voor de toepassing van [artikel 1, vierde lid der Consulaire wet][ref1] worden met Nederlanders gelijkgesteld
      de personen en de organen van de rechtspersoon, die een handeling verrichten waarvoor de onderhavige rijkswet een
      notariële akte voorschrijft.


      [ref1]: https://wetten.overheid.nl/BWBR0001847#Artikel1
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0001847
        artikel: '1'
  - number: '22'
    text: |-
      Voor zover bepalingen in de akte van oprichting of de statuten en reglementen van een rechtspersoon niet in
      overeenstemming zijn met het bij of krachtens deze rijkswet bepaalde, blijven zij buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel22
  - number: '23'
    text: |-
      De overheid is, buiten gevallen van opzet of grove schuld, niet aansprakelijk op grond dat zij een bekrachtiging,
      als bedoeld in deze rijkswet, ten onrechte heeft verleend.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel23
  - number: '24'
    text: |-
      Wij behouden Ons voor bij algemene maatregel van rijksbestuur te regelen, wat verder nodig is voor de uitvoering
      van deze rijkswet.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel24
  - number: '25'
    text: De wet van 26 april 1940 (*Stb.* 200) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel25
  - number: '26'
    text: Het Deviezenbesluit 1943 (*Stb.* D 20) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel26
  - number: '27'
    text: Het Koninklijk besluit van 23 december 1943 (*Stb.* D 57) wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel27
  - number: '28'
    text: |-
      De geldigheid van wijzigingen van de akte van oprichting en van andere handelingen, goedgekeurd of bekrachtigd
      op grond van de wet van 26 april 1940 (*Stb.* 200), kan niet worden aangevochten op grond dat het vereiste van
      [artikel 5][ref1], dan wel van [artikel 12, tweede lid][ref2], of [17, eerste lid][ref3], in verband met artikel 5,
      van die wet niet in acht zou zijn genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0002561#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002561#Artikel17
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel28
