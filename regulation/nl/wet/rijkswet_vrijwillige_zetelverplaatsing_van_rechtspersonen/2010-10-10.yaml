      1 Elke wijziging van de akte van oprichting van een vennootschap, als in [artikel 9][ref1] bedoeld, behoeft de
      toestemming van Onze Minister van Justitie van het deel van het Koninkrijk, waarheen de plaats van vestiging der
      vennootschap wordt teruggebracht.

      2 De toestemming wordt uitsluitend op een ontwerp van de wijziging verleend. Zij wordt niet verleend, voor zover
      naar het oordeel van Onze Minister die bevoegd is haar te verlenen, niet aannemelijk is dat de wijziging in het
      belang der vennootschap is.

      3 Onze Minister die de toestemming heeft verleend, zendt onverwijld een afschrift van de beschikking houdende
      toestemming en van het ontwerp waarvoor bij deze beschikking toestemming is verleend aan Onze Minister van Justitie
      van het deel van het Koninkrijk, vanwaar de plaats van vestiging wordt teruggebracht.

      4 De [artikelen 4, derde lid][ref2], en [8][ref3] zijn van overeenkomstige toepassing.


