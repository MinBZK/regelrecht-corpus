  - number: '14'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 12][ref1] en [13][ref2] kan door desbetreffende wijziging van
      de akte van oprichting de plaats van vestiging van een vennootschap, welke overeenkomstig [artikel 12][ref3]
      is overgebracht naar een andere plaats in hetzelfde deel van het Koninkrijk, worden teruggebracht naar de
      plaats, waar de vennootschap het eerst was gevestigd, met overeenkomstige toepassing van het bepaalde in
      [artikel 9, tweede en derde lid][ref4], en [artikel 10][ref5].

      2 Elke wijziging van de akte van oprichting, als in het vorige lid bedoeld, behoeft de toestemming van Onze
      Minister van Justitie van het betrokken deel van het Koninkrijk. [Artikel 11, tweede lid][ref6], is van
      overeenkomstige toepassing.

      3 Zo spoedig mogelijk na het verlijden van de akte, die van de wijziging is opgemaakt, zendt de vennootschap een
      authentiek afschrift van deze akte, alsmede de tekst van de akte van oprichting, zoals deze vóór de wijziging
      luidde, aan Onze Minister van Justitie van het betrokken deel van het Koninkrijk.

      4 Zo spoedig mogelijk worden in het betrokken deel van het Koninkrijk de akte van oprichting, zoals deze door de
      wijziging waarin is toegestemd en die in werking is getreden, is komen te luiden, alsmede de beschikking waarbij
      de toestemming is verleend, openbaar gemaakt. [Artikel 8, derde en vierde lid][ref7], is van overeenkomstige
      toepassing.


