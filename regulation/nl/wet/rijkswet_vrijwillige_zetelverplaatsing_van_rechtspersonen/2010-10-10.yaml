  - number: '8'
    text: |-
      1 Zo spoedig mogelijk worden in het deel van het Koninkrijk, waarheen de plaats van vestiging der vennootschap is
      overgebracht, openbaar gemaakt:

      a. de akte van oprichting der vennootschap, zoals deze is komen te luiden na het in werking treden van de wijziging
      waarin is toegestemd of die is bekrachtigd, alsmede de beschikking waarbij de toestemming of de bekrachtiging is
      verleend;

      b. de weigering tot bekrachtiging en de intrekking der toestemming of bekrachtiging van een wijziging, die reeds in
      werking was getreden.

      2 Tenzij daartegen redelijke bedenkingen bestaan, worden in het deel van het Koninkrijk, waar de vennootschap
      tevoren was gevestigd, openbaar gemaakt:

      a. de na het verlenen van toestemming of na bekrachtiging in werking getreden wijziging der akte van oprichting,
      alsmede de beschikking waarbij de toestemming of de bekrachtiging is verleend;

      b. de weigering tot bekrachtiging en de intrekking der toestemming of bekrachtiging van een wijziging, die reeds in
      werking was getreden.

      3 De openbaarmaking geschiedt door middel van het blad, waarin van overheidswege de officiële berichten in het
      betrokken deel van het Koninkrijk worden gepubliceerd, en wel hetzij door de vennootschap of degenen die de
      wijziging hebben verricht, hetzij door Onze Minister van Justitie aldaar.

      4 Voor zover aan de voorschriften van de vorige leden niet is voldaan, kan de wijziging van de akte van oprichting,
      onderscheidenlijk het feit dat de wijziging haar kracht heeft verloren, niet tegen derden te goeder trouw worden
      ingeroepen.
    url: https://wetten.overheid.nl/BWBR0002561/2010-10-10#Artikel8
  - number: '9'
    text: |-
      1 Onverminderd het bepaalde in de [artikelen 1-8][ref1] kan door desbetreffende wijziging van de akte van
      oprichting de plaats van vestiging van een vennootschap, welke overeenkomstig [artikel 1][ref2] is overgebracht
      naar een ander deel van het Koninkrijk, worden teruggebracht naar het deel van het Koninkrijk, waar de vennootschap
      het eerst gevestigd was.

      2 Bevoegd tot deze wijziging van de akte van oprichting zijn het bestuur der vennootschap en de algemene
      vergadering van aandeelhouders.

      3 [Artikel 1, vierde en zevende lid][ref3], is van overeenkomstige toepassing.


