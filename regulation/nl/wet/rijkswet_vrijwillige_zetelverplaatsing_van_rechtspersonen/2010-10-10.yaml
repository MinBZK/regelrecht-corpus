  - number: '16'
    text: |-
      1 Wordt de plaats van vestiging naar een ander deel van het Koninkrijk overgebracht, dan is met betrekking tot
      de beslissing tot overbrenging, met inbegrip van de andere veranderingen in de statuten en reglementen van de
      rechtspersoon, en de benoemingen van toepassing hetgeen in de [artikelen 2 tot en met 8][ref1] met betrekking tot
      de wijziging van de akte van oprichting van een vennootschap en de benoemingen is bepaald.

      2 Wordt de plaats van vestiging naar een andere plaats in hetzelfde deel van het Koninkrijk overgebracht, dan is
      met betrekking tot deze beslissing, met inbegrip van de andere veranderingen in de statuten en reglementen van
      de rechtspersoon, en de benoemingen van toepassing hetgeen in de [artikelen 12, tweede en derde lid][ref2], en
      [13][ref3] met betrekking tot de wijziging van de akte van oprichting van een vennootschap en de benoemingen is
      bepaald.

      3 In afwijking van het eerste en het tweede lid behoeven de statuten en reglementen en de daarin aangebrachte
      veranderingen slechts te worden openbaar gemaakt, voor zover andere in het betrokken deel van het Koninkrijk
      geldende wettelijke bepalingen een soortgelijke openbaarmaking van de statuten en reglementen van zodanige
      rechtspersoon voorschrijven.


      [ref1]: https://wetten.overheid.nl/BWBR0002561#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002561#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0002561#Artikel13
