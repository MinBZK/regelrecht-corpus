  - number: '17'
    text: |-
      1 De overeenkomstig [artikel 15][ref1] overgebrachte plaats van vestiging van een rechtspersoon die geen
      vennootschap in de zin van het eerste lid van de algemene bepaling is, kan, onverminderd het bepaalde in de
      [artikelen 15][ref2] en [16][ref3], worden teruggebracht naar het deel van het Koninkrijk of naar de plaats in
      hetzelfde deel van het Koninkrijk, waar de rechtspersoon het eerst gevestigd was.

      2 Bevoegd tot deze beslissing is het bestuur van de rechtspersoon. Artikel 1, vierde lid, is van overeenkomstige
      toepassing.

      3 De beslissing, bedoeld in dit artikel, kan tevens andere veranderingen in de statuten en reglementen van de
      rechtspersoon inhouden.

      4 Was de plaats van vestiging naar een ander deel van het Koninkrijk overgebracht, dan is met betrekking tot
      de beslissing tot terugbrenging, met inbegrip van de andere veranderingen in de statuten en reglementen van de
      rechtspersoon, van toepassing hetgeen in de [artikelen 10][ref4] en [11][ref5] met betrekking tot de wijziging van
      de akte van oprichting van een vennootschap is bepaald.

      5 Was de plaats van vestiging naar een andere plaats in hetzelfde deel van het Koninkrijk overgebracht,
      dan is met betrekking tot de beslissing tot terugbrenging, met inbegrip van de andere veranderingen in
      de statuten en reglementen van de rechtspersoon, van toepassing hetgeen in de [artikelen 10][ref6] en
      [14, tweede tot en met vierde lid][ref7], met betrekking tot de wijziging van de akte van oprichting van een
      vennootschap is bepaald.

      6 In afwijking van het vierde en het vijfde lid behoeven de statuten en reglementen en de daarin aangebrachte
      veranderingen slechts te worden openbaar gemaakt, voor zover andere in het betrokken deel van het Koninkrijk
      geldende wettelijke bepalingen een soortgelijke openbaarmaking van de statuten en reglementen van zodanige
      rechtspersoon voorschrijven.


