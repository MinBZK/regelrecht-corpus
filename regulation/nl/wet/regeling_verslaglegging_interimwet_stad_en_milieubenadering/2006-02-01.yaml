---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_verslaglegging_interimwet_stad_en_milieubenadering
regulatory_layer: WET
publication_date: '2010-03-30'
valid_from: '2006-02-01'
bwb_id: BWBR0019470
url: https://wetten.overheid.nl/BWBR0019470/2006-02-01
preamble:
  text: |-
    Gelet op artikel 17, vijfde lid, van de Interimwet stad-en-milieubenadering;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder wet: [Interimwet stad-en-milieubenadering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0019466
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0019466
  - number: '2'
    text: |-
      In het verslag, bedoeld in [artikel 17, eerste lid, van de wet][ref1] besteden burgemeester en wethouders in ieder
      geval aandacht aan de volgende elementen:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel17
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '17'
  - number: 2.a
    text: |-
      de wijze waarop de leefomgevingskwaliteit en het ruimtegebruik zich hebben ontwikkeld in het projectgebieden de
      directe omgeving daarvan;
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
  - number: 2.b
    text: |-
      de uitvoering van aanvullende bronmaatregelen en de effecten ervan op de leefomgevingskwaliteit en het
      ruimtegebruik in het projectgebied;
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
  - number: 2.c
    text: |-
      de uitvoering van de beperkende en compenserende maatregelen en de effecten ervan op de leefomgevingskwaliteit en
      het ruimtegebruik in het projectgebied;
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
  - number: 2.d
    text: |-
      de noodzaak om aanvullende maatregelen als bedoeld in [artikel 8 van de wet][ref1] te nemen in verband met de
      uitvoering van het afwijkingsbesluit;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel8
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '8'
  - number: 2.e
    text: |-
      indien van toepassing de wijze waarop de termijn van een besluit als bedoeld in de [artikelen 2][ref1] en
      [3 van de wet][ref2] wordt gehandhaafd;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 2.f
    text: |-
      de wijze waarop de doorwerking van een besluit als bedoeld in de [artikelen 2][ref1] en [3 van de wet][ref2] in
      andere besluiten vorm heeft gekregen;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 2.g
    text: |-
      het toezicht op de naleving van de afwijkende milieukwaliteitsnorm, bedoeld in [artikel 15 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel15
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '15'
  - number: 2.h
    text: de wijze waarop belanghebbende partijen zijn betrokken bij het opstellen van het verslag.
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel2
  - number: '3'
    text: |-
      In het verslag bedoeld in [artikel 17, vierde lid, van de wet][ref1] besteden gedeputeerde staten aandacht aan de
      volgende elementen:


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel17
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '17'
  - number: 3.a
    text: |-
      voor zover de provincie organisatorische of procedurele voorzieningen heeft getroffen om gemeenten te begeleiden,
      welke voorzieningen dat zijn;
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
  - number: 3.b
    text: |-
      de inhoudelijke criteria die de provincie hanteert bij de besluitvorming omtrent goedkeuring van stap 3-besluiten,
      en de wijze waarop die besluitvorming procedureel vorm is gegeven;
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
  - number: 3.c
    text: |-
      het functioneren en de effecten van de melding, bedoeld in [artikel 11 van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel11
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '11'
  - number: 3.d
    text: |-
      het aantal besluiten als bedoeld in de [artikelen 2][ref1] en [3 van de wet][ref2] dat in behandeling is genomen en
      een korte aanduiding van de strekking ervan;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 3.e
    text: |-
      de wijze waarop de koppeling tussen het besluit, bedoeld in de [artikelen 2][ref1] en [3 van de wet][ref2], en het
      bestemmingsplan inhoudelijk vorm heeft gekregen;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 3.f
    text: |-
      het aantal besluiten als bedoeld in de [artikelen 2][ref1] en [3 van de wet][ref2] waaraan de goedkeuring is
      verleend of onthouden;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 3.g
    text: |-
      het aantal beroepen dat is ingesteld tegen de besluiten omtrent goedkeuring van besluiten als bedoeld in de
      [artikelen 2][ref1] en [3 van de wet][ref2] en de resultaten daarvan;


      [ref1]: https://wetten.overheid.nl/BWBR0019466#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019466#Artikel3
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0019466
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0019466
        artikel: '3'
  - number: 3.h
    text: |-
      de bijdrage van de wet aan de uitvoering van beleid voor het zuinig en doelmatig ruimtebruik en de
      leefomgevingskwaliteit in stedelijk en landelijk gebied;
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
  - number: 3.i
    text: de invloed van nieuwe ontwikkelingen op relevante beleidsterreinen op de toepassing van de wet.
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel3
  - number: '4'
    text: Deze regeling treedt in werking op het tijdstip waarop de Interimwet stad-en-milieubenadering in werking treedt.
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel4
  - number: '5'
    text: 'Deze regeling wordt aangehaald als: Regeling verslaglegging Interimwet stad-en-milieubenadering.'
    url: https://wetten.overheid.nl/BWBR0019470/2006-02-01#Artikel5
