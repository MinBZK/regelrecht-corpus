  - number: '3'
    text: |-
      In het verslag bedoeld in [artikel 17, vierde lid, van de wet][ref1] besteden gledeputeerde staten aandacht aan de
      volgende elementen:

      a. voor zover de provincie organisatorische of procedurele voorzieningen heeft getroffen om gemeenten te
      begeleiden, welke voorzieningen dat zijn;

      b. de inhoudelijke criteria die de provincie hanteert bij de besluitvorming omtrent goedkeuring van stap 3-
      besluiten, en de wijze waarop die besluitvorming procedureel vorm is gegeven;

      c. het functioneren en de effecten van de melding, bedoeld in [artikel 11 van de wet][ref2];

      d. het aantal besluiten als bedoeld in de [artikelen 2][ref3] en [3 van de wet][ref4] dat in behandeling is genomen
      en een korte aanduiding van de strekking ervan;

      e. de wijze waarop de koppeling tussen het besluit, bedoeld in de [artikelen 2][ref5] en [3 van de wet][ref6], en
      het bestemmingsplan inhoudelijk vorm heeft gekregen;

      f. het aantal besluiten als bedoeld in de [artikelen 2][ref7] en [3 van de wet][ref8] waaraan de goedkeuring is
      verleend of onthouden;

      g. het aantal beroepen dat is ingesteld tegen de besluiten omtrent goedkeuring van besluiten als bedoeld in de
      [artikelen 2][ref9] en [3 van de wet][ref10] en de resultaten daarvan;

      h. de bijdrage van de wet aan de uitvoering van beleid voor het zuinig en doelmatig ruimtebruik en de
      leefomgevingskwaliteit in stedelijk en landelijk gebied;

      i. de invloed van nieuwe ontwikkelingen op relevante beleidsterreinen op de toepassing van de wet.


