  - number: '2'
    text: |-
      In het verslag, bedoeld in [artikel 17, eerste lid, van de wet][ref1] besteden burgemeester en wethouders in ieder
      geval aandacht aan de volgende elementen:

      a. de wijze waarop de leefomgevingskwaliteit en het ruimtegebruik zich hebben ontwikkeld in het projectgebieden de
      directe omgeving daarvan;

      b. de uitvoering van aanvullende bronmaatregelen en de effecten ervan op de leefomgevingskwaliteit en het
      ruimtegebruik in het projectgebied;

      c. de uitvoering van de beperkende en compenserende maatregelen en de effecten ervan op de leefomgevingskwaliteit
      en het ruimtegebruik in het projectgebied;

      d. de noodzaak om aanvullende maatregelen als bedoeld in [artikel 8 van de wet][ref2] te nemen in verband met de
      uitvoering van het afwijkingsbesluit;

      e. indien van toepassing de wijze waarop de termijn van een besluit als bedoeld in de [artikelen 2][ref3] en
      [3 van de wet][ref4] wordt gehandhaafd;

      f. de wijze waarop de doorwerking van een besluit als bedoeld in de [artikelen 2][ref5] en [3 van de wet][ref6] in
      andere besluiten vorm heeft gekregen;

      g. het toezicht op de naleving van de afwijkende milieukwaliteitsnorm, bedoeld in [artikel 15 van de wet][ref7];

      h. de wijze waarop belanghebbende partijen zijn betrokken bij het opstellen van het verslag.


