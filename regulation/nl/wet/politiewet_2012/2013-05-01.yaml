  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder strafrechtelijke handhaving van de rechtsorde mede
      verstaan: het waken over de veiligheid van personen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel1
  - number: '2'
    text: 'Ambtenaren van politie in de zin van deze wet zijn:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel2
  - number: 2.a
    text: ambtenaren die zijn aangesteld voor de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel2
  - number: 2.b
    text: |-
      ambtenaren die zijn aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel2
  - number: 2.c
    text: |-
      vrijwillige ambtenaren die zijn aangesteld voor de uitvoering van de politietaak, onderscheidenlijk voor de
      uitvoering van technische, administratieve en andere taken ten dienste van de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel2
  - number: 2.d
    text: |-
      ambtenaren van de rijksrecherche die zijn aangesteld voor de uitvoering van de politietaak, onderscheidenlijk voor
      de uitvoering van technische, administratieve en andere taken ten dienste van de rijksrecherche.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel2
  - number: 2a
    text: |-
      Ambtenaren die zijn aangesteld bij het Landelijk selectie- en opleidingsinstituut politie, Politie onderwijs- en
      kenniscentrum en direct daaraan voorafgaand ambtenaren van politie die zijn aangesteld voor de uitvoering van de
      politietaak waren, zijn ambtenaren van politie als bedoeld in [artikel 2, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
        hoofdstuk: '1'
  - number: '3'
    text: |-
      De politie heeft tot taak in ondergeschiktheid aan het bevoegd gezag en in overeenstemming met de geldende
      rechtsregels te zorgen voor de daadwerkelijke handhaving van de rechtsorde en het verlenen van hulp aan hen die
      deze behoeven.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel3
  - number: '4.1'
    text: |-
      Aan de Koninklijke marechaussee, die onder het beheer van Onze Minister van Defensie staat, zijn, onverminderd het
      bepaalde bij of krachtens andere wetten, de volgende politietaken opgedragen:
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.1.a
    text: |-
      het waken over de veiligheid van de leden van het koninklijk huis, in samenwerking met andere daartoe aangewezen
      organen;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.1.b
    text: |-
      de uitvoering van de politietaak ten behoeve van Nederlandse en andere strijdkrachten, alsmede internationale
      militaire hoofdkwartieren, en ten aanzien van tot die strijdkrachten en hoofdkwartieren behorende personen;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.1.c
    text: |-
      de uitvoering van de politietaak op de luchthaven Schiphol en op de andere door Onze Minister en Onze Minister van
      Defensie aangewezen luchtvaartterreinen, alsmede de beveiliging van de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.1.d
    text: |-
      de verlening van bijstand alsmede de samenwerking met de politie krachtens deze wet, daaronder begrepen de
      assistentieverlening aan de politie bij de bestrijding van grensoverschrijdende criminaliteit;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.1.e
    text: |-
      de uitvoering van de politietaak op plaatsen onder beheer van Onze Minister van Defensie, op verboden plaatsen die
      krachtens de [Wet bescherming staatsgeheimen][ref1] ten behoeve van de landsverdediging zijn aangewezen, alsmede op
      het terrein van de ambtswoning van Onze Minister-President;


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: 4.1.f
    text: |-
      de uitvoering van de bij of krachtens de [Vreemdelingenwet 2000][ref1] opgedragen taken, waaronder begrepen de
      bediening van de daartoe door Onze Minister voor Immigratie en Asiel aangewezen doorlaatposten en het, voor zover
      in dat verband noodzakelijk, uitvoeren van de politietaak op en nabij deze doorlaatposten, alsmede het verlenen van
      medewerking bij de aanhouding of voorgeleiding van een verdachte of veroordeelde;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.1.g
    text: de bestrijding van mensensmokkel en van fraude met reis- en identiteitsdocumenten;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.1.h
    text: |-
      het in opdracht van Onze Minister en Onze Minister van Defensie ten behoeve van De Nederlandsche Bank N.V.
      verrichten van beveiligingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: '4.2'
    text: |-
      Onder personen die behoren tot de andere strijdkrachten en internationale hoofdkwartieren, bedoeld in het eerste
      lid, onder b, worden mede begrepen de personen, aangewezen bij algemene maatregel van bestuur op voordracht van
      Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister kan de commandant van de Koninklijke marechaussee algemene en bijzondere aanwijzingen geven, voor
      zover het betreft:
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.3.a
    text: de uitoefening van de taken, bedoeld in het eerste lid, onder a en h;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.3.b
    text: het waken over de veiligheid van door Onze Minister aangewezen personen als bedoeld in het eerste lid, onder b;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.3.c
    text: |-
      de uitoefening van de taak, bedoeld in het eerste lid, onder c, ten behoeve van de strafrechtelijke handhaving van
      de rechtsorde en de beveiliging van de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: 4.3.d
    text: de bewaking en beveiliging van de ambtswoning van Onze Minister-President, bedoeld in het eerste lid, onder e.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
  - number: '4.4'
    text: |-
      Hoewel bevoegd tot de opsporing van alle strafbare feiten, onthoudt de militair van de Koninklijke marechaussee die
      is aangewezen krachtens [artikel 141 van het Wetboek van Strafvordering][ref1], zich van optreden anders dan in het
      kader van de uitvoering van zijn politietaken, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '5'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Defensie kunnen regels worden gegeven over
      de samenwerking van de politie met de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel5
  - number: '6.1'
    text: De ambtenaar van politie is bevoegd zijn taak uit te oefenen in het gehele land.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel6
  - number: '6.2'
    text: |-
      Hoewel bevoegd in het gehele land, onthoudt de ambtenaar van politie die is tewerkgesteld bij een regionale
      eenheid, zich van optreden buiten zijn gebied van tewerkstelling, tenzij zijn optreden redelijkerwijs noodzakelijk
      is, dan wel ingevolge regels, gesteld bij of krachtens de wet, dan wel in opdracht of met toestemming van het
      bevoegd gezag over de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel6
  - number: '7.1'
    text: |-
      De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak, is bevoegd in de rechtmatige
      uitoefening van zijn bediening geweld of vrijheidsbeperkende middelen te gebruiken, wanneer het daarmee beoogde
      doel dit, mede gelet op de aan het gebruik hiervan verbonden gevaren, rechtvaardigt en dat doel niet op een andere
      wijze kan worden bereikt. Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel7
  - number: '7.2'
    text: |-
      De ambtenaar van politie, bedoeld in het eerste lid, heeft toegang tot elke plaats, voor zover dat voor het
      verlenen van hulp aan hen die deze behoeven, redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel7
  - number: '7.3'
    text: |-
      De ambtenaar van politie, bedoeld in het eerste lid, is bevoegd tot het onderzoek aan de kleding van personen bij
      de uitoefening van een hem wettelijk toegekende bevoegdheid of bij een handeling ter uitvoering van de politietaak,
      indien uit feiten of omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor hun leven of veiligheid of die
      van de ambtenaar zelf of van derden, en dit onderzoek noodzakelijk is ter afwending van dit gevaar.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel7
  - number: '7.4'
    text: |-
      De officier van justitie of de hulpofficier van justitie voor wie aangehouden of rechtens van hun vrijheid
      beroofde verdachten of veroordeelden worden geleid, is bevoegd te gelasten dat deze aan hun lichaam zullen worden
      onderzocht, indien uit feiten of omstandigheden blijkt dat gevaar dreigt voor hun leven of veiligheid of die van de
      ambtenaar zelf, en dit onderzoek noodzakelijk is ter afwending van dit gevaar.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel7
  - number: '7.5'
    text: |-
      De uitoefening van de bevoegdheden, bedoeld in het eerste tot en met het vierde lid, dient in verhouding tot het
      beoogde doel redelijk en gematigd te zijn.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel7
  - number: '7.6'
    text: |-
      Het eerste tot en met het vijfde lid zijn van toepassing op de militair van de Koninklijke marechaussee, indien
      hij optreedt in de rechtmatige uitoefening van zijn bediening, en op de militair van enig ander onderdeel van de
      krijgsmacht die op grond van deze wet bijstand verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel7
  - number: '7.7'
    text: |-
      Onze Minister kan bepalen dat de in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1] bedoelde
      buitengewone opsporingsambtenaren, voor zover door hem hetzij in persoon, hetzij per categorie of eenheid
      aangewezen, de bevoegdheden omschreven in het eerste en het derde lid kunnen uitoefenen. Alsdan wordt met
      overeenkomstige toepassing van [artikel 9][ref2] een ambtsinstructie voor hen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel9
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '8.1'
    text: |-
      Een ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak, is bevoegd tot het vorderen
      van inzage van een identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] van
      personen, voor zover dat redelijkerwijs noodzakelijk is voor de uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '8.2'
    text: |-
      Gelijke bevoegdheid komt toe aan een buitengewoon opsporingsambtenaar als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1], voor zover dat redelijkerwijs noodzakelijk is
      voor de uitoefening van zijn taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '8.3'
    text: |-
      Gelijke bevoegdheid komt toe aan de militair van de Koninklijke marechaussee, voor zover dat redelijkerwijs
      noodzakelijk is voor de uitvoering van zijn politietaak, bedoeld in artikel 4, eerste lid, en aan de militair
      van de Koninklijke marechaussee of van enig ander onderdeel van de krijgsmacht die op grond van deze wet bijstand
      verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel8
  - number: '9.1'
    text: |-
      Bij algemene maatregel van bestuur wordt een ambtsinstructie voor de politie en voor de Koninklijke marechaussee
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel9
  - number: '9.2'
    text: |-
      Indien de militair van enig ander onderdeel van de krijgsmacht op grond van deze wet bijstand verleent aan de
      politie is de ambtsinstructie van toepassing.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel9
  - number: '9.3'
    text: |-
      In de ambtsinstructie worden regels gesteld ter uitvoering van de [artikelen 6][ref1] en [7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '9.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent maatregelen waaraan rechtens van hun
      vrijheid beroofde personen met het oog op hun insluiting kunnen worden onderworpen, voor zover dit noodzakelijk is
      in het belang van hun veiligheid of de veiligheid van anderen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel9
  - number: '9.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op personen die ten behoeve van de hulpverlening aan hen zijn
      ondergebracht bij de politie of de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel9
  - number: '9.6'
    text: |-
      De ambtenaren die door Onze Minister zijn aangewezen voor het vervoer van rechtens van hun vrijheid beroofde
      personen, kunnen de bevoegdheden, bedoeld in [artikel 7, eerste en derde lid][ref1], uitoefenen, dan wel de
      maatregelen, bedoeld in het vierde lid, treffen, voor zover dit noodzakelijk is om te voorkomen dat de te vervoeren
      persoon zich onttrekt aan het op hem uitgeoefende toezicht. De eerste volzin is van toepassing voor zover de
      rechtens van hun vrijheid beroofde personen zijn ondergebracht bij de politie of de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '9.7'
    text: |-
      De voordracht voor de algemene maatregel van bestuur, bedoeld in het eerste en het vierde lid, geschiedt door Onze
      Minister in overeenstemming met Onze Minister van Defensie voor zover het de Koninklijke marechaussee betreft.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel9
  - number: '10.1'
    text: |-
      Alle ambtenaren die zijn belast met een politietaak, verlenen elkaar wederkerig de nodige hulp en betrachten bij
      voortduring een eendrachtige samenwerking bij het uitvoeren van die taak. Zij verlenen elkaar zoveel mogelijk de
      gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel10
  - number: '10.2'
    text: |-
      Zij die op grond van de [artikelen 141, onderdeel d][ref1], en [142 van het Wetboek van Strafvordering][ref2] tot
      opsporing van strafbare feiten bevoegd zijn, werken samen met de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '10.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven over de samenwerking van de politie met de
      buitengewone opsporingsambtenaren, bedoeld in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '11.1'
    text: |-
      Indien de politie in een gemeente optreedt ter handhaving van de openbare orde en ter uitvoering van de
      hulpverleningstaak, staat zij onder gezag van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel11
  - number: '11.2'
    text: |-
      De burgemeester kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling van de in
      het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel11
  - number: '12.1'
    text: |-
      Indien de politie optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten dienste
      van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel12
  - number: '12.2'
    text: |-
      De officier van justitie kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling
      van de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel12
  - number: '13.1'
    text: |-
      De burgemeester en de officier van justitie overleggen regelmatig tezamen met het hoofd van het territoriale
      onderdeel van de regionale eenheid binnen welker grondgebied de gemeente geheel of ten dele valt, en zo nodig met
      de politiechef van een regionale eenheid, over de taakuitvoering van de politie en over het beleid ten aanzien van
      de taakuitvoering (driehoeksoverleg).
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel13
  - number: '13.2'
    text: |-
      In het driehoekoverleg worden door de burgemeester en de officier van justitie afspraken gemaakt over de inzet van
      de politie ten behoeve van de handhaving van de openbare orde en de hulpverlening, onderscheidenlijk ten behoeve
      van de strafrechtelijke handhaving van de rechtsorde en de taken ten dienste van de justitie. De afspraken worden
      mede gemaakt op basis van de doelen, bedoeld in [artikel 38b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel38b
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: 38b
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '13.3'
    text: Op verzoek van de burgemeester vindt het driehoeksoverleg plaats op gemeentelijk niveau.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel13
  - number: '13.4'
    text: |-
      In het driehoeksoverleg worden door de burgemeester en de officier van justitie afspraken gemaakt over lokale
      prioriteiten en criminaliteitsbestrijding.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel13
  - number: '14.1'
    text: |-
      Voor zover de Koninklijke marechaussee in een gemeente optreedt ter handhaving van de openbare orde, staat zij
      onder gezag van de burgemeester. [Artikel 11, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14.2'
    text: |-
      Voor zover de Koninklijke marechaussee optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken
      verricht ten dienste van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier
      van justitie. [Artikel 12, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel12
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14.3'
    text: |-
      Indien de Koninklijke marechaussee optreedt als bedoeld in het eerste of tweede lid, neemt de commandant van de
      Koninklijke marechaussee deel aan het overleg, bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de militair van enig ander onderdeel van de
      krijgsmacht, indien hij bijstand verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel14
  - number: '15.1'
    text: |-
      De burgemeester is aan de gemeenteraad verantwoording schuldig over het door hem uitgeoefende gezag, bedoeld in de
      [artikelen 11, eerste lid][ref1], en [14, eerste en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '15.2'
    text: |-
      [Artikel 180, tweede en derde lid, van de Gemeentewet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel180
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '180'
  - number: '15.3'
    text: |-
      Onze Minister kan de burgemeesters en, in geval van een situatie als bedoeld in
      [artikel 39 van de Wet veiligheidsregio’s][ref1], de voorzitter van een veiligheidsregio, zoveel mogelijk na
      overleg met hen, algemene en bijzondere aanwijzingen geven met betrekking tot de handhaving van de openbare orde,
      voorzover dat noodzakelijk is in het belang van de veiligheid van de Staat of de betrekkingen van Nederland met
      andere mogendheden, dan wel met het oog op zwaarwegende belangen van de samenleving. De aanwijzingen worden zo
      enigszins mogelijk schriftelijk gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '16.1'
    text: |-
      Onze Minister kan objecten en diensten aanwijzen waarvan bewaking of beveiliging door de politie noodzakelijk is in
      het belang van de veiligheid van de Staat of de betrekkingen van Nederland met andere mogendheden, dan wel met het
      oog op zwaarwegende belangen van de samenleving.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel16
  - number: '16.2'
    text: |-
      De burgemeester draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voor zover dat
      geschiedt ter handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel16
  - number: '16.3'
    text: |-
      De officier van justitie draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voor zover
      dat geschiedt ter strafrechtelijke handhaving van de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel16
  - number: '17.1'
    text: |-
      Ten behoeve van de toepassing van de [artikelen 15, derde lid][ref1], en [16, tweede lid][ref2], verstrekken de
      burgemeesters en Onze Minister elkaar de gewenste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '17.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister stelt, gehoord het College van procureurs-generaal en de regioburgemeesters, ten minste eenmaal in de
      vier jaar de landelijke beleidsdoelstellingen vast ten aanzien van de taakuitvoering van de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel18
  - number: '18.2'
    text: |-
      Indien daarvoor bijzondere redenen zijn, kunnen de landelijke beleidsdoelstellingen tussentijds worden gewijzigd of
      aangevuld, gehoord het College van procureurs-generaal en de regioburgemeesters.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel18
  - number: '18.3'
    text: |-
      Zodra de landelijke beleidsdoelstellingen zijn vastgesteld, gewijzigd of aangevuld, zendt Onze Minister deze aan de
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister voert, in aanwezigheid van de korpschef, ten minste viermaal per jaar overleg met de
      regioburgemeesters of een afvaardiging van de regioburgemeesters en de voorzitter van het College van procureurs-
      generaal over de taakuitvoering door en het beheer ten aanzien van de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
  - number: '19.2'
    text: |-
      Onze Minister wijst voor een periode van vier jaren twee burgemeesters aan die aan het overleg deelnemen. Zij zijn
      burgemeester van een gemeente met minder dan 100 000 inwoners. Zij kunnen niet tevens regioburgemeester zijn. Voor
      de aanwijzing wordt een aanbeveling gedaan door een door Onze Minister aangewezen orgaan.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
  - number: '19.3'
    text: 'In het overleg wordt in elk geval gesproken over:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
  - number: 19.3.a
    text: de inrichting van de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
  - number: 19.3.b
    text: |-
      de landelijke beleidsdoelstellingen, bedoeld in [artikel 18, eerste lid][ref1], en de doelstellingen, bedoeld in
      [artikel 20, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel20
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '18'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '20'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 19.3.c
    text: |-
      de verdeling van sterkte, bedoeld in [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel36
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 19.3.d
    text: |-
      het ontwerp van de begroting en het ontwerp van de meerjarenraming, bedoeld in [artikel 34][ref1], het ontwerp
      van de jaarrekening, bedoeld in [artikel 35][ref2], het ontwerp van het beheersplan en het jaarverslag, bedoeld in
      [artikel 37, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel37
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 19.3.e
    text: |-
      de benoeming van de leden van de leiding van de politie, bedoeld in [artikel 28, derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 19.3.f
    text: |-
      voorstellen van wet, ontwerpen van algemene maatregel van bestuur en ontwerpen van ministeriële regeling die geheel
      of voor een belangrijk deel betrekking hebben op de taakuitvoering door en het beheer ten aanzien van de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister stelt, gehoord het College van procureurs-generaal en de regioburgemeesters, met inachtneming
      van de omstandigheden van de betrokken eenheid, ten minste eenmaal in de vier jaar voor iedere regionale en
      landelijke eenheid de doelstellingen vast ter verwezenlijking van de landelijke beleidsdoelstellingen, bedoeld in
      [artikel 18, eerste lid][ref1]. Alvorens een regioburgemeester de gezamenlijke zienswijze van de burgemeesters van
      de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert geeft, hoort hij deze burgemeesters
      over de doelen die de gemeenten op het terrein van de veiligheid nastreven.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel18
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '18'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '20.2'
    text: |-
      Indien daarvoor bijzondere redenen zijn, kunnen de doelstellingen voor een regionale of landelijke eenheid
      tussentijds worden gewijzigd of aangevuld.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel20
  - number: '21.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vereisten voor een goede
      taakuitvoering door de politie en de eisen die worden gesteld aan de bekwaamheid van de ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel21
  - number: '21.2'
    text: |-
      Voor zover de regels, bedoeld in het eerste lid, mede van toepassing zijn op de uitvoering van de politietaken door
      de Koninklijke marechaussee, geschiedt de voordracht voor de algemene maatregel van bestuur door Onze Minister in
      overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de bewapening, de uitrusting en de
      kleding van de ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel22
  - number: '23.1'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel23
  - number: 23.1.a
    text: |-
      de informatie- en communicatievoorzieningen van de politie en het gebruik daarvan door de politie en door andere
      organisaties die een taak hebben op het terrein van justitie, openbare orde, veiligheid of hulpverlening, en
      waarmee de politie ter uitvoering van de politietaak informatie- en communicatievoorzieningen deelt;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel23
  - number: 23.1.b
    text: de informatiebeveiliging door de politie en door andere organisaties als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel23
  - number: '23.2'
    text: |-
      Voor zover de regels, bedoeld in het eerste lid, van belang zijn voor de uitvoering van de politietaken, bedoeld in
      [artikel 4][ref1], kunnen zij, in overeenstemming met Onze Minister van Defensie, mede worden gesteld ten aanzien
      van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '23.3'
    text: |-
      Onze Minister kan de regionale en landelijke eenheden frequenties toewijzen voor de overdracht van gegevens door
      middel van de daartoe geëigende aangewezen informatie- en communicatievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel23
  - number: '24'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel24
  - number: 24.a
    text: |-
      de doeleinden waarvoor de politie, met inachtneming van het bepaalde bij of krachtens de
      [Wet politiegegevens][ref1], gegevens verwerkt of verder verwerkt en de categorieën van gegevens die de politie
      daartoe verwerkt, alsmede over de terbeschikkingstelling van gegevens ten behoeve van de uitvoering van de
      politietaak en de verstrekking van gegevens aan personen en instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 24.b
    text: |-
      de wijze waarop de politie gegevens verwerkt, daaronder begrepen de schrijfwijze en classificatie van gegevens,
      alsmede de wijze van vermelding van de herkomst van de gegevens.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel24
  - number: '25.1'
    text: 'Er is een landelijk politiekorps dat bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel25
  - number: 25.1.a
    text: regionale eenheden, belast met de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel25
  - number: 25.1.b
    text: |-
      een of meer bij ministeriële regeling aan te wijzen landelijke eenheden, belast met de uitvoering van de
      politietaak;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel25
  - number: 25.1.c
    text: een of meer bij ministeriële regeling aan te wijzen ondersteunende diensten.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel25
  - number: '25.2'
    text: |-
      Er is een regionale eenheid in elk van de arrondissementen, genoemd in de [Wet op de rechterlijke indeling][ref1],
      met dien verstande dat er één regionale eenheid in de arrondissementen Gelderland en Overijssel gezamenlijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002080
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002080
  - number: '25.3'
    text: |-
      Bij ministeriële regeling kan een gebied waarin een regionale eenheid de politietaak uitvoert worden opgedeeld in
      meerdere gebieden waarin een regionale eenheid de politietaak uitvoert.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel25
  - number: '25.4'
    text: |-
      Een regionale eenheid kan in territoriale onderdelen worden verdeeld. Een territoriaal
      onderdeel kan slechts gelegen zijn in één regio, genoemd in de [bijlage](onbekend), bedoeld in
      [artikel 8 van de Wet veiligheidsregio’s][ref1], tenzij Onze Minister, op een gezamenlijk verzoek van de
      betrokken burgemeesters en officieren van justitie, besluit dat een territoriaal onderdeel in meerdere regio’s
      gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel8
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '8'
  - number: '26'
    text: De politie heeft rechtspersoonlijkheid en is gevestigd in een door Onze Minister aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel26
  - number: '27.1'
    text: |-
      De korpschef is belast met de leiding en het beheer van de politie. De korpschef legt over de uitoefening van zijn
      taken en bevoegdheden verantwoording af aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel27
  - number: '27.2'
    text: De korpschef vertegenwoordigt de politie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel27
  - number: '28.1'
    text: |-
      De korpschef wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de benoeming worden de
      regioburgemeesters en het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen. De
      korpschef wordt benoemd voor een periode van zes jaren en kan telkens worden herbenoemd voor een periode van drie
      jaren.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel28
  - number: '28.2'
    text: |-
      De korpschef is een ambtenaar van politie als bedoeld in [artikel 2, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
        hoofdstuk: '1'
  - number: '28.3'
    text: |-
      Bij ministeriële regeling worden ambtenaren van politie aangewezen die deel uitmaken van de leiding van de politie.
      Zij worden bij koninklijk besluit benoemd, geschorst en ontslagen. Over de benoeming worden de regioburgemeesters
      en het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen. Onze Minister wijst uit het
      midden van de leiding van de politie een plaatsvervangend korpschef aan.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel28
  - number: '29.1'
    text: 'De volgende handelingen van de korpschef behoeven de instemming van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
  - number: 29.1.a
    text: het sluiten van overeenkomsten die een door Onze Minister vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
  - number: 29.1.b
    text: het doen van investeringen die een door Onze Minister vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
  - number: 29.1.c
    text: het oprichten of mede oprichten van rechtspersonen dan wel het deelnemen daarin.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
  - number: '29.2'
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '29.3'
    text: 'Het is de korpschef verboden:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
  - number: 29.3.a
    text: leningen aan te gaan anders dan bij Onze Minister van Financiën;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
  - number: 29.3.b
    text: |-
      overeenkomsten aan te gaan waarbij hij zich verbindt tot zekerheidstelling met inbegrip van zekerheidstelling voor
      schulden van derden of waarbij hij zich als borg of hoofdelijk medeschuldenaar verbindt of zich voor een derde
      sterk maakt.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel29
  - number: '30.1'
    text: Bij ministeriële regeling worden regels gesteld over het financieel beheer van de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel30
  - number: '30.2'
    text: Bij ministeriële regeling worden regels gesteld over het beheer van de politie door de korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel30
  - number: '31'
    text: |-
      Onze Minister kan de korpschef algemene en bijzondere aanwijzingen geven met betrekking tot de uitoefening van
      diens taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel31
  - number: '32.1'
    text: |-
      De korpschef verstrekt aan Onze Minister, gevraagd en ongevraagd, tijdig de inlichtingen die Onze Minister nodig
      heeft voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel32
  - number: '32.2'
    text: |-
      Onze Minister kan inzage vorderen van gegevens en bescheiden, voor zover dat voor de uitoefening van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel32
  - number: '33'
    text: |-
      Onze Minister stelt jaarlijks ten laste van de begroting van zijn ministerie bijdragen ter beschikking aan de
      politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel33
  - number: '34'
    text: |-
      Onze Minister stelt jaarlijks een begroting vast voor de politie voor het komende begrotingsjaar alsmede een
      meerjarenraming voor vier op het begrotingsjaar volgende jaren.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel34
  - number: '35'
    text: |-
      Onze Minister stelt jaarlijks een jaarrekening vast van de politie, die vergezeld gaat van een verklaring
      omtrent de getrouwheid en de rechtmatigheid van de besteding, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36.1'
    text: |-
      Onze Minister verdeelt de sterkte en middelen over de onderdelen van de politie, bedoeld in
      [artikel 25, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: '36.2'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld over deze verdeling.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel36
  - number: '36.3'
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel36
  - number: '37.1'
    text: Onze Minister stelt jaarlijks een beheersplan en een jaarverslag vast voor de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel37
  - number: '37.2'
    text: |-
      Het beheersplan bevat in ieder geval de indeling van de eenheden als bedoeld in [artikel 25, eerste lid][ref1], in
      districten en basisteams.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: '37.3'
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid zijn politietaak uitvoert en de
      hoofdofficier van justitie worden door de korpschef gehoord over de indeling van de regionale eenheid en de omvang
      van de onderdelen ervan.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel37
  - number: '37.4'
    text: |-
      Het jaarverslag omvat een omschrijving van de door de regionale en landelijke eenheden gerealiseerde activiteiten
      ter verwezenlijking van de landelijke beleidsdoelstellingen, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel18
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '18'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '38.1'
    text: De dagelijkse leiding van een regionale eenheid berust bij de politiechef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38
  - number: '38.2'
    text: |-
      De politiechef van een regionale eenheid wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de
      benoeming worden de regioburgemeester en de hoofdofficier van justitie in de gelegenheid gesteld advies uit te
      brengen. Alvorens het advies wordt uitgebracht, hoort de regioburgemeester de burgemeesters van de gemeenten in het
      gebied waarin de regionale eenheid de politietaak uitvoert.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38
  - number: 38a.1
    text: Er is ten minste één wijkagent werkzaam per 5 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38a
  - number: 38a.2
    text: Bij algemene maatregel van bestuur worden nadere regels gegeven.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38a
  - number: 38b.1
    text: |-
      De gemeenteraad stelt ten minste eenmaal in de vier jaar de doelen vast die de gemeente op het terrein van de
      veiligheid nastreeft door de handhaving van de openbare orde en de hulpverlening door de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38b
  - number: 38b.2
    text: |-
      Voorafgaand aan de vaststelling van het beleidsplan, bedoeld in [artikel 39, eerste lid][ref1], hoort de
      burgemeester van een gemeente in het gebied waarin de regionale eenheid de politietaak uitvoert, de gemeenteraad
      van die gemeente over het ontwerpbeleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 38c.1
    text: |-
      Onze Minister wijst voor elk gebied waarin een regionale eenheid de politietaak uitvoert voor een periode van vier
      jaren een regioburgemeester aan. De burgemeesters van de gemeenten in dat gebied worden in de gelegenheid gesteld
      een gezamenlijke aanbeveling voor de aanwijzing te doen. Onze Minister volgt bij de aanwijzing in beginsel de
      aanbeveling, tenzij zwaarwegende gronden aanleiding tot afwijking geven. Onze Minister motiveert een afwijking.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38c
  - number: 38c.2
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert, kunnen Onze
      Minister gezamenlijk verzoeken de regioburgemeester van zijn functie te ontheffen. De derde en vierde volzin van
      het eerste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38c
  - number: 38d
    text: |-
      De regioburgemeester legt over de uitoefening van zijn taken op grond van deze wet en zijn bevoegdheid op grond
      van [artikel 39, tweede lid][ref1], verantwoording af aan de overige burgemeesters van de gemeenten in het gebied
      waarin de regionale eenheid de politietaak uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '39.1'
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert en de
      hoofdofficier van justitie stellen ten minste eenmaal in de vier jaar, met inachtneming van de doelstellingen,
      bedoeld in [artikel 20, eerste lid][ref1], het beleidsplan en jaarlijks het jaarverslag voor de regionale eenheid
      vast. Het beleidsplan omvat in ieder geval de verdeling van de beschikbare politiesterkte waaronder de beschikbare
      wijkagenten, bedoeld in [artikel 38a, eerste lid][ref2], over de onderdelen van de regionale eenheid, rekening
      houdend met het belang van een goede vervulling van de politietaak in alle betrokken gemeenten en de doelen,
      bedoeld in [artikel 38b, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel38b
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '20'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: 38a
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: 38b
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '39.2'
    text: |-
      Indien het beleidsplan of het jaarverslag niet overeenkomstig de eerste volzin van het eerste lid kunnen worden
      vastgesteld, stelt de regioburgemeester in overeenstemming met de hoofdofficier van justitie het beleidsplan
      respectievelijk het jaarverslag vast.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel39
  - number: '39.3'
    text: |-
      Indien de regioburgemeester en de hoofdofficier van justitie niet met elkaar tot overeenstemming kunnen komen over
      de in het tweede lid bedoelde stukken, legt de regioburgemeester dit verschil van zienswijze schriftelijk voor aan
      Onze Minister die alsdan beslist. De regioburgemeester brengt de stukken in overeenstemming met de beslissing van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel39
  - number: '39.4'
    text: De regioburgemeester zendt het beleidsplan en het jaarverslag aan Onze Minister en de korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel39
  - number: '39.5'
    text: |-
      Tegen het besluit tot vaststelling van het beleidsplan, bedoeld in het tweede lid, kan de burgemeester van een
      gemeente in het gebied waarin de regionale eenheid de politietaak uitvoert beroep instellen bij Onze Minister. Deze
      beoordeelt of het beleidsplan op onaanvaardbare wijze afbreuk doet aan het belang van een goede vervulling van de
      politietaak in de betreffende gemeente.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel39
  - number: '39.6'
    text: |-
      De regioburgemeester brengt het beleidsplan in overeenstemming met het besluit van Onze Minister zonder dat
      hiervoor de instemming van de burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de
      politietaak uitvoert en de hoofdofficier van justitie noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel39
  - number: '40.1'
    text: |-
      Onze Minister kan ten aanzien van het beleidsplan, bedoeld in [artikel 39, eerste lid][ref1], de nodige
      aanwijzingen geven aan de regioburgemeester, indien naar het oordeel van Onze Minister het beleidsplan niet
      of onvoldoende verzekert dat de doelstellingen, bedoeld in [artikel 20, eerste lid][ref2], kunnen worden
      verwezenlijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel20
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '20'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '40.2'
    text: De aanwijzingen, bedoeld in het eerste lid, worden schriftelijk gegeven, gehoord de regioburgemeester.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel40
  - number: '40.3'
    text: |-
      De regioburgemeester brengt, voor zover nodig, het beleidsplan, bedoeld in [artikel 39, eerste lid][ref1], in
      overeenstemming met de aanwijzingen, zonder dat hiervoor de instemming van de burgemeesters in het gebied waarin de
      regionale eenheid de politietaak uitvoert en de hoofdofficier van justitie noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '41'
    text: |-
      De regioburgemeester en de hoofdofficier van justitie overleggen regelmatig met de politiechef van een regionale
      eenheid.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel41
  - number: 41a
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert en waarvan de
      grenzen van de gemeenten samenvallen met de indeling van de regio’s, genoemd in de [bijlage bij artikel 8 van de
      Wet Veiligheidsregio’s](onbekend), en de hoofdofficier van justitie kunnen ten minste eenmaal per jaar over het
      beleid en de taakuitvoering van de politie overleg voeren.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel41a
  - number: '42.1'
    text: 'Er zijn een of meer landelijke eenheden. Zij zijn belast met een of meer van de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel42
  - number: 42.1.a
    text: |-
      de landelijke en specialistische uitvoering van politietaken, in samenwerking met de regionale eenheden, de
      Koninklijke marechaussee en de in [artikel 10, tweede lid][ref1], bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel10
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 42.1.b
    text: |-
      het verzamelen, registreren, bewerken, beheren, analyseren en verstrekken van informatie en het verrichten van
      andere ondersteunende werkzaamheden ten behoeve van de taakuitvoering van de onder a genoemde organen en personen,
      en de andere bij de strafrechtelijke handhaving van de rechtsorde betrokken organen, alsmede de internationale
      uitwisseling van informatie en de landelijke voorlichting aan particulieren;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel42
  - number: 42.1.c
    text: het waken over de veiligheid van leden van het koninklijk huis en andere door Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel42
  - number: '42.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel42
  - number: '42.3'
    text: De dagelijkse leiding van een landelijke eenheid berust bij de politiechef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel42
  - number: '42.4'
    text: |-
      De politiechef van een landelijke eenheid wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de
      benoeming wordt het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel42
  - number: '43.1'
    text: |-
      Onze Minister kan de betrokken ambtenaren van politie voor zover het de uitoefening van de taken, bedoeld in
      [artikel 42, eerste lid, onder a en b][ref1], door het daartoe bestemde onderdeel of de daartoe bestemde onderdelen
      van een landelijke eenheid betreft, de nodige algemene en bijzondere aanwijzingen geven voor de vervulling van die
      taken, voor zover de politie optreedt bij of krachtens de wet of op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie onder verantwoordelijkheid van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '43.2'
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, komt eveneens toe aan Onze Minister met betrekking tot de vervulling van
      de taak, bedoeld in [artikel 42, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '43.3'
    text: |-
      Indien een regionale eenheid of de Koninklijke marechaussee bijstand verleent aan een landelijke eenheid ten
      behoeve van de uitvoering van de taak, bedoeld in [artikel 42, eerste lid, onder c][ref1], kan Onze Minister aan
      de betrokken ambtenaren van politie, onderscheidenlijk de commandant van de Koninklijke marechaussee, de nodige
      algemene en bijzondere aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '44.1'
    text: |-
      Onze Minister kan, indien hij dit nodig acht in verband met de uitvoering van de taken, bedoeld in
      [artikel 42, eerste lid][ref1], daarvoor in aanmerking komende bestuursorganen opdragen de noodzakelijke
      medewerking te verlenen om door hem aangewezen personen tijdelijk van een aan te nemen identiteit te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '44.2'
    text: |-
      De voor de bestuursorganen geldende wettelijke voorschriften ter zake van de verlangde werkzaamheden blijven, voor
      zover deze in de weg staan aan het verrichten van die werkzaamheden, buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel44
  - number: '45.1'
    text: |-
      Voor zover zij niet bij koninklijk besluit worden benoemd, geschorst en ontslagen, worden de ambtenaren van
      politie, met uitzondering van de ambtenaren van de rijksrecherche, aangesteld, geschorst en ontslagen door de
      korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel45
  - number: '45.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke andere ambtenaren van politie dan die, bedoeld in de
      [artikelen 28, eerste en derde lid][ref1], en [38, tweede lid][ref2], worden benoemd, geschorst en ontslagen bij
      koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel38
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '38'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '46.1'
    text: |-
      De aanwijzing van het hoofd van een territoriaal onderdeel van een regionale eenheid, bedoeld in
      [artikel 13][ref1], geschiedt na verkregen instemming van de burgemeester en de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '46.2'
    text: |-
      Indien het hoofd van een territoriaal onderdeel, bedoeld in het eerste lid, bij herhaling de afspraken over de
      inzet van de politie, bedoeld in [artikel 13, tweede lid][ref1], niet heeft uitgevoerd zonder dat daarvoor, naar
      het oordeel van de burgemeester of de officier van justitie, goede redenen zijn, kan de burgemeester of de officier
      van justitie Onze Minister verzoeken het hoofd van het territoriale onderdeel uit zijn functie te ontheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '47.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de politie regels gesteld over de onderwerpen, genoemd
      in [artikel 125, eerste lid][ref1], en [artikel 125quinquies, eerste lid, van de Ambtenarenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125quinquies
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
      - id: ref2
        bwb_id: BWBR0001947
        artikel: 125quinquies
  - number: '47.2'
    text: |-
      Voor de toepassing van de [Wet veiligheidsonderzoeken][ref1] bij de politie wordt Onze Minister aangemerkt als Onze
      Minister, bedoeld in [artikel 1, onder c, van de Wet veiligheidsonderzoeken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '47.3'
    text: |-
      De ambtenaar van politie die te goeder trouw de bij hem levende vermoedens van misstanden meldt volgens de op grond
      van het eerste lid vast te stellen regels voor het omgaan met bij een ambtenaar levende vermoedens van misstanden
      binnen de organisatie waar hij werkzaam is, zal als gevolg van het melden van die vermoedens geen nadelige gevolgen
      voor zijn rechtspositie ondervinden tijdens en na het volgen van die procedure.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
  - number: '47.4'
    text: 'Het tot aanstelling bevoegd gezag van ambtenaren van politie:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
  - number: 47.4.a
    text: |-
      voert een integriteitsbeleid dat is gericht op het bevorderen van goed ambtelijk handelen en dat in ieder geval
      aandacht besteedt aan het bevorderen van integriteitsbewustzijn en aan het voorkomen van misbruik van bevoegdheden,
      belangenverstrengeling en discriminatie;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
  - number: 47.4.b
    text: |-
      zorgt ervoor dat het integriteitsbeleid een vast onderdeel uitmaakt van het personeelsbeleid in ieder geval door
      integriteit in functioneringsgesprekken en werkoverleg aan de orde te stellen en door het aanbieden van scholing en
      vorming op het gebied van integriteit;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
  - number: 47.4.c
    text: draagt zorg voor de totstandkoming van een gedragscode voor goed ambtelijk handelen;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
  - number: 47.4.d
    text: |-
      stelt in overeenstemming met Onze Minister vast op welke wijze jaarlijks verantwoording wordt afgelegd over het
      gevoerde integriteitsbeleid en over de naleving van de gedragscode.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel47
  - number: '48'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de rangen van de politie en tekens van bijzondere
      verdiensten.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel48
  - number: '49.1'
    text: |-
      Er is een rijksrecherche. De rijksrecherche heeft tot taak het doen van onderzoek in opdracht van het College van
      procureurs-generaal, naar feiten of gedragingen die mogelijk een strafbaar feit opleveren.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel49
  - number: '49.2'
    text: |-
      Het College van procureurs-generaal kan de rijksrecherche belasten met een onderzoek als bedoeld in het eerste lid
      indien inzet van de rijksrecherche is aangewezen:
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel49
  - number: 49.2.a
    text: |-
      om iedere schijn van partijdigheid te vermijden bij een onderzoek naar feiten of gedragingen die de integriteit
      van de overheid kunnen aantasten en zijn begaan door natuurlijke personen of rechtspersonen belast met een publieke
      taak, of betrokken bij de uitvoering daarvan, of
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel49
  - number: 49.2.b
    text: |-
      omwille van de bijzondere deskundigheid van de rijksrecherche in door het College van procureurs-generaal aan te
      wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel49
  - number: '49.3'
    text: |-
      Het College van procureurs-generaal stelt Onze Minister in kennis van een aanwijzing als bedoeld in het tweede lid,
      onder b.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel49
  - number: '50'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 3][ref1], [9][ref2] en [12][ref3] is van overeenkomstige toepassing
      op de rijksrecherche. Bij ministeriële regeling kunnen regels omtrent de vereisten voor een goede taakuitvoering
      door de politie, gesteld krachtens [artikel 21][ref4], van overeenkomstige toepassing worden verklaard op de
      rijksrecherche.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel21
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '21'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '51'
    text: Het beheer van de rijksrecherche berust bij het College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel51
  - number: '52'
    text: |-
      Het College van procureurs-generaal stelt ten minste eenmaal in de vier jaar een beleidsplan en jaarlijks een
      begroting, een financieel verslag en een jaarverslag met betrekking tot de rijksrecherche vast. Deze behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel52
  - number: '53.1'
    text: |-
      De ambtenaren van de rijksrecherche worden aangesteld, geschorst en ontslagen door het College van procureurs-
      generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel53
  - number: '53.2'
    text: |-
      Het bepaalde krachtens [artikel 45, tweede lid][ref1], is van overeenkomstige toepassing op de ambtenaren van de
      rijksrecherche.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel45
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '45'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '53.3'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 47, eerste en tweede lid][ref1], en [48][ref2] is van overeenkomstige
      toepassing op de rijksrecherche.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel48
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '47'
        hoofdstuk: '3'
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '48'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '53.4'
    text: |-
      Voor de toepassing van de [Wet veiligheidsonderzoeken][ref1] bij de rijksrecherche wordt Onze Minister aangemerkt
      als Onze Minister, bedoeld in [artikel 1, onder c, van de Wet veiligheidsonderzoeken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '54'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel54
  - number: 54.a
    text: |-
      de doeleinden waarvoor de rijksrecherche, met inachtneming van het bepaalde bij of krachtens de
      [Wet politiegegevens][ref1], gegevens verwerkt of verder verwerkt en de categorieën van gegevens die de
      rijksrecherche daartoe verwerkt, alsmede over de terbeschikkingstelling van gegevens ten behoeve van de uitvoering
      van de politietaak en de verstrekking van gegevens aan personen en instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 54.b
    text: |-
      de wijze waarop de rijksrecherche gegevens verwerkt, daaronder begrepen de schrijfwijze en classificatie van
      gegevens, alsmede de wijze van vermelding van de herkomst van de gegevens.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel54
  - number: '55'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven over de samenwerking van de rijksrecherche met de politie.
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Defensie kunnen regels worden gegeven over
      de samenwerking van de rijksrecherche met de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel55
  - number: '56.1'
    text: |-
      Behoeft een eenheid bijstand van andere eenheden voor de handhaving van de openbare orde, dan richt de burgemeester
      een verzoek daartoe aan de korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel56
  - number: '56.2'
    text: |-
      Behoeft een eenheid bijstand van andere eenheden voor de strafrechtelijke handhaving van de rechtsorde, dan wel
      voor het verrichten van taken ten dienste van de justitie, dan richt de officier van justitie een verzoek daartoe
      aan de korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel56
  - number: '56.3'
    text: |-
      Behoudens in spoedeisende gevallen wordt het verzoek, bedoeld in het eerste en tweede lid, niet gedaan dan nadat de
      regioburgemeester in de gelegenheid is gesteld zijn zienswijze over het verzoek te geven.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel56
  - number: '56.4'
    text: |-
      Indien het in het eerste of tweede lid bedoelde verzoek geheel of gedeeltelijk wordt afgewezen, kan de burgemeester
      onderscheidenlijk de officier van justitie Onze Minister verzoeken de korpschef op te dragen alsnog in de gevraagde
      bijstand te voorzien.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel56
  - number: '56.5'
    text: |-
      Behoeft een landelijke eenheid bijstand van andere eenheden bij de uitoefening van de taak, bedoeld in
      [artikel 42, eerste lid, onder c][ref1], dan verstrekt Onze Minister aan de korpschef de nodige opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '57.1'
    text: De Koninklijke marechaussee kan bijstand verlenen aan de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel57
  - number: '57.2'
    text: Onze Minister bepaalt, na overleg met Onze Minister van Defensie, of bijstand wordt verleend.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel57
  - number: '57.3'
    text: |-
      Indien bijstand moet worden verleend, bepaalt Onze Minister in overeenstemming met Onze Minister van Defensie op
      welke wijze de bijstand wordt verleend.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel57
  - number: '58.1'
    text: In bijzondere gevallen kan bijstand worden verleend door andere delen van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel58
  - number: '58.2'
    text: |-
      Onze Minister bepaalt, in overeenstemming met Onze Minister van Defensie, op welke wijze de bijstand zal worden
      verleend. Daarbij worden tevens nadere regels of beleidsregels gegeven over de uitoefening van bevoegdheden
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel58
  - number: '59.1'
    text: |-
      Er zijn een of meer bijzondere bijstandseenheden bestaande uit personeel van de politie, de Koninklijke
      marechaussee of andere delen van de krijgsmacht. Deze bijzondere bijstandseenheden worden belast met bij regeling
      van Onze Minister en Onze Minister van Defensie aangewezen bijzondere onderdelen van de politietaak.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel59
  - number: '59.2'
    text: |-
      Behoeft de politie, de rijksrecherche of de Koninklijke marechaussee bijstand van een bijzondere bijstandseenheid
      als bedoeld in het eerste lid, dan richt de officier van justitie, door tussenkomst van het College van procureurs-
      generaal, een verzoek daartoe aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel59
  - number: '59.3'
    text: |-
      Indien bijstand door een bijzondere bijstandseenheid als bedoeld in het eerste lid nodig is, bepaalt Onze Minister
      of en op welke wijze die bijzondere bijstandseenheid wordt ingezet. Onze Minister stelt Onze Minister van Defensie
      onverwijld in kennis van de inzet.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel59
  - number: '59.4'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Defensie kunnen nadere regels worden gesteld omtrent de
      uitvoering van het tweede en derde lid, alsmede de organisatie van de bijzondere bijstandseenheden.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel59
  - number: '59.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister en Onze Minister van Defensie
      kunnen regels worden gesteld over de bewapening, de uitrusting en de bekwaamheid van het personeel van de
      bijzondere bijstandseenheden.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel59
  - number: '60'
    text: |-
      Behoeft de rijksrecherche bijstand van de politie, dan verstrekt het College van procureurs-generaal op aanvraag
      van de officier van justitie aan de korpschef de nodige opdrachten en stelt het Onze Minister daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel60
  - number: '61'
    text: |-
      De politie kan bijstand verlenen aan de Koninklijke marechaussee, met inachtneming van de
      [artikelen 62 tot en met 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel62
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '62'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '62'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van de politie voor de handhaving van de openbare orde, dan richt
      Onze Minister van Defensie op aanvraag van de burgemeester een verzoek daartoe aan Onze Minister. Onze Minister
      verstrekt aan de korpschef de nodige opdrachten en stelt Onze Minister van Defensie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel62
  - number: '63'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van de politie voor de strafrechtelijke handhaving van de rechtsorde,
      dan wel voor het verrichten van taken ten dienste van de justitie, dan richt Onze Minister van Defensie op
      aanvraag van de officier van justitie een verzoek daartoe aan het College van procureurs-generaal. Het College van
      procureurs-generaal verstrekt door tussenkomst van de korpschef aan de betrokken politiechefs de nodige opdrachten
      en stelt Onze Minister en Onze Minster van Defensie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel63
  - number: '64.1'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van de politie bij de uitoefening van de taken die zij op grond van
      [artikel 4, derde lid][ref1], verricht onder verantwoordelijkheid van Onze Minister, dan verstrekt Onze Minister,
      in overeenstemming met Onze Minister van Defensie en na overleg met het College van procureurs-generaal, door
      tussenkomst van de korpschef aan de betrokken politiechefs van een regionale eenheid de nodige opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '64.2'
    text: |-
      [Artikel 4, derde lid][ref1], is van overeenkomstige toepassing ten aanzien van de politiechef, voor zover die
      eenheid bijstand verleent aan de Koninklijke marechaussee als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '65.1'
    text: |-
      De Inspectie Openbare Orde en Veiligheid, bedoeld in [artikel 57 van de Wet veiligheidsregio’s][ref1], is met het
      oog op een goede taakuitvoering door de politie belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '57'
  - number: 65.1.a
    text: |-
      het, onverminderd het gezag van de burgemeester en de officier van justitie, houden van toezicht op de
      taakuitvoering;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel65
  - number: 65.1.b
    text: het houden van toezicht op de kwaliteitszorg door de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel65
  - number: 65.1.c
    text: het houden van toezicht op de kwaliteit van de politieopleidingen en de examinering;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel65
  - number: 65.1.d
    text: |-
      het verrichten van onderzoek, indien daar in bijzondere gevallen reden toe is, naar ingrijpende
      gebeurtenissen waarbij de politie betrokken is, tenzij de Onderzoeksraad voor veiligheid, bedoeld in
      [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], naar het desbetreffende voorval een onderzoek
      instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '2'
  - number: '65.2'
    text: De inspectie voert haar werkzaamheden uit onder gezag van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel65
  - number: '65.3'
    text: |-
      De korpschef verleent de inspectie de door deze verlangde ondersteuning bij de uitvoering van de werkzaamheden in
      het kader van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel65
  - number: '66.1'
    text: |-
      De werkzaamheden die in het kader van [artikel 65, eerste lid, onder a tot en met d][ref1], worden uitgevoerd,
      worden jaarlijks door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel65
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '65'
        hoofdstuk: '6'
  - number: '66.2'
    text: De inspectie rapporteert, gevraagd of ongevraagd, rechtstreeks aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel66
  - number: '66.3'
    text: |-
      Onze Minister zendt de Staten-Generaal jaarlijks een door de inspectie opgesteld verslag van de werkzaamheden die
      in het kader van [artikel 65, eerste lid][ref1], worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel65
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '65'
        hoofdstuk: '6'
  - number: '67'
    text: |-
      Met het toezicht bedoeld in [artikel 65, eerste lid][ref1], zijn belast de bij besluit van Onze Minister aangewezen
      ambtenaren van de inspectie. Van het besluit wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel65
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '65'
        hoofdstuk: '6'
  - number: 67a.1
    text: |-
      Met de behandeling van en advisering over klachten zijn belast een of meer commissies, bestaande uit onafhankelijke
      leden.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel67a
  - number: 67a.2
    text: |-
      Het eerste lid is niet van toepassing indien na behandeling door Onze Minister, Onze Minister van Defensie, het
      College van procureurs-generaal, de korpschef of de politiechef naar tevredenheid van de klager aan diens klacht
      tegemoet is gekomen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel67a
  - number: '68.1'
    text: |-
      Onze Minister stelt nadere regels vast over de behandeling van klachten over gedragingen van ambtenaren van
      politie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel68
  - number: '68.2'
    text: 'In de regels, bedoeld in het eerste lid, wordt voorzien in:'
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel68
  - number: 68.2.a
    text: |-
      de instelling van een of meer commissies, bestaande uit onafhankelijke leden, die op de wijze in de regeling te
      bepalen zijn belast met de behandeling van en advisering over klachten waarbij zo nodig aandacht wordt geschonken
      aan de in onderdeel c genoemde aspecten;
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel68
  - number: 68.2.b
    text: |-
      de registratie van de mondeling en schriftelijk ingediende klachten en, indien beschikbaar, de daarop genomen
      beslissingen, en
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel68
  - number: 68.2.c
    text: |-
      een jaarlijkse publicatie van de geregistreerde klachten en beslissingen, waarin wordt aangegeven in hoeverre
      bepaalde klachten wijzen op structurele tekortkomingen in het functioneren van de politie en waarin, zo nodig,
      aandacht wordt geschonken aan de middelen om deze tekortkomingen op te heffen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel68
  - number: '68.3'
    text: |-
      [Afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de behandeling van klachten
      als bedoeld in het tweede lid, onder a. Indien een commissie over de klacht zal adviseren, deelt degene die
      ingevolge [artikel 70][ref2] verantwoordelijk is voor de behandeling van een klacht dit, in afwijking van
      [artikel 9:15, eerste lid, van de Algemene wet bestuursrecht][ref3], zo spoedig mogelijk aan de indiener van de
      klacht mede.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '70'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
  - number: '69.1'
    text: |-
      Onze Minister van Defensie stelt de regels, bedoeld in [artikel 68, eerste lid][ref1], vast ten aanzien van
      klachten over gedragingen van militairen van de Koninklijke marechaussee dan wel van enig ander onderdeel van de
      krijgsmacht, bij de uitvoering van hun in deze wet omschreven taken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: '69.2'
    text: |-
      [Artikel 68, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: '70.1'
    text: |-
      De korpschef draagt zorg voor de behandeling van de klacht die is ingediend over een gedraging van een ambtenaar
      van politie die is tewerkgesteld bij een ondersteunende dienst.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel70
  - number: '70.2'
    text: |-
      De politiechef van de regionale of landelijke eenheid draagt zorg voor de behandeling van de klacht die is
      ingediend over een gedraging van een ambtenaar van politie die bij die eenheid is tewerkgesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel70
  - number: '70.3'
    text: De korpschef draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van de politiechef.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel70
  - number: '70.4'
    text: |-
      Het College van procureurs-generaal draagt zorg voor de behandeling van een klacht die is ingediend over een
      gedraging van een ambtenaar van de rijksrecherche.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel70
  - number: '70.5'
    text: |-
      Onze Minister draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van de korpschef
      en de krachtens [artikel 28, derde lid][ref1], aangewezen leden van de leiding van de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '70.6'
    text: |-
      Onze Minister van Defensie draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van
      een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel van de krijgsmacht, bij de uitvoering
      van zijn in deze wet omschreven taken.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel70
  - number: '71.1'
    text: |-
      Een klacht over een gedraging van een ambtenaar van politie wordt ingediend bij de politiechef van de eenheid waar
      deze ambtenaar is aangesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel71
  - number: '71.2'
    text: |-
      Een klacht als bedoeld in [artikel 70, eerste of derde lid][ref1], wordt ingediend bij de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel70
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '70'
        hoofdstuk: '7'
  - number: '71.3'
    text: |-
      Een klacht over een gedraging van een ambtenaar van de rijksrecherche wordt ingediend bij het College van
      procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel71
  - number: '71.4'
    text: |-
      Een klacht over een gedraging van de korpschef en de krachtens [artikel 28, derde lid][ref1], aangewezen leden van
      de leiding van de politie wordt ingediend bij Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '71.5'
    text: |-
      Een klacht over een gedraging van een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel
      van de krijgsmacht, bij de uitvoering van zijn in deze wet omschreven taken, wordt ingediend bij Onze Minister
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel71
  - number: '71.6'
    text: |-
      Tenzij reeds naar tevredenheid van de klager aan diens klacht tegemoet is gekomen, wordt van de klacht, onverwijld
      na de ontvangst ervan, afschrift gezonden aan de burgemeester van de gemeente waar de gedraging waarover wordt
      geklaagd heeft plaatsgevonden, alsmede aan de hoofdofficier van justitie van het arrondissement waarin de gemeente
      is gelegen waar de gedraging waarover wordt geklaagd, heeft plaatsgevonden. De burgemeester en de hoofdofficier van
      justitie worden in de gelegenheid gesteld over de klacht advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel71
  - number: '72'
    text: |-
      In afwijking van [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt de klacht afgehandeld
      binnen tien weken of, indien een commissie als bedoeld in [artikel 68, tweede lid, onder a][ref2], is belast met de
      behandeling van en advisering over de klacht, binnen veertien weken na de ontvangst van het klaagschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: '73'
    text: |-
      De [Politiewet 1993][ref1] wordt ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0006299
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0006299
  - number: '74.1'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel74
  - number: '74.2'
    text: |-
      In afwijking van het eerste lid zendt Onze Minister binnen drie jaar na inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in
      de praktijk in de regionale eenheid in de arrondissementen, bedoeld in de [artikelen 5a][ref1] en
      [11 van de Wet op de rechterlijke indeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002080#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002080#Artikel11
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0002080
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0002080
        artikel: '11'
  - number: '75'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel75
  - number: '76'
    text: |-
      Deze wet wordt aangehaald als: Politiewet, met vermelding van het jaartal van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#Artikel76
