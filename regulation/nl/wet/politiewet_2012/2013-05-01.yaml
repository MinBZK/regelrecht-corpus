preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling te treffen voor de organisatie en
    het beheer van de politie en daartoe de Politiewet 1993 te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031788/2013-05-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder: - *Onze Minister:* Onze Minister van
      Veiligheid en Justitie;
        - *politie:* het landelijke politiekorps, bedoeld in [artikel 25, eerste lid][ref1];
        - *korpschef:* de korpschef, bedoeld in [artikel 27][ref2];
        - *eenheid:* een regionale of landelijke eenheid;
        - *regionale eenheid:* een regionale eenheid van de politie als bedoeld in [artikel 25, eerste lid, onder a][ref3];
        - *landelijke eenheid:* een landelijke eenheid van de politie als bedoeld in
      [artikel 25, eerste lid, onder b][ref4];
        - *regioburgemeester:* de regioburgemeester, bedoeld in [artikel 38c][ref5];
        - *politiechef:* het hoofd van een regionale of landelijke eenheid;
        - taken ten dienste van de justitie: 1°. de uitvoering van wettelijke voorschriften waarmee Onze Minister is belast
      alsmede de uitvoering van wettelijke voorschriften gesteld bij of krachtens de [Vreemdelingenwet 2000][ref6]; 2°.
      de administratiefrechtelijke afdoening van inbreuken op wettelijke voorschriften, voor zover in die voorschriften
      het toezicht op de uitvoering van de politietaak is opgedragen aan het openbaar ministerie; 3°. de betekening van
      gerechtelijke mededelingen in strafzaken, het vervoer van rechtens van hun vrijheid beroofde personen, en de dienst
      bij de gerechten;
        - *wijkagent:* ambtenaar van politie die, gerelateerd aan het aantal inwoners, als onderdeel van een basisteam ten
      behoeve van een gemeente beschikbaar is voor de uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0031788#Artikel38c
      [ref6]: https://wetten.overheid.nl/BWBR0011823
