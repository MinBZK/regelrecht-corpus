  - number: '1.2'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt onder strafrechtelijke handhaving van de rechtsorde mede
      verstaan: het waken over de veiligheid van personen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel1
  - number: '2'
    text: 'Ambtenaren van politie in de zin van deze wet zijn:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel2
  - number: 2.a
    text: ambtenaren die zijn aangesteld voor de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel2
  - number: 2.b
    text: |-
      ambtenaren die zijn aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste van
      de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel2
  - number: 2.c
    text: |-
      vrijwillige ambtenaren die zijn aangesteld voor de uitvoering van de politietaak, onderscheidenlijk voor de
      uitvoering van technische, administratieve en andere taken ten dienste van de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel2
  - number: 2.d
    text: |-
      ambtenaren van de rijksrecherche die zijn aangesteld voor de uitvoering van de politietaak, onderscheidenlijk voor
      de uitvoering van technische, administratieve en andere taken ten dienste van de rijksrecherche.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel2
  - number: 2a.1
    text: |-
      De personen die met inachtneming van [artikel 96, eerste lid][ref1], werkzaam zijn ten
      behoeve van de Politieacademie, worden gelijkgesteld met ambtenaren van politie als bedoeld in
      [artikel 2, onder a, b, of c][ref2], voor zover zij direct daaraan voorafgaand ambtenaren van politie als
      bedoeld in artikel 2, onder a, b onderscheidenlijk c, waren. De eerste volzin is van overeenkomstige toepassing
      op de personen die met inachtneming van [artikel 83, eerste lid][ref3], werkzaam zijn ten behoeve van de
      politieonderwijsraad.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel96
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel83
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '96'
        hoofdstuk: '8'
        paragraaf: '5'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '2'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '83'
        hoofdstuk: '8'
        paragraaf: '2'
  - number: 2a.2
    text: |-
      In afwijking van [artikel 16 van de Kaderwet zelfstandige bestuursorganen][ref1] zijn de [artikelen 11][ref2]
      en [12][ref3] op de personen, bedoeld in het eerste lid, die zijn aangesteld voor de uitvoering van de
      politietaak, van toepassing, voor zover zij optreden ter handhaving van de openbare orde of ter uitvoering van de
      hulpverleningstaak onderscheidenlijk ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten
      dienste van de justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel12
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '3'
    text: |-
      De politie heeft tot taak in ondergeschiktheid aan het bevoegd gezag en in overeenstemming met de geldende
      rechtsregels te zorgen voor de daadwerkelijke handhaving van de rechtsorde en het verlenen van hulp aan hen die
      deze behoeven.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel3
  - number: '4.1'
    text: |-
      Aan de Koninklijke marechaussee, die onder het beheer van Onze Minister van Defensie staat, zijn, onverminderd het
      bepaalde bij of krachtens andere wetten, de volgende politietaken opgedragen:
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.1.a
    text: |-
      het waken over de veiligheid van de leden van het koninklijk huis, in samenwerking met andere daartoe aangewezen
      organen;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.1.b
    text: |-
      de uitvoering van de politietaak ten behoeve van Nederlandse en andere strijdkrachten, alsmede internationale
      militaire hoofdkwartieren, en ten aanzien van tot die strijdkrachten en hoofdkwartieren behorende personen;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.1.c
    text: |-
      de uitvoering van de politietaak op de luchthaven Schiphol en op de andere door Onze Minister en Onze Minister van
      Defensie aangewezen luchtvaartterreinen, alsmede de beveiliging van de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.1.d
    text: |-
      de verlening van bijstand alsmede de samenwerking met de politie krachtens deze wet, daaronder begrepen de
      assistentieverlening aan de politie bij de bestrijding van grensoverschrijdende criminaliteit;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.1.e
    text: |-
      de uitvoering van de politietaak op plaatsen onder beheer van Onze Minister van Defensie, op verboden plaatsen die
      krachtens de [Wet bescherming staatsgeheimen][ref1] ten behoeve van de landsverdediging zijn aangewezen, alsmede op
      het terrein van de ambtswoning van Onze Minister-President;


      [ref1]: https://wetten.overheid.nl/BWBR0002074
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002074
  - number: 4.1.f
    text: |-
      de uitvoering van de bij of krachtens de [Vreemdelingenwet 2000][ref1] opgedragen taken, waaronder begrepen de
      bediening van de daartoe door Onze Minister voor Immigratie en Asiel aangewezen doorlaatposten en het, voor zover
      in dat verband noodzakelijk, uitvoeren van de politietaak op en nabij deze doorlaatposten, alsmede het verlenen van
      medewerking bij de aanhouding of voorgeleiding van een verdachte of veroordeelde;


      [ref1]: https://wetten.overheid.nl/BWBR0011823
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0011823
  - number: 4.1.g
    text: de bestrijding van mensensmokkel en van fraude met reis- en identiteitsdocumenten;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.1.h
    text: |-
      het in opdracht van Onze Minister en Onze Minister van Defensie ten behoeve van De Nederlandsche Bank N.V.
      verrichten van beveiligingswerkzaamheden.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: '4.2'
    text: |-
      Onder personen die behoren tot de andere strijdkrachten en internationale hoofdkwartieren, bedoeld in het eerste
      lid, onder b, worden mede begrepen de personen, aangewezen bij algemene maatregel van bestuur op voordracht van
      Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: '4.3'
    text: |-
      Onze Minister kan de commandant van de Koninklijke marechaussee algemene en bijzondere aanwijzingen geven, voor
      zover het betreft:
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.3.a
    text: de uitoefening van de taken, bedoeld in het eerste lid, onder a en h;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.3.b
    text: het waken over de veiligheid van door Onze Minister aangewezen personen als bedoeld in het eerste lid, onder b;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.3.c
    text: |-
      de uitoefening van de taak, bedoeld in het eerste lid, onder c, ten behoeve van de strafrechtelijke handhaving van
      de rechtsorde en de beveiliging van de burgerluchtvaart;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: 4.3.d
    text: de bewaking en beveiliging van de ambtswoning van Onze Minister-President, bedoeld in het eerste lid, onder e.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
  - number: '4.4'
    text: |-
      Hoewel bevoegd tot de opsporing van alle strafbare feiten, onthoudt de militair van de Koninklijke marechaussee die
      is aangewezen krachtens [artikel 141 van het Wetboek van Strafvordering][ref1], zich van optreden anders dan in het
      kader van de uitvoering van zijn politietaken, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
  - number: '5'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Defensie kunnen regels worden gegeven over
      de samenwerking van de politie met de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel5
  - number: '6.1'
    text: De ambtenaar van politie is bevoegd zijn taak uit te oefenen in het gehele land.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel6
  - number: '6.2'
    text: |-
      Hoewel bevoegd in het gehele land, onthoudt de ambtenaar van politie die is tewerkgesteld bij een regionale
      eenheid, zich van optreden buiten zijn gebied van tewerkstelling, tenzij zijn optreden redelijkerwijs noodzakelijk
      is, dan wel ingevolge regels, gesteld bij of krachtens de wet, dan wel in opdracht of met toestemming van het
      bevoegd gezag over de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel6
  - number: '7.1'
    text: |-
      De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak, is bevoegd in de rechtmatige
      uitoefening van zijn bediening geweld of vrijheidsbeperkende middelen te gebruiken, wanneer het daarmee beoogde
      doel dit, mede gelet op de aan het gebruik hiervan verbonden gevaren, rechtvaardigt en dat doel niet op een andere
      wijze kan worden bereikt. Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
  - number: '7.2'
    text: |-
      De ambtenaar van politie, bedoeld in het eerste lid, heeft toegang tot elke plaats, voor zover dat voor het
      verlenen van hulp aan hen die deze behoeven, redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
  - number: '7.3'
    text: |-
      De ambtenaar van politie, bedoeld in het eerste lid, is bevoegd tot het onderzoek aan de kleding van personen en
      het onderzoek van de voorwerpen die personen bij zich dragen of met zich mee voeren bij de uitoefening van een
      hem wettelijk toegekende bevoegdheid of bij een handeling ter uitvoering van de politietaak, indien uit feiten of
      omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor hun leven of veiligheid of die van de ambtenaar zelf
      of van derden, en dit onderzoek noodzakelijk is ter afwending van dit gevaar.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
  - number: '7.4'
    text: |-
      De ambtenaar van politie, bedoeld in het eerste lid, is bevoegd een te vervoeren of in te sluiten persoon aan zijn
      kleding te onderzoeken op de aanwezigheid van voorwerpen die een gevaar voor de veiligheid van betrokkene of voor
      anderen kunnen vormen, alsmede daartoe de voorwerpen te onderzoeken die betrokkene bij zich draagt of met zich
      mee voert.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
  - number: '7.5'
    text: |-
      Het hoofd van het territoriale onderdeel, bedoeld in [artikel 13, eerste lid][ref1], zijn plaatsvervanger of de
      ambtenaar van politie, belast met de leiding over de zorg voor ingeslotenen, kan bepalen dat een in te sluiten of
      ingesloten persoon bij binnenkomst of bij het verlaten van een politiecel of een politiecellencomplex, voorafgaand
      aan of na afloop van bezoek, dan wel indien dit anderszins noodzakelijk is in het belang van de handhaving
      van de orde of de veiligheid in het politiebureau of het cellencomplex, aan zijn lichaam wordt onderzocht.
      [Artikel 29, tweede, derde en vierde lid, van de Penitentiaire beginselenwet][ref2] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0009709#Artikel29
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0009709
        artikel: '29'
  - number: '7.6'
    text: |-
      De officier van justitie kan bepalen dat een in te sluiten of ingesloten persoon in het lichaam wordt
      onderzocht, indien dit noodzakelijk is ter afwending van ernstig gevaar voor de handhaving van de orde
      of de veiligheid in het politiebureau of het cellencomplex dan wel voor de gezondheid van de ingeslotene.
      Het onderzoek in het lichaam wordt verricht door een arts of, in diens opdracht, door een verpleegkundige.
      [Artikel 31, derde lid, van de Penitentiaire beginselenwet][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0009709#Artikel31
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0009709
        artikel: '31'
  - number: '7.7'
    text: |-
      De uitoefening van de bevoegdheden, bedoeld in het eerste tot en met zesde lid, dient in verhouding tot het beoogde
      doel redelijk en gematigd te zijn.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
  - number: '7.8'
    text: |-
      Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de militair van de Koninklijke
      marechaussee, indien hij optreedt in de rechtmatige uitoefening van zijn bediening, en op de militair van enig
      ander onderdeel van de krijgsmacht die op grond van deze wet bijstand verleent aan de politie. Het vijfde en zesde
      lid zijn van overeenkomstige toepassing indien een persoon wordt of is ingesloten door de Koninklijke marechaussee,
      met dien verstande dat de beslissing, bedoeld in het vijfde lid, eerste volzin, wordt genomen door de commandant
      van de betrokken brigade, zijn plaatsvervanger of de militair van de Koninklijke marechaussee, belast met de zorg
      voor ingeslotenen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
  - number: '7.9'
    text: |-
      Onze Minister kan bepalen dat de in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1] bedoelde
      buitengewone opsporingsambtenaren, voor zover door hem hetzij in persoon, hetzij per categorie of eenheid
      aangewezen, de bevoegdheden omschreven in het eerste, derde en vierde lid kunnen uitoefenen. Alsdan wordt met
      overeenkomstige toepassing van [artikel 9][ref2] een ambtsinstructie voor hen vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel9
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '8.1'
    text: |-
      Een ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak, is bevoegd tot het vorderen
      van inzage van een identiteitsbewijs als bedoeld in [artikel 1 van de Wet op de identificatieplicht][ref1] van
      personen, voor zover dat redelijkerwijs noodzakelijk is voor de uitvoering van de politietaak.


      [ref1]: https://wetten.overheid.nl/BWBR0006297#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0006297
        artikel: '1'
  - number: '8.2'
    text: |-
      Gelijke bevoegdheid komt toe aan een buitengewoon opsporingsambtenaar als bedoeld in
      [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1], voor zover dat redelijkerwijs noodzakelijk is
      voor de uitoefening van zijn taak.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '8.3'
    text: |-
      Gelijke bevoegdheid komt toe aan de militair van de Koninklijke marechaussee, voor zover dat redelijkerwijs
      noodzakelijk is voor de uitvoering van zijn politietaak, bedoeld in artikel 4, eerste lid, en aan de militair
      van de Koninklijke marechaussee of van enig ander onderdeel van de krijgsmacht die op grond van deze wet bijstand
      verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel8
  - number: '9.1'
    text: |-
      Bij algemene maatregel van bestuur wordt een ambtsinstructie voor de politie en voor de Koninklijke marechaussee
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel9
  - number: '9.2'
    text: |-
      Indien de militair van enig ander onderdeel van de krijgsmacht op grond van deze wet bijstand verleent aan de
      politie is de ambtsinstructie van toepassing.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel9
  - number: '9.3'
    text: |-
      In de ambtsinstructie worden regels gesteld ter uitvoering van de [artikelen 6][ref1] en [7][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '9.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent maatregelen waaraan rechtens
      van hun vrijheid beroofde personen met het oog op hun insluiting kunnen worden onderworpen, voor zover dit
      noodzakelijk is in het belang van hun veiligheid of de veiligheid van anderen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel9
  - number: '9.5'
    text: |-
      Het vierde lid is van overeenkomstige toepassing op personen die ten behoeve van de hulpverlening aan hen zijn
      ondergebracht bij de politie of de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel9
  - number: '9.6'
    text: |-
      De ambtenaren die door Onze Minister zijn aangewezen voor het vervoer van rechtens van hun vrijheid beroofde
      personen, kunnen de bevoegdheden, bedoeld in [artikel 7, eerste, derde en vierde lid][ref1], uitoefenen, dan wel de
      maatregelen, bedoeld in het vierde lid, treffen, voor zover dit noodzakelijk is om te voorkomen dat de te vervoeren
      persoon zich onttrekt aan het op hem uitgeoefende toezicht. De eerste volzin is van toepassing voor zover de
      rechtens van hun vrijheid beroofde personen zijn ondergebracht bij de politie of de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '7'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '9.7'
    text: |-
      De voordracht voor de algemene maatregel van bestuur, bedoeld in het eerste en het vierde lid, geschiedt door Onze
      Minister in overeenstemming met Onze Minister van Defensie voor zover het de Koninklijke marechaussee betreft.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel9
  - number: '10.1'
    text: |-
      Alle ambtenaren die zijn belast met een politietaak, verlenen elkaar wederkerig de nodige hulp en betrachten bij
      voortduring een eendrachtige samenwerking bij het uitvoeren van die taak. Zij verlenen elkaar zoveel mogelijk de
      gevraagde medewerking.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel10
  - number: '10.2'
    text: |-
      Zij die op grond van de [artikelen 141, onderdeel d][ref1], en [142 van het Wetboek van Strafvordering][ref2] tot
      opsporing van strafbare feiten bevoegd zijn, werken samen met de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '141'
      - id: ref2
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '10.3'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gegeven over de samenwerking van de politie met de
      buitengewone opsporingsambtenaren, bedoeld in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel142
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '142'
  - number: '11.1'
    text: |-
      Indien de politie in een gemeente optreedt ter handhaving van de openbare orde en ter uitvoering van de
      hulpverleningstaak, staat zij onder gezag van de burgemeester.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel11
  - number: '11.2'
    text: |-
      De burgemeester kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling van de in
      het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel11
  - number: '12.1'
    text: |-
      Indien de politie optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten dienste
      van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier van justitie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel12
  - number: '12.2'
    text: |-
      De officier van justitie kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling
      van de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel12
  - number: '13.1'
    text: |-
      De burgemeester en de officier van justitie overleggen regelmatig tezamen met het hoofd van het territoriale
      onderdeel van de regionale eenheid binnen welker grondgebied de gemeente geheel of ten dele valt, en zo nodig met
      de politiechef van een regionale eenheid, over de taakuitvoering van de politie en over het beleid ten aanzien van
      de taakuitvoering (driehoeksoverleg).
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel13
  - number: '13.2'
    text: |-
      In het driehoeksoverleg worden door de burgemeester en de officier van justitie afspraken gemaakt over de inzet van
      de politie ten behoeve van de handhaving van de openbare orde en de hulpverlening, onderscheidenlijk ten behoeve
      van de strafrechtelijke handhaving van de rechtsorde en de taken ten dienste van de justitie. De afspraken worden
      mede gemaakt op basis van de doelen, bedoeld in [artikel 38b, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel38b
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: 38b
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '13.3'
    text: Op verzoek van de burgemeester vindt het driehoeksoverleg plaats op gemeentelijk niveau.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel13
  - number: '13.4'
    text: |-
      In het driehoeksoverleg worden door de burgemeester en de officier van justitie afspraken gemaakt over lokale
      prioriteiten en criminaliteitsbestrijding.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel13
  - number: '14.1'
    text: |-
      Voor zover de Koninklijke marechaussee in een gemeente optreedt ter handhaving van de openbare orde, staat zij
      onder gezag van de burgemeester. [Artikel 11, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14.2'
    text: |-
      Voor zover de Koninklijke marechaussee optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken
      verricht ten dienste van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier
      van justitie. [Artikel 12, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel12
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14.3'
    text: |-
      Indien de Koninklijke marechaussee optreedt als bedoeld in het eerste of tweede lid, neemt de commandant van de
      Koninklijke marechaussee deel aan het overleg, bedoeld in [artikel 13][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '14.4'
    text: |-
      Het eerste en tweede lid zijn van overeenkomstige toepassing op de militair van enig ander onderdeel van de
      krijgsmacht, indien hij bijstand verleent aan de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel14
  - number: '15.1'
    text: |-
      De burgemeester is aan de gemeenteraad verantwoording schuldig over het door hem uitgeoefende gezag, bedoeld in de
      [artikelen 11, eerste lid][ref1], en [14, eerste en vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '14'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '15.2'
    text: |-
      [Artikel 180, tweede en derde lid, van de Gemeentewet][ref1] is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005416#Artikel180
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0005416
        artikel: '180'
  - number: '15.3'
    text: |-
      Onze Minister kan de burgemeesters en, in geval van een situatie als bedoeld in
      [artikel 39 van de Wet veiligheidsregio’s][ref1], de voorzitter van een veiligheidsregio, zoveel mogelijk na
      overleg met hen, algemene en bijzondere aanwijzingen geven met betrekking tot de handhaving van de openbare orde,
      voorzover dat noodzakelijk is in het belang van de veiligheid van de Staat of de betrekkingen van Nederland met
      andere mogendheden, dan wel met het oog op zwaarwegende belangen van de samenleving. De aanwijzingen worden zo
      enigszins mogelijk schriftelijk gegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '39'
  - number: '16.1'
    text: |-
      Onze Minister kan objecten en diensten aanwijzen waarvan bewaking of beveiliging door de politie noodzakelijk is in
      het belang van de veiligheid van de Staat of de betrekkingen van Nederland met andere mogendheden, dan wel met het
      oog op zwaarwegende belangen van de samenleving.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel16
  - number: '16.2'
    text: |-
      De burgemeester draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voor zover dat
      geschiedt ter handhaving van de openbare orde.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel16
  - number: '16.3'
    text: |-
      De officier van justitie draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voor zover
      dat geschiedt ter strafrechtelijke handhaving van de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel16
  - number: '17.1'
    text: |-
      Ten behoeve van de toepassing van de [artikelen 15, derde lid][ref1], en [16, tweede lid][ref2], verstrekken de
      burgemeesters en Onze Minister elkaar de gewenste inlichtingen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel16
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '16'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '17.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel17
  - number: '18.1'
    text: |-
      Onze Minister stelt, gehoord het College van procureurs-generaal en de regioburgemeesters, ten minste eenmaal in de
      vier jaar de landelijke beleidsdoelstellingen vast ten aanzien van de taakuitvoering van de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel18
  - number: '18.2'
    text: |-
      Indien daarvoor bijzondere redenen zijn, kunnen de landelijke beleidsdoelstellingen tussentijds worden gewijzigd of
      aangevuld, gehoord het College van procureurs-generaal en de regioburgemeesters.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel18
  - number: '18.3'
    text: |-
      Zodra de landelijke beleidsdoelstellingen zijn vastgesteld, gewijzigd of aangevuld, zendt Onze Minister deze aan de
      Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel18
  - number: '19.1'
    text: |-
      Onze Minister voert, in aanwezigheid van de korpschef, ten minste viermaal per jaar overleg met de
      regioburgemeesters of een afvaardiging van de regioburgemeesters en de voorzitter van het College van procureurs-
      generaal over de taakuitvoering door en het beheer ten aanzien van de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
  - number: '19.2'
    text: |-
      Onze Minister wijst voor een periode van vier jaren twee burgemeesters aan die aan het overleg deelnemen. Zij zijn
      burgemeester van een gemeente met minder dan 100 000 inwoners. Zij kunnen niet tevens regioburgemeester zijn. Voor
      de aanwijzing wordt een aanbeveling gedaan door een door Onze Minister aangewezen orgaan.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
  - number: '19.3'
    text: 'In het overleg wordt in elk geval gesproken over:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
  - number: 19.3.a
    text: de inrichting van de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
  - number: 19.3.b
    text: |-
      de landelijke beleidsdoelstellingen, bedoeld in [artikel 18, eerste lid][ref1], en de doelstellingen, bedoeld in
      [artikel 20, eerste lid][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel20
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '18'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '20'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: 19.3.c
    text: |-
      de verdeling van sterkte, bedoeld in [artikel 36][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel36
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 19.3.d
    text: |-
      het ontwerp van de begroting en het ontwerp van de meerjarenraming, bedoeld in [artikel 34][ref1], het ontwerp
      van de jaarrekening, bedoeld in [artikel 35][ref2], het ontwerp van het beheersplan en het jaarverslag, bedoeld in
      [artikel 37, eerste lid][ref3];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel37
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '34'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '35'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '37'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 19.3.e
    text: |-
      de benoeming van de leden van de leiding van de politie, bedoeld in [artikel 28, derde lid][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: 19.3.f
    text: |-
      voorstellen van wet, ontwerpen van algemene maatregel van bestuur en ontwerpen van ministeriële regeling die geheel
      of voor een belangrijk deel betrekking hebben op de taakuitvoering door en het beheer ten aanzien van de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel19
  - number: '20.1'
    text: |-
      Onze Minister stelt, gehoord het College van procureurs-generaal en de regioburgemeesters, met inachtneming
      van de omstandigheden van de betrokken eenheid, ten minste eenmaal in de vier jaar voor iedere regionale en
      landelijke eenheid de doelstellingen vast ter verwezenlijking van de landelijke beleidsdoelstellingen, bedoeld in
      [artikel 18, eerste lid][ref1]. Alvorens een regioburgemeester de gezamenlijke zienswijze van de burgemeesters van
      de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert geeft, hoort hij deze burgemeesters
      over de doelen die de gemeenten op het terrein van de veiligheid nastreven.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel18
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel20
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '18'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '20.2'
    text: |-
      Indien daarvoor bijzondere redenen zijn, kunnen de doelstellingen voor een regionale of landelijke eenheid
      tussentijds worden gewijzigd of aangevuld.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel20
  - number: '21.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vereisten voor een goede
      taakuitvoering door de politie en de eisen die worden gesteld aan de bekwaamheid van de ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel21
  - number: '21.2'
    text: |-
      Voor zover de regels, bedoeld in het eerste lid, mede van toepassing zijn op de uitvoering van de politietaken door
      de Koninklijke marechaussee, geschiedt de voordracht voor de algemene maatregel van bestuur door Onze Minister in
      overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de bewapening, de uitrusting en de
      kleding van de ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel22
  - number: '23.1'
    text: 'Bij ministeriële regeling kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel23
  - number: 23.1.a
    text: |-
      de informatie- en communicatievoorzieningen van de politie en het gebruik daarvan door de politie en door andere
      organisaties die een taak hebben op het terrein van justitie, openbare orde, veiligheid of hulpverlening, en
      waarmee de politie ter uitvoering van de politietaak informatie- en communicatievoorzieningen deelt;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel23
  - number: 23.1.b
    text: de informatiebeveiliging door de politie en door andere organisaties als bedoeld in onderdeel a.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel23
  - number: '23.2'
    text: |-
      Voor zover de regels, bedoeld in het eerste lid, van belang zijn voor de uitvoering van de politietaken, bedoeld in
      [artikel 4][ref1], kunnen zij, in overeenstemming met Onze Minister van Defensie, mede worden gesteld ten aanzien
      van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '23.3'
    text: |-
      Onze Minister kan de regionale en landelijke eenheden frequenties toewijzen voor de overdracht van gegevens door
      middel van de daartoe geëigende aangewezen informatie- en communicatievoorzieningen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel23
  - number: '24'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel24
  - number: 24.a
    text: |-
      de doeleinden waarvoor de politie, met inachtneming van het bepaalde bij of krachtens de
      [Wet politiegegevens][ref1], gegevens verwerkt of verder verwerkt en de categorieën van gegevens die de politie
      daartoe verwerkt, alsmede over de terbeschikkingstelling van gegevens ten behoeve van de uitvoering van de
      politietaak en de verstrekking van gegevens aan personen en instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 24.b
    text: |-
      de wijze waarop de politie gegevens verwerkt, daaronder begrepen de schrijfwijze en classificatie van gegevens,
      alsmede de wijze van vermelding van de herkomst van de gegevens.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel24
  - number: '25.1'
    text: 'Er is een landelijk politiekorps dat bestaat uit de volgende onderdelen:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel25
  - number: 25.1.a
    text: regionale eenheden, belast met de uitvoering van de politietaak;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel25
  - number: 25.1.b
    text: |-
      een of meer bij algemene maatregel van bestuur aan te wijzen landelijke eenheden, belast met de uitvoering van
      de politietaak;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel25
  - number: 25.1.c
    text: een of meer bij algemene maatregel van bestuur aan te wijzen ondersteunende diensten.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel25
  - number: '25.2'
    text: |-
      Er is een regionale eenheid in elk van de arrondissementen, genoemd in de [Wet op de rechterlijke indeling][ref1],
      met dien verstande dat er één regionale eenheid in de arrondissementen Gelderland en Overijssel gezamenlijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0002080
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0002080
  - number: '25.3'
    text: |-
      Bij ministeriële regeling kan een gebied waarin een regionale eenheid de politietaak uitvoert worden opgedeeld in
      meerdere gebieden waarin een regionale eenheid de politietaak uitvoert.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel25
  - number: '25.4'
    text: |-
      Een regionale eenheid kan in territoriale onderdelen worden verdeeld. Een territoriaal
      onderdeel kan slechts gelegen zijn in één regio, genoemd in de [bijlage](onbekend), bedoeld in
      [artikel 8 van de Wet veiligheidsregio’s][ref1], tenzij Onze Minister, op een gezamenlijk verzoek van de
      betrokken burgemeesters en officieren van justitie, besluit dat een territoriaal onderdeel in meerdere regio’s
      gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel8
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel25
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '8'
  - number: '26'
    text: De politie heeft rechtspersoonlijkheid en is gevestigd in een door Onze Minister aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel26
  - number: '27.1'
    text: |-
      De korpschef is belast met de leiding en het beheer van de politie. De korpschef legt over de uitoefening van zijn
      taken en bevoegdheden verantwoording af aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel27
  - number: '27.2'
    text: De korpschef vertegenwoordigt de politie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel27
  - number: '28.1'
    text: |-
      De korpschef wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de benoeming worden de
      regioburgemeesters en het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen. De
      korpschef wordt benoemd voor een periode van zes jaren en kan telkens worden herbenoemd voor een periode van drie
      jaren.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel28
  - number: '28.2'
    text: |-
      De korpschef is een ambtenaar van politie als bedoeld in [artikel 2, onder a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
        hoofdstuk: '1'
  - number: '28.3'
    text: |-
      Bij ministeriële regeling worden ambtenaren van politie aangewezen die deel uitmaken van de leiding van de politie.
      Zij worden bij koninklijk besluit benoemd, geschorst en ontslagen. Over de benoeming worden de regioburgemeesters
      en het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen. Onze Minister wijst uit het
      midden van de leiding van de politie een plaatsvervangend korpschef aan.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel28
  - number: '29.1'
    text: 'De volgende handelingen van de korpschef behoeven de instemming van Onze Minister:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
  - number: 29.1.a
    text: het sluiten van overeenkomsten die een door Onze Minister vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
  - number: 29.1.b
    text: het doen van investeringen die een door Onze Minister vast te stellen bedrag te boven gaan;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
  - number: 29.1.c
    text: het oprichten of mede oprichten van rechtspersonen dan wel het deelnemen daarin.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
  - number: '29.2'
    text: |-
      De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel10
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '10'
  - number: '29.3'
    text: 'Het is de korpschef verboden:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
  - number: 29.3.a
    text: leningen aan te gaan anders dan bij Onze Minister van Financiën;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
  - number: 29.3.b
    text: |-
      overeenkomsten aan te gaan waarbij hij zich verbindt tot zekerheidstelling met inbegrip van zekerheidstelling voor
      schulden van derden of waarbij hij zich als borg of hoofdelijk medeschuldenaar verbindt of zich voor een derde
      sterk maakt.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel29
  - number: '30.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het beheer van de politie. De voordracht
      voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken
      nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel30
  - number: '30.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister in overeenstemming met Onze
      Minister van Financiën, worden regels gesteld over het financieel beheer van de politie. De voordracht voor een
      krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel30
  - number: '31'
    text: |-
      Onze Minister kan de korpschef algemene en bijzondere aanwijzingen geven met betrekking tot de uitoefening van
      diens taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel31
  - number: '32.1'
    text: |-
      De korpschef verstrekt aan Onze Minister, gevraagd en ongevraagd, tijdig de inlichtingen die Onze Minister nodig
      heeft voor de uitoefening van zijn taak.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel32
  - number: '32.2'
    text: |-
      Onze Minister kan inzage vorderen van gegevens en bescheiden, voor zover dat voor de uitoefening van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel32
  - number: '33'
    text: |-
      Onze Minister stelt jaarlijks ten laste van de begroting van zijn ministerie bijdragen ter beschikking aan de
      politie, mede met het oog op het feitelijk ter beschikking stellen van de sterkte aan de politieonderwijsraad en de
      sterkte en middelen aan de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel33
  - number: '34'
    text: |-
      Onze Minister stelt jaarlijks een begroting vast voor de politie voor het komende begrotingsjaar alsmede een
      meerjarenraming voor vier op het begrotingsjaar volgende jaren.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel34
  - number: '35'
    text: |-
      Onze Minister stelt jaarlijks een jaarrekening vast van de politie, die vergezeld gaat van een verklaring
      omtrent de getrouwheid en de rechtmatigheid van de besteding, afgegeven door een accountant als bedoeld in
      [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36.1'
    text: |-
      Onze Minister verdeelt de sterkte en middelen over de onderdelen van de politie, bedoeld in
      [artikel 25, eerste lid][ref1]. Hij bepaalt daarbij welk deel van de sterkte op grond van
      [artikel 83, eerste lid][ref2], feitelijk ter beschikking wordt gesteld aan de politieonderwijsraad en welk deel
      van de sterkte en middelen op grond van [artikel 96, eerste lid][ref3], feitelijk ter beschikking wordt gesteld aan
      de Politieacademie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel96
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '83'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '96'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: '36.2'
    text: Bij of krachtens algemene maatregel van bestuur worden regels gesteld over deze verdeling.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel36
  - number: '36.3'
    text: |-
      De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel36
  - number: '37.1'
    text: Onze Minister stelt jaarlijks een beheersplan en een jaarverslag vast voor de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel37
  - number: '37.2'
    text: |-
      Het beheersplan bevat in ieder geval de indeling van de eenheden als bedoeld in
      [artikel 25, eerste lid, onder a][ref1], in districten en basisteams.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '25'
        hoofdstuk: '3'
        paragraaf: 3.2.1
        afdeling: '3.2'
  - number: '37.3'
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid zijn politietaak uitvoert en de
      hoofdofficier van justitie worden door de korpschef gehoord over de indeling van de regionale eenheid en de omvang
      van de onderdelen ervan.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel37
  - number: '37.4'
    text: |-
      Het jaarverslag omvat een omschrijving van de door de regionale en landelijke eenheden gerealiseerde activiteiten
      ter verwezenlijking van de landelijke beleidsdoelstellingen, bedoeld in [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel18
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel37
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '18'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '38.1'
    text: De dagelijkse leiding van een regionale eenheid berust bij de politiechef.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38
  - number: '38.2'
    text: |-
      De politiechef van een regionale eenheid wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de
      benoeming worden de regioburgemeester en de hoofdofficier van justitie in de gelegenheid gesteld advies uit te
      brengen. Alvorens het advies wordt uitgebracht, hoort de regioburgemeester de burgemeesters van de gemeenten in het
      gebied waarin de regionale eenheid de politietaak uitvoert.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38
  - number: 38a.1
    text: Er is ten minste één wijkagent werkzaam per 5 000 inwoners.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38a
  - number: 38a.2
    text: Bij algemene maatregel van bestuur worden nadere regels gegeven.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38a
  - number: 38b.1
    text: |-
      De gemeenteraad stelt ten minste eenmaal in de vier jaar de doelen vast die de gemeente op het terrein van de
      veiligheid nastreeft door de handhaving van de openbare orde en de hulpverlening door de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38b
  - number: 38b.2
    text: |-
      Voorafgaand aan de vaststelling van het beleidsplan, bedoeld in [artikel 39, eerste lid][ref1], hoort de
      burgemeester van een gemeente in het gebied waarin de regionale eenheid de politietaak uitvoert, de gemeenteraad
      van die gemeente over het ontwerpbeleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 38c.1
    text: |-
      Onze Minister wijst voor elk gebied waarin een regionale eenheid de politietaak uitvoert voor een periode van vier
      jaren een regioburgemeester aan. De burgemeesters van de gemeenten in dat gebied worden in de gelegenheid gesteld
      een gezamenlijke aanbeveling voor de aanwijzing te doen. Onze Minister volgt bij de aanwijzing in beginsel de
      aanbeveling, tenzij zwaarwegende gronden aanleiding tot afwijking geven. Onze Minister motiveert een afwijking.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38c
  - number: 38c.2
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert, kunnen Onze
      Minister gezamenlijk verzoeken de regioburgemeester van zijn functie te ontheffen. De derde en vierde volzin van
      het eerste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38c
  - number: 38d
    text: |-
      De regioburgemeester legt over de uitoefening van zijn taken op grond van deze wet en zijn bevoegdheid op grond
      van [artikel 39, tweede lid][ref1], verantwoording af aan de overige burgemeesters van de gemeenten in het gebied
      waarin de regionale eenheid de politietaak uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '39.1'
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert en de
      hoofdofficier van justitie stellen ten minste eenmaal in de vier jaar, met inachtneming van de doelstellingen,
      bedoeld in [artikel 20, eerste lid][ref1], het beleidsplan en jaarlijks het jaarverslag voor de regionale eenheid
      vast. Het beleidsplan omvat in ieder geval de verdeling van de beschikbare politiesterkte waaronder de beschikbare
      wijkagenten, bedoeld in [artikel 38a, eerste lid][ref2], over de onderdelen van de regionale eenheid, rekening
      houdend met het belang van een goede vervulling van de politietaak in alle betrokken gemeenten en de doelen,
      bedoeld in [artikel 38b, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel38b
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel39
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '20'
        hoofdstuk: '3'
        afdeling: '3.1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: 38a
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: 38b
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '39.2'
    text: |-
      Indien het beleidsplan of het jaarverslag niet overeenkomstig de eerste volzin van het eerste lid kunnen worden
      vastgesteld, stelt de regioburgemeester in overeenstemming met de hoofdofficier van justitie het beleidsplan
      respectievelijk het jaarverslag vast.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel39
  - number: '39.3'
    text: |-
      Indien de regioburgemeester en de hoofdofficier van justitie niet met elkaar tot overeenstemming kunnen komen over
      de in het tweede lid bedoelde stukken, legt de regioburgemeester dit verschil van zienswijze schriftelijk voor aan
      Onze Minister die alsdan beslist. De regioburgemeester brengt de stukken in overeenstemming met de beslissing van
      Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel39
  - number: '39.4'
    text: De regioburgemeester zendt het beleidsplan en het jaarverslag aan Onze Minister en de korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel39
  - number: '39.5'
    text: |-
      Tegen het besluit tot vaststelling van het beleidsplan, bedoeld in het tweede lid, kan de burgemeester van een
      gemeente in het gebied waarin de regionale eenheid de politietaak uitvoert beroep instellen bij Onze Minister. Deze
      beoordeelt of het beleidsplan op onaanvaardbare wijze afbreuk doet aan het belang van een goede vervulling van de
      politietaak in de betreffende gemeente.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel39
  - number: '39.6'
    text: |-
      De regioburgemeester brengt het beleidsplan in overeenstemming met het besluit van Onze Minister zonder dat
      hiervoor de instemming van de burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de
      politietaak uitvoert en de hoofdofficier van justitie noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel39
  - number: '40.1'
    text: |-
      Onze Minister kan ten aanzien van het beleidsplan, bedoeld in [artikel 39, eerste lid][ref1], de nodige
      aanwijzingen geven aan de regioburgemeester, indien naar het oordeel van Onze Minister het beleidsplan niet
      of onvoldoende verzekert dat de doelstellingen, bedoeld in [artikel 20, eerste lid][ref2], kunnen worden
      verwezenlijkt.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel20
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '20'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '40.2'
    text: De aanwijzingen, bedoeld in het eerste lid, worden schriftelijk gegeven, gehoord de regioburgemeester.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel40
  - number: '40.3'
    text: |-
      De regioburgemeester brengt, voor zover nodig, het beleidsplan, bedoeld in [artikel 39, eerste lid][ref1], in
      overeenstemming met de aanwijzingen, zonder dat hiervoor de instemming van de burgemeesters in het gebied waarin de
      regionale eenheid de politietaak uitvoert en de hoofdofficier van justitie noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel40
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '41'
    text: |-
      De regioburgemeester en de hoofdofficier van justitie overleggen regelmatig met de politiechef van een regionale
      eenheid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel41
  - number: 41a
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert en waarvan de
      grenzen van de gemeenten samenvallen met de indeling van de regio’s, genoemd in de [bijlage bij artikel 8 van de
      Wet Veiligheidsregio’s](onbekend), en de hoofdofficier van justitie kunnen ten minste eenmaal per jaar over het
      beleid en de taakuitvoering van de politie overleg voeren.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel41a
  - number: '42.1'
    text: 'Er zijn een of meer landelijke eenheden. Zij zijn belast met een of meer van de volgende taken:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel42
  - number: 42.1.a
    text: |-
      de landelijke en specialistische uitvoering van politietaken, in samenwerking met de regionale eenheden, de
      Koninklijke marechaussee en de in [artikel 10, tweede lid][ref1], bedoelde personen;


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel10
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: 42.1.b
    text: |-
      het verzamelen, registreren, bewerken, beheren, analyseren en verstrekken van informatie en het verrichten van
      andere ondersteunende werkzaamheden ten behoeve van de taakuitvoering van de onder a genoemde organen en personen,
      en de andere bij de strafrechtelijke handhaving van de rechtsorde betrokken organen, alsmede de internationale
      uitwisseling van informatie en de landelijke voorlichting aan particulieren;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel42
  - number: 42.1.c
    text: het waken over de veiligheid van leden van het koninklijk huis en andere door Onze Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel42
  - number: '42.2'
    text: Bij ministeriële regeling kunnen regels worden gesteld over de werkzaamheden, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel42
  - number: '42.3'
    text: De dagelijkse leiding van een landelijke eenheid berust bij de politiechef.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel42
  - number: '42.4'
    text: |-
      De politiechef van een landelijke eenheid wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de
      benoeming wordt het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel42
  - number: '43.1'
    text: |-
      Onze Minister kan de betrokken ambtenaren van politie voor zover het de uitoefening van de taken, bedoeld in
      [artikel 42, eerste lid, onder a en b][ref1], door het daartoe bestemde onderdeel of de daartoe bestemde onderdelen
      van een landelijke eenheid betreft, de nodige algemene en bijzondere aanwijzingen geven voor de vervulling van die
      taken, voor zover de politie optreedt bij of krachtens de wet of op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie onder verantwoordelijkheid van Onze Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '43.2'
    text: |-
      De bevoegdheid, bedoeld in het eerste lid, komt eveneens toe aan Onze Minister met betrekking tot de vervulling van
      de taak, bedoeld in [artikel 42, eerste lid, onder c][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '43.3'
    text: |-
      Indien een regionale eenheid of de Koninklijke marechaussee bijstand verleent aan een landelijke eenheid ten
      behoeve van de uitvoering van de taak, bedoeld in [artikel 42, eerste lid, onder c][ref1], kan Onze Minister aan
      de betrokken ambtenaren van politie, onderscheidenlijk de commandant van de Koninklijke marechaussee, de nodige
      algemene en bijzondere aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '44.1'
    text: |-
      Onze Minister kan, indien hij dit nodig acht in verband met de uitvoering van de taken, bedoeld in
      [artikel 42, eerste lid][ref1], daarvoor in aanmerking komende bestuursorganen opdragen de noodzakelijke
      medewerking te verlenen om door hem aangewezen personen tijdelijk van een aan te nemen identiteit te voorzien.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '44.2'
    text: |-
      De voor de bestuursorganen geldende wettelijke voorschriften ter zake van de verlangde werkzaamheden blijven, voor
      zover deze in de weg staan aan het verrichten van die werkzaamheden, buiten toepassing.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel44
  - number: '45.1'
    text: |-
      Voor zover zij niet bij koninklijk besluit worden benoemd, geschorst en ontslagen, worden de ambtenaren van
      politie, met uitzondering van de ambtenaren van de rijksrecherche, aangesteld, geschorst en ontslagen door de
      korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel45
  - number: '45.2'
    text: |-
      Bij algemene maatregel van bestuur kan worden bepaald welke andere ambtenaren van politie dan die, bedoeld in
      de [artikelen 28, eerste en derde lid][ref1], [38, tweede lid][ref2], en [42, vierde lid][ref3], worden benoemd,
      geschorst en ontslagen bij koninklijk besluit.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel38
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel45
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '38'
        hoofdstuk: '3'
        afdeling: '3.3'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '46.1'
    text: |-
      De aanwijzing van het hoofd van een territoriaal onderdeel van een regionale eenheid, bedoeld in
      [artikel 13][ref1], geschiedt na verkregen instemming van de burgemeester en de officier van justitie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '46.2'
    text: |-
      Indien het hoofd van een territoriaal onderdeel, bedoeld in het eerste lid, bij herhaling de afspraken over de
      inzet van de politie, bedoeld in [artikel 13, tweede lid][ref1], niet heeft uitgevoerd zonder dat daarvoor, naar
      het oordeel van de burgemeester of de officier van justitie, goede redenen zijn, kan de burgemeester of de officier
      van justitie Onze Minister verzoeken het hoofd van het territoriale onderdeel uit zijn functie te ontheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel46
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '13'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '47.1'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden voor de politie regels gesteld over de onderwerpen, genoemd
      in [artikel 125, eerste lid][ref1], en [artikel 125quinquies, eerste lid, van de Ambtenarenwet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0001947#Artikel125
      [ref2]: https://wetten.overheid.nl/BWBR0001947#Artikel125quinquies
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0001947
        artikel: '125'
      - id: ref2
        bwb_id: BWBR0001947
        artikel: 125quinquies
  - number: '47.2'
    text: |-
      Voor de toepassing van de [Wet veiligheidsonderzoeken][ref1] bij de politie wordt Onze Minister aangemerkt als Onze
      Minister, bedoeld in [artikel 1, onder c, van de Wet veiligheidsonderzoeken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '47.3'
    text: |-
      De ambtenaar die te goeder trouw en naar behoren een vermoeden van een misstand als bedoeld in
      [artikel 1, onderdeel d, van de Wet Huis voor klokkenluiders][ref1] meldt, zal als gevolg daarvan geen nadelige
      gevolgen voor zijn rechtspositie ondervinden tijdens en na de behandeling van deze melding bij het bevoegd gezag of
      de daartoe bevoegde instantie.


      [ref1]: https://wetten.overheid.nl/BWBR0037852#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0037852
        artikel: '1'
  - number: '47.4'
    text: 'Het tot aanstelling bevoegd gezag van ambtenaren van politie:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
  - number: 47.4.a
    text: |-
      voert een integriteitsbeleid dat is gericht op het bevorderen van goed ambtelijk handelen en dat in ieder geval
      aandacht besteedt aan het bevorderen van integriteitsbewustzijn en aan het voorkomen van misbruik van bevoegdheden,
      belangenverstrengeling en discriminatie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
  - number: 47.4.b
    text: |-
      zorgt ervoor dat het integriteitsbeleid een vast onderdeel uitmaakt van het personeelsbeleid in ieder geval door
      integriteit in functioneringsgesprekken en werkoverleg aan de orde te stellen en door het aanbieden van scholing en
      vorming op het gebied van integriteit;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
  - number: 47.4.c
    text: draagt zorg voor de totstandkoming van een gedragscode voor goed ambtelijk handelen;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
  - number: 47.4.d
    text: |-
      stelt in overeenstemming met Onze Minister vast op welke wijze jaarlijks verantwoording wordt afgelegd over het
      gevoerde integriteitsbeleid en over de naleving van de gedragscode.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel47
  - number: '48'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de rangen van de politie en tekens van bijzondere
      verdiensten.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel48
  - number: '49.1'
    text: |-
      Er is een rijksrecherche. De rijksrecherche heeft tot taak het doen van onderzoek in opdracht van het College van
      procureurs-generaal, naar feiten of gedragingen die mogelijk een strafbaar feit opleveren.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel49
  - number: '49.2'
    text: |-
      Het College van procureurs-generaal kan de rijksrecherche belasten met een onderzoek als bedoeld in het eerste lid
      indien inzet van de rijksrecherche is aangewezen:
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel49
  - number: 49.2.a
    text: |-
      om iedere schijn van partijdigheid te vermijden bij een onderzoek naar feiten of gedragingen die de integriteit
      van de overheid kunnen aantasten en zijn begaan door natuurlijke personen of rechtspersonen belast met een publieke
      taak, of betrokken bij de uitvoering daarvan, of
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel49
  - number: 49.2.b
    text: |-
      omwille van de bijzondere deskundigheid van de rijksrecherche in door het College van procureurs-generaal aan te
      wijzen gevallen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel49
  - number: '49.3'
    text: |-
      Het College van procureurs-generaal stelt Onze Minister in kennis van een aanwijzing als bedoeld in het tweede lid,
      onder b.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel49
  - number: '50'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 3][ref1], [9][ref2] en [12][ref3] is van overeenkomstige toepassing
      op de rijksrecherche. Bij ministeriële regeling kunnen regels omtrent de vereisten voor een goede taakuitvoering
      door de politie, gesteld krachtens [artikel 21][ref4], van overeenkomstige toepassing worden verklaard op de
      rijksrecherche.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel9
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel21
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '3'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2.2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '12'
        hoofdstuk: '2'
        paragraaf: '2.3'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '21'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '51'
    text: Het beheer van de rijksrecherche berust bij het College van procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel51
  - number: '52'
    text: |-
      Het College van procureurs-generaal stelt ten minste eenmaal in de vier jaar een beleidsplan en jaarlijks een
      begroting, een financieel verslag en een jaarverslag met betrekking tot de rijksrecherche vast. Deze behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel52
  - number: '53.1'
    text: |-
      De ambtenaren van de rijksrecherche worden aangesteld, geschorst en ontslagen door het College van procureurs-
      generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel53
  - number: '53.2'
    text: |-
      Het bepaalde krachtens [artikel 45, tweede lid][ref1], is van overeenkomstige toepassing op de ambtenaren van de
      rijksrecherche.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel45
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '45'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '53.3'
    text: |-
      Het bepaalde bij of krachtens de [artikelen 47, eerste en tweede lid][ref1], en [48][ref2] is van overeenkomstige
      toepassing op de rijksrecherche.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel48
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '47'
        hoofdstuk: '3'
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '48'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '53.4'
    text: |-
      Voor de toepassing van de [Wet veiligheidsonderzoeken][ref1] bij de rijksrecherche wordt Onze Minister aangemerkt
      als Onze Minister, bedoeld in [artikel 1, onder c, van de Wet veiligheidsonderzoeken][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0008277
      [ref2]: https://wetten.overheid.nl/BWBR0008277#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0008277
      - id: ref2
        bwb_id: BWBR0008277
        artikel: '1'
  - number: '54'
    text: 'Bij algemene maatregel van bestuur kunnen regels worden gesteld over:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel54
  - number: 54.a
    text: |-
      de doeleinden waarvoor de rijksrecherche, met inachtneming van het bepaalde bij of krachtens de
      [Wet politiegegevens][ref1], gegevens verwerkt of verder verwerkt en de categorieën van gegevens die de
      rijksrecherche daartoe verwerkt, alsmede over de terbeschikkingstelling van gegevens ten behoeve van de uitvoering
      van de politietaak en de verstrekking van gegevens aan personen en instanties;


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: 54.b
    text: |-
      de wijze waarop de rijksrecherche gegevens verwerkt, daaronder begrepen de schrijfwijze en classificatie van
      gegevens, alsmede de wijze van vermelding van de herkomst van de gegevens.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel54
  - number: '55'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven over de samenwerking van de rijksrecherche met de politie.
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Defensie kunnen regels worden gegeven over
      de samenwerking van de rijksrecherche met de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel55
  - number: '56.1'
    text: |-
      Behoeft een eenheid bijstand van andere eenheden voor de handhaving van de openbare orde, dan richt de burgemeester
      een verzoek daartoe aan de korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel56
  - number: '56.2'
    text: |-
      Behoeft een eenheid bijstand van andere eenheden voor de strafrechtelijke handhaving van de rechtsorde, dan wel
      voor het verrichten van taken ten dienste van de justitie, dan richt de officier van justitie een verzoek daartoe
      aan de korpschef.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel56
  - number: '56.3'
    text: |-
      Behoudens in spoedeisende gevallen wordt het verzoek, bedoeld in het eerste en tweede lid, niet gedaan dan nadat de
      regioburgemeester in de gelegenheid is gesteld zijn zienswijze over het verzoek te geven.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel56
  - number: '56.4'
    text: |-
      Indien het in het eerste of tweede lid bedoelde verzoek geheel of gedeeltelijk wordt afgewezen, kan de burgemeester
      onderscheidenlijk de officier van justitie Onze Minister verzoeken de korpschef op te dragen alsnog in de gevraagde
      bijstand te voorzien.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel56
  - number: '56.5'
    text: |-
      Behoeft een landelijke eenheid bijstand van andere eenheden bij de uitoefening van de taak, bedoeld in
      [artikel 42, eerste lid, onder c][ref1], dan verstrekt Onze Minister aan de korpschef de nodige opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '42'
        hoofdstuk: '3'
        afdeling: '3.4'
  - number: '56.6'
    text: |-
      Indien Onze Minister zijn bevoegdheid, bedoeld in [artikel 15, derde lid][ref1], uitoefent, verstrekt hij aan de
      korpschef de nodige opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel15
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '15'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '57.1'
    text: De Koninklijke marechaussee kan bijstand verlenen aan de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel57
  - number: '57.2'
    text: Onze Minister bepaalt, na overleg met Onze Minister van Defensie, of bijstand wordt verleend.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel57
  - number: '57.3'
    text: |-
      Indien bijstand moet worden verleend, bepaalt Onze Minister in overeenstemming met Onze Minister van Defensie op
      welke wijze de bijstand wordt verleend.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel57
  - number: '58.1'
    text: In bijzondere gevallen kan bijstand worden verleend door andere delen van de krijgsmacht.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel58
  - number: '58.2'
    text: |-
      Onze Minister bepaalt, in overeenstemming met Onze Minister van Defensie, op welke wijze de bijstand zal worden
      verleend. Daarbij worden tevens nadere regels of beleidsregels gegeven over de uitoefening van bevoegdheden
      krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel58
  - number: '59.1'
    text: |-
      Er zijn een of meer bijzondere bijstandseenheden bestaande uit personeel van de politie, de Koninklijke
      marechaussee of andere delen van de krijgsmacht. Deze bijzondere bijstandseenheden worden belast met bij regeling
      van Onze Minister en Onze Minister van Defensie aangewezen bijzondere onderdelen van de politietaak.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel59
  - number: '59.2'
    text: |-
      Behoeft de politie, de rijksrecherche of de Koninklijke marechaussee bijstand van een bijzondere bijstandseenheid
      als bedoeld in het eerste lid, dan richt de officier van justitie, door tussenkomst van het College van procureurs-
      generaal, een verzoek daartoe aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel59
  - number: '59.3'
    text: |-
      Indien bijstand door een bijzondere bijstandseenheid als bedoeld in het eerste lid nodig is, bepaalt Onze Minister
      of en op welke wijze die bijzondere bijstandseenheid wordt ingezet. Onze Minister stelt Onze Minister van Defensie
      onverwijld in kennis van de inzet.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel59
  - number: '59.4'
    text: |-
      Bij regeling van Onze Minister en Onze Minister van Defensie kunnen nadere regels worden gesteld omtrent de
      uitvoering van het tweede en derde lid, alsmede de organisatie van de bijzondere bijstandseenheden.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel59
  - number: '59.5'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister en Onze Minister van Defensie
      kunnen regels worden gesteld over de bewapening, de uitrusting en de bekwaamheid van het personeel van de
      bijzondere bijstandseenheden.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel59
  - number: '60'
    text: |-
      Behoeft de rijksrecherche bijstand van de politie, dan verstrekt het College van procureurs-generaal op aanvraag
      van de officier van justitie aan de korpschef de nodige opdrachten en stelt het Onze Minister daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel60
  - number: '61'
    text: |-
      De politie kan bijstand verlenen aan de Koninklijke marechaussee, met inachtneming van de
      [artikelen 62 tot en met 64][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel62
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '62'
        hoofdstuk: '5'
        paragraaf: '5.3'
  - number: '62'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van de politie voor de handhaving van de openbare orde, dan richt
      Onze Minister van Defensie op aanvraag van de burgemeester een verzoek daartoe aan Onze Minister. Onze Minister
      verstrekt aan de korpschef de nodige opdrachten en stelt Onze Minister van Defensie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel62
  - number: '63'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van de politie voor de strafrechtelijke handhaving van de rechtsorde,
      dan wel voor het verrichten van taken ten dienste van de justitie, dan richt Onze Minister van Defensie op
      aanvraag van de officier van justitie een verzoek daartoe aan het College van procureurs-generaal. Het College van
      procureurs-generaal verstrekt door tussenkomst van de korpschef aan de betrokken politiechefs de nodige opdrachten
      en stelt Onze Minister en Onze Minister van Defensie daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel63
  - number: '64.1'
    text: |-
      Behoeft de Koninklijke marechaussee bijstand van de politie bij de uitoefening van de taken die zij op grond van
      [artikel 4, derde lid][ref1], verricht onder verantwoordelijkheid van Onze Minister, dan verstrekt Onze Minister,
      in overeenstemming met Onze Minister van Defensie en na overleg met het College van procureurs-generaal, door
      tussenkomst van de korpschef aan de betrokken politiechefs van een regionale eenheid de nodige opdrachten.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '64.2'
    text: |-
      [Artikel 4, derde lid][ref1], is van overeenkomstige toepassing ten aanzien van de politiechef, voor zover die
      eenheid bijstand verleent aan de Koninklijke marechaussee als bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel64
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '4'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '65.1'
    text: |-
      De Inspectie Openbare Orde en Veiligheid, bedoeld in [artikel 57 van de Wet veiligheidsregio’s][ref1], is met het
      oog op een goede taakuitvoering door de politie en de Politieacademie belast met:


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0027466
        artikel: '57'
  - number: 65.1.a
    text: |-
      het, onverminderd het gezag van de burgemeester en de officier van justitie, houden van toezicht op de
      taakuitvoering;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel65
  - number: 65.1.b
    text: het houden van toezicht op de kwaliteitszorg door de politie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel65
  - number: 65.1.c
    text: het houden van toezicht op de kwaliteit van het politieonderwijs en de examinering;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel65
  - number: 65.1.d
    text: |-
      het verrichten van onderzoek, indien daar in bijzondere gevallen reden toe is, naar ingrijpende
      gebeurtenissen waarbij de politie betrokken is, tenzij de Onderzoeksraad voor veiligheid, bedoeld in
      [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref1], naar het desbetreffende voorval een onderzoek
      instelt.


      [ref1]: https://wetten.overheid.nl/BWBR0017613#Artikel2
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel65
    references:
      - id: ref1
        bwb_id: BWBR0017613
        artikel: '2'
  - number: '65.2'
    text: De inspectie voert haar werkzaamheden uit onder gezag van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel65
  - number: '65.3'
    text: |-
      De korpschef en de directeur van de Politieacademie verlenen de inspectie de door deze verlangde ondersteuning bij
      de uitvoering van de werkzaamheden in het kader van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel65
  - number: '66.1'
    text: |-
      De werkzaamheden die in het kader van [artikel 65, eerste lid, onder a tot en met d][ref1], worden uitgevoerd,
      worden jaarlijks door Onze Minister vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel65
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '65'
        hoofdstuk: '6'
  - number: '66.2'
    text: De inspectie rapporteert, gevraagd of ongevraagd, rechtstreeks aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel66
  - number: '66.3'
    text: |-
      Onze Minister zendt de Staten-Generaal jaarlijks een door de inspectie opgesteld verslag van de werkzaamheden die
      in het kader van [artikel 65, eerste lid][ref1], worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel65
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '65'
        hoofdstuk: '6'
  - number: '67'
    text: |-
      Met het toezicht bedoeld in [artikel 65, eerste lid][ref1], zijn belast de bij besluit van Onze Minister aangewezen
      ambtenaren van de inspectie. Van het besluit wordt mededeling gedaan door plaatsing in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel65
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '65'
        hoofdstuk: '6'
  - number: 67a.1
    text: |-
      Met de behandeling van en advisering over klachten zijn belast een of meer commissies, bestaande uit onafhankelijke
      leden.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel67a
  - number: 67a.2
    text: |-
      Het eerste lid is niet van toepassing indien na behandeling door Onze Minister, Onze Minister van Defensie, het
      College van procureurs-generaal, de korpschef of de politiechef naar tevredenheid van de klager aan diens klacht
      tegemoet is gekomen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel67a
  - number: '68.1'
    text: |-
      Onze Minister stelt nadere regels vast over de behandeling van klachten over gedragingen van ambtenaren van
      politie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68
  - number: '68.2'
    text: 'In de regels, bedoeld in het eerste lid, wordt voorzien in:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68
  - number: 68.2.a
    text: |-
      de instelling van een of meer commissies, bestaande uit onafhankelijke leden, die op de wijze in de regeling te
      bepalen zijn belast met de behandeling van en advisering over klachten waarbij zo nodig aandacht wordt geschonken
      aan de in onderdeel c genoemde aspecten;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68
  - number: 68.2.b
    text: |-
      de registratie van de mondeling en schriftelijk ingediende klachten en, indien beschikbaar, de daarop genomen
      beslissingen, en
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68
  - number: 68.2.c
    text: |-
      een jaarlijkse publicatie van de geregistreerde klachten en beslissingen, waarin wordt aangegeven in hoeverre
      bepaalde klachten wijzen op structurele tekortkomingen in het functioneren van de politie en waarin, zo nodig,
      aandacht wordt geschonken aan de middelen om deze tekortkomingen op te heffen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68
  - number: '68.3'
    text: |-
      [Afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de behandeling van klachten
      als bedoeld in het tweede lid, onder a. Indien een commissie over de klacht zal adviseren, deelt degene die
      ingevolge [artikel 70][ref2] verantwoordelijk is voor de behandeling van een klacht dit, in afwijking van
      [artikel 9:15, eerste lid, van de Algemene wet bestuursrecht][ref3], zo spoedig mogelijk aan de indiener van de
      klacht mede.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel9
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0005537
        afdeling: 9.1.3
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '70'
        hoofdstuk: '7'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '9'
  - number: 68a.1
    text: |-
      Onze Minister stelt de regels, bedoeld in [artikel 68, eerste lid][ref1], vast ten aanzien van klachten over
      gedragingen van:


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: 68a.1.a
    text: de directeur van de Politieacademie en zijn plaatsvervanger;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68a
  - number: 68a.1.b
    text: |-
      personen die ten behoeve van de Politieacademie politieonderwijs ontwikkelen en verzorgen, kennis ontwikkelen,
      onderzoek verrichten of onderwijsondersteunende werkzaamheden verrichten;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68a
  - number: 68a.1.c
    text: personen die werkzaamheden verrichten binnen de staf van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68a
  - number: 68a.2
    text: |-
      [Artikel 68, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68a
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: 68a.3
    text: |-
      Bij ministeriële regeling worden de functies of de categorieën van personen als bedoeld in het eerste lid, onder b
      en c, aangewezen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel68a
  - number: '69.1'
    text: |-
      Onze Minister van Defensie stelt de regels, bedoeld in [artikel 68, eerste lid][ref1], vast ten aanzien van
      klachten over gedragingen van militairen van de Koninklijke marechaussee dan wel van enig ander onderdeel van de
      krijgsmacht, bij de uitvoering van hun in deze wet omschreven taken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: '69.2'
    text: |-
      [Artikel 68, tweede en derde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: '70.1'
    text: |-
      De korpschef draagt zorg voor de behandeling van de klacht die is ingediend over een gedraging van een ambtenaar
      van politie die is tewerkgesteld bij een ondersteunende dienst.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel70
  - number: '70.2'
    text: |-
      De politiechef van de regionale of landelijke eenheid draagt zorg voor de behandeling van de klacht die is
      ingediend over een gedraging van een ambtenaar van politie die bij die eenheid is tewerkgesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel70
  - number: '70.3'
    text: De korpschef draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van de politiechef.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel70
  - number: '70.4'
    text: |-
      Het College van procureurs-generaal draagt zorg voor de behandeling van een klacht die is ingediend over een
      gedraging van een ambtenaar van de rijksrecherche.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel70
  - number: '70.5'
    text: |-
      In afwijking van het eerste lid draagt de directeur van de Politieacademie zorg voor de behandeling van de klacht
      die is ingediend over een gedraging van een persoon die ten behoeve van de Politieacademie politieonderwijs
      ontwikkelt en verzorgt, kennis ontwikkelt, onderzoek verricht of onderwijsondersteunende werkzaamheden verricht of
      die werkzaamheden verricht binnen de staf van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel70
  - number: '70.6'
    text: |-
      Onze Minister draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van de korpschef,
      de krachtens [artikel 28, derde lid][ref1], aangewezen leden van de leiding van de politie, de directeur van de
      Politieacademie en zijn plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '70.7'
    text: |-
      Onze Minister van Defensie draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van
      een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel van de krijgsmacht, bij de uitvoering
      van zijn in deze wet omschreven taken.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel70
  - number: '71.1'
    text: |-
      Een klacht over een gedraging van een ambtenaar van politie wordt ingediend bij de politiechef van de eenheid waar
      deze ambtenaar is tewerkgesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel71
  - number: '71.2'
    text: |-
      Een klacht als bedoeld in [artikel 70, eerste of derde lid][ref1], wordt ingediend bij de korpschef.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel70
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '70'
        hoofdstuk: '7'
  - number: '71.3'
    text: |-
      Een klacht over een gedraging van een ambtenaar van de rijksrecherche wordt ingediend bij het College van
      procureurs-generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel71
  - number: '71.4'
    text: |-
      Een klacht over een gedraging van de korpschef, de krachtens [artikel 28, derde lid][ref1], aangewezen leden van
      de leiding van de politie, de directeur van de Politieacademie en zijn plaatsvervanger wordt ingediend bij Onze
      Minister.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '28'
        hoofdstuk: '3'
        paragraaf: 3.2.2
        afdeling: '3.2'
  - number: '71.5'
    text: |-
      Een klacht over een gedraging van een persoon die ten behoeve van de Politieacademie politieonderwijs ontwikkelt
      en verzorgt, kennis ontwikkelt, onderzoek verricht of onderwijsondersteunende werkzaamheden verricht of die
      werkzaamheden verricht binnen de staf van de Politieacademie, wordt, in afwijking van het tweede lid, ingediend bij
      de directeur van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel71
  - number: '71.6'
    text: |-
      Een klacht over een gedraging van een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel
      van de krijgsmacht, bij de uitvoering van zijn in deze wet omschreven taken, wordt ingediend bij Onze Minister
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel71
  - number: '71.7'
    text: |-
      Tenzij reeds naar tevredenheid van de klager aan diens klacht tegemoet is gekomen, wordt van de klacht, onverwijld
      na de ontvangst ervan, afschrift gezonden aan de burgemeester van de gemeente waar de gedraging waarover
      wordt geklaagd heeft plaatsgevonden, alsmede aan de hoofdofficier van justitie van het arrondissement waarin
      de gemeente is gelegen waar de gedraging waarover wordt geklaagd, heeft plaatsgevonden. De burgemeester en de
      hoofdofficier van justitie worden in de gelegenheid gesteld over de klacht advies uit te brengen. De eerste en
      tweede volzin zijn niet van toepassing op de klacht die is ingediend over een gedraging van een persoon die ten
      behoeve van de Politieacademie politieonderwijs ontwikkelt en verzorgt, kennis ontwikkelt, onderzoek verricht of
      onderwijsondersteunende werkzaamheden verricht of die werkzaamheden verricht binnen de staf van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel71
  - number: '72'
    text: |-
      In afwijking van [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt de klacht afgehandeld
      binnen tien weken of, indien een commissie als bedoeld in [artikel 68, tweede lid, onder a][ref2], is belast met de
      behandeling van en advisering over de klacht, binnen veertien weken na de ontvangst van het klaagschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel68
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '68'
        hoofdstuk: '7'
  - number: '73.1'
    text: Er is een Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel73
  - number: '73.2'
    text: De Politieacademie heeft rechtspersoonlijkheid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel73
  - number: '73.3'
    text: |-
      De directeur van de Politieacademie is belast met de leiding en het beheer van de Politieacademie. Hij
      vertegenwoordigt de Politieacademie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel73
  - number: '73.4'
    text: |-
      De [artikelen 12, eerste lid][ref1], en [15 van de Kaderwet zelfstandige bestuursorganen][ref2] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '74.1'
    text: 'De Politieacademie heeft tot taak:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: 74.1.a
    text: 'het ontwikkelen en verzorgen van politieonderwijs, bestaande uit het ontwikkelen en het verzorgen van:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: 74.1.a.1°
    text: politieopleidingen;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: 74.1.a.2°
    text: overige opleidingen, anders dan bedoeld onder 1°;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: 74.1.a.3°
    text: het examineren van de studenten die de opleidingen, bedoeld onder 1° of 2°, hebben gevolgd;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: 74.1.b
    text: |-
      het ontwikkelen van kennis over de politie of de politietaak en het bijdragen aan de ontwikkeling van de
      uitoefening van de politietaak waarop het politieonderwijs is gericht, onder meer door het verrichten van
      onderzoek.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: '74.2'
    text: |-
      De Politieacademie verricht de in het eerste lid bedoelde taken ten behoeve van de politie. De politie neemt de
      in het eerste lid, onder a, bedoelde taken uitsluitend af bij de Politieacademie, onverminderd de taken van de
      Europese Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: '74.3'
    text: 'De Politieacademie kan de in het eerste lid, bedoelde taken tevens uitvoeren ten behoeve van:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: 74.3.a
    text: de Koninklijke marechaussee, voor zover het betreft de uitvoering van de politietaak, en de rijksrecherche;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: 74.3.b
    text: |-
      door Onze Minister aangewezen categorieën van personen, andere openbare diensten of rechtspersonen, die een
      publiekrechtelijke taak uitoefenen op het terrein van politie, justitie of veiligheid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel74
  - number: '75.1'
    text: |-
      De Politieacademie kan, na instemming van Onze Minister, andere werkzaamheden uitvoeren, dan de in
      [artikel 74, eerste lid][ref1], bedoelde taken, mits die werkzaamheden samenhangen met de in dat lid bedoelde
      taken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '75.2'
    text: |-
      De vergoeding van de kosten voor de werkzaamheden, bedoeld in het eerste lid, door de afnemers van deze
      werkzaamheden zijn verschuldigd aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel75
  - number: '75.3'
    text: |-
      Bij ministeriële regeling kunnen nadere regels worden gesteld over de uit te voeren werkzaamheden, bedoeld in het
      eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel75
  - number: '76.1'
    text: |-
      De directeur van de Politieacademie en zijn plaatsvervanger worden benoemd, herbenoemd, geschorst en ontslagen bij
      koninklijk besluit. De [artikelen 9][ref1] en [12, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref2]
      zijn van overeenkomstige toepassing op de plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '12'
  - number: '76.2'
    text: |-
      De directeur van de Politieacademie en zijn plaatsvervanger kunnen niet tevens lid zijn van de raad van advies van
      de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel76
  - number: '76.3'
    text: |-
      Bij de benoeming van de directeur van de Politieacademie en zijn plaatsvervanger wordt ervoor zorg gedragen dat
      expertise op het terrein van de politie, het onderwijs en onderzoek wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel76
  - number: '76.4'
    text: |-
      De directeur van de Politieacademie en zijn plaatsvervanger worden benoemd voor een periode van ten hoogste zes
      jaar. Zij kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel76
  - number: '77.1'
    text: De Politieacademie heeft een raad van advies van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel77
  - number: '77.2'
    text: |-
      De raad van advies van de Politieacademie adviseert de directeur van de Politieacademie desgevraagd of uit eigen
      beweging over de taakuitvoering door de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel77
  - number: '77.3'
    text: |-
      De directeur van de Politieacademie en zijn plaatsvervanger verstrekken de raad van advies van de Politieacademie
      desgevraagd alle gegevens en inlichtingen die deze voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel77
  - number: '78.1'
    text: |-
      De raad van advies van de Politieacademie bestaat uit ten minste drie en ten hoogste vijf leden, waaronder een
      voorzitter.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel78
  - number: '78.2'
    text: |-
      De [artikelen 9][ref1], [11][ref2], [12, tweede lid][ref3], [13][ref4], [18][ref5], [39, eerste lid][ref6], en
      [41 van de Kaderwet zelfstandige bestuursorganen][ref7] zijn van overeenkomstige toepassing op de raad van advies
      van de Politieacademie, met dien verstande dat hij het jaarverslag, bedoeld in artikel 18, eerste lid, van de
      Kaderwet zelfstandige bestuursorganen tezamen met het jaarverslag van de directeur van de Politieacademie kan
      uitbrengen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel13
      [ref5]: https://wetten.overheid.nl/BWBR0020495#Artikel18
      [ref6]: https://wetten.overheid.nl/BWBR0020495#Artikel39
      [ref7]: https://wetten.overheid.nl/BWBR0020495#Artikel41
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '9'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0020495
        artikel: '12'
      - id: ref4
        bwb_id: BWBR0020495
        artikel: '13'
      - id: ref5
        bwb_id: BWBR0020495
        artikel: '18'
      - id: ref6
        bwb_id: BWBR0020495
        artikel: '39'
      - id: ref7
        bwb_id: BWBR0020495
        artikel: '41'
  - number: '78.3'
    text: De raad van advies van de Politieacademie stelt bij reglement in ieder geval regels vast omtrent zijn werkwijze.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel78
  - number: '78.4'
    text: |-
      Onze Minister kent de leden van de raad van advies van de Politieacademie, ten laste van de Politieacademie, een
      vergoeding toe voor hun werkzaamheden. De leden hebben aanspraak op vergoeding door de Politieacademie van de door
      hen in de uitoefening van hun functie gemaakte reis- en verblijfkosten.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel78
  - number: '79.1'
    text: |-
      De voorzitter en de overige leden van de raad van advies van de Politieacademie worden benoemd, herbenoemd,
      geschorst en ontslagen bij koninklijk besluit.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel79
  - number: '79.2'
    text: |-
      Bij de samenstelling van de raad van advies van de Politieacademie wordt ervoor zorg gedragen dat deskundigheid op
      het terrein van de politie, onderwijs en wetenschappelijk onderzoek wordt gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel79
  - number: '79.3'
    text: |-
      De leden hebben geen directe belangen bij de Politieacademie. Zij hebben zitting op persoonlijke titel en oefenen
      hun functie uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel79
  - number: '79.4'
    text: De leden worden benoemd voor een periode van ten hoogste vier jaar. Zij kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel79
  - number: '80'
    text: |-
      Ter ondersteuning van de raad van advies van de Politieacademie stelt de directeur van de Politieacademie sterkte
      feitelijk ter beschikking. De personen die werkzaam zijn ten behoeve van de raad van advies van de Politieacademie
      staan onder gezag van de raad van advies van de Politieacademie en leggen over hun werkzaamheden uitsluitend
      daaraan verantwoording af.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel80
  - number: '81.1'
    text: |-
      Voor zover bij of krachtens dit hoofdstuk of de [Kaderwet zelfstandige bestuursorganen][ref1] niet anders is
      bepaald, worden bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 47, eerste lid][ref2], voor
      de directeur van de Politieacademie en zijn plaatsvervanger regels gesteld over de in dat lid bedoelde onderwerpen.


      [ref1]: https://wetten.overheid.nl/BWBR0020495
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel47
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0020495
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '47'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '81.2'
    text: |-
      [Artikel 47, tweede en derde lid][ref1], is van overeenkomstige toepassing op de directeur van de Politieacademie
      en zijn plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '47'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '81.3'
    text: |-
      [Artikel 47, vierde lid][ref1], is van overeenkomstige toepassing op de Politieacademie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel47
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '47'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '81.4'
    text: |-
      Bij de algemene maatregel van bestuur, bedoeld in [artikel 48][ref1], worden regels gesteld omtrent de titulaire
      rang van de directeur van de Politieacademie en zijn plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '48'
        hoofdstuk: '3'
        afdeling: '3.5'
  - number: '81.5'
    text: |-
      Bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 22][ref1], worden regels gesteld omtrent de
      kleding van de directeur van de Politieacademie en zijn plaatsvervanger.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel22
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel81
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '22'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '82.1'
    text: Er is een politieonderwijsraad.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: '82.2'
    text: |-
      De politieonderwijsraad bestaat uit een oneven aantal van ten hoogste vijftien leden, onder wie de onafhankelijke
      voorzitter. De leden wijzen uit hun midden een plaatsvervangend voorzitter aan.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: '82.3'
    text: 'In de politieonderwijsraad hebben, naast de voorzitter, in ieder geval als lid zitting:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.a
    text: een burgemeester;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.b
    text: een lid van de leiding van de politie en twee politiechefs;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.c
    text: een lid van het openbaar ministerie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.d
    text: twee vertegenwoordigers vanuit de politievakorganisaties;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.e
    text: een vertegenwoordiger van het beroepsonderwijs;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.f
    text: een vertegenwoordiger van het hoger onderwijs;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.g
    text: de directeur van de Politieacademie en zijn plaatsvervanger;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: 82.3.h
    text: een onafhankelijk lid dat deskundig is op het terrein van het toegepast wetenschappelijk onderzoek.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: '82.4'
    text: De leden van de politieonderwijsraad worden bij koninklijk besluit benoemd, herbenoemd, geschorst en ontslagen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: '82.5'
    text: |-
      De leden van de politieonderwijsraad worden benoemd voor een periode van zes jaren. Zij kunnen ten hoogste eenmaal
      worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: '82.6'
    text: Onze Minister kan adviserende leden of waarnemers benoemen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: '82.7'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de organisatie en de werkwijze
      van de politieonderwijsraad.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel82
  - number: '83.1'
    text: |-
      De korpschef stelt het door Onze Minister vastgestelde deel van de sterkte als bedoeld in
      [artikel 36, eerste lid, tweede volzin][ref1], feitelijk ter beschikking aan de politieonderwijsraad voor de
      uitvoering van de taken, bedoeld in de [artikelen 84][ref2], [87, eerste lid][ref3], en [94, eerste lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel84
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel87
      [ref4]: https://wetten.overheid.nl/BWBR0031788#Artikel94
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '84'
        hoofdstuk: '8'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '87'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref4
        bwb_id: BWBR0031788
        artikel: '94'
        hoofdstuk: '8'
        paragraaf: '4'
  - number: '83.2'
    text: |-
      Bij ministeriële regeling worden de functies of categorieën aangewezen van personen
      die op grond van het eerste lid feitelijk ter beschikking kunnen worden gesteld.
      [Artikel 97, eerste lid, onder a en b, en tweede lid, onder b][ref1], is van overeenkomstige toepassing op de
      voorzitter van de politieonderwijsraad ten aanzien van de personen, bedoeld in de eerste volzin.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel97
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '97'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: '83.3'
    text: |-
      De personen die werkzaam zijn ten behoeve van de politieonderwijsraad staan onder gezag van de voorzitter
      van de politieonderwijsraad en leggen over hun werkzaamheden uitsluitend aan hem verantwoording af.
      [Artikel 97, vierde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel97
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '97'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: '84.1'
    text: |-
      De politieonderwijsraad draagt bij aan het ontwikkelen en onderhouden van een kwalificatiestructuur als bedoeld in
      [artikel 87][ref1], gericht op de aansluiting en afstemming tussen het aanbod van politieopleidingen en de behoefte
      van de politie daaraan, mede in het licht van de arbeidsmarktperspectieven voor afgestudeerden, en mede gelet op
      van belang zijnde ontwikkelingen in internationaal verband.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel87
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '87'
        hoofdstuk: '8'
        paragraaf: '3'
  - number: '84.2'
    text: |-
      De politieonderwijsraad adviseert Onze Minister omtrent de eisen die worden gesteld aan de plaatsen waar de
      beroepspraktijkvorming wordt uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel84
  - number: '84.3'
    text: |-
      De politieonderwijsraad ziet toe op de aansluiting van de politieopleidingen op de
      [Wet educatie en beroepsonderwijs][ref1] en de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625
      [ref2]: https://wetten.overheid.nl/BWBR0005682
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007625
      - id: ref2
        bwb_id: BWBR0005682
  - number: '84.4'
    text: |-
      De politieonderwijsraad adviseert Onze Minister over de strategische onderzoeksagenda, bedoeld in
      [artikel 94][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel94
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '94'
        hoofdstuk: '8'
        paragraaf: '4'
  - number: '84.5'
    text: |-
      De politieonderwijsraad verzorgt de uitbesteding van het toegepast wetenschappelijk onderzoek, bedoeld in
      [artikel 95, tweede lid][ref1], en de begeleiding van dat onderzoek, die plaatsvinden onder verantwoordelijkheid
      van de directeur van de Politieacademie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel95
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '95'
        hoofdstuk: '8'
        paragraaf: '4'
  - number: '84.6'
    text: De politieonderwijsraad geeft Onze Minister desgevraagd of uit eigen beweging zijn zienswijze.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel84
  - number: '85.1'
    text: |-
      Het politieonderwijs is gericht op de verwerving van kennis, inzicht, vaardigheden en houding, nodig voor de
      uitoefening van de politietaak. Het politieonderwijs bevordert tevens de algemene vorming en de persoonlijke
      ontplooiing van de studenten en draagt bij tot hun maatschappelijk functioneren.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel85
  - number: '85.2'
    text: Het politieonderwijs sluit aan bij de door de politie aangegeven behoefte.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel85
  - number: '86.1'
    text: De Politieacademie biedt in samenwerking met de politie het politieonderwijs aan.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel86
  - number: '86.2'
    text: |-
      Bij ministeriële regeling worden de opleidingen, bedoeld in [artikel 74, eerste lid, onder a, onder 2°][ref1],
      aangewezen, gehoord de korpschef en de directeur van de Politieacademie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '87.1'
    text: |-
      Onze Minister draagt met het oog op de totstandkoming van een kwalificatiestructuur en de vaststelling van
      de daarop gebaseerde politieopleidingen zorg voor het vaststellen en onderhouden van een samenhangend en
      gedifferentieerd geheel van kwalificatiedossiers en bijbehorende kwalificaties. De politieonderwijsraad doet
      daartoe een voorstel. [Artikel 7.2.4, tweede, derde en vierde lid, van de Wet educatie en beroepsonderwijs][ref1]
      is van overeenkomstige toepassing op de vaststelling van de kwalificatiestructuur.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '87.2'
    text: |-
      Uit het voorstel, bedoeld in het eerste lid, tweede volzin, dient te blijken dat de politieonderwijsraad voldoende
      acht heeft geslagen op de aansluiting van de politieopleidingen bij de beroepspraktijk alsmede de opleidingen
      voortgezet onderwijs, de opleidingen voor middelbaar en hoger beroepsonderwijs en het wetenschappelijk onderwijs.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel87
  - number: '87.3'
    text: Bij ministeriële regeling worden op basis van de kwalificatiestructuur de politieopleidingen aangewezen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel87
  - number: '87.4'
    text: |-
      In de regeling, bedoeld in het derde lid, wijst Onze Minister politieopleidingen aan waarvan
      een beroepspraktijkvorming deel uitmaakt. De beroepspraktijkvorming wordt verzorgd op
      grondslag van een overeenkomst, gesloten door de Politieacademie, de student en de politie.
      [Artikel 7.7, vijfde lid, tweede volzin, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] is
      van overeenkomstige toepassing op deze overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '87.5'
    text: |-
      Indien ten aanzien van bepaalde uitvoerende functies of taken bij of krachtens de wet vereisten zijn vastgesteld
      met betrekking tot de kwaliteiten op het gebied van kennis, inzicht, vaardigheden, houding, ervaring of
      persoonlijke eigenschappen waarover degenen die die functie of taak gaan vervullen, moeten beschikken, neemt Onze
      Minister deze vereisten in acht bij de vaststelling van de kwalificatiestructuur.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel87
  - number: '87.6'
    text: |-
      De directeur van de Politieacademie draagt zorg voor de aanleg, het beheer en de bekendmaking van een centraal
      register politieopleidingen waarin de relatie met de kwalificatiestructuur en de onderliggende kwalificatiedossiers
      van de onderscheiden politieopleidingen zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel87
  - number: '88'
    text: |-
      De directeur van de Politieacademie stelt de studieduur van de politieopleiding waarbij het niveau overeenkomt
      met een niveau als bedoeld in [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref1] vast met
      inachtneming van de regels in [artikel 7.2.4a, tweede en derde lid, van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '89'
    text: |-
      De directeur van de Politieacademie draagt er zorg voor dat de politieopleidingen zodanig zijn ingericht dat
      de studenten de kwalificaties binnen de vastgestelde studieduur kunnen bereiken en dat het onderwijsprogramma
      evenwichtig is ingedeeld, alsmede voldoende begeleide onderwijsuren en uren beroepspraktijkvorming omvat.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel89
  - number: '90.1'
    text: |-
      De directeur van de Politieacademie stelt tijdig, ten behoeve van de studenten, voor elke politieopleiding
      en voor elke overige opleiding als bedoeld in [artikel 74, eerste lid, onder a, onder 2°][ref1], die
      wordt afgesloten met een examen een onderwijs- en examenregeling vast. De [artikelen 7.13][ref2] en
      [7.14 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] zijn van overeenkomstige toepassing op
      de onderwijs- en examenregeling.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref3
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '90.2'
    text: |-
      De onderwijs- en examenregeling wordt door de directeur van de Politieacademie tijdig bekendgemaakt, zodanig dat
      de aanstaande student zich een adequaat beeld kan vormen van de inhoud en inrichting van het politieonderwijs en
      de examens.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel90
  - number: '91.1'
    text: |-
      Elke politieopleiding wordt afgesloten met een examen. Overige door de Politieacademie verzorgde opleidingen kunnen
      worden afgesloten met een examen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel91
  - number: '91.2'
    text: |-
      Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en de beroepshouding van de examinandus
      alsmede de beoordeling van de uitkomsten van dat onderzoek aan de hand van de vereisten in het kwalificatiedossier.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel91
  - number: '91.3'
    text: De directeur van de Politieacademie geeft de studenten de gelegenheid een examen af te leggen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel91
  - number: '91.4'
    text: |-
      Het examen van een politieopleiding of overige opleiding waarvan een beroepspraktijkvorming deel uitmaakt, is eerst
      dan met goed gevolg afgesloten indien zowel de beroepspraktijkvorming als het overige deel van de politieopleiding
      met goed gevolg is afgesloten.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel91
  - number: '91.5'
    text: |-
      Ten bewijze dat een examen met goed gevolg is afgelegd, wordt door de examencommissie een diploma, deeldiploma of
      certificaat uitgereikt, nadat de directeur van de Politieacademie heeft verklaard dat aan de procedurele eisen voor
      de afgifte is voldaan.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel91
  - number: '92.1'
    text: |-
      Elke politieopleiding of groep van politieopleidingen en elke opleiding als bedoeld in
      [artikel 74, eerste lid, onder a, onder 2°][ref1], die wordt afgesloten met een examen,
      of groep van dergelijke opleidingen aan de Politieacademie heeft een examencommissie.
      [Artikel 7.12, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderwijs][ref2] is op de
      examencommissie van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '92.2'
    text: |-
      De directeur van de Politieacademie stelt de examencommissie in en benoemt de leden van de examencommissie. Op
      de benoeming, samenstelling, taken en bevoegdheden van de examencommissie zijn de [artikelen 7.12a][ref1] en
      [7.12b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel92
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '7'
      - id: ref2
        bwb_id: BWBR0005682
        artikel: '7'
  - number: '92.3'
    text: De leden van de examencommissie oefenen hun taak uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel92
  - number: '92.4'
    text: |-
      Voor het afnemen van examens en het vaststellen van de uitslag daarvan wijst de examencommissie examinatoren aan.
      De examinatoren verstrekken de examencommissie de gevraagde inlichtingen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel92
  - number: '93.1'
    text: |-
      De directeur van de Politieacademie stelt een commissie van beroep voor de examens in.
      [Artikel 7.5.1 van de Wet educatie en beroepsonderwijs][ref1] is van overeenkomstige toepassing op de leden van
      de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '93.2'
    text: |-
      De commissie oordeelt over beslissingen van de directeur van de Politieacademie ter uitvoering
      van de [artikelen 87, vierde lid][ref1], en [91][ref2], de examencommissie of de examinatoren. De
      [artikelen 7.5.2, tweede tot en met zesde lid, en 7.5.3 van de Wet educatie en beroepsonderwijs][ref3] zijn van
      toepassing op de commissie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel87
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel91
      [ref3]: https://wetten.overheid.nl/BWBR0007625#Artikel7
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '87'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '91'
        hoofdstuk: '8'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007625
        artikel: '7'
  - number: '93.3'
    text: De leden van de commissie van beroep voor de examens oefenen hun taak uit zonder last of ruggespraak.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel93
  - number: '93.4'
    text: |-
      De leden van de examencommissie en examinatoren verstrekken aan de commissie de inlichtingen die zij voor de
      uitvoering van haar taak nodig oordeelt.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel93
  - number: '94.1'
    text: |-
      Onze Minister stelt minimaal eenmaal in de vier jaar de strategische onderzoeksagenda vast. De strategische
      onderzoeksagenda omvat de strategische thema’s voor het toegepast wetenschappelijk onderzoek dat door de
      Politieacademie wordt uitgevoerd en voor het toegepast wetenschappelijk onderzoek dat wordt uitbesteed.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel94
  - number: '94.2'
    text: De strategische onderzoeksagenda sluit aan op de politiepraktijk.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel94
  - number: '95.1'
    text: |-
      De directeur van de Politieacademie stelt jaarlijks, op basis van de in [artikel 94][ref1] bedoelde strategische
      onderzoeksagenda het onderzoeksprogramma van de Politieacademie vast.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel94
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '94'
        hoofdstuk: '8'
        paragraaf: '4'
  - number: '95.2'
    text: |-
      Het onderzoeksprogramma omvat in ieder geval een beschrijving van het toegepast wetenschappelijke onderzoek dat
      door de Politieacademie wordt uitgevoerd en de uit te besteden toegepast wetenschappelijke onderzoeken.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel95
  - number: '95.3'
    text: Het onderzoeksprogramma bevat een meerjarenprogramma voor de drie jaren volgend op het programmajaar.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel95
  - number: '95.4'
    text: Naast het onderzoeksprogramma kan de Politieacademie ander toegepast wetenschappelijk onderzoek verrichten.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel95
  - number: '96.1'
    text: |-
      De korpschef stelt het door Onze Minister vastgestelde deel van de sterkte en middelen als bedoeld in
      [artikel 36, eerste lid, tweede volzin][ref1], feitelijk ter beschikking aan de Politieacademie voor de uitvoering
      van de taken, bedoeld in de [artikelen 74, eerste lid][ref2], en [75, eerste lid][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel36
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel75
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: '75'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: '96.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden eisen gesteld aan de sterkte en middelen die aan de
      Politieacademie feitelijk ter beschikking worden gesteld en regels gesteld omtrent de door de directeur van de
      Politieacademie te stellen behoefte aan sterkte en middelen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel96
  - number: '97.1'
    text: 'De directeur van de Politieacademie doet een aanbeveling voor en heeft een instemmingsrecht bij:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
  - number: 97.1.a
    text: |-
      de aanstelling van personen die ten behoeve van de Politieacademie politieonderwijs ontwikkelen en verzorgen,
      kennis ontwikkelen, onderzoek verrichten of onderwijsondersteunende werkzaamheden verrichten of die werkzaamheden
      verrichten binnen de staf van de Politieacademie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
  - number: 97.1.b
    text: |-
      de selectie van personen die ten behoeve van de Politieacademie politieonderwijs ontwikkelen en verzorgen,
      kennis ontwikkelen, onderzoek verrichten of onderwijsondersteunende werkzaamheden verrichten of die werkzaamheden
      verrichten binnen de staf van de Politieacademie, met het oog op het feitelijk ter beschikking stellen, bedoeld in
      [artikel 96, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel96
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '96'
        hoofdstuk: '8'
        paragraaf: '5'
  - number: '97.2'
    text: 'De directeur van de Politieacademie heeft een instemmingsrecht bij:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
  - number: 97.2.a
    text: |-
      de selectie van de middelen die noodzakelijk zijn voor de uitvoering van de taken van de Politieacademie, bedoeld
      in de [artikelen 74][ref1] en [75][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel75
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '74'
        hoofdstuk: '8'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0031788
        artikel: '75'
        hoofdstuk: '8'
        paragraaf: '1'
  - number: 97.2.b
    text: |-
      de beëindiging van het feitelijk ter beschikking stellen van personen die ten behoeve van de Politieacademie
      politieonderwijs ontwikkelen en verzorgen, kennis ontwikkelen, onderzoek verrichten of onderwijsondersteunende
      werkzaamheden verrichten of die werkzaamheden verrichten ten behoeve van de staf van de Politieacademie,
      onverminderd [artikel 36, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel36
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: 97.2.c
    text: |-
      de beëindiging van het feitelijk ter beschikking stellen van de middelen, bedoeld onder a, onverminderd
      [artikel 36, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel36
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '36'
        hoofdstuk: '3'
        paragraaf: 3.2.3
        afdeling: '3.2'
  - number: '97.3'
    text: |-
      Bij ministeriële regeling worden de functies of de categorieën van personen als bedoeld in de eerste lid, onder a
      en b, en tweede lid, onder b, aangewezen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
  - number: '97.4'
    text: |-
      De directeur van de Politieacademie draagt er zorg voor dat de personen die werkzaam zijn ten behoeve van de
      Politieacademie in de gelegenheid worden gesteld de aan hun aanstelling als ambtenaar van politie verbonden rechten
      en verplichtingen na te komen.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel97
  - number: '98.1'
    text: De directeur van de Politieacademie stelt een bestuursreglement vast.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel98
  - number: '98.2'
    text: 'In het bestuursreglement worden ten minste vastgelegd:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel98
  - number: 98.2.a
    text: |-
      de wijze waarop de directeur van de Politieacademie de uitoefening van zijn taken en bevoegdheden afstemt met de
      raad van advies van de Politieacademie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel98
  - number: 98.2.b
    text: een nadere regeling van de organisatorische inrichting van de Politieacademie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel98
  - number: 98.2.c
    text: de samenstelling en de werkwijze van de leiding van organisatorische onderdelen van de Politieacademie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel98
  - number: 98.2.d
    text: de taken en bevoegdheden die zijn opgedragen aan de leiding van het desbetreffende onderdeel.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel98
  - number: '99.1'
    text: |-
      Onze Minister stelt jaarlijks ten laste van de begroting van zijn ministerie bijdragen ter beschikking aan de
      Politieacademie voor de bekostiging van:
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.1.a
    text: de directeur van de Politieacademie en zijn plaatsvervanger;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.1.b
    text: de leden van de raad van advies van de Politieacademie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.1.c
    text: |-
      de leden van de examencommissie en van de commissie van beroep voor de examens, voor zover het geen ambtenaren van
      politie zijn;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.1.d
    text: het aangaan van samenwerkingsverbanden met onderwijsinstellingen;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.1.e
    text: de uit te besteden toegepast wetenschappelijke onderzoeken.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: '99.2'
    text: |-
      De Politieacademie gebruikt de geldmiddelen, bedoeld in het eerste lid, uitsluitend ter vervulling van de in het
      eerste lid bedoelde kosten.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: '99.3'
    text: 'Het is de Politieacademie verboden:'
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.3.a
    text: |-
      personeel in dienst te nemen, onverminderd de directeur van de Politieacademie, zijn plaatsvervanger en de leden
      van de raad van advies van de Politieacademie;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.3.b
    text: huur-, koop- en leaseovereenkomsten aan te gaan;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: 99.3.c
    text: |-
      leningen aan te gaan en overeenkomsten aan te gaan waarbij zij zich verbindt tot zekerheidstelling met inbegrip van
      zekerheidstelling voor schulden van derden of waarbij zij zich als borg of hoofdelijk medeschuldenaar verbindt of
      zich voor een derde sterk maakt.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: '99.4'
    text: |-
      Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister in overeenstemming met Onze
      Minister van Financiën worden regels worden gesteld over het financieel beheer van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel99
  - number: '100.1'
    text: |-
      De directeur van de Politieacademie stelt ten minste eenmaal in de vier jaar een beleidsplan vast. Het beleidsplan
      wordt voor 15 november aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel100
  - number: '100.2'
    text: |-
      De directeur van de Politieacademie stelt jaarlijks een meerjarenraming vast voor vier op het
      begrotingsjaar volgende jaren. De meerjarenraming wordt tegelijk met de begroting, bedoeld in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1], aan Onze Minister toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: '100.3'
    text: |-
      De directeur van de Politieacademie stelt jaarlijks een jaarplan vast voor de Politieacademie. Het jaarplan wordt
      voor 1 juni aan Onze Minister gezonden.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel100
  - number: '100.4'
    text: De stukken, bedoeld in het eerste en tweede lid, worden algemeen verkrijgbaar gesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel100
  - number: '101'
    text: |-
      Onze Minister, de korpschef en de directeur van de Politieacademie voeren ten minste viermaal per jaar overleg. In
      het overleg wordt gesproken over de werking van de regels bij of krachtens dit hoofdstuk, waaronder in ieder geval:
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel101
  - number: 101.a
    text: het pakket van politieonderwijs;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel101
  - number: 101.b
    text: de beoordeling van de uitvoering van het politieonderwijs;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel101
  - number: 101.c
    text: de uitvoering van de strategische onderzoeksagenda;
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel101
  - number: 101.d
    text: de ter beschikking stelling van sterkte en middelen aan de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel101
  - number: '102.1'
    text: |-
      De directeur van de Politieacademie draagt er zorg voor dat, zoveel mogelijk in samenwerking
      met andere onderwijsinstellingen, wordt voorzien in een regelmatige beoordeling, mede door
      onafhankelijke deskundigen, van de kwaliteit van de werkzaamheden van de Politieacademie.
      __REF000___________________________________________________________________________________________________________
      ______ is van overeenkomstige toepassing op de directeur van de Politieacademie.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0005682
        artikel: '1'
  - number: '102.2'
    text: Onze Minister ziet toe op de uitvoering van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel102
  - number: '102.3'
    text: Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel102
  - number: '103.1'
    text: |-
      Onze Minister zendt binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk, met uitzondering van [hoofdstuk 8][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Hoofdstuk8
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0031788
        hoofdstuk: '8'
  - number: '103.2'
    text: |-
      In afwijking van het eerste lid zendt Onze Minister binnen drie jaar na inwerkingtreding van deze
      wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in
      de praktijk in de regionale eenheid in de arrondissementen, bedoeld in de [artikelen 5a][ref1] en
      [11 van de Wet op de rechterlijke indeling][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002080#Artikel5a
      [ref2]: https://wetten.overheid.nl/BWBR0002080#Artikel11
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel103
    references:
      - id: ref1
        bwb_id: BWBR0002080
        artikel: 5a
      - id: ref2
        bwb_id: BWBR0002080
        artikel: '11'
  - number: '104'
    text: |-
      De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel104
  - number: '105'
    text: |-
      Deze wet wordt aangehaald als: Politiewet, met vermelding van het jaartal van het Staatsblad waarin zij wordt
      geplaatst.
    url: https://wetten.overheid.nl/BWBR0031788/2018-09-19#Artikel105
