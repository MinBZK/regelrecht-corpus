  - number: '54'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de doeleinden waarvoor de rijksrecherche, met inachtneming van het bepaalde bij of krachtens de
      [Wet politiegegevens][ref1], gegevens verwerkt of verder verwerkt en de categorieën van gegevens die de
      rijksrecherche daartoe verwerkt, alsmede over de terbeschikkingstelling van gegevens ten behoeve van de uitvoering
      van de politietaak en de verstrekking van gegevens aan personen en instanties;

      b. de wijze waarop de rijksrecherche gegevens verwerkt, daaronder begrepen de schrijfwijze en classificatie van
      gegevens, alsmede de wijze van vermelding van de herkomst van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel54
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: '55'
    text: |-
      Bij ministeriële regeling kunnen regels worden gegeven over de samenwerking van de rijksrecherche met de politie.
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Defensie kunnen regels worden gegeven over
      de samenwerking van de rijksrecherche met de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel55
  - number: '56'
    text: |-
      1 Indien naar het oordeel van het gezag, bedoeld in [artikel 11, eerste lid][ref1], of
      [artikel 12, eerste lid][ref2], een eenheid bijstand behoeft van andere eenheden, dan richt de politiechef een
      verzoek daartoe aan de korpschef.

      2 Behoudens in spoedeisende gevallen wordt het verzoek, bedoeld in het eerste lid, niet gedaan dan nadat het gezag
      de regioburgemeester in de gelegenheid heeft gesteld zijn zienswijze over het verzoek te geven.

      3 De korpschef bepaalt of en op welke wijze bijstand wordt verleend en stelt het gezag hiervan in kennis. Indien
      bijstand wordt geleverd, stelt de korpschef de regioburgemeesters van de bijstand ontvangende en bijstand leverende
      eenheden hiervan in kennis.

      4 Indien het in het eerste lid bedoelde verzoek geheel of gedeeltelijk wordt afgewezen, kan het gezag Onze Minister
      verzoeken de korpschef op te dragen alsnog in de gevraagde bijstand te voorzien.

      5 Behoeft een eenheid bijstand van andere eenheden voor een onderdeel van de politietaak dat op grond van de
      wet rechtstreeks onder verantwoordelijkheid van Onze Minister wordt uitgevoerd, dan bepaalt Onze Minister of en
      op welke wijze bijstand wordt verleend. Indien bijstand wordt geleverd, stelt hij de regioburgemeesters van de
      bijstand ontvangende en bijstand leverende eenheden hiervan in kennis.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel56
