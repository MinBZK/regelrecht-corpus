  - number: 48w
    text: |-
      1 De ambtenaar, bedoeld in [artikel 48v, eerste lid, onder a][ref1], meldt aan het bevoegd gezag een wijziging van
      feiten of omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat die uit het oogpunt van de integriteit
      van de politie relevant is voor het verrichten van werkzaamheden als ambtenaar van politie.

      2 De persoon, bedoeld in [artikel 48v, eerste lid, onder b][ref2], meldt aan de korpschef een wijziging van feiten
      of omstandigheden waarvan hem redelijkerwijs duidelijk moet zijn dat die uit het oogpunt van de integriteit van de
      politie relevant is voor het blijven verrichten van deze werkzaamheden.

      3 Onder een wijziging van feiten of omstandigheden als bedoeld in het eerste en tweede
      lid, wordt verstaan een wijziging die betrekking heeft op de gegevens, bedoeld in de
      [artikelen 48r, derde lid, onder a tot en met d][ref3], en [48s, tweede lid][ref4].

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de melding, bedoeld in het
      eerste en tweede lid.

      5 Het eerste lid is niet van toepassing indien het een vertrouwensfunctie of een functie waarvan is bepaald dat een
      verklaring omtrent het gedrag is vereist, betreft.


