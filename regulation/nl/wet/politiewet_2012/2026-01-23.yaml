  - number: '10'
    text: |-
      1 Alle ambtenaren die zijn belast met een politietaak, verlenen elkaar wederkerig de nodige hulp en betrachten bij
      voortduring een eendrachtige samenwerking bij het uitvoeren van die taak. Zij verlenen elkaar zoveel mogelijk de
      gevraagde medewerking.

      2 Zij die op grond van de [artikelen 141, onderdeel d][ref1], en [142 van het Wetboek van Strafvordering][ref2] tot
      opsporing van strafbare feiten bevoegd zijn, werken samen met de politie.

      3 Bij algemene maatregel van bestuur kunnen regels worden gegeven over de samenwerking van de politie met de
      buitengewone opsporingsambtenaren, bedoeld in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel141
      [ref2]: https://wetten.overheid.nl/BWBR0001903#Artikel142
      [ref3]: https://wetten.overheid.nl/BWBR0001903#Artikel142
