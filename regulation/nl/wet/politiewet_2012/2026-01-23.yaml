  - number: 48s
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden werkzaamheden aangewezen die een verhoogd risico kunnen
      vormen voor de integriteit van de politie.

      2 Indien de betrokkene, bedoeld in [artikel 48r, eerste lid][ref1], werkzaamheden als bedoeld in het eerste
      lid gaat verrichten, worden bij het onderzoek naar de betrouwbaarheid tevens justitiële gegevens als bedoeld in
      [artikel 1, onder a, van de Wet justitiële en strafvorderlijke gegevens][ref2], politiegegevens als bedoeld in
      [artikelen 8][ref3], [9][ref4], [10][ref5] en [13 van de Wet politiegegevens][ref6], en gegevens uit open bronnen
      geraadpleegd die betrekking hebben op:

      a. diens partner, diens eerstegraads bloedverwant in neergaande lijn, voor zover twaalf jaar of ouder, of diens
      inwonende eerstegraads bloedverwant in opgaande lijn;

      b. een andere persoon, dan bedoeld onder a, voor zover twaalf jaar of ouder.

      3 Raadplegen van de gegevens van een persoon als bedoeld in het tweede lid, onder b, geschiedt uitsluitend,
      indien er aanwijzingen zijn dat omtrent deze persoon gegevens als bedoeld in het tweede lid bestaan die vanwege de
      bijzondere aard van de relatie tussen deze persoon en de betrokkene relevant zijn voor de beoordeling of er geen
      bezwaar als bedoeld in [artikel 48q, eerste of vierde lid][ref7], bestaat.

      4 De aanwijzingen, bedoeld in het derde lid, kunnen uitsluitend worden verkregen op basis van het onderzoek naar
      de betrouwbaarheid van de betrokkene, waaronder het onderzoek naar gegevens die betrekking hebben op de personen,
      bedoeld in het tweede lid, onder a.

      5 In het tweede lid, onder a, wordt onder partner verstaan: degene met wie de betrokkene is gehuwd, een
      geregistreerd partnerschap voert of een notarieel samenlevingscontract heeft, strekkende tot de wederzijdse
      verplichting een bijdrage te leveren aan een gezamenlijke huishouding of een daarmee naar aard en strekking
      overeenkomende registratie buiten Nederland dan wel een andere levensgezel van de betrokkene.

      6 Met de personen, bedoeld in het tweede lid, kan een gesprek worden gevoerd over de geraadpleegde gegevens,
      bedoeld in dat lid.


