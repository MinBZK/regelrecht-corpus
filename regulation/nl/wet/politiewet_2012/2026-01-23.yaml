        artikel: '18'
        hoofdstuk: '3'
        afdeling: '3.1'
  - number: '21'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld omtrent de vereisten voor een goede
      taakuitvoering door de politie en de eisen die worden gesteld aan de bekwaamheid van de ambtenaren van politie.

      2 Voor zover de regels, bedoeld in het eerste lid, mede van toepassing zijn op de uitvoering van de politietaken
      door de Koninklijke marechaussee, geschiedt de voordracht voor de algemene maatregel van bestuur door Onze Minister
      in overeenstemming met Onze Minister van Defensie.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel21
  - number: '22'
    text: |-
      Bij of krachtens algemene maatregel van bestuur worden regels gesteld omtrent de bewapening, de uitrusting en de
      kleding van de ambtenaren van politie.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel22
  - number: '23'
    text: |-
      1 Bij ministeriële regeling kunnen regels worden gesteld over:

      a. de informatie- en communicatievoorzieningen van de politie en het gebruik daarvan door de politie en door
      andere organisaties die een taak hebben op het terrein van justitie, openbare orde, veiligheid of hulpverlening, en
      waarmee de politie ter uitvoering van de politietaak informatie- en communicatievoorzieningen deelt;

      b. de informatiebeveiliging door de politie en door andere organisaties als bedoeld in onderdeel a.

      2 Voor zover de regels, bedoeld in het eerste lid, van belang zijn voor de uitvoering van de politietaken, bedoeld
      in [artikel 4][ref1], kunnen zij, in overeenstemming met Onze Minister van Defensie, mede worden gesteld ten
      aanzien van de Koninklijke marechaussee.

      3 Onze Minister kan de regionale en landelijke eenheden frequenties toewijzen voor de overdracht van gegevens door
      middel van de daartoe geëigende aangewezen informatie- en communicatievoorzieningen.

      4 Bij regeling van Onze Minister, in overeenstemming met Onze Ministers die het mede aangaat, en gehoord de
      Regionale Ambulancevoorzieningen en de besturen van de veiligheidsregio’s, kunnen nadere regels worden gesteld over
      de meldkamers, bedoeld in [artikel 25a, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25a
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel23
