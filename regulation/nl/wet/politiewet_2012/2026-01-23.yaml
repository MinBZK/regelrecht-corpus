  - number: '87'
    text: |-
      1 Onze Minister draagt met het oog op de totstandkoming van een kwalificatiestructuur en de vaststelling
      van de daarop gebaseerde politieopleidingen zorg voor het vaststellen en onderhouden van een samenhangend en
      gedifferentieerd geheel van kwalificatiedossiers en bijbehorende kwalificaties. De politieonderwijsraad doet
      daartoe een voorstel. [Artikel 7.2.4, tweede, derde en vierde lid, van de Wet educatie en beroepsonderwijs][ref1]
      is van overeenkomstige toepassing op de vaststelling van de kwalificatiestructuur.

      2 Uit het voorstel, bedoeld in het eerste lid, tweede volzin, dient te blijken dat de politieonderwijsraad
      voldoende acht heeft geslagen op de aansluiting van de politieopleidingen bij de beroepspraktijk alsmede de
      opleidingen voortgezet onderwijs, de opleidingen voor middelbaar en hoger beroepsonderwijs en het wetenschappelijk
      onderwijs.

      3 Bij ministeriële regeling worden op basis van de kwalificatiestructuur de politieopleidingen aangewezen.

      4 In de regeling, bedoeld in het derde lid, wijst Onze Minister politieopleidingen aan
      waarvan een beroepspraktijkvorming deel uitmaakt. De beroepspraktijkvorming wordt verzorgd op
      grondslag van een overeenkomst, gesloten door de Politieacademie, de student en de politie.
      [Artikel 7.7, vijfde lid, tweede volzin, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2] is
      van overeenkomstige toepassing op deze overeenkomst.

      5 Indien ten aanzien van bepaalde uitvoerende functies of taken bij of krachtens de wet vereisten zijn vastgesteld
      met betrekking tot de kwaliteiten op het gebied van kennis, inzicht, vaardigheden, houding, ervaring of
      persoonlijke eigenschappen waarover degenen die die functie of taak gaan vervullen, moeten beschikken, neemt Onze
      Minister deze vereisten in acht bij de vaststelling van de kwalificatiestructuur.

      6 De directeur van de Politieacademie draagt zorg voor de aanleg, het beheer en de bekendmaking van een centraal
      register politieopleidingen waarin de relatie met de kwalificatiestructuur en de onderliggende kwalificatiedossiers
      van de onderscheiden politieopleidingen zijn opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.4
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.7
