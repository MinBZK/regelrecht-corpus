  - number: '9'
    text: |-
      1 Bij algemene maatregel van bestuur wordt een ambtsinstructie voor de politie en voor de Koninklijke marechaussee
      vastgesteld.

      2 Indien de militair van enig ander onderdeel van de krijgsmacht op grond van deze wet bijstand verleent is de
      ambtsinstructie van toepassing.

      3 In de ambtsinstructie worden regels gesteld ter uitvoering van de [artikelen 6][ref1] en [7][ref2].

      4 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent maatregelen waaraan
      rechtens van hun vrijheid beroofde personen met het oog op hun insluiting kunnen worden onderworpen, voor zover dit
      noodzakelijk is in het belang van hun veiligheid of de veiligheid van anderen.

      5 Het vierde lid is van overeenkomstige toepassing op personen die ten behoeve van de hulpverlening aan hen zijn
      ondergebracht bij de politie of de Koninklijke marechaussee.

      6 De ambtenaren die door Onze Minister zijn aangewezen voor het vervoer van rechtens van hun vrijheid beroofde
      personen, kunnen de bevoegdheden, bedoeld in [artikel 7, eerste, derde en vierde lid][ref3], uitoefenen, dan wel de
      maatregelen, bedoeld in het vierde lid, treffen, voor zover dit noodzakelijk is om te voorkomen dat de te vervoeren
      persoon zich onttrekt aan het op hem uitgeoefende toezicht. De eerste volzin is van toepassing voor zover de
      rechtens van hun vrijheid beroofde personen zijn ondergebracht bij de politie of de Koninklijke marechaussee.

      7 De voordracht voor de algemene maatregel van bestuur, bedoeld in het eerste en het vierde lid, geschiedt door
      Onze Minister in overeenstemming met Onze Minister van Defensie voor zover het de Koninklijke marechaussee betreft.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel7
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel7
