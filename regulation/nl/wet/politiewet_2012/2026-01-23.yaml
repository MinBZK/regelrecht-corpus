  - number: 48l
    text: |-
      1 Voor zover in verband met een reorganisatie arbeidsplaatsen vervallen, wordt de ambtenaar van politie die de in
      [artikel 48j, eerste lid][ref1], bedoelde leeftijd heeft bereikt het eerst voor ontslag in aanmerking gebracht.
      In deze leeftijdsgroep worden vervolgens de ambtenaren met het kortste dienstverband het eerst voor ontslag in
      aanmerking gebracht.

      2 Bij voorschriften of regels op grond van [artikel 47, eerste lid][ref2], wordt bepaald welke diensttijd wordt
      meegeteld voor de berekening van de duur van het dienstverband, bedoeld in de tweede zin van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48j
