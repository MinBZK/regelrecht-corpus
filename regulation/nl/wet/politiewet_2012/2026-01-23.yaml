  - number: '69'
    text: |-
      1 Onze Minister van Defensie stelt de regels, bedoeld in [artikel 68, eerste lid][ref1], vast ten aanzien van
      klachten over gedragingen van militairen van de Koninklijke marechaussee dan wel van enig ander onderdeel van de
      krijgsmacht, bij de uitvoering van hun in deze wet omschreven taken.

      2 [Artikel 68, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel68
