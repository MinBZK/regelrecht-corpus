  - number: 48q
    text: |-
      1 Het verrichten van werkzaamheden als ambtenaar van politie als bedoeld in [artikel 2, onder a, b of c][ref1],
      is slechts mogelijk, indien hiertegen op grond van een onderzoek naar de betrouwbaarheid van de betrokkene geen
      bezwaar bestaat.

      2 Het eerste lid is niet van toepassing indien het bij of krachtens algemene maatregel van bestuur aangewezen
      werkzaamheden betreft waarin technische, administratieve en andere taken ten dienste van de politie worden
      uitgevoerd en het tot aanstelling, schorsing of ontslag bevoegd gezag heeft bepaald dat kan worden volstaan met een
      verklaring omtrent het gedrag.

      3 Het krachtens overeenkomst verrichten van werkzaamheden voor de politie is slechts mogelijk, indien de betrokken
      natuurlijk persoon in het bezit is van een verklaring omtrent het gedrag.

      4 In afwijking van het derde lid is het krachtens overeenkomst verrichten van bij of krachtens algemene maatregel
      van bestuur aangewezen werkzaamheden voor de politie die een risico kunnen vormen voor de integriteit van deze
      organisatie slechts mogelijk, indien hiertegen op grond van een onderzoek naar de betrouwbaarheid van de betrokken
      natuurlijke persoon geen bezwaar bestaat.

      5 Van een bezwaar als bedoeld in het eerste en vierde lid kan slechts sprake zijn, indien naar het oordeel van het
      tot aanstelling, schorsing en ontslag bevoegd gezag onderscheidenlijk de korpschef er onvoldoende waarborgen zijn
      dat de betrokkene betrouwbaar kan worden geacht.

      6 Van een bezwaar is in ieder geval sprake indien de betrokkene onherroepelijk is veroordeeld ter zake een bij
      algemene maatregel van bestuur aangewezen misdrijf, tenzij naar het oordeel van het tot aanstelling, schorsing
      en ontslag bevoegd gezag onderscheidenlijk de korpschef, gelet op de omstandigheden van het geval, ondanks een
      dergelijke onherroepelijke veroordeling, geen sprake is van onvoldoende waarborgen dat de betrokkene betrouwbaar
      kan worden geacht. Met een veroordeling wordt gelijkgesteld een strafbeschikking en het voldoen aan voorwaarden ter
      voorkoming van strafvervolging als bedoeld in [artikel 74, eerste lid, van het Wetboek van Strafrecht][ref2].

      7 In plaats van de verklaring omtrent het gedrag kan de betrokkene een met deze verklaring overeenkomend document,
      afgegeven door het daartoe bevoegde gezag in de staat van herkomst, overleggen.

      8 Het eerste tot en met vierde lid zijn niet van toepassing indien sprake is van een vertrouwensfunctie als bedoeld
      in [artikel 1, eerste lid, onder a, van de Wet veiligheidsonderzoeken][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0001854#Artikel74
      [ref3]: https://wetten.overheid.nl/BWBR0008277#Artikel1
