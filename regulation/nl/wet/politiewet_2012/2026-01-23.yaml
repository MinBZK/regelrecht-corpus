  - number: '48'
    text: |-
      Bij algemene maatregel van bestuur worden regels gesteld omtrent de rangen van de politie en tekens van bijzondere
      verdiensten.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48
  - number: 48a
    text: |-
      Beslag omvat in deze paragraaf ook de vordering, bedoeld in [artikel 19 van de Invorderingswet 1990][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0004770#Artikel19
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48a
    references:
      - id: ref1
        bwb_id: BWBR0004770
        artikel: '19'
  - number: 48b
    text: |-
      1 Op bezoldiging is, voor zover in deze afdeling niet anders is bepaald, beslag mogelijk overeenkomstig de
      voorschriften van het gemene recht.

      2 Kostenvergoedingen welke verband houden met de dienstverrichting zijn niet vatbaar voor beslag.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48b
  - number: 48c
    text: Door het bevoegd gezag onverschuldigd betaalde bezoldiging kan worden teruggevorderd.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48c
  - number: 48d
    text: |-
      1 Met de door het bevoegd gezag verschuldigde bezoldiging kan worden verrekend hetgeen de ambtenaar van politie als
      zodanig aan hem zelf verschuldigd is.

      2 Verrekening kan plaatshebben ondanks gelegd beslag of toegepaste korting als bedoeld in
      [artikel 48e, eerste lid][ref1].

      3 Verrekening is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn, met
      dien verstande dat verrekening van hetgeen wegens genoten huisvesting of voeding is verschuldigd
      eveneens kan plaatsvinden met dat deel van de bezoldiging dat de beslagvrije voet, bedoeld in de
      [artikelen 475c tot en met 475e van het Wetboek van Burgerlijke Rechtsvordering][ref2] vormt.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48e
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475c
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48d
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: 48e
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475c
  - number: 48e
    text: |-
      1 Het bevoegd gezag kan op de bezoldiging ten behoeve van een schuldeiser van de ambtenaar van politie een korting
      toepassen, mits de ambtenaar de vordering van de schuldeiser erkent of het bestaan van de vordering blijkt uit een
      in kracht van gewijsde gegane rechterlijke uitspraak dan wel uit een authentieke akte.

      2 Korting is slechts in zoverre geldig als een beslag op die bezoldiging geldig zou zijn.

      3 Beslag, faillissement, surséance van betaling en toepassing ten aanzien van de ambtenaar van de
      schuldsaneringsregeling natuurlijke personen sluiten korting uit.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48e
  - number: 48f
    text: |-
      Voor de toepassing van [artikel 475b, tweede lid, van het Wetboek van Burgerlijke Rechtsvordering][ref1]
      worden, onverminderd [artikel 48d, tweede lid][ref2], en [artikel 48e, derde lid][ref3], verrekening en korting
      gelijkgesteld met beslag.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel475b
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel48d
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel48e
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48f
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 475b
      - id: ref2
        bwb_id: BWBR0031788
        artikel: 48d
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
      - id: ref3
        bwb_id: BWBR0031788
        artikel: 48e
        hoofdstuk: '3'
        paragraaf: 3.5.2
        afdeling: '3.5'
  - number: 48g
    text: |-
      Indien verscheidene schuldeisers uit hoofde van beslag of korting aanspraak hebben op een deel van de bezoldiging
      geschiedt de verdeling naar evenredigheid van de inschulden, voor zover niet de ene schuldeiser voorrang heeft
      boven de anderen.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48g
  - number: 48h
    text: |-
      1 Overdracht, inpandgeving of elke andere handeling, waardoor de ambtenaar van politie enig recht op zijn
      bezoldiging aan een derde toekent is slechts geldig voor dat deel van de bezoldiging waarop beslag geldig zou zijn.

      2 Een volmacht tot voldoening of invordering van de bezoldiging is slechts geldig indien zij schriftelijk is
      verleend en is steeds herroepelijk.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48h
  - number: 48i
    text: |-
      Betaling of afgifte aan een gemachtigde, nadat een volmacht tot voldoening of invorderingen van bezoldiging is
      geëindigd, ontlast het bevoegd gezag, indien een gegeven opdracht tot de betaling of afgifte niet meer tijdig kon
      worden ingetrokken, toen het bevoegd gezag van het eindigen van de volmacht kennis kreeg.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel48i
  - number: 48j
    text: |-
      1 Voor de ambtenaar van politie die de in [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref1] bedoelde
      leeftijd heeft bereikt en die is aangesteld in tijdelijke dienst wordt bij voorschriften of regels op grond van
      [artikel 47, eerste lid][ref2], bepaald dat die aanstelling als een aanstelling in vaste dienst geldt vanaf de
      dag waarop:

      a. de door hetzelfde bevoegd gezag verleende aanstellingen in tijdelijke dienst elkaar met tussenpozen van
      niet meer dan zes maanden hebben opgevolgd en een periode van 48 maanden, deze tussenpozen inbegrepen, hebben
      overschreden;

      b. meer dan zes door hetzelfde bevoegd gezag verleende aanstellingen in tijdelijke dienst elkaar hebben opgevolgd
      met tussenpozen van niet meer dan zes maanden.

      2 Voor de vaststelling of de in het eerste lid bedoelde periode of het aantal opvolgende aanstellingen is
      overschreden, wordt bij de in het eerste lid genoemde voorschriften of regels bepaald dat slechts de aanstellingen
      in tijdelijke dienst in aanmerking worden genomen die zijn aangegaan na het bereiken van de in het eerste lid
      bedoelde leeftijd.


      [ref1]: https://wetten.overheid.nl/BWBR0002221#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel47
