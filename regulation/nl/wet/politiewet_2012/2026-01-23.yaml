  - number: '65'
    text: |-
      1 De Inspectie Justitie en Veiligheid, bedoeld in [artikel 57 van de Wet veiligheidsregio’s][ref1], is met het
      oog op een goede taakuitvoering door de politie en de Politieacademie belast met:

      a. het, onverminderd het gezag van de burgemeester en de officier van justitie, houden van toezicht op de
      taakuitvoering;

      b. het houden van toezicht op de kwaliteitszorg door de politie;

      c. het houden van toezicht op de kwaliteit van het politieonderwijs en de examinering;

      d. het verrichten van onderzoek, indien daar in bijzondere gevallen reden toe is, naar ingrijpende
      gebeurtenissen waarbij de politie betrokken is, tenzij de Onderzoeksraad voor veiligheid, bedoeld in
      [artikel 2 van de Rijkswet Onderzoeksraad voor veiligheid][ref2], naar het desbetreffende voorval een onderzoek
      instelt.

      2 De inspectie voert haar werkzaamheden uit onder gezag van Onze Minister.

      3 De korpschef en de directeur van de Politieacademie verlenen de inspectie de door deze verlangde ondersteuning
      bij de uitvoering van de werkzaamheden in het kader van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0027466#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0017613#Artikel2
