  - number: 48r
    text: |-
      1 Aan een onderzoek naar de betrouwbaarheid wordt onderworpen de betrokkene die werkzaamheden als bedoeld in
      [artikel 48q, eerste of vierde lid][ref1], wil verrichten.

      2 Het onderzoek naar de betrouwbaarheid omvat een onderzoek naar gegevens die uit het oogpunt van de integriteit
      van de politie van belang zijn voor het verrichten van deze werkzaamheden.

      3 Bij het onderzoek worden geraadpleegd de op de betrokkene betrekking hebbende:

      a. justitiële gegevens als bedoeld in
      [artikel 1, onder a, van de Wet justitiële en strafvorderlijke gegevens][ref2];

      b. politiegegevens als bedoeld in [artikelen 8][ref3], [9][ref4], [10][ref5] en
      [13 van de Wet politiegegevens][ref6];

      c. gegevens over gezondheid, voor zover verstrekt door de betrokkene dan wel personen of instanties als bedoeld
      in [artikel 48t, eerste lid, onder b][ref7], en die betrekking hebben op signalen wijzend op verslaving of een
      andersoortige afhankelijkheid, en

      d. andere bij of krachtens algemene maatregel van bestuur aangewezen gegevens, waaronder gegevens uit open bronnen,
      betreffende overige persoonlijke gedragingen en omstandigheden.

      4 Over diens betrouwbaarheid wordt de betrokkene in persoon gehoord.

      5 De betrokkene verleent medewerking aan het onderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48q
