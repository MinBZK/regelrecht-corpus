  - number: '94'
    text: |-
      1 Onze Minister stelt minimaal eenmaal in de vier jaar de strategische onderzoeksagenda vast. De strategische
      onderzoeksagenda omvat de strategische thema’s voor het toegepast wetenschappelijk onderzoek dat door de
      Politieacademie wordt uitgevoerd en voor het toegepast wetenschappelijk onderzoek dat wordt uitbesteed.

      2 De strategische onderzoeksagenda sluit aan op de politiepraktijk.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel94
  - number: '95'
    text: |-
      1 De directeur van de Politieacademie stelt jaarlijks, op basis van de in [artikel 94][ref1] bedoelde strategische
      onderzoeksagenda het onderzoeksprogramma van de Politieacademie vast.

      2 Het onderzoeksprogramma omvat in ieder geval een beschrijving van het toegepast wetenschappelijke onderzoek dat
      door de Politieacademie wordt uitgevoerd en de uit te besteden toegepast wetenschappelijke onderzoeken.

      3 Het onderzoeksprogramma bevat een meerjarenprogramma voor de drie jaren volgend op het programmajaar.

      4 Naast het onderzoeksprogramma kan de Politieacademie ander toegepast wetenschappelijk onderzoek verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel94
