      op de rijksrecherche. Bij ministeriële regeling kunnen regels omtrent de vereisten voor een goede taakuitvoering
      door de politie, gesteld krachtens [artikel 21][ref4], van overeenkomstige toepassing worden verklaard op de
      rijksrecherche.


