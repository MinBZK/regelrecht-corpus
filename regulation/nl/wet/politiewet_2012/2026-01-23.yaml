  - number: 68a
    text: |-
      1 Onze Minister stelt de regels, bedoeld in [artikel 68, eerste lid][ref1], vast ten aanzien van klachten over
      gedragingen van:

      a. de directeur van de Politieacademie en zijn plaatsvervanger;

      b. personen die ten behoeve van de Politieacademie politieonderwijs ontwikkelen en verzorgen, kennis ontwikkelen,
      onderzoek verrichten of onderwijsondersteunende werkzaamheden verrichten;

      c. personen die werkzaamheden verrichten binnen de staf van de Politieacademie.

      2 [Artikel 68, tweede en derde lid][ref2], is van overeenkomstige toepassing.

      3 Bij ministeriële regeling worden de functies of de categorieën van personen als bedoeld in het eerste lid, onder
      b en c, aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel68
