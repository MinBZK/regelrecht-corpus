  - number: 48m
    text: |-
      1 De ambtenaar van politie die de in [artikel 48j, eerste lid][ref1], bedoelde leeftijd heeft bereikt, kan worden
      ontslagen op grond van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte, indien:

      a. er sprake is van ongeschiktheid tot het verrichten van zijn arbeid wegens ziekte gedurende een ononderbroken
      periode van zes weken, en

      b. herstel van zijn ziekte niet binnen een periode van zes weken na de in onderdeel a genoemde periode van zes
      weken te verwachten is.

      2 Indien de ongeschiktheid wegens ziekte een aanvang heeft genomen voor de datum waarop de ambtenaar de in
      [artikel 48j, eerste lid][ref2], bedoelde leeftijd heeft bereikt, geldt vanaf die datum de in onderdeel a genoemde
      termijn van zes weken, voor zover het totale tijdvak niet meer bedraagt dan twee jaar.

      3 Voor de berekening van de periode van zes weken, bedoeld in het eerste lid, onderdeel a, worden perioden van
      ongeschiktheid tot het verrichten van arbeid wegens ziekte samengeteld indien zij elkaar met een onderbreking van
      minder dan vier weken opvolgen.

      4 Om te beoordelen of sprake is van een situatie als bedoeld in het eerste lid, onderdelen a en b, kan het
      bevoegd gezag een onderzoek naar en een oordeel over het bestaan van ongeschiktheid tot werken als bedoeld in
      [artikel 32, zesde lid, van de Wet structuur uitvoeringsorganisatie werk en inkomen][ref3] aanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48j
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel48j
      [ref3]: https://wetten.overheid.nl/BWBR0013060#Artikel32
