  - number: '41'
    text: |-
      De regioburgemeester en de hoofdofficier van justitie overleggen regelmatig met de politiechef van een regionale
      eenheid.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel41
  - number: 41a
    text: |-
      De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert en waarvan de
      grenzen van de gemeenten samenvallen met de indeling van de regio’s, genoemd in de [bijlage bij artikel 8 van de
      Wet Veiligheidsregio’s](onbekend), en de hoofdofficier van justitie kunnen ten minste eenmaal per jaar over het
      beleid en de taakuitvoering van de politie overleg voeren.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel41a
  - number: '42'
    text: |-
      1 Er zijn een of meer landelijke eenheden. Zij zijn belast met een of meer van de volgende taken:

      a. de landelijke en specialistische uitvoering van politietaken, in samenwerking met de regionale eenheden, de
      Koninklijke marechaussee en de in [artikel 10, tweede lid][ref1], bedoelde personen;

      b. het verzamelen, registreren, bewerken, beheren, analyseren en verstrekken van informatie en het verrichten van
      andere ondersteunende werkzaamheden ten behoeve van de taakuitvoering van de onder a genoemde organen en personen,
      en de andere bij de strafrechtelijke handhaving van de rechtsorde betrokken organen, alsmede de internationale
      uitwisseling van informatie en de landelijke voorlichting aan particulieren;

      c. het waken over de veiligheid van leden van het koninklijk huis en andere door Onze Minister aangewezen personen.

      2 Bij ministeriële regeling kunnen regels worden gesteld over de werkzaamheden, bedoeld in het eerste lid.

      3 De dagelijkse leiding van een landelijke eenheid berust bij de politiechef.

      4 De politiechef van een landelijke eenheid wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de
      benoeming wordt het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel10
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '10'
        hoofdstuk: '2'
        paragraaf: '2.2'
  - number: '43'
    text: |-
      1 Onze Minister kan de betrokken ambtenaren van politie voor zover het de uitoefening van de taken, bedoeld in
      [artikel 42, eerste lid, onder a en b][ref1], door het daartoe bestemde onderdeel of de daartoe bestemde onderdelen
      van een landelijke eenheid betreft, de nodige algemene en bijzondere aanwijzingen geven voor de vervulling van die
      taken, voor zover de politie optreedt bij of krachtens de wet of op grond van een verdrag of een besluit van een
      volkenrechtelijke organisatie onder verantwoordelijkheid van Onze Minister.

      2 De bevoegdheid, bedoeld in het eerste lid, komt eveneens toe aan Onze Minister met betrekking tot de vervulling
      van de taak, bedoeld in [artikel 42, eerste lid, onder c][ref2].

      3 Indien een regionale eenheid, de Koninklijke marechaussee of een ander onderdeel van de krijgsmacht bijstand
      verleent aan een landelijke eenheid ten behoeve van de taak, bedoeld in [artikel 42, eerste lid, onder c][ref3],
      kan Onze Minister aan de betrokken ambtenaren van politie dan wel militairen van de Koninklijke marechaussee of van
      een ander onderdeel van de krijgsmacht, algemene en bijzondere aanwijzingen geven.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel42
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel42
