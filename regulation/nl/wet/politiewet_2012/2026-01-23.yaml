preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een nieuwe regeling te treffen voor de organisatie en
    het beheer van de politie en daartoe de Politiewet 1993 te vervangen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *Onze Minister:* Onze Minister van Justitie en Veiligheid;
        - *politie:* het landelijke politiekorps, bedoeld in [artikel 25, eerste lid][ref1];
        - *korpschef:* de korpschef, bedoeld in [artikel 27][ref2];
        - *eenheid:* een regionale of landelijke eenheid;
        - *regionale eenheid:* een regionale eenheid van de politie als bedoeld in [artikel 25, eerste lid, onder a][ref3];
        - *landelijke eenheid:* een landelijke eenheid van de politie als bedoeld in
      [artikel 25, eerste lid, onder b][ref4];
        - *regioburgemeester:* de regioburgemeester, bedoeld in [artikel 38c][ref5];
        - *politiechef:* het hoofd van een regionale of landelijke eenheid;
        - taken ten dienste van de justitie: 1°. de uitvoering van wettelijke voorschriften waarmee Onze Minister is belast
      alsmede de uitvoering van wettelijke voorschriften gesteld bij of krachtens de [Vreemdelingenwet 2000][ref6]; 2°.
      de administratiefrechtelijke afdoening van inbreuken op wettelijke voorschriften, voor zover in die voorschriften
      het toezicht op de uitvoering van de politietaak is opgedragen aan het openbaar ministerie; 3°. de betekening van
      gerechtelijke mededelingen in strafzaken, het vervoer van rechtens van hun vrijheid beroofde personen, en de dienst
      bij de gerechten;
        - *wijkagent:* ambtenaar van politie die, gerelateerd aan het aantal inwoners, als onderdeel van een basisteam ten
      behoeve van een gemeente beschikbaar is voor de uitvoering van de politietaak;
        - *Politieacademie:* de Politieacademie, bedoeld in [artikel 73, eerste lid][ref7];
        - *directeur van de Politieacademie:* de directeur, bedoeld in [artikel 73, derde lid][ref8];
        - *raad van advies van de Politieacademie:* de raad van advies, bedoeld in [artikel 77][ref9];
        - *politieonderwijsraad:* de politieonderwijsraad, bedoeld in [artikel 82, eerste lid][ref10];
        - *politieonderwijs:* onderwijs gericht op de uitoefening van de politietaak;
        - *kwalificatie:* het geheel van bekwaamheden die een persoon kwalificeren voor het functioneren in een
      beroep of functie of een groep van samenhangende beroepen en in het vervolgonderwijs dat is beschreven in het
      kwalificatiedossier;
        - *kwalificatiedossier:* een document waarin onder meer de voor een beroep of functie vereiste kwalificaties zijn
      beschreven die benodigd zijn voor het verkrijgen van een diploma, deeldiploma of certificaat;
        - *kwalificatiestructuur:* het stelsel van kwalificatiedossiers;
        - *politieopleidingen:* opleidingen gericht op de uitoefening van de politietaak, waarvoor in
      de kwalificatiestructuur, bedoeld in [artikel 87][ref11], de kwalificaties zijn vastgesteld en
      ten bewijze waarvan na een met goed gevolg afgelegd examen wordt uitgereikt: 1°. een diploma ten
      bewijze van de behaalde kwalificatie op een niveau dat overeenkomt met een niveau als bedoeld in
      [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref12] of op een niveau dat op grond van
      [artikel 7.10a][ref13] of [artikel 7.10b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref14]
      recht geeft op het voeren van de graad Associate degree, Bachelor of Master; 2°. een deeldiploma ten bewijze
      dat een deel van een opleiding die wordt afgesloten met een diploma als bedoeld onder 1°, is afgerond; 3°. een
      certificaat;
        - *student:* degene die politieonderwijs volgt aan de Politieacademie;
        - *Algemene verordening gegevensbescherming:* verordening (EU) 2016/679 van het Europees Parlement en de Raad van
      27 april 2016 betreffende de bescherming van natuurlijke personen in verband met verwerking van persoonsgegevens
      en betreffende het vrije verkeer van die gegevens en tot intrekking van [Richtlijn 95/46/EG](31995L0046) (Algemene
      verordening gegevensbescherming) (PbEU 2016, L 119);
        - *verklaring omtrent het gedrag:* een verklaring omtrent het gedrag als bedoeld in
      [artikel 28 van de Wet justitiële en strafvorderlijke gegevens][ref15].

      2 In deze wet en de daarop berustende bepalingen wordt onder strafrechtelijke handhaving van de rechtsorde mede
      verstaan: het waken over de veiligheid van personen.


