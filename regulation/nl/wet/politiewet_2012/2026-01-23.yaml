  - number: 47a
    text: |-
      De ambtenaar van politie is niet gehouden tot dienstverrichting op voor hem op grond van zijn godsdienst of
      levensovertuiging geldende feest- en rustdagen, tenzij het dienstbelang dit onvermijdelijk maakt.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel47a
  - number: 47b
    text: |-
      1 Een ambtenaar van politie, die een functie in publiekrechtelijke colleges, waarin hij is benoemd of verkozen,
      gezien de omvang van de daaruit voortvloeiende werkzaamheden, niet gelijktijdig kan vervullen met zijn ambt,
      wordt in verband daarmee tijdelijk ontheven van de waarneming van zijn ambt, tenzij het dienstbelang zich
      tegen ontheffing verzet. Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het
      doorbetalen van bezoldiging.

      2 Indien de ambtenaar in verband met een functie in publiekrechtelijke colleges, waarin hij is benoemd of verkozen,
      niet op grond van het eerste lid van de waarneming van zijn ambt is ontheven, wordt hem voor het bijwonen van
      vergaderingen en zittingen van deze colleges en voor het verrichten van daaruit voortvloeiende werkzaamheden ten
      behoeve van deze colleges, buitengewoon verlof verleend, tenzij het dienstbelang zich tegen verlofverlening verzet.
      Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld over het doorbetalen van bezoldiging.

      3 Tenzij het dienstbelang zich tegen verlofverlening verzet, wordt aan de ambtenaar buitengewoon verlof verleend
      voor aan te wijzen activiteiten van of voor politievakorganisaties overeenkomstig regels te stellen bij of
      krachtens algemene maatregel van bestuur.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel47b
  - number: 47c
    text: |-
      1 Het bevoegd gezag maakt geen onderscheid tussen ambtenaren van politie op grond van een verschil in arbeidsduur
      in de voorwaarden waaronder een aanstelling wordt verleend, verlengd dan wel beëindigd, tenzij een dergelijk
      onderscheid objectief gerechtvaardigd is.

      2 Het bevoegd gezag maakt geen onderscheid tussen ambtenaren in de arbeidsvoorwaarden op grond van het al dan niet
      tijdelijk karakter van de aanstelling, tenzij een dergelijk onderscheid objectief gerechtvaardigd is.

      3 Het bevoegd gezag beëindigt het dienstverband met de ambtenaar niet wegens de omstandigheid dat betrokkene in of
      buiten rechte een beroep heeft gedaan op het eerste of tweede lid of ter zake bijstand heeft verleend.

      4 Het bevoegd gezag benadeelt de ambtenaar niet wegens de omstandigheid dat betrokkene in of buiten rechte een
      beroep heeft gedaan op het bepaalde in het eerste lid of tweede lid of ter zake bijstand heeft verleend.

      5 Het bevoegd gezag stelt de ambtenaar die is aangesteld in tijdelijke dienst tijdig en duidelijk in kennis van een
      vacature met een dienstverband voor onbepaalde tijd.

      6 Het College, bedoeld in [artikel 1 van de Wet College voor de rechten van de mens][ref1], kan onderzoeken of
      een onderscheid is of wordt gemaakt als bedoeld in dit artikel. De [artikelen 10][ref2], [11][ref3], [12][ref4],
      [13][ref5], [22][ref6] en [23 van de Wet College voor de rechten van de mens][ref7] zijn van overeenkomstige
      toepassing.


