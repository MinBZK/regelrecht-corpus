  - number: '89'
    text: |-
      De directeur van de Politieacademie draagt er zorg voor dat de politieopleidingen zodanig zijn ingericht dat
      de studenten de kwalificaties binnen de vastgestelde studieduur kunnen bereiken en dat het onderwijsprogramma
      evenwichtig is ingedeeld, alsmede voldoende begeleide onderwijsuren en uren beroepspraktijkvorming omvat.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel89
  - number: '90'
    text: |-
      1 De directeur van de Politieacademie stelt tijdig, ten behoeve van de studenten, voor elke politieopleiding
      en voor elke overige opleiding als bedoeld in [artikel 74, eerste lid, onder a, onder 2°][ref1], die
      wordt afgesloten met een examen een onderwijs- en examenregeling vast. De [artikelen 7.13][ref2] en
      [7.14 van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3] zijn van overeenkomstige toepassing op
      de onderwijs- en examenregeling.

      2 De onderwijs- en examenregeling wordt door de directeur van de Politieacademie tijdig bekendgemaakt, zodanig dat
      de aanstaande student zich een adequaat beeld kan vormen van de inhoud en inrichting van het politieonderwijs en
      de examens.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.13
      [ref3]: https://wetten.overheid.nl/BWBR0005682#Artikel7.14
