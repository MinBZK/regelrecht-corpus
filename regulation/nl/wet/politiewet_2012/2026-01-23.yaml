  - number: '46'
    text: |-
      1 De aanwijzing van het hoofd van een territoriaal onderdeel van een regionale eenheid, bedoeld in
      [artikel 13][ref1], geschiedt na verkregen instemming van de burgemeester en de officier van justitie.

      2 Indien het hoofd van een territoriaal onderdeel, bedoeld in het eerste lid, bij herhaling de afspraken over de
      inzet van de politie, bedoeld in [artikel 13, tweede lid][ref2], niet heeft uitgevoerd zonder dat daarvoor, naar
      het oordeel van de burgemeester of de officier van justitie, goede redenen zijn, kan de burgemeester of de officier
      van justitie Onze Minister verzoeken het hoofd van het territoriale onderdeel uit zijn functie te ontheffen.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel13
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel13
