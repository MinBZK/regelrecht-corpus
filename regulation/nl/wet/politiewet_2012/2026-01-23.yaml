  - number: '24'
    text: |-
      Bij algemene maatregel van bestuur kunnen regels worden gesteld over:

      a. de doeleinden waarvoor de politie, met inachtneming van het bepaalde bij of krachtens de
      [Wet politiegegevens][ref1], gegevens verwerkt of verder verwerkt en de categorieën van gegevens die de politie
      daartoe verwerkt, alsmede over de terbeschikkingstelling van gegevens ten behoeve van de uitvoering van de
      politietaak en de verstrekking van gegevens aan personen en instanties;

      b. de wijze waarop de politie gegevens verwerkt, daaronder begrepen de schrijfwijze en classificatie van gegevens,
      alsmede de wijze van vermelding van de herkomst van de gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0022463
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0022463
  - number: '25'
    text: |-
      1 Er is een landelijk politiekorps dat bestaat uit de volgende onderdelen:

      a. regionale eenheden, belast met de uitvoering van de politietaak;

      b. een of meer bij algemene maatregel van bestuur aan te wijzen landelijke eenheden, belast met de uitvoering van
      de politietaak;

      c. een of meer bij algemene maatregel van bestuur aan te wijzen ondersteunende diensten.

      2 Er is een regionale eenheid in elk van de arrondissementen, genoemd in de [Wet op de rechterlijke indeling][ref1],
      met dien verstande dat er één regionale eenheid in de arrondissementen Gelderland en Overijssel gezamenlijk is.

      3 Bij ministeriële regeling kan een gebied waarin een regionale eenheid de politietaak uitvoert worden opgedeeld in
      meerdere gebieden waarin een regionale eenheid de politietaak uitvoert.

      4 Een regionale eenheid kan in territoriale onderdelen worden verdeeld. Een territoriaal
      onderdeel kan slechts gelegen zijn in één regio, genoemd in de [bijlage](onbekend), bedoeld in
      [artikel 8 van de Wet veiligheidsregio’s][ref2], tenzij Onze Minister, op een gezamenlijk verzoek van de
      betrokken burgemeesters en officieren van justitie, besluit dat een territoriaal onderdeel in meerdere regio’s
      gelegen is.


      [ref1]: https://wetten.overheid.nl/BWBR0002080
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel8
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel25
