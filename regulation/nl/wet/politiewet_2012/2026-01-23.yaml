  - number: '70'
    text: |-
      1 De korpschef draagt zorg voor de behandeling van de klacht die is ingediend over een gedraging van een ambtenaar
      van politie die is tewerkgesteld bij een ondersteunende dienst.

      2 De politiechef van de regionale of landelijke eenheid draagt zorg voor de behandeling van de klacht die is
      ingediend over een gedraging van een ambtenaar van politie die bij die eenheid is tewerkgesteld.

      3 De korpschef draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van de
      politiechef.

      4 Het College van procureurs-generaal draagt zorg voor de behandeling van een klacht die is ingediend over een
      gedraging van een ambtenaar van de rijksrecherche.

      5 In afwijking van het eerste lid draagt de directeur van de Politieacademie zorg voor de behandeling van de
      klacht die is ingediend over een gedraging van een persoon die ten behoeve van de Politieacademie politieonderwijs
      ontwikkelt en verzorgt, kennis ontwikkelt, onderzoek verricht of onderwijsondersteunende werkzaamheden verricht of
      die werkzaamheden verricht binnen de staf van de Politieacademie.

      6 Onze Minister draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van de
      korpschef, de krachtens [artikel 28, derde lid][ref1], aangewezen leden van de leiding van de politie, de directeur
      van de Politieacademie en zijn plaatsvervanger.

      7 Onze Minister van Defensie draagt zorg voor de behandeling van een klacht die is ingediend over een gedraging van
      een militair van de Koninklijke marechaussee dan wel van enig ander onderdeel van de krijgsmacht, bij de uitvoering
      van zijn in deze wet omschreven taken.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel28
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel70
