  - number: '14'
    text: |-
      1 Voor zover de Koninklijke marechaussee in een gemeente optreedt ter handhaving van de openbare orde, staat zij
      onder gezag van de burgemeester. [Artikel 11, tweede lid][ref1], is van overeenkomstige toepassing.

      2 Voor zover de Koninklijke marechaussee optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken
      verricht ten dienste van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier
      van justitie. [Artikel 12, tweede lid][ref2], is van overeenkomstige toepassing.

      3 Indien de Koninklijke marechaussee optreedt als bedoeld in het eerste of tweede lid, neemt de commandant van de
      Koninklijke marechaussee deel aan het overleg, bedoeld in [artikel 13][ref3], tenzij sprake is van het verlenen van
      bijstand of assistentie aan de politie als bedoeld in [artikel 4, eerste lid, onder d][ref4], in welk geval de
      commandant van de Koninklijke marechaussee aan het overleg kan deelnemen.

      4 Het eerste en tweede lid zijn van overeenkomstige toepassing op de militair van enig ander onderdeel van de
      krijgsmacht, indien hij bijstand verleent.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
