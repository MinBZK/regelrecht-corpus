  - number: '88'
    text: |-
      De directeur van de Politieacademie stelt de studieduur van de politieopleiding waarbij het niveau overeenkomt
      met een niveau als bedoeld in [artikel 7.2.2, derde lid, van de Wet educatie en beroepsonderwijs][ref1] vast met
      inachtneming van de regels in [artikel 7.2.4a, tweede en derde lid, van de Wet educatie en beroepsonderwijs][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007625#Artikel7.2.2
