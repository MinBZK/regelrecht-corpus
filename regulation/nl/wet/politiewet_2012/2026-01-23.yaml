  - number: '60'
    text: |-
      Behoeft de rijksrecherche bijstand van de politie, dan verstrekt het College van procureurs-generaal op aanvraag
      van de officier van justitie aan de korpschef de nodige opdrachten en stelt het Onze Minister daarvan in kennis.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel60
  - number: '61'
    text: |-
      1 De politie kan bijstand verlenen aan de Koninklijke marechaussee.

      2 Behoeft de Koninklijke marechaussee bijstand van de politie, dan richt het gezag, bedoeld in
      [artikel 14, eerste of tweede lid][ref1], een verzoek daartoe aan Onze Minister.

      3 Onze Minister bepaalt of en op welke wijze bijstand wordt verleend en stelt het gezag hiervan in kennis. Indien
      bijstand wordt geleverd, stelt hij Onze Minister van Defensie hiervan in kennis.

      4 Behoeft de Koninklijke marechaussee bijstand van de politie voor een onderdeel van de politietaak dat op grond
      van de wet rechtstreeks onder verantwoordelijkheid van Onze Minister wordt uitgevoerd, dan bepaalt Onze Minister
      of en op welke wijze bijstand wordt verleend. Onze Minister stelt Onze Minister van Defensie in kennis van de
      bijstand.

      5 Onze Minister kan algemene en bijzondere aanwijzingen geven aan de betrokken ambtenaren van politie, voor zover
      die bijstand verlenen aan de Koninklijke marechaussee bij de taken als bedoeld in [artikel 4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
