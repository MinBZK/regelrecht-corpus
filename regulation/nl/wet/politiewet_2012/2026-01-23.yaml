        artikel: '12'
      - id: ref2
        bwb_id: BWBR0020495
        artikel: '15'
  - number: '74'
    text: |-
      1 De Politieacademie heeft tot taak:

      a. het ontwikkelen en verzorgen van politieonderwijs, bestaande uit het ontwikkelen en het verzorgen van:

      1°. politieopleidingen;

      2°. overige opleidingen, anders dan bedoeld onder 1°;

      3°. het examineren van de studenten die de opleidingen, bedoeld onder 1° of 2°, hebben gevolgd;

      b. het ontwikkelen van kennis over de politie of de politietaak en het bijdragen aan de ontwikkeling van de
      uitoefening van de politietaak waarop het politieonderwijs is gericht, onder meer door het verrichten van
      onderzoek.

      2 De Politieacademie verricht de in het eerste lid bedoelde taken ten behoeve van de politie. De politie neemt
      de in het eerste lid, onder a, bedoelde taken uitsluitend af bij de Politieacademie, onverminderd de taken van de
      Europese Politieacademie.

      3 De Politieacademie kan de in het eerste lid, bedoelde taken tevens uitvoeren ten behoeve van:

      a. de Koninklijke marechaussee, voor zover het betreft de uitvoering van de politietaak, en de rijksrecherche;

      b. door Onze Minister aangewezen categorieën van personen, andere openbare diensten of rechtspersonen, die een
      publiekrechtelijke taak uitoefenen op het terrein van politie, justitie of veiligheid.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel74
  - number: '75'
    text: |-
      1 De Politieacademie kan, na instemming van Onze Minister, andere werkzaamheden uitvoeren, dan de in
      [artikel 74, eerste lid][ref1], bedoelde taken, mits die werkzaamheden samenhangen met de in dat lid bedoelde
      taken.

      2 De vergoeding van de kosten voor de werkzaamheden, bedoeld in het eerste lid, door de afnemers van deze
      werkzaamheden zijn verschuldigd aan Onze Minister.

      3 Bij ministeriële regeling kunnen nadere regels worden gesteld over de uit te voeren werkzaamheden, bedoeld in het
      eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel75
