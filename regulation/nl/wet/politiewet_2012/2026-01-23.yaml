  - number: '44'
    text: |-
      1 Onze Minister kan, indien hij dit nodig acht in verband met de uitvoering van de taken, bedoeld in
      [artikel 42, eerste lid][ref1], daarvoor in aanmerking komende bestuursorganen opdragen de noodzakelijke
      medewerking te verlenen om door hem aangewezen personen tijdelijk van een aan te nemen identiteit te voorzien.

      2 De voor de bestuursorganen geldende wettelijke voorschriften ter zake van de verlangde werkzaamheden blijven,
      voor zover deze in de weg staan aan het verrichten van die werkzaamheden, buiten toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel42
