  - number: '85'
    text: |-
      1 Het politieonderwijs is gericht op de verwerving van kennis, inzicht, vaardigheden en houding, nodig voor de
      uitoefening van de politietaak. Het politieonderwijs bevordert tevens de algemene vorming en de persoonlijke
      ontplooiing van de studenten en draagt bij tot hun maatschappelijk functioneren.

      2 Het politieonderwijs sluit aan bij de door de politie aangegeven behoefte.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel85
  - number: '86'
    text: |-
      1 De Politieacademie biedt in samenwerking met de politie het politieonderwijs aan.

      2 Bij ministeriële regeling worden de opleidingen, bedoeld in [artikel 74, eerste lid, onder a, onder 2°][ref1],
      aangewezen, gehoord de korpschef en de directeur van de Politieacademie.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel74
