  - number: '79'
    text: |-
      1 De voorzitter en de overige leden van de raad van advies van de Politieacademie worden benoemd, herbenoemd,
      geschorst en ontslagen bij koninklijk besluit.

      2 Bij de samenstelling van de raad van advies van de Politieacademie wordt ervoor zorg gedragen dat deskundigheid
      op het terrein van de politie, onderwijs en wetenschappelijk onderzoek wordt gewaarborgd.

      3 De leden hebben geen directe belangen bij de Politieacademie. Zij hebben zitting op persoonlijke titel en oefenen
      hun functie uit zonder last of ruggespraak.

      4 De leden worden benoemd voor een periode van ten hoogste vier jaar. Zij kunnen eenmaal worden herbenoemd.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel79
  - number: '80'
    text: |-
      Ter ondersteuning van de raad van advies van de Politieacademie stelt de directeur van de Politieacademie sterkte
      feitelijk ter beschikking. De personen die werkzaam zijn ten behoeve van de raad van advies van de Politieacademie
      staan onder gezag van de raad van advies van de Politieacademie en leggen over hun werkzaamheden uitsluitend
      daaraan verantwoording af.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel80
  - number: '81'
    text: |-
      1 Voor zover bij of krachtens dit hoofdstuk of de [Kaderwet zelfstandige bestuursorganen][ref1] niet anders is
      bepaald, worden bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 47, eerste lid][ref2], voor
      de directeur van de Politieacademie en zijn plaatsvervanger regels gesteld over de in dat lid bedoelde onderwerpen.

      2 Voor zover uit de [Kaderwet zelfstandige bestuursorganen][ref3] niet anders voortvloeit, is
      [artikel 47, tweede lid][ref4], van overeenkomstige toepassing op de directeur van de Politieacademie en zijn
      plaatsvervanger.

      3 De [artikelen 44a][ref5], [47a][ref6], [47b][ref7], [47c][ref8] en de [paragrafen 3.5.2][ref9], [3.5.3.][ref10]
      en [3.5.4.][ref11] van deze wet alsmede [artikel 4 van de Ambtenarenwet 2017][ref12] zijn van overeenkomstige
      toepassing op de Politieacademie, met dien verstande dat:

      a. voor de toepassing van [artikel 47c][ref13] en de [paragrafen 3.5.2][ref14] en [3.5.3][ref15] onder bevoegd
      gezag wordt verstaan: Onze Minister;

      b. voor de toepassing van[ paragraaf 3.5.4][ref16] onder bevoegd gezag wordt verstaan:

      1°. Onze Minister, voor zover het betreft de directeur van de Politieacademie en zijn plaatsvervanger;

      2°. de directeur van Politieacademie, voor zover het betreft personen die krachtens overeenkomst werkzaamheden voor
      de Politieacademie gaan verrichten of verrichten;

      c. voor de toepassing van [artikel 4 van de Ambtenarenwet 2017][ref17] onder overheidswerkgever wordt verstaan:
      de Staat.

      4 Bij de algemene maatregel van bestuur, bedoeld in [artikel 48][ref18], worden regels gesteld omtrent de titulaire
      rang van de directeur van de Politieacademie en zijn plaatsvervanger.

      5 Bij of krachtens de algemene maatregel van bestuur, bedoeld in [artikel 22][ref19], worden regels gesteld omtrent
      de kleding van de directeur van de Politieacademie en zijn plaatsvervanger.


