  - number: '37'
    text: |-
      1 Onze Minister stelt jaarlijks een beheersplan en een jaarverslag vast voor de politie. De korpschef stelt een
      ontwerp van een beheersplan en een ontwerp van een jaarverslag op.

      2 Het beheersplan bevat in ieder geval de indeling van de eenheden als bedoeld in
      [artikel 25, eerste lid, onder a][ref1], in districten en basisteams.

      3 De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid zijn politietaak uitvoert en de
      hoofdofficier van justitie worden door de korpschef gehoord over de indeling van de regionale eenheid en de omvang
      van de onderdelen ervan.

      4 Het jaarverslag omvat een omschrijving van de realisatie van het beheersplan en een omschrijving van de
      door de regionale en landelijke eenheden gerealiseerde activiteiten ter verwezenlijking van de landelijke
      beleidsdoelstellingen, bedoeld in [artikel 18][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel18
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel37
