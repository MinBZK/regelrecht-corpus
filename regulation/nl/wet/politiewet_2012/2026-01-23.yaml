  - number: '66'
    text: |-
      1 De werkzaamheden die in het kader van [artikel 65, eerste lid, onder a tot en met d][ref1], worden uitgevoerd,
      worden jaarlijks door Onze Minister vastgesteld.

      2 De inspectie rapporteert, gevraagd of ongevraagd, rechtstreeks aan Onze Minister.

      3 Onze Minister zendt de Staten-Generaal jaarlijks een door de inspectie opgesteld verslag van de werkzaamheden die
      in het kader van [artikel 65, eerste lid][ref2], worden uitgevoerd.


