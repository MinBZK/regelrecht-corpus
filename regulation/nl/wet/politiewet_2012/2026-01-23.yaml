  - number: '93'
    text: |-
      1 De directeur van de Politieacademie stelt een commissie van beroep voor de examens in.
      [Artikel 7.5.3 van de Wet educatie en beroepsonderwijs][ref1] is van overeenkomstige toepassing op de leden van
      de commissie.

      2 De commissie oordeelt over beslissingen van de directeur van de Politieacademie ter uitvoering
      van de [artikelen 87, vierde lid][ref2], en [91][ref3], de examencommissie of de examinatoren. De
      [artikelen 7.5.1, vierde lid, tweede volzin][ref4], [7.5.4, derde tot en met zesde lid][ref5], en
      [7.5.5 van de Wet educatie en beroepsonderwijs][ref6] zijn van toepassing op de commissie.

      3 De leden van de commissie van beroep voor de examens oefenen hun taak uit zonder last of ruggespraak.

      4 De leden van de examencommissie en examinatoren verstrekken aan de commissie de inlichtingen die zij voor de
      uitvoering van haar taak nodig oordeelt.


