  - number: '47'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden voor de politie voorschriften vastgesteld betreffende:

      a. aanstelling, schorsing en ontslag;

      b. het onderzoek naar de geschiktheid en de bekwaamheid;

      c. bezoldiging en wachtgeld;

      d. diensttijden;

      e. verlof en vakantie;

      f. voorzieningen in verband met ziekte;

      g. bescherming bij de arbeid;

      h. woon-, verblijfs- en bereikbaarheidsverplichtingen;

      i. medezeggenschap;

      j. overige rechten en verplichtingen;

      k. disciplinaire straffen, met dien verstande dat een boete dan wel een inhouding of korting op de bezoldiging per
      opgelegde disciplinaire straf ten hoogste gelijk is aan het bedrag van het salaris van de ambtenaar over anderhalve
      maand;

      l. de instelling en werkwijze van commissies waaraan de beslissing met uitsluiting van administratieve organen is
      opgedragen, voor zover deze worden mogelijk gemaakt;

      m. de wijze, waarop met de daarvoor in aanmerking komende vakorganisaties van overheidspersoneel overleg wordt
      gepleegd over aangelegenheden van algemeen belang voor de rechtstoestand van de ambtenaren, alsmede de gevallen
      waarin overeenstemming in dat overleg dient te worden bereikt;

      n. de gevallen waarin berichten inzake de rechtspositie van de ambtenaar in afwijking van de
      [artikelen 2:7, tweede lid][ref1], en [2:8 van de Algemene wet bestuursrecht][ref2] uitsluitend elektronisch
      verzonden behoeven te worden en de voorwaarden die daarbij in acht worden genomen.

      2 De [paragrafen 2][ref3], [3][ref4] en [4 van de Ambtenarenwet 2017][ref5] zijn, met uitzondering van
      [artikel 6, tweede lid][ref6], van overeenkomstige toepassing op de politie.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel27
