    text: |-
      In afwijking van [artikel 9:11, eerste lid, van de Algemene wet bestuursrecht][ref1] wordt de klacht afgehandeld
      binnen tien weken of, indien een commissie als bedoeld in [artikel 68, tweede lid, onder a][ref2], is belast met de
      behandeling van en advisering over de klacht, binnen veertien weken na de ontvangst van het klaagschrift.


