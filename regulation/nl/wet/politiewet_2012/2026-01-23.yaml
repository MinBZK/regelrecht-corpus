  - number: '77'
    text: |-
      1 De Politieacademie heeft een raad van advies van de Politieacademie.

      2 De raad van advies van de Politieacademie adviseert de directeur van de Politieacademie desgevraagd of uit eigen
      beweging over de taakuitvoering door de Politieacademie.

      3 De directeur van de Politieacademie en zijn plaatsvervanger verstrekken de raad van advies van de Politieacademie
      desgevraagd alle gegevens en inlichtingen die deze voor de uitoefening van zijn taak nodig heeft.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel77
  - number: '78'
    text: |-
      1 De raad van advies van de Politieacademie bestaat uit ten minste drie en ten hoogste vijf leden, waaronder een
      voorzitter.

      2 De [artikelen 9][ref1], [11][ref2], [12, tweede lid][ref3], [13][ref4], [18][ref5], [39, eerste lid][ref6],
      en [41 van de Kaderwet zelfstandige bestuursorganen][ref7] zijn van overeenkomstige toepassing op de raad van
      advies van de Politieacademie, met dien verstande dat hij het jaarverslag, bedoeld in artikel 18, eerste lid, van
      de Kaderwet zelfstandige bestuursorganen tezamen met het jaarverslag van de directeur van de Politieacademie kan
      uitbrengen.

      3 De raad van advies van de Politieacademie stelt bij reglement in ieder geval regels vast omtrent zijn werkwijze.

      4 Onze Minister kent de leden van de raad van advies van de Politieacademie, ten laste van de Politieacademie, een
      vergoeding toe voor hun werkzaamheden. De leden hebben aanspraak op vergoeding door de Politieacademie van de door
      hen in de uitoefening van hun functie gemaakte reis- en verblijfkosten.


