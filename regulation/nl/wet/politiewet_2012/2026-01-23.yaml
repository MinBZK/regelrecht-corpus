  - number: '45'
    text: |-
      1 Voor zover zij niet bij koninklijk besluit worden benoemd, geschorst en ontslagen, worden de ambtenaren van
      politie, met uitzondering van de ambtenaren van de rijksrecherche, aangesteld, geschorst en ontslagen door de
      korpschef.

      2 Bij algemene maatregel van bestuur kan worden bepaald welke andere ambtenaren van politie dan die, bedoeld in
      de [artikelen 28, eerste en derde lid][ref1], [38, tweede lid][ref2], en [42, vierde lid][ref3], worden benoemd,
      geschorst en ontslagen bij koninklijk besluit.


