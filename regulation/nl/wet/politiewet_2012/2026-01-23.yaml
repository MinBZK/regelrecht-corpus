  - number: 48u
    text: |-
      1 Het onderzoek naar de betrouwbaarheid wordt pas ingesteld nadat het tot aanstelling, schorsing en ontslag
      bevoegd gezag onderscheidenlijk de korpschef de betrokkene overigens bekwaam en geschikt acht. De betrokkene wordt
      schriftelijk in kennis gesteld van de aanvang van het onderzoek naar de betrouwbaarheid.

      2 Een beslissing omtrent de betrouwbaarheid als bedoeld in [artikel 48q, eerste en vierde lid][ref1], wordt
      aangemerkt als een beschikking als bedoeld in [artikel 1:3, tweede lid, van de Algemene wet bestuursrecht][ref2].

      3 Het bevoegd gezag onderscheidenlijk de korpschef beslist omtrent de betrouwbaarheid zo spoedig mogelijk, doch
      uiterlijk binnen 8 weken na toezending of uitreiking van de kennisgeving, bedoeld in het eerste lid, tweede volzin.

      4 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over de te volgen procedure voor, tijdens
      en na het onderzoek naar de betrouwbaarheid.

      5 Het eerste lid is van overeenkomstige toepassing op het vragen naar een verklaring omtrent het gedrag en het
      instellen van een veiligheidsonderzoek.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48q
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel13
