  - number: '5'
    text: |-
      Bij regeling van Onze Minister in overeenstemming met Onze Minister van Defensie kunnen regels worden gegeven over
      de samenwerking van de politie met de Koninklijke marechaussee.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel5
  - number: '6'
    text: |-
      1 De ambtenaar van politie is bevoegd zijn taak uit te oefenen in het gehele land.

      2 Hoewel bevoegd in het gehele land, onthoudt de ambtenaar van politie die is tewerkgesteld bij een regionale
      eenheid, zich van optreden buiten zijn gebied van tewerkstelling, tenzij zijn optreden redelijkerwijs noodzakelijk
      is, dan wel ingevolge regels, gesteld bij of krachtens de wet, dan wel in opdracht of met toestemming van het
      bevoegd gezag over de politie.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel6
  - number: '7'
    text: |-
      1 De ambtenaar van politie die is aangesteld voor de uitvoering van de politietaak, is bevoegd in de rechtmatige
      uitoefening van zijn bediening geweld of vrijheidsbeperkende middelen te gebruiken, wanneer het daarmee beoogde
      doel dit, mede gelet op de aan het gebruik hiervan verbonden gevaren, rechtvaardigt en dat doel niet op een andere
      wijze kan worden bereikt. Aan het gebruik van geweld gaat zo mogelijk een waarschuwing vooraf.

      2 De ambtenaar van politie, bedoeld in het eerste lid, heeft toegang tot elke plaats, voor zover dat voor het
      verlenen van hulp aan hen die deze behoeven, redelijkerwijs nodig is.

      3 De ambtenaar van politie, bedoeld in het eerste lid, is bevoegd tot het onderzoek aan de kleding van personen
      en het onderzoek van de voorwerpen die personen bij zich dragen of met zich mee voeren bij de uitoefening van een
      hem wettelijk toegekende bevoegdheid of bij een handeling ter uitvoering van de politietaak, indien uit feiten of
      omstandigheden blijkt dat een onmiddellijk gevaar dreigt voor hun leven of veiligheid of die van de ambtenaar zelf
      of van derden, en dit onderzoek noodzakelijk is ter afwending van dit gevaar.

      4 De ambtenaar van politie, bedoeld in het eerste lid, is bevoegd een te vervoeren of in te sluiten persoon aan
      zijn kleding te onderzoeken op de aanwezigheid van voorwerpen die een gevaar voor de veiligheid van betrokkene of
      voor anderen kunnen vormen, alsmede daartoe de voorwerpen te onderzoeken die betrokkene bij zich draagt of met zich
      mee voert.

      5 Het hoofd van het territoriale onderdeel, bedoeld in [artikel 13, eerste lid][ref1], zijn plaatsvervanger of de
      ambtenaar van politie, belast met de leiding over de zorg voor ingeslotenen, kan bepalen dat een in te sluiten of
      ingesloten persoon bij binnenkomst of bij het verlaten van een politiecel of een politiecellencomplex, voorafgaand
      aan of na afloop van bezoek, dan wel indien dit anderszins noodzakelijk is in het belang van de handhaving
      van de orde of de veiligheid in het politiebureau of het cellencomplex, aan zijn lichaam wordt onderzocht.
      [Artikel 29, derde, vierde en vijfde lid, van de Penitentiaire beginselenwet][ref2] is van overeenkomstige
      toepassing.

      6 De officier van justitie kan bepalen dat een in te sluiten of ingesloten persoon in het lichaam wordt
      onderzocht, indien dit noodzakelijk is ter afwending van ernstig gevaar voor de handhaving van de orde
      of de veiligheid in het politiebureau of het cellencomplex dan wel voor de gezondheid van de ingeslotene.
      Het onderzoek in het lichaam wordt verricht door een arts of, in diens opdracht, door een verpleegkundige.
      [Artikel 31, derde lid, van de Penitentiaire beginselenwet][ref3] is van overeenkomstige toepassing.

      7 De uitoefening van de bevoegdheden, bedoeld in het eerste tot en met zesde lid, dient in verhouding tot het
      beoogde doel redelijk en gematigd te zijn.

      8 Het eerste tot en met vierde lid zijn van overeenkomstige toepassing op de militair van de Koninklijke
      marechaussee, indien hij optreedt in de rechtmatige uitoefening van zijn bediening, en op de militair van enig
      ander onderdeel van de krijgsmacht die op grond van deze wet bijstand verleent. Het vijfde en zesde lid zijn van
      overeenkomstige toepassing indien een persoon wordt of is ingesloten door de Koninklijke marechaussee, met dien
      verstande dat de beslissing, bedoeld in het vijfde lid, eerste volzin, wordt genomen door de commandant van de
      betrokken brigade, zijn plaatsvervanger of de militair van de Koninklijke marechaussee, belast met de zorg voor
      ingeslotenen.

      9 Onze Minister kan bepalen dat de in [artikel 142, eerste lid, van het Wetboek van Strafvordering][ref4]
      bedoelde buitengewone opsporingsambtenaren, voor zover door hem hetzij in persoon, hetzij per categorie of eenheid
      aangewezen, de bevoegdheden omschreven in het eerste, derde en vierde lid kunnen uitoefenen. Alsdan wordt met
      overeenkomstige toepassing van [artikel 9][ref5] een ambtsinstructie voor hen vastgesteld.


