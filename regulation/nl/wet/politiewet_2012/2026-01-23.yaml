  - number: '84'
    text: |-
      1 De politieonderwijsraad draagt bij aan het ontwikkelen en onderhouden van een kwalificatiestructuur als bedoeld
      in [artikel 87][ref1], gericht op de aansluiting en afstemming tussen het aanbod van politieopleidingen en de
      behoefte van de politie daaraan, mede in het licht van de arbeidsmarktperspectieven voor afgestudeerden, en mede
      gelet op van belang zijnde ontwikkelingen in internationaal verband.

      2 De politieonderwijsraad adviseert Onze Minister omtrent de eisen die worden gesteld aan de plaatsen waar de
      beroepspraktijkvorming wordt uitgevoerd.

      3 De politieonderwijsraad ziet toe op de aansluiting van de politieopleidingen op de
      [Wet educatie en beroepsonderwijs][ref2] en de [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref3].

      4 De politieonderwijsraad adviseert Onze Minister over de strategische onderzoeksagenda, bedoeld in
      [artikel 94][ref4].

      5 De politieonderwijsraad verzorgt de uitbesteding van het toegepast wetenschappelijk onderzoek, bedoeld in
      [artikel 95, tweede lid][ref5], en de begeleiding van dat onderzoek, die plaatsvinden onder verantwoordelijkheid
      van de directeur van de Politieacademie.

      6 De politieonderwijsraad geeft Onze Minister desgevraagd of uit eigen beweging zijn zienswijze.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel87
