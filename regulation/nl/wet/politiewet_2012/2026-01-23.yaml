  - number: '91'
    text: |-
      1 Elke politieopleiding wordt afgesloten met een examen. Overige door de Politieacademie verzorgde opleidingen
      kunnen worden afgesloten met een examen.

      2 Het examen omvat een onderzoek naar de kennis, het inzicht, de vaardigheden en de beroepshouding van de
      examinandus alsmede de beoordeling van de uitkomsten van dat onderzoek aan de hand van de vereisten in het
      kwalificatiedossier.

      3 De directeur van de Politieacademie geeft de studenten de gelegenheid een examen af te leggen.

      4 Het examen van een politieopleiding of overige opleiding waarvan een beroepspraktijkvorming deel uitmaakt,
      is eerst dan met goed gevolg afgesloten indien zowel de beroepspraktijkvorming als het overige deel van de
      politieopleiding met goed gevolg is afgesloten.

      5 Ten bewijze dat een examen met goed gevolg is afgelegd, wordt door de examencommissie een diploma, deeldiploma of
      certificaat uitgereikt, nadat de directeur van de Politieacademie heeft verklaard dat aan de procedurele eisen voor
      de afgifte is voldaan.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel91
  - number: '92'
    text: |-
      1 Elke politieopleiding of groep van politieopleidingen en elke opleiding als bedoeld in
      [artikel 74, eerste lid, onder a, onder 2°][ref1], die wordt afgesloten met een examen,
      of groep van dergelijke opleidingen aan de Politieacademie heeft een examencommissie.
      [Artikel 7.12, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderwijs][ref2] is op de
      examencommissie van toepassing.

      2 De directeur van de Politieacademie stelt de examencommissie in en benoemt de leden van de examencommissie.
      Op de benoeming, samenstelling, taken en bevoegdheden van de examencommissie zijn de [artikelen 7.12a][ref3] en
      [7.12b van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref4] van overeenkomstige toepassing.

      3 De leden van de examencommissie oefenen hun taak uit zonder last of ruggespraak.

      4 Voor het afnemen van examens en het vaststellen van de uitslag daarvan wijst de examencommissie examinatoren aan.
      De examinatoren verstrekken de examencommissie de gevraagde inlichtingen.


