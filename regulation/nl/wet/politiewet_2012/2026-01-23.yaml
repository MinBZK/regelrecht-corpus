        paragraaf: '1'
  - number: '76'
    text: |-
      1 De directeur van de Politieacademie en zijn plaatsvervanger worden benoemd, herbenoemd, geschorst en ontslagen bij
      koninklijk besluit. De [artikelen 9][ref1] en [12, tweede lid, van de Kaderwet zelfstandige bestuursorganen][ref2]
      zijn van overeenkomstige toepassing op de plaatsvervanger.

      2 De directeur van de Politieacademie en zijn plaatsvervanger kunnen niet tevens lid zijn van de raad van advies
      van de Politieacademie.

      3 Bij de benoeming van de directeur van de Politieacademie en zijn plaatsvervanger wordt ervoor zorg gedragen dat
      expertise op het terrein van de politie, het onderwijs en onderzoek wordt gewaarborgd.

      4 De directeur van de Politieacademie en zijn plaatsvervanger worden benoemd voor een periode van ten hoogste zes
      jaar. Zij kunnen eenmaal worden herbenoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel12
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel76
