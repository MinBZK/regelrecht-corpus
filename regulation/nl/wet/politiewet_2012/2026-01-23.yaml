  - number: '16'
    text: |-
      1 Onze Minister kan objecten en diensten aanwijzen waarvan bewaking of beveiliging door de politie noodzakelijk is
      in het belang van de veiligheid van de Staat of de betrekkingen van Nederland met andere mogendheden, dan wel met
      het oog op zwaarwegende belangen van de samenleving.

      2 De burgemeester draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voor zover dat
      geschiedt ter handhaving van de openbare orde.

      3 De officier van justitie draagt zorg voor de uitvoering van een besluit als bedoeld in het eerste lid, voor zover
      dat geschiedt ter strafrechtelijke handhaving van de rechtsorde.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel16
  - number: '17'
    text: |-
      1 Ten behoeve van de toepassing van de [artikelen 15, derde lid][ref1], en [16, tweede lid][ref2], verstrekken de
      burgemeesters en Onze Minister elkaar de gewenste inlichtingen.

      2 Bij ministeriële regeling kunnen regels worden gesteld ter uitvoering van het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel16
