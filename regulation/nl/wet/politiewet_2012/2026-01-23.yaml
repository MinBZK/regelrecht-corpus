  - number: '26'
    text: De politie heeft rechtspersoonlijkheid en is gevestigd in een door Onze Minister aan te wijzen gemeente.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel26
  - number: '27'
    text: |-
      1 De korpschef is belast met de leiding en het beheer van de politie. De korpschef legt over de uitoefening van
      zijn taken en bevoegdheden verantwoording af aan Onze Minister.

      2 De korpschef vertegenwoordigt de politie in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel27
  - number: '28'
    text: |-
      1 De korpschef wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de benoeming worden de
      regioburgemeesters en het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen. De
      korpschef wordt benoemd voor een periode van zes jaren en kan telkens worden herbenoemd voor een periode van drie
      jaren.

      2 De korpschef is een ambtenaar van politie als bedoeld in [artikel 2, onder a][ref1].

      3 Bij ministeriële regeling worden ambtenaren van politie aangewezen die deel uitmaken van de leiding van
      de politie. Zij worden bij koninklijk besluit benoemd, geschorst en ontslagen. Over de benoeming worden de
      regioburgemeesters en het College van procureurs-generaal in de gelegenheid gesteld advies uit te brengen. Onze
      Minister wijst uit het midden van de leiding van de politie een plaatsvervangend korpschef aan.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel2
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '2'
        hoofdstuk: '1'
  - number: '29'
    text: |-
      1 De volgende handelingen van de korpschef behoeven de instemming van Onze Minister:

      a. het sluiten van overeenkomsten die een door Onze Minister vast te stellen bedrag te boven gaan;

      b. het doen van investeringen die een door Onze Minister vast te stellen bedrag te boven gaan;

      c. het oprichten of mede oprichten van rechtspersonen dan wel het deelnemen daarin.

      2 De [artikelen 10:28 tot en met 10:31 van de Algemene wet bestuursrecht][ref1] zijn van overeenkomstige
      toepassing.

      3 Het is de korpschef verboden:

      a. leningen aan te gaan anders dan bij Onze Minister van Financiën;

      b. overeenkomsten aan te gaan waarbij hij zich verbindt tot zekerheidstelling met inbegrip van zekerheidstelling
      voor schulden van derden of waarbij hij zich als borg of hoofdelijk medeschuldenaar verbindt of zich voor een derde
      sterk maakt.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel1028
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel29
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 10:28
  - number: '30'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over het beheer van de politie. De
      voordracht voor een krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan
      vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.

      2 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister in overeenstemming met Onze
      Minister van Financiën, worden regels gesteld over het financieel beheer van de politie. De voordracht voor een
      krachtens dit lid vast te stellen algemene maatregel van bestuur wordt niet eerder gedaan dan vier weken nadat het
      ontwerp aan beide kamers der Staten-Generaal is overgelegd.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel30
  - number: '31'
    text: |-
      Onze Minister kan de korpschef algemene en bijzondere aanwijzingen geven met betrekking tot de uitoefening van
      diens taken en bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel31
  - number: '32'
    text: |-
      1 De korpschef verstrekt aan Onze Minister, gevraagd en ongevraagd, tijdig de inlichtingen die Onze Minister nodig
      heeft voor de uitoefening van zijn taak.

      2 Onze Minister kan inzage vorderen van gegevens en bescheiden, voor zover dat voor de uitoefening van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel32
  - number: '33'
    text: |-
      Onze Minister stelt jaarlijks ten laste van de begroting van zijn ministerie bijdragen ter beschikking aan de
      politie, mede met het oog op het feitelijk ter beschikking stellen van de sterkte aan de politieonderwijsraad en de
      sterkte en middelen aan de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel33
  - number: '34'
    text: |-
      Onze Minister stelt jaarlijks een begroting vast voor de politie voor het komende begrotingsjaar alsmede een
      meerjarenraming voor vier op het begrotingsjaar volgende jaren. De korpschef stelt een ontwerp van een begroting en
      een ontwerp van een meerjarenraming op.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel34
  - number: '35'
    text: |-
      Onze Minister stelt jaarlijks een jaarrekening vast van de politie, die mede betrekking heeft op
      de verantwoording van de rechtmatigheid van de besteding van middelen en die vergezeld gaat van een
      verklaring omtrent de getrouwheid van de jaarrekening, afgegeven door een accountant als bedoeld in
      [artikel 393, eerste lid, van Boek 2 van het Burgerlijk Wetboek][ref1]. De korpschef stelt een ontwerp van een
      jaarrekening op.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel35
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: '36'
    text: |-
      1 Onze Minister verdeelt de sterkte en middelen over de onderdelen van de politie, bedoeld
      in [artikel 25, eerste lid][ref1]. Hij bepaalt daarbij welk deel van de sterkte op grond van
      [artikel 83, eerste lid][ref2], feitelijk ter beschikking wordt gesteld aan de politieonderwijsraad en welk deel
      van de sterkte en middelen op grond van [artikel 96, eerste lid][ref3], feitelijk ter beschikking wordt gesteld aan
      de Politieacademie.

      2 Bij of krachtens algemene maatregel van bestuur worden regels gesteld over deze verdeling.

      3 De voordracht voor een krachtens dit artikel vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel83
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel96
