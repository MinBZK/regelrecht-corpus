  - number: '49'
    text: |-
      1 Er is een rijksrecherche. De rijksrecherche heeft tot taak het doen van onderzoek in opdracht van het College van
      procureurs-generaal, naar feiten of gedragingen die mogelijk een strafbaar feit opleveren.

      2 Het College van procureurs-generaal kan de rijksrecherche belasten met een onderzoek als bedoeld in het eerste
      lid indien inzet van de rijksrecherche is aangewezen:

      a. om iedere schijn van partijdigheid te vermijden bij een onderzoek naar feiten of gedragingen die de integriteit
      van de overheid kunnen aantasten en zijn begaan door natuurlijke personen of rechtspersonen belast met een publieke
      taak, of betrokken bij de uitvoering daarvan, of

      b. omwille van de bijzondere deskundigheid van de rijksrecherche in door het College van procureurs-generaal aan te
      wijzen gevallen.

      3 Het College van procureurs-generaal stelt Onze Minister in kennis van een aanwijzing als bedoeld in het tweede
      lid, onder b.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel49
  - number: '50'
    text: |-
