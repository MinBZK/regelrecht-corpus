  - number: '18'
    text: |-
      1 Onze Minister stelt, gehoord het College van procureurs-generaal en de regioburgemeesters, ten minste eenmaal in
      de vier jaar de landelijke beleidsdoelstellingen vast ten aanzien van de taakuitvoering van de politie.

      2 Indien daarvoor bijzondere redenen zijn, kunnen de landelijke beleidsdoelstellingen tussentijds worden gewijzigd
      of aangevuld, gehoord het College van procureurs-generaal en de regioburgemeesters.

      3 Zodra de landelijke beleidsdoelstellingen zijn vastgesteld, gewijzigd of aangevuld, zendt Onze Minister deze aan
      de Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel18
  - number: '19'
    text: |-
      1 Onze Minister voert, tezamen met de korpschef, ten minste viermaal per jaar overleg met de regioburgemeesters
      of een afvaardiging van de regioburgemeesters en de voorzitter van het College van procureurs-generaal over de
      taakuitvoering door en het beheer ten aanzien van de politie.

      2 Onze Minister wijst voor een periode van vier jaren twee burgemeesters aan die aan het overleg deelnemen. Zij
      zijn burgemeester van een gemeente met minder dan 100 000 inwoners. Zij kunnen niet tevens regioburgemeester zijn.
      Voor de aanwijzing wordt een aanbeveling gedaan door een door Onze Minister aangewezen orgaan.

      3 In het overleg wordt in elk geval gesproken over:

      a. de inrichting van de politie;

      b. de landelijke beleidsdoelstellingen, bedoeld in [artikel 18, eerste lid][ref1], en de doelstellingen, bedoeld
      in [artikel 20, eerste lid][ref2];

      c. de verdeling van sterkte, bedoeld in [artikel 36][ref3];

      d. de door Onze Minister voorgenomen begroting en meerjarenraming, bedoeld in [artikel 34][ref4], de door Onze
      Minister voorgenomen jaarrekening, bedoeld in [artikel 35][ref5] en het door Onze Minister voorgenomen beheersplan
      en jaarverslag, bedoeld in [artikel 37, eerste lid][ref6];

      e. de benoeming van de leden van de leiding van de politie, bedoeld in [artikel 28, derde lid][ref7];

      f. voorstellen van wet, ontwerpen van algemene maatregel van bestuur en ontwerpen van ministeriële regeling die
      geheel of voor een belangrijk deel betrekking hebben op de taakuitvoering door en het beheer ten aanzien van de
      politie, en

      g. de bijstand op basis van de [artikelen 56][ref8], [57][ref9], [58][ref10], [61][ref11] en [62][ref12].


