  - number: '57'
    text: |-
      1 De Koninklijke marechaussee kan bijstand verlenen aan de politie.

      2 Behoeft de politie bijstand van de Koninklijke marechaussee, dan richt het gezag, bedoeld in
      [artikel 11, eerste lid][ref1], of [artikel 12, eerste lid][ref2], een verzoek daartoe aan Onze Minister.

      3 Onze Minister bepaalt, in overeenstemming met Onze Minister van Defensie, of en op welke wijze bijstand wordt
      verleend en stelt het gezag hiervan in kennis.

      4 Behoeft de politie bijstand van de Koninklijke Marechaussee voor een onderdeel van de politietaak dat op grond
      van de wet rechtstreeks onder verantwoordelijkheid van Onze Minister wordt uitgevoerd, dan bepaalt Onze Minister,
      in overeenstemming met Onze Minister van Defensie, of en op welke wijze bijstand wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel57
