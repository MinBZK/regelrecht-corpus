  - number: '82'
    text: |-
      1 Er is een politieonderwijsraad.

      2 De politieonderwijsraad bestaat uit een oneven aantal van ten hoogste vijftien leden, onder wie de onafhankelijke
      voorzitter. De leden wijzen uit hun midden een plaatsvervangend voorzitter aan.

      3 In de politieonderwijsraad hebben, naast de voorzitter, in ieder geval als lid zitting:

      a. een burgemeester;

      b. een lid van de leiding van de politie en twee politiechefs;

      c. een lid van het openbaar ministerie;

      d. twee vertegenwoordigers vanuit de politievakorganisaties;

      e. een vertegenwoordiger van het beroepsonderwijs;

      f. een vertegenwoordiger van het hoger onderwijs;

      g. de directeur van de Politieacademie en zijn plaatsvervanger;

      h. een onafhankelijk lid dat deskundig is op het terrein van het toegepast wetenschappelijk onderzoek.

      4 De leden van de politieonderwijsraad worden bij koninklijk besluit benoemd, herbenoemd, geschorst en ontslagen.

      5 De leden van de politieonderwijsraad worden benoemd voor een periode van zes jaren. Zij kunnen ten hoogste
      eenmaal worden herbenoemd.

      6 Onze Minister kan adviserende leden of waarnemers benoemen.

      7 Bij of krachtens algemene maatregel van bestuur worden nadere regels gesteld omtrent de organisatie en de
      werkwijze van de politieonderwijsraad.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel82
  - number: '83'
    text: |-
      1 De korpschef stelt het door Onze Minister vastgestelde deel van de sterkte als bedoeld in
      [artikel 36, eerste lid, tweede volzin][ref1], feitelijk ter beschikking aan de politieonderwijsraad voor de
      uitvoering van de taken, bedoeld in de [artikelen 84][ref2], [87, eerste lid][ref3], en [94, eerste lid][ref4].

      2 Bij ministeriële regeling worden de functies of categorieën aangewezen van personen
      die op grond van het eerste lid feitelijk ter beschikking kunnen worden gesteld.
      [Artikel 97, eerste lid, onder a en b, en tweede lid, onder b][ref5], is van overeenkomstige toepassing op de
      voorzitter van de politieonderwijsraad ten aanzien van de personen, bedoeld in de eerste volzin.

      3 De personen die werkzaam zijn ten behoeve van de politieonderwijsraad staan onder gezag van de voorzitter
      van de politieonderwijsraad en leggen over hun werkzaamheden uitsluitend aan hem verantwoording af.
      [Artikel 97, vierde lid][ref6], is van overeenkomstige toepassing.


