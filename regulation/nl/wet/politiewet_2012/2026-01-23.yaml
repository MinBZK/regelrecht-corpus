  - number: 25b
    text: |-
      1 De meldkamerfunctie bestaat uit het ontvangen, registreren en beoordelen van meldingen waarbij wordt gevraagd
      om acute inzet van politie, ambulancezorg, brandweer of Koninklijke marechaussee, het bieden van een adequaat
      hulpaanbod en het begeleiden en coördineren van de hulpdiensten.

      2 De meldkamerfunctie wordt uitgevoerd op een meldkamer als bedoeld in [artikel 25a, eerste lid][ref1].

      3 De politie voert op een meldkamer de meldkamerfunctie ten behoeve van de brandweertaak uit, indien daartoe een
      besluit is genomen als bedoeld in [artikel 35, tweede lid, van de Wet veiligheidsregio’s][ref2].

      4 De politie verzorgt het aannemen van de meldingen, tenzij bij de regeling, bedoeld in
      [artikel 23, vierde lid][ref3], anders is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0027466#Artikel35
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel23
