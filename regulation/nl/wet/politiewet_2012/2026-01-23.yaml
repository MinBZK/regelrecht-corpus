  - number: 48z
    text: |-
      1 Het bevoegd gezag onderscheidenlijk de korpschef is de verwerkingsverantwoordelijke, bedoeld in artikel
      4, onder 7, van de Algemene verordening gegevensbescherming, ten aanzien van de maatregelen, bedoeld in de
      [artikelen 48q tot en met 48y][ref1].

      2 Het bevoegd gezag onderscheidenlijk de korpschef is bevoegd:

      a. de gegevens, bedoeld in de [artikelen 48r, derde lid][ref2], [48s, tweede lid][ref3], [48t][ref4] en [48x][ref5]
      te verwerken, voor zover dit noodzakelijk is voor de uitvoering van het onderzoek naar de betrouwbaarheid van de
      betrokkene;

      b. de gegevens, bedoeld in [artikel 48v, vierde lid][ref6], te verwerken, voor zover dit noodzakelijk is voor de
      toepassing van [artikel 48v, tweede lid][ref7];

      c. de gegevens, bedoeld in [artikel 48w, eerste en tweede lid][ref8], te verwerken, voor zover dit noodzakelijk is
      om na te gaan of ten aanzien van de betrokkene geen bezwaar bestaat tegen het blijven verrichten van werkzaamheden
      als ambtenaar van politie onderscheidenlijk werkzaamheden als bedoeld in [artikel 48q, derde of vierde lid][ref9].

      3 De gegevens, bedoeld in de [artikelen 48r, derde lid][ref10], [48s, tweede lid][ref11], [48t][ref12],
      [48v, vierde lid][ref13], [48x][ref14] en [48y][ref15] worden niet voor een ander doel verwerkt dan waarvoor zij
      zijn verzameld. Zij worden niet langer dan vijf jaren bewaard in een vorm die het mogelijk maakt de betrokkene te
      identificeren voor het doel waarvoor de gegevens worden verwerkt.


