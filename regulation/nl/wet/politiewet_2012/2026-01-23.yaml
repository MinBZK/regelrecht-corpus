  - number: '62'
    text: |-
      1 In bijzondere gevallen kunnen andere onderdelen van de krijgsmacht bijstand verlenen aan de Koninklijke
      marechaussee. Daarbij kunnen door Onze Minister, in overeenstemming met Onze Minister van Defensie, nadere regels
      of beleidsregels worden gegeven over de uitoefening van bevoegdheden krachtens deze wet.

      2 Behoeft de Koninklijke marechaussee bijstand van andere onderdelen van de krijgsmacht, dan richt het gezag,
      bedoeld in [artikel 14, eerste of tweede lid][ref1], een verzoek daartoe aan Onze Minister.

      3 Onze Minister bepaalt, in overeenstemming met Onze Minister van Defensie, of en op welke wijze bijstand wordt
      verleend en stelt het gezag hiervan in kennis.

      4 Behoeft de Koninklijke marechaussee bijstand van andere onderdelen van de krijgsmacht voor een onderdeel van de
      politietaak dat op grond van de wet rechtstreeks onder verantwoordelijkheid van Onze Minister wordt uitgevoerd, dan
      bepaalt Onze Minister, in overeenstemming met Onze Minister van Defensie, of en op welke wijze de bijstand wordt
      verleend.

      5 Onze Minister kan algemene en bijzondere aanwijzingen geven aan de betrokken militairen van de andere onderdelen
      van de krijgsmacht, voor zover die bijstand verlenen aan de Koninklijke marechaussee bij de taken als bedoeld in
      [artikel 4, derde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel4
