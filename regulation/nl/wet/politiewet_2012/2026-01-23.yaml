  - number: '3'
    text: |-
      De politie heeft tot taak in ondergeschiktheid aan het bevoegd gezag en in overeenstemming met de geldende
      rechtsregels te zorgen voor de daadwerkelijke handhaving van de rechtsorde en het verlenen van hulp aan hen die
      deze behoeven.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel3
  - number: '4'
    text: |-
      1 Aan de Koninklijke marechaussee, die onder het beheer van Onze Minister van Defensie staat, zijn, onverminderd
      het bepaalde bij of krachtens andere wetten, de volgende politietaken opgedragen:

      a. het waken over de veiligheid van de leden van het koninklijk huis, in samenwerking met andere daartoe aangewezen
      organen;

      b. de uitvoering van de politietaak ten behoeve van Nederlandse en andere strijdkrachten, alsmede internationale
      militaire hoofdkwartieren, en ten aanzien van tot die strijdkrachten en hoofdkwartieren behorende personen;

      c. de uitvoering van de politietaak op de luchthaven Schiphol en op de andere door Onze Minister en Onze Minister
      van Defensie aangewezen luchtvaartterreinen, alsmede de beveiliging van de burgerluchtvaart;

      d. de verlening van bijstand alsmede de samenwerking met de politie krachtens deze wet, daaronder begrepen
      de assistentieverlening aan de politie bij de bestrijding van grensoverschrijdende criminaliteit, het bewaken
      en beveiligen van objecten en diensten en het waken over de veiligheid van aangewezen personen als bedoeld in
      [artikel 42, eerste lid, onder c][ref1];

      e. de uitvoering van de politietaak op plaatsen onder beheer van Onze Minister van Defensie, op verboden plaatsen
      die krachtens de [Wet bescherming staatsgeheimen][ref2] ten behoeve van de landsverdediging zijn aangewezen,
      alsmede op het terrein van de ambtswoning van Onze Minister-President;

      f. de uitvoering van de bij of krachtens de [Vreemdelingenwet 2000][ref3] opgedragen taken, waaronder begrepen de
      bediening van de daartoe door Onze Minister van Asiel en Migratie aangewezen doorlaatposten en het, voor zover in
      dat verband noodzakelijk, uitvoeren van de politietaak op en nabij deze doorlaatposten, alsmede het verlenen van
      medewerking bij de aanhouding of voorgeleiding van een verdachte of veroordeelde;

      g. de bestrijding van mensensmokkel en van fraude met reis- en identiteitsdocumenten;

      h. het in opdracht van Onze Minister en Onze Minister van Defensie ten behoeve van De Nederlandsche Bank N.V.
      verrichten van beveiligingswerkzaamheden.

      2 Onder personen die behoren tot de andere strijdkrachten en internationale hoofdkwartieren, bedoeld in het eerste
      lid, onder b, worden mede begrepen de personen, aangewezen bij algemene maatregel van bestuur op voordracht van
      Onze Minister van Defensie.

      3 Onze Minister kan de commandant van de Koninklijke marechaussee algemene en bijzondere aanwijzingen geven, voor
      zover het betreft:

      a. de uitoefening van de taken, bedoeld in het eerste lid, onder a en h;

      b. het waken over de veiligheid van door Onze Minister aangewezen personen als bedoeld in het eerste lid, onder
      b en d;

      c. de uitoefening van de taak, bedoeld in het eerste lid, onder c, ten behoeve van de strafrechtelijke handhaving
      van de rechtsorde en de beveiliging van de burgerluchtvaart;

      d. de bewaking en beveiliging van de ambtswoning van Onze Minister-President, bedoeld in het eerste lid, onder e.

      4 Hoewel bevoegd tot de opsporing van alle strafbare feiten, onthoudt de militair van de Koninklijke marechaussee
      die is aangewezen krachtens [artikel 141 van het Wetboek van Strafvordering][ref4], zich van optreden anders dan in
      het kader van de uitvoering van zijn politietaken, bedoeld in het eerste lid.


