  - number: '58'
    text: |-
      1 In bijzondere gevallen kunnen andere onderdelen van de krijgsmacht bijstand verlenen aan de politie. Daarbij
      kunnen door Onze Minister, in overeenstemming met Onze Minister van Defensie, nadere regels of beleidsregels worden
      gegeven over de uitoefening van bevoegdheden krachtens deze wet.

      2 Behoeft de politie bijstand van andere onderdelen van de krijgsmacht, dan richt het gezag, bedoeld in
      [artikel 11, eerste lid][ref1], of [artikel 12, eerste lid][ref2], een verzoek daartoe aan Onze Minister.

      3 Onze Minister bepaalt, in overeenstemming met Onze Minister van Defensie, of en op welke wijze bijstand wordt
      verleend en stelt het gezag hiervan in kennis.

      4 Behoeft de politie bijstand van andere onderdelen van de krijgsmacht voor een onderdeel van de politietaak dat
      op grond van de wet rechtstreeks onder verantwoordelijkheid van Onze Minister wordt uitgevoerd, dan bepaalt Onze
      Minister in overeenstemming met Onze Minister van Defensie, of en op welke wijze bijstand wordt verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel12
