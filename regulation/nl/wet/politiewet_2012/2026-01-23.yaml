  - number: '103'
    text: |-
      1 Onze Minister zendt binnen vijf jaar na inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk, met uitzondering van [hoofdstuk 8][ref1].

      2 In afwijking van het eerste lid zendt Onze Minister binnen drie jaar na inwerkingtreding van
      deze wet aan de Staten-Generaal een verslag over de doeltreffendheid en de effecten van deze wet in
      de praktijk in de regionale eenheid in de arrondissementen, bedoeld in de [artikelen 5a][ref2] en
      [11 van de Wet op de rechterlijke indeling][ref3].


