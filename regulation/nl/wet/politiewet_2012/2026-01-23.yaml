  - number: '2'
    text: |-
      Ambtenaren van politie in de zin van deze wet zijn:

      a. ambtenaren die zijn aangesteld voor de uitvoering van de politietaak;

      b. ambtenaren die zijn aangesteld voor de uitvoering van technische, administratieve en andere taken ten dienste
      van de politie;

      c. vrijwillige ambtenaren die zijn aangesteld voor de uitvoering van de politietaak, onderscheidenlijk voor de
      uitvoering van technische, administratieve en andere taken ten dienste van de politie;

      d. ambtenaren van de rijksrecherche die zijn aangesteld voor de uitvoering van de politietaak, onderscheidenlijk
      voor de uitvoering van technische, administratieve en andere taken ten dienste van de rijksrecherche.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel2
  - number: 2a
    text: |-
      1 De personen die met inachtneming van [artikel 96, eerste lid][ref1], werkzaam zijn ten
      behoeve van de Politieacademie, worden gelijkgesteld met ambtenaren van politie als bedoeld in
      [artikel 2, onder a, b, of c][ref2], voor zover zij direct daaraan voorafgaand ambtenaren van politie als
      bedoeld in artikel 2, onder a, b onderscheidenlijk c, waren. De eerste volzin is van overeenkomstige toepassing
      op de personen die met inachtneming van [artikel 83, eerste lid][ref3], werkzaam zijn ten behoeve van de
      politieonderwijsraad.

      2 In afwijking van [artikel 16 van de Kaderwet zelfstandige bestuursorganen][ref4] zijn de [artikelen 11][ref5]
      en [12][ref6] op de personen, bedoeld in het eerste lid, die zijn aangesteld voor de uitvoering van de
      politietaak, van toepassing, voor zover zij optreden ter handhaving van de openbare orde of ter uitvoering van de
      hulpverleningstaak onderscheidenlijk ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten
      dienste van de justitie.


