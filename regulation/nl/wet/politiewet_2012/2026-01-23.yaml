    text: |-
      1 Met de behandeling van en advisering over klachten zijn belast een of meer commissies, bestaande uit
      onafhankelijke leden.

      2 Het eerste lid is niet van toepassing indien na behandeling door Onze Minister, Onze Minister van Defensie, het
      College van procureurs-generaal, de korpschef of de politiechef naar tevredenheid van de klager aan diens klacht
      tegemoet is gekomen.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel67a
  - number: '68'
    text: |-
      1 Onze Minister stelt nadere regels vast over de behandeling van klachten over gedragingen van ambtenaren van
      politie.

      2 In de regels, bedoeld in het eerste lid, wordt voorzien in:

      a. de instelling van een of meer commissies, bestaande uit onafhankelijke leden, die op de wijze in de regeling te
      bepalen zijn belast met de behandeling van en advisering over klachten waarbij zo nodig aandacht wordt geschonken
      aan de in onderdeel c genoemde aspecten;

      b. de registratie van de mondeling en schriftelijk ingediende klachten en, indien beschikbaar, de daarop genomen
      beslissingen, en

      c. een jaarlijkse publicatie van de geregistreerde klachten en beslissingen, waarin wordt aangegeven in hoeverre
      bepaalde klachten wijzen op structurele tekortkomingen in het functioneren van de politie en waarin, zo nodig,
      aandacht wordt geschonken aan de middelen om deze tekortkomingen op te heffen.

      3 [Afdeling 9.1.3 van de Algemene wet bestuursrecht][ref1] is van toepassing op de behandeling van klachten
      als bedoeld in het tweede lid, onder a. Indien een commissie over de klacht zal adviseren, deelt degene die
      ingevolge [artikel 70][ref2] verantwoordelijk is voor de behandeling van een klacht dit, in afwijking van
      [artikel 9:15, eerste lid, van de Algemene wet bestuursrecht][ref3], zo spoedig mogelijk aan de indiener van de
      klacht mede.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Afdeling9.1.3
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel70
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel915
