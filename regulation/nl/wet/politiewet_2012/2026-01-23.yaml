  - number: 48n
    text: |-
      1 In afwijking van de in [artikel 48m, eerste en tweede lid][ref1], genoemde termijn van 6 weken, geldt tot een
      bij koninklijk besluit te bepalen tijdstip een termijn van dertien weken voor de ambtenaar van politie die de in
      [artikel 7, onderdeel a, van de Algemene Ouderdomswet][ref2] bedoelde leeftijd heeft bereikt.

      2 Indien de ongeschiktheid wegens ziekte een aanvang heeft genomen voor de datum waarop de ambtenaar de in het
      eerste lid bedoelde leeftijd heeft bereikt, geldt vanaf die datum de in het eerste lid genoemde termijn, voor zover
      het totale tijdvak niet meer bedraagt dan 104 weken.

      3 Indien de ongeschiktheid tot het verrichten van arbeid wegens ziekte een aanvang heeft genomen
      voor het op grond van het eerste lid vast te stellen tijdstip blijft voor de periode, genoemd in
      [artikel 48m, eerste lid, onderdeel a][ref3], de in het eerste lid genoemde termijn van dertien weken gelden.

      4 Het tijdstip, bedoeld in het eerste lid, wordt niet eerder vastgesteld dan nadat:

      a. Onze Minister van Sociale Zaken en Werkgelegenheid een verslag over de doeltreffendheid en de effecten van de
      [Wet werken na de AOW-gerechtigde leeftijd][ref4] in de praktijk gedurende de eerste twee jaren na inwerkingtreding
      van die wet, aan de beide kamers der Staten-Generaal heeft gezonden; en

      b. acht weken zijn verstreken nadat het voornemen tot het vaststellen van dat tijdstip is meegedeeld aan de beide
      kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel48m
