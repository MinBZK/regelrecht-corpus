  - number: '97'
    text: |-
      1 De directeur van de Politieacademie doet een aanbeveling voor en heeft een instemmingsrecht bij:

      a. de aanstelling van personen die ten behoeve van de Politieacademie politieonderwijs ontwikkelen en verzorgen,
      kennis ontwikkelen, onderzoek verrichten of onderwijsondersteunende werkzaamheden verrichten of die werkzaamheden
      verrichten binnen de staf van de Politieacademie;

      b. de selectie van personen die ten behoeve van de Politieacademie politieonderwijs ontwikkelen en verzorgen,
      kennis ontwikkelen, onderzoek verrichten of onderwijsondersteunende werkzaamheden verrichten of die werkzaamheden
      verrichten binnen de staf van de Politieacademie, met het oog op het feitelijk ter beschikking stellen, bedoeld in
      [artikel 96, eerste lid][ref1].

      2 De directeur van de Politieacademie heeft een instemmingsrecht bij:

      a. de selectie van de middelen die noodzakelijk zijn voor de uitvoering van de taken van de Politieacademie,
      bedoeld in de [artikelen 74][ref2] en [75][ref3];

      b. de beëindiging van het feitelijk ter beschikking stellen van personen die ten behoeve van de Politieacademie
      politieonderwijs ontwikkelen en verzorgen, kennis ontwikkelen, onderzoek verrichten of onderwijsondersteunende
      werkzaamheden verrichten of die werkzaamheden verrichten ten behoeve van de staf van de Politieacademie,
      onverminderd [artikel 36, eerste lid][ref4];

      c. de beëindiging van het feitelijk ter beschikking stellen van de middelen, bedoeld onder a, onverminderd
      [artikel 36, eerste lid][ref5].

      3 Bij ministeriële regeling worden de functies of de categorieën van personen als bedoeld in de eerste lid, onder a
      en b, en tweede lid, onder b, aangewezen.

      4 De directeur van de Politieacademie draagt er zorg voor dat de personen die werkzaam zijn ten behoeve van de
      Politieacademie in de gelegenheid worden gesteld de aan hun aanstelling als ambtenaar van politie verbonden rechten
      en verplichtingen na te komen.


