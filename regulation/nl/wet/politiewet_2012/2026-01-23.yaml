  - number: 44a
    text: |-
      1 Voor de toepassing van deze afdeling wordt verstaan onder:

        - *ambtenaar van politie:* de ambtenaar van politie, bedoeld in [artikel 2, onder a, b of c][ref1];
        - *bevoegd gezag:* 1°. Onze Minister, voor zover het betreft de korpschef; 2°. de korpschef, voor zover het betreft
      de ambtenaar van politie, met uitzondering van de korpschef;
        - *bezoldiging:* 1°. de bedragen – onder de benaming bezoldiging of welke benaming ook – waarop de ambtenaar
      als zodanig uit hoofde van zijn dienstbetrekking aanspraak heeft; 2°. de bedragen – onder de benaming pensioen,
      wachtgeld, uitkering of welke benaming ook – waarop de gewezen ambtenaar als zodanig uit hoofde van zijn vroegere
      dienstbetrekking aanspraak heeft of waarop zijn nagelaten betrekkingen uit hoofde van zijn overlijden aanspraak
      hebben.

      2 Voor de toepassing van de [artikelen 47b][ref2] en [47c][ref3] en de [paragrafen 3.5.2][ref4]. en [3.5.3][ref5].
      wordt mede verstaan onder ambtenaar van politie: de nagelaten betrekkingen van een ambtenaar van politie die uit
      hoofde van zijn overlijden pensioen genieten.


