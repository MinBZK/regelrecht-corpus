        afdeling: '3.2'
  - number: 23a
    text: |-
      1 De hoofdlijnen van beleid en beheer met betrekking tot de meldkamers, bedoeld in [artikel 25a, eerste lid][ref1],
      worden vastgesteld bij regeling van Onze Minister, in overeenstemming met Onze Minister voor Medische Zorg en de
      Regionale Ambulancevoorzieningen voor zover het de ambulancezorg betreft, met de besturen van de veiligheidsregio’s
      voor zover het de brandweertaak, de rampenbestrijding, de crisisbeheersing en de geneeskundige hulpverlening
      betreft, en met Onze Minister van Defensie voor zover het de Koninklijke marechaussee betreft.

      2 De hoofdlijnen kunnen betrekking hebben op de samenwerking bij de uitvoering van de meldkamerfuncties, bedoeld in
      [artikel 25b, eerste lid][ref2].

      3 Onze Ministers, bedoeld in het eerste lid, de Regionale Ambulancevoorzieningen en de besturen van de
      veiligheidsregio’s voeren, in aanwezigheid van de korpschef, ten minste tweemaal per jaar overleg over
      het functioneren van de meldkamers en over de samenwerking bij de uitvoering van de meldkamerfuncties.
      In dit overleg wordt in ieder geval gesproken over de onderdelen van de stukken, bedoeld in
      [artikel 19, derde lid, onder d][ref3], die daarop betrekking hebben.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25a
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel25b
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel19
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel23a
    references:
