  - number: '73'
    text: |-
      1 Er is een Politieacademie.

      2 De Politieacademie heeft rechtspersoonlijkheid.

      3 De directeur van de Politieacademie is belast met de leiding en het beheer van de Politieacademie. Hij
      vertegenwoordigt de Politieacademie in en buiten rechte.

      4 De [artikelen 12, eerste lid][ref1], en [15 van de Kaderwet zelfstandige bestuursorganen][ref2] zijn niet van
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel15
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel73
