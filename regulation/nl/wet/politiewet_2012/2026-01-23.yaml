  - number: 48v
    text: |-
      1 Het bevoegd gezag onderscheidenlijk de korpschef oefent een continue controle uit op:

      a. ambtenaren van politie als bedoeld in [artikel 2, onder a, b en c][ref1];

      b. personen die werkzaamheden als bedoeld in [artikel 48q, vierde lid][ref2], verrichten.

      2 De continue controle bestaat uit een doorlopende controle op veranderingen in de justitiële documentatie, bedoeld
      in [artikel 1, onder g, van de Wet justitiële en strafvorderlijke gegevens][ref3], van deze personen, teneinde na
      te gaan of ten aanzien van hen geen bezwaar bestaat tegen het blijven verrichten van werkzaamheden als ambtenaar
      van politie als bedoeld in [artikel 2, onder a, b of c][ref4], onderscheidenlijk werkzaamheden als bedoeld in
      [artikel 48q, vierde lid][ref5].

      3 Ten behoeve van de continue controle worden door het bevoegd gezag onderscheidenlijk de korpschef de naam en het
      burgerservicenummer, bedoeld in [artikel 1, onder b, van de Wet algemene bepalingen burgerservicenummer][ref6], van
      deze personen periodiek verstrekt aan Onze Minister.

      4 Justitiële gegevens van personen als bedoeld in het eerste lid worden door Onze Minister ambtshalve verstrekt aan
      het bevoegd gezag onderscheidenlijk de korpschef met het oog op toepassing van het tweede lid.

      5 Het eerste lid is niet van toepassing indien het een vertrouwensfunctie of een functie waarvan is bepaald dat een
      verklaring omtrent het gedrag is vereist, betreft.


