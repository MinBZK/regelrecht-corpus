  - number: '38'
    text: |-
      1 De dagelijkse leiding van een regionale eenheid berust bij de politiechef.

      2 De politiechef van een regionale eenheid wordt bij koninklijk besluit benoemd, geschorst en ontslagen. Over de
      benoeming worden de regioburgemeester en de hoofdofficier van justitie in de gelegenheid gesteld advies uit te
      brengen. Alvorens het advies wordt uitgebracht, hoort de regioburgemeester de burgemeesters van de gemeenten in het
      gebied waarin de regionale eenheid de politietaak uitvoert.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel38
  - number: 38a
    text: |-
      1 Er is ten minste één wijkagent werkzaam per 5 000 inwoners.

      2 Bij algemene maatregel van bestuur worden nadere regels gegeven.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel38a
  - number: 38b
    text: |-
      1 De gemeenteraad stelt ten minste eenmaal in de vier jaar de doelen vast die de gemeente op het terrein van de
      veiligheid nastreeft door de handhaving van de openbare orde en de hulpverlening door de politie.

      2 Voorafgaand aan de vaststelling van het beleidsplan, bedoeld in [artikel 39, eerste lid][ref1], hoort de
      burgemeester van een gemeente in het gebied waarin de regionale eenheid de politietaak uitvoert, de gemeenteraad
      van die gemeente over het ontwerpbeleidsplan.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel38b
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: 38c
    text: |-
      1 Onze Minister wijst voor elk gebied waarin een regionale eenheid de politietaak uitvoert voor een periode van
      vier jaren een regioburgemeester aan. De burgemeesters van de gemeenten in dat gebied worden in de gelegenheid
      gesteld een gezamenlijke aanbeveling voor de aanwijzing te doen. Onze Minister volgt bij de aanwijzing in beginsel
      de aanbeveling, tenzij zwaarwegende gronden aanleiding tot afwijking geven. Onze Minister motiveert een afwijking.

      2 De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert, kunnen Onze
      Minister gezamenlijk verzoeken de regioburgemeester van zijn functie te ontheffen. De derde en vierde volzin van
      het eerste lid zijn van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel38c
  - number: 38d
    text: |-
      De regioburgemeester legt over de uitoefening van zijn taken op grond van deze wet en zijn bevoegdheid op grond
      van [artikel 39, tweede lid][ref1], verantwoording af aan de overige burgemeesters van de gemeenten in het gebied
      waarin de regionale eenheid de politietaak uitvoert.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel39
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel38d
    references:
      - id: ref1
        bwb_id: BWBR0031788
        artikel: '39'
        hoofdstuk: '3'
        afdeling: '3.3'
  - number: '39'
    text: |-
      1 De burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de politietaak uitvoert en de
      hoofdofficier van justitie stellen ten minste eenmaal in de vier jaar, met inachtneming van de doelstellingen,
      bedoeld in [artikel 20, eerste lid][ref1], het beleidsplan en jaarlijks het jaarverslag voor de regionale eenheid
      vast. Het beleidsplan omvat in ieder geval de verdeling van de beschikbare politiesterkte waaronder de beschikbare
      wijkagenten, bedoeld in [artikel 38a, eerste lid][ref2], over de onderdelen van de regionale eenheid, rekening
      houdend met het belang van een goede vervulling van de politietaak in alle betrokken gemeenten en de doelen,
      bedoeld in [artikel 38b, eerste lid][ref3].

      2 Indien het beleidsplan of het jaarverslag niet overeenkomstig de eerste volzin van het eerste lid kunnen worden
      vastgesteld, stelt de regioburgemeester in overeenstemming met de hoofdofficier van justitie het beleidsplan
      respectievelijk het jaarverslag vast.

      3 Indien de regioburgemeester en de hoofdofficier van justitie niet met elkaar tot overeenstemming kunnen komen
      over de in het tweede lid bedoelde stukken, legt de regioburgemeester dit verschil van zienswijze schriftelijk voor
      aan Onze Minister die alsdan beslist. De regioburgemeester brengt de stukken in overeenstemming met de beslissing
      van Onze Minister.

      4 De regioburgemeester zendt het beleidsplan en het jaarverslag aan Onze Minister en de korpschef.

      5 Tegen het besluit tot vaststelling van het beleidsplan, bedoeld in het tweede lid, kan de burgemeester van een
      gemeente in het gebied waarin de regionale eenheid de politietaak uitvoert beroep instellen bij Onze Minister. Deze
      beoordeelt of het beleidsplan op onaanvaardbare wijze afbreuk doet aan het belang van een goede vervulling van de
      politietaak in de betreffende gemeente.

      6 De regioburgemeester brengt het beleidsplan in overeenstemming met het besluit van Onze Minister zonder
      dat hiervoor de instemming van de burgemeesters van de gemeenten in het gebied waarin de regionale eenheid de
      politietaak uitvoert en de hoofdofficier van justitie noodzakelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel38a
      [ref3]: https://wetten.overheid.nl/BWBR0031788#Artikel38b
