        artikel: '8'
  - number: 25a
    text: |-
      1 Een meldkamer is de fysieke plaats waar de meldkamerfunctie, bedoeld in [artikel 25b, eerste lid][ref1], wordt
      uitgevoerd. De politie heeft meldkamers. Er zijn tien meldkamers.

      2 Bij algemene maatregel van bestuur wordt voor elke meldkamer de locatie aangewezen, alsmede het gebied waarvoor
      op die meldkamer de meldkamerfunctie wordt uitgevoerd.

      3 De politie draagt er zorg voor dat op elke meldkamer ook voor de werkgebieden van de andere meldkamers de
      meldkamerfunctie kan worden uitgevoerd.

      4 De meldkamerfunctie wordt voor het werkgebied van een andere meldkamer uitgevoerd indien dat noodzakelijk is voor
      de uitvoering van de meldkamerfunctie voor dat werkgebied.

      5 De politie draagt er zorg voor dat de meldkamers kunnen worden gebruikt voor de uitvoering van de meldkamerfunctie
      ten behoeve van de ambulancezorg, bedoeld in [artikel 5, eerste lid, van de Wet ambulancezorgvoorzieningen][ref2].

      6 De politie draagt er zorg voor dat de meldkamers kunnen worden gebruikt voor de uitvoering van de
      meldkamerfunctie ten behoeve van de brandweertaak en ten behoeve van de rampenbestrijding, de crisisbeheersing en
      de geneeskundige hulpverlening, bedoeld in [artikel 1 van de Wet veiligheidsregio’s][ref3].

      7 De politie draagt er zorg voor dat ten minste één meldkamer kan worden gebruikt voor de uitvoering van de
      meldkamerfunctie ten behoeve van de taken van de Koninklijke marechaussee.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel25b
      [ref2]: https://wetten.overheid.nl/BWBR0043925#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0027466#Artikel1
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel25a
