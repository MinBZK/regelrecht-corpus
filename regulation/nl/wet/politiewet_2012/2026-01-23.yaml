  - number: '98'
    text: |-
      1 De directeur van de Politieacademie stelt een bestuursreglement vast.

      2 In het bestuursreglement worden ten minste vastgelegd:

      a. de wijze waarop de directeur van de Politieacademie de uitoefening van zijn taken en bevoegdheden afstemt met de
      raad van advies van de Politieacademie;

      b. een nadere regeling van de organisatorische inrichting van de Politieacademie;

      c. de samenstelling en de werkwijze van de leiding van organisatorische onderdelen van de Politieacademie;

      d. de taken en bevoegdheden die zijn opgedragen aan de leiding van het desbetreffende onderdeel.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel98
  - number: '99'
    text: |-
      1 Onze Minister stelt jaarlijks ten laste van de begroting van zijn ministerie bijdragen ter beschikking aan de
      Politieacademie voor de bekostiging van:

      a. de directeur van de Politieacademie en zijn plaatsvervanger;

      b. de leden van de raad van advies van de Politieacademie;

      c. de leden van de examencommissie en van de commissie van beroep voor de examens, voor zover het geen ambtenaren
      van politie zijn;

      d. het aangaan van samenwerkingsverbanden met onderwijsinstellingen;

      e. de uit te besteden toegepast wetenschappelijke onderzoeken.

      2 De Politieacademie gebruikt de geldmiddelen, bedoeld in het eerste lid, uitsluitend ter vervulling van de in het
      eerste lid bedoelde kosten.

      3 Het is de Politieacademie verboden:

      a. personeel in dienst te nemen, onverminderd de directeur van de Politieacademie, zijn plaatsvervanger en de leden
      van de raad van advies van de Politieacademie;

      b. huur-, koop- en leaseovereenkomsten aan te gaan;

      c. leningen aan te gaan en overeenkomsten aan te gaan waarbij zij zich verbindt tot zekerheidstelling met inbegrip
      van zekerheidstelling voor schulden van derden of waarbij zij zich als borg of hoofdelijk medeschuldenaar verbindt
      of zich voor een derde sterk maakt.

      4 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister in overeenstemming met Onze
      Minister van Financiën worden regels worden gesteld over het financieel beheer van de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel99
  - number: '100'
    text: |-
      1 De directeur van de Politieacademie stelt ten minste eenmaal in de vier jaar een beleidsplan vast. Het
      beleidsplan wordt voor 15 november aan Onze Minister gezonden.

      2 De directeur van de Politieacademie stelt jaarlijks een meerjarenraming vast voor vier op het
      begrotingsjaar volgende jaren. De meerjarenraming wordt tegelijk met de begroting, bedoeld in
      [artikel 26 van de Kaderwet zelfstandige bestuursorganen][ref1], aan Onze Minister toegezonden.

      3 De directeur van de Politieacademie stelt jaarlijks een jaarplan vast voor de Politieacademie. Het jaarplan wordt
      voor 1 juni aan Onze Minister gezonden.

      4 De stukken, bedoeld in het eerste en tweede lid, worden algemeen verkrijgbaar gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0020495#Artikel26
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0020495
        artikel: '26'
  - number: '101'
    text: |-
      Onze Minister, de korpschef en de directeur van de Politieacademie voeren ten minste viermaal per jaar overleg. In
      het overleg wordt gesproken over de werking van de regels bij of krachtens dit hoofdstuk, waaronder in ieder geval:

      a. het pakket van politieonderwijs;

      b. de beoordeling van de uitvoering van het politieonderwijs;

      c. de uitvoering van de strategische onderzoeksagenda;

      d. de ter beschikking stelling van sterkte en middelen aan de Politieacademie.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel101
  - number: '102'
    text: |-
      1 De directeur van de Politieacademie draagt er zorg voor dat, zoveel mogelijk in samenwerking
      met andere onderwijsinstellingen, wordt voorzien in een regelmatige beoordeling, mede door
      onafhankelijke deskundigen, van de kwaliteit van de werkzaamheden van de Politieacademie.
      [Artikel 1.18, tweede en derde volzin, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref1] is
      van overeenkomstige toepassing op de directeur van de Politieacademie.

      2 Onze Minister ziet toe op de uitvoering van het eerste lid.

      3 Bij ministeriële regeling kunnen regels worden gesteld omtrent het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005682#Artikel1.18
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel102
