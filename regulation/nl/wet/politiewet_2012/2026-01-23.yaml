  - number: '59'
    text: |-
      1 Er zijn een of meer bijzondere bijstandseenheden bestaande uit personeel van de politie, de Koninklijke
      marechaussee of andere onderdelen van de krijgsmacht. Deze bijzondere bijstandseenheden worden belast met bij
      regeling van Onze Minister en Onze Minister van Defensie aangewezen bijzondere onderdelen van de politietaak.

      2 Behoeft de politie, de rijksrecherche of de Koninklijke marechaussee bijstand van een bijzondere bijstandseenheid
      als bedoeld in het eerste lid, dan richt het gezag als bedoeld in [artikel 12, eerste lid][ref1] of
      [artikel 14, tweede lid][ref2], door tussenkomst van het College van procureurs-generaal, een verzoek daartoe aan
      Onze Minister.

      3 Indien bijstand door een bijzondere bijstandseenheid als bedoeld in het eerste lid nodig is, bepaalt Onze
      Minister of en op welke wijze die bijzondere bijstandseenheid wordt ingezet. Onze Minister stelt Onze Minister van
      Defensie onverwijld in kennis van de inzet.

      4 Behoeft de politie of de Koninklijke marechaussee bijstand van een bijzondere bijstandseenheid als bedoeld
      in het eerste lid voor de uitoefening van een onderdeel van de politietaak dat op grond van de wet rechtstreeks
      onder verantwoordelijkheid van Onze Minister wordt uitgevoerd, dan bepaalt Onze Minister of en op welke wijze de
      bijzondere bijstandseenheid wordt ingezet. Onze Minister kan algemene en bijzondere aanwijzingen geven aan het
      personeel, bedoeld in het eerste lid, dat de bijstand verleent. Onze Minister stelt Onze Minister van Defensie
      onverwijld in kennis van de inzet.

      5 Bij regeling van Onze Minister en Onze Minister van Defensie kunnen nadere regels worden gesteld omtrent de
      uitvoering van het tweede, derde en vierde lid, alsmede de organisatie van de bijzondere bijstandseenheden.

      6 Bij of krachtens algemene maatregel van bestuur op voordracht van Onze Minister en Onze Minister van Defensie
      kunnen regels worden gesteld over de bewapening, de uitrusting en de bekwaamheid van het personeel van de
      bijzondere bijstandseenheden.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel12
      [ref2]: https://wetten.overheid.nl/BWBR0031788#Artikel14
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel59
