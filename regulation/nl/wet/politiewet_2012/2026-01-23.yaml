  - number: '11'
    text: |-
      1 Indien de politie in een gemeente optreedt ter handhaving van de openbare orde en ter uitvoering van de
      hulpverleningstaak, staat zij onder gezag van de burgemeester.

      2 De burgemeester kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling van de in
      het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel11
  - number: '12'
    text: |-
      1 Indien de politie optreedt ter strafrechtelijke handhaving van de rechtsorde, dan wel taken verricht ten dienste
      van de justitie, staat zij, tenzij in enige wet anders is bepaald, onder gezag van de officier van justitie.

      2 De officier van justitie kan de betrokken ambtenaren van politie de nodige aanwijzingen geven voor de vervulling
      van de in het eerste lid bedoelde taken.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel12
  - number: '13'
    text: |-
      1 De burgemeester en de officier van justitie overleggen regelmatig tezamen met het hoofd van het territoriale
      onderdeel van de regionale eenheid binnen welker grondgebied de gemeente geheel of ten dele valt, en zo nodig met
      de politiechef van een regionale eenheid, over de taakuitvoering van de politie en over het beleid ten aanzien van
      de taakuitvoering (driehoeksoverleg).

      2 In het driehoeksoverleg worden door de burgemeester en de officier van justitie afspraken gemaakt over de inzet
      van de politie ten behoeve van de handhaving van de openbare orde en de hulpverlening, onderscheidenlijk ten
      behoeve van de strafrechtelijke handhaving van de rechtsorde en de taken ten dienste van de justitie. De afspraken
      worden mede gemaakt op basis van de doelen, bedoeld in [artikel 38b, eerste lid][ref1].

      3 Op verzoek van de burgemeester vindt het driehoeksoverleg plaats op gemeentelijk niveau.

      4 In het driehoeksoverleg worden door de burgemeester en de officier van justitie afspraken gemaakt over lokale
      prioriteiten en criminaliteitsbestrijding.


      [ref1]: https://wetten.overheid.nl/BWBR0031788#Artikel38b
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel13
