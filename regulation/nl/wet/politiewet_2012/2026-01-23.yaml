  - number: '52'
    text: |-
      Het College van procureurs-generaal stelt ten minste eenmaal in de vier jaar een beleidsplan en jaarlijks een
      begroting, een financieel verslag en een jaarverslag met betrekking tot de rijksrecherche vast. Deze behoeven de
      goedkeuring van Onze Minister.
    url: https://wetten.overheid.nl/BWBR0031788/2026-01-23#Artikel52
  - number: '53'
    text: |-
      1 De ambtenaren van de rijksrecherche worden aangesteld, geschorst en ontslagen door het College van procureurs-
      generaal.

      2 Het bepaalde krachtens [artikel 45, tweede lid][ref1], is van overeenkomstige toepassing op de ambtenaren van
      de rijksrecherche.

      3 De [artikelen 44a][ref2], [47][ref3], [47a][ref4], [47b][ref5], [47c][ref6] en [48][ref7] en de
      [paragrafen 3.5.2.][ref8], [3.5.3.][ref9] en [3.5.4][ref10] zijn van overeenkomstige toepassing op de
      rijksrecherche.


