preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van het fiscale beleid voor het jaar 2007 wenselijk is
    maatregelen te treffen op het gebied van arbeidsmarkt- en inkomensbeleid, economische infrastructuur, mobiliteit
    en milieu, alsmede enkele andere maatregelen te treffen en dat het voorts wenselijk is in de Wet kinderopvang een
    heffing in te voeren ter financiering van een werkgeversbijdrage in de kosten van kinderopvang;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelAanhef
articles:
  - number: XXII
    text: |-
      De op het kalenderjaar 2006 betrekking hebbende verhoging van de afdrachtvermindering onderwijs, bedoeld
      in [artikel 14, eerste lid, onderdeel e][ref1], alsmede de afdrachtvermindering onderwijs, bedoeld in
      __REF001___________________________________________________________________________________________________________
      _____________ worden, in afwijking van [artikel 3 van die wet][ref3], zoveel mogelijk toegerekend aan de in dat
      kalenderjaar nog niet verstreken tijdvakken, gerekend vanaf 1 november 2006. Ingeval de toerekening niet volledig
      kan plaatsvinden aan die nog niet verstreken tijdvakken van dat kalenderjaar is het de inhoudingsplichtige
      toegestaan het resterende bedrag, met inachtneming van [artikel 3 van die wet][ref4], door middel van een of,
      indien nodig, meer correctieberichten als bedoeld in [artikel 28a van de Wet op de loonbelasting 1964][ref5],
      alsnog toe te rekenen aan een of meer reeds verstreken tijdvakken van dat kalenderjaar.


      [ref1]: https://wetten.overheid.nl/BWBR0007746#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0007746#Artikel14
