  - number: XXIV.2
    text: |-
      Voor het berekeningsjaar 2006 blijft de [Wet kinderopvang][ref1] zoals deze wet luidde op 31 december 2006, van
      toepassing op de extra kinderopvangtoeslag, bedoeld in de [artikelen 94 tot en met 96 van die wet][ref2].


