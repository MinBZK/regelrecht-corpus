  - number: XXV.2
    text: Het eerste lid is van overeenkomstige toepassing op een aldaar bedoeld beding tot verstrekking van kinderopvang.
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXV
  - number: XXV.3
    text: |-
      Bij de toepassing van het eerste en tweede lid is [artikel 7, tweede lid, van de Wet kinderopvang][ref1] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '7'
  - number: XXV.4
    text: |-
      Voor de toepassing van het eerste en tweede lid wordt met een collectieve arbeidsovereenkomst gelijkgesteld een
      regeling door of namens een daartoe bevoegd bestuursorgaan en wordt met werkgever onderscheidenlijk werknemer
      gelijkgesteld overheidswerkgever onderscheidenlijk overheidswerknemer.
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXV
  - number: XXVI
    text: |-
      Ingeval de samenloop van wetten die in 2006 in het Staatsblad zijn of worden gepubliceerd en wijzigingen aanbrengen
      in één of meer belastingwetten, niet of niet juist is geregeld, of als gevolg van die samenloop onjuistheden
      ontstaan in de aanduiding van artikelonderdelen, verwijzingen en dergelijke in de desbetreffende wetten, herstelt
      Onze Minister van Financiën dat bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXVI
  - number: XXVII.1
    text: |-
      Deze wet treedt in werking met ingang van 1 januari 2007, met dien verstande dat
      [artikel I, onderdelen A, Ca, O, en P][ref1], en [artikel IV, onderdelen H, I, en J][ref2], eerst toepassing vinden
      nadat [artikel 10.1 van de Wet inkomstenbelasting 2001][ref3] bij het begin van het kalenderjaar 2007 is toegepast.


