  - number: XXIIa
    text: |-
      De aanvang van het gebruik van de weg in Nederland in de zin van
      [artikel 1 van de Wet op de belasting van personenauto’s en motorrijwielen 1992][ref1] is voor een in een
      andere lidstaat van de Europese Unie geregistreerd motorrijtuig, dat op het moment van inwerkingtreding van
      [artikel X][ref2] vanuit die andere lidstaat feitelijk ter beschikking is gesteld van een in Nederland wonende
      natuurlijke persoon of gevestigd lichaam terwijl voor dat motorrijtuig de belasting niet is geheven, gelegen op de
      eerste dag na 31 januari 2007 waarop met dat motorrijtuig gebruik wordt gemaakt van de weg in Nederland als bedoeld
      in genoemd [artikel 1][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0005806#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0020830#ArtikelX
      [ref3]: https://wetten.overheid.nl/BWBR0005806#Artikel1
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXIIa
