  - number: XXV.1
    text: |-
      Een op het tijdstip van inwerkingtreding van deze wet geldend beding van een arbeidsovereenkomst,
      collectieve arbeidsovereenkomst of andere overeenkomst, inhoudende dat de werkgever jegens
      of ten behoeve van de ouder die als werknemer tegenwoordige arbeid verricht als bedoeld in
      [artikel 6, eerste lid, onder a, van de Wet kinderopvang][ref1] verplicht is een bijdrage in de
      kosten van kinderopvang te verstrekken, blijft buiten toepassing, voorzover die bijdrage overeenkomt
      met of minder bedraagt dan het bedrag van de vermeerdering van de kinderopvangtoeslag, bedoeld in
      [artikel 8 van de Wet kinderopvang][ref2], waarop de ouder aanspraak kan maken, waarbij de hoogte van de bedoelde
      vermeerdering wordt gesteld op:


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0017017#Artikel8
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0017017
        artikel: '8'
  - number: XXV.1.a
    text: |-
      een zesde deel van de kosten van kinderopvang, bedoeld in [artikel 7, eerste lid, van de Wet kinderopvang][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '7'
  - number: XXV.1.b
    text: |-
      in geval de bijdrage mede betrekking heeft op de omstandigheid dat een ouder een partner heeft die
      van zijn werkgever geen bijdrage in de kosten van kinderopvang ontvangt of een bijdrage die minder
      bedraagt dan een zesde deel van die kosten: een derde deel van de kosten van kinderopvang, bedoeld in
      [artikel 7, eerste lid, van de Wet kinderopvang][ref1], verminderd met de door de partner ontvangen bijdrage;


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXV
    references:
      - id: ref1
        bwb_id: BWBR0017017
        artikel: '7'
  - number: XXV.1.c
    text: |-
      in geval de bijdrage mede betrekking heeft op de omstandigheid dat een ouder geen partner heeft: een derde deel van
      de kosten van kinderopvang, bedoeld in [artikel 7, eerste lid, van de Wet kinderopvang][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0017017#Artikel7
    url: https://wetten.overheid.nl/BWBR0020830/2007-12-31#ArtikelXXV
