  - number: XXIII
    text: |-
      Met betrekking tot de kalenderjaren 2006 en 2007 kunnen bij ministeriële regeling van Onze Minister
      van Financiën van [artikel 13a][ref1] en [artikel 27 van de Wet op de loonbelasting 1964][ref2] en van
      [artikel 3.146 van de Wet inkomstenbelasting 2001][ref3] afwijkende regels worden gesteld op grond waarvan
      loon overeenkomstig een door de inhoudingsplichtige bestendig gevolgde gedragslijn aan een of meer verstreken
      loontijdvakken wordt toegerekend.


      [ref1]: https://wetten.overheid.nl/BWBR0002471#Artikel13a
      [ref2]: https://wetten.overheid.nl/BWBR0002471#Artikel27
      [ref3]: https://wetten.overheid.nl/BWBR0011353#Artikel3
