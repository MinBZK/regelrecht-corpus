    text: |-
      Voor het tegemoetkomingsjaar 2005 blijft de [Wet kinderopvang][ref1] zoals deze wet luidde op 31 december 2005, van
      toepassing op de extra tegemoetkoming van het Rijk, bedoeld in de [artikelen 94 tot en met 96 van die wet][ref2].


