preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat een wet ter uitvoering van Richtlijn (EU) 2019/520 van het Europese
    Parlement en de Raad van de Europese unie van 19 maart 2019 betreffende de interoperabiliteit van elektronische
    tolheffingssystemen voor het wegverkeer en ter facilitering van de grensoverschrijdende uitwisseling van informatie
    over niet-betaling van wegentol in de Unie (PbEU 2019, L 91) nodig is en dat de Wegenverkeerswet 1994 wijziging
    behoeft;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      Voor de toepassing van deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *accreditatie:* door de tolheffer opgezette en beheerde procedure die een EETS-aanbieder doorloopt alvorens in
      een EETS-gebied EETS te mogen aanbieden;
        - *bemiddelende instantie:* instantie die bemiddelt tussen tolheffers met een EETS-gebied in Nederland en EETS-
      aanbieders die met deze tolheffers overeenkomsten hebben gesloten, die daarover onderhandelen of die geen
      overeenstemming bereiken;
        - *boordapparatuur:* alle aan boord van een voertuig geïnstalleerde of meegenomen hardware- en softwarecomponenten
      die worden gebruikt als onderdeel van de toldienst, teneinde gegevens te verzamelen, op te slaan, te verwerken en
      van op afstand te ontvangen of te verzenden, als een afzonderlijk toestel of geïntegreerd in het voertuig;
        - *contactbureau:* contactbureau als bedoeld in [artikel 5, eerste lid][ref1];
        - *Dienst Wegverkeer:* dienst als bedoeld in [artikel 4a van de Wegenverkeerswet 1994][ref2];
        - *EETS-aanbieder:* entiteit die, onder een afzonderlijke overeenkomst, een EETS-gebruiker toegang verleent tot de
      EETS, de tolgelden overmaakt aan de betrokken tolheffer, en die in zijn lidstaat van vestiging is geregistreerd;
        - *EETS-conform systeem:* reeks elementen van een elektronisch tolheffingssysteem voor het wegverkeer die specifiek
      noodzakelijk is voor de integratie van EETS-aanbieders in het systeem en voor het functioneren van EETS;
        - *EETS-gebied:* weg, wegennet, kunstwerk, zoals een brug of een tunnel, of veerpont, waarvoor tolgeld wordt geïnd
      met gebruikmaking van een elektronisch tolheffingssysteem voor het wegverkeer;
        - *EETS-gebiedsverklaring:* verklaring als bedoeld in [artikel 10, eerste lid][ref3];
        - *EETS-gebruiker:* natuurlijke persoon of rechtspersoon die een contract heeft met een EETS-aanbieder om toegang
      te krijgen tot EETS;
        - *elektronisch tolheffingssysteem voor het wegverkeer:* tolheffingssysteem waarbij de verplichting voor de
      gebruiker om tolgeld te betalen uitsluitend ontstaat door en gekoppeld is aan de automatische detectie van de
      aanwezigheid van het voertuig op een bepaalde locatie door middel van communicatie op afstand met boordapparatuur
      in het voertuig of automatische nummerplaatherkenning;
        - *Europese elektronische tolheffingsdienst (EETS):* toldienst die door een EETS-aanbieder in het kader van een
      overeenkomst aan een EETS-gebruiker wordt verleend in een of meer EETS-gebieden;
        - *geautomatiseerde zoekopdracht:* online-toegangsprocedure voor het raadplegen van de databanken van één, meerdere
      of alle lidstaten;
        - *geschiktheid voor gebruik:* vermogen van een interoperabiliteitsonderdeel om een specifieke prestatie te
      verrichten en te blijven verrichten zolang het in gebruik is, waarbij een representatieve integratie in de EETS met
      betrekking tot het systeem van een tolheffer gewaarborgd moet zijn;
        - *hoofddienstaanbieder:* toldienstaanbieder met specifieke verplichtingen, zoals de verplichting om overeenkomsten
      te sluiten met alle belanghebbende gebruikers, of met specifieke rechten, zoals een specifieke vergoeding of
      een gegarandeerde langetermijnovereenkomst, die verschillen van de rechten en plichten van andere aanbieders van
      diensten;
        - *houder:* degene op wiens naam een voertuig is ingeschreven, zoals gedefinieerd in het recht van de lidstaat
      van inschrijving;
        - *ingrijpend gewijzigd systeem:* bestaand elektronisch tolheffingssysteem voor het wegverkeer dat een verandering
      heeft ondergaan of ondergaat waardoor EETS-aanbieders genoodzaakt zijn wijzigingen aan te brengen in de
      interoperabiliteitsonderdelen die zij gebruiken;
        - *interoperabiliteitsonderdeel:* basiscomponent, groep componenten, deel van een samenstel of volledig samenstel
      van apparatuur die deel uitmaken of bestemd zijn om deel uit te maken van de EETS en waarvan de interoperabiliteit
      van deze dienst direct of indirect afhankelijk is, met inbegrip van zowel materiële als immateriële zaken zoals
      software;
        - *licht voertuig:* voertuig met een maximaal toegestane massa van niet meer dan 3.500 kg;
        - *lidstaat van inschrijving:* lidstaat waarin het voertuig waarvoor wegentol verschuldigd is, is ingeschreven;
        - *nationaal contactpunt:* contactpunt als bedoeld in [artikel 40, vierde lid][ref4];
        - *niet-betaling van wegentol:* overtreding die bestaat uit het niet-betalen door een weggebruiker van wegentol in
      een lidstaat, zoals gedefinieerd in de desbetreffende nationale voorschriften van die lidstaat;
        - *NIWO:* Nationale en Internationale Wegvervoer Organisatie;
        - *Onze Minister:* Onze Minister van Infrastructuur en Waterstaat;
        - *Richtlijn (EU) 2019/520:* [Richtlijn (EU) 2019/520](32019L0520) van het Europees Parlement en de Raad van
      19 maart 2019 betreffende de interoperabiliteit van elektronische tolheffingssystemen voor het wegverkeer en ter
      facilitering van de grensoverschrijdende uitwisseling van informatie over niet-betaling van wegentol in de Unie
      (PbEU 2019, L 91);
        - *tolcontextgegevens:* door de verantwoordelijke tolheffer vastgestelde informatie die noodzakelijk is om
      het tolgeld te bepalen dat voor een bepaald voertuig in een specifiek tolgebied moet worden betaald en om de
      toltransactie af te ronden;
        - *toldienst:* dienst die gebruikers in staat stelt gebruik te maken van een voertuig in een of meer EETS-gebieden
      onder één overeenkomst en indien nodig met één soort boordapparatuur, met inbegrip van: a. indien nodig, het
      verstrekken van op maat gemaakte boordapparatuur aan de gebruikers en het onderhouden van de functionaliteit ervan;
      b. het waarborgen dat de door de gebruiker verschuldigde tol wordt betaald aan de tolheffer; c. het beschikbaar
      stellen aan de gebruiker van betaalmethoden of het accepteren van een bestaande methode; d. het innen van tolgelden
      bij de gebruiker; e. het beheren van de klantenrelatie met de gebruiker, en f. het uitvoeren en naleven van het
      beveiligings- en privacybeleid voor de tolheffingssystemen voor het wegverkeer;
        - *toldienstaanbieder:* juridische entiteit die toldiensten verleent aan klanten in een of meer EETS-gebieden voor
      een of meer voertuigcategorieën;
        - *tolgeld:* wegentol;
        - *tolheffer:* publieke of private entiteit die tolgelden heft op het gebruik van voertuigen in een EETS-gebied
      in Nederland;
        - *tolmelding:* mededeling aan een tolheffer, in een vorm die is vastgesteld door de toldienstaanbieder en de
      tolheffer, waarmee de aanwezigheid van een voertuig in een EETS-gebied wordt bevestigd;
        - *voertuig:* motorvoertuig, of samenstel van voertuigen, dat is bestemd of wordt gebruikt voor het vervoer over de
      weg van passagiers of goederen;
        - *voertuigclassificatieparameters:* voertuiginformatie voor het berekenen van het tolgeld op basis van de
      tolcontextgegevens;
        - *wegentol:* vergoeding die door de weggebruiker moet worden betaald om zich te mogen verplaatsen op een weg, een
      wegennet, een kunstwerk, zoals een brug of een tunnel, of een veerpont.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel5
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel4a
      [ref3]: https://wetten.overheid.nl/BWBR0045586#Artikel10
      [ref4]: https://wetten.overheid.nl/BWBR0045586#Artikel40
