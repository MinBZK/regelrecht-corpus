  - number: '2'
    text: |-
      1 Deze wet is van toepassing op EETS-gebieden en grensoverschrijdende uitwisseling van voertuigregistratiegegevens
      met betrekking tot voertuigen en de eigenaren of houders van voertuigen waarvoor in de Unie geen wegentol is
      betaald.

      2 De [artikelen 3 tot en met 38][ref1] zijn niet van toepassing op:

      a. niet elektronische tolheffingssystemen voor het wegverkeer;

      b. kleine, strikt lokale EETS-gebieden, waarvoor de kosten van de aanpassing aan de
      [artikelen 3 tot en met 38][ref2] onevenredig zijn in verhouding tot de opbrengst.

      3 Deze wet is niet van toepassing op parkeergelden.

      4 Bij ministeriële regeling kunnen nadere regels worden gesteld over het tweede lid, onderdeel b.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel3
