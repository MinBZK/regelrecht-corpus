        artikel: 3:45
      - id: ref4
        bwb_id: BWBR0005537
        artikel: 3:46
  - number: '16'
    text: |-
      1 Onze Minister kan een of meer instanties aanwijzen die belast zijn met de uitvoering van, of het toezicht
      op de op grond van artikel 15, zevende lid, van [Richtlijn (EU) 2019/520](32019L0520) bepaalde procedure
      voor de beoordeling van de conformiteit met de specificaties of de geschiktheid voor het gebruik van
      interoperabiliteitsonderdelen, als de betreffende instantie voldoet aan de vereisten die door middel van
      gedelegeerde handelingen zijn vastgesteld, op grond van artikel 19, tweede lid, van [Richtlijn (EU) 2019/520]
      (32019L0520).

      2 Onze Minister meldt de, op grond van het eerste lid, aangewezen instanties aan bij de Europese Commissie en de
      andere lidstaten van de Europese Unie, onder vermelding van hun bevoegdheden en de daarvoor vooraf van de Europese
      Commissie ontvangen identificatienummers.

      3 Als een door Onze Minister aangemelde instantie niet meer voldoet aan de criteria, bedoeld in het eerste lid,
      trekt Onze Minister de aanwijzing en aanmelding van die instantie in en brengt de Europese Commissie en de andere
      lidstaten van de Europese Unie daarvan op de hoogte.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel16
  - number: '17'
    text: |-
      Tolheffers laten in hun EETS-gebieden alle operationele boordapparatuur toe die wordt gebruikt door EETS-aanbieders
      met wie zij een contractuele relatie onderhouden, als:

      a. de apparatuur is gecertificeerd overeenkomstig de procedure die is bepaald op grond van artikel 15, zevende lid,
      van [Richtlijn (EU) 2019/520](32019L0520); en

      b. de apparatuur niet voorkomt op een lijst van ongeldig verklaarde boordapparatuur als bedoeld in
      [artikel 18][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel18
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '18'
        hoofdstuk: '4'
  - number: '18'
    text: |-
      1 EETS-aanbieders die in Nederland EETS aanbieden houden lijsten bij van ongeldig verklaarde boordapparatuur die
      verband houdt met hun EETS-overeenkomst met de EETS-gebruikers.

      2 De tolheffer en de EETS-aanbieders maken afspraken over:

      a. het aantal zaken dat in de lijst van ongeldig verklaarde boordapparatuur wordt opgenomen;

      b. de vorm van de lijst; en

      c. de actualiseringsfrequentie.

      3 De lijsten, bedoeld in het eerste lid, worden bijgehouden met toepassing van de regels die gelden voor de
      bescherming van persoonsgegevens.

      4 Een EETS-aanbieder die een lijst van ongeldig verklaarde boordapparatuur aan een tolheffer heeft gezonden, kan
      niet aansprakelijk worden gesteld voor verdere betalingsverplichting voor tolgelden die door gebruik van dergelijke
      ongeldig verklaarde boordapparatuur verschuldigd zijn.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel18
  - number: '19'
    text: |-
      1 Een overeenkomst tussen de tolheffer en de EETS-aanbieder, voor het aanbieden van EETS in Nederland, maakt het
      mogelijk dat de factuur voor het tolgeld rechtstreeks door de EETS-aanbieder aan de EETS-gebruiker wordt gestuurd.

      2 De tolheffer kan eisen dat de EETS-aanbieder de factuur voor de gebruiker uitschrijft in naam van en voor
      rekening van de tolheffer. De EETS-aanbieder voldoet aan die eis.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel19
  - number: '20'
    text: |-
      1 De betaling van tolgeld door de EETS-gebruiker aan zijn EETS-aanbieder geldt als voldoening van de
      betalingsverplichtingen van de EETS-gebruiker ten aanzien van de betrokken tolheffer.

      2 Als twee of meer soorten boordapparatuur worden geïnstalleerd of worden meegenomen aan boord van een voertuig, is
      het de verantwoordelijkheid van de EETS-gebruiker om de relevante boordapparatuur voor een specifiek EETS-gebied te
      gebruiken of te activeren.

      3 EETS-gebruikers voldoen aan de verplichtingen voor de verstrekking van gegevens aan de EETS-aanbieder en het
      gebruik van en de behandeling van de boordapparatuur, die zijn vastgesteld krachtens artikel 10, derde lid, van
      [Richtlijn (EU) 2019/520](32019L0520).
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel20
  - number: '21'
    text: |-
      1 De tolheffer kan van een EETS-aanbieder eisen dat hij de tolheffer betaalt voor elke onderbouwde tolmelding
      en voor elke onderbouwde niet-tolmelding die betrekking heeft op een door de EETS-aanbieder beheerde EETS-
      gebruikersrekening.

      2 Wanneer, voor het vaststellen van het toltarief dat voor een gegeven voertuig geldt, de voertuigclassificatie van
      een EETS-aanbieder afwijkt van die van een tolheffer, prevaleert de classificatie van de tolheffer, tenzij wordt
      aangetoond dat sprake is van een fout.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel21
  - number: '22'
    text: |-
      1 De tolheffer heft van EETS-gebruikers niet meer tolgeld dan hij van andere gebruikers heft overeenkomstig het
      nationale of lokale tolgeld.

      2 Het eerste lid laat de mogelijkheid van restituties of kortingen door de tolheffer voor het gebruik van
      elektronische tolbetalingen onverlet. Restituties of kortingen aan gebruikers van boordapparatuur zijn transparant,
      openbaar aangekondigd en onder dezelfde voorwaarden beschikbaar voor klanten van EETS-aanbieders.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel22
  - number: '23'
    text: |-
      1 EETS-aanbieders hebben het recht om door de tolheffer te worden vergoed voor het innen van tolgelden namens de
      tolheffer.

      2 De vergoeding van de EETS-aanbieders wordt berekend aan de hand van een methode die transparant en niet-
      discriminerend is en identiek is voor alle EETS-aanbieders die voor een bepaald EETS-gebied zijn geaccrediteerd.

      3 In EETS-gebieden met een hoofddienstaanbieder heeft de methode, bedoeld in het tweede lid, dezelfde structuur
      als de methode voor het berekenen van de vergoeding van vergelijkbare diensten die worden verleend door de
      hoofddienstaanbieder. Daarbij kan het bedrag van de vergoeding verschillen, als dat wordt gerechtvaardigd door:

      a. de kosten in verband met specifieke eisen en verplichtingen die de hoofddienstaanbieder heeft en de EETS-
      dienstaanbieder niet; en

      b. de noodzaak om van de vergoeding van EETS-aanbieders de vaste kosten af te trekken die door de tolheffer worden
      opgelegd op grond van de kosten die de tolheffer maakt door in zijn tolgebied een EETS-conform systeem beschikbaar
      te stellen, te bedienen en te onderhouden, met inbegrip van de accreditatiekosten, wanneer die kosten niet in het
      tolgeld zijn opgenomen.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel23
  - number: '24'
    text: |-
      1 Entiteiten die toldiensten aanbieden houden een financiële administratie bij waarin een duidelijk onderscheid kan
      worden gemaakt tussen de kosten en inkomsten in verband met het verlenen van toldiensten en de kosten en inkomsten
      in verband met andere activiteiten.

      2 De informatie over de kosten en inkomsten in verband met het verlenen van toldiensten wordt op verzoek verstrekt
      aan de betrokken bemiddelende of rechterlijke instantie.

      3 Kruissubsidies tussen activiteiten die worden verricht in de hoedanigheid van toldienstaanbieder en andere
      activiteiten zijn verboden.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel24
  - number: '25'
    text: |-
      1 In Nederland geregistreerde EETS-aanbieders bestrijken te allen tijde alle EETS-gebieden zodra zij daarvoor
      overeenkomsten hebben gesloten.

      2 Een EETS-aanbieder die een EETS-gebied niet kan blijven bestrijken als gevolg van het niet-naleven van deze wet
      door de tolheffer, herstelt de dienstverlening voor het betrokken gebied zo snel mogelijk nadat het gebrek door de
      tolheffer hersteld is.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel25
  - number: '26'
    text: |-
      Een in Nederland geregistreerde EETS-aanbieder maakt via elektronische weg bekend:

      a. de EETS-gebieden die hij bestrijkt;

      b. wijzigingen daarvan;

      c. gedetailleerde, jaarlijks bijgewerkte plannen over uitbreiding van diensten naar andere EETS-gebieden.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel26
  - number: '27'
    text: |-
      In Nederland geregistreerde EETS-aanbieders maken het beleid dat zij toepassen bij het sluiten van overeenkomsten
      met EETS-gebruikers via elektronische weg openbaar.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel27
  - number: '28'
    text: |-
      Bij een aan de tolheffer toerekenbare EETS-storing voorziet de tolheffer in een beperkte dienstverlening. De
      tolheffer draagt er zorgt voor dat voertuigen die zijn uitgerust met operationele boordapparatuur als bedoeld in
      [artikel 17][ref1] zich veilig kunnen verplaatsen met zo min mogelijk oponthoud en zonder ervan te worden verdacht
      geen wegentol te hebben betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel17
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '17'
        hoofdstuk: '4'
  - number: '29'
    text: |-
      1 EETS-gebruikers kunnen met elke EETS-aanbieder een overeenkomst sluiten, ongeacht nationaliteit, lidstaat van
      verblijf of de lidstaat waar hun voertuig is ingeschreven.

      2 Bij het sluiten van de overeenkomst met een EETS-aanbieder wordt de EETS-gebruiker naar behoren geïnformeerd
      over geldige betaalmiddelen en, overeenkomstig [Verordening (EU) 2016/679](32579R2016) van het Europees
      Parlement en de Raad van 27 april 2016 betreffende de bescherming van natuurlijke personen in verband met
      de verwerking van persoonsgegevens en betreffende het vrije verkeer van die gegevens en tot intrekking van
      [Richtlijn 95/46/EG](31995L0046) (algemene verordening gegevensbescherming) (PbEU 2016, L 119), over de verwerking
      van hun persoonsgegevens en de rechten die voortvloeien uit de geldende wetgeving inzake de bescherming van
      persoonsgegevens.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel29
  - number: '30'
    text: |-
      EETS wordt aan EETS-gebruikers aangeboden als één ononderbroken dienst, wat inhoudt dat:

      a. tijdens het traject geen menselijke interventie meer vereist is in het voertuig, zodra de
      voertuigclassificatieparameters, met inbegrip van de variabele parameters, zijn opgeslagen, aangegeven of beide,
      tenzij de kenmerken van het voertuig worden gewijzigd, en

      b. de menselijke interactie met een specifiek onderdeel van boordapparatuur identiek is voor elk EETS-gebied.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel30
  - number: '31'
    text: |-
      1 EETS-gebruikers hebben geen andere interactie met tolheffers als onderdeel van EETS dan:

      a. het factureringsproces overeenkomstig [artikel 19][ref1]; en

      b. handhavingsprocessen.

      2 Interacties tussen EETS-gebruikers en EETS-aanbieders of hun boordapparatuur kunnen specifiek zijn per EETS-
      aanbieder.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel19
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '19'
        hoofdstuk: '5'
  - number: '32'
    text: |-
      1 EETS-aanbieders die in Nederland EETS aanbieden, verstrekken aan tolheffers van het betreffende tolgebied:

      a. de informatie die tolheffers nodig hebben voor het berekenen en heffen van tol op de voertuigen van EETS-
      gebruikers, of

      b. de informatie die tolheffers nodig hebben om de berekening te kunnen verifiëren van de tol die door de EETS-
      aanbieders is geheven op de voertuigen van EETS-gebruikers.

      2 Tolheffers in tolheffingssystemen die werken op basis van microgolven, verstrekken onderbouwde tolmeldingen aan
      de EETS-aanbieders met betrekking tot de verschuldigde tolgelden van hun EETS-gebruikers.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel32
  - number: '33'
    text: |-
      1 EETS-aanbieders die in Nederland EETS aanbieden, werken met de tolheffers samen om vermoedelijke overtreders van
      de verplichting om wegentol te betalen te identificeren.

      2 Als niet-betaling van wegentol wordt vermoed, kan de tolheffer bij de EETS-aanbieder de gegevens opvragen
      betreffende het voertuig dat betrokken is bij de vermeende niet-betaling van wegentol en betreffende de houder
      van dat voertuig die klant is van deze EETS-aanbieder. De EETS-aanbieder stelt deze gegevens onmiddellijk ter
      beschikking aan de tolheffer van het betreffende tolgebied.

      3 De tolheffer maakt de gegevens, bedoeld in het tweede lid, niet bekend aan andere toldienstaanbieders. Als de
      tolheffer en een toldienstaanbieder deel uitmaken van één entiteit, worden de gegevens uitsluitend gebruikt voor
      het identificeren van vermeende overtreders.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel33
  - number: '34'
    text: |-
      1 Een tolheffer die verantwoordelijk is voor een EETS-gebied in Nederland kan bij een EETS-aanbieder opvragen:

      a. gegevens betreffende alle voertuigen die eigendom zijn van of worden gehouden door klanten van de EETS-
      aanbieder, en die in een bepaalde periode hebben gereden in het EETS-gebied waarvoor de tolheffer verantwoordelijk
      is;

      b. gegevens betreffende de eigenaars of houders van deze voertuigen, mits de tolheffer deze gegevens nodig heeft om
      zijn verplichtingen ten aanzien van de belastingautoriteiten na te komen.

      2 De EETS-aanbieder verstrekt de gevraagde gegevens uiterlijk twee dagen na ontvangst van het verzoek.

      3 De tolheffer maakt de gegevens, bedoeld in het eerste lid, niet bekend aan andere toldienstaanbieders. Als de
      tolheffer en een toldienstaanbieder deel uitmaken van één entiteit, worden de gegevens uitsluitend gebruikt voor
      het nakomen van verplichtingen ten aanzien van de belastingautoriteiten.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel34
  - number: '35'
    text: |-
      Op verzoek verstrekken de toldienstaanbieders, met inbegrip van EETS-aanbieders, aan de tolheffer de
      geanonimiseerde verkeersgegevens van hun klanten. Bij ministeriële regeling wordt bepaald aan welke instantie
      de tolheffer de gegevens verstrekt. Deze gegevens worden alleen gebruikt ten behoeve van verkeersbeleid en ter
      verbetering van het verkeersmanagement.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel35
  - number: '36'
    text: |-
      1 Met een toestemming van de Europese Commissie als bedoeld in artikel 22, derde lid, van [Richtlijn (EU) 2019/520]
      (32019L0520), kan Onze Minister op verzoek van een tolheffer ontheffing verlenen van één of meer bepalingen van
      deze wet om tijdelijk, gedurende de looptijd van de toestemming van de Europese Commissie, in beperkte delen van
      hun tolgebied, experimentele tolheffingssystemen toe te passen, parallel aan het EETS-conform systeem, voor het
      gebruiken van nieuwe tolheffingstechnologieën of concepten die niet voldoen aan die betreffende bepalingen.

      2 Aan de ontheffing kunnen voorwaarden worden gesteld of beperkingen worden verbonden.

      3 Bij ministeriële regeling kunnen regels worden gesteld over de bij het verzoek te overleggen gegevens en
      bescheiden.

      4 EETS-aanbieders zijn niet verplicht om aan een experimenteel tolheffingssysteem deel te nemen.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel36
  - number: '37'
    text: |-
      1 De NIWO is de bemiddelende instantie.

      2 Tot de taak van de NIWO behoort met name:

      a. na gaan of de door de tolheffer aan EETS-aanbieders opgelegde contractvoorwaarden niet-discriminerend zijn;

      b. na gaan of de EETS-aanbieders volgens de in [artikel 23][ref1] vastgelegde beginselen worden vergoed;

      c. om alle relevante informatie op te vragen bij tolheffers, EETS-aanbieders en derden die betrokken zijn bij de
      EETS-dienstverlening in Nederland;

      d. om informatie uit te wisselen met bemiddelende instanties van andere lidstaten over hun werkzaamheden,
      richtsnoeren en praktijken.

      3 Ter dekking van de kosten van de bemiddeling zijn de tolheffer en de EETS-aanbieder een vergoeding verschuldigd
      aan de NIWO. De in rekening te brengen vergoeding voor de bemiddeling wordt gelijkelijk verdeeld over de tolheffer
      en de EETS-aanbieder.

      4 De NIWO stelt de tarieven van de vergoeding, bedoeld in het derde lid, vast. De tarieven voor de vergoeding
      worden zodanig vastgesteld dat de begrote baten van die vergoeding niet uitgaan boven de begrote kosten ter zake
      van de bemiddeling.

      5 De NIWO maakt het besluit tot vaststelling van het tarief, bedoeld in het derde lid, bekend in de Staatscourant
      met vermelding van de dagtekening van het besluit van Onze Minister waarbij de goedkeuring, bedoeld in
      [artikel 17 van de Kaderwet zelfstandige bestuursorganen][ref2], is verleend of met vermelding van de omstandigheid
      dat ingevolge [artikel 10:31, vierde lid van de Algemene wet bestuursrecht][ref3], een besluit tot goedkeuring
      wordt geacht te zijn genomen.

      6 Onze Minister verleent dan wel onthoudt de goedkeuring, bedoeld in het vijfde lid, binnen zes weken na de datum
      van ontvangst van de goed te keuren tarieven.

      7 [Artikel 21 van de Kaderwet zelfstandige bestuursorganen][ref4] is niet van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel23
      [ref2]: https://wetten.overheid.nl/BWBR0020495#Artikel17
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel1031
      [ref4]: https://wetten.overheid.nl/BWBR0020495#Artikel21
