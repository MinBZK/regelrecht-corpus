      [11][ref4], [12][ref5], [13][ref6], [17][ref7], [18][ref8], [19][ref9], [22][ref10], [24][ref11], [26][ref12],
      [27][ref13], [28][ref14], [29][ref15], [30][ref16], [31][ref17], [34][ref18] en [35][ref19] zijn belast de bij
      besluit van Onze Minister aangewezen ambtenaren. De aanwijzing kan inhouden, dat de betrokken ambtenaar slechts
      belast is met het toezicht op de naleving van een of enkele in die aanwijzing genoemde artikelen gesteld bij of
      krachtens deze wet.


