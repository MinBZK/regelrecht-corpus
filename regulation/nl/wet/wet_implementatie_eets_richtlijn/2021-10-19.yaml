  - number: '38'
    text: |-
      1 Een tolheffer of een EETS-aanbieder kan de NIWO verzoeken tussenbeide te komen in geschillen over hun
      contractuele relatie of onderhandelingen.

      2 De NIWO bepaalt binnen een termijn van een maand na de ontvangst van het bemiddelingsverzoek of zij over alle
      voor de bemiddeling noodzakelijke documenten beschikt.

      3 De NIWO brengt uiterlijk zes maanden na de ontvangst van het bemiddelingsverzoek advies uit over het geschil.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel38
  - number: '39'
    text: |-
      Als, overeenkomstig de voor het betreffende EETS-gebied geldende procedure, degene die ervan verdacht wordt
      de wegentol niet te hebben betaald, daarvan in kennis wordt gesteld, is de kennisgeving gebaseerd op het
      kennisgevingsmodel, bedoeld in bijlage II bij [Richtlijn (EU) 2019/520](32019L0520), in de taal van het
      kentekenbewijs van het voertuig of in een van de officiële talen van de lidstaat van inschrijving.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel39
  - number: '40'
    text: |-
      1 Het faciliteren van de grensoverschrijdende uitwisseling van voertuigregistratiegegevens in het kader van het
      niet betalen van wegentol in de Unie vindt plaats aan de hand van de softwaretoepassing Eucaris, bedoeld in artikel
      23, vierde lid, van [Richtlijn (EU) 2019/520](32019L0520).

      2 Voertuigregistratiegegevens die voor de uitvoering van het eerste lid worden verwerkt, worden uitsluitend
      gebruikt voor het identificeren van het voertuig en de eigenaar of houder waarvoor niet-betaling van wegentol is
      vastgesteld binnen het toepassingsgebied van het [eerste lid en artikel 39][ref1].

      3 Voor de verwerking van persoonsgegevens voor het doel, bedoeld in het tweede lid worden slechts gebruikt de
      verplicht uit te wisselen gegevens, bedoeld in bijlage I van [Richtlijn (EU) 2019/520](32019L0520), met betrekking
      tot voertuigen en de eigenaren of houders van die voertuigen.

      4 De voertuigregistratiegegevens bedoeld in het eerste lid, worden door het nationaal contactpunt alleen gedeeld
      met;

      a. de nationale contactpunten van andere lidstaten;

      b. de tolheffers die ten behoeve van de handhaving bij niet betalen wegentol de gegevens hebben opgevraagd.

      5 Op verzoek van de betrokken houder verstrekt het nationaal contactpunt informatie over welke in de lidstaat van
      registratie opgeslagen persoonsgegevens zijn doorgestuurd naar de lidstaat waarin een geval van niet-betaling van
      wegentol is vastgesteld, met inbegrip van de datum van het verzoek en het nationaal contactpunt van de lidstaat op
      wiens grondgebied een geval van niet-betaling van wegentol is vastgesteld.

      6 Onverminderd het eerste tot en met het vijfde lid is het bepaalde bij of krachtens
      [artikel 43 van de Wegenverkeerswet 1994][ref2] van overeenkomstige toepassing op de grensoverschrijdende
      voertuigregistratiegegevens, bedoeld in het eerste lid.

      7 Bij ministeriële regeling wordt het nationaal contactpunt aangewezen.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel43
