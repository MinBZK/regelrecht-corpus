  - number: '3'
    text: |-
      1 Een nieuw elektronisch tolheffingssysteem voor het wegverkeer waarvoor boordapparatuur moet worden geïnstalleerd
      of gebruikt, maakt voor de afhandeling van elektronische toltransacties gebruik van een of meer van de volgende
      technologieën:

      a. satellietplaatsbepaling;

      b. mobiele communicatie;

      c. 5,8 Ghz microgolftechnologie.

      2 Op elektronische tolheffingssystemen voor het wegverkeer waarvoor boordapparatuur moet worden geïnstalleerd
      of gebruikt en die voor 19 oktober 2021 in gebruik waren en die andere technologieën gebruiken dan bedoeld in
      het eerste lid, is dat lid van overeenkomstige toepassing vanaf het tijdstip waarop substantiële technologische
      verbeteringen zijn uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel3
  - number: '4'
    text: |-
      1 EETS-aanbieders stellen boordapparatuur ter beschikking van de EETS-gebruikers die:

      a. geschikt is voor gebruik,

      b. interoperabel is,

      c. in staat is te communiceren met de elektronische tolheffingssystemen voor het wegverkeer die in de lidstaten in
      gebruik zijn en die gebruikmaken van de in het [eerste lid van artikel 3][ref1] bedoelde technologieën, en

      d. indien nodig, voldoen aan de bij of krachtens [paragraaf 10.1 van de Telecommunicatiewet][ref2] gestelde eisen.

      2 Boordapparatuur die gebruikmaakt van satellietplaatsbepalingstechnologie en die na 19 oktober 2021 in de handel
      is gebracht moet compatibel zijn met de plaatsbepalingsdiensten die worden verleend door Galileo en Egnos.

      3 De boordapparatuur mag gebruikmaken van eigen hardware en software, van elementen van andere hardware en software
      die in het voertuig aanwezig is.

      4 Om met andere in het voertuig aanwezige hardwaresystemen te kunnen communiceren, mag de boordapparatuur
      gebruikmaken van andere dan de in [artikel 3, eerste lid][ref3], bedoelde technologieën, op voorwaarde dat de
      veiligheid, de kwaliteit van de dienst en de privacy worden gewaarborgd.

      5 De werking voor andere diensten dan tolheffing die door de boordapparatuur worden gefaciliteerd, belemmert de
      werking van de toldiensten in een EETS-gebied niet.

      6 Tot 31 december 2027 kunnen EETS-aanbieders aan gebruikers van lichte voertuigen mede boordapparatuur ter
      beschikking stellen die alleen geschikt is voor gebruik met 5,8 GHz microgolftechnologie, met het oog op gebruik
      ervan in EETS-gebieden waar geen technologieën voor satellietplaatsbepaling of mobiele communicatie nodig zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0009950#Paragraaf10.1
