        bwb_id: BWBR0045586
        artikel: '10'
        hoofdstuk: '4'
  - number: '12'
    text: |-
      1 Een tolheffer die verantwoordelijk is voor een EETS-gebied in Nederland brengt een testomgeving tot stand waarin
      de EETS-aanbieder of zijn gemachtigde kan controleren of zijn boordapparatuur geschikt is voor gebruik in het EETS-
      gebied van de tolheffer en certificering kan krijgen voor de succesvolle voltooiing van de tests.

      2 Tolheffers kunnen een testomgeving gebruiken voor meerdere EETS-gebieden.

      3 Tolheffers kunnen een gemachtigde toelaten die de geschiktheid voor gebruik van één soort boordapparatuur
      controleert namens meer dan één EETS-aanbieder.

      4 Tolheffers kunnen van EETS-aanbieders of hun gemachtigden verlangen de kosten van de tests te dragen.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel12
  - number: '13'
    text: |-
      1 Interoperabiliteitsonderdelen voldoen aan:

      a. de eisen die door middel van gedelegeerde handelingen zijn vastgesteld krachtens artikel 15, vierde lid, van
      [Richtlijn (EU) 2019/520](32019L0520);

      b. de algemene infrastructurele vereisten die door middel van gedelegeerde handelingen en uitvoeringshandelingen
      zijn vastgesteld krachtens artikel 15, vijfde en zesde lid, van [Richtlijn (EU) 2019/520](32019L0520);

      c. de eisen, bedoeld in [artikel 4][ref1].

      2 De inhoud en de vorm van de EG-verklaringen van conformiteit met de specificaties of van de geschiktheid voor het
      gebruik, waartoe de procedure, bedoeld in [artikel 10, tweede lid, onder c][ref2], kan leiden als wordt aangetoond
      dat is voldaan aan de eisen, bedoeld in het eerste lid, voldoen aan het bepaalde, krachtens artikel 15, zevende
      lid, van [Richtlijn (EU) 2019/520](32019L0520).


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel10
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel13
