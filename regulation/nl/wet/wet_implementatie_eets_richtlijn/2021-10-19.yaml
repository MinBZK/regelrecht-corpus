        artikel: '7'
        hoofdstuk: '3'
  - number: '7'
    text: |-
      1 Een in Nederland gevestigde entiteit kan bij de Dienst Wegverkeer een aanvraag indienen om te worden
      geregistreerd als EETS-aanbieder in het EETS-register.

      2 De registratie wordt verleend als de entiteit:

      a. in het bezit is van een EN ISO 9001-certificaat of gelijkwaardige erkenning;

      b. over de nodige technische apparatuur beschikt en in het bezit is van de EG-verklaringen of certificaat van
      conformiteit van de interoperabiliteitsonderdelen;

      c. bekwaam is om elektronische toldiensten te verstrekken of bekwaam is op andere relevante gebieden;

      d. over de nodige financiële draagkracht beschikt;

      e. een alomvattend risicobeheersplan handhaaft dat minstens om de twee jaar aan een controle moet worden
      onderworpen; en

      f. betrouwbaar is.

      3 De Dienst Wegverkeer gaat ten minste eenmaal per jaar na of de EETS-aanbieders die zijn geregistreerd
      overeenkomstig het eerste lid, nog voldoen aan de eisen, bedoeld in het tweede lid, onderdelen a, d, e en f. De
      EETS-aanbieder verleent medewerking aan het onderzoek.

      4 De Dienst Wegverkeer werkt het EETS-register bij op grond van het onderzoek, bedoeld in het derde lid en neemt
      daarin ook de conclusies op van de controle, bedoeld in het tweede lid, onder e. Als is vastgesteld dat een EETS-
      aanbieder niet kan aantonen dat aan de eisen, bedoeld in het derde lid, wordt voldaan of anderszins niet kan worden
      vastgesteld dat aan deze eisen wordt voldaan, dan kan de Dienst Wegverkeer de registratie van de EETS-aanbieder
      intrekken.

      5 Bij ministeriële regeling kunnen regels worden gesteld over de te verstrekken gegevens en bescheiden ten
      behoeve van de aanvraag, bedoeld in het eerste lid, en het onderzoek, bedoeld in het derde lid, waarmee kan worden
      aangetoond aan de eisen van het tweede lid en de [artikelen 8][ref1] en [25][ref2] te voldoen.

      6 De Dienst Wegverkeer en de Staat zijn niet aansprakelijk voor de handelingen van de in het EETS-register
      opgenomen EETS-aanbieders.

      7 Onverminderd het vierde lid kan de registratie ook worden ingetrokken als niet aan de vereisten, bedoeld in de
      [artikelen 8, eerste en tweede lid][ref3], of [25][ref4], wordt voldaan.

      8 Voor de behandeling van de aanvraag om en de verlening van de registratie, bedoeld in het eerste en tweede
      lid, alsmede het verrichten van onderzoeken, bedoeld in het derde lid, wordt, op de door de Dienst Wegverkeer
      vastgestelde wijze, het door deze dienst vastgestelde tarief ten laste gebracht van de aanvrager of de
      geregistreerde EETS-aanbieder. [Artikel 4q, eerste lid, van de Wegenverkeerswet 1994][ref5] is van overeenkomstige
      toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel25
      [ref3]: https://wetten.overheid.nl/BWBR0045586#Artikel8
      [ref4]: https://wetten.overheid.nl/BWBR0045586#Artikel25
      [ref5]: https://wetten.overheid.nl/BWBR0006622#Artikel4q
