  - number: '8'
    text: |-
      1 In Nederland geregistreerde EETS-aanbieders sluiten overeenkomsten met de tolheffers voor alle EETS-gebieden op
      het grondgebied van ten minste vier lidstaten, binnen een termijn van 36 maanden na registratie als EETS-aanbieder
      als bedoeld in [artikel 7][ref1].

      2 De overeenkomsten, bedoeld in het eerste lid, voor de EETS-gebieden in een lidstaat worden gesloten binnen een
      termijn van 24 maanden nadat de eerste overeenkomst in die lidstaat is gesloten.

      3 Het eerste en tweede lid zijn niet van toepassing op EETS-gebieden waarvoor de verantwoordelijke tolheffer niet
      voldoet aan de eisen van [artikel 9, eerste, tweede of derde lid][ref2]. Een tolheffer die verantwoordelijk is voor
      een EETS-gebied in Nederland waar de technologie, bedoeld in [artikel 3, eerste lid][ref3], niet wordt toegepast of
      die niet voldoet aan de procedurele vereisten van deze paragraaf, treedt in overleg met de EETS-aanbieder die zich
      wil accrediteren.

      4 Van EETS-aanbieders wordt niet verlangd dat zij specifieke technische oplossingen of processen gebruiken
      die de interoperabiliteit van de interoperabiliteitsonderdelen van een EETS-aanbieder met elektronische
      tolheffingssystemen voor het wegverkeer in andere EETS-gebieden belemmeren.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel7
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel9
