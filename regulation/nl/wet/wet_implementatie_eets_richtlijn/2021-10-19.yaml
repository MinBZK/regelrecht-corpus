  - number: '9'
    text: |-
      1 Tolheffers die verantwoordelijk zijn voor EETS-gebieden in Nederland, verlenen op niet-discriminerende wijze
      toegang aan elke EETS-aanbieder die EETS wenst aan te bieden in een of meer van deze EETS-gebieden.

      2 De tolheffer aanvaardt een EETS-aanbieder in zijn EETS-gebied als hij voldoet aan de verplichtingen en algemene
      voorwaarden die in de EETS-gebiedsverklaring, bedoeld in [artikel 10][ref1], zijn vermeld.

      3 Tolheffers werken op niet-discriminerende wijze samen met EETS-aanbieders, fabrikanten of aangemelde instanties
      bij de beoordeling van de geschiktheid voor gebruik van interoperabiliteitsonderdelen in hun EETS-gebied.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel10
