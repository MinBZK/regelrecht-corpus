        hoofdstuk: '4'
  - number: '14'
    text: |-
      1 Onze Minister kan met betrekking tot interoperabiliteitsonderdelen met CE-markering die in de handel zijn
      gebracht en worden gebruikt overeenkomstig hun bestemming, en die naar verwachting niet aan de daaraan te stellen
      eisen voldoen, het toepassingsgebied daarvan beperken, het gebruik ervan verbieden, of ze uit de handel nemen.

      2 Van getroffen maatregelen, bedoeld in het eerste lid, stelt Onze Minister de Europese Commissie onmiddellijk in
      kennis. Daarbij vermeldt Onze Minister de redenen van het besluit en of het conformiteitsgebrek een gevolg is van
      onjuiste toepassing van de technische specificaties of de ontoereikendheid van de technische specificaties.

      3 Met betrekking tot een interoperabiliteitsonderdeel met CE-markering dat niet aan de interoperabiliteitseisen
      voldoet, verzoekt Onze Minister de fabrikant of diens gemachtigde voor zover die een vestiging in Nederland heeft,
      om de conformiteit met de specificaties of de geschiktheid voor het gebruik van het interoperabiliteitsonderdeel te
      herstellen onder daarbij te stellen voorschriften. Van dat besluit wordt kennisgegeven aan de Europese Commissie en
      de andere lidstaten van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel14
  - number: '15'
    text: |-
      Op beslissingen betreffende de beoordeling van de conformiteit met de specificaties of de geschiktheid voor
      het gebruik van de interoperabiliteitsonderdelen, door tolheffers die geen bestuursorgaan zijn, zijn de
      [artikelen 3:40][ref1], [3:41][ref2], [3:45][ref3] en [3:46 van de Algemene wet bestuursrecht][ref4] van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel340
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel341
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel345
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel346
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel15
