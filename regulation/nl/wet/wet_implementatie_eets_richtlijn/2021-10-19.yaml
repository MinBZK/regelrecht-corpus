  - number: '5'
    text: |-
      1 Bij ministeriele regeling wordt het contactbureau aangewezen.

      2 Onze Minister maakt de contactgegevens van het contactbureau via elektronische weg bekend. Op verzoek worden de
      gegevens verstrekt aan geïnteresseerde EETS-aanbieders.

      3 Op verzoek van de EETS-aanbieder faciliteert en coördineert het contactbureau vroegtijdige administratieve
      contacten tussen de EETS-aanbieder en de tolheffers die verantwoordelijk zijn voor de EETS-gebieden.

      4 Het contactbureau kan een natuurlijk persoon of een publiek- of privaatrechtelijke entiteit zijn.
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel5
  - number: '6'
    text: |-
      1 De Dienst Wegverkeer houdt een EETS-register bij van:

      a. de EETS-gebieden in Nederland met informatie over:

      1°. de betrokken tolheffers;

      2°. de gebruikte tolheffingstechnologieën;

      3°. de tolcontextgegevens;

      4°. de EETS-gebiedsverklaring; en

      5°. de EETS-aanbieders die EETS-overeenkomsten hebben gesloten met de Nederlandse tolheffers;

      b. de EETS-aanbieders aan wie registratie als bedoeld in [artikel 7][ref1] is verleend; en

      c. de gegevens van het contactbureau waaronder een e-mailadres en een telefoonnummer.

      2 De gegevens betreffende een EETS-gebied als bedoeld in het eerste lid, onder a, en wijzigingen daarvan, worden
      door de voor dat EETS-gebied verantwoordelijke tolheffer verstrekt op een door de Dienst Wegverkeer bepaalde wijze.

      3 De Dienst Wegverkeer neemt maatregelen met het oog op het waarborgen van de juistheid, de actualiteit en de
      volledigheid van het EETS-register. Een tolheffer of een EETS-aanbieder die gerede twijfel heeft over de juistheid
      van een in het EETS-register opgenomen gegeven, meldt die twijfel, onder opgave van redenen, aan de Dienst
      Wegverkeer.

      4 Het register is via elektronische weg beschikbaar voor het publiek.

      5 Aan het eind van elk kalenderjaar stuurt de Dienst Wegverkeer het register via elektronische weg aan de Europese
      Commissie.

      6 Bij ministeriële regeling kunnen nadere regels worden gesteld ter uitvoering van dit artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel7
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel6
