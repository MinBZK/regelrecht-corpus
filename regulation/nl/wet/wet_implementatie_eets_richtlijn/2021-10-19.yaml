        bwb_id: BWBR0045586
        artikel: '10'
        hoofdstuk: '4'
  - number: '10'
    text: |-
      1 De tolheffer stelt een EETS-gebiedsverklaring op.

      2 De EETS-gebiedsverklaring bevat in ieder geval:

      a. de algemene voorwaarden voor EETS-aanbieders inzake toegang tot zijn EETS-gebied die op grond van artikel 6,
      negende lid, van [Richtlijn (EU) 2019/520](32019L0520) door middel van uitvoeringshandelingen zijn vastgesteld;

      b. de procedurele voorwaarden, met inbegrip van de commerciële voorwaarden, waaronder de methode voor het bepalen
      van de vergoeding, overeenkomstig [artikel 23][ref1];

      c. indien van toepassing, de gedetailleerde planning van de op grond van artikel 15, zevende lid, van [Richtlijn
      (EU) 2019/520](32019L0520) door middel van uitvoeringshandelingen vastgestelde procedure voor de beoordeling
      of herbeoordeling van de conformiteit met de specificaties en van de geschiktheid voor gebruik van de
      interoperabiliteitsonderdelen;

      d. overige op grond van artikel 6, negende lid, van [Richtlijn (EU) 2019/520](32019L0520) door middel van
      uitvoeringshandelingen vastgestelde eisen aan de inhoud van de EETS-gebiedsverklaring.


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel23
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0045586
        artikel: '23'
        hoofdstuk: '5'
  - number: '11'
    text: |-
      1 Een toekomstige tolheffer die verantwoordelijk is voor een nieuw in gebruik te nemen elektronisch
      tolheffingssysteem voor het wegverkeer in Nederland, maakt de EETS-gebiedsverklaring tijdig genoeg via
      elektronische weg bekend om geïnteresseerde EETS-aanbieders uiterlijk een maand voor de operationele
      start van het systeem te kunnen accrediteren. Daarbij neemt de tolheffer de planning, bedoeld in
      [artikel 10, tweede lid, onderdeel c][ref1], in acht.

      2 Een tolheffer die verantwoordelijk is voor een voor 19 oktober 2021 bestaand elektronisch tolheffingssysteem
      voor het wegverkeer in Nederland dat op of na 19 oktober 2021 ingrijpend wordt gewijzigd, maakt de EETS-
      gebiedsverklaring tijdig genoeg bekend om geïnteresseerde EETS-aanbieders uiterlijk een maand voor de operationele
      start van het gewijzigde systeem te kunnen accrediteren en om reeds geaccrediteerde EETS-aanbieders in staat te
      stellen hun interoperabiliteitsonderdelen aan te passen aan de nieuwe vereisten en om hen uiterlijk een maand
      voor de start van het gewijzigde systeem opnieuw te kunnen accrediteren. Daarbij neemt de tolheffer de duur van de
      procedure in acht, bedoeld in [artikel 10, tweede lid, onderdeel c][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0045586#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0045586#Artikel10
    url: https://wetten.overheid.nl/BWBR0045586/2021-10-19#Artikel11
