        artikel: 5:19
  - number: '21'
    text: |-
      1 Handelen of nalaten in strijd met een voorschrift, gesteld bij of krachtens de
      [artikelen 2, eerste en tweede lid][ref1], [11, tweede lid, tweede volzin][ref2] en [19][ref3] wordt gestraft met
      geldboete van de tweede categorie.

      2 Het strafbare feit wordt beschouwd als overtreding.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel2
