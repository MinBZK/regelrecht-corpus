    text: 'Deze wet kan worden aangehaald als: Wet ambulancevervoer.'
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel23
  - number: '24'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel24
