  - number: '15'
    text: |-
      1 Indien in het gebied van een centrale post met minder ambulance-auto's aan het ambulancevervoer wordt deelgenomen
      dan is voorgeschreven krachtens [artikel 4, eerste lid][ref1], doen gedeputeerde staten hiervan mededeling in het
      provinciaal blad en in een of meer dag- of nieuwsbladen die in de provincie verspreid worden.

      2 Bij deze mededeling wordt tevens een termijn gesteld, na welke het college of de colleges van burgemeester en
      wethouders van de betrokken gemeente onderscheidenlijk gemeenten verplicht zijn in het nodige ambulancevervoer te
      voorzien, indien binnen deze termijn niet voldoende vergunningen zijn verleend.

      3 Gedeputeerde staten doen mededeling aan het college of de colleges van burgemeester en wethouders van de
      betrokken gemeente onderscheidenlijk gemeenten van het ontstaan van deze verplichting.

      4 Bij de toepassing van de vorige leden wordt tevens bepaald, binnen welke termijn het ambulancevervoer tot stand
      moet worden gebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: '17'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de inschakeling bij het
      vervoer van zieken en ongevalsslachtoffers van andere vervoermiddelen dan ambulance-auto's. Voor zover bij deze
      maatregel niet anders wordt bepaald, is het bij of krachtens deze wet bepaalde van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel17
  - number: 17a
    text: |-
      1 Onze Minister kan bepalen dat het bij of krachtens de voorgaande artikelen bepaalde niet geldt met betrekking tot
      in zijn besluit aangewezen ambulancevervoer of categorieën van ambulancevervoer.
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel17a
  - number: '19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld betreffende het aan Onze Minister
      verstrekken van documentatiegegevens welke van belang zijn voor een goede uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel19
  - number: '20'
    text: |-
      1 Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid, alsmede de bij besluit van Onze
      Minister van Verkeer en Waterstaat of bij besluit van gedeputeerde staten aangewezen ambtenaren.

      2 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel20
  - number: 20a
    text: |-
      De in [artikel 20][ref1] bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel20a
    references:
