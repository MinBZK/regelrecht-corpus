        bwb_id: BWBR0005276
        artikel: '4'
  - number: '2'
    text: |-
      1 Het is verboden ambulancevervoer te verrichten:

      a. zonder vergunning van gedeputeerde staten van de provincie waar de centrale post is gelegen voor het gebied
      waarop de aanvrage betrekking heeft;

      b. zonder opdracht, in het gegeven geval verstrekt door degene die belast is met de leiding van de in de vergunning
      aangewezen centrale post.

      2 De centrale posten zijn werkzaam voor de op grond van [artikel 3 van de Brandweerwet 1985][ref1] bij algemene
      maatregel van bestuur aangewezen gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel3
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '3'
  - number: '4'
    text: |-
      1 Gedeputeerde staten bepalen het aantal ambulance-auto's, waarmede tenminste aan het ambulancevervoer moet en ten
      hoogste mag worden deelgenomen, alsmede de spreiding hiervan.

      2 Gedeputeerde staten stellen de inspecteur in de gelegenheid, omtrent het ontwerp van regelen als in het eerste
      lid bedoeld alsmede omtrent wijziging en intrekking daarvan, zijn zienswijze kenbaar te maken.

      3 Onze Minister kan ter zake van de in dit artikel opgedragen taken beleidsregels geven.
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel4
  - number: '7'
    text: |-
      1 Ten aanzien van elke aanvrage om ambulancevervoer beslist degene die is belast met de leiding van de centrale
      post binnen welker gebied het aangevraagde vervoer aanvangt, of ambulancevervoer nodig is, alsmede door wie en op
      welke wijze het zal worden verricht. Zo nodig kan hij degene die met de leiding van een andere centrale post is
      belast verzoeken een opdracht tot het verrichten van het aangevraagde ambulancevervoer te verstrekken. Ingeval van
      vervoer vanuit het buitenland wordt de beslissing genomen door degene die is belast met de leiding van de in de
      vergunning van de vervoerder aangewezen centrale post.

      2 Een opdracht tot ambulancevervoer kan niet worden verstrekt voor vervoer, aanvangend buiten het gebied waarvoor
      de centrale post is ingesteld, behoudens in het geval, bedoeld in de tweede en derde volzin van het eerste lid.

      3 Bij de in het eerste lid bedoelde beslissing worden de regelen in acht
      genomen, welke hieromtrent worden gesteld door het openbaar lichaam, bedoeld in
      [artikel 4, eerste lid, van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref1].

      4 Een besluit tot vaststelling, wijziging of intrekking van de in het derde lid bedoelde regelen behoeft de
      goedkeuring van gedeputeerde staten. De goedkeuring kan worden onthouden wegens strijd met het recht of het
      algemeen belang.

      5 Alvorens te beslissen winnen gedeputeerde staten het advies in van de inspecteur. Van een besluit als bedoeld
      in het vierde lid wordt door gedeputeerde staten mededeling gedaan aan de inspecteur door toezending van een
      afschrift.


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
  - number: '8'
    text: Gedeputeerde staten bepalen, welke gegevens de aanvrage om een vergunning dient te bevatten.
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel8
  - number: '9'
    text: |-
      Op de voorbereiding van een beschikking als bedoeld in [artikel 2, eerste lid][ref1], is afdeling
      [3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10'
    text: |-
      Een vergunning voor het verrichten van ambulancevervoer moet en mag slechts worden geweigerd indien:

      a. de verlening niet in overeenstemming zou zijn met de omvang van de behoefte aan ambulancevervoer en de spreiding
      hiervan, zoals deze zijn vastgesteld krachtens [artikel 4][ref1];

      b. redelijkerwijs moet worden aangenomen, dat niet of niet op de juiste wijze gevolg zal worden gegeven aan de
      beslissingen van degene die met de leiding van de centrale post is belast.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: '11'
    text: |-
      1 Een vergunning kan voor een bepaalde tijd worden verleend, indien nog niet aan al het krachtens [artikel 4][ref1]
      bepaalde wordt voldaan.

      2 Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden.
      De beperkingen en voorschriften kunnen worden gewijzigd of ingetrokken en nieuwe voorschriften kunnen worden
      gesteld.

      3 Bij overgang van een onderneming op rechtverkrijgenden onder algemene titel gaat tevens de vergunning over op
      degene die de onderneming voortzet.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: '12'
    text: |-
      1 Een vergunning kan slechts worden ingetrokken:

      a. op verzoek van de vergunninghouder;

      b. indien niet meer wordt voldaan aan de regelen, gesteld krachtens [artikel 4, eerste lid][ref1];

      c. indien gehandeld wordt in strijd met de vergunning of aan de vergunning verbonden voorschriften;

      d. indien niet of niet op de juiste wijze gevolg is gegeven aan de beslissingen van degene die met de leiding van
      de centrale post is belast.

      2 De werking van de beschikking tot intrekking van de vergunning wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist, tenzij bij de bekendmaking van de beschikking
      wordt bepaald dat deze terstond van kracht is.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: 12a
    text: |-
      Het College sanering zorginstellingen, bedoeld in de [Wet toelating zorginstellingen][ref1], kan subsidie
      verstrekken ter voorziening in de financiële gevolgen van:

      a. wijziging of opheffing van de vestigingsplaats van een centrale post ingevolge
      [artikel 4, eerste lid, onder a, van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref2];

      b. sanering van ambulancevervoer ingeval een vergunning is ingetrokken op grond van [artikel 12, eerste lid][ref3].

      De [artikelen 17, eerste en vierde tot en met achtste lid][ref4], en
      [37, laatste volzin, van de Wet toelating zorginstellingen][ref5] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0018906
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel4
      [ref3]: https://wetten.overheid.nl/BWBR0002757#Artikel12
