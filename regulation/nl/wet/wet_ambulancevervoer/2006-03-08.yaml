preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een regeling te treffen inzake het vervoer van zieken
    en ongevalsslachtoffers, in het bijzonder voor zover dit geschiedt met daarvoor ingerichte motorvoertuigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      1 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder:

      Onze Minister: Onze Minister van Sociale Zaken en Volksgezondheid;

      de inspecteur: de op grond van een aanwijzing krachtens [artikel 20][ref1] ter plaatse bevoegde inspecteur van het
      Staatstoezicht op de volksgezondheid;

      ambulance-auto: een in het bijzonder voor het vervoer van zieken en ongevalsslachtoffers ingericht motorvoertuig;

      ambulancevervoer: vervoer van zieken en ongevalsslachtoffers en hun begeleiders met ambulance-auto's;

      centrale post: een centrale post voor het ambulancevervoer als bedoeld in
      [artikel 4, eerste lid, onder a, van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref2].

      2 Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder ambulancevervoer niet verstaan:

      a. vervoer met aan het Rijk toebehorende ambulance-auto's van personen die rechtens van hun vrijheid zijn beroofd;

      b. vervoer met militaire ambulance-auto's, alsmede - voorzover dit wordt verricht door daartoe bestemde diensten -
      vervoer in buitengewone omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2006-03-08#Artikel1
    references:
      - id: ref1
