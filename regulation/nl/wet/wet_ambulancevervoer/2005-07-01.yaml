---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: wet_ambulancevervoer
regulatory_layer: WET
publication_date: '1993-12-23'
valid_from: '2005-07-01'
bwb_id: BWBR0002757
url: https://wetten.overheid.nl/BWBR0002757/2005-07-01
preamble:
  text: |-
    Wij JULIANA, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz., enz., enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is een regeling te treffen inzake het vervoer van zieken
    en ongevalsslachtoffers, in het bijzonder voor zover dit geschiedt met daarvoor ingerichte motorvoertuigen;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      Voor de toepassing van het bij of krachtens deze wet bepaalde wordt verstaan onder: Onze Minister: Onze
      Minister van Sociale Zaken en Volksgezondheid; de inspecteur: de op grond van een aanwijzing krachtens
      [artikel 20][ref1] ter plaatse bevoegde inspecteur van het Staatstoezicht op de volksgezondheid;
      ambulance-auto: een in het bijzonder voor het vervoer van zieken en ongevalsslachtoffers ingericht
      motorvoertuig; ambulancevervoer: vervoer van zieken en ongevalsslachtoffers en hun begeleiders
      met ambulance-auto's; centrale post: een centrale post voor het ambulancevervoer als bedoeld in
      [artikel 4, eerste lid, onder a, van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005276
        artikel: '4'
  - number: '1.2'
    text: 'Voor de toepassing van het bij of krachtens deze wet bepaalde wordt onder ambulancevervoer niet verstaan:'
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel1
  - number: 1.2.a
    text: vervoer met aan het Rijk toebehorende ambulance-auto's van personen die rechtens van hun vrijheid zijn beroofd;
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel1
  - number: 1.2.b
    text: |-
      vervoer met militaire ambulance-auto's, alsmede - voorzover dit wordt verricht door daartoe bestemde diensten -
      vervoer in buitengewone omstandigheden.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel1
  - number: '2.1'
    text: 'Het is verboden ambulancevervoer te verrichten:'
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel2
  - number: 2.1.a
    text: |-
      zonder vergunning van gedeputeerde staten van de provincie waar de centrale post is gelegen voor het gebied waarop
      de aanvrage betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel2
  - number: 2.1.b
    text: |-
      zonder opdracht, in het gegeven geval verstrekt door degene die belast is met de leiding van de in de vergunning
      aangewezen centrale post.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel2
  - number: '2.2'
    text: |-
      De centrale posten zijn werkzaam voor de op grond van [artikel 3 van de Brandweerwet 1985][ref1] bij algemene
      maatregel van bestuur aangewezen gebieden.


      [ref1]: https://wetten.overheid.nl/BWBR0003764#Artikel3
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0003764
        artikel: '3'
  - number: '4.1'
    text: |-
      Gedeputeerde staten bepalen het aantal ambulance-auto's, waarmede tenminste aan het ambulancevervoer moet en ten
      hoogste mag worden deelgenomen, alsmede de spreiding hiervan.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel4
  - number: '4.2'
    text: |-
      Gedeputeerde staten stellen de inspecteur in de gelegenheid, omtrent het ontwerp van regelen als in het eerste lid
      bedoeld alsmede omtrent wijziging en intrekking daarvan, zijn zienswijze kenbaar te maken.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel4
  - number: '4.3'
    text: Onze Minister kan ter zake van de in dit artikel opgedragen taken beleidsregels geven.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel4
  - number: '7.1'
    text: |-
      Ten aanzien van elke aanvrage om ambulancevervoer beslist degene die is belast met de leiding van de centrale post
      binnen welker gebied het aangevraagde vervoer aanvangt, of ambulancevervoer nodig is, alsmede door wie en op welke
      wijze het zal worden verricht. Zo nodig kan hij degene die met de leiding van een andere centrale post is belast
      verzoeken een opdracht tot het verrichten van het aangevraagde ambulancevervoer te verstrekken. Ingeval van vervoer
      vanuit het buitenland wordt de beslissing genomen door degene die is belast met de leiding van de in de vergunning
      van de vervoerder aangewezen centrale post.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel7
  - number: '7.2'
    text: |-
      Een opdracht tot ambulancevervoer kan niet worden verstrekt voor vervoer, aanvangend buiten het gebied waarvoor de
      centrale post is ingesteld, behoudens in het geval, bedoeld in de tweede en derde volzin van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel7
  - number: '7.3'
    text: |-
      Bij de in het eerste lid bedoelde beslissing worden de regelen in acht
      genomen, welke hieromtrent worden gesteld door het openbaar lichaam, bedoeld in
      [artikel 4, eerste lid, van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
  - number: '7.4'
    text: |-
      Een besluit tot vaststelling, wijziging of intrekking van de in het derde lid bedoelde regelen behoeft de
      goedkeuring van gedeputeerde staten. De goedkeuring kan worden onthouden wegens strijd met het recht of het
      algemeen belang.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel7
  - number: '7.5'
    text: |-
      Alvorens te beslissen winnen gedeputeerde staten het advies in van de inspecteur. Van een besluit als bedoeld
      in het vierde lid wordt door gedeputeerde staten mededeling gedaan aan de inspecteur door toezending van een
      afschrift.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel7
  - number: '8'
    text: Gedeputeerde staten bepalen, welke gegevens de aanvrage om een vergunning dient te bevatten.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel8
  - number: '9'
    text: |-
      Op de voorbereiding van een beschikking als bedoeld in [artikel 2, eerste lid][ref1], is afdeling
      [3.4 van de Algemene wet bestuursrecht][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Afdeling3.4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0005537
        afdeling: '3.4'
  - number: '10'
    text: 'Een vergunning voor het verrichten van ambulancevervoer moet en mag slechts worden geweigerd indien:'
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel10
  - number: 10.a
    text: |-
      de verlening niet in overeenstemming zou zijn met de omvang van de behoefte aan ambulancevervoer en de spreiding
      hiervan, zoals deze zijn vastgesteld krachtens [artikel 4][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: 10.b
    text: |-
      redelijkerwijs moet worden aangenomen, dat niet of niet op de juiste wijze gevolg zal worden gegeven aan de
      beslissingen van degene die met de leiding van de centrale post is belast.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel10
  - number: '11.1'
    text: |-
      Een vergunning kan voor een bepaalde tijd worden verleend, indien nog niet aan al het krachtens [artikel 4][ref1]
      bepaalde wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: '11.2'
    text: |-
      Een vergunning kan onder beperkingen worden verleend. Aan een vergunning kunnen voorschriften worden verbonden. De
      beperkingen en voorschriften kunnen worden gewijzigd of ingetrokken en nieuwe voorschriften kunnen worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel11
  - number: '11.3'
    text: |-
      Bij overgang van een onderneming op rechtverkrijgenden onder algemene titel gaat tevens de vergunning over op
      degene die de onderneming voortzet.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel11
  - number: '12.1'
    text: 'Een vergunning kan slechts worden ingetrokken:'
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12
  - number: 12.1.a
    text: op verzoek van de vergunninghouder;
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12
  - number: 12.1.b
    text: |-
      indien niet meer wordt voldaan aan de regelen, gesteld krachtens [artikel 4, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: 12.1.c
    text: indien gehandeld wordt in strijd met de vergunning of aan de vergunning verbonden voorschriften;
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12
  - number: 12.1.d
    text: |-
      indien niet of niet op de juiste wijze gevolg is gegeven aan de beslissingen van degene die met de leiding van de
      centrale post is belast.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12
  - number: '12.2'
    text: |-
      De werking van de beschikking tot intrekking van de vergunning wordt opgeschort totdat de beroepstermijn is
      verstreken of, indien beroep is ingesteld, op het beroep is beslist, tenzij bij de bekendmaking van de beschikking
      wordt bepaald dat deze terstond van kracht is.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12
  - number: 12a
    text: |-
      Het College sanering ziekenhuisvoorzieningen, bedoeld in de [Wet ziekenhuisvoorzieningen][ref1], kan subsidie
      verstrekken ter voorziening in de financiële gevolgen van:


      [ref1]: https://wetten.overheid.nl/BWBR0002753
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002753
  - number: 12a.a
    text: |-
      wijziging of opheffing van de vestigingsplaats van een centrale post ingevolge
      [artikel 4, eerste lid, onder a, van de Wet geneeskundige hulpverlening bij ongevallen en rampen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0005276#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0005276
        artikel: '4'
  - number: 12a.b
    text: |-
      sanering van ambulancevervoer ingeval een vergunning is ingetrokken op grond van [artikel 12, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel12
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel12a
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '12'
  - number: '15.1'
    text: |-
      Indien in het gebied van een centrale post met minder ambulance-auto's aan het ambulancevervoer wordt deelgenomen
      dan is voorgeschreven krachtens [artikel 4, eerste lid][ref1], doen gedeputeerde staten hiervan mededeling in het
      provinciaal blad en in een of meer dag- of nieuwsbladen die in de provincie verspreid worden.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel4
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '4'
  - number: '15.2'
    text: |-
      Bij deze mededeling wordt tevens een termijn gesteld, na welke de betrokken gemeente of gemeenten verplicht zijn in
      het nodige ambulancevervoer te voorzien, indien binnen deze termijn niet voldoende vergunningen zijn verleend.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel15
  - number: '15.3'
    text: |-
      Gedeputeerde staten doen mededeling aan het bestuur van de betrokken gemeente of gemeenten van het ontstaan van
      deze verplichting.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel15
  - number: '15.4'
    text: |-
      Bij de toepassing van de vorige leden wordt tevens bepaald, binnen welke termijn het ambulancevervoer tot stand
      moet worden gebracht.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel15
  - number: '17'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld omtrent de inschakeling bij het
      vervoer van zieken en ongevalsslachtoffers van andere vervoermiddelen dan ambulance-auto's. Voor zover bij deze
      maatregel niet anders wordt bepaald, is het bij of krachtens deze wet bepaalde van overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel17
  - number: 17a.1
    text: |-
      Onze Minister kan bepalen dat het bij of krachtens de voorgaande artikelen bepaalde niet geldt met betrekking tot
      in zijn besluit aangewezen ambulancevervoer of categorieën van ambulancevervoer.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel17a
  - number: '19'
    text: |-
      Bij of krachtens algemene maatregel van bestuur kunnen regelen worden gesteld betreffende het aan Onze Minister
      verstrekken van documentatiegegevens welke van belang zijn voor een goede uitvoering van deze wet.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel19
  - number: '20.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen ambtenaren van het Staatstoezicht op de volksgezondheid, alsmede de bij besluit van Onze
      Minister van Verkeer en Waterstaat of bij besluit van gedeputeerde staten aangewezen ambtenaren.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel20
  - number: '20.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel20
  - number: 20a
    text: |-
      De in [artikel 20][ref1] bedoelde ambtenaren beschikken niet over de bevoegdheden, genoemd in de
      [artikelen 5:18][ref2] en [5:19 van de Algemene wet bestuursrecht][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel5
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel5
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel20a
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '20'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '5'
      - id: ref3
        bwb_id: BWBR0005537
        artikel: '5'
  - number: '21.1'
    text: |-
      Handelen of nalaten in strijd met een voorschrift, gesteld bij of krachtens de
      [artikelen 2, eerste en tweede lid][ref1], [11, tweede lid, tweede volzin][ref2] en [19][ref3] wordt gestraft met
      geldboete van de tweede categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0002757#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0002757#Artikel11
      [ref3]: https://wetten.overheid.nl/BWBR0002757#Artikel19
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0002757
        artikel: '2'
      - id: ref2
        bwb_id: BWBR0002757
        artikel: '11'
      - id: ref3
        bwb_id: BWBR0002757
        artikel: '19'
  - number: '21.2'
    text: Het strafbare feit wordt beschouwd als overtreding.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel21
  - number: '23'
    text: 'Deze wet kan worden aangehaald als: Wet ambulancevervoer.'
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel23
  - number: '24'
    text: |-
      Deze wet treedt in werking op een door Ons te bepalen tijdstip, dat voor de onderscheidene artikelen of onderdelen
      daarvan verschillend kan worden gesteld.
    url: https://wetten.overheid.nl/BWBR0002757/2005-07-01#Artikel24
