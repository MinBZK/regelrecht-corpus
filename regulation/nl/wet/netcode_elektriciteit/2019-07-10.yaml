  - number: '11.5'
    text: |-
      In geval van samenloop van het dreigen weg te vallen dan wel wegvallen van een leverancier en een BRP voor
      aansluitingen die door beide partijen bediend worden, gelden de volgende aanvullende bepalingen:

      a. Bij het gelijktijdig nemen van het besluit om een vergunning en een erkenning in te trekken, geldt de
      aanvullende bepaling dat het besluit dat de vergunning wordt ingetrokken eerder geacht wordt te zijn genomen dan de
      beslissing tot het intrekken van de erkenning als BRP.

      b. Als binnen de opschortingsperiode van de intrekking van de erkenning van de BRP de vergunning van de leverancier
      bij besluit ingetrokken wordt, kan, indien noodzakelijk, de opschortingsperiode van de BRP verlengd worden. Deze
      verlenging loopt ten hoogste tot het einde van de tijdelijke voortzettingsperiode die geldt voor de betreffende
      leverancier en geldt alleen voor de aansluitingen die onder deze vergunninghouder vallen.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel11.5
  - number: '11.6'
    text: |-
      1 In de situatie als bedoeld in [artikel 10.6, vierde lid][ref1], treedt de BRP die de
      balanceringsverantwoordelijkheid voor die aangeslotenen draagt, in de plaats van de leverancier tot het
      moment waarop de grootverbruiker een nieuwe leveringsovereenkomst heeft gesloten dan wel de levering aan die
      grootverbruiker is beëindigd. De betreffende BRP switcht daartoe de betreffende aangeslotenen overeenkomstig
      [paragraaf 4.1 van de Informatiecode elektriciteit en gas][ref2] naar zich toe. De betrokken aangeslotenen
      worden zo spoedig mogelijk, maar uiterlijk binnen drie werkdagen na de effectuering van de switch schriftelijk
      door de betreffende BRP van de ontstane situatie en de thans geldende voorwaarden (daaronder begrepen de
      opzeggingsmogelijkheden) op de hoogte gesteld.

      2 In de in het eerste lid bedoelde situatie wordt de aangeslotene geacht een leveringscontract te hebben met de BRP
      die in de plaats van de leverancier treedt. De grootverbruiker, heeft twee maanden het recht het leveringscontract
      zonder opzegtermijn te beëindigen. Tevens kan de BRP, voor zover niet reeds overeengekomen, redelijke afspraken
      maken ten aanzien van balanceringsverantwoordelijkheid voor de aansluiting.

      3 De in het eerste lid bedoelde BRP die in de plaats van de leverancier treedt, mag aan de aangeslotene, niet
      zijnde kleinverbruikers, een tarief voor de geleverde energie in rekening brengen dat overeenkomt met de day-ahead-
      clearingprijs, tenzij de aangeslotene met deze BRP anders is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Paragraaf4.1
