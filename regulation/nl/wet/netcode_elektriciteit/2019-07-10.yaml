  - number: '12.1'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet maakt na overleg met de buitenlandse instellingen als bedoeld
      in [artikel 16, tweede lid, onderdeel h, van de Elektriciteitswet 1998][ref1] jaarlijks voor 15 september de
      op basis van de [artikelen 12.18][ref2] en [12.20][ref3] berekende veilig beschikbare landsgrensoverschrijdende
      transportcapaciteit voor elektriciteit voor het volgende kalenderjaar op uurbasis openbaar.

      2 De netbeheerder van het landelijk hoogspanningsnet maakt ten hoogste één dag voor de in [artikel 12.6][ref4]
      genoemde dag waarop de day-aheadcapaciteit wordt bekendgemaakt opnieuw een zo nauwkeurig mogelijke op basis van
      de [artikelen 12.18][ref5] en [12.20][ref6] berekende waarde voor de veilig beschikbare landsgrensoverschrijdende
      transportcapaciteit van de verbindingen Eemshaven–Noorwegen en Eemshaven–Denemarken voor de betreffende dag van
      transport op uurbasis openbaar.

      3 De netbeheerder van het landelijk hoogspanningsnet maakt ten hoogste één dag voor de in [artikel 12.6][ref7]
      genoemde dag waarop het day-aheadcapaciteitsdomein wordt bekendgemaakt een zo nauwkeurig mogelijke op basis van de
      [artikelen 12.19][ref8] en [12.20][ref9] met gebruikmaking van de stroomgebaseerde aanpak berekende waarde voor het
      veilig beschikbare capaciteitsdomein voor landsgrensoverschrijdend transport (hierna: het capaciteitsdomein) voor
      de betreffende dag van transport op uurbasis openbaar.

      4 De netbeheerder van het landelijk hoogspanningsnet maakt eventuele wijzigingen van de in het eerste lid genoemde
      veilig beschikbare landsgrensoverschrijdende transportcapaciteit zo spoedig mogelijk openbaar.


