  - number: '10.16'
    text: |-
      1 De door de netbeheerder, op basis van [artikel 10.26, derde lid][ref1], van een BRP ontvangen verzoeken
      tot aanpassing van de hem eerder op basis van [artikel 10.18, vierde lid][ref2], en [10.19, derde lid][ref3],
      toegezonden meetgegevens zullen door de netbeheerder worden afgehandeld voor de termijn waarop
      [artikel 10.19][ref4] respectievelijk [10.20][ref5] van toepassing is.

      2 Verzoeken op basis van [artikel 10.26, derde lid][ref6], neemt de netbeheerder aan wie het verzoek is
      gericht niet in behandeling wanneer meer dan vijf werkdagen zijn verstreken na de dag waarop hij overeenkomstig
      [artikel 10.18, vierde lid][ref7], of [10.19, derde lid][ref8], de meetgegevens aan die BRP heeft verzonden, tenzij
      de BRP de fout waarvan hij correctie verzoekt redelijkerwijs niet binnen die termijn heeft kunnen opmerken.

      3 Voor zover het in het eerste lid genoemde verzoek geen betrekking heeft op onjuiste toerekening van meetgegevens
      aan de desbetreffende BRP, stelt de netbeheerder de desbetreffende meetverantwoordelijke vóór 10:00 uur van de
      eerstvolgende werkdag na de dag van ontvangst van het verzoek, op de hoogte van het verzoek van de BRP. Daarbij
      worden de door de BRP voorgestelde meetgegevens meegezonden.

      4 Indien de netbeheerder van een BRP een verzoek op basis van [artikel 10.26, vijfde lid][ref9], heeft ontvangen
      dan voert hij [artikel 10.21][ref10] onverwijld uit.


