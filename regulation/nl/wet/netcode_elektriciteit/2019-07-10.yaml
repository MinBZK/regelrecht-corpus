  - number: '7.4'
    text: |-
      1 Ten behoeve van de registratie van de onderbrekingen in het transport van elektriciteit, als bedoeld
      in [artikel 4.1, eerste lid, van het Besluit investeringsplan en kwaliteit elektriciteit en gas][ref1],
      alsmede van de vaststelling van de prestatie-indicatoren, als bedoeld in
      [artikel 3.1, onderdelen a tot en met c, van de Regeling investeringsplan en kwaliteit elektriciteit en gas][ref2],
      past de netbeheerder de ‘Handleiding Nestor Elektriciteit’ (versie 2.0 van september 2012) toe. Deze handleiding
      ligt ter inzage bij de regionale netbeheerder.

      2 Ten behoeve van de registratie van de afwijkingen van de eisen
      aan de kwaliteit van het transport van elektriciteit, als bedoeld in
      [artikel 4.1, eerste lid, van het Besluit investeringsplan en kwaliteit elektriciteit en gas][ref3],
      alsmede van de vaststelling van de prestatie-indicatoren, als bedoeld in
      [artikel 3.1, onderdeel d, van de Regeling investeringsplan en kwaliteit elektriciteit en gas][ref4], past de
      netbeheerder het ‘Achtergronddocument Spanningskwaliteit in Nederland’ toe. Dit document ligt ter inzage bij de
      netbeheerder.

      3 [Gereserveerd].

      4 De metingen bedoeld in het derde lid omvatten voor de aansluitingen bedoeld in de Bijlage bij het besluit
      van de Autoriteit Consument en Markt van 17 maart 2009 met kenmerk 102971_1/24 tevens de meting van transiënte
      overspanningen.

      5 Op de metingen als bedoeld in het derde lid is IEC 61000-4-30:2008-10 ‘Electromagnetic compatibility (EMC) – Part
      4-30 Testing and measurement techniques – Power quality measurement methods’ van toepassing.

      6 De netbeheerder stelt de meetresultaten van de in het derde lid bedoelde metingen, betrekking hebbend op een
      bepaalde aansluiting, desgevraagd ter beschikking aan de desbetreffende aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0041487#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0041543#Artikel3.1
      [ref3]: https://wetten.overheid.nl/BWBR0041487#Artikel4.1
