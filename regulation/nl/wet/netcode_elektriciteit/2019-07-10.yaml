  - number: '10.34'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet maakt van iedere door zichzelf en van iedere door een BRP
      betaalde boete een aantekening in een register, dat voor iedere BRP op zijn hoofdkantoor ter inzage ligt en waarvan
      iedere BRP desgewenst een afschrift zal worden gezonden.

      2 Uiterlijk de vijftiende van een maand keert de netbeheerder van het landelijk hoogspanningsnet aan BRP's een
      bedrag uit ter grootte van de door de BRP's betaalde boetes overeenkomstig [artikel 10.32][ref1] en de door de
      netbeheerder van het landelijk hoogspanningsnet betaalde boetes overeenkomstig [artikel 10.33][ref2] in de daaraan
      voorafgaande kalendermaand, gedeeld door het totaal aantal erkende BRP's in die voorafgaande maand, vermeerderd met
      1, zijnde de netbeheerder van het landelijk hoogspanningsnet als mede-restitutiegerechtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.32
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel10.33
