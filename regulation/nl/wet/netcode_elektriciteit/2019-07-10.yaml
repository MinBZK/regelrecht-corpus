  - number: '3.28'
    text: |-
      1 De tijdsduur van de bedrijfsperiode voor spanningen tussen 1,118 pu en 1,15 pu in netten met nominale spanning
      tussen 110 kV (inclusief) en 300 kV (exclusief) en voor spanningen tussen 1,05 pu en 1,10 pu in netten met nominale
      spanning tussen 300 kV (inclusief) en 400 kV, als bedoeld in artikel 16, tweede lid, onderdeel a, subonderdeel i,
      van de Verordening (EU) 2016/631 (NC RfG), is 20 minuten.

      2 De parameters voor de fault-ride-through-capaciteit van de synchrone elektriciteitsproductie-eenheid als bedoeld
      in artikel 16, derde lid, onderdeel a, subonderdeel i, en tabel 7.1 van de Verordening (EU) 2016/631 (NC RfG) zijn:

      a. de spanningsparameters:

      1°. U is 0 pu;

      2°. U is 0,25 pu;

      3°. U is 0,70 pu;

      4°. U is 0,85 pu;

      b. de tijdsparameters:

      1°. t is 0,25 s;

      2°. t is 0,3 s;

      3°. t is t;

      4°. t is 1,5 s.

      3 De parameters voor de fault-ride-through-capaciteit van de power park module, als bedoeld in artikel 16, derde
      lid, onderdeel a, onderdeel i, en tabel 7.2 van de Verordening (EU) 2016/631 (NC RfG) zijn:

      a. de spanningsparameters:

      1°. U is 0 pu;

      2°. U is U;

      3°. U is U;

      4°. U is 0,85 pu;

      b. de tijdsparameters:

      1°. t is 0,25 s;

      2°. t is t;

      3°. t is t;

      4°. t is 3,0 s.

      4 Indien de elektriciteitsproductie-eenheid redelijkerwijs niet aan de parameter t van de fault-ride-through
      curve kan voldoen, wordt in overleg tussen de aangeslotene en de netbeheerder van het landelijk hoogspanningsnet,
      rekening houdend met de kritische kortsluittijd, de waarde van tvastgesteld en gespecificeerd. Deze waarde wordt
      opgenomen in de aansluit- en transportovereenkomst.

      5 De fault-ride-through-capaciteit in het geval van asymmetrische storingen, als bedoeld in artikel 16, derde lid,
      onderdeel c, van de Verordening (EU) 2016/631 (NC RfG), is identiek aan de fault-ride-through bij symmetrische
      storingen.

      6 De aangeslotene en de netbeheerder van het landelijk hoogspanningsnet bereiken overeenstemming over de
      instellingen van de synchronisatieapparatuur, als bedoeld in artikel 16, vierde lid, van de Verordening (EU)
      2016/631 (NC RfG). De overeenstemming wordt vastgelegd in de aansluit- en transportovereenkomst.

      7 De combinatie van spanningseisen als bedoeld in het eerste lid en de frequentie-eisen als bedoeld
      in [artikel 3.13, eerste lid][ref1], gelden bij een spanningsgradiënt van maximaal 0,05 pu/min en een
      frequentiegradiënt van maximaal 0,5%/min.


