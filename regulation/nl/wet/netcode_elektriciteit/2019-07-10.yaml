  - number: '10.31'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet publiceert de actuele hoogte van de prikkelcomponent op zijn
      website.

      2 De netbeheerder van het landelijk hoogspanningsnet past de hoogte van de prikkelcomponent iedere woensdag om
      00:00 uur aan op de volgende wijze:

      a. indien het prestatieniveau van de referentieperiode, zijnde 1 juli 1999 tot en met 31 december 2000, behaald
      is in de voorgaande week, lopend van 00:00 uur op maandag tot 23:59 uur op zondag, stelt hij de prikkelcomponent
      gelijk aan € 0,– per MWh;

      b. indien het prestatieniveau van de referentieperiode niet behaald is in de voorgaande week, lopend van 00:00 uur
      op maandag tot 23:59 uur op zondag, verhoogt hij de prikkelcomponent met € 1,– per MWh indien de prikkelcomponent
      in de voorgaande week gelijk was aan € 0,– per MWh, en met € 2,– per MWh indien de prikkelcomponent in de
      voorgaande week groter was dan € 0,– per MWh.

      3 Het in het tweede lid bedoelde prestatieniveau is behaald indien aan de volgende condities is voldaan:

      a. het aantal niet-beoogde energie-uitwisselingen over 5 minuten dat per week, omgerekend naar MW, groter dan
      300 MW respectievelijk kleiner dan -/-300 MW is, bedraagt minder dan 40;

      b. de gemiddelde niet-beoogde energie-uitwisseling over 5 minuten per week, omgerekend naar MW, groter is dan -/-
      20 MW én kleiner is dan 20 MW.

      4 Indien het prestatieniveau niet is gehaald ten gevolge van aantoonbare externe invloeden, past de netbeheerder
      van het landelijk hoogspanningsnet geen prikkelcomponent toe.

      5 De netbeheerder van het landelijk hoogspanningsnet verrekent, via zijn transportafhankelijk verbruikerstarief als
      bedoeld in [paragraaf 3.2 van de Tarievencode elektriciteit][ref1], in het jaar volgend op het jaar van verrekening
      van het in een kalenderjaar voor de netbeheerder van het landelijk hoogspanningsnet resulterende saldo van de
      verrekeningen van:

      a. onbalans met BRP's;

      b. de kosten met BSPs voor de geactiveerde middelen als bedoeld in [artikel 9.20, eerste lid, onderdeel a][ref2],
      met uitzondering van de kosten voor regel-, reserve- en noodvermogen als bedoeld in
      [artikel 3.2.2a, onderdeel a, van de Tarievencode elektriciteit][ref3];

      c. het onbalansnettingproces.

      6 Indien onbalans het gevolg is van een gebeurtenis in het net of van ingrijpen van een netbeheerder, zullen BRP's
      gecompenseerd worden voor de betaalde prikkelcomponent.

      Enkele voorbeelden van dergelijke gebeurtenissen zijn:

      a. automatische afschakeling van belasting als bedoeld in [artikel 9.20, eerste lid][ref4], of
      handmatige afschakeling in opdracht van de netbeheerder van het landelijk hoogspanningsnet als bedoeld in
      [artikel 9.22, eerste tot en met zesde lid][ref5];

      b. wijziging van de afname of invoeding op verzoek van een netbeheerder als bedoeld in de artikelen
      [artikel 9.2, derde lid][ref6];

      c. (gedeeltelijke) onderbreking van de transportdienst.

      7 De in het zesde lid bedoelde compensatie wordt verstrekt door de netbeheerder:

      a. die voor de afschakeling verantwoordelijk is;

      b. die een wijziging van de afname of invoeding heeft verzocht; of

      c. in wiens net de onderbreking plaatsvindt.

      8 De compensatie vindt slechts plaats voor dat deel van de onbalans dat door de afschakeling of de onderbreking is
      veroorzaakt en indien de hierdoor veroorzaakte onbalans voor alle BRP's gezamenlijk tenminste 1.000 MWh bedraagt.


