  - number: '9.21'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet geeft een opdracht als bedoeld in
      [artikel 9.20, tweede lid, onderdeel c][ref1], telefonisch.

      2 De netbeheerder van het landelijk hoogspanningsnet kondigt de opdracht tevoren aan en verstrekt daarbij een
      toelichting. Deze toelichting wordt, zonodig achteraf, schriftelijk bevestigd.

      3 Indien de situatie dermate spoedeisend is dat de netbeheerder van het landelijk hoogspanningsnet de opdracht
      niet tevoren kan aankondigen, licht hij de opdracht en de reden voor het achterwege laten van een voorafgaande
      aankondiging achteraf schriftelijk alsnog toe.

      4 De opregeling onderscheidenlijk inbedrijfname dient binnen de tijd die technisch mogelijk is te zijn uitgevoerd.

      5 Indien de opdracht is gegeven aan een of meer andere netbeheerders, ontvangt de netbeheerder van het landelijk
      hoogspanningsnet een telefonische terugmelding van hetgeen door de andere netbeheerder of netbeheerders is gedaan
      ter uitvoering van de opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.20
