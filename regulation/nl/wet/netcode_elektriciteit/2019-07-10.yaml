  - number: '1.5'
    text: |-
      Met in deze code bedoelde materialen en/of producten worden gelijkgesteld materialen en/of producten die rechtmatig
      zijn vervaardigd of in de handel zijn gebracht in een andere lidstaat van de Europese Unie dan wel rechtmatig zijn
      vervaardigd of in de handel zijn gebracht in een staat, niet zijnde een lidstaat van de Europese Unie, die partij
      is bij een daartoe strekkend of mede daartoe strekkend Verdrag dat Nederland bindt, en die voldoen aan eisen die
      een beschermingsniveau bieden dat ten minste gelijkwaardig is aan het niveau dat met de nationale eisen wordt
      nagestreefd.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel1.5
  - number: '2.1'
    text: |-
      1 De aansluiting voldoet aan de in deze paragraaf gestelde voorwaarden.

      2 In afwijking van het eerste lid, gelden de bepalingen van de [artikelen 2.13 tot en met 2.16][ref1] niet voor de
      aansluiting van een net op een net.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.13
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.1
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2.13'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.2'
    text: |-
      1 De netbeheerder stelt voor een aansluiting op een laagspanningsnet en voor een aansluiting op een
      middenspanningsnet met een gecontracteerd en beschikbaar gesteld vermogen kleiner dan 2 MW of een ander door de
      netbeheerder te bepalen vermogen, eenmalig een belastingkarakteristiek vast die kenmerkend is voor de categorie
      waartoe de aangesloten installatie behoort.

      2 Wanneer de aard van de in het eerste lid bedoelde installatie zodanig wijzigt, dat zij tot een andere categorie
      gaat behoren, meldt de aangeslotene deze wijziging aan de netbeheerder en stelt de netbeheerder een nieuwe
      belastingkarakteristiek vast.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.2
  - number: '2.3'
    text: |-
      1 Het verbinden van de elektrische installatie met de aansluiting geschiedt door of vanwege de netbeheerder.

      2 Het verbinden van het primaire gedeelte van de meetinrichting met het secundaire gedeelte van de meetinrichting
      geschiedt door de netbeheerder of een derde die overeenkomstig de [Meetcode elektriciteit][ref1] een erkenning
      heeft als meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: '2.4'
    text: |-
      1 De netbeheerder en de aangeslotene komen voor elk van de verbindingen behorende tot de aansluiting de locatie van
      het bijbehorende overdrachtspunt overeen.

      2 Aan elke aansluiting, niet zijnde een aansluiting van een net op een ander net, kent de netbeheerder een primair
      allocatiepunt toe ongeacht het aantal overdrachtspunten van een aansluiting.

      3 In aanvulling op het tweede lid kan een primair allocatiepunt worden toegekend aan een aansluiting van een net
      op een ander net indien dit een aansluiting betreft van een gesloten distributiesysteem waarvan de beheerder geen
      gebruik maakt van het elektronische berichtenverkeer als bedoeld in [paragraaf 13.5][ref1] ten behoeve van het
      faciliteren van derdentoegang.

      4 Indien voor een aansluiting, bestaande uit meer dan één verbinding, overeenkomstig het eerste lid meer dan
      één overdrachtspunt is overeengekomen, wordt door de netbeheerder aan elk van die overdrachtspunten een EAN-code
      toegekend, onverminderd de verplichting om overeenkomstig [artikel 2.1.1 van de Informatiecode elektriciteit][ref2]
      en gas aan de aansluiting als geheel een EAN-code toe te kennen.

      5 Indien op een aansluiting als bedoeld in het vierde lid, [artikel 2.5][ref3] wordt toegepast, worden de aan
      de afzonderlijke allocatiepunten toegekende EAN-codes tevens gebruikt ter identificatie van de bijbehorende
      overdrachtspunten van de aansluiting.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk13
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.5
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.4
