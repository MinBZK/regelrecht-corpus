      1 Een aangeslotene die beschikt over een verbruiksinstallatie aangesloten op een distributienet verstrekt de
      netbeheerder, desgewenst via zijn BRP, de plannings- en prognosegegevens, te weten:

      a. de niet-beschikbaarheidsplanning van de verbruiksinstallatie;

      b. de prognose van de hoeveelheid van het net af te nemen werkzaam vermogen en blindvermogen;

      c. indien de verbruiksinstallatie één of meer verbruikseenheden omvat die deelnemen aan vraagsturing, per
      vraagsturing leverende verbruikseenheid: de beperkingen van de beschikbaarheid van het werkzaam vermogen ten
      behoeve van vraagsturing.

      2 De gegevens als bedoeld in het eerste lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter de verbruiksinstallatie zich bevindt;

      b. de EAN-code van het overdrachtspunt waarachter die verbruiksinstallatie zich bevindt, indien het een aansluiting
      betreft die meer dan één overdrachtspunt heeft, als bedoeld in [artikel 2.4, vierde lid][ref2];

      c. indien de verbruiksinstallatie een verbruikseenheid omvat die deelneemt aan vraagsturing, de EAN-code van deze
      verbruikseenheid.

      3 Van de gegevens bedoeld in het eerste lid, onderdeel a en b, ten aanzien van verbruikers, aangesloten op een
      spanningsniveau van 10 kV en hoger, met een gecontracteerd en beschikbaar gesteld vermogen groter dan of gelijk
      aan 1 MW, wordt jaarlijks, uiterlijk op 1 april, een zo goed mogelijke schatting voor de komende tien jaar ter
      beschikking gesteld, inhoudende:

      a. de ontwikkeling op jaarbasis;

      b. de beschrijving van het belastingpatroon;

      c. de verwachte trendbreuken.

      4 Van de gegevens bedoeld in het eerste lid, onderdelen a en b, en, indien de verbruiksinstallatie een
      verbruikseenheid omvat die deelneemt aan vraagsturing tevens onderdeel c, wordt jaarlijks, uiterlijk op 1 april:

      a. voor verbruiksinstallaties kleiner dan 1 MW, door de BRP’s, op de door de netbeheerder vastgestelde
      verzamelpunten, geaggregeerd, een zo goed mogelijke schatting voor het komende jaar ter beschikking gesteld;

      b. voor verbruiksinstallaties groter dan of gelijk aan 1 MW, desgewenst door zijn BRP, een zo goed mogelijke
      schatting voor het komende jaar ter beschikking gesteld.

      5 Van de gegevens bedoeld in het eerste lid, onderdelen a en b, en, indien de verbruiksinstallatie een
      verbruikseenheid omvat die deelneemt aan vraagsturing tevens onderdeel c, worden wijzigingen ten opzichte van de
      gegevens, overeenkomstig het vierde lid:

      a. voor verbruiksinstallaties kleiner dan 1 MW, door de BRP’s, op de door de netbeheerder vastgestelde
      verzamelpunten, geaggregeerd, maandelijks, uiterlijk op de vijfde dag van de maand, voor de komende maand ter
      beschikking gesteld;

      b. voor verbruiksinstallaties groter dan of gelijk aan 1 MW, desgewenst door zijn BRP, maandelijks, uiterlijk op de
      vijfde dag van de maand, voor de komende maand ter beschikking gesteld.

      6 De gegevens bedoeld in het eerste lid, onderdelen a en b, en, indien de verbruiksinstallatie een verbruikseenheid
      omvat die deelneemt aan vraagsturing tevens onderdeel c, worden dagelijks, uiterlijk om 15:15 uur voor de komende
      dag ter beschikking gesteld en bestaan uit een MW-waarde per kwartier, te weten:

      a. voor verbruiksinstallaties kleiner dan 1 MW, door de BRP’s, op de door de netbeheerder vastgestelde
      verzamelpunten, geaggregeerd;

      b. voor verbruiksinstallaties groter dan of gelijk aan 1 MW, desgewenst door zijn BRP.

      7 Wijzigingen ten opzichte van de overeenkomstig het zesde lid ter beschikking gestelde prognose van de hoeveelheid
      van het net af te nemen werkzaam vermogen, worden direct na het bekend worden van die wijziging aan de netbeheerder
      ter beschikking gesteld, in geval van een verbruiksinstallatie met een maximaal af te nemen werkzaam vermogen:

      a. groter dan 60 MW en kleiner dan 200 MW als de wijziging groter is dan 5% van het maximaal van het net af te
      nemen werkzaam vermogen;

      b. groter dan of gelijk aan 200 MW als de wijziging groter is dan 10 MW.


