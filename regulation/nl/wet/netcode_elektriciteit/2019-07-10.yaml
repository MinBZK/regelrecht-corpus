      De netbeheerder van het landelijk hoogspanningsnet maakt dagelijks uiterlijk 11:00 uur de in
      [artikel 12.4, tweede lid, onderdeel d, derde lid en vierde lid, onderdeel e][ref1], genoemde en volgens
      [artikel 12.5][ref2] gespecificeerde capaciteit danwel capaciteitsdomein voor day-aheadtransporten voor de volgende
      dag, op uurbasis vastgesteld, bekend.


