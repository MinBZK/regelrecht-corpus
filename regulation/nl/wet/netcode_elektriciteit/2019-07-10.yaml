  - number: '9.5'
    text: |-
      1 Indien op een bepaald deelnet in een afgebakend en duidelijk gedefinieerd gebied het geheel van verzoeken om
      transport tot het beloop van het gecontracteerde en beschikbaar gestelde transportvermogen voorzienbaar in enige
      onbalansverrekeningsperiode niet volledig gehonoreerd kan worden, meldt de netbeheerder van het net waarvan dat
      deelnet onderdeel is, door middel van een vooraankondiging dat er sprake kan zijn van structurele congestie.

      2 Indien de in het eerste lid bedoelde situatie zich voordoet op de deelnetten van gekoppelde netten die door
      verschillende netbeheerders worden beheerd, doen de netbeheerders van die netten gezamenlijk de vooraankondiging
      dat er sprake kan zijn van structurele congestie.

      3 De in het eerste lid bedoelde vooraankondiging zal tenminste de volgende gegevens bevatten:

      a. het verwachte congestiegebied (geografische aanduiding) en;

      b. de periode waarin structurele congestie wordt verwacht in dat gebied en;

      c. de oorzaak van de verwachte structurele congestie en;

      d. het in het verwachte congestiegebied totale gecontracteerde en beschikbaar opgestelde transportvermogen en;

      e. een planning van de netverzwaring.

      4 De in het eerste lid bedoelde vooraankondiging wordt gepubliceerd op de website(s) van de netbeheerder(s)
      die de melding heeft, dan wel hebben, gedaan en in alle gevallen tevens op de website van de netbeheerder van
      het landelijk hoogspanningsnet. De betrokken netbeheerder zenden een afschrift van de vooraankondiging aan de
      Autoriteit Consument en Markt.

      5 De betrokken netbeheerder(s) start(en) voor een gebied waarvoor een vooraankondiging is afgegeven, een onderzoek
      naar de mogelijkheden voor de toepassing van congestiemanagement. Congestiemanagement zal worden toegepast indien
      uit het onderzoek blijkt dat:

      a. de betrokken netbeheerder(s) het nettechnisch mogelijk acht(en) en;

      b. de betrokken netbeheerder(s) het bedrijfsvoeringstechnisch mogelijk acht(en) en;

      c. de periode van verwachte structurele congestie langer duurt dan 1 jaar en korter dan 4 jaar en;

      d. in het desbetreffende gebied voldoende potentiële deelnemers aanwezig zijn voor de uitvoering van
      congestiemanagement.

      6 Indien uit het in het vijfde lid genoemde onderzoek blijkt dat congestiemanagement geen oplossing biedt of de in
      het vierde lid gemelde vooraankondiging, om wat voor reden dan ook, is komen te vervallen, doen de desbetreffende
      netbeheerders hiervan binnen één week na afronding van het onderzoek, of het bekend worden van elke andere
      reden, melding via hun website en in alle gevallen tevens op de website van de netbeheerder van het landelijk
      hoogspanningsnet. Deze melding zal tenminste bevatten:

      a. het gebied waarop de melding betrekking heeft;

      b. een verklaring waarom de vooraankondiging is komen te vervallen, waarbij tenminste wordt aangegeven wat het
      actuele totale gecontracteerde en beschikbaar gestelde transportvermogen in het desbetreffende gebied is.

      Voor het desbetreffende gebied zullen dan ook geen aanvullende eisen van toepassing worden verklaard.

      7 Indien van toepassing, geschiedt de vooraankondiging door de in het vierde of zesde lid bedoelde netbeheerder na
      overleg met eventuele andere betrokken netbeheerders.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.5
  - number: '9.6'
    text: |-
      1 Indien op basis van het in [artikel 9.5, vijfde lid][ref1], genoemde onderzoek blijkt dat in het congestiegebied
      waarover een vooraankondiging is afgegeven congestiemanagement een oplossing biedt, zal de netbeheerder binnen één
      week na afronding van het onderzoek, of het bekend worden van elke andere reden, een melding doen aan de hierna in
      onderdeel a bedoelde aangeslotenen in het congestiegebied. De melding bevat in ieder geval de volgende gegevens:

      a. een aanduiding van het congestiegebied door middel van een lijst van EAN-codes van aansluitingen met een
      gecontracteerd en beschikbaar gesteld transportvermogen van 0,1 MW of hoger en een geografische beschrijving van
      het betrokken gebied met het desbetreffende deelnet of de desbetreffende deelnetten in dat gebied en;

      b. de ingangsdatum van de verwachte structurele congestie en;

      c. de verwachte periode waarvoor het congestiegebied is aangewezen en;

      d. een onderbouwing en motivering, op grond waarvan duidelijk blijkt dat er binnen het gestelde gebied sprake is
      van structurele congestie en omvat in ieder geval de onder a. tot en met c. genoemde punten en;

      e. een onderbouwing en motivering van de onmogelijkheid om de fysieke congestie op andere wijze op te lossen dan
      het toepassen van congestiemanagement.

      2 De netbeheerder bepaalt de grens als bedoeld in [artikel 9.1, tweede lid][ref2], op basis van de omvang van het
      congestiegebied en de hoeveelheid vermogen die minimaal aanvullend nodig is om de enkelvoudige storingsreserve
      tijdens de verwachte congestieperiode op een efficiënte wijze te handhaven.

      3 De melding als bedoeld in het eerste lid, alsmede het in het eerste lid bedoelde onderzoek en de uitkomsten
      daarvan, wordt binnen één week na afronding van het in het eerste lid bedoelde onderzoek gepubliceerd op de website
      van de netbeheerder die de melding heeft gedaan of, in het geval bedoeld in [artikel 9.5, tweede lid][ref3], op
      de websites van de netbeheerders die de melding hebben gedaan en in alle gevallen tevens op de website van de
      netbeheerder van het landelijk hoogspanningsnet.

      4 Indien de melding als bedoeld in het eerste lid niet gedaan wordt door de netbeheerder van het landelijk
      hoogspanningsnet, stelt de netbeheerder die de melding heeft gedaan hiervan uiterlijk op de dag waarop publicatie
      volgens het derde lid plaatsvindt de netbeheerder van het landelijk hoogspanningsnet in kennis, onder vermelding
      van in ieder geval de gegevens, genoemd in het eerste lid.

      5 De melding als bedoeld in het eerste lid wordt gestuurd aan alle aangeslotenen in het congestiegebied, met een
      gecontracteerd en beschikbaar gesteld vermogen van 0,1 MW en meer.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.5
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.1
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel9.5
