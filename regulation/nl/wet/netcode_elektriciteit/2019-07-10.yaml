  - number: '13.4'
    text: |-
      1 Een aangeslotene die beschikt over een verbruiksinstallatie aangesloten op een distributienet verstrekt de
      netbeheerder de structurele gegevens van die verbruiksinstallatie, te weten het maximaal af te nemen werkzaam
      vermogen.

      2 In aanvulling op het eerste lid verstrekt een aangeslotene, die beschikt over een verbruiksinstallatie groter dan
      100 kW, de structurele gegevens van die verbruiksinstallatie, te weten:

      a. het maximaal af te nemen of in te voeden blindvermogen;

      b. de karakteristieken van de regeling van blindvermogen indien dit is geïnstalleerd;

      c. indien de aangeslotene beschikt over direct aan het overdrachtspunt gekoppelde transformatoren, de gegevens
      van de transformatoren direct gekoppeld aan het overdrachtspunt van de aansluiting van de verbruiksinstallatie,
      te weten:

      1°. het nominale schijnbare vermogen;

      2°. de nominale spanning aan de primaire zijde;

      3°. de nominale spanning aan de secundaire zijde;

      4°. de nominale kortsluitspanning;

      5°. de nominale koper- of kortsluitverliezen;

      6°. de nominale ijzer- of nullastverliezen;

      7°. de schakelgroep van de wikkelingen;

      8°. de sterpuntsbehandeling, te weten zwevend, hard geaard, geaard via impedantie;

      9°. indien van toepassing de gegevens aangaande de regelschakelaar, te weten de hoogste trap, de laagste trap, de
      stapgrootte, de regelbaarheid, namelijk continu regelbaar (online) of spanningsloos instelbaar (offline);

      d. de kortsluitbijdrage;

      e. de geschiktheid van toegang op afstand tot de vermogensschakelaar.

      3 Indien de verbruiksinstallatie als bedoeld in het eerste lid, een of meer verbruikseenheden omvat die worden
      gebruikt voor het leveren van vraagsturing, verstrekt de aangeslotene, in aanvulling op het eerste lid, per
      vraagsturing leverende verbruikseenheid onder vermelding van de EAN-code van de verbruikseenheid, de structurele
      gegevens, te weten:

      a. het minimale en maximale werkzame vermogen dat beschikbaar is voor vraagsturing, de bijbehorende tijdsduur en de
      snelheid waarmee dat vermogen inzetbaar is;

      b. het minimale en maximale blindvermogen dat beschikbaar is voor vraagsturing, de bijbehorende tijdsduur en de
      snelheid waarmee dat blindvermogen inzetbaar is.

      4 Indien sprake is van vraagsturing door middel van een derde partij als bedoeld in artikel 27 tot en met 29 van
      de verordening (EU) 2016/1388 (NC DCC), draagt de aangeslotene er zorg voor dat de derde partij de structurele
      gegevens kan verstrekken aan de netbeheerder, te weten:

      a. de karakteristieken van de regeling van blindvermogen indien dit is geïnstalleerd;

      b. het structurele minimale en maximale werkzame vermogen dat beschikbaar is voor vraagsturing en de minimale en
      maximale duur van iedere eventuele vraagsturing binnen een door de regionale netbeheerder en netbeheerder van het
      landelijk hoogspanningsnet gespecificeerde geografische zone.

      5 De structurele gegevens als bedoeld in het eerste tot en met vierde lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter de verbruiksinstallatie zich bevindt;

      b. de EAN-code van het desbetreffende overdrachtspunt indien het een aansluiting betreft die meer dan één
      overdrachtspunt heeft, als bedoeld in [artikel 2.4, vierde lid][ref2].

      6 De structurele gegevens als bedoeld in het derde en vierde lid worden verstrekt onder vermelding van:

      a. de EAN-code van de verbruikseenheid indien die deelneemt aan vraagsturing.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
