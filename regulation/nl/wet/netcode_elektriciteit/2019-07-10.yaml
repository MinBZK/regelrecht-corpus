  - number: '12.17'
    text: |-
      1 Ten behoeve van de uitvoering van [artikel 12.5, vierde lid][ref1], stelt de netbeheerder van het landelijk
      hoogspanningsnet de veilig beschikbare landsgrensoverschrijdende transportcapaciteit voor de intradaytransporten
      ter beschikking aan de beurzen die aan het XBID-project deelnemen in de Nederlandse biedzone conform de regeling
      betreffende meer dan één NEMO in een biedzone.

      2 De netbeheerder van het landelijk hoogspanningsnet publiceert de veilig beschikbare landsgrensoverschrijdende
      transportcapaciteit voor de intradaytransporten uiterlijk om 21:00 uur voor de komende 24 uren.

      3 Marktpartijen kunnen deelnemen in landsgrensoverschrijdende handel tussen Nederland en Duitsland, en Nederland
      en België tot het tijdstip dat is bepaald in het besluit No 04/2018 van het Agentschap van 24 april 2018 ‘on all
      transmission system operators’ proposal for intraday cross-zonal gate opening and intraday cross zonal gate closure
      times’.

      4 Marktpartijen kunnen tot uiterlijk 1 uur voor uitvoering van transport deelnemen in landsgrensoverschrijdende
      handel tussen Nederland en Noorwegen en Nederland en Denemarken.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel12.5
