  - number: '14.3'
    text: |-
      1 Onverminderd het bepaalde in artikel 14, eerste lid, voldoen elektriciteitsproductie-eenheden die overeenkomstig
      de criteria van artikel 5 van Verordening (EU) 2016/631 als type A zouden worden geclassificeerd maar
      waarop overeenkomstig artikel 4, eerste lid, van de Verordening (EU) 2016/631 (NC RfG), de Verordening (EU)
      2016/631 (NC RfG) niet van toepassing is, en die zijn aangesloten op een middenspanningsnet, in aanvulling op
      [paragraaf 3.4][ref1], aan het tweede tot en met zevende lid.

      2 Van de plicht tot het aanbieden van reservevermogen en blindvermogen zijn uitgezonderd elektriciteitsproductie-
      eenheden die uitsluitend afhankelijk zijn van één of meer niet-regelbare energiebronnen.

      3 Alle elektriciteitsproductie-eenheden aangesloten op middenspanningsnetten kunnen bedrijf voeren met een
      arbeidsfactor tussen 1,0 en 0,85 (inductief) gemeten op de generatorklemmen.

      4 Over de grenswaarden van de arbeidsfactor zoals genoemd in het derde lid vindt tijdig overleg plaats met de
      netbeheerder, zodat in overleg besloten kan worden tot afwijkende waarden, zodat ook capacitief draaien mogelijk
      is.

      5 De aandrijvende machine van de elektriciteitsproductie-eenheid vertoont een rustig gedrag.

      6 Indien de elektriciteitsproductie-eenheid niet direct is aangesloten op het net van de netbeheerder, is de
      bij het ontwerp aan de generator of de machinetransformator toe te kennen spanning afgestemd op de te verwachten
      gemiddelde bedrijfsspanning op het netaansluitpunt en het gemiddelde spanningsverlies tussen de generator en het
      netaansluitpunt. De spanningsafwijking ter plaatse van de generator is een afgeleide van de spanningsafwijking op
      het netaansluitpunt.

      7 Indien door de netbeheerder wordt verwacht dat de gemiddelde bedrijfsspanning in de toekomst beduidend zal
      wijzigen wordt hiermede bij het ontwerp van de installatie rekening gehouden.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk3
