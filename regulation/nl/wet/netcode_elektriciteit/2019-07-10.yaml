  - number: '11.4'
    text: |-
      1 Indien de netbeheerder van het landelijk hoogspanningsnet geïnformeerd wordt dat of voorziet dat een
      leverancier niet langer in staat zal zijn, zijn leveringsplicht na te komen of voor de leverancier de toepassing
      van de wettelijke schuldsaneringsregeling is uitgesproken, surséance van betaling is verleend respectievelijk
      faillissement is uitgesproken, pleegt de netbeheerder van het landelijk hoogspanningsnet overleg met de Autoriteit
      Consument en Markt. In dit overleg wordt onder andere bepaald of en zo ja onder welke voorwaarden invulling aan
      het [Besluit leveringszekerheid Elektriciteitswet 1998][ref1] wordt gegeven. De netbeheerder van het landelijk
      hoogspanningsnet kan respectievelijk moet (de curator of de bewindvoerder van) de vergunninghouder of de BRP
      voor betreffende aansluitingen van de leverancier aanbieden de tijdelijke voortzetting van de levering van
      ten hoogste tien werkdagen te ondersteunen, wanneer dit redelijkerwijs noodzakelijk is voor het borgen van de
      economische stabiliteit van het systeem. De netbeheerder van het landelijk hoogspanningsnet doet dit door garant
      te staan voor de kosten van inkoop van de elektriciteit, balancering en andere bijkomende kosten tegen de door
      de netbeheerder van het landelijk hoogspanningsnet te stellen voorwaarden voor de garantstelling tijdens deze
      tijdelijke voortzetting. Afhankelijk van het resultaat van dit overleg pleegt de netbeheerder van het landelijk
      hoogspanningsnet overleg met (de curator of de bewindvoerder van) de vergunninghouder of de BRP voor betreffende
      aansluitingen van de leverancier, en kan hij een aanbod tot het afgeven van een garantie in laatstbedoelde zin
      doen.

      2 Voor de levering van grootverbruikers van de leverancier, treedt de BRP die de balanceringsverantwoordelijkheid
      voor die aangeslotenen draagt, in de plaats van de leverancier tot het moment waarop de grootverbruiker een nieuwe
      leveringsovereenkomst heeft gesloten dan wel de levering aan die grootverbruiker is beëindigd. De betreffende BRP
      wordt onverwijld van deze situatie door de netbeheerder van het landelijk hoogspanningsnet op de hoogte gesteld. De
      betrokken aangeslotenen worden zo spoedig mogelijk, maar uiterlijk binnen drie werkdagen na de in de plaatstreding
      schriftelijk door de betreffende BRP van de ontstane situatie en de thans geldende voorwaarden (daaronder begrepen
      de opzeggingsmogelijkheden) op de hoogte gesteld.

      3 Een vergunninghouder meldt, voor het geval hem, op grond van
      [artikel 2, zesde lid, van het Besluit leveringszekerheid Elektriciteitswet 1998][ref2], de levering aan
      kleinverbruikers wordt toegewezen, aan de netbeheerder van het landelijk hoogspanningsnet welke BRP voor de
      desbetreffende kleinverbruikers balanceringsverantwoordelijk dient te worden. De verwerkingstermijn van een
      dergelijk verzoek bedraagt maximaal twee weken.

      4 In de in het tweede lid bedoelde situatie wordt de aangeslotene geacht een leveringscontract te hebben met de BRP
      die in de plaats van de leverancier treedt. De grootverbruiker heeft twee maanden het recht het leveringscontract
      zonder opzegtermijn te beëindigen. Tevens kan de BRP, voor zover niet reeds overeengekomen, redelijke afspraken
      maken ten aanzien van balanceringsverantwoordelijkheid voor de aansluiting.

      5 De in het tweede lid bedoelde BRP die in de plaats van de leverancier treedt, mag aan de aangeslotene, niet
      zijnde een kleinverbruiker, een tarief voor de geleverde energie in rekening brengen dat overeenkomt met de day-
      ahead-clearingprijs, tenzij de aangeslotene met deze BRP anders is overeengekomen.

      6 Indien en voor zover op grond van dit artikel (daaronder begrepen op grond van verkoop of doorstart
      van de onderneming van de aanvankelijke leverancier) de leverancier van groepen aangeslotenen wijzigt,
      zorgt de netbeheerder die het aangaat ervoor dat de wisseling van leverancier binnen één werkdag in het
      aansluitingenregister is verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0019567
      [ref2]: https://wetten.overheid.nl/BWBR0019567#Artikel2
