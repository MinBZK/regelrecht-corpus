  - number: '12.21'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet bepaalt de in [artikel 12.2, eerste lid][ref1]. genoemde
      capaciteit voor noodzakelijk transport van elektriciteit in het kader van onderlinge hulp en bijstand ten
      behoeve van de instandhouding van de integriteit van de netten (voorts in deze paragraaf aangeduid als: ‘de
      transportcapaciteit voor onderlinge hulp en bijstand’) op basis van de onderstaande methode.

      2 De transportcapaciteit voor onderlinge hulp en bijstand wordt op uurbasis vastgesteld.

      3 De transportcapaciteit voor onderlinge hulp en bijstand wordt separaat voor importen en exporten vastgesteld.

      4 De transportcapaciteit voor onderlinge hulp en bijstand wordt bepaald door middel van netberekeningen met
      inachtneming van het in [12.20][ref2] gestelde op basis van een volledig beschikbaar net, waaronder verstaan
      wordt het samenstel van de Nederlandse netten op een spanningsniveau van 220 kV of hoger, inclusief de
      landsgrensoverschrijdende verbindingen.

      5 Voor elk van de in [artikel 12.18][ref3] of [12.19][ref4] genoemde scenario’s wordt overeenkomstig het in
      artikel 12.18 of 12.19 en [12.20][ref5] gestelde de transportcapaciteit bepaald met uitval van een willekeurige
      elektriciteitsproductie-eenheid of belasting van een enkele aangeslotene, niet zijnde netbeheerder, voor zover
      van belang voor de bepaling van de transportcapaciteit en zonder uitval van overige elementen in het net en onder
      handhaving van de normale toestand.

      6 Indien de laagste waarde van de overeenkomstig het vijfde lid berekende transportcapaciteit voor de
      verschillende scenario’s, afzonderlijk berekend voor import en export, lager is dan de op basis van
      [artikel 12.18, negende lid respectievelijk tiende lid][ref6] of [artikel 12.19, elfde lid][ref7], bepaalde
      waarde voor de veilig beschikbare landsgrensoverschrijdende transportcapaciteit of capaciteitsdomein, bedraagt
      de transportcapaciteit voor onderlinge hulp en bijstand het verschil tussen de op basis van artikel 12.18,
      negende lid respectievelijk tiende lid of artikel 12.19, elfde lid bepaalde waarde voor de veilig beschikbare
      landsgrensoverschrijdende transportcapaciteit of capaciteitsdomein en de hiervoor genoemde laagste waarde van de
      overeenkomstig het vijfde lid berekende transportcapaciteit. In de overige gevallen bedraagt de transportcapaciteit
      voor onderlinge hulp en bijstand 0 MW.


