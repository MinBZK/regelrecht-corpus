      1 Elektriciteitsproductie-eenheden van het type A voldoen aan de in deze paragraaf gestelde voorwaarden.

      2 Elektriciteitsproductie-eenheden van het type A, kleiner dan 11 kW, aangesloten op een laagspanningsnet, voldoen
      tevens aan de in [paragraaf 3.3][ref1] gestelde voorwaarden, met uitzondering van [artikel 3.5][ref2].

      3 Elektriciteitsproductie-eenheden van het type A groter dan of gelijk aan 11 kW, aangesloten op een
      laagspanningsnet, voldoen tevens aan de in [paragraaf 3.3][ref3] gestelde voorwaarden, met uitzondering van de
      [artikelen 3.5][ref4], [3.7][ref5] en [3.11, tweede lid][ref6].


