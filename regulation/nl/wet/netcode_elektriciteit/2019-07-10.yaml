  - number: '9.3'
    text: |-
      In geval van een onverwachte onderbreking van de transportdienst die haar oorzaak vindt in de
      hoogspanningsinstallatie van de netbeheerder, kan de netbeheerder de transportdienst hervatten zonder de
      aangeslotene voorafgaand te waarschuwen.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.3
  - number: '9.4'
    text: |-
      1 Congestiemanagement, zoals beschreven in deze paragraaf, wordt uitsluitend toegepast ter voorkoming
      van een op [artikel 24, tweede lid, van de Elektriciteitswet 1998][ref1] gebaseerde weigering
      van de netbeheerder om aan een of meer aangeslotene(n) transportcapaciteit beschikbaar te stellen
      in netten van 110 kV of hoger en in netten lager dan 110 kV indien dit, met inachtneming van
      [artikel 16, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref2], mogelijk is.

      2 Toepassing van congestiemanagement, zoals beschreven in deze paragraaf, in netten lager dan 110 kV is mogelijk
      indien en voor zover:

      a. de verwachte fysieke congestie in deze netten geen relatie heeft met het overschrijden van het toegestane
      kortsluitvermogen in deze netten en;

      b. de netten voor invoering van genoemde maatregelen technisch uitgerust zijn of kunnen worden, waaronder wordt
      verstaan de continu beschikbare mogelijkheid om de relevante netdelen en -componenten op afstand te bewaken en te
      bedienen en;

      c. de benodigde systemen om de genoemde maatregelen effectief te kunnen uitvoeren beschikbaar zijn of dit zijn
      binnen maximaal 25% van de doorlooptijd van de uit te voeren netverzwaring, -wijziging of -uitbreiding zoals
      genoemd in het derde lid.

      3 Toepassing van congestiemanagement in een gebied dient uitsluitend ter overbrugging van de periode die resteert
      tot het moment waarop het (de) net(ten) zodanig verzwaard, gewijzigd of uitgebreid is (zijn) dat het gevraagde
      transport volledig beschikbaar gesteld kan worden.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
