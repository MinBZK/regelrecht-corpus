  - number: '3.20'
    text: |-
      1 Indien de elektriciteitsproductie-eenheid met een maximumcapaciteit groter dan 5 MW, aangesloten op een midden-
      of hoogspanningsnet, door een kortsluiting in het net van het net gescheiden wordt en de netspanning binnen 60
      minuten wederkeert, is de elektriciteitsproductie eenheid binnen 30 minuten nadat de netspanning is teruggekeerd,
      in staat stabiel bedrijf te voeren parallel aan het net met alle generatoren in bedrijf.

      2 Indien de in het eerste lid genoemde periode van 30 minuten technisch niet mogelijk is, dient desbetreffende
      producent dit aan de netbeheerder van het landelijk hoogspanningsnet toe te lichten. Tevens dient vermeld te worden
      aan de netbeheerder van het landelijk hoogspanningsnet binnen welke tijd het in het eerste lid genoemde stabiel
      bedrijf in dat geval mogelijk is.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel3.20
  - number: '3.21'
    text: |-
      1 Indien het feitelijke gedrag van de elektriciteitsproductie-eenheid met een maximumcapaciteit groter dan 5 MW
      tijdens een storingssituatie daartoe aanleiding geeft, kan de netbeheerder van het landelijk hoogspanningsnet
      aan de betrokken aangeslotene verzoeken aan te tonen dat de elektriciteitsproductie-eenheid voldoet aan de in
      [artikel 3.20][ref1] neergelegde technische eisen.

      2 Indien een verzoek als bedoeld in het eerste lid is gedaan, wordt binnen twee maanden daarna aangetoond dat de
      elektriciteitsproductie-eenheid voldoet aan de in [artikel 3.20][ref2] neergelegde technische eisen.

      3 Op verzoek van de aangeslotene kan de netbeheerder van het landelijk hoogspanningsnet een langere termijn
      vaststellen dan de in het tweede lid genoemde termijn en kan hij de in het tweede lid genoemde termijn of de met
      toepassing van dit artikel vastgestelde langere termijn verlengen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.20
