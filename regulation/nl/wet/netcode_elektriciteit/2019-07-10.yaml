  - number: '7.5'
    text: |-
      1 De netbeheerder evalueert na afloop van elk kwartaal per aansluiting het aantal opgetreden spanningsdips over de
      voorafgaande periode van vier aaneengesloten kwartalen en de oorzaken van deze spanningsdips.

      2 Indien het aantal opgetreden hinderlijke spanningsdips per categorie op een aansluiting per aaneengesloten
      periode van vier kwartalen hoger is dan het in [artikel 7.3, zesde lid][ref1], vermelde aantal voor de
      desbetreffende categorie, zal de netbeheerder een onafhankelijke deskundige partij opdracht geven onderzoek te
      laten doen naar de fysieke oorzaak van deze spanningsdips.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel7.3
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel7.5
