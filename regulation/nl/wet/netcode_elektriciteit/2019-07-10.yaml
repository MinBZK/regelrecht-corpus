  - number: '10.38'
    text: |-
      1 De overeenkomstig [artikel 9.19 onderdeel a][ref1], aangewezen BSP's, en BSP's met een biedplicht op grond van
      een overeenkomst voor balanceringscapaciteit, sturen dagelijks, vóór 14:45 uur, biedingen balanceringsenergie in.

      2 Alle BSP's kunnen op vrijwillige basis biedingen balanceringsenergie indienen tot een half uur voorafgaand aan de
      onbalansverrekeningsperiode waarop de aanpassing betrekking heeft, zijnde de BE-GCT. De BSP kan zowel de omvang als
      de prijs van een ingediende bieding aanpassen, als ook een bieding intrekken, tot de BE-GCT, tenzij de netbeheerder
      van het landelijk hoogspanningsnet de bieding al geactiveerd heeft.

      3 De in het eerste lid bedoelde BSP's kunnen zowel de omvang als de prijs van een bieding aanpassen vanaf
      het moment dat de netbeheerder van het landelijk hoogspanningsnet zijn goedkeuring heeft verleend aan alle
      energieprogramma's voor de volgende dag tot de BE-GCT, tenzij de netbeheerder van het landelijk hoogspanningsnet de
      bieding al geactiveerd heeft.

      4 Alle BSP's dienen biedingen balanceringsenergie in conform door de netbeheerder van het landelijk
      hoogspanningsnet vast te stellen procedures en specificaties.

      5 De netbeheerder van het landelijk hoogspanningsnet stelt de BSP op de hoogte van ontvangst van de bieding.

      6 De netbeheerder van het landelijk hoogspanningsnet informeert een BRP over de opname van een aansluiting,
      waarover hij balanceringsverantwoordelijkheid uitoefent, in een portfolio waarmee een BSP een bieding
      balanceringsenergie kan indienen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.19
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel10.38
