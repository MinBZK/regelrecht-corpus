  - number: '10.20'
    text: |-
      1 De netbeheerder voert de in [artikel 10.17, zevende en achtste lid][ref1], beschreven acties uit op de op grond
      van [artikel 6.2.2.4 van de Informatiecode elektriciteit en gas][ref2] van de meetverantwoordelijken ontvangen
      definitieve meetgegevens.

      2 De netbeheerder stuurt de op grond van het eerste lid jo. [artikel 10.17, zevende lid][ref3], opnieuw verzamelde
      meetgegevens inzake al zijn aansluitingen aan de netbeheerder van het landelijk hoogspanningsnet voor 12:00 uur van
      de tiende werkdag na afloop van het desbetreffende etmaal.

      3 De netbeheerder stuurt de op grond van het eerste lid jo. [artikel 10.17, achtste lid][ref4], opnieuw verzamelde
      meetgegevens aan de desbetreffende BRP's voor 12:00 uur van de tiende werkdag na afloop van het desbetreffende
      etmaal.

      4 Indien de netbeheerder tussen 12:00 en 16:00 uur van de tiende werkdag na de dag van collectie van de
      meetgegevens van de BRP een verzoek zoals bedoeld in [artikel 10.26, vijfde lid][ref5], heeft ontvangen, zal
      de netbeheerder zo mogelijk en nodig de op grond van [artikel 10.17, zevende en achtste lid][ref6], verzamelde
      meetgegevens aanpassen. Vervolgens worden deze meetgegevens als definitieve meetgegevens diezelfde dag voor 24:00
      uur verzonden aan de netbeheerder van het landelijk hoogspanningsnet en aan de desbetreffende BRP.


