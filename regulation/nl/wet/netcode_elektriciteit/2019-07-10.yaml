  - number: '15.3'
    text: |-
      Aansluitingen, aangelegd voor 1 juli 2017 die niet beschikken over een meetinrichting, als bedoeld in
      [artikel 2.12][ref1], en waarvoor niet wordt voldaan aan de [artikelen 2.13][ref2] en [2.14][ref3], mogen
      onbemeten blijven tot op het moment dat er wijzigingen worden aangebracht aan de aansluiting, aan de
      achter het overdrachtspunt van de aansluiting aanwezige installatie of apparatuur of dat er op grond van
      [artikel 2.30, vierde lid][ref4], een comptabele meetinrichting geplaatst dient te worden.


