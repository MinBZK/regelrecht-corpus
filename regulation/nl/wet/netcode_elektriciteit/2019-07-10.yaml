  - number: '14.2'
    text: |-
      1 Onverminderd het bepaalde in artikel 14, eerste lid, voldoen elektriciteitsproductie-eenheden die overeenkomstig
      de criteria van artikel 5 van Verordening (EU) 2016/631 als type A zouden worden geclassificeerd maar
      waarop overeenkomstig artikel 4, eerste lid, van de Verordening (EU) 2016/631 (NC RfG), de Verordening (EU)
      2016/631 (NC RfG) niet van toepassing is, en die zijn aangesloten op een laagspanningsnet, in aanvulling op
      [paragraaf 3.4][ref1], aan het tweede lid.

      2 Het parallel schakelen van de elektriciteitsproductie-eenheid dient automatisch te verlopen.


