  - number: '3.7'
    text: |-
      1 In afwijking van [artikel 2.16, tweede lid][ref1], is het niet nodig de netbeheerder vooraf tijdig op de hoogte
      te brengen van het voornemen tot invoeding, indien sprake is van een elektriciteitsproductie-eenheid gebruik makend
      van warmtekrachtkoppeling die rechtstreeks of als onderdeel van een elektrische installatie wordt aangesloten op
      een laagspanningsnet. In dat geval informeert de aangeslotene de netbeheerder binnen een maand na de inbedrijfname
      van de elektriciteitsproductie-eenheid.

      2 De in het eerste lid bedoelde afwijking is niet van toepassing indien sprake is van het op projectmatige basis
      gepland installeren van meerdere elektriciteitsproductie-eenheden gebruik makend van warmtekrachtkoppeling binnen
      een deelnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.16
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel3.7
    references:
