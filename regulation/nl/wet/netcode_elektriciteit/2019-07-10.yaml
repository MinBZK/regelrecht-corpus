  - number: '10.2'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet kan aan een natuurlijk persoon, rechtspersoon of vennootschap,
      niet zijnde een netbeheerder, op aanvraag een erkenning als BRP verlenen. Een natuurlijk persoon, rechtspersoon dan
      wel vennootschap kan slechts voor één erkenning als BRP in aanmerking komen.

      2 De BRP heeft het recht:

      a. balanceringsverantwoordelijkheid voor de eigen aansluitingen uit te oefenen, tenzij hij kleinverbruiker is;

      b. de uitoefening van balanceringsverantwoordelijkheid voor de aansluitingen van derden aan te bieden als dienst;

      c. energieprogramma’s in te dienen;

      d. transactiepartij te zijn in energieprogramma’s.

      3 De in het tweede lid genoemde rechten zijn niet overdraagbaar.

      4 De BRP mag de in het tweede lid genoemde rechten uitoefenen met ingang van de dag die volgt op de dag waarop hij
      als zodanig in het BRP-register, bedoeld in [artikel 10.3, eerste lid][ref1], is ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.3
