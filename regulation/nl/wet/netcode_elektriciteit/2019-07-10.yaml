  - number: '2.6'
    text: |-
      Indien een aansluiting waaraan een primair allocatiepunt is toegekend, bestaat uit één verbinding of uit meerdere
      elektrisch parallelle verbindingen, kent de netbeheerder op verzoek van de aangeslotene een of meer secundaire
      allocatiepunten aan de aansluiting toe ten behoeve van het faciliteren van meerdere overeenkomsten met leveranciers
      en BRP’s op die aansluiting onder voorwaarde dat:

      a. elk allocatiepunt bij een afzonderlijke installatie behoort, die niet elektrisch gekoppeld is of kan worden met
      een andere installatie anders dan via de netzijde van de aansluiting;

      b. de afzonderlijke installaties als bedoeld in onderdeel a, zich op dezelfde onroerende zaak bevinden, met
      uitzondering van aansluitingen als bedoeld in [artikel 1, vijfde lid, van de Elektriciteitswet 1998][ref1];

      c. de installatie die bij een secundair allocatiepunt hoort, niet wordt gebruikt ten behoeve van bewoning van een
      ruimte.

      d. op de grens tussen elke afzonderlijke installatie, als bedoeld in onderdeel a, en de aansluiting waarachter deze
      zich bevindt, zich een meetinrichting bevindt overeenkomstig [artikel 2.12][ref2] en overeenkomstig de voorwaarden
      voor meetinrichtingen die op grond van de [Meetcode elektriciteit][ref3] van toepassing zijn op de desbetreffende
      aansluiting;

      e. de locatie van de meetinrichtingen, als bedoeld in onderdeel d, aan de voorwaarden in [artikel 2.11][ref4]
      voldoet;

      f. de meetinrichtingen, als bedoeld in onderdeel d, zich bevinden in elkaars onmiddellijke nabijheid in dezelfde
      meterkast of meterruimte en zich zo dicht mogelijk bij het overdrachtspunt van de aansluiting bevinden;

      g. tussen de locatie van het overdrachtspunt van de aansluiting en de locatie van de meetinrichtingen als bedoeld
      in onderdeel d, geen energie-uitwisseling plaatsvindt met een andere installatie;

      h. indien het een grootverbruikaansluiting betreft, voldaan wordt aan
      [artikel 1.2.3.2 van de Meetcode elektriciteit][ref5];

      i. er sprake is van één aansluit- en transportovereenkomst tussen de aangeslotene en de netbeheerder voor de
      desbetreffende aansluiting, ongeacht het aantal aan die aansluiting toegekende allocatiepunten en ongeacht het
      aantal leveringsovereenkomsten met verschillende leveranciers.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.12
      [ref3]: https://wetten.overheid.nl/BWBR0037946
