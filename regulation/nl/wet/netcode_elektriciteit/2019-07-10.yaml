  - number: '9.26'
    text: |-
      1 In geval van frequentiedalingen tot 49,0 Hz en lagere waarden, doen de regionale netbeheerders door middel van
      het frequentierelais automatisch een deel van de belasting afschakelen volgens het volgende schema:

      a. eerste afschakeling: bij 49,0 Hz 15% van de oorspronkelijke totale belasting afschakelen;

      b. tweede afschakeling: bij 48,7 Hz, aanvullend op de in onderdeel a bedoelde hoeveelheid, 15% van de
      oorspronkelijke totale belasting afschakelen;

      c. derde afschakeling: bij 48,4 Hz, aanvullend op de in onderdeel a en b bedoelde hoeveelheid, 20% van de
      oorspronkelijke totale belasting afschakelen.

      2 Bij de bepaling van de af te schakelen belasting wordt rekening gehouden met eventueel mee af te schakelen
      elektriciteitsproductie-eenheden.

      3 Het frequentierelais is zodanig ingesteld, dat:

      a. binnen 100 ms na het overschrijden van de in het eerste lid genoemde frequentiegrenzen een uitschakelbevel
      volgt;

      b. de werking van het relais wordt geblokkeerd als de meetspanning daalt tot beneden 70% van de nominale spanning.

      4 De meetonnauwkeurigheid van het relais mag maximaal 10 mHz bedragen.

      5 De storingsgevoeligheid van het relais is afgestemd op de installatie waarin het wordt toegepast, maar voldoet
      ten minste aan IEC 1000-4 klasse 3.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.26
  - number: '9.27'
    text: |-
      1 Wederinschakeling van,

      a. door middel van frequentierelais afgeschakelde belasting,

      b. handmatig afgeschakelde belasting, voor zover de afschakeling valt onder de coördinatie van de netbeheerder
      van het landelijk hoogspanningsnet, vindt uitsluitend plaats met toestemming van de netbeheerder van het landelijk
      hoogspanningsnet.

      2 De netbeheerder van het landelijk hoogspanningsnet verwerft black-startmogelijkheden in een door hem te bepalen
      omvang. Hij bepaalt welke eisen daaraan worden gesteld en waar zij bij voorkeur gelokaliseerd zijn.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.27
  - number: '9.28'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet bevordert dat een enkelvoudige storing in het
      elektriciteitsvoorzieningssysteem zich niet uitbreidt tot een grootschalige storing, dan wel leidt tot de black-
      outtoestand.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.28
  - number: '10.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      a. *opregelen:* het leveren van elektrische energie aan de netbeheerder van het landelijk hoogspanningsnet uit het
      door die netbeheerder ten behoeve van de systeembalans ingezette regelvermogen, reservevermogen en noodvermogen;

      b. *afregelen:* het leveren van elektrische energie door de netbeheerder van het landelijk hoogspanningsnet aan de
      beheerders van het door die netbeheerder ten behoeve van de systeembalans ingezette regelvermogen, reservevermogen
      en noodvermogen;

      c. *prijs voor opregelen:* de prijs per kWh, bepaald per onbalansverrekeningsperiode, overeenkomend met de hoogste
      biedprijs als bedoeld in [artikel 10.38][ref1] van het ingezette regel- en reservevermogen voor opregelen of,
      indien deze hoger is, de prijs voor ingezet noodvermogen voor opregelen tijdens een toestand van inzet noodvermogen
      opregelen;

      d. *prijs voor afregelen:* de prijs per kWh, bepaald per onbalansverrekeningsperiode, overeenkomend met de laagste
      biedprijs als bedoeld in [artikel 10.38][ref2] van het ingezette regel- en reservevermogen voor afregelen of,
      indien deze lager is, de prijs voor ingezet noodvermogen voor afregelen tijdens een toestand van inzet noodvermogen
      afregelen. Deze prijs kan negatief zijn;

      e. *prikkelcomponent:* een bedrag per kWh als omschreven in [artikel 10.31][ref3];

      f. *regeltoestand:* een parameter waarmee de gevraagde regelactie aan leveranciers van regelvermogen en het verloop
      daarvan gedurende een onbalansverrekeningsperiode wordt geïdentificeerd. Deze parameter wordt door de netbeheerder
      van het landelijk hoogspanningsnet vastgesteld volgens [artikel 10.29][ref4];

      g. *balans-delta:* de door de netbeheerder van het landelijk hoogspanningsnet te publiceren som van de door de
      frequentieregeling gevraagde reactie aan leveranciers van regelvermogen;

      h. *middenprijs:* het gemiddelde van de prijs per kWh, bepaald per onbalansverrekeningsperiode, van de laagste
      bieding voor opregelen aan de netbeheerder van het landelijk hoogspanningsnet en de prijs per kWh, bepaald
      per onbalansverrekeningsperiode, van de hoogste bieding voor afregelen aan de netbeheerder van het landelijk
      hoogspanningsnet;

      i. *prijs voor ingezet noodvermogen:* de prijs die tot stand komt door middel van twee berekeningsmethodes, één
      voor opregelen en één voor afregelen. Deze prijs wordt door de netbeheerder van het landelijk hoogspanningsnet
      bepaald volgens [artikel 10.39][ref5] achtste en negende lid.

      2 Het in Verordening (EU) 2017/2195 (GL EB) en in dit hoofdstuk gebruikte begrip
      balanceringsverantwoordelijkheid omvat dezelfde verantwoordelijkheid als bedoeld met het in
      [artikel 1, eerste lid, onderdeel o, van de Elektriciteitswet 1998][ref6] gedefinieerde begrip
      programmaverantwoordelijkheid.

      3 De voorwaarden uit dit hoofdstuk zijn van toepassing, ongeacht de systeemtoestand van het
      elektriciteitsvoorzieningssysteem.


