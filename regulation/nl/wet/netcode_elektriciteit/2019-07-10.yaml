  - number: '9.7'
    text: |-
      1 Na publicatie van de melding, bedoeld in [artikel 9.6, eerste lid][ref1], verzoekt de netbeheerder alle
      aangeslotenen vanaf een door de netbeheerder te bepalen ondergrens, op basis van het opgesteld vermogen in
      het desbetreffende gebied ten opzichte van de maximaal mogelijke overschrijding van de transportcapaciteit per
      dag, zich vrijwillig voor de minimale periode van één maand te willen verplichten tot het doen van biedingen
      overeenkomstig [artikel 9.11, tweede lid][ref2], overeenkomstig de specificaties die de netbeheerder dienaangaande
      heeft opgesteld en bekendgemaakt.

      2 Indien de netbeheerder op enig moment op grond van het eerste lid minder vermogen dan de maximaal mogelijke
      overschrijding ter beschikking heeft om de van toepassing zijnde operationeleveiligheidsgrenzen tijdens de
      verwachte congestieperiode te handhaven, dan kan de netbeheerder alle aangeslotenen met een gecontracteerd en
      beschikbaar gesteld vermogen vanaf een nader te bepalen, en per congestiegebied vast te stellen grens, minimaal één
      maand van te voren verplichten om een bijdrage te leveren aan het oplossen van de verwachte fysieke congestie door
      middel van biedingen overeenkomstig [artikel 9.11, tweede lid][ref3].

      3 Indien de netbeheerder vermoedt dat de biedingen als bedoeld in het eerste en tweede lid niet resulteren in een
      vanuit een oogpunt van doelmatig netbeheer kosteneffectieve prijs voor het opregelen en het afregelen stelt de
      netbeheerder, in samenspraak met de netbeheerder van het landelijk hoogspanningsnet, de in het eerste en tweede lid
      genoemde (onder)grens zo nodig op- of neerwaarts bij.

      4 Indien de netbeheerder van het landelijk hoogspanningsnet vermoedt dat één of meer bij het biedproces betrokken
      aangeslotenen uitzonderlijk afwijkende biedingen doen waardoor het biedproces als bedoeld in het eerste en tweede
      lid mogelijk ondoelmatig verloopt, meldt de netbeheerder van het landelijk hoogspanningsnet dit vermoeden aan de
      Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.6
