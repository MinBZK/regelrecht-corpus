  - number: '5.1'
    text: |-
      In aanvulling op de voorwaarden in de [paragrafen 2.1][ref1], [2.3][ref2] en [2.5][ref3] gelden voor een
      aansluiting van een distributienet op een ander net de voorwaarden van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
