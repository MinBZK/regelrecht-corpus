  - number: '2.36'
    text: |-
      1 De aangeslotene:

      a. stelt een locatie ter beschikking aan de netbeheerder ten behoeve van de plaatsing van een compactstation, of

      b. stelt een ruimte ter beschikking aan de netbeheerder ten behoeve van door de netbeheerder op te stellen
      apparatuur.

      2 Indien de aangeslotene overeenkomstig het eerste lid, onderdeel b, een ruimte ter beschikking stelt:

      a. wordt de plaats ervan na overleg met de aangeslotene door de netbeheerder vastgesteld;

      b. voldoet de ruimte qua afmeting, constructie en inrichting aan de door de netbeheerder gestelde eisen;

      c. is de ruimte vanaf de openbare weg toegankelijk; en

      d. is de ruimte afgesloten door een of meerdere deuren en een door de netbeheerder ter beschikking gesteld slot.

      3 De ruimte waarin de meetinrichting is opgesteld is voorzien van een doeltreffende verlichtingsinstallatie.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.36
  - number: '2.37'
    text: |-
      De aangeslotene dient bij de netbeheerder in drievoud een staffelplan met betrekking tot de beveiligingsmiddelen
      in. De netbeheerder stelt na beoordeling en indien noodzakelijk na aanpassing één gewaarmerkt exemplaar aan de
      aangeslotene of diens installateur ter beschikking.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.37
  - number: '2.38'
    text: De hoogspanningsinstallatie is bestand tegen het ter plaatse optredende kortsluitvermogen.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.38
  - number: '2.39'
    text: |-
      1 Indien aansluitingswerkzaamheden ten behoeve van een aansluiting als bedoeld in
      [artikel 16c van de Elektriciteitswet 1998][ref1] in opdracht van de aangeslotene worden uitgevoerd door een ander
      dan de netbeheerder, dient voorafgaand aan de uitvoering van deze aansluitingswerkzaamheden een overeenkomst te
      zijn gesloten tussen de aangeslotene en de netbeheerder.

      2 In de overeenkomst wordt vastgelegd welke aansluitingswerkzaamheden de aangeslotene openbaar zal aanbesteden
      (aanleg, onderhoud, wijziging en/of verwijdering van de aansluiting).

      3 In de overeenkomst wordt voor de openbaar aan te besteden aansluitingswerkzaamheden in elk geval datgene geregeld
      dat noodzakelijk is voor de waarborging van de veiligheid en

      betrouwbaarheid van het net.

      4 Het bedrijf dat de in het eerste lid bedoelde aansluitingswerkzaamheden uitvoert, werkt overeenkomstig het
      [Arbeidsomstandighedenbesluit][ref2], [artikel 3.4][ref3] en [3.5][ref4] en de daarbij behorende beleidsregels en
      de daarin aangewezen normen:

      a. NEN-EN 50110-1:2013 ‘Bedrijfsvoering van elektrische installaties – Algemene eisen ‘ en

      b. NEN 3140+A1:2015 ‘Bedrijfsvoering van elektrische installaties – Laagspanning’ of

      c. NEN 3840+A1:2015 ‘Bedrijfsvoering van elektrische installaties – Hoogspanning’.

      5 Het bedrijf dat de in het eerste lid bedoelde aansluitingswerkzaamheden uitvoert, zorgt er voor dat zijn
      personeel dat betrokken is bij de uitvoering van de desbetreffende aansluitingswerkzaamheden beschikt over de op
      grond van de in het vierde lid genoemde normen benodigde aanwijzingen, rekening houdend met het volgende:

      a. de in 3.2.1 tot en met 3.2.4 van de NEN-EN 50110-1:2013 en de in 3.2.202 en 3.2.203 van de NEN 3840+A1:2015
      genoemde personen worden door of namens de hoogst verantwoordelijke in de organisatie van de netbeheerder voor de
      naleving van de [Arbeidsomstandighedenwet][ref5] schriftelijk aangewezen;

      b. het bedrijf dat de aansluitingswerkzaamheden uitvoert en de desbetreffende netbeheerder maken schriftelijk vast
      te leggen sluitende afspraken over de aanwijzing van de genoemde personen en hun onderlinge gezagsrelatie;

      c. eerst na de schriftelijke aanwijzing, als bedoeld in onderdeel a èn de schriftelijk vastgelegde afspraak, als
      bedoeld in onderdeel b, worden de in het eerste lid bedoelde aansluitingswerkzaamheden uitgevoerd.

      6 Het bedrijf dat de in het eerste lid bedoelde aansluitingswerkzaamheden uitvoert, toont aan dat het beschikt
      over aantoonbare ervaring met het uitvoeren van desbetreffende aansluitingswerkzaamheden aan de desbetreffende
      installaties en met de daarin toegepaste materialen en bedrijfsmiddelen en op het desbetreffende spanningsniveau.

      7 Indien het bedrijf dat de in het eerste lid bedoelde aansluitingswerkzaamheden uitvoert niet over de
      bedoelde ervaring beschikt, maar wel aan de overige voorwaarden uit het vierde en vijfde lid en eventueel
      [artikel 2.23, tweede lid][ref6], wordt voldaan, vinden de werkzaamheden plaats onder toezicht van de netbeheerder
      op kosten van het bedoelde bedrijf.

      8 Het in bedrijf nemen van de (gewijzigde) aansluiting geschiedt pas na een door de aannemer afgegeven
      schriftelijke verklaring waaruit blijkt dat de acceptatietest succesvol is doorlopen en pas nadat afspraken omtrent
      het tijdstip van ingebruikname en omtrent de beveiligingsinstellingen zijn gemaakt en vastgelegd in de in het
      eerste lid bedoelde overeenkomst. Indien dat voor de acceptatietest noodzakelijk is, wordt er een proefspanning
      aangelegd volgens specificatie van de netbeheerder.


