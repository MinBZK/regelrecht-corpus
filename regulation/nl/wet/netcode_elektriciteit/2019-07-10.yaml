        hoofdstuk: '5'
        paragraaf: '5.1'
  - number: '5.8'
    text: |-
      1 Indien de beheerder van een gesloten distributiesysteem gebruikt wenst te maken van
      het elektronisch berichtenverkeer bedoeld in [paragraaf 13.5][ref1] van deze code en
      [artikel 9.1.2 van de Informatiecode elektriciteit en gas][ref2], dan

      a. dient hij daartoe op grond van [artikel 13.33, eerste lid][ref3] van deze code respectievelijk
      [artikel 9.1.6 van de Informatiecode elektriciteit en gas][ref4] gerechtigd te zijn, en;

      b. zijn de [artikelen 2.12][ref5], met uitzondering van het tweede lid, [2.30][ref6], [2.31][ref7],[9.2][ref8],
      [9.10][ref9], [9.11][ref10], [9.19][ref11],[10.4 tot en met 10.6][ref12], [10.24][ref13],
      [10.25, eerste lid, onderdeel b en vijfde lid][ref14], [10.26, tweede en derde lid][ref15], [10.27][ref16],
      inclusief de [bijlagen 2][ref17] en [3][ref18], [artikel, 13.12, zesde en zevende lid][ref19] en
      [13.14, vijfde en zesde lid][ref20], [13.32 tot en met 13.36][ref21] van overeenkomstige toepassing op de beheerder
      van het gesloten distributiesysteem; en

      c. is de [Informatiecode elektriciteit en gas][ref22], met uitzondering van de [hoofdstukken 3][ref23], [5][ref24]
      en [8][ref25] alsmede van de [artikelen 2.1.2][ref26], [9.1.1][ref27] en [9.1.3][ref28] van overeenkomstige
      toepassing op de beheerder van het gesloten distributiesysteem.

      2 Op een recreatienet is het eerste lid van overeenkomstige toepassing.


