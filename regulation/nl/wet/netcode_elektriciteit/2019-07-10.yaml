  - number: '2.31'
    text: |-
      1 In afwijking van [artikel 2.12][ref1] hoeft een aangeslotene met een aansluiting met een doorlaatwaarde groter
      dan 3x25A niet te zorgen voor comptabele meting, indien:

      a. het een aansluiting betreft van een zogenaamde ‘onbemande’ installatie van een object zonder verblijfsfunctie in
      de openbare ruimte;

      b. de netbeheerder de in een jaar te transporteren hoeveelheid elektriciteit goed kan berekenen en de aangeslotene
      er mee instemt dat op basis van het aldus berekende verbruik de door hem verschuldigde transportkosten berekend
      worden;

      c. voor deze installatie kan worden volstaan met een aansluiting met een doorlaatwaarde kleiner dan of gelijk aan
      3x25A, gelet op het geïnstalleerde vermogen van de installatie, en

      d. de aangeslotene bij de netbeheerder een verzoek heeft ingediend tot verlaging van de doorlaatwaarde van de
      aansluiting tot een waarde kleiner dan of gelijk aan 3x25A.

      2 [Artikel 2.30, tweede tot en met vijfde lid][ref2], is van overeenkomstige toepassing op een installatie, bedoeld
      in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.30
