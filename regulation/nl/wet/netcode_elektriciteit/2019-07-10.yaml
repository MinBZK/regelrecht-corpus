  - number: '10.22'
    text: |-
      1 De netbeheerder geeft dagelijks aan de netbeheerder van het landelijk hoogspanningsnet per deelnet de som van
      alle, via dat net uitgewisselde energie door.

      2 De netbeheerder geeft dagelijks aan de andere met hem gekoppelde netbeheerders per aansluiting tussen de
      desbetreffende netten per meetperiode de tussen hem en die netbeheerders uitgewisselde energie door.

      3 Voor zover overeengekomen, geeft een netbeheerder aan een andere met hem gekoppelde netbeheerder per aansluiting
      tussen de desbetreffende netten per meetperiode de tussen hem en die andere netbeheerder uitgewisselde blindenergie
      door.

      4 De netbeheerder geeft aan andere, op zijn net aangesloten, netbeheerders de meetgegevens ten behoeve van de
      verrekening van de transportdiensten door.

      5 De netbeheerder geeft jaarlijks of zoveel vaker als overeengekomen aan grootverbruikers de tellerstanden
      voor de hoeveelheid met het net uitgewisselde energie en voor zover van toepassing de daarbij behorende
      vermenigvuldigingsfactor(en) door.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel10.22
  - number: '10.23'
    text: |-
      1 Iedere werkdag publiceert de netbeheerder van het landelijk hoogspanningsnet op haar website per
      onbalansverrekeningsperiode de som van de door aangeslotenen met een opgesteld vermogen van 10 MW of meer op het
      net ingevoede elektriciteit, vermeerderd met de som van de uitgewisselde energie op de landgrensoverschrijdende
      netten. Publicatie vindt plaats de werkdag volgend op de daadwerkelijke meting.

      2 Iedere werkdag geven de netbeheerders ten behoeve van de publicatie op grond van het eerste lid de meetgegevens
      per aangeslotene met een opgesteld vermogen van 10 MW of meer per onbalansverrekeningsperiode door aan de
      netbeheerder van het landelijk hoogspanningsnet.

      3 [Artikel 10.17, achtste en tiende lid][ref1], zijn op overeenkomstige wijze van toepassing op het tweede lid.

      4 De netbeheerder van het landelijk hoogspanningsnet geeft bij de op grond van het eerste lid gepubliceerde
      gegevens aan wat de sommatie is van de geprogrammeerde importen respectievelijk de geprogrammeerde exporten.

      5 Binnen elf werkdagen na de eerste publicatie maakt de netbeheerder van het landelijk hoogspanningsnet de in het
      eerste en vierde lid genoemde data definitief.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.17
