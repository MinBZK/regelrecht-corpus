  - number: '10.33'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet is een boete verschuldigd van € 5.000,– voor iedere keer dat
      hij niet binnen de in [artikel 10.11, tweede lid][ref1], of [artikel 10.13][ref2], eerste lid, daartoe bepaalde
      tijdspanne aan één of meer BRP's heeft bericht als in die bepalingen aangegeven.

      2 De netbeheerder van het landelijk hoogspanningsnet is een boete verschuldigd van € 5.000,– voor iedere keer dat
      hij één of meer BRP's niet binnen 30 minuten na indiening van het energieprogramma heeft bericht omtrent de in
      [artikel 10.14, eerste lid, onderdeel a][ref3], bedoelde consistentie respectievelijk niet binnen 30 minuten na de
      sluitingstijd voor inzending van energieprogramma's respectievelijk programmawijzigingen heeft bericht omtrent de
      in artikel 10.14, eerste lid, onderdeel a, bedoelde consistentie van het door een BRP ingediende energieprogramma.

      3 De netbeheerder van het landelijk hoogspanningsnet is een boete verschuldigd van € 5.000,– voor iedere keer
      dat hij één of meer BRP's niet vóór 24:00 uur van een werkdag een opgave verstrekt van de onbalansen van een BRP
      gedurende het daaraan voorafgaande etmaal of, als de eerstbedoelde werkdag volgt op een weekeinde of een algemeen
      erkende feestdag, de onbalansen gedurende dat weekeinde onderscheidenlijk die feestdag of -dagen en het etmaal dat
      daaraan vooraf is gegaan.


