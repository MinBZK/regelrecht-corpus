  - number: '2.25'
    text: |-
      1 Op basis van het tweede lid bepaalt de netbeheerder, rekening houdend met het bepaalde in de
      [artikelen 2.32 tot en met 2.34][ref1] alsmede met de aard en de omvang van de elektrische installatie, in welke
      vorm van de in [artikel 7.2][ref2] genoemde vormen de transportcapaciteit op de aansluiting ter beschikking wordt
      gesteld.

      2 Een aansluiting met een aansluitcapaciteit:

      a. kleiner dan of gelijk aan 5,5 kVA wordt aangesloten op een net met een spanningsniveau van 0,23 kV;

      b. groter dan 5,5 kVA en kleiner dan of gelijk aan 60 kVA wordt aangesloten op een net met een spanningsniveau van
      0,4 kV;

      c. groter dan 60 kVA en kleiner dan of gelijk aan 0,3 MVA wordt aangesloten op de secundaire zijde van de
      laagspanningsdistributietransformator met een spanningsniveau van 0,4 kV;

      d. groter dan 0,3 MVA en kleiner dan of gelijk aan 3 MVA wordt aangesloten op een net met een spanningsniveau
      groter dan 1 kV en kleiner dan 25 kV;

      e. groter dan 3 MVA en kleiner dan of gelijk aan 100 MVA wordt aangesloten op een net met een spanningsniveau
      groter dan of gelijk aan 25 kV en kleiner dan of gelijk aan 50 kV;

      f. groter dan 100 MVA wordt aangesloten op een net met een spanningsniveau groter dan 50 kV.

      3 In gebieden waar geen net met een spanningsniveau van 25 kV tot en met 50 kV voorhanden is, wordt op een net
      met het naast hogere of lagere spanningsniveau aangesloten. De netbeheerder dient daartoe de waarden voor de
      aansluitcapaciteit aan te passen.

      4 Het is de netbeheerder toegestaan om voor zijn gebied af te wijken van de in het tweede lid genoemde waarden voor
      de aansluitcapaciteit. Deze afwijkende waarden liggen ter inzage bij de netbeheerder en worden, ook bij wijzigingen
      ervan, schriftelijk gemeld bij de Autoriteit Consument en Markt.

      5 De netbeheerder wijkt niet af van de spanningsniveaus genoemd in het tweede lid, tenzij de aangeslotene daar
      schriftelijk mee instemt. Bij afwijkingen vanaf het 25 kV spanningsniveau is het mogelijk dat de aangeslotene
      daardoor voor het transporttarief in een andere klasse terechtkomt.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.32
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel7.2
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.25
    references:
