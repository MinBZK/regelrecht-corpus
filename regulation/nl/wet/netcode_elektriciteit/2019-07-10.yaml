  - number: '1.1'
    text: |-
      Deze code bevat de voorwaarden als bedoeld in
      [artikel 31, eerste lid, onderdelen a, c, en f tot en met k, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
  - number: '1.2'
    text: |-
      1 Voor de toepassing van deze code gelden de begrippen en bijbehorende begripsbepalingen uit de
      [Begrippencode elektriciteit][ref1].

      2 In deze code wordt onder aangeslotene mede verstaan degene die om een aansluiting heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0037938
  - number: '1.4'
    text: |-
      De processen in de [artikelen 3.2][ref1], [3.3][ref2], [9.2][ref3], [9.4 tot en met 9.11][ref4],
      [9.19][ref5],[13.11 tot en met 13.14][ref6], alsmede in de [hoofdstukken 10][ref7] en [11][ref8], inclusief de
      [bijlagen 2][ref9] en [3][ref10], worden toegepast per allocatiepunt in plaats van per aansluiting.


