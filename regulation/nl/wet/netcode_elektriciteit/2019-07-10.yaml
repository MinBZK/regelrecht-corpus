  - number: '10.4'
    text: |-
      1 Tot het uitoefenen van balanceringsverantwoordelijkheid voor een aansluiting laat een netbeheerder slechts
      natuurlijke personen, rechtspersonen en vennootschappen toe aan wie de netbeheerder van het landelijk
      hoogspanningsnet op overeenkomstig [artikel 10.2][ref1] een erkenning als BRP heeft verleend.

      2 Een aangeslotene die de balanceringsverantwoordelijkheid voor zijn aansluiting niet zelf uitoefent, draagt die
      balanceringsverantwoordelijkheid over aan een BRP.

      3 Een aangeslotene die de balanceringsverantwoordelijkheid voor zijn aansluiting niet zelf uitoefent,
      laat de beoogde BRP aan de netbeheerder op wiens net hij is aangesloten overeenkomstig het proces
      uit [paragraaf 4.5 van de Informatiecode elektriciteit en gas][ref2] melden aan welke BRP hij zijn
      balanceringsverantwoordelijkheid heeft overgedragen.

      4 Een aangeslotene die het voornemen heeft zijn balanceringsverantwoordelijkheid over te dragen
      aan een andere BRP dan de BRP die tot dan toe balanceringsverantwoordelijkheid voor hem heeft
      uitgeoefend, laat de beoogde BRP aan de netbeheerder die het aangaat overeenkomstig het proces
      uit [paragraaf 4.5 van de Informatiecode elektriciteit en gas][ref3] melden aan welke BRP hij zijn
      balanceringsverantwoordelijkheid heeft overgedragen.

      5 In afwijking van het gestelde in het derde en vierde lid geldt dat in het geval een leverancier, daartoe
      bepaaldelijk gemachtigd, voor een aangeslotene balanceringsverantwoordelijkheid regelt, de leverancier de
      in het derde en het vierde lid bedoelde melding doet overeenkomstig de processen uit [hoofdstuk 3][ref4] of
      [4 van de Informatiecode elektriciteit en gas][ref5].

      6 Een netbeheerder doet overeenkomstig [hoofdstuk 3][ref6] of [4 van de Informatiecode elektriciteit en gas][ref7]
      aan de BRP die tot aan de in het vierde lid bedoelde overdracht de balanceringsverantwoordelijkheid van de
      aangeslotene uitoefent, onverwijld mededeling van het feit dat hem een kennisgeving als bedoeld in het vierde lid
      heeft bereikt en door hem is aanvaard.


