  - number: '7.7'
    text: |-
      De gezamenlijke netbeheerders dienen op basis van de meetresultaten als bedoeld in [artikel 7.4, derde lid][ref1],
      en met in achtneming van de [artikelen 31 tot en met 36 van de Elektriciteitswet 1998][ref2] uiterlijk 1 januari
      2018 een voorstel tot wijziging van de Netcode elektriciteit in bij ACM. Het wijzigingsvoorstel bevat voor netten
      met een spanningsniveau van 35 kV en hoger in elk geval criteria en een nalevingsverplichting ten aanzien van
      spanningsdips. De gezamenlijke netbeheerders houden bij het vaststellen van hun wijzigingsvoorstel rekening met
      relevante ontwikkelingen ter zake van criteria met betrekking tot spanningskwaliteit binnen Europa.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel7.4
