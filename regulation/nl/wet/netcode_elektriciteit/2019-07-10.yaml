        paragraaf: '2.5'
  - number: '2.24'
    text: |-
      1 In aanvulling op de voorwaarden in [paragraaf 2.1][ref1] en [paragraaf 2.2][ref2] gelden voor een aansluiting op
      een wisselstroomnet, ongeacht het spanningsniveau, de voorwaarden van deze paragraaf.

      2 In afwijking van het eerste lid, gelden de bepalingen van de [artikelen 2.27][ref3] en [2.28][ref4] niet voor de
      aansluiting van een net op een net.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.27
      [ref4]: https://wetten.overheid.nl/BWBR0037940#Artikel2.28
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.24
    references:
      - id: ref1
        bwb_id: BWBR0037940
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
