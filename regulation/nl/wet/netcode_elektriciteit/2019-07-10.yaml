  - number: '13.6'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet verstrekt de netbeheerder van een op zijn net aangesloten
      net van elk afzonderlijk station dat direct gekoppeld is aan het net van die netbeheerder de structurele gegevens,
      te weten:

      a. het spanningsniveau van de primaire zijde van het station;

      b. het aantal railsystemen en de onderlinge samenhang ervan;

      c. de typegegevens van de schakelaars van de transformatorvelden;

      d. de typegegevens van de scheiders van de transformatorvelden;

      e. de omvang en het type van de op het in onderdeel a bedoelde station aangesloten stationaire
      blindvermogenscompensatiemiddelen.

      2 De structurele gegevens als bedoeld in het eerste lid worden verstrekt onder vermelding van de naam van het
      station.

      3 De netbeheerder van het landelijk hoogspanningsnet verstrekt de netbeheerder van een op zijn net aangesloten net
      van elk afzonderlijk overdrachtspunt van een aansluiting de structurele gegevens, te weten:

      a. de elektrische karakteristieken van de lijnen en kabels die deel uitmaken van de transformatorvelden;

      b. de gegevens van de vermogenstransformatoren, indien deze deel uitmaken van het landelijk hoogspanningsnet, te
      weten:

      1°. het nominale schijnbare vermogen;

      2°. de nominale spanning aan de primaire zijde;

      3°. de nominale spanning aan de secundaire zijde;

      4°. de nominale kortsluitspanning;

      5°. de nominale koper- of kortsluitverliezen;

      6°. de nominale ijzer- of nullastverliezen;

      7°. de schakelgroep van de wikkelingen;

      8°. de sterpuntsbehandeling, te weten zwevend, hard geaard, geaard via impedantie;

      9°. indien van toepassing de gegevens aangaande de regelschakelaar, te weten de hoogste trap, de laagste trap, de
      stapgrootte; de regelbaarheid, namelijk continu regelbaar (online) of spanningsloos instelbaar (offline);

      c. van het achter het overdrachtspunt gelegen landelijk hoogspanningsnet het netmodel, bestaande uit:

      1°. het invoedend kortsluitvermogen (één- en driefase kortsluitstromen);

      2°. de topologie.

      4 De structurele gegevens als bedoeld in het derde lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter het regionale net zich bevindt;

      b. de EAN-code van het desbetreffende overdrachtspunt als bedoeld in [artikel 2.4, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
