  - number: '10.21'
    text: |-
      1 De netbeheerder voert de in [artikel 10.17, zevende en achtste lid][ref1], beschreven acties uit op de opnieuw
      vastgestelde definitieve meetgegevens.

      2 De netbeheerder stuurt onverwijld de naar aanleiding van het eerste lid jo. [artikel 10.17, zevende lid][ref2],
      verzamelde gegevens inzake al zijn aansluitingen aan de netbeheerder van het landelijk hoogspanningsnet.

      3 De netbeheerder stuurt onverwijld de naar aanleiding van het eerste lid jo. [artikel 10.17, achtste lid][ref3],
      verzamelde meetgegevens aan de desbetreffende BRP.


