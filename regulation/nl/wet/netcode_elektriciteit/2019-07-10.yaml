  - number: '10.28'
    text: |-
      1 Verschillen tussen de historische allocatie en de herberekende allocatie worden tussen desbetreffende
      netbeheerder en BRP verrekend tegen de reconciliatieprijs, zoals genoemd in [artikel 10.27, vierde lid][ref1],
      onderdeel b.

      2 In afwijking van het eerste lid kunnen partijen overeenkomen om verrekening achterwege te laten indien de kosten
      van het verrekenen substantieel zijn ten opzichte van het te verrekenen bedrag.

      3 Netbeheerders en BRP's melden uiterlijk op 31 oktober van het tweede kalenderjaar na een verbruiksjaar,
      onderbouwd, aan een wederpartij welke verschillen zij wensen te verrekenen.

      4 De wederpartij in een verzoek als bedoeld in het derde lid heeft tot uiterlijk 31 december van dat jaar de tijd
      te reageren op het desbetreffende verzoek.


