  - number: '10.26'
    text: |-
      1 De BRP kan bij controle op grond van het tweede en vijfde lid gebruik maken van de gegevens die hij ingevolge
      [artikel 10.25, tweede tot en met vierde lid][ref1], van de netbeheerder heeft ontvangen.

      2 De BRP controleert de meetgegevens die hij op grond van [artikel 10.18, vierde lid][ref2], en
      [10.19, vierde lid][ref3], van de netbeheerders ontvangen heeft voor de hem aangaande aansluitingen tenminste op de
      volgende criteria:

      a. de netbeheerder heeft de volumes toegerekend overeenkomstig de gegevens in zijn aansluitingenregister;

      b. de door de netbeheerder aangeleverde meetgegevens zijn in lijn met de verwachtingen van de BRP.

      3 Indien uit de controle in het tweede lid van de meetgegevens die de BRP op grond van
      [artikel 10.19, vierde lid][ref4], van de netbeheerder heeft ontvangen, voor één of meer meetwaarden blijkt
      dat deze niet voldoet, dient de BRP een herzieningsverzoek in bij de desbetreffende netbeheerder. Daarbij wordt
      aangegeven om welk van de volgende redenen de meetwaarde is afgekeurd.

      a. de meetgegevens worden betwist;

      b. de meetgegevens werden verwacht, maar zijn niet ontvangen;

      c. de meetwaarden zijn over een te lange periode (meer dan vijf dagen) geschat;

      d. de meetwaarden zijn ontvangen maar werden niet verwacht.

      4 In het geval onderdeel a van het derde lid van toepassing is, doet de BRP zelf een voorstel voor de te gebruiken
      meetgegevens.

      5 De BRP kan tot 16:00 uur van de dag waarop hij op grond van [artikel 10.20, derde lid][ref5], meetgegevens heeft
      ontvangen bij de desbetreffende netbeheerder reclameren over deze meetgegevens.


