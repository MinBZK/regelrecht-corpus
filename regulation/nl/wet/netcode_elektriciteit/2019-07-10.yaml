  - number: '2.10'
    text: |-
      Met inachtneming van de [artikelen 2.5 tot en met 2.9][ref1] kan de aangeslotene bij zijn verzoek om een of meer
      secundaire allocatiepunten aan zijn aansluiting toe te kennen, kiezen voor de variant met parallel geplaatste
      meetinrichtingen als bedoeld in de [artikelen 2.5 tot en met 2.8][ref2] of serieel geplaatste meetinrichtingen als
      bedoeld in [artikel 2.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.5
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.9
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.10
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037940
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0037940
        artikel: '2.9'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.11'
    text: |-
      De aangeslotene zorgt er voor dat:

      a. de aansluiting goed bereikbaar blijft;

      b. de toegang tot de ruimte waarin zich de meetinrichting en de tot de aansluiting behorende apparatuur bevinden,
      niet op een naar het oordeel van de netbeheerder ontoelaatbare wijze wordt belemmerd;

      c. verzegelingen die door of vanwege de netbeheerder zijn aangebracht op de meetinrichting of op delen van de
      aansluiting niet worden geschonden of verbroken tenzij de netbeheerder uitdrukkelijk toestemming geeft tot het
      verbreken van de verzegeling;

      d. hij alle maatregelen neemt die redelijkerwijs van hem verwacht kunnen worden om schade aan het in het perceel
      aanwezige gedeelte van de aansluiting te voorkomen;

      e. de meetinrichting en de tot de aansluiting behorende apparatuur niet opgesteld worden in vochtige ruimten,
      ruimten met bijtende gassen, dampen of stoffen, ruimten met ontploffingsgevaar en ruimten met brandgevaar; en

      f. boven of in de onmiddellijke nabijheid van de meetinrichting geen water-, stoom- of soortgelijke leidingen voor
      komen, tenzij, ter beoordeling van de netbeheerder, passende voorzieningen zijn getroffen voor de bescherming van
      de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.11
  - number: '2.12'
    text: |-
      1 De aangeslotene zorgt voor comptabele meting bij het (de) overdrachtspunt(en) van de aansluiting met inachtneming
      van de [Meetcode elektriciteit][ref1], tenzij op grond van deze code anders is bepaald.

      2 De plaats van de comptabele meetinrichting wordt bepaald door de netbeheerder in overleg met de aangeslotene en,
      indien de aangeslotene een grootverbruiker is en hij zijn meetverantwoordelijkheid heeft overgedragen, met de door
      hem op grond van de [Meetcode elektriciteit][ref2] aangewezen meetverantwoordelijke.

      3 De comptabel te meten grootheden worden vastgelegd in de aansluit- en transportovereenkomst.

      4 De comptabele meetinrichting registreert de grootheden in het overdrachtspunt van de aansluiting. In geval van
      aansluitingen met een of meer secundaire allocatiepunten gebeurt dat voor elk allocatiepunt afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0037946
      - id: ref2
        bwb_id: BWBR0037946
  - number: '2.13'
    text: |-
      1 De beveiliging van elektrische installaties (en onderdelen daarvan) is selectief ten opzichte van de beveiliging
      die de netbeheerder in de aansluiting van de elektrische installatie of in het voedende net toepast.

      2 Bij de dimensionering van de elektrische installatie wordt rekening gehouden met de door de netbeheerder toe te
      passen beveiliging.

      3 De netbeheerder informeert de aangeslotene en overlegt met hem voor zover van toepassing bij eerste aansluiting
      en bij latere wijzigingen van het net omtrent:

      a. de beveiligingsfilosofie;

      b. de minimum- en maximumwaarde van het kortsluitvermogen tijdens de normale toestand;

      c. de wijze van sterpuntsbehandeling;

      d. de isolatiecoördinatie;

      e. de netconfiguratie; en

      f. de bedrijfsvoering.

      4 Voor zover de in het derde lid genoemde gegevens nodig zijn voor de bedrijfsvoering van de aangeslotene worden
      deze in de aansluit- en transportovereenkomst vastgelegd.

      5 Zowel de aangeslotene als de netbeheerder kunnen het vastgelegde maximale kortsluitvermogen slechts in overleg
      met elkaar aanpassen.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.13
  - number: '2.14'
    text: |-
      1 Onverminderd het in of krachtens deze code bepaalde voldoen alle bedrijfsmiddelen en toestellen in of aangesloten
      op de elektrische installaties aan de op deze bedrijfsmiddelen en toestellen van toepassing zijnde normen.

      2 De in een elektrische installatie opgenomen machines, toestellen, materialen en onderdelen voldoen aan de voor de
      handel daarin of het gebruik daarvan vastgestelde wettelijke voorschriften.

      3 De elektrische installatie is bestand tegen het door de netbeheerder ter plaatse verwachte kortsluitvermogen.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.14
  - number: '2.15'
    text: |-
      1 Elektrische installaties en de daarop aangesloten toestellen veroorzaken via het net van de netbeheerder geen
      ontoelaatbare hinder.

      2 De netbeheerder kan de aangeslotene verzoeken tot het treffen van zodanige voorzieningen dat de ontoelaatbare
      hinder ophoudt, dan wel voor een door hem te bepalen aantal uren de aangeslotene verbieden om door hem aan te
      wijzen toestellen en motoren te gebruiken.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.15
  - number: '2.16'
    text: |-
      1 De elektrische installaties bevatten geen bedrijfsmiddelen die tot invoeding in het net van de netbeheerder
      kunnen leiden, tenzij aan de aanvullende voorwaarden voor elektriciteitsproductie-eenheden zoals opgenomen in
      [hoofdstuk 3][ref1] wordt voldaan.

      2 De aangeslotene stelt de netbeheerder tijdig op de hoogte van zijn voornemen tot invoeding, opdat de netbeheerder
      eventueel noodzakelijke wijzigingen in het net kan doorvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.16
    references:
      - id: ref1
        bwb_id: BWBR0037940
        hoofdstuk: '3'
  - number: '2.17'
    text: |-
      1 De aangeslotene onderhoudt de elektrische installatie naar behoren.

      2 Bij aanleg van nieuwe elektrische installaties, alsmede bij uitbreiding, wijziging of vernieuwing van bestaande
      elektrische installaties waarbij de aansluiting dan wel de meetinrichting moet worden uitgebreid of gewijzigd,
      geeft de aangeslotene de netbeheerder zo spoedig mogelijk schriftelijk, op de door de netbeheerder aangegeven
      wijze, op:

      a. zijn naam, volledige adres en telefoonnummer;

      b. het volledige adres en de bestemming van het perceel, waarin of waarop de werkzaamheden zullen worden verricht;
      en

      c. de naam, het volledige adres en het telefoonnummer van degene die de werkzaamheden verricht.

      3 Ten minste drie volle werkdagen voor het gereedkomen van een nieuwe elektrische installatie respectievelijk van
      de uitbreiding, wijziging of vernieuwing van een bestaande elektrische installatie waarbij de aansluiting dan wel
      de meetinrichting moet worden uitgebreid of gewijzigd, stelt de aangeslotene hiervan de netbeheerder op de door de
      netbeheerder aangegeven wijze in kennis.

      4 Onverminderd het bepaalde in het derde lid wordt een uitbreiding, wijziging of vernieuwing van een elektrische
      installatie geacht gereed te zijn, indien deze elektrische installatie geheel of gedeeltelijk is aangesloten.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.17
  - number: '2.18'
    text: |-
      1 Indien naar het oordeel van de netbeheerder redelijke twijfel bestaat of een elektrische installatie voldoet aan
      de van toepassing zijnde bepalingen van deze code, toont de aangeslotene aan dat zijn elektrische installatie aan
      deze bepalingen voldoet.

      2 Wanneer de aangeslotene in gebreke blijft, is de netbeheerder bevoegd om de elektrische installatie zelf te
      onderzoeken of te laten onderzoeken.

      3 Indien een elektrische installatie naar het oordeel van de netbeheerder niet voldoet aan het bepaalde in deze
      code, herstelt de aangeslotene de gebreken, zo nodig onmiddellijk. De netbeheerder kan door de aangeslotene daarbij
      in acht te nemen aanwijzingen geven.

      4 De netbeheerder heeft geen verplichting om na te gaan of aan het in deze code bepaalde is voldaan.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.18
  - number: '2.19'
    text: |-
      In aanvulling op de voorwaarden in [paragraaf 2.1][ref1] gelden voor een aansluiting op een wisselstroomnet met een
      spanningsniveau kleiner dan of gelijk aan 1 kV de voorwaarden van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0037940
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.20'
    text: |-
      1 In percelen waar de elektrische installatie door middel van een in de grond gelegde kabel wordt aangesloten,
      worden voorzieningen getroffen voor het gemakkelijk en gasbelemmerend binnenleiden van deze kabel, waaronder in
      ieder geval een beschermbuis waarvan de netbeheerder het materiaal en de afmetingen bepaalt, tenzij de netbeheerder
      uitdrukkelijk te kennen heeft gegeven zulks niet noodzakelijk te achten. In het geval een leidinginvoerput
      wordt aangebracht, voldoet deze aan NEN 2768:2016 ‘Meterkasten en bijbehorende bouwkundige voorzieningen voor
      leidingaanleg in woningen’.

      2 In woonhuizen met individuele meting wordt voor het onderbrengen van alle tot de aansluiting en meetinrichting
      behorende apparatuur een kast ter beschikking gesteld, die voldoet aan de eisen, gesteld in NEN 2768:2016
      ‘Meterkasten en bijbehorende bouwkundige voorzieningen voor leidingaanleg in woningen’. In geval de meteropname van
      buitenaf kan geschieden of het overdrachtspunt van buitenaf bereikbaar is, kan de netbeheerder ten aanzien van deze
      kast nadere eisen stellen.

      3 Bij andere aansluitingen dan bedoeld in het tweede lid wijst de netbeheerder, na overleg met de aangeslotene,
      de ter beschikking te stellen ruimten aan voor het onderbrengen van de tot de aansluiting en de meetinrichting
      behorende apparatuur. De netbeheerder stelt de eisen vast waaraan deze ruimten voldoen.

      4 De aangeslotene stelt voor de aansluiting van een tijdelijke installatie een stevige, deugdelijk afsluitbare kast
      of ruimte ter beschikking aan de netbeheerder, waarvan de netbeheerder de afmetingen en constructie bepaalt, voor
      het opstellen van de tot de aansluiting behorende apparatuur.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.20
  - number: '2.21'
    text: |-
      1 Het gezamenlijke nominale vermogen van motoren in een installatie die niet van afzonderlijke of
      gemeenschappelijke nulspanningsbeveiliging zijn voorzien bedraagt niet meer dan 10 kW, dan wel een met de
      netbeheerder in individuele gevallen overeengekomen hogere waarde.

      2 De netbeheerder kan in gevallen van gemeenschappelijke nulspanningsbeveiligingen verlangen dat inschakeling niet
      kan plaatsvinden dan nadat alle desbetreffende motoren zijn uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.21
  - number: '2.22'
    text: |-
      Tussen de elektrische installatie achter een aansluiting en de elektrische installatie achter een andere
      aansluiting bestaat geen verbinding, tenzij de netbeheerder anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.22
  - number: '2.23'
    text: |-
      1 Het bepaalde in [artikel 2.39][ref1] is van overeenkomstige toepassing op laagspanningsaansluitingen indien deze
      deel uitmaken van aansluitingen als bedoeld in [artikel 16c, tweede lid, van de Elektriciteitswet 1998][ref2].

      2 Indien de aansluitingswerkzaamheden met betrekking tot het verbreken van het laagspanningsnet, om een fysieke
      verbinding van de installatie van de aangeslotene met dat laagspanningsnet tot stand te brengen, onder spanning
      dient plaats te vinden ten behoeve van de handhaving van de ongestoorde transportdienst bij andere aangeslotenen,
      toont het bedrijf dat de aansluitingswerkzaamheden verricht aan dat:

      a. de personen die de bedoelde werkzaamheden uitvoeren, beschikken over de in [artikel 2.39, vijfde lid][ref3],
      bedoelde aanwijzingen;

      b. de personen die de bedoelde werkzaamheden uitvoeren, beschikken over de voor het onder spanning werken vereiste
      aanvullende opleidingen en bevoegdheden; en

      c. de werkzaamheden worden uitgevoerd met voor onder spanning werken geëigende materialen en gereedschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.39
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.39
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.23
