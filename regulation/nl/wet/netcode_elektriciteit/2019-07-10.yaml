  - number: '9.8'
    text: |-
      Congestiemanagement in een bepaald gebied eindigt op het moment dat er geen sprake meer is van structurele
      congestie in het desbetreffende gebied zoals aangekondigd in [artikel 9.6, tweede lid][ref1], dan wel als de
      termijn zoals genoemd in artikel 9.6, eerste lid, onderdeel c, is verstreken en er geen reden is om deze termijn
      te verlengen. Het einde van congestiemanagement in een bepaald gebied zal door de netbeheerder tenminste één week
      voor het daadwerkelijke einde worden gepubliceerd via zijn website. Deze publicatie bevat tenminste de volgende
      gegevens:

      a. een aanduiding van het desbetreffende congestiegebied en;

      b. de datum waarop congestiemanagement niet meer van kracht zal zijn en;

      c. de onderbouwing van de beëindiging van congestiemanagement.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.6
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.8
    references:
