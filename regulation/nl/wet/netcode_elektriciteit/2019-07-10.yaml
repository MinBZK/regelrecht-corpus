  - number: '10.36'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet verkrijgt balanceringsdiensten door de volgende producten aan
      te kopen:

      a. balanceringscapaciteit FCR voor het FCP overeenkomstig ten minste de in artikel 154 van de Verordening (EU)
      2017/1485 (GL SO) bepaalde technische minimumeisen;

      b. balanceringscapaciteit en balanceringsenergie regelvermogen voor het aFRP overeenkomstig het in
      [bijlage 8][ref1] bepaalde;

      c. balanceringsenergie reservevermogen voor het mFRP overeenkomstig het in [bijlage 9][ref2] bepaalde;

      d. balanceringscapaciteit noodvermogen voor het mFRP overeenkomstig het in [bijlage 10][ref3] bepaalde.

      2 [Bijlagen 8][ref4], [9][ref5] en [10][ref6] beschrijven de onder het tweede lid genoemde producten met de
      kenmerken voor standaardproducten zoals uiteengezet in artikel 25 van de Verordening (EU) 2017/2195 (GL EB) waar
      deze relevant zijn. Het volledige overzicht van specificaties voor de producten wordt uiteengezet in door de
      netbeheerder van het landelijk hoogspanningsnet vast te stellen procedures en specificaties.

      3 De specificaties voor reservevermogen in [bijlage 9][ref7] hebben alleen betrekking op het gebruik van
      reservevermogen door de netbeheerder van het landelijk hoogspanningsnet voor balancering.


