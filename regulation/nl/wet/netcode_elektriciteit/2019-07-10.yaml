  - number: '10.3'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet beheert een register, hierna te noemen het BRP-register,
      waarin de namen, adressen, telefoon- en faxnummers alsmede de gegevens ten behoeve van computermatige communicatie
      zijn vermeld van de in [artikel 10.4, eerste lid][ref1], bedoelde BRP's.

      2 De netbeheerder van het landelijk hoogspanningsnet deelt aan de BRP de datum van zijn inschrijving in het BRP-
      register mee.

      3 Een BRP heeft het recht het BRP-register in te zien en hem betreffende onjuistheden daarin te doen corrigeren.

      4 Wijzigingen in het BRP-register geeft de netbeheerder van het landelijk hoogspanningsnet onverwijld door aan de
      andere netbeheerders en BRP's.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.4
