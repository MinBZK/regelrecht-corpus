  - number: '2.32'
    text: |-
      1 Voor de toepassing van de in het tweede lid bedoelde voorschriften of bepalingen geldt dat de netbeheerder zal
      aangeven of het laagspanningsnet van de netbeheerder al dan niet is aangelegd volgens een systeem waarbij voldoende
      is verzekerd, dat de nul onder normale omstandigheden ongeveer aardpotentiaal houdt.

      2 De netbeheerder bepaalt of het net, of een gedeelte ervan, in aanmerking komt als TN-stelsel te worden gebruikt
      ten behoeve van de aardingsvoorziening van elektrische installaties en welke aanvullende voorwaarden daartoe op de
      aansluiting van toepassing zijn.

      3 Het gebruik van objecten van de netbeheerder als aardingsvoorziening voor elektrische installaties of gedeelten
      daarvan is niet toegestaan, tenzij anders met de netbeheerder is overeengekomen.

      4 In afwijking van het eerste tot en met het derde lid wordt bij nieuwe aansluitingen met een doorlaatwaarde groter
      dan 3x80A altijd een TN-systeem toegepast en biedt de netbeheerder de aangeslotene een aardingsvoorziening aan.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.32
  - number: '2.33'
    text: |-
      1 Aansluitingen waar naar het oordeel van de netbeheerder geen grotere gelijktijdige schijnbare belasting dan 5,5
      kVA, dan wel een met de netbeheerder in individuele gevallen overeengekomen hogere waarde, kan worden verwacht,
      worden als éénfase-aansluiting uitgevoerd, tenzij de aan te sluiten elektrische installatie verbruikende toestellen
      of motoren bevat die ingevolge het bepaalde in [artikel 2.34][ref1] op drie fasen moeten worden aangesloten, dan
      wel de netbeheerder om vergelijkbare technische redenen een driefasen-aansluiting verlangt.

      2 Aansluitingen waar naar het oordeel van de netbeheerder een grotere gelijktijdige schijnbare belasting dan 5,5
      kVA, dan wel een met de netbeheerder in individuele gevallen overeengekomen hogere waarde, kan worden verwacht,
      worden, behoudens ontheffing van de netbeheerder, als driefasen-aansluiting uitgevoerd. Daarbij zorgt de
      aangeslotene voor een zo veel mogelijk gelijke verdeling van de belasting over de drie fasen.

      3 Voor de bepaling van de gelijktijdige schijnbare belasting op een aansluiting wordt het schijnbare vermogen
      per lichtpunt en contactdoos gesteld op de werkelijke waarde of, indien deze niet bekend is, op een minimum
      van 50 VA per lichtpunt en 200 VA per contactdoos. Een meervoudige contactdoos wordt als één contactdoos
      aangemerkt. Bij de bepaling van de gelijktijdige schijnbare belasting wordt rekening gehouden met de te verwachten
      gelijktijdigheidfactor.

      4 Machines met een nominaal vermogen groter dan 2 kW, dan wel een met de netbeheerder in individuele gevallen
      overeengekomen hogere waarde, zijn in de regel op drie fasen aangesloten.

      5 Vermogenselektronische omzetters met een nominaal vermogen groter dan 5 kW, dan wel een met de netbeheerder in
      individuele gevallen overeengekomen hogere waarde, zijn in de regel op drie fasen aangesloten.

      6 Lastoestellen met een schijnbaar vermogen groter dan 2,5 kVA, dan wel een met de netbeheerder in individuele
      gevallen overeengekomen hogere waarde, worden tussen twee fasen aangesloten en zijn derhalve ingericht voor een
      nominale spanning van 400V.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.34
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.33
