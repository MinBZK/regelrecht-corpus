      1 De netbeheerder van het landelijk hoogspanningsnet wijst de in [artikel 12.1, eerste lid][ref1], genoemde
      veilig beschikbare landsgrensoverschrijdende transportcapaciteit toe door middel van veilingen, na aftrek van
      respectievelijk:

      a. de hoeveelheid capaciteit die de netbeheerder van het landelijk hoogspanningsnet overeenkomstig
      [artikel 12.2, eerste lid][ref2], reserveert om noodzakelijk transport van elektriciteit in het kader van
      onderlinge hulp en bijstand ten behoeve van de instandhouding van de integriteit van de netten te kunnen uitvoeren;

      b. de hoeveelheid capaciteit die de netbeheerder van het landelijk hoogspanningsnet
      reserveert ter uitvoering van een besluit van de Autoriteit Consument en Markt op grond van
      [artikel 26, eerste lid, van de Elektriciteitswet 1998][ref3].

      2 De netbeheerder van het landelijk hoogspanningsnet wijst het in [artikel 12.1, derde lid][ref4], genoemde
      veilig beschikbare capaciteitsdomein toe door middel van veilingen, waarbij deze rekening houdt met de hoeveelheid
      capaciteit die de netbeheerder van het landelijk hoogspanningsnet overeenkomstig [artikel 12.2, eerste lid][ref5],
      reserveert om noodzakelijk transport van elektriciteit in het kader van onderlinge hulp en bijstand ten behoeve van
      de instandhouding van de integriteit van de netten te kunnen uitvoeren.


