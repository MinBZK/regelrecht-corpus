  - number: '10.27'
    text: |-
      1 De netbeheerders voeren de reconciliatie uit over maand M aan de hand van meterstanden die betrekking hebben op
      maand M en die uiterlijk op de laatste dag van maand M+3 zijn vastgesteld.

      2 De netbeheerders, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, zenden uiterlijk de laatste
      werkdag van maand M+4 het aan een BRP toe te rekenen totale reconciliatievolume voor de reconciliatieperiode zoals
      bedoeld in [bijlage 2][ref1] aan de desbetreffende BRP en deze totalen van alle betrokken BRP's aan de netbeheerder
      van het landelijk hoogspanningsnet.

      3 Uiterlijk op de tiende werkdag van maand M+5 ontvangt de BRP van de netbeheerders, niet zijnde de netbeheerder
      van het landelijk hoogspanningsnet, ter specificatie van de volgens het vierde lid te ontvangen gegevens de
      volgende gegevens per gereconcilieerde aansluiting en per kalendermaand:

      a. de kalendermaand waarin de de reconciliatierun heeft plaatsgevonden;

      b. de kalendermaand waarover het het gereconcilieerde volume is vastgesteld;

      c. de EAN-code van de aansluiting;

      d. de bedrijfs EAN-code van de BRP;

      e. de bedrijfs EAN-code van de leverancier;

      f. de EAN-code van het netgebied waartoe de de aansluiting behoort;

      g. het standaardjaarverbruik voor normaaluren;

      h. het standaardjaarverbruik voor laaguren;

      i. het op basis van [artikel 10.20, tweede lid][ref2], toegerekende volume tijdens normaaluren;

      j. het op basis van [artikel 10.20, tweede lid][ref3], toegerekende volume tijdens laaguren;

      k. het op basis van meterstanden berekende volume tijdens normaaluren;

      l. het op basis van meterstanden berekende volume tijdens laaguren.

      4 Uiterlijk op de tiende werkdag van maand M+5 ontvangt de BRP van de netbeheerder van het landelijk
      hoogspanningsnet de volgende gegevens:

      a. het totaal van de in het tweede lid bedoelde verzamelde gegevens;

      b. de reconciliatieprijs, zijnde de gewogen gemiddelde day-ahead-clearingprijs voor de normaaluren en de laaguren
      periode. De wijze waarop deze prijs wordt bepaald is vermeld in [bijlage 3][ref4];

      c. het totaal nog te betalen of te ontvangen bedrag.

      5 De BRP's die per saldo moeten betalen, dragen er zorg voor dat de te betalen bedragen op de eerste dinsdag na
      de in het vierde lid bedoelde moment zijn gestort op een door de netbeheerder van het landelijk hoogspanningsnet
      speciaal daarvoor geopende bankrekening, tenzij tussen bedoelde moment en de eerste dinsdag niet meer dan drie
      werkdagen zijn gelegen. In dat geval dragen de BRP's er zorg voor dat de te betalen bedragen op de daaropvolgende
      dinsdag zijn gestort op de speciale bankrekening van de netbeheerder van het landelijk hoogspanningsnet.

      6 Op de woensdag volgende op die in het vijfde lid bedoelde dinsdag stort de netbeheerder van het landelijk
      hoogspanningsnet de op grond van het vierde lid uit te keren bedragen op een daartoe door hen bekend gemaakt
      bankrekeningnummer van de BRP's die per saldo ontvangen. De netbeheerder van het landelijk hoogspanningsnet is niet
      gehouden meer uit te keren dan door de BRP's aan hem is overgedragen.

      7 Indien een BRP zijn erkenning heeft verloren op grond van [artikel 10.35, eerste lid, onderdeel i][ref5],
      en aannemelijk is dat deze BRP niet meer zal betalen, zullen de in de reconciliatie met deze BRP te verrekenen
      bedragen naar evenredigheid over alle andere bij de reconciliatie betrokken BRP's worden verdeeld. Eventuele
      nagekomen ontvangsten van BRP's met betrekking tot aldus naar evenredigheid verdeelde bedragen, worden in een
      nadere verrekening ingebracht ten gunste van alle andere bij de reconciliatie betrokken BRP's.

      8 Indien de in het vijfde en zesde lid bedoelde dinsdag of woensdag niet op een werkdag valt, schuiven de termijnen
      op tot de eerstvolgende werkdag.

      9 De formules en de rekenmodellen die de netbeheerders hanteren bij het bepalen van de te reconciliëren volumes
      zijn vermeld in [bijlage 3][ref6].

      10 De netbeheerders leggen ten behoeve van het reconciliatieproces de gegevens vast volgens [bijlage 2][ref7].


