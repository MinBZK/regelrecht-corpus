  - number: '12.19'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet bepaalt, in samenwerking met de buitenlandse instellingen
      als bedoeld in [artikel 16, tweede lid, onderdeel h, van de Elektriciteitswet 1998][ref1] van de regio, het in
      [artikel 12.1, derde lid][ref2], genoemde veilig beschikbare capaciteitsdomein voor landsgrensoverschrijdende
      transport voor elektriciteit – voorts in deze paragraaf aangeduid als: ‘het capaciteitsdomein’ – op basis van de
      onderstaande methode.

      2 Het capaciteitsdomein wordt op uurbasis bepaald.

      3 Het capaciteitsdomein wordt bepaald door middel van netberekeningen met inachtneming van het in
      [artikel 12.20][ref3] gestelde op basis van een volledig beschikbaar net, waaronder verstaan wordt het samenstel
      van Nederlandse netten op een spanningsniveau van 220 kV of hoger, inclusief de landsgrensoverschrijdende
      verbindingen.

      4 De netbeheerder van het landelijk hoogspanningsnet bepaalt de maximale capaciteit voor de in
      [artikel 12.20, tweede lid][ref4], genoemde kritieke netcomponenten. Daarbij wordt rekening gehouden met het feit
      dat de belastbaarheid van de netcomponenten maximaal is gedurende de winterperiode ten gevolge van natuurlijke
      koeling.

      5 Voor elk van de kritieke netcomponenten bepaalt de netbeheerder van het landelijk hoogspanningsnet de
      betrouwbaarheidsmarge met inachtname van de volgende principes:

      a. De betrouwbaarheidsmarge geeft de onzekerheid in de vaststelling van de elektriciteitsstromen op het moment
      van bepaling van het capaciteitsdomein in vergelijking met de werkelijke elektriciteitsstromen in het netcomponent
      weer;

      b. De betrouwbaarheidsmarge wordt vastgesteld op basis van een analyse van het verschil tussen de historische
      vaststelling van de elektriciteitsstromen op het moment van bepaling van het capaciteitsdomein en de historisch
      werkelijke elektriciteitsstromen in het netcomponent.

      6 De netbeheerder van het landelijk hoogspanningsnet maakt een congestievoorspelling van het
      landelijk hoogspanningsnet op basis van een vooraf met de buitenlandse instellingen als bedoeld in
      [artikel 16, tweede lid, onderdeel h, van de Elektriciteitswet 1998][ref5] gezamenlijk afgestemd scenario. De
      congestievoorspelling wordt gemaakt op basis van verwachte beschikbaarheid en inzet van netcomponenten, verwachte
      beschikbaarheid en inzet van elektriciteitsproductie-installaties, verwachte elektriciteitsvraag en verwachte
      elektriciteitsstromen op de landsgrensoverschrijdende gelijkstroomverbindingen Eemshaven–Noorwegen, Eemshaven–
      Denemarken en Maasvlakte–Groot-Brittannië behorende bij het gezamenlijk afgestemd scenario.

      7 Gezamenlijk met de congestievoorspellingen van de buitenlandse instellingen (als bedoeld in
      [artikel 16, tweede lid, onderdeel h, van de Elektriciteitswet 1998][ref6]) stelt de netbeheerder van het landelijk
      hoogspanningsnet een gezamenlijk netmodel van de regio op. Dit dient als input om te komen tot gecoördineerde
      bepaling van het capaciteitsdomein.

      8 De netbeheerder van het landelijk hoogspanningsnet stelt de veilig beschikbare capaciteit
      voor elk kritiek netcomponent gecoördineerd met de buitenlandse instellingen als bedoeld in
      [artikel 16, tweede lid, onderdeel h, van de Elektriciteitswet 1998][ref7] als volgt vast:

      a. De gecoördineerde bepaling resulteert in een initieel beschikbare capaciteit voor een kritiek netcomponent op
      basis van de in het vierde lid genoemde maximale capaciteit voor het kritiek netcomponent verminderd met de in het
      vijfde lid genoemde betrouwbaarheidsmarge en de referentiestromen door het kritiek netcomponent afkomstig uit het
      in het zevende lid genoemde gezamenlijk netmodel.

      b. De netbeheerder van het landelijk hoogspanningsnet beoordeelt de resultaten uit deze gecoördineerde bepaling
      door de landsgrensoverschrijdende transporten maximaal te verhogen onder handhaving van de enkelvoudige
      storingsreserve voor de kritieke netcomponenten.

      c. Met inachtneming van de in [artikel 12.20][ref8] genoemde randvoorwaarden, kan de netbeheerder van het
      landelijk hoogspanningsnet beheersmaatregelen inzetten om de verwachte elektriciteitsstromen in het landelijk
      hoogspanningsnet te beïnvloeden, zodanig dat dit resulteert in een aanpassing van de beschikbare capaciteit voor
      een kritiek netcomponent.

      9 De in het achtste lid genoemde verhoging van de landsgrensoverschrijdende transporten gebeurt door de productie
      van Nederlandse elektriciteitsproductie-installaties die in het betreffende scenario zijn meegenomen, proportioneel
      te verlagen dan wel verhogen en door gelijktijdig de productie van buitenlandse elektriciteitsproductie-
      installaties die in het betreffende scenario beschikbaar zijn proportioneel te verhogen dan wel verlagen.

      10 De netbeheerder van het landelijk hoogspanningsnet houdt bij de bepaling van het capaciteitsdomein rekening
      met de dynamische stabiliteit en spanningshuishouding van het net door middel van maximale capaciteit voor import
      en export.

      11 De veilig beschikbare capaciteit voor elk kritiek netcomponent als vastgesteld in het achtste lid, samen met de
      in twaalfde lid genoemde invloedsfactoren voor elk kritiek netcomponent, bepalen het capaciteitsdomein.

      12 De in het negende lid genoemde proportionele verlaging dan wel verhoging van elektriciteitsproductie-
      installaties bepalen de invloedsfactoren (‘power transfer distribution factors’) van landsgrensoverschrijdende
      transporten op een kritiek netcomponent.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel12.1
