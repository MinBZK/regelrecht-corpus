  - number: '13.15'
    text: |-
      1 De netbeheerder waarvan een distributienet is aangesloten op het landelijk hoogspanningsnet, verstrekt de
      netbeheerder van het landelijk hoogspanningsnet, van elk afzonderlijk station dat direct gekoppeld is aan het
      landelijk hoogspanningsnet, de plannings- en prognosegegevens, jaarlijks, uiterlijk op 1 april, inhoudende een zo
      goed mogelijke schatting voor de komende tien jaar, van:

      a. de ontwikkeling van de wintermaxima, de zomermaxima en de dalbelasting op jaarbasis;

      b. een beschrijving van het belastingpatroon (bijvoorbeeld standaard dagcurve voor een werkdag, zaterdag en
      zondag);

      c. de revisieplanning van de elektriciteitsproductie-eenheden groter dan 60 MW, die zijn aangesloten op het
      betreffende net;

      d. het samengestelde draaiplan van de elektriciteitsproductie-eenheden, die zijn aangesloten op het betreffende
      net;

      2 De gegevens als bedoeld in het eerste lid worden verstrekt onder vermelding van:

      a. de naam van het station.

      3 De netbeheerder, waarvan een distributienet is aangesloten op het landelijk hoogspanningsnet, verstrekt de
      netbeheerder van het landelijk hoogspanningsnet, van elk afzonderlijk overdrachtspunt van de aansluiting van elk
      afzonderlijk distributienet, de plannings- en prognosegegevens van elk achter een overdrachtspunt gelegen deelnet,
      te weten:

      a. de geaggregeerde belasting;

      b. de geaggregeerde productie per primaire energiebron;

      c. het blindvermogen met richting.

      4 De gegevens als bedoeld in het derde lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter het distributienet zich bevindt;

      b. de EAN-code van het desbetreffende overdrachtspunt, als bedoeld in [artikel 2.4, vierde lid][ref2].

      5 Van de gegevens bedoeld in het derde lid, wordt jaarlijks, uiterlijk op 1 april, een zo goed mogelijke schatting
      voor het komende jaar ter beschikking gesteld.

      6 Van de gegevens bedoeld in het derde lid, worden wijzigingen ten opzichte van de gegevens, ter beschikking
      gesteld overeenkomstig het vijfde lid, maandelijks, uiterlijk op de vijfde dag van de maand, voor de komende maand
      ter beschikking gesteld.

      7 De gegevens bedoeld in het derde lid, worden dagelijks, uiterlijk om 15:15 uur voor de komende dag ter
      beschikking gesteld en bestaan uit een MW-waarde en Mvar-waarde per kwartier.

      8 Wijzigingen ten opzichte van de overeenkomstig het achtste lid ter beschikking gestelde prognose van de
      hoeveelheid met het net uit te wisselen werkzaam vermogen, worden direct na het bekend worden van die wijziging aan
      de netbeheerder van het landelijk hoogspanningsnet ter beschikking gesteld, in geval van een maximaal met het net
      uit te wisselen werkzaam vermogen:

      a. groter dan 60 MW en kleiner dan 200 MW als de wijziging groter is dan 5% van de maximaal met het net uit te
      wisselen werkzaam vermogen;

      b. groter dan of gelijk aan 200 MW als de wijziging groter is dan 10 MW.

      9 Het eerste tot en met het negende lid is van overeenkomstige toepassing op een beheerder van een gesloten
      distributiesysteem, aangesloten op het landelijk hoogspanningsnet, tenzij anders overeengekomen tussen de
      netbeheerder van het landelijk hoogspanningsnet en de desbetreffende beheerder van een gesloten distributiesysteem.
      De netbeheerder van het landelijk hoogspanningsnet zal een verzoek van een beheerder van een gesloten
      distributiesysteem tot een andere overeenkomst niet op onredelijke gronden weigeren. De overeenkomst wordt
      vastgelegd in de aansluit- en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
