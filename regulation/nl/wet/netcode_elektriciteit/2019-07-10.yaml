        hoofdstuk: '9'
        paragraaf: '9.6'
  - number: '9.19'
    text: |-
      Aangeslotenen, niet zijnde netbeheerders, met een gecontracteerd en beschikbaar gesteld transportvermogen van meer
      dan 60 MW stellen dagelijks het vermogen dat de volgende dag minder kan worden afgenomen, respectievelijk meer of
      minder kan worden geproduceerd, ter beschikking van de netbeheerder van het landelijk hoogspanningsnet door middel
      van:

      a. het aanwijzen van een BSP om biedingen balanceringsenergie in te dienen, of;

      b. het indienen van biedingen die de netbeheerder van het landelijk hoogspanningsnet kan inzetten voor overige
      doeleinden.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.19
  - number: '9.20'
    text: |-
      1 In geval van onbalans tussen vraag en aanbod in Nederland neemt de netbeheerder van het landelijk
      hoogspanningsnet maatregelen om tegengestelde regelacties door buitenlandse instellingen als bedoeld in
      [artikel 16, tweede lid, onderdeel h, van de Elektriciteitswet 1998][ref1], met wie zij dienaangaande een
      onbalansnettingsovereenkomst als bedoeld in artikel 122 van de Verordening (EU) 2017/1485 (GL SO) heeft, te
      voorkomen.

      2 Indien nodig, neemt de netbeheerder van het landelijk hoogspanningsnet vervolgens maatregelen volgens
      onderstaande volgorde:

      a. hij activeert de hem ter beschikking staande middelen, waaronder het in [artikel 9.19][ref2] bedoelde vermogen.

      b. indien hem niet voldoende middelen ter beschikking staan om de n-1-reserve te handhaven is de netbeheerder van
      het landelijk hoogspanningsnet bevoegd reeds toegelaten exporten geheel of gedeeltelijk te annuleren overeenkomstig
      de in [hoofdstuk 12][ref3] vermelde procedure bij onvoorziene fysieke congestie. De netbeheerder van het landelijk
      hoogspanningsnet stelt onverwijld de andere netbeheerders en de BRP’s op de hoogte van de ontstane situatie en de
      genomen of te nemen maatregelen.

      c. indien de in onderdeel a genoemde maatregelen niet tot herstel van de balans leiden en de systeemtoestand
      afwijkt van de normaaltoestand, draagt hij beheerders van hem nog niet ter beschikking gesteld vermogen van
      elektriciteitsproductie-eenheden met een maximumcapaciteit van 5 MW of meer op om dit vermogen op dan wel af
      te (doen) regelen of in dan wel uit bedrijf te (doen) nemen, één en ander met inachtneming van het bepaalde
      in [artikel 9.21][ref4]. De andere netbeheerders en de BRP’s worden door de netbeheerder van het landelijk
      hoogspanningsnet onverwijld bericht dat deze situatie is ontstaan.

      d. indien de in onderdeel a tot en met c genoemde maatregelen niet tot herstel van de balans leiden, schakelt hij
      belasting af dan wel draagt hij een of meer andere netbeheerders op om belasting af te schakelen, een en ander met
      inachtneming van het bepaalde in [artikel 9.22][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
