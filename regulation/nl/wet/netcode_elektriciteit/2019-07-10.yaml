  - number: '2.9'
    text: |-
      Aan een grootverbruikaansluiting waaraan een primair allocatiepunt is toegekend, kent de netbeheerder op verzoek
      van de aangeslotene een of meer secundaire allocatiepunten toe, ongeacht het aantal verbindingen waaruit de
      aansluiting bestaat, ten behoeve van het faciliteren van meerdere overeenkomsten met leveranciers en BRP’s op die
      aansluiting onder voorwaarde dat:

      a. elk allocatiepunt bij een afzonderlijke installatie behoort, die niet elektrisch gekoppeld is of kan worden met
      een andere installatie anders dan via de in onderdeel d bedoelde grens;

      b. de afzonderlijke installaties als bedoeld in onderdeel a zich op dezelfde onroerende zaak bevinden, met
      uitzondering van aansluitingen als bedoeld in [artikel 1, vijfde lid, van de Elektriciteitswet 1998][ref1];

      c. de installatie die bij een secundair allocatiepunt hoort, niet wordt gebruikt ten behoeve van bewoning van een
      ruimte;

      d. op het overdrachtspunt van de aansluiting en op elke grens tussen de afzonderlijke installaties, als bedoeld
      in onderdeel a, en de andere installatie(s) achter de desbetreffende aansluiting, zich een meetinrichting bevindt
      overeenkomstig [artikel 2.12][ref2] en overeenkomstig de voorwaarden voor meetinrichtingen die op grond van de
      [Meetcode elektriciteit][ref3] van toepassing zijn op de desbetreffende aansluiting;

      e. tussen een afzonderlijke installatie als bedoeld in onderdeel a en het overdrachtspunt van de aansluiting op het
      net zich maximaal één andere installatie bevindt;

      f. de locatie van elk van de meetinrichtingen, als bedoeld in onderdeel d, aan de voorwaarden in
      [artikel 2.11][ref4] voldoet;

      g. het primaire deel van de meetinrichtingen, als bedoeld in onderdeel d, die zich niet op het overdrachtspunt van
      de aansluiting bevinden, aan [artikel 2.6.5 van de Meetcode elektriciteit][ref5] voldoet;

      h. voldaan wordt aan [artikel 1.2.3.2 van de Meetcode elektriciteit][ref6];

      i. de meetverantwoordelijke op de desbetreffende aansluiting zorg draagt voor een zodanige bewerking van de
      meetgegevens afkomstig uit de meetinrichtingen, als bedoeld in onderdeel d, dat de meetgegevens per allocatiepunt
      de energie-uitwisseling met het net representeren;

      j. de meetverantwoordelijke op de desbetreffende aansluiting de energieverliezen tussen het overdrachtspunt van
      de aansluiting en de locatie van de meetinrichtingen als bedoeld in onderdeel d, toebedeelt aan het primaire
      allocatiepunt van die aansluiting, tenzij de meetverantwoordelijke op de desbetreffende aansluiting een andere
      verdeling over de allocatiepunten overeenkomt met de aangeslotene;

      k. er sprake is van één aansluit- en transportovereenkomst tussen de aangeslotene en de netbeheerder voor de
      desbetreffende aansluiting, ongeacht het aantal aan die aansluiting toegekende allocatiepunten en ongeacht het
      aantal leveringsovereenkomsten met verschillende leveranciers.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel1
