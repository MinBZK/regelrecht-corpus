  - number: '2.30'
    text: |-
      1 In afwijking van het bepaalde in [artikel 2.12][ref1] hoeft een aangeslotene met een aansluiting met een
      doorlaatwaarde kleiner dan of gelijk aan 3x25A niet te zorgen voor comptabele meting indien:

      a. het een aansluiting betreft van een zogenaamde ‘onbemande’ installatie van een object zonder verblijfsfunctie in
      de openbare ruimte;

      b. het belastingprofiel en het verbruik op de aansluiting:

      1°. van tevoren kan worden bepaald op basis van programmering;

      2°. achteraf kan worden bepaald op basis van geregistreerde schakeltijden;

      3°. kan worden bepaald met behulp van een representatieve set van referentiemetingen, of

      4°. kan worden bepaald op basis van de maximale doorlaatwaarde vermenigvuldigd met 8.760 uur, eventueel
      gecorrigeerd voor schakeltijden.

      2 Ingeval van een aansluiting als bedoeld in het eerste lid zorgt de aangeslotene ervoor dat de netbeheerder altijd
      over de meest actuele informatie beschikt ten aanzien van:

      a. het geïnstalleerde vermogen van de installatie;

      b. de in- en uitschakeltijden van de installatie;

      c. de tijden dat niet het volledige vermogen van de installatie wordt benut en de omvang van het dan ingeschakelde
      vermogen en

      d. voor zover van toepassing, de overige gegevens als bedoeld in
      [bijlage 2 bij de Informatiecode elektriciteit en gas][ref2].

      3 Indien er wijzigingen worden aangebracht in de installatie of apparatuur achter een overdrachtspunt van een
      aansluiting, als bedoeld in het eerste lid, meldt de aangeslotene dit aan de netbeheerder teneinde te kunnen
      beoordelen of continuering van de onbemeten situatie verantwoord is.

      4 Indien de netbeheerder twijfelt aan de juistheid of de volledigheid van de hem overeenkomstig het tweede lid
      verstrekte gegevens of niet in staat blijkt te zijn de hoeveelheid te transporteren elektriciteit overeenkomstig
      het eerste lid, onderdeel b, goed te berekenen, kan hij de aangeslotene opdragen tijdelijk te zorgen voor
      comptabele meting overeenkomstig [artikel 2.12][ref3].

      5 Onverminderd hetgeen bepaald is in de aansluit- en transportovereenkomst is de netbeheerder gerechtigd tijdelijk
      een meetinrichting te plaatsen en metingen te (laten) verrichten indien de aangeslotene aan de opdracht als bedoeld
      in het vierde lid geen gehoor geeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.12
      [ref2]: https://wetten.overheid.nl/BWBR0037934
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.12
