  - number: '3.4'
    text: Elektriciteitsproductie-eenheden kleiner dan 800 W voldoen aan de in deze paragraaf gestelde voorwaarden.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel3.4
  - number: '3.5'
    text: Het parallel schakelen van de elektriciteitsproductie-eenheid dient automatisch te verlopen.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel3.5
  - number: '3.6'
    text: |-
      In afwijking van het bepaalde in [artikel 2.27][ref1] mag de arbeidsfactor in het overdrachtspunt van een
      aansluiting waarachter zich een elektriciteitsproductie-eenheid bevindt, liggen tussen 0,9 capacitief en 0,9
      inductief.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel3.6
