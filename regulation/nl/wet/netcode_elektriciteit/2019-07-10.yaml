  - number: '9.1'
    text: |-
      1 Verbruikers en producenten met een gecontracteerd en beschikbaar gesteld transportvermogen van meer dan 60 MW
      zijn verplicht om tegen vooraf met de netbeheerder overeengekomen voorwaarden een bijdrage te leveren aan het
      oplossen van fysieke congestie.

      2 Indien er sprake is van een congestiegebied als bedoeld in [artikel 9.5, eerste lid][ref1], kan de netbeheerder
      de grens als genoemd in het eerste lid verlagen.

      3 De in het tweede lid bedoelde verlaging wordt tenminste één maand van te voren bekendgemaakt door middel van
      publicatie op de website van de desbetreffende netbeheerder(s).


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.5
