  - number: '10.7'
    text: |-
      1 De aanvraag om een erkenning als BRP wordt schriftelijk en ondertekend door een bevoegd persoon ingediend bij
      de netbeheerder van het landelijk hoogspanningsnet overeenkomstig een door de netbeheerder van het landelijk
      hoogspanningsnet uit te geven model waarmee de aanvrager zich, na het ontvangen van een erkenning, verbind tot het
      naleven van de in dit hoofdstuk opgenomen voorwaarden voor het uitoefenen van balanceringsverantwoordelijkheid.

      2 De netbeheerder van het landelijk hoogspanningsnet beslist binnen dertig dagen na ontvangst van het
      aanvraagformulier of de aanvrager voor erkenning als BRP in aanmerking kan worden gebracht.

      3 Indien bij de aanvraag niet alle benodigde gegevens zijn verstrekt, wordt de in het tweede lid genoemde termijn
      opgeschort totdat is voldaan aan het verzoek van de netbeheerder van het landelijk hoogspanningsnet om verstrekking
      van de ontbrekende gegevens.

      4 Onverminderd het overigens bij of krachtens de Elektriciteitswet 1998 bepaalde, wordt een erkenning verleend,
      nadat:

      a. de netbeheerder van het landelijk hoogspanningsnet zich ervan heeft vergewist dat de aanvrager beschikt over
      de deskundigheid en over de technische, administratieve en organisatorische faciliteiten die vereist zijn om
      balanceringsverantwoordelijkheid te kunnen uitoefenen, en;

      b. de aanvrager financiële zekerheid heeft gesteld overeenkomstig het bepaalde in [artikel 10.8][ref1].

      5 Wanneer een eerdere erkenning van de aanvrager is ingetrokken, willigt de netbeheerder van het landelijk
      hoogspanningsnet de aanvraag niet in dan nadat hij zich ervan heeft vergewist dat de redenen die tot intrekking
      van de eerdere erkenning hebben geleid niet meer aanwezig zijn en geen grond bestaat voor het vermoeden dat deze
      redenen zich opnieuw zullen voordoen.

      6 De netbeheerder van het landelijk hoogspanningsnet doet een beslissing tot verlening van een erkenning als BRP
      zo spoedig mogelijk in de Staatscourant publiceren, waarbij de naam, het adres en de woonplaats van de BRP worden
      vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.8
