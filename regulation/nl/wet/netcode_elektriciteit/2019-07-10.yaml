    text: |-
      1 Voor risicogebieden geldt: het laagspanningswisselstroomnet overschrijdt niet een aanraakspanning van 25 V of
      wordt bij een optredende fout waarbij de aanraakspanning hoger wordt dan 25 V binnen 5 seconden uitgeschakeld.

      2 Voor gebieden die niet tot de risicogebieden behoren, geldt: het laagspanningswisselstroomnet overschrijdt niet
      een aanraakspanning van 50 V of wordt bij een optredende fout waarbij de aanraakspanning hoger wordt dan 50 V
      binnen 5 seconden uitgeschakeld.

      3 Aan de in het tweede lid genoemde eis wordt voldaan wanneer het laagspanningswisselstroomnet zo is ontworpen
      dat een optredende foutspanning boven 66 V in uiterlijk 5 seconden wordt uitgeschakeld in het geval de
      aardingsvoorziening

      a. aan de aangeslotene ter beschikking wordt gesteld als bedoeld in [artikel 2.32, tweede lid][ref1], of

      b. door de netbeheerder wordt gebruikt voor de elektrische veiligheid van de laagspanningsnetten.

      4 Een netbeheerder kan ook andere maatregelen treffen dan beschreven in het derde lid om te voldoen aan de eis in
      het tweede lid.

      5 De laagspanningsnetten zijn kortsluitvast. Voor aansluitleidingen kan hier van worden afgeweken mits dit niet
      leidt tot veiligheidsrisico’s ten gevolge van een kortsluiting.

      6 De netbeheerder hanteert de eisen genoemd in het eerste tot en met het vijfde lid bij het ontwerp van
      laagspanningsnetten vanaf 1 april 2018.

      7 De netbeheerder hanteert de eisen genoemd in het eerste tot en met het vijfde lid bij de inspectie, de
      bedrijfsvoering en de herinspectie van laagspanningsnetten als bedoeld in het zesde lid.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.32
