  - number: '9.12'
    text: |-
      1 Het netontwerp van het 380/220 kV-net inclusief de hiermee verbonden transformatoren naar de 150/110 kV-netten
      wordt getoetst aan de hand van de volgende criteria:

      a. Bij een volledig in bedrijf zijnd net worden de door de aangeslotenen gewenste invoedingen respectievelijk
      afnamen gerealiseerd onder handhaving van de enkelvoudige storingsreserve;

      b. Bij het voor onderhoud niet beschikbaar zijn van een willekeurig circuit, dan wel een willekeurige
      transformator, dan wel een willekeurige elektriciteitsproductie-eenheid, dan wel een grote verbruiker, worden
      de door de aangeslotenen gewenste invoedingen dan wel afnamen gerealiseerd onder handhaving van de enkelvoudige
      storingsreserve. Hierbij wordt alleen rekening gehouden met de als gevolg van de invoedingen dan wel afnamen
      optredende belastingen tijdens de onderhoudsperiode;

      c. Bij de hoogste belasting en bij het uit bedrijf zijn van een willekeurig circuit, dan wel een willekeurige
      transformator, dan wel twee willekeurige elektriciteitsproductie-eenheden, dan wel een grote verbruiker, wordt
      door een aangepaste productieverdeling of door andere (vooraf overeengekomen) maatregelen de enkelvoudige
      storingsreserve gewaarborgd.

      2 Het netontwerp van hoogspanningsnetten met een spanningsniveau van 110 kV en 150 kV, inclusief de hiermee
      verbonden transformatoren naar netten met een spanningsniveau lager dan 110 kV, wordt getoetst aan de hand van de
      volgende criteria:

      a. Bij een volledig in bedrijf zijnd net worden de door de aangeslotenen gewenste invoedingen dan wel afnamen
      gerealiseerd onder handhaving van de enkelvoudige storingsreserve. Bij een enkelvoudige storing is een onderbreking
      van maximaal 10 minuten met een maximale belasting van 100 MW toegestaan;

      b. Bij het voor onderhoud niet beschikbaar zijn van een willekeurig circuit, dan wel een willekeurige transformator
      dan wel een willekeurige elektriciteitsproductie-eenheid kunnen de door de aangeslotenen gewenste invoedingen
      dan wel afnamen worden gerealiseerd onder handhaving van de enkelvoudige storingsreserve. Hierbij hoeft alleen
      rekening te worden gehouden met de als gevolg van de invoedingen dan wel afnamen optredende belastingen tijdens de
      onderhoudsperiode. Afwijking hiervan is toelaatbaar indien de onderbrekingsduur beperkt blijft tot 6 uur en 100 MW.

      3 Het netontwerp van zowel het 380/220 kV-net als van de 110/150 kV-netten wordt bovendien getoetst aan de hand van
      het volgende criterium: Bij alle belastingstoestanden en bij een volledig in bedrijf zijnd net kan, na uitval van
      een willekeurige elektriciteitsproductie-eenheid, de dan benodigde bedrijfsreserve volledig worden ingezet onder
      handhaving van de enkelvoudige storingsreserve.

      4 Het netontwerp wordt getoetst aan de criteria voor de kwaliteit van de netspanning, zoals gedefinieerd in
      [paragraaf 7.2][ref1].

      5 Bij het voorbereiden en realiseren van investeringen informeren netbeheerders elkaar en werken zij samen,
      teneinde de netten doelmatig en betrouwbaar met elkaar te verbinden.

      6 Netbeheerders van netten aangesloten op netten die beheerd worden door de netbeheerder van het landelijk
      hoogspanningsnet informeren de netbeheerder van het landelijk hoogspanningsnet omtrent de inhoud van het door hen
      opgestelde investeringsplan, als bedoeld in [artikel 21 van de Elektriciteitswet 1998][ref2].


