  - number: '5.9'
    text: |-
      1 Een aangeslotene op een gesloten distributiesysteem, die elektriciteit als bedoeld
      in [artikel 73, eerste lid, van de Elektriciteitswet 1998][ref1] produceert, kan
      bij de netbeheerder in de desbetreffende regio een verzoek indienen als bedoeld in
      [artikel 16, eerste lid, onderdeel h, van de Elektriciteitswet 1998][ref2]. In dat geval is [artikel 2.12][ref3]
      van overeenkomstige toepassing op de aansluiting van deze aangeslotene op het gesloten distributiesysteem en dient
      bij het in artikel 2.12, tweede lid, bedoelde overleg tevens de beheerder van het gesloten distributiesysteem te
      worden betrokken.

      2 Desgevraagd stelt de netbeheerder een EAN-code ter beschikking ter identificatie
      van de in het eerste lid bedoelde elektriciteitsproductie-installatie. De in
      [artikel 16, eerste lid, onderdeel i, van de Elektriciteitswet 1998][ref4] bedoelde uitlezing van de meetinrichting
      kan de desbetreffende aangeslotene door de netbeheerder of door een meetverantwoordelijke laten uitvoeren.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel73
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.12
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel16
