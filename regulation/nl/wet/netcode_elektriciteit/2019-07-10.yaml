  - number: '10.32'
    text: |-
      1 Een BRP is aan de netbeheerder van het landelijk hoogspanningsnet een onmiddellijk opeisbare boete
      van € 1.000,– verschuldigd voor iedere keer dat zij haar energieprogramma niet vóór de daarvoor in
      [artikel 10.11, eerste lid][ref1] en [artikel 10.12][ref2] bepaalde tijdstippen via het in [paragraaf 13.5][ref3]
      bedoelde centrale communicatiesysteem heeft ingediend, te verhogen met € 200,– voor ieder vol uur na die
      tijdstippen waarin indiening van het energieprogramma uitblijft.

      2 Een BRP is aan de netbeheerder van het landelijk hoogspanningsnet een onmiddellijk opeisbare boete van € 1.000,–
      verschuldigd voor iedere keer dat zij een energieprogramma indient dat niet voldoet aan de eis van consistentie als
      bedoeld in [artikel 10.14, eerste lid, onderdeel a][ref4].

      3 Een BRP is aan de netbeheerder van het landelijk hoogspanningsnet een onmiddellijk opeisbare boete van € 1.000,–
      verschuldigd voor iedere keer dat zij een energieprogramma indient dat niet voldoet aan de eis van consistentie als
      bedoeld in [artikel 10.14, eerste lid, onderdeel b][ref5].

      4 In het in het derde lid bedoelde geval is de BRP aan de netbeheerder van het landelijk hoogspanningsnet bovendien
      een onmiddellijk opeisbare additionele boete van € 1.000,– verschuldigd wanneer zij niet uiterlijk om 24:00 uur op
      dezelfde dag een gewijzigd energieprogramma heeft ingediend dat voldoet aan de eis van consistentie.

      5 De in het vierde lid bedoelde additionele boete bedraagt € 4.000,– voor iedere volgende keer dat zich
      binnen hetzelfde kalenderjaar voordoet dat de BRP niet uiterlijk om 24:00 uur op dezelfde dag een gewijzigd
      energieprogramma heeft ingediend.

      6 De in het eerste tot en met vierde lid genoemde boetes worden in voorkomend geval gecumuleerd. De netbeheerder
      van het landelijk hoogspanningsnet restitueert aan de BRP zonder vergoeding van rente de op grond van de in het
      derde tot en met vijfde lid geïnde boetes indien en nadat de BRP ten opzichte van wiens energieprogramma de externe
      inconsistentie bestond schriftelijk jegens de netbeheerder van het landelijk hoogspanningsnet heeft verklaard dat
      de desbetreffende energietransactie(s) door de BRP juist was (waren) verantwoord.


