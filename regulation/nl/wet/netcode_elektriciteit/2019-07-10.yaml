  - number: '10.17'
    text: |-
      1 De netbeheerder gaat voor het samenstellen van de meetgegevens ten behoeve van balanceringsverantwoordelijkheid
      uit van de meetgegevens die hij overeenkomstig [paragraaf 6.2 van de Informatiecode elektriciteit en gas][ref1]
      ontvangen heeft. Daarbij is [artikel 6.3.1.2 van de Informatiecode elektriciteit en gas][ref2] van overeenkomstige
      toepassing.

      2 In afwijking van het eerste lid gaat de netbeheerder voor het samenstellen van de meetgegevens
      ten behoeve van balanceringsverantwoordelijkheid van grootverbruikers die beschikken over een
      profielgrootverbruikmeetinrichting, uit van het verbruiksprofiel dat overeenkomstig de systematiek beschreven in
      [bijlage 1 van de Informatiecode elektriciteit en gas][ref3] is vastgesteld.

      3 In afwijking van het eerste lid gaat de netbeheerder voor het samenstellen van de meetgegevens ten behoeve van
      balanceringsverantwoordelijkheid van grootverbruikers die op grond van [artikel 2.30][ref4] en [2.31][ref5] niet
      beschikken over een meetinrichting, uit van:

      a. het belastingprofiel dat overeenkomstig de systematiek beschreven in
      [bijlage 2 van de Informatiecode elektriciteit en gas][ref6] is vastgesteld voor zover het een installatie voor
      openbare verlichting of een verkeersregelinstallatie betreft;

      b. het verbruiksprofiel dat overeenkomstig de systematiek beschreven in
      [bijlage 1 van de Informatiecode elektriciteit en gas][ref7] is vastgesteld voor zover het een andere installatie
      dan een installatie voor openbare verlichting of een verkeersregelinstallatie betreft.

      4 Op de in het tweede en derde lid bedoelde meetgegevens zijn de [artikelen 6.3.1.1][ref8] en
      [6.3.1.2 van de Informatiecode elektriciteit en gas][ref9] van overeenkomstige toepassing, met dien verstande dat
      in artikel 6.3.1.1 van de Informatiecode elektriciteit en gas in plaats van ‘geregistreerd door meetinrichtingen
      op aansluitingen’ moet worden gelezen ‘bepaald op grond van [artikel 10.17, tweede en derde lid][ref10], voor de
      gezamenlijke aansluitingen per profielcategorie met elk een gecontracteerd transportvermogen kleiner dan 0,1 MW’.

      5 De netbeheerder van het landelijk hoogspanningsnet en de andere netbeheerders leggen de in het eerste tot en met
      derde lid bedoelde meetgegevens met betrekking tot de aansluitingen op hun netten per BRP, per leverancier en per
      profielcategorie per onbalansverrekeningsperiode vast in dagrapporten.

      6 De netbeheerder van het landelijk hoogspanningsnet en de andere netbeheerders, ieder voor het eigen
      net, leggen de in het eerste lid bedoelde meetgegevens met betrekking tot de aansluitingen als bedoeld in
      [artikel 9.11, tweede lid][ref11], per onbalansverrekeningsperiode vast in separate dagrapporten.

      7 De netbeheerder verzamelt ten behoeve van de netbeheerder van het landelijk hoogspanningsnet de hoeveelheid met
      zijn net uitgewisselde energie per onbalansverrekeningsperiode voor iedere BRP.

      8 De netbeheerder verzamelt ten behoeve van iedere BRP de hoeveelheid met zijn net uitgewisselde energie per
      onbalansverrekeningsperiode:

      a. voor de aansluitingen waarvoor de desbetreffende BRP balanceringsverantwoordelijkheid
      draagt en waarvan de allocatiemethode van de aansluiting, bedoeld in
      [2.1.3 onderdeel s, van de Informatiecode elektriciteit en gas][ref12] de waarde ‘telemetrie’ heeft: per
      aansluiting;

      b. voor de aansluitingen waarvoor de desbetreffende BRP balanceringsverantwoordelijkheid
      draagt en waarvan de allocatiemethode van de aansluiting bedoeld in
      [2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref13] de waarde ‘profielallocatie’ heeft: per
      profielcategorie en per leverancier;

      c. voor de aansluitingen waarvoor de desbetreffende BRP balanceringsverantwoordelijkheid
      draagt en waarvan de allocatiemethode van de aansluiting, bedoeld in
      [2.1.3 onderdeel s, van de Informatiecode elektriciteit en gas][ref14] de waarde ‘slimme-meter-allocatie’ heeft:
      per leverancier.

      9 Waar in het tiende tot en met twaalfde lid BRP staat, moet, ten behoeve van congestiemanagement zoals bedoeld in
      [paragraaf 9.2][ref15], ook CG-aangeslotene worden gelezen.

      10 Wanneer de in het zevende en achtste lid bedoelde meetgegevens een voorlopig karakter hebben, wordt
      daarvan bij de verstrekking melding gemaakt. In dat geval worden de definitieve meetgegevens overeenkomstig
      [artikel 10.20][ref16] verwerkt.

      11 Wanneer in het geval, bedoeld in het zevende en achtste lid, een netbeheerder niet in staat is definitieve
      gegevens aan de netbeheerder van het landelijk hoogspanningsnet en de BRP te verstrekken, treft hij met de
      desbetreffende meetverantwoordelijke en de BRP die het aangaat een regeling omtrent de te gebruiken meetgegevens.
      Onverminderd hetgeen uit de aansluit- en transportovereenkomst voortvloeit, worden deze meetgegevens
      geacht definitief te zijn en worden deze aan de desbetreffende BRP en aan de netbeheerder van het landelijk
      hoogspanningsnet verstrekt.

      12 De netbeheerder geeft aan iedere BRP per grootverbruikaansluiting waarvoor de balanceringsverantwoordelijkheid
      bestaat jaarlijks of zoveel vaker als met de aangeslotene overeengekomen de tellerstanden voor de hoeveelheid met
      het net uitgewisselde energie en voor zover van toepassing de daarbij behorende vermenigvuldigingsfactor(en) door.


