  - number: '9.13'
    text: |-
      1 De netbeheerder hanteert voor de bedrijfsvoering van netten van 110 kV en 150 kV de volgende criteria:

      a. Bij een in bedrijf zijnd net worden de door de aangeslotenen gewenste invoedingen dan wel afnamen gerealiseerd
      onder handhaving van de enkelvoudige storingsreserve.

      b. Onverminderd hetgeen ten aanzien van het netontwerp is bepaald in [artikel 9.12, tweede lid][ref1], is afwijking
      van onderdeel a toegestaan voor uitlopers, transformatoren en railsystemen.

      2 De netbeheerder van het landelijk hoogspanningsnet beschouwt de uitval van één 380 kV of 220 kV railsysteem in de
      normale toestand wel als een enkelvoudige storing. Er wordt geen rekening gehouden met de uitval van het laatste in
      een station in bedrijf zijnde railsysteem.

      3 In verband met het bepaalde in het eerste en tweede lid leggen de netbeheerders voor de netkoppelingselementen
      vooraf vast wat aanvaardbaar is met betrekking tot:

      a. het maximale toegestane transport;

      b. de maximale toegestane spanningsafwijking ten opzichte van de nominale spanning;

      c. de maximale toegestane spanningsverandering; en

      d. de tijd waarin na een enkelvoudige storing weer aan de hierboven genoemde criteria dient te worden voldaan

      4 In geval van dreigende grootschalige storingen heeft de netbeheerder van het landelijk hoogspanningsnet voorrang
      boven de overige netbeheerders ten aanzien van het aanspreken van producenten ten behoeve van productieverschuiving
      of andere beschikbare middelen.

      5 De netbeheerders spreken met elkaar af, wie de koppelverbinding sluit.


