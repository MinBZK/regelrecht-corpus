      1 De gegevens als bedoeld in [artikel 13.1 tot en met 13.4][ref1], worden geactualiseerd, overeenkomstig de
      termijnen, te weten:

      a. jaarlijks uiterlijk op 1 april;

      b. uiterlijk ten tijde van de inbedrijfname van een nieuwe of gewijzigde elektriciteitsproductie-eenheid
      of verbruiksinstallatie of van wijziging in de karakteristieken van een elektriciteitsproductie-eenheid of
      verbruiksinstallatie.

      2 De gegevens als bedoeld in [artikel 13.5][ref2] worden geactualiseerd, overeenkomstig de termijnen:

      a. halfjaarlijks, uiterlijk op 1 april en op 1 oktober;

      b. uiterlijk zes maanden voor de inbedrijfname van een nieuw netelement of van een wijziging in de karakteristieken
      van een netelement.

      3 De gegevens als bedoeld in [artikel 13.6][ref3] en [13.7][ref4], worden geactualiseerd:

      a. jaarlijks uiterlijk op 1 april;

      b. uiterlijk zes maanden voor de inbedrijfname van een nieuw netelement of van een wijziging in de karakteristieken
      van een netelement.


