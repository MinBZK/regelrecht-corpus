  - number: '10.24'
    text: |-
      1 Op basis van de volgens [artikel 10.17, zevende lid][ref1], en [10.18, derde lid][ref2], ontvangen gegevens
      vergelijkt de netbeheerder van het landelijk hoogspanningsnet de som van de invoedingen in elk deelnet, waarvan
      het spanningsniveau gelijk is aan of hoger is dan 110 kV, met de som van het verbruik in dat deelnet. Bij een
      geconstateerde afwijking groter dan 1000 kWh per dag wordt een melding gemaakt naar de desbetreffende netbeheerder
      en wordt deze netbeheerder verzocht de gegevens te (doen) corrigeren.

      2 Elk kwartaal zal de netbeheerder van het landelijk hoogspanningsnet de overige netbeheerders berichten over
      de trends in de meetcorrectiefactoren die de netbeheerder van het landelijk hoogspanningsnet op grond van
      [artikel 10.18, tweede lid][ref3], ontvangt.


