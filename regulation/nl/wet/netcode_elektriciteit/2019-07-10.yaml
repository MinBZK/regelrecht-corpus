  - number: '9.23'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet contracteert de initiële FCR-verplichting. Hij doet dit
      overeenkomstig de eisen die aan hem gesteld zijn ten aanzien van het contracteren van energie en vermogen op een
      marktconforme, transparante en non-discriminatoire wijze als volgt:

      a. De netbeheerder van het landelijk hoogspanningsnet zal een gedetailleerde beschrijving van het
      contracteringsmechanisme, de administratieve en technische eisen en regels waaraan voldaan moet worden om deel
      te kunnen nemen alsook de resultaten van het contracteren (inclusief prijsinformatie) via zijn openbare webpagina
      publiek maken. Tevens zal verdere relevante informatie tijdig via deze webpagina beschikbaar worden gemaakt,
      waaronder maar niet beperkt tot tijdschema’s.

      b. De netbeheerder van het landelijk hoogspanningsnet zal een drempelwaarde hanteren voor biedingen van maximaal 1
      MW, waarbij wel verlangd mag worden dat een bieding voor opregelende primaire reactie dient te worden gecombineerd
      met een bieding voor afregelende primaire reactie

      c. De netbeheerder van het landelijk hoogspanningsnet zal minimaal eenmaal per week contracteren waarbij de periode
      waarvoor gecontracteerd wordt niet langer dan een week zal zijn.

      d. Voor winnende aanbiedingen van primaire reactie zal de aangeboden prijs de contractsprijs zijn (pay as bid). Met
      een vooraankondiging van minimaal drie maanden kan de netbeheerder van het landelijk hoogspanningsnet, in het geval
      ontwikkelingen op de internationale markt daar aanleiding toe geven, overstappen op de day-ahead-clearingprijs als
      contract prijs.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.23
  - number: '9.24'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet publiceert op zijn website informatie aangaande het
      onbalansnettingsproces, waaronder:

      a. welke participanten deelnemen in de overeenkomst bedoeld in [artikel 9.20, eerste lid][ref1], en per wanneer zij
      participant zijn;

      b. de actuele omvang van de onbalansnettingvermogensuitwisseling.

      2 De netbeheerder van het landelijk hoogspanningsnet heeft tot taak de energiebalans met het buitenland te bewaken,
      in voorkomend geval te herstellen en verwerft het daarvoor benodigde vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.20
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.24
