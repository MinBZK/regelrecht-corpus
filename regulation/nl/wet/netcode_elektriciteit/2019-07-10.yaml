  - number: '7.6'
    text: |-
      1 Indien uit het in [artikel 7.5, tweede lid][ref1], bedoelde onderzoek blijkt dat er sprake is van één
      onomstotelijk aanwijsbare oorzaak van de spanningsdips in een net of een elektrische installatie, worden de
      kosten van het onderzoek in rekening gebracht bij de beheerder van het desbetreffende net of van de desbetreffende
      elektrische installatie, tenzij dat disproportioneel is.

      2 In overige gevallen komen de kosten van het in [artikel 7.5, tweede lid][ref2], bedoelde onderzoek voor rekening
      van de netbeheerder.

      3 De resultaten van het in [artikel 7.5, tweede lid][ref3], bedoelde onderzoek worden openbaar gemaakt, behoudens
      informatie die tot een individuele aansluiting herleidbaar is.

      4 Ten behoeve van het in [artikel 7.5, tweede lid][ref4], bedoelde onderzoek naar spanningsdips zullen alle
      desbetreffende aangeslotenen meewerken met de netbeheerder om de oorsprong van de spanningsdips te achterhalen en,
      indien technisch mogelijk, zo nodig mogelijkheden bieden om meetapparatuur, spannings- en stroomopnemers voor het
      onderzoek naar de spanningsdips te plaatsen.

      5 Op basis van de resultaten van het in [artikel 7.5][ref5] bedoelde onderzoek zal de netbeheerder maatregelen
      voorstellen die nodig zijn om de in [artikel 7.3, zesde lid][ref6], vermelde criteria te kunnen realiseren. Indien
      uit het in artikel 7.5, tweede lid, bedoelde onderzoek blijkt dat er sprake is geweest van spanningsdips afkomstig
      uit het net of uit een installatie van een aangeslotene, dan (zal)(zullen) de beheerder(s) van het desbetreffende
      net en/of de desbetreffende elektrische installatie(s) maatregelen treffen om deze spanningsdips te reduceren
      tot het niveau zoals aangegeven in artikel 7.3, zesde lid, indien de maatregelen technisch, maatschappelijk en
      economisch verantwoord zijn.


