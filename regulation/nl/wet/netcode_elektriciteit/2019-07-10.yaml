  - number: '3.1'
    text: |-
      De maximumcapaciteitsdrempelwaarde, zoals bedoeld in artikel 5, tweede lid, van de Verordening (EU) 2016/631 (NC
      RfG), bedraagt:

      a. 1 MW voor onderdeel b;

      b. 50 MW voor onderdeel c;

      c. 60 MW voor onderdeel d.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel3.1
  - number: '3.2'
    text: |-
      1 De netbeheerder verstrekt desgevraagd aan een aangeslotene die elektriciteit produceert per
      elektriciteitsproductie-eenheid een EAN-code ter identificatie van de desbetreffende elektriciteitsproductie-
      eenheid en legt deze vast in het register als bedoeld in [paragraaf 13.4][ref1].

      2 Indien er zich achter een aansluiting slechts één elektriciteitsproductie-eenheid bevindt, of, indien er zich
      achter een aansluiting meer dan één elektriciteitsproductie-eenheden bevinden van hetzelfde type, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      ______________________________________, kan, in afwijking van het eerste lid, de in het eerste lid bedoelde EAN-
      code dezelfde zijn als die waarmee op grond van [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref3] de
      desbetreffende aansluiting wordt geïdentificeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk13
      [ref2]: https://wetten.overheid.nl/BWBR0035971#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
