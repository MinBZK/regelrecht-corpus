  - number: '2.8'
    text: |-
      Indien, in afwijking van [artikel 2.6, onderdeel f][ref1], in geval van een grootverbruikaansluiting zich een
      kabeltracé, en eventueel een transformator, bevindt tussen het overdrachtspunt van de aansluiting en de locatie
      van één of meer van de meetinrichtingen, als bedoeld in artikel 2.6, onderdeel d, geldt in aanvulling op artikel
      2.6 dat:

      a. er naast de meetinrichtingen, als bedoeld in [artikel 2.6, onderdeel d][ref2], zich ook op het overdrachtspunt
      van de aansluiting een meetinrichting bevindt overeenkomstig de [Meetcode elektriciteit][ref3];

      b. de meetverantwoordelijke op de desbetreffende aansluiting zorg draagt voor een zodanige correctie van de
      meetgegevens afkomstig uit de meetinrichtingen, als bedoeld in [artikel 2.6, onderdeel d][ref4], dat de aan de
      allocatiepunten toegewezen energie-uitwisseling tezamen de totale energie-uitwisseling op het overdrachtspunt
      representeren;

      c. de meetverantwoordelijke op de desbetreffende aansluiting de energieverliezen tussen het overdrachtspunt van de
      aansluiting en de locatie van de meetinrichtingen bedoeld in [artikel 2.6, onderdeel d][ref5], toebedeelt aan het
      primaire allocatiepunt van die aansluiting, tenzij de meetverantwoordelijke op de desbetreffende aansluiting een
      andere verdeling over de allocatiepunten overeenkomt met de aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.6
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.6
