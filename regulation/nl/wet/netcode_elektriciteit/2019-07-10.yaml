  - number: '5.2'
    text: |-
      1 De netbeheerders bepalen in onderling overleg welke documentatie aan elkaar ter beschikking wordt gesteld.

      2 De netbeheerders bepalen in onderling overleg op welke wijze toegang tot elkaars terrein of installatie geregeld
      wordt.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel5.2
  - number: '5.3'
    text: |-
      1 Op het overdrachtspunt tussen twee netten wordt blindvermogen gemeten, tenzij de betrokken netbeheerders na
      onderling overleg anders overeenkomen.

      2 Indien de gekoppelde netten van verschillend spanningsniveau zijn, wordt het blindvermogen gemeten aan de
      laagspanningzijde van de transformator.

      3 Op het overdrachtspunt van twee netten van verschillend spanningsniveau is het transformatorveld voorzien van
      een bedrijfsmeting.

      4 De vereiste nauwkeurigheid van de in het eerste en derde lid bedoelde metingen is klasse 0,5 tenzij anders door
      de netbeheerders is overeengekomen. De nauwkeurigheid heeft betrekking op de primaire meetwaarde. De metingen van
      het werkzame vermogen en het blindvermogen zijn uitgevoerd met een vierleider meetsysteem met ongelijk belaste
      fase.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel5.3
  - number: '5.4'
    text: |-
      1 In geval van een aansluiting van een net op een ander net, stellen de netbeheerders na onderling overleg de toe
      te passen beveiligingsconcepten vast.

      2 Het beveiligingsconcept van de transformator wordt bepaald door de beheerder van de transformator. De
      netbeheerders stellen elkaar de uitschakelcommando’s voor het uitschakelen van de vermogenschakelaars aan
      weerszijden van de transformator ter beschikking. De voor het overbrengen van deze commando’s benodigde
      verbindingen met toebehoren zijn eigendom van de eigenaar van de transformator.

      3 Instellingen van de beveiligingen, het type beveiliging en de inschakelvoorwaarden worden in de aansluit- en
      transportovereenkomst vastgelegd.

      4 De behandeling van het sterpunt en de eventuele regeling van de blusspoelinstelling wordt door de betrokken
      netbeheerders in onderling overleg bepaald.

      5 Ter voorkoming van schade ten gevolge van bedieningsfouten worden elektrische of mechanische vergrendelingen
      tussen scheiders en aarders en de vermogensschakelaars aangebracht.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel5.4
  - number: '5.5'
    text: |-
      In afwijking van de begripsomschrijving van ‘overdrachtspunt’ in de [Begrippencode elektriciteit][ref1], bevindt
      het overdrachtspunt van de aansluiting van het net op zee op het landelijk hoogspanningsnet zich aan de railzijde
      van de railscheider(s) van het desbetreffende afgaande veld in het station van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel5.5
