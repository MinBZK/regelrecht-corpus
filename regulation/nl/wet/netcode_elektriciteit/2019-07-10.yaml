  - number: '9.14'
    text: |-
      1 De regionale netbeheerder bepaalt de instelling van de helling en de referentiewaarde van de automatische
      spanningsregeling van de elektriciteitsproductie-eenheid.

      2 Indien een elektriciteitsproductie-eenheid niet bijdraagt aan de blindvermogenshuishouding in de normale toestand
      moet, de referentiewaarde binnen 15 minuten na constatering van een afwijking naar een uitwisseling van 0 Mvar
      worden teruggebracht, tenzij anders is overeengekomen.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.14
  - number: '9.15'
    text: |-
      1 De netbeheerder is verantwoordelijk voor de spannings- en blindvermogenshuishouding in het eigen net.

      2 Het blindvermogensbereik op het samenstel van alle aan de aansluiting tussen twee netten gerelateerde
      overdrachtspunten op één locatie (dat wil zeggen: per onderstation) is als volgt gespecificeerd:

      a. regionale netten importeren uit het bovenliggende net maximaal 48% van de grootste waarde van de maximale
      import- en exportcapaciteit;

      b. bij import of export van werkzaam vermogen van meer dan 25% van de importcapaciteit exporteren zij naar het
      bovenliggende net niet meer dan 10% van de grootste waarde van de maximale import- en exportcapaciteit.

      3 Op grond van het tweede lid komt het blindvermogensbereik overeen met het groene gebied in onderstaand P/Q-
      diagram.

      4 Bij import of export van werkzaam vermogen van niet meer dan 25% van de maximale importcapaciteit is het
      toegestaan dat regionale netten maximaal 10% van de grootste waarde van de maximale import- en exportcapaciteit
      exporteren naar het bovenliggende net indien dit geen aantoonbare knelpunten veroorzaakt in een van beide netten;
      in geval van aantoonbare hinder treden beide netbeheerders met elkaar in overleg en stellen een gezamenlijke
      analyse op met als doel maatregelen vast te stellen waarmee voldaan kan worden aan het gespecificeerde
      blindvermogensbereik.

      5 Indien het blindvermogensbereik niet voldoet aan het tweede en vierde lid, voeren de betrokken netbeheerders
      achtereenvolgens de volgende stappen uit:

      a. zij stellen vast of één van beide netbeheerders knelpunten constateert met betrekking tot bijvoorbeeld
      spanningseisen of blindvermogenshuishouding;

      b. indien knelpunten zijn geconstateerd, worden in beide betrokken netten de reeds aanwezige stationaire
      blindvermogenscompensatiemiddelen ingezet met als doel te voldoen aan het gespecificeerde blindvermogensbereik;

      c. indien de inzet van de reeds aanwezige stationaire blindvermogenscompensatiemiddelen onvoldoende is om aan het
      gespecificeerde blindvermogensbereik te voldoen, verzoeken beide betrokken netbeheerders de producenten waarmee zij
      een overeenkomst tot levering of opname van blindvermogen hebben, om blindvermogen te compenseren met als doel te
      voldoen aan het gespecificeerde blindvermogensbereik;

      d. Indien door toepassing van de in onderdeel b of c bedoelde maatregelen de knelpunten onvoldoende kunnen
      worden weggenomen, voeren de betrokken netbeheerders een gezamenlijke analyse uit die, met inachtneming
      van [artikel 2 van de Samenwerkingscode elektriciteit][ref1], leidt tot het voldoen aan het gespecificeerde
      blindvermogensbereik door middel van:

      1°. aanvullende overeenkomsten met producenten tot levering of opname van blindvermogen;

      2°. investering in nieuwe stationaire blindvermogenscompensatiemiddelen; of

      3°. investering in netverzwaring

      6 Een overeengekomen afwijking van het in het tweede en vierde lid gespecificeerde blindvermogensbereik wordt
      vastgelegd in de aansluit- en transportovereenkomst.

      7 De netbeheerder van het landelijk hoogspanningsnet coördineert de regeling van de trapstanden van de
      transformatoren van netten met een spanningsniveau groter dan of gelijk aan 110 kV naar netten met een
      spanningsniveau kleiner dan 110 kV.

      8 Het in het eerste tot en met zevende lid bepaalde is tevens van toepassing op gesloten distributiesystemen
      aangesloten op hoogspanningsniveau. In deze leden dient dan in plaats van ‘de netbeheerders’ gelezen te worden ‘de
      beheerder van het gesloten distributiesysteem en de netbeheerder’.


      [ref1]: https://wetten.overheid.nl/BWBR0037937#Artikel2
