  - number: '5.7'
    text: |-
      In aanvulling op de voorwaarden in [paragraaf 5.1][ref1] gelden voor een aansluiting van een gesloten
      distributiesysteem op een net de voorwaarden van deze paragraaf voor zover van toepassing op het spanningsniveau
      waarop het gesloten distributiesysteem aangesloten is op het net van de netbeheerder. In paragraaf 5.1 dient
      dan in plaats van ‘de netbeheerders’ gelezen te worden ‘de beheerder van het gesloten distributiesysteem en de
      netbeheerder’.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel5.7
