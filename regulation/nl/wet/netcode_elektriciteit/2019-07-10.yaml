        artikel: '9.11'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: '9.11'
    text: |-
      1 Mede op basis van de transportprognoses zoals genoemd in [artikel 13.11, achtste en negende lid][ref1],
      [13.12, zevende en achtste lid][ref2], [13.13, zesde en zevende lid][ref3], [13.14, zesde en zevende lid][ref4],
      [13.15, achtste en negende lid][ref5] en [13.17, zevende en achtste lid][ref6], bepaalt de netbeheerder dagelijks
      of de enkelvoudige storingsreserve tijdens de verwachte periode met fysieke congestie in het congestiegebied
      kan worden gehandhaafd voor elke onbalansverrekeningsperiode. De netbeheerder publiceert elke dag uiterlijk om
      14:00 uur op de dag voor de dag van de verwachte structurele congestie voor welke onbalansverrekeningsperiodes
      congestiemanagement nodig is.

      2 Vanaf de dag voorafgaand aan de dag met verwachte fysieke congestie stellen de aangeslotenen als bedoeld in
      [artikel 9.7, eerste en tweede lid][ref7], door middel van biedingen vermogen ter beschikking aan de netbeheerder
      dat de volgende dag meer of minder kan worden geproduceerd dan wel worden verbruikt. Deze biedingen worden
      uiterlijk 16:00 uur op de dag voor de dag van de verwachte structurele congestie bij de netbeheerder ingediend en
      bevatten de duur, omvang en prijs van het ter beschikking gestelde vermogen.

      3 Er moet een bieding als bedoeld in het tweede lid worden gedaan per tijdseenheid. Daarnaast mogen de biedingen
      als bedoeld in het tweede lid ook in de vorm van blokbiedingen worden gedaan. Onder een blokbieding wordt verstaan
      een set van biedingen die op aangeven van de desbetreffende bieder zodanig met elkaar verbonden zijn dat ze hetzij
      allemaal worden geaccepteerd, hetzij allemaal worden afgewezen.

      4 De netbeheerder lost de verwachte fysieke congestie op met behulp van het hem overeenkomstig het tweede en derde
      lid ter beschikking gestelde vermogen.

      5 Aangeslotenen waarvan de bieding overeenkomstig het vierde lid is afgeroepen (hierna: CG-aangeslotene) ontvangen
      uiterlijk 17:00 uur op de dag voor de dag van de verwachte structurele congestie hiervan bericht. Zowel de
      transportprognose als het bijbehorende energieprogramma van de CG-aangeslotene in het congestiegebied worden voor
      de afgeroepen hoeveelheid vermogen aangepast.

      6 Biedingen die niet zijn afgeroepen blijven afroepbaar tot de tijdseenheid waar de bieding betrekking op heeft.
      Biedingen die niet zijn afgeroepen kunnen tot 1 uur voor het moment waarop ze betrekking hebben worden gewijzigd.

      7 Ter handhaving van de balans roept de netbeheerder van het landelijk hoogspanningsnet vervolgens per
      onbalansverrekeningsperiode een gelijke hoeveelheid vermogen af buiten het congestiegebied. Hij gebruikt daarvoor
      het vermogen dat hem overeenkomstig [artikel 9.19][ref8] ter beschikking is gesteld.

      8 Indien de CG-aangeslotene als bedoeld in het vijfde lid afwijkt van zijn transportprognose op een wijze
      die opnieuw tot structurele congestie zou kunnen leiden dan wordt het verschil tussen de transportprognose
      van die CG-aangeslotene en de daadwerkelijk uitgewisselde energie op de desbetreffende aansluiting per
      onbalansverrekeningsperiode verrekend met de netbeheerder van het landelijk hoogspanningsnet tegen een prijs per
      kWh, hierna te noemen de congestie-onbalansprijs.

      9 Indien een situatie als bedoeld in het achtste lid zich voordoet en de desbetreffende te verrekenen hoeveelheid
      heeft het karakter van:

      a. het invoeden van energie, dan betaalt de CG-aangeslotene een congestie-onbalansprijs waarvan de hoogte gelijk
      is aan de voor de desbetreffende onbalansverrekeningsperiode geldende landelijke onbalansprijs voor onbalans met
      het karakter invoeden. De CG-aangeslotene betaalt deze congestie-onbalansprijs aan de netbeheerder. Indien de voor
      de desbetreffende onbalansverrekeningsperiode geldende landelijke onbalansprijs voor onbalans met het karakter
      invoeden negatief is, dan bedraagt de congestie-onbalansprijs € 0,00;

      b. het afnemen van energie, dan betaalt de CG-aangeslotene een congestie-onbalansprijs waarvan de hoogte gelijk
      is aan de voor de desbetreffende onbalansverrekeningsperiode landelijke onbalansprijs voor onbalans met het
      karakter afnemen dan wel de geldende day-ahead-clearingprijs indien deze hoger is. De CG-aangeslotene betaalt deze
      congestie-onbalansprijs aan de netbeheerder;

      c. het afnemen van energie en indien de fallback procedure is toegepast als bedoeld in [artikel 12.16][ref9] of als
      bedoeld in artikel 44 van de Verordening (EU) 2015/1222 (GL CACM), dan betaalt de CG-aangeslotene een congestie-
      onbalansprijs waarvan de hoogte gelijk is aan de voor de desbetreffende onbalansverrekeningsperiode landelijke
      onbalansprijs voor onbalans met het karakter afnemen dan wel de geldende referentie biedzone prijs indien deze
      hoger is. De CG-aangeslotene betaalt deze congestie-onbalansprijs aan de netbeheerder.

      10 De netbeheerder publiceert de dag nadat toepassing van congestiemanagement nodig was per
      onbalansverrekeningsperiode het totaal afgeroepen vermogen overeenkomstig het vijfde lid: een overzicht van
      de transporten van en naar het congestiegebied, het totaal van de ingediende transportprognoses, inclusief
      het deel daarvan dat tot overschrijding van de enkelvoudige storingsreserve leidt, en de gerealiseerde
      transporten, alsmede een overzicht van het ter beschikking gestelde vermogen als bedoeld in [artikel 9.19][ref10]
      en [9.11, vierde lid][ref11], het aantal aangeslotenen dat een bieding heeft gedaan, de mate waarin
      [artikel 9.7, tweede lid][ref12], is toegepast en de resulterende prijzen voor zowel het op- als het afregelen,
      op zijn website. De netbeheerder van het landelijk hoogspanningsnet publiceert de hiervoor bedoelde informatie
      eveneens op zijn website.

      11 De netbeheerder verzorgt de administratieve afhandeling met zijn aangeslotenen in het congestiegebied,
      waaronder begrepen de financiële afrekening van met de desbetreffende aangeslotenen op basis van de biedingen
      zoals genoemd in het tweede lid en de verrekening als bedoeld in het achtste lid. De netbeheerder van het landelijk
      hoogspanningsnet verzorgt de betaling van de afgeroepen hoeveelheden vermogen ten behoeve van de opregelactie
      buiten het congestiegebied die in het kader van congestiemanagement zijn ingezet. De netbeheerders dragen onderling
      zorg voor een correcte financiële afwikkeling tussen de netbeheerders.

      12 De betrokken netbeheerders kunnen de grens zoals opgenomen in [artikel 13.11, negende lid][ref13],
      [13.12, achtste lid][ref14], [13.13, zevende lid][ref15] en [13.14, zevende lid][ref16], met betrekking tot de
      indiening van transportprognoses aanpassen in het congestiegebied. De betrokken netbeheerders dienen aanpassing van
      voornoemde grens te onderbouwen.


