        artikel: '9.6'
        hoofdstuk: '9'
        paragraaf: '9.2'
  - number: '9.9'
    text: |-
      De regeling als bedoeld in [artikel 9.7, tweede lid][ref1], en in de [artikelen 9.10][ref2] en [9.11][ref3] is niet
      van toepassing op:

      a. aangeslotenen met elektriciteitsproductie-eenheden die uitsluitend gebruik maken van één of meer niet-regelbare
      energiebronnen, of,

      b. aangeslotenen met elektriciteitsproductie-eenheden die zijn geïntegreerd in een industrieel productieproces, met
      dien verstande dat het afgegeven vermogen niet kan worden gewijzigd zonder verstoring van het productieproces

      c. verbruikers met installaties waarbij het substantieel en ongepland wijzigen van het opgenomen vermogen direct
      van invloed is op het functioneren van openbare voorzieningen, zoals openbaar vervoer en aardgasproductie en
      -transport.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.7
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.10
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel9.11
