        artikel: '7.2'
        hoofdstuk: '7'
        paragraaf: '7.1'
  - number: '2.26'
    text: |-
      Indien een aansluiting waarvoor een verzoek wordt gedaan als bedoeld in de [artikelen 2.5][ref1], [2.6][ref2] of
      [2.9 ][ref3]een doorlaatwaarde heeft groter dan 3x80A en een gecontracteerd vermogen kleiner dan of gelijk aan 0,1
      MW, beschikt de desbetreffende aansluiting, in afwijking van [artikel 2.4.2 van de Meetcode elektriciteit][ref4],
      over een telemetriegrootverbruikmeetinrichting.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.6
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.9
      [ref4]: https://wetten.overheid.nl/BWBR0037946#Artikel2.4.2
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.26
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2.5'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref2
        bwb_id: BWBR0037940
        artikel: '2.6'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref3
        bwb_id: BWBR0037940
        artikel: '2.9'
        hoofdstuk: '2'
        paragraaf: '2.1'
      - id: ref4
        bwb_id: BWBR0037946
        artikel: 2.4.2
  - number: '2.27'
    text: |-
      Indien de aangeslotene geen nadere contractuele afspraken heeft gemaakt met de netbeheerder daaromtrent, varieert
      de arbeidsfactor in het overdrachtspunt tussen 0,85 (inductief) en 1,0, tenzij sprake is van kortstondige
      afwijkingen en van perioden met zeer lage belasting.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.27
  - number: '2.28'
    text: |-
      De aangeslotene toont aan dat bij machines, toestellen, materialen en onderdelen in elektrische installaties of
      aangesloten op elektrische installaties waarvan de elektromagnetische comptabiliteit niet is vastgelegd in een
      wettelijke regeling, op het netaansluitpunt wordt voldaan aan de voorschriften ter zake van elektromagnetische
      compatibiliteit die door de netbeheerder zijn vastgesteld.

      a. Voor apparatuur met een vermogen groter dan 11 kVA zijn de ‘Richtlijnen voor toelaatbare harmonische stromen
      geproduceerd door apparatuur met een vermogen groter dan 11 kVA’ d.d. juni 1997 uitgegeven door EnergieNed van
      toepassing.

      b. Voor de aansluiting van éénfasige tractievoedingen op hoogspanningsnetten is de ‘Richtlijn voor harmonische
      stromen en netspanningsasymmetrie bij éénfasige 25 kV-voedingen’ d.d. maart 1999, uitgegeven door EnergieNed van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel2.28
  - number: '2.29'
    text: |-
      In aanvulling op de voorwaarden in de [paragrafen 2.1][ref1], [2.2][ref2] en [2.3][ref3] gelden voor aansluitingen
      op een wisselstroomnet met een spanningsniveau kleiner dan of gelijk aan 1 kV de voorwaarden van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
