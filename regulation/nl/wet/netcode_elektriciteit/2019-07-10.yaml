      1 De netbeheerder van het landelijk hoogspanningsnet reserveert op de landsgrensoverschrijdende verbindingen de
      overeenkomstig [artikel 12.21][ref1] berekende capaciteit voor noodzakelijk transport van elektriciteit in het
      kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de integriteit van de netten.

      2 De netbeheerder van het landelijk hoogspanningsnet maakt jaarlijks voor 15 november de grootte van de in het
      eerste lid genoemde reservering voor het volgende kalenderjaar op uurbasis openbaar.

      3 De netbeheerder van het landelijk hoogspanningsnet maakt ten hoogste één dag voor de in [artikel 12.6][ref2]
      genoemde dag waarop de day-aheadcapaciteit wordt bekendgemaakt opnieuw een zo nauwkeurig mogelijke op basis
      van [artikel 12.21][ref3] berekende waarde voor de capaciteit voor noodzakelijk transport van elektriciteit in
      het kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de integriteit van de netten op
      uurbasis openbaar.


