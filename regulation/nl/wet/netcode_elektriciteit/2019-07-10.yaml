  - number: '13.3'
    text: |-
      1 Een aangeslotene die beschikt over een verbruiksinstallatie aangesloten op het landelijk hoogspanningsnet
      verstrekt de netbeheerder van het landelijk hoogspanningsnet de structurele gegevens van die verbruiksinstallatie,
      te weten:

      a. het maximaal af te nemen werkzaam vermogen;

      b. het maximaal af te nemen of in te voeden blindvermogen;

      c. indien actieve blindvermogenscompensatiemiddelen deel uitmaken van de verbruiksinstallatie de karakteristieken
      van de regeling daarvan;

      d. de gegevens van de transformatoren direct gekoppeld aan het overdrachtspunt van de aansluiting van de
      verbruiksinstallatie, te weten:

      1°. het nominale schijnbare vermogen;

      2°. de nominale spanning aan de primaire zijde;

      3°. de nominale spanning aan de secundaire zijde;

      4°. de nominale kortsluitspanning;

      5°. de nominale koper- of kortsluitverliezen;

      6°. de nominale ijzer- of nullastverliezen;

      7°. de schakelgroep van de wikkelingen;

      8°. de sterpuntsbehandeling, te weten zwevend, hard geaard, geaard via impedantie;

      9°. indien van toepassing de gegevens aangaande de regelschakelaar, te weten de hoogste trap, de laagste trap, de
      stapgrootte, de regelbaarheid, namelijk continu regelbaar (online) of spanningsloos instelbaar (offline);

      e. de kortsluitbijdrage.

      2 Indien de verbruiksinstallatie, als bedoeld in het eerste lid, een of meer verbruikseenheden omvat die worden
      gebruikt voor het leveren van vraagsturing, verstrekt de aangeslotene, in aanvulling op het eerste lid, per
      verbruikseenheid onder vermelding van de EAN-code van de verbruikseenheid die deelneemt aan vraagsturing, tevens:

      a. het minimale en maximale werkzame vermogen dat beschikbaar is voor vraagsturing, de bijbehorende tijdsduur en de
      snelheid waarmee dat vermogen inzetbaar is;

      b. het minimale en maximale blindvermogen dat beschikbaar is voor vraagsturing, de bijbehorende tijdsduur en de
      snelheid waarmee dat blindvermogen inzetbaar is.

      3 De structurele gegevens als bedoeld in het eerste en tweede lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter de verbruiksinstallatie zich bevindt;

      b. de EAN-code van het overdrachtspunt waarachter de verbruiksinstallatie zich bevindt, indien het een aansluiting
      betreft die meer dan één overdrachtspunt heeft, als bedoeld in [artikel 2.4, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
