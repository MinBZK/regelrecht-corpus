  - number: '10.6'
    text: |-
      1 Indien een BRP die door middel van een overeenkomst met een leverancier balanceringsverantwoordelijkheid draagt
      voor een grootverbruikaansluiting die overeenkomst wenst te beëindigen, stelt hij de aangeslotene en de leverancier
      en de netbeheerder die het aangaat tenminste twintig werkdagen voor de beoogde ingangsdatum schriftelijk in kennis.

      2 De in het eerste lid bedoelde in kennis stelling van de aangeslotene vindt plaats bij aangetekende brief en de in
      dat lid bedoelde termijn van twintig werkdagen vangt aan op het moment van ontvangst van deze aangetekende brief.

      3 De aangeslotene laat de beoogde BRP of de leverancier, daartoe bepaaldelijk gemachtigd, tenminste vijf werkdagen
      voor de in het eerste lid bedoelde ingangsdatum de netbeheerder die het aangaat overeenkomstig het proces
      uit [paragraaf 4.5 van de Informatiecode elektriciteit en gas][ref1] melden welke BRP vanaf die datum voor de
      aansluiting balanceringsverantwoordelijkheid draagt.

      4 Indien de aangeslotene of de leverancier, daartoe bepaaldelijk gemachtigd, niet tijdig aan zijn in het derde
      lid bedoelde verplichting voldoet, treedt de in artikel 11.6 genoemde regeling voor de betreffende aansluiting in
      werking. De netbeheerder die het aangaat, verwittigt onverwijld de netbeheerder van het landelijk hoogspanningsnet
      en de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Paragraaf4.5
