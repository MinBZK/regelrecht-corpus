  - number: '13.2'
    text: |-
      1 Een aangeslotene die beschikt over een elektriciteitsproductie-eenheid aangesloten op een distributienet
      verstrekt de netbeheerder de structurele gegevens van die elektriciteitsproductie-eenheid, te weten:

      a. de datum van inbedrijfname;

      b. het spanningsniveau van het overdrachtspunt van de aansluiting, waarachter de elektriciteitsproductie-eenheid
      zich bevindt;

      c. de primaire energiebron;

      d. de maximumcapaciteit.

      2 In aanvulling op het eerste lid verstrekt een aangeslotene, die beschikt over een elektriciteitsproductie-eenheid
      van het type B, C of D de structurele gegevens van die elektriciteitsproductie-eenheid, te weten:

      a. het minimale en maximale af te geven werkzaam vermogen en blindvermogen;

      b. welk type spanningsregeling, als bedoeld in [artikel 3.26, zevende lid][ref1], van toepassing is alsmede de
      plaats in het net waarop de regeling werkzaam is;

      c. de regelcapaciteit voor spanning en blindvermogen;

      d. de belasting ten behoeve van het eigen bedrijf;

      e. de gegevens en modellen van elke opwekkingseenheid die deel uitmaakt van de elektriciteitsproductie-eenheid, die
      nodig zijn voor het uitvoeren van een dynamische simulatie, te weten:

      1°. het type opwekkingseenheid, te weten: synchroon, asynchroon, omvormer-gekoppeld of, in geval van een
      windturbine, of sprake is van een dubbelgevoede inductiemachine of direct drive;

      2°. het nominale vermogen;

      3°. in geval van een zonnepark: in plaats van het in subonderdeel 2° genoemde nominale vermogen per
      opwekkingseenheid het totale vermogen van alle zonnepanelen van de elektriciteitsproductie-installatie en het
      totale vermogen van de omvormers van de elektriciteitsproductie-installatie;

      4°. de nominale spanning van de opwekkingseenheid;

      5°. de nominale arbeidsfactor;

      6°. de transiënte impedantie(s) en bijbehorende tijdconstante(n);

      7°. de subtransiënte impedantie(s) en bijbehorende tijdconstante(n);

      8°. de statorstrooi-impedantie(s);

      9°. in geval van een synchrone opwekkingseenheid de synchrone (langs- en dwars-) impedantie;

      10°. in geval van een synchrone opwekkingseenheid het regelbereik en de tijdconstanten van het
      bekrachtigingscircuit;

      11°. het traagheidsmoment (inclusief dat van de aandrijvende machine);

      12°. de overdrachtsfunctie en de instelparameters van de automatische spanningsregeling;

      13°. de overdrachtsfunctie en de instelparameters van de turbineregeling;

      f. de gegevens ten behoeve van kortsluitberekening, te weten;

      1°. de kortsluitbijdrage van de elektriciteitsproductie-eenheid;

      2°. in geval van een asynchrone of omvormer-gekoppelde opwekkingseenheid de verhouding kortsluitstroom / nominale
      stroom;

      g. de transformatorgegevens voor de elektriciteitsproductie-installatie waar de elektriciteitsproductie-eenheid
      deel van uitmaakt, te weten:

      1°. het nominale schijnbare vermogen;

      2°. de nominale spanning aan de primaire zijde;

      3°. de nominale spanning aan de secundaire zijde;

      4°. de nominale kortsluitspanning;

      5°. de nominale koper- of kortsluitverliezen;

      6°. de nominale ijzer- of nullastverliezen;

      7°. de schakelgroep van de wikkelingen;

      8°. de sterpuntsbehandeling, te weten zwevend, hard geaard, geaard via impedantie;

      9°. indien van toepassing de gegevens aangaande de regelschakelaar, te weten de hoogste trap, de laagste trap, de
      stapgrootte, de regelbaarheid, namelijk continu regelbaar (online) of spanningsloos instelbaar (offline);

      h. indien de elektriciteitsproductie-eenheid een bijdrage levert aan FCR, de FCR-gegevens;

      i. indien de elektriciteitsproductie-eenheid een bijdrage levert aan FRR, de FRR-gegevens;

      j. indien de elektriciteitsproductie-eenheid is aangesloten op een spanningsniveau van 1 kV en hoger de
      beveiligingsgegevens, als bedoeld in [artikel 2.37][ref2];

      k. de geschiktheid van toegang op afstand tot de vermogensschakelaar;

      l. indien het een elektriciteitsproductie-eenheid van het type C of D betreft: de gegevens die nodig zijn voor een
      dynamische simulatie overeenkomstig artikel 15, zesde lid, onderdeel c, van de Verordening (EU) 2016/631 (NC RfG).

      3 De structurele gegevens als bedoeld in het eerste en tweede lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref3],
      waarachter de elektriciteitsproductie-eenheid zich bevindt;

      b. de EAN-code van het desbetreffende overdrachtspunt indien het een aansluiting betreft die meer dan één
      overdrachtspunt heeft, als bedoeld in artikel 2.4, vierde lid;

      c. de EAN-code van de elektriciteitsproductie-eenheid, als bedoeld in [artikel 3.2, eerste lid][ref4].

      4 Het tweede en derde lid is van overeenkomstige toepassing op een aangeslotene die beschikt over een
      elektriciteitsproductie-eenheid die overeenkomstig de criteria van artikel 5 van Verordening (EU) 2016/631 als
      type B, C of D zou worden geclassificeerd maar waarop overeenkomstig artikel 4, eerste lid, van de Verordening (EU)
      2016/631 (NC RfG), de Verordening (EU) 2016/631 (NC RfG) niet van toepassing is.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.26
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.37
      [ref3]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref4]: https://wetten.overheid.nl/BWBR0037940#Artikel3.2
