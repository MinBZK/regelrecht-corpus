  - number: '10.14'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet onthoudt zijn goedkeuring aan een energieprogramma, indien dat
      energieprogramma niet voldoet aan de volgende eisen van consistentie:

      a. dat hetgeen in het intern commercieel handelsprogramma per onbalansverrekeningsperiode omtrent een
      energietransactie is vermeld, strookt met hetgeen omtrent diezelfde transactie is vermeld in het intern commercieel
      handelsprogramma van enige andere BRP;

      b. dat hetgeen in het extern commercieel handelsprogramma per onbalansverrekeningsperiode omtrent een
      landgrensoverschrijdende energietransactie is vermeld, strookt met hetgeen over diezelfde transactie is vermeld in
      het extern commercieel handelsprogramma overeen gekomen met de buitenlandse instelling die op grond van nationale
      wettelijke regels belast is met beheer van het transmissiesysteem aan de andere kant van de landsgrens.

      2 De netbeheerder van het landelijk hoogspanningsnet onthoudt voorts zijn goedkeuring aan een energieprogramma,
      indien dat programma, gelet op de bij de netbeheerder van het landelijk hoogspanningsnet ingediende
      transportprognoses, de verwachting wettigt dat zich transportproblemen op de aankoppelingspunten met het landelijk
      hoogspanningsnet zullen voordoen.

      3 Aanstonds nadat hij van de netbeheerder van het landelijk hoogspanningsnet bericht heeft ontvangen dat
      goedkeuring aan zijn energieprogramma is onthouden, dient de BRP een verbeterd energieprogramma in, dat opnieuw de
      goedkeuring van de netbeheerder van het landelijk hoogspanningsnet behoeft.

      4 Een goedgekeurd energieprogramma gaat in op 0:00 uur van de dag waarop het betrekking heeft.

      5 In het in [artikel 10.13, vijfde lid][ref1], bedoelde geval, of in geval van een aanpassing van het extern
      commercieel handelsprogramma dient een BRP een wijziging op het energieprogramma in die zodanig is dat daardoor het
      evenwicht wordt hersteld dat door aanpassing van het extern commercieel handelsprogramma verloren is gegaan.

      6 In de volgende gevallen leidt een door een BRP ingediende wijziging op een goedgekeurd energieprogramma, dan
      wel door conform de regeling betreffende meer dan één NEMO in een biedzone namens de programmaverantwoordelijke
      ingediende wijziging van de in het goedgekeurde energieprogramma opgenomen extern commercieel handelsprogramma, tot
      goedkeuring daarvan door de netbeheerder van het landelijk hoogspanningsnet:

      a. indien de wijziging een transactie met een andere BRP betreft: hetgeen in de ingediende wijziging per
      onbalansverrekeningsperiode omtrent een energietransactie is vermeld, strookt met hetgeen omtrent diezelfde
      transactie is vermeld in een door enige andere BRP ingediende wijziging op een goedgekeurd energieprogramma;

      b. indien de wijziging de in het goedgekeurde energieprogramma opgenomen extern commercieel handelsprogramma
      betreft: de betreffende netbeheerder van het in het buitenland gelegen deel van de desbetreffende
      landsgrensoverschrijdende verbinding, bevestigt de wijziging.

      7 Wijzigingen op een goedgekeurd energieprogramma kunnen ingediend worden tot uiterlijk 10:00 uur op de dag die
      volgt op de dag waar het energieprogramma betrekking op heeft.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.13
