  - number: '9.2'
    text: |-
      1 De netbeheerders controleren of op basis van de ingediende transportprognoses transportproblemen te verwachten
      zijn. De netbeheerders hanteren daarbij bedrijfsvoeringscriteria voor de veilig toelaatbare transporten.

      2 In geval van koppeling tussen twee distributienetten controleren beide betrokken netbeheerders of er fysieke
      congestie te verwachten is.

      3 Indien in de operationele planning (dagelijkse voorbereiding) door de regionale netbeheerder in zijn net een
      transportprobleem wordt geconstateerd, treft de regionale netbeheerder maatregelen om het transportprobleem op te
      lossen. De regionale netbeheerder hanteert daarbij de volgende procedure:

      a. De regionale netbeheerder bepaalt de te nemen maatregelen en verifieert de effectiviteit van deze maatregelen
      door een (loadflow)analyse uit te voeren op de betrouwbaarheid van het transport van elektriciteit. De regionale
      netbeheerder tracht het transportprobleem tegen laagste kosten op te lossen.

      b. De regionale netbeheerder stemt bij maatregelen die de netten van andere netbeheerders beïnvloeden de
      voorgenomen acties met de desbetreffende netbeheerders af. Indien maatregelen worden gevraagd in een net van een
      andere netbeheerder, dan is daarvoor instemming van de netbeheerder van het desbetreffende net nodig.

      c. De regionale netbeheerder stuurt verzoeken aan de desbetreffende aangeslotenen om meer respectievelijk minder te
      produceren of af te nemen (indien andere maatregelen niet afdoende zijn om het transportprobleem op te heffen) en
      geeft aan waar en hoe lang de gevraagde acties duren.

      d. De regionale netbeheerders maken onderling afspraken over eventuele wederzijdse ondersteuning.

      e. De netbeheerder van het landelijk hoogspanningsnet coördineert indien hij dit noodzakelijk acht uit hoofde
      van zijn wettelijke taak overeenkomstig [artikel 16, tweede lid, van de Elektriciteitswet 1998][ref1], dan wel
      op verzoek van andere relevante netbeheerders de te nemen maatregelen. Hij maakt daarbij gebruik van het in
      [artikel 9.19][ref2] bedoelde vermogen.

      4 Indien na het oplossen van een transportprobleem de mogelijkheid bestaat dat in hetzelfde distributienet opnieuw
      één of meer transportproblemen optreden kan de netbeheerder van dat net restricties opleggen aan marktpartijen.
      De restrictie houdt in dat de netbeheerder, gedurende de tijd waarvoor de restrictie geldt, wijzigingen van
      transportprognoses niet accepteert indien deze leiden tot nieuwe transportproblemen.

      5 In voorkomende gevallen communiceert de regionale netbeheerder over de in het vierde lid genoemde restrictie
      met alle betrokkenen door middel van een bericht via het centrale communicatiesysteem als bedoeld in
      [artikel 13.32, eerste lid][ref3].

      6 Daar waar geen gebruik kan worden gemaakt van het centrale communicatiesysteem als bedoeld in
      [artikel 13.32, eerste lid][ref4], wordt gecommuniceerd door middel van telefoon of e-mail met bevestiging per fax.

      7 In het bericht wordt aangegeven:

      a. de richting waarvoor de restrictie geldt,

      b. de te verwachten tijdsduur van de restrictie,

      c. plaats (netdeel/biedzone(s)).

      8 De in het vierde lid genoemde restrictie wordt met onmiddellijke ingang opgeheven zodra de noodzaak daartoe niet
      meer aanwezig is.

      9 Indien de restrictie opgeheven is wordt dit zo spoedig mogelijk gemeld aan alle betrokkenen met een bericht op
      overeenkomstige wijze als genoemd in het vijfde lid.

      10 Indien in de uitvoering of de actuele bedrijfsvoering een probleem ontstaat, hanteren de regionale netbeheerders
      in principe een zelfde procedure als genoemd in het derde lid.

      11 In geval van dreigende grootschalige storingen is de netbeheerder bevoegd om belasting af te schakelen of om
      opdracht te geven om meer of minder te produceren of om een aangesloten regionale netbeheerder te verplichten de
      transportvraag te verminderen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
