  - number: '3.17'
    text: |-
      1 Indien de netbeheerder eisen stelt aan de extra apparatuur waarmee het werkzaam uitgangsvermogen van een
      elektriciteitsproductie-eenheid op afstand te sturen is, als bedoeld in artikel 14, tweede lid, van de Verordening
      (EU) 2016/631 (NC RfG), maakt hij deze eisen openbaar door publicatie op zijn website.

      2 De parameters voor de fault-ride-through-capaciteit van de synchrone elektriciteitsproductie-eenheid, als bedoeld
      in artikel 14, derde lid, onderdeel a, subonderdeel i en in tabel 3.1 van de Verordening (EU) 2016/631 (NC RfG),
      zijn als volgt:

      a. de spanningsparameters:

      1°. U is 0,05 pu;

      2°. U is 0,70 pu;

      3°. U is U;

      4°. U is 0,85 pu;

      b. de tijdsparameters:

      1°. t is 0,15 s;

      2°. t is t;

      3°. t is t;

      4°. t is 1,5 s.

      3 De parameters voor de fault-ride-through-capaciteit van de power park module, als bedoeld in artikel 14, derde
      lid, onderdeel a, subonderdeel i, en tabel 3.2 van de Verordening (EU) 2016/631 (NC RfG), zijn als volgt:

      a. de spanningsparameters:

      1°. U is 0,05 pu;

      2°. U is U;

      3°. U is U;

      4°. U is 0,85 pu;

      b. de tijdsparameters:

      1°. t is 0,25 s;

      2°. t is t;

      3°. t is t;

      4°. t is 3,0 s.

      4 De condities voor de berekening van het minimum kortsluitvermogen op het overdrachtspunt van een aansluiting
      voorafgaand aan een storing, als bedoeld in artikel 14, derde lid, onderdeel a, subonderdeel iv, van de Verordening
      (EU) 2016/631 (NC RfG), zijn:

      a. dat van het minimum kortsluitvermogen wordt verondersteld dat het de helft van het maximum kortsluitvermogen
      bedraagt;

      b. dat het maximum kortsluitvermogen wordt berekend op basis van de netconfiguratie, waarbij rekening wordt
      gehouden met de kortsluitbijdrage van alle op het desbetreffende net aangesloten elektriciteitsproductie-eenheden
      en met de kortsluitbijdrage van aangrenzende netten.

      5 Het bedrijfspunt van de elektriciteitsproductie-eenheid voor het bepalen van de fault-ride-through, als bedoeld
      in artikel 14, derde lid, onderdeel a, subonderdeel iv, van de Verordening (EU) 2016/631 (NC RfG), is het punt met
      nominaal werkzaam vermogen en een blindvermogensuitwisseling van 0 Mvar op het overdrachtspunt van de aansluiting.

      6 Voor het minimum kortsluitvermogen op het overdrachtspunt van de aansluiting na de storing, als bedoeld in
      artikel 14, derde lid, onderdeel a, subonderdeel iv, van de Verordening (EU) 2016/631 (NC RfG), wordt dezelfde
      waarde genomen als bepaald in het vierde lid voor de situatie voorafgaand aan de storing.

      7 De fault-ride-through-capaciteit in het geval van asymmetrische storingen, als bedoeld in artikel 14, derde
      lid, onderdeel b, van de Verordening (EU) 2016/631 (NC RfG), is identiek aan de fault-ride-through-capaciteit bij
      symmetrische storingen.

      8 De elektriciteitsproductie-eenheid is in staat om na een storing aan het net te koppelen, als bedoeld in artikel
      14, vierde lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG), indien:

      a. de spanning groter is dan of gelijk aan 0,90 pu en kleiner dan of gelijk aan 1,10 pu;

      b. de frequentie groter is dan of gelijk aan 47,5 Hz en kleiner dan of gelijk aan 51,0 Hz indien de koppeling
      handmatig plaatsvindt;

      c. de frequentie groter is dan of gelijk aan 49,9 Hz en kleiner dan of gelijk aan 50,1 Hz indien de koppeling
      automatisch plaatsvindt;

      d. de tijd dat de spanning en de frequentie zich beide gelijktijdig en ononderbroken binnen de in de onderdelen a
      en b genoemde bereiken bevinden tenminste 60 seconden is

      e. de maximum gradiënt van het werkzaam vermogen 20% is van de maximumcapaciteit per minuut.

      9 De tussen de netbeheerder en de aangeslotene overeengekomen functionaliteiten van de besturingssystemen en
      instellingen en de wijzigingen daarop van de verschillende regelapparatuur van de elektriciteitsproductie-eenheid
      die vereist zijn voor de stabiliteit van het landelijk hoogspanningsnet en voor het nemen van noodmaatregelen, als
      bedoeld in artikel 14, vijfde lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG), worden vastgelegd in de
      aansluit- en transportovereenkomst.

      10 Ten aanzien van de beveiliging van de elektriciteitsproductie-eenheid en overige onderdelen van de elektrische
      installatie, als bedoeld in artikel 14, vijfde lid, onderdeel b, subonderdeel i, van de Verordening (EU) 2016/631
      (NC RfG), is [artikel 2.13][ref1] van overeenkomstige toepassing.

      11 Indien de netbeheerder specificaties voorschrijft voor het uitwisselen van informatie tussen de
      elektriciteitsproductie-installatie en de netbeheerder als bedoeld in artikel 14, vijfde lid, onderdeel d,
      subonderdeel i, van de Verordening (EU) 2016/631 (NC RfG), maakt hij deze eisen openbaar door publicatie op zijn
      website.


