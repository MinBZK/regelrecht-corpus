  - number: '13.12'
    text: |-
      1 Een aangeslotene die beschikt over een elektriciteitsproductie-eenheid aangesloten op een distributienet
      verstrekt de netbeheerder de plannings- en prognosegegevens, te weten:

      a. de niet-beschikbaarheidsplanning van de elektriciteitsproductie-eenheid;

      b. de geplande niet-beschikbaarheid van de aansluiting waarachter de elektriciteitsproductie-eenheid zich bevindt;

      c. de test-profielen;

      d. de beperkingen van de beschikbaarheid van het werkzaam vermogen ten opzichte van de maximumcapaciteit;

      e. de prognose van de hoeveelheid op het net in te voeden werkzaam vermogen;

      f. de eventuele beperkingen in de regelcapaciteit voor blindvermogen.

      2 De gegevens als bedoeld in het eerste lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter de elektriciteitsproductie-eenheid zich bevindt;

      b. de EAN-code van de elektriciteitsproductie-eenheid, als bedoeld in [artikel 3.2, eerste lid][ref2].

      3 Van de gegevens bedoeld in het eerste lid, onderdelen a, b, d, e en f, over elektriciteitsproductie-eenheden
      groter dan of gelijk aan 1 MW wordt jaarlijks, desgewenst door zijn BRP, uiterlijk op 1 april, een zo goed
      mogelijke schatting voor de komende tien jaar ter beschikking gesteld, met inachtneming van het volgende:

      a. van tijdens de zichtperiode nieuw in bedrijf te nemen elektriciteitsproductie-eenheden tevens de verwachte datum
      van inbedrijfname;

      b. van tijdens de zichtperiode te amoveren elektriciteitsproductie-eenheden tevens de verwachte datum van
      amovering;

      c. de in het eerste lid, onderdeel d, bedoelde planning, van elektriciteitsproductie-eenheden die zijn aangesloten
      op een spanningsniveau op een net met een spanningsniveau van 10kV-niveau of hoger, in de vorm van het verwachte
      draaiplan in tijdsperioden van minimaal één week, voorzien van een aanduiding hoe de elektriciteitsproductie-
      eenheid zal draaien, zoals:

      1°. basislast;

      2°. middenlast;

      3°. pieklast;

      4°. niet regelbaar vermogen;

      5°. draaiende reserve / regeleenheid;

      6°. stilstaande reserve;

      7°. stilstand.

      4 Van de gegevens bedoeld in het eerste lid, onderdelen a tot en met e, wordt jaarlijks, uiterlijk op 1 april:

      a. voor elektriciteitsproductie-eenheden met een maximumcapaciteit kleiner dan 1 MW, door de BRP’s, op de door de
      netbeheerder vastgestelde verzamelpunten, geaggregeerd, een zo goed mogelijke schatting voor het komende jaar ter
      beschikking gesteld;

      b. voor elektriciteitsproductie-eenheden groter dan of gelijk aan 1 MW, desgewenst door zijn BRP, een zo goed
      mogelijke schatting voor het komende jaar ter beschikking gesteld.

      5 Tenzij anders overeengekomen, maken de gegevens, voor elektriciteitsproductie-eenheden met een maximumcapaciteit
      groter dan of gelijk aan 1 MW, dan wel een hogere door de netbeheerder te bepalen maximumcapaciteit, bedoeld in het
      vierde lid, deel uit van de gegevens in het derde lid.

      6 Van de gegevens bedoeld in het eerste lid, onderdelen a tot en met e, worden wijzigingen ten opzichte van de
      gegevens, ter beschikking gesteld overeenkomstig het vierde lid,

      a. voor elektriciteitsproductie-eenheden met een maximumcapaciteit kleiner dan 1 MW door de BRP’s, op de door de
      netbeheerder vastgestelde verzamelpunten, geaggregeerd, maandelijks, uiterlijk op de vijfde dag van de maand, voor
      de komende maand ter beschikking gesteld;

      b. voor elektriciteitsproductie-eenheden met een maximumcapaciteit groter dan of gelijk aan 1 MW, desgewenst door
      zijn BRP, maandelijks, uiterlijk op de vijfde dag van de maand, voor de komende maand ter beschikking gesteld.

      7 De gegevens bedoeld in het eerste lid, onderdelen a tot en met e, worden dagelijks, uiterlijk om 15:15 uur voor
      de komende dag ter beschikking gesteld en bestaan uit een MW-waarde per kwartier, te weten:

      a. voor elektriciteitsproductie-eenheden met een maximumcapaciteit kleiner dan 1 MW, door de BRP’s, op de door de
      netbeheerder vastgestelde verzamelpunten, geaggregeerd;

      b. voor elektriciteitsproductie-eenheden met een maximumcapaciteit groter dan of gelijk aan 1 MW, desgewenst door
      zijn BRP.

      8 Wijzigingen ten opzichte van de overeenkomstig het zevende lid ter beschikking gestelde prognose van de
      hoeveelheid op het net in te voeden werkzaam vermogen, worden direct na het bekend worden van die wijziging aan de
      netbeheerder ter beschikking gesteld, in geval van een elektriciteitsproductie-eenheid met een maximumcapaciteit:

      a. groter dan 60 MW en kleiner dan 200 MW als de wijziging groter is dan 5% van de maximumcapaciteit;

      b. groter dan of gelijk aan 200 MW als de wijziging groter is dan 10 MW.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
