  - number: '13.32'
    text: |-
      1 Ten behoeve van de gegevensuitwisseling, bedoeld in de [artikelen 10.11 tot en met 10.28][ref1],
      [artikel 13.11, achtste lid en negende lid][ref2], [artikel 13.12, zevende lid en achtste lid][ref3],
      [artikel 13.13 zesde lid en zevende lid][ref4], [artikel 13.14, zesde lid en zevende lid][ref5],
      [artikel 13.15, zesde lid en zevende lid][ref6] en [artikel 13.17, zesde lid en zevende lid][ref7], stellen de
      netbeheerder van het landelijk hoogspanningsnet en de overige netbeheerders in onderling overleg regels vast ten
      aanzien van hetgeen tussen de netbeheerders onderling alsmede tussen hen en BRP’s en voor zover van toepassing
      aangeslotenen geldt omtrent:

      a. berichtspecificaties voor de (elektronische) berichtenuitwisseling;

      b. procedures en specificaties van het te gebruiken centrale communicatiesysteem voor de geautomatiseerde
      berichtenuitwisseling;

      c. communicatieprotocollen voor de dagelijkse informatie-uitwisseling;

      d. specificaties waaraan de energieprogramma’s en daarmee verband houdende berichten voldoen;

      e. specificaties waaraan de transportprognoses voldoen;

      f. het tijdschema waarbinnen het aanleveren en wijzigen van transportprognoses geschiedt.

      2 Het in het eerste lid bedoelde centrale communicatiesysteem wordt beheerd door de netbeheerder van het landelijk
      hoogspanningsnet.

      3 De netbeheerder van het landelijk hoogspanningsnet stelt iedere BRP en voor zover van toepassing de relevante
      aangeslotenen op de hoogte van de in het eerste lid bedoelde regels door toezending daarvan.


