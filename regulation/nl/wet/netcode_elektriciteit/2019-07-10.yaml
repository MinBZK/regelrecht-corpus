  - number: '12.14'
    text: |-
      De resultaten van de impliciete toewijzing worden administratief verwerkt tussen enerzijds de netbeheerder
      van het landelijk hoogspanningsnet en de beheerder van het buitenlandse deel van de desbetreffende
      landsgrensoverschrijdende verbindingen en anderzijds tussen de netbeheerder van het landelijk hoogspanningsnet
      en de day-aheadmarkt. Tevens wordt door de netbeheerder van het landelijk hoogspanningsnet het transport van de
      hoeveelheid elektriciteit administratief verwerkt ten behoeve van de balanshandhaving.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel12.14
  - number: '12.15'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet maakt door middel van een publicatie op haar website de
      werking van de impliciete toewijzing inzichtelijk, waarbij tevens een beschrijving van het algoritme gegeven wordt.

      2 De netbeheerder van het landelijk hoogspanningsnet ziet erop toe dat de volgende gegevens betreffende de
      resultaten van de impliciete toewijzing eenvoudig en kosteloos openbaar toegankelijk zijn op de in dit artikel
      omschreven wijze.

      a. De marktprijzen en verhandelde volumes van de Nederlandse day-aheadmarkt op uurbasis (de publicatie geschiedt
      uiterlijk om 13:30 uur op de dag voorafgaande aan het transport).

      b. De geaggregeerde vraag en aanbod curve van de Nederlandse day-aheadmarkt op uurbasis (de publicatie geschiedt
      uiterlijk twee uren na gate-sluitingstijd van de day-aheadmarkt op de dag voorafgaande aan het transport).

      c. Uiterlijk op de tiende werkdag van de kalendermaand een maandelijkse rapportage over de door de impliciete
      toewijzing gecreëerde sociale welvaart waarbij onderscheid wordt gemaakt tussen het consumentensurplus, het
      producentensurplus en de congestie-ontvangsten en vergelijkingen worden opgenomen tussen de daadwerkelijke situatie
      en een situatie waarin er sprake is van oneindige capaciteit tussen de verschillende day-aheadmarkten.

      d. Indien [artikel 12.13, zevende lid][ref1], wordt toegepast, vindt de publicatie van het gestelde in onderdeel a
      en b uiterlijk om 15:00 uur plaats.

      3 De netbeheerder van het landelijk hoogspanningsnet is ervoor verantwoordelijk dat de volgende gegevens
      betreffende paradoxaal afgewezen blokorders op de Nederlandse markt eenvoudig en kosteloos opvraagbaar zijn bij de
      NEMO's op de in dit artikel omschreven wijze.

      a. Het gemiddeld en het maximum aantal paradoxaal afgewezen blokorders per dag.

      b. Het gemiddelde en het maximale prijsverschil van de paradoxaal afgewezen blokorders per dag (waarbij het
      prijsverschil het verschil is tussen de limietprijs van de blokorder en de gemiddelde day-ahead-clearingprijs over
      de periode van de blokorder).

      c. Het gemiddelde van de dagelijkse maximale prijsverschillen van de paradoxaal afgewezen blokorders.

      d. De gegevens als bedoeld in de voorgaande bepalingen in onderdeel a tot en met c kunnen met terugwerkende kracht
      vanaf 1 januari van het voorgaande jaar worden opgevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel12.13
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel12.15
    references:
