      - id: ref1
        bwb_id: BWBR0037940
        artikel: '9.19'
        hoofdstuk: '9'
        paragraaf: '9.7'
  - number: '10.39'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet activeert en deactiveert biedingen voor regelvermogen
      automatisch om de FRCE binnen de frequentiehersteltijd tot nul te regelen en om de geactiveerde FCR progressief
      te vervangen.

      2 De netbeheerder van het landelijk hoogspanningsnet activeert biedingen voor reservevermogen om geactiveerde
      biedingen regelvermogen beschikbaar te maken in het geval dat het aanbod van biedingen regelvermogen verzadigt.

      3 De netbeheerder van het landelijk hoogspanningsnet activeert een bieding balanceringsenergie door een
      vermogensrichtwaarde uit te sturen aan een BSP. Hierdoor is de netbeheerder van het landelijk hoogspanningsnet
      gehouden tot:

      a. het bepalen van het volume dat de BSP gedurende de betreffende onbalansverrekeningsperiode levert;

      b. het verrekenen van het in onderdeel a bedoelde volume met de BSP;

      c. het aanpassen van de onbalans van de relevante BRP voor de geactiveerde aansluiting(en) of allocatiepunt(en) met
      de onbalansaanpassing, bestaande uit de som van alle aan hem toegerekende volumes bepaald op grond van het zesde
      lid.

      4 De netbeheerder van het landelijk hoogspanningsnet stelt de BSP en de bij de balanceringsenergiebieding
      aangewezen BRP's op de hoogte van activering van de bieding.

      5 Om het volume aan balanceringsenergie dat met de BSP moet worden verrekend te bepalen, stelt de netbeheerder van
      het landelijk hoogspanningsnet per BSP vast hoeveel balanceringsenergie per programmatijdseenheid per richting is
      geactiveerd. Daartoe telt hij het volgende bij elkaar op:

      a. voor een bieding regelvermogen: de som van de tijdens een onbalansverrekeningsperiode aan de BSP toegekende
      vermogensrichtwaardes;

      b. voor een bieding reservevermogen: het door de BSP aangeboden vermogen vermenigvuldigd met de leveringsperiode;

      c. voor noodvermogen: het verschil tussen door de BSP geleverde energie op basis van gemeten 5-minutenwaarden
      gedurende de volledige activeringstijd, leveringsperiode en deactiveringsperiode, en de waarde van de energie die
      BSP uitwisselt op het leveringspunt in de 5-minutenperiode onmiddellijk voorafgaand aan de 5-minutenperiode waarin
      de afroep plaats vindt.

      6 De netbeheerder van het landelijk hoogspanningsnet verrekent het per BSP bepaalde volume aan balanceringsenergie
      per onbalansverrekeningsperiode per richting:

      a. voor opregelen met de prijs voor opregelen;

      b. voor afregelen met de prijs voor afregelen.

      7 Indien er voor een onbalansverrekeningsperiode geen prijs voor opregelen of prijs voor afregelen is
      vastgesteld, verrekent de netbeheerder van het landelijk hoogspanningsnet het per BSP bepaalde volume in die
      onbalansverrekeningsperiode met de prijs voor opregelen, respectievelijk de prijs van afregelen vastgesteld voor de
      voorgaande onbalansverrekeningsperiode.

      8 Indien er tijdens een onbalansverrekeningsperiode noodvermogen voor opregelen is ingezet is de prijs voor ingezet
      noodvermogen:

      a. tijdens de volledige activeringstijd en de leveringsperiode gelijk aan de hoogste biedprijs van het ingezette
      regel- en reservevermogen voor opregelen voor de betreffende onbalansverekeningsperiode vermeerderd met 10% dan wel
      de day-ahead-clearingprijs voor het betreffende klokuur plus € 200 per MWh indien deze hoger is;

      b. tijdens de deactiveringsperiode gelijk aan de inzetprijs voor opregelen voor de betreffende
      onbalansverekeningsperiode dan wel de day-ahead-clearingprijs voor het betreffende klokuur vermeerderd met € 200
      per MWh indien deze hoger is;

      c. minimaal € 200 per MWh.

      9 Indien er tijdens een onbalansverrekeningsperiode noodvermogen voor afregelen is ingezet is de prijs voor ingezet
      noodvermogen:

      a. tijden s de volledige activeringstijd en de leveringsperiode gelijk aan de laagste biedprijs van het ingezette
      regel- en reservevermogen voor afregelen voor de betreffende onbalansverekeningsperiode verminderd met € 100 per
      MWh dan wel de day-ahead-clearingprijs voor het betreffende klokuur verminderd met € 250 per MWh indien deze lager
      is;

      b. tijdens de deactiveringsperiode gelijk aan de inzetprijs voor afregelen voor de betreffende
      onbalansverekeningsperiode dan wel de day-ahead-clearingprijs voor het betreffende klokuur verminderd met € 250 per
      MWh indien deze lager is;

      c. Gelijk aan € 0 per MWh indien de afzonderlijke prijscomponenten in lid a en b beide positief zijn.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel10.39
  - number: '10.40'
    text: |-
      1 Iedere dag stelt de netbeheerder van het landelijk hoogspanningsnet per BSP een overzicht samen van
      diens geactiveerde biedingen met betrekking tot het direct voorafgaande etmaal. Dit overzicht bevat per
      onbalansverrekeningsperiode de volgende gegevens:

      a. de bedrijfs EAN-code van de aangewezen BRP's;

      b. het bepaalde volume aan balanceringsenergie per richting;

      c. de prijs voor opregelen;

      d. de prijs voor afregelen;

      e. het te verrekenen bedrag.

      2 De netbeheerder van het landelijk hoogspanningsnet stuurt het op grond van het eerste lid samengestelde overzicht
      aan de desbetreffende BSP voor 17:00 uur van de eerste werkdag na het etmaal waarop dat overzicht betrekking heeft.

      3 De BSP stuurt iedere woensdag een factuur voor diens geactiveerde biedingen balanceringsenergie van de
      voorafgaande week, lopend van 00:00 uur op zaterdag tot 00:00 uur op de eerstvolgende zaterdag, aan de netbeheerder
      van het landelijk hoogspanningsnet. Deze factuur kan zowel voor een positief als een negatief bedrag zijn, en bevat
      ten minste de volgende gegevens:

      a. bedrijfsnaam BSP;

      b. datum waarop de bieding is geactiveerd;

      c. de bepaalde volumes aan balanceringsenergie per richting per onbalansverrekeningsperiode;

      d. het totaalbedrag.

      4 Indien de netbeheerder van het landelijk hoogspanningsnet akkoord is met de in het derde lid, onderdelen a tot
      en met d, genoemde gegevens, betaalt hij, in het geval van een positief bedrag, het in het derde lid, onderdeel d,
      genoemde totaalbedrag aan de BSP binnen twee weken na ontvangst van de factuur.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel10.40
  - number: '10.41'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet stelt per onbalansverrekeningsperiode een lijst op met
      biedingen balanceringsenergie, gerangschikt in volgorde van hun biedprijzen en publiceert, vanaf het moment dat
      hij zijn goedkeuring heeft verleend aan alle energieprogramma's voor de volgende dag, op deze basis, voor elke
      onbalansverrekeningsperiode van de volgende dag, de verwachte prijs voor opregelen en de verwachte prijs voor
      afregelen in elk van de volgende situaties:

      a. een totaal geactiveerd vermogen van 0 MW;

      b. een totaal geactiveerd vermogen voor opregelen van 100 MW;

      c. een totaal geactiveerd vermogen voor opregelen van 300 MW;

      d. een totaal geactiveerd vermogen voor opregelen van 600 MW;

      e. een totaal geactiveerd vermogen voor afregelen van 100 MW;

      f. een totaal geactiveerd vermogen voor afregelen van 300 MW;

      g. een totaal geactiveerd vermogen voor afregelen van 600 MW;

      h. een totaal geactiveerd vermogen voor opregelen bij activatie van alle biedingen;

      i. een totaal geactiveerd vermogen voor afregelen bij activatie van alle biedingen.

      2 De netbeheerder van het landelijk hoogspanningsnet herziet de in het eerste lid genoemde lijst iedere
      onbalansverrekeningsperiode, en past de in de onderdelen a tot en met i genoemde verwachte prijzen voor opregelen
      en afregelen op deze basis aan.
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel10.41
  - number: '11.1'
    text: |-
      Op het moment dat de erkenning van een BRP wordt ingetrokken, stelt de netbeheerder van het landelijk
      hoogspanningsnet onverwijld de overige netbeheerders, BRP's en de Autoriteit Consument en Markt daarvan in
      kennis. Vanaf dat moment treedt de in [artikel 11.3][ref1] genoemde regeling in werking voor de aansluitingen
      waarvoor de natuurlijke of rechtspersoon die niet meer als BRP in het aansluitingenregister staat vermeld. De
      overige netbeheerders stellen in dat geval de betreffende leveranciers, indien deze bepaaldelijk zijn gemachtigd,
      en de betreffende aangeslotenen voor zover die geen leverancier hebben gemachtigd, onverwijld in kennis over
      de intrekking. Grootverbruikers die wel een leverancier hebben gemachtigd worden in kennis gebracht door de
      gemachtigde leverancier.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel11.3
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel11.1
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '11.3'
        hoofdstuk: '11'
  - number: '11.2'
    text: |-
      1 Indien de netbeheerder van het landelijk hoogspanningsnet voorziet dat een BRP niet langer in staat zal
      zijn, zijn verplichtingen na te komen of voor een BRP de toepassing van de wettelijke schuldsaneringsregeling
      is uitgesproken, surséance van betaling is verleend, respectievelijk faillissement is uitgesproken, pleegt de
      netbeheerder van het landelijk hoogspanningsnet overleg met de Autoriteit Consument en Markt. In dit overleg
      wordt bepaald of en zo ja onder welke voorwaarden de netbeheerder van het landelijk hoogspanningsnet (de curator
      of de bewindvoerder van) de BRP kan respectievelijk moet aanbieden de intrekking van de erkenning als BRP op te
      schorten, en voor zover dat redelijkerwijs noodzakelijk is voor het borgen van de economische stabiliteit van
      het systeem garant te staan voor de kosten van inkoop van de elektriciteit en balancering en eventuele andere
      aan deze opschorting gerelateerde kosten tegen de door de netbeheerder van het landelijk hoogspanningsnet te
      stellen voorwaarden voor de garantstelling tijdens deze tijdelijke voortzetting. Afhankelijk van het resultaat van
      dit overleg treedt de netbeheerder van het landelijk hoogspanningsnet in overleg met de betreffende (curator of
      bewindvoerder van) de BRP en kan hij een aanbod tot het afgeven van een garantie in laatstbedoelde zin doen voor
      ten hoogste tien werkdagen.

      2 Indien en voor zover op grond van dit artikel of van [artikel 11.3][ref1] de balanceringsverantwoordelijkheid van
      groepen aangeslotenen wijzigt als gevolg van de intrekking van de erkenning van de aanvankelijke BRP, verkoop of
      doorstart van de onderneming van de aanvankelijke BRP of anderszins, zorgt de netbeheerder die het aangaat ervoor
      dat de wisseling van balanceringsverantwoordelijkheid binnen één werkdag in het aansluitingenregister is verwerkt.

      3 De netbeheerder van het landelijk hoogspanningsnet neemt de te zijnen laste blijvende kosten, gemaakt ter
      uitvoering van zijn taak bedoeld in het eerste lid, op in zijn tarieven.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel11.3
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel11.2
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '11.3'
        hoofdstuk: '11'
  - number: '11.3'
    text: |-
      1 In de gevallen bedoeld in [artikel 11.1][ref1] wordt de balanceringsverantwoordelijkheid voor de in dat artikel
      bedoelde aansluitingen door de netbeheerder van het landelijk hoogspanningsnet over de andere BRP's als volgt
      verdeeld:

      a. de aansluitingen waarvoor de leverancier, daartoe bepaaldelijk gemachtigd, de balanceringsverantwoordelijkheid
      heeft geregeld en heeft ondergebracht bij een andere rechtspersoon dan hijzelf, zullen worden verdeeld aan de
      BRP die de leverancier onverwijld schriftelijk aan de netbeheerder die het aangaat opgeeft. Deze schriftelijke
      mededeling bevat tevens een bevestiging van die BRP dat hij de balanceringsverantwoordelijkheid op zich neemt;

      b. de aansluitingen van kleinverbruikers waarop de balanceringsverantwoordelijkheid niet is geregeld, zullen worden
      verdeeld naar rato van het aantal aangesloten kleinverbruikers waarvoor een BRP balanceringsverantwoordelijkheid
      draagt. De verdeling zal worden uitgevoerd in tienden van procenten;

      c. de aansluitingen van grootverbruikers die zelf een BRP hebben geregeld, dienen schriftelijk aan de betreffende
      netbeheerder op te geven wie de balanceringsverantwoordelijkheid over gaat nemen. Deze schriftelijke mededeling
      bevat tevens een bevestiging van die BRP dat hij de balanceringsverantwoordelijkheid op zich neemt;

      d. de aansluitingen van grootverbruikers waarvoor de balanceringsverantwoordelijkheid niet tijdig is geregeld,
      zullen worden verdeeld naar rato van het totaal van de gecontracteerde transportvermogens in deze categorie
      waarvoor een BRP balanceringsverantwoordelijkheid draagt. De verdeling zal worden uitgedrukt in tienden van
      procenten. Bij verdeling van grootverbruikers met een gecontracteerd transportvermogen boven de 10 MW of bij
      substantiële hoeveelheden kan de netbeheerder van het landelijk hoogspanningsnet vooraf in contact treden met
      betrokken BRP's ten aanzien van het aanpassen van de verdeling.

      2 De BRP's die op grond van onderdeel b of d van het eerste lid aansluitingen toegewezen hebben gekregen,
      informeren zo spoedig mogelijk, maar uiterlijk binnen drie werkdagen na de verdeling de betrokken aangeslotenen
      respectievelijk hun leverancier, indien deze bepaaldelijk is gemachtigd de balanceringsverantwoordelijkheid
      te regelen, over deze toewijzing, en over de bij hen geldende voorwaarden en de opzeggingsmogelijkheden.
      Grootverbruikers die een leverancier hebben gemachtigd worden in kennis gebracht door de gemachtigde leverancier.

      3 De aangeslotene die voor zijn aansluiting via de in dit artikel bedoelde verdeling een andere BRP heeft gekregen,
      heeft gedurende twee maanden het recht zonder opzegtermijn van BRP te wisselen.

      4 Een BRP die op grond van dit artikel de balanceringsverantwoordelijkheid voor aansluitingen toegewezen heeft
      gekregen, mag de toewijzing niet weigeren, tenzij hij voordat toewijzing plaatsvindt schriftelijk de netbeheerder
      van het landelijk hoogspanningsnet heeft verzocht niet voor deze toewijzing in aanmerking te willen komen en
      daarbij tevens tijdig gezamenlijk met een ontvangende BRP heeft aangegeven dat die ontvangende BRP alsdan zijn
      aandeel overneemt. De verwerkingstermijn van een dergelijk verzoek bedraagt maximaal twee weken. Wel kan deze
      ontvangende BRP met toepassing van [artikel 10.3, eerste lid][ref2], opzeggen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel11.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel10.3
