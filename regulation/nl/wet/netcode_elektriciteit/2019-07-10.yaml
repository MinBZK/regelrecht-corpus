  - number: '9.10'
    text: |-
      De aangeslotene kan de uitvoering van de regeling bedoeld in [artikel 9.11][ref1] overdragen aan zijn BRP of
      leverancier. Indien hij hiervoor kiest doet hij hiervan schriftelijk melding bij de netbeheerder van het landelijk
      hoogspanningsnet en/of, indien van toepassing, bij de netbeheerder van het net waarop hij is aangesloten.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.11
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel9.10
