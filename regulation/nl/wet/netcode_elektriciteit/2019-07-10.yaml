  - number: '7.1'
    text: |-
      1 Transport vindt plaats op grond van een tussen de netbeheerder en de aangeslotene te sluiten aansluit-
      en transportovereenkomst en zal voorts alleen plaatsvinden indien de aangeslotene tevens op grond van
      deze aansluit- en transportovereenkomst recht heeft op een aansluiting en indien bij de netbeheerder
      bekend is welke partijen ten behoeve van de desbetreffende aansluiting, of, indien het een aansluiting
      betreft waaraan secundaire allocatiepunten zijn toegekend, voor alle allocatiepunten van de desbetreffende
      aansluiting, optreden als leverancier, BRP en, indien het een grootverbruikaansluiting betreft,
      meetverantwoordelijke. De respectievelijke identificaties van genoemde partijen legt de netbeheerder op grond
      van de [artikelen 2.1.3 tot en met 2.1.5a van de Informatiecode elektriciteit en gas][ref1] vast in zijn
      aansluitingenregister.

      2 De aangeslotene heeft recht op transport van elektriciteit door heel Nederland tot een hoeveelheid ter grootte
      van het op de aansluiting gecontracteerde en beschikbaar gestelde vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.3
    url: https://wetten.overheid.nl/BWBR0037940/2019-07-10#Artikel7.1
    references:
