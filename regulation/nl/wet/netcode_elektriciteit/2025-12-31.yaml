  - number: '5.10'
    text: |-
      1 De beheerder van een gesloten distributiesysteem faciliteert de aangeslotenen op zijn gesloten distributiesysteem
      vrijwillige biedingen te doen overeenkomstig [artikel 9.1, eerste of tweede lid][ref1].

      2 Indien de beheerder van een gesloten distributiesysteem overeenkomstig [artikel 9.1, derde of vierde lid][ref2],
      of [artikel 9.19][ref3] biedingen moet doen of indien aangeslotenen op een gesloten distributiesysteem gebruik
      willen maken van de mogelijkheid tot vrijwillige biedingen overeenkomstig artikel 9.1, eerste of tweede lid,
      maakt de beheerder van het gesloten distributiesysteem een keuze uit één van de volgende mogelijkheden om dit te
      faciliteren:

      a. de beheerder van het gesloten distributiesysteem wijst een CSP (in geval van biedingen overeenkomstig
      [artikel 9.1, derde of vierde lid][ref4]) of een BSP (in geval van biedingen overeenkomstig [artikel 9.19][ref5])
      aan en deze functioneert als de CSP of BSP als bedoeld in artikel 9.1, derde of vierde lid, of in artikel 9.19
      voor alle deelnemende aangeslotenen op het betreffende gesloten distributiesysteem die hun flexibiliteit via de
      beheerder van het gesloten distributiesysteem ter beschikking stellen aan de netbeheerder of aan de netbeheerder
      van het eventuele bovenliggende net;

      b. de GDS-beheerder draagt er zorg voor dat de op zijn GDS aangesloten derden die flexibiliteit leveren aan de
      netbeheerder of de netbeheerder van het landelijk hoogspanningsnet, dan wel de door die derden aan te wijzen CSP of
      BSP, zelfstandig deel kunnen nemen aan het elektronische berichtenverkeer als bedoeld in [artikel 13.32][ref6].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.1
