  - number: '9.30'
    text: |-
      1 Netbeheerders passen in het betreffende congestiegebied congestiemanagement toe overeenkomstig het in
      [artikel 9.11, eerste lid][ref1], genoemde onderzoek.

      2 Congestiemanagement in een bepaald gebied eindigt op het moment dat er geen sprake meer is van een
      structureel tekort aan beschikbare transportcapaciteit in het desbetreffende gebied zoals aangekondigd in
      [artikel 9.9, eerste lid][ref2].

      3 Het einde van congestiemanagement in een bepaald gebied zal door de netbeheerder ten minste één week voor het
      daadwerkelijke einde worden gepubliceerd via de in [artikel 9.8][ref3] bedoelde website. Deze publicatie bevat ten
      minste de volgende gegevens:

      a. een aanduiding van het desbetreffende congestiegebied;

      b. de datum waarop congestiemanagement niet meer van kracht zal zijn; en

      c. de onderbouwing van de beëindiging van congestiemanagement.

      4 Aangeslotenen en CSP’s waarvan een bieding overeenkomstig [artikel 9.41, vierde lid][ref4], is afgeroepen dan wel
      waarvoor een capaciteitssturing overeenkomstig artikel 9.41, vierde lid, of [artikel 9.45, vijfde lid][ref5], is
      afgeroepen, worden hierna en in de artikelen 10.17 en [10.18][ref6] aangeduid als CG-aangeslotene.

      5 Aangeslotenen in het congestiegebied, die beschikken over een elektriciteitsproductie-eenheid, stellen de
      netbeheerder op de hoogte van de benodigde gegevens om vergoeding voor niet-marktgebaseerde redispatch, als bedoeld
      in [artikel 9.31, tweede lid][ref7], uit te kunnen voeren overeenkomstig artikel 13, zevende lid van [Verordening
      (EU) 2019/943](32843R2019).


