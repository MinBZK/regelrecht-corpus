  - number: '9.9'
    text: |-
      1 De netbeheerder meldt op grond van [artikel 9.6, eerste lid][ref1] of [artikel 9.7, eerste lid][ref2] door middel
      van een vooraankondiging op de in [artikel 9.8][ref3] bedoelde website dat er voor een afgebakend en duidelijk
      gedefinieerd gebied dat geen kritiek netwerkelement omvat overeenkomstig artikel 2(69) van de [Verordening (EU)
      2019/943](32843R2019), sprake kan zijn van een tekort aan beschikbare transportcapaciteit.

      2 Indien de in het eerste lid bedoelde situatie zich voordoet op de deelnetten van gekoppelde netten die door
      verschillende netbeheerders worden beheerd, doen de netbeheerders van die netten gezamenlijk de vooraankondiging
      dat er sprake kan zijn van een tekort aan beschikbare transportcapaciteit. In dat geval dient in de rest van dit
      artikel en in de [artikelen 9.10][ref4] en [9.11][ref5] in plaats van ‘de netbeheerder’ gelezen te worden ‘de
      betrokken netbeheerders’. Voor zover nodig en beschikbaar delen de betrokken netbeheerders onderling de informatie
      verkregen op grond van [paragrafen 13.1][ref6] en [13.2][ref7].

      3 De in het eerste en tweede lid bedoelde vooraankondiging zal ten minste de volgende gegevens bevatten:

      a. het verwachte congestiegebied (geografische aanduiding);

      b. de periode waarin een tekort aan beschikbare transportcapaciteit wordt verwacht in dat gebied;

      c. de oorzaak van het verwachte tekort aan beschikbare transportcapaciteit;

      d. de in het verwachte congestiegebied totale benodigde en totale aanwezige transportcapaciteit;

      e. een planning van de netverzwaring die ten minste de benodigde werkzaamheden en de periode benoemt die resteert
      tot het moment waarop het (de) net(ten) zodanig verzwaard, gewijzigd of uitgebreid is (zijn) dat geen sprake meer
      is van tekort aan beschikbare transportcapaciteit; en

      f. een uitnodiging aan belanghebbenden om met de netbeheerder in overleg te treden over mogelijkheden bij te dragen
      aan het oplossen van het verwachte structureel tekort aan beschikbare transportcapaciteit in het desbetreffende
      gebied.

      4 De netbeheerder zendt een afschrift van de vooraankondiging aan de Autoriteit Consument en Markt.


