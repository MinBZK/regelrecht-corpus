  - number: '14.1'
    text: |-
      1 Op elektriciteitsproductie-eenheden die overeenkomstig de criteria van artikel 5 van Verordening (EU) 2016/631
      als type A zouden worden geclassificeerd maar waarop overeenkomstig artikel 4, eerste lid. van de Verordening (EU)
      2016/631 (NC RfG), de Verordening (EU) 2016/631 (NC RfG) niet van toepassing is, is [artikel 3.13][ref1] niet van
      toepassing.

      2 Op elektriciteitsproductie-eenheden die overeenkomstig de criteria van artikel 5 van Verordening (EU) 2016/631
      als type B zouden worden geclassificeerd maar waarop overeenkomstig artikel 4, eerste lid, van de Verordening (EU)
      2016/631 (NC RfG), de Verordening (EU) 2016/631 (NC RfG) niet van toepassing is, zijn de [artikelen 3.13][ref2] en
      [3.17 tot en met 3.19][ref3] niet van toepassing.

      3 Op elektriciteitsproductie-eenheden die overeenkomstig de criteria van artikel 5 van Verordening (EU) 2016/631
      als type C zouden worden geclassificeerd maar waarop overeenkomstig artikel 4, eerste lid, van de Verordening (EU)
      2016/631 (NC RfG), de Verordening (EU) 2016/631 (NC RfG) niet van toepassing is, zijn de [artikelen 3.13][ref4],
      [3.17 tot en met 3.19][ref5] en [3.24 tot en met 3.26][ref6] niet van toepassing.

      4 Op elektriciteitsproductie-eenheden die overeenkomstig de criteria van artikel 5 van Verordening (EU) 2016/631
      als type D zouden worden geclassificeerd maar waarop overeenkomstig artikel 4, eerste lid, van de Verordening (EU)
      2016/631 (NC RfG), de Verordening (EU) 2016/631 (NC RfG) niet van toepassing is, zijn de [artikelen 3.13][ref7],
      [3.17 tot en met 3.19][ref8] en [3.24 tot en met 3.26][ref9] en [3.28 tot en met 3.31][ref10] niet van toepassing.

      5 Bij een elektriciteitsproductie-eenheid kleiner dan 800 W die voor 1 januari 2021 op het elektriciteitsnet is
      aangesloten spreekt de in [artikel 3.8, tweede lid, onderdeel c][ref11] bedoelde frequentiebeveiliging aan bij 48
      en 51 Hz.


