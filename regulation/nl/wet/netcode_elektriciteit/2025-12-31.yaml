  - number: '3.30'
    text: |-
      1 In afwijking van [artikel 3.26, eerste lid][ref1], is de power park module aangesloten op een hoogspanningsnet
      met een spanningsniveau gelijk aan of groter dan 300 kV in staat bij varierende spanning maximaal een hoeveelheid
      blindvermogen te leveren dat gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als
      bedoeld in artikel 21, derde lid, onderdeel b, subonderdeel i, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,33 bij een spanning van 0,9 pu tot 1 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,33 en 0,0 bij een spanning tussen 1 pu en
      1,05 pu.

      2 In afwijking van [artikel 3.26, eerste lid][ref2], is de power park module aangesloten op een hoogspanningsnet
      met een spanningsniveau gelijk aan of groter dan 300 kV in staat bij variërende spanning maximaal een hoeveelheid
      blindvermogen op te nemen dat gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als
      bedoeld in artikel 21, derde lid, onderdeel b, subonderdeel i, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,33 bij een spanning van 0,95 pu tot 1,05 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,33 en 0,0 bij een spanning tussen 0,95 pu
      en 0,9 pu.

      3 In aanvulling op het eerste lid is het toegestaan het werkzame vermogen, zoveel als met het oog op de begrenzing
      door de maximale stroom technisch nodig is, te verminderen ten gunste van het leveren van blindvermogen binnen het
      deel van het U-Q/Pmax-profiel dat begrensd wordt door het lineaire verloop tussen respectievelijk 0,2 en 0,33 bij
      een spanning tussen 0,90 pu en 0,95 pu en het profiel overeenkomstig het eerste lid.

      4 In afwijking van [artikel 3.26, eerste lid][ref3], is de power park module aangesloten op een hoogspanningsnet
      met een spanningsniveau gelijk aan of groter dan 300 kV op grond van het eerste tot en met het derde lid in staat
      blindvermogen te leveren of op te nemen binnen en inclusief de grenzen van het rood gemarkeerde U-Q/Pmax-profiel in
      onderstaand diagram:

      5 Indien de power park module via een transformator met een onder belasting verstelbare trappenschakelaar (on-line
      step changer) is aangesloten op een hoogspanningsnet met een spanningsniveau van 110 kV of hoger is de afwijking
      bedoeld in het derde lid en in [artikel 3.19, derde en zevende lid][ref4], uitsluitend toegestaan gedurende de
      regelactie van de trappenschakelaar van de transformator.


