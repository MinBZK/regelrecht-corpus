  - number: '10.25'
    text: |-
      1 Iedere werkdag stelt de netbeheerder van het landelijk hoogspanningsnet per BRP een overzicht samen van diens
      prestaties met betrekking tot het direct voorafgaande etmaal. Dit overzicht bevat per etmaal de volgende gegevens:

      a. het door de BRP bij de netbeheerder van het landelijk hoogspanningsnet ingediende en door hem goedgekeurde
      energieprogramma, met inbegrip van eventuele goedgekeurde wijzigingen daarvan;

      b. de door de netbeheerder van het landelijk hoogspanningsnet op basis van [artikel 10.18, eerste lid][ref1], van
      netbeheerders ontvangen meetgegevens;

      c. de onbalans en onbalansaanpassing;

      d. de in [artikel 10.30][ref2] bedoelde onbalansprijs voor elke onbalansverrekeningsperiode;

      e. het totaalbedrag ter zake van de onbalans.

      2 De netbeheerder van het landelijk hoogspanningsnet stuurt het op grond van het eerste lid samengestelde overzicht
      aan de desbetreffende BRP voor 17:00 uur van de eerste werkdag na het etmaal waarop dat overzicht betrekking heeft.

      3 De netbeheerder van het landelijk hoogspanningsnet stuurt het op grond van het eerste lid samengestelde
      overzicht aan de desbetreffende BRP voor 17:00 uur van de vijfde werkdag na het etmaal waarop dat overzicht
      betrekking heeft. Daarbij dient in het eerste lid, onderdeel b, ‘[artikel 10.19, derde lid][ref3]’ in plaats van
      ‘[artikel 10.18, eerste lid][ref4]’ gelezen te worden.

      4 De netbeheerder van het landelijk hoogspanningsnet stuurt het op grond van het eerste lid samengestelde
      overzicht, aan de desbetreffende BRP voor 15:00 uur van de tiende werkdag na het etmaal waarop dat overzicht
      betrekking heeft. Daarbij dient in het eerste lid, onderdeel b, ‘[artikel 10.20, derde lid][ref5]’ in plaats van
      ‘[artikel 10.18, eerste lid][ref6]’ gelezen te worden.

      5 De netbeheerder van het landelijk hoogspanningsnet stuurt, indien van toepassing, direct na de op basis van
      [artikel 10.20, vierde lid][ref7], van een netbeheerder ontvangen meetgegevens van een bepaald etmaal, het op grond
      van het eerste lid samengestelde overzicht onverwijld aan de desbetreffende BRP. Daarbij dient in het eerste lid,
      onderdeel b, ‘artikel 10.20, vierde lid’ in plaats van ‘[artikel 10.18, eerste lid][ref8]’ gelezen te worden.

      6 Wanneer de in het eerste lid bedoelde werkdag volgt op een weekeinde of een algemeen erkende feestdag, betreft
      de in het eerste lid bedoelde gegevensverstrekking dat weekeinde onderscheidenlijk die feestdag of -dagen en het
      etmaal dat daaraan is voorafgegaan.

      7 Bij de vaststelling van de in artikel het eerste lid, onderdeel c, bedoelde onbalansaanpassing houdt de
      netbeheerder van het landelijk hoogspanningsnet rekening met de hoeveelheid energie die meer of minder is geleverd
      ingeval het gaat om:

      a. de balanceringsverantwoordelijkheid voor de aansluiting of aansluitingen waarop een BSP actief is met wie de
      netbeheerder van het landelijk hoogspanningsnet een overeenkomst met betrekking tot de terbeschikkingstelling van
      aFRR, noodvermogen of het MARI-product heeft gesloten en het meer of minder leveren heeft plaatsgevonden onder
      die overeenkomst;

      b. de balanceringsverantwoordelijkheid voor de aansluiting of aansluitingen waarop een CSP actief is waarvan een
      redispatch-product wordt afgeroepen als bedoeld in [bijlage 11][ref9], waarbij de afroep in overeenstemming met
      bijlage 11, vierde lid, onderdeel b, niet genomineerd wordt als handel met een specifieke BRP;

      c. de balanceringsverantwoordelijkheid voor de aansluiting of aansluitingen van een significante netgebruiker
      wanneer deze eenduidig te bepalen is naar aanleiding van een maatregel vanuit het systeembeschermings- en
      herstelplan die leidt tot een aanpassing van invoeding of afname van werkzaam vermogen.


