  - number: '9.31'
    text: |-
      1 Netbeheerders verkrijgen congestiemanagementdiensten door de volgende producten aan te kopen:

      a. bieding redispatch overeenkomstig [bijlage 11][ref1]; of

      b. capaciteitssturing overeenkomstig [bijlage 12][ref2].

      2 In aanvulling op het eerste lid geldt dat, als de congestiemanagementdiensten als bedoeld in het eerste lid,
      in de dagelijkse voorbereiding en de dagelijkse uitvoering de voorziene fysieke congestie niet in voldoende
      mate oplossen, de netbeheerder niet-marktgebaseerde redispatch toepast op de in het congestiegebied aanwezige
      elektriciteitsproductie-eenheden en elektriciteitsopslageenheden, volgens de richtlijnen die daarvoor in artikel 13
      van [Verordening (EU) 2019/943](32843R2019) zijn opgenomen.

      3 De in het eerste lid, onderdeel a, bedoelde diensten kunnen door de netbeheerder voor langere tijd worden
      gecontracteerd bij CSP’s. De in het eerste lid, onderdeel b, bedoelde diensten kunnen door de netbeheerder voor
      langere tijd worden gecontracteerd bij aangeslotenen of CSP’s. Voor deze contracten geldt een prijs die niet hoger
      is dan in het normaal economisch verkeer gebruikelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0037940
      [ref2]: https://wetten.overheid.nl/BWBR0037940
