  - number: '12.16'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet publiceert voor de verbinding Eemshaven-Noorwegen op haar
      website een alternatieve methode van toewijzen van beschikbare landgrensoverschrijdende transportcapaciteit: de
      fallback procedure.

      2 De fallback procedure voor de in het eerste lid bedoelde verbindingen bestaat uit de volgende stappen:

      a. De netbeheerder van het landelijk hoogspanningsnet draagt er zorg voor dat marktpartijen tijdig worden ingelicht
      over de verhoogde kans op toepassing van de fallback procedure.

      b. Indien de impliciete toewijzing, als bedoeld in [artikel 12.13, derde lid][ref1], 20 minuten voor het toepassen
      van de fallback procedure nog niet heeft plaatsgevonden, laat de netbeheerder van het landelijk hoogspanningsnet
      in samenwerking met de betrokken buitenlandse netbeheerder(s), voor de betrokken impliciet toe te wijzen capaciteit
      op de landsgrensoverschrijdende verbinding(en) tussen deze marktgebieden als fallback een expliciete toewijzing in
      werking treden. De biedingen die 10 minuten voor het toepassen van de fallback procedure zijn uitgebracht, worden
      gebruikt in de expliciete toewijzing.

      c. Indien de impliciete toewijzing als bedoeld in [artikel 12.13, derde lid][ref2], niet heeft plaatsgevonden
      worden de resultaten van de expliciete toewijzing toegepast.

      d. Indien de expliciete toewijzing wordt toegepast (en de resultaten daarvan worden gebruikt), heropenen de NEMO's
      hun orderboeken, zodat marktpartijen in de gelegenheid worden gesteld hun biedingen aan te passen.

      3 Aan de fallback procedure voor de in het eerste lid bedoelde verbindingen kunnen slechts partijen deelnemen die
      beschikken over een erkenning als BRP dan wel over een vergelijkbare status in Noorwegen voor de capaciteit van de
      verbinding Eemshaven-Noorwegen.

      4 Indien de fallback procedure voor de in het eerste lid bedoelde verbindingen wordt toegepast, kunnen
      energieprogramma's als bedoeld in [artikel 10.11, derde lid][ref3], en [artikel 10.12][ref4] door de bieders tot
      uiterlijk 15:30 uur worden ingediend.


