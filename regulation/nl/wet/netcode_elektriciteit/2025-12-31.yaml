  - number: '4.5'
    text: |-
      1 In afwijking van [artikel 2.13][ref1] informeert de netbeheerder van het landelijk hoogspanningsnet de
      aangeslotene en bereikt overeenstemming met hem voor zover van toepassing bij eerste aansluiting en bij latere
      wijziging van het net over de beveiligingsfilosofie, als bedoeld in artikel 16, eerste lid, van de Verordening (EU)
      2016/1388 (NC DCC).

      2 Voor zover de in het eerste lid genoemde gegevens nodig zijn voor de bedrijfsvoering van de aangeslotene, worden
      deze in de aansluit- en transportovereenkomst vastgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.13
