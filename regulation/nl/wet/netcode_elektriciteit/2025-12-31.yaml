  - number: '13.31'
    text: |-
      De netbeheerder registreert per aansluiting de volgende gegevens en geeft de desbetreffende aangeslotene
      desgevraagd inzage in de omtrent zijn aansluiting en aangesloten installatie vastgelegde gegevens:

      a. van elke aansluiting waarachter zich een of meer elektriciteitsproductie-eenheden bevinden, per
      elektriciteitsproductie-eenheid de gegevens genoemd in de [artikelen 13.1][ref1] of [13.2][ref2];

      b. van elke aansluiting waarachter zich een of meer verbruikseenheden bevinden, per verbruikseenheid de gegevens
      genoemd in de [artikelen 13.3][ref3] of [13.4][ref4];

      c. van elke aansluiting waarachter zich een net of een gesloten distributiesysteem bevindt, per overdrachtspunt van
      de aansluiting de gegevens genoemd en de [artikelen 13.5 tot en met 13.8][ref5].


