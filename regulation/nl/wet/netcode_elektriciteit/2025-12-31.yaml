  - number: '9.7'
    text: |-
      1 Indien de netbeheerder op grond van [artikel 9.4, eerste lid][ref1], voorziet dat met inachtneming van
      [artikel 16, eerste lid, onderdeel b, van de Elektriciteitswet 1998][ref2], in een net de beschikbare
      transportcapaciteit, als bedoeld in [artikel 9.5, vierde lid][ref3], ontoereikend is en er geen sprake is van
      een verzoek om het doen van een aanbod voor het uitvoeren van transport maar van groei binnen de tussen de
      aangeslotenen en de netbeheerder overeengekomen gecontracteerde transportvermogens voor afname en voor invoeding en
      de van toepassing zijnde doorlaatwaardes, of wanneer binnen een congestiegebied de marktomstandigheden veranderen,
      onderzoekt de netbeheerder de mogelijkheden om op korte termijn de benodigde transportcapaciteit en de aanwezige
      transportcapaciteit met elkaar in overeenstemming te brengen. De netbeheerder onderzoekt daartoe:

      a. de mogelijkheid om door middel van technische maatregelen anders dan netverzwaring de beschikbare
      transportcapaciteit te vergroten;

      b. de mogelijkheid overeenkomstig [artikel 9.1, eerste lid][ref4], het optreden van fysieke congestie op te lossen;

      c. volgens de procedure van de [artikelen 9.9 tot en met 9.11][ref5], de mogelijkheid om congestiemanagement
      overeenkomstig [paragraaf 9.9][ref6] en [9.10][ref7] toe te passen;

      d. in het geval van de netbeheerder van het landelijk hoogspanningsnet, de mogelijkheid om overeenkomstig
      [artikel 9.1, tweede en derde lid][ref8] het optreden van fysieke congestie op te lossen.

      2 Indien uit het onderzoek als bedoeld in het eerste lid blijkt dat het met één of meer van de genoemde
      mogelijkheden lukt de benodigde transportcapaciteit in overeenstemming te brengen met de aanwezige
      transportcapaciteit, voert de netbeheerder dit zo snel mogelijk uit.

      3 Indien uit het in het eerste lid bedoelde onderzoek blijkt dat er op korte termijn geen of onvoldoende
      mogelijkheid is om de benodigde transportcapaciteit in overeenstemming te brengen met de aanwezige
      transportcapaciteit, past de netbeheerder de procedure overeenkomstig de paragrafen 9.9 en [9.11][ref9] toe om de
      benodigde transportcapaciteit te verlagen.

      4 Wanneer binnen een congestiegebied de marktomstandigheden veranderen, als bedoeld in het eerste lid, door een
      wijziging in het beschikbare aanbod van flexibiliteitsdiensten als bedoeld in [artikel 9.31, eerste lid][ref10],
      onderzoekt de netbeheerder of in het congestiegebied aan artikel 13, derde lid, onder c of d, van [Verordening
      (EU) 2019/943](32843R2019) wordt voldaan en gaat de netbeheerder indien mogelijk over tot de toepassing van
      congestiemanagement overeenkomstig paragrafen 9.9 en [9.10][ref11].


