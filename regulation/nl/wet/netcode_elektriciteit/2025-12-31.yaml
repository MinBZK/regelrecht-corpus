  - number: '8.13'
    text: |-
      1 Na ontvangst van een ondertekende offerte voor de aanleg of wijziging van een aansluiting met doorlaatwaarde
      groter dan 3X80A maar met een aansluitcapaciteit kleiner dan of gelijk aan 10 MVA als bedoeld in
      [artikel 8.4, onderdeel e][ref1], realiseert de netbeheerder de gevraagde aansluiting of wijziging uiterlijk in
      de laatste week van de realisatietermijn die wordt vastgesteld op grond van dit artikel, tenzij er sprake is van
      overmacht als bedoeld in [artikel 6:75 van het Burgerlijk Wetboek][ref2], of omstandigheden die buiten de invloed
      van de netbeheerder liggen die de netbeheerder redelijkerwijs niet had kunnen voorzien, waaronder onder meer maar
      niet uitsluitend gerekend worden:

      a. niet tijdige verlening van vergunningen of toestemmingen van derden;

      b. weersomstandigheden (vorst); of

      c. omstandigheden die de aangeslotene zijn toe te rekenen zoals het niet tijdig beschikbaar hebben van een
      geschikte ruimte voor de aansluiting.

      2 De netbeheerder bepaalt, behoudens de situatie als bedoeld in het derde lid, onderdeel a, binnen 5 weken na
      ontvangst van de in het eerste lid bedoelde ondertekende offerte, op basis van [bijlage 21][ref3], de week waarin
      de aansluiting ten uiterste gerealiseerd is, waarbij geldt dat deze week, ten opzichte van het moment van ontvangst
      van de in het eerste lid bedoelde ondertekende offerte, niet verder in de toekomst ligt dan:

      a. 26 weken, vermeerderd met de eventueel van toepassing zijnde dynamische regionale wachttijd als bedoeld in
      [artikel 8.12][ref4] zoals die gold op de datum van ontvangst van de in het eerste lid bedoelde ondertekende
      offerte, indien de complexiteitscategorie ‘laag’ is;

      b. 52 weken, vermeerderd met de eventueel van toepassing zijnde dynamische regionale wachttijd als bedoeld in
      [artikel 8.12][ref5] zoals die gold op de datum van ontvangst van de in het eerste lid bedoelde ondertekende
      offerte, indien de complexiteitscategorie ‘midden’ is; en

      c. een door de netbeheerder vast te stellen aantal weken, indien de complexiteitscategorie ‘hoog’ is waarbij de
      netbeheerder inzichtelijk maakt dat deze vast te stellen termijn in redelijkheid niet korter kan zijn, vermeerderd
      met de eventueel van toepassing zijnde dynamische regionale wachttijd als bedoeld in [artikel 8.12][ref6] zoals die
      gold op de datum van ontvangst van de in het eerste lid bedoelde ondertekende offerte.

      3 Indien de netbeheerder geen aanbod doet voor het uitvoeren van transport overeenkomstig de bepalingen van
      [artikel 9.6, derde lid][ref7], en de periode tussen de in het eerste lid bedoelde ontvangst van de ondertekende
      offerte en het beschikbaar komen van transport:

      a. langer is dan twee jaar, bepaalt de netbeheerder, in afwijking van de termijn genoemd in de aanhef van het
      tweede lid, uiterlijk twee jaar voor het geplande beschikbaar komen van transport de in het tweede lid bedoelde
      week waarin de aansluiting ten uiterste gerealiseerd is; of

      b. langer is dan de uit het tweede lid volgende week waarin de aansluiting ten uiterste gerealiseerd is, realiseert
      de netbeheerder de aansluiting of de wijziging uiterlijk dertien weken na het beschikbaar komen van transport.

      4 De netbeheerder en de aangeslotene kunnen gezamenlijk een latere week van realisatie overeenkomen dan de week van
      realisatie bedoeld in het tweede lid.

      5 Indien in de periode tussen de in het eerste lid bedoelde ontvangst van de ondertekende offerte en de op grond
      van het tweede, derde of vierde lid bepaalde week waarin de aansluiting ten uiterste gerealiseerd is, sprake is van
      overmacht of omstandigheden als bedoeld in het eerste lid:

      a. wordt de in het tweede, derde, of vierde lid bedoelde uiterste week van realisatie uitgesteld met de vertraging
      die het gevolg is van de situatie van overmacht of omstandigheden als bedoeld in het eerste lid; en

      b. spant de netbeheerder zich in om het in onderdeel a bedoelde uitstel zo kort mogelijk te laten zijn.

      6 De netbeheerder:

      a. communiceert schriftelijk de op grond van het tweede, derde of vierde lid bepaalde uiterste week van realisatie
      aan de aangeslotene;

      b. draagt zorg voor transparante communicatie over de uitvoering van de bepalingen van dit artikel en informeert de
      aanvrager op een toegankelijke wijze over de voortgang; en

      c. zal de aangeslotene adequaat en met een transparante onderbouwing informeren zodra er afwijkingen ontstaan op de
      gemaakte afspraken, bijvoorbeeld door overmacht of omstandigheden als bedoeld in het eerste lid.


