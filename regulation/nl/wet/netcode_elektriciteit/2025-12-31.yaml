  - number: '7.8'
    text: |-
      1 Een laagspanningswisselstroomnet overschrijdt niet een aanraakspanning van 50 V of wordt bij een optredende fout
      waarbij de aanraakspanning hoger wordt dan 50 V binnen 5 seconden uitgeschakeld.

      2 In aanvulling op het eerste lid geldt voor risicogebieden: een laagspanningswisselstroomnet overschrijdt niet een
      aanraakspanning van 25 V of wordt bij een optredende fout waarbij de aanraakspanning hoger wordt dan 25 V binnen 5
      seconden uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel7.8
  - number: '7.9'
    text: |-
      1 De netbeheerder baseert zich bij het vaststellen van risicogebieden op vastgestelde bestemmingsplannen (gemeente)
      en inpassingsplannen (rijk en provincie).

      2 Voor het vaststellen van risicogebieden hanteert de netbeheerder de hoofdgroepen van bestemmingen zoals
      vastgelegd in [bijlage 5 bij de Regeling standaarden ruimtelijke ordening 2012][ref1].

      3 Een risicogebied is elk gebied met hoofdbestemming Groen, Natuur, Recreatie of Sport als bedoeld in
      [bijlage 5 bij de Regeling standaarden ruimtelijke ordening 2012][ref2].


