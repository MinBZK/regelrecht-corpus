  - number: '6.1'
    text: |-
      1 Het HVDC-systeem is in staat om binnen de volgende frequentiebereiken en tijdsperiodes, als bedoeld in artikel
      11, eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC) op het net aangesloten en in bedrijf te blijven:

      a. in de frequentieband van 47,0 Hz tot 47,5 Hz gedurende minimaal 60 seconden;

      b. in de frequentieband van 47,5 Hz tot 48,5 Hz gedurende minimaal 90 minuten;

      c. in de frequentieband van 48,5 Hz tot 49,0 Hz gedurende minimaal 90 minuten;

      d. in de frequentieband van 49,0 Hz tot 51,0 Hz gedurende onbeperkte tijd;

      e. in de frequentieband van 51,0 Hz tot 51,5 Hz gedurende minimaal 90 minuten;

      f. in de frequentieband van 51,5 Hz tot 52,0 Hz gedurende minimaal 15 minuten.

      2 De netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over een HVDC-systeem kunnen
      overeenstemming bereiken over bredere frequentiebereiken of langere minimumbedrijfsperiodes dan gespecificeerd in
      het eerste lid en leggen deze vast in de aansluit- en transportovereenkomst.

      3 De netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over een HVDC-systeem
      komen de frequenties overeen waarbij het HVDC-systeem in staat is zich automatisch te ontkoppelen, als bedoeld
      in artikel 11, derde lid, van de Verordening (EU) 2016/1447 (NC HVDC) en leggen deze vast in de aansluit- en
      transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.1
  - number: '6.2'
    text: |-
      1 Voor het regelen van het werkzaam vermogen volgend op een instructie van de netbeheerder van het landelijk
      hoogspanningsnet, als bedoeld in artikel 13, eerste lid, onderdeel a, van de Verordening (EU) 2016/1447 (NC HVDC),
      geldt dat:

      a. de minimale en maximale vermogensstap voor de aanpassing van het werkzaam vermogen respectievelijk 1 MW en twee
      maal de maximale HVDC-transportcapaciteit van werkzaam vermogen bedragen;

      b. de minimale HVDC-transportcapaciteit van werkzaam vermogen, beneden welke geen transportcapaciteit vereist is, 0
      MW bedraagt, tenzij anders overeengekomen op basis van technologie specifieke beperkingen. De netbeheerder legt in
      dat geval de waarde vast in de aansluit- en transportovereenkomst;

      c. de maximale vertragingstijd, waarbinnen een HVDC-systeem in staat is het transport van werkzaam vermogen aan te
      passen na ontvangst van een verzoek, 100 ms bedraagt.

      2 Hoe het HVDC-systeem in staat is de invoeding van het getransporteerde werkzaam vermogen te wijzigen in het geval
      van storingen in één of meerdere van de verbonden AC-netten, als bedoeld in artikel 13, eerste lid, onderdeel b,
      van de Verordening (EU) 2016/1447 (NC HVDC), wordt vastgelegd in de aansluit- en transportovereenkomst.

      3 Indien de netbeheerder van het landelijk hoogspanningsnet eist dat het HVDC-systeem in staat is het
      getransporteerde werkzaam vermogen zo snel mogelijk om te keren, als bedoeld in artikel 13, eerste lid, onderdeel
      c, van de Verordening (EU) 2016/1447 (NC HVDC), komt hij met de aangeslotene die beschikt over een HVDC-systeem de
      benodigde tijd voor deze snelle omkering overeen en legt deze vast in de aansluit- en transportovereenkomst.

      4 De besturingsfuncties van het HVDC-systeem zijn in staat om automatisch corrigerende maatregelen te
      nemen, inclusief het beëindigen van de op- en afregeling en het blokkeren van de FSM, LFSM-O, LFSM-U en
      frequentieregeling. De netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over een
      HVDC-systeem komen de trigger- en blokkeringscriteria, als bedoeld in artikel 13, derde lid, van de Verordening
      (EU) 2016/1447 (NC HVDC), overeen en leggen deze vast in de aansluit- en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.2
  - number: '6.3'
    text: |-
      1 Het HVDC-systeem is in staat synthetische inertie in reactie op frequentieveranderingen te leveren, als bedoeld
      in artikel 14, eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC).

      2 De netbeheerder van het landelijk hoogspanningsnet specificeert op basis van de resultaten van uitgevoerde
      studies het principe van het regelsysteem en de prestatieparameters voor de snelle aanpassing van het werkzaam
      vermogen dat wordt geïnjecteerd in of onttrokken aan het hoogspanningsnet, als bedoeld in artikel 14, tweede lid,
      van de Verordening (EU) 2016/1447 (NC HVDC), en legt deze vast in de aansluit- en transportovereenkomst.

      3 Deze snelle aanpassing van het werkzaam vermogen is beperkt door de maximale HVDC-transportcapaciteit van
      werkzaam vermogen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.3
  - number: '6.4'
    text: |-
      1 Het HVDC-systeem is in staat, wanneer de frequentiegevoelige modus (FSM) in bedrijf is, de frequentierespons voor
      het werkzaam vermogen te leveren, als bedoeld in artikel 15 en Bijlage II onder A, eerste lid, onderdeel a, van de
      Verordening (EU) 2016/1447 (NC HVDC), overeenkomstig de volgende parameters:

      a. de dode band van de frequentierespons is instelbaar tussen 0 en 500 mHz;

      b. de statiek voor opregeling is instelbaar met een minimale waarde van 0,1%;

      c. de statiek voor afregeling is instelbaar met een minimale waarde van 0,1%;

      d. de ongevoeligheid van de frequentierespons is 10 mHz.

      2 De netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over een HVDC-systeem komen de
      instellingen voor de dode band van de frequentierespons, de statiek voor opregeling en de statiek voor afregeling,
      als bedoeld in artikel 15 en Bijlage II onder A, eerste lid, onderdeel a, van de Verordening (EU) 2016/1447 (NC
      HVDC), overeen. De overeengekomen waarden worden vastgelegd in de aansluit- en transportovereenkomst.

      3 Het HVDC-systeem is in staat om, in reactie op frequentiestapveranderingen wanneer de frequentiegevoelige modus
      (FSM) in bedrijf is, als bedoeld in artikel 15 en Bijlage II onder A, eerste lid, onderdeel d, subonderdeel ii,
      van de Verordening (EU) 2016/1447 (NC HVDC), het werkzaam vermogen aan te passen op een dusdanige manier dat de
      initiële vertraging maximaal 0,1 s bedraagt, tenzij de aangeslotene die beschikt over het HVDC-systeem met een
      toereikende verklaring aantoont dat deze tijd niet korter kan. Indien de initiële vertraging langer duurt dan 0,1
      s, leggen de netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over het HVDC-systeem
      de instelling vast in de aansluit- en transportovereenkomst.

      4 Het HVDC-systeem is in staat om, in reactie op frequentiestapveranderingen wanneer de gelimiteerde
      frequentiegevoelige modus – overfrequentie (LFSM-O) in bedrijf is, als bedoeld in artikel 15 en Bijlage II onder B,
      eerste lid, onderdeel c, van de Verordening (EU) 2016/1447 (NC HVDC), het werkzaam vermogen zo snel als technisch
      mogelijk aan te passen, met een initiële vertraging van maximaal 0,2 s en met de volledige activering binnen 2 s.

      5 Het HVDC-systeem is in staat om, in reactie op frequentiestapveranderingen wanneer de gelimiteerde
      frequentiegevoelige modus – overfrequentie (LFSM-O) in bedrijf is, als bedoeld in artikel 15 en Bijlage II onder B,
      tweede lid, van de Verordening (EU) 2016/1447 (NC HVDC), het werkzaam vermogen aan te passen, waarbij:

      a. de frequentiedrempelwaarde instelbaar is tussen 50,2 Hz en 50,5 Hz (inclusief);

      b. de instelling van de frequentiedrempelwaarde 50,2 Hz is;

      c. de statiek instelbaar is met een minimale waarde van 0,1%;

      d. de default instelling van de statiek 5% is;

      e. het HVDC-systeem bij het bereiken van het minimumregelniveau op dit niveau in bedrijf blijft.

      6 Het HVDC-systeem is in staat om, in reactie op frequentiestapveranderingen wanneer de gelimiteerde
      frequentiegevoelige modus – onderfrequentie (LFSM-U) in bedrijf is, als bedoeld in artikel 15 en Bijlage II
      onder B, eerste lid, onderdeel c, van de Verordening (EU) 2016/1447 (NC HVDC), het werkzaam vermogen zo snel als
      technisch mogelijk aan te passen, met een initiële vertraging van maximaal 0,2 s en met de volledige activering
      binnen 2 s.

      7 Het HVDC-systeem is in staat om, in reactie op frequentiestapveranderingen wanneer de gelimiteerde
      frequentiegevoelige modus – onderfrequentie (LFSM-U) in bedrijf is, als bedoeld in artikel 15, Bijlage II onder B,
      tweede lid, van de Verordening (EU) 2016/1447 (NC HVDC), het werkzaam vermogen aan te passen, waarbij:

      a. de frequentiedrempelwaarde instelbaar is tussen 49,5 Hz en 49,8 Hz;

      b. de instelling van de frequentiedrempelwaarde 49,8 Hz is;

      c. de statiek instelbaar is met een minimale waarde van 0,1%;

      d. de default instelling van de statiek 5% is.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.4
  - number: '6.5'
    text: |-
      1 Het HVDC-systeem is uitgerust met een onafhankelijke regelmodus, als bedoeld in artikel 16, eerste lid, van de
      Verordening (EU) 2016/1447 (NC HVDC).

      2 De netbeheerder van het landelijk hoogspanningsnet specificeert de eisen voor het werkingsprincipe,
      de bijbehorende prestatieparameters en de activeringscriteria van de frequentieregeling, als bedoeld in
      artikel 16, tweede lid, van de Verordening (EU) 2016/1447 (NC HVDC), en legt deze vast in de aansluit- en
      transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.5
  - number: '6.6'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet specificeert het maximumverlies van werkzaam vermogen, als
      bedoeld in artikel 17, eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC), en legt deze vast in de aansluit-
      en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.6
  - number: '6.7'
    text: |-
      1 De 1 pu-referentiespanningen in het hoogspanningsnet, als bedoeld in artikel 18, eerste lid, van de Verordening
      (EU) 2016/1447 (NC HVDC), zijn 110 kV, 150 kV, 220 kV en 400 kV.

      2 De tijdsduur van de bedrijfsperiode voor spanningen tussen 1,118 pu en 1,15 pu in netten met nominale spanning
      tussen 110 kV (inclusief) en 300 kV (exclusief), als bedoeld in artikel 18, eerste lid, van de Verordening (EU)
      2016/1447 (NC HVDC), is 20 minuten.

      3 De tijdsduur van de bedrijfsperiode voor spanningen tussen 1,05 pu en 1,0875 pu in netten met nominale spanning
      tussen 300 kV (inclusief) en 400 kV (inclusief), als bedoeld in artikel 18, eerste lid, van de Verordening (EU)
      2016/1447 (NC HVDC), is 60 minuten.

      4 Indien vereist om de systeemveiligheid te handhaven of te herstellen, bereiken de netbeheerder van het
      landelijk hoogspanningsnet en de aangeslotene die beschikt over een HVDC-systeem overeenstemming over grotere
      spanningsbereiken of langere minimumbedrijfsperiodes dan in het tweede en derde lid zijn gespecificeerd en leggen
      dat vast in de aansluit- en transportovereenkomst.

      5 De netbeheerder van het landelijk hoogspanningsnet en aangeslotene die beschikt over een HVDC-systeem
      bereiken overeenstemming over de voorwaarden en de instellingen voor automatische ontkoppeling, als bedoeld
      in artikel 18, derde lid, van de Verordening (EU) 2016/1447 (NC HVDC), en leggen deze vast in de aansluit- en
      transportovereenkomst.

      6 Voor een HVDC-convertorstation, aangesloten op een net waarvan de 1 pu-referentie-AC-spanning kleiner is dan 110
      kV, als bedoeld in artikel 18, vierde lid, van de Verordening (EU) 2016/1447 (NC HVDC), gelden dezelfde eisen als
      voor een HVDC-convertorstation, aangesloten op een net waarvan de 1 pu-referentie-AC-spanning gelijk is aan 110 kV.

      7 Voor een HVDC-convertorstation, aangesloten op een net waarvan de 1 pu-referentie-AC-spanning groter is dan 400
      kV, als bedoeld in artikel 18, vierde lid, van de Verordening (EU) 2016/1447 (NC HVDC), gelden dezelfde eisen als
      voor een HVDC-convertorstation, aangesloten op een net waarvan de 1 pu-referentie-AC-spanning gelijk is aan 400 kV.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.7
  - number: '6.8'
    text: |-
      1 Tenzij anders overeengekomen beschikt het HVDC-systeem over de capaciteit om snelle foutstroom op het
      overdrachtspunt te leveren in het geval van symmetrische fouten, als bedoeld in artikel 19, eerste lid, van de
      Verordening (EU) 2016/1447 (NC HVDC).

      2 Ten aanzien van het leveren van snelle foutstroom op het overdrachtspunt van de aansluiting als bedoeld in het
      eerste lid, is het HVDC-convertorstation in staat om in bedrijf te zijn in een of twee van de volgende regelmodi:

      a. de snelle foutstroomregelmodus zonder voorgeschreven foutstroom waarbij het HVDC-convertorstation in staat is om
      in het geval van symmetrische (driefasen) en asymmetrische storingen de spanningsverandering op het overdrachtspunt
      van de aansluiting van het HVDC-convertorstation tegen te werken; of

      b. de snelle foutstroomregelmodus met voorgeschreven foutstroom waarbij
      [artikel 3.19, tiende lid, twaalfde lid, en veertiende tot en met zestiende lid][ref1], van overeenkomstige
      toepassing is op het HVDC-convertorstation, waarbij “overdrachtspunt van de aansluiting van het HVDC-
      convertorstation” gelezen dient te worden in plaats van “aansluitklemmen van de afzonderlijke opwekkingseenheid van
      de power park module”.

      3 De netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over een HVDC-systeem
      komen de reqelmodus of regelmodi alsmede ingeval van de in onderdeel a bedoelde reqelmodus het principe en de
      prestatieparameters van de regelmodus, overeen, en leggen dit vast in de aansluit- en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.19
