  - number: '10.37'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet kan aan een natuurlijk persoon, rechtspersoon of vennootschap,
      niet zijnde een netbeheerder, op aanvraag een erkenning als BSP verlenen. Een natuurlijke persoon, rechtspersoon
      dan wel vennootschap kan slechts voor één erkenning als BSP in aanmerking komen.

      2 De BSP heeft het recht:

      a. balanceringscapaciteit beschikbaar te stellen aan de netbeheerder van het landelijk hoogspanningsnet;

      b. balanceringsenergie beschikbaar te stellen aan de netbeheerder van het landelijk hoogspanningsnet;

      c. reservecapaciteit FCR beschikbaar te stellen aan de netbeheerder van het landelijk hoogspanningsnet;

      d. een verplichting tot het beschikbaar stellen van balanceringscapaciteit of reservecapaciteit FCR over te dragen
      aan een andere BSP;

      e. balanceringsdiensten aan te bieden met een reserveleverende eenheid en een reserveleverende groep.

      3 De aanvraag om een erkenning als BSP wordt schriftelijk en ondertekend door een bevoegd persoon ingediend bij de
      netbeheerder van het landelijk hoogspanningsnet volgens een door de netbeheerder van het landelijk hoogspanningsnet
      uit te geven model.

      4 De netbeheerder van het landelijk hoogspanningsnet beslist of de aanvrager voor erkenning als BSP in aanmerking
      komt, binnen 14 dagen na het laatste tijdstip van ontvangst van het aanvraagformulier, of het voltooien van het
      relevante FCR-prekwalificatieproces of FRR-prekwalificatieproces.

      5 Een erkenning als BSP wordt verleend, nadat:

      a. de aanvrager met succes het prekwalificatieproces voor het leveren van tenminste één van de
      in [artikel 10.36, eerste lid][ref1], genoemde balanceringsproducten heeft doorlopen, waarbij dit
      prekwalificatieproces succesvol is indien:

      1°. de aanvrager beschikt over één of meer reserveleverende eenheden of reserveleverende groepen voor de levering
      van het desbetreffende balanceringsproduct die met succes het prekwalificatieproces, als bedoeld in artikel 155 of
      159 van [Verordening (EU) 2017/1485](32017R1485) (GL SO) hebben doorlopen;

      2°. de aanvrager beschikt over een certificaat als bedoeld in [artikel 13.33, eerste lid][ref2], voor het gebruik
      van het in [artikel 13.32][ref3] bedoelde centrale communicatiesysteem ten behoeve van de informatie-uitwisseling
      met betrekking tot de levering van het desbetreffende balanceringsproduct;

      b. de netbeheerder van het landelijk hoogspanningsnet zich ervan heeft vergewist dat de aanvrager beschikt over de
      deskundigheid en over de technische, administratieve en organisatorische faciliteiten die vereist zijn om als BSP
      te kunnen optreden.

      6 De procedure voor de aanvraag van een BSP-erkenning kan door de netbeheerder van het landelijk hoogspanningsnet
      worden beëindigd, waarbij de aanvraag als ingetrokken wordt beschouwd met berichtgeving richting de aspirant-
      BSP, indien de aspirant-BSP binnen een termijn van negen maanden na de aanvraag als bedoeld in het derde lid, niet
      aantoont dat hij voldoet aan de in het vijfde lid genoemde voorwaarden. Indien de termijn van negen maanden dreigt
      te worden overschreden door een vertraging in de erkenningsprocedure aan de zijde van de netbeheerder van het
      landelijk hoogspanningsnet, wordt de genoemde termijn van negen maanden in overleg met de aspirant-BSP verlengd.


