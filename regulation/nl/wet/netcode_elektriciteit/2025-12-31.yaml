  - number: '9.11'
    text: |-
      1 Indien op basis van het in [artikel 9.10, eerste lid][ref1], genoemde onderzoek blijkt dat in het congestiegebied
      waarvoor een vooraankondiging is afgegeven congestiemanagement overeenkomstig de paragrafen 9.9, [9.10][ref2] en
      [9.11][ref3] een oplossing biedt, doet de netbeheerder binnen één week na afronding van het onderzoek aan de hierna
      in onderdeel a bedoelde aangeslotenen in het congestiegebied hiervan melding. De melding bevat in ieder geval de
      volgende gegevens:

      a. een aanduiding van het congestiegebied door middel van een lijst van EAN-codes in het desbetreffende gebied en
      een geografische beschrijving van het betrokken gebied met het desbetreffende net in dat gebied;

      b. de ingangsdatum van het verwachte structureel tekort aan beschikbare transportcapaciteit;

      c. de verwachte periode waarvoor het congestiegebied is aangewezen;

      d. een onderbouwing en motivering, op grond waarvan duidelijk blijkt dat er binnen het gestelde gebied sprake is
      van een structureel tekort aan beschikbare transportcapaciteit; en

      e. een onderbouwing en motivering van de onmogelijkheid om de fysieke congestie binnen de in onderdeel c genoemde
      periode op andere wijze op te lossen dan door het toepassen van congestiemanagement.

      2 De melding als bedoeld in het eerste lid, alsmede het in het eerste lid bedoelde onderzoek en de uitkomsten
      daarvan, worden binnen één week na afronding van het in het eerste lid bedoelde onderzoek gepubliceerd op de in
      [artikel 9.8][ref4] bedoelde website. Het onderzoeksrapport bevat de elementen zoals benoemd in [bijlage 14][ref5].

      3 De netbeheerder doet de in het eerste lid bedoelde melding tevens aan netbeheerders van wie het net verbonden
      is met het net van het in het eerste lid bedoelde congestiegebied en aan de netbeheerder van het landelijk
      hoogspanningsnet.

      4 Een netbeheerder rapporteert jaarlijks uiterlijk 30 april over het afgelopen kalenderjaar aan de Autoriteit
      Consument en Markt over zijn congestiegebieden. De rapportage bevat per congestiegebied in ieder geval:

      a. de totale hoeveelheid elektriciteit die is getransporteerd;

      b. de totale inzet van capaciteitsbeperkingen, als bedoeld in [bijlage 12, zevende lid][ref6], waarbij voor iedere
      inzet het verschil tussen het maximaal verstrekte gecontracteerde transportvermogen voor afname en voor invoeding
      zoals vastgelegd in de aansluit- en transportovereenkomst, en het niveau waarop de transportbehoefte wordt beperkt
      (MW) wordt weergegeven, gerelateerd aan de duur van deze inzet (in uren);

      b1. de totale inzet van capaciteitssturing, waarbij voor iedere inzet het verzochte minimum als bedoeld in
      [Bijlage 12, tweede lid, onderdeel a, onder 1 of 3][ref7] wordt aangegeven (MW), gerelateerd aan de duur van
      deze inzet (in uren), voor zover niet reeds gerapporteerd onder onderdeel b;

      c. de totale inzet van redispatchproducten op grond van [bijlage 11][ref8] in MWh, zowel binnen als buiten het
      congestiegebied; en

      d. de kosten aan congestiemanagement, onderverdeeld in de totale kosten voor:

      1°. de contracten op grond van [bijlage 11, vijfde lid][ref9];

      2°. de contracten op grond van [bijlage 12, zevende lid][ref10];

      2a°. de contracten op grond van [bijlage 12, tweede lid][ref11], voor zover niet reeds gerapporteerd onder
      subonderdeel 2;

      3°. de kosten voor de inzet van capaciteitsbeperking;

      3a°. de kosten voor de inzet van capaciteitssturing, voor zover niet reeds gerapporteerd onder subonderdeel 3;

      4°. de kosten voor de inzet van redispatch.

      e. met betrekking tot de deelnameplicht als bedoeld in [artikel 9.1, vierde lid][ref12]:

      1°. De hoeveelheid gevraagde capaciteitsbeperking, zijnde het niveau waarop de transportbehoefte wordt beperkt
      (MW), gerelateerd aan de duur van deze inzet (in uren);

      2°. De hoeveelheid gevraagde redispatch;

      3°. De hoeveelheid aangeboden capaciteitsbeperking, zijnde het niveau waarop de transportbehoefte wordt beperkt
      (MW), gerelateerd aan de duur van deze inzet (in uren);

      4°. De hoeveelheid aangeboden redispatch;

      5°. De hoeveelheid van aangeslotenen ontvangen betalingen voor het niet doen van een aanbod voor
      capaciteitsbeperking; en

      6°. De hoeveelheid van aangeslotenen ontvangen betalingen voor het niet bieden van redispatch.


