  - number: '7.3'
    text: |-
      1 De voorwaarden ten aanzien van spanningskwaliteit voor aansluitingen op netten met een spanningsniveau U kleiner
      dan of gelijk aan 1 kV zijn als volgt gedefinieerd:

      a. De langzame spanningsvariatie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. U plus of min 10% voor 95% van de over 10 minuten gemiddelde waarden gedurende 1 week;

      2°. U plus 10% of min 15% voor alle over 10 minuten gemiddelde waarden.

      b. De snelle spanningsvariatie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. kleiner dan of gelijk aan 10% U;

      2°. kleiner dan of gelijk aan 3% U in situatie zonder uitval van productie, grote verbruikers of verbindingen;

      3°. P is kleiner dan of gelijk 1 gedurende 95% van de over 10 minuten voortschrijdende gemiddelde waarden gedurende
      een week;

      4°. P is kleiner dan of gelijk 5 voor alle over 10 minuten voortschrijdende gemiddelde waarden gedurende een week.

      c. De asymmetrie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. De inverse component van de spanning ligt tussen 0 en 2% van de normale component gedurende 95% van de 10
      minuten meetperioden per week;

      2°. De inverse component van de spanning ligt tussen 0 en 3% van de normale component voor alle meetperioden.

      d. De harmonische vervorming is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. De relatieve spanning per harmonische is kleiner dan het in de norm NEN-EN 50160:2022,
      ‘Spanningskarakteristieken in openbare elektriciteitsnetten’ genoemde percentage voor 95% van de over 10 minuten
      gemiddelde waarden. Voor harmonischen die niet vermeld zijn, geldt de kleinst vermelde waarde uit de norm.

      2°. THD is kleiner dan of gelijk aan 8% voor alle harmonischen tot en met de 40e, gedurende 95% van de tijd.

      3°. De relatieve spanning per harmonische is kleiner dan 1,5 vermenigvuldigd met het in de norm genoemde percentage
      voor 99,9% van de over 10 minuten gemiddelde waarden.

      4°. THD is kleiner dan of gelijk aan 12% voor alle harmonischen tot en met de 40e, gedurende 99,9% van de tijd.

      2 De voorwaarden ten aanzien van spanningskwaliteit voor aansluitingen op netten met een spanningsniveau U groter
      dan 1 kV en kleiner dan 35 kV zijn als volgt gedefinieerd:

      a. De langzame spanningsvariatie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. U plus of min 10% voor 95% van de over 10 minuten gemiddelde waarden gedurende 1 week;

      2°. U plus 10% of min 15% voor alle over 10 minuten gemiddelde waarden.

      b. De snelle spanningsvariatie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. ΔU is kleiner dan of gelijk aan 10% U;

      2°. ΔU is kleiner dan of gelijk aan 3% U in situatie zonder uitval van productie, grote verbruikers of
      verbindingen;

      3°. ΔU is kleiner dan of gelijk aan 5% U in situatie zonder uitval van productie, grote verbruikers of
      verbindingen;

      4°. P is kleiner dan of gelijk 1 gedurende 95% van de over 10 minuten voortschrijdende gemiddelde waarden gedurende
      een week;

      5°. P is kleiner dan of gelijk 5 voor alle over 10 minuten voortschrijdende gemiddelde waarden gedurende een
      beschouwingsperiode van een week.

      c. De asymmetrie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. De inverse component van de spanning ligt tussen 0 en 2% van de normale component gedurende 95% van de 10
      minuten meetperioden per week;

      2°. De inverse component van de spanning ligt tussen 0 en 3% van de normale component voor alle meetperioden.

      d. De harmonische vervorming is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. De relatieve spanning per harmonische is kleiner dan het in de norm NEN-EN 50160:2022,
      ‘Spanningskarakteristieken in openbare elektriciteitsnetten’ genoemde percentage voor 95% van de over 10 minuten
      gemiddelde waarden. Voor harmonischen die niet vermeld zijn, geldt de kleinst vermelde waarde uit de norm.

      2°. THD is kleiner dan of gelijk aan 8% voor alle harmonischen tot en met de 40e, gedurende 95% van de tijd.

      3°. De relatieve spanning per harmonische is kleiner dan 1,5 vermenigvuldigd met het in de norm genoemde percentage
      voor 99,9% van de over 10 minuten gemiddelde waarden.

      4°. THD is kleiner dan of gelijk aan 12% voor alle harmonischen tot en met de 40e, gedurende 99,9% van de tijd.

      e. voor spanningsdips geldt dat het gemiddelde van het aantal opgetreden spanningsdips per aansluiting over de
      voorgaande vijf aaneengesloten kalenderjaren kleiner is dan of gelijk is aan:

      1°. 3 voor spanningsdips met een duur groter dan of gelijk aan 10 milliseconden en kleiner dan of gelijk aan 200
      milliseconden en een restspanning kleiner dan 40% (klasse B1);

      2°. 4 voor spanningsdips met een duur groter dan 200 milliseconden en kleiner dan of gelijk aan 500 milliseconden
      en een restspanning kleiner dan 70% (klasse B2);

      3°. 4 voor spanningsdips met een duur groter dan 500 milliseconden en kleiner dan of gelijk aan 5.000 milliseconden
      en een restspanning kleiner dan 80% (klasse C).

      3 De voorwaarden ten aanzien van spanningskwaliteit voor aansluitingen op netten met een spanningsniveau U groter
      dan of gelijk aan 35 kV zijn als volg gedefinieerd:

      a. De langzame spanningsvariatie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. U plus of min 10% voor 99,9% van de over 10 minuten gemiddelde waarden gedurende een week.

      b. De snelle spanningsvariatie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. ΔU is kleiner dan of gelijk aan 10% U;

      2°. ΔU is kleiner dan of gelijk aan 3% U in situatie zonder uitval van productie, grote verbruikers of
      verbindingen;

      3°. ΔU is kleiner dan of gelijk aan 5% U in situatie zonder uitval van productie, grote verbruikers of
      verbindingen;

      4°. P is kleiner dan of gelijk 1 gedurende 95% van de over 10 minuten voortschrijdende gemiddelde waarden gedurende
      een week;

      5°. P is kleiner dan of gelijk 5 voor alle over 10 minuten voortschrijdende gemiddelde waarden gedurende een
      beschouwingsperiode van een week.

      c. De asymmetrie is op het overdrachtspunt van de aansluiting als volgt begrensd:

      1°. De inverse component is kleiner dan of gelijk aan 1% van de normale component gedurende 99,9% van de over 10
      minuten gemiddelde waarden gedurende een week.

      d. De harmonische vervorming is op het overdrachtspunt van de aansluiting op een net met spanningsniveau U is
      groter dan 35 kV en kleiner dan 220 kV als volgt begrensd:

      1°. THD is kleiner dan of gelijk aan 6% voor alle harmonische tot en met de 40e, gedurende 95% van de over 10
      minuten gemiddelde waarden gedurende een week.

      2°. THD is kleiner dan of gelijk aan 7% voor alle harmonische tot en met de 40e, gedurende 99,9% van de over 10
      minuten gemiddelde waarden gedurende een week.

      e. De harmonische vervorming is op het overdrachtspunt van de aansluiting op een net met spanningsniveau U is
      groter dan of gelijk aan 220 kV als volgt begrensd:

      1°. THD is kleiner dan of gelijk aan 5% voor alle harmonische tot en met de 40e, gedurende 95% van de over 10
      minuten gemiddelde waarden gedurende een week.

      2°. THD is kleiner dan of gelijk aan 6% voor alle harmonische tot en met de 40e, gedurende 99,9% van de over 10
      minuten gemiddelde waarden gedurende een week.

      f. voor spanningsdips geldt dat het gemiddelde van het aantal opgetreden spanningsdips per aansluiting over de
      voorgaande vijf aaneengesloten kalenderjaren kleiner is dan of gelijk is aan:

      1°. 1,2 voor spanningsdips met een duur groter dan of gelijk aan 10 milliseconden en kleiner dan of gelijk aan 200
      milliseconden en een restspanning kleiner dan 40% (klasse B1);

      2°. 1,2 voor spanningsdips met een duur groter dan 200 milliseconden en kleiner dan of gelijk aan 500 milliseconden
      en een restspanning kleiner dan 70% (klasse B2);

      3°. 0,4 voor spanningsdips met een duur groter dan 500 milliseconden en kleiner dan of gelijk aan 5.000
      milliseconden en een restspanning kleiner dan 80% (klasse C).

      4 Voor de overige voorwaarden ten aanzien van spanningskwaliteit geldt de norm NEN-EN 50160:2022
      ‘Spanningskarakteristieken in openbare elektriciteitsnetten’.

      5 De voorwaarden ten aanzien van spanningskwaliteit van de transportdienst zoals genoemd in het eerste tot en met
      het vierde lid zijn niet van toepassing op aansluitingen van netbeheerders.

      6 De voorwaarden ten aanzien van spanningskwaliteit als bedoeld in het eerste tot en met het vierde lid zijn niet
      van toepassing onder abnormale omstandigheden, te weten lijndansen, natuurrampen en overmacht.

      7 Bij de registratie van en de rapportage over de spanningsdips als bedoeld in het tweede lid, onderdeel e, en
      het derde lid, onderdeel f, maakt de netbeheerder bij de hinderlijke spanningsdip onderscheid naar de volgende
      oorzaken:

      a. handeling van een netbeheerder;

      b. handeling van een aangeslotene;

      c. kortsluiting in het net;

      d. kortsluiting in de installatie van een aangeslotene;

      e. abnormale omstandigheden genoemd in het zesde lid;

      f. overige en onbekende oorzaken.

      8 Indien bij de registratie van en de rapportage over de spanningsdips als bedoeld in het tweede lid, onderdeel e,
      en het derde lid, onderdeel f, geen meetgegevens over tenminste vijf volledige jaren beschikbaar zijn, wordt het
      gemiddelde genomen over een zo groot mogelijk aantal wel beschikbare volledige jaren.

      9 De betrouwbaarheid van de geleverde transportdienst bij aangeslotenen op netten met een spanningsniveau
      groter dan 50 kV wordt mede bepaald door de toetsingscriteria die worden gehanteerd bij de planning van
      hoogspanningsnetten, beschreven in [paragraaf 9.3][ref1].

      10 In geval van een aansluiting op het net op zee kan in overleg met alle aangeslotenen op het desbetreffende
      platform worden afgeweken van de eisen in het derde en vierde lid mits op de aansluiting van het net op zee op het
      landelijk hoogspanningsnet wel aan de eisen in het derde en vierde lid wordt voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk9
