  - number: '9.40'
    text: |-
      1 De netbeheerder voert dagelijks de procedure uit zoals beschreven in [artikel 9.41][ref1].

      2 De netbeheerder kan voorafgaand aan de procedure zoals beschreven in [artikel 9.41][ref2] gebruik maken van het
      vermogen dat aangeslotenen of CSP’s overeenkomstig de specificaties in [bijlage 12][ref3] ter beschikking hebben
      gesteld ten behoeve van het oplossen van fysieke congestie.


