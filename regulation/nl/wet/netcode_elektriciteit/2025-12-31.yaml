  - number: '6.11'
    text: |-
      1 Tenzij om technologie-specifieke beperkingen anders overeengekomen, is het HVDC-convertorstation in staat om
      in bedrijf te zijn in de drie regelmodi, als bedoeld in artikel 22 van de Verordening (EU) 2016/1447 (NC HVDC),
      waarbij de netbeheerder van het landelijk hoogspanningsnet de gewenste regelmodus vaststelt.

      2 Tenzij om technologie-specifieke beperkingen anders overeengekomen, is, in aanvulling op de regelmodi, genoemd
      in het eerste lid, een HVDC-convertorstation in staat om in bedrijf te zijn in de spanningsregelmodus, waarbij
      het blindvermogen zich bevindt binnen een door de netbeheerder van het landelijk hoogspanningsnet gespecificeerde
      bandbreedte en waarbij de referentiewaarde voor de spanning wordt afgestemd op het uitgewisselde blindvermogen, als
      bedoeld in [artikel 3.26, zesde lid][ref1], en [artikel 9.14, tweede lid][ref2].

      3 De dode band van de spanningsregeling, als bedoeld in artikel 22, derde lid, onderdeel b, van de Verordening (EU)
      2016/1447 (NC HVDC), kan worden aangepast in stappen van 0,5% van de 1 pu-referentiespanning.

      4 De waarde van het tijdsbestek t voor het bereiken van een verandering van 90% in geleverd blindvermogen, als
      bedoeld in artikel 22, derde lid, onderdeel c, subonderdeel i, van de Verordening (EU) 2016/1447 (NC HVDC), komt
      de netbeheerder, in overleg met de netbeheerder van het landelijk hoogspanningsnet, overeen met de aangeslotene die
      beschikt over een HVDC-systeem en legt deze vast in de aansluit- en transportovereenkomst.

      5 De waarde van het tijdsbestek t voor het bereiken van een verandering van 99% in geleverd blindvermogen, als
      bedoeld in artikel 22, derde lid, onderdeel c, subonderdeel ii, van de Verordening (EU) 2016/1447 (NC HVDC),
      binnen het bereik van 1 tot 60 s, komt de netbeheerder, in overleg met de netbeheerder van het landelijk
      hoogspanningsnet, overeen met de aangeslotene die beschikt over een HVDC-systeem en legt deze vast in de aansluit-
      en transportovereenkomst.

      6 De helling van de blindvermogenscomponent, als bedoeld in artikel 22, derde lid, onderdeel d, van de
      Verordening (EU) 2016/1447 (NC HVDC), komt de netbeheerder, in overleg met de netbeheerder van het landelijk
      hoogspanningsnet, overeen met de aangeslotene die beschikt over een HVDC-systeem en legt deze vast in de aansluit-
      en transportovereenkomst.

      7 Het HVDC-systeem is in staat om de referentiewaarde voor het blindvermogen, als bedoeld in artikel 22, vierde
      lid, van de Verordening (EU) 2016/1447 (NC HVDC), binnen het volledige bereik van het blindvermogen in te stellen,
      met instelstappen van maximaal 5 Mvar of 5% (naargelang wat de laagste waarde is) van het totale blindvermogen,
      waarbij het blindvermogen op het overdrachtspunt wordt geregeld tot een nauwkeurigheid van plus of minus 5 Mvar of
      plus of minus 5% (naargelang wat de laagste waarde is) van het totale blindvermogen.

      8 De minimale stapgrootte voor de instelling van de gewenste waarde van de arbeidsfactor, als bedoeld in artikel
      22, vijfde lid, van de Verordening (EU) 2016/1447 (NC HVDC) is 0,005.

      9 De netbeheerder van het landelijk hoogspanningsnet specificeert de technische vereisten waar de apparatuur, als
      bedoeld in artikel 22, zesde lid, van de Verordening (EU) 2016/1447 (NC HVDC), die vereist is om op afstand de
      regelmodi en de desbetreffende referentiewaarden te kunnen selecteren, aan moet voldoen en legt dit vast in de
      aansluit- en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.26
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.14
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.11
