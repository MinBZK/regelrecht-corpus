  - number: '9.39'
    text: |-
      1 Voor de uitvoering van de regeling van deze paragraaf kan de netbeheerder nadere voorwaarden stellen aan de
      mate waarin de overeenkomstig [artikel 9.35][ref1] aan te leveren gegevens overeenkomen met de realisatie alvorens
      biedingen overeenkomstig [bijlage 11][ref2] van of namens de desbetreffende aangeslotene(n) te accepteren.

      2 De netbeheerder publiceert op de in [artikel 9.8][ref3] bedoelde website per congestiegebied het tijdstip waarop
      overeenkomstig [artikel 9.41, vijfde lid][ref4], biedingen ten uiterste afgeroepen worden.


