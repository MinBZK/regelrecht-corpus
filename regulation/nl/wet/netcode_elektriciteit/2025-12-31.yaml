  - number: '5.2'
    text: |-
      1 De netbeheerders bepalen in onderling overleg welke documentatie aan elkaar ter beschikking wordt gesteld.

      2 De netbeheerders bepalen in onderling overleg op welke wijze toegang tot elkaars terrein of installatie geregeld
      wordt.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel5.2
  - number: '5.3'
    text: |-
      1 Op het overdrachtspunt tussen twee netten wordt blindvermogen gemeten, tenzij de betrokken netbeheerders na
      onderling overleg anders overeenkomen.

      2 Indien de gekoppelde netten van verschillend spanningsniveau zijn, wordt het blindvermogen gemeten aan de
      laagspanningzijde van de transformator.

      3 Op het overdrachtspunt van twee netten van verschillend spanningsniveau is het transformatorveld voorzien van
      een bedrijfsmeting.

      4 De vereiste nauwkeurigheid van de in het eerste en derde lid bedoelde metingen is klasse 0,5 tenzij anders door
      de netbeheerders is overeengekomen. De nauwkeurigheid heeft betrekking op de primaire meetwaarde. De metingen van
      het werkzame vermogen en het blindvermogen zijn uitgevoerd met een vierleider meetsysteem met ongelijk belaste
      fase.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel5.3
  - number: '5.4'
    text: |-
      1 De netbeheerders bereiken, na onderling overleg, bij eerste aansluiting en bij latere wijziging van het net
      overeenstemming omtrent de toe te passen beveiligingsconcepten, als bedoeld in artikel 16, eerste lid, van de
      Verordening (EU) 2016/1388 (NC DCC).

      2 De netbeheerders stellen elkaar de uitschakelcommando’s voor het uitschakelen van de vermogenschakelaars
      aan weerszijden van de transformator ter beschikking. De voor het overbrengen van deze commando’s benodigde
      verbindingen met toebehoren zijn eigendom van de eigenaar van de transformator.

      3 Instellingen van de beveiligingen, het type beveiliging en de inschakelvoorwaarden worden in de aansluit- en
      transportovereenkomst vastgelegd.

      4 De eventuele regeling van de blusspoelinstelling, als bedoeld in artikel 16, vierde lid, van de Verordening (EU)
      2016/1388 (NC DCC) wordt door de betrokken netbeheerders in onderling overleg bepaald.

      5 Ter voorkoming van schade ten gevolge van bedieningsfouten worden elektrische of mechanische vergrendelingen
      tussen scheiders en aarders en de vermogensschakelaars aangebracht.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel5.4
  - number: '5.5'
    text: |-
      In afwijking van de begripsomschrijving van ‘overdrachtspunt’ in de [Begrippencode elektriciteit][ref1], bevindt
      het overdrachtspunt van de aansluiting van het net op zee op het landelijk hoogspanningsnet zich aan de railzijde
      van de railscheider(s) van het desbetreffende afgaande veld in het station van het landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel5.5
    references:
      - id: ref1
        bwb_id: BWBR0037938
  - number: '5.6'
    text: |-
      Distributienetten, aangesloten aan het landelijk hoogspanningsnet, zijn in staat de stationaire bedrijfstoestand
      op het aansluitpunt in stand te houden binnen het blindvermogensbereik, als bedoeld in artikel 15, eerste lid,
      onderdeel b, van de Verordening (EU) 2016/1388 (NC DCC), dat gespecificeerd is als:

      a. maximaal 48% van de maximale importcapaciteit of van de maximale exportcapaciteit, naar gelang welke het grootst
      is, tijdens de import van blindvermogen;

      b. maximaal 48% van de maximale importcapaciteit of van de maximale exportcapaciteit, naar gelang welke het grootst
      is, tijdens de export van blindvermogen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel5.6
  - number: '5.7'
    text: |-
      1 In aanvulling op de voorwaarden in [paragraaf 5.1][ref1] gelden voor een aansluiting van een gesloten
      distributiesysteem op een net de voorwaarden van deze paragraaf voor zover van toepassing op het spanningsniveau
      waarop het gesloten distributiesysteem aangesloten is op het net van de netbeheerder. In paragraaf 5.1 dient
      dan in plaats van ‘de netbeheerders’ gelezen te worden ‘de beheerder van het gesloten distributiesysteem en de
      netbeheerder’.

      2 De voorwaarden in [paragraaf 4.2][ref2] zijn van overeenkomstige toepassing op gesloten distributiesystemen die
      vraagsturing leveren aan een netbeheerder.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk5
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk4
