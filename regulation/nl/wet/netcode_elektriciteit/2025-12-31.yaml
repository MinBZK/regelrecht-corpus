  - number: '11.7'
    text: |-
      In geval van samenloop van het dreigen weg te vallen dan wel wegvallen van een leverancier en
      een BRP voor aansluitingen die door beide partijen bediend worden, gelden in aanvulling op de
      [artikelen 11.2 tot en met 11.6][ref1] de volgende bepalingen:

      a. bij het gelijktijdig nemen van het besluit om een vergunning en een erkenning in te trekken, wordt het besluit
      waarmee de vergunning wordt ingetrokken geacht eerder te zijn genomen dan de beslissing tot het intrekken van de
      erkenning als BRP;

      b. als binnen de opschortingsperiode van de intrekking van de erkenning van de BRP de vergunning van de leverancier
      bij besluit ingetrokken wordt, kan, indien noodzakelijk, de opschortingsperiode van de BRP verlengd worden;

      c. de in onderdeel b bedoelde verlenging loopt ten hoogste tot het einde van de tijdelijke voortzettingsperiode
      die geldt voor de betreffende leverancier en geldt alleen voor de aansluitingen die onder deze vergunninghouder
      vallen. Indien noodzakelijk wordt de garantie, als bedoeld in [artikel 11.1, derde lid][ref2], verlengd, zodat deze
      samenloopt met de verlengde opschortingsperiode.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel11.2
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel11.1
