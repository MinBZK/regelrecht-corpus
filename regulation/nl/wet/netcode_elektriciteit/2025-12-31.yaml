      1 Laagspanningsnetten ontworpen en aangelegd voor 1 april 2018 voldoen uiterlijk 22 september 2027 aan de eisen
      genoemd in de [artikelen 7.8][ref1], [7.9][ref2] en [7.10][ref3].

      2 Onverlet het eerste lid spant de netbeheerder zich er voor in die situaties als eerste aan te pakken die het
