  - number: '10.18'
    text: |-
      1 De netbeheerder stuurt de op grond van [artikel 10.17, negende lid][ref1], verzamelde meetgegevens inzake alle
      aansluitingen op zijn net aan de netbeheerder van het landelijk hoogspanningsnet voor 16:00 uur van de eerste
      kalenderdag na afloop van het desbetreffende etmaal.

      2

      3 Netbeheerders van netten met een spanningsniveau gelijk aan of hoger dan 110 kV verstrekken tevens de
      meetgegevens met betrekking tot de hoeveelheden met andere netten uitgewisselde energie, op vijftienminutenbasis,
      aan de netbeheerder van het landelijk hoogspanningsnet, voor zover deze hoeveelheden niet gemeten worden door de
      netbeheerder van het landelijk hoogspanningsnet.

      4 De netbeheerder stuurt de op grond van [artikel 10.17, tiende lid][ref2], verzamelde meetgegevens aan de
      desbetreffende BRP voor 16:00 uur van de eerste kalenderdag na afloop van het desbetreffende etmaal.

      5 De netbeheerder die aansluitingen in een congestiegebied beheert, stuurt aan de netbeheerder van het landelijk
      hoogspanningsnet voor iedere CG-aangeslotene in dat gebied de hoeveelheid op de desbetreffende aansluitingen met
      het net uitgewisselde energie per onbalansverrekeningsperiode voor 16:00 uur van de eerste werkdag na afloop van
      het desbetreffende etmaal.

      6 De netbeheerder die aansluitingen in een congestiegebied beheert, stuurt aan iedere CG-aangeslotene de
      hoeveelheid op zijn aansluitingen met het net uitgewisselde energie per onbalansverrekeningsperiode voor 16:00 uur
      van de eerste kalenderdag na afloop van het desbetreffende etmaal.


