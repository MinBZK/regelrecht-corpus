  - number: '3.25'
    text: |-
      1 De synchrone productie-eenheid is in staat bij variërende spanning maximaal een hoeveelheid blindvermogen te
      leveren dat gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel
      18, tweede lid, onderdeel b, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG):

      a. gelijk aan 0,55 bij een spanning van 0,9 pu tot 1,05 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,55 en 0,3 bij een spanning tussen 1,05 pu
      en 1,1 pu.

      2 De synchrone productie-eenheid is in staat bij variërende spanning maximaal blindvermogen op te nemen dat
      gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 18, tweede
      lid, onderdeel b, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG):

      a. gelijk aan 0,4 bij een spanning van 1,0 pu tot 1,1 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,1 en 0,4 bij een spanning tussen 0,9 en
      1,0 pu.

      3 De synchrone productie-eenheid is op grond van het eerste tot en met het tweede lid in staat blindvermogen te
      leveren of op te nemen binnen en inclusief de grenzen van het rood gemarkeerde U-Q/Pmax-profiel in onderstaand
      diagram.

      4 De tijdperiode voor de synchrone elektriciteitsproductie-eenheid om over te gaan tot elk bedrijfspunt binnen zijn
      U-Q/Pmax-profiel, als bedoeld in artikel 18, tweede lid, onderdeel b, subonderdeel iv, van de [Verordening (EU)
      2016/631](32531R2016) (NC RfG), is niet meer dan 15 minuten. Afwijkingen worden overeengekomen en vastgelegd in de
      aansluit- en transportovereenkomst of, waar van toepassing, in de overeenkomst voor blindvermogensuitwisseling.

      5 De synchrone elektriciteitsproductie-eenheid is in staat om na een storing zo snel mogelijk de hoeveelheid
      werkzaam vermogen van voor de storing te leveren.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel3.25
  - number: '3.26'
    text: |-
      1 Het U-Q/Pmax-profiel, als bedoeld in artikel 21, derde lid, onderdeel b, subonderdeel i, van de Verordening (EU)
      2016/631 (NC RfG), waarbinnen een power park module blindvermogen moet kunnen leveren en opnemen, is gelijk aan het
      U-Q/Pmax-profiel als bedoeld in [artikel 3.19, eerste tot en met vierde lid][ref1].

      2 Het P-Q/Pmax-profiel, als bedoeld in artikel 21, derde lid, onderdeel c, subonderdeel i, van de Verordening (EU)
      2016/631 (NC RfG), waarbinnen een power park module blindvermogen moet kunnen leveren en opnemen, is gelijk aan het
      P-Q/P-max-profiel als bedoeld in [artikel 3.19, vijfde tot en met negende lid][ref2].

      3 De tijdsperiodes voor een power park module om over te gaan tot elk bedrijfspunt binnen zijn P-Q/P-profiel
      worden overeengekomen tussen de aangeslotene en de netbeheerder, in overleg met de netbeheerder van het landelijk
      hoogspanningsnet. De overeengekomen tijdsperiodes worden vastgelegd in de aansluit- en transportovereenkomst.

      4 Voor de power park module worden de tijden t (voor verandering van 90% van het blindvermogen) en t (voor
      het stabiliseren van het blindvermogen) overeengekomen tussen de netbeheerder en de aangeslotene, in overleg
      met de netbeheerder van het landelijk hoogspanningsnet. De waarden worden vastgelegd in de aansluit- en
      transportovereenkomst.

      5 Voor de parameters van de arbeidsfactor-regelmodus van power park modules, als bedoeld in artikel 21, derde lid,
      onderdeel d, subonderdeel vi, van de Verordening (EU) 2016/631 (NC RfG), geldt dat:

      a. de gewenste waarde van de arbeidsfactor overeengekomen wordt tussen de netbeheerder en de aangeslotene, in
      overleg met de netbeheerder van het landelijk hoogspanningsnet. De overeengekomen waarde wordt vastgelegd in de
      aansluit- en transportovereenkomst;

      b. de tolerantie van de gewenste waarde van de arbeidsfactor plus of min 0,005 is. Bij een arbeidsfactor van 1 is
      de tolerantie op het blindvermogen 10% van het maximale blindvermogen;

      c. de tijdsperiode voor het bereiken van de gewenste waarde van de arbeidsfactor na een abrupte verandering
      van het werkzame vermogen overeengekomen wordt tussen de netbeheerder en de aangeslotene, in overleg met de
      netbeheerder van het landelijk hoogspanningsnet. De overeengekomen waarde wordt vastgelegd in de aansluit- en
      transportovereenkomst.

      6 In de aansluit- en transportovereenkomst is vastgelegd of automatisch blindvermogen door de power park module,
      als bedoeld in artikel 21, derde lid, onderdeel d, subonderdeel vii, van de Verordening (EU) 2016/631 (NC RfG),
      wordt geleverd door middel van:

      a. spannings-regelmodus (sub mode 1) waarbij het uitgewisselde blindvermogen zich bevindt in een overeengekomen
      bandbreedte, die ook wordt opgenomen in de aansluit- en transportovereenkomst;

      b. spannings-regelmodus (sub mode 2) zonder eis ten aanzien van het uitgewisselde blindvermogen;

      c. blindvermogen-regelmodus; of

      d. arbeidsfactor-regelmodus.

      7 Welke aanvullende apparatuur vereist is om de aanpassing van de overeenkomstig het zesde lid van toepassing
      zijnde referentiewaarden op afstand te kunnen uitvoeren, wordt overeengekomen en vastgelegd in de aansluit- en
      transportovereenkomst.

      8 De overeenkomstig het zesde lid van toepassing zijnde referentiewaarden of gewenste waarden worden door de
      netbeheerder gespecificeerd en wordt via telefonisch contact of digitaal bericht ingesteld.

      9 Voor de power park module is de prioriteit van de bijdrage van het werkzaam vermogen dan wel het blindvermogen
      gedurende storingen waarbij fault-ride-through capaciteit vereist is, locatie-specifiek. Deze optie wordt
      overeengekomen tussen de netbeheerder en de aangeslotene, in overleg met de netbeheerder van het landelijk
      hoogspanningsnet, en wordt vastgelegd in de aansluit- en transportovereenkomst.


