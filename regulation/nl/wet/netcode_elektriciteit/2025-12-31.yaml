  - number: '12.4'
    text: |-
      1 Bij het toewijzen van de beschikbare landsgrensoverschrijdende transportcapaciteit van de verbindingen Meeden–
      Duitsland, Hengelo–Duitsland, Doetinchem–Duitsland, Maasbracht–Duitsland, Borssele–België, Geertruidenberg–België,
      Maasbracht–België en Eemshaven–Denemarken worden de volgende categorieën transporten onderscheiden:

      a. jaartransporten, als bedoeld in artikel 9 van de Verordening (EU) 2016/1719 (GL FCA), te weten transporten met
      een looptijd van 1 januari tot en met 31 december;

      b. maandtransporten, als bedoeld in artikel 9 van de Verordening (EU) 2016/1719 (GL FCA), te weten transporten met
      een looptijd van 1 kalendermaand, te beginnen op de eerste dag van die maand;

      c. day-aheadtransporten, als bedoeld in artikel 14, eerste lid, onderdeel a van de Verordening (EU) 2015/1222 (GL
      CACM), met een looptijd van tenminste één klokuur en maximaal één kalenderdag;

      d. intradaytransporten, als bedoeld in artikel 14, eerste lid, onderdeel b van de Verordening (EU) 2015/1222 (GL
      CACM).

      2 Bij de toewijzing van de in het eerste lid genoemde categorieën transporten worden voor de verbindingen Meeden–
      Duitsland, Hengelo–Duitsland, Doetinchem–Duitsland, Maasbracht–Duitsland, Borssele–België, Geertruidenberg–België,
      en Maasbracht–België de volgende uitgangspunten gehanteerd:

      a. 1300 MW komt ter beschikking van de jaartransporten;

      b. tenminste 400 MW en ten hoogste 850 MW komt ter beschikking van maandtransporten;

      c. de onder b bedoelde capaciteit wordt vermeerderd met de jaarcapaciteit die door marktpartijen aan de
      netbeheerder van het landelijk hoogspanningsnet is terugverkocht volgens hoofdstuk 5 van de HAR en volgens artikel
      45 van het SAP, en die in de desbetreffende maand geveild wordt;

      d. het restant van de voor de veiling gereserveerde landsgrensoverschrijdende transportcapaciteit komt ter
      beschikking van het day-aheadcapaciteitsdomein.

      e. het veilig beschikbare deel van het in onderdeel d bedoelde capaciteitsdomein, dat niet wordt gebruikt
      voor day-aheadtransporten, wordt gebruikt om de beschikbare landsgrensoverschrijdende transportcapaciteit voor
      intradaytransporten te bepalen.

      3 De veilig beschikbare landsgrensoverschrijdende transportcapaciteit van de verbinding Eemshaven–Noorwegen
      komt volledig ten goede aan day-aheadtransporten, met een looptijd van ten minste één klokuur en maximaal één
      kalenderdag. De transportcapaciteit die niet wordt gebruikt, komt ter beschikking van de intradaytransporten.

      4 Bij de toewijzing van de in het eerste lid genoemde categorieën transporten worden voor de verbinding Eemshaven–
      Denemarken de volgende uitgangspunten gehanteerd:

      a. de jaar- en maandtransporten worden aangeboden in de vorm van financiële transmissierechten – opties, als
      bedoeld in artikel 33 van de Verordening (EU) 2016/1719 (GL FCA);

      b. de in onderdeel a bedoelde jaar- en maandtransporten worden geveild in overeenstemming met de HAR en het SAP;

      c. voor de in onderdeel a bedoelde jaar- en maandtransporten is een compensatiemaximum van toepassing in
      overeenstemming met artikel 59, derde lid, van de HAR;

      d. een voorstel voor de beschikbare capaciteit voor jaar- en maandtransporten voor de verbinding Eemshaven–
      Denemarken wordt jaarlijks door de netbeheerder van het landelijk hoogspanningsnet aan de Autoriteit Consument en
      Markt ter goedkeuring voorgelegd;

      e. de veilig beschikbare fysieke landsgrensoverschrijdende transportcapaciteit van de verbinding komt volledig ten
      goede aan day-aheadtransporten, met een looptijd van ten minste één klokuur en maximaal één kalenderdag;

      f. de transportcapaciteit die niet wordt gebruikt voor day-aheadtransporten, komt ter beschikking van de
      intradaytransporten.

      5 De netbeheerder van het landelijk hoogspanningsnet neemt bij het ter beschikking stellen van
      landsgrensoverschrijdende transportcapaciteit voor day-aheadtransporten de mogelijkheden met betrekking tot
      saldering van import en export van genomineerde transporten in acht alsmede de mogelijkheid van saldering
      van biedingen voor import en export op de dagveiling overeenkomstig een door hem op te stellen methodiek. De
      netbeheerder van het landelijk hoogspanningsnet neemt bij het ter beschikking stellen van landsgrensoverschrijdende
      transportcapaciteit voor intradaytransporten de mogelijkheden met betrekking tot saldering van import en export
      van genomineerde transporten in acht alsmede de mogelijkheid van saldering van biedingen voor import en export ten
      behoeve van intradayallocatie overeenkomstig een door hem op te stellen methodiek.

      6 De in het vijfde lid genoemde methodiek houdt in ieder geval in dat saldering van import en export per landsgrens
      plaatsvindt.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel12.4
  - number: '12.5'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet verdeelt de in [artikel 12.4, tweede lid][ref1],
      genoemde capaciteit over de verbindingen met buitenlandse netten, tenzij de capaciteit met gebruikmaking van
      stroomgebaseerde aanpak op basis van [artikel 12.19][ref2] wordt bepaald, in welk geval de capaciteit over
      de verbindingen wordt verdeeld tijdens de procedure van toewijzing van het capaciteitsdomein in de impliciete
      toewijzing, waarbij hij onderscheid maakt tussen:

      a. de capaciteit van de verbindingen Meeden–Duitsland, Hengelo–Duitsland, Doetinchem–Duitsland en Maasbracht–
      Duitsland, en

      b. de capaciteit van de verbindingen Borssele–België, Geertruidenberg–België en Maasbracht–België.

      2 De netbeheerder van het landelijk hoogspanningsnet wijst de beschikbare landsgrensoverschrijdende
      transportcapaciteit voor de jaar- en maandtransporten op de landsgrensoverschrijdende verbinding Eemshaven–
      Denemarken aan de marktpartijen toe door middel van expliciete toewijzing.

      3 De netbeheerder van het landelijk hoogspanningsnet stelt de beschikbare landsgrensoverschrijdende
      transportcapaciteit voor day-aheadtransporten op de landsgrensoverschrijdende verbindingen genoemd in het eerste
      lid, onderdelen a en b, alsmede de landsgrensoverschrijdende verbindingen Eemshaven–Noorwegen en Eemshaven–
      Denemarken, aan de marktpartijen ter beschikking door middel van impliciete toewijzing.

      4 De netbeheerder van het landelijk hoogspanningsnet wijst de beschikbare landsgrensoverschrijdende
      transportcapaciteit voor de intradaytransporten op de landsgrensoverschrijdende verbindingen genoemd in het eerste
      en derde lid impliciet toe door middel van continue handel in elektriciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel12.4
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel12.19
