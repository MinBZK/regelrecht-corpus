  - number: 9.1e
    text: |-
      1 Een bestaande aangeslotene met een gecontracteerd transportvermogen voor invoeding op wie de in
      [artikel 9.1, vierde lid][ref1] bedoelde verplichting van toepassing is, wijst binnen drie maanden na de in artikel
      9.1, vijfde lid, bedoelde publicatie een CSP aan en doet binnen drie maanden na de publicatie een aanbod voor het
      leveren van een bijdrage aan het oplossen van fysieke congestie, zoals bedoeld in artikel 9.1, vierde lid.

      2 Een bestaande aangeslotene met een gecontracteerd transportvermogen voor afname op wie de in
      [artikel 9.1, vierde lid][ref2] bedoelde verplichting van toepassing is, wijst binnen 6 maanden na de in artikel
      9.1, vijfde lid, bedoelde publicatie een CSP aan en doet binnen zes maanden na de publicatie een aanbod voor het
      leveren van een bijdrage aan het oplossen van fysieke congestie, zoals bedoeld in artikel 9.1, vierde lid.

      3 Voor nieuwe aansluitingen vindt de in [artikel 9.1, vierde lid][ref3], bedoelde verplichting tot het aanwijzen
      van een CSP plaats voorafgaand aan de ingebruikname van de desbetreffende aansluiting.

      4 In afwijking van [artikel 9.1, vierde lid][ref4], hoeft een aangeslotene geen CSP aan te wijzen wanneer deze
      uitsluitend verplicht is om overeenkomstig [bijlage 12, zevende lid][ref5], een bieding voor capaciteitsbeperking
      te doen.


