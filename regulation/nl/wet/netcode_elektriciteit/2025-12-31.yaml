        paragraaf: '2.1'
  - number: '3.8'
    text: |-
      1 De beveiligingen van de elektriciteitsproductie-eenheid zijn selectief ten opzichte van de beveiligingen in het
      net van de netbeheerder. De netbeheerder kan verlangen dat hiervan een berekening wordt gemaakt.

      2 De beveiliging van de elektriciteitsproductie-eenheid is in ieder geval voorzien van:

      a. een onderspanningsbeveiliging met een aanspreeksnelheid van 2 seconden bij 80% van de nominale spanning;

      b. een overspanningsbeveiliging met een aanspreeksnelheid van 2 seconden bij 110% van de nominale spanning;

      c. een frequentiebeveiliging met een aanspreeksnelheid van 2 seconden bij 47,5 en 51,5 Hz.

      3 De installatie met een synchrone elektriciteitsproductie-eenheid is voorzien van een inrichting die binnen 0,2
      seconden een scheiding met het net bewerkstelligt in geval de netspanning in één of meer fasen daalt tot 70% van de
      nominale waarde, tenzij uit een berekening blijkt dat een snellere uitschakeling noodzakelijk is.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel3.8
  - number: '3.9'
    text: |-
      1 Het sterpunt van een elektriciteitsproductie-eenheid die zowel in eilandbedrijf als in parallelbedrijf kan
      functioneren, is deugdelijk geaard.

      2 Maatregelen bij een elektriciteitsproductie-eenheid worden in ieder geval genomen in geval door harmonischen in
      de installatie de grootte van de nulleiderstroom in dezelfde orde van grootte als die van de fasestroom zal komen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel3.9
  - number: '3.10'
    text: |-
      1 Bij een synchrone elektriciteitsproductie-eenheid die slechts enkele malen per dag start, respectievelijk
      parallel schakelt, wordt de aanloopstroom zodanig beperkt dat de spanningsdaling in het net, ter plaatse van de
      meest nabij gesitueerde aangeslotene, ten hoogste 5% bedraagt.

      2 De (niet-)synchrone elektriciteitsproductie-eenheid vertoont een stabiel gedrag. Als een plotselinge verandering
      van het mechanische aandrijfkoppel optreedt, vinden geen ontoelaatbare elektrische slingeringen plaats.

      3 De aandrijvende machine van een synchrone elektriciteitsproductie-eenheid vertoont een rustig gedrag.

      4 In ieder geval wanneer meer dan één synchrone elektriciteitsproductie-eenheid op een beperkt gedeelte van het
      net parallel draaien, gaat de netbeheerder op basis van berekeningen na of en zo ja welke maatregelen nodig zijn
      teneinde de bijdrage van een synchrone elektriciteitsproductie-eenheid aan het kortsluitvermogen op het net waarop
      zij is aangesloten tot een minimum te beperken.

      5 Wanneer bij een synchrone elektriciteitsproductie-eenheid compensatiecondensatoren worden toegepast, wordt
      de omvang daarvan, en het aantal stappen waarin deze worden geschakeld, in overleg met de beheerder van de
      elektriciteitsproductie-eenheid door de netbeheerder bepaald.

      6 De synchrone elektriciteitsproductie-eenheid is voorzien van een inrichting die na het wegvallen van de
      netspanning de synchrone elektriciteitsproductie-eenheid uitschakelt. Na uitschakeling mag de synchrone
      elektriciteitsproductie-eenheid direct weer worden ingeschakeld.

      7 De synchrone elektriciteitsproductie-eenheid voldoet ten aanzien van het veroorzaken van harmonische stromen
      aan de in NEN-EN 60034-1:2004: ‘Roterende elektrische machines – Deel 1: Kengegevens en eigenschappen’ gestelde
      grenzen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel3.10
  - number: '3.11'
    text: |-
      1 Wanneer bij een door middel van vermogenselektronica gekoppelde elektriciteitsproductie-eenheid
      compensatiecondensatoren worden toegepast, wordt de omvang daarvan, en het aantal stappen waarin deze worden
      geschakeld, in overleg met de beheerder van de elektriciteitsproductie-eenheid door de netbeheerder bepaald.

      2 Een door middel van vermogenselektronica gekoppelde elektriciteitsproductie-eenheid mag, indien de netspanning
      buiten de gestelde grenzen genoemd in [artikel 3.8, tweede lid][ref1], komt, zich van het net vrijschakelen. Na
      uitschakeling mag de door middel van vermogenselektronica gekoppelde elektriciteitsproductie-eenheid direct weer
      inschakelen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.8
