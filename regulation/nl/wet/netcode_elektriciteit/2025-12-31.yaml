  - number: '10.28'
    text: |-
      1 De netbeheerder gaat voor het verzamelen van de meetgegevens ten behoeve van de reconciliatie voor een
      maand, hierna te noemen reconciliatiemaand, voor aansluitingen waarvan de allocatiemethode van de aansluiting,
      als bedoeld in [2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref1], de waarde ‘slimme-
      meter-allocatie’ heeft, uit van de periodieke volumes die betrekking hebben op deze maand die op basis van
      [artikel 5.3.4.5 van de Informatiecode elektriciteit en gas][ref2] zijn bepaald.

      2 De netbeheerder zendt uiterlijk de zesde werkdag van de tweede maand na de reconciliatiemaand de periodieke
      volumes als bedoeld in het eerste lid, geaggregeerd:

      a. per netgebied, per BRP, per energierichting, per tariefperiode aan de netbeheerder van het landelijk
      hoogspanningsnet; en

      b. per netgebied, per BRP, per leverancier, per energierichting, per tariefperiode aan de desbetreffende BRP.

      3 De netbeheerder zendt uiterlijk de zesde werkdag van de vijfde maand na de reconciliatiemaand de periodieke
      volumes als bedoeld in het eerste lid, geaggregeerd:

      a. per netgebied, per BRP, per energierichting, per tariefperiode aan de netbeheerder van het landelijk
      hoogspanningsnet; en

      b. per netgebied, per BRP, per leverancier, per energierichting, per tariefperiode aan de desbetreffende BRP en
      desbetreffende leverancier.

      4 De netbeheerder van het landelijk hoogspanningsnet zendt uiterlijk op de elfde werkdag van de tweede maand na
      reconciliatiemaand en op uiterlijk de elfde werkdag van de vijfde maand na de reconciliatiemaand:

      a. per BRP, per netgebied, per energierichting de op grond van [artikel 10.20][ref3] jo.
      [artikel 10.17, negende lid, onderdeel b][ref4], van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      b. per BRP, per energierichting de op grond van [artikel 10.20][ref5] jo.
      [artikel 10.17, negende lid, onderdeel b][ref6], van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      c. per BRP, per netgebied, per energierichting de op grond van het tweede respectievelijk derde lid, beiden
      onderdeel a, van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      d. per BRP, per energierichting de op grond van het tweede respectievelijk derde lid, beiden onderdeel a van de
      netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      e. per BRP, per netgebied, per energierichting het verschil van de in het tweede respectievelijk derde lid,
      beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens overeenkomstig [artikel 10.20][ref7] jo.
      [artikel 10.17, negende lid, onderdeel b][ref8], aan de desbetreffende BRP;

      f. per BRP, per energierichting het verschil van de in het tweede respectievelijk derde lid, beiden
      onderdeel a, bedoelde verzamelde gegevens en de gegevens overeenkomstig [artikel 10.20][ref9] jo.
      [artikel 10.17, negende lid, onderdeel b][ref10], aan de desbetreffende BRP;

      g. per netbeheerder, per netgebied, per BRP, per energierichting de op grond van [artikel 10.20][ref11] jo.
      [artikel 10.17, negende lid, onderdeel b][ref12], van de netbeheerder ontvangen gegevens aan de desbetreffende
      netbeheerder;

      h. per netbeheerder, per netgebied, per BRP, per energierichting de op grond van het tweede respectievelijk derde
      lid, beiden onderdeel a, van de netbeheerder ontvangen gegevens aan de desbetreffende netbeheerder;

      i. per netbeheerder per netgebied, per BRP, per energierichting, het verschil van de in het tweede respectievelijk
      derde lid, beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens overeenkomstig [artikel 10.20][ref13]
      jo. [artikel 10.17, negende lid, onderdeel b][ref14], aan de desbetreffende netbeheerder;

      j. per netbeheerder per netgebied, per energierichting, het verschil van de in het tweede respectievelijk derde
      lid, beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens overeenkomstig [artikel 10.20][ref15] jo.
      [artikel 10.17, negende lid, onderdeel b][ref16], aan de desbetreffende netbeheerder; en

      k. per netbeheerder, per netgebied, per energierichting, het verschil van de in het tweede respectievelijk derde
      lid, beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens overeenkomstig [artikel 10.20][ref17] jo.
      [artikel 10.17, negende lid, onderdeel b][ref18], aan de BRP die verantwoordelijk is voor de netverliezen van het
      desbetreffende netgebied.

      5 De netbeheerder gaat voor het verzamelen van de meetgegevens ten behoeve van de reconciliatie voor
      een maand, hierna te noemen reconciliatiemaand voor telemetrisch bemeten aansluitingen uit van de
      meetgegevens die hij overeenkomstig [artikelen 6.2.2.6][ref19], [6.2.2.6a][ref20], [6.2.2.15c][ref21]
      en [6.2.2.16h van de Informatiecode elektriciteit en gas][ref22] ontvangen heeft en overeenkomstig
      [paragraaf 6.3 van de Informatiecode elektriciteit en gas][ref23] heeft verwerkt. Indien de netbeheerder voor
      een aansluiting geen meetgegevens voor de reconciliatiemaand heeft ontvangen treden de voor deze aansluiting de
      overeenkomstig [10.20][ref24] jo. [artikel 10.17, negende lid, onderdeel a][ref25] voor de desbetreffende maand
      vastgestelde meetgegevens in de plaats.

      6 De netbeheerder zendt uiterlijk de zesde werkdag van de tweede maand na de reconciliatiemaand de in het vijfde
      lid bedoelde gegevens die ontvangen zijn voor 00:00 uur van de eerste kalenderdag van de tweede maand na afloop van
      de reconciliatiemaand, geaggregeerd:

      a. per netgebied, per BRP, per energierichting, per onbalansverrekeningsperiode aan de netbeheerder van het
      landelijk hoogspanningsnet;

      b. per netgebied, per BRP, per energierichting, per tariefperiode aan de netbeheerder van het landelijk
      hoogspanningsnet;

      c. per netgebied, per BRP, per leverancier, per energierichting, per onbalansverrekeningsperiode aan de
      desbetreffende BRP;

      d. per netgebied, per BRP, per leverancier, per energierichting, per tariefperiode aan de desbetreffende BRP;

      e. per netgebied, per BRP, per aansluiting, per energierichting, per onbalansverrekeningsperiode aan de
      desbetreffende BRP; en

      f. per netgebied, per BRP, per aansluiting, per energierichting, per tariefperiode aan de desbetreffende BRP.

      7 De netbeheerder zendt uiterlijk de zesde werkdag van de vijfde maand na de reconciliatiemaand de in het vijfde
      lid bedoelde gegevens die ontvangen zijn voor 00:00 uur van de eerste kalenderdag van de vijfde maand na afloop van
      de reconciliatiemaand, geaggregeerd:

      a. per netgebied, per BRP, per energierichting, per onbalansverrekeningsperiode aan de netbeheerder van het
      landelijk hoogspanningsnet;

      b. per netgebied, per BRP, per energierichting, per tariefperiode aan de netbeheerder van het landelijk
      hoogspanningsnet;

      c. per netgebied, per BRP, per leverancier, per energierichting, per onbalansverrekeningsperiode aan de
      desbetreffende BRP;

      d. per netgebied, per BRP, per leverancier, per energierichting, per tariefperiode aan de desbetreffende BRP;

      e. per netgebied, per BRP, per aansluiting, per energierichting, per onbalansverrekeningsperiode aan de
      desbetreffende BRP;

      f. per netgebied, per BRP, per aansluiting, per energierichting, per tariefperiode aan de desbetreffende BRP; en

      g. per netgebied, per LV, per BRP, per aansluiting, per energierichting, per tariefperiode aan de desbetreffende
      leverancier.

      8 De netbeheerder van het landelijk hoogspanningsnet zendt uiterlijk op de elfde werkdag van de tweede maand na de
      reconciliatiemaand en op uiterlijk de elfde werkdag van de vijfde maand na de reconciliatiemaand:

      a. per BRP, per netgebied, per energierichting, per onbalansverrekeningsperiode de op grond van
      [artikel 10.20][ref26] jo. [artikel 10.17, negende lid, onderdeel a][ref27], van de netbeheerder ontvangen gegevens
      aan de desbetreffende BRP;

      b. per BRP, per energierichting, per onbalansverrekeningsperiode de op grond van [artikel 10.20][ref28] jo.
      [artikel 10.17, negende lid, onderdeel a][ref29], van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      c. per BRP, per netgebied, per energierichting de op grond van [artikel 10.20][ref30] jo.
      [artikel 10.17, negende lid, onderdeel a][ref31], van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      d. per BRP, per energierichting, de op grond van [artikel 10.20][ref32] jo.
      [artikel 10.17, negende lid, onderdeel a][ref33], van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      e. per BRP, per netgebied, per energierichting, per onbalansverrekeningsperiode de op grond van het zesde
      respectievelijk zevende lid, beiden onderdeel a, van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      f. per BRP, per energierichting, per onbalansverrekeningsperiode de op grond van het zesde respectievelijk zevende
      lid, beiden onderdeel a, van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      g. per BRP, per netgebied, per energierichting de op grond van het zesde respectievelijk zevende lid, beiden
      onderdeel b, van de netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      h. per BRP, per energierichting de op grond van het zesde respectievelijk zevende lid, beiden onderdeel b, van de
      netbeheerder ontvangen gegevens aan de desbetreffende BRP;

      i. per BRP per netgebied, per energierichting, per onbalansverrekeningsperiode het verschil van de in het zesde
      respectievelijk zevende lid, beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens overeenkomstig
      [artikel 10.20][ref34] jo. [artikel 10.17, negende lid, onderdeel a][ref35], aan de desbetreffende BRP;

      j. per BRP, per energierichting, per onbalansverrekeningsperiode het verschil van de in het zesde respectievelijk
      zevende lid, beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens overeenkomstig [artikel 10.20][ref36]
      jo. [artikel 10.17, negende lid, onderdeel a][ref37], aan de desbetreffende BRP;

      k. per BRP, per netgebied, per energierichting het verschil van de in het zesde respectievelijk zevende lid,
      beiden onderdeel b, bedoelde gegevens en de som van alle onbalansverrekeningsperiodes van de in het zevende
      respectievelijk achtste lid, beiden onderdeel a, bedoelde gegevens aan de desbetreffende BRP;

      l. per BRP, per energierichting het verschil van de in het zesde respectievelijk zevende lid, beiden onderdeel b,
      bedoelde gegevens en de som van alle onbalansverrekeningsperiodes van de in het zesde respectievelijk zevende lid,
      beiden onderdeel a, bedoelde gegevens aan de desbetreffende BRP;

      m. per netbeheerder, per netgebied, per BRP, per energierichting, per onbalansverrekeningsperiode de op grond van
      [artikel 10.20][ref38] jo. [artikel 10.17, negende lid, onderdeel a][ref39], van de netbeheerder ontvangen gegevens
      aan de desbetreffende netbeheerder;

      n. per netbeheerder, per netgebied, per BRP, per energierichting de op grond van [artikel 10.20][ref40] jo.
      [artikel 10.17, negende lid, onderdeel a][ref41], van de netbeheerder ontvangen gegevens aan de desbetreffende
      netbeheerder;

      o. per netbeheerder, per netgebied, per BRP, per energierichting, per onbalansverrekeningsperiode de op grond
      van het zesde respectievelijk zevende lid, beiden onderdeel a van de netbeheerder ontvangen gegevens aan de
      desbetreffende netbeheerder;

      p. per netbeheerder, per netgebied, per BRP, per energierichting, de op grond van het zesde respectievelijk zevende
      lid, beiden onderdeel b, van de netbeheerder ontvangen gegevens aan de desbetreffende netbeheerder;

      q. per regionale netbeheerder per netgebied, per BRP, per energierichting, per onbalansverrekeningsperiode het
      verschil, van de in het zesde respectievelijk zevende lid, beiden onderdeel a, bedoelde verzamelde gegevens en
      de gegevens overeenkomstig [artikel 10.20][ref42] jo. [artikel 10.17, negende lid, onderdeel a][ref43], aan de
      desbetreffende regionale netbeheerder;

      r. per regionale netbeheerder, per netgebied, per BRP, per energierichting het verschil van de in het zesde
      respectievelijk zevende lid, beiden onderdeel b, bedoelde gegevens en de som van alle onbalansverrekeningsperiodes
      van de in het zesde respectievelijk zevende lid, beiden onderdeel a, bedoelde gegevens aan de desbetreffende
      regionale netbeheerder;

      s. per regionale netbeheerder per netgebied, per energierichting, per onbalansverrekeningsperiode het verschil,
      van de in het zesde respectievelijk zevende lid, beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens
      overeenkomstig [artikel 10.20][ref44] jo. [artikel 10.17, negende lid, onderdeel a][ref45], aan de desbetreffende
      regionale netbeheerder;

      t. per regionale netbeheerder, per netgebied, per energierichting het verschil van de in het zesde respectievelijk
      zevende lid, beiden onderdeel b, bedoelde gegevens en de som van alle onbalansverrekeningsperiodes van de in
      het zesde respectievelijk zevende lid, beiden onderdeel a, bedoelde gegevens aan de desbetreffende regionale
      netbeheerder;

      u. per regionale netbeheerder, per netgebied, per energierichting, per onbalansverrekeningsperiode het verschil,
      van de in het zesde respectievelijk zevende lid, beiden onderdeel a, bedoelde verzamelde gegevens en de gegevens
      overeenkomstig [artikel 10.20][ref46] jo. [artikel 10.17, negende lid, onderdeel a][ref47], aan de BRP die
      verantwoordelijk is voor de netverliezen van het desbetreffende netgebied; en

      v. per regionale netbeheerder, per netgebied, per energierichting het verschil van de in het zesde respectievelijk
      zevende lid, beiden onderdeel b, bedoelde gegevens en de som van alle onbalansverrekeningsperiodes van de in het
      zesde respectievelijk zevende lid, beiden onderdeel a, bedoelde gegevens aan de BRP die verantwoordelijk is voor de
      netverliezen van het desbetreffende netgebied.

      9 De netbeheerder van het landelijk hoogspanningsnet publiceert de reconciliatieprijs zoals vastgesteld op basis
      van [bijlage 3][ref48], artikel 6, 9 en 10 voor de reconciliatiemaand op haar website uiterlijk de elfde werkdag
      van de maand volgend op de reconciliatiemaand.

      10 De partij die op grond van het tweede of zesde lid gegevens heeft ontvangen van de netbeheerder op uiterlijk de
      zesde werkdag van de tweede maand na de reconciliatie maand, kan tot uiterlijk de laatste kalenderdag van de derde
      maand na de reconciliatiemaand bij de netbeheerder bezwaar maken tegen de van hem ontvangen gegevens.

      11 De partij die op grond van het vierde of achtste lid gegevens heeft ontvangen van de landelijk netbeheerder op
      uiterlijk de elfde werkdag van de tweede maand na de reconciliatie maand, kan tot uiterlijk de laatste kalenderdag
      van de derde maand na de reconciliatiemaand bij de landelijk netbeheerder bezwaar maken tegen de van hem ontvangen
      gegevens.

      12 De netbeheerder van het landelijk hoogspanningsnet zendt uiterlijk op de elfde werkdag van de vijfde maand na
      de reconciliatiemaand hebben aan elke BRP het door hem op grond van het vierde en het achtste lid te betalen of te
      ontvangen bedrag. De netbeheerder hanteert daarbij:

      a. voor de verschillen als bedoeld in het vierde lid de overeenkomstig [bijlage 3][ref49], artikel 9 bepaalde
      prijs;

      b. voor de verschillend als bedoeld in het achtste lid, onderdelen j en u de overeenkomstig [bijlage 3][ref50],
      artikel 9 bepaalde prijs; en

      c. voor de verschillen als bedoeld in het achtste lid, onderdelen l en v de overeenkomstig [bijlage 3][ref51],
      artikel 10 bepaalde prijs.

      13 De BRP die per saldo moeten betalen, dragen er zorg voor dat het te betalen bedrag op de eerste werkdag van
      de zesde maand na de reconciliatiemaand is gestort op de bankrekening die de netbeheerder van het landelijk
      hoogspanningsnet speciaal daarvoor heeft geopend.

      14 Op de eerste werkdag van de zesde maand na de reconciliatiemaand, stort de netbeheerder van het landelijk
      hoogspanningsnet de op grond van het twaalfde lid uit te keren bedragen op een daartoe door hen bekend gemaakt
      bankrekeningnummer van de BRP's. De netbeheerder van het landelijk hoogspanningsnet is niet gehouden meer uit te
      keren dan door de BRP's aan hem is overgedragen.

      15 Indien een BRP zijn erkenning heeft verloren op grond van [artikel 10.35, eerste lid, onderdeel i][ref52],
      en aannemelijk is dat deze BRP niet meer zal betalen, zullen de in de reconciliatie met deze BRP te verrekenen
      bedragen naar evenredigheid over alle andere bij de reconciliatie betrokken BRP's worden verdeeld. Eventuele
      nagekomen ontvangsten van BRP's met betrekking tot aldus naar evenredigheid verdeelde bedragen, worden in een
      nadere verrekening ingebracht ten gunste van alle andere bij de reconciliatie betrokken BRP's.

      16 De netbeheerder van het landelijk hoogspanningsnet publiceert maandelijks op de twaalfde werkdag van de
      vijfde maand na de reconciliatiemaand een overzicht van de verhouding van de gereconcilieerde volumes ten
      opzichte van het totaal over alle netgebieden vastgestelde volume ten behoeve van onbalansverantwoordelijkheid
      per reconciliatiemaand op een publieke website, onderscheiden naar de waarde van de allocatiemethode van de
      aansluiting, als bedoeld in [2.1.3 onderdeel s van de Informatiecode elektriciteit en gas][ref53], te weten
      ‘slimme-meter-allocatie’ en ‘telemetrie’.


