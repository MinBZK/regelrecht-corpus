  - number: '9.44'
    text: |-
      1 Voor het uitvoeren van een overeenkomstig [artikel 9.45, vijfde lid][ref1], opgedragen beperking betaalt de
      netbeheerder een vergoeding overeenkomstig artikel 13, zevende lid, van [Verordening (EU) 2019/943](32843R2019). De
      aangeslotene overlegt daartoe bewijsstukken aan de netbeheerder.

      2 De financiële verrekening als bedoeld in het eerste lid vindt uiterlijk 30 dagen na afloop van de desbetreffende
      kalendermaand plaats.

      3 Als uitzondering op het tweede lid geldt dat de financiële verrekening als bedoeld in het eerste lid voor de
      vergoeding financiële ondersteuning die zou zijn ontvangen zonder de opgedragen beperking, plaatsvindt na afloop
      van het desbetreffende kalenderjaar en uiterlijk 60 dagen nadat de aangeslotene de informatie over de definitief
      vastgestelde financiële ondersteuning aan de netbeheerder heeft verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.45
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel9.44
