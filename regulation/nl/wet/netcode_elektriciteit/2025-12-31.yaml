  - number: '12.8'
    text: |-
      Indien er onvoorziene fysieke congestie optreedt waardoor de veilig beschikbare transportcapaciteit vermindert,
      handelt de netbeheerder van het landelijk hoogspanningsnet als volgt:

      a. De transportcapaciteit voor intradaytransport kan op elk moment van de dag worden verminderd tot 0 MW, indien
      deze capaciteit niet is verdeeld aan marktpartijen.

      b. De transportcapaciteit voor day-aheadtransporten, als bedoeld in [artikel 12.4, tweede lid, onderdeel d][ref1],
      kan tot het moment van publicatie van die capaciteit en uiterlijk 11:00 uur op de dag voorafgaand aan het transport
      verminderd worden tot 0 MW. De transportcapaciteit voor day-aheadtransporten als bedoeld in artikel 12.4, derde
      lid, en vierde lid, onderdeel e, kan tot 11:00 uur op de dag voorafgaand aan het transport worden gereduceerd tot
      0 MW.

      c. Indien de transportcapaciteit als bedoeld in [artikel 12.4, tweede lid, onderdeel d, en derde lid][ref2], na
      het moment van publicatie van die capaciteit en uiterlijk om 11:00 uur op de dag voorafgaand aan het transport
      verminderd dient te worden, voorziet de netbeheerder van het landelijk hoogspanningsnet in vervangend vermogen,
      zodat de beschikbaarheid van de in [artikel 12.6][ref3] genoemde importcapaciteit voor zover gerelateerd aan
      impliciete toewijzing, is gegarandeerd.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel12.4
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel12.4
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel12.6
