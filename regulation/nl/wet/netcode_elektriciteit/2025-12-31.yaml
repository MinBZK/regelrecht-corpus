  - number: '3.29'
    text: |-
      1 De synchrone elektriciteitsproductie-eenheid aangesloten op een net met een spanningsniveau lager dan 300 kV
      is in staat blindvermogen te leveren, als bedoeld in artikel 18, tweede lid, onderdeel b, subonderdeel i, van de
      [Verordening (EU) 2016/631](32531R2016) (NC RfG), overeenkomstig [artikel 3.25, eerste en tweede lid][ref1].

      2 De synchrone elektriciteitsproductie-eenheid aangesloten op een hoogspanningsnet met een spanningsniveau gelijk
      aan of groter dan 300 kV is in staat bij variërende spanning maximaal een hoeveelheid blindvermogen te leveren dat
      gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 18, tweede
      lid, onderdeel b, subonderdeel i, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG):

      a. gelijk aan 0,3 bij een spanning van 1,05pu;

      b. gelijk aan 0,55 bij een spanning van 0,9 pu tot 1 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,55 en 0,3 bij een spanning van 1 pu tot
      1,05 pu.

      3 De synchrone elektriciteitsproductie-eenheid aangesloten op een hoogspanningsnet met een spanningsniveau gelijk
      aan of groter dan 300 kV is in staat bij variërende spanning maximaal een hoeveelheid blindvermogen op te nemen dat
      gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 18, tweede
      lid, onderdeel b, subonderdeel i, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG):

      a. gelijk aan 0,1 bij een spanning van 0,9 pu;

      b. gelijk aan 0,4 bij een spanning van 1 pu tot 1,05 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,1 en 0,4 bij een spanning van 0,9 pu tot
      1 pu.

      4 De synchrone elektriciteitsproductie-eenheid aangesloten op een hoogspanningsnet met een spanningsniveau gelijk
      aan of groter dan 300 kV is op grond van het tweede en het derde lid in staat blindvermogen te leveren of op te
      nemen binnen en inclusief de grenzen van het rood gemarkeerde profiel in onderstaand U-Q/Pmax-diagram:

      5 De tussen de aangeslotene en netbeheerder van het landelijk hoogspanningsnet overeengekomen parameters en
      instellingen van de componenten van het spanningsregel-systeem van de synchrone elektriciteitsproductie-eenheid,
      als bedoeld in artikel 19, tweede lid, onderdeel a, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG), worden
      vastgelegd in een bijlage bij de aansluit- en transportovereenkomst.

      6 De synchrone elektriciteitsproductie-eenheid die is aangesloten op netten met een spanningsniveau van 220 kV en
      hoger worden uitgerust met een PSS-functie om vermogensoscillaties te dempen, als bedoeld in artikel 19, tweede
      lid, onderdeel b, subonderdeel v, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG).

      7 De tussen de netbeheerder van het landelijk hoogspanningsnet en de aangeslotene overeengekomen technische
      capaciteit van de elektriciteitsproductie-eenheid om bij te dragen tot de rotorhoekstabiliteit onder
      storingsomstandigheden, als bedoeld in artikel 19, derde lid, van de [Verordening (EU) 2016/631](32531R2016) (NC
      RfG), worden vastgelegd in de aansluit- en transportovereenkomst.


