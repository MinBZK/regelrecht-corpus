  - number: '9.3'
    text: |-
      1 Indien in de uitvoering of de actuele bedrijfsvoering een transportprobleem ontstaat, hanteert de netbeheerder de
      procedure als genoemd in [artikel 9.2, derde en negende lid][ref1].

      2 De netbeheerder is bevoegd om in de actuele bedrijfsvoering, na het verstrijken van het tijdstip als bedoeld
      in [bijlage 11, tweede lid, onderdeel d][ref2], belasting af te schakelen of om aangeslotenen, niet zijnde
      netbeheerders, opdracht te geven om meer of minder af te nemen of in te voeden, gericht op het beperken of
      voorkomen van:

      a. een onderbreking van de transportdienst ten gevolge van een storing; of

      b. het ontstaan van schade aan het net of delen daarvan.

      3 In geval van dreigende grootschalige storingen is de netbeheerder bevoegd om belasting af te schakelen of om
      opdracht te geven om meer of minder te produceren of om een aangesloten regionale netbeheerder te verplichten de
      hoeveelheid te transporteren werkzaam vermogen of blindvermogen te verminderen.

      4 In geval van een onverwachte onderbreking van de transportdienst die haar oorzaak vindt in het net van de
      netbeheerder, kan de netbeheerder de transportdienst hervatten zonder de aangeslotene voorafgaand te waarschuwen.

      5 In geval van dreigende grootschalige storingen heeft de netbeheerder van het landelijk hoogspanningsnet
      voorrang boven de overige netbeheerders ten aanzien van het aanspreken van producenten ten behoeve van
      productieverschuivingen of andere beschikbare middelen.

      6 De netbeheerders spreken met elkaar af wie de koppelverbinding sluit.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.2
      [ref2]: https://wetten.overheid.nl/BWBR0037940
