  - number: 9.1f
    text: |-
      1 De in [artikel 9.1, derde en vierde lid][ref1], bedoelde verplichting tot het leveren van een bijdrage aan
      het oplossen van fysieke congestie met behulp van redispatch overeenkomstig [bijlage 11][ref2] of met behulp van
      capaciteitsbeperking overeenkomstig [bijlage 12, zevende lid][ref3], betekent dat elke in artikel 9.1, derde en
      vierde lid, bedoelde aangeslotene al zijn beschikbare vermogen aanbiedt. De aangeslotene neemt hierbij de in het
      tweede lid bedoelde niet-bindende leidraad als uitgangspunt.

      2 De gezamenlijke netbeheerders stellen in samenspraak met de representatieve organisaties van partijen op de
      elektriciteitsmarkt als bedoeld in [artikel 33 van de Elektriciteitswet 1998][ref4] een niet-bindende leidraad op
      met daarin per type aangeslotene, onderscheiden naar aangeslotenen die beschikken over een elektriciteitsproductie-
      eenheid, een elektriciteitsopslageenheid, een verbruiksinstallatie of een gesloten distributiesysteem, een
      nadere indicatie van welk vermogen redelijkerwijs verstaan wordt onder het in het eerste lid bedoelde beschikbare
      vermogen, onderscheiden naar redispatch, overeenkomstig [bijlage 11][ref5] en capaciteitsbeperking, overeenkomstig
      [bijlage 12, zevende lid][ref6], alsmede onderscheiden naar op het net in te voeden vermogen en van het net af te
      nemen vermogen.

      3 De gezamenlijke netbeheerder publiceren de in het tweede lid bedoelde leidraad op een in [artikel 9.8][ref7]
      bedoelde door of namens de gezamenlijke netbeheerders beheerde website.

      4 Een aangeslotene op wie de in [artikel 9.1, derde en vierde lid][ref8], bedoelde verplichting betrekking heeft
      en die niet of slechts in beperktere mate dan volgt uit de in het tweede lid bedoelde leidraad in staat is om een
      bijdrage te leveren aan het oplossen van fysieke congestie stelt de netbeheerder hier schriftelijk en onderbouwd
      van op de hoogte.


