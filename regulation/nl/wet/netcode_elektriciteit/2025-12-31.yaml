  - number: '10.27'
    text: |-
      1 De netbeheerder gaat voor het verzamelen van de meetgegevens ten behoeve van de reconciliatie
      over maand M voor aansluitingen waarvan de allocatiemethode van de aansluiting, bedoeld in
      [2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref1], de waarde ‘profielallocatie’ heeft, uit van
      meterstanden die betrekking hebben op maand M en die uiterlijk op de laatste dag van maand M+3 zijn vastgesteld.

      2 De netbeheerder, niet zijnde de netbeheerder van het landelijk hoogspanningsnet, zendt uiterlijk de laatste
      werkdag van maand M+4 het aan een BRP toe te rekenen totale reconciliatievolume voor de reconciliatieperiode zoals
      bedoeld in [bijlage 2][ref2] aan de desbetreffende BRP en deze totalen van alle betrokken BRP's aan de netbeheerder
      van het landelijk hoogspanningsnet.

      3 De netbeheerder zendt uiterlijk de tiende werkdag van maand M+5 aan de BRP, ter specificatie van de volgens het
      vierde lid te ontvangen gegevens de volgende gegevens per gereconcilieerde aansluiting en per kalendermaand:

      a. de kalendermaand waarin de reconciliatierun heeft plaatsgevonden;

      b. de kalendermaand waarover het gereconcilieerde volume is vastgesteld;

      c. de EAN-code van de aansluiting;

      d. de bedrijfs EAN-code van de BRP;

      e. de bedrijfs EAN-code van de leverancier;

      f. de EAN-code van het netgebied waartoe de aansluiting behoort;

      g. het op basis van [artikel 10.20, tweede lid][ref3], toegerekende volume tijdens normaaluren;

      h. het op basis van [artikel 10.20, tweede lid][ref4], toegerekende volume tijdens laaguren;

      i. het op basis van meterstanden berekende volume tijdens normaaluren;

      j. het op basis van meterstanden berekende volume tijdens laaguren.

      4 De netbeheerder van het landelijk hoogspanningsnet zendt uiterlijk op de tiende werkdag van maand M+5 aan de BRP
      de volgende gegevens:

      a. het totaal van de in het tweede lid bedoelde verzamelde gegevens;

      b. de reconciliatieprijs, voor de normaaluren en de laaguren, wordt bepaald overeenkomstig [bijlage 3][ref5],
      artikel 6; en

      c. het totaal nog te betalen of te ontvangen bedrag.

      5 De BRP's die per saldo moeten betalen, dragen er zorg voor dat de te betalen bedragen op de eerste dinsdag
      na de in het vierde lid bedoelde moment zijn gestort op een bankrekening die de netbeheerder van het landelijk
      hoogspanningsnet daartoe heeft opgegeven, tenzij tussen bedoelde moment en de eerste dinsdag niet meer dan drie
      werkdagen zijn gelegen. In dat geval dragen de BRP's er zorg voor dat de te betalen bedragen op de daaropvolgende
      dinsdag zijn gestort op de bankrekening van de netbeheerder van het landelijk hoogspanningsnet.

      6 Op de woensdag volgende op die in het vijfde lid bedoelde dinsdag stort de netbeheerder van het landelijk
      hoogspanningsnet de op grond van het vierde lid uit te keren bedragen op een daartoe door hen bekend gemaakt
      bankrekeningnummer van de BRP's die per saldo ontvangen. De netbeheerder van het landelijk hoogspanningsnet is niet
      gehouden meer uit te keren dan door de BRP's aan hem is overgedragen.

      7 Indien een BRP zijn erkenning heeft verloren op grond van [artikel 10.35, eerste lid, onderdeel i][ref6],
      en aannemelijk is dat deze BRP niet meer zal betalen, zullen de in de reconciliatie met deze BRP te verrekenen
      bedragen naar evenredigheid over alle andere bij de reconciliatie betrokken BRP's worden verdeeld. Eventuele
      nagekomen ontvangsten van BRP's met betrekking tot aldus naar evenredigheid verdeelde bedragen, worden in een
      nadere verrekening ingebracht ten gunste van alle andere bij de reconciliatie betrokken BRP's.

      8 Indien de in het vijfde en zesde lid bedoelde dinsdag of woensdag niet op een werkdag valt, schuiven de termijnen
      op tot de eerstvolgende werkdag.

      9 De formules en de rekenmodellen die de netbeheerders hanteren bij het bepalen van de te reconciliëren volumes
      zijn vermeld in [bijlage 3][ref7].

      10 De netbeheerders leggen ten behoeve van het reconciliatieproces de gegevens vast volgens [bijlage 2][ref8].

      11 Verschillen tussen de historische allocatie en de herberekende allocatie worden tussen desbetreffende
      netbeheerder en BRP verrekend tegen de reconciliatieprijs, zoals genoemd in artikel 10.27, vierde lid, onderdeel b.

      12 In afwijking van het eerste lid kunnen partijen overeenkomen om verrekening achterwege te laten indien de kosten
      van het verrekenen substantieel zijn ten opzichte van het te verrekenen bedrag.

      13 Netbeheerders en BRP's melden uiterlijk op 31 oktober van het tweede kalenderjaar na een verbruiksjaar,
      onderbouwd, aan een wederpartij welke verschillen zij wensen te verrekenen.

      14 De wederpartij in een verzoek als bedoeld in het derde lid heeft tot uiterlijk 31 december van dat jaar de tijd
      te reageren op het desbetreffende verzoek.


