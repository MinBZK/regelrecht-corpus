  - number: 7.1e
    text: |-
      1 Een groep van twee of meer aangeslotenen kan op grond van [artikel 24 van de Elektriciteitswet 1998][ref1], en
      indien de netbeheerder daartoe de mogelijkheid biedt, met de netbeheerder een groepstransportovereenkomst afsluiten
      indien:

      a. elke aangeslotene voor de afzonderlijke aansluiting(en) waarmee hij deelneemt aan de groep een
      aansluitovereenkomst met de netbeheerder heeft afgesloten;

      b. elke aangeslotene voor de aansluiting(en) waarmee hij deelneemt aan de groep geen andere transportovereenkomst
      heeft afgesloten;

      c. alle aangeslotenen die deel uitmaken van de groep gezamenlijk een gemachtigde in de zin van
      [artikel 3:60 van het Burgerlijk Wetboek][ref2] hebben aangewezen om namens hen met de netbeheerder te handelen en
      de groepstransportovereenkomst met de netbeheerder af te sluiten;

      d. elke aansluiting voorzien is van een telemetriegrootverbruikmeetinrichting;

      e. de dimensionering van elke meetinrichting van de aansluitingen is afgestemd op de aansluitcapaciteit van de
      desbetreffende aansluiting;

      f. in geval van aansluitingen op een net met een spanningsniveau lager dan 110 kV, alle aansluitingen waarmee wordt
      deelgenomen aan de groep:

      1°. grootverbruikaansluitingen zijn;

      2°. behoren tot de aansluitcapaciteitscategorieën als bedoeld in de
      [bijlage A van de Tarievencode elektriciteit][ref3], onderdelen A.3 tot en met A.7, waarbij geldt dat:

      i) aansluitingen die behoren tot de aansluitcapaciteitscategorieën A.3 tot en met A.5 gezamenlijk één groep kunnen
      vormen;

      ii) indien de netbeheerder daartoe de mogelijkheid biedt, aansluitingen die behoren tot de
      aansluitcapaciteitscategorieën A.3 tot en met A.5 en A.6, voor zover de A.6 aansluitingen alleen gebruikt worden om
      elektriciteit in te voeden, gezamenlijk één groep kunnen vormen;

      iii) aansluitingen die behoren tot de aansluitcapaciteitscategorie A.6 gezamenlijk één groep kunnen vormen;

      iv) aansluitingen die behoren tot de aansluitcapaciteitscategorie A.7 gezamenlijk één groep kunnen vormen;

      v) Indien de netbeheerder daartoe de mogelijkheid biedt, aansluitingen die behoren tot de
      aansluitcapaciteitscategorieën A.6 en A.7 gezamenlijk één groep kunnen vormen;

      3°. in de normale bedrijfsvoering zijn aangesloten op:

      i) een middenspanningsrail of middenspanningsrails die galvanisch met elkaar verbonden zijn, of
      middenspanningsring(en), of MS/LS-transformatorstations, of een combinatie van deze aansluitwijzen voor
      aansluitingen die behoren tot de aansluitcapaciteitscategorieën A.3 tot en met A.5 en aansluitingen die behoren tot
      de aansluitcapaciteitscategorie A.6 en die alleen gebruikt worden om elektriciteit in te voeden; of

      ii) een middenspanningsrail of middenspanningsrails die galvanisch met elkaar verbonden zijn voor aansluitingen die
      behoren tot de aansluitcapaciteitscategorieën A.6 en/of A.7; of

      iii) een hoogspanningsrail of hoogspanningsrails die galvanisch met elkaar verbonden zijn voor aansluitingen die
      behoren tot de aansluitcapaciteitscategorieën A.6 en/of A.7.

      4°. de betrouwbaarheid en veiligheid van het net en het doelmatig netbeheer geborgd blijven, waarbij de
      netbeheerder voor de beoordeling hiervan de volgende criteria in acht neemt:

      i) de mate waarin de spanningshuishouding door het benutten van het met de groepstransportovereenkomst
      gecontracteerde transportvermogen wordt beïnvloed;

      ii) de belastbaarheid van netelementen die benodigd zijn voor het benutten van het met de
      groepstransportovereenkomst gecontracteerde transportvermogen;

      iii) de mate waarin het benutten van het met de groepstransportovereenkomst gecontracteerde transportvermogen
      aanleiding geeft tot directe netinvesteringen; en

      iv) de mate waarin het benutten van het met de groepstransportovereenkomst gecontracteerde transportvermogen
      invloed heeft op de vermogensstromen in het betreffende netdeel;

      g. in geval van aansluitingen op een net met een spanningsniveau van 110 kV of hoger:

      1°. aansluitingen die behoren tot de aansluitcapaciteitscategorie A.7 gezamenlijk één groep kunnen vormen;

      2°. alle afzonderlijke aansluitingen waarmee wordt deelgenomen aan de groep zijn aangesloten op hetzelfde station;
      en

      3°. de betrouwbaarheid en veiligheid van het net en het doelmatig netbeheer geborgd blijven, waarbij de
      netbeheerder voor de beoordeling hiervan de criteria genoemd in artikel 7.1e, eerste lid, onderdeel f, onder 4º,
      punt i tot en met iv, in acht neemt.

      2 De netbeheerder informeert de gemachtigde van een groep over het beoordelingsproces zoals bedoeld in het eerste
      lid en de uitkomst daarvan, waarbij tenminste geldt dat:

      a. de netbeheerder de gemachtigde van een groep van aangeslotenen binnen een redelijke termijn schriftelijk
      informeert of het mogelijk is om op grond van het eerste lid een groep te vormen; en

      b. de netbeheerder de gemachtigde van een groep van aangeslotenen binnen een redelijke termijn schriftelijk
      informeert indien de netbeheerder het op grond van het eerste lid niet mogelijk acht dat een groep gevormd wordt,
      waarbij de weigering van de netbeheerder is voorzien van een deugdelijke motivering en de relevante informatie op
      basis waarvan de netbeheerder tot de weigering is gekomen.

      3 De gemachtigde van een groep van aangeslotenen die gezamenlijk een groepstransportovereenkomst wil afsluiten of
      wijzigen doet daartoe een verzoek bij de netbeheerder.

      4 De netbeheerder zet bij het aangaan van een groepstransportovereenkomst of bij een wijziging van
      de groepssamenstelling de individuele aansluit- en transportovereenkomsten om in een gezamenlijke
      groepstransportovereenkomst voor de groep en een individuele aansluitovereenkomst voor elk van de afzonderlijke
      aangeslotenen.

      5 In afstemming met de gemachtigde van een groep van aangeslotenen bepaalt de netbeheerder bij het aangaan van
      de groepstransportovereenkomst, en bij een wijziging van de groepssamenstelling, behoudens de in het achtste lid
      omschreven situatie, binnen een redelijke termijn het gecontracteerd transportvermogen voor invoeding en voor
      afname dat aan de groep aangeboden wordt, waarbij door de netbeheerder ten minste de volgende gegevens worden
      betrokken:

      a. het gewenste netgebruik van de groep;

      b. indien aanwezig, de historische jaarprofielen van de afgelopen 24 maanden van aangeslotenen die individueel
      gecontracteerd transportvermogen hebben;

      c. de geprognosticeerde gebruiksprofielen van aangeslotenen die individueel gecontracteerd transportvermogen
      hebben, maar waarvan geen historisch jaarprofiel beschikbaar is;

      d. de gelijktijdigheid van het netgebruik van de aangeslotenen die deelnemen aan de groep, waaronder de
      gelijktijdigheid van invoeding en afname van elektriciteit; en

      e. de verwachte toekomstige transportbehoefte van de aangeslotenen die deelnemen aan de groep en de concrete
      toekomstplannen waaruit blijkt dat zij dit vermogen binnen een redelijke termijn nodig hebben.

      6 Indien de netbeheerder een aangeslotene die voor een aansluiting waarmee hij deelneemt aan een
      groepstransportovereenkomst overeenkomstig [artikel 24, eerste lid, van de Elektriciteitswet 1998][ref4] een
      aanbod voor het uitvoeren van transport doet, dan deelt de aangeslotene de netbeheerder mee of hij het aangeboden
      transportvermogen op grond van het vijfde lid inbrengt in de groep of dat hij een individuele aansluit- en
      transportovereenkomst aangaat voor de desbetreffende aansluiting en met de desbetreffende aansluiting uittreedt uit
      de groep.

      7 a. Een groep kan eenmalig bij het aangaan van een groepstransportovereenkomst bepalen of de individuele leden van
      de groep gedurende een transitieperiode van maximaal drie jaar vanaf het aangaan van de groepstransportovereenkomst
      bij het verlaten van de groep kunnen terugvallen op het gecontracteerde transportvermogen waar de desbetreffende
      aangeslotene voorafgaand aan deelname aan de groepstransportovereenkomst over beschikte, eventueel vermeerderd met
      aanvullend vermogen zoals bedoeld in het zesde lid, waarover de gemachtigde de netbeheerder informeert.

      b. Indien de groep gedurende de transitieperiode de duur hiervan wenst in te korten ten opzichte van de duur die
      de groep bij het aangaan van de groepstransportovereenkomst in overeenstemming met onderdeel a heeft bepaald,
      informeert de gemachtigde de netbeheerder hierover.

      8 Bij uittreden uit een groepstransportovereenkomst na afloop van de transitieperiode kan een aangeslotene die de
      groep verlaat een deel van het groepstransportvermogen meenemen indien:

      a. de groep onderling afspraken heeft gemaakt en deze heeft vastgelegd over een verdeling tussen de aangeslotene
      die de groep verlaat en de groep; en

      b. de netbeheerder getoetst heeft of bij toepassing van de verdeling als bedoeld in onderdeel a de betrouwbaarheid
      en veiligheid van het net en het doelmatig netbeheer geborgd blijven, waarbij de netbeheerder voor de beoordeling
      hiervan de criteria genoemd in het eerste lid, onderdeel f, onder 4°, punt i tot en met iv, in acht neemt.

      9 Bij uittreding uit de groep past de netbeheerder de groepstransportovereenkomst aan en zet de netbeheerder de
      groepstransportovereenkomst voor de uittredende aangeslotene binnen een redelijke termijn om in een individuele
      aansluit- en transportovereenkomst.


