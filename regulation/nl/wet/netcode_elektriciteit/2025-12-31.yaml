  - number: '10.8'
    text: |-
      1 De financiële zekerheid, bedoeld in [artikel 10.7, vierde lid, onderdeel b][ref1], wordt gesteld in de vorm van
      een bankgarantie overeenkomstig een door de netbeheerder van het landelijk hoogspanningsnet uit te geven model,
      al dan niet, naar keuze van de BRP, aangevuld met een bij de netbeheerder van het landelijk hoogspanningsnet
      aangehouden deposito.

      2 De omvang van de door een BRP te stellen financiële zekerheid wordt afgeleid van:

      a. het hoogste netto-transactievolume in MWh van die BRP met enige andere BRP voor alle uren gedurende één etmaal,
      en;

      b. de totale transportcapaciteit van de aansluitingen van grootverbruikers, waarvoor hij
      balanceringsverantwoordelijkheid draagt.

      3 De eerste maal is de omvang van de te stellen financiële zekerheid gebaseerd op het door de BRP verwachte hoogste
      netto-transactievolume als bedoeld in het tweede lid, onderdeel a, met een ondergrens van 50 MW.

      4 De in het tweede lid, onderdeel a, bedoelde omvang wordt vermenigvuldigd met de gemiddelde marktprijs van energie
      over een periode van drie maanden voorafgaand aan de bepaling van de omvang van de te stellen financiële zekerheid,
      met een ondergrens van € 40 per MWh. Het resulterende bedrag wordt in het dertiende lid aangeduid met de letter
      'A'.

      5 Indien wordt vastgesteld dat het hoogste netto-transactievolume waarop de omvang van de zekerstelling is
      gebaseerd meer dan incidenteel wordt overschreden, verhoogt de BRP de zekerstelling op eerste schriftelijke verzoek
      van de netbeheerder van het landelijk hoogspanningsnet, waarbij de nieuwe omvang zal worden gebaseerd op het
      hoogste netto-transactievolume dat in de zes voorafgaande weken gedurende één etmaal is vastgesteld.

      6 Indien wordt vastgesteld dat het daadwerkelijk hoogste netto-transactievolume op etmaalbasis structureel
      lager is dan het hoogste netto-transactievolume waarop de omvang van de zekerstelling is gebaseerd, verleent
      de netbeheerder van het landelijk hoogspanningsnet op schriftelijk verzoek van de BRP toestemming tot verlaging
      van de zekerstelling, waarbij de nieuwe omvang zal worden gebaseerd op het gemiddelde van de hoogste dagelijkse
      nettotransactievolumes in de zes voorafgaande weken, met een ondergrens van 50 MW.

      7 Indien een BRP balanceringsverantwoordelijkheid voor aansluitingen van grootverbruikers draagt, heeft het in
      het vijfde en zesde lid bepaalde zowel betrekking op de transactievolumes van de BRP als op de transportcapaciteit
      van de aansluitingen waarvoor hij balanceringsverantwoordelijkheid draagt, terwijl bovendien geldt dat indien in
      enige maand de totale capaciteit van de aansluitingen waarvoor de balanceringsverantwoordelijkheid bestaat met meer
      dan 50 MW wordt uitgebreid, de BRP gehouden is daarvan onverwijld mededeling te doen aan de netbeheerder van het
      landelijk hoogspanningsnet.

      8 De transportcapaciteit, bedoeld in het tweede lid, onderdeel b, wordt bepaald aan de hand van de opgave door de
      andere netbeheerders aan de netbeheerder van het landelijk hoogspanningsnet, waarbij de andere netbeheerders per
      BRP eens per maand aangeven hoeveel aansluitingen vallen in de klasse:

      a. 2–10 MW;

      b. 11–25 MW;

      c. 26–50 MW;

      d. groter dan 50 MW, met vermelding van de capaciteit per aansluiting in deze klasse.

      9 Per BRP wordt voor de in het achtste lid, onderdelen a tot en met c, genoemde klassen per klasse het aantal
      aansluitingen in die klasse vermenigvuldigd met de laagste capaciteit van die klasse.

      10 Voor de in het achtste lid, onderdeel d, genoemde klasse wordt uitgegaan van het totaal van de feitelijke
      capaciteit van de aansluitingen in die klasse.

      11 Het in het tweede lid, onderdeel b, bedoelde element voor de bepaling van de omvang van de door een BRP
      te stellen financiële zekerheid is gebaseerd op de overeenkomstig het achtste tot en met tiende lid bepaalde
      capaciteit voor die BRP, vermenigvuldigd met 24, met een ondergrens van 50 MW.

      12 Het in het elfde lid bedoelde product wordt vermenigvuldigd met de gemiddelde marktprijs van energie over een
      periode van drie maanden voorafgaand aan de bepaling van de omvang van de te stellen financiële zekerheid, met een
      ondergrens van € 40 per MWh. Het resulterende bedrag wordt in het dertiende lid aangeduid met de letter ‘B’.

      13 Het bedrag waarvoor de BRP financiële zekerheid dient te stellen, bedraagt:

      a. twee maal A indien dat groter is dan of gelijk aan B; of

      b. A plus B indien twee maal A kleiner is dan B.

      14 In afwijking van het dertiende lid bedraagt de zekerstelling € 100.000 indien de BRP een NEMO is, blijkend uit
      vermelding op de in artikel 4, tiende lid, van [Verordening (EU) 2015/1222](32015R1222) (GL CACM) bedoelde lijst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.7
