  - number: '9.37'
    text: |-
      1 Deze paragraaf bevat de uitvoeringsregels voor congestiemanagement met inzet van de middelen als benoemd in
      [artikel 9.31][ref1].

      2 De aangeslotene kan de uitvoering van de regeling van deze paragraaf overdragen aan een CSP.

      3 Een CSP dient voor elke aansluiting of groep van aansluitingen waarmee hij biedingen overeenkomstig
      [bijlage 11][ref2] wil doen, dan wel waarmee hij wil bijdragen aan het oplossen van fysieke congestie
      overeenkomstig [bijlage 12][ref3] daartoe op grond van [artikel 9.34][ref4] gerechtigd te zijn.


