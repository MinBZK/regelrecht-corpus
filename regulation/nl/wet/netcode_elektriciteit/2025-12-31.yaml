  - number: '9.23'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet contracteert de initiële FCR-verplichting overeenkomstig
      de eisen die aan hem gesteld zijn ten aanzien van het contracteren van energie en vermogen op een
      marktconforme, transparante en non-discriminatoire wijze met inachtneming van de methodologie op basis van
      artikel 33 van de Verordening (EU) 2017/2195 (GL EB) betreffende de samenwerking tussen meerdere Europese
      transmissiesysteembeheerders om balanceringscapaciteit gezamenlijk in te kopen en uit te wisselen.

      2 De netbeheerder van het landelijk hoogspanningsnet maakt een gedetailleerde beschrijving van het
      contracteringsmechanisme, de administratieve en technische eisen en regels waaraan voldaan moet worden om deel
      te kunnen nemen alsook de resultaten van het contracteren (inclusief prijsinformatie) via zijn openbare webpagina
      publiek. Tevens zal verdere relevante informatie tijdig via deze webpagina beschikbaar worden gemaakt, waaronder
      maar niet beperkt tot tijdschema’s.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel9.23
  - number: '9.24'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet publiceert op zijn website een verwijzing naar de
      informatie die Entso-E op zijn website publiceert aangaande het onbalansnettingsproces en de uitwisseling van
      balanceringsenergie via het Europees platform voor de uitwisseling van balanceringsenergie uit aFRR als bedoeld in
      artikel 21 van de [Verordening (EU) 2017/2195](32017R2195) (GL EB), waaronder:

      a. welke participanten deelnemen in de overeenkomst bedoeld in [artikel 9.20, eerste lid][ref1], en per wanneer zij
      participant zijn;

      b. de actuele omvang van de onbalansnettingvermogensuitwisseling;

      c. de actuele omvang van de uitwisseling balanceringsenergie uit aFRR.

      2 De netbeheerder van het landelijk hoogspanningsnet heeft tot taak de energiebalans met het buitenland te bewaken,
      in voorkomend geval te herstellen en verwerft het daarvoor benodigde vermogen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.20
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel9.24
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '9.20'
        hoofdstuk: '9'
        paragraaf: '9.7'
  - number: '9.25'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet bepaalt voor de komende dimensioneringsperiode de
      reservecapaciteit in de vorm van FRR die verwacht wordt ten minste nodig te zijn op basis van de hoogste uitkomst
      van elk van de volgende drie methoden:

      a. door vast te stellen wat de grootst mogelijke uitval is in zowel positieve als negatieve richting die wordt
      veroorzaakt door één elektriciteitsproductie-eenheid, één verbruiksinstallatie, één HVDC-interconnector of één
      wisselstroomverbinding;

      b. door vast te stellen wat de benodigde reserves waren geweest om in 99% van de onbalansverrekeningsperiodes
      de onbalansen van het LFC-blok op te kunnen lossen gedurende de periode van een volledig jaar dat niet eerder is
      beëindigd dan een half jaar voorafgaand aan de berekeningsdatum;

      c. door het resultaat van de in onderdeel b omschreven historische onbalansen van het LFC-blok te corrigeren voor
      de significante veranderingen in te verwachten toekomstige onbalansen van het LFC-blok.

      2 Voor de toepassing van het eerste lid, onderdeel c, hanteert de netbeheerder van het landelijk hoogspanningsnet
      de procedure die bestaat uit de volgende stappen:

      a. de identificatie van veroorzakers van onbalansen van het LFC-blok;

      b. de bepaling van toekomstige veranderingen;

      c. de toepassing van het regressiemodel;

      d. de toepassing van het voorspellingmodel;

      e. de toepassing van de convolutie met ruis;

      f. de bepaling van de opregel- en afregelbehoefte.

      3 Bij de in het tweede lid, onderdeel a, bedoelde identificatie van veroorzakers van onbalansen van het LFC-blok:

      a. beschouwt de netbeheerder van het landelijk hoogspanningsnet de mogelijk verklarende variabelen voor
      veroorzakers van onbalansen van het LFC-blok, zoals bijvoorbeeld:

      1°. de uitval van grootschalige elektriciteitsproductie-eenheden;

      2°. de voorspelfout van de belasting;

      3°. de zonvermogensverandering per onbalansverrekeningsperiode;

      4°. een snelle windvermogensverandering per onbalansverrekeningsperiode;

      5°. het aantal met het net verbonden elektrische voertuigen;

      b. bepaalt de netbeheerder van het landelijk hoogspanningsnet door middel van een statistische analyse of de
      mogelijk verklarende variabelen daadwerkelijk een significant verband laten zien met de onbalansen van het LFC-blok
      en wordt bij een niet-significant verband de desbetreffende mogelijk verklarende variabele uit het model gefilterd.

      4 Bij de in het tweede lid, onderdeel b, bedoelde bepaling van toekomstige veranderingen:

      a. bepaalt de netbeheerder van het landelijk hoogspanningsnet welke mogelijk verklarende variabelen er veranderen
      in de komende dimensioneringsperiode, ten opzichte van de in het eerste lid, onderdeel b, bedoelde periode;

      b. gebruikt de netbeheerder van het landelijk hoogspanningsnet voor de in onderdeel a bedoelde bepaling
      het jaarlijks door hem gepubliceerde document “Monitoring leveringszekerheid” en eventuele andere relevante
      brondocumenten;

      c. worden mogelijk verklarende variabelen die geen significante verandering ondergaan uit het model gefilterd.

      5 Bij de in het tweede lid, onderdeel c, bedoelde toepassing van het regressiemodel:

      a. neemt de netbeheerder van het landelijk hoogspanningsnet persistentie aan voor alle mogelijk verklarende
      variabelen die óf gelijk blijven in de komende dimensioneringsperiode ten opzichte van de in het eerste lid,
      onderdeel b, bedoelde periode, óf geen significant verband laten zien met de onbalansen van het LFC-blok;

      b. gebruikt de netbeheerder van het landelijk hoogspanningsnet de n mogelijk verklarende variabelen die zowel
      veranderen als een significant verband laten zien met de onbalansen van het LFC-blok als onafhankelijke variabelen
      X...X in een meervoudige lineaire kleinste-kwadraten regressieanalyse;

      c. test de netbeheerder van het landelijk hoogspanningsnet of deze onafhankelijke variabelen onderling niet een te
      grote afhankelijkheid laten zien;

      d. doet de regressieanalyse een verklaring van de historische onbalansen van het LFC-blok op basis van de
      onafhankelijke variabelen, die wordt aangeduid met de afhankelijke variabele Y, aan de hand van de onafhankelijke
      variabelen X...X door parameters a voor i = 1...n, constante c en residu ε te vinden, zodanig dat de som van de
      kwadraten van het residu Σε2 minimaal is in het volgende regressiemodel:

      6 Bij de in het tweede lid, onderdeel d, bedoelde toepassing van het voorspellingsmodel:

      a. vertaalt de netbeheerder van het landelijk hoogspanningsnet het in het vijfde lid toegepaste regressiemodel naar
      een voorspellingsmodel door te bepalen met welke factor de onafhankelijke variabelen verwacht worden te veranderen
      in de komende dimensioneringsperiode ten opzichte van de in het eerste lid, onderdeel b, bedoelde periode;

      b. wordt de in onderdeel a bedoelde factor bepaald uit dezelfde bron als genoemd in het vierde lid, onderdeel b, en
      wordt aangeduid met k voor i = 1...n;

      c. worden de onbalansen van het LFC-blok voor de komende dimensioneringsperiode Y voorspeld in het volgende
      voorspellingsmodel:

      7 Bij de in het tweede lid, onderdeel e, bedoelde toepassing van de convolutie met de ruis:

      a. bepaalt de netbeheerder van het landelijk hoogspanningsnet de ruis R als het verschil van de
      vijfminutengemiddelde waardes van de onbalansen van het LFC-blok uit de in het eerste lid, onderdeel b, bedoelde
      periode met het vijftienminutengemiddelde waardes van de onbalansen van een LFC-blok van dezelfde periode;

      b. bepaalt de netbeheerder van het landelijk hoogspanningsnet de kansdichtheidsfunctie f(o) van de ruis R, waarbij
      o de onbalans van het LFC-blok representeert binnen de kansdichtheidsfunctie;

      c. convolueert de netbeheerder van het landelijk hoogspanningsnet de in onderdeel b bedoelde kansdichtheidsfunctie
      f(o) met de kansdichtheidsfunctie f(o) van de in het zesde lid, onderdeel c, bedoelde onbalansen van het LFC-blok
      voor de komende dimensioneringsperiode Y;

      d. het resultaat van de in onderdeel c bedoelde convolutie is de voorspelling van de kansdichtheidsfunctie van de
      onbalansen van het LFC-blok op vijfminutenbasis f(o):

      8 Voor de in het tweede lid, onderdeel f, bedoelde bepaling van de afregel- en opregelbehoefte:

      a. berekent de netbeheerder van het landelijk hoogspanningsnet het 0,5e en het 99,5e percentiel van de in het
      zevende lid bepaalde onbalansen van het LFC-blok op vijfminutenbasis f(o);

      b. vormt het 0,5e percentiel de afregelbehoefte voor de komende dimensioneringsperiode;

      c. vormt het 99,5e percentiel de opregelbehoefte voor de komende dimensioneringsperiode.

      9 De netbeheerder van het landelijk hoogspanningsnet bepaalt de verdeling van de verwachte benodigde
      reservecapaciteit in de vorm van FRR als bedoeld in het eerste lid als volgt:

      a. in de vorm van automatische FRR (aFRR) tenminste een hoeveelheid die ertoe leidt dat:

      1°. de positieve aFRR groter is dan het 0,5e percentiel van het verschil van het één-minuut-gemiddelde en het
      vijftien-minuten-gemiddelde van de actuele zonale regelfout van Nederland gesommeerd met de reeds uitgevoerde
      onbalansaanpassingen in de vorm van geactiveerde FRR en de onbalansnettingvermogensuitwisseling;

      2°. de negatieve aFRR groter is dan het 99,5e percentiel van het verschil van het één-minuut-gemiddelde en het
      vijftien-minuten-gemiddelde van de actuele zonale regelfout van Nederland gesommeerd met de reeds uitgevoerde
      onbalansaanpassingen in de vorm van geactiveerde FRR en de onbalansnettingvermogensuitwisseling;

      b. in de vorm van handmatige FRR (mFRR): de resterende verwachte benodigde hoeveelheid.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel9.25
  - number: '9.26'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet en de regionale netbeheerders dragen er zorg
      voor dat de mogelijkheid om bij lage frequentie automatisch verbruik te ontkoppelen, als bedoeld in
      [artikel 4.7, eerste lid][ref1], vanaf 18 december 2022 geactiveerd wordt bij de volgende frequentiedrempelwaardes
      en met de bijbehorende gespecificeerde hoeveelheden:

      a. bij 49,0 Hz een hoeveelheid nettoverbruik ter grootte van 7,5% van het overeenkomstig het derde lid vastgestelde
      procentuele aandeel van de desbetreffende aangeslotene in de totale belasting;

      b. bij 48,8 Hz aanvullend op de in onderdeel a bedoelde hoeveelheid 7,5% van het overeenkomstig het derde lid
      vastgestelde procentuele aandeel van de desbetreffende aangeslotene in de totale belasting;

      c. bij 48,6 Hz aanvullend op de in onderdeel a en b bedoelde hoeveelheid 7,5% van het overeenkomstig het derde lid
      vastgestelde procentuele aandeel van de desbetreffende aangeslotene in de totale belasting;

      d. bij 48,4 Hz aanvullend op de in onderdeel a tot en met c bedoelde hoeveelheid 7,5% van het overeenkomstig het
      derde lid vastgestelde procentuele aandeel van de desbetreffende aangeslotene in de totale belasting;

      e. bij 48,2 Hz aanvullend op de in onderdeel a tot en met d bedoelde hoeveelheid 7,5% van het overeenkomstig het
      derde lid vastgestelde procentuele aandeel van de desbetreffende aangeslotene in de totale belasting;

      f. bij 48,0 Hz aanvullend op de in onderdeel a tot en met e bedoelde hoeveelheid 7,5% van het overeenkomstig het
      derde lid vastgestelde procentuele aandeel van de desbetreffende aangeslotene in de totale belasting.

      2 Het eerste lid is van overeenkomstige toepassing op:

      a. aangeslotenen die beschikken over een verbruiksinstallatie of een gesloten distributiesysteem, aangesloten op
      het landelijk hoogspanningsnet, waarop overeenkomstig artikel 4, eerste lid, van Verordening (EU) 2016/1388 (NC
      DCC), de Verordening (EU) 2016/1388 (NC DCC) van toepassing is;

      b. aangeslotenen die beschikken over een verbruiksinstallatie of een gesloten distributiesysteem, aangesloten
      op het landelijk hoogspanningsnet, waarop overeenkomstig artikel 4, eerste lid, van Verordening (EU) 2016/1388
      (NC DCC), de Verordening (EU) 2016/1388 (NC DCC) niet van toepassing is, maar waaromtrent de aangeslotene met
      de netbeheerder van het landelijk hoogspanningsnet is overeengekomen om aan de uitvoering van dit artikel mee te
      werken.

      3 De netbeheerder van het landelijk hoogspanningsnet bepaalt in 2020 en vervolgens tenminste eenmaal per vijf jaar
      voor elke in het eerste en tweede lid bedoelde aangeslotene en voor zichzelf het procentuele aandeel in de totale
      belasting:

      a. voor de netbeheerder van het landelijk hoogspanningsnet door het quotiënt te nemen van de som van het ten
      behoeve van afname van het landelijk hoogspanningsnet opgetreden maximale nettoverbruik van alle aansluitingen
      op het landelijk hoogspanningsnet in het voorgaande jaar die niet actief meewerken aan de in het eerste of tweede
      lid bedoelde regeling en het totaal van de ten behoeve van afname van het landelijk hoogspanningsnet opgetreden
      maximale nettoverbruik van alle aansluitingen op het landelijk hoogspanningsnet in het voorgaande jaar;

      b. voor de overige aangeslotenen door het quotiënt te nemen van het op diens aansluiting(en) opgetreden maximale
      nettoverbruik in het voorgaande jaar en het totaal van de ten behoeve van afname van het landelijk hoogspanningsnet
      opgetreden maximale nettoverbruik van alle aansluitingen op het landelijk hoogspanningsnet in het voorgaande jaar;

      c. in afwijking van onderdeel b voor een regionale netbeheerder op wiens distributienet een ander distributienet
      is aangesloten dat niet rechtstreeks is aangesloten op het landelijk hoogspanningsnet door het overeenkomstig
      onderdeel b voor zijn net bepaalde procentuele aandeel in de totale belasting te verminderen met het voor de op
      zijn net aangesloten distributienetten bepaalde procentuele aandeel.

      4 De instelling van de in het eerste lid bedoelde functionaliteit en de bepaling van de af te schakelen
      aansluitingen of netdelen vindt plaats door middel van het volgende rekenalgoritme:

      a. de netbeheerder van het landelijk hoogspanningsnet verdeelt de opgetreden maximale totale belasting van
      het voorgaande jaar over de in het eerste en tweede lid bedoelde aangeslotenen en zichzelf overeenkomstig de
      verdeelsleutel uit het derde lid;

      b. de netbeheerder van het landelijk hoogspanningsnet en de in het eerste en tweede lid bedoelde aangeslotenen
      verdelen de aan hen op grond van de onderdelen a tot en met f van het eerste lid toegerekende hoeveelheden
      nettoverbruik over de af te schakelen aansluitingen en netdelen alsof de afschakeling had plaatsgevonden op het
      moment van het maximale nettoverbruik op hun aansluitingen in het voorgaande jaar.

      5 Indien een in het eerste of tweede lid bedoelde netbeheerder of aangeslotene niet in staat is om de
      overeenkomstig het eerste lid bepaalde hoeveelheid nettoverbruik af te schakelen, ook al heeft deze aangeslotene
      de in het eerste lid bedoelde functionaliteit zodanig geïnstalleerd dat alle MS-richtingen waarachter zich een
      elektriciteitsproductie-eenheid met een maximumcapaciteit groter dan of gelijk aan 3 MW bevindt niet worden
      afgeschakeld, wordt de door deze aangeslotene niet afschakelbare hoeveelheid nettoverbruik door de netbeheerder
      van het landelijk hoogspanningsnet evenredig verdeeld over de overige in het eerste en tweede lid bedoelde
      aangeslotenen.

      6 Indien een in het tweede lid bedoelde aangeslotene, gelet op de aard en omvang van zijn installatie of net,
      niet kan voldoen aan de in het eerste lid genoemde gespecificeerde hoeveelheden per frequentiedrempelwaarde, kan
      de desbetreffende aangeslotene, eventueel in samenwerking met een of meer andere aangeslotenen, in overleg met de
      netbeheerder van het landelijk hoogspanningsnet, uitvoering geven aan het eerste lid door toepassing van een deel
      van de in het eerste lid genoemde frequentiedrempelwaardes met daaraan aangepaste gespecificeerde hoeveelheden
      te ontkoppelen verbruik zodanig dat de som van de hoeveelheden minimaal 45% van het overeenkomstig het derde lid
      vastgestelde procentuele aandeel van de desbetreffende aangeslotenen in de totale belasting bedraagt.

      7 De netbeheerder draagt er zorg voor dat een aangeslotene die beschikt over een aansluiting op het landelijk
      hoogspanningsnet en die niet op grond van het tweede lid zelf uitvoering geeft aan de automatische ontkoppeling
      bij lage frequentie als bedoeld in het eerste en vierde lid en die door middel van vraagsturing een substantiële
      bijdrage levert aan de frequentiehandhaving, als bedoeld in artikel 18, vijfde lid, van de Verordening (EU)
      2017/2196 (NC ER), bij de toepassing van de automatische ontkoppeling bij lage frequentie als bedoeld in het eerste
      en vierde lid, niet wordt afgeschakeld, dan wel ten behoeve van de afschakeling wordt ingedeeld in de als laatste
      afschakelende categorie waarin nog ruimte is, van de categorieën als bedoeld in het eerste lid, onderdelen a tot en
      met f.


