        artikel: '2.13'
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.3'
    text: |-
      1 Het verbinden van de elektrische installatie met de aansluiting geschiedt door of vanwege de netbeheerder.

      2 Het verbinden van het primaire gedeelte van de meetinrichting met het secundaire gedeelte van de meetinrichting
      geschiedt door de netbeheerder of een derde die overeenkomstig de [Meetcode elektriciteit][ref1] een erkenning
      heeft als meetverantwoordelijke.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.3
    references:
      - id: ref1
        bwb_id: BWBR0037946
  - number: '2.4'
    text: |-
      1 De netbeheerder identificeert de aansluitingen en geplande aansluitingen op het eigen net door aan elke
      aansluiting of geplande aansluiting één unieke EAN-code toe te kennen. De netbeheerder deelt de aangeslotene
      desgevraagd mee welke EAN-code aan diens aansluiting is toegekend.

      2 De netbeheerder en de aangeslotene komen voor elk van de verbindingen behorende tot de aansluiting de locatie van
      het bijbehorende overdrachtspunt overeen.

      3 Aan elke aansluiting, niet zijnde een aansluiting van een net op een ander net, kent de netbeheerder een primair
      allocatiepunt toe ongeacht het aantal overdrachtspunten van een aansluiting.

      4 In aanvulling op het derde lid kan een primair allocatiepunt worden toegekend aan een aansluiting van een net
      op een ander net indien dit een aansluiting betreft van een gesloten distributiesysteem waarvan de beheerder geen
      gebruik maakt van het elektronische berichtenverkeer als bedoeld in [paragraaf 13.5][ref1] ten behoeve van het
      faciliteren van derdentoegang.

      5 Het primaire allocatiepunt van een aansluiting wordt geïdentificeerd met dezelfde EAN-code als de aansluiting.

      6 Indien de netbeheerder op grond van [artikel 2.5 tot en met 2.9][ref2] een secundair allocatiepunt toekent aan
      een aansluiting, identificeert de netbeheerder het desbetreffende secundaire allocatiepunt door middel van het
      toekennen van een unieke EAN-code.

      7 Indien voor een aansluiting, bestaande uit meer dan één verbinding, overeenkomstig het tweede lid meer dan één
      overdrachtspunt is overeengekomen, identificeert de netbeheerder elk van die overdrachtspunten door het toekennen
      van een unieke EAN-code, onverminderd de verplichting om overeenkomstig het eerste lid aan de aansluiting als
      geheel een EAN-code toe te kennen.

      8 Indien op een aansluiting bestaande uit één verbinding [artikel 2.6][ref3] of [artikel 2.9][ref4] wordt
      toegepast, identificeert de netbeheerder het overdrachtspunt door het toekennen van een unieke EAN-code,
      onverminderd de verplichting om overeenkomstig het eerste lid aan de aansluiting als geheel een EAN-code toe te
      kennen.

      9 De netbeheerder identificeert elke overeenkomstig [artikel 2.16, tweede lid][ref5] gemelde
      elektriciteitsproductie-eenheid of elektriciteitsopslageenheid met een unieke EAN-code en verstrekt deze
      desgevraagd aan de aangeslotene. De netbeheerder legt deze EAN-code vast in het register als bedoeld in
      [paragraaf 13.4][ref6].

      10 De netbeheerder identificeert desgevraagd een beoogde GCvO-installatie of een elektriciteitsproductie-
      eenheid dan wel een elektriciteitsopslageenheid waarvoor geen garantie of certificaat van oorsprong
      gewenst is, maar waarvan de uitwisseling van de meetgegevens wel noodzakelijk is voor de uitvoering van
      [artikel 9, derde lid, van de Regeling garanties van oorsprong en certificaten van oorsprong][ref7], met een
      unieke EAN-code, verstrekt deze aan de aangeslotene en in geval van een grootverbruikaansluiting tevens aan de
      meetverantwoordelijke, en legt deze EAN-code vast in het register als bedoeld in [paragraaf 13.4][ref8].

      11 Indien de aan een elektriciteitsproductie-eenheid of een GCvO-installatie toegekende EAN-code op 5 april 2022
      dezelfde is als de EAN-code die op grond van het eerste lid aan de aansluiting van de desbetreffende aangeslotene
      is toegekend, kan deze situatie gehandhaafd blijven tot op het moment dat er wijziging van de aansluiting, de
      elektriciteitsproductie-eenheid of de GCvO-installatie plaatsvindt.

      12 De netbeheerder identificeert desgevraagd een verbruiksinstallatie die vraagsturing levert aan een netbeheerder
      per vraagsturingleverende verbruikseenheid door het toekennen van een unieke EAN-code en legt deze vast in het
      register als bedoeld in [paragraaf 13.4][ref9].


