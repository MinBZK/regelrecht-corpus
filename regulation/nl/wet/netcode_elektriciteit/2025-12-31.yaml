  - number: '7.17'
    text: |-
      De netbeheerder past het gecontracteerd transportvermogen voor invoeding omhoog of omlaag aan indien

      a. de aangeslotene hier om verzoekt; en

      b. in geval van een aanpassing naar boven, overeenkomstig [paragraaf 9.2][ref1] blijkt dat de beschikbare
      transportcapaciteit toereikend is voor de gewenste verhoging.


