  - number: '3.24'
    text: |-
      1 De elektriciteitsproductie-eenheid is in staat een referentiewaarde van het werkzaam vermogen te ontvangen en te
      volgen op aangeven van de netbeheerder of de netbeheerder van het landelijk hoogspanningsnet. Hiervoor gelden de
      volgende voorwaarden als bedoeld in artikel 15, tweede lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG):

      a. Het regelbereik ligt tussen het technisch minimum vermogen en het actuele maximum vermogen, tenzij anders
      overeengekomen is door de netbeheerder of de netbeheerder van het landelijk hoogspanningsnet en de aangeslotene.

      b. De tijdsperiode, waarbinnen de aangepaste referentiewaarde voor het werkzaam vermogen moet worden bereikt, wordt
      vastgelegd in de aansluit- en transportovereenkomst.

      c. De tolerantie voor de nieuwe referentiewaarde bedraagt 2% van de maximumcapaciteit.

      2 Onverminderd [artikel 3.13, vijfde lid][ref1], is de elektriciteitsproductie-eenheid in staat voor de
      gelimiteerde frequentiegevoelige modus – onderfrequentie (LFSM-U) de levering van de frequentierespons voor het
      werkzaam vermogen te activeren overeenkomstig de volgende parameters, als bedoeld in artikel 15, tweede lid,
      onderdeel c, van de Verordening (EU) 2016/631 (NC RfG):

      a. de frequentiedrempelwaarde is instelbaar tussen 49,5 en 49,8 Hz;

      b. de instelling van de frequentiedrempelwaarde is: 49,8 Hz;

      c. de statiek is instelbaar tussen 4 en 12%;

      d. de default instelling van de statiek is: 5%;

      e. in geval van een power park module is P, als bedoeld in figuur 4 van de Verordening (EU) 2016/631 (NC RfG)
      gelijk aan het feitelijk gegenereerde werkzame vermogen op het moment dat de drempelwaarde van de LFSM-U is
      bereikt.

      3 De elektriciteitsproductie-eenheid is in staat, wanneer de frequentiegevoelige modus (FSM) in bedrijf is, de
      frequentierespons voor het werkzaam vermogen te leveren, als bedoeld in artikel 15, tweede lid, onderdeel d,
      subonderdeel i, van de Verordening (EU) 2016/631 (NC RfG), overeenkomstig de volgende parameters:

      a. het bereik van het werkzaam vermogen in verhouding tot de maximumcapaciteit: range is: 1,5% – 10%;

      b. de ongevoeligheid van de frequentierespons is: 10 mHz;

      c. de dode band van de frequentierespons is instelbaar tussen 0 en 500 mHz;

      d. de statiek is instelbaar tussen 4% en 12%;

      e. in geval van een power park module is P, als bedoeld in figuur 5 van de Verordening (EU) 2016/631 (NC RfG)
      gelijk aan het feitelijk gegenereerde werkzame vermogen op het moment dat de drempelwaarde van de FSM is bereikt.

      4 De elektriciteitsproductie-eenheid is in staat de volledige frequentierespons te leveren, als bedoeld in artikel
      15, tweede lid, onderdeel d, subonderdeel iii, en tabel 5 van de Verordening (EU) 2016/631 (NC RfG), overeenkomstig
      de volgende parameters:

      a. het bereik van het werkzaam vermogen in verhouding tot de maximumcapaciteit ligt tussen de 1,5% en 10%; de
      waarde van het bereik wordt per elektriciteitsproductie-eenheid vastgelegd in de overeenkomst voor de levering
      van reservecapaciteit;

      b. de maximaal toegestane tijd t voor elektriciteitsproductie-eenheden is: 30 seconden.

      5 De elektriciteitsproductie-eenheid is in staat om, na activering van de FSM een volledige frequentierespons te
      leveren gedurende ten minste 15 minuten, als bedoeld in artikel 15, tweede lid, onderdeel d, subonderdeel v, van de
      Verordening (EU) 2016/631 (NC RfG).

      6 De elektriciteitsproductie-eenheid heeft functionaliteiten, als bedoeld in artikel 15, tweede lid, onderdeel
      e van de Verordening (EU) 2016/631 (NC RfG), die voldoen aan de specificaties van de artikelen 158 en 159 van de
      Verordening (EU) 2017/1485 (GL SO).

      7 De elektriciteitsproductie-eenheid is in staat automatisch te ontkoppelen indien de spanning op het
      overdrachtspunt van de aansluiting kleiner is dan 0,85 pu of groter dan 1,15 pu. De instelling, waarbij
      automatische ontkoppeling plaatsvindt, kan door de aangeslotene worden bepaald, mits deze instelling niet
      conflicteert met de eisen uit de Verordening (EU) 2016/631 (NC RfG) met betrekking tot bedrijfsperiodes voor
      spanningen en met betrekking tot fault-ride-trough capaciteit.

      8 De elektriciteitsproductie-eenheid met black-start-capaciteit is in staat om vanuit stilstand op te starten
      overeenkomstig de door de netbeheerder van het landelijk hoogspanningsnet vastgestelde en gepubliceerde
      specificaties, als bedoeld in artikel 15, vijfde lid, onderdeel a, subonderdeel iii, van de Verordening (EU)
      2016/631 (NC RfG).

      9 De elektriciteitsproductie-eenheid met black-start-capaciteit is in staat tot synchronisatie overeenkomstig de
      door de netbeheerder van het landelijk hoogspanningsnet vastgestelde en gepubliceerde specificaties, als bedoeld in
      artikel 15, vijfde lid, onderdeel a, subonderdeel iv, van de Verordening (EU) 2016/631 (NC RfG).

      10 De elektriciteitsproductie-eenheid is in staat zich automatisch van het net te ontkoppelen in geval van verlies
      van rotorhoekstabiliteit bij een synchrone elektriciteitsproductie-eenheid of verlies van besturing, als bedoeld
      in artikel 15, zesde lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG). De criteria hiervoor worden
      opgenomen in de aansluit- en transportovereenkomst.

      11 Indien van toepassing leggen de aangeslotene en de netbeheerder de instellingen van de
      storingsregistratieapparatuur, inclusief de startcriteria en bemonsteringsfrequenties, als bedoeld in artikel
      15, zesde lid, onderdeel b, subonderdeel ii, van de Verordening (EU) 2016/631 (NC RfG), vast in de aansluit- en
      transportovereenkomst.

      12 De aangeslotene en de netbeheerder leggen een startcriterium voor de oscillatie, als bedoeld in artikel 15,
      zesde lid, onderdeel b, subonderdeel iii, van de Verordening (EU) 2016/631 (NC RfG), vast in de aansluit- en
      transportovereenkomst.

      13 De aangeslotene en de netbeheerder leggen, in overleg met de netbeheerder van het landelijk hoogspanningsnet, de
      communicatieprotocollen voor geregistreerde gegevens vast in de aansluit- en transportovereenkomst als bedoeld in
      artikel 15, zesde lid, onderdeel b, subonderdeel iv, van de Verordening (EU) 2016/631 (NC RfG).

      14 Indien van toepassing leggen de aangeslotene en de netbeheerder de installatie van apparatuur voor
      bedrijfsvoering en veiligheid van het systeem vast in de aansluit- en transportovereenkomst, als bedoeld in artikel
      15, zesde lid, onderdeel d, van de Verordening (EU) 2016/631 (NC RfG).

      15 Zoals bedoeld in artikel 15, zesde lid, onderdeel e, van de Verordening (EU) 2016/631 (NC RfG) is:

      a. het minimum van de op- en afregelsnelheid van het werkzame vermogen 1% van de maximumcapaciteit per minuut;

      b. het maximum van de regelsnelheid van het werkzame vermogen 20% van de maximumcapaciteit per minuut.

      16 De aangeslotene legt het aardingsconcept van de sterpunten aan de netzijde van de machinetransformatoren, als
      bedoeld in artikel 15, zesde lid, onderdeel f, van de Verordening (EU) 2016/631 (NC RfG), vast in de aansluit-
      en transportovereenkomst.


