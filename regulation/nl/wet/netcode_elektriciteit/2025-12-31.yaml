    text: |-
      In [bijlage 7][ref1] is de leidraad opgenomen voor een machineleesbaar en interoperabel
      formaat van de gegevens, ten behoeve van de uitvoering door de vergunninghouders van
      [artikel 3, derde lid, van het Besluit vergunning levering elektriciteit aan kleinverbruikers][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037940
      [ref2]: https://wetten.overheid.nl/BWBR0015051#Artikel3
