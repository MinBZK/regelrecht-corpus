  - number: '12.7'
    text: |-
      1 Iedere persoon aan wie in de jaarveiling of de maandveiling transportcapaciteit is toegewezen volgens hoofdstuk
      4 van de HAR of die transportcapaciteit volgens hoofdstuk 6 van de HAR heeft gekocht, heeft de mogelijkheid deze
      capaciteit geheel of gedeeltelijk te nomineren. In dat geval maakt deze persoon op zijn vroegst vanaf 14:00 uur
      op de tweede dag voor de dag van transport en op zijn laatst tot 08:30 uur op de dag voorafgaand aan de dag van
      transport, aan de netbeheerder van het landelijk hoogspanningsnet bekend of, en zo ja voor welk deel men van de
      genoemde toegewezen transportcapaciteit voor de dag van transport gebruik wil maken.

      2 De in het eerste lid genoemde nominatie dient plaats te vinden via de BRP die het betreffende transport in zijn
      energieprogramma zal opnemen in overeenstemming met [artikel 10.11, eerste lid][ref1].

      3 De in het eerste lid genoemde nominaties dienen ongewijzigd in het energieprogramma van de in het tweede lid
      genoemde BRP te worden omgezet. Energieprogramma’s welke worden ingediend ten behoeve van landsgrensoverschrijdende
      transporten kunnen niet worden gewijzigd, tenzij:

      a. [artikel 10.14, zesde lid][ref2], wordt toegepast, of

      b. indien de netbeheerder van het landelijk hoogspanningsnet de toegewezen capaciteit voor jaar- en
      maandtransporten overeenkomstig hoofdstuk 9 van de HAR reduceert.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.11
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel10.14
