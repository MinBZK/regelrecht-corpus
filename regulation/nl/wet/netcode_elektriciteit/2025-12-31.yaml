  - number: '10.17'
    text: |-
      1 De netbeheerder deelt ten behoeve van het samenstellen van de meetgegevens ten behoeve van
      balanceringsverantwoordelijkheid de aansluitingen op het door hem beheerde net in profielcategorieën in
      overeenkomstig [Bijlage 15][ref1].

      2 De netbeheerder hanteert voor het samenstellen van de meetgegevens ten behoeve van
      balanceringsverantwoordelijkheid voor de profielcategorieën E3 en E4A de overeenkomstig
      [Bijlage 1 van de Informatiecode elektriciteit en gas][ref2] vastgestelde profielen en voor de overige
      profielcategorieën de overeenkomstig [Bijlage 16][ref3] bepaalde profielen.

      3 De netbeheerder gaat voor het samenstellen van de meetgegevens ten behoeve van balanceringsverantwoordelijkheid
      uit van de meetgegevens:

      a. die hij overeenkomstig [paragraaf 6.2 van de Informatiecode elektriciteit en gas][ref4] ontvangen heeft en
      overeenkomstig [paragraaf 6.3 van de Informatiecode elektriciteit en gas][ref5] heeft verwerkt;

      b. die hij uitleest uit meetinrichtingen in het overdrachtspunt van
      kleinverbruikaansluitingen waarvan de allocatiemethode van de aansluiting, bedoeld in
      [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref6], de waarde “slimme-meter-allocatie”
      heeft; en

      c. geregistreerd door de meetinrichtingen in het (de) overdrachtspunt(en) van de aansluitingen van zijn net met
      andere netten.

      4 In afwijking van respectievelijk in aanvulling op het derde lid gaat de netbeheerder voor het samenstellen
      van de meetgegevens ten behoeve van balanceringsverantwoordelijkheid van grootverbruikers die beschikken over
      een profielgrootverbruikmeetinrichting, respectievelijk kleinverbruikers waarvan de allocatiemethode van de
      aansluiting, bedoeld in [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref7] de waarde
      “profielallocatie” heeft, uit van de gegevens die hij overeenkomstig [bijlage 17][ref8] bepaalt.

      5 In aanvulling op het vierde lid gaat de netbeheerder voor het samenstellen van de meetgegevens ten behoeve
      van balanceringsverantwoordelijkheid van aangeslotenen die beschikken over een aansluiting die op grond van
      [artikel 2.30][ref9] en [2.31][ref10] niet voorzien is van een meetinrichting, uit van:

      a. het belastingprofiel dat overeenkomstig de systematiek beschreven in [bijlage 19][ref11] is vastgesteld; of

      b. de gegevens die hij overeenkomstig [bijlage 17][ref12] bepaalt indien aan de aansluiting om historische redenen
      een profielcategorie is toegekend.

      6 De netbeheerder bepaalt per netgebied, per onbalansverrekeningsperiode het restantvolume door het saldo te
      bepalen van de uitwisseling van het netgebied met andere netten bedoeld in het derde lid, onderdeel c, de gemeten
      volumes bedoeld in het derde lid, onderdelen a en b, de gegevens bedoeld in het vierde en vijfde lid en de
      netverliezen.

      7 De netbeheerder bepaalt per netgebied de meetgegevens ten behoeve van balanceringsverantwoordelijkheid voor
      geprofileerde aansluitingen overeenkomstig [bijlage 18][ref13].

      8 De netbeheerder van het landelijk hoogspanningsnet en de andere netbeheerders leggen de in het derde, vijfde en
      zevende lid bedoelde meetgegevens met betrekking tot de aansluitingen op hun netten per BRP, per leverancier en per
      profielcategorie per onbalansverrekeningsperiode vast in dagrapporten.

      9 De netbeheerder verzamelt ten behoeve van de netbeheerder van het landelijk hoogspanningsnet de hoeveelheid
      met zijn net uitgewisselde energie per netgebied, per BRP, per energierichting, per onbalansverrekeningsperiode,
      op basis van de in het derde, vijfde en zevende lid bedoelde gegevens, voor elke waarde van allocatiemethode
      van aansluitingen, als bedoeld in [2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref14],
      onderscheidenlijk, te weten:

      a. ‘telemetrie’;

      b. ‘slimme-meter-allocatie’;

      c. ‘profielallocatie’.

      10 De netbeheerder verzamelt op basis van de in het derde, vijfde en zevende lid bedoelde gegevens ten behoeve
      van iedere BRP de hoeveelheid met zijn net uitgewisselde energie per netgebied, per energierichting, per
      onbalansverrekeningsperiode:

      a. voor de aansluitingen waarvoor de desbetreffende BRP balanceringsverantwoordelijkheid
      draagt en waarvan de allocatiemethode van de aansluiting, bedoeld in
      [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref15] de waarde “telemetrie” heeft: per
      aansluiting;

      b. voor de aansluitingen waarvoor de desbetreffende BRP balanceringsverantwoordelijkheid
      draagt en waarvan de allocatiemethode van de aansluiting, bedoeld in
      [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref16] de waarde “telemetrie” heeft: per
      leverancier;

      c. voor de aansluitingen waarvoor de desbetreffende BRP balanceringsverantwoordelijkheid
      draagt en waarvan de allocatiemethode van de aansluiting bedoeld in
      [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref17] de waarde “profielallocatie” heeft:
      per profielcategorie en per leverancier;

      d. voor de aansluitingen waarvoor de desbetreffende BRP balanceringsverantwoordelijkheid
      draagt en waarvan de allocatiemethode van de aansluiting, bedoeld in
      [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref18] de waarde “slimme-meter-allocatie”
      heeft: per leverancier.

      11 Wanneer de in het negende en tiende lid bedoelde meetgegevens een voorlopig karakter hebben, wordt
      daarvan bij de verstrekking melding gemaakt. In dat geval worden de definitieve meetgegevens overeenkomstig
      [artikel 10.20][ref19] verwerkt.


