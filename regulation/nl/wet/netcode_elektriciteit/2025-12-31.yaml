  - number: '13.18'
    text: |-
      1 Een aangeslotene die beschikt over een HVDC-systeem of een DC-aangesloten power park module, aangesloten op
      het landelijk hoogspanningsnet, verstrekt de netbeheerder van het landelijk hoogspanningsnet de plannings- en
      prognosegegevens van dat HVDC-systeem of die DC-aangesloten power park module, te weten:

      a. de niet-beschikbaarheidsplanning van het HVDC-systeem of de DC-aangesloten power park module;

      b. de geplande niet-beschikbaarheid van de aansluiting waarachter het HVDC-systeem of de DC-aangesloten power park
      module zich bevindt;

      c. de test-profielen;

      d. de beperkingen van de beschikbaarheid van het werkzaam vermogen ten opzichte van de maximale HVDC-
      transportcapaciteit van werkzaam vermogen of de maximumcapaciteit;

      e. de prognose van de hoeveelheid op het net in te voeden of van het net af te nemen werkzaam vermogen;

      f. de eventuele beperkingen in de regelcapaciteit voor blindvermogen.

      2 De plannings- en prognosegegevens, bedoeld in het eerste lid, worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter dat HVDC-systeem of die DC-aangesloten power park module zich bevindt;

      b. de EAN-code van het overdrachtspunt waarachter dat HVDC-systeem of die DC-aangesloten power park module
      zich bevindt, indien het een aansluiting betreft die meer dan één overdrachtspunt heeft, als bedoeld in
      [artikel 2.4, zevende lid][ref2].

      3 Van de gegevens bedoeld in het eerste lid, onderdelen a, b, d, e en f, wordt jaarlijks, uiterlijk op 1 april, een
      zo goed mogelijke schatting voor de komende tien jaar ter beschikking gesteld, met inachtneming van het volgende:

      a. van tijdens de zichtperiode nieuw in bedrijf te nemen HVDC-systemen of DC-aangesloten power park modules tevens
      de verwachte datum van inbedrijfname;

      b. van tijdens de zichtperiode te amoveren HVDC-systemen of DC-aangesloten power park modules tevens de verwachte
      datum van amovering.

      4 Van de gegevens bedoeld in het eerste lid, onderdelen a en b, wordt jaarlijks, uiterlijk op 1 april, een zo goed
      mogelijke schatting voor de komende drie jaar ter beschikking gesteld overeenkomstig de specificaties uit artikel
      9, eerste lid, van de Verordening (EU) 543/2013.

      5 Van de gegevens bedoeld in het eerste lid, onderdelen a tot en met e, wordt jaarlijks, uiterlijk op 1 april, een
      zo goed mogelijke schatting voor het komende jaar ter beschikking gesteld.

      6 Tenzij anders overeengekomen, maken de gegevens bedoeld in het vierde en vijfde lid, deel uit van de gegevens in
      het derde lid.

      7 Van de gegevens bedoeld in het eerste lid, onderdelen a tot en met e, worden wijzigingen ten opzichte van de
      gegevens, ter beschikking gesteld overeenkomstig het vijfde lid, maandelijks, uiterlijk op de vijfde dag van de
      maand, voor de komende maand ter beschikking gesteld.

      8 De gegevens bedoeld in het eerste lid, onderdelen a tot en met e, worden dagelijks, uiterlijk om 15:30 uur voor
      de komende dag ter beschikking gesteld en bestaan uit een prognose van de gemiddelde MW-waarde per kwartier.

      9 Wijzigingen ten opzichte van de overeenkomstig het achtste lid ter beschikking gestelde prognose van de
      hoeveelheid op het net in te voeden of van het net af te nemen werkzaam vermogen, worden direct na het bekend
      worden van die wijziging aan de netbeheerder van het landelijk hoogspanningsnet ter beschikking gesteld in geval
      van een HVDC-systeem of een DC-aangesloten power park module met een maximumcapaciteit:

      a. kleiner dan 200 MW als de wijziging groter is dan 5% van de maximumcapaciteit;

      b. groter dan of gelijk aan 200 MW als de wijziging groter is dan 10 MW.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
