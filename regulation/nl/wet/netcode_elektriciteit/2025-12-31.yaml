  - number: '4.1'
    text: |-
      De tijdsduur van de bedrijfsperiode voor frequenties in de band van 47,5 Hz tot 48,5 Hz en de tijdsduur van de
      bedrijfsperiode voor frequenties in de band van 48,5 Hz tot 49,0 Hz, als bedoeld in artikel 12, eerste lid, van de
      Verordening (EU) 2016/1388 (NC DCC), is 30 minuten.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.1
  - number: '4.2'
    text: |-
      1 Voor verbruiksinstallaties met een nominale spanning kleiner dan 300 kV is de tijdsduur van de bedrijfsperiode
      voor spanningen in de band van 1,118 pu tot 1,15 pu, als bedoeld in artikel 13, eerste lid, van de Verordening (EU)
      2016/1388 (NC DCC), 60 minuten.

      2 Voor verbruiksinstallaties met een nominale spanning groter dan of gelijk aan 300 kV is de tijdsduur van de
      bedrijfsperiode voor spanningen in de band van 1,05 pu tot 1,10 pu, als bedoeld in artikel 13, eerste lid, van de
      Verordening (EU) 2016/1388 (NC DCC), 60 minuten.

      3 De netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over een verbruiksinstallatie
      komen voorwaarden en instellingen voor automatische ontkoppeling bij specifieke spanningswaarden, als bedoeld
      in artikel 13, zesde lid, van de Verordening (EU) 2016/1388 (NC DCC), overeen en deze worden vastgelegd in de
      aansluit- en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.2
  - number: '4.3'
    text: |-
      1 De maximale kortsluitstroom, als bedoeld in artikel 14, eerste lid, van de Verordening (EU) 2016/1388 (NC DCC),
      wordt in de aansluit- en transportovereenkomst vastgelegd.

      2 In afwijking van [artikel 2.13, derde lid][ref1], informeert de netbeheerder van het landelijk hoogspanningsnet
      de aangeslotene die beschikt over een verbruiksinstallatie en overlegt met hem voor zover van toepassing bij eerste
      aansluiting en bij latere wijzigingen van het net omtrent:

      a. de minimum en maximum waarde van de kortsluitstroom, als bedoeld in artikel 14, tweede lid, van de Verordening
      (EU) 2016/1388 (NC DCC), tijdens de normale bedrijfstoestand;

      b. de wijze van sterpuntsbehandeling;

      c. de isolatiecoördinatie;

      d. de netconfiguratie;

      e. de bedrijfsvoering.

      3 De aangeslotene die beschikt over een verbruiksinstallatie specificeert de drempelwaarden, als bedoeld in artikel
      14, derde, vierde, vijfde en zesde lid, van de Verordening (EU) 2016/1388 (NC DCC). Deze waarden worden vastgelegd
      in de aansluit- en transportovereenkomst.

      4 De netbeheerder van het landelijk hoogspanningsnet specificeert de drempelwaarden, als bedoeld in artikel 14,
      achtste en negende lid, van de Verordening (EU) 2016/1388 (NC DCC). Deze waarden worden vastgelegd in de aansluit-
      en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.13
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.3
