  - number: '9.4'
    text: |-
      1 In aanvulling op de raming van de benodigde transportcapaciteit als bedoeld in
      [artikel 2.3 van de Regeling investeringsplan en kwaliteit elektriciteit en gas][ref1] ten behoeve van het
      opstellen van het investeringsplan als bedoeld in [artikel 21 van de Elektriciteitswet 1998][ref2], beoordeelt de
      netbeheerder periodiek de ontwikkeling op korte termijn van de benodigde transportcapaciteit in zijn net, rekening
      houdend met de van toepassing zijnde netontwerpcriteria en operationele veiligheidsgrenzen.

      2 De netbeheerder beoordeelt bij elke aanvraag om het doen van een aanbod voor het uitvoeren van transport de
      toereikendheid van de in het desbetreffende net beschikbare transportcapaciteit om te voldoen aan de gevraagde
      transportcapaciteit.


      [ref1]: https://wetten.overheid.nl/BWBR0041543#Artikel2.3
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel21
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel9.4
