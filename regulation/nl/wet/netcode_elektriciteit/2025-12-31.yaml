  - number: '10.11'
    text: |-
      1 Een BRP dient dagelijks vóór 09:00 uur of een door de gezamenlijke netbeheerders in onderling overleg te bepalen
      ander tijdstip bij de netbeheerder van het landelijk hoogspanningsnet een extern commercieel handelsprogramma
      voor de volgende dag in dat voortvloeit uit eerder verkregen toestemming van de netbeheerder van het landelijk
      hoogspanningsnet voor importen, exporten en transits voor meer dan één dag.

      2 Uiterlijk twee uur en 15 minuten na het tijdstip waarop het in het eerste lid bedoelde extern commercieel
      handelsprogramma moet zijn ingediend, bericht de netbeheerder van het landelijk hoogspanningsnet aan de BRP welke
      in het extern commercieel handelsprogramma opgenomen importen, exporten en transits hij, rekening houdend met
      de beschikbare capaciteit van de landsgrensoverschrijdende verbindingen voor de volgende dag heeft toegewezen
      en welke ruimte ten behoeve van de spotmarkt voor de volgende dag beschikbaar is op de landsgrensoverschrijdende
      verbindingen.

      3 Indien de toewijzing, bedoeld in het tweede lid, niet overeenstemt met het extern commercieel handelsprogramma,
      bedoeld in het eerste lid, dient de BRP bij de netbeheerder van het landelijk hoogspanningsnet vóór 14:30 uur op
      dezelfde dag een bijgesteld extern commercieel handelsprogramma in.

      4 Indien het extern commercieel handelsprogramma of bijgesteld extern commercieel handelsprogramma voor de volgende
      dag niet vóór het in het eerste lid onderscheidenlijk het derde lid bedoelde tijdstip is ingediend, wijst de
      netbeheerder van het landelijk hoogspanningsnet geen capaciteit op landsgrensoverschrijdende verbindingen ten
      behoeve van de in dat extern commercieel handelsprogramma opgenomen transporten toe.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel10.11
  - number: '10.12'
    text: |-
      1 Een BRP dient dagelijks vóór 14:30 uur bij de netbeheerder van het landelijk hoogspanningsnet een
      energieprogramma in.

      2 Indien de netbeheerder van het landelijk hoogspanningsnet op het in het eerste lid bedoelde tijdstip geen
      energieprogramma ontvangt van een BRP, dan hanteert de netbeheerder van het landelijk hoogspanningsnet voor de
      betreffende BRP voor elke onbalansverrekeningsperiode van het volgende etmaal de waarde van 0 MWh in het interne
      commerciële handelsprogramma. De betreffende BRP wordt hiervan onverwijld geïnformeerd.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel10.12
  - number: '10.13'
    text: |-
      1 Voor zover in de in [artikel 10.12][ref1] bedoelde energieprogramma’s andere externe commerciële
      handelsprogramma's zijn opgenomen dan de externe commerciële handelsprogramma's die overeenkomstig
      [artikel 10.11][ref2] zijn toegewezen, bericht de netbeheerder van het landelijk hoogspanningsnet uiterlijk een
      half uur na het in artikel 10.12 genoemde tijdstip welke van die externe commerciële handelsprogramma's hij,
      rekening houdend met de beschikbare capaciteit van de landsgrensoverschrijdende verbindingen, heeft toegewezen.

      2 In geval de toewijzing, bedoeld in het eerste lid, niet overeenstemt met het in [artikel 10.12][ref3] bedoelde
      energieprogramma, dient de BRP bij de netbeheerder van het landelijk hoogspanningsnet vóór 16:00 uur een met
      betrekking tot het extern commercieel handelsprogramma bijgesteld energieprogramma in.

      3 [Artikel 10.11, vierde lid][ref4], is van overeenkomstige toepassing ten aanzien van de in het eerste en tweede
      lid bedoelde externe commerciële handelsprogramma's.

      4 Indien een toewijzing van transportcapaciteit als bedoeld in [artikel 10.11, tweede lid][ref5], of
      [artikel 10.13, eerste lid][ref6], niet vóór 17:30 uur op dezelfde dag wordt bevestigd door de beheerder van
      dat deel van de desbetreffende landsgrensoverschrijdende verbinding dat niet in Nederland is gelegen, vervalt de
      toewijzing.

      5 Zo spoedig mogelijk nadat de netbeheerder van het landelijk hoogspanningsnet de BRP die het aangaat heeft
      ingelicht dat zich het in het vierde lid bedoelde geval heeft voorgedaan, dient deze BRP een wijziging
      van het energieprogramma in waarin het vervallen van de toewijzing is verwerkt en waarbij het bepaalde in
      [artikel 10.14, vijfde lid][ref7], in acht is genomen.


