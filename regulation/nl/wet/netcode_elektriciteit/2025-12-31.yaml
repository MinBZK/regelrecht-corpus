  - number: '10.36'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet verkrijgt balanceringsdiensten door de volgende producten aan
      te kopen:

      a. reservecapaciteit FCR voor het FCP overeenkomstig ten minste de in artikel 154 van de Verordening (EU) 2017/1485
      (GL SO) bepaalde technische minimumeisen;

      b. balanceringsenergie aFRR voor het aFRP overeenkomstig het in [bijlage 8][ref1] bepaalde;

      c. balanceringscapaciteit aFRR voor het aFRP overeenkomstig het in [bijlage 9][ref2] bepaalde;

      d. balanceringscapaciteit noodvermogen voor het mFRP overeenkomstig het in [bijlage 10][ref3] bepaalde;

      e. [gereserveerd];

      f. het MARI-product betreffende balanceringsenergie voor het mFRP overeenkomstig het in [bijlage 25][ref4]
      bepaalde.

      2 [Bijlagen 8][ref5], [9][ref6], [10][ref7] en [25][ref8] beschrijven de onder het eerste lid genoemde producten
      op basis van de kenmerken voor standaardproducten zoals uiteengezet in artikel 25 van de Verordening (EU) 2017/2195
      (GL EB) waar deze relevant zijn. De producten in bijlagen 8, 9 en 25 betreffen standaardproducten. Het product in
      bijlage 10 betreft een specifiek product overeenkomstig artikel 26 van de [Verordening (EU) 2017/2195](32017R2195)
      (GL EB). Het volledige overzicht van specificaties voor de producten wordt uiteengezet in door de netbeheerder van
      het landelijk hoogspanningsnet vast te stellen procedures en specificaties.

      3

      4 De netbeheerder van het landelijk hoogspanningsnet past bij de verwerving van balanceringscapaciteit aFRR, als
      bedoeld in het eerste lid, onderdeel c, en bij de verwerving van balanceringscapaciteit noodvermogen, als bedoeld
      in het eerste lid, onderdeel d, de inkoopprocedure toe die is beschreven in [bijlage 13][ref9].


