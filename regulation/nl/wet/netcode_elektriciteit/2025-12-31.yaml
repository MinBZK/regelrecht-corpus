  - number: '9.42'
    text: |-
      De netbeheerder publiceert maandelijks op de website als bedoeld in [artikel 9.8][ref1], het in de
      voorgaande maand afgeroepen vermogen per dag. De netbeheerder maakt daarbij onderscheid tussen vermogen
      op grond van [bijlage 12][ref2], ingezet voor het sluiten van de day-aheadmarkt en het overeenkomstig
      [artikel 9.41, vierde lid][ref3], ingezette vermogen. Tevens zal de netbeheerder aangeven wanneer bij de selectie
      van een energie- of capaciteitssturing andere redenen dan kosteneffectiviteit een rol hebben gespeeld en deze keuze
      motiveren.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.8
