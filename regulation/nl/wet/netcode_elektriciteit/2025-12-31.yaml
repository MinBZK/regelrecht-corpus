  - number: '13.11'
    text: |-
      1 Een aangeslotene die beschikt over een elektriciteitsproductie-eenheid aangesloten op het landelijk
      hoogspanningsnet, verstrekt de netbeheerder van het landelijk hoogspanningsnet de plannings- en prognosegegevens
      van die elektriciteitsproductie-eenheid, te weten:

      a. de niet-beschikbaarheidsplanning van de elektriciteitsproductie-eenheid;

      b. de geplande niet-beschikbaarheid van de aansluiting waarachter de elektriciteitsproductie-eenheid zich bevindt;

      c. de test-profielen;

      d. de beperkingen van de beschikbaarheid van het werkzaam vermogen ten opzichte van de maximumcapaciteit;

      e. de prognose van de hoeveelheid op het net in te voeden werkzaam vermogen;

      f. de eventuele beperkingen in de regelcapaciteit voor blindvermogen.

      2 De gegevens als bedoeld in het eerste lid worden verstrekt onder vermelding van

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter de elektriciteitsproductie-eenheid zich bevindt;

      b. de EAN-code van de elektriciteitsproductie-eenheid, als bedoeld in [artikel 2.4, negende lid][ref2].

      3 Van de gegevens bedoeld in het eerste lid, onderdelen a, b, d, e, en f, wordt jaarlijks, uiterlijk op 1 april,
      een zo goed mogelijke schatting voor de komende tien jaar ter beschikking gesteld, met inachtneming van het
      volgende:

      a. van tijdens de zichtperiode nieuw in bedrijf te nemen elektriciteitsproductie-eenheden tevens de verwachte datum
      van inbedrijfname;

      b. van tijdens de zichtperiode te amoveren elektriciteitsproductie-eenheden tevens de verwachte datum van
      amovering;

      c. de in het eerste lid, onderdeel d, bedoelde planning, in de vorm van het verwachte draaiplan in tijdsperioden
      van minimaal één week, voorzien van een aanduiding hoe de elektriciteitsproductie-eenheid zal draaien, zoals:

      1°. basislast;

      2°. middenlast;

      3°. pieklast;

      4°. niet regelbaar vermogen;

      5°. draaiende reserve / regeleenheid;

      6°. stilstaande reserve;

      7°. stilstand.

      4 Van de gegevens bedoeld in het eerste lid, onderdelen a en b, wordt jaarlijks, uiterlijk op 1 april, een zo goed
      mogelijke schatting voor de komende drie jaar ter beschikking gesteld overeenkomstig de specificaties uit artikel
      15, eerste lid, van de Verordening (EU) 543/2013. De netbeheerder van het landelijk hoogspanningsnet draagt zo
      nodig zorg voor het doorgeven van deze gegevens aan het platform als bedoeld in artikel 3 van de Verordening (EU)
      543/2013.

      5 Van de gegevens bedoeld in het eerste lid, onderdelen a tot en met f, wordt jaarlijks, uiterlijk op 1 april, een
      zo goed mogelijke schatting voor het komende jaar ter beschikking gesteld.

      6 Tenzij anders overeengekomen, maken de gegevens bedoeld in het vierde en vijfde lid, deel uit van de gegevens in
      het tweede lid.

      7 Van de gegevens bedoeld in het eerste lid, onderdelen a tot en met f, worden wijzigingen ten opzichte van de
      gegevens, ter beschikking gesteld overeenkomstig het vijfde lid, maandelijks, uiterlijk op de vijfde dag van de
      maand, voor de komende maand ter beschikking gesteld.

      8 De gegevens bedoeld in het eerste lid, onderdelen a tot en met f, worden dagelijks, uiterlijk om 15:30 uur voor
      de komende dag ter beschikking gesteld en bestaan uit een prognose van de gemiddelde MW-waarde per kwartier.

      9 Wijzigingen ten opzichte van de overeenkomstig het achtste lid ter beschikking gestelde prognose van de
      hoeveelheid op het net in te voeden werkzaam vermogen, worden direct na het bekend worden van die wijziging aan de
      netbeheerder van het landelijk hoogspanningsnet ter beschikking gesteld, in geval van een elektriciteitsproductie-
      eenheid met een maximumcapaciteit:

      a. kleiner dan 200 MW als de wijziging groter is dan 5% van de maximumcapaciteit;

      b. groter dan of gelijk aan 200 MW als de wijziging groter is dan 10 MW.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
