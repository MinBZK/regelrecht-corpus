  - number: '12.9'
    text: |-
      1 De congestie-ontvangsten verminderd met de kosten van de toewijzing worden door de netbeheerder van het landelijk
      hoogspanningsnet en de beheerders van de buitenlandse delen van de landsgrensoverschrijdende verbindingen verdeeld.

      2 Tot de kosten bedoeld in het eerste lid behoren ook de kosten die de netbeheerder van het landelijk
      hoogspanningsnet maakt voor de inkoop van transportonafhankelijke netverliezen op de verbinding Eemshaven–Noorwegen
      en voor de inkoop van alle aan transport gerelateerde netverliezen op de verbinding Eemshaven–Denemarken.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel12.9
  - number: '12.10'
    text: |-
      Indien ten aanzien van één of meer landsgrensoverschrijdende verbindingen de beheerder van het buitenlandse deel
      niet aan de toewijzing deelneemt, verdeelt de netbeheerder van het landelijk hoogspanningsnet het Nederlandse
      deel van de betreffende verbinding via een toewijzing, waarbij de [artikelen 12.4 tot en met 12.9][ref1] van
      overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel12.4
