        artikel: '2'
  - number: '11.6'
    text: |-
      1 Als de situatie als bedoeld in [artikel 2 van het Besluit leveringszekerheid Elektriciteitswet 1998][ref1]
      gevolgen heeft voor de levering aan grootverbruikers of kleinverbruikers, zoals bedoeld in
      [artikel 95n van de Elektriciteitswet 1998][ref2], door de desbetreffende vergunninghouder, of een leverancier,
      niet zijnde een vergunninghouder, dan:

      a. treedt de BRP die de balanceringsverantwoordelijkheid voor die aangeslotenen draagt, in de plaats van de
      leverancier tot het moment waarop de betreffende aangeslotenen een nieuwe leveringsovereenkomst hebben gesloten dan
      wel de levering aan die aangeslotenen is beëindigd;

      b. stelt de netbeheerder van het landelijk hoogspanningsnet de betreffende BRP onverwijld van deze situatie op
      de hoogte;

      c. stelt de betreffende BRP de betrokken aangeslotenen zo spoedig mogelijk, maar uiterlijk binnen drie werkdagen
      na het in de plaats treden schriftelijk op de hoogte van de ontstane situatie en de thans geldende voorwaarden,
      inclusief de opzeggingsmogelijkheden;

      d. wordt de aangeslotene geacht een leveringscontract te hebben met de BRP die in de plaats van de leverancier
      treedt;

      e. heeft de aangeslotene twee maanden het recht het leveringscontract zonder opzegtermijn te beëindigen;

      f. kan de BRP, voor zover dat niet al is overeengekomen, redelijke afspraken maken ten aanzien van de
      balanceringsverantwoordelijkheid voor de aansluiting.

      2 De in het eerste lid bedoelde BRP die in de plaats van de leverancier treedt, brengt aan de aangeslotene een
      tarief voor de geleverde energie in rekening dat overeenkomt met de uurlijkse day-aheadclearingprijs, tenzij de
      aangeslotene met deze BRP anders is overeengekomen.

      3 Indien op grond van dit artikel de leverancier van groepen aangeslotenen wijzigt, zorgt de netbeheerder die het
      aangaat ervoor dat de wisseling van leverancier binnen één werkdag in het aansluitingenregister is verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0019567#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel95n
