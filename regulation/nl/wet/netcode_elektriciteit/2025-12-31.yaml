  - number: 9.1d
    text: |-
      1 Indien netbeheerders van ten opzichte van elkaar onderliggende en bovenliggende netten beide een beroep wensen
      te doen op een op grond van [artikel 9.1, derde of vierde lid][ref1], door een aangeslotene te leveren bijdrage aan
      het oplossen van fysieke congestie, stemmen de betrokken netbeheerders de inzet van de door elk van hen benodigde
      bijdrage onderling af.

      2 Indien een andere netbeheerder dan de netbeheerder van het net waarop de aangeslotenen zijn aangesloten, zich
      tegenover deze aangeslotenen beroept op de verplichting als bedoeld in [artikel 9.1, derde lid][ref2], of aan deze
      aangeslotenen de verplichting oplegt als bedoeld in artikel 9.1, vierde lid, stelt de laatstgenoemde netbeheerder
      al de benodigde gegevens ter uitvoering van de [artikelen 9.1a][ref3], [9.1b][ref4], [9.1c][ref5], [9.1e][ref6],
      [9.1g][ref7] en [9.1h][ref8] ter beschikking aan de eerstgenoemde netbeheerder.


