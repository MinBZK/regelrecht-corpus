  - number: '3.35'
    text: |-
      Indien de lokale systeemkenmerken daartoe aanleiding geven, kunnen de netbeheerder en de aangeslotenen op een
      offshore-platform overeenkomen om voor alle offshore-power park modules aangesloten op dat offshore-platform af
      te wijken van één of meer van de in de [artikelen 3.32 tot en met 3.34][ref1] bedoelde voorwaarden. In dat geval
      worden de afwijkende voorwaarden vastgelegd in de aansluit- en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.32
