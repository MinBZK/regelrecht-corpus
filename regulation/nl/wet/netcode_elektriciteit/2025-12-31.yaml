  - number: '10.43'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet kan de erkenning van een BSP intrekken indien:

      a. de BSP niet meer over een prekwalificatie voor de levering van één of meer balanceringsproducten beschikt; of

      b. de netbeheerder van het landelijk hoogspanningsnet voorziet dat een BSP niet langer in staat zal zijn, zijn
      financiële verplichtingen na te komen of voor een BSP de toepassing van de wettelijke schuldsaneringsregeling is
      uitgesproken, surséance van betaling is verleend, respectievelijk faillissement is uitgesproken.

      2 Indien de netbeheerder van het landelijk hoogspanningsnet de erkenning van een BSP intrekt, trekt hij tevens
      alle prekwalificaties voor de levering van balanceringsproducten van de desbetreffende BSP in, onverminderd
      de resterende geldigheidsduur van de prekwalificatie van de desbetreffende reserveleverende eenheden of
      reserveleverende groepen, als bedoeld in artikel 155 of 159 van [Verordening (EU) 2017/1485](32017R1485) (GL SO).

      3 Wanneer de erkenning van een BSP is ingetrokken, schrijft de netbeheerder van het landelijk hoogspanningsnet de
      desbetreffende BSP onverwijld uit het BSP-register uit.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel10.43
  - number: '11.1'
    text: |-
      1 Indien de netbeheerder van het landelijk hoogspanningsnet voorziet dat een BRP niet langer in staat zal
      zijn, zijn verplichtingen na te komen of voor een BRP de toepassing van de wettelijke schuldsaneringsregeling
      is uitgesproken, surséance van betaling is verleend, respectievelijk faillissement is uitgesproken, pleegt de
      netbeheerder van het landelijk hoogspanningsnet overleg met de Autoriteit Consument en Markt.

      2 In het in het eerste lid bedoelde overleg wordt bepaald of en zo ja onder welke voorwaarden de netbeheerder
      van het landelijk hoogspanningsnet de BRP of diens curator of bewindvoerder het volgende kan respectievelijk moet
      aanbieden:

      a. de intrekking van de erkenning als BRP op te schorten, en

      b. voor zover dat redelijkerwijs noodzakelijk is voor het borgen van de economische stabiliteit van het systeem
      garant te staan voor de kosten van inkoop van de elektriciteit en balancering en eventuele andere aan deze
      opschorting gerelateerde kosten tegen de door de netbeheerder van het landelijk hoogspanningsnet te stellen
      voorwaarden voor de garantstelling tijdens deze tijdelijke voortzetting.

      3 Afhankelijk van het resultaat van het in het eerste lid bedoelde overleg treedt de netbeheerder van het landelijk
      hoogspanningsnet in overleg met de betreffende BRP of diens curator of bewindvoerder en kan hij een aanbod doen
      tot het afgeven van een garantie als bedoeld in het tweede lid, onderdeel b. De netbeheerder van het landelijk
      hoogspanningsnet staat maximaal tien werkdagen garant voor de kosten als bedoeld in het tweede lid, onderdeel b.

      4 De netbeheerder van het landelijk hoogspanningsnet neemt de te zijnen laste blijvende kosten, gemaakt ter
      uitvoering van de in het tweede lid, onderdeel b, bedoelde garantstelling, op in zijn tarieven.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel11.1
  - number: '11.2'
    text: |-
      1 Indien de netbeheerder van het landelijk hoogspanningsnet overeenkomstig [artikel 10.10, eerste lid][ref1],
      besluit tot intrekking van de erkenning van een BRP en tevens, overeenkomstig [artikel 11.1, tweede lid][ref2],
      besluit tot opschorting van deze intrekking, stelt de netbeheerder van het landelijk hoogspanningsnet,
      in afwijking van artikel 10.10, tweede lid, onverwijld na het besluit tot opschorting de overige
      netbeheerders, BRP's, leveranciers, meetverantwoordelijken en de Autoriteit Consument en Markt daarvan in
      kennis, onder vermelding van de tijdstippen waarop de opschorting eindigt en de kennisgeving als bedoeld in
      [artikel 11.3, eerste lid, onderdeel a en b][ref3], uiterlijk plaatsvindt.

      2 In geval van toepassing van het eerste lid, communiceren de netbeheerders de in het eerste lid bedoelde
      opschorting en intrekking, inclusief geldende reactietermijnen onverwijld aan:

      a. de betreffende leveranciers, indien deze overeenkomstig [artikel 10.4, vijfde lid][ref4], zijn gemachtigd de
      balanceringsverantwoordelijkheid voor grootverbruikers te regelen;

      b. de leveranciers die de balanceringsverantwoordelijkheid hebben geregeld op grond van
      [artikel 95a, eerste lid of artikel 95n van de Elektriciteitswet 1998][ref5];

      c. de betreffende grootverbruikers, indien geen sprake is van machtiging van een leverancier voor het regelen van
      de balanceringsverantwoordelijkheid;

      d. de betreffende meetverantwoordelijken.

      3 De in het tweede lid, onderdeel a, bedoelde gemachtigde leveranciers stellen de grootverbruikers die hen
      gemachtigd hebben onverwijld in kennis van de in het eerste lid bedoelde opschorting en intrekking.

      4 Indien het volgens het eerste lid, tot opschorting van de intrekking van de erkenning van de
      betreffende BRP leidt, worden gedurende de opschorting alle individuele verzoeken tot overdracht van
      balanceringsverantwoordelijkheid naar de wegvallende BRP geweigerd.

      5 Indien de netbeheerder van het landelijk hoogspanningsnet besluit tot intrekking van de erkenning en over te gaan
      tot een verdeling als bedoeld in [artikel 11.3, eerste lid, onderdelen c en d][ref6], worden individuele verzoeken
      tot overdracht van de balanceringsverantwoordeliikheid van de wegvallende BRP naar een andere BRP geweigerd.


