      1 De netbeheerder van het landelijk hoogspanningsnet publiceert eenmalig voor de 60 kalendermaanden voorafgaand aan
      1 januari 2025, per kalendermaand de gemiddelde gewogen day-ahead-clearingprijs voor normaaluren en laaguren die
      hij voor normaaluren en laaguren afzonderlijk heeft berekend volgens de formule:

      Gemiddelde gewogen clearingprijs = (LD * clearingprijs + LD * clearingprijs + etc) / Σ LD

      waarbij LD het landelijk debiet van profielafnemers op een bepaald uur is.

      2 De netbeheerder van het landelijk hoogspanningsnet publiceert eenmalig voor de 60 kalendermaanden voorafgaand aan
      1 januari 2025 per kalendermaand de gemiddelde gewogen day-ahead-clearingprijs, zonder onderscheid naar normaaluren
      en laaguren die hij heeft berekend volgens de formule:

      Gemiddelde gewogen clearingprijs = (LD * clearingprijs + LD * clearingprijs + etc) / Σ LD

      waarbij LD het landelijk debiet van profielafnemers op een bepaald uur is.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel15.7
  - number: '15.8'
    text: |-
