  - number: '13.15'
    text: |-
      1 De netbeheerder waarvan een distributienet is aangesloten op het landelijk hoogspanningsnet, verstrekt de
      netbeheerder van het landelijk hoogspanningsnet de plannings- en prognosegegevens van:

      a. de ontwikkeling van de wintermaxima, de zomermaxima en de dalbelasting op jaarbasis;

      b. een beschrijving van het belastingpatroon (bijvoorbeeld standaard dagcurve voor een werkdag, zaterdag en
      zondag);

      c. de revisieplanning van de elektriciteitsproductie-eenheden groter dan 60 MW, die zijn aangesloten op het
      betreffende net;

      d. het samengestelde draaiplan van de elektriciteitsproductie-eenheden, die zijn aangesloten op het betreffende
      net;

      e. de geaggregeerde belasting;

      f. de geaggregeerde productie per primaire energiebron;

      g. het blindvermogen met richting.

      2 Van de gegevens als bedoeld in het eerste lid, onderdeel a tot en met g, wordt jaarlijks, uiterlijk op 1 april,
      een zo goed mogelijke schatting voor de komende tien jaar ter beschikking gesteld.

      3 Van de gegevens bedoeld in het eerste lid, onderdeel e tot en met g. wordt jaarlijks, uiterlijk op 1 april, een
      zo goed mogelijke schatting voor het komende jaar ter beschikking gesteld.

      4 De gegevens als bedoeld in het tweede en derde lid worden verstrekt van elk afzonderlijk station dat direct
      gekoppeld is aan het landelijk hoogspanningsnet, onder vermelding van:

      a. de naam van het station.

      5 Van de gegevens bedoeld in het eerste lid, onderdeel e tot en met g, wordt maandelijks, uiterlijk op de vijfde
      dag van de maand, een zo goed mogelijke schatting voor de komende maand ter beschikking gesteld.

      6 De gegevens bedoeld in het eerste lid, onderdeel e tot en met g, worden dagelijks, uiterlijk om 15:30 uur voor
      de komende dag ter beschikking gesteld en bestaan uit een prognose van de gemiddelde MW-waarde en Mvar-waarde per
      kwartier.

      7 Wijzigingen ten opzichte van de overeenkomstig het zesde lid ter beschikking gestelde prognose van de hoeveelheid
      met het net uit te wisselen werkzaam vermogen, worden direct na het bekend worden van die wijziging aan de
      netbeheerder van het landelijk hoogspanningsnet ter beschikking gesteld, in geval van een maximaal met het net uit
      te wisselen werkzaam vermogen:

      a. kleiner dan 200 MW als de wijziging groter is dan 5% van de maximaal met het net uit te wisselen werkzaam
      vermogen;

      b. groter dan of gelijk aan 200 MW als de wijziging groter is dan 10 MW.

      8 De gegevens als bedoeld in het vijfde tot en met zevende lid worden verstrekt van elk afzonderlijk
      overdrachtspunt van de aansluiting van elk afzonderlijk distributienet, onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter het distributienet zich bevindt;

      b. de EAN-code van het desbetreffende overdrachtspunt, als bedoeld in [artikel 2.4, zevende lid][ref2].

      9 Het eerste tot en met achtste lid zijn van overeenkomstige toepassing op een beheerder van een gesloten
      distributiesysteem, aangesloten op het landelijk hoogspanningsnet, waarbij:

      a. tussen de netbeheerder van het landelijk hoogspanningsnet en de desbetreffende beheerder van een gesloten
      distributiesysteem kan worden overeengekomen om op onderdelen af te wijken van het eerste tot en met het achtste
      lid;

      b. de netbeheerder van het landelijk hoogspanningsnet een verzoek van een beheerder van een gesloten
      distributiesysteem tot een andere overeenkomst niet op onredelijke gronden zal weigeren;

      c. de overeenkomst als bedoeld in onderdeel b wordt vastgelegd in de aansluit-en transport-overeenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
