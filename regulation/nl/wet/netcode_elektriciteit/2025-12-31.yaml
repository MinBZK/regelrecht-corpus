  - number: '2.27'
    text: |-
      Indien de aangeslotene geen nadere contractuele afspraken heeft gemaakt met de netbeheerder daaromtrent, varieert
      de arbeidsfactor in het overdrachtspunt tussen 0,85 (inductief) en 1,0, tenzij sprake is van kortstondige
      afwijkingen en van perioden met zeer lage belasting.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.27
  - number: '2.28'
    text: |-
      1 De aangeslotene toont aan dat bij machines, toestellen, materialen en onderdelen in elektrische installaties of
      aangesloten op elektrische installaties waarvan de elektromagnetische compatibiliteit niet is vastgelegd in een
      wettelijke regeling, op het netaansluitpunt wordt voldaan aan de voorschriften ter zake van elektromagnetische
      compatibiliteit die door de netbeheerder zijn vastgesteld.

      2 Voor apparatuur met een vermogen groter dan 11 kVA zijn de ”Richtlijnen voor toelaatbare harmonische stromen
      geproduceerd door apparatuur met een vermogen groter dan 11 kVA” uit juni 1997 uitgegeven door EnergieNed van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.28
  - number: '2.29'
    text: |-
      In aanvulling op de voorwaarden in de [paragrafen 2.1][ref1], [2.2][ref2] en [2.3][ref3] gelden voor aansluitingen
      op een wisselstroomnet met een spanningsniveau kleiner dan of gelijk aan 1 kV de voorwaarden van deze paragraaf.


