  - number: '10.16'
    text: |-
      1 De door de netbeheerder, op basis van [artikel 10.26, derde lid][ref1], van een BRP ontvangen verzoeken tot
      aanpassing van de hem eerder op basis van [artikel 10.18, vierde lid][ref2], en [10.19, vierde lid][ref3],
      toegezonden meetgegevens zullen door de netbeheerder worden afgehandeld binnen twee werkdagen na ontvangst van het
      verzoek tot aanpassing.

      2 Verzoeken op basis van [artikel 10.26, derde lid][ref4], neemt de netbeheerder aan wie het verzoek is
      gericht niet in behandeling wanneer meer dan vijf werkdagen zijn verstreken na de dag waarop hij overeenkomstig
      [artikel 10.18, vierde lid][ref5], of [10.19, vierde lid][ref6], de meetgegevens aan die BRP heeft verzonden,
      tenzij de BRP de fout waarvan hij correctie verzoekt redelijkerwijs niet binnen die termijn heeft kunnen opmerken.

      3 De netbeheerder beoordeelt het verzoek tot aanpassing en beantwoordt dit met een acceptatie of afwijzing met
      reden.


