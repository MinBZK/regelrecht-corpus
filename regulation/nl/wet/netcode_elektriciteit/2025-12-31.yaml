  - number: '9.45'
    text: |-
      1 De netbeheerder voert dagelijks de procedure zoals beschreven in het tweede tot en met het zesde lid uit.

      2 De netbeheerder kan voorafgaand aan de procedure zoals beschreven in dit artikel gebruik maken van het vermogen
      dat aangeslotenen of CSP’s overeenkomstig de specificaties in [bijlage 12][ref1] ter beschikking hebben gesteld ten
      behoeve van het oplossen van fysieke congestie.

      3 Mede op basis van de gegevens die de netbeheerder ontvangt op grond van [artikel 9.35][ref2] en
      [paragraaf 13.2][ref3] bepaalt de netbeheerder of de van toepassing zijnde operationele veiligheidsgrenzen de
      volgende dag in het congestiegebied kunnen worden gehandhaafd.

      4 De netbeheerder publiceert uiterlijk om 15:30 uur of de volgende dag in (een deel van) het congestiegebied
      congestie verwacht wordt.

      5 De netbeheerder draagt met in achtneming van [artikel 9.43][ref4] aangeslotenen op hoeveel zij per
      onbalansverrekeningsperiode de volgende dag meer of minder dienen in te voeden dan wel te verbruiken.

      6 De netbeheerder roept per onbalansverrekeningsperiode per opgedragen actie overeenkomstig het vijfde lid een
      gelijke hoeveelheid vermogen af buiten het congestiegebied. Hij maakt daarvoor gebruik van het hem overeenkomstig
      [artikel 9.1][ref5] ter beschikking gestelde vermogen.

      7 Onverminderd het bepaalde in [artikel 9.2, vierde lid][ref6], volgt de netbeheerder bij wijzigingen van de in het
      derde lid bedoelde gegevens de stappen als bedoeld in het vijfde en zesde lid.


