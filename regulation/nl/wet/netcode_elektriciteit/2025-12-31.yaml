        artikel: '21'
  - number: '9.5'
    text: |-
      1 De netbeheerder hanteert bij de beoordeling van de aanwezige transportcapaciteit in een net de volgende aspecten:

      a. de technische capaciteit van het net;

      b. de van toepassing zijnde netontwerpcriteria en operationele veiligheidsgrenzen met inachtneming van
      [artikel 16, eerste lid, onderdeel d, van de Elektriciteitswet 1998][ref1].

      2 De netbeheerder hanteert bij de beoordeling van de benodigde transportcapaciteit in een net de volgende aspecten:

      a. de periode waarover de beoordeling benodigd is;

      b. het totaal van het gecontracteerd transportvermogen voor afname of voor invoeding;

      c. het meest aannemelijke profiel voor de belasting van het beperkende netelement op basis van een berekening van
      het verwachte profiel en richting van transport van de aangeslotenen, rekening houdend met de topologie van het
      net;

      d. informatie die hij op grond van [paragraaf 13.2][ref2] ontvangt;

      e. de mogelijkheden om overeenkomstig [artikel 9.1, eerste lid][ref3], fysieke congestie op te lossen; en

      f. overheidsbeleid dat van invloed is op de inrichting van het net, als bedoeld in
      __REF000___________________________________________________________________________________________________________
      __.

      3 De beoordelingen genoemd in het eerste en tweede lid worden uitgewerkt in de vorm van scenario’s.

      4 De beschikbare transportcapaciteit is het deel van de aanwezige transportcapaciteit dat niet wordt ingezet om aan
      de benodigde transportcapaciteit te voldoen en is gelijk aan het verschil tussen de aanwezige transportcapaciteit
      en de benodigde transportcapaciteit.

      5 Wanneer de benodigde transportcapaciteit, inclusief de eventuele gevraagde transportcapaciteit, de aanwezige
      transportcapaciteit overschrijdt, maakt de netbeheerder een inschatting van de hoeveelheid niet te transporteren
      elektriciteit inclusief onzekerheidsmarge.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
