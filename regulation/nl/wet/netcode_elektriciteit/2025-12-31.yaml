  - number: 9.1i
    text: |-
      De gezamenlijke netbeheerders evalueren in afstemming met representatieve organisaties jaarlijks de hoogte van
      de in [artikel 9.1g, tweede lid][ref1], en [artikel 9.1h, tweede lid][ref2], genoemde bedragen op in ieder geval
      noodzakelijkheid en effectiviteit en brengen hiervan verslag uit aan de ACM.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.1g
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.1h
