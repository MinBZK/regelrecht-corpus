  - number: '7.16'
    text: |-
      1 Voor aansluitingen die behoren tot een tariefcategorie als bedoeld in
      [artikel 3.7.1, onderdelen d en e, van de Tarievencode elektriciteit][ref1], geldt dat bij overschrijding van
      het gecontracteerd transportvermogen voor afname het gecontracteerd transportvermogen voor afname wordt aangepast
      naar de waarde van de overschrijding. De nieuwe waarde geldt vanaf de eerste dag van de kalendermaand waarin de
      overschrijding zich voordoet.

      2 Indien de aangeslotene hier om verzoekt, past de netbeheerder het gecontracteerd transportvermogen voor
      afname naar boven of beneden aan, waarbij geldt dat de nieuwe waarde ten vroegste ingaat op de eerste dag van de
      kalendermaand die volgt op de maand waarin het verzoek is gedaan maar voor een verlaging niet eerder ingaat dan
      twaalf maanden na de laatst opgetreden aanpassing naar boven van het gecontracteerd transportvermogen.

      3 Indien binnen twaalf maanden na een verzoek om aanpassing van het gecontracteerd transportvermogen voor afname
      naar beneden een overschrijding van de verlaagde waarde plaatsvindt, wordt het gecontracteerd transportvermogen
      voor afname aangepast naar de waarde van de overschrijding. Deze waarde geldt met terugwerkende kracht vanaf de
      eerste dag van de kalendermaand waarin de hiervoor bedoelde aanpassing naar beneden heeft plaatsgevonden.

      4 Onverminderd het bepaalde in het eerste en het tweede lid past de netbeheerder binnen twaalf maanden na de
      verhoging het gecontracteerd transportvermogen voor afname behorende bij aansluitingen als bedoeld in het eerste
      lid naar beneden aan, indien de aangeslotene hier op redelijke gronden om verzoekt, bijvoorbeeld naar aanleiding
      van sterk gewijzigde omstandigheden bij de verbruiker die vooraf niet in redelijkheid hadden kunnen worden
      voorzien. De netbeheerder kan nadere onderbouwing van de aangegeven gronden voor het verzoek verlangen. De nieuwe
      waarde gaat ten vroegste in op de eerste dag van de kalendermaand die volgt op de maand waarin het verzoek is
      gedaan.

      5 Het eerste lid of een aanpassing naar boven als bedoeld in het tweede, derde of vierde lid is niet toegestaan
      indien de aansluiting zich bevindt in een congestiegebied voor dezelfde energierichting als bedoeld in
      [artikel 9.9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3.7.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.9
