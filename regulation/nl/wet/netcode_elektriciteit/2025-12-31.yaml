    text: |-
      1 De gegevens als bedoeld in [artikel 13.1 tot en met 13.4][ref1], worden geactualiseerd, overeenkomstig de
      termijnen, te weten:

      a. halfjaarlijks uiterlijk op 1 april en op 1 oktober;

      b. uiterlijk drie maanden voor de inbedrijfname van een nieuwe of gewijzigde elektriciteitsproductie-eenheid
      of verbruiksinstallatie of van wijziging in de karakteristieken van een elektriciteitsproductie-eenheid of
      verbruiksinstallatie.

      2 De gegevens als bedoeld in [artikel 13.5][ref2] en [13.8][ref3] worden geactualiseerd, overeenkomstig de
      termijnen:

      a. halfjaarlijks, uiterlijk op 1 april en op 1 oktober;

      b. uiterlijk zes maanden voor de inbedrijfname van een nieuw netelement of van een wijziging in de karakteristieken
      van een netelement;

      c. zo spoedig mogelijk indien sprake is van een wijziging van de observatiezone voor zover het gegevens betreft
      die door deze wijziging van de observatiezone geraakt worden of indien een fout in de eerder aangeleverde gegevens
      wordt geconstateerd.

      3 De gegevens als bedoeld in [artikel 13.6][ref4] en [13.7][ref5], worden geactualiseerd:

      a. jaarlijks uiterlijk op 1 april;

      b. uiterlijk zes maanden voor de inbedrijfname van een nieuw netelement of van een wijziging in de karakteristieken
      van een netelement.


