  - number: 7.1f
    text: |-
      1 Indien op grond van [artikel 7.1e, eerste lid, onderdelen d en e][ref1], aanpassingen aan de meetinrichting
      nodig zijn, zijn de voor onderdeel d benodigde aanpassingen gereed op moment van afsluiten van de
      groepstransportovereenkomst en zijn de voor onderdeel e benodigde aanpassingen gereed uiterlijk 6 maanden na het
      afsluiten van de groepstransportovereenkomst.

      2 De netbeheerder kan, indien hij dit nodig acht om de veiligheid en betrouwbaarheid van het net en het doelmatig
      netbeheer te borgen, bij het aangaan of wijzigen van een groepstransportovereenkomst aan één of meer aansluitingen
      die deelnemen aan een groep, in aanvulling op het door de groep gecontracteerde transportvermogen voor invoeding of
      voor afname en de aansluitcapaciteit van de individuele aansluitingen:

      a. een beperking opleggen voor de maximale te benutten transportcapaciteit; en

      b. verplicht stellen dat de aangeslotenen die deel uitmaken van de groep op de deelnemende aansluiting(en) op eigen
      kosten een technische voorziening installeren teneinde de opgelegde beperking te borgen.

      3 Indien de netbeheerder het op grond van het tweede lid noodzakelijk acht om een beperking op te
      leggen en/of een voorziening te verplichten, informeert de netbeheerder de gemachtigde van de groep
      van aangeslotenen hierover schriftelijk binnen een redelijke termijn, waarbij het standpunt van
      de netbeheerder is voorzien van een deugdelijke motivering aan de hand van de criteria genoemd in
      [artikel 7.1e, eerste lid, onderdeel f, onder 4°, punt i tot en met iv][ref2], over de noodzaak van deze beperking
      en/of de voorziening, inclusief de relevante informatie die de netbeheerder bij zijn standpunt heeft betrokken.

      4 De netbeheerder houdt rekening met de belangen van de groep van aangeslotenen die deelneemt aan een
      groepstransportovereenkomst en informeert de gemachtigde van de groep vooraf indien aanpassing van het net nodig is
      vanuit het oogpunt van veiligheid, betrouwbaarheid of doelmatig netbeheer voor zover die netaanpassing van invloed
      is op de groep.

      5 De netbeheerder informeert de op de aansluitingen die deelnemen aan de groep gecontracteerde marktpartijen binnen
      een week na afsluiten of wijzigen van een groepstransportovereenkomst over het toetreden tot en uittreden uit de
      groepstransportovereenkomst.


