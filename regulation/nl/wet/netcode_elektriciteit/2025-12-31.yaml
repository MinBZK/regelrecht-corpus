      [artikel 3.7.16 van de Tarievencode elektriciteit][ref2] doet de netbeheerder van het landelijk hoogspanningsnet,
      in samenwerking met de aangeslotenen die gebruik maken van bedoelde regeling een onderzoek naar de wenselijkheid
      van continuering, wijziging of opheffen per 1 april 2040 van bedoelde regeling.


