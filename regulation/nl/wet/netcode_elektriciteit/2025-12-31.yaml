  - number: '8.10'
    text: |-
      1 De netbeheerder dient een vergoeding te betalen aan de aangeslotene die beschikt over een
      elektriciteitsproductie-eenheid die met gebruikmaking van de vrijstellingen voor productie als bedoeld in
      [artikel 4a.1, onderdeel a, subonderdeel 2°][ref1], [artikel 4a.2, onderdeel a, subonderdeel 2°][ref2],
      [artikel 4a.3, onderdeel a, subonderdeel 2°][ref3], artikel 4a.3, onderdeel b, subonderdeel 2°,
      [artikel 4a.4, eerste lid, onderdeel a, subonderdeel 2°][ref4] en artikel 4a.4 eerste lid, onderdeel b,
      subonderdeel 2°, van het [Besluit investeringsplan en kwaliteit elektriciteit en gas][ref5] is aangesloten op een
      hoogspanningsnet of op het onderliggende middenspanningsnet bij het afschakelen van een elektriciteitsproductie-
      eenheid die is aangesloten op een hoogspanningsnet zonder enkelvoudige storingsreserve, dan wel op het
      onderliggende net, indien:

      a. er sprake is van een uitvalsituatie als bedoeld in de hiervoor genoemde onderdelen van het
      [Besluit investeringsplan en kwaliteit elektriciteit en gas][ref6]; en

      b. de elektriciteitsproductie-eenheid ten gevolge van deze uitvalsituatie wordt afgeschakeld of afgeregeld; en

      c. de uitvalsituatie langer duurt dan de compensatievrije hersteltijden genoemd in de compensatieregeling in
      [artikel 8.8, eerste lid][ref7].

      2 Voor het bepalen van de hoogte van de vergoeding wordt aangesloten bij de elementen uit artikel 13, zevende lid,
      van [Verordening (EU) 2019/943](32019R0943) van het Europees parlement en de Raad van 5 juni 2019 betreffende de
      interne markt voor elektriciteit.

      3

      De kosten voor de vergoeding als bedoeld in het eerste lid komen voor rekening van de netbeheerder in wiens net de
      oorzaak van de uitvalsituatie lag.


