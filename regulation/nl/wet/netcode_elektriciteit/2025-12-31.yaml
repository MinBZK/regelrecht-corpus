  - number: '9.19'
    text: |-
      Onverminderd het bepaalde in [artikel 9.1, derde lid][ref1], stellen aangeslotenen, niet zijnde netbeheerders
      en groepen van aangeslotenen die een groepstransportovereenkomst hebben afgesloten, met een gecontracteerd
      transportvermogen voor afname of voor invoeding van meer dan 60 MW dagelijks het vermogen dat minder kan
      worden afgenomen, respectievelijk meer of minder kan worden ingevoed, ter beschikking van de netbeheerder van
      het landelijk hoogspanningsnet door middel van het aanwijzen van een BSP, of, in het geval van groepen van
      aangeslotenen die een groepstransportovereenkomst hebben afgesloten, één of meerdere BSP’s, om biedingen voor
      balanceringsenergie uit aFRR in te dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.1
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel9.19
