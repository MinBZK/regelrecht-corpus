  - number: '9.33'
    text: |-
      1 De netbeheerders publiceren het volledige overzicht van specificaties voor de producten op grond van
      [bijlage 11][ref1] en [12][ref2], inclusief procedures en pre-kwalificatiecriteria op de in [artikel 9.8][ref3]
      bedoelde website.

      2 De netbeheerder geeft in de productspecificaties als bedoeld in het eerste lid ten minste aan hoe de verrekening
      zal plaatsvinden en op welke termijn. Deze verrekening zal gebaseerd zijn op ten minste de volgende gegevens:

      a. per onbalansverrekeningsperiode, het volume van biedingen redispatch per richting en de prijs van de
      geaccepteerde bieding bij producten op grond van [bijlage 11][ref4];

      b. de hoeveelheid capaciteitssturing en de prijs voor de sturing bij producten op grond van [bijlage 12][ref5].


