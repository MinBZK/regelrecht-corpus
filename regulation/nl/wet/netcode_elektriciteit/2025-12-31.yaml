        paragraaf: '9.1'
  - number: '9.2'
    text: |-
      1 De netbeheerders controleren mede op basis van de ingediende prognoses als bedoeld in
      [artikel 13.11, achtste lid en negende lid][ref1], [13.12, zevende en achtste lid][ref2],
      [13.13, zesde en zevende lid][ref3], [13.14, zesde en zevende lid][ref4],
      [13.15 zevende, achtste en negende lid][ref5], [artikel 13.17, zevende, achtste en negende lid][ref6], of
      transportproblemen te verwachten zijn. De netbeheerders hanteren daarbij bedrijfsvoeringscriteria voor de veilig
      toelaatbare transporten.

      2 In geval van koppeling tussen twee distributienetten controleren beide betrokken netbeheerders of er
      transportproblemen te verwachten zijn.

      3 Indien in de operationele planning (dagelijkse voorbereiding) de netbeheerder in zijn net een transportprobleem
      constateert, treft de netbeheerder maatregelen om het transportprobleem tegen de laagst mogelijke kosten op te
      lossen. De netbeheerder:

      a. bepaalt de te nemen maatregelen en verifieert de effectiviteit van deze maatregelen door een (loadflow)analyse
      uit te voeren op de betrouwbaarheid van het transport van elektriciteit;

      b. maakt bij het oplossen gebruik van het hem overeenkomstig [artikel 9.1, tweede en derde lid][ref7], ter
      beschikking gestelde vermogen of het op grond van artikel 9.1, eerste lid, ter beschikking gestelde vermogen
      indien op grond van [bijlage 12, vijfde lid][ref8], inzet na gate-sluitingstijd van de day-aheadmarkt op de dag
      voorafgaande aan het transport van het ter beschikking gestelde vermogen is afgesproken;

      c. stuurt, indien de maatregelen als bedoeld in onderdeel b niet afdoende zijn om het transportprobleem op te
      heffen, verzoeken aan de desbetreffende aangeslotenen om meer respectievelijk minder te produceren of af te nemen
      en geeft aan waar en hoe lang de gevraagde acties duren; en

      d. zorgt er voor dat de onbalans ten gevolge van de maatregel wordt opgeheven, door per onbalansverrekeningsperiode
      per afgeroepen bieding dan wel opgedragen capaciteitsvermindering elders een gelijke tegengestelde hoeveelheid
      vermogen af te roepen voor dezelfde onbalansverrekeningsperiode. Hij maakt daarvoor gebruik van het hem
      overeenkomstig [artikel 9.1, tweede en derde lid][ref9], ter beschikking gestelde vermogen of het op grond van
      artikel 9.1, eerste lid ter beschikking gestelde vermogen indien op grond van [bijlage 12][ref10] inzet na gate-
      sluitingstijd van de day-aheadmarkt op de dag voorafgaande aan het transport van het ter beschikking gestelde
      vermogen is afgesproken.

      4 Indien na het oplossen van het transportprobleem de mogelijkheid bestaat dat in hetzelfde net opnieuw één of meer
      transportproblemen optreden, kan de netbeheerder van dat net, in afwijking van [artikel 7.1a, eerste lid][ref11],
      [artikel 7.1b, eerste lid][ref12], [artikel 7.1c, eerste lid][ref13] en [artikel 7.1d, eerste lid][ref14]
      restricties opleggen aan aangeslotenen of BRP’s. De restrictie houdt in dat de netbeheerder, gedurende de tijd
      waarvoor de restrictie geldt, wijzigingen van prognoses als bedoeld in [artikel 13.11, negende lid][ref15],
      [artikel 13.12, achtste lid][ref16], [artikel 13.13, zevende lid][ref17], [artikel 13.14, zevende lid][ref18],
      [artikel 13.15, achtste lid][ref19], en [artikel 13.17, achtste lid][ref20] niet accepteert indien
      deze leiden tot nieuwe transportproblemen. In dat geval worden wijzigingen van prognoses als bedoeld in
      [artikel 9.35, vierde en vijfde lid][ref21] eveneens niet geaccepteerd.

      5 De netbeheerder publiceert de afroep van de maatregel als bedoeld in het vierde lid op de in [artikel 9.8][ref22]
      bedoelde website.

      6 In de communicatie als bedoeld in het vijfde lid, wordt aangegeven:

      a. de richting waarvoor de restrictie geldt;

      b. de specifieke markttijdseenheid waarvoor de restrictie geldt;

      c. de plaats (net); en

      d. de acties die de netbeheerder reeds heeft genomen om het transportprobleem op te lossen gedurende de specifieke
      markttijdseenheden waarvoor de marktrestrictie geldt en de hierbij gerealiseerde volumes redispatch.

      7 De in het vierde lid genoemde restrictie wordt met onmiddellijke ingang opgeheven zodra de noodzaak daartoe niet
      meer aanwezig is.

      8 Indien de restrictie opgeheven is, meldt de netbeheerder dit zo spoedig mogelijk aan alle betrokkenen met een
      bericht op de in [artikel 9.8][ref23] bedoelde website.

      9 De netbeheerder die een maatregel, als bedoeld in het derde lid, treft, verzorgt de administratieve
      afhandeling daarvan, waaronder begrepen de financiële afrekening op basis van de biedingen zoals genoemd in
      [artikel 9.1][ref24] en [9.19][ref25]. Indien een netbeheerder een bieding ontvangt van een aangeslotene in het
      netgebied van een andere netbeheerder, wisselen de betrokken netbeheerders de ten behoeve van de verificatie
      en financiële afrekening benodigde gegevens uit, waaronder begrepen de op grond van [paragraaf 13.2][ref26]
      en [artikel 9.35][ref27] door of namens de aangeslotene aangeleverde gegevens en de in artikel 9.1, zesde lid,
      onderdeel a bedoelde gegevens. De netbeheerders dragen onderling zorg voor een correcte financiële afwikkeling
      tussen de netbeheerders.


