  - number: '9.10'
    text: |-
      1 In het onderzoek, als bedoeld in [artikel 9.6, eerste lid][ref1], en [artikel 9.7, eerste lid][ref2], onderzoekt
      de netbeheerder voor een gebied waarvoor de netbeheerder een vooraankondiging heeft afgegeven, de mogelijkheden
      voor de toepassing van congestiemanagement overeenkomstig paragraaf 9.9 en [9.10][ref3].

      2 De volgende uitzonderingen gelden voor het toepassen van congestiemanagement, als bedoeld in het eerste lid:

      a. de netbeheerder hoeft geen congestiemanagement toe te passen als de periode van het verwachte tekort aan
      beschikbare transportcapaciteit korter duurt dan 1 jaar en het congestiegebied in drie jaar daarvoor geen
      congestiegebied is geweest, of onderdeel uitmaakte van een of meer congestiegebieden beheerd door de desbetreffende
      netbeheerder;

      b. de netbeheerder past geen niet-marktgebaseerde redispatch toe om de vraag naar transport van verbruikende
      aangeslotenen te verminderen ten behoeve van een verzoek als bedoeld in [artikel 9.6, eerste lid][ref4];

      c. de netbeheerder hoeft per congestiegebied geen congestiemanagement toe te passen voor de vraag naar transport
      waarvoor geldt dat de kosten voor congestiemanagement gedurende de periode vanaf de vooraankondiging als bedoeld
      in [artikel 9.9, eerste lid][ref5], tot het moment dat er geen sprake meer is van een structureel tekort aan
      beschikbare transportcapaciteit, groter is dan de financiële grens. Deze financiële grens bedraagt 1,02 euro per
      MWh van de hoeveelheid elektriciteit die met de aanwezige transportcapaciteit kan worden getransporteerd in dit
      congestiegebied gedurende de periode waarvoor het congestiegebied is aangewezen;

      d. de netbeheerder hoeft geen congestiemanagement toe te passen voor de vraag naar transport waarvoor de benodigde
      transportcapaciteit groter is dan de technische grens van de aanwezige transportcapaciteit. Deze technische
      grens bedraagt 100% van de aanwezige transportcapaciteit vermeerderd met het aanwezige regelbaar vermogen, tot
      een maximum van 150% van de aanwezige transportcapaciteit. Bij de bepaling van deze technische grens worden
      aansluitingen die gebruik maken van [artikel 7.1b][ref6], [artikel 7.1c][ref7] of [artikel 7.1d][ref8] niet
      betrokken;

      e. de technische grens als bedoeld in het tweede lid, onderdeel d bedraagt 100% van de aanwezige
      transportcapaciteit indien het beperkende netelement gelegen is in het laagspanningsnet; of

      f. de netbeheerder hoeft geen congestiemanagement toe te passen voor de vraag naar transport waardoor het
      toegestane kortsluitvermogen van het net wordt overschreden.

      3 De netbeheerder publiceert het onderzoek, als bedoeld in het eerste lid, op de in [artikel 9.8][ref9] bedoelde
      website voor invoedings-congestie binnen zes maanden na het doen van de vooraankondiging en voor afname-congestie
      binnen twaalf maanden na het doen van de vooraankondiging, als bedoeld in [artikel 9.9, eerste lid][ref10]. Het
      onderzoeksrapport bevat ten minste de elementen als benoemd in [bijlage 14][ref11]. Separaat stuurt de netbeheerder
      de gegevens naar de Autoriteit Consument en Markt, waarbij de gegevens uit bijlage 14, eerste lid, onderdeel e, per
      uur of kwartier worden verstrekt.

      4 Indien de netbeheerder het in het eerste lid bedoelde onderzoek heeft uitgevoerd op grond van
      [artikel 9.6, eerste lid, onderdeel d][ref12], en uit het in het eerste lid genoemde onderzoek blijkt dat
      congestiemanagement geen oplossing biedt of de in [artikel 9.9, eerste lid][ref13], gemelde vooraankondiging, om
      wat voor reden dan ook, is komen te vervallen, doet de netbeheerder hiervan binnen één week na afronding van het
      onderzoek, of na het bekend worden van elke andere reden, melding via de in [artikel 9.8][ref14] bedoelde website.
      Deze melding zal ten minste bevatten:

      a. het gebied waarop de melding betrekking heeft; en

      b. een verklaring waarom de vooraankondiging is komen te vervallen.

      5 Indien de netbeheerder het in het eerste lid bedoelde onderzoek heeft uitgevoerd op grond van
      [artikel 9.7, eerste lid, onderdeel c][ref15], en uit het in het eerste lid genoemde onderzoek blijkt dat
      congestiemanagement geen oplossing biedt, doet de netbeheerder hiervan binnen één week na afronding van het
      onderzoek, melding via de in [artikel 9.8][ref16] bedoelde website. Deze melding zal ten minste bevatten:

      a. het gebied waarop de melding betrekking heeft; en

      b. de termijn waarbinnen overgegaan zal worden op de procedure overeenkomstig de paragrafen 9.9 en [9.11][ref17].
      Deze termijn zal niet korter zijn dan een week.


