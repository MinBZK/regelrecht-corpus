  - number: '3.22'
    text: |-
      1 De beproevingen waarmee aan een verzoek als bedoeld in [artikel 3.21, eerste lid][ref1], kan worden voldaan,
      de wijze van uitvoering daarvan alsmede de wijze van rapporteren over en de beoordeling door de netbeheerder van
      het landelijk hoogspanningsnet van de beproevingen worden gespecificeerd door de netbeheerder van het landelijk
      hoogspanningsnet en gepubliceerd op diens website.

      2 Indien uit de beproevingsresultaten blijkt dat de elektriciteitsproductie-eenheid niet aan de eisen voldoet,
      verplicht de netbeheerder van het landelijk hoogspanningsnet de aangeslotene om maatregelen te nemen. De
      netbeheerder van het landelijk hoogspanningsnet stelt, na de aangeslotene daarover te hebben gehoord, een termijn
      voor het uitvoeren van de maatregelen vast. Nadat de maatregelen genomen zijn, wordt de beproeving herhaald.

      3 De in de dit artikel bedoelde beproevingen worden uitgevoerd door en op kosten van de aangeslotene.


