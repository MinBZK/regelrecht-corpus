  - number: '9.36'
    text: |-
      1 Indien de CG-aangeslotene afwijkt van de op grond van [artikel 9.35][ref1] en [paragraaf 13.2][ref2] aangeleverde
      gegevens, berekent de netbeheerder voor het verschil tussen die gegevens en de daadwerkelijk uitgewisselde energie
      op de desbetreffende aansluiting dan wel groep van aansluitingen per onbalansverrekeningsperiode een prijs per MWh,
      hierna te noemen de congestie-nietleveringprijs.

      2 De congestie-nietleveringprijs is ten hoogste gelijk aan, indien het in het eerste lid bedoelde verschil
      tussen de op grond van [artikel 9.35][ref3] en [paragraaf 13.2][ref4] aangeleverde gegevens en de daadwerkelijk
      uitgewisselde energie het karakter heeft van:

      a. het invoeden van energie, de voor de desbetreffende onbalansverrekeningsperiode geldende landelijke
      onbalansprijs voor onbalans met het karakter invoeden aangevuld met de financiële ondersteuning die de CG-
      aangeslotene op basis van het geproduceerde elektriciteitsvolume ontvangt. Indien de voor de desbetreffende
      onbalansverrekeningsperiode geldende landelijke onbalansprijs voor onbalans met het karakter invoeden negatief is,
      dan bedraagt de congestie-nietleveringprijs € 0,00;

      b. het afnemen van energie, de voor de desbetreffende onbalansverrekeningsperiode landelijke onbalansprijs voor
      onbalans met het karakter afnemen dan wel de geldende day-aheadclearingprijs indien deze hoger is;

      c. het afnemen van energie en indien de fallback procedure is toegepast als bedoeld in [artikel 12.16][ref5] of
      als bedoeld in artikel 44 van de [Verordening (EU) 2015/1222](33122R2015) (GL CACM), de voor de desbetreffende
      onbalansverrekeningsperiode landelijke onbalansprijs voor onbalans met het karakter afnemen dan wel de geldende
      referentie biedzone prijs indien deze hoger is.

      3 De netbeheerder kan de inkoopkosten voor de additionele behoefte aan flexibiliteit die ontstaat als gevolg
      van niet-levering door een CG-aangeslotene, op de CG-aangeslotene verhalen. De netbeheerder verschaft de CG-
      aangeslotene een onderbouwing van deze kosten.

      4 De netbeheerder brengt ten hoogste de hoogste van de op het tweede en derde lid gebaseerde vergoeding in
      rekening.

      5 De verrekening van de congestie-nietleveringprijs of de additionele kosten als bedoeld in het tweede en derde lid
      vindt gelijktijdig plaats met de verrekening als bedoeld in [artikel 9.33, tweede lid][ref6].


