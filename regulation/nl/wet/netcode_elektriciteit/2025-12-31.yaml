  - number: '3.13'
    text: |-
      1 De elektriciteitsproductie-eenheid is in staat om op het net aangesloten en in bedrijf te blijven binnen de
      volgende frequentiebanden en tijdsperiodes, als bedoeld in artikel 13, eerste lid, onderdeel a, subonderdeel i, van
      de Verordening (EU) 2016/631 (NC RfG):

      a. in de frequentieband van 47,5 Hz tot 48,5 Hz gedurende 30 minuten;

      b. in de frequentieband van 48,5 Hz tot 49,0 Hz gedurende 30 minuten;

      c. in de frequentieband van 49,0 Hz tot 51,0 Hz gedurende onbeperkte tijd;

      d. in de frequentieband van 51,0 Hz tot 51,5 Hz gedurende 30 minuten.

      2 Voor de frequentiegradiënt van elektriciteitsproductie-eenheden als bedoeld in artikel 13, eerste lid, onderdeel
      b, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG) gelden de volgende drempelwaarden:

      a. 1 Hertz per seconde gedurende een voortschrijdend tijdsvenster van 500 milliseconden in het geval er sprake is
      van een synchrone elektriciteitsproductie-eenheid;

      b. In afwijking van a. kan in overleg met de netbeheerder de drempelwaarde van de frequentiegradiënt voor een
      synchrone elektriciteitsproductie-eenheid lager worden vastgesteld;

      c. 2 Hertz per seconde gedurende een voortschrijdend tijdsvenster van 500 milliseconden in het geval er sprake is
      van een power park module.

      3 Indien een elektriciteitsproductie-eenheid geïntegreerd is in een industrieel productieproces, met dien verstande
      dat het afgegeven vermogen niet kan worden gewijzigd zonder verstoring van het productieproces, is het toegestaan
      om de activering van de FSM te relateren aan het in het (de) overdrachtspunt(en) van de aansluiting resulterende
      vermogen.

      4 De elektriciteitsproductie-eenheid is voor de gelimiteerde frequentiegevoelige modus – overfrequentie (LFSM-
      O) in staat om de levering van de frequentierespons te activeren, als bedoeld in artikel 13, tweede lid, van de
      Verordening (EU) 2016/631 (NC RfG), waarbij:

      a. de frequentiedrempelwaarde instelbaar is tussen 50,2 Hz en 50,5 Hz (inclusief);

      b. de instelling van de frequentiedrempelwaarde 50,2 Hz is;

      c. de statiek instelbaar is tussen 4% en 12%;

      d. de default instelling van de statiek 5% is;

      e. de elektriciteitsproductie-eenheid bij het bereiken van het minimumregelniveau op dit niveau in bedrijf blijft;

      f. in geval van een power park module is P, als bedoeld in figuur 1 van de Verordening (EU) 2016/631 (NC RfG),
      gelijk aan het feitelijk gegenereerde werkzame vermogen op het moment dat de drempelwaarde van de LFSM-O is
      bereikt.

      5 Indien de technische mogelijkheden van de elektriciteitsproductie-eenheid daartoe aanleiding geven, wordt het
      toestaan van reductie van het werkzame vermogen beneden een frequentie van 49,5 Hz met een gradiënt van 10% van de
      maximale capaciteit bij 50 Hz per frequentiedaling met 1 Hz, als bedoeld in artikel 13, vierde en vijfde lid, van
      de Verordening (EU) 2016/631 (NC RfG) vastgelegd in de aansluit- en transportovereenkomst.

      6 De netbeheerder stelt eisen overeenkomstig uniforme, door de gezamenlijke netbeheerders overeengekomen,
      specificaties aan de apparatuur waarmee het werkzaam uitgangsvermogen van een elektriciteitsproductie-eenheid
      op afstand binnen vijf seconden naar nul kan worden gereduceerd, als bedoeld in artikel 13, zesde lid, van de
      [Verordening (EU) 2016/631](32016R0631) (NC RfG). De gezamenlijke netbeheerders maken de eisen openbaar.

      7 De elektriciteitsproductie-eenheid is in staat om automatisch aan het net te koppelen, als bedoeld in artikel 13,
      zevende lid, van de Verordening (EU) 2016/631 (NC RfG), indien:

      a. de spanning groter is dan of gelijk aan 0,90 pu en kleiner dan of gelijk aan 1,10 pu;

      b. de frequentie groter is dan of gelijk aan 49,9 Hz en kleiner dan of gelijk aan 50,1 Hz;

      c. de minimum tijd dat de spanning en de frequentie zich binnen de in de onderdelen a en b genoemde bereiken
      bevinden 60 seconden is;

      d. de maximum gradiënt van het werkzaam vermogen 20% is van de maximumcapaciteit per minuut.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel3.13
  - number: '3.14'
    text: |-
      1 Een elektriciteitsproductie-eenheid met een maximumcapaciteit groter dan 11 kW, aangesloten op een
      laagspanningsnet, is in ieder geval voorzien van:

      a. een meetinrichting voor de afgegeven stroom;

      b. een signalering of de elektriciteitsproductie-eenheid al dan niet parallel is geschakeld met het net.

      2 De beveiliging van de elektriciteitsproductie-eenheid met een maximumcapaciteit groter dan 11 kW, aangesloten op
      een laagspanningsnet, is in ieder geval op drie fasen voorzien van:

      a. een onderspanningsbeveiliging met een aanspreeksnelheid van 2 seconden bij 80% van de nominale spanning én van
      0,2 seconden bij 70% van de nominale spanning;

      b. een overspanningsbeveiliging met een aanspreeksnelheid van 2 seconden bij 110% van de nominale spanning;

      c. een maximum-stroomtijdbeveiliging; bij een vermogenselektronische omzetter een overbelastingsbeveiliging;

      d. een frequentiebeveiliging met een aanspreeksnelheid van 2 seconden bij 47,5 en 51,5 Hz; deze beveiliging mag
      éénfasig zijn.

      3 Bij een door middel van vermogenselektronica gekoppelde elektriciteitsproductie-eenheid met een maximumcapaciteit
      groter dan 11 kW, aangesloten op een laagspanningsnet, mag parallelschakeling eerst enkele minuten nadat de
      netspanning weer aanwezig is, plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel3.14
  - number: '3.15'
    text: |-
      1 In afwijking van het bepaalde in [artikel 2.27][ref1] ligt de arbeidsfactor van een elektriciteitsproductie-
      eenheid, aangesloten op een middenspanningsnet of hoogspanningsnet met een spanningsniveau kleiner dan 110 kV, in
      het overdrachtspunt tussen 0,98 capacitief en 0,98 inductief.

      2 De elektriciteitsproductie-eenheid, die is aangesloten op een midden- of hoogspanningsnet, is voorzien van een
      bedrijfsmeting.

      3 De vereiste nauwkeurigheid van de in het tweede lid bedoelde metingen is

      a. klasse 1, indien de elektriciteitsproductie-eenheid is voorzien van een interface als bedoeld in artikel 14,
      tweede lid, onderdeel a, van de [Verordening (EU) 2016/631](32016R0631) (NC RfG); of

      b. klasse 2, in overige gevallen, tenzij anders met de netbeheerder is overeengekomen.

      4 De beveiligingen van de elektriciteitsproductie-eenheid aangesloten op een midden- of hoogspanningsnet, zijn
      selectief ten opzichte van de beveiligingen in het net van de netbeheerder. De aangeslotene draagt zorg en is
      verantwoordelijk voor adequate beveiligingen van de elektriciteitsproductie-eenheid tegen zowel storingen die
      ontstaan in het net als extreme afwijkingen van spanning en frequentie. De netbeheerder kan verlangen dat hiervan
      een berekening wordt gemaakt.

      5 De elektriciteitsproductie-eenheid aangesloten op een midden- of hoogspanningsnet, is voorzien van en wordt
      bedreven met een instelbare automatische spanningsregeling. De netbeheerder kan op basis van de lokale situatie
      voor een elektriciteitsproductie-eenheid een arbeidsfactor-regeling eisen of toestaan.

      6 De elektriciteitsproductie-eenheid, aangesloten op een middenspanningsnet of op een hoogspanningsnet met een
      spanningsniveau kleiner dan 110 kV, dient bij verlaagde netspanning onbeperkt de maximaal beschikbare hoeveelheid
      blindvermogen te kunnen leveren bij een verlaagde netspanning kleiner dan of gelijk aan U en groter dan of gelijk
      aan 0,9 U.

      7 De behandeling van het sterpunt van de elektriciteitsproductie-eenheid, aangesloten op een midden- of
      hoogspanningsnet, wordt bepaald door de netbeheerder in overleg met de beheerder van de elektriciteitsproductie-
      eenheid.

      8 In overleg met de netbeheerder gaat de aangeslotene door berekeningen na of en zo ja door welke maatregelen,
      de bijdrage aan het kortsluitvermogen door de elektriciteitsproductie-eenheid, aangesloten op een midden- of
      hoogspanningsnet, redelijkerwijs kan worden beperkt.

      9 De elektriciteitsproductie-eenheid, aangesloten op een middenspanningsnet of op een hoogspanningsnet met een
      spanningsniveau kleiner dan 110 kV is, in aanvulling op [artikel 3.13, eerste lid][ref2], en artikel 3.13, zevende
      lid, in staat om op het net aangesloten en in bedrijf te blijven:

      a. gedurende 3 minuten bij een spanning op het overdrachtspunt tussen 0,85 pu en 0,90 pu, waarbij geldt dat het
      werkzame vermogen mag worden gereduceerd tot 80% van de maximum capaciteit;

      b. overeenkomstig de in [artikel 3.13, eerste lid][ref3], genoemde perioden

      1°. bij een spanning op het overdrachtspunt binnen de spanningsband tussen 0,9 pu en 1,1 pu voor een
      frequentiebereik van 50 tot 51,5 Hz;

      2°. bij een spanning op het overdrachtspunt binnen de spanningsband die lineair verloopt van 0,9 pu en 1,01 pu bij
      47,5 Hz tot 0,9 en 1,1 pu bij 50 Hz.

      10 De elektriciteitsproductie-eenheid, aangesloten op een middenspanningsnet of op een hoogspanningsnet met een
      spanningsniveau kleiner dan 110 kV is op grond van het negende lid en op grond van [artikel 3.13, eerste lid][ref4]
      in staat aangesloten en in bedrijf te blijven binnen de in onderstaand diagram weergegeven tijdsperioden,
      frequentiebereiken en spanningsbanden.

      11 Indien [artikel 3.13, eerste lid][ref5], een kortere tijdsperiode toestaat dan het negende en tiende lid,
      prevaleert artikel 3.13, eerste lid.

      12 Indien het negende en tiende lid een kortere tijdsperiode toestaat dan [artikel 3.13, eerste lid][ref6],
      prevaleert het negende lid.

      13 De elektriciteitsproductie-eenheid die met gebruikmaking van de vrijstellingen voor productie als bedoeld
      in [artikel 4a.1, onderdeel a, subonderdeel 2][ref7]°, [artikel 4a.2, onderdeel a, subonderdeel 2°][ref8],
      [artikel 4a.3, onderdeel a, subonderdeel 2°][ref9], artikel 4a.3, onderdeel b, subonderdeel 2°,
      [artikel 4a.4, eerste lid, onderdeel a, subonderdeel 2°][ref10] en artikel 4a.4, eerste lid, onderdeel b,
      subonderdeel 2°, van het [Besluit investeringsplan en kwaliteit elektriciteit en gas][ref11] is aangesloten op
      een hoogspanningsnet of op het onderliggende middenspanningsnet dient voldoende snel en selectief afgeschakeld of
      afgeregeld te kunnen worden, in een uitvalsituatie als bedoeld in de hiervoor genoemde onderdelen van het Besluit
      investeringsplan en kwaliteit elektriciteit en gas. Aan deze eis is voldaan indien:

      a. de netbeheerder de elektriciteitsproductie-eenheid kan afschakelen of afregelen door middel van een aan te
      bieden signaal op of in de nabijheid van het overdrachtspunt van de aansluiting;

      b. de netbeheerder en de aangeslotene overeenkomstig [artikel 9.12, vijfde lid][ref12], overeenkomen dat de
      netbeheerder de aansluiting afschakelt of afregelt; of

      c. de netbeheerder en de aangeslotene overeenkomstig [artikel 9.12, derde lid][ref13], overeenkomen dat voor het
      afschakelen of afregelen gebruik gemaakt kan worden van de in artikel 13, zesde lid, en artikel 14, tweede lid,
      onderdeel a, van [Verordening (EU) 2016/631](32016R0631) (NC RfG) bedoelde interface of de in artikel 15, tweede
      lid, onderdeel a, van [Verordening (EU) 2016/631](32016R0631) (NC RfG) bedoelde regelbaarheid.


