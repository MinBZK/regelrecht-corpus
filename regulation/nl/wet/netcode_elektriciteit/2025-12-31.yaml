  - number: 7.0a
    text: |-
      1 De netbeheerder geeft onder de in artikel 7.0b, eerste lid, onderdeel a, bedoelde omstandigheden alleen
      prioriteit bij de toekenning van transportcapaciteit indien:

      a. een partij om prioriteit verzoekt; en

      b. de partij die om prioriteit verzoekt voldoet aan de vereisten uit het tweede lid, onderdeel a, of het tweede
      lid, onderdeel b.

      2 De netbeheerder geeft een verzoek als bedoeld in het eerste lid, onderdeel a, alleen prioriteit:

      a. voor de functie genoemd in tabel 1, van bijlage 22:

      1°. indien de netbeheerder vaststelt dat de verzoekende partij een congestieverzachter is overeenkomstig de
      omschrijving in tabel 1 van bijlage 22; en

      2°. indien de verzoeker contractuele afspraken heeft gemaakt met de netbeheerder waarin is vastgelegd dat hij zich
      zal gedragen als congestieverzachter als bedoeld in de omschrijving in tabel 1, van bijlage 22;

      b. voor de (sub)functie genoemd in tabel 2 of tabel 3 van bijlage 22:

      1°. indien de verzoekende partij aangeeft dat hij een (sub)functie overeenkomstig de omschrijving in tabel 2 of
      tabel 3, van bijlage 22, uitoefent;

      2°. indien de verzoekende partij de in tabel 4, van bijlage 22, genoemde bewijsstukken heeft overgelegd aan de
      netbeheerder; en

      3°. indien de gevraagde transportcapaciteit alleen wordt gebruikt voor de afname van elektriciteit.

      3 De in tabel 4, van bijlage 22, bedoelde bestuursverklaring bevat:

      a. een deugdelijke motivering waaruit blijkt dat de gevraagde transportcapaciteit noodzakelijk is voor de taken in
      de omschrijving zoals opgenomen per (sub)functie in tabel 2 of tabel 3, van bijlage 22;

      b. een deugdelijke motivering waaruit blijkt dat de gevraagde transportcapaciteit noodzakelijk is om te starten met
      de activiteiten of taken als bedoeld in tabel 2 of tabel 3, van bijlage 22, en niet kan starten zonder de gevraagde
      transportcapaciteit;

      c. een deugdelijke motivering waaruit blijkt dat de activiteit op korte termijn, na toekenning van de gevraagde
      transportcapaciteit en, voor zover van toepassing, na de realisatie van de aansluiting, zal starten;

      d. een verklaring dat de bewijsstukken als bedoeld in tabel 4, van bijlage 22, compleet zijn;

      e. een verklaring dat de bestuursverklaring naar waarheid is ingevuld; en

      f. instemming dat de met prioriteit toegekende transportcapaciteit wordt afgenomen indien de verklaring niet naar
      waarheid is ingevuld en/of indien er sprake is van vervalsing van de bewijsstukken genoemd in tabel 4, van bijlage
      22.

      4 In aanvulling op het derde lid, bevat de in tabel 4, van bijlage 22, bedoelde bestuursverklaring voor de functie
      woonbehoefte als bedoeld in tabel 3, van bijlage 22:

      a. indien er sprake is van kleinschalige onlosmakelijk verbonden activiteiten, een deugdelijke motivering waaruit
      blijkt dat deze activiteiten nodig zijn om de woonbehoefte te realiseren;

      b. indien er sprake is van collectieve voorzieningen, een deugdelijke motivering waaruit blijkt dat dat de
      voorzieningen nodig zijn voor de woonfunctie.

      5 De netbeheerder spant zich in om binnen elk gebied als bedoeld in artikel 9.9, eerste lid, partijen te vinden als
      bedoeld in tabel 1, van bijlage 22, en stelt binnen een redelijke termijn na ontvangst van een verzoek als bedoeld
      in het eerste lid, onderdeel a vast of de partij kwalificeert als congestieverzachter als bedoeld in het tweede
      lid, onderdeel a.

      6 De netbeheerder toetst binnen twintig werkdagen na ontvangst van het verzoek, als bedoeld in het eerste lid,
      onderdeel a, of de verzoekende partij voldoet aan de vereisten uit het tweede lid, onderdeel b.

      7 De netbeheerder informeert een verzoekende partij als bedoeld in het eerste lid, onderdeel a, schriftelijk of het
      verzoek voldoet aan de vereisten uit het tweede lid, onderdeel a of b.

      8 Indien de netbeheerder aanleiding heeft om te veronderstellen dat er oneigenlijk gebruik plaatsvindt van de
      mogelijkheid om een verzoek als bedoeld in het eerste lid, onder a te doen, dan wel dat het indienen van verzoeken
      als bedoeld in het eerste lid, onder a, dan wel het toekennen van prioriteit als bedoeld in het eerste lid niet
      goed functioneert, meldt hij dit aan de Autoriteit Consument en Markt. De netbeheerder kan daarop in afstemming met
      de Autoriteit Consument en Markt besluiten:

      a. om de toekenning van prioriteit tijdelijk te staken;

      b. hoe tijdens de periode van staking wordt omgegaan met het toekennen van transportcapaciteit; en

      c. hoe na een periode van staking, als bedoeld in onderdeel a, de werkwijze waarbij prioriteit wordt toegekend weer
      wordt gestart.

      9 In geval van een staking als bedoeld in het achtste lid, onderdeel a, vermeldt de netbeheerder de reden
      voor het staken, de duur daarvan, hoe tijdens de periode van staking wordt omgegaan met het toekennen van
      transportcapaciteit als bedoeld in het achtste lid, onderdeel b, en hoe na een periode van staking de werkwijze
      waarbij prioriteit wordt toegekend weer wordt gestart, als bedoeld in het achtste lid, onderdeel c, op de website
      als bedoeld in artikel 9.8.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel7.0a
  - number: 7.0b
    text: |-
      1 De netbeheerder hanteert voor het doen van een aanbod voor het uitvoeren van transport als bedoeld in artikel 24,
      eerste lid, van de Elektriciteitswet 1998:

      a. indien het transportverzoek betrekking heeft op gebieden als bedoeld in artikel 9.9, eerste lid, de volgorde van
      prioriteit als bedoeld in het derde lid; of

      b. indien het transportverzoek betrekking heeft op andere gebieden, de volgorde op basis van binnenkomst.

      2 Indien een aanvrager op basis van artikel 9.6, derde lid, zijn verzoek om het doen van een aanbod voor het
      uitvoeren van transport wijzigt, blijft zijn initiële plaats bij de volgorde als bedoeld in het eerste lid
      behouden.

      3 De netbeheerder bepaalt de volgorde van prioriteit, als bedoeld in het eerste lid, onderdeel a, als volgt:

      a. verzoeken uit tabel 1 van bijlage 22, aan wie op grond van artikel 7.0a, tweede lid, onderdeel a, door de
      netbeheerder prioriteit is toegekend hebben de hoogste prioriteit;

      b. verzoeken uit tabel 2 van bijlage 22, aan wie op grond van artikel 7.0a, tweede lid, onderdeel b, door de
      netbeheerder prioriteit is toegekend hebben de op één na hoogste prioriteit;

      c. verzoeken uit tabel 3 van bijlage 22, aan wie op grond van artikel 7.0a, tweede lid, onderdeel b, door de
      netbeheerder prioriteit is toegekend hebben de op twee na hoogste prioriteit;

      d. verzoeken van partijen zonder prioriteit krijgen geen prioriteit.

      4 Voor partijen als bedoeld in tabel 1 van bijlage 22, beoordeelt en rangschikt de netbeheerder, op een vooraf
      door de netbeheerder vastgesteld moment, de ontvangen verzoeken als bedoeld in artikel 7.0a, tweede lid,
      onderdeel a, eerst op doelmatigheid. De netbeheerder is transparant over de toetsingscriteria, de weging van de
      toetsingscriteria, de toepassing van de toetsingscriteria en de uitkomst van de toetsing op doelmatigheid, waarbij
      de netbeheerder de uitkomst van de toetsing voorziet van een deugdelijke en voor partijen kenbare motivering. De
      netbeheerder betrekt ten minste de volgende criteria bij de toets op doelmatigheid:

      a. de locatie van de partij als bedoeld in tabel 1 van bijlage 22, ten opzichte van het knelpunt of de knelpunten
      in het in artikel 9.9, eerste lid, bedoelde gebied;

      b. de door de partij als bedoeld in tabel 1 van bijlage 22, aangeboden hoeveelheid regelbaar vermogen;

      c. de ingangsdatum waarop het door de partij als bedoeld in tabel 1 van bijlage 22, aangeboden regelbaar vermogen
      beschikbaar is en de datum waarop de netbeheerder het regelbaar vermogen nodig heeft of verwacht te hebben;

      d. de periode waarin de partij als bedoeld in tabel 1 van bijlage 22, het aangeboden regelbaar vermogen beschikbaar
      stelt aan de netbeheerder; en

      e. de prijs in €/MWh die de partij als bedoeld in tabel 1 van bijlage 22, vraagt voor de naar verwachting te
      leveren congestiemanagementdiensten als bedoeld in artikel 9.31, eerste lid, van de Netcode.

      5 Voor partijen als bedoeld in het derde lid, onderdeel a, hanteert de netbeheerder bij het doen van een aanbod
      voor het uitvoeren van transport als bedoeld in artikel 24, eerste lid, van de Elektriciteitswet 1998 de volgorde
      die volgt uit de rangschikking op doelmatigheid als bedoeld in het vierde lid en voor partijen als bedoeld in het
      derde lid, onderdelen b, c en d de volgorde van het moment van binnenkomst van het transportverzoek.

      6 Voordat de netbeheerder een partij of meerdere partijen op basis van de volgorde als bedoeld in het derde,
      vierde en vijfde lid, een aanbod doet voor het uitvoeren van transport als bedoeld in artikel 24, eerste lid, van
      de Elektriciteitswet 1998, toetst de netbeheerder in lijn met artikel 7.0a, zesde lid, eerst alle verzoeken als
      bedoeld in artikel 7.0a, tweede lid, onderdeel b, die de netbeheerder heeft ontvangen tot de dag voorafgaand aan
      het vrijkomen van transportcapaciteit.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel7.0b
  - number: 7.0c
    text: |-
      1 Indien de netbeheerder op grond van artikel 7.0b, derde lid, onderdeel a, prioriteit heeft toegekend aan een
      partij als bedoeld in artikel 7.0a, eerste lid, onderdeel a, en deze partij de met de netbeheerder gemaakte
      contractuele afspraken als bedoeld in artikel 7.0a, tweede lid, onderdeel a, vervolgens niet nakomt, neemt de
      netbeheerder de toegekende transportcapaciteit af.

      2 Indien de netbeheerder op grond van artikel 7.0b, derde lid, onderdelen b en c, prioriteit heeft toegekend
      aan een partij als bedoeld in artikel 7.0a, eerste lid, onderdeel a, en vervolgens blijkt dat deze partij in
      strijd met artikel 7.0a, tweede lid, onderdeel b, onjuiste of frauduleuze bewijsstukken heeft overgelegd bij zijn
      prioriteringsverzoek, neemt de netbeheerder de met prioriteit toegekende transportcapaciteit af.

      3 De netbeheerder stelt de partij van wie transportcapaciteit is afgenomen als bedoeld in het eerste en tweede lid,
      in staat om een nieuw verzoek tot het doen van een aanbod voor het uitvoeren van transport als bedoeld in artikel
      24, eerste lid, van de Elektriciteitswet 1998 en een verzoek als bedoeld in artikel 7.0a, eerste lid, in te dienen.

      4 De netbeheerder meldt afgenomen transportcapaciteit als bedoeld in het eerste en tweede lid binnen een maand na
      afname aan de Autoriteit Consument en Markt.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel7.0c
  - number: 7.0d
    text: |-
      De netbeheerder rapporteert jaarlijks uiterlijk op 31 maart over het afgelopen kalenderjaar aan de Autoriteit
      Consument en Markt over zijn verzorgingsgebied:

      a. afzonderlijk voor tabel 1 van bijlage 22 en per (sub)functie in tabel 2 en tabel 3, van bijlage 22:

      1°. het aantal ontvangen prioriteringsverzoeken;

      2°. het aantal toegewezen prioriteringsverzoeken;

      3°. het totaal toegewezen transportvermogen; en

      4°. het aantal afgewezen prioriteringsverzoeken.

      b. het totaal aantal transportverzoeken als bedoeld in artikel 24, eerste lid, van de Elektriciteitswet 1998
      waarvoor de netbeheerder nog geen aanbod voor transportcapaciteit heeft gedaan; en

      c. de doorlooptijden van de behandeling van prioriteringsverzoeken.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel7.0d
  - number: '7.1'
    text: |-
      1 Transport vindt plaats:

      a. op grond van een tussen de netbeheerder en de aangeslotene te sluiten aansluit- en transportovereenkomst
      of op grond van tussen de netbeheerder en een groep van twee of meer aangeslotenen af te sluiten individuele
      aansluitovereenkomsten in combinatie met een groepstransportovereenkomst;

      b. indien de aangeslotene, of de van een groep van aangeslotenen deel uitmakende aangeslotenen elk individueel, op
      grond van de in onderdeel a bedoelde overeenkomst(en) recht heeft op een aansluiting; en

      c. indien voor elke in onderdeel b bedoelde aansluiting bij de netbeheerder bekend is welke partijen
      ten behoeve van de desbetreffende aansluiting, of, indien het een aansluiting betreft waaraan secundaire
      allocatiepunten zijn toegekend, voor alle allocatiepunten van de desbetreffende aansluiting, optreden
      als leverancier, BRP en, indien het een grootverbruikaansluiting betreft, meetverantwoordelijke.
      De respectievelijke identificaties van genoemde partijen legt de netbeheerder op grond van de
      [artikelen 2.1.3 tot en met 2.1.5a van de Informatiecode elektriciteit en gas][ref1] vast in zijn
      aansluitingenregister.

      2 De aangeslotene heeft recht op transport van elektriciteit door heel Nederland.

      3 Het recht op transport heeft vier vormen:

      a. een volledig vast recht op transport;

      b. een volledig variabel recht op transport;

      c. een tijdsduurgebonden recht op transport; of

      d. een tijdsblokgebonden recht op transport.

      4 Op een groepstransportovereenkomst zijn [artikel 7.15, eerste lid][ref2], en [artikel 7.16, eerste lid][ref3],
      niet van toepassing.

      5 De in het derde lid bedoelde vormen van transportrecht kunnen separaat of, voor zover beschikbaar, voor dezelfde
      aansluiting of door een groep van aangeslotenen die deel uitmaken van een groepstransportovereenkomst in combinatie
      worden gecontracteerd.

      6 Op het deel van het transportrecht dat overeenkomstig de [artikelen 7.1b][ref4], [7.1c][ref5] en [7.1d][ref6]
      niet vast is, is [artikel 9.6][ref7] niet van toepassing.

      7 De netbeheerder kan het recht op transport als bedoeld in het derde lid, onder b, c of d opschorten wanneer vast
      komt te staan dat de aangeslotene twee keer of meer de voorwaarden van [artikel 7.1b][ref8], [artikel 7.1c][ref9]
      of [artikel 7.1d][ref10] heeft overtreden en de netbeheerder de aangeslotene hierover schriftelijk heeft
      geïnformeerd. Bij de beslissing om het transportrecht op te schorten houdt de netbeheerder rekening met de mate
      en frequentie van de schending van de voorwaarden van artikel 7.1b, artikel 7.1c of artikel 7.1d. De netbeheerder
      beëindigt de opschorting uit de vorige volzin wanneer de aangeslotene aan de netbeheerder aantoont maatregelen
      te hebben getroffen die voorkomen dat de aangeslotene nogmaals de voorwaarden van artikel 7.1b, artikel 7.1c of
      artikel 7.1d overtreedt.

      8 Indien de aangeslotene na beëindiging van de opschorting ondanks de getroffen maatregelen nogmaals de voorwaarden
      van [artikel 7.1b][ref11], [artikel 7.1c][ref12] of [artikel 7.1d][ref13] overtreedt, kan de netbeheerder het
      transportrecht waarvan de voorwaarden geschonden zijn, laten vervallen. Bij de beslissing om het transportrecht te
      laten vervallen houdt de netbeheerder rekening met de mate en frequentie van de schending van de voorwaarden van
      artikel 7.1b, artikel 7.1c of artikel 7.1d.


