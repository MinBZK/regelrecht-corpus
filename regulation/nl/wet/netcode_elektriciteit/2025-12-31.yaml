  - number: 7.1h
    text: |-
      1 De netbeheerder informeert de gemachtigde van een groep van aangeslotenen die deelneemt aan een
      groepstransportovereenkomst schriftelijk over elke overtreding van de voorwaarden van [artikel 7.1e][ref1] of
      [artikel 7.1f][ref2].

      2 In aanvulling op [artikel 7.1, zesde lid][ref3], geldt dat de netbeheerder bij een groepstransportovereenkomst
      het recht op transport als bedoeld in artikel 7.1, derde lid, onderdeel a, kan opschorten wanneer vast
      komt te staan dat de groep van aangeslotenen twee keer of meer de voorwaarden van [artikel 7.1e][ref4] of
      [artikel 7.1f][ref5] heeft overtreden en de netbeheerder de in artikel 7.1e, eerste lid, onderdeel c, bedoelde
      gemachtigde hierover schriftelijk heeft geïnformeerd. Bij de beslissing om het transportrecht op te schorten houdt
      de netbeheerder rekening met de mate en frequentie van de schending van de voorwaarden van artikel 7.1e of artikel
      7.1f. De netbeheerder beëindigt de opschorting uit de vorige volzin wanneer de gemachtigde aan de netbeheerder
      aantoont dat de groep van aangeslotenen maatregelen heeft getroffen die voorkomen dat de groep nogmaals de
      voorwaarden van artikel 7.1e of artikel 7.1f overtreedt.

      3 Indien een groep na beëindiging van de opschorting ondanks de getroffen maatregelen nogmaals de voorwaarden
      van [artikel 7.1e][ref6] of [artikel 7.1f][ref7] overtreedt, kan de netbeheerder het transportrecht waarvan de
      voorwaarden geschonden zijn, laten vervallen. Bij de beslissing om het transportrecht te laten vervallen houdt de
      netbeheerder rekening met de mate en frequentie van de schending van de voorwaarden van artikel 7.1e of artikel
      7.1f.


