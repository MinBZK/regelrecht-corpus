  - number: '6.12'
    text: |-
      Het HVDC-systeem geeft voorrang aan de bijdrage van blindvermogen boven de bijdrage van werkzaam vermogen tijdens
      bedrijfsvoering bij lage of hoge spanning en bij storingen waarvoor fault-ride-through-capaciteit vereist is, als
      bedoeld in artikel 23 van de Verordening (EU) 2016/1447 (NC HVDC).
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.12
  - number: '6.13'
    text: |-
      1 In overeenstemming met artikel 24 van de Verordening (EU) 2016/1447 (NC HVDC) voldoet een HVDC-systeem aan de
      normen voor elektromagnetische compatibiliteit, zoals opgenomen in de [artikelen 2.28][ref1] en 2.40.

      2 In aanvulling op deze artikelen komen de netbeheerder en de aangeslotene die beschikt over een HVDC-systeem, in
      overleg met de netbeheerder van het landelijk hoogspanningsnet, eisen voor harmonischen overeen, en leggen deze
      vast in de aansluit- en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.28
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.13
    references:
      - id: ref1
        bwb_id: BWBR0037940
        artikel: '2.28'
        hoofdstuk: '2'
        paragraaf: '2.3'
  - number: '6.14'
    text: |-
      1 De parameters voor de fault-ride-through-capaciteit van het HVDC-convertorstation, als bedoeld in artikel 25,
      eerste lid, en bijlage V, tabel 7 van de Verordening (EU) 2016/1447 (NC HVDC) zijn:

      a. de spanningsparameters:

      1°. U is 0 pu;

      2°. U is 0,425 pu;

      3°. U is 0,85 pu;

      b. de tijdsparameters:

      1°. t is 0,25 s;

      2°. t is 1,625 s;

      3°. t is 3,0 s.

      2 Indien de netbeheerder van het landelijk hoogspanningsnet een blokkeerspanning vaststelt, als bedoeld in artikel
      25, vierde lid, van de Verordening (EU) 2016/1447 (NC HVDC):

      a. legt de netbeheerder van het landelijk hoogspanningsnet deze blokkeerspanning vast in de aansluit- en
      transportovereenkomst; en

      b. bedraagt deze blokkeerspanning 0,7 pu, tenzij anders overeengekomen.

      3 De fault-ride-through-capaciteit van het HVDC-convertorstation in het geval van asymmetrische storingen, als
      bedoeld in artikel 25, zesde lid van de Verordening (EU) 2016/1447 (NC HVDC), is gelijk aan de fault-ride-through-
      capaciteit voor symmetrische storingen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.14
  - number: '6.15'
    text: |-
      1 De eisen voor de grootte en het tijdsprofiel voor herstel van het werkzaam vermogen van het HVDC-systeem na een
      storing in het wisselstroomnet, als bedoeld in artikel 26 van de Verordening (EU) 2016/1447 (NC HVDC) zijn:

      a. het herstel van het werkzame vermogen begint op een spanningsniveau van 90% van de spanning direct voorafgaande
      aan de storing;

      b. de maximale toegestane tijd voor het herstel van het werkzame vermogen is 0,2 seconden, tenzij anders
      overeengekomen vanwege technologiespecifieke beperkingen of beperkingen aangaande operationele netwerkveiligheid
      van het landelijk hoogspanningsnet;

      c. de grootte voor het herstel van het werkzame vermogen is tenminste 90% van het vermogen direct voorafgaande aan
      de storing;

      d. de nauwkeurigheid van het herstelde werkzame vermogen is 10% van het vermogen direct voorafgaande aan de
      storing.

      2 De netbeheerder van het landelijk hoogspanningsnet legt het tijdsprofiel voor het herstel, als bedoeld in artikel
      26 van de Verordening (EU) 2016/1447 (NC HVDC), vast in de aansluit- en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.15
  - number: '6.16'
    text: |-
      Een HVDC-convertorstation is in staat om gedurende het onder spanning brengen van dat station of de synchronisatie
      ervan met het wisselstroomnet, dan wel gedurende de aansluiting van een onder spanning gebracht HVDC-
      convertorstation op een HVDC-systeem, als bedoeld in artikel 28 van de Verordening (EU) 2016/1447 (NC HVDC), de
      spanningsschommelingen te beperken tot de grenswaarden voor snelle spanningsvariaties die volgen uit artikel 2.40.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.16
  - number: '6.17'
    text: |-
      1 De studie, als bedoeld in artikel 29, tweede lid, van de Verordening (EU) 2016/1447 (NC HVDC)

      a. omvat tenminste:

      1°. interactie tussen het HVDC-systeem en het wisselstroomnet;

      2°. interactie tussen meerdere HVDC-systemen;

      3°. interactie tussen het HVDC-systeem en andere actieve installaties, zoals elektriciteitsproductie-eenheden;

      b. omvat onder andere de volgende onderzoekingsmethodes:

      1°. metingen of simulaties van de frequentie-afhankelijke netimpedantie;

      2°. bepaling van de niet-lineaire impedanties van HVDC-systemen, rekening houdend met de regelingen;

      3°. analyse in het frequentiedomein;

      4°. validering van het gedrag met behulp van een EMT-simulatie.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.17
  - number: '6.18'
    text: |-
      1 Het HVDC-systeem is in staat vermogensoscillaties met frequentie tussen 0,1 Hz en 2,0 Hz door modulatie van
      werkzaam vermogen en blindvermogen actief te dempen, als bedoeld in artikel 30 van de Verordening (EU) 2016/1447
      (NC HVDC).

      2 De netbeheerder van het landelijk hoogspanningsnet legt de voorwaarden, die tot activering van de regelfunctie
      voeren en de maximale bijdrage van de regeling, als bedoeld in artikel 30 van de Verordening (EU) 2016/1447 (NC
      HVDC), vast in de aansluit- en transportovereenkomst.

      3 Deze regeling kan via handbediening geactiveerd en gedeactiveerd worden.

      4 De instelling van deze regeling kan worden aangepast. De netbeheerder van het landelijk hoogspanningsnet en de
      aangeslotene die beschikt over een HVDC-systeem komen de aanpassingen van de instellingen van deze regeling in
      onderling overleg overeen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.18
  - number: '6.19'
    text: |-
      1 De omvang van de studie naar demping van subsynchrone torsie-interactie, als bedoeld in artikel 31, tweede lid,
      van de Verordening (EU) 2016/1447 (NC HVDC) wordt tijdens de initiatieffase van een nieuw HVDC-systeem vastgelegd
      door de netbeheerder van het landelijk hoogspanningsnet.

      2 Bij het vastleggen van de omvang van die studie wijst de netbeheerder van het landelijk hoogspanningsnet tevens
      alle partijen aan die moeten deelnemen aan deze studie.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.19
  - number: '6.20'
    text: |-
      De methode en de condities op basis waarvan de netbeheerder van het landelijk hoogspanningsnet het minimum- en
      maximumkortsluitvermogen bepaalt, als bedoeld in artikel 32, eerste lid, van de Verordening (EU) 2016/1447 (NC
      HVDC), zijn:

      a. het maximumkortsluitvermogen op het overdrachtspunt van de aansluiting van het HVDC-systeem wordt berekend
      op basis van een volledig in bedrijf zijnd net, onder handhaving van de enkelvoudige storingsreserve, waarbij
      rekening wordt gehouden met alle voorziene relevante netaanpassingen dan wel netuitbreidingen, en de maximale
      kortsluitstroombijdrage van alle op het desbetreffende net aangesloten elektriciteitsproductie-eenheden en met de
      maximale kortsluitstroombijdrage van alle aangrenzende netten;

      b. het minimumkortsluitvermogen vóór een storing op het overdrachtspunt van de aansluiting van het HVDC-systeem
      wordt berekend op basis van de netsituatie met enkelvoudige storingsreserve, die resulteert in het kleinste
      kortsluitvermogen op het overdrachtspunt van de aansluiting en waarbij rekening wordt gehouden met alle voorziene
      relevante netaanpassingen dan wel netuitbreidingen, de minimale kortsluitstroombijdrage van een vooraf bepaalde
      minimale inzet van op het desbetreffende net aangesloten elektriciteitsproductie-eenheden, en met de minimale
      kortsluitstroombijdrage van alle aangrenzende netten;

      c. het minimumkortsluitvermogen na een storing op het overdrachtspunt van de aansluiting van het HVDC-systeem wordt
      berekend op basis van de enkelvoudige storing in een netsituatie met enkelvoudige storingsreserve, die resulteert
      in het kleinste kortsluitvermogen op het overdrachtspunt van de aansluiting na de storing en waarbij rekening wordt
      gehouden met alle voorziene relevante netaanpassingen dan wel netuitbreidingen, de minimale kortsluitstroombijdrage
      van elektriciteitsproductie-eenheden met een vooraf bepaalde minimum inzet en aangesloten op het desbetreffende
      net, en met de minimale kortsluitstroombijdrage van alle aangrenzende netten;

      d. het HVDC-systeem ten behoeve van de berekening van het kortsluitvermogen is verondersteld te zijn uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.20
  - number: '6.21'
    text: |-
      1 Het HVDC-systeem is in staat op stabiele wijze in bedrijf te blijven na alle geplande of ongeplande wijzigingen
      in het HVDC-systeem of in het hoogspanningsnet, als bedoeld in artikel 33, eerste lid, van de Verordening (EU)
      2016/1447 (NC HVDC), na in ieder geval de volgende gebeurtenissen:

      a. uitval en herstel van de communicatie tussen het besturingssysteem van het hoogspanningsnet en de HVDC-
      convertorstations van het HVDC-systeem;

      b. geplande en ongeplande wijzigingen in de nettopologie van het HVDC-systeem of van het hoogspanningsnet;

      c. veranderingen van de vermogensstromen in het hoogspanningsnet;

      d. wijziging van de regelmodus van het HVDC-convertorstation;

      e. uitval van externe optimaliserings- en regelfuncties van het HVDC-systeem.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.21
  - number: '6.22'
    text: |-
      De netbeheerder komt, in overleg met de netbeheerder van het landelijk hoogspanningsnet en de aangeslotene de
      beveiligingsconcepten overeen die relevant zijn voor het hoogspanningsnet en instellingen die relevant zijn voor
      het HVDC-systeem, als bedoeld in artikel 34, eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC), en legt deze
      vast in de aansluit- en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.22
  - number: '6.23'
    text: |-
      De netbeheerder specificeert, in overleg met de netbeheerder van het landelijk hoogspanningsnet de methode
      waarop regelmodi en daarmee verband houdende referentiewaarden op afstand kunnen worden aangepast, als bedoeld
      in artikel 36, derde lid, van de Verordening (EU) 2016/1447 (NC HVDC), en legt deze vast in de aansluit- en
      transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.23
  - number: '6.24'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet en de aangeslotene die beschikt over een HVDC-systeem komen
      het tijdsbestek waarbinnen het HVDC-systeem in staat is te activeren, als bedoeld in artikel 37, tweede lid, van de
      Verordening (EU) 2016/1447 (NC HVDC), contractueel overeen.

      2 Het HVDC-systeem is in staat de overgang naar normale bedrijfsvoering zonder onderbreking te laten plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.24
  - number: '6.25'
    text: |-
      1 De relevante netbeheerder komt met de aangeslotene die beschikt over een HVDC-convertoreenheid de hiërarchie van
      de automatische regeleenheden overeen, als bedoeld in artikel 51, eerste lid, van de Verordening (EU) 2016/1447 (NC
      HVDC) en legt die vast in de aansluit- en transportovereenkomst.

      2 De relevante netbeheerder komt met de aangeslotene die beschikt over een HVDC-convertoreenheid de eisen voor de
      kwaliteit van de signalen die de HVDC-convertoreenheid levert overeen, als bedoeld in artikel 51, vierde lid, van
      de Verordening (EU) 2016/1447 (NC HVDC), en legt dit vast in de aansluit- en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.25
  - number: '6.26'
    text: |-
      1 De netbeheerder komt, in overleg met de netbeheerder van het landelijk hoogspanningsnet, met de aangeslotene die
      beschikt over een HVDC-systeem de parameters voor de kwaliteit van levering, als bedoeld in artikel 53, tweede lid,
      van de Verordening (EU) 2016/1447 (NC HVDC), overeen en legt die vast in de aansluit- en transportovereenkomst.

      2 De netbeheerder komt, in overleg met de netbeheerder van het landelijk hoogspanningsnet, met de aangeslotene
      die beschikt over een HVDC-systeem de bijzonderheden van de storingsregistratieapparatuur, als bedoeld in
      artikel 53, derde lid, van de Verordening (EU) 2016/1447 (NC HVDC), overeen en legt die vast in de aansluit- en
      transportovereenkomst.

      3 De netbeheerder komt, in overleg met de netbeheerder van het landelijk hoogspanningsnet, met de aangeslotene die
      beschikt over een HVDC-systeem de oscillatiecriteria, als bedoeld in artikel 53, vierde lid, van de Verordening
      (EU) 2016/1447 (NC HVDC), overeen en legt die vast in de aansluit- en transportovereenkomst.

      4 De netbeheerder komt, in overleg met de netbeheerder van het landelijk hoogspanningsnet, met de aangeslotene
      die beschikt over een HVDC-systeem de communicatieprotocollen voor elektronische toegang tot gegevens, als bedoeld
      in artikel 53, vijfde lid, van de Verordening (EU) 2016/1447 (NC HVDC), overeen en legt die vast in de aansluit-
      en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.26
  - number: '6.27'
    text: |-
      1 De aangeslotene die beschikt over een HVDC-systeem verstrekt simulatiemodellen, als bedoeld in artikel 54, eerste
      lid, van de Verordening (EU) 2016/1447 (NC HVDC), aan de netbeheerder van het landelijk hoogspanningsnet voor
      analyse van:

      a. normale bedrijfstoestand;

      b. kortsluittoestand;

      c. dynamisch gedrag;

      d. elektromagnetische transiënten;

      e. stationaire harmonischen;

      f. stabiliteit bij harmonischen en resonanties.

      2 Naast deze modellen verstrekt de aangeslotene die beschikt over een HVDC-systeem ook een generiek RMS model voor
      bestudering van dynamische verschijnselen in het gehele gekoppelde transmissiesysteem. Dit model is geschikt voor
      uitwisseling binnen ENTSO-E verband.

      3 De inhoud en de opmaak van de modellen, als bedoeld in artikel 54, eerste lid, van de Verordening (EU) 2016/1447
      (NC HVDC), zijn zodanig dat de analyses uit het eerste lid kunnen worden uitgevoerd met de simulatieprogramma's
      die bij de netbeheerder van het landelijk hoogspanningsnet in gebruik zijn. In de ontwerpfase van het HVDC-systeem
      specificeert de netbeheerder van het landelijk hoogspanningsnet de inhoud, de opmaak en de daarbij behorende
      documentatie van de modellen.

      4 Alleen die delen van de modellen die informatie bevatten aangaande intellectueel eigendom mogen worden
      versleuteld. Deze versleuteling mag niet belemmeren dat de netbeheerder van het landelijk hoogspanningsnet in staat
      is de analyses uit het eerste lid met de modellen uit te voeren.

      5 De aangeslotene die beschikt over een HVDC-systeem zorgt ervoor dat de modellen gedurende de hele levensduur van
      het HVDC-systeem kunnen worden blijven gebruikt voor het uitvoeren van de analyses. Dit houdt in dat de modellen
      bij wijzigingen in het HVDC-systeem tijdig vooraf geactualiseerd worden.

      6 Bij vernieuwing van de simulatieprogramma's garandeert de aangeslotene die beschikt over het HVDC-systeem dat de
      modellen in staat blijven de analyses uit het eerste lid uit te voeren.

      7 De details van de inhoud en de opmaak worden in de ontwerpfase besproken met de aangeslotene die beschikt over
      het HVDC-systeem, en worden vastgelegd in de aansluit- en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.27
  - number: '6.28'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet stuurt naar de DC-aangesloten power park module een signaal,
      als bedoeld in artikel 39, eerste lid, onderdeel a, van de Verordening (EU) 2016/1447 (NC HVDC), dat ofwel een in
      het synchrone gebied gemeten frequentie is ofwel een referentiewaarde voor het werkzame vermogen. De DC-aangesloten
      power park module kan beide signaaltypen verwerken.

      2 De netbeheerder van het landelijk hoogspanningsnet specificeert voor de DC-aangesloten power park module die is
      aangesloten via een HVDC-systeem dat is gekoppeld aan meerdere regelzones de gecoördineerde frequentieregeling, als
      bedoeld in artikel 39, eerste lid, onderdeel b, van de Verordening (EU) 2016/1447 (NC HVDC), en legt deze vast in
      de aansluit- en transportovereenkomst.

      3 Indien de ontwerpfrequentie afwijkt van 50 Hz, specificeert de netbeheerder van het landelijk hoogspanningsnet de
      van toepassing zijnde frequentiebereiken en tijdsperiodes, als bedoeld in artikel 39, tweede lid, onderdeel a, van
      de Verordening (EU) 2016/1447 (NC HVDC), en legt deze vast in de aansluit- en transportovereenkomst.

      4 De DC-aangesloten power park module is in staat zich automatisch te ontkoppelen, als bedoeld in artikel 39,
      tweede lid, onderdeel c, van de Verordening (EU) 2016/1447 (NC HVDC), bij lage frequenties en bij hoge frequenties.
      De netbeheerder van het landelijk hoogspanningsnet komt de voorwaarden en instellingen voor automatische
      ontkoppeling overeen met de aangeslotene die beschikt over een DC-aangesloten power park module en neemt deze op in
      de aansluit- en transportovereenkomst.

      5 Op de DC-aangesloten power park module is [artikel 3.13, vierde lid][ref1],
      [artikel 3.17, derde en achtste tot en met elfde lid][ref2], [artikel 3.19, tiende tot en met zestiende lid][ref3],
      [artikel 3.20][ref4] en [artikel 3.28, derde tot en met zesde lid][ref5], van overeenkomstige toepassing.

      6 Het uitgangsvermogen van een DC-aangesloten power park module wijzigt, als bedoeld in artikel 39, vijfde lid, van
      de Verordening (EU) 2016/1447 (NC HVDC), niet als gevolg van een wijziging van de frequentie, behalve wanneer het
      werkzame vermogen wordt gemoduleerd als gevolg van de frequentierespons van de LFSM-O, LFSM-U en FSM.

      7 Op de DC-aangesloten power park module is [artikel 3.24][ref6], met uitzondering van het zevende lid, van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.13
