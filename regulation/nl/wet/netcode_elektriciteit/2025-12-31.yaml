  - number: 9.1c
    text: |-
      1 Indien een aangeslotene overeenkomstig [bijlage 12, zevende lid][ref1], een capaciteitsbeperking aan een
      netbeheerder heeft aangeboden en een netbeheerder deze capaciteitsbeperking heeft afgeroepen, is deze aangeslotene
      voor de periode waarop de afroep van de capaciteitsbeperking betrekking heeft, vrijgesteld van de verplichting
      tot het doen van een bieding voor redispatch overeenkomstig [bijlage 11][ref2], indien deze verplichting op de
      aangeslotene rust.

      2 Op het volume dat door een aangeslotene overeenkomstig [bijlage 12, zevende lid][ref3], als capaciteitsbeperking
      aan de netbeheerder is aangeboden, maar dat niet door de netbeheerder is afgeroepen voor de periode waarop
      de afroep van de capaciteitsbeperking betrekking heeft, is de verplichting tot het doen van een bieding voor
      redispatch overeenkomstig [bijlage 11][ref4] onverkort van toepassing, indien deze verplichting op de aangeslotene
      rust.


