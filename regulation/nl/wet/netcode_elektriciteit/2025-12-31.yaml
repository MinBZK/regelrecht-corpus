  - number: '10.6'
    text: |-
      1 Indien een BRP die door middel van een overeenkomst met een leverancier balanceringsverantwoordelijkheid
      draagt voor een grootverbruikaansluiting die overeenkomst wenst te beëindigen, stelt hij de grootverbruiker
      en de Ieverancier en de netbeheerder die het aangaat tenminste twintig werkdagen voor de beoogde ingangsdatum
      schriftelijk in kennis.

      2 De in het eerste lid bedoelde in kennis stelling van de grootverbruiker vindt plaats bij aangetekende brief en
      de in dat lid bedoelde termijn van twintig werkdagen vangt aan op het moment van ontvangst van deze aangetekende
      brief.

      3 De grootverbruiker laat de beoogde BRP of de leverancier, daartoe gemachtigd overeenkomstig
      [artikel 10.4, vijfde lid][ref1], tenminste vijf werkdagen voor de in het eerste lid
      bedoelde ingangsdatum aan de netbeheerder die het aangaat overeenkomstig het proces uit
      [paragraaf 4.5 van de Informatiecode elektriciteit en gas][ref2] melden welke BRP vanaf die datum voor de
      aansluiting balanceringsverantwoordelijkheid draagt.

      4 Indien de grootverbruiker of de leverancier, daartoe gemachtigd overeenkomstig [artikel 10.4, vijfde lid][ref3],
      niet tijdig aan zijn in het derde lid bedoelde verplichting voldoet, treedt [artikel 11.8][ref4] voor de
      betreffende aansluiting in werking. De netbeheerder die het aangaat, verwittigt onverwijld de netbeheerder van het
      landelijk hoogspanningsnet en de Autoriteit Consument en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.4
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Paragraaf4.5
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel10.4
      [ref4]: https://wetten.overheid.nl/BWBR0037940#Artikel11.8
