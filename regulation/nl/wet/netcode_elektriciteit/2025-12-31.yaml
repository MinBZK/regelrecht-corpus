  - number: 7.1c
    text: |-
      1 Een tijdsduurgebonden recht op transport geeft de aangeslotene recht op transport tot een hoeveelheid ter
      grootte van het op de aansluiting gecontracteerde transportvermogen voor afname of voor invoeding, gedurende
      het in de aansluit- en transportovereenkomst genoemde percentage van het aantal uren in een kalenderjaar
      met inachtneming van [paragraaf 7.4][ref1], met uitzondering van [artikel 7.15, eerste lid][ref2] en
      [artikel 7.16, eerste en derde lid][ref3].

      2 Ten behoeve van een tijdsduurgebonden recht op transport, als bedoeld in het eerste lid, leggen de aangeslotene
      en de netbeheerder ten minste de productvoorwaarden als bedoeld in [bijlage 23][ref4], eerste lid, vast in de
      aansluit- en transportovereenkomst.

      3 Het tijdsduurgebonden recht op transport, als bedoeld in het eerste lid, is beschikbaar voor een aangeslotene op
      het landelijke hoogspanningsnet, waarbij geldt dat:

      a. het in het eerste lid bedoelde percentage gelijk is aan 85;

      b. de verwachte bijdrage van het tijdsduurgebonden transportrecht van een individuele aangeslotene aan de
      belastingduurkromme op basis van de prognoses voor het voor de beschikbare transportcapaciteit meest kritische jaar
      in de periode tot 15 jaar na 1 april 2025 van het station waarop diens aansluiting is aangesloten, of in geval van
      vermaasde netten van de voor de die aangeslotene beschikbare transportcapaciteit meest bepalende locatie in het
      net, wordt begrensd ter linkerzijde door de lijn van 1.314 uur, ter rechterzijde door de lijn van 8.760 uur en in
      hoogte, in geval de aansluiting

      1. zich bevindt in een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref5], door het verschil tussen de
      maximale fysieke belastbaarheid van de relevante beperkende netelement(en) en de waarde van de belastingduurkromme
      waarop deze de lijn van 1.314 uur snijdt;

      2. zich niet bevindt in een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref6], door het verschil
      tussen de maximale waarde van de belastingduurkromme en de waarde van de belastingduurkromme waarop deze de lijn
      van 1.314 uur snijdt;

      c. op grond van onderdeel b de verwachtte bijdrage van het tijdsduurgebonden transportrecht van aangeslotene aan de
      belastingduurkromme, in geval de aansluiting

      1. zich bevindt in een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref7], is begrensd als schematisch
      weergegeven in het groene gebied in onderstaand diagram met een fictieve belastingsduurkromme;

      2. zich niet bevindt in een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref8], is begrensd als
      schematisch weergegeven in het groene gebied in onderstaand diagram met een fictieve belastingsduurkromme; en

      d. de tariefstructuren als bedoeld in de [artikelen 3.7.16][ref9] en
      [3.7.18 van de Tarievencode elektriciteit][ref10] van toepassing zijn.


