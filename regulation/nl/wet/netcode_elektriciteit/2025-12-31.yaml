  - number: '14.5'
    text: |-
      1 Onverminderd het bepaalde in [artikel 14.1, vierde lid][ref1], voldoen elektriciteitsproductie-eenheden die
      overeenkomstig de criteria van artikel 5 van Verordening (EU) 2016/631 als type D zouden worden geclassificeerd
      maar waarop overeenkomstig artikel 4, eerste lid, van de Verordening (EU) 2016/631 (NC RfG) de Verordening (EU)
      2016/631 (NC RfG) niet van toepassing is, in aanvulling op [paragraaf 3.5][ref2] aan de [artikelen 14.3][ref3] en
      [14.4][ref4] en aan het tweede tot en met dertiende lid.

      2 De activering van de frequentiebegrenzingsreserves dient:

      a. automatisch plaats te vinden,

      b. te voldoen aan de volgende karakteristieken:

      1°. de statiek is instelbaar tussen 4 en 20%;

      2°. een dode band van de frequentierespons van 500 mHz is toegestaan behoudens bij door de netbeheerder van het
      landelijk hoogspanningsnet gecontracteerde elektriciteitsproductie-eenheden;

      3°. de maximaal toelaatbare ongevoeligheid bedraagt ± 10 mHz.

      c. na activering gedurende ten minste 15 minuten gehandhaafd te blijven.

      3 Indien ten gevolge van een momentane frequentieafwijking de volledige primaire reserve gevraagd wordt, moet deze
      binnen 30 seconden na het begin van de momentane frequentieafwijking gerealiseerd zijn.

      4 Indien de gevraagde primaire bijdrage tussen 50% en 100% van de primaire reserve bedraagt, moet deze binnen een
      evenredige tijd tussen 15 en 30 seconden na het begin van de momentane frequentieafwijking gerealiseerd zijn.

      5 Indien de gevraagde primaire bijdrage 50% of minder van de primaire reserve bedraagt, moet deze binnen 15
      seconden na het begin van de momentane frequentieafwijking gerealiseerd zijn.

      6 Een momentane frequentieafwijking is gelijk aan de afwijking ten opzichte van de nominale frequentie van 50 Hz.

      7 Elektriciteitsproductie-eenheden die niet bijdragen aan de gecontracteerde primaire reserve dienen wel te
      beschikken over een primaire regeling en dienen deze actief te houden en in te stellen zoals beschreven in het
      negende lid. De in het negende lid genoemde bijdrage hoeft alleen geleverd te worden indien en voor zover de
      productiesituatie van de eenheid dit technisch toelaat en wanneer een bijdrage van de eenheid niet verstorend werkt
      in een afhankelijk productieproces. Indien sprake is van een dergelijke verstoring moet dit in voorkomende gevallen
      op verzoek van de netbeheerder van het landelijk hoogspanningsnet aangetoond worden.

      8 De aangeslotene toont voorafgaand aan de aansluiting van de elektriciteitsproductie-eenheid en voorts telkens
      wanneer de primaire regeling van een elektriciteitsproductie-eenheid een wijziging ondergaat, door middel van
      beproeving ten genoege van de netbeheerder van het landelijk hoogspanningsnet aan dat de elektriciteitsproductie-
      eenheid voldoet aan de in het tweede tot en met zevende lid neergelegde technische eisen.

      9 Bij elektriciteitsproductie-eenheden die niet bijdragen aan het gecontracteerde primaire reservevermogen, is het
      toegestaan een dode band van de frequentierespons van 500 mHz aan te houden en wordt de statiek ingesteld op 8%.

      10 De aangeslotene met een elektriciteitsproductie-eenheid die is aangesloten op een net met een nominale
      spanning groter dan of gelijk aan 110 kV toont voorafgaand aan de aansluiting en voorts telkens wanneer de eigen
      bedrijfsinstallatie van een elektriciteitsproductie-eenheid een belangrijke wijziging ondergaat door middel van
      beproeving ten genoege van de netbeheerder van het landelijk hoogspanningsnet aan dat de elektriciteitsproductie-
      eenheid voldoet aan de in [artikel 14.4, vijfde tot en met achtste lid][ref5] neergelegde technische eisen.

      11 De beproevingen, de wijze van uitvoering daarvan alsmede de wijze van rapporteren over en de beoordeling door de
      netbeheerder van het landelijk hoogspanningsnet van de beproevingen zijn beschreven in [bijlage 4][ref6].

      12 Indien uit de beproevingsresultaten blijkt dat een elektriciteitsproductie-eenheid niet aan de eisen voldoet,
      verplicht de netbeheerder van het landelijk hoogspanningsnet de aangeslotene om maatregelen te nemen. De
      netbeheerder van het landelijk hoogspanningsnet stelt, na de aangeslotene daarover te hebben gehoord, een termijn
      voor het uitvoeren van de maatregelen vast. Nadat de maatregelen genomen zijn, wordt de beproeving herhaald.

      13

      14 Tenzij sprake is van de situatie als bedoeld in artikel 4, eerste lid, van de [Verordening (EU) 2016/631]
      (32531R2016) (NC RfG), zijn de [artikelen 3.19][ref7], [3.26][ref8] en [3.30][ref9], niet van toepassing op de
      elektriciteitsproductie-eenheden die:

      a. voor 1 juli 2021 op het net zijn aangesloten; of

      b. na 1 juli 2021 maar voor 1 januari 2024 op het net zijn aangesloten, indien de eigenaar voor 1 juli 2021
      een definitief en bindend contract heeft gesloten voor de aankoop van het belangrijkste onderdeel van de
      elektriciteitsproductie-eenheid en hij de netbeheerder van het landelijk hoogspanningsnet uiterlijk 30 september
      2021 op de hoogte heeft gesteld van dat contract.

      15 Tenzij sprake is van de situatie als bedoeld in artikel 4, eerste lid van de [Verordening (EU) 2016/631]
      (32531R2016) (NC RfG), is [artikel 3.29][ref10] niet van toepassing op de elektriciteitsproductie-eenheden:

      a. die voor 9 september 2021 op het net zijn aangesloten, of

      b. waarvan de eigenaar van de elektriciteitsproductie-eenheid voor 9 september 2021 een definitief en bindend
      contract heeft gesloten voor de aankoop van het belangrijkste onderdeel van de elektriciteitsproductie-eenheid
      binnen een tijdsbestek van twee jaar na het sluiten van het contract.

      16 Tenzij sprake is van de situatie als bedoeld in artikel 4, eerste lid van de [Verordening (EU) 2016/631]
      (32531R2016) (NC RfG), is [artikel 3.13, tweede lid][ref11], niet van toepassing op de elektriciteitsproductie-
      eenheden:

      a. die voor 9 september 2021 op het net zijn aangesloten, of

      b. waarvan de eigenaar van de elektriciteitsproductie-eenheid voor 9 september 2021 een definitief en bindend
      contract heeft gesloten voor de aankoop van het belangrijkste onderdeel van de elektriciteitsproductie-eenheid.
      De eigenaar van de elektriciteitsproductie-eenheid stelt de netbeheerder van het landelijk hoogspanningsnet binnen
      een termijn van 6 maanden na het afsluiten van het contract uit de eerste volzin op hoogte van het afsluiten van
      dat contract.


