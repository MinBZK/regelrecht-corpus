  - number: '13.16'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet verstrekt de netbeheerder van een op zijn net aangesloten net
      van elk afzonderlijk overdrachtspunt van een aansluiting de plannings- en prognosegegevens gegevens, van het achter
      het overdrachtspunt gelegen landelijk hoogspanningsnet, te weten:

      a. de topologie;

      b. de voorziene niet beschikbaarheidsplanning;

      c. indien de drempelwaarde als bedoeld in artikel 14, zesde lid, van de Verordening (EU) 2016/1388 (NC DCC)
      overschreden wordt: het invoedend kortsluitvermogen (één- en driefase kortsluitstromen).

      2 De gegevens als bedoeld in het eerste lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter de verbruiksinstallatie zich bevindt;

      b. de EAN-code van het desbetreffende overdrachtspunt, als bedoeld in [artikel 2.4, zevende lid][ref2].

      3 Van de gegevens bedoeld in het eerste lid, wordt jaarlijks, uiterlijk op 1 april, een zo goed mogelijke schatting
      voor de komende tien jaar ter beschikking gesteld.

      4 Van de gegevens bedoeld in het eerste lid, worden wijzigingen ten opzichte van de gegevens, ter beschikking
      gesteld overeenkomstig het tweede lid, maandelijks, uiterlijk op de vijfde dag van de maand, voor de komende maand
      ter beschikking gesteld.

      5 De gegevens bedoeld in het eerste lid, worden wekelijks, uiterlijk op woensdag voor de komende week ter
      beschikking gesteld.

      6 Van de gegevens bedoeld in het eerste lid, worden wijzigingen ten opzichte van de gegevens, ter beschikking
      gesteld overeenkomstig het vijfde lid, dagelijks, uiterlijk om 09.00 uur voor de komende dag ter beschikking
      gesteld.

      7 Het eerste lid, onderdeel b, is van overeenkomstige toepassing op aangeslotenen die beschikken over een
      elektriciteitsproductie-eenheid, een verbruiksinstallatie of een gesloten distributiesysteem aangesloten op het
      landelijk hoogspanningsnet.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
