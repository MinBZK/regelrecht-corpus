  - number: 7.1a
    text: |-
      1 Een volledig vast recht op transport geeft de aangeslotene een recht op transport tot een hoeveelheid ter
      grootte van de doorlaatwaarde indien het een kleinverbruikaansluiting of een artikel-1-lid-2-of-3-aansluiting
      betreft of het op de aansluiting gecontracteerde transportvermogen voor afname of voor invoeding indien het
      een grootverbruikaansluiting niet zijnde een artikel-1-lid-2-of-3 aansluiting betreft, met inachtneming van
      [paragraaf 7.4][ref1].

      2 Een volledig vast recht op transport als bedoeld in het eerste lid wordt aangeboden aan aangeslotenen op het
      landelijk hoogspanningsnet en aangeslotenen op een regionaal net.

      3 Op een volledig vast recht op transport als bedoeld in het eerste lid, zijn de tariefstructuren als bedoeld in
      de [artikelen 3.7.5 tot en met 3.7.14][ref2], [3.7.18][ref3] en [3.7.19 van de Tarievencode elektriciteit][ref4]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0037951#Artikel3.7.10
      [ref3]: https://wetten.overheid.nl/BWBR0037951#Artikel3.7.18
      [ref4]: https://wetten.overheid.nl/BWBR0037951#Artikel3.7.19
