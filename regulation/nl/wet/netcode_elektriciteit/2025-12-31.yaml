  - number: '13.37'
    text: |-
      Ten behoeve van de gegevensuitwisseling, als bedoeld in de [artikelen 10.31 tot en met 10.38][ref1], worden de
      op die gegevensuitwisseling van toepassing zijnde delen van de internationale normreeks IEC 61850: ‘Communication
      networks and systems for power utility automation' toegepast.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.31
