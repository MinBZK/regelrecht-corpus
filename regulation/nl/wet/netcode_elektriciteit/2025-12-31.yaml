  - number: '8.2'
    text: |-
      1 De netbeheerder stelt al hetgeen redelijkerwijs binnen zijn vermogen ligt in het werk om onderbreking van de
      transportdienst te voorkomen, of indien een onderbreking van de transportdienst optreedt, deze zo snel mogelijk
      te verhelpen.

      a. een onderbreking van de transportdienst ten gevolge van een storing in een net met een spanningsniveau tot en
      met 1 kV is binnen 4 uur hersteld;

      b. een onderbreking van de transportdienst ten gevolge van een storing in een net met een spanningsniveau groter
      dan 1 kV tot en met 35 kV is binnen 2 uur hersteld;

      c. een onderbreking van de transportdienst ten gevolge van een storing in een net met een spanningsniveau groter
      dan 35 kV is binnen 1 uur hersteld;

      2 Indien een onderbreking van de transportdienst ten gevolge van een storing niet binnen de in het eerste lid
      genoemde tijden is hersteld, is artikel 8.8 van toepassing.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel8.2
  - number: '8.3'
    text: |-
      Voor aansluitingen met een doorlaatwaarde tot en met 3x80A geldt dat de netbeheerder:

      a. binnen twee uur na een melding door een aangeslotene ter plaatse is, indien een storing aan de aansluiting van
      de aangeslotene is opgetreden, al dan niet gepaard gaand met een onderbreking in de transportdienst;

      b. correspondentie van een aangeslotene binnen tien werkdagen afhandelt. Indien een oplossing in deze periode niet
      mogelijk is, ontvangt de aangeslotene binnen vijf werkdagen bericht binnen welke termijn een adequate reactie kan
      worden verwacht;

      c. bij het maken van afspraken met de aangeslotene tijdsblokken van twee uur hanteert;

      d. met de aangeslotene overeengekomen werkzaamheden uitvoert:

      1°. binnen drie werkdagen wanneer de transportdienst aan andere aangeslotene niet hoeft te worden onderbroken en
      volgens de planning minder dan vier mensuur zijn gemoeid;

      2°. binnen tien werkdagen wanneer de transportdienst aan andere aangeslotenen dient te worden onderbroken;

      3°. binnen tien werkdagen wanneer volgens de planning meer dan vier mensuur zijn gemoeid;

      e. tenminste vijf werkdagen van tevoren schriftelijk of telefonisch een afspraak met de aangeslotene maakt, voor
      het uitvoeren van inpandige werkzaamheden op verzoek van de netbeheerder;

      f. de aangeslotene tenminste drie werkdagen van tevoren op de hoogte stelt van door de netbeheerder geplande
      werkzaamheden waarbij het noodzakelijk is dat de transportdienst bij de aangeslotene wordt onderbroken;

      g. offertes voor aansluitingen zo spoedig mogelijk verzendt, doch uiterlijk binnen tien werkdagen na ontvangst van
      een volledige aanvraag daarvoor.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel8.3
  - number: '8.4'
    text: |-
      Voor aansluitingen met een doorlaatwaarde groter dan 3x80A, geldt dat de netbeheerder:

      a. de aangeslotene op een laagspanningsnet tenminste drie werkdagen van tevoren op de hoogte stelt van door de
      netbeheerder geplande werkzaamheden waarbij de transportdienst aan de aangeslotene wordt onderbroken;

      b. de aangeslotene op een middenspanningsnet of een hoogspanningsnet met een spanningsniveau kleiner dan 110 kV
      tenminste tien werkdagen van tevoren op de hoogte stelt van door de netbeheerder geplande werkzaamheden indien
      de transportdienst aan de aangeslotene wordt onderbroken en de datum van de genoemde werkzaamheden pas vaststelt
      na overleg met de daardoor getroffen aangeslotene, waarbij de netbeheerder in redelijkheid belangen van de
      aangeslotenen weegt;

      c. met de aangeslotene op een hoogspanningsnet met een spanningsniveau van 110 kV of 150 kV die beschikt over een
      elektriciteitsproductie-eenheid, de niet-beschikbaarheid afstemt overeenkomstig [artikel 9.17][ref1];

      d. correspondentie van een aangeslotene binnen tien werkdagen afhandelt. Indien een oplossing in deze periode niet
      mogelijk is, ontvangt de aangeslotene binnen vijf werkdagen bericht binnen welke termijn een adequate reactie kan
      worden verwacht;

      e. een offerte voor een aansluiting met een aansluitcapaciteit tot en met 10 MVA verzendt binnen tien werkdagen na
      ontvangst van een volledige aanvraag daarvoor. In deze offerte is in ieder geval opgenomen:

      1°. indien van toepassing de mededeling dat er sprake is van een situatie als bedoeld in
      [artikel 8.13, derde lid, onderdeel a][ref2];

      2°. een verwijzing naar de relevante informatie over het offerte- en aansluitproces;

      3°. de huidige dynamische regionale wachttijd als bedoeld in [artikel 8.12][ref3]; en

      4°. informatie over de van toepassing zijnde annuleringsvoorwaarden;

      e1. na een vooraankondiging die betrekking heeft op een gebied waarin de aanleg of wijziging van de aansluiting is
      aangevraagd als bedoeld in [artikel 9.9, eerste lid][ref4], door de netbeheerder of de bovenliggende netbeheerder,
      in afwijking van onderdeel e, de offerte verzendt 10 werkdagen na publicatie van het onderzoek, als bedoeld in
      [artikel 9.10][ref5], indien de periode tot aan deze dag langer is dan de tien werkdagen bedoeld in onderdeel e;

      e2. na ontvangst van een volledige aanvraag voor transportcapaciteit tot en met een capaciteit van 10 MVA,
      offertes, de mogelijkheid als bedoeld in [artikel 9.6, derde lid][ref6], of afwijzingen als bedoeld in
      [artikel 24, tweede lid, van de Elektriciteitswet 1998][ref7], verzendt:

      1°. binnen een periode van tien werkdagen;

      2°. na een melding van een vooraankondiging als bedoeld in [artikel 9.9, eerste lid][ref8], door de netbeheerder
      of de bovenliggende netbeheerder, binnen de periode tot de publicatie van het onderzoek, als bedoeld in
      [artikel 9.10, derde lid][ref9], indien deze periode langer is dan tien werkdagen; of

      3°. in geval van een aanvraag voor een groepstransportovereenkomst, binnen een redelijke termijn;

      f. binnen tien werkdagen na ontvangst van een aanvraag daarvoor de aangeslotene bericht binnen welke termijn deze
      een offerte voor een aansluiting met een aansluitcapaciteit groter dan 10 MVA kan verwachten;

      g. indien de netbeheerder in de tabel in [artikel 2.3.3c van de Tarievencode elektriciteit][ref10] een afwijkende
      grens hanteert, die afwijkende grens eveneens hanteert bij de toepassing van onderdeel e;

      h. indicatieve nettekeningen aan offertes toevoegt waaruit de plaats in het net blijkt waarop het aansluittarief is
      gebaseerd en waaruit de plaats in het net blijkt waar de aangeslotene waarschijnlijk zal worden aangesloten;

      i. uiterlijk twee uur nadat een onderbreking van de transportdienst door een aangeslotene aan hem is gemeld,
      een begin maakt met de werkzaamheden die moeten leiden tot de opheffing van de onderbreking en aangeslotenen op
      netten met een spanningsniveau van 25 kV of meer desgevraagd informeert over de omvang van de onderbreking, de te
      verwachten duur en de door de netbeheerder te nemen maatregelen;

      j. aan door een onderbreking van de transportdienst getroffen aangeslotenen op hun verzoek binnen tien werkdagen
      een verklaring van het ontstaan van de onderbreking geeft. Indien dit binnen deze termijn niet mogelijk is,
      geeft de netbeheerder binnen genoemde termijn aan wanneer de aangeslotene de verklaring van de netbeheerder mag
      verwachten; en

      k. ondertekende offertes voor de aanleg of de wijziging van aansluitingen met een aansluitcapaciteit tot en met 10
      MVA afhandelt overeenkomstig [artikel 8.13][ref11].


