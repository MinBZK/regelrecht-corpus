  - number: '10.35'
    text: |-
      1 In de navolgende gevallen kan de netbeheerder van het landelijk hoogspanningsnet de
      balanceringsverantwoordelijkheid van een BRP met onmiddellijke ingang of tegen een te bepalen datum intrekken.
      Voor zover het niet voldoen aan een hierna gesteld geval tevens op grond van [artikel 10.32][ref1] leidt tot de
      verschuldigdheid van een boete, wordt een niet voldoen hierna in ieder geval slechts in aanmerking genomen als de
      verschuldigdheid van de boete onherroepelijk is geworden:

      a. de BRP voldoet niet langer aan de bij of krachtens de wet- en regelgeving gestelde voorwaarden voor erkenning
      als BRP;

      b. de BRP heeft op een kalenderdag niet vóór de daartoe in [artikel 10.11, eerste lid][ref2] en
      [artikel 10.12][ref3], bepaalde tijdstippen een energieprogramma voor de daaropvolgende kalenderdag ingediend, en
      heeft zulks evenmin onverwijld gedaan na daarop door de netbeheerder van het landelijk hoogspanningsnet te zijn
      gewezen, of is tenminste tweemaal in zeven dagen of driemaal in 30 dagen in gebreke gebleven als in dit onderdeel
      bedoeld;

      c. de BRP heeft een energieprogramma ingediend waarin de per onbalansverrekeningsperiode op een tot zijn
      balanceringsverantwoordelijkheid behorend(e) aansluiting(en) in te voeden of af te nemen netto-hoeveelheid
      energie niet is gedekt door transacties die zijn opgenomen in de energieprogramma’s van andere BRP's of door
      bij of krachtens de Elektriciteitswet 1998 en deze code toegestane import- of exporttransacties waarvoor door de
      netbeheerder van het landelijk hoogspanningsnet transportcapaciteit is toegekend, en

      1° zij heeft niet onverwijld na daarop door de netbeheerder van het landelijk hoogspanningsnet te zijn gewezen een
      nieuw energieprogramma ingediend, waarin de in de aanhef van dit onderdeel bedoelde dekking wel is voorzien, of;

      2° zij is ten minste tweemaal in een periode van zeven dagen of driemaal in een periode van 30 dagen in gebreke
      gebleven als in de aanhef van dit onderdeel bedoeld;

      d. de BRP houdt met opzet onbalans in stand, waarbij evenwel geldt dat de netbeheerder van het landelijk
      hoogspanningsnet de erkenning niet kan intrekken dan nadat zij de BRP in de gelegenheid heeft gesteld zich uit te
      laten over de gronden waarop de netbeheerder van het landelijk hoogspanningsnet baseert dat deze intrekkingsgrond
      aanwezig is;

      e. de BRP heeft gedurende een etmaal meer transacties, uitgedrukt in aantal MW, in haar
      energieprogramma’s verantwoord dan de omvang die ten grondslag ligt aan de met toepassing van
      [artikel 10.7, vierde lid, onderdeel, b][ref4] en [artikel 10.8][ref5] vastgestelde hoogte van de verstrekte
      financiële zekerheden en zij verstrekt niet op eerste verzoek van de netbeheerder van het landelijk
      hoogspanningsnet aanvullende financiële zekerheid;

      f. de BRP oefent voor een grotere totale aansluitcapaciteit, uitgedrukt in MW, balanceringsverantwoordelijkheid
      uit, dan de capaciteit waarvan is uitgegaan bij de bepaling van de hoogte van de verstrekte financiële zekerheden
      en zij verstrekt niet op eerste verzoek van de netbeheerder van het landelijk hoogspanningsnet aanvullende
      financiële zekerheid;

      g. de BRP voldoet in andere gevallen dan in onderdeel e en f bedoeld niet aan een gemotiveerd en op deze code
      gebaseerd verzoek van de netbeheerder van het landelijk hoogspanningsnet om binnen redelijke termijn aanvullende
      financiële zekerheid te verstrekken;

      h. de BRP betaalt niet een krachtens deze code verschuldigd bedrag, ondanks ingebrekestelling door de netbeheerder
      van het landelijk hoogspanningsnet, voor zover die is vereist, of blijft in gebreke ten aanzien van enige andere
      verplichting die ingevolge deze code op haar rust;

      i. de BRP wordt ontbonden, verdwijnt door fusie of wordt geliquideerd, surséance van betaling wordt verleend of
      failliet wordt verklaard, dan wel wanneer toepassing van de schuldsaneringsregeling natuurlijke personen op een BRP
      wordt uitgesproken.

      2 De netbeheerder van het landelijk hoogspanningsnet kan de balanceringsverantwoordelijkheid van een BRP
      voorts intrekken ingeval haar aanwijzing als netbeheerder van het landelijk hoogspanningsnet op grond van de
      Elektriciteitswet 1998 wordt ingetrokken of niet wordt vernieuwd. Intrekking vindt in dat geval plaats met
      inachtneming van een termijn van dertig dagen vóór de beoogde datum waarop de intrekking van kracht wordt.


