  - number: '13.17'
    text: |-
      1 Netbeheerders van onderling gekoppelde distributienetten bepalen in onderling overleg en verstrekken vervolgens
      elkaar, van elk afzonderlijk station waarin de netten worden gekoppeld, de uit te wisselen plannings- en
      prognosegegevens, jaarlijks, uiterlijk op 1 april, inhoudende een zo goed mogelijke schatting voor de komende tien
      jaar, van:

      a. de ontwikkeling van de wintermaxima, de zomermaxima en de dalbelasting op jaarbasis;

      b. een beschrijving van het belastingpatroon (bijvoorbeeld standaard dagcurve voor een werkdag, zaterdag en
      zondag);

      c. de verdeling over de overdrachtspunten op de relevante stations;

      d. de revisieplanning van de elektriciteitsproductie-eenheden groter dan 60 MW, die zijn aangesloten op het
      betreffende net;

      e. het samengestelde draaiplan van de elektriciteitsproductie-eenheden, die zijn aangesloten op het betreffende
      net.

      2 De gegevens als bedoeld in het eerste lid worden verstrekt onder vermelding van:

      a. de naam van het station.

      3 Netbeheerders van onderling gekoppelde distributienetten bepalen in onderling overleg en verstrekken vervolgens
      elkaar, van elk achter een overdrachtspunt van een aansluiting gelegen deelnet, de plannings- en prognosegegevens
      van het achter dat overdrachtspunt gelegen deelnet, te weten:

      a. de geaggregeerde belasting (geldt alleen voor 'van onderliggend net, naar bovenliggend net');

      b. de geaggregeerde productie per primaire energiebron (geldt alleen voor 'van onderliggend net, naar bovenliggend
      net');

      c. het blindvermogen met richting.

      4 De gegevens als bedoeld in het derde lid worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref1],
      waarachter het distributienet zich bevindt;

      b. de EAN-code van het desbetreffende overdrachtspunt, als bedoeld in [artikel 2.4, zevende lid][ref2].

      5 Van de gegevens bedoeld in het derde lid, wordt jaarlijks, uiterlijk op 1 april, een zo goed mogelijke schatting
      voor het komende jaar ter beschikking gesteld.

      6 Van de gegevens bedoeld in het derde lid, worden wijzigingen ten opzichte van de gegevens, ter beschikking
      gesteld overeenkomstig het vijfde lid, maandelijks, uiterlijk op de vijfde dag van de maand, voor de komende maand
      ter beschikking gesteld.

      7 De gegevens bedoeld in het derde lid, worden dagelijks, uiterlijk om 15:00 uur voor de komende dag ter
      beschikking gesteld en bestaan uit een prognose van de gemiddelde MW-waarde en Mvar-waarde per kwartier.

      8 Wijzigingen ten opzichte van de overeenkomstig het zevende lid ter beschikking gestelde prognose van de
      hoeveelheid met het net uit te wisselen werkzaam vermogen, worden direct na het bekend worden van die wijziging aan
      de netbeheerder ter beschikking gesteld, in geval van een maximaal met het net uit te wisselen werkzaam vermogen:

      a. kleiner dan 200 MW als de wijziging groter is dan 5% van het maximaal met het net uit te wisselen werkzaam
      vermogen;

      b. groter dan of gelijk aan 200 MW als de wijziging groter is dan 10 MW.

      9 Het eerste tot en met achtste lid zijn van overeenkomstige toepassing op een beheerder van een gesloten
      distributiesysteem, aangesloten op een distributienet, waarbij:

      a. tussen de netbeheerder van dat distributienet en de desbetreffende beheerder van een gesloten distributiesysteem
      kan worden overeengekomen om op onderdelen af te wijken van het eerste tot en met het achtste lid;

      b. de netbeheerder van het desbetreffende distributienet een verzoek van een beheerder van een gesloten
      distributiesysteem tot een andere overeenkomst niet op onredelijke gronden zal weigeren;

      c. de overeenkomst als bedoeld in onderdeel b wordt vastgelegd in de aansluit-en transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
