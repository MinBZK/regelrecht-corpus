  - number: '13.19'
    text: |-
      De netbeheerder publiceert dagelijks een wekelijks voortschrijdend totaal van de prognoses en de daadwerkelijke
      transporten per deelnet op zijn website.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.19
  - number: '13.20'
    text: |-
      Waar in deze paragraaf sprake is van een grenswaarde van 1 MW, kan de netbeheerder per bepaling een hogere
      grenswaarde vaststellen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.20
  - number: '13.21'
    text: |-
      1 Een aangeslotene die beschikt over een elektriciteitsproductie-eenheid aangesloten op het landelijk
      hoogspanningsnet verstrekt de netbeheerder van het landelijk hoogspanningsnet, van elk afzonderlijk overdrachtspunt
      van een aansluiting waarachter zich een elektriciteitsproductie-eenheid bevindt, de realtimegegevens, te weten:

      a. de standmeldingen van de vermogensschakelaars behorend bij het overdrachtspunt van de aansluiting;

      b. de richting en grootte van het uitgewisseld werkzaam vermogen en blindvermogen;

      c. het spanningsniveau.

      2 De netbeheerder van het landelijk hoogspanningsnet stelt aan de aangeslotene die beschikt over een
      elektriciteitsproductie-eenheid aangesloten op het landelijk hoogspanningsnet de volgende realtimegegevens ter
      beschikking:

      a. standmeldingen van de vermogensschakelaars en spanning- en stroommetingen die voor een adequate beveiliging van
      de elektriciteitsproductie-eenheid bij storingen vanuit het net noodzakelijk zijn;

      b. standmeldingen van de vermogensschakelaars zodat op een juiste wijze gesignaleerd kan worden of de
      elektriciteitsproductie-eenheid met het net is verbonden.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.21
  - number: '13.22'
    text: |-
      1 Een aangeslotene die beschikt over een elektriciteitsproductie-eenheid met een maximumcapaciteit groter dan of
      gelijk aan 1 MW aangesloten op een distributienet verstrekt de netbeheerder, van elk afzonderlijk overdrachtspunt
      van een aansluiting waarachter zich die elektriciteitsproductie-eenheid bevindt, de realtimegegevens, te weten:

      a. de standmeldingen van de vermogensschakelaars;

      b. de stroomsterkte;

      c. de richting en de grootte van het werkzaam vermogen en het blindvermogen; en

      d. het spanningsniveau.

      2 De regionale netbeheerder stelt aan de aangeslotene die beschikt over een elektriciteitsproductie-eenheid met
      een maximumcapaciteit groter dan of gelijk aan 1 MW aangesloten op het regionale net de volgende realtimegegevens
      ter beschikking:

      a. standmeldingen van de vermogenschakelaars en spanning- en stroommetingen die voor een adequate beveiliging van
      de elektriciteitsproductie-eenheid bij storingen vanuit het net noodzakelijk zijn;

      b. standmeldingen van de vermogenschakelaars zodat op een juiste wijze gesignaleerd kan worden of de
      elektriciteitsproductie-eenheid met het net is verbonden.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.22
  - number: '13.23'
    text: |-
      Een aangeslotene die beschikt over een verbruiksinstallatie aangesloten op het landelijk hoogspanningsnet verstrekt
      de netbeheerder van het landelijk hoogspanningsnet, van elk afzonderlijk overdrachtspunt van de aansluiting
      waarachter zich die verbruiksinstallatie bevindt, de realtimegegevens, te weten:

      a. de standmeldingen van de vermogensschakelaars behorend bij het overdrachtspunt van de aansluiting;

      b. de richting en de grootte van het werkzaam vermogen en het blindvermogen; en

      c. de minimale en maximale inperking van het vermogen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.23
  - number: '13.24'
    text: |-
      1 Een aangeslotene die beschikt over een verbruiksinstallatie, aangesloten op een distributienet met een
      maximaal af te nemen werkzaam vermogen groter dan of gelijk aan 1 MW verstrekt, indien de verbruiksinstallatie
      een verbruikseenheid omvat die deelneemt aan vraagsturing, aan de regionale netbeheerder, van elk afzonderlijk
      overdrachtspunt van de aansluiting waarachter zich de verbruiksinstallatie bevindt, de realtimegegevens, te weten:

      a. de standmeldingen van de vermogensschakelaars behorend bij het overdrachtspunt van de aansluiting;

      b. de richting en de grootte van het werkzaam vermogen en het blindvermogen; en

      c. de minimale en maximale inperking van het vermogen.

      2 Indien sprake is van vraagsturing door middel van een derde partij als bedoeld in artikel 27 tot en met 29 van
      de verordening (EU) 2016/1388 (NC DCC), draagt de aangeslotene er zorg voor dat de derde partij de realtimegegevens
      kan verstrekken aan de netbeheerder, te weten:

      a. het werkzame vermogen; en

      b. de richting en de grootte van het blindvermogen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.24
  - number: '13.25'
    text: |-
      1 De netbeheerder, waarvan het distributienet is aangesloten op het landelijk hoogspanningsnet, verstrekt de
      netbeheerder van het landelijk hoogspanningsnet, per overdrachtspunt, de realtimegegevens, te weten:

      a. de benodigde standmeldingen voor het realiseren van de vergrendelingen;

      b. indien van toepassing de informatie op veldniveau zoals vastgelegd in de uniforme door de gezamenlijke
      netbeheerders overeengekomen werkwijze voor secundaire interfacing van RNB transformatorvelden;

      c. ten behoeve van de uitvoering on line (actuele bedrijfsvoering):

      1°. de best beschikbare gegevens voor de de som van de productie in het deelnet per primaire energiebron;

      2°. de best beschikbare gegevens voor de de som van het verbruik in het deelnet;

      3°. productie van alle elektriciteitsproductie-eenheden groter dan 60 MW;

      4°. schakelsituatie net (status), belasting en spanningen op overdrachtspunten met het bovenliggende net,
      belangrijke maascircuits en overdrachtspunten tussen deelnetten;

      d. op verzoek de navolgende bedrijfsmetingen in het transformatorveld:

      1°. 1*U gekoppelde spanning primaire zijde;

      2°. 1*I fasestroom, primaire zijde;

      3°. het werkzaam vermogen aan de primaire zijde met de richting;

      4°. blindvermogen aan de primaire zijde met de richting;

      5°. werkzaam vermogen aan de secundaire zijde met de richting;

      6°. blindvermogen aan de secundaire zijde met de richting;

      7°. werkzaam vermogen aan de tertiaire zijde met de richting;

      8°. blindvermogen aan de tertiaire zijde met de richting;

      2 Het eerste lid, met uitzondering van onderdeel b, is van overeenkomstige toepassing op een beheerder van een
      gesloten distributiesysteem, aangesloten op het landelijk hoogspanningsnet.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.25
  - number: '13.26'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet verstrekt de netbeheerder van een op zijn net aangesloten
      distributienet per overdrachtspunt de realtimegegevens, te weten:

      a. de benodigde standmeldingen voor het realiseren van de vergrendelingen;

      b. indien van toepassing de informatie op veldniveau zoals vastgelegd in de uniforme door de gezamenlijke
      netbeheerders overeengekomen werkwijze voor secundaire interfacing van RNB transformatorvelden;

      c. ten behoeve van de uitvoering on line (actuele bedrijfsvoering) de schakelsituatie net (status);

      d. de trapstanden van de transformatoren;

      e. indien van toepassing op verzoek de navolgende bedrijfsmetingen in het transformatorveld:

      1°. 1*U gekoppelde spanning primaire zijde;

      2°. 1*I fasestroom, primaire zijde;

      3°. het werkzaam vermogen aan de primaire zijde met de richting;

      4°. blindvermogen aan de primaire zijde met de richting;

      5°. werkzaam vermogen aan de secundaire zijde met de richting;

      6°. blindvermogen aan de secundaire zijde met de richting;

      7°. werkzaam vermogen aan de tertiaire zijde met de richting;

      8°. blindvermogen aan de tertiaire zijde met de richting;

      f. het blindvermogen in het reactor- en condensatorveld;

      g. de gegevens van de state estimator van de netbeheerder van het landelijk hoogspanningsnet, te weten de amplitude
      en de fase van de spanning (complexe lijnspanning).
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.26
  - number: '13.27'
    text: |-
      1 Netbeheerders van onderling gekoppelde distributienetten bepalen in onderling overleg en verstrekken vervolgens
      elkaar, de uit te wisselen realtimegegevens, te weten:

      a. de benodigde standmeldingen voor het realiseren van de vergrendelingen;

      b.

      c. ten behoeve van de uitvoering on line (actuele bedrijfsvoering):

      1°. de best beschikbare gegevens voor de de som van de productie in het deelnet per primaire energiebron (geldt
      alleen voor 'van onderliggend net, naar bovenliggend net');

      2°. de best beschikbare gegevens voor de de som van het verbruik in het deelnet (geldt alleen voor 'van
      onderliggend net, naar bovenliggend net');

      3°. productie van alle elektriciteitsproductie-eenheden groter dan 60 MW;

      4°. schakelsituatie net (status), belasting en spanningen op overdrachtspunten met het bovenliggende net,
      belangrijke maascircuits en overdrachtspunten tussen deelnetten;

      d. op verzoek de navolgende bedrijfsmetingen in het transformatorveld:

      1°. 1*U gekoppelde spanning primaire zijde;

      2°. 1*I fasestroom, primaire zijde;

      3°. het werkzaam vermogen aan de primaire zijde met de richting;

      4°. blindvermogen aan de primaire zijde met de richting;

      5°. werkzaam vermogen aan de secundaire zijde met de richting;

      6°. blindvermogen aan de secundaire zijde met de richting;

      7°. werkzaam vermogen aan de tertiaire zijde met de richting;

      8°. blindvermogen aan de tertiaire zijde met de richting;

      e. het werkzame vermogen en blindvermogen in het eventueel op het desbetreffende station aanwezige
      elektriciteitsproductie-installatieveld;

      f. het blindvermogen in het op het desbetreffende station eventueel aanwezige reactor- en condensatorveld;

      g. bij koppeling op gelijk spanningsniveau stellen de betrokken netbeheerders elkaar op verzoek de stationsspanning
      ter beschikking.

      2 Het eerste lid is van overeenkomstige toepassing op een beheerder van een gesloten distributiesysteem,
      aangesloten op een distributienet, tenzij anders overgekomen tussen de netbeheerder van dat distributienet en de
      desbetreffende beheerder van een gesloten distributiesysteem.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.27
  - number: '13.28'
    text: |-
      1 Een aangeslotene die beschikt over een HVDC-systeem of een DC-aangesloten power park module, aangesloten op
      het landelijk hoogspanningsnet verstrekt de netbeheerder van het landelijk hoogspanningsnet, van elk afzonderlijk
      overdrachtspunt van een aansluiting waarachter zich een HVDC-systeem of een DC-aangesloten power park module
      bevindt, de realtimegegevens, te weten:

      a. de operationele signalen, waaronder ten minste:

      1°. de opstartsignalen;

      2°. de wisselspannings- en gelijkspanningsmetingen;

      3°. de wisselstroom- en gelijkstroommetingen;

      4°. de metingen van het werkzaam en het blindvermogen aan de wisselstroomzijde;

      5°. de metingen van het gelijkstroomvermogen aan de gelijkstroomzijde;

      6°. de bedrijfsvoering op het niveau van HVDC-convertoreenheden in een HVDC-convertor van het multi-pooltype;

      7°. de status van de elementen en de topologie;

      8°. het bereik van het werkzaam vermogen in FSM, LFSM-O en LFSM-U;

      b. de alarmsignalen, waaronder ten minste:

      1°. de noodblokkering;

      2°. de op- en afregelblokkering;

      3°. de snelle omkering van het werkzaam vermogen.

      2 De netbeheerder van het landelijk hoogspanningsnet stelt aan de aangeslotene die beschikt over een HVDC-systeem
      of een DC-aangesloten power park module aangesloten op het landelijk hoogspanningsnet de volgende realtimegegevens
      ter beschikking:

      a. standmeldingen van de vermogensschakelaars en spanning- en stroommetingen die voor een adequate beveiliging van
      het HVDC-systeem of de DC-aangesloten power park module bij storingen vanuit het net noodzakelijk zijn;

      b. standmeldingen van de vermogensschakelaars zodat op een juiste wijze gesignaleerd kan worden of het HVDC-systeem
      of de DC-aangesloten power park module met het net is verbonden.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.28
  - number: '13.29'
    text: |-
      In [artikel 13.21 tot en met 13.28][ref1], wordt met realtime bedoeld een representatie van de momentane status van
      de elektriciteitsproductie-installaties, de verbruikseenheden en de netelementen, als bedoeld in artikel 2, vijfde
      lid, van de KORRR.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel13.21
