  - number: '10.31'
    text: |-
      De netbeheerder van het landelijk hoogspanningsnet verrekent, via zijn transportafhankelijk verbruikerstarief als
      bedoeld in [paragraaf 3.2 van de Tarievencode elektriciteit][ref1], in het jaar volgend op het jaar van verrekening
      van het in een kalenderjaar voor de netbeheerder van het landelijk hoogspanningsnet resulterende saldo van de
      verrekeningen van:

      a. onbalans met BRP’s;

      b. de kosten met BSP’s voor de geactiveerde middelen als bedoeld in [artikel 9.20, eerste lid, onderdeel a][ref2],
      met uitzondering van de kosten voor aFRR en noodvermogen als bedoeld in
      [artikel 3.2.2a, onderdeel a, van de Tarievencode elektriciteit][ref3];

      c. het onbalansnettingproces;

      d. uitwisselingen van balanceringsenergie via de Europese platformen voor uitwisseling van balanceringsenergie uit
      aFRR en mFRR.


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Paragraaf3.2
