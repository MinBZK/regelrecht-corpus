  - number: '9.41'
    text: |-
      1 Mede op basis van de gegevens die de netbeheerder ontvangt op grond van [artikel 9.35][ref1] en
      [paragraaf 13.2][ref2] bepaalt de netbeheerder of de van toepassing zijnde operationele veiligheidsgrenzen de
      volgende dag in het congestiegebied kunnen worden gehandhaafd.

      2 De netbeheerder publiceert uiterlijk om 15:30 uur voor welke tijdsblokken de volgende dag hij biedingen verwacht.

      3 De in het tweede lid bedoelde biedingen worden uiterlijk 16:00 uur bij de netbeheerder ingediend.

      4 De netbeheerder brengt de benodigde capaciteit in overeenstemming met de beschikbare capaciteit met behulp van:

      a. het hem overeenkomstig het derde of vierde lid of [artikel 9.1, tweede en derde lid][ref3], ter beschikking
      gestelde vermogen ten behoeve van redispatch;

      b. met behulp van het op grond van [artikel 9.1, eerste lid][ref4], ter beschikking gestelde vermogen indien op
      grond van [bijlage 12][ref5] inzet na gate-sluitingstijd van de day-aheadmarkt op de dag voorafgaande aan het
      transport van het ter beschikking gestelde vermogen is afgesproken; of

      c. niet-marktgebaseerde redispatch van elektriciteitsproductie-eenheden indien de middelen benoemd in onderdelen a
      en b niet toereikend zijn.

      5 Aangeslotenen en CSP’s waarvan een bieding overeenkomstig het vierde lid is afgeroepen, ontvangen hiervan
      uiterlijk op het overeenkomstig [artikel 9.39, tweede lid][ref6], gepubliceerde tijdstip bericht.

      6 De netbeheerder roept per onbalansverrekeningsperiode per afgeroepen bieding dan wel opgedragen
      capaciteitsvermindering dan wel per opgedragen niet-marktgebaseerde redispatch een gelijke hoeveelheid
      vermogen af buiten het congestiegebied. Hij maakt daarvoor gebruik van het hem overeenkomstig
      [artikel 9.1, tweede en derde lid][ref7], ter beschikking gestelde vermogen of met behulp van het op grond van
      artikel 9.1, eerste lid, ter beschikking gestelde vermogen indien op grond van [bijlage 12][ref8] inzet na gate-
      sluitingstijd van de day-aheadmarkt op de dag voorafgaande aan het transport van het ter beschikking gestelde
      vermogen is afgesproken.

      7 Onverminderd het bepaalde in [artikel 9.2, vierde lid][ref9], volgt de netbeheerder bij wijzigingen van de in het
      eerste lid bedoelde gegevens de stappen als bedoeld in het eerste, vierde, vijfde en zesde lid.


