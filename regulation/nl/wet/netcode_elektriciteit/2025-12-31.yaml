  - number: '12.18'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet bepaalt de in [artikel 12.1, eerste lid][ref1], genoemde
      veilig beschikbare landsgrensoverschrijdende transportcapaciteit voor elektriciteit op basis van de onderstaande
      methode.

      2 De transportcapaciteit wordt op uurbasis vastgesteld.

      3 De transportcapaciteit wordt separaat voor importen en exporten vastgesteld.

      4 De transportcapaciteit wordt bepaald door middel van netberekeningen met inachtneming van het in
      [artikel 12.20][ref2] gestelde op basis van een volledig beschikbaar net, waaronder verstaan wordt het samenstel
      van Nederlandse netten op een spanningsniveau van 220 kV of hoger, inclusief de landsgrensoverschrijdende
      verbindingen.

      5 De transportcapaciteit wordt afzonderlijk vastgesteld voor de winterperiode, waaronder verstaan wordt een
      aaneensluitende periode van 100 dagen waarvoor geldt dat de belastbaarheid van de netcomponenten maximaal is ten
      gevolge van natuurlijke koeling.

      6 De transportcapaciteit wordt afzonderlijk vastgesteld voor de perioden waarin één of meer
      landsgrensoverschrijdende verbindingen vanwege onderhoud niet of gedeeltelijk beschikbaar zijn. In dit geval
      dient de transportcapaciteit overeenkomstig het gestelde in het vierde lid op basis van een op de te onderhouden
      netcomponenten na volledig beschikbaar net te worden vastgesteld.

      7 De in het vierde en zesde lid genoemde berekeningen vinden plaats voor diverse scenario’s. In elk scenario
      wordt de maximale waarde voor de importcapaciteit en de exportcapaciteit bepaald door de landsgrensoverschrijdende
      transporten maximaal te verhogen onder handhaving van de enkelvoudige storingsreserve voor de
      landsgrensoverschrijdende verbindingen.

      8 De in het zevende lid genoemde verhoging van de landsgrensoverschrijdende transporten gebeurt door de
      productie van alle Nederlandse elektriciteitsproductie-installaties die in het betreffende scenario zijn
      meegenomen, proportioneel te verlagen dan wel verhogen en door gelijktijdig de productie van de buitenlandse
      elektriciteitsproductie-installaties die in het betreffende scenario beschikbaar zijn proportioneel te verhogen dan
      wel verlagen.

      9 De veilig beschikbare landsgrensoverschrijdende transportcapaciteit voor import wordt gelijk gesteld aan de
      laagste waarde van de in het zevende lid genoemde maximale importcapaciteit voor elk van de scenario’s.

      10 De veilig beschikbare landsgrensoverschrijdende transportcapaciteit voor export wordt gelijk gesteld aan de
      laagste waarde van de in het zevende lid genoemde maximale exportcapaciteit voor elk van de scenario’s.

      11 In het geval dat een beheerder van een buitenlands net op basis van netberekeningen voor zijn net de
      netbeheerder van het landelijk hoogspanningsnet verzoekt een lagere waarde voor de maximale transportcapaciteit
      op een landsgrensoverschrijdende verbinding te hanteren dan de waarde die overeenstemt met de in het negende of
      tiende lid genoemde veilig beschikbare landsgrensoverschrijdende transportcapaciteit, kan de netbeheerder van het
      landelijk hoogspanningsnet de in het negende of tiende lid bedoelde veilig beschikbare landsgrensoverschrijdende
      transportcapaciteit overeenkomstig het verzoek aanpassen. Daarbij stelt de netbeheerder van het landelijk
      hoogspanningsnet vast in hoeverre dit verzoek tot een aanpassing van de transportcapaciteit van andere
      landsgrensoverschrijdende verbindingen leidt en past hij de veilig beschikbare landsgrensoverschrijdende
      transportcapaciteit dienovereenkomstig aan.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel12.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel12.20
