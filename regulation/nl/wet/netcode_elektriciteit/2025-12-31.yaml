  - number: '11.5'
    text: |-
      1 Een vergunninghouder meldt, voor het geval hem, op grond van
      [artikel 2, zesde lid, van het Besluit leveringszekerheid Elektriciteitswet 1998][ref1], de levering aan
      kleinverbruikers wordt toegewezen, aan de netbeheerder van het landelijk hoogspanningsnet welke BRP voor de
      desbetreffende kleinverbruikers balanceringsverantwoordelijke dient te worden.

      2 De verwerkingstermijn van een melding als bedoeld in het eerste lid, bedraagt maximaal twee weken.

      3 Indien op grond van [artikel 2, zesde lid, van het Besluit leveringszekerheid Elektriciteitswet 1998][ref2] de
      leverancier van groepen kleinverbruikers wijzigt, zorgt de netbeheerder die het aangaat ervoor dat de wisseling van
      leverancier binnen één werkdag in het aansluitingenregister is verwerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0019567#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0019567#Artikel2
