  - number: '9.32'
    text: |-
      1 De netbeheerders verlenen gezamenlijk aan een natuurlijk persoon, rechtspersoon of vennootschap, niet zijnde een
      netbeheerder, op aanvraag een erkenning als CSP. Een natuurlijke persoon, rechtspersoon dan wel vennootschap kan
      slechts voor één erkenning als CSP in aanmerking komen.

      2 De netbeheerder van het landelijk hoogspanningsnet beheert een register waarin de in het eerste lid bedoelde
      erkenningen worden geregistreerd.

      3 De CSP heeft het recht om congestiemanagementdiensten aan te bieden:

      a. namens een aangeslotene die beschikt over een elektriciteitsproductie-eenheid met een maximumcapaciteit groter
      dan of gelijk aan 1 MW, een elektriciteitsopslageenheid met een capaciteit groter dan of gelijk aan 1 MW of een
      verbruiksinstallatie met een capaciteit groter dan of gelijk aan 1 MW;

      b. in het geval van een bieding redispatch overeenkomstig [bijlage 11][ref1], namens een groep van één of meer
      aangeslotenen die beschikken over een elektriciteitsproductie-eenheid met een maximumcapaciteit kleiner dan 1 MW,
      een elektriciteitsopslageenheid met een capaciteit kleiner dan 1 MW of een verbruiksinstallatie met een capaciteit
      kleiner dan 1 MW;

      b1. in het geval van een capaciteitssturing overeenkomstig [bijlage 12][ref2], namens een groep van één of meer
      aangeslotenen die beschikken over een elektriciteitsproductie-eenheid, een elektriciteitsopslageenheid of een
      verbruiksinstallatie; en

      c. op grond van compensatiehandel, als bedoeld in artikel 2, lid 27, van [Verordening (EU) 2019/943](32843R2019).

      4 De aanvraag voor een erkenning als CSP wordt schriftelijk en ondertekend door een bevoegd persoon ingediend
      bij de netbeheerder van het landelijk hoogspanningsnet volgens een door de netbeheerders gezamenlijk uit te geven
      model.

      5 Een erkenning als CSP wordt verleend nadat:

      a. de aanvrager met succes het pre-kwalificatieproces voor het leveren van ten minste één product op grond van
      [bijlagen 11][ref3] en [12][ref4] heeft afgerond; en

      b. de netbeheerder zich ervan heeft vergewist dat de aanvrager beschikt over de deskundigheid en over de
      technische, administratieve en organisatorische faciliteiten die vereist zijn om als CSP te kunnen optreden.

      6 De netbeheerders stellen gezamenlijk de criteria op voor de vereisten als bedoeld in het vijfde lid, onderdeel b.
      Deze criteria worden gepubliceerd op de in [artikel 9.8][ref5] bedoelde website.

      7 De netbeheerders stellen pre-kwalificatiecriteria op voor elk van de op grond van [bijlagen 11][ref6] en
      [12][ref7] te leveren producten.

      8 Een erkenning als CSP wordt ingetrokken wanneer een CSP zijn verplichtingen jegens een of meer netbeheerders niet
      nakomt, nadat de netbeheerder de CSP hierop heeft geattendeerd en de CSP in staat is gesteld om alsnog te voldoen
      aan de verplichtingen als bedoeld in het zesde lid.

      9 De netbeheerders stellen gezamenlijk de omstandigheden, criteria en procedures op die leiden tot de
      intrekking van een erkenning als CSP. Deze omstandigheden, criteria en procedures worden gepubliceerd op de in
      [artikel 9.8][ref8] bedoelde website.


