  - number: '9.38'
    text: |-
      Indien de netbeheerder vermoedt dat één of meer bij het biedproces betrokken aangeslotenen of CSP’s uitzonderlijk
      afwijkende biedingen overeenkomstig de specificaties [bijlage 11][ref1] doen waardoor het biedproces als bedoeld in
      [artikel 9.41][ref2] mogelijk ondoelmatig verloopt, meldt de netbeheerder dit vermoeden aan de Autoriteit Consument
      en Markt.


      [ref1]: https://wetten.overheid.nl/BWBR0037940
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.41
