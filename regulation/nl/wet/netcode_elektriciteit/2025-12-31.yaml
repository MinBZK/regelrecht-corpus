  - number: '9.6'
    text: |-
      1 Indien bij een verzoek om het doen van een aanbod voor het uitvoeren van transport, als bedoeld in
      [artikel 24, eerste lid, van de Elektriciteitswet 1998][ref1], de gevraagde transportcapaciteit de beschikbare
      transportcapaciteit als bedoeld in [artikel 9.5, vierde lid][ref2], overschrijdt, onderzoekt de netbeheerder de
      mogelijkheden om op korte termijn de gevraagde transportcapaciteit en beschikbare transportcapaciteit met elkaar in
      overeenstemming te brengen. De netbeheerder onderzoekt daartoe:

      a. de mogelijkheid om de gevraagde transportcapaciteit te verlagen;

      b. de mogelijkheid om door middel van technische maatregelen anders dan netverzwaring de beschikbare
      transportcapaciteit te vergroten;

      c. de mogelijkheid overeenkomstig [artikel 9.1, eerste lid][ref3], het optreden van fysieke congestie op te lossen;

      d. volgens de procedure van de [artikelen 9.9 tot en met 9.11][ref4], de mogelijkheid om congestiemanagement
      overeenkomstig paragraaf 9.9 en [9.10][ref5] toe te passen;

      e. in het geval van de netbeheerder van het landelijk hoogspanningsnet, de mogelijkheid om overeenkomstig
      [artikel 9.1, tweede en derde lid][ref6], het optreden van fysieke congestie op te lossen.

      2 Indien uit het onderzoek als bedoeld in het eerste lid blijkt dat het met één of meer van de genoemde
      mogelijkheden lukt de gevraagde transportcapaciteit in overeenstemming te brengen met de beschikbare
      transportcapaciteit, voert de netbeheerder dit zo snel mogelijk uit.

      3 Indien uit het onderzoek als bedoeld in het eerste lid blijkt dat er geen of onvoldoende mogelijkheid is
      om de gevraagde transportcapaciteit en de beschikbare transportcapaciteit met elkaar in overeenstemming te
      brengen, is de netbeheerder niet verplicht een aanbod te doen voor het uitvoeren van transport als bedoeld in
      [artikel 24, eerste lid, van de Elektriciteitswet 1998][ref7]. De aanvrager krijgt in dat geval de mogelijkheid
      om zijn verzoek zo spoedig mogelijk, doch uiterlijk binnen vijf werkdagen, zodanig aan te passen dat de gevraagde
      transportcapaciteit kleiner wordt dan, of gelijk wordt aan de, beschikbare transportcapaciteit, met inachtneming
      van het eerste lid.

      4 De netbeheerder motiveert schriftelijk aan de verzoeker dat hij geen aanbod doet voor het uitvoeren van
      transport.


