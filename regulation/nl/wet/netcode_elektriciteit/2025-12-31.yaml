  - number: '9.46'
    text: |-
      1 Indien een aangeslotene drie keer de opdracht van de netbeheerder overeenkomstig
      [artikel 9.45, vijfde lid][ref1], niet nakomt, is de netbeheerder gerechtigd de aansluiting fysiek aan te passen
      teneinde de capaciteit van de aansluiting in overeenstemming te brengen met de capaciteit die ten maximale
      toegestaan kan worden teneinde de operationele veiligheidsgrenzen te waarborgen.

      2 De in het eerste lid bedoelde aanpassing wordt bij het beëindigen van congestiemanagement, als bedoeld in
      [artikel 9.34, tweede lid][ref2], ongedaan gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.45
