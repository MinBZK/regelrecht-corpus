  - number: '12.11'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet zendt de Autoriteit Consument en Markt elk jaar voor
      1 februari een verslag van de verdeling van de transportcapaciteit gedurende het vorige jaar.

      2 In het in het eerste lid genoemde verslag geeft de netbeheerder van het landelijk hoogspanningsnet zijn visie
      op de continuering van de toewijzing van transportcapaciteit op de landsgrensoverschrijdende verbindingen via
      toewijzing dan wel een andere marktconforme methode, waarbij hij tevens ingaat op de ervaringen van marktpartijen
      met de toewijzing. Tevens geeft de netbeheerder van het landelijk hoogspanningsnet in het verslag de totale
      congestie-ontvangsten aan en de wijze waarop deze congestie-ontvangsten zijn verdeeld, bestemd en eventueel reeds
      besteed.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel12.11
  - number: '12.12'
    text: |-
      1 Het doel van de impliciete toewijzing is de efficiënte allocatie van de landsgrensoverschrijdende
      transportcapaciteit voor day-aheadtransporten, die wordt uitgevoerd door middel van een prijskoppelingsalgoritme
      voor de verbindingen binnen de regio waarvan de day-aheadmarkten gekoppeld zijn, hierna aan te duiden als de
      ‘Prijskoppeling-regio’.

      2 Voor de uitvoering van de impliciete toewijzing werkt de netbeheerder van het landelijk hoogspanningsnet samen
      met zowel de netbeheerders van de landelijke hoogspanningsnetten als de elektriciteitsbeurzen van alle landen
      binnen de Prijskoppeling-regio, zodanig dat de beschikbare landsgrensoverschrijdende transportcapaciteit voor day-
      ahead-transporten tussen Nederland en Duitsland, Nederland en België, Nederland en Noorwegen, en Nederland en
      Denemarken via de elektriciteitsbeurzen aan de markt ter beschikking worden gesteld.

      3 Een marktpartij kan deelnemen aan de impliciete veiling bij een NEMO.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel12.12
  - number: '12.13'
    text: |-
      1

      2 De marktpartijen hebben tot 12:00 uur op de dag voorafgaande aan het transport de mogelijkheid vraag- en
      aanbodorders van elektriciteit aan de day-aheadmarkt aan te bieden.

      3 Op basis van de geaggregeerde vraag- en aanbodcurves, de vastgestelde blokbiedingen, en de beschikbare
      grensoverschrijdende capaciteit voor day-aheadtransporten worden voor elk marktgebied van de Prijskoppeling-regio
      de netto positie, de day-ahead-clearingprijs en de geaccepteerde blokbiedingen bepaald, waarbij rekening wordt
      gehouden met de noodzakelijke beperkingen in de veranderingen in de elektriciteitsstromen.

      4 Voor de verbinding Eemshaven-Noorwegen houdt de in het derde lid beschreven procedure tevens rekening met
      de marginale kosten van de energie voor compensatie van de kabelverliezen, voor zover die aan de markt te
      relateren zijn, door te rekenen met de netto congestie-ontvangsten (congestie-ontvangsten minus de kosten voor
      kabelverliezen).

      5 De NEMO's maken dagelijks uiterlijk om 13:00 uur de marktprijs en verhandelde volumes op uurbasis voor de
      volgende dag bekend.

      6 Overeenkomstig de marktregels van de betrokken day-aheadmarkten kan het gestelde in het derde lid opnieuw worden
      uitgevoerd. In dat geval worden marktpartijen eerst in de gelegenheid gesteld om hun biedingen bij een NEMO aan
      te passen.

      7 Indien de berekening als bedoeld in het derde lid vertraging oploopt, of indien het zesde lid toegepast wordt,
      kan de publicatie van de marktprijzen en de verhandelde volumes, als bedoeld in het vijfde lid, uitgesteld worden
      tot uiterlijk 14:45 uur.

      8 De netbeheerder van het landelijk hoogspanningsnet informeert de marktpartijen tijdig over toepassing van het
      zevende lid. Daarbij informeert de netbeheerder van het landelijk hoogspanningsnet de marktpartijen ook over het
      tijdstip tot wanneer bieders de energieprogramma's als bedoeld in [artikel 10.11, derde lid][ref1] en [10.12][ref2]
      kunnen indienen. Dit tijdstip ligt in ieder geval niet later dan 15:30 uur.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.11
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel10.12
