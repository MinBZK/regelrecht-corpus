  - number: '10.15'
    text: |-
      1 Een meetverantwoordelijke rapporteert, uiterlijk 20 werkdagen na het einde van de kalendermaand, aan de
      netbeheerder van het landelijk hoogspanningsnet een maandelijks overzicht met daarin:

      a. Het aantal aansluitingen dat op enig moment in de desbetreffende maand telemetriegrootverbruikaansluiting is
      geweest;

      b. De met het net uitgewisselde hoeveelheid energie, die is verwerkt in de dagelijkse berichten met meetgegevens
      overeenkomstig [artikel 6.2.2.3 van de Informatiecode elektriciteit en gas][ref1];

      c. De met het net uitgewisselde hoeveelheid energie, die is verwerkt in de maandelijkse berichten met meetgegevens;

      d. Voor aansluitingen waar een afwijking is geconstateerd:

      1° Het aantal aansluitingen

      2° De met het net uitgewisselde hoeveelheid energie, die is verwerkt in de dagelijkse berichten met meetgegevens
      overeenkomstig [artikel 6.2.2.2 van de Informatiecode elektriciteit en gas][ref2];

      3° De met het net uitgewisselde hoeveelheid energie, die is verwerkt in de maandelijkse berichten met meetgegevens
      overeenkomstig [artikel 6.2.2.6 van de Informatiecode elektriciteit en gas][ref3];

      4° Het aantal aansluitingen met een aansluitcapaciteit groter dan 1 MVA waarvoor aan de meetgegevens op grond van
      [artikel 6.2.2.2 van de Informatiecode elektriciteit en gas][ref4] in de dagelijkse berichten met meetgegevens een
      andere status is gegeven dan ‘gemeten en gevalideerd’;

      e. Het aantal gebeurtenissen, dat een meetverantwoordelijke aan de aangeslotene, netbeheerder, BRP of leverancier
      kenbaar heeft gemaakt, overeenkomstig [artikel 6.2.3.1 van de Informatiecode elektriciteit en gas][ref5];

      f. Het aantal gebeurtenissen, dat een meetverantwoordelijke aan de aangeslotene, netbeheerder, BRP of leverancier
      kenbaar heeft gemaakt, overeenkomstig [artikel 6.2.4.1 van de Informatiecode elektriciteit en gas](onbekend).

      2 De netbeheerder van het landelijk hoogspanningsnet publiceert maandelijks de gecumuleerde landelijke gegevens
      zoals deze op basis van het eerste lid gerapporteerd zijn.

      3 Voor de in het eerste lid beschreven rapportage gebruikt de meetverantwoordelijke het format dat door de
      netbeheerder van het landelijk hoogspanningsnet, na overleg met de meetverantwoordelijke, is verstrekt.


