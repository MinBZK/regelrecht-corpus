  - number: '10.9'
    text: |-
      1 Een BRP oefent balanceringsverantwoordelijkheid uit voor de aansluitingen waarvoor hij in het
      aansluitingenregister op enig moment als BRP is vermeld.

      2 Ten aanzien van de verplichting van een BRP om met betrekking tot een aansluiting
      balanceringsverantwoordelijkheid uit te oefenen, mag de netbeheerder van het landelijk hoogspanningsnet afgaan op
      hetgeen in het aansluitingenregister omtrent de balanceringsverantwoordelijkheid voor die aansluiting is vermeld,
      onverminderd het recht van die BRP op correctie van een onjuiste vermelding en onverminderd zijn aanspraak jegens
      de desbetreffende netbeheerder tot vergoeding van de kosten die door een aan die netbeheerder toe te rekenen
      onjuiste vermelding zijn veroorzaakt.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel10.9
  - number: '10.10'
    text: |-
      1 De erkenning van een BRP wordt ingetrokken met ingang van de datum waarop de netbeheerder van het landelijke
      hoogspanningsnet hiertoe besluit overeenkomstig [artikel 10.35, eerste en tweede lid][ref1], rekening houdend met
      een eventueel besluit tot opschorting overeenkomstig [artikel 11.1, tweede lid][ref2], ongeacht of de betreffende
      BRP op die datum is uitgeschreven uit het BRP-register en de intrekking van zijn erkenning is gepubliceerd, een en
      ander als bedoeld in het tweede en derde lid.

      2 Wanneer de erkenning van een BRP is ingetrokken of de intrekking van de erkenning is opgeschort, stelt de
      netbeheerder van het landelijk hoogspanningsnet de andere netbeheerders en BRP’s daarvan onverwijld in kennis en
      verwerkt hij dit in het BRP-register voor de desbetreffende BRP.

      3 De netbeheerder van het landelijk hoogspanningsnet publiceert de intrekking van een erkenning van een BRP zo
      spoedig mogelijk in de Staatscourant, onder vermelding van naam, adres en woonplaats van de betrokken natuurlijke
      of rechtspersoon alsmede van de datum waarop de erkenning is ingetrokken en van de datum waarop de BRP uit het BRP-
      register is uitgeschreven.


