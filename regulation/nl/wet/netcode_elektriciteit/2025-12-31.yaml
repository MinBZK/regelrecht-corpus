  - number: '9.13'
    text: |-
      De in [artikel 3.13, zesde lid,][ref1] en [artikel 3.17, eerste lid][ref2], bedoelde extra apparatuur waarmee het
      werkzaam uitgangsvermogen van een elektriciteitsproductie-eenheid op afstand te sturen is, kan worden toegepast
      voor het op afstand sturen van het werkzaam uitgangsvermogen van een elektriciteitsproductie-eenheid voor
      andere doeleinden dan frequentiestabiliteit. Voor zover die toepassing niet al in deze code is bepaald, maken de
      netbeheerder en de aangeslotene afspraken over de specifieke toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.13
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel3.17
