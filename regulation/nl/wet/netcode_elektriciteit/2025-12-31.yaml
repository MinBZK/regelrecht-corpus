  - number: '6.29'
    text: |-
      1 De tijdsduur van de bedrijfsperiode voor spanningen tussen 1,10 pu en 1,118 pu in netten met nominale spanning
      tussen 110 kV (inclusief) en 300 kV (exclusief), als bedoeld in artikel 40, eerste lid, onderdeel a, van de
      Verordening (EU) 2016/1447 (NC HVDC), is onbeperkt.

      2 De tijdsduur van de bedrijfsperiode voor spanningen tussen 1,118 pu en 1,15 pu in netten met nominale spanning
      tussen 110 kV (inclusief) en 300 kV (exclusief), als bedoeld in artikel 40, eerste lid, onderdeel a, van de
      Verordening (EU) 2016/1447 (NC HVDC), is 30 minuten.

      3 Voor DC-aangesloten power park modules op een net waarvan de 1 pu-referentie-AC-spanning kleiner is dan 110 kV
      gelden dezelfde eisen als voor DC-aangesloten power park modules op een net waarvan de 1 pu-referentie-AC-spanning
      gelijk is aan 110 kV.

      4 De DC-aangesloten power park module, aangesloten op een wisselstroomnet met een spanningsniveau lager dan 300 kV,
      is in staat bij variërende spanning maximaal een hoeveelheid blindvermogen te leveren dat gekenschetst wordt door
      een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 40, tweede lid, van de Verordening
      (EU) 2016/1447 (NC HVDC):

      a. gelijk aan 0,14 bij een spanning van 0,9 pu tot 1,05 pu;

      b. gelijk aan 0,0 bij een spanning gelijk aan 1,1 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,14 en 0,0 bij een spanning tussen 1,05 pu
      en 1,1 pu.

      5 De DC-aangesloten power park module, aangesloten op een wisselstroomnet met een spanningsniveau lager dan 300 kV,
      is in staat bij variërende spanning maximaal een hoeveelheid blindvermogen op te nemen dat gekenschetst wordt door
      een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 40, tweede lid, van de Verordening
      (EU) 2016/1447 (NC HVDC):

      a. gelijk aan 0,14 bij een spanning van 0,95 pu tot 1,1 pu;

      b. gelijk aan 0,0 bij een spanning gelijk aan 0,9 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,0 en 0,14 bij een spanning tussen 0,9 pu en
      0,95 pu.

      6 De DC-aangesloten power park module, aangesloten op een hoogspanningsnet met een spanningsniveau lager dan
      300 kV, is op grond van het vierde en het vijfde lid in staat blindvermogen te leveren of op te nemen binnen en
      inclusief de grenzen van het rood gemarkeerde profiel in onderstaand U-Q/P-diagram, als bedoeld in figuur 7 van
      bijlage VII bij artikel 40, tweede lid, van de Verordening (EU) 2016/1447 (NC HVDC).

      7 Indien dat vereist is voor de spanningsstabiliteit komt de netbeheerder van het net op zee, in overleg met de
      netbeheerder van het landelijk hoogspanningsnet met de aangeslotene die beschikt over een DC-aangesloten power park
      module een profiel overeen met een groter blindvermogensbereik dan het gespecificeerde profiel in het zesde lid en
      legt dit vast in de aansluit- en transportovereenkomst.

      8 De bijdrage van blindvermogen krijgt prioriteit, overeenkomstig artikel 40, derde lid, van de Verordening (EU)
      2016/1447 (NC HVDC), boven de bijdrage van werkzaam vermogen tijdens bedrijfsvoering bij lage of hoge spanning en
      bij storingen waarvoor fault-ride-through capaciteit vereist is.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.29
