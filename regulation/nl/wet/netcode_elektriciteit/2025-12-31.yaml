  - number: '10.26'
    text: |-
      1 De BRP kan bij controle op grond van het tweede en vijfde lid gebruik maken van de gegevens die hij ingevolge
      [artikel 10.25, tweede tot en met vijfde lid][ref1], van de netbeheerder heeft ontvangen.

      2 De BRP controleert voor de meetgegevens per aansluiting die hij op grond van [artikel 10.18, vierde lid][ref2],
      en [10.19, vierde lid][ref3], van de netbeheerders ontvangen heeft of de netbeheerder de volumes heeft toegerekend
      overeenkomstig de gegevens in zijn aansluitingenregister.

      3 Indien uit de controle in het tweede lid blijkt dat deze niet voldoet, dient de BRP een herzieningsverzoek in
      bij de desbetreffende netbeheerder. Daarbij wordt aangegeven om welk van de volgende redenen de meetgegevens zijn
      afgekeurd:

      a. de meetgegevens werden verwacht, maar zijn niet ontvangen;

      b. de meetgegevens zijn ontvangen, maar werden niet verwacht.

      4

      5 De BRP kan tot 16:00 uur van de dag waarop hij op grond van [artikel 10.20, derde lid][ref4], meetgegevens heeft
      ontvangen bij de desbetreffende netbeheerder reclameren over deze meetgegevens.


