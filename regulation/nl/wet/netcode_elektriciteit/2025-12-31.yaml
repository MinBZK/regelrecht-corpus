  - number: '3.3'
    text: |-
      1 Indien een aangeslotene beschikt over meer dan één aansluiting en die aangeslotene een verzoek doet als bedoeld
      in [artikel 16, eerste lid, onderdeel h, van de Elektriciteitswet 1998][ref1], wordt, indien van toepassing, per
      aansluiting een verzoek ingediend.

      2

      3 De netbeheerder die een verzoek ontvangt als bedoeld in
      [artikel 16, eerste lid, onderdeel h, van de Elektriciteitswet 1998][ref2]:

      a. stelt vast of de aanwezige elektriciteitsproductie-installatie geschikt is om elektriciteit als bedoeld in
      [artikel 73, eerste lid, van de Elektriciteitswet 1998][ref3] te produceren;

      b. stelt vast of een geschikte meetinrichting aanwezig is;

      c. meldt of het verzoek als bedoeld in [artikel 16, eerste lid, onderdeel h, van de Elektriciteitswet 1998][ref4]
      is gehonoreerd;

      d. muteert het aansluitingenregister indien de in het tweede lid bedoelde aangeslotene op zijn net is aangesloten.

      4 Het onderzoek door de netbeheerder, als bedoeld in het derde lid, onderdeel a, omvat het volgende:

      a. De netbeheerder onderzoekt de volledigheid en de consistentie van het ingediende verzoek;

      b. De netbeheerder toetst de inhoud van het verzoek aan de hand van de gegevens zoals die aanwezig zijn in
      archieven of systemen van de netbeheerder.

      5 Indien de in het vierde lid, onderdeel b, bedoelde toets onvoldoende zekerheid geeft over de juistheid van de
      gegevens uit het verzoek, vraagt de netbeheerder aanvullende informatie over de elektriciteitsproductie-installatie
      op, aan de hand waarvan de bedoelde toets alsnog kan plaatsvinden, bijvoorbeeld:

      a. gemeentelijke vergunning;

      b. rekeningen van de aflevering/plaatsing of het onderhoud van/aan de installatie.

      6 Indien ook de in het vijfde lid bedoelde informatie onvoldoende zekerheid geeft over de juistheid van de gegevens
      uit het verzoek, stelt de netbeheerder een aanvullend onderzoek in. De netbeheerder gaat pas over tot het instellen
      van dit aanvullend onderzoek na de in het tweede lid bedoelde aangeslotene hierover geïnformeerd te hebben en van
      hem vernomen te hebben dat hij zijn verzoek handhaaft.

      7 In geval van zon/wind/water bestaat het aanvullende onderzoek als bedoeld in het zesde lid uit het zich ter
      plekke vergewissen van de aanwezigheid en de aansluitwijze van de bedoelde installatie.

      8 In geval van biomassa kan tevens aanvullend technisch onderzoek door een externe, onafhankelijke technische
      deskundige worden uitgevoerd.

      9 Het aanvullende onderzoek als bedoeld in het zesde lid zal plaatsvinden binnen drie weken nadat de netbeheerder
      overeenkomstig het zesde lid heeft vernomen dat de aangeslotene zijn verzoek handhaaft.

      10 Indien het aanvullende onderzoek niet binnen drie weken kan plaatsvinden, ontvangt de desbetreffende in het
      tweede lid bedoelde aangeslotene binnen vijf werkdagen nadat de netbeheerder overeenkomstig het zesde lid heeft
      vernomen dat de aangeslotene zijn verzoek handhaaft, bericht binnen welke termijn het aanvullende onderzoek zal
      plaatsvinden.

      11 De kosten voor het in het zesde tot en met het tiende lid bedoelde aanvullende onderzoek zijn niet voor rekening
      van de in het tweede lid bedoelde aangeslotene, indien de netbeheerder het in het vierde en vijfde lid beschreven
      traject niet heeft doorlopen.


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16
      [ref3]: https://wetten.overheid.nl/BWBR0009755#Artikel73
      [ref4]: https://wetten.overheid.nl/BWBR0009755#Artikel16
