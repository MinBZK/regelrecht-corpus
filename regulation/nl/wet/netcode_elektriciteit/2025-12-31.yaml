  - number: '10.39'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet activeert en deactiveert biedingen voor aFRR automatisch om de
      FRCE binnen de frequentiehersteltijd tot nul te regelen en om de geactiveerde FCR progressief te vervangen.

      2 De netbeheerder van het landelijk hoogspanningsnet activeert biedingen voor noodvermogen om geactiveerde
      biedingen aFRR beschikbaar te maken in het geval dat de inzet van het aanbod van biedingen aFRR verzadigt.

      3 De netbeheerder van het landelijk hoogspanningsnet activeert biedingen voor het MARI-product:

      a. om te voldoen aan een activatieverzoek afkomstig van het MARI-platform; of

      b. in niet-normale systeemtoestand bij verzadiging van het aanbod van biedingen noodvermogen en aFRR.

      4 De netbeheerder van het landelijk hoogspanningsnet activeert een bieding balanceringsenergie door een
      vermogensrichtwaarde uit te sturen aan een BSP. Hierdoor is de netbeheerder van het landelijk hoogspanningsnet
      gehouden tot:

      a. het bepalen van het volume dat de BSP gedurende de betreffende onbalansverrekeningsperiode levert;

      b. het verrekenen van het in onderdeel a bedoelde volume met de BSP;

      c. het aanpassen van de onbalans van de relevante BRP’s voor de geactiveerde aansluiting(en) met de
      onbalansaanpassing, als bedoeld in [artikel 10.25, zevende lid, onderdeel a][ref1], bestaande uit de som van alle
      aan hem toegerekende volumes bepaald op grond van het zesde lid.

      5 De netbeheerder van het landelijk hoogspanningsnet stelt de BSP en de bij de balanceringsenergiebieding
      aangewezen BRP's op de hoogte van activering van de bieding.

      6 Om het volume aan balanceringsenergie dat met de BSP moet worden verrekend te bepalen, stelt de netbeheerder
      van het landelijk hoogspanningsnet per BSP vast hoeveel balanceringsenergie per onbalansverrekeningsperiode per
      richting is geactiveerd. Daartoe berekent hij de volgende volumes afzonderlijk:

      a. voor een bieding aFRR: de som van de vermogensrichtwaardes die de BSP aan zijn gecontracteerde aansluiting(en)
      per onbalansverrekeningsperiode heeft toegekend;

      b.

      c. voor noodvermogen: het verschil tussen door de BSP geleverde energie op basis van gemeten 5-minutenwaarden
      gedurende de volledige activeringstijd, leveringsperiode en deactiveringsperiode, en de waarde van de energie die
      BSP uitwisselt op het leveringspunt in de 5-minutenperiode onmiddellijk voorafgaand aan de 5-minutenperiode waarin
      de afroep plaats vindt;

      d. voor het MARI-product bij geplande activering: de hoeveelheid kWh die overeenkomt met de levering van het
      gevraagde vermogen gedurende 15 minuten in de geldigheidsperiode van de bieding;

      e. voor het MARI-product bij directe activering: de hoeveelheid kWh die overeenkomt met de levering van het
      gevraagde vermogen gedurende 15 minuten in de onbalansverrekeningsperiode volgend op de geldigheidsperiode van de
      bieding, en de hoeveelheid kWh die overeenkomt met het gevraagde vermogen gedurende een periode die loopt van het
      begin van de ramping periode tot 5 minuten voor het einde van de geldigheidsperiode van de bieding.

      7 De netbeheerder van het landelijk hoogspanningsnet verrekent het per BSP bepaalde volume aan balanceringsenergie
      per onbalansverrekeningsperiode per richting:

      a. voor opregelen met de prijs voor opregelen voor aFRR of noodvermogen of inzet van het MARI-product
      overeenkomstig het derde lid, onderdeel b;

      b. voor afregelen met de prijs voor afregelen voor aFRR of noodvermogen of inzet van het MARI-product
      overeenkomstig het derde lid, onderdeel b;

      c. voor inzet van het MARI-product overeenkomstig het derde, lid, onderdeel a, bij scheduled activation met de
      prijs afkomstig van het MARI-platform;

      d. voor inzet van het MARI-product overeenkomstig het derde lid, onderdeel a, bij direct activation, voor de
      volumes toegekend aan de geldigheidsperiode van de bieding met de prijs afkomstig van het Europees platform voor de
      uitwisseling van balanceringsenergie uit mFRR;

      e. voor inzet van het MARI-product overeenkomstig het derde lid, onderdeel a, bij direct activation, voor
      opregelen, voor de volumes toegekend aan de onbalansverrekeningsperiode volgend op de geldigheidsperiode van de
      bieding met de prijs afkomstig van het MARI-platform of, als deze beschikbaar en hoger is, met de biedprijs van de
      technisch gelinkte bieding voor de betreffende onbalansverrekeningsperiode;

      f. voor inzet van het MARI-product overeenkomstig het derde lid, onderdeel a, bij direct activation, voor
      afregelen, voor de volumes toegekend aan de onbalansverrekeningsperiode volgend op de geldigheidsperiode van de
      bieding met de prijs afkomstig van het MARI-platform of, als deze beschikbaar en lager is, met de biedprijs van de
      technisch gelinkte bieding voor de betreffende onbalansverrekeningsperiode.

      8 Indien er voor een onbalansverrekeningsperiode geen prijs voor opregelen of prijs voor afregelen is
      vastgesteld, verrekent de netbeheerder van het landelijk hoogspanningsnet het per BSP bepaalde volume in die
      onbalansverrekeningsperiode met de prijs voor opregelen, respectievelijk de prijs van afregelen vastgesteld voor de
      voorgaande onbalansverrekeningsperiode.

      9 Indien er tijdens een onbalansverrekeningsperiode noodvermogen voor opregelen is ingezet is de prijs voor ingezet
      noodvermogen:

      a. tijdens de volledige activeringstijd en de leveringsperiode gelijk aan de hoogste biedprijs van het ingezette
      regelvermogen voor opregelen voor de betreffende onbalansverekeningsperiode vermeerderd met 10% dan wel de day-
      ahead-clearingprijs voor het betreffende klokuur plus € 200 per MWh indien deze hoger is;

      b. tijdens de deactiveringsperiode gelijk aan de inzetprijs voor opregelen voor de betreffende
      onbalansverekeningsperiode dan wel de day-ahead-clearingprijs voor het betreffende klokuur vermeerderd met € 200
      per MWh indien deze hoger is;

      c. minimaal € 200 per MWh.

      10 Indien er tijdens een onbalansverrekeningsperiode noodvermogen voor afregelen is ingezet is de prijs voor
      ingezet noodvermogen:

      a. tijden s de volledige activeringstijd en de leveringsperiode gelijk aan de laagste biedprijs van het ingezette
      regelvermogen voor afregelen voor de betreffende onbalansverekeningsperiode verminderd met € 100 per MWh dan wel de
      day-ahead-clearingprijs voor het betreffende klokuur verminderd met € 250 per MWh indien deze lager is;

      b. tijdens de deactiveringsperiode gelijk aan de inzetprijs voor afregelen voor de betreffende
      onbalansverekeningsperiode dan wel de day-ahead-clearingprijs voor het betreffende klokuur verminderd met € 250 per
      MWh indien deze lager is;

      c. gelijk aan € 0 per MWh indien de afzonderlijke prijscomponenten in lid a en b beide positief zijn.


