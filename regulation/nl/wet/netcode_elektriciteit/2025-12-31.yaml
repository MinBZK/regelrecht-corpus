        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '4.6'
    text: |-
      In de aansluit- en transportovereenkomst worden concepten en instellingen van de verschillende regelingen van de
      verbruiksinstallatie die van belang zijn voor de systeemveiligheid, als bedoeld in artikel 17, eerste lid, van de
      Verordening (EU) 2016/1388 (NC DCC), vastgelegd.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.6
  - number: '4.7'
    text: |-
      1 Verbruiksinstallaties aangesloten op het landelijk hoogspanningsnet beschikken over de mogelijkheid tot
      automatische belastingafschakeling bij lage frequentie, als bedoeld in artikel 19 van de Verordening (EU) 2016/1388
      (NC DCC), op de wijze zoals gespecificeerd door de netbeheerder van het landelijk hoogspanningsnet op grond van de
      Verordening (EU) 2017/2196 (NC ER).

      2 Het ontkoppelsignaal voor automatische belastingafschakeling als bedoeld in artikel 19, eerste lid, onderdeel a,
      van de Verordening (EU) 2016/1388 (NC DCC), wordt gespecificeerd op basis van lage frequentie.

      3 In de aansluit- en transportovereenkomst worden de functionele mogelijkheden voor het blokkeren van de
      trappenschakelaar bij lage spanning, als bedoeld in artikel 19, derde lid, van de Verordening (EU) 2016/1388 (NC
      DCC), opgenomen.

      4 In de aansluit- en transportovereenkomst worden de instellingen van synchronisatieapparaten, als bedoeld in
      artikel 19, vierde lid, onderdeel b, van de Verordening (EU) 2016/1388 (NC DCC), vastgelegd.

      5 In de aansluit- en transportovereenkomst worden de ontkoppelapparatuur en de vereiste tijd voor ontkoppeling
      op afstand, als bedoeld in artikel 19, vierde lid, onderdeel c, van de Verordening (EU) 2016/1388 (NC DCC),
      vastgelegd.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.7
  - number: '4.9'
    text: |-
      1 De tijdsperiode waarbinnen de vermogensaanpassing, na instructie door de regionale netbeheerder of de
      netbeheerder van het landelijk hoogspanningsnet, wordt aangepast, als bedoeld in artikel 28, tweede lid, onderdeel
      f, van de Verordening (EU) 2016/1388 (NC DCC), wordt vastgelegd in de overeenkomst met de aangeslotene of met de
      partij die vraagsturing aanbiedt namens verbruikseenheden gezamenlijk als onderdeel van een aggregatie.

      2 De bijzonderheden van de kennisgeving waarmee de aanpassing van de capaciteit van de vraagsturing wordt
      medegedeeld, als bedoeld in artikel 28, tweede lid, onderdeel i, van de Verordening (EU) 2016/1388 (NC DCC),
      worden vastgelegd in de overeenkomst met de aangeslotene of met de partij die vraagsturing aanbiedt namens
      verbruikseenheden gezamenlijk als onderdeel van een aggregatie.

      3 De maximale waarde van de frequentiegradiënt waarbij niet van het net mag worden ontkoppeld, als bedoeld in
      artikel 28, tweede lid, onderdeel k, van de Verordening (EU) 2016/1388 (NC DCC), is: 2 Hz/s.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.9
  - number: '4.10'
    text: |-
      1 De bandbreedte van de dode band, als bedoeld in artikel 29, tweede lid, onderdeel d, van de [Verordening (EU)
      2016/1388](33288R2016) (NC DCC), is 0,2 Hz hoger en lager ten opzichte van de nominale systeemfrequentie. In
      afwijking hiervan is de bandbreedte van de dode band voor een vraagsturing leverende verbruikseenheid 0 Hz, indien
      een aangeslotene, of een BSP met de netbeheerder van het landelijk hoogspanningsnet contractuele afspraken heeft
      gemaakt over het leveren van FCR door middel van de desbetreffende verbruikseenheid.

      2 De maximale frequentie-afwijking van de nominale waarde van 50,0 Hz, als bedoeld in artikel 29, tweede lid,
      onderdeel e, van de Verordening (EU) 2016/1388 (NC DCC), is 1,0 Hz voor frequenties lager dan 50,0 Hz en 1,5 Hz
      voor frequenties hoger dan 50,0 Hz.

      3 De snelle respons, als bedoeld in artikel 29, tweede lid, onderdeel g, van de Verordening (EU) 2016/1388 (NC
      DCC), is 0,5 s.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.10
  - number: '5.1'
    text: |-
      1 In aanvulling op de voorwaarden in de [paragrafen 2.1][ref1], [2.3][ref2] en [2.5][ref3] gelden voor een
      aansluiting van een distributienet op een ander net de voorwaarden van deze paragraaf.

      2 De voorwaarden in [paragraaf 4.1][ref4], met uitzondering van [artikelen 4.4][ref5] en [4.5][ref6], zijn van
      overeenkomstige toepassing op distributienetten, als bedoeld in artikel 2, zevende lid, van de Verordening (EU)
      2016/1388 (NC DCC).


