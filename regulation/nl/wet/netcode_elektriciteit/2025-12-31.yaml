  - number: 9.1h
    text: |-
      1 Indien een aangeslotene niet heeft voldaan aan de verplichting overeenkomstig
      [artikel 9.1, derde en vierde lid][ref1], tot het doen van een aanbod voor capaciteitsbeperking overeenkomstig
      [bijlage 12][ref2], ongeacht of de oorzaak voor dit nalaten bij de aangeslotene zelf of bij diens CSP ligt, stuurt
      de netbeheerder de aangeslotene na de eerste constatering een schriftelijke herinnering, waarin de netbeheerder
      minimaal:

      a. de aangeslotene wijst op de op hem rustende verplichting;

      b. aan de aangeslotene een hersteltermijn van vijf werkdagen na ontvangst van de schriftelijke herinnering gunt om
      alsnog te voldoen aan de op hem rustende verplichting; en

      c. de aangeslotene overeenkomstig het tweede lid wijst op de consequenties van het niet binnen de hersteltermijn
      nakomen van deze verplichting.

      2 De in het eerste lid bedoelde aangeslotene is vanaf het verstrijken van de hersteltermijn een bedrag aan de
      netbeheerder verschuldigd ter grootte van € 120,– per MW gecontracteerd transportvermogen voor elke dag dat niet
      aan de verplichting wordt voldaan, tenzij er sprake is van overmacht.

      3 De netbeheerder brengt het overeenkomstig het tweede lid verschuldigde bedrag binnen een maand na het niet
      nakomen van de verplichting voor een specifieke dag in rekening bij de desbetreffende aangeslotene.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.1
      [ref2]: https://wetten.overheid.nl/BWBR0037940
