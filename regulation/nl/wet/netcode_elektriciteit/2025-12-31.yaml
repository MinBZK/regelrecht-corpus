  - number: '3.33'
    text: |-
      1 De offshore-power park module, aangesloten op een spanningsniveau lager dan 300 kV is in staat aan het net
      gekoppeld en in bedrijf te blijven gedurende de volgende tijdsperioden, als bedoeld in artikel 25, eerste lid, van
      de Verordening (EU) 2016/631 (NC RfG):

      a. onbeperkt bij een netspanning kleiner 1,118 pu en groter dan of gelijk aan 0,9 pu;

      b. 60 minuten bij een netspanning kleiner dan 0,9 pu en groter dan of gelijk aan 0,85 pu;

      c. 60 minuten bij een netspanning kleiner dan 1,15 pu en groter dan of gelijk aan 1,118 pu.

      2 De offshore-power park module, aangesloten op een hoogspanningsnet met een spanningsniveau lager dan 300 kV is
      in staat bij variërende spanning maximaal een hoeveelheid blindvermogen te leveren dat gekenschetst wordt door een
      verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 25, vijfde lid, van de Verordening (EU)
      2016/631 (NC RfG)):

      a. gelijk aan 0,1 bij een spanning van 1,06 pu;

      b. gelijk aan 0,35 bij een spanning van 0,92 pu tot 1 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,35 en 0,0 bij een spanning van 1 pu tot
      1,06 pu.

      3 De offshore-power park module, aangesloten op een hoogspanningsnet met een spanningsniveau lager dan 300 kV is
      in staat bij variërende spanning maximaal een hoeveelheid blindvermogen op te nemen dat gekenschetst wordt door een
      verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 25, vijfde lid, van de Verordening (EU)
      2016/631 (NC RfG):

      a. gelijk aan 0,1 bij een spanning van 0,92 pu;

      b. gelijk aan 0,4 bij een spanning van 1 pu tot 1,06 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,1 en 0,4 bij een spanning van 0,92 pu tot
      1 pu.

      4 De offshore-power park module, aangesloten op een hoogspanningsnet met een spanningsniveau lager dan 300 kV is
      op grond van het tweede en het derde lid in staat blindvermogen te leveren of op te nemen binnen en inclusief de
      grenzen van het rood gemarkeerde profiel in onderstaand U-Q/Pmax-diagram:

      5 Ten aanzien van het leveren van snelle foutstroom op het overdrachtspunt van de aansluiting, is
      __REF000___________________________________________________________________________________________________________
      ______, van overeenkomstige toepassing op offshore-power park modules. In het geval dat de vereiste waarde van
      sprongsgewijze verandering van de momentane sinusvormige spanning, als bedoeld in artikel 3.19, twaalfde lid,
      onderdeel a, subonderdeel 2°, leidt tot ongewenste activering van extra blindstroominjectie, kan de netbeheerder
      een andere waarde overeenkomen met de aangeslotene die beschikt over een offshore-power park module en deze
      vastleggen in de aansluit- en transportovereenkomst.


