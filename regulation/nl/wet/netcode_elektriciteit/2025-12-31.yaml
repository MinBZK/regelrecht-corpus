  - number: '9.28'
    text: |-
      1 Uitsluitend met toestemming van de netbeheerder van het landelijk hoogspanningsnet vindt wederinschakeling plaats
      van:

      a. door middel van frequentierelais afgeschakelde belasting, of

      b. handmatig afgeschakelde belasting, voor zover de afschakeling valt onder de coördinatie van de netbeheerder van
      het landelijk hoogspanningsnet.

      2 De netbeheerder van het landelijk hoogspanningsnet verwerft black-startmogelijkheden in een door hem te bepalen
      omvang. Hij bepaalt waar zij bij voorkeur gelokaliseerd moeten zijn en hanteert de productspecificaties als bedoeld
      in artikel 4, tweede lid, onderdeel b, van [Verordening (EU) 2017/2196](32196R2017) (NC ER) die zijn opgenomen
      in [bijlage 5][ref1].

      3 De in artikel 4, tweede lid, onderdeel c, van [Verordening (EU) 2017/2196](32196R2017) (NC ER) bedoelde lijst met
      soorten significante netgebruikers en de door hen toe te passen maatregelen is opgenomen in [bijlage 6][ref2].

      4 Significante netgebruikers met hoge prioriteit, als bedoeld in artikel 4, tweede lid, onderdeel d, van
      [Verordening (EU) 2017/2196](32196R2017) (NC ER), zijn aangeslotenen:

      a. waarvan de installatie onderdeel is van het landelijk gastransportnet, een gasproductienet, een gasopslagsysteem
      of een gasproductie-installatie en naar het gezamenlijke oordeel van de netbeheerder van het landelijk
      hoogspanningsnet en de netbeheerder van het landelijk gastransportnet cruciaal is voor het in stand houden van de
      openbare gasvoorziening of de gasvoorziening van gasgestookte elektriciteitsproductie-eenheden, aangesloten op het
      landelijk hoogspanningsnet; of

      b. waarvan de installatie een elektriciteitsproductie-installatie is die nucleaire energie als primaire energiebron
      heeft.

      5 Regionale netbeheerders en aangeslotenen, die beschikken over een verbruiksinstallatie als bedoeld in artikel
      19 van [Verordening (EU) 2016/1388](33288R2016) (NC DCC) jo. [artikel 4.7, vierde lid][ref3], dragen er zorg voor
      dat hun distributienet of verbruiksinstallatie na een spanningsloze toestand van (een deel van) het landelijk
      hoogspanningsnet weer onder spanning gebracht wordt zodra de spanning in het landelijk hoogspanningsnet is
      hersteld.

      6 De netbeheerder van het landelijk hoogspanningsnet kan, indien de hersteltoestand van kracht is, aangeslotenen
      die beschikken over een synchrone elektriciteitsproductie-eenheid van het type C of D, opdragen de dode band van
      de frequentiegevoelige modus, als bedoeld in [artikel 3.24, derde lid][ref4], uit te schakelen, in welk geval de
      aangeslotenen deze opdracht onverwijld uitvoeren.

      7 Indien de netbeheerder van het landelijk hoogspanningsnet vermogen vordert van een marktpartij in het bescherm-
      en hertelproces zonder toepassing van een onbalansaanpassing, als bedoeld in [artikel 10.25, zevende lid][ref5],
      biedt de netbeheerder van het landelijk hoogspanningsnet een vergoeding aan de BRP voor de onbalanskosten als
      gevolg van de vermogensvordering die de BRP redelijkerwijs niet kan voorkomen.


