  - number: '9.43'
    text: |-
      1 Deze paragraaf bevat de uitvoeringsregels voor congestiemanagement met inzet van capaciteitssturing en niet-
      marktgebaseerde redispatch.

      2 Een CSP dient voor elke aansluiting of groep van aansluitingen waarmee hij bijdraagt aan het oplossen van fysieke
      congestie overeenkomstig [bijlage 12][ref1], daartoe op grond van [artikel 9.34][ref2] gerechtigd te zijn.

      3 De netbeheerder maakt bij de uitvoering van congestiemanagement overeenkomstig deze paragraaf uitsluitend
      gebruik van capaciteitssturing overeenkomstig [bijlage 12][ref3] en van niet-marktgebaseerde redispatch toegepast
      op de in het congestiegebied aanwezige elektriciteitsproductie-eenheden, en de in het congestiegebied aanwezige
      verbruiksinstallaties volgens de richtlijnen die daarvoor in artikel 13 van de [Verordening (EU) 2019/943]
      (32843R2019) zijn opgenomen.

      4 Bij het uitvoeren van congestiemanagement overeenkomstig deze paragraaf werkt de netbeheerder op volgorde:

      a. van kosteneffectiviteit op grond van [artikel 9.44][ref4] verschuldigde vergoeding; en

      b. van toerbeurtsgewijze toewijzing, waarbij de netbeheerder een ondergrens stelt aan het gecontracteerd
      transportvermogen voor afname of voor invoeding van in aanmerking komende aansluitingen.

      5 De netbeheerder publiceert de in het zesde lid, onderdeel b, bedoelde ondergrens van te voren op de in
      [artikel 9.8][ref5] bedoelde website.

      6 Indien het congestiegebied een net van een andere netbeheerder omvat maken de betrokken netbeheerders,
      onverminderd [artikel 9.1, zevende lid][ref6], afspraken over de uitwisseling van de voor de uitvoering van deze
      paragraaf benodigde gegevens en indien nodig over de uitvoering van deze paragraaf.


