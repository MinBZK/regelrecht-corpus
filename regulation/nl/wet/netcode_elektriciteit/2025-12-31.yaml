  - number: '7.5'
    text: |-
      1 De netbeheerder evalueert binnen drie maanden na afloop van elk kalenderjaar per meetlocatie het aantal
      opgetreden hinderlijke spanningsdips over de voorafgaande periode van vijf aaneengesloten kalenderjaren en de
      oorzaken van deze spanningsdips en maakt de resultaten van deze evaluatie openbaar op www.uwspanningskwaliteit.nl
      binnen drie maanden na het begin van de evaluatie.

      2 Indien het vijfjaargemiddelde van het jaarlijks op een meetlocatie gemeten aantal hinderlijke spanningsdips, niet
      zijnde spanningsdips ten gevolge van omstandigheden bedoeld in [artikel 7.3, zesde lid][ref1], hoger is dan het
      in artikel 7.3, tweede en derde lid, vermelde aantal voor de desbetreffende categorie, doet de netbeheerder binnen
      drie maanden na de in het eerste lid bedoelde evaluatie een onderzoek naar de fysieke oorzaak en duur van deze
      spanningsdips en maakt de resultaten van dit onderzoek openbaar.

      3 Het in het tweede lid bedoelde onderzoek wordt uitgevoerd door:

      a. de netbeheerder indien uit de in het eerste lid bedoelde evaluatie blijkt dat de vermoedelijke oorzaak van de
      opgetreden hinderlijke spanningsdips zich in het net van de netbeheerder bevindt:

      b. een door de netbeheerder aan te wijzen onafhankelijke deskundige indien:

      1°. uit de in het eerste lid bedoelde evaluatie blijkt dat de vermoedelijke oorzaak van de opgetreden hinderlijke
      spanningsdips zich niet in het net van de netbeheerder bevindt;

      2°. een aangeslotene de uitvoering of resultaten van het door de netbeheerder uitgevoerde onderzoek als bedoeld in
      onderdeel a betwist.

      4 Het in het tweede en derde lid bedoelde onderzoek wordt afgerond en openbaar gemaakt binnen drie maanden nadat
      het is gestart.

      5 Bij het in het tweede en derde lid bedoelde onderzoek wordt in ieder geval aandacht gegeven aan het functioneren
      van de beveiliging op het moment van optreden van de spanningsdips.

      6 De in het eerste lid bedoelde evaluatie en de in het tweede en derde lid bedoelde onderzoek hebben tevens
      betrekking op spanningsdips met een duur van 150 tot 200 ms en een restspanning van 40 tot 70%.


