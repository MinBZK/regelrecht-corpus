  - number: '7.4'
    text: |-
      1 De netbeheerder bewaakt de kwaliteit van het transport en registreert afwijkingen van de eisen aan de kwaliteit
      van het transport.

      2 Een netbeheerder past een uniforme, door de gezamenlijke netbeheerders overeengekomen werkwijze
      toe voor de registratie van onderbrekingen in het transport van elektriciteit, als bedoeld in
      [artikel 4.1, eerste lid, van het Besluit investeringsplan en kwaliteit elektriciteit en gas][ref1].
      Deze werkwijze omvat tevens de wijze waarop een netbeheerder de prestatie-indicatoren, als bedoeld in
      __REF001___________________________________________________________________________________________________________
      ___________, vaststelt. De gezamenlijke netbeheerders maken de werkwijze openbaar.

      3 Een netbeheerder past een uniforme, door de gezamenlijke netbeheerders overeengekomen werkwijze toe voor de
      registratie van de afwijkingen van de eisen aan de kwaliteit van het transport van elektriciteit, als bedoeld
      in [artikel 4.1, eerste lid, van het Besluit investeringsplan en kwaliteit elektriciteit en gas][ref3],
      alsmede van de vaststelling van de prestatie-indicatoren, als bedoeld in
      [artikel 3.1, eerste lid, onderdeel d, van de Regeling investeringsplan en kwaliteit elektriciteit en gas][ref4].
      De gezamenlijke netbeheerders maken de werkwijze openbaar op www.uwspanningskwaliteit.nl.

      4 De meting ten behoeve van de registratie van de kwaliteit van transport van elektriciteit en de in het derde lid
      genoemde registratie van de afwijkingen van de eisen aan de kwaliteit van het transport van elektriciteit vindt
      plaats op de volgende meetlocaties:

      a. in geval van een laagspanningsnet bij een steekproef van minstens 250 aselect gekozen aansluitingen gedurende
      één week in het overdrachtspunt van de aansluiting;

      b. in geval van een middenspanningsnet:

      1°. voor het aspect spanningsdips op een door de netbeheerders gezamenlijk bepaalde representatieve selectie van
      minstens 200 middenspanningsstations op de rail van het middenspanningsstation, of indien dat niet mogelijk is, in
      het afgaande veld door middel van continu meting;

      2°. voor alle voorwaarden voor spanningskwaliteit bij een steekproef van minstens 250 aselect gekozen aansluitingen
      gedurende één week in het overdrachtspunt van de aansluiting;

      c. in geval van een hoogspanningsnet:

      1°. in het overdrachtspunt van de aansluiting door middel van continu meting; of

      2°. indien de spanningstransformatoren in het veld van de aansluiting niet geschikt zijn voor de meting van de
      afwijkingen van de eisen aan de kwaliteit van transport van elektriciteit en er geen fysieke ruimte aanwezig is
      om de spanningstransformatoren aan te passen, op de rail, in een ander veld of in een voedende verbinding van
      respectievelijk naar het station waarop de desbetreffende aansluiting is aangesloten door middel van continu
      meting.

      5 De metingen bedoeld in het vierde lid omvatten voor de aansluitingen bedoeld in de Bijlage bij het besluit
      van de Autoriteit Consument en Markt van 17 maart 2009 met kenmerk 102971_1/24 tevens de meting van transiënte
      overspanningen.

      6 Op de metingen bedoeld in het vierde lid is de internationale norm IEC 61000-4-30:2015-10 ‘Electromagnetic
      compatibility (EMC) – Part 4-30 Testing and measurement techniques – Power quality measurement methods’ van
      toepassing.

      7 De netbeheerder stelt de meetresultaten van de in het vierde lid bedoelde metingen, betrekking hebbend op een
      bepaalde aansluiting, desgevraagd ter beschikking aan de desbetreffende aangeslotene.

      8 Indien de resultaten van de in het vierde lid bedoelde metingen betrekking hebben op spanningsdips in
      middenspanningsnetten, stelt de netbeheerder desgevraagd de meetresultaten beschikbaar van de spanningsdipmeting in
      het dichtstbijzijnde middenspanningsstation waar zich een spanningsdipmeting bevindt.


