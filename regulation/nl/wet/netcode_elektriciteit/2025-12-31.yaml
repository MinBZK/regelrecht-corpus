  - number: '2.11'
    text: |-
      De aangeslotene zorgt er voor dat:

      a. de aansluiting goed bereikbaar blijft;

      b. de toegang tot de ruimte waarin zich de meetinrichting en de tot de aansluiting behorende apparatuur bevinden,
      niet op een naar het oordeel van de netbeheerder ontoelaatbare wijze wordt belemmerd;

      c. verzegelingen die door of vanwege de netbeheerder zijn aangebracht op de meetinrichting of op delen van de
      aansluiting niet worden geschonden of verbroken tenzij de netbeheerder uitdrukkelijk toestemming geeft tot het
      verbreken van de verzegeling;

      d. hij alle maatregelen neemt die redelijkerwijs van hem verwacht kunnen worden om schade aan het in het perceel
      aanwezige gedeelte van de aansluiting te voorkomen;

      e. de meetinrichting en de tot de aansluiting behorende apparatuur niet opgesteld worden in vochtige ruimten,
      ruimten met bijtende gassen, dampen of stoffen, ruimten met ontploffingsgevaar en ruimten met brandgevaar; en

      f. boven of in de onmiddellijke nabijheid van de meetinrichting geen water-, stoom- of soortgelijke leidingen voor
      komen, tenzij, ter beoordeling van de netbeheerder, passende voorzieningen zijn getroffen voor de bescherming van
      de meetinrichting.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.11
  - number: '2.12'
    text: |-
      1 De aangeslotene zorgt voor comptabele meting bij het (de) overdrachtspunt(en) van de aansluiting met inachtneming
      van de [Meetcode elektriciteit][ref1], tenzij op grond van deze code anders is bepaald.

      2 De plaats van de comptabele meetinrichting wordt bepaald door de netbeheerder in overleg met de aangeslotene en,
      indien de aangeslotene een grootverbruiker is en hij zijn meetverantwoordelijkheid heeft overgedragen, met de door
      hem op grond van de [Meetcode elektriciteit][ref2] aangewezen meetverantwoordelijke.

      3 De comptabel te meten grootheden worden vastgelegd in de aansluit- en transportovereenkomst.

      4 De comptabele meetinrichting registreert de grootheden in het overdrachtspunt van de aansluiting. In geval van
      aansluitingen met een of meer secundaire allocatiepunten gebeurt dat voor elk allocatiepunt afzonderlijk.


      [ref1]: https://wetten.overheid.nl/BWBR0037946
      [ref2]: https://wetten.overheid.nl/BWBR0037946
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.12
    references:
      - id: ref1
        bwb_id: BWBR0037946
      - id: ref2
        bwb_id: BWBR0037946
  - number: '2.13'
    text: |-
      1 De beveiliging van elektrische installaties (en onderdelen daarvan) is selectief ten opzichte van de beveiliging
      die de netbeheerder in de aansluiting van de elektrische installatie of in het voedende net toepast.

      2 Bij de dimensionering van de elektrische installatie wordt rekening gehouden met de door de netbeheerder toe te
      passen beveiliging.

      3 De netbeheerder informeert de aangeslotene en overlegt met hem voor zover van toepassing bij eerste aansluiting
      en bij latere wijzigingen van het net omtrent:

      a. de beveiligingsfilosofie;

      b. de minimum- en maximumwaarde van het kortsluitvermogen tijdens de normale toestand;

      c. de wijze van sterpuntsbehandeling;

      d. de isolatiecoördinatie;

      e. de netconfiguratie; en

      f. de bedrijfsvoering.

      4 Voor zover de in het derde lid genoemde gegevens nodig zijn voor de bedrijfsvoering van de aangeslotene worden
      deze in de aansluit- en transportovereenkomst vastgelegd.

      5 Zowel de aangeslotene als de netbeheerder kunnen het vastgelegde maximale kortsluitvermogen slechts in overleg
      met elkaar aanpassen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.13
  - number: '2.14'
    text: |-
      1 Onverminderd het in of krachtens deze code bepaalde voldoen alle bedrijfsmiddelen en toestellen in of aangesloten
      op de elektrische installaties aan de op deze bedrijfsmiddelen en toestellen van toepassing zijnde normen.

      2 De in een elektrische installatie opgenomen machines, toestellen, materialen en onderdelen voldoen aan de voor de
      handel daarin of het gebruik daarvan vastgestelde wettelijke voorschriften.

      3 De elektrische installatie is bestand tegen het door de netbeheerder ter plaatse verwachte kortsluitvermogen.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.14
  - number: '2.15'
    text: |-
      1 Elektrische installaties en de daarop aangesloten toestellen veroorzaken via het net van de netbeheerder geen
      ontoelaatbare hinder.

      2 De netbeheerder kan de aangeslotene verzoeken tot het treffen van zodanige voorzieningen dat de ontoelaatbare
      hinder ophoudt, dan wel voor een door hem te bepalen aantal uren de aangeslotene verbieden om door hem aan te
      wijzen toestellen en motoren te gebruiken.

      3 In afwijking van het tweede lid, past de netbeheerder van het landelijk hoogspanningsnet centrale filtering toe
      wanneer de verantwoordelijkheid voor het treffen van de voorzieningen niet eenduidig kan worden toegewezen aan de
      aangeslotene of aan de netbeheerder van het landelijk hoogspanningsnet, mits de ontoelaatbare hinder veroorzaakt
      wordt door spanningsverschijnselen als gevolg van de interactie van een wisselstroomkabel langer dan 5 km, deel
      uitmakend van de aansluiting of de installatie van een aangeslotene, en de netconfiguratie ter plaatse.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.15
  - number: '2.16'
    text: |-
      1 De elektrische installaties bevatten geen bedrijfsmiddelen die tot invoeding in het net van de netbeheerder
      kunnen leiden, tenzij aan de aanvullende voorwaarden voor elektriciteitsproductie-eenheden zoals opgenomen in
      [hoofdstuk 3][ref1] wordt voldaan.

      2 De aangeslotene stelt de netbeheerder tijdig op de hoogte van zijn voornemen tot het plaatsen of wijzigen van een
      elektriciteitsproductie-eenheid of een elektriciteitsopslageenheid, opdat de netbeheerder eventueel noodzakelijke
      wijzigingen in het net kan doorvoeren.

      3 Indien het bedrijfsmiddel dat tot invoeding in het net van de netbeheerder kan leiden, als bedoeld in het eerste
      lid, een elektriciteitsopslageenheid betreft:

      a. zijn aansluitvoorwaarden zoals verwoord in Verordening (EU) 2016/631 (NC RfG) en de daarbij behorende onderdelen
      van hoofdstuk 3 van overeenkomstige toepassing met dien verstande dat:

      1°. een synchroon gekoppelde elektriciteitsopslageenheid voldoet aan de voorwaarden zoals verwoord in Verordening
      (EU) 2016/631 (NC RfG) artikel 13 tot en met 19, artikel 40, artikel 42 tot en met 46 en artikel 51 tot en met 53;

      2°. een niet-synchroon gekoppelde elektriciteitsopslageenheid voldoet aan de voorwaarden zoals verwoord in
      Verordening (EU) 2016/631 (NC RfG) artikel 13 tot en met 16, artikel 20 tot en met 22, artikel 40, artikel 42,
      artikel 43, artikel 47 tot en met 49 en artikel 54 tot en met 56;

      3°. een elektriciteitsopslageenheid met een maximaal te leveren werkzaam vermogen groter dan of gelijk aan 0,8 kW
      en kleiner dan 1 MW voldoet aan de bepalingen die van toepassing zijn op een elektriciteitsproductie-eenheid van
      het type A;

      4°. een elektriciteitsopslageenheid met een maximaal te leveren werkzaam vermogen groter dan of gelijk aan 1 MW en
      kleiner dan 50 MW voldoet aan de bepalingen die van toepassing zijn op een elektriciteitsproductie-eenheid van het
      type B;

      5°. een elektriciteitsopslageenheid met een maximaal te leveren werkzaam vermogen groter dan of gelijk aan 50 MW en
      kleiner dan 60 MW voldoet aan de bepalingen die van toepassing zijn op een elektriciteitsproductie-eenheid van het
      type C;

      6°. een elektriciteitsopslageenheid met een maximaal te leveren werkzaam vermogen groter dan of gelijk aan 60 MW
      voldoet aan de bepalingen die van toepassing zijn op een elektriciteitsproductie-eenheid van het type D;

      b. beschikt de elektriciteitsopslageenheid over de mogelijkheid tot het automatisch overschakelen van de
      opslagmodus naar de opwekkingsmodus als bedoeld in artikel 15, derde lid, onderdeel a, van de Verordening (EU)
      2017/2196 (NC ER), alsmede over de mogelijkheid tot automatisch ontkoppelen als bedoeld in artikel 15, derde lid,
      onderdeel b, van de Verordening (EU) 2017/2196 (NC ER);

      c1. zijn de relevante artikelen van de [Verordening (EU) 2016/1388](32016R1388) (NC DCC) en paragraaf 4.1 van
      overeenkomstige toepassing indien de elektriciteitsopslageenheid is aangesloten op een net met een spanningsniveau
      van 110 kV of hoger;

      c2. zijn de relevante artikelen van de Verordening (EU) 2016/1388 (NC DCC) en [paragraaf 4.2][ref2] van
      overeenkomstige toepassing indien de elektriciteitsopslageenheid vraagsturing levert aan een netbeheerder;

      d. zijn voor de gegevensuitwisseling tussen de aangeslotene die beschikt over een elektriciteitsopslageenheid
      en de netbeheerder de [artikelen 13.1][ref3], [13.11][ref4] en [13.21][ref5] of [13.2][ref6], [13.12][ref7] en
      [13.22][ref8] van overeenkomstige toepassing;

      e. zijn voor de gegevensuitwisseling tussen de aangeslotene die beschikt over een elektriciteitsopslageenheid en
      de netbeheerder tevens de [artikelen 13.3][ref9], [13.13][ref10] en [13.23][ref11] of [13.4][ref12], [13.14][ref13]
      en [13.24][ref14] van overeenkomstige toepassing indien de elektriciteitsopslageenheid vraagsturing levert aan
      een netbeheerder;

      f. geldt in afwijking van onderdeel a dat voor de gelimiteerde frequentiegevoelige modus – onderfrequentie (LFSM-U)
      – in zowel de opslag- als in de opwekkingsmodus de statiek ingesteld is op:

      1°. 2% voor elektriciteitsopslageenheden groter dan 0,8 kW en kleiner dan 1 MW; en

      2°. 1% voor elektriciteitsopslageenheden groter dan of gelijk aan 1 MW;

      g. is [artikel 9.13][ref15] van overeenkomstige toepassing op het beïnvloeden van het via het overdrachtspunt van
      de aansluiting van een elektriciteitsopslageenheid uit te wisselen werkzaam vermogen.

      4 Indien het bedrijfsmiddel dat tot invoeding van blindvermogen in het net van de netbeheerder kan leiden, bedoeld
      in het eerste lid, een synchrone condensor, aangesloten op een net met een spanningsniveau van 110 kV of hoger,
      betreft:

      a. zijn de aansluitvoorwaarden zoals verwoord in de artikelen 19, 29, 33 tot en met 37, 40 tot en met 46 en 51
      tot en met 53 van de [Verordening (EU) 2016/631](32016R0631) (NC RfG), met uitzondering van de onderdelen die
      betrekking hebben op het werkzaam vermogen, en de daarbij behorende artikelen van hoofdstuk 3, van overeenkomstige
      toepassing;

      b. in afwijking van onderdeel a, jo. [artikel 3.13, tweede lid][ref16], geldt voor de frequentiegradiënt van
      een synchrone condensor een drempelwaarde van 2 Hertz per seconde gedurende een voortschrijdend tijdsvenster van
      500 milliseconden;

      c. in afwijking van onderdeel a, jo. [artikel 3.29, tweede tot en met vierde lid][ref17], is de synchrone condensor
      in staat bij variërende spanning ten minste een hoeveelheid blindvermogen te leveren dat gekenschetst wordt door
      een verhouding van blindvermogen tot maximaal schijnbaar vermogen gelijk aan 0,3 bij een spanning van 1,05 pu,
      gelijk aan 0,65 bij een spanning van 0,9 pu tot 1 pu en dat bepaald wordt door het lineaire verloop tussen
      respectievelijk 0,65 en 0,3 bij een spanning van 1 pu tot 1,05 pu, en een hoeveelheid blindvermogen op te nemen
      dat gekenschetst wordt door een verhouding van blindvermogen tot maximaal schijnbaar vermogen gelijk aan 0,1
      bij een spanning van 0,9 pu, gelijk aan 0,5 bij een spanning van 1 pu tot 1,05 pu en dat bepaald wordt door het
      lineaire verloop tussen respectievelijk 0,1 en 0,5 bij een spanning van 0,9 pu tot 1 pu, en is daarmee in staat
      blindvermogen te leveren of op te nemen ten minste binnen en inclusief de grenzen van het rood gemarkeerde profiel
      in onderstaand U-Q/Smax-diagram:

      d. zijn de [artikelen 9.14, eerste lid][ref18], en [9.16 tot en met 9.18][ref19] van overeenkomstige toepassing;

      e. zijn voor de gegevensuitwisseling tussen de aangeslotene die beschikt over een synchrone condensor en de
      netbeheerder de [artikelen 13.1][ref20], [13.11][ref21] en [13.21][ref22], met uitzondering van de onderdelen die
      betrekking hebben op het werkzaam vermogen, van overeenkomstige toepassing.

      5 Het vierde lid is van overeenkomstige toepassing indien de synchrone condensor een volledig geïntegreerde
      netcomponent is als bedoeld in [artikel 3.28 van de Energiewet][ref23].


