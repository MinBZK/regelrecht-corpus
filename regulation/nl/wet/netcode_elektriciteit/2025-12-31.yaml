      1 Aangeslotenen die beschikken over een elektriciteitsproductie-eenheid van het type C of D, waarop overeenkomstig
      artikel 4, eerste lid, van [Verordening (EU) 2016/631](32531R2016) (NC RfG) de [Verordening (EU) 2016/631]
      (32531R2016) (NC RfG) van toepassing is, dragen er zorg voor dat de levering van de frequentierespons
      voor het werkzaam vermogen, als bedoeld in [artikel 3.24, tweede lid][ref1], geactiveerd wordt bij een
      frequentiedrempelwaarde van 49,8 Hz en met een statiek van 5%.

      2 Aangeslotenen die beschikken over een elektriciteitsproductie-eenheid van het type A, B, C of D, waarop
      overeenkomstig artikel 4, eerste lid, van [Verordening (EU) 2016/631](32531R2016) (NC RfG) de [Verordening (EU)
      2016/631](32531R2016) (NC RfG) van toepassing is, dragen er zorg voor dat de levering van de frequentierespons
      voor het werkzaam vermogen, als bedoeld in [artikel 3.13, vierde lid][ref2], geactiveerd wordt bij een
      frequentiedrempelwaarde van 50,2 Hz en met een statiek van 5%.


