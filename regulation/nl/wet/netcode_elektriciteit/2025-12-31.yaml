  - number: '7.13'
    text: |-
      1. De netbeheerder kan het gecontracteerde vaste transportvermogen van een aangeslotene verlagen indien:

      a. de desbetreffende aansluiting gelegen is in een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref1];
      en

      b. de aangeslotene:

      1°. bij een aansluiting op een middenspanningsnet gedurende de twaalf voorafgaande maanden ten hoogste 50% van
      het gecontracteerd transportvermogen heeft benut of gedurende de twaalf voorafgaande maanden 1 MW of meer van het
      gecontacteerd transportvermogen niet heeft benut;

      2°. bij een aansluiting op een hoogspanningsnet met een spanningsniveau lager dan 110 kV, gedurende de twaalf
      voorafgaande maanden ten hoogste 50% van het gecontracteerd transportvermogen heeft benut of gedurende de twaalf
      voorafgaande maanden 1 MW of meer van het gecontacteerd transportvermogen niet heeft benut; of

      3°. bij een aansluiting op een hoogspanningsnet met een spanningsniveau gelijk aan of groter dan 110 kV, gedurende
      de twaalf voorafgaande maanden ten hoogste 50% van het gecontracteerd transportvermogen heeft benut of gedurende de
      twaalf voorafgaande maanden 10 MW of meer van het gecontacteerd transportvermogen niet heeft benut; en

      c. het onder b bedoelde niet benutte deel van het transportvermogen, of een gedeelte daarvan, niet binnen een
      redelijke termijn benut zal worden door de aangeslotene, zoals beschreven in het tweede tot en met het vierde lid.

      2. Wanneer de netbeheerder constateert dat wordt voldaan aan het eerste lid, onderdelen a en b:

      a. stelt de netbeheerder de aangeslotene hiervan schriftelijk op de hoogte;

      b. stelt de netbeheerder de aangeslotene in de gelegenheid om binnen twee maanden na de onder a bedoelde
      schriftelijke melding, in overleg te treden met de netbeheerder over of, in welke mate en binnen welke termijn, het
      transportvermogen naar verwachting zal worden benut;

      c. legt de netbeheerder schriftelijk ten minste vast:

      1°. of het in onderdeel b genoemde overleg heeft plaatsgevonden;

      2°. indien het in onderdeel b genoemde overleg heeft plaatsgevonden, of, in welke mate en binnen welke termijn de
      aangeslotene verwacht het transportvermogen te zullen benutten; en

      3°. de informatie die aangeslotene naar voren heeft gebracht in het kader van subonderdeel 2°.

      d. deelt de netbeheerder de informatie als bedoeld in onderdeel c, binnen 10 werkdagen nadat het in onderdeel
      b bedoelde overleg heeft plaatsgevonden, of direct na afloop van de in onderdeel b genoemde termijn, indien het
      overleg niet heeft plaatsgevonden, met de aangeslotene.

      e. stelt de netbeheerder de aangeslotene in de gelegenheid binnen 10 werkdagen na het delen van de informatie als
      bedoeld in onderdeel d schriftelijk hierop te reageren.

      3. Binnen één maand na de in het tweede lid, onderdeel e, bedoelde termijn, of indien het in onderdeel b bedoelde
      overleg niet heeft plaatsgevonden, direct na afloop van de in het tweede lid, onderdeel b, genoemde termijn van
      twee maanden, stelt de netbeheerder vast in welke mate de aangeslotene binnen een termijn van ten minste twaalf
      maanden, gerekend vanaf de in het tweede lid, onderdeel a genoemde schriftelijke melding, het gecontracteerd
      transportvermogen zal gebruiken. De netbeheerder betrekt hierbij:

      a. voor zover beschikbaar, de hoogste kW-waarde van de aangeslotene over de voorafgaande 24 maanden;

      b. de prognoses als bedoeld in [artikel 13.11, eerste lid, onderdeel e][ref2], of
      [artikel 13.13, eerste lid, onderdeel b][ref3], of als bedoeld in [artikel 13.12, eerste lid, onderdeel e][ref4],
      of [artikel 13.14, eerste lid, onderdeel b][ref5];

      c. de informatie die volgt uit het tweede lid, onderdelen b, c en e; en

      d. de informatie die volgt uit het zevende lid.

      4. Indien de netbeheerder op grond van het derde lid vaststelt dat het gecontracteerd transportvermogen niet binnen
      de in het derde lid genoemde termijn van ten minste twaalf maanden volledig gebruikt wordt, stelt de netbeheerder
      het nieuwe gecontracteerd transportvermogen vast op:

      a. voor zover beschikbaar, de hoogste kW-waarde als bedoeld in het derde lid, onderdeel a;

      b. of, indien dat hoger is dan de kW-waarde als bedoeld in onderdeel a en de aangeslotene dit aannemelijk maakt,
      naar de waarde die volgt uit de prognoses als bedoeld in het derde lid, onderdeel b;

      c. of, indien dat hoger is dan de kW-waarde als bedoeld in onderdeel a en de aangeslotene dit aannemelijk maakt,
      naar de waarde zoals volgt uit het derde lid, onderdeel c.

      5. De in het vierde lid bedoelde aanpassing van het gecontracteerde transportvermogen gaat in op het moment
      dat de netbeheerder het door de aangeslotene gecontracteerde transportvermogen aanpast in de aansluit- en
      transportovereenkomst en de netbeheerder de aangeslotene hierover schriftelijk informeert.

      6. Na een aanpassing als bedoeld in het vijfde lid kan het gecontracteerd transportvermogen conform
      [artikel 24 van de Elektriciteitswet 1998][ref6] verhoogd worden, indien de aangeslotene hier om
      verzoekt en, indien sprake is van een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref7], de
      aangeslotene op grond van nieuwe prognoses als bedoeld in [artikel 13.11, eerste lid, onderdeel e][ref8] of
      [artikel 13.13, eerste lid, onderdeel b][ref9], of als bedoeld in [artikel 13.12, eerste lid, onderdeel e][ref10],
      of [artikel 13.14, eerste lid, onderdeel b][ref11], aannemelijk maakt dat hij het verzochte transportvermogen nodig
      heeft.

      7. Het gecontracteerd transportvermogen wordt niet aangepast bij:

      a. aansluitingen ten behoeve van vitale processen zoals gepubliceerd door de Nationale Coördinator
      Terrorismebestrijding en Veiligheid, anders dan aansluitingen van elektriciteitsproductie-installaties, indien het
      beperken van het gecontracteerd transportvermogen een risico vormt voor het functioneren van het desbetreffende
      vitale proces;

      b. aansluitingen van de Dienst Justitiële Inrichtingen, ziekenhuizen en openbaar vervoersbedrijven voor zover
      het aanpassen van gecontracteerd transportvermogen direct van invloed is op het functioneren van maatschappelijke
      voorzieningen; en

      c. aansluitingen waarvoor geldt dat de aangeslotene aantoont dat het gecontracteerd transportvermogen
      incidenteel en onverwacht moet kunnen worden aangesproken voor vanuit de technische veiligheid van de installatie
      onvermijdelijke belastingen.


