    text: |-
      De volgende artikelen, paragrafen en hoofdstukken, inclusief de bijbehorende bijlagen, zijn van toepassing per
      allocatiepunt in plaats van per aansluiting:

      a. de [artikelen 3.3][ref1], [9.19][ref2], [13.11 tot en met 13.14][ref3];

      b. de [paragrafen 9.1][ref4], [9.2][ref5], [9.9 tot en met 9.11][ref6]; en

      c. de [hoofstukken 10][ref7] en [11][ref8].


