  - number: '9.1'
    text: |-
      1 Netbeheerders stellen aangeslotenen in staat, vrijwillig tegen vooraf met de netbeheerder overeengekomen
      voorwaarden overeenkomstig de specificaties in [bijlage 12][ref1], een bijdrage te leveren aan het oplossen van
      fysieke congestie. Individuele aangeslotenen wijzen hiertoe desgewenst een CSP aan. Een groep van aangeslotenen
      wijst hiertoe een CSP aan.

      2 Netbeheerders stellen aangeslotenen die beschikken over een aansluiting waarvan de allocatiemethode van de
      aansluiting, als bedoeld in [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref2] de
      waarde “telemetrie” of “slimme-meter-allocatie” heeft, in staat dagelijks het vermogen dat de volgende dag of
      gedurende de dag meer of minder kan worden afgenomen, respectievelijk meer of minder kan worden geproduceerd, ter
      beschikking te stellen van de netbeheerder door middel van het indienen van biedingen, tegen door de netbeheerder
      vast te stellen procedures en specificaties overeenkomstig [bijlage 11][ref3]. Aangeslotenen wijzen hiertoe een
      CSP aan.

      3 Onverminderd het bepaalde in [artikel 9.19][ref4] zijn aangeslotenen, niet zijnde netbeheerders, en groepen
      van aangeslotenen die een groepstransportovereenkomst hebben afgesloten, met een gecontracteerd transportvermogen
      voor afname of voor invoeding van meer dan 60 MW verplicht om tegen vooraf met de netbeheerder overeengekomen
      procedures en specificaties overeenkomstig [bijlage 11][ref5] en [12, zevende lid][ref6], een bijdrage te leveren
      aan het oplossen van fysieke congestie in het net waarop deze aangeslotenen zijn aangesloten of in een bovenliggend
      net, dan wel een bijdrage te leveren aan een tegengestelde redispatch-actie ten behoeve van het oplossen van een
      fysieke congestie elders, en wijzen hiertoe een CSP aan, of, in het geval van groepen van aangeslotenen die een
      groepstransportovereenkomst hebben afgesloten, een of meerdere CSP’s.

      4 Indien sprake is van een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref7], kan de netbeheerder
      aangeslotenen, niet zijnde netbeheerders, en groepen van aangeslotenen die een groepstransportovereenkomst hebben
      afgesloten, op zijn net of op een onderliggend net, met een gecontracteerd transportvermogen voor afname of voor
      invoeding van meer dan een door de netbeheerder overeenkomstig [artikel 9.1b, vierde lid][ref8], te bepalen waarde
      tussen 1 en 60 MW verplichten om tegen vooraf met de netbeheerder overeengekomen procedures en specificaties
      overeenkomstig [bijlage 11][ref9] en [12, zevende lid][ref10], een bijdrage te leveren aan het oplossen van
      fysieke congestie in het net waarop deze aangeslotenen zijn aangesloten of in een bovenliggend net. Aangeslotenen
      en groepen van aangeslotenen met een gecontracteerd transportvermogen voor invoeding op wie de hier bedoelde
      verplichting van toepassing is, laten de betreffende elektriciteitsproductie-eenheid of elektriciteitsopslageenheid
      binnen drie maanden na bekendmaking van de verplichting prekwalificeren. Aangeslotenen en groepen van aangeslotenen
      met een gecontracteerd transportvermogen voor afname op wie de hier bedoelde verplichting van toepassing is,
      laten de betreffende verbruiksinstallatie of elektriciteitsopslageenheid binnen zes maanden na bekendmaking van
      de verplichting prekwalificeren. Deze aangeslotenen wijzen hiertoe een CSP aan, of, in het geval van groepen van
      aangeslotenen die een groepstransportovereenkomst hebben afgesloten, één of meerdere CSP’s.

      5 Aangesloten op wie de in het vierde lid bedoelde verplichting betrekking heeft, worden door de netbeheerder
      schriftelijk en door middel van publicatie op een in [artikel 9.8][ref11] bedoelde en door of namens de
      gezamenlijke netbeheerders beheerde website geïnformeerd over de in het vierde lid bedoelde verplichting,
      procedures en specificaties, alsmede de overeenkomstig [artikel 9.1b, eerste tot en met vierde lid][ref12],
      door de netbeheerder vastgestelde grenswaarde(n) en voorschriften en de verplichting om een CSP aan te wijzen
      overeenkomstig [artikel 9.1, derde lid][ref13].

      6 De netbeheerder maakt, ten behoeve van de verificatie en de financiële afhandeling bij de uitvoering van het in
      het eerste en tweede lid bepaalde, gebruik van meetgegevens per onbalansverrekeningsperiode, geregistreerd door:

      a. meetinrichtingen bij het overdrachtspunt van aansluitingen en die hij op grond van
      [paragraaf 6.2 van de Informatiecode elektriciteit en gas][ref14] van de desbetreffende meetverantwoordelijken
      ontvangen heeft;

      b. meetinrichtingen bij het overdrachtspunt van kleinverbruikaansluitingen en die hij uit die meetinrichting heeft
      uitgelezen.

      7 De netbeheerder stemt bij maatregelen, die de netten van andere netbeheerders beïnvloeden, de voorgenomen acties
      af met de desbetreffende netbeheerders. Indien maatregelen worden gevraagd in een net van een andere netbeheerder,
      is daarvoor instemming van de netbeheerder van het desbetreffende net nodig.

      8 De netbeheerder van het landelijk hoogspanningsnet coördineert indien hij dit noodzakelijk acht uit hoofde
      van zijn wettelijke taken overeenkomstig [artikel 16, tweede lid, van de Elektriciteitswet 1998][ref15],
      dan wel op verzoek van andere relevante netbeheerders, de te nemen maatregelen, als bedoeld in
      [artikel 9.2, derde lid, onderdelen a en b][ref16], [artikel 9.41, vierde, vijfde en zesde lid][ref17] en
      [artikel 9.45, vierde, vijfde en zesde lid][ref18]. Hij maakt daarbij gebruik van het hem overeenkomstig
      [artikel 9.1][ref19] ter beschikking gestelde vermogen.


