  - number: '14.8'
    text: |-
      Voor distributiesystemen waarop overeenkomstig artikel 4, eerste lid, van de [Verordening (EU) 2016/1388]
      (33288R2016) (NC DCC), de [Verordening (EU) 2016/1388](33288R2016) (NC DCC) niet van toepassing is, zijn de
      volgende aanvullingen op [artikel 9.26][ref1] van toepassing:

      a. het frequentierelais is zodanig ingesteld, dat:

      1°. binnen 100 ms na het overschrijden van de in [artikel 9.26, eerste lid][ref2], genoemde frequentiegrenzen een
      uitschakelbevel volgt;

      2°. de werking van het relais wordt geblokkeerd als de meetspanning daalt tot beneden 70% van de nominale spanning;

      b. de meetonnauwkeurigheid van het relais bedraagt maximaal 10 mHz; en

      c. de storingsgevoeligheid van het relais is afgestemd op de installatie waarin het wordt toegepast, maar voldoet
      ten minste aan IEC 1000-4 klasse 3.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.26
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.26
