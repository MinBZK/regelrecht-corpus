  - number: 9.1b
    text: |-
      1 De netbeheerder kan voorschrijven dat de te leveren bijdrage aan het oplossen van fysieke congestie als bedoeld
      in [artikel 9.1, derde of vierde lid][ref1], een bieding voor redispatch is als bedoeld in [bijlage 11][ref2] of
      een aanbod voor capaciteitsbeperking als bedoeld in [bijlage 12, zevende lid][ref3], of beide.

      2 De netbeheerder maakt in een voorschrift als bedoeld in het eerste lid bekend of de te leveren bijdrage aan
      het oplossen van fysieke congestie als bedoeld in [artikel 9.1, derde of vierde lid][ref4], betrekking heeft op
      invoeding op het net of afname vanuit het net.

      3 De netbeheerder stelt de in [artikel 9.1, vierde lid][ref5], bedoelde waarde tussen 1 en 60 MW niet lager vast
      dan noodzakelijk is voor het oplossen van fysieke congestie. Deze waarde kan verschillen per congestiegebied en
      kan verschillen voor biedingen voor redispatch overeenkomstig [bijlage 11][ref6] en voor capaciteitsbeperking
      overeenkomstig [bijlage 12, zevende lid][ref7].


