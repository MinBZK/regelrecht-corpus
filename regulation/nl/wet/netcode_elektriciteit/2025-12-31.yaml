  - number: '11.3'
    text: |-
      1 Indien de netbeheerder van het landelijk hoogspanningsnet overeenkomstig [artikel 10.10, eerste lid][ref1],
      besluit tot intrekking van de erkenning van een BRP en tevens overeenkomstig [artikel 11.1, tweede lid][ref2],
      besluit tot opschorting van deze intrekking, verdeelt de netbeheerder van het landelijk hoogspanningsnet de
      balanceringsverantwoordelijkheid voor de aansluitingen waarvoor deze BRP op dat moment in het aansluitingenregister
      vermeld staat als volgt over de andere BRP's:

      a. de aansluitingen waarvoor de leverancier, daartoe gemachtigd overeenkomstig [artikel 10.4, vijfde lid][ref3],
      dan wel op grond van [artikel 95a, eerste lid][ref4] of [artikel 95n van de Elektriciteitswet 1998][ref5], de
      balanceringsverantwoordelijkheid heeft geregeld en heeft ondergebracht bij een andere rechtspersoon dan hijzelf,
      worden toegewezen aan de BRP die de leverancier onverwijld schriftelijk opgeeft aan de netbeheerder die het
      aangaat;

      b. voor de aansluitingen van grootverbruikers waarbij geen sprake is van machtiging van een leverancier voor
      het regelen van de balanceringsverantwoordelijkheid, geeft de grootverbruiker schriftelijk aan de betreffende
      netbeheerder op wie de balanceringsverantwoordelijkheid over gaat nemen;

      c. de aansluitingen van kleinverbruikers waarvoor de overdracht van de balanceringsverantwoordelijkheid niet tijdig
      is geregeld overeenkomstig onderdeel a, worden verdeeld over de overige BRP's naar rato van het aantal aangesloten
      kleinverbruikers waarvoor een BRP balanceringsverantwoordelijkheid draagt;

      d. de aansluitingen van grootverbruikers waarvoor de overdracht van de balanceringsverantwoordelijkheid niet
      tijdig is geregeld overeenkomstig onderdeel a of b, worden verdeeld naar rato van het totaal van de per aansluiting
      grootste individuele, of indien de aansluiting deel uitmaakt van een groepstransportovereenkomst, de grootste van
      de door middel van de groepstransportovereenkomst gecontracteerde waarde van het gecontracteerd transportvermogen
      voor afname en het gecontracteerde transportvermogens voor invoeding in deze categorie waarvoor een BRP
      balanceringsverantwoordelijkheid draagt.

      2 Indien de netbeheerder van het landelijk hoogspanningsnet overeenkomstig [artikel 10.10, eerste lid][ref6],
      besluit tot intrekking van de erkenning van een BRP, maar niet overeenkomstig [artikel 11.1, tweede lid][ref7],
      besluit tot opschorting van deze intrekking, wordt de balanceringsverantwoordelijkheid voor de aansluitingen
      waarvoor deze BRP op dat moment in het aansluitingenregister vermeld staat door de netbeheerder van het landelijk
      hoogspanningsnet over de andere BRP’s verdeeld overeenkomstig de onderdelen c en d van het eerste lid.

      3 De schriftelijke mededeling, genoemd in het eerste lid, onderdelen a en b, bevat tevens een bevestiging van die
      BRP dat hij de balanceringsverantwoordelijkheid op zich neemt.

      4 De verdeling, genoemd in het eerste lid, onderdelen c en d, wordt uitgevoerd in tienden van procenten, waarbij
      een minimum van vijf aansluitingen voor kleinverbruikers geldt.

      5 Bij verdeling van grootverbruikaansluitingen met een individueel, of, indien de aansluiting deel uitmaakt
      van een groepstransportovereenkomst, met een door middel van de groepstransportovereenkomst gecontracteerd
      transportvermogen boven de 10 MW, of bij substantiële hoeveelheden aansluitingen, kan de netbeheerder van het
      landelijk hoogspanningsnet vooraf in contact treden met betrokken BRP's ten aanzien van het aanpassen van de
      verdeling.

      6 De BRP's die op grond van het eerste lid, onderdeel c of d, aansluitingen toegewezen hebben gekregen,
      informeren zo spoedig mogelijk, maar uiterlijk binnen drie werkdagen na de verdeling, de betrokken
      aangeslotenen of hun leverancier, indien deze overeenkomstig [artikel 10.4, vijfde lid][ref8], is gemachtigd de
      balanceringsverantwoordelijkheid te regelen, over deze toewijzing en over de bij hen geldende voorwaarden en de
      opzeggingsmogelijkheden.

      7 De in het zesde lid bedoelde gemachtigde leveranciers stellen de grootverbruikers die hen gemachtigd hebben
      onverwijld in kennis van de in het eerste lid, onderdeel d, bedoelde toewijzing.

      8 Indien op grond van dit artikel de balanceringsverantwoordelijkheid van groepen aangeslotenen wijzigt, zorgt de
      netbeheerder die het aangaat ervoor dat de wisseling van balanceringsverantwoordelijkheid binnen één werkdag in het
      aansluitingenregister is verwerkt.

      9 De grootverbruiker wiens aansluiting via de in dit artikel bedoelde verdeling een andere BRP heeft toegewezen
      gekregen, heeft gedurende twee maanden het recht zonder opzegtermijn van BRP te wisselen.

      10 Een BRP die op grond van dit artikel de balanceringsverantwoordelijkheid voor aansluitingen toegewezen heeft
      gekregen, weigert deze toewijzing niet, tenzij hij voordat toewijzing plaatsvindt schriftelijk de netbeheerder
      van het landelijk hoogspanningsnet heeft gemeld niet voor deze toewijzing in aanmerking te willen komen en daarbij
      tevens tijdig gezamenlijk met een ontvangende BRP heeft aangegeven dat die ontvangende BRP alsdan zijn aandeel
      overneemt.

      11 De verwerkingstermijn van een melding, als bedoeld in het tiende lid, bedraagt maximaal twee weken.

      12 De ontvangende BRP, als bedoeld in het tiende lid, kan met toepassing van [artikel 10.6, eerste lid][ref9], de
      balanceringsverantwoordelijkheid opzeggen.


