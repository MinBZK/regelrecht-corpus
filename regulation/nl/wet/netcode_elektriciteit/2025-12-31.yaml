  - number: '13.35'
    text: |-
      1 Ten behoeve van beheer en onderhoud van de specificaties en protocollen, als bedoeld in
      [artikel 13.32, eerste lid][ref1], organiseren de gezamenlijke netbeheerders een overlegplatform, waarin
      zitting hebben een delegatie van de gezamenlijke netbeheerders en van representatieve organisaties van
      partijen op de elektriciteitsmarkt, die op basis van deze code gebruik maken van de bedoelde elektronische
      datacommunicatiemiddelen.

      2 De kosten van het overlegplatform ten behoeve van beheer en onderhoud zullen door het in het eerste lid bedoelde
      platform ten laste worden gebracht van de netbeheerders.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel13.32
