  - number: '13.1'
    text: |-
      1 Een aangeslotene die beschikt over een elektriciteitsproductie-eenheid aangesloten op het landelijk
      hoogspanningsnet, verstrekt de netbeheerder van het landelijk hoogspanningsnet de structurele gegevens van die
      elektriciteitsproductie-eenheid, te weten:

      a. de datum van inbedrijfname;

      b. het spanningsniveau van het overdrachtspunt van de aansluiting, waarachter de elektriciteitsproductie-eenheid
      zich bevindt;

      c. de primaire energiebron;

      d. de maximumcapaciteit;

      e. het minimale en maximale af te geven werkzaam vermogen en blindvermogen;

      f. welk type spanningsregeling, als bedoeld in [artikel 3.26, zesde lid][ref1], van toepassing is alsmede de plaats
      in het net waarop de regeling werkzaam is;

      g. de regelcapaciteit voor spanning en blindvermogen;

      h. de belasting ten behoeve van het eigen bedrijf;

      i. de gegevens en modellen van elke opwekkingseenheid die deel uitmaakt van de elektriciteitsproductie-eenheid, die
      nodig zijn voor het uitvoeren van een dynamische simulatie, te weten:

      1°. de tijd voor een koude en een warme start;

      2°. het type opwekkingseenheid, te weten synchroon, asynchroon, omvormer-gekoppeld of, in geval van een
      windturbine, of sprake is van een dubbelgevoede inductiemachine of direct drive;

      3°. het nominale vermogen;

      4°. in geval van een elektriciteitsproductie-eenheid bestaande uit meerdere zonnepanelen: in plaats van het in
      subonderdeel 3° genoemde nominale vermogen per opwekkingseenheid het totale vermogen van alle zonnepanelen van
      de elektriciteitsproductie-installatie en het totale vermogen van de omvormers van de elektriciteitsproductie-
      installatie;

      5°. de nominale spanning van de opwekkingseenheid;

      6°. de nominale arbeidsfactor;

      7°. de transiënte impedantie(s) en bijbehorende tijdconstante(n);

      8°. de subtransiënte impedantie(s) en bijbehorende tijdconstante(n);

      9°. de statorstrooi-impedantie(s);

      10°. in geval van een synchrone opwekkingseenheid de synchrone (langs- en dwars-) impedantie;

      11°. in geval van een synchrone opwekkingseenheid het regelbereik en de tijdconstanten van het
      bekrachtigingscircuit;

      12°. het traagheidsmoment (inclusief dat van de aandrijvende machine);

      13°. de overdrachtsfunctie en de instelparameters van de automatische spanningsregeling;

      14°. de overdrachtsfunctie en de instelparameters van de turbineregeling;

      j. de gegevens ten behoeve van kortsluitberekening, te weten:

      1°. de kortsluitbijdrage van de elektriciteitsproductie-eenheid;

      2°. in geval van een asynchrone of omvormer-gekoppelde opwekkingseenheid de verhouding kortsluitstroom / nominale
      stroom;

      k. de transformatorgegevens voor de elektriciteitsproductie-installatie waar de elektriciteitsproductie-eenheid
      deel van uitmaakt, te weten:

      1°. het nominale schijnbare vermogen;

      2°. de nominale spanning aan de primaire zijde;

      3°. de nominale spanning aan de secundaire zijde;

      4°. de nominale kortsluitspanning;

      5°. de nominale koper- of kortsluitverliezen;

      6°. de nominale ijzer- of nullastverliezen;

      7°. de schakelgroep van de wikkelingen;

      8°. de sterpuntsbehandeling, te weten zwevend, hard geaard, geaard via impedantie;

      9°. indien van toepassing de gegevens aangaande de regelschakelaar, te weten de hoogste trap, de laagste trap, de
      stapgrootte, de regelbaarheid, namelijk continu regelbaar (online) of spanningsloos instelbaar (offline);

      l. indien de elektriciteitsproductie-eenheid een bijdrage levert aan de FCR: de FCR-gegevens;

      m. indien de elektriciteitsproductie-eenheid een bijdrage levert aan de FRR: de FRR-gegevens;

      n. de voor het herstel van het landelijk hoogspanningsnet benodigde gegevens, te weten:

      1°. de stap-belastbaarheid;

      2°. de regelsnelheid;

      3°. of de elektriciteitsproductie-eenheid inschakelbaar is op een dode rail;

      4°. het een-fase schema van de elektrische installatie;

      5°. of de machinetransformator voorzien is van een point on wave schakelaar;

      o. de gegevens van de beveiligingsapparaten en -instellingen.

      2 De structurele gegevens als bedoeld in het eerste lid, worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref2],
      waarachter de elektriciteitsproductie-eenheid zich bevindt;

      b. de EAN-code van het overdrachtspunt waarachter de elektriciteitsproductie-eenheid zich bevindt, indien het een
      aansluiting betreft die meer dan één overdrachtspunt heeft, als bedoeld in [artikel 2.4, zevende lid][ref3];

      c. de EAN-code van de elektriciteitsproductie-eenheid, als bedoeld in [artikel 2.4, negende lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel3.26
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
      [ref4]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.1
