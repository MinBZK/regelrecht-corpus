  - number: '7.2'
    text: |-
      Op de aansluiting stelt de netbeheerder transportcapaciteit ter beschikking in de vorm van:

      a. éénfase-wisselstroom van lage spanning met een nominale frequentie van 50 Hertz en een nominale spanning van 230
      volt tussen fase en nul of tussen twee fasen;

      b. driefasen-wisselstroom van lage spanning met een nominale frequentie van 50 Hertz en een nominale spanning van
      400 volt tussen de fasen en van 230 volt tussen fasen en nul;

      c. driefasen-wisselstroom van lage spanning met een nominale frequentie van 50 Hertz en een nominale spanning van
      230 volt tussen de fasen;

      d. éénfase-wisselstroom van hoge spanning met een nominale frequentie van 50 Hertz, waarbij de nominale spanning is
      bepaald op basis van [artikel 2.25][ref1] en wordt vastgelegd in de aansluit- en transportovereenkomst;

      e. driefasen-wisselstroom van hoge spanning met een nominale frequentie van 50 Hertz, waarbij de nominale spanning
      is bepaald op basis van [artikel 2.25][ref2] en wordt vastgelegd in de aansluit- en transportovereenkomst.


