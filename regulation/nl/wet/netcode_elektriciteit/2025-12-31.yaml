  - number: 10.39a
    text: |-
      1 De prijs voor opregelen voor een bepaalde onbalansverrekeningsperiode is gelijk aan het maximum van de volgende
      onderdelen:

      a. de hoogste biedprijs van de geactiveerde aFRR-biedingen voor opregelen gedurende de betreffende
      onbalansverrekeningsperiode;

      b. [gereserveerd]

      c. de prijs voor ingezet noodvermogen voor opregelen bepaald overeenkomstig [artikel 10.39, negende lid][ref1]; en

      d. de hoogste biedprijs van de lokaal afgeroepen MARI-productbiedingen voor opregelen ingezet in het kader van
      [artikel 10.39, derde lid, onderdeel b,][ref2] indien van toepassing.

      2 De prijs voor afregelen voor een bepaalde onbalansverrekeningsperiode is gelijk aan het minimum van de volgende
      onderdelen:

      a. de laagste biedprijs van de ingezette aFRR-biedingen voor afregelen gedurende de betreffende
      onbalansverrekeningsperiode;

      b. [gereserveerd]

      c. de prijs voor ingezet noodvermogen voor afregelen bepaald overeenkomstig [artikel 10.39, tiende lid][ref3]; en

      d. de laagste biedprijs van de lokaal afgeroepen MARI-productbiedingen voor afregelen ingezet in het kader van
      [artikel 10.39, derde lid, onderdeel b][ref4], indien van toepassing.


