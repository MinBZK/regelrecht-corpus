  - number: '8.7'
    text: |-
      1 Vanaf het moment dat een aangeslotene de netbeheerder heeft verzocht geïnformeerd te worden over opgetreden
      spanningsdips, geeft de netbeheerder, nadat een hinderlijke spanningsdip door de netbeheerder is gesignaleerd of
      door een aangeslotene aan de netbeheerder is gemeld:

      a. de aangeslotene binnen tien werkdagen een indicatie van de oorzaak van de hinderlijke spanningsdip;

      b. zo spoedig mogelijk aan welke maatregelen hij treft ter voorkoming van toekomstige hinderlijke spanningsdips dan
      wel beargumenteert hij waarom maatregelen niet nodig zijn.

      2 De netbeheerder maakt informatie omtrent de diepte en duur alsmede de vermoedelijke oorzaak van de in het eerste
      lid bedoelde spanningsdips zo spoedig mogelijk, doch uiterlijk binnen tien werkdagen openbaar op zijn website.

      3 Indien de spanningsdip zijn oorsprong vindt in de installatie van de aangeslotene is het eerste lid van
      overeenkomstige toepassing op de desbetreffende aangeslotene jegens de netbeheerder.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel8.7
  - number: '8.8'
    text: |-
      1 De netbeheerder betaalt, uitgezonderd de in het tweede lid genoemde omstandigheden, aan aangeslotenen op zijn net
      of aan een groep van aangeslotenen die deel uitmaakt van een groepstransportovereenkomst bij wie de transportdienst
      ten gevolge van een storing wordt onderbroken, een compensatievergoeding ter hoogte van het hieronder genoemde
      bedrag:

      a. ingeval van een onderbreking van de transportdienst ten gevolge van een storing in een net met een
      spanningsniveau tot en met 1 kV:

      1°. per aansluiting gelijk aan 1 x 10 A op een net met een spanningsniveau tot en met 1 kV: € 0,– bij een
      onderbreking korter dan 4 uur dan wel € 10,– bij een onderbreking van 4 uur tot 8 uur, vermeerderd met € 5,–
      voor elke volgende aaneengesloten periode van 4 uur, uit te betalen binnen zes maanden na het herstel van de
      onderbreking.

      2°. per 1-fase aansluiting groter dan 1 x 10 A en per 3-fase aansluiting kleiner dan of gelijk aan 3 x 25 A op een
      net met een spanningsniveau tot en met 1 kV: € 0,– bij een onderbreking korter dan 4 uur dan wel € 35,– bij een
      onderbreking van 4 uur tot 8 uur, vermeerderd met € 20,– voor elke volgende aaneengesloten periode van 4 uur, uit
      te betalen binnen zes maanden na het herstel van de onderbreking.

      3°. per aansluiting groter dan 3 x 25 A op een net met een spanningsniveau tot en met 1 kV: € 0,– bij een
      onderbreking korter dan 4 uur dan wel € 195,– bij een onderbreking van 4 uur tot 8 uur, vermeerderd met € 100,–
      voor elke volgende aaneengesloten periode van 4 uur, uit te betalen binnen zes maanden na het herstel van de
      onderbreking.

      b. ingeval van een onderbreking van de transportdienst ten gevolge van een storing in een net met een
      spanningsniveau van 1 kV tot 35 kV:

      1°. per aansluiting gelijk aan 1 x 10 A op een net met een spanningsniveau tot en met 1 kV: € 0,– bij een
      onderbreking korter dan 4 uur dan wel € 10,– bij een onderbreking van 4 uur tot 8 uur, vermeerderd met € 5,–
      voor elke volgende aaneengesloten periode van 4 uur, uit te betalen binnen zes maanden na het herstel van de
      onderbreking.

      2°. per 1-fase aansluiting groter dan 1 x 10A en per 3-fase aansluiting kleiner dan of gelijk aan 3 x 25 A op een
      net met een spanningsniveau tot en met 1 kV € 0,– bij een onderbreking korter dan 4 uur dan wel € 35,– bij een
      onderbreking van 4 uur tot 8 uur vermeerderd met € 20,– voor elke volgende aaneengesloten periode van 4 uur, uit te
      betalen binnen zes maanden na het herstel van de onderbreking.

      3°. per aansluiting groter dan 3 x 25 A op een net met een spanningsniveau tot en met 1 kV: € 0,– bij een
      onderbreking korter dan 2 uur dan wel € 195,– bij een onderbreking van 2 uur tot 8 uur, vermeerderd met € 100,–
      voor elke volgende aaneengesloten periode van 4 uur, uit te betalen binnen zes maanden na het herstel van de
      onderbreking.

      4°. per aansluiting op een net met een spanningsniveau van 1 kV tot 35 kV: € 0,– bij een onderbreking korter
      dan 2 uur dan wel € 910,– bij een onderbreking van 2 uur tot 8 uur, vermeerderd met € 500,– voor elke volgende
      aaneengesloten periode van 4 uur, uit te betalen bij de eerstvolgende jaar- respectievelijk maandafrekening.

      c. ingeval van een onderbreking van de transportdienst ten gevolge van een storing in een net met een
      spanningsniveau van 35 kV of hoger:

      1°. per aansluiting gelijk aan 1 x 10 A op een net met een spanningsniveau tot en met 1 kV: € 0,– bij een
      onderbreking korter dan 4 uur dan wel € 10,– bij een onderbreking van 4 uur tot 8 uur, vermeerderd met € 5,–
      voor elke volgende aaneengesloten periode van 4 uur, uit te betalen binnen zes maanden na het herstel van de
      onderbreking.

      2°. per 1-fase aansluiting groter dan 1 x 10A en per 3-fase aansluiting kleiner dan of gelijk aan 3 x 25 A op een
      net met een spanningsniveau tot en met 1 kV: € 0,– bij een onderbreking korter dan 4 uur dan wel € 35,– bij een
      onderbreking van 4 uur tot 8 uur, vermeerderd met € 20,– voor elke volgende aaneengesloten periode van 4 uur, uit
      te betalen binnen zes maanden na het herstel van de onderbreking.

      3°. per aansluiting groter dan 3 x 25 A op een net met een spanningsniveau tot en met 1 kV: € 0,– bij een
      onderbreking korter dan 1 uur dan wel € 195,– bij een onderbreking van 1 uur tot 8 uur, vermeerderd met € 100,–
      voor elke volgende aaneengesloten periode van 4 uur, uit te betalen binnen zes maanden na het herstel van de
      onderbreking.

      4°. per aansluiting op een net met een spanningsniveau van 1 kV tot 35 kV: € 0,– bij een onderbreking korter
      dan 1 uur dan wel € 910,– bij een onderbreking van 1 uur tot 8 uur, vermeerderd met € 500,– voor elke volgende
      aaneengesloten periode van 4 uur, uit te betalen bij de eerstvolgende jaar- respectievelijk maandafrekening.

      5°. per aansluiting, of, indien sprake is van een groepstransportovereenkomst, per groep van aansluitingen op een
      net met een spanningsniveau van 35 kV en hoger: € 0,– bij een onderbreking korter dan 1 uur dan wel € 0,35 per kW
      van de hoogste waarde van het gecontracteerd transportvermogen voor afname of het gecontracteerd transportvermogen
      voor invoeding bij een onderbreking van 1 uur tot 8 uur, vermeerderd met € 0,20 per kW van de hoogste waarde
      van het gecontracteerd transportvermogen voor afname of het gecontracteerd transportvermogen voor invoeding
      voor elke volgende aaneengesloten periode van 4 uur, uit te betalen bij de eerstvolgende jaar- respectievelijk
      maandafrekening.

      2 De in het eerste lid genoemde verplichting geldt niet:

      a. wanneer een onderbreking van de transportdienst het gevolg is van een automatische afschakeling van belasting
      als bedoeld in [artikel 9.26, eerste lid][ref1], of een handmatige afschakeling van belasting op verzoek van de
      netbeheerder van het landelijk hoogspanningsnet als bedoeld in [artikel 9.20][ref2];

      b. wanneer de netbeheerder kan aantonen dat deze netbeheerder als gevolg van een extreme situatie niet binnen
      de hersteltijden, als bedoeld in het eerste lid, een onderbreking kan herstellen. Met een extreme situatie wordt
      bedoeld een incident dat zo weinig voorkomt dat het oneconomisch zou zijn om daarmee rekening te houden in de
      reguleringssystematiek en dat bovendien niet beïnvloed kan worden door de netbeheerder. Een incident is een niet te
      voorziene gebeurtenis of situatie die redelijkerwijs buiten de controle van een netbeheerder ligt en niet te wijten
      is aan een fout van een netbeheerder. Hierbij kan gedacht worden aan aardbevingen, overstromingen, uitzonderlijke
      weersomstandigheden, terroristische aanslagen en oorlog;

      c. wanneer een onderbreking van de transportdienst het gevolg is van een storing in een net met een spanningsniveau
      van 220 kV of hoger;

      d. voor aansluitingen ten behoeve van openbare verlichting alsmede voor (overige) aansluitingen in de categorie
      kleiner dan of gelijk aan 1x6 A;

      e. voor aansluitingen op het net op zee; of

      f. wanneer een vergoeding wordt betaald op grond van [artikel 8.10][ref3].

      3 Indien een onderbreking van de transportdienst zijn oorsprong vindt in het net van een andere netbeheerder,
      komen de in het eerste lid bedoelde compensatievergoedingen voor rekening van de netbeheerder van het net waarin de
      onderbreking zijn oorsprong vindt.

      4 De in het eerste lid genoemde termijnen vangen voor alle door de onderbreking van de transportdienst getroffen
      aangeslotenen aan op het moment dat de netbeheerder de eerste melding van die onderbreking van een aangeslotene
      ontvangt of, indien dat eerder is, op het moment van vaststelling van de onderbreking door de netbeheerder.

      5 In aanvulling op het eerste lid geldt dat indien de aangeslotene en de netbeheerder een recht op transport
      zijn overeengekomen, als bedoeld in [artikel 7.1b][ref4], [artikel 7.1c][ref5] of [artikel 7.1d][ref6], voor de
      desbetreffende aansluiting alleen de uren waarvoor transport door de netbeheerder aan de aangeslotene beschikbaar
      zou zijn gesteld, meetellen voor de bepaling van de compensatievergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.26
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel9.20
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel8.10
