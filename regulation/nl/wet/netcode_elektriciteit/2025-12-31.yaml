  - number: 7.1d
    text: |-
      1 Een tijdsblokgebonden recht op transport geeft de aangeslotene recht op transport gedurende de in de aansluit- en
      transportovereenkomst genoemde tijdsblokken in hele uren tot een hoeveelheid ter grootte van het in de aansluit- en
      transportovereenkomst genoemde deel van het op de aansluiting gecontracteerde transportvermogen voor afname of voor
      invoeding, indien van toepassing gedifferentieerd per tijdsblok, met inachtneming van [paragraaf 7.4][ref1], met
      uitzondering van [artikel 7.15, eerste lid][ref2] en [artikel 7.16, eerste en derde lid][ref3].

      2 Ten behoeve van een tijdsblokgebonden recht op transport, als bedoeld in het eerste lid, leggen de aangeslotene
      en de netbeheerder tenminste de productvoorwaarden als bedoeld in [bijlage 23][ref4], tweede lid, vast in de
      aansluit- en transportovereenkomst.

      3 Het tijdsblokgebonden recht op transport, als bedoeld in het eerste lid, is beschikbaar voor een grootverbruiker
      aangesloten op een regionaal net, waarbij geldt dat:

      a. de netbeheerder door middel van netberekeningen aannemelijk kan maken welke blokken voor de desbetreffende
      aangeslotene beschikbaar zijn, waarbij de piekbelasting inclusief bijdrage van de aangeslotene op de desbetreffende
      locatie of elders in het net niet hoger wordt dan de piekbelasting zonder die bijdrage; en

      b. de tariefstructuren als bedoeld in de [artikelen 3.7.17 tot en met 3.7.19 van de Tarievencode elektriciteit][ref5]
      van toepassing zijn


