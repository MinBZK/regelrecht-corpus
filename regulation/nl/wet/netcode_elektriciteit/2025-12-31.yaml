  - number: '9.12'
    text: |-
      1 De netbeheerder past de vrijstellingen voor productie uit [artikel 4a.1, onderdeel a, subonderdeel 2°][ref1],
      [artikel 4a.2, onderdeel a, subonderdeel 2°][ref2], [artikel 4a.3, onderdeel a, subonderdeel 2°][ref3],
      artikel 4a.3, onderdeel b, subonderdeel 2°, [artikel 4a.4, eerste lid, onderdeel a, subonderdeel 2°][ref4]
      en artikel 4a.4, eerste lid, onderdeel b, subonderdeel 2°, van het
      [Besluit investeringsplan en kwaliteit elektriciteit en gas][ref5] toe indien de op grond van deze vrijstellingen
      aan te sluiten of aangesloten productie afkomstig is van elektriciteitsproductie-eenheden die, overeenkomstig
      [artikel 3.15, dertiende lid][ref6], automatisch, voldoende snel en selectief kunnen worden afgeschakeld
      of afgeregeld zonder dat ook verbruik mee wordt afgeschakeld, behoudens verbruik dat gerelateerd is aan die
      elektriciteitsproductie-eenheid.

      2 In aanvulling op het eerste lid geldt dat de netbeheerder de vrijstellingen voor productie uit
      [artikel 4a.1, onderdeel a, subonderdeel 2°][ref7], [artikel 4a.2, onderdeel a, subonderdeel 2°][ref8],
      [artikel 4a.3, onderdeel a, subonderdeel 2°][ref9], artikel 4a.3, onderdeel b, subonderdeel 2°,
      [artikel 4a.4, eerste lid, onderdeel a, subonderdeel 2°][ref10] en artikel 4a.4, eerste lid, onderdeel b,
      subonderdeel 2°, van het [Besluit investeringsplan en kwaliteit elektriciteit en gas][ref11] toepast indien de
      op grond van deze vrijstellingen aan te sluiten of aangesloten elektriciteitsproductie-eenheid tevens voldoet aan
      de eisen van [artikel 13.22][ref12], onafhankelijk van de grootte van de maximumcapaciteit van de aan te sluiten
      elektriciteitsproductie-eenheid.

      3 De netbeheerder kan bij het toepassen van de vrijstellingen voor productie uit
      [artikel 4a.1, onderdeel a, subonderdeel 2°][ref13], [artikel 4a.2, onderdeel a, subonderdeel 2°][ref14],
      [artikel 4a.3, onderdeel a, subonderdeel 2°][ref15], artikel 4a.3, onderdeel b, subonderdeel 2°,
      [artikel 4a.4, eerste lid, onderdeel a, subonderdeel 2°][ref16] en artikel 4a.4, eerste lid, onderdeel b,
      subonderdeel 2°, van het[ Besluit investeringsplan en kwaliteit elektriciteit en gas][ref17] gebruik maken van de
      in artikel 13, zesde lid, en artikel 14, tweede lid, onderdeel a, van [Verordening (EU) 2016/631](32531R2016) (NC
      RfG) bedoelde interface of de in artikel 15, tweede lid, onderdeel a, van [Verordening (EU) 2016/631](32531R2016)
      (NC RfG) bedoelde regelbaarheid.

      4 Het netontwerp wordt ten minste getoetst aan:

      a. de actuele en de te verwachten transporten van elektriciteit als bedoeld in het
      [Besluit Investeringsplan kwaliteit elektriciteit en gas, paragraaf 4a][ref18];

      b. de criteria met betrekking tot kortsluitvastheid als bedoeld in hoofdstuk 3 van *Verordening (EU) 2017/1485 (GL
      SO)* en toegepast in hoofdstuk 2 en artikel 7.10, vierde lid;

      c. de criteria met betrekking tot de spannings- en blindvermogenshuishouding als bedoeld in paragraaf 9.4;

      d. de isolatiecoördinatie van netten met spanningsniveau hoger dan 1 kV als bedoeld in NEN-EN-IEC 60071;

      e. de criteria met betrekking tot de aanraakveiligheid als bedoeld in [paragraaf 7.3][ref19];

      f. de criteria met betrekking tot de kwaliteit van de netspanning, als bedoeld in [paragraaf 7.2][ref20]; en

      g. de criteria met betrekking tot dynamische stabiliteit van de hoogspanningsnetten als bedoeld in hoofdstuk 6 van
      *Verordening (EU) 2017/1485 (GL SO)*.

      5 De netbeheerder en de aangeslotene kunnen gezamenlijk overeenkomen dat de netbeheerder de aansluiting afschakelt
      of afregelt, in plaats van alleen de elektriciteitsproductie-eenheid, indien de aangeslotene er mee instemt dat in
      dat geval ook eventueel verbruik maximaal tien minuten wordt afgeschakeld of afgeregeld.

      6 Indien na het optreden van een uitvalsituatie als bedoeld in
      [artikel 4a.1, onderdeel a, subonderdeel 2°][ref21], [artikel 4a.2, onderdeel a, subonderdeel 2°][ref22],
      [artikel 4a.3, onderdeel a, subonderdeel 2°][ref23], artikel 4a.3, onderdeel b, subonderdeel 2°,
      [artikel 4a.4, eerste lid, onderdeel a, subonderdeel 2°][ref24] en artikel 4a.4, eerste lid, onderdeel b,
      subonderdeel 2°, van het [Besluit investeringsplan en kwaliteit elektriciteit en gas][ref25] aangeslotenen
      gezamenlijk overeenkomen de afschakeling of afregeling uit te ruilen, dienen zij hiertoe een verzoek in bij de
      netbeheerder. De netbeheerder zal een verzoek hiertoe niet op onredelijke gronden weigeren.


