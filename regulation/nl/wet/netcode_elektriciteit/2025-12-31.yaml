  - number: 7.1g
    text: |-
      1 Alvorens een groepstransportovereenkomst in werking treedt en voorts bij elke wijziging van de
      groepstransportovereenkomst vergewist de netbeheerder zich ervan dat de groep in staat is te borgen dat het
      gecontracteerd transportvermogen en, indien van toepassing, de in [artikel 7.1f, tweede lid][ref1], bedoelde
      beperking, niet worden overschreden.

      2 Voor de toetsing zoals bedoeld in het eerste lid stellen de gezamenlijke netbeheerders in samenspraak met
      relevante organisaties transparante toetsingsprotocollen op, welke uiterlijk 1 juli 2026 gepubliceerd worden op een
      door of namens de gezamenlijke netbeheerders beheerde website.

      3 Bij toetsing zoals bedoeld in het eerste lid maakt de netbeheerder gebruik van de volgens het tweede lid door
      de gezamenlijke netbeheerders opgestelde toetsingsprotocollen, of van eigen transparante en vooraf bekend gemaakte
      toetsingsprotocollen indien de door de gezamenlijke netbeheerders opgestelde toetsingsprotocollen nog niet
      beschikbaar zijn.

      4 De netbeheerder rondt de toetsing zoals bedoeld in het eerste lid af binnen een redelijke termijn en informeert
      de gemachtigde van een groep schriftelijk en op basis van een deugdelijke motivering over de uitkomst van de
      toetsing, waarbij de netbeheerder de relevante informatie die is betrokken bij de toetsing deelt met de gemachtigde
      van een groep van aangeslotenen.

      5 De netbeheerder stelt een groep van aangeslotenen in de gelegenheid om eventuele tekortkomingen die de
      netbeheerder heeft geconstateerd in de toetsing, zoals bedoeld in het eerste lid, binnen een redelijke termijn te
      herstellen, alvorens een groep af te wijzen indien niet is voldaan aan het eerste lid.


