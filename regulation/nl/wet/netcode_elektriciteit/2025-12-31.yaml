  - number: '12.20'
    text: |-
      1 Indien, bij de bepaling van de transportcapaciteit in [artikel 12.18][ref1], de transportcapaciteit wordt beperkt
      door de capaciteit van verbindingen in het net die niet tot de landsgrensoverschrijdende verbindingen behoren, zal
      deze beperking eerst zoveel mogelijk door operationele middelen worden opgelost alvorens de transportcapaciteit
      wordt beperkt.

      2 Bij het bepalen van capaciteitsdomein geldt, gelet op artikel 16, derde lid, van [Verordening 714/2009]
      (32009R0714), het principe dat de maximale capaciteit van de grensoverschrijdende verbindingen en/of de maximale
      capaciteit van de transmissienetten waarmee grensoverschrijdende elektriciteitsstromen worden verzorgd (samen
      de ‘kritieke netcomponenten’) beschikbaar wordt gesteld, zulks in overeenstemming met de voor een bedrijfszekere
      exploitatie van het net geldende veiligheidsnormen.

      3 Indien de transportcapaciteit, danwel het capaciteitsdomein, wordt beperkt doordat de kwaliteit van de
      transportdienst als beschreven in [artikel 7.3][ref2] niet kan worden gehandhaafd, zal deze beperking eerst zoveel
      mogelijk door middel van inzet van operationele middelen dienen te worden opgelost alvorens de transportcapaciteit,
      danwel het capaciteitsdomein, wordt beperkt.

      4 Stuurbare netelementen, waaronder mede verstaan worden dwarsregeltransformatoren, worden in de berekeningen
      zodanig bedreven dat een zo hoog mogelijke transportcapaciteit, danwel een voor de markt optimaal
      capaciteitsdomein, wordt verkregen.

      5 De netbeheerder van het landelijk hoogspanningsnet bepaalt de belastbaarheid van de netcomponenten gedurende de
      winterperiode aan de hand van een kwantitatief onderzoek.

      6 De in [artikel 12.18][ref3] genoemde scenario’s beschrijven de transporten in het net op basis van een aantal
      samenhangende uitgangspunten en verschillen onderling in de keuze van belasting en belastingverdeling over het
      net en in de keuze van productie en productieverdeling over het net, waarbij ook de inzet van productie in het
      buitenland wordt beschouwd. De scenario’s zijn realistisch, waaronder verstaan wordt dat zij elk afzonderlijk een
      mogelijke en zinvolle combinatie van belastingen productieverdeling beschrijven. Voor wat betreft de belasting en
      belastingverdeling over de netten in het buitenland wordt voor alle scenario’s uitgegaan van de situatie die zo
      goed mogelijk overeenkomt met de te verwachten situatie bij een volledig beschikbaar net.

      7 Ten behoeve van het in [artikel 12.1, tweede en derde lid][ref4] en [12.2, derde lid][ref5], gestelde
      berekent de netbeheerder van het landelijk hoogspanningsnet de veilig beschikbare landsgrensoverschrijdende
      transportcapaciteit, het capaciteitsdomein en de capaciteit voor noodzakelijk transport van elektriciteit in
      het kader van onderlinge hulp en bijstand ten behoeve van de instandhouding van de integriteit van de netten in
      overeenstemming met de in de [artikelen 12.18 tot en met 12.21][ref6] beschreven methode op basis van de hem ter
      beschikking staande meest actuele informatie, waaronder mede verstaan worden de verwachte belastbaarheid van de
      netcomponenten voor de betreffende dag. Hiertoe past hij zo nodig de gehanteerde scenario’s aan mede op basis van
      de hem ter beschikking staande informatie omtrent de beschikbaarheid van elektriciteitsproductie-installaties in
      Europa.


