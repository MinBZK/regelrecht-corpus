  - number: '13.32'
    text: |-
      1 Ten behoeve van de gegevensuitwisseling, als bedoeld in de [artikelen 10.11 tot en met 10.28][ref1],
      [artikel 10.36][ref2], en de [artikelen 13.1 tot en met 13.8][ref3], [artikelen 13.11 tot en met 13.18][ref4],
      stellen de netbeheerder van het landelijk hoogspanningsnet en de overige netbeheerders in onderling overleg regels
      vast ten aanzien van hetgeen tussen de netbeheerders onderling alsmede tussen hen en BRP's, BSP’s, CSP’s en voor
      zover van toepassing aangeslotenen en partijen die namens andere partijen deelnemen aan het in het eerste lid
      bedoelde berichtenverkeer en die op grond van [artikel 13.33][ref5] zijn gecertificeerd voor het gebruik van de
      desbetreffende berichten geldt omtrent:

      a. berichtspecificaties voor de (elektronische) berichtenuitwisseling waaronder mede begrepen gegevensuitwisseling
      via een webportal;

      b. procedures en specificaties van het te gebruiken centrale communicatiesysteem voor de geautomatiseerde
      berichtenuitwisseling waaronder mede begrepen gegevensuitwisseling via een webportal:

      c. communicatieprotocollen voor de dagelijkse gegevensuitwisseling;

      d. specificaties waaraan de energieprogramma’s en daarmee verband houdende berichten voldoen;

      e. specificaties waaraan de prognoses voldoen;

      f. het tijdschema waarbinnen het aanleveren en wijzigen van prognoses geschiedt;

      g. specificaties waaraan de kwaliteitscontrole van de gegevensuitwisseling voldoet;

      h. de bewaartermijn voor de verschillende soorten berichten, waarbij rekening wordt gehouden met wettelijke
      bewaartermijnen en met het doel van het desbetreffende bericht; en

      i. specificaties waaraan de balanceringsinformatie en daarmee verband houdende berichten voldoen.

      2 Het in het eerste lid bedoelde centrale communicatiesysteem wordt beheerd door de netbeheerder van het landelijk
      hoogspanningsnet.

      3 De netbeheerder van het landelijk hoogspanningsnet stelt iedere BRP, BSP, CSP en voor zover van toepassing de
      relevante aangeslotenen en partijen die namens andere partijen deelnemen of willen deelnemen aan het in het eerste
      lid bedoelde berichtenverkeer op de hoogte van de in het eerste lid bedoelde regels door toezending daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.11
