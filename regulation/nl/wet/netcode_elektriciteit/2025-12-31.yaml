  - number: '10.32'
    text: |-
      1 Een BRP is aan de netbeheerder van het landelijk hoogspanningsnet een onmiddellijk opeisbare boete
      van € 1.000,– verschuldigd voor iedere keer dat zij haar energieprogramma niet vóór het daarvoor in
      [artikel 10.11, eerste lid][ref1] bepaalde tijdstip via het in [paragraaf 13.5][ref2] bedoelde centrale
      communicatiesysteem heeft ingediend, te verhogen met € 200,– voor ieder vol uur na dat tijdstip waarin indiening
      van het energieprogramma uitblijft.

      2 Een BRP is aan de netbeheerder van het landelijk hoogspanningsnet een onmiddellijk opeisbare boete
      van € 1.000,– verschuldigd voor iedere keer dat een energieprogramma wordt afgekeurd overeenkomstig
      [artikel 10.14, eerste lid][ref3].

      3 In het in het tweede lid bedoelde geval is de BRP aan de netbeheerder van het landelijk hoogspanningsnet
      bovendien een onmiddellijk opeisbare additionele boete van € 1.000,– verschuldigd wanneer zij niet uiterlijk om
      24:00 uur op dezelfde dag een gewijzigd energieprogramma heeft ingediend dat kan worden goedgekeurd overeenkomstig
      [artikel 10.14, eerste lid][ref4].

      4 De in het vierde lid bedoelde additionele boete bedraagt € 4.000,– voor iedere volgende keer dat zich
      binnen hetzelfde kalenderjaar voordoet dat de BRP niet uiterlijk om 24:00 uur op dezelfde dag een gewijzigd
      energieprogramma heeft ingediend.

      5 De in het eerste tot en met derde lid genoemde boetes worden in voorkomend geval gecumuleerd. De netbeheerder
      van het landelijk hoogspanningsnet restitueert aan de BRP zonder vergoeding van rente de op grond van de in het
      tweede tot en met vierde lid geïnde boetes indien en nadat de BRP schriftelijk jegens de netbeheerder van het
      landelijk hoogspanningsnet heeft verklaard dat de desbetreffende energietransactie(s) door de BRP juist was (waren)
      verantwoord.


