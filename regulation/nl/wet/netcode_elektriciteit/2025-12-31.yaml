  - number: '2.17'
    text: |-
      1 De aangeslotene onderhoudt de elektrische installatie naar behoren.

      2 Bij aanleg van nieuwe elektrische installaties, alsmede bij uitbreiding, wijziging of vernieuwing van bestaande
      elektrische installaties waarbij de aansluiting dan wel de meetinrichting moet worden uitgebreid of gewijzigd,
      geeft de aangeslotene de netbeheerder zo spoedig mogelijk schriftelijk, op de door de netbeheerder aangegeven
      wijze, op:

      a. zijn naam, volledige adres en telefoonnummer;

      b. het volledige adres en de bestemming van het perceel, waarin of waarop de werkzaamheden zullen worden verricht;
      en

      c. de naam, het volledige adres en het telefoonnummer van degene die de werkzaamheden verricht.

      3 Ten minste drie volle werkdagen voor het gereedkomen van een nieuwe elektrische installatie respectievelijk van
      de uitbreiding, wijziging of vernieuwing van een bestaande elektrische installatie waarbij de aansluiting dan wel
      de meetinrichting moet worden uitgebreid of gewijzigd, stelt de aangeslotene hiervan de netbeheerder op de door de
      netbeheerder aangegeven wijze in kennis.

      4 Onverminderd het bepaalde in het derde lid wordt een uitbreiding, wijziging of vernieuwing van een elektrische
      installatie geacht gereed te zijn, indien deze elektrische installatie geheel of gedeeltelijk is aangesloten.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.17
  - number: '2.18'
    text: |-
      1 Indien naar het oordeel van de netbeheerder redelijke twijfel bestaat of een elektrische installatie voldoet aan
      de van toepassing zijnde bepalingen van deze code, toont de aangeslotene aan dat zijn elektrische installatie aan
      deze bepalingen voldoet.

      2 Wanneer de aangeslotene in gebreke blijft, is de netbeheerder bevoegd om de elektrische installatie zelf te
      onderzoeken of te laten onderzoeken.

      3 Indien een elektrische installatie naar het oordeel van de netbeheerder niet voldoet aan het bepaalde in deze
      code, herstelt de aangeslotene de gebreken, zo nodig onmiddellijk. De netbeheerder kan door de aangeslotene daarbij
      in acht te nemen aanwijzingen geven.

      4 De netbeheerder heeft geen verplichting om na te gaan of aan het in deze code bepaalde is voldaan.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.18
  - number: '2.19'
    text: |-
      In aanvulling op de voorwaarden in [paragraaf 2.1][ref1] gelden voor een aansluiting op een wisselstroomnet met een
      spanningsniveau kleiner dan of gelijk aan 1 kV de voorwaarden van deze paragraaf.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.19
    references:
      - id: ref1
        bwb_id: BWBR0037940
        hoofdstuk: '2'
        paragraaf: '2.1'
  - number: '2.20'
    text: |-
      1 In percelen waar de elektrische installatie door middel van een in de grond gelegde kabel wordt aangesloten,
      worden voorzieningen getroffen voor het gemakkelijk en gasbelemmerend binnenleiden van deze kabel, waaronder in
      ieder geval een beschermbuis waarvan de netbeheerder het materiaal en de afmetingen bepaalt, tenzij de netbeheerder
      uitdrukkelijk te kennen heeft gegeven zulks niet noodzakelijk te achten. In het geval een leidinginvoerput wordt
      aangebracht, voldoet deze aan NEN 2768:2016+A2:2022 "Meterruimten en bijbehorende bouwkundige voorzieningen in
      woningen".

      2 In woonhuizen met individuele meting wordt voor het onderbrengen van alle tot de aansluiting en meetinrichting
      behorende apparatuur een kast ter beschikking gesteld, die voldoet aan de eisen, gesteld in NEN 2768:2016+A2:2022
      "Meterruimten en bijbehorende bouwkundige voorzieningen in woningen". In geval de meteropname van buitenaf kan
      geschieden of het overdrachtspunt van buitenaf bereikbaar is, kan de netbeheerder ten aanzien van deze kast nadere
      eisen stellen.

      3 Bij andere aansluitingen dan bedoeld in het tweede lid wijst de netbeheerder, na overleg met de aangeslotene,
      de ter beschikking te stellen ruimten aan voor het onderbrengen van de tot de aansluiting en de meetinrichting
      behorende apparatuur. De netbeheerder stelt de eisen vast waaraan deze ruimten voldoen.

      4 De aangeslotene stelt voor de aansluiting van een tijdelijke installatie een stevige, deugdelijk afsluitbare kast
      of ruimte ter beschikking aan de netbeheerder, waarvan de netbeheerder de afmetingen en constructie bepaalt, voor
      het opstellen van de tot de aansluiting behorende apparatuur.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.20
  - number: '2.21'
    text: |-
      1 Het gezamenlijke nominale vermogen van motoren in een installatie die niet van afzonderlijke of
      gemeenschappelijke nulspanningsbeveiliging zijn voorzien bedraagt niet meer dan 10 kW, dan wel een met de
      netbeheerder in individuele gevallen overeengekomen hogere waarde.

      2 De netbeheerder kan in gevallen van gemeenschappelijke nulspanningsbeveiligingen verlangen dat inschakeling niet
      kan plaatsvinden dan nadat alle desbetreffende motoren zijn uitgeschakeld.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.21
  - number: '2.22'
    text: |-
      Tussen de elektrische installatie achter een aansluiting en de elektrische installatie achter een andere
      aansluiting bestaat geen verbinding, tenzij de netbeheerder anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel2.22
  - number: '2.23'
    text: |-
      1 Het bepaalde in [artikel 2.39][ref1] is van overeenkomstige toepassing op laagspanningsaansluitingen indien deze
      deel uitmaken van aansluitingen als bedoeld in [artikel 16c, tweede lid, van de Elektriciteitswet 1998][ref2].

      2 Indien de aansluitingswerkzaamheden met betrekking tot het verbreken van het laagspanningsnet, om een fysieke
      verbinding van de installatie van de aangeslotene met dat laagspanningsnet tot stand te brengen, onder spanning
      dient plaats te vinden ten behoeve van de handhaving van de ongestoorde transportdienst bij andere aangeslotenen,
      toont het bedrijf dat de aansluitingswerkzaamheden verricht aan dat:

      a. de personen die de bedoelde werkzaamheden uitvoeren, beschikken over de in [artikel 2.39, vijfde lid][ref3],
      bedoelde aanwijzingen;

      b. de personen die de bedoelde werkzaamheden uitvoeren, beschikken over de voor het onder spanning werken vereiste
      aanvullende opleidingen en bevoegdheden; en

      c. de werkzaamheden worden uitgevoerd met voor onder spanning werken geëigende materialen en gereedschappen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.39
      [ref2]: https://wetten.overheid.nl/BWBR0009755#Artikel16c
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.39
