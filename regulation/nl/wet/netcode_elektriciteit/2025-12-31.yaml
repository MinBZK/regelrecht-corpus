  - number: '13.8'
    text: |-
      1 Een aangeslotene die beschikt over een HVDC-systeem of een DC-aangesloten power park module, aangesloten op het
      landelijk hoogspanningsnet, verstrekt de netbeheerder van het landelijk hoogspanningsnet de structurele gegevens
      van dat HVDC-systeem of die DC-aangesloten power park module, te weten:

      a. de maximale HVDC-transportcapaciteit van werkzaam vermogen of de maximumcapaciteit;

      b. het minimale en maximale af te geven en op te nemen werkzaam vermogen en de maximale regelsnelheid;

      c. de minimale en maximale regelcapaciteit en de maximale regelsnelheid voor spanning en blindvermogen;

      d. indien van toepassing: de prioritering van de operationele modus voor werkzaam vermogen of blindvermogen;

      e. de topologie, componentwaarden en regeling van filters en filterbatterijen;

      f. de topologie, componentwaarden en regeling van compensatie van reactief vermogen;

      g. de frequentieresponsiecapaciteit;

      h. de gegevens en modellen die nodig zijn voor het uitvoeren van een dynamische simulatie, als genoemd in
      [artikel 6.27][ref1];

      i. de gegevens ten behoeve van kortsluitberekening, als bedoeld in [artikel 6.8][ref2], [6.14][ref3] en
      [6.15][ref4] alsmede de verhouding tussen de kortsluitstroom en de nominale stroom;

      j. de gegevens van de beveiligingsapparaten en -instellingen, als bedoeld in [artikel 6.22][ref5].

      k. de transformatorgegevens, te weten:

      1°. het nominale schijnbare vermogen;

      2°. de nominale spanning aan de primaire zijde;

      3°. de nominale spanning aan de secundaire zijde;

      4°. de nominale kortsluitspanning;

      5°. de nominale koper- of kortsluitverliezen;

      6°. de nominale ijzer- of nullastverliezen;

      7°. de schakelgroep van de wikkelingen;

      8°. de sterpuntsbehandeling, te weten: zwevend, hard geaard, geaard via impedantie;

      9°. indien van toepassing de gegevens aangaande de regelschakelaar, te weten: de hoogste trap, de laagste trap, de
      stapgrootte, de regelbaarheid, namelijk continu regelbaar (online) of spanningsloos instelbaar (offline).

      2 De structurele gegevens, zoals bedoeld in het eerste lid, worden verstrekt onder vermelding van:

      a. de EAN-code van de aansluiting, als bedoeld in [artikel 2.1.1 van de Informatiecode elektriciteit en gas][ref6],
      waarachter dat HVDC-systeem of die DC-aangesloten power park module zich bevindt;

      b. de EAN-code van het overdrachtspunt waarachter dat HVDC-systeem of die DC-aangesloten power park module
      zich bevindt, indien het een aansluiting betreft die meer dan één overdrachtspunt heeft, als bedoeld in
      [artikel 2.4, zevende lid][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel6.27
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel6.8
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel6.14
      [ref4]: https://wetten.overheid.nl/BWBR0037940#Artikel6.15
      [ref5]: https://wetten.overheid.nl/BWBR0037940#Artikel6.22
      [ref6]: https://wetten.overheid.nl/BWBR0037934#Artikel2.1.1
      [ref7]: https://wetten.overheid.nl/BWBR0037940#Artikel2.4
