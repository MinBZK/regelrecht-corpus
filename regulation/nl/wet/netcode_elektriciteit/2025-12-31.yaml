      1 Bij de uitvoering van [artikel 9.6][ref1] en [artikel 9.7][ref2] kan de netbeheerder voor invoedings-
      congestiegebieden tot zes maanden na inwerkingtreding van dit besluit en voor afname-congestiegebieden tot
      twaalf maanden na inwerkingtreding van dit besluit de bepaling van de technische grens, als bepaald op grond
      van [artikel 9.10, tweede lid, onderdeel d][ref3], en de definitie van regelbaar vermogen als bedoeld in
      [artikel 1.1 van de Begrippencode elektriciteit][ref4], als die luidden tussen 25 november 2022 en 18 april 2024,
      hanteren.

      2 Vanaf zes maanden na inwerkingtreding van dit besluit voor invoedings-congestiegebieden en vanaf twaalf
      maanden na inwerkingtreding van dit besluit voor afname-congestiegebieden zijn de onderzoeksrapporten als
      bedoeld in [artikel 9.10, derde lid][ref5], in overeenstemming met de bepaling van de technische grens, als
      bepaald op grond van artikel 9.10, tweede lid onderdeel d, en de definitie van regelbaar vermogen, als bedoeld in
      [artikel 1.1 van de Begrippencode elektriciteit][ref6].


