  - number: 7.1b
    text: |-
      1 Een volledig variabel recht op transport geeft de aangeslotene recht op transport ter grootte van het
      transportvermogen dat de netbeheerder uiterlijk voor de gatesluitingstijd van de day-aheadmarkt op de dag
      voorafgaande aan de dag waarop het beoogde transport zal plaatsvinden ten behoeve van de aangeslotene vrijgeeft.

      2 Ten behoeve van een volledig variabel recht op transport als bedoeld in het eerste lid, leggen de aangeslotene en
      de netbeheerder tenminste de productvoorwaarden als bedoeld in [bijlage 23][ref1], eerste lid, vast in de aansluit-
      en transportovereenkomst.

      3 Het volledig variabele transportrecht, als bedoeld in het eerste lid, wordt aangeboden aan een grootverbruiker
      niet zijnde een netbeheerder, in een congestiegebied als bedoeld in [artikel 9.9, eerste lid][ref2],
      waarbij geldt dat de tariefstructuren als bedoeld in de [artikelen 3.7.15][ref3], [3.7.18][ref4] en
      [3.7.19 van de Tarievencode elektriciteit][ref5] van toepassing zijn.

      4 Alvorens de netbeheerder en de aangeslotene een volledig variabel transportrecht, als bedoeld in het eerste lid,
      overeenkomen:

      a. informeert de netbeheerder de aangeslotene over de wijze waarop de netbeheerder de beschikbare
      transportcapaciteit in het desbetreffende gebied over aangeslotenen met een volledig variabel recht op transport
      verdeelt;

      b. informeert de netbeheerder de aangeslotene over het beleid dat de netbeheerder hanteert om te voorkomen dat
      die aangeslotene gebruik maakt van de transportdienst buiten de tijden waarop of hoeveelheden waarvoor die door de
      netbeheerder is vrijgegeven; en

      c. wijst de netbeheerder de aangeslotene op de risico’s die met een volledig variabel recht op transport van
      elektriciteit verbonden zijn, waaronder de mogelijkheid van toekomstige aanpassingen in de van toepassing zijnde
      tariefstructuren en voorwaarden.


