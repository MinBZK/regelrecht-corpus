  - number: '6.9'
    text: |-
      1 Het HVDC-systeem, aangesloten op een hoogspanningsnet met een spanningsniveau lager dan 300 kV, is in staat bij
      variërende spanning maximaal een hoeveelheid blindvermogen te leveren dat gekenschetst wordt door een verhouding
      van blindvermogen tot maximale HVDC-transportcapaciteit van werkzaam vermogen, als bedoeld in artikel 20, eerste
      lid, van de Verordening (EU) 2016/1447 (NC HVDC):

      a. gelijk aan 0,35 bij een spanning van 0,925 pu tot 1,1 pu;

      b. gelijk aan 0,1 bij een spanning gelijk aan 1,15 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,35 en 0,1 bij een spanning tussen 1,1 pu en
      1,15 pu.

      2 Het HVDC-systeem, aangesloten op een hoogspanningsnet met een spanningsniveau lager dan 300 kV, is in staat bij
      variërende spanning maximaal een hoeveelheid blindvermogen op te nemen dat gekenschetst wordt door een verhouding
      van blindvermogen tot maximale HVDC-transportcapaciteit van werkzaam vermogen, als bedoeld in artikel 20, eerste
      lid, van de Verordening (EU) 2016/1447 (NC HVDC):

      a. gelijk aan 0,4 bij een spanning van 1,025 pu tot 1,15 pu;

      b. gelijk aan 0,1 bij een spanning van 0,925 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,1 en 0,4 bij een spanning tussen 0,925 pu
      en 1,025 pu.

      3 Een HVDC-systeem, aangesloten op een hoogspanningsnet met een spanningsniveau lager dan 300 kV, is op grond van
      het eerste en het tweede lid in staat blindvermogen te leveren of op te nemen binnen en inclusief de grenzen van
      het rood gemarkeerde profiel in onderstaand U-Q/P-diagram, als bedoeld in figuur 5 van bijlage IV bij artikel 20,
      eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC).

      4 Het HVDC-systeem aangesloten op een hoogspanningsnet met een spanningsniveau gelijk aan of groter dan 300 kV is
      in staat bij variërende spanning maximaal een hoeveelheid blindvermogen te leveren dat gekenschetst wordt door een
      verhouding van blindvermogen tot maximale HVDC-transportcapaciteit van werkzaam vermogen, als bedoeld in artikel
      20, eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC):

      a. gelijk aan 0,35 bij een spanning van 0,875 pu tot 1,05 pu;

      b. gelijk aan 0,1 bij een spanning van 1,1 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,35 en 0,1 bij een spanning van 1,05 pu tot
      1,1 pu.

      5 Het HVDC-systeem aangesloten op een hoogspanningsnet met een spanningsniveau gelijk aan of groter dan 300 kV is
      in staat bij variërende spanning maximaal een hoeveelheid blindvermogen op te nemen dat gekenschetst wordt door een
      verhouding van blindvermogen tot maximale HVDC-transportcapaciteit van werkzaam vermogen, als bedoeld in artikel
      20, eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC):

      a. gelijk aan 0,4 bij een spanning van 0,975 pu tot 1,1 pu;

      b. gelijk aan 0,1 bij een spanning van 0,875 pu;

      c. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,1 en 0,4 bij een spanning van 0,875 pu tot
      0,975 pu.

      6 Het HVDC-systeem aangesloten op een hoogspanningsnet met een spanningsniveau gelijk aan of groter dan 300 kV is
      op grond van het vierde en het vijfde lid in staat blindvermogen te leveren of op te nemen binnen en inclusief de
      grenzen van het rood gemarkeerde profiel in onderstaand U-Q/Pmax-diagram, als bedoeld in figuur 5 van bijlage IV
      bij artikel 20, eerste lid, van de Verordening (EU) 2016/1447 (NC HVDC).

      7 De tijdsperiodes voor het HVDC-systeem om over te gaan tot elk bedrijfspunt binnen zijn U-Q/P-profiel worden
      overeengekomen tussen de aangeslotene die beschikt over een HVDC-systeem en de netbeheerder, in overleg met de
      netbeheerder van het landelijk hoogspanningsnet, als bedoeld in artikel 20, derde lid, van de Verordening (EU)
      2016/1447 (NC HVDC). De overeengekomen tijdsperiodes worden vastgelegd in de aansluit- en transportovereenkomst.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel6.9
  - number: '6.10'
    text: |-
      1 Een HVDC-convertorstation is in staat bij een werkzaam vermogen beneden de maximale HVDC-transportcapaciteit van
      werkzaam vermogen maximaal een hoeveelheid blindvermogen te leveren, als bedoeld in artikel 21, eerste lid, van
      de Verordening (EU) 2016/1447 (NC HVDC) dat gekenschetst wordt door een verhouding van blindvermogen tot maximale
      HVDC-transportcapaciteit van werkzaam vermogen gelijk aan 0,35.

      2 Een HVDC-convertorstation is in staat bij een werkzaam vermogen beneden de maximale HVDC-transportcapaciteit van
      werkzaam vermogen maximaal een hoeveelheid blindvermogen op te nemen als bedoeld in artikel 21, eerste lid, van
      de Verordening (EU) 2016/1447 (NC HVDC) dat gekenschetst wordt door een verhouding van blindvermogen tot maximale
      HVDC-transportcapaciteit van werkzaam vermogen gelijk aan 0,4.

      3 Een HVDC-convertorstation is op grond van het eerste en het tweede lid in staat blindvermogen te leveren of op te
      nemen binnen en inclusief de grenzen van het rood gemarkeerde profiel in onderstaand P-Q/Pmax-diagram.

      4 De variatie van het blindvermogen, als bedoeld in artikel 21, tweede lid, van de Verordening (EU) 2016/1447
      (NC HVDC), leidt niet tot een spanningsstap in het hoogspanningsnet die groter is dan de grenswaarden voor snelle
      spanningsvariaties die volgen uit de bepalingen van [artikel 2.40][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.40
