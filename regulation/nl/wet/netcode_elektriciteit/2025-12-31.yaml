  - number: '10.1'
    text: |-
      1 In dit hoofdstuk wordt verstaan onder:

      a. *opregelen:* het leveren van elektrische energie aan de netbeheerder van het landelijk hoogspanningsnet uit het
      door die netbeheerder ten behoeve van de systeembalans ingezette aFRR, noodvermogen en het MARI-product;

      b. *afregelen:* het leveren van elektrische energie door de netbeheerder van het landelijk hoogspanningsnet aan
      de beheerders van het door die netbeheerder ten behoeve van de systeembalans ingezette aFRR, noodvermogen en het
      MARI-product;

      c. *prijs voor opregelen:* de prijs per MWh, bepaald per onbalansverrekeningsperiode, overeenkomstig
      [artikel 10.39a][ref1] ter bepaling van de waarde van energie in geval van opregelen;

      d. *prijs voor afregelen:* de prijs per MWh, bepaald per onbalansverrekeningsperiode, overeenkomstig
      [artikel 10.39a][ref2] ter bepaling van de waarde van energie in geval van afregelen;

      e.

      f. *regeltoestand:* een parameter waarmee de gevraagde regelactie aan leveranciers van aFRR en noodvermogen en
      het verloop daarvan gedurende een onbalansverrekeningsperiode wordt geïdentificeerd. Deze parameter wordt door de
      netbeheerder van het landelijk hoogspanningsnet vastgesteld volgens [artikel 10.29][ref3];

      g. *balans-delta:* de som van de door de frequentieregeling gevraagde reactie aan leveranciers van aFRR;

      h. *middenprijs:* het gemiddelde van de prijs per MWh, bepaald per onbalansverrekeningsperiode, van de laagste
      bieding voor opregelen van aFRR aan de netbeheerder van het landelijk hoogspanningsnet en de prijs per MWh,
      bepaald per onbalansverrekeningsperiode, van de hoogste bieding voor afregelen van aFRR aan de netbeheerder van het
      landelijk hoogspanningsnet;

      i. *prijs voor ingezet noodvermogen:* de prijs die tot stand komt door middel van twee berekeningsmethodes, één
      voor opregelen en één voor afregelen. Deze prijs wordt door de netbeheerder van het landelijk hoogspanningsnet
      bepaald volgens [artikel 10.39 achtste en negende lid][ref4].

      2 Het in Verordening (EU) 2017/2195 (GL EB) en in dit hoofdstuk gebruikte begrip
      balanceringsverantwoordelijkheid omvat dezelfde verantwoordelijkheid als bedoeld met het in
      [artikel 1, eerste lid, onderdeel o, van de Elektriciteitswet 1998][ref5] gedefinieerde begrip
      programmaverantwoordelijkheid.

      3 De voorwaarden uit dit [hoofdstuk][ref6] zijn van toepassing, ongeacht de systeemtoestand van het
      elektriciteitsvoorzieningssysteem.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.39a
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel10.39a
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel10.29
