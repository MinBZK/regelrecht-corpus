  - number: '4.4'
    text: |-
      1 Indien de aangeslotene geen nadere contractuele afspraken heeft gemaakt over het uitwisselen van blindvermogen
      met de netbeheerder van het landelijk hoogspanningsnet, varieert de arbeidsfactor, als bedoeld in artikel 15,
      eerste lid, onderdeel a, van de Verordening (EU) 2016/1388 (NC DCC), in afwijking van [artikel 2.27][ref1], tenzij
      sprake is van kortstondige afwijkingen en van perioden met zeer lage belasting, in het overdrachtspunt van de
      aansluiting van een verbruiksinstallatie:

      a. zonder lokale elektriciteitsproductie tussen 0,9 (inductief) en 1.0;

      b. met lokale elektriciteitsproductie tussen 0,9 (capacitief) en 0,9 (inductief).

      2 Een overeengekomen afwijking van dit blindvermogensbereik wordt vastgelegd in de aansluit- en
      transportovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.27
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel4.4
