  - number: '8.1'
    text: |-
      1 De netbeheerder rapporteert jaarlijks aan de Autoriteit Consument en Markt over de
      registratie van de onderbrekingen in het transport van elektriciteit, als bedoeld in
      [artikel 4.1, eerste lid, van het Besluit investeringsplan en kwaliteit elektriciteit en gas][ref1],
      alsmede over de prestatie-indicatoren, als bedoeld in
      [artikel 3.1, onderdelen a tot en met c, van de Regeling investeringsplan en kwaliteit elektriciteit en gas][ref2]
      en maakt daarbij onderscheid naar het spanningsniveau:

      a. tot en met 1 kV;

      b. groter dan 1 kV tot en met 35 kV;

      c. groter dan 35 kV tot en met 150 kV; en

      d. 220 kV en 380 kV.

      2 De netbeheerder rapporteert jaarlijks aan de Autoriteit Consument en Markt over de
      afwijkingen van de eisen aan de kwaliteit van het transport van elektriciteit, als bedoeld in
      [artikel 4.1, eerste lid, van het Besluit investeringsplan en kwaliteit elektriciteit en gas][ref3],
      alsmede van de vaststelling van de prestatie-indicatoren, als bedoeld in
      [artikel 3.1, onderdeel d, van de Regeling investeringsplan en kwaliteit elektriciteit en gas][ref4].

      3 In aanvulling op het tweede lid worden de resultaten van de kwaliteitsbewaking zoals bedoeld in
      [artikel 7.4, derde lid][ref5], van de gezamenlijke netbeheerders in enig jaar jaarlijks voor 1 mei van het
      daaropvolgende jaar op geschikte wijze openbaar gemaakt in een rapportage. Deze rapportage bevat voor de
      kwaliteitsbewaking zoals bedoeld in artikel 7.4, derde lid, voor zover van toepassing, per criterium de gemiddelde
      waarde, de standaarddeviatie, de uiterste waarde en de trend over de afgelopen tien jaar.

      4 De netbeheerder rapporteert jaarlijks aan de Autoriteit Consument en Markt per kwaliteitscriterium over de
      realisatie van de uitvoering van het gestelde in de [artikelen 8.2 tot en met 8.7][ref6].

      5 De netbeheerder rapporteert jaarlijks aan de Autoriteit Consument en Markt een overzicht van de overeenkomstig
      [artikel 8.8][ref7] betaalde compensatievergoeding.


