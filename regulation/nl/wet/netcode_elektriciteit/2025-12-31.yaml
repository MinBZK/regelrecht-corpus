  - number: '12.22'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet publiceert op haar website alle voor de in
      [artikelen 12.18 tot en met 12.21][ref1] genoemde berekeningen van belang zijnde gegevens, met inbegrip van
      tenminste de hieronder genoemde gegevens.

      2 De netbeheerder van het landelijk hoogspanningsnet publiceert de volgende gegevens ten behoeve van de
      netberekeningen:

      a. de topologie van het volledige net dat gebruikt is voor de netberekeningen;

      b. technische gegevens omtrent het net waaronder tenminste begrepen worden de impedantie en de mogelijke
      instellingen van alle in de netberekening meegenomen componenten;

      c. het toegekend vermogen in MVA van de in de netberekening meegenomen componenten gedurende het jaar;

      d. de uitgangspunten, berekeningen en kwantitatieve resultaten van het in [artikel 12.20, vijfde lid][ref2],
      genoemde onderzoek;

      e. specificatie van het in [artikel 12.18, zesde lid][ref3], bedoelde onderhoud waaronder tenminste begrepen
      wordt de periode waarin het onderhoud plaats vindt en een aanduiding van de netcomponenten die ten gevolge van het
      onderhoud niet beschikbaar zijn.

      3 De netbeheerder van het landelijk hoogspanningsnet publiceert de volgende gegevens ten behoeve van de gehanteerde
      scenario’s:

      a. de uitgangspunten op basis waarvan elk scenario is opgesteld;

      b. de gemodelleerde belasting op elk knooppunt in het net voor elk scenario;

      c. de gemodelleerde productie voor elk knooppunt in het net voor elk scenario;

      d. de aangenomen verhoging en verlaging van de productie zoals in [artikel 12.18, achtste lid][ref4], of
      [12.19, negende lid][ref5], genoemd.

      4 De netbeheerder van het landelijk hoogspanningsnet publiceert de volgende tussenresultaten afzonderlijk
      voor zowel de situatie met een volledig beschikbaar net als de perioden waarin onderhoud aan de
      landsgrensoverschrijdende verbindingen plaatsvindt en afzonderlijk per scenario en afzonderlijk voor de
      netberekeningen als bedoeld in [artikel 12.18][ref6] of [12.19][ref7] en [12.21, vijfde lid][ref8]:

      a. de maximale transportcapaciteit beschikbaar voor import en export als bepaald in
      [artikel 12.18, negende respectievelijk tiende lid][ref9], of het capaciteitsdomein als bepaald in
      [artikel 12.19, elfde lid][ref10];

      b. de verdeling van de landsgrensoverschrijdende transporten over de verschillende landsgrensoverschrijdende
      verbindingen (per circuit) in de ongestoorde situatie en na de enkelvoudige storing die de
      landsgrensoverschrijdende transportcapaciteit beperkt, met aanduiding van de enkelvoudige storing en de instelling
      van de regelbare componenten (waaronder mede begrepen de dwarsregeltransformatoren);

      c. in het geval dat een andere component dan een landsgrensoverschrijdende verbinding beperkend blijkt voor de
      transportcapaciteit de belasting van dit element voor en na de enkelvoudige storing alsmede een verklaring waarom
      deze beperking niet door middel van operationele middelen kan worden opgelost;

      d. in het geval dat de transportcapaciteit wordt beperkt doordat de kwaliteit van de transportdienst niet
      kan worden gehandhaafd, als genoemd in [artikel 12.20, derde lid][ref11], een kwalitatieve en kwantitatieve
      beschrijving van de oorzaak hiervan alsmede een verklaring waarom deze beperking niet door middel van operationele
      middelen kan worden opgelost;

      e. alleen ten behoeve van de netberekeningen als bedoeld in [artikel 12.21][ref12]: de transportcapaciteit voor
      onderlinge hulp en bijstand en, in het geval deze niet gelijk is aan 0 MW, tevens een kwantitatieve beschrijving
      van de balansverstoring die leidt tot de betreffende waarde.

      5 De netbeheerder van het landelijk hoogspanningsnet publiceert op uurbasis de volgende resultaten
      afzonderlijk voor zowel de situatie met een volledig beschikbaar net als de perioden waarin onderhoud aan de
      landsgrensoverschrijdende verbindingen plaatsvindt:

      a. de veilig beschikbare landsgrensoverschrijdende transportcapaciteit voor import als bedoeld in
      [artikel 12.18, negende lid][ref13];

      b. de veilig beschikbare landsgrensoverschrijdende transportcapaciteit voor export als bedoeld in
      [artikel 12.18, tiende lid][ref14];

      c. de capaciteit voor noodzakelijk transport van elektriciteit in het kader van onderlinge hulp en bijstand voor
      zowel import als export als bedoeld in [artikel 12.21, zesde lid][ref15].

      6 Indien de netbeheerder van het landelijk hoogspanningsnet de veilig beschikbare landsgrensoverschrijdende
      transportcapaciteit op grond van [artikel 12.18, elfde lid][ref16], aanpast, maakt hij openbaar om welke reden hij
      tot deze aanpassing is overgegaan, op welke landsgrensoverschrijdende verbinding de vermindering betrekking heeft,
      hoe groot de vermindering is en op welke uren de vermindering betrekking heeft.


