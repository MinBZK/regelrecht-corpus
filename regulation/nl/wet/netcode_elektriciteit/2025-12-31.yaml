  - number: '13.33'
    text: |-
      1 Het is de gebruiker van het centrale communicatiesysteem slechts toegestaan berichten uit te wisselen, als
      die gebruiker voor ieder uit te wisselen bericht in het bezit is van een door de netbeheerder van het landelijk
      hoogspanningsnet uitgegeven testcertificaat. Het certificaat is maximaal 12 maanden geldig.

      2 De netbeheerder van het landelijk hoogspanningsnet kan de toegang tot het gezamenlijke communicatiesysteem
      weigeren, indien:

      a. een gebruiker van het centrale communicatiesysteem in strijd met het eerste lid berichten uitwisselt waarvoor
      hij geen door de netbeheerder van het landelijk hoogspanningsnet uitgegeven testcertificaat bezit;

      b. hij na daartoe uitgenodigd door de netbeheerder van het landelijk hoogspanningsnet niet direct een test
      aanvraagt; en

      c. hij binnen twee weken na de hiervoor bedoelde uitnodiging nog geen testcertificaat in het bezit heeft.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel13.33
  - number: '13.34'
    text: |-
      1 Onverminderd het bepaalde in [artikel 13.32, eerste lid][ref1], stelt de netbeheerder van het landelijk
      hoogspanningsnet het elektronische berichtenverkeer bedoeld in [artikel 13.32, eerste lid][ref2], open voor
      berichtenverkeer ten behoeve van gesloten distributiesystemen die voldoen aan de voorwaarden genoemd in artikel
      5.8. Daarbij stelt de netbeheerder van het landelijk hoogspanningsnet de beheerder van het desbetreffende gesloten
      distributiesysteem op de hoogte van de in artikel 13.32, eerste lid, bedoelde regels door toezending daarvan.

      2 Alvorens de netbeheerder van het landelijk hoogspanningsnet het elektronische berichtenverkeer bedoeld in
      [artikel 13.32, eerste lid][ref3], open stelt voor de beheerder van een gesloten distributiesysteem, verstrekt
      deze beheerder aan de netbeheerder van het landelijk hoogspanningsnet een afschrift van de aan hem krachtens
      [artikel 15, eerste lid, van de Elektriciteitswet 1998][ref4] verleende ontheffing.

      3 Indien een ontheffing op grond van [artikel 15, eerste lid, van de Elektriciteitswet 1998][ref5] vervalt, dan
      wel wordt ingetrokken, stelt de Autoriteit Consument en Markt de netbeheerder van het landelijk hoogspanningsnet
      daarvan op de hoogte. De netbeheerder van het landelijk hoogspanningsnet stelt daarop het elektronische
      berichtenverkeer als bedoeld in [artikel 13.32, eerste lid][ref6], niet langer open voor het desbetreffende
      gesloten distributiesysteem.

      4 In afwijking van het tweede lid overlegt de beheerder van een recreatienet als bedoeld in
      [artikel 5.8, tweede lid][ref7], een afschrift van het respectievelijk de in de begripsomschrijving van
      recreatienet in de [Begrippencode elektriciteit][ref8] bedoelde bestemmingsplan, WOZ-beschikking of notariële
      akte alvorens de netbeheerder van het landelijk hoogspanningsnet het elektronische berichtenverkeer bedoeld in
      [artikel 13.32, eerste lid][ref9], open stelt voor de beheerder van dat recreatienet.


