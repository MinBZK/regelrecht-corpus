    text: |-
      1 Als, door een wijziging van deze code aan een of meer bepalingen van deze code op het tijdstip van
      inwerkingtreding ervan redelijkerwijs niet wordt voldaan, en de netbeheerder daardoor zijn wettelijke taken niet
      kan uitvoeren, treedt de netbeheerder met de aangeslotene, of treden de gezamenlijke netbeheerders onderling,
      in overleg om vast te stellen welke aanpassingen noodzakelijk zijn en binnen welke termijn deze dienen te zijn
      doorgevoerd.

      2 Indien in deze code wordt verwezen naar andere wet- en regelgeving of naar een nationale, Europese of
      internationale norm, is, tenzij anders vermeld, de meest recent vastgestelde versie van deze wet- en regelgeving of
      norm van toepassing. Indien de norm wordt neergelegd in een wettelijke regeling dan wordt deze norm toegepast zodra
      deze wettelijke regeling van kracht wordt.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel15.1
  - number: '15.2'
    text: |-
      1 De netbeheerder stelt na overleg met de aangeslotene vast in hoeverre zoveel als technisch, economisch en binnen
      welke termijn aan deze code kan worden voldaan bij renovaties en modificaties van:

      a. aansluitingen;

      b. elektriciteitsproductie-eenheden;

      c. verbruiksinstallaties;

      d. distributienetten en gesloten distributiesystemen;

      e. overige installaties.

      2 Het eerste lid is niet van toepassing wanneer artikel 4, eerste lid, onderdeel a, van Verordening (EU) 2016/631
      (NC RfG), artikel 4, eerste lid, onderdeel a, van Verordening (EU) 2016/1388 (NC DCC), of artikel 4, eerste lid,
      onderdeel a, van Verordening (EU) 2016/1447 (NC HVDC) van toepassing is.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel15.2
  - number: '15.3'
    text: |-
      1 In afwijking van [artikel 2.12][ref1], hoeft in een overdrachtspunt van een aansluiting tussen het landelijk
      hoogspanningsnet en een regionaal net tot 1 januari 2030 geen comptabele meetinrichting als bedoeld in
      [hoofdstuk 2 van de Meetcode elektriciteit][ref2] aanwezig te zijn indien:

      a. het desbetreffende overdrachtspunt op 1 januari 2008 reeds aanwezig was, maar de aansluiting waartoe dat
      overdrachtspunt behoort tot 1 januari 2008 geen aansluiting tussen het landelijk hoogspanningsnet en een regionaal
      net was, èn

      b. de totale hoeveelheid uitgewisselde energie in alle overdrachtspunten van één aansluiting gezamenlijk met behulp
      van de I2R-methode aantoonbaar kan worden vastgesteld met een onnauwkeurigheid kleiner dan of gelijk aan 0,55%.

      2 De in het eerste lid bedoelde I2R-methode houdt in dat de hoeveelheid in het (de) overdrachtspunt(en)
      uitgewisselde energie wordt berekend uit de vijftienminutenwaarden van de comptabele meetinrichtingen in
      het bovenliggende 110 of 150 kV-net, gecorrigeerd met de Ohmse verliezen in het tussenliggende deel van het
      desbetreffende 110 of 150 kV-net.

      3 De in het tweede lid bedoelde correctie met de Ohmse verliezen treedt voor de in het eerste lid bedoelde
      aansluitingen in de plaats van de in de artikelen 1.3.8, 2.1.6, 2.3.2.1, onderdeel j, 2.3.6.1, 2.3.6.6 en 5.1.3.7,
      onderdeel c, van de [Meetcode elektriciteit][ref3] bedoelde correctie in geval van plaatsing van de comptabele
      meetinrichting op een andere locatie dan het overdrachtspunt van de aansluiting.

      4 Ten behoeve van de uitvoering van de in het tweede lid bedoelde correctie met de Ohmse verliezen, worden
      de in het tweede lid bedoelde vijftienminutenwaarden van comptabele meetinrichtingen alsmede gegevens van
      bedrijfsmetingen door de netbeheerder van het landelijk hoogspanningsnet verzameld, gearchiveerd en uitgewisseld
      met de desbetreffende regionale netbeheerder.

      5 De netbeheerder van het landelijk hoogspanningsnet voert de in het tweede lid bedoelde berekeningen uit
      overeenkomstig het KEMA-rapport 30913271-Consulting 09-2489 ‘Bepaling van de netverliezen in het 110 en 150 kV net’
      inclusief de bij dat rapport behorende addenda met kenmerk 30913271-Consulting 09-2635 en 30913271-Consulting 10-
      0152. Deze documenten worden openbaar gemaakt op de website van de netbeheerder van het landelijk hoogspanningsnet.

      6 In een overdrachtspunt van een aansluiting tussen het landelijk hoogspanningsnet en een regionaal
      net, als bedoeld in het eerste lid, wordt het primaire deel van de comptabele meetinrichting aangepast
      aan de eisen uit [artikel 4.3.2 van de Meetcode elektriciteit][ref4], eventueel met inachtneming van
      [artikel 2.2.2 van de Meetcode elektriciteit][ref5], indien:

      a. de meettransformator defect raakt;

      b. een of meer primaire meetcomponenten in het veld gerenoveerd, vervangen, aangepast of gemoderniseerd worden;

      c. de populatie van het type meettransformator onbetrouwbaar blijkt te functioneren;

      d. het een nieuw overdrachtspunt is dat aan de desbetreffende aansluiting wordt toegevoegd;

      e. op ten minste 75% van de overige overdrachtspunten van de desbetreffende aansluiting het primaire deel van de
      comptabele meetinrichting voldoet aan de eisen uit [artikel 4.3.2 van de Meetcode elektriciteit][ref6].

      7 In een overdrachtspunt van een aansluiting tussen het landelijk hoogspanningsnet en een regionaal net,
      als bedoeld in het eerste lid, wordt het secundaire deel van de comptabele meetinrichting aangepast aan
      de eisen uit de [artikelen 4.3.5 tot en met 4.3.7 van de Meetcode elektriciteit][ref7], zodra op alle
      overdrachtspunten van de desbetreffende aansluiting het primaire deel van de comptabele meetinrichting
      voldoet aan de eisen uit [artikel 4.3.2 van de Meetcode elektriciteit][ref8], eventueel met inachtneming van
      [artikel 2.2.2 van de Meetcode elektriciteit][ref9].


