  - number: '13.36'
    text: |-
      1 Registraties van berichten die in verband met het bepaalde in deze code zijn verzonden overeenkomstig de in
      [artikel 13.32, eerste lid][ref1], vastgestelde regels, leveren, behoudens tegenbewijs, bewijs op van de in die
      berichten vervatte gegevens.

      2 Een bericht behoeft slechts met ontvangstbevestiging te worden verzonden wanneer de in het eerste lid genoemde
      regels dat voorschrijven, in welk geval die regels tevens de procedure voor de verzending met ontvangstbevestiging
      en de verzending van het ontvangstbericht voorschrijven.

      3 Indien de in het eerste lid genoemde regels verzending van een bericht met ontvangstbevestiging voorschrijven,
      is een dergelijk bericht ongeldig indien de ontvangst ervan niet binnen de in die regels daartoe gestelde termijn
      wordt bevestigd en de verzender de geadresseerde daarvan in kennis heeft gesteld, tenzij in overeenstemming met die
      regels een herstelprocedure in gang is gezet, bij gebreke of falen waarvan het bericht ongeldig is vanaf het moment
      waarop de eerder genoemde termijn is verstreken.

      4 De netbeheerder van het landelijk hoogspanningsnet verstrekt overeenkomstig het daaromtrent bepaalde in de
      regels, bedoeld in het eerste lid, een toegangscode en versleutelingsmethode aan degenen die gebruik maken van het
      in [artikel 13.32, eerste lid][ref2], bedoelde gezamenlijke communicatiesysteem.

      5 Gebruikers van het in [artikel 13.32, eerste lid][ref3], bedoelde gezamenlijke communicatiesysteem zijn gehouden
      tot de uitvoering en instandhouding van beveiligingsprocedures en -maatregelen om berichten te beschermen tegen
      verlies en tegen ongeautoriseerde kennisneming, wijziging of vernietiging.

      6 De in het vijfde lid bedoelde procedures en maatregelen hebben mede betrekking op de verificatie van de oorsprong
      en de volledigheid van een bericht.

      7 Indien beveiligingsprocedures of -maatregelen leiden tot de afwijzing van een bericht of een fout in het bericht
      aan het licht brengen, stelt de ontvanger de verzender hiervan in overeenstemming met het daaromtrent bepaalde
      in de regels, bedoeld in het eerste lid, op de hoogte. De ontvanger geeft aan het bericht geen gevolg totdat hij
      door de verzender is geïnstrueerd. In geval de verzender het bericht opnieuw verzendt, is daarbij ondubbelzinnig
      aangegeven dat het een gecorrigeerd bericht betreft.

      8 De inhoud van de in dit artikel bedoelde berichten is vertrouwelijk en mag slechts worden gebruikt voor het doel
      waarvoor zij worden verzonden, tenzij de daarin vervatte gegevens algemeen toegankelijk zijn.

      9 Van berichten die via het in [artikel 13.32, eerste lid][ref4], bedoelde gezamenlijke communicatiesysteem
      zijn uitgewisseld wordt door iedere ontvanger en verzender een tegen verlies, tenietgaan of wijziging beschermde
      chronologische registratie bijgehouden, met inachtneming van een termijn die op grond van de regels, bedoeld in het
      eerste lid, of op grond van enige wettelijke bepaling aangewezen is.

      10 De verzender bewaart door hem verzonden berichten in het formaat van verzending. De ontvanger bewaart de
      ontvangen berichten in het formaat van ontvangst.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel13.32
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel13.32
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel13.32
      [ref4]: https://wetten.overheid.nl/BWBR0037940#Artikel13.32
