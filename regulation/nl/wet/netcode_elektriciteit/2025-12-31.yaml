articles:
  - number: '1.1'
    text: |-
      Deze code bevat de voorwaarden als bedoeld in
      [artikel 31, eerste lid, onderdelen a, c, en f tot en met k, van de Elektriciteitswet 1998][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0009755#Artikel31
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel1.1
    references:
      - id: ref1
        bwb_id: BWBR0009755
        artikel: '31'
  - number: '1.2'
    text: |-
      1 Voor de toepassing van deze code gelden de begrippen en bijbehorende begripsbepalingen uit de
      [Begrippencode elektriciteit][ref1].

      2 In deze code wordt onder aangeslotene mede verstaan degene die om een aansluiting heeft verzocht.


      [ref1]: https://wetten.overheid.nl/BWBR0037938
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel1.2
    references:
      - id: ref1
        bwb_id: BWBR0037938
  - number: '1.3'
    text: |-
      1 Indien een aansluiting deel uitmaakt van een groepstransportovereenkomst, dient voor de toepasselijkheid van deze
      code in plaats van “aansluit- en transportovereenkomst” gelezen te worden “aansluitovereenkomst”, tenzij anders
      vermeld.

      2 Voor een groepstransportovereenkomst geldt in [paragraaf 7.1][ref1] en [paragraaf 7.4][ref2] dat:

      a. voor “gecontracteerd transportvermogen” en voor “het op de aansluiting gecontracteerde transportvermogen”
      gelezen dient te worden “het door aangeslotenen die deel uitmaken van een groepstransportovereenkomst gezamenlijk
      gecontracteerde transportvermogen”;

      b. voor “de aansluit- en transportovereenkomst” gelezen dient te worden “de groepstransportovereenkomst”;

      c. voor “aangeslotene” gelezen dient te worden “groep van aangeslotenen die deel uitmaken van een
      groepstransportovereenkomst"; en

      d. voor “grootverbruiker” gelezen dient te worden “groep van grootverbruikers die deel uitmaken van een
      groepstransportovereenkomst”.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk7
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk7
