  - number: '9.35'
    text: |-
      1 In afwijking van [artikel 13.10][ref1] geldt voor de uitvoering van de regeling in de [paragrafen 9.10][ref2] en
      [9.11][ref3] zonder uitzondering een grenswaarde van 1 MW voor de in de [artikelen 13.12][ref4] en [13.14][ref5]
      bedoelde gegevensuitwisseling.

      2 In aanvulling op [artikel 13.12, zevende en achtste lid][ref6], en [artikel 13.14, zesde en zevende lid][ref7],
      geldt voor aansluitingen die deelnemen aan een groep van aansluitingen als bedoeld in [artikel 9.34][ref8] dat
      de gegevens als bedoeld in artikel 13.12, zevende en achtste lid, en artikel 13.14, zesde en zevende lid, tevens
      geaggregeerd per groep worden aangeleverd door de CSP indien de CSP bijdraagt aan het oplossen van fysieke
      congestie op grond van [bijlage 11][ref9] of op grond van [bijlage 12][ref10] waarbij, met inachtneming van bijlage
      12, zesde lid, onderdeel a, inzet na gate-sluitingstijd van de day-aheadmarkt is afgesproken.

      3 In afwijking van [artikel 13.12, achtste lid,][ref11] en [artikel 13.14, zevende lid][ref12], geldt voor de
      uitvoering van de regeling in de [paragrafen 9.10][ref13] en [9.11][ref14] dat wijzigingen van de ter beschikking
      gestelde prognoses direct na het bekend worden van die wijziging aan de netbeheerder ter beschikking worden gesteld
      indien de wijziging groter is dan 5% van de maximumcapaciteit dan wel van het maximaal af te nemen vermogen, of
      indien de wijziging groter is dan 1 MW.

      4 Wijzigingen ten opzichte van de overeenkomstig het tweede lid ter beschikking gestelde geaggregeerde prognose
      van de hoeveelheid van het net af te nemen vermogen dan wel op het net in te voeden vermogen, worden direct na
      het bekend worden van die wijziging aan de netbeheerder ter beschikking gesteld indien die wijzigingen groter zijn
      dan 1 MW.

      5 Wijzigingen ten opzichte van de overeenkomstig het eerste en het tweede lid ter beschikking gestelde
      gegevens worden direct na het bekend worden van die wijziging ter beschikking gesteld van de netbeheerder
      indien die wijziging wordt geïnitieerd door het oplossen van fysieke congestie overeenkomstig
      [artikel 9.41, vierde lid][ref15], dan wel [artikel 9.45, vijfde lid][ref16].


