  - number: '10.40'
    text: |-
      1 Iedere dag stelt de netbeheerder van het landelijk hoogspanningsnet per BSP een overzicht samen van
      diens geactiveerde biedingen met betrekking tot het direct voorafgaande etmaal. Dit overzicht bevat per
      onbalansverrekeningsperiode de volgende gegevens:

      a. de bedrijfs EAN-code van de aangewezen BRP's;

      b. het bepaalde volume aan balanceringsenergie, en in geval van activering van het MARI-product uitgesplitst
      volgens artikel 10.39, derde lid, onderdelen a en b, per richting;

      c. de prijs voor opregelen;

      d. de prijs voor afregelen;

      e. indien van toepassing de prijs of de prijzen voor het geactiveerde MARI-product overeenkomstig artikel 10.39,
      zevende lid, onderdelen c tot en met f;

      f. het te verrekenen bedrag.

      2 De netbeheerder van het landelijk hoogspanningsnet stuurt het op grond van het eerste lid samengestelde overzicht
      aan de desbetreffende BSP voor 17:00 uur van de eerste werkdag na het etmaal waarop dat overzicht betrekking heeft.

      3 De netbeheerder van het landelijk hoogspanningsnet stuurt binnen 21 dagen na afloop van iedere maand een factuur
      aan de desbetreffende BSP voor diens geactiveerde biedingen balanceringsenergie van de voorafgaande maand. Deze
      factuur kan zowel voor een positief als een negatief bedrag zijn, en bevat ten minste de volgende gegevens:

      a. bedrijfsnaam BSP;

      b. datum waarop de bieding is geactiveerd;

      c. de bepaalde volumes aan balanceringsenergie per richting per onbalansverrekeningsperiode;

      d. het totaalbedrag.

      4 De netbeheerder van het landelijk hoogspanningsnet betaalt, in het geval van een positief bedrag, het in het
      derde lid, onderdeel d, genoemde totaalbedrag aan de BSP binnen twee weken na ontvangst van de factuur.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel10.40
  - number: '10.41'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet stelt per onbalansverrekeningsperiode voor aFRR een lijst op
      met biedingen balanceringsenergie, gerangschikt in volgorde van hun biedprijzen en publiceert, vanaf het moment
      dat hij zijn goedkeuring heeft verleend aan alle energieprogramma's voor de volgende dag, op deze basis, voor
      elke onbalansverrekeningsperiode van de volgende dag, de betreffende biedladder tussen 0 MW en activatie van alle
      biedingen in stappen van 10 MW.

      2 De netbeheerder van het landelijk hoogspanningsnet herziet de in het eerste lid genoemde lijst iedere
      onbalansverrekeningsperiode.

      3 De netbeheerder van het landelijk hoogspanningsnet publiceert momentopnames van de balans-delta in de balans-
      delta publicatie op zijn website en neemt hierin informatie mee over uitwisselingen via de Europese platforms
      ter uitwisseling van balanceringsenergie uit aFRR en onbalansnetting en de prijs behorende bij de afgeroepen
      energiebiedingen aFRR en noodvermogen.

      4 De netbeheerder van het landelijk hoogspanningsnet stelt per onbalansverrekeningsperiode voor het MARI-
      product een lijst op met biedingen balanceringsenergie gerangschikt in volgorde van hun biedprijzen en publiceert
      voorafgaand aan de BE-GCT de betreffende biedladder tussen 0 MW en activatie van alle biedingen in stappen van
      10 MW.

      5 De netbeheerder van het landelijke hoogspanningsnet publiceert voorafgaand aan de onbalansverrekeningsperiode
      informatie over het verloop van de schaarstecomponent alsook informatie over het effect van de schaarstecomponent
      op de prijs van balanceringsenergie en op de onbalansprijs als onderdeel van de balans-deltapublicatie.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel10.41
  - number: '10.42'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet kan de prekwalificatie van een BSP voor de levering van
      een bepaald balanceringsproduct intrekken, onverminderd de resterende geldigheidsduur van de prekwalificatie van
      de desbetreffende reserveleverende eenheden of reserveleverende groepen als bedoeld in artikel 155 of 159 van
      [Verordening (EU) 2017/1485](32017R1485) (GL SO), indien:

      a. de BSP het desbetreffende balanceringsproduct niet volgens specificatie levert en overleg hieromtrent tussen
      de netbeheerder van het landelijk hoogspanningsnet en de BSP niet binnen drie maanden na de eerste melding van de
      netbeheerder van het landelijk hoogspanningsnet van de foutieve levering tot verbetering bij de BSP leidt, zodat
      het desbetreffende product alsnog overeenkomstig de specificatie wordt geleverd;

      b. de BSP op grond van [artikel 13.33, tweede lid][ref1], voor de levering van het desbetreffende
      balanceringsproduct de toegang geweigerd is tot het centrale communicatiesysteem als bedoeld in
      [artikel 13.32, eerste lid][ref2]; of

      c. de BSP niet meer beschikt over één of meer reserveleverende eenheden of reserveleverende groepen voor de
      levering van het desbetreffende balanceringsproduct overeenkomstig de van toepassing zijnde productspecificaties
      die met succes het prekwalificatieproces, als bedoeld in artikel 155 of 159 van [Verordening (EU) 2017/1485]
      (32017R1485) (GL SO), hebben doorlopen en er binnen zes maanden na deze constatering geen nieuwe reserveleverende
      eenheid of reserveleverende groep ter prekwalificatie wordt aangeboden.

      2 De prekwalificatie van een BSP voor de levering van een bepaald balanceringsproduct wordt ingetrokken met ingang
      van de datum waarop de netbeheerder van het landelijk hoogspanningsnet hiertoe overeenkomstig het eerste lid
      besluit.

      3 Wanneer de prekwalificatie van een BSP voor de levering van een bepaald balanceringsproduct is ingetrokken,
      schrijft de netbeheerder van het landelijk hoogspanningsnet de desbetreffende BSP onverwijld uit het BSP-register
      uit voor de levering van het desbetreffende balanceringsproduct.


