  - number: 9.1a
    text: |-
      1 Onverminderd de mogelijkheid van vrijwillige deelname, is de verplichting als bedoeld in
      [artikel 9.1, derde en vierde lid][ref1] en de uitvoering van congestiemanagement met inzet van capaciteitssturing
      en niet-marktgebaseerde redispatch als bedoeld in [paragraaf 9.11][ref2], niet van toepassing op:

      a. aansluitingen ten behoeve van vitale processen zoals gepubliceerd door de Nationale Coördinator
      Terrorismebestrijding en Veiligheid met uitzondering van elektriciteitsproductie-eenheden; en

      b. aansluitingen van de Dienst Justitiële Inrichtingen, ziekenhuizen en openbaar vervoersbedrijven, waarbij
      het door de netbeheerder ingrijpen op het door de aangeslotene geplande netgebruik direct van invloed is op het
      functioneren van maatschappelijke voorzieningen.

      2 Ten behoeve van een juiste uitvoering van het eerste lid brengen aangeslotenen die menen te beschikken over een
      aansluiting in het congestiegebied waarop het eerste lid van toepassing is, de netbeheerder daarvan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.1
