  - number: '14.4'
    text: |-
      1 Onverminderd het bepaalde in [artikel 14.1, tweede en derde lid][ref1], voldoen elektriciteitsproductie-
      eenheden die overeenkomstig de criteria van artikel 5 van Verordening (EU) 2016/631 als type B
      of C zouden worden geclassificeerd maar waarop overeenkomstig artikel 4, tweede en derde lid, van
      de Verordening (EU) 2016/631 (NC RfG), de Verordening (EU) 2016/631 (NC RfG) niet van toepassing
      is, en die zijn aangesloten op een middenspanningsnet, in aanvulling op [paragraaf 3.5][ref2] aan
      [artikel 14.3 en het tweede tot en met achtste lid][ref3].

      2 Elektriciteitsproductie-eenheden aangesloten op netten met een spanningsniveau van 50 kV en hoger kunnen bedrijf
      voeren met een arbeidsfactor tussen 1,0 en 0,8 (inductief) gemeten op de generatorklemmen.

      3 Voor elektriciteitsproductie-eenheden met een maximumcapaciteit groter dan 5 MW en aangesloten op netten met een
      spanning groter dan of gelijk aan 1 kV gelden de technische eisen die:

      a. met betrekking tot de robuustheid van de elektriciteitsproductie-eenheid zijn neergelegd in het vijfde tot en
      met het achtste lid;

      b. met betrekking tot de toetsing en beproeving zijn neergelegd in [artikel 3.21][ref4] en [artikel 14.5][ref5],
      het achtste tot en met dertiende lid. [Artikel 3.22][ref6] is niet van toepassing.

      4 Het vijfde lid en [artikel 14.5, tweede lid tot en met zevende lid][ref7], zijn niet van toepassing op
      elektriciteitsproductie-eenheden die uitsluitend afhankelijk zijn van één of meer niet-regelbare energiebronnen.
      Beproevingen als bedoeld in artikel 14.5, elfde lid, voor zover ze betrekking hebben op voorgaande uitzonderingen
      zijn niet van toepassing op voornoemde elektriciteitsproductie-eenheden.

      5 Een elektriciteitsproductie-eenheid is in staat om overeenkomstig de vier gebieden die in [bijlage 1][ref8] zijn
      gedefinieerd voor elektriciteitsproductie-eenheden die zijn aangesloten op netten met een nominale spanning lager
      dan 110 kV onderscheidenlijk elektriciteitsproductie-eenheden die zijn aangesloten op netten met een nominale
      spanning hoger dan of gelijk aan 110 kV:

      a. nominaal vermogen te leveren gedurende een onbeperkte tijd;

      b. nominaal vermogen te leveren gedurende 15 minuten, vervolgens gedurende 5 minuten parallel aan het net in
      bedrijf te blijven;

      c. tenzij de elektriciteitsproductie-eenheid ingevolge onderdeel b reeds in uitsluitend parallelbedrijf is gegaan,
      90% van nominaal vermogen te leveren gedurende 10 seconden en vervolgens gedurende 5 minuten parallel aan het net
      in bedrijf te blijven;

      d. parallel aan het net gedurende 5 minuten in bedrijf te blijven.

      6 Een elektriciteitsproductie-eenheid is in staat om in de in [bijlage 1][ref9] gedefinieerde gebieden
      het blindvermogen te leveren overeenkomstig het bepaalde in de [artikelen 3.15, zesde lid][ref10],
      [14.3, derde en vierde lid][ref11], en [14.4, tweede lid][ref12].

      7 Indien een elektriciteitsproductie-eenheid uitgerust is met meerdere generatoren die invoeden op netten met
      verschillende spanningsniveaus gelden de eisen die van toepassing zijn voor het hoogste spanningsniveau waarop de
      elektriciteitsproductie-eenheid invoedt.

      8 In geval van kortsluitingen in een net geldt:

      a. Voor elektriciteitsproductie-eenheden die zijn gekoppeld aan netten met een nominale spanning lager dan 110 kV,
      is ontkoppeling toegestaan bij een spanningsdip, waarbij de restspanning een waarde heeft tussen 0,8 U en 0,7 U, na
      300 ms. Indien de restspanning een waarde heeft kleiner dan 0,7 U mag ontkoppeld worden na 300 ms of na 90% van de
      kritische kortsluittijd (KKT) indien 300 ms groter is dan 0,9 KKT.

      b. Voor elektriciteitsproductie-eenheden die zijn gekoppeld aan netten met een nominale spanning van 110 kV en
      hoger is ontkoppeling toegestaan bij een spanningsdip, waarbij de restspanning een waarde heeft kleiner dan 0,7 U,
      na 300 ms of na 90% van de kritische kortsluittijd (KKT) indien 300 ms groter is dan 0,9 KKT.

      9 Tenzij sprake is van de situatie als bedoeld in artikel 4, eerste lid van de [Verordening (EU) 2016/631]
      (32531R2016) (NC RfG), zijn de [artikelen 3.18][ref13] en [3.25][ref14], niet van toepassing op de
      elektriciteitsproductie-eenheden:

      a. die voor 9 september 2021 op het net zijn aangesloten, of

      b. waarvan de eigenaar van de elektriciteitsproductie-eenheid voor 9 september 2021 een definitief en bindend
      contract heeft gesloten voor de aankoop van het belangrijkste onderdeel van de elektriciteitsproductie-eenheid
      binnen een tijdsbestek van twee jaar na het sluiten van het contract.


