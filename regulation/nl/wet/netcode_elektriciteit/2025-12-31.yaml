  - number: '7.10'
    text: |-
      1 Aan de in [artikel 7.8, eerste lid][ref1] genoemde eis wordt voldaan wanneer het laagspanningswisselstroomnet zo
      is ontworpen en aangelegd dat een optredende foutspanning boven 66 V in uiterlijk 5 seconden wordt uitgeschakeld in
      het geval de aardingsvoorziening

      a. aan de aangeslotene ter beschikking wordt gesteld als bedoeld in [artikel 2.32, tweede lid][ref2], of

      b. door de netbeheerder wordt gebruikt voor de elektrische veiligheid van de laagspanningsnetten.

      2 Aan de in [artikel 7.8, tweede lid][ref3] genoemde eis wordt voldaan wanneer het laagspanningswisselstroomnet zo
      is ontworpen en aangelegd dat een optredende foutspanning boven 25 V in uiterlijk 5 seconden wordt uitgeschakeld in
      het geval de aardingsvoorziening

      a. aan de aangeslotene ter beschikking wordt gesteld als bedoeld in [artikel 2.32, tweede lid][ref4], of

      b. door de netbeheerder wordt gebruikt voor de elektrische veiligheid van de laagspanningsnetten.

      3 Een netbeheerder kan ook andere maatregelen treffen dan beschreven in het eerste en tweede lid om te voldoen aan
      de eisen in [artikel 7.8][ref5].

      4 De laagspanningsnetten zijn kortsluitvast. Hiervan kan worden afgeweken mits dit niet leidt tot
      veiligheidsrisico’s ten gevolge van een kortsluiting.


