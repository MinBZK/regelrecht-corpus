  - number: '8.11'
    text: |-
      1 Indien een aangeslotene een netbeheerder verzoekt om een aansluiting met een doorlaatwaarde kleiner dan of
      gelijk aan 3 x 80A op het door hem beheerde net, dan wel om een wijziging van een bestaande aansluiting met een
      doorlaatwaarde kleiner dan of gelijk aan 3 x 80A, realiseert de netbeheerder deze aansluiting of wijziging binnen
      een redelijke termijn, tenzij er sprake is van overmacht.

      2 Als er sprake is van overmacht, als bedoeld in het eerste lid, brengt de netbeheerder de aangeslotene hiervan zo
      spoedig mogelijk op de hoogte.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel8.11
  - number: '8.12'
    text: |-
      1 Indien de netbeheerder een dynamische regionale wachttijd hanteert, berekent de netbeheerder ieder kwartaal de
      dynamische regionale wachttijd volgens de methode in artikel 1, van [bijlage 20][ref1].

      2 De netbeheerder publiceert de dynamische regionale wachttijd op de website als bedoeld in [artikel 9.8][ref2].

      3 De netbeheerder rapporteert jaarlijks aan de ACM de berekeningen als bedoeld in het eerste lid.

      4 De netbeheerder spant zich ervoor in om de dynamische regionale wachttijd te verminderen.


