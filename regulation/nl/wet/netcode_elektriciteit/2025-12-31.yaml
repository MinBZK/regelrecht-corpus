  - number: '9.29'
    text: |-
      1 Indien marktactiviteiten als genoemd in artikel 35, tweede lid, van de [Verordening (EU) 2017/2196](32196R2017)
      (NC ER), niet of niet volledig uitvoerbaar zijn voor één of meer betrokken partijen door een fout in één of meer
      systemen, zijn, overeenkomstig artikel 36, eerste lid, van de [Verordening (EU) 2017/2196](32196R2017) (NC ER), de
      volgende back-up- en fallbackprocedures van deze marktactiviteiten van toepassing:

      a. de aanlevering van zoneoverschrijdende capaciteit voor capaciteitstoewijzing bij de overeenkomstige
      biedzonegrenzen voor elke markttijdseenheid, als wordt verwacht dat het landelijk hoogspanningsnet niet tot de
      normale of alarmtoestand wordt hersteld overeenkomstig artikel 21, derde lid, van de [Verordening (EU) 2015/1222]
      (33122R2015) (GL CACM) en artikel 42 en 46 van de [Verordening (EU) 2016/1719](33619R2016) (GL FCA), alsmede de op
      deze artikelen gebaseerde methodologieën en overeenkomsten;

      b. de indiening van biedingen voor balanceringscapaciteit, reservecapaciteit FCR en balanceringsenergie door
      een aanbieder van een balanceringsdienst overeenkomstig de gepubliceerde fallbackprocedures op de website van de
      netbeheerder van het landelijk hoogspanningsnet;

      c. de aanlevering van een gebalanceerde positie aan het einde van het day-aheadtijdsbestek door een BRP, als dat
      volgens de voorwaarden met betrekking tot balancering vereist is overeenkomstig [artikel 10.14, vijfde lid][ref1];

      d. de aanlevering van positiewijzigingen van BRP's overeenkomstig de fallbackprocedures overeenkomstig
      [artikel 10.14, vijfde lid][ref2], zoals gepubliceerd op de website van de netbeheerder van het landelijk
      hoogspanningsnet, waarbij geldt dat indien op de dag waarop de positiewijziging betrekking heeft een noodtoestand
      of een black-outtoestand in Nederland heeft plaats gevonden, of indien er een fout in de systemen van de
      netbeheerder van het landelijk hoogspanningsnet heeft plaats gevonden, de netbeheerder van het landelijk
      hoogspanningsnet het in artikel 10.14, zevende lid, genoemde tijdstip kan uitstellen naar een later moment;

      e. de aanlevering van de schema's als bedoeld in artikel 111, eerste en tweede lid, van de [Verordening (EU)
      2017/1485](33385R2017) (GL SO):

      1°. indien deze betrekking hebben op prognoses als bedoeld in [artikel 13.11, achtste en negende lid][ref3],
      [artikel 13.12, zevende en achtste lid][ref4], [artikel 13.13, zesde en zevende lid][ref5],
      [artikel 13.14, zesde en zevende lid][ref6], [artikel 13.15, achtste en negende lid][ref7] en
      [artikel 13.17, zevende en achtste lid][ref8], overeenkomstig de fallbackprocedures gepubliceerd op de website van
      de netbeheerder van het landelijk hoogspanningsnet;

      2°. indien deze betrekking hebben op commerciële handelsprogramma's overeenkomstig de fallbackprocedures
      overeenkomstig [artikel 10.14, vijfde lid][ref9], zoals gepubliceerd op de website van de netbeheerder van het
      landelijk hoogspanningsnet, waarbij geldt dat indien op de dag waarop het energieprogramma betrekking heeft een
      noodtoestand of een black-outtoestand in Nederland heeft plaats gevonden of indien er een fout in de systemen
      van de netbeheerder van het landelijk hoogspanningsnet heeft plaats gevonden, de netbeheerder van het landelijk
      hoogspanningsnet het in artikel 10.14. zevende lid, genoemde tijdstip kan uitstellen naar een later moment.

      2 Indien marktactiviteiten, als genoemd in artikel 35, tweede lid, van de [Verordening (EU) 2017/2196](32196R2017)
      (NC ER), niet volledig uitvoerbaar zijn voor één of meer betrokken partijen doordat een buitenlandse instelling als
      bedoeld in [artikel 16, tweede lid, onderdeel h van de Elektriciteitswet 1998][ref10], haar markt heeft opgeschort,
      zijn, overeenkomstig artikel 36, eerste lid, van de [Verordening (EU) 2017/2196](32196R2017) (NC ER), de volgende
      back-up en fallbackprocedures van de marktactiviteiten van toepassing;

      a. capaciteitstoewijzing door transmissierechten voor jaar- en maandtransporten overeenkomstig artikel 21, derde
      lid, van de [Verordening (EU) 2015/1222](33122R2015) (GL CACM) en artikel 42 en 46 van de [Verordening (EU)
      2016/1719](33619R2016) (GL FCA), alsmede de op deze artikelen gebaseerde methodologieën en overeenkomsten;

      b. prijskoppeling voor day-aheadtransporten overeenkomstig artikel 36, derde lid, artikel 44, artikel 50 en
      artikel 72 van de [Verordening (EU) 2015/1222](33122R2015) (GL CACM), alsmede de op deze artikelen gebaseerde
      methodologieën en overeenkomsten;

      c. prijskoppeling voor intradaytransporten overeenkomstig artikel 36, derde lid, en artikel 72 van de [Verordening
      (EU) 2015/1222](33122R2015) (GL CACM), alsmede de op deze artikelen gebaseerde methodologieën en overeenkomsten;

      d. binnenlandse intradayhandel op een NEMO overeenkomstig artikel 36, derde lid, artikel 44, artikel 50 en
      artikel 72 van de [Verordening (EU) 2015/1222](33122R2015) (GL CACM), alsmede de op deze artikelen gebaseerde
      methodologieën en overeenkomsten;

      e. balanceringsmarkten overeenkomstig artikel 146 en artikel 147 van de [Verordening (EU) 2017/1485](33385R2017)
      (GL SO);

      f. binnenlandse intradayhandel buiten de NEMO's om overeenkomstig [artikel 10.1, derde lid][ref11];

      g. onbalansverrekening overeenkomstig [artikel 10.1, derde lid][ref12].

      3 De in het eerste en tweede lid genoemde fallbackprocedures alsmede de interactie van de marktprocessen
      met het real-time herstelproces worden nader toegelicht op de website van de netbeheerder van het landelijk
      hoogspanningsnet.


