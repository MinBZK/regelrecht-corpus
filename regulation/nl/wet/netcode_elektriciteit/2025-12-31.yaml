  - number: '2.10'
    text: |-
      Met inachtneming van de [artikelen 2.5 tot en met 2.9][ref1] kan de aangeslotene bij zijn verzoek om een of meer
      secundaire allocatiepunten aan zijn aansluiting toe te kennen, kiezen voor de variant met parallel geplaatste
      meetinrichtingen als bedoeld in de [artikelen 2.5 tot en met 2.8][ref2] of serieel geplaatste meetinrichtingen als
      bedoeld in [artikel 2.9][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.5
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.5
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.9
