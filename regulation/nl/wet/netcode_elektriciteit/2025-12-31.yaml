  - number: '3.18'
    text: |-
      1 De synchrone productie-eenheid is in staat bij variërende spanning maximaal een hoeveelheid blindvermogen te
      leveren dat gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel
      17, tweede lid, onderdeel a, van de [Verordening (EU) 2016/631](32016R0631) (NC RfG):

      a. gelijk aan 0,33 bij een spanning van 0,9 pu tot 1,05 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,33 en 0,0 bij een spanning tussen 1,05 pu
      en 1,1 pu.

      2 De synchrone productie-eenheid is in staat bij variërende spanning maximaal blindvermogen op te nemen dat
      gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel 17, tweede
      lid, onderdeel a, van de [Verordening (EU) 2016/631](32531R2016) (NC RfG):

      a. gelijk aan 0,33 bij een spanning van 0,95 pu tot 1,1 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,0 en 0,33 bij een spanning tussen 0,9 en
      0,95 pu.

      3 In aanvulling op het eerste lid is het toegestaan het werkzame vermogen, zoveel als met het oog op de begrenzing
      door de maximale stroom technisch nodig is, te verminderen ten gunste van het leveren van blindvermogen binnen het
      deel van het U-Q/Pmax-profiel dat begrensd wordt door het lineaire verloop tussen respectievelijk 0,2 en 0,33 bij
      een spanning tussen 0,90 pu en 0,95 pu en het profiel overeenkomstig het eerste lid.

      4 De synchrone productie-eenheid is op grond van het eerste tot en met het derde lid in staat blindvermogen te
      leveren of op te nemen binnen en inclusief de grenzen van het rood gemarkeerde U-Q/Pmax-profiel in onderstaand
      diagram.

      5 De synchrone elektriciteitsproductie-eenheid is in staat om na een storing zo snel mogelijk de hoeveelheid
      werkzaam vermogen van voor de storing te leveren.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel3.18
  - number: '3.19'
    text: |-
      1 De power park module is in staat bij zijn maximumcapaciteit en bij variërende spanning maximaal een hoeveelheid
      blindvermogen te leveren dat gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als
      bedoeld in artikel 20, tweede lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,33 bij een spanning van 0,9 pu tot 1,05 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,33 en 0,0 bij een spanning tussen 1,05 pu
      en 1,1 pu.

      2 De power park module is in staat bij zijn maximumcapaciteit en bij variërende spanning maximaal blindvermogen op
      te nemen dat gekenschetst wordt door een verhouding van blindvermogen tot maximumcapaciteit, als bedoeld in artikel
      20, tweede lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,33 bij een spanning van 0,95 pu tot 1,1 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,0 en 0,33 bij een spanning tussen 0,9 en
      0,95 pu.

      3 In aanvulling op het eerste lid is het toegestaan het werkzame vermogen, zoveel als met het oog op de begrenzing
      door de maximale stroom technisch nodig is, te verminderen ten gunste van het leveren van blindvermogen binnen het
      deel van het U-Q/Pmax-profiel dat begrensd wordt door het lineaire verloop tussen respectievelijk 0,2 en 0,33 bij
      een spanning tussen 0,90 pu en 0,95 pu en het profiel overeenkomstig het eerste lid.

      4 De power park module is op grond van het eerste tot en met het derde lid in staat blindvermogen te leveren of op
      te nemen binnen en inclusief de grenzen van het rood gemarkeerde U-Q/Pmax-profiel in onderstaand diagram.

      5 De power park module is in staat bij een werkzaam vermogen beneden de maximum capaciteit maximaal een hoeveelheid
      blindvermogen te leveren dat gekenschetst wordt door een verhouding van blindvermogen tot maximum capaciteit als
      bedoeld in artikel 20, tweede lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,33 bij een werkzaam vermogen van 0,2 pu tot 1 pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,0 en 0,33 bij een werkzaam vermogen van 0,0
      pu tot 0,2 pu.

      6 De power park module is in staat bij een werkzaam vermogen beneden de maximum capaciteit maximaal een hoeveelheid
      blindvermogen op te nemen dat gekenschetst wordt door een verhouding van blindvermogen tot maximum capaciteit als
      bedoeld in artikel 20, tweede lid, onderdeel a, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,33 bij een werkzaam vermogen van 0,2 pu tot 1pu; en

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,0 en 0,33 bij een werkzaam vermogen van 0,0
      tot 0,2 pu.

      7 In aanvulling op het vijfde en zesde lid is het bij een werkzaam vermogen tussen 0,93 pu en 1,0 pu toegestaan
      om het werkzame vermogen zoveel als met het oog op de begrenzing door de maximale stroom technisch nodig is,
      te verminderen tot een werkzaam vermogen dat beschreven wordt door het lineaire verloop van Q/Pmax tussen
      respectievelijk 0,0 en 0,33 bij een werkzaam vermogen van 1,0 pu en 0,93 pu, ten gunste van het leveren van
      blindvermogen.

      8 In aanvulling op het vijfde en zesde lid is het toegestaan bij een uitgewisseld schijnbaar vermogen van minder
      dan 10% van het maximale schijnbaar vermogen het gevraagde blindvermogen te leveren of op te nemen overeenkomstig
      de technische mogelijkheden en met een afwijking van maximaal 10% van het maximale schijnbaar vermogen.

      9 De power park module is op grond van het vijfde tot en met het achtste lid in staat blindvermogen te leveren of
      op te nemen binnen en inclusief de grenzen van het rood gemarkeerde P-Q/Pmax-profiel in onderstaand diagram.

      10 Tenzij anders overeengekomen is de power park module in staat om snelle foutstroom op het overdrachtspunt van de
      aansluiting te leveren in het geval van symmetrische (driefasen) storingen, als bedoeld in artikel 20, tweede lid,
      onderdeel b, van de [Verordening (EU) 2016/631](32016R0631) (NC RfG).

      11 Ten aanzien van het leveren van snelle foutstroom op het overdrachtspunt van de aansluiting als bedoeld in het
      tiende lid, is de power park module die is aangesloten op een net met een spanningsniveau van 110 kV of hoger in
      staat om in bedrijf te zijn in één of twee van de volgende regelmodi:

      a. de snelle foutstroomregelmodus zonder voorgeschreven foutstroom waarbij de power park module in staat is om in
      het geval van symmetrische (driefasen) en asymmetrische storingen de spanningsverandering op het overdrachtspunt
      van de aansluiting van de power park module tegen te werken; of

      b. de snelle foutstroomregelmodus met voorgeschreven foutstroom, waarbij het twaalfde lid van toepassing is op de
      power park module.

      12 De power park module aangesloten op een net met een spanningsniveau lager dan 110 kV en de power park module
      die is aangesloten op een net met een spanningsniveau van 110 kV of hoger die de foutregelmodus als bedoeld in
      het elfde lid, onderdeel b toepast, is in staat snelle foutstroom te leveren in de snelle foutstroomregelmodus met
      voorgeschreven foutstroom, als bedoeld in het elfde lid onderdeel b, onder de volgende voorwaarden:

      a. additionele blindstroominjectie wordt geactiveerd indien op de aansluitklemmen van de afzonderlijke
      opwekkingseenheden van de power park module:

      1°. een afwijking van meer dan 10% van de effectieve waarde van de nominale spanning plaatsvindt; of

      2°. een sprongsgewijze verandering van de momentane sinusvormige spanning vóór het optreden van de fout ter grootte
      van tenminste 5% van de piekwaarde van de nominale spanning plaatsvindt;

      b. de spanningsregeling zorgt ervoor dat de aanvoer van additionele blindstroom, afkomstig van de aansluitklemmen
      van de afzonderlijke opwekkingseenheden van de power park module, met minimaal 2% en maximaal 6% van de nominale
      stroom per procent spanningsafwijking verzekerd is;

      c. de stijgtijd (de tijd vanaf de storingsaanvang die ervoor nodig is dat de te injecteren additionele blindstroom
      voor het eerst een waarde van 90% van de stabiele eindwaarde bereikt) is maximaal 30 ms; de inslingertijd (de tijd
      vanaf de storingsaanvang die ervoor nodig is dat de te injecteren additionele blindstroom blijvend tussen 90% en
      110% van de stabiele eindwaarde is) is maximaal 60 ms;

      d. additionele blindstroominjectie wordt geleverd met een spanningslimiet van ten minste 120% van de nominale
      spanning op de aansluitklemmen van de afzonderlijke opwekkingseenheden van de power park module;

      e. de te injecteren additionele blindstroom ΔI (gedefinieerd als het verschil van de blindstroom tijdens de storing
      (I) en de blindstroom voor de storing (I)) is evenredig aan de spanningsafwijking als volgt: ΔI = ((U-U) / U) * I
      * k

      waarbij: 'ΔI: additionele blindstroominjectie;'

      (U-U) / U: relatieve spanningsafwijking in pu;

      U: spanning tijdens de storing;

      U: spanning vóór de storing;

      U: nominale spanning;

      I: nominale stroom;

      k: helling voor de additionele blindstroominjectie;

      f. het aanpassingsbereik van k is: 2 ≤ k ≤ 6;

      g. de aanpassingsstap van k is kleiner dan of gelijk aan 0,5 pu;

      h. de standaardwaarde van k is: 2 voor een power park module aangesloten op een net met een nominale spanning
      lager dan 66 kV en de standaardwaarde van k is 5 voor een power park module aangesloten op een net met een nominale
      spanning van 66 kV en hoger; indien een andere waarde dan de standaardwaarde wordt overeengekomen, wordt deze
      vastgelegd in de aansluit- en transportovereenkomst;

      i. in geval van wijziging van het instelpunt geeft de netbeheerder twee weken van tevoren een kennisgeving aan
      de aangeslotene;

      j. de additionele blindstroominjectie mag worden beëindigd bij terugkeer van de spanningsafwijking (van een waarde
      van meer dan 10%) naar een waarde van minder dan 10% van de effectieve nominale waarde op de aansluitklemmen van
      de afzonderlijke opwekkingseenheden van de power park module of na een tijdsbestek van vijf seconden na het begin
      van de fout; een herhaald activeren van de additionele blindstroominjectie nadat deze vanwege het bereiken van het
      einde van de fout is beëindigd, moet conceptueel worden vermeden;

      k. de te injecteren blindstroom bedraagt minimaal I bij maximale spanningsdaling; een hogere waarde van de
      blindstroom dan I wordt niet geëist;

      l. de tolerantie voor de grootte van de blindstroominjectie bij een spanningsverlaging is bepaald door lijnen
      boven en onder de karakteristiek die de grootte van de additionele blindstroominjectie als functie van de
      spanningsverandering beschrijft, met als parameters:

      1°. de bovengrens voor de tolerantie is bepaald door een lijn met een hellingshoek van constante k gelijk
      aan de ingestelde waarde en met een verhoging van 10% ten opzichte van de lijn door de oorsprong met dezelfde
      hellingshoek;

      2°. de ondergrens voor de tolerantie is bepaald door een lijn met een hellingshoek van constante k gelijk
      aan de ingestelde waarde en met een verlaging van 20% ten opzichte van de lijn door de oorsprong met dezelfde
      hellingshoek;

      m. bij een spanning lager dan 15% Uc is het leveren van stroom niet verplicht.

      13 De netbeheerder en de aangeslotene die beschikt over een power park module komen de reqelmodus of regelmodi,
      alsmede ingeval van de in het elfde lid, onderdeel a, bedoelde reqelmodus, het principe en de prestatieparameters
      van de regelmodus, overeen, en leggen dit vast in de aansluit- en transportovereenkomst.

      14 De power park module is in staat in het geval van asymmetrische storingen de snelle foutstroom als volgt te
      leveren:

      a. de eisen zoals geformuleerd in het tiende lid zijn van overeenkomstige toepassing op de normale en de inverse
      componenten van de spanning en op de normale en de inverse componenten van de additionele blindstroominjectie;

      b. het aanpassingsbereik van k voor de inverse component van de additionele blindstroominjectie is: 2 ≤ k ≤ 6;

      c. de aanpassingsstap van k is kleiner dan of gelijk aan 0,5 pu;

      d. de standaardwaarde van k is gelijk aan k;

      e. voor opwekkingseenheden die gebaseerd zijn op een dubbelgevoede inductiemachine wordt een specifieke instelling
      van k niet geëist;

      f. voor de inverse component van de spanningsverandering is de additionele inverse component van de stroominjectie
      alleen vereist als de inverse component van de spanning voldoende groot is voor een betrouwbare fasehoekdetectie;

      g. indien de maximale waarde van de blindstroom is bereikt, is deze naar rato van de instellingen van k en k
      verdeeld over de normale en inverse componenten van de additionele blindstroominjectie;

      h. de tolerantie voor de grootte van de inverse component van de blindstroominjectie bij een spanningsverhoging
      van de inverse component is bepaald door lijnen boven en onder de karakteristiek die de grootte van de additionele
      blindstroominjectie als functie van de spanningsverandering beschrijft, met als parameters:

      1°. de bovengrens voor de tolerantie is bepaald door een lijn met een hellingshoek van constante k gelijk aan 6 en
      met een verhoging van 20% ten opzichte van de lijn door de oorsprong met de zelfde hellingshoek;

      2°. de ondergrens voor de tolerantie is bepaald door een lijn met een hellingshoek van constante k gelijk aan
      de ingestelde waarde en met een verlaging van 10% ten opzichte van de lijn door de oorsprong met de zelfde
      hellingshoek.

      15 Indien in overleg tussen de relevante netbeheerder en de netbeheerder van het landelijk hoogspanningsnet
      overeengekomen, wordt de eis tot het leveren van snelle foutstroom door een power park module in geval van
      symmetrische storingen vastgelegd in de aansluit- en transportovereenkomst.

      16 De power park module is in staat om na een fout het werkzame vermogen zo snel mogelijk te herstellen. De
      minimale eisen zijn:

      a. het herstel van het werkzame vermogen begint op een spanningsniveau van 90% van de spanning vóór de fout;

      b. de maximale toegestane tijd voor het herstel van het werkzame vermogen is tussen 0,5 en 10 seconden;

      c. de grootte voor het herstel van het werkzame vermogen is 90% van het vermogen vóór de fout;

      d. de nauwkeurigheid van het herstelde werkzame vermogen is 10% van het vermogen vóór de fout.
