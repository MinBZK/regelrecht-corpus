        bwb_id: BWBR0037940
        artikel: '9.20'
        hoofdstuk: '9'
        paragraaf: '9.7'
  - number: '9.22'
    text: |-
      1 De netbeheerders beschikken over onderling afgestemde afschakelplannen en herstelplannen. Deze plannen liggen
      ter inzage bij de netbeheerder. Elke netbeheerder dient, ook na eventuele wijzigingen, een afschrift van de plannen
      naar de Autoriteit Consument en Markt te sturen.

      2 De in [artikel 9.20, tweede lid, onderdeel d][ref1], bedoelde afschakeling geschiedt handmatig en wordt, in
      geval van een door de netbeheerder van het landelijk hoogspanningsnet aan een andere netbeheerder opgedragen
      afschakeling, telefonisch opgedragen.

      3 De netbeheerder van het landelijk hoogspanningsnet kondigt een opdracht tot afschakeling tevoren aan en verstrekt
      daarbij een toelichting.

      4 Indien de situatie dermate spoedeisend is dat de netbeheerder van het landelijk hoogspanningsnet een opdracht
      tot afschakeling niet tevoren kan aankondigen, licht hij de opdracht en de reden voor het achterwege laten van een
      voorafgaande aankondiging achteraf alsnog toe.

      5 Tenzij de netbeheerder van het landelijk hoogspanningsnet een tijdsperiode noemt waarbinnen de opdracht tot
      afschakeling moet zijn uitgevoerd, wordt de opdracht onverwijld uitgevoerd nadat zij is verstrekt.

      6 Indien een of meer andere netbeheerders opdracht tot afschakeling is gegeven, ontvangt de netbeheerder van het
      landelijk hoogspanningsnet een telefonische terugmelding van hetgeen door de andere netbeheerder of netbeheerders
      is gedaan ter uitvoering van de opdracht.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel9.20
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel9.22
