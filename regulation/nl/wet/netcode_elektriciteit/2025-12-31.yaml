  - number: '2.40'
    text: |-
      1 In aanvulling op [artikel 2.14, tweede lid][ref1], voldoen de elektrische installatie en de daarin opgenomen
      machines, toestellen, materialen en onderdelen aan “NPR-IEC/TR 61000-3-7:2008 en” (“Electromagnetic compatibility
      (EMC) – Part 3-7: Limits – Assessment of emission limits for the connection of fluctuating installations to MV, HV
      and EHV power systems”).

      2 In geval van een aansluiting op een hoogspanningsnet, toont de aangeslotene door middel van berekening aan dat
      zijn elektrische installatie voldoet aan het eerste lid.

      3 In geval van een aansluiting op een middenspanningsnet, waarbij het achter de aansluiting te schakelen
      vermogen meer bedraagt dan de waarden opgenomen in tabel 3 van “NPR-IEC/TR 61000-3-7:2008 en” (“Electromagnetic
      compatibility (EMC) – Part 3-7: Limits – Assessment of emission limits for the connection of fluctuating
      installations to MV, HV and EHV power systems”), toont de aangeslotene door middel van berekening aan dat zijn
      elektrische installatie voldoet aan het eerste lid.

      4 Indien een van de leden twee of drie van toepassing is, wordt de wijze van toepassing van de “NPR-IEC/TR 61000-
      3-7:2008 en” (“Electromagnetic compatibility (EMC) – Part 3-7: Limits – Assessment of emission limits for the
      connection of fluctuating installations to MV, HV and EHV power systems”) vastgelegd in een uitvoeringsinstructie
      en als bijlage toegevoegd aan de aansluit- en transportovereenkomst.

      5 In aanvulling op [artikel 2.28][ref2] is voor de aansluiting van éénfasige tractievoedingen op
      hoogspanningsnetten de “Richtlijn voor harmonische stromen en netspanningsasymmetrie bij éénfasige 25 kV-voedingen”
      uit maart 1999, uitgegeven door EnergieNed van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.14
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.28
