  - number: '11.8'
    text: |-
      1 In de situatie als bedoeld in [artikel 10.6, vierde lid][ref1]:

      a. treedt de BRP die de balanceringsverantwoordelijkheid voor die grootverbruiker draagt in de plaats van de
      leverancier tot het moment waarop de grootverbruiker een nieuwe leveringsovereenkomst heeft gesloten dan wel de
      levering aan die grootverbruiker is beëindigd;

      b. switcht de betreffende BRP daartoe de betreffende grootverbruiker overeenkomstig
      [paragraaf 4.1 van de Informatiecode elektriciteit en gas][ref2] naar zich toe;

      c. stelt de betreffende BRP de betrokken grootverbruiker zo spoedig mogelijk, maar uiterlijk binnen drie
      werkdagen na de effectuering van de switch schriftelijk op de hoogte van de ontstane situatie en de thans geldende
      voorwaarden, inclusief de opzeggingsmogelijkheden;

      d. wordt de grootverbruiker geacht een leveringscontract te hebben met de BRP die in de plaats van de leverancier
      treedt;

      e. heeft de grootverbruiker twee maanden het recht het leveringscontract zonder opzegtermijn te beëindigen;

      f. kan de BRP, voor zover niet reeds overeengekomen, redelijke afspraken maken ten aanzien van
      balanceringsverantwoordelijkheid voor de aansluiting.

      2 De in het eerste lid bedoelde BRP die in de plaats van de leverancier treedt, brengt aan de grootverbruiker een
      tarief voor de geleverde energie in rekening dat overeenkomt met de uurlijkse day-aheadclearingprijs, tenzij de
      grootverbruiker met deze BRP anders is overeengekomen.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.6
      [ref2]: https://wetten.overheid.nl/BWBR0037934#Paragraaf4.1
