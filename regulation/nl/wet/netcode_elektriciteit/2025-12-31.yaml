  - number: '3.34'
    text: |-
      1 Overige eisen ten aanzien van de spanningsstabiliteit:

      a. De voorschriften van artikel 21 van de Verordening (EU) 2016/631 verwijzen uitsluitend naar de stabiele staat
      van het energiesysteem en niet naar transiënte stabiliteit.

      b. Als een offshore-power park module meer blindvermogen kan opwekken dan de minimum eisen, wordt het vermogen niet
      opzettelijk beperkt.

      c. De offshore-power park module is in staat om automatisch blindvermogen te leveren in de spanningsregelmodus,
      blindvermogen-regelmodus of de arbeidsfactor-regelmodus.

      d. De ingestelde punten en het verval (spannings-droop) kunnen gedurende normaal bedrijf aangepast worden.

      e. Ingestelde puntwaarden hebben betrekking op het overdrachtspunt van de aansluiting van de offshore-power park
      module naar het net op zee.

      f. De parameters voor de regelsnelheid van de blindvermogen-regelaar worden ten minste zes maanden voor het op
      spanning brengen in onderling overleg afgesproken tussen de netbeheerder van het net op zee en de aangeslotene, met
      inachtneming van de feitelijke netkarakteristieken.

      g. De blindvermogen-regelmodus spanning leidt tot stabiel en gedempt gedrag van de spanning op het overdrachtspunt
      van de aansluiting van de offshore-power park module. Als de blindvermogen-regelmodus spanning is, is het mogelijk
      het werkpunt van de helling binnen 15 minuten aan te passen, om de uitwisseling van het blindvermogen op het
      overdrachtspunt van de aansluiting aan te passen.

      h. Als de blindvermogen-regelmodus blindvermogen is, valt de aanpassing van het instelpunt binnen de definitie van
      frequentie en juistheid van de onshore spanningsregelaar (die het blindvermogen instelpunt op het overdrachtspunt
      van de aansluiting van de offshore-power park module vaststelt).

      2 De offshore-power park module is in staat bij een werkzaam vermogen beneden de maximumcapaciteit maximaal
      een hoeveelheid blindvermogen te leveren dat gekenschetst wordt door een verhouding van blindvermogen tot
      maximumcapaciteit als bedoeld in artikel 21, derde lid, onderdeel c, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,1 bij een werkzaam vermogen van 0 tot 0,1 pu;

      b. dat bepaald wordt door het lineaire verloop tussen respectievelijk 0,1 en 0,35 bij een werkzaam vermogen van 0,1
      pu tot 0,2 pu;

      c. gelijk aan 0,35 bij een werkzaam vermogen van 0,2 pu tot 1 pu.

      3 De offshore-power park module is in staat bij een werkzaam vermogen beneden de maximumcapaciteit maximaal
      een hoeveelheid blindvermogen op te nemen dat gekenschetst wordt door een verhouding van blindvermogen tot
      maximumcapaciteit als bedoeld in artikel 21, derde lid, onderdeel c, van de Verordening (EU) 2016/631 (NC RfG):

      a. gelijk aan 0,1 bij een werkzaam vermogen van 0 tot 0,1 pu;

      b. gelijk aan 0,4 bij een werkzaam vermogen van 0,1 pu tot 1 pu.

      4 De power park module is op grond van het tweede en derde lid in staat blindvermogen te leveren of op te nemen
      binnen en inclusief de grenzen van het rood gemarkeerde profiel in onderstaand P-Q/Pmax-diagram

      5 Beperking van de mogelijkheid om blindvermogen op te wekken gebaseerd op het aantal actieve opwekkingseenheden
      mag niet van invloed zijn op het gedrag van de blindvermogen-regelaar binnen deze beperkte mogelijkheden.

      6 Voor de aansluiting van de offshore-power park module op het net op zee kan, in afwijking van artikel 27 en
      artikel 15, vijfde lid, van de Verordening (EU) 2016/631, de netbeheerder van het net op zee met de aangeslotene
      overeenkomen dat een black-start-mogelijkheid niet vereist is.

      7 In aanvulling op de [artikelen 2.14][ref1], [2.15][ref2] en [2.28 ][ref3]gelden voor een aansluiting van de
      offshore-power park module op het net op zee de volgende eisen ten aanzien van harmonische emissielimieten:

      a. Het compatibiliteitsniveau voor de totale harmonische vervorming (THD) op een (66 kV) overdrachtspunt van een
      aansluiting van een offshore-power park module bedraagt:

      1°. THD < 5% gedurende 95% van de metingen van het tien minuten gemiddelde in een week;

      2°. THD < 6% gedurende 99,9% van de metingen van het tien minuten gemiddelde in een week.

      b. Het planningsniveau voor de totale harmonische vervorming (THD) op een (66 kV) overdrachtspunt van een
      aansluiting van een offshore-power park module bedraagt:

      1°. THD < 3%, gedurende 95% van de metingen van het tien minuten gemiddelde in een week;

      2°. THD < 3,6%, gedurende 99,9% van de metingen van het tien minuten gemiddelde in een week.

      c. Indien er meer dan één offshore-power park module is aangesloten op één 66 kV railsysteem, wordt het geplande
      emissieniveau evenredig verdeeld over de offshore-power park modules naar rato van het vermogen dat aan elke
      offshore-power park module is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel2.14
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Artikel2.15
      [ref3]: https://wetten.overheid.nl/BWBR0037940#Artikel2.28
