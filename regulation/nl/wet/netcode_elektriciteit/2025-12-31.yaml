  - number: '10.29'
    text: |-
      1 De netbeheerder van het landelijk hoogspanningsnet bepaalt de regeltoestand met gebruik van de momentopname-
      dataset die ook gebruikt wordt voor de balans-deltapublicatie.

      2 Indien de netbeheerder van het landelijk hoogspanningsnet gedurende een onbalansverrekeningsperiode met het
      balanceringsenergieproduct aFRR:

      a. opregelt noch afregelt bedraagt de regeltoestand 0;

      b. uitsluitend heeft opgeregeld bedraagt de regeltoestand +1;

      c. uitsluitend heeft afgeregeld bedraagt de regeltoestand –1;

      d. zowel heeft opgeregeld als afgeregeld en de balans-delta vormt uitsluitend een continue niet dalende reeks
      bedraagt de regeltoestand +1;

      e. zowel heeft opgeregeld als afgeregeld en de balans-delta vormt uitsluitend een continue niet stijgende reeks
      bedraagt de regeltoestand –1;

      f. zowel heeft opgeregeld als afgeregeld en de balans-delta vormt noch een continue niet stijgende reeks noch een
      continue niet dalende reeks bedraagt de regeltoestand 2;

      g. zowel heeft opgeregeld als afgeregeld en de balans-delta vormt zowel een continue niet stijgende reeks als een
      continue niet dalende reeks bedraagt de regeltoestand 2.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel10.29
  - number: '10.30'
    text: |-
      1 De in [artikel 10.25, eerste lid, onderdeel c][ref1], bedoelde onbalans wordt met de netbeheerder van het
      landelijk hoogspanningsnet verrekend tegen een prijs per MWh, hierna te noemen de onbalansprijs.

      2 De in het eerste lid bedoelde onbalansprijs bedraagt in een onbalansverrekeningsperiode waarin de regeltoestand –
      1 is:

      a. indien de in [artikel 10.25, eerste lid][ref2], genoemde afwijking het karakter heeft van afnemen van
      elektrische energie wordt de onbalansprijs voor de desbetreffende BRP gelijk aan de prijs voor afregelen. In dit
      geval betaalt de BRP aan de netbeheerder van het landelijk hoogspanningsnet;

      b. indien de in [artikel 10.25, eerste lid][ref3], genoemde afwijking het karakter heeft van invoeden van
      elektrische energie wordt de onbalansprijs voor de desbetreffende BRP gelijk aan de prijs voor afregelen. In dit
      geval betaalt de netbeheerder van het landelijk hoogspanningsnet aan de BRP.

      3 De in het eerste lid bedoelde onbalansprijs bedraagt in een onbalansverrekeningsperiode waarin de regeltoestand
      +1 is:

      a. indien de in [artikel 10.25, eerste lid][ref4], genoemde afwijking het karakter heeft van afnemen van
      elektrische energie wordt de onbalansprijs voor de desbetreffende BRP gelijk aan de prijs voor opregelen. In dit
      geval betaalt de BRP aan de netbeheerder van het landelijk hoogspanningsnet;

      b. indien de in [artikel 10.25, eerste lid][ref5], genoemde afwijking het karakter heeft van invoeden van
      elektrische energie wordt de onbalansprijs voor de desbetreffende BRP gelijk aan de prijs voor opregelen. In dit
      geval betaalt de netbeheerder van het landelijk hoogspanningsnet aan de BRP.

      4 De in het eerste lid bedoelde onbalansprijs bedraagt in een onbalansverrekeningsperiode waarin de regeltoestand
      2 is:

      a. indien de in [artikel 10.25, eerste lid][ref6], genoemde afwijking het karakter heeft van afnemen van
      elektrische energie en de middenprijs hoger is dan de prijs voor opregelen, wordt de onbalansprijs voor de
      desbetreffende BRP gelijk aan de middenprijs. In dit geval betaalt de BRP aan de netbeheerder van het landelijk
      hoogspanningsnet;

      b. indien de in [artikel 10.25, eerste lid][ref7], genoemde afwijking het karakter heeft van invoeden van
      elektrische energie en de middenprijs lager is dan de prijs voor afregelen, wordt de onbalansprijs voor
      de desbetreffende BRP gelijk aan de middenprijs. In dit geval betaalt de netbeheerder van het landelijk
      hoogspanningsnet aan de BRP;

      c. indien de in [artikel 10.25, eerste lid][ref8], genoemde afwijking het karakter heeft van afnemen van
      elektrische energie en de middenprijs niet hoger is dan de prijs voor opregelen, wordt de onbalansprijs voor de
      desbetreffende BRP gelijk aan de prijs voor opregelen. In dit geval betaalt de BRP aan de netbeheerder van het
      landelijk hoogspanningsnet;

      d. indien de in [artikel 10.25, eerste lid][ref9], genoemde afwijking het karakter heeft van invoeden van
      elektrische energie en de middenprijs niet lager is dan de prijs voor afregelen, wordt de onbalansprijs voor de
      desbetreffende BRP gelijk aan de prijs voor afregelen. In dit geval betaalt de netbeheerder van het landelijk
      hoogspanningsnet aan de BRP.

      5 De in het eerste lid bedoelde onbalansprijs voor een BRP bedraagt in een onbalansverrekeningsperiode waarin de
      regeltoestand 0 is:

      a. indien de in [artikel 10.25, eerste lid][ref10], genoemde afwijking het karakter heeft van afnemen van
      elektrische energie wordt de onbalansprijs voor de desbetreffende BRP de middenprijs. In dit geval betaalt de BRP
      aan de netbeheerder van het landelijk hoogspanningsnet;

      b. indien de in [artikel 10.25, eerste lid][ref11], genoemde afwijking het karakter heeft van invoeden van
      elektrische energie wordt de onbalansprijs voor de desbetreffende BRP de middenprijs. In dit geval betaalt de
      netbeheerder van het landelijk hoogspanningsnet aan de BRP.


