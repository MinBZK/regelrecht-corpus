  - number: '10.38'
    text: |-
      1 De overeenkomstig [artikel 9.19 onderdeel a][ref1], aangewezen BSP's, en BSP's met een biedplicht op grond van
      een overeenkomst voor balanceringscapaciteit, sturen dagelijks, vóór 14:45 uur, biedingen balanceringsenergie in.

      2 Alle BSP's kunnen tot aan de BE-GCT, zijnde vijfentwintig minuten voorafgaand aan de onbalansverrekeningsperiode,
      voor de desbetreffende onbalansverrekeningsperiode biedingen balanceringsenergie indienen, alsook de omvang en de
      prijs van een ingediende bieding aanpassen en eerder ingediende biedingen intrekken. Biedingen balanceringsenergie
      kunnen niet voorafgaand aan de BE-GCT worden ingezet.

      3 Alle BSP's dienen biedingen balanceringsenergie in conform door de netbeheerder van het landelijk
      hoogspanningsnet vast te stellen procedures en specificaties.

      4 De netbeheerder van het landelijk hoogspanningsnet stelt de BSP op de hoogte van ontvangst van de bieding.

      5 De netbeheerder van het landelijk hoogspanningsnet informeert een BRP over de opname van een aansluiting,
      waarover hij balanceringsverantwoordelijkheid uitoefent, in een portfolio waarmee een BSP een bieding
      balanceringsenergie kan indienen.


