  - number: '9.34'
    text: |-
      1 Een CSP die namens een aangeslotene of een groep van aangeslotenen biedingen wil doen overeenkomstig de
      specificaties in [bijlage 11][ref1], dan wel namens een aangeslotene of een groep van aangeslotenen wil bijdragen
      aan het oplossen van fysieke congestie overeenkomstig de specificaties in [bijlage 12][ref2], dient de aansluiting
      of de groep van bij die aangeslotenen horende aansluitingen bij de netbeheerder te pre-kwalificeren.

      2 Een groep van aansluitingen bestaat uit één of meer aansluitingen.

      3 Ten behoeve van de pre-kwalificatie van een groep van aansluitingen deelt de CSP de netbeheerder de EAN-codes mee
      van de in de groep deelnemende aansluitingen. Elke aansluiting die deel uitmaakt van een groep van aansluitingen
      voldoet ten minste aan de volgende voorwaarden:

      a. de aansluiting maakt niet reeds deel uit van een andere groep van dezelfde of een andere CSP;

      b. de allocatiemethode van de aansluiting, als bedoeld in
      [artikel 2.1.3, onderdeel s, van de Informatiecode elektriciteit en gas][ref3] heeft de waarde:

      1°. “telemetrie”; of

      2°. “slimme-meter-allocatie”.

      c. indien de CSP met een groep van aangeslotenen biedingen wil doen overeenkomstig de specificaties in
      [bijlage 11][ref4], is de maximumcapaciteit van een met de aansluiting aangesloten elektriciteitsproductie-eenheid
      kleiner dan 1 MW; en

      d. indien de CSP met een groep van aangeslotenen biedingen wil doen overeenkomstig de specificaties in
      [bijlage 11][ref5], is de capaciteit van een met de aansluiting aangesloten verbruiksinstallatie kleiner dan 1 MW.

      4 In aanvulling op het derde lid geldt de voorwaarde dat:

      a. voor elke aansluiting waarbij de maximumcapaciteit van de aangesloten productie-eenheid of de capaciteit van de
      aangesloten verbruiksinstallatie kleiner is dan 1 MW en die deel uitmaakt van de groep in het aansluitingenregister
      van de netbeheerder dezelfde BRP vermeld staat; en

      b. indien de CSP met een groep van aansluitingen biedingen wil doen als bedoeld in
      [artikel 9.41, vierde lid][ref6], elke aansluiting deel uitmaakt van het desbetreffende congestiegebied.

      5 Ten behoeve van de pre-kwalificatie van een aansluiting deelt de CSP de netbeheerder de EAN-code mee van de
      aansluiting. Voor de aansluiting geldt dat:

      a. de maximumcapaciteit van een met de aansluiting aangesloten elektriciteitsproductie-eenheid of de capaciteit van
      een met de aansluiting aangesloten verbruiksinstallatie groter is dan of gelijk is aan 1 MW; en

      b. de aansluiting niet reeds bij een andere of dezelfde CSP is vermeld.

      6 De netbeheerder beoordeelt mede op basis van het derde, vierde en vijfde lid of de CSP gerechtigd is met die
      aansluiting of groep van aansluitingen biedingen te doen overeenkomstig [bijlage 11][ref7], dan wel met die
      aansluiting of groep van aansluitingen bij te dragen aan het oplossen van fysieke congestie overeenkomstig de
      specificaties in [bijlage 12][ref8].

      7 De netbeheerder informeert de betrokken BRP over de opname van een aansluiting waarvoor hij
      balanceringsverantwoordelijkheid uitoefent in een portfolio van een CSP.

      8 De CSP geeft mutaties in de groepssamenstelling onverwijld door aan de netbeheerder.

      9 De netbeheerder voert bij elke hem op grond van het achtste lid doorgegeven mutatie opnieuw de beoordeling als
      bedoeld in het zesde lid uit en stelt de CSP op de hoogte van het resultaat.

      10 De netbeheerder voert bij elke wijziging op grond van de processen van de
      [Informatiecode elektriciteit en gas][ref9] van de in het aansluitingenregister vastgelegde gegevens van een van de
      aansluitingen in een groep opnieuw de beoordeling als bedoeld in het zesde lid uit en stelt de CSP op de hoogte van
      het resultaat.


