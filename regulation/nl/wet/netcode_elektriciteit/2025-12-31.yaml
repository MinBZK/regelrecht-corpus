  - number: '10.19'
    text: |-
      1 De netbeheerder vervangt indien van toepassing voor de desbetreffende aansluitingen de
      op basis van [artikel 6.2.2.2 van de Informatiecode elektriciteit en gas][ref1] van de
      meetverantwoordelijke ontvangen meetgegevens door de herziene meetgegevens die hem op basis van
      [artikel 6.2.2.3 van de Informatiecode elektriciteit en gas][ref2] door de desbetreffende meetverantwoordelijke
      voor 10:00 uur van de vijfde werkdag na afloop van het desbetreffende etmaal zijn toegestuurd.

      2 De netbeheerder voert opnieuw de in [artikel 10.17, negende en tiende lid][ref3], beschreven acties uit.

      3 De netbeheerder stuurt de op grond van het tweede lid jo. [artikel 10.17, negende lid][ref4], opnieuw verzamelde
      meetgegevens inzake al zijn aansluitingen aan de netbeheerder van het landelijk hoogspanningsnet voor 16:00 uur van
      de vijfde werkdag na afloop van het desbetreffende etmaal.

      4 De netbeheerder stuurt de op grond van het tweede lid juncto [artikel 10.17, tiende lid][ref5], opnieuw
      verzamelde meetgegevens aan de desbetreffende BRP's voor 16:00 uur van de vijfde werkdag na afloop van het
      desbetreffende etmaal.


