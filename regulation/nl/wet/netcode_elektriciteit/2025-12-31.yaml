  - number: '10.5'
    text: |-
      1 Netbeheerders dragen hun balanceringsverantwoordelijkheid voor de compensatie van netverliezen over aan een BRP.

      2 Met betrekking tot de balanceringsverantwoordelijkheid van een netbeheerder, niet zijnde de
      netbeheerder van het landelijk hoogspanningsnet, voor de compensatie van netverliezen is het in
      [artikel 10.4, derde tot en met zesde lid][ref1], bepaalde van toepassing, met dien verstande dat de in kennis
      te stellen netbeheerder de netbeheerder is van het net op een hoger spanningsniveau waarop het net van de
      eerstgenoemde netbeheerder is aangesloten.

      3 Op de overdrachtspunten van aansluitingen tussen twee netten wordt geen onbalans bepaald in het kader van de
      uitoefening van balanceringsverantwoordelijkheid.

      4 In afwijking het derde lid wordt op de aansluiting van een gesloten distributiesysteem op het net van een
      netbeheerder wel onbalans bepaald in het kader van de uitoefening van balanceringsverantwoordelijkheid indien
      het een gesloten distributiesysteem betreft waarvan de beheerder geen gebruik maakt van het elektronische
      berichtenverkeer zoals bedoeld in [paragraaf 13.5][ref2] ten behoeve van het faciliteren van derdentoegang.


      [ref1]: https://wetten.overheid.nl/BWBR0037940#Artikel10.4
      [ref2]: https://wetten.overheid.nl/BWBR0037940#Hoofdstuk13
