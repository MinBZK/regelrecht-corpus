  - number: '7.14'
    text: |-
      1 Waar in deze paragraaf ‘gecontracteerd transportvermogen’ staat, wordt zowel het gecontracteerd transportvermogen
      voor afname als het gecontracteerd transportvermogen voor invoeding bedoeld, tenzij één van beide specifiek is
      aangeduid.

      2 De netbeheerder en de aangeslotene die beschikt over een grootverbruikaansluiting komen het gecontracteerd
      transportvermogen overeen en leggen dit vast in (een bijlage bij) de aansluit- en transportovereenkomst.

      3 Het gecontracteerd transportvermogen wordt aangepast overeenkomstig de bepalingen in deze paragraaf.
    url: https://wetten.overheid.nl/BWBR0037940/2025-12-31#Artikel7.14
  - number: '7.15'
    text: |-
      1 Voor aansluitingen die behoren tot een tariefcategorie als bedoeld in
      [artikel 3.7.1, onderdelen a tot en met c, van de Tarievencode elektriciteit][ref1] geldt dat bij overschrijding
      van het gecontracteerd transportvermogen voor afname in de normale bedrijfstoestand het gecontracteerd
      transportvermogen voor afname wordt aangepast naar de waarde van de overschrijding. De nieuwe waarde geldt voor het
      gehele kalenderjaar waarin de overschrijding zich voordoet.

      2 Onverminderd het bepaalde in het eerste lid, past de netbeheerder het gecontracteerd transportvermogen voor
      afname behorende bij aansluitingen als bedoeld in het eerste lid maximaal eenmaal per jaar naar boven of beneden
      aan, indien de aangeslotene hier op redelijke gronden om verzoekt, bijvoorbeeld naar aanleiding van sterk
      gewijzigde omstandigheden bij de verbruiker die vooraf niet in redelijkheid hadden kunnen worden voorzien. De
      netbeheerder kan nadere onderbouwing van de aangegeven gronden voor het verzoek verlangen. De nieuwe waarde gaat
      ten vroegste in op de eerste dag van de kalendermaand die volgt op de maand waarin het verzoek is gedaan.

      3 Het eerste lid of een aanpassing naar boven als bedoeld in het tweede lid, is niet toegestaan
      indien de aansluiting zich bevindt in een congestiegebied voor dezelfde energierichting als bedoeld in
      [artikel 9.9, eerste lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0037951#Artikel3.7.1
