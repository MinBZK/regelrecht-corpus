preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is dat er een integratie tot stand komt van medisch-
    specialistische zorg en ziekenhuiszorg en met het oog daarop de verstrekkingen dienen te worden geherformuleerd;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0010168/2000-02-01#ArtikelAanhef
articles:
  - number: III
    text: |-
      1 Onverminderd de verantwoordelijkheid van het bestuur van een ziekenhuis berust de verantwoordelijkheid voor de
      geneeskundige behandeling en verzorging van patiënten in het ziekenhuis bij de behandelend medisch-specialist. Deze
      neemt daarbij het organisatorische en financiële kader, aangegeven door het bestuur, in acht. Het bestuur van het
      ziekenhuis neemt het zorginhoudelijke kader, aangegeven door de medisch-specialisten, in acht. Het bestuur van het
      ziekenhuis voert overleg met de medisch-specialisten alvorens onderhandelingen met verzekeraars aan te gaan.

      2 Voor de toepassing van dit artikel wordt onder ziekenhuis verstaan een ingevolge de [Ziekenfondswet][ref1] als
      zodanig toegelaten instelling.


      [ref1]: https://wetten.overheid.nl/BWBR0002460
    url: https://wetten.overheid.nl/BWBR0010168/2000-02-01#ArtikelIII
    references:
      - id: ref1
        bwb_id: BWBR0002460
  - number: IV
    text: |-
      1 Na inwerkingtreding van deze wet berust het [Verstrekkingenbesluit ziekenfondsverzekering][ref1] op
      [artikel 8, tweede, derde en vierde lid, van de Ziekenfondswet][ref2].

      2 Na inwerkingtreding van deze wet berust het [Besluit voortzetting verstrekkingen ziekenfondsverzekering][ref3] op
      [artikel 8, zesde lid, van de Ziekenfondswet][ref4].


