preamble:
  text: |-
    Overwegende dat het Commissariaat voor de Media onder meer belast is met het toezicht op de naleving van het
    bepaalde bij of krachtens artikel 52 van de Mediawet (Stb. 1987, nr. 249);

    Overwegende dat het gelet op deze toezichthoudende taak gewenst is, dat de bevoegdheid tot het verlenen van
    ontheffing van het verbod van reclame-uitingen in programma's van instellingen die zendtijd hebben verkregen voor
    binnenlandse omroep als bedoeld in artikel 52, derde lid, van de Mediawet overgedragen wordt aan het Commissariaat
    voor de Media;

    Gelet op artikel 52, derde lid, Mediawet,

    Besluit:
