articles:
  - number: '1'
    text: |-
      De bevoegdheid in bijzondere gevallen ontheffing te verlenen van het bepaalde in
      [artikel 52, tweede lid, eerste volzin van de Mediawet][ref1] wordt overgedragen aan het Commissariaat voor de
      Media.


      [ref1]: https://wetten.overheid.nl/BWBR0004149#Artikel52
