  - number: '7.1'
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van deze wet aan de Staten-Generaal een verslag over de
      doeltreffendheid en de effecten van deze wet in de praktijk.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel7.1
  - number: '7.2'
    text: |-
      1 De NLQF-niveaus die voor de inwerkingtreding van deze wet zijn vermeld op waardedocumenten van formele
      opleidingen, worden geacht te zijn vastgesteld op grond van [artikel 2.1][ref1].

      2 Indien voor de inwerkingtreding van deze wet voor een non-formele opleiding een NLQF-niveau is vastgesteld door
      Stichting CINOP dan wel Stichting CINOP – ecbo, wordt die vaststelling gelijkgesteld met een vaststelling op grond
      van [artikel 3.1][ref2].

      3 Bij of krachtens algemene maatregel van bestuur kunnen regels worden gesteld in verband met de gelijkgestelde
      vaststelling bedoeld in het tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0050058#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0050058#Artikel3.1
