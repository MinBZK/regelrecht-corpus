  - number: '5.1'
    text: |-
      1 Onze Minister kan bij besluit personen aanwijzen die belast worden met het toezicht op de naleving van de bij of
      krachtens deze wet aan het Nationaal coördinatiepunt NLQF opgelegde verplichtingen.

      2 Van een besluit als bedoeld in het eerst lid wordt mededeling gedaan door plaatsing in de Staatscourant.

      3 De toezichthouder beschikt niet over de bevoegdheden, bedoeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
