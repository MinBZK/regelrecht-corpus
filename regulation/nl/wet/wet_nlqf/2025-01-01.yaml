        artikel: '7.11'
  - number: '3.1'
    text: |-
      1 De natuurlijke persoon of rechtspersoon die een non-formele opleiding verzorgt, kan bij het Nationaal
      coördinatiepunt NLQF een aanvraag indienen om het NLQF-niveau vast te stellen van die non-formele opleiding.

      2 Indien van een non-formele opleiding het NLQF-niveau is vastgesteld, vermeldt het Nationaal coördinatiepunt NLQF
      de betreffende opleiding en de natuurlijke persoon of rechtspersoon die deze opleiding verzorgt in een openbaar
      register.

      3 Bij of krachtens algemene maatregel van bestuur worden regels gesteld in verband met:

      a. de vaststelling van het NLQF-niveau van non-formele opleidingen, waaronder in ieder geval voorwaarden aan de
      aanvraag, de geldigheidsduur van de vaststelling en informatieverplichtingen van de aanbieder; en

      b. het register.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel3.1
  - number: '3.2'
    text: |-
      1 Het Nationaal coördinatiepunt NLQF heft voor het vaststellen van een NLQF-niveau van een non-formele opleiding
      leges bij de natuurlijke persoon of rechtspersoon die de betreffende non-formele opleiding verzorgt.

      2 De hoogte van de leges wordt vastgesteld bij ministeriële regeling.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel3.2
  - number: '3.3'
    text: |-
      Indien voor een non-formele opleiding het NLQF-niveau is vastgesteld door het Nationaal coördinatiepunt NLQF kan
      dit niveau of het daarmee correspondeerde EQF-niveau worden vermeld op het waardedocument dat wordt afgegeven voor
      die non-formele opleiding.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel3.3
  - number: '4.1'
    text: |-
      Het is verboden op een waardedocument of op een ander document met gegevens over een opleiding een NLQF-niveau te
      vermelden of een waardedocument of ander document met NLQF-niveau in het vooruitzicht te stellen, tenzij het NLQF-
      niveau voor de betreffende opleiding is vastgesteld op grond van de voorschriften bij of krachtens deze wet.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel4.1
  - number: '4.2'
    text: |-
      1 Het is verboden op een waardedocument of op een ander document met gegevens over een opleiding een EQF-niveau te
      vermelden of een waardedocument of ander document met EQF-niveau in het vooruitzicht te stellen, tenzij:

      a. het EQF-niveau correspondeert met een NLQF-niveau dat voor de betreffende opleiding is vastgesteld op grond van
      de voorschriften bij of krachtens deze wet; of

      b. het EQF-niveau behoort bij een opleiding waar bij of krachtens de wet van een ander land dat participeert in het
      EQF, een EQF-niveau aan verbonden is.

      2 De bewijslast dat aan de voorwaarden van het eerste lid, onderdeel b, is voldaan, rust op degene die een EQF-
      niveau vermeldt of in het vooruitzicht stelt.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel4.2
  - number: '4.3'
    text: |-
      Onze Minister kan een bestuurlijke boete opleggen aan de natuurlijke persoon of rechtspersoon die in strijd met
      [artikel 4.1][ref1] of [4.2][ref2] handelt. Deze boete bedraagt ten hoogste het bedrag dat is vastgesteld voor
      de zesde categorie, bedoeld in [artikel 23, vierde lid, van het Wetboek van Strafrecht][ref3], respectievelijk
      [artikel 27, vierde lid, van het Wetboek van Strafrecht BES][ref4] of, indien dat passender is, ten hoogste 10%
      van de omzet van de onderneming, onderscheidenlijk, indien de overtreding door een ondernemersvereniging is begaan,
      van de gezamenlijke omzet van de ondernemingen die van de vereniging deel uitmaken, in het boekjaar voorafgaande
      aan de beschikking waarin de bestuurlijke boete wordt opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0050058#Artikel4.1
      [ref2]: https://wetten.overheid.nl/BWBR0050058#Artikel4.2
      [ref3]: https://wetten.overheid.nl/BWBR0001854#Artikel23
      [ref4]: https://wetten.overheid.nl/BWBR0028570#Artikel27
