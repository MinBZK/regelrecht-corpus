  - number: '2.1'
    text: Bij ministeriële regeling worden voor bij die regeling te bepalen formele opleidingen, de NLQF-niveaus vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel2.1
  - number: '2.2'
    text: |-
      1 Indien voor een formele opleiding op grond van [artikel 2.1][ref1] een NLQF-niveau is vastgesteld, wordt op een
      waardedocument dat door een onderwijsinstelling voor die formele opleiding wordt afgegeven, het NLQF-niveau en het
      daarmee corresponderende EQF-niveau vermeld.

      2 Indien een onderwijsinstelling voor een deel van een formele opleiding een waardedocument verstrekt waarop die
      formele opleiding wordt vermeld, dan worden ook het NLQF-niveau en het daarmee corresponderende EQF-niveau van die
      formele opleiding vermeld.

      3 Het eerste lid is niet van toepassing op een getuigschrift als bedoeld in
      [artikel 7.11, tweede lid, van de Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0050058#Artikel2.1
      [ref2]: https://wetten.overheid.nl/BWBR0005682#Artikel7.11
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel2.2
