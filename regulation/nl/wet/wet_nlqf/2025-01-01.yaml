preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben dat het, in verband met het Europees kwalificatieraamwerk voor een leven lang
    leren (EQF), wenselijk is regels te geven voor het daaraan te koppelen Nederlands kwalificatieraamwerk (NLQF) met
    oog op het bevorderen van transparantie over kwalificatieniveaus in het onderwijs en op de arbeidsmarkt;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder:

        - *EQF:* Europees kwalificatieraamwerk voor een leven lang leren als bedoeld in de Aanbeveling van de Raad van
      22 mei 2017 inzake het Europees kwalificatiekader voor een leven lang leren en tot intrekking van de aanbeveling
      van het Europees Parlement en de Raad van 23 april 2008 tot vaststelling van een Europees kwalificatiekader voor
      een leven lang leren (PbEU 2017, C 189/15);
        - *EQF-niveau:* kwalificatieniveau binnen het EQF;
        - *formele opleiding:* – voortgezet onderwijs als bedoeld in de [Wet voortgezet onderwijs 2020][ref1]; –
      uitstroomprofiel vervolgonderwijs als bedoeld in [artikel 14a, eerste lid, van de Wet op de expertisecentra][ref2];
      – beroepsopleiding of opleiding educatie als bedoeld in de [Wet educatie en beroepsonderwijs][ref3]
      of de [Wet educatie en beroepsonderwijs BES][ref4]; of – opleiding of promotie als bedoeld in de
      [Wet op het hoger onderwijs en wetenschappelijk onderzoek][ref5];
        - *kwalificatie:* beoogde leeruitkomsten, zijnde wat men kent en kan doen na de voltooiing van een opleiding;
        - *kwalificatieniveau:* niveau van de kwalificatie die wordt beschreven in termen van kennis, vaardigheden,
      zelfstandigheid en verantwoordelijkheid;
        - *Nationaal coördinatiepunt NLQF:* op grond van [artikel 1.4, eerste lid][ref6], aangewezen rechtspersoon;
        - *non-formele opleiding:* leertraject niet zijnde een formele opleiding;
        - *NLQF:* Nederlands kwalificatieraamwerk als bedoeld in [artikel 1.3][ref7];
        - *NLQF-niveau:* kwalificatieniveau binnen het NLQF;
        - *onderwijsinstelling:* instelling die bij of krachtens de wet bevoegd is om een waardedocument te verstrekken
      voor een formele opleiding waarvoor op grond van [artikel 2.1][ref8] een NLQF-niveau is vastgesteld;
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *opleiding:* formele opleiding of non-formele opleiding;
        - *waardedocument:* diploma, diplomasupplement, getuigschrift, certificaat of ander document waarin wordt vermeld
      dat een opleiding met succes is afgerond.


