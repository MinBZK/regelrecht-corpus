  - number: '1.2'
    text: Deze wet is mede van toepassing op de openbare lichamen Bonaire, Sint Eustatius en Saba.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel1.2
  - number: '1.3'
    text: |-
      1 Het NLQF is een samenhangend geheel van kwalificatieniveaus die corresponderen met die van het EQF.

      2 Bij of krachtens algemene maatregel van bestuur worden de NLQF-niveaus en hun relatie met de EQF-niveaus
      vastgesteld.
    url: https://wetten.overheid.nl/BWBR0050058/2025-01-01#Artikel1.3
  - number: '1.4'
    text: |-
      1 Bij algemene maatregel van bestuur wordt een rechtspersoon aangewezen als Nationaal coördinatiepunt NLQF.

      2 Het Nationaal coördinatiepunt NLQF heeft tot taak:

      a. het op aanvraag vaststellen van het NLQF-niveau van een non-formele opleiding;

      b. het beheren van een openbaar register van non-formele opleidingen waarvoor op grond van [artikel 3.1][ref1] een
      NLQF-niveau is vastgesteld;

      c. het verstrekken van informatie over het NLQF en het EQF; en

      d. het onderhoud en het beheer van het NLQF en het bijdragen aan de ontwikkeling van het EQF.

      3 Indien het Nationaal coördinatiepunt NLQF vaststelt dat niet langer wordt voldaan aan de voorwaarden op grond
      waarvan het NLQF-niveau van een non-formele opleiding is vastgesteld, kan het Nationaal coördinatiepunt NLQF het
      besluit tot vaststelling van het NLQF-niveau van die non-formele opleiding intrekken.

      4 Wijzigingen in de statuten van het Nationaal coördinatiepunt NLQF behoeven de goedkeuring van Onze Minister.

      5 Onze Minister verstrekt het Nationaal coördinatiepunt NLQF subsidie voor de taken, genoemd in dit artikel. Bij
      ministeriële regeling worden nadere regels gesteld voor die verstrekking.

      6 De voordracht voor een krachtens het eerste lid vast te stellen algemene maatregel van bestuur wordt niet eerder
      gedaan dan vier weken nadat het ontwerp aan beide Kamers der Staten-Generaal is overgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0050058#Artikel3.1
