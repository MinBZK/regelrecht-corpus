bwb_id: BWBR0007919
url: https://wetten.overheid.nl/BWBR0007919/2018-07-01
preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt de Kaderwet verstrekking financiële middelen EZ en de Kaderwet specifieke uitkeringen EZ te
    vervangen door nieuwe regels die een wettelijk kader scheppen voor de verstrekking van subsidies door de Minister
    van Economische Zaken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Economische
      Zaken.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel1
  - number: '2.1'
    text: 'Onze Minister kan subsidies verstrekken voor activiteiten die passen in het beleid inzake:'
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.a
    text: bosbouw;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.b
    text: dierenwelzijn;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.c
    text: energie en duurzaamheid;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.d
    text: innovatie;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.e
    text: landbouw en landbouwonderwijs;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.f
    text: mededinging;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.g
    text: natuur;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.h
    text: ondernemerschap;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.i
    text: openluchtrecreatie;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.j
    text: post;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.k
    text: regionale ontwikkeling;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.l
    text: telecommunicatie;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.m
    text: visserij;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: 2.1.n
    text: voedselveiligheid.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: '2.2'
    text: |-
      Onze Minister kan voorts subsidies verstrekken voor activiteiten op het gebied van de onderwerpen, die genoemd
      zijn in de begrotingsstaat, onderdeel uitgaven en verplichtingen, behorend bij de wet, houdende vaststelling van
      de begroting van uitgaven en ontvangsten van het Ministerie van Economische Zaken voor het desbetreffende jaar, of
      voor een voorafgaand jaar voor zover daarin een beschikking tot subsidieverlening is gegeven. Indien bij de aanvang
      van enig jaar bedoelde wet nog niet in werking is getreden, wordt tot die inwerkingtreding het voorstel daartoe in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: '2.3'
    text: |-
      Het eerste lid is niet van toepassing op landbouwonderwijs voor zover Onze Minister subsidie voor landbouwonderwijs
      en onderzoek op één van de terreinen, genoemd in het eerste lid, kan verstrekken bij of krachtens een andere wet.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel2
  - number: '3.1'
    text: |-
      Onverminderd [hoofdstuk 3 van de Financiële-verhoudingswet][ref1] kunnen bij of krachtens algemene maatregel van
      bestuur of bij regeling van Onze Minister de activiteiten waarvoor subsidie kan worden verstrekt, nader worden
      bepaald alsmede andere criteria voor die verstrekking worden vastgesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk3
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0008290
        hoofdstuk: '3'
  - number: '3.2'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen voorts regels worden
      vastgesteld met betrekking tot:
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.a
    text: het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.b
    text: de aanvraag van een subsidie en de besluitvorming daarover;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.c
    text: de voorwaarden waaronder de subsidie wordt verleend;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.d
    text: de verplichtingen voor de subsidie-ontvanger;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.e
    text: de vaststelling van de subsidie;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.f
    text: intrekking en wijziging van de subsidieverlening of -vaststelling;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.g
    text: de betaling van de subsidie en het verlenen van voorschotten;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: 3.2.h
    text: |-
      het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '3.3'
    text: |-
      Bij of krachtens algemene maatregel van bestuur of een ministeriële regeling als bedoeld in het eerste lid wordt
      voorzien in de vaststelling van een subsidieplafond en de regeling van de wijze van verdeling ervan, tenzij Onze
      Minister van Financiën heeft ingestemd met het achterwege laten daarvan.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: '3.4'
    text: |-
      In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet
      van toepassing op subsidies die worden verstrekt op grond van een algemene maatregel van bestuur of ministeriële
      regeling als bedoeld in het eerste lid, die uitsluitend voorziet in verstrekking aan rechtspersonen die krachtens
      publiekrecht zijn ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '3.5'
    text: |-
      Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld
      in het eerste lid, met inbegrip van het nemen van besluiten op grond van deze regels, delegeren aan andere
      bestuursorganen.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel3
  - number: '4'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 3][ref1], tenzij het een subsidie betreft:


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: 4.a
    text: |-
      als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref1] of


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
  - number: 4.b
    text: waarvan de voorgenomen verstrekking tevoren schriftelijk is medegedeeld aan de beide Kamers der Staten-Generaal.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel4
  - number: '5'
    text: |-
      Indien de in [artikel 3, eerste lid][ref1], bedoelde regels bepalen dat de subsidie kan worden verstrekt in de
      openbare lichamen Bonaire, Sint Eustatius of Saba, is deze wet voor die subsidie aldaar van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: '6.1'
    text: |-
      Onze Minister kan met betrekking tot een subsidie, die niet op grond van een algemene maatregel
      van bestuur of een ministeriële regeling als bedoeld in [artikel 3][ref1] wordt verstrekt, bij de
      subsidieverlening of, indien geen beschikking tot subsidieverlening is gegeven, bij de subsidievaststelling
      bepalen, dat een subsidie-ontvanger een vergoeding voor vermogensvorming verschuldigd is overeenkomstig
      [artikel 4:41 van de Algemene wet bestuursrecht][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '6.2'
    text: |-
      De wijze waarop de hoogte van de vergoeding wordt bepaald wordt vermeld in de beschikking tot subsidieverlening of
      subsidievaststelling, bedoeld in het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel6
  - number: '7.1'
    text: |-
      Voor zover subsidieverstrekking in strijd zou zijn met ingevolge een verdrag voor de Staat geldende verplichtingen,
      kan Onze Minister:
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel7
  - number: 7.1.a
    text: subsidieverstrekking weigeren;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel7
  - number: 7.1.b
    text: een subsidie lager vaststellen dan overeenkomstig de subsidieverlening;
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel7
  - number: 7.1.c
    text: een subsidieverlening of subsidievaststelling intrekken of ten nadele van de ontvanger wijzigen.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel7
  - number: '7.2'
    text: |-
      Bij de vaststelling, intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde subsidiebedragen
      een rentevergoeding verschuldigd is.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel7
  - number: '7.3'
    text: |-
      De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel7
  - number: '7.4'
    text: |-
      De [artikelen 4:49, derde lid][ref1], en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet van
      toepassing op de vaststelling, intrekking en wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel4
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: '4'
  - number: '8.1'
    text: |-
      Met het toezicht op de naleving van het bepaalde bij of krachtens deze wet zijn belast de bij besluit van Onze
      Minister aangewezen personen.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel8
  - number: '8.2'
    text: Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel8
  - number: '8.3'
    text: |-
      Aan subsidies op grond van deze wet is de verplichting verbonden dat de subsidie-ontvanger aan een toezichthouder
      alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel8
  - number: '10.1'
    text: |-
      De Kaderwet verstrekking financiële middelen EZ en de Kaderwet specifieke uitkeringen EZ worden ingetrokken, met
      dien verstande dat zij van toepassing blijven op subsidies die voor de inwerkingtreding van deze wet zijn verleend
      of vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel10
  - number: '10.2'
    text: |-
      Na de inwerkingtreding van deze wet berusten de op grond van artikel 2 van de Kaderwet verstrekking financiële
      middelen EZ en artikel 2 van de Kaderwet specifieke uitkeringen EZ berustende algemene maatregelen van bestuur en
      ministeriële regelingen op [artikel 3][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: '11.1'
    text: |-
      Na de inwerkingtreding van de wet van 11 november 2013 tot wijziging van de Kaderwet EZ-subsidies (aanpassing aan
      de samenvoeging van de voormalige ministeries van Economische Zaken en van Landbouw, Natuur en Voedselkwaliteit)
      (Stb. 2013, 482) berusten de op grond van [artikel 4 van de Kaderwet LNV-subsidies][ref1] vastgestelde ministeriële
      regelingen op [artikel 3][ref2] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0009194#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009194
        artikel: '4'
      - id: ref2
        bwb_id: BWBR0007919
        artikel: '3'
  - number: '11.2'
    text: |-
      Het bij of krachtens de [Kaderwet LNV-subsidies][ref1] bepaalde blijft van toepassing op subsidies die voor de
      inwerkingtreding van de wet van 11 november 2013 tot wijziging van de Kaderwet EZ-subsidies (aanpassing aan de
      samenvoeging van de voormalige ministeries van Economische Zaken en van Landbouw, Natuur en Voedselkwaliteit) (Stb.
      2013, 482) zijn verstrekt.


      [ref1]: https://wetten.overheid.nl/BWBR0009194
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0009194
  - number: '12'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Kaderwet EZ-subsidies.'
    url: https://wetten.overheid.nl/BWBR0007919/2018-07-01#Artikel13
