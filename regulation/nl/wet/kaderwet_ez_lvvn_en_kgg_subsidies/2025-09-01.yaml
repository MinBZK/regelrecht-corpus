  - number: '4'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 3][ref1], tenzij het een subsidie betreft:

      a. als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref2] of

      b. waarvan de voorgenomen verstrekking tevoren schriftelijk is medegedeeld aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel423
