  - number: 2a
    text: |-
      1 Onze Minister, bedoeld in artikel 1, onderdeel b, kan subsidies verstrekken voor activiteiten die passen in het
      beleid inzake:

      a. bosbouw;

      b. dieren;

      c. landbouw;

      d. natuur en biodiversiteit;

      e. inrichting, beheer en transitie landelijk gebied;

      f. regionale economische ontwikkeling;

      g. visserij;

      h. voedsel.

      2 Onze Minister, bedoeld in [artikel 1, onderdeel b][ref1], kan voorts subsidies verstrekken voor activiteiten
      op het gebied van de onderwerpen die genoemd zijn in de begrotingsstaat, onderdeel uitgaven en verplichtingen,
      behorend bij de Wet, houdende vaststelling van de begroting van uitgaven en ontvangsten van het Ministerie van
      Landbouw, Visserij, Voedselzekerheid en Natuur voor het desbetreffende jaar, of voor een voorafgaand jaar voor
      zover daarin een beschikking tot subsidieverlening is gegeven. Indien bij de aanvang van enig jaar bedoelde wet nog
      niet in werking is getreden, wordt tot die inwerkingtreding het voorstel daartoe in aanmerking genomen.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel1
