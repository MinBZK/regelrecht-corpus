      1 Onze Minister, bedoeld in [artikel 1, onderdeel c][ref1], kan subsidies verstrekken voor activiteiten die passen
      in het beleid inzake:

      a. duurzaamheid;

      b. energie;

      c. groene groei;

      d. klimaat;

      e. mijnbouw;

      f. verduurzaming industrie.

      2 Onze Minister, bedoeld in [artikel 1, onderdeel c][ref2], kan voorts subsidies verstrekken voor activiteiten
      op het gebied van de onderwerpen die genoemd zijn in de begrotingsstaat, onderdeel uitgaven en verplichtingen,
