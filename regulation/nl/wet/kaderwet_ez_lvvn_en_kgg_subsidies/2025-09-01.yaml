  - number: 7a
    text: |-
      1 Onze Minister houdt, voor zover het een beleidsterrein op grond van [artikel 2][ref1], [2a][ref2] of [2b][ref3]
      betreft, waarvoor hij verantwoordelijk is, een register bij ten behoeve van de voorkoming van misbruik bij een
      volgende subsidieverstrekking op grond van deze wet of dezelfde bij of krachtens deze wet vastgestelde algemene
      maatregel van bestuur of dezelfde regeling van Onze Minister, voor de gevallen waarin deze volgende subsidie
      gebaseerd is op hetzelfde beleidsterrein, bedoeld in de [artikelen 2][ref4], [2a][ref5] of [2b][ref6], als de
      subsidie ten behoeve waarvan op grond van het tweede lid de registratie heeft plaatsgevonden.

      2 In het register, bedoeld in het eerste lid, vindt de registratie plaats in het geval er sprake is van misbruik
      ten behoeve van subsidieverstrekking en dat misbruik zal leiden of heeft geleid tot de volgende maatregelen van
      Onze Minister:

      a. een beslissing tot het afwijzen van een aanvraag om subsidie;

      b. een beslissing tot het opleggen van een boete aan een subsidieontvanger op grond van de Wet bestuurlijke boete
      meldingsplichten door ministers verstrekte subsidies;

      c. een beslissing tot het lager vaststellen van de subsidie op grond van
      [artikel 4:46, tweede lid, van de Algemene wet bestuursrecht][ref7], het intrekken
      of ten nadele van de subsidieontvanger wijzigen van de subsidieverlening op grond van
      [artikel 4:48, eerste lid, onderdelen a, b, c of d, van de Algemene wet bestuursrecht][ref8] en het
      intrekken of ten nadele van de subsidieontvanger wijzigen van de subsidievaststelling op grond van
      [artikel 4:49, eerste lid, van de Algemene wet bestuursrecht][ref9]; of

      d. het doen van aangifte bij het Openbaar Ministerie vanwege vermoedens van strafbare feiten als bedoeld in
      [artikel 162 van het Wetboek van Strafvordering][ref10] die verband houden met de voorbereiding en de indiening
      van een aanvraag om subsidie of de aanvraag tot subsidievaststelling, de wijze van het gebruik van de subsidie,
      de wijze van uitvoering van de activiteiten waarvoor de subsidie bestemd is of naleving van de aan de subsidie
      verbonden verplichtingen.

      3 In het register, bedoeld in het eerste lid, worden de volgende gegevens opgenomen en bewaard voor ten hoogste een
      termijn van drie jaren na de datum waarop een maatregel als bedoeld in het tweede lid, is getroffen:

      a. gegevens over de subsidieaanvrager, subsidieontvanger of diens vertegenwoordiger jegens wie een maatregel als
      bedoeld in het tweede lid, wordt of is getroffen, bestaande uit de naam van de desbetreffende natuurlijke persoon
      of rechtspersoon die geregistreerd wordt, het subsidiekenmerk en, voor zover van toepassing, het nummer waarmee de
      te registreren natuurlijke persoon of rechtspersoon is geregistreerd bij de Kamer van Koophandel;

      b. de aard van de gedraging die tot registratie in het register heeft geleid; en

      c. voor zover dit voor de toepassing van het vijfde lid noodzakelijk is, een omschrijving van de maatregel, bedoeld
      in het tweede lid, die wordt of is getroffen en het subsidiebedrag dat daarmee is gemoeid.

      4 Het register, bedoeld in het eerste lid, wordt uitsluitend bijgewerkt, beheerd en geraadpleegd door daartoe door
      Onze Minister aangewezen ambtenaren.

      5 Onze Minister kan aan de gegevens, bedoeld in het derde lid, ten behoeve van de voorkoming van misbruik bij een
      volgende subsidieverstrekking, bedoeld in het eerste lid, gevolgen verbinden bij de beoordeling van de aanvraag om
      subsidieverlening of de aanvraag tot subsidievaststelling of de in het kader van de bij de subsidieverstrekking op
      te leggen verplichtingen en de controle op de naleving hiervan.

      6 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen aanvullende regels
      worden vastgesteld met betrekking tot onderwerpen die, in aanvulling op de regels van dit artikel, nadere regeling
      behoeven om misbruik van subsidies te voorkomen.


