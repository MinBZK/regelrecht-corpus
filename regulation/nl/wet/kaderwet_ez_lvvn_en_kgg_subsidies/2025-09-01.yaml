  - number: '3'
    text: |-
      1 Onverminderd [hoofdstuk 3 van de Financiële-verhoudingswet][ref1] kunnen bij of krachtens algemene maatregel
      van bestuur of bij regeling van Onze Minister de activiteiten waarvoor subsidie kan worden verstrekt, nader worden
      bepaald alsmede andere criteria voor die verstrekking worden vastgesteld.

      2 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen voorts regels worden
      vastgesteld met betrekking tot:

      a. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      b. de aanvraag om subsidie en de besluitvorming daarover;

      c. de voorwaarden waaronder de subsidie wordt verleend;

      d. de verplichtingen voor de subsidie-ontvanger;

      e. de vaststelling van de subsidie, waaronder mede begrepen de aanvraag tot subsidievaststelling en de
      besluitvorming daarover;

      f. intrekking en wijziging van de subsidieverlening of -vaststelling;

      g. de betaling van de subsidie en het verlenen van voorschotten;

      h. het verslag over de doeltreffendheid en de effecten van de subsidie in de praktijk, bedoeld in
      [artikel 4:24 van de Algemene wet bestuursrecht][ref2].

      3 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kan voorts worden bepaald dat:

      a. het verstrekken van gegevens, waaronder mede begrepen de wijze van indiening van een aanvraag om subsidie en een
      aanvraag tot subsidievaststelling als bedoeld in het tweede lid, onderdelen b respectievelijk e, uitsluitend langs
      elektronische weg kan geschieden; en

      b. Onze Minister ontheffing kan verlenen van het bepaalde op grond van onderdeel a, waarbij aan de ontheffing
      voorschriften kunnen worden verbonden.

      4 Bij of krachtens algemene maatregel van bestuur of een ministeriële regeling als bedoeld in het eerste lid wordt
      voorzien in de vaststelling van een subsidieplafond en de regeling van de wijze van verdeling ervan, tenzij Onze
      Minister van Financiën heeft ingestemd met het achterwege laten daarvan.

      5 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref3] is titel 4.2 van die wet
      van toepassing op subsidies die worden verstrekt op grond van een algemene maatregel van bestuur of ministeriële
      regeling als bedoeld in het eerste lid, die uitsluitend voorziet in verstrekking aan rechtspersonen die krachtens
      publiekrecht zijn ingesteld.

      6 Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld
      in het eerste lid, met inbegrip van het nemen van besluiten op grond van deze regels, delegeren aan andere
      bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0008290#Hoofdstuk3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel424
      [ref3]: https://wetten.overheid.nl/BWBR0005537#Artikel421
