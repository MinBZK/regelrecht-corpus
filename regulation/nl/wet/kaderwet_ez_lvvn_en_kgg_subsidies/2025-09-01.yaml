preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt de Kaderwet verstrekking financiële middelen EZ en de Kaderwet specifieke uitkeringen EZ te
    vervangen door nieuwe regels die een wettelijk kader scheppen voor de verstrekking van subsidies door de Minister
    van Economische Zaken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007919/2025-09-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister:

      a. Onze Minister van Economische Zaken of Onze Minister die belast is met de zorg voor één of meer
      beleidsterreinen, bedoeld in [artikel 2, eerste lid][ref1], ieder voor zover het betreft het beleidsterrein
      waarvoor hij verantwoordelijk is;

      b. Onze Minister van Landbouw, Visserij, Voedselzekerheid en Natuur of Onze Minister die belast is met de zorg
      voor één of meer beleidsterreinen, bedoeld in [artikel 2a, eerste lid][ref2], ieder voor zover het betreft het
      beleidsterrein waarvoor hij verantwoordelijk is; of

      c. Onze Minister van Klimaat en Groene Groei of Onze Minister die belast is met de zorg voor één of meer
      beleidsterreinen, bedoeld in [artikel 2b, eerste lid][ref3], ieder voor zover het betreft het beleidsterrein
      waarvoor hij verantwoordelijk is.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel2
      [ref2]: https://wetten.overheid.nl/BWBR0007919#Artikel2a
      [ref3]: https://wetten.overheid.nl/BWBR0007919#Artikel2b
