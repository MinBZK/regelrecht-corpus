        artikel: 4:41
  - number: '7'
    text: |-
      1 Voor zover subsidieverstrekking in strijd zou zijn met ingevolge een verdrag voor de Staat geldende
      verplichtingen, kan Onze Minister:

      a. subsidieverstrekking weigeren;

      b. een subsidie lager vaststellen dan overeenkomstig de subsidieverlening;

      c. een subsidieverlening of subsidievaststelling intrekken of ten nadele van de ontvanger wijzigen.

      2 Bij de vaststelling, intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde
      subsidiebedragen een rentevergoeding verschuldigd is.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.

      4 De [artikelen 4:49, derde lid][ref1], en [4:57, vierde lid, van de Algemene wet bestuursrecht][ref2] zijn niet
      van toepassing op de vaststelling, intrekking en wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0007919/2025-09-01#Artikel7
