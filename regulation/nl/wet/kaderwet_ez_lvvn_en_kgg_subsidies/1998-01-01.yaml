preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo wij in overweging genomen hebben, dat de totstandkoming van de derde tranche van de Algemene wet bestuursrecht
    het wenselijk maakt de Kaderwet verstrekking financiële middelen EZ en de Kaderwet specifieke uitkeringen EZ te
    vervangen door nieuwe regels die een wettelijk kader scheppen voor de verstrekking van subsidies door de Minister
    van Economische Zaken;

    Zo is het, dat Wij, de Raad van State gehoord, en met gemeen overleg der Staten-Generaal, hebben goedgevonden en
    verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze wet en de daarop berustende bepalingen wordt verstaan onder Onze Minister: Onze Minister van Economische
      Zaken.
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel1
  - number: '2'
    text: |-
      1 Onze Minister kan subsidies verstrekken voor activiteiten welke passen in:

      a. het technologiebeleid;

      b. het ruimtelijk economisch beleid;

      c. het beleid met betrekking tot het midden- en kleinbedrijf;

      d. het beleid met betrekking tot energiebesparing en duurzame energie;

      e. het exportbevorderingsbeleid.

      2 Onze Minister kan voorts subsidies verstrekken voor activiteiten op het gebied van de onderwerpen, die genoemd
      zijn in de begrotingsstaat, onderdeel uitgaven en verplichtingen, behorend bij de wet, houdende vaststelling van
      de begroting van uitgaven en ontvangsten van het Ministerie van Economische Zaken voor het desbetreffende jaar, of
      voor een voorafgaand jaar voor zover daarin een beschikking tot subsidieverlening is gegeven. Indien bij de aanvang
      van enig jaar bedoelde wet nog niet in werking is getreden, wordt tot die inwerkingtreding het voorstel daartoe in
      aanmerking genomen.
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel2
  - number: '3'
    text: |-
      1 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen de activiteiten
      waarvoor subsidie kan worden verstrekt nader worden bepaald alsmede andere criteria voor die verstrekking worden
      vastgesteld.

      2 Bij of krachtens algemene maatregel van bestuur of bij regeling van Onze Minister kunnen voorts regels worden
      vastgesteld met betrekking tot:

      a. het bedrag van de subsidie dan wel de wijze waarop dit bedrag wordt bepaald;

      b. de aanvraag van een subsidie en de besluitvorming daarover;

      c. de voorwaarden waaronder de subsidie wordt verleend;

      d. de verplichtingen voor de subsidie-ontvanger;

      e. de vaststelling van de subsidie;

      f. intrekking en wijziging van de subsidieverlening of -vaststelling;

      g. de betaling van de subsidie en het verlenen van voorschotten.

      3 Bij een algemene maatregel van bestuur of een ministeriële regeling als bedoeld in het eerste lid wordt voorzien
      in de vaststelling van een subsidieplafond en de regeling van de wijze van verdeling ervan, tenzij Onze Minister
      van Financiën heeft ingestemd met het achterwege laten daarvan.

      4 In afwijking van [artikel 4:21, derde lid, van de Algemene wet bestuursrecht][ref1] is titel 4.2 van die wet
      van toepassing op subsidies die worden verstrekt op grond van een algemene maatregel van bestuur of ministeriële
      regeling als bedoeld in het eerste lid, die uitsluitend voorziet in verstrekking aan rechtspersonen die krachtens
      publiekrecht zijn ingesteld.

      5 Onze Minister kan de uitvoering van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld
      in het eerste lid, met inbegrip van het nemen van besluiten op grond van deze regels, delegeren aan andere
      bestuursorganen.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel421
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:21
  - number: '4'
    text: |-
      Onze Minister verstrekt slechts subsidie op grond van een algemene maatregel van bestuur of een ministeriële
      regeling als bedoeld in [artikel 3][ref1], tenzij het een subsidie betreft:

      a. als bedoeld in [artikel 4:23, derde lid, van de Algemene wet bestuursrecht][ref2] of

      b. waarvan de voorgenomen verstrekking tevoren schriftelijk is medegedeeld aan de beide Kamers der Staten-Generaal.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel423
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:23
  - number: '5'
    text: |-
      Onze Minister publiceert ten minste eenmaal in de vijf jaren een verslag over de doeltreffendheid en de effecten in
      de praktijk van subsidies die:

      a. worden verstrekt op basis van een algemene maatregel van bestuur of een ministeriële regeling als bedoeld in
      [artikel 3][ref1] of

      b. worden verstrekt in incidentele gevallen voor meer dan vijf jaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: '6'
    text: |-
      1 Onze Minister kan met betrekking tot een subsidie, die niet op grond van een algemene maatregel
      van bestuur of een ministeriële regeling als bedoeld in [artikel 3][ref1] wordt verstrekt, bij de
      subsidieverlening of, indien geen beschikking tot subsidieverlening is gegeven, bij de subsidievaststelling
      bepalen, dat een subsidie-ontvanger een vergoeding voor vermogensvorming verschuldigd is overeenkomstig
      [artikel 4:41 van de Algemene wet bestuursrecht][ref2].

      2 De wijze waarop de hoogte van de vergoeding wordt bepaald wordt vermeld in de beschikking tot subsidieverlening
      of subsidievaststelling, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel441
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:41
  - number: '7'
    text: |-
      1 Voor zover subsidieverstrekking in strijd is met ingevolge een verdrag voor de staat geldende verplichtingen, kan
      Onze Minister:

      a. subsidieverlening weigeren;

      b. een subsidie lager vaststellen dan overeenkomstig de subsidieverlening;

      c. een subsidieverlening of subsidievaststelling intrekken of ten nadele van de ontvanger wijzigen.

      2 Bij de vaststelling, intrekking of wijziging kan worden bepaald, dat over onverschuldigd betaalde
      subsidiebedragen een rentevergoeding verschuldigd is.

      3 De intrekking of wijziging werkt terug tot en met het tijdstip waarop de subsidie is verstrekt, tenzij bij de
      intrekking of wijziging anders is bepaald.

      4 De [artikelen 4:49][ref1], derde lid, en [4:57 van de Algemene wet bestuursrecht][ref2] zijn niet van toepassing
      op de vaststelling, intrekking en wijziging, bedoeld in het eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel449
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel457
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 4:49
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 4:57
  - number: '8'
    text: |-
      1 Met het toezicht op de naleving van de bij of krachtens deze wet aan de subsidie-ontvanger opgelegde
      verplichtingen zijn belast de bij besluit van Onze Minister aangewezen personen.

      2 De toezichthouder beschikt niet over de bevoegdheden, vermeld in de [artikelen 5:18][ref1] en
      [5:19 van de Algemene wet bestuursrecht][ref2].

      3 Van een besluit als bedoeld in het eerste lid wordt mededeling gedaan door plaatsing in de *Staatscourant*.

      4 Aan subsidies op grond van deze wet is de verplichting verbonden dat de subsidie-ontvanger aan een toezichthouder
      alle medewerking verleent die deze redelijkerwijs kan vorderen bij de uitoefening van zijn bevoegdheden.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Artikel518
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Artikel519
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0005537
        artikel: 5:18
      - id: ref2
        bwb_id: BWBR0005537
        artikel: 5:19
  - number: '9'
    text: |-
      Tegen een besluit, genomen op grond van deze wet kan een belanghebbende beroep instellen bij het College van Beroep
      voor het bedrijfsleven.
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel9
  - number: '10'
    text: |-
      1 De Kaderwet verstrekking financiële middelen EZ en de Kaderwet specifieke uitkeringen EZ worden ingetrokken, met
      dien verstande dat zij van toepassing blijven op subsidies die voor de inwerkingtreding van deze wet zijn verleend
      of vastgesteld.

      2 Na de inwerkingtreding van deze wet berusten de op grond van artikel 2 van de Kaderwet verstrekking financiële
      middelen EZ en artikel 2 van de Kaderwet specifieke uitkeringen EZ berustende algemene maatregelen van bestuur en
      ministeriële regelingen op [artikel 3][ref1] van deze wet.


      [ref1]: https://wetten.overheid.nl/BWBR0007919#Artikel3
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007919
        artikel: '3'
  - number: '11'
    text: De tekst van de Kaderwet EZ-subsidies wordt in het *Staatsblad* geplaatst.
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel11
  - number: '12'
    text: Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip.
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel12
  - number: '13'
    text: 'Deze wet wordt aangehaald als: Kaderwet EZ-subsidies.'
    url: https://wetten.overheid.nl/BWBR0007919/1998-01-01#Artikel13
