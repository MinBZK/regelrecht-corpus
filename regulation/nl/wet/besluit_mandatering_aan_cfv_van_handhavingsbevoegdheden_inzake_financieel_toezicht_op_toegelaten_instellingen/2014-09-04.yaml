preamble:
  text: |-
    Gelet op afdeling 10.1.1 van de Algemene wet bestuursrecht en de artikelen 70d, tweede lid en 105 van de Woningwet;

    Gezien de schriftelijke instemming van het bestuur van het Centraal Fonds voor de Volkshuisvesting (brief d.d.
    15 juli 2014 met kenmerk HH/RV/14.322);

    Besluit:
  url: https://wetten.overheid.nl/BWBR0035508/2014-09-04#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In dit besluit wordt verstaan onder:

      a. *minister:* Minister voor Wonen en Rijksdienst;

      b. *ministerie:* Ministerie van Binnenlandse Zaken en Koninkrijksrelaties;

      c. *fonds:* Centraal Fonds voor de Volkshuisvesting, bedoeld in [artikel 71 van de Woningwet][ref1];

      d. *bestuur:* bestuur van het fonds.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel71
    url: https://wetten.overheid.nl/BWBR0035508/2014-09-04#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0005181
        artikel: '71'
  - number: '2'
    text: |-
      1 Aan het bestuur wordt mandaat en machtiging verleend voor het nemen van besluiten en het verrichten
      van overige handelingen die verband houden met de aan de minister toekomende bevoegdheid tot handhaving,
      bedoeld in de [artikelen 70d, tweede lid][ref1] en [105 van de Woningwet][ref2], voor zover het betreft
      werkzaamheden in het kader van het geven van aanwijzingen aan toegelaten instellingen, het aanwijzen
      van toezichthouders en het opleggen van een last onder dwangsom. Het mandaat en de machtiging betreffen
      uitsluitend de onderwerpen met betrekking tot welke het fonds, ingevolge de artikelen 70d, eerste lid, en
      [71a, eerste lid, aanhef en onderdeel b, van de Woningwet][ref3], met het toezicht is belast.

      2 Aan het bestuur wordt volmacht verleend voor het verrichten van rechtshandelingen die verband houden met de
      invordering van verbeurde dwangsommen als bedoeld in [artikel 5:25 van de Algemene wet bestuursrecht][ref4], voor
      zover deze verband houden met de bevoegdheid, bedoeld in het eerste lid.

      3 Het op grond van dit besluit verleende mandaat omvat mede de bevoegdheid tot het vaststellen, wijzigen of
      intrekken van beleidsregels met betrekking tot de uitoefening van de bevoegdheden, bedoeld in het eerste en tweede
      lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005181#Artikel70d
      [ref2]: https://wetten.overheid.nl/BWBR0005181#Artikel105
      [ref3]: https://wetten.overheid.nl/BWBR0005181#Artikel71a
      [ref4]: https://wetten.overheid.nl/BWBR0005537#Artikel525
    url: https://wetten.overheid.nl/BWBR0035508/2014-09-04#Artikel2
