  - number: '7'
    text: |-
      1 Het bestuur informeert de minister over zwaarwegende en politiek-bestuurlijk gevoelige omstandigheden en
      gebeurtenissen die betrekking hebben op de gemandateerde bevoegdheden.

      2 Het eerste lid is van overeenkomstige toepassing op bevoegdheden die zijn verleend op basis van volmacht en
      machtiging.
    url: https://wetten.overheid.nl/BWBR0035508/2014-09-04#Artikel7
