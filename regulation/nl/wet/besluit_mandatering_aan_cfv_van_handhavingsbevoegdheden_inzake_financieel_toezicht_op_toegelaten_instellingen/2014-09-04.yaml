  - number: '5'
    text: |-
      Het krachtens dit mandaat, volmacht en machtiging ondertekenen van stukken geschiedt als volgt:

      De Minister voor Wonen en Rijksdienst,

      namens deze:

      (handtekening)

      (naam functionaris)

      (functie)
    url: https://wetten.overheid.nl/BWBR0035508/2014-09-04#Artikel5
  - number: '6'
    text: |-
      Het bestuur is niet bevoegd om zelfstandig verzoeken in het kader van de [Wet openbaarheid van bestuur][ref1], de
      [Wet nationale ombudsman][ref2] of de [Wet bescherming persoonsgegevens][ref3], voor zover die verband houden met
      de uitvoering van de in de [artikelen 2][ref4] en [3][ref5] van dit besluit bedoelde taken namens de minister af
      te doen. Dergelijke zaken worden door het bestuur inhoudelijk voorbereid en ter afdoening, door tussenkomst van
      de Directie Constitutionele Zaken en Wetgeving van het ministerie, aan de secretaris-generaal van het ministerie
      onderscheidenlijk de minister voorgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0005252
      [ref2]: https://wetten.overheid.nl/BWBR0003372
      [ref3]: https://wetten.overheid.nl/BWBR0011468
