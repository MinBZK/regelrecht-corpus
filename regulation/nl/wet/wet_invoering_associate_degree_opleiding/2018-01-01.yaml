preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het wenselijk is om het Associate degree-programma om te vormen
    tot zelfstandige associate degree-opleiding met een eigen profiel en zo de associate degree meer dan nu
    als aantrekkelijke route binnen het hoger onderwijs te positioneren ten behoeve van groepen mbo4-studenten
    en werkenden, die anders niet zouden doorstuderen in het hoger onderwijs of voor wie de duur van een hbo-
    bacheloropleiding een drempel vormt, dat het voorts wenselijk is om het niet-bekostigd onderwijs toe te voegen
    aan de systematiek van het diplomaregister en in verband daarmee de Wet op het hoger onderwijs en wetenschappelijk
    onderzoek en enkele andere wetten te wijzigen;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0040090/2018-01-01#ArtikelAanhef
articles:
  - number: VII
    text: |-
      Deze wet treedt in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen
      of onderdelen daarvan verschillend kan worden vastgesteld en kan ten aanzien van [artikel II, onderdeel P][ref1],
      terugwerken tot en met een in dat besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0040090#ArtikelII
    url: https://wetten.overheid.nl/BWBR0040090/2018-01-01#ArtikelVII
