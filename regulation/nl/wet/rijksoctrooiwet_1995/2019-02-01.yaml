  - number: '114'
    text: |-
      In Nederland kan bij wet en in Aruba, Curaçao en Sint Maarten kan bij landsverordening worden verklaard, dat de in
      deze rijkswet vervatte onderlinge regeling dient te worden beëindigd. Met ingang van het derde kalenderjaar na dat
      van afkondiging van zodanige wet of landsverordening verkrijgt deze rijkswet in Nederland de staat van wet en in
      Aruba, Curaçao en Sint Maarten de staat van landsverordening. Het bepaalde in de vorige volzinnen geldt niet met
      betrekking tot de [artikelen 40 tot en met 45][ref1] en [artikel 59][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel59
