preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat door de daling van het aantal octrooiaanvragen in Nederland het
    bestaande systeem van octrooiverlening na vooronderzoek niet gehandhaafd kan worden en dat het wenselijk is te
    voorzien in een op eenvoudige wijze door registratie te verkrijgen octrooi;

    Zo is het, dat Wij, de Raad van State van het Koninkrijk gehoord, en met gemeen overleg der Staten-Generaal, de
    bepalingen van het Statuut voor het Koninkrijk in acht genomen zijnde, hebben goedgevonden en verstaan, gelijk Wij
    goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze rijkswet en de daarop berustende bepalingen wordt verstaan onder: [
            ](onbekend) het op 5 oktober 1973 te München tot stand gekomen Verdrag inzake de verlening van Europese
      octrooien (Trb. 1975, 108, 1976, 101 en 2002, 64); *Europees octrooi:* een krachtens het [Europees Octrooiverdrag]
      (onbekend) verleend octrooi, voor zover dat voor het Koninkrijk is verleend; *Europese octrooiaanvrage:* een
      Europese octrooiaanvrage als bedoeld in het [Europees Octrooiverdrag](onbekend); *Samenwerkingsverdrag:* het
      op 19 juni 1970 te Washington tot stand gekomen Verdrag tot samenwerking inzake octrooien (*Trb.* 1973, 20);
      *bureau:* het bureau, bedoeld in [artikel 15][ref1]; *octrooiregister:* het in [artikel 19 van deze wet][ref2]
      bedoelde register; *orde*: de Orde van octrooigemachtigden, bedoeld in [artikel 23d][ref3]; *Onze Minister:* Onze
      Minister van Economische Zaken; *biologisch materiaal:* materiaal dat genetische informatie bevat en zichzelf kan
      repliceren of in een biologisch systeem kan worden gerepliceerd; *microbiologische werkwijze:* iedere werkwijze
      waarbij microbiologisch materiaal wordt gebruikt, die op microbiologisch materiaal ingrijpt of die microbiologisch
      materiaal als resultaat heeft; *plantenras:* een ras als bedoeld in artikel 5, tweede lid, van [verordening (EG)
      nr. 2100/94](31994R2100) van de Raad van de Europese Unie van 27 juli 1994 inzake het communautaire kwekersrecht
      (PbEG L 227); *natuurlijke rijkdommen:* de minerale en andere niet-levende rijkdommen van de zeebedding en de
      ondergrond, alsmede levende organismen die tot de sedentaire soort behoren, dat wil zeggen organismen die ten tijde
      dat zij geoogst kunnen worden, hetzij zich onbeweeglijk op of onder de zeebedding bevinden, hetzij zich niet kunnen
      verplaatsen dan in voortdurend fysiek contact met de zeebedding of de ondergrond; *Verdrag inzake octrooirecht*:
      het op 1 juli 2000 te Genève tot stand gekomen Verdrag inzake octrooirecht (Trb. 2001, 120).


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel15
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel23d
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel1
