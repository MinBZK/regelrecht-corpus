  - number: '110'
    text: |-
      Indien in deze rijkswet geregelde onderwerpen in het belang van een goede uitvoering van deze rijkswet nadere
      regeling behoeven, kan deze geschieden bij algemene maatregel van rijksbestuur.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel110
  - number: '111'
    text: |-
      De artikelen van deze rijkswet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel111
  - number: '112'
    text: |-
      Deze rijkswet wordt aangehaald als: Rijksoctrooiwet met vermelding van het jaartal van het *Staatsblad* waarin zij
      zal worden geplaatst.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel112
  - number: '113.1'
    text: |-
      Deze rijkswet is verbindend voor het Europese deel van Nederland en, behoudens [hoofdstuk 7][ref1], voor Curaçao en
      Sint Maarten en Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel113
    references:
      - id: ref1
        bwb_id: BWBR0007118
        hoofdstuk: '7'
  - number: '113.2'
    text: |-
      Deze rijkswet is voor Aruba slechts verbindend voor zover het betreft de [ artikelen 40 tot en met 45][ref1],
      [59][ref2], [101][ref3], [102, eerste lid][ref4], [artikel 102a tot en met artikel 102f][ref5],
      [104 tot en met 108][ref6], [111][ref7] en [114][ref8]. Voor de toepassing van de
      [artikelen 40 tot en met 45][ref9] in Aruba wordt onder "bureau" verstaan het Bureau voor de Intellectuele Eigendom
      van Aruba.


