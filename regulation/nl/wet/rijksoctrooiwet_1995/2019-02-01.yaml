  - number: '2.1'
    text: |-
      Vatbaar voor octrooi zijn uitvindingen op alle gebieden van de technologie die nieuw zijn, op
      uitvinderswerkzaamheid berusten en toegepast kunnen worden op het gebied van de nijverheid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2
  - number: '2.2'
    text: 'In de zin van het eerste lid worden in het bijzonder niet als uitvindingen beschouwd:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2
  - number: 2.2.a
    text: ontdekkingen, alsmede natuurwetenschappelijke theorieën en wiskundige methoden;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2
  - number: 2.2.b
    text: esthetische vormgevingen;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2
  - number: 2.2.c
    text: |-
      stelsels, regels en methoden voor het verrichten van geestelijke arbeid, voor het spelen of voor de
      bedrijfsvoering, alsmede computerprogramma’s;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2
  - number: 2.2.d
    text: presentaties van gegevens.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2
  - number: '2.3'
    text: Het tweede lid geldt alleen voor zover het betreft de aldaar genoemde onderwerpen of werkzaamheden als zodanig.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2
  - number: 2a.1
    text: |-
      Onder uitvindingen als bedoeld in [artikel 2, eerste lid][ref1], worden ook verstaan uitvindingen die betrekking
      hebben op een voortbrengsel dat uit biologisch materiaal bestaat of dit bevat, of die betrekking hebben op een
      werkwijze waarmee biologisch materiaal wordt verkregen, bewerkt of gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel2
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '2'
        hoofdstuk: '1'
  - number: 2a.2
    text: 'Onder uitvindingen als bedoeld in het eerste lid worden in ieder geval begrepen uitvindingen met betrekking tot:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2a
  - number: 2a.2.a
    text: |-
      biologisch materiaal dat met behulp van een technische werkwijze uit zijn natuurlijke milieu wordt geïsoleerd of
      wordt verkregen, ook indien dat materiaal in de natuur voorhanden is,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2a
  - number: 2a.2.b
    text: |-
      een deel van het menselijk lichaam dat wordt geïsoleerd of dat anderszins met behulp van een technische werkwijze
      wordt verkregen, met inbegrip van een sequentie of een partiële sequentie van een gen, ook indien de structuur van
      dat deel identiek is aan die van een natuurlijk deel,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2a
  - number: 2a.2.c
    text: |-
      planten of dieren, mits de uitvoerbaarheid van die uitvinding zich in technisch opzicht niet beperkt tot een
      bepaald planten- of dierenras, of
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2a
  - number: 2a.2.d
    text: |-
      een microbiologische of andere technische werkwijze waarmee biologisch materiaal wordt verkregen, verwerkt of
      gebruikt, of een hierdoor verkregen voortbrengsel.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel2a
  - number: '3.1'
    text: 'Niet vatbaar voor octrooi zijn:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.1.a
    text: uitvindingen waarvan de commerciële exploitatie in strijd zou zijn met de openbare orde of goede zeden,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.1.b
    text: |-
      het menselijk lichaam in de verschillende stadia van zijn vorming en zijn ontwikkeling, alsmede de loutere
      ontdekking van een van de delen ervan, met inbegrip van een sequentie of partiële sequentie van een gen,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.1.c
    text: planten- of dierenrassen,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.1.d
    text: |-
      werkwijzen van wezenlijk biologische aard, geheel bestaand uit natuurlijke verschijnselen zoals kruisingen of
      selecties, voor de voortbrenging van planten of dieren alsmede de hierdoor verkregen voortbrengselen,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.1.e
    text: |-
      uitvindingen waardoor inbreuk wordt gemaakt op de artikelen 3, 8, onderdeel j, 15, vijfde lid, en 16, vijfde lid,
      van het Biodiversiteitsverdrag;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.1.f
    text: |-
      methoden van behandeling van het menselijke of dierlijke lichaam door chirurgische ingrepen of geneeskundige
      behandeling en diagnosemethoden die worden toegepast op het menselijke of dierlijke lichaam, met uitzondering van
      voortbrengselen, met name stoffen of samenstellingen, voor de toepassing van een van deze methoden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: '3.2'
    text: |-
      Onder uitvindingen waarvan de commerciële exploitatie in strijd zou zijn met de openbare orde of goede zeden als
      bedoeld in het eerste lid, onderdeel a, worden in ieder geval verstaan:
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.2.a
    text: werkwijzen voor het klonen van mensen,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.2.b
    text: werkwijzen tot wijziging van de germinale genetische identiteit van de mens,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.2.c
    text: het gebruik van menselijke embryo's,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.2.d
    text: |-
      werkwijzen tot wijziging van de genetische identiteit van dieren die geëigend zijn deze te doen lijden zonder
      aanzienlijk medisch nut voor mens of dier op te leveren, alsmede de hierdoor verkregen voortbrengselen en
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: 3.2.e
    text: |-
      werkwijzen die het leven of de gezondheid van mensen, dieren of planten in gevaar brengen of die ernstige schade
      voor het milieu veroorzaken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: '3.3'
    text: |-
      Commerciële exploitatie van een uitvinding is niet strijdig met de openbare orde of goede zeden op grond van het
      loutere feit dat de exploitatie bij of krachtens wettelijk voorschrift is verboden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: '3.4'
    text: |-
      Bij algemene maatregel van rijksbestuur kan de lijst, bedoeld in het tweede lid, worden aangevuld met andere
      uitvindingen waarvan de commerciële exploitatie in strijd wordt geacht met de openbare orde of de goede zeden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel3
  - number: '4.1'
    text: Een uitvinding wordt als nieuw beschouwd, indien zij geen deel uitmaakt van de stand van de techniek.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel4
  - number: '4.2'
    text: |-
      De stand van de techniek wordt gevormd door al hetgeen voor de dag van indiening van de octrooiaanvrage openbaar
      toegankelijk is gemaakt door een schriftelijke of mondelinge beschrijving, door toepassing of op enige andere
      wijze.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel4
  - number: '4.3'
    text: |-
      Tot de stand van de techniek behoort tevens de inhoud van eerder ingediende octrooiaanvragen, die op of na de in
      het tweede lid bedoelde dag overeenkomstig [artikel 31][ref1] in het octrooiregister zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel31
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '4.4'
    text: |-
      Tot de stand van de techniek behoort voorts de inhoud van Europese octrooiaanvragen en van internationale aanvragen
      als bedoeld in artikel 153, derde tot en met vijfde lid, van het Europees Octrooiverdrag, waarvan de datum van
      indiening, die geldt voor de toepassing van artikel 54, tweede en derde lid, van dat verdrag, ligt voor de in
      het tweede lid bedoelde dag, en die op of na die dag zijn gepubliceerd op grond van artikel 93 van dat verdrag
      onderscheidenlijk van artikel 21 van het Samenwerkingsverdrag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel4
  - number: '4.5'
    text: |-
      Niettegenstaande het bepaalde in het eerste tot en met vierde lid zijn tot de stand van de techniek behorende
      stoffen of samenstellingen vatbaar voor octrooi, voor zover zij bestemd zijn voor de toepassing van een van de
      in [artikel 3, onderdeel f][ref1], bedoelde methoden, mits de toepassing daarvan voor enige in dat lid bedoelde
      methode niet tot de stand van de techniek behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel3
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '3'
        hoofdstuk: '1'
  - number: '4.6'
    text: |-
      Onverminderd het eerste tot en met het vierde lid, zijn stoffen of samenstellingen als bedoeld in het vijfde lid,
      vatbaar voor octrooi voor een specifieke toepassing in een werkwijze als bedoeld in [artikel 3, onderdeel f][ref1],
      mits die toepassing niet tot de stand van de techniek behoort.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel3
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '3'
        hoofdstuk: '1'
  - number: '5.1'
    text: |-
      Voor de toepassing van [artikel 4][ref1] blijft een openbaarmaking van de uitvinding buiten beschouwing, indien
      deze niet eerder is geschied dan zes maanden voor de dag van indiening van de octrooiaanvrage als direct of
      indirect gevolg van:


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '4'
        hoofdstuk: '1'
  - number: 5.1.a
    text: een kennelijk misbruik ten opzichte van de aanvrager of diens rechtsvoorganger, of
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel5
  - number: 5.1.b
    text: |-
      het feit, dat de aanvrager of diens rechtsvoorganger de uitvinding heeft tentoongesteld op van overheidswege
      gehouden of erkende tentoonstellingen in de zin van het Verdrag inzake Internationale Tentoonstellingen,
      ondertekend te Parijs op 22 november 1928, zoals dat is gewijzigd, laatstelijk bij Protocol van 30 november 1972
      (*Trb.* 1973, 100), op voorwaarde dat de aanvrager bij de indiening van zijn aanvrage verklaart dat de uitvinding
      inderdaad is tentoongesteld en een bewijsstuk daarvoor overlegt binnen een bij algemene maatregel van rijksbestuur
      vast te stellen termijn en overeenkomstig bij algemene maatregel van rijksbestuur te stellen voorschriften.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel5
  - number: '5.2'
    text: |-
      De erkenning van overheidswege van tentoonstellingen in Nederland geschiedt door Onze Minister en die van
      tentoonstellingen in Curaçao en Sint Maarten door de regering van Curaçao respectievelijk van Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel5
  - number: '5.3'
    text: |-
      De tentoonstellingen in Nederland en die in de Nederlandse Antillen die voor de inwerkingtreding van de Rijkswet
      aanpassing rijkswetten aan de oprichting van de nieuwe landen zijn erkend door Onze Minister van Economische Zaken
      respectievelijk door de regering van de Nederlandse Antillen gelden na de inwerkingtreding van die rijkswet als
      tentoonstellingen als bedoeld in artikel 5, tweede lid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel5
  - number: '6'
    text: |-
      Een uitvinding wordt als het resultaat van uitvinderswerkzaamheid aangemerkt, indien zij voor een deskundige niet
      op een voor de hand liggende wijze voortvloeit uit de stand van de techniek. Indien documenten als bedoeld in
      [artikel 4, derde en vierde lid][ref1], tot de stand van de techniek behoren, worden deze bij de beoordeling van de
      uitvinderswerkzaamheid buiten beschouwing gelaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel6
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '4'
        hoofdstuk: '1'
  - number: '7'
    text: |-
      Een uitvinding wordt als vatbaar voor toepassing op het gebied van de nijverheid aangemerkt, indien het onderwerp
      daarvan kan worden vervaardigd of toegepast op enig gebied van de nijverheid, de landbouw daaronder begrepen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel7
  - number: '8'
    text: |-
      Onverminderd de [artikelen 11][ref1], [12][ref2] en [13][ref3] wordt de aanvrager als uitvinder beschouwd en uit
      dien hoofde als degene die aanspraak heeft op octrooi.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel13
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '11'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '12'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '13'
        hoofdstuk: '1'
  - number: '9.1'
    text: |-
      Degene die in een der landen, aangesloten bij de Internationale Unie tot bescherming van de industriële eigendom
      of aangesloten bij de Wereld Handelsorganisatie, overeenkomstig de in dat land geldende wetten, en degene die,
      overeenkomstig de tussen twee of meer voornoemde landen gesloten verdragen, octrooi of een gebruikscertificaat
      dan wel bescherming van een gebruiksmodel heeft aangevraagd, geniet gedurende een termijn van twaalf maanden na de
      dag van die aanvrage in Nederland, Curaçao en Sint Maarten een recht van voorrang ter verkrijging van octrooi voor
      datgene, waarvoor door hem de in de aanhef bedoelde bescherming werd aangevraagd. Met een der landen als bedoeld
      in de eerste volzin wordt gelijkgesteld een land dat op grond van een mededeling van de bevoegde autoriteit in dat
      land een recht van voorrang erkent onder gelijkwaardige voorwaarden en met gelijkwaardige rechtsgevolgen als die,
      bedoeld in het op 20 maart 1883 te Parijs tot stand gekomen Verdrag tot bescherming van de industriële eigendom
      (Trb. 1974, 225 en Trb. 1980, 31). Het voorgaande vindt overeenkomstige toepassing ten aanzien van degene, die een
      uitvinderscertificaat heeft aangevraagd, indien de betrokken wetgeving de keus laat tussen verkrijging van zodanig
      certificaat of een octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
  - number: '9.2'
    text: |-
      Onder aanvrage in de zin van het eerste lid wordt iedere aanvrage verstaan, waarvan de datum van indiening kan
      worden vastgesteld, ongeacht het verdere lot van die aanvrage.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
  - number: '9.3'
    text: |-
      Indien de rechthebbende meer aanvragen voor hetzelfde onderwerp heeft ingediend, komt voor het recht van voorrang
      slechts de eerst ingediende in aanmerking. Niettemin kan het recht van voorrang ook berusten op een later
      ingediende aanvrage ter verkrijging van bescherming in hetzelfde land, mits de eerst ingediende aanvrage voor
      de indiening van de latere aanvrage is ingetrokken, vervallen of afgewezen zonder ter kennis van het publiek te
      zijn gebracht en zonder rechten te hebben laten bestaan en mits zij nog niet als grondslag heeft gediend voor de
      inroeping van een recht van voorrang. Indien een recht van voorrang, berustend op een later ingediende aanvrage, is
      ingeroepen, zal de eerst ingediende aanvrage niet meer als grondslag kunnen dienen voor de inroeping van een recht
      van voorrang.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
  - number: '9.4'
    text: |-
      De voorrang heeft voor de toepassing van de [artikelen 4, tweede, derde en vierde lid][ref1], en [6][ref2] ten
      gevolge, dat de aanvrage waarvoor dit recht bestaat, wordt aangemerkt als te zijn ingediend op de dag van indiening
      van de aanvrage waarop het recht van voorrang berust.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel6
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '6'
        hoofdstuk: '1'
  - number: '9.5'
    text: |-
      De aanvrager kan een beroep doen op meer dan één recht van voorrang, zelfs wanneer de rechten van voorrang uit
      verschillende landen afkomstig zijn. Ook kan de aanvrage, waarbij een beroep op een of meer rechten van voorrang
      wordt gedaan, elementen bevatten, waarvoor in de conclusies van de aanvrage, waarvan de voorrang wordt ingeroepen,
      geen rechten werden verlangd, mits de tot de laatste aanvrage behorende stukken het betrokken voortbrengsel of de
      betrokken werkwijze voldoende nauwkeurig aangeven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
  - number: '9.6'
    text: |-
      Degene die van het recht van voorrang gebruik wil maken, moet daarop schriftelijk beroep doen bij de indiening
      van de aanvrage of binnen zestien maanden na de datum van indiening van de aanvrage waarop hij zich beroept, onder
      vermelding van die datum van indiening en van het land waarin of waarvoor deze werd ingediend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
  - number: '9.7'
    text: |-
      Een verbetering van of toevoeging aan een eerder ingeroepen recht van voorrang moet worden verzocht binnen zestien
      maanden na de datum van indiening van de aanvrage waarop hij zich beroept.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
  - number: '9.8'
    text: |-
      Binnen zestien maanden na indiening van de aanvrage waarop hij zich beroept als bedoeld in het zesde en zevende
      lid, moet hij het nummer alsmede een in de Nederlandse, Franse, Duitse of Engelse taal gesteld afschrift van de
      aanvrage waarop hij zich beroept of een vertaling van die aanvrage in een van die talen aan het bureau verstrekken,
      tenzij de eerdere aanvrage bij het bureau of het bureau, bedoeld in [artikel 99][ref1], is ingediend, alsmede, als
      hij niet degene is die de aanvrage, op grond waarvan de voorrang wordt ingeroepen heeft ingediend, een document
      waaruit zijn rechten blijken. Het bureau kan verlangen dat de in de vorige volzin bedoelde vertaling wordt
      gewaarmerkt indien het bureau redelijke twijfel heeft ten aanzien van de juistheid van die vertaling.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel99
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '99'
        hoofdstuk: '8'
  - number: '9.9'
    text: Het recht van voorrang vervalt, indien niet aan het zesde, zevende of achtste lid is voldaan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel9
  - number: '10.1'
    text: |-
      Indien voor een uit hoofde van deze rijkswet verleend octrooi de voorrang is ingeroepen van een eerder uit hoofde
      van deze rijkswet ingediende octrooiaanvrage, heeft het op genoemde aanvrage verleende octrooi geen rechtsgevolgen,
      voor zover het betrekking heeft op dezelfde uitvinding als eerstgenoemd octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel10
  - number: '10.2'
    text: |-
      Vorderingen ter vaststelling van het ontbreken van rechtsgevolg als bedoeld in het eerste lid kunnen door een ieder
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel10
  - number: '10.3'
    text: |-
      [Artikel 75, vierde lid, achtste lid, eerste volzin, en negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '11'
    text: |-
      De aanvrager heeft geen aanspraak op octrooi, voor zover de inhoud van zijn aanvrage aan hetgeen reeds door
      een ander vervaardigd of toegepast werd of wel aan beschrijvingen, tekeningen of modellen van een ander, zonder
      diens toestemming, ontleend is. Deze laatste behoudt, voor zover hetgeen ontleend werd voor octrooi vatbaar is,
      zijn aanspraak op octrooi. Voor de toepassing van [artikel 4, derde en vierde lid][ref1], op het onderwerp van
      een aanvrage, ingediend door degene aan wie ontleend is, blijft de door de ontlener ingediende aanvrage buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '4'
        hoofdstuk: '1'
  - number: '12.1'
    text: |-
      Indien de uitvinding, waarvoor octrooi wordt aangevraagd, is gedaan door iemand die in dienst van een ander een
      betrekking bekleedt, heeft hij aanspraak op octrooi, tenzij de aard van de betrekking medebrengt, dat hij zijn
      bijzondere kennis aanwendt tot het doen van uitvindingen van dezelfde soort als die waarop de octrooiaanvrage
      betrekking heeft. In het laatstbedoelde geval komt de aanspraak op octrooi toe aan de werkgever.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel12
  - number: '12.2'
    text: |-
      Indien de uitvinding, waarvoor octrooi wordt aangevraagd, is gedaan door iemand die in het kader van een opleiding
      bij een ander werkzaamheden verricht, komt de aanspraak op octrooi toe aan degene bij wie de werkzaamheden worden
      verricht, tenzij de uitvinding geen verband houdt met het onderwerp van de werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel12
  - number: '12.3'
    text: |-
      Indien de uitvinding is gedaan door iemand die in dienst van een universiteit, hogeschool of onderzoeksinstelling
      onderzoek verricht, komt de aanspraak op octrooi toe aan de betrokken universiteit, hogeschool of
      onderzoeksinstelling.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel12
  - number: '12.4'
    text: |-
      Voor de toepassing van [artikel 4, derde en vierde lid][ref1], op het onderwerp van een aanvrage, ingediend door de
      in het eerste lid, laatste volzin, bedoelde werkgever dan wel door degene die de gelegenheid biedt om werkzaamheden
      te verrichten als bedoeld in het tweede lid, blijft een door de niet gerechtigde ingediende octrooiaanvrage buiten
      beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '4'
        hoofdstuk: '1'
  - number: '12.5'
    text: Van het in het eerste, tweede en derde lid bepaalde kan bij schriftelijke overeenkomst worden afgeweken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel12
  - number: '12.6'
    text: |-
      Ingeval de uitvinder niet geacht kan worden in het door hem genoten loon of de door hem genoten geldelijke toelage
      of in een bijzondere door hem te ontvangen uitkering vergoeding te vinden voor het gemis aan octrooi, is degene
      aan wie krachtens het eerste, tweede of derde lid, de aanspraak op octrooi toekomt, verplicht hem een, in verband
      met het geldelijke belang van de uitvinding en met de omstandigheden waaronder zij plaatshad, billijk bedrag toe
      te kennen. Een vorderingsrecht van de uitvinder krachtens dit lid vervalt na verloop van drie jaren sedert de datum
      waarop het octrooi is verleend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel12
  - number: '12.7'
    text: Elk beding, waarbij van het zesde lid wordt afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel12
  - number: '13'
    text: |-
      Indien een uitvinding is gedaan door verscheidene personen, die volgens een afspraak tezamen hebben gewerkt, hebben
      zij gezamenlijk aanspraak op octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel13
  - number: '14.1'
    text: |-
      Degene die de uitvinding heeft gedaan, waarvoor octrooi is aangevraagd, doch op grond van
      [artikel 12, eerste, tweede of derde lid][ref1], of op grond van een overeenkomst, gesloten met de aanvrager of
      diens rechtsvoorgangers, geen aanspraak op octrooi kan doen gelden, heeft het recht in het octrooi als de uitvinder
      te worden vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel12
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '12'
        hoofdstuk: '1'
  - number: '14.2'
    text: Elk beding, waarbij van het vorige lid wordt afgeweken, is nietig.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel14
  - number: '15.1'
    text: |-
      Er is een bureau belast met de uitvoering van deze rijkswet en andere bij of krachtens wet of bindende
      internationale verplichtingen opgelegde taken. Het bureau heet Octrooicentrum Nederland. Het bureau is een
      instelling van Nederland en dient tevens, voor zover het octrooien betreft, voor Nederland Curaçao en Sint
      Maarten als centrale bewaarplaats als bedoeld in artikel 12 van de op 14 juli 1967 te Stockholm tot stand gekomen
      herziening van het op 20 maart 1883 te Parijs tot stand gekomen Verdrag tot bescherming van de industriële eigendom
      (Trb. 1969, 144).
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel15
  - number: '15.2'
    text: Bij besluit van Onze Minister worden inrichting en werkwijze van het bureau bepaald.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel15
  - number: '16'
    text: |-
      Indien het bureau gedurende de laatste dag van enige ingevolge deze rijkswet door of jegens het bureau in acht te
      nemen termijn is gesloten, wordt die termijn voor de toepassing van deze rijkswet verlengd tot het einde van de
      eerstvolgende dag, waarop het bureau weer geopend is.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel16
  - number: '17.1'
    text: |-
      Het bureau treedt op als ontvangend bureau in de zin van artikel 2, onder (xv), van het Samenwerkingsverdrag en
      verricht zijn werkzaamheden uit dien hoofde met inachtneming van de bepalingen van dat verdrag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel17
  - number: '17.2'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden, voor zover het Samenwerkingsverdrag daartoe de
      bevoegdheid verleent, het bedrag en de vervaldatum vastgesteld van taksen die op grond van het Samenwerkingsverdrag
      en het daarbij behorende Reglement mogen worden geheven. Bij algemene maatregel van rijksbestuur kunnen verdere
      regels worden gesteld ten aanzien van onderwerpen waarover het ontvangend bureau ingevolge genoemd Reglement
      bevoegd is voorschriften te geven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel17
  - number: '18'
    text: |-
      De aanwijzing of, in voorkomend geval, de keuze van het Koninkrijk in een internationale aanvrage als bedoeld in
      artikel 2, onder *(vii)*, van het Samenwerkingsverdrag zal worden aangemerkt als een verzoek van de aanvrager tot
      verkrijging van een Europees octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel18
  - number: '19.1'
    text: |-
      Het bureau is verantwoordelijk voor een octrooiregister waaruit de stand van zaken omtrent octrooiaanvragen en
      octrooien kan worden afgeleid en waaruit voor dit doel gegevens kunnen worden verstrekt aan derden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel19
  - number: '19.2'
    text: |-
      In het register worden ingevolge deze rijkswet gegevens betreffende octrooiaanvragen en octrooien ingeschreven. Het
      register is voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel19
  - number: '19.3'
    text: |-
      Bij algemene maatregel van rijksbestuur kunnen nadere regels worden gesteld omtrent het register. Daarbij kan
      worden bepaald dat de inschrijving van bepaalde gegevens in het register afhankelijk is van het betalen van een
      bedrag door degene die om inschrijving verzoekt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel19
  - number: '19.4'
    text: |-
      Tegen betaling van bij of krachtens algemene maatregel van rijksbestuur vast te stellen bedragen kan een ieder het
      bureau verzoeken om schriftelijke inlichtingen omtrent dan wel gewaarmerkte uittreksels uit het octrooiregister of
      om stukken welke betrekking hebben op een in het octrooiregister ingeschreven octrooiaanvrage of octrooi, alsmede
      om afschriften van laatstgenoemde stukken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel19
  - number: '20.1'
    text: |-
      Van alle gegevens die in het octrooiregister worden vermeld, wordt tevens melding gemaakt in een door het bureau
      periodiek uit te geven blad.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel20
  - number: '20.2'
    text: Bij algemene maatregel van rijksbestuur kunnen nadere regels worden gesteld omtrent het in het eerste lid bepaalde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel20
  - number: '21.1'
    text: |-
      Vanaf het tijdstip waarop de octrooiaanvrage in het octrooiregister is ingeschreven, kan een ieder kosteloos
      kennisnemen van alle op de aanvrage of het daarop verleende octrooi betrekking hebbende stukken die het bureau
      hebben bereikt of die het bureau aan de aanvrager of aan derden heeft doen uitgaan in het kader van de bepalingen
      van deze rijkswet. Het bureau maakt van al deze stukken zo spoedig mogelijk doch niet voor de inschrijving van de
      aanvrage in het octrooiregister melding in het in [artikel 20][ref1] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel20
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '21.2'
    text: |-
      Van stukken die betrekking hebben op een aanvrage die nog niet in het octrooiregister is ingeschreven, kan alleen
      met toestemming van de aanvrager kennis worden genomen. Zonder toestemming van de aanvrager kan daarvan nochtans
      kennis worden genomen, indien de betrokkene aantoont dat de aanvrager zich tegenover hem heeft beroepen op zijn
      aanvrage. Het in dit lid bepaalde geldt niet ten aanzien van de in [paragraaf 3 van dit hoofdstuk][ref1] bedoelde
      octrooiaanvragen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0007118
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '21.3'
    text: |-
      Geen kennis kan worden genomen van de verklaring van degene die de uitvinding heeft gedaan, inhoudende dat hij geen
      prijs stelt op vermelding als uitvinder in het octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel21
  - number: '22.1'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld ter uitvoering van het bepaalde
      bij of krachtens het Verdrag inzake octrooirecht inzake het uitwisselen van informatie tussen het bureau en de
      aanvrager of de houder van een octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel22
  - number: '22.2'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden regels gesteld ter uitvoering van het bepaalde bij
      of krachtens het Verdrag inzake octrooirecht over wijzigingen ten aanzien van de aanvrager of de houder van een
      octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel22
  - number: '23.1'
    text: |-
      Indien de aanvrager of de houder van een octrooi dan wel de houder van een Europees octrooi, ondanks het betrachten
      van alle in de gegeven omstandigheden geboden zorgvuldigheid, niet in staat is geweest een termijn ten opzichte van
      het bureau of het bureau bedoeld in [artikel 99][ref1] in acht te nemen, wordt op zijn verzoek door het bureau de
      vorige toestand hersteld, indien het niet in acht nemen van de termijn ingevolge deze rijkswet rechtstreeks heeft
      geleid tot het verlies van enig recht of rechtsmiddel.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel99
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '99'
        hoofdstuk: '8'
  - number: '23.2'
    text: Het eerste lid is niet van toepassing op het niet in acht nemen van de hierna in het derde lid bedoelde termijn.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23
  - number: '23.3'
    text: |-
      Het verzoek wordt binnen twee maanden, te rekenen vanaf de datum waarop de oorzaak van het niet in acht nemen van
      de termijn voor het verrichten van de desbetreffende handeling is weggenomen, doch uiterlijk binnen een termijn van
      een jaar na het verstrijken van de niet in acht genomen termijn, ingediend. De nog niet verrichte handeling moet
      uiterlijk gelijktijdig met het verzoek geschieden. Bij de indiening wordt een bij of krachtens algemene maatregel
      van rijksbestuur te bepalen bedrag betaald.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23
  - number: '23.4'
    text: Het bureau tekent het herstel in het octrooiregister aan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23
  - number: '23.5'
    text: |-
      Degene, die in het tijdvak, gelegen tussen het verlies van het recht of het rechtsmiddel en het herstel in de
      vorige toestand, begonnen is met de vervaardiging of toepassing binnen Nederland, Curaçao of Sint Maarten in
      of voor zijn bedrijf van datgene, waarvoor tengevolge van het herstel een octrooi van kracht is, dan wel een
      begin van uitvoering heeft gegeven aan zijn voornemen daartoe, blijft niettegenstaande het octrooi bevoegd de in
      [artikel 53, eerste lid][ref1], bedoelde handelingen te verrichten. [Artikel 55, tweede en vierde lid][ref2], is
      van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel55
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '23.6'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld over het herstel van het recht
      van voorrang.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23
  - number: 23a.1
    text: |-
      Het bureau is verantwoordelijk voor een register van octrooigemachtigden waaruit kan worden afgeleid wie voldoet
      aan de eisen van vakbekwaamheid van octrooigemachtigden en als octrooigemachtigde voor het bureau kan optreden en
      waaruit voor dit doel gegevens kunnen worden verstrekt aan derden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23a
  - number: 23a.2
    text: |-
      In het register kan een ieder op aanvraag als octrooigemachtigde worden ingeschreven die met goed gevolg een examen
      heeft afgelegd en die gedurende ten minste drie jaren octrooiaanvragen heeft behandeld onder verantwoordelijkheid
      van een octrooigemachtigde, dan wel van wie met goed gevolg een proeve van bekwaamheid is afgenomen. Het examen of
      de proeve van bekwaamheid is niet langer dan tien jaar voor het indienen van de aanvraag afgelegd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23a
  - number: 23a.3
    text: Het bureau stelt de inrichting van het register vast. Het register is voor een ieder kosteloos ter inzage.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23a
  - number: 23a.4
    text: |-
      Het is anderen dan degenen die in het register van octrooigemachtigden zijn ingeschreven, verboden zichzelf in het
      economisch verkeer aan te duiden alsof zij in dat register zouden zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23a
  - number: 23a.5
    text: |-
      De raad van toezicht kan op aanvraag ontheffing verlenen van de verplichting het examen of de proeve van
      bekwaamheid af te leggen of ten minste drie jaren octrooiaanvragen te behandelen onder verantwoordelijkheid van
      een octrooigemachtigde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23a
  - number: 23a.6
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld omtrent de aanvraag om
      inschrijving in het register, de aanvraag om een ontheffing, de beoordeling van de aanvraag door de raad van
      toezicht, het beroep bij het gerechtshof Den Haag tegen een afwijzend oordeel van de raad en de inschrijving in en
      de uitschrijving uit het register.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23a
  - number: 23a.7
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld ter uitvoering van het bepaalde
      bij of krachtens het Verdrag inzake octrooirecht inzake vertegenwoordiging.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23a
  - number: 23b.1
    text: |-
      Voor het bureau kunnen als gemachtigde slechts optreden personen die als octrooigemachtigde zijn ingeschreven
      in het register, bedoeld in [artikel 23a][ref1], personen die op grond van [artikel 1 van de Advocatenwet][ref2]
      als advocaat zijn ingeschreven bij een rechtbank en personen die op grond van artikel 1 van de
      Advocatenlandsverordening of artikel 1 van de Advocatenwet BES als advocaat zijn ingeschreven bij het
      Gemeenschappelijk Hof van Justitie van Aruba, Curaçao en Sint Maarten en van Bonaire, Sint Eustatius en Saba.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23a
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel1
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23b
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '1'
  - number: 23b.2
    text: |-
      De directeur van het bureau kan van een advocaat inzage vorderen van de geviseerde akte van zijn beëdiging als
      advocaat voordat hij hem als gemachtigde voor het bureau toelaat.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23b
  - number: 23b.3
    text: |-
      De directeur van het bureau kan in bijzondere gevallen ook anderen dan de personen, bedoeld in het eerste lid,
      toestaan als gemachtigde voor het bureau op te treden, indien zij van een dergelijk optreden niet hun beroep
      maken of indien zij in een lidstaat van de Europese Unie of in een andere staat die partij is bij de Overeenkomst
      betreffende de Europese Economische Ruimte bevoegd zijn om als gemachtigde in octrooizaken op te treden en zij
      slechts in incidentele gevallen als gemachtigde voor het bureau optreden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23b
  - number: 23b.4
    text: |-
      Tenzij bij of krachtens wet anders is bepaald, is een octrooigemachtigde of een persoon die onder zijn
      verantwoordelijkheid werkzaam is, verplicht tot geheimhouding van al hetgeen waarvan hij uit hoofde van zijn
      werkzaamheden als zodanig kennis neemt. Deze verplichting blijft bestaan na beëindiging van de desbetreffende
      werkzaamheden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23b
  - number: 23c.1
    text: |-
      Er is een examencommissie voor het afnemen van het examen en de proeve van bekwaamheid, bedoeld in
      [artikel 23a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23c.2
    text: |-
      Op voordracht van het bestuur van de orde benoemt Onze Minister de leden van de examencommissie telkens voor een
      periode van twee jaar. Onze Minister kan een lid om gewichtige redenen tussentijds ontslaan. De benoeming en het
      ontslag van de leden van de examencommissie wordt bekendgemaakt in het blad, bedoeld in [artikel 20][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel20
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 23c.3
    text: |-
      De examencommissie bestaat uit ten minste zes personen. Een derde van de leden van de examencommissie is
      octrooigemachtigde, een derde is medewerker van het bureau en een derde is technisch of rechtsgeleerd deskundige,
      niet afkomstig uit de kring van octrooigemachtigden en medewerkers van het bureau. Ten hoogste de helft van de
      leden van de examencommissie kan tevens docent zijn van een opleiding voor toekomstige octrooigemachtigden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
  - number: 23c.4
    text: |-
      De examencommissie kan uit haar midden commissies samenstellen ten behoeve van het in gedeelten afnemen van het
      examen of de proeve van bekwaamheid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
  - number: 23c.5
    text: |-
      De examencommissie bepaalt het tijdstip van de aanmelding tot het examen en de proeve van bekwaamheid, bedoeld
      in het eerste lid, alsmede het tijdstip en de plaats waarop dit examen en deze proeve van bekwaamheid worden
      afgenomen. De examencommissie neemt een examen of proeve van bekwaamheid of een gedeelte daarvan niet af dan
      nadat degene van wie het examen of de proeve van bekwaamheid of het gedeelte daarvan wordt afgenomen, het daarvoor
      verschuldigde bedrag heeft betaald.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
  - number: 23c.6
    text: 'Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld omtrent:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
  - number: 23c.6.a
    text: |-
      het toelaten tot het deelnemen aan en het afnemen van het examen en de proeve van bekwaamheid en het bedrag dat
      degene die aan een examen of proeve van bekwaamheid of een gedeelte daarvan wenst deel te nemen, verschuldigd is;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
  - number: 23c.6.b
    text: |-
      de kennis die wordt getoetst door het examen en de proeve van bekwaamheid, de uitwerking van de exameneisen door de
      examencommissie en de wijze waarop het examen of de proeve van bekwaamheid wordt afgenomen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23c
  - number: 23d.1
    text: |-
      Er is een Orde van octrooigemachtigden, die gevormd wordt door allen die zijn ingeschreven in het register, bedoeld
      in [artikel 23a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23d.2
    text: |-
      De orde heeft tot taak de bevordering van een goede beroepsuitoefening door de leden en van hun vakbekwaamheid.
      Haar taak omvat mede de zorg voor de eer en het aanzien van het beroep van octrooigemachtigde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23d
  - number: 23d.3
    text: |-
      De orde is een openbaar lichaam als bedoeld in [artikel 134 van de Grondwet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001840#Artikel134
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23d
    references:
      - id: ref1
        bwb_id: BWBR0001840
        artikel: '134'
  - number: 23e.1
    text: |-
      De algemene vergadering van de orde kiest uit haar midden een bestuur dat de dagelijkse leiding heeft over de orde
      en dat gerechtigd is tot het verrichten van daden van beheer en beschikking met betrekking tot het vermogen van
      de orde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23e
  - number: 23e.2
    text: De leden van het bestuur treden om de twee jaar af. Zij zijn terstond herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23e
  - number: 23e.3
    text: |-
      Het bestuur van de orde bestaat uit ten hoogste negen leden. De algemene vergadering van de orde wijst uit deze
      leden de voorzitter, secretaris en penningmeester van het bestuur aan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23e
  - number: 23e.4
    text: De voorzitter of de secretaris van het bestuur vertegenwoordigt de orde in en buiten rechte.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23e
  - number: 23f.1
    text: |-
      De algemene vergadering van de orde kiest een raad van toezicht die aanvragen om opgenomen te worden in het
      register van octrooigemachtigden beoordeelt, die toezicht houdt op de wijze waarop octrooigemachtigden hun beroep
      uitoefenen en die belast is met tuchtrechtspraak in eerste aanleg.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23f
  - number: 23f.2
    text: De leden van de raad van toezicht treden om de twee jaar af. Zij zijn terstond herkiesbaar.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23f
  - number: 23f.3
    text: De raad van toezicht van de orde bestaat uit vijf leden en vijf plaatsvervangende leden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23f
  - number: 23f.4
    text: |-
      De voorzitter van de raad van toezicht is een jurist die op voordracht van de algemene vergadering van de orde
      wordt benoemd door Onze Minister. De algemene vergadering van de orde wijst de secretaris van de raad van toezicht
      aan uit de leden van de raad.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23f
  - number: 23g.1
    text: |-
      Het lidmaatschap van het bestuur is niet verenigbaar met het lidmaatschap of het plaatsvervangend lidmaatschap van
      de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23g
  - number: 23g.2
    text: |-
      Het bestuur ontheft een lid of plaatsvervangend lid van de raad van toezicht van zijn functie, indien het lid of
      plaatsvervangend lid:
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23g
  - number: 23g.2.a
    text: vanwege ziekten of gebreken blijvend ongeschikt is zijn functie te vervullen;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23g
  - number: 23g.2.b
    text: uitgeschreven is uit het register van octrooigemachtigden;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23g
  - number: 23g.2.c
    text: |-
      in staat van faillissement is verklaard, onder de toepassing van de schuldsaneringsregeling natuurlijke personen is
      verklaard of onder curatele is gesteld;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23g
  - number: 23g.2.d
    text: zich in voorlopige hechtenis bevindt;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23g
  - number: 23g.2.e
    text: |-
      bij onherroepelijk geworden rechterlijke uitspraak wegens misdrijf is veroordeeld, dan wel hem bij een dergelijke
      uitspraak een maatregel is opgelegd die vrijheidsbeneming tot gevolg heeft.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23g
  - number: 23h.1
    text: |-
      De algemene vergadering van de orde stelt een huishoudelijk reglement en gedragsregels voor octrooigemachtigden
      vast.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.2
    text: 'Het huishoudelijk reglement regelt in ieder geval:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.2.a
    text: de wijze waarop het bestuur en de raad van toezicht worden verkozen;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.2.b
    text: het ontslag om gewichtige redenen van een lid van het bestuur;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.2.c
    text: het houden van de vergaderingen van de orde;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.2.d
    text: |-
      het bedrag van de contributie die de leden van de orde verschuldigd zijn vanwege hun lidmaatschap van de orde, en
      de termijn waarbinnen de contributie wordt voldaan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.3
    text: |-
      De algemene vergadering stelt een verordening vast ten aanzien van de begeleiding van stagiaires door
      octrooigemachtigden, de wederzijdse verplichtingen van de octrooigemachtigde en de stagiaire en de benoeming door
      de raad van toezicht van een octrooigemachtigde als begeleider van een stagiaire die octrooiwerkzaamheden verricht
      buiten het kantoor van een octrooigemachtigde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.4
    text: |-
      De algemene vergadering kan verordeningen vaststellen in het belang van de goede beroepsuitoefening van de leden.
      Deze verordeningen kunnen slechts betrekking hebben op:
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.4.a
    text: de wijze waarop de administratie van een octrooigemachtigde wordt ingericht, bijgehouden en bewaard;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.4.b
    text: de samenwerking van octrooigemachtigden met andere octrooigemachtigden en met beoefenaren van een ander beroep;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.4.c
    text: de publiciteit die octrooigemachtigden kunnen bedrijven omtrent hun werkzaamheden;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.4.d
    text: |-
      het bijhouden van de kennis en het inzicht van octrooigemachtigden met betrekking tot het recht betreffende de
      industriële eigendom en het toezicht van de raad van toezicht daarop.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23h.5
    text: |-
      Verordeningen houden geen bepalingen in omtrent onderwerpen waarin bij of krachtens de wet is voorzien, bevatten
      geen verplichtingen of voorschriften die niet strikt noodzakelijk zijn voor de verwezenlijking van het doel dat met
      de verordening wordt beoogd en beperken niet onnodig de marktwerking. Indien in het onderwerp van bepalingen van
      verordeningen wordt voorzien bij of krachtens de wet, houden deze bepalingen van rechtswege op te gelden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23h
  - number: 23i.1
    text: |-
      Het huishoudelijk reglement, de gedragsregels voor octrooigemachtigden en de verordeningen, alsmede iedere
      wijziging daarvan, worden na vaststelling onverwijld ter goedkeuring gezonden aan Onze Minister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23i
  - number: 23i.2
    text: |-
      Onze Minister kan zijn goedkeuring onthouden aan het huishoudelijk reglement, de gedragsregels voor
      octrooigemachtigden en de verordeningen, alsmede een wijziging daarvan, indien zij bepalingen bevatten die in
      strijd zijn met het recht of het algemeen belang.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23i
  - number: 23i.3
    text: |-
      Na goedkeuring door Onze Minister worden het huishoudelijk reglement, de gedragsregels voor octrooigemachtigden
      en de verordeningen, alsmede een wijziging daarvan, geplaatst in het blad, bedoeld in [artikel 20][ref1]. Zij
      treden in werking met ingang van de eerste dag van de tweede maand na de dagtekening van het blad waarin zij worden
      geplaatst of zoveel eerder als zij zelf bepalen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel20
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23i
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 23i.4
    text: |-
      De octrooigemachtigden zijn gehouden het huishoudelijk reglement, de gedragsregels voor octrooigemachtigden en
      de verordeningen na te leven en de contributie die verschuldigd is vanwege het lidmaatschap van de orde binnen de
      daarvoor gestelde termijn te voldoen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23i
  - number: 23j.1
    text: |-
      De algemene vergadering van de orde stelt voor 1 oktober van ieder jaar een begroting vast voor het volgende
      kalenderjaar.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23j
  - number: 23j.2
    text: |-
      De algemene vergadering van de orde brengt jaarlijks aan Onze Minister voor 1 mei een financieel verslag uit dat
      vergezeld gaat van een verklaring omtrent de getrouwheid en de rechtmatigheid, afgegeven door een accountant als
      bedoeld in [artikel 393 van Boek 2 van het Burgerlijk Wetboek][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Artikel393
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23j
    references:
      - id: ref1
        bwb_id: BWBR0003045
        artikel: '393'
  - number: 23j.3
    text: |-
      De algemene vergadering van de orde stelt jaarlijks voor 1 mei een verslag op van de werkzaamheden, het gevoerde
      beleid in het algemeen en de doelmatigheid en doeltreffendheid van de werkzaamheden en werkwijze van de orde in het
      bijzonder in het afgelopen kalenderjaar. Het verslag wordt aan Onze Minister toegezonden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23j
  - number: 23j.4
    text: De algemene vergadering van de orde stelt de in het tweede en derde lid bedoelde stukken algemeen verkrijgbaar.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23j
  - number: 23k
    text: |-
      De algemene vergadering van de orde, het bestuur van de orde, de raad van toezicht en de examencommissie
      verstrekken desgevraagd aan Onze Minister de voor de uitoefening van zijn taak benodigde inlichtingen. Onze
      Minister kan inzage vorderen van zakelijke gegevens en bescheiden, voor zover dat voor de vervulling van zijn taak
      redelijkerwijs nodig is.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23k
  - number: 23l.1
    text: Ten minste eenmaal per jaar vergadert de orde over onderwerpen die voor octrooigemachtigden van belang zijn.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23l
  - number: 23l.2
    text: |-
      De vergaderingen van de orde, bedoeld in het eerste lid, zijn openbaar, tenzij de aanwezige leden van de orde om
      gewichtige redenen besluiten dat de vergadering geheel of gedeeltelijk met gesloten deuren zal plaatsvinden. De
      vergaderingen van het bestuur en de raad van toezicht van de orde zijn niet openbaar, behoudens in een geval als
      bedoeld in [artikel 23s, vierde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23s
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23l
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23s
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23m.1
    text: |-
      Een octrooigemachtigde die in staat van faillissement is verklaard, ten aanzien van wie de schuldsaneringsregeling
      natuurlijke personen van toepassing is verklaard, of die onder curatele is gesteld, is gedurende het faillissement,
      de toepassing van de schuldsaneringsregeling natuurlijke personen of de curatele van rechtswege geschorst in de
      uitoefening van het recht als gemachtigde voor het bureau op te treden of bij de behandeling ter terechtzitting van
      geschillen het woord te voeren. Gedurende deze tijd is hij tevens van rechtswege geschorst als lid van de orde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23m
  - number: 23m.2
    text: |-
      Ingeval een octrooigemachtigde niet in staat is de belangen te behartigen die hem in die hoedanigheid zijn
      toevertrouwd, dan wel ingeval hij overleden is, wijst de voorzitter van de raad van de toezicht, indien niet
      reeds in de vervanging is voorzien, een octrooigemachtigde aan, die, zolang de voorzitter dit nodig oordeelt, de
      maatregelen neemt die onder de gegeven omstandigheden geboden zijn.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23m
  - number: 23n.1
    text: |-
      Een octrooigemachtigde die zich schuldig maakt aan enig handelen of nalaten dat in strijd is met de zorg die hij
      als octrooigemachtigde behoort te betrachten ten opzichte van degenen wier belangen hij als zodanig behartigt of
      behoort te behartigen, dat in strijd is met het huishoudelijk reglement of de verordeningen van de orde, of dat in
      strijd is met hetgeen een octrooigemachtigde betaamt, kan, onverminderd zijn aansprakelijkheid op grond van andere
      wettelijke voorschriften, worden onderworpen aan een van de maatregelen, genoemd in [artikel 23u][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23n
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23n.2
    text: |-
      Als enig handelen of nalaten in strijd met hetgeen een octrooigemachtigde betaamt, wordt in ieder geval aangemerkt
      het in octrooiaangelegenheden samenwerken of in dienst nemen van een persoon:
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23n
  - number: 23n.2.a
    text: |-
      van wie bekend is dat hem de inschrijving in het register, bedoeld in [artikel 23a][ref1], is geweigerd omdat
      gegronde vrees bestaat dat hij zich schuldig zal maken aan enig handelen of nalaten als bedoeld in het eerste lid,


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23n
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23a
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23n.2.b
    text: die ontzet is uit het recht om als gemachtigde voor het bureau op te treden, of
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23n
  - number: 23n.2.c
    text: |-
      die, hoewel onbevoegd om als gemachtigde voor het bureau op te treden, er zijn gewoonte van maakt zich in
      Nederland, Curaçao of Sint Maarten voor te doen als een gemachtigde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23n
  - number: 23o.1
    text: |-
      De raad van toezicht neemt een tegen een octrooigemachtigde gerezen bedenking in behandeling op een met redenen
      omklede schriftelijke klacht, bij hem ingediend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23o
  - number: 23o.2
    text: |-
      Indien de voorzitter van het bestuur van de orde buiten het geval van een klacht op de hoogte is van een bedenking
      tegen een octrooigemachtigde of een advocaat, kan hij deze ter kennis van de raad van toezicht brengen. In dat
      geval behandelt de raad de bedenking als klacht en beschouwt hij de voorzitter van het bestuur van de orde als
      klager.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23o
  - number: 23o.3
    text: |-
      Indien het de raad van toezicht bekend is dat een advocaat zich bij de behandeling van octrooiaangelegenheden
      heeft schuldig gemaakt aan gedragingen als bedoeld in [artikel 46 van de Advocatenwet][ref1], stelt hij de raad van
      toezicht, bedoeld in [artikel 22 van die wet][ref2], van het arrondissement waarin de desbetreffende advocaat zijn
      praktijk uitoefent, hiervan op de hoogte.


      [ref1]: https://wetten.overheid.nl/BWBR0002093#Artikel46
      [ref2]: https://wetten.overheid.nl/BWBR0002093#Artikel22
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23o
    references:
      - id: ref1
        bwb_id: BWBR0002093
        artikel: '46'
      - id: ref2
        bwb_id: BWBR0002093
        artikel: '22'
  - number: 23o.4
    text: |-
      De raad van toezicht neemt een klacht niet in behandeling indien het voorval waarop de klacht betrekking heeft, ten
      minste vijf jaar voor de indiening van de klacht heeft plaatsgevonden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23o
  - number: 23p.1
    text: |-
      De secretaris van de raad van toezicht stelt de octrooigemachtigde tegen wie een klacht is ingediend onverwijld
      schriftelijk op de hoogte van de bedenking.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23p
  - number: 23p.2
    text: |-
      De voorzitter van de raad kan na een summier onderzoek, zo nodig na de klager en de desbetreffende
      octrooigemachtigde te hebben gehoord, de klacht terstond bij met redenen omklede beslissing afwijzen indien hij van
      oordeel is dat deze kennelijk niet-ontvankelijk, kennelijk ongegrond of van onvoldoende gewicht is.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23p
  - number: 23p.3
    text: |-
      Indien de voorzitter van de raad van oordeel is dat een klacht vatbaar is voor minnelijke schikking, roept hij
      de klager en de desbetreffende octrooigemachtigde op teneinde een zodanige schikking te beproeven. Indien een
      minnelijke schikking mogelijk blijkt, wordt deze op schrift gesteld en door de klager, de octrooigemachtigde en de
      voorzitter ondertekend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23p
  - number: 23p.4
    text: |-
      De voorzitter van de raad brengt klachten, die niet in der minne zijn opgelost of die niet zijn afgewezen,
      onverwijld ter kennis van de raad van toezicht.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23p
  - number: 23p.5
    text: |-
      De secretaris van de raad zendt aan de klager en de desbetreffende octrooigemachtigde onverwijld bij aangetekende
      brief een afschrift van de beslissing van de voorzitter.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23p
  - number: 23q.1
    text: |-
      Tegen de beslissing van de voorzitter van de raad van toezicht tot afwijzing van een klacht kan de klager binnen
      veertien dagen na de dag van verzending van het afschrift van de beslissing schriftelijk verzet doen bij de raad
      van toezicht. Hij geeft daarbij gemotiveerd aan met welke overwegingen van de voorzitter van de raad hij zich niet
      kan verenigen en kan vragen over zijn verzet te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23q
  - number: 23q.2
    text: |-
      Indien overeenkomstig het eerste lid verzet is gedaan tegen de beslissing van de voorzitter van de raad, wijst deze
      een ander lid van de raad aan om hem bij de behandeling van het verzet te vervangen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23q
  - number: 23q.3
    text: |-
      Ten gevolge van het verzet vervalt de beslissing van de voorzitter van de raad, tenzij de raad het verzet niet-
      ontvankelijk of ongegrond verklaart.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23q
  - number: 23q.4
    text: |-
      Indien de raad van oordeel is dat de klacht kennelijk niet-ontvankelijk, kennelijk ongegrond of van onvoldoende
      gewicht is, kan hij zonder nader onderzoek het verzet niet-ontvankelijk of ongegrond verklaren, echter niet dan na
      de klager die daarom vroeg, in de gelegenheid te hebben gesteld te worden gehoord.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23q
  - number: 23q.5
    text: |-
      De beslissing tot niet-ontvankelijkverklaring of tot ongegrondverklaring van het verzet is met redenen omkleed.
      Daartegen staat geen rechtsmiddel open. De secretaris van de raad zendt aan de klager en de desbetreffende
      octrooigemachtigde onverwijld bij aangetekende brief een afschrift van de beslissing van de raad.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23q
  - number: 23q.6
    text: Indien de raad van oordeel is dat het verzet gegrond is, wordt de zaak in verdere behandeling genomen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23q
  - number: 23r.1
    text: |-
      Indien een bedenking een lid of plaatsvervangend lid van de raad van toezicht betreft, schorst de raad dit lid of
      plaatsvervangend lid in het recht zitting te hebben in de raad gedurende de tijd dat de bedenking behandeld wordt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23r
  - number: 23r.2
    text: |-
      De [artikelen 512 tot en met 519 van het Wetboek van Strafvordering][ref1] zijn van overeenkomstige toepassing ten
      aanzien van de wraking en verschoning van een lid of plaatsvervangend lid van de raad.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel512
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23r
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '512'
  - number: 23s.1
    text: |-
      De raad van toezicht neemt geen beslissing dan na verhoor of behoorlijke oproeping van de octrooigemachtigde en
      van de klager of de voorzitter van het bestuur van de orde. De oproepingen geschieden bij aangetekende brief ten
      hoogste acht weken nadat de klacht ter kennis van de raad is gebracht op grond van [artikel 23p, vierde lid][ref1],
      of nadat de raad de klacht in verdere behandeling heeft genomen op grond van [artikel 23q, zesde lid][ref2], en ten
      minste twee weken voor het verhoor.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23p
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel23q
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23s
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23p
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 23q
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23s.2
    text: |-
      De octrooigemachtigde en de klager of de voorzitter van het bestuur van de orde zijn bevoegd zich te doen bijstaan
      door een raadsman. De secretaris van de raad stelt hen tijdig in de gelegenheid om kennis te nemen van de stukken
      die betrekking hebben op de zaak. Zij kunnen afschriften of uittreksels van die stukken vragen tegen vergoeding van
      de kostprijs.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23s
  - number: 23s.3
    text: |-
      De raad kan weigeren personen, die geen advocaat zijn, als raadsman toe te laten. In dat geval houdt de raad de
      zaak tot een volgende zitting aan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23s
  - number: 23s.4
    text: |-
      De behandeling door de raad van een bedenking tegen een octrooigemachtigde geschiedt in een openbare zitting.
      De raad kan om gewichtige redenen bevelen dat de behandeling geheel of gedeeltelijk met gesloten deuren zal
      plaatsvinden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23s
  - number: 23t.1
    text: |-
      De raad van toezicht kan getuigen en deskundigen horen. Zij worden daartoe bij aangetekende brief opgeroepen en
      zijn verplicht aan de oproeping gevolg te geven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23t
  - number: 23t.2
    text: |-
      Verschijnt een getuige of deskundige op de oproeping niet, dan doet de officier van justitie op verzoek van
      de raad hem dagvaarden. Verschijnt een getuige of deskundige op de dagvaarding niet, dan doet de officier
      van justitie op verzoek van de raad hem andermaal dagvaarden, desverzocht met bevel tot medebrenging.
      [Artikel 556 van het Wetboek van Strafvordering][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel556
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23t
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '556'
  - number: 23t.3
    text: De voorzitter van de raad kan een getuige onder ede horen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23t
  - number: 23t.4
    text: |-
      De getuige is verplicht op de gestelde vragen te antwoorden. De deskundige is gehouden zijn taak
      onpartijdig en naar beste weten te verrichten. Ten aanzien van de getuigen en deskundigen zijn de
      [artikelen 217 tot en met 219 van het Wetboek van Strafvordering][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001903#Artikel217
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23t
    references:
      - id: ref1
        bwb_id: BWBR0001903
        artikel: '217'
  - number: 23t.5
    text: |-
      De getuigen en deskundigen ontvangen op verzoek op vertoon van hun oproeping of dagvaarding schadeloosstelling
      overeenkomstig het bij en krachtens [artikel 57 van de Wet tarieven in burgerlijke zaken][ref1] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0001852#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23t
    references:
      - id: ref1
        bwb_id: BWBR0001852
        artikel: '57'
  - number: 23u.1
    text: |-
      De raad van toezicht kan aan de octrooigemachtigde een van de volgende maatregelen opleggen, indien hij oordeelt
      dat een tegen de octrooigemachtigde gerezen bedenking gegrond is:
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23u
  - number: 23u.1.a
    text: waarschuwing;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23u
  - number: 23u.1.b
    text: berisping;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23u
  - number: 23u.1.c
    text: |-
      schorsing in de uitoefening van het recht om als gemachtigde voor het bureau op te treden voor de tijd van ten
      hoogste vijf jaar;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23u
  - number: 23u.1.d
    text: ontzetting uit het recht om als gemachtigde voor het bureau op te treden.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23u
  - number: 23u.2
    text: |-
      Schorsing als bedoeld in het eerste lid, onder c, brengt voor de duur van de schorsing mee schorsing als lid
      van de orde en verlies van de betrekkingen, waarbij de hoedanigheid van octrooigemachtigde vereist is voor de
      verkiesbaarheid of benoembaarheid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23u
  - number: 23v.1
    text: |-
      De beslissingen van de raad van toezicht zijn met redenen omkleed en worden in het openbaar uitgesproken. De raad
      beslist binnen zes weken nadat het onderzoek ter openbare zitting is gesloten.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23v
  - number: 23v.2
    text: |-
      De waarschuwing of berisping, bedoeld in [artikel 23u, eerste lid, onder a en b][ref1], wordt door de voorzitter
      van de raad uitgesproken in een vergadering van de raad, waarvoor de octrooigemachtigde bij aangetekende brief
      wordt opgeroepen. Van de vergadering wordt proces-verbaal opgemaakt. De secretaris van de raad zendt een afschrift
      van het proces-verbaal bij aangetekende brief aan de octrooigemachtigde.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23v
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23v.3
    text: |-
      Indien een maatregel is opgelegd als bedoeld in [artikel 23u][ref1] kan de raad beslissen dat daarvan
      mededeling wordt gedaan in het blad, bedoeld in [artikel 20][ref2], zodra de beslissing onherroepelijk
      is geworden. Een dergelijke mededeling wordt in ieder geval gedaan indien een maatregel als bedoeld in
      [artikel 23u, eerste lid, onder c of d][ref3], is opgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel20
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23v
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23v.4
    text: |-
      De secretaris van de raad zendt bij aangetekende brief terstond een afschrift van de beslissing van de raad aan de
      octrooigemachtigde en, in voorkomend geval, aan de klager of de voorzitter van het bestuur van de orde, alsmede,
      indien bij de beslissing een maatregel is opgelegd, aan het bureau. In het afschrift van de beslissing worden de
      ter beschikking staande rechtsmiddelen vermeld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23v
  - number: 23v.5
    text: |-
      In geval van oplegging van de maatregelen, bedoeld in [artikel 23u, eerste lid, onder c en d][ref1], deelt de raad
      aan de betrokken octrooigemachtigde bij aangetekende brief nadat de beslissing onherroepelijk is geworden, de datum
      mee waarop de maatregel van kracht wordt.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23v
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23w.1
    text: |-
      Tegen een beslissing van de raad van toezicht als bedoeld in [artikel 23u][ref1] kan een belanghebbende binnen
      dertig dagen na de dag van verzending van de brief, bedoeld in [artikel 23v, vierde lid][ref2], beroep instellen
      bij het gerechtshof Den Haag.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel23v
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23w
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 23v
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23w.2
    text: |-
      Het beroep wordt ingesteld bij beroepschrift. De griffier van het gerechtshof geeft door toezending van een
      afschrift van het beroepschrift terstond kennis aan de raad van toezicht, aan het bureau en, voor zover het beroep
      niet door hem is ingesteld, aan de klager en aan de octrooigemachtigde.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23w
  - number: 23w.3
    text: Het gerechtshof behandelt de zaak opnieuw in volle omvang.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23w
  - number: 23w.4
    text: |-
      De [artikelen 23s][ref1] en [23t][ref2] zijn van overeenkomstige toepassing op het beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23s
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel23t
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23w
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23s
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 23t
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23w.5
    text: |-
      Tenzij het gerechtshof beslist dat het beroep niet ontvankelijk is of dat er geen aanleiding bestaat tot het
      opleggen van enige maatregel, legt het een maatregel op als bedoeld in [artikel 23u][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23w
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23w.6
    text: |-
      [Artikel 23v][ref1] is van overeenkomstige toepassing op de beslissing van het gerechtshof, met dien verstande
      dat in plaats van «de raad van toezicht» wordt gelezen: het gerechtshof, in plaats van «voorzitter van de raad»
      wordt gelezen: vice-president van het gerechtshof, en in plaats van «secretaris van de raad»: griffier van het
      gerechtshof.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23v
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23w
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23v
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23w.7
    text: Tegen beslissingen van het gerechtshof is geen hogere voorziening toegelaten.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23w
  - number: 23x.1
    text: |-
      Van een beslissing van de raad van toezicht als bedoeld in [artikel 23u][ref1] en van een beslissing van het
      gerechtshof als bedoeld in [artikel 23w, vijfde lid][ref2], kan door degene tegen wie de beslissing is genomen,
      herziening worden verzocht, indien een ernstig vermoeden bestaat dat op grond van enige omstandigheid, waarvan
      bij het nemen van de beslissing niet is gebleken, een andere beslissing zou zijn genomen, indien die omstandigheid
      bekend zou zijn geweest.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel23w
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23x
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 23w
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23x.2
    text: |-
      Van een beslissing tot oplegging van de maatregel, bedoeld in [artikel 23u, eerste lid, onder d][ref1], kan
      door degene tegen wie de beslissing is genomen, wijziging worden verzocht na vijf jaar nadat de beslissing
      onherroepelijk is geworden.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23u
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23x
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23u
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23x.3
    text: |-
      Ten aanzien van de herziening, bedoeld in het eerste lid, en de wijziging, bedoeld in het tweede lid, is het
      gerechtshof Den Haag bevoegd. Deze procedures leiden niet tot het opleggen van een zwaardere maatregel. De
      [artikelen 23s][ref1], [23t][ref2] en [23w, tweede tot en met zevende lid][ref3], zijn van overeenkomstige
      toepassing op de herziening en de wijziging.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23s
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel23t
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel23w
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23x
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23s
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 23t
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 23w
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23y.1
    text: |-
      Een belanghebbende kan bij de examencommissie bezwaar maken tegen een beslissing als bedoeld in
      [artikel 23c, vijfde lid][ref1], tegen een beslissing hem of haar niet toe te laten tot het examen of de proeve van
      bekwaamheid en tegen de beoordeling van het examen of de proeve van bekwaamheid.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23c
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23y
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23c
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23y.2
    text: |-
      Een belanghebbende kan bij de raad van toezicht bezwaar maken tegen een benoeming van een octrooigemachtigde als
      begeleider van een stagiaire als bedoeld in [artikel 23h, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23h
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23y
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23h
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23y.3
    text: |-
      De [hoofdstukken 6][ref1] en [7 van de Algemene wet bestuursrecht][ref2] zijn van overeenkomstige toepassing op het
      bezwaar, bedoeld in het eerste of tweede lid.


      [ref1]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0005537#Hoofdstuk7
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23y
    references:
      - id: ref1
        bwb_id: BWBR0005537
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0005537
        hoofdstuk: '7'
  - number: 23y.4
    text: |-
      De curator kan de raad van toezicht verzoeken de schorsing, bedoeld in [artikel 23m, eerste lid][ref1], op te
      heffen. De [artikelen 23s][ref2], [23t][ref3] en [23v, eerste lid][ref4], zijn van overeenkomstige toepassing op
      het verzoek tot opheffing van de schorsing. Indien de raad van toezicht de schorsing opheft, zendt de secretaris
      van de raad terstond een afschrift van de beslissing van de raad aan de curator, de betrokkene en het bureau.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23m
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel23s
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel23t
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel23v
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23y
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23m
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 23s
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 23t
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref4
        bwb_id: BWBR0007118
        artikel: 23v
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23y.5
    text: |-
      Een belanghebbende kan tegen een beslissing op bezwaar als bedoeld in het eerste of tweede lid of tegen een
      beslissing op het verzoek als bedoeld in het vierde lid beroep instellen bij het gerechtshof Den Haag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23y
  - number: 23y.6
    text: |-
      De [artikelen 23s][ref1], [23t][ref2] en [23v, eerste lid][ref3], en
      [23w, met uitzondering van het vijfde lid][ref4], zijn van overeenkomstige toepassing op het beroep.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23s
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel23t
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel23v
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel23w
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23y
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 23s
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 23t
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 23v
        hoofdstuk: '2'
        paragraaf: 1a
      - id: ref4
        bwb_id: BWBR0007118
        artikel: 23w
        hoofdstuk: '2'
        paragraaf: 1a
  - number: 23z
    text: |-
      Onze Minister zendt binnen vijf jaar na de inwerkingtreding van [paragraaf 1a van hoofdstuk 2 van deze wet][ref1]
      en vervolgens telkens na vier jaar aan de Staten-Generaal een verslag over de doeltreffendheid en doelmatigheid van
      het functioneren van de orde.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel23z
    references:
      - id: ref1
        bwb_id: BWBR0007118
        hoofdstuk: '2'
        paragraaf: 1a
  - number: '24.1'
    text: 'Een aanvrage om octrooi moet bij het bureau worden ingediend en moet:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: 24.1.a
    text: de naam en het adres van de aanvrager vermelden;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: 24.1.b
    text: |-
      de naam en de woonplaats vermelden van degene, die de uitvinding heeft gedaan, tenzij deze blijkens een bij de
      aanvrage gevoegde schriftelijke verklaring geen prijs stelt op vermelding als uitvinder in het octrooi;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: 24.1.c
    text: een verzoek om verlening van een octrooi bevatten;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: 24.1.d
    text: een korte aanduiding bevatten van datgene, waarop de uitvinding betrekking heeft;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: 24.1.e
    text: |-
      vergezeld zijn van een beschrijving van de uitvinding, die aan het slot in één of meer conclusies een omschrijving
      geeft van datgene, waarvoor uitsluitend recht wordt verlangd;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: 24.1.f
    text: vergezeld zijn van een uittreksel van de beschrijving.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: '24.2'
    text: |-
      Het uittreksel is alleen bedoeld als technische informatie; het kan in het bijzonder niet dienen voor de uitlegging
      van de omvang van de gevraagde bescherming en voor de toepassing van de [ artikelen 4, derde lid][ref1], en
      [75, tweede lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '4'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '24.3'
    text: |-
      De aanvrage en de overige bescheiden zijn hetzij in het Nederlands hetzij in het Engels gesteld, met uitzondering
      van de conclusies die in het Nederlands zijn gesteld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: '24.4'
    text: |-
      De aanvrage, de beschrijving van de uitvinding, de tekeningen en het uittreksel moeten voorts voldoen aan de
      overige, bij ministeriële regeling te stellen, voorschriften.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: '24.5'
    text: |-
      Bij de aanvrage dient een bewijsstuk te worden overgelegd waaruit blijkt dat aan het bureau een bedrag is betaald
      overeenkomstig een bij of krachtens algemene maatregel van rijksbestuur vastgesteld tarief.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel24
  - number: '25.1'
    text: |-
      De beschrijving van de uitvinding is duidelijk en volledig en wordt zodanig opgesteld dat de uitvinding daaruit
      door een deskundige kan worden begrepen en aan de hand daarvan kan worden toegepast. De omschrijving, gegeven in
      een of meer conclusies aan het slot van de beschrijving, is nauwkeurig. De beschrijving gaat zo nodig van daarmee
      overeenstemmende tekeningen vergezeld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel25
  - number: '25.2'
    text: |-
      Indien een uitvinding betrekking heeft op biologisch materiaal dat niet openbaar toegankelijk is en in de
      beschrijving niet zodanig kan worden omschreven dat de uitvinding aan de hand daarvan door een deskundige kan
      worden toegepast, dan wel indien een uitvinding het gebruik van dergelijk biologisch materiaal impliceert, is de
      beschrijving slechts toereikend indien het biologisch materiaal uiterlijk op de dag van indiening van de aanvrage
      is gedeponeerd bij een bij of krachtens algemene maatregel van rijksbestuur aan te wijzen instelling.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel25
  - number: '25.3'
    text: |-
      Indien een uitvinding betrekking heeft op een sequentie of een partiële sequentie van een gen, bevat de
      beschrijving een concrete omschrijving van de functie en de industriële toepassing van deze sequentie of partiële
      sequentie. Ingeval voor de productie van een eiwit of partieel eiwit een sequentie of partiële sequentie van een
      gen is gebruikt, bevat de beschrijving van de industriële toepasbaarheid een precisering van het eiwit of partieel
      eiwit dat is geproduceerd en de functie daarvan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel25
  - number: '25.4'
    text: 'Bij algemene maatregel van rijksbestuur worden nadere regels gesteld ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel25
  - number: 25.4.a
    text: |-
      de gegevens die in de aanvrage worden opgenomen met betrekking tot de kenmerken en identificatie van het
      gedeponeerde biologisch materiaal, en
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel25
  - number: 25.4.b
    text: de toegankelijkheid en beschikbaarheid van het gedeponeerde biologisch materiaal.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel25
  - number: '27'
    text: |-
      Elke aanvrage om octrooi mag slechts op een enkele uitvinding betrekking hebben of op een groep van uitvindingen,
      die zodanig onderling verbonden zijn, dat zij op een enkele algemene uitvindingsgedachte berusten. Bij algemene
      maatregel van rijksbestuur kunnen daarover nadere regels worden gesteld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel27
  - number: '28.1'
    text: |-
      De aanvrager kan zijn reeds ingediende aanvrage splitsen door voor een gedeelte van de inhoud daarvan
      een afzonderlijke aanvrage in te dienen. Deze aanvrage wordt, behalve voor de toepassing van de
      [artikelen 30, eerste lid][ref1], [31, derde lid][ref2], en [32, tweede lid][ref3], aangemerkt te zijn ingediend op
      de dag van de oorspronkelijke aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel30
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel31
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel32
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '28.2'
    text: De aanvrager kan de beschrijving, conclusies en tekeningen van zijn reeds ingediende aanvrage wijzigen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel28
  - number: '28.3'
    text: |-
      Het onderwerp van de afgesplitste of de gewijzigde aanvrage moet gedekt worden door de inhoud van de
      oorspronkelijke aanvrage.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel28
  - number: '28.4'
    text: |-
      De splitsing of wijziging kan geschieden tot het tijdstip waarop de octrooiaanvrage ingevolge
      [artikel 31, eerste of tweede lid][ref1], in het octrooiregister moet worden ingeschreven, met dien verstande
      dat voor de splitsing of wijziging een termijn van tenminste twee maanden na de verzending van de in
      [artikel 34, vierde lid][ref2], bedoelde mededeling openstaat. Op verzoek van de aanvrager kan het bureau
      laatstgenoemde termijn verlengen tot vier maanden na de verzending van de in [artikel 34, vierde lid][ref3],
      bedoelde mededeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel34
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel28
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '29.1'
    text: 'Als datum van indiening van de aanvrage geldt die, waarop zijn overgelegd:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: 29.1.a
    text: een expliciete of impliciete aanduiding dat de gegevens en bescheiden als een aanvraag zijn bedoeld,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: 29.1.b
    text: |-
      gegevens waarmee de identiteit van de aanvrager kan worden vastgesteld of die het bureau in staat stellen in
      contact te treden met de aanvrager en
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: 29.1.c
    text: |-
      gegevens die op het eerste gezicht een beschrijving van de uitvinding lijken te zijn, ongeacht de taal waarin de
      beschrijving is opgesteld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: '29.2'
    text: |-
      Het bureau vermeldt de in het eerste lid bedoelde datum alsmede een nummer op de aanvrage en maakt deze zo spoedig
      mogelijk aan de aanvrager bekend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: '29.3'
    text: |-
      Indien het bureau van oordeel is, dat de overgelegde gegevens en bescheiden niet voldoen aan het in het eerste
      lid bepaalde, stelt het bureau de aanvrager hiervan zo spoedig mogelijk in kennis en biedt het de aanvrager de
      gelegenheid binnen een bij algemene maatregel van rijksbestuur te stellen termijn de aanvraag aan te vullen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: '29.4'
    text: |-
      Wanneer een ontbrekend deel van de beschrijving wordt ingediend bij het bureau binnen de krachtens het derde lid
      gestelde termijn, wordt dat deel van de beschrijving gevoegd bij de aanvraag en is de datum van indiening de datum
      waarop het bureau dat deel van de beschrijving heeft ontvangen of de datum waarop aan de in het eerste lid genoemde
      eisen is voldaan, indien deze datum later is dan de datum waarop het bureau het ontbrekende deel van de aanvraag
      heeft ontvangen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: '29.5'
    text: |-
      Indien na het verstrijken van de in het derde lid bedoelde termijn de overgelegde bescheiden niet voldoen aan het
      in het eerste lid bepaalde, weigert het bureau tot vermelding van de in het eerste lid bedoelde datum over te gaan.
      Het maakt zijn beschikking zo spoedig mogelijk aan de aanvrager bekend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: '29.6'
    text: |-
      Met een verwijzing naar een eerder ingediende aanvraag wordt voldaan aan het bepaalde in het eerste lid, onderdeel
      c. Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld over het verwijzen naar een
      eerder ingediende aanvraag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel29
  - number: '30.1'
    text: |-
      Indien niet is voldaan aan het bij en krachtens [artikel 24][ref1] bepaalde, geeft het bureau daarvan binnen een
      maand na de in [artikel 29, eerste lid][ref2], bedoelde datum van indiening of, in geval van afsplitsing van de
      aanvrage, binnen een maand na de datum van indiening van de afgesplitste aanvrage, schriftelijk kennis aan de
      aanvrager, onder opgave van de voorschriften waaraan niet is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel29
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel30
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '30.2'
    text: |-
      Indien de gebreken niet binnen drie maanden na verzending van de in het eerste lid bedoelde kennisgeving zijn
      hersteld of indien de aanvrager voordien heeft medegedeeld niet tot herstel te willen overgaan, besluit het bureau
      de aanvrage niet te behandelen. Het bureau maakt zijn beschikking zo spoedig mogelijk aan de aanvrager bekend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel30
  - number: '31.1'
    text: |-
      Het bureau schrijft een octrooiaanvrage in het octrooiregister in zo spoedig mogelijk na verloop van achttien
      maanden:
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel31
  - number: 31.1.a
    text: |-
      na de in [artikel 29, eerste lid][ref1], bedoelde datum van indiening of,


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel29
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 31.1.b
    text: |-
      indien het een aanvrage betreft waarvoor een beroep is gedaan op een of meer rechten van voorrang, na de eerste
      datum van voorrang.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel31
  - number: '31.2'
    text: Op schriftelijk verzoek van de aanvrager vindt de inschrijving op een eerder tijdstip plaats.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel31
  - number: '31.3'
    text: |-
      De inschrijving van een afgesplitste aanvrage als bedoeld in [artikel 28][ref1] geschiedt zo spoedig mogelijk na de
      indiening daarvan, doch niet eerder dan de inschrijving van de oorspronkelijke aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel28
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel31
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '32.1'
    text: 'De aanvrager verzoekt het bureau binnen uiterlijk dertien maanden na:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel32
  - number: 32.1.a
    text: |-
      de in [artikel 29, eerste lid][ref1], bedoelde datum van indiening of,


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel29
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 32.1.b
    text: |-
      indien het een aanvrage betreft waarvoor een beroep is gedaan op een of meer rechten van voorrang, de eerste datum
      van voorrang, om een aan de verlening van het octrooi voorafgaand onderzoek naar de stand van de techniek met
      betrekking tot het onderwerp van de octrooiaanvrage.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel32
  - number: '32.2'
    text: |-
      Indien het een afgesplitste aanvrage betreft als bedoeld in [artikel 28][ref1], wordt het in het eerste lid bedoeld
      verzoek gedaan binnen dertien maanden na de in het eerste lid bedoelde datum van indiening of voorrang van de
      oorspronkelijke aanvrage of, indien dat later is, binnen twee maanden na de indiening van de afgesplitste aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel28
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel32
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '32.3'
    text: |-
      Indien de aanvrager niet tijdig om het in het eerste lid genoemde onderzoek heeft verzocht of het in het eerste lid
      bedoelde bedrag niet door het bureau is ontvangen, besluit het bureau de aanvrage niet te behandelen. Het bureau
      maakt zijn beschikking zo spoedig mogelijk aan de aanvrager bekend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel32
  - number: '34.1'
    text: |-
      Een onderzoek naar de stand van de techniek als bedoeld in [artikel 32, eerste lid][ref1], wordt verricht door het
      bureau, waar nodig met inschakeling van het Europees Octrooibureau, bedoeld in het Europees Octrooiverdrag.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel32
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '34.2'
    text: |-
      Indien de aanvrager daarom verzoekt, doet het bureau de aanvrage onderwerpen aan een onderzoek naar de stand van
      de techniek van internationaal type als bedoeld in artikel 15, vijfde lid, onder *a*, van het Samenwerkingsverdrag.
      Zulk een onderzoek naar de stand van de techniek wordt aangemerkt als een onderzoek naar de stand van de techniek
      als bedoeld in [artikel 32, eerste lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel32
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '34.3'
    text: |-
      Indien bij het onderzoek blijkt, dat de ingediende aanvrage niet voldoet aan het bij of krachtens
      [artikel 27][ref1] bepaalde, wordt het uitgevoerd ten aanzien van die onderdelen van de aanvrage die betrekking
      hebben op de uitvinding of op de groep van uitvindingen als bedoeld in [artikel 27][ref2], die als eerste in de
      conclusies wordt genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel27
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel27
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel34
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '34.4'
    text: Het bureau deelt de aanvrager schriftelijk het resultaat van het onderzoek naar de stand van de techniek mede.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel34
  - number: '34.5'
    text: |-
      Indien toepassing is gegeven aan het derde lid, maakt het bureau daarvan in de mededeling, bedoeld in het vierde
      lid, melding onder vermelding van de uitvinding of groep van uitvindingen ten aanzien waarvan het onderzoek is
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel34
  - number: '35.1'
    text: |-
      Indien het bureau van oordeel is dat het onderzoek naar de stand van de techniek wegens onduidelijkheid van de
      aanvrage niet uitvoerbaar is, geeft het bureau daarvan zo spoedig mogelijk schriftelijk en met redenen omkleed
      kennis aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel35
  - number: '35.2'
    text: |-
      Indien de gebreken niet binnen twee maanden na verzending van de in het eerste lid bedoelde kennisgeving zijn
      hersteld of indien de aanvrager voordien heeft meegedeeld niet tot herstel te willen overgaan, besluit het bureau
      de aanvrage niet te behandelen. Het bureau maakt zijn beschikking zo spoedig mogelijk aan de aanvrager bekend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel35
  - number: '36.1'
    text: |-
      Het bureau verleent het octrooi zodra de octrooiaanvrage in het octrooiregister is ingeschreven, doch niet eerder
      dan twee maanden of, indien [artikel 28, vierde lid, tweede volzin][ref1], is toegepast, vier maanden na verzending
      van de in [artikel 34, vierde lid][ref2], bedoelde mededeling. Het doet hiervan aantekening in het octrooiregister.
      Op verzoek van de aanvrager verleent het bureau het octrooi op een eerder tijdstip nadat het resultaat van het
      onderzoek naar de stand van de techniek als bedoeld in [artikel 34, vierde lid][ref3], is verzonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel34
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel34
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '36.2'
    text: |-
      De octrooiverlening geschiedt door het plaatsen van een gedateerde aantekening op de aanvrage in de vorm waarin
      deze ingediend dan wel overeenkomstig de [artikelen 28][ref1] of [30, tweede lid][ref2], is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel30
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '36.3'
    text: |-
      Het bureau geeft de bij de aanvrage behorende beschrijving en tekeningen bij wege van octrooischrift uit en
      verstrekt hiervan een gewaarmerkt afschrift aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel36
  - number: '36.4'
    text: |-
      Indien toepassing is gegeven aan [artikel 34, derde lid][ref1], heeft het octrooi uitsluitend betrekking op die
      uitvinding of groep van uitvindingen als bedoeld in [artikel 27][ref2], die als eerste in de conclusies wordt
      genoemd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel34
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel27
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '27'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '36.5'
    text: Het resultaat van het onderzoek naar de stand van de techniek wordt bij het octrooischrift gevoegd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel36
  - number: '36.6'
    text: |-
      Een ingevolge dit artikel verleend octrooi blijft, behoudens eerder verval, afstand of vernietiging door
      de rechter, van kracht tot het verstrijken van een termijn van twintig jaren, te rekenen vanaf de in
      [artikel 29, eerste lid][ref1] , bedoelde datum van indiening.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel29
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel36
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '38.1'
    text: |-
      Een ieder kan het bureau schriftelijk mededeling doen van gegevens betreffende een octrooiaanvrage of het daarop
      verleende octrooi. Het bureau deelt deze gegevens mede aan de aanvrager of de octrooihouder, voor zover zij niet
      van deze afkomstig zijn.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel38
  - number: '38.2'
    text: |-
      Indien de in [artikel 24, eerste lid, onder b][ref1], bedoelde vermelding van de uitvinder onjuist is, of door
      een ander dan de uitvinder is verklaard dat op vermelding als uitvinder in het octrooi geen prijs wordt gesteld,
      kunnen de aanvrager en de uitvinder gezamenlijk, onder betaling van een bij of krachtens algemene maatregel van
      rijksbestuur vast te stellen bedrag, het bureau schriftelijk verzoeken terzake de nodige verbeteringen aan te
      brengen. In voorkomend geval dient het verzoek vergezeld te zijn van de schriftelijke toestemming van de ten
      onrechte als uitvinder aangemerkte persoon.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel24
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel38
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '39.1'
    text: |-
      De intrekking van een in het octrooiregister ingeschreven octrooiaanvrage heeft tegenover derden geen gevolg,
      zolang niet onherroepelijk is beslist op rechtsvorderingen ter zake van de aanvrage, die blijkens in het
      octrooiregister ingeschreven stukken zijn ingesteld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel39
  - number: '39.2'
    text: |-
      Wanneer ingevolge een onherroepelijke beslissing op een rechtsvordering als bedoeld in het eerste lid de aanspraak
      op octrooi toekomt of mede toekomt aan een ander dan de aanvrager, wordt de intrekking aangemerkt als niet te zijn
      geschied.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel39
  - number: '39.3'
    text: Het bureau doet van een intrekking aantekening in het octrooiregister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel39
  - number: '40.1'
    text: |-
      Indien het bureau van oordeel is, dat het geheim blijven van de inhoud van een octrooiaanvrage in het belang van
      de verdediging van het Koninkrijk of zijn bondgenoten kan zijn, maakt het dit zo spoedig mogelijk, doch uiterlijk
      binnen drie maanden na de indiening van de aanvrage bekend. Onze Minister van Defensie kan ten aanzien van de
      beoordeling van de vraag, of zodanig belang aanwezig kan zijn, aanwijzingen geven aan het bureau.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel40
  - number: '40.2'
    text: |-
      Tegelijk met de bekendmaking als bedoeld in het eerste lid zendt het bureau afschrift van het besluit en van de tot
      de aanvrage behorende beschrijving en tekeningen aan Onze genoemde minister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel40
  - number: '40.3'
    text: Ingeval het eerste lid toepassing vindt, wordt de inschrijving in het octrooiregister van de aanvrage opgeschort.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel40
  - number: '41.1'
    text: |-
      Binnen acht maanden na indiening van een octrooiaanvrage als bedoeld in [artikel 40][ref1] besluit Onze Minister
      van Defensie of de inhoud van de aanvrage in het belang van de verdediging van het Koninkrijk of zijn bondgenoten
      geheim moet blijven. Hij maakt zijn besluit aan het bureau bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel40
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '40'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '41.2'
    text: |-
      Een besluit dat de inhoud van de aanvrage geheim moet blijven heeft tot gevolg dat de inschrijving in het
      octrooiregister van de aanvrage blijft opgeschort tot drie jaren na de bekendmaking van het besluit.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: '41.3'
    text: 'De opschorting eindigt indien:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: 41.3.a
    text: Onze genoemde minister besluit, dat de aanvrage niet geheim behoeft te blijven;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: 41.3.b
    text: een besluit binnen de in het eerste lid genoemde termijn is uitgebleven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: '41.4'
    text: |-
      Onze genoemde minister kan telkens binnen zes maanden voor het verstrijken van de termijn van opschorting deze
      termijn met drie jaren verlengen. Hij maakt zijn besluit aan het bureau bekend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: '41.5'
    text: |-
      Onze genoemde minister kan te allen tijde besluiten dat de inhoud van de aanvrage niet langer geheim behoeft te
      blijven. Het besluit heeft tot gevolg dat de opschorting eindigt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: '41.6'
    text: |-
      Van een besluit krachtens het eerste, derde, vierde of vijfde lid, doet het bureau onverwijld mededeling aan de
      aanvrager. Het deelt deze eveneens onverwijld mede indien een besluit is uitgebleven zoals bedoeld in het derde of
      vijfde lid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: '41.7'
    text: |-
      Zolang de opschorting niet is geëindigd, zendt het bureau op verzoek van Onze genoemde minister aan deze afschrift
      van alle ter zake tussen het bureau en de aanvrager gewisselde stukken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: '41.8'
    text: |-
      Indien de opschorting eindigt, geschiedt niettemin de inschrijving van de aanvrage in het octrooiregister, tenzij
      op verzoek van de aanvrager, niet voordat drie maanden zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel41
  - number: '42.1'
    text: |-
      De Staat verleent degene, ten aanzien van wiens octrooiaanvrage de [artikelen 40][ref1], [41][ref2] of [46][ref3]
      zijn toegepast, op zijn verzoek vergoeding van schade, die hij door toepassing van die artikelen heeft geleden.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel46
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '40'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '41'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '46'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '42.2'
    text: |-
      Het bedrag van de schadeloosstelling wordt vastgesteld na het eindigen van de opschorting. Ingeval echter
      verlenging van de termijn van opschorting krachtens [artikel 41, derde lid][ref1], heeft plaatsgevonden, wordt
      het bedrag van de schadeloosstelling op verzoek van de aanvrager vastgesteld in gedeelten, waarvan het eerste
      betrekking heeft op de tijdsruimte vóór de aanvang van de eerste verlenging, de volgende op de tijdsruimte tussen
      twee opeenvolgende verlengingen en het laatste op de tijdsruimte vanaf de aanvang van de laatste verlenging tot het
      eindigen van de opschorting; de vaststelling geschiedt dan telkens na het verstrijken van de betrokken tijdsruimte.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel41
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '41'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '42.3'
    text: |-
      De vaststelling geschiedt zo mogelijk door Onze Minister van Defensie en de aanvrager in onderling overleg. Indien
      binnen zes maanden na het einde van de tijdsruimte, waarvoor de vergoeding moet gelden, geen overeenstemming is
      bereikt, is [artikel 58, zesde lid, eerste volzin][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel58
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel42
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '43.1'
    text: |-
      Indien een aanvrager verzoekt de inhoud van een octrooiaanvrage geheim te houden in het belang van de verdediging
      van een andere staat, dan wel de regering van die staat zodanig verzoek doet, zendt het bureau, mits de aanvrager
      schriftelijk heeft verklaard afstand te doen van alle vergoeding van schade, die hij door toepassing van dit
      artikel zou kunnen lijden, onverwijld afschrift van dat verzoek en van de tot de aanvrage behorende beschrijving
      en tekeningen, alsmede van bedoelde afstandsverklaring, aan Onze Minister van Defensie. In dat geval wordt de
      inschrijving in het octrooiregister van de aanvrage opgeschort. Ingeval een afstandsverklaring ontbreekt, stelt het
      bureau Onze genoemde minister onverwijld van een en ander in kennis.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel43
  - number: '43.2'
    text: |-
      Binnen drie maanden na de indiening van het verzoek kan Onze genoemde minister, mits hem is gebleken, dat aan
      de aanvrager ook door de betrokken staat geheimhouding is opgelegd en dat deze van die staat toestemming heeft
      verkregen een aanvrage onder geheimhouding in te dienen, besluiten, dat de inhoud der aanvrage in het belang van de
      verdediging van die staat geheim moet blijven. Het besluit wordt bekendgemaakt aan de aanvrager en aan het bureau.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel43
  - number: '43.3'
    text: |-
      Een besluit als bedoeld in het tweede lid heeft tot gevolg dat de inschrijving in het octrooiregister van de
      aanvrage blijft opgeschort, totdat Onze genoemde minister besluit dat de aanvrage niet langer geheim hoeft te
      blijven. Indien een besluit niet binnen de in het tweede lid bedoelde termijn is genomen, eindigt de opschorting.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel43
  - number: '43.4'
    text: |-
      [Artikel 41, zevende en achtste lid][ref1], is ten aanzien van een aanvrage als in het eerste lid bedoeld van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel41
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel43
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '41'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '44.1'
    text: |-
      Ingeval Onze Minister van Defensie van oordeel is, dat het belang van de verdediging van het Koninkrijk vordert,
      dat de Staat datgene, waarvoor octrooi wordt aangevraagd in een aanvrage, waarop [artikel 40][ref1], [41][ref2]
      of [43][ref3] is toegepast, gebruikt, toepast dan wel doet gebruiken of toepassen, kan hij daartoe overgaan na het
      desbetreffende besluit bekend te hebben gemaakt. In dit besluit worden de handelingen, die de Staat moet kunnen
      verrichten of doen verrichten, nauwkeurig omschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel40
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel41
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel43
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '40'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '41'
        hoofdstuk: '2'
        paragraaf: '3'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '43'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: '44.2'
    text: De Staat betaalt de aanvrager een vergoeding voor het gebruik of de toepassing krachtens het eerste lid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel44
  - number: '44.3'
    text: |-
      Het bedrag van deze vergoeding wordt zo mogelijk door Onze genoemde minister en de aanvrager in onderling overleg
      vastgesteld. Indien binnen zes maanden na de in het eerste lid bedoelde bekendmaking geen overeenstemming is
      bereikt, is [artikel 58, zesde lid, eerste volzin][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel58
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel44
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '45'
    text: |-
      Indien de Staat zelf houder van een octrooiaanvrage is en Onze Minister van Defensie aan het bureau bekendmaakt,
      dat de inhoud daarvan in het belang van de verdediging van het Koninkrijk of zijn bondgenoten geheim moet blijven,
      wordt de inschrijving in het octrooiregister van de aanvrage opgeschort, totdat Onze genoemde minister aan het
      bureau bekendmaakt, dat de inhoud van de aanvrage niet langer geheim behoeft te blijven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel45
  - number: '46.1'
    text: |-
      Een Europese octrooiaanvrage, waarvan de inhoud - naar de aanvrager weet of redelijkerwijs moet vermoeden - in het
      belang van de verdediging van het Koninkrijk of zijn bondgenoten geheim moet blijven, moet worden ingediend bij
      het bureau.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel46
  - number: '46.2'
    text: |-
      Het bureau zendt onverwijld afschrift van de tot de aanvrage behorende beschrijving en tekeningen aan Onze Minister
      van Defensie.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel46
  - number: '46.3'
    text: |-
      Uiterlijk drie weken voordat een Europese octrooiaanvraag moet worden doorgezonden naar het Europees Octrooibureau,
      maakt Onze genoemde minister aan het bureau bekend of de inhoud van de aanvrage in het belang van de verdediging
      van het Koninkrijk of zijn bondgenoten geheim moet blijven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel46
  - number: '46.4'
    text: |-
      Indien een bekendmaking krachtens het derde lid in ontkennende zin is gedaan of indien een bekendmaking is
      uitgebleven, zendt het bureau de Europese octrooiaanvrage, met inachtneming van de hiervoor krachtens het Europees
      Octrooiverdrag geldende termijn, door aan het Europees Octrooibureau, bedoeld in dat verdrag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel46
  - number: '46.5'
    text: |-
      Het bureau geeft van enige bekendmaking krachtens het derde lid of van het uitblijven daarvan onverwijld kennis aan
      de aanvrager.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel46
  - number: '47'
    text: |-
      Een Europese octrooiaanvrage, die voldoet aan het bepaalde in artikel 80 van het Europees Octrooiverdrag en op
      grond van artikel 77, derde lid, van dat Verdrag wordt aangemerkt als te zijn ingetrokken en die, als bijlage bij
      een regelmatig verzoek tot omzetting in een aanvrage om octrooi in het Koninkrijk, bij het bureau is binnengekomen,
      hierna te noemen omgezette aanvrage, geldt als een tot het bureau gerichte en bij het bureau ingediende aanvrage
      om octrooi als bedoeld in [artikel 24][ref1]. Een verzoek tot omzetting is regelmatig als het met inachtneming van
      de bepalingen van het Achtste Deel, hoofdstuk I, van het Europees Octrooiverdrag tijdig gedaan en aan het bureau
      doorgezonden is.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel24
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel47
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '48.1'
    text: |-
      Op de omgezette aanvrage wordt de datum, waarop zij bij het bureau is binnengekomen, alsmede een volgnummer
      vermeld. Het bureau geeft hiervan zo spoedig mogelijk kennis aan de aanvrager.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel48
  - number: '48.2'
    text: |-
      Voor de omgezette aanvrage moet het in [artikel 24, vijfde lid][ref1], bedoelde bewijs van betaling worden
      overgelegd binnen een termijn van drie maanden na de in het eerste lid bedoelde datum van binnenkomst. Indien de
      Europese octrooiaanvrage niet in het Nederlands is ingediend moet binnen dezelfde termijn een vertaling in het
      Nederlands van de oorspronkelijke stukken van die aanvrage worden overgelegd. De vertaling maakt deel uit van
      de omgezette aanvrage; zij moet op verzoek van het bureau binnen een door dat bureau te stellen termijn worden
      gewaarmerkt. Indien niet tijdig is voldaan aan het in dit lid bepaalde, stelt het bureau de aanvrager eenmaal in
      de gelegenheid om binnen een door het bureau te stellen termijn zijn verzuim te herstellen. Indien de aanvrager
      zijn verzuim niet tijdig heeft hersteld, besluit het bureau de aanvrage niet te behandelen. Het bureau maakt zijn
      beschikking zo spoedig mogelijk aan de aanvrager bekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel24
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '48.3'
    text: |-
      Op de omgezette aanvrage zijn de bij of krachtens [artikel 24][ref1] gestelde vormvoorschriften niet van
      toepassing, voor zover zij afwijken van of een aanvulling betekenen op het bij of krachtens het Europees
      Octrooiverdrag bepaalde; in dat geval zijn laatstbedoelde bepalingen op de omgezette aanvrage van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel24
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '48.4'
    text: |-
      Zodra de aanvrager heeft voldaan aan het tweede lid gaat het bureau na of de aanvrage voldoet aan het bij en
      krachtens [artikel 24][ref1] bepaalde of, indien van toepassing, de in het derde lid bedoelde bepalingen van het
      Europees Octrooiverdrag. Indien dat niet het geval is of indien het openbaar worden van de uitvinding in strijd
      zou zijn met de openbare orde of goede zeden, geeft het bureau hiervan zo spoedig mogelijk schriftelijk kennis aan
      de aanvrager, onder opgave van de voorschriften waaraan niet is voldaan. [Artikel 30, tweede lid][ref2], is van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel30
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '30'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '48.5'
    text: |-
      Voor de toepassing van de [artikelen 31, eerste lid][ref1], [36, zesde lid][ref2], en[ 61, eerste lid][ref3],
      op de omgezette aanvrage wordt in plaats van "de in [artikel 29, eerste lid][ref4], bedoelde datum
      van indiening" gelezen: de datum van indiening die de aanvrage ingevolge artikel 80 van het Europees
      Octrooiverdrag met inachtneming van de artikelen 61 of 76 van dat Verdrag bezit. In afwijking van
      [artikel 32, eerste en tweede lid][ref5], kan een verzoek om een aan de verlening van het octrooi voorafgaand
      onderzoek naar de stand van de techniek met betrekking tot het onderwerp van de omgezette octrooiaanvrage of een
      daarvan afgesplitste aanvrage worden ingediend binnen twee maanden na de ingevolge [artikel 48, eerste lid][ref6],
      op de omgezette aanvrage vermelde datum onderscheidenlijk binnen twee maanden na indiening van de afgesplitste
      aanvrage.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel31
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel61
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel29
      [ref5]: https://wetten.overheid.nl/BWBR0007118#Artikel32
      [ref6]: https://wetten.overheid.nl/BWBR0007118#Artikel48
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref5
        bwb_id: BWBR0007118
        artikel: '32'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref6
        bwb_id: BWBR0007118
        artikel: '48'
        hoofdstuk: '2'
        paragraaf: '4'
  - number: '48.6'
    text: |-
      De in [artikel 31][ref1] bedoelde inschrijving in het octrooiregister vindt niet eerder plaats dan nadat is
      vastgesteld dat aan de in het vierde lid bedoelde voorschriften is voldaan of de gebreken zijn hersteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel31
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel48
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '49.1'
    text: |-
      Met inachtneming van het in deze rijkswet bepaalde hebben Europese octrooien vanaf de dag, waarop overeenkomstig
      artikel 97, derde lid, van het Europees Octrooiverdrag de vermelding van de verlening is gepubliceerd, dezelfde
      rechtsgevolgen en zijn zij aan hetzelfde recht onderworpen als de overeenkomstig [artikel 36][ref1] van deze
      rijkswet verleende octrooien.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel36
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '49.2'
    text: |-
      Een Europees octrooi blijft, behoudens eerder verval of vernietiging door de rechter, van kracht tot het
      verstrijken van een termijn van twintig jaren, te rekenen vanaf de datum van indiening, die de Europese
      octrooiaanvrage, die tot het betrokken Europees octrooi heeft geleid, ingevolge artikel 80 van het Europees
      Octrooiverdrag met inachtneming van de artikelen 61 of 76 van dat verdrag bezit.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel49
  - number: '49.3'
    text: |-
      Voor de toepassing van de [artikelen 55, eerste lid][ref1], [57, vierde lid][ref2], en [77, eerste lid][ref3], op
      Europese octrooien geldt als dag van indiening: de datum van indiening die de Europese octrooiaanvrage, die tot het
      betrokken Europees octrooi heeft geleid, ingevolge artikel 80 van het Europees Octrooiverdrag met inachtneming van
      de artikelen 61 of 76 van dat verdrag bezit.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel55
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel77
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel49
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '77'
        hoofdstuk: '5'
  - number: '50.1'
    text: |-
      Een Europees octrooi wordt geacht van de aanvang af geheel of gedeeltelijk niet de in de [artikelen 53][ref1],
      [53a][ref2], [72][ref3] en [73][ref4] bedoelde rechtsgevolgen te hebben gehad naar gelang het octrooi geheel of
      gedeeltelijk is herroepen of beperkt.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel73
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '50.2'
    text: 'De terugwerkende kracht van de herroeping heeft geen invloed op:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel50
  - number: 50.2.a
    text: |-
      een beslissing, niet zijnde een voorlopige voorziening, ter zake van handelingen in strijd met het in de
      [artikelen 53][ref1] en [53a][ref2] bedoelde uitsluitend recht van de octrooihouder of van handelingen als bedoeld
      in de [artikelen 72][ref3] en [73][ref4], die voor de herroeping in kracht van gewijsde is gegaan en ten uitvoer
      is gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel73
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 50.2.b
    text: |-
      een voor de herroeping gesloten overeenkomst, voor zover deze voor de herroeping is uitgevoerd; uit
      billijkheidsoverwegingen kan echter terugbetaling worden geëist van op grond van deze overeenkomst betaalde
      bedragen, en wel in de mate als door de omstandigheden gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel50
  - number: '50.3'
    text: |-
      Voor de toepassing van het tweede lid, onder *b*, wordt onder het sluiten van een overeenkomst mede verstaan het
      ontstaan van een licentie op een andere in de [artikelen 56, tweede lid][ref1], [59][ref2] of [60][ref3] aangegeven
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel60
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '51.1'
    text: |-
      Het bureau doet van de overeenkomstig artikel 97, derde lid, van het Europees Octrooiverdrag bedoelde publikatie
      van de vermelding dat een Europees octrooi is verleend onverwijld aantekening in het octrooiregister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel51
  - number: '51.2'
    text: |-
      Het bureau doet in het octrooiregister onverwijld aantekening van het instellen van een oppositieprocedure, een
      beperkingsprocedure of een herroepingsprocedure met betrekking tot een Europees octrooi, met vermelding van de
      datum waarop dit geschiedde en van beslissingen van het Europees Octrooibureau ter zake van deze procedures.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel51
  - number: '52.1'
    text: |-
      Degene aan wie een Europees octrooi is verleend, doet het bureau, indien het octrooi is verleend in een andere
      taal dan het Engels, binnen een bij algemene maatregel van rijksbestuur te bepalen termijn een vertaling in
      het Nederlands of in het Engels toekomen van de tekst waarin het Europees Octrooibureau besluit dat octrooi
      te verlenen. Daarnaast doet degene aan wie een Europees octrooi is verleend het bureau binnen een bij algemene
      maatregel van rijksbestuur te bepalen termijn een vertaling in het Nederlands toekomen van de conclusies van
      het verleende octrooi. Bij indiening van de vertaling wordt een bedrag betaald, waarvan de hoogte en de termijn
      waarbinnen betaling geschiedt, bij algemene maatregel van rijksbestuur worden bepaald.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.2'
    text: |-
      De in het eerste lid bedoelde vertalingen voldoen aan bij ministeriële regeling te stellen vormvoorschriften.
      Indien bij ontvangst binnen de in het eerste lid bedoelde termijn niet is voldaan aan een vormvoorschrift, geeft
      het bureau hiervan onverwijld kennis aan de octrooihouder onder opgave van het voorschrift waaraan niet is voldaan
      en van de termijn waarbinnen het geconstateerde gebrek kan worden opgeheven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.3'
    text: |-
      Onverwijld na ontvangst in behoorlijke vorm van de in het eerste lid bedoelde vertalingen doet het bureau daarvan
      aantekening in het octrooiregister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.4'
    text: |-
      Het Europees octrooi wordt geacht van de aanvang af niet de in [artikel 49][ref1] bedoelde rechtsgevolgen te hebben
      gehad, indien:


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel49
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '49'
        hoofdstuk: '3'
  - number: 52.4.a
    text: |-
      binnen de in het eerste lid bedoelde termijnen de in het eerste lid bedoelde vertalingen niet door het bureau zijn
      ontvangen onderscheidenlijk het krachtens dat lid verschuldigde bedrag niet is betaald, of
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: 52.4.b
    text: binnen de in het tweede lid bedoelde termijn niet alsnog aan de opgegeven voorschriften is voldaan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.5'
    text: |-
      Indien zich een omstandigheid als bedoeld in het vierde lid voordoet, doet het bureau daarvan onverwijld
      aantekening in het octrooiregister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.6'
    text: |-
      Het eerste tot en met het vijfde lid zijn van overeenkomstige toepassing, indien in het Europees octrooi tijdens de
      oppositieprocedure of beperkingsprocedure wijziging is gekomen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.7'
    text: |-
      De octrooihouder kan te allen tijde het bureau een verbeterde vertaling doen toekomen onder betaling van een
      bedrag, waarvan de hoogte bij of krachtens algemene maatregel van rijksbestuur wordt bepaald. Het eerste lid,
      tweede volzin, het tweede en het derde lid zijn van toepassing.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.8'
    text: |-
      Vanaf het tijdstip, waarop de in [artikel 51, eerste lid][ref1], bedoelde aantekening in het octrooiregister is
      gedaan, kan een ieder kosteloos kennisnemen van alle op het Europees octrooi betrekking hebbende stukken die het
      bureau hebben bereikt of die het bureau aan de houder van het Europees octrooi of aan derden heeft doen uitgaan in
      het kader van de bepalingen van deze rijkswet. Het bureau maakt van al deze stukken zo spoedig mogelijk doch niet
      voor het in de eerste volzin bedoelde tijdstip melding in het in [artikel 20][ref2] bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel51
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel20
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '51'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '52.9'
    text: |-
      Indien in de vertaling, bedoeld in het eerste of zevende lid, de beschermingomvang van de Europese octrooiaanvrage
      of het Europees octrooi beperkter is dan de bescherming die wordt geboden door die aanvrage of door dat octrooi in
      de procestaal, geldt die vertaling als authentieke tekst, behalve in geval van toepassing van [artikel 75][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '52.10'
    text: |-
      Indien een houder van een Europees octrooi een vermeende inbreukpleger schriftelijk op de hoogte stelt van de
      inbreuk op zijn octrooi, maakt de houder van dat octrooi op verzoek van een vermeende inbreukpleger een vertaling
      in het Nederlands van de tekst van het octrooi en verstrekt deze tekst aan de verzoeker.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '52.11'
    text: De kosten van de vertalingen worden gedragen door de houder van een octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel52
  - number: '53.1'
    text: |-
      Een octrooi geeft de octrooihouder, behoudens de bepalingen van de [artikelen 53a tot en met 60][ref1], het
      uitsluitend recht:


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel55
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 53.1.a
    text: |-
      het geoctrooieerde voortbrengsel in of voor zijn bedrijf te vervaardigen, te gebruiken, in het verkeer te brengen
      of verder te verkopen, te verhuren, af te leveren of anderszins te verhandelen, dan wel voor een of ander aan te
      bieden, in te voeren of in voorraad te hebben;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
  - number: 53.1.b
    text: |-
      de geoctrooieerde werkwijze in of voor zijn bedrijf toe te passen of het voortbrengsel, dat rechtstreeks verkregen
      is door toepassing van die werkwijze, in of voor zijn bedrijf te gebruiken, in het verkeer te brengen of verder te
      verkopen, te verhuren, af te leveren of anderszins te verhandelen, dan wel voor een of ander aan te bieden, in te
      voeren of in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
  - number: '53.2'
    text: |-
      Het uitsluitend recht wordt bepaald door de conclusies van het octrooischrift, waarbij de beschrijving en de
      tekeningen dienen tot uitleg van die conclusies.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
  - number: '53.3'
    text: |-
      Het uitsluitend recht strekt zich niet uit over handelingen, uitsluitend dienende tot onderzoek van het
      geoctrooieerde, daaronder begrepen het door toepassing van de geoctrooieerde werkwijze rechtstreeks verkregen
      voortbrengsel. Het uitsluitend recht strekt zich evenmin uit tot de bereiding voor direct gebruik ten behoeve van
      individuele gevallen op medisch voorschrift van geneesmiddelen in apotheken, noch tot handelingen betreffende de
      aldus bereide geneesmiddelen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
  - number: '53.4'
    text: |-
      Het uitvoeren van de noodzakelijke studies, tests en proeven met het oog op de toepassing van artikel 10,
      eerste tot en met vierde lid, van Richtlijn 2001/83/EG tot vaststelling van een communautair wetboek betreffende
      geneesmiddelen voor menselijk gebruik (PbEG L 311) of artikel 13, eerste tot en met het vijfde lid van Richtlijn
      2001/82/EG tot vaststelling van een communautair wetboek betreffende geneesmiddelen voor diergeneeskundig gebruik
      (PbEG L 311) en de daaruit voortvloeiende praktische vereisten worden niet beschouwd als een inbreuk op octrooien
      met betrekking tot geneesmiddelen voor menselijk gebruik, respectievelijk geneesmiddelen voor diergeneeskundig
      gebruik.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
  - number: '53.5'
    text: |-
      Is een voortbrengsel als in het eerste lid, onder a of b, bedoeld, in Nederland, Curaçao of Sint Maarten rechtmatig
      in het verkeer gebracht, dan wel door de octrooihouder of met diens toestemming in één der Lid-Staten van de
      Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte in het verkeer gebracht, dan handelt de verkrijger of latere houder niet in strijd met het octrooi, door
      dit voortbrengsel in of voor zijn bedrijf te gebruiken, te verkopen, te verhuren, af te leveren of anderszins te
      verhandelen, dan wel voor een of ander aan te bieden, in te voeren of in voorraad te hebben.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
  - number: '53.6'
    text: |-
      Een voortbrengsel als in het eerste lid, onder a of b, bedoeld, dat voor de verlening van het octrooi, of, indien
      het een Europees octrooi betreft, voor de dag, waarop overeenkomstig artikel 97, derde lid, van het Europees
      Octrooiverdrag de vermelding van de verlening van het Europees octrooi is gepubliceerd, in een bedrijf is
      vervaardigd, mag niettegenstaande het octrooi ten dienste van dat bedrijf worden gebruikt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53
  - number: 53a.1
    text: |-
      Ten aanzien van een octrooi voor biologisch materiaal dat door de uitvinding bepaalde eigenschappen heeft
      verkregen, strekt het uitsluitend recht zich uit tot ieder biologisch materiaal dat hieruit door middel van
      propagatie of vermeerdering in dezelfde of in gedifferentieerde vorm wordt gewonnen en dat diezelfde eigenschappen
      heeft.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53a
  - number: 53a.2
    text: |-
      Ten aanzien van een octrooi voor een werkwijze voor de voortbrenging van biologisch materiaal dat door de
      uitvinding bepaalde eigenschappen heeft gekregen, strekt het uitsluitend recht zich uit tot het biologisch
      materiaal dat rechtstreeks door deze werkwijze wordt gewonnen en tot ieder ander biologisch materiaal dat door
      middel van propagatie of vermeerdering in dezelfde of in gedifferentieerde vorm uit het rechtstreeks gewonnen
      biologisch materiaal wordt gewonnen en dat diezelfde eigenschappen heeft.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53a
  - number: 53a.3
    text: |-
      Ten aanzien van een octrooi voor een voortbrengsel dat uit genetische informatie bestaat of dat zulke
      informatie bevat, strekt het uitsluitend recht zich uit tot ieder materiaal waarin dit voortbrengsel
      wordt verwerkt en waarin de genetische informatie wordt opgenomen en haar functie uitoefent, onverminderd
      [artikel 3, eerste lid, onderdeel b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel3
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53a
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '3'
        hoofdstuk: '1'
  - number: 53b.1
    text: |-
      Het recht, bedoeld in [artikel 53a][ref1], strekt zich niet uit tot biologisch materiaal dat wordt gewonnen door
      propagatie of door vermeerdering van biologisch materiaal dat in Nederland, Curaçao of Sint Maarten rechtmatig in
      het verkeer is gebracht, dan wel door de octrooihouder of met diens toestemming in één van de lid-staten van de
      Europese Gemeenschap of in een andere staat die partij is bij de Overeenkomst betreffende de Europese Economische
      Ruimte in het verkeer is gebracht, indien de propagatie of vermeerdering noodzakelijkerwijs voortvloeit uit het
      gebruik waarvoor het biologisch materiaal in het verkeer is gebracht, mits het afgeleide materiaal vervolgens niet
      voor andere propagaties of vermeerderingen wordt gebruikt.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 53b.2
    text: |-
      Het recht, bedoeld in [artikel 53a][ref1], strekt zich evenmin uit over handelingen met biologisch materiaal die
      dienen tot het kweken, of ontdekken en ontwikkelen van andere plantenrassen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53b
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 53c.1
    text: |-
      In afwijking van [artikel 53a][ref1] houdt de verkoop of een andere vorm van in het verkeer brengen, door de
      octrooihouder of met diens toestemming, van plantaardig propagatiemateriaal aan een landbouwer voor agrarische
      exploitatiedoeleinden voor de laatste het recht in om de voortbrengselen van zijn oogst voor verdere propagatie of
      vermeerdering door hemzelf op zijn eigen bedrijf te gebruiken met inachtneming van het bepaalde bij of krachtens
      artikel 14 van [verordening (EG) nr. 2100/94](31994R2100) van de Raad van de Europese Unie van 27 juli 1994 inzake
      het communautaire kwekersrecht (PbEG L 227).


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 53c.2
    text: |-
      In afwijking van [artikel 53a][ref1] houdt de verkoop of een andere vorm van in het verkeer brengen, door de
      octrooihouder of met diens toestemming, van fokvee of dierlijk propagatiemateriaal aan een landbouwer voor de
      laatste het recht in om het door een octrooi beschermde vee voor agrarische doeleinden te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53c
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 53c.3
    text: |-
      Onder gebruik voor agrarische doeleinden, bedoeld in het tweede lid, wordt in ieder geval verstaan het beschikbaar
      stellen van het dier of van dierlijk propagatiemateriaal voor het gebruik in het agrarisch bedrijf van de
      landbouwer, maar niet de verkoop in het kader van of met het oog op de commerciële fokkerij.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53c
  - number: 53c.4
    text: |-
      Bij algemene maatregel van rijksbestuur kunnen door Onze Minister, in overeenstemming met Onze Minister van
      Landbouw, Natuur en Voedselkwaliteit, nadere regels worden gesteld ten aanzien van het recht, bedoeld in het tweede
      of derde lid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel53c
  - number: '54'
    text: 'Het uitsluitend recht van de octrooihouder strekt zich niet uit tot:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel54
  - number: 54.a
    text: |-
      het gebruik aan boord van schepen van andere landen van datgene, wat het voorwerp van zijn octrooi uitmaakt, in het
      schip zelf, in de machines, het scheepswant, de tuigage en andere bijbehorende zaken, wanneer die schepen tijdelijk
      of bij toeval in de wateren van Nederland, Curaçao of Sint Maarten verblijven, mits bedoeld gebruik uitsluitend zal
      zijn ten behoeve van het schip;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel54
  - number: 54.b
    text: |-
      het gebruik van datgene, wat het voorwerp van zijn octrooi uitmaakt, in de constructie of werking van voor de
      voortbeweging in de lucht of te land dienende machines van andere landen, of van het toebehoren van die machines,
      wanneer deze tijdelijk of bij toeval in Nederland, Curaçao of Sint Maarten verblijven;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel54
  - number: 54.c
    text: |-
      handelingen, vermeld in artikel 27 van het op 7 december 1944 te Chicago tot stand gekomen Verdrag inzake de
      internationale burgerlijke luchtvaart (*Stb.* 1947, H 165), mits deze handelingen betrekking hebben op een
      luchtvaartuig van een onder c van dat artikel bedoelde andere staat dan het Koninkrijk of een daartoe behorend
      land.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel54
  - number: '55.1'
    text: |-
      Degene, die datgene waarvoor door een ander een octrooi is gevraagd, in Nederland, Curaçao of Sint Maarten
      reeds in of voor zijn bedrijf vervaardigde of toepaste of aan zijn voornemen tot zodanige vervaardiging of
      toepassing een begin van uitvoering had gegeven op de dag van indiening van die aanvrage of, indien de aanvrager
      een recht van voorrang geniet ingevolge [artikel 9, eerste lid][ref1], dan wel ingevolge artikel 87 van het
      Europees Octrooiverdrag, op de dag van indiening van de aanvrage, waarop het recht van voorrang berust, blijft
      niettegenstaande het octrooi, als voorgebruiker bevoegd de in [artikel 53, eerste lid][ref2], bedoelde handelingen
      te verrichten, tenzij hij zijn wetenschap ontleend heeft aan hetgeen reeds door de octrooiaanvrager vervaardigd of
      toegepast werd, of wel aan beschrijvingen, tekeningen of modellen van de octrooiaanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel9
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '9'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '55.2'
    text: |-
      Het eerste lid is van overeenkomstige toepassing ten aanzien van dat deel van het aan Nederland, Curaçao of
      Sint Maarten grenzende continentaal plat, waarop het Koninkrijk soevereine rechten heeft, doch uitsluitend voor
      zover het handelingen betreft, gericht op en verricht tijdens het onderzoek naar de aanwezigheid van natuurlijke
      rijkdommen of het winnen daarvan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel55
  - number: '55.3'
    text: |-
      Degene, die te goeder trouw datgene waarvoor aan een ander een Europees octrooi is verleend, reeds in of
      voor zijn bedrijf vervaardigde of toepaste of aan zijn voornemen tot zodanige vervaardiging of toepassing
      een begin van uitvoering had gegeven voor de datum waarop van een verbeterde vertaling als bedoeld in
      [artikel 52, zevende lid][ref1], aantekening is gedaan in het octrooiregister, blijft niettegenstaande het octrooi
      bevoegd de in [artikel 53, eerste lid][ref2], bedoelde handelingen te verrichten, voor zover deze handelingen geen
      inbreuk maken op het uitsluitend recht van de octrooihouder, welk recht in dit geval bepaald wordt door de inhoud
      van de conclusies van het octrooischrift en de voor de uitleg daarvan bedoelde beschrijving en tekeningen in de
      eerdere, gebrekkige vertaling in het Nederlands.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel52
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '52'
        hoofdstuk: '3'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '55.4'
    text: De in het eerste en het derde lid bedoelde bevoegdheden gaan alleen met het bedrijf op anderen over.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel55
  - number: '56.1'
    text: |-
      Door een licentie wordt van de octrooihouder de bevoegdheid verkregen handelingen te verrichten, die volgens
      [artikel 53][ref1] aan anderen dan hem niet vrijstaan. Die bevoegdheid strekt zich uit tot alle in bedoeld artikel
      vermelde handelingen en geldt voor de gehele duur van het octrooi, tenzij bij de verlening der licentie een minder
      omvangrijk recht is toegekend.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '56.2'
    text: |-
      Een licentie ontstaat door een overeenkomst, door een aanvaarde uiterste wilsbeschikking of, overeenkomstig de
      [artikelen 57][ref1] en [58][ref2], door een beschikking van Onze Minister of door een in kracht van gewijsde
      gegane rechterlijke uitspraak. De door een overeenkomst of aanvaarde wilsbeschikking ontstane licentie is tegenover
      derden geldig, nadat de titel in het octrooiregister is ingeschreven. Voor de inschrijving is een bij of krachtens
      algemene maatregel van rijksbestuur vast te stellen bedrag verschuldigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel58
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '56.3'
    text: |-
      Indien het recht op een vergoeding voor een licentie ingevolge [artikel 75, achtste lid][ref1], of
      [artikel 78, vierde lid][ref2], op een ander overgaat, wordt door de nieuwe rechthebbende aanspraak verkregen
      op een deel van de in het geheel voor de licentie betaalde en te betalen vergoeding in verhouding tot de tijd,
      gedurende welke de licentie in normale omstandigheden nog van kracht moet blijven. Is hetgeen de licentiehouder
      nog moet betalen niet voldoende om de nieuwe rechthebbende te verschaffen wat hem toekomt, dan heeft deze voor het
      ontbrekende verhaal op de vroegere.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel78
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '78'
        hoofdstuk: '5'
  - number: '56.4'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld over de aanvraag tot inschrijving
      van een licentie.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel56
  - number: '57.1'
    text: |-
      Onze Minister kan, indien het algemeen belang dit naar zijn oordeel vordert, onder een octrooi een licentie van
      een door hem nauwkeurig omschreven inhoud aan een door hem aangewezen persoon verlenen. Alvorens zijn beschikking
      te geven onderzoekt Onze Minister, tenzij de te dezen vereiste spoed zich daartegen verzet, of de octrooihouder
      bereid is de licentie onder redelijke voorwaarden vrijwillig te verlenen. Hij stelt daartoe de octrooihouder
      in de gelegenheid schriftelijk en, zo deze dit verzoekt, ook mondeling van zijn gevoelen te doen blijken. De
      beschikking wordt aan de octrooihouder en aan de verkrijger van de licentie bekendgemaakt. Bij zijn beschikking
      kan Onze Minister de verkrijger van de licentie het stellen van zekerheid binnen een bepaalde termijn opleggen. Het
      instellen van bezwaar en beroep heeft schorsende werking, tenzij de beschikking van Onze Minister op grond van de
      te dezen vereiste spoed anders bepaalt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel57
  - number: '57.2'
    text: |-
      Indien noch de octrooihouder, noch een ander krachtens een hem verleende licentie na verloop van drie jaren na
      dagtekening van het octrooi in het Koninkrijk of in een andere, bij algemene maatregel van rijksbestuur aangewezen
      staat in werking heeft een inrichting van nijverheid, waarin te goeder trouw in voldoende mate het betrokken
      voortbrengsel wordt vervaardigd of de betrokken werkwijze wordt toegepast, is de octrooihouder verplicht de
      voor het in werking hebben van zodanige inrichting nodige licentie te verlenen, tenzij geldige redenen voor
      het ontbreken van zodanige inrichting blijken te bestaan. Voor de houder van een Europees octrooi ontstaat deze
      verplichting, indien niet na verloop van drie jaren na de dag, waarop overeenkomstig artikel 97, vierde lid, van
      het Europees Octrooiverdrag de vermelding van de verlening van het Europees octrooi is gepubliceerd, een inrichting
      van nijverheid als hiervoor bedoeld in werking is in Nederland, Curaçao of Sint Maarten of in een andere, bij
      algemene maatregel van rijksbestuur aangewezen staat.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel57
  - number: '57.3'
    text: |-
      Het tweede lid is niet van toepassing, indien de octrooihouder of een ander krachtens een hem verleende licentie
      in dat deel van het aan Nederland, Curaçao of Sint Maarten grenzende continentaal plat, waarop het Koninkrijk
      soevereine rechten heeft, in werking heeft een inrichting van nijverheid, waarin te goeder trouw in voldoende mate
      handelingen als in dat lid bedoeld worden verricht, mits die handelingen zijn gericht op en worden verricht tijdens
      het onderzoek naar de aanwezigheid van natuurlijke rijkdommen of het winnen daarvan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel57
  - number: '57.4'
    text: |-
      De octrooihouder is te allen tijde verplicht de licentie te verlenen welke nodig mocht zijn voor de toepassing
      van een octrooi, verleend op een aanvrage met een gelijke of latere dag van indiening of, indien voor de aanvrage
      een recht van voorrang bestaat, gelijke of latere voorrangsdatum, voor zover in het octrooi ten behoeve waarvan de
      licentie is gevraagd, een belangrijke technische vooruitgang van aanzienlijke economische betekenis is belichaamd;
      de octrooihouder is evenwel tot verlening van een licentie welke nodig mocht zijn voor de toepassing van een
      Europees octrooi eerst verplicht nadat de voor het instellen van oppositie tegen het Europees octrooi gestelde
      termijn is verstreken of een ingestelde oppositieprocedure is afgesloten. Een zodanige licentie strekt zich niet
      verder uit dan noodzakelijk is voor de toepassing van het octrooi van de verkrijger. Deze is verplicht aan de
      houder van het andere octrooi wederkerig licentie onder zijn octrooi te verlenen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel57
  - number: '57.5'
    text: |-
      De octrooihouder verleent aan een kweker een licentie tegen een redelijke vergoeding, indien de kweker een
      kwekersrecht op een plantenras niet kan verkrijgen of exploiteren zonder inbreuk te maken op het octrooi van
      eerdere datum en de licentie noodzakelijk is voor de exploitatie van het te beschermen plantenras, dat een
      belangrijke technische vooruitgang van aanzienlijk economisch belang vertegenwoordigt ten opzichte van de door het
      octrooi beschermde uitvinding.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel57
  - number: '57.6'
    text: |-
      Indien aan een octrooihouder een licentie is verleend op grond van
      [artikel 42, tweede lid, van de Zaaizaad- en Plantgoedwet][ref1], verleent de octrooihouder aan de houder van het
      kwekersrecht op diens verzoek onder redelijke voorwaarden een wederkerige licentie om de beschermde uitvinding
      te gebruiken.


      [ref1]: https://wetten.overheid.nl/BWBR0002541#Artikel42
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel57
    references:
      - id: ref1
        bwb_id: BWBR0002541
        artikel: '42'
  - number: 57a
    text: |-
      In afwijking van [artikel 57][ref1] kan een gedwongen licentie onder een octrooi op het gebied van de
      halfgeleiderstechnologie alleen worden verleend voor niet-commercieel gebruik door de overheid of voor het
      tegengaan van een gedraging waarvan na een rechterlijke of administratieve procedure is vastgesteld dat deze
      concurrentiebeperkend is.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel57a
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '58.1'
    text: |-
      Indien de licentie, bedoeld in [artikel 57, tweede, vierde, vijfde of zesde lid][ref1], ten onrechte niet is
      verleend, wordt de licentie op vordering van de belanghebbende door de rechter verleend. Op verzoek van eiser wordt
      de dagvaarding door het bureau in het octrooiregister ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '58.2'
    text: |-
      Indien het octrooi op grond van deze rijkswet is verleend, is de eiser in zijn rechtsvordering niet ontvankelijk
      als hij niet bij dagvaarding als bijlage daarbij het resultaat van een door het bureau of het in het Europees
      Octrooiverdrag bedoelde Europees Octrooibureau ingesteld onderzoek naar de stand van de techniek met betrekking tot
      het onderwerp van het octrooi, ten behoeve waarvan de licentie is gevorderd, overlegt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58
  - number: '58.3'
    text: |-
      De verlening van een op grond van [artikel 57, vierde lid, eerste volzin][ref1], gevorderde licentie kan met
      of zonder tijdsbepaling worden geschorst, indien binnen twee maanden na de betekening van de dagvaarding waarin
      de licentie is gevorderd, een vordering tot vernietiging van het octrooi, ten behoeve waarvan de licentie is
      gevorderd, is ingesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '58.4'
    text: |-
      De rechter kan bij de omschrijving van de verleende licentie afwijken van hetgeen gevraagd is en kan voorts
      de verkrijger van de licentie het stellen van zekerheid binnen een bepaalde termijn opleggen. Een op grond van
      [artikel 57, vierde lid, eerste volzin][ref1], verleende licentie zal slechts kunnen worden overgedragen tezamen
      met het octrooi van de licentiehouder. Een op grond van [artikel 57, vierde lid, eerste of derde volzin][ref2],
      verleende licentie vervalt niet doordat het octrooi, ten behoeve waarvan de licentie is verleend, als gevolg
      van het verstrijken van de in [artikel 36, zesde lid][ref3], bedoelde termijn is geëindigd of met goed gevolg is
      opgeëist, doch vervalt wel voor zover het octrooi geheel of gedeeltelijk is vernietigd als resultaat van de in het
      derde lid bedoelde vordering.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel57
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel36
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '58.5'
    text: |-
      Een besluit als bedoeld in [artikel 57, eerste lid][ref1], of een in kracht van gewijsde gegane rechterlijke
      uitspraak wordt door het bureau in het octrooiregister ingeschreven. Is het stellen van zekerheid opgelegd,
      dan heeft de inschrijving niet plaats, voordat aan die verplichting is voldaan. Voor de inschrijving is
      een bij of krachtens algemene maatregel van rijksbestuur vast te stellen bedrag verschuldigd. De licentie
      werkt eerst na die inschrijving, maar dan ook tegenover hen, die na de inschrijving van de in het eerste lid
      bedoelde dagvaarding rechten op het octrooi hebben verkregen. Een ingeschreven licentie, die op grond van
      [artikel 57, vierde lid][ref2], is verleend, werkt echter terug tot en met de dag waarop de dagvaarding is
      ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '58.6'
    text: |-
      Op vordering van de meest gerede partij bepaalt de rechter bij gebreke van overeenstemming de vergoeding,
      die de verkrijger van de licentie aan de octrooihouder dient te betalen. De rechter kan daarbij de verkrijger
      van de licentie het stellen van zekerheid binnen een bepaalde termijn opleggen, dan wel de op grond van
      [artikel 57, eerste lid][ref1], of het vijfde lid van dit artikel bepaalde zekerheid bevestigen of wijzigen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 58a.1
    text: |-
      Een op grond van [artikel 57][ref1] verleende licentie is niet uitsluitend.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 58a.2
    text: |-
      Een op grond van [artikel 57][ref1] verleende licentie kan niet worden overgedragen dan tezamen met het gedeelte
      van de onderneming of de goodwill van het gedeelte van de onderneming, waarin de licentie wordt uitgeoefend.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 58a.3
    text: |-
      Een op grond van [artikel 57][ref1] verleende licentie kan worden ingetrokken wanneer, rekening houdend met een
      redelijke bescherming van de gerechtvaardigde belangen van de licentiehouder, de omstandigheden welke hebben geleid
      tot de verlening van de licentie ophouden te bestaan en het onwaarschijnlijk is dat zij herleven. De instantie
      welke de licentie heeft verleend onderzoekt op gemotiveerd verzoek het voortduren van bovengenoemde omstandigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel58a
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '57'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '59.1'
    text: |-
      Bij koninklijk besluit kan, indien het belang van de verdediging van het Koninkrijk dit vordert, op
      gemeenschappelijke voordracht van Onze Minister en van Onze minister, wie het rechtstreeks aangaat, worden bepaald,
      dat de Staat bevoegd is in dat besluit nauwkeurig te omschrijven handelingen, waartoe de houder van een in dat
      besluit aan te wijzen octrooi ingevolge de [artikelen 53][ref1] en [53a][ref2] uitsluitend gerechtigd is, zelf te
      verrichten of door anderen te doen verrichten. Deze bevoegdheid geldt voor de gehele duur van het octrooi, tenzij
      in het besluit een kortere duur is bepaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '59.2'
    text: |-
      Na het van kracht worden van een besluit als bedoeld in het eerste lid zal Onze minister, wie het rechtstreeks
      aangaat, zich met de octrooihouder verstaan omtrent de door de Staat aan deze te betalen vergoeding. Indien
      Onze minister, wie het rechtstreeks aangaat, hierover niet binnen zes maanden na het van kracht worden van het
      desbetreffende besluit met de octrooihouder tot overeenstemming is gekomen, is [artikel 58, zesde lid][ref1], met
      uitzondering van het omtrent het stellen van zekerheid bepaalde, van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel58
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '60.1'
    text: |-
      Onverminderd [artikel 56, tweede lid, eerste volzin][ref1], ontstaat een licentie door:


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel56
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 60.1.a
    text: |-
      een uitspraak van de Arbitrage-Commissie, bedoeld in artikel 20 van het Verdrag tot oprichting van de Europese
      Gemeenschap voor Atoomenergie (Euratom) (Trb. 1957, 92);
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel60
  - number: 60.1.b
    text: een besluit van Onze Minister ter uitvoering van artikel 21 van genoemd verdrag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel60
  - number: '60.2'
    text: |-
      Ten aanzien van een licentie, ontstaan door een eindbeslissing als bedoeld in het eerste lid, onder a, is
      [artikel 56, tweede lid, tweede en derde volzin][ref1], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel56
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '60.3'
    text: |-
      Ten aanzien van een besluit als bedoeld in het eerste lid, onder b, is
      [artikel 58, eerste, vierde en vijfde lid, eerste, tweede en derde volzin][ref1], van
      overeenkomstige toepassing. Ten aanzien van een door zodanig besluit ontstane licentie is
      [artikel 58, vijfde lid, vierde volzin, en zesde lid][ref2], van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel58
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel60
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '60.4'
    text: Een licentie als bedoeld in het eerste lid geldt niet voor Curaçao en Sint Maarten.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel60
  - number: '61.1'
    text: |-
      Voor de instandhouding van een octrooi moet elk jaar, voor het eerst voor de aanvang van het vierde jaar na de in
      [artikel 29, eerste lid][ref1], bedoelde datum van indiening, op de laatste dag van de maand waarin de aanvrage
      die tot octrooi heeft geleid is ingediend, of ingevolge [artikel 28, eerste lid][ref2], wordt aangemerkt te zijn
      ingediend, aan het bureau een bij of krachtens algemene maatregel van rijksbestuur vast te stellen bedrag worden
      betaald.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel28
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel61
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '61.2'
    text: |-
      Voor de instandhouding van een Europees octrooi moet elk jaar, voor het eerst na afloop van het in artikel 86,
      vierde lid, van het Europees Octrooiverdrag bedoelde jaar doch niet eerder dan voor de aanvang van het vierde
      jaar na de in artikel 80 van het Europees Octrooiverdrag bedoelde datum van indiening, aan het bureau een bedrag
      als in het eerste lid bedoeld worden betaald en wel op de laatste dag van de maand waarin de datum van indiening
      valt, die de Europese octrooiaanvrage, die tot het octrooi heeft geleid, ingevolge artikel 80 van het Europees
      Octrooiverdrag met inachtneming van de artikelen 61 of 76 van dat verdrag, bezit. Indien het voor de eerste maal
      verschuldigde bedrag zou moeten worden betaald binnen een termijn van twee maanden na de dag waarop overeenkomstig
      artikel 97, vierde lid, van het Europees Octrooiverdrag de vermelding van de verlening van het Europees octrooi is
      gepubliceerd, kan dit bedrag nog worden betaald op de laatste dag van de maand waarin deze termijn eindigt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel61
  - number: '61.3'
    text: |-
      Bij betaling na de vervaldag zijn bij of krachtens algemene maatregel van rijksbestuur vast te stellen verhogingen
      verschuldigd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel61
  - number: '62'
    text: |-
      Een octrooi vervalt van rechtswege, wanneer de in [artikel 61][ref1] genoemde bedragen niet binnen zes
      kalendermaanden na de daar genoemde vervaldag zijn betaald. Van dit vervallen wordt in het octrooiregister van het
      bureau aantekening gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel61
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '63.1'
    text: |-
      Een octrooihouder kan geheel of gedeeltelijk afstand doen van zijn octrooi. De afstand heeft terugwerkende kracht
      overeenkomstig [artikel 75, vijfde tot en met zevende lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '63.2'
    text: |-
      De afstand geschiedt door de inschrijving van een daartoe strekkende akte in het octrooiregister. Het bureau
      schrijft de akte niet in zolang er personen zijn, die krachtens in het octrooiregister ingeschreven stukken rechten
      op het octrooi of licenties hebben verkregen of rechtsvorderingen, het octrooi betreffende, hebben ingesteld en
      deze personen tot de afstand geen toestemming hebben verleend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel63
  - number: '64.1'
    text: |-
      Het octrooi en de aanspraak op octrooi zijn zowel voor wat betreft het volle recht als voor wat betreft een aandeel
      daarin vatbaar voor overdracht of andere overgang.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel64
  - number: '64.2'
    text: |-
      De overdracht en andere overgang van het octrooi of van het recht, voortvloeiende uit de octrooiaanvrage, kunnen
      door het bureau worden ingeschreven in het octrooiregister. Voor de inschrijving is een bij of krachtens algemene
      maatregel van rijksbestuur vast te stellen bedrag verschuldigd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel64
  - number: '65.1'
    text: |-
      De levering, vereist voor de overdracht van het octrooi of het recht, voortvloeiende uit een octrooiaanvrage,
      geschiedt bij een akte, houdende de verklaring van de rechthebbende, dat hij het octrooi of het recht,
      voortvloeiende uit de octrooiaanvrage, aan de verkrijger overdraagt, en van deze, dat hij deze overdracht aanneemt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel65
  - number: '65.2'
    text: |-
      Elk voorbehoud, de overdracht betreffende, moet in de akte omschreven zijn; bij gebreke daarvan geldt de overdracht
      voor onbeperkt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel65
  - number: '65.3'
    text: |-
      De overdracht werkt tegenover derden eerst wanneer de akte in het octrooiregister is ingeschreven. Tot het doen
      verrichten van deze inschrijving zijn beide partijen gelijkelijk bevoegd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel65
  - number: '65.4'
    text: '[Artikel 88 van Boek 3 van het Nederlandse Burgerlijk Wetboek](onbekend) is van toepassing.'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel65
  - number: '66.1'
    text: |-
      Indien het octrooi aan verscheidene personen gezamenlijk toekomt, wordt hun onderlinge verhouding beheerst door
      hetgeen tussen hen bij overeenkomst is bepaald.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel66
  - number: '66.2'
    text: |-
      Indien er geen overeenkomst is of indien in de overeenkomst niet anders is bepaald, heeft iedere rechthebbende
      de bevoegdheid de in [artikel 53][ref1] genoemde handelingen te verrichten en tegen zulke handelingen alsmede
      handelingen als bedoeld in [artikel 73, eerste en tweede lid][ref2], die onbevoegdelijk zijn verricht, ingevolge
      de [artikelen 70 tot en met 73][ref3] op te treden, doch kan een licentie of toestemming als bedoeld in
      [artikel 73, tweede lid][ref4], door de rechthebbenden slechts met gemeen goedvinden verleend worden.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel73
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel70
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel73
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '66.3'
    text: |-
      Voor de betaling van de in [artikel 61][ref1] genoemde bedragen zijn de rechthebbenden hoofdelijk verbonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel61
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel66
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '67.1'
    text: |-
      Pandrecht op een octrooi wordt gevestigd bij een akte en werkt tegenover derden eerst wanneer de akte door het
      bureau in het octrooiregister is ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel67
  - number: '67.2'
    text: |-
      De pandhouder is verplicht in een door hem ondertekende verklaring, bij het bureau ter inschrijving in te zenden,
      woonplaats te kiezen te ’s-Gravenhage. Indien die keuze niet is gedaan, geldt het bureau als gekozen woonplaats.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel67
  - number: '67.3'
    text: |-
      Bedingen in de pandakte betreffende na inschrijving te verlenen licenties gelden van het ogenblik af, dat zij in
      het octrooiregister zijn aangetekend, ook tegenover derden. Bedingen betreffende vergoedingen voor licenties die op
      het ogenblik van de inschrijving reeds waren verleend, gelden tegenover de houder van de licentie na aanzegging aan
      deze bij deurwaardersexploit.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel67
  - number: '67.4'
    text: |-
      Akten, waaruit blijkt, dat het pandrecht heeft opgehouden te bestaan of krachteloos is geworden, worden door het
      bureau in het octrooiregister ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel67
  - number: '67.5'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld over de aanvraag tot inschrijving
      van een pandrecht.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel67
  - number: '68.1'
    text: |-
      Het beslag op een octrooi wordt gelegd en het proces-verbaal van inbeslagneming wordt door het
      bureau in het octrooiregister ingeschreven met overeenkomstige toepassing van de bepalingen van het
      [Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende executoriaal en conservatoir beslag op
      onroerende zaken, met dien verstande dat in het proces-verbaal van inbeslagneming in plaats van de aard en de
      ligging van de onroerende zaak een aanduiding van het octrooi wordt opgenomen.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '68.2'
    text: |-
      Een vervreemding, bezwaring, onderbewindstelling of verlening van een licentie, totstandgekomen na de inschrijving
      van het proces-verbaal, kan tegen de beslaglegger niet worden ingeroepen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
  - number: '68.3'
    text: |-
      De voor de inschrijving van het proces-verbaal nog niet betaalde licentievergoedingen vallen mede
      onder een op het octrooi gelegd beslag, nadat het ingeschreven beslag aan de houder van de licentie is
      betekend. Deze vergoedingen moeten worden betaald aan de notaris voor wie de executie zal plaatsvinden,
      mits dit bij de betekening uitdrukkelijk aan de licentiehouder is medegedeeld, en behoudens de rechten
      van derden die de executant moet eerbiedigen. Hetgeen aan de notaris wordt betaald, wordt tot de in
      [artikel 69, tweede lid][ref1], bedoelde opbrengst gerekend. De [artikelen 475i][ref2], [476][ref3] en
      [478 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref4] zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel69
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel475i
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel476
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel478
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '69'
        hoofdstuk: '4'
        paragraaf: '3'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: 475i
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '476'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '478'
  - number: '68.4'
    text: 'De inschrijving van het proces-verbaal van inbeslagneming kan worden doorgehaald:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
  - number: 68.4.a
    text: |-
      krachtens een schriftelijke, ter inschrijving aangeboden verklaring van de deurwaarder dat hij in opdracht van de
      beslaglegger het beslag opheft of dat het beslag is vervallen;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
  - number: 68.4.b
    text: |-
      krachtens een ter inschrijving aangeboden rechterlijke uitspraak die tot opheffing van het beslag strekt of het
      verval van het beslag vaststelt of meebrengt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
  - number: '68.5'
    text: |-
      De [artikelen 504a][ref1], [507a][ref2], [538 tot en met 540][ref3], [726, tweede lid][ref4], en
      [727 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref5] zijn in geval van beslag op een octrooi van
      overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel504a
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel507
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel538
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel726
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel727
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: 504a
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '507'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '538'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '726'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '727'
  - number: '68.6'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden nadere regels gesteld over de aanvraag tot inschrijving
      van een beslag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel68
  - number: '69.1'
    text: |-
      De verkoop van een octrooi door een pandhouder of een beslaglegger tot verhaal van een vordering
      geschiedt in het openbaar ten overstaan van een bevoegde notaris. De [artikelen 508][ref1],
      [509][ref2], [513, eerste lid][ref3], [514, tweede en derde lid][ref4], [515 tot en met 519][ref5] en
      [521 tot en met 529 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref6] zijn van overeenkomstige
      toepassing, met dien verstande dat hetgeen daar ten aanzien van hypotheken en hypotheekhouders is voorgeschreven
      geldt voor de op het octrooi rustende pandrechten en de pandhouders.


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel508
      [ref2]: https://wetten.overheid.nl/BWBR0001827#Artikel509
      [ref3]: https://wetten.overheid.nl/BWBR0001827#Artikel513
      [ref4]: https://wetten.overheid.nl/BWBR0001827#Artikel514
      [ref5]: https://wetten.overheid.nl/BWBR0001827#Artikel515
      [ref6]: https://wetten.overheid.nl/BWBR0001827#Artikel521
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '508'
      - id: ref2
        bwb_id: BWBR0001827
        artikel: '509'
      - id: ref3
        bwb_id: BWBR0001827
        artikel: '513'
      - id: ref4
        bwb_id: BWBR0001827
        artikel: '514'
      - id: ref5
        bwb_id: BWBR0001827
        artikel: '515'
      - id: ref6
        bwb_id: BWBR0001827
        artikel: '521'
  - number: '69.2'
    text: |-
      De verdeling van de opbrengst geschiedt met overeenkomstige toepassing van de
      [artikelen 551 tot en met 552 van het Nederlandse Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel551
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '551'
  - number: '70.1'
    text: |-
      De octrooihouder kan zijn octrooi handhaven jegens een ieder die, zonder daartoe gerechtigd te zijn, een der in
      [artikel 53, eerste lid][ref1], genoemde handelingen verricht.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '70.2'
    text: |-
      De houder van een octrooi verleend op grond van deze rijkswet is in zijn rechtsvordering niet ontvankelijk als
      hij niet bij dagvaarding dan wel bij conclusie van eis in reconventie als bijlage daarbij en in kort geding op de
      terechtzitting het resultaat van een door het bureau of het in het [Europees Octrooiverdrag](onbekend) bedoelde
      Europees Octrooibureau ingesteld onderzoek naar de stand van de techniek met betrekking tot het onderwerp van het
      octrooi overlegt.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.3'
    text: |-
      De rechter kan de houder van een octrooi verzoeken om een vertaling in het Nederlands van het octrooi en
      een tijdstip vaststellen wanneer deze vertaling moet zijn overgelegd. De houder van een octrooi is in zijn
      rechtsvordering niet ontvankelijk als hij op dit tijdstip de vertaling niet heeft overgelegd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.4'
    text: |-
      Schadevergoeding kan slechts worden gevorderd van hem, die wist of redelijkerwijs behoorde te weten dat zijn
      handelingen inbreuk maken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.5'
    text: |-
      Naast schadevergoeding kan worden gevorderd, dat de gedaagde veroordeeld wordt de door de inbreuk genoten winst
      af te dragen en dienaangaande rekening en verantwoording af te leggen; indien de rechter evenwel van oordeel
      is, dat de omstandigheden van het geval tot zulk een veroordeling geen aanleiding geven, zal hij de gedaagde tot
      schadevergoeding kunnen veroordelen. In passende gevallen kan de rechter de schadevergoeding vaststellen als een
      forfaitair bedrag.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.6'
    text: |-
      De octrooihouder kan de vorderingen tot schadevergoeding of het afdragen van winst ook namens of mede namens
      licentienemers of pandhouders instellen, onverminderd de bevoegdheid van deze laatsten in een al of niet namens
      hen of mede namens hen door de octrooihouder aldus ingestelde vordering tussen te komen om rechtstreeks de door
      hen geleden schade vergoed te krijgen of zich een evenredig deel van de door de gedaagde af te dragen winst te
      doen toewijzen. Licentienemers en pandhouders kunnen slechts een zelfstandige vordering als bedoeld in het derde en
      vierde lid instellen, als zij de bevoegdheid daartoe van de octrooihouder hebben bedongen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.7'
    text: |-
      De octrooihouder heeft de bevoegdheid roerende zaken waarmee een inbreuk op zijn recht wordt gemaakt
      als zijn eigendom op te vorderen dan wel de bevoegdheid onttrekking aan het verkeer, vernietiging of
      onbruikbaarmaking te vorderen van die zaken, en onttrekking aan het verkeer te vorderen van materialen
      en werktuigen die voornamelijk zijn gebruikt bij de voortbrenging van die zaken. De bepalingen van het
      [Wetboek van Burgerlijke Rechtsvordering][ref1] betreffende beslag en executie tot afgifte van roerende zaken zijn
      van toepassing. Bij samenloop met een ander beslag gaat degene die beslag heeft gelegd krachtens dit artikel voor.
      Een vordering als bedoeld in de eerste volzin wordt op kosten van de gedaagde uitgevoerd, tenzij bijzondere redenen
      dit beletten. Bij de beoordeling van de vordering dient een afweging te worden gemaakt tussen de ernst van de
      inbreuk en de gevorderde maatregelen alsmede de belangen van derden.


      [ref1]: https://wetten.overheid.nl/BWBR0001827
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0001827
  - number: '70.8'
    text: |-
      Indien een rechtsvordering wordt ingesteld tot handhaving van een octrooi voor een werkwijze tot vervaardiging van
      een nieuw voortbrengsel, dan wordt vermoed, dat het betrokken voortbrengsel volgens de geoctrooieerde werkwijze
      is vervaardigd, tenzij door de gedaagde het tegendeel aannemelijk wordt gemaakt. Bij de beoordeling van de
      vraag of een voortbrengsel nieuw is, blijft de inhoud van in [artikel 4, derde en vierde lid][ref1], bedoelde
      octrooiaanvragen buiten beschouwing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '4'
        hoofdstuk: '1'
  - number: '70.9'
    text: |-
      De octrooihouder heeft de bevoegdheid een bevel te vorderen tot staking van diensten van tussenpersonen wier
      diensten door derden worden gebruikt om inbreuk op zijn recht te maken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.10'
    text: |-
      De octrooihouder heeft de bevoegdheid te vorderen dat degene die inbreuk op zijn recht heeft gemaakt wordt bevolen
      al hetgeen hem bekend is omtrent de herkomst en distributiekanalen van de zaken waarmee die inbreuk is gepleegd,
      aan hem mee te delen en alle daarop betrekking hebbende gegevens te verstrekken.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.11'
    text: |-
      De octrooihouder heeft de bevoegdheid te vorderen dat bij tijdelijke voortzetting van de vermeende inbreuk aan
      deze voortzetting de voorwaarde wordt verbonden dat zekerheid wordt gesteld voor vergoeding van de door hem
      geleden schade. De octrooihouder komt die bevoegdheid eveneens toe bij voortzetting van de dienstverlening door een
      tussenpersoon als bedoeld in het achtste lid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '70.12'
    text: |-
      De octrooihouder heeft de bevoegdheid te vorderen dat de gedaagde wordt gelast op diens kosten passende maatregelen
      tot verspreiding van informatie over de uitspraak te treffen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel70
  - number: '71.1'
    text: |-
      Behoudens het bepaalde in het vierde lid, kan de octrooihouder een redelijke vergoeding vorderen van hem, die in
      het tijdvak, gelegen tussen de inschrijving van de aanvrage die tot octrooi heeft geleid in het octrooiregister
      en de verlening van octrooi op die aanvrage of een daaruit ingevolge [artikel 28][ref1] afgesplitste aanvrage,
      handelingen heeft verricht als vermeld in [artikel 53, eerste lid][ref2], voor zover de octrooihouder daarvoor
      uitsluitende rechten heeft verkregen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel28
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '28'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '71.2'
    text: |-
      Behoudens het bepaalde in het vierde lid kan de octrooihouder eveneens een redelijke vergoeding vorderen van hem,
      die na de in het eerste lid bedoelde verlening van het octrooi handelingen als in dat lid bedoeld heeft verricht
      met voortbrengselen, die gedurende het aldaar genoemde tijdvak in het verkeer zijn gebracht. De octrooihouder
      kan een zelfde vergoeding vorderen van hem, die na de verlening van het octrooi ten dienste van zijn bedrijf
      voortbrengselen als bedoeld in [artikel 53, eerste lid, onder a of b][ref1], dan wel in [artikel 53a][ref2] heeft
      gebruikt die in het eerste lid genoemde tijdvak in zijn bedrijf zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '71.3'
    text: |-
      De in het eerste en tweede lid bedoelde vergoeding is alleen verschuldigd voor handelingen die zijn verricht
      na verloop van dertig dagen nadat de betrokkene bij deurwaardersexploit, waarin nauwkeurig is aangegeven welk
      gedeelte van de octrooiaanvrage op die handelingen betrekking heeft, is gewezen op het krachtens dit artikel aan de
      octrooihouder toekomende recht.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel71
  - number: '71.4'
    text: |-
      Het krachtens dit artikel aan de octrooihouder toekomende recht strekt zich niet uit over handelingen, verricht
      door een daartoe krachtens [artikel 55][ref1] of krachtens overeenkomst gerechtigde, alsmede handelingen met
      voortbrengselen, die hetzij voor de inschrijving in het octrooiregister van de betrokken octrooiaanvrage in het
      verkeer zijn gebracht, hetzij nadien door de aanvrager om octrooi of een gerechtigde als hiervoor bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel55
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '72.1'
    text: |-
      De houder van een Europees octrooi kan, behoudens het bepaalde in het vierde lid, een redelijke vergoeding
      vorderen van hem, die in het tijdvak, gelegen tussen de publikatie overeenkomstig [artikel 93 van het Europees
      Octrooiverdrag](onbekend) van de aanvrage die tot octrooi heeft geleid en de in [artikel 97, vierde lid, van dat
      verdrag](onbekend) bedoelde publikatie van de vermelding van de verlening van het Europees octrooi op die aanvrage
      of op een daaruit ingevolge [artikel 76 van dit verdrag](onbekend) afgesplitste aanvrage, handelingen heeft
      verricht als vermeld in [artikel 53, eerste lid][ref1], voor zover de octrooihouder daarvoor uitsluitende rechten
      heeft verkregen en de handelingen worden bestreken door de laatstelijk ingediende gepubliceerde conclusies.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '72.2'
    text: |-
      Behoudens het bepaalde in het vierde lid kan de houder van een Europees octrooi eveneens een redelijke
      vergoeding vorderen van hem, die na de in het eerste lid bedoelde publikatie van de vermelding van de
      verlening van het Europees octrooi handelingen als in dat lid bedoeld heeft verricht met voortbrengselen, die
      gedurende het aldaar genoemde tijdvak in het verkeer zijn gebracht. De octrooihouder kan een zelfde vergoeding
      vorderen van hem, die na bedoelde publikatie ten dienste van zijn bedrijf voortbrengselen als bedoeld in
      [artikel 53, eerste lid, onder a of b][ref1], dan wel in [artikel 53a][ref2] heeft gebruikt die in het in het
      eerste lid genoemde tijdvak in zijn bedrijf zijn vervaardigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '72.3'
    text: |-
      De in het eerste en tweede lid bedoelde vergoeding is alleen verschuldigd voor handelingen, die zijn verricht na
      verloop van dertig dagen, nadat de betrokkene bij deurwaardersexploit is gewezen op het krachtens dit artikel aan
      de octrooihouder toekomende recht. Bij dit deurwaardersexploit, waarin nauwkeurig is aangegeven welk gedeelte van
      de octrooiaanvrage op die handelingen betrekking heeft, moet zijn betekend een vertaling in het Nederlands van
      de conclusies zoals vervat in de publikatie van de Europese octrooiaanvrage overeenkomstig [artikel 93 van het
      Europees Octrooiverdrag](onbekend). Indien een Nederlandse vertaling als hiervoor bedoeld reeds voor het uitbrengen
      van het deurwaardersexploit aan het bureau is toegezonden en daarvan aantekening gedaan is in het octrooiregister,
      kan de betekening van de vertaling achterwege blijven, mits in het exploit melding wordt gemaakt van de aantekening
      in het octrooiregister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel72
  - number: '72.4'
    text: |-
      Het krachtens dit artikel aan de octrooihouder toekomende recht strekt zich niet uit over handelingen, verricht
      door een daartoe krachtens [artikel 55][ref1] of krachtens overeenkomst gerechtigde, alsmede handelingen met
      voortbrengselen, die hetzij voor de in het eerste lid bedoelde publikatie van de aanvrage overeenkomstig [artikel
      93 van het Europees Octrooiverdrag](onbekend) in het verkeer zijn gebracht, hetzij nadien door de aanvrager van het
      octrooi of een gerechtigde als hiervoor bedoeld.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel55
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel72
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '72.5'
    text: Het bureau gaat zo spoedig mogelijk over tot de in het derde lid bedoelde aantekening in het octrooiregister.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel72
  - number: '73.1'
    text: |-
      De octrooihouder kan de vorderingen die hem ten dienste staan bij de handhaving van zijn octrooi instellen
      tegen iedere persoon, die in Nederland, Curaçao of Sint Maarten in of voor zijn bedrijf middelen betreffende een
      wezenlijk bestanddeel van de uitvinding aan anderen dan hen, die krachtens de [artikelen 55 tot en met 60][ref1]
      tot toepassing van de geoctrooieerde uitvinding bevoegd zijn, aanbiedt of levert voor de toepassing van de
      geoctrooieerde uitvinding in Nederland, Curaçao of Sint Maarten, een en ander mits die persoon weet dan wel het
      gezien de omstandigheden duidelijk is, dat die middelen voor die toepassing geschikt en bestemd zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel55
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '73.2'
    text: |-
      Het eerste lid geldt niet, indien het aanbieden of leveren geschiedt met toestemming van de octrooihouder. Dat lid
      geldt evenmin, indien de geleverde of aangeboden middelen algemeen in de handel verkrijgbare produkten zijn, tenzij
      de betrokkene degene aan wie hij levert aanzet tot het verrichten van in [artikel 53, eerste lid][ref1], vermelde
      handelingen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '73.3'
    text: |-
      [Artikel 70, vijfde lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel70
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel73
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '74'
    text: |-
      De rechten en verplichtingen, voortvloeiende uit de [artikelen 53 tot en met 60][ref1] en [64 tot en met 73][ref2],
      gelden mede in, op en boven dat deel van het aan Nederland, Curaçao of Sint Maarten grenzende continentaal plat,
      waarop het Koninkrijk soevereine rechten heeft, doch uitsluitend voor zover het betreft handelingen, gericht op en
      verricht tijdens het onderzoek naar de aanwezigheid van natuurlijke rijkdommen of het winnen daarvan.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel64
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '64'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '75.1'
    text: 'Een octrooi wordt door de rechter vernietigd voor zover:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: 75.1.a
    text: |-
      hetgeen waarvoor octrooi is verleend ingevolge de [artikelen 2 tot en met 7][ref1] niet vatbaar is voor octrooi dan
      wel, indien het een Europees octrooi betreft, het octrooi ingevolge de [artikelen 52 tot en met 57 van het Europees
      Octrooiverdrag](onbekend) niet had behoren te worden verleend;


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel2
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '2'
        hoofdstuk: '1'
  - number: 75.1.b
    text: |-
      het octrooischrift niet een beschrijving bevat van de uitvinding, die, in voorkomend geval met toepassing van
      [artikel 25, tweede en derde lid][ref1], zodanig duidelijk en volledig is dat een deskundige deze uitvinding kan
      toepassen;


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel25
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '25'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 75.1.c
    text: |-
      het onderwerp van het octrooi niet wordt gedekt door de inhoud van de ingediende aanvrage of, indien het octrooi is
      verleend op een afgesplitste of gewijzigde aanvrage dan wel op een nieuwe Europese octrooiaanvrage die is ingediend
      overeenkomstig [artikel 61 van het Europees Octrooiverdrag](onbekend), door de inhoud van de oorspronkelijke
      aanvrage;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: 75.1.d
    text: na octrooiverlening uitbreiding van de beschermingsomvang is opgetreden;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: 75.1.e
    text: |-
      de houder van het octrooi daarop geen aanspraak had hetzij krachtens de bepalingen van [hoofdstuk 1][ref1] van
      deze rijkswet hetzij, indien het een Europees octrooi betreft, krachtens [artikel 60, eerste lid, van het Europees
      Octrooiverdrag](onbekend).


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Hoofdstuk1
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        hoofdstuk: '1'
  - number: '75.2'
    text: |-
      Voor de toepassing van het eerste lid, onder *a*, wordt onder de stand van de techniek, bedoeld in [artikel 54,
      derde lid, van het Europees Octrooiverdrag](onbekend), mede begrepen de inhoud van uit hoofde van deze rijkswet
      ingediende octrooiaanvragen, waarvan de dag van indiening voor de datum van indiening van de desbetreffende
      Europese octrooiaanvrage, die voor de toepassing van dat lid geldt, ligt, en die eerst op of na die datum
      overeenkomstig [artikel 31][ref1] zijn ingeschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel31
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '31'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '75.3'
    text: |-
      De rechtsvordering tot vernietiging komt in de in het eerste lid, onder *a* tot en met *d*, genoemde gevallen
      toe aan een ieder en in het eerste lid, onder *e*, genoemde geval aan degene, die krachtens de in dat onderdeel
      genoemde bepalingen aanspraak op het octrooi heeft. Indien laatstgenoemde zelf een octrooi voor de desbetreffende
      uitvinding heeft verkregen, komt de rechtsvordering tot vernietiging ook toe aan licentiehouders en pandhouders.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: '75.4'
    text: |-
      De dagvaarding moet binnen acht dagen na haar dagtekening in het octrooiregister worden ingeschreven. Bij gebreke
      van tijdige inschrijving is de eiser verplicht de schade te vergoeden, geleden door hen, die te goeder trouw na die
      termijn en voor de inschrijving rechten, waarop de vernietiging invloed uitoefent, hebben verkregen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: '75.5'
    text: |-
      Een octrooi wordt geacht van de aanvang af geheel of gedeeltelijk niet de in de[ artikelen 53][ref1], [53a][ref2],
      [71][ref3], [72][ref4] en [73][ref5] bedoelde rechtsgevolgen te hebben gehad naar gelang het octrooi geheel of
      gedeeltelijk is vernietigd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0007118#Artikel73
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: '75.6'
    text: 'De terugwerkende kracht van de nietigheid heeft geen invloed op:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: 75.6.a
    text: |-
      een beslissing, niet zijnde een voorlopige voorziening, ter zake van handelingen in strijd met het in de
      [artikelen 53][ref1] en [53a][ref2] bedoelde uitsluitend recht van de octrooihouder of van handelingen als bedoeld
      in de [artikelen 71][ref3], [72][ref4] en [73][ref5], die voor de vernietiging in kracht van gewijsde is gegaan en
      ten uitvoer is gelegd;


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel72
      [ref5]: https://wetten.overheid.nl/BWBR0007118#Artikel73
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref5
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 75.6.b
    text: |-
      een voor de vernietiging gesloten overeenkomst, voor zover deze voor de vernietiging is uitgevoerd; uit
      billijkheidsoverwegingen kan echter terugbetaling worden geëist van op grond van deze overeenkomst betaalde
      bedragen in de mate als door de omstandigheden gerechtvaardigd is.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: '75.7'
    text: |-
      Voor de toepassing van het zesde lid, onder *b*, wordt onder het sluiten van een overeenkomst mede verstaan het
      ontstaan van een licentie op een andere in [artikel 56, tweede lid][ref1], [59][ref2] of [60][ref3] aangegeven
      wijze.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel60
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '75.8'
    text: |-
      Ingeval een octrooi wordt vernietigd op grond van het eerste lid, onder *e*, en degene, die krachtens de in dat
      onderdeel genoemde bepalingen aanspraak op het octrooi heeft, zelf een octrooi voor de desbetreffende uitvinding
      heeft verkregen, worden licenties, die te goeder trouw van het vernietigde octrooi waren verkregen voor de
      inschrijving van de dagvaarding in het octrooiregister, aangemerkt als licentie van het bestaande octrooi,
      en verkrijgt de houder daarvan overeenkomstig [artikel 56, derde lid][ref1], recht op de voor de licenties
      verschuldigde vergoeding. De houder van het vernietigde octrooi, die bij zijn aanvrage te goeder trouw was of
      die het octrooi voor de inschrijving van de dagvaarding te goeder trouw van een vroegere houder verkreeg, blijft
      in dat geval ten aanzien van het bestaande octrooi bevoegd tot toepassing van de uitvinding overeenkomstig
      [artikel 55][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel55
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '75.9'
    text: |-
      Zodra een eindbeslissing aangaande een vordering tot vernietiging in kracht van gewijsde is gegaan of de instantie
      is vervallen, wordt daarvan op verzoek van de meest gerede partij in het octrooiregister aantekening gedaan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel75
  - number: '76.1'
    text: |-
      Degene die een rechtsvordering als bedoeld in [artikel 75][ref1] tot vernietiging van een krachtens deze rijkswet
      verleend octrooi instelt, is in die vordering niet ontvankelijk als hij niet als bijlage bij dagvaarding dan
      wel bij conclusie van eis in reconventie het resultaat van een door het bureau uitgebracht advies omtrent de
      toepasselijkheid van de in [artikel 75, eerste lid][ref2], genoemde nietigheidsgronden overlegt.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '76.2'
    text: |-
      In kort geding kan de voorzieningenrechter bedoeld in [artikel 80, tweede lid][ref1], degene die stelt dat een
      krachtens deze rijkswet verleend octrooi vernietigd behoort te worden, opdragen een advies van het bureau omtrent
      de toepasselijkheid van de in [artikel 75, eerste lid][ref2], genoemde nietigheidsgronden over te leggen.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '80'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '77.1'
    text: |-
      Voor zover een uit hoofde van deze rijkswet verleend octrooi betrekking heeft op een uitvinding, waarvoor aan
      dezelfde uitvinder of zijn rechtverkrijgende een Europees octrooi is verleend, terwijl de dag van indiening of
      in voorkomend geval de voorrangsdatum van de onderscheidene aanvragen om octrooi dezelfde is, heeft eerstbedoeld
      octrooi, voor zover het dezelfde uitvinding beschermt als het Europees octrooi, in Nederland, Curaçao en Sint
      Maarten, niet meer de in de [artikelen 53][ref1], [53a][ref2], [71][ref3] en [73][ref4] bedoelde rechtsgevolgen
      vanaf de dag waarop:


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel53a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel71
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel73
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 53a
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 77.1.a
    text: |-
      de voor het instellen van oppositie tegen het Europees octrooi vastgestelde termijn is verstreken zonder dat
      oppositie is ingesteld;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel77
  - number: 77.1.b
    text: de oppositieprocedure is afgesloten, waarbij het Europees octrooi in stand is gebleven;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel77
  - number: 77.1.c
    text: |-
      het octrooi uit hoofde van deze rijkswet is verleend, indien deze dag ligt na die onder a of b bedoeld, al naar
      het geval.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel77
  - number: '77.2'
    text: |-
      Het tenietgaan, op welke wijze ook, van het Europees octrooi op een later tijdstip laat het bepaalde in het vorige
      lid onverlet.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel77
  - number: '77.3'
    text: |-
      Vorderingen ter vaststelling van een in het eerste lid bedoeld verlies van rechtsgevolg kunnen door een ieder
      worden ingesteld.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel77
  - number: '77.4'
    text: |-
      [Artikel 75, vierde lid, achtste lid, eerste volzin, en negende lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '78.1'
    text: |-
      Een octrooi kan geheel, gedeeltelijk of wat betreft een aandeel daarin worden opgeëist door degene die krachtens
      [artikel 11][ref1], [12][ref2] of [13][ref3] dan wel, indien het een Europees octrooi betreft, krachtens artikel
      60, eerste lid, van het Europees Octrooiverdrag aanspraak of mede aanspraak heeft op dat octrooi.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel13
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '11'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '12'
        hoofdstuk: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '13'
        hoofdstuk: '1'
  - number: '78.2'
    text: De dagvaarding moet in het octrooiregister worden ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
  - number: '78.3'
    text: |-
      De octrooihouder, die bij zijn aanvrage te goeder trouw was, of die het octrooi voor de inschrijving van de
      dagvaarding te goeder trouw van een vroegere houder verkreeg, blijft ten aanzien van de nieuwe octrooihouder
      bevoegd tot toepassing van de uitvinding op de voet als omschreven in [artikel 55][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel55
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '55'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '78.4'
    text: |-
      Te goeder trouw voor de inschrijving verkregen licenties blijven geldig tegenover de nieuwe octrooihouder, die
      overeenkomstig [artikel 56, derde lid][ref1], recht verkrijgt op de voor de licenties verschuldigde vergoeding.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel56
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '56'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '78.5'
    text: |-
      Het derde en het vierde lid zijn niet van toepassing ingeval degene, die het octrooi met goed gevolg heeft
      opgeëist, reeds door zelf octrooi aan te vragen zijn aanspraken had doen gelden en de dagvaarding, waarbij de
      vordering tot opeising werd ingesteld, binnen drie maanden na de verlening van het octrooi of, indien het een
      Europees octrooi betreft, na de publikatie overeenkomstig artikel 97, vierde lid, van het Europees Octrooiverdrag
      van de vermelding van de verlening van het Europees octrooi in het octrooiregister was ingeschreven.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
  - number: '78.6'
    text: |-
      Pandrechten, door een vroegere octrooihouder gevestigd, zijn alleen geldig tegenover de nieuwe octrooihouder,
      indien zij te goeder trouw zijn verkregen en voor de inschrijving van de dagvaarding gevestigd. Zij zijn nimmer
      tegenover deze geldig in het geval, bedoeld in het vorige lid.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
  - number: '78.7'
    text: |-
      De vordering, bedoeld in het eerste lid, verjaart, wanneer vijf jaren zijn verstreken na de dag van verlening van
      het octrooi of, indien het een Europees octrooi betreft, na de datum, waarop overeenkomstig artikel 97, vierde lid,
      van het Europees Octrooiverdrag de vermelding van de verlening van het Europees octrooi is gepubliceerd; nochtans
      kan degene, die bij het verkrijgen van het octrooi wist of had moeten weten, dat hij of de persoon, die het hem
      overdroeg, geen aanspraak had op het octrooi, zich niet op deze verjaring beroepen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
  - number: '78.8'
    text: |-
      Zodra een eindbeslissing aangaande een vordering tot opeising in kracht van gewijsde is gegaan of de instantie is
      vervallen, wordt daarvan op verzoek van de meest gerede partij in het octrooiregister aantekening gedaan.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel78
  - number: '79.1'
    text: |-
      Hij die opzettelijk inbreuk maakt op het recht van de octrooihouder door het verrichten van een der in
      [artikel 53, eerste lid][ref1], bedoelde handelingen, wordt gestraft met gevangenisstraf van ten hoogste zes
      maanden of geldboete van de vierde categorie.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel53
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '53'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '79.2'
    text: |-
      Hij die van het plegen van het in het vorige lid bedoelde misdrijf zijn beroep maakt of het plegen van dit misdrijf
      als bedrijf uitoefent, wordt gestraft met gevangenisstraf van ten hoogste vier jaar of geldboete van de vijfde
      categorie.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel79
  - number: '79.3'
    text: Bij veroordeling kan door de rechter de openbaarmaking van zijn uitspraak worden gelast.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel79
  - number: '79.4'
    text: |-
      Indien voorwerpen verbeurd zijn verklaard, kan de octrooihouder vorderen, dat die voorwerpen hem worden afgegeven
      indien hij zich daartoe ter griffie aanmeldt binnen een maand nadat het vonnis in kracht van gewijsde is gegaan.
      Door deze afgifte gaat de eigendom van de voorwerpen op de octrooihouder over. De rechter zal kunnen gelasten, dat
      die afgifte niet zal geschieden dan tegen een door hem bepaalde, door de octrooihouder te betalen vergoeding, welke
      ten bate komt van de Staat.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel79
  - number: '79.5'
    text: |-
      De in dit artikel bedoelde strafbare feiten zijn misdrijven. Van deze misdrijven neemt in Nederland in eerste
      aanleg uitsluitend de rechtbank Den Haag kennis.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel79
  - number: '80.1'
    text: 'De rechtbank Den Haag is in eerste aanleg uitsluitend bevoegd voor:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
  - number: 80.1.a
    text: |-
      vorderingen tot vaststelling van ontbreken van rechtsgevolg, vernietiging, vaststelling van een verlies van
      rechtsgevolg of opeising van octrooien, bedoeld in onderscheidenlijk de [artikelen 10][ref1], [75][ref2],
      [77][ref3] en [78][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel78
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '10'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '77'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '78'
        hoofdstuk: '5'
  - number: 80.1.b
    text: vorderingen tot opeising van Europese octrooiaanvragen;
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
  - number: 80.1.c
    text: |-
      vorderingen tot verlening van een licentie als bedoeld in [artikel 58, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel58
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: 80.1.d
    text: |-
      vorderingen tot vaststelling van een vergoeding als bedoeld in de [artikelen 58][ref1], [59][ref2] en [60][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel58
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel59
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel60
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '58'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '59'
        hoofdstuk: '4'
        paragraaf: '1'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '60'
        hoofdstuk: '4'
        paragraaf: '1'
  - number: '80.2'
    text: |-
      De rechtbank Den Haag en de voorzieningenrechter van die rechtbank zijn in eerste aanleg in Nederland uitsluitend
      bevoegd voor:
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
  - number: 80.2.a
    text: |-
      vorderingen, bedoeld in de [artikelen 70][ref1], [71][ref2], [72][ref3] en [73][ref4];


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel70
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel71
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel72
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel73
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '70'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '71'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '72'
        hoofdstuk: '4'
        paragraaf: '4'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '73'
        hoofdstuk: '4'
        paragraaf: '4'
  - number: 80.2.b
    text: |-
      vorderingen welke worden ingesteld door een ander dan de octrooihouder ten einde te doen vaststellen dat bepaalde
      door hem verrichte handelingen niet strijdig zijn met een octrooi.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel80
  - number: '81'
    text: |-
      In afwijking van [artikel 8:7 van de Algemene wet bestuursrecht](onbekend), is voor beroepen ingesteld tegen
      besluiten op grond van deze wet de rechtbank Den Haag bevoegd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel81
  - number: '82'
    text: |-
      Bij de behandeling ter zitting van geschillen bedoeld in [artikel 80][ref1] mogen octrooigemachtigden het woord
      voeren onverminderd de verantwoordelijkheid van de advocaat.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel80
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '80'
        hoofdstuk: '6'
  - number: '83.1'
    text: |-
      Van alle andere geschillen dan in de [artikelen 80][ref1] en [81][ref2] bedoeld wordt kennis genomen door de
      rechter die daartoe volgens de algemene regeling der rechtspraak bevoegd is.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel81
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '80'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '81'
        hoofdstuk: '6'
  - number: '83.2'
    text: |-
      Rechtsvorderingen, die gegrond zijn op [artikel 12, zesde lid][ref1], worden aangemerkt als rechtsvorderingen met
      betrekking tot een arbeidsovereenkomst, tenzij de rechtsbetrekking tussen de bij het geschil betrokkenen niet wordt
      bepaald door een arbeidsovereenkomst.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel12
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '12'
        hoofdstuk: '1'
  - number: '83.3'
    text: |-
      Indien de rechter meent, dat op de beslissing van een geschil van invloed kan zijn een rechtsvordering, die op
      grond van [artikel 10][ref1], [75][ref2], [77][ref3] of [78][ref4] is of zou kunnen worden ingesteld, kan hij de
      behandeling van het aanhangige geschil met of zonder tijdsbepaling schorsen. Gelijke bevoegdheid bezit hij, indien
      op de beslissing inzake zulk een rechtsvordering een uit anderen hoofde ingestelde rechtsvordering van invloed
      kan zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel77
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel78
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '10'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: '77'
        hoofdstuk: '5'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: '78'
        hoofdstuk: '5'
  - number: '83.4'
    text: |-
      De rechter kan de behandeling van een geschil ter zake van een Europees octrooi met of zonder tijdsbepaling
      schorsen, indien bij het Europees Octrooibureau tegen dat octrooi oppositie is ingesteld ingevolge [artikel 99 van
      het Europees Octrooiverdrag](onbekend).
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel83
  - number: '84.1'
    text: |-
      Een ieder kan het bureau schriftelijk verzoeken een advies uit te brengen omtrent de toepasselijkheid van de in
      [artikel 75, eerste lid][ref1], genoemde nietigheidsgronden op een krachtens deze rijkswet verleend octrooi.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '84.2'
    text: |-
      Het verzoek bevat een gemotiveerde aanduiding van de aan [artikel 75, eerste lid][ref1], ontleende bezwaren tegen
      het verleende octrooi waaromtrent een advies wordt verlangd.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel75
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel84
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '75'
        hoofdstuk: '5'
  - number: '84.3'
    text: |-
      Bij of krachtens algemene maatregel van rijksbestuur worden regels gesteld met betrekking tot de voor het advies
      verschuldigde vergoeding.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel84
  - number: '85.1'
    text: |-
      Het bureau stelt de in [artikel 84][ref1] bedoelde verzoeker in de gelegenheid de geopperde bezwaren toe te
      lichten. Het bureau kan nietigheidsgronden die het baseert op het resultaat van het onderzoek naar de stand van de
      techniek als bedoeld in [artikel 34, vierde lid][ref2], als bezwaren toevoegen. De houder van het desbetreffende
      octrooi wordt ten minste eenmaal in de gelegenheid gesteld op de bezwaren te reageren.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel34
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '84'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '34'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '85.2'
    text: Het bureau is bevoegd voor de inbreng van verzoeker en octrooihouder termijnen te stellen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel85
  - number: '85.3'
    text: |-
      Het in [artikel 84][ref1] bedoelde advies wordt zo spoedig mogelijk uitgebracht, doch uiterlijk binnen twee maanden
      nadat het bureau kennis heeft genomen van het standpunt van de verzoeker en de octrooihouder of, indien toepassing
      is gegeven aan het vorige lid, binnen twee maanden nadat de gestelde termijn is verstreken.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel84
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel85
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '84'
        hoofdstuk: '6'
  - number: '86'
    text: |-
      Het in [artikel 84][ref1] bedoelde advies bestaat uit een gemotiveerde beoordeling van de in
      [artikel 85, eerste lid][ref2], genoemde bezwaren.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel85
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel86
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '84'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '85'
        hoofdstuk: '6'
  - number: '87.1'
    text: |-
      Het bureau is verplicht de rechter alle inlichtingen en technische adviezen te verstrekken, die deze tot beslissing
      van aan zijn oordeel onderworpen rechtsvorderingen inzake octrooien mocht verlangen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel87
  - number: '87.2'
    text: |-
      De waarde van adviezen als bedoeld in het eerste lid wordt gelijkgesteld met die van deskundigen als bedoeld in
      [artikel 194 en volgende van het Wetboek van Burgerlijke Rechtsvordering][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0001827#Artikel194
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel87
    references:
      - id: ref1
        bwb_id: BWBR0001827
        artikel: '194'
  - number: '88'
    text: |-
      De in [artikel 80][ref1] bedoelde rechtbank treedt op als centrale instantie, belast met het ontvangen van
      rogatoire commissies en bevoegd tot het uitvoeren van genoemde commissies van het Europees Octrooibureau, bedoeld
      in regel 99 van het bij het Europees Octrooiverdrag behorende Uitvoeringsreglement.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel80
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel88
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '80'
        hoofdstuk: '6'
  - number: '89'
    text: |-
      Van alle rechterlijke uitspraken betreffende octrooien wordt door de griffier van het desbetreffende gerecht binnen
      één maand kosteloos een afschrift aan het bureau gezonden, en, indien het een Europees octrooi betreft, tevens aan
      het Europees Octrooibureau, bedoeld in het [Europees Octrooiverdrag](onbekend).
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel89
  - number: '90'
    text: |-
      Voor de toepassing van dit hoofdstuk, met uitzondering van [artikel 98][ref1], en de daarop berustende bepalingen,
      wordt verstaan onder: verordening: de [verordening (EEG) nr. 1768/92](31992R1768) van de Raad van de Europese
      Gemeenschappen van 18 juni 1992 betreffende de invoering van een aanvullende beschermingscertificaat voor
      geneesmiddelen (*PbEG* L 182), zoals deze laatstelijk is gewijzigd bij verordening (EG) nr. 1901/2006 van het
      Europees Parlement en de Raad van de Europese Unie van 12 december 2006 betreffende geneesmiddelen voor pediatrisch
      gebruik en tot wijziging van Verordening (EEG) nr. 1768/92, Richtlijn 2001/20/EG, Richtlijn 2001/83/EG en
      Verordening (EG) nr. 726/2004 (PbEG L 378); basisoctrooi: een octrooi als bedoeld in artikel 1, onder *c*, van
      de verordening; certificaat: een aanvullend beschermingscertificaat als bedoeld in artikel 1, onder *d*, van de
      verordening; aanvrage om verlenging van de duur van een certificaat: een aanvraag om verlenging van de duur van een
      reeds verleend certificaat als bedoeld in artikel 1, onder e, van de verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel98
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel90
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '98'
        hoofdstuk: '7'
  - number: '91'
    text: De aanvrage om een certificaat en om verlenging van de duur van een certificaat worden bij het bureau ingediend.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel91
  - number: '92'
    text: |-
      Bij de aanvrage om een certificaat en om verlenging van de duur van een certificaat dient een bewijsstuk te worden
      overgelegd waaruit blijkt dat aan het bureau een bedrag is betaald overeenkomstig een bij of krachtens algemene
      maatregel van bestuur vastgesteld tarief.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel92
  - number: '93'
    text: |-
      Met betrekking tot aanvragen om een certificaat en om verlenging van de duur van een certificaat zijn de
      [artikelen 24, derde lid][ref1], en [38, eerste lid][ref2], van deze rijkswet van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel38
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel93
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '38'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '94'
    text: |-
      Indien niet is voldaan aan het bij artikel 8 van de verordening of het bij de [artikelen 92][ref1] en [93][ref2]
      van deze rijkswet bepaalde, geeft het bureau daarvan binnen twee maanden na de datum van indiening van de aanvraag
      om een certificaat dan wel om verlenging van de duur van een certificaat schriftelijk kennis aan de aanvrager,
      onder opgave van de voorschriften waaraan niet is voldaan.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel92
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel93
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel94
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '92'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '93'
        hoofdstuk: '7'
  - number: '95'
    text: |-
      Voor de instandhouding van een aanvullend beschermingscertificaat moet elk jaar, voor het eerst vanaf het jaar
      waarin de wettelijke duur van het basisoctrooi is verstreken, aan het bureau een bij of krachtens algemene
      maatregel van bestuur vast te stellen bedrag worden betaald. Dit bedrag wordt uiterlijk voldaan op de laatste dag
      van de maand waarin de wettelijke duur van het basisoctrooi is verstreken. De [artikelen 61, derde lid][ref1], en
      [62][ref2] van deze rijkswet zijn van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel61
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel62
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel95
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '61'
        hoofdstuk: '4'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '62'
        hoofdstuk: '4'
        paragraaf: '2'
  - number: '96.1'
    text: |-
      De in de artikelen 9, tweede en derde lid, 11 en 16 van de verordening voorgeschreven mededelingen geschieden in
      het in[ artikel 20][ref1] van deze rijkswet bedoelde blad.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel20
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel96
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '20'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '96.2'
    text: |-
      Het bureau schrijft de in de artikelen 9, tweede en derde lid, 11 en 16 van de verordening bedoelde gegevens in het
      octrooiregister in.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel96
  - number: '97'
    text: |-
      De [artikelen 64 tot en met 69][ref1] zijn van overeenkomstige toepassing op certificaten.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel64
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel97
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '64'
        hoofdstuk: '4'
        paragraaf: '3'
  - number: '98'
    text: |-
      Indien een andere dan de in [artikel 90][ref1] genoemde door de Raad van de Europese Gemeenschappen vastgestelde
      verordening betreffende aanvullende beschermingscertificaten in het belang van een goede uitvoering nadere regeling
      behoeft geschiedt dit bij algemene maatregel van bestuur. Daarbij kan worden voorzien in het opleggen van taksen,
      voor zover dat is toegelaten ingevolge de betrokken verordening.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel90
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel98
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '90'
        hoofdstuk: '7'
  - number: '99'
    text: |-
      In Curaçao of Sint Maarten kan een bureau voor de industriële eigendom worden ingesteld. Dit bureau is een
      instelling van het betrokken land of de betrokken landen.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel99
  - number: '100.1'
    text: |-
      De aanvragen om octrooi van inwonenden van Curaçao of Sint Maarten kunnen worden ingediend bij het aldaar
      ingestelde bureau voor de industriële eigendom.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel100
  - number: '100.2'
    text: |-
      Als datum van indiening van de aanvrage geldt die, waarop bij het betrokken bureau
      de in [artikel 29, eerste lid, onder a, b en c][ref1], vermelde bescheiden zijn
      overgelegd.[ Artikel 29, tweede en derde lid][ref2], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel29
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '29'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '100.3'
    text: |-
      Nadat het betrokken bureau de in het tweede lid bedoelde datum op de aanvrage heeft vermeld, zendt het de aanvrage
      met alle overgelegde bescheiden zo spoedig mogelijk door aan het bureau, bedoeld in [artikel 1][ref1], tenzij het
      meent dat deze bescheiden niet voldoen aan het bij of krachtens [artikel 24][ref2] bepaalde.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel1
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel24
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '1'
        hoofdstuk: '1'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '24'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: '100.4'
    text: |-
      In het geval, bedoeld in het derde lid, geeft het betrokken bureau aan de aanvrager schriftelijk kennis van de
      vermeende gebreken, met het verzoek deze binnen een door het bureau te bepalen termijn te herstellen. Na het
      verstrijken van die termijn worden, onverschillig of aan het verzoek is voldaan, de door de aanvrager overgelegde
      bescheiden, alsmede een afschrift van het hem afgegeven ontvangstbewijs door het betrokken bureau zo spoedig
      mogelijk aan het bureau, bedoeld in [artikel 1][ref1], toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel1
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel100
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '1'
        hoofdstuk: '1'
  - number: '101'
    text: |-
      De [Rijksoctrooiwet][ref1] vervalt met ingang van een bij koninklijk besluit te bepalen tijdstip.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel101
    references:
      - id: ref1
        bwb_id: BWBR0001879
  - number: '102.1'
    text: |-
      Ten aanzien van octrooiaanvragen die zijn ingediend voor 1 april 1995 en van deze aanvragen afgesplitste
      octrooiaanvragen zijn de [Rijksoctrooiwet][ref1] en de [artikelen 102a tot en met 102e][ref2] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0001879
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 102a
        hoofdstuk: '9'
  - number: '102.2'
    text: 'Ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102
  - number: 102.2.a
    text: |-
      octrooiaanvragen, ingediend na de inwerkingtreding van deze rijkswet, met uitzondering van de in het eerste lid
      bedoelde afgesplitste octrooiaanvragen,
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102
  - number: 102.2.b
    text: octrooien, verleend op de onder *a* bedoelde octrooiaanvragen en
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102
  - number: 102.2.c
    text: |-
      licenties onder de onder *b* bedoelde octrooien is uitsluitend het bij en krachtens deze rijkswet bepaalde van
      toepassing.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102
  - number: '102.3'
    text: |-
      Deze rijkswet is niet van toepassing op aanvragen om een certificaat als bedoeld in [artikel 90][ref1] welke bij de
      Octrooiraad zijn ingediend voor de datum van inwerkingtreding van deze rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel90
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '90'
        hoofdstuk: '7'
  - number: '102.4'
    text: |-
      De [artikelen 95][ref1] en [97][ref2] zijn mede van toepassing op certificaten welke zijn verleend op aanvragen
      welke zijn ingediend voor de datum van inwerkingtreding van deze rijkswet.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel95
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel97
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '95'
        hoofdstuk: '7'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '97'
        hoofdstuk: '7'
  - number: 102a.1
    text: |-
      Op octrooiaanvragen ten aanzien waarvan het resultaat van het onderzoek naar de stand van de techniek aan de
      aanvrager is meegedeeld, maar de aanvraagafdeling van de Octrooiraad op de datum van inwerkingtreding van dit
      artikel nog geen besluit heeft genomen als bedoeld in [artikel 24 van de Rijksoctrooiwet][ref1], verleent de
      Octrooiraad in afwijking van [Hoofdstuk II, Afdeling II, van de die Rijkswet][ref2] octrooi door het plaatsen van
      een gedateerde aantekening op de aanvrage in de vorm zoals deze door de aanvrager is ingediend of door hem nadien
      is gewijzigd.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel24
      [ref2]: https://wetten.overheid.nl/BWBR0001879#AfdelingII
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102a
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '24'
      - id: ref2
        bwb_id: BWBR0001879
        afdeling: II
  - number: 102a.2
    text: |-
      Indien op de datum van inwerkingtreding van dit artikel het resultaat van het onderzoek naar de stand van de
      techniek nog niet aan de aanvrager is meegedeeld, wordt het octrooi verleend met ingang van twee maanden na de
      datum waarop het resultaat van het onderzoek van de stand van de techniek is meegedeeld aan de aanvrager, welke
      termijn op verzoek van de aanvrager door de Octrooiraad eenmaal met twee maanden kan worden verlengd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102a
  - number: 102b.1
    text: |-
      In afwijking van [Hoofdstuk II, Afdeling II, van de die Rijkswet][ref1] verleent de Octrooiraad octrooi op
      octrooiaanvragen ten aanzien waarvan de aanvraagafdeling of de afdeling van beroep van de Octrooiraad na de
      inwerkingtreding van dit artikel op grond van [artikel 24][ref2] of [24A van die Rijkswet][ref3] besluit tot gehele
      of gedeeltelijke openbaarmaking, door het plaatsen van een gedateerde aantekening op de aanvrage in de vorm zoals
      deze door de aanvraagafdeling of de afdeling van beroep geschikt is bevonden voor verlening.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#AfdelingII
      [ref2]: https://wetten.overheid.nl/BWBR0001879#Artikel24
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel24A
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102b
    references:
      - id: ref1
        bwb_id: BWBR0001879
        afdeling: II
      - id: ref2
        bwb_id: BWBR0001879
        artikel: '24'
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 24A
  - number: 102b.2
    text: Het octrooi begint te werken met ingang van de datum van het besluit tot gehele of gedeeltelijke openbaarmaking.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102b
  - number: 102c.1
    text: |-
      Vanaf de datum van inwerkingtreding van [artikel 102a][ref1] is [artikel 102a][ref2] van overeenkomstige toepassing
      op octrooiaanvragen waarop de artikelen [29A tot en met 29F van de Rijksoctrooiwet][ref3] van toepassing zijn, met
      dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
      [ref3]: https://wetten.overheid.nl/BWBR0001879#Artikel29A
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102c
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 102a
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 102a
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0001879
        artikel: 29A
  - number: 102c.1.a
    text: |-
      de Octrooiraad besluit tot verlening van het octrooi door het plaatsen van een gedateerde aantekening op de
      aanvrage, doch dat de inschrijving van de octrooiaanvrage in het octrooiregister en de verlening van het octrooi
      worden opgeschort, en
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102c
  - number: 102c.1.b
    text: |-
      de artikelen [41 tot en met 45][ref1] op die octrooiaanvragen van overeenkomstige toepassing zijn.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel41
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102c
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '41'
        hoofdstuk: '2'
        paragraaf: '3'
  - number: 102c.2
    text: |-
      Het eerste lid is van overeenkomstige toepassing op [artikel 102b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel102b
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102c
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: 102b
        hoofdstuk: '9'
  - number: 102d.1
    text: |-
      Vanaf de datum van inwerkingtreding van dit artikel of, indien dat later is, vanaf de datum van verlening van
      het octrooi, hebben octrooien die zijn verleend op grond van de [Rijksoctrooiwet][ref1] of die worden verleend op
      grond van de [artikelen 102a][ref2], [102b][ref3] of [102c][ref4], in Nederland Curaçao en Sint Maarten dezelfde
      rechtsgevolgen als octrooien die zijn verleend op grond van [artikel 36][ref5] en zijn daarop de bepalingen van
      deze rijkswet van toepassing, met dien verstande dat:


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel102b
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel102c
      [ref5]: https://wetten.overheid.nl/BWBR0007118#Artikel36
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102d
    references:
      - id: ref1
        bwb_id: BWBR0001879
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 102a
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 102b
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: 102c
        hoofdstuk: '9'
      - id: ref5
        bwb_id: BWBR0007118
        artikel: '36'
        hoofdstuk: '2'
        paragraaf: '2'
  - number: 102d.1.a
    text: |-
      de toepassing van [artikel 76][ref1] beperkt is tot octrooien die zijn verleend op grond van [artikel 102a][ref2]
      of [102c, eerste lid][ref3], en


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel102c
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102d
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '76'
        hoofdstuk: '5'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 102a
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 102c
        hoofdstuk: '9'
  - number: 102d.1.b
    text: |-
      de toepassing van de [artikelen 84 tot en met 86][ref1] beperkt is tot octrooien die zijn verleend op grond van de
      [artikelen 102a][ref2], [102b][ref3] of [102c][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel84
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel102b
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel102c
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102d
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '84'
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 102a
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 102b
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: 102c
        hoofdstuk: '9'
  - number: 102d.2
    text: |-
      Vanaf de datum van inwerkingtreding van dit artikel of, indien dat later is, vanaf de datum van verlening van
      het octrooi, hebben octrooien die zijn verleend op grond van de [Rijksoctrooiwet][ref1] of die worden verleend op
      grond van de [artikelen 102a][ref2], [102b][ref3] of [102c][ref4], in Aruba dezelfde rechtsgevolgen als octrooien
      die zijn verleend op grond van artikel 34 van de Landsverordening van Aruba van 5 mei 1997 houdende regels met
      betrekking tot octrooien (Octrooiverordening).


      [ref1]: https://wetten.overheid.nl/BWBR0001879
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel102b
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel102c
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102d
    references:
      - id: ref1
        bwb_id: BWBR0001879
      - id: ref2
        bwb_id: BWBR0007118
        artikel: 102a
        hoofdstuk: '9'
      - id: ref3
        bwb_id: BWBR0007118
        artikel: 102b
        hoofdstuk: '9'
      - id: ref4
        bwb_id: BWBR0007118
        artikel: 102c
        hoofdstuk: '9'
  - number: 102e.1
    text: |-
      Op een verzoek tot herstel in de vorige toestand dat is ingediend na de inwerkingtreding van dit artikel, is
      [artikel 23 van de Rijksoctrooiwet 1995][ref1] van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel23
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102e
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: 102e.2
    text: |-
      Het bureau verleent op een octrooiaanvrage die na de inwerkingtreding van deze wet wordt hersteld in de vorige
      toestand, octrooi door het plaatsen van een gedateerde aantekening op de aanvrage in de vorm zoals deze door de
      aanvrager is ingediend of door hem nadien is gewijzigd.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102e
  - number: 102e.3
    text: Het octrooi begint te werken met ingang van de datum waarop het besluit tot herstel onherroepelijk is.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102e
  - number: 102f
    text: |-
      Het openbare deel van de registers die worden gehouden op grond van de Rijksoctrooiwet maakt vanaf het tijdstip,
      bedoeld in [artikel 101][ref1], deel uit van het register, bedoeld in [artikel 19][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel101
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel19
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel102f
    references:
      - id: ref1
        bwb_id: BWBR0007118
        artikel: '101'
        hoofdstuk: '9'
      - id: ref2
        bwb_id: BWBR0007118
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '1'
  - number: '103.1'
    text: |-
      Vanaf de datum van inwerkingtreding van dit artikellid is ten aanzien van Europese octrooien, waarvan de vermelding
      van de verlening overeenkomstig [artikel 97, vierde lid, van het Europees Octrooiverdrag](onbekend) is gepubliceerd
      voor de inwerkingtreding van deze rijkswet, en licenties onder deze octrooien, het bij en krachtens deze rijkswet
      bepaalde van toepassing.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel103
  - number: '103.2'
    text: |-
      Ten aanzien van Europese octrooien, waarvan de vermelding van de verlening overeenkomstig [artikel 97, vierde lid,
      van het Europees Octrooiverdrag](onbekend) is gepubliceerd na de inwerkingtreding van deze rijkswet, en licenties
      onder deze octrooien, is uitsluitend het bij en krachtens deze rijkswet bepaalde van toepassing.
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel103
  - number: '108.1'
    text: |-
      De [artikelen 57][ref1] tot en met [58a][ref2] zijn van toepassing op licenties onder octrooien die zijn verleend
      op grond van de Rijksoctrooiwet of die worden verleend op grond van de [artikelen 102a][ref3], [102b][ref4]
      of [102c][ref5].


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel57
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel58a
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel102a
      [ref4]: https://wetten.overheid.nl/BWBR0007118#Artikel102b
      [ref5]: https://wetten.overheid.nl/BWBR0007118#Artikel102c
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel108
