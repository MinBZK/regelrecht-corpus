  - number: '108.2'
    text: |-
      Indien voor de inwerkingtreding van deze rijkswet een verzoek tot verlening van een licentie overeenkomstig
      [artikel 34, vijfde lid, van de Rijksoctrooiwet][ref1] is ingediend, vindt het eerste lid geen toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0001879#Artikel34
    url: https://wetten.overheid.nl/BWBR0007118/2019-02-01#Artikel108
    references:
      - id: ref1
        bwb_id: BWBR0001879
        artikel: '34'
  - number: '109'
    text: |-
      Tot de stand van de techniek, bedoeld in de [artikelen 4][ref1] en [75, tweede lid][ref2], behoort tevens
      de inhoud van voor de inwerkingtreding van deze rijkswet ingediende octrooiaanvragen, die op of na de in
      [artikel 4, tweede lid, van deze wet][ref3] onderscheidenlijk [artikel 80 van het Europees Octrooiverdrag]
      (onbekend) bedoelde dag overeenkomstig [artikel 22C van de Rijksoctrooiwet][ref4] ter inzage worden gelegd of,
      indien terinzagelegging nog niet had plaatsgevonden, overeenkomstig [artikel 25 van die rijkswet][ref5] openbaar
      worden gemaakt.


      [ref1]: https://wetten.overheid.nl/BWBR0007118#Artikel4
      [ref2]: https://wetten.overheid.nl/BWBR0007118#Artikel75
      [ref3]: https://wetten.overheid.nl/BWBR0007118#Artikel4
      [ref4]: https://wetten.overheid.nl/BWBR0001879#Artikel22C
      [ref5]: https://wetten.overheid.nl/BWBR0001879#Artikel25
