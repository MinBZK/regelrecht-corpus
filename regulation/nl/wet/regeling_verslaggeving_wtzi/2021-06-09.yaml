preamble:
  text: |-
    Gelet op de artikelen 15en 16 van de Wet toelating zorginstellingen en hoofdstuk VII van het Uitvoeringsbesluit
    WTZi;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0019252/2021-06-09#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      a. zorginstelling: een instelling als bedoeld in
      [artikel 1.2, onder de nummers 1, 17, 18, 19 en 21, van het Uitvoeringsbesluit WTZi][ref1];

      b. jaarverslaggeving: de verslaglegging bestaande uit de jaarrekening en de overige gegevens;

      c. jaarrekening: de jaarrekening in de zin van [artikel 361 van Titel 9 Boek 2 BW][ref2];

      d. Regionale Ambulancevoorzieningen: Regionale Ambulancevoorzieningen als bedoeld in de
      [Wet ambulancezorgvoorzieningen][ref3];

      e. overige gegevens: gegevens die aan de jaarrekening dienen te worden toegevoegd op grond van
      [artikel 392 van Titel 9 Boek 2 BW][ref4];

      f. Jaarverantwoording Zorg: verantwoordingsdocument, bestaande uit de jaarverslaggeving en specifieke informatie;

      g. specifieke informatie: gegevens betreffende de organisatiestructuur, bestuursstructuur, exploitatiekosten en
      bedrijfsvoering van de zorginstelling;

      h. richtlijnen: de Richtlijnen voor de Jaarverslaggeving zoals vastgesteld door de Raad voor de Jaarverslaggeving;

      i. BW: het Burgerlijk Wetboek;

      j. dochtermaatschappij: dochtermaatschappij als bedoeld in [artikel 24a van Boek 2 BW][ref5];

      k. groep: groep als bedoeld in [artikel 24b van Boek 2 BW][ref6];

      l. groepsmaatschappij: groepsmaatschappij als bedoeld in [artikel 24b van Boek 2 BW][ref7].


