  - number: '3'
    text: |-
      In afwijking van of in aanvulling op [Titel 9 Boek 2 BW][ref1]:

      a. wordt de jaarverslaggeving ingericht overeenkomstig de richtlijnen, in het bijzonder hoofdstuk 655;

      b. wordt de jaarverslaggeving opgesteld en gepubliceerd in de Nederlandse taal en in de in Nederland wettige
      valuta;

      c. is het verslagjaar altijd gelijk aan een kalenderjaar;

      d.

      e. wordt de balans en resultatenrekening opgesteld overeenkomstig de modellen in bijlage 1 bij hoofdstuk 655
      van de richtlijnen, met dien verstande dat een zorginstelling die op twee opeenvolgende balansdata, zonder
      onderbreking nadien op twee opeenvolgende balansdata, heeft voldaan aan twee of drie van de eisen, genoemd
      in [artikel 395a, eerste lid, onderdelen a tot en met c, van Boek 2 BW][ref2], kan volstaan met een balans en
      resultatenrekening waarin ten minste de posten zijn opgenomen die zijn genoemd in [bijlage 1][ref3] bij deze
      regeling;

      f. is een zorginstelling die op twee opeenvolgende balansdata, zonder onderbreking nadien
      op twee opeenvolgende balansdata, heeft voldaan aan twee of drie van de eisen, genoemd in
      [artikel 395a, eerste lid, onderdelen a tot en met c, van Boek 2 van het Burgerlijk Wetboek][ref4], niet gehouden
      een verklaring als bedoeld in [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref5] over te
      leggen;

      g. kan een zorginstelling die op twee opeenvolgende balansdata, zonder onderbreking nadien
      op twee opeenvolgende balansdata, heeft voldaan aan twee of drie van de eisen genoemd in
      [artikel 396, eerste lid, onderdelen a tot en met c, van Boek 2 van het Burgerlijk Wetboek][ref6],
      volstaan met een beoordelingsverklaring van een accountant in plaats van een verklaring als bedoeld in
      [artikel 393, vijfde lid, van Boek 2 van het Burgerlijk Wetboek][ref7];

      h. wordt de informatie, bedoeld bij of krachtens de [artikelen 1.7][ref8] en
      [4.1, eerste en tweede lid, van de Wet normering topinkomens][ref9], opgenomen in de jaarrekening, waarbij gebruik
      wordt gemaakt van een door de Minister van Binnenlandse Zaken en Koninkrijksrelaties vast te stellen model.


