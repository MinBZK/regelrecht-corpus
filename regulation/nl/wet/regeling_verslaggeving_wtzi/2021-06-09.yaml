  - number: '2'
    text: |-
      Op de jaarverslaggeving van een zorginstelling is [Titel 9 Boek 2 BW][ref1] van overeenkomstige toepassing met
      uitzondering van de [afdelingen 1][ref2], [7][ref3], [11][ref4] en [12][ref5], een en ander voor zover in deze
      regeling niet anders is bepaald.


