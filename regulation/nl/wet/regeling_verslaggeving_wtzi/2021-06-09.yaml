  - number: '4'
    text: |-
      Het bestuur van een academisch ziekenhuis voegt aan de jaarverslaggeving financiële gegevens toe aangaande de
      besteding van de bijdrage van de Minister van Onderwijs, Cultuur en Wetenschap ten behoeve van onderwijs en
      onderzoek en kwantitatieve gegevens voor het verdeelmodel van die bijdrage.
    url: https://wetten.overheid.nl/BWBR0019252/2021-06-09#Artikel4
  - number: '6'
    text: |-
      De balans vermeldt het financieringstekort of -overschot. Dit is het aan het einde van het verslagjaar bestaande
      verschil tussen het wettelijk budget voor aanvaardbare kosten en de ontvangen voorschotten en de in rekening
      gebrachte vergoedingen voor diensten en verrichtingen ter dekking van het wettelijk budget.
    url: https://wetten.overheid.nl/BWBR0019252/2021-06-09#Artikel6
  - number: '7'
    text: |-
      1 Het bestuur van een zorginstelling die aan het hoofd staat van een groep, dan wel de besturen van de
      groepsmaatschappijen die gezamenlijk aan het hoofd staan van een groep, stelt onderscheidenlijk stellen
      gezamenlijk een geconsolideerde jaarrekening op, waarin de eigen financiële gegevens zijn opgenomen met die
      van de dochtermaatschappijen in de groep, de andere groepsmaatschappijen en andere rechtspersonen waarover de
      zorginstelling een overheersende zeggenschap kan uitoefenen of waarover zij de centrale leiding heeft.

      2 Indien een groepshoofd als bedoeld in het eerste lid ontbreekt, wijst de centrale leiding een bestuur aan dat de
      geconsolideerde jaarrekening opstelt.

      3 Een zorginstelling die deel uitmaakt van een groep maar niet, alleen of in gezamenlijkheid met een andere
      groepsmaatschappij, aan het hoofd staat van die groep, stelt een geconsolideerde jaarrekening op waarin de eigen
      financiële gegevens zijn opgenomen met die van dochtermaatschappijen in de groep, de andere groepsmaatschappijen
      en andere rechtspersonen waarover een groepslid een overheersende zeggenschap kan uitoefenen of waarover zij de
      centrale leiding heeft.

      4 De in het eerste en derde lid genoemde verplichtingen gelden niet, indien:

      a. de eigen financiële gegevens van de zorginstelling zijn opgenomen in een geconsolideerde jaarrekening van een
      andere rechtspersoon van de groep;

      b. de onder a bedoelde geconsolideerde jaarrekening voldoet aan de eisen van deze regeling of aan de eisen van
      [Titel 9 Boek 2 BW][ref1];

      c. de onder a bedoelde geconsolideerde jaarrekening overeenkomstig [artikel 9][ref2] is aangeleverd; en

      d. het bestuur van de zorginstelling in de toelichting bij de enkelvoudige jaarrekening naar de onder a bedoelde
      geconsolideerde jaarrekening verwijst.

      5 In de geconsolideerde jaarrekening van een groep hoeft de jaarrekening van binnen de groep vallende
      rechtspersonen die vallen onder de [Wet op het primair onderwijs][ref3] of de [Wet op de expertisecentra][ref4],
      dan wel die een toelating hebben op grond van de [Woningwet][ref5], niet te worden opgenomen.

      6 In de geconsolideerde jaarrekening van een groep hoeft de jaarrekening van een binnen die groep vallende
      steunstichting, zijnde een rechtspersoon die geen zorginstelling is, die haar middelen verkrijgt uit niet-
      zorggebonden gelden en die volgens haar statuten algemeen nut beoogt of specifieke activiteiten van een
      zorginstelling ondersteunt, niet te worden opgenomen. In de geconsolideerde jaarrekening wordt wel opgenomen
      de jaarrekening van een binnen de groep vallende steunstichting die een zeggenschapsrelatie heeft met of een
      kapitaaldeelname heeft in een andere rechtspersoon.


