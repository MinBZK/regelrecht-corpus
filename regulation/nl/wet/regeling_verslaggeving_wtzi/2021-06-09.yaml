  - number: 2a
    text: |-
      1 Een Regionale Ambulancevoorziening met privaatrechtelijke rechtspersoonlijkheid voldoet uitsluitend aan de
      [artikelen 1][ref1], [2][ref2], [3, onderdelen a, b, c, en h][ref3], [6][ref4], [8a][ref5], [9][ref6] en
      [10][ref7].

      2 In afwijking van het bepaalde in deze regeling dient een Regionale Ambulancevoorziening
      met publiekrechtelijke rechtspersoonlijkheid de jaarstukken in die zij ingevolge het
      [Besluit begroting en verantwoording provincies en gemeenten][ref8] moet opstellen, alsmede de specifieke
      informatie, bedoeld in [artikel 8a][ref9]. Deze jaarstukken en specifieke informatie worden aangeleverd vóór
      1 juni van het jaar volgend op het verslagjaar, waarbij de [artikelen 9, tweede lid][ref10], en [10][ref11] van
      overeenkomstige toepassing zijn. Deze aanlevering geschiedt in elektronische vorm via het elektronische platform
      DigiMV.

      3 In afwijking van het tweede lid worden de jaarstukken over de verslagjaren 2019 of 2020
      aangeleverd vóór 1 oktober 2020, respectievelijk 1 oktober 2021 en hoeven de gegevens, bedoeld in
      [artikel 4.1, eerste en tweede lid, van de Wet normering topinkomens][ref12] over dat verslagjaar niet te
      worden aangeleverd op de in het tweede lid bedoelde wijze. Laatstbedoelde gegevens worden vóór 1 oktober 2020,
      respectievelijk 1 oktober 2021 via internet openbaar gemaakt.


