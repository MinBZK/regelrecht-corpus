  - number: 8a
    text: |-
      De Jaarverantwoording Zorg bevat de specifieke informatie, bedoeld in [bijlage 2][ref1] bij deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0019252
    url: https://wetten.overheid.nl/BWBR0019252/2021-06-09#Artikel8a
    references:
      - id: ref1
        bwb_id: BWBR0019252
  - number: '9'
    text: |-
      1 Het bestuur van een zorginstelling levert de Jaarverantwoording Zorg vóór 1 juni van het jaar, volgend op het
      verslagjaar, met gebruikmaking van het elektronische platform DigiMV, aan bij het Centraal Informatiepunt Beroepen
      Gezondheidszorg. In afwijking van de eerste zin wordt de Jaarverantwoording Zorg over de verslagjaren 2019 of
      2020 aangeleverd vóór 1 oktober 2020, respectievelijk 1 oktober 2021, en hoeven over dat verslagjaar de gegevens,
      bedoeld in [artikel 4.1, eerste en tweede lid, van de Wet normering topinkomens][ref1], niet te worden aangeleverd
      met gebruikmaking van het elektronische platform DigiMV. Laatstbedoelde gegevens worden vóór 1 oktober 2020,
      respectievelijk 1 oktober 2021 via internet openbaar gemaakt.

      2 De Minister kan het bestuur van een zorginstelling in het geval van overmacht uitstel van indiening verlenen op
      een gemotiveerd verzoek, dat vóór 1 april van het jaar, volgend op het verslagjaar, in elektronische vorm via het
      e-mailadres meldpunt@igj.nl moet zijn ingediend. In afwijking van de eerste zin kan een verzoek om uitstel van
      indiening van de Jaarverantwoording Zorg over de verslagjaren 2019 of 2020 worden ingediend vóór 15 juli 2020,
      respectievelijk 15 juli 2021.


      [ref1]: https://wetten.overheid.nl/BWBR0032249#Artikel4.1
    url: https://wetten.overheid.nl/BWBR0019252/2021-06-09#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0032249
        artikel: '4.1'
  - number: '10'
    text: |-
      De kosten van het opstellen en indienen van de jaarverslaggeving komen ten laste van de desbetreffende
      zorginstelling.
    url: https://wetten.overheid.nl/BWBR0019252/2021-06-09#Artikel10
  - number: '11'
    text: |-
      Op de rechtspleging inzake de jaarverslaggeving van zorginstellingen is
      [Afdeling 16 van het Tweede Boek van het Burgerlijk Wetboek][ref1] van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0003045#Afdeling16
    url: https://wetten.overheid.nl/BWBR0019252/2021-06-09#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0003045
        afdeling: '16'
  - number: 12a
    text: |-
      De [artikelen 2a][ref1] en [9][ref2], en [bijlagen 1][ref3] en [2][ref4], zoals die luidden onmiddellijk
      voorafgaand aan het tijdstip van inwerkingtreding van artikel I, met uitzondering van onderdeel A, onder 2 en
      3, van de Wijziging Regeling verslaggeving WTZi verslagjaar 2020, blijven van toepassing ten aanzien van de
      verslaggeving over het verslagjaar 2019.


