preamble:
  text: |-
    Wij Willem-Alexander, bij de gratie Gods, Koning der Nederlanden, Prins van Oranje-Nassau, enz. enz. enz.

    Allen, die deze zullen zien of horen lezen, saluut! doen te weten:

    Alzo Wij in overweging genomen hebben, dat het in het kader van het leveren van een bijdrage door de bankensector
    aan de financiering van de nationalisatie van SNS REAAL wenselijk is om een tijdelijke heffing in te voeren voor
    banken die op 1 februari 2013 deelnamen aan het depositogarantiestelsel;

    Zo is het, dat Wij, de Afdeling advisering van de Raad van State gehoord, en met gemeen overleg der Staten-
    Generaal, hebben goedgevonden en verstaan, gelijk Wij goedvinden en verstaan bij deze:
  url: https://wetten.overheid.nl/BWBR0034433/2015-01-01#ArtikelAanhef
articles:
  - number: '13'
    text: |-
      1 De artikelen van deze wet treden in werking op een bij koninklijk besluit te bepalen tijdstip, dat voor de
      verschillende artikelen of onderdelen daarvan verschillend kan worden vastgesteld, en vervallen op een bij
      koninklijk besluit te bepalen tijdstip, dat voor de verschillende artikelen of onderdelen daarvan verschillend kan
      worden vastgesteld.

      2 [Artikel 11][ref1] werkt terug tot en met 1 februari 2013.


