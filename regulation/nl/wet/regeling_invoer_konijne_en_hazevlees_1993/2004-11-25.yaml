---
$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.5.2/schema.json
$id: regeling_invoer_konijne_en_hazevlees_1993
regulatory_layer: WET
publication_date: '1992-11-12'
valid_from: '2004-11-25'
bwb_id: BWBR0006049
url: https://wetten.overheid.nl/BWBR0006049/2004-11-25
preamble:
  text: |-
    Gelet op richtlijn 91/495/EEG van de Raad van de Europese Gemeenschappen van 27 november 1990 inzake
    gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de produktie en het in de handel brengen
    van konijnevlees en vlees van gekweekt wild (PbEG L 268) en op artikel 2 van de Wet tot wering van besmettelijke
    ziekten bij knaagdieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:

      *regeling:* Regeling keuring en handelsverkeer konijne- en hazevlees 1993;

      *konijnen:* tamme konijnen;

      *konijnevlees:* alle voor menselijke consumptie geschikte delen van konijnen;

      *hazen:* hazen die in gevangenschap zijn gekweekt, gehouden of geslacht;

      *hazevlees:* alle voor menselijke consumptie geschikte delen van hazen;

      *lid-staat:* lid-staat van de Europese Unie, niet zijnde Nederland

      *derde land:* land, niet zijnde Nederland en niet zijnde een lid-staat.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel1
  - number: '2'
    text: De invoer van konijnevlees en hazevlees is verboden.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel2
    machine_readable:
      execution:
        output:
          - name: invoer_verboden
            type: boolean
            description: De invoer van konijnevlees en hazevlees is verboden.
        actions:
          - output: invoer_verboden
            value: true
            legal_basis:
              law: Regeling invoer konijne en hazevlees 1993
              article: '2'
  - number: '3'
    text: |-
      Het verbod, gesteld in artikel 2, is niet van toepassing op de invoer van konijnevlees of hazevlees, mits wordt voldaan aan:
      a. voor zover het betreft invoer uit een Lid-Staat of Noorwegen, artikel 5 van de regeling;
      b. voor zover het betreft invoer uit een derde land, niet zijnde Noorwegen, artikel 7 van de regeling.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006049
        artikel: '2'
    machine_readable:
      open_terms:
        - id: voldoet_aan_artikel_5
          type: boolean
          required: true
          delegated_to: minister
          delegation_type: MINISTERIELE_REGELING
          description: Voldoet aan de voorwaarden van artikel 5 van de regeling.
        - id: voldoet_aan_artikel_7
          type: boolean
          required: true
          delegated_to: minister
          delegation_type: MINISTERIELE_REGELING
          description: Voldoet aan de voorwaarden van artikel 7 van de regeling.
      execution:
        parameters:
          - name: land_van_herkomst
            type: string
            description: Het land van herkomst van het vlees.
        output:
          - name: invoer_toegestaan
            type: boolean
            description: Indicates of de invoer van konijnevlees of hazevlees is toegestaan.
        actions:
          - output: invoer_toegestaan
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: IN
                      subject: $land_van_herkomst
                      values: ["lid-staat", "Noorwegen"]
                    - operation: EQUALS
                      subject: $voldoet_aan_artikel_5
                      value: true
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $land_van_herkomst
                      value: "derde land"
                    - operation: EQUALS
                      subject: $voldoet_aan_artikel_7
                      value: true
            legal_basis:
              law: Regeling invoer konijne en hazevlees 1993
              article: '3'
  - number: '5'
    text: De Regeling in- en doorvoer levende en dode konijnen 1974 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel5
  - number: 5a
    text: |-
      Deze regeling is niet van toepassing op:

      a. gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen als bedoeld in [Richtlijn nr. 88/657/EEG]
      (31988L0657) van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen voor de
      produktie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen en tot
      wijziging van de [Richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462) (PbEG
      L 382);

      b. gehakt vlees en vleesbereidingen als bedoeld in [Richtlijn nr. 94/65/EG](31994L0065) van de Raad van
      de Europese Unie van 14 december 1994 tot vaststelling van voorschriften voor de produktie en het in de
      handel brengen van gehakt vlees en vleesbereidingen (PbEG L 368), niet zijnde gehakt vlees als bedoeld in
      [artikel 9.15, tweede lid, van de Regeling keuring en handel dierlijke produkten][ref1];

      c. vlees als bedoeld in artikel 1 van [verordening (EG) nr. 745/2004](32004R0745) van de Commissie van de
      Europese Gemeenschappen van 16 april 2004 tot vaststelling van maatregelen betreffende de invoer van producten van
      dierlijke oorsprong voor persoonlijke consumptie (PbEU L 122), voor zover door reizigers in de Europese Gemeenschap
      binnengebracht of aan particulieren in de Europese Gemeenschap toegezonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9.15
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '9.15'
    machine_readable:
      execution:
        parameters:
          - name: product_type
            type: string
            description: Het type product (bv. gehakt, vleesbereidingen, vlees in stukken).
          - name: gewicht
            type: number
            description: Het gewicht van het vlees in grammen.
          - name: richtlijn_88_657_eee_compliant
            type: boolean
            description: Voldoet het product aan Richtlijn 88/657/EEG.
          - name: richtlijn_94_65_eg_compliant
            type: boolean
            description: Voldoet het product aan Richtlijn 94/65/EG.
          - name: verordening_745_2004_compliant
            type: boolean
            description: Voldoet het product aan Verordening (EG) nr. 745/2004 voor persoonlijke consumptie.
        output:
          - name: uitzondering_toepasselijk
            type: boolean
            description: Is de uitzondering van Artikel 5a van toepassing.
        actions:
          - output: uitzondering_toepasselijk
            value:
              operation: OR
              conditions:
                - operation: AND
                  conditions:
                    - operation: IN
                      subject: $product_type
                      values: ["gehakt", "vleesbereidingen"]
                    - operation: EQUALS
                      subject: $richtlijn_88_657_eee_compliant
                      value: true
                - operation: AND
                  conditions:
                    - operation: EQUALS
                      subject: $product_type
                      value: "vlees in stukken"
                    - operation: LESS_THAN
                      subject: $gewicht
                      value: 100
                    - operation: EQUALS
                      subject: $richtlijn_88_657_eee_compliant
                      value: true
                - operation: AND
                  conditions:
                    - operation: IN
                      subject: $product_type
                      values: ["gehakt vlees", "vleesbereidingen"]
                    - operation: EQUALS
                      subject: $richtlijn_94_65_eg_compliant
                      value: true
                - operation: EQUALS
                  subject: $verordening_745_2004_compliant
                  value: true
            legal_basis:
              law: Regeling invoer konijne en hazevlees 1993
              article: '5a'
  - number: '6'
    text: |-
      1 Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.

      2 Deze regeling wordt aangehaald als:

      Regeling invoer konijne- en hazevlees 1993.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel6
