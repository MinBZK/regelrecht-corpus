$schema: https://raw.githubusercontent.com/MinBZK/regelrecht/refs/heads/main/schema/v0.3.1/schema.json
$id: regeling_invoer_konijne_en_hazevlees_1993
regulatory_layer: WET
publication_date: '1992-11-12'
valid_from: '2004-11-25'
bwb_id: BWBR0006049
url: https://wetten.overheid.nl/BWBR0006049/2004-11-25
preamble:
  text: |-
    Gelet op richtlijn 91/495/EEG van de Raad van de Europese Gemeenschappen van 27 november 1990 inzake
    gezondheidsvoorschriften en veterinairrechtelijke voorschriften voor de produktie en het in de handel brengen
    van konijnevlees en vlees van gekweekt wild (PbEG L 268) en op artikel 2 van de Wet tot wering van besmettelijke
    ziekten bij knaagdieren;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#ArtikelAanhef
articles:
  - number: '1'
    text: |-
      In deze regeling wordt verstaan onder:


              *regeling:*


              Regeling keuring en handelsverkeer konijne- en hazevlees 1993;




              *konijnen:*


              tamme konijnen;




              *konijnevlees:*


              alle voor menselijke consumptie geschikte delen van konijnen;




              *hazen:*


              hazen die in gevangenschap zijn gekweekt, gehouden of geslacht;




              *hazevlees:*


              alle voor menselijke consumptie geschikte delen van hazen;



            lid-staat:

              lid-staat van de Europese Unie, niet zijnde Nederland



            derde land:

              land, niet zijnde Nederland en niet zijnde een lid-staat.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel1
  - number: '2'
    text: De invoer van konijnevlees en hazevlees is verboden.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel2
  - number: '3'
    text: |-
      Het verbod, gesteld in [artikel 2, onderdeel a en b][ref1], is niet van toepassing op de invoer van konijnevlees of
      hazevlees, mits wordt voldaan aan:


      [ref1]: https://wetten.overheid.nl/BWBR0006049#Artikel2
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel3
    references:
      - id: ref1
        bwb_id: BWBR0006049
        artikel: '2'
  - number: 3.a
    text: voor zover het betreft invoer uit een Lid-Staat of Noorwegen, artikel 5 van de regeling;
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel3
  - number: 3.b
    text: voor zover het betreft invoer uit een derde land, niet zijnde Noorwegen, artikel 7 van de regeling.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel3
  - number: '5'
    text: De Regeling in- en doorvoer levende en dode konijnen 1974 wordt ingetrokken.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel5
  - number: 5a
    text: 'Deze regeling is niet van toepassing op:'
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel5a
  - number: 5a.a
    text: |-
      gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen als bedoeld in [Richtlijn nr. 88/657/EEG]
      (31988L0657) van de Raad van de Europese Gemeenschappen van 14 december 1988 tot vaststelling van de eisen voor de
      produktie van en het handelsverkeer in gehakt, vlees in stukken van minder dan 100 gram en vleesbereidingen en tot
      wijziging van de [Richtlijnen 64/433/EEG](31964L0433), [71/118/EEG](31971L0118) en [72/462/EEG](31972L0462) (PbEG
      L 382);
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel5a
  - number: 5a.b
    text: |-
      gehakt vlees en vleesbereidingen als bedoeld in [Richtlijn nr. 94/65/EG](31994L0065) van de Raad van
      de Europese Unie van 14 december 1994 tot vaststelling van voorschriften voor de produktie en het in de
      handel brengen van gehakt vlees en vleesbereidingen (PbEG L 368), niet zijnde gehakt vlees als bedoeld in
      [artikel 9.15, tweede lid, van de Regeling keuring en handel dierlijke produkten][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006727#Artikel9
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel5a
    references:
      - id: ref1
        bwb_id: BWBR0006727
        artikel: '9'
  - number: 5a.c
    text: |-
      vlees als bedoeld in artikel 1 van [verordening (EG) nr. 745/2004](32004R0745) van de Commissie van de Europese
      Gemeenschappen van 16 april 2004 tot vaststelling van maatregelen betreffende de invoer van producten van
      dierlijke oorsprong voor persoonlijke consumptie (PbEU L 122), voor zover door reizigers in de Europese Gemeenschap
      binnengebracht of aan particulieren in de Europese Gemeenschap toegezonden.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel5a
  - number: '6.1'
    text: |-
      Deze regeling treedt in werking met ingang van de tweede dag na de dagtekening van de Staatscourant waarin zij
      wordt geplaatst.
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel6
  - number: '6.2'
    text: 'Deze regeling wordt aangehaald als: Regeling invoer konijne- en hazevlees 1993.'
    url: https://wetten.overheid.nl/BWBR0006049/2004-11-25#Artikel6
