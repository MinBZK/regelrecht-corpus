  - number: '2'
    text: |-
      1 Het subsidieplafond voor het verlenen van subsidie voor de productie van hernieuwbare elektriciteit op grond
      van de [artikelen 4, eerste lid][ref1], [10 eerste lid,][ref2][16, eerste lid][ref3], [21, eerste lid][ref4],
      [26, eerste lid][ref5], [31, eerste lid][ref6], [35, eerste lid][ref7], [40, eerste lid][ref8],
      [44, eerste lid][ref9], [48, eerste lid][ref10], [52, eerste lid][ref11], en [56, eerste lid][ref12], die is
      aangevraagd in de periode van 1 juli 2011 tot 30 december 2011, 17:00 uur, bedraagt € 500.000.000.

      2 De minister verdeelt het bedrag, genoemd in het eerste lid, op volgorde van binnenkomst van de aanvragen.

      3 Per categorie productie-installaties kan in de periode, bedoeld in het eerste lid, per adres waarop een
      productie-installatie wordt geplaatst maximaal één aanvraag worden ingediend.

      4 De minister beslist afwijzend op een aanvraag om subsidie voor de productie van hernieuwbare elektriciteit door
      een productie-installatie van een categorie als bedoeld in het eerste lid indien op het moment van indienen van de
      aanvraag geen toestemming van de eigenaar van de beoogde locatie is verkregen voor het plaatsen van de productie-
      installatie.

      5 De periode waarover subsidie wordt verstrekt vangt niet later aan dan de dag na afloop van de op grond van
      [artikel 61, eerste lid, van het besluit][ref13] vastgestelde periode waarin de productie-installatie in gebruik
      dient te worden genomen.


