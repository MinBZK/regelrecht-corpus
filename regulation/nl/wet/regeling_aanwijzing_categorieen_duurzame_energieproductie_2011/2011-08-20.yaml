      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee door hydro-mechanisch-elektrische omzetting hernieuwbare elektriciteit wordt
      geproduceerd uit potentiële dan wel kinetische energie van stromend water dat niet specifiek ten behoeve van de
      elektriciteitsproductie omhoog is gepompt:

      a. in installaties met een valhoogte gelijk aan of groter dan 50 centimeter en kleiner dan 5 meter;

      b. in installaties met een valhoogte gelijk aan of groter dan 5 meter.

      2 Aanvragen om subsidie als bedoeld in:

      a. het eerste lid, onderdeel a, worden ontvangen in de periode van 31 oktober 2011, 17:00 uur, tot 30 december
      2011, 17:00 uur;

      b. het eerste lid, onderdeel b, worden ontvangen in de periode van 1 juli 2011 tot 30 december 2011, 17:00 uur.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 2][ref1].


