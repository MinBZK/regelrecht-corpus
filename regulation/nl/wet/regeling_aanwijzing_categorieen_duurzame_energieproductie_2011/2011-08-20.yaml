      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie waarmee hernieuwbare elektriciteit wordt geproduceerd uit warmte die uitsluitend of in
      hoofdzaak is geproduceerd door:

      a. de verbranding van afvalstoffen,

      b. een andere thermische behandeling van afvalstoffen dan bedoeld onder 1° ingeval de producten daarvan vervolgens
      worden verbrand of

      c. de verbranding van producten die voortkomen uit thermische behandeling van afvalstoffen.

      2 Aanvragen om subsidie als bedoeld in het eerste lid, worden ontvangen in de periode van 1 juli 2011 tot 30
      december 2011, 17:00 uur.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 1][ref1].


