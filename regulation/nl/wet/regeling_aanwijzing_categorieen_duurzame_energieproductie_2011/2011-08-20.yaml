    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:

      a. een productie-installatie bestaande uit een vergistingsinstallatie en een installatie voor het opwerken van
      hernieuwbaar gas tot aardgaskwaliteit, waarmee hernieuwbaar gas wordt geproduceerd met gebruik van uitsluitend
      biogas uit allesvergisting;

      b. een productie-installatie bestaande uit een vergistingsinstallatie en een installatie voor het opwerken van
      hernieuwbaar gas tot aardgaskwaliteit, waarmee hernieuwbaar gas wordt geproduceerd met gebruik van uitsluitend
      biogas uit vergisting en co-vergisting van dierlijke mest;

      c. een productie-installatie die onderdeel uitmaakt van een groen gas hub en waarmee hernieuwbaar gas wordt
      geproduceerd met gebruik van uitsluitend biogas uit allesvergisting;

      d. een productie-installatie die onderdeel uitmaakt van een groen gas hub en waarmee hernieuwbaar gas wordt
      geproduceerd met gebruik van uitsluitend biogas uit vergisting en co-vergisting van dierlijke mest.

      2 Productie-installaties als bedoeld in het eerste lid, onderdelen c en d, worden aangewezen als productie-
      installaties als bedoeld in [artikel 56, eerste lid, tweede volzin, van het besluit][ref1].

      3 Aanvragen om subsidie als bedoeld in:

      a. het eerste lid, onderdelen a en d, worden ontvangen in de periode van 31 augustus 2011, 17:00 uur, tot 30
      december 2011, 17:00 uur;

      b. het eerste lid, onderdeel b, wordt ontvangen in de periode van 31 oktober 2011, 17:00 uur, tot 30 december 2011,
      17:00 uur;

      c. het eerste lid, onderdeel c, wordt ontvangen in de periode van 1 juli 2011 tot 30 december 2011, 17:00 uur.

      4 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel56
