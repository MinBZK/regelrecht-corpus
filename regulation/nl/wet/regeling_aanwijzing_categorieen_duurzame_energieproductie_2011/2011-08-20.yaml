    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbaar gas geproduceerd door:

      a. een productie-installatie bestaande uit een installatie voor de productie van stortgas of een
      vergistingsinstallatie, en een installatie voor het opwerken van hernieuwbaar gas tot aardgaskwaliteit, waarmee
      hernieuwbaar gas wordt geproduceerd uit gas dat vrijkomt tengevolge van biologische afbraakreacties:

      1°. uit gestorte afvalstoffen of

      2°. bij de zuivering van huishoudelijk afvalwater, bedrijfsafvalwater en afvloeiend hemelwater;

      b. een productie-installatie die onderdeel uitmaakt van een groen gas hub en waarmee hernieuwbaar gas wordt
      geproduceerd uit gas dat vrijkomt tengevolge van biologische afbraakreacties:

      1°. uit gestorte afvalstoffen of

      2°. bij de zuivering van huishoudelijk afvalwater, bedrijfsafvalwater en afvloeiend hemelwater.

      2 Productie-installaties als bedoeld in het eerste lid, onderdeel b, worden aangewezen als productie-installaties
      als bedoeld in [artikel 56, eerste lid, tweede volzin, van het besluit][ref1].

      3 Aanvragen om subsidie als bedoeld in het eerste lid worden ontvangen in de periode van 1 juli 2011 tot 30
      december 2011, 17:00 uur.

      4 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 6][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0022735#Artikel56
      [ref2]: https://wetten.overheid.nl/BWBR0030034
    url: https://wetten.overheid.nl/BWBR0030034/2011-08-20#Artikel80
