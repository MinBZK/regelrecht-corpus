  - number: '44'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door
      een productie-installatie voor de productie van hernieuwbare elektriciteit door inzet van warmte verkregen uit
      thermische conversie van vaste of vloeibare biomassa met een nominaal elektrisch vermogen kleiner dan of gelijk aan
      10 MW.

      2 De minister verstrekt uitsluitend subsidie als bedoeld in het eerste lid voor productie van hernieuwbare
      elektriciteit met behulp van vloeibare biomassa indien de producent aantoont dat de gebruikte vloeibare biomassa
      voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de richtlijn hernieuwbare energie.

      3 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030034
