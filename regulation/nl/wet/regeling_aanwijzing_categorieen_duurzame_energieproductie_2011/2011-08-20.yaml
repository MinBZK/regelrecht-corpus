  - number: '21'
    text: |-
      1 De minister verstrekt op aanvraag subsidie aan een producent van hernieuwbare elektriciteit geproduceerd door een
      productie-installatie voor de productie van hernieuwbare elektriciteit door:

      a. verbranding van het biogas uit vergisting en co-vergisting van dierlijke mest;

      b. verbranding van het biogas uit allesvergisting;

      c. inzet van warmte verkregen uit thermische conversie van vaste of vloeibare biomassa met een nominaal elektrisch
      vermogen groter dan 10 MW.

      2 De minister verstrekt uitsluitend subsidie als bedoeld in het eerste lid, onderdeel c, voor productie van
      hernieuwbare elektriciteit met behulp van vloeibare biomassa indien de producent aantoont dat de gebruikte
      vloeibare biomassa voldoet aan de duurzaamheidscriteria, bedoeld in artikel 17, eerste lid, van de richtlijn
      hernieuwbare energie.

      3 Aanvragen om subsidie als bedoeld in:

      a. het eerste lid, onderdeel a, worden ontvangen in de periode van 30 november 2011, 17:00 uur, tot 30 december
      2011, 17:00 uur;

      b. het eerste lid, onderdelen b, worden ontvangen in de periode van 31 oktober 2011, 17:00 uur, tot 30 december
      2011, 17:00 uur;

      c. het eerste lid, onderdeel c, worden ontvangen in de periode van 31 oktober 2011, 17:00 uur, tot 30 december
      2011, 17:00 uur.

      4 Een aanvraag om subsidie wordt ingediend met gebruikmaking van het formulier dat is opgenomen in de bij deze
      regeling behorende [bijlage 1][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030034
