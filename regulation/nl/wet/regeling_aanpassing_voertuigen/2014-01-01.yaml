        hoofdstuk: '5'
        afdeling: '2'
  - number: '71.1'
    text: |-
      De in het kader van toezicht opgelegde steekproef dan wel herschouwing wordt uitgevoerd door de
      Dienst Wegverkeer aangewezen functionaris en vindt plaats in de werkplaats waar de wijziging of de in
      [artikel 132k, eerste lid, van de wet][ref1] bedoelde werkzaamheid heeft plaatsgevonden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: '71.2'
    text: |-
      Bij de steekproef wordt andermaal onderzocht of de wijziging respectievelijk de in
      [artikel 132k, eerste lid, van de wet][ref1] bedoelde werkzaamheidovereenkomstig de eisen, bedoeld in
      [hoofdstukken 2][ref2] of [4][ref3], respectievelijk [hoofdstuk 4b][ref4] zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel71
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0025732
        hoofdstuk: 4b
  - number: '72'
    text: |-
      De in deze paragraaf bepaalde eisen zijn, voor zover niet anders bepaald, tevens van toepassing op het toezicht op
      mobiele installatie-eenheden alcoholslot.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel72
  - number: '73.1'
    text: |-
      Nadat een erkenning is verleend wordt in beginsel eenmaal per twee jaar door middel van een herschouwing onderzocht
      of de erkenninghouder en de werkplaats nog voldoen aan de erkenningseisen en of de erkenningsvoorschriften worden
      nageleefd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel73
  - number: '73.2'
    text: De in het eerste lid bedoelde controle kan tevens plaatsvinden in het kader van een steekproef van het voertuig.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel73
  - number: '74.1'
    text: |-
      Deze paragraaf laat onverlet de bevoegdheid tot wijziging, schorsing of intrekking van de erkenning als omschreven
      in de [artikelen 103][ref1] of [132n, van de wet,][ref2] in andere gevallen dan die in deze paragraaf zijn
      beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132n
  - number: '74.2'
    text: |-
      De in de [artikelen 103][ref1] of [132n, van de wet][ref2] bedoelde wijziging of intrekking van de erkenning
      bij het niet voldoen aan de erkenningseisen of erkenningsvoorschriften, zal beperkt blijven tot de werkzaamheden
      waarvoor de erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132n
  - number: '74.3'
    text: |-
      De in de [artikelen 103][ref1] of [132n, van de wet][ref2] bedoelde wijziging of intrekking van de erkenning bij
      het niet voldoen aan de erkenningseisen of erkenningsvoorschriften, zal, indien de erkenninghouder een erkenning
      heeft voor meerdere werkplaatsen, beperkt blijven tot de desbetreffende werkplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel74
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132n
  - number: '75.1'
    text: |-
      In het kader van het toezicht kan steekproefsgewijs herkeuring plaatsvinden van de in voertuigen aangebrachte
      wijziging waarvoor de erkenning is verleend of voor de in [artikel 132k, eerste lid, van de wet][ref1] bedoelde
      werkzaamheid of werkzaamheden, waarvoor de erkenning installateur alcoholslot is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: '75.2'
    text: |-
      Bij de steekproef wordt andermaal onderzocht of de wijziging respectievelijk de in
      [artikel 132k, eerste lid, van de wet][ref1] bedoelde werkzaamheid of werkzaamhedenovereenkomstig de eisen, bedoeld
      in [hoofdstukken 2][ref2] of [4][ref3], respectievelijk [hoofdstuk 4b][ref4] zijn uitgevoerd, dan wel of er sprake
      is van onregelmatigheden aan het alcoholslot.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel75
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '4'
      - id: ref4
        bwb_id: BWBR0025732
        hoofdstuk: 4b
  - number: '76.1'
    text: |-
      Indien het voertuig blijkens mededeling van de Dienst Wegverkeer ten aanzien van de gasinstallatie dan wel het
      alcoholslot aan een steekproef moet worden onderworpen:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: 76.1.a
    text: |-
      worden gedurende 90 minuten na het tijdstip van afmelding door de erkenninghouder of diens medewerkers,
      respectievelijk een in [artikel 66r][ref1] bedoelde persoon, geen wijzigingen aangebracht in de staat van het
      voertuig dat aan een steekproef wordt onderworpen;


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
  - number: 76.1.b
    text: |-
      worden door de erkenninghouder of diens medewerkers, respectievelijk een in [artikel 66r][ref1] bedoelde persoon,
      geen metingen verricht met betrekking tot dat voertuig;


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
  - number: 76.1.c
    text: |-
      worden door een in [artikel 66r][ref1] bedoelde persoon geen werkzaamheden verricht als bedoeld in
      [artikel 132k, eerste lid, van de wet][ref2];


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 76.1.d
    text: |-
      worden voorafgaande aan de steekproef, door de erkenninghouder of diens medewerkers, respectievelijk
      een in [artikel 66r][ref1] bedoelde persoon, de bescheiden als bedoeld in [19, tweede lid][ref2], en
      [artikel 23, eerste lid][ref3], dan wel de bescheiden ten aanzien van het alcoholslot overhandigd;


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel19
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Artikel23
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: '19'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
      - id: ref3
        bwb_id: BWBR0025732
        artikel: '23'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 76.1.e
    text: |-
      wijst de erkenninghouder de eigenaar of houder van het voertuig er op dat deze verplicht is het voertuig voor de
      uitvoering van de steekproef beschikbaar te houden.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: '76.2'
    text: |-
      Onverminderd het bepaalde in [artikel 69][ref1] wordt aan een steekproef alle medewerking verleend door de
      erkenninghouder. Onder het verlenen van medewerking wordt in ieder geval verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel69
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '69'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 76.2.a
    text: |-
      de aanwezigheid van de LPG-technicus die de keuring van de gasinstallatie van het voertuig heeft uitgevoerd vanaf
      de mededeling steekproef;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: 76.2.b
    text: |-
      de aanwezigheid gedurende de gehele steekproef van de persoon of de mobiele installatie-eenheid alcoholslot
      die ingevolge [hoofdstuk 4b][ref1] bevoegd is tot het verrichten van de in [artikel 132k, eerste lid][ref2],
      genoemde werkzaamheid of werkzaamheden die in de steekproef wordt of worden onderzocht en die overeenkomstige
      [artikelen 66ff][ref3], [66mm][ref4] of [66pp][ref5] de vereiste gegevens heeft gemeld;


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Artikel66ff
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Artikel66mm
      [ref5]: https://wetten.overheid.nl/BWBR0025732#Artikel66pp
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: 4b
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
      - id: ref3
        bwb_id: BWBR0025732
        artikel: 66ff
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0025732
        artikel: 66mm
        hoofdstuk: 4b
        paragraaf: '5'
        afdeling: '2'
      - id: ref5
        bwb_id: BWBR0025732
        artikel: 66pp
        hoofdstuk: 4b
        paragraaf: '6'
        afdeling: '2'
  - number: 76.2.c
    text: het verlenen van feitelijke assistentie bij het uitvoeren van de steekproef;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: 76.2.d
    text: |-
      het beschikbaar houden van het voertuig in de werkplaats, ongeacht het tijdstip van de aanvang van de steekproef,
      gedurende de steekproef;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: 76.2.e
    text: het beschikbaar stellen van de werkplaats en de apparatuur gedurende de steekproef.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: '76.3'
    text: 'Indien bij de steekproef wordt vastgesteld dat:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: 76.3.a
    text: |-
      de keuring van de gasinstallatie niet overeenkomstig de voorschriften van [artikel 18][ref1] is uitgevoerd, dan wel
      onterecht is afgemeld;


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel18
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
  - number: 76.3.b
    text: de opnamekaart gasinstallatie onjuist of onvolledig is ingevuld;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: 76.3.c
    text: de voorschriften met betrekking tot de steekproef niet in acht zijn genomen, of
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: 76.3.d
    text: |-
      de in [artikel 132k][ref1] bedoelde werkzaamheid of werkzaamheden met betrekking tot het alcoholslot niet
      overeenkomstig de voorschriften in [hoofdstuk 4b][ref2] is of zijn uitgevoerd,


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: 4b
  - number: '76.4'
    text: |-
      Indien bij de steekproef wordt vastgesteld dat er sprake is van onregelmatigheden aan het alcoholslot, kan de
      toezichthouder opdracht geven tot uitbouw van het alcoholslot voor nader onderzoek en tot inbouw van een nieuw
      alcoholslot.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: '76.5'
    text: |-
      De eigenaar of houder van een voertuig waarvoor een steekproef wordt vereist mag in de in het eerste lid, onderdeel
      a, bedoelde periode van 90 minuten geen wijzigingen aanbrengen of laten aanbrengen in de staat van het voertuig of
      geen werkzaamheid of werkzaamheden als bedoeld in [artikel 132k, eerste lid, van de wet][ref1] verrichten of laten
      verrichten.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: '76.6'
    text: |-
      De erkenninghouder gasinstallaties bewaart goed geordend voor de duur van twee jaar van elk voertuig
      waarvan een gasinstallatie is gekeurd het steekproefcontrolerapport, voor zover van toepassing. Op het
      steekproefcontrolerapport worden geen wijzigingen aangebracht.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel76
  - number: '77.1'
    text: |-
      Indien aan één of meer erkenningseisen of erkenningsvoorschriften niet wordt voldaan, is ingevolge de
      [artikelen 103, tweede lid][ref1], respectievelijk [132n, tweede lid van de wet][ref2] intrekking of wijziging van
      de erkenning voor de betrokken werkplaats mogelijk.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132n
  - number: '77.2'
    text: |-
      De in het eerste lid bedoelde intrekking of wijziging van de erkenning zal, in het geval dat de erkenninghouder of
      de erkenninghouder installateur alcoholslot een erkenning heeft voor meerdere werkplaatsen of mobiele installatie-
      eenheden, indien een van deze werkplaatsen dan wel mobiele installatie-eenheden niet voldoet aan de erkenningseisen
      of erkenningsvoorschriften, beperkt blijven tot die desbetreffende werkplaats dan wel mobiele installatie-eenheid.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel77
  - number: '77.3'
    text: |-
      De in deze paragraaf bepaalde eisen zijn, voor zover niet anders bepaald, mede van toepassing op de naleving van
      de in [artikel 66c][ref1] bedoelde overeenkomst opgenomen afspraken betreffende de beveiliging van de persoonlijke
      levenssfeer van de deelnemer en de betrouwbaarheid en beveiliging van de te registreren gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66c
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel77
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66c
        hoofdstuk: 4a
        paragraaf: '2'
        afdeling: '1'
  - number: 77a.1
    text: |-
      In geval van een melding als bedoeld in de [artikelen 66ff, tweede lid][ref1], [66mm][ref2] of [66pp][ref3] is
      [artikel 76, eerste, tweede, vierde en vijfde lid][ref4], van overeenkomstige toepassing, met dien verstande dat in
      het tweede lid, onderdelen a en b, in plaats van de aanwezigheid van de persoon of de mobiele installatie-eenheid
      die de installatie heeft verricht, moet worden gelezen de persoon of mobiele installatie-eenheid die de melding,
      bedoeld in de artikelen 66ff, tweede lid, 66mm of 66pp, heeft gedaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ff
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel66mm
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Artikel66pp
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Artikel76
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ff
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: 66mm
        hoofdstuk: 4b
        paragraaf: '5'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0025732
        artikel: 66pp
        hoofdstuk: 4b
        paragraaf: '6'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0025732
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '2'
  - number: 77a.3
    text: |-
      De toezichthouder, bedoeld in [artikel 158 van de wet][ref1] maakt rapport op van zijn bevindingen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel158
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '158'
  - number: 77a.4
    text: |-
      Indien de in het derde lid bedoelde toezichthouder heeft geconstateerd dat een of meer van de in de
      [artikelen 66ff, tweede lid][ref1], [66mm][ref2] of [66pp][ref3] bedoelde omstandigheden zich heeft voorgedaan,
      meldt hij dit in het in [artikel 129, eerste lid, van de wet][ref4] bedoelde register. Het rapport wordt
      desgevraagd toegezonden aan het CBR.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ff
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel66mm
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Artikel66pp
      [ref4]: https://wetten.overheid.nl/BWBR0006622#Artikel129
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel77a
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ff
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: 66mm
        hoofdstuk: 4b
        paragraaf: '5'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0025732
        artikel: 66pp
        hoofdstuk: 4b
        paragraaf: '6'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0006622
        artikel: '129'
  - number: '78'
    text: |-
      In geval van niet-naleving van de volgende verplichtingen of voorschriften wordt terstond begonnen met de procedure
      tot intrekking van de erkenning:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel78
  - number: 78.a
    text: |-
      de in [artikel 18][ref1] neergelegde verplichtingen ten aanzien van het melden van een voertuig bij het keuren van
      een gasinstallatie,


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel18
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '18'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '4'
  - number: 78.b
    text: |-
      de in [artikelen 66ff][ref1], [66mm][ref2], [66pp][ref3] en [66tt][ref4] neergelegde verplichtingen, of


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ff
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel66mm
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Artikel66pp
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Artikel66tt
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ff
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: 66mm
        hoofdstuk: 4b
        paragraaf: '5'
        afdeling: '2'
      - id: ref3
        bwb_id: BWBR0025732
        artikel: 66pp
        hoofdstuk: 4b
        paragraaf: '6'
        afdeling: '2'
      - id: ref4
        bwb_id: BWBR0025732
        artikel: 66tt
        hoofdstuk: 4b
        paragraaf: '8'
        afdeling: '2'
  - number: 78.c
    text: |-
      de in [artikel 76][ref1] opgenomen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel76
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel78
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '2'
  - number: '79'
    text: |-
      Deze paragraaf laat onverlet de bevoegdheid tot wijziging, schorsing of intrekking van de erkenning als omschreven
      in [artikel 103, van de wet][ref1], in andere gevallen dan die in deze paragraaf zijn beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel79
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '103'
  - number: '80'
    text: |-
      Nadat een erkenning is verleend wordt in beginsel eenmaal per twee jaar door middel van een herschouwing en
      een steekproef onderzocht of de erkenninghouder en de werkplaats nog voldoen aan de erkenningseisen en of de
      erkenningsvoorschriften worden nageleefd. In dit kader vindt controle plaats van zowel de organisatie van degene
      aan wie de goedkeuring is verleend als van het proces volgens hetwelk de werkzaamheden waarvoor de erkenning is
      verleend worden verricht.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel80
  - number: '81'
    text: |-
      In het kader van het toezicht kan een steekproef plaatsvinden op een voertuig van een type waarvoor de goedkeuring,
      behorende bij een wijziging in de bouw of inrichting, is verleend.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel81
  - number: '82'
    text: |-
      De in [artikel 80][ref1] en [81][ref2] bedoelde herschouwingen of steekproeven vinden plaats in een daartoe door de
      Dienst Wegverkeer aangewezen werkplaats van de erkenninghouder overeenkomstig [hoofdstuk 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel80
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel81
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '80'
        hoofdstuk: '5'
        afdeling: '3'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: '81'
        hoofdstuk: '5'
        afdeling: '3'
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '4'
  - number: 82a
    text: |-
      De in deze paragraaf bepaalde eisen zijn in de in [artikel 66f, tweede lid][ref1], bedoelde gevallen, voor zover
      niet anders bepaald, mede van toepassing op de naleving van de in dat artikel bedoelde bewerkersovereenkomst met
      de Dienst Wegverkeer vastgelegde afspraken over de te treffen maatregelen ter bescherming van de persoonlijke
      levenssfeer van de deelnemer en de veiligheid en beveiliging van de te registreren gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66f
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82a
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66f
        hoofdstuk: 4a
        paragraaf: '2'
        afdeling: '1'
  - number: 82b.1
    text: |-
      Nadat een erkenning producent alcoholslot is verleend, wordt ten minste één maal per twee jaar door middel van een
      herschouwing onderzocht of de erkenninghouder producent alcoholslot nog voldoet aan de erkenningseisen en of de
      erkenningsvoorschriften worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82b
  - number: 82b.2
    text: |-
      In afwijking van het eerste lid wordt tenminste één maal per jaar nagegaan of de in de bewerkersovereenkomst met
      de Dienst Wegverkeer vastgelegde afspraken over de te treffen maatregelen ter bescherming van de persoonlijke
      levenssfeer van de deelnemer en de veiligheid en beveiliging van de te registreren gegevens worden nageleefd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82b
  - number: 82b.3
    text: |-
      In afwijking van het eerste lid wordt ten minste eenmaal per jaar nagegaan of de in [artikel 66c][ref1]
      bedoelde overeenkomst opgenomen afspraken ter beveiliging van de persoonlijke levenssfeer van de deelnemer en de
      betrouwbaarheid en beveiliging van de te registreren gegevens worden nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66c
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82b
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66c
        hoofdstuk: 4a
        paragraaf: '2'
        afdeling: '1'
  - number: 82c
    text: |-
      Bij schorsing van een erkenning kan worden bepaald dat indien niet binnen een termijn van ten hoogste 12 weken
      wordt aangetoond dat weer aan de erkenningseisen of erkenningsvoorschriften wordt voldaan, alsnog wijziging of
      intrekking van de erkenning volgt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82c
  - number: 82d.1
    text: |-
      Deze paragraaf laat onverlet de bevoegdheid tot wijziging, schorsing of intrekking van de erkenning als omschreven
      in [artikel 132i van de wet][ref1], in andere gevallen dan die in deze paragraafzijn beschreven.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132i
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132i
  - number: 82d.2
    text: |-
      De in [artikel 132i, tweede lid, van de wet][ref1] bedoelde wijziging of intrekking van de erkenning bij het niet
      voldoen aan de erkenningseisen of erkenningsvoorschriften, zal beperkt blijven tot de werkzaamheden waarvoor de
      erkenning is verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132i
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132i
  - number: 82e
    text: |-
      In geval van niet naleving van [hoofdstuk IVa][ref1] wordt terstond begonnen met de procedure tot intrekking van
      de erkenning.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82e
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: 4a
  - number: 82f
    text: |-
      In afwijking van [artikel 11, eerste lid][ref1], overleggen personen die in het bezit zijn van een diploma LPG-
      technicus afgegeven voor 1 januari 2014 bij de aanvraag voor de pas, een afschrift van dat diploma en een afschrift
      van het bewijs dat de toets met goed gevolg is afgelegd.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel11
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel82f
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '83'
    text: |-
      Erkenningen en bevoegdheden die zijn verleend krachtens de [Erkenningsregeling snelheidsbegrenzers][ref1] en de
      [LPG-erkenningsregeling][ref2], zoals die regelingen luidden voor de inwerkingtreding van deze regeling, worden
      gelijkgesteld met erkenningen en bevoegdheden die zijn verleend krachtens deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0007081
      [ref2]: https://wetten.overheid.nl/BWBR0007077
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel83
    references:
      - id: ref1
        bwb_id: BWBR0007081
