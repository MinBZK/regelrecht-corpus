  - number: '1.2'
    text: |-
      In deze regeling wordt verstaan onder: - *richtlijn 93/34/EEG:* richtlijn nr. 93/34/EEG van de Raad van de Europese
      Gemeenschappen van 14 juni 1993 betreffende de voorgeschreven opschriften op twee-of driewielige motorvoertuigen
      (PbEG 1993, L 311);
        - *richtlijn 2007/46/EG:* richtlijn nr. 2007/46/EG van het Europees Parlement en de Raad van 5 september 2007
      tot vaststelling van een kader voor de goedkeuring van motorvoertuigen en aanhangwagens daarvan en van systemen,
      onderdelen en technische eenheden die voor dergelijke voertuigen zijn bestemd (PbEU 2007, L 263);
        - *VN/ECE-reglement 115:* VN/ECE-reglement 115 als bedoeld in [bijlage VA van de Regeling voertuigen][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: '1.3'
    text: |-
      [Artikel 1.3 van de Regeling voertuigen][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel1
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel1
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '1'
  - number: '2.1'
    text: |-
      Een erkenning wijziging constructie kan worden verleend aan een natuurlijk persoon of rechtspersoon voor een of
      meer in Nederland gevestigde werkplaatsen, ter zake van de in [hoofdstuk 2][ref1] met betrekking tot een erkenning
      gasinstallaties of in [hoofdstuk 4][ref2] met betrekking tot een erkenning GWC aangegeven werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '4'
  - number: '2.2'
    text: |-
      Een erkenning wijziging constructie kan op aanvraag worden verleend indien wordt voldaan aan de in
      [hoofdstuk 2][ref1] of [4][ref2] gestelde erkenningseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '4'
  - number: 2a.1
    text: |-
      Een erkenning producent alcoholslot kan worden verleend aan een natuurlijke persoon of rechtspersoon voor de in
      [artikel 132f, eerste lid, van de wet][ref1] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
  - number: 2a.2
    text: |-
      Een erkenning als bedoeld in het eerste lid wordt op aanvraag verleend, indien wordt voldaan aan de in de artikelen
      66a tot en met 66g gestelde erkenningseisen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2a
  - number: 2b.1
    text: |-
      Een erkenning installateur alcoholslot kan worden verleend aan een natuurlijke persoon of rechtspersoon voor een in
      Nederland gevestigde werkplaats voor de in [artikel 132k, eerste lid, van de wet][ref1] aangegeven werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 2b.2
    text: |-
      Een erkenning als bedoeld in het eerste lid wordt op aanvraag verleend, indien wordt voldaan aan de in de artikelen
      66n tot en met 66r gestelde erkenningseisen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2b
  - number: 2b.3
    text: |-
      Een erkenning installateur alcoholslot kan tevens worden verleend voor een of meer mobiele installatie-eenheden
      alcoholslot, voor de in [artikel 132k, eerste lid, van de wet][ref1] genoemde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2b
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 2b.4
    text: |-
      Een erkenning als bedoeld in het derde lid wordt op aanvraag verleend, indien wordt voldaan aan de in de artikelen
      66n tot en met 66r gestelde erkenningseisen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2b
  - number: 2b.5
    text: 'De in het derde lid bedoelde erkenning wordt ten behoeve van de identificatie gekoppeld aan:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2b
  - number: 2b.5.a
    text: de naam van de persoon die werkzaamheden als mobiele installatie-eenheid alcoholslot verricht, dan wel
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2b
  - number: 2b.5.b
    text: |-
      het kenteken van het voertuig van waaruit de werkzaamheden als mobiele installatie-eenheid alcoholslot worden
      verricht.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel2b
  - number: '3'
    text: |-
      De aanvraag van een erkenning wordt met inachtneming van de door de Dienst Wegverkeer vastgestelde voorschriften
      ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel3
  - number: '5.1'
    text: |-
      De directie of aangewezen vertegenwoordiger is verantwoordelijk voor het invoeren van en het op peil houden van het
      kwaliteitssysteem als bedoeld in [artikel 67][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '5.2'
    text: De verklaring of het document van aanwijzing moet door de directie zijn ondertekend.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
  - number: '5.3'
    text: |-
      Met betrekking tot de hiernavolgende aspecten is de directie of de aangewezen vertegenwoordiger verantwoordelijk
      voor de juiste uitvoering van de aan die aspecten verbonden voorschriften en het nemen van maatregelen om ervoor te
      zorgen dat aan de voorschriften wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
  - number: 5.3.a
    text: beheersing van documenten;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
  - number: 5.3.b
    text: controlerapport LPG-inbouw;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
  - number: 5.3.c
    text: vrijgave voertuig, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
  - number: 5.3.d
    text: controle- en meetmiddelen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
  - number: '5.4'
    text: |-
      Tevens moet zijn vastgelegd wie de plaatsvervangers zijn van de in het derde lid bedoelde personen of moet zijn
      vastgelegd dat bij afwezigheid van één of meerdere van deze personen de desbetreffende werkzaamheden niet worden
      uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel5
  - number: '6.1'
    text: |-
      De werkplaats bestemd voor het keuren van gasinstallaties is overdekt, behoorlijk af te sluiten, goed verlicht en
      voorzien van verwarming.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel6
  - number: '6.2'
    text: |-
      De in het eerste lid bedoelde ruimte heeft zodanige afmetingen en is zodanig ingericht dat de motorvoertuigen
      die behoren tot de groep waarvoor de erkenning voor de betrokken werkplaats wordt aangevraagd in deze werkplaats
      zodanig kunnen worden opgesteld dat zij van alle zijden goed toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel6
  - number: '6.3'
    text: |-
      In de in het eerste lid bedoelde ruimte is een voorziening aanwezig waarmee uitlaatgassen en andere gassen direct
      door een daartoe bestemde opening naar buiten kunnen worden gevoerd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel6
  - number: '6.4'
    text: In de in het eerste lid bedoelde ruimte kan de administratie van de keuringen behoorlijk worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel6
  - number: '6.5'
    text: |-
      In de werkplaats is een voorziening aanwezig die geschikt is voor het gebruik van datacommunicatie. Deze
      voorziening bestaat uit een computer of terminal met een modem, geschikt voor de toegangsstructuur van door de
      Dienst Wegverkeer geaccepteerde netwerken. Tevens is een voorziening aanwezig, geschikt voor aansluiting op de
      datacommunicatie, ten behoeve van het afdrukken van opnamekaarten gasinstallatie.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel6
  - number: '7.1'
    text: |-
      In de werkplaats bestemd voor het keuren van gasinstallaties is een doelmatige inspectieput of hefinrichting
      aanwezig die geschikt is voor de groep motorvoertuigen waarvoor de erkenning voor de betrokken werkplaats wordt
      aangevraagd en die is voorzien van een doelmatige verlichting. Wanneer niet duidelijk blijkt wat het draagvermogen
      van een hefinrichting is, wordt hiervoor door de fabrikant of een onafhankelijk instituut een verklaring
      overgelegd. Het draagvermogen wordt zichtbaar op de hefinrichting aangebracht.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: '7.2'
    text: |-
      De in het eerste lid bedoelde inspectieput of hefinrichting is zodanig uitgevoerd dat de LPG-technicus in staat
      is de onderkant van een voertuig nagenoeg over de hele lengte rechtopstaand te inspecteren, hetgeen betekent dat
      wanneer de erkenning wordt aangevraagd voor:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: 7.2.a
    text: |-
      voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3.500 kg, de hefinrichting een hefhoogte heeft van
      ten minste 1,35 m en de inspectieput een diepte heeft van ten minste 1,35 m;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: 7.2.b
    text: |-
      voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3.500 kg, de hefinrichting een hefhoogte heeft
      van ten minste 1,65 m en de inspectieput een diepte heeft van ten minste 1,55 m.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: '7.3'
    text: |-
      In geval van een aanvraag van een erkenning gasinstallaties is ten behoeve van de controle van de afstelling van de
      koplampen met behulp van een koplamptestapparaat een voorziening aanwezig die bestaat uit:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: 7.3.a
    text: |-
      een vlakke vloer van voldoende afmetingen of een hefinrichting waarop gelijktijdig zowel het te keuren voertuig als
      het koplamptestapparaat kan worden geplaatst, of
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: 7.3.b
    text: |-
      een vlakke vloer of rails, gelegen voor de hefinrichting waarop het koplamptestapparaat kan worden geplaatst,
      waarbij deze vloer of rails in een vlak moet zijn gelegen gelijk of evenwijdig aan de rijplaten van de
      hefinrichting.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: '7.4'
    text: De hefinrichting moet deugdelijk zijn en in een goede staat van onderhoud verkeren.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel7
  - number: '8'
    text: 'In de werkplaats is de volgende apparatuur aanwezig:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.a
    text: een uitlaatgastester met lambdabepaling;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.b
    text: |-
      een koplamptestapparaat welke voldoet aan [hoofdstuk 8, afdeling 4, paragraaf 12, van de Regeling voertuigen][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Paragraaf12
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025798
        paragraaf: '12'
  - number: 8.c
    text: een apparaat waarmee een gasconcentratie overeenkomende met 800 ppm koolwaterstoffen gedetecteerd kan worden, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.d
    text: |-
      een toerenteller die voldoet aan de [artikelen 8.4.15][ref1] en [8.4.16 van de Regeling voertuigen][ref2] en is
      voorzien van:


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
  - number: 8.d.1°
    text: een CE-markering met een aanvullende metrologische markering, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.d.2°
    text: |-
      een handleiding in de Nederlandse taal, waarin tenminste vermeld is een procedure voor het gebruik van de
      toerenteller;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.e
    text: |-
      een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn, al dan niet voorzien van een oplaadbare accu,
      die enerzijds een zodanige lichtsterkte heeft dat ook moeilijk bereikbare onderdelen van een voertuig voldoende
      helder kunnen worden verlicht om een nauwkeurige inspectie van een voertuig mogelijk te maken en die anderzijds
      zodanig is afgeschermd dat degene die de keuring uitvoert niet door het uitgestraalde licht wordt verblind;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.f
    text: een meetband met een minimale nauwkeurigheidsklasse III van voldoende lengte;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.g
    text: basisgereedschap voor de keuring van de inbouw van een gasinstallatie, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: 8.h
    text: een doelmatige bandenspanningsmeter en een doelmatige bandenpomp.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel8
  - number: '9'
    text: 'Ten aanzien van de uitlaatgastester met lambdabepaling moet de aanvrager beschikken over:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel9
  - number: 9.a
    text: |-
      de documenten als bedoeld in [artikel 8.1.4, onder b, van de Regeling voertuigen][ref1], of


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
  - number: 9.b
    text: |-
      een geldig certificaat van herkeuring als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref1] indien de
      documenten als bedoeld in [artikel 8.1.4, onder b, van de Regeling voertuigen][ref2] langer dan twaalf maanden
      geleden zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
  - number: '10'
    text: |-
      De apparatuur, bedoeld in [artikel 8][ref1], is deugdelijk en verkeert in een goede staat van onderhoud.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel8
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '11.1'
    text: |-
      In de werkplaats moet ten minste één persoon werkzaam zijn die in het bezit is van een geldig diploma LPG-
      technicus.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel11
  - number: '11.2'
    text: .
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel11
  - number: '12.1'
    text: |-
      Het exameninstituut IBKI van de Stichting VAM is belast met het afnemen van het examen voor het diploma LPG-
      technicus.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel12
  - number: '12.2'
    text: Het diploma LPG-technicus wordt afgegeven overeenkomstig een door de Dienst Wegverkeer goedgekeurd reglement.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel12
  - number: '12.3'
    text: |-
      De Dienst Wegverkeer bepaalt aan welke voorwaarden voldaan moet worden voordat deelgenomen kan worden aan het
      examen LPG-technicus. Deze voorwaarden worden in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel12
  - number: '14.1'
    text: |-
      Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend, als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo spoedig mogelijk schriftelijk in kennis te
      stellen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel14
  - number: '14.2'
    text: |-
      Indien als gevolg van een wijziging als bedoeld in het eerste lid de bedrijfsvoering van de natuurlijke persoon,
      de rechtspersoon of de rechtsvorm waaraan een erkenning gasinstallaties is verleend, wordt voortgezet door een
      andere natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem als bedoeld
      in [artikel 67][ref1] en de opgelegde sancties beschouwd als te zijn toegekend aan deze natuurlijke persoon of
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '15.1'
    text: |-
      De erkenninghouder verricht de keuring van gasinstallaties met inachtneming van de [artikelen 6.1][ref1],
      [6.2, tweede lid][ref2], en [6.3 van de Regeling voertuigen][ref3] en maakt gebruik van de in [artikel 6][ref4]
      vermelde apparatuur.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Artikel6
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0025732
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '15.2'
    text: De keuring van gasinstallaties vindt slechts plaats in de werkplaats waarvoor de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel15
  - number: '15.3'
    text: |-
      In de werkplaats worden slechts keuringen verricht van gasinstallaties in motorrijtuigen waarvoor de erkenning voor
      de betrokken werkplaats geldt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel15
  - number: '15.4'
    text: |-
      Het boekwerk ‘Regelgeving keuring gasinstallatie’ wordt door de erkenninghouder beschikbaar gesteld aan de LPG-
      technicus. De erkenninghouder draagt er tevens zorg voor dat de voorgeschreven boekwerken tot en met de laatste
      wijziging zijn bijgewerkt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel15
  - number: '16.1'
    text: |-
      Vanaf de buitenkant van elke werkplaats waarvoor de erkenning geldt, is op een door de Dienst Wegverkeer
      vastgestelde en in de Staatscourant bekendgemaakte wijze zichtbaar dat de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel16
  - number: '16.2'
    text: |-
      In elke werkplaats waarvoor de erkenning geldt, is de door de Dienst Wegverkeer afgegeven beschikking, waaruit
      blijkt dat voor de werkplaats een erkenning is verleend, aanwezig.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel16
  - number: '16.3'
    text: |-
      Op verzoek van de aanvrager van een keuring van een gasinstallatie wordt de in het tweede lid bedoelde beschikking
      ter inzage gegeven.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel16
  - number: '17'
    text: |-
      De werkplaats waarvoor de erkenning geldt, moet voortdurend blijven voldoen aan de in de
      [artikelen 4 tot en met 8][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel4
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '4'
        hoofdstuk: '1'
        afdeling: '2'
  - number: '18'
    text: |-
      In elke werkplaats waarvoor de erkenning geldt, is steeds ten minste één persoon werkzaam, die voldoet aan het
      vermelde in [artikel 9][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel9
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel18
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '9'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
  - number: '19'
    text: |-
      Aan een op grond van [artikel 23k van het Besluit voertuigen][ref1] bestaande verplichting wordt gevolg gegeven
      door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer door middel van de voorziening
      bedoeld in [artikel 6, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel23k
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel6
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel19
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: 23k
      - id: ref2
        bwb_id: BWBR0025732
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '20.1'
    text: De LPG-technicus controleert of hij beschikking heeft over het boekwerk ‘Regelgeving keuring gasinstallatie’.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel20
  - number: '20.2'
    text: 'Bij keuring van:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel20
  - number: 20.2.a
    text: een G3-installatie is de zogenaamde G3 fabrikantenverklaring aanwezig;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel20
  - number: 20.2.b
    text: |-
      een installatie volgens VN/ECE-reglement 115 is de inbouwhandleiding en een afschrift van de VN/ECE-goedkeuring
      aanwezig.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel20
  - number: '21.1'
    text: |-
      Indien bij de erkenninghouder een keuring van een gasinstallatie wordt aangevraagd, stelt deze, na overleg met
      de aanvrager, onverwijld het tijdstip voor de keuring vast. De keuring vindt zo spoedig mogelijk na de aanvraag
      plaats.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: '21.2'
    text: 'Er wordt geen keuring verricht dan nadat het kentekenregister is geraadpleegd ten aanzien van:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: 21.2.a
    text: het voor het voertuig opgegeven kenteken;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: 21.2.b
    text: het voertuigidentificatienummer van het ter keuring van de gasinstallatie aangeboden voertuig.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: '21.3'
    text: |-
      Er wordt geen keuring verricht en de aanvrager van een keuring van een gasinstallatie wordt naar de Dienst
      Wegverkeer doorverwezen indien:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: 21.3.a
    text: |-
      het raadplegen van het kentekenregister niet mogelijk is door een onjuiste combinatie van het kenteken en
      de laatste vier posities van het voertuigidentificatienummer of indien de laatste vier posities van het
      voertuigidentificatienummer niet bekend zijn;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: 21.3.b
    text: het voertuigidentificatienummer van het voertuig niet in overeenstemming is met het kentekenregister;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: 21.3.c
    text: |-
      in geval van een tenaamstelling met een beperkte geldigheidsduur als bedoeld in
      [artikel 40a van het Kentekenreglement][ref1], de tenaamstelling is vervallen;


      [ref1]: https://wetten.overheid.nl/BWBR0006951#Artikel40a
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0006951
        artikel: 40a
  - number: 21.3.d
    text: |-
      het aantal cilinders van de motor in het voertuig niet overeenkomt met het aantal cilinders vermeld in het
      kentekenregister.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: '21.4'
    text: |-
      Indien het raadplegen van de voertuiggegevens als gevolg van een storing in een door de Dienst Wegverkeer
      geaccepteerd netwerk als bedoeld in [artikel 6, vijfde lid][ref1], niet mogelijk is, wordt niet tot keuring van de
      gasinstallatie overgegaan.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel6
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '21.5'
    text: |-
      Indien het voertuig is voorzien van kentekenplaten dient het kentekennummer vermeld op de kentekenplaten overeen te
      komen met het kentekennummer zoals vermeld in het kentekenregister. Is dit niet het geval, dan wordt de aanvrager
      doorverwezen naar de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: '21.6'
    text: |-
      Het voertuigidentificatienummer dient zonder demontage van onderdelen van de gasinstallatie leesbaar te zijn. Is
      dit niet mogelijk, dan wordt de aanvrager doorverwezen naar de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel21
  - number: '22.1'
    text: Het voertuig wordt onmiddellijk na binnenkomst in de werkplaats op lekkage gecontroleerd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel22
  - number: '22.2'
    text: |-
      Ten einde het inademen van schadelijke uitlaatgassen zoveel mogelijk te beperken is tijdens het draaien van de
      motor een afvoerslang aan de uitlaat zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel22
  - number: '23.1'
    text: |-
      Tijdens de keuring van de gasinstallatie wordt met gebruikmaking van de apparatuur als bedoeld in
      [artikel 8][ref1] vastgesteld of het voertuig, inclusief de gasinstallatie, voldoet aan de [artikelen 6.1][ref2],
      [6.2, tweede lid][ref3], en [6.3 van de Regeling voertuigen][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref4]: https://wetten.overheid.nl/BWBR0025798#Artikel6
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '8'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref4
        bwb_id: BWBR0025798
        artikel: '6'
  - number: '23.2'
    text: |-
      Indien in het kentekenregister het veld van de datum eerste toelating niet is gevuld dan geldt de dag van
      keuring als datum eerste toelating voor de toepassing van de [artikelen 6.1][ref1], [6.2, tweede lid][ref2], en
      [6.3 van de Regeling voertuigen][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel6
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel6
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel23
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '6'
      - id: ref3
        bwb_id: BWBR0025798
        artikel: '6'
  - number: '24.1'
    text: |-
      Na afloop van elke keuring als bedoeld in [artikel 21][ref1] wordt het bepaalde in het tweede tot en met zevende
      lid in acht genomen, alvorens de opnamekaart gasinstallatie af te geven aan de aanvrager.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel21
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: '24.2'
    text: |-
      Voordat tot het afmelden als bedoeld in het derde lid wordt overgegaan, gaat de LPG-technicus die het voertuig
      afmeldt aan de hand van het kentekenregister na of de gasinstallatie van dat voertuig is goedgekeurd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: '24.3'
    text: |-
      Het voertuig wordt door middel van datacommunicatie bij de Dienst Wegverkeer afgemeld onder verstrekking van de
      volgende gegevens:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.3.a
    text: .
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.3.b
    text: het kenteken van het voertuig;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.3.c
    text: |-
      de meldcode, gevormd door de laatste vier cijfers van het voertuigidentificatienummer, letters en leestekens buiten
      beschouwing gelaten;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.3.d
    text: indien het een voertuig betreft dat is voorzien van een kilometerteller, de afgelezen tellerstand;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.3.e
    text: 'indien de keuring van de gasinstallatie de inbouw van een LPG-installatie betreft:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.3.e.1°
    text: merk en typegoedkeuringsnummer van de LPG-installatie;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.3.e.2°
    text: de totale inhoud van de aanwezige LPG-tanks.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: '24.4'
    text: 'Op de opnamekaart gasinstallatie moet schriftelijk worden vermeld:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.4.a
    text: het bepaalde in het derde lid, onderdeel a tot en met e;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.4.b
    text: indien het voertuig aan een steekproef wordt onderworpen, het einde van de wachttijd van de steekproef;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.4.c
    text: de naam, adresgegevens en het keuringsinstantienummer van de erkenninghouder;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: 24.4.d
    text: de transactiecode.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: '24.5'
    text: |-
      Voordat de opnamekaart gasinstallatie wordt ondertekend, wordt door de LPG-technicus nagegaan of de opnamekaart
      gasinstallatie volledig is ingevuld.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: '24.6'
    text: |-
      De opnamekaart gasinstallatie wordt onverwijld aan de aanvrager afgegeven indien de gasinstallatie niet aan een
      steekproef wordt onderworpen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: '24.7'
    text: |-
      Voor de opnamekaart gasinstallatie wordt gebruikt gemaakt van het door de Dienst Wegverkeer vastgestelde model
      opnamekaart gasinstallatie, zoals bekend gemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel24
  - number: '50'
    text: |-
      Voor het uitvoeren van de in [hoofdstuk 6 van de Regeling voertuigen][ref1] genoemde wijzigingen in de bouw of
      inrichting van ingevolge [hoofdstuk 3 van de wet][ref2] tot het verkeer op de weg toegelaten voertuigen, kan een
      GWC worden verleend, met uitzondering van de werkzaamheden bedoeld in [hoofdstuk 2][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0006622#HoofdstukIII
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006622
        hoofdstuk: III
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '2'
  - number: '51'
    text: |-
      Een erkenning GWC wordt uitsluitend verleend voor het uitvoeren van dat type wijzigingen waarvoor door de Dienst
      Wegverkeer een GWC is afgegeven.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel51
  - number: '52'
    text: |-
      Wijzigingen in de bouw of inrichting komen ten minste op de volgende punten met elkaar overeen, hetgeen wordt
      aangeduid als een type wijziging constructie:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel52
  - number: 52.a
    text: erkenninghouder;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel52
  - number: 52.b
    text: type (van de erkenninghouder);
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel52
  - number: 52.c
    text: 'omschrijving van de wijziging:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel52
  - number: 52.c.1°
    text: voertuiggegevens;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel52
  - number: 52.c.2°
    text: voertuigonderdelen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel52
  - number: '53'
    text: |-
      Een extra constructieplaat dient op het gewijzigde voertuig te worden aangebracht overeenkomstig het bepaalde in
      [richtlijn 2007/46/EG](32007L0046), bijlage XVII, punt 4.2.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel53
  - number: '54'
    text: |-
      De aanvrager moet beschikken over een adequaat systeem van maatregelen en procedures voor een effectieve controle
      van de productie om zeker te stellen dat geproduceerde wijzigingen in de bouw of inrichting met het goedgekeurde
      type wijziging overeenstemmen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel54
  - number: '55.1'
    text: 'De erkenninghouder draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: 55.1.a
    text: |-
      de relevante regelgeving, voorschriften, specificaties en documentatie betreffende de toe te passen materialen en
      onderdelen binnen het bedrijf beschikbaar en toegankelijk zijn voor het personeel;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: 55.1.b
    text: |-
      voldoende maatregelen en procedures voorzien in een effectieve controle, opdat de productie van wijzigingen in de
      bouw of inrichting overeenstemt met het goedgekeurde type wijziging;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: 55.1.c
    text: |-
      de administratie doelmatig en deugdelijk is, waardoor voldoende inzicht wordt geboden in de verschillende fasen die
      het voertuig tijdens en na fabricage van de wijziging doorloopt;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: 55.1.d
    text: |-
      de administratie omtrent geproduceerde wijzigingen in de constructie van voertuigen ten minste 10 jaar beschikbaar
      blijft, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: 55.1.e
    text: |-
      binnen de organisatie een persoon wordt aangewezen die als eerste verantwoordelijk is met betrekking tot het
      bovenstaande.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: '55.2'
    text: |-
      De werkplaats bestemd voor de in [artikel 50][ref1] genoemde wijzigingen:


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel50
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '50'
        hoofdstuk: '4'
        afdeling: '1'
  - number: 55.2.a
    text: is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van verwarming;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: 55.2.b
    text: |-
      heeft zodanige afmetingen en is zodanig ingericht dat de voertuigen die behoren tot de groep waarvoor de erkenning
      voor de betrokken werkplaats wordt aangevraagd, in deze werkplaats zodanig kunnen worden opgesteld dat zij van alle
      zijden goed toegankelijk zijn;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: 55.2.c
    text: |-
      de onder a bedoelde ruimte is voorzien van een doelmatige inspectieput of hefinrichting, die geschikt is voor deze
      gewijzigde voertuigen, en van doelmatige verlichting.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel55
  - number: '56'
    text: |-
      Onverminderd [artikel 69][ref1] is de erkenninghouder GWC verplicht medewerking te verlenen aan:


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel69
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '69'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 56.a
    text: |-
      het in overleg met de Dienst Wegverkeer treffen van een regeling omtrent de beschikbaarheid van gewijzigde
      voertuigen voor de uitoefening van het toezicht, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel56
  - number: 56.b
    text: het verlenen van assistentie bij het uitvoeren van de keuring.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel56
  - number: '57'
    text: |-
      Indien wordt vastgesteld dat de wijziging in de bouw of inrichting van het voertuig niet overeenstemt met het
      type waarvoor de goedkeuring is verleend, wordt door de functionaris van de Dienst Wegverkeer ter zake een rapport
      opgemaakt waarvan de erkenninghouder GWC een afschrift ontvangt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel57
  - number: '58'
    text: |-
      Indien niet wordt voldaan aan deze regeling vermelde verplichtingen, wordt de erkenninghouder GWC in staat gesteld
      de geconstateerde tekortkomingen binnen een door de Dienst Wegverkeer te bepalen termijn te herstellen en wordt
      het in [artikel 81][ref1] bedoelde toezicht verscherpt. Indien na die termijn wederom tekortkomingen worden
      geconstateerd, kan de erkenning worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel81
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '81'
        hoofdstuk: '5'
        afdeling: '3'
  - number: '59'
    text: |-
      De erkenninghouder stelt de door de Dienst Wegverkeer daartoe aangewezen functionarissen in de gelegenheid
      te onderzoeken of het type wijziging constructie, waarvoor goedkeuring wordt aangevraagd, voldoet aan
      [hoofdstuk 6 van de Regeling voertuigen][ref1] en stelt hiertoe één of meerdere exemplaren van het desbetreffende
      type ter beschikking. Een GWC wordt verleend indien het ter beschikking gestelde exemplaar voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
  - number: '60'
    text: |-
      Wanneer degene aan wie de GWC is verleend voornemens is een technische verandering aan te brengen in het type
      wijziging waarvoor de GWC is verleend, dan wel een verandering aan te brengen in het bedrijf waardoor wordt
      afgeweken van de gegevens zoals vermeld in de bedrijfsbeschrijving moet deze hiervan vooraf melding doen aan de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel60
  - number: '61'
    text: Aan de in de GWC gestelde voorschriften moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel61
  - number: '62.1'
    text: |-
      Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend, als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo spoedig mogelijk schriftelijk in kennis te
      stellen.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel62
  - number: '62.2'
    text: |-
      Indien als gevolg van een wijziging als bedoeld in het eerste lid de bedrijfsvoering van de natuurlijke persoon,
      de rechtspersoon of de rechtsvorm waaraan een erkenning GWC is verleend, wordt voortgezet door een andere
      natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem als bedoeld
      in [artikel 67][ref1] en de opgelegde sancties beschouwd als te zijn toegekend aan deze natuurlijke persoon of
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '63'
    text: |-
      Het bedrijf van de erkenninghouder moet voortdurend blijven voldoen aan de in [afdeling 1][ref1] van dit hoofdstuk
      opgenomen erkenningseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '4'
        afdeling: '1'
  - number: '64'
    text: |-
      De erkenninghouder dient voor elk gewijzigd voertuig vast te stellen dat aangebrachte wijzigingen geheel
      overeenstemmen met het type wijziging waarvoor de GWC is afgegeven.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel64
  - number: '65'
    text: |-
      Nadat een wijziging in de bouw of inrichting is aangebracht wordt voor elk gewijzigd voertuig een ombouwverklaring,
      conform het door de Dienst Wegverkeer vastgestelde model, compleet en volledig ingevuld.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel65
  - number: '66'
    text: De ombouwverklaring wordt binnen vijf werkdagen na de wijziging aan de Dienst Wegverkeer toegezonden.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66
  - number: 66a
    text: |-
      De aanvrager beschikt over een alcoholslot van een type waarvoor een typegoedkeuring is afgegeven, dan wel over
      een alcoholslot waarvan door de Dienst Wegverkeer is vastgesteld dat het voldoet aan bij ministeriële regeling
      vastgestelde eisen en waarvan door deze dienst is vastgesteld dat het productieproces van het desbetreffende
      alcoholslot voldoet aan de bij ministeriële regeling gestelde eisen, en waarvoor een typegoedkeuring is aangevraagd
      of tegelijk met de aanvraag voor een erkenning als bedoeld in [artikel 132f, eerste lid, van de wet][ref1] wordt
      aangevraagd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66a
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132f
  - number: 66b
    text: |-
      De aanvrager die niet tevens de fabrikant is, beschikt over een schriftelijk mandaat van de fabrikant dat hij
      namens hem gerechtigd is tot het aanvragen van de erkenning en tot het uitvoeren van alle werkzaamheden en
      activiteiten die voortvloeien uit die erkenning vanaf het moment dat de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66b
  - number: 66c.1
    text: |-
      De aanvrager beschikt over een landelijk netwerk van erkende installateurs alcoholslot, waarmee aantoonbaar een
      overeenkomst is gesloten. Dit netwerk voldoet aan de volgende eisen van bereikbaarheid:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66c
  - number: 66c.1.a
    text: de vaste werkplaatsen moeten hemelsbreed maximaal 60 km van elkaar afliggen;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66c
  - number: 66c.1.b
    text: er moet tenminste één vaste werkplaats per provincie zijn.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66c
  - number: 66c.2
    text: |-
      In de in het eerste lid bedoelde overeenkomst wordt in ieder geval ingegaan op de te treffen maatregelen ter
      bescherming van de persoonlijke levenssfeer van de deelnemer aan het alcoholslotprogramma en de betrouwbaarheid en
      de beveiliging van de te registreren gegevens.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66c
  - number: 66d.1
    text: |-
      De aanvrager beschikt over een kwaliteitssysteem om te borgen dat wordt voldaan en blijft worden voldaan aan de
      erkenningseisen en de erkenningsvoorschriften in [hoofdstuk 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66d
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: 4a
  - number: 66d.2
    text: |-
      Er is een schriftelijk stuk, ondertekend door de directie, waarin is vastgelegd dat de directie of een door
      de directie aangewezen vertegenwoordiger verantwoordelijk is voor het op peil houden van het in het eerste lid
      bedoelde kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66d
  - number: 66d.3
    text: |-
      De aanvrager beschikt over een adequaat systeem voor de controle en waar nodig herstel van
      uitgebouwde alcoholsloten teneinde vast te stellen dat deze voldoen aan de eisen, gesteld in
      [artikel 132e, eerste lid, van de wet][ref1], alvorens deze opnieuw worden aangeboden voor inbouw.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132e
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66d
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132e
  - number: 66e.1
    text: |-
      De aanvrager beschikt over een actuele opleiding en bijscholing ten behoeve van de erkenninghouder installateur
      alcoholslot en de door deze aangewezen medewerkers, waarin alle onderdelen worden behandeld die betrekking
      hebben op alle werkzaamheden, bedoeld in [artikel 132k, eerste lid, van de wet][ref1] en de daarmee samenhangende
      werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66e.2
    text: |-
      Aan de erkenninghouder installateur, alsmede de bij hem in dienst zijnde medewerkers die met goed gevolg de
      opleiding of de periodieke bijscholing, bedoeld in het eerste lid hebben gevolgd, verstrekt de erkenninghouder
      producent alcoholslot, hiervoor een bewijs, alsmede een gewaarmerkte kopie van dat bewijs.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66e
  - number: 66e.3
    text: |-
      De aanvrager beschikt over een handleiding ten behoeve van de erkenninghouder installateur alcoholslot en het
      bij hem werkzame personeel, aan de hand waarvan zij de personen aan wie deelname aan het alcoholslotprogramma is
      opgelegd moeten instrueren over zaken betreffende het alcoholslot, alsmede over het hierop betrekking hebbende
      instructiemateriaal dat door de erkenninghouder installateur alcoholslot aan deze personen ter hand moet worden
      gesteld, alsmede over procedures voor het ter beschikking stellen hiervan aan de erkenninghouder installateur
      alcoholslot.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66e
  - number: 66e.4
    text: 'De aanvrager beschikt over een helpdesk die tenminste voldoet aan de volgende eisen:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66e
  - number: 66e.4.a
    text: |-
      vragen van een erkenninghouder installateur alcoholslot die betrekking hebben op de werkzaamheden, bedoeld in
      [artikel 132k, eerste lid, van de wet][ref1] moeten van maandag tot en met vrijdag van 08.30 tot 17.00 uur kunnen
      worden beantwoord;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66e.4.b
    text: |-
      vragen van een deelnemer aan het alcoholslotprogramma over de technische aangelegenheden betreffende het
      alcoholslot en de werkzaamheden, bedoeld in [artikel 132k, eerste lid, van de wet][ref1] moeten gedurende zeven
      dagen per week en 24 uur per dag kunnen worden beantwoord.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66e
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66f.1
    text: |-
      De aanvrager beschikt over de benodigde voorschriften, specificaties, documentatie,
      werkplaatshandboeken, gereedschappen, apparatuur, software en updates voor de uitvoering van de in
      [artikel 132k, eerste lid, van de wet][ref1] bedoelde werkzaamheden ten behoeve van de erkenninghouder installateur
      alcoholslot, over een procedure om deze instrumenten periodiek te actualiseren en over procedures voor het tijdig
      ter beschikking stellen van deze instrumenten aan de erkenninghouder installateur alcoholslot.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66f
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66f.2
    text: |-
      Indien de vastlegging in het alcoholslotregister van de in artikel 132c, eerste lid, van het Reglement rijbewijzen
      bedoelde gegevens geschiedt via een registratie onder verantwoordelijkheid van de erkenninghouder producent
      alcoholslot, dan dient een bewerkersovereenkomst te zijn gesloten met de Dienst Wegverkeer waarin in ieder geval
      wordt ingegaan op de te treffen maatregelen ter bescherming van de persoonlijke levenssfeer van de deelnemer aan
      het alcoholslotprogramma en op de betrouwbaarheid en beveiliging van de te registreren gegevens.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66f
  - number: 66f.3
    text: |-
      De aanvrager draagt er zorg voor dat de overdracht van de gegevens uit het alcoholslot naar het alcoholslotregister
      plaatsvindt door middel van een beveiligd uitvoerbestand overeenkomstig een door de Dienst Wegverkeer vastgestelde
      structuurdefinitie en op een door die dienst geaccepteerde wijze.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66f
  - number: 66f.4
    text: |-
      De aanvrager beschikt over een adequate procedure om aanvragen voor een overbruggingscode als bedoeld in artikel 4
      van [bijlage XII bij de Regeling voertuigen][ref1] onverwijld af te handelen. De procedure voorziet in maatregelen
      om oneigenlijk gebruik van de code tegen te gaan. Bij de afhandeling van de aanvraag wordt tevens informatie
      verstrekt over wijze waarop die overbruggingscode voortijdig kan worden beëindigd.


      [ref1]: https://wetten.overheid.nl/BWBR0025798
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66f
    references:
      - id: ref1
        bwb_id: BWBR0025798
  - number: 66g.1
    text: |-
      De aanvrager beschikt over procedures voor het overnemen van de in [artikel 132k, eerste lid, van de wet][ref1]
      bedoelde werkzaamheden door een andere erkenninghouder installateur alcoholslot, voor het geval
      de erkenning, bedoeld in artikel 132k, eerste lid, van de wet wordt ingetrokken op grond van
      [artikel 132n, eerste lid, onderdeel a, of tweede lid, van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132n
  - number: 66g.2
    text: |-
      De aanvrager beschikt over procedures voor het ter beschikking stellen van de benodigde voorschriften,
      specificaties, documentatie, werkplaatshandboeken, gereedschappen, apparatuur, software en updates voor het
      uitlezen, het testen, de kalibratie, het onderhoud, en de verwijdering van het alcoholslot aan de Dienst
      Wegverkeer, alsmede aan de door de Dienst Wegverkeer te bepalen instantie of instanties, bedoeld in de
      [artikelen 132i, vijfde lid][ref1], en[132n, vijfde lid van de wet][ref2], indien de erkenning, bedoeld in de
      [artikelen 132f, eerste lid][ref3], wordt ingetrokken op grond van artikel 132i, van de wet.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132i
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132n
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel132f
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66g
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132i
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132n
      - id: ref3
        bwb_id: BWBR0006622
        artikel: 132f
  - number: 66h.1
    text: |-
      De erkenninghouder producent alcoholslot voldoet voortdurend aan de eisen en voorschriften in [hoofdstuk 4a][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4a
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66h
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: 4a
  - number: 66h.2
    text: |-
      De directie of de door de directie aangewezen vertegenwoordiger, bedoeld in [artikel 66d, tweede lid][ref1], is
      verantwoordelijk voor het op peil houden van het kwaliteitssysteem, bedoeld in artikel 66d, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66d
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66h
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66d
        hoofdstuk: 4a
        paragraaf: '2'
        afdeling: '1'
  - number: 66i.1
    text: |-
      De erkenninghouder producent alcoholslot beschikt over een doelmatige en deugdelijke administratie, waarmee
      voldoende inzicht wordt geboden in het leverings- en installatieproces van het alcoholslot, de controle
      van uitgebouwde alcoholsloten, de actualisering van specificaties, de beschikbaar gestelde documentatie, de
      werkplaatshandboeken, de helpdesk, gereedschappen, de apparatuur en software, de opleiding en begeleiding van de
      erkenninghouders installateur alcoholslot en de door hen aangewezen medewerkers, welke administratie tenminste vijf
      jaar beschikbaar blijft.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66i
  - number: 66i.2
    text: |-
      De administratie wordt na het verstrijken van de bewaartermijn, bedoeld in het eerste lid verwijderd en vernietigd
      op een wijze die bescherming van de persoonlijke levenssfeer van de deelnemer aan het alcoholslotprogramma
      waarborgt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66i
  - number: 66i.3
    text: |-
      De erkenninghouder producent alcoholslot beschikt over procedures om alcoholsloten die in het kader van een
      vermoeden van onregelmatigheden voor nader onderzoek zijn teruggezonden, binnen zes weken te onderzoeken.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66i
  - number: 66j.1
    text: |-
      De erkenninghouder producent alcoholslot controleert jaarlijks de apparatuur en de daarbij behorende software die
      door de erkenninghouder installateur alcoholslot worden gebruikt. Hiervan wordt een controlecertificaat overhandigd
      aan de installateur alcoholslot. Een kopie van het controlecertificaat wordt door de erkenninghouder producent
      alcoholslot opgenomen in zijn administratie.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66j
  - number: 66j.2
    text: |-
      De erkenninghouder producent alcoholslot draagt er zorg voor dat de in [artikel 66e][ref1] bedoelde voorschriften,
      specificaties, documentatie, werkplaatshandboeken, gereedschappen, apparatuur, software en updates en andere
      instrumenten voor de uitvoering van de in [artikel 132k, eerste lid, van de wet][ref2] bedoelde werkzaamheden,
      alsmede de aanpassingen daarvan, uiterlijk binnen drie werkdagen nadat deze beschikbaar zijn gekomen, beschikbaar
      zijn gesteld aan de erkenninghouder installateur alcoholslot.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66e
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66j
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66e
        hoofdstuk: 4a
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66k
    text: |-
      Indien de erkenninghouder producent alcoholslot voornemens is wijzigingen aan te brengen in de landelijke spreiding
      van installateurs alcoholslot, meldt hij dit onmiddellijk aan de Dienst Wegverkeer op een door deze dienst te
      bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66k
  - number: 66l
    text: |-
      Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel de
      natuurlijke persoon of de rechtspersoon aan wie de erkenning producent alcoholslot oorspronkelijk was verleend, als
      degene die de bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan onverwijld in kennis te stellen op
      een door deze dienst te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66l
  - number: 66m.1
    text: |-
      Indien als gevolg van een wijziging als bedoeld in [artikel 66l][ref1] de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm aan wie of waaraan de erkenning producent alcoholslot is verleend, wordt
      voortgezet door een andere natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het
      systeem, bedoeld in [artikel 67][ref2], geacht te zijn toegekend aan deze natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66l
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66m
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66l
        hoofdstuk: 4a
        paragraaf: '4'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 66m.2
    text: |-
      Indien als gevolg van een wijziging als bedoeld in [artikel 66l][ref1] de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm aan wie of waaraan de erkenning producent alcoholslot is verleend,
      wordt voortgezet door een andere natuurlijke persoon of rechtspersoon, worden de opgelegde sancties geacht te zijn
      opgelegd aan deze natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66l
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66m
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66l
        hoofdstuk: 4a
        paragraaf: '4'
        afdeling: '2'
  - number: 66n
    text: |-
      1. De aanvrager beschikt over een contract met een erkenninghouder producent alcoholslot dan wel de natuurlijke
      persoon of rechtspersoon die een aanvraag voor een erkenning als erkenninghouder producent alcoholslot heeft
      ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66n
  - number: 66o.1
    text: |-
      De aanvrager beschikt over een kwaliteitssysteem om te borgen dat wordt voldaan en blijft worden voldaan aan de
      erkenningseisen en de erkenningsvoorschriften in [hoofdstuk 4b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: 4b
  - number: 66o.2
    text: |-
      Er is een schriftelijk stuk, ondertekend door de directie, waarin is vastgelegd dat de directie of een door
      de directie aangewezen vertegenwoordiger verantwoordelijk is voor het op peil houden van het in het eerste lid
      bedoelde kwaliteitssysteem.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
  - number: 66o.3
    text: |-
      Met betrekking tot de volgende aspecten is de directie of de aangewezen vertegenwoordiger verantwoordelijk voor de
      juiste uitvoering van de aan die aspecten verbonden voorschriften en het nemen van maatregelen om ervoor te zorgen
      dat aan die voorschriften wordt voldaan:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
  - number: 66o.3.a
    text: de beheersing van documenten;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
  - number: 66o.3.b
    text: |-
      de werkzaamheden, bedoeld in [artikel 132k, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66o.3.c
    text: |-
      de beschikbaarheid van de laatste versie van de in [artikel 66q, eerste lid][ref1], bedoelde instrumenten;


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66q
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66q
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '1'
  - number: 66o.3.d
    text: |-
      de beschikbaarheid van voldoende opgeleid personen voor de uitvoering van de in
      [artikel 132k eerste lid, van de wet][ref1] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66o.4
    text: |-
      Tevens moet zijn vastgelegd wie de plaatsvervangers zijn van de in het eerste lid bedoelde personen. Indien
      er geen vervangers zijn aangewezen, is vastgelegd dat bij afwezigheid van een of meerdere van deze personen de
      desbetreffende werkzaamheden niet worden uitgevoerd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66o
  - number: 66p.1
    text: |-
      De aanvrager beschikt over een werkplaats bestemd en geschikt voor het uitvoeren van de in
      [artikel 132k, eerste lid][ref1], genoemde werkzaamheden. Elke werkplaats is overdekt, behoorlijk af te sluiten,
      goed verlicht en voorzien van verwarming.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66p
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66p.2
    text: |-
      De in het eerste lid bedoelde werkplaats heeft zodanige afmetingen en is zodanig ingericht dat de motorrijtuigen
      die behoren tot de categorie of categorieën waarin het alcoholslot kan worden ingebouwd in deze werkplaats zodanig
      kunnen worden opgesteld dat zij van alle kanten goed toegankelijk zijn.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66p
  - number: 66p.3
    text: |-
      In de in het eerste lid bedoelde werkplaats kan de administratie betreffende het alcoholslot behoorlijk worden
      uitgevoerd. Tevens is er een afsluitbare kast of bureaulade dan wel gelijkwaardige voorziening aanwezig, waarin
      waardepapieren zoals documentatie afgesloten kunnen worden opgeborgen. Indien het een erkenning voor een mobiele
      installatie-eenheid alcoholslot betreft, mag de genoemde voorziening ook in de mobiele installatie-eenheid
      alcoholslot zijn aangebracht.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66p
  - number: 66p.4
    text: |-
      In de in het eerste lid bedoelde werkplaats is een voorziening aanwezig voor het door middel van datacommunicatie
      melden van het inbouwen, het uitlezen, het testen, het kalibreren, het onderhouden, het vervangen en het
      verwijderen van alcoholsloten aan de Dienst Wegverkeer. Deze voorziening bestaat uit een computer of een terminal
      met een modem, geschikt is voor de toegangsstructuur van door de Dienst Wegverkeer geaccepteerde netwerken.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66p
  - number: 66p.5
    text: |-
      In de in het eerste lid bedoelde werkplaats is een apparaat aanwezig dat in ieder geval de barcode kan lezen die
      is vastgesteld op basis van ISO/IEC 15417:2007: Informatietechnologie – Automatische identificatie en data capture-
      technieken – Code 128a streepjescode symbologie specificatie.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66p
  - number: 66q.1
    text: |-
      De aanvrager beschikt over alle voor de in [artikel 132k, eerste lid, van de wet][ref1] bedoelde werkzaamheden
      relevante regelgeving en benodigde voorschriften, specificaties, documentatie, werkplaatshandboeken,
      gereedschappen, apparatuur, software en updates in de meest recente versie.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66q
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66q.2
    text: |-
      Deze apparatuur en software wordt jaarlijks door de producent van het alcoholslot of een door hem aangewezen
      deskundige gecontroleerd. Van deze controle is in de werkplaats een bewijs aanwezig in de vorm van een certificaat.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66q
  - number: 66q.3
    text: |-
      De aanvrager beschikt over een verzegelinrichting en verzegelmateriaal dat geschikt is voor het gevoerde type
      alcoholslot.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66q
  - number: 66r.1
    text: |-
      De aanvrager of het door hem aangewezen personeel heeft met goed gevolg een door de erkenninghouder producent
      alcoholslot aangeboden cursus gevolgd over de aspecten die van belang zijn voor de uitvoering van de werkzaamheden,
      bedoeld in [artikel 132k, eerste lid, van de wet][ref1], alsmede over de wettelijke voorschriften met betrekking
      tot hun bij of krachtens de wet aangewezen taken in het kader van het alcoholslotprogramma en hebben hiervoor een
      bewijs ontvangen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66r
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66r.2
    text: |-
      De in het eerste lid genoemde personen zijn door de aanvrager van de erkenning installateur alcoholslot aangemeld
      bij de Dienst Wegverkeer op een door deze dienst bepaalde wijze. Bij de aanmelding tonen zij door middel van
      het in het eerste lid bedoelde bewijs aan dat zij met goed gevolg de cursus hebben afgerond. Dit bewijs is in de
      werkplaats aanwezig.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66r
  - number: 66r.3
    text: |-
      Ten bewijze van de verleende bevoegdheid verstrekt de Dienst Wegverkeer de betrokken persoon een bewijs van
      bevoegdheid overeenkomstig een door de Dienst Wegverkeer vastgesteld model, dat in de werkplaats aanwezig moet
      zijn.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66r
  - number: 66r.4
    text: |-
      Onverminderd het eerste lid moet de aanvrager van een erkenning installateur alcoholslot, dan wel het door hem
      aangewezen personeel, beschikken over actuele kennis betreffende de in het kader van de erkenning te voeren type
      alcoholslot. Hiertoe worden tenminste eenmaal per twee jaar bijscholingscursussen gevolgd. Het tweede lid is van
      overeenkomstige toepassing.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66r
  - number: 66s.1
    text: |-
      De erkenninghouder installateur alcoholslot voldoet voortdurend aan de voor hem geldende eisen en voorschriften
      in [hoofdstuk 4b][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66s
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: 4b
  - number: 66s.2
    text: |-
      De erkenninghouder installateur alcoholslot neemt bij de uitvoering van de hem bij of krachtens de wet opgelegde
      taken in het kader van het alcoholslotprogramma het bij of krachtens de wet bepaalde in acht.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66s
  - number: 66s.3
    text: |-
      De directie of de door de directie aangewezen vertegenwoordiger, bedoeld in [artikel 66o, tweede lid][ref1], is
      verantwoordelijk voor het op peil houden van het kwaliteitssysteem, bedoeld in artikel 66o, eerste lid.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66o
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66s
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66o
        hoofdstuk: 4b
        paragraaf: '2'
        afdeling: '1'
  - number: 66t
    text: |-
      Aan de binnenkant van elke werkplaats waarvoor de erkenning geldt, is op een door de Dienst Wegverkeer vastgestelde
      en in de Staatscourant bekendgemaakte wijze zichtbaar dat de erkenning is verleend.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66t
  - number: 66u.1
    text: |-
      De werkzaamheden, bedoeld in [artikel 132k, eerste lid, van de wet][ref1] worden uitsluitend verricht door de in
      [artikel 66r][ref2] bedoelde personen.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66u
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
      - id: ref2
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
  - number: 66u.2
    text: |-
      Wijzigingen in en aanvullingen op de in het eerste lid bedoelde personen worden onverwijld gemeld aan de Dienst
      Wegverkeer op een door deze dienst te bepalen wijze.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66u
  - number: 66u.3
    text: |-
      In elke werkplaats is gedurende de openingstijden van de desbetreffende werkplaats ten minste één persoon aanwezig
      die bevoegd is tot het uitvoeren van de in [artikel 132k, eerste lid, van de wet][ref1] bedoelde werkzaamheden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66u
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66v
    text: |-
      Een ieder die is betrokken bij de uitvoering van de bij of krachtens de wet gestelde bepalingen betreffende het
      alcoholslotprogramma en daarbij de beschikking krijgt over gegevens waarvan hij het vertrouwelijke karakter kent
      of redelijkerwijs moet vermoeden en voor wie niet reeds uit hoofde van ambt, beroep of wettelijk voorschift ter
      zake van die gegevens een geheimhoudingsplicht geldt, is verplicht tot geheimhouding daarvan, behoudens voor zover
      enig wettelijk voorschrift hem tot bekendmaking verplicht of uit zijn taak bij de uitvoering van deze regeling de
      noodzaak tot bekendmaking voortvloeit.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66v
  - number: 66w
    text: |-
      De werkzaamheden bedoeld in [artikel 132k, eerste lid, van de wet][ref1] worden uitsluitend verricht in de
      werkplaats die in de erkenning is vermeld.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66w
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66x
    text: |-
      De erkenninghouder installateur alcoholslot die gebruik maakt van de erkenning als mobiele installatie-
      eenheid is ervoor verantwoordelijk dat de inrichting waarin hij zijn werkzaamheden uitvoert, voldoet aan de in
      [artikel 66p][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66p
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66x
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66p
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '1'
  - number: 66y.1
    text: |-
      In de werkplaats, die in de erkenning is vermeld, is een afschrift van de beschikking waaruit blijkt dat de
      erkenning is verleend en welke bevoegdheden daaraan zijn verbonden, aanwezig. Deze beschikking wordt op verzoek ter
      inzage gegeven aan klanten.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66y
  - number: 66y.2
    text: |-
      De erkenninghouder installateur alcoholslot die gebruik maakt van de erkenning als mobiele installatie-eenheid
      draagt er zorg voor dat hij te allen tijde een afschrift van de beschikking bij zich heeft waaruit blijkt dat de
      erkenning installateur alcoholslot en de erkenning voor de mobiele installatie-eenheid zijn verleend, voor welke
      inrichtingen die geldt en welke bevoegdheden daaraan zijn verbonden. Deze beschikkingen worden op verzoek ter
      inzage gegeven aan klanten.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66y
  - number: 66z.1
    text: |-
      De erkenninghouder installateur alcoholslot draagt er zorg voor dat de bij hem of bij de door hem aangewezen
      personen in gebruik zijnde voorschriften, specificaties, documentatie, werkplaatshandboeken, gereedschappen,
      apparatuur, software en updates en apparatuur bestemd voor het uitvoeren van de in [artikel 132k van de wet][ref1]
      bedoelde werkzaamheden, alsmede de aan hem verstrekte toegangscodes, niet toegankelijk zijn voor onbevoegden.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66z
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66z.2
    text: |-
      De erkenninghouder installateur alcoholslot draagt er zorg voor dat de bij hem of bij de door hem aangewezen
      personen in gebruik zijnde verzegelinrichting alsmede de aan hem verstrekte toegangscodes niet toegankelijk zijn
      voor onbevoegden.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66z
  - number: 66aa.1
    text: |-
      De erkenninghouder installateur alcoholslot draagt er zorg voor dat de in [artikel 66f][ref1] bedoelde
      voorschriften, specificaties, documentatie, werkplaatshandboeken, gereedschappen, apparatuur, software en updates
      voor de uitvoering van de in [artikel 132k, eerste lid, van de wet][ref2] bedoelde werkzaamheden beschikbaar
      zijn voor de in [artikel 66r ][ref3]bedoelde personen en dat de aanpassingen daarvan onverwijld aan deze personen
      beschikbaar worden gesteld.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66f
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66aa
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66f
        hoofdstuk: 4a
        paragraaf: '2'
        afdeling: '1'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: 132k
      - id: ref3
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
  - number: 66aa.2
    text: |-
      De erkenninghouder installateur alcoholslot draagt er zorg voor dat de werkzaamheden, bedoeld in
      [artikel 132k, eerste lid, van de wet][ref1] tenminste van maandag tot en met vrijdag van 08.30 uur tot 17.00 uur
      kunnen worden uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66aa
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66aa.3
    text: |-
      De erkenninghouder installateur alcoholslot draagt zorg voor een behoorlijke instructie over het alcoholslot aan
      degene aan wie deelname aan het alcoholslotprogramma is opgelegd. Hiertoe wordt, overeenkomstig de instructie van
      de erkenninghouder producent alcoholslot:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66aa
  - number: 66aa.3.a
    text: |-
      uitleg gegeven over de inbouw, het functioneren, het gebruik van en het omgaan met en de uitbouw van het
      alcoholslot en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66aa
  - number: 66aa.3.b
    text: schriftelijke informatie hierover verstrekt aan degene aan wie deelname aan het alcoholslotprogramma is opgelegd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66aa
  - number: 66aa.4
    text: |-
      De erkenninghouder installateur alcoholslot maakt hierbij gebruik van het door de erkenninghouder producent
      alcoholslot verstrekte materiaal.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66aa
  - number: 66aa.5
    text: |-
      De erkenninghouder installateur alcoholslot laat degene aan wie deelname aan het alcoholslotprogramma is opgelegd
      een verklaring van een door de Dienst Wegverkeer vastgesteld model ondertekenen dat hij instructie heeft ontvangen
      over de werking en het gebruik van het alcoholslot.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66aa
  - number: 66bb
    text: 'De erkenninghouder draagt er zorg voor dat:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66bb
  - number: 66bb.a
    text: |-
      de administratie doelmatig en deugdelijk is, waardoor voldoende inzicht wordt geboden in de fasen van de
      werkzaamheden, bedoeld in [artikel 132k, eerste lid, van de wet][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66bb
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66bb.b
    text: |-
      de administratie verband houdende met de uitvoering van de werkzaamheden, bedoeld in
      [artikel 132k, eerste lid, van de wet][ref1], waaronder in ieder geval worden verstaan de uitleesrapporten en de
      steekproefcontrolerapporten, ten minste vijf jaar na de uitbouw van het alcoholslot beschikbaar blijft;


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132k
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66bb
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132k
  - number: 66bb.c
    text: |-
      de administratie omtrent ingebouwde alcoholsloten ten minste vijf jaar na de uitbouw van het alcoholslot
      beschikbaar blijft;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66bb
  - number: 66bb.d
    text: |-
      de administratie na het verstrijken van de bewaartermijn, bedoeld in onderdelen b en c wordt verwijderd
      en vernietigd op een wijze die bescherming van de persoonlijke levenssfeer van de deelnemer aan het
      alcoholslotprogramma waarborgt;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66bb
  - number: 66bb.e
    text: |-
      binnen de organisatie een persoon is aangewezen die als eerste verantwoordelijk is voor de eisen opgenomen in de
      onderdelen a tot en met d.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66bb
  - number: 66bb1
    text: |-
      Aan een op grond van [artikel 23k van het Besluit voertuigen][ref1] bestaande verplichting wordt gevolg gegeven
      door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer door middel van de voorziening
      bedoeld in [artikel 66p, vierde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel23k
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel66p
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66bb1
    references:
      - id: ref1
        bwb_id: BWBR0025554
        artikel: 23k
      - id: ref2
        bwb_id: BWBR0025732
        artikel: 66p
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '1'
  - number: 66cc
    text: |-
      Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend, als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan onverwijld in kennis te stellen op de door deze
      dienst bepaalde wijze.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66cc
  - number: 66dd
    text: |-
      Indien als gevolg van een wijziging als bedoeld in artikel 66cc de bedrijfsvoering van de natuurlijke persoon,
      de rechtspersoon of de rechtsvorm waaraan een erkenning alcoholslot installateur is verleend, wordt voortgezet
      door een andere natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem,
      bedoeld in [artikel 67][ref1], beschouwd als te zijn toegekend aan deze natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66dd
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: 66ee
    text: |-
      Indien als gevolg van een wijziging als bedoeld in [artikel 66cc][ref1] de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm waaraan een alcoholslot installateur, wordt voortgezet door een andere
      natuurlijke persoon of rechtspersoon, worden de opgelegde sancties beschouwd als te zijn toegekend aan deze
      natuurlijke persoon of rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66cc
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ee
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66cc
        hoofdstuk: 4b
        paragraaf: '2'
        afdeling: '2'
  - number: 66ff.1
    text: Alvorens het alcoholslot wordt gekalibreerd, vindt eerst een visuele controle plaats van het alcoholslot.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ff
  - number: 66ff.2
    text: |-
      De erkenninghouder installateur alcoholslot of de daartoe bevoegde medewerker maakt, na aanmelding overeenkomstig
      [artikel 66ss][ref1], melding in het alcoholslotregister indien hij bij de visuele controle een of meer van de
      volgende feiten heeft geconstateerd:


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ss
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ff
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ss
        hoofdstuk: 4b
        paragraaf: '8'
        afdeling: '2'
  - number: 66ff.2.a
    text: onregelmatigheden met betrekking tot de bedrading;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ff
  - number: 66ff.2.b
    text: onregelmatigheden met betrekking tot de behuizing;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ff
  - number: 66ff.2.c
    text: onregelmatigheden met betrekking tot de aansluitpunten;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ff
  - number: 66ff.2.d
    text: onregelmatigheden met betrekking tot de software, of
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ff
  - number: 66ff.2.e
    text: onregelmatigheden met betrekking tot de verzegeling.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ff
  - number: 66gg.1
    text: 'Het alcoholslot wordt gekalibreerd:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
  - number: 66gg.1.a
    text: na inbouw van het alcoholslot;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
  - number: 66gg.1.b
    text: voorafgaand aan elke uitlezing van de gegevens uit het alcoholslot;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
  - number: 66gg.1.c
    text: na elk onderhoud van het alcoholslot;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
  - number: 66gg.1.d
    text: |-
      na afloop van de in [artikel 76, eerste lid, onderdeel a][ref1], bedoelde termijn dan wel na beëindiging van het
      toezicht door de in [artikel 158 van de wet][ref2] bedoelde toezichthouder.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel76
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel158
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '158'
  - number: 66gg.2
    text: |-
      Voor het kalibreren wordt gebruik gemaakt van een kalibratie-inrichting waarmee, bij doorvoering van gecertificeerd
      kalibratiegas, het alcoholslot kan worden gekalibreerd.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
  - number: 66gg.3
    text: |-
      Voor de kalibratie wordt gebruik gemaakt van een gecertificeerd kalibratiegas dat is gecertificeerd of
      vervaardigd door een op grond van [artikel 8.2.12van de Regeling voertuigen][ref1] erkende inrichting ten behoeve
      van het gebruik bij kalibratie bij type-onderzoek of individueel onderzoek van alcoholsloten, steekproeven
      op alcoholsloten en bij het inbouwen, uitlezen of onderhouden van alcoholsloten en dat voldoet aan de in
      [artikel 8.4.89a, eerste lid][ref2], van die regeling opgenomen eisen en is vervaardigd overeenkomstig de in
      artikel 8.4.89a, tweede lid, van die regeling opgenomen eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
    references:
      - id: ref1
        bwb_id: BWBR0025798
        artikel: '8'
      - id: ref2
        bwb_id: BWBR0025798
        artikel: '8'
  - number: 66gg.4
    text: Kalibratie vindt plaats overeenkomstig de voorschriften van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
  - number: 66gg.5
    text: |-
      Het kalibratiegas wordt bewaard overeenkomstig de voorschriften voor bewaring van de producent van het
      kalibratiegas.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66gg
  - number: 66hh.1
    text: Het alcoholslot wordt gejusteerd indien het resultaat van de kalibratie daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66hh
  - number: 66hh.2
    text: Justering vindt plaats overeenkomstig de voorschriften van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66hh
  - number: 66ii
    text: |-
      Bij het inbouwen, inclusief het inbouwen in verband met een vervanging van het alcoholslot door een ander
      exemplaar, wordt uitsluitend gebruik gemaakt van een alcoholslot dat is vermeld in de erkenning en dat voldoet aan
      een door de Dienst Wegverkeer afgegeven typegoedkeuring.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ii
  - number: 66jj
    text: |-
      Installatie vindt uitsluitend plaats in een motorrijtuig dat nog niet is voorzien van een alcoholslot, dan wel
      dat, indien een reeds ingebouwd alcoholslot niet kan worden uitgebouwd, is voorzien van een alcoholslot waarvan de
      visuele delen zijn verwijderd en het alcoholslot onklaar is gemaakt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66jj
  - number: 66kk
    text: |-
      Het alcoholslot wordt ingebouwd met behulp van de in [artikel 66q ][ref1]bedoelde gereedschappen en apparatuur
      en met inachtneming van de door de fabrikant van het alcoholslot ten aanzien van het desbetreffende merk en type
      gegeven installatie-instructies.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66q
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66kk
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66q
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '1'
  - number: 66ll
    text: |-
      Het alcoholslot wordt, indien van toepassing, in overeenstemming met het ter zake bepaalde installatievoorschrift
      verzegeld overeenkomstig het verzegelplan dat door de erkenninghouder producent alcoholslot is opgesteld bij het
      desbetreffende alcoholslot.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ll
  - number: 66mm
    text: |-
      [Artikel 66ff][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ff
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66mm
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ff
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '2'
  - number: 6nn
    text: |-
      Het alcoholslot wordt uitsluitend uitgelezen met door de erkenninghouder producent alcoholslot voorgeschreven
      apparatuur.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel6nn
  - number: 66oo.1
    text: |-
      De erkenninghouder installateur alcoholslot houdt zich aan de afspraken die met de erkenninghouder producent
      alcoholslot in de in [artikel 66c, eerste lid][ref1], bedoelde overeenkomst zijn gemaakt over de eisen ter
      beveiliging van de persoonlijke levenssfeer van de deelnemer en de betrouwbaarheid en beveiliging van de te
      registreren gegevens.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66c
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66oo
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66c
        hoofdstuk: 4a
        paragraaf: '2'
        afdeling: '1'
  - number: 66oo.2
    text: |-
      Nadat de uit het alcoholslot uitgelezen gegevens langs elektronische weg zijn verwerkt in het alcoholslotregister
      en ter bevestiging hiervan de erkenninghouder installateur alcoholslot een door de Dienst Wegverkeer vastgestelde
      code is terugontvangen, worden de gegevens uit het alcoholslot gewist.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66oo
  - number: 66oo.3
    text: |-
      Het wissen van de bestanden, bedoeld in het tweede lid, vindt, indien een steekproef als bedoeld in
      [artikel 76][ref1] worden uitgevoerd indien de steekproef is afgerond.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel76
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66oo
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '76'
        hoofdstuk: '5'
        paragraaf: '2'
        afdeling: '2'
  - number: 66oo.4
    text: |-
      De installateur overhandigt de deelnemer, als bewijs dat de gegevens correct zijn uitgelezen en verzonden, een
      uitleesrapport conform een door de Dienst Wegverkeer vastgesteld model.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66oo
  - number: 66pp
    text: |-
      [Artikel 66ff][ref1] is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ff
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66pp
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ff
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '2'
  - number: 66qq.1
    text: |-
      De erkenninghouder installateur alcoholslot kan uitsluitend de in het werkplaatshandboek genoemde
      onderhoudswerkzaamheden verrichten.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66qq
  - number: 66qq.2
    text: Onderhoud van het alcoholslot vindt plaats overeenkomstig de instructies van de fabrikant.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66qq
  - number: 66rr
    text: |-
      Het alcoholslot wordt uitgebouwd met inachtneming van de door de fabrikant ten aanzien van het desbetreffende merk
      en type alcoholslot gegeven instructies.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66rr
  - number: 66ss
    text: |-
      De verwerking van de gegevens, bedoeld in deze paragraaf, vindt plaatsdoor middel van datacommunicatie, op de
      volgende wijze:
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ss
  - number: 66ss.a
    text: |-
      de persoon, bedoeld in [artikel 66r][ref1] identificeert en authenticiteert zich op de wijze, zoals voorgeschreven
      door de Dienst Wegverkeer;


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ss
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
  - number: 66ss.b
    text: |-
      bij de verwerking van de gegevens in het alcoholslotregister wordt gebruik gemaakt van het kenteken, alsmede van de
      meldcode die wordt gevormd door de laatste vier cijfers van het identificatienummer, letters en leestekens buiten
      beschouwing gelaten.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66ss
  - number: 66tt.1
    text: |-
      Na aanmelding overeenkomstig [artikel 66ss][ref1], verwerkt de in [artikel 66r][ref2] bedoelde persoon de volgende
      gegevens:


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ss
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ss
        hoofdstuk: 4b
        paragraaf: '8'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
  - number: 66tt.1.a
    text: |-
      na elke inbouw de in artikel 132c, eerste lid, onderdelen e, f en j, van het Reglement rijbewijzen bedoelde
      gegevens in het alcoholslotregister;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: 66tt.1.b
    text: |-
      na elke uitlezing de in artikel 132c, eerste lid, onderdelen h, j en k, van het Reglement rijbewijzen bedoelde
      gegevens in het alcoholslotregister;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: 66tt.1.c
    text: |-
      na elk onderhoud de in artikel 132c, eerste lid, onderdelen i, j en k, van het Reglement rijbewijzen bedoelde
      gegevens in het alcoholslotregister;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: 66tt.1.d
    text: |-
      na elke uitbouw de in artikel 132c, eerste lid, onderdelen j, k en m, van het Reglement rijbewijzen bedoelde
      gegevens in het alcoholslotregister.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: 66tt.2
    text: |-
      Na aanmelding overeenkomstig [artikel 66ss][ref1], controleert de erkenninghouder installateur alcoholslot of:
      in [artikel 66r][ref2] bedoelde persoon de in artikel 132c, eerste lid, onderdelen e en i, van het Reglement
      rijbewijzen bedoelde gegevens in het alcoholslotregister en past deze indien nodig aan:


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel66ss
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel66r
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: 66ss
        hoofdstuk: 4b
        paragraaf: '8'
        afdeling: '2'
      - id: ref2
        bwb_id: BWBR0025732
        artikel: 66r
        hoofdstuk: 4b
        paragraaf: '4'
        afdeling: '1'
  - number: 66tt.2.a
    text: na elke kalibratie en justering;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: 66tt.2.b
    text: na elke uitlezing;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: 66tt.2.c
    text: na elk onderhoud, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: 66tt.2.d
    text: na elke uitbouw.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel66tt
  - number: '67.1'
    text: |-
      De Dienst Wegverkeer kan in het kader van het toezicht op de erkenninghouder of de erkenninghouder installateur
      alcoholslot een systeem van bonus- en strafpunten vaststellen, dat wordt bekendgemaakt in de Staatscourant.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel67
  - number: '67.2'
    text: |-
      Indien een systeem als bedoeld in het eerste lid is vastgesteld, wordt aan de hand daarvan, afhankelijk van de
      resultaten van het uitgeoefende toezicht, beoordeeld of het toezicht wordt verminderd of verscherpt dan wel of een
      erkenning wordt gewijzigd of ingetrokken.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel67
  - number: '67.3'
    text: 'De Dienst Wegverkeer begint terstond de procedure tot intrekking van de erkenning, indien:'
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel67
  - number: 67.3.a
    text: |-
      de erkenninghouder de in [hoofdstuk 2, afdeling 3, paragraaf 2][ref1], vermelde verplichtingen niet heeft
      nageleefd, of


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: 67.3.b
    text: |-
      indien de erkenninghouder installateur alcoholslot de in
      [hoofdstuk 4b, afdeling 2, paragraaf 3 tot en met 8][ref1], vermelde verplichtingen niet heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: 4b
        paragraaf: '3'
        afdeling: '2'
  - number: '68'
    text: |-
      Bij schorsing van een erkenning kan worden bepaald dat, indien niet binnen een termijn van ten hoogste 12 weken
      wordt aangetoond dat weer aan de erkenningseisen of erkenningsvoorschriften wordt voldaan, alsnog wijziging of
      intrekking van de erkenning volgt.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel68
  - number: '69'
    text: |-
      Onverminderd het bepaalde in de [hoofdstukken 2][ref1], [4][ref2], [4a][ref3] en [4b][ref4], wordt in het kader
      van het toezicht alle medewerking aan de daartoe aangewezen functionarissen van de Dienst Wegverkeer verleend.
      Hieronder wordt in ieder geval verstaan:


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4a
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: 4a
      - id: ref4
        bwb_id: BWBR0025732
        hoofdstuk: 4b
  - number: 69.a
    text: het verlenen van toegang tot de werkplaats, inrichting, of mobiele installatie-eenheid;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel69
  - number: 69.b
    text: het verstrekken van inlichtingen;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel69
  - number: 69.c
    text: het overleggen van bescheiden;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel69
  - number: 69.d
    text: het gebruik maken van de benodigde apparatuur;
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel69
  - number: 69.e
    text: het in acht nemen van door de betreffende functionaris van de Dienst Wegverkeer aangegeven aanwijzingen, en
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel69
  - number: 69.f
    text: |-
      het gedurende de gehele steekproef aanwezig en beschikbaar zijn van mobiele installatie-eenheden op het perceel
      waar de installaties worden verricht.
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel69
  - number: '70.1'
    text: |-
      Het in [artikel 102, van de wet][ref1], bedoelde toezicht ter zake van de in [hoofdstuk 2][ref2] vermelde
      werkzaamheden, geschiedt met inachtneming van de in [afdeling 2][ref3] van dit hoofdstuk daaromtrent gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '102'
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '2'
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '5'
        afdeling: '2'
  - number: '70.2'
    text: |-
      Het in [artikel 102 van de wet][ref1], bedoelde toezicht ter zake van de in [hoofdstuk 4][ref2] vermelde
      werkzaamheden, geschiedt met inachtneming van de in [afdeling 3][ref3] van dit hoofdstuk daaromtrent gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: '102'
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '4'
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '5'
        afdeling: '3'
  - number: '70.3'
    text: |-
      Het in [artikel 132h van de wet][ref1] bedoelde toezicht ter zake van de in [hoofdstuk 4a][ref2] genoemde
      werkzaamheden geschiedt met inachtneming van de in [afdeling 4][ref3] van dit hoofdstuk daaromtrent gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132h
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4a
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#Artikel70
    references:
      - id: ref1
        bwb_id: BWBR0006622
        artikel: 132h
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: 4a
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '5'
        afdeling: '4'
  - number: '70.4'
    text: |-
      Het in [artikel 132m van de wet][ref1], bedoelde toezicht ter zake van de in [hoofdstuk 4b][ref2] genoemde
      werkzaamheden geschiedt met inachtneming van de in [afdeling 2][ref3] van dit hoofdstuk daaromtrent gegeven
      voorschriften


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel132m
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4b
