preamble:
  text: |-
    Gelet op de artikelen 99, tweede en derde lid, 100, derde lid, 101, eerste en tweede lid, 102, derde lid, en 103a
    van de Wegenverkeerswet 1994;

    Besluit:
  url: https://wetten.overheid.nl/BWBR0025732/2014-01-01#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In deze regeling wordt verstaan onder: - *erkenning GWC:* een erkenning om de in [hoofdstuk 4][ref1] van deze
      regeling vermelde werkzaamheden te verrichten;
        - *erkenning installateur alcoholslot:* erkenning als bedoeld in artikel [132k, eerste lid, van de wet][ref2] om de
      in dat artikel vermelde werkzaamheden te verrichten;
        - *erkenning gasinstallaties:* erkenning om de installatie van LPG-gasinstallaties in motorrijtuigen te keuren;
        - *erkenning producent alcoholslot:* erkenning als bedoeld in [artikel 132f, eerste lid, van de wet][ref3] om de in
      dat artikel vermelde werkzaamheden te verrichten;
        - *erkenning wijziging constructie:* een erkenning als bedoeld in [artikel 100 van de wet][ref4] die kan bestaan
      uit een erkenning GWC of een erkenning gasinstallaties;
        - *erkenninghouder:* houder van een erkenning als bedoeld in [artikel 100 van de wet][ref5];
        - *erkenninghouder installateur alcoholslot:* houder van een erkenning als bedoeld in
      [artikel 132k, eerste lid, van de wet][ref6];
        - *erkenninghouder producent alcoholslot:* houder van een erkenning als bedoeld in artikel
      [132f, eerste lid, van de wet][ref7];
        - *Goedkeuring Wijziging Constructie (GWC):* een goedkeuring, verleend voor een bepaald type wijziging van een
      constructie van een tot het verkeer op de weg toegelaten voertuig;
        - *inrichting:* bedrijf of bedrijven waarin de mobiele installatie-eenheid alcoholslot gerechtigd is werkzaamheden
      als bedoeld in [artikel 132k, eerste lid, van de wet][ref8], uit te voeren;
        - *kalibreren:* verrichten van handelingen die nodig zijn voor het bepalen van de waarden van de afwijking van
      een meetmiddel ten opzichte van een overeengekomen standaard, alsmede justeren indien de afwijking groter is dan
      is toegestaan;
        - *keuring:* keuring als bedoeld in [artikel 98 van de wet][ref9];
        - *keuringseisen:* op de desbetreffende voertuigcategorie op basis van de [Regeling voertuigen][ref10]
      toepasselijke toelatingseisen en permanente eisen;
        - *LPG-technicus:* persoon die beschikt over een diploma als bedoeld in [artikel 11][ref11] en die bij de Dienst
      Wegverkeer is aangemeld;
        - *mobiele installatie-eenheid alcoholslot:* installatie-eenheid waarmee een erkenninghouder installateur
      alcoholslot niet steeds in dezelfde inrichting, maar afwisselend in ten minste drie verschillende inrichtingen,
      werkzaamheden betreffende het alcoholslot, bedoeld in [artikel 132k, eerste lid, van de wet][ref12] mag verrichten;
        - *onderzoeksgerechtigde:* erkende onderneming of instelling die gerechtigd is tot het afgeven van certificaten van
      herkeuring ten aanzien van bepaalde categorieën meetmiddelen die in gebruik zijn bij erkenninghouders;
        - *opnamekaart gasinstallatie:* bewijs volgens een door de Dienst Wegverkeer vastgesteld model dat de
      gasinstallatie overeenkomstig deze regeling is gekeurd;
        - *steekproef:* de steekproefsgewijze herkeuring als bedoeld in de [artikelen 102][ref13],
      [132e, vierde lid][ref14], en [132m van de wet][ref15];
        - *werkplaats:* een perceel of enkele kadastraal aangrenzende percelen waar een erkenninghouder als bedoeld in
      [artikel 100 van de wet][ref16] of een erkenninghouder als bedoeld in [artikel 132k, eerste lid, van de wet][ref17]
      zijn werkzaamheden verricht. De ruimte kan bestaan uit één of meer besloten ruimten gelegen in één gebouw, dan wel
      in verscheidene belendende of nagenoeg belendende gebouwen, bedoeld om deel uit te maken van een werkplaats;
        - *wijziging constructie:* wijziging in de bouw of inrichting van een ingevolge [hoofdstuk 3 van de wet][ref18] tot
      het verkeer op de weg toegelaten voertuig;
        - *wet:* [wegenverkeerswet 1994][ref19].


