  - number: '16'
    text: |-
      1 Vanaf de buitenkant van elke werkplaats waarvoor de erkenning geldt, is op een door de Dienst Wegverkeer
      vastgestelde en in de Staatscourant bekendgemaakte wijze zichtbaar dat de erkenning is verleend.

      2 In elke werkplaats waarvoor de erkenning geldt, is de door de Dienst Wegverkeer afgegeven beschikking, waaruit
      blijkt dat voor de werkplaats een erkenning is verleend, aanwezig.

      3 Op verzoek van de aanvrager van een keuring van een gasinstallatie wordt de in het tweede lid bedoelde
      beschikking ter inzage gegeven.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel16
  - number: '17'
    text: |-
      De werkplaats waarvoor de erkenning geldt, moet voortdurend blijven voldoen aan de in de
      [artikelen 6 tot en met 10][ref1] gestelde eisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel6
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '6'
        hoofdstuk: '2'
        paragraaf: '1'
        afdeling: '1'
  - number: '18'
    text: |-
      In elke werkplaats waarvoor de erkenning geldt, is steeds ten minste één persoon werkzaam, die voldoet aan het
      vermelde in [artikel 11][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel11
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel18
