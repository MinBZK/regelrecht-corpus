  - number: '73'
    text: |-
      1 Nadat een erkenning is verleend wordt in beginsel eenmaal per twee jaar door middel van een
      herschouwing onderzocht of de erkenninghouder en de werkplaats nog voldoen aan de erkenningseisen en of de
      erkenningsvoorschriften worden nageleefd.

      2 De in het eerste lid bedoelde controle kan tevens plaatsvinden in het kader van een steekproef van het voertuig.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel73
  - number: '74'
    text: |-
      1 Deze paragraaf laat onverlet de bevoegdheid tot wijziging, schorsing of intrekking van de erkenning als
      omschreven in [artikel 103][ref1], in andere gevallen dan die in deze paragraaf zijn beschreven.

      2 De in [artikel 103][ref2] bedoelde wijziging of intrekking van de erkenning bij het niet voldoen aan de
      erkenningseisen of erkenningsvoorschriften, zal beperkt blijven tot de werkzaamheden waarvoor de erkenning is
      verleend.

      3 De in [artikel 103][ref3] bedoelde wijziging of intrekking van de erkenning bij het niet voldoen aan de
      erkenningseisen of erkenningsvoorschriften, zal, indien de erkenninghouder een erkenning heeft voor meerdere
      werkplaatsen, beperkt blijven tot de desbetreffende werkplaats.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel103
      [ref3]: https://wetten.overheid.nl/BWBR0006622#Artikel103
