  - number: '24'
    text: |-
      1 Na afloop van elke keuring als bedoeld in [artikel 21][ref1] wordt het bepaalde in het tweede tot en met zevende
      lid in acht genomen, alvorens de opnamekaart gasinstallatie af te geven aan de aanvrager.

      2 Voordat tot het afmelden als bedoeld in het derde lid wordt overgegaan, gaat de LPG-technicus die het voertuig
      afmeldt aan de hand van het kentekenregister na of de gasinstallatie van dat voertuig is goedgekeurd.

      3 Het voertuig wordt door middel van datacommunicatie bij de Dienst Wegverkeer afgemeld onder verstrekking van de
      volgende gegevens:

      a. het pasnummer en de pincode van de LPG-technicus;

      b. het kenteken van het voertuig;

      c. de meldcode, gevormd door de laatste vier cijfers van het voertuigidentificatienummer, letters en leestekens
      buiten beschouwing gelaten;

      d. indien het een voertuig betreft dat is voorzien van een kilometerteller, de afgelezen tellerstand;

      e. indien de keuring van de gasinstallatie de inbouw van een LPG-installatie betreft:

      1°. merk en typegoedkeuringsnummer van de LPG-installatie;

      2°. de totale inhoud van de aanwezige LPG-tanks.

      4 Op de opnamekaart gasinstallatie moet schriftelijk worden vermeld:

      a. het bepaalde in het derde lid, onderdeel a tot en met e;

      b. indien het voertuig aan een steekproef wordt onderworpen, het einde van de wachttijd van de steekproef;

      c. de naam, adresgegevens en het keuringsinstantienummer van de erkenninghouder;

      d. de transactiecode.

      5 Voordat de opnamekaart gasinstallatie wordt ondertekend, wordt door de LPG-technicus nagegaan of de opnamekaart
      gasinstallatie volledig is ingevuld.

      6 De opnamekaart gasinstallatie wordt onverwijld aan de aanvrager afgegeven indien de gasinstallatie niet aan een
      steekproef wordt onderworpen.

      7 Voor de opnamekaart gasinstallatie wordt gebruikt gemaakt van het door de Dienst Wegverkeer vastgestelde model
      opnamekaart gasinstallatie, zoals bekend gemaakt in de Staatscourant.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel21
