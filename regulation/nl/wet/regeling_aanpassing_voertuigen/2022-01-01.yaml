  - number: '22'
    text: |-
      1 Het voertuig wordt onmiddellijk na binnenkomst in de werkplaats op lekkage gecontroleerd.

      2 Ten einde het inademen van schadelijke uitlaatgassen zoveel mogelijk te beperken is tijdens het draaien van de
      motor een afvoerslang aan de uitlaat zijn bevestigd.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel22
  - number: '23'
    text: |-
      1 Tijdens de keuring van de gasinstallatie wordt met gebruikmaking van de apparatuur als bedoeld in
      [artikel 8][ref1] vastgesteld of het voertuig, inclusief de gasinstallatie, voldoet aan de [artikelen 6.1][ref2],
      [6.2, tweede lid][ref3], en [6.3 van de Regeling voertuigen][ref4].

      2 Indien in het kentekenregister het veld van de datum eerste toelating niet is gevuld dan geldt de dag van
      keuring als datum eerste toelating voor de toepassing van de [artikelen 6.1][ref5], [6.2, tweede lid][ref6], en
      [6.3 van de Regeling voertuigen][ref7].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel8
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel6.1
