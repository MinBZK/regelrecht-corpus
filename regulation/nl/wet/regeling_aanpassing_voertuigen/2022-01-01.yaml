  - number: '83'
    text: |-
      Erkenningen en bevoegdheden die zijn verleend krachtens de [Erkenningsregeling snelheidsbegrenzers][ref1] en de
      [LPG-erkenningsregeling][ref2], zoals die regelingen luidden voor de inwerkingtreding van deze regeling, worden
      gelijkgesteld met erkenningen en bevoegdheden die zijn verleend krachtens deze regeling.


