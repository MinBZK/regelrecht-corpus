        hoofdstuk: '4'
      - id: ref6
        bwb_id: BWBR0025732
        hoofdstuk: '5'
        afdeling: '3'
  - number: '71'
    text: |-
      1 De in het kader van toezicht opgelegde steekproef dan wel herschouwing wordt uitgevoerd door de Dienst Wegverkeer
      aangewezen functionaris en vindt plaats in de werkplaats waar de wijziging heeft plaatsgevonden.

      2 Bij de steekproef wordt andermaal onderzocht of de wijziging overeenkomstig de eisen, bedoeld in de
      [hoofdstukken 2][ref1] of [4][ref2], zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel71
