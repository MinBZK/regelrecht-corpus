        paragraaf: '3'
        afdeling: '1'
  - number: '19'
    text: |-
      Aan een op grond van [artikel 23k van het Besluit voertuigen][ref1] bestaande verplichting wordt gevolg gegeven
      door de tellerstand van een motorrijtuig te verstrekken aan de Dienst Wegverkeer door middel van de voorziening
      bedoeld in [artikel 6, vijfde lid][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0025554#Artikel23k
