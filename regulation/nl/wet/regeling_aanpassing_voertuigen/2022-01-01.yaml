articles:
  - number: '1'
    text: |-
      1 In deze regeling wordt verstaan onder:

        - *erkenning GWC:* een erkenning om de in [hoofdstuk 4][ref1] van deze regeling vermelde werkzaamheden te
      verrichten;
        - *erkenning gasinstallaties:* erkenning om de installatie van LPG-gasinstallaties in motorrijtuigen te keuren;
        - *erkenning wijziging constructie:* een erkenning als bedoeld in [artikel 100 van de wet][ref2] die kan bestaan
      uit een erkenning GWC of een erkenning gasinstallaties;
        - *erkenninghouder:* houder van een erkenning als bedoeld in [artikel 100 van de wet][ref3];
        - *Goedkeuring Wijziging Constructie (GWC):* een goedkeuring, verleend voor een bepaald type wijziging van een
      constructie van een tot het verkeer op de weg toegelaten voertuig;
        - *kalibreren:* verrichten van handelingen die nodig zijn voor het bepalen van de waarden van de afwijking van
      een meetmiddel ten opzichte van een overeengekomen standaard, alsmede justeren indien de afwijking groter is dan
      is toegestaan;
        - *keuring:* keuring als bedoeld in [artikel 98 van de wet][ref4];
        - *keuringseisen:* voor de desbetreffende voertuigcategorie geldende goedkeuringseisen als bedoeld in
      [artikel 21, tweede lid, van de wet][ref5];
        - *LPG-technicus:* persoon die beschikt over een diploma als bedoeld in [artikel 11][ref6] en die bij de Dienst
      Wegverkeer is aangemeld;
        - *onderzoeksgerechtigde:* erkende onderneming of instelling die gerechtigd is tot het afgeven van certificaten van
      herkeuring ten aanzien van bepaalde categorieën meetmiddelen die in gebruik zijn bij erkenninghouders;
        - *opnamekaart gasinstallatie:* bewijs volgens een door de Dienst Wegverkeer vastgesteld model dat de
      gasinstallatie overeenkomstig deze regeling is gekeurd;
        - *steekproef:* de steekproefsgewijze herkeuring als bedoeld in [artikel 102][ref7] van de wet;
        - *werkplaats:* een perceel of enkele kadastraal aangrenzende percelen waar een erkenninghouder als bedoeld in
      [artikel 100 van de wet][ref8] zijn werkzaamheden verricht. De ruimte kan bestaan uit één of meer besloten ruimten
      gelegen in één gebouw, dan wel in verscheidene belendende of nagenoeg belendende gebouwen, bedoeld om deel uit te
      maken van een werkplaats;
        - *wijziging constructie:* wijziging in de bouw of inrichting na een goedkeuring van een voertuig als bedoeld in
      [artikel 21, tweede lid, van de wet][ref9];
        - *wet:* [Wegenverkeerswet 1994](onbekend).

      2 [Artikel 1.3 van de Regeling voertuigen][ref10] is van overeenkomstige toepassing.


