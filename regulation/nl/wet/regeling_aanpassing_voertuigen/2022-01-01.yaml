  - number: '2'
    text: |-
      1 Een erkenning wijziging constructie kan worden verleend aan een natuurlijk persoon of rechtspersoon voor een of
      meer in Nederland gevestigde werkplaatsen, ter zake van de in [hoofdstuk 2][ref1] met betrekking tot een erkenning
      gasinstallaties of in [hoofdstuk 4][ref2] met betrekking tot een erkenning GWC aangegeven werkzaamheden.

      2 Een erkenning wijziging constructie kan op aanvraag worden verleend indien wordt voldaan aan de in
      [hoofdstuk 2][ref3] of [4][ref4] gestelde erkenningseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
