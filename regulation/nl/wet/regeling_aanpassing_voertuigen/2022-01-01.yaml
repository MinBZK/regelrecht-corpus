        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '6'
    text: |-
      1 De werkplaats bestemd voor het keuren van gasinstallaties is overdekt, behoorlijk af te sluiten, goed verlicht en
      voorzien van verwarming.

      2 De in het eerste lid bedoelde ruimte heeft zodanige afmetingen en is zodanig ingericht dat de motorvoertuigen
      die behoren tot de groep waarvoor de erkenning voor de betrokken werkplaats wordt aangevraagd in deze werkplaats
      zodanig kunnen worden opgesteld dat zij van alle zijden goed toegankelijk zijn.

      3 In de in het eerste lid bedoelde ruimte is een voorziening aanwezig waarmee uitlaatgassen en andere gassen direct
      door een daartoe bestemde opening naar buiten kunnen worden gevoerd.

      4 In de in het eerste lid bedoelde ruimte kan de administratie van de keuringen behoorlijk worden uitgevoerd.

      5 In de werkplaats is een voorziening aanwezig die geschikt is voor het gebruik van datacommunicatie. Deze
      voorziening bestaat uit een computer of terminal met een modem, geschikt voor de toegangsstructuur van door de
      Dienst Wegverkeer geaccepteerde netwerken. Tevens is een voorziening aanwezig, geschikt voor aansluiting op de
      datacommunicatie, ten behoeve van het afdrukken van opnamekaarten gasinstallatie.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel6
  - number: '7'
    text: |-
      1 In de werkplaats bestemd voor het keuren van gasinstallaties is een doelmatige inspectieput of hefinrichting
      aanwezig die geschikt is voor de groep motorvoertuigen waarvoor de erkenning voor de betrokken werkplaats wordt
      aangevraagd en die is voorzien van een doelmatige verlichting. Wanneer niet duidelijk blijkt wat het draagvermogen
      van een hefinrichting is, wordt hiervoor door de fabrikant of een onafhankelijk instituut een verklaring
      overgelegd. Het draagvermogen wordt zichtbaar op de hefinrichting aangebracht.

      2 De in het eerste lid bedoelde inspectieput of hefinrichting is zodanig uitgevoerd dat de LPG-technicus in staat
      is de onderkant van een voertuig nagenoeg over de hele lengte rechtopstaand te inspecteren, hetgeen betekent dat
      wanneer de erkenning wordt aangevraagd voor:

      a. voertuigen waarvan de toegestane maximummassa meer bedraagt dan 3.500 kg, de hefinrichting een hefhoogte heeft
      van ten minste 1,35 m en de inspectieput een diepte heeft van ten minste 1,35 m;

      b. voertuigen waarvan de toegestane maximummassa niet meer bedraagt dan 3.500 kg, de hefinrichting een hefhoogte
      heeft van ten minste 1,65 m en de inspectieput een diepte heeft van ten minste 1,55 m.

      3 De hefinrichting moet deugdelijk zijn en in een goede staat van onderhoud verkeren.

      4 In geval van een aanvraag van een erkenning voor de keuring van motorrijtuigen is ten behoeve van de controle van
      de afstelling van dimlichten en mistvoorlichten een aangewezen plaats aanwezig, waarbij het volgende van toepassing
      is:

      a. de locatie waar de afstelling van de lichten gecontroleerd wordt, moet duidelijk gemarkeerd zijn in de
      keuringsruimte. Deze locatie moet voldoen aan de volgende voorschriften:

      1°. een horizontale vlakke vloer van voldoende afmetingen waarop gelijktijdig zowel het te keuren voertuig als het
      koplamptestapparaat kan worden geplaatst; of

      2°. een horizontaal geplaatste hefinrichting waarop gelijktijdig het koplamptestapparaat en het te keuren voertuig
      kan worden geplaatst; of

      3°. een horizontaal geplaatste hefinrichting waarop het te keuren voertuig kan worden geplaatst met voor de
      hefinrichting een horizontale vlakke vloer of rails. De vloer of de rails moeten zich in hetzelfde horizontale vlak
      als de hefinrichting bevinden. De rails moeten zich haaks op de rijplaten van de hefinrichting bevinden.

      b. Indien het koplamptestapparaat ontworpen is voor uitsluitend gebruik op rails moeten deze rails aanwezig zijn en
      zich in hetzelfde horizontale vlak als de vloer of hefinrichting bevinden.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel7
  - number: '8'
    text: |-
      In de werkplaats is de volgende apparatuur aanwezig:

      a. een uitlaatgastester met lambdabepaling;

      b. een koplamptestapparaat welke voldoet aan
      [hoofdstuk 8, afdeling 4, paragraaf 12, van de Regeling voertuigen][ref1];

      c. een apparaat waarmee een gasconcentratie overeenkomende met 800 ppm koolwaterstoffen gedetecteerd kan worden, en

      d. een toerenteller die voldoet aan de [artikelen 8.4.15][ref2] en [8.4.16 van de Regeling voertuigen][ref3] en is
      voorzien van:

      1°. een CE-markering met een aanvullende metrologische markering, en

      2°. een handleiding in de Nederlandse taal, waarin ten minste vermeld is een procedure voor het gebruik van de
      toerenteller;

      e. een dubbel geïsoleerde veiligheidslooplamp dan wel een zaklantaarn, al dan niet voorzien van een oplaadbare
      accu, die enerzijds een zodanige lichtsterkte heeft dat ook moeilijk bereikbare onderdelen van een voertuig
      voldoende helder kunnen worden verlicht om een nauwkeurige inspectie van een voertuig mogelijk te maken en die
      anderzijds zodanig is afgeschermd dat degene die de keuring uitvoert niet door het uitgestraalde licht wordt
      verblind;

      f. een meetband met een minimale nauwkeurigheidsklasse III van voldoende lengte;

      g. basisgereedschap voor de keuring van de inbouw van een gasinstallatie, en

      h. een doelmatige bandenspanningsmeter en een doelmatige bandenpomp.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Paragraaf12
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8.4.15
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel8.4.16
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel8
