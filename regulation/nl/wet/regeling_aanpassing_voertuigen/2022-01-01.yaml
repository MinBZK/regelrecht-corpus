  - number: '11'
    text: |-
      1 In de werkplaats moet ten minste één persoon werkzaam zijn die in het bezit is van een geldig diploma LPG-
      technicus.

      2 De LPG-technicus beschikt over een pas met een pincode verstrekt door de Dienst Wegverkeer ten behoeve van de
      afmelding, bedoeld in [artikel 21, derde lid][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel21
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '21'
        hoofdstuk: '2'
        paragraaf: '2'
        afdeling: '4'
  - number: '12'
    text: |-
      1 Het exameninstituut IBKI van de Stichting VAM is belast met het afnemen van het examen voor het diploma LPG-
      technicus.

      2 Het diploma LPG-technicus wordt afgegeven overeenkomstig een door de Dienst Wegverkeer goedgekeurd reglement.

      3 De Dienst Wegverkeer bepaalt aan welke voorwaarden voldaan moet worden voordat deelgenomen kan worden aan het
      examen LPG-technicus. Deze voorwaarden worden in de Staatscourant bekend gemaakt.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel12
  - number: '13'
    text: |-
      1 De pas, bedoeld in [artikel 11, tweede lid][ref1], wordt op aanvraag verstrekt aan personen die een afschrift
      overleggen van het diploma LPG-technicus.

      2 De pas is vier jaar geldig. De geldigheid wordt met vier jaar verlengd als de LPG-technicus met goed gevolg een
      toets heeft afgelegd bij het IBKI.

      3 De toets wordt afgenomen overeenkomstig een door de Stichting VAM vastgesteld en een door de Dienst Wegverkeer
      goedgekeurd reglement.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel11
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel13
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '11'
        hoofdstuk: '2'
        paragraaf: '3'
        afdeling: '1'
  - number: '14'
    text: |-
      1 Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend, als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo spoedig mogelijk schriftelijk in kennis te
      stellen.

      2 Indien als gevolg van een wijziging als bedoeld in het eerste lid de bedrijfsvoering van de natuurlijke persoon,
      de rechtspersoon of de rechtsvorm waaraan een erkenning gasinstallaties is verleend, wordt voortgezet door een
      andere natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem als bedoeld
      in [artikel 67][ref1] en de opgelegde sancties beschouwd als te zijn toegekend aan deze natuurlijke persoon of
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel14
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '15'
    text: |-
      1 De erkenninghouder verricht de keuring van gasinstallaties met inachtneming van de [artikelen 6.1][ref1],
      [6.2, tweede lid][ref2], en [6.3 van de Regeling voertuigen][ref3] en maakt gebruik van de in [artikel 6][ref4]
      vermelde apparatuur.

      2 De keuring van gasinstallaties vindt slechts plaats in de werkplaats waarvoor de erkenning is verleend.

      3 In de werkplaats worden slechts keuringen verricht van gasinstallaties in motorrijtuigen waarvoor de erkenning
      voor de betrokken werkplaats geldt.

      4 Het boekwerk ‘Regelgeving keuring gasinstallatie’ wordt door de erkenninghouder beschikbaar gesteld aan de LPG-
      technicus. De erkenninghouder draagt er tevens zorg voor dat de voorgeschreven boekwerken tot en met de laatste
      wijziging zijn bijgewerkt.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel6.1
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel6.2
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel6.3
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Artikel6
