    text: |-
      In afwijking van [artikel 11, eerste lid][ref1], overleggen personen die in het bezit zijn van een diploma LPG-
      technicus afgegeven voor 1 januari 2014 bij de aanvraag voor de pas, een afschrift van dat diploma en een afschrift
