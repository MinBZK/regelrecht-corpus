  - number: '75'
    text: |-
      1 In het kader van het toezicht kan steekproefsgewijs herkeuring plaatsvinden van de in voertuigen aangebrachte
      wijziging waarvoor de erkenning is verleend.

      2 Bij de steekproef wordt andermaal onderzocht of de wijziging overeenkomstig de eisen, bedoeld in
      [hoofdstukken 2][ref1] of [4][ref2], zijn uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
