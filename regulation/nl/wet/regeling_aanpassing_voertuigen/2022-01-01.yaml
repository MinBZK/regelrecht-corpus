  - number: '50'
    text: |-
      Voor het uitvoeren van de in [hoofdstuk 6 van de Regeling voertuigen][ref1] genoemde wijzigingen in de bouw of
      inrichting van een voertuig dat is goedgekeurd als bedoeld in [artikel 21, tweede lid, van de wet][ref2], kan een
      GWC worden verleend, met uitzondering van de werkzaamheden bedoeld in [hoofdstuk 2][ref3] van deze regeling.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
      [ref2]: https://wetten.overheid.nl/BWBR0006622#Artikel21
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel50
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
      - id: ref2
        bwb_id: BWBR0006622
        artikel: '21'
      - id: ref3
        bwb_id: BWBR0025732
        hoofdstuk: '2'
  - number: '51'
    text: |-
      Een erkenning GWC wordt uitsluitend verleend voor het uitvoeren van dat type wijzigingen waarvoor door de Dienst
      Wegverkeer een GWC is afgegeven.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel51
  - number: '52'
    text: |-
      Wijzigingen in de bouw of inrichting komen ten minste op de volgende punten met elkaar overeen, hetgeen wordt
      aangeduid als een type wijziging constructie:

      a. erkenninghouder;

      b. type (van de erkenninghouder);

      c. omschrijving van de wijziging:

      1°. voertuiggegevens;

      2°. voertuigonderdelen.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel52
  - number: '53'
    text: |-
      Een extra constructieplaat dient op het gewijzigde voertuig te worden aangebracht overeenkomstig bijlage IX van
      verordening (EU) 2018/858.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel53
  - number: '54'
    text: |-
      De aanvrager moet beschikken over een adequaat systeem van maatregelen en procedures voor een effectieve controle
      van de productie om zeker te stellen dat geproduceerde wijzigingen in de bouw of inrichting met het goedgekeurde
      type wijziging overeenstemmen.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel54
  - number: '55'
    text: |-
      1 De erkenninghouder draagt er zorg voor dat:

      a. de relevante regelgeving, voorschriften, specificaties en documentatie betreffende de toe te passen materialen
      en onderdelen binnen het bedrijf beschikbaar en toegankelijk zijn voor het personeel;

      b. voldoende maatregelen en procedures voorzien in een effectieve controle, opdat de productie van wijzigingen in
      de bouw of inrichting overeenstemt met het goedgekeurde type wijziging;

      c. de administratie doelmatig en deugdelijk is, waardoor voldoende inzicht wordt geboden in de verschillende fasen
      die het voertuig tijdens en na fabricage van de wijziging doorloopt;

      d. de administratie omtrent geproduceerde wijzigingen in de constructie van voertuigen ten minste 10 jaar
      beschikbaar blijft, en

      e. binnen de organisatie een persoon wordt aangewezen die als eerste verantwoordelijk is met betrekking tot het
      bovenstaande.

      2 De werkplaats bestemd voor de in [artikel 50][ref1] genoemde wijzigingen:

      a. is overdekt, behoorlijk af te sluiten, goed verlicht en voorzien van verwarming;

      b. heeft zodanige afmetingen en is zodanig ingericht dat de voertuigen die behoren tot de groep waarvoor de
      erkenning voor de betrokken werkplaats wordt aangevraagd, in deze werkplaats zodanig kunnen worden opgesteld dat
      zij van alle zijden goed toegankelijk zijn;

      c. de onder a bedoelde ruimte is voorzien van een doelmatige inspectieput of hefinrichting, die geschikt is voor
      deze gewijzigde voertuigen, en van doelmatige verlichting.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel50
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel55
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '50'
        hoofdstuk: '4'
        afdeling: '1'
  - number: '56'
    text: |-
      Onverminderd [artikel 69][ref1] is de erkenninghouder GWC verplicht medewerking te verlenen aan:

      a. het in overleg met de Dienst Wegverkeer treffen van een regeling omtrent de beschikbaarheid van gewijzigde
      voertuigen voor de uitoefening van het toezicht, en

      b. het verlenen van assistentie bij het uitvoeren van de keuring.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel69
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel56
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '69'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '57'
    text: |-
      Indien wordt vastgesteld dat de wijziging in de bouw of inrichting van het voertuig niet overeenstemt met het
      type waarvoor de goedkeuring is verleend, wordt door de functionaris van de Dienst Wegverkeer ter zake een rapport
      opgemaakt waarvan de erkenninghouder GWC een afschrift ontvangt.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel57
  - number: '58'
    text: |-
      Indien niet wordt voldaan aan deze regeling vermelde verplichtingen, wordt de erkenninghouder GWC in staat gesteld
      de geconstateerde tekortkomingen binnen een door de Dienst Wegverkeer te bepalen termijn te herstellen en wordt
      het in [artikel 81][ref1] bedoelde toezicht verscherpt. Indien na die termijn wederom tekortkomingen worden
      geconstateerd, kan de erkenning worden ingetrokken.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel81
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel58
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '81'
        hoofdstuk: '5'
        afdeling: '3'
  - number: '59'
    text: |-
      De erkenninghouder stelt de door de Dienst Wegverkeer daartoe aangewezen functionarissen in de gelegenheid
      te onderzoeken of het type wijziging constructie, waarvoor goedkeuring wordt aangevraagd, voldoet aan
      [hoofdstuk 6 van de Regeling voertuigen][ref1] en stelt hiertoe één of meerdere exemplaren van het desbetreffende
      type ter beschikking. Een GWC wordt verleend indien het ter beschikking gestelde exemplaar voldoet.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Hoofdstuk6
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel59
    references:
      - id: ref1
        bwb_id: BWBR0025798
        hoofdstuk: '6'
  - number: '60'
    text: |-
      Wanneer degene aan wie de GWC is verleend voornemens is een technische verandering aan te brengen in het type
      wijziging waarvoor de GWC is verleend, dan wel een verandering aan te brengen in het bedrijf waardoor wordt
      afgeweken van de gegevens zoals vermeld in de bedrijfsbeschrijving moet deze hiervan vooraf melding doen aan de
      Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel60
  - number: '61'
    text: Aan de in de GWC gestelde voorschriften moet worden voldaan.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel61
  - number: '62'
    text: |-
      1 Indien zich een wijziging voordoet van de natuurlijke persoon, de rechtspersoon of de rechtsvorm, zijn zowel
      de natuurlijke persoon of rechtspersoon aan wie de erkenning oorspronkelijk was verleend, als degene die de
      bedrijfsvoering voortzet, verplicht de Dienst Wegverkeer hiervan zo spoedig mogelijk schriftelijk in kennis te
      stellen.

      2 Indien als gevolg van een wijziging als bedoeld in het eerste lid de bedrijfsvoering van de natuurlijke
      persoon, de rechtspersoon of de rechtsvorm waaraan een erkenning GWC is verleend, wordt voortgezet door een andere
      natuurlijke persoon of rechtspersoon, worden de toegekende bonus- en strafpunten van het systeem als bedoeld
      in [artikel 67][ref1] en de opgelegde sancties beschouwd als te zijn toegekend aan deze natuurlijke persoon of
      rechtspersoon.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel62
    references:
      - id: ref1
        bwb_id: BWBR0025732
        artikel: '67'
        hoofdstuk: '5'
        afdeling: '1'
  - number: '63'
    text: |-
      Het bedrijf van de erkenninghouder moet voortdurend blijven voldoen aan de in [afdeling 1][ref1] van dit hoofdstuk
      opgenomen erkenningseisen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel63
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '4'
        afdeling: '1'
  - number: '64'
    text: |-
      De erkenninghouder dient voor elk gewijzigd voertuig vast te stellen dat aangebrachte wijzigingen geheel
      overeenstemmen met het type wijziging waarvoor de GWC is afgegeven.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel64
  - number: '65'
    text: |-
      Nadat een wijziging in de bouw of inrichting is aangebracht wordt voor elk gewijzigd voertuig een ombouwverklaring,
      conform het door de Dienst Wegverkeer vastgestelde model, compleet en volledig ingevuld.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel65
  - number: '66'
    text: De ombouwverklaring wordt binnen vijf werkdagen na de wijziging aan de Dienst Wegverkeer toegezonden.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel66
  - number: '67'
    text: |-
      1 De Dienst Wegverkeer kan in het kader van het toezicht op de erkenninghouder een systeem van bonus- en
      strafpunten vaststellen, dat wordt bekendgemaakt in de Staatscourant.

      2 Indien een systeem als bedoeld in het eerste lid is vastgesteld, wordt aan de hand daarvan, afhankelijk van de
      resultaten van het uitgeoefende toezicht, beoordeeld of het toezicht wordt verminderd of verscherpt dan wel of een
      erkenning wordt gewijzigd of ingetrokken.

      3 De Dienst Wegverkeer begint terstond de procedure tot intrekking van de erkenning, indien de erkenninghouder de
      in [hoofdstuk 2, afdeling 3, paragraaf 2][ref1], vermelde verplichtingen niet heeft nageleefd.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel67
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '2'
        afdeling: '3'
  - number: '68'
    text: |-
      Bij schorsing van een erkenning kan worden bepaald dat, indien niet binnen een termijn van ten hoogste 12 weken
      wordt aangetoond dat weer aan de erkenningseisen of erkenningsvoorschriften wordt voldaan, alsnog wijziging of
      intrekking van de erkenning volgt.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel68
  - number: '69'
    text: |-
      Onverminderd het bepaalde in de [hoofdstukken 2][ref1] en [4][ref2], wordt in het kader van het toezicht alle
      medewerking aan de daartoe aangewezen functionarissen van de Dienst Wegverkeer verleend. Hieronder wordt in ieder
      geval verstaan:

      a. het verlenen van toegang tot de werkplaats;

      b. het verstrekken van inlichtingen;

      c. het overleggen van bescheiden;

      d. het gebruik maken van de benodigde apparatuur;

      e. het in acht nemen van door de betreffende functionaris van de Dienst Wegverkeer aangegeven aanwijzingen.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel69
    references:
      - id: ref1
        bwb_id: BWBR0025732
        hoofdstuk: '2'
      - id: ref2
        bwb_id: BWBR0025732
        hoofdstuk: '4'
  - number: '70'
    text: |-
      1 Het in [artikel 102, van de wet][ref1], bedoelde toezicht ter zake van de in [hoofdstuk 2][ref2] vermelde
      werkzaamheden, geschiedt met inachtneming van de in [afdeling 2][ref3] van dit hoofdstuk daaromtrent gegeven
      voorschriften.

      2 Het in [artikel 102 van de wet][ref4], bedoelde toezicht ter zake van de in [hoofdstuk 4][ref5] vermelde
      werkzaamheden, geschiedt met inachtneming van de in [afdeling 3][ref6] van dit hoofdstuk daaromtrent gegeven
      voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0006622#Artikel102
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk2
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk5
