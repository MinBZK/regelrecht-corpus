  - number: '80'
    text: |-
      Nadat een erkenning is verleend wordt in beginsel eenmaal per twee jaar door middel van een herschouwing en
      een steekproef onderzocht of de erkenninghouder en de werkplaats nog voldoen aan de erkenningseisen en of de
      erkenningsvoorschriften worden nageleefd. In dit kader vindt controle plaats van zowel de organisatie van degene
      aan wie de goedkeuring is verleend als van het proces volgens hetwelk de werkzaamheden waarvoor de erkenning is
      verleend worden verricht.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel80
  - number: '81'
    text: |-
      In het kader van het toezicht kan een steekproef plaatsvinden op een voertuig van een type waarvoor de goedkeuring,
      behorende bij een wijziging in de bouw of inrichting, is verleend.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel81
  - number: '82'
    text: |-
      De in [artikel 80][ref1] en [81][ref2] bedoelde herschouwingen of steekproeven vinden plaats in een daartoe door de
      Dienst Wegverkeer aangewezen werkplaats van de erkenninghouder overeenkomstig [hoofdstuk 4][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel80
