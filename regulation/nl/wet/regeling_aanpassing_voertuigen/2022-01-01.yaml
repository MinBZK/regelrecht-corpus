  - number: '3'
    text: |-
      De aanvraag van een erkenning wordt met inachtneming van de door de Dienst Wegverkeer vastgestelde voorschriften
      ingediend bij de Dienst Wegverkeer.
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel3
  - number: '5'
    text: |-
      1 De directie of aangewezen vertegenwoordiger is verantwoordelijk voor het invoeren van en het op peil houden van
      het kwaliteitssysteem als bedoeld in [artikel 67][ref1].

      2 De verklaring of het document van aanwijzing moet door de directie zijn ondertekend.

      3 Met betrekking tot de hiernavolgende aspecten is de directie of de aangewezen vertegenwoordiger verantwoordelijk
      voor de juiste uitvoering van de aan die aspecten verbonden voorschriften en het nemen van maatregelen om ervoor te
      zorgen dat aan de voorschriften wordt voldaan:

      a. beheersing van documenten;

      b. controlerapport LPG-inbouw;

      c. vrijgave voertuig, en

      d. controle- en meetmiddelen.

      4 Tevens moet zijn vastgelegd wie de plaatsvervangers zijn van de in het derde lid bedoelde personen of moet zijn
      vastgelegd dat bij afwezigheid van één of meerdere van deze personen de desbetreffende werkzaamheden niet worden
      uitgevoerd.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel67
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel5
    references:
