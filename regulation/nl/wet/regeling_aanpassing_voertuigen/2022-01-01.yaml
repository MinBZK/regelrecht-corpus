      [ref5]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk4
      [ref6]: https://wetten.overheid.nl/BWBR0025732#Hoofdstuk5
    url: https://wetten.overheid.nl/BWBR0025732/2022-01-01#Artikel70
    references:
