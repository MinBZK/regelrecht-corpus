  - number: '78'
    text: |-
      In geval van niet-naleving van de volgende verplichtingen of voorschriften wordt terstond begonnen met de procedure
      tot intrekking van de erkenning:

      a. de in [artikel 18][ref1] neergelegde verplichtingen ten aanzien van het melden van een voertuig bij het keuren
      van een gasinstallatie, of

      b. de in [artikel 76][ref2] opgenomen voorschriften.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel76
