  - number: '76'
    text: |-
      1 Indien het voertuig blijkens mededeling van de Dienst Wegverkeer ten aanzien van de gasinstallatie aan een
      steekproef moet worden onderworpen:

      a. worden gedurende 90 minuten na het tijdstip van afmelding door de erkenninghouder of diens medewerkers, geen
      wijzigingen aangebracht in de staat van het voertuig dat aan een steekproef wordt onderworpen;

      b. worden door de erkenninghouder of diens medewerkers, geen metingen verricht met betrekking tot dat voertuig;

      c. worden voorafgaande aan de steekproef, door de erkenninghouder of diens medewerkers, de bescheiden als bedoeld
      in [artikel 19, tweede lid][ref1], en [artikel 23, eerste lid][ref2], overhandigd;

      d. wijst de erkenninghouder de eigenaar of houder van het voertuig er op dat deze verplicht is het voertuig voor de
      uitvoering van de steekproef beschikbaar te houden.

      2 Onverminderd het bepaalde in [artikel 69][ref3] wordt aan een steekproef alle medewerking verleend door de
      erkenninghouder. Onder het verlenen van medewerking wordt in ieder geval verstaan:

      a. de aanwezigheid van de LPG-technicus die de keuring van de gasinstallatie van het voertuig heeft uitgevoerd
      vanaf de mededeling steekproef;

      b. het verlenen van feitelijke assistentie bij het uitvoeren van de steekproef;

      c. het beschikbaar houden van het voertuig in de werkplaats, ongeacht het tijdstip van de aanvang van de
      steekproef, gedurende de steekproef;

      d. het beschikbaar stellen van de werkplaats en de apparatuur gedurende de steekproef.

      3 Indien bij de steekproef wordt vastgesteld dat:

      a. de keuring van de gasinstallatie niet overeenkomstig de voorschriften van [artikel 18][ref4] is uitgevoerd, dan
      wel onterecht is afgemeld;

      b. de opnamekaart gasinstallatie onjuist of onvolledig is ingevuld, of

      c. de voorschriften met betrekking tot de steekproef niet in acht zijn genomen,

      wordt door de functionaris van de Dienst Wegverkeer een steekproefcontrolerapport opgemaakt en door hem
      ondertekend, alsmede door respectievelijk de erkenninghouder of de in het eerste lid, onderdeel b, bedoelde
      persoon.

      4 De eigenaar of houder van een voertuig waarvoor een steekproef wordt vereist mag in de in het eerste lid,
      onderdeel a, bedoelde periode van 90 minuten geen wijzigingen aanbrengen of laten aanbrengen in de staat van het
      voertuig.

      5 De erkenninghouder gasinstallaties bewaart goed geordend voor de duur van twee jaar van elk voertuig
      waarvan een gasinstallatie is gekeurd het steekproefcontrolerapport, voor zover van toepassing. Op het
      steekproefcontrolerapport worden geen wijzigingen aangebracht.


      [ref1]: https://wetten.overheid.nl/BWBR0025732#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0025732#Artikel23
      [ref3]: https://wetten.overheid.nl/BWBR0025732#Artikel69
      [ref4]: https://wetten.overheid.nl/BWBR0025732#Artikel18
