  - number: '9'
    text: |-
      Ten aanzien van de uitlaatgastester met lambdabepaling moet de aanvrager beschikken over:

      a. de documenten als bedoeld in [artikel 8.1.4, onder b, van de Regeling voertuigen][ref1], of

      b. een geldig certificaat van herkeuring als bedoeld in [artikel 8.1.1 van de Regeling voertuigen][ref2] indien
      de documenten als bedoeld in [artikel 8.1.4, onder b, van de Regeling voertuigen][ref3] langer dan twaalf maanden
      geleden zijn afgegeven.


      [ref1]: https://wetten.overheid.nl/BWBR0025798#Artikel8.1.4
      [ref2]: https://wetten.overheid.nl/BWBR0025798#Artikel8.1.1
      [ref3]: https://wetten.overheid.nl/BWBR0025798#Artikel8.1.4
