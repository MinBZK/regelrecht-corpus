      ten minste één vak met een normatieve studielast van ten minste 320 uur van het vrije deel van elk profiel, genoemd
      in [artikel 21, zesde lid, van het Inrichtingsbesluit WVO BES][ref1], met dien verstande dat door het bevoegd gezag
