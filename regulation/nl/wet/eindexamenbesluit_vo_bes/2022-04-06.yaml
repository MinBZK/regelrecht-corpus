        artikel: '23'
  - number: '13.4'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van de vakken culturele en kunstzinnige vorming en lichamelijke
      opvoeding van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel13
  - number: 13a
    text: |-
      In afwijking van [artikel 11, eerste lid][ref1], [12, eerste lid][ref2], of [13, eerste lid][ref3], is de kandidaat
      die op grond van [artikel 23, derde of zesde lid, van het Inrichtingsbesluit WVO BES][ref4] is vrijgesteld van
      het volgen van onderwijs in een vak als daar bedoeld, eveneens bij het desbetreffende eindexamen vrijgesteld van
      dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0029589#Artikel23
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel13a
