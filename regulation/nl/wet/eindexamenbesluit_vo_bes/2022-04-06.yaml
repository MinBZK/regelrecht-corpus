        artikel: '14'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '15'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '16'
        hoofdstuk: II
