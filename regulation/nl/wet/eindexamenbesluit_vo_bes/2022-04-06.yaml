        artikel: '40'
  - number: '13.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor havo bij het
      eindexamen vrijgesteld van de vakken waarvoor ontheffing of vrijstelling is verleend van het volgen van onderwijs
      op grond van [artikel 23, eerste lid, van het Inrichtingsbesluit WVO BES][ref1].


