  - number: 3a.3
    text: 'De examensecretaris heeft de taak om de directeur te ondersteunen bij:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
  - number: 3a.3.a
    text: het organiseren en afnemen van het eindexamen of het deeleindexamen bedoeld in het eerste lid;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
  - number: 3a.3.b
    text: |-
      de uitvoering van het examenreglement bedoeld in [artikel 18, eerste lid][ref1];


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
    references:
