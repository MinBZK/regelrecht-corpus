preamble:
  text: |-
    Wij Beatrix, bij de gratie Gods, Koningin der Nederlanden, Prinses van Oranje-Nassau, enz. enz. enz.

    Op de voordracht van de Staatssecretaris van Onderwijs, Cultuur en Wetenschap, van 21 september 2010,
    nr. WJZ/236451 (3844), directie Wetgeving en Juridische Zaken, gedaan mede namens de Staatssecretaris van
    Binnenlandse Zaken en Koninkrijksrelaties;

    Gelet op de artikelen 72, 74, 75, 116 en 206, derde lid, van de Wet voortgezet onderwijs BES en de artikelen 7.3.3,
    tweede lid, en 7.4.13, derde en vijfde lid, van de Wet educatie en beroepsonderwijs BES;

    De Afdeling advisering van de Raad van State gehoord (advies van 20 oktober 2010, no. W05.10.0454/I);

    Gezien het nader rapport van Onze Minister van Onderwijs, Cultuur en Wetenschap, van 21 april 2011, nr. WJZ/260664
    (3844), directie Wetgeving en Juridische Zaken, uitgebracht mede namens Onze Minister van Binnenlandse Zaken en
    Koninkrijksrelaties;

    Hebben goedgevonden en verstaan:
  url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#ArtikelAanhef
articles:
  - number: '1.1'
    text: |-
      In dit besluit wordt verstaan onder: - *algemene vakken:* vakken niet zijnde
      profielvakken, genoemd in [artikel 25, eerste lid][ref1], respectievelijk bedoeld in
      [artikel 26, eerste lid, van het Inrichtingsbesluit WVO BES][ref2], en niet zijnde beroepsgerichte keuzevakken als
      bedoeld in [artikel 27 van dat besluit][ref3];
        - *beroepsgericht keuzevak:* beroepsgericht keuzevak als bedoeld in [artikel 18, zevende lid, onderdeel a][ref4],
      of [artikel 29, zevende lid, onderdeel b, van de wet][ref5];
        - *beroepsgericht programma:* beroepsgericht programma als bedoeld in [artikel 15, eerste lid, onderdeel c][ref6],
      [16, eerste lid, onderdeel c][ref7], of [17 eerste lid, onderdeel d][ref8];
        - *bevoegd gezag:* het bevoegd gezag, bedoeld in [artikel 1 van de wet][ref9], indien
      het een school voor voortgezet onderwijs betreft, en het bevoegd gezag, bedoeld in
      [artikel 1.1.1, onder 1 en 2, van de Wet educatie en beroepsonderwijs BES][ref10], indien het een instelling voor
      educatie en beroepsonderwijs betreft;
        - *College voor toetsen en examens:* College voor toetsen en examens, genoemd in
      [artikel 2, eerste lid, van de Wet College voor toetsen en examens][ref11];
        - *cspe:* centraal schriftelijk en praktisch examen in een profielvak;
        - *deeleindexamen:* een examen in één of meer van de voor het eindexamen voorgeschreven
      vakken aan een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onder a, van de Wet educatie en beroepsonderwijs][ref12];
        - *digitale examinering:* het voorbereiden, afnemen en afwikkelen van het centraal examen in één of meer vakken met
      gebruikmaking van de daartoe door het College voor toetsen en examens beschikbaar gestelde programmatuur;
        - *directeur:* de rector of directeur van een school voor voortgezet onderwijs;
        - *eindexamen:* een examen ten minste in het geheel van de voorgeschreven vakken;
        - *eindexamen vmbo:* een eindexamen dat leidt tot een diploma vmbo voor zover het betreft de theoretische leerweg,
      de basisberoepsgerichte leerweg, de kaderberoepsgerichte leerweg of de gemengde leerweg;
        - *examencommissie:* de examencommissie bedoeld in [artikel 23a][ref13];
        - *examencommissie vavo:* de in [artikel 7.4.13, tweede lid][ref14], juncto
      [artikel 7.4.7 van de Wet educatie en beroepsonderwijs BES][ref15] bedoelde examencommissie voor een opleiding
      vavo;
        - *examenprogramma:* het examenprogramma bedoeld in [artikel 6][ref16];
        - *examenregeling;* het examenreglement en het programma van toetsing en afsluiting gezamenlijk;
        - *examensecretaris:* de examensecretaris bedoeld in [artikel 3a][ref17];
        - *examenstof:* de aan de kandidaat te stellen eisen;
        - *examinator:* degene die is belast met het afnemen van het examen in een vak;
        - *extra vak:* een vak in aanvulling op de vakken die voor een bepaalde kandidaat ten minste samen een eindexamen
      vormen, welk vak wordt afgesloten met een examen;
        - *gecommitteerde:* een gecommitteerde als bedoeld in [artikel 24][ref18] van dit besluit;
        - *havo:* hoger algemeen voortgezet onderwijs als bedoeld in [artikel 14 van de wet][ref19];
        - *herkansing:* het opnieuw deelnemen aan een toets van het centraal examen of het schoolexamen;
        - *inspectie:* de inspectie, bedoeld in [artikel 1 van de Wet op het onderwijstoezicht][ref20];
        - *instelling voor educatie en beroepsonderwijs:* een instelling als bedoeld in
      [artikel 1.1.1, van de Wet educatie en beroepsonderwijs BES][ref21], voor zover het betreft door die instelling
      verzorgde opleidingen vavo;
        - *kandidaat:* ieder die door het bevoegd gezag tot het eindexamen of deeleindexamen wordt toegelaten;
        - *kunstvakken:* de vakken behorende tot de beeldende vorming, alsmede muziek, dans en drama;
        - *leerling:* een leerling aan een school voor voortgezet onderwijs of een vavo-student;
        - *leerweg:* de basisberoepsgerichte leerweg, bedoeld in [artikel 18 van de wet][ref22], de kaderberoepsgerichte
      leerweg, bedoeld in artikel 18 van de wet, de gemengde leerweg, bedoeld in [artikel 29 van de wet][ref23] en de
      theoretische leerweg, bedoeld in [artikel 16 van de wet][ref24];
        - *mavo:* middelbaar algemeen voortgezet onderwijs als bedoeld in [artikel 15 van de wet][ref25];
        - *Onze Minister:* Onze Minister van Onderwijs, Cultuur en Wetenschap;
        - *opleiding vavo:* een opleiding voortgezet algemeen volwassenenonderwijs als bedoeld in
      [artikel 7.3.1, eerste lid, onderdeel a, van de Wet educatie en beroepsonderwijs BES][ref26];
        - *profiel:* een in [artikel 16, derde lid][ref27], [18, derde lid][ref28], [29, derde lid][ref29], of
      [38, derde lid, van de wet][ref30] bedoeld profiel;
        - *profielvak:* profielvak, genoemd in [artikel 25, eerste lid][ref31], respectievelijk bedoeld in
      [artikel 26, eerste lid, van het Inrichtingsbesluit WVO BES][ref32];
        - *profielwerkstuk:* het in [artikel 4][ref33] bedoelde profielwerkstuk;
        - *school:* een school voor vwo, een school voor havo, een school voor mavo, een school voor vbo of een instelling
      voor educatie en beroepsonderwijs, tenzij anders blijkt;
        - *schooljaar:* het tijdvak dat aanvangt op 1 augustus en eindigt op 31 juli van het daaropvolgende jaar, daaronder
      mede begrepen het studiejaar, bedoeld in [artikel 1.1.1, van de Wet educatie en beroepsonderwijs BES][ref34];
        - *school voor voortgezet onderwijs:* een school voor vwo, een school voor havo, een school voor mavo, een school
      voor vbo;
        - *toets:* een toets met schriftelijke of mondelinge vragen en opdrachten, of een praktische opdracht;
        - *vakken:* algemene vakken, profielvakken, beroepsgerichte keuzevakken en andere programmaonderdelen;
        - *vakken behorende tot de beeldende vorming:* tekenen, handvaardigheid, textiele vormgeving, fotografie, film,
      audio-visuele vorming;
        - *vbo:* voorbereidend beroepsonderwijs als bedoeld in [artikel 17 van de wet][ref35];
        - *vmbo:* voorbereidend middelbaar beroepsonderwijs als bedoeld in [artikel 44 van de wet][ref36];
        - *vwo:* voorbereidend wetenschappelijk onderwijs als bedoeld in [artikel 13 van de wet][ref37];
        - *wet:* [Wet voortgezet onderwijs BES][ref38].


