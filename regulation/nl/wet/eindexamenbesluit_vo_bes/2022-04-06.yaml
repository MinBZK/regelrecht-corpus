  - number: '1.2'
    text: |-
      Waar in dit besluit wordt gesproken van «directeur» en van «directeur en de examensecretaris», wordt daaronder wat
      instellingen voor educatie en beroepsonderwijs betreft verstaan, de examencommissie vavo, tenzij anders blijkt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel1
  - number: '2.1'
    text: |-
      Het bevoegd gezag stelt de leerlingen van een school en de leerlingen van een afdeling voor havo in de gelegenheid
      ter afsluiting van de opleiding een eindexamen af te leggen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel2
  - number: '2.2'
    text: |-
      Het bevoegd gezag stelt de leerlingen van een instelling voor educatie en beroepsonderwijs in de gelegenheid in
      plaats van een eindexamen een of meer deeleindexamens af te leggen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel2
  - number: '2.3'
    text: Het bevoegd gezag kan tot het eindexamen toelaten kandidaten die niet als leerling van de school zijn ingeschreven.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel2
  - number: '2.4'
    text: |-
      Het bevoegd gezag van een instelling voor educatie en beroepsonderwijs kan kandidaten als bedoeld in het derde lid
      eveneens in de gelegenheid stellen een of meer deeleindexamens aan deze instelling af te leggen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel2
  - number: '2.5'
    text: |-
      Kandidaten als bedoeld in het derde lid, die worden toegelaten tot het eindexamen van een school voor voortgezet
      onderwijs, zijn behoudens het bepaalde in het zesde lid aan het bevoegd gezag een bedrag verschuldigd van USD 45
      voor een volledig eindexamen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel2
  - number: '2.6'
    text: |-
      In afwijking van het vijfde lid is een toelatingsbedrag niet verschuldigd door kandidaten die zijn ingeschreven
      bij een andere uit de openbare kas bekostigde school – al dan niet in de zin van dit besluit –, afdeling of
      onderwijsinstelling en die aldaar geen eindexamen dan wel deeleindexamen afleggen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel2
  - number: '2.7'
    text: |-
      Het in het vijfde lid bedoelde bedrag kan bij regeling van Onze Minister worden gewijzigd voor zover de
      consumentenprijsindex daartoe aanleiding geeft.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel2
  - number: '3'
    text: |-
      De directeur en de examinatoren van een school voor voortgezet onderwijs nemen onder verantwoordelijkheid van het
      bevoegd gezag het eindexamen of deeleindexamen af.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3
  - number: 3a.1
    text: |-
      De directeur van een school voor voortgezet onderwijs wijst een of meer van de personeelsleden van de school aan
      tot examensecretaris van het eindexamen. Een examensecretaris is tevens examensecretaris van de deeleindexamens.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
  - number: 3a.2
    text: |-
      De directeur en de examensecretaris van een school voor voortgezet onderwijs verrichten gezamenlijk de taken
      bedoeld in de [artikelen 20, tweede lid][ref1], [36, eerste en derde lid][ref2], [39, zesde lid][ref3], en
      [47, vijfde lid][ref4].


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel20
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel36
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel39
      [ref4]: https://wetten.overheid.nl/BWBR0029990#Artikel47
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
