      in [artikel 20, zevende lid, van het Inrichtingsbesluit WVO BES][ref1] zoals geldend voor de scholen voor vwo, met
      dien verstande dat door het bevoegd gezag vast te stellen vakken onderdeel zijn van het eindexamen uitsluitend voor
      zover Onze Minister daarvoor goedkeuring heeft verleend.


