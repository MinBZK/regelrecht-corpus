        afdeling: '1'
  - number: 3a.3.c
    text: |-
      de uitvoering van het programma van toetsing en afsluiting bedoeld in [artikel 18a, eerste lid][ref1]; en


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel18a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: 18a
        hoofdstuk: III
        afdeling: '1'
  - number: 3a.3.d
    text: |-
      de verstrekking van een overzicht van de onderdelen en beoordeling van de schoolexamens bedoeld in
      [artikel 20][ref1] .


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '20'
        hoofdstuk: III
        afdeling: '2'
  - number: 3a.4
    text: |-
      De directeur stelt een taakomschrijving voor de examensecretaris vast waarin in ieder geval de taken bedoeld in het
      tweede en derde lid worden opgenomen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
  - number: 3a.5
    text: |-
      De directeur verstrekt de taakomschrijving aan het bevoegd gezag, aan de examensecretaris en aan de
      examencommissie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
  - number: 3a.6
    text: De directeur draagt er zorg voor dat het deskundig functioneren van de examensecretaris is gewaarborgd.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel3a
  - number: '4.1'
    text: |-
      Het eindexamen of deeleindexamen kan voor ieder vak bestaan uit een schoolexamen, uit een centraal examen dan wel
      uit beide.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel4
  - number: '4.2'
    text: |-
      Het schoolexamen vwo, havo en vmbo, voor zover het betreft de theoretische leerweg, bedoeld in
      [artikel 10 van de wet][ref1], of de gemengde leerweg, bedoeld in [artikel 10d van de wet][ref2], omvat mede een
      profielwerkstuk. Het profielwerkstuk is een werkstuk, een presentatie daaronder begrepen, waarin op geïntegreerde
      wijze kennis, inzicht en vaardigheden aan de orde komen die van betekenis zijn in het desbetreffende profiel.


      [ref1]: https://wetten.overheid.nl/BWBR0002399#Artikel10
      [ref2]: https://wetten.overheid.nl/BWBR0002399#Artikel10d
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel4
    references:
      - id: ref1
        bwb_id: BWBR0002399
        artikel: '10'
      - id: ref2
        bwb_id: BWBR0002399
        artikel: 10d
  - number: '4.3'
    text: |-
      Het profielwerkstuk in het vwo en havo heeft betrekking op één of meer vakken van het eindexamen. Ten minste één
      van deze vakken heeft een omvang van 400 uur of meer voor vwo en 320 uur of meer voor havo.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel4
  - number: '4.4'
    text: Het profielwerkstuk in het vmbo heeft betrekking op een thema uit het profiel waarin de leerling onderwijs volgt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel4
  - number: '5.1'
    text: |-
      Indien een kandidaat zich ten aanzien van enig deel van het eindexamen of deeleindexamen dan wel ten aanzien van
      een aanspraak op ontheffing aan enige onregelmatigheid schuldig maakt of heeft gemaakt, dan wel zonder geldige
      reden afwezig is, kan de directeur maatregelen nemen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: '5.2'
    text: |-
      De maatregelen, bedoeld in het eerste lid, die afhankelijk van de aard van de onregelmatigheid ook in combinatie
      met elkaar genomen kunnen worden, zijn:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: 5.2.a
    text: het toekennen van het cijfer 1 voor een toets van het schoolexamen of het centraal examen,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: 5.2.b
    text: |-
      het ontzeggen van de deelname of de verdere deelname aan een of meer toetsen van het schoolexamen of het centraal
      examen,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: 5.2.c
    text: |-
      het ongeldig verklaren van een of meer toetsen van het reeds afgelegde deel van het schoolexamen of het centraal
      examen, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: 5.2.d
    text: |-
      het bepalen dat het diploma en de cijferlijst slechts kunnen worden uitgereikt na een hernieuwd examen in door de
      directeur aan te wijzen onderdelen.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: '5.3'
    text: |-
      Het besluit waarbij een in het eerste lid bedoelde maatregel wordt genomen, wordt tegelijkertijd in afschrift
      toegezonden aan de inspectie en, indien de kandidaat minderjarig is, aan de wettelijke vertegenwoordigers van de
      kandidaat.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: '5.4'
    text: |-
      De kandidaat kan tegen een beslissing van de directeur van een school voor voortgezet onderwijs in beroep gaan
      bij de door het bevoegd gezag van de school in te stellen commissie van beroep. Van de commissie van beroep mag de
      directeur geen deel uitmaken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: '5.5'
    text: |-
      In overeenstemming met [artikel 75 van de wet](onbekend) wordt het beroep binnen vijf dagen nadat de beslissing
      aan de kandidaat is bekendgemaakt, schriftelijk ingesteld bij de commissie van beroep. De commissie stelt een
      onderzoek in en beslist binnen twee weken na ontvangst van het beroepsschrift, tenzij zij deze termijn gemotiveerd
      heeft verlengd met ten hoogste twee weken. De commissie stelt bij haar beslissing zo nodig vast op welke wijze de
      kandidaat alsnog in de gelegenheid zal worden gesteld het eindexamen of deeleindexamen geheel of gedeeltelijk af
      te leggen onverminderd het bepaalde in de laatste volzin van het tweede lid. De commissie deelt haar beslissing
      schriftelijk mede aan de kandidaat, aan de ouders, voogden of verzorgers van de kandidaat indien deze minderjarig
      is, aan de directeur en aan de inspectie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel5
  - number: '6.1'
    text: |-
      Onze Minister stelt, behalve voor door het bevoegd gezag vast te stellen vakken die onderdeel zijn van het
      eindexamen, voor elk van de schoolsoorten en leerwegen examenprogramma’s vast, waarin zijn opgenomen:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel6
  - number: 6.1.a
    text: een omschrijving van de examenstof voor ieder eindexamenvak, en
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel6
  - number: 6.1.b
    text: |-
      welk deel van de examenstof centraal zal worden geëxamineerd en over welke examenstof het schoolexamen zich
      uitstrekt.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel6
  - number: '6.2'
    text: Een examenprogramma wordt vastgesteld per vak of per groep van vakken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel6
  - number: '7.1'
    text: |-
      De kandidaten kiezen, met inachtneming van dit hoofdstuk, in welke vakken zij examen willen afleggen. Voor
      leerlingen geldt deze keuze voorzover het bevoegd gezag, al dan niet in samenwerking met het bevoegd gezag van
      een of meer andere scholen, hen in de gelegenheid heeft gesteld zich op het examen in die vakken voor te bereiden.
      Indien sprake is van samenwerking tussen scholen, is [artikel 2 van het Besluit samenwerking VO-BVE BES][ref1]
      van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029591#Artikel2
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel7
    references:
      - id: ref1
        bwb_id: BWBR0029591
        artikel: '2'
  - number: '7.2'
    text: |-
      De kandidaten kunnen, voor zover het bevoegd gezag hun dat toestaat, in extra vakken examen afleggen. Een examen
      als bedoeld in de eerste volzin heeft geen betrekking op vakken die overeenkomen met vakken die onderdeel zijn van
      het eindexamen waarop deze extra vakken een aanvulling zijn.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel7
  - number: 7a
    text: |-
      Indien het eindexamen één of meer vakken omvat van een andere schoolsoort of leerweg dan die waarvoor de kandidaat
      is ingeschreven, behoort ten minste één vak tot de voorgeschreven eindexamenvakken van de schoolsoort of leerweg
      van inschrijving.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel7a
  - number: '8.1'
    text: |-
      Onverminderd vrijstellingen en ontheffingen als bedoeld in de [artikelen 11][ref1], [12][ref2], [13][ref3] en
      [14][ref4] is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en beroepsonderwijs:


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel11
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel12
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel13
      [ref4]: https://wetten.overheid.nl/BWBR0029990#Artikel14
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '11'
        hoofdstuk: II
      - id: ref2
        bwb_id: BWBR0029990
        artikel: '12'
        hoofdstuk: II
      - id: ref3
        bwb_id: BWBR0029990
        artikel: '13'
        hoofdstuk: II
      - id: ref4
        bwb_id: BWBR0029990
        artikel: '14'
        hoofdstuk: II
  - number: 8.1.a
    text: |-
      vrijgesteld van het examen in een vak van de theoretische leerweg in het vmbo op grond van een examen vwo, havo,
      theoretische leerweg of gemengde leerweg vmbo, indien voor het overeenkomstige vak een eindcijfer 6 of hoger of een
      daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: 8.1.b
    text: |-
      vrijgesteld van het examen in een vak in het havo op grond van een examen vwo of havo, indien voor het
      overeenkomstige vak een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: 8.1.c
    text: |-
      vrijgesteld van het examen in een vak in het vwo op grond van een examen vwo, indien voor het overeenkomstige vak
      een eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: 8.1.d
    text: |-
      vrijgesteld van het examen in een vak van het vwo, havo of mavo op grond van het overeenkomstige examen, afgelegd
      op Curaçao, Sint Maarten, Aruba, Bonaire, Saba of Sint Eustatius, indien voor het overeenkomstige vak een
      eindcijfer 6 of hoger of een daarmee overeenkomende waardering is behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: 8.1.e
    text: |-
      vrijgesteld van het profielwerkstuk vwo of havo, indien reeds eerder een profielwerkstuk is gemaakt dat betrekking
      heeft op een of meer vakken van dezelfde schoolsoort, behorende tot het profiel van de kandidaat en waarvoor een
      eindcijfer 6 of hoger is behaald;
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: 8.1.f
    text: |-
      vrijgesteld van het profielwerkstuk vmbo, indien reeds eerder een profielwerkstuk vmbo is gemaakt dat betrekking
      heeft op een thema uit het profiel van de kandidaat, en dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: '8.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het eindcijfer of de beoordeling is
      vastgesteld, nog geen 10 jaren zijn verstreken. Het eerste lid, onderdeel f, is daarbij van overeenkomstige
      toepassing op een reeds eerder gemaakt sectorwerkstuk dat is beoordeeld als «voldoende» of «goed».
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: '8.3'
    text: |-
      In aanvulling op het eerste lid, onder a tot en met d, is de daar bedoelde kandidaat eveneens vrijgesteld
      indien het eindcijfer 5 of 4 is behaald, mits de kandidaat voldoet aan de voorwaarden van [artikel 37][ref1] of
      [artikel 37a][ref2] om te slagen voor het eindexamen.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel37
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel37a
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '37'
        hoofdstuk: V
      - id: ref2
        bwb_id: BWBR0029990
        artikel: 37a
        hoofdstuk: V
  - number: '8.4'
    text: Bij ministeriële regeling kunnen nadere voorschriften worden gegeven voor de toepassing van het eerste lid.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: '8.5'
    text: |-
      Bij de toepassing van dit artikel wordt ten hoogste één cijferlijst, die is uitgereikt aan een school voor
      voortgezet onderwijs, betrokken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel8
  - number: '9.1'
    text: |-
      Onverminderd [artikel 8][ref1] kan het College voor toetsen en examens op verzoek van de kandidaat die het
      eindexamen aflegt aan een instelling voor educatie en beroepsonderwijs, ontheffing verlenen voor een examenvak,
      indien de kandidaat op grond van eerder gevolgd onderwijs aantoonbaar in het bezit is van voldoende kennis en
      vaardigheden ter zake van het desbetreffende vak. De ontheffing kan slechts worden verleend op basis van een
      diploma, getuigschrift, certificaat of ander bewijsstuk, al of niet behaald in Nederland, dat door het College
      voor toetsen en examens wordt aanvaard als bewijs van voldoende kennis en vaardigheden. Indien het College voor
      toetsen en examens dit nodig oordeelt, onderzoekt het college of de kandidaat in het bezit is van voldoende kennis
      en vaardigheden.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel8
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel9
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '8'
        hoofdstuk: II
  - number: '9.2'
    text: |-
      Het eerste lid is uitsluitend van toepassing indien na het jaar waarin het in dat lid bedoelde diploma,
      getuigschrift, certificaat of ander bewijsstuk is vastgesteld, nog geen 10 jaren zijn verstreken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel9
  - number: '9.3'
    text: |-
      Tot de in het eerste lid bedoelde diploma’s, getuigschriften, certificaten en andere bewijsstukken behoren in
      elk geval die betreffende het Internationaal Baccalaureaat, het Europees Baccalaureaat en die betreffende het
      overeenkomstige onderwijs in een lidstaat van de Europese Unie.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel9
  - number: '9.4'
    text: |-
      Indien het College voor toetsen en examens de gevraagde ontheffing verleent, verstrekt het college de verzoeker een
      bewijs van ontheffing, en zendt het college aan Onze Minister een afschrift daarvan.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel9
  - number: '9.5'
    text: |-
      Het bewijs van ontheffing vermeldt de gronden van de ontheffing, het tijdstip van het verrichten van de onderwijs-
      of examenprestatie waarop de ontheffing berust, en gaat in voorkomend geval vergezeld van een verklaring
      betreffende het in het eerste lid bedoelde onderzoek naar de kennis en vaardigheden van de examenkandidaat, of naar
      de in het eerste lid bedoelde bewijsstukken.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel9
  - number: '9.6'
    text: Onze Minister stelt het model van het bewijs van ontheffing vast.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel9
  - number: '10'
    text: |-
      Een verzoek om ontheffing als bedoeld in [artikel 9][ref1] wordt schriftelijk ingediend bij het College voor
      toetsen en examens, onder overlegging van een uittreksel uit het geboorte- of persoonsregister en een gewaarmerkte
      fotokopie van het diploma, getuigschrift, certificaat of andere bewijsstuk waarop het verzoek om ontheffing berust.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel9
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel10
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '9'
        hoofdstuk: II
  - number: '11.1'
    text: 'Het eindexamen vwo (atheneum) omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
  - number: 11.1.a
    text: |-
      de vakken van het gemeenschappelijk deel van elk profiel, genoemd in
      [artikel 20, eerste lid, van het Inrichtingsbesluit WVO BES][ref1], daaronder tevens begrepen een profielwerkstuk,


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
  - number: 11.1.b
    text: |-
      de vakken van het profieldeel van één van de profielen, genoemd in
      [artikel 20, derde tot en met zesde lid, van het Inrichtingsbesluit WVO BES][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
  - number: 11.1.c
    text: |-
      ten minste één vak met een normatieve studielast van ten minste 440 uren van het vrije deel van elk profiel,
      genoemd in [artikel 20, zevende lid, van het Inrichtingsbesluit WVO BES][ref1] zoals geldend voor de scholen
      voor vwo, met dien verstande dat door het bevoegd gezag vast te stellen vakken onderdeel zijn van het eindexamen
      uitsluitend voor zover Onze Minister daarvoor goedkeuring heeft verleend.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
  - number: '11.2'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vwo, bij het
      eindexamen vrijgesteld van de vakken waarvoor vrijstelling of ontheffing is verleend van het volgen van onderwijs
      op grond van [artikel 23, eerste, tweede of vierde lid, van het Inrichtingsbesluit WVO BES][ref1]. Bij een
      ontheffing op grond van artikel 23, vierde lid, van het Inrichtingsbesluit WVO BES wordt de taal vervangen door een
      ander vak als bedoeld in het vijfde lid van dat artikel.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel23
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '23'
  - number: '11.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van de vakken culturele en kunstzinnige vorming en lichamelijke
      opvoeding van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
  - number: '11.4'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs, en in het bezit is van het diploma havo, bij het eindexamen vrijgesteld van het vak
      maatschappijleer van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
  - number: '11.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs en in het bezit is van het diploma havo, en die in plaats van de vakken, genoemd in
      [artikel 21 van het Inrichtingsbesluit WVO BES][ref1] examen heeft afgelegd in een of meer overeenkomstige vakken
      van [artikel 20 van het Inrichtingsbesluit WVO BES][ref2], bij het eindexamen vrijgesteld van dit vak of deze
      vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '21'
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '20'
  - number: '11.6'
    text: |-
      In afwijking van het eerste lid kan de kandidaat die het eindexamen aflegt aan een instelling voor
      educatie en beroepsonderwijs bij het eindexamen ontheffing worden verleend van de taal, genoemd in
      [artikel 20, eerste lid onder c, van het Inrichtingsbesluit WVO BES][ref1], in de volgende gevallen:


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
  - number: 11.6.a
    text: |-
      de leerling heeft een stoornis die specifiek betrekking heeft op taal of een zintuiglijke stoornis die effect heeft
      op taal,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
  - number: 11.6.b
    text: de leerling heeft een andere moedertaal dan de Nederlandse taal, of
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
  - number: 11.6.c
    text: |-
      de leerling volgt onderwijs in het profiel natuur en techniek of het profiel natuur en gezondheid en de taal
      verhindert naar verwachting een succesvolle afronding van de opleiding.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
  - number: '11.7'
    text: |-
      Bij ontheffing op grond van het zesde lid wordt de taal vervangen door een van de vakken, genoemd in
      __REF000___________________________________________________________________________________________________________
      ____ met een normatieve studielast van ten minste 440 uren, naar keuze van de leerling, voor zover het bevoegd
      gezag deze als zodanig aanbiedt.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel11
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
  - number: '12.1'
    text: 'Het eindexamen vwo (gymnasium) omvat in elk geval:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel12
  - number: 12.1.a
    text: |-
      de vakken van het gemeenschappelijk deel van elk profiel, genoemd in
      [artikel 20, tweede lid, van het Inrichtingsbesluit WVO BES][ref1], daaronder tevens begrepen een profielwerkstuk,


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel12
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '20'
  - number: 12.1.b
    text: |-
      de vakken van het profieldeel, genoemd in
      [artikel 20, derde tot en met zesde lid, van het Inrichtingsbesluit WVO BES][ref1], en


