  - number: 15.1.c
    text: 'een beroepsgericht programma, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
  - number: 15.1.c.1°
    text: het profielvak dat het profieldeel ingevolge artikel 18, zesde lid, van de wet, omvat, en
