        artikel: '29'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '39'
      - id: ref3
        bwb_id: BWBR0030284
        artikel: '40'
  - number: '17.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo,
      voor zover het betreft de gemengde leerweg, bij het eindexamen vrijgesteld van de vakken waarvoor
      ontheffing is verleend van het volgende van onderwijs in lichamelijke opvoeding op grond van
      [artikel 29, eerste lid, van het Inrichtingsbesluit WVO BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '29'
  - number: 17a
    text: |-
      In afwijking van [artikel 14, eerste lid][ref1], [15, eerste lid][ref2],
      [16, eerste lid][ref3], of [17, eerste lid][ref4], is de kandidaat die op grond van
      [artikel 29, vierde, vijfde, zesde of zevende lid, van het Inrichtingsbesluit WVO BES][ref5] is vrijgesteld van het
      volgen van onderwijs in een vak als daar bedoeld, eveneens bij het desbetreffende eindexamen vmbo vrijgesteld van
      dat vak.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel14
      [ref2]: https://wetten.overheid.nl/BWBR0029990#Artikel15
      [ref3]: https://wetten.overheid.nl/BWBR0029990#Artikel16
      [ref4]: https://wetten.overheid.nl/BWBR0029990#Artikel17
      [ref5]: https://wetten.overheid.nl/BWBR0029589#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17a
