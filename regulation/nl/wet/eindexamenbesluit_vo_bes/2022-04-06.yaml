        bwb_id: BWBR0029589
        artikel: '23'
  - number: '12.3'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie en
      beroepsonderwijs, bij het eindexamen vrijgesteld van het vak lichamelijke opvoeding van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel12
  - number: '12.4'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs, en die in het bezit is van het diploma havo, bij het eindexamen vrijgesteld van het vak
      maatschappijleer van het gemeenschappelijk deel.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel12
  - number: '12.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een instelling voor educatie
      en beroepsonderwijs en in het bezit is van het diploma havo, en die in plaats van de vakken, genoemd in
      [artikel 21 van het Inrichtingsbesluit WVO BES][ref1] examen heeft afgelegd in een of meer overeenkomstige vakken
      van [artikel 20 van het Inrichtingsbesluit WVO BES][ref2], bij het eindexamen vrijgesteld van dit vak of deze
      vakken.


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel21
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel20
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel12
