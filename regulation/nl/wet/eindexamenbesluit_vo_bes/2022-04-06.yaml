    text: |-
      een vak als bedoeld in de [artikelen 39][ref1] of [40 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '40'
  - number: '15.6'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo,
      voor zover het betreft de basisberoepsgerichte leerweg, bij het eindexamen vrijgesteld van de vakken
      waarvoor ontheffing is verleend van het volgende van onderwijs in lichamelijke opvoeding op grond van
      [artikel 29, eerste lid, van het Inrichtingsbesluit WVO BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '29'
  - number: '16.1'
    text: |-
      Het eindexamen vmbo voor zover het betreft de kaderberoepsgerichte leerweg, genoemd in
      [artikel 18 van de wet][ref1], omvat in elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: 16.1.a
    text: |-
      de vakken die het gemeenschappelijk deel ingevolge in [artikel 18, vijfde lid, van de wet][ref1], omvat,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: 16.1.b
    text: |-
      de twee algemene vakken die het profieldeel ingevolge [artikel 18, zesde lid, van de wet][ref1], omvat, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: 16.1.c
    text: 'een beroepsgericht programma, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
  - number: 16.1.c.1°
    text: |-
      het profielvak dat het profieldeel ingevolge [artikel 18, zesde lid, van de wet][ref1], omvat, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: 16.1.c.2°
    text: |-
      in het vrije deel vier beroepsgerichte keuzevakken, als bedoeld in
      [artikel 18, zevende lid, onderdeel a, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: '16.2'
    text: |-
      [Artikel 15, tweede lid][ref1], is van toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel15
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '15'
        hoofdstuk: II
  - number: '16.3'
    text: |-
      In geval van toepassing van [artikel 18, negende lid, onderdeel b, van de wet][ref1] dan wel artikel 18, negende
      lid, onderdeel d, van de wet juncto [artikel 25, tweede lid, van het Inrichtingsbesluit WVO BES][ref2], zijn het
      eerste en tweede lid van toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het
      vierde lid, kan dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel25
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '25'
  - number: '16.4'
    text: |-
      In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
  - number: 16.4.a
    text: |-
      een vak, genoemd in [artikel 18, zesde lid, van de wet][ref1], of een vak als bedoeld in artikel 18, zevende lid,
      onderdeel a, van de wet,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: 16.4.b
    text: een vak dat op grond van het tweede lid onderdeel kan zijn van de kaderberoepsgerichte leerweg,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
  - number: 16.4.c
    text: |-
      een algemeen vak dat behoort tot het eindexamen van de theoretische leerweg of de gemengde leerweg, genoemd in
      respectievelijk [artikel 16][ref1] of [artikel 29 van de wet][ref2], of


      [ref1]: https://wetten.overheid.nl/BWBR0028424#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0028424
        artikel: '16'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 16.4.d
    text: |-
      een vak als bedoeld in de [artikelen 39][ref1] of [40 van de wet][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '39'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '40'
  - number: '16.5'
    text: |-
      In afwijking van het eerste lid is de kandidaat die het eindexamen aflegt aan een school voor vmbo,
      voor zover het betreft de kaderberoepsgerichte leerweg, bij het eindexamen vrijgesteld van de vakken
      waarvoor ontheffing is verleend van het volgende van onderwijs in lichamelijke opvoeding op grond van
      [artikel 29, eerste lid, van het Inrichtingsbesluit WVO BES][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel16
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '29'
  - number: '17.1'
    text: |-
      Het eindexamen vmbo voor zover het betreft de gemengde leerweg, genoemd in [artikel 29 van de wet][ref1], omvat in
      elk geval:


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 17.1.a
    text: |-
      de vakken die het gemeenschappelijk deel ingevolge [artikel 29, vijfde lid, van de wet][ref1], omvat,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 17.1.b
    text: |-
      de twee algemene vakken die het profieldeel ingevolge [artikel 29, zesde lid, van de wet][ref1], omvat waaronder
      tevens begrepen een profielwerkstuk,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 17.1.c
    text: |-
      in het vrije deel een nog niet in het profieldeel gekozen algemeen vak, bedoeld onderscheidenlijk genoemd in
      [artikel 29, zevende lid, onderdelen a en c, van de wet][ref1], en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 17.1.d
    text: 'een beroepsgericht programma, bestaande uit:'
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
  - number: 17.1.d.1°
    text: |-
      het profielvak dat het profieldeel ingevolge [artikel 29, zesde lid, van de wet][ref1] omvat, en


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: 17.1.d.2°
    text: |-
      in het vrije deel twee beroepsgerichte keuzevakken als bedoeld in
      [artikel 29, zevende lid, onderdeel b, van de wet][ref1].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: '17.2'
    text: |-
      [Artikel 15, tweede lid][ref1], is van overeenkomstige toepassing.


      [ref1]: https://wetten.overheid.nl/BWBR0029990#Artikel15
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0029990
        artikel: '15'
        hoofdstuk: II
  - number: '17.3'
    text: |-
      In geval van toepassing van [artikel 29, negende lid, van de wet][ref1], zijn het eerste en tweede lid van
      toepassing, met dien verstande dat het vervangen vak niet als extra vak als bedoeld in het vierde lid, kan dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '29'
  - number: '17.4'
    text: |-
      In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen, een vak als bedoeld in [artikel 29, zevende lid, onderdelen a, b en c, van de wet][ref1], of als
      bedoeld in [artikel 39][ref2] of [40 van de wet][ref3].


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel39
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel40
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel17
    references:
      - id: ref1
