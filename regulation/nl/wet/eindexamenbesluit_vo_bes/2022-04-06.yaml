  - number: 15.1.c.2°
    text: |-
      in het vrije deel vier beroepsgerichte keuzevakken, als bedoeld in artikel 18, zevende lid, onderdeel a, van de
      wet.
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
  - number: '15.2'
    text: |-
      In afwijking van het eerste lid is de kandidaat met het profiel economie en ondernemen, het profiel horeca,
      bakkerij en recreatie, of met leerwegondersteunend onderwijs, ten aanzien van wie toepassing is gegeven aan
      [artikel 29, tweede of derde lid, van het Inrichtingsbesluit WVO BES][ref1], bij het eindexamen vrijgesteld van het
      vak Franse taal of het vak Spaanse taal. In plaats hiervan omvat het eindexamen één van de vakken gekozen op grond
      van [artikel 18, derde lid, van het Inrichtingsbesluit WVO BES][ref2].


      [ref1]: https://wetten.overheid.nl/BWBR0029589#Artikel29
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0029589
        artikel: '29'
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '18'
  - number: '15.3'
    text: |-
      Voor zover het betreft een leer-werktraject als bedoeld in [artikel 19 van de wet][ref1], omvat het eindexamen
      voor de leerling die dat traject heeft gevolgd, het vak Nederlandse taal en het beroepsgerichte programma dat
      onderdeel is van het leerwerktraject. Bovendien kan de leerling eindexamen afleggen in de andere vakken van de
      basisberoepsgerichte leerweg, bedoeld in [artikel 18 van de wet][ref2], waarvan het bevoegd gezag op grond van
      artikel 19, derde lid, van de wet in voorkomend geval heeft beslist dat zij behoren tot het leer-werktraject van
      de leerling.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel19
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '19'
      - id: ref2
        bwb_id: BWBR0030284
        artikel: '18'
  - number: '15.4'
    text: |-
      In geval van toepassing van [artikel 18, negende lid, onderdelen a en c, van de wet][ref1], dan wel artikel 18,
      negende lid, onderdeel d, van de wet juncto [artikel 25, tweede lid, van het Inrichtingsbesluit WVO BES][ref2],
      zijn het eerste tot en met het derde lid van toepassing, met dien verstande dat het vervangen vak niet als extra
      vak als bedoeld in het vijfde lid, kan dienen.


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref2]: https://wetten.overheid.nl/BWBR0029589#Artikel25
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
      - id: ref2
        bwb_id: BWBR0029589
        artikel: '25'
  - number: '15.5'
    text: |-
      In aanvulling op de voorgeschreven vakken, bedoeld in het eerste lid, kan het eindexamen omvatten, voor zover nog
      niet gekozen:
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
  - number: 15.5.a
    text: |-
      een vak, genoemd in [artikel 18, zesde lid, van de wet][ref1], of een vak als bedoeld in artikel 18, zevende lid,
      van de wet,


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel18
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
    references:
      - id: ref1
        bwb_id: BWBR0030284
        artikel: '18'
  - number: 15.5.b
    text: een vak dat op grond van het tweede lid onderdeel kan zijn van de basisberoepsgerichte leerweg,
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
  - number: 15.5.c
    text: |-
      een algemeen vak dat behoort tot het eindexamen van de theoretische leerweg, de kaderberoepsgerichte leerweg of de
      gemengde leerweg, genoemd in respectievelijk de [artikelen 16][ref1], [18][ref2] of [29 van de wet][ref3], of


      [ref1]: https://wetten.overheid.nl/BWBR0030284#Artikel16
      [ref2]: https://wetten.overheid.nl/BWBR0030284#Artikel18
      [ref3]: https://wetten.overheid.nl/BWBR0030284#Artikel29
    url: https://wetten.overheid.nl/BWBR0029990/2022-04-06#Artikel15
    references:
